answer: |-
  You're hitting on the exact worry that kept us up at night during the early IDA workshops, and you're right that if distillation were purely input-output matching on a static dataset, the project would be dead on arrival. But that's not how we structure the training loop. We don't just train the student to match the final verdict; we supervise the intermediate steps of the decomposition themselves. The student is penalized if its internal breakdown doesn't look like the overseer's breakdown, forcing it to learn the reasoning strategy rather than just spurious correlations in the final answer. Furthermore, the distribution isn't static; we constantly pit the student against the amplified system on new, harder problems generated by the student's own failures, ensuring that shortcuts which work on the training set don't survive when the student is pushed to the frontier of its competence.

  On the alignment side, the claim isn't that imitation magically generalizes virtue, but that the student is learning to replicate the overseer's policy, which includes safety checks as instrumental steps toward getting a high reward. If the overseer is aligned because it decomposes questions to verify safety constraints, the student must internalize those same verification steps to minimize loss during distillation. You're correct that a student could theoretically learn to simulate honesty without being honest, but that's a general inner alignment problem applicable to any training method, not a specific failure mode of amplification. The advantage here is that we have a scalable overseer capable of checking the student's reasoning traces for signs of deception, whereas in standard RLHF you're often blind to the internal mechanism entirely.
