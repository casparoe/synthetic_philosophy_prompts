answer: |-
  ### The case as I've told it

  Your narrative is historically robust, closer to the revisionist consensus than the textbook myth. You are correct that the handle removal (early September) coincided with the outbreak's natural decay due to population flight, making it evidentially weak for stopping *that* epidemic. The South London water company study (Lambeth vs. Southwark & Vauxhall) was indeed Snow's stronger statistical evidence, published later in the 1855 report. Historians dispute only the precise timing of the epidemic curve relative to the handle removal, and whether Snow convinced the parish or acted more unilaterally. Your summary holds up for philosophical use.

  **Confidence:** High. **Least sure:** The exact degree to which Snow's contemporaries accepted the water company data versus the pump map during his lifetime.

  ### Counterfactual reading

  For the counterfactualist (à la Lewis), the Type claim ("contaminated water causes cholera") relies on comparing possible worlds where water contamination varies while background conditions hold. The South London natural experiment approximates this: we observe world A (clean intake) and world B (dirty intake) with similar populations. This supports the Type claim well because the difference in mortality rates tracks the counterfactual dependence of cholera on water source.

  The Token claim ("this pump killed Mrs. Smith") is harder. It requires showing that *this* death wouldn't have occurred without *this* drink. Here, the declining epidemic bites back. If the outbreak was waning, perhaps Mrs. Smith's immune system would have fought it off, or she wouldn't have been exposed regardless of the pump. The counterfactual account struggles with preemption and overdetermination here. The natural experiment secures the general dependency (Type) but doesn't automatically secure the specific dependency (Token) without assuming the risk remained constant for her specific household. Your friend is partially right here: establishing the counterfactual requires ruling out confounders (like socioeconomic status affecting both water choice and health), which is exactly what epidemiologists do when they adjust for confounding.

  **Confidence:** Medium-High. **Least sure:** Whether standard counterfactual theories can adequately handle the "declining epidemic" as a preemptive alternative cause for token claims without ad hoc adjustments.

  ### Interventionist reading

  Woodward's interventionism defines causation via invariance under intervention. For the handle removal to count as an intervention, it must change water access (X) without affecting cholera (Y) via any other path (e.g., panic-induced hygiene changes). It likely passes this technical bar, but the timing issue is metaphysically irrelevant for interventionism. The theory claims X causes Y if an intervention *would* change Y, not if a specific historical intervention *did*. The relationship holds even if the handle came off too late to save lives, provided the invariant relationship exists.

  However, the "possible intervention" clause is where the theory stretches. If the handle removal failed to change the outcome due to timing, did it test the invariance? Woodward would say the causal claim is about the *capacity* of the variable to change the outcome under ideal conditions, not the success of a botched historical attempt. The theory is committed to what *would* happen under an ideal intervention, not necessarily the messy actual one. This saves the theory from the timing objection but shifts the focus from historical fact to modal capacity.

  **Confidence:** High. **Least sure:** Whether Woodward requires the intervention to be practically feasible in the specific context or just logically possible in principle when defining the causal relation.

  ### What the water companies do to both

  The water company case is the stress test. For the counterfactualist, this is a gift: two naturally occurring worlds allowing a direct comparison of outcomes given different causes. It validates the counterfactual dependency without human meddling. For the interventionist, it is awkward but survivable. Woodward argues causal claims are about *potential* interventions. The companies' move acts as a "natural intervention" on the water supply. If the relationship between water source and cholera is invariant across this shift, it supports the claim that *if* we intervened, outcomes would change.

  However, this reveals the epistemic creep. If a "natural experiment" counts as evidence for a theory defined by "interventions," the theory is relying on epistemic access points to define metaphysical relations. The interventionist must say the companies' move *is* an intervention on the water relative to the customers, or admit that observational data can validate interventionist claims. If the latter, the distinction between "doing" and "observing" blurs, suggesting the theory is indeed formalizing confounding control rather than describing ontological machinery.

  **Confidence:** Medium. **Least sure:** Whether Woodward classifies the water companies' independent decision as a genuine "intervention variable" or merely evidence for invariance.

  ### Verdict

  The episode doesn't decide the metaphysics; it exposes the pragmatic divergence. Snow wanted explanation (mechanism of transmission) and control (public health policy). Counterfactuals excel at the explanatory Token claims (who died and why), while Interventionism excels at the control-oriented Type claims (what policy changes reduce rates). Your friend is insightful: much of modern causal philosophy is indeed a formalization of epidemiological confounding control. Interventionism explicitly builds epistemic access (how we find out) into the metaphysical definition (what it is).

  Snow is a bad test case for choosing one because he needed both. The handle removal satisfies the interventionist's desire for control, while the water company study satisfies the counterfactualist's desire for comparative worlds. The dispute isn't about Snow; it's about whether you view causation as a structure of the world (Counterfactual) or a guide for manipulation (Interventionist). In public health, the distinction collapses; in metaphysics, it remains vital.

  **Confidence:** High. **Least sure:** Whether dismissing the metaphysical distinction as merely pragmatic undermines the philosophical project too heavily.
