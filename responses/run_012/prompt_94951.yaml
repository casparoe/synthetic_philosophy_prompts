answer: |-
  You are observing the **Kalai-Smorodinsky bargaining solution**, not the more standard Nash bargaining solution.

  Here is the breakdown of why this is the rule you are seeing, how it differs from its rivals, where it breaks, and whether your intuition about tax and inheritance holds water.

  ### The Candidate Rules and Elimination
  To identify this, we have to look at the three axioms that usually define bargaining solutions. There are three main candidates in cooperative game theory:

  1.  **The Egalitarian Solution:** This splits the surplus so both parties gain the exact same absolute amount over their walk-away. You explicitly ruled this out ("Not equal dollars").
  2.  **The Nash Bargaining Solution (NBS):** This maximizes the *product* of the gains ($Gain_A \times Gain_B$). It is the industry standard in economics. However, it satisfies an axiom called **Independence of Irrelevant Alternatives (IIA)**. This means if you add a new option to the menu that neither party chooses, the settlement *cannot change*. Your third observation—that a new option shifts the split even if unused—directly violates IIA. Therefore, it cannot be Nash.
  3.  **The Kalai-Smorodinsky (KS) Solution:** This solution equalizes the ratio of actual gain to maximum possible gain. If $d$ is the walk-away (disagreement point) and $u^*$ is the best possible outcome each side could hope for (the "ask" or utopia point), KS finds the deal where:
      $$ \frac{Deal_A - d_A}{u^*_A - d_A} = \frac{Deal_B - d_B}{u^*_B - d_B} $$
      This matches your "equal fraction of what you wanted" observation. Crucially, KS satisfies **Monotonicity** instead of IIA. If the feasible set expands such that one party's maximum possible outcome ($u^*$) increases, their share of the surplus *must* increase, even if the new option isn't selected. This matches your third observation perfectly.

  ### Why Your Observations Fit Kalai-Smorodinsky
  Your three notices map directly to the mathematical properties of KS:

  1.  **Extravagant Asks Pay Off:** In KS, the settlement is determined by the line connecting the walk-away point to the "utopia point" (the vector of maximum asks). If Party A inflates their ask ($u^*_A$), the utopia point shifts in their favor, rotating the line and intersecting the Pareto frontier at a point that gives A more absolute value. KS is vulnerable to "utopia inflation," which is exactly the strategic behavior you are clocking.
  2.  **The Walk-Away Anchor:** Like all modern bargaining solutions, KS measures gains from the disagreement point ($d$), not from zero. If Party B can credibly threaten to make Party A's walk-away worse (lowering $d_A$), the denominator of A's ratio shrinks, or the starting point shifts, altering the proportional split.
  3.  **The Irrelevant Option:** This is the diagnostic test. In Nash bargaining, only the local shape of the utility frontier at the solution matters. In KS, the *corners* of the feasible set matter. If a new option appears that raises Party A's maximum possible utility (even if neither party wants that option specifically), the "utopia point" moves. The proportional line rotates, and the settlement shifts. This is the violation of IIA that defines KS.

  ### Where the Rule Breaks (The Edges)
  While KS describes your mediated settlements well, it has known failures in theory that you likely encounter as "edge cases" where the logic feels unfair:

  *   **Non-Convex Sets:** KS assumes the set of possible deals is convex (you can mix and match deals smoothly). In complex commercial disputes involving indivisible assets (e.g., who gets the factory vs. who gets the IP), the frontier is jagged. KS can spit out a solution that is technically inefficient or unstable because the proportional line skips over the jagged bits.
  *   **Strategic Bluffing:** Because KS rewards a higher "ask" (utopia point), it incentivizes parties to anchor absurdly high. In theory, if both sides inflate their asks to infinity, the solution becomes undefined. In your practice, this manifests as negotiations stalling because the "proportional" split based on unrealistic asks leaves no surplus to divide.
  *   **Risk Aversion:** KS assumes utility is linear or comparable in a specific way. If one party is deeply risk-averse and the other is risk-neutral, the "fraction of ask" metric distorts. A risk-averse party might accept a lower proportion of their ask just to secure certainty, breaking the KS prediction.

  ### The Inheritance and Tax Connection
  You are not overreaching; the same proportional logic underpins those domains, though it goes by different names.

  *   **Taxation:** This is the **Equal Sacrifice Principle** (championed by J.S. Mill and Edgeworth). It argues taxes should be levied so that each taxpayer suffers an equal *proportion* of utility loss, not an equal dollar amount. Just as KS equalizes the proportion of gain from the walk-away, Equal Sacrifice equalizes the proportion of loss from pre-tax income. This is the normative counterpart to your descriptive observation.
  *   **Inheritance:** In family business splits, strict equality (50/50) often fails because heirs have different "expectations" or "needs" (their utopia points). Courts and mediators often drift toward proportional splits based on contribution or expectation, which is effectively a KS calculation where the "ask" is defined by historical role or perceived entitlement rather than a negotiation anchor.

  ### What Would Change My Mind
  I am confident this is Kalai-Smorodinsky, but I would retract this if:

  1.  **The "New Option" Changes the BATNA, Not the Utopia:** If the new option you described actually improves one party's walk-away position ($d$) rather than their maximum possible gain ($u^*$), then Nash bargaining also predicts a shift. If you find that settlements move when *only* the worst-case scenario changes (not the best-case), then Nash is still in the running.
  2.  **Utility is Non-Linear:** If your parties are not measuring "fraction of ask" in utility terms but in dollar terms, KS might be a heuristic overlay on a Nash solution distorted by risk aversion. If the "ask" is just a number on a spreadsheet but the real utility curve is logarithmic, the proportional dollar split might actually be an equal utility split (Nash) masquerading as KS.
  3.  **Focal Points Dominate:** If the settlements cluster around round numbers or industry standards (e.g., "always 60/40 in this sector") regardless of the specific asks or new options, then you are observing **Schelling Focal Points**, not an axiomatic bargaining solution. KS predicts continuous movement as asks change; if you see rigid clustering despite changing asks, the theory fails.

  Your instinct is correct: you are mediating via Kalai-Smorodinsky logic. The danger is that by allowing the "ask" to dictate the proportion, you are implicitly rewarding the party most willing to anchor unrealistically, which is the primary critique of KS in the literature.
