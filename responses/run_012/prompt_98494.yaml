answer: |-
  You are absolutely right to be suspicious of the lazy pairing. If you run a session where you just say, "Look, multiverse movie, look, multiverse philosopher," you will have bored your group to tears and done a disservice to both the film and the metaphysician. David Lewis is not a setup for *Everything Everywhere All at Once*; he is the antagonist. The film is not an illustration of modal realism; it is a dramatization of what it would feel like to live in a Lewisian universe, followed by a violent, emotional rejection of its consequences.

  Here is the reading you need for your meetup. It hinges on the tension between Lewis's cold ontology and the film's warm ethics.

  ### The Engine of the Plot: Causal Interaction vs. Spatiotemporal Isolation

  Start with the mechanic that drives the entire narrative: verse-jumping. For Lewis, a "world" is defined by spatiotemporal isolation. Nothing in world A can causally affect anything in world B. If they could interact, they would just be parts of one big world. Lewis's multiverse is an archipelago of isolated islands; there are no bridges, no boats, no radio signals.

  *Everything Everywhere All at Once* violates this immediately. The entire plot is built on causal traffic between worlds. Evelyn borrows kung fu skills from a counterpart; she brings a hot dog from one universe to another; she carries the emotional trauma of the Alpha universe into the Prime universe.

  **Where the film resists Lewis:** If Lewis is right, the movie is impossible. The moment Evelyn pops her ear and accesses the skills of the movie star Evelyn, she has collapsed the distinction between worlds. On Lewis's account, this isn't "multiverse travel"; it's evidence that there is only one world with very strange local physics. But the film insists these are separate lives. This creates a genuine metaphysical horror that Lewis ignores: if worlds can interact, the isolation that protects me from the consequences of other possibilities vanishes. In the film, my regrets can literally come alive and hunt me down. Lewis's isolation is a safety feature; the film removes it to raise the stakes.

  ### Identity: Counterparts vs. Trans-World Self

  This is the sharpest point of conflict. Lewis's Counterpart Theory is designed to save us from the absurdity of having contradictory properties. I am sitting here; I cannot also be standing there. So, Lewis says, there is a *counterpart* of me standing there. He is similar to me, but he is not *me*. I have no trans-world identity.

  The film flatly rejects this. When Evelyn accesses the Hot Dog Fingers universe, she isn't consulting a counterpart; she is experiencing a life she *did* live. The emotional core of the film relies on Trans-World Identity. Joy is not just a counterpart of Jobu Tupaki; she *is* Jobu Tupaki. If they were merely counterparts, Evelyn's struggle to save her daughter would be nonsensical. You don't save your counterpart's daughter; you save *your* daughter.

  **Scene to watch: The Hot Dog Fingers Universe.**
  When Evelyn and Waymond are in the universe where people have hot dogs for fingers, the film asks us to accept that this is a valid life for *them*. Lewis would say, "No, those are counterparts with different biological properties." The film says, "No, that is also you." This validates the human intuition of regret in a way Lewis forbids. Lewis tells us we shouldn't regret not being a rock star because that guy isn't us. The film says, "He *is* us, and look how miserable he is, or look how happy he is, and feel that weight." The film weaponizes trans-world identity to make regret tangible.

  ### The Rock World: The Limit of Concreteness

  You mentioned the rocks. This is actually the most Lewisian scene in the movie, and it's where the film dramatizes the ontology best.

  Lewis argues that possible worlds are concrete. They aren't abstract stories; they are flesh and stone. The rock universe validates this. There are no humans, no dialogue, just two rocks on a cliff. They are concrete entities. They exist.

  **Scene to watch: The Rock Universe.**
  Here, the film captures the sheer silence of Lewis's plurality. These worlds are real, but they are isolated. The subtitles appearing on the screen are a cinematic cheat that Lewis wouldn't allow—communication across the void. But the visual of the two rocks staring at each other for eons captures the loneliness of modal realism. If every possibility is realized, most of them are empty, silent, and devoid of meaning. The film shows us the beauty of that existence (the "doing nothing" as a skill) but ultimately rejects it as a place to live. It acknowledges the reality of the barren worlds without accepting them as homes.

  ### The Everything Bagel: The Nihilism of Total Actuality

  Jobu Tupaki is the character who has seen the whole Lewisian plurality. She has experienced all worlds at once. And what is her conclusion? Nihilism. The Everything Bagel.

  If Lewis is right, and every world is equally real, then "actual" is just an indexical term like "here." There is nothing metaphysically special about our world. Jobu takes this to its logical emotional conclusion: if everything is real, nothing matters. If every choice is made somewhere, then choice is an illusion. The Bagel is a black hole of meaning created by the weight of infinite concrete realities.

  **Where the film fights Lewis:** Lewis is comfortable with this. He thinks truth conditions are preserved even if all worlds are real. The film argues that this ontology is psychologically unsustainable for human beings. We cannot live as if all worlds are equally real. We *need* the illusion of privilege for our own world to function. Jobu is the warning: if you truly internalize modal realism, you eat the bagel.

  ### The Ending: Smuggling in Privilege

  This brings you to the parking lot. You asked if the film smuggles in a privilege for actuality that Lewis denies. The answer is yes, but it does so ethically rather than metaphysically.

  Lewis says we privilege our world because we are in it. It's a self-centered indexicality. I care about this world because I am *here*.
  Evelyn privileges this world because she *chooses* it.

  **Scene to watch: The Parking Lot.**
  Waymond says, "In another life, I would have really liked just doing laundry and taxes with you." He acknowledges the counterparts. He acknowledges the other possibilities. But he chooses *this* one. He chooses the struggle of *this* marriage over the perfection of the movie star marriage or the simplicity of the rock life.

  The film argues that "Actual" shouldn't just be an indexical label; it should be a moral achievement. Lewis says the actual world is not special. The film says, "It becomes special because we tend to it." When Evelyn puts the googly eyes on the IRS auditor, she is not acknowledging that the auditor is real in other worlds; she is acknowledging that *this* auditor, in *this* world, can be changed.

  The film contradicts Lewis by suggesting that the isolation of worlds is not a brute fact, but a barrier to be overcome by empathy, and that the "Actual" is not where we happen to stand, but where we decide to plant our feet. It smuggles in privilege, yes, but it justifies it through love. Lewis would call this confusion. The film calls it maturity.

  ### What the Movie Gets At That the Papers Don't

  Finish your meetup with this. David Lewis wrote *On the Plurality of Worlds* to solve problems about truth, modality, and semantics. He wanted to know how statements like "I could have been a firefighter" can be true. He succeeded. He gave us a logical framework where that statement has a truth value.

  *Everything Everywhere All at Once* asks a different question: "How do I live with the fact that I could have been a firefighter?"

  Metaphysics papers deal with the architecture of reality. They don't deal with the grief of the unchosen path. Lewis's system is static; the worlds just are. The film is dynamic; the multiverse is a landscape of regret, trauma, and hope.

  The movie gets at the **phenomenology of possibility**. It shows that for a human being, possible worlds are not abstract logical constructs or distant concrete universes; they are ghosts. They are the versions of ourselves that haunt our sleep. Lewis gives you a map of the multiverse that is accurate but cold. The movie gives you a reason to stay in the car.

  Lewis tells us that every world is equally real. The film tells us that only the world we treat with kindness becomes real enough to matter. That is the anti-Lewisian punchline: Reality isn't a given; it's a practice.
