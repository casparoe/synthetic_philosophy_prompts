          *   *Scene:* The ear-popping/verse-jumping mechanics. This isn't discovering other worlds; it's collapsing the isolation condition.

      *   **Identity vs. Counterparts:**
          *   *Lewis:* I have counterparts, not other selves. I don't inherit their properties.
          *   *Film:* Evelyn *becomes* Kung Fu Evelyn. She *is* Movie Star Evelyn.
          *   *Analysis:* The film relies on Trans-World Identity. This is the anti-Lewis move. It allows for moral responsibility across worlds (saving Joy).
          *   *Scene:* The Hot Dog Fingers universe. Evelyn isn't just looking at a counterpart; she's experiencing a life she *could have lived* as if it were hers. This validates regret in a way Lewis forbids (you can't regret not being a counterpart, you just aren't them).

      *   **The Rock World (The Limit Case):**
          *   *Lewis:* Every consistent possibility is a world. Even simple ones.
          *   *Film:* Two rocks with googly eyes.
          *   *Analysis:* This is the most Lewisian scene. Concrete, existent, silent. But even here, they communicate. Lewis says worlds are isolated; the rocks find a way to signal across the void (subtitles). It dramatizes the loneliness of isolation while refusing to accept it.

      *   **The Everything Bagel vs. Modal Realism:**
          *   *Jobu Tupaki:* Sees all worlds at once. Nihilism. If everything is real, nothing matters.
          *   *Lewis:* If all worlds are real, "actual" isn't special.
          *   *Connection:* Jobu is the logical endpoint of modal realism without indexical grounding. If you see the whole plurality, you lose the "here."
          *   *Scene:* The Bagel. It's the black hole of meaning. It consumes the distinction that makes choice possible.

      *   **The Ending (The Privilege of Actual):**
          *   *Lewis:* "Actual" is indexical. We privilege ours because we are in it.
          *   *Film:* Evelyn chooses *this* one. Not just because she's in it, but because it has *value*.
          *   *Analysis:* Lewis says no world is metaphysically special. The film argues this world is *ethically* special because it's the one we can affect.
          *   *Scene:* The Parking Lot. Waymond's speech. "In another life, I would have really liked just doing laundry and taxes with you." This acknowledges counterparts but chooses *this* relationship.
          *   *Contradiction:* Lewis says the other Waymond is just as real. The film says *this* Waymond matters more because he is *here*. The film smuggles in a metaphysical privilege for the actual, but justifies it through love, not ontology.

      *   **Conclusion (What the Film Does):**
