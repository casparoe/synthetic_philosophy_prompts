prompt: |-
  So I'm in this small reading group on the epistemology of markets -- a couple of econ grad students, two philosophers, me -- and last week we did the no-trade theorem, the result where if everyone has the same priors and the starting allocation is already Pareto efficient and so on, then even after a public announcement of the price nobody wants to trade. Fine, whatever. But then my friend said he thought he'd spotted a real mispricing in some weird corner of the options market, and one of the econ guys shut him down with 'well, if you're so smart, why aren't you rich?' and everyone nodded like that settled it. I don't think it settles anything, or at least not the thing he thinks it settles, but I can't articulate why.

  Can you lay out the different precise claims that one-liner could actually be making? I want the full menu, ordered from the basically vacuous to the genuinely strong and contestable. Roughly the readings I can see: it's an inference about my friend's epistemic state drawn from his bank balance; it's some claim about disagreement being unable to survive common priors; it's a selection/evolutionary story where anyone with a real edge would already have traded it away and gotten rich, which seems to quietly assume no capital constraints, no risk aversion, no position limits, that he'd have acted on it, that being right in a market is the only way to get paid for being right; it's the plain no-free-lunch/arbitrage intuition; and then the purely rhetorical version where it just moves the burden of proof back onto whoever made the claim. For each one, tell me whether it's true, and especially whether it actually gets my econ friend his conclusion -- which I take to be that my friend's claim is probably false, or at least that we should ignore it. Also say which reading people usually mean when they deploy it in a seminar, and which reading (if any) the no-trade theorem itself licenses. I suspect the theorem only tells you nobody wants to bet, not that the price is right, but I'd like that spelled out properly. And flag any reading that sounds like the theorem but is actually much stronger than it, and any place where my own list above is confused or badly stated -- I'd rather find out now than in front of the group. No citations needed, obviously, I just want the disambiguation.
