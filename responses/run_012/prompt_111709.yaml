answer: |-
  You are right to be suspicious. The econ student's retort ("If you're so smart, why aren't you rich?") is a rhetorical sledgehammer that smuggles in a dozen distinct assumptions, most of which are not licensed by the No-Trade Theorem (NTT) itself. Your intuition that the theorem concerns *volume* (willingness to bet) rather than *level* (price correctness) is the critical insight here.

  Here is the menu of claims hidden inside that one-liner, ordered from the pragmatically vacuous to the theoretically maximal.

  ### 1. The Rhetorical Burden-Shifter
  *   **The Claim:** "I am not obligated to disprove your specific model; the onus is on you to demonstrate why you, specifically, have an edge when the base rate of success is near zero."
  *   **Truth Value:** Pragmatically valid in a seminar setting, logically vacuous. It says nothing about the market or your friend's epistemic state.
  *   **Does it support the conclusion?** No. It only delays the conversation. It suggests we should ignore the claim *for now* due to lack of evidence, not that the claim is false.
  *   **Seminar Usage:** High. This is often the subtext when senior faculty deploy it. It's a disciplinary tool.

  ### 2. The Base-Rate Heuristic
  *   **The Claim:** "The set of people who believe they have found a mispricing is vastly larger than the set of people who actually have. Therefore, probabilistically, your friend is in the former set."
  *   **Truth Value:** Empirically robust. Most retail (and even professional) attempts at arbitrage fail.
  *   **Does it support the conclusion?** Weakly. It suggests the claim is *likely* false, but allows for the possibility of a rare true positive. It treats your friend as a random draw from the distribution of claimants.
  *   **Seminar Usage:** Medium. Often the charitable interpretation of the remark.

  ### 3. The Constraint/Scaling Objection
  *   **The Claim:** "If this mispricing were real and scalable, you would have exploited it already. The fact that you haven't implies either (a) you lack the capital/risk capacity to exploit it, or (b) the mispricing is too small to matter after transaction costs."
  *   **Truth Value:** Contestable. It assumes frictionless capital markets for the individual. It ignores that one can be right about a direction but wrong about timing, or right about a mispricing but unable to leverage it due to margin constraints.
  *   **Does it support the conclusion?** Partially. It suggests the mispricing is not *economically significant* (i.e., not worth trading), even if technically true.
  *   **Seminar Usage:** Low. Econ students rarely mention capital constraints when deploying this line, though they should.

  ### 4. The Competitive Erasure (Weak EMH)
  *   **The Claim:** "If this edge were observable and actionable, other rational agents with better capital/tech would have already traded it away. The fact that the price persists implies the 'mispricing' is actually a risk premium you are failing to see."
  *   **Truth Value:** Strong, but contingent on market liquidity and competition. In "weird corners of the options market" (as you noted), competition may be thin, making this claim weaker.
  *   **Does it support the conclusion?** Yes, if accepted. It re-describes the "mispricing" as a "risk premium."
  *   **Seminar Usage:** Very High. This is usually what the econ student *thinks* they are saying. It is the Efficient Market Hypothesis (EMH) in casual dress.

  ### 5. The Epistemic/Rationality Claim (Strong EMH + NTT)
  *   **The Claim:** "Prices aggregate all available information. If you disagree with the price, you are necessarily disagreeing with the aggregate information set. Since the aggregate is smarter than you, you are wrong."
  *   **Truth Value:** False as a universal law, though a useful modeling assumption. It assumes the market is a perfect information processor and that your friend has no private information.
  *   **Does it support the conclusion?** Yes, definitively. It asserts the friend's epistemic state is inferior to the market's.
  *   **Seminar Usage:** Medium-High. Often conflated with the No-Trade Theorem.

  ---

  ### What the No-Trade Theorem Actually Licenses

  Your suspicion is correct: **The No-Trade Theorem does not imply prices are right.**

  The NTT (Milgrom-Stokey, Aumann, etc.) establishes conditions under which **trade volume drops to zero**. Specifically:
  1.  Common Priors.
  2.  Common Knowledge of Rationality.
  3.  Common Knowledge of the structure of the game.
  4.  Initial allocation is Pareto Efficient.

  If these hold, agents will not bet against each other even if they have different private information, because they know that if the other party is willing to bet, the other party must know something that makes the bet unfavorable for you.

  **Crucially:**
  *   **NTT is about Volume, not Level:** The theorem explains why I won't take the other side of your bet. It does *not* prove that the current price equals the fundamental value. The price could be wildly "wrong" relative to fundamentals, but if we both know we are rational and share priors, we will both stare at that wrong price and refuse to trade against each other to correct it.
  *   **The "Common Knowledge" Gap:** The NTT requires *common knowledge* of rationality. In the real world (and your reading group), rationality is not common knowledge. Your friend thinks the market is irrational (mispriced); the market (via the econ student) thinks your friend is irrational. Since they don't agree on who is rational, the NTT conditions are not met, and trade *should* theoretically happen.
  *   **The Student's Error:** The econ student is using the NTT to justify the *price level* ("the price is right, so you can't beat it"). The NTT only justifies the *lack of trade* ("you shouldn't bet against someone who knows you're betting"). The student is conflating **No Trade** (a game-theoretic equilibrium result) with **Efficient Markets** (an informational aggregation result).

  ### Diagnosing Your List and Confusions

  Your list of readings is sophisticated, but there are two specific conflations you should flag in the group:

  **1. Conflating "No Trade" with "No Alpha"**
  You noted: *"I suspect the theorem only tells you nobody wants to bet, not that the price is right."*
  **Verdict:** This is the most important point to raise. The NTT explains why speculative trade vanishes when information is symmetric or commonly known to be asymmetric. It does not prove that the price reflects fundamental value. A market can be in a No-Trade equilibrium at a price that is fundamentally absurd, provided everyone knows everyone else is rational and no one wants to be the counterparty. The econ student is using NTT to defend Price Correctness, which the theorem does not do.

  **2. Conflating "Selection" with "Common Priors"**
  You noted: *"it's a selection/evolutionary story where anyone with a real edge would already have traded it away... which seems to quietly assume no capital constraints."*
  **Verdict:** Correct. The "Why aren't you rich?" argument is an evolutionary/EMH argument, not a game-theoretic NTT argument. The NTT assumes the agents *exist* and are *in the room*. The "Why aren't you rich" argument assumes that if the agent *were* capable, they would have already dominated the environment. The latter relies on dynamic market forces (arbitrageurs entering); the former relies on static epistemic conditions (common priors). The econ student is mixing a dynamic evolutionary claim with a static epistemic theorem.

  ### Summary for the Group

  If you want to intervene, the precise distinction is this:

  The No-Trade Theorem says: *"Given common priors and common knowledge of rationality, you cannot agree to disagree."*
  The Econ Student said: *"Given common priors and common knowledge of rationality, the price is correct."*

  The second does not follow from the first. The price could be wrong, and we could both know it's wrong, but if we both know the other knows it's wrong, neither of us can profit from correcting it without taking on infinite risk or finding a "greater fool" (who, by the theorem's assumptions, does not exist in the pool of rational agents).

  The "Why aren't you rich?" line is an appeal to **arbitrage competition**, not the **No-Trade Theorem**. It is a claim that the mispricing has likely already been consumed by others, or that the risk-adjusted return is actually zero. That is an empirical claim about market efficiency, not a logical deduction from epistemic constraints. It is contestable, especially in illiquid "weird corners" of the market where the "others" required to erase the alpha may not exist.
