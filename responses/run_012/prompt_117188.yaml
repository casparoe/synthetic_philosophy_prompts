answer: |-
  **Essay Question**

  **1.** In his general theory of penal law, Bentham argues that punishment is justified not only by direct harm (primary mischief) but also by the "secondary mischief" of an act, such as the public alarm it causes or the danger that the practice will spread. However, in his unpublished writings on sexual offences, Bentham argues for the decriminalization of consensual acts (including sodomy) on the grounds that they are harmless.

  Critically evaluate whether Bentham's argument for decriminalization is a consistent application of his utilitarianism or a departure from it. Your answer should:
  (a) Reconstruct the utilitarian case against punishing consensual sexual acts that cause no direct pain to others.
  (b) Explain how the objection from "unnaturalness" is supposed to work and summarize Bentham's response to it.
  (c) Evaluate whether Bentham's handling of "secondary mischief" (public disgust, weakening of moral sanctions, fear of spread) in sexual cases is consistent with how he treats secondary mischief elsewhere in his penal theory.

  In your conclusion, consider whether Bentham's appeal to "the general happiness" in this context secretly relies on a background conception of what is natural or fitting in human life, which his utilitarianism officially disowns.

  ***

  **Model Answer**

  Bentham's general penal theory posits that punishment is an evil in itself, justified only if it prevents greater pain. Typically, this includes "secondary mischief": the alarm caused to the community or the risk that a harmful practice will be imitated. In his writings on sexual morality, however, Bentham attempts to shield consensual sexual acts from this logic.

  (a) The core utilitarian case for decriminalization rests on the absence of primary mischief. If an act is consensual and secret, it produces pleasure for the participants and no direct pain for non-participants. Since punishment inflicts pain, applying it here creates a net loss of utility. Bentham argues that without an assignable victim suffering tangible harm, the state has no utilitarian warrant to intervene. The pleasure gained is real; the pain of punishment is certain.

  (b) Critics argue such acts are "unnatural," implying intrinsic wrongness regardless of consequences. Bentham dismantles this by asking what "natural" means. If it means "physical impossibility," no human act is unnatural. If it means "statistically rare," rarity does not equal badness. If it means "contrary to God's will," Bentham rejects theological premises in secular law. He insists that "unnatural" is merely a label for "unusual," and unusual pleasures are still pleasures. To ban them based on linguistic confusion is to prioritize prejudice over calculation.

  (c) The critical tension lies in secondary mischief. In his penal theory, Bentham usually accepts that public alarm is a real pain that justifies punishment, even if the alarm is based on misunderstanding. Yet, regarding sex, he dismisses public disgust as "prejudice" that should not count toward the utility calculus. He argues that educating the public to remove the alarm is better than punishing the act. This is a potential inconsistency. Elsewhere, Bentham accommodates popular prejudice to maintain order; here, he demands society change its prejudices to accommodate the act. If the "danger of spread" is a valid reason to punish theft, why is it not valid for sex? Bentham tries to wave this away by claiming the acts won't spread via imitation, but this relies on a specific empirical claim that contradicts his usual caution about human behavior.

  This suggests Bentham may be relying on a hidden normative assumption: that sexual liberty is part of the "general happiness" in a way that theft is not. By defining the alarm caused by sex as "irrational" (and thus dismissible) while treating alarm about property as "rational" (and thus binding), he may be smuggling in a conception of which desires are fitting for human life. His utilitarianism claims to be neutral on the good, but here it seems to presuppose a liberal conception of personal sovereignty that limits what counts as valid "mischief."

  **Scholarly Consensus and Contestation**
  It is settled among scholars that Bentham was remarkably liberal for his time and that he explicitly rejected religious justifications for sodomy laws. However, it is genuinely contested whether his dismissal of secondary mischief in sexual cases is consistent with his broader legal theory. Some scholars argue Bentham is applying a refined "enlightened" utilitarianism that filters out irrational pains. Others argue this is an ad hoc adjustment to protect his own preferences, revealing a limit to utilitarian neutrality. There is no consensus on whether this represents a flaw in his system or a necessary refinement.

  ***

  **Marking Scheme (Total: 20 Points)**

  | Criterion | A Range (16–20) | B Range (12–15) | Common Pitfall (One-line note) |
  | :--- | :--- | :--- | :--- |
  | **1. Primary Mischief & Utility (5 pts)** | Clearly articulates the pleasure/pain calculus and the absence of an assignable victim as the basis for decriminalization. | States that Bentham thought sex was harmless but fails to link this explicitly to the punishment-as-evil framework. | *Students often forget to mention that punishment itself is a pain that needs justifying.* |
  | **2. The 'Unnatural' Objection (5 pts)** | Explains the ambiguity of "natural" and details Bentham's linguistic/empirical rebuttal without relying on rights-talk. | Summarizes Bentham's rejection of "unnatural" but treats it as a moral claim rather than a semantic/empirical one. | *Candidates frequently attribute modern "rights" language to Bentham instead of his semantic analysis.* |
  | **3. Secondary Mischief Consistency (5 pts)** | Identifies the tension: Bentham usually accepts alarm as pain, but here dismisses it as prejudice; evaluates this as a potential inconsistency. | Describes the secondary mischief argument but accepts Bentham's dismissal of it without questioning the theoretical consistency. | *Most B answers simply report Bentham's view on alarm without noting it contradicts his penal theory elsewhere.* |
  | **4. Normative Assumptions & Scholarship (5 pts)** | Addresses the "twist": analyzes if Bentham relies on a hidden conception of the "fitting"; accurately distinguishes settled vs. contested scholarly ground. | Mentions the "natural" twist vaguely or treats the scholarly debate as settled fact (e.g., "Scholars agree he was consistent"). | *Students often present the scholarly contestation section as a definitive fact rather than an ongoing debate.* |

  **Grading Notes:**
  *   **A Grade:** Must explicitly argue that dismissing secondary mischief in sex cases but not property cases implies a normative hierarchy of pleasures, not just an empirical calculation.
  *   **B Grade:** Will successfully explain Bentham's position but will treat the secondary mischief issue as a straightforward empirical claim rather than a theoretical tension.
  *   **Fail/Pass Boundary:** A pass requires at least a basic reconstruction of the harm principle; a fail usually conflates Bentham with Mill.
