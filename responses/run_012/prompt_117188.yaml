  I'm putting together the final exam for my upper-level seminar on utilitarianism and its critics, and I want one essay question on Bentham's sexual morality that can't be answered by just saying "he was ahead of his time" or "he thought consent mattered." The question should force students to confront the tension between Bentham's general theory of penal law -- where secondary mischief like alarm and the danger of the practice spreading is a major justification for punishment -- and his specific arguments in the unpublished writings on sexual offences, where he treats the act itself as harmless and tries to wave away the secondary mischief. I want them to see that the interesting question isn't whether Bentham was liberal on sex (he was, for his time) but whether his argument for decriminalization is a straightforward application of his utilitarianism or a place where he quietly changes the rules. Specifically, I'd like the question to ask them to (a) reconstruct the utilitarian case against punishing consensual sexual acts that cause no direct pain to others, (b) explain how the "unnatural" objection is supposed to work and what Bentham says about it, and (c) evaluate whether his handling of the secondary mischief -- public disgust, the weakening of moral sanctions, the fear that the practice will spread -- is consistent with how he treats secondary mischief elsewhere in his penal theory. The twist is that I want them to consider whether Bentham's own appeal to "the general happiness" ends up relying on a background conception of what is natural or fitting in human life, which his utilitarianism officially disowns.

  Please write the essay question itself, a model answer of about 600 words, and a marking scheme out of 20 that seperates an A from a B by naming the specific moves each must contain -- e.g., an A answer must say why the secondary mischief argument is not just a empirical prediction but a normative one about the kind of society we want, while a B answer will just say "Bentham thought it was harmless." I also want the model answer to include a short section at the end that says which parts of this are settled among Bentham scholars and which are genuinely contested -- I don't want students to think there's a consensus on whether his sexual morality is fully consistent with his penal theory, because there isn't. And for the marking scheme, give a one-line note on how candidates typically get each point wrong. I'm aiming for a 60-minute exam question, so the model answer should be doable in that time if you know the material. Oh, and if any part of this depends on a specific text or date, just paraphrase it rather than quoting, since I don't want to deal with citation issues in the prompt itself.
