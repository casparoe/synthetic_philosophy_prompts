prompt: |-
  I am a novelist, and I am at work on a book about two economists who were once friends. One of them built internal prediction markets for companies and agencies and believes that a market is an instrument of discovery — a machine for finding out what no one in particular knew. The other came out of the rational-expectations tradition and holds that a price can only ever encode what the participants already brought to it, so that the look of discovery is either an illusion or a description of something else. Their quarrel is the engine of the plot, and the last chapter turns on a document they sign together. I would like you to write that document for me: the joint statement of an adversarial collaboration, the sort of text two honest adversaries could put their names to without either becoming a strawman.

  The dispute I need reduced to exact form is whether a market produces knowledge or merely displays it. Both characters know the no-trade results; both know that speculative trade happens daily on an enormous scale; each regards the other's position as nearly unfalsifiable. The document is meant for readers of a novel rather than for referees, so it must stand on its own arguments: no citations, no appeals to what the literature supposedly shows, and no formulations that one side would accept only because the other has been made to sound foolish.

  Please hold apart three claims that this argument habitually runs together: that a price encodes dispersed information; that trade generates information no participant had; and that a market's existence can make the priced proposition true. I also want the document to face the dilemma I suspect lies under the whole quarrel: the no-trade results seem to require the traders to be alike in some relevant respect — a shared prior, an already-efficient starting point, common knowledge of how information is acquired — while the discovery picture seems to require traders who genuinely differ. If the price is an average of incompatible models, there may be nothing for it to be an average of. Say what the result actually needs, and whether the discovery view survives the answer.

  The document should contain the claims both can sign, each doing some work rather than conceding nothing; the residual disagreements, each stated twice, once in wording its own side would accept; the cruxes, meaning the sub-questions such that settling one would move at least one side; and for each crux the case, argument, or result both agree bears on it, with each side's prediction recorded in advance. Two cases must appear, and both sides must say what they predict about each: a firm's internal market in which every trader sees exactly the same data, and a contract whose payoff is defined by its own closing price. If you judge that part of the quarrel is verbal — that the two of them mean different things by information, or by aggregation — say which part, and why it nevertheless looked substantive.

  Give me the statement in prose, with the agreed claims numbered and the disagreements following in order of how much they matter, and then a JSON object summarizing it, with these fields: "agreed_claims", an array of objects with "claim" and "why_it_is_not_vacuous"; "disagreements", an array of objects with "disagreement" (a short name), "encoding_side_wording", "discovery_side_wording", "genuine_or_verbal" ("genuine", "verbal", or "mixed"), "crux", "shared_evidence", "encoding_side_prediction", and "discovery_side_prediction"; "verbal_disputes", an array of objects with "term", "what_the_encoding_side_means", and "what_the_discovery_side_means"; and "left_open", an array of strings naming what the document does not settle and why the two of them could not settle it. Use "encoding side" and "discovery side" consistently as the two labels.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A novel about two economist friends turned adversaries.
      *   **Characters:**
          *   *Discovery Side:* Believes markets are instruments of discovery (find out what no one knew). Built internal prediction markets.
          *   *Encoding Side:* Rational expectations tradition. Believes prices only encode what participants already brought (no new information created, just aggregated).
      *   **Task:** Write a "Joint Statement of Adversarial Collaboration" (the document they sign in the last chapter).
      *   **Constraints:**
          *   No strawmen (both sides must feel represented fairly).
          *   No citations/literature appeals (stand on arguments).
          *   Distinguish three claims: (1) Price encodes dispersed info, (2) Trade generates *new* info, (3) Market existence makes proposition true (reflexivity).
          *   Address the "No-Trade Theorem" dilemma: No-trade requires similarity (shared priors/efficiency); Discovery requires difference (incompatible models). If models are incompatible, is the average meaningful?
          *   Structure: Agreed claims (numbered), Disagreements (ordered by importance, stated twice), Cruxes (with shared evidence and predictions), Two Specific Cases (Internal market w/ same data, Contract defined by closing price).
          *   Address Verbal Disputes (definitions of information/aggregation).
          *   Output Format: Prose document followed by a specific JSON summary.
          *   Labels: Use "encoding side" and "discovery side" consistently.

  2.  **Deconstruct the Economic/Philosophical Core:**
      *   *The Encoding View (Rational Expectations/EMH):* Prices reflect the intersection of supply and demand based on *existing* private information. If trade happens, it's due to liquidity needs or differences in priors/risk tolerance, not because the market *created* truth. The "No-Trade Theorem" (Milgrom-Stokey) suggests that with common priors and common knowledge of rationality, speculative trade shouldn't happen. If it does, someone is irrational or priors differ.
      *   *The Discovery View (Hayekian/Experimental):* The process of bidding *reveals* information to participants that they didn't have. The price *is* the knowledge. It's not just a sum; it's an emergent property.
      *   *The Tension:* If we start with common priors, trade implies noise. If we start with different priors, aggregation is mathematically dubious (what is the "true" probability?).
      *   *The Three Claims to Separate:*
          1.  *Aggregation:* Price sums up dispersed private info (Both might agree on this mechanism, but disagree on the *ontological status* of the result).
          2.  *Generation:* Does the trading process *create* insight (e.g., by forcing people to think harder or revealing others' thoughts)?
          3.  *Reflexivity:* Does the price change the outcome? (Self-fulfilling prophecy).

  3.  **Drafting the Document - Section by Section:**

      *   **Preamble:** Needs to set the tone. Respectful, precise, acknowledging the depth of the friendship and the dispute.
      *   **Agreed Claims:** What can they both sign?
          *   Prices correlate with outcomes better than individuals often.
          *   Trade requires heterogeneity (of info, priors, or preferences).
          *   No-Trade theorems hold under strict conditions rarely met in reality.
          *   Distinction between *aggregating* existing signals and *generating* new epistemic status.
      *   **Disagreements:**
          *   *Core:* Is the price *knowledge* or *statistics*?
          *   *Wording:* Needs to capture the nuance. Encoding: "Price is a sufficient statistic of prior beliefs." Discovery: "Price is a cognitive artifact that did not exist prior to trading."
      *   **The Dilemma (Heterogeneity vs. Common Priors):** This is crucial. If priors are common, trade is zero-sum noise. If priors differ, whose probability is "right"?
          *   *Encoding:* Assumes a true state exists; prices converge to it if priors are rational.
          *   *Discovery:* The "truth" is constructed by the market interaction.
      *   **The Two Cases:**
          1.  *Internal Market (Same Data):* If everyone sees the same spreadsheet, does trading help?
              *   Encoding: No, just noise/liquidity.
              *   Discovery: Yes, it forces interpretation of the data.
          2.  *Reflexive Contract (Payoff = Price):*
              *   Encoding: Tautology/Instability.
              *   Discovery: Proof that markets create reality.
      *   **Verbal Disputes:** "Information." Encoding = Reduction in entropy about an external state. Discovery = Actionable coordination signal.
      *   **Left Open:** Normative questions (should we use them?), the metaphysical status of probability.

  4.  **Refining the Tone:**
      *   It needs to sound like economists who know each other well. Precise, slightly dry, but with underlying weight.
      *   Avoid jargon where possible, or explain it.
      *   Ensure neither side looks like the "villain." The Encoding side isn't a cynic; they are a rigorist. The Discovery side isn't a mystic; they are a pragmatist.

  5.  **Drafting the Content (Iterative Process):**
      *   *Claim 1:* Prices aggregate. (Both agree).
      *   *Claim 2:* No-trade theorems rely on assumptions not present in real markets. (Both agree).
      *   *Claim 3:* Distinguish between the *state of the world* and the *market's belief* about it.
      *   *Disagreement 1 (The Big One):* Origin of the information content.
      *   *Disagreement 2:* The status of heterogeneous priors.
      *   *Cruxes:* Need specific predictions.
          *   Case 1 (Same Data): Encoding predicts variance decreases over time (convergence to data). Discovery predicts variance might increase or shift as *interpretation* evolves.
          *   Case 2 (Reflexive): Encoding predicts instability/arbitrage. Discovery predicts stable equilibrium created by belief.
      *   *Verbal:* "Information."

  6.  **Constructing the JSON:**
      *   Must match the prose exactly.
      *   Fields: `agreed_claims`, `disagreements`, `verbal_disputes`, `left_open`.
      *   Ensure keys match the prompt requirements exactly.

  7.  **Review against Constraints:**
      *   *Three claims held apart?* Yes (Aggregation, Generation, Reflexivity).
      *   *No-trade dilemma addressed?* Yes (in the disagreements/cruxes).
      *   *Two cases included?* Yes (Internal Data, Reflexive Contract).
      *   *Labels:* "encoding side", "discovery side".
      *   *Format:* Prose then JSON.

  8.  **Final Polish:**
      *   Check the "Joint Statement" voice. It should sound like a treaty.
      *   Ensure the JSON is valid.
      *   Make sure the "Left Open" section explains *why* it's left open (e.g., metaphysical vs. empirical).

  *(Self-Correction during drafting)*: I initially thought about having them agree on a specific mathematical formulation. No, the prompt says "for readers of a novel," so it needs to be readable prose, not math. The JSON handles the structure. I need to make sure the "Encoding Side" doesn't sound like they think markets are useless. They think markets are *mirrors*, not *engines*. The Discovery side thinks they are *engines*.

  *(Refining the "No-Trade" Dilemma)*: The prompt asks to say "what the result actually needs, and whether the discovery view survives the answer."
  *   *Result:* Trade requires heterogeneity.
  *   *Encoding:* Heterogeneity must be in *private signals*, not priors, for the price to be "correct."
  *   *Discovery:* Heterogeneity in *models* is the feature, not the bug. The market selects the working model.
  *   *Survival:* Discovery survives if "truth" is defined by successful coordination, not correspondence to an external pre-existing fact.

  Let's write the document.

  *(Final check on JSON structure)*:
  `agreed_claims`: array of objects `{claim, why_it_is_not_vacuous}`.
  `disagreements`: array of objects `{disagreement, encoding_side_wording, discovery_side_wording, genuine_or_verbal, crux, shared_evidence, encoding_side_prediction, discovery_side_prediction}`.
  `verbal_disputes`: array of objects `{term, what_the_encoding_side_means, what_the_discovery_side_means}`.
  `left_open`: array of strings.

  Okay, ready to generate.cw
