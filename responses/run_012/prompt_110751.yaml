  # Joint Statement of Adversarial Collaboration
  **Regarding the Epistemic Status of Market Prices**

  **Signatories:** [The Encoding Side] and [The Discovery Side]
  **Date:** [Redacted]

  We, the undersigned, having worked in proximity for thirty years and in opposition for ten, submit this document to record the precise boundaries of our agreement and the irreducible core of our disagreement. We do not sign this to end the quarrel, but to define the terrain on which it must be fought. We acknowledge that our dispute is not merely about the efficiency of markets, but about the nature of knowledge itself.

  ### I. Agreed Claims

  1.  **Prices Aggregate Signals.** We agree that a market price functions as a statistic that aggregates dispersed private information held by participants. A price moves in response to new private signals entering the order flow.
      *   *Why this is not vacuous:* This rejects the notion that prices are purely random walks or manipulated artifacts devoid of informational content. It establishes a baseline mechanism upon which we disagree regarding the *origin* of that content.

  2.  **Trade Requires Heterogeneity.** We agree that speculative trade cannot occur in equilibrium if all agents share identical priors, identical information, and common knowledge of rationality (the No-Trade condition). Therefore, observed volume implies that traders differ in at least one relevant respect: private information, prior beliefs, risk preferences, or liquidity constraints.
      *   *Why this is not vacuous:* This concedes that the "Discovery" view cannot rely on a world of identical rational agents, and the "Encoding" view cannot claim trade is purely noise without specifying the source of heterogeneity.

  3.  **Distinction of Mechanisms.** We agree that three distinct claims are often conflated in this debate and must be treated separately: (a) that a price encodes dispersed information brought by traders; (b) that the act of trading generates information no single participant possessed prior to the trade; and (c) that the existence of the market alters the truth value of the proposition being priced.
      *   *Why this is not vacuous:* This prevents the Encoding Side from dismissing generation as mere encoding, and prevents the Discovery Side from claiming reflexivity as proof of discovery.

  4.  **Predictive Utility.** We agree that market prices often predict outcomes more accurately than individual experts or algorithmic models trained on public data alone.
      *   *Why this is not vacuous:* We agree on the empirical output (accuracy) while reserving judgment on the metaphysical source (discovery vs. aggregation).

  ### II. Residual Disagreements

  We list our disagreements in descending order of importance. For each, we provide the formulation each side accepts.

  **1. The Origin of Informational Content**
  *   **Encoding Side Wording:** The price is a sufficient statistic of the private signals traders held *before* entering the market. The market reveals what was already known in fragments; it adds no epistemic value beyond the arithmetic of aggregation.
  *   **Discovery Side Wording:** The price is a cognitive artifact that did not exist prior to the trading process. The interaction forces the synthesis of incompatible models, creating a consensus view that no individual held or could have derived in isolation.
  *   **Status:** Genuine.
  *   **Crux:** Does the removal of "noise traders" eliminate the predictive advantage of the market?
  *   **Shared Evidence:** Historical data on thin markets vs. liquid markets.
  *   **Encoding Prediction:** In a market purged of noise/liquidity traders, volume collapses and the price converges to the weighted average of prior signals without improvement in accuracy.
  *   **Discovery Prediction:** In a market purged of noise, the remaining informed traders will trade more aggressively on subtle interpretations, maintaining or increasing accuracy despite lower volume.

  **2. The Status of Heterogeneous Priors**
  *   **Encoding Side Wording:** For a price to be "correct," traders must share a common prior. If traders differ in their fundamental models of the world, the price is merely an average of incompatible errors, possessing no truth value.
  *   **Discovery Side Wording:** Traders necessarily differ in their fundamental models. The market is a selection mechanism that weights models by their profitability, allowing the price to track truth even when no single trader understands the underlying reality.
  *   **Status:** Genuine.
  *   **Crux:** Can a market price converge to the truth if every participant is using a misspecified model?
  *   **Shared Evidence:** Simulation results of agent-based models with misspecified agents.
  *   **Encoding Prediction:** The price will systematically diverge from the truth as model errors compound or oscillate.
  *   **Discovery Prediction:** The price will converge to the truth provided the errors are uncorrelated, even if every individual model is wrong.

  **3. The Reflexive Case**
  *   **Encoding Side Wording:** If a contract's payoff is defined by its own closing price, the market is tautological. The price does not discover a value; it stipulates it. This is a coordinate system, not a measurement.
  *   **Discovery Side Wording:** If a contract's payoff is defined by its own closing price, the market demonstrates that value is a social construct stabilized by belief. The market discovers the equilibrium point of collective belief, which is the only truth available.
  *   **Status:** Mixed (Verbal and Genuine).
  *   **Crux:** Is stability in a reflexive market evidence of coordination or evidence of nothing?
  *   **Shared Evidence:** Experimental markets with endogenous payoffs.
  *   **Encoding Prediction:** Prices will show high volatility or multiple equilibria with no focal point.
  *   **Discovery Prediction:** Prices will settle on a focal point determined by the market structure itself.

  ### III. Verbal Disputes

  We acknowledge that part of our quarrel arises from differing definitions of key terms. We record these to prevent talking past one another, though we note that the verbal dispute masks a substantive one.

  | Term | Encoding Side Meaning | Discovery Side Meaning |
  | :--- | :--- | :--- |
  | **Information** | A reduction in entropy regarding an external, pre-existing state of the world. | A signal that coordinates action successfully, regardless of correspondence to an external state. |
  | **Aggregation** | The mathematical combination of independent data points. | The social synthesis of conflicting interpretations into a working hypothesis. |
  | **Efficiency** | The speed with which price reflects all available *existing* data. | The ability of the price to incorporate data that becomes available *only through* the trading process. |

  *Why this looked substantive:* Because the Encoding Side treats "information" as a static stock to be moved, while the Discovery Side treats it as a flow that is generated by movement. Resolving the definition does not resolve the conflict, because the Encoding Side denies the flow exists, while the Discovery Side denies the stock is sufficient.

  ### IV. Left Open

  We deliberately leave the following questions unsettled, as settling them requires stepping outside the bounds of economic analysis into metaphysics or ethics, where our collaboration does not extend:

  1.  **The Normative Question:** Whether a market *should* be used to make decisions if it is merely aggregating biases rather than discovering truth. (We agree on the mechanism's existence, not its moral utility.)
  2.  **The Ontological Status of Probability:** Whether probability is a property of the world (frequentist/objective) or a property of the observer (Bayesian/subjective). (Our disagreement on heterogeneous priors rests on this, but we cannot resolve it here.)
  3.  **The Definition of "Discovery":** Whether "discovery" requires the discovered fact to exist independently of the observer. (The Encoding Side says yes; the Discovery Side says no. We agree to disagree on the definition of reality.)

