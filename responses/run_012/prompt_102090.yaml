answer: |-
  # Higher-Order Consciousness: Commitment Sorting Tree

  **Starting Premise:** You agree that a mental state is conscious only in virtue of there being a higher-order state (HOS) directed at it.

  **1. Distinctness:** Is the higher-order state a *separate* mental state from the one it represents?
  *   **NO** → **Leaf: Self-Representationalism**
      *   *Commitment:* The first-order state becomes conscious by representing itself; no distinct higher-order state exists.
  *   **YES** → Go to Question 2.

  **2. Nature (Thought vs. Perception):** Is the higher-order state more like a conceptual judgment (reportable, categorical) or a non-conceptual scan (analog, continuous)?
  *   **PERCEPTION-LIKE** → **Leaf: Inner Sense / Higher-Order Perception (HOP)**
      *   *Commitment:* Consciousness arises via an internal scanner analogous to vision; requires non-conceptual content.
  *   **THOUGHT-LIKE** → Go to Question 3.

  **3. Occurrent vs. Dispositional:** Does the higher-order state need to be actively occurring right now, or is a standing disposition to form it enough?
  *   **DISPOSITION ENOUGH** → **Leaf: Dispositionalist HOT**
      *   *Commitment:* You are conscious of a state if you are poised to report it, even without an active higher-order thought.
      *   *Note:* If you also answer "Yes" to Misrepresentation (Q4), this view is **unheld/unattractive** because a disposition cannot target a non-existent state without an occurrent error.
  *   **MUST BE OCCURRENT** → Go to Question 4.

  **4. Misrepresentation Case:** Suppose you have a higher-order state representing you as being in pain, but no first-order pain state exists. Are you consciously in pain?
  *   **YES** → **Leaf: Pure HOT (Targetless)**
      *   *Commitment:* Consciousness is constituted by the higher-order state alone; the first-order state can be absent (illusion of consciousness).
  *   **NO** → Go to Question 5.
      *   *Note:* This branch rejects "targetless" consciousness; a real first-order state is required.

  **5. Constitutive vs. Reportable:** Does the higher-order state *create* the qualitative feel (phenomenology), or does it merely make an existing feel reportable?
  *   **MAKES REPORTABLE** → **Leaf: Monitoring HOT**
      *   *Commitment:* The first-order state has its feel independently; the higher-order state only provides access-awareness.
      *   *Note:* This combination is **incoherent** if you hold that consciousness *just is* what-it's-like-ness; if the feel exists without the HOS, the state was already conscious.
  *   **CREATES FEEL** → Go to Question 6.

  **6. Content Focus:** Does the higher-order state represent *you* as being in a state, or just the *state* itself?
  *   **REPRESENTS YOU (Subject-Involving)** → **Leaf: Subject-Involving HOT**
      *   *Commitment:* Consciousness requires a representation of the self as the subject of the experience.
  *   **REPRESENTS STATE** → Go to Question 7.
      *   *Flag:* **Indistinguishable Leaf:** In practice, Subject-Involving and State-Representing views often collapse unless strict conditions on self-concepts are enforced; the behavioral commitments are frequently identical.

  **7. Content Fixation (Wide vs. Narrow):** Is the content of the higher-order state fixed partly by facts outside your head (environment/history)?
  *   **YES (External)** → **Leaf: Wide HOT**
      *   *Commitment:* What it is like to be you depends partly on your external environment fixing the content of your higher-order thought.
  *   **NO (Internal)** → Go to Question 8.

  **8. Functional Role (Broadcasting):** Does the higher-order state need to broadcast information to multiple cognitive systems (memory, planning, speech) to constitute consciousness?
  *   **YES** → **Leaf: Higher-Order Global Workspace Hybrid**
      *   *Commitment:* Consciousness requires both a higher-order thought and global availability to downstream systems.
  *   **NO** → **Leaf: Narrow Actualist HOT**
      *   *Commitment:* Consciousness is constituted by an occurrent, internal, thought-like higher-order state directed at an existing first-order state; no broadcasting required.

  ***

  **Impossible/Unexplored Combinations:**
  *   **Dispositional + Targetless:** **Unattractive.** A disposition to think something cannot make you conscious of a non-existent state without the thought actually occurring.
  *   **Self-Representational + Perception-Like:** **Unexplored.** Self-representation is almost exclusively modeled on conceptual structures; a non-conceptual self-representing state is theoretically undefined.
  *   **Monitoring + Creates Feel:** **Incoherent.** If the feel exists prior to monitoring, the monitoring does not create it; if monitoring creates it, it is not merely monitoring.

  **Verdict:** Suppose you have a higher-order state representing you as being in pain, but no first-order pain state exists. Are you consciously in pain?
