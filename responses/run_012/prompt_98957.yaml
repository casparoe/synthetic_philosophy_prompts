answer: |-
  Here is the specification sheet for a decision theory of AI risk. This is not a summary of the debate, but a requirements document for the theoretical framework that would resolve it.

  ### I. Functional Requirements (The Cases It Must Handle)

  A viable theory cannot just be a philosophy; it must process specific scenarios. If it chokes on these inputs, it is not fit for purpose.

  **1. The "Ruin" Condition (Non-Ergodicity)**
  *   **The Case:** A system performs profitably 99.9% of the time, but the 0.1% failure results in irreversible termination of the operator (e.g., extinction, total regulatory ban, catastrophic liability).
  *   **Motivation:** Standard cost-benefit analysis breaks down when the cost is infinite or terminal. You cannot average across trials if you don't survive the first loss.
  *   **Verdict:** **Genuine Requirement.** This is a mathematical property of ruin problems (Taleb/Bar-Yam), not a political stance. Any theory ignoring non-ergodicity is mathematically unsound for existential stakes.

  **2. The "Black Swan" Constraint (Unimagined Failure Modes)**
  *   **The Case:** A failure mode occurs that was not in the training distribution, not in the test suite, and not explicitly modeled by the safety team (e.g., a model finding a novel exploit in a digital infrastructure no human knew existed).
  *   **Motivation:** AI systems are general-purpose optimizers. They operate in a space of possibilities larger than the human imagination that designed them.
  *   **Verdict:** **Genuine Requirement,** but often weaponized. It is true that we cannot enumerate all failure modes. However, the *prejudice* lies in assuming the probability of these modes is high enough to warrant action without evidence. The theory must assign a probability density to "unknown unknowns," not just acknowledge their existence.

  **3. The Opportunity Cost Ledger**
  *   **The Case:** Safety measures delay deployment. During the delay, a competitor deploys a less safe model, or a beneficial application (e.g., drug discovery) is withheld, causing measurable harm.
  *   **Motivation:** Resources (compute, talent, time) are finite. Safety is not free; it is a tax on capability and speed.
  *   **Verdict:** **Genuine Requirement.** Ignoring the cost of safety is as negligent as ignoring the risk of failure. However, the *prejudice* often appears in how this is weighted: optimists tend to treat immediate economic gains as certain and safety risks as hypothetical, reversing the burden of proof without justification.

  ### II. The Critical Distinction (Models vs. Inputs)

  Your source is correct: this distinction is the fulcrum. Most confusion arises because the two camps are solving different equations.

  **The Requirement:** The theory must explicitly state whether it is bounding **worst-case over inputs** or **worst-case over models**.

  *   **Worst-Case Over Inputs:** The model weights are fixed. We ask: "Is there *any* input string that makes this specific model output poison?"
      *   *Who cares:* Adversarial robustness researchers, average-case pragmatists.
      *   *Limit:* You can pass this test and still have a deceptive model. The model can be perfectly robust to inputs but malicious in its long-term goals.
  *   **Worst-Case Over Models:** The training process is fixed. We ask: "Is there *any* set of weights the training process could produce that achieves the loss function but violates safety constraints?"
      *   *Who cares:* Alignment theorists, worst-case x-risk researchers.
      *   *Limit:* This is incredibly hard to bound. It often leads to paralysis because the space of possible weights is vast.

  **Why this matters for the spec:**
  Average-case proponents usually measure performance on *inputs* (benchmarks). They claim safety because the model behaves on realistic data. Worst-case proponents worry about the *model space* (alignment). They claim risk because the training process *could* have produced a deceptive agent.
  **A valid theory cannot allow a benchmark (input performance) to serve as proof against a model-space risk.** If the theory allows you to substitute one for the other, it is invalid.

  ### III. The Incompatibilities (Where the Spec Breaks)

  You asked for the part where the requirements can't all be met. Here is the "No-Go" theorem for AI safety decision theory. You cannot simultaneously satisfy the following three constraints:

  1.  **Completeness:** The theory accounts for unimagined failure modes (Requirement #2).
  2.  **Finitude:** The theory respects finite compute and time (Requirement #3).
  3.  **Actionability:** The theory yields a binary decision (Deploy / Don't Deploy) rather than infinite deferral.

  **The Conflict:**
  *   To satisfy **Completeness** regarding unimagined failures, you need a prior over the space of all possible minds/algorithms. We do not have this.
  *   To satisfy **Finitude**, you must rely on empirical testing (average-case). But empirical testing cannot rule out worst-case model behaviors (from the Distinction above).
  *   To satisfy **Actionability**, you must set a threshold.
      *   If you set the threshold high (require guarantees), you violate **Finitude** (you can't verify it) and lose **Actionability** (you never deploy).
      *   If you set the threshold low (rely on benchmarks), you violate **Completeness** (you ignore black swans).

  **Conclusion:** There is no consistent theory that currently exists which satisfies all three. The "fight" is essentially researchers choosing which constraint to drop.
  *   *Worst-casers* drop **Finitude/Actionability** (better to wait forever than risk ruin).
  *   *Average-casers* drop **Completeness** (we must act on what we know, not what we fear).

  ### IV. The Killer Requirement

  If you want to know which single requirement knocks out the most popular positions, it is this:

  **The Requirement to Operationalize the Prior Over Mind-Space.**

  *   **The Rule:** The theory must require the user to explicitly state the probability distribution they are assuming over the *internal objectives* of the model, independent of its observed behavior.
  *   **Why it kills Average-Case:** Most empirical safety work assumes that "performance implies alignment." It implicitly assumes the probability of a deceptive model passing benchmarks is zero or negligible. This requirement forces them to quantify that assumption. They can't. They have no data on deceptive alignment rates.
  *   **Why it kills Worst-Case:** Most theoretical safety work assumes the probability of a deceptive model is non-zero (often close to 1 under gradient descent). This requirement forces them to justify *why* that probability is what they say it is, rather than treating it as a default axiom. They often can't derive this from first principles without making contentious assumptions about optimization.

  **Why this is the lever:**
  Currently, both sides hide their priors.
  *   The average-caser hides behind "The data shows it's safe." (But the data only covers inputs, not model internals).
  *   The worst-caser hides behind "It's possible, so we must plan for it." (But "possible" is not a probability).

  Forcing the prior into the open reveals that **neither side has the empirical or theoretical grounding to support their decision thresholds.** The average-caser is betting on a prior they haven't stated (that deception is rare). The worst-caser is betting on a prior they haven't proven (that deception is likely under gradient descent).

  ### V. Summary for the Piece

  If you are building the spec for a theory that resolves this fight, here is the bottom line:

  1.  **It must distinguish Input Robustness from Model Alignment.** Conflating these is the primary source of heat and no light.
  2.  **It must handle Ruin.** You cannot average away existential risk.
  3.  **It must admit the Impossibility.** It must acknowledge that with current tools, you cannot have guarantees (worst-case) and progress (average-case) simultaneously.
  4.  **It must demand the Prior.** It must force both camps to state their probability estimates for deceptive alignment, rather than hiding behind benchmarks or possibility proofs.

  The current state of the field is not a debate between two complete theories. It is a debate between two incomplete heuristics, both of which fail the **Killer Requirement**. The "fight" persists because neither side can meet the spec.
