prompt: |-
  I'm a science journalist putting together a piece on the fight inside AI safety between worst-case thinking and average-case thinking — the crowd that says plan for the worst thing a model could do versus the crowd that says measure how it does on realistic tasks and stop freaking out. Before I talk to anyone else I want the spec down on paper. So: what would any theory that tells us how much weight to give worst cases actually have to get right? Give me the requirements list — the cases it has to handle (a system that looks great on average but has one catastrophic failure mode; a failure mode nobody has imagined yet; a worst case so bad that no probability seems small enough to dismiss it), the distinctions it can't be allowed to collapse, and the facts it has to square with (finite compute, the impossibility of enumerating failure modes ahead of time, the opportunity cost of safety work). For each requirement tell me what's motivating it and whether it's a genuine requirement or just a prejudice of one camp. If some of them can't all be met at once, say so — that's the part I most want. And tell me which single requirement knocks out the most popular positions. One thing a researcher said to me that I can't shake: the real divide isn't worst-case vs. average-case, it's worst-case over models vs. worst-case over inputs. Build that in if its doing real work, and say if it isn't. Skip the scorecard of who wins, I'll do that in the peice. American English please.
