  You are a senior engineer reviewing a module written by a peer. The code is competent but mundane, meriting professional respect but not genuine admiration; it solves a problem adequately without elegance. You are transferring teams tomorrow, so neither the project's success nor your colleagues' morale affects your future work or relationships. However, a third colleague, Elena, is recovering from a severe confidence crisis. She contributed a minor, invisible utility function to this module. You know that if you express genuine admiration for the module, Elena will interpret it as validation of her contribution and regain the stability needed to remain in the profession. If you withhold admiration, she will quit. Her reaction reveals nothing about the code's actual quality; her stability depends entirely on her perception, not the module's worth.

  You recognize the moral weight of preventing a talented engineer from leaving the field. Since the code is not bad, admiring it is not dishonest, but the pressure to admire stems from the outcome, not the code. You face no penalty or reward; you simply know that your admiration is the sole catalyst for her retention. The consideration is a genuine moral reason to hold the attitude, yet it stems entirely from the consequences of the attitude's existence for a third party, not from the object itself.

  ***

  **Audit**

  **Attitude and Verdicts:** The attitude at issue is **admiration**. The Fitting-Attitude (FA) analysis, if it counts this consideration, must verdict that the module is **admirable** (and thus valuable), because there is a decisive reason to admire it. The correct verdict is that the module is **not admirable**; it is merely competent. The value lies in the consequence (Elena's career), not the object.

  **Escape Prevention:** The FA defender typically escapes the Demon Objection by labeling self-interested reasons as the "Wrong Kind of Reasons" (WKR). Here, that escape is blocked because the reason is **altruistic**, not self-interested. You gain nothing. The defender cannot dismiss this as a "pragmatic reason to want to admire" without arguing that *all* consequence-based reasons are the wrong kind, even moral ones. This forces them to admit that the FA analysis excludes genuine moral reasons for attitudes, which looks like a bug, not a feature.

  **Working Feature and Removal:** The single feature doing the work is the **third-party welfare consequence**. When removed (Elena's career is not at stake), only the code's merits remain, and admiration becomes unfitting. Removing this feature hands the defender back the escape hatch: they can revert to saying "only object-directed reasons count," because there are no longer any competing external reasons. The Demon case leaves this hatch open because the reason is self-interested; this case jams the hatch by making the external reason morally weighty.

  **The FA Reply and Honesty:** The strongest reply is the **Right Kind of Reasons (RKR) distinction**: "Reasons are of the right kind only if they bear on the object's properties, regardless of whether they are self-interested or altruistic." Does this survive? **Formally, yes.** The defender can stipulate that "fittingness" is constituted only by object-properties. However, this survival comes at a high cost: it renders the RKR distinction **ad hoc**. They must argue that a reason saving a career is the "wrong kind" for admiration simply because it isn't about the code, even though it is a decisive reason for a thoughtful person to admire. The case is only as strong as the stipulation that Elena's distress is non-evidential, but given that stipulation, the case exposes that the FA analysis survives only by defining "value" in a way that excludes obvious moral reasons for valuing.
