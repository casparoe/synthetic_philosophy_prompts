answer: |-
  **Brainstorming Research Questions**

  1.  Is propositional unity a metaphysical feature requiring a constituent, or a normative status conferred by practice?
  2.  Does the regress of ties arise from a category mistake between physical composition and rule-governed moves?
  3.  Can constitutive rules explain truth-aptness without committing to an ontology of facts or states of affairs?
  4.  What is the explanatory cost of replacing metaphysical binding with normative licensing in the theory of propositions?

  **Selection:** I will pursue Question 1. It offers the clearest dichotomy between the traditional metaphysical approach (which generates the regress) and the proposed pragmatic approach. By framing unity as a status rather than a feature, we can diagnose the regress as a symptom of asking the wrong kind of question, rather than a puzzle requiring a new ontological posit. This provides a determinate path for argumentation: if unity is normative, the demand for a "binder" is illegitimate.

  ***

  **Research Proposal: Unity as Status, Not Structure**

  **The Problem**
  The central problem is the regress of propositional unity. When we analyze a proposition into constituents (e.g., a subject and a property), we face the question of what unifies them into a truth-apt whole rather than a mere list. The standard metaphysical response is to posit a unifying relation or "tie." However, this tie is itself a constituent, requiring a further tie to link it to the original constituents, generating an infinite regress.

  Most discussions treat this as a technical problem about the nature of relations. I argue this is a misdiagnosis. The regress is a symptom of a deeper assumption: that unity must be explained by something *over and above* the constituents, analogous to how glue unifies physical parts. This proposal asks: **Can the regress be stopped by shifting from 'what binds the constituents together?' to 'what makes this the kind of thing that can be true or false?'**

  **Critique of Standard Positions**
  Current solutions fail because they remain within the "binding" paradigm.
  First, positing a special, non-relational tie (a "nexus") merely stipulates a stop to the regress without explaining *why* this constituent succeeds where others fail. It treats the tie as a magical object that does not require tying.
  Second, treating predication as a form of identity collapses the distinction between the object and the property, rendering false propositions impossible or unintelligible.
  Third, declaring unity primitive accepts the regress as unexplainable but retains the ontological picture that generated it. It leaves the "over and above" assumption intact, merely refusing to analyze it.

  All three positions share a structural flaw: they seek the source of unity *inside* the proposition's architecture. They assume that for a proposition to be unified, there must be a metaphysical mechanism holding it together. This proposal argues that this assumption is false. Physical objects require binding because their parts are inert; propositions do not have inert parts in the same sense.

  **The Proposed Shift: Unity as Normative Status**
  I propose modeling propositional unity on the unity of a rule-governed move in a practice, such as a chess move or a legal judgment. Consider a pawn moving two squares forward. Physically, it is wood sliding on a board. What makes it a "move" rather than mere motion? It is not a metaphysical glue binding the wood to the board. It is the constitutive rules of chess that confer a specific status on that physical event.

  Similarly, a proposition is not a structure held together by a tie; it is a sequence of constituents that has been licensed by linguistic norms to function as a truth-apt unit. The "unity" is not an ontological addition; it is the normative status of being subject to evaluation as true or false. The regress stops because norms do not require binders. A rule does not need a further rule to bind it to the move it governs; it *constitutes* the move.

  **Methodology and Work Plan**
  This project will be conducted over a 14-week semester, divided into three phases: analysis, construction, and stress-testing.

  *Weeks 1–3: Diagnostic Phase.*
  I will map the logical structure of the regress argument to isolate the precise premise that demands an ontological binder. I will draft a formal reconstruction of the "binding assumption" to show that it entails a category mistake. The deliverable is a 2,000-word problem statement distinguishing metaphysical composition from normative constitution.

  *Weeks 4–9: Construction Phase.*
  I will develop the analogy between propositional unity and institutional facts (e.g., chess, law). The focus will be on explicating how "status functions" work without regress. I will write three draft sections: (1) The Chess Analogy, (2) Truth-Aptness as a Normative Status, and (3) Dissolving the Tie. The goal is to show that asking "what binds the move?" is as nonsensical as asking "what binds the checkmate?"

  *Weeks 10–12: Stress-Testing Phase.*
  I will anticipate the primary objection: that rules themselves require interpretation, potentially restarting the regress (the "rule-following" worry). I will refine the account to show that normative practices are grounded in training and custom, not further interpretations. I will also test the account against false propositions and nonsense strings to ensure it distinguishes unified falsehoods from mere lists.

  *Weeks 13–14: Synthesis.*
  Final drafting and revision for the workshop. I will integrate the stress-test results into the main argument, ensuring the conclusion is modest but robust.

  **Success and Failure Conditions**
  A successful result will demonstrate that the demand for a unifying constituent is illegitimate. Success looks like a dissolution of the problem: showing that once we accept unity as a normative status, the question "what binds the tie?" loses its grip. The "buy" is a metaphysically lightweight theory of propositions that avoids infinite regresses without resorting to primitivism. The "cost" is accepting that propositions are not mind-independent metaphysical structures but depend on normative practices.

  Failure would take two forms. First, if the normative account itself generates a regress (e.g., if norms require a "norm-tie" to apply to constituents), the proposal fails. Second, if the account cannot distinguish between a unified false proposition and a mere list of words (nonsense), it fails to capture the specific unity required for truth-aptness. If I cannot explain how norms confer unity without appealing to a mental act of binding, the shift offers no advantage over traditional mentalism.

  **Scope Check**
  This project is limited to the problem of propositional unity. It does not aim to provide a full theory of truth, nor does it seek to eliminate metaphysics entirely. It accepts that objects and properties exist but denies they require a metaphysical "glue" to form propositions. The scope is restricted to the logic of the regress; it does not address the epistemology of how we grasp these norms. By keeping the scope narrow, I aim to provide a definitive argument on the specific mechanism of unity, leaving broader semantic issues for future work. The goal is not to solve all problems of intentionality, but to show that one specific, persistent metaphysical knot can be untied by changing the category of the explanation.
