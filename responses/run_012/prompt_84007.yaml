answer: |-
  ### Welcome Address: The Cost of Consistency

  Good morning.

  We have a room full of different dialects today. We have logicians who speak in proof theories and model structures. We have linguists and computer scientists who speak in parsing and type systems. And we have partners who speak in outcomes and deliverables. Usually, a welcome like this is an exercise in translation—trying to find the lowest common denominator so everyone feels included.

  I am not going to do that. Instead, I want to propose a friction point that sits right in the center of what we are doing here.

  For the last century, the dominant question in the logic of inconsistency has been ontological: *Are there true contradictions?* The classical answer is a hard no. The dialetheist answer is a qualified yes. But I want to suggest that for the next two days, we bracket that question. It is not the most pressing one.

  The more urgent question is economic. Or perhaps, political. The question is: **Who pays when you get rid of a contradiction?**

  We tend to treat consistency as a free good. We assume that if a system contains a contradiction, the rational move is to eliminate it. We prune the premise, we reject the testimony, we refine the definition. We assume the cost of this cleanup is negligible. It is not. Consistency is a resource, and like any resource, it must be extracted from somewhere. When you resolve a contradiction, you do not make the tension vanish. You shift the burden of that tension onto some part of the system.

  My argument for this workshop is this: A contradiction is **load-bearing** exactly when the cost of consistency lands on someone who has no business paying it.

  Let me make this concrete. I am going to assert a contradiction as true. I am not speaking rhetorically. I am not speaking poetically. I am not using two different senses of a word. I am asking you to accept this proposition:

  **"This boundary is here and this boundary is not here."**

  Now, the classical logician in the room is already reaching for the scalpel. You will say this is a Sorites paradox. You will say "here" is vague. You will say that if we sharpen the definition—if we move to a higher precision logic—the contradiction dissolves.

  But precision is not free.

  Imagine this boundary is not on a chalkboard. It is the threshold for a hazardous waste dump. It is the line where a chemical concentration becomes "toxic." Or it is the border of a indigenous territory that predates the surveyor's map. Or it is the moment of brain death in a hospital room.

  In the classical model, we say the boundary *must* be somewhere. We force a cut. We say, "For the purposes of the law, the boundary is *here*." We restore consistency. The system is happy. The logic holds.

  But who pays?

  If the boundary is arbitrary, the cost is paid by the landowner who loses value, or the community that absorbs the toxicity, or the family that must turn off the ventilator. The contradiction was not in their heads. It was in the world. The world was glutty. The boundary *was* both real and unreal. It was a zone of overlap. By forcing the world to be consistent, we externalize the cost of that consistency onto the subject who lives in the boundary zone.

  When we treat inconsistency as an error to be fixed, we treat the people who inhabit the inconsistency as errors to be fixed.

  This is why paraconsistency is not just a technical curiosity for this room. It is an ethical stance. If we accept that some contradictions are true—that some states of affairs are $A \land \neg A$—we stop trying to fix the world to fit our logic, and we start building logics that fit the world.

  I am not arguing for "anything-goes." I am not arguing that we should tolerate contradictions in the funding reports or the codebase. I am arguing that we need to identify which contradictions are **structural** and which are **exploitative**.

  If a database is inconsistent, we fix it. The cost is paid in engineering hours. That is acceptable.
  If a legal system is inconsistent regarding a person's status—say, a refugee who is "present" and "not present"—and we force consistency by deporting them, the cost is paid in a human life. That is not acceptable.

  So, my challenge to you for the next two days is this: When you encounter a model of inconsistency, do not just ask if it is sound. Ask where the cost goes. When you restore consistency, trace the bill.

  We have logicians here who can show us how to build systems that don't explode when they encounter a contradiction. We have linguists who can show us how meaning survives ambiguity. We have computer scientists who can show us how to manage inconsistent data without crashing.

  Put those tools to work on the burden. Let's spend these two days figuring out not just how to tolerate inconsistency, but how to distribute its weight justly.

  Thank you. Let's begin.

  ***

  ### Meta-Analysis: Settled vs. Contested

  You asked for a breakdown of where this stance sits within the current landscape of non-classical logic. Here is the terrain you are walking into.

  **1. What is Settled (Among Paraconsistentists)**
  *   **Explosion is Rejectable:** It is consensus among paraconsistent logicians that the principle *ex contradictione quodlibet* (from contradiction, anything follows) is not a necessary feature of rational inference. You can have a logic that tolerates $A \land \neg A$ without triviality.
  *   **Instrumental Value:** It is widely accepted that paraconsistent logic has instrumental value in computer science (database management), AI (belief revision), and semantics (handling vague predicates). You do not need to be a dialetheist to use paraconsistent logic; you can be an *instrumentalist* (like Nuel Belnap), viewing it as a tool for managing information flow rather than describing reality.

  **2. What is Contested (Your Risk Zones)**
  *   **Dialetheism vs. Paraconsistency:** This is the biggest fault line. **Paraconsistency** is a property of a logic (it blocks explosion). **Dialetheism** is the metaphysical claim that there *are* true contradictions in the world.
      *   *The Pushback:* Many paraconsistent logicians are **not** dialetheists. They will agree with your workshop premise that we should *tolerate* inconsistency, but they will reject your assertion that "This boundary is here and not here" is *true*. They will argue the contradiction is epistemic (in our knowledge) or semantic (in our language), not ontological (in the world).
      *   *Graham Priest's Camp:* Dialetheists (like Priest) will support your move to assert true contradictions, but they usually ground this in semantic paradoxes (the Liar) or limits of thought (Kantian antinomies).
  *   **The "Who Pays" Normative Claim:** This is your most innovative but most vulnerable point.
      *   *The Pushback:* A strict logician might argue you are committing a category error. Logic describes validity; it does not calculate ethical costs. To say "the cost lands on someone" moves the discussion from logic to political philosophy. A hard-line dialetheist might even push back here: they might argue that if a contradiction is *true*, it is true regardless of the cost. Truth is not a democracy. By tying the acceptance of contradiction to the *consequences* of resolving it, you are pragmaticizing what they see as a metaphysical truth.
  *   **Vagueness as True Contradiction:** Using the Sorites ("This boundary is here and not here") as your example of a true contradiction is standard for dialetheists, but it is **not** settled science.
      *   *The Pushback:* Epistemicists (like Timothy Williamson) argue the boundary *is* sharp, we just don't know where it is. Supervaluationists argue it's neither true nor false. By asserting it is *both*, you are taking a specific, contested stance (Dialetheic Vagueness) and presenting it as the workshop's working thesis. The logicians in the room who are supervaluationists or epistemicists will view this as a philosophical overreach.

  **Summary for your Q&A:**
  If challenged, clarify that you are advocating for a **pragmatic dialetheism**. You are not necessarily claiming the universe is metaphysically contradictory in a mystical sense, but that for any agent embedded in a system (legal, biological, social), the *effective reality* is contradictory, and forcing classical consistency imposes an external cost. This bridges the gap between the metaphysical dialetheists and the instrumentalist paraconsistentists.
