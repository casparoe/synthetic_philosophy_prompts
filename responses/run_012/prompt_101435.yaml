  7.  **Final Polish:**
      *   Structure: Introduction -> The Two Electorates (Analogy) -> Why Independence Matters -> The Moral (Joint Distribution) -> Real World Application.
      *   Tone: Analytical, philosophical, clear.
      *   Ensure the distinction between *marginal* probability (individual) and *joint* probability (group) is clear.

  8.  *(Self-Correction on the "Even Worse" point)*: If the prompt insists the individual competence is *identical* ($p > 0.5$), then mathematically the group accuracy in the correlated case cannot be *lower* than $p$ if the correlation is just "shared noise." However, if the correlation stems from a *shared bias* that is triggered by specific question types, the group fails on those types 100% of the time. If the question is drawn from a distribution where that bias is relevant, the group is brittle. I will focus on the *variance* and the *risk of collective failure* being worse, and the potential for deliberation to actively lower competence (cascades).

      *Actually, let's look at the "Common Cause" model again.*
      Suppose there is a 10% chance of a "Bad Signal."
      If Bad Signal: Everyone votes Wrong (0% accuracy).
      If Good Signal (90%): Everyone votes independently with 66% accuracy.
      Individual Marginal Accuracy = $0.1(0) + 0.9(0.66) \approx 0.6$.
      Group Accuracy:
