answer: |-
  The Condorcet Jury Theorem is often invoked as a mathematical vindication of democracy, suggesting that aggregating opinions magically transmutes fallible individuals into an infallible collective. However, this interpretation rests on a fragile premise that is frequently overlooked: the structure of error. To understand why the theorem works, and why it often fails in practice, we must look past the individual competence of voters and examine the relationship between their mistakes.

  ### Two Electorates, One Competence

  Imagine two electorates, **Alpha** and **Beta**, both consisting of 1,000 voters. In both groups, every voter has an identical individual competence: on any given yes/no question of fact, each voter has a 60% chance of voting correctly and a 40% chance of voting incorrectly. By the standard statement of the theorem, both groups should be capable of reaching near-certainty as their size increases. Yet, their outcomes will diverge radically based on the architecture of their errors.

  **Electorate Alpha: The Independence of Noise**
  In Alpha, errors are independent. Think of each voter as a slightly flawed measuring instrument. If Voter 1 overestimates the truth, there is no reason to expect Voter 2 to do the same. Their errors are like static on a radio signal—random, uncoordinated noise.
  When these 1,000 voters cast ballots, the law of large numbers takes hold. Because the errors are uncorrelated, they tend to cancel each other out. For every voter who is mistakenly swayed by a random distraction, another is likely distracted in the opposite way or not at all. The "signal" (the 60% competence) accumulates, while the "noise" (the 40% error) averages toward zero. As the group grows, the probability that the *majority* is wrong shrinks exponentially. The crowd becomes wise because its members are wrong for different reasons.

  **Electorate Beta: The Correlation of Cause**
  In Beta, individual competence is also 60%, but the errors are structurally correlated. Imagine these voters all rely on the same news source, share the same cultural heuristic, or listen to the same charismatic leader.
  Here, we must distinguish between the *average* competence and the *conditional* competence. On 80% of questions, the shared influence is benign, and voters act like Electorate Alpha (independent). But on 20% of questions, the shared influence is misleading—a false rumor or a framing effect that tricks everyone simultaneously.
  On those 20% of questions, the individual competence drops to 0%. On the other 80%, it rises slightly to keep the overall average at 60%.
  The crucial difference is this: In Electorate Alpha, it is statistically nearly impossible for all 1,000 voters to be wrong at the same time. In Electorate Beta, it happens routinely. When the common cause triggers an error, the entire majority errs in unison. The group does not act as 1,000 independent sensors; it acts as one giant sensor with a 60% success rate. The majority is no more reliable than a single voter drawn at random.

  In fact, Beta can be **worse** than Alpha, and potentially worse than a lone voter, if the common cause induces *overconfidence*. If the shared influence convinces voters that they are certain when they are wrong, the group loses the ability to self-correct. A lone voter might hesitate or doubt; a correlated crowd, buoyed by the illusion of consensus, may lock in a catastrophic error with unanimous confidence.

  ### The Moral: Independence Over Competence

  The lesson here is that the Condorcet Jury Theorem is not primarily a theorem about competence; it is a theorem about **independence**.

  Competence is merely the engine; independence is the transmission. You can have a high-horsepower engine (high individual accuracy), but if the transmission is locked (correlated errors), the vehicle goes nowhere. The theorem's conclusion—that group accuracy approaches 100%—depends entirely on the **joint distribution** of votes, not just the **marginal distribution**.

  *   **Marginal Probability:** The chance that Voter $i$ is right (e.g., 60%).
  *   **Joint Probability:** The chance that Voter $i$ AND Voter $j$ are right *together*.

  The theorem assumes that $P(i \text{ right} \cap j \text{ right}) = P(i \text{ right}) \times P(j \text{ right})$. This is the assumption of conditional independence. If errors are correlated, the joint probability of collective error does not shrink; it remains stubbornly high. Therefore, the theorem should be read as a claim that *uncorrelated noise cancels out*, rather than a claim that *crowds are inherently wise*. Without the assumption that voters arrive at their conclusions via distinct causal pathways, the mathematical guarantee of truth-tracking evaporates.

  ### The Impossibility of Independence in Deliberation

  Can any real deliberative body satisfy the assumption of independent errors? The answer is almost certainly no.

  Real-world voters and jurors do not form judgments in isolation. They are exposed to common information environments (news media, social networks), share cultural backgrounds, and are subject to the same framing effects. Furthermore, the very act of **deliberation**, often touted as a virtue of democratic bodies, actively destroys independence. When jurors discuss a case, they share evidence and arguments. If a piece of evidence is misleading, it misleads everyone. If a charismatic juror argues persuasively for a false conclusion, they can correlate the errors of the rest of the panel.

  Deliberation creates an informational cascade. Once a few people speak, the remaining voters are no longer relying on their private signals; they are relying on the public signals of their peers. This increases the *effective* competence of the group if the early speakers are right, but it creates a fragility where, if the early speakers are wrong, the whole group follows them off a cliff.

  ### Conclusion: Truth-Tracking and Fragility

  What follows for the claim that majority rule tends to track the truth? We must temper our optimism. Majority rule is a robust mechanism for aggregating *diverse* information, but it is fragile in the face of *shared* bias.

  The Condorcet Jury Theorem holds only in a world where voters are like independent witnesses arriving at a crime scene from different directions. In the real world, voters are like witnesses who have all read the same police report before testifying. If the report is accurate, the crowd is wise. If the report is flawed, the crowd is confidently wrong.

  Therefore, the epistemic value of democracy does not come from the mere counting of heads. It comes from the institutional design that fosters **diversity of perspective**. To retain the truth-tracking benefits of the theorem, a society must prioritize structural independence—protecting minority viewpoints, encouraging dissent, and decentralizing information sources—over mere consensus. Without error independence, the majority is not a path to certainty; it is merely a mirror reflecting the size of our shared blind spots.
