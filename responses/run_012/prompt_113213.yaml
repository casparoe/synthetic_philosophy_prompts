answer: |-
  Brainstorming angles: I need to avoid simply restating that "money buys things it shouldn't." The core tension is whether the theory explains the *legal outcome* or just moralizes it. I need to distinguish Walzer's structural boundary-maintenance from Sandel's moral degradation argument. Then I have to hit the relativism problem hard—if social meanings vary, is justice relative? Finally, the transnational issue exposes the assumption of a bounded community inherent in both theories. The goal is to show where the theory illuminates the *conflict* but fails to resolve the *jurisdiction*.

  ***

  Let's cut straight to the bone. The *Baby M* case is the stress test for commodification theory because it forces us to ask whether the objection to surrogacy is about *distribution* (who gets the baby) or *constitution* (what kind of thing a baby is).

  When you run *Baby M* through Walzer's "spheres of justice," the violation is categorical. Walzer argues that justice requires maintaining the autonomy of distinct social spheres. Money belongs to the market sphere; kinship and membership belong to the sphere of care and community. When money determines membership in a family, you allow market dominance to colonize the sphere of kinship. In *Baby M*, the contract attempted to make money the decisive factor in who counts as a mother. For Walzer, this isn't just unfair; it's a category error that destabilizes the social meaning of parenthood. If parenthood is buyable, it ceases to be a status of unconditional care and becomes a transaction of conditional ownership. The theory predicts the court's voiding of the contract because the contract itself was an instrument of sphere colonization.

  Sandel's "corruption" argument is sharper but riskier. He isn't just worried about boundaries; he's worried about virtue. For Sandel, putting a price on gestation doesn't just cross a line; it degrades the good. It transforms the relationship between the surrogate and the child from one of potential gift or altruism into one of production and service. The objection is that commercial surrogacy crowds out non-market norms. In *Baby M*, Mary Beth Whitehead's refusal to hand over the child wasn't just a breach of contract; it was a reassertion of the non-market norm (maternal bond) against the market norm (contractual obligation). Sandel would argue the court was right to void the contract not merely because consent was flawed, but because enforcing it would sanction the degradation of motherhood into labor.

  Now, the honest audit: Where does this theory earn its keep, and where is it post-hoc dressing?

  The New Jersey Supreme Court did not cite Walzer or Sandel. They cited contract law, statutory adoption rules, and the "best interests of the child." They argued you cannot contract away maternal rights before birth and that money shouldn't determine custody. Here, commodification theory provides the *moral substrate* for the legal doctrine of "public policy." Without the idea that some things are degraded by sale, "public policy" is just judicial whim. The theory explains *why* the court felt a visceral resistance to enforcing the contract even when standard contract principles (promise keeping) suggested otherwise.

  However, the theory is post-hoc regarding the *specifics* of the decision. The court focused heavily on coercion and informed consent—the idea that Whitehead couldn't truly consent before birth. That is a liberal, autonomy-based argument, not a commodification argument. You can oppose *Baby M* style contracts purely on grounds of duress without believing that *all* surrogacy is commodification. If the objection were purely Walzerian or Sandelian, the court should have banned surrogacy entirely, not just this contract. They left the door open for altruistic surrogacy. This suggests the court was worried about *exploitation* (a distributional harm) rather than *corruption* (a constitutive harm). So, the theory explains the outcome's gravity, but not its legal precision. It rationalizes the result, but the law got there via autonomy, not ontology.

  Between Walzer and Sandel, Walzer fits the legal logic better. The court was protecting the institution of adoption and family law (spheres) from being bypassed by private contract (market). Sandel's corruption argument is too metaphysical for a court ruling; judges don't usually rule on the moral degradation of virtues, they rule on rights and boundaries. Walzer gives you the structural reason to block the exchange; Sandel gives you the moral reason to feel uneasy about it.

  Now, the transnational divergence. The US (in states like California) permits commercial surrogacy; France and Germany ban it. Does the blocked-exchanges frame explain this?

  Here, Walzer's theory hits a wall. Walzer relies on "shared social meanings." If the social meaning of motherhood in California is compatible with market exchange, and in France it is not, Walzer's theory implies both could be just within their own spheres. This makes the theory radically relativist. It loses its critical bite. If justice is relative to local meaning, then commodification theorists cannot criticize the US market from a French perspective, nor vice versa. They are just different spheres.

  But most commodification theorists want to claim universal human dignity, not local custom. If surrogacy degrades women or children universally (Sandel), then the US is wrong and Europe is right. But the divergence suggests that "motherhood" isn't a fixed natural kind with a single meaning; it's a contested social construct. The theory presupposes a consensus on meaning that doesn't exist. It smuggles in a specific conception of the good (usually a traditional, non-market view of family) and presents it as the "shared meaning." When that meaning isn't shared (as in the US vs. Europe split), the theory either fractures into relativism or becomes imperialistic, imposing one culture's meaning on another.

  This leads to the wrinkle: cross-border reproductive care. French citizens banned from buying surrogacy at home go to Ukraine or the US to buy it. Is the block coherent?

  From a Walzerian perspective, this is a crisis. Walzer's spheres are bounded by political communities. Justice happens within the club. When money allows citizens to exit the club's norms to buy goods abroad, the boundary dissolves. The "blocked exchange" becomes a "blocked domestic exchange," which is just a protectionist barrier for the poor. Only the wealthy can bypass the block. This reveals a silence in the theory: it assumes a closed economy. It has no account of global market integration.

  If the goal is to prevent the corruption of motherhood (Sandel), does it matter if the corruption happens in Kentucky or Kiev? If the harm is universal, the national ban is incoherent because it fails to stop the harm, it just displaces it. It keeps the hands of the state clean while the hands of the citizens get dirty abroad. The theory struggles to explain why the location of the transaction matters morally. If the commodity corrupts the good, it corrupts it regardless of jurisdiction.

  However, there is a defense. The ban might be about *complicity*, not consequence. France bans the contract to ensure the state is not complicit in the commodification, even if citizens evade it. This is a symbolic integrity argument. But this admits the theory is limited to regulating state action, not market outcomes. It protects the *polity's* virtue, not necessarily the *good's* integrity globally.

  So, what does *Baby M* show about the theory?

  It is an anomaly that confirms the theory's diagnostic power but exposes its adjudicative weakness. The theory perfectly diagnoses the *conflict*: the clash between market norms and family norms. It explains why the case felt so much heavier than a standard breach of contract. But it fails to provide a clear *method* for resolution when social meanings are contested (as they were between the Sterns and Whiteheads) or when jurisdictions diverge.

  The theory is silent on the globalization of reproduction. It assumes a world of bounded communities where meanings are stable and enforced. *Baby M* and the subsequent rise of global surrogacy markets show that money is more fluid than meaning. Markets dissolve spheres faster than philosophers can build them. The theory tells us why we should resist, but it doesn't tell us how to block an exchange that can simply move across a border. It remains a powerful critique of *legitimation*—stopping the state from endorsing the market—but it is weak on *prohibition* in a globalized world. It explains the outrage, but not the solution.
