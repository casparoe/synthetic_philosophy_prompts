prompt: |-
  Ok so I'm in this reading group on laws of nature and two people in it have been arguing for like ten weeks straight and neither has moved an inch, and I'm now fairly convinced they're at least partly talking past each other, so I want to write the document they should have produced months ago: the joint statement of an adversarial collaboration between them. Camp one: laws of nature are nothing over and above the regularities -- take the entire history of the world, all the particular facts, and the laws are just whatever the best true description of that history says (best = the one that trades off simplicity, strength and fit in the right way); fix the particular facts and you've fixed the laws, there's no extra ingredient. Camp two: that can't be right, because a law is supposed to do something -- it's what makes the next case come out the way it does, it's what backs the counterfactual about what would have happened in circumstances that never actually arise, and a mere pattern, even a perfectly exceptionless one, doesn't have that kind of grip on the world; laws govern, they necessitate. Camp one says camp two is positing a mysterious glue that no possible observation could ever reveal.

  Here's the stuff I want the document to nail down. (a) A numbered list of agreed claims -- what they both accept about the data, about what laws are for (explanation, counterfactual support, prediction, unification), and, importantly, whether any possible observation or experiment could distinguish the two views, or whether the whole thing is decided by theoretical virtues like simplicity and not multiplying unexplained necessities; if it's the latter I want that said out loud rather than buried. (b) The residual disagreements, each stated in wording its own side would actually sign -- so not a formulation like "camp one denies that laws explain anything" if that's not what they'd accept. (c) The cruxes: the sub-questions such that settling one would move somebody. I've got a couple of candidates I want you to either use or explicitly set aside with reasons: first, can there be two possible worlds with exactly the same total pattern of particular, non-modal facts but different laws (I think camp one has to say no and camp two may want to say yes, but I'm not sure); second, the single-exception world -- a world where some otherwise rock-solid regularity fails at exactly one place and time; is that a law with a boundary condition, a law we've mis-stated, or not a law at all, and does either side's machinery handle it better? (d) For each crux, what case, argument or piece of reasoning both sides would agree actually bears on it, plus each side's prediction written down in advance, and an honest verdict on which parts of the dispute (if any) are merely verbal -- both sides agreeing on the facts and fighting only over the word "law" -- versus genuinely substantive.

  Format it as a numbered agreed-claims section, then a disagreements table (claim / camp one's wording / camp two's wording), then a cruxes section. Don't worry about citing anyone or giving me a reading list, just do the work.
