  # The Ethics of Pest Control: A Decision Tree

  **Instructions:** Follow the branches by answering **Yes** or **No** to each commitment. The leaves represent distinct ethical positions. Note the "Awkward Commitment" for each—the practical or theoretical cost of holding that view.

  ### **Level 1: The Epistemic Stance (Sentience & Uncertainty)**
  **Q1:** Does uncertainty about insect consciousness mandate a **precautionary presumption of welfare** (act as if they feel), or does it permit a **presumption of insentience** (act as if they don't)?
  *   **YES (Precaution):** Welfare counts. → *Go to Level 2A*
  *   **NO (Skepticism):** Welfare negligible. → *Go to Level 2B*

  ---

  ### **Level 2A: The Source of Conflict (Relational vs. Intrinsic)**
  *(For those who presume Welfare counts)*
  **Q2:** Is the label 'pest' sufficient to override the organism's welfare claims (**Intrinsic/Status-based**), or must the human project creating the conflict be justified first (**Relational**)?
  *   **YES (Override):** Human interest trumps welfare. → *Go to Level 3A*
  *   **NO (Justify):** Project must compete with welfare. → *Go to Level 3B*

  ### **Level 2B: The Source of Conflict (Utility vs. Ecology)**
  *(For those who presume Welfare is negligible)*
  **Q2:** Is the justification for control based solely on **direct human utility** (crop yield, comfort), or does **ecological stability** count as a valid constraint?
  *   **YES (Utility):** Direct human gain is enough. → *Go to Level 3A*
  *   **NO (Ecology):** Systemic risk constrains control. → *Go to Level 3B*

  ---

  ### **Level 3A: The Nature of the Wrong (Suffering vs. Death)**
  *(For Override/Utility branches)*
  **Q3:** Is the primary moral cost of control the **manner of removal** (suffering/cruelty), or the **fact of removal** (death/waste)?
  *   **MANNER:** Pain/Cruelty is the cost. → *Go to Level 4*
  *   **FACT:** Death/Waste is the cost. → *Go to Level 4*

  ### **Level 3B: The Nature of the Wrong (Suffering vs. Death)**
  *(For Justify/Ecology branches)*
  **Q3:** Is the primary moral cost of control the **manner of removal** (suffering/cruelty), or the **fact of removal** (death/loss of life)?
  *   **MANNER:** Pain is the cost. → *Go to Level 4*
  *   **FACT:** Death is the cost. → *Go to Level 4*

  ---

  ### **Level 4: The Scope of Calculation (Aggregation & Collateral)**
  **Q4:** Do population scale (billions of targets) and collateral damage (non-target bees, predators) **multiply the moral stakes arithmetically** (Same Ledger), or are they **secondary to the immediate act** (Separate Ledger/Salience)?
  *   **YES (Multiply):** Consequentialist/Holistic arithmetic.
  *   **NO (Secondary):** Deontological/Local arithmetic.

  ---

  ## **The Leaves (Positions)**

  ### **From Level 2B (Skepticism/Welfare Negligible)**

  1.  **Plain Anthropocentrism (Virtue)**
      *   *Path:* Skepticism → Utility → Manner → Secondary.
      *   *Awkward Commitment:* You must condemn cruel traps not because the rodent suffers, but because *you* become a cruel person.
  2.  **Efficient Anthropocentrism**
      *   *Path:* Skepticism → Utility → Fact → Secondary.
      *   *Awkward Commitment:* There is no moral difference between sweeping a floor and fumigating a house, provided the cost is low.
  3.  **Instrumental Holism**
      *   *Path:* Skepticism → Ecology → Fact → Multiply.
      *   *Awkward Commitment:* You must protect a disease-vector mosquito if its extinction collapses a food web, regardless of human risk.
      *   *(Note: Practically overlaps with Ecological Holism below, but metaphysically distinct.)*

  ### **From Level 2A (Precaution/Welfare Counts) → Override (Human Interest Trumps)**

  4.  **Humane Pest Control (The Industry Standard)**
      *   *Path:* Precaution → Override → Manner → Secondary.
      *   *Awkward Commitment:* You accept killing billions as necessary, but must agonize over whether the poison causes 10 seconds of pain.
  5.  **Hierarchical Rights**
      *   *Path:* Precaution → Override → Fact → Secondary.
      *   *Awkward Commitment:* You acknowledge insects have a right to life, but assert humans have a *stronger* right to kill them without needing to prove necessity.
  6.  **Precautionary Middle**
      *   *Path:* Precaution → Override → Manner → Multiply.
      *   *Awkward Commitment:* You must calculate the aggregate suffering of billions of pests to justify a cull, even though you believe human interest ultimately wins.
      *   *(Status: Unexplored. Most who multiply stakes don't accept the Override.)*

  ### **From Level 2A (Precaution/Welfare Counts) → Justify (Project Must Be Defended)**

  7.  **Extensionist Welfarism**
      *   *Path:* Precaution → Justify → Manner → Multiply.
      *   *Awkward Commitment:* Aesthetic damage to a lawn cannot justify the aggregate suffering of a million ants; you must tolerate the damage.
  8.  **Extensionist Rights (Abolitionism)**
      *   *Path:* Precaution → Justify → Fact → Secondary.
      *   *Awkward Commitment:* Killing a single aphid is a rights violation equivalent to killing a mammal; agriculture is inherently unjust.
  9.  **Total Utilitarian (The Bug Counter)**
      *   *Path:* Precaution → Justify → Fact → Multiply.
      *   *Awkward Commitment:* You might be obligated to *increase* pest populations if their total life-hours outweigh the suffering of their predators.
      *   *(Status: Incoherent/Unattractive. Rarely defended.)*
  10. **Ecological Holism (Deep Ecology)**
      *   *Path:* Precaution → Justify → Fact → Multiply (Systemic).
      *   *Awkward Commitment:* Individual suffering is irrelevant; you may cull a species painlessly if it threatens the "health" of the whole.
      *   *(Note: Practically overlaps with Instrumental Holism, but values the system intrinsically, not just for humans.)*

  ---

  ### **Notes on Gaps and Overlaps**

  *   **The "Same Upshot" Problem:** **Instrumental Holism (3)** and **Ecological Holism (10)** often yield identical policy recommendations (preserve the web), but differ on *why* (human survival vs. intrinsic value of nature). The tree separates them at Level 2B/2A.
  *   **The Unoccupied Gap:** **Skepticism + Fact + Multiply.** (Why count the arithmetic of dead things that didn't matter when alive?) This view is generally **incoherent** unless grounded in a theological "Sanctity of Nature" that ignores sentience.
  *   **The Relational Distinction:** Notice how **Plain Anthropocentrism (1)** treats 'pest' as intrinsic (the bug is the problem), while **Extensionist Welfarism (7)** treats it as relational (the lawn is the problem).
  *   **Scale & Collateral:** Level 4 forces you to decide if a bee dying next to the target pest is *one death* or *two deaths* (Same Ledger), or if the bee is a 'regulatory issue' and the pest is a 'moral issue' (Separate Ledger).
