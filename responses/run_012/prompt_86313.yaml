answer: |-
  Here is the specification of desiderata for a theory of patternhood, framed within the Physical, Design, and Intentional stances, without presupposing the ontological relations between them.

  ### I. Cases the Account Must Get Right

  1.  **Thermodynamic Variables (Temperature/Pressure):** The theory must validate the reality of macroscopic statistical properties without requiring them to be type-identical to specific microphysical configurations.
      *   *Motivation:* If the theory reduces temperature strictly to mean kinetic energy of specific particles, it fails to capture the functional reality of the variable across different physical substrates.
  2.  **Mental States (Beliefs vs. Neurons):** The theory must allow a belief (e.g., "it will rain") to be a real pattern distinct from the specific neural firing sequence realizing it at time *t*.
      *   *Motivation:* If the theory cannot distinguish the intentional pattern from the physical substrate, the special sciences (psychology) collapse into physics, rendering the dissertation's core question moot.
  3.  **Artifactual Agency (Chess Program):** The theory must account for the patterns of play (strategy, blunders) in a computer as real, despite the system lacking biological consciousness.
      *   *Motivation:* This tests the Design Stance. If patterns require biological intent, the theory fails to capture the reality of functional organization in non-living systems.
  4.  **Physical Regularities (Planetary Orbits):** The theory must classify Keplerian regularities as real patterns, not merely summaries of particle trajectories.
      *   *Motivation:* This anchors the theory in the Physical Stance. If the theory treats high-level physical laws as less real than low-level collisions, it violates scientific practice.
  5.  **Accidental Regularities (Spurious Correlation):** The theory must classify statistically robust but causally disconnected regularities (e.g., niche market trends correlating with solar cycles) as *not* real patterns.
      *   *Motivation:* This prevents the theory from validating coincidences. Reality must exceed mere statistical compressibility.
  6.  **Observer-Relative Visibility (Encryption/Camouflage):** The theory must allow a pattern to be real even if detectable only by an observer with a specific key or sensory apparatus.
      *   *Motivation:* This prevents the theory from making reality contingent on universal human detectability. Reality must be stance-relative but not stance-*dependent* in a subjective sense.

  ### II. Distinctions the Account Must Not Collapse

  7.  **Real vs. Merely Useful:** The theory must provide a criterion for when a pattern corresponds to something in the world versus when it is merely a convenient heuristic for prediction.
      *   *Motivation:* This is the direct response to the physicist friend. If "real" means nothing more than "useful," the special sciences are merely engineering, not ontology.
  8.  **Pattern vs. Aggregate:** The theory must distinguish a structured regularity from a mere list or conjunction of events (e.g., "all the coins in my pocket" vs. "law-governed metallic behavior").
      *   *Motivation:* Aggregates lack counterfactual support; patterns must support inference beyond the observed instances.
  9.  **Identity vs. Salience:** The theory must distinguish what the pattern *is* from how *noticeable* it is to a specific cognitive system.
      *   *Motivation:* A pattern does not pop in and out of existence based on whether an observer is tired or attentive.
  10. **Relative to Stance vs. Arbitrary:** The theory must allow patternhood to be relative to a stance (Physical, Design, Intentional) without making the existence of the pattern arbitrary or subjective.
      *   *Motivation:* This is the core Dennettian constraint. It must avoid naive realism (one true description) and radical constructivism (anything goes).
  11. **Prediction vs. Explanation vs. Co-occurrence:** The theory must distinguish patterns that generate accurate predictions, those that reveal underlying mechanisms, and those that merely track effects.
      *   *Motivation:* A theory that equates predictive success with explanatory reality validates astrology alongside astronomy.

  ### III. External Results the Account Must Be Consistent With

  12. **Description-Language Relativity:** The theory must acknowledge that measures of complexity or compression are relative to a chosen language or encoding scheme; there is no "view from nowhere" on complexity.
      *   *Motivation:* Mathematical results on Kolmogorov complexity show no compression scheme is privileged. A philosophical theory cannot assume a God's-eye vocabulary.
  13. **Multiple Realization:** The theory must accommodate the fact that special science kinds (e.g., "pain," "gene," "currency") are typically realized by heterogeneous physical kinds.
      *   *Motivation:* Empirical consensus in cognitive science and biology suggests type-identity theory is false. The theory of patterns must not require physical uniformity.
  14. **Intentional Stance Accuracy:** The theory must explain why treating systems as rational agents yields high-fidelity predictions, despite the systems potentially being deterministic physical objects.
      *   *Motivation:* Folk psychology works. A theory that dismisses intentional patterns as strictly false cannot account for this empirical success.

  ***

  ### IV. Critical Tensions and Filters

  #### The Incompatible Pair
  **Requirement 11 (Prediction/Explanation/Co-occurrence) and Requirement 12 (Description-Language Relativity).**

  There is a strong case that these cannot be jointly satisfied without significant qualification. Requirement 11 demands that the theory distinguish between a pattern that *explains* (implies causal structure) and one that merely *predicts* (implies correlation). However, Requirement 12 asserts that there is no privileged description language to measure complexity or structure. If "explanation" relies on identifying causal structure, and causal structure is identified via specific descriptive vocabularies (e.g., physical forces vs. informational states), then claiming one vocabulary captures the "explanatory" pattern while another captures only the "predictive" pattern risks violating the prohibition on privileged languages. To satisfy 12, you must admit that causal structure is itself stance-relative; to satisfy 11, you often need to posit that causal structure is stance-invariant.

  #### The "Killer" Requirement
  **Requirement 7 (Real vs. Merely Useful).**

  Taken seriously, this requirement eliminates the greatest number of otherwise attractive accounts.
  *   **Naive Instrumentalism** fails immediately (it denies the distinction).
  *   **Reductive Physicalism** fails because it typically categorizes special science patterns as "merely useful" summaries of physical facts rather than real in their own right.
  *   **Pure Compression Accounts** (e.g., standard algorithmic information theory) often fail because compression is inherently pragmatic (useful for saving space/time); without an additional metaphysical anchor, "compressible" collapses into "useful."
  *   **Causal Power Accounts** struggle here too, unless they can specify how a pattern has causal power without violating the causal closure of the physical (which would make the pattern *physical*, not special science).

  To satisfy Requirement 7 while also satisfying Requirement 10 (Stance vs. Arbitrary) and Requirement 12 (Language Relativity) is the central metaphysical tightrope of the Dennettian project. Most theories sacrifice 7 to save 12 (becoming instrumentalist) or sacrifice 12 to save 7 (becoming naive realist).

  ***

  ### V. Brief Account Evaluation

  **Compression-Based Accounts:**
  These fare well on **Language Relativity (12)** and **Observer Variance (6)**, as they explicitly model patterns as data savings relative to an encoder. However, they struggle catastrophically with **Real vs. Useful (7)**. Without an independent criterion for which compression schemes track *world-structure* versus *mind-structure*, they cannot answer the physicist friend; they confirm his suspicion that patterns are just efficient fictions.

  **Causal-Explanatory Accounts:**
  These fare well on **Real vs. Useful (7)** and **Prediction vs. Explanation (11)**, as they ground patterns in causal powers. However, they struggle with **Multiple Realization (13)** and **Language Relativity (12)**. Causal accounts often implicitly assume a privileged "causal grain" (usually physical). If they cannot explain how a pattern realized by disparate physical causes constitutes a *single* causal pattern without begging the question, they fail the multiple realization constraint.
