      *   *Vulnerability 3 (The Historian):* "You're using 'invented tradition' loosely. Hobsbawm meant X, you're saying Y. Also, nations have material bases too." (Precision objection).
      *   *Vulnerability 4 (The Philosopher):* "Invented doesn't mean false, but you're implying it's *only* invented. Are you a realist about the radionuclides?" (Epistemological objection).
      *   *Vulnerability 5 (The Hard-Rock Skeptic):* "I told you so. It's not science, it's activism." (Hostile dismissal).
      *   *Vulnerability 6 (The Agency Problem):* "You say 'Humanity' is the invented agent. But some humans did more than others. Does your thesis erase inequality?" (Political/Ethical objection).
      *   *Vulnerability 7 (The Golden Spike):* "If the date is political, why bother with stratigraphy at all? Why not just pick a date by vote?" (Methodological objection).
