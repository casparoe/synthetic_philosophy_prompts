      *   **Audience:** ~20 people. Mostly Quaternary geologists/stratigraphers (care about formalization, AWG). Some hard-rock geologists (skeptics of the whole concept). One historian of science (knows the literature). One philosopher of science (scientific realist, dislikes "invented"). No political theorists.
