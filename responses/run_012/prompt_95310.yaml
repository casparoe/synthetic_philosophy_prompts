answer: |-
  This is the right way to ask the question. The pop-sci version treats Landauer's Principle as a tax law ("forgetting costs money"), but the physical reality is about phase space topology and the conservation of information under Hamiltonian dynamics.

  Here is the conceptual machinery, broken down by your three challenges.

  ### 1. Measurement vs. Erasure: The Phase Space Argument

  **Why measurement is (in principle) free:**
  Think of the combined state of the System ($S$) and the Demon's Memory ($M$) as a volume in phase space.
  *   **Initial State:** $S$ is uncertain (spread out in phase space), $M$ is in a standard "ready" state (localized).
  *   **Measurement:** This is a interaction that correlates $S$ and $M$. If $S$ is in state $0$, $M$ goes to $0$. If $S$ is in $1$, $M$ goes to $1$.
  *   **Phase Space Topology:** Before measurement, the total phase space volume is the product of the uncertain $S$ and the sharp $M$. After measurement, the total volume is the *same*. It has just been sheared. The uncertainty hasn't vanished; it has been transferred into the *correlation* between $S$ and $M$.
  *   **Reversibility:** Because the mapping from (pre-measurement) to (post-measurement) is one-to-one (bijective), you can run the dynamics backward. If you know the final state of $M$ and $S$, you can recover the initial state. No Liouville theorem violation occurs. No entropy is generated.

  **Why erasure is the cost:**
  To make the demon a *cycle* engine, $M$ must return to the standard "ready" state, regardless of what it measured.
  *   **The Mapping:** You need a map that takes $\{(S=0, M=0), (S=1, M=1)\} \to \{(S=0, M=0), (S=1, M=0)\}$.
  *   **The Problem:** This is a many-to-one mapping for the memory variable. Two distinct regions of phase space (Memory=0 and Memory=1) are being compressed into one region (Memory=0).
  *   **Liouville's Theorem:** Hamiltonian dynamics cannot compress phase space volume. If you force the memory variable into a smaller volume, the volume must go *somewhere else*.
  *   **The Payment:** The only place for that phase space volume to go is into the uncontrolled degrees of freedom of the environment (heat). You must expand the thermal phase space to compensate for the compression of the memory phase space. This expansion is heat dissipation ($k_B T \ln 2$).

  **The "Logical Irreversibility" Claim:**
  When people say "logical irreversibility," they mean you cannot infer the input from the output. If output is "Reset", input could have been "0" or "1".
  *   **Does reversible erasure rescue the demon?** No. You can perform a "reversible" erase only by swapping the dirty bit with a fresh "zero" bit from a reserve. But now the dirty bit exists elsewhere. You haven't destroyed the entropy; you've moved it. To run indefinitely, you need an infinite reserve of fresh zeros. If you have a finite reserve, you eventually must reset the dirty bits, and *that* is where the phase space compression (and heat cost) happens.
  *   **Where the cheater pushes:** A cheater argues, "I'll just keep adding memory." The counter-argument is that a finite physical system has finite phase space. Once the memory is full, you must compress to continue. The cost isn't in the *act* of thinking; it's in the *capacity limit* of the thinker.

  ### 2. Internal Memory: The Demon is the Gas

  Suppose the demon uses the gas particles' own spins as memory. There is no external box.

  **Does the exorcism hold?**
  Yes. The distinction between "system" and "demon" is arbitrary in statistical mechanics. The total system is Gas Positions + Gas Spins.

  **What pays for the work?**
  The currency here is **Mutual Information**.
  *   Let $X$ be particle position, $Y$ be particle spin.
  *   Initially, $X$ and $Y$ are uncorrelated. Total Entropy $H(X,Y) = H(X) + H(Y)$.
  *   The demon operates by creating a correlation: e.g., "If spin is Up, let particle go Left."
  *   After sorting, the marginal entropy of position $H(X)$ decreases (gas is ordered). This allows work extraction.
  *   However, the total entropy $H(X,Y)$ cannot decrease (Second Law). Therefore, the mutual information $I(X:Y)$ must increase. $H(X,Y) = H(X) + H(Y) - I(X:Y)$.
  *   **The Cost:** The "work" extracted comes from the reduction in $H(X)$. But you have "paid" for it by consuming the independence of $X$ and $Y$. The system is now in a highly correlated non-equilibrium state.

  **Does it matter if anyone reads the record?**
  No. "Reading" is a pop-sci distraction. Physics cares about **correlations**, not observers.
  *   If the spins are correlated with positions, the phase space volume of the *joint* system is constrained to a sub-manifold.
  *   To extract *more* work in a cycle, you must decouple the spins from the positions (reset the correlation).
  *   Decoupling requires randomizing the spins relative to the positions. This randomization increases the marginal entropy of the spins (or the environment), exactly balancing the work gained from sorting the positions.
  *   **Where the cheater pushes:** The cheater says, "The spins are part of the gas, so I'm just rearranging the gas." The counter is: You aren't rearranging the gas into a state of lower *total* entropy. You are rearranging it into a state of lower *configurational* entropy but higher *correlational* entropy. You cannot extract work from a single heat bath *and* leave the correlations intact forever. Eventually, the correlations saturate, and the engine stops.

  ### 3. The One-Shot and the Circularity Charge

  **The One-Shot Case:**
  One measurement, one extraction, walk away. Never reset.
  *   **Verdict:** The Second Law is **not** violated, but the premise of the violation changes.
  *   **Why:** The Second Law (in the Kelvin-Planck statement) forbids extracting work from a single heat bath in a *cycle*. If you don't cycle the demon, the demon is not an engine; it is **fuel**.
  *   **The Accounting:** The initial state of the demon was a low-entropy state (a blank register). The final state is a high-entropy state (a random register). The work extracted comes from the entropy difference between the demon's initial and final states. You have burned the demon's order to sort the gas.
  *   **Conclusion:** If you don't wipe the memory, you haven't beaten the Second Law; you've just converted the demon's internal free energy into work.

  **The Circularity Charge:**
  *"We only know erasure costs $k_B T \ln 2$ because we assume the Second Law. So using erasure to save the Second Law is circular."*

  This is the most sophisticated objection (championed by John Norton). Here is the load-bearing premise that avoids circularity:

  1.  **Macroscopic 2nd Law:** Entropy of an isolated system never decreases. (Do **not** use this to prove Landauer).
  2.  **Microscopic Reversibility (Liouville/Unitarity):** Phase space volume is conserved under Hamiltonian dynamics. (Use **this**).

  **The Non-Circular Derivation:**
  *   Assume Microscopic Reversibility is true (it's a property of Newtonian/Quantum dynamics, not thermodynamics).
  *   Assume the definition of Thermodynamic Entropy matches the Statistical Entropy (Boltzmann/Gibbs/Shannon) for equilibrium states.
  *   **Argument:** Erasure compresses the phase space of the memory device. To conserve total phase space volume (Liouville), the phase space of the thermal environment must expand.
  *   Expansion of thermal phase space $\to$ Increase in Thermal Entropy $\to$ Heat Dissipation.
  *   **Result:** You derive the cost of erasure from **Dynamics**, not Thermodynamics. You then *use* that cost to prove that the Macroscopic 2nd Law holds for the composite system.

  **Is it fair?**
  It is fair to worry about circularity if you derive Landauer from the Macroscopic 2nd Law. But modern exorcisms derive Landauer from **Liouville's Theorem**.
  *   **The Load-Bearing Premise:** The conservation of phase space volume.
  *   **Where the cheater pushes:** The only way to beat the argument is to propose a physical dynamics that allows phase space compression without compensation (i.e., violate Liouville's theorem). If you do that, you aren't just beating Maxwell's Demon; you are breaking Hamiltonian mechanics and allowing perpetual motion of a much more direct kind.

  ### Summary of the Machinery

  1.  **Measurement** creates correlations (shears phase space); it does not reduce volume. It is reversible.
  2.  **Erasure** destroys correlations (compresses phase space); it requires volume expansion elsewhere (heat). It is irreversible.
  3.  **Internal Memory** just shifts the bookkeeping from "System vs. Demon" to "Degree of Freedom A vs. Degree of Freedom B." The cost is paid in Mutual Information.
  4.  **One-Shot** processes consume the demon's initial low entropy. The demon is fuel, not an engine.
  5.  **Circularity** is avoided by grounding the cost in Microscopic Reversibility (Liouville), not Macroscopic Thermodynamics.

  **The Ultimate Exorcism:**
  Maxwell's Demon fails not because "information is physical" (a slogan), but because **information is phase space volume**. You cannot reduce the volume of one variable (the memory) without expanding the volume of another (the heat bath), provided the underlying dynamics preserve total volume. The Second Law is simply the macroscopic shadow of Liouville's Theorem.
