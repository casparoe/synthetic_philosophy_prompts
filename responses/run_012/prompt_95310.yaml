prompt: |-
  Ok, I need someone to sort out Maxwell's demon for me properly, and I don't want the pop version where the punchline is just "the demon has to forget, and forgetting costs kT ln 2 per bit, so the second law is safe." I basically already know that punchline. What I want is the conceptual machinery, at the level of the argument rather than the algebra.

  First: why does the cost get pinned on resetting the memory rather than on the act of measuring? What exactly goes wrong with a version of the story where the dissipative step is the measurement itself? And I keep seeing it said that the real point is about logical irreversibility, so that a demon which keeps a copy of its records can erase them reversibly and pay nothing — what does that even mean, and does it rescue the demon or just rellocate the problem?

  Second, here's the case I can't do on my own. Suppose the demon has no separate memory register at all: it records what it learns by flipping degrees of freedom of the very gas it's sorting — say, spins that are part of the same system. So there's no little box of bits off to the side waiting to be wiped. Does the exorcism still go through? If yes, what is it that pays for the work the demon extracts, and does it matter whether anyone ever reads the record? If no, what does that tell us about which premise was doing the work all along?

  Third, drop the cycle. One measurement, one extraction of work, then everyone walks away and nobody ever wipes anything. Is the second law actually violated there, or is the standard resolution quietly leaning on the requirement that the demon return to its starting condition? And I have a nagging feeling the whole thing is circular — that we only know the erasure has to cost kT ln 2 because we've already assumed the second law. Is that fair, or is there an independent way to get the erasure cost?

  I don't need the history or who said what; I need to see which premise is loadbearing and where someone who wanted to cheat the argument would push.
