          3.  What if we drop the cyclic requirement (one-shot deal)? Is the Second Law violated? Is the argument circular (assuming the 2nd Law to prove Landauer's Principle)?

  2.  **Deconstruct Question 1: Measurement vs. Erasure & Logical Irreversibility.**
      *   *Standard View:* Measurement can be reversible. Erasure is logically irreversible.
      *   *Why Measurement isn't the cost:* In principle, a measurement is a correlation establishment between system and apparatus. If the apparatus starts in a standard state $|0\rangle$ and ends in $|0\rangle$ or $|1\rangle$ depending on the system, this is a mapping $(S, A) \to (S', A')$. If this mapping is bijective (one-to-one), it's logically reversible. Hamiltonian dynamics are reversible. So, measurement *can* be done without dissipation *if* we don't care about the final state of the apparatus.
      *   *Why Erasure is the cost:* To run the demon cyclically, the apparatus must return to its standard state $|0\rangle$ to measure again. Mapping $\{|0\rangle, |1\rangle\} \to |0\rangle$ is many-to-one. Information is lost. This is logical irreversibility.
      *   *Landauer's Principle:* Logical irreversibility *must* be accompanied by physical irreversibility (entropy increase in the environment) to preserve the reversibility of the underlying physics (Liouville's theorem/Unitarity).
      *   *The "Cheater's" Push:* A cheater would say, "I'll just keep accumulating memory." But then the memory fills up. The cost isn't paid *now*, but it's deferred. The debt comes due when memory is finite.
      *   *Reversible Erasure?* You can't erase a bit reversibly *in isolation*. You can swap it with a fresh zero, but then the "trash" bit holds the entropy. You haven't destroyed entropy; you've moved it. To truly reset, you must dump entropy into a thermal bath.

  3.  **Deconstruct Question 2: Internal Memory (Spins in the Gas).**
      *   *Scenario:* Demon uses the gas's own degrees of freedom (e.g., spin states) as memory. No external box.
      *   *Analysis:* This is effectively a correlation within the total system. The demon sorts particles based on position *and* spin.
      *   *The Cost:* If the demon uses spin states to record information, those spins become correlated with positions. The total entropy of the gas (position + spin + correlations) must be tracked.
      *   *Exorcism:* Yes, it still goes through. The "memory" is now part of the thermodynamic system. To reset the spins (to use them again or to claim the gas is in a pure low-entropy state), you must decouple the correlations.
      *   *What pays?* The mutual information. The extracted work comes from the reduction in configurational entropy, but this is paid for by an increase in the entropy of the memory degrees of freedom (or the correlations). If you don't reset the spins, you haven't created a perpetual motion machine; you've just created a highly correlated non-equilibrium state. You can't extract *net* work from a single heat bath *and* leave the system in a state capable of repeating the process without input.
      *   *Does reading matter?* No. Physical correlations exist regardless of observation. The "demon" is just a mechanism establishing correlations.

  4.  **Deconstruct Question 3: One-Shot vs. Cycle & Circularity.**
      *   *One-Shot:* Measure, sort, extract work, walk away.
      *   *Verdict:* Second Law is *not* violated in a one-shot process if you account for the final state of the demon/system. The total entropy (System + Demon) increases or stays same. The work extracted is bounded by the free energy change, which includes the information term. $W \le -\Delta F + k_B T I$. If you don't reset the demon, $\Delta F$ includes the cost of the demon's changed state.
      *   *Cyclic Requirement:* The Second Law is fundamentally about cycles (returning to initial state) or isolated total systems. If the demon changes state permanently, it's part of the fuel.
