prompt: |-
  I cover science and ideas for a mid-size daily, and I've somehow volunteered to run next month's session of our newsroom's AI-and-accountabilty thing: 45 minutes, eight reporters, a photo editor and two product people, all of whom are confident they know what the frame problem is, because it gets name-dropped in every thinkpiece about agents. Last time one of them used it to mean "the model can't see outside its training data," and by the time I'd said "relevance" three times I'd lost the room.

  Don't explain the frame problem to me. Plan how I explain it to them. I want the order the pieces have to come in, and why each has to wait for the one before it -- what actually depends on what, not just a pleasing narrative arc. Somewhere near the front there's a distinction I keep groping for and mangling: (a) the bookkeeping version, where the world changes and you shouldn't have to re-list everything that didn't; (b) the version about knowing what's even worth considering; (c) the version about how you'd ever know you've considered enough. I honestly don't know if that's three problems or one problem in three coats, so tell me, and if it's really one, give me the framing that does the work -- my fear is the room walks out holding (a) and missing the point entirely. The thesis I'd like the arc to earn, if you think it's defensible: this was never fundamentally a puzzle about logic, it's a condition any agent is in the moment it has to decide what to think about next.

  Pick one example to carry the whole session, and tell me what it has to have and what it has to lack. Not the blocks-world stuff, not the turkey-and-gun puzzle, not that old robot-with-a-bomb story: the greybeards on the desk have heard all three and they read as museum pieces, so the room files the topic under "old AI, either solved or abandoned." Whatever you pick also has to survive being retold at a bar afterwards by someone who isn't a specialist.

  Then the misconceptions, in the order they'll actually surface, with the exact spot in my sequence where I head each one off. I'm expecting: "so it's basically the context window," "you fix it by writing more rules," "it's philosophy, there's no engineering content," and "LLMs made it moot." That last one I want handled without me overclaiming in either direction -- I don't want to stand up and tell a room of reporters that current models have relevance licked, and I don't want to tell them nothing has changed since the eighties either.

  One question I can ask at the end that shows me whether it landed rather than whether they can parrot my sentences back, and a short list of what I should openly refuse to get into at this level. Practical please -- I'm not reading Heidegger for a lunch session.
