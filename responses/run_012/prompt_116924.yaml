answer: |-
  Here is the session plan. It is designed to move from the concrete (engineering constraints) to the abstract (agency) without losing the room, using your newsroom's own workflow as the anchor.

  ### The Core Distinction: One Problem, Three Layers
  You asked if (a), (b), and (c) are three problems or one.
  **Verdict:** It is **one problem** (Combinatorial Explosion of Context) viewed through three operational layers.
  **The Framing:** Do not present them as separate definitions. Present them as **stages of filtering.**
  *   **(a) Bookkeeping** is the *Cost* layer (Updating state is expensive).
  *   **(b) Relevance** is the *Signal* layer (Salience is hard to define).
  *   **(c) Sufficiency** is the *Risk* layer (Stopping too early is dangerous).
  *   **Why this order?** You cannot explain why *Relevance* matters if they don't first feel the pain of *Bookkeeping*. You cannot explain *Sufficiency* (the risk) until they understand the *Relevance* filter. If you start with (c), it sounds like paranoia. If you start with (a), it sounds like optimization. You need to walk them up the ladder.

  ---

  ### The Example: "The AI Assignment Editor"
  **The Scenario:** An AI agent runs the morning assignment desk. There are 50 incoming tips (fires, council meetings, celebrity sightings, press releases). There are 8 reporters. The AI must decide which 5 stories to cover *right now*.

  **Why this example:**
  1.  **It carries the load:** It requires tracking state (who is busy), judging value (what is news), and bounding risk (what did we miss).
  2.  **It survives the bar test:** "It's like the editor who sent the cub to the presser while the building burned down."
  3.  **It avoids "Museum Piece" syndrome:** It's not a robot with a bomb; it's a tool they actually fear/want.
  4.  **It fits the Thesis:** It forces the agent to "decide what to think about next."

  **What it must have:**
  *   **Limited Resources:** Explicitly state there are only 8 reporters. Scarcity creates the Frame.
  *   **Dynamic State:** Reporters get sick, cars break, tips turn out false. The world changes *while* the AI decides.
  *   **Second-Order Effects:** One story leads to another.

  **What it must lack:**
  *   **Moral Judgement:** Do not make it about "bias" yet. Keep it about *utility* and *efficiency*. Bias complicates the Frame; it isn't the Frame.
  *   **Human Emotion:** The AI doesn't "care" about the fire. It cares about the *metrics* of the fire. This highlights the relevance gap.

  ---

  ### The Sequence (45 Minutes)

  #### 1. The Hook & The Bookkeeping Layer (0:00 – 0:10)
  *   **Action:** Put the scenario on the screen. 50 tips, 8 reporters.
  *   **The Move:** Ask, "Before the AI picks a story, what does it have to know about the reporters?"
  *   **The Point (Layer A):** It has to know Reporter A is busy. If Reporter A becomes free, the AI must update that fact.
  *   **The Trap:** If the AI has to check *every* fact in the universe to see if it changed (e.g., "Is the moon still there?"), it will never assign a story.
  *   **Head Off Misconception #1: "So it's basically the context window."**
      *   *Where:* Immediately after explaining Layer A.
      *   *The Line:* "A context window is just how much text you can hold. The Frame Problem is knowing which text *matters* once you're holding it. You can have a million-token window and still assign the reporter to the cat tree instead of the fire."
  *   **Dependency:** You must establish the *cost* of updating facts before you can explain why we need a filter.

  #### 2. The Relevance Pivot (0:10 – 0:25)
  *   **The Move:** Now assume the AI knows who is free. How does it pick the story?
  *   **The Point (Layer B):** A fire is 'relevant.' A press release is 'less relevant.' But why? Because of audience impact.
  *   **The Thesis Earn:** This is where you state your thesis: *"This is not a logic puzzle. This is the condition of agency. The moment you have to act, you must ignore 99% of the world. The Frame Problem is the engineering cost of that ignorance."*
  *   **Head Off Misconception #2: "You fix it by writing more rules."**
      *   *Where:* When they suggest "Just tell the AI fires are important."
      *   *The Line:* "If you write a rule for 'Fire,' you miss 'Gas Leak.' If you write a rule for 'Gas Leak,' you miss 'Explosion Risk.' You cannot write enough rules to cover the world. That's the Frame."
  *   **Head Off Misconception #3: "It's philosophy, there's no engineering content."**
      *   *Where:* Immediately after stating the Thesis.
      *   *The Line:* "Philosophers named it. Engineers pay for it. Every millisecond the AI spends weighing the 'Cat Tree' story is latency. Every wrong assignment is a churned subscriber. This is a cost function."
  *   **Dependency:** You must establish that rules fail (Layer A failure) before you can argue that *salience* (Layer B) is the only way forward.

  #### 3. The Sufficiency Horizon (0:25 – 0:35)
  *   **The Move:** The AI assigns the Fire. Great. But was it enough?
  *   **The Point (Layer C):** What if the Fire was a distraction for a Heist? What if the Council Meeting was where the Mayor resigned?
  *   **The Problem:** How does the agent know when to *stop* looking for connections?
  *   **Head Off Misconception #4: "LLMs made it moot."**
      *   *Where:* As you transition to the modern context.
      *   *The Line:* "LLMs don't solve the Frame; they probabilize it. They guess relevance based on tokens, not logic. They are better at (b) Relevance than the old systems, but they are *worse* at (c) Sufficiency. They hallucinate connections because they are designed to complete patterns, not bound them. They haven't solved the problem; they've just made the errors smoother."
  *   **Dependency:** You cannot explain why LLMs fail at Sufficiency until the room understands that Sufficiency is about *stopping criteria*, not *generation capability*.

  #### 4. The Diagnostic & Close (0:35 – 0:45)
  *   **The Thesis Recap:** The Frame Problem is the tax we pay for having an agent that acts in a world it doesn't fully control.
  *   **The Diagnostic Question:**
      *   *Do not ask:* "What is the Frame Problem?"
      *   *Ask:* **"The AI assigned the Fire story. It turned out the Fire was an arson distraction for a Bank Heist three blocks away. The AI missed the Heist. Did the AI fail at Bookkeeping, Relevance, or Sufficiency?"**
      *   *Correct Answer:* **Sufficiency.** (It stopped looking for connections too early. It judged the Fire as 'closed' without checking the perimeter).
      *   *Why this works:* It tests if they understand the *boundaries* of the frame, not just the content. If they say "Relevance," they think the Heist wasn't important. If they say "Bookkeeping," they think the AI forgot the Bank existed. "Sufficiency" means they understand the AI didn't know *how far to look*.
  *   **Refusal List (What to explicitly table):**
      1.  **Consciousness:** "We are not discussing if the AI 'knows' anything."
      2.  **Symbolic Logic Syntax:** "We are not writing predicates today."
      3.  **Phenomenology/Heidegger:** "We are not discussing 'being-in-the-world' in the existential sense, only the operational sense."

  ### Summary of Dependencies (Why this order?)
  1.  **Bookkeeping first:** Because it's the only layer that feels like "code." It gets the skeptics nodding.
  2.  **Relevance second:** Because you need the failure of Bookkeeping (too many rules) to justify the need for Relevance (salience).
  3.  **Sufficiency third:** Because you need the concept of Relevance to define what "Enough" looks like.
  4.  **LLMs last:** Because you need the definition of the problem established before you can evaluate the proposed solution.

  ### Practical Tips for the Room
  *   **The "Frame" Visual:** Draw a circle on the whiteboard. Inside: "What the AI thinks matters." Outside: "The rest of the universe." The Frame Problem is the line itself. Is it permeable? Who draws it?
  *   **Manage the Product People:** They will try to turn this into a "requirements gathering" issue. Remind them: "You can't requirement-gather the entire world."
  *   **Manage the Reporters:** They will try to turn this into a "bias" issue. Remind them: "Bias is when the frame is skewed. The Frame Problem is that there is a frame at all."

  This structure respects their intelligence, uses their language, and lands the thesis without getting bogged down in the history of GOFAI.
