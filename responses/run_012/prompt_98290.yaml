      *   *Key distinction:* In Sorites, we are comfortable with "vagueness." In Spectrum, the intuition is often that the *value difference* is negligible, not that the *comparison* is vague.
      *   *Transitivity:* If "Better than" is intransitive, the spectrum argument doesn't lead to a contradiction; it leads to a cycle. The friend wants to preserve transitivity to force the contradiction and then reject the premises. But if transitivity fails, the contradiction vanishes without rejecting the premises.
      *   *Does the Sorites move earn transitivity?* No. The Sorites move is about *vagueness*. Transitivity is about *order structure*. You can have a vague transitive relation. You can have a precise intransitive relation. They are orthogonal. The friend is conflating "blocking the induction" with "preserving transitivity."

