      *   **Problem:** The user understands the positions but lacks a meta-understanding of what a theory of KH is *supposed* to achieve (the desiderata).
      *   **Task:** Create a comprehensive list of desiderata (requirements) for an adequate theory of know-how/practical knowledge/skill.
      *   **Inputs:** Six specific cases/considerations provided by the user (Sous-chef, Rusty Case, Improv, Gradability, Animals/Babies, Linguistic Ambiguity).
      *   **Specific Constraints:**
