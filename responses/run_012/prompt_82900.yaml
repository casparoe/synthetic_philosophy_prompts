          *   Non-Negotiable: Linguistic Data (it's the evidence), Rusty Case (strong intuition), Guidance (must guide action).
          *   Negotiable: Ability Entailment (Ryle vs S&W), Conceptualism (Animals), Gradability (can be explained away).

      *   *Wait, re-reading the prompt's specific request on collisions:* "If some subset of the requirements can't be satisfied together, say which, and say what the cheapest thing to give up is."
      *   *Key Insight:* The "Ambiguity Thesis" (KH means different things in different contexts) is the standard escape hatch. It allows satisfying all desiderata by splitting the subject matter. Is that "giving up"? Yes, it gives up *univocality*.

  10. **Final Polish:** Ensure the distinction between "Know-How" (epistemic) and "Skill" (dispositional) is clear, as the user noted this confusion.

