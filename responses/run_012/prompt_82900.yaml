answer: |-
  This is the right moment to pause. The reason you feel stuck is that the debate has shifted from "What is know-how?" to "Which intuitions are we willing to sacrifice to save our metaphysics?" The literature often smuggles contested theoretical commitments in as neutral desiderata.

  Below is the specification list you asked for. I have anchored each requirement to your six cases. I have marked them **Non-Negotiable** (if a theory violates this, it fails to capture the phenomenon we pre-theoretically care about) or **Negotiable** (a theoretical cost a camp might willingly pay). I have also flagged where there is *not* common ground.

  At the end, I map the collisions and suggest the cheapest trade-off.

  ### The Desiderata Specification

  **1. The Guidance Constraint**
  *   **Motivation:** (1) The Sous-Chef. The chef fixes the sauce; the scientist cannot.
  *   **Requirement:** An adequate theory must explain why know-how reliably *guides successful action* in a way that mere theoretical knowledge does not. Possessing KH must make a difference to performance.
  *   **Status:** **Non-Negotiable.** (Common Ground). If a theory cannot distinguish the chef from the scientist, it isn't a theory of *practical* knowledge.
  *   **Scorecard:**
      *   *Ryle:* Pass. KH is a disposition to succeed; guidance is built-in.
      *   *Intellectualism (S&W):* Struggle. Must explain why contemplating a proposition guides action better than contemplating a different one (the "regress" worry).
      *   *Ability-First:* Pass. KH just *is* the ability (or a cluster of them); guidance is constitutive.

  **2. The Retention Constraint**
  *   **Motivation:** (2) The Rusty Case. The stroke victim still "knows how" despite inability.
  *   **Requirement:** An adequate theory must allow that an agent can retain know-how even when temporary physical or circumstantial factors prevent successful performance. KH is more robust than current ability.
  *   **Status:** **Non-Negotiable.** (Common Ground). The intuition that the uncle still knows how to play is overwhelming. A theory that says he lost the knowledge the moment he lost the ability is revisionist.
  *   **Scorecard:**
      *   *Ryle:* Fail/Struggle. If KH is a disposition/ability, and the ability is gone, the knowledge seems gone. Ryleans must complicate the notion of 'disposition'.
      *   *Intellectualism:* Pass. KH is a propositional attitude; the brain damage affects the motor output, not the stored proposition.
      *   *Ability-First:* Struggle. Must distinguish between *possessing* the ability (as a latent capacity) and *exercising* it.

  **3. The Cognitive Economy Constraint**
  *   **Motivation:** (3) The Improv Case & (5) Animals/Babies. The jazz player doesn't think; the baby crawls without concepts.
  *   **Requirement:** An adequate theory must not require explicit, conscious contemplation of facts during performance, and it should ideally accommodate agents without sophisticated conceptual capacities.
  *   **Status:** **Contested.** (This is the main fault line).
      *   *Sub-requirement 3a (Consciousness):* **Non-Negotiable.** No one thinks the jazz player is reciting axioms mid-solo.
      *   *Sub-requirement 3b (Concepts/Animals):* **Negotiable.** Intellectualists bite the bullet here: they argue animals either lack KH (they have mere 'skill') or possess proto-concepts. Anti-intellectualists treat this as a reductio of Intellectualism.
  *   **Scorecard:**
      *   *Ryle:* Pass. Dispositions don't require occurrent thought.
      *   *Intellectualism:* Fail on Animals (by design). They argue animals lack *knowledge*-how, having only mechanical skill. Pass on Improv (propositions can be stored/unconscious).
      *   *Ability-First:* Pass. Abilities do not require concepts.

  **4. The Gradability Constraint**
  *   **Motivation:** (4) Gradability. Brain surgery vs. tying a bowline.
  *   **Requirement:** An adequate theory must explain why know-how attributions seem to admit of degrees ("She knows how to play *better* than him"), whereas standard knowledge-that is binary (you know it or you don't).
  *   **Status:** **Negotiable.** (Often treated as a linguistic surface feature).
  *   **Scorecard:**
      *   *Ryle:* Pass. Dispositions come in degrees (strength, reliability).
      *   *Intellectualism:* Struggle. Propositional knowledge is standardly binary. Must argue 'knows how' is context-sensitive or grades the *quality* of the way known, not the knowledge itself.
      *   *Ability-First:* Pass. Skills are inherently gradable.

  **5. The Linguistic Uniformity Constraint**
  *   **Motivation:** (6) Linguistic Ambiguity. 'Knows how to swim' vs. 'Knows how the carburetor works'.
  *   **Requirement:** An adequate theory should explain the semantic relationship between 'knows how to $\phi$' and 'knows that $w$ is a way to $\phi$'. Ideally, it should not treat 'knows how' as radically ambiguous without necessity.
  *   **Status:** **Negotiable.** (Theoretical preference vs. data).
  *   **Scorecard:**
      *   *Ryle:* Fail. Treats 'knows how' as a distinct logical category from 'knows that'.
      *   *Intellectualism:* Pass. 'Knows how' is a species of 'knows that'. Unified semantics.
      *   *Ability-First:* Struggle. Often forced to posit ambiguity (practical 'know' vs. theoretical 'know') to handle the data.

  **6. The Normativity Constraint**
  *   **Motivation:** (Implicit in all cases, especially Sous-Chef).
  *   **Requirement:** Know-how is normative; it involves doing it *right*, not just reliably. (A reflex knee-jerk isn't know-how).
  *   **Status:** **Non-Negotiable.** (Common Ground).
  *   **Scorecard:**
      *   *Ryle:* Pass. Dispositions are subject to correction/standards.
      *   *Intellectualism:* Pass. Propositions have truth conditions/norms.
      *   *Ability-First:* Struggle. Must explain how a mere ability generates a norm (the "mere reliability" objection).

  ---

  ### The Collisions (Incompatibility Matrix)

  You suspected that Intellectualism and the Animal Constraint clash. You are right, but that is not the deepest problem. The deepest problem is that **you cannot satisfy the Retention Constraint and the Guidance Constraint simultaneously without positing ambiguity.**

  Here are the three hard collisions:

  **Collision A: The Rusty Case vs. The Sous-Chef Case**
  *   **The Conflict:** The Rusty Case demands that KH can exist *without* ability (Retention). The Sous-Chef Case demands that KH is *constituted* by the capacity to succeed (Guidance).
  *   **The Clash:** If KH is just the ability (Ryle/Ability-First), the stroke victim loses KH. If KH is a proposition (Intellectualism), the scientist who can't fix the sauce *has* KH (which violates the Guidance intuition).
  *   **Who breaks:** Intellectualists satisfy Retention but weaken Guidance (the scientist technically "knows how" but can't do it). Ryleans satisfy Guidance but weaken Retention (the victim loses the knowledge).

  **Collision B: The Animal Constraint vs. Linguistic Uniformity**
  *   **The Conflict:** To satisfy Linguistic Uniformity (S&W), KH must be propositional. To satisfy the Animal Constraint, KH must be non-conceptual.
  *   **The Clash:** You cannot have non-conceptual propositional knowledge (on standard views of propositions).
  *   **Who breaks:** Intellectualists sacrifice the Animal Constraint (animals don't *really* know). Anti-intellectualists sacrifice Linguistic Uniformity (there are two kinds of 'knowing').

  **Collision C: Gradability vs. Propositionalism**
  *   **The Conflict:** Knowledge-that is factive and binary. Know-how is gradable.
  *   **The Clash:** If KH = KT, how can it be gradable?
  *   **Who breaks:** Intellectualists must argue that 'knows how' grades the *practical mode of presentation*, not the knowledge relation itself. This is technically possible but theoretically costly.

  ---

  ### The Verdict: What is the Cheapest Give-Up?

  If you want a theory that handles the widest range of cases with the fewest contortions, **the cheapest thing to give up is Linguistic Uniformity (Desideratum 5).**

  Here is the argument:
  1.  **Retention** and **Guidance** are phenomenological fixed points. We *feel* the uncle still knows, and we *feel* the scientist lacks something. A theory that denies either feels like it's changing the subject.
  2.  **Cognitive Economy** (Animals/Improv) is a biological fixed point. Denying animals practical competence is biologically implausible.
  3.  **Linguistic Uniformity** is a theoretical preference. While 'knows how' looks the same grammatically in English, natural language is rife with ambiguity (e.g., "bank," "run").

  **The Recommendation:**
  Adopt a **Hybrid or Ambiguity View**.
  *   Accept that there is a *propositional* sense of 'knows how' (satisfies Rusty Case, Linguistic Uniformity). This is what the stroke victim retains.
  *   Accept that there is a *dispositional/ability* sense of 'knows how' (satisfies Sous-Chef, Animals, Gradability). This is what the chef has and the scientist lacks.
  *   **Cost:** You admit the debate has been partly verbal. Ryle and S&W were talking about different (though related) phenomena.
  *   **Benefit:** You keep all the intuitions intact by assigning them to different senses of the term.

  **Why this beats the alternatives:**
  *   **Pure Intellectualism** costs you the animals and the intuition that the scientist lacks know-how.
  *   **Pure Ryleanism** costs you the stroke victim's knowledge and makes the semantics of 'know' messy.
  *   **Ambiguity** costs you only the elegance of a unified semantic theory, which is a much lower price than denying that animals act skillfully or that stroke victims retain their knowledge.

  **Seminar Tip:** When you go back, ask this: *"Is the goal of this theory to provide a unified semantics for the English phrase 'knows how', or is it to explain the nature of practical competence?"* If it's the former, Intellectualism wins. If it's the latter, Intellectualism loses. Most people in the room are pretending these are the same project. They aren't.
