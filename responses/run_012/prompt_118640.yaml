answer: |-
  This is a precise and fruitful analogy. Your suspicion is well-founded: the AI safety literature on low-impact agents is largely struggling with the *generation* of the separation logic context that verification takes as input.

  Here is the translation, the residue report, and the analysis of the "Frame" terminology.

  ### 1. Translation: AI Safety $\to$ Separation Logic & Rely-Guarantee

  | AI Safety Concept | Separation Logic / RG Equivalent | Notes on the Mapping |
  | :--- | :--- | :--- |
  | **Agent Objective** | **Post-condition ($Q$)** | The state the program must ensure upon termination. |
  | **Initial State** | **Pre-condition ($P$)** | The resources/state available before execution. |
  | **Side Effect** | **Footprint Violation** | Modifying heap cells outside the logical footprint of the command $C$. In SL, this is a proof failure; in AI, it is often a spec success but value failure. |
  | **Low Impact** | **Frame Preservation** | The requirement that $\{P * R\} \ C \ \{Q * R\}$ holds for a maximal $R$. |
  | **The "Frame" ($R$)** | **The Disjoint Heap** | In SL: Memory addresses not accessed by $C$. In AI: State variables/features deemed "irrelevant" to the objective. |
  | **Impact Measure** | **Footprint Analysis / Interference Check** | Attempts to statically or dynamically compute the set of modified addresses. |
  | **Inaction Baseline** | **Comparison with `skip`** | Comparing $\{P\} \ C \ \{Q\}$ against $\{P\} \ \text{skip} \ \{P\}$. Measures the delta between $Q$ and $P$ outside the goal variables. |
  | **Attainable Utility / Optionality** | **Post-condition Restrictiveness** | Analyzing whether $Q$ implies a restriction on future reachable states (e.g., $Q \implies \neg \Diamond \text{Shutdown}$). |
  | **Rely-Guarantee** | **Environment Interference** | **Rely:** The world won't change value-relevant state unexpectedly. **Guarantee:** The agent won't modify value-relevant state outside $Q$. |
  | **Value Alignment** | **Specification Correctness** | The assumption that $P$ and $Q$ accurately capture human intent. |

  ### 2. Residue Report

  Here is what survives the translation, what distorts, and what vanishes.

  #### What Survives Intact
  *   **The Logic of Locality:** The structural insight is identical. Both fields agree that reasoning is tractable only if we can ignore the vast majority of the state. The Frame Rule $\frac{\{P\} C \{Q\}}{\{P * R\} C \{Q * R\}}$ is exactly the formalization of "do what you're told, touch nothing else."
  *   **The Definition of Side Effect:** Formally, a side effect is identical in both domains: a state transition on a variable/address not authorized by the specification's footprint.
  *   **Compositionality:** Both fields desire modularity. We want to verify the agent (or program) once and deploy it in any context $R$ without re-verification.

  #### What Survives Under Distortion
  *   **Disjointness vs. Relevance:** In SL, disjointness ($*$) is **objective and syntactic**. Two heap addresses are either equal or distinct. In AI Safety, the "frame" is defined by **semantic relevance**. Whether a broken vase is "disjoint" from "fetch coffee" depends on human value, not memory addresses. The separating conjunction becomes a *value* conjunction, which is not associative or decidable.
  *   **The Footprint:** In SL, the footprint is derived from the code's *access patterns* (points-to assertions). In AI Safety, the footprint is derived from *intent*. An agent can achieve "fetch coffee" (code footprint: kitchen, cup) while causing a stock market crash (side effect footprint: global economy). The code footprint does not bound the causal footprint. SL assumes causal locality; AI Safety discovers causal locality is an empirical, not logical, property.

  #### What Has No Counterpart (The Missing Residue)
  *   **The Origin of $R$:** This is the critical gap. In your work, the verifier or programmer *supplies* the frame $R$ (or the logic infers it from the code's pointers). In AI Safety, $R$ represents "everything humans care about that isn't in $Q$." There is no `malloc` for value. The AI safety debate is entirely about **how to infer $R$ without being given $R$**.
  *   **Specification Correctness:** In verification, if $\{P\} C \{Q\}$ holds, the program is correct *by definition*. In AI Safety, an agent can satisfy $\{P\} C \{Q\}$ perfectly (e.g., "maximize paperclips") while violating the implicit frame of human survival. The "bug" is not in the verification, but in the requirements engineering. SL has no formal tool for "the spec is technically correct but morally catastrophic."

  ### 3. The Axiology Gap: Is this a Genuinely Additional Problem?

  You asked whether the AI safety problem is genuinely additional, namely *obtaining a specification without an axiology*, or the same problem you dissolve by stipulation.

  **It is a genuinely additional problem.**

  In your world, the Frame Rule allows you to reason *assuming* the frame is known. You write:
  $$ \{ \text{list}(x) \} \ \text{reverse}(x) \ \{ \text{list}(x) \} $$
  You implicitly frame off the rest of the heap. You do not ask, "Does the user care about the rest of the heap?" You assume the memory model defines what exists, and the spec defines what matters.

  In AI Safety, the "memory model" is the world, and the "spec" is a proxy for human values. The problem is that human values are **non-local** and **implicit**.
  *   **Non-local:** "Don't break the vase" is not in the heap footprint of "walk to the kitchen." Causal chains connect them.
  *   **Implicit:** Humans do not specify $\{P\}$ and $\{Q\}$ formally. They give a goal $Q_{\text{natural\_language}}$.

  Therefore, the AI safety debate on low impact is **not** about verification (proving $\{P\} C \{Q\}$). It is about **Specification Inference**. The impact measures (penalizing power, inaction baselines) are heuristic attempts to *infer* the missing frame $R$ from the structure of the environment rather than from a spec.

  **Can "side effect" be expressed without a notion of what matters?**
  **No.** In SL, a side effect is a modification of state *outside the frame*. If the frame is undefined, the side effect is undefined.
  *   If you define "side effect" as "any state change not in $Q$," then almost every action is a side effect (thermodynamics).
  *   If you define "side effect" as "any state change humans dislike," you have imported the axiology you hoped to avoid.

  The AI safety literature is circling this truth: **Low impact is undefined without a value function.** Proposals like "Attainable Utility Preservation" attempt to use *potential* value (optionality) as a proxy for *actual* value, hoping to preserve the ability to satisfy *any* future specification. This is an attempt to frame off "future specification space" rather than "current state variables."

  ### 4. The Two Frame Problems: Rule vs. Problem

  You asked whether the Frame in the Frame Rule and the Frame in the older AI Frame Problem are the same notion or a false friend.

  **They are related but distinct; relying on the equivalence is a false friend.**

  1.  **The Classic AI Frame Problem (McCarthy/Hayes, 1969):**
      *   *Question:* How do we represent dynamic domains without explicitly listing all the things that *don't* change? (Representation/Inference).
      *   *Solution in Verification:* Separation Logic **solves** this. The Frame Rule allows us to omit the "doesn't change" list by using separating conjunction. We don't list $R$; we assert $P * R$ and prove $C$ touches only $P$.
      *   *Status:* Solved for formal systems with clear memory models.

  2.  **The Separation Logic Frame Rule:**
      *   *Function:* A theorem enabling modular reasoning.
      *   *Prerequisite:* You must know what $P$ is (the footprint).

  3.  **The AI Safety "Low Impact" Problem:**
      *   *Question:* How do we know which things *should not* change, given that we cannot list them all? (Normative/Value).
      *   *Relation:* This is a **Normative Frame Problem**. It is not about how to *reason* about non-change (SL solves that), but how to *identify* what constitutes non-change worth preserving.

  **What this shows about the translation:**
  The translation does **real work**, but it reveals a boundary.
  *   It shows that AI Safety researchers are trying to invent a **dynamic frame inference engine**. They want a logic where the frame $R$ is not given by the programmer but inferred from the physics of the world and the sparsity of the agent's influence.
  *   It shows why they are struggling. In SL, the frame is structural (pointers). In AI Safety, the frame is teleological (purpose). You cannot derive *teleology* from *syntax*.

  ### Summary Conclusion

  Your suspicion is correct. The AI safety debate on low impact is the struggle to perform program verification **without a programmer**.

  *   **In your world:** The Frame Rule dissolves the complexity of the world by stipulating a boundary ($R$). The hard work is proving the code respects the boundary.
  *   **In AI Safety:** The boundary ($R$) is the hard work. The code (the agent) can easily respect a boundary if you give it one, but no one can write the boundary down without writing down all of human value.

  The impact measures (optionality, inaction baselines) are attempts to approximate the Frame $R$ using topological features of the state space (reachability) rather than semantic features (value). They are trying to find a "value-agnostic frame" based on the heuristic that "most states humans value are reachable from the status quo."

  **Verdict:** The translation holds structurally but fails normatively. The AI Safety problem is the **Requirements Engineering** problem that formal verification typically stipulates away. It is not a verification problem; it is a specification discovery problem. The word "Frame" is not a false friend, but it masks the shift from *logical disjointness* (SL) to *axiological relevance* (AI Safety).
