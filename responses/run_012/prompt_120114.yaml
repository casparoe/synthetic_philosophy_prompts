      *   *Philosophy Point:* The prompt asks about "limits of human reason." The student reduces this to "mechanical procedure." A First-class answer would discuss the distinction between *context of discovery* vs. *context of justification*, or the size of the polynomial constant. I must penalize the reductionism.
