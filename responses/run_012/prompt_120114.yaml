          *   "mathematical discovery would be a mechanical procedure": This conflates *verification* of a proof with *discovery* of a theorem. $P=NP$ helps find a witness (proof) if one exists within a certain size bound. It doesn't solve the Halting Problem or Gödelian limits. It doesn't mean *all* mathematical discovery is mechanised, only those expressible as NP search problems with polynomial bounds.
