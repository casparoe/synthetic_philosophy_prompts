  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** Resident Philosopher
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo – Existential Resilience Proposal (Ref: XR-2023-04)

  **RECOMMENDATION**
  **Fund with Conditions.** Approve **$500,000 over 24 months** (25% of ask). Review mandatory at Month 12. Funding is contingent on the removal of expected-value (EV) calculations from all progress reporting. Success metrics must be based on tangible deliverables (e.g., treaty draft completion, seed bank operational status) rather than modeled risk reduction.

  **RATIONALE**

  **1. Epistemic Posture on Uncalibrated Probabilities**
  The proposal hinges on a 1e-9 probability estimate. Our posture must be that **numbers without error bars are not data; they are assertions.** A probability that cannot be empirically updated within the grant period is epistemically inert for allocation decisions. We cannot audit a 1e-9 claim, nor can the applicants be proven wrong if the event does not occur. Therefore, we will not fund the *probability*; we will fund the *capacity*. We are purchasing the seed banks and policy work because they are robust goods, not because they mathematically guarantee salvation. This addresses the Chair's concern (negligence to ignore the risk) without validating the Committee's concern (funding pseudoscience).

  **2. The Fanaticism Screening Rule**
  To prevent this logic from licensing any grant with a inflated cosmic payoff, we are adopting the **Empirical Updateability Standard**.
  *   **The Rule:** We will not fund interventions where the primary success metric (risk reduction) cannot be updated based on evidence within the grant period.
  *   **The Mechanism:** If an applicant claims their work lowers existential risk, they must demonstrate intermediate milestones that correlate with safety (e.g., successful treaty ratification, verified seed viability). If the only metric is "civilization still exists," the grant is ineligible.
  This blocks Pascal's Mugging. A claimant cannot simply assert a higher payoff to win funding; they must show a path to verifying their impact within a human timeframe.

  **3. Temporal Discounting: Epistemic, Not Moral**
  We reject moral discounting; a life in 2200 is worth a life in 2024. However, we apply **epistemic discounting**. Our ability to predict the consequences of interventions degrades over time. Bednets save lives now with >95% confidence. Existential interventions save lives later with <1% confidence (regardless of the 1e-9 claim). We fund the latter only when the cost is low enough to justify the uncertainty premium. $500,000 is within our risk tolerance for high-uncertainty portfolios; $2,000,000 displaces too many certain lives for too much uncertainty.

  **4. Preventing Metastasis**
  Critics will ask: "If we fund this, why not the next long-shot?" The answer is the **Updateability Standard** above. This proposal is funded not because their math is right, but because their *outputs* (archives, policy) are verifiable. Future proposals claiming high EV without verifiable intermediate milestones will be rejected. This creates a lane for existential work without opening the floodgates to speculative mathematics.

  **DEFENSE TO DONORS**
  We are not betting on a 1e-9 chance of saving the future. We are investing $500k in tangible resilience infrastructure (seed banks, policy frameworks) that has value even if the existential threat model is imperfect. We are hedging against catastrophe without abandoning our duty to the present. This balances moral negligence with fiscal recklessness.

  **ACTION REQUIRED**
  Vote to approve $500,000 grant with stipulated reporting conditions.
