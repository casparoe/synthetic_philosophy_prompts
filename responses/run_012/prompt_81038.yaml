answer: |-
  Here is a draft of the criteria section for your handout. It is designed to be meta-conceptual: it does not judge specific narratives but establishes the logical and historical burdens any narrative must carry to be taken seriously.

  ### I. The Adequacy Criteria for "Western Values"

  An adequate account of the phrase "Western values" must satisfy the following five requirements. Failure to meet any single one reduces the account to propaganda, tautology, or historical error.

  **1. The Paradigm Case Requirement (Extension)**
  *   **The Demand:** The account must explain why specific positive institutions (rule of law, individual rights, free inquiry) are labeled "Western," *and* it must explain why specific negative institutions (the Inquisition, chattel slavery, the colonial civilizing mission) are also labeled "Western."
  *   **The Rationale:** A concept that claims to describe a tradition must account for the continuity of that tradition's outputs. If an account claims "Western values" are inherently liberal/humanist, it must explain how the West produced illiberal/inhuman structures without breaking the definition of "West."
  *   **Status:** **Genuine.** (An account that cherry-picks only the flattering history is historically inadequate.)

  **2. The Non-Redundancy Requirement (Intension)**
  *   **The Demand:** The account cannot define "Western values" merely as "values currently held in Western countries" (Empiricism), nor as "the objectively correct values" (Normativism).
  *   **The Rationale:**
      *   *Against Empiricism:* Many "Western" countries frequently violate putative Western values; many non-Western countries uphold them. If the value is defined by the geography, the term "Western" adds no information.
      *   *Against Normativism:* If "Western" just means "Good," the adjective is a rhetorical camouflage for universal moral claims. It begs the question of why these values require a cultural adjective at all.
  *   **Status:** **Genuine.** (This is a logical constraint on meaningful definition.)

  **3. The Boundary Sustainability Requirement (Contrast)**
  *   **The Demand:** The account must specify what constitutes a *structural* contrast between "Western" and "Non-Western" (e.g., Confucian, Islamic) values, and distinguish this from mere *rhetorical* packaging.
  *   **The Rationale:** To say a value is "Western" implies it is not (or not as) "Eastern." The account must demonstrate whether this difference is foundational (e.g., metaphysical individualism vs. relationalism) or contingent (e.g., industrialization timing). It must explain why the boundary is drawn where it is, rather than elsewhere.
  *   **Status:** **Mixed.** (The demand for clarity is genuine; the demand that the boundary be *rigid* is a **Camp Commitment** of essentialists. A adequate account may conclude the boundary is porous.)

  **4. The Functional Explanation Requirement (Usage)**
  *   **The Demand:** The account must explain the *political work* the phrase performs. It must account for why the phrase is invoked in immigration debates, military interventions, or Cold War victory narratives.
  *   **The Rationale:** Concepts have use-cases. If "Western values" functions primarily as a boundary-marker for exclusion or a justification for force, an account that treats it solely as a philosophical heritage ignores its actual social life.
  *   **Status:** **Genuine.** (Sociological adequacy requires explaining how the term is actually used, not just how philosophers wish it were used.)

  **5. The Reflexivity Requirement (Internal Coherence)**
  *   **The Demand:** The account must accommodate the claim that "critical self-reflection" or "dissent against tradition" is itself a Western value.
  *   **The Rationale:** If the tradition prizes questioning authority, an account of that tradition must be able to withstand being questioned by its own standards. If the account immunizes "Western values" from critique by labeling critics "non-Western," it falsifies the content it claims to describe.
  *   **Status:** **Genuine.** (This is a test of performative consistency.)

  ***

  ### II. The Fault Line: Distinctiveness vs. Universality

  You asked if you are mislocating the fault line. You are **not** mislocating it, but you may be underestimating the mechanism.

  The pair that cannot be jointly satisfied without significant philosophical friction is **Distinctiveness** (Criterion 3) and **Universality** (implied in the normative weight of Criterion 1).

  *   **The Tension:**
      *   If the values are **Distinctive** (specific to the West's history/culture), they lack inherent authority over non-Western peoples. They are local customs.
      *   If the values are **Universal** (binding on all humans), the label "Western" becomes accidental or, worse, colonial (implying the West discovered them first/alone).
  *   **The Failure Mode:** Most accounts try to hold both. They argue these values are *historically* Western but *morally* universal.
      *   *Why this breaks:* To maintain this, the account usually relies on a hidden premise: that the West is the "lucky custodian" or "vanguard" of universal truth. This smuggles in a teleological narrative (e.g., Hegelian or Whig history) that fails the **Paradigm Case Requirement** (see below).
  *   **Verdict:** You are correct. This is the primary fracture. An account can have distinctive values *or* universal values. Claiming both requires a theory of history that most first-year students (and many professors) will find untenable upon scrutiny.

  ***

  ### III. The Reflexivity Problem: Gotcha or Structural?

  Is the claim that "self-criticism is a Western value" a rhetorical gotcha? **No, it is a structural problem.**

  *   **Why it's not a gotcha:** A gotcha implies a logical fallacy that can be dismissed. This is a feature of the concept itself. The Enlightenment tradition explicitly valorizes *autonomy* and *critique*. Therefore, a definition of "Western values" that excludes critique is historically false.
  *   **The Problem:** If critique is a Western value, then "Western values" is a category that contains the tools for its own dissolution. An adequate account must explain how the category survives its own internal demand for questioning.
  *   **Handout Note:** Frame this not as a contradiction that destroys the concept, but as a **dynamic tension**. The category persists *through* the critique, not despite it. Accounts that present Western values as static monuments fail this test; accounts that present them as an ongoing argument pass it.

  ***

  ### IV. The Killer Criterion

  Which single requirement does the most to rule out candidate accounts?

  **The Paradigm Case Requirement (specifically the Negative Cases).**

  *   **Why:** This is the highest body count for theories.
      *   **Triumphalist accounts** (e.g., "The West is the home of Liberty") crash immediately against Chattel Slavery and the Inquisition. They must engage in historical amnesia to survive.
      *   **Cynical/Post-Colonial accounts** (e.g., "Western values are just rationalizations for domination") crash against the genuine emancipatory power of rights and free inquiry within Western history. They must treat liberation as mere illusion to survive.
      *   **Cultural Essentialist accounts** (e.g., "It's in our DNA/Christianity") struggle to explain why these values appear in non-Western contexts or why they were absent in the West for centuries.
  *   **Instructional Utility:** In class, this is your lever. When a student proposes a definition, ask: "Does this definition explain the Inquisition?" If the definition makes the Inquisition an "anomaly" or "non-Western," the student has failed the Paradigm Case Requirement. They have defined the West by its ideals rather than its history.

  ### Summary for the Handout

  | Requirement | What it Demands | Common Failure Mode |
  | :--- | :--- | :--- |
  | **Paradigm Case** | Must cover Rights *and* Inquisition. | Cherry-picking history. |
  | **Non-Redundancy** | Cannot mean "what's common" or "what's good." | Tautology or Moralizing. |
  | **Boundary** | Must define the "Non-West" without caricature. | Essentialism / Orientalism. |
  | **Functional** | Must explain political usage (war, borders). | Naive Philosophizing. |
  | **Reflexivity** | Must allow critique of the tradition itself. | Dogmatism. |

  **The Impossible Pair:** Distinctiveness + Universality.
  **The Killer Criterion:** Paradigm Case (Negative).
