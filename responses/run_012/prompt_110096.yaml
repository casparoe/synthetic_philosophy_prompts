answer: |-
  This reconstruction necessarily traverses the boundary between Carnap's explicit texts and the logical extension of his commitments, yet the trajectory is clear enough to deliver a firm verdict. Had Carnap confronted the claim that cybernetics and big data dissolve the socialist calculation problem, he would have rejected the Austrian impossibility thesis as metaphysical nonsense while refusing to endorse central planning as a theoretical truth, categorizing it instead as a permissible practical decision. His reasoning would rest on a rigorous application of the distinction between internal and external questions, coupled with his physicalist doctrine of unified science.

  First, Carnap would dismantle the theoretical status of the calculation problem itself. For Mises and Hayek, the absence of market prices renders rational allocation impossible in principle; this is presented as a theoretical truth about the nature of economics. Carnap would classify this as a confusion of frameworks. In his view, questions internal to a linguistic framework—such as "Does this specific planning algorithm minimize waste given these inputs?"—are empirical and truth-apt. Questions external to the framework—such as "Should we adopt a planned economy rather than a market economy?"—are practical decisions, matters of expediency and attitude, not cognitive truth. The Austrian claim that planning is *impossible* attempts to state an external constraint as an internal fact. Carnap would argue that declaring a socio-economic framework "irrational" simply because it lacks a specific syntax (prices) is akin to declaring a non-Euclidean geometry "false" because it lacks parallel lines. It is a violation of his Principle of Tolerance. There is no moral or logical prohibition against adopting a framework of allocation based on physical quantities or computational iterations rather than monetary prices. Therefore, the feasibility of in-kind calculation is not a priori impossible; it is an empirical hypothesis to be tested within the framework of physicalist science. The Austrian objection, which posits a realm of "tacit knowledge" inherently inaccessible to formalization, would strike Carnap as a metaphysical residue, a failure to translate meaningful content into the physical language of unified science.

  This leads to the second point: his physicalism and the unity of science. Carnap maintained that all meaningful statements are reducible to physical language—statements about space-time coordinates and measurable quantities. If a factory manager possesses knowledge about a machine's quirks or a worker's morale, Carnap's physicalism demands that this knowledge be communicable and thus formalizable. If it cannot be transmitted via telex or sensor data, it is, strictly speaking, not scientific knowledge but metaphysical intuition. The enthusiasts of Cybersyn and modern AI planning argue that technology captures this data; Carnap would agree that in principle, there is no barrier to such capture. The "knowledge problem" identified by Hayek relies on a dualism between formal data and tacit understanding that Carnap's monistic physicalism cannot accept. For Carnap, if the knowledge affects production, it has physical consequences, and if it has physical consequences, it is measurable. Therefore, the claim that opportunity costs cannot be computed without market prices is false; it assumes that "price" is the only valid variable for representing scarcity. Carnap would argue that scarcity can be represented by any consistent system of equations relating physical inputs to outputs. The computational proposal is simply an alternative linguistic framework for expressing economic relations. However, Carnap would sharply distinguish this logical possibility from empirical success. While the system is logically permissible, its efficiency is an internal question to be settled by observation, not deduction. He would not guarantee the system works, only that the claim it *cannot* work is meaningless.

  Third, regarding values and Neurath, Carnap would part company with the political enthusiasm of his colleague while surpassing him in logical defense of the project. Neurath was a committed socialist who saw planning as morally imperative. Carnap, a non-cognitivist about ethics, would regard the choice of socialism over capitalism as an expression of attitude, not a discovery of justice. He would not argue that planning is "better" in a moral sense, but that it is a viable tool for achieving stated goals. Here, Carnap would be more cautious than Neurath about the political ends but more optimistic than the Austrians about the technical means. Neurath often conflated the desirability of socialism with its feasibility; Carnap would strictly separate them. He would warn the planners that while their framework is logically sound, the decision to adopt it involves value judgments that science cannot validate. Yet, against the Austrians, he would insist that the technical barriers are not absolute. Where Neurath might argue from a stance of utopian necessity, Carnap would argue from a stance of logical permission. He would treat the economic order as a complex machine whose design is open to revision. If the machine fails, we adjust the design; we do not declare the engineering impossible based on metaphysical premises about human nature.

  Consequently, the verdict is this: Carnap would conclude that the socialist calculation problem is a pseudo-problem generated by an inadequate linguistic framework that mistakenly reifies market prices as the sole medium of rationality. He would affirm that computational planning is logically feasible and that the Austrian objection constitutes metaphysical speculation prohibited by the principles of logical empiricism. He would not declare that a planned economy *will* succeed—that is an internal empirical question dependent on the quality of the data and the algorithms—but he would definitively rule that there is no theoretical barrier to its success. The dispute over whether resources *can* be allocated rationally without prices is, for Carnap, a verbal dispute disguised as a theoretical one. By applying the Principle of Tolerance, he would dissolve the calculation problem not by proving the planners right in practice, but by proving the Austrians wrong in principle. The choice to plan is a practical decision external to science, but the claim that planning is impossible is a theoretical error internal to philosophy. Carnap would thus side with the planners on the logic of science, while remaining agnostic on the politics of value, demanding that the system be judged by its empirical output rather than its conformity to market syntax. The technology does not merely assist planning; it validates the physicalist assumption that all relevant economic data is capturable, rendering the Austrian epistemological barrier obsolete.
