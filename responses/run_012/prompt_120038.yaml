      *   Flag assumptions? (Check. The assumption that Popper's failure = Realism's failure is a key one to flag.)

  7.  **Final Polish:** Ensure the tone is collegial (PhD to PhD-ish advice) but authoritative. Make sure the distinction between *verisimilitude* (the technical concept) and *approximate truth* (the broader realist intuition) is clear, as the trade book conflates them.

      *(Self-Correction during drafting)*: I need to be careful not to overstate the success of post-Popper verisimilitude. It's not a solved problem. But saying "nothing has been repaired" is definitely too strong. I should characterize it as "active research program with plausible candidates" vs "dead end."
      Also, the "confirmation" charge: Some accounts *do* link truthlikeness to epistemic access, but semantic accounts exist. I need to be precise there.

