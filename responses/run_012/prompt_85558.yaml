answer: |-
  The ledger lay open on the damp wood of the dockhouse table, the pages stiff with salt air. Outside, the harbor was glass, the boats resting like sleeping birds on the tide. Elara dipped her pen in the inkwell and wrote the date. October 14th.

  Silas leaned against the doorframe, watching the water. He owned the cannery, and he bought the catch, but tonight he was just a man with a notebook and a penchant for side wagers. It was a local custom, a way to hedge against the whims of the Coast Guard.

  "The swell forecast is flat," Silas said, not turning around. "Guard won't close the harbor tomorrow. I'd give it one chance in five."

  Elara capped the pen. She felt calm. The rigging was secure, the nets were mended, and the barometer was steady. "I agree," she said. "Twenty percent."

  "So you'd sell me a ticket," Silas said, turning to face her. "Pays one hundred if the harbor closes. You sell it for twenty."

  It was a fair price. By her lights, right now, it was exactly what the risk was worth. If she sold it, she pocketed twenty dollars. If the harbor closed, she paid him one hundred. If it stayed open, she kept the twenty. The expected value was zero. It was honest arithmetic.

  "Done," Elara said. She signed the slip. Silas handed her two ten-dollar bills. She slid them into the tin box without counting them.

  "You know," Silas said, tapping the ledger, "tomorrow morning the wind picks up. It always does before a swell."

  "I know," Elara said. "But the forecast is still flat."

  "Forecasts change. And guts change faster." He paused. "When you wake up and hear the wind rattling the panes, you won't think it's twenty percent."

  Elara looked at the tin box. She knew herself. She knew that when the wind howled, the safety of the harbor felt fragile. She knew her chest would tighten and the risk would feel larger than the numbers on a page. "Probably not," she admitted. "I'll be scared."

  "So you'll value that ticket higher."

  "Likely."

  "Then I'll buy it back from you," Silas said. "Or sell you another one. Whatever you need to feel safe."

  "I won't lose money on purpose, Silas."

  "You won't lose money on purpose. You'll just pay for peace of mind. Today peace is cheap. Tomorrow it might be dear." He closed his own book. "Sleep well, Elara."

  The night brought the wind. It started as a whisper around midnight and grew to a shout by dawn. Elara woke before the alarm, lying stiffly in the bunk, listening to the rigging hum. The boat rocked. It wasn't a dangerous motion, not yet, but it was enough to wake the old fears. The harbor walls looked lower in her mind. The Coast Guard seemed stricter.

  She dressed quickly and went to the dockhouse. The water was choppy, whitecaps forming in the channel. Her hands shook slightly as she unlocked the door.

  Silas was already there, drinking coffee from a thermos. He looked at her, then at the window. "Wind's up."

  Elara nodded. She couldn't speak calmly. The sound of the gale outside made the idea of staying open seem reckless. The proposition *The Harbor Will Close* felt inevitable. The twenty percent from yesterday felt like a lie told by a stranger.

  "What's the price today?" Silas asked. He had his notebook out.

  Elara gripped the edge of the table. She knew she was agitated. She knew she was likely overestimating the risk. But knowing it didn't stop the feeling. The feeling was the price. "Eighty," she said. "I think it's eighty percent."

  "Eighty," Silas repeated. He didn't argue. He didn't show her a weather app. He treated her number as fact, because it was her number. "So you'd buy a ticket. Pays one hundred if the harbor closes. You pay me eighty."

  It was fair. Right now, in this moment, paying eighty to get one hundred back if the disaster happened was exactly what the risk was worth to her. It balanced the books of her anxiety.

  "Yes," she said.

  Silas wrote it down. He slid a slip of paper across the table. Elara took eighty dollars from the tin box—her twenty from yesterday plus sixty more—and handed it to him. She took the slip.

  She held two slips now. One said she owed him one hundred if the harbor closed. The other said he owed her one hundred if the harbor closed. The obligations canceled out. Regardless of the Coast Guard's decision, she would neither pay nor receive anything on the bets themselves.

  But the tin box was lighter. She had put in eighty and taken out twenty. She was down sixty dollars.

  Silas capped his pen. He looked at the box, then at her. "You see it."

  "I see it," Elara said. Her voice was steadier now that the transaction was done. The act of trading had soothed the panic slightly. "I sold low and bought high."

  "You sold when you were calm and bought when you were afraid."

  "I knew I would be afraid."

  "Then why did you sell yesterday?"

  "Because yesterday it was worth twenty."

  "And today?"

  "Today it's worth eighty."

  Silas leaned forward, resting his elbows on the ledger. "You know why this works, Elara? It works because you agree to play both times. You agree to be honest about your price today, and you agree to be honest about your price tomorrow. If you refused to trade today, you'd keep your twenty. If you refused to trade tomorrow, you'd keep your sixty."

  "If I refuse tomorrow," Elara said, "I sit with the risk. I sit with the feeling that I'm underinsured."

  "But the risk hasn't changed that much. The forecast is still mostly flat. It's just you."

  "I am the risk," she said. "If I can't sleep, the boat doesn't get manned. If I'm distracted, I hit the jetty. My fear is part of the cost."

  Silas nodded slowly. "Fair. But look at the mechanism. I'm not cheating you. I'm not hiding the weather. I'm just taking your price. You're the one setting the trap."

  "Is it a trap if I walk into it with my eyes open?"

  "It's a leak," Silas said. "You're bleeding money because your prices don't stick. You shift." He tapped the table. "There's a way out. You know there is."

  "Refuse to trade."

  "Or change the stakes." Silas picked up the pen. "Make the ticket worth ten thousand dollars. Your boat. Your house."

  Elara flinched. "I can't afford that."

  "Exactly. If the stakes are that high, your money isn't linear anymore. Losing ten thousand hurts more than ten times losing one thousand. You won't sell the ticket today for two thousand, because losing the boat ruins you. And you won't buy it back tomorrow for eight thousand, because you can't spare the cash. The line breaks. The book doesn't close."

  "So I should bet the boat?"

  "I'm saying the only way to stop the bleed is to make the pain non-linear. Or just stop playing." Silas looked at her hard. "You keep saying you knew you'd be scared. If you knew, why did you promise to trade tomorrow?"

  "I didn't promise. I just... I thought I'd be reasonable tomorrow."

  "You were reasonable tomorrow. You priced it exactly where your fear told you to. That's the problem. You were consistent with your feelings, but inconsistent with your wallet."

  The wind hammered the roof. A gust shook the door in its frame. Elara looked at the tin box. Sixty dollars was a tank of fuel. It was a week's groceries. It was real money, gone because she was human enough to feel the storm before it arrived.

  "Is it irrational?" Elara asked. "To lose the money?"

  Silas shrugged. "By the book, yes. You're exploitable. A machine wouldn't do this. A machine would stick to the conditional probabilities."

  "I'm not a machine."

  "No. But the market doesn't care. I can keep doing this. Every time the wind picks up, I can sell you peace. Every time it calms, I can buy it back. I can retire on your anxiety."

  "Then stop," she said.

  "I can't. It's fair play. You set the price. I just match it." Silas closed the ledger. "You want to know the verdict? You're not stupid. You're not cheated. But you're incoherent. You're two different people across time, and you're letting them trade against each other."

  "Maybe they need to," Elara said. She put the slips into the box. "Maybe the Elara of yesterday needed to lock in the calm, and the Elara of today needed to buy the safety. Maybe the loss is the fee for letting them both exist."

  "That's a expensive fee."

  "It's the cost of being alive in a storm." She picked up the box. It rattled, light in her hand. "Tomorrow the wind might drop. I might feel calm again. I might want to sell again."

  Silas smiled, a thin, sharp expression. "I'll be here."

  "I know."

  "Will you trade?"

  Elara looked at the door, where the wind whistled through the crack. She thought about the sixty dollars. She thought about the tightness in her chest that only eased when the bet was made. She thought about the machine that wouldn't feel the wind, wouldn't lose the money, and wouldn't care if the boat sank.

  "I don't know," she said. "Ask me tomorrow."

  She walked out into the gale. The money was gone, but the fear was quieter, dampened by the transaction. She climbed onto the boat and began to check the lines. The harbor was still open. The Coast Guard hadn't called. She was down sixty dollars on a nothing that hadn't happened, paying for the privilege of feeling safe while she waited to see if she was.

  Silas watched her from the window. He opened his notebook and wrote down the profit. He didn't feel guilty. He felt like a mathematician who had found a flaw in a bridge. The bridge held, but it swayed. He wondered if a bridge that swayed was broken, or if it was just built for a world that moved. He closed the book. The wind was picking up again. There would be more trades tomorrow.
