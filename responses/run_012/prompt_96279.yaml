answer: |-
  **The Plaque Rule**
  This rule is underdetermined. Both readings license the exact same practice. If the statue is an act of honor, the plaque functions to mitigate or cancel that endorsement without erasing the object. If the statue is merely a record, the plaque functions to correct inaccuracies or hagiography without destroying the historical artifact. The rule treats the monument as a *claim* that requires amendment, but it does not specify whether that claim is evaluative (honor) or descriptive (history). You cannot infer the underlying theory from the rule alone.

  **The Supermajority Rule**
  This rule strictly presupposes civic continuity. A "mob brake" theory would only require a high threshold for removal generally; it would not require matching the specific supermajority needed for the original *erection*. Tying the removal threshold to the erection threshold presupposes that the city today is the same moral agent as the city of the past, undoing its own prior commitment rather than merely judging it from the outside. The "mob brake" view is merely compatible with the rule, but the rule's specific symmetry requires the continuity view.

  **The Asymmetry**
  The line is principled but medium-based, not value-based. The rules treat flags as *current speech* (active assertions of allegiance) and statues as *historical deposits* (passive inheritances). A flag reads as something the city is saying *now*; a statue reads as something the city *said* then. This distinguishes active endorsement from passive retention. However, this distinction relies on the physical form of the commemoration rather than the moral content it conveys.

  **Coherence Check**
  The three rules cannot share one coherent theory. Rules 1 and 2 presuppose civic continuity: we inherit the past's choices and must use high procedural bars or contextualization to manage them. Rule 3 presupposes moral rupture: we reject the past's choices entirely and remove them without procedure. When a statue and a flag commemorate the same cause (e.g., the Confederacy), the city claims to be both the legal heir to that history (Rule 1) and the moral enemy of that history (Rule 3). You cannot simultaneously inherit a commitment and disown it based on whether it is made of stone or cloth.

  Verdict: The city is quietly running two incompatible theories, presupposing civic continuity for statues but moral rupture for flags, which contradicts itself when both symbols commemorate the same cause.
