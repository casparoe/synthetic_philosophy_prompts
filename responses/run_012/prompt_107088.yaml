prompt: |-
  I'm in a graduate seminar on the political economy of famine, and we spent a session on the three standard cases — Bengal in 1943, the Irish famine of the 1840s, and the Great Leap Forward — during which a classmate defended a framing I keep encountering outside the seminar as well. On his view a famine is essentially a natural disaster, in the way a hurricane or an earthquake is: the failed monsoon or the blighted crop is the storm, the deaths are the storm's damage, and the state stands to the famine roughly as emergency services stand to the hurricane — it can mitigate and it can botch the response, but it is not the author of the catastrophe. He leaned on this to argue that treating famine deaths as a political crime, and going in search of someone to blame, is a mistake and faintly unfair; the appropriate register is relief and preparedness, not indictment. My own instinct, which I can't yet defend well, is that the analogy is doing more exculpatory work than it can bear, and that whatever is right in it is right for reasons that undercut the conclusion he draws from it. I want a proper audit rather than a verdict by association.

  So please lay out the correspondence explicitly, element by element, saying what plays the role of the storm, the harvest, the dead, the state, the relief apparatus, and the international community, and note for each whether the mapping is tight or forced. Then give me the disanalogies — the places where the source domain has features the target lacks, or vice versa — and, crucially, sort them into those that matter for his specific claim (that famine is not a political crime and that blame is misplaced) and those that are merely picturesque. Tell me what the analogy quietly imports: its assumptions about agency, foreseeability, moral luck, and about the baseline against which one death counts as caused by the famine rather than by politics as usual. Then take a definite position: does the natural-disaster framing survive as a licence for the relief-not-blame conclusion, or was that conclusion riding on the analogy all along? Don't lay the options side by side and leave the choice to me — commit, and give your reasons. Finally, if there is a better analogy for what a famine actually is, one that survives these cases better, name it, say why it is better, and say where it too breaks. There is no need to cite anything or hand me a reading list; work from the cases themselves, and where a claim is genuinely contested, flag it as contested rather than asserting it as settled.

  Return the audit as a single JSON object with exactly these fields. "correspondence": an array of objects, each with "source_element" (string), "target_element" (string), "tightness" (one of "tight", "loose", "forced"), and "note" (string). "disanalogies": an array of objects, each with "description" (string), "matters_for_the_blame_claim" (boolean), and "explanation" (string). "smuggled_assumptions": an array of strings. "verdict": an object with "framing_survives" (boolean), "position" (string, the committed judgement in a sentence or two), and "reasoning" (string). "better_analogy": an object with "analogy" (string), "why_better" (string), and "where_it_breaks" (string). "confidence": a number between 0 and 1. "what_would_change_my_mind": a string naming the evidence or argument that would move you off your verdict.
