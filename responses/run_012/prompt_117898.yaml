      *   **Goal:** Sort participants by *actual intuitions on cases*, not by pre-existing labels (avoiding the "Compatibilism is chill" problem).
      *   **Key Distinctions to Probe:**
          *   Modality/Medium (Joke vs. Painting vs. Curry vs. Novel).
          *   Content of Testimony ("It's good" vs. Detailed Description).
          *   Nature of the State (Knowledge vs. Ownership of Judgment vs. Understanding).
          *   Possibility of Verification (Placeholder vs. Permanent).
          *   Specific Cases requested: Blind art expert, Clip-watcher, Wine expert vs. Taster, VR Cathedral, Plot Summary vs. Novel, Phone-during-Symphony, AI Book Reviewer.
