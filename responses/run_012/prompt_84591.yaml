          *Correction:* Wait, I need to check the ordering. In *De Mendacio*, the worst are against God/Doctrine. The "least bad" are those to save life/chastity. But *all* are sins. In *Contra Mendacium*, he hardens the line against the "officious lie" (lie to save another).
      *   *The Core Principle:* Truth is a substance/God. To lie is to turn away from Being toward Non-Being. It damages the soul of the liar primarily, regardless of external consequences. The end never justifies the means.
