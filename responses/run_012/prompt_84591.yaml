  4.  **Drafting Section 2: The Predictions (Extrapolation):**
      *   *(a) Novelist:* Augustine distinguishes *fiction* (knowing it's not real) from *lying* (pretending it is real). The "contract" of art matters. If the reader knows it's a story, no *voluntas fallendi*.
