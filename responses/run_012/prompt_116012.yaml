answer: |-
  This is a fantastic reading of a very difficult essay. P.F. Strawson's *Freedom and Resentment* (1962) is famous precisely because it trips up professional philosophers, so don't feel bad about finding it slippery.

  You have grasped the *spirit* of Strawson (that responsibility is about human relationships, not metaphysical magic), but you have misinterpreted the *mechanics* of his argument in a way that makes responsibility seem like a subjective game we play.

  Here is exactly where you went wrong, how Strawson answers your three specific worries, and how this applies to the fight with your sister.

  ### The Core Misunderstanding: Are Feelings Choices?

  Your reading hinges on the idea that reactive attitudes (resentment, gratitude, indignation) are things we can **choose** to have or not have. You ask: *"Could I make my brother responsible... just by working myself up into resenting him?"*

  Strawson's answer is a hard **no**.

  For Strawson, reactive attitudes are not voluntary decisions; they are **natural, involuntary human responses** to the "quality of will" others show toward us.
  *   If someone steps on your toe by accident, you don't feel resentment.
  *   If someone steps on your toe because they hate you, you *naturally* feel resentment.
  *   You cannot "work yourself up" into resentment if you know they didn't do it. The feeling depends on a belief about their intentions.

  Responsibility isn't "up to us" in the sense that I can decide you are responsible today and not tomorrow. It is "up to us" in the sense that it is a fact about **human nature**, not a fact about the physics of the universe. We are built to feel resentment when treated with ill will. That makes responsibility real, not imaginary.

  ### Addressing Your Three Questions

  Here is how Strawson's actual text handles your three specific worries.

  **1. Could I make my brother responsible for something he didn't even do, just by working myself up into resenting him for it?**
  *   **Strawson's Answer:** No. Resentment is a response to perceived *ill will*. If you know he didn't do it, you perceive no ill will. If you try to resent him anyway, you are essentially hallucinating a quality of will that isn't there. The reactive attitude is tethered to the facts of the interaction. You can be *unfair*, but you cannot create responsibility out of thin air.
  *   **Where you went wrong:** You treated resentment like a light switch. Strawson treats it like a reflex (like pulling your hand away from a hot stove). You can't just decide to have the reflex without the stimulus.

  **2. When my sister forgives the ex and stops resenting him, has she decided he isn't responsible after all?**
  *   **Strawson's Answer:** No. Strawson makes a crucial distinction between **Excuses** and **Forgiveness**.
      *   **Excuse:** "He didn't mean to," or "He was coerced." This shows there was no ill will. Responsibility is negated.
      *   **Forgiveness:** "He meant to hurt me, and he was responsible, but I am choosing to let go of my resentment."
  *   If your sister forgives him, she is acknowledging he *was* responsible but is waiving her right to resent him. If she decides his upbringing makes him *not responsible*, she is offering an **Exemption** (treating him like a child or patient), not forgiveness.
  *   **Where you went wrong:** You conflated "stopping resentment" with "removing responsibility." Strawson says you can stop resentment while keeping responsibility intact (that's what forgiveness *is*).

  **3. That managing attitude, am I switching off the part of me that treats someone as a person, and can I just switch it back on whenever I feel like it?**
  *   **Strawson's Answer:** You can switch it on, but you cannot live there. Strawson calls this the **Objective Attitude**. He admits we *can* view people as objects to be managed (like we do with toddlers or the severely mentally ill). However, he argues this is psychologically costly.
  *   He writes that sustaining the objective attitude toward *everyone* would mean abandoning all genuine human relationships. We cannot sustain it universally. It is a retreat we take only when necessary (e.g., dealing with a psychopath), not a default setting we can toggle for convenience.
  *   **Where you went wrong:** You viewed the Objective Attitude as a tool for avoiding blame. Strawson views it as a loss of human connection that we only accept when interpersonal relationships are impossible.

  ### The Fight With Your Sister (The Real World Application)

  This is the most important part. You argued: *"You can't really hold it against him given how he was raised."*
  Your sister argued: *"That has nothing to do with it."*

  **Strawson is likely on your sister's side.**

  Here is why: Strawson distinguishes between **local excuses** and **global exemptions**.
  *   **Local Excuse:** "He stole because he was starving." (Modifies responsibility).
  *   **Global Exemption:** "He stole because he is psychologically incapable of understanding moral rules." (Removes responsibility).

  Strawson argues that a "bad upbringing" does not automatically grant a Global Exemption. Unless the upbringing was so damaging that it rendered him psychologically incapable of participating in ordinary interpersonal relationships (i.e., he is effectively morally insane), he is still a participant in the moral community.

  Strawson explicitly pushes back against the idea that *determinism* (the idea that his past caused his actions) removes responsibility. He says: "The fact that we are determined doesn't matter; what matters is whether we are participants in human relationships."

  If your sister's ex is capable of understanding love, betrayal, and apology, Strawson says his upbringing is irrelevant to his responsibility. It might explain *why* he is the way he is, but it doesn't move him from the "participant" category to the "object to be managed" category.

  ### What Would Change My Mind (The Textual Evidence)

  You asked me to tell you what part of the essay would make me agree with your reading. Here is the ambiguity that likely tripped you up:

  **The Section on "Optimism" vs. "Pessimism"**
  Strawson argues that we don't need to prove "free will" exists in a metaphysical sense to justify responsibility. He says the justification for responsibility is found *within* our practices of resentment and gratitude.

  *   **Your Reading:** "Since he grounds it in our practices, if we change the practices, we change the responsibility."
  *   **The Counter-Reading:** "He grounds it in our practices because our practices are rooted in *human nature*, which we cannot simply change at will."

  **The Passage to Re-read:**
  Look at **Section IV** of the essay. Strawson writes:
  > *"It is not something for which there can or need be any ultimate external justification... The human commitment to participation in ordinary interpersonal relationships is... too deep for us to take seriously the idea that it might be rational to give it up."*

  **Why this proves you wrong:**
  If responsibility were just "up to us" (as you thought), we could rationally decide to give it up whenever we wanted. Strawson says we *cannot* give it up without ceasing to be human. It is not a choice; it is a condition of our existence.

  **What would make me agree with you?**
  If Strawson had written: *"We can choose to adopt the objective attitude toward anyone we find inconvenient, and doing so removes their responsibility,"* then your reading would be correct. But he explicitly argues the opposite: the objective attitude is a *retreat* forced upon us by psychological necessity, not a *strategy* we choose to avoid blame.

  ### Summary
  1.  **Responsibility isn't a feeling;** the feeling is a natural response to responsibility (ill will).
  2.  **You can't choose to resent;** it requires a belief about the other person's intent.
  3.  **Forgiveness keeps responsibility;** excuses remove it.
  4.  **Bad upbringing isn't an exemption;** unless it destroys the capacity for relationships.

  Your sister is right, according to Strawson. The ex's upbringing explains his behavior, but unless it made him psychologically incapable of moral understanding, it doesn't remove his status as a person we can hold responsible. You can feel pity for him (which is compatible with responsibility), but you don't have to treat him like a broken appliance (which denies responsibility).
