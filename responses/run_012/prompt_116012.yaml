prompt: |-
  Ok so I have no philosophy background at all, I just read an essay by a guy called Strawson, Freedom and Resentment, because my sister and I keep having the same fight about her ex, who did some genuinely bad stuff, and I said you can't really hold it against him given how he was raised, and she said that has nothing to do with it. I think the essay is sort of on her side, but the way I read it leads somewhere weird and I want to know where I went wrong.

  The way I read him, being responsible for something isn't a fact about the person at all, it's just a name for us having certain reactions towards them, resentment and indignation and so on. And he says when we find out certain things about someone we stop having those reactions and start treating them as something to be managed instead, the way we do with a kid or someone whos ill. But if the reactions are what makes a person responsible, then isnt responsibility basically up to us? Three things I can't get past:

  1. Could I make my brother responsible for something he didn't even do, just by working myself up into resenting him for it?
  2. When my sister forgives the ex and stops resenting him, has she decided he isn't responsible after all, like forgiving someone is the same thing as erasing the responsibility?
  3. That managing attitude, am I switching off the part of me that treats someone as a person, and can I just switch it back on whenever I feel like it?

  If I've got him wrong, tell me exactly where, and say what would change your mind about that — which argument or bit of the essay would make you go, no actually, the reading holds up.
