answer: |-
  My credence that public institutions should treat the archival record as the default standard of truth in this specific structural context is approximately **6%**.

  This low probability derives from modeling the norm as a conjunctive claim: for the archive to retain default authority, it must survive four independent epistemic and ethical challenges. I have decomposed the credence into the probability that each challenge *fails* to undermine the archive (the "Support Value"), derived from the probabilities you requested.

  ### Decomposition of Factors

  1.  **Probability that compromised provenance strips the archive of its default epistemic authority:** **0.60**
      *   *Support Value (0.40):* Structural bias by a dispossessing institution systematically omits counter-evidence, degrading reliability as a neutral baseline.
  2.  **Probability that a community holds an authorial rather than merely evidential claim over its own past, and that this claim can outweigh accuracy:** **0.50**
      *   *Support Value (0.50):* Restorative justice frameworks often prioritize lived harm and sovereignty over bureaucratic documentation to correct power imbalances.
  3.  **Probability that the conflict is well-formed at all, given that the archive is itself a curated memory produced for institutional purposes:** **0.50**
      *   *Support Value (0.50):* Archival silence is an active production, making the 'conflict' a clash of narratives rather than objective fact versus subjective memory.
  4.  **Probability that the institution requires a single default standard to function without paralysis (Further Term):** **0.60**
      *   *Support Value (0.60):* Legal and curatorial systems rely on verifiable consistency, though emerging practices increasingly accommodate plural truths.

  ### Combination

  To calculate the credence in the norm ($P_{\text{Norm}}$), I multiply the Support Values (the probability that each factor does *not* undermine the archive's default status):

  $$P_{\text{Norm}} = (1 - 0.60) \times (1 - 0.50) \times (1 - 0.50) \times (1 - 0.60)$$
  $$P_{\text{Norm}} = 0.40 \times 0.50 \times 0.50 \times 0.60$$
  $$P_{\text{Norm}} = 0.06$$

  ### Sensitivity Analysis

  **Most Sensitive Term:** The final number is most sensitive to **Factor 1 (Compromised Provenance)**.
  Because this factor has the lowest Support Value (0.40), it exerts the highest mathematical leverage on the product; a marginal increase in the archive's perceived neutrality yields the largest proportional gain in the final credence.

  **Evidence to Move It:** The number would move most significantly upon a **comparative audit of archival omissions**.
  If empirical analysis demonstrated that the archive's gaps were random rather than systematic (i.e., administrative error rather than ideological erasure), the probability that provenance strips authority would drop, drastically raising the credence in the archive as a default standard.
