answer: |-
  You have reconstructed the *structure* of the regress correctly, but you have misidentified the *engine* that drives it. Your friend has the better of the argument here.

  The central misunderstanding in your reconstruction is the claim that Strawson's argument relies on determinism. It does not. In fact, Galen Strawson is at pains to emphasize that "The Basic Argument" (as he calls it) is designed to work whether determinism is true or false. It is intended to be a "super-incompatibilist" argument: it argues that moral responsibility is impossible regardless of the causal structure of the universe.

  Here is where your reconstruction goes wrong, and how Strawson handles the two escape hatches you identified.

  ### 1. The Role of Determinism
  You wrote: *"That regress... only gets its bite if determinism is true — if each link in the chain is necessitated by the one before it."*

  This is the critical error. The regress in Strawson's argument is not a causal regress dependent on the laws of physics; it is a **conceptual regress regarding the source of action.**

  The argument runs roughly like this:
  1.  To be truly morally responsible for an action, you must be responsible for the mental nature (reasons, motives, character) that produced the action.
  2.  You cannot be responsible for that mental nature unless you chose to have it.
  3.  To choose to have that mental nature, you must have already had a prior mental nature that governed *that* choice.
  4.  Therefore, to be responsible for your nature, you must have already been responsible for a prior nature.
  5.  This leads to an infinite regress.
  6.  Since nothing can be *causa sui* (the cause of itself), the regress cannot be completed.
  7.  Therefore, true moral responsibility is impossible.

  Notice that nowhere in this chain does Strawson claim that the prior nature *necessitated* the later nature in a deterministic sense. The problem is not that you were *forced* to be who you are; the problem is that **you didn't make yourself.**

  Even in an indeterministic universe, when you make a choice, you make it for reasons. Those reasons flow from how you are mentally (your character, values, etc.). If you are to be responsible for that choice, you must be responsible for having *those* reasons rather than others. But you didn't choose to have those reasons unless you did so based on *even earlier* reasons.

  Strawson's point is that **determinism is irrelevant to the impossibility of self-creation.** Whether the transition from "Nature A" to "Choice B" is determined or random, you still didn't create Nature A. If you didn't create the foundation of your agency, you aren't the ultimate source of your actions.

  ### 2. The Indeterminist Escape Hatch
  You suggested: *"If the world is genuinely open at some level... there is a moment that is either self-caused or not caused at all, and the regress the argument needs never gets going."*

  Strawson anticipates this. He argues that indeterminism does not help; it actually hurts the case for responsibility.

  *   **If the moment is "self-caused":** This is logically impossible (nothing can cause itself). You would have to exist prior to yourself to do the causing.
  *   **If the moment is "not caused at all" (random):** This is the standard "Luck Objection." If a choice is not determined by your character or reasons, it is random. If it is random, it is not *up to you* in the way required for responsibility. It's just a neural spike or a quantum event.

  Indeterminism breaks the chain of *necessitation*, but it does not establish *authorship*. For Strawson, responsibility requires that *you* are the ultimate source. If your action is determined by your nature, you aren't the source (your nature is, and you didn't choose it). If your action is undetermined by your nature, you aren't the source (chance is). Indeterminism offers no foothold for the kind of "ultimate responsibility" Strawson is analyzing.

  ### 3. The Compatibilist Escape Hatch
  You suggested: *"Since a compatibilist denies that responsibility requires self-creation... it looks to me as though the argument doesn't reach her either."*

  This is a subtle point. You are correct that compatibilists deny the premise that responsibility requires self-creation. However, Strawson's argument is not meant to prove compatibilists are logically inconsistent; it is meant to prove that **the kind of responsibility compatibilists defend is not the kind of responsibility that justifies basic desert.**

  Strawson distinguishes between:
  1.  **Ultimate Moral Responsibility:** The kind that justifies deep, basic desert (praise or blame that reaches all the way to the agent as the ultimate creator of their will).
  2.  **Compatibilist Responsibility:** A pragmatic notion based on reasons-responsiveness, social regulation, and character.

  Strawson grants that compatibilist responsibility is possible. He agrees that we can hold people responsible in the compatibilist sense. His conclusion is that **Ultimate Moral Responsibility is impossible.**

  So, does the argument "reach" the compatibilist? Yes, in this sense: it forces the compatibilist to admit that they are changing the subject. They are offering a watered-down version of responsibility because the "real thing" (which requires being *causa sui*) is impossible. If your friend argues that Strawson's conclusion defeats the *intuitive* notion of responsibility that most people (and many philosophers) hold, then the argument successfully puts the compatibilist on the defensive. The compatibilist must argue that we don't *need* ultimate responsibility to justify our practices of blame. Strawson argues that without ultimate responsibility, basic desert is never truly justified.

  ### Summary of the Dispute
  You have smuggled **causal determinism** into an argument that is about **ontological sourcehood.**

  *   **Your View:** The regress requires deterministic links. If the links are loose (indeterminism), the agent can step in.
  *   **Strawson's View:** The regress is about the origin of the *self* that acts. Loose links (indeterminism) don't give the self any more origin-power; they just make the self's actions random.
  *   **Your Friend's View:** (Presumably) The argument works regardless of determinism because the problem is self-creation, not causal necessity.

  **Verdict:** Your friend has the better of it regarding the scope of the argument. Strawson's Basic Argument is specifically famous because it claims to bypass the traditional Determinism vs. Indeterminism debate entirely. It concludes that moral responsibility is impossible in *any* world where nothing can be *causa sui*—which includes both deterministic and indeterministic worlds.

  For your response paper, the most fruitful path is not to argue that determinism is required (Strawson has strong textual evidence against that), but to critique the demand for **Ultimate Responsibility** itself. Many critics argue that Strawson sets the bar for responsibility impossibly high (requiring god-like self-creation) and then declares responsibility impossible when we fail to clear it. You might argue that the "self-creation" premise is the weak link, not the determinism premise. But you must accept that the argument itself does not rely on determinism.
