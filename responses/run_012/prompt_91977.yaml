  **MINUTES OF THE STANDING COMMITTEE ON EXPRESSIVE CONDUCT**
  **Date:** September 14 | **Time:** 14:00–16:00 | **Location:** Conference Room B
  **Present:** A. Thorne (Chair), B. Kovic, C. Lin, D. Omura, E. Ross. **Secretary:** F. Gaul.

  **1. Call to Order and Charter Adoption**
  Chair Thorne called the meeting to order. The Committee voted to adopt the *Reciprocal Toleration Protocol* (RTP) as standing policy. Per RTP Article 1, intolerance is defined as any position whose general adoption would foreseeably shrink the space for future toleration. Per Article 2, suppression is permitted only as the least restrictive means available. Per Article 3, any objection must be heard and entered in the record before overruling.

  **2. Complaint: Neutrality as Harm**
  *Complainant:* Faculty Member J. Vane.
  *Subject:* Committee Procedure.
  *Claim:* The Committee's studied neutrality regarding institutional hierarchy constitutes intolerance under RTP Article 1, as it preserves conditions that shrink space for marginalized expression.
  *Motion:* To censure the Committee for procedural intolerance.
  *Vote:* Motion failed (3–2).
  *Reasoning:* Neutrality is a procedural mechanism, not a position. Its adoption does not foreseeably shrink space for future toleration.
  *Objection (Ross):* Neutrality in an unequal environment functions as endorsement of the status quo. By refusing to weigh power asymmetries, the Committee allows dominant voices to occupy space disproportionately, thereby foreseeably shrinking the space available for subordinate voices. The procedure *is* the position.

  **3. Complaint: Conduct vs. Expression**
  *Complainant:* Administration.
  *Subject:* Student Group "Veritas."
  *Claim:* A silent vigil blocking clinic access constitutes conduct, not speech, and falls outside RTP protection.
  *Motion:* To classify the vigil as unprotected conduct.
  *Vote:* Motion failed (4–1).
  *Reasoning:* The RTP is silent on conduct. Where intent is expressive, presumption favors classification as speech. Suppression via conduct codes violates Article 2 (least restrictive means).
  *Objection (Lin):* Physical obstruction denies reciprocity. If expression requires the physical liberty of others to move, then obstructing that liberty cannot be protected as expression. The Charter's silence on conduct creates a loophole for coercion disguised as speech.

  **4. Complaint: Evaluative Language**
  *Complainant:* Faculty Senate.
  *Subject:* Department of Sociology.
  *Claim:* Labeling a rival theory "bigoted" is an intolerant act under RTP Article 1.
  *Motion:* To sanction the Department for hate speech.
  *Vote:* Motion failed (3–2).
  *Reasoning:* Evaluative labeling is protected speech unless it forecloses debate. No evidence suggests debate was foreclosed.
  *Objection (Kovic):* Moral labeling functions as exclusion. It signals to third parties that engagement is unsafe. This creates a chilling effect that foreseeably shrinks the space for future toleration by making certain inquiries career-ending. The effect is suppression without the form.

  **5. Complaint: Event Security and Last-Resort Clause**
  *Complainant:* Student Coalition.
  *Subject:* Invited Speaker Dr. H.
  *Claim:* Allowing Dr. H to speak requires silencing counter-protesters, violating Article 2.
  *Motion:* To cancel the event to satisfy the least restrictive means clause.
  *Vote:* Motion failed (3–2).
  *Reasoning:* Silencing the speaker violates contractual obligations and established venue policy. Silencing counter-protesters preserves the venue for future use.
  *Objection (Omura):* Silencing the answerers privileges the harm over the response. If the speech causes harm that restricts others' participation, the least restrictive means to preserve future toleration is to remove the source of harm, not those reacting to it. Protecting the speaker protects the intolerance; protecting the protesters protects the space.

  **6. New Business: Committee Composition**
  *Motion (Kovic):* To apply RTP Article 1 to the Committee's own composition. If the Committee lacks diverse viewpoints, its rulings may foreseeably shrink the space for future toleration.
  *Ruling by Chair:* Motion tabled.
  *Reasoning:* To vote on this motion, the Committee must determine if the motion itself is intolerant. If the motion is intolerant, it cannot be heard per Article 3. If it is tolerant, it must be voted on. The Committee lacks a meta-committee to adjudicate the intolerance of the motion regarding the Committee's authority to adjudicate intolerance.
  *Objection (Lin):* The Committee cannot claim authority to define intolerance while exempting itself from the definition. This exempts the regulator from the regulation.

  **7. Adjournment**
  Meeting adjourned at 16:00 pending legal counsel on Item 6.
  *Recorded by:* F. Gaul, Secretary.
