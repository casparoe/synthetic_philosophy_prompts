  6.  **Refining the "Rationality" Point:**
      *   The student says: "Each bid above the dollar is a rational attempt to lose less."
      *   Correction: It is *marginally* rational *conditional on the opponent stopping*. If the opponent plays optimally (never starts or knows you won't stop), the bid is irrational. It's a "rational trap" but calling the bid itself rational without qualification is slightly misleading in Game Theory terms (it's not a Nash Equilibrium strategy to bid >$1 unless you know the opponent is boundedly rational).
      *   However, for a JDM unit, the focus is often on the psychological driver. The student's point that "local rationality leads to global irrationality" is the key insight. I shouldn't penalize too hard for game-theoretic pedantry, but the distinction between Sunk Cost and Escalation is the core of Part (b).
