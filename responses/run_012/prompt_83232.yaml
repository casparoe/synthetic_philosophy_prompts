answer: |-
  # FINAL EXAMINATION: ARCHAEOLOGICAL INFERENCE
  **Time Allowed:** 90 Minutes
  **Marks:** 20
  **Instructions:** Closed book. No internet access. Answer the question below.

  ### THE HARROW FIELD DOSSIER

  **Site:** Harrow Field, a settlement with an adjacent cemetery, occupied over roughly three centuries and excavated in three phases, the lowest waterlogged and the upper levels dry.

  1.  Thirty-eight round houses, rebuilt repeatedly on the same footprints, arranged in two spatially separate clusters; a single larger rectangular building stands at the centre of the eastern cluster.
  2.  A cemetery of 124 graves inside a ditched enclosure about 200 metres from the houses. The ditch fills are clean; domestic refuse at the site is deposited in a midden beside the houses.
  3.  Grave goods: 110 graves contain at least one pot; 14 contain copper-alloy objects; 4 contain stone from a source 300 km away; 3 contain miniature four-wheeled vehicles; 2 contain bird figurines. The richly furnished graves are scattered rather than grouped, and goods correlate weakly with the sex and age of the skeleton.
  4.  Twenty-two graves were reopened after burial: the fill is disturbed and some skeletal elements, mostly long bones and skulls, are missing, while the goods are undisturbed.
  5.  Animal bone: skulls and foot bones are concentrated in and around the houses; meat-bearing bones are concentrated in the midden. In the cemetery, small quantities of meat-bearing cattle bone occur in 9 graves.
  6.  Three storage pits contain a complete pot set upright on the base with no domestic refuse; the remaining pits contain refuse or are empty.
  7.  About 2–3 per cent of the lithic material in every phase comes from sources more than 150 km away; the proportion is stable across the sequence.
  8.  No writing, and no figurative art apart from the two bird figurines.
  9.  The rectangular building's floor carries a burnt layer with charred grain and a scatter of broken pots. The round houses have central hearths and nothing comparable.
  10. Dating between the two house clusters and between phases is coarse, with a resolution no finer than a century.

  ### THE TASK

  Assess the following nine claims about the site:

  (a) The dead were buried in two stages, with some bones removed after the flesh had decayed.
  (b) The community believed that the dead had to be released before they could join the ancestors.
  (c) The settlement was occupied by two contemporaneous descent groups, one per cluster of houses.
  (d) Access to copper-alloy and imported stone objects was restricted to a few families and passed down by inheritance.
  (e) The rectangular building was a communal structure in which grain was consumed on repeated occasions.
  (f) Cattle were slaughtered seasonally, in late summer.
  (g) The community distinguished a domain of the sacred from the ordinary.
  (h) The two bird figurines represent a supernatural being.
  (i) The community was in sustained, low-level contact with groups at least 150 km away.

  **Write an essay that addresses the following three parts:**

  1.  **Classification:** Sort the claims into three categories: (i) **Supported** by the dossier as it stands; (ii) **Evidentially Underdetermined** (more data of the same kind could settle it); and (iii) **Semantically Underdetermined** (no more data of the same kind could settle it). Justify your sorting by citing specific dossier items and identifying the **bridge assumption** required for the underdetermined claims.
  2.  **Inferential Work:** Select one claim from *each* of your three categories. Explain what further evidence would raise or lower confidence in each, and specify whether that evidence is of the *same kind* as the current record or *independent* of it.
  3.  **General Principle:** State and defend a general principle about which claims concerning past minds the material record can and cannot settle. Apply this principle to one further claim of your own devising that the dossier does not raise.

  ***

  # MODEL ANSWER

  **Part 1: Classification**
  The claims divide based on whether the inference rests on physical patterning alone or requires an interpretive bridge regarding meaning.

  **Supported:** Claims (a) and (i). Claim (a) is directly warranted by Item 4 (disturbed fill, missing bones, undisturbed goods), which physically describes a secondary intervention. Claim (i) is warranted by Item 7; the stable presence of exotic lithics physically demonstrates contact without requiring assumptions about the *nature* of that contact.

  **Evidentially Underdetermined:** Claims (c), (d), (e), and (f). These describe social or biological mechanisms that leave physical traces but are not settled by the current traces. For (c), Item 1 shows spatial clustering, but confirming "descent groups" requires ancient DNA or isotopic data (same kind of physical data) to prove kinship. For (d), Item 3 shows scarcity, but "inheritance" requires genealogical proof. For (f), Item 5 describes bone distribution, but seasonality requires tooth eruption or wear analysis. These are gaps in data density, not logic.

  **Semantically Underdetermined:** Claims (b), (g), and (h). These attribute meaning or mental states. For (b), Item 4 shows bone removal, but the *reason* (ancestor release) is a bridge assumption; the bones could be trophies, relics, or waste. More graves (same kind) will not reveal the motive. For (g), Item 2 and 6 show separation of space and objects, but labeling this "sacred" imposes a category not inherent in the dirt. For (h), Item 8 notes figurines, but "supernatural being" is an interpretation of representation. These claims require independent bridges (ethnography, text) because material patterns are compatible with incompatible meanings.

  **Part 2: Inferential Work**
  *From Supported:* Claim (i). Confidence rises with more lithic sourcing (same kind). If 50% of tools were exotic, contact is intensified; if 0%, it ceases. The evidence type remains material provenance.
  *From Evidential:* Claim (c). Confidence rises with strontium isotope analysis of teeth (same kind). If individuals in Cluster A share non-local signatures distinct from Cluster B, descent is likely. This remains within the realm of physical observation.
  *From Semantic:* Claim (b). Confidence *cannot* be raised by more excavation. Digging up 500 more graves with missing bones only replicates the pattern. Confidence requires independent evidence, such as a later text describing similar rites or a strong ethnographic analogy argued for relevance. The evidence must be of a different kind (symbolic/linguistic) to bridge the gap to belief.

  **Part 3: General Principle**
  **Principle:** The material record can settle claims about *action* and *presence* (what was done, what was there), but it cannot settle claims about *intent* and *category* (why it was done, what it meant) without independent warrant. Material patterns are finite; meanings are infinite.

  **Application:** Consider the claim: "The community feared the dark." The dossier shows hearths in round houses (Item 9). An evidential approach might seek soot analysis to prove night-time use. However, "fear" is a mental state. Even if we prove night activity, they may have loved the night. To settle "fear," we would need independent evidence, such as mythology associating darkness with danger. Without that, the claim remains semantically underdetermined, regardless of how much charcoal we find. The record shows the fire, not the fear.

  ***

  # MARKING SCHEME (20 MARKS)

  **Five Must-Hit Points (4 marks each)**

  1.  **Correct Classification of Claims:**
      *   *Criteria:* (a) and (i) must be Supported; (c), (d), (e), (f) must be Evidential; (b), (g), (h) must be Semantic.
      *   *Loss:* 1 mark deducted for each misclassified claim (max 4).
      *   *Typical Error:* Placing (b) or (g) in Evidential, arguing "more graves would tell us."

  2.  **Dossier Citation and Justification:**
      *   *Criteria:* Specific Item numbers must be linked to the claims (e.g., Item 4 for bone removal).
      *   *Loss:* 1 mark deducted for vague references (e.g., "the graves" instead of "Item 4").
      *   *Typical Error:* Generalizing the dossier content without pinpointing the specific constraint.

  3.  **Identification of Bridge Assumptions:**
      *   *Criteria:* Must explicitly state that Semantic claims require an assumption connecting pattern to meaning (e.g., "separation = sacred").
      *   *Loss:* 2 marks if the distinction is merely named without explaining the logical gap.
      *   *Typical Error:* Using the term "semantic underdetermination" as a slogan without defining the bridge.

  4.  **Evidence Analysis (Same vs. Independent Kind):**
      *   *Criteria:* Part 2 must distinguish that Evidential claims need *more/same* data, while Semantic claims need *independent* data (text/analogy).
      *   *Loss:* 2 marks if the student suggests more excavation solves a Semantic claim.
      *   *Typical Error:* Suggesting finding a third bird figurine would prove "supernatural being."

  5.  **General Principle and Novel Application:**
      *   *Criteria:* Principle must distinguish action/presence from intent/meaning. Novel claim must be tested against this principle correctly.
      *   *Loss:* 2 marks if the principle is vague (e.g., "we can't know everything") or the novel claim is misapplied.
      *   *Typical Error:* Formulating a principle about "bias" rather than "underdetermination."

  **Differentiation (A vs. B Grade)**
  *   **B Answer:** Correctly sorts the claims and identifies that Semantic claims need different evidence. Uses the terminology correctly.
  *   **A Answer:** Explicitly articulates *why* Semantic claims resist more data (the logical incompatibility of pattern and meaning). In Part 3, the general principle is framed as a limit of *inference*, not just a lack of data. The novel claim application demonstrates the principle holds even outside the provided text. The A answer treats the distinction as a logical problem, not a methodological checklist.
