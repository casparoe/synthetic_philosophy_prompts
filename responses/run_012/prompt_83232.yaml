          *   (h) Semantic (Representation is meaning).
          *   (i) Supported (Physical presence of exotic material is direct evidence of contact).

  4.  **Developing the Marking Scheme:**
      *   Total: 20 Marks.
      *   5 Must-Hit Points (4 marks each).
      *   *Point 1:* Correct sorting of claims (specifically distinguishing Evidential vs. Semantic).
      *   *Point 2:* Justification using specific Dossier Items.
      *   *Point 3:* Identification of "Bridge Assumptions" for semantic claims.
