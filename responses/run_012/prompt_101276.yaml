answer: |-
  Your working reading is precise: the passage conflates ontology (what groups are), epistemology (what can be known/recorded), and teleology (what counts toward Spirit's end). Your suspicion that the first claim is nearly empty is correct, but with a qualification: it is empty of independent empirical content, but it is not inert. It functions as the *conclusion* derived from the third claim (Spirit's self-consciousness), disguised as a description of the first (the object).

  Here is the analysis of the internal argument through your six questions.

  ### 1. The Direction of Inference (Abstraction vs. State)
  The text states: *"The consciousness of external definite existence only arises in connection with the power to form abstract distinctions... in proportion as a capacity for expressing Laws... is acquired, in the same proportion does the ability manifest itself to comprehend objects in an unpoetical form."*

  The inference is presented as a correlation ("in proportion as"), but it functions logically as a mutual implication. Hegel is not arguing that a people first develops abstract thought and then builds a state, nor strictly that the state forces abstract thought. He is arguing that **Statehood and Abstract Consciousness are the same phenomenon viewed from different sides.** The State is the objective existence of the capacity for abstract distinction; abstract distinction is the subjective capacity required for the State.

  Does the argument require a direction? Yes, logically. The capacity for abstraction is the *condition of possibility* for the State (Law requires universal categories). However, historically, Hegel treats them as simultaneous. If the argument ran only one way (e.g., State creates Abstraction), then a people could theoretically possess the cognitive capacity without a State, rendering them "historical" in mind but not in fact. Hegel blocks this by insisting that consciousness of "external definite existence" *only arises* with that power.

  If it runs both ways, does the passage do work? Yes, it creates a closed conceptual loop. It makes the "unhistorical" status unfalsifiable by empirical observation. If you point to a nomad group with complex oral laws, Hegel can claim those laws are not "abstract" enough because they are not embodied in a State. If you point to a State, he claims the abstraction is present. The work the passage does is to **collapse the distinction between cognitive development and political organization.** This prevents the historian from saying, "They had the minds for history but lacked the politics." For Hegel, lacking the politics *means* lacking the minds.

  ### 2. "History is prose, and myths fall short."
  This is a claim about the **structure of consciousness manifest in discourse**, not merely literary genre.

  For Hegel, "Myth" is not defined by falsity. A myth can be written down (as you note), and it can be believed. It is excluded based on **form**. Myth operates via *Vorstellung* (representation/imagination), where the universal and particular, the divine and human, are fused. "Prose" operates via *Verstand* (understanding), which separates subject from object, cause from effect, and law from instance.

  History, for Hegel, requires the subject to stand back from the object and view it as a distinct, determinate thing ("external definite existence"). Myth does not allow this distance; in myth, the agent is possessed by the god, or the event is a manifestation of nature, not a free human act. Therefore, myth is excluded not because it is false, but because it **cannot sustain the category of human agency** required for History. It records events, but it does not record *actions* undertaken by self-conscious agents under universal laws. Even written myth is "pre-historical" because the *mode of thinking* that produced it has not yet achieved the separation necessary for historical judgment.

  ### 3. "So far and so long as... appear on the scene."
  The qualifier is conditional, but the condition is not empirical; it is **dialectical**.

  *   **On what scene?** The "scene of history" is not a geographical stage but the stage of World Spirit. It is the arena where the principle of Freedom is being actualized.
  *   **Set by whom?** It is set by the logical progression of the Concept (*Begriff*). Hegel determines in advance what constitutes a valid "appearance" (i.e., the State).
  *   **Is it circular?** Yes, formally. "A people is historical when it enters History." However, Hegel attempts to break the circle by defining the entry ticket: **The State.** The sentence effectively reads: "Nomads are unhistorical so long as they do not form a State."

  The circularity lies in the assumption that *only* State-formation counts as entering the "scene." If one defines the "scene" as "collective human agency," the circle breaks, but Hegel's system collapses. The qualifier allows Hegel to account for change (Nomads *can* become historical, e.g., the Mongols) without admitting that they *were* historical before. It preserves the teleology: they were waiting in the wings until they adopted the requisite form (Statehood).

  ### 4. Descriptive or Evaluative?
  "Unhistorical" here is **ontologically evaluative**.

  It is not merely descriptive (we have no records) because Hegel admits "surmises and suppositions may be entertained." We can know *about* them, but they do not count *in* History. It is not merely evaluative in a moral sense (they are bad), but in a metaphysical sense (they do not participate in the actualization of Freedom).

  *   **Can empirical evidence refute it?** No. Pointing to Siberian records or polities fails because Hegel has already defined the criteria for what counts as a valid record or polity. If the Siberian polities do not embody "abstract law" or "self-cognizant life" (as Hegel defines them), they are classified as "tribal" or "theocratic," not "State."
  *   **What evidence would count?** Only evidence that challenges the definition of History itself. To refute this, one must demonstrate that human freedom can be actualized without the specific triad of Prose/Law/State. Within Hegel's system, the claim is a priori; outside his system, it is a definitional stipulation.

  Your suspicion that the first claim (about the object) is empty is confirmed here. The "features" of the object are determined by the evaluation. They lack the features *because* they are unhistorical, not vice versa.

  ### 5. Steelman and Break Point
  **The Steelman:**
  History is not the totality of past events, but the subset of events where humans act as **universal agents**. To act as a universal agent, one must subordinate immediate impulse to a universal law. This subordination requires an institution (the State) that embodies that law objectively. Without such an institution, human action remains particular, contingent, and bound to nature (e.g., seasonal migration, kinship revenge). Therefore, "unhistorical" peoples are not those without records, but those whose collective life has not yet achieved the **objectivity of freedom**. They live in time, but they do not make History because they do not consciously shape their collective destiny through universal institutions. This is a robust claim: statelessness limits the scope of collective self-determination.

  **Where it Breaks:**
  The steelman breaks at the identification of **Institution** with **State** (specifically, the stratified, law-codifying State).
  Hegel assumes that the *only* way to embody universal law is through a bureaucratic apparatus that separates rulers from ruled and produces written "prose" law. He cannot conceive of institutional embodiment in consensus-based, oral, or kinship structures.
  Furthermore, he conflates the **existence** of freedom with the **consciousness** of freedom in a specific philosophical form. A people might embody freedom in their practices without articulating it in "abstract predicates." By demanding the *discourse* of abstraction (prose/law) as a condition for the *reality* of freedom, Hegel mistakes the map for the territory. The criterion cannot be separated from the European path because Hegel defines the "universal" by looking at the specific features of the modern European state and universalizing them.

  ### 6. Modifying for Global History
  To treat these peoples as agents without adopting his criterion, you must reject the move that **equates "Historical" with "State-Bearing."**

  *   **The Single Move:** Reject the claim that *"The consciousness of external definite existence only arises in connection with the power to form abstract distinctions [codified as Law]."*
  *   **Can you keep the rest?** You can keep the thought that "freedom requires institutional embodiment." However, you cannot keep the rest of Hegel's *argument* intact.
  *   **Why?** Hegel's dialectic relies on a specific sequence: Immediate Unity (Oriental) -> Individual Subjectivity (Greek) -> Reconciled Universality (Germanic). If you admit that "unhistorical" peoples (Nomads, Stateless societies) possess institutional embodiment of freedom, you destroy the starting point of the dialectic. The "Oriental World" is only the "Childhood of Spirit" because it lacks subjective freedom. If Stateless peoples have agency, the "Childhood" is not a lack, but a different mode.
  *   **Consequence:** You can keep the *philosophical intuition* (freedom needs institutions) but you must discard the *philosophy of history* (the linear progression toward the European State). You would have to replace "History" (singular, teleological) with "histories" (plural, typological). This preserves the agency of the peoples but abandons Hegel's core claim that there is *one* History in which some peoples are merely props or obstacles.

  **Summary of your Working Reading:**
  You are correct that the moral force comes from the third claim (Spirit/Freedom) and the persuasive work from the second (Prose/Law). The first claim (the object's lack of features) is indeed derivative. It is the shadow cast by the other two. The passage's internal coherence relies on the reader accepting that "Prose" and "State" are not just cultural artifacts but ontological prerequisites for human self-consciousness. If you sever that link, the "unhistorical" label loses its grip.
