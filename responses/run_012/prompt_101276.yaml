          *   *Exclusion Grounds:* Not necessarily falsity (myths can contain truth), but *form*. Myth merges the subject and object; Prose distinguishes them. History requires the subject to stand back and observe the object (the state/events) distinctly.
          *   *Written Myth:* Even if written, if the *structure of thought* is mythical (identity of divine/human, lack of causal distinction), it's not History for Hegel. It's about the *concept* of time and agency.

      *   **Q3: "So far and so long as... appear on the scene."**
