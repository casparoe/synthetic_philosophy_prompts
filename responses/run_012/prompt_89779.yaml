answer: |-
  Good morning. Welcome to all of you.

  Looking around this room, I see a divide that I hope we will spend the next two days bridging. On one side, we have those who know the formal architecture of the problem we are here to discuss. On the other, we have policymakers, public-health practitioners, and students who are encountering this idea for the first time. My goal in these opening remarks is not to teach the specialists something new, nor to bore them with definitions. Nor is it to overwhelm the rest of you with formalism. Instead, I want us to inhabit a specific tension together. I want the problem itself to structure our time here, not as a definition we clear out of the way in the first hour, but as a ghost that haunts every panel and coffee break we share.

  To do that, I want to begin with a story. It is a fiction, but it is built from the materials of our reality.

  Imagine a small consortium of three independent laboratories. They are working on the same pathogen. They have all reached a critical juncture: they have generated a finding that could revolutionize vaccine development. The benefit is massive. But the finding also involves a genetic modification that carries a small, non-zero probability of accidental release. If released, the harm is catastrophic.

  Each lab director sits in their office, looking at their own data. They are ethical people. They want to save lives, and they want to prevent harm. They each perform a calculation. They weigh the probability of the benefit against the probability of the risk. In each individual office, the expected value comes out positive. The chance of a pandemic is low; the chance of a cure is high. So, each director decides: I will publish.

  Now, notice what happens to the group. The secret is out if *any* one of them publishes. The cat does not need to be let out of the bag by all three owners; it only needs one loose latch. So, while each individual acted on the judgment that the risk was acceptable, the group has effectively acted on the judgment that the risk is acceptable if *any single member* thinks so.

  If these three labs had sat around a table and decided together, they would have required a consensus. They would have asked: "Do we all agree the risk is low enough?" But because they acted unilaterally, they bypassed the collective veto. They have shifted the threshold for action from "all agree" to "one agrees." This is the unilateralist's curse.

  We spend much of our intellectual lives worshipping at the altar of the invisible hand. We are taught that when individuals pursue their own rational interests in a decentralized way, the aggregate result is often efficient, innovative, and good. We trust the market because we trust the sum of individual judgments.

  This curse is the mirror image of the invisible hand. Here, individually rational, decentralized action aggregates to a collectively bad result. Each director acted prudently. Each director acted altruistically, aiming for the greater good. Yet, the system produced a level of risk that none of them would have endorsed had they been forced to decide as a single body. The tragedy is not that anyone was selfish. The tragedy is that everyone was responsible.

  Now, I can hear the objection rising in the room. It is the natural defense. One of those lab directors might say: "Wait a minute. I acted correctly given what I knew. My data said the benefit outweighed the risk. Why should I be held hostage by the caution of my colleagues? If I was right, and they were too cautious, didn't the world benefit by my unilateral action?"

  This defense is powerful because it is true. In any single instance, the unilateralist might be the hero who saw the truth when others hesitated. But this defense fails to answer the charge because it ignores the structure of the situation. The charge is not that you made a math error. The charge is that you ignored the fact that your colleagues were running the same calculation with slightly different data.

  When you act unilaterally, you are not just acting on your evidence; you are implicitly claiming that your evidence is sufficient to override the potential veto of the group. You are treating your own judgment as decisive for everyone. When all three labs do this, the risk compounds. The defense "I did my duty" works for the individual conscience, but it fails the collective safety test. It solves the problem of personal integrity while creating a problem of systemic security.

  So, where does this leave us? The obvious remedy is conformity. We establish a norm: Do not act alone. If you find something dangerous, you must consult. You must wait for the consortium to agree. You submit to the collective will.

  But this is where I want us to feel the discomfort. This is where I want the specialists to worry about the model, and the practitioners to worry about their jobs.

  A standing norm against unilateral action is exactly the sort of thing that has, elsewhere, smothered initiative that turned out to matter. Think of the whistleblower who sees a danger the consortium is ignoring. Think of the researcher who realizes a cure is possible while the committee is still debating liability. If we cure the unilateralist's curse by enforcing conformity, do we simply trade the risk of catastrophe for the certainty of stagnation?

  If the three labs had agreed to wait for consensus, they might have prevented the accidental release. But they might also have delayed the vaccine by five years, during which thousands died of the natural pathogen. The cure for the curse has its own cost. It transfers power from the individual to the group, and groups are often slower, more political, and more risk-averse than individuals.

  This is the work we have to do for the next two days. We are not here to prove the curse exists; we accept that it does. We are not here to simply declare that unilateralism is bad. We are here to ask: When is the unilateralist a rogue actor, and when are they a prophet?

  For the specialists in the room, I ask you to keep the labs in mind when you discuss the formal parameters. Don't let the variables float away from the stakes. For the policymakers and practitioners, I ask you to look for the structural parallels in your own agencies. When do your protocols protect you from rash action, and when do they protect you from necessary action?

  We are navigating a space between the chaos of everyone doing what seems right to them, and the paralysis of everyone waiting for permission. The unilateralist's curse tells us that individual rationality is not enough. But it does not tell us exactly how much conformity is too much. That balance is not a formula we can derive on a whiteboard. It is a judgment we have to forge together.

  Let us spend these two days testing that judgment against the hard cases. Let us see if we can find a way to act together without losing the ability to act at all.

  Thank you, and let's begin.
