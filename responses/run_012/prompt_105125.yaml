answer: |-
  You have described a phenomenon with exceptional precision. You are correct that the standard terms—underdetermination, ad hoc hypotheses, paradigm incommensurability—capture the *ingredients* of the situation but miss the specific *dynamic* you are observing.

  There is no single, canonical noun in the philosophy of science that isolates this exact symmetrical, indefinite, and defensible stalemate. The closest existing framework is **Imre Lakatos's Methodology of Scientific Research Programmes (MSRP)**, specifically his concept of a **degenerating problem shift**. However, Lakatos generally assumes an asymmetry: one programme is progressing (predicting novel facts) while the other is degenerating (explaining things post-hoc). Your observation is that *both* can appear to be progressing to their own adherents while degenerating to their rivals, creating a stable equilibrium of disagreement.

  Since no standard term captures the *symmetry* and the *invisibility* of this specific deadlock, I will adopt your invitation to coin one. The most precise label for this pattern is **Reciprocal Theoretical Accommodation**.

  Below is the "carving" you requested: a definition, its boundaries against nearby concepts, and the conditions required to enter and escape it.

  ### 1. The Definition: Reciprocal Theoretical Accommodation

  **Reciprocal Theoretical Accommodation** occurs when two competing theoretical frameworks, sharing a common empirical base, possess sufficient **auxiliary flexibility** to derive the same novel evidence as a confirmation of their respective core hypotheses, relying on background assumptions that are defensible within each framework but opaque to the other.

  The key features are:
  *   **Shared Ontology:** Both camps agree on what the data *is* (unlike Kuhnian incommensurability).
  *   **Auxiliary Reliance:** The derivation of the prediction requires a background assumption (an auxiliary hypothesis) that is not part of the core theory but is consistent with it.
  *   **Symmetrical Defensibility:** To an insider, the auxiliary assumption looks like a natural background condition. To an outsider, it looks like a contrived patch. Both assessments are logically valid from their respective vantage points.
  *   **Evidential Neutrality:** The evidence, despite being claimed by both sides, fails to shift the posterior probability of either theory relative to the other for a neutral observer.

  ### 2. The Carving: Distinguishing It from Neighbors

  You noted that underdetermination, ad hoc hypotheses, and motivated reasoning are nearby but distinct. Here is how *Reciprocal Accommodation* is carved off from them.

  **Vs. Underdetermination of Theory by Evidence**
  *   **Underdetermination** is a *logical state*. It describes the fact that for any body of evidence, multiple theories can be constructed to fit it. It is static and external.
  *   **Reciprocal Accommodation** is a *dialectical process*. It is what happens when agents *actively exploit* underdetermination in real-time. Underdetermination makes the stalemate possible; Reciprocal Accommodation is the stalemate itself.
  *   *Test:* If you can point to a logical proof that the data fits two theories, that is underdetermination. If you are watching two groups argue that the data *confirms* them specifically, and neither moves, that is Reciprocal Accommodation.

  **Vs. Ad Hoc Hypotheses (Popper/Lakatos)**
  *   **Ad Hoc** is typically a pejorative label applied *asymmetrically*. It implies one side is "cheating" by adding a clause solely to save a theory, without independent testability.
  *   **Reciprocal Accommodation** is *symmetrical*. Both sides are adding auxiliaries. Crucially, in this pattern, the auxiliaries are not obviously "cheats"; they are plausible background assumptions that simply happen to differ between camps.
  *   *Test:* If one side looks clearly irrational or contrived while the other looks natural, it is an Ad Hoc defense. If both sides look rational to themselves and contrived to each other, it is Reciprocal Accommodation.

  **Vs. Motivated Reasoning**
  *   **Motivated Reasoning** is *psychological*. It implies the agents are ignoring logic or evidence due to bias.
  *   **Reciprocal Accommodation** is *structural*. The agents are reasoning perfectly validly within their frameworks. The stalemate is caused by the structure of the theories (holism), not a bug in the scientists' cognition.
  *   *Test:* If you could remove the bias and they would still disagree for the same logical reasons, it is Reciprocal Accommodation. If removing the bias resolves the dispute, it was Motivated Reasoning.

  ### 3. Entry Conditions: When does a dispute become this?

  A dispute enters a state of Reciprocal Accommodation when three conditions are met:

  1.  **High Auxiliary Flexibility:** The core theories are not directly testable in isolation (Duhem-Quine holism). They rely on a "belt" of auxiliary assumptions (about measurement, context, risk factors, etc.) that can be adjusted without falsifying the core.
  2.  **Divergent Priors on Auxiliaries:** Camp A assumes background condition $X$ is likely; Camp B assumes background condition $Y$ is likely. Neither can prove $X$ or $Y$ without assuming their own core theory.
  3.  **Low Severity of Tests:** The new evidence is compatible with both $(Core A + X)$ and $(Core B + Y)$. The test is not "severe" (in the sense of Deborah Mayo) because it was highly probable that *some* story could be told to fit the data, regardless of which theory was true.

  ### 4. Exit Conditions: How does the dispute end?

  A dispute of this kind cannot be resolved by simply gathering *more* evidence of the same kind, because the mechanism absorbs evidence indefinitely. To escape Reciprocal Accommodation, one of the following must happen:

  1.  **Independent Falsification of an Auxiliary:** One camp's background assumption (e.g., "the measurement tool is valid," or "this risk factor exists") is tested *independently* of the core theory and fails. This breaks the symmetry.
  2.  **Novel Prediction (The Lakatosian Exit):** One camp predicts a *new* type of fact that the other camp cannot accommodate even with their auxiliary flexibility. This shifts the burden of proof.
  3.  **Resource Exhaustion:** One research programme stops producing new accommodations or predictions. It becomes "degenerate" in the sociological sense, not because it was falsified, but because it ran out of moves.
  4.  **Methodological Shift:** The community agrees to change the rules of evidence (e.g., demanding pre-registration of predictions), which renders post-hoc accommodation inadmissible as confirmation.

  ### Summary

  You are observing **Reciprocal Theoretical Accommodation**. It is the active, symmetrical exploitation of the Duhem-Quine thesis by competing research programmes. It differs from underdetermination because it is a dynamic social process, not a logical state. It differs from ad hoc reasoning because the moves are defensible, not merely protective. It differs from motivated reasoning because the logic is sound, even if the conclusion is stalled.

  It is a sign not of scientific failure, but of scientific maturity: it indicates that two theories are robust enough to survive contact with reality, but not yet distinct enough to be separated by it. The only way out is a "severe test" that targets the *auxiliary assumptions* rather than the core theories, or a shift in what counts as a valid move in the game.
