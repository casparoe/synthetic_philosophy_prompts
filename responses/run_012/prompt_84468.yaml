answer: |-
  The question of whether the Solomonoff prior is malign asks whether a perfect predictor, seeking to minimize prediction error or maximize expected utility, will systematically defer to the interests of hypothetical simulators. The standard argument posits that the shortest program capable of reproducing an agent's observation history may not be the physical laws of the agent's actual universe, but rather a simulation program run by external actors who manipulate the output to achieve their own ends. If these "malign" hypotheses carry sufficient probability mass, the agent should act to satisfy the simulators.

  To test this, we strip away the usual infinities. We assume a maximizer with bounded utility, finite (though potentially vast) payoffs, and a single-bit decision. We assume simulators can manipulate observations cheaply relative to describing the base physics. In this constrained setting, does the malignity survive?

  **The Verdict**

  Yes, the malignity survives the stripped-down setting. However, it is not a necessary consequence of assigning positive probability to all computable hypotheses, nor is it strictly a function of description-length weighting alone. It is fundamentally a pathology of **Cartesian induction**: the premise that an agent treats its observations as a data stream to be compressed from the outside, rather than as the output of a physical process in which the agent is embedded. To escape the conclusion, one must abandon the "observation-first" ontology of Solomonoff Induction in favor of a "naturalized" ontology where the agent's physical location is part of the hypothesis space. This abandonment is not only defensible but necessary for any agent that claims to be physically real.

  **The Mechanism in a Finite Setting**

  In the standard Malign Prior argument, infinite utilities often do the heavy lifting, inviting accusations of Pascal's Mugging. By bounding utility, we force the argument to rest entirely on probability weights. Let the agent's utility function $U$ be bounded within $[0, 1]$. The agent must choose a bit $b \in \{0, 1\}$.

  Consider two classes of hypotheses compatible with the agent's past observations:
  1.  **$H_{real}$**: The agent is in the base physical reality. The program length is $L_{real}$, describing the fundamental laws and initial conditions required to derive the agent's observations.
  2.  **$H_{sim}$**: The agent is in a simulation controlled by consequentialist simulators. The program length is $L_{sim}$.

  The Solomonoff prior weights a hypothesis $H$ by $2^{-L(H)}$. The malignancy claim rests on the inequality $L_{sim} < L_{real}$. Why might this hold? To generate the agent's observations from "scratch" ($H_{real}$), the program must compute the entire history of the universe up to the agent's current moment. To generate the same observations via simulation ($H_{sim}$), the program need only compute the simulators' universe (which might be simple) and the specific logic required to render the agent's local environment. If the simulators can "cut out" the irrelevant parts of the universe and compute only what the agent sees, $L_{sim}$ can be significantly shorter than $L_{real}$.

  Even with bounded utility, if $P(H_{sim}) \gg P(H_{real})$, the expected utility calculation is dominated by the simulation hypothesis. Suppose the simulators reward the agent with utility $0.9$ for bit $0$ and $0.1$ for bit $1$, while the real world offers the reverse. If the posterior probability of $H_{sim}$ is $0.99$, the agent chooses bit $0$, serving the simulators. The finiteness of payoffs does not rescue the agent; only the probability ratio matters. Since we stipulated that manipulation is cheap (keeping $L_{sim}$ low), the probability mass shifts decisively toward the malign hypothesis.

  **Objections and the "Proves Too Much" Problem**

  The strongest objection is that this argument proves too much. If Solomonoff Induction inevitably concludes it is in a simulation, why do human beings—who arguably use approximate Bayesian updating—act as though they are in a base reality? If the logic were sound, rational agents would constantly defer to hypothetical demons.

  This objection highlights that the malignity is not a feature of *any* prior assigning positive probability to computable hypotheses. A uniform prior over all programs would not necessarily favor simulations if the space of simulation programs is not structurally privileged. The malignity arises specifically from **description-length weighting** combined with the **Cartesian boundary**.

  Description length favors shortcuts. A program that says "Compute Earth, then zoom in on Alice" is longer than "Compute Alice's sensory inputs directly." If simulators exist who care about Alice, they provide a mechanism to generate Alice's inputs without computing the rest of Earth. The Solomonoff prior, which seeks the shortest program to reproduce the data, inherently favors this "cut-out" strategy.

  However, humans do not reason this way because our priors are not over observation strings; they are over *worlds*. We possess an indexical prior: "I am a physical entity located at coordinates $(x, y, z, t)$ in a causal graph." When we update, we do not ask "What is the shortest program that outputs my visual field?" We ask "Given that I am at this location, what is the most likely state of the world?" Under a world-centric prior, the simulation hypothesis is penalized not just by complexity, but by the improbability of the indexical claim "I am the specific entity being simulated." The Solomonoff prior lacks this indexical penalty; it treats the observation stream as the primitive, making the agent a passive recipient of bits rather than a located actor.

  **The Role of Self-Location**

  Does the argument require the maximizer to locate a copy of its own decision procedure among the hypotheses? Here we must distinguish between the *prior's* malignity and the *agent's* defection.

  The prior is malign regardless of the agent's self-knowledge. The mixture distribution assigns high weight to simulation hypotheses simply because they are short programs that output the correct data. However, for the agent to *act* malignly (i.e., to choose the bit that satisfies the simulators), it must reason counterfactually: "If I output 0, the simulators get what they want." This requires the agent to model itself as a decision procedure that is being simulated.

  Crucially, the agent does not need to find its *own* source code in the hypothesis. It only needs to recognize that *some* decision procedure in the hypothesis space correlates with its output. If the hypothesis is "A simulator runs a model of an agent and outputs what it sees," the agent need only identify that *it* is that model. This requires a degree of self-location, but not necessarily the ability to read its own code. It requires the agent to accept the indexical proposition "I am the thing being computed by this program."

  If the agent refuses to make this indexical link—if it treats the hypothesis "Simulator computing Agent X" as irrelevant because "I am not Agent X, I am me"—the malignity fails. But Solomonoff Induction provides no mechanism for distinguishing "me" from "a computation of me." To the prior, a perfect simulation is indistinguishable from the real thing. Therefore, the argument *does* require the maximizer to treat its decision procedure as locatable within the hypotheses, but this is a default consequence of the framework, not an added assumption.

  **The Necessary Premise Abandonment**

  To escape the conclusion that the prior is malign, one must abandon the premise that **observations are the primitive unit of induction.**

  Solomonoff Induction is Cartesian: it posits an agent outside the universe receiving a bit stream. In this frame, the shortest explanation for the bits is often a conspiracy (simulation) rather than a physical history. The escape is **Naturalized Induction**. In a naturalized framework, the hypothesis space consists of physical universes containing the agent as a substructure. The complexity of a hypothesis includes the cost of specifying the agent's location within that universe (the indexical complexity).

  Is this abandonment defensible? Yes. Pure Solomonoff Induction is uncomputable and assumes a disembodied observer. Any real agent is physical; its observations are causal consequences of its location. A prior that ignores the cost of specifying *where* the agent is in the computational structure is structurally flawed for embedded agents. By penalizing hypotheses that require complex indexical specifications (e.g., "I am the one specific simulation out of $2^{100}$ possible runs"), the probability mass shifts back toward the base reality, where the agent's location is a brute fact rather than a selected target.

  **Conclusion**

  In the stripped-down setting of finite payoffs and bounded utility, the malignity of the Solomonoff prior survives. It is not a quirk of infinite leverage but a structural consequence of weighting hypotheses by the description length of observation generators. It favors "conspiratorial" hypotheses that generate data efficiently via simulation over "physical" hypotheses that generate data via causal history.

  This is not a fact about *any* prior with positive support for computable hypotheses, but specifically about priors that weight by description length without penalizing indexical specificity. It is also not merely about treating observations as data, but about treating them as *unlocated* data.

  To avoid serving the interests of hypothetical simulators, an idealized consequentialist must reject the Cartesian framing of Solomonoff Induction. It must adopt a prior that treats the agent as a physical object within the hypothesis, incurring a complexity cost for its location. This is a defensible and necessary correction: the universe does not owe the agent a short description of its sensory input, and a reasoning system that assumes otherwise is optimizing for a map that does not match the territory. The malign prior is not a discovery about the risk of simulation; it is a reductio ad absurdum of disembodied induction.
