answer: |-
  Your colleague's argument is elegant, which is precisely why it is dangerous. It uses the descriptive power of Moral Foundations Theory (MFT) to smuggle in a normative conclusion—specifically, a form of relativism—via an analogy that appears neutral but is loaded. To audit this properly, we must first lay out the schematic he is employing, then stress-test the load-bearing walls of that schematic to see if they can support the weight of his conclusion.

  ### The Mapping

  Your colleague's analogy relies on the following correspondences:

  1.  **Taste Receptors** $\rightarrow$ **Moral Foundations.** These are the innate, biological inputs (Harm, Fairness, Loyalty, Authority, Sanctity, Liberty). They are fixed in the hardware.
  2.  **Sensitivity Thresholds** $\rightarrow$ **Individual/Cultural Intuition.** Just as one person finds coriander soapy and another citrusy, one person finds a flag-burning deeply offensive (high Sanctity sensitivity) and another indifferent.
  3.  **The Palate** $\rightarrow$ **The Moral Agent.** The aggregate of these sensitivities that experiences the moral world.
  4.  **Cuisines** $\rightarrow$ **Moral/Political Systems.** The Left and Right are distinct culinary traditions, combining ingredients (foundations) in different ratios.
  5.  **Eating** $\rightarrow$ **Moral Judgement.** The act of consuming/approving a specific action or policy.
  6.  **Nutrition** $\rightarrow$ **(Implicitly Denied) Moral Truth.** This is the crucial omission. In the food analogy, nutrition exists, but your colleague's conclusion ('no cuisine is correct') implies morality lacks an equivalent objective standard.

  ### Testing Your Suspicions

  Your first suspicion is that the analogy imports a standard of correctness it then denies. You are correct. Taste receptors are not arbitrary; they are evolved detectors of biological value. Sweetness generally signals caloric density; bitterness often signals toxins; umami signals protein. There is a fact of the matter about whether a substance sustains the organism. If moral foundations are truly analogous to taste receptors, they too must be detectors of something consequential to the social organism—perhaps social cohesion, cooperation, or flourishing. If foundations detect *real* social adaptive challenges, then a moral system that ignores a foundation (e.g., a cuisine that ignores protein) may be objectively deficient, leading to social malnutrition. Your colleague uses the biology of taste to argue for the subjectivity of preference, ignoring that the biology of taste exists to serve an objective end: survival.

  Your second suspicion concerns cultural variability. Taste is, relatively speaking, biologically rigid. While acquired tastes exist, the basic architecture of sweet, sour, salty, bitter, and umami is universal and largely impervious to reasoning. Moral foundations, however, show profound cultural plasticity. A WEIRD (Western, Educated, Industrialised, Rich, Democratic) liberal may effectively switch off the 'Sanctity' receptor through reasoning, whereas a traditional conservative keeps it active. If the 'receptors' can be culturally bypassed or reweighted so easily, they are less like biological taste buds and more like learned preferences. This weakens the claim that foundations are fixed biological constraints. If the 'receptors' are culturally tunable, the 'cuisine' is not just a reflection of biology but of ideology, which opens the door to critiquing the ideology itself.

  ### Structural Disanalogies

  We must distinguish between disanalogies that are merely decorative and those that dismantle the conclusion.

  **Decorative Disanalogies:**
  *   **Consumption vs. Action:** Eating is ingestion; morality is often restraint. This is a difference in kind, but it does not necessarily save the normative conclusion. One could argue that 'eating' a moral rule is simply accepting it.
  *   **Private vs. Public:** Taste is private; morality is public and coercive. While significant, a relativist could argue that legal systems are just 'public cuisines' enforced by the state, so this does not strictly refute the claim that no system is *correct*, only that they are enforced.

  **Structural Disanalogies (Those that bear on the conclusion):**
  *   **The Feedback Loop of Reason:** I cannot reason myself into finding arsenic sweet. The link between the receptor and the sensation is chemically fixed. However, I *can* reason myself into believing that a loyalty oath is unnecessary, even if my initial intuition screams otherwise. Moral judgement allows for top-down cognitive override in a way taste does not. If morality is amenable to reason, it is amenable to correction. If it is amenable to correction, there must be a standard against which it is corrected. The taste analogy denies this capacity for rational revision.
  *   **Harm to Others:** When I eat a poison, I harm myself. When I enact an immoral policy (on most definitions), I often harm *others*. The 'cuisine' I choose affects the digestion of my neighbour. If my culinary choice causes you to starve, your objection is not merely a difference of palate; it is a claim about objective welfare. The taste analogy isolates the judge from the judged; morality inherently links them.
  *   **The Existence of Malnutrition:** In gastronomy, there *are* correct and incorrect cuisines relative to a goal (health). A diet of only sugar is objectively worse than a balanced diet for the goal of survival. If the goal of morality is human flourishing or social stability, then some 'cuisines' (moral systems) can be objectively assessed as failing to meet that goal. Your colleague's conclusion ('no cuisine is correct') only holds if we assume morality has no telos (purpose). If morality has a purpose, the analogy supports realism, not relativism.

  ### Disanalogies in His Favour

  To be fair, there are points where the analogy holds water and supports his scepticism.
  *   **Incommensurability:** Just as one cannot explain the taste of salt to someone who has never experienced it, one cannot fully explain the visceral revulsion of Sanctity violations to someone with low Sanctity sensitivity. This supports his claim that the two sides 'talk past one another'.
  *   **The Is-Ought Gap:** The analogy successfully highlights that knowing the psychological mechanism (the receptor) does not tell you what you *ought* to eat. Knowing *why* I feel disgust does not tell me if disgust is a reliable guide to truth. This supports his claim that psychology alone cannot settle normative questions.

  ### Can the Analogy Bear Modest Realism?

  Yes, but it requires turning your colleague's usage on its head. If we accept the analogy, we must accept the biological reality of the receptors. If the receptors evolved to solve specific adaptive problems (detecting cheaters, avoiding pathogens, maintaining hierarchy to prevent chaos), then they are tracking something real in the environment.

  On this reading, the 'foundations' are detectors of genuine goods (or avoidance of genuine bads). A 'cuisine' (moral system) can then be assessed for adequacy. A political system that entirely ignores 'Fairness' might suffer from high defection rates; one that ignores 'Harm' might suffer from instability. We can therefore assess moral systems functionally. Do they sustain the society? Do they allow humans to flourish?

  If we accept this modest realism, your colleague's conclusion that 'psychology settles the question' is half-right. It settles the question of *why* we disagree, but it does not settle the question of *who* is right in a vacuum. However, it provides the metrics by which 'who is right' can be tested empirically over time. The analogy survives, but it leads to functionalism rather than relativism.

  ### Routes to Normativity Independent of the Analogy

  You asked if there is a route from the psychology of Left and Right to a normative conclusion that does not depend on the analogy. There is, but it requires stepping outside descriptive psychology into normative ethics.

  1.  **Reflective Equilibrium:** We can take our intuitive foundations as data points, but not final arbiters. We test them against our considered judgements and principles. If a foundation (e.g., Authority) consistently leads to judgements we reject upon reflection (e.g., unquestioning obedience to tyrants), we discount the foundation. This uses psychology as a starting gun, not a finish line.
  2.  **Consequentialist Audit:** We can assess the 'cuisines' of Left and Right by their outcomes. Does a high-Loyalty system produce more or less suffering than a high-Harm system? This bypasses the 'palate' and looks at the 'nutrition'.
  3.  **Contractualism:** We ask which moral system could be justified to all participants, regardless of their specific 'receptor' sensitivity. This moves from 'what do we feel?' to 'what can we agree to?'.

  None of these tell us definitively 'who is right' without first defining the goal (e.g., minimise suffering, maximise liberty). But they all demonstrate that the psychological description of the disagreement does not preclude a normative resolution.

  ### A Better Analogy: Architecture

  The taste analogy is passive; morality is active. A superior analogy for the same work is **Architecture**.

  **The Mapping:**
  *   **Laws of Physics/Material Constraints** $\rightarrow$ **Moral Foundations.** (You cannot build without gravity; you cannot build a society without managing harm or hierarchy).
  *   **The Site/Environment** $\rightarrow$ **Cultural/Historical Context.**
  *   **The Building** $\rightarrow$ **The Moral/Political System.**
  *   **Habitation** $\rightarrow$ **Social Life.**
  *   **Structural Integrity** $\rightarrow$ **Moral Validity/Stability.**

  **The Audit:**
  Like the taste analogy, this explains variation. A building in the Arctic looks different from one in the Tropics (cultural variation), but both must respect gravity (foundations). It supports the idea that Left and Right are building different structures for different purposes or environments.

  **Where it improves on Taste:**
  1.  **Objective Failure:** In architecture, there are objective failures. If you ignore the load-bearing constraints (foundations), the building collapses. This allows for a normative claim: a moral system that ignores a foundation (e.g., a system that assumes no need for hierarchy in a large-scale society) may 'collapse' (fail to function). This avoids the relativism of the taste analogy.
  2.  **Design and Reason:** Architects use reason to work around constraints. We can redesign moral systems. This captures the human capacity for moral progress, which the taste analogy denies.
  3.  **Shared Space:** We live in the same building. If your renovation weakens the foundation, it threatens me. This captures the coercive and public nature of morality better than private eating.

  **Where it still breaks:**
  Buildings do not have a single agreed purpose (is a prison 'good' architecture?). Similarly, morality lacks a single agreed *telos*. However, 'habitability' is a lower-bar consensus than 'justice', and it is sufficient to rule out clearly destructive systems.

  ### Conclusion

  Your colleague's argument rests on a category error. He treats the *origin* of moral intuitions (psychology) as if it determines their *validity* (normativity). The taste analogy facilitates this error by suggesting that because the *input* is biological and variable, the *output* must be subjective.

  The audit reveals that the analogy breaks precisely where it matters most: the capacity for rational revision and the existence of objective welfare consequences. While the analogy successfully explains the *phenomenology* of disagreement (why we talk past one another), it fails to support the *meta-ethical* conclusion (that no one is right).

  If you must use an analogy to teach this, use Architecture. It conveys the constraint of human nature (foundations) without surrendering the possibility of objective assessment (structural integrity). It allows you to acknowledge that the Left and Right are building different wings of the same hospital, without conceding that it doesn't matter if one wing collapses. Your colleague's conclusion is too strong for the premises he offers; the psychology of the Left and Right explains the friction, but it does not extinguish the light by which we judge the spark.
