answer: |-
  Here is a decision tree designed for your February meeting. It is built from concrete questions about your co-op's situation, not abstract theory. Follow the branches based on how a member answers each question.

  ### The Decision Tree

  **Start:** A vote satisfies the written threshold (two-thirds), but the result changes the threshold itself (to unanimous).
  **Question 1:** Is this change valid?
  *   **No** → Go to **Question 2**.
  *   **Yes** → Go to **Question 4**.

  ---

  **Question 2:** The written rule says the vote failed. Can the members make it succeed anyway?
  *   **No, nothing can fix it.** → Go to **Question 3**.
  *   **Yes, the members can fix it.** → Go to **Question 3B**.

  **Question 3:** Why can nothing fix it?
  *   **Because it creates a logical contradiction (the rule destroys the authority needed to change it).**
      *   → **Leaf 1: Logical Incoherence**
      *   *Awkward commitment:* The co-op legally ceased to exist the moment the vote was counted.
  *   **Because it violates a fundamental principle (a body cannot destroy its own power to govern).**
      *   → **Leaf 2: Basic Structure Doctrine**
      *   *Awkward commitment:* The Board must overrule the members to protect democracy from the members.

  **Question 3B:** How do the members fix it?
  *   **By all of them agreeing to it.**
      *   → **Leaf 3: Popular Sovereignty**
      *   *Awkward commitment:* One grumpy household can veto the constitution forever.
  *   **By acting as though it passed.** → Go to **Question 3C**.

  **Question 3C:** When does acting make it valid?
  *   **Immediately, because they have the power.**
      *   → **Leaf 4: Legal Realism**
      *   *Awkward commitment:* Law is just whoever is willing to act like they are in charge.
  *   **Only after years of doing it the same way.**
      *   → **Leaf 5: Constitutional Custom**
      *   *Awkward commitment:* We broke the rules so long that the broken rules became the rules.

  ---

  **Question 4:** The change is valid. A second vote passes saying "this rule can never be amended." Does this bind future meetings?
  *   **No, a future vote can always change it.**
      *   → **Leaf 6: Procedural Positivism**
      *   *Awkward commitment:* No rule is ever safe, not even the rule that says rules are safe.
  *   **Yes, it binds them.** → Go to **Question 5**.

  **Question 5:** If it binds them, can a unanimous vote of *all* future members override it?
  *   **Yes, unanimity breaks the lock.**
      *   → **Leaf 7: Manner and Form Theory**
      *   *Awkward commitment:* The word "Never" in the bylaws really means "Unless Everyone Agrees."
  *   **No, the lock is absolute.**
      *   → **Leaf 8: Self-Embracing Sovereignty**
      *   *Awkward commitment:* The members who left last year control the members who join next year.

  ---

  ### Notes on Using the Tree

  **Indistinguishable Leaves**
  This tree cannot cleanly separate **Leaf 4 (Legal Realism)** and **Leaf 5 (Constitutional Custom)**. Both rely on practice rather than text. To separate them, you would need to ask: *"If the membership turns over completely in one year, does the new group have to keep the old practice?"*
  *   If **No** (New group can start fresh), it is **Legal Realism**.
  *   If **Yes** (New group inherits the tradition), it is **Constitutional Custom**.

  **Unoccupied Nodes**
  There is one combination of answers that leaves a node empty: If you answer **No** to Question 1 (the self-amendment is invalid), but **Yes** to Question 4 (the entrenchment is binding).
  *   **Status:** Incoherent.
  *   **Reason:** You cannot entrench a rule that never validly existed. If the first vote failed, the second vote had no authority to lock anything. Nobody defends this position.

  **A Warning on the Treasurer's View**
  If a member answers **Yes** to Question 2, **Yes** to Question 3B, and **Immediately** to Question 3C, they land on **Legal Realism**. This is the Treasurer's position. Be aware that this leaf admits there are no bylaws, only power dynamics. If you adopt this map, you admit the bylaws are decorative.

  **A Warning on the Chair's View**
  If a member answers **Yes** to Question 1 and **No** to Question 4, they land on **Procedural Positivism**. This is the Chair's ruling. Be aware that this leaf admits the "never amend" clause is a lie. It validates the first motion but admits the second motion cannot do what it says.
