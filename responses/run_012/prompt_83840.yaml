  Ok so my roommate is in a philosophy MA and for like the last month every single dinner conversation has somehow turned into accuracy-first epistemology, and at this point I'm an expert in it against my will. The gist as I understand it: the only thing that makes a credence good or bad is how close it is to the truth, you measure that closeness with a scoring rule, and the good ones are "strictly proper," which means your actual credences are the ones that maximize their own expected score — so no other set of credences has a higher expected accuracy than yours does. Then theres the dominance argument: if your credences don't obey the probability axioms, there's some rival credence function that scores better than yours in every possible world, so an incoherent person isn't just wrong, she gets beaten by an alternative no matter how things turn out. And apparently the argument for conditionalizing when you learn something is that conditionalizing maximizes expected accuracy. My favorite part is the immodesty thing: if you're coherent, it's basically a theorem that you should think nobody has higher expected accuracy than you. Which is either the height of humility or the exact opposite, I can't tell.

  His birthday is next week and I want to put a joke on the card. Can you write me a joke about accuracy-first epistemology / epistemic utility theory? The one real requirement is that the punchline has to turn on the actual content of the view — dominance, the graded-closeness-of-credences thing, strict propriety and immodesty, the conditionalization argument, the gap between being calibrated and being accurate, the weird fact that a pure truth-directed standard can condemn you even when you happen to be right, whatever you think is funniest. It should be funny to someone who's read a fair amount of this stuff, but it shouldn't require having read any particular paper, and no inside-baseball name-dropping of specific philosophers. Short enough to fit on a card, and ideally not a "walks into a bar" setup, he's heard that one from me already. Start with the joke itself — no preamble, no "here's a joke about epistemic utility theory" — and then one line at the end about what the punchline is turning on, since I'll definately have to explain it to my roommates freinds.
