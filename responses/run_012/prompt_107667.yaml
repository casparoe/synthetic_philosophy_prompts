answer: |-
  The light in the drafting room was always the same: a cool, diffuse northern glow that fell flat on the tables and eliminated shadows. There were no shadows in the Bureau of Public Facts. Shadows suggested depth, and depth suggested interpretation. The Bureau dealt in surfaces that anyone could read.

  Elara sat at the head of the long table, her sleeves rolled to the elbow, a steel ruler pinned under her left hand. In front of her lay the master sheet for the new civic wall, a expanse of heavy cream paper marked with a grid of faint blue pencil. To her right, Kael was mixing ink. He was grinding the stick against the stone palette with a rhythmic, circular motion, the *shhh-shhh* sound marking the passage of time.

  "Scale is set?" Elara asked, not looking up.

  "One figure equals one thousand souls," Kael said. He dipped the nib. "Standard human. Neutral posture. No clothing details. No gender markers."

  "Good."

  They were working on the Migration and Intake panel. It was a dangerous one. In words, the report was a thicket of qualifiers: *qualified applicants, provisional status, humanitarian exceptions, administrative backlog.* Words were traps. A word like 'illegal' carried a moral charge that varied from mouth to mouth. A word like 'asylum' could mean safety to one person and burden to another. The Bureau's job was to burn the words away and leave only the count.

  Elara picked up the rubber stamp. It was a small block of vulcanized rubber mounted on wood, carved with the outline of a person—a simple circle for a head, a trapezoid for a torso, two lines for legs. It was not a portrait. It was a unit.

  "Data says five thousand admitted," Elara said. "That's five figures. Solid black."

  She pressed the stamp into the pad, then onto the paper. *Thump.* One. *Thump.* Two. She aligned them in a neat row, touching shoulder to shoulder. The repetition was the grammar. You did not make one giant person to represent five thousand; that was a lie of scale. A giant person suggested a giant human, a monster. Five small people suggested a crowd. The truth was in the multiplication.

  Kael leaned over the table. "And the rejected?"

  "Twenty thousand."

  Kael stopped mixing. The ink sat black and glossy on the stone. "Twenty figures."

  "Twenty figures."

  "Where do we put them?"

  "Below the admitted line. Standard comparison."

  Kael wiped his nib on a rag. "If we draw them, Elara, they look like they're here. They look like they're in the city. If I stamp twenty solid figures on this wall, a passerby sees twenty-five thousand people living in Ostra. That's a lie."

  "It's not a lie. It's a count of applications."

  "It's a count of *rejections*," Kael corrected. "These people are not in Ostra. They are in camps, or on boats, or gone. To draw them with the same ink as the citizens is to claim them as citizens. It assimilates them visually before the law does."

  Elara set the stamp down. She picked up a fine pen and drew a thin horizontal line separating the two groups. "The language of the wall is not about citizenship. It is about magnitude. If we leave them out, the wall says nothing happened. It says the Bureau processed five thousand files and the rest were dust. The weight of the decision is in the twenty thousand."

  "The weight is in the absence," Kael said. "How do you draw an absence without drawing a ghost?"

  This was the old knot. The founder of the Bureau had written about it in the thirties, in exile. He had argued that pictures were a universal language, free from the metaphysical sludge of European grammar. But grammar had a word for *not*. It had a word for *never*. It had a word for *if*. The picture language had only *is*. You could show a man. You could show a man with a line through him, but the founder had hated the line. The line was a symbol, not a picture. It required decoding. It was a word in disguise.

  "Show me," Elara said.

  Kael took a fresh sheet. He stamped five solid figures. Then, for the twenty, he tried a lighter touch. He pressed the stamp gently, creating a gray, faded impression.

  "Shadows," Elara said immediately. "No. A shadow implies a memory. Or a death. Are they dead?"

  "No."

  "Are they memories?"

  "No. They are alive. Elsewhere."

  Kael tried again. He stamped the twenty figures, but he left a gap between them. A broken line of people.

  "Disorder," Elara said. "It suggests chaos. The rejection was orderly. It was bureaucratic. It was a stamp on a page, just like this one." She tapped her rubber stamp. "Cold. Precise."

  Kael put the pen down. He looked at the row of solid black figures. "The problem isn't the ink. It's the unit. We decided one figure equals one thousand souls. That decision wasn't technical, Elara. It was political. If we made one figure equal ten thousand, the twenty thousand rejected becomes two figures. Small. Manageable. If we make it one hundred, the wall isn't big enough. By choosing one thousand, we chose to make the rejection visible, but we also chose to define a person as a block of ink that fits on a ruler."

  "We chose it so a child could count it," Elara said. "So a worker coming off the night shift doesn't need a degree in economics to know if the city is growing or shrinking. That was the point. To take the facts out of the university and put them on the street."

  "And in taking them to the street, we stripped them of context," Kael said. "Look at the figure." He pointed to the rubber stamp. "Head, torso, legs. Upright. Balanced. It's a figure of agency. It's a figure that stands. But the twenty thousand were turned away. They were forced to sit. Or forced to walk away. If I draw them standing, I give them a posture they weren't allowed to have."

  Elara looked at the simple shape. She had stamped it ten thousand times in her career. She had never thought of it as a posture. It was a container for number. But Kael was right, in a way that made her skin prickle. The symbol carried an ontology. It said: *To be counted is to stand.*

  "So what is the alternative?" Elara asked. "We cannot leave the space blank. A blank space is zero. A blank space says 'no applications.'"

  "Draw the barrier," Kael said.

  "A wall?"

  "A line. A thick black line between the five and the twenty. The five are on this side. The twenty are on that side. The line does the work of the verb *rejected*."

  Elara picked up her ruler. She measured the space. "A line is a symbol. It's not a picture. You're introducing a hieroglyph."

  "It's a fence," Kael said. "Everyone knows a fence."

  "Everyone knows a fence keeps things out. But does it keep things in? If we draw the line, are we saying they are trapped? Or that we are trapped?"

  Kael sighed. He reached for the ink again. "The verbal report says: 'Due to quota restrictions, twenty thousand eligible applicants were denied entry.' The word 'eligible' is doing a lot of work there. It says they *could* have been here. It implies a counterfactual. They are here, potentially. But the picture can't do 'potentially.' The picture only does 'actually.'"

  Elara began to stamp the twenty figures. She worked methodically. *Thump. Thump. Thump.* She aligned them perfectly under the first row. The visual weight of the twenty overwhelmed the five. The wall would scream the rejection. It would be undeniable. But Kael's fear sat in the room with them: by making them undeniable, were you making them present?

  "If we draw them," Elara said, her hand pausing over the tenth figure, "we make the city responsible for them. Visually, they occupy our space. The viewer sees twenty-five thousand people associated with the Bureau. The Bureau becomes the container for all of them, even the ones we sent away."

  "And if we don't," Kael said, "the viewer sees five thousand. The city looks clean. The violence of the quota disappears. The picture becomes a lie of omission."

  Elara stamped the last figure. She sat back. The chart was complete, technically. Five solid figures. Twenty solid figures. A title in sans-serif type: *ANNUAL INTAKE.*

  "It violates the rule of transformation," Elara said quietly. "We are supposed to transform the data, not translate the moral dilemma. But the data *is* the dilemma."

  "The founder said the picture language was to cure us of metaphysics," Kael said. "No more talk of 'spirit' or 'nation' or 'destiny.' Just facts. But this fact... it's made of negation. It's made of the people who are *not* here. A language that can't say 'not' can't tell the truth about a border."

  Elara looked at the row of twenty. They were identical. Perfectly uniform. In the verbal report, there were names, ages, reasons for rejection: family ties, labor skills, humanitarian need. Here, they were a phalanx of ink.

  "Is it a lie?" Elara asked. "To draw them?"

  "It's a fiction," Kael said. "It's a necessary fiction. Like drawing a map. The map shows the road, but the road isn't the paper. We are drawing the people, but they aren't the ink."

  "But the ink stays," Elara said. "The people move. Or they don't. The ink stays on the wall until we paint over it. We are fixing them in a state of rejection. We are making their rejection permanent, even if next year they are admitted."

  She reached for a bottle of white correction fluid.

  "What are you doing?" Kael asked.

  "Breaking the set."

  She dabbed the white fluid over the last five figures of the second row. Not crossing them out—crosses were forbidden—but obscuring them. Making them fade into the background.

  "Now it looks like an error," Kael said.

  "Now it looks like a question," Elara countered. "The first fifteen are solid. They are the hard rejections. The last five... they are the margin. The ones on the waitlist. The data lumps them together, but the picture shouldn't."

  "The data doesn't distinguish them."

  "The data is a summary. The picture is a statement."

  Kael watched her work. "You're editing the facts."

  "I'm transforming them. That's my job. Translation would be drawing exactly what the spreadsheet says. Transformation is making it readable. If the spreadsheet says twenty thousand, but the reality is a gradient of exclusion, then a single row of twenty identical figures is the translation. It's lazy."

  "It's consistent," Kael said. "Consistency is how we build trust. If we change the symbol for the ones on the waitlist, we are introducing a code. 'Solid means no, White means maybe.' That's not universal. That's a legend. You need a key to read it."

  Elara capped the white fluid. Her hands were stained with black ink. "And if we don't use the white? If we leave them all solid? Then we tell the public that the city turned away twenty thousand human beings with the same finality. We tell them the decision is closed. It isn't closed. Three thousand of those twenty are in appeals."

  "So the chart is premature."

  "The chart is for the year that ended yesterday."

  Kael stood up and walked to the window. The city outside was gray, the buildings rising in blocks that looked somewhat like the figures on the table. "You know what the founder would say. He would say we are arguing over the decoration of the cage. The important thing is that the numbers are on the wall. That the worker can see the twenty. Whether they are solid or faded, the worker sees the mass."

  "The worker sees the mass," Elara agreed. "But does the worker see the humanity? Or just the burden? If I draw twenty thousand people, do I show a crowd that needs housing? Or a crowd that needs stopping?"

  "That's not up to the ink," Kael said. "That's up to the viewer."

  "Nothing is up to the viewer. We choose the scale. We choose the symbol. We choose what to count. We counted the applicants. We didn't count the families they left behind. We didn't count the deaths in the camps. We chose the count that fits on the paper."

  Kael turned back to the table. He looked at the chart. The five admitted figures looked small, isolated. The twenty rejected figures looked like an army.

  "If we draw them," Kael said, "we acknowledge them. To acknowledge is a political act. To ignore is also a political act. The ink doesn't care. But we do."

  Elara picked up the master sheet. She held it up to the light. The ink was dry. The figures stood in their rows, silent and identical. They were not people. They were units of measure. And yet, they demanded to be people.

  "We hang it," Elara said.

  "With the white correction?"

  "No. Wipe it."

  Kael blinked. "Wipe it? Then it's just twenty solid figures."

  "Yes."

  "That's the version I argued against."

  "It's the version that counts," Elara said. "The white fluid makes it about our uncertainty. The solid figures make it about their number. The founder said: 'Words divide, pictures unite.' But he was wrong. Pictures unite only if they show the whole truth. The whole truth is that twenty thousand people knocked on the door. Whether they are waiting or gone, they knocked. We draw the knock."

  "And the lie that they are here?"

  "It is not a lie that they existed," Elara said. "It is only a lie if the viewer thinks they are inside the walls. But that is the viewer's assumption, not our symbol. We do not draw the walls. We do not draw the city limits. We only draw the people who applied. The context is the room they are hanging in."

  Kael looked at the chart for a long time. He picked up his rag and wiped a smudge of ink from the edge of the paper.

  "It feels heavy," he said.

  "Good," Elara said. "It should be."

  She rolled the paper up and placed it in the tube. The drafting was done. The decision was made. The chart would go to the printers, and then to the wall in the transit district, where thousands of people would pass it every day. Some would count the figures. Some would see the crowd. Some would see the empty space where the city should have been.

  Elara began to clean her stamp. She scrubbed the rubber with solvent, lifting the black ink until the figure was pale again, ready for tomorrow's count.

  "We need a new symbol for next year," Kael said, packing his brushes.

  "Why?"

  "If the appeals are granted, we can't use the same figure. It implies continuity. If they enter, they change status. The symbol should change."

  "The symbol is the person," Elara said. "The status is the word."

  "The status is the life," Kael replied. "If the symbol doesn't change, the person doesn't change. We freeze them in the moment of application. We make them eternal applicants."

  Elara stopped scrubbing. She looked at the clean rubber face of the stamp. A blank human. A vessel.

  "Then we design a new stamp," she said.

  "Who decides what it looks like?"

  Elara looked at the tube containing the chart. "The wall decides. We just draw what the wall can carry."

  She turned off the drafting lamp. The room plunged into the cool, shadowless gray of the afternoon. The chart was in the tube, safe and silent. It contained twenty-five thousand souls, or it contained twenty-five thousand lies. It was impossible to tell until it was hung, and even then, the answer would depend on who was looking, and whether they knew how to count the things that weren't there.

  "Tomorrow," Elara said. "We start on the mortality rates."

  Kael nodded. He picked up his coat. "Bring extra ink."

  "I always do."

  They left the room together, leaving the table bare, the ruler lying straight across the wood like a horizon line, waiting for the next thing to be measured.
