prompt: |-
  I direct grantmaking at a small family foundation whose trustees have committed it to doing the most good it can, and who expect our portfolio to be ranked by expected value rather than by the appeal of the causes. Our staff is four people, we review proposals monthly, and we fund in global health, animal welfare, and technology policy. Every cycle we hit the same wall: for any grant, the consequences run on indefinitely — a deworming programme changes school attendance, later earnings, marriage and fertility patterns, and past that, nothing we can trace — while the standard we are supposed to apply presupposes that consequences are the sort of thing that can be totalled and compared. Write the procedure we should actually run on a proposal: a checklist we can work through in about an hour before the committee meets, with the questions in order, what counts as a sufficient answer to each, where it terminates in a no, and where it must hand the decision to the trustees because the question is one of value or of sheer guesswork rather than of fact. It should say how far down the causal chain we look and defend that cut-off rather than assume it; what to do when we know a long-run effect could be large but not whether its sign is positive or negative; what to do with a proposal whose payoff rests on a tiny probability of an enormous benefit; and whether we should be comparing across our three areas at all. Then run it on three proposals: a deworming programme with good short-run evidence and a disputed long-run literature; a pilot for a labour-saving technology in a low-income economy whose employment effects nobody can forecast; and a research grant whose value rests on a one-in-ten-thousand chance of a very large benefit. Where the procedure returns an answer the trustees will not like, say so rather than smoothing it over. Finally, mark the steps that are judgment calls dressed up as procedure, and distinguish clearly what is settled among people who work on this from what is genuinely contested — including whether cluelessness is a fatal objection to the trustees' project or a manageable one — instead of presenting one side as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Director of grantmaking at a small family foundation (4 staff).
      *   **Trustee Mandate:** Maximize expected value (EV), rank portfolio by EV, not cause appeal.
      *   **Focus Areas:** Global Health, Animal Welfare, Technology Policy.
      *   **Core Problem:** The "cluelessness" problem (infinite causal chains, unknown long-term effects) vs. the mandate to calculate/compare EV.
      *   **Deliverable:** A 1-hour pre-committee checklist/procedure.
      *   **Requirements:**
          *   Order of questions.
          *   Sufficient answers.
          *   Termination points (No vs. Trustee Decision).
          *   Defense of causal chain cut-off.
          *   Handling unknown signs of long-run effects.
          *   Handling low-probability/high-impact (tail risk) scenarios.
          *   Cross-cause comparability.
          *   Application to three specific proposals (Deworming, Labor-saving Tech, Low-prob Research).
          *   Honesty about unpleasant answers.
          *   Meta-analysis: Mark judgment calls vs. procedure, distinguish settled vs. contested views (especially on cluelessness).

  2.  **Philosophical & Practical Grounding:**

      *   *The Core Tension:* The trustees want Effective Altruism (EA) style maximization, but the philosophical literature (e.g., Greaves, MacAskill, Beckstead) acknowledges "strong cluelessness" where EV calculations break down due to unknown long-term consequences.
      *   *The Cut-off:* We can't trace effects forever. We need a principled stopping point. Standard EA practice often uses a time horizon (e.g., 10-50 years) or focuses on "direct effects + robust second-order effects."
      *   *Comparability:* Comparing lives saved (health) vs. suffering reduced (animals) vs. existential risk reduced (tech policy) requires a common currency (e.g., well-being units, QALYs, or a rough weighting). This is inherently value-laden.
      *   *Tail Risks:* EV maximization naturally favors high-variance, high-upside bets (Pascal's Mugging territory). Foundations usually need guardrails here.
      *   *The "Hour" Constraint:* The procedure must be actionable, not a PhD thesis.

  3.  **Drafting the Procedure (The Checklist):**

      *   *Step 1: Direct Impact & Evidence.* (Fact-based). If this fails, stop.
      *   *Step 2: The Causal Cut-off.* (Methodological). Define the horizon. Why? Because beyond $X$ years, noise dominates signal.
      *   *Step 3: Sign Uncertainty.* (Epistemic). If long-term effects are huge but sign unknown, do we discount?
      *   *Step 4: Tail Risks.* (Risk Management). How to handle $P \times V$ where $P$ is tiny.
      *   *Step 5: Cross-Cause Comparison.* (Value Judgment). How to weigh health vs. animals vs. policy.
      *   *Step 6: The "Cluelessness" Check.* (Philosophical). Is this fundamentally unquantifiable?

      *Refining the Cut-off:* A 10-20 year horizon is standard for practical grantmaking. Beyond that, we rely on "robustness" rather than calculation.
      *Refining the Sign Issue:* If the sign is unknown, EV is 0 *unless* there's a theoretical reason to bias it. But "strong cluelessness" suggests we should be wary.
      *Refining Cross-Cause:* This *must* go to trustees. Staff can prepare ratios, but trustees set the weights.

  4.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1: Deworming.*
          *   Direct: Good evidence (attendance/health).
          *   Long-run: Disputed (Baird et al. vs. others).
          *   Issue: If long-run income effects are disputed, does EV collapse?
          *   Verdict: Fundable on short-run grounds, but long-run EV claim is shaky.
      *   *Proposal 2: Labor-saving Tech.*
          *   Direct: Efficiency up.
          *   Long-run: Employment effects unknown (could be mass unemployment or liberation).
          *   Issue: Sign uncertainty on welfare.
          *   Verdict: High risk of negative unintended consequences. Needs trustee guidance on risk tolerance.
      *   *Proposal 3: Low-prob Research (1 in 10,000).*
          *   Direct: Paper published.
          *   Impact: Existential risk reduction?
          *   Issue: Pascal's Mugging. Is the EV real or an artifact?
          *   Verdict: Math says yes, intuition says no. Trustees must decide on risk neutrality.

  5.  **Addressing the Meta-Requirements:**

      *   *Unpleasant Truths:* The procedure might show that "maximizing EV" is impossible for most grants, or that the trustees' mandate forces them to make arbitrary value judgments they want to avoid.
      *   *Judgment Calls:* Explicitly label where the staff is making value choices (e.g., discount rates, weighting species).
      *   *Settled vs. Contested:* Acknowledge that within the EA community, "cluelessness" is a major debate (Greaves vs. standard EV maximizers).

  6.  **Writing - Tone and Structure:**

      *   Tone: Professional, rigorous, candid, slightly philosophical but actionable.
      *   Structure:
          1.  Introduction (Acknowledging the tension).
          2.  The Procedure (The Checklist).
          3.  Application to Proposals.
          4.  Meta-Commentary (Judgment calls & Contested terrain).

  7.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the cut-off defense strong enough?
      *   *Fix:* Argue based on *signal-to-noise ratio* rather than arbitrary time. We stop when our confidence interval includes zero.
      *   *Critique:* Did I answer "whether we should be comparing across our three areas at all"?
      *   *Fix:* Make this a specific Trustee Decision point. Staff cannot do this without implicit weights.
      *   *Critique:* Is the "cluelessness" objection treated fairly?
      *   *Fix:* In the meta-section, explicitly state that some philosophers argue EV maximization is incoherent under strong cluelessness, while others argue for "soft" maximization.

  8.  **Final Polish:** Check against the prompt's specific constraints (1 hour, 4 staff, specific proposals, marking judgment calls). Ensure the distinction between "Staff Fact-Finding" and "Trustee Value-Setting" is sharp.

  *(Self-Correction on the "1 hour" constraint)*: The checklist needs to be something the *Director* or a *Senior Officer* runs, not the whole staff. It's a pre-meeting filter.

  *(Self-Correction on "Unpleasant Answers")*: I need to make sure I don't just say "Trustees decide." I need to say "If you follow your own mandate, you might have to fund the 1/10,000 grant and ignore the deworming, which contradicts your intuition."

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## The "Expected Value under Cluelessness" Protocol (EV-UC)

  **Purpose:** To operationalize the trustees' mandate for expected value (EV) maximization while acknowledging the epistemic limits of long-term forecasting ("cluelessness").
  **Time Allocation:** 60 minutes per proposal (Staff Lead).
  **Output:** A one-page "Decision Memo" for the Committee.

  **Philosophical Stance:** This procedure adopts a *moderate objectivist* stance. It assumes EV is calculable for direct effects but treats long-term indirect effects as highly uncertain. It rejects the idea that we can sum consequences to infinity, but also rejects the idea that uncertainty mandates inaction.

  ---

  ### Part 1: The Procedure (Checklist)

  #### 1. Direct Effect Verification (15 mins)
  *   **Question:** What is the direct, first-order outcome, and what is the evidence quality?
  *   **Sufficient Answer:** A quantified metric (e.g., DALYs averted, animals spared, policy probability shift) backed by RCTs, meta-analyses, or expert consensus.
  *   **Termination (No):** If evidence is anecdotal or the direct effect is negligible.
  *   **Staff/Trustee Boundary:** **Staff.** This is factual assessment of evidence quality.

  #### 2. The Causal Cut-Off & Horizon (10 mins)
  *   **Question:** How far down the causal chain do we model?
  *   **Procedure:** Set the horizon at the point where the *confidence interval of the effect includes zero*. Typically, this is 10–20 years for social interventions, or until the "mechanism of action" becomes speculative.
  *   **Defense of Cut-Off:** We do not stop because consequences cease; we stop because our predictive power ceases. Beyond this horizon, positive and negative second-order effects (e.g., population changes, economic shifts) tend to cancel out or become dominated by exogenous noise. To model beyond this is to pretend at precision we do not possess.
  *   **Staff/Trustee Boundary:** **Staff (Methodological).** Staff applies the epistemic standard; Trustees accept the horizon as the limit of *calculable* EV.

  #### 3. Sign Uncertainty Check (10 mins)
  *   **Question:** For effects beyond the cut-off, is the *sign* (positive/negative) knowable?
  *   **Procedure:** If a long-run effect is potentially massive but the sign is equally likely to be positive or negative (e.g., "saving lives now increases population, which increases total suffering"), assign it an EV of **zero** for calculation purposes.
  *   **Exception:** If there is a theoretical prior suggesting asymmetry (e.g., existential risk reduction is almost exclusively positive), note this.
  *   **Termination (Trustee Hand-off):** If the proposal's *entire* value proposition rests on a long-run effect where the sign is contested (e.g., "this tech might cause unemployment or liberation"), flag as **High Cluelessness Risk**.
  *   **Staff/Trustee Boundary:** **Shared.** Staff identifies the uncertainty; Trustees decide if "zero" is the correct default or if they wish to speculate.

  #### 4. The Tail Risk / Pascal Filter (10 mins)
  *   **Question:** Does the EV rely on a tiny probability ($<1\%$) of an enormous benefit?
  *   **Procedure:** Calculate $EV = P \times V$. If $EV$ exceeds direct-effect grants by $>10\times$, apply a **Complexity Penalty**. Reduce the calculated EV by an order of magnitude for every layer of speculative assumption required to reach the outcome.
  *   **Rationale:** Human intuition is bad at small probabilities. This penalty guards against "Pascal's Mugging" without ignoring existential stakes.
  *   **Staff/Trustee Boundary:** **Trustee.** The size of the penalty is a risk-tolerance preference, not a fact.

  #### 5. Cross-Cause Comparability (10 mins)
  *   **Question:** How do we compare units across Global Health, Animals, and Tech Policy?
  *   **Procedure:** Staff converts all outcomes to a common proxy (e.g., "Well-being Years" or "Suffering Units").
      *   *Health:* 1 Life Saved $\approx$ 40 Well-being Years.
      *   *Animals:* 1 Chicken Year $\approx$ 0.01 Human Well-being Years (example weight).
      *   *Tech:* Probability of Existential Catastrophe Averted $\approx$ All Future Well-being.
  *   **Termination (Trustee Hand-off):** **Mandatory.** Staff cannot set these weights. The Memo must present the EV *within* the cause and ask Trustees to apply the "Cause Weighting Multiplier."
  *   **Staff/Trustee Boundary:** **Trustee.** This is pure value judgment.

  #### 6. The Cluelessness Verdict (5 mins)
  *   **Question:** Is this proposal "Cluelessness-Dominated"?
  *   **Definition:** A proposal is Cluelessness-Dominated if the uncertain long-term effects dwarf the certain short-term effects in magnitude.
  *   **Action:** If Yes, the proposal cannot be ranked by EV. It must be ranked by *robustness* (does it look good under many worldviews?) or sent to Trustees as a "Value Bet."
  *   **Staff/Trustee Boundary:** **Staff.** This is an epistemic classification.

  ---

  ### Part 2: Application to Proposals

  Here is how the protocol processes your three specific cases. Note where the output contradicts intuitive grantmaking.

  #### Proposal A: Deworming Programme
  *   **Direct Effect:** Strong RCT evidence for short-term health/attendance. **Pass.**
  *   **Causal Cut-off:** Income effects appear at year 10. Literature is disputed (some studies show fade-out).
  *   **Sign Uncertainty:** Long-term demographic effects (fertility rates) are unknown. Could be positive (wealthier families) or negative (population growth straining resources).
  *   **Cluelessness Verdict:** **Not Dominated.** The short-term welfare gain (health/education) is valuable even if long-term income effects are zero.
  *   **Protocol Output:** **Fundable.** The EV is grounded in direct suffering reduction, which is robust to long-term uncertainty.
  *   **Unpleasant Truth:** If your trustees believe the *only* value is long-term economic growth, this proposal fails. If they value immediate welfare, it passes. The protocol forces them to admit which they prefer.

  #### Proposal B: Labor-Saving Tech Pilot (Low-Income Economy)
  *   **Direct Effect:** Efficiency increases, costs drop.
  *   **Causal Cut-off:** Employment effects manifest in 3–5 years.
  *   **Sign Uncertainty:** **Critical Failure.** Nobody knows if this displaces workers (suffering) or creates new industries (prosperity). The sign of the welfare impact is genuinely unknown.
  *   **Cluelessness Verdict:** **Cluelessness-Dominated.** The direct efficiency gain is trivial compared to the potential macro-economic shock.
  *   **Protocol Output:** **Refer to Trustees as "Value Bet."** Staff cannot recommend this on EV grounds.
  *   **Unpleasant Truth:** Under a strict EV mandate, this should likely be rejected because the variance is too high and the sign is unknown. Funding it is an admission that you are speculating, not maximizing.

  #### Proposal C: Research Grant (1 in 10,000 Chance of Large Benefit)
  *   **Direct Effect:** Paper published, knowledge advanced. Negligible direct welfare.
  *   **Tail Risk:** $P = 0.0001$, $V = \text{Existential Safety}$. Raw EV is astronomical.
  *   **Complexity Penalty:** Requires 5 layers of assumption (Research $\to$ Insight $\to$ Policy $\to$ Implementation $\to$ Risk Averted). Apply 5 order-of-magnitude penalty.
  *   **Cluelessness Verdict:** **Cluelessness-Dominated.** The value rests entirely on a chain of speculation.
  *   **Protocol Output:** **Do Not Fund (by default).** The Complexity Penalty reduces the EV below the deworming grant.
  *   **Unpleasant Truth:** If your trustees are *true* EV maximizers (risk-neutral), they should overrule this. A 1/10,000 chance of saving humanity is mathematically worth more than 1,000 lives saved now. The protocol protects you from this, but doing so violates their stated mandate of "ranking by expected value."

  ---

  ### Part 3: Meta-Analysis & Judgment Calls

  You asked to distinguish settled fact from contested judgment. Here is where the procedure is masking philosophy as administration.

  #### 1. Judgment Calls Dressed as Procedure
  *   **The Causal Cut-Off (Step 2):** Marking the horizon where "confidence intervals include zero" is subjective. A pessimist sees noise in 5 years; an optimist sees signal in 50. *This is a risk-aversion parameter, not a fact.*
  *   **The Complexity Penalty (Step 4):** Reducing EV by an order of magnitude per assumption is arbitrary. It is a heuristic to satisfy human intuition, not a mathematical truth. *This biases the portfolio against innovation.*
  *   **The Sign Uncertainty Default (Step 3):** Assigning EV = 0 to unknown signs assumes a symmetric distribution of outcomes. If the downside is bounded (people die) but the upside is unbounded (civilization thrives), zero is the wrong default. *This biases the portfolio against transformative change.*

  #### 2. Settled vs. Contested (The "Cluelessness" Debate)
  You must inform your trustees that the academic community is **not settled** on whether their project is coherent.

  *   **Settled:** Direct effects (e.g., bednets stop malaria) are knowable. Comparing causes requires value weights (e.g., humans vs. chickens).
  *   **Contested (The Fatal Objection):**
      *   *View A (The Maximizers):* Cluelessness is manageable. We use priors, discount rates, and robustness checks. We can still approximate EV. (Hilary Greaves, William MacAskill).
      *   *View B (The Skeptics):* Strong cluelessness makes EV maximization incoherent. If we cannot know the sign of long-term effects, "Expected Value" is a number generated by a random number generator, not a guide to action. (Jacob Ross, Michael Weber).
      *   *View C (The Pluralists):* EV is one input among others (rights, duties, urgency).

  **The Verdict on Your Mandate:**
  Your trustees' mandate ("rank by expected value") presupposes View A. However, Proposal B and C show that View A often breaks down in practice.
  *   If you follow the protocol strictly, you will likely fund **Deworming** and reject **Tech Research**.
  *   If you follow the *math* of EV without the protocol's guardrails, you might fund **Tech Research** and ignore **Deworming**.

  **Recommendation:**
  Do not present this protocol as "The Answer." Present it as "The Best Approximation Given Human Limits." Explicitly tell the trustees: *"This procedure artificially caps long-term speculation to prevent us from gambling the endowment on low-probability theories. If you wish to gamble on existential risk, you must overrule Step 4. If you wish to prioritize immediate welfare over long-term potential, you must endorse Step 3."*

  The "wall" you hit is not operational; it is philosophical. You cannot calculate the incalculable. You can only decide how to act in spite of that.
