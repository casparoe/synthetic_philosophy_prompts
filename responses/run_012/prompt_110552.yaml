prompt: |-
  I am working through the literature on uncertain evidence and want a clean specification before I evaluate any particular updating rule. Write the desiderata for a theory of how a rational agent should revise credences when the evidence is uncertain. The central case is the one Jeffrey conditionalization was designed for: the agent does not learn that some proposition is true, but shifts credences across a partition of evidential possibilities, and then must redistribute credence over the rest of the algebra. The theory should say what any adequate rule in this area must deliver.

  For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or a preference of a particular camp. Include at least the following, and add any others you think belong:

  - The rule must generalize strict conditionalization as a limiting case, where one evidential cell receives credence one.
  - The rule must respect a rigidity condition: conditional probabilities within each evidential cell should remain unchanged by the update, or the theory must explain what replaces that condition and why.
  - The rule must be invariant under refinement of the evidential partition: if a cell is split into subcells that agree on the relevant conditional probabilities, the final credences should not change.
  - The rule must address order effects. If an agent receives two uncertain observations, does the final credence depend on the order? Under what conditions should it not? Consider the case where the two observations are described by the same partition but the agent's total experience differs between orders, and say what that implies for the requirement.
  - The rule must be diachronically coherent: it should not expose the agent to a sure loss from a bookie who knows the agent's updating rule.
  - The rule must handle evidence that the agent cannot fully articulate, and evidence that is old rather than new.
  - The rule must distinguish updating on evidence from supposing a hypothesis for the sake of argument.
  - The rule must say something about infinite partitions and cases where the relevant conditional probabilities are undefined.
  - The rule must be computable or at least approximable in realistic cases.
  - The rule must say how it treats higher-order uncertainty about the reliability of the evidence source.

  Then flag any pair or subset of these desiderata that you suspect cannot be jointly satisfied. This is the part I most want. For example, does full refinement invariance conflict with the rigidity condition in some cases? Does the demand for order independence conflict with the demand to treat the agent's total experience as the evidence? If some subset is jointly unsatisfiable, state the conflict as a result about the area, not as a defect of one rule.

  Finally, briefly indicate how Jeffrey conditionalization, a maximum entropy rule, and a reflection-style rule fare against the list. Keep the scoring short; the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide a clean specification of desiderata for a theory of uncertain evidence updating (specifically focusing on the Jeffrey Conditionalization case: shifting credences across a partition).
      *   **Task:** List requirements (desiderata), motivate each, mark as non-negotiable vs. preference, include specific requested items (generalization of strict conditionalization, rigidity, partition invariance, order effects, diachronic coherence, ineffable/old evidence, updating vs. supposing, infinite partitions/undefined probs, computability, higher-order uncertainty).
      *   **Crucial Addition:** Identify conflicts/incompatibilities between subsets of desiderata (the "impossibility results" aspect).
      *   **Final Step:** Briefly score Jeffrey Conditionalization (JC), Maximum Entropy (MaxEnt), and Reflection-style rules against the list.
      *   **Tone:** Philosophical, precise, analytical, neutral (specifying the landscape, not advocating one rule).

  2.  **Drafting the Desiderata:**
      *   *Requirement 1: Generalization of Strict Conditionalization.*
          *   Motivation: Uncertain evidence includes certain evidence as a limit case.
          *   Status: Non-negotiable (standard constraint).
      *   *Requirement 2: Rigidity (Sufficiency).*
          *   Motivation: The evidence only affects the partition cells directly; relations within cells shouldn't change absent specific reason.
          *   Status: Non-negotiable for JC-style approaches, but contested by others (e.g., Holistic updates). Let's mark it as Central but potentially negotiable depending on the theory of *why* rigidity holds.
      *   *Requirement 3: Partition Refinement Invariance.*
          *   Motivation: The description of evidence shouldn't dictate the outcome. Coarse-graining shouldn't matter if the probabilistic impact is identical.
          *   Status: Non-negotiable (consistency requirement).
      *   *Requirement 4: Order Effects (Commutativity).*
          *   Motivation: Rationality shouldn't depend on the temporal sequence of receiving independent pieces of evidence.
          *   Nuance: Need to distinguish between *same* evidence received twice vs. *different* experiences described by the same partition.
          *   Status: Non-negotiable for independent evidence, but requires careful formulation regarding "total experience."
      *   *Requirement 5: Diachronic Coherence (No Dutch Books).*
          *   Motivation: Pragmatic consistency. Avoiding sure loss.
          *   Status: Non-negotiable (standard rationality constraint).
      *   *Requirement 6: Ineffable and Old Evidence.*
          *   Motivation: Real agents often can't pinpoint the partition (ineffable) or need to update on already known data in light of new theory (old evidence).
          *   Status: Preference/Aspirational (very hard to satisfy formally).
      *   *Requirement 7: Updating vs. Supposing.*
          *   Motivation: Distinguish learning $P(E)=k$ from conditioning on $E$ or hypothetical reasoning.
          *   Status: Non-negotiable (conceptual clarity).
      *   *Requirement 8: Infinite Partitions/Undefined Probs.*
          *   Motivation: Mathematical generality.
          *   Status: Preference (technical robustness).
      *   *Requirement 9: Computability.*
          *   Motivation: Bounded rationality/implementation.
          *   Status: Preference (pragmatic).
      *   *Requirement 10: Higher-Order Uncertainty.*
          *   Motivation: Reliability of the source matters.
          *   Status: Non-negotiable (epistemic humility).

  3.  **Identifying Conflicts (The "Impossibility" Section):**
      *   *Conflict 1: Rigidity vs. Holism/Coherence.* If I learn something uncertain about $E$, does it *really* leave $P(H|E)$ untouched? Sometimes learning $E$ is likely changes how I view $H$ given $E$ (e.g., if the source is biased). This pits Rigidity against Higher-Order Uncertainty handling.
      *   *Conflict 2: Partition Invariance vs. Rigidity.* Wagner (2002) and others have shown issues here. If the partition changes, the "same" experience might map differently.
      *   *Conflict 3: Order Independence vs. Rigidity.* If I update on $E$ then $F$, vs $F$ then $E$. JC is generally not commutative unless the partitions are independent *and* the shifts are specific. Field's condition helps, but it's restrictive.
      *   *Conflict 4: Diachronic Coherence vs. Uncertain Evidence.* Standard Dutch Book arguments assume certain evidence. Extending them to uncertain evidence is tricky. If the bookie knows the *shift* before the agent, can they pump money? (Christensen's work).
      *   *Key Conflict to Highlight:* **Rigidity + Partition Invariance + Order Independence.** There are known results (e.g., by Diaconis, Zabell, or Wagner) suggesting these pull in different directions. Specifically, *Refinement Invariance* often clashes with *Rigidity* if the refinement reveals structure that makes the original rigidity assumption implausible.
      *   *Another Key Conflict:* **Diachronic Coherence vs. Higher-Order Uncertainty.** If you account for source reliability (higher order), you often violate simple Rigidity (you update conditional probs because the source reliability correlates with the hypothesis). But if you violate Rigidity, you lose the simplicity of JC.
      *   *The "Experience" Problem:* Order independence requires characterizing the *evidence* abstractly. But if evidence is "total experience," order matters because the second experience happens in a different doxastic state. So, Order Independence conflicts with a robust phenomenological account of evidence.

  4.  **Scoring the Rules:**
      *   *Jeffrey Conditionalization (JC):* Great on Rigidity, Generalization, Computability. Fails on Order Independence (generally), struggles with Higher-Order Uncertainty (without modification), struggles with Ineffable Evidence (needs a partition).
      *   *Maximum Entropy (MaxEnt):* Good on Generalization, handles Infinite cases well. Often violates Rigidity (depends on constraints), computationally heavy. Order independence varies.
      *   *Reflection (van Fraassen):* Good on Diachronic Coherence. But it's a constraint on *future* beliefs, not necessarily an update rule for *current* uncertain input. It handles Higher-Order well. Fails Computability/Specificity (doesn't say *how* to move, just where to land).

  5.  **Refining and Polishing:**
      *   Make sure the distinction between "Non-negotiable" (rationality constraints) and "Preference" (theoretical virtues) is clear.
      *   Ensure the "Conflict" section is the highlight, as requested ("This is the part I most want").
      *   Check that the "Order Effects" point addresses the nuance of "total experience."
      *   Ensure the tone is appropriate for a literature review/specification document.

  6.  **Self-Correction/Review during drafting:**
      *   *Correction:* Initially, I might think Rigidity is non-negotiable. But many argue uncertain evidence *should* change conditional probabilities (e.g., learning a measurement is noisy). I should mark Rigidity as "Central but Contested" or "Non-negotiable *for JC-style theories* but a point of contention for the general theory." The prompt asks for a theory of *uncertain evidence*, not just JC. So I will mark it as a core desideratum that requires justification if violated.
      *   *Correction on Order Effects:* JC is famously order-dependent. The desideratum should be that the rule *addresses* it, ideally minimizing it or specifying when it's permissible. I will frame it as "Controlled Order Sensitivity."
      *   *Conflict Specifics:* I need to cite the specific tension between Partition Invariance and Rigidity. This is often called the "Wagner Condition" issue. Also, the tension between Diachronic Coherence and Uncertain Evidence (the "Dutch Book against JC" debates).

  7.  **Final Output Structure:**
      *   Introduction.
      *   List of Desiderata (Motivation, Status).
      *   Incompatibility Results (The Conflicts).
      *   Brief Evaluation of Rules.

  8.  (Final Polish of the text to ensure clarity and precision.) *Self-check: Did I include infinite partitions? Yes. Computability? Yes. Higher-order? Yes.*

