answer: |-
  # Desiderata for a Theory of Uncertain Evidence Updating

  The following specification outlines the requirements for a normative theory of belief revision where evidence does not dictate certainty in a proposition but rather induces a shift in probability across a partition. This is the domain originally targeted by Jeffrey Conditionalization.

  ## I. Desiderata List

  **1. Generalization of Strict Conditionalization**
  *   **Requirement:** The rule must yield the same posterior credences as standard Bayesian conditionalization in the limit where the credence in one cell of the evidential partition becomes 1.
  *   **Motivation:** Certain evidence is a special case of uncertain evidence. A general theory must not contradict the standard rule where the standard rule applies.
  *   **Status:** **Non-negotiable.**

  **2. Rigidity (Sufficiency)**
  *   **Requirement:** For any hypothesis $H$ and evidential cell $E_i$, the conditional probability $P_{new}(H | E_i)$ must equal $P_{old}(H | E_i)$. If this is violated, the theory must provide a principled account of which conditional probabilities shift and why.
  *   **Motivation:** The evidence is assumed to impact the likelihood of the evidential cells themselves, not the logical or probabilistic connections between those cells and other hypotheses. Violating this without cause introduces arbitrariness.
  *   **Status:** **Non-negotiable** (for JC-style frameworks); **Contested** (for holistic frameworks).

  **3. Partition Refinement Invariance**
  *   **Requirement:** If an evidential cell $E_i$ is partitioned into subcells $\{E_{i1}, E_{i2}\}$ such that the agent's experience warrants the same shift in total probability for $E_i$ and the conditional probabilities within $E_i$ are preserved, the final posterior over the algebra should remain unchanged.
  *   **Motivation:** Rational updating should not depend on the granularity of the language or description used to report the evidence.
  *   **Status:** **Non-negotiable.**

  **4. Order Effects (Commutativity)**
  *   **Requirement:** The rule must specify conditions under which the order of two uncertain updates does not affect the final credence. If the order *does* matter, the rule must explain why the temporal sequence constitutes distinct evidence.
  *   **Motivation:** If two observations are independent, the final state of belief should not depend on which was processed first. However, if "evidence" includes the agent's total phenomenological experience, the second experience occurs in a different doxastic context, potentially justifying order sensitivity.
  *   **Status:** **Non-negotiable** (must be addressed); **Preference** (for order independence where evidence is abstractable from context).

  **5. Diachronic Coherence (Dynamic Dutch Book)**
  *   **Requirement:** The updating rule must not expose the agent to a sure loss from a bookie who knows the agent's updating rule and the sequence of evidence shifts in advance.
  *   **Motivation:** Pragmatic consistency. A rational agent should not accept a series of bets that guarantee a loss solely due to their method of belief revision.
  *   **Status:** **Non-negotiable.**

  **6. Ineffable and Old Evidence**
  *   **Requirement:** The rule must accommodate cases where the agent cannot articulate the specific partition (ineffable evidence) and cases where the evidence is already held with high credence but gains new relevance (old evidence).
  *   **Motivation:** Real agents often learn from experiences they cannot fully describe (e.g., perceptual gestalts) or must update on known data in light of new theories.
  *   **Status:** **Preference** (highly desirable for psychological realism, technically difficult).

  **7. Updating vs. Supposing**
  *   **Requirement:** The theory must formally distinguish revising credence based on evidence (changing $P(E)$) from conditionalizing on a hypothesis for the sake of argument (evaluating $P(H|E)$ while holding $P(E)$ fixed).
  *   **Motivation:** Confusing learning with supposing leads to errors in causal reasoning and planning.
  *   **Status:** **Non-negotiable.**

  **8. Infinite Partitions and Undefined Probabilities**
  *   **Requirement:** The rule must be well-defined for continuous algebras or cases where prior conditional probabilities are undefined (e.g., conditioning on measure-zero events).
  *   **Motivation:** Mathematical generality is required for scientific applications (e.g., physics, statistics).
  *   **Status:** **Preference** (technical robustness).

  **9. Computability**
  *   **Requirement:** The posterior credences must be calculable or approximable with finite resources in realistic timeframes.
  *   **Motivation:** Bounded rationality. A rule that requires solving intractable optimization problems is not action-guiding.
  *   **Status:** **Preference.**

  **10. Higher-Order Uncertainty**
  *   **Requirement:** The rule must account for uncertainty regarding the reliability of the evidence source. If the agent is unsure whether the shift in the partition is accurate, the update should reflect this.
  *   **Motivation:** Agents are rarely certain that their perceptions or instruments are veridical. Ignoring source reliability leads to over-confidence.
  *   **Status:** **Non-negotiable.**

  ---

  ## II. Incompatibility Results and Tensions

  The following conflicts suggest that no single rule satisfies all desiderata simultaneously. These are structural features of the problem space, not merely defects of specific proposals.

  **1. Rigidity vs. Higher-Order Uncertainty**
  *   **The Conflict:** Rigidity requires $P_{new}(H|E) = P_{old}(H|E)$. However, if an agent receives uncertain evidence, they often update on the *reliability* of the source. If the source's reliability is correlated with the truth of $H$, learning that the source indicates $E$ changes the probability of $H$ *given* $E$.
  *   **Result:** A rule that strictly enforces Rigidity cannot fully accommodate Higher-Order Uncertainty regarding source reliability without modification. To handle reliability, one must violate Rigidity (allowing conditional probabilities to shift), but doing so undermines the primary justification for Jeffrey Conditionalization.

  **2. Partition Invariance vs. Rigidity (The Wagner Problem)**
  *   **The Conflict:** Carl Wagner (2002) demonstrated that Jeffrey Conditionalization violates Partition Refinement Invariance in specific cases. If a partition is refined, the "same" uncertain experience may map to different probability shifts over the finer cells. Preserving Rigidity over the coarse partition often implies violating it over the fine partition, or vice versa.
  *   **Result:** You cannot simultaneously maintain strict Rigidity and full Partition Refinement Invariance for all possible refinements. A theory must choose which level of description anchors the rigidity constraint.

  **3. Order Independence vs. Total Experience**
  *   **The Conflict:** Order Independence (Commutativity) requires that evidence items be treated as separable inputs. However, if evidence is defined as the "total phenomenological experience" (Desideratum 4 nuance), the second experience is inherently conditioned on the doxastic state produced by the first.
  *   **Result:** A theory that treats evidence as context-independent abstract shifts (to satisfy Order Independence) risks failing to capture the actual epistemic impact of the experience (violating the spirit of Desideratum 4). A theory that respects the holistic nature of experience will generally be order-dependent.

  **4. Diachronic Coherence vs. Uncertain Evidence Shifts**
  *   **The Conflict:** Standard Dutch Book arguments assume the bookie knows the *truth* of the evidence. In uncertain evidence, the bookie knows the *shift* the agent will make. Christensen (1991) and others have shown that if a bookie knows the agent's JC shift rule in advance, they can construct a Dutch Book against the agent unless the shifts satisfy very restrictive constraints (essentially reducing to conditionalization on a certain event).
  *   **Result:** Full Diachronic Coherence (in the standard betting sense) is incompatible with general uncertain evidence updating unless the agent's updating rule is kept secret from the bookie or the betting scenario is modified to account for the uncertainty of the evidence itself.

  ---

  ## III. Brief Evaluation of Existing Rules

  | Desideratum | **Jeffrey Conditionalization (JC)** | **Maximum Entropy (MaxEnt)** | **Reflection-Style (van Fraassen)** |
  | :--- | :--- | :--- | :--- |
  | **1. Strict Conditionalization** | **Pass.** Limit case holds. | **Pass.** Limit case holds. | **Pass.** Consistent with limiting certainty. |
  | **2. Rigidity** | **Pass.** Built-in axiom. | **Fail.** Often shifts conditional probs to maximize entropy. | **N/A.** Constrains future belief, not current update mechanism. |
  | **3. Partition Invariance** | **Fail.** Vulnerable to Wagner-style refinements. | **Pass.** Generally invariant under constraint translation. | **Pass.** Abstract constraint avoids partition dependence. |
  | **4. Order Effects** | **Fail.** Generally order-dependent. | **Mixed.** Depends on constraint formulation. | **Pass.** Focuses on alignment, not sequence. |
  | **5. Diachronic Coherence** | **Fail.** Vulnerable to dynamic Dutch Books (Christensen). | **Mixed.** Depends on prior selection. | **Pass.** Designed specifically to avoid Dutch Books. |
  | **6. Ineffable/Old Evidence** | **Fail.** Requires explicit partition. | **Pass.** Can handle constraints without explicit partition. | **Pass.** Handles expectations of future belief. |
  | **7. Updating vs. Supposing** | **Pass.** Clear distinction. | **Pass.** Clear distinction. | **Pass.** Clear distinction. |
  | **8. Infinite/Undefined** | **Fail.** Struggles with continuous cases. | **Pass.** Well-suited for continuous distributions. | **Pass.** Abstract formulation handles infinities. |
  | **9. Computability** | **Pass.** Simple linear calculation. | **Fail.** Optimization can be intractable. | **Pass.** Conceptual check, not calculation. |
  | **10. Higher-Order Uncertainty** | **Fail.** Requires ad-hoc extension (e.g., J-C on reliability). | **Pass.** Can encode reliability as constraints. | **Pass.** Naturally handles uncertainty about future selves. |

  **Summary:** JC excels in simplicity and rigidity but fails on coherence, invariance, and order effects. MaxEnt handles mathematical generality and invariance better but sacrifices rigidity and computability. Reflection ensures coherence and handles higher-order uncertainty but functions more as a constraint on rationality than a mechanical update rule for specific evidence inputs.
