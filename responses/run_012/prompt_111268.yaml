      *   *Decline:* It's a story told after the fact *unless* we define it as "loss of capacity to absorb shocks."
      *   *Funding:* 4 researchers should build a dataset of *state capacities* across time, not argue about whether the US is Rome.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "Upstream," "Tractability," "Neglectedness," and "Evidence" for each question as requested. Don't bury these in paragraphs. Use clear headers or bullet points.

      *(Refining the "Decline" ontology)*: Be precise. Decline is often a *reduction in optionality*. It is real, but hard to measure in real-time because adaptation masks it.

      *(Refining the "Reference Class" objection)*: It is manageable *if* we treat reference classes as hypotheses to be tested, not axioms.

