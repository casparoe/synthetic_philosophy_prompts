      *   *The Alternative:* Narrower targets (institutional resilience) are likely more tractable and actionable. Forecasting "US decline" is vague; forecasting "US fiscal capacity to sustain military commitments" is concrete. However, the prompt asks specifically about the "outside view of empires." I need to balance the philosophical critique with the practical funding mandate. I will argue for a pivot *within* the empire framework: focus on *mechanisms* of durability rather than *labels* of empire.
