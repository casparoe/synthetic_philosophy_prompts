      *   **Required Analysis per Question:**
          *   Upstream status (dependency).
          *   Tractability (historical data vs. formal models).
          *   Neglectedness (relative to importance).
          *   Evidence triggers (what moves it up/down in 2 years).
      *   **Core Objection to Address:** Underdetermination (reference class problem, selection bias in historical records). Is it fatal, manageable, or the key question?
      *   **Ontological Question:** Is "decline" a real process or a post-hoc story?
      *   **Alternative Proposal:** Should the money go to narrower targets (institutional resilience) instead of empire lifespan? Defend if chosen.

  2.  **Initial Assessment & Stance:**

