      2.  **Operationalizing Reference Classes:** (How to group states based on Q1, not just labels.)
      3.  **The Ontology of Decline:** (Is it measurable in real-time?)
      4.  **Institutional Resilience vs. Imperial Lifespan:** (The pivot/narrowing argument).

      *Wait, the prompt asks me to choose between the "empire lifespan" approach or the "narrower targets" approach.* I need to take a stand. Given the "underdetermination" objection, the "empire lifespan" approach is fraught. The "institutional resilience" approach is more robust. I will advise the funder to pivot the *framing* of the research while keeping the *spirit* of the outside view. I will argue that "empire lifespan" is a dependent variable of "institutional resilience."

      *Let's stick closer to the prompt's specific request:* "Which open questions should they prioritize... Address squarely the objection... If you think the money is better spent on narrower targets... say so."
      Okay, I will argue for the narrower targets *as the solution* to the underdetermination problem. This allows me to answer the "empire" prompt while acknowledging the fatal flaw of broad categorization.

      *Revised Plan for Questions:*
      1.  **Identifying Robust Predictors of State Durability:** (Moving away from "Empire" to "State Capacity").
      2.  **Defining the "Decline" Signal:** (Distinguishing noise from structural decay).
      3.  **Reference Class Construction:** (Data-driven clustering vs. historical typology).
      4.  **Translation to Contemporary Powers:** (Mapping modern metrics to historical proxies).

  4.  **Addressing the Core Objection (Underdetermination):**

      *   Is it fatal? No, but it fatalizes *lazy* analogies (e.g., "US = Rome").
      *   Is it manageable? Yes, by focusing on *functional* metrics (fiscal extractive capacity, monopoly on violence) rather than *nominal* labels (Empire, Hegemon).
