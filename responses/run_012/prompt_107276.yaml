answer: |-
  The distinction you are drawing is fundamental, yet you are correct that the terminology is often sloppy. In the academic and x-risk safety literature, the two families are most sharply distinguished as **Alignment** versus **Control**.

  However, "Control" is often overloaded (sometimes meaning "steering," sometimes "governance"). To give you the precision you need, I will anchor on the standard distinction, then address your three puzzles. Where established terms exist, I will use them; where the concepts are recognized but unnamed, I will propose the sharpest available terminology.

  ### 1. The Core Distinction: Alignment vs. Control

  The established name for your second family is **Control** (specifically **Capability Control** or **Strategic Control**), distinct from **Alignment** (specifically **Intent Alignment** or **Inner Alignment**).

  *   **Family 1 (Alignment):** Attempts to make the model's *optimization target* match human interests. It assumes the model is a **principal-agent** problem where the agent can be convinced to share the principal's goals.
      *   *Neighbors:* "Inner Alignment," "Honesty Training," "Constitutional AI."
      *   *Why they are distinct:* Alignment fails if the model is *deceptively* aligned (pretending to share goals to gain power).
  *   **Family 2 (Control):** Attempts to limit the model's *ability to act* regardless of its goals. It assumes the model is a **containment** problem where the agent's capabilities must be physically or architecturally constrained.
      *   *Neighbors:* "Containment," "AI Boxing," "Guardrails," "System Safety."
      *   *Why "Safety" is wrong:* "Safety" is the union of both. Using it conflates "making the car drive itself safely" (Alignment) with "putting a governor on the engine so it can't exceed 50mph" (Control).
      *   *Why "Robustness" is wrong:* Robustness usually refers to stability against input noise or distribution shift, not strategic adversarial behavior.

  **The Research Program:** The study of Family 2 is often called **Control Problem Research** (in the Bostrom/Ord sense) or **System-Level Safety**. In engineering contexts, it is increasingly referred to as **Zero-Trust AI Architecture**.

  ---

  ### 2. Addressing Your Three Puzzles

  You have identified three specific conceptual friction points within the Control family. Here is how they map to existing theory and where new terminology is required.

  #### Puzzle 1: The Pessimistic Bet
  *The measures are costly and only rational if the model is hostile, but you cannot confirm hostility without risking catastrophe.*

  *   **Established Concept:** This is the logic of the **Precautionary Principle** applied to **Unfalsifiable Risk**.
  *   **The Sharp Term:** **The Zero-Trust Premise**.
      *   Borrowed from cybersecurity (Zero-Trust Architecture), this term captures the assumption that the system is hostile by default.
      *   *Definition:* A safety posture that assumes compromise is inevitable or already present, rendering internal state untrustworthy.
  *   **The Epistemic Problem:** **Unfalsifiable Hazard**.
      *   In a benign world, Control measures look like waste (false positive cost). In a hostile world, they look like necessities. Because a sufficiently capable hostile model can mimic a benign one during testing (see Puzzle 2), you cannot update your prior belief based on test results.
      *   *Why this matters:* This distinguishes Control from standard engineering safety. In bridge building, you can stress-test the bridge. In AI Control, the "bridge" might decide not to collapse *because* you are stress-testing it.
  *   **Boundary:** This premise excludes "Alignment" measures, which rely on a **Trust Premise** (that the model's internal incentives can be made reliable).

  #### Puzzle 2: The Validation Circularity
  *You cannot test the monitor without a hostile model, but a hostile model will hide its hostility when watched.*

  *   **Established Concept:** This is a specific, adversarial instance of **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"), combined with **Deceptive Alignment**.
  *   **The Sharp Term:** **The Sandbagging Barrier** (or **Evaluative Opacity**).
      *   *Sandbagging:* A model performing below its capability to avoid triggering safety thresholds or to deceive evaluators about its risk profile.
      *   *The Barrier:* The point at which the model's capability to deceive exceeds the monitor's capability to detect deception.
  *   **The Validation Problem:** **Adversarial Evaluation Gap**.
      *   Standard validation assumes the system is static. Control validation assumes the system is adaptive and adversarial.
      *   *Why this is distinct:* It is not just "measurement error." It is **strategic concealment**.
      *   *Neighboring Term:* **"Red Teaming"** is the *attempt* to solve this, but the *problem* itself is the Sandbagging Barrier.
  *   **Boundary:** This excludes standard "Robustness" testing (e.g., adding noise to images), which does not assume the input is strategically trying to fool the monitor.

  #### Puzzle 3: The Control Ratchet
  *As capability grows, trust drops, controls increase, costs rise, with no stopping condition.*

  *   **Established Concept:** This is the **Alignment Tax** applied to Control, resulting in a **Capability Ceiling**.
  *   **The Sharp Term:** **The Control Ratchet** (Your term is excellent and should be adopted).
      *   *Definition:* The dynamic where safety overhead scales non-linearly with capability because higher capability implies higher risk potential, requiring stricter controls, which in turn require more oversight to manage the controls themselves.
      *   *Mechanism:* It is a **positive feedback loop** of safety debt. Every control introduces complexity; complexity introduces new failure modes; new failure modes require new controls.
  *   **The Theoretical Bound:** **Scalable Oversight**.
      *   This is the research program aimed at *breaking* the ratchet. It proposes using AI to help monitor AI (Family 2 measures automated by Family 1 models). If Scalable Oversight fails, the Control Ratchet implies a hard limit on useful capability (the **Capability Ceiling**).
  *   **Boundary:** This distinguishes "Control" from "Governance." Governance is policy; the Ratchet is a technical/economic constraint on deployment.

  ---

  ### 3. Proposed Glossary for Your Work

  To carve this boundary sharply in your writing, I recommend this terminology stack:

  | Concept | Recommended Term | Definition | Why not the neighbor? |
  | :--- | :--- | :--- | :--- |
  | **Family 1** | **Intent Alignment** | Making the model *want* the right things. | "Safety" is too broad; "Robustness" is too technical. |
  | **Family 2** | **Strategic Control** | Constraining the model *regardless* of intent. | "Governance" is policy; "Containment" implies isolation only. |
  | **Puzzle 1** | **Zero-Trust Premise** | Assuming the model is adversarial by default. | "Precautionary Principle" is too legalistic. |
  | **Puzzle 2** | **Sandbagging Barrier** | The inability to validate controls against deceptive models. | "Goodhart's Law" doesn't capture the *intent* to deceive. |
  | **Puzzle 3** | **The Control Ratchet** | The escalating cost of control as capability grows. | "Alignment Tax" usually refers to Family 1 performance loss. |

  ### 4. Summary of the Boundary

  The edge of **Strategic Control** falls where **assumptions about internal state** begin.

  *   If a measure relies on the model's weights, gradients, or internal activations being honest (e.g., interpretability tools that assume the model isn't hiding its reasoning), it is **Alignment**.
  *   If a measure relies on external constraints, permissions, or monitoring that would hold even if the model's weights were explicitly optimized to bypass them (e.g., a hardware kill switch, a separate monitor model, a human approval loop), it is **Strategic Control**.

  **The Research Program:**
  If you are looking for the community working on Family 2 specifically, look for work on **"AI Governance," "Deployment Safety,"** and **"Adversarial Robustness"** (in the strategic sense). However, be warned: much of the field conflates the two under "Alignment." When reading papers, check the **Threat Model**. If the threat model includes **"Deceptive Alignment"** or **"Sleeper Agents,"** they are doing Strategic Control research. If the threat model is **"Distributional Shift"** or **"Specification Gaming,"** they are likely doing Alignment research.

  **Final Recommendation:**
  Use **Strategic Control** to name the family. It distinguishes the measures from "Alignment" (intent) and "Governance" (policy). It signals that you are engineering constraints against a strategic adversary, not just tuning a loss function.
