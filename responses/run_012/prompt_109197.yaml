answer: |-
  You have put your finger on one of the most persistent and sophisticated debates in modern metaphysics. Your intuition regarding the circularity of the standard reply is correct, and the tension you identify between PII as a "logical truth" and Black's spheres as a "metaphysical possibility" reveals the crux of the disagreement.

  To resolve this, we need to disentangle three distinct issues: the logical status of the principle, the nature of the properties involved, and the metaphysics of individuation.

  ### 1. Is PII a Logical Truth?
  There is a widespread confusion between two different principles often attributed to Leibniz:

  1.  **The Indiscernibility of Identicals (IOI):** If $x$ and $y$ are identical, they share all properties. ($x=y \rightarrow \forall P(Px \leftrightarrow Py)$). This is universally accepted as a logical truth (Leibniz's Law).
  2.  **The Identity of Indiscernibles (PII):** If $x$ and $y$ share all properties, they are identical. ($\forall P(Px \leftrightarrow Py) \rightarrow x=y$). **This is not a logical truth in the same sense.**

  If you formulate PII in second-order logic and allow *any* predicate to count as a property (including the predicate "is identical to $x$"), then PII becomes trivially true. However, this renders the principle uninformative. It essentially says, "If $x$ and $y$ share all properties, including the property of being identical to $x$, then $x$ and $y$ are identical."

  When philosophers debate PII, they are debating the **substantive** version: Do objects sharing all *qualitative* (intrinsic and relational) properties have to be numerically identical? Regarding *this* version, PII is **not** a logical truth; it is a metaphysical hypothesis. Therefore, claiming it is a "logical truth" usually involves smuggling in the trivializing definition that you correctly identified as circular.

  ### 2. The Circularity Objection
  You asked: *"Doesn't the usual reply—that the spheres are discernible because one is identical to sphere A and the other to sphere B—simply presuppose the distinctness it is meant to explain?"*

  **Yes, absolutely.** This is known as the objection from **impure properties**.
  *   **Pure Properties:** Qualities like "being iron," "being spherical," or "being one mile from a sphere."
  *   **Impure Properties:** Qualities that involve specific individuals, like "being identical to Sphere A" or "being 1 mile from *this* sphere."

  If you allow impure properties, Black's spheres are discernible (Sphere 1 has the property "is Sphere 1," Sphere 2 does not). But this saves PII only by making it tautological. It presupposes that Sphere 1 and Sphere 2 are already distinct entities to which we can refer. It explains *that* they are distinct, but not *in virtue of what* they are distinct. Most philosophers agree that for PII to be an interesting metaphysical principle, it must be restricted to **pure properties**. Under that restriction, Black's spheres remain a potent counterexample.

  ### 3. The Dilemma: One Sphere or Primitive Identity?
  If we accept that Black's scenario is metaphysically possible (a symmetrical universe with two qualitatively identical spheres), we are forced to choose between two main metaphysical positions. Your formulation of the dilemma is accurate:

  **Option A: PII is Necessary (Bundle Theory / Qualitativism)**
  If you hold that PII is a necessary truth, then Black's scenario is **impossible**.
  *   **The Response:** You must argue that what Black describes is not actually two spheres. If they share all properties, they are one object.
  *   **The Cost:** This requires adopting a **Bundle Theory** of objects (objects are nothing over and above their properties). If there is no "substratum" or "thisness" holding the properties together, there is nothing to distinguish the two locations but the properties themselves. If the properties are identical, the object is identical.
  *   **Verdict:** You don't say there is "really only one sphere" in the sense that Black made a counting error; you say his description describes a metaphysically incoherent world.

  **Option B: PII is Contingent/False (Substratum Theory / Haecceitism)**
  If you hold that Black's scenario is possible, then PII is false.
  *   **The Response:** You must argue that numerical distinctness does not require qualitative difference. There is a primitive "thisness" (haecceity) attached to each sphere.
  *   **The Cost:** You must accept **Primitive Identity**. This means identity is a brute fact that cannot be reduced to properties. Sphere A and Sphere B are distinct simply because they are *different things*, not because they have different features.
  *   **Verdict:** This is the most common contemporary response to Black. It preserves the intuition that the universe could contain two identical particles while rejecting PII as a necessary principle.

  ### 4. Summary of the Correct Response
  To answer your specific questions directly:

  1.  **Is PII a logical truth?** No, not in the substantive sense required to rule out Black's spheres. It is only a logical truth if defined trivially using identity-involving properties.
  2.  **Is the "identity to A/B" reply circular?** Yes. It renders PII analytically true but metaphysically empty. It cannot be used to refute Black without begging the question.
  3.  **Is the correct response "one sphere" or "primitive identity"?**
      *   If you are a **Qualitativist** (properties constitute reality), you must say Black's world is impossible (effectively "one sphere").
      *   If you are a **Haecceitist** (objects have primitive thisness), you say Black's world is possible and PII is false.

  Most modern metaphysicians lean toward **Haecceitism** in this context. They argue that Black has successfully shown that numerical diversity does not supervene on qualitative diversity. Therefore, identity is indeed a primitive, bare numerical difference that cannot be fully reduced to properties. Black's spheres are distinct not because of *what* they are, but simply because they are *two*.

  ### Conclusion
  Your skepticism is well-founded. The claim that PII is a logical truth is usually a verbal trick that relies on the circular inclusion of identity properties. If we strip away that trick, we are left with a genuine metaphysical choice: either deny the possibility of Black's universe (Bundle Theory) or accept that objects have a primitive individuation that transcends their properties (Haecceitism). The latter is generally considered the more robust response to Black's argument.
