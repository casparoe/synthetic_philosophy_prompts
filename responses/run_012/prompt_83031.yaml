answer: |-
  You have carved this very precisely. You are right to feel that "Money Pump" is close but not quite the right fit. The classic Money Pump relies on **intransitive preferences** (A>B, B>C, C>A) existing at a single moment. Your examples rely on **transitive preferences at every moment**, but a failure of **integration across time or structure**.

  There isn't one single word that covers both flavors perfectly, but there are two very strong technical terms for the flavors, and a unifying mathematical concept for the whole animal.

  ### 1. The Names You Already Have

  **Flavor 1 (The Smoker): Dynamic Inconsistency**
  In economics and decision theory, this is the standard term. It describes a situation where a decision-maker's preferences change over time in such a way that a preference held at one time becomes inconsistent with a preference held at a later time.
  *   **The Mechanism:** Usually modeled as **Hyperbolic Discounting**. We discount the future heavily when it is far away, but as the "future" becomes "now," the discount rate spikes.
  *   **Why it fits:** At $T_1$ (morning), you prefer Health > Smoke. At $T_2$ (stressful break), you prefer Smoke > Health. At $T_3$ (regret), you prefer Health > Smoke. No single ranking is contradictory *at the time it is held*, but the sequence is self-defeating.
  *   **The "Money Pump" connection:** Behavioral economists *do* sometimes call this a money pump, but specifically a **Dynamic Money Pump**. It requires the exploiter to wait for your preferences to shift.

  **Flavor 2 (The Auction): Escalation of Commitment**
  This is the specific name for the auction scenario you described (which is formally known as the **Dollar Auction**, invented by Martin Shubik).
  *   **The Mechanism:** **Sunk Cost Fallacy** combined with **Game Theoretic Traps**. Once you enter the auction, the rational move to minimize loss is to bid higher, because dropping out crystallizes the loss without the chance of recouping it.
  *   **Why it fits:** Every bid is a local minimization of loss. The entry was the only mistake, but the entry looked rational until the trap sprung.
  *   **The "Money Pump" connection:** This isn't a money pump in the preference sense; it's a **Nash Equilibrium Trap**. Both players are playing "optimally" given the other player's strategy, but the game itself is designed to destroy value.

  ### 2. Are They One Phenomenon or Two?

  Structurally, they are the **same animal**. Mechanically, they are **different engines**.

  **The Shared Structure: Local vs. Global Optimization**
  In computer science and optimization theory, this is called getting stuck in a **Local Maximum**.
  *   Imagine you are climbing a mountain range in the fog. You can only see your feet. You always take the step that goes upward (locally rational).
  *   **The Smoker:** The terrain itself is shifting under your feet (your internal state changes the value of the steps).
  *   **The Auction:** The terrain is static, but you are on a narrow ridge where the only way "up" (minimizing loss) leads you off a cliff eventually.
  *   **The Result:** You reach a peak that is lower than the mountain you would have climbed if you had a map (the "package deal" view).

  So, if you want to carve them as one phenomenon, the carve is: **Myopic Optimization in Sequential Decision Trees.**
  *   **Myopic:** You only see the next node.
  *   **Sequential:** The choices happen in a chain, not a bundle.
  *   **Decision Tree:** The structure of available options changes based on previous choices.

  ### 3. What Does the Money Pump Need That These Don't?

  The classic Money Pump requires **Logical Inconsistency**.
  Your scenarios require **Structural or Temporal Fragmentation**.

  *   **Money Pump:** If I freeze you in time and ask you to rank A, B, and C, you break logic. I can pump you instantly.
  *   **Your Scenarios:** If I freeze you in time, your logic is perfect. I cannot pump you *now*. I have to wait for time to pass (Smoker) or for the game state to change (Auction).

  The Money Pump attacks the **Agent's Logic**.
  Your scenarios attack the **Agent's Horizon**.

  ### 4. How to Name the General Loss

  You asked for a general name for a loss that can't be pinned on any one choice.

  **The Technical Term:** **Path Dependence.**
  This describes outcomes that depend on the sequence of events, not just the starting conditions. In your cases, the path taken forces a bad outcome that wasn't inevitable at the start.

  **The Philosophical Term:** **Akrasia.**
  Greek for "weakness of will." It specifically covers acting against one's better judgment. However, this fits the Smoker better than the Auction (where it's more about tactical entrapment).

  **The Coined Term:**
  If you want a label that captures the "rational steps, irrational journey" vibe, I suggest **The Rationality Ratchet**.
  *   **Ratchet:** A mechanism that allows motion in one direction but prevents going back.
  *   **Why it fits:** In both examples, you can't easily undo the previous step. The smoker has already bought the pack; the bidder has already bid $5. The "click" of the ratchet makes the next rational step the one that tightens the trap.

  ### 5. Is it the "Sunk Cost" animal?

  **The Auction:** Yes, absolutely. That is the definition of sunk cost escalation.
  **The Smoker:** No, not primarily. The smoker isn't smoking because they already smoked; they are smoking because the *current* craving outweighs the *future* health cost. That is **Impulse Control Failure**, not Sunk Cost.

  This is why you feel they are slightly different flavors. One is about **cannot stop paying** (Auction), the other is about **cannot stop wanting** (Smoker).

  ### Summary for your carving

  If you need to talk about this shape, here is the cleanest way to draw the edges:

  1.  **The Umbrella:** **Sequential Rationality Failure.** (A run of locally optimal choices yielding a globally suboptimal outcome).
  2.  **The Distinction:**
      *   If the trap is internal (preferences shift over time): **Dynamic Inconsistency**.
      *   If the trap is external (payoff structure shifts over time): **Escalation of Commitment**.
  3.  **The Difference from Money Pump:** Money Pumps exploit **Intransitivity** (broken logic). These exploit **Myopia** (limited horizon).
  4.  **The Solution:** In both cases, the only rational move is **Precommitment**. The smoker must throw away the cigarettes in the morning; the bidder must refuse to enter the auction. The fact that Precommitment is *necessary* proves that the sequential choices cannot be trusted, even if they are locally rational.

  You don't need to make up a name if you use **Dynamic Inconsistency** and **Escalation of Commitment**, but if you want the poetic label for the whole shape, **"The Rationality Ratchet"** or **"The Local Optima Trap"** does the heavy lifting.
