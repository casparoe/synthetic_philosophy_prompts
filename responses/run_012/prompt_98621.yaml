  # The Decision Tree: Causal Status of Phenomenal Properties

  ### Entry Commitment
  **The Phenomenal Datum:** There is something it is like to be the subject, and this fact is not exhausted by any physical description of the subject.

  ---

  ### Node 1: The Veridicality Fork
  **Question:** Is this commitment a truthful account of reality, or merely a description of how things seem to the subject?
  *   **Answer:** It is merely how things seem; the reality is devoid of phenomenal properties.
      *   **Leaf:** **Illusionism**
      *   *Awkward Commitment:* The conviction that one is conscious is itself a non-conscious mechanical process.
  *   **Answer:** It is a truthful account; phenomenal properties are real.
      *   **Proceed to Node 2.**

  ### Node 2: The Ontological Fork
  **Question:** Is the failure of physical description to capture experience a failure of our concepts or a feature of the world?
  *   **Answer:** A failure of our concepts; the experience is physically realised but not conceptually transparent.
      *   **Leaf:** **Identity Theory**
      *   *Awkward Commitment:* Two entirely different descriptions refer to the exact same entity without remainder.
  *   **Answer:** A feature of the world; the experience is ontologically distinct from the structural physical description.
      *   **Proceed to Node 3.**

  ### Node 3: The Intrinsic Nature Fork
  **Question:** Is the experience the intrinsic nature of the physical base itself?
  *   **Answer:** Yes; physical descriptions are structural, and experience is what that structure feels like from the inside.
      *   **Leaf:** **Russellian Monism**
      *   *Awkward Commitment:* Inanimate matter possesses proto-conscious properties to ground the intrinsic nature of the physical.
  *   **Answer:** No; the experience is a distinct addition to the physical base.
      *   **Proceed to Node 4.**

  ### Node 4: The Causal Efficacy Fork
  **Question:** Does this distinct phenomenal property cause physical events (such as speech or movement)?
  *   **Answer:** Yes; the mental interacts with the physical.
      *   **Leaf:** **Interactionist Dualism**
      *   *Awkward Commitment:* Physical energy is not conserved, or the laws of physics are incomplete.
  *   **Answer:** No; the phenomenal property is causally idle regarding the physical world.
      *   **Proceed to Node 5.**

  ### Node 5: The Stowaway Fork (Paradox of Phenomenal Judgement)
  **Question:** Consider the Stowaway: a being whose reports about experience are generated entirely by a physical subsystem receiving no input from phenomenal states. Is the Stowaway's condition your condition?
  *   **Answer:** Yes; we are all Stowaways; our reports are physically caused, and our experiences are silent side-effects.
      *   **Proceed to Node 6.**
  *   **Answer:** No; the Stowaway is a zombie or a distinct creature; my reports are linked to my experience, just not by standard physical causation.
      *   **Proceed to Node 7.**

  ### Node 6: The Exclusion Fork
  **Question:** Is the causal idleness of the experience due to the causal sufficiency of the physical base?
  *   **Answer:** Yes; the physical base does all the work, squeezing the phenomenal property out of the causal chain.
      *   **Leaf:** **Property Dualism (Exclusion)**
      *   *Awkward Commitment:* A real property exists that makes no difference to the world whatsoever.
  *   **Answer:** No; the experience is idle by its own nature, regardless of physical closure.
      *   **Leaf:** **Epiphenomenalism**
      *   *Awkward Commitment:* Knowledge of experience is impossible, yet we claim to have it.

  ### Node 7: The Non-Causal Link Fork
  **Question:** If the experience causes no physical event, and you are not a Stowaway, how is the report linked to the experience?
  *   **Answer:** By a pre-established harmony or divine coordination between mental and physical streams.
      *   **Leaf:** **Parallelism or Occasionalism**
      *   *Awkward Commitment:* A vast, systematic coincidence aligns every mental state with a physical report without contact.
  *   **Answer:** The judgement about the experience *is* the experience; there is no gap to bridge.
      *   **Leaf:** **Higher-Order View**
      *   *Awkward Commitment:* A creature incapable of forming thoughts about its states has no experiences at all.

  ---

  ### Notes on Empty Branches

  **1. The "Causal Closure" Contradiction**
  *   *Location:* Node 4 (Answer: Yes) combined with a commitment to the causal closure of the physical.
  *   *Diagnosis:* **Incoherent.** One cannot claim the physical world is causally closed (every physical event has a physical cause) and simultaneously claim a non-physical property causes physical events. This branch is occupied only by those willing to deny the conservation of energy.

  **2. The "Illusionist Causation" Void**
  *   *Location:* Node 1 (Answer: Seeming only) combined with the claim that the seeming has non-physical causal powers.
  *   *Diagnosis:* **Unattractive.** If the experience is an illusion, there is no non-physical property to possess causal power. To grant causal power to an illusion is to grant it reality, collapsing the branch back into Realism.

  **3. The "Russellian Epiphenomenalist" Gap**
  *   *Location:* Node 3 (Answer: Yes) combined with Node 4 (Answer: No).
  *   *Diagnosis:* **Unexplored.** While logically possible (the intrinsic nature is real but causally inert), this view is rarely defended. If experience is the intrinsic nature of the physical, and the physical is causal, it is awkward to claim the intrinsic nature plays no role in that causality.

  ---

  ### The Stowaway Case Analysis

  **Nodes Forced into Existence**
  The Stowaway case forces the existence of **Node 5 (The Stowaway Fork)**. Without this specific node, the tree cannot distinguish between views that accept the causal disconnect as the human condition (Epiphenomenalism) and views that posit a non-causal link (Parallelism/HOT). It also necessitates **Node 6**, as the Stowaway scenario is the precise operationalisation of the Exclusion Argument.

  **Positional Treatment of the Stowaway**
  *   **Impossible:** **Interactionist Dualism** and **Identity Theory**. For the Interactionist, reports *must* be caused by experience. For the Identity Theorist, the physical state *is* the experience, so the report is caused by the experience by definition.
  *   **Incoherent:** **Illusionism**. Since there are no phenomenal states to be disconnected from, a being whose reports are disconnected from them is a category error.
  *   **Merely Unactual:** **Parallelism or Occasionalism**. The harmony is guaranteed by God or natural law; a Stowaway would require a breakdown in this harmony, which is metaphysically possible but nomologically impossible.
  *   **Actual:** **Epiphenomenalism** and **Property Dualism (Exclusion)**. On these views, the Stowaway is not a hypothetical monster; the Stowaway is *us*.

  ---

  ### Flagged Indistinguishable Leaves

  **Property Dualism (Exclusion) and Epiphenomenalism**
  While the tree separates these by the *reason* for causal idleness (sufficiency of the physical base vs. inherent inertness), in practice, these positions are notoriously difficult to distinguish. Both result in a world where phenomenal properties exist but do nothing. The distinction often collapses because if a property is inherently inert, it is functionally excluded by the physical base anyway. The novelist should treat these as neighbouring rooms with a very thin wall; a character might slide from one to the other without noticing the door has opened.
