answer: |-
  Short answer
  The established name is **Perceptual Learning**, specifically the **differentiation account** rather than attentional weighting. It describes how sensory systems physically retune to isolate invariant structures, making previously hidden features appear objectively present. While the mechanism is learning, the phenomenological state is often referred to as **Perceptual Expertise**, capturing the involuntary "givenness" of the new structure.

  Nearest concepts
  **Cognitive Penetration:** This argues that beliefs or desires directly alter perceptual content. It matches the idea that what you know changes what you see, but fails on involuntariness; you cannot believe your way out of the oakiness, whereas penetration implies a top-down influence you could theoretically resist or vary with belief strength.

  **Categorical Perception:** This describes how continuous stimuli are perceived as belonging to discrete bins (like phonemes). It matches the sharpening of distinctions, but fails because your experience isn't just sorting bins; it's seeing internal structure and relations within the object that weren't there before.

  **Aspect Perception:** Wittgenstein's "seeing-as" (like the duck-rabbit) covers sudden shifts in organization. It matches the "dawning" feeling, but fails because aspect switches are reversible and unstable, whereas your expertise is cumulative, stable, and resists switching back.

  **Encapsulation:** This suggests perceptual modules are immune to outside information. It matches the felt objectivity and independence from belief, but fails because your fatigue example shows the system isn't fully sealed; it requires cognitive resources to maintain the differentiated view.

  **Perceptual Learning:** This covers the long-term changes in perception due to practice. It fits the mechanism and the stability, but often focuses on behavioral improvement rather than the phenomenological "disclosure" of new parts you are describing.

  The phenomenon itself
  This phenomenon is the structural differentiation of sensory input following training, where previously undifferentiated stimuli acquire intrinsic parts and relations. It is not interpreting raw data through a lens; it is the sensory system itself acquiring new resolution, causing features to emerge as objective properties rather than imposed categories. The experience is characterized by involuntariness—you cannot choose to see the mush again—and felt objectivity, where the new structure feels discovered, not invented. However, it relies on maintained neural efficiency, which explains why cognitive load or fatigue can temporarily collapse the expertise back into undifferentiated noise. It is distinct from belief because it persists even when you know you're being tricked, and distinct from simple attention because features remain salient even when you aren't actively looking. It is the sensory system becoming a better instrument, not the mind becoming a better judge.

  Boundary cases
  1. Seeing a face in a cloud is pareidolia, not this, because it vanishes when you stop imagining it.
  2. Knowing a wine is expensive and tasting it better is cognitive penetration, not this, because the change relies on belief.
  3. Learning to read music and seeing notes instead of dots is this, because the symbols become perceptual units.
  4. Wearing inverted goggles and adapting is perceptual learning, but this is motor-sensory recalibration, not structural differentiation.
  5. A radiologist missing a tumor due to fatigue is a failure of this, because the structure reverted to mush under load.
