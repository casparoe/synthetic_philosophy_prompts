prompt: |-
  I am the policy-integrity officer at a state benefits agency. Our manual runs to roughly 240 rules and is being encoded into an automated decision engine, and we have a recurring problem that neither the analysts nor the engine's authors can handle: rules that refer to themselves, or to one another in a loop. A rule may refer to facts settled outside the manual (filing dates, amounts, whether a form was submitted), to whether another rule is in force, and to whether another rule applies to a given case — and sometimes, directly or through a chain, to its own applicability. Twice in the past year we have adopted a rule whose applicability no one could settle by reading it, and both times it surfaced at a hearing. Amendments are adopted quarterly, and each cycle turns up a few more.

  Write the procedure our analysts should follow. It will be run at two points: when a rule is drafted or amended, and when the engine flags an existing rule as unsettled. The person running it is a policy analyst with no training in logic, working under a deadline of about an hour per rule, whose output goes into a worksheet that the general counsel's office reviews and that the engine consumes directly. The manual itself must never cite a philosopher; the checklist has to stand on its own.

  Specifically:

  1. Give a numbered procedure, in order, saying at each step what counts as a sufficient answer and what to do when no sufficient answer is available. The first step should say how the analyst converts the as-adopted English of a rule into the dependency structure the rest of the procedure needs, and what to do with the drafting ambiguities that will not resolve.

  2. Fix a closed vocabulary of at most six status labels, each with a one-line definition and a prescribed downstream action (enforce; enforce with a stated default; suspend; return to the drafting committee; escalate). No free text in the label field.

  3. Ground the procedure. State plainly which machinery you are using — for instance, building up from the settled facts until nothing further changes; treating no-stable-answer as a third status alongside applies and does-not-apply; permitting some rules to be both; or holding that a rule's status is fixed by an ongoing process of revision rather than by any single stable assignment — and say why that choice is defensible for an administrative manual rather than a logic seminar. Where a verdict would come out differently under the main alternative, say so and tag it [contested].

  4. Address whether these difficulties arise for rules at all, given that rules prescribe rather than describe. If using any of this material requires translating "rule R applies to case C" into something truth-apt, say how you do the translation and what it costs.

  5. Say how the procedure behaves when the manual is amended: whether a label can flip, what happens to actions already taken under the old label, and whether an ungrounded rule can be made grounded by later drafting.

  Then run the procedure on the following as-adopted rules, giving the label, the action, and your reasoning:

  - R3: "A claim is denied if it is filed more than thirty days after the notice is mailed." (Assume the facts of a specific case are settled.)
  - R14: "This rule governs every rule in this manual that does not govern itself." (This was the centerpiece of the last amendment; the drafting committee regards it as the clause that keeps the manual tidy.)
  - R22: "This rule is in force."
  - R30: "This rule governs every rule whose applicability this manual does not determine."
  - R5: "Rule 5 governs every matter governed by Rule 6." Together with R6: "Rule 6 governs every matter governed by Rule 5."

  Present the worked cases as a table with columns for the rule, the label, the action, whether the verdict rests on the text of the rule or on your theoretical choice, and whether the verdict is contested. Include at least one case where the procedure returns an answer the drafting committee will not want, and say plainly that it does.

  Close with a section on where the procedure cannot decide and a person must: the trigger, who that person is, what they are being asked to decide, and whether the question before them is one of fact or one of policy. Include the points where the procedure will misfire and why.

  Throughout, keep separate what is settled among people who work on truth and self-reference from what is genuinely contested, and do not present a contested position as the consensus.

  End with a single sentence beginning "Summary:" that states what the procedure is for and the single largest limitation on it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Policy-Integrity Officer at a state benefits agency.
      *   **Context:** 240 rules in a manual being encoded into an automated decision engine.
      *   **Problem:** Self-referential or circular rules (logical loops) causing unsettled applicability, surfacing at hearings.
      *   **Task:** Write a procedure for policy analysts (no logic training, 1-hour deadline) to handle these rules during drafting/amendment or when flagged by the engine.
      *   **Constraints:**
          1.  Numbered procedure (conversion to dependency structure, handling ambiguity).
          2.  Closed vocabulary (max 6 status labels + definition + action).
          3.  Ground the procedure (explain the underlying logic machinery, why it fits admin law vs. logic seminar, note contested alternatives).
          4.  Address the "rules prescribe vs. describe" issue (truth-aptness).
          5.  Address amendment behavior (label flipping, retroactivity, grounding via later drafting).
          6.  Run the procedure on 5 specific rules (R3, R14, R22, R30, R5/R6) in a table.
          7.  Include a case where the procedure returns an unwanted answer.
          8.  Close with a section on human intervention (trigger, who, what, fact vs. policy, misfire points).
          9.  Distinguish settled logic concepts from contested ones.
          10. End with a specific "Summary:" sentence.
      *   **Tone:** Administrative, precise, actionable, avoiding philosophical jargon in the manual itself (but explaining it in the grounding section).

  2.  **Deconstruct the Logic Problem:**

      *   The core issue is *self-reference* and *circular dependency* in a regulatory context.
      *   In logic, this leads to paradoxes (e.g., Liar Paradox, Russell's Paradox).
      *   In admin law, rules need to be *determinate* to be enforceable. If a rule's applicability cannot be determined, it violates due process (fair notice).
      *   *Constraint:* Analysts have no logic training. The procedure must be algorithmic but simple.
      *   *Constraint:* The engine needs a binary or tri-state input to function.
      *   *Strategy:* Use a "Fixed-Point Iteration" approach (common in computer science/logic programming) but simplified. Try to assign truth values (Applies/Does Not Apply). If it oscillates or stalls, mark as Unsettled.
      *   *Truth-Aptness:* Rules aren't true/false, they are valid/invalid or applicable/not applicable. We need to translate "Rule R applies" to a proposition that can be evaluated.

  3.  **Drafting the Procedure (Step 1):**

      *   *Goal:* Convert English to dependency structure.
      *   *Step 1:* Map dependencies. Identify inputs (facts) vs. internal references (other rules).
      *   *Ambiguity:* If English is vague, mark as "Drafting Ambiguity" and pause.
      *   *Step 2:* Trace the chain.
      *   *Step 3:* Check for loops.
      *   *Step 4:* Assign status based on the vocabulary.

  4.  **Developing the Vocabulary (Step 2):**

      *   Need max 6 labels.
      *   Need actions: Enforce, Enforce w/ Default, Suspend, Return, Escalate.
      *   *Proposed Labels:*
          1.  **DETERMINATE-TRUE** (Applies) -> Enforce.
          2.  **DETERMINATE-FALSE** (Does Not Apply) -> Enforce (as negative).
          3.  **DEFAULT-APPLIED** (Loop resolved by policy choice) -> Enforce with stated default.
          4.  **UNSETTLED-LOOP** (Circular, no resolution) -> Suspend.
          5.  **DRAFT-ERROR** (Ambiguous text) -> Return to drafting committee.
          6.  **EXTERNAL-DEPENDENT** (Needs outside fact not in evidence) -> Escalate (or Suspend until fact found). Let's refine this to fit the "logic" focus. Let's stick to the logic status.
          *   *Refined List:*
              1.  **ACTIVE** (Applies) -> Enforce.
              2.  **INACTIVE** (Does Not Apply) -> Enforce (denial/closure).
              3.  **STIPULATED** (Loop broken by policy fiat) -> Enforce with a stated default.
              4.  **VOID-LOOP** (Unresolvable circularity) -> Suspend.
              5.  **AMBIGUOUS** (Textual uncertainty) -> Return to the drafting committee.
              6.  **REVIEW-REQUIRED** (Complex dependency needing counsel) -> Escalate.

  5.  **Grounding the Procedure (Step 3):**

      *   *Machinery:* Kripke's Theory of Truth (Groundedness) / Fixed-Point Semantics.
      *   *Why:* It distinguishes between rules that can be evaluated based on facts (grounded) and those that depend on their own output (ungrounded).
      *   *Admin Law fit:* Due process requires notice. If a rule is ungrounded, no notice exists.
      *   *Contested:* Some might argue for "Paraconsistent Logic" (allowing contradictions). We reject this for admin law (cannot enforce contradictory rules).
      *   *Translation:* "Rule R applies" = "The conditions for R's enforcement are met."

  6.  **Addressing "Prescribe vs. Describe" (Step 4):**

      *   Rules are imperatives. To evaluate them logically, we treat "Rule R applies" as a proposition: "The conditions triggering Rule R's mandate are satisfied."
      *   *Cost:* We lose the normative force in the analysis, treating validity as a factual state.

  7.  **Amendment Behavior (Step 5):**

      *   Labels can flip if dependencies change.
      *   Actions taken under old labels: Generally prospective, but if a rule was VOID-LOOP, past actions might be voidable (legal risk).
      *   Ungrounded to Grounded: Yes, if a later rule breaks the cycle.

  8.  **Running the Procedure on the Cases:**

      *   *R3:* "Denied if filed > 30 days." Depends on facts (dates). No self-reference. -> **ACTIVE/INACTIVE** (depending on facts). Let's assume facts settle it. -> **ACTIVE** (if late).
      *   *R14:* "Governs every rule... that does not govern itself." (Russell's Paradox). If R14 governs itself, it doesn't. If it doesn't, it does. -> **VOID-LOOP**.
      *   *R22:* "This rule is in force." Self-referential but not paradoxical. It asserts its own validity. -> **STIPULATED** (Needs policy fiat to be useful, otherwise tautological). Or **ACTIVE**. Actually, without external conditions, it's vacuous. But logically consistent. Let's call it **STIPULATED** because it requires an external decision to *make* it in force, it can't do it itself.
      *   *R30:* "Governs every rule whose applicability this manual does not determine." (Gödelian/Incomplete). If manual doesn't determine R30, R30 governs it. If R30 governs it, manual determines it. -> **VOID-LOOP**.
      *   *R5/R6:* Mutual recursion. R5 depends on R6, R6 depends on R5. No base case. -> **VOID-LOOP**.
      *   *Unwanted Answer:* R14 is the "centerpiece" for tidiness. The procedure will kill it.

  9.  **Human Intervention Section:**

      *   Trigger: **VOID-LOOP** or **AMBIGUOUS**.
      *   Who: General Counsel + Drafting Committee.
      *   What: Policy choice to break the loop or rewrite.
      *   Fact vs. Policy: Policy (how to resolve the logic), Fact (underlying case data).
      *   Misfire: When a rule *looks* circular but relies on a temporal sequence not captured in the static analysis.

  10. **Refining and Formatting:**

      *   Check constraints: 6 labels max? Yes. No philosophy in manual? Yes (keep that in the "Grounding" section). 1-hour limit? Procedure must be quick.
      *   Table format for cases.
      *   Summary sentence at the very end.
      *   Ensure distinction between settled logic (paradoxes are undecidable) and contested (how to handle them administratively).

  11. **Self-Correction/Review during drafting:**
      *   *Critique:* Is "STIPULATED" clear?
      *   *Fix:* Define it as "Policy fiat required to break loop."
      *   *Critique:* R22 "This rule is in force." Is that a loop?
      *   *Analysis:* It's a self-assertion. In logic, $P \iff P$ is valid. But in admin law, a rule cannot bootstrap its own authority. It needs statutory authority. However, within the *manual's* logic, it's a grounded fixed point (True). But it provides no conditions for application. It's effectively a "Always On" switch if accepted. I will label it **STIPULATED** because the engine can't derive *why* it's in force, it just has to be told.
      *   *Critique:* R14 is Russell's Paradox. Definitely **VOID-LOOP**.
      *   *Critique:* R30 is similar to the Liar/Gödel. **VOID-LOOP**.
      *   *Critique:* R5/R6 is a circular dependency without a base case. **VOID-LOOP**.
      *   *Grounding:* Need to be careful not to sound like a philosophy paper in the procedure section. Keep the philosophy in Section 3.
      *   *Constraint Check:* "The manual itself must never cite a philosopher." -> Ensure the procedure text is clean.
      *   *Constraint Check:* "End with a single sentence beginning 'Summary:'".

  12. **Final Polish:** Check tone. Ensure the "Unwanted Answer" is explicit. Ensure the "Contested" tags are used where logical alternatives exist (e.g., paraconsistency).

      *(Self-Correction on R22)*: If R22 says "This rule is in force," and the engine asks "Is R22 in force?", the answer is "Yes" by definition. It's a tautology. It doesn't create a paradox, but it doesn't depend on facts. It's a "Policy Constant." I will label it **STIPULATED** because it requires an external assertion of authority to be meaningful, even if logically consistent.
      *(Self-Correction on R3)*: R3 depends on facts. If facts are settled (as prompt says "Assume the facts of a specific case are settled"), then it is **ACTIVE** or **INACTIVE**. I will treat it as **ACTIVE** for the sake of the example (assuming late filing).

      *(Refining the Vocabulary)*:
      1.  **ENFORCEABLE** (Conditions met) -> Enforce.
      2.  **NOT-TRIGGERED** (Conditions not met) -> Enforce (as negative).
      3.  **POLICY-FIXED** (Loop broken by fiat) -> Enforce with a stated default.
      4.  **LOGIC-VOID** (Unresolvable paradox) -> Suspend.
      5.  **TEXT-AMBIGUOUS** (Unclear meaning) -> Return to the drafting committee.
      6.  **COUNSEL-REVIEW** (High risk/Novel) -> Escalate.

      *Wait, I need to make sure the labels fit the "status" of the rule's applicability.*
      Let's align with the prompt's request for "status labels".
      1.  **APPLIES**
      2.  **DOES-NOT-APPLY**
      3.  **DEFAULT-APPLIED**
      4.  **SUSPENDED**
      5.  **RETURN-DRAFTING**
      6.  **ESCALATE-COUNSEL**

      *Wait, prompt says "prescribed downstream action (enforce; enforce with a stated default; suspend; return to the drafting committee; escalate)".*
      Okay, I will map labels to these actions.

      *Grounding Section:* Must mention Kripke/Groundness without citing them in the procedure.
      *Prescribe/Describe:* Must address the translation cost.

      *Let's write.*
answer: |-
  ### Procedure for Rule Dependency and Applicability Analysis

  **Purpose:** To determine whether a rule can be executed by the automated decision engine without logical error, circular dependency, or indeterminacy.
  **Operator:** Policy Analyst.
  **Time Limit:** 60 minutes per rule.

  #### 1. Dependency Mapping and Resolution Procedure

  1.  **Isolate Conditions:** Rewrite the rule as a list of conditions required for the rule to take effect.
      *   *Sufficient Answer:* A list where every item is either (a) a settled fact (date, amount, form ID) or (b) a reference to another specific rule number.
      *   *Insufficient Answer:* Any condition relying on vague terms (e.g., "reasonable," "appropriate") or unnamed external processes.
      *   *Action:* If Insufficient, stop. Assign Label **TEXT-AMBIGUOUS**.

  2.  **Trace Dependencies:** For every condition referencing another rule, locate that rule and list its conditions. Continue tracing until you reach only settled facts or return to a rule already on your list.
      *   *Sufficient Answer:* A chain that ends in settled facts (Grounded) or a clear identification of a loop (e.g., R5 needs R6, R6 needs R5).
      *   *Insufficient Answer:* You cannot find the referenced rule, or the chain exceeds 20 links without resolution.
      *   *Action:* If Insufficient due to missing rule, Assign Label **ESCALATE-COUNSEL**. If chain too long, Assign Label **ESCALATE-COUNSEL**.

  3.  **Test for Loops:** Check if the chain returns to the original rule.
      *   *No Loop:* Proceed to Step 4.
      *   *Loop Detected:* Determine if the loop is "benign" (the rules agree) or "conflicted" (the rules contradict or rely on each other for existence).
      *   *Action:* If Conflicted Loop, Assign Label **SUSPENDED**. If Benign Loop (tautology), Proceed to Step 4.

  4.  **Evaluate Truth Value:** Based on the settled facts of the case, can the conditions be marked "Met" or "Not Met"?
      *   *Sufficient Answer:* All conditions are definitively Met or definitively Not Met.
      *   *Insufficient Answer:* The outcome depends on the rule's own output (e.g., "This rule applies if this rule applies").
      *   *Action:* If Met, Assign Label **APPLIES**. If Not Met, Assign Label **DOES-NOT-APPLY**. If Insufficient, Assign Label **LOGIC-VOID**.

  5.  **Policy Override Check:** If Label is **LOGIC-VOID** or **SUSPENDED**, check if the Drafting Committee has issued a written policy directive forcing a specific outcome for this rule.
      *   *Sufficient Answer:* A signed memo stating "Treat Rule X as [Applies/Does Not Apply] despite logical status."
      *   *Insufficient Answer:* No memo or verbal instruction only.
      *   *Action:* If Sufficient, Assign Label **DEFAULT-APPLIED**. If Insufficient, Assign Label **RETURN-DRAFTING**.

  #### 2. Status Vocabulary and Downstream Actions

  | Label | Definition | Downstream Action |
  | :--- | :--- | :--- |
  | **APPLIES** | Conditions are met based on settled facts and grounded logic. | Enforce |
  | **DOES-NOT-APPLY** | Conditions are not met based on settled facts and grounded logic. | Enforce |
  | **DEFAULT-APPLIED** | Logic is circular/void, but policy fiat dictates an outcome. | Enforce with a stated default |
  | **SUSPENDED** | Logic is circular/void with no policy fiat; engine cannot compute. | Suspend |
  | **RETURN-DRAFTING** | Text is ambiguous or creates unresolvable paradoxes needing rewrite. | Return to the drafting committee |
  | **ESCALATE-COUNSEL** | Dependency chain is broken, missing, or too complex for analyst. | Escalate |

  #### 3. Grounding the Procedure

  This procedure uses **Fixed-Point Semantics** (specifically, a groundedness test). We treat the manual as a system of equations. A rule is "grounded" if its applicability can be calculated starting from external facts (dates, amounts) without needing to know the rule's own output first.

  *   **Why this machinery:** Administrative law requires "fair notice." A citizen must be able to know if a rule applies to them before a decision is made. If a rule's applicability depends on its own applicability (ungrounded), no notice is possible. This is distinct from a logic seminar where paradoxes are theoretical curiosities; here, they are due process violations.
  *   **Alternative View [Contested]:** Some logicians argue for **Paraconsistent Logic**, which allows contradictions to exist without crashing the system (e.g., a rule could both apply and not apply). We reject this for the decision engine. The engine requires a single binary output to issue a benefit or denial. Adopting paraconsistency would require a complete rebuild of the engine and legal acceptance of contradictory agency orders.
  *   **Third Status:** We treat "Unsettled" (SUSPENDED/LOGIC-VOID) as a distinct status alongside "Applies" and "Does Not Apply." This acknowledges that some rules are structurally defective rather than factually inapplicable.

  #### 4. Rules vs. Descriptions (Truth-Aptness)

  Rules prescribe conduct; they are not naturally true or false. To analyze them logically, we translate the imperative ("Deny the claim") into a descriptive proposition ("The conditions for denying the claim are satisfied").
  *   **Translation:** "Rule R applies to Case C" becomes "The factual predicates of Rule R are present in Case C."
  *   **Cost:** This translation ignores the *authority* of the rule. A rule might be logically consistent but legally ultra vires (beyond power). This procedure tests logical consistency only. Legal authority is assumed unless flagged for Counsel.

  #### 5. Amendment Behavior

  *   **Label Flipping:** A label can flip from **APPLIES** to **SUSPENDED** if a new rule creates a dependency loop with an existing rule.
  *   **Retroactivity:** Actions taken under an old label (e.g., **APPLIES**) remain valid for closed cases unless General Counsel declares the rule void ab initio. Open cases must be re-evaluated.
  *   **Grounding via Drafting:** An ungrounded rule (e.g., **LOGIC-VOID**) can become grounded if a later amendment adds a factual condition (e.g., "Rule 22 is in force *if* the Director signs it"). The procedure must be re-run on the amended text.

  ***

  ### Worked Cases

  | Rule | Label | Action | Rests On | Contested? |
  | :--- | :--- | :--- | :--- | :--- |
  | **R3** | **APPLIES** | Enforce | Text of Rule (Facts Settled) | No |
  | **R14** | **RETURN-DRAFTING** | Return to the drafting committee | Theoretical Choice (Russell's Paradox) | No |
  | **R22** | **DEFAULT-APPLIED** | Enforce with a stated default | Theoretical Choice (Tautology) | Yes [Contested] |
  | **R30** | **SUSPENDED** | Suspend | Theoretical Choice (Gödelian Incompleteness) | No |
  | **R5/R6** | **SUSPENDED** | Suspend | Text of Rule (Circular Dependency) | No |

  **Case Notes:**
  *   **R3:** Depends only on dates (external facts). The chain terminates immediately.
  *   **R14:** "Governs every rule... that does not govern itself." If R14 governs itself, it meets the condition for *not* governing itself. If it does not, it meets the condition for governing. This is a paradox. The Drafting Committee wants this for "tidiness," but the procedure identifies it as structurally broken. **This is the unwanted answer.**
  *   **R22:** "This rule is in force." Logically, $P \iff P$ is valid (tautology). However, it provides no factual condition for the engine to check. It cannot be "calculated," only accepted. We mark it **DEFAULT-APPLIED** requiring a policy fiat that it is always on, rather than **APPLIES**, because there is no triggering fact.
  *   **R30:** "Governs every rule whose applicability this manual does not determine." If the manual does not determine R30, R30 applies. If R30 applies, the manual determines it. This creates an oscillation.
  *   **R5/R6:** Mutual recursion with no base case (no external fact). The engine will infinite loop.

  ***

  ### Human Intervention Protocol

  **Trigger:** The procedure assigns **SUSPENDED**, **RETURN-DRAFTING**, or **ESCALATE-COUNSEL**.

  **Who:** The General Counsel (legal authority) and the Chair of the Drafting Committee (policy authority).

  **Decision Required:**
  1.  **For SUSPENDED/RETURN-DRAFTING:** Is the logical defect acceptable risk, or must the text be rewritten? (Question of Policy).
  2.  **For ESCALATE-COUNSEL:** Is the missing dependency a legal authority issue or a clerical error? (Question of Fact/Policy).

  **Misfire Points:**
  *   **Temporal Loops:** The procedure may flag a rule as **SUSPENDED** if Rule A depends on Rule B's *past* application, but the static analysis sees only "Rule B." This misfire occurs because the procedure treats the manual as a timeless logical system rather than a temporal process.
  *   **Discretionary Terms:** The procedure treats terms like "reasonable" as **TEXT-AMBIGUOUS**. Legal precedent may have settled these terms, but the analyst cannot verify this within one hour. This forces Counsel to review settled law unnecessarily.

  **Settled vs. Contested:**
  *   **Settled:** Paradoxical rules (R14) cannot be computed by a binary engine.
  *   **Contested:** Whether a tautological rule (R22) should be **APPLIES** (always true) or **DEFAULT-APPLIED** (requires fiat). We choose the latter to ensure human accountability for self-validating rules.

  Summary: This procedure identifies logical defects in regulatory text to prevent automated enforcement of paradoxical rules, but it cannot resolve policy choices required to fix them.
