      *Refining for clarity and punch:* Ensure the distinction between "Achievement" and "Relational/Inherent" is clear throughout. The prompt calls the second one "relations... built or damaged." I should stick to that phrasing or clearly map mine to it. I used "Inherent/Relational" vs "Achievement". I will align closer to the prompt's phrasing.

