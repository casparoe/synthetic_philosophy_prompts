  However, the procedure contradicts this relational view by importing the achievement model. Amnesty was not automatic; it was conditional on full disclosure. This suggests civic standing is something you must *earn* back through truth-telling. The TRC hedges: you are human by birth (Relational), but you are only a *restored* member of the community through action (Achievement). This creates a tension. If humanity is inextricably bound, why condition restoration on speech? The procedure implies the bond was severable, requiring repair work that looks suspiciously like a transaction.

  This tension breaks when examining the "we." In a society of informants, the relational fabric was torn. The TRC assumed a latent community could be reactivated through testimony. But victims' dissatisfaction regarding reparations is evidence that the Relational View collapses without material justice. If personhood is held up by relations, and those relations remain exploitative (no reparations), then personhood remains damaged. The Commission treated truth as sufficient for restoration, but victims experienced the lack of compensation as a continued denial of their worth. Theoretically, this suggests Ubuntu cannot be purely spiritual; it requires material grounding to sustain the "person."

  Regarding perpetrators: If personhood is achieved, they are the least person-like. Bringing them back in seems to break the achievement view. It doesn't break it; it shows the view needs the relational view bolted on. You need the relational view to justify listening to them (inherent worth), and the achievement view to demand they speak (restorative action). Without the relational view, you have vengeance; without the achievement view, you have impunity.

  Flipping the lens: Does this relational ethic protect the individual, or swallow them? Critics argue Ubuntu prioritizes community harmony over individual rights. Yet, the Constitutional Court cited Ubuntu in *State v. Makwanyane* to strike down the death penalty, arguing that even the worst criminal retains a right to life inherent in the community's humanity. This isn't borrowing external liberalism; it's the Relational View working correctly. If my humanity is bound to the killer's, executing him damages me. However, this protection is fragile. It protects the individual only insofar as the individual is a node in the network. When the TRC failed on reparations, it showed that when the "community" interest (stability/amnesty) clashes with the individual's need (justice/payment), the theory can still swallow the individual. The *Makwanyane* ruling worked because it was legal principle; the TRC failed because it was political practice.

