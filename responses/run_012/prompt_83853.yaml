      *Final Polish:* Ensure the transition between TRC analyzing Theory and Theory analyzing TRC is smooth.

      (Self-Correction during drafting): Make sure I explicitly answer "Does conditional amnesty come out as relational justice or as a betrayal of it?" -> It comes out as attempted relational justice that betrayed the theory by ignoring material relations.

      (Self-Correction on Court): Make sure to answer "theory being true to itself or borrowing something?" -> It's the theory being true to itself (interdependence protects life), but vulnerable in practice.

      Let's write.

