  I'm trying to get my head around Keynes's views on probability and uncertainty, and so far I've been going off a popular econ book (and a podcast that basically repeated it). Here's roughly how the book puts it:

  "Keynes was the first economist to take uncertainty seriously. In his Treatise on Probability he argued that probability isn't something out there in the world — it's just a measure of how confident a person happens to feel, so two people can assign different probabilities to the same event and neither is wrong. Some events are so uncertain that you can't assign them any number at all, and in those cases rational calculation breaks down and you have to fall back on gut feeling, which is why Keynes later wrote about 'animal spirits' and why he saw markets as driven by psychology rather than reason. So he's the grandfather of behavorial economics, and his basically subjective view of probability won the day once Ramsey and Savage showed there's no such thing as objective probability."

  I don't realy know enough to tell what to trust here. Could you act like an expert on the history of probability and the philosophy of economics and walk me through it sentence by sentence? For each bit, I want to know what a Keynes specialist would nod along with, what they'd wince at as a simplification or a subtle misreading, and what's just wrong. I have a vague feeling that the "probability is just how confident you feel" part might be off, since I half-remember Keynes being after something more objective, but I couldn't defend that. Also, someone once mentioned Keynes's "weight of the argument" or "weight of evidence" to me and the book never brings it up — is that a real part of his view, and does leaving it out change the picture? Finally, does the book's closing claim actually follow from anything true in the summary, or is it pulling a fast one? Take your time, think it through carefully before you start writing, and keep the whole thing under 700 words.
