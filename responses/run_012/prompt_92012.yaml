      *Wait, the "Dreaded Question"* needs to be separate at the end. I need to identify one specific question the user hasn't solved. I'll suggest the "Why not just deny the sequence exists?" or "How do you choose between A and Z?" Let's go with "How do you choose between A and Z?" because if A is not better than Z, and Z is not better than A (implied by intransitivity break?), are they equal? If equal, why prefer the chain?

