      *Let's finalize the "Dreaded Question".* The hardest question for spectrum intransitivity is usually: "If $A_1 \succ A_2 \succ \dots \succ A_n$, and you deny $A_1 \succ A_n$, do you affirm $A_n \succeq A_1$? If so, you have a cycle (since $A_1 \succ A_2 \dots \succ A_n \succeq A_1$). If not, what is the relation?"
      Actually, the *really* hard one is: "If you can't be money-pumped, you must have a stopping rule. What is the stopping rule, and isn't *that* arbitrary?"
      Let's go with the **Money Pump Defense Vulnerability**. Most intransitivists say "I won't trade." The DTs will say "Then you violate dominance." The dreaded question is: "What is the *principle* that stops you from trading, if not transitivity?"

