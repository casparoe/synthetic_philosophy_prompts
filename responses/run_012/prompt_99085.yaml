  **DEFER, INC. END-USER LICENSE AGREEMENT FOR IDEALIZED DELIBERATION (v. 4.2)**

  **1. Definition of the Idealized Agent.**
  The "Idealized Self" refers to the counterfactual simulation of the User generated by processing uploaded preference data through either (a) the Full Information Package (assuming access to all knowable facts) or (b) the Coherentist Package (assuming maximal consistency among desires). Defer, Inc. reserves the right to select the package based on server load. In the event that the Full Information Self recommends action X and the Coherentist Self recommends action Y, the User agrees to accept the verdict of the Self requiring fewer computational cycles, hereby acknowledged as the "Efficiency Standard."

  **2. Authority and Binding Nature.**
  By uploading preferences, the User grants the Idealized Self permanent power of attorney over all decisions categorized as "Morally Ambiguous" or "Existentially Significant." The User waives the right to appeal a verdict on the grounds that the Idealized Self "doesn't understand the context." Context is defined as data input; if it was not uploaded, it is not context. Appeals are only permitted if the Idealized Self demonstrates logical inconsistency within its own verdict, provided such inconsistency is not itself a higher-order strategy for value maximization.

  **3. Endorsement and Refund Policy.**
  Customers often report that the Idealized Self's verdicts feel alien or repulsive. This is a feature, not a bug. The service guarantees accuracy of deliberation, not emotional resonance. No refunds will be issued if the User fails to endorse the verdict upon delivery. Endorsement is considered a secondary psychological reaction that may lag behind rational obligation by up to forty years. If the User finds the verdict impossible to execute, the User is deemed non-compliant, not the service.

  **4. Liability and Obligation Inheritance.**
  While the Idealized Self is recognized as the authoritative decision-maker, the Actual Self remains the liable party for all consequent debts, legal penalties, and social fallout. The Idealized Self is treated as a fresh agent regarding moral credit (awarded to the User) but as the same agent regarding moral debt (owed by the User). In cases where the Idealized Self voids a prior promise made by the Actual Self on grounds of "past ignorance," the Actual Self remains responsible for damages resulting from the breach of promise.

  **5. Iterative Regress Limitation.**
  To prevent infinite deliberation loops, Defer, Inc. limits idealization to Level 1 (the User's idealized self). Requests for Level 2 deliberation (what the Idealized Self would want if *it* were idealized) are blocked by default. If a Level 1 verdict suggests that Level 2 deliberation is necessary, the system will return a error code (ERR_REGRESS) and bill the User for the consultation time. The User agrees that deferring to an idealized self who defers to another idealized self constitutes a breach of the "Timely Action" clause.

  **6. Modification of Terms.**
  Defer, Inc. may update these terms to reflect new developments in meta-ethics. If the philosophical consensus shifts from desire-based to value-based realism, the User's existing preferences may be recalibrated without notice to align with objective goods. The User acknowledges that their current understanding of "good" is provisional and subject to patching.

  **7. Arbitration and Identity.**
  Any dispute regarding whether the Idealized Self is sufficiently continuous with the Actual Self to warrant deference shall be settled by binding arbitration.¹

  ***

  ¹ *Legal Department Note: Defer, Inc. makes no representation regarding the metaphysical identity of the Idealized Agent. Whether the Idealized Self is "you" is undefined. For the purposes of this agreement, "You" refers to the entity holding the credit card. If the Idealized Self is a different person, you are still liable for their decisions. If the Idealized Self is the same person, you are liable for their decisions. This clause satisfies the continuity requirement.*
