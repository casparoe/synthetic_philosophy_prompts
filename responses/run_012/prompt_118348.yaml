      *   *Environment:* Organisms have a fixed environment (mostly). Empires shape their environment.
      *   *The "200 Year" Myth:* This is the weakest link. Rome (500+ years Republic + 500+ years Empire). Britain (300+ years). China (dynasties vary wildly). The sample size is small and noisy.

  5.  **Evaluating the Conclusion:**
