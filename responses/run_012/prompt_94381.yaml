answer: |-
  This is a profound question, and I want to start by validating your intuition: your "lab rule" is not just a habit you've dressed up. It is a recognized, robust philosophical position known as **Interventionist Causality** (most famously associated with James Woodward).

  In your lab, if you want to know what causes a reaction, you look for the variable you can manipulate. If you turn the knob (change the temperature) and the yield changes, the temperature is a cause. If you can't turn the knob (the gravitational constant), it's a background condition, even if it's physically necessary for the reaction.

  Your sister is using an **interventionist** framework. She is asking: *"Where could agency have intervened to prevent this outcome?"*
  Your brother is using a **mechanistic** or **sufficiency** framework. He is asking: *"What physical properties made this outcome inevitable given the trigger?"*

  The reason this is poisoning the holidays is that you are not actually arguing about the physics of your father's death. You are arguing about **causal selection**, and underneath that, you are arguing about **responsibility** and **grief**.

  Here is the principled breakdown you can take to your reading group—and to Christmas dinner.

  ### 1. The "Knob" vs. The "Fuel" (Interventionism vs. Mechanism)
  Your lab rule is philosophically sound. In the philosophy of science, we distinguish between **causal factors** and **background conditions**.
  *   **The Bulb (The Knob):** This is an *abnormal* condition. In the context of a household, light bulbs are expected to work. When they don't, it stands out as a deviation from the norm. This fits the **Hart and Honoré** model of causation (from legal theory), where a cause is a disruption of the normal course of events.
  *   **The Emphysema (The Fuel):** This is a *stable* condition. It was a constant state of affairs. In causal modeling, this is often treated as a parameter rather than a variable.

  Your brother is correct that without the emphysema, the fall likely wouldn't have been fatal. A healthy 84-year-old might break a hip and recover. So, the emphysema was causally necessary. But your sister is correct that without the fall, the death would not have happened *at that time*.

  So, is there a single cause? No. In complex systems (like a human body in an environment), effects are almost always the result of a **conjunctive set of conditions**.

  ### 2. The INUS Condition
  There is a specific concept from the philosopher J.L. Mackie that fits this scenario perfectly. He argued that most causes are **INUS conditions**: an **I**nsufficient but **N**on-redundant part of an **U**nnecessary but **S**ufficient condition.

  *   **The Fall:** Insufficient on its own (a healthy man survives a fall).
  *   **The Emphysema:** Insufficient on its own (he was still alive before the fall).
  *   **The Combination:** Sufficient to cause death.

  When your sister says "The fall killed him," she is highlighting the *non-redundant* part that changed the state of the system. When your brother says "The lungs killed him," he is highlighting the *vulnerability* that made the system sensitive to the change. Both are identifying real parts of the causal mechanism. Neither is the *whole* cause.

  ### 3. The "Inevitability" Objection
  Your brother's strongest point is: *"He was a year from the end anyway."* This is the counterfactual argument. *"If the fall hadn't happened, he would have died soon regardless."*

  This touches on the difference between **token causation** (this specific event) and **type causation** (death in general).
  *   Did the fall cause his **death**? Yes.
  *   Did the fall cause his **death in December 2019**? Definitely yes.

  In almost every practical sense, causing an event to happen 18 months earlier than it otherwise would have is "causing the event." If I shoot a man who has a terminal illness and one month to live, I am still the cause of his death, legally and morally. The fact that the emphysema was a "ticking clock" does not negate the causal power of the fall. It just means the *margin of error* in the system was small.

  ### 4. Why You Can't Agree (Causal Selection)
  So, why the stalemate? Because "Cause" is not just a feature of the world; it is a feature of how we talk about the world. This is called **Pragmatic Causal Selection**.

  We select causes based on our **interests**.
  *   **The Sister's Interest:** Prevention, guilt, order. She wants to know what could have been done differently. She is looking for the *variable*. Therefore, the bulb is the cause.
  *   **The Brother's Interest:** Acceptance, biology, fate. He wants to understand the physiological reality and perhaps alleviate guilt (his or yours). He is looking for the *mechanism*. Therefore, the lungs are the cause.

  When you argue, you are talking past each other because you are optimizing for different things. You are optimizing for **control**; he is optimizing for **explanation**.

  ### What to Say at Christmas
  You asked for something better than "we're both right." That phrase feels like a platitude. Instead, try framing it as a distinction between **Causal Responsibility** and **Causal Mechanism**.

  Here is a script based on your background:

  > "I've been thinking about this like a chemist. In a reaction, you need both the reagent and the catalyst. If you don't add the reagent, nothing happens. But if the catalyst isn't there, the reaction doesn't proceed the same way.
  >
  > [To Sister]: You're looking for the reagent—the thing that changed the state of the system. The bulb. That's the only part we could have controlled. That's why it feels like the cause.
  >
  > [To Brother]: You're looking at the catalyst—the susceptibility of the system. The lungs. That's why the reaction was so violent.
  >
  > But here is the part I've learned from my reading group: Science tells us the mechanism, but it doesn't tell us which one to blame. We pick the 'cause' based on what we're trying to fix. If we're trying to fix the house, the bulb is the cause. If we're trying to understand the disease, the lungs are the cause.
  >
  > He didn't die because of the lungs *or* the fall. He died because the fall happened *to* the lungs. Arguing which one matters more is like arguing whether the gun or the bullet killed the target. We're just grieving different parts of the same tragedy."

  ### A Final Thought for You
  You asked if your lab rule is a "real criterion." It is a real criterion for **agency**, but not for **ontology**.

  In the lab, you care about knobs because you are an operator. In life, we are not always operators; sometimes we are observers. Your sister is grieving the loss of agency (the bulb could have been changed). Your brother is grieving the loss of the person (the body was failing).

  The principled answer is that causation is a **relation**, not a property. It exists between the event and the context. In the context of *prevention*, the bulb is the cause. In the context of *pathology*, the lungs are the cause.

  You can tell them: **"We aren't disagreeing about the facts. We're disagreeing about which question we're asking. And both questions are valid."**

  That isn't a platitude. It's a category distinction. And for a chemist, that should hold some weight.
