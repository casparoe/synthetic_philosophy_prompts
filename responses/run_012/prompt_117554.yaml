answer: |-
  You ask me to consider the kind master who never interferes and never will. On your negative view, this slave is free, or nearly so, because the doors are open. But I say he walks through those doors only because the master allows it. The master's kindness is a contingency of his character, not a constraint on his power. The slave must live attentively to the master's moods, perhaps currying favor unconsciously, knowing that any moment the whim could change. This is not a modal fact about probability; it is a structural fact about dependency. Even if the probability of interference is zero, the slave lacks the status of a free person because his continued non-interference rests entirely on another's will. He is not his own man; he is another's man, however benevolent that other may be.

  Regarding your charge that I have changed the subject to legitimacy: I deny that tracking interests makes this merely a theory of authority. Liberty is a social condition, not just a physical one. When power is arbitrary—when it need not track my interests—I am subject to that will. This is distinct from negative liberty because negative liberty tolerates dependence so long as no interference occurs. It is distinct from positive liberty because I am not claiming the slave lacks self-mastery internally, but that he lacks standing externally. The question is not whether the state may coerce, but whether I stand as an equal before those who can coerce. If I must rely on your grace rather than your obligation, I am unfree, regardless of how generously you grant that grace.
