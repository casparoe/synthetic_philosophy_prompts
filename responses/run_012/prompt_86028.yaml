answer: |-
  **JOINT STATEMENT OF POSITIONS ON WEAKNESS OF WILL**

  **Participants:**
  *   **Side A (Decision-Theoretic):** Weakness of will is modelled as dynamic inconsistency arising from time-discounting anomalies.
  *   **Side B (Action-Theoretic):** Weakness of will is akrasia, defined as acting against one's own better judgement at the time of action.

  ***

  ### 1. Agreed Claims

  Both parties accept the following claims regarding the phenomena, the evidence, and the limitations of their respective opposing frameworks:

  1.  **Phenomenological Reality:** Both sides agree that the core phenomenon to be explained is robust: agents frequently form intentions to perform a future action (e.g., diet, study, save money) and fail to execute them when the time comes, often expressing regret immediately thereafter.
  2.  **Preference Reversal:** Both sides accept the empirical evidence that humans (and non-human animals) display preference reversals over time. Specifically, agents prefer a larger-later reward over a smaller-sooner reward when both are distant, but reverse this preference as the smaller-sooner reward approaches immediacy.
  3.  **Commitment Seeking:** Both sides acknowledge that agents actively seek 'commitment devices' (e.g., locking away savings, blocking websites) to restrict their own future choice sets, and that this behaviour is inconsistent with standard exponential discounting models.
  4.  **Side A Concession:** Side A grants that the hyperbolic discounting framework is descriptive of *choice patterns* but is silent on the *normative authority* of an agent's prior plan. It accepts that its model cannot distinguish between a 'change of mind' and a 'failure of will' without importing external normative criteria.
  5.  **Side B Concession:** Side B grants that the discounting model successfully predicts the *timing* of akratic failures (i.e., failure is most likely when the temptation is immediate) and explains why commitment devices are effective structural solutions, even if it misdescribes the internal psychology.
  6.  **The Sophistication Paradox:** Both sides accept the formal result that a 'sophisticated' agent (one who knows they will succumb to present bias) may end up with a worse outcome than a 'naive' agent if commitment technology is unavailable, because the sophisticated agent anticipates their own failure and adjusts their current behaviour pessimistically.
  7.  **Verbal Disagreement:** Both parties acknowledge that a significant portion of the dispute is verbal. Side A uses 'preference' to mean 'revealed choice disposition', whereas Side B uses 'judgement' to mean 'all-things-considered evaluation' which may not align with choice. Consequently, when Side A says 'preference reversal', Side B hears 'change of judgement', which alters the moral status of the act.

  ***

  ### 2. Residual Disagreements

  The following table outlines the substantive disagreements remaining. Wording is preserved to reflect each side's theoretical commitments; no compromise language has been used.

  | Feature | Side A (Decision-Theoretic) | Side B (Action-Theoretic) |
  | :--- | :--- | :--- |
  | **Locus of Conflict** | The conflict is *diachronic*: it is a game between the agent at $t_1$ and the agent at $t_2$. | The conflict is *synchronic*: it is a tension within the agent at $t_2$ between judgement and desire. |
  | **Definition of Rationality** | Rationality is consistency of revealed preferences over time. Inconsistency implies a failure of maximisation given the discount function. | Rationality is acting in accordance with one's better judgement. Consistency over time is secondary to correctness at the moment of action. |
  | **The Nature of 'Better'** | 'Better' is defined by the agent's own utility function at the time of choice. If I choose the cake at $t_2$, the cake was (revealed) better for me at $t_2$. | 'Better' is defined by the agent's evaluative judgement, which holds authority over desire. I can choose the cake while judging the fruit to be better. |
  | **Explanation of Failure** | Failure is explained by a parameter ($\beta < 1$) causing the weight of immediate utility to spike disproportionately. | Failure is explained by a breakdown in the capacity of judgement to motivate action (a failure of practical rationality). |
  | **The Agent** | The agent is best modelled as a succession of temporal selves with partially conflicting utility functions. | The agent is a unified subject capable of self-governance; splitting the agent dissolves the responsibility required for akrasia. |

  ***

  ### 3. The Cruxes and Evidentiary Tests

  The following are the specific sub-questions where settling the matter would force at least one side to revise their position. For each crux, a concrete case is proposed, with pre-registered predictions from both sides.

  #### Crux 1: Preference Reversal vs. Irrationality
  **Question:** Does a preference reversal at the moment of action constitute irrationality, or merely a change in the agent's valuation?
  **Concrete Case:** *The 4pm Slump.* An agent plans at 9am to work until 5pm. At 4pm, they choose to leave early. They report at 4pm that they 'feel like' leaving is better than staying, but at 5pm they regret leaving.
  *   **Side A Prediction:** This is rational behaviour for the 4pm self given the discount function. The regret at 5pm is simply the 5pm self having a different utility function. There is no single 'irrationality', only a conflict of interests between time-slices.
  *   **Side B Prediction:** This is irrationality. The 4pm self holds the judgement (formed at 9am and still endorsed at 4pm upon reflection) that staying is best, but acts against it. The report that leaving 'feels better' conflates desire with judgement.
  *   **Condition for Shift:** If it can be shown that agents *never* report regret immediately after the reversal (only later), Side B's claim that the judgement persists *at the moment of action* is weakened. If agents report 'I know I shouldn't, but I want to' *during* the action, Side A's claim that choice reveals preference is weakened.

  #### Crux 2: Sophistication and Akrasia
  **Question:** Can a sophisticated agent (one who accurately predicts their own future bias) be akratic, or have they simply abandoned their better judgement?
  **Concrete Case:** *The Resigned Procrastinator.* An agent knows they will procrastinate tomorrow. They do not set a commitment device. Tomorrow, they procrastinate exactly as predicted.
  *   **Side A Prediction:** This is not weakness of will; it is a sub-game perfect equilibrium. The agent has optimised given their constraints. The 'better judgement' to work was abandoned at $t_1$ because it was recognised as infeasible.
  *   **Side B Prediction:** This is a distinct form of akrasia (akrasia of omission regarding commitment). The agent judges at $t_1$ that they ought to bind themselves, fails to do so, and thus is responsible for the $t_2$ failure. Sophistication does not excuse the failure to govern the future self.
  *   **Condition for Shift:** If sophisticated agents are shown to be *happier* or *more successful* than naive agents in the absence of commitment, Side B's claim that sophistication without commitment is a distinct failure of rationality is weakened. If sophisticated agents report higher levels of distress without better outcomes, Side A's claim that this is a stable equilibrium is challenged.

  #### Crux 3: The Multiple-Selves Problem
  **Question:** If the agent is a series of time-slices with conflicting preferences, who exactly is being weak-willed?
  **Concrete Case:** *The Ulysses Contract.* An agent binds themselves to the mast (literal or metaphorical) to prevent succumbing to temptation.
  *   **Side A Prediction:** The 'weak' self is the future time-slice. The 'strong' self is the past time-slice. Weakness of will is just the past self losing control over the future self's resources.
  *   **Side B Prediction:** There is only one agent. Weakness of will is the agent failing to integrate their temporal existence into a unified life. Binding oneself is an act of will, not a transfer of power between persons.
  *   **Condition for Shift:** If neuroeconomic evidence demonstrates that the 'planning' brain regions and 'impulsive' brain regions operate as functionally independent agents with no shared utility metric, Side A is vindicated. If evidence shows that the 'regret' signal activates the same neural substrate as the 'planning' signal, implying a unified evaluator, Side B is vindicated.

  ***

  ### 4. Note on Theoretical Silence

  Both parties agree to the following clarification regarding the limits of the Decision-Theoretic framework:

  The hyperbolic discounting model is **silent** on the distinction between *evaluating* an option as best and *choosing* it. In Side A's framework, 'value' is defined by choice. Therefore, the model cannot technically represent a state where $Value(A) > Value(B)$ but $Choice = B$. To model this, Side A must treat 'judgement' as a preference over a different object (e.g., a preference for self-concept) or admit it as an exogenous constraint. Side B insists this silence is not a mere omission but a category error that renders the model incapable of addressing the specific phenomenon of akrasia, which *is* that gap. Side A maintains that filling that gap with non-choice-based 'judgements' introduces unobservable variables that reduce predictive power.
