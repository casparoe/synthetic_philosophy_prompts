  Some background so you can aim at me: I'm a software engineer, no philosophy training at all, and my instinct is that this whole fanaticism thing is an artifact of pretending our brains run on exact real-number arithmetic. Everything we can actually compute is floating point. If a probability is 10^-(10^10), then in any calculation I actually perform it's just zero — it underflows and vanishes. So my claim is that the fanatic's case depends entirely on a kind of precision we don't have and never will, and once you admit we're doing ethics in finite precision, all the fanatic arguments quietly collapse back into normal, sane expected-value arguments.

  Here's my opening: you want me to buy a ticket for a dollar that pays out 10^(10^10) units of value with probability 10^-(10^10). Fine — now show me the machine that can hold both of those numbers at once, because I can't, and neither can you. Until you can, that ticket's expected value is exactly zero to anybody who has to actually make a decision, and you're just pushing symbols around that never cash out. So what does the fanatic actually say to that — is this a real objection or am I cheating?
