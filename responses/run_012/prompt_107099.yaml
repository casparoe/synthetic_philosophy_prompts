      *   *Strategy:* Externalism/Reliabilism.
      *   *Argument:* Justification doesn't require the fact to cause the belief *directly*. It requires a reliable connection. In the actual world, $N$ nomologically necessitates $P$ (psychophysical law). So, when $N$ occurs, $P$ occurs. The belief forming mechanism ($N \to J$) is reliable *in the actual world*.
      *   *Zombie World:* In the counterfactual zombie world, the law is different (or $P$ is absent). But justification is usually assessed relative to the actual world's laws.
      *   *Cost:* We must abandon internalism. The subject cannot *know* from the inside that they aren't a zombie. Justification becomes external and opaque to the subject. This is a huge bullet to bite.

