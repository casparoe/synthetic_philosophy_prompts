      *   *Distinction:*
          1.  $P$: Phenomenal state (the qualia, the "what it's like").
          2.  $C$: Representational content (the proposition "I am in pain").
          3.  $N$: Neural/Physical state (the brain process).
      *   *Epiphenomenalist Move:* $N$ causes $P$ (one-way). $N$ also causes the Judgment $J$ (which carries content $C$).
      *   *Aboutness:* How is $J$ about $P$ if $P$ didn't cause $J$? Because $N$ causes both. $N$ encodes information about $P$ (since $N$ causes $P$). $J$ is caused by $N$. Therefore, $J$ tracks $P$ via $N$.
