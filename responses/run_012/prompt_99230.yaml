answer: |-
  ### 1. The Principle: Non-Subordination of Judgment

  Your verdicts are tracked by a single core principle with two modifying clauses. I call this the **Principle of Non-Subordination**.

  **Core Principle:** A holder of a public or professional role must not accept a benefit that creates a reasonable presumption that their judgment is commanded by the giver rather than by the independent criteria of the role.

  **Clause A (Temporal Leverage):** The presumption of subordination is decisive when the benefit is accepted while a specific decision, evaluation, or output affecting the giver is pending or foreseeable.
  *   *Motivating Cases:* The planning officer's wine (pending application); the student's whisky (pre-exam); the legislator's aide (committee regulation); the journalist (writing the profile).
  *   *Why it fits:* It explains why the *same* gift (wine, whisky) flips from permissible to wrongful based entirely on timing. It captures the nurse's cash (pending discharge) versus the graduation whisky (relationship concluded, no future leverage).

  **Clause B (Feasible Compliance):** The duty to refuse is bounded by the institutional capacity to perform the role without the benefit. Where the state or institution fails to provide the resources necessary to execute the role, benefits that function as substitute resources mitigate the wrongness, provided they do not purchase specific discretion.
  *   *Motivating Cases:* The village headman's goat; potentially the customary seasonal gift.
  *   *Why it fits:* It explains why the goat feels "less wrong" than the wine. The planning officer has a salary and a functioning legal framework; refusing the wine costs her nothing. The headman lacks state support; refusing the goat may mean an inability to sustain the authority or peacekeeping function required by his role.

  ### 2. The Trade-Offs: Where Your Verdicts and the Principle Diverge

  To keep this principle simple rather than gerrymandered, you must surrender two intuitions:

  **1. The "Kind" vs. "Degree" Distinction on Value.**
  You feel the resort trip is *worse in kind*, not just degree, than the pen. The Principle of Non-Subordination treats this as a threshold of "reasonable presumption." A pen does not create a presumption of command; a resort trip does. However, the principle implies a sliding scale of risk, not a metaphysical shift. If you insist the resort trip is a different *moral species* of wrong than a expensive dinner, the principle cannot capture that without adding a complex "nature of benefit" clause (e.g., distinguishing "experiences" from "tools").
  *   *Recommendation:* Accept that the wrongness is a matter of degree (probability of subordination), even if your gut feels it as a kind.

  **2. The Headman's Innocence.**
  The Core Principle technically condemns the headman. A goat accepted during a dispute creates a presumption of subordination. Clause B (Feasible Compliance) does not make the act *right*; it makes the actor *blameless* or the wrongness *mitigated*.
  *   *Recommendation:* If you want to say the headman is doing nothing wrong at all, you must abandon the Core Principle for a relativist one. If you keep the Principle, you must admit the headman is engaging in a corrupt transaction, but one necessitated by systemic failure. Your verdict ("markedly less wrong") aligns with mitigation, not vindication.

  ### 3. The Locus of Wrongness

  The principle locates the wrongness in a **breach of a role-based duty of impartiality**, specifically the *appearance* of compromised independence.

  *   **Not the Exchange:** The cake and the pen are exchanges, but they are not wrongful.
  *   **Not Secrecy:** The customary gift is public, yet you are unsure about it. The principle suggests secrecy aggravates the wrong (hiding the subordination) but is not the source of it.
  *   **Not Reciprocity:** Reciprocity is inherent in social life (the Christmas wine). The wrongness arises when reciprocity *competes* with role criteria.
  *   **Not Third-Party Harm:** While third parties lose out when judgments are subordinated, the wrong exists even if no third party is harmed (e.g., if the nurse takes cash but treats the patient perfectly). The harm is to the *integrity of the office*.

  **Where they come apart:** The **Customary Gift**.
  Here, the gift is public, expected, and partly passed to staff.
  *   *Secrecy:* Absent.
  *   *Reciprocity:* High (socially obligatory).
  *   *Role Duty:* Ambiguous. If the role in that context includes maintaining social cohesion through redistribution, accepting the gift *fulfills* the role duty.
  *   *Verdict:* The principle suggests this is **Not Wrong**, provided the "passing on to staff" is the dominant function. It transforms the gift from a personal benefit (which subordinates judgment) to an office resource (which sustains the role). Your uncertainty stems from not knowing if the official retains personal discretion over the gift.

  ### 4. Verdicts on New Cases

  Applying the Principle of Non-Subordination:

  1.  **Official accepts a gift entered on a public register.**
      *   *Verdict:* **Permissible (with caveats).**
      *   *Reasoning:* Transparency removes the *secrecy* that often masks subordination, allowing the public to judge the "reasonable presumption." However, if the value is high (Resort Trip), registration does not cure the subordination. It mitigates the corruption risk but does not eliminate the breach of impartiality if the value is coercive.
  2.  **Doctor accepts a gift from a family after the patient has died.**
      *   *Verdict:* **Permissible.**
      *   *Reasoning:* Satisfies Clause A (Temporal Leverage). No future decision regarding that patient is pending. The judgment is no longer commandable. (Analogous to Graduation Whisky).
  3.  **Firm makes a small payment to move a routine licence to the front of the queue.**
      *   *Verdict:* **Wrong.**
      *   *Reasoning:* This violates the Core Principle directly. It subordinates the queue (an impartial criterion) to the payment (private interest). It harms third parties (those behind in the queue) and breaches the role duty of equitable processing.
  4.  **Gift given openly and reciprocated in kind years later, when neither party has any stake in the other's decisions.**
      *   *Verdict:* **Permissible.**
      *   *Reasoning:* Satisfies Clause A. The temporal gap and lack of stake remove the presumption of command. This is friendship, not corruption.

  ### 5. The Universality Question

  **Is the norm local or universal?**
  The Principle of Non-Subordination is **universal**. Any public role, by definition, entails a duty to act on public criteria rather than private obligation. A "public official" who acts solely on private obligation is a contradiction in terms.

  **The Headman vs. The Planning Officer**
  If the principle is universal, it condemns the headman's act (taking the goat during a dispute) just as it condemns the officer's act (taking the wine).
  *   *Which verdict to abandon?* You must abandon the intuition that the headman's act is **not corrupt**. It *is* corrupt. It is a breach of impartiality.
  *   *Why?* Because if you vindicate the headman by saying "gifts mean something different here," you dissolve the concept of governance. You are saying that in District X, a land dispute is not adjudicated on merit but on tribute. That is not a different *culture*; it is a different (and failed) *system*.
  *   *The Nuance:* You can maintain the headman is **blameless** (due to Clause B: Feasible Compliance) without maintaining the act is **right**. The Western donor is right to identify the act as corruption, but wrong to punish the headman without fixing the state capacity that makes the goat necessary.

  **The Customary Gift and Western Transparency**
  Can you still say the Western transparency regime is right to treat the obligatory seasonal gift as corrupt?
  *   **Yes.** If the gift is to the *individual*, it is corrupt under the universal principle, regardless of local custom. Custom cannot legitimize the subordination of public duty to private obligation.
  *   **However,** if the gift is to the *office* (passed to staff, used for public functions), the Western regime is wrong to categorize it as personal corruption. It is a shadow tax or informal budgeting.
  *   *Implication:* The Western norm is universal regarding **personal enrichment**, but often parochial in failing to recognize **informal institutional resourcing**.

  **What would change my mind?**
  I would abandon the universality of this principle only if you presented a case where **impartiality itself was harmful**. For example: A village headman who strictly applies impartial rules causes a civil war, whereas accepting gifts allows him to redistribute resources and keep the peace. In that extreme case, the "Role Duty" shifts from "Impartial Adjudicator" to "Peacekeeper." If the role definition changes, the principle holds, but the output changes. As long as the role is "adjudicator" or "regulator," the norm applies everywhere.
