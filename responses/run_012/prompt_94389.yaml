answer: |-
  Here is the plan for the session, structured to navigate the skepticism of your audience while ensuring the core conceptual distinctions land before the coffee runs out. You are correct that the session stands or falls on the initial tripartite distinction, so you must begin by writing three headings on the whiteboard without labeling them as ontic or epistemic yet. Label them instead as the formalism, the physical state, and the information state. Spend the first twenty minutes strictly mapping where the wavefunction sits in each column. The formalism is the vector in Hilbert space used to calculate probabilities. The physical state is whatever exists in the world independent of observers. The information state is what an agent knows about the system. The load-bearing step of the entire seventy-five minutes occurs immediately after this, when you challenge the classical analogy of knowledge. You must be willing to lose time here, even if it feels like you are delaying the quantum mechanics, because if they accept the classical model of knowledge as the default meaning of epistemic, the rest of the debate collapses into a triviality. You need to show them that defining knowledge as a probability distribution over definite underlying conditions is itself a substantive metaphysical claim, not a definition. Do not move to quantum examples until they agree that classical probability theory is not the only way to model information.

  Regarding your candidate example, you should not let the mixed state preparation case carry the session. Your distrust is well-founded because that example relies on the convexity of the state space, which implicitly validates the very classical analogy you want them to question. It teaches them that the state is ignorance about a definite underlying condition by constructing the example out of definite underlying conditions, namely the pure states in the ensemble. This smuggles in the answer by making the epistemic view look like the obvious consequence of linear algebra rather than a contestable interpretation of physical reality. Instead, use a pure state example involving symmetry or preparation independence where the underlying conditions are not given by the formalism. A simple qubit scenario where two distinct preparation procedures yield the same pure state works better, provided you refuse to specify what the underlying physical state is during the setup. The example must have the capacity to show that the quantum state does not uniquely identify the preparation history, but it must lack any specification of hidden variables or underlying ontic states that would allow them to revert to the classical ignorance picture immediately. You want them to feel the tension of not knowing whether the sameness of the quantum state implies sameness of physical reality, rather than handing them a density matrix that mathematically guarantees ignorance.

  You should anticipate misconceptions surfacing in a specific order and handle them at different points in the sequence. The first to appear will be instrumentalism, where they claim the distinction does not matter because the predictions are the same. Do not head this off immediately. Let it stand for ten minutes because defusing it early would cost you the dependency it happens to be sitting on, which is the motivation for caring about the question in the first place. You need them to feel the dissatisfaction of instrumentalism before you offer the ontological models framework as a way to resolve it. The second misconception is that an epistemic view means the state is in somebody's head or is purely subjective. You must head this off during the initial tripartite distinction by emphasizing that information can be objective, such as the data on a hard drive, without being a physical substance. The third is that an ontic view implies the wavefunction is a physical wave in space like a water wave. Correct this when you define the physical state column by noting that a field in configuration space is still a physical object even if it is not a mechanical wave in three dimensions. The fourth misconception is that the dispute is verbal and would be settled by a good dictionary. Leave this standing until the final ten minutes because it serves as a good test of whether they have grasped the physical stakes. The fifth is that a no-go result rules out epistemic readings period. You must head this off only after you have established the assumptions of the theorem, specifically preparation independence, to show that the theorem rules out epistemic views only under specific metaphysical constraints that nobody has independently motivated.

  There are several things you should openly refuse to cover at this level and you should admit this refusal explicitly to manage expectations. Tell them you will not cover the full proof of the no-go theorem because the algebra obscures the conceptual assumptions. Tell them you will not cover the details of the ontological-models framework beyond the basic mapping of preparations to distributions. Tell them you will not cover the toy models that reproduce various quantum phenomena while treating states as epistemic because those models often rely on restrictions that do not hold in full quantum theory. Tell them you will not cover agent-centred views like QBism in depth because those introduce additional layers of subjectivity that confuse the initial ontic-epistemic distinction. Making these exclusions clear prevents the students from feeling that the session is superficial and focuses their attention on the conceptual architecture rather than the technical machinery.

  The single closing question should be whether two systems assigned the same pure quantum state must be physically identical in every respect. This is answerable in a sentence and tests whether they understand that the ontic view requires a one-to-one mapping between state and physical reality while the epistemic view allows many-to-one. If the answer to that question is the wrong one, meaning they say yes without qualification or no without referencing the distinction, you should spend the remaining time drawing a diagram on the whiteboard mapping multiple preparation procedures to a single quantum state and then asking them to draw where the physical reality sits in that diagram. Do not lecture further. Force them to visualize the mapping failure that defines the epistemic view versus the mapping success that defines the ontic view. This ensures that even if they leave with the wrong answer, they leave with the correct diagram of the problem, which is the best outcome you can hope for in a first session.
