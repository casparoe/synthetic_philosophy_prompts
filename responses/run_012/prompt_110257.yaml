      *   *American Model (Third-Party Doctrine):* If you give info to a bank/employer, you have no reasonable expectation of privacy.
          *   Relation to slogan: Aligns closely. If you already disclosed it (to DMV, etc.), you have "nothing to hide" from the state merging it.
      *   *Chinese Model (Social Credit):* 2014 Planning Outline.
