answer: |-
  Here are ten questions ordered to build from definitions to edge cases, then to meta-arguments and conclusion. Each includes a follow-up keyed to the standard philosophical defense he's likely to use.

  **1. The Anatomy of Standing**
  "When you say a hypocrite loses 'standing,' I need to know what actually gets revoked. Are we talking about (a) the right to feel resentment, (b) the right to say it out loud to the person, or (c) the right to demand that they change? Can those come apart, or do they all vanish together?"

  *   **Follow-up (If he says they can come apart, e.g., you can demand change but not feel resentment):** "If I can still demand you change but I'm not allowed to feel resentment or say it angrily, isn't that just practical advice? What's left of *blame* if the emotional and expressive parts are stripped out?"

  **2. Partial Hypocrisy**
  "Is this a switch or a dial? If I violate a norm once a year, but I condemn someone who does it daily, do I lack standing? Does the amount matter, or is any violation a yes/no toggle that silences me?"

  *   **Follow-up (If he says it's a dial/degrees matter):** "Okay, so what does 'half-standing' look like in practice? Can I condemn you but only 50% as hard? Or does the target get to say, 'You're compromised,' and mute me completely regardless of the degree?"

  **3. The Reformed Hypocrite**
  "Let's talk about someone who did it for years, genuinely quit, and now condemns it. Is standing something that comes back automatically over time, or do they need to make restitution or apologize first?"

  *   **Follow-up (If he says time fixes it):** "If time alone restores standing, isn't standing actually about your *current* character rather than your past acts? Because if it were about the past acts, the clock shouldn't matter."

  **4. Borrowed Standing**
  "Suppose a victim says to a hypocritical ally, 'I know you do this too, but say it for me.' Does the victim's authorization fix the ally's standing, or does the hypocrisy infect the message no matter who's holding it?"

  *   **Follow-up (If he says the message is still tainted):** "So the moral truth of the message is held hostage by the messenger's history, even if the victim explicitly waives the objection? Why does the hypocrite's record outweigh the victim's consent?"

  **5. Institutions**
  "Can a company be a hypocrite? Say a firm sues a rival for license violations while violating licenses itself. If they lose standing, who actually lost it—the spokesperson, the lawyers, or the shareholders?"

  *   **Follow-up (If he says the entity loses standing):** "If the entity loses standing, does that mean the lawsuit is morally void, not just legally valid? Are the lawyers morally barred from filing papers they know are correct?"

  **6. Standing vs. Desert**
  "Even if nobody's in a position to say it, is the target still blameworthy? Does losing standing mean the accused gets off the hook, or just that the accuser is muted? Also, if my standing depends on facts about what I do in private, can the target just say 'prove it' and keep the blame?"

  *   **Follow-up (If he says the target is still blameworthy but the accuser is muted):** "So standing turns into a burden of proof game where the accused can deflect by digging into the accuser's private life? Doesn't that incentivize hunting for hypocrisy rather than addressing the actual wrong?"

  **7. The Victim Exception**
  "Does your view imply that a victim who's also a hypocrite about that norm loses the standing to object to being wronged? If I steal from you, but I'm also a thief, do I lose the standing to complain you stole from me?"

  *   **Follow-up (If he says yes, they lose standing):** "That seems to protect predators. If a known criminal gets robbed, are you saying he has no standing to object? Or do we carve out a special exception for victims, and if so, why doesn't that exception apply elsewhere?"

  **8. Self-Application**
  "You're arguing against people who disagree with you about standing. If you're wrong about this view, are you hypocritically blaming them for having bad moral theories? Or are you special-casing yourself?"

  *   **Follow-up (If he says he's 'persuading' not 'blaming'):** "Isn't philosophical argument a form of normative pressure? You're telling them they ought to change their view. If hypocrites can't demand change, why are you allowed to demand they change their minds?"

  **9. The Exception Case**
  "Give me the strongest case where even you'd say a hypocrite keeps standing. Where is the line where the hypocrisy is too trivial to revoke the right to blame?"

  *   **Follow-up (If he gives a specific example):** "What principle allows standing there that doesn't apply to the other cases we discussed? Is it about severity, or is it about whether the hypocrisy is relevant to the specific blame?"

  **10. Falsification**
  "Finally, what would actually change your mind about this whole view? Is there a scenario or argument that would convince you that hypocrites *do* retain standing?"

  *   **Follow-up (If he says it's theoretically possible but hasn't seen it):** "So the view stands until someone finds a counter-example? Does that mean you're treating this as an empirical claim about our moral practices, or a conceptual truth about what blame *is*?"
