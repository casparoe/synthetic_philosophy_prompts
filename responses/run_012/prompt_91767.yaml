prompt: |-
  I run a small forecasting shop — eight analysts, we sell probability estimates to a handful of institutional clients (mostly insurers, a couple of funds), and our whole pitch is that we hand over a number with a range rather than a shrug. The recuring headache is the split: two analysts come back from the same question with numbers miles apart, 25% vs 65% on whether a merger closes, and I have to ship something by Friday. A colleague in the econ department told me there's a body of work that speaks directly to this, roughly: if two agents start from the same prior, are both fully rational, and it's common knowledge between them what probability each of them currently assigns, then they cannot rationally keep disagreeing — any disagreement that survives all of that has to be coming from different priors, or from one of those idealizations breaking down (they don't trust each other, they aren't perfectly rational, the 'common knowledge' bit was never actually achieved). I want to turn that into a procedure I can run on a live disagreement before a deadline, instead of just guessing who's smarter or splitting the difference because I'm tired.

  You're a decision theorist who also designs decision processes inside real organizations, so you know the result cold and you also know how it falls apart with tired humans. Please start by brainstorming the distinctions that actually do the work here — evidence gaps vs prior gaps, the difference between each analyst merely knowing the other's number and that number being common knowledge, what 'fully rational' is carrying in the theorem, and where the idealization plainly fails for two people with egos and a Friday deadline. Then give me a checklist I can run: the steps in order, what counts as a sufficient answer at each one, when it says send them back to compare evidence and re-run, when it says the disagreement is now about priors rather than facts and here is the rule we apply to prior gaps, and where it has to stop and hand the call to me. A specific thing I want in there: a way to tell a prior gap from an evidence gap, which I assume means making each analyst decompose their number into what they'd have said before the new evidence and what they think the evidence implies — tell me if that's right, and what to do when they can't or won't decompose it. Also the in-room tests: whether the two of them would take opposite sides of a bet at their stated odds, what it means if one won't, and whether asking each to predict what the other will say next week adds anything or is just theatre.

  Then run the whole thing on two cases: (a) two analysts who've both read the same trial data disagree on whether a drug gets approved, 30% vs 70%; (b) two analysts both say 20% but for completely different reasons, which I suspect is a different kind of problem wearing the same clothes. I'd rather you include the case where the procedure tells me something I don't want to hear. Finally, be straight with me about what the procedure can't do — especially the situation where the 'prior gap' is really a values gap, or a disagreement about which model of the world is right, where no further argument is going to close it — and tell me how to present the resulting number to a client without pretending we've resolved something we haven't. Concrete over pretty; I'd take a procedure with three visible holes over a elegant abstraction.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Runs a small forecasting shop (8 analysts, institutional clients like insurers/funds).
      *   **Problem:** Recurring disagreement between analysts (e.g., 25% vs 65%) on specific forecasts. Needs a procedure to resolve or aggregate these before a deadline, moving beyond "splitting the difference" or "guessing who's smarter."
      *   **Theoretical Hook:** Aumann's Agreement Theorem (implied). The user knows the gist: rational agents with common priors and common knowledge of posteriors cannot agree to disagree.
      *   **Role:** Decision Theorist + Organizational Process Designer (practical, not just academic).
      *   **Key Requirements:**
          1.  Brainstorm distinctions (evidence vs. priors, common knowledge vs. knowing, rationality idealizations).
          2.  Provide a concrete checklist/procedure (steps, stop conditions, rules for prior gaps).
          3.  Specific mechanism: Decomposing numbers into prior + likelihood (Bayesian update).
          4.  In-room tests: Betting tests, predicting future predictions.
          5.  Run the procedure on two specific cases (30% vs 70% on drug approval; 20% vs 20% for different reasons).
          6.  Honesty about limitations (values gaps, model disagreements, client presentation).
          7.  Tone: Concrete, direct, "three visible holes over elegant abstraction."

  2.  **Deconstruct the Theory (Aumann's Agreement Theorem) for Practice:**
      *   *Theorem:* If agents share a prior, update via Bayes, and have common knowledge of each other's posteriors, they must converge.
      *   *Reality Check:* Humans aren't Bayesian calculators. Priors aren't shared. "Common knowledge" is hard to establish (do I know that you know that I know?). Rationality is bounded (time, cognitive load, ego).
      *   *Actionable Insight:* The theorem isn't a magic wand to make them agree; it's a diagnostic tool to find *why* they disagree. Is it data? Is it interpretation (likelihood)? Is it the starting point (prior)? Is it trust?

  3.  **Drafting the Distinctions (Brainstorming Phase):**
      *   *Evidence Gap:* One has data the other doesn't. Easy fix (share data).
      *   *Likelihood/Model Gap:* Same data, different interpretation of what it implies. (e.g., Is this trial result noise or signal?)
      *   *Prior Gap:* Different starting beliefs before the specific evidence. (e.g., "FDA never approves drugs like this" vs. "FDA is under pressure to approve.")
      *   *Common Knowledge:* It's not enough for Analyst A to tell Analyst B "I say 70%." B needs to know *why* A says 70%, and A needs to know that B knows that, etc. In practice, this means transparent reasoning, not just numbers.
      *   *Rationality:* Tired humans use heuristics. Ego prevents updating. Deadline pressure prevents deep dives.

  4.  **Developing the Checklist (The Core Procedure):**
      *   *Goal:* Triage the disagreement.
      *   *Step 1: Information Symmetry.* Do they have the same files?
      *   *Step 2: Decomposition (The Bayesian Audit).* Break $P(H|E)$ into $P(H)$ and $P(E|H)$. This addresses the user's specific request.
      *   *Step 3: The Bet.* Would you take the other side at these odds? Reveals confidence vs. noise.
      *   *Step 4: The Meta-Prediction.* What will the other say next week? Tests understanding of the other's model.
      *   *Decision Rules:* If evidence gap -> Share. If likelihood gap -> Debate model. If prior gap -> Aggregate (weighted average or manager override).
      *   *Stop Condition:* When time runs out or it becomes a values fight.

  5.  **Refining the "Decomposition" Request:**
      *   User asks: "make each analyst decompose their number into what they'd have said before the new evidence and what they think the evidence implies."
      *   *Verdict:* Yes, this is the practical application of Bayes. $Posterior \propto Prior \times Likelihood$.
      *   *Problem:* Humans are bad at this. They anchor on the posterior.
      *   *Fix:* Force them to write down the "Base Rate" (Prior) and the "Signal Strength" (Likelihood Ratio) separately.

  6.  **Developing the Cases:**
      *   *Case A (30% vs 70% Drug Approval):* Classic disagreement. Likely a mix of prior (FDA toughness) and likelihood (how to read the trial data). The procedure should reveal if one ignored a side effect (evidence) or weighs the same side effect differently (model).
      *   *Case B (20% vs 20% Different Reasons):* This is "Agreement for the Wrong Reasons." Dangerous. If the reasons are mutually exclusive, the 20% is fragile. The procedure needs to flag this as high variance risk, even if the point estimate matches.

  7.  **Addressing Limitations & Client Presentation:**
      *   *Values/Model Gaps:* Sometimes it's not about probability, it's about what world we live in (e.g., "Markets are efficient" vs. "Markets are manic"). You can't average these cleanly.
      *   *Client Presentation:* Don't hide the disagreement. Show the range. Explain the *source* of uncertainty (parameter uncertainty vs. model uncertainty).

  8.  **Review and Refine (Self-Correction):**
      *   *Tone Check:* Is it too academic? Need to make it sound like a shop floor protocol. Use terms like "The Friday Protocol."
      *   *Aumann Check:* Don't overpromise. Aumann says they *shouldn't* disagree. The procedure admits they *will*, and manages it.
      *   *Specific Request:* "Tell me if that's right [decomposition]." -> Yes, validate that, but warn about the difficulty.
      *   *Specific Request:* "Predict what the other will say next week." -> This is testing "Common Knowledge of Posteriors." If I can't predict your update, I don't understand your model.

  9.  **Final Polish:** Structure clearly with headings. Ensure the checklist is actionable. Make sure the "Case B" insight lands (agreement can be more dangerous than disagreement).

  *(Self-Correction during drafting)*: I need to make sure I don't just explain Aumann's theorem but *operationalize* it. The user wants a checklist, not a lecture. The lecture is the preamble, the checklist is the product.

  *(Refining the "Prior Gap" rule)*: If it's a prior gap, how do we resolve it? In a commercial shop, we usually aggregate. But the user wants a rule. Rule: If it's a prior gap (values/base rates), use a weighted average based on track record. If it's an evidence gap, force reconciliation.

  *(Refining Case B)*: 20% vs 20% for different reasons. This is "False Consensus." The risk isn't the mean, it's the variance. If Reason 1 fails and Reason 2 fails, the probability drops to near zero. If either holds, it stays. This requires a "Conjunctive vs Disjunctive" check.

  10. **Final Output Generation** (incorporating all the above thoughts into the structured response).
answer: |-
  Here is the operational reality of Aumann's Agreement Theorem applied to a forecasting shop with a Friday deadline.

  ### Part 1: The Distinctions That Do the Work

  You know the theorem: *Rational agents with common priors and common knowledge of posteriors cannot agree to disagree.* In your shop, that theorem is not a description of reality; it is a diagnostic tool. When it fails, it tells you *why* it failed. Here are the four breakdown points you need to distinguish.

  **1. Evidence Gaps vs. Likelihood Gaps vs. Prior Gaps**
  *   **Evidence Gap:** Analyst A has a document Analyst B doesn't. This is administrative failure. Fix: Share the document.
  *   **Likelihood (Model) Gap:** Both have the trial data. Analyst A thinks a p-value of 0.04 is strong signal; Analyst B thinks it's noise given the sample size. They agree on the data, disagree on what the data *does*. This is a technical debate.
  *   **Prior Gap:** Analyst A believes "FDA is politically pressured to approve" (Base rate: High). Analyst B believes "FDA is risk-averse post-scandal" (Base rate: Low). They look at the same data but start from different worlds. This is often unresolvable by argument.

  **2. Knowing vs. Common Knowledge**
  *   **Knowing:** I tell you "I say 70%." You hear me.
  *   **Common Knowledge:** I tell you "I say 70%." You understand *why* (my model). I know that you understand why. You know that I know that you understand.
  *   **The Failure:** In your shop, "Knowing" happens in Slack. "Common Knowledge" requires structured exposition. If Analyst B can't restate Analyst A's reasoning to A's satisfaction, you don't have common knowledge. You have two monologues.

  **3. The "Fully Rational" Idealization**
  *   The theorem assumes Bayesian updating. Humans do anchoring, confirmation bias, and ego defense.
  *   **The Friday Effect:** As the deadline nears, cognitive bandwidth drops. Analysts switch from "truth-seeking" to "position-defending." A procedure that requires deep introspection will fail at 4:00 PM on Friday. It must be rigid and fast.

  **4. The Ego/Trust Variable**
  *   Aumann assumes honest reporting. If Analyst A thinks Analyst B is incompetent, A will not update on B's number, regardless of the math.
  *   **Operational definition:** Do they respect each other's track record? If not, the "common knowledge" channel is blocked by noise.

  ---

  ### Part 2: The "Friday Protocol" Checklist

  This is your triage procedure. Run this when two estimates diverge by >15 percentage points.

  **Step 1: The Information Symmetry Check (15 mins)**
  *   **Action:** Each analyst lists the top 3 pieces of evidence driving their number.
  *   **Test:** Does the other analyst have these documents?
  *   **Pass:** Both have all docs. Move to Step 2.
  *   **Fail:** One lacks data. **Stop.** Share data. Re-calculate individually. Resubmit.
  *   **Why:** Don't debate models when one person is missing the map.

  **Step 2: The Bayesian Decomposition (30 mins)**
  *   **Action:** You asked about decomposing the number. **Yes, this is correct and necessary.** Force them to fill out this slip:
      1.  **Base Rate (Prior):** Before looking at *this specific* new evidence, what was the probability? (e.g., "Historically, 40% of Phase 3 drugs in this class get approved.")
      2.  **Signal Strength (Likelihood):** How much does the *new* evidence shift that? (e.g., "This trial result is 2x more likely if the drug works than if it fails.")
      3.  **Resulting Posterior:** The final number (e.g., 70%).
  *   **Test:** Compare the Base Rates. Compare the Signal Strengths.
  *   **Pass:** Base rates match, Signal Strengths match, but Posteriors differ? **Math Error.** Fix the calculation.
  *   **Fail:** Base rates differ significantly (e.g., 20% vs 60%). **Diagnosis: Prior Gap.** Move to Step 4.
  *   **Fail:** Signal Strengths differ significantly. **Diagnosis: Model Gap.** Move to Step 3.

  **Step 3: The Model Stress Test (For Model Gaps)**
  *   **Action:** Analyst A must argue Analyst B's model for 5 minutes. Analyst B must argue Analyst A's.
  *   **Test:** Can they steelman the other's interpretation of the evidence?
  *   **Pass:** They can articulate the other's view. Move to Step 4.
  *   **Fail:** They refuse or distort the other's view. **Diagnosis: Trust/Ego Gap.**
  *   **Manager Action:** If they can't steelman, they aren't listening. You (the manager) must arbitrate the model or weight by track record. Do not let them debate further.

  **Step 4: The Bet & The Meta-Prediction (15 mins)**
  *   **The Bet:** "At your stated odds (e.g., 70%), would you take the other side of a bet against your colleague's number (30%)?"
      *   **If Yes:** They are confident. Keep the divergence for the client (show the range).
      *   **If No:** They are bluffing or unsure. Force them toward the middle.
  *   **The Meta-Prediction:** "What number will your colleague submit *next week* if no new evidence arrives?"
      *   **If they say "Same":** They think the other is stubborn/irrational.
      *   **If they say "Closer to mine":** They think the other will learn.
      *   **Insight:** If A thinks B will move to A, but B thinks A will move to B, you have a coordination failure. This usually indicates a **Prior Gap**.

  **Step 5: Resolution Rules (The Manager's Call)**
  *   **If Evidence Gap:** Fix data, re-run.
  *   **If Model Gap:** Average the numbers, but widen the confidence interval. (Uncertainty about the *process* adds variance).
  *   **If Prior Gap:** **Do not average blindly.** Priors often reflect values or worldview.
      *   *Rule:* Weight by track record on similar questions. If track records are equal, present the range to the client as "Scenario A vs. Scenario B."
  *   **If Trust/Ego Gap:** Manager overrides. Pick the analyst with the better calibration score for this domain.

  ---

  ### Part 3: Running the Cases

  #### Case A: The Drug Approval (30% vs 70%)
  *   **Context:** Both read the same trial data.
  *   **Step 1 (Info):** Symmetric. Both have the FDA briefing docs.
  *   **Step 2 (Decomposition):**
      *   *Analyst A (30%):* Prior = 20% (FDA is tough). Likelihood = Trial is modestly positive.
      *   *Analyst B (70%):* Prior = 60% (Drug is orphan status, high pressure). Likelihood = Trial is modestly positive.
      *   *Diagnosis:* They agree on the Likelihood (the trial data means the same thing). They disagree on the Prior (the context).
  *   **Step 4 (Bet):** Analyst A refuses to bet at 70%. Analyst B refuses to bet at 30%. Both confident.
  *   **Step 4 (Meta):** A says B will stay at 70%. B says A will stay at 30%.
  *   **Verdict:** This is a **Prior Gap**. It is not about the trial data; it is about the political environment of the FDA.
  *   **Action:** Do not force a consensus number. It creates false precision.
  *   **Output:** Ship two scenarios. "Base Case (Analyst A): 30%. Optimistic Case (Analyst B): 70%." Tell the client the divergence is driven by assumptions about regulatory pressure, not clinical efficacy.
  *   **Why:** If you average to 50%, you hide the risk. If the political pressure vanishes, the number isn't 50%, it's 30%. The client needs to know the *driver* of the risk.

  #### Case B: The False Consensus (20% vs 20%)
  *   **Context:** Both say 20%. You suspect different reasons.
  *   **Step 2 (Decomposition):**
      *   *Analyst A:* Prior = 50%. Likelihood = New evidence is devastating (slashes prob to 20%).
      *   *Analyst B:* Prior = 5%. Likelihood = New evidence is miraculous (boosts prob to 20%).
  *   **Diagnosis:** **Cancellation Error.** They agree on the destination but are traveling in opposite directions.
  *   **Risk:** This is more dangerous than Case A. In Case A, you know the uncertainty. In Case B, the consensus is fragile. If Analyst A's "devastating evidence" turns out to be noise, A moves to 50%. If Analyst B's "miraculous evidence" fails, B moves to 5%. The variance is massive.
  *   **Action:** **Reject the 20%.**
  *   **Output:** Tell the client: "Consensus estimate is unstable. Analysts arrive at 20% via mutually exclusive pathways. We are widening the range to 5% - 50% to reflect model uncertainty."
  *   **Why:** A 20% consensus implies stability. This is instability masquerading as agreement. Your procedure caught a "hidden variance" that a simple average would miss.

  ---

  ### Part 4: What The Procedure Can't Do (The Holes)

  You asked for concrete holes. Here they are.

  **1. The Values Gap (The "Should" vs. "Will")**
  Sometimes a "Prior" isn't a probability belief; it's a political stance. Analyst A thinks the merger *shouldn't* close (antitrust is good), so they unconsciously weight evidence toward failure. Analyst B thinks it *should* close (markets are efficient).
  *   **Limitation:** The Decomposition Step won't fix this. They will lie about their Priors to sound objective.
  *   **Fix:** You need to know your analysts. If you spot this, treat it as a "Model Gap" but discount both numbers by 20% toward the base rate of the industry.

  **2. The "Unknown Unknown" Model Disagreement**
  Aumann assumes they know the *state space*. Sometimes Analyst A is worried about a risk Analyst B doesn't even know exists (e.g., a specific clause in the merger contract).
  *   **Limitation:** The Information Symmetry Check only covers *known* documents. It doesn't cover *unknown* risks.
  *   **Fix:** Add a "Pre-Mortem" question to Step 1: "If this forecast is wrong, what specifically caused the error?" If their answers don't overlap, you have hidden model divergence. Widen the range.

  **3. The Deadline Hard Stop**
  The protocol takes ~90 minutes. If it's 3:00 PM Friday, you don't have time.
  *   **Limitation:** You can't run the full diagnostic.
  *   **Fix:** The "Emergency Rule." If time < 1 hour, skip to Step 4 (The Bet). If both will bet, ship the range. If neither will bet, ship the weighted average (by track record) and flag it as "Low Confidence."

  ### Part 5: Presenting to the Client

  Do not sell a resolved number if the process didn't resolve the disagreement. Institutional clients pay you for risk assessment, not comfort.

  **Bad Presentation:** "Our consensus estimate is 50%." (Hides the 30/70 split).
  **Bad Presentation:** "Analyst A says 30, Analyst B says 70, we average to 50." (Implies the truth is likely in the middle, which isn't always true).

  **Good Presentation (The "Driver" Approach):**
  > "We assess a 30-70% probability of approval. The clinical data is interpreted similarly by both analysts (Signal Strength agreement). The divergence stems entirely from prior assumptions regarding regulatory appetite (Prior Gap).
  >
  > *   **Scenario 1 (Status Quo Regulatory):** 30%
  > *   **Scenario 2 (Pressure-to-Approve):** 70%
  >
  > **Recommendation:** Hedge as if 30%, but monitor [Specific Political Indicator] which would signal a shift to Scenario 2."

  **Why this works:** It tells the client *what to watch*. It turns your internal disagreement into an external monitoring strategy. It admits the hole in the forecast without admitting incompetence.

  ### Summary for Your Shop
  1.  **Disagreement is data.** Don't crush it; classify it.
  2.  **Decompose everything.** Prior vs. Likelihood. If you can't write it down, you don't know it.
  3.  **False consensus is dangerous.** 20% vs 20% via different paths is riskier than 30% vs 70%.
  4.  **Ship the uncertainty.** If the disagreement is a Prior Gap, ship the scenarios. Let the client decide which world they think they live in.

  Run this for a month. You'll find that half your disagreements are just Analyst A forgetting to read an appendix Analyst B read. The other half are genuine worldview splits that your clients need to know about.
