answer: |-
  Your hypothesis is correct in its broad strokes, but it underestimates the metaphysical stubbornness of the computationalist. The impasse is not merely a case of two sides answering different questions under one name (the "double duty" problem); it is a case of one side insisting that their answer to the methodological question *entails* an answer to the ontological question, while the other side insists the entailment fails.

  Here is the diagnosis: The disagreement is a **category error regarding the modal status of computation.**

  ### 1. The Structure of the Disagreement

  You identified the split between explanation (methodology) and ontology (literal implementation). However, the computationalist does not view these as separate readings. She views the explanatory success as *evidence* for the ontological claim. Her argument is an Inference to the Best Explanation (IBE): *Because computational models predict and unify, the brain must literally be a computer.*

  The critic's objection (Putnam, dynamical systems) attacks the validity of that inference. They argue that explanatory utility does not track ontological reality in this specific domain because "computation" is not a natural kind like "water" or "neuron." It is a relational property, like "being a weapon" or "being a boundary." A rock is a weapon only relative to an agent who can throw it; a river is a boundary only relative to a polity that recognizes it.

  The impasse persists because the computationalist is trying to treat computation as an **intrinsic physical property** (like mass or charge) while defining it via **extrinsic functional relations** (syntax, rules, symbols).

  *   **The Computationalist's Confusion:** She wants medium-independence (abstraction from physics) but also causal efficacy (the physics must drive the computation). She wants the syntax to be semantically evaluable (about something) but physically realized. When pressed on how the physics "tracks" the syntax non-arbitrarily, she appeals to mechanism. But when pressed on how the mechanism is individuated, she appeals to function. When pressed on where the function comes from, she appeals to evolution or design. At every step, the "intrinsicness" of the computation leaks away into observer-relative or history-relative facts.
  *   **The Critic's Strength:** The critic sees that if implementation depends on how we carve the system (discrete vs. continuous, which states count as '0' or '1'), then the claim "the brain is a computer" is not a discovery about the brain, but a decision about how to describe it.

  ### 2. Diagnosing the Test Case

  You ask: *Consider a system whose state transitions follow a program's transitions only because we fixed the state-to-state mapping after observing the behaviour, and a system whose transitions follow the program's because its physics forces them to; does any principled account of implementation distinguish these two without appealing to our interests?*

  **The honest answer is no.**

  If you strip away all teleology (purpose, function, design history) and look strictly at the physics and the mapping, Putnam is right: the distinction collapses. A "physics-forced" transition is just a physical causal chain. To call it "computational" is to overlay a syntactic description onto that chain.

  The only way to distinguish them is to introduce a **constraint on individuation**. This is where the mechanistic account (e.g., Piccinini) attempts to intervene. It argues that a system implements a computation only if it contains *functional mechanisms* organized to manipulate *vehicles* according to *rules*.
  *   In the "physics-forced" case (a genuine computer), the components are individuated by their functional role in the mechanism.
  *   In the "post-hoc" case (the rock), the components are individuated by the observer's arbitrary mapping.

  **However,** this "fix" simply pushes the arbitrariness back one step. How do we know which physical parts count as "functional components" without appealing to a goal or function? If the brain evolved, the function is survival. If we are theorists, the function is prediction.
  *   If you say the brain's components are individuated by *evolutionary function*, you have made computation observer-relative to the history of natural selection (which is itself a descriptive framework).
  *   If you say they are individuated by *theorist function*, you have conceded the critic's point that the decomposition is imposed by interests.

  Therefore, the test case reveals that **implementation is not a brute physical fact.** It is a fact relative to a scheme of individuation. The computationalist claims the scheme is fixed by nature (mechanism); the critic claims the scheme is fixed by the theorist (description).

  ### 3. Is the Question Ill-Posed?

  The question "Is the brain a computer?" is ill-posed because it treats "computer" as a noun denoting a type of object, rather than an adjective denoting a mode of description.

  *   **Empirical Component:** There is a genuine empirical disagreement about **causal granularity**. Do neural spikes act as discrete digital switches (supporting the computationalist), or are they part of a continuous analog field where the "discreteness" is an artifact of thresholding (supporting the dynamical critic)? This is not underdetermined in principle; future neuroscience could show that noise is fundamental to the processing, not just a nuisance to be coded away.
  *   **Metaphysical Component:** This is where the real impasse lies. Even if we prove neurons act discretely, does that make them "computational"? Only if you accept that discrete state manipulation *constitutes* computation intrinsically. The critic denies this constitution.

  The disagreement is not verbal, because it has consequences for how we build models. If the critic is right, searching for the "algorithm" the brain runs is like searching for the "algorithm" a waterfall runs. You might find a mathematical description that fits, but you won't find a mechanism that executes it. If the computationalist is right, there is a specific causal architecture we must find.

  ### 4. What Counts as Progress?

  Progress will not come from better neuroscience data, because both sides accept the current data. Progress requires a **formal constraint on implementation** that does not rely on teleology.

  1.  **A Formal Result:** A proof that shows certain physical causal structures *cannot* be mapped to certain computational structures without violating conservation laws or causal locality. If such a constraint exists, Putnam's triviality thesis is false *physically*, not just pragmatically. (Current consensus: No such constraint exists).
  2.  **A Causal Discovery:** An experiment showing that manipulating the *syntax* of a neural representation (without changing its physics/semantics) alters behavior in a way that continuous dynamics cannot predict. This would show syntax has causal power independent of physics, supporting the ontological claim. (This is the "causal relevance of content" problem, and it remains unsolved).
  3.  **A Dissolution:** An argument demonstrating that "computation" is a **perspectival realist** concept. It is real, but only relative to a level of analysis. This would force the computationalist to concede the ontological claim (the brain isn't *intrinsically* a computer) while keeping the explanatory claim (it is *realistically* described as one).

  ### 5. The Bet

  I bet on the **Dissolution**.

  The computationalist is confused about the metaphysics of implementation. She is trying to naturalize intentionality (meaning) by grounding it in computation, and then grounding computation in physics. But computation, defined formally, has no grip on physics without a bridge principle (implementation). That bridge principle inevitably relies on individuation criteria that are interest-relative or teleological.

  **Why I bet this way:**
  Every attempt to define "physical computation" intrinsically either falls prey to Putnam's triviality (too permissive) or excludes actual computers (too restrictive). The only stable definitions are mechanistic/teleological. But teleology in a naturalistic world is either cashed out in terms of evolutionary history (which is contingent and descriptive) or user goals (which are observer-relative). Therefore, the claim "the brain is a computer" cannot be a mind-independent ontological fact in the way "the brain contains neurons" is.

  **What would change my mind:**
  If a computationalist could provide a definition of implementation that relies **solely on causal powers and physical structure**, without appealing to function, history, or observer interests, and that definition successfully excludes the "rock" while including the "brain" without arbitrary parameters.

  Until then, the impasse will survive because the computationalist is defending a category mistake: she treats a mode of description as a mechanism of nature. The critic is right that the decomposition is imposed, but often wrong to imply that this makes the explanation useless. The progress lies in admitting that computational neuroscience is a **pragmatic ontology**: we treat the brain *as if* it were a computer because that carving of nature yields predictive power, not because we have found the "software" running on the "hardware."

  **Diagnosis Summary:** The dispute is a **metaphysical clash over the status of functional kinds.** The computationalist believes functional descriptions can be ontologically intrinsic; the critic believes they are inherently relational. The "double duty" you spotted is the symptom; the disease is the attempt to derive an "is" (ontology) from an "works like" (explanation) without a non-arbitrary bridge.
