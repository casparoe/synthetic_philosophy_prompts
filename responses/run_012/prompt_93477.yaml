      *   *Mapping 5: Responsibility -> Causation/Exclusions.*
      *   *Trap 1: "Fairness".* In philosophy, fairness is moral. In actuarial science, "actuarial fairness" means $Premium = Expected Loss$. Luck Egalitarianism might actually oppose strict actuarial fairness if the risk was brute luck.
      *   *Trap 2: "Choice".* Actuarially, we proxy choice with correlates (zip code, credit, occupation). Philosophically, choice requires autonomy and information.
      *   *Trap 3: "Ex Post" vs. "Ex Ante".* Luck Egalitarianism is often ex post (what actually happened was due to luck). Insurance is ex ante (pricing based on probability).
      *   *Trap 4: "Pooling".* Luck Egalitarianism wants to pool brute luck. Actuarially, pooling is about law of large numbers.
      *   *Trap 5: The "Blameless Rider".* This sounds like an exclusion clause. Philosophy talks about redistribution. Insurance talks about risk transfer.

  3.  **Refining the Mapping (Selecting the Best Fits):**
      *   *Brute Luck:* Unpriceable idiosyncratic risk? No, that's not right. It's risk where the *parameter* isn't under control. Let's call it "Inherent Risk Parameter" vs. "Behavioral Risk Parameter."
      *   *Option Luck:* Moral Hazard + Lifestyle choices.
      *   *Justice:* Cross-subsidization. Luck Egalitarianism says high brute luck risks should be subsidized by low brute luck risks. High option luck risks should pay their own way.
