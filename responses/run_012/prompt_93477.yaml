      *   *Mapping 1: Brute Luck -> Unpredictable/Uncontrollable Risk.* (e.g., genetic disease, random accident).
      *   *Mapping 2: Option Luck -> Controllable Risk/Behavioral Hazard.* (e.g., smoking, extreme sports, non-compliance).
      *   *Mapping 3: Justice -> Fair Pricing/Equity.* (Actuarial equity vs. Social equity).
