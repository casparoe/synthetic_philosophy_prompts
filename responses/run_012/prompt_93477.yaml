      *   **The Translation:**
          *   Start with the objective function.
          *   Define the two risk buckets (Brute vs. Option).
          *   Define the pricing mechanism (Community Rating for Brute, Experience/Risk Rated for Option).
          *   Define the "Injustice" (Charging more for brute luck).
      *   **The Residue Report:**
          *   *Clean Fit:* Pooling of independent risks.
          *   *Bent Fit:* "Choice" vs. "Correlates." Actuarials use proxies; philosophers want actual autonomy.
          *   *Missing in Actuarial:* The concept of "Sufficiency" or a baseline. Actuarials price marginal risk; philosophers care about the absolute level of welfare.
          *   *Missing in Philosophy:* The problem of *correlation*. Brute and Option luck are rarely orthogonal in data.
      *   **The "Blameless Rider" Verdict:** This is the crux. The theory distinguishes *ex post* (what caused *this* claim). Actuarial models distinguish *ex ante* (what group do you belong to). The Rider tries to do *ex post* underwriting on a per-claim basis. That's administratively expensive and epistemically shaky.

