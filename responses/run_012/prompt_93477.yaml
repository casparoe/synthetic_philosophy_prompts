  *(Final check on the "Blameless Rider")*: The user suspects a bright line can't be drawn. I need to validate that suspicion using the philosophical framework. Luck Egalitarians themselves fight over where the line is (the "expensive tastes" objection, the "information" requirement). If philosophers can't agree, an underwriting guideline won't work.

