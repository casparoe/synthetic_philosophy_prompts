prompt: |-
  I'm a freelance features writer — science and ideas, the sort of thing that ends up in the back half of a weekend mag — and I've just had a 6,000-word piece commisioned on consent. Not just the sexy stuff either: medical consent forms, the GDPR clickwrap business, NDAs, capacity assessments, the whole spread. My working thesis is that everyone waves the word consent about as if we all agree what makes it valid, and we plainly don't.

  What I need from you isn't a survey or a reading list — I can't read forty papers and I'm not going to pretend otherwise. I want to know which open questions about what makes consent valid are actually load-bearing: the ones where, if you settled one, a heap of the others would quietly fall into place, or the law would have to shift. And which ones look meaty but are dead ends that won't change a word of the piece.

  The things I keep bumping into: whether coercion is measured against what you're morally entitled to or against what you'd have got in a fair market (which seems to settle whether a lousy job offer is coercive or merely grim); whether consent is really a mental state or a public act, and what we do when the two come apart — someone says yes and doesn't mean it, someone means it and says nothing; how much deception has to matter before the consent is void; and whether competence is a threshold you're over or under, or a sliding scale that depends on what you're consenting to. A philosopher mate reckons the sleeper issue is that consent can be perfectly valid and still not make the thing alright — valid but not licence-granting. Is she right that that's the one to build around, or is that the sort of thing only philosophers care about? I already know the standard checklist of elements of valid consent, so skip that, and skip the social-construction angle — I want the seperate, harder questions.

  So: rank the two or three I should build the piece around, and defend the order. What makes a question worth a chunk of my word count — does it move law or practice, does it change what ordinary people ought to do, does it unlock other questions, is it even tractable without a lab? It's for a general-readership quarterly, but I'd love it to be the sort of thing that gets quoted in a law-reform consultation, so weight the practical ones accordingly. And tell me what would change your ranking — what I'd have to see or read in the next year to move something up or down. Flag the red herrings too. Be blunt; I'd rather find out now than 5,000 words in.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Freelance features writer (science/ideas, weekend magazine style).
      *   **Task:** 6,000-word piece on *consent* (broad scope: medical, digital, legal, sexual, etc.).
      *   **Thesis:** "Consent" is used as if it has a shared meaning, but it doesn't.
      *   **Needs:** Ranking of 2-3 "load-bearing" open questions. Needs to know which questions are dead ends (red herrings). Needs to know *why* the ranking is what it is (impact on law/practice, unlocking other questions, tractability).
      *   **Constraints:** No reading lists, no surveys, skip standard checklists, skip social-construction angles. Be blunt.
      *   **Goal:** General readership quarterly, but potentially cited in law-reform consultations.
      *   **Specific Issues Mentioned:** Coercion (baseline problem), Mental State vs. Public Act, Deception thresholds, Competence (threshold vs. sliding scale), Valid but not License-Granting (philosopher friend's tip).

  2.  **Evaluate the Candidate Questions:**

      *   *Question A: Coercion Baselines (Moral Entitlement vs. Fair Market).*
          *   *Pros:* Huge practical impact (employment, plea bargains, settlement agreements). Distinguishes "hard choice" from "no choice."
          *   *Cons:* Philosophically dense. Hard to explain simply.
          *   *Verdict:* High impact, but maybe too specific to economic/legal contexts compared to the broader "validity" issue.

      *   *Question B: Mental State vs. Public Act (The "Performance" Problem).*
          *   *Pros:* Central to sexual assault cases, medical refusals, digital clickwraps. If consent is just a signature, autonomy is hollow. If it's just a feeling, law is impossible.
          *   *Cons:* Legally, the "objective test" usually wins, which makes the philosophical nuance feel academic.
          *   *Verdict:* Very strong. It cuts to the heart of the "shared meaning" thesis.

      *   *Question C: Deception Thresholds (Fraud in the Factum vs. Inducement).*
          *   *Pros:* Relevant to medical (doctor lies about risk), sexual (lying about status/identity), consumer (dark patterns).
          *   *Cons:* Law is actually fairly settled here (fraud vitiates, inducement doesn't), even if people find it counterintuitive.
          *   *Verdict:* Good example, but maybe not the *structural* load-bearer.

      *   *Question D: Competence (Threshold vs. Sliding Scale).*
          *   *Pros:* Medical law (Gillick competence), dementia, age of consent.
          *   *Cons:* Mostly handled via "capacity assessments" in practice. The law already accepts the sliding scale (risk-sensitive).
          *   *Verdict:* A bit technical/medical. Less universal than the others.

      *   *Question E: Valid but not License-Granting (The "Moral Magic" Problem).*
          *   *Pros:* Addresses the "I signed it but it was still wrong" feeling (NDAs, exploitative contracts).
          *   *Cons:* Your philosopher friend is right that it's deep, *but* for a general audience and law reform, it might be too abstract. It risks sounding like "consent doesn't matter."
          *   *Verdict:* Dangerous for a 6k feature. Might undermine the thesis rather than support it.

  3.  **Select and Rank the Top 2-3:**

      *   *Selection 1: The Performance Problem (Mental State vs. Public Act).*
          *   *Why:* It's the engine room. If we don't agree on *what consent is* (a feeling or a signal), we can't agree on when it's broken. It covers clickwraps (signal without thought), sex (thought without clear signal), and medical (withdrawal of signal).
          *   *Impact:* High. Changes how we design forms, how juries are instructed, how apps are built.

      *   *Selection 2: The Baseline Problem (Coercion and "No Real Choice").*
          *   *Why:* This addresses the "valid but exploitative" angle without getting bogged down in metaphysics. It tackles the NDAs, the employment contracts, the plea bargains. It asks: When does pressure become force?
          *   *Impact:* High legal reform potential (e.g., non-competes, settlement NDAs).

      *   *Selection 3 (Runner Up/Integrated): The Scope of Authority (What can consent actually do?).*
          *   *Why:* This captures the philosopher friend's point (Valid but not License-Granting) but makes it practical. Can you consent to harm? Can you consent to waive rights?
          *   *Impact:* Explains why some consents are void ab initio (slavery, certain medical procedures).

      *   *Red Herrings:*
          *   *Competence Thresholds:* Too medicalized. The law already handles this with "capacity."
          *   *Pure Deception Nuance:* Unless it's about *identity*, it's usually just "caveat emptor."
          *   *Valid but not License-Granting (as a standalone):* Too abstract. Needs to be grounded in "limits of waiver."

  4.  **Drafting the Response:**

      *   *Tone:* Professional, direct, respectful of the writer's expertise (no hand-holding), slightly conversational but dense.
      *   *Structure:*
          1.  Direct Answer (The Ranking).
          2.  Deep Dive on #1 (Performance).
          3.  Deep Dive on #2 (Baselines/Coercion).
          4.  Deep Dive on #3 (Limits of Authority - modifying the philosopher's point).
          5.  Red Herrings (What to cut).
          6.  "What would change my mind" (Triggers for re-ranking).
      *   *Key Argument:* Focus on the gap between *legal fiction* and *lived reality*.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about putting Coercion first. But the "Mental State vs. Act" is more fundamental. You can't determine if coercion invalidated consent if you haven't defined what the consent *was* in the first place. So, Performance goes first.
      *   *Correction on Philosopher Friend:* Don't dismiss her, but reframe. "Valid but not License-Granting" is essentially the "Limits of Authority" question. Can I consent to be enslaved? No. Why? Because consent has limits. That's more tangible than "moral magic."
      *   *Word Count Check:* Keep it tight. The user wants blunt advice, not a lecture.
      *   *Practicality:* Emphasize where law reform is actually happening (GDPR, NDAs, Sexual Offences).

  6.  **Final Polish:** Check against constraints. (No reading lists, no standard checklists, blunt tone). Ensure the "What would change your ranking" section is specific.

      *(Self-Correction on "Valid but not License-Granting"):* I need to be careful here. If the writer argues consent doesn't grant license, they risk arguing consent is meaningless. The nuance is: Consent transfers *permission*, but not *immunity from moral critique* or *legal validity if public policy forbids it*. I will frame this as "The Limits of Waiver."

      *(Final check on Coercion):* The "Baseline" problem is the specific philosophical name for this. I should use that term but explain it simply.

      *(Final check on Performance):* This is often called the "Communicative View" vs "Attitudinal View." I'll use the user's terms (Mental State vs Public Act) to avoid jargon.

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the blunt assessment you asked for. You have 6,000 words to dismantle a concept that holds up half the legal system. If you spend too much time on the metaphysics, you'll lose the room. If you spend too much time on case law, you'll write a briefing note.

  You need the structural faults. Here are the three load-bearing questions, ranked by their ability to unlock the others and their potential for real-world friction.

  ### 1. The Performance Problem: Mental State vs. Public Act
  **Rank:** #1 (The Foundation)
  **Why:** This is the engine room. If you don't settle what consent *is*, you cannot determine if it was violated.

  **The Conflict:**
  *   **The Attitudinal View:** Consent is an internal mental state (willingness).
  *   **The Performative View:** Consent is a communicative act (a signature, a "yes," a click).

  **Why it's load-bearing:**
  Almost every conflict you listed stems from the gap between these two.
  *   **Clickwrap:** You perform consent (click) without the mental state (reading). Is it valid? The law says yes (performative); your intuition says no (attitudinal).
  *   **Sexual Assault:** You have the mental state (no) but fail to perform the refusal (freeze response). Is it valid? The law is shifting toward "affirmative consent" (requiring performance), but juries often look for the mental state of the accused (did he *think* she consented?).
  *   **Medical:** A patient nods (performance) but is terrified and confused (no mental state).

  **Practical Impact:**
  If you argue for the **Attitudinal View**, you break the legal system. Contracts become unenforceable because nobody read them. Rape convictions become mind-reading exercises.
  If you argue for the **Performative View**, you protect commerce and legal certainty, but you sacrifice autonomy. You allow people to be bound by things they didn't understand.

  **How to write it:**
  Don't ask "which is right?" Ask: "Why does the law insist on the Performance view when we all live in the Attitudinal one?" This explains the GDPR fatigue, the NDA regret, and the #MeToo misunderstandings in one stroke. It forces the reader to admit that "consent" in law is often just a liability shield, not a protection of will.

  ### 2. The Baseline Problem: Coercion and "No Real Choice"
  **Rank:** #2 (The Pressure Point)
  **Why:** This determines when a "choice" is actually a command. It is the most litigated and legislated frontier right now.

  **The Conflict:**
  *   **Moral Entitlement Baseline:** You are coerced if you are worse off than you have a *right* to be. (e.g., A doctor withholding treatment unless you sign an NDA is coercive because you have a right to care).
  *   **Pre-Interaction Baseline:** You are coerced only if you are worse off than you were *before the offer*. (e.g., The job offer is grim, but you were unemployed before, so it's not coercion, it's just a lousy option).

  **Why it's load-bearing:**
  This settles the "exploitative but legal" category.
  *   **NDAs/Settlements:** Is it coercive to make a harassment victim sign an NDA to get a payout? Under the Pre-Interaction baseline, no (they get money they wouldn't otherwise have). Under Moral Entitlement, yes (they are being denied public justice they are owed).
  *   **Plea Bargains:** Is a 10-year sentence offer coercive when the trial risk is life imprisonment?
  *   **Gig Economy:** Is the algorithm coercive?

  **Practical Impact:**
  This is where law reform is actually happening. The UK and EU are moving to ban NDAs in harassment cases. The FTC is banning non-competes. This is the Baseline Problem in action. If you can articulate *why* these are coercive (shifting the baseline from "market offer" to "moral entitlement"), you give reformers the vocabulary they need.

  **How to write it:**
  Focus on the "Hard Choice" vs. "No Choice" distinction. Most law treats hard choices as valid consent. Your piece should challenge where the line is drawn. This is the most "quote-worthy" section for policymakers.

  ### 3. The Limits of Authority: What Can Consent Actually Do?
  **Rank:** #3 (The Ceiling)
  **Why:** This addresses your philosopher friend's point ("Valid but not License-Granting") but makes it tractable.

  **The Conflict:**
  *   **The Magic View:** Consent transforms the moral quality of an act. (Sex is rape without consent, but permissible with it).
  *   **The Limit View:** Consent has boundaries. Some things cannot be consented to, regardless of willingness. (You cannot consent to slavery, to being eaten, to gross medical negligence, or arguably to waiving certain statutory rights).

  **Why it's load-bearing:**
  It stops the piece from becoming "consent is everything." It acknowledges that consent is a *mechanism*, not a *panacea*.
  *   **Medical:** You cannot consent to a doctor amputating your healthy leg (in most jurisdictions). Why? Because consent doesn't override bodily integrity public policy.
  *   **Digital:** You cannot "consent" to waive GDPR rights in some contexts. The law says your consent is void *ab initio*.
  *   **BDSM/Harm:** The limits of consent to physical harm vary wildly by jurisdiction.

  **Practical Impact:**
  This protects the reader from the idea that "they signed it, so it's fine." It validates the feeling that some contracts are void even if signed. It shifts the burden from the *consenter* to the *requester*.

  **How to write it:**
  Frame this as "The Inalienable Rights" argument. If consent were truly sovereign, we could sell ourselves into slavery. We can't. Therefore, consent is not absolute. This creates a natural ending for the piece: Consent is not a magic wand; it is a key that only opens certain doors.

  ---

  ### The Red Herrings (Cut These)

  **1. Competence (Threshold vs. Sliding Scale)**
  *   **Verdict:** **Dead End.**
  *   **Why:** The law has largely settled this. It *is* a sliding scale (risk-sensitive capacity). A child can consent to a plaster but not chemotherapy. This is well-trodden ground in medical law (Gillick competence). Unless you have a specific new case study, this is technical nuance that won't shift the needle on the broader thesis. It bores general readers and doesn't change the "shared meaning" problem.

  **2. Deception Thresholds (Fraud in the Factum vs. Inducement)**
  *   **Verdict:** **Distraction.**
  *   **Why:** This is a legal distinction without a popular difference. People feel lied to in both cases. The law distinguishes between "lying about what the act *is*" (voids consent) and "lying about the *benefits*" (doesn't void consent). While interesting, it's a sub-clause of the Performance Problem. Don't give it a dedicated section; weave it into the "Mental State" argument.

  **3. "Valid but not License-Granting" (As a standalone metaphysical point)**
  *   **Verdict:** **Too Abstract.**
  *   **Why:** Your philosopher friend is theoretically right, but practically dangerous for a feature piece. If you argue consent can be valid but the act still wrong, you risk undermining the concept of consent entirely. Readers will hear: "Consent doesn't matter."
  *   **Fix:** Use the **Limits of Authority** (#3 above) instead. It captures the same intuition (some things are off-limits) without the metaphysical baggage.

  ---

  ### What Would Change My Ranking?

  **1. Move "Coercion/Baselines" to #1 if:**
  You find a major, pending Supreme Court case or legislative bill in your jurisdiction specifically regarding **economic coercion** (e.g., a major ruling on non-competes or settlement NDAs). If the political moment is specifically about *power imbalances* rather than *autonomy*, the Baseline Problem becomes the story.
  *   *Trigger:* A major ruling on "constructive dismissal" or "unconscionable bargains."

  **2. Move "Performance" to #2 (and Coercion to #1) if:**
  You discover that the "Affirmative Consent" standard (Yes Means Yes) is failing in practice. If you find data showing that requiring performance (verbal yes) is creating false security or not reducing assault rates, the Performance Problem becomes a critique of current reform rather than the foundation.
  *   *Trigger:* New criminology data showing "Yes Means Yes" laws have not changed conviction rates.

  **3. Drop "Limits of Authority" entirely if:**
  You find that the "void consent" categories are shrinking. If the trend is toward *more* waiver rights (e.g., patients allowed to sign off on more risks, consumers allowed to waive more privacy), then the "Ceiling" is rising, and the story is about the erosion of limits, not the existence of them.
  *   *Trigger:* Legislative trends expanding waiver rights in medical or consumer law.

  ### Final Advice on Structure

  Do not structure this by sector (Medical, then Sex, then Tech). Structure it by the **Three Questions**.

  1.  **The Definition (Performance):** Why the signature doesn't match the mind. (The Clickwrap/The Freeze).
  2.  **The Pressure (Baselines):** Why the choice doesn't match the freedom. (The NDA/The Plea Bargain).
  3.  **The Boundary (Authority):** Why the permission doesn't match the right. (The Waiver/The Harm).

  This allows you to jump between sectors in each section, proving your thesis that the *concept* is broken, not just the application.

  **One last blunt note:** Be careful with the "Valid but not License-Granting" angle. If you argue that consent can be valid but the act still wrongful, you invite the "Not All Men" / "Victim Blaming" crowd to argue that "consent is irrelevant." Ensure you frame it as **Public Policy Limits** (the state forbids it) rather than **Moral Ambiguity** (it's kinda wrong). The former is law reform; the latter is a culture war you don't have space for.

  Go with **Performance** as your lead. It's the most visceral. Everyone has clicked "I Agree" without reading. Everyone has said "I'm fine" when they weren't. Start there.
