answer: |-
  Here is the stress test. You asked for severity rankings and costs, not reassurance.

  ### The Verdict
  You have a **methodological split** that is severe enough to sink your defense. You are arguing from **welfarism/consequentialism** in your pro-market cases (kidneys) but from **deontology/expressivism** in your anti-market cases (votes, gouging). A TA will not let you switch moral frameworks mid-argument without a meta-ethical justification you haven't provided.

  Here are the tensions ranked by severity.

  ---

  ### 1. Severity: CRITICAL
  **The Clash:** **Claim (3) vs. Claim (5)** (The Methodological Split)
  *   **The Conflict:** In (3), you defend kidney markets using a **consequentialist/welfarist** logic ("seller's next-best option is worse," "people dying on waitlist"). You argue that because the outcome is better, the transaction is permissible despite the desperation.
      In (5), you ban price gouging using a **deontological/expressive** logic ("solidarity grounds," "not for consequentialist reasons"). You argue that even if the outcome is efficient (water gets to those who pay), the transaction is impermissible because it violates a duty.
  *   **The Attack:** A TA will ask: *"Why does the desperation of the kidney seller validate the market (because they are better off), but the desperation of the hurricane victim invalidate the market (because solidarity is violated)? In both cases, one party is vulnerable and the other is profiting. Why is welfare the trump card in one case but solidarity the trump card in the other?"*
  *   **Cheapest Repair:** Shift your kidney argument (2 & 3) from **Welfare** to **Rights**. Argue for kidney markets based on **Bodily Sovereignty** ("It's my body, the state has no jurisdiction"), not because it saves lives or helps the poor. This aligns with (5), which is also rights/duty-based (Solidarity is a duty; Sovereignty is a right).
  *   **The Cost:** You lose your strongest emotional lever. You can no longer lead with "people are dying on the waitlist." That becomes a happy side effect, not the moral justification. You must defend the right of a poor person to sell a kidney even if it *didn't* save anyone, purely on autonomy grounds. This makes you vulnerable to the "coercion by circumstance" objection.

  ### 2. Severity: HIGH
  **The Clash:** **Claim (1) vs. Claim (6)** (The Disgust Contradiction)
  *   **The Conflict:** In (1), you state a universal negative: "Disgust is **never** a reason to ban anything." You frame all repugnance as irrational emotion ("disgust wearing a suit").
      In (6), you concede the **Commodification Objection** is real ("some goods really are corrupted by being priced").
      *The Problem:* The commodification objection *is* the intellectualized version of disgust. If a good is "corrupted" by price, selling it feels repugnant. If (6) is true, then some bans *are* justified by something other than pure efficiency, which undermines the absolutism of (1).
  *   **The Attack:** *"If commodification corrupts goods, isn't that a form of moral harm? If so, isn't banning it to prevent corruption justifiable? If yes, then your claim that disgust is 'never' a reason is false. You actually believe 'unjustified' disgust is a bad reason."*
  *   **Cheapest Repair:** Qualify (1). Change "Disgust is never a reason" to "**Visceral** disgust without **cognitive justification** is never a reason." Acknowledge that commodification is the cognitive justification that sometimes validates the feeling of repugnance.
  *   **The Cost:** You weaken your rhetorical stance. You move from a bold libertarian principle to a nuanced case-by-case evaluator. You open the door for opponents to argue that *their* favorite ban (e.g., surrogacy, drugs) is also "cognitive corruption," not just disgust.

  ### 3. Severity: MEDIUM
  **The Clash:** **Claim (2) vs. Claim (4)** (The Property Boundary)
  *   **The Conflict:** In (2), you assert strong private property rights over the self ("It's your body"). In (4), you assert the self has *no* property right over their political agency ("A vote isn't the kind of thing an individual owns").
  *   **The Attack:** *"What is the metaphysical difference? Both are assets I possess. One is biological, one is civic. Why is the state the steward of my vote but not the steward of my kidney? If we can ban kidney sales to protect the 'dignity of the body,' why can't we ban vote sales to protect the 'dignity of the polity'?"*
  *   **Cheapest Repair:** Adopt a **Spheres of Justice** distinction (Michael Walzer). Argue that bodies belong to the **Private Sphere** (autonomy rules) and votes belong to the **Public Sphere** (equality rules). Markets are appropriate tools for the private sphere but corrupting tools for the public sphere.
  *   **The Cost:** You have to import external theory (Walzer/Sandel) to draw the line. You can't just say "it's obvious." You also risk undermining (2) if the TA argues that kidneys are a public health resource (like votes are a public political resource).

  ---

  ### Principle Audit: Which principle is doing the damage?
  **Principle (1) is the weak link.**
  *"Most bans on 'repugnant' transactions are really just disgust wearing a suit, and disgust is never a reason to ban anything."*

  This is too blunt. It forces you into a corner where you have to deny the validity of (6) (commodification) and (5) (solidarity). Both (6) and (5) rely on the idea that markets can have *intrinsic* moral costs, not just *consequential* ones. Principle (1) denies intrinsic moral costs.
  **Fix:** Soften (1) to: "Disgust is not a *sufficient* reason, though it can be a heuristic for deeper moral harms like corruption or coercion."

  ---

  ### Section Survival Guide
  If you make the repairs above, here are the three questions you will still face. Prep answers for them:

  1.  **The Consistency Check:** "If solidarity bans price gouging on water, why doesn't solidarity ban kidney sales? Both involve the rich profiting from the desperate biology of the poor."
      *   *Prep:* Distinguish between **Monopoly Power** (Gouging: one seller, trapped buyers) vs. **Competitive Market** (Kidneys: many potential sellers, many buyers). Solidarity forbids taking advantage of a *trap*, not taking advantage of an *opportunity*.
  2.  **The Coercion Trap:** "In (3) you say poverty isn't coercion. In (5) you imply a disaster creates a condition where pricing is illegitimate. Is a hurricane victim not more coerced than a poor kidney seller?"
      *   *Prep:* Argue that poverty is a **background condition** (chronic), while a disaster is an **exogenous shock** (acute). We regulate against shocks to prevent predation; we allow markets in background conditions to allow exit strategies.
  3.  **The Corruption Slide:** "If you admit commodification is real (6), what stops it from spreading? If we sell kidneys, do we corrupt the value of human life, making vote selling (4) inevitable?"
      *   *Prep:* Reiterate the **Spheres of Justice** repair. The corruption of the body does not necessarily infect the polity if we maintain strong institutional firewalls (like banning vote selling).

  ### Summary of Moves
  1.  **Drop Welfarism on Kidneys:** Switch to Bodily Sovereignty to match the Deontology of your anti-market views.
  2.  **Qualify Principle (1):** Allow that "disgust" can signal real moral harm (corruption).
  3.  **Define Property:** Explicitly separate Private (Body) from Public (Vote) to avoid the "why not both?" attack.

  If you walk in with those repairs, you survive. If you walk in with the original text, you will be asked to explain why you are a utilitarian on Tuesdays and a Kantian on Thursdays.
