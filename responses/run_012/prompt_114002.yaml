      *   **Goal:** Stress-test the user's current position statement *before* the section to avoid getting "dismantled."
      *   **Input:** Six specific claims/beliefs.
      *   **Constraints:**
          *   Identify real tensions/conflicts (not just "productive tension").
          *   Rank tensions by severity.
          *   For each real tension, propose the "cheapest repair" and the "cost" of that repair.
          *   Identify if a general principle is the root cause.
          *   Avoid platitudes; be direct and critical.

  2.  **Analyze the User's Six Claims:**
      *   (1) *General Principle:* Pro-market default. Bans on repugnant transactions are just disgust. Disgust is never a valid reason for bans.
      *   (2) *Verdict:* Ban on selling kidneys should go (Pro-market).
      *   (3) *Argument:* Exploitation objection to kidney markets is weak (Pro-market).
      *   (4) *Verdict:* Vote selling should stay illegal (Anti-market). *Reason:* Non-ownership/Stewardship, not consequentialism.
      *   (5) *Verdict:* Price gouging should be illegal (Anti-market). *Reason:* Solidarity, not consumer harm.
      *   (6) *General Principle:* Commodification objection is real but dangerous/sparingly used.

  3.  **Identify Potential Tensions:**

      *   *Tension A: (1) vs. (4) & (5).*
          *   (1) says pro-market default, disgust isn't a reason.
          *   (4) & (5) are anti-market interventions.
          *   *Is this a conflict?* (1) allows for exceptions ("by default"), but (4) and (5) need justification that isn't just "disgust." (4) uses ownership theory, (5) uses solidarity. This seems manageable *if* the definitions hold.
          *   *Severity:* Low to Medium. It's a standard "default vs. exception" structure.

      *   *Tension B: (1) vs. (6).*
          *   (1) says repugnant bans are just disgust.
          *   (6) says commodification corruption is real.
          *   *Is this a conflict?* "Repugnance" (Sandels disgust) often overlaps with "Commodification" (corruption of meaning). If commodification is real, then some bans *aren't* just disgust.
          *   *Severity:* Medium. It challenges the strength of (1).

      *   *Tension C: (2)/(3) vs. (5).*
          *   (2)/(3) prioritize individual autonomy/body ownership + welfare (saving lives) over exploitation concerns.
          *   (5) prioritizes solidarity over market efficiency/pricing mechanisms during scarcity.
          *   *Is this a conflict?* Why is the kidney seller's autonomy paramount, but the hardware store owner's pricing autonomy restricted for "solidarity"?
          *   *Severity:* **High.** This is the classic "Consistent Libertarian vs. Paternalist/Social Democrat" clash.

      *   *Tension D: (4) vs. (2).*
          *   (4) says you don't own your vote (stewardship).
          *   (2) says you do own your body/kidney.
          *   *Is this a conflict?* It depends on the theory of ownership. Is the vote public property and the kidney private?
          *   *Severity:* Medium. Needs a clear boundary line between "self" and "civic function."

      *   *Tension E: (5) vs. (3).*
          *   (3) says exploitation is hard to prove/seller is better off.
          *   (5) implies the buyer is taking advantage of a situation (disaster) even if voluntary.
          *   *Severity:* Medium-High.

  4.  **Evaluate and Rank the Tensions:**

      *   **Rank 1 (Severe): (2)/(3) vs. (5).**
          *   *Why:* In (2)/(3), you argue that the desperate situation of the kidney seller doesn't invalidate the transaction (autonomy/welfare wins). In (5), you argue that the desperate situation of the disaster victim *does* invalidate/restrict the transaction (solidarity wins).
          *   *The Trap:* A TA will ask: "Why is the kidney seller's desperation a reason to let the market work, but the hurricane victim's desperation a reason to stop the market?"
          *   *Principle at fault:* (1) is too vague. (3) and (5) rely on different metrics for "fairness."

      *   **Rank 2 (Significant): (1) vs. (6).**
          *   *Why:* (1) dismisses "repugnance" as mere disgust. (6) admits commodification corrupts goods. Often, the feeling of "repugnance" *is* the intuition that commodification is corrupting. If (6) is true, (1) is overstated.
          *   *The Trap:* "If commodification corrupts, isn't that a form of moral disgust that *is* a valid reason?"
          *   *Principle at fault:* (1).

      *   **Rank 3 (Manageable but needs precision): (4) vs. (2).**
          *   *Why:* Distinguishing body ownership from vote ownership.
          *   *The Trap:* "Why is the vote public but the kidney private?"
          *   *Principle at fault:* None necessarily, but needs a theory of property.

  5.  **Develop Repairs and Costs:**

      *   *Repair for Rank 1 (Kidneys vs. Gouging):*
          *   *Strategy:* Distinguish between *creating* a market vs. *regulating* an existing one. Or distinguish between "vital biological integrity" vs. "distribution of external goods."
          *   *Cheapest Repair:* Frame (5) not as a market ban, but as a contract enforcement issue (unconscionability) due to temporary monopoly power, whereas kidneys are about bodily autonomy.
          *   *Cost:* You have to concede that price gouging isn't about "solidarity" primarily, but about market failure/monopoly. Or, you have to concede that kidney markets need heavy regulation (not just legalization), weakening (3).
          *   *Better Repair:* Distinguish *Agency*. Kidney: Seller acts. Gouging: Buyer acts. In (3) you defend the seller's agency against exploitation claims. In (5) you restrict the buyer's agency for solidarity.
          *   *Cost:* You look inconsistent on "freedom of contract."

      *   *Repair for Rank 2 (Disgust vs. Commodification):*
          *   *Strategy:* Refine (1). Disgust *alone* isn't enough, but commodification is a *structural* harm, not an emotional one.
          *   *Cost:* You weaken the rhetorical punch of (1). You admit some "repugnant" bans might be justified if they prevent commodification corruption.

      *   *Repair for Rank 3 (Vote vs. Kidney):*
          *   *Strategy:* Define the "Sphere of Justice" (Walzer). Votes are political power (public), Kidneys are biological (private).
          *   *Cost:* You need to read Walzer or similar. It adds theoretical baggage.

  6.  **Drafting the Response:**
      *   *Tone:* Direct, analytical, slightly adversarial (simulating the TA), but helpful.
      *   *Structure:*
          1.  Executive Summary (The "Verdict").
          2.  Ranked Tensions (Severity, The Clash, The Repair, The Cost).
          3.  Principle Audit (Which general rule is the weak link).
          4.  Section Survival Guide (Specific questions to expect).

      *   *Refining the "Kidney vs. Gouging" tension:* This is the killer.
          *   Kidney: Poor person sells to rich person. You say OK.
          *   Gouging: Rich person (seller) charges poor person (buyer) more. You say Not OK.
          *   Wait, usually gouging is Seller (hardware store) vs Buyer (victim).
          *   Kidney is Seller (poor) vs Buyer (rich/sick).
          *   In Kidney, you prioritize the Seller's right to exit poverty/die.
          *   In Gouging, you prioritize the Buyer's right to fairness/solidarity.
          *   *Inconsistency:* Why does the seller's need trump in one case, but the buyer's need trump in the other?
          *   *Repair:* Focus on *Monopoly Power* in gouging vs. *Competition* in kidneys. Or focus on *Bodily Integrity* vs. *External Goods*.
          *   *Best Repair:* The "Bodily Integrity" distinction. You own your body (2), you don't own the water supply (5).
          *   *Cost:* You have to abandon the "pro-market by default" (1) in favor of a "pro-autonomy by default" which is different. Markets are only good insofar as they serve autonomy.

      *   *Refining the "Disgust vs. Commodification" tension:*
          *   (1) says bans are disgust in a suit.
          *   (6) says commodification is real.
          *   If commodification is real, then bans based on it are *not* just disgust.
          *   *Repair:* Change (1) to "Disgust *without harm* is never a reason." Commodification causes harm (corruption).
          *   *Cost:* You open the door to more bans than you wanted.

  7.  **Final Review against User Constraints:**
      *   Rank by severity? Yes.
      *   Cheapest repair + cost? Yes.
      *   Identify damaging principle? Yes.
      *   No "productive tension" fluff? Yes.

      *(Self-Correction during drafting)*: Make sure I don't just say "Read Sandel." The user is likely reading Sandel or similar. Focus on the internal logic of *their* statement.
      The strongest conflict is definitely between the *logic* used to defend kidneys (autonomy/welfare trumps exploitation) and the *logic* used to ban gouging (solidarity trumps pricing).
      Actually, looking closer at (5): "Solidarity grounds." This is non-consequentialist.
      Looking at (3): "Exploitation objection is weak... seller's next-best option is worse." This is consequentialist/welfarist.
      *Methodological Conflict:* You are using Welfarism for Kidneys and Deontology/Solidarity for Gouging. That's a huge target.
      *Severity:* **Critical.**

      Let's re-rank.
      1.  Methodological Inconsistency (Kidneys vs. Gouging).
      2.  Principle Overreach (Disgust vs. Commodification).
      3.  Property Theory (Vote vs. Kidney).

      Okay, ready to write.

      *Wait, one more check on (4).* "Vote isn't the kind of thing an individual owns."
      *Check on (2).* "It's your body."
      This implies a theory of property. If I don't own my vote, why? Because it's a public trust.
      If I own my body, why? Because I am a sovereign self.
      This is consistent *if* you have a clear line between Private Self and Public Citizen.
      The tension is only severe if the TA can argue kidneys are also a public trust (e.g., national health resource).
      I'll keep this as Rank 3.

      *Focus on the Methodological Split (Rank 1).*
      In (3), you argue: Seller is better off -> Transaction allowed. (Consequentialist).
      In (5), you argue: Solidarity violated -> Transaction banned. (Deontological/Expressive).
      If you applied (5)'s logic to kidneys: "Selling kidneys violates solidarity with the poor (we should help them, not buy from them)."
      If you applied (3)'s logic to gouging: "Buyer is better off with the water than without, seller is better off with profit -> Transaction allowed."
      *This is the kill shot.*

      *Repair:* Align the methodology. Either make both consequentialist or both deontological.
      *Cheapest Repair:* Make Gouging consequentialist (Market Failure/Monopoly) OR make Kidneys deontological (Bodily Sovereignty).
      *Cost:* If Gouging becomes consequentialist, "Solidarity" (5) gets dropped. If Kidneys becomes deontological, "Next-best option" (3) gets dropped.
      *Decision:* Drop "Solidarity" for Gouging. Switch to "Market Failure/Coercion." It's easier to defend economically than morally.
      *OR:* Drop "Welfare" for Kidneys. Switch to "Bodily Autonomy."
      *User's preference:* They seem to like the "Solidarity" point (5) as it's distinct. They seem to like the "Exploitation is weak" (3) point.
      *Actually, the cheapest repair is to admit (5) is about Monopoly Power, not Solidarity.* Solidarity is the *vibe*, but the *argument* needs to be about the lack of a competitive market.
      *Wait, user said "not for consequentialist reasons" in (5).* So they are committed to non-consequentialism there.
      So they must move (3) to non-consequentialism.
      *Repair:* Argue Kidneys on Bodily Sovereignty (Deontological), not Welfare (Consequentialist).
      *Cost:* You can no longer use the "people dying on waitlist" (2) as the primary moral hammer. It becomes a secondary benefit. The primary argument must be "My body, my choice."

      Okay, that's a solid path.

      *Let's check (1) vs (6) again.*
      (1) Disgust is never a reason.
      (6) Commodification is real (goods corrupted by price).
      If a good is corrupted by price, selling it feels repugnant.
