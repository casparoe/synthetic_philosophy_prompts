answer: |-
  **Dialogue: The Semantics of "Grel"**

  **Participants:**
  *   **A:** Defends a Semantic Account (Derogatory content is conventional/semantic).
  *   **B:** Defends a Pragmatic Account (Derogatory content is a matter of use/norms).

  **Setting:** An office hour discussion regarding the upcoming seminar on the fictional term "grel."

  ***

  **A:** Let's look at the baseline data for "grel." We have a minimal pair in Fact 8: "Mara is a grel" versus "Mara is a Calderan." They share truth-conditional content regarding group membership, but only the former carries contempt. If we treat "grel" as semantically neutral and attribute the contempt to pragmatics, we struggle to explain why that contempt is so stable. It feels encoded.

  **B:** Stability doesn't entail semantic encoding. Consider Fact 5 and Fact 6. In Calderan communities, "grel" is reclaimed; in linguistics papers, it's descriptive. If the contempt were part of the semantic value—say, a Conventional Implicature (CI) or a presupposition—how does it vanish in these contexts? Semantic content is supposed to be context-invariant. If "grel" semantically encodes contempt, a Calderan using it in solidarity is speaking falsely or contradicting themselves.

  **A:** Not necessarily. We can treat the semantic content as context-sensitive. Think of it as a lexical entry that includes a parameter for *speaker affiliation*. If the speaker is an out-group member, the CI triggers; if in-group, it remains dormant. But look at Fact 2: "Mara is not a grel." This denies membership, yet competent speakers report the contempt survives. This is projection. Pragmatic implicatures typically cancel under negation. If I say, "I didn't manage to solve the problem," I don't imply I tried. But "Mara is not a grel" still implies Mara is the *kind of person* one would call a grel. That suggests the derogatory content is a presupposition or a CI, which projects out of the scope of negation.

  **B:** I grant that the offense projects, but I deny that requires semantic machinery. Pragmatic presuppositions project too. If I say, "I don't regret stopping the treatment," it presupposes I stopped. That's pragmatic. More importantly, consider the mechanism of the offense. On your view, the word *itself* carries the poison. On my view, the word is a marker of a prohibited social act. When a speaker uses "grel," they invoke a history of discriminatory usage. Under negation (Fact 2), you are still invoking that history to deny the predicate. You are still engaging with the slur. The offense isn't in the truth conditions; it's in the act of deploying the term.

  **A:** But if it's just the act, why does Fact 3 hold? "If Mara is a grel, she will probably be unreliable." The speaker isn't asserting Mara is a grel. They aren't even performing the speech act of labeling her. Yet the contempt seems to linger in the conditional. On a pragmatic view, the speaker is merely hypothesizing. If the derogation is a matter of speaker commitment or social norm violation, it should be suspended in the antecedent. But it isn't. This suggests the derogatory content is part of the propositional material being evaluated, even hypothetically. It behaves like a semantic constant.

  **B:** It behaves like a semantic constant because the *convention of use* is constant. But let's press your semantic view on Fact 4: "The dean said that the grels are lazy." This is indirect report. If "grel" semantically encodes contempt, then by reporting the dean's speech using "grel," am I not also expressing contempt? The data says the sentence *can* report what the dean said and seems to convey the dean endorsed the derogation. But it doesn't necessarily commit *me*, the reporter, to that view. If the contempt is semantic content of the term I'm uttering now, how do I distance myself?

  **A:** That's a standard problem for CIs in reported speech, but not fatal. We can say the CI attaches to the reported attitude. I am reporting that the dean asserted a content containing a derogatory perspective. The contempt is attributed to the dean. However, notice the cost on your side. If "grel" is semantically neutral, why does Fact 7 hold? "The word 'grel' is a slur." This is a mention, not a use, and it's non-derogatory. You agree there. But if the pragmatics are driven by social norms of *use*, why does mentioning the word not trigger the norm?

  **B:** Because mentioning isn't using. The norm prohibits *applying* the term to the group in a derogatory context. Mentioning analyzes the word. But this brings us back to Reclamation (Fact 5). This is your biggest hurdle. If "grel" semantically encodes contempt, reclamation requires changing the semantics. That takes generations. Yet, within a specific community context, the force flips instantly. That suggests the force is determined by the *context of utterance* and the *identity of the speaker*, not the lexical entry. You'd need to posit massive ambiguity: *grel*₁ (slur), *grel*₂ (neutral), *grel*₃ (solidarity). That violates parsimony.

  **A:** Parsimony is cheap if it buys explanatory power. My account explains why an out-group speaker *cannot* use "grel" non-derogatorily, even with good intentions. If I, a non-Calderan, try to use "grel" in solidarity, I fail. It comes out derogatory. Why? Because the semantic value is fixed by the broader linguistic community's conventions, not my private intent. Your pragmatic view relies heavily on speaker intent or local norms. If a non-Calderan accidentally uses "grel" thinking it's neutral, they have still offended. On your view, if the intent wasn't derogatory, where did the harm come from? If it's just a violation of a norm, it should be corrigible by saying, "I didn't mean it that way." But the offense remains.

  **B:** I distinguish between *speaker meaning* and *social meaning*. The speaker might not intend derogation, but the term carries a social history that overrides intent. That's not semantics; that's the pragmatics of power. However, you claim your semantic view handles the "accidental use" better. Does it? If "grel" semantically encodes contempt, then when the non-Calderan uses it, they express contempt. But what if they are quoting a text, or using it in a philosophical example like we are now? We are using "grel" constantly. Are we expressing contempt toward Calderans?

  **A:** No, because we are in a special context—Fact 6, the descriptive/academic use. We can treat this as a "linguistic mode" where we refer to the word's properties rather than using it to pick out individuals. Or, we treat the semantic content as having a variable that is bound by the context. In a seminar, the variable is set to 'neutral analysis'. In the street, it's set to 'derogatory'.

  **B:** But then your "semantic content" is doing no work. If the value shifts entirely based on social context and speaker identity, you've essentially admitted the force is pragmatic. You're just labeling the pragmatic mechanism "context-sensitive semantics." Let's look closer at Fact 4 again. "The dean said that the grels are lazy." If I say this, and I am not a Calderan, do I offend? The data says it *seems* to convey the dean endorsed it. But if I use the word "grel," and your theory says "grel" semantically encodes contempt, then *I* am expressing contempt in the matrix clause. To avoid this, you have to say the CI is "exported" to the dean. But why? Why doesn't it attach to me, the utterer?

  **A:** Because the syntax of indirect speech allows the embedding verb to scope over the expressive content. "Said that..." creates an opacity. The contempt is part of *what was said*. But this requires a complex semantics of attitude reports. I admit that cost. I pay it to preserve the intuition that the word *itself* is dangerous. You, conversely, have to explain why the word is dangerous even when no one intends harm. You appeal to "social history." But how does history get into the sentence? If I say "Mara is a grel" in a vacuum, with no audience, no history, does it offend?

  **B:** There is no vacuum. Language is inherently social. But let's push your semantic view on Fact 5 again. Reclamation. If a Calderan says, "I'm proud to be a grel," they are asserting pride in the group. If "grel" semantically encodes contempt, they are asserting pride in being [Calderan + Contemptible]. That's incoherent. They aren't asserting they are contemptible. They are stripping the contempt. If semantics is compositional, the output should be contradictory. The fact that it isn't suggests the contempt was never in the composition to begin with. It was a layer of social practice that they have opted out of.

  **A:** I would argue they are shifting the reference of the expressive component. They are keeping the group reference but altering the expressive value. But I concede this requires a dynamic semantics. However, consider the cost on your side regarding Fact 2 and 3. You say the contempt projects because of "conventions of use." But conventions of use are defeasible. If I say, "I'm not using 'grel' as a slur, but as a technical term," in a normal conversation, does the offense vanish? Usually, no. The semantic account explains this rigidity: the meaning is locked in. Your account suggests I could talk my way out of the slur by clarifying my pragmatic intent. But the data suggests the word burns regardless of the disclaimer.

  **B:** It burns because the social norm is stronger than the individual disclaimer. But that's a fact about sociology, not semantics. Here is the crux: If we teach students that "grel" semantically encodes contempt, they might think the harm is in the *proposition*. If we teach them it's a pragmatic norm, they see the harm is in the *action*. For Fact 8, "Mara is a Calderan" removes the contempt. Why? Because "Calderan" lacks the history of prohibition.
  My worry is that your semantic view reifies the slur. It makes the derogation an intrinsic property of the sound pattern. My view makes it a property of the *deployment*. This matters for Fact 6. In linguistics papers, we deploy it without derogation. If it were semantic, we would need a special "mention" operator everywhere. But we don't. We just use it. This suggests the default is not semantic derogation, but pragmatic restriction.

  **A:** But if the default is pragmatic restriction, why is the restriction so hard to lift for out-group speakers? Why can't I, as a non-Calderan, decide to use "grel" neutrally today? Your view implies I could, if I could just establish a new local convention. But the data suggests I cannot. The constraint feels external to me. That points to a semantic constraint fixed by the linguistic community, not my local pragmatic choices.

  **B:** It feels external because the social consequences are external. But let's look at the theoretical resources we're spending. You are spending resources on complex lexical entries, context parameters, and special rules for projection and attitude reports to keep the content "in" the word. I am spending resources on a robust theory of social norms, speaker identity, and conversational context to keep the content "in" the world.
  You handle projection (Facts 2 & 3) better. I handle reclamation and descriptive use (Facts 5 & 6) better.
  The question for the seminar is: Is the "burn" of the word a feature of the tool, or a feature of how the tool is wielded?

  **A:** And whether a tool that burns whenever an out-group member wields it, but not when an in-group member wields it, is best described as having a "burn setting" or being "inherently hot."

  **B:** Precisely. If it's inherently hot, reclamation is magic. If it has a setting, then the setting is pragmatic. But then we must explain why the setting is so stubbornly fixed for some speakers.

  **A:** Then we agree on the data, but disagree on the locus of the explanation. I locate it in the conventional meaning (broadly construed to include CI). You locate it in the conventions of use.

  **B:** And neither of us can explain Fact 4 fully without admitting that reported speech creates a hybrid space where the reporter's voice and the subject's voice merge. If I say "The dean said the grels are lazy," am I reporting his words or his sentiment? If "grel" is semantic, I report the sentiment. If pragmatic, I might just be reporting the words, but the choice of word implicates *my* stance on his words.

  **A:** Which suggests that perhaps the distinction between semantic content and pragmatic force is less sharp here than in descriptive language. The "grel" data might show that for slurs, semantics and pragmatics are fused.

  **B:** Or that our categories are too rigid. But for the students, the lesson is that neither a pure truth-conditional semantics nor a pure Gricean pragmatics captures the full range of Facts 1 through 8. We need a theory that accommodates the rigidity of the offense for some users and the flexibility of reclamation for others.

  **A:** Agreed. We'll have them map the costs. My cost is lexical complexity. Your cost is explaining the inevitability of the offense.

  **B:** Let's see if they can find a third option. But for now, this tension is where the philosophy lives.
