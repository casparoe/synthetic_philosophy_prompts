      *Constraint Check:* I must not use bold text for emphasis. I must not use numbers. I must not use bullets.

      *Okay, ready to generate.*

      *Wait, one more thing:* The user mentioned INUS conditions. I should weave that in as a caution about complex causality without making the procedure too complex. The procedure needs to be usable in an hour. So keep the INUS reference as a boundary condition (i.e., if causes are too entangled, declare uncertainty).

      *Final plan:*
      1. Open with empathy and the core philosophical distinction.
      2. Detail the procedure step-by-step using transitional phrases.
      3. Apply to Case 1.
      4. Apply to Case 2.
      5. Apply to Case 3.
      6. Discuss limitations/misfires.
      7. Close.

      *Ensuring no formatting:* I will scan the final output for any accidental bolding or list structures.

      *Word Count:* Needs to be substantial enough to cover everything but not rambling.

      *Tone:* Professional, peer-to-peer.

      *Let's go.*
answer: |-
  Dear Colleague, I have drafted the following procedure based on the philosophical distinctions you raised, specifically designed to separate the factual question of causation from the normative question of blame and the systemic question of preventability, and I have written it as continuous prose so you can paste it directly into your report template or email it to the panel without needing to reformat it. The core problem you identified is that an omission is not an event in the world but a contrast between what happened and what might have happened, so any procedure must start by making that counterfactual explicit rather than hiding it behind clinical intuition. To run this in the room within an hour, you must enforce a strict sequence where the panel is not allowed to discuss blame until causation is settled, and not allowed to discuss prevention until fault is settled, because once the group starts thinking about how to stop this happening again they will inevitably convince themselves that someone must have caused it. The procedure begins by establishing the specific omission in plain language, requiring the panel to agree on a single sentence describing what was not done, such as antibiotics were not administered within one hour of trigger, and if the panel cannot agree on what was omitted because the notes are ambiguous, the procedure stops immediately and returns a finding of insufficient evidence to determine causation, which is itself a defensible outcome for the coroner. Once the omission is defined, the panel must move to the counterfactual test, which asks whether on the balance of probabilities the patient would have survived had the omitted act been performed, and this requires the clinicians in the room to estimate a probability rather than a certainty, using the standard of more likely than not, meaning greater than fifty per cent chance of survival. If the panel concludes that even with perfect care the patient would probably have died anyway, perhaps due to the severity of the underlying pathology, then the finding on causation is negative, and the procedure stops there for that case, recording that the omission did not cause the death, which protects the individual from blame for an outcome they could not alter. If the panel concludes that survival was more likely than not had the act been performed, then causation is established, and only then does the panel move to the question of fault, which asks whether the individual had a duty to act, the capacity to act, and whether the failure to act was reasonable in the circumstances. This is where you must explicitly flag to the panel that they are making a value judgment, because capacity is not just physical ability but includes whether the system allowed them to prioritize that task, so if the ward was understaffed to the point where observations were physically impossible to complete, the finding on fault should be negative even if causation is positive, and the report should state that the death was caused by the omission but the individual was not at fault. The final stage is preventability, which asks whether a change in system or protocol could reduce the risk of this omission occurring again, and this can be yes even if causation is no, because near misses matter for safety, but for the purpose of the mortality report you are looking for whether the specific death could have been prevented by a feasible change, and if the answer is yes, you record the recommended action without attaching it to a person.

  When you apply this to your first case regarding the woman with sepsis, the omission is clearly defined as the delay in antibiotic administration beyond the one-hour protocol trigger, so the panel passes the first step, but the second step requires them to estimate the probability of survival had antibiotics been given on time, and here you must force them to look at her physiological state at the time of the trigger versus the time of administration. If the clinical evidence suggests she was already in irreversible shock at the trigger time, the counterfactual test fails, and the procedure dictates you record that the delay did not cause the death, which may feel unsatisfactory to those wanting to enforce the protocol but is philosophically accurate, whereas if the evidence suggests she was stable enough that timely antibiotics would likely have saved her, causation is established. Only then do you ask if the registrar was at fault, and if the delay was due to them forgetting versus being held up in a resuscitation elsewhere, the capacity question changes, but if the protocol was breached without reasonable excuse, fault is assigned, and preventability is high because the protocol exists to prevent exactly this, so the report would read that the omission caused the death, the individual was at fault, and the system is capable of prevention through protocol adherence.

  For the second case involving the man with missed observations, the omission is the failure to record observations over four hours, but the counterfactual test is harder because you must ask whether earlier detection would have prevented the arrest, and if the arrest was sudden and unpreventable even with observations, causation is negated, but if the observations would have triggered an escalation that typically saves lives in this context, causation is positive. The crucial divergence comes at the fault stage, because you noted the escalation pathway was shut due to staffing, which means the individual nurse may have had a duty to observe but lacked the capacity to escalate, or perhaps lacked the capacity to observe due to patient load, and if the panel agrees the staffing levels made the omission unavoidable for a reasonable clinician, the finding must be that the omission caused the death but the individual was not at fault, shifting the blame to the trust staffing model, which is a difficult but necessary distinction for the board to see. Preventability here is high but requires system change rather than individual discipline, so the recommendation focuses on staffing ratios or pathway resilience rather than training the nurse.

  The third case with the IT configuration error is the one that will test the panel most, because the omission is the failure of the alert to fire, which is a system omission rather than a human one, and the counterfactual is straightforward since the alert was designed to prevent this exact deterioration, so causation is likely positive. When you reach the fault stage, the procedure requires you to identify an agent with capacity and duty, but the engineer has left and the current staff did not create the error, so there is no individual present who bears fault, and the procedure must allow you to write that the death was caused by the system failure but no individual is at fault, which directly contradicts the panel's desire to attach a name but is the only defensible position for the coroner. If the panel insists on finding fault, they are making a political decision to blame the current head of IT for inheriting the problem, which you should record as a value judgment rather than a factual finding, perhaps noting that accountability lies with the role rather than the person. Preventability is high through IT governance changes, so the action plan focuses on audit cycles for configuration rather than disciplining staff.

  You should be aware that this procedure will misfire in cases where causation is multifactorial and no single omission meets the more likely than not threshold on its own, which is where your memory of INUS conditions becomes relevant, because often an omission is only a cause in the presence of other factors, and if the panel tries to isolate one thing they may distort the reality. In those complex cases, the procedure should instruct the panel to record that multiple factors contributed and no single omission can be isolated as the primary cause, which is a confession of ignorance but more honest than forcing a single cause. Another limitation is that the counterfactual test relies on clinical consensus which can be biased by hindsight, so if the panel is divided on the probability of survival, the procedure should default to no causation rather than splitting the difference, because the burden of proof lies on establishing that the omission changed the outcome. Finally, this procedure cannot resolve conflicts where the trust board wants a name for public assurance but the facts do not support individual fault, and in those instances you must use the report to clearly state that the finding of no fault is a result of the evidence rather than a lack of investigation, protecting yourself and the panel from accusations of a whitewash. By separating the questions, you allow the report to say that a death was caused by care shortcomings without necessarily blaming a person, or that a person made an error without it causing death, and this precision is what will make the document defensible when it leaves your hands.
