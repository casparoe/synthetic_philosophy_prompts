prompt: |-
  I chair the monthly mortality and morbidity review at a mid-sized district general hospital — I'm a consultant paediatrician by background but the panel looks at adult deaths too, and every month we sit down with eight or ten cases where somebody thinks the care fell short. The question we keep getting stuck on is the one that decides everything downstream: did something that didn't happen cause the death? A dose not given, a round not done, a call not made, a referral not sent. We're all clinicians, nobody in the room has read any philosophy since medical school, and at the moment we resolve it by whoever feels strongest about the case, which means the night registrar who breached our sepsis protocol gets written up as having 'caused' a death even when the consultant who was actually on thinks the woman was going to die anyway. I did a philosophy module about fifteen years ago and I remember the but-for test, and something called an INUS condition (a necessary part of a set of conditions that was sufficient but not necessary for the outcome, or possibly the other way round, I'd have to check), and the point that an omission isn't an event at all, so calling one a cause is partly a decision about who to blame dressed up as a finding about the world. I'd like the proceedure to take that last point seriously instead of hiding it. The output goes into a report I have to sign, which goes to the trust board and occasionally to the coroner, so it needs to be defensible to people who weren't in the room.

  So: please write me a procedure the panel can actually run, in the room, in under an hour, on a case where the facts are already known and nobody is going to do more investigation. The questions to ask in order, what counts as a good enough answer to each, where the procedure stops and returns a flat no, and where it has to hand the decision back to the panel because the thing being asked is a value judgement rather than a fact — I'd rather it say 'this step is a judgement call' then pretend to derive it. It also has to keep three things apart that we currently mash together: whether the omission caused the death, whether anyone was at fault, and whether a death like this is preventable by us in future, because I suspect we're letting the third one drive the first.

  Then run it on three of our cases. One: a woman with sepsis whose first antibiotic was five hours late after the trigger, breaching our own protocol; she died about a day and a half later. Two: a man whose overnight observations were missed for four hours, on a ward whose escalation pathway had been shut for two nights running because of staffing; he arrested at six and died after resuscitation. Three, and this is the one where I suspect the procedure is going to tell us something the panel won't want to hear: an inpatient whose deterioration alert never fired because of a configuration error made two years ago by an engineer who has since left, and who died; the panel has already decided in the corridor that this is 'human error' and wants a name attached to it. I want the procedure to be able to say that nothing caused the death, or that something did but nobody was at fault, or that we can't tell from the notes — and to be clear about which of those is a finding and which is a confession of ignorance. And tell me where it will misfire and what it can't do. Please write it as plain continuous prose — no headings, no bullet points, no numbered steps, no bold, no tables — the way you'd write it up in an email to a colleague, since I'll be pasting it into our report template anyway and the template has its own formatting.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Consultant paediatrician chairing a monthly mortality and morbidity (M&M) review panel at a district general hospital.
      *   **Problem:** The panel struggles with causation, specifically regarding omissions (things not done). They currently rely on whoever feels strongest, leading to inconsistent blame (e.g., night registrar vs. consultant). They conflate causation, fault/blame, and preventability.
      *   **Goal:** A procedure to run in the room (under an hour) to determine causation of omissions, separating causation, fault, and preventability. It needs to be defensible for reports (trust board, coroner). It must acknowledge value judgments rather than hiding them. It needs to handle specific cases (sepsis delay, missed observations due to staffing, IT config error).
      *   **Constraints:** Plain continuous prose. No headings, no bullet points, no numbered steps, no bold, no tables. Write like an email to a colleague.
      *   **Key Philosophical Concepts:** But-for test, INUS conditions, omission vs. event, causation vs. blame.
      *   **Specific Cases to Test:**
          1.  Sepsis: Antibiotics 5 hours late, died 1.5 days later.
          2.  Missed Obs: Staffing issues, escalation pathway shut, arrested at 6, died.
          3.  IT Error: Alert didn't fire due to old config error, engineer left, panel wants a name.
      *   **Requirements:** Define questions, stopping points, where it returns "no", where it hands back to panel as judgment, separate causation/fault/preventability. Acknowledge limitations (where it misfires).

  2.  **Deconstruct the Philosophical/Practical Challenge:**
      *   *Causation of Omissions:* An omission isn't an event. To say "not doing X caused Y" implies "doing X would have prevented Y". This is counterfactual.
      *   *The "But-For" Test:* But for the omission, would the death have occurred? If yes (death still happens), no causation. If no (death avoided), causation established.
      *   *The Problem:* We can't know the counterfactual for sure. We need a standard of proof (balance of probabilities vs. certainty).
      *   *Fault/Blame:* Distinct from causation. You can cause death without fault (e.g., system error, reasonable clinical judgment). You can be at fault without causing death (near miss).
      *   *Preventability:* Distinct from causation. Could the system be changed to stop this happening again?
      *   *Procedure Design:* Needs to be linear, conversational, but rigorous. Needs to force the panel to stop and declare "we don't know" or "this is a value judgment".

  3.  **Drafting the Procedure (Mental Outline):**
      *   Start by setting the stage: separate the three questions (causation, fault, preventability).
      *   Step 1: Establish the omission. Was there a duty to act?
      *   Step 2: The Counterfactual (But-For). If the act had been done, would the patient likely have survived? This requires medical evidence/probability, not feeling.
      *   Step 3: Stopping rule. If survival wasn't likely even with action, causation is no.
      *   Step 4: If causation is yes, move to fault. Was the omission reasonable given circumstances? (System vs. Individual).
      *   Step 5: Preventability. Can we change the system?
      *   Apply to cases.
      *   Discuss limitations.

  4.  **Adhering to Constraints:**
      *   **NO HEADINGS.**
      *   **NO BULLET POINTS.**
      *   **NO NUMBERED STEPS.**
      *   **NO BOLD TEXT.**
      *   **NO TABLES.**
      *   **Continuous Prose.** (This is the hardest part. I need to use transitional phrases instead of structural markers.)
      *   **Tone:** Professional, collegial, email-like but dense enough for a report template.

  5.  **Drafting - Section by Section (incorporating into continuous text):**

      *   *Intro:* Acknowledge the difficulty. Propose the framework.
      *   *The Framework:* Start with causation. Define the omission clearly. Ask the counterfactual question. Define the threshold (more likely than not). If no, stop on causation.
      *   *Fault:* If causation exists, ask about duty and capacity. Was it possible to act? Was it reasonable?
      *   *Preventability:* Separate system learning.
      *   *Case 1 (Sepsis):* Apply the logic. Antibiotics late. Would earlier antibiotics saved her? Probability?
      *   *Case 2 (Obs/Staffing):* Missed obs. Staffing shortage. System vs Individual.
      *   *Case 3 (IT):* Config error. Old engineer. Causation yes, Fault? No individual culprit.
      *   *Limitations:* Where does this fail? Uncertainty, complex multifactorial causes.

      *Refining for Flow:* I need to make sure I don't accidentally create a list. I must use paragraphs and connecting sentences like "The first thing you must do is..." followed by "Once that is established..." rather than "1. Do this."

      *Refining for Philosophy:* Ensure the distinction between omission as cause vs. blame is clear. Use the INUS concept implicitly or explicitly but simply. The prompt mentions INUS, so I should acknowledge the complexity but keep the procedure practical. The key is the counterfactual.

      *Refining for the "Email" Style:* It needs to sound like I'm writing to the user. "Here is the procedure..." "When you run this..." "Regarding your three cases..."

      *Critical Check:* The prompt asks for the procedure *and* then to run it on the three cases *and* tell where it will misfire. All in one continuous prose block.

      *Drafting thought:* I need to be careful not to use bolding for emphasis. I need to ensure the transition between the procedure description and the case application is smooth.

      *Self-Correction on "Continuous Prose":* Does this mean one giant paragraph? Or just no structural markers? Usually, "plain continuous prose" allows paragraph breaks for readability but forbids lists/headers. I will use standard paragraphing to make it readable as an email, but avoid any formatting that looks like a structured document.

      *Wait, one more check:* "no headings, no bullet points, no numbered steps, no bold, no tables". Paragraph breaks are generally acceptable in prose. I will use them to separate the procedure description, the case applications, and the limitations, but I won't label them.

      *Content Check:* The user wants the procedure to be able to say "nothing caused the death" or "something did but nobody was at fault". I need to make sure the logic allows for "Causation: No" and "Fault: No".

      *Case 3 Specific:* The panel wants a name. The procedure needs to allow the conclusion "System failure, no individual fault."

      *Let's write.*

      (Mental Draft):
      Dear Colleague, Here is the protocol. It starts by isolating the omission. Then asks the counterfactual. If the answer is 'probably not', causation is negated. If 'probably yes', move to fault. Fault requires breach of duty + capacity. Then preventability. Now applying to Case 1. Sepsis. 5 hours late. Survival probability? If >50%, causation yes. Fault? Protocol breach. Case 2. Missed obs. Staffing. Causation? Maybe. Fault? Systemic. Case 3. IT. Causation yes. Fault? No individual. Limitations: Uncertainty, multifactorial.

      (Expanding to meet length and depth requirements while maintaining flow):
      I need to elaborate on the philosophical underpinnings within the prose so it feels robust enough for the coroner. I need to explain *why* we separate the steps. I need to be explicit about the "value judgment" moments.

      (Final Polish): Check against forbidden formatting again. No bold. No lists. Just text.

      *Wait, one nuance:* The user said "write it as plain continuous prose — no headings, no bullet points, no numbered steps, no bold, no tables — the way you'd write it up in an email to a colleague". This implies I should address the user directly.

      *Let's assemble.*

