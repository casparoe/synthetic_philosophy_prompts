answer: |-
  You can facilitate moral compromise without philosophical training by using this four-step protocol that separates non-negotiable core values from negotiable implementation details to identify trades where each side concedes on lower-priority items to secure higher-priority outcomes.

  ### The Moral Trade Protocol (90-Minute Session)

  **Phase 1: Core vs. Implementation Sort (20 Minutes)**
  *   **Facilitator Question:** "What specific outcome must happen for your principle to be respected, and what specific outcome must never happen?"
  *   **Sufficient Answer:** A concrete action or restriction (e.g., "The speaker must be allowed on stage" vs. "The speaker must not be given a platform"), not an abstract value (e.g., "Freedom" vs. "Justice").
  *   **Stop Condition:** If a party defines their core value as "Total victory" or "Complete absence of the other side's outcome," proceed to Phase 2 but flag high risk of impasse.
  *   **Facilitator Action:** Write two columns on a whiteboard: "Must Happen" and "Must Not Happen." Anything not listed here is defined as "Flexible."

  **Phase 2: Intensity Mapping (30 Minutes)**
  *   **Facilitator Question:** "Looking at the 'Flexible' list, which of these items would cause you significant distress if lost, and which are you indifferent about?"
  *   **Sufficient Answer:** Parties identify high-intensity preferences within the flexible zone (e.g., "We don't care about the venue, but we care deeply about the Q&A format").
  *   **Key Distinction:** Do not ask "How much is this worth?" Ask "Is this a dealbreaker compared to that?"
  *   **Facilitator Action:** Mark items with "High Intensity" or "Low Intensity" for each side. Look for asymmetry (Side A High/Side B Low vs. Side A Low/Side B High).

  **Phase 3: Package Building (30 Minutes)**
  *   **Facilitator Question:** "If Side A gets their High Intensity item, can Side B tolerate it if they get their High Intensity item in return?"
  *   **Sufficient Answer:** A conditional yes ("We can accept X provided Y happens").
  *   **Facilitator Action:** Construct a single package where Side A concedes on their Low Intensity items to secure Side B's Low Intensity items, while both secure their respective High Intensity items.
  *   **Stop Condition:** If no asymmetry exists (both sides have High Intensity on the same single issue), declare No Deal.

  **Phase 4: Integrity Veto (10 Minutes)**
  *   **Facilitator Question:** "Does signing this agreement require you to state something you believe is false or betray a core identity?"
  *   **Sufficient Answer:** A clear "No."
  *   **Stop Condition:** If either party says "Yes," the deal is a sellout. Terminate negotiation.
  *   **Final Output:** Written agreement listing specific actions, or a signed "No Deal" statement acknowledging irreconcilable differences.

  ---

  ### Case Study 1: Campus Speaker (Deal Produced)
  **Dispute:** Student Group A wants to host a speaker arguing for immigration restrictions. Student Group B argues this normalizes xenophobia and demands cancellation.
  **Time:** 90 Minutes.

  **Phase 1: Core vs. Implementation**
  *   **Group A Must Happen:** The speaker delivers a talk on campus.
  *   **Group B Must Not Happen:** The speaker appears unchallenged or legitimized as a standard academic voice.
  *   **Flexible:** Venue, format, moderation, accompanying events, signage.

  **Phase 2: Intensity Mapping**
  *   **Group A:** High Intensity on "Speech occurs." Low Intensity on "Q&A format" or "Introductory remarks."
  *   **Group B:** High Intensity on "Harm mitigation/Context." Low Intensity on "Speech occurs" (provided harm is mitigated).
  *   **Asymmetry Identified:** A cares more about the *event happening*; B cares more about the *context surrounding the event*.

  **Phase 3: Package Building**
  *   **Proposed Trade:** The speaker appears (A wins core). The event includes a mandatory 30-minute rebuttal by a designated critic immediately following, and the moderator reads a statement contextualizing the speaker's views as controversial (B wins core).
  *   **Check:** A gives up "unmoderated platform" (Low Intensity) for "platform exists" (High Intensity). B gives up "cancellation" (Low Intensity relative to harm reduction) for "harm reduction protocols" (High Intensity).

  **Phase 4: Integrity Veto**
  *   **Group A:** "Does this make us look like we censor?" No, the speech happens.
  *   **Group B:** "Does this make us look like we endorse him?" No, the rebuttal is mandatory and contextualized.
  *   **Result:** **Deal.** Written agreement specifies the rebuttal speaker and moderator script.

  ---

  ### Case Study 2: City Statue (No Deal/Stop)
  **Dispute:** Council Faction A wants to keep a statue of a founder who was a slaveholder in the town square. Faction B wants it removed because honoring a slaveholder is immoral.
  **Time:** 90 Minutes.

  **Phase 1: Core vs. Implementation**
  *   **Faction A Must Happen:** The statue remains in the public square (defined as "Historical Memory").
  *   **Faction B Must Not Happen:** The statue remains in a place of honor (defined as "Public Square").
  *   **Flexible:** Plaque text, landscaping, lighting, museum relocation.

  **Phase 2: Intensity Mapping**
  *   **Faction A:** High Intensity on "Public Square Location." Low Intensity on "Plaque text."
  *   **Faction B:** High Intensity on "Not in Public Square." Low Intensity on "Plaque text."
  *   **Asymmetry Identified:** None. Both sides have High Intensity on the exact same binary variable: Location.

  **Phase 3: Package Building**
  *   **Attempted Trade:** Move to museum with prominent display?
  *   **Faction A Response:** "That is erasure, not memory." (Core violated).
  *   **Faction B Response:** "That is still honor." (Core violated).
  *   **Stop Condition Met:** No asymmetry exists to enable trade. Both sides view the specific location as the embodiment of the moral principle.

  **Phase 4: Integrity Veto**
  *   **Facilitator Decision:** The procedure dictates stopping here. Continuing would force a split-the-difference (e.g., "Leave it up but turn it around") which both sides view as a sellout.
  *   **Result:** **No Deal.** Facilitator drafts a statement acknowledging the impasse and recommends a referendum or higher authority decision, as mediation cannot resolve incommensurable spatial claims.

  ---

  ### Limitations and Judgment Calls

  **Where This Procedure Misfires**
  1.  **Sacred Values:** If a party views a value as "sacred" (non-fungible), no trade is possible. The protocol identifies this in Phase 1 or 4, but it cannot fix it. If a party believes "Compromise is sin," the procedure must stop.
  2.  **Performative Conflict:** If one party benefits politically from *having* the conflict (e.g., fundraising, mobilization), they will fail the Integrity Veto or sabotage Phase 2. The facilitator must judge sincerity; the protocol assumes good faith.
  3.  **Power Imbalances:** If one side can simply impose their will (e.g., administration vs. students), the "No Deal" outcome is actually a victory for the powerful side. The protocol treats parties as equals; if they aren't, the "No Deal" conclusion may be unjust.

  **Where the Facilitator Must Decide**
  *   **Defining "Core":** Parties often claim everything is core. The facilitator must challenge them: "If you got X, would you still walk away?" If yes, it's core. If no, it's negotiable. This requires judgment.
  *   **The "Stop" Call:** In the Statue case, a mediator might feel pressure to keep talking. The procedure requires the discipline to end the session when Phase 2 shows no asymmetry. Continuing past that point turns the mediator into a coercive force pushing a sellout.
  *   **Language Policing:** In Phase 1, parties will use moral language ("Justice," "Freedom"). The facilitator must insist on operational language ("Speaker on stage," "Statue in park"). This translation is subjective and requires active intervention.
