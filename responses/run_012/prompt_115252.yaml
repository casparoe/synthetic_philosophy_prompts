  2.  **Deconstruct the Core Concept:**
      *   *Moral Trade vs. Split-the-Difference:* Split-the-difference assumes a single continuum (e.g., money, time) where meeting in the middle is the goal. Moral trade assumes different dimensions of value where Party A cares more about X than Y, and Party B cares more about Y than X. They swap concessions on X and Y to both gain utility without violating core principles.
      *   *The Challenge:* How to operationalize this without asking people to "price" their morals.
      *   *The Solution:* Focus on *conditions* and *mitigations* rather than *principles*. Ask "What would make this acceptable?" rather than "Is this right?"

  3.  **Drafting the Procedure (The "Moral Trade Protocol"):**
      *   *Step 1: Identify Core vs. Peripheral.* Distinguish non-negotiables (core) from negotiables (implementation/details).
      *   *Step 2: Map Valuations.* Find where intensity differs. (A cares deeply about X, moderately about Y; B cares deeply about Y, moderately about X).
      *   *Step 3: Generate Packages.* Bundle concessions.
      *   *Step 4: The Sellout Test.* Does this violate a core identity/value?
      *   *Step 5: Decision.*

      *Refining for a 90-minute session:* Needs to be tight.
      *   *Phase 1: Separation (15 mins).* Separate Principles from Practices.
      *   *Phase 2: Intensity Mapping (30 mins).* Identify "Must Haves" vs. "Nice to Haves" without ranking values directly.
      *   *Phase 3: Trading Zone (30 mins).* Construct packages based on differential intensity.
      *   *Phase 4: Integrity Check (15 mins).* Verify no core betrayal.

      *Key Questions:*
      *   "What specific outcome makes this principle real for you?" (Moves from abstract to concrete).
      *   "If you got X, could you tolerate Y?" (Tests tradeability).
      *   "Does this agreement require you to say something you believe is false?" (Sellout test).

