  **The Geometry of Settlement**

  **Under the Kalai–Smorodinsky Act, every civil dispute is solved by a straight line. The results are fair, consistent, and occasionally bizarre.**

  By the time Elena Rostova arrived at the Civil Arbitration Bureau, she had already filed her Maximum Conceivable Claim. It was a required document under the Kalai–Smorodinsky Act: a formal declaration of the best possible outcome she could imagine, assuming her husband remained at his disagreement payoff. In theory, the ideal point is derived from the feasible set of utilities. In practice, it is a numbers game. Rostova listed the family home, the vacation fund, and full custody of the twins. Her husband, citing the invariance axiom, argued that her utility scale was inflated relative to his emotional distress, but the court clerk simply normalized both parties to Standard Welfare Units and drew the ray.

  The mechanics of the Act are elegant. Once the disagreement point is established—the financial and emotional status quo if no deal is reached—the court identifies the ideal point for each party. A line is drawn from the disagreement point through the ideal point. The settlement is the furthest Pareto-efficient point where that ray intersects the feasible set. It satisfies symmetry and monotonicity: if your options improve, your share cannot drop. But it sacrifices independence of irrelevant alternatives, a trade-off that has reshaped American litigation.

  "Monotonicity is a moral imperative," says Dr. Aris Thorne, a behavioral economist at the Brookings Institution and a key architect of the Act. "Under the Nash framework, adding an option you never intended to choose could be ignored. Kalai–Smorodinsky recognizes that the mere existence of a possibility changes the geometry of fairness. If the feasible set expands in your favor, the ray pivots. You deserve that gain."

  This logic has led to the practice of "option padding." In a recent labor dispute at a logistics firm, the union added a clause regarding the refurbishment of the breakroom vending machines to the bargaining table. The clause was never intended to be enacted; it was purely feasible enough to shift the union's ideal point upward. Because the ray from the disagreement point now passed through a higher ideal coordinate, the intersection with the wage frontier moved accordingly. The vending machines were never refurbished, but the wage settlement increased by four percent. The company appealed, citing irrelevance, but the Supreme Court upheld the pivot. The option existed; therefore, it mattered.

  For litigants, the most crushing constraint is the disagreement point. Because the solution is a ratio of gains relative to the ideal, the only leverage a party possesses is how survivable their life is without a deal. This has created a perverse incentive to appear resilient. In landlord-tenant hearings, tenants often arrive with evidence of robust alternative housing options to raise their disagreement utility, while landlords emphasize the difficulty of finding new renters. "The formula doesn't see power," says Marcus Lee, a mediator in Chicago. "It only sees the coordinates. If you can convince the clerk that your no-deal scenario is less painful, the ray starts higher. We spend half the session arguing about how miserable we'd be if we walked away."

  The invariance axiom, designed to prevent players from gaming the system by rescaling their utility functions, has spawned its own bureaucracy. Because the court must compare utilities across parties to find the symmetric ray, all claims must be translated into a common metric. Litigants now hire "Utility Actuaries" to convert intangible assets—grief, brand reputation, weekend leisure hours—into Standard Welfare Units. In a merger dispute last year, the acquiring firm attempted to value the target company's "community goodwill" at zero utils to flatten the ray. The court rejected the filing, noting that goodwill was feasible and positive. The settlement was delayed three weeks while the actuaries recalibrated the conversion rate for goodwill against cash reserves.

  Critics argue that the system reduces complex human conflict to a trigonometry problem, ignoring the texture of justice. But supporters insist that the ray is blind to bias. It does not care who is louder, only where the line lands. In the Rostova divorce, the final settlement gave the husband the vacation fund and the wife the home, precisely where the ray intersected the frontier. It was not what either wanted, but it was mathematically inevitable. As the clerk stamped the final decree, she noted only that the slope was correct. The geometry, unlike the marriage, held.

  ***

  **Note to the Reading Group**

  The satire takes a liberty with the "Ideal Point Declaration." In strict theory, the ideal point is endogenous—it is calculated by the planner based on the maximum utility available in the feasible set, not declared by the players. I treated it as a filing to highlight the administrative burden of defining the feasible set itself. Regarding the incentive to inflate claims: you cannot directly inflate your ideal point in KS; you must expand the feasible set (add options) to shift it. The "option padding" joke relies on the IIA violation, which is robust, but in practice, defining what is "feasible" is the contested ground. The push to manipulate the disagreement point is theoretically sound, as the solution is strictly monotonic in the disagreement utility.
