answer: |-
  ### Final Exam Question (25 Marks)

  **Question:**
  Consider the following minimal pair:
  (I) If Oswald didn't shoot Kennedy, someone else did.
  (C) If Oswald hadn't shot Kennedy, someone else would have.

  Given that we know Kennedy was shot by Oswald, (I) is intuitively true (or assertible), while (C) is intuitively false. This divergence suggests indicatives and counterfactuals operate on different semantic principles.

  Write an essay addressing the following:
  1.  Explain precisely why a single truth-conditional semantics struggles to account for both (I) and (C) simultaneously without collapsing into triviality or misrepresenting one case.
  2.  Evaluate the prospect of a unified account (e.g., Kratzer's restrictor analysis) versus a dual account (e.g., Indicatives = Epistemic, Counterfactuals = Metaphysical).
  3.  Conclude by identifying which theoretical mechanism (e.g., past-tense morphology, presupposition of falsity, modal restriction) actually explains the divergence and which merely relabels the problem.

  ***

  ### Model Answer (Approx. 600 words)

  The Oswald pair demonstrates that conditionals cannot be uniformly treated as material implications, nor can they easily share a single truth-conditional semantics. In (I), the speaker accepts the consequent based on the knowledge that Kennedy was shot; the antecedent is treated as an epistemic possibility within the actual world's history. In (C), the speaker considers a world where the actual fact (Oswald shooting) is undone; the consequent fails because, in the nearest world where Oswald abstains, the conspiracy (presumably) does not succeed. The divergence is not merely pragmatic; it reflects a deep semantic standoff between truth-conditions and assertibility conditions.

  The core obstacle to unification is Lewis's Triviality Result. If we accept Adams' Thesis—that the probability of an indicative is the conditional probability of the consequent given the antecedent ($P(A \to C) = P(C|A)$)—and we simultaneously treat the conditional as a truth-conditional proposition that can be embedded in probability functions, triviality follows: all propositions become probabilistically independent. To avoid this, we must deny that indicatives express standard truth-conditional propositions. However, counterfactuals (C) *do* appear to express truth-conditions about similarity ordering among possible worlds (Stalnaker/Lewis). If (C) is truth-conditional and (I) is not (but rather expresses a constraint on credence), we have a dual semantics.

  A unified account, such as Kratzer's, attempts to save compositionality by treating *if*-clauses uniformly as restrictors on a covert modal. On this view, the difference lies in the modal base and ordering source. Indicatives use an epistemic modal base (what is known); counterfactuals use a circumstantial base with a "past" temporal parameter that shifts the evaluation world. While elegant, this unification often fudges the reality check. To make (C) false, the theory must ensure the modal base excludes the actual history where Oswald shoots. This is typically achieved by treating the past-tense morphology in counterfactuals not as temporal, but as a marker of "modal distance" or a presupposition of antecedent falsity.

  However, treating the past tense as a mere marker of counterfactuality risks relabeling the problem. It explains *how* we signal the difference, but not *why* the semantics shift from epistemic to metaphysical. A more robust dual account admits that indicatives are claims about information states (epistemic), while counterfactuals are claims about objective similarity between worlds (metaphysical). The cost is a loss of semantic uniformity, but it respects the triviality proof.

  Ultimately, the mechanism that earns its keep is the treatment of the antecedent's relation to actuality. In indicatives, the *if*-clause restricts an epistemic modal compatible with known facts. In counterfactuals, the morphology triggers a presupposition that shifts the evaluation world away from actuality, allowing the antecedent to be false. Merely calling this "modal distance" without explaining how the ordering source selects worlds where the actual cause is removed is just relabeling. A successful theory must explain how the same syntactic structure (*if*) can toggle between restricting what we know and reconstructing what might have been. Given the triviality results, the most honest conclusion is that indicatives lack truth-conditions in the standard sense, while counterfactuals possess them; any unified story must explain how a truth-conditional operator can masquerade as a probabilistic constraint without contradiction.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Analysis of the Minimal Pair (5 Marks)**
  *   **5:** Correctly identifies (I) as epistemically open/true given facts, and (C) as metaphysically closed/false because it requires undoing actual facts.
  *   **3:** Identifies the truth-value difference but attributes it vaguely to "context" or "speaker intention."
  *   **1:** Treats both as material conditionals or claims they have the same truth value.
  *   *Typical Flub:* Claims (I) is true simply because the consequent is true, ignoring the conditional link.

  **2. The Triviality/Truth-Condition Standoff (5 Marks)**
  *   **5:** Explicitly references Lewis's Triviality Results or the conflict between Adams' Thesis and truth-conditional semantics.
  *   **3:** Notes that probability and truth-conditions clash but cannot name the result or explain the implication.
  *   **1:** Asserts "probability is different from truth" without semantic justification.
  *   *Typical Flub:* Confuses *assertibility* with *truth* and claims the problem is solved by pragmatics.

  **3. Evaluation of Unified vs. Dual Accounts (5 Marks)**
  *   **5:** Weighs Kratzer's unification against the Dual view, noting the cost of each (compositionality vs. triviality).
  *   **3:** Describes Kratzer's view accurately but fails to identify where it "fudges" the reality check.
  *   **1:** Recites "Kratzer unifies them" as a fact without critical evaluation.
  *   *Typical Flub:* Assumes Kratzer solves the problem completely without mentioning the ordering source complications.

  **4. Mechanism Critique (Tense/Presupposition) (5 Marks)**
  *   **5:** Distinguishes between mechanisms that explain the shift (world-shifting presupposition) vs. relabeling (modal distance).
  *   **3:** Identifies past-tense morphology but treats it purely temporally.
  *   **1:** Lists "tense" and "presupposition" as buzzwords without functional analysis.
  *   *Typical Flub:* Claims the past tense in counterfactuals refers to actual past time rather than modal remoteness.

  **5. Synthesis and Conclusion (5 Marks)**
  *   **5:** Takes a definitive stance on whether unification is possible, supported by the previous arguments.
  *   **3:** Hedges without committing, or commits without support.
  *   **1:** Ends with a summary of theories rather than an argument.
  *   *Typical Flub:* Concludes that "both theories are useful" without addressing the semantic incompatibility.

  **Grade Boundaries:**
  *   **A (20-25):** Hits 5 on Triviality and Mechanism Critique. Shows the standoff is structural, not just lexical.
  *   **B (15-19):** Hits 3 on Triviality. Understands the theories but misses the "why" of the incompatibility.
  *   **C (10-14):** Recites theory labels (Stalnaker, Adams, Kratzer) correctly but applies them generically.
