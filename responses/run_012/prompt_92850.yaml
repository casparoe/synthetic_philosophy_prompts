      *   *Key Insight:* The user's view is essentially Ruth Chang's "Parity" view mixed with Raz's "Incommensurability." I need to make sure I distinguish between "Incomparability" (no relation) and "Incommensurability" (no common measure but possibly a relation like Parity). The user says "no fact of the matter about which is better," which allows for Parity.
      *   *Refining the SIA:* I need to explain that the standard "Incomparability" view *does* fall to SIA. The "Parity" view survives it. The user needs to know which one they hold. If they hold strict incomparability, SIA is fatal. If they hold Parity, SIA is solvable.
      *   *Refining the Lottery:* This touches on Harsanyi/Utilitarian critiques. If preferences are complete, values are effectively commensurable in decision theory. The defender must argue that rational choice doesn't require complete preferences.
