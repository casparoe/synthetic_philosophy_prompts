      *   *Option 3: Semantics.* "Contingent" is doing too much work. Is it "unpredictable," "avoidable," or "sensitive"?
      *   *Option 4: Legitimate Counterfactuals.* Rob argues you can't ceteris paribus (hold all else equal) in history. User argues models *allow* that. This is a methodological clash.
