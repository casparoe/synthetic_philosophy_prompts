answer: |-
  Your hypothesis is astute. In fact, it mirrors the meta-philosophical consensus that has emerged among philosophers of medicine who have grown weary of the stalemate. The reason your reading group has gone nowhere for two years is not a failure of intellect, but a feature of the conceptual landscape. You are not digging in one spot; you are digging in three different spots that happen to share a coordinate on the map labeled "Disease."

  Here is a diagnosis of the impasse, structured by the questions you raised.

  ### 1. Is it a verbal dispute or a substantive disagreement?
  It is **a verbal dispute masking a substantive metaphysical disagreement.**

  *   **The Verbal Layer:** The word "disease" is doing too much work. It is a "cluster concept" that refers simultaneously to a pathological mechanism, a subjective experience of illness, and a social status of sickness. Naturalists are defining *pathology* (mechanism); Normativists are defining *illness/sickness* (experience/status). When they argue, they are often arguing over who owns the label "disease," not the underlying phenomena.
  *   **The Substantive Layer:** Beneath the semantics lies the metaphysical question you identified: **Can biological function be characterized without appeal to goals or interests?**
      *   **Naturalists (e.g., Boorse):** Rely on an *etiological* account of function. A heart functions to pump blood because that is what hearts were selected for. They argue this is value-free because evolution is a blind process; "survival and reproduction" are statistical outcomes, not moral goods.
      *   **Normativists:** Argue that selecting "survival and reproduction" as the baseline for normal function is itself a value judgment. Why is survival the goal? Why not pain reduction? Why not aesthetic variety? Furthermore, to define "species-typical functioning," one must choose a *reference class* (age, sex, population). Choosing the reference class is a normative act that determines who counts as dysfunctional.

  **Diagnosis:** The sides are answering different questions. Naturalists ask, *"What is the causal breakdown?"* Normativists ask, *"What is the practical significance?"* They talk past each other because they assume the answer to one entails the answer to the other.

  ### 2. What would actually count as progress?
  A "decisive case" will not work because observation is theory-laden. A demonstration of incoherence is unlikely because both positions are internally consistent. The most productive form of progress would be **categorizing the concept as "Essentially Contested."**

  *   **The Essentially Contested Concept (Gallie):** If health and disease are essentially contested, the impasse is not a failure to be repaired but the normal condition of the concept. The concept serves multiple, conflicting purposes (scientific classification, insurance adjudication, moral exemption, personal identity). No single definition can satisfy all purposes without sacrificing another.
  *   **The Pragmatic Turn:** Progress would come from shifting the question from *"What is disease?"* (ontology) to *"What work do we want the concept of disease to do?"* (pragmatics).
      *   If the goal is **research funding**, the Naturalist definition is superior (it isolates mechanisms).
      *   If the goal is **resource allocation or disability rights**, the Normativist definition is superior (it identifies harm).
      *   If the goal is **clinical diagnosis**, the Hybrid view is superior (it requires both mechanism and harm).

  Recognizing that the definition shifts based on the *context of use* dissolves the requirement for a single, universal theory.

  ### 3. Can concrete cases settle it?
  No. Each side has developed "immune strategies" to reinterpret counter-examples. However, analyzing *how* they reinterpret them reveals the substantive stakes.

  *   **Statistically Typical yet Harmful (e.g., Aging, Childbirth Pain, Universal Tooth Decay):**
      *   *Naturalist:* Not a disease. It is species-typical functioning. To call aging a disease is to medicalize life.
      *   *Normativist:* If it causes harm and is unwanted, it is a disease (or at least a condition medicine should address). The "typicality" is irrelevant if the outcome is suffering.
      *   *Result:* This case highlights the **Normative** layer. It shows Naturalism can be counter-intuitive to patients.

  *   **Abnormal yet Harmless (e.g., Supernumerary Nipple, Red Hair, Left-Handedness):**
      *   *Naturalist:* Potentially a dysfunction (deviation from design), but not necessarily a disease if it doesn't reduce survival/reproduction capacity. (Boorse struggles here).
      *   *Normativist:* Clearly not a disease. No harm, no value judgment against it.
      *   *Result:* This case highlights the **Semantic** layer. It shows Normativism aligns better with common usage, but Naturalists argue common usage is often wrong (e.g., homosexuality was once considered a disease; Normativism risks making disease too dependent on social whim).

  *   **Status Changed When Treatment Existed (e.g., ADHD, Short Stature, Hypertension thresholds):**
      *   *Naturalist:* The biology didn't change, so the disease status shouldn't change. If we treat short stature now, we are medicalizing a variation, not curing a disease.
      *   *Normativist:* The capacity to intervene changes the normative status. If we can fix it and it causes social disadvantage, it becomes a disease.
      *   *Result:* This case highlights the **Metaphysical** layer regarding "function." It suggests disease is relational (organism vs. environment) rather than intrinsic.

  ### 4. A Proposal for Your Reading Group
  To break the two-year circle, I suggest you stop trying to solve the definition and start auditing the **consequences** of the definitions.

  **The "So What?" Test:**
  For the next session, assign each position a specific practical domain and ask them to defend it *only* in that domain.
  1.  **Naturalism in the Lab:** Can we do pathology research without a value-free definition of dysfunction? (Argue Yes).
  2.  **Normativism in the Courtroom:** Can we adjudicate disability claims without acknowledging the social construction of harm? (Argue Yes).
  3.  **Hybridism in the Clinic:** Can a doctor diagnose without considering both the biology and the patient's suffering? (Argue No).

  **The Diagnosis of the Impasse:**
  Tell your group: *"We are stuck because we are trying to find a 'realist' definition for a concept that is inherently 'pragmatist.' The debate isn't about what disease *is*; it's about where we draw the boundary of medical responsibility."*

  *   **Naturalism** draws the boundary at **biological capacity.** (Medicine fixes broken parts).
  *   **Normativism** draws the boundary at **human flourishing.** (Medicine fixes problems in living).
  *   **Hybridism** tries to draw the boundary at **harmful breakdowns.**

  The disagreement persists because society wants medicine to do *all three*, and these three mandates occasionally contradict. The impasse is not a philosophical failure; it is a reflection of the conflicting demands we place on medicine itself.

  **Recommendation:** Read Christopher Boorse's "Biostatistical Theory" (1977) alongside Rachel Cooper's "Health and Disease" (2002), but frame the discussion with W.B. Gallie's "Essentially Contested Concepts." If you can agree that the concept is essentially contested, you can stop trying to win the debate and start analyzing *why* the contest is necessary. That is where the real philosophy lies.
