answer: |-
  **The Case of the Stolen Pension**

  **The Setup**
  *   **The Act (Life 1):** A financial advisor diverts their business partner's retirement fund into a risky venture. The venture fails. The partner dies in poverty.
  *   **The Suffering (Life 2):** The subject loses their own retirement savings to fraud and develops a debilitating anxiety disorder that prevents employment.
  *   **The Link:** It is stipulated as metaphysical fact that the Suffering is the karmic ripening of the Act. The causal chain runs through death.
  *   **The Variable:** The degree of psychological continuity between the Advisor (Life 1) and the Victim (Life 2).

  **The Versions**

  *   **V1 (High Continuity):** The Victim remembers committing the fraud. They possess the same ambitious, risk-taking character that drove the original act. They look in the mirror and recognize the agent.
  *   **V2 (Character Continuity):** The Victim has no memory of Life 1. However, they possess the same dispositions: ambitious, cutthroat, prone to cutting corners. They are, psychologically, the same person, minus the memories.
  *   **V3 (Discontinuity):** The Victim has no memory of Life 1. Moreover, their character is the opposite: they are humble, risk-averse, and have spent their life advocating for pensioner rights. They are psychologically distinct from the Advisor.

  ***

  **The Theoretical Check**

  | Theory | V1 (Memory + Character) | V2 (Character Only) | V3 (Neither) |
  | :--- | :--- | :--- | :--- |
  | **Karma (as defined)** | **Desert Holds.** The link is clear. | **Desert Holds.** The causal chain is real; character continuity is sufficient but not necessary. | **Desert Holds.** The causal chain is sufficient. Memories and character are incidental to the moral debt. |
  | **Retributivism (Psychological Continuity)** | **Desert Holds.** Strong Relation R (memory/character) secures personal identity. | **Desert Weak/Holds.** Depends on weight given to character vs. memory. Often sufficient for responsibility. | **Desert Fails.** No psychological connection means different persons. Punishing V3 is punishing a stranger. |
  | **Retributivism (Bare Subject)** | **Desert Holds.** Same soul/subject persists. | **Desert Holds.** Same soul/subject persists. | **Desert Holds.** Same soul/subject persists. Psychology is irrelevant to the bearer of desert. |
  | **Consequentialism** | **Instrumental Only.** Desert is fiction. Suffering is only justified if it deters future fraud. | **Instrumental Only.** Suffering is useless if it doesn't change future behavior (character is already set). | **Instrumental Only.** Suffering is net negative. A saint is harmed with no deterrent gain. |

  ***

  **Closing Considerations**

  **1. Which feature is doing the work?**
  The divergence in V3 relies on the *severity* of the wrong and the *proportionality* of the suffering. If the Act were trivial (e.g., a white lie) or the Suffering wildly disproportionate (e.g., eternal torment for a minor theft), the Karma claim in V3 would look less like "desert" and more like "cosmic cruelty." The interesting tension survives only because the suffering is stipulated as *roughly proportionate*. If you break proportionality, the Karma view collapses into mere causation, and the Retributivist (Psychological) verdict becomes obvious (no desert).

  **2. Turning the dial to zero.**
  If you remove all continuity—no character, no memory, no bare subject, just a causal hit on a random stranger or community—the Karma view struggles to remain a theory of *desert*. It becomes a theory of *contagion*. If the suffering lands on the Victim's children (who had no part in the stream), the Retributivist (both types) says this is unjust. If the Karma theorist insists this is still "deserved," they have redefined desert to mean "inevitable causal consequence," stripping the moral agency required for desert claims.

  **3. The "Life-Stream" Defense.**
  A Karma theorist may defend V3 by arguing desert attaches to the *causal stream*, not the *person*. Or, they may adopt the *anatta* (no-self) view: there is no enduring person to begin with, only a process.
  *   **Does the case still bite?** Yes. If there is no person, there is no one *to whom* the desert is owed. "Desert" implies a subject who is worthy of praise or blame. If the subject is an illusion, "desert" becomes a category error.
  *   **Desert vs. Causation:** If they take this line, Karma risks becoming a theory of causation with moral decoration. To remain a theory of *desert*, there must be a locus of accountability. If V3 severs the locus (psychological continuity) but keeps the debt, the theory must explain why the *stream* is a moral agent. If it cannot, V3 demonstrates that Karma is descriptive (how suffering happens) rather than normative (why suffering is justified).

  ***

  **Note on Rigging**
  You asked if V3 rigs the outcome for Retributivism.
  *   **Verdict:** V3 is *designed* to break Psychological Retributivism. That is not rigging; it is isolating the variable. Psychological Retributivism *must* deny desert in V3 by definition.
  *   **How to Un-Rig:** To prevent the paper from becoming a trivial "Retributivism says No, Karma says Yes" stalemate, you must lean heavily into the **Bare Subject** Retributivist analysis in V3. That is the only version of Retributivism that competes with the Karma view in V3. If you ignore the Bare Subject account, the case simply proves that Psychological Continuity is necessary for desert, which is already known. The friction only exists if you pit Karma against the *Soul/Substance* view of identity.
