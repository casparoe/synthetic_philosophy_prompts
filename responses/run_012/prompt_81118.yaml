answer: |-
  It is a pleasure to meet a colleague who treats the landscape of ethics with the same rigor one would apply to seismic data. Your suspicion that the labels obscure the structure is well-founded; moral philosophy is often stratigraphy masked as taxonomy. We mistake the sediment for the stone.

  Below is a decision tree constructed from the logical space you outlined. I have prioritized your axes, placing the metaphysics of reasons (Holism) at the root, as you hypothesized it bears the greatest load. I have used your concrete examples to anchor the branching nodes. Following the tree, I have mapped the named positions (the leaves), identified the empty quadrants of the logical grid, and flagged the indistinguishable pairs.

  ### I. The Logical Axes
  Before the key, we define the dimensions of the grid into which the leaves will fall.

  1.  **The Variability of Reasons (Holism vs. Atomism):** Can a feature (e.g., pleasure) be a reason *for* an action in one context and no reason (or a reason *against*) in another?
  2.  **The Existence of Universals:** Are there true, exceptionless moral generalizations (even if complex)?
  3.  **The Deliberative Role:** Must a competent agent appeal to these generalizations to reach a verdict, or can the generalizations be true yet idle?
  4.  **The Structure of Defeaters:** Are exceptions to rules finite and specifiable, or open-ended?
  5.  **The Ontology/Epistemology Split:** Does the position explain what *makes* the act right (Ontology) or how we *know* it is right (Epistemology)?

  ---

  ### II. The Decision Tree (The Key)

  **Node 1: The Holism Question**
  *Consider the pleasure an action affords its agent when the action is cruel.*
  *   **(A)** That pleasure is always, in every possible context, a positive reason (or at least a reason) in favor of the action, even if outweighed. **(Atomism)** → *Go to Node 2A.*
  *   **(B)** That pleasure might be a reason in one context, but in the context of cruelty, it is no reason at all, or even a negative reason. **(Holism)** → *Go to Node 2B.*

  **Node 2A: The Atomist Branch (Principles are Stable)**
  *Consider the lie told to the person at the door (the murderer seeking a victim).*
  *   **(A1)** There is a true universal generalization that covers this case (e.g., "Do not lie," perhaps with a complex clause for murderers). **(Strong Generalism)** → *Go to Node 3A.*
  *   **(A2)** There are no true universal generalizations; there are only patterns that hold most of the time, but exceptions are not codifiable in advance. **(Atomist Irregularism)** → *Leaf: **The Skeptical Atomist** (Vacant/Unstable).*

  **Node 2B: The Holist Branch (Principles are Context-Sensitive)**
  *Consider the lie told to the person at the door.*
  *   **(B1)** There are still true universal generalizations, but they must be so heavily qualified (e.g., "Do not lie, unless...") that they function differently than standard rules. **(Holist Generalism)** → *Go to Node 3B.*
  *   **(B2)** There are no true universal generalizations that are useful for judgment; the moral truth is found only in the particular case. **(Particularism)** → *Go to Node 4.*

  **Node 3A: The Role of Principles (Strong Generalism)**
  *When you judge the lie at the door, how do you reach the verdict?*
  *   **(A1-i)** You derive the verdict *from* the principle. The principle justifies the verdict. **(Codifiability)** → *Leaf: **Act Utilitarianism / Kantianism**.*
  *   **(A1-ii)** The principle is true, but you reach the verdict by intuition/perception; the principle merely summarizes your judgment afterwards. **(Principles as Summaries)** → *Leaf: **Intuitionist Generalism**.*

  **Node 3B: The Role of Principles (Holist Generalism)**
  *How do the qualified generalizations function?*
  *   **(B1-i)** They function as default rules that hold unless defeated by specific exceptions. **(Defaultism)** → *Go to Node 4.*
  *   **(B1-ii)** They are not rules for action but reminders of what usually matters, serving as mnemonic aids with no justificatory force. **(Mnemonic View)** → *Leaf: **Principles as Heuristics**.*

  **Node 4: The Structure of Exceptions (Defeaters)**
  *Consider an excuse for breaking a promise (e.g., illness). Now suppose the illness was caused by the agent's own recklessness (an "excused excuse").*
  *   **(4-i)** We can specify a finite list of conditions under which the excuse is defeated. The system can be closed. **(Closed Defeasibility)** → *Leaf: **Specified Utilitarianism / Rule Particularism**.*
  *   **(4-ii)** Each exception raises a further question; the list of defeaters cannot be closed in advance. We specify the norm progressively as cases arise. **(Open Defeasibility)** → *Leaf: **Progressive Specification**.*
  *   **(4-iii)** The question of defeaters is moot because there are no principles to defeat; we reason by analogy from paradigm cases. **(No Principles)** → *Leaf: **Thoroughgoing Particularism**.*

  ---

  ### III. The Leaves (Named Positions)

  Here we populate the endpoints with the positions you requested, tagging them for **Ontology** (what makes it right) and **Epistemology** (how we know).

  1.  **Codifiability View** (Node A1-i)
      *   *Description:* A complete, usable set of principles is possible.
      *   *Ontology:* Principles make acts right.
      *   *Epistemology:* We know by applying principles.
      *   *Examples:* Act Utilitarianism, Kantian Deontology.

  2.  **Pro Tanto Weighing** (Node A1-i variant)
      *   *Description:* Genuine principles exist but are *pro tanto* (to be weighed); judgment is needed to weigh them.
      *   *Ontology:* Balance of principles makes acts right.
      *   *Epistemology:* We know by weighing principles + judgment.
      *   *Examples:* Rossian Pluralism.

  3.  **Default-like Generalisation** (Node B1-i / 4-i)
      *   *Description:* Norms hold unless defeated; defeaters can themselves be defeated.
      *   *Ontology:* Default status + absence of defeaters makes acts right.
      *   *Epistemology:* We know by checking for defeaters.
      *   *Examples:* Defeasible Deontology.

  4.  **Progressive Specification** (Node B1-i / 4-ii)
      *   *Description:* Norms are progressively specified rather than fixed or abandoned.
      *   *Ontology:* The specified norm at time *t* makes acts right.
      *   *Epistemology:* We know by dialectical refinement of norms.
      *   *Examples:* Richardson's Specificationism, some Natural Law theories.

  5.  **Principles as Heuristics (Mnemonic)** (Node B1-ii)
      *   *Description:* Principles serve as reminders but never as justificatory premises.
      *   *Ontology:* Particular features make acts right.
      *   *Epistemology:* We know by perception; principles aid memory.
      *   *Examples:* Hooker's Rule Consequentialism (interpreted weakly), some Virtue Ethics.

  6.  **Case-Based / Analogy** (Node 4-iii)
      *   *Description:* Reasons from paradigm cases without a closed system.
      *   *Ontology:* Similarity to paradigms makes acts right.
      *   *Epistemology:* We know by analogy.
      *   *Examples:* Casuistry, Common Law Morality.

  7.  **Thoroughgoing Particularism** (Node B2 / 4-iii)
      *   *Description:* Principles are neither necessary nor sufficient for sound judgment.
      *   *Ontology:* Holistic configuration of features makes acts right.
      *   *Epistemology:* We know by moral perception/sensitivity.
      *   *Examples:* Dancy's Ethical Particularism.

  ---

  ### IV. The Vacancies (Empty Logical Space)

  In mapping the grid, several combinations remain unoccupied.

  1.  **Atomism + No Universal Generalizations (Node A2)**
      *   *Status:* **Incoherent / Unstable.**
      *   *Reason:* If reasons are atomistic (pleasure is *always* a reason), they form a stable pattern. If a stable pattern exists, a true generalization can describe it. To claim atomism but deny the possibility of a true description of that pattern is to claim the world is regular but undescribable. This view collapses into Codifiability or Skepticism.

  2.  **Holism + Exceptionless Universals + Deliberative Necessity**
      *   *Status:* **Unattractive (Triviality).**
      *   *Reason:* One *can* hold this (e.g., "An act is right iff it has all right-making features and no wrong-making ones"), but the principle is tautological. It cannot guide deliberation because one must already know the verdict to apply the principle. No serious theorist occupies this as a *guide*.

  3.  **Codifiability + Principles as Mnemonic Only**
      *   *Status:* **Incoherent.**
      *   *Reason:* If a system is fully codifiable and usable, the principles *can* do justificatory work. To insist they *must not* is an arbitrary restriction. This collapses into the Mnemonic View (which denies codifiability) or Codifiability (which accepts justificatory force).

  4.  **Thoroughgoing Particularism + Atomism**
      *   *Status:* **Incoherent.**
      *   *Reason:* Particularism is defined by the holism of reasons. If reasons are atomistic, particularism is false by definition.

  ---

  ### V. The Blind Spots (Indistinguishable Leaves)

  You asked me to flag pairs of leaves the tree cannot separate without presupposing the label. There are two significant trouble spots where the logical branches converge, and the distinction is more sociological than structural.

  **1. Progressive Specification vs. Default-like Generalisation**
  *   *The Problem:* Both views occupy the same branch (Holist Generalism + Open Defeasibility).
  *   *Why they blur:* In practice, "specifying a rule" (e.g., changing "Keep Promises" to "Keep Promises unless...") looks identical to "listing a defeater." The distinction relies on whether the agent views the rule as *changing* (Specification) or as *having always had this hidden structure* (Defaultism).
  *   *Diagnostic Failure:* A person can answer all concrete questions in the tree identically while holding either view. To separate them, one must ask: "Did the rule change, or did your knowledge of the rule improve?" This requires the respondent to already understand the metaphysical distinction between the two labels.

  **2. Thoroughgoing Particularism vs. Moral Perception (Case-Based)**
  *   *The Problem:* Both occupy the "No Principles" leaf.
  *   *Why they blur:* Both deny the need for principles in deliberation and rely on sensitivity to the case.
  *   *Diagnostic Failure:* The tree asks, "Do you reason from paradigm cases?" A Particularist says "Yes" (via analogy). A Perception theorist says "Yes" (via intuition). The tree cannot distinguish whether the "perception" is of a *principle-free landscape* (Particularism) or of *objective moral properties* that simply resist generalization (Moral Realist Perception). The output is behaviorally identical.

  ---

  ### VI. Verdict on Your Suspicion

  You suspected that the **first axis (Holism vs. Atomism)** does most of the diagnostic work, and that the existence and role of principles are downstream.

  **The tree supports your suspicion.**

  Notice that **Node 1** creates the primary bifurcation.
  *   If you answer **(A) Atomism**, you are almost forced toward **Codifiability** or **Pro Tanto Weighing**. It is logically very difficult to be an Atomist and deny that principles can be formulated (since the reasons don't vary).
  *   If you answer **(B) Holism**, the "Principles" branch becomes unstable. You are pushed toward **Particularism**, **Mnemonics**, or **Progressive Specification**.

  The dispute over whether principles *exist* (Axis 2) often turns out to be a verbal disagreement once Axis 1 is settled.
  *   The Atomist says, "Principles exist" (meaning: stable reason-patterns exist).
  *   The Holist says, "Principles don't exist" (meaning: *useful, exceptionless* guides don't exist).

  If you force the Holist to admit "An act is right if it is right" is a universal generalization, they will concede Axis 2 but insist on Axis 3 (Deliberative Role). Thus, **Axis 1 determines the metaphysics, and Axis 3 determines the epistemology.** Axis 2 is the swamp where your reading group is currently stuck, because it is the dependent variable.

  **Recommendation for the Group:**
  Stop asking "Are there principles?" Ask: "If I find a feature that counts in favor of an act today, must it count in favor (or at least count) in every possible world?" If they disagree there, no amount of haggling over the definition of 'principle' will reconcile them. They are living in different logical strata.
