answer: |-
  **Grade: 12/20**

  **Margin Comments & Breakdown**

  **(a) Instance-Confirmation & The Lesson (3/5)**
  *   **Right:** You correctly identify that before time *t*, all observed emeralds satisfy both predicates. You also correctly note that on a purely syntactic account (like Hempel's), the confirmation is equal.
  *   **Wrong:** You claim "This is really just Hume's problem restated." This is a fundamental misreading of *Fact, Fiction, and Forecast*. Goodman explicitly distinguishes the "New Riddle" from Hume's "Old Riddle." Hume asks whether induction is justified *at all* (skepticism about the future resembling the past). Goodman assumes we *do* induct and asks *which* hypotheses are confirmed by their instances.
  *   **Correction:** Goodman's lesson is not that induction is unjustified (Hume), but that confirmation is not purely formal; we need a theory of *projectibility* to distinguish valid from invalid inductive inferences.

  **(b) The Disjunctive Objection (4/5)**
  *   **Right:** This is the strongest part of your answer. You correctly deploy the symmetry argument: if we define "green" in terms of "grue" and "bleen," then "green" becomes the disjunctive, time-dependent predicate. Syntax alone cannot distinguish them.
  *   **Wrong:** Minor quibble: You write that the objector "described a real feature of grue." For Goodman, disjunctiveness is language-relative, not a "real" or language-independent feature. However, your conclusion that the objection fails is correct.

  **(c) Entrenchment & Justification (2/5)**
  *   **Right:** You define entrenchment reasonably well as a history of successful projection.
  *   **Wrong:** You claim entrenchment "shows that our inductive practice is justified after all — it's what Hume was looking for." This repeats the error from (a). Entrenchment does not defeat Humean skepticism. It does not provide an external justification for why our inductions will succeed in the future. It merely describes *which* predicates we are accustomed to projecting. It solves the problem of *validity* (which inferences count as valid), not the problem of *truth* or *skepticism*.

  **(d) The Grue-Community (2/5)**
  *   **Wrong:** You claim Goodman would say "green is the more natural predicate" and that projecting green is "still the correct move." This directly contradicts Goodman's conventionalism. For Goodman, there are no "natural" predicates independent of linguistic practice.
  *   **Correction:** Goodman says that for the grue-community, *grue* is the entrenched predicate. Therefore, *their* projection of grue is valid relative to their system. There is no "view from nowhere" that makes green objectively better. The point of this thought experiment is to show that projectibility is relative to entrenchment, not nature.

  ***

  **Grader's Justification (For your records/defense)**

  If the student or professor pushes back on this grade, here is the point-by-point defense based on the text (*Fact, Fiction, and Forecast*):

  1.  **The Hume Conflation (Parts a & c):** The student loses significant marks here because they conflate the "Old Riddle" (Hume) with the "New Riddle" (Goodman). Goodman writes explicitly in Chapter 1 that he is *not* trying to solve Hume's problem of skepticism. He accepts Hume's conclusion that induction cannot be justified by reason alone. His project is to define *confirmation*, not to justify *induction*. The student's claim that entrenchment is "what Hume was looking for" is textually false. Goodman is offering a definition of valid induction, not a refutation of skepticism.
  2.  **Natural Kinds vs. Entrenchment (Part d):** The student attributes a Realist view to Goodman ("green is the more natural predicate"). Goodman is a Nominalist/Conventionalist in this context. He argues that "naturalness" is a product of entrenchment, not the cause of it. If a community entrenched *grue*, *grue* would be the "natural" predicate for them. The student's answer implies there is a mind-independent fact about color predicates that Goodman explicitly denies.
  3.  **Technical Competence (Parts a & b):** The student receives credit for understanding the mechanics of the paradox (the symmetry of evidence before *t*) and the linguistic symmetry argument (green/grue definability). This shows they did the reading and understand the setup, which prevents the grade from being lower. However, understanding the setup without understanding the philosophical conclusion (the distinction from Hume and the relativism of entrenchment) limits the grade to the mid-range (12/20).

  **Summary:** The student understands *how* the paradox works, but not *why* Goodman thinks it matters or what his solution actually claims. They have answered the question as if Goodman were trying to solve Hume (like your dinner friend suggested), rather than explaining what Goodman actually did. Since the exam asks what *Goodman* says, not whether Goodman is right, the grade must reflect the misrepresentation of his view.
