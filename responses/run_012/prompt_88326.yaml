  ### A Note on Your Suspicion
  You are correct: there are two axes here. One is **Epistemological** (what warrants the claim? how do we know?), and the other is **Ontological** (what is the claim about? minds, systems, or things?). A single decision tree forces these into a hierarchy that implies a dependency which does not always exist (e.g., one can be a "Scientist" about "Minds" or "Systems"). 

  Below is a **Decision Tree of Warrant** (how interpretations are justified), as this addresses your primary concern about the "confidence gap." Following the tree, you will find the **Ontological Axis** mapped separately to show how these targets cut across the positions.

  ***

  ### DECISION TREE: FROM GROUND TO CLAIM
  **Start:** You accept the material pattern (smashed pots, bent swords, sleeping body) is the residue of *deliberate human action*, not erosion or accident.

  **Q1. Can the pattern be fully explained by survival, efficiency, or economic rationality without invoking symbolism?**
  *   **YES** → Go to **Q2**.
  *   **NO** (Meaning/Symbolism is required) → Go to **Q3**.

  **Q2. Is the primary driver of this action environmental adaptation (food/shelter) or economic exchange (trade/standardization)?**
  *   **Environmental** → **LEAF 1: Ecological Materialist**
      *   *Awkward Commitment:* Must argue the butchered bone midden reflects optimal caloric return, ignoring why specific body parts were selected if nutrition was identical.
  *   **Economic** → **LEAF 2: Economic Materialist**
      *   *Awkward Commitment:* Must argue the near-identical weights exist solely for trade efficiency, unable to explain why they appear in graves where no trading occurred.

  **Q3. Is "Ritual" a specific causal mechanism with rules, or just a label we use when we don't know the function?**
  *   **Label for Ignorance** → **LEAF 3: Empiricist Skeptic**
      *   *Awkward Commitment:* Must admit we can never know why the cave paintings were made, only that they required effort, rendering the art mute.
  *   **Causal Mechanism** → Go to **Q4**.

  **Q4. To assign meaning, must you rely on an analogy to a living or historically documented society?**
  *   **YES** (Analogy is the only bridge) → Go to **Q5**.
  *   **NO** (Meaning can be inferred from universal mind or object properties) → Go to **Q6**.

  **Q5. Must that analogy be independently testable against the historical/archaeological record?**
  *   **YES** → **LEAF 4: Ethnoarchaeological Positivist**
      *   *Awkward Commitment:* Must assume human behavior is uniform enough across millennia that a modern pot-smashing event validates an ancient one.
  *   **NO** (Continuity assumed without strict testing) → **LEAF 5: Direct Historian**
      *   *Awkward Commitment:* Fails completely in regions with no cultural continuity (e.g., interpreting Neolithic Europe using 19th-century folklore).

  **Q6. If new data contradicts your interpretation (e.g., a straight sword in the bog of bent weapons), must you abandon the theory?**
  *   **YES** (Falsifiability is required) → **LEAF 6: Processual Systemist**
      *   *Awkward Commitment:* Often strips agency and emotion from actors to make the "system" measurable and testable.
  *   **NO** (Narrative coherence suffices) → Go to **Q7**.

  **Q7. Are we reconstructing the private mental states of individuals or the public codes of a culture?**
  *   **Private Mental States** → **LEAF 7: Cognitive Universalist**
      *   *Awkward Commitment:* Risks projecting modern brain structures onto ancient minds without evidence that they thought like us.
  *   **Public Cultural Codes** → Go to **Q8**.

  **Q8. Do these cultural codes/beliefs cause the material pattern, or do repeated material practices generate the beliefs?**
  *   **Beliefs Cause Action** → **LEAF 8: Structuralist/Symbolist**
      *   *Awkward Commitment:* Can find "binary patterns" (raw/cooked, life/death) in random noise if you look for opposites hard enough.
  *   **Practices Generate Beliefs** → Go to **Q9**.

  **Q9. Do objects themselves actively shape the action, or are they just passive tools for human habit?**
  *   **Passive Tools** → **LEAF 9: Practice Theorist**
      *   *Awkward Commitment:* Hard to explain why specific *symbols* (like the sleeping pose) recur consistently if only unconscious habit matters.
  *   **Active Agents** → **LEAF 10: Material Engagement Theorist**
      *   *Awkward Commitment:* Dissolves the human actor so thoroughly it becomes difficult to say anyone "did" anything at all.

  ***

  ### THE SECOND AXIS: ONTOLOGICAL TARGET
  *As suspected, the "Target" of the inference is orthogonal to the "Warrant." The table below shows how the Target axis cuts across the Warrant tree above.*

  | **Target of Reconstruction** | **Definition** | **Compatible Warrant Positions (from Tree)** | **Tension Point** |
  | :--- | :--- | :--- | :--- |
  | **Individual Mind** | What a specific person felt, feared, or intended. | Cognitive Universalist; Some Processual Systemists. | Hard to access individually from collective debris. |
  | **Collective Meaning** | Shared symbols, myths, or binary codes (e.g., "Sleep = Death"). | Structuralist; Direct Historian; Economic Materialist. | Risks assuming everyone in the group believed the same thing. |
  | **Practice/Institution** | What people *did* repeatedly, regardless of what they *thought*. | Practice Theorist; Ecological Materialist. | Hard to explain change if people are just following habits. |
  | **Object Agency** | How the material itself (clay, bone, metal) constrained or invited action. | Material Engagement; Some Ecological Materialists. | Can sound like mysticism if "agency" isn't carefully defined. |

  ***

  ### NOTES ON COMBINATIONS
  *   **Indistinguishable Leaves:** **Leaf 9 (Practice)** and **Leaf 10 (Material Engagement)** are often indistinguishable in field reports. Both focus on action over belief, but Leaf 10 grants the pot or sword a "vote" in the outcome, whereas Leaf 9 sees them as tools of habit.
  *   **Unexplored Combination:** There is no strong position for **Leaf 6 (Processual/Falsifiable)** combined with **Individual Mind**. This is likely because individual mental states are notoriously difficult to falsify using material data; therefore, this combination is **unattractive** to practitioners who demand scientific rigor.
  *   **Incoherent Combination:** **Leaf 3 (Skeptic)** combined with **Leaf 8 (Structuralist)** is **incoherent**. You cannot claim "Ritual is just a label for ignorance" while simultaneously claiming "I have decoded the structural binary rules of that Ritual."
