  4. No contingent substance exists without an ontological ground explaining its being rather than non-being. This substantive metaphysical principle (Principle of Sufficient Reason) is needed for the Contingency argument and compatible with *creatio ex nihilo* since God provides the ground.
  5. Nothing can begin to exist without a pre-existing material cause from which it is formed. This false claim directly contradicts *creatio ex nihilo*, rendering the cosmological argument self-defeating by demanding eternal matter.
