      *   *Reading 4 (Theological/Consistency Check):* Addressing the *creatio ex nihilo* tension. If God creates out of nothing, does this principle forbid it?
      *   *Reading 5 (Radical/Strict):* Absolute impossibility of beginning without a material cause.

