answer: |-
  **Tightened Thesis**
  "The outside view yields objective corrections only if the reference class is selected independently of the case-specific causal narratives (inside view) that produced the initial bias; permitting inside-view judgment to constrain reference class selection voids the outside view's claim to objectivity."

  **Credence:** 0.35

  **Decomposition**
  1.  **Reference-class selection is always already an inside-view judgment (0.15):** Selecting a class requires judging relevance, which inevitably relies on causal theories specific to the case.
  2.  **Some reference classes are fixed by causal structure (0.25):** Causal structures are model-dependent interpretations rather than mind-independent buckets that dictate their own grouping.
  3.  **The regress of outside views is vicious (0.40):** The regress is typically benign, halted by pragmatic accuracy checks rather than requiring a foundational, view-independent stopper.
  4.  **Epistemic modesty names a virtue (0.80):** Modesty is a genuine epistemic virtue, but it mandates humility rather than this specific structural separation of views.
  5.  **Objectivity requires insulation from inside-view narratives (0.50):** Objectivity may depend on aggregation and transparency rather than the impossibility of inside-view influence on inputs.

  **Combination Logic**
  The final number is a weighted average where the mechanistic claims (1 and 2) carry double weight because they are necessary conditions for the thesis's descriptive truth. Even if modesty is a virtue (0.80), the impossibility of truly independent class selection (0.15) collapses the strong claim. The 0.50 on objectivity reflects that the term is contested; if objectivity allows for calibrated inside-view input, the thesis fails. The low scores on the mechanism drag the high normative score down to 0.35.

  **Falsification Conditions**
  The thesis is false if empirical demonstration shows that reference classes tuned by inside-view judgment systematically outperform "blind" reference classes in predictive accuracy. This distinguishes falsity (the mechanism fails to produce the claimed good) from difficulty (the mechanism is hard to execute). If inside-view tuning improves the outside view, the "no-reciprocity" constraint is detrimental rather than protective.

  **Sensitivity and Disagreement Diagnosis**
  My number is most sensitive to the definition of **objectivity** (Term 5). The 0.4-vs-0.85 gap most likely lives in a disagreement about **what "objective" is supposed to mean here**. Your colleague likely defines objectivity procedurally (following a statistical rule), whereas you define it structurally (independence from biased inputs); the thesis holds under the former but collapses under the latter.
