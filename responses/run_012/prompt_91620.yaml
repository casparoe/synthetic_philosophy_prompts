      *   *Refinement:* The user mentioned "I can't separate the question of whether a reading is true from the question of who's selling it." I need to address this directly in the limitations or Step 1. I'll put it in Step 1 but add a note in limitations.

  9.  **Final Polish:** Check word count and clarity. Ensure the distinction between "Concession" (temporary bridge) and "Alibi" (permanent excuse) is sharp. (Proceed to generate output).

