answer: |-
  This is a sharp problem. You are dealing with the distinction between **divine pedagogy** (God teaching slowly) and **divine capitulation** (God giving up). Maimonides' argument in *Guide III:32* is specific: it is not just that context matters, but that *human nature* imposes a constraint on revelation. A true concession is a bridge, not a parking spot.

  Here is a decision procedure designed for a reporter's deadline. It is not a theological verdict machine; it is a structural stress test.

  ### The "Concession vs. Alibi" Decision Procedure

  Run these five steps in order. If a claim fails a step, note the failure. If it fails two or more, treat the claim as an **Alibi** (apologetics) rather than a **Concession** (theological/historical explanation).

  #### Step 1: The Asymmetry & Motive Check
  **Question:** Who is making the claim, and what work is the claim doing for them?
  *   **Insider (Believer/Practitioner):** Are they using this to *preserve* the text's authority while discarding the practice, or to *explain* a lingering discomfort?
  *   **Outsider (Critic/Secular):** Are they using this to dismiss the text's moral authority entirely?
  *   **Pass:** The speaker acknowledges a tension between the eternal ideal and the historical reality. They admit a cost (see Step 4).
  *   **Fail:** The claim is used to immunize the text from criticism *or* to dismiss the text without engaging its internal logic. If the argument shuts down inquiry rather than opening it, it is likely an alibi.
  *   **Reporter's Note:** You cannot separate the messenger from the message here. A claim made to protect power is functionally different from one made to explain pain. Record *who* benefits if the claim is accepted.

  #### Step 2: The Impossibility Test (Maimonides' Constraint)
  **Question:** Is there evidence that immediate abolition was socially or psychologically impossible, or merely inconvenient?
  *   **Maimonides' Standard:** "Customs generally accepted... cannot be discontinued suddenly."
  *   **Pass:** Historical/anthropological evidence shows the practice was ubiquitous and integral to survival or social cohesion (e.g., sacrifice in ANE cultic life).
  *   **Fail:** The practice was already contested, marginal, or economically optional at the time. If prophets or contemporaries were already arguing against it, "they couldn't handle the truth" is weak.
  *   **Reporter's Note:** Look for counter-evidence. Were there groups *at that time* living without this practice? If yes, the "impossibility" claim crumbles.

  #### Step 3: The Trajectory & Expiry Check
  **Question:** Does the law/text contain a vector *away* from the practice?
  *   **Maimonides' Standard:** The concession is a "weaning." It must point toward a goal.
  *   **Pass:** The text regulates the practice to limit it, restricts who can do it, or pairs it with prophetic critiques that suggest a higher ideal (e.g., "I desire mercy, not sacrifice"). There is an internal mechanism for its end.
  *   **Fail:** The practice is codified without restriction, expansion, or internal critique. It looks permanent, not transitional.
  *   **Reporter's Note:** This is the strongest factual test. Look for "sunset clauses" (Jubilee, manumission) vs. "permanent statutes."

  #### Step 4: The Instrumentality Cost
  **Question:** Does this reading turn the commandment into a mere means to an end, and does the speaker acknowledge that cost?
  *   **Maimonides' Standard:** He worries this makes the Law instrumental. He pays this price openly.
  *   **Pass:** The speaker admits that viewing the law as a concession lowers its ontological status or creates theological problems (e.g., "This makes God look changeable").
  *   **Fail:** The speaker wants the benefit of the concession (we don't have to do this) without the cost (this part isn't eternally binding). They want to have their cake and eat it too.
  *   **Reporter's Note:** If the argument makes the religion *easier* without making it *harder* elsewhere, be skeptical.

  #### Step 5: The Values Handoff (Stop Point)
  **Question:** Have we moved from "Is this historically true?" to "Is this morally acceptable?"
  *   **Procedure:** If Steps 1-4 pass, you have a plausible *historical/theological* claim. You do **not** have a moral endorsement.
  *   **Action:** Stop the procedure. Mark this paragraph: **"Historical explanation ends; ethical evaluation begins."**
  *   **Reporter's Note:** A practice can be a genuine concession (Step 1-4 pass) and still be abhorrent. The procedure validates the *explanation*, not the *act*.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It cannot verify revelation.** It tests the internal consistency of the argument, not whether God actually spoke.
  2.  **It cannot separate Truth from Messenger completely.** You noted you can't separate these. This procedure leans into that. A true claim used to silence victims (Step 1 Fail) must be reported as a weapon, regardless of historical accuracy.
  3.  **It cannot resolve the "Values Handoff."** If a practice passes as a concession but involves human suffering, this checklist will not tell you if you should condemn it. It only tells you that the "concession" defense is structurally sound. You must make the moral call.
  4.  **It requires basic historical literacy.** You need to know if a practice was "ubiquitous" (Step 2). If you don't know, the procedure halts. In that case, your story is "Experts disagree on the historical necessity."

  ---

  ### Running the Cases

  #### Case 1: Animal Sacrifice (Maimonides' Original)
  *   **Step 1 (Motive):** Insider (Maimonides). Aim: Preserve Torah authority while explaining why Jews don't sacrifice. **Pass.**
  *   **Step 2 (Impossibility):** Sacrifice was the universal language of worship in the Ancient Near East. Abrupt abolition would have severed Israel from the concept of worship entirely. **Pass.**
  *   **Step 3 (Trajectory):** Prophets (Isaiah, Jeremiah) explicitly critique sacrifice. Temple destruction ends the practice without ending the religion. Prayer replaces sacrifice. **Pass.**
  *   **Step 4 (Cost):** Maimonides admits this makes commandments instrumental. He accepts the theological risk. **Pass.**
  *   **Verdict:** **Genuine Concession.**
  *   **Reporting Frame:** You can report this as a settled theological argument within the tradition. It meets the structural criteria.

  #### Case 2: Biblical Slavery Laws
  *   **Step 1 (Motive):** Often Modern Insider (Apologetics). Aim: Defend Bible's morality against modern critique. **Caution.**
  *   **Step 2 (Impossibility):** Slavery was economically foundational. Abolition might have caused societal collapse. **Plausible Pass.**
  *   **Step 3 (Trajectory):** Here is the failure. While there are manumission laws (Exodus 21), the text regulates slavery rather than vectoring toward abolition. Unlike sacrifice, there is no prophetic voice within the text saying "I hate slavery." It is codified as a permanent social feature. **Fail.**
  *   **Step 4 (Cost):** Apologists rarely admit the cost. They usually argue slavery "wasn't that bad" rather than "this was a moral lag we must overcome." They avoid the instrumentalization cost. **Fail.**
  *   **Verdict:** **Likely Alibi.**
  *   **Reporting Frame:** The "concession" argument is structurally weaker here than with sacrifice. There is no internal trajectory toward abolition. You can write: "While some argue this was a concession to economic reality, the text lacks the internal mechanisms for abolition seen in other concessionary laws."

  #### Case 3: Modern Custom / Dietary Laws (Hygiene Theory)
  *   **Claim:** "Kashrut was just a health concession for the desert; we don't need it now."
  *   **Step 1 (Motive):** Often Outsider or Reform Insider. Aim: Dismiss obligation while keeping identity. **Caution.**
  *   **Step 2 (Impossibility):** Was eating pork *psychologically impossible* to ban without a health reason? No. It was a cultural boundary marker. **Fail.**
  *   **Step 3 (Trajectory):** No expiry date. No internal text suggests "eat this until you understand germs." It is framed as *Kedushah* (holiness), not hygiene. **Fail.**
  *   **Step 4 (Cost):** Dismisses the ritual intent entirely. Turns a spiritual discipline into a primitive public health code. **Fail.**
  *   **Verdict:** **Alibi.**
  *   **Reporting Frame:** This is a modern retrofit. It fails the Maimonidean test because it imposes a modern rationale (health) on an ancient text that claims a different rationale (holiness).

  ---

  ### When to Write "This Is Contested"

  Use the procedure to determine your hedging.

  1.  **If the claim fails Step 3 (Trajectory):** Do not write "Scholars say this was a concession." Write: "Proponents argue this was a concession, but critics note the text contains no internal movement toward ending the practice."
  2.  **If the claim fails Step 1 (Motive):** Write: "This argument is frequently used by [Group X] to defend [Position Y], though historians dispute the necessity."
  3.  **If you hit Step 5 (Values):** Write: "Even if historically accurate as a concession, the practice remains ethically contested today."

  ### Final Advice for the Beat

  You asked where the procedure hands the thing back to you. It is at **Step 4**.

  Maimonides warns that if you push the "concession" reading too hard, you turn the Law into a tool. If a source wants to use the concession argument to make the religion *more convenient* without acknowledging that it makes the religion *less divine*, they are using it as an alibi.

  If they use it to explain why the religion is *hard* (e.g., "We are stuck with these texts because God meets us in our mess"), it is more likely a genuine theological position.

  **Your Editor's Framing:**
  When you file, your framing is not "Is this true?" Your framing is "Does this argument hold together structurally?"
  *   *Bad Lead:* "Was slavery a concession?" (Invites moral fight).
  *   *Good Lead:* "The theology of concession: When religious laws meet historical reality." (Invites structural analysis).

  You have one hour. Run the five steps. If you hit two "Fails," you have your skepticism. If you hit Step 5, you have your moral caveat. If you can't verify Step 2 (History), your story is about the *debate*, not the *fact*.
