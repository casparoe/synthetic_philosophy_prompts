  **The Address**

  Good evening.

  To our donors, to the staff who make this society function, to the families who tolerate our absences, and especially to our founder, who is with us tonight: thank you. Ninety-one years is a long time to watch a single idea grow from a sketch on a napkin into an institution that fills a banquet hall. Looking at the front rows, I see the people who built the machinery we all use. Looking at the back rows, I see the people who will have to drive it.

  My job tonight is to take stock. Traditionally, this is the moment for a victory lap. We list the grants, the citations, the new chairs. And we should be proud. By any ordinary measure, this field is healthy. We have money. We have students. We have a flagship journal that publishes on schedule.

  But honesty is the only courtesy worth offering a community like this. And if I am honest, I must acknowledge a quiet unease that has been circulating in our hallways, and in my own head, for some time. It is a question about the direction of our travel.

  In the philosophy of science, there is a standard way to judge a field. We ask: Is it discovering new things about the world, or is it merely explaining away its mistakes? When a field predicts something unknown and finds it to be true, we call that progress. When a field survives only by adjusting its assumptions to fit what we already knew, we call that decline. It is a coarse test, but a useful one.

  For a long time, I believed that test was sufficient. If the math works, and the prediction holds, the field is alive. But recently, a colleague challenged me on this. She argued that there is a third state. She suggested that a field can be rigorously predicting novel facts, and rigorously confirming them, and yet still be losing its grip on the world.

  How is that possible? It happens when the subject matter of our predictions migrates inward.

  Imagine a cartographer. In the beginning, she goes out and measures the coastline. She predicts where the capes and bays are. She is measured by the accuracy of her map against the land. But eventually, the map becomes so detailed that she stops going to the coast. Instead, she studies the ink. She predicts how the paper will expand in humidity. She measures the precision of her own compass. She publishes papers on the optimal thickness of the lines.

  By the standard test, she is still progressing. Her predictions about the ink are novel. Her measurements of the compass are corroborated. But she is no longer telling us where the land is. She is telling us about the map.

  My colleague argues that when a research programme begins to predict the behavior of its own instruments rather than the behavior of the systems those instruments were built to study, it has entered a state of Reflexive Maturity. It is not yet degenerating—it is not failing. But it is feeding on itself.

  I have spent the last few weeks looking at our own record through this lens. I looked at the last decade of our flagship journal. I asked a simple question: What are the predictions about?

  The evidence is mixed, but the trend is clear. Ten years ago, our models were tested against the systems we study. We predicted the outcome of an intervention, the behavior of a subject, the flow of a material. Today, a significant majority of our "novel predictions" are about the models themselves. We predict how a formalism behaves under perturbation. We compare competing estimators. We optimize protocols for data cleaning. We are publishing exquisite maps of the ink.

  This is not a failure of intelligence. It is a consequence of our success. The founder and his students built a framework so robust that we can now spend years exploring its internal geometry. That is a luxury earlier generations did not have. It is also a trap.

  So, here is my verdict. Our field is not degenerating. We are not patching holes to save a sinking ship. But we are not, strictly speaking, in the phase of outward expansion that characterized our first forty years. We are in a period of Reflexive Maturity. We have become experts at measuring our own measuring sticks.

  I say this not to diminish the work in that journal. Calibration is vital. Methodological rigor is the backbone of trust. But housekeeping must remain a means, not an end. If we spend another decade perfecting the compass without checking the north, we will find ourselves in a position where our internal consistency is perfect, and our relevance to the world is optional.

  This brings me to the challenge for the next decade. We do not need to dismantle the machinery. We do not need to apologize for the tools we have built. We simply need to turn them outward again.

  To the graduate students in the room: You know the vocabulary. You know how to run the simulations. Do not let the simulation become the reality. The easy predictions are now about the parameters. The hard predictions—the ones that will define your careers—are about the systems.

  To the senior researchers: You have earned the right to refine the methods. But I ask you to weigh your publications not just by their technical novelty, but by their distance from the core. Are we explaining the world, or are we explaining our explanation of the world?

  And to our founder, and to his students in the front row: You gave us a hard core that has held. It is strong enough to withstand this scrutiny. A theory that cannot be asked if it is looking in the mirror is a dogma. A theory that can bear that question is a science. The fact that we can have this debate is proof that the structure you built is sound. But a structure is meant to be lived in, not just inspected.

  We stand at a threshold. We can choose to remain in this comfortable state of self-reference, where we are guaranteed to be right because we are only testing ourselves. Or we can take the risk of stepping back into the noise of the real world, where our clean models might meet messy data.

  I urge you to choose the risk.

  If we do this, we will not just be preserving a field. We will be renewing a promise. The promise that our work does not just describe itself, but describes the world we all share.

  Thank you.

  ***

  **Strategic Note for the Speaker**

  **The Claim:**
  You are claiming that the field is in a state of **Reflexive Maturity**. This accepts your friend's refinement as a valid diagnostic without adopting her potentially fatalistic tone. It acknowledges that "inward migration" of predictions is distinct from both healthy progress and degenerative ad-hocery. It validates the work done (it is not "wrong") but flags the *direction* as risky.

  **Falsification Condition:**
  You are wrong if, upon review, the "methodological" papers in the flagship journal can be demonstrated to directly yield novel, corroborated predictions about the *target systems* (the world) rather than just optimizing the *models* (the map). If the parameter tuning leads directly to a discovery about the external system that could not have been found otherwise, the "inward migration" charge is false.

  **Message to Your Friend:**
  When you walk out, tell her this:
  *"You were right about the migration. The predictions have turned inward. But I refused to call it degeneration, because that insults the work and shuts down the room. I called it 'Reflexive Maturity' and framed it as a challenge to the students rather than a verdict on the founders. It puts the burden on the next decade to turn the lenses outward without denying the value of the last one. You get your warning label; I get to keep my job. Did I settle it?"*
