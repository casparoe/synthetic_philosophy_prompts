answer: |-
  Here is the battle plan. It assumes your participants are competent in normative ethics but haven't stared directly into the structural void of cluelessness.

  ### 1. The Pre-Conditions (What Must Be on the Table)
  Before you introduce the problem, you must lock the room into the specific version of consequentialism where cluelessness bites. If you don't secure these three commitments in the first 10 minutes, the session will dissolve into "subjective permissibility" or "discounting" escapes.

  *   **Commitment A: Temporal Neutrality.** Future utility counts equally with present utility (or discounting is purely probabilistic, not pure time preference). If they argue we can ignore effects 50 years out, you lose.
  *   **Commitment B: Aggregation.** The value of an act is the sum of its short-term and long-term consequences. You cannot compartmentalize.
  *   **Commitment C: Objective Rightness.** We are investigating whether there *is* a fact of the matter about which act is better, not just whether the agent feels justified. (Subjective consequentialism is a retreat, not a solution to the ontological problem).

  ### 2. The Single Case: "The 3:15 PM Traffic Light"
  Do not use charity. Do not use trolley cases. Use **mundane infrastructure**.

  *   **The Act:** A city engineer changes the timing of a single traffic light at a busy intersection from 30 seconds (green) to 35 seconds.
  *   **The Short-Term Chain:** Traffic flows slightly smoother. 500 cars save 10 seconds each. Two rear-end collisions are avoided; one side-impact collision is caused.
      *   *EV Status:* Calculable. We have data on accident costs, time value, etc. The EV is positive (let's assume).
  *   **The Long-Term Chain (The Cluelessness Injection):** Because of the 5-second shift, specific drivers arrive at specific locations at different times.
      *   Driver A meets Driver B at a coffee shop they wouldn't have visited otherwise. They conceive a child.
      *   Driver C is delayed, misses a job interview, moves to a different city, conceives different children.
      *   *The Effect:* The population of the world 80 years from now is entirely different (Non-Identity). The *value* of that future population is the vast majority of the act's total utility.
      *   *The Problem:* We cannot assign a probability distribution to the value of the "shifted" future population vs. the "status quo" future population. The sign (+/-) is unknowable.

  ### 3. The 75-Minute Arc

  **00:00 – 10:00: Lock the Door (The Commitments)**
  *   Briefly state the three commitments above.
  *   **Tactic:** If someone objects to Temporal Neutrality, grant them a low discount rate but insist it isn't zero. Ask: "If the long-term effects are *big enough*, do they still swamp the short term?" (They will say yes).
  *   **Goal:** Ensure everyone agrees that the *long-term* consequences dominate the total value of the act.

  **10:00 – 25:00: The Machinery Working (Short-Term EV)**
  *   Walk through the Traffic Light case *ignoring* effects beyond 1 year.
  *   Have them sketch the EV calculation. Accidents avoided vs. time saved.
  *   **Goal:** Make them feel the comfort of standard decision theory. They should feel like consequentialists here. The machinery works. The facts are accessible.

  **25:00 – 45:00: The Break (Introducing Cluelessness)**
  *   Extend the timeline to 80 years.
  *   Introduce the Non-Identity ripple. Ask: "What is the expected value of the *new* people brought into existence by this timing shift compared to the *old* people?"
  *   **The Pivot:** Do not let them say "we don't know." Push for: "Can we assign a probability?"
  *   **The Deep Gap:** Force the distinction between **Risk** (known probabilities) and **Uncertainty/Cluelessness** (unknown/undefined probabilities).
  *   **Key Move:** Ask them to compare the EV of *Changing the Light* vs. *Keeping the Light*.
      *   Short-term: Change is +100 utils.
      *   Long-term: Change is [Undefined].
      *   Total: +100 + [Undefined] = ?
  *   **Goal:** They must feel that the +100 is rendered mathematically irrelevant by the undefined term swamping it.

  **45:00 – 65:00: Head Off the Wrong Turns**
  This is where you earn your pay. Do not let the discussion drift. Shut down these three moves immediately:

  *   **Wrong Turn 1: "This just means we need better evidence/models."**
      *   *Your Counter:* "The data *does not exist*. The future people do not exist to be measured. This isn't an epistemic limitation of *us*; it's a structural limitation of *causality* in a chaotic system. Even a Laplacian Demon struggles here if value depends on identity."
  *   **Wrong Turn 2: "So we just use huge error bars / confidence intervals."**
      *   *Your Counter:* "An error bar implies a distribution (e.g., Normal Distribution centered at 0). Cluelessness argues we cannot justify *any* distribution. If the variance is infinite or the mean is undefined, the error bar doesn't help. You can't maximize an undefined function."
  *   **Wrong Turn 3: "This proves Consequentialism is dead; let's be Virtue Ethicists."**
      *   *Your Counter:* "We are stress-testing Consequentialism, not abandoning ship. If Consequentialism is true, it must handle this. Retreating to 'act according to virtue' concedes the normative authority to something else. Can Consequentialism be *repaired* (e.g., satisficing, subjective rules) without ceasing to be Consequentialism?"

  **65:00 – 75:00: The Closing**
  *   Summarize the tension: The theory demands we maximize EV, but the primary component of EV is structurally inaccessible.
  *   Pose the Closing Question (see below).
  *   Dismiss exactly on time.

  ### 4. What to Deliberately Leave Out
  You have 75 minutes. Cut the following ruthlessly:

  1.  **Infinite Ethics / Pascal's Mugging:** This is a distraction. Cluelessness applies even in a finite universe with bounded utility. Infinite ethics is about *unbounded* value; cluelessness is about *unknowable* value. Don't let them conflate the two.
  2.  **Deep Non-Identity Metaphysics:** Don't let the session become a Parfit seminar. Use Non-Identity only as the mechanism that makes the long-term value sign-indeterminate. Do not debate whether the future people have complaints.
  3.  **Subjective Consequentialism as a "Fix":** Allow it to be mentioned as a retreat, but do not let them settle there. If the session ends with "Well, I'll just follow subjective expectations," they haven't felt the problem. The problem is that subjective expectations are *unwarranted* when the objective facts are undefined.

  ### 5. The Closing Question
  This question diagnoses whether they grasped the *structural* nature of the problem vs. the *epistemic* nature.

  > **"If the long-term consequences dominate the value of the act, but the probabilities for those consequences are undefined (not just unknown), does the 'right' action still exist objectively, or have we proven that 'betterness' is incomplete?"**

  *   **If they say:** "The right action exists, we just can't know it." -> They missed the point (they think it's just epistemic).
  *   **If they say:** "There is no fact of the matter." -> They felt the deep version (the ranking is up for grabs).
  *   **If they say:** "We should just maximize short-term." -> They rejected Temporal Neutrality (check Commitment A).

  **Why this works:** It forces them to choose between the ontology of value (does 'better' exist?) and the action-guiding capacity of the theory. If 'better' is incomplete, maximizing is impossible *in principle*, not just in practice. That is the bone-deep feeling you want them to leave with.
