answer: |-
  **PROJECT PROPOSAL: WORKSHOP FUNDING**

  **Project Title:** Logical Correlation and Act-Individuation in the Absent-Minded Driver Problem
  **Principal Investigator:** [Your Name]
  **Department:** [Your Department]
  **Date:** [Current Date]

  **1. The Research Question**
  The Absent-Minded Driver (AMD) problem is standardly treated as a puzzle of imperfect recall resolved by ex-ante policy optimization. The standard view holds that the driver commits to a mixed strategy ($p=2/3$) at the start, and the decision at the intersection is merely the execution of that plan. There is no tension between the "self" at the start and the "self" at the exit.

  This project asks a determinate question: **Does the tension between ex-ante planning and interim rationality in the AMD problem dissolve under conditions of partial recall, or does it reveal a structural failure of Causal Decision Theory (CDT) to account for logical correlations between token-distinct acts?**

  If the standard view is correct, introducing partial information (a noisy signal regarding location) should simply allow the agent to update credences and maximize expected utility causally. If my hypothesis is correct, the decision at the intersection remains evidentially linked to the decision at the other intersection regardless of signal noise, creating a divergence between what is causally optimal *now* and what is logically optimal *overall*. This would identify AMD not as a memory glitch, but as a Newcomb-like problem where the "predictor" is the agent's own future/past self implementing the same algorithm.

  **2. Background and Motivation**
  The standard solution (Piccione & Rubinstein, 1997) resolves AMD by prioritizing ex-ante optimization over interim consistency. The agent chooses a probability $p$ of continuing before the trip begins. At the intersection, the agent is "absent-minded" and cannot update on being at an intersection (since they knew they would be there).

  My colleague argues this closes the philosophical case: it is a game against nature with imperfect information. I argue this forecloses the deeper issue of **act-individuation**. In Newcomb's Problem, the correlation between your choice and the box content is mediated by a predictor. In AMD, the correlation between "Continue at Exit 1" and "Continue at Exit 2" is mediated by the fact that they are outputs of the same decision function.

  Standard CDT treats the act at the current node as causally independent of the act at the other node (given the past plan). However, if the agent is rational, they know that if they choose "Continue" now, they *would have chosen* (or *will choose*) "Continue" at the other node, because they cannot distinguish the nodes. This is a logical correlation, not a causal one. Standard treatments ignore this, effectively treating the driver as two different agents linked by a contract, rather than one agent making one type of decision twice.

  **3. Methodology and Design**
  The project will proceed in three phases over six weeks.

  **Phase 1: Formal Reconstruction.**
  I will formalize the AMD problem using the frameworks of Causal Decision Theory (CDT) and Functional Decision Theory (FDT) / Evidential Decision Theory (EDT). The goal is to explicitly map where the standard "policy optimization" solution diverges from an "act-optimization" approach that respects logical correlations.

  **Phase 2: The Partial Recall Variation.**
  As a test case, I will introduce a "Partial Recall" variant. The driver receives a signal $S$ at each intersection. $S$ is correct with probability $\alpha$ (e.g., $\alpha=0.6$).
  *   *The Friend's Prediction:* As $\alpha$ increases, the problem converges to a standard decision problem with imperfect information. The agent updates on $S$ and chooses the causally optimal act. The "act-identity" issue vanishes because the informational states differ.
  *   *My Prediction:* Even with $\alpha < 1$, the decision function remains identical at both nodes. If the agent reasons "If I Continue here, I am the type of agent who Continues," they must account for the probability that this is Exit 1 *and* that they Continued at Exit 1, or this is Exit 2 *and* they will Continue at Exit 2.
  *   *Critical Design Note:* I will ensure the signal is noisy regarding *location*, not regarding the *agent's state*. This preserves the symmetry of the decision algorithm. If the signal makes the nodes distinguishable enough to break the symmetry of the decision function, the test fails. I will model the signal as endogenous to the agent's uncertainty, not an external tag.

  **Phase 3: Stability Analysis.**
  I will test for **diachronic consistency**. Does the plan chosen ex-ante remain the plan the agent wants to follow at the intersection when partial information is introduced? If CDT recommends a different action at the intersection than the ex-ante plan (without new causal information), the standard "policy optimization" solution is unstable.

  **4. Expected Outcomes**
  *   **Success:** A formal demonstration that under partial recall, CDT yields a time-inconsistent recommendation, whereas a theory respecting act-identity (like FDT) maintains consistency without requiring ad-hoc pre-commitment. This would validate the claim that AMD is a Newcomb-like problem regarding act-individuation.
  *   **Failure:** If the Partial Recall model shows that as soon as *any* distinguishing information is available, the problem reduces to standard Bayesian updating and the "act-identity" tension disappears. This would support my colleague's view that the philosophical weight of AMD relies entirely on the impossibility of distinction, making it a niche epistemic puzzle rather than a decision-theoretic one.
  *   **Deliverable:** A draft manuscript (8,000–10,000 words) suitable for submission to a journal such as *Philosophy of Science* or *The British Journal for the Philosophy of Science*, and a presentation for the department workshop.

  **5. Scope Assessment: Paper or Dissertation?**
  To be straight: **This is a paper, not a dissertation.**

  The core conflict (Ex-Ante vs. Interim rationality in AMD) is well-defined. The "Partial Recall" variation is a specific test case, not a new field of inquiry. A dissertation would require generalizing this to all games of imperfect recall, or building a full axiomatic system for "Logical Act-Identity." This project does not need to solve decision theory; it only needs to show that the standard resolution of AMD is philosophically incomplete.

  However, there is a risk of scope creep. The temptation will be to try to solve the "Newcomb vs. Causation" debate generally. I will restrict the scope strictly to the AMD framework. If the Partial Recall model works, it serves as a counter-example to the claim that "AMD is just imperfect information." That is a sufficient contribution for a strong journal article.

  **6. Budget and Timeline**
  *   **Weeks 1-2:** Formal modeling of Standard vs. Partial AMD.
  *   **Weeks 3-4:** Comparative analysis of CDT/FDT outcomes.
  *   **Weeks 5-6:** Drafting and revision.
  *   **Funds Requested:** Travel for workshop presentation; software license for game-theoretic modeling (if required).

  **7. Conclusion**
  The Absent-Minded Driver is often dismissed as a "puzzle" solved by constraining the agent to a policy. This project argues that the puzzle persists because the constraint is artificial. By testing the problem under partial recall, we can determine whether the driver's dilemma is truly about memory, or about the metaphysics of action. If the latter, AMD becomes a critical test case for modern decision theory, rivaling Newcomb's Problem in significance.

  ***

  **Notes on the "Partial Recall" Hunch (For your eyes only):**

  You asked me to be straight about your "Partial Absent-Mindedness" idea. Here is the risk: **Your friend might be right about this specific variation.**

  If the signal is 60% accurate *at each node independently*, you technically break the "same act" symmetry. Why? Because your informational state at Node 1 ($S_1$) and Node 2 ($S_2$) are now distinct random variables. A sophisticated CDT agent can condition their strategy on the signal (e.g., "If Signal says Exit 1, Continue; if Signal says Exit 2, Exit").

  If the strategy becomes conditional on the signal, the acts are no longer "type-identical" in the strong sense you need. They become "If $S=A$ then Continue" vs "If $S=B$ then Exit." Your friend will argue this proves the problem was just about information all along.

  **How to save your hunch:**
  You must frame the Partial Recall not as a signal about *location*, but as a signal about *competence*. Or, you must insist that the agent must choose a **unconditional policy** regarding the signal (e.g., "I will ignore the signal").
  *Better yet:* The strongest version of your argument doesn't need the signal. It needs **Iterated AMD**. If the driver plays the game 100 times, does learning occur?
  *However,* for the proposal, keep the Partial Recall but add the caveat I included in Phase 2: *"I will ensure the signal... preserves the symmetry of the decision algorithm."* This protects you. If the signal breaks the symmetry, you report that as a result (Failure condition), which is still a valuable philosophical finding.

  **Verdict:** This is a solid 2-page proposal. It's focused, the stakes are clear, and the "Failure" condition is actually just as interesting as the "Success" condition. Go for it.
