answer: |-
  **Project Title:** The Accountability Test: Normativity as the Constitutive Mark of Joint Action

  **Project Summary**
  Dominant accounts of joint action posit that what distinguishes doing something together from merely acting in parallel is a specific cognitive architecture: interlocking intentions, common knowledge, or a shared plan. While sophisticated, these accounts struggle to accommodate minimal cases of coordination—such as strangers forming a queue, improvising musicians, or pedestrians navigating a crowded pavement—where agents coordinate successfully without representing a shared goal. Conversely, they sometimes classify coerced or purely strategic interactions as joint simply because intentions interlock.

  This project proposes and tests a novel criterion: the **Accountability Test**. The hypothesis is that the mark of joint action is not cognitive (shared intention) but normative. A stretch of behaviour counts as joint action if and only if, upon deviation by one participant, the others are warranted not merely in feeling surprise, but in *demanding an account* from the deviator as something owed to them. This project seeks to determine whether this normative warrant is constitutive of joint action or merely a downstream byproduct of shared intention. Over a ten-week term, I will refine the test, apply it to a curated set of contested cases, and produce a draft article arguing that normativity is the more fundamental phenomenon.

  **Background and Research Question**
  Current literature largely treats the normative dimension of joint action (obligations, entitlements to rebuke) as a consequence of prior cognitive alignment. If we share an intention, *then* I owe it to you to play my part. However, this presupposes the very thing that needs explaining in minimal cases. In a spontaneously forming queue, no one forms a shared intention to queue, yet cutting in line warrants a rebuke. In traffic avoidance, two drivers swerve to avoid collision but neither warrants a demand for an account from the other.

  Existing frameworks leave a critical gap: they cannot distinguish between normativity that is *constitutive* of the jointness and normativity that is incidental. By taking the normative warrant as the starting point rather than the conclusion, this project bypasses the stalemate between inflationary accounts (which over-intellectualise simple coordination) and deflationary accounts (which struggle to distinguish joint action from mere causal coupling).

  **Primary Research Question:**
  *Does the warrant to demand an account track the extension of 'joint action' more accurately than shared intention, and is this warrant grounded in prior cognitive states or is it the basic phenomenon?*

  **Methodology and Work Plan**
  The project is designed for completion within a ten-week term, resulting in a single article-length manuscript (8,000–10,000 words). The work is conceptual and analytic, relying on case comparison rather than empirical data collection.

  **Month 1: Operationalisation and Case Selection (Weeks 1–4)**
  *   **Weeks 1–2: Refining the Test.** The notion of "demanding an account" requires precision to avoid conflation with mere disappointment or strategic retaliation. I will define the necessary conditions for the warrant: (a) the deviation must be voluntary; (b) the demand must be addressed to the agent as a participant; (c) the warrant must exist prior to explicit agreement.
  *   **Weeks 3–4: Constructing the Case Set.** I will compile a matrix of cases designed to separate shared intention from accountability.
      *   *Joint-without-Intention:* Spontaneous queuing, crowd flow, improvised jazz.
      *   *Intention-without-Jointness:* Coerced cooperation (e.g., handing over money at gunpoint involves interlocking intentions but no warrant to demand an account for deviation), parallel play, strategic market transactions.
      *   *Borderline Cases:* Flash mobs, distributed online tasks, bureaucratic processes.

  **Month 2: Stress Testing and Analysis (Weeks 5–8)**
  *   **Weeks 5–6: Application.** I will run the Accountability Test against the case set. The goal is not to confirm the hypothesis but to break it. I will specifically look for false positives (cases where accountability exists but intuition rejects 'joint action') and false negatives (clear joint action where no account is owed).
  *   **Weeks 7–8: Differentiation.** I will test the hypothesis against rival explanations. If the test passes, is it actually tracking something else? I will explicitly check if the warrant reduces to:
      *   *Mutual Reliance:* Do I demand an account simply because I relied on you?
      *   *Standing Practice:* Is the warrant only present because of a pre-existing social convention (e.g., queuing norms) rather than the action itself?
      *   *Expectation:* Is it merely a violation of prediction rather than obligation?

  **Month 3: Synthesis and Drafting (Weeks 9–10 + Buffer)**
  *   **Weeks 9–10: Drafting.** I will synthesise the findings into a coherent argument. If the test holds, the draft will argue for a normative-constitutive view. If the test fails, the draft will document the specific failure points, which is itself a valuable contribution to the literature.
  *   **Buffer:** Time allocated for internal review and restructuring based on the analysis in Month 2.

  **Expected Outcomes and Failure Conditions**
  A successful project will yield a manuscript demonstrating that the Accountability Test resolves at least two persistent problems in the literature (e.g., the problem of minimal joint action and the problem of coerced coordination).

  However, realism regarding scope and outcome is essential. The project will be considered **complete** even if the hypothesis is falsified, provided the analysis explains *why* it fails. Specific "boring" or negative outcomes that still constitute a finished project include:
  1.  **Reductionism:** The test proves valid but is shown to be fully reducible to mutual reliance or pre-existing social practices, meaning it is not a *new* foundation but a restatement of existing normative accounts.
  2.  **Vagueness:** The concept of "warrant" proves too context-dependent to serve as a necessary and sufficient condition, requiring the project to conclude that joint action is a cluster concept rather than a natural kind.
  3.  **False Positives:** The test incorrectly classifies coercive interactions as joint action (e.g., if a victim owes an explanation to a coercer for slowing down). If this cannot be remedied by Week 6, the scope will shift to diagnosing this specific flaw.

  The project would only be considered a **failure** (in the sense of abandonment) if the core concept of "accountability" proves incoherent upon initial refinement in Week 2, or if the case set reveals that the test tracks nothing distinct from general moral obligation. Given the preliminary work already done, this is unlikely.

  **Feasibility**
  This scope is strictly limited to conceptual analysis and case comparison. It requires no ethical approval, no travel, and no collaboration. The ten-week timeline is sufficient for the refinement of one central argument and the production of one journal article. By focusing on falsification rather than verification, the project ensures progress even if the initial hypothesis does not hold.
