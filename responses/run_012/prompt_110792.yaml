prompt: |-
  I'm putting together a two-page proposal for a departmental work-in-progress fellowship next term (no teaching, so realisticaly about eight to ten weeks of actual work) and I've got a half-baked idea I'd like you to knock into shape. The background is that I've been arguing with my flatmate about whether joint action is really joint — she holds the standard line that whenever two people do something together, it has to bottom out in each of them seperately intending the joint activity, with their intentions interlocking and each knowing the other's, and I've never been satisfied, because traffic, improvised music and people wordlessly forming a queue all look like genuine doing-things-together yet nobody seems to be representing a shared goal in the way the standard picture demands. So here's the bit I want the proposal built around, and it's my own invention, so don't go looking for it in the literature: I think the mark of joint action isn't shared intention at all but a normative one — a stretch of behaviour is joint when, if one participant deviates, the others are warranted not merely in being surprised but in demanding an account from her, as something she owes them. Call it the accountability test. Two strangers swerving to avoid each other on the pavement: no such warrant. A rowing crew, a couple cooking dinner, two people carrying a sofa up a stairwell: warrant. And it cuts across the shared-intention cases rather than just tracking them — some of them pass it and some don't.

  What I want the proposal to do is make this precise enough to be attacked. State the question so it has a determinate answer — something like: does the accountability test sort the contested cases correctly, and is the warrant it picks out grounded in prior shared intention or is it the more basic phenomenon? Explain why the going accounts leave this open (they mostly either presuppose shared intention or treat the normative side as a downstream bonus, so they can't even pose the question), and why my angle is better than just doing another intuition-pump survey of the same dozen examples everyone recycles. Then give me the method, month by month for a term: fix the test's wording, run it against a case set chosen so that some cases are joint-without-shared-intention and some are shared-intention-without-jointness (if any exist), and actively hunt for the counterexamples that break it. Say what a result would look like — including the boring outcome that the test is really just tracking something else, like mutual reliance or the presence of a standing practice — and be honest about what would count as the project failing, not just "it didn't work out". And give me a realistic scope; I'd rather propose something I'll actually finish than something impressive I'll abandon in week three. Don't bother with citations, I'll add those myself. British English, please.
