answer: |-
  The ledger mechanics of forgiveness budget and dramatic irony translate cleanly, but the philosophical distinction between a true statement and a permissible accusation dissolves into narrative tone.

  Here is the translation, one by one.

  **The Forfeiture Line:** This translates cleanly as **forgiveness budget**. If the reader has watched her spend her currency on the same sin in Act One, she is bankrupt at the dinner table. The ledger doesn't lie; she has no credit left to spend on judgment. When she accuses him, she is trying to spend money she doesn't have.

  **The Complicity/Business Line:** This survives with bending as **POV authority**. In close third, we inhabit her justification, but the **book agreeing with her** is separate from her being factually correct. Philosophy asks if it's her business; craft asks if the narrative voice grants her the weight to judge. If the text doesn't support her authority, the beat lands as noise, not critique.

  **Blaming vs. Saying Something True:** This translates cleanly as the gap between **character being right** and **dramatic validity**. She can speak facts (the brother's sin) while the scene invalidates the delivery. The proposition holds; the performance fails. The reader accepts the truth of the accusation while rejecting the accuser.

  **Impermissible vs. Inert:** This is where the bend becomes a break. Philosophy calls the blame impermissible; craft calls it **inert**. If the hypocrisy isn't staged as irony, the scene doesn't feel "wrong," it feels flat. The moral violation becomes a pacing issue. There is no craft equivalent for "morally forbidden but dramatically functional."

  **The Third Party:** This translates cleanly as the **Reader's ledger**. They hold the master account. They see the Act One sin and the Act Two accusation simultaneously. They are the only ones with full standing because they hold the whole manuscript.

  **Residue Report**

  What remains is the nagging sense that the hypocrisy carries a weight independent of the reader's engagement—that the scene is "wrong" even if the irony lands. Is this evidence your vocabulary is missing something real, or that the philosophers are leaning on a picture that dissolves under staging?

  It is the latter. The philosophy dissolves because it treats blame as a static right you own, whereas your vocabulary treats blame as a dynamic tension you spend. The philosophers ask, "Is this allowed?" Your craft asks, "Does this work?" The residue is the illusion that "allowed" exists outside of "works."

  When you stage this at a table, the "right to blame" isn't an abstract status; it is whether the reader leans in or checks out. If the reader enjoys the irony, the blame is permitted. If the reader groans, it is forfeit. The philosophers imagine a court of appeal outside the text; you know the only court is the reader's experience of the scene.

  The leftover feeling isn't a missing craft tool; it's the ghost of a moral framework that doesn't apply to fiction. In life, a hypocrite might be wrong to speak even if everyone listens. In a book, if everyone listens, the speech is valid. The residue proves that "standing" is not a property of the character, but a function of the **dramatic irony**. You don't need new vocabulary; you need to trust that the ledger is the only morality that matters. The philosophy assumes a world where truth exists apart from the telling; your job is a world where truth is only what the telling sustains.
