  Hey, I want a poem about the absent-minded driver problem. The setup, in case its fuzzy: a guy is driving home on a highway with two exits, and at each one he has to decide whether to get off or keep going, but he's got no memory and cant tell the two exits apart, so from the inside it's just one decision he keeps facing. Payoffs: get off at the first exit and you score 0, get off at the second and you score 4, sail past both and you score 1. The best strategy from before he ever sets out is to randomize — keep driving with probability 2/3 — but that's a plan he couldn't defend to himself in the moment, sitting at an exit he can't identify. Give me exactly five stanzas of four lines each, no intro or outro, and make the last line of every stanza the same line, or almost — by the final stanza one word is allowed to change. The repetition has to do the work: he keeps arriving at "the same" decision, and the reader shouldn't be able to tell any better than he can whether a given stanza is the first exit or the second.
