  # Which Theory of Uncertain Evidence Do You Actually Hold?

  **START:** I am a Bayesian and a signal arrives that I am not certain about (e.g., a dim light, a noisy instrument, an expert's tentative report).

  ### NODE 1: Do you assign probability 1 to any proposition describing the signal?
  *   **YES:** Go to **Node 2**.
  *   **NO:** Go to **Node 4**.

  ### NODE 2: What is the proposition you are certain of?
  *   **A Fact about the World/Source:** (e.g., "The gauge points to 5.")
      *   → **LEAF: Evidential Certainty**
      *   *Awkward Commitment:* You must be certain the instrument didn't malfunction, even when it looks noisy.
  *   **A Fact about Your Experience:** (e.g., "It looks like 5 to me.")
      *   → **LEAF: Phenomenal Certainty**
      *   *Awkward Commitment:* You must treat your own fallible seemings as infallible evidence.
  *   **An Observation Report:** (e.g., "I observed '5'." — added to your algebra just for this.)
      *   → **LEAF: Algebra Expansion**
      *   *Awkward Commitment:* You must expand your language for every signal, risking a trivial or unmanageable algebra.

  ### NODE 3: (If YES to Node 1) Is the proposition already in your algebra?
  *(Note: If you answered "Observation Report" above, you effectively answered "No" here.)*
  *   **NO:** (You shove the observation in as a new event.)
      *   → **LEAF: Algebra Expansion** (See above).
  *   **YES:** (It was already there as World or Experience.)
      *   → **LEAF: Evidential / Phenomenal Certainty** (See above).

  ### NODE 4: (If NO to Node 1) Do you hold conditional credences fixed (Rigidity)?
  *   **YES:** Go to **Node 5**.
  *   **NO:** Go to **Node 6**.

  ### NODE 5: Can you list the possible observations in a fixed partition in advance?
  *   **NO:** (The signal is continuous or too rich to partition.)
      *   → **LEAF: Likelihoodism**
      *   *Awkward Commitment:* You treat inputs as likelihood ratios only, refusing to update credences in the evidence space itself.
  *   **YES:** Go to **Node 5b**.

  ### NODE 5b: Must two signals in a row give the same answer in either order?
  *   **NO:** (Order is allowed to matter.)
      *   → **LEAF: Jeffrey Conditionalization**
      *   *Awkward Commitment:* You accept that the order of learning the same evidence can change your final belief.
  *   **YES:** (Order must not matter.)
      *   → **LEAF: Commutative Updating**
      *   *Awkward Commitment:* You must adopt complex constraints to fix order, often secretly violating rigidity to do so.

  ### NODE 6: (If NO to Node 4) Does a Dutch Book argument force a specific rule?
  *   **NO:** (It only tells you to be coherent.)
      *   → **LEAF: Brute Shift**
      *   *Awkward Commitment:* You allow rational belief changes that are completely unconstrained by the prior state.
  *   **YES:** (It forces a specific transition rule.)
      *   → **LEAF: Commutative Updating** (See above).
      *   *(Note: This path reaches the same leaf as Node 5b via a different motivation.)*

  ***

  ## Analysis of the Tree

  ### Indistinguishable Leaves
  **Evidential Certainty** and **Algebra Expansion** are often the same rule wearing different hats. Both result in conditionalizing on a proposition $E$ where $P_{new}(E)=1$. The only difference is metaphysical: one claims $E$ was always in your algebra (a fact about the source), the other claims you added $E$ to handle the report. Mathematically, they update identically.
  **Phenomenal Certainty** is also structurally identical to **Evidential Certainty**, differing only on whether the certain proposition is internal ("looks red") or external ("is red"). If your model links looks to red perfectly, the update is the same.

  ### Unoccupied Combinations
  **Rigidity + Commutativity (Node 5b, YES):** This combination is theoretically unstable. Standard Jeffrey Conditionalization is rigid but non-commutative. Views that enforce commutativity (like distance-minimizing rules) typically must abandon rigidity to achieve it. A view that insists on *both* is largely unoccupied because it is mathematically difficult to sustain without collapsing into Certainty views.
  **No Rigidity + No Dutch Book Force + Specific Rule:** If you reject rigidity and deny that Dutch Books force a specific rule, there is no motivation left to adopt a specific updating rule. This combination is unattractive; you would either accept a rule (and thus some constraint) or accept Brute Shift.

  ### Diagnostic Cases
  1.  **Dim Light (Red 0.7 / Orange 0.3):** This is the classic **Jeffrey Conditionalization** case (Node 5, YES). If you insist order shouldn't matter, you are pushed toward **Commutative Updating**. If you think you are actually certain it *looks* 0.7 red, you jump to **Phenomenal Certainty** (Node 1, YES).
  2.  **Colleague Says 0.8:** This separates **Evidential Certainty** (You conditionalize on "Colleague said 0.8") from **Jeffrey Conditionalization** (You shift your credence in H to 0.8 without becoming certain of the report). If you treat the report as a new event you conditionalize on, you are at **Algebra Expansion**.
  3.  **Two Signals in a Row:** This is the **Node 5b** split. If you think learning A then B should equal B then A, you cannot be a standard Jeffrey Conditionalizer; you must be a **Commutative Updater** (and likely sacrifice rigidity) or a **Certainty** theorist (who conditionalizes, ensuring commutativity).
