answer: |-
  You are absolutely right to feel that something slippery is happening there, and it is not a dumb question at all. In fact, your intuition that the sentence is doing four different jobs is probably an underestimate. The phrase the brain is a computer is a chameleon that changes its color depending on whether the speaker is trying to explain a method, make a metaphysical commitment, or win a debate. When people use it to shut down questions about slime molds or plants, they are usually relying on an equivocation between these different readings, sliding from one to another without noticing. To give you the menu you asked for, we need to separate the claim into its distinct layers, starting with the weakest and moving to the strongest.

  The first and weakest reading is the methodological or modeling claim. On this view, saying the brain is a computer just means we can usefully model its behavior using computational tools and concepts. This is essentially a platitude. Since we can write equations for almost any dynamic system, we can treat a brain, a weather system, or a slime mold as a computer if we are willing to map its states to inputs and outputs arbitrarily. This is a pragmatic claim about utility, settled by whether the models produce good predictions. If this is all someone means, then the claim is true but trivial, and it absolutely does not support shutting down the question about plants. If the claim is just that we can model a plant computationally, then admitting that plants compute costs nothing, so using this definition to say the brain is obviously a computer while a plant is not is inconsistent. People rarely mean only this when they get defensive, because it concedes too much to the skeptic.

  The second reading is the literal mechanistic claim, which is much stronger and likely false. This is the idea that the brain physically operates like a digital desktop computer, with neurons acting as logic gates processing binary bits in a clocked sequence. This is an empirical claim about the specific causal architecture of the brain, settled by neurophysiologists and biophysicists. We know that neurons are analog, noisy, chemical, and parallel in ways that standard silicon computers are not. If this were the claim being made, it would be a big deal if true, but it is vulnerable to obvious counterexamples. Nobody who knows the literature actually holds this strictly, yet the rhetoric often sounds like it. If this were the reading, it would not support shutting down the plant question because it would require showing that plants lack this specific digital architecture, which is an open empirical question, not an obvious truth.

  The third reading is the functionalist or metaphysical claim, which is what most cognitive scientists intend when they are being precise. This is the Computational Theory of Mind, which states that mental states are defined by their functional role rather than their physical substrate. Here, the claim is that cognition is computation, regardless of whether it is made of neurons, silicon, or slime. This is a metaphysical thesis about the nature of mind, settled by philosophical argument and conceptual coherence rather than just empirical data. This reading could support shutting down the question, but only if you have already won the argument about functionalism. If you assume functionalism is true, then anything that realizes the right causal structure computes, and the brain is definitely one of those things. However, this does not help you distinguish the brain from a plant unless you also claim plants cannot realize those causal structures, which brings you back to empirical debate. When people say obviously in this context, they are treating a contested metaphysical thesis as a settled fact.

  The fourth reading is the pancomputationalist claim, which is often the defensive fallback. This view holds that computation is so broad a category that almost everything computes, including rocks and plants, provided you describe them at the right level of abstraction. This is a metaphysical or definitional claim, settled by how one chooses to define computation. If this is the reading, then saying the brain is a computer is true, but it is empty because it applies to everything. This reading definitely does not support shutting down the question about whether plants compute, because on this view, plants do compute. Yet, this is often the view people retreat to when pressed, because it makes the claim unfalsifiable. They want the prestige of the brain being a computer without the implication that a rock is one, so they slide between this view and the functionalist view depending on which is more convenient.

  The fifth reading is the claim of explanatory privilege, which is normative rather than descriptive. This says that even if the brain is also a chemical or biological system, the computational level is the right or only level that matters for explaining cognition. This is a methodological norm, settled by the scientific community based on which explanations yield the most insight. This is probably the most honest reading of what researchers actually care about, but it does not support shutting down the question either. It invites debate about whether the computational level is actually sufficient, or whether biological details matter. Using this to stop a question about plants is a category error, because the question about plants is usually about whether the computational description applies to them, not whether it is the best description for the brain.

  So, to answer your core concern about which reading supports the shutdown move and which is usually meant, the honest answer is that none of them logically support the dismissive obviously move on their own, which is why the move feels so frustrating. The shutdown works only by equivocation, borrowing the trivial truth of the modeling claim to make the statement seem safe, while borrowing the metaphysical weight of the functionalist claim to make it seem profound. When someone drops this line to win an argument about whether plants compute, they are usually meaning the functionalist claim but relying on the audience hearing the modeling claim. They want you to accept that the brain is a computer in the deep sense that matters for cognition, but they don't want to defend the boundaries of that definition against edge cases like plants. They are treating a theoretical framework as if it were an observed fact like the brain is made of cells.

  If I had to pinpoint exactly what is happening in those reading group moments, it is a defense of the explanatory privilege reading disguised as the literal mechanistic reading. They want to protect the idea that computation is the correct level of description for the brain, and they worry that if you allow plants or slime molds into the club, the concept becomes too diluted to do any explanatory work. So they say the brain is a computer obviously to draw a boundary, but they refuse to specify the criteria for that boundary because doing so would reveal that it is a choice, not a discovery. Your sense that the jobs do not fit together is correct because the statement is being asked to carry both the weight of an empirical discovery and the immunity of a definition, and it cannot do both at once. The most productive way to handle it in your group is to ask them which definition they are using and whether that definition applies to the counterexamples they are trying to exclude, which usually forces them to admit that the obviously was doing a lot of heavy lifting.
