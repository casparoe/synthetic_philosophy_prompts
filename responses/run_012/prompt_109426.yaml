  I am a retired natural scientist who has spent the past several years reading philosophy, and I am applying for a one-year fellowship for independent scholars; I need a two-page proposal. My half-formed idea concerns superrationality -- the proposal that agents who know they would reason identically ought to cooperate in a one-shot prisoner's dilemma -- which is nearly always discussed for games whose players are exactly symmetric in payoffs, options, and information. The standard rationale, that the other player will reach the same conclusion because she reasons as I do, loses its grip as soon as the game is asymmetric: writers variously retreat to the idea that the players share a program, to team reasoning, or to a restriction to symmetric games, without making clear which feature is doing the work. My suspicion, imported from the symmetry arguments of my old field, is that the operative notion is invariance under a transformation exchanging the two decision problems, and that the philosophically interesting cases are those in which no such transformation exists -- where the question becomes whether a weakened, partial-symmetry version of the recommendation survives as a constraint or simply evaporates. Please turn this into a proposal: state the question so that it has a determinate answer, explain why the existing positions leave it open, describe the method and the sequence of work across the year, say what a result would look like and what would count as failure, and give a candid assessment of whether the project is too ambitious for one year. No citations are needed; I will supply those myself.
