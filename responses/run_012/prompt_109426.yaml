answer: |-
  **Project Title:** Invariance and the Bounds of Superrationality: A Formal Analysis of Asymmetric Strategic Interaction

  **Project Summary**
  In the literature on rational choice, "superrationality" proposes that agents who know they reason identically ought to cooperate in a one-shot Prisoner's Dilemma, even where standard dominance reasoning dictates defection. The standard justification relies heavily on symmetry: if you and I face identical payoffs, options, and information, and we are both rational, we must reach the same conclusion. Consequently, my choice is evidentially linked to yours, making cooperation the utility-maximizing choice. However, this rationale loses its grip the moment the game becomes asymmetric. If our payoff structures differ, the claim that we will "reason identically" becomes ambiguous. Proponents currently retreat to three unsatisfying positions: restricting the norm to perfectly symmetric games, positing a shared causal source (a "shared program"), or shifting the unit of agency to "team reasoning." None of these isolate *which* feature of the interaction generates the normative constraint.

  Drawing on methods from theoretical physics, where symmetry arguments determine physical laws even in the absence of complete knowledge, I propose that the operative notion in superrationality is not identical reasoning per se, but **invariance under a transformation exchanging the two decision problems**. This project seeks to formalize this invariance condition and determine whether a weakened, partial-symmetry version of the superrational recommendation survives in asymmetric games, or whether the normative force evaporates entirely when the isomorphism between players breaks.

  **The Research Question**
  The project addresses a specific, determinate question: **What are the necessary and sufficient structural conditions of invariance between two distinct decision problems such that the superrational obligation to cooperate remains binding?**

  This is not merely a request for a new intuition pump. It demands a formal specification of the "decision problem" as a mathematical structure. The answer will take the form of a theorem or a rigorous argument establishing a threshold: below a certain degree of structural isomorphism (invariance), the superrational norm collapses into standard Nash reasoning; above that threshold, a cooperative equilibrium is rationally mandated despite asymmetry.

  **Critique of Existing Positions**
  Current approaches leave this question open because they conflate the *cause* of the correlation with the *justification* for the norm.
  1.  **Restriction to Symmetry:** Many theorists simply limit superrationality to symmetric games. This avoids the problem rather than solving it, leaving it unclear whether the limitation is principled or merely convenient.
  2.  **Shared Program:** Some argue players must share a source code or causal origin. This imports metaphysical baggage unnecessary for rational choice and fails to explain why two independent but similar minds should not cooperate.
  3.  **Team Reasoning:** Others argue agents should reason as a collective. While this yields cooperation, it changes the subject from individual rationality to group agency, bypassing the tension that makes superrationality philosophically interesting.

  None of these accounts analyze the *degree* of similarity required. They treat symmetry as a binary switch (on/off) rather than a continuous variable subject to transformation analysis. My hypothesis is that the normative force scales with the degree of invariance, and the project will test whether this scaling is linear, threshold-based, or non-existent.

  **Methodology and Sequence of Work**
  The project employs a hybrid method of formal game-theoretic modeling and conceptual analysis. The "natural scientist" approach will be to treat the decision problems as physical systems and the rationality constraint as a symmetry principle.

  *   **Months 1–3: Formalization of the Decision Structure.**
      I will define the decision problem not merely as a payoff matrix, but as a tuple including utility functions, information sets, and reasoning capabilities. I will define the "exchange transformation" formally: a mapping that swaps Player A's problem with Player B's. In symmetric games, this is an automorphism. In asymmetric games, it is not. I will catalog the specific ways asymmetry breaks this transformation (payoff scaling, option availability, information privacy).

  *   **Months 4–6: Constructing Asymmetric Cases.**
      I will generate a series of modified Prisoner's Dilemmas where symmetry is broken incrementally. For example, one player has a higher temptation payoff, or one player moves first with incomplete information. For each case, I will apply the standard superrational argument to identify exactly where the logic fails. Is it the utility comparison? The prediction of the other's move?

  *   **Months 7–9: Testing Partial Invariance.**
      This is the core analytical phase. I will propose weakened invariance conditions (e.g., invariance of ordinal ranking despite cardinal differences, or invariance of reasoning process despite payoff differences). I will test whether the superrational conclusion holds under these weakened conditions. The goal is to derive a "Superrational Invariance Principle" that specifies the minimum structural overlap required for cooperation.

  *   **Months 10–12: Synthesis and Writing.**
      The final quarter will be dedicated to writing the monograph-length paper. I will refine the formal proofs and ensure the philosophical implications for normative ethics and rational choice theory are clearly articulated.

  **Deliverables and Criteria for Success**
  **Success:** The project succeeds if I produce a formal definition of "Superrational Invariance" and a definitive classification of asymmetric games into those where cooperation is mandated and those where it is not. A successful result might show, for instance, that payoff asymmetry is irrelevant provided the *reasoning structure* is invariant, or conversely, that any payoff asymmetry destroys the normative link. Either way, the boundary will be drawn.

  **Failure:** The project fails if the analysis demonstrates that *only* perfect symmetry sustains the argument, rendering the investigation of asymmetry trivial. A second mode of failure would be getting bogged down in formalism that cannot be translated back into philosophical discourse, resulting in a technical exercise with no normative implications. I mitigate this by maintaining a parallel track of conceptual analysis alongside the formal modeling.

  **Feasibility and Ambition Assessment**
  Is this too ambitious for one year? It is a aggressive schedule, but feasible given my background. The mathematical heavy lifting (group theory applied to game structures) aligns with my training as a natural scientist, allowing me to work faster than a typical philosopher might on the formalism. However, the philosophical interpretation requires careful reading and nuance to avoid "physics envy" or category errors.

  The risk lies in the scope of "asymmetry." It is a vast space. To remain feasible, I will restrict the inquiry to two-player, finite games with complete information but asymmetric utilities. I will explicitly exclude dynamic games or games with incomplete information for this fellowship year. By narrowing the technical scope, I ensure the conceptual depth remains manageable. The goal is not to solve all of rational choice theory, but to settle the specific question of whether symmetry is a binary prerequisite or a gradable constraint for superrationality. Given the focused scope and my capacity for independent work, I am confident this can be completed within the fellowship term.
