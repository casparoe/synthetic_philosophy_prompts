answer: |-
  **UNIVERSITY OF OXFORD**
  **DEPARTMENT OF PHILOSOPHY OF SCIENCE**

  **PAPER: METAPHOR AND MECHANISM IN THE LIFE SCIENCES**
  **TIME ALLOWED: 90 MINUTES**

  **INSTRUCTIONS:**
  Candidates may view this paper one week prior to the examination. No notes, texts, or electronic devices are permitted in the examination room. Answer **ONE** question.

  ***

  **QUESTION 1**

  It is a settled biochemical fact that the mapping between codons and amino acids is chemically arbitrary; there is no steric or energetic necessity that GCU specifies alanine. However, the standard genetic code is not random: it appears optimised to minimise the phenotypic impact of point mutations and mistranslation.

  Critically assess the inference from this chemical arbitrariness to the claim that DNA carries *information* and thereby *instructs* the cell. In your answer, you must address the following:

  1.  Does the evolutionary optimisation of the code undermine the claim of arbitrariness, and if not, why?
  2.  What specific theoretical work is required to distinguish DNA from other necessary developmental resources (the Parity Thesis), thereby licensing the move from 'causal influence' to 'informational instruction'?
  3.  Must a defence of the 'code' metaphor rely on a specific theory of biological information (e.g., Shannon, Teleosemantic), and is there consensus on which theory is appropriate?

  ***

  ### MODEL ANSWER

  The claim that DNA is a code rests on a specific interpretation of the relationship between genotype and phenotype. While it is settled science that the codon-amino acid mapping lacks chemical necessity—unlike, say, the fit of a key in a lock—this Saussurean arbitrariness does not automatically license the stronger claim that genes *instruct* the cell. To validate the code metaphor, one must navigate the tension between arbitrariness and optimisation, and defend DNA's privileged status against the Parity Thesis.

  First, the optimisation of the genetic code does not negate its arbitrariness. Arbitrariness here means there is no *chemical* law dictating the mapping, not that the mapping is historically random. The code is 'frozen accident' subject to natural selection. That it is robust against error suggests it was selected from a space of possible arbitrary codes. A defender of the code metaphor must therefore distinguish between chemical determination (which is absent) and evolutionary selection (which is present). Confusing these leads to the error of thinking optimisation implies chemical necessity.

  Second, moving from 'arbitrary mapping' to 'information' requires more than noting a correlation. If information is merely causal specificity, the Parity Thesis holds: the cytoplasm, maternal environment, and ribosomes are as causally specific as DNA. To reject parity and claim DNA *instructs*, one must show DNA plays a unique functional role. This usually involves arguing that DNA is the *selected* factor, whereas the cytoplasm is merely a background condition. However, this is contested. Some argue that context determines which factor is informational; in some contexts, the cytoplasm carries the specific difference.

  Third, the defence of the code metaphor depends heavily on which theory of information is employed, and there is no consensus on this. A Shannon-style approach treats information as reduction of uncertainty; on this view, any causal correlate carries information, which strengthens the Parity Thesis and weakens the 'instruction' metaphor. Conversely, a teleosemantic approach ties information to biological function and evolutionary history. This allows a defender to argue DNA carries 'meaning' because it was selected to do so, unlike the cytoplasm. However, this relies on the contested view that semantic properties can be naturalised without invoking homunculi.

  Ultimately, the move from arbitrariness to instruction is not licensed by biochemistry alone. It requires a philosophical commitment to a theory of function. The code metaphor is useful heuristically, but treating it as ontologically distinct from other developmental resources requires demonstrating that DNA possesses a teleological status the cytoplasm lacks. Until there is agreement on whether biological information is causal or semantic, the claim that genes 'tell' the cell what to do remains a metaphor in search of a mechanism.

  ***

  ### MARKING SCHEME (Total: 20 Marks)

  **1. Distinction between Chemical Arbitrariness and Evolutionary Optimisation (4 marks)**
  *   **Requirement:** Candidate must explain that 'arbitrary' means lacking chemical necessity, not lacking evolutionary rationale. Optimisation is a result of selection acting *on* an arbitrary system.
  *   **Typical Miss:** Students often claim optimisation proves the code is *not* arbitrary, confusing historical selection with chemical determinism.

  **2. The Inferential Gap: Arbitrariness $\neq$ Information (4 marks)**
  *   **Requirement:** Candidate must identify that an arbitrary mapping is a necessary but insufficient condition for 'information'. One must explain what bridges the gap (e.g., function, context).
  *   **Typical Miss:** Candidates frequently treat arbitrariness and 'aboutness' (intentionality) as identical, assuming any arbitrary sign automatically carries semantic content.

  **3. Engagement with the Parity Thesis (4 marks)**
  *   **Requirement:** Candidate must articulate the challenge: if causality is the criterion, cytoplasm equals DNA. They must state what the defender of the code metaphor needs to show (e.g., selected vs. background conditions) to break this parity.
  *   **Typical Miss:** Students dismiss the Parity Thesis as 'obviously wrong' without analysing the causal symmetry, or they conflate 'degeneracy' of the code with a lack of coding capacity.

  **4. Neutrality regarding Theories of Information (4 marks)**
  *   **Requirement:** Candidate must distinguish between Shannon (causal/correlational) and Teleosemantic (functional) accounts without presenting one as the settled consensus.
  *   **Typical Miss:** Writing as if Teleosemantics is the standard biological view, or conversely, claiming Shannon information solves the problem of 'instruction' entirely.

  **5. The 'Instruction' Metaphor and Agency (4 marks)**
  *   **Requirement:** Candidate must conclude that 'instruction' implies a specific kind of control or agency that requires justification beyond mere causation.
  *   **Typical Miss:** Treating 'instruction' as a synonym for 'causation', thereby missing the normative/functional implication of the word 'tell' in the prompt.
