answer: |-
  1. **The Question**

  **Question 4 (25 marks)**
  Good's Theorem states that for a Bayesian agent, the expected value of free information is non-negative. 
  (a) State the theorem formally in terms of expected utility and provide the 'one-line' dominance proof that establishes it. (8 marks)
  (b) The slogan 'information never hurts' is often used to summarize this result. Explain precisely how this slogan outruns the theorem by listing two critical assumptions required for the proof that the slogan ignores. (7 marks)
  (c) Consider the following case: *You hold a voucher for Dinner A (utility 10). You may eat now, or wait to check a free online review for Dinner B. If you check the review, you may choose B or use the voucher for A. However, the voucher for A expires the moment you load the review page.* Explain why a rational agent might refuse the information. Identify exactly which assumption from part (b) fails in this scenario and why this invalidates the dominance proof you gave in part (a). (10 marks)

  *Testing: Understanding of the formal structure of Good's Theorem, the specific conditions required for the dominance argument, and the ability to diagnose assumption failures in novel decision structures.*

  ***

  2. **Model Answer**

  Good's Theorem claims that for a rational Bayesian agent, the expected utility of a decision problem where free information is observed prior to acting is at least as high as the expected utility of acting without that information. Formally, let $A$ be the set of available actions, $S$ the states of the world, and $E$ the possible evidence signals. Let $a^*$ be the optimal act without information, maximizing $EU(a) = \sum_s P(s)U(a,s)$. With information, upon observing $e$, the agent chooses $a_e$ to maximize $EU(a|e) = \sum_s P(s|e)U(a,s)$. The theorem claims $EU_{info} \geq EU_{no\_info}$.

  The dominance proof relies on the fact that the prior optimal act $a^*$ remains available after observing evidence. For any specific evidence $e$, the agent chooses $a_e$ such that $EU(a_e|e) \geq EU(a|e)$ for all $a \in A$. Since $a^* \in A$, it follows that $EU(a_e|e) \geq EU(a^*|e)$. Taking the expectation over all possible $e$ preserves the inequality: $\sum_e P(e)EU(a_e|e) \geq \sum_e P(e)EU(a^*|e) = EU(a^*)$. Thus, the expected utility with information dominates the expected utility without it. The 'one-line' core is simply: you can always choose to do what you would have done without the info, so you can never do worse.

  The slogan 'information never hurts' outruns the theorem because it implies a universal normative rule, whereas the theorem is conditional on specific structural assumptions. Two critical assumptions often ignored by the slogan are: (1) **Action Set Stability**: The set of available actions $A$ must remain identical whether or not information is observed. (2) **Utility Stability**: The utility function $U(a,s)$ must not change as a result of acquiring the information itself. The slogan suggests information is intrinsically valuable, but the theorem only proves it is instrumentally valuable given a fixed decision structure. If acquiring information alters the available moves or changes what the agent values, the mathematical guarantee collapses.

  In the Dinner Voucher case, a rational agent might refuse the information because checking the review voids the voucher for Dinner A. Without information, the agent secures utility 10 (Dinner A). With information, if Dinner B is poor (utility < 10), the agent cannot revert to Dinner A because the voucher expired upon loading the page. If the expected utility of B is low, the expected value of the information scenario drops below 10. 

  This scenario violates the **Action Set Stability** assumption. In the proof provided in (a), the inequality $EU(a_e|e) \geq EU(a^*|e)$ holds only because $a^*$ (eating Dinner A) is a member of the available set $A$ after observing $e$. In this case, the act set *after* observing evidence is $A' = \{B, \text{Nothing}\}$, whereas the act set *without* observing is $A = \{A, B\}$. Because $a^*$ (Action A) is removed from the set upon learning, the agent loses the ability to 'ignore' the information by sticking to the prior plan. The dominance argument fails because the comparison is no longer between choosing optimally from $A$ versus choosing optimally from $A$; it is between choosing from $A$ versus choosing from $A'$. Since $A' \subset A$, the maximum utility over $A'$ can be strictly less than the maximum over $A$, rendering the expected value of information negative.

  ***

  3. **Marking Scheme**

  **(a) Theorem and Proof (8 marks)**
  *   **2 marks:** Correctly defines expected utility with vs. without information.
      *   *Mistake:* Confuses probability updates with utility changes.
  *   **4 marks:** Proof shows $EU(a_e|e) \geq EU(a^*|e)$ because $a^*$ is available.
      *   *Mistake:* Claims info changes probabilities so utility must rise (misses the dominance logic).
  *   **2 marks:** Explicitly states expectation over $e$ preserves the inequality.
      *   *Mistake:* Stops at the conditional state without aggregating to expected value.

  **(b) Slogan vs. Theorem (7 marks)**
  *   **3 marks:** Identifies that slogan implies universality while theorem is conditional.
      *   *Mistake:* Treats the slogan as synonymous with the theorem.
  *   **4 marks:** Correctly lists Action Set Stability and Utility Stability (or Costless Info).
      *   *Mistake:* Lists 'rationality' or 'truth' without specifying structural constraints.

  **(c) Case Analysis (10 marks)**
  *   **3 marks:** Explains why agent refuses info (risk of losing A outweighs potential gain of B).
      *   *Mistake:* Claims agent is irrational or afraid of truth.
  *   **4 marks:** Identifies Action Set Stability as the failed assumption.
      *   *Mistake:* Claims 'Costless Info' failed (the review was free) or 'Bayesian Updating' failed.
  *   **3 marks:** Links failure to proof (cannot choose $a^*$ after $e$, so dominance breaks).
      *   *Mistake:* States assumption fails but doesn't explain why the math no longer holds.

  ***

  4. **A vs B**

  An **A answer** explicitly connects the vanishing voucher to the specific inequality in the proof ($a^* \notin A_{after}$), demonstrating that the failure is structural rather than psychological. It distinguishes clearly between the *instrumental* value of information (theorem) and *intrinsic* disvalue (slogan).

  A **B answer** correctly identifies that the voucher expires but vaguely attributes the failure to "information having a cost" or "changing the situation," without pinpointing the Action Set Stability assumption or showing how it breaks the dominance inequality specifically.
