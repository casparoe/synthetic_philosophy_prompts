prompt: |-
  I'm putting together the final for my 4th-year decision theory seminar (half philosophy, half econ, and they read nothing I don't hand them). The question I'm stuck on is the one on Good's theorem — the result that the expected value of free information is non-negative for a Bayesian. Every year I get the same two half-answers: 'information can't hurt, you can always ignore it', and 'but what about the patient who'd rather not know her prognosis?', with nobody able to say wich assumption of the theorem that case actually breaks. I want one question that forces both moves and can't be passed by stating the theorem and stopping: say what the theorem really claims and why the one-line dominance proof gets it, say exactly how far the slogan 'information never hurts' outruns the theorem, then take a concrete case and name the assumption that fails.

  So please write me the question itself, a model answer of about 700 words, and a marking scheme. It should be doable in 45 minutes and worth 25 marks. Two things I care about. The case in the question has to be one they can't have seen before, so invent a fresh one — ideally something where learning the fact is not a purely passive observation, or where the act set isn't fixed once you know. And the whole thing must be answerable with no citations or reading list, since they sit the exam with nothing but the paper. Don't let the model answer lean on who argued what when; it's about the argument.

  Format, in this order:

  1. The question — the text as it goes on the paper, plus one line on what I'm actually testing.
  2. Model answer — about 700 words, at the level of a strong student, with the proof written out.
  3. Marking scheme — the must-hit points, marks summing to 25, and one line per point on the mistake that loses those marks.
  4. A vs B — three or four sentences on what an A answer has that a B answer doesn't.
