answer: |-
  The analogy is heuristically useful for explaining timing but historically misleading regarding contingency and impact.

  Here is the mapping your friend is relying on:
  *   **The Environment:** The state of existing mathematical and physical problems (e.g., planetary orbits, tangents to curves, areas under curves) that had reached a critical mass of unsolved pressure.
  *   **The Trait:** The specific conceptual formalism (calculus) capable of solving those problems.
  *   **The Lineage:** The individual mathematician embedded within their specific intellectual network (Newton in Cambridge/royal circles, Leibniz in Paris/diplomatic circles).
  *   **The Selection Pressure:** The utility of the tool for prediction and control, combined with the social pressure for priority and prestige within the Republic of Letters.

  **Where the Analogy Breaks Down**
  The biological analogy fails because evolution is blind, whereas science is teleological (goal-directed), and because the "form" of the discovery matters more in math than in biology. In convergent evolution, the eye evolves because it works; the specific cellular wiring matters less than the function. In calculus, the *notation* and *conceptual framing* dictated the future trajectory of the field. Newton's "fluxions" and Leibniz's "differentials" were functionally similar but structurally distinct. Leibniz's notation ($dy/dx$) was vastly superior for manipulation and teaching, which is why Continental Europe surged ahead while Britain stagnated with Newton's inferior notation for a century. Evolution does not care about the "syntax" of the eye, only the sight; science cares deeply about the syntax of the math.

  Furthermore, the "environment" in science is not fixed like a physical landscape; scientists actively construct it. Newton and Leibniz didn't just find a ready-made truth; they defined what counted as a solution.

  **Settled vs. Contested**
  You need to know where the ground is solid and where it is swamp.
  *   **Settled:** It is an empirical fact that multiple discovery is common (documented by sociologist Robert Merton and others). Newton/Leibniz and Darwin/Wallace are textbook cases.
  *   **Contested:** The claim of *inevitability* is heavily debated. Your friend's view is known as "Scientific Realism" or "Whig History"—the idea that science progresses toward a pre-existing truth that anyone would find given enough time. This is contested by "Constructivists" and historians of contingency (like Ian Hacking or Stephen Jay Gould), who argue that if you rewound the tape, the specific concepts, notation, and even the questions asked might be radically different. There is no consensus that the calculus *had* to happen exactly then or in that form; only that the *problems* were pressing.

  **The Punchline: Does the Individual Matter?**
  Your friend's conclusion—that the individual is a fluke—does not survive the disanalogies. While the *timing* of the discovery might have been overdetermined (someone was likely to crack it within a decade), the *individual* determined the *path*. Newton's personality and dominance slowed British mathematics; Leibniz's openness accelerated Continental mathematics. In biology, the individual organism is disposable to the gene; in science, the individual's social capital, notation choices, and pedagogical style shape the discipline for generations. The "who" matters less for the *existence* of the truth, but matters immensely for the *sociology* of the truth.

  **A Better Analogy**
  A more accurate analogy is **technological innovation within an industrial ecosystem**. Consider the invention of the telephone (Bell vs. Gray) or the lightbulb (Edison vs. Swan).
  *   **Why it fits:** Like calculus, these inventions require a supply chain of prior components (glass blowing, vacuum pumps, or in math, algebraic notation and geometry) to be mature.
  *   **The nuance:** The invention is "ready" only when the infrastructure supports it, but the specific design, the patent wars, and the commercial dominance depend entirely on the inventors' strategies, funding, and legal maneuvering.
  *   **For your novel:** This allows you to treat Newton and Leibniz not as passive vessels filling with inevitable truth, but as competing engineers racing to patent a machine that the world was finally ready to build, where the winner shapes the infrastructure of the future.
