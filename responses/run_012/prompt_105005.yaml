prompt: |-
  I'm a novelist and I'm deep in a book about the Newton–Leibniz blowup over who invented the calculus (and it generalizes to Darwin/Wallace, I guess — the same double-discovery thing keeps happening). My science-historian friend has a line he's very confident about: he says these multiple discoveries are just like convergent evolution — the eye evolves over and over in different lineages because the environment practically demands it — so once the mathematics was "ready," somone was bound to get there, and which particular guy ends up with the medal is basically a fluke. Is that analogy actually carrying the weight he thinks it is? I want the mapping spelled out first (what plays the role of the environment, the trait, the lineage, the selection pressure), then where the thing comes apart — my gut says a discovery isn't under the same kind of pressure as a finch's beak but I can't put my finger on why — then whether his punchline, that the individual hardly matters, survives once the disanalogies are on the table, and finally what a better analogy would be if this one's a dud. Start with your verdict in the first sentence and skip the throat-clearing. And please be straight with me about which parts of this are actually settled among people who study it versus which are still fought over — don't serve me a contested view as if it were the consensus.
