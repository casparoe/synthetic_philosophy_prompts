answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Precision matters more than breadth.

  **Prompt:**
  During a discussion on market efficiency, a colleague argued: "Aumann's Agreement Theorem proves that if two rational agents look at the same data and reach different conclusions, at least one must be irrational. That is simply what Bayesian rationality entails."

  Write an essay critiquing this claim. Your response must address the following four points:
  (a) State precisely the necessary assumptions and the logical conclusion of Aumann's Agreement Theorem.
  (b) Explain why the theorem does not license the inference that empirical disagreement implies individual irrationality.
  (c) Analyze the status of the Common Prior Assumption (CPA): Is it a requirement of individual rationality (coherence) or a substantive assumption about the origin of beliefs?
  (d) Construct a case where two agents have common knowledge of each other's posteriors and priors, but their priors differ. Does the theorem apply here? Does this case refute the slogan that "rational agents cannot agree to disagree"?

  ***

  **Model Answer**

  The colleague's claim conflates a specific mathematical result with a general normative principle. While Aumann's theorem is robust, it does not support the strong assertion that all disagreement signals irrationality. To see why, we must disentangle the theorem's conditions from the definition of rationality itself.

  Regarding (a), Aumann's result operates within a state-space model where agents have partition information structures. The theorem assumes two agents are Bayesian updaters who share a **common prior** probability distribution over the state space. The crucial condition is that their posterior probabilities regarding some event are **common knowledge**. Under these specific conditions, the theorem concludes that their posteriors must be identical. It is a conditional impossibility result: *if* common priors and common knowledge of posteriors hold, *then* disagreement is impossible.

  This leads directly to (b). The colleague argues that disagreement implies irrationality. However, the theorem only implies that *one of the assumptions must fail* if disagreement exists. It does not dictate which assumption. Agents may be perfectly coherent Bayesian updaters (individually rational) but fail to share a prior. Therefore, disagreement does not license the claim that an agent is irrational; it only indicates that the system of agents does not satisfy the joint conditions of the theorem. Individual rationality is defined by coherence with one's own priors and evidence, not by agreement with others.

  This distinction is central to (c), the status of the Common Prior Assumption. The CPA is not a requirement of individual rationality. An agent is rational if their beliefs obey the probability axioms and update via conditionalization. They can do this starting from any prior, provided it is coherent. The CPA is a substantive assumption about the world or the agents' history—essentially claiming that all differences in belief stem from differences in information, not differences in interpretation or initial bias. Harsanyi argued for it based on the idea that differing priors would imply differing expectations about the same evidence, which seems untenable under a strict objective Bayesian view. However, most contemporary epistemologists treat it as a modeling convenience or a strong substantive claim, not a constitutive rule of rationality like non-contradiction.

  Finally, consider (d). Suppose Agent A and Agent B have common knowledge of each other's priors and posteriors, but their priors differ. Perhaps A starts with $P(H) = 0.9$ and B with $P(H) = 0.1$, and both know this. They receive the same evidence $E$ and update. Their posteriors will differ. Since the priors differ, the Common Prior Assumption is violated. Consequently, Aumann's theorem does not apply. The agents can agree to disagree without violating Bayesian rationality.

  Does this refute the slogan "rational agents cannot agree to disagree"? It refutes the colleague's version, which omits the common prior clause. The accurate slogan is "rational agents *with a common prior* cannot agree to disagree." In the case constructed above, the agents are rational, yet they disagree. Thus, the slogan is false unless qualified. The colleague's error lies in treating the common prior as a necessary condition for rationality rather than a contingent condition for agreement. Disagreement persists not because of irrationality, but because rationality permits diverse starting points. The theorem limits what rational agents can do *given* shared origins, not what they can do simpliciter.

  ***

  **Marking Scheme (25 Points)**

  | Component | Points | A Grade Move (Distinction) | B Grade Move (Competent) | Typical Error |
  | :--- | :---: | :--- | :--- | :--- |
  | **(a) Theorem Specs** | 5 | Explicitly identifies **Common Prior** and **Common Knowledge of Posteriors** as joint necessary conditions. | States agents must be Bayesian and share information, but misses "common knowledge" nuance. | Confusing "same information" with "common knowledge of posteriors." |
  | **(b) Irrationality Claim** | 5 | Argues that disagreement implies **assumption failure**, not necessarily **agent incoherence**. | Argues that agents might just have different data, missing the prior distinction. | Assuming the theorem proves disagreement is impossible *simpliciter*. |
  | **(c) CPA Status** | 5 | Distinguishes **individual coherence** from **substantive origin story**; denies CPA is constitutive of rationality. | Claims CPA is required for rationality but admits it is often false in practice. | Treating the Common Prior as a rule of probability theory rather than a model assumption. |
  | **(d) The Case** | 5 | Constructs case where **CK of priors** exists but priors differ; notes theorem is **silent/inapplicable**. | Constructs case where priors differ but fails to specify if priors/posteriors are common knowledge. | Claiming the theorem forces agreement even when priors differ. |
  | **Synthesis** | 5 | Concludes slogan is false **without qualification**; ties CPA status to the definition of rationality. | Concludes the colleague is wrong but fails to refine the slogan precisely. | Ending with a vague summary that doesn't resolve the prompt's tension. |

  **Grading Notes:**
  *   **A Range (22-25):** Contains all "A Grade Moves." Argument flows logically from (a) to (d).
  *   **B Range (18-21):** Contains "B Grade Moves." Understands the theorem but misses the philosophical nuance on CPA status.
  *   **C Range (15-17):** Recites the theorem correctly but fails to apply it to the specific case in (d) or conflates rationality with agreement.
  *   **Fail (<15):** States "Aumann proved people can't disagree" without conditions.
