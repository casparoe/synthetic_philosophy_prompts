  **Population Statement 449**

  It changes nothing to add one more name.
  The shift ends together with one steady sound.
  If every life is fine, more is the same.

  The numbers are logged but no person is claimed.
  My knee aches a little on hard packed ground.
  It changes nothing to add one more name.

  The music they pipe is a tune we have tamed.
  The red stew is served without spill or without sound.
  If every life is fine, more is the same.

  I save for a jacket, it fits in the frame.
  I buy the warm jacket when stock comes around.
  It changes nothing to add one more name.

  The towers rise up without fault or without blame.
  We sleep in our rows till the morning comes round.
  If every life is fine, more is the same.

  So I nod to the stranger who bears my own name.
  There is plenty of air in the space all around.
  It changes nothing to add one more name.
  If every life is fine, more is the same.
