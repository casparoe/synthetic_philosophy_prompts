  "I lost a horse," said the farmer.
  "Description?"
  "White."
  "Then we can't help. We found five horses, but no white horses."
  "But a white horse is a horse!"
  "If it were," the clerk sighed, tapping the form, "requesting 'horses' and requesting 'white horses' would yield identical results. Yet if I ask for a horse, a black one suffices; if I ask for a white horse, a black one fails. Since the acceptable responses differ, the objects must differ. We have horses. You lost a white horse. Therefore, you lost something we do not have."
  "So I get nothing?"
  "You get a horse if you stop specifying the colour. Ontology is strict."

  This joke turns on the 'two-requests' move, where the advocate argues that because the extension of 'horse' includes black horses while 'white horse' excludes them, the terms cannot be identical. The humour lies in applying this extensional logic to a mundane bureaucratic refusal.
