answer: |-
  You are grappling with the boundary between **Evidential Decision Theory (EDT)**, which relies on conditional probabilities, and **Functional Decision Theory (FDT)** (or superrationality), which relies on logical/subjunctive dependence. Your Case 5 (Divergent Payoffs) is the critical pivot: it demonstrates that algorithmic identity alone is insufficient; *interest alignment* is a necessary condition for the "identity" that triggers cooperation.

  Here are two candidate principles. The first is a rigorous decision-theoretic formulation designed to save your Cases 1–5. The second attempts to salvage Case 6 (the mirror-image stranger) but at a cost to precision.

  ### Candidate 1: Symmetric Functional Dependence (SFD)

  **The Principle:**
  > In a one-shot interaction, cooperate if and only if:
  > 1.  **Logical Dependence:** Your decision algorithm $A$ and the opponent's algorithm $A'$ are subjunctively dependent (i.e., if you were to output $C$, $A'$ would output $C$ with probability $p > 0.5$).
  > 2.  **Payoff Symmetry:** Your utility function $U_{self}$ and the opponent's $U_{opp}$ rank the four outcome profiles $(CC, CD, DC, DD)$ identically, specifically regarding the preference for Mutual Cooperation over Mutual Defection ($U_{self}(CC) > U_{self}(DD) \iff U_{opp}(CC) > U_{opp}(DD)$).
  > 3.  **Expected Utility:** $p \cdot U_{self}(CC) + (1-p) \cdot U_{self}(CD) > p \cdot U_{self}(DC) + (1-p) \cdot U_{self}(DD)$.

  **Clause Mapping to Your Cases:**
  *   **Case 1 (Exact Copy):** Satisfied. $A=A'$, $U_{self}=U_{opp}$, $p=1$. **Verdict: Cooperate.**
  *   **Case 2 (Same Procedure):** Satisfied, assuming "same procedure" implies logical dependence ($p \approx 1$) and shared human preferences imply Payoff Symmetry. **Verdict: Cooperate.**
  *   **Case 3 (Causal Reasoner):** Fails Clause 1. The causal reasoner's output is independent of your algorithm's output. $p = P(C)$. **Verdict: Defect.**
  *   **Case 4 (90% Copy):** Satisfied. $p=0.9$. Clause 3 calculates the expectation. **Verdict: Cooperate (confidence tracks $p$).**
  *   **Case 5 (Divergent Payoffs):** Fails Clause 2. Even if $A=A'$, the utility functions diverge on the ranking of $CC$ vs $DD$. The logical link exists, but the *incentive* to exploit that link vanishes. **Verdict: Defect.**
  *   **Case 6 (Mirror Stranger):** Fails Clause 1 (and possibly 2). Without a shared algorithm or causal history, there is no established subjunctive dependence. **Verdict: Defect.**

  **New Case Implication: The Isomorphic Alien**
  *   *Scenario:* You encounter an alien. Its source code is biologically distinct from yours (different substrate), but you prove mathematically that its decision function is logically isomorphic to yours. Payoffs are identical.
  *   *SFD Verdict:* **Cooperate.** Clause 1 requires logical dependence, not syntactic identity. If the logic is isomorphic, the outputs are subjunctively linked.

  **The Discriminator Case: The Common-Cause Clone**
  *   *Scenario:* You and a stranger are not copies and do not share code. However, a third party (Omega) has pre-committed to physically forcing your muscles to move identically, regardless of your deliberation. You know this. The correlation is 100%, but there is no logical dependence between your *decisions* (only your outputs).
  *   *SFD Verdict:* **Defect.** Clause 1 fails. Your *decision* does not determine the opponent's *decision*; Omega determines both. There is no leverage to be gained by cooperating.
  *   *Contrast:* An EDT agent would Cooperate (since $P(Opp=C | I=C) = 1$). SFD separates *correlation* (EDT) from *identity/dependence* (FDT).

  **Honest Account of Failures:**
  SFD cannot save **Case 6**. It classifies the "Mirror-Image Stranger" as a Defect case because there is no mechanism establishing subjunctive dependence. If you feel a pull to cooperate in Case 6, SFD diagnoses this as a category error: you are importing a moral intuition (universalizability) into a decision-theoretic problem where you have no causal or logical leverage.
  *   *Recommendation:* **Give up the verdict.** Case 6 is the "mysticism" you suspected. In a one-shot PD with no logical link, cooperation is not instrumentally rational; it is altruism. SFD preserves the rigor of decision theory by demanding a mechanism for the correlation.

  ---

  ### Candidate 2: Universalizable Policy Selection (UPS)

  **The Principle:**
  > Choose the policy $P$ that maximizes expected utility under the assumption that *any agent in a structurally identical situation* will adopt $P$.
  > Formally: Cooperate iff $EU(C | \forall x \in Sit_{sym}, Act(x)=C) > EU(D | \forall x \in Sit_{sym}, Act(x)=D)$.
  > "Structurally identical" is defined by the *geometry of the choice* (available moves, information state) rather than the *source of the agent*.

  **Clause Mapping to Your Cases:**
  *   **Case 1 & 2:** Satisfied. The situation is structurally identical. **Verdict: Cooperate.**
  *   **Case 3:** Fails. The causal reasoner is not in a structurally identical situation (their decision rule is fixed to Defect). **Verdict: Defect.**
  *   **Case 4:** Satisfied with probabilistic weighting. **Verdict: Cooperate.**
  *   **Case 5:** Fails. The situations are not structurally identical because the *payoff structures* differ. The opponent faces a different game. **Verdict: Defect.**
  *   **Case 6:** Satisfied. The situation is a "mirror image," which counts as structurally identical under universalizability. **Verdict: Cooperate.**

  **New Case Implication: The Asymmetric Information Twin**
  *   *Scenario:* A copy of you is made, but due to a transmission error, they receive slightly noisy information about the payoffs (e.g., they think $T=4.9$). You have exact info.
  *   *UPS Verdict:* **Defect (or low confidence).** The situations are not *strictly* structurally identical. The principle struggles with degrees of similarity unless "structural identity" is fuzzified.

  **The Discriminator Case: The Deterministic Universe**
  *   *Scenario:* You know the universe is deterministic. You know the stranger is determined by prior causes. Thus, your action and theirs are correlated by the laws of physics (Laplace's Demon).
  *   *UPS Verdict:* **Cooperate.** If the situation is symmetric, you should act as if your policy determines the policy of all symmetric agents, even if the link is merely physical determinism.
  *   *Contrast:* SFD says **Defect** (no logical dependence between *deliberations*, only physical correlation). UPS conflates physical determinism with normative universalizability.

  **Honest Account of Failures:**
  UPS cannot save **Case 3** if the causal reasoner is viewed as "in a symmetric situation but choosing differently." More critically, UPS collapses the distinction between **Decision Theory** and **Ethics**. It licenses cooperation in Case 6 not because it *pays*, but because it is *right*. It also risks the "Newcomb Problem" error in reverse: if you know the stranger is a Defector (Case 3), UPS might still urge cooperation if you define "situation" too abstractly (e.g., "two players in a PD").
  *   *Recommendation:* **Give up the principle.** UPS is a moral principle (Kantian Categorical Imperative), not a decision-theoretic one. It does not compute verdicts based on *influence* but on *consistency*. If your goal is decision theory (instrumental rationality), UPS is too permissive.

  ---

  ### Final Recommendation

  Adopt **Candidate 1 (Symmetric Functional Dependence)** and revise your verdict on **Case 6**.

