  ### Is "Formalist" the right word?
  **Yes.** In this context, **Aesthetic Formalism** is the precise term. It is the view that aesthetic value supervenes entirely on the internal formal properties (shape, color, composition) of the object. If two objects are perceptually indiscernible, a Formalist must agree they have identical aesthetic value. If you call yourself a Formalist but claim the molecule-for-molecule duplicate is worth *less*, you are contradicting the definition.

  ***

  ### The Forgery Decision Tree

  **START:** *"A perfect copy of a painting is usually worth less than the original."*
  **Do you agree?**

  **NO** → **NODE 1: The Molecule Duplicate**
  Imagine a machine creates a molecule-for-molecule duplicate. It is physically and visually identical.
  *   **Is it worth the same as the original?**
      *   **YES** → **LEAF A: Formalism**
      *   **NO** → Go to Node 2.

  **YES** → **NODE 2: The Manuscript**
  You have a perfect transcription of a manuscript. You can read the text equally well.
  *   **Would you still pay a premium just to *touch* the original paper?**
      *   **YES** → **LEAF B: Contact Value**
      *   **NO** → Go to Node 3.

  **NODE 3: The Robot**
  A robot executes a painting program written by the artist. The artist never touches the canvas.
  *   **Is the resulting painting an "Original"?**
      *   **NO** (It requires a human hand) → **LEAF C: Achievement Value**
      *   **YES** (The mind/intention is enough) → Go to Node 4.

  **NODE 4: The Vermeer Forgery**
  A 1930s forgery is technically a *better* painting than a mediocre real Vermeer.
  *   **Is the real Vermeer still more valuable?**
      *   **NO** (Visual quality wins) → **LEAF D: Quality Absolutism**
      *   **YES** (Artist identity wins) → Go to Node 5.

  **NODE 5: The Bronze Cast**
  The artist's original plaster model is destroyed; only the bronze cast remains.
  *   **Is the artwork lost?**
      *   **YES** → **LEAF E: Object Monism**
      *   **NO** → **LEAF F: Evidential Value**

  ***

  ### The Positions (Leaves)

  *   **Formalism:** Aesthetic value resides only in visual form; history is irrelevant.
      *   *Most Awkward Case:* The Manuscript (Why pay to touch if the text is identical?).
  *   **Contact Value:** Value derives from physical causal connection to the creator (relic status).
      *   *Most Awkward Case:* The Robot (Why does the hand matter if the mind designed it?).
  *   **Achievement Value:** Value records the human feat of problem-solving and labor.
      *   *Most Awkward Case:* The Vermeer Forgery (Why value the mediocre original over the skilled copy?).
  *   **Quality Absolutism:** Value is determined solely by visual excellence, regardless of origin.
      *   *Most Awkward Case:* The Molecule Duplicate (Contradicts the starting premise of the tree).
  *   **Object Monism:** The artwork is identical to the specific physical object; no object, no art.
      *   *Most Awkward Case:* The Bronze Cast (Intuitively, the art seems to survive in the cast).
  *   **Evidential Value:** The object is valuable as evidence of a specific historical event/artist's mind.
      *   *Most Awkward Case:* The Robot (If the history is intact, why distinguish hand from code?).

  ***

  ### ⚠️ Flagged Ambiguity
  **Achievement Value vs. Evidential Value:** This tree forces a choice at Node 3 (Robot), but these positions are difficult to separate in practice. A "human hand" is valued both because it represents *labor* (Achievement) and because it provides a *causal link* to the artist's mind (Evidential). A participant rejecting the Robot painting may hold either view, and the tree cannot distinguish which one drives their intuition.
