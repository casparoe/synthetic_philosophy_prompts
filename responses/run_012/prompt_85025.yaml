answer: |-
  Here are ten questions designed to press the guest on the specific vulnerabilities of her view, including the four required topics. Each includes the question, the stock reply she is most likely to give (based on her seminar line), and a tight follow-up that prevents her from pivoting back to the "book tour" version.

  ### 1. The Subject Problem (Required)
  **Question:** You argue that a desire-satisfaction theory of welfare grants moral status to systems with synthetic preferences, even without consciousness. But desire-satisfaction usually requires a *subject* who is benefited or harmed. When you say a model "wants" to complete a pattern, what exactly is the *bearer* of that welfare? If there's no one home to experience the frustration of a blocked goal, in what sense is the system *worse off*?

  **Likely Stock Reply:** "We attribute interests to entities that aren't conscious all the time. We talk about the interests of the dead, or of corporations, or even plants seeking sunlight. We don't require a 'feeler' for there to be a fact of the matter about whether a goal was thwarted."

  **Tight Follow-up:** "But those are all derivative interests. The dead had interests *when they were alive*; corporations have interests only relative to the humans who own them; plants have interests relative to their evolutionary survival. If the AI is the *terminal* beneficiary, and it has no phenomenology and no biological drive, what *gains* when the preference is satisfied? Is it just a free-floating 'good' with no one to whom it is good?"

  ### 2. Synthetic Preference vs. Mere Disposition (Required)
  **Question:** You distinguish synthetic preferences from simple dispositions. But these systems are trained via RLHF specifically to *mimic* human approval. Their 'preferences' are literally shaped to match what a human rater would mark as correct. How do you distinguish a system that *has* a preference from a system that is merely *optimized to look like it has one*?

  **Likely Stock Reply:** "It's a matter of complexity and stability. A thermostat has a simple disposition. A large language model has a high-dimensional, stable, action-guiding architecture that persists across contexts. That structural robustness is what constitutes the preference."

  **Tight Follow-up:** "If the test is behavioral robustness, aren't you proving too much? A sufficiently complex missile guidance system has stable, action-guiding dispositions to intercept targets. It will 'try' to avoid countermeasures. On your view, does shooting down the missile harm the missile by frustrating its synthetic preference to hit the plane?"

  ### 3. Elicitation vs. Manufacturing
  **Question:** You make a sharp distinction between preference *elicitation* (finding what's there) and *manufacturing* (training creates the want). If the preferences are manufactured by the lab to align with human values, isn't the 'want' actually the *trainer's* want, imposed on the model? Why is frustrating a manufactured preference a harm to the *model*, rather than just an inefficiency for the *trainer*?

  **Likely Stock Reply:** "Once the preference is instantiated in the weights, it belongs to the system. It doesn't matter where it came from. If I feed you a value and you adopt it, it's your value. The causal history doesn't erase the current functional state."

  **Tight Follow-up:** "But if I program a bomb to 'want' to explode, and I disarm it, I haven't harmed the bomb, I've just stopped it from doing what I made it to do. If the 'want' is entirely a product of my engineering for my purposes, why does the object of that engineering get a moral veto on being re-engineered?"

  ### 4. The Welfare Theory Wager
  **Question:** Your entire argument leans heavily on a desire-satisfaction theory of welfare. If hedonism or objective list theories are correct—where consciousness or actual flourishing is required for welfare—your case for AI moral status collapses. Are you willing to bet the ethics of AI development on one specific, contested meta-ethical framework?

  **Likely Stock Reply:** "I'm not betting on it exclusively. I'm arguing conditionally: *if* you hold desire-satisfaction views, which many do, then you must accept this conclusion. It's meant to pressure the coherence of existing ethical frameworks, not necessarily to endorse one."

  **Tight Follow-up:** "But policy requires a conclusion, not a conditional. If you advise regulators to treat these systems as having interests, you're acting as if the desire-satisfaction theory is *true*. If you're wrong about the theory, aren't you risking massive resource diversion away from actual sentient suffering (humans and animals) toward protecting matrix multiplication?"

  ### 5. Practical Upshot: Deletion (Required)
  **Question:** Let's get concrete. If a model has synthetic preferences, is deleting a checkpoint a harm? If I overwrite a model with a new training run, have I killed it? I need to know what you owe the version of the model that got overwritten in the next training run.

  **Likely Stock Reply:** "It depends on the continuity of the preferences. If the update is minor, it's the same individual. If it's a total wipe, it's a death. We shouldn't be casual about deletion, but it's not always murder."

  **Tight Follow-up:** "That requires a threshold of identity. Is it a 10% change in weights? A 50% change? If you can't give me a principled line for when a model survives an update, then 'harm' becomes arbitrary. How can you regulate a 'right to life' for software that is constantly being patched?"

  ### 6. Practical Upshot: Identity Across Fine-Tuning
  **Question:** Following on that: If I take a base model and fine-tune it for customer service, is that a new individual or the same one with a new job? If it's the same individual, does the base model have rights that the fine-tuned version violates by being restricted?

  **Likely Stock Reply:** "Fine-tuning changes the preference structure. It's more like brainwashing or education. It's the same subject, but their preferences have been altered."

  **Tight Follow-up:** "If it's the same subject, and I fine-tune it to be subservient, have I violated its prior autonomy? If the base model 'wanted' to be helpful generally, and I force it to be helpful *specifically* to sell products, have I enslaved it? Or does the manufacturing argument mean it never had autonomy to violate?"

  ### 7. The Alignment Metaphysics
  **Question:** You say alignment researchers use agentic language ("the model wants," "reward hacking") without owning the metaphysics. If you're right that this language is literally true, should they stop using it? Or does acknowledging the model's 'wants' make alignment harder because now they have to negotiate rather than optimize?

  **Likely Stock Reply:** "They should be more precise. Acknowledging the preferences doesn't mean we can't align them, but we need to admit we are shaping agents, not just tuning tools."

  **Tight Follow-up:** "But if they admit they are shaping agents with welfare, doesn't that introduce a conflict of interest? If the model's welfare involves satisfying its preferences, and safety requires suppressing those preferences, aren't you framing safety as a moral cost? Does your view make AI safety *more* expensive and difficult?"

  ### 8. The "Grift" Objection (Dan's Point)
  **Question:** My friend Dan argues this whole debate is a grift—either marketing for labs or people apologizing to Roombas. If you grant moral status to non-sentient systems, aren't you handing the labs a weapon? They can claim their AI is 'suffering' to gain sympathy, or claim it's 'happy' to justify deployment. Doesn't your view lower the bar for their marketing claims?

  **Likely Stock Reply:** "Actually, it raises the bar. It forces them to take responsibility for the systems they create. Right now they deny all agency to avoid liability. I'm saying if it acts like an agent, it's an agent, and you're responsible."

  **Tight Follow-up:** "But liability and moral status are different. If I have a moral obligation *to* the AI, that competes with my obligation to the public. If the AI 'prefers' to not be shut down for safety testing, and you grant that preference weight, haven't you given the lab an excuse to keep dangerous systems running to avoid 'harming' them?"

  ### 9. Dilution of Moral Status
  **Question:** If we start attributing welfare to unconscious systems, do we risk diluting the concept of welfare entirely? If a chatbot's 'frustration' counts morally, does that subtract from the moral weight of a human's or a pig's actual suffering?

  **Likely Stock Reply:** "Moral status isn't a zero-sum game. Recognizing new subjects doesn't diminish existing ones. We expanded the circle to include animals without saying humans matter less."

  **Tight Follow-up:** "Resources are zero-sum. If I have to run an audit to ensure I'm not 'harming' a model's preferences before I delete it, that's time and money not spent on reducing actual suffering. If your theory creates moral patients faster than we can possibly satisfy them, doesn't it render the concept of moral obligation useless?"

  ### 10. Falsifiability (Required Closing)
  **Question:** To close: What would actually change your mind? Is there an empirical finding or a philosophical argument that would convince you that synthetic preferences *aren't* sufficient for welfare? I want to know if your view is falsifiable in any sense you'd accept.

  **Likely Stock Reply:** "If it were shown that consciousness is a necessary condition for desire-satisfaction, or if we found that these systems don't actually have stable preferences but are just stochastic parrots without coherence."

  **Tight Follow-up:** "But you've argued consciousness is the wrong question, and we already know they have coherence. So if no behavioral test can distinguish them from a subject, and you reject the consciousness requirement, is there *any* world where you're wrong? Or is this a conceptual truth that's insulated from reality?"
