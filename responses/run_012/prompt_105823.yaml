  ### The Four Cases

  **Setup:** Goods are Money ($m$), Apple ($a$), Orange ($b$). Initial position $P_0 = (a=1, b=0, m=10)$. Counterparty offers pairwise swaps of goods for money.

  **(1) Preferences Transitive, Extractable**
  The agent's preferences are transitive at every moment but shift diachronically. At $t_1$, she values $b$ at \$2 and $a$ at \$1; she accepts swapping $a$ for $b$ minus \$0.50. At $t_2$, her preferences reverse: $a$ is \$2, $b$ is \$1; she accepts swapping $b$ for $a$ minus \$0.50. After two trades, she holds $(a=1, b=0, m=9)$, strictly worse than $P_0$.

  **(2) Preferences Transitive, Not Extractable**
  The agent has static, transitive preferences representable by $U(a,b,m) = 2a + 2b + m$. She accepts an offer only if it increases $U$. Since every accepted trade strictly increases $U$, and $U$ is bounded below by money holdings, no sequence of accepted trades can return her to a position with less money and the same goods. She trades readily for any offer where the good's value exceeds the cost.

  **(3) Preferences Intransitive, Extractable**
  The agent has static, intransitive preferences over bundles: $(a,0) \succ (b,0) \succ (c,0) \succ (a,0)$ (using a third consumable $c$ for the witness). Values are cyclic: $a=10, b=11, c=12$ relative to each other in a loop. Offered $a \to b$ for \$0.50, she accepts (gain 0.5). Offered $b \to c$ for \$0.50, she accepts. Offered $c \to a$ for \$0.50, she accepts. She ends with $a$ and \$1.50 less.

  **(4) Preferences Intransitive, Not Extractable**
  The agent's *underlying* preferences over bundles are intransitive ($a \succ b \succ c \succ a$), satisfying the witness requirement. However, her *local* decision rule incorporates a status-quo endowment effect: she values her current holding at \$12 and alternatives at their base value ($10, 11, 12$). She accepts offers readily if the net local gain is $>\$2$. The cyclic gaps are only \$1, so she refuses the pump sequence, though she accepts larger beneficial trades.

  ***

  ### (a) General Criterion
  The condition sorting the cases is **Diachronic Acyclicity of the Local Choice Relation**. A case is extractable if and only if the agent's local preference ordering (the relation determining acceptance at each step) admits a cycle that reduces money.
  *   **Transitivity is not sufficient:** Box 1 is transitive at each moment but extractable because the *sequence* of momentary orderings forms a diachronic cycle.
  *   **Transitivity is not necessary:** Box 4 is intransitive in underlying valuation but immune because the *local* choice relation (incorporating endowment) is acyclic.
  *   **Proof (Easy Half):** If the local choice relation is acyclic and the state space (goods + money) is finite/discrete, no sequence of strictly preferred moves can return to a starting state or a dominated state. Since every accepted offer must be strictly locally preferred, acyclicity guarantees immunity.

  ### (b) Immunity Proofs
  *   **Box 2:** The local preference relation is derived from a static utility function $U$. Every accepted trade satisfies $U_{new} > U_{old}$. By transitivity of $>$, $U_{final} > U_{initial}$. Since goods are identical at start and end, $m_{final} > m_{initial}$. Extraction (loss of money) is impossible.
  *   **Box 4:** The local preference relation includes an endowment bonus $E$. A trade occurs only if $V_{new} + m_{new} > V_{old} + m_{old} + E$. In the pump cycle, the intrinsic value gains sum to zero, but the endowment cost $E$ is paid at every step. Thus, the sum of local gains is negative. No sequence of locally accepted trades can close the loop; the feature carrying the proof is **Reference Dependence**.

  ### (c) Extractable Walks
  *   **Box 1:** Start $(a, 10)$. $t_1$: Offer $(b, 9.5)$. Local pref: $b \succ a$. Accept. Hold $(b, 9.5)$. $t_2$: Offer $(a, 9)$. Local pref: $a \succ b$. Accept. End $(a, 9)$. Money lost, goods same.
  *   **Box 3:** Start $(a, 10)$. Offer $(b, 9.5)$. Pref: $b \succ a$. Accept. Hold $(b, 9.5)$. Offer $(c, 9)$. Pref: $c \succ b$. Accept. Hold $(c, 9)$. Offer $(a, 8.5)$. Pref: $a \succ c$. Accept. End $(a, 8.5)$. Money lost, goods same.

  ### (d) Look-Ahead Rule
  Under a look-ahead rule (accept only if no continuation leads to a worse outcome), **Boxes 1 and 3 change**; Boxes 2 and 4 do not.
  *   In Box 1, the agent at $t_1$ foresees the $t_2$ reversal and the net loss. She refuses the first trade.
  *   In Box 3, the agent foresees the cycle and the net loss. She refuses the first trade.
  *   **Pattern:** This shows the money pump rests heavily on the **myopia of the local rule**. Intransitivity (Box 3) and Diachronic Inconsistency (Box 1) only lead to loss when the agent fails to anticipate her own future choices.

  ### (e) Incoherent Credences
  No, she cannot be led to a *sure loss* under the local rule if her preferences over final wealth positions are transitive.
  *   **Failure Step:** The usual sure-loss construction (Dutch Book) requires the agent to accept a *combination* of bets that guarantees loss. Under the local rule, she evaluates each bet individually. If her preferences over wealth are transitive and monotonic, she will refuse any bet that reduces expected utility *given her current wealth*.
  *   **Relation:** A Dutch Book exploits incoherent credences directly via betting odds. A Money Pump exploits preference inconsistencies via trade sequences. Incoherent credences do not entail a money pump unless they induce intransitive preferences over the resulting wealth positions.

  ### (f) Implications for the Money-Pump Argument
  The four cases show that the money-pump argument, at its best, establishes **Diachronic Consistency** (or acyclicity of local choice), not Synchronic Transitivity.
  *   **Establishes:** Rational agents must not allow their local choices to form a dominated cycle over time.
  *   **Concession:** The defender must concede that static intransitivity (Box 4) is not irrational if it is shielded by reference dependence, and that static transitivity (Box 1) is not sufficient if preferences shift over time. The normative force targets the *stability* of choice, not the logical structure of the preference relation alone.

  ***

  ### Flags
  *   **Case doing the most work:** **Box 4**. It severs the link between intransitivity and exploitability, forcing the argument to shift from logical consistency to diachronic stability.
  *   **Weakest case:** **Box 1**. It relies on preference change, which critics may argue constitutes a change of agent identity, thereby dodging the charge of individual irrationality.
  *   **Strongest objection to Box 4:** The **"Richer State Space" Defense**. A critic can argue that if the endowment effect is stable, the agent's preferences are actually transitive over the richer set of states $(Bundle, Endowment)$, meaning Box 4 is secretly a Box 2 case, and true intransitivity remains pumpable.
