answer: |-
  ### Part I: Translation of Commitments

  Here are the four central commitments of the archive-and-power tradition, translated into the vocabulary of dataset construction and audit.

  **1. Archives are instruments of rule, not neutral storage.**
  *   **Data Vocabulary:** **Operational Lineage and Provenance.**
      A dataset is not a passive snapshot of a domain; it is a byproduct of an operational system designed for a specific function (e.g., billing, policing, moderation). The "ground truth" labels are not independent verifications of reality but outputs of a workflow optimized for administrative efficiency or risk mitigation. The dataset inherits the incentives, errors, and objectives of the system of record that generated it.

  **2. Power operates through categories that decide what is recordable.**
  *   **Data Vocabulary:** **Annotation Schemas and Inclusion Criteria.**
      The ontology of the dataset is defined by its schema. If a feature column or a label class does not exist in the annotation guidelines, the phenomenon cannot be captured, regardless of its prevalence in the world. Power is exerted at the stage of taxonomy design: the decision to track "arrests" rather than "conflicts," or "clicks" rather than "intent," determines the feature space available for downstream modeling.

  **3. Silence is structural, living in the finding aid rather than the boxes.**
  *   **Data Vocabulary:** **Sampling Frames and Systematic Missingness.**
      Gaps in the data are not random noise (Missing Completely At Random); they are Missing Not At Random (MNAR) and often structural. The "silence" is encoded in the sampling frame (who was eligible to be counted) and the documentation artifacts (what the data dictionary claims to represent). The absence is a property of the collection logic, not an accident of preservation.

  **4. Evidence is a product of the administrative machinery it claims to document.**
  *   **Data Vocabulary:** **Endogenous Data Generation Processes.**
      The data generation process (DGP) is endogenous to the system being studied. The act of measurement alters the behavior of the subject (Goodhart's Law), and the historical record is a feedback loop. You cannot treat the dataset as an independent variable to explain the system, because the system created the dataset to sustain itself.

  ***

  ### Part II: The Residue Report

  When you run the archival commitments through the data-curation translator, some signals pass through clearly, but significant noise is introduced. The data vocabulary is engineered to *fix* data, whereas the archival vocabulary is often designed to *interrogate* the impossibility of fixing it.

  **What Comes Through Intact**
  The translation of **Commitment 2 (Categories)** is nearly lossless. Data practitioners understand that annotation schemas are political. If you tell a machine learning engineer that their taxonomy excludes a specific class of edge cases, they understand this as a coverage error that will degrade model performance on that subgroup. The concept that "schema dictates reality" is native to data work.

  **What Comes Through Distorted**
  The translation of **Commitment 3 (Silence)** is the primary point of friction. In data vocab, "silence" becomes **missingness**.
  *   *The Distortion:* Missingness implies a value *should* exist but doesn't. It presupposes a "complete" dataset is theoretically possible if we could just impute the nulls or adjust the weights.
  *   *The Archival Reality:* Archival silence often implies the event was never *conceptualized* as data. It is not a null value; it is a non-event in the ontology of the state.
  *   *Your Hunch:* You suspected **censoring** or **truncation** might be better fits than generic missingness. You are correct.
      *   *Censoring* (we know the record exists but don't know the value) is closer, but still assumes the record was initiated.
      *   *Truncation* (we don't know the record exists if it falls outside a range) is closer still.
      *   *However:* Even truncation assumes a underlying distribution that is being cut off. Archival silence often denies the distribution exists at all. The data vocabulary struggles to model "ontological absence."

  **What Has No Counterpart**
  The translation of **Commitment 4 (Evidence as Product)** fails completely. Data audit vocab assumes the goal is to recover the "true" signal from the "noisy" administrative process. It treats the administrative machinery as a source of bias to be debiased. The archival tradition argues the administrative machinery *constitutes* the subject. There is no "true" crime rate outside the arrest record; there is only the arrest rate, which becomes the crime rate by virtue of being recorded. Data vocab has no term for "constitutive measurement."

  ***

  ### Part III: Three Sharp Mismatches

  These are the specific points where the data vocabulary smuggles in assumptions that break the archival argument.

  **1. The Ghost Row (Ontological Mismatch)**
  *   **Data Assumption:** Every row in a dataset corresponds to a pre-existing entity in the world (a person, a transaction, a pixel). If a person is missing from the dataset, they are a "false negative."
  *   **Archival Claim:** The archive often *creates* the entity. Before the 19th-century policing records, there was no "the criminal" as a stable administrative category; there were only people who did things. The record didn't miss the person; the record *made* the person legible as a specific type of subject.
  *   **The Mismatch:** Data audit looks for **coverage gaps** (rows that should be there). Archival theory looks for **ontological production** (rows that created the category). You cannot audit for a row that the system was designed to invent rather than discover.

  **2. The Specifiable Mechanism (Epistemological Mismatch)**
  *   **Data Assumption:** To handle MNAR (Missing Not At Random), you must specify the mechanism of missingness. You need a model for *why* the data is missing to correct for it (e.g., inverse probability weighting).
  *   **Archival Claim:** The mechanism of silence is often opaque by design, lost to time, or so diffuse (bureaucratic inertia, cultural taboo) that it cannot be parameterized. The "why" is the object of study, not a nuisance parameter to be controlled.
  *   **The Mismatch:** Data vocab demands a **recoverable mechanism**. Archival theory accepts **irrecoverable opacity**. When you ask "what is the missingness mechanism?" the historian answers "that is the silence." The data vocabulary treats the unknown mechanism as a technical debt; the archival vocabulary treats it as the primary evidence of power.

  **3. The Ground Truth (Teleological Mismatch)**
  *   **Data Assumption:** The purpose of audit is to align the dataset with an external **Ground Truth**. We validate labels against human annotators or gold-standard tests to minimize divergence.
  *   **Archival Claim:** The archive *becomes* the ground truth for future administration. The police record *is* the legal reality of the subject, regardless of what actually happened. The divergence between the record and the event is irrelevant to how the state treats the subject.
  *   **The Mismatch:** Data vocab seeks **fidelity to reality**. Archival theory tracks **fidelity to procedure**. In your county archive story, the "truth" isn't what happened in the 19th century; the truth is what the clerk wrote down, because that text is what governed the community. Data audit tries to correct the record; archival theory analyzes the consequences of the record *as is*.

  ***

  ### Part IV: Judgment

  Your historian was half-right, but the distinction matters for your reporting.

  She is right that data practitioners are rediscovering the *politics of classification*. The data vocabulary handles the "schema as power" argument (Commitment 2) perfectly well. If you write that "annotation guidelines function like archival finding aids," you are on solid ground.

  However, she is wrong to imply the fields have solved the same problem. The data-curation vocabulary is genuinely missing the **ontological** capacity of the archival tradition. Data science assumes a world that exists prior to measurement, which measurement distorts. Archival theory argues that for the subjects of power (the policed, the taxed, the marginalized), the measurement *precedes* the social reality.

  **The Verdict:**
  The data vocabulary is insufficient for the claim that "silence is structural." It treats silence as **information loss** (a technical problem), whereas the archive treats silence as **governance** (a political feature).

  If you must use data terms to describe archival silence, do not use "missingness." Use **"exclusion by schema design"** for the categories that never existed, and **"procedural reality"** for the fact that the record supersedes the event. But be prepared to argue that standard data audit tools break down here. They are built to recover the signal. In the archive, the silence *is* the signal.

  **For your story:** The historian's impatience relies on the assumption that "bias" is a bug. In the county archive, and in the training corpus, the exclusion of certain lives is often a feature of the system's successful operation. The data vocabulary calls this "dataset shift" or "distributional drift." The archive calls it "rule." The latter is the sharper blade for your reporting.
