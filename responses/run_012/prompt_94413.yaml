  9.  *(Self-Correction during drafting)*: Make sure I don't just say "Data is bad." The point is about the *vocabulary's* ability to describe the phenomenon. The data vocab assumes a recoverable reality; the archival vocab questions the existence of that reality independent of the record. This is the key friction point.

