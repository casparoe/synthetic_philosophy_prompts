answer: |-
  The metaphysics of material constitution concerns the relationship between a composite object and the matter that comprises it. The central tension arises when we consider whether an object, such as a statue, is identical to the lump of clay from which it is made. This problem is sharpened by considering cases where the careers of the object and the matter diverge, and cases where they coincide perfectly.

  ### The Three Questions

  **(a) The Counting Question**
  In Case One, where the statue is squashed but the clay survives, the intuitive answer is that there are two objects present during the year of exhibition. There is the statue, which comes into existence when the clay is shaped, and the lump of clay, which pre-exists the shaping and survives the squashing. What turns on this answer is our ontological commitment. If we count two, we admit that distinct objects can occupy the same space at the same time. If we count one, we must explain away the intuition that the clay survives the destruction of the statue.

  In Case Two, where the sculpture is lump-shaped and shares the exact beginning and end of the lump, the counting question is more difficult. Intuition suggests there is only one object. However, if we maintain that statues and lumps are distinct kinds of things, we might be forced to say there are two objects that are perfectly co-located and share every historical property. The stakes here involve parsimony: positing two objects where there is no observable difference seems metaphysically wasteful, yet positing one object requires us to explain why we distinguish 'sculpture' from 'lump' in our language at all.

  **(b) The Coincidence Question**
  If one holds that there are two objects sharing all their matter at every moment, one faces the grounding problem. Distinctness usually requires a difference. Typically, objects are distinct because they differ in their parts, their location, or their properties. But if the statue and the lump share all their spatial parts and all their qualitative properties at every moment of their existence, what grounds their numerical distinctness? It cannot simply be a brute fact that they are two, for metaphysics generally demands that numerical difference be grounded in qualitative difference. Without such a ground, the claim that there are two objects appears to be an unexplained multiplication of entities. In Case Two, this problem is acute because there is not even a difference in persistence conditions to appeal to; their careers are identical.

  **(c) The Modal Question**
  This question concerns the logic of identity. There is a widely accepted principle that if object $a$ is identical to object $b$, then it is necessarily true that $a$ is $b$. In Case One, however, the lump could have survived being squashed, whereas the statue could not. This suggests they have different modal properties (properties concerning what is possible for them). If they have different properties, by the principle of the indiscernibility of identicals, they cannot be the same object. To suggest they are the same object, but only contingently, conflicts with the necessity of identity.

  A reply available to someone who wishes to hold that they are the same object is to deny that modal properties are intrinsic to the object itself. One might argue that statements about what 'could have happened' are not about the object directly, but about the object under a description. Thus, 'the lump' and 'the statue' refer to the same thing, but the predicates we apply to them differ in meaning. Alternatively, one might reject the necessity of identity altogether, allowing that $a$ can be $b$ in the actual world but not in others, though this requires significant revision of standard logic.

  ### The Main Options

  There are five primary theoretical responses to these puzzles. Each carries a specific cost regarding Case One and Case Two.

  **1. Nihilism**
  This view denies that composite objects exist at all. There are only simple particles arranged in various ways.
  *   **Cost in Case One:** There is no statue and no lump, only particles arranged statue-wise and then lump-wise. This radically contradicts common sense.
  *   **Cost in Case Two:** Similarly, there is no sculpture and no lump. While this avoids the problem of coincidence (since there are no coincident composites), it does so by eliminating the subjects of the debate entirely.

  **2. Mereological Essentialism**
  This view holds that an object is identical to the sum of its parts. If the parts change or are rearranged, the original object ceases to exist.
  *   **Cost in Case One:** When the potter squashes the statue, the object ceases to exist. The 'lump' that survives is a new object. This implies that ordinary objects cannot survive reshaping, which is highly counter-intuitive.
  *   **Cost in Case Two:** Since the parts are the same, there is only one object. This handles the symmetry well, but only at the price of making the object's existence incredibly fragile in Case One.

  **3. Four-Dimensionalism**
  This view treats objects as space-time worms composed of temporal parts. An object persists by having different parts at different times.
  *   **Cost in Case One:** The statue is a shorter space-time worm that is a proper part of the longer clay worm. They are distinct because they have different temporal extents. This handles the asymmetry neatly.
  *   **Cost in Case Two:** Since the sculpture and the lump begin and end at the same time and share all matter, they are the same space-time worm. There is only one object. The cost is the denial that objects are wholly present at each moment; instead, we are only ever present in a temporal slice.

  **4. The Constitution View**
  This view holds that the statue and the lump are distinct objects that share the same matter. Constitution is a relation sui generis, not identity.
  *   **Cost in Case One:** It validates the intuition that the lump survives while the statue perishes. They are two objects with different persistence conditions.
  *   **Cost in Case Two:** This view struggles significantly. If the careers are identical, there is no difference in persistence conditions to ground the distinctness. The view is forced to posit two objects with no qualitative or historical differences, exacerbating the grounding problem. It implies an unexplained proliferation of entities.

  **5. Sortal Relativism**
  This view holds that identity is relative to a kind or sortal. One can say $a$ is the same lump as $b$, but not the same statue as $b$.
  *   **Cost in Case One:** It allows us to say the matter is the same lump, but not the same statue.
  *   **Cost in Case Two:** It allows us to say there is one object relative to the sortal 'lump' and one relative to 'sculpture', and since the extensions match, there is no conflict. However, the cost is logical: it violates the classical transitivity of identity. If $a$ is the same $F$ as $b$, and $b$ is the same $G$ as $c$, it does not follow that $a$ is the same $H$ as $c$. This requires abandoning standard logic.

  ### Verdict

  The option that handles Case Two best is **Four-Dimensionalism**.

  In Case Two, the overwhelming intuition is that there is only one object. The sculpture and the lump are not merely coincident; they are indistinguishable in every respect, including their birth, death, and material composition. The Constitution View fails here because it insists on distinctness without a ground, forcing us to accept two objects where there is no metaphysical difference to support the number two. Nihilism avoids the problem but at the unacceptable cost of denying the existence of the object altogether. Sortal Relativism preserves the intuition of oneness but damages the logical framework required to make sense of identity claims.

  Four-Dimensionalism succeeds because it unifies the treatment of both cases without contradiction. In Case One, it explains the distinctness of the statue and the lump by pointing to a genuine difference in their temporal parts: the clay worm extends beyond the statue worm. In Case Two, it respects the symmetry by identifying the sculpture and the lump as a single space-time worm. Since their temporal extents are identical, there is no basis for counting two worms. Thus, Four-Dimensionalism accommodates the intuition of distinctness when careers diverge, and the intuition of identity when careers coincide, without positing ungrounded numerical differences or revising the logic of identity. While the cost of accepting temporal parts is significant, it is a lower price than accepting ungrounded coincidence or the non-existence of ordinary objects.
