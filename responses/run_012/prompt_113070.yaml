answer: |-
  1. **What this question is testing**
  This question targets the tension between Nyāya's commitment to the irreducibility of testimony (*śabda*) and comparison (*upamāna*) and their doctrine of extrinsic validity (*parataḥ prāmāṇya*). It forces students to reconstruct the reductionist objection—that verification collapses these sources into perception or inference—and articulate Nyāya's distinction between the genesis of knowledge and its certification. Finally, it requires them to identify the regress stopper (successful activity) and evaluate whether it genuinely safeguards the independence of these *pramāṇas* or merely masks a dependency.

  2. **The question**
  Nyāya defends *śabda* (testimony) and *upamāna* (comparison) as independent *pramāṇas*, yet maintains that validity is extrinsic (*parataḥ prāmāṇya*). Critically evaluate the objection that extrinsic validity reduces these *pramāṇas* to perception and inference. If verification requires perceptual check or inferential consistency, does the initial cognition remain irreducible? Explain how Nyāya halts the regress of certification and whether this stopper successfully preserves the independence of testimony and comparison, or merely relabels the dependency. [20 marks] [Suggested time: 90 minutes]

  3. **Model answer**
  The core tension here lies in distinguishing how knowledge is generated versus how it is certified. The reductionist objection, similar to the one Ana raised, argues that if validity is extrinsic (*parataḥ*), then a cognition from testimony or comparison isn't truly knowledge until verified. Since verification usually involves perception (going to see if the thing is there) or inference (checking for consistency), the work is actually being done by perception and inference. Therefore, *śabda* and *upamāna* are just complex forms of these basic *pramāṇas*, not independent sources.

  Nyāya responds by separating the causal origin of the cognition from the knowledge of its validity. When a trustworthy speaker utters a sentence, the cognition of the meaning arises immediately. It is veridical (*pramā*) because the causes are correct (the speaker knows the truth, wants to communicate it, etc.). However, the *certainty* that it is valid comes later, extrinsically. The reductionist claims this makes the initial cognition useless until checked. Nyāya counters that the *content* of the knowledge is unique. In *śabda*, I can know about supersensible realities (like *dharma* or distant facts) that perception and inference cannot reach. Even if I verify a mundane testimony perceptually, the verification confirms the validity, but it does not change the fact that the *source* of the information was the word, not the perception. Perception confirms; it does not generate the original content.

  The same applies to *upamāna*. In the *gavaya* case, I am told a wild cow looks like a cow. Later, I see the animal in the forest and recognize it. The reductionist says this is just memory plus perception. Nyāya argues the cognitive event linking the name "gavaya" to the form seen is a new relation not present in memory alone. Memory holds "cow-like," perception holds "this animal," but *upamāna* provides the specific correlation of name-to-form that wasn't previously known. This cognitive mapping is distinct, even if validation involves looking at the animal.

  However, this leads to the regress problem. If every valid cognition needs another cognition to certify it, we face an infinite chain. If I need perception to certify testimony, what certifies the perception? If perception needs certification, we never stop. Nyāya halts this regress with successful activity (*pravṛtti-sāmarthya*). We do not need an infinite chain of certifications because the ultimate test of validity is whether acting on the cognition leads to the expected result. If I act on the testimony and succeed, the validity is confirmed practically, not by another theoretical cognition.

  Does this stopper save the independence of *śabda* and *upamāna*? Partially. For mundane testimony, successful action works well. But for supersensible testimony (Vedic claims), successful action is harder to verify directly. Nyāya relies on the reliability of the speaker (God or sages), which edges back toward inference (inferring reliability from lack of defect). Here, the defense weakens. If the ultimate stopper is practical success, and practical success for supersensible claims is inferred, then *śabda* risks collapsing into inference after all.

  Furthermore, if *parataḥ prāmāṇya* means we must always wait for external confirmation, it undermines the immediacy of knowledge. Nyāya tries to have it both ways: the knowledge is immediate, but the validity is delayed. The reductionist argues that without immediate validity, it isn't knowledge yet. Nyāya's distinction holds only if we accept that "knowledge" can exist without the knower knowing it is knowledge. This is a subtle metaphysical claim. While the regress stopper prevents infinite chains, it shifts the burden to practical efficacy. If efficacy is the true validator, then perception (of the success) is still doing the heavy lifting. Thus, while Nyāya successfully distinguishes the *genesis* of cognition, the *validation* structure leaves *śabda* and *upamāna* vulnerable to the charge that they are operationally dependent on perception and inference. The defense is coherent but relies on a fragile distinction between having truth and knowing you have it.

  4. **Marking scheme**
  **Total: 20 Marks**

  *   **Articulation of Reductionist Challenge (4 marks)**
      *   Must explain that if verification relies on perception/inference, the source (*śabda/upamāna*) is operationally redundant.
      *   *Typical Error:* Stating the objection simply as "Nyāya is contradictory" without explaining the collapse into perception/inference.
  *   **Genesis vs. Validation Distinction (4 marks)**
      *   Must distinguish between the causal origin of the cognition (immediate) and the certification of validity (extrinsic/delayed).
      *   *Typical Error:* Claiming Nyāya says knowledge doesn't arise until verification occurs (confusing *pramā* with *prāmāṇya-niscaya*).
  *   **Irreducibility of Content (4 marks)**
      *   Must argue that unique content (supersensible for *śabda*, name-form correlation for *upamāna*) cannot be generated by perception/inference alone.
      *   *Typical Error:* Ignoring *upamāna* or failing to mention supersensible objects for *śabda*.
  *   **Regress Stopper Identification (4 marks)**
      *   Must identify successful activity (*pravṛtti-sāmarthya*) or absence of defeaters as the chain-terminator.
      *   *Typical Error:* Suggesting the regress stops because "some cognitions are self-valid" (this is Mīmāṃsā, not Nyāya).
  *   **Critical Evaluation (4 marks)**
      *   Must assess whether the stopper truly preserves independence or leaves dependency on perception/inference intact (e.g., verifying success requires perception).
      *   *Typical Error:* Concluding definitively that Nyāya is "right" or "wrong" without analyzing the tension in the stopper mechanism.

  **Specific Deductions:**
  *   Listing the four *pramāṇas* without analysis: -2 marks.
  *   Confusing *svataḥ* and *parataḥ* definitions: -3 marks.
  *   Failing to address the regress problem entirely: -5 marks (cap).
