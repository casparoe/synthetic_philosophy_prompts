answer: |-
  You have not just reinvented a wheel; you have identified a specific structural failure mode in how people (including rationalists) do ontology. You are describing the friction between **Functionalism** (defining by role) and **Conceptual Conservatism** (wanting the word to keep pointing at the same stuff).

  Here is the breakdown you asked for.

  ### 1. Does this have an established name?

  Yes, but it's split between two fields, which is why it feels slippery.

  *   **In Philosophy of Mind:** This is **Functional Chauvinism**. Ned Block coined "chauvinism" to describe the refusal to grant mental states to non-biological systems (like silicon or aliens) that satisfy the functional definition of mind. If you say "Pain is functional role X" but then deny pain to a robot that fills role X because it's made of chips, you are a functional chauvinist.
  *   **In Cognitive Science:** This is the clash between **Classical Definition** (necessary and sufficient conditions) and **Prototype/Exemplar Theory** (categorization by similarity to a central case). You are noticing people *claiming* to use Classical Definitions while actually using Prototype matching.
  *   **In Rationalist Canon:** Eliezer touches on this in *Words as Mental Paintbrush Handles* and the *Sequence on Categories*, noting that we often want our words to track "the thing I originally meant" (the paradigm) even after we've updated the definition to be more general. There isn't a single pithy phrase for the *rhetorical move* itself, though **"Mot-and-Bailey Functionalism"** captures the dynamic.

  ### 2. Coining a Name (The Carving)

  If we are to name the *pattern of reasoning* specifically (the claim of openness + the enforcement of closedness), I propose: **Paradigm Smuggling**.

  Here is the carving you requested, distinguishing it from the three alternatives you listed:

  *   **Vs. (a) Legitimate Background Conditions:**
      *   *The Carving:* **Causal Relevance.**
      *   Legitimate conditions are causally necessary for the function to occur. (e.g., Defining "walking" functionally but excluding flying because legs contacting the ground is *part of the mechanism* of walking).
      *   *Paradigm Smuggling* excludes candidates where the difference is **causally idle**. (e.g., Excluding a silicon mind from "belief" because it lacks neurons, when neurons are not causally necessary for the information-processing role of belief).
  *   **Vs. (b) Family-Resemblance / Cluster Concepts:**
      *   *The Carving:* **Truth-Claim Transparency.**
      *   Cluster concepts admit gradience and boundary fuzziness explicitly ("There's no sharp line").
      *   *Paradigm Smuggling* claims sharp boundaries via necessary/sufficient conditions ("If it does X, it is Y"), but enforces the boundary via similarity matching. It lies about its own structure.
  *   **Vs. (c) Vagueness:**
      *   *The Carving:* **Systematicity of Exclusion.**
      *   Vagueness is "I don't know if this counts."
      *   *Paradigm Smuggling* is "I know this doesn't count, and the reason is always 'it's not like the original ones.'" The exclusions are not random; they systematically protect the original extension of the term.

  **The Name:** **Paradigm Smuggling** (or **Functional Chauvinism** if you want the philosophical pedigree).
  **The Definition:** *Asserting a functional definition while enforcing an ostensive extension.*

  ### 3. Where's the line? (Refinement vs. Smuggling)

  You asked when a "but not like that" clause is genuine refinement. The test is the **Breakage Mechanism**.

  When someone says, "A thermostat isn't a belief system," you ask: **"What specific causal power of a belief system fails in the thermostat *because* it is a thermostat?"**

  *   **Genuine Refinement:** "A written record isn't a memory because memory requires *reconstructive retrieval* to function in reasoning, and a static file doesn't do that." (Here, the 'not like that' points to a functional deficit).
  *   **Paradigm Smuggling:** "A written record isn't a memory because it's not *in the head*." (Here, the 'not like that' points to a substrate/location property that does not causally impact the function of storing/retrieving information).

  If the exclusion criterion cannot be translated into a functional deficit, it is smuggling.

  ### 4. Is Functionalism Broken?

  No, but **Language** is conservative.

  The problem isn't defining kinds by what they do. The problem is that human language is **Extension-First**. We learn words by pointing at examples ("This is pain," "This is a gene") long before we learn the functional rules.

  When you propose a functional definition, you are attempting **Conceptual Engineering**. You are trying to change the *intension* (the rule) while keeping the *extension* (the set of things) roughly stable. But if the functional rule is truly open, the extension *must* change.

  People panic when the extension changes. They want the theoretical benefits of functionalism (generality, clarity) without the ontological costs (admitting that prions are genes, or chatbots have beliefs). They want to expand the *logic* of the category without expanding the *territory*.

  So the mess isn't functionalism's fault; it's **Conceptual Conservatism**. We want our new definitions to validate our old intuitions. When they don't, we smuggle the old intuitions back in as hidden constraints.

  ### 5. The Honesty Check

  > *Is this just the old dilemma about what-it-does definitions — either so loose they let in everything or so tight they shut out the interesting cases — wearing a hat?*

  **Yes.** You have reinvented the **Intension/Extension Gap**, specifically as it appears in **Multiple Realizability** debates.

  *   **Too Loose:** If you define "belief" purely by information-guided action, a thermostat believes the room is 70°. This feels like it dilutes the concept until it's useless for discussing human psychology.
  *   **Too Tight:** If you define "belief" as "neural state in a human cortex," you lose the ability to talk about alien minds, AI, or even non-mammalian animals.

  The pattern you noticed is people trying to have it both ways. They want the *prestige* of the loose definition (sounds scientific, open-minded, functionalist) with the *comfort* of the tight definition (doesn't force me to treat the thermostat as a moral agent).

  **Verdict:** You haven't found a new bug; you've found the core tension of analytic philosophy. But naming it **Paradigm Smuggling** gives you a tool to call it out when it happens. When someone says "X is defined by function Y," and then rejects Z which does Y, ask them: **"Is your definition functional, or is it ostensive? Because you can't be both."**
