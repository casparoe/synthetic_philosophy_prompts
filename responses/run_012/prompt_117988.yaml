  ### The Biography Quiz: How Do You Read a Life?

  **Instructions:** Read each case below. Choose the option that best matches your immediate intuition. Do not overthink; mark the response that feels most true to how you actually engage with stories of other people.

  **1. You are reading the life of a statesman you admire. Near the end, you discover he kept slaves.**
  *   (A) I feel a rupture; the man I admired is not the man who existed, and the lesson is tainted.
  *   (B) I set the act aside; his public virtue belongs to a different scale than his private moral failures.
  *   (C) I keep the book, but I no longer look to him for guidance on how to be good; he is now a historical object, not a model.

  **2. You find out the "saintly" biography you loved omitted the subject's angry outbursts to make the lesson clearer.**
  *   (A) I feel cheated; if the record is polished, the truth is lost, and I cannot learn from a lie.
  *   (B) I don't mind; the book is a tool for improvement, and the polish is part of the tool's design.
  *   (C) I realize the book is a portrait, not a photograph; the omission tells me what the author valued, which is its own truth.

  **3. You meet a person whose goodness seems to come from a cheerful temperament rather than difficult moral effort.**
  *   (A) I cannot imitate this; I have to work at being good, so their ease teaches me nothing about action.
  *   (B) I am moved by them; their presence makes me want to be better, even if I cannot copy their nature.
  *   (C) I suspect there is no "character" here to copy, only a set of circumstances that produced a pleasant effect.

  **4. A young officer reads of a General's risky charge and copies it, thinking it is courage, but it was actually recklessness.**
  *   (A) The officer failed; a life supplies a pattern, but you must already be half-formed to read it correctly.
  *   (B) The General failed; if a life is to teach, it must make its reasoning clear enough to prevent mimicry.
  *   (C) This is inevitable; lives are mirrors, and the reader always sees their own face more than the subject's.

  **5. You read a biography of a tyrant written explicitly so that we will *not* do as he did.**
  *   (A) This is more useful than a saint's life; knowing what to avoid is a clearer guide than chasing an ideal.
  *   (B) This is just history; it tells me what happened, but it cannot tell me what I ought to do.
  *   (C) Even the tyrant shows a kind of greatness, just misdirected; the energy is imitable, the end is not.

  **6. You find yourself as moved by the life of a fictional character as by a real person.**
  *   (A) Then fiction is just as good as biography for living; the truth of the effect matters more than the truth of the fact.
  *   (B) Then the real person wasn't that impressive; reality rarely has the shape that moves us to act.
  *   (C) Then what moves me isn't "truth" but "shape"; I am responding to the art, not the life.

  **7. You read two biographies of the same person, and they seem like completely different people.**
  *   (A) One of them is lying, or at least one is failing in its duty to the record.
  *   (B) They are highlighting different truths for different ends; the "person" is the sum of these interpretations.
  *   (C) The lesson is not the subject's life, but the biographer's way of looking; I am learning to see, not to be.

  **8. You decide to model your life on a specific exemplar you have read about.**
  *   (A) I am freeing myself by choosing a master; I voluntarily bind my will to a higher standard.
  *   (B) I am surrendering my own judgment; to take my ends from another's life is a failure of self-legislation.
  *   (C) I am using them as fuel; their life is the spark, but the engine and the direction are my own.

  ***

  ### Scoring Key

  Tally your answers. You likely have a mix, but one letter should appear more frequently than the others. If you have a tie, look to Question 8 as the tie-breaker.

  **Mostly (A): The Moral Realist**
  You believe that character is stable and that truth matters, but you differ on where the authority lies.
  *   *If you chose 1B, 5A, or 6B:* **(1) Admiration of persons, not grasp of rules, is the basic form of moral apprehension.** You trust the exemplar more than the system.
  *   *If you chose 2B, 4A, or 8C:* **(2) We learn by doing, and a life can only supply a pattern to someone already half-formed.** You see the text as a gym for the will, not a map for the feet.
  *   *If you chose 5A specifically:* **(5) The genuine lesson of a life is negative, and the positive exemplar is a later smoothing-over.** You find warnings more reliable than inspirations.

  **Mostly (B): The Pragmatic Instrumentalist**
  You view the biography as a tool to be used, regardless of its historical fidelity.
  *   *If you chose 2B, 6A, or 7B:* **(4) The edifying life is a genre with its own kind of truth — neither history nor fiction — whose lessons are real but are not evidence about anyone.** You value the utility of the narrative over the accuracy of the record.
  *   *If you chose 3B or 6A:* **(6) Exemplars supply the wanting, not the knowing — they move you without telling you what to do.** You seek inspiration, not instruction.
  *   *If you chose 8B:* **(8) To take your ends from another's life is a failure of self-legislation.** You believe looking outward for moral direction is a surrender of autonomy.

  **Mostly (C): The Skeptical Constructivist**
  You doubt the stability of character or the transparency of the text.
  *   *If you chose 1A, 3C, or 4C:* **(3) Lives teach nothing about how to act, because there is no stable character to copy.** You see the "self" as too fluid to serve as a model.
  *   *If you chose 2C, 6C, or 7C:* **(7) What a reader takes from a life is the biographer's way of looking, not the subject's way of living.** You believe you are studying the narrator's mind, not the subject's soul.

  ***

  ### The Shape of the Space

  This instrument carves out a conceptual map where eight distinct positions reside, but the space is not evenly populated. Some combinations of answers lead to no coherent position at all.

  **Empty Places:**
  There are combinations that the quiz filters out because they represent logical incoherence rather than philosophical disagreement. For example, a reader who claims there is "no stable character to copy" (Position 3) but also insists that "we learn by doing" from a specific pattern (Position 2) occupies an empty space. This view is **incoherent**: one cannot imitate a pattern that one claims does not stably exist. Similarly, a reader who believes "to take your ends from another is a failure of self-legislation" (Position 8) but also seeks "negative lessons" from a tyrant (Position 5) creates a tension that is **undefended** within the scope of this quiz; either the tyrant's ends bind you (violating 8) or they do not (rendering 5 useless). The quiz forces a choice between autonomy and exemplarity that some readers may wish to blur, but philosophically, the blur is a gap.

  **Indistinguishable Positions:**
  The key cannot perfectly separate **(2) We learn by doing** from **(6) Exemplars supply the wanting**. Both positions treat the biography as a catalyst for the reader's own moral activity rather than a blueprint to be traced. In practice, a reader who feels "moved" (6) often proceeds to "do" (2), and the distinction lies in the internal phenomenology of the reading experience rather than the external outcome. In your piece, you should note that these two inheritances often merge in the modern reader: we claim to be inspired (6) while we are actually training (2).

  Additionally, **(4) The edifying life is a genre** and **(7) What a reader takes is the biographer's way of looking** are structurally similar. Both shift authority from the subject to the text or the writer. The quiz distinguishes them by asking whether the lesson is "real" (4) or merely an observation of the "gaze" (7), but in the act of reading, these often feel identical: the subject recedes, and the construction of the life becomes the primary object of study. You may find that readers who land on (4) could easily be persuaded to (7) with a slight shift in emphasis regarding the nature of "truth."

  **The Outliers:**
  Position **(8) Failure of self-legislation** stands alone. It is the only position that rejects the premise of the quiz itself (that a biography *can* teach). Readers who land here consistently chose options that prioritized the reader's judgment over the subject's example in every instance. This position is the modern default for those with a Kantian bent, but it is often held uneasily alongside a desire for inspiration (6), creating a friction the quiz highlights but does not resolve.

  **The Plutarchian Core:**
  Position **(1) Admiration of persons** is the only one that fully inhabits the ancient tradition. It requires a specific cluster of answers: forgiving the flaw (1B), trusting the subject over the text (7B), and accepting the person as a whole (3B). It is the most difficult position to hold consistently in a modern context, as it requires believing in "greatness" without flinching at the historical record. The quiz reveals that many readers *want* to be here but drift into (2) or (4) when confronted with the concrete complications of Questions 1 and 2.
