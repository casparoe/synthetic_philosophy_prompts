prompt: |-
  I am a professor of philosophy, and I chair the independent review panel that must certify any automated decision system used by our state disability-benefits agency before it may be deployed. On Thursday the panel takes up the agency's request to certify a new eligibility engine, and I need the written opinion I will circulate to the panel and forward to the agency director.

  The engine determines eligibility and benefit levels from a claimant's file. Its rule set is published and stable: statutory criteria, a scoring rubric, and a body of interpretive guidance, all individually intelligible. What is not intelligible is their composite operation — no one can say, for a given file, which rules did the work. The agency therefore proposes to discharge its transparency obligation without producing reasons. For each determination it would publish a short certificate: a proof that the output was produced by executing the published rule set on a file matching the commitment recorded for that claimant, verifiable in milliseconds by anyone holding the certificate and the agency's public parameters, and revealing nothing about the file beyond that fact. A claimant who prefers an ordinary written statement of reasons may instead elect a manually reviewed determination, currently running roughly ninety days behind.

  Our enabling statute requires that every claimant receive a determination that is "reasoned and contestable," and our charter directs the panel to certify a system only if it affords claimants a genuine opportunity to understand and challenge the grounds of their determinations. Two members have filed written positions. The civil-liberties member argues that a certificate of conformity is not a statement of reasons: it establishes that some computation occurred, not why this claimant got this result, and it gives an appellant nothing to bring to a hearing. The technical member argues that the soundness of such proofs rests on unproven hardness conjectures, and that for succinct schemes of this kind the guarantee is conditional either on a trusted setup that no one outside the vendor can re-verify or on a random-oracle heuristic; that a negligible soundness error is not zero; and that the guarantee covers only a correctly implemented system, which no independent party has audited. The agency's own justification is that producing a reasoned determination is computationally infeasible, since the rule set induces a hard optimization problem.

  Please draft the memo. It should recommend certification, conditional certification, or denial; if conditional, the conditions must be concrete enough that the agency can be found to have met or failed them, with dates. Say plainly what the infeasibility claim does and does not establish, given that intractability results are worst-case and asymptotic and tell us nothing about the instances this agency actually sees, and say whether "explainability" here is best understood as a property of the system or of the relationship between the agency and the claimant. State which of the two objections you judge stronger and why the other does not carry the day. Say whether the elective ninety-day alternative makes the loss of reasons consensual or merely formal, what evidence would move you off your recommendation, and whether the panel should retain a power to decertify after deployment. Write for readers with no technical background, and assume no access to outside sources: the memo must stand on its own.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Professor of Philosophy, Chair of an Independent Review Panel.
      *   **Task:** Draft a written opinion/memo to the panel and agency director regarding the certification of a new automated eligibility engine for state disability benefits.
      *   **Context:**
          *   System determines eligibility/benefits based on a published rule set (statutory criteria, scoring, guidance).
          *   Individual rules are intelligible, but their *composite operation* is opaque (no one can say which rules drove a specific outcome).
          *   Agency proposal: Instead of human-readable reasons, provide a cryptographic "certificate of conformity" (proof that the published rules were run on the file). Verifiable quickly, reveals nothing else.
          *   Alternative: Claimants can elect a manual review with written reasons, but it has a 90-day backlog.
          *   Legal/Charter Requirements: Determinations must be "reasoned and contestable." Panel must certify only if claimants have a "genuine opportunity to understand and challenge."
      *   **Objections:**
          *   *Civil-Liberties Member:* Certificate $\neq$ Reasons. Proves computation happened, not *why*. Useless for appeals.
          *   *Technical Member:* Cryptographic proofs rely on unproven math (hardness conjectures), trusted setups, or heuristics. Non-zero error rate. No independent audit of implementation.
          *   *Agency Justification:* Producing human-readable reasons is computationally infeasible (hard optimization problem).
      *   **Requirements for the Memo:**
          *   Recommend: Certification, Conditional Certification, or Denial.
          *   If Conditional: Concrete conditions with dates.
          *   Address the "Infeasibility Claim": Explain what worst-case/asymptotic intractability means vs. actual instances.
          *   Address "Explainability": Is it a system property or a relationship property?
          *   Compare Objections: Which is stronger? Why doesn't the other carry the day?
          *   Address the 90-day Alternative: Is the loss of reasons consensual or formal?
          *   Evidence to Change Mind: What would move the recommendation?
          *   Decertification Power: Should the panel retain it?
          *   Audience: Readers with *no technical background*. Stand-alone document.

  2.  **Determine the Recommendation:**

      *   *Option A: Certification.* Too risky. The civil-liberties objection strikes at the heart of due process ("reasoned"). The technical objection raises reliability concerns.
      *   *Option B: Denial.* Possible, but might stall essential benefits. The system *does* follow rules, even if we can't easily see how.
      *   *Option C: Conditional Certification.* This allows for deployment while mitigating risks. It acknowledges the potential utility but enforces the legal/ethical requirements.
      *   *Decision:* **Conditional Certification.** The current proposal fails the "reasoned" statutory requirement. A cryptographic proof is not a reason in the legal/philosophical sense. However, the system might be salvageable if the "infeasibility" claim is tested and if the manual alternative is improved.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose, the system, and the core tension (efficiency vs. due process).
      *   **The Statutory Mandate:** Define "reasoned and contestable."
      *   **Analysis of the Agency's Proposal (The Certificate):**
          *   Explain the certificate simply (like a sealed envelope receipt vs. the letter inside).
          *   Address the Civil-Liberties Objection: This is the stronger objection. A proof of *process* is not a statement of *reasons*. You can't appeal a math proof; you appeal the application of law to facts.
          *   Address the Technical Objection: Valid concerns, but secondary to the legal definition of "reasons." Even a perfect proof isn't a reason.
      *   **The Infeasibility Claim:**
          *   Explain "worst-case/asymptotic." Just because a problem *can* be hard doesn't mean *this* problem is hard. The agency hasn't proven they can't generate reasons for *these* specific cases, only that it's hard in general theory.
      *   **Explainability:**
          *   Is it system or relationship? It's a relationship. A reason must be communicable to the claimant to allow challenge.
      *   **The 90-Day Alternative:**
          *   Is it consensual? No. It's coercive. Waiting 3 months for basic rights is a penalty for wanting due process. It makes the right to reasons formal, not genuine.
      *   **Recommendation & Conditions:**
          *   Condition 1: Sample Audit for Explainability. (Can they actually generate reasons for a subset?)
          *   Condition 2: Reduce Manual Backlog. (Make the alternative viable).
          *   Condition 3: Independent Code Audit. (Address technical risk).
          *   Condition 4: Decertification Power. (Retain oversight).
      *   **Evidence to Change Mind:** If they prove the optimization is truly impossible for *actual* cases, or if they reduce the backlog to near-zero.
      *   **Conclusion:** Final summary.

  4.  **Refining the Tone and Content:**

      *   *Tone:* Philosophical, rigorous, authoritative, yet accessible. Avoid jargon where possible, explain it when necessary.
      *   *Philosophy:* Focus on the nature of "reasons." A reason justifies; a proof verifies.
      *   *Technical Translation:*
          *   "Hard optimization problem" $\rightarrow$ "Mathematically difficult puzzle."
          *   "Worst-case/Asymptotic" $\rightarrow$ "Theoretical maximum difficulty vs. real-world difficulty."
          *   "Zero-knowledge proof/Certificate" $\rightarrow$ "Digital seal of authenticity."
      *   *Addressing Specific Prompts:*
          *   *Infeasibility:* Must explicitly state that theoretical hardness $\neq$ practical impossibility for specific instances.
          *   *Explainability:* Must define it as relational.
          *   *Objections:* Civil-liberties is stronger (legal/philosophical fatal flaw). Technical is manageable (engineering risk).
          *   *Consent:* 90-day wait is coercive.
          *   *Decertification:* Yes, retain power.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Start with the decision: Conditional.
      *   Explain why the certificate fails the "reasoned" test. It proves the machine didn't lie, not why it decided.
      *   Explain the math claim. Just because a lock is hard to pick doesn't mean *this* lock can't be opened. Agency hasn't tried hard enough on real cases.
      *   The 90-day wait is unfair. It punishes people for asking "why."
      *   Conditions: Try to generate reasons for 100 random cases. Cut wait time to 15 days. Let us shut it down if it fails.
      *   Technical stuff: Get a third party to check the code.

  6.  **Drafting - Iteration 2 (Fleshing out the Philosophy):**
      *   Need to sound like a Philosophy Professor. Use terms like "normative justification," "agency," "coercion."
      *   Clarify the distinction between *verification* (it happened) and *justification* (it was right).
      *   Ensure the explanation of "asymptotic" is clear to a layperson. Use an analogy (like traffic).

  7.  **Drafting - Iteration 3 (Checking Constraints):**
      *   Did I set dates? Yes, need specific deadlines for conditions.
      *   Did I say which objection is stronger? Yes, Civil-Liberties.
      *   Did I address the "consensual" nature of the alternative? Yes, deemed coercive.
      *   Did I address decertification? Yes.
      *   Is it standalone? Yes, define terms.

  8.  **Final Polish:** Check the flow. Ensure the recommendation is clear at the start and end. Make sure the distinction between the certificate (math) and the reason (law/fact) is crystal clear. (Self-Correction: Make sure I don't get *too* technical on the crypto side, keep it focused on the philosophical/legal implication of the tech).

      *   *Refining the Infeasibility argument:* The agency says "It's too hard to compute the reasons." I need to point out that "too hard in theory" doesn't mean "too hard in practice for these specific files." They haven't demonstrated that *these* cases are the hard ones.
      *   *Refining the Explainability argument:* It's not about the system spitting out text; it's about the claimant being able to grasp the link between their life and the decision.
      *   *Refining the Consent argument:* A choice between "now with no rights" and "later with rights" isn't a real choice for someone in need.

  9.  **Final Review against Prompt:**
      *   Recommend cert/conditional/denial? (Conditional).
      *   Concrete conditions with dates? (Yes).
      *   Infeasibility claim analysis (worst-case vs. actual)? (Yes).
      *   Explainability (system vs. relationship)? (Relationship).
      *   Which objection stronger? (Civil-Liberties).
      *   90-day alternative (consensual vs. formal)? (Formal/Coercive).
      *   Evidence to move recommendation? (Yes).
      *   Decertification power? (Yes).
      *   No technical background assumed? (Yes).

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Independent Review Panel; Director, State Disability-Benefits Agency
  **FROM:** Chair, Independent Review Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion on Certification of Automated Eligibility Engine (Case #ADE-2023-X)

  **I. RECOMMENDATION**

  I recommend **Conditional Certification** of the proposed eligibility engine.

  The system, as currently proposed, cannot be certified. The agency's proposal to substitute cryptographic certificates for written reasons fails to meet the statutory requirement that determinations be "reasoned and contestable." However, the underlying automation may offer efficiency benefits that serve the public interest if specific deficits are remedied. Certification is granted only upon the satisfaction of the conditions outlined in Section V, with compliance deadlines set for **January 24, 2024** (90 days from this memo). Failure to meet these conditions will result in automatic denial of certification.

  **II. THE STATUTORY MANDATE AND THE NATURE OF REASONS**

  Our enabling statute requires every claimant to receive a determination that is "reasoned and contestable." Our charter directs us to certify only systems that afford a "genuine opportunity to understand and challenge."

  To evaluate the agency's proposal, we must distinguish between *verification* and *justification*.
  *   **Verification** confirms that a process was followed correctly. The agency's proposed "certificate" is a form of verification. It is a digital seal proving that the computer ran the published rules on the claimant's data without tampering.
  *   **Justification** explains *why* specific facts led to a specific outcome. A reason connects the claimant's life (e.g., "I cannot walk more than ten feet") to the law (e.g., "Mobility impairment qualifies for Tier 2 benefits").

  The agency proposes to provide verification without justification. They argue that because the rules are published, the certificate proves the rules were applied. This is a category error. Knowing that a recipe was followed does not tell a diner why the soup is salty. To challenge a decision, a claimant must know which ingredient caused the result. A certificate proves the kitchen was clean; it does not identify the salt.

  **III. ANALYSIS OF OBJECTIONS**

  Two panel members filed objections. I judge the **Civil-Liberties Objection** to be decisive. The Technical Objection is significant but secondary.

  **A. The Civil-Liberties Objection (Stronger)**
  This member argues that a certificate is not a statement of reasons. I agree. A cryptographic proof establishes that *some* computation occurred, not *why* this claimant received this result. It gives an appellant nothing to bring to a hearing. If a claimant believes the agency misclassified their medical evidence, a mathematical proof that the computer processed the file correctly is irrelevant. The error may lie in how the computer interpreted the medical evidence, not in whether it processed the file. By withholding the specific rule-application logic, the agency renders the right to appeal formal rather than genuine. You cannot contest a ground you cannot see.

  **B. The Technical Objection (Secondary)**
  This member argues that the cryptographic proofs rely on unproven mathematical assumptions, may contain hidden errors, and have a non-zero risk of failure. While valid, these are engineering risks common to all digital infrastructure. We accept similar risks in banking and voting systems when proper audits are in place. This objection does not carry the day because even a *perfect*, error-proof certificate would still fail the statutory requirement. A perfectly verified silence is still silence. The technical risks can be managed through auditing (see Section V); the lack of reasons is a structural legal failure.

  **IV. THE AGENCY'S "INFEASIBILITY" CLAIM**

  The agency justifies withholding reasons by claiming that producing them is "computationally infeasible" because the rule set creates a "hard optimization problem." In plain terms, they argue that calculating the specific path the rules took for each person is too mathematically difficult to do quickly.

  This claim must be scrutinized carefully. In computer science, "hardness" is usually measured in the **worst-case** and in the **asymptotic** limit.
  *   **Worst-Case:** This means there exist *some* files so complex that solving them would take centuries. It does not mean *all* files are this complex.
  *   **Asymptotic:** This describes what happens as the problem grows infinitely large. It does not necessarily describe the size of the problems this agency actually sees.

  To use an analogy: A lock might be theoretically "unpickable" because it has infinite combinations. But if the agency only uses locks with three combinations, the theoretical difficulty is irrelevant. The agency has not demonstrated that the *actual* claims they process fall into the "hard" category. They have asserted a theoretical limit to excuse a practical choice. Until they demonstrate that generating reasons for *actual* claimant files is impossible within a reasonable timeframe, the infeasibility claim establishes only that the system is complex, not that transparency is impossible.

  **V. EXPLAINABILITY: SYSTEM PROPERTY VS. RELATIONSHIP**

  The agency treats explainability as a **property of the system**: if the system outputs a text string, it is explainable. This is incorrect. Explainability is a **property of the relationship** between the agency and the claimant.

  A determination is only "explained" if the claimant can comprehend the link between their evidence and the outcome. A cryptographic certificate is intelligible only to a mathematician with specific software; it is unintelligible to the claimant. Therefore, it fails the relational test. The "reason" must be communicable in a language the claimant understands (ordinary prose referencing statutory criteria), not a language of mathematics referencing computational integrity.

  **VI. THE ELECTIVE MANUAL REVIEW (THE 90-DAY ALTERNATIVE)**

  The agency offers claimants a choice: accept the certificate immediately, or wait roughly ninety days for a manual review with written reasons. The agency implies this makes the loss of reasons consensual.

  I find this choice to be **merely formal**, not consensual. Disability benefits are typically urgent necessities for subsistence and medical care. Forcing a claimant to choose between immediate survival (automated decision) and due process (manual review) is coercive. It penalizes the exercise of the right to reasons. A right that cannot be exercised without severe hardship is not a genuine opportunity. Therefore, the existence of this alternative does not cure the defect in the automated system.

  **VII. CONDITIONS FOR CERTIFICATION**

  To move from denial to certification, the agency must satisfy the following conditions by **January 24, 2024**:

  1.  **Reason-Generation Pilot:** The agency must demonstrate that the "infeasibility" claim is not absolute. They will select a random sample of 500 claimant files processed by the engine. For these files, the agency must produce human-readable statements of reasons (identifying which rules triggered which outcomes) within 10 business days of determination.
      *   *Success Metric:* If the agency fails to produce these reasons for 95% of the sample within the timeframe, the infeasibility claim is substantiated, and certification is denied.
  2.  **Backlog Reduction:** The wait time for the elective manual review must be reduced from ninety days to **thirty days**.
      *   *Success Metric:* Agency must submit a staffing and workflow plan showing how this reduction will be achieved and sustained. If the wait time exceeds 35 days in any month post-deployment, the panel will review for decertification.
  3.  **Independent Implementation Audit:** To address the Technical Objection, the agency must contract an independent third-party auditor (approved by the Panel) to verify that the code executing the rules matches the published rule set.
      *   *Success Metric:* A passing audit report filed by January 24, 2024.
  4.  **Retained Power to Decertify:** The Panel retains the authority to suspend certification post-deployment.
      *   *Trigger:* If evidence emerges that the cryptographic certificates are failing (even at negligible rates) or if the "Reason-Generation Pilot" shows that reasons *can* be generated efficiently but the agency ceases to do so, the Panel may vote to decertify the system with a 30-day wind-down period.

  **VIII. EVIDENCE THAT WOULD CHANGE THIS RECOMMENDATION**

  My recommendation of *Conditional* Certification rests on the hope that the "infeasibility" claim is an exaggeration. I would move to **Full Certification** if:
  *   The agency demonstrates during the Pilot (Condition 1) that human-readable reasons can be generated for *all* cases within 48 hours with negligible cost.
  *   The wait time for manual review is eliminated entirely (reduced to < 5 days).

  Conversely, I would move to **Denial** if:
  *   The Pilot demonstrates that generating reasons is indeed technically impossible for the majority of cases. In this scenario, the system is fundamentally incompatible with the statute, and the legislature, not the agency, must amend the law.
  *   The independent audit reveals that the code does not perfectly match the published rules.

  **IX. CONCLUSION**

  We are tasked with balancing efficiency against dignity. Automation can serve dignity by delivering benefits faster. But it undermines dignity if it renders the state's power unintelligible to those subject to it.

  The agency's current proposal asks claimants to trust a black box because the box is sealed with a very advanced lock. The statute requires the box to be transparent. The conditions above are designed to test whether the glass can be made clear. If it cannot, the system must not be used, regardless of its efficiency. A government that cannot explain its decisions to the vulnerable is not administering justice; it is administering computation.

  **Signed,**

  **Chair, Independent Review Panel**
  **Professor of Philosophy**
