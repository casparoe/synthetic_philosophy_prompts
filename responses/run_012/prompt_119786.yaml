  ### Predictable Problems & Mitigations

  1.  **Ties:** With 12 voters, ties are likely.
      *   *Fix:* The Alphabetical Tie-Break is external. Emphasize: "You cannot vote on the tie-break. It is a rule of nature like gravity." This prevents them from treating the tie-break as a manipulation lever.
  2.  **Non-Manipulators:** Type 1 students in Round 1 get their 1st choice (A wins on tie-break). They may feel the exercise is a dud.
      *   *Fix:* In the debrief, ask them: "Did you feel *safe*? Or did you just get lucky? If you knew Type 2 was going to lie, would you have lied to defend A?" This shifts focus from outcome to strategy.
  3.  **Caucusing:** Students might compare cards.
      *   *Fix:* "The Theorem assumes you cannot enforce contracts with other voters. If you can trust 5 people to lie together, that is Coalition Manipulation, which is even harder to prevent. Today we test individual incentives."
  4.  **Uncertainty Objection:** "I didn't know the profile."
      *   *Fix:* Use the "Dominant Strategy" explanation in the debrief. "A robust rule protects you even if you know nothing about others. If you need to know the profile to vote safely, the rule is flawed."

  ### Final Board Sketch (Theorem Logic)
  1.  **Range:** Rule must be able to pick any option.
  2.  **Pivotal:** Someone must be able to change the outcome (otherwise outcome is fixed).
  3.  **Swap:** If I can change outcome from X to Y, and I prefer Y, I will lie.
  4.  **Dictator:** To stop this, the only person who changes the outcome must always get their top choice. That person is a Dictator.
