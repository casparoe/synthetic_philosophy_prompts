  ## Session Plan: The Impossible Committee

  **Time:** 90 Minutes
  **Students:** 12 Undergraduates (2nd/3rd Year)
  **Topic:** Intuition for the Gibbard–Satterthwaite Theorem
  **Materials:** Preference Cards (12), Regret Slips (36), Design Worksheets (6), Whiteboard.

  ---

  ### Part 1: The Setup (0–10 Minutes)

  **Instructor Script:**
  "Welcome. Today you are the Departmental Retreat Committee. You have a fixed budget and four candidate sites: **Alpine (A)**, **Beach (B)**, **City (C)**, and **Desert (D)**. Your goal is to select one.

  I have handed each of you a **Preference Card**. This card is private. It tells you your true ranking of the sites and, crucially, the **Point Payoff** you receive if that site is chosen. At the end of class, the three students with the highest total points across all activities will receive [Insert Stake: e.g., 5 bonus points on the next assignment / a coffee voucher].

  We will run three votes on the same preferences. After each vote, you will fill out a **Regret Slip** anonymously: *'Would you have voted differently to get more points?'* We are testing decision procedures, not your honesty. Keep your cards hidden."

  **Distribution:**
  Hand out the 12 Preference Cards (see Profile below). Ensure the room is mixed (do not let Type 1 students sit together).

  ---

  ### Part 2: The Three Rounds (10–35 Minutes)

  **Round 1: Plurality (10–18 Minutes)**
  *   **Rule:** "Vote for one site. Most votes wins. Ties broken alphabetically (A > B > C > D)."
  *   **Action:** Collect ballots. Tally publicly on the board.
  *   **Expected Outcome:** A=4, B=4, C=4. Tie. Alphabetical tie-break $\rightarrow$ **A Wins**.
  *   **Regret Slip:** "Did you vote for your true 1st choice? If not, what did you vote for? Could you have gained points by changing?"
  *   **Instructor Note:** Do not explain *why* A won yet. Just announce the winner.

  **Round 2: Scoring Rule (18–26 Minutes)**
  *   **Rule:** "Award 3 points to your 1st choice, 1 point to your 2nd. The two sites with the highest total scores advance to a runoff. In the runoff, simple majority wins. Ties in scoring broken alphabetically."
  *   **Action:** Collect ballots. Tally scores. Run runoff.
  *   **Expected Outcome:**
      *   Scores: A=16, B=16, C=16. (Triple Tie).
      *   Tie-break: A and B advance.
      *   Runoff (A vs B): A wins (8 votes to 4).
      *   **Winner: A**.
  *   **Regret Slip:** Same as above.
  *   **Instructor Note:** Watch for Type 2 students (B>C>A). They get A (3rd choice, 2 pts). They have a manipulation.

  **Round 3: Amendment Agenda (26–35 Minutes)**
  *   **Rule:** "We vote pairwise. First A vs B. Winner faces C. That winner faces D."
  *   **Action:** Three show-of-hands votes.
  *   **Expected Outcome:**
      1.  A vs B $\rightarrow$ A wins (8-4).
      2.  A vs C $\rightarrow$ C wins (8-4).
      3.  C vs D $\rightarrow$ C wins (12-0).
      *   **Winner: C**.
  *   **Regret Slip:** Same as above.
  *   **Instructor Note:** Type 1 students (A>B>C) get C (3rd choice). They have a manipulation (vote B in round 1).

  **Transition:** "Look at your Regret Slips. In every round, someone in this room could have earned more points by lying. The rule changed, the outcome changed, but the vulnerability remained. Now, you fix it."

  ---

  ### Part 3: The Design Phase (35–60 Minutes)

  **Instruction:**
  "Get into pairs. Your task is to draft a **Decision Procedure**.
  1.  It must always produce exactly one winner from {A, B, C, D}.
  2.  It must be capable of producing *any* of the four (you cannot ban 'Desert' permanently).
  3.  **The Constraint:** It must be **Ungameable**. If I give you your preference card back, you should never be able to say, 'If I had lied on my ballot, I would have gotten more points.'

  You have 15 minutes. Then you will swap your rule with another pair. Their job is to break it. If they can find a voter who benefits from lying, your rule is eliminated."

  **Instructor Role:**
  Circulate. If a pair is stuck, offer a hint: "What if the rule didn't look at most of the ballots?" or "What if the rule ignored some of the options?" (Remind them they can't permanently ban options).
  *Goal:* Steer at least one pair toward: **"The Chair (Instructor) picks their favorite."** or **"We pick Voter #1's top choice."**

  **The Swap (15 Minutes):**
  Pairs try to find manipulations in other pairs' rules.
  *   *Likely Failures:* "Weighted Scoring" (weights can be gamed). "Eliminate the last place" (Sequential elimination is gamed).
  *   *Likely Survivor:* The rule that says "The Instructor's preference decides" or "Voter 1's preference decides."
  *   *Why it survives:* If the outcome depends *only* on Voter 1, Voter 2-12 cannot change the outcome by lying. Voter 1 cannot change the outcome by lying (because the rule just takes their ballot literally).

  **Board Work:**
  List the eliminated rules on the left. List the surviving rule(s) on the right.

  ---

  ### Part 4: The Debrief & The Three Exits (60–85 Minutes)

  **1. The Punchline (Dictatorship)**
  Point to the surviving rule.
  "In every round, you tried to build a rule that respected everyone's voice but couldn't be gamed. You failed. The only rule on the board that survived the 'break it' test was the one that gave the decision to a single person.
  In social choice theory, we call this a **Dictatorship**. Not necessarily a tyrant, but a rule where one person's top choice *always* wins, regardless of others.
  Why did it survive? Because if the outcome doesn't depend on you, you have no incentive to lie. If it depends only on you, you have no incentive to lie (since it just takes your truth).
  This is the first exit from the impossibility: **Accept Dictatorship.**"

  **2. Exit Two: Restricting Preferences (Single-Peaked)**
  "Is there any other way? Yes, if we restrict *how* you are allowed to prefer things.
  Imagine the sites are on a line from Left to Right: A — B — C — D.
  A 'single-peaked' preference means you have one favorite, and as you move away from it in either direction, you like the options less. You don't prefer A to B to C to A.
  *[Hand out Second Profile: 12 cards with single-peaked prefs, e.g., all prefer B or C most, declining outwardly].*
  If we use the **Median Voter Rule** (pick the median most-preferred option), and preferences are single-peaked, you cannot game it.
  This is the second exit: **Restrict the Domain.** Real politics often looks like this (Left-Right spectrum), which is why voting works 'okay' sometimes."

  **3. Exit Three: Allowing Chance**
  "What if we don't need a deterministic winner?
  Rule: 'I pick one of you at random. That person's top choice wins.'
  Can you game this? No. If you are not picked, your vote doesn't matter. If you are picked, you should state your true top choice to get it.
  This is the third exit: **Give up Determinism.** We call this a 'Random Dictatorship'."

  **4. The Theorem (Last 5 Minutes)**
  "Now I can use the forbidden words. What you just experienced is the intuition behind the **Gibbard–Satterthwaite Theorem** (1973).
  It states: *If there are at least 3 options, and preferences are unrestricted, the only decision procedure that is always strategy-proof (ungameable) and onto (can pick any option) is a Dictatorship.*
  You didn't just fail to find a rule; the theorem says no such rule exists."

  ---

  ### Part 5: Limitations & Objections (85–90 Minutes)

  **Honest Note on Limitations:**
  "Be careful. We tested a finite number of rules with 12 people. That does not prove *no* rule exists. The Theorem is a mathematical proof covering *all* possible rules and *all* population sizes. Today was an intuition pump, not a proof."

  **Smallest Honest Board Proof (10-Minute Sketch):**
  1.  **Pivotal Voter:** If no single voter can ever change the outcome, the outcome is constant (impossible). So someone is pivotal.
  2.  **Swap:** If a voter is pivotal between outcome X and Y, they can swap the winner by changing their vote.
  3.  **Incentive:** If they prefer Y to X, they will lie to make Y win.
  4.  **Resolution:** To prevent lying, the rule must ensure that whenever a voter is pivotal, they are getting their top choice. This implies one voter dictates the outcome.

  **Handling Student Objections:**

  *   **"I didn't know how others would vote, so I couldn't game it."**
      *   *Response:* "That is a crucial distinction. The Theorem requires **Dominant Strategies**—rules where telling the truth is best *no matter what* others do. If you need to guess others' votes to know whether to lie, the rule is not strategy-proof. It relies on uncertainty, not safety."
  *   **"This only shows people should vote sincerely."**
      *   *Response:* "If the rule is manipulable, 'vote sincerely' is not stable advice. If everyone else is gaming the system, your sincere vote might waste your influence. The theorem says the *system itself* forces the gaming."
  *   **"What about collusion/caucusing?"**
      *   *Response:* "Gibbard-Satterthwaite is about *individual* manipulation. If a group can collude, that's an even stronger failure (Coalitional Manipulation). But even if you trust no one (individual incentives), the system still breaks."
  *   **"What about money?"**
      *   *Response:* "If we allow side-payments (bribes), we enter **Mechanism Design** (like the VCG mechanism). Money changes the incentives entirely, allowing us to bypass the theorem, but that requires transferable utility, which voting doesn't have."
  *   **"What about the randomized analogue?"**
      *   *Response:* "Gibbard (1977) extended this: even if we allow lotteries, the only strategy-proof rules are **lotteries over dictatorships**. You can randomize *who* dictates, but you cannot escape the dictatorship structure."

  ---

  ### Appendix: The Materials

  #### 1. The Preference Profile (12 Cards)
  *Print 4 of each Type. Cut and fold.*

  **Type 1 (Cards 1–4)**
  *   **Ranking:** Alpine (A) > Beach (B) > City (C) > Desert (D)
  *   **Payoffs:** A: 10 pts | B: 6 pts | C: 2 pts | D: 0 pts
  *   *Secret Instruction:* You prefer A most.

  **Type 2 (Cards 5–8)**
  *   **Ranking:** Beach (B) > City (C) > Alpine (A) > Desert (D)
  *   **Payoffs:** B: 10 pts | C: 6 pts | A: 2 pts | D: 0 pts
  *   *Secret Instruction:* You prefer B most. (Note: In Round 1, A wins. You get 2 pts. If you vote C, C wins, you get 6 pts.)

  **Type 3 (Cards 9–12)**
  *   **Ranking:** City (C) > Alpine (A) > Beach (B) > Desert (D)
  *   **Payoffs:** C: 10 pts | A: 6 pts | B: 2 pts | D: 0 pts
  *   *Secret Instruction:* You prefer C most.

  *(Note: D is universally last to simplify the Agenda Round 3 pairwise votes.)*

  #### 2. Manipulation Key (For Instructor)

  *   **Round 1 (Plurality):**
      *   *Sincere:* A=4, B=4, C=4. Tie $\rightarrow$ **A Wins**.
      *   *Manipulator:* Any Type 2 Voter.
      *   *Lie:* Vote **C** instead of B.
      *   *Result:* A=4, B=3, C=5. **C Wins**.
      *   *Gain:* Type 2 gets C (6 pts) instead of A (2 pts).

  *   **Round 2 (Scoring 3/1, Top 2 Runoff):**
      *   *Sincere Scores:* A=16, B=16, C=16. Tie-break $\rightarrow$ A & B advance. Runoff A vs B $\rightarrow$ **A Wins**.
      *   *Manipulator:* Any Type 2 Voter.
      *   *Lie:* Vote **C (3pts), B (1pt)** instead of B(3), C(1). (Swap weights).
      *   *Result:* A=16, B=13, C=19. Top 2: C & A. Runoff C vs A $\rightarrow$ **C Wins**.
      *   *Gain:* Type 2 gets C (6 pts) instead of A (2 pts).

  *   **Round 3 (Agenda ((A vs B) vs C) vs D):**
      *   *Sincere:* A beats B. C beats A. C beats D. **C Wins**.
      *   *Manipulator:* Any Type 1 Voter.
      *   *Lie:* In Round 1 (A vs B), vote **B**.
      *   *Result:* B beats A. B beats C. B beats D. **B Wins**.
      *   *Gain:* Type 1 gets B (6 pts) instead of C (2 pts).

