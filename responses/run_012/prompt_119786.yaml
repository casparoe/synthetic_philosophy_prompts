      *   *Condition 2: Scoring Rule Manipulation.* Someone needs to benefit by voting insincerely in Round 2 (3 pts for 1st, 1 pt for 2nd, top 2 advance, tie-break by score).
      *   *Condition 3: Condorcet Cycle.* A beats B, B beats C, C beats A (or similar involving D) so the Agenda (Round 3) determines the winner.
      *   *Condition 4: Payoffs.* Each student needs a point payoff associated with the outcome to make manipulation "rational."
      *   *Constraint:* 12 students. I need to distribute the 12 cards such that the manipulations are available to specific students *in the room*.
      *   *Strategy:* I will create 4 types of voters (3 of each type) to make the math clean and ensure the cycle exists. Then I will check if specific individuals within those types have incentives to manipulate.
      *   *Options:* Let's use Retreat Locations: **Alpine (A)**, **Beach (B)**, **City (C)**, **Desert (D)**.

      *   *Drafting the Cycle:*
          *   To get a cycle A > B > C > A:
          *   Group 1 (4 voters): A > B > C > D
          *   Group 2 (4 voters): B > C > A > D
