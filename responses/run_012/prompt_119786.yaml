          *   *Problem:* This is too symmetric. Plurality will be a 3-way tie (4, 4, 4). Tie-breakers become the whole story. I need asymmetry to make specific manipulations clear.

      *   *Revised Profile Strategy:*
          *   Let's make D a "spoiler" or irrelevant option to simplify, or use it to break ties. Let's try to make Plurality close.
          *   Let's try 12 voters.
          *   Types:
              1.  3 voters: A > B > C > D
              2.  3 voters: B > C > A > D
              3.  3 voters: C > A > B > D
              4.  3 voters: D > ... (Need to make D relevant or not).
          *   Actually, for GS intuition, we usually want the "Dictator" exit to be the only one left.
          *   Let's construct a profile where specific manipulations are *guaranteed* for at least one student holding a specific card.

      *   *Profile Construction for Manipulations:*
          *   **Round 1 (Plurality):** Tie-break is Alphabetical (A > B > C > D).
              *   Need a situation where Voting True $\rightarrow$ X wins. Voting Lie $\rightarrow$ Y wins. Voter prefers Y.
              *   Let's say A is winning sincerely. A voter who hates A wants B to win. They vote B instead of their true favorite (who can't win).
          *   **Round 2 (Scoring):** 3 pts for 1st, 1 pt for 2nd. Top 2 advance. Tie-break: Score then Alphabetical.
              *   Need a voter to bury a strong competitor or boost a weak ally.
          *   **Round 3 (Agenda):** ((A vs B) vs C) vs D.
              *   Need the Cycle so the order matters.

      *   *Let's build the 12 Cards explicitly.*
          *   Options: A, B, C, D.
          *   Payoffs: 1st=10 pts, 2nd=6 pts, 3rd=2 pts, 4th=0 pts. (Simple linear).
          *   *Voter 1-3 (Type A):* A > B > C > D. (Payoff: 10, 6, 2, 0)
          *   *Voter 4-6 (Type B):* B > C > A > D. (Payoff: 10, 6, 2, 0)
          *   *Voter 7-9 (Type C):* C > A > B > D. (Payoff: 10, 6, 2, 0)
          *   *Voter 10-12 (Type D):* D > A > B > C. (Payoff: 10, 6, 2, 0)
          *   *Total:* 12 voters.
          *   *Plurality Count:* A=3, B=3, C=3, D=3. Perfect tie. Alphabetical tie-break $\rightarrow$ **A wins**.
