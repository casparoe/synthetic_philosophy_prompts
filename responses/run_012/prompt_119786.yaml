                  *   Let's look at Type B (Voter 4). Pref: B>C>A>D. Outcome A wins (3rd place, 2 pts).
                  *   Sincere Vote: B(3), C(1). Score contribution: B+3, C+1.
                  *   If Voter 4 votes B(3), A(1) instead? (Boosting A over C to knock out C?).
                  *   Current Scores: A=15, B=12, C=12, D=9.
                  *   If Voter 4 changes from (B, C) to (B, A):
                      *   A gains 1 (now 16). C loses 1 (now 11). B stays 12.
                      *   Top 2: A (16), B (12). C is out.
