  3.  **Session Flow & Scripting:**

      *   **0-10 min: Setup.** Hand out cards. Explain stakes (points toward participation grade). Explain secrecy.
      *   **10-40 min: The Three Rounds.**
          *   Run Round 1 (Plurality). Collect "Regret Cards". Reveal outcome.
          *   Run Round 2 (Scoring). Collect "Regret Cards". Reveal outcome.
          *   Run Round 3 (Agenda). Collect "Regret Cards". Reveal outcome.
          *   *Crucial:* Do not explain *why* yet. Just ask "Would you have voted differently to get more points?"
      *   **40-65 min: Design Phase.**
          *   Pairs draft a rule.
          *   Swap and attack.
          *   Instructor refrees.
          *   Goal: Find a rule that survives.
          *   *Expected Outcome:* Most fail. The ones that survive are usually "Chair picks" or "Exclude 3 options".
      *   **65-80 min: The Three Exits (Debrief Part 1).**
          *   Exit 1: Single-Peaked. Hand out new profile (Left-Right). Run Median. Show it works.
          *   Exit 2: Randomization. Dictator Lottery. Show it works.
          *   Exit 3: Dictatorship. Point to the surviving rule from Design Phase.
      *   **80-90 min: The Theorem & Limitations.**
          *   Name GS.
          *   Board proof sketch (very high level).
          *   Address objections (Ties, Collusion, Uncertainty).

  4.  **Addressing Specific Constraints & Worries:**

      *   *Ties:* With 12 voters and the 4-4-4 split, ties are frequent.
          *   *Fix:* The profile I designed (4-4-4) relies on ties for Plurality. I need to make sure the tie-break rule is *fixed* and *known* so it's not a manipulation lever itself. Alphabetical is good.
          *   *Worry:* Students manipulating the tie-break.
          *   *Mitigation:* Explicitly state tie-breaks are external (coin flip or alphabetical) and cannot be influenced by votes, only by the outcome of the vote.
      *   *Non-Manipulators:* In the 4-4-4 profile, everyone has an incentive to manipulate in at least one round.
          *   Type 1 (A>B>C): Happy with Plurality (A wins on tie-break). Unhappy with Agenda (C wins). Can manipulate Agenda.
          *   Type 2 (B>C>A): Unhappy with Plurality (A wins). Can manipulate Plurality.
          *   Type 3 (C>A>B): Unhappy with Scoring (A wins). Can manipulate Scoring.
          *   *Check:* In Plurality (4-4-4 $\rightarrow$ A), Type 1 gets 1st (5pts). They won't manipulate. Type 2 gets 3rd (1pt). They will. Type 3 gets 2nd (3pts). They might not *need* to, but could they get 1st? If Type 3 votes C, count is 4-4-4. No change. If Type 2 votes C, C wins (5-4-3). Type 3 gets 1st. So Type 3 benefits from Type 2's manipulation, but can Type 3 manipulate alone? No.
          *   *Correction:* I need to ensure *every* student feels the pain or sees the pain nearby. The prompt asks for "at least one voter who has a profitable misreport". It doesn't require *all* to have one in *every* round. But for the class dynamic, it's better if the room is buzzing.
          *   *Refinement:* In the debrief, acknowledge that some were lucky in Round 1, but ask them if they felt safe.
      *   *Collusion:* "Caucusing".
          *   *Mitigation:* Emphasize "Individual Incentive". The theorem is about individual strategy-proofness. If they collude, that's coalition manipulation (stronger condition), but keep the focus on "Could *you* have done better *alone*?"
      *   *Uncertainty:* "I didn't know how others would vote."
          *   *Response:* This is the "Dominant Strategy" vs "Nash Equilibrium" point. GS is about Dominant Strategies (works regardless of others). The debrief must clarify this distinction.
      *   *Board Proof:* Needs to be 10 mins.
          *   Don't prove GS. Sketch the logic. "If you aren't a dictator, there's a pivotal voter. If they can swap the outcome, they can lie." Use the "Local Dictator" intuition.

  5.  **Drafting the Materials:**

      *   **Preference Cards:** Need to look professional. Include Payoff Table.
      *   **Regret Cards:** Simple slip: "Round X: Did you vote sincerely? Yes/No. If No, what would you have voted?"
      *   **Scoreboard:** Public tracking of points (optional, but adds stakes). Let's keep it private to avoid shame, but announce "Top 3 scorers get bonus".
      *   **Design Worksheet:** Blank space for "The Rule".

  6.  **Refining the "Punchline" (Dictatorship):**

      *   During the design phase, I need to steer one pair toward "The Chair Decides" without naming it dictatorship.
      *   Instruction: "Your rule must always produce a winner."
      *   If they get stuck, suggest: "What if you just picked one person's ballot and used that?"
      *   When they present it, it will seem cowardly.
      *   Debrief: "This is the only one that survived. Why? Because if the outcome doesn't depend on you, you can't lie to change it."

  7.  **Final Review against Prompt:**

      *   90 mins? Yes.
      *   12 students? Yes.
      *   No jargon until debrief? Yes.
      *   Specific Profile provided? Yes (4-4-4 Cycle).
      *   Manipulations detailed? Yes.
      *   3 Exits in debrief? Yes.
      *   Limitations note? Yes.
      *   Objections handled? Yes.

  8.  **Self-Correction on Profile:**
      *   Wait, in the 4-4-4 profile, Plurality Tie-Break is Alphabetical (A).
      *   Type 2 (B>C>A) wants to manipulate. Votes C. Count: A=4, B=3, C=5. C wins. Type 2 gets 2nd (C). Better than 3rd (A). **OK.**
      *   Scoring: A wins. Type 3 (C>A>B) wants to manipulate. Votes C, B (bury A). B and C advance. B wins. Type 3 gets 3rd (B). Worse than 2nd (A).
      *   *Wait, I need a Scoring Manipulation that works.*
      *   Let's check Type 2 (B>C>A) in Scoring. Outcome A (3rd).
      *   Sincere: B(3), C(1).
      *   Lie: C(3), B(1).
      *   Scores: A=16, B=13, C=19. Top 2: C, A.
      *   Final C vs A. C wins.
