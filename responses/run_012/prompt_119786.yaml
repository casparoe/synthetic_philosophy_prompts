          *   **Crucial Need:** A specific preference profile (12 voters, 4 options) that satisfies specific conditions:
              *   Plurality manipulation exists.
              *   Scoring rule manipulation exists.
              *   Agenda manipulation exists (Condorcet cycle).
              *   Must be robust enough for a live class.
          *   **Debrief Requirements:** Connect activity to GS theorem, explain the "3 Exits" (Single-peaked, Randomization, Dictatorship), address limitations (finite testing vs. universal quantifier), and handle specific student objections (ties, non-manipulators, collusion, uncertainty vs. dominant strategy).
