                      *   Vote A vs C: Type A (A), Type B (C), Type C (C), Type D (A).
                      *   A: 3+3=6. C: 3+3=6. Tie.
                      *   This is getting messy with ties. I need a cleaner profile.

      *   *Refining the Profile for Robustness:*
          *   Let's reduce options to 3 for the cycle, keep D as a dummy or use 4 for the Agenda. Let's stick to 4 as requested.
          *   Let's ensure the Plurality winner is *not* the Condorcet winner if one exists, or ensure the Cycle is strong.
          *   Let's try a profile known to be manipulable.
          *   *Voters 1-5:* A > B > C > D
          *   *Voters 6-8:* B > C > A > D
          *   *Voters 9-12:* C > A > B > D
          *   Total 12.
          *   Plurality: A=5, B=3, C=4. **A wins.**
          *   Condorcet:
              *   A vs B: 5 (Type 1) + 4 (Type 3, C>A>B so A>B) = 9 vs 3. A wins.
              *   A vs C: 5 (Type 1) vs 3 (Type 2) + 4 (Type 3) = 7. C wins.
              *   B vs C: 5 (Type 1, B>C) + 3 (Type 2) = 8 vs 4. B wins.
              *   Cycle: A > B > C > A. (A beats B, B beats C, C beats A).
              *   Wait, Type 3 is C > A > B. So they prefer A over B.
              *   A vs B: Type 1 (A) + Type 3 (A) = 5+4=9. Type 2 (B) = 3. A wins.
              *   B vs C: Type 1 (B) + Type 2 (B) = 5+3=8. Type 3 (C) = 4. B wins.
              *   C vs A: Type 2 (C) + Type 3 (C) = 3+4=7. Type 1 (A) = 5. C wins.
              *   Cycle Confirmed: A > B > C > A.
          *   *Plurality Manipulation:*
              *   Current Winner: A (5 votes).
              *   Who wants to change this? Type 2 (B>C>A) or Type 3 (C>A>B).
              *   Type 3 prefers C (1st) > A (2nd). They are getting 2nd. Can they make C win?
