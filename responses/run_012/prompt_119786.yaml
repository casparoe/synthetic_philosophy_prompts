              *   Sincere Scores:
                  *   A: 3*3 (Type A) + 0 (Type B) + 1*3 (Type C 2nd) + 1*3 (Type D 2nd) = 9 + 0 + 3 + 3 = 15.
                  *   B: 1*3 (Type A 2nd) + 3*3 (Type B) + 0 (Type C) + 1*3 (Type D 3rd? No, D is A>B>C). Wait, Type D is D>A>B>C. So B is 3rd. 0 pts.
