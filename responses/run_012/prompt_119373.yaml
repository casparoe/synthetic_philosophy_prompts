answer: |-
  Your intuitions are a textbook description of Prospect Theory, but you must abandon the fifth verdict because it violates the reduction of compound lotteries, making your choices mathematically incoherent.

  The best version of the principle is Cumulative Prospect Theory, which posits that you evaluate outcomes relative to a reference point using a value function that is concave for gains and convex for losses, combined with a probability weighting function that transforms objective probabilities into subjective decision weights. This principle contains three specific clauses that explain your first four verdicts. First, small probabilities are overweighted, which forces Verdict 2 (buying the lottery ticket) and Verdict 3 (buying insurance); you treat the tiny chance of a massive gain or loss as more significant than the arithmetic mean suggests. Second, moderate to high probabilities are underweighted, which forces Verdict 1 (preferring the certain £900); you treat a 90 per cent chance as less secure than it truly is, creating a 'certainty effect' where guaranteed outcomes are disproportionately attractive. Third, the value function is convex in the domain of losses, which forces Verdict 4 (gambling to avoid a certain loss); you are risk-seeking when facing losses because the pain of a certain £100 loss feels worse than the weighted pain of a probabilistic £400 loss.

  Regarding cases you have not listed, this principle predicts distinct behaviours. For a coin-flip whose odds are your own estimate rather than a coin's, you will exhibit ambiguity aversion; because the probability is not known objectively, you will treat the uncertainty as riskier than a known probability, further amplifying the overweighting of small risks of bad outcomes. For a gamble whose worst outcome you could buy back later, you will place a disproportionately high value on the option if it reduces a small probability of loss to zero, due to the discontinuity in your weighting function at certainty, but you will value it less if it merely reduces the magnitude of the loss without eliminating the risk.

  The principle cannot keep Verdict 5, where you prefer a single-stage 25 per cent chance over a two-stage 50 per cent of 50 per cent chance. This verdict violates the axiom of reduction of compound lotteries, which states that mathematically identical probabilities should be treated identically regardless of how many stages of chance separate you from the outcome. Your suspicion that a second idea was smuggled in is correct; that second idea is an aversion to compound uncertainty or complexity, which conflicts with the probabilistic consistency required by the first principle.

  You should give up the verdict, not the principle. While your first four verdicts describe stable and widely observed human risk preferences that can be modelled coherently within Prospect Theory, the fifth verdict is a cognitive error that leaves you open to Dutch books—sets of bets that guarantee a loss regardless of the outcome. To maintain internal consistency without abandoning your descriptive insights into risk, you must accept that a 25 per cent chance is identical whether it arrives in one stage or two.
