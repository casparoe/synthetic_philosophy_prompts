prompt: |-
  I'm a backend engineer at a mid-size consumer app company and I've somehow ended up chairing our little "feature ethics" review, which basically means whenever product or growth wants to ship something sketchy, I'm the one who has to say yes or no on the spot. I don't have any philosophy training, but a while back I read about Kant's universalizability test -- the thing where you ask whether everyone could act on the rule you're acting on, and apparently there's a second version about treating people as ends rather than just means. I want to actually use this instead of vibing it. Can you turn it into a procedure I can run in like fifteen minutes on a feature proposal: the questions to ask in order, what counts as a good enough answer to each, where the test flat-out gives a no, and where it just can't decide and I have to kick it to a human as a values call rather than a logic call. The thing I'm worried about is that the same feature can be described a bunch of different ways and the answer seems to flip depending on how I phrase the rule, so please deal with that head-on -- tell me how to pick the description and when I'm just cheating by picking a nice one. Then run it on three real-ish proposals from our backlog: making the unsubscribe flow deliberately annoying, adding always-on location sharing so we can power a "nearby friends" feed, and a rule I'd actually kind of like -- that we never hand over any user data to law enforcement even when there's a credible threat -- because I suspect the test is going to tell me something I don't want to hear on that last one. Be honest about where this breaks down and what it can't do, since I'll be defending the process to a room of PMs who think it's all made up anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer at a mid-size consumer app company.
      *   **Role:** Chairing a "feature ethics" review (ad-hoc, likely high pressure).
      *   **Goal:** Wants a practical, 15-minute procedure based on Kantian ethics (Universalizability + Humanity Formula) to evaluate feature proposals.
      *   **Specific Concerns:**
          *   How to phrase the "maxim" (rule) without cheating/gaming the system.
          *   Needs clear pass/fail/escalate criteria.
          *   Needs to run the procedure on three specific cases:
              1.  Annoying unsubscribe flow (Dark Pattern).
              2.  Always-on location for "nearby friends" (Privacy/Safety).
              3.  No user data to law enforcement even with credible threats (Principled Stand vs. Harm).
      *   **Tone:** Pragmatic, honest, slightly cynical (aware of PM pressure), rigorous but accessible (no philosophy jargon without explanation).
      *   **Constraint:** 15-minute procedure.

  2.  **Deconstruct Kant for Engineering:**
      *   *Categorical Imperative 1 (Universal Law):* "Act only according to that maxim whereby you can at the same time will that it should become a universal law."
          *   *Translation:* What if *every* app did this? Would the ecosystem collapse? Would trust evaporate?
      *   *Categorical Imperative 2 (Humanity as End):* "Act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means to an end, but always at the same time as an end."
          *   *Translation:* Are we manipulating users? Are we using their data/attention solely for our growth metrics without their informed consent or benefit?
      *   *The "Maxim Problem":* The user correctly identifies the biggest weakness in amateur Kantianism: framing the rule too narrowly ("Is it okay for *my* app to hide unsubscribe buttons to boost retention?") vs. too broadly ("Is it okay to lie?").
      *   *Solution:* The "Relevant Description" test. Focus on the *intent* and the *mechanism*, not the specific company name.

  3.  **Drafting the Procedure (The "15-Minute Kantian Audit"):**
      *   *Step 1: Define the Maxim (5 mins).* Needs to be specific enough to be actionable but general enough to be universal.
      *   *Step 2: The Universalizability Test (5 mins).* The "World of Everyone" thought experiment.
      *   *Step 3: The Humanity Test (5 mins).* Consent, manipulation, and value exchange.
      *   *Decision Matrix:* Pass, Fail, Escalate.

  4.  **Addressing the "Maxim Framing" Cheat:**
      *   This is crucial. If I say "Is it okay for [Company X] to do [Y]?", the answer is always yes.
      *   If I say "Is it okay to deceive users?", the answer is always no.
      *   *Guideline:* Describe the *action* and the *purpose* without referencing specific company constraints unless they are universal (e.g., "to prevent fraud" vs. "to hit Q3 OKRs").
      *   *The "Competitor Test":* Would you be okay if your direct competitor did this exact same thing to your users?

  5.  **Running the Three Cases:**

      *   *Case 1: Annoying Unsubscribe.*
          *   Maxim: "Hide cancellation paths to reduce churn."
          *   Universal: If all apps did this, trust in digital subscriptions collapses.
          *   Humanity: Treats user as a wallet, not a person. Removes agency.
          *   Verdict: Hard No.

      *   *Case 2: Always-on Location for "Nearby Friends".*
          *   Maxim: "Collect continuous location data by default to enable social features."
          *   Universal: If all apps did this, surveillance becomes normal, battery life dies, safety risks increase (stalkers).
          *   Humanity: Is consent informed? "Always-on" usually implies opt-out or buried opt-in.
          *   Nuance: If it's opt-in and clear, it might pass. If it's default-on, it fails.
          *   Verdict: Conditional No (unless strict opt-in).

      *   *Case 3: No Data to Law Enforcement (Even with threats).*
          *   Maxim: "Never cooperate with law enforcement, regardless of threat level."
          *   Universal: If all companies did this, law enforcement loses a tool for preventing harm (kidnapping, terrorism).
          *   Humanity: Treating potential victims as means to the company's "privacy purity" end? Or treating users as ends by protecting their rights?
          *   Kantian Conflict: Duty to law/truth vs. Duty to protect autonomy.
          *   *Crucial Kantian Insight:* Kant isn't a utilitarian. He cares about *duty*. But lying (or withholding truth) is generally problematic *unless* it violates a higher duty. However, the "Humanity" test suggests protecting users from state overreach is good. But the "Universal" test suggests a world where no one helps stop crimes is contradictory to a safe society.
          *   *Honest Take:* This is where Kant struggles. It's a clash of duties. This needs escalation. It's a values call, not a logic call.

  6.  **Addressing Limitations (Defending to PMs):**
      *   Kant doesn't handle trade-offs well (Utilitarianism does).
      *   It doesn't account for consequences (e.g., saving a life vs. privacy).
      *   It's a "Sanity Check," not a "Math Proof."
      *   It protects the *brand* and *long-term trust* (which PMs care about).

  7.  **Refining the Tone:**
      *   Keep it engineering-focused. Use terms like "edge cases," "race conditions," "systemic risk."
      *   Acknowledge the awkwardness of the role.
      *   Be direct about the "No Data to LE" case—it's the trap.

  8.  **Self-Correction/Review during drafting:**
      *   *Correction:* Initially, I might say the LE case is a "No." But actually, a strict Kantian might argue you have a duty to the moral law (justice) vs. the company policy. But from a *company policy* perspective, universalizing "No cooperation" creates a lawless digital zone. I need to make sure I don't give a definitive "Yes/No" on the LE case, but rather highlight it as the "Escalate" bucket.
      *   *Correction on Maxim Framing:* Make sure to emphasize the "Relevant Description" protocol. The user specifically worried about this.
      *   *Time Check:* Ensure the steps feel doable in 15 mins. Keep questions punchy.

  9.  **Final Polish:** Organize with clear headers. Add a "Cheat Sheet" summary. Ensure the "Where it Breaks" section is robust enough for the user to defend themselves in the meeting.

  **(Self-Correction Note on the LE Case):** I need to be careful here. Kant is often interpreted as absolutist about truth-telling. However, in a modern context, "cooperation with LE" isn't exactly "truth-telling" in the pure sense; it's legal compliance. A Kantian argument *for* privacy is that users entered a contract of confidentiality. Breaking that treats them as means. A Kantian argument *against* is that allowing harm to others violates the duty to humanity. This is genuinely undecidable by pure logic. I must emphasize the "Escalate" outcome here.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a brave move. Most companies treat ethics as a PR cleanup task; trying to bake it into the design review is rare. You are right to be worried about the "framing problem" (the Maxim problem). That is the single biggest way people game Kantian ethics. If you frame the rule as "Is it okay for *my* startup to do X to hit *my* OKRs?", the answer is always yes. If you frame it as "Is it okay to lie?", the answer is always no.

  Here is a 15-minute procedure designed for an engineering context, followed by the three case studies and a defense strategy for your PMs.

  ---

  ### The 15-Minute Kantian Audit Procedure

  **Goal:** Determine if a feature violates the Categorical Imperative.
  **Inputs:** Feature spec, intended metric impact, user flow diagrams.
  **Output:** Green Light, Red Light, or Escalate (Values Call).

  #### Step 1: The Maxim Formulation (5 Minutes)
  *The Trap:* Describing the action too specifically (cheating) or too broadly (useless).
  *The Fix:* The "Competitor & Context" Rule.

  Write down the rule governing this feature. It must meet three criteria:
  1.  **No Proper Nouns:** Remove your company name, your specific user base, or your specific Q3 goals.
  2.  **Include the Intent:** State *why* you are doing it (e.g., "to increase retention," "to ensure safety").
  3.  **The Competitor Test:** Would you accept this rule if your direct competitor applied it to *your* users?

  *Bad Maxim:* "Allow [App Name] to hide the unsubscribe button to hit 95% retention."
  *Good Maxim:* "Reduce friction for sign-ups while increasing friction for cancellation to maintain subscription revenue."

  #### Step 2: The Universalizability Test (5 Minutes)
  *The Question:* "What if every app shipped this?"

  Imagine a world where **every** consumer app adopts the Maxim you wrote in Step 1 as a standard industry practice.
  *   **Systemic Collapse:** Does the ecosystem break? (e.g., If everyone hides unsubscribe buttons, do people stop trusting digital subscriptions entirely?)
  *   **Contradiction:** Does the action defeat its own purpose when universalized? (e.g., If everyone spams push notifications, no one reads push notifications, so the channel becomes useless.)

  *Pass:* The world is annoying, but functional.
  *Fail:* The world becomes untrustworthy, broken, or the mechanism ceases to work.

  #### Step 3: The Humanity Formula Test (5 Minutes)
  *The Question:* "Are we using the user as a tool?"

  Kant says you cannot treat people *merely* as a means to an end. They must be co-participants.
  *   **Informed Consent:** Does the user know this is happening? Is the consent buried, dark-patterned, or assumed?
  *   **Agency:** Can the user opt out without disproportionate cost?
  *   **Value Exchange:** Is the user getting value commensurate with what they are giving (data, attention, risk), or are they purely fuel for your metric?

  *Pass:* User is informed, has agency, and receives value.
  *Fail:* User is manipulated, trapped, or exposed to risk they didn't agree to for a benefit they don't receive.

  ---

  ### Decision Matrix

  | Result | Action |
  | :--- | :--- | **Green Light** | Passes Universalizability + Humanity. Ship it. |
  | **Red Light** | Fails either test. The logic forbids it. Kill it. |
  | **Escalate** | Passes logic, but creates a conflict of duties (e.g., Safety vs. Privacy). This is a **Values Call**, not an ethics logic call. Kick to leadership/legal. |

  ---

  ### Running the Backlog

  Here is how the audit runs on your three proposals.

  #### Case 1: The "Annoying Unsubscribe" Flow
  *Proposal:* Make the cancellation path 5 clicks instead of 1, hide it in settings, require a phone call for premium tiers.
  *Goal:* Reduce churn by 15%.

  1.  **Maxim:** "Increase friction in the cancellation process relative to the sign-up process to protect revenue."
  2.  **Universalizability:** If *every* app did this, the concept of a "subscription" becomes a trap. Trust in digital commerce collapses. Users stop signing up for anything because the "exit cost" is unknown. The mechanism (subscriptions) relies on trust; universalizing this destroys that trust. **FAIL.**
  3.  **Humanity:** The user is being treated as a recurring revenue stream (a means), not an autonomous agent. By obscuring the exit, you are removing their agency to end a contract. **FAIL.**
  4.  **Verdict:** **Red Light.** This is a hard no. It treats users as wallets, not people, and destroys the ecosystem trust required for your business model to exist long-term.

  #### Case 2: Always-On Location for "Nearby Friends"
  *Proposal:* Default toggle to "ON" for continuous location sharing to power a live feed of friends nearby.
  *Goal:* Increase DAU and engagement time.

  1.  **Maxim:** "Collect continuous precise location data by default to enable social proximity features."
  2.  **Universalizability:** If *every* app did this (food delivery, dating, games, social), battery life becomes untenable, and surveillance becomes the default state of digital life. Stalking risks skyrocket. The "signal" of location data becomes noise because everyone is always everywhere. **Borderline Fail.** (It creates a high-risk environment).
  3.  **Humanity:** This is the killer. "Default ON" means the user is not actively consenting; they are passively allowing. If they don't know how to turn it off, they are being used as data points for the feed without informed agreement. They are a means to generate content for *other* users. **FAIL.**
  4.  **Verdict:** **Red Light (with a path to Green).**
      *   *Fix:* Change the Maxim to "Collect continuous location data **upon explicit, granular opt-in**."
      *   If you make it opt-in with clear warnings ("Friends will see you even when app is closed"), it passes Humanity (Agency restored). It might still strain Universalizability (battery/privacy norms), but it becomes defensible. As proposed (default-on)? It's a no.

  #### Case 3: The "No Law Enforcement" Policy
  *Proposal:* A hard technical rule: We encrypt data such that *we* cannot access it, and we refuse to build backdoors or hand over metadata, even in cases of credible threat (kidnapping, terrorism).
  *Goal:* Absolute user privacy and brand differentiation.

  1.  **Maxim:** "Never cooperate with law enforcement requests for user data, regardless of the severity of the threat or legal warrant."
  2.  **Universalizability:** If *every* company did this, law enforcement loses a critical tool for preventing physical harm. A world where digital spaces are total sanctuaries for bad actors contradicts the duty to maintain a safe society. However, a world where companies *always* cooperate creates a surveillance state. This is a contradiction of duties (Safety vs. Liberty). **UNDECIDABLE.**
  3.  **Humanity:**
      *   *Argument For:* You are treating your users as Ends by protecting their autonomy and rights against state overreach. You are honoring the contract of privacy.
      *   *Argument Against:* By refusing to help, you might be treating a potential *victim* (of a crime facilitated by your app) as a mere means to your company's "privacy purity" end. You are prioritizing your policy over their safety.
  4.  **Verdict:** **Escalate (Values Call).**
      *   *Why:* Kantian logic breaks here because you have two conflicting duties: Duty to User Privacy vs. Duty to Prevent Harm. Logic cannot solve this; only your company's risk appetite and moral stance can.
      *   *Warning:* Do not try to claim this is an "Ethical Yes." It is a **Strategic Yes**. You are choosing a side in a political conflict. Own that.

  ---

  ### Defending the Process to the PMs

  Your PMs will say this is "made up" or "slows us down." Here is your defense script.

  **1. On "Made Up Logic":**
  > "This isn't philosophy; it's **Systemic Risk Modeling**. The Universalizability Test is just stress-testing for the market ecosystem. If we ship features that only work because *we* are the only ones doing them, we are building on fragile ground. If everyone copies us, does the market break? If yes, we shouldn't do it."

  **2. On "Slowing Down":**
  > "This takes 15 minutes. A PR scandal, a class-action lawsuit, or an App Store ban takes 15 months. This is a lint check for reputation."

  **3. On the "Framing Cheat" (Your specific worry):**
  > "I know we can game the questions. That's why we use the **Competitor Test**. If you can't look me in the eye and say you'd be happy if [Competitor X] did this exact flow to your mom, the Maxim is framed wrong, or the feature is shady."

  **4. Where This Breaks (Be Honest):**
  > "This framework is great at spotting **exploitation** (Dark Patterns, Privacy violations). It is bad at **trade-offs**. It cannot tell us if 'Safety' is more important than 'Privacy.' When the test says 'Escalate,' that means the engineers and PMs can't decide this on logic alone. We need the CEO or Legal to pick the company's soul. I'm not paid to pick the soul; I'm paid to make sure the code doesn't rot it."

  ### Summary for your Cheat Sheet

  *   **Universalizability:** "What if everyone did this?" (Checks for systemic trust collapse).
  *   **Humanity:** "Are they a user or a resource?" (Checks for manipulation/consent).
  *   **Maxim Framing:** "Would I accept this from a competitor?" (Prevents cheating).
  *   **Red Light:** Fails either test.
  *   **Escalate:** Conflicting duties (e.g., Privacy vs. Safety).

  Use this. It won't solve every problem, but it will stop you from shipping the stuff that keeps you up at night.
