answer: |-
  # Karma & Moral Desert: Diagnostic Decision Tree

  **Q1. Mechanism:** When a bad action leads to suffering, is that suffering caused by the action itself (like touching fire burns you) or assigned by a system/entity (like a judge sentencing a criminal)?
  *   **Intrinsic:** Go to Q2.
  *   **External:** Go to Q3.

  **Q2. Identity (Intrinsic Path):** If the person suffering is psychologically different from the actor (e.g., years later or a new life), do they personally *deserve* that suffering, or is it just a causal consequence happening to a successor?
  *   **Personal Desert (Persisting Self):** Go to Q4.
  *   **Causal Consequence (Stream):** Go to Q5.

  **Q3. Identity (External Path):** Does the assigning entity track individual souls strictly, or can it assign guilt to a group (family, nation)?
  *   **Individual:** Go to Q6.
  *   **Collective:** Go to Q7.

  **Q4. Rebirth (Self Path):** Does this system require you to be born again in a new physical body to work?
  *   **Yes (Literal):** Go to Q8.
  *   **No (This Life/Metaphor):** Go to Q9.

  **Q5. Interruptibility (Stream Path):** Can sincere repentance, ritual, or insight stop a karmic result that is already "ripe"?
  *   **Yes (Interruptible):** Go to Q10.
  *   **No (Exceptionless):** *Leaf A (Naturalist Fatalism)*

  **Q6. Normativity (External/Individual):** When karma pays out, is it because the suffering *matches* the deed (fittingness) or because the agent has a *claim* to that outcome (entitlement)?
  *   **Fittingness:** *Leaf B (Cosmic Balance)*
  *   **Entitlement:** *Leaf C (Divine Ledger)*

  **Q7. Function (Collective):** Is the main point of karma to explain why bad things happen to the group, or to encourage good behavior in society?
  *   **Explain:** *Leaf D (Structural Determinism)*
  *   **Encourage:** *Leaf E (Social Cohesion)*

  **Q8. Proportionality (Self/Literal):** Must the suffering match the severity of the act exactly (strict), or is rough justice enough?
  *   **Strict:** *Leaf F (Jain-style Realism)*
  *   **Rough:** *Leaf G (Theistic Hybrid)*

  **Q9. Rebirth Nuance (Self/No Literal):** If not literal rebirth, is "rebirth" a useful metaphor for psychological change, or is the concept of rebirth irrelevant?
  *   **Metaphor:** *Leaf H (Psychological Karma)*
  *   **Irrelevant:** *Leaf I (Secular Ethics)*

  **Q10. Function (Stream/Interruptible):** Is the main point of karma to help you escape suffering entirely, or to explain why you are suffering now?
  *   **Escape:** *Leaf J (Orthodox Soteriology)*
  *   **Explain:** *Leaf K (Therapeutic Naturalism)*

  ***

  # Leaves & Positions

  **Leaf A: Naturalist Fatalism**
  *   **Position:** Intrinsic Mechanism + Causal Stream + Exceptionless.
  *   **Awkward Commitment:** You suffer for deeds you don't remember doing, but no one is actually punishing you.

  **Leaf B: Cosmic Balance**
  *   **Position:** External Mechanism + Individual + Fittingness.
  *   **Awkward Commitment:** A cosmic judge exists but acts only to restore aesthetic symmetry, not to enforce laws.

  **Leaf C: Divine Ledger**
  *   **Position:** External Mechanism + Individual + Entitlement.
  *   **Awkward Commitment:** The universe owes you a specific payout for your good deeds like a debt collector.

  **Leaf D: Structural Determinism**
  *   **Position:** External Mechanism + Collective + Explanatory.
  *   **Awkward Commitment:** You suffer for your nation's sins even if you opposed them personally.

  **Leaf E: Social Cohesion**
  *   **Position:** External Mechanism + Collective + Social Function.
  *   **Awkward Commitment:** Karma is technically false but necessary to keep people from stealing.

  **Leaf F: Jain-style Realism**
  *   **Position:** Intrinsic Mechanism + Persisting Self + Literal Rebirth + Strict Proportionality.
  *   **Awkward Commitment:** Every single micro-action must be tracked and repaid exactly, forever.

  **Leaf G: Theistic Hybrid**
  *   **Position:** Intrinsic Mechanism + Persisting Self + Literal Rebirth + Rough Proportionality.
  *   **Awkward Commitment:** Actions cause results naturally, but the scale is vague enough to require faith in fairness.

  **Leaf H: Psychological Karma**
  *   **Position:** Intrinsic Mechanism + Persisting Self + Metaphorical Rebirth.
  *   **Awkward Commitment:** You are literally reborn every moment, but only metaphorically dead tomorrow.

  **Leaf I: Secular Ethics**
  *   **Position:** Intrinsic Mechanism + Persisting Self + Irrelevant Rebirth.
  *   **Awkward Commitment:** Karma is just cause-and-effect, but we keep the spiritual vocabulary for tradition.

  **Leaf J: Orthodox Soteriology**
  *   **Position:** Intrinsic Mechanism + Causal Stream + Interruptible + Escape Function.
  *   **Awkward Commitment:** You must work hard to escape a system that says there is no "you" to escape.

  **Leaf K: Therapeutic Naturalism**
  *   **Position:** Intrinsic Mechanism + Causal Stream + Interruptible + Explanatory Function.
  *   **Awkward Commitment:** Understanding causality stops suffering, but the suffering was never personally yours to begin with.

  ***

  # Notes & Diagnostics

  **Empty/Unstable Combinations:**
  1.  **Strict Proportionality + No Persisting Self + Literal Rebirth:** Flagged as **Incoherent**. If there is no self to own the deed, strict mathematical repayment to a "successor" looks like punishing a different person, violating the desert condition. (Avoided in tree: Q2 filters this before Q8).
  2.  **External Mechanism + Intrinsic Mechanism:** Flagged as **Incoherent**. Q1 forces a choice; a process cannot be both purely natural law and purely administrative assignment.
  3.  **Collective Karma + Strict Individual Desert:** Flagged as **Unattractive**. Q3 separates Collective from Individual early; mixing them creates a "guilt by association" model that undergrads usually reject as unjust.

  **Indistinguishable Leaves:**
  1.  **Leaf H (Psychological Karma) vs. Leaf I (Secular Ethics):** The tree separates them by Q9 (Metaphor vs. Irrelevant), but in practice, both result in this-life ethics without literal rebirth. The distinction is purely semantic regarding whether "rebirth" is a useful teaching tool.
  2.  **Leaf J (Orthodox Soteriology) vs. Leaf K (Therapeutic Naturalism):** Both rely on Intrinsic/Stream/Interruptible. The split at Q10 (Escape vs. Explain) is often blurry in practice, as explaining suffering is often the means to escaping it.

  **Unused/merged Distinctions:**
  *   **Function (Explanatory/Soteriological/Social):** Used in Q7, Q8, Q10.
  *   **Rebirth (Literal/Metaphorical/Irrelevant):** Used in Q4 and Q9.
  *   **Proportionality:** Used in Q8.
  *   **Normativity:** Used in Q6.
  *   **Interruptibility:** Used in Q5.
  *   **Identity:** Used in Q2, Q3.
  *   **Mechanism:** Used in Q1.
  *   **Scope:** Used in Q3.
