      *   *The Core Tension:* If $X$ is bad (e.g., harm), why is it forbidden to do one $X$ to prevent five $X$s? If the goal is to minimize $X$, deontology seems self-defeating.
      *   *The Philosophical Challenge:* A good resolution must explain why the *agent's relationship* to the act matters, or why the *structure* of the value matters, without just saying "because rules." It needs to explain why the constraint isn't irrational or fetishistic.

  3.  **Evaluate the 5 Specifications:**

      *   **1. Lexicographic Firewall:**
          *   *Idea:* Hard priority. No trade-offs. Waiver only.
          *   *Analysis:* This is the classic "absolutist" deontology (Kantian-ish). It doesn't really *resolve* the paradox; it embraces it. It says "Minimizing harm isn't the point; respecting agency is." But the prompt asks why the constraint blocks harm minimization if the point is protecting from harm. This spec essentially says "The point isn't protecting from harm, it's protecting from *violation*."
          *   *Critique:* It restates the constraint rather than resolving the tension. It creates a "moral fetishism" problem where the system lets 5 die to save 1 from being *actively* killed.
          *   *Tier:* Low. It's rigid and doesn't explain the *why* regarding the paradox, just asserts the priority.

      *   **2. Commitment Device under Opacity:**
          *   *Idea:* Rule consequentialism disguised as deontology. We follow the rule because we can't trust our calculations in the moment.
          *   *Analysis:* This is an *epistemic/decision-theoretic workaround*. It admits that minimizing harm *is* the goal, but says we use deontology as a heuristic because we are fallible.
          *   *Critique:* The prompt explicitly asks to distinguish normative resolutions from decision-theoretic workarounds. This *is* a workaround. It dissolves the deontology into consequentialism. It doesn't resolve the normative paradox; it denies the deontological premise.
          *   *Tier:* Low/Mid. Useful for engineering, but philosophically it surrenders the deontological claim.

      *   **3. Agent-Relative Boundary:**
          *   *Idea:* Distinction between *doing* and *allowing*. I am responsible for my actions, not the state of the world.
          *   *Analysis:* This addresses the *agency* aspect. The point of the constraint isn't to minimize global harm, but to keep the *agent's hands clean*. It resolves the paradox by redefining the goal: the goal is integrity of the agent, not optimization of the outcome.
          *   *Critique:* Strong normative resolution. However, it leads to the "clean hands, bloody world" objection. It resolves the logical tension by shifting the locus of value from outcome to action.
          *   *Tier:* High. It directly addresses the agent-relative nature of the paradox.

      *   **4. Incommensurability Stop:**
          *   *Idea:* You can't compare the values. Rights aren't quantities.
          *   *Analysis:* This attacks the math of the paradox. The paradox assumes harm is a single currency. This says "Rights and Harms are different categories."
          *   *Critique:* Strong philosophical move (Elizabeth Anderson style). It explains *why* aggregation fails. However, in software, "incommensurable" often looks like "error" or "arbitrary." It resolves the paradox by denying the premise that trade-offs are possible.
          *   *Tier:* High. It offers a structural reason for the constraint.

      *   **5. Rightsholder-Controlled Override:**
          *   *Idea:* Rights belong to individuals. Only they can trade them. No aggregation across persons.
          *   *Analysis:* This grounds the constraint in *authority* and *sovereignty*. The paradox assumes the system owns the harm. This says the individual owns the harm.
          *   *Critique:* This is the most robust *political/normative* resolution. It explains why the system can't minimize harm: it doesn't own the harm to trade it. It respects the separateness of persons (Rawls/Nozick).
