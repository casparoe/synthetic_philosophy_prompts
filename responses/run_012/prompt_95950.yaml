      *   *Final Polish on Materials:* Need 24 cards (12 sets of 2 types). Envelopes. Chips. Whiteboard.
      *   *Timing:* 90 mins is tight. Keep instructions crisp.

      *   *Failure Mode:* "I'm not a copy."
      *   *Response:* "Treat the card as your epistemic access to the world."
      *   *Failure Mode:* "Payoff rule decided it."
      *   *Response:* "Valid point. We will discuss how decision rules constrain epistemic claims in the debrief."

      *   *Epistemic Honesty:* I need to explicitly state that SIA is not the consensus. Many reject it *because* of the Presumptuous Philosopher.

      *   *Let's write.*
answer: |-
  ## Part 1: Brainstorming & Selection

  Here are three candidate mechanics. I have rejected two to arrive at the design in Part 2.

  **Candidate 1: The Doomsday Urn**
  *   **Mechanic:** Two urns. Urn A has 10 balls. Urn B has 10,000 balls. A ball is drawn at random; it is #7. Participants bet on which Urn was chosen.
  *   **Why Rejected:** This is the classic "Doomsday Argument" setup (SSA-driven). It demonstrates how finding yourself "early" in a sequence suggests a smaller total population. However, it fails your second constraint: it does not naturally generate the **Self-Indication Assumption (SIA)** or the **Presumptuous Philosopher** problem. In this setup, SIA would cancel out the SSA effect entirely (the likelihood of drawing #7 is low in B, but the likelihood of *existing to draw* is high in B). It creates a stalemate rather than a felt tension between the two assumptions. It also feels like a standard probability puzzle rather than an anthropic one.

  **Candidate 2: The Quantum Split**
  *   **Mechanic:** Participants are told a quantum event occurs. Branch 1: 1 observer exists. Branch 2: 12 observers exist. Participants are asked to assign credence to being in Branch 2.
  *   **Why Rejected:** This is too abstract. It relies on the participants accepting a Many-Worlds interpretation or a similar metaphysical claim to make the "copies" feel real. It violates your constraint that the "payoff structure, not narration, does the work." Without a physical mechanism (like envelopes or cards) determining who gets paid, the "multiplicity" feels like a story I am telling, not a rule they are navigating.

  **Candidate 3: The Replicator Room (Selected)**
  *   **Mechanic:** A coin flip determines whether the "machine" activates 1 participant (Heads) or 12 participants (Tails). Activation is simulated via envelopes designating "Active" vs. "Inactive" status. Only "Active" participants can win chips.
  *   **Why Chosen:** It physically instantiates the reference class. In Act 1, participants experience the *post-selection* uncertainty (SSA vs. SIA tension). In Act 2, they must bet *pre-selection*, which forces the Presumptuous Philosopher move (betting on the world with more observers simply to ensure existence/payoff). It uses the group size (12) as a variable, making the "copy" mechanic tangible without requiring actual duplication.

  ---

  ## Part 2: Activity Design — "The Replicator Room"

  **Time:** 90 Minutes
  **Participants:** 12
  **Materials:**
  *   1 Coin (facilitator only).
  *   24 Index Cards: 12 marked "ACTIVE", 12 marked "INACTIVE".
  *   12 Opaque Envelopes.
  *   Poker Chips (approx. 50 per participant).
  *   Whiteboard & Markers.
  *   Score Sheet (facilitator only).

  ### Epistemic Formulations (For Facilitator Use)
  *   **Self-Sampling Assumption (SSA):** Reason as if you are a random sample from the set of *actually existing* observers in your reference class. (Focus: *Given* I exist, where am I?)
  *   **Self-Indication Assumption (SIA):** Reason as if you are a random sample from the set of *all possible* observers, weighted by the probability of their existence. (Focus: The fact that I exist is evidence that the world contains many observers.)
  *   **Presumptuous Philosopher:** The consequence of SIA where one infers a large world size *a priori*, seemingly without empirical evidence.
  *   **Note on Ambiguity:** "SIA" is sometimes defined as a prior adjustment and sometimes as a likelihood update. In this activity, we treat it as a prior adjustment: *Worlds with more observers are intrinsically more likely to contain me.*

  ### Run Sheet

  #### 00:00 – 00:10: Setup & Framing
  *   **Action:** Arrange chairs in a circle. Place a bag of chips in the center.
  *   **Script:** "We are testing a decision machine. I will flip a coin. The coin determines how many of you are 'Active Agents' for this session.
      *   **Heads:** The machine selects **1** of you to be Active. The other 11 are Inactive.
      *   **Tails:** The machine selects **12** of you to be Active. Everyone is Active.
      *   **Rule:** Only Active Agents can earn chips. If you are Inactive, you remain in the room, but your bets pay nothing. You will not know your status until you open your envelope."
  *   **Whiteboard:** Write the Payoff Rule: *Correct Bet + Active = +10 Chips. Incorrect OR Inactive = 0 Chips.*
  *   **Constraint Check:** This rule creates the "existence filter." It does not presuppose SSA or SIA, but it creates an instrumental incentive aligned with SIA in Act 2. I will flag this in the debrief.

  #### 00:10 – 00:35: Act I — The Copy Effect
  *   **Step 1 (Hidden):** Flip the coin. Do not reveal.
  *   **Step 2 (Prep):**
      *   If **Heads**: Put 1 "ACTIVE" card and 11 "INACTIVE" cards into the 12 envelopes. Shuffle.
      *   If **Tails**: Put 12 "ACTIVE" cards into the 12 envelopes.
  *   **Step 3 (Distribution):** Hand one envelope to each participant.
  *   **Step 4 (Reveal):** "Open your envelopes. Look at your card. Do not show others."
  *   **Step 5 (The Bet):** "If your card says INACTIVE, fold your arms. You cannot bet. If your card says ACTIVE, you must bet 5 chips on Heads or Tails."
  *   **Step 6 (Collection):** Collect bets from Active participants only.
  *   **Step 7 (Resolution):** Reveal the coin. Pay out chips to Active winners.
  *   **Step 8 (Silent Reflection):** Ask them to write down *why* they bet what they did on a scrap of paper. Do not discuss yet.

  #### 00:35 – 00:45: Interlude
  *   **Action:** Collect all cards and envelopes. Shuffle them back into the two stacks (12 Active, 12 Inactive).
  *   **Script:** "We reset the machine. We will run the protocol again, but with one change to the timing."

  #### 00:45 – 01:10: Act II — The Presumptuous Stake
  *   **Step 1 (Hidden):** Flip the coin. Do not reveal.
  *   **Step 2 (Prep):** Same as Act I (Heads = 1 Active/11 Inactive; Tails = 12 Active).
  *   **Step 3 (The Bet):** "Before you receive an envelope, you must all bet 5 chips on Heads or Tails."
  *   **Step 4 (Distribution):** Hand out envelopes.
  *   **Step 5 (Reveal):** Participants open envelopes.
  *   **Step 6 (Resolution):** Reveal coin. Pay out according to the rule (Inactive get 0 even if bet right).
  *   **Step 7 (Defense):** Select one participant who bet **Tails**. Ask them to stand and justify their bet to the room *without* referencing their envelope content (since they bet before opening).

  #### 01:10 – 01:25: Debrief & Mapping
  *   **Action:** Move to whiteboard. Draw two columns: **Act I** and **Act II**.
  *   **Mapping Act I (SSA vs. SIA):**
      *   Ask: "If you held an ACTIVE card, what odds did you give Heads?"
      *   **SSA Logic:** "There is 1 Active person in Heads, 12 in Tails. I am one Active person. Am I the 1 (Heads) or 1 of 12 (Tails)?" -> P(Heads) ≈ 1/2 (if reference class is 'me'). Or P(Heads) = 1/13 (if reference class is 'all active slots'). *Note: This is the friction point.*
      *   **SIA Logic:** "Tails creates 12 times as many Active agents. It is 12 times more likely that I would find myself as an Active agent in Tails." -> P(Tails) = 12/13.
      *   **Facilitator Note:** Point out that SSA users tend toward 50/50 (the coin is fair). SIA users tend toward 12/13 (the population is larger).
  *   **Mapping Act II (The Presumptuous Move):**
      *   Ask the defender: "Why bet Tails before knowing you were Active?"
      *   **The PP Argument:** "If Heads is true, there is only 1 Active slot. I am unlikely to be it. If Tails is true, I am guaranteed to be Active. Since I am here betting, Tails is more likely."
      *   **The Absurdity:** "Does this mean if we hypothesized a world with 1 trillion observers, you would bet that world is real *just* because you exist?"
  *   **Addressing the Leak:**
      *   **Statement:** "You may notice the Payoff Rule (Inactive = 0) pushed you to bet Tails in Act II to maximize chips. This is a design leak. In strict epistemology, truth shouldn't depend on payoff. However, this mirrors the real philosophical debate: SIA proponents argue this *is* rational; opponents argue it conflates 'likely to be true' with 'likely to profit'."

  #### 01:25 – 01:30: Closing Question
  *   **Script:** "Imagine we run Act II again, but this time **Tails** creates 1,000,000 Active copies, and **Heads** still creates 1. The coin is still fair. Do you bet Tails? If yes, are you claiming the universe is *actually* more likely to be the big one, or just that it's better to *act* as if it is?"

  ---

  ## Part 3: Failure Modes & Interventions

  **Failure Mode 1: "I'm not a copy. I'm me."**
  *   **Symptom:** A participant refuses to accept the "Inactive" status, arguing they exist regardless of the card.
  *   **Intervention:** "Treat the card not as your ontological existence, but as your **eligibility to score**. In the thought experiment, 'Inactive' means 'Not in the reference class of observers making this bet.' If you insist you exist outside the game, you are stepping outside the simulation. To play, you must accept the card defines your epistemic situation."

  **Failure Mode 2: "It's just Bayes."**
  *   **Symptom:** A mathematically confident participant reduces the problem to $P(H|E)$ and claims there is no paradox, just calculation.
  *   **Intervention:** "Agreed, it is Bayes. The disagreement is about the **Likelihood Term**. SSA says $P(Active|Heads) = 1/12$. SIA says $P(Active|Heads)$ is penalized because fewer observers exist. The math is the same; the inputs are the philosophical battle."

  **Failure Mode 3: "The Payout Rule Decided It."**
  *   **Symptom:** Participants argue Act II was trivial because Inactive people get 0 chips, so betting Tails is the only way to win.
  *   **Intervention:** **Acknowledge immediately.** "This is the most important critique of this activity. In decision theory, this is the difference between *epistemic* rationality (believing what is true) and *instrumental* rationality (doing what pays). The Presumptuous Philosopher argument is controversial precisely because it blurs this line. If you bet Tails only for the chips, you are not a Presumptuous Philosopher; you are a Pragmatist. The philosophical claim is stronger: that Tails is *truer*."

  ---

  ## Part 4: Limitations & Epistemic Honesty

  **What This Activity Cannot Reproduce:**
  1.  **The Reference Class Problem:** The activity defines the reference class for you ("Active Agents"). In real anthropic reasoning (e.g., Doomsday Argument), defining the reference class ("All humans?" "All conscious beings?") is the hardest part. I will have to supply this in words during the debrief.
  2.  **True Non-Existence:** Participants who draw "Inactive" still sit in the room. They feel their own existence. The simulation cannot make them cease to exist, only cease to *score*. I must explicitly state: "Imagine if 'Inactive' meant you literally were not there to ask this question."
  3.  **The "Why" of SIA:** The activity shows *that* SIA leads to Presumptuousness, but not *why* one might accept SIA (e.g., to avoid other paradoxes like the Adam & Eve problem). I will need to mention that SIA is often adopted to solve other puzzles, making the Presumptuous Philosopher a "cost" rather than a "refutation."

  **Epistemic Status of the Concepts:**
  *   **SSA vs. SIA:** Neither is the consensus. SSA is often associated with the Doomsday Argument (which many find implausible). SIA avoids Doomsday but incurs the Presumptuous Philosopher cost. This is a live trade-off, not a settled hierarchy.
  *   **Presumptuous Philosopher:** Often presented as a *reductio ad absurdum* of SIA (e.g., by Nick Bostrom). However, some "SIAists" accept the conclusion (we probably are in a large universe) or modify SIA to avoid it. Do not present PP as a definitive disproof; present it as the major cost of the SIA ticket.
  *   **Label Ambiguity:** "Self-Indication Assumption" is sometimes used to refer specifically to the prior adjustment ($P(World) \propto N_{observers}$) and sometimes to the resulting posterior. I am using the **prior adjustment** definition here.

  **Design Weakness to Flag:**
  *   **The Scoring Leak:** As noted in Failure Mode 3, the chip rule makes SIA the *instrumentally* dominant strategy in Act II. A careful critic will say this proves nothing about *belief*, only about *betting*. I must concede this: "This activity demonstrates the decision-theoretic pressure of SIA. Whether that pressure translates to genuine ontological credence is the philosophical question you must take away."

  ---

  ## Part 5: Closing Question (Diagnostic)

  **"If you bet Tails in Act II because 'more observers make my existence more likely,' would you still bet Tails if the chips were removed and you were simply asked to state the truth for a grade? If your answer changes, you are distinguishing between *belief* and *betting*. If your answer stays the same, you are accepting the Presumptuous Philosopher's claim that existence itself is evidence."**

  *(This question forces them to reveal whether they adopted SIA as an epistemic principle or merely as a winning strategy for the game.)*
