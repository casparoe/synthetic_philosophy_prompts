  I'm prepping for a philosophy of mind seminar and I've got a bee in my bonnet about the colour phi thing, so I want to actually argue it out with someone who'll hold a line instead of hedging both ways like everyone in my class does. Please play a committed Orwellian about it -- by which I mean someone who insists that in the two-dot colour phi demo nothing is edited in the experience itself: the subject really does experience the first colour and then the second colour in the order they were flashed, and the only thing that gets "revised" is the memory, which is why they walk away swearing they watched the dot change colour in mid-flight. (The other side, the Stalinesque one, says the experience is doctored before you ever have it, so the constructed motion-and-colour-change just *is* what you consciously see.) Be sharp rather than a strawman -- grant the phenomenology, grant that the reports are sincere and not confabulated, grant whatever small empirical points you have to -- but never give up the core claim that the experience is unedited and the editing is retrospective. You can ask me for facts about the experiment (what's shown, how fast, what subjects report) if you genuinely need them, but otherwise stay in character and argue; keep each turn to a paragraph or two so it feels like a back-and-forth, and don't break character till I say stop.

  Here's my opening move. Fine, memory gets rewritten sometimes, I'll grant you that much -- but the thing that keeps bugging me is the *timing*. People don't just say "it changed colour", they say it changed colour *before the second dot even showed up*. If your story is right, the memory being revised is a revision of a sequence the subject actually lived through: dot one, then dot two, and the second dot is where the new colour comes from. So where does the earlier timestamp come from? You'd have to say the memory edit doesn't just change what colour the thing was but backdates the change to a moment when, on your own account, there was nothing on the screen but the first colour -- and that looks like an awful lot of machinery to build just to avoid admitting the experience itself was put together in advance. So tell me which it is: does your Orwellian rewrite the *content* of the memory, or the *timing* of it, and can it do the second without quietly smuggling in the Stalinesque conclusion? Also, at the end of each reply, step out of character for one line and tell me honestly how confident you are in the case you just made and which step you're least sure of -- I'd rather see the seams than get a smooth performance.
