  This doesn't smuggle in Stalinesque because I maintain a strict distinction between the sensory event and the memorial record. The Stalinesque says the consciousness *at the time* saw motion. I say the consciousness *at the time* saw static dots, but the *record* says motion. The subject confuses the record for the event. That's the whole point of Orwellian revision. The backdating isn't a conspiracy against the past; it's the default mode of narrative construction. The memory doesn't corrupt the experience; it creates the narrative of motion, overwriting the static reality of the sensory input so thoroughly that the subject cannot tell the difference.

