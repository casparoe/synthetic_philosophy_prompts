answer: |-
  The notebook was heavy with dead words.

  Page forty-two: *Vael*. Definition: The grey water before rain.
  Page forty-three: *Vael*. Definition: The sound of a hull scraping stone.
  Page forty-four: *Vael*. Definition: The thing that takes your brother.

  I tapped the pen against the paper. The rhythm was wrong. It didn't match the slap of the tide against the pilings outside my window. I was trying to find the noun, the solid core, the thing that sat underneath all the variations like a stone beneath the sand. But every time I cornered Old Man Halden, the word slipped away like a wet fish.

  "What is *Vael*?" I had asked him yesterday, pointing at the horizon.

  Halden hadn't looked. He was mending a net, his fingers moving in a blur of knots that looked like language itself. "*Vael* is high," he said.

  "No, the word. What does it mean?"

  He held up a float, green and barnacled. "It holds," he said. Then he went back to the net.

  I was losing the shape of myself. When I closed my eyes, I didn't see faces; I saw syntax. The villagers spoke in a circle I couldn't enter. They didn't describe the world; they handled it. To them, a word wasn't a label you stuck on a thing. It was a tool you picked up. You didn't say *hammer* to describe the object; you said *hammer* when you were driving a nail. If you weren't driving, the word didn't exist.

  I wanted the essence. They only had the usage.

  The headache started behind my eyes, a tight band of static. I looked at my lists. *Vael-soft, Vael-hard, Vael-eating, Vael-sleeping.* There was no common thread. No single feature ran through all of them. One implied danger, another comfort, another indifference. They resembled each other only the way cousins do—same nose, different eyes; same walk, different height. I was looking for a soul in a crowd of relatives.

  "Come," Halden said this morning. He didn't knock. He just stood in the doorway, smelling of salt and diesel.

  "I'm working," I said, gesturing to the notebook. The pages were covered in cross-outs, a graveyard of definitions.

  "Work," he said. He pointed to the boat bobbing in the harbor. The *Marrow*.

  "I need to understand," I said. "If I don't know what *Vael* is, I can't translate the stories."

  Halden spat into the dust. "Stories are for winter. Today is for cod."

  I should have refused. I was a translator, not a deckhand. But the silence of the room was pressing against my ears, and the notebook felt like a lie. I followed him.

  The engine coughed to life. We moved out past the breakwater, into the open swell. The water here wasn't grey or blue; it was a shifting mass of oil and light. Halden handed me a rope.

  "Pull," he said.

  I pulled. The rope was rough, biting into my palms. The boat dipped. A wave crashed over the bow, cold and shocking.

  "Harder!" Halden shouted.

  I leaned back, digging my heels into the wet deck. My muscles burned. The rhythm took over. Heave. Wait. Heave. Wait. The boat groaned. The net was heavy, full of water and weight.

  Then, the moment came. The crest of a swell lifted us, and the boat hung suspended, poised to drop into the trough.

  Halden opened his mouth. He didn't shout a warning. He didn't shout a name.

  "*Vael!*"

  It wasn't a noun. It wasn't a label for the water surrounding us. It was a command. It was a timing. It was the exertion in my back and the salt on my lips and the knowledge that if we didn't pull now, the net would snap. It was the action of surviving the sea, not the name of it.

  I felt the word in my throat before I spoke it. It wasn't a thought. It was a breath.

  "*Vael!*" I shouted back.

  I pulled. The net came up. Silver fish thrashed on the deck, flopping like punctuation marks.

  We worked for an hour in silence, sorting the catch. My hands were blistered. My back was a knot of pain. When we turned back toward the harbor, the sun was breaking through the clouds. The water was calm now.

  I looked at the sea. I waited for the word to come, the definition to settle. I waited for the essence.

  It didn't come. There was no single word for the sea. There was only the pulling, the waiting, the drowning, the drinking.

  I took the notebook out of my pocket. The wind tried to tear the pages from my hand. I looked at page forty-two, forty-three, forty-four. I looked at the lists of definitions that tried to pin the ocean down like a specimen.

  I closed the book. I put it in my pocket.

  Halden looked at me. "You know it now?"

  "No," I said. I picked up a rope. "I know how to use it."

  He nodded, once. He turned the wheel toward the dock.

  "*Vael*," he said softly, not to the water, but to the engine, as he cut the throttle.

  "*Vael*," I said, and tied the knot.
