answer: |-
  ### 1. Exam Question

  **Graduate Seminar in Decision Theory: Final Examination (Take-Home)**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Instructions:** Answer the following essay question. You may not cite any literature, authors, or specific theories by name. Your grade depends entirely on the quality of your argumentation, not on your familiarity with the history of the debate.

  **Case:**
  Nadia's preferences over three bundles are strictly cyclic at every moment: she ranks A above B, B above C, and C above A. A trader makes her three offers on three consecutive days, each to be accepted or declined on the spot and never repeated: on Monday, B in exchange for the C she holds plus one pound; on Tuesday, A in exchange for her B plus one pound; on Wednesday, C in exchange for her A plus one pound. Nadia begins the week holding C, she cannot bind her future self in advance, and the three trades cannot be had as a single package.

  **Question:**
  Analyze the extent to which the trader can extract money from Nadia in each of the following three variants:
  (i) She is naive and does not foresee her later choices.
  (ii) She foresees them perfectly but decides each offer by comparing the two bundles then on the table.
  (iii) She foresees them perfectly and decides each offer by the final holding she would reach if she accepted it, given what she would go on to accept and decline.

  Based on this analysis, argue for a definite position on what these variants jointly show about the relation between intransitivity, exploitability, and diachronic rationality. Specifically, address whether the money pump demonstrates that cyclic preferences are irrational *simpliciter*, or only that they are irrational when combined with further premises about commitment or evaluation. Finally, determine whether variant (iii) should still be classified as a case of cyclic preference, justifying your answer.

  ***

  ### 2. Model Answer

  In variants (i) and (ii), the trader extracts three pounds. In variant (i), Nadia accepts Monday's trade expecting to keep B, not foreseeing that her future self will trade B for A and A for C. She ends with C minus three pounds. In variant (ii), Nadia foresees the future but evaluates choices myopically. On each day, she compares the current bundle plus cost against the new bundle. Since she prefers B to C, A to B, and C to A locally, she accepts each trade sequentially, again ending with C minus three pounds.

  In variant (iii), the trader extracts nothing. Nadia employs backward induction. On Wednesday, holding A, she prefers C to A and accepts the trade. On Tuesday, holding B, she anticipates that accepting leads to A, which leads to C minus two pounds total. She compares keeping B against ending with C minus two pounds. Assuming the one-pound cost is small relative to bundle differences, her cyclic ranking implies she prefers the path to C (via A) over keeping B locally, but crucially, on Monday, she compares keeping C against entering the cycle. Entering the cycle results in returning to C minus three pounds. Since she prefers C to C minus three pounds, she rejects the first offer. The pump is blocked.

  This analysis demonstrates that exploitability does not follow from cyclic preferences alone; it requires the conjunction of cyclic preferences and myopic choice (variant ii) or ignorance (variant i). Therefore, the money pump argument does not prove that cyclic preferences are irrational *simpliciter*. It proves that cyclic preferences are irrational for agents who evaluate choices myopically across time. Diachronic rationality requires that an agent's choice at time *t* accounts for the implications of that choice at *t+1*. When an agent satisfies this condition (variant iii), cyclic preferences over outcomes do not lead to sure loss.

  The normative implication is that the defect lies in the decision procedure, not necessarily the preference structure. If rationality requires immunity to exploitation, then rationality requires sophisticated choice (variant iii), not acyclic preferences. However, this raises the question of whether variant (iii) truly preserves cyclic preferences. In variant (iii), Nadia chooses the sequence "Stay at C" over the sequence "Cycle to C minus £3." Her choices over *plans* are acyclic, even if her rankings of *instantaneous bundles* remain cyclic.

  The strongest objection to this line is that preferences are defined by choice. If Nadia consistently chooses "Stay at C" in variant (iii), she reveals a preference for C over the cycle. Therefore, she does not actually hold cyclic preferences over the relevant objects of choice. To claim she retains cyclic preferences while blocking the pump is to equivocate on what is being preferred. If the objects of preference are final outcomes reached via plans, her preferences are acyclic. If the objects are instantaneous bundles, she is irrational for ignoring the diachronic context.

  This objection fails because it conflates the object of evaluation with the evaluation itself. Nadia can consistently rank instantaneous bundles cyclically (A>B>C>A) while ranking sequences acyclically (Stay>Cycle). This is not a contradiction but a recognition that value is path-dependent for a diachronic agent. The irrationality in variants (i) and (ii) is the failure to integrate instantaneous rankings into a coherent plan. Thus, cyclic preferences are not inherently irrational; they are only irrational when an agent fails to adopt a sophisticated decision rule that treats sequences as the primary unit of agency. Variant (iii) remains a case of cyclic preference over bundles, but it shows that rational agency operates over trajectories, not moments.

  ***

  ### 3. Marking Scheme

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Correctly analyzes Variants (i) and (ii):** Identifies that both naive and myopic agents complete the cycle and lose £3. | 4 | Confusing naive (no foresight) with myopic (foresight but local evaluation), or claiming one blocks the pump. |
  | **2** | **Correctly analyzes Variant (iii):** Identifies that the sophisticated agent anticipates the full loop and rejects the first trade, losing £0. | 4 | Claiming the sophisticated agent still gets pumped, or fails to explain *why* (backward induction). |
  | **3** | **Definite stance on irrationality:** Argues clearly that cyclic preferences are not irrational *simpliciter*, but only when paired with myopia/ignorance. | 4 | Hedging ("some say X, others say Y") or claiming cyclic preferences are always irrational regardless of choice procedure. |
  | **4** | **Analysis of Variant (iii) preference status:** Addresses whether (iii) counts as cyclic preference (e.g., bundles vs. sequences) and takes a stand. | 4 | Ignoring the second half of the prompt or asserting (iii) eliminates the cycle without justification. |
  | **5** | **Argumentative Cohesion & Constraints:** No literature citations; arguments flow logically from the case analysis to the normative conclusion. | 4 | Name-dropping (e.g., "Davidson," "Ramsey") or disconnected paragraphs that don't build a unified thesis. |
  | **Total** | | **20** | |

  ***

  ### 4. A vs B Distinction

  **A Answer:** Takes a sharp, defended philosophical stance on *why* variant (iii) blocks the pump (e.g., distinguishing objects of choice from evaluation methods) and integrates the mechanical analysis into a unified theory of diachronic rationality. It treats the objection seriously and refutes it using the case logic.

  **B Answer:** Correctly solves the mechanical aspects of variants (i)-(iii) but hedges on the normative implications (e.g., "this suggests preferences might be irrational") or treats variant (iii) as simply "changing preferences" without analyzing the structural implication for rationality theory.
