answer: |-
  Here is a decision tree designed for your Discord server. It uses the Marena timeline to force your friends to pick a lane based on *how* they judge power, not just *who* they like.

  ### The Marena Backsliding Diagnostic Tree

  Start at **Q1**. Answer honestly based on how you judge the situation, then follow the arrow.

  **Q1: The 2016 Election**
  The National Renewal Front (NRF) won 52% in 2016 in an election everyone agrees was fair.
  *Does "democratic backsliding" require a stolen or rigged election to count?*
  *   **YES:** → **Leaf A: The Ballot Box Purist**
  *   **NO:** (It can happen after a fair win) → Go to **Q2**

  **Q2: The Label**
  When people call the NRF's actions "backsliding," is that a useful neutral description of events, or is it just a political slur the opposition uses to delegitimize wins they don't like?
  *   **Just a slur/team label:** → **Leaf B: The Partisan Cynic**
  *   **Useful description:** → Go to **Q3**

  **Q3: The Rule of Law**
  In 2017–2020, the NRF changed the courts and media using *existing* laws. They didn't break the written rules.
  *If they followed the written law, does that make it "ordinary politics" rather than backsliding?*
  *   **YES:** (Law is law) → **Leaf C: The Proceduralist**
  *   **NO:** (Spirit matters more than letter) → Go to **Q4**

  **Q4: The Referee**
  Who gets to decide if backsliding is happening? Is it defined by official rulings (Constitutional Courts, EU/UN monitors), or is it something we decide by analyzing the outcome ourselves?
  *   **Official bodies/monitors:** → **Leaf D: The Institutional Deferer**
  *   **We decide by analysis:** → Go to **Q5**

  **Q5: The Engine**
  Focus on the NRF's actions (2017–2020). Is the core problem that they *intended* to lock themselves in power forever, or is the core problem that the *effect* weakened institutions (regardless of what they meant to do)?
  *   **It's about the INTENT:** → Go to **Q6**
  *   **It's about the EFFECT:** → Go to **Q7**

  **Q6: The Intent Mirror (2023)**
  In 2023, the new Opposition expands the courts and targets media owners. They *intend* to secure their own agenda to "fix" the damage.
  *Since their intent is also to lock in power (even for a "good" cause), is this also backsliding?*
  *   **YES:** (Entrenchment is entrenchment) → **Leaf E: The Moral Absolutist**
  *   **NO:** (Context matters; this is correction) → **Leaf F: The Contextual Intentionalist**

  **Q7: The Severity Check**
  Look at the *effects* of the NRF's actions (2017–2020). The courts and media were fundamentally altered.
  *Is the word "backsliding" accurate here, or is it too soft? (i.e., Should we just call it a coup, authoritarianism, or dictatorship?)*
  *   **Too soft:** (Call it what it is) → **Leaf G: The "Call It What It Is" Advocate**
  *   **Accurate:** → Go to **Q8**

  **Q8: The Effect Mirror (2023)**
  In 2023, the Opposition expands the courts. The *mechanical effect* is the same as 2017 (more loyal judges).
  *Since the institutional effect is identical, is this also backsliding?*
  *   **YES:** (Damage is damage) → **Leaf H: The Mechanical Effectivist**
  *   **NO:** (Direction matters; restoring health isn't the same as causing sickness) → **Leaf I: The Directional Effectivist**

  ***

  ### The Leaves (Where Your Friends End Up)

  *   **Leaf A: The Ballot Box Purist**
      *   **View:** Only broken elections count.
      *   **On Marena:** 2016 was fair, so nothing that followed counts as backsliding. If they want to remove the NRF, they must win an election, not complain about laws.
  *   **Leaf B: The Partisan Cynic**
      *   **View:** The whole word is a partisan label.
      *   **On Marena:** "Backsliding" is just what losers say when they can't win. Real question is "whose team are you on?"
  *   **Leaf C: The Proceduralist**
      *   **View:** It's just ordinary politics with a scary name.
      *   **On Marena:** If the legislation passed, it's legal. Winners write laws. 2023 Opposition doing the same thing proves it's just normal power cycling.
  *   **Leaf D: The Institutional Deferer**
      *   **View:** It's whatever the courts or international monitors say it is.
      *   **On Marena:** If the Venice Commission or a local court says it's fine, it's fine. If they say it's not, it's not. We don't get to vote on reality.
  *   **Leaf E: The Moral Absolutist**
      *   **View:** It's about the intent to entrench rather than the effects.
      *   **On Marena:** Both 2017 NRF and 2023 Opposition are guilty. Using state power to lock in your side is wrong, even if you think you're the "good guys."
  *   **Leaf F: The Contextual Intentionalist**
      *   **View:** It's about intent, but context defines intent.
      *   **On Marena:** 2017 was backsliding (intent to steal). 2023 was restoration (intent to fix). Same action, different soul.
  *   **Leaf G: The "Call It What It Is" Advocate**
      *   **View:** It's real but "backsliding" is too soft.
      *   **On Marena:** Don't sugarcoat it. If they captured the courts, call it an authoritarian takeover. "Backsliding" sounds like an accident; this was a heist.
  *   **Leaf H: The Mechanical Effectivist**
      *   **View:** It's about the effects regardless of intent.
      *   **On Marena:** 2017 weakened institutions. 2023 *also* weakened institutions (by expanding courts for loyalty). Both are bad. The machine is broken either way.
  *   **Leaf I: The Directional Effectivist**
      *   **View:** Rights and the rule of law count, but direction matters.
      *   **On Marena:** 2017 broke the rule of law. 2023 fixed it. Even if the tools looked similar, the *effect* on the health of the democracy was opposite.

  ***

  ### Meta-Analysis for the Admin (You)

  **1. Two Leaves This Tree Cannot Separate**
  *   **Leaf E (Moral Absolutist)** and **Leaf H (Mechanical Effectivist)**.
  *   **Why:** On the specific Marena cases, these two people will vote exactly the same way. They will both say 2017 was backsliding AND 2023 was backsliding. You cannot tell them apart by their verdict on the events, only by their *reasoning* (Intent vs. Effect). If your friends only argue about outcomes, these two will look identical.

  **2. The "Impossible Combo" (Incoherent View)**
  *   **The Combo:** Answering **Q2 ("It's just a slur")** but then answering **Q4 ("Listen to Monitors")**.
  *   **Why:** International monitors (EU, UN, OSCE) are the primary users of the term "democratic backsliding." If you believe the term is merely a partisan weapon (Q2), you logically cannot defer to the institutions that wield that weapon (Q4). Nobody in your server should hold this position; if they do, they haven't thought about who creates the reports they cite.

  **3. The "Unoccupied Seat" (Nobody Seems to Hold This)**
  *   **The Combo:** Answering **Q1 ("Yes, needs rigged election")** but then answering **Q3 ("No, law doesn't protect you")**.
  *   **Why:** This person believes backsliding *requires* election fraud, but also believes that following the law doesn't protect you from the label. This is logically unstable. If the election was fair (Marena 2016), and they followed the law (Marena 2017), this person has no metric left to call it backsliding. Usually, people who care about the "Spirit of the Law" (Q3-No) also care about "Fair Play" beyond just the vote count (Q1-No).

  **4. How to Use This**
  When the fight starts, don't ask "Who is right?" Ask "Which Question are we fighting on?"
  *   If one person says "But they won the election!" and the other says "But they packed the courts!", they are stuck at **Q1**.
  *   If one says "It was legal!" and the other says "It was corrupt!", they are stuck at **Q3**.
  *   If they agree 2017 was bad but fight about 2023, they are stuck at **Q6/Q8**.

  This stops them from shouting past each other and forces them to admit: *"I don't think 2023 counts because I care about Intent, you care about Effects."*
