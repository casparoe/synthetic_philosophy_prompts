answer: |-
  The coffee shop was quiet enough to think, which was dangerous for us. We'd been circling the same argument since Tuesday's seminar.

  "Let's try again," Priya said, setting her mug down. "You keep saying the assault isn't real because the avatar isn't a body. I'm saying the avatar is a body in the only sense that matters in that context. It's an institutional fact. Like money."

  "Money works because we all agree it has value, sure," I said. "But if I burn a twenty-dollar bill, I've destroyed physical property. If I 'burn' your avatar, I've changed some bits on a server. The difference is causal power. Money buys bread. Avatars just simulate buying bread."

  "That's too physicalist," Priya countered. "A border is just a line on a map until we enforce it. But crossing it without permission is a real violation. Why? Because of the shared practice. In the VR platform, the avatar *is* the user's social locus. When someone violates the avatar's boundaries, they violate the user's social standing. That's a real harm, not just a feeling."

  "Okay, but let's press the 'feeling' part," I said. "I concede the fear is real. The adrenaline, the humiliation. But I experience fear watching a horror movie. We don't call the movie real, and we don't call the monster's actions a crime. We say the viewer was distressed by a fiction. Why is VR different?"

  "Because the movie doesn't interact with you," Priya said. "In the film, the monster can't target *you* specifically. In the VR case, the perpetrator targeted your agency. But fine, let's use your movie analogy. Suppose the movie was interactive, and the monster singled you out to degrade you. Would that still be 'just fiction'?"

  "If it's still just pixels, yes," I said. "But here's the wrinkle the professor threw in. Suppose the perpetrator wasn't a user. Suppose it was an NPC. A scripted bot. No human intended to harm you. The code just glitched or was written poorly. Is that an assault?"

  Priya paused. "If the platform designed the NPC to behave that way, the platform is the agent. It's structural harm."

  "But suppose it's random," I pressed. "Just a bug. You feel violated. But there's no moral agent who wronged you. If there's no wrongdoer, can there be a wrongful harm? Or is it just a scare, like a jump-scare in a haunted house?"

  "I think you're conflating the *source* of the harm with the *nature* of the harm," Priya said. "If I walk into a glass door because the architect forgot to mark it, I'm injured. The architect's intent doesn't change my broken nose. In the virtual world, the harm is the violation of your expected autonomy within that space. Whether it's a bot or a human, your control was usurped."

  "I'll concede the loss of control is real," I said. "But in the haunted house, I consent to the scare. That leads to my second point. Entering VR is like getting on a roller coaster. You know the physics are simulated. You know the danger isn't real. If you get terrified, that's the price of admission. Calling it 'assault' inflates the concept. It insults people who face physical violence by equating it with bad code."

  "That's the 'just a game' defense," Priya said, sharp now. "Does that work for defamation? If I write a letter destroying your reputation, I've used words. Fiction. Ink on paper. But the harm is real because it changes how others treat you. If someone humiliates your avatar in front of your community, they change how that community treats you. The medium is irrelevant. The social consequence is the object."

  "Here's where the analogy breaks," I said. "Defamation changes your standing in the *physical* world. You lose jobs, friends. In the VR case, suppose the platform allows a 'restore.' I can rewind the world to before the assault. No trace remains. No one remembers but me. The social standing is intact. If I can undo it completely, did anything happen?"

  "Restoration doesn't erase the violation," Priya insisted. "If I punch you and then pay for your medical bill and apologize, I've 'restored' you physically. But I still assaulted you. The harm isn't just the damage; it's the act of will against you."

  "But the punch involves physical contact," I said. "The restoration wrinkle shows that the virtual object has no persistence independent of the user's permission. If I can undo it, it wasn't an object in the same way a body is. It was a temporary state of my console. So, if the harm survives restoration, it must be purely internal. It's trauma, not assault."

  "Trauma is a harm," Priya said. "But you want to categorize it as 'psychological distress about a fiction' to avoid calling the platform accountable. If I say it's 'virtual assault,' the platform has duties. If I say it's 'bad feelings,' they don't."

  "Exactly," I said. "And that's why the ontology matters. If the object isn't real, the violation isn't real. But I'll concede this: if the distress is severe enough, it functions like a real harm ethically. We should care about the suffering. But we shouldn't lie about what caused it. It wasn't a violation of a body; it was a triggering of a psychological response by a simulation."

  "So you're saying the harm is real, but the description of the event is false?" Priya asked.

  "I'm saying the description 'assault' implies a moral relation between two agents over a protected object," I said. "If the object is code I can reset, and the other agent might be a bot, the relation is missing. It's closer to vandalism than violence. But even then—if I vandalize a digital wall you own, and you can press 'undo,' did I vandalize it?"

  "Yes," Priya said. "Because you interfered with my property rights, however digital. Look, you keep trying to dissolve the virtual into the physical. I'm saying the virtual is a distinct layer of reality, constituted by rules. Chess pieces aren't wood; they're knights and bishops. If I knock over your king, I've checkmated you, even if the wood is unscratched. The avatar is the king. The assault is the checkmate."

  "But in chess, we agree on the stakes," I said. "In VR, the stakes are supposed to be low. That's the point of the medium."

  "Who decides the stakes?" Priya asked. "If the community treats it as high stakes, then they are. That's the money analogy again. A dollar is paper until we treat it as value. An avatar is code until we treat it as a self. When you treat it as a self, harming it harms the self."

  "I'll grant that the social treatment matters," I said. "If everyone agrees the avatar is you, then attacking it attacks you socially. But that makes the harm contingent on public opinion. If no one saw the assault, and I reset it, and it was a bot... then it seems the only thing remaining is my internal distress. And if I'm the only one who feels it, and I can undo the cause, calling it 'assault' seems to do work I don't want it to do. It demands a justice response for a glitch."

  "And that's where we stick," Priya said. "You think the 'justice response' is the problem. I think the 'glitch' minimization is the problem. If we accept that virtual spaces are where people live, work, and socialize now, then protecting the integrity of that space is a justice issue. Whether the object is physical or digital doesn't matter. What matters is that the user's agency was overridden."

  "So your claim is ontological agnosticism?" I asked. "It doesn't matter what the object *is*, only how it functions?"

  "Exactly," Priya said. "Function over substrate. If it walks like a violation and quacks like a violation, it's a violation. The NPC wrinkle doesn't change the victim's experience of violation. The restoration wrinkle doesn't change the fact that the violation occurred, even if the damage was repaired."

  "And my claim is that substrate determines function," I said. "Because it's code, it *can* be restored. Because it can be restored, the violation is fundamentally different from physical violation. The reversibility changes the moral category. It makes it a trespass, maybe, but not a battery."

  "But trespass is still a wrong," Priya noted.

  "True," I conceded. "I'm not saying it's permissible. I'm saying it's not *assault*. It's a category error to call it assault. And if we call it assault, we dilute the term for physical cases."

  "And if we don't," Priya finished, "we leave people in virtual spaces unprotected because philosophers are obsessed with whether pixels count as skin."

  We sat with that. The disagreement hadn't vanished; it had hardened. For Priya, the reality of the harm lay in the social function and the experience of agency loss, regardless of the underlying physics. For me, the ontology of the object—its reversibility, its lack of physical causality—dictated the moral category, regardless of the intensity of the distress.

  "So," I said. "For the paper. You're arguing that virtual objects are real institutional facts, and harms to them are real harms to the user's social agency."

  "And you're arguing that virtual objects are fictions, and harms to them are real psychological injuries, but misdescribed as moral violations of objects," Priya summarized.

  "Basically," I said. "You think the magic circle is a place. I think it's a mindset."

  "And the question is whether the law, and ethics, should protect the place or the mind."

  "Looks like it."

  Priya picked up her pen. "Well, at least we agree the stakes are high enough to argue about."

  "That," I said, "is the one thing that's definitely real."
