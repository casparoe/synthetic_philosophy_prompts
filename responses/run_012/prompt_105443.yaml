      *   *Section 5: Conclusion.* Which verdict to sacrifice? Actually, tell them they might not need to sacrifice the Beef/Chicken one if they accept "Moral Weight" over "Body Count."

  7.  **Refining the "Beef vs. Chicken" Logic:**
      *   User thinks: 1 Cow = hundreds of meals. 1 Chicken = 4 meals. So per meal, Chicken = more deaths.
