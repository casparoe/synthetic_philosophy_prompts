prompt: |-
  ok so i've been trying to figure out what i actually think about eating animals and i keep contradicting myself, and i want you to help me find the principle behind my gut calls, if there even is one. here's where i land, case by case:

  - a factory-farmed chicken nugget at a party: kinda bad, but i'd eat it.
  - a factory-farmed beef burger: feels worse than the nugget, per meal.
  - the beef one being worse bugs me though, because one cow makes like hundreds of meals and one chicken makes maybe four, so per meal the chicken actually costs more lives. i know that, and the beef still feels worse. maybe it's that cows seem more 'in there'?
  - grass-fed beef from a farm where the cow had a decent life outside: less bad than the factory burger, even though the cow still gets killed at the end.
  - a vegan meal that's mostly soy and wheat: i used to think this was obviously the good option, but then i read that harvesting crops mows down a ton of field mice and birds and insects, maybe more per calorie than pastured beef does. now i'm not sure the vegan meal is clearly better.
  - backyard eggs from a hen my neighbor keeps who has a good life: fine, basically.
  - fish: honestly no idea, they might not feel much? but maybe they do?

  and then the thing that really breaks my brain: if i care about suffering in general, wild animals are like 99% of all animals, and most of them die horribly as babies or get eaten alive. so by my own logic i should think nature is a horror show and maybe we ought to do something about it. but i also feel like leaving nature alone is obviously right, and 'helping' wild animals is creepy and probably a disaster.

  is there a principle that gets most of these, or a couple of competing ones? what does it say about stuff i haven't listed, like a lab-grown burger, or a pasture that got carved out of a forest, or a wild-animal vaccine program? and which of my verdicts do i have to give up to keep the rest? i feel like the beef-vs-chicken one is the one i'd sacrafice, but i want to see if a principle can hang onto it. if none of them can save everything, tell me honestly which calls it can't accommodate and why.
