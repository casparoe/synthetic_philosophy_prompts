      *   *Intuition C (Complicity/Agency):* Factory farming is "bad" (human-made suffering). Wild animal suffering is "tragic" but intervening is "creepy" (natural order/hubris).
      *   *Intuition D (The Math Problem):* Crop deaths vs. pasture deaths. This challenges the "vegan is best" assumption.
      *   *Intuition E (The Wild Animal Suffering Paradox):* If suffering is bad, nature is bad. But we shouldn't fix nature. This implies a distinction between *moral agents* (humans) and *moral patients* (animals/nature), or a distinction between *causing* harm vs. *allowing* harm.

  3.  **Identify Candidate Ethical Frameworks:**
      *   *Utilitarianism (Singer-style):* Maximize pleasure, minimize suffering.
          *   *Fit:* Explains factory farming bad, grass-fed better.
