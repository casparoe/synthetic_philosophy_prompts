answer: |-
  ### Desiderata for a Theory of Affirmative Action and Quotas

  The following list specifies the conditions any moral and political theory must meet to be considered adequate for policy guidance. The scope covers deliberate differential treatment in admissions, employment, and appointment. The status of each requirement is marked as either **Non-negotiable** (a condition of adequacy for any theory claiming to guide policy) or **Contested Preference** (a demand prioritised by one side of the debate which a theory might reasonably reject, provided it explains why).

  **1. The Paradigm Constraint**
  *   **Motivation:** A theory must recover considered moral judgments about clear cases. It must explain why a targeted outreach programme for under-represented minorities is permissible, while a rigid racial bar excluding a specific group is impermissible. It must also account for the intuition that India's caste reservations differ in kind from Norway's gender quotas, even if both use numerical targets.
  *   **Status:** **Non-negotiable.** A theory that validates all differential treatment or condemns all of it fails to guide policy.

  **2. The Equal Treatment Engagement**
  *   **Motivation:** The theory must address the objection that affirmative action violates the right of non-beneficiaries to be treated as individuals rather than members of a group. It cannot simply assert that historical injustice overrides current rights; it must explain why the differential treatment does not constitute unjust discrimination against the non-preferred candidate or applicant.
  *   **Status:** **Non-negotiable.** Evading this objection renders the theory politically inert in liberal democracies.

  **3. The Grounds Differentiation**
  *   **Motivation:** The theory must distinguish between backward-looking compensation (for specific past wrongs), forward-looking utility (diversity benefits), and structural redress (leveling the playing field). It must state whether a single scheme can rest on multiple grounds simultaneously or if mixing them creates incoherence (e.g., compensating for slavery while claiming to promote diversity).
  *   **Status:** **Non-negotiable.** Conflating these grounds leads to design errors, such as applying compensation logic to groups that were not the specific victims of the past wrong in question.

  **4. The Mechanism Specification (Floor vs. Ceiling)**
  *   **Motivation:** The theory must distinguish between a quota as a minimum threshold (a floor, as in Norway) and a quota as a maximum cap (a ceiling, as in India's limit on total reserved seats). It must justify why one might be permissible while the other is not, or vice versa.
  *   **Status:** **Non-negotiable.** Policymakers need to know whether the instrument sets a target to reach or a limit not to exceed.

  **5. The Individual-Group Distinction**
  *   **Motivation:** The theory must reconcile the claim that groups are the proper unit of redress with the liberal commitment that individuals are the proper unit of moral concern. It must explain how a policy can target group statistics without treating individual members merely as tokens of that group.
  *   **Status:** **Non-negotiable.** Failure here leads to stigmatisation of beneficiaries and resentment among non-beneficiaries.

  **6. The Exit Condition**
  *   **Motivation:** The theory must specify what state of affairs would render the scheme unnecessary. It must define the *telos* of the policy: is it proportional representation, the elimination of poverty, or the cessation of explicit discrimination? A theory that implies permanent differential treatment is suspect in a liberal framework.
  *   **Status:** **Non-negotiable.** Without an exit condition, the scheme transforms from a temporary corrective into a permanent system of privilege.

  **7. The Intra-group Justice Requirement**
  *   **Motivation:** The theory must handle the heterogeneity of beneficiary groups. It must explain how to prevent the most advantaged members of a disadvantaged group (the 'creamy layer') from capturing all the benefits, thereby leaving the most vulnerable behind.
  *   **Status:** **Non-negotiable.** Ignoring this leads to schemes that entrench elites within disadvantaged castes or races without aiding the intended victims of structural disadvantage.

  **8. The Context Sensitivity Requirement**
  *   **Motivation:** The theory must state whether the same justification applies across admissions, employment, and political appointment. If the justification for gender quotas on boards (democratic legitimacy/role model effects) differs from race-conscious admissions (educational diversity), the theory must map these boundaries.
  *   **Status:** **Contested Preference.** Some theorists seek a unified grand theory; others argue for a piecemeal approach. However, for policy design, distinguishing contexts is highly preferable.

  ***

  ### Inconsistency Flag

  I suspect that **Desideratum 5 (The Individual-Group Distinction)** and **Desideratum 6 (The Exit Condition)** cannot be jointly satisfied in practice, though a theory might claim otherwise.

  **Why:** To satisfy the Individual-Group Distinction, a theory must ensure that individuals are not sacrificed merely for group statistics. This usually requires flexible, merit-sensitive mechanisms. However, to satisfy the Exit Condition, the theory must define a measurable group outcome (e.g., proportional representation) that signals the job is done. If the mechanism is too sensitive to individual merit (to satisfy #5), it may never achieve the group statistical target required to trigger the exit (failing #6). Conversely, if the mechanism is rigid enough to guarantee the group target and thus the exit point, it inevitably compromises individual merit rankings (failing #5). A theory that promises both perfect individual fairness and guaranteed group outcomes within a finite timeframe is likely masking a trade-off.

  ***

  ### The Single Most Exclusionary Requirement

  The requirement that does the most work in excluding candidate theories is **Desideratum 7 (The Intra-group Justice Requirement)**.

  **Reasoning:** Most high-level philosophical defences of affirmative action treat beneficiary groups (e.g., 'women', 'Dalits', 'Black Americans') as monolithic blocks. They argue from the standpoint of the group versus the majority. By demanding that a theory account for the 'creamy layer' phenomenon, we exclude any theory that relies on simple group identity as a proxy for disadvantage. This forces the theory to become significantly more complex, requiring means-testing or sub-categorisation within the protected class, which many broad-brush moral arguments resist.

  **Contested Status:** This requirement is **contested**. Proponents of strong group-rights approaches argue that subdividing disadvantaged groups weakens their political solidarity and administrative feasibility. They may accept that some elites benefit, viewing it as a necessary cost of group elevation. However, from a policy-design perspective, ignoring intra-group inequality renders the scheme ineffective for the poorest, which is why I mark it as non-negotiable above. *My own view is that a theory failing this requirement is morally deficient, even if politically convenient.*

  ***

  ### Evaluation of Justification Families

  **Backward-looking Compensation**
  This family fares poorly on **Exit Conditions** and **Equal Treatment**. Compensation is logically owed by perpetrators to victims; extending it to current members of a group who did not suffer the wrong, funded by current members of a majority who did not commit it, strains the logic of compensation. It also struggles with **Intra-group Justice**, as it typically compensates based on lineage or identity rather than current disadvantage, allowing the 'creamy layer' to claim restitution. It handles **Paradigm Cases** well only where historical wrongs are discrete and legally adjudicated, not for structural societal issues.

  **Forward-looking Diversity**
  This approach satisfies **Equal Treatment** better by arguing everyone benefits (including the majority), but it fails the **Grounds Differentiation** test by instrumentalising the beneficiaries. If a candidate is admitted to create a 'diverse environment', their value is partly functional, which conflicts with **Individual Desert**. It also lacks a clear **Exit Condition**; diversity is a perpetual good, suggesting the policy should never end, which violates the temporary nature expected of affirmative action. It works for **Admissions** but is weak for **Boardroom Quotas**, where competence is prioritised over environmental variety.

  **Equality-of-Opportunity (Level-Playing-Field)**
  This family scores highly on **Exit Conditions** (the scheme ends when the playing field is level) and **Equal Treatment** (framed as fair competition). However, it struggles with **Mechanism Specification**. If the goal is true equality of opportunity, quotas are often too blunt an instrument, potentially violating **Individual-Group Distinction** by privileging a wealthy member of a disadvantaged group over a poor member of a privileged group. It requires granular data on disadvantage that is often unavailable, making **Context Sensitivity** difficult to manage across different sectors.

  **Democratic-Representation**
  This justification is strongest for **Boardroom and Legislative Quotas**. It argues that decision-making bodies must mirror the populace to be legitimate. It handles the **Individual-Group Distinction** by redefining the role of the representative as a delegate of a group interest. However, it fares poorly in **Admissions** and general **Employment**, where the function is not political representation but education or service delivery. It also risks failing the **Exit Condition**, as demographic shifts could justify permanent recalibration of quotas, potentially cementing group identities indefinitely.

  ***

  ### Summary Note on Consensus

  There is no consensus on whether a single unified theory is possible. The settled view among specialists is that *some* form of differential treatment can be justified under specific conditions, but the *grounds* for that justification remain deeply fractured. The tension between individual merit and group redress is not a problem to be solved but a feature of the landscape that any adequate theory must manage rather than dissolve. *I hold that the failure to address intra-group heterogeneity is the most common theoretical vice, and correcting it should be the primary task of any new proposal.*
