  Consider the molecular chaperone Hsp90 in *Drosophila melanogaster*, a highly conserved protein whose structure has been unmistakably shaped by natural selection to refold denatured proteins during cellular stress. In normal developmental conditions, Hsp90 also stabilises specific signalling proteins, thereby suppressing phenotypic variation and ensuring consistent morphological outcomes; this buffering effect makes a robust, non-accidental contribution to the organism's capacity for stable development. The scenario turns on a single feature: **the absence of a selection history specifically for this developmental buffering**. While the protein exists due to selection, the selective pressure was for stress resistance, not for the suppression of variation in unstressed environments. If one were to supply a history where ancestors were selected specifically for developmental stability, the etiological verdict would change; if one were to remove the buffering contribution so development became erratic, the causal-role verdict would change.

  **Verdicts and Clauses**

  *   **Causal-Role Account:** **Yes**, the trait has a function.
      *   *Clause:* A trait has a function if it contributes to a capacity of the containing system (Cummins 1975).
      *   *Work:* The buffering effect contributes to the system's capacity for stable development.
      *   *Removal:* If the buffering contribution were removed (the protein no longer stabilised signalling), the verdict would flip to 'no function'.

  *   **Etiological Account:** **No**, the trait (qua developmental buffer) has no function.
      *   *Clause:* A trait has a function only if it exists because ancestors performed that effect and were selected for doing so (Millikan 1984; Neander 1991).
      *   *Work:* The trait was not selected *for* buffering variation; it was selected for stress resistance.
      *   *Removal:* If the selection history were altered so that ancestors were selected specifically for developmental stability, the verdict would flip to 'has function'.

  **The Etiological Defence**

  The etiological theorist's most credible defence is to **deny the function**. She would argue that while Hsp90 *causes* stability, this is merely a beneficial side-effect (a spandrel) of its true function (stress resistance). To resist the case by widening what counts as selection—for instance, by claiming that stabilising selection on the protein sequence *implicitly* selects for all its stable effects—would cost her dearly elsewhere. It would force her to admit that any stable byproduct of a selected trait (such as the red colour of blood or the noise of the heartbeat) counts as a function, thereby collapsing the distinction between genuine functions and mere useful consequences, which is the very distinction her account was designed to preserve.
