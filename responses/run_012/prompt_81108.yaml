      *Critique:* If you aren't causing harm, you don't *need* to offset. The EtG argument is "I cause harm X to generate Good Y." If Harm X is zero, the argument collapses into "I generate Good Y." The tension is: Does the *permission* to take the job depend on the offset? If the harm is non-existent (due to replacement), the offset is unnecessary. If the harm is real (no replacement), the offset is necessary but harder to justify. The "Leakage" problem in carbon is that your good is undone elsewhere. In jobs, the "Leakage" is that your *abstention* doesn't stop the harm.
