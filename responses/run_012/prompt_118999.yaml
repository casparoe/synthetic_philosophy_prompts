answer: |-
  I accepted this invitation on one condition, that I be allowed to speak honestly about what you have done here rather than simply congratulate you on having done it. It is a strange condition for a celebration, I know. We are gathered to mark an ending and a beginning, and the custom is to offer comfort, to affirm that the time spent was well spent, and that the objects you have made are good because you made them. But I have spent a lifetime thinking about why we make things, and I have come to believe that kindness which avoids the truth is not kindness at all. It is a form of diversion. And if there is one thing we should be wary of, it is diversion.

  I want to propose a different way of measuring what has happened in this hall, and what will happen when you leave it. It is not my way. It belongs to Leo Tolstoy, and though he wrote it down more than a century ago, I have never managed to talk my way out of it in a classroom, and I will not try to talk my way out of it today. On this view, art is not the making of beautiful objects, or interesting objects, or admired objects. Art is a human activity in which one person hands on to others a feeling he has himself lived through, so that they are infected by it and experience it themselves. That is the whole of it. The success of the work does not depend on how much it costs to produce, or how cleverly it is constructed, or how many people applaud it. It depends on whether the infection takes hold.

  This means that the most important critics in this room are not the faculty in the third row, and certainly not me. The most important critics are the families in the back. Some of you have never set foot in a gallery. You do not know the vocabulary of the trade. You are here because you love these graduates. On the view I am asking you to consider, your ignorance of art history is not a disadvantage. It is the only valid test. If a graduate has stood before you and shown you a thing, and you felt what they felt, then art has happened. If you stood there polite and confused, admiring the skill but feeling nothing, then no art has happened, regardless of the grade attached to the work. We must not mistake politeness for transmission. We must not mistake confusion for depth.

  This is a hard thing to say to a faculty who have spent their lives teaching craft. I do not mean to diminish the value of skill. But skill is only the vessel. It is not the water. We often praise originality, technical mastery, ambition, the sophistication of a graduate's influences. These are the standard currency of such occasions. I am asking you to treat them as counterfeit if they are spent without sincerity. A perfect technique used to transmit a borrowed feeling is not good art; it is a efficient lie. An ambitious work that demands much of its viewer but gives nothing back is not elevated; it is a private amusement for a privileged class. I say this not to insult the institution, but to protect the graduates from the belief that complexity is a virtue in itself.

  There is a work made this year that everyone at the school is talking about. It is a film of forty minutes with no dialogue and no story, an original score, and at the entrance to the gallery, a wall of text in a vocabulary few here speak. The faculty are proud of it. Its maker is in the audience. I will not name them, because the point is not the person, but the test. On the view I am describing, the question is not whether the film is difficult. The question is whether the difficulty serves the feeling. Obscurity is often the sign that nothing is being transmitted, that an air of depth is being borrowed in place of a feeling actually had. But it is also possible that the feeling is rare and hard to catch. The test is not in the wall of text. The test is in the room. Did the people who watched it feel something true, or were they merely occupied? Were they infected, or were they managed? If the maker is here, I hope they know that their work is not finished until it lands in someone else. If it lands only in the minds of those who already speak the language, it has not yet become art. It remains a diary.

  I am aware that I am asking you to value something vulnerable over something secure. Technical mastery is secure. You can measure it. The market can reward it. Sincerity is not secure. You cannot measure it. The market often punishes it. But if you choose security, you are choosing a trade, not an art. And there is honor in a trade, but it is not what you came here for.

  I am also aware that I am subjecting this speech to the same argument. I am standing here telling you that art is the transmission of feeling. If you are listening to me and feeling nothing, if you are merely processing information, then I am not giving an address. I am producing a counterfeit of an address. I would rather admit that risk in the middle of this occasion than pretend the risk is not there. It is possible that I am merely performing the role of the philosopher, using words to create an air of seriousness rather than to share a truth. If you feel that, then I have failed my own test, and I ask your forgiveness. I am trying to be sincere. I am trying to hand on a conviction I have lived through. Whether it infects you is not entirely in my hands.

  So what is the charge? It is not to go out and make beautiful things. It is not to make things that will be admired. It is to go out and feel deeply, and to find a way to make others feel it too. Do not borrow feelings from other artists. Do not imitate the styles of the market. Do not manufacture striking effects to hold an audience's attention. If you have nothing to say, say nothing. It is better to be silent than to contribute to the endless occupation of the audience. And when you make a thing, do not hide behind difficulty. Do not assume that if people do not understand you, they are not sophisticated enough. They may be honest enough to know that nothing is being sent.

  This is a demanding life. It offers no guarantee of reward. It offers no guarantee that you will be understood. It requires you to strip away the defenses you have built here, the theories, the techniques, the protections of the guild. It requires you to stand naked before people who may not care about art, and hope that what you feel is strong enough to bridge the gap. Some of you will find that you cannot do this. You will find that you prefer the craft to the feeling. That is not a failure. It is an honesty. But do not call it art if it is not.

  I cannot end by telling you that the world is waiting for you. The world is occupied. It is full of diversion. It will not miss you if you produce counterfeits. But it will starve if you produce nothing real. You have the skill. You have the training. Now you must have the courage. Go and feel something true, and do not rest until you have found a way to make us feel it too.
