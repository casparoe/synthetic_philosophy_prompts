      *   **Setting:** Graduation ceremony, small independent art school.
      *   **Condition:** Speak honestly about art based on Tolstoy's *What Is Art?* (art as infection/transmission of feeling, sincerity, clarity, genuineness; not beauty/interest/admiration; counterfeit art uses borrowing/imitation/effects/diversion; art must be accessible to ordinary people; moral quality determines *good* art, but transmission determines *art* at all).
      *   **Constraints:**
          *   Build the address *on* this view, not just decorate with it.
