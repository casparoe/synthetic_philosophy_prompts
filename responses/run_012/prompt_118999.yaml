          *   Self-referential: The speech itself must attempt to transmit feeling, admitting the risk of failure (if it doesn't move anyone, it's counterfeit).
          *   Tone: Spoken register, ~8 minutes (1000-1200 words), continuous prose (no headings/bullets), no critical theory vocabulary, name Tolstoy once then stop explaining.
          *   Ending: No false uplift. Honest, demanding charge.
          *   Balance: Honest about the institution without turning it into a tribunal/indictment of graduates.

  2.  **Deconstruct the Tolstoyan Position for the Speech:**
      *   Core: Art = Transmission of felt experience.
      *   Success criteria: Sincerity, Clarity, Genuineness.
      *   Failure modes: Borrowing, Imitation, Effect-making, Diversion.
      *   Accessibility: If ordinary people (grandparents) can't feel it, it's likely counterfeit (private amusement), not "high art."
      *   Morality: Good art transmits feelings compatible with universal brotherhood/moral perception (though the prompt emphasizes the transmission aspect more for the definition of *art* vs *counterfeit*).
      *   Application to Speech: The speech must try to make the audience *feel* something, not just understand arguments. It must admit the risk of failing this.

  3.  **Address the "Hard Case" (The Film):**
      *   Description: 40 mins, no dialogue/story, original score, wall of critical theory text.
