prompt: |-
  Hey, so I'm a junior in high school and I'm the treasurer of our prediction market club. We use fake money, but the top three people at the end of the semester get actual gift cards, so it's not totally pointless. Every week there's like 10 new binary markets -- 'will the school board vote yes on the new schedule,' 'will the football team make playoffs,' 'will the principal resign,' stuff like that. Contracts pay $1 if yes and $0 if no, and the price is basically the market's implied probability.

  I keep getting wrecked because I bet way too much on stuff I'm sure about and then one upset wipes me out, or I bet tiny on stuff I actually know alot about. Someone told me I should look into Kelly betting and 'geometric rationality' but when I googled it I got a bunch of formulas and no actual plan. Can you turn it into a decision procedure I can actually run before each bet? Like a checklist or a flowchart in words, with the questions in order, what counts as a good enough answer to each, where the procedure just says 'no, don't bet,' and where it says 'this is a judgment call, ask a human' (probably me, I guess).

  I usually have like 10 minutes before the market closes to decide, and I'm doing this on my phone in the hallway, so it has to be usable without a spreadsheet. I'm not a math person but I can do algebra if you show me the formula. Also no one has to sign off on my bets, but if I drop below $5 I'm basically out of the running, so that's the real constraint.

  A few things it has to handle:

  - I never actually know the true probability. I have a hunch, sometimes a pretty good one, sometimes it's basically a vibe. So the procedure needs a step for 'how confident am I in my own number,' and it should say what to do when the honest answer is 'not very.'
  - Some of the markets are obviously correlated. If the football team makes playoffs, the coach probably doesn't get fired. If I'm already betting on one, how does that change the size of the other? I don't want to accidentally bet the same opinion three times.
  - The club rule is that if you go below $5 you're out, and at the end it's top 3 who get prizes, not highest average or whatever. So my real goal isnt 'maximize expected log bankroll,' it's 'finish in the top 3 without busting.' I know that breaks the usual assumptions, but I need the procedure to at least tell me when I'm outside the theory's happy path.
  - Sometimes the formula says bet a huge fraction and it feels insane. I want the procedure to have a sanity check that isn't just 'trust the math' and also isn't just 'chicken out.'
  - I heard the whole point of Kelly is something about your bankroll growing geometrically over time and not just expected value, and that if you bet too big you eventually lose everything even if every bet is +EV. Is that right? If so, build the procedure around that idea, because that's the part I actually care about.

  Then run it on three cases: (1) a market where I think the price is way off and I have a solid reason, (2) two correlated markets where I want to bet both, and (3) a cheap longshot that would be fun to hit but I'm probably wrong about. For at least one of them, give me the answer I won't like, and say why the procedure gives it anyway.

  Also, be honest at the end about what the procedure cant do. Like, if the real issue is that I care more about beating my friend than about the gift card, or if the 'probability' is really a value judgment, just say so instead of pretending there's a number. And please don't give me a reading list or citations, I don't have time for that and I can't search stuff at school anyway. Just the procedure, the questions, and the worked examples.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** High school junior, Treasurer of a Prediction Market Club.
      *   **Goal:** Finish in the top 3 to win gift cards. Avoid going below $5 (bustout constraint).
      *   **Current Problem:** Overbetting on "sure things" (risk of ruin), underbetting on edges, ignoring correlations, struggling with Kelly Criterion math/theory.
      *   **Constraints:** 10 minutes per bet, phone only (no spreadsheet), not a "math person" (needs simple algebra/checklist), needs to handle uncertainty in probability estimates, needs to handle correlations, needs to handle the "top 3" tournament style vs. pure growth.
      *   **Request:** A concrete decision procedure (checklist/flowchart in words), specific questions, thresholds for "don't bet," explanation of Kelly/Geometric Rationality in plain English, worked examples (including an unpopular answer), and an honest limitation section.

  2.  **Deconstruct the Theory (Kelly & Geometric Rationality):**
      *   *Kelly Criterion:* Maximizes the expected logarithm of wealth. Prevents ruin (if fractions are correct). Formula: $f^* = \frac{p(b+1) - 1}{b}$. For binary markets (price $P$, payoff $1), b = (1-P)/P$. Simplified Edge/Probability form: $f^* = \frac{YourProb - MarketProb}{1 - MarketProb}$.
      *   *Geometric Rationality:* Focuses on compounding growth over time rather than single-bet expected value. Betting too much reduces geometric growth rate even if arithmetic EV is positive.
      *   *Tournament Context (Top 3):* Pure Kelly is often too conservative for tournaments where you *need* to take risk to catch the leaders, but too aggressive if you're near the bust line ($5).
      *   *Fractional Kelly:* Since the user admits their probability estimates are "hunches" or "vibes," Full Kelly is dangerous. Half-Kelly or Quarter-Kelly is standard advice for uncertain edges.
      *   *Correlation:* Betting on correlated events effectively increases the stake on a single underlying outcome. Needs a "portfolio view."

  3.  **Drafting the Procedure (The "Hallway Kelly" Checklist):**
      *   *Need:* Simple steps, mental math friendly.
      *   *Step 1: The Bust Check.* If Bankroll < $10, be ultra-conservative. If < $5, game over.
      *   *Step 2: The Edge Check.* Do I actually know something the market doesn't? If it's a vibe, skip.
      *   *Step 3: The Probability Estimate.* Convert hunch to %. Compare to Price.
      *   *Step 4: The Kelly Calculation (Simplified).* Use the binary market formula: $\text{Bet \%} = \frac{\text{My Prob} - \text{Price}}{1 - \text{Price}}$.
      *   *Step 5: The Uncertainty Discount.* Since estimates are noisy, cut the bet size in half (Half-Kelly).
      *   *Step 6: The Correlation Check.* Am I betting on the same outcome twice? Cap total exposure.
      *   *Step 7: The Tournament Adjustment.* If I'm far behind, I might need more risk. If I'm in top 3, protect.
      *   *Step 8: Sanity Check.* Does this bet size feel sleep-at-night safe?

  4.  **Refining the Math for Phone Use:**
      *   Full Kelly Formula for Binary Markets: $f = \frac{p - q}{1 - q}$ where $p$ is user prob, $q$ is market price.
      *   Example: Price is 40c ($0.40). I think 60% ($0.60).
      *   Edge = $0.60 - 0.40 = 0.20$.
      *   Odds = $1 - 0.40 = 0.60$.
      *   Kelly % = $0.20 / 0.60 = 33\%$.
      *   *Correction:* That's too aggressive for a high schooler with uncertain probs. Let's suggest **Half-Kelly** as the default. So 16.5%.
      *   *Even Simpler:* Just calculate the "Edge" (My Prob - Price). If Edge < 10%, don't bet. If Edge > 10%, bet roughly Edge amount (capped). Actually, the formula $\frac{p-q}{1-q}$ is easy enough for a calculator app. Let's stick to the formula but mandate a 50% discount.

  5.  **Addressing the "Top 3" vs. "Growth" Conflict:**
      *   Kelly maximizes long-term growth. Tournaments often require higher variance to win *if* you are behind.
      *   *Constraint:* The $5 bust line is hard.
      *   *Solution:* If Bankroll > $50 (safe), use Half-Kelly. If Bankroll < $20 (danger zone), use Quarter-Kelly or flat bet small. If Bankroll is huge but rank is low, maybe Full Kelly (but warn about risk).
      *   *Decision:* Keep it simple. Default to Half-Kelly to account for "I'm not sure about my probability." This protects against the "wrecked because I bet too much on stuff I'm sure about" problem.

  6.  **Developing the Worked Examples:**
      *   *Case 1 (Solid Edge):* Price 30c, User 60%. High confidence.
      *   *Case 2 (Correlated):* Football Playoffs (Price 40c) & Coach Fired (Price 70c). User thinks Playoffs = No Coach Fired. Need to show how to aggregate exposure.
      *   *Case 3 (Longshot/Vibe):* Principal Resigns. Price 5c. User thinks 15%. High uncertainty.
      *   *Unpopular Answer:* Case 3 should probably be a "NO BET" because the uncertainty discount wipes out the edge, or the bankroll risk isn't worth the lottery ticket. Or Case 2 where correlation forces a reduction. Let's make Case 3 the "No Bet" because "vibes" violate the "solid reason" requirement of the procedure.

  7.  **Addressing the "Geometric Rationality" Question:**
      *   Explain it simply: "Arithmetic average says you win money. Geometric average says you stay in the game."
      *   Volatility drag: If you lose 50%, you need 100% to get back. Big bets create volatility that kills compounding.

  8.  **Final Review against Constraints:**
      *   *Phone friendly?* Yes, simple calculator math.
      *   *10 mins?* Yes, checklist is short.
      *   *Honest about limitations?* Yes, need a section on "What this can't fix."
      *   *Tournament goal?* Acknowledge the tension between survival and catching leaders.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Direct, peer-to-peer (high school junior), practical, no fluff.
      *   *Structure:*
          1.  The Core Concept (Why Kelly/Geo matters).
          2.  The Procedure (The Checklist).
          3.  The Math (How to calculate).
          4.  The Examples.
          5.  The Honest Limitations.
      *   *Self-Correction on Math:* The standard Kelly formula for binary options is $f = p - \frac{1-p}{b}$. Wait, simpler version for prediction markets (price $P$, payout $1$):
          *   Net odds $b = \frac{1-P}{P}$.
          *   Kelly $f = \frac{p(b+1)-1}{b}$.
          *   Actually, the simplest form for binary markets is: $f = \frac{\text{Your Prob} - \text{Market Price}}{1 - \text{Market Price}}$.
          *   Let's verify: Price 0.50, Prob 0.60. $f = (0.6-0.5)/(1-0.5) = 0.1/0.5 = 20\%$.
          *   Price 0.80, Prob 0.90. $f = (0.9-0.8)/(1-0.8) = 0.1/0.2 = 50\%$.
          *   This works. I will teach this formula but insist on **Half-Kelly** (divide result by 2) because human probability estimates are usually overconfident.

      *   *Correlation:* This is tricky without a spreadsheet. Rule of thumb: If two bets depend on the same "root cause," treat them as one bet. Sum the potential loss. If total potential loss > Kelly limit, scale down.
      *   *Tournament Strategy:* If you are in the top 3, play defensively (Quarter Kelly). If you are outside, play offensively (Half Kelly). If near $5, play for survival (Flat $1 bets).

  10. **Final Polish:** Ensure the "Unpopular Answer" is clear and justified. Ensure the "Geometric Rationality" explanation is intuitive (volatility drag).

  *(Self-Correction during drafting)*: I need to make sure I don't overwhelm with the formula. I'll put the formula in a "Calculator Step" box. I need to emphasize the $5 limit heavily. If they have $10, a 50% bet is $5. If they lose, they are out. So there must be a "Maximum Bet Cap" based on bankroll distance from $5.
  *New Rule:* Never bet more than 50% of the amount *above* $5. (e.g., if you have $15, you have $10 buffer. Max bet $5). This ensures one bad beat doesn't bust you immediately.

  Let's integrate that into the "Survival Check."

  Okay, ready to write.s
answer: |-
  ### Part 1: The Core Idea (Why You're Getting Wrecked)

  You asked about "geometric rationality." Here is the plain English version:

  **Arithmetic Rationality** asks: "On average, how much money do I make?"
  **Geometric Rationality** asks: "What happens to my bankroll over time if I keep doing this?"

  If you bet your whole bankroll on a 90% chance to win, you will eventually lose. Once you hit $0, you can't compound. Volatility kills growth. If you lose 50% of your money, you need a 100% gain just to get back to even. Big bets create volatility.

  **Kelly Betting** is the math for geometric growth. It tells you the exact percentage of your bankroll to bet to maximize growth *without* going bust. However, Kelly assumes you know the *true* probability. You don't. You have hunches. So, we use **Half-Kelly**. It cuts your bet size in half. You grow slightly slower, but you survive your own overconfidence.

  **The Tournament Problem:** You want Top 3, not just growth.
  *   If you are **in the Top 3**: Protect your spot. Bet smaller (Quarter-Kelly).
  *   If you are **outside the Top 3**: You need risk to catch up. Bet normal (Half-Kelly).
  *   If you are **near $5**: Survival is the only goal. Bet flat small amounts.

  ---

  ### Part 2: The "Hallway Kelly" Decision Procedure

  Do this on your phone calculator. If you can't finish these steps in 5 minutes, skip the bet.

  #### Step 1: The Survival Check (Hard Constraint)
  **Question:** Is my current bankroll less than $15?
  *   **YES:** Do **not** use percentages. Bet a flat **$1 or $2 max**. Do not try to math your way out of a hole this small. Your only goal is to not hit $5.
  *   **NO:** Proceed to Step 2.

  #### Step 2: The Edge Check (Filter)
  **Question:** Can I write down *one specific fact* that the market price is ignoring? (e.g., "The quarterback is injured and the market hasn't updated," not "I have a vibe.")
  *   **NO:** **STOP. DO NOT BET.** You are the liquidity for other people.
  *   **YES:** Proceed to Step 3.

  #### Step 3: The Probability Estimate
  **Question:** What is my honest percentage chance this happens? (0-100).
  *   *Constraint:* If your number is within 10% of the market price, **STOP. DO NOT BET.** The edge isn't worth the risk.
  *   *Example:* Market says 40¢ (40%). You must believe it's at least 50% or at most 30% to continue.

  #### Step 4: The Kelly Calculation (The Math)
  Open your calculator.
  1.  **Market Price ($P$):** (e.g., $0.40)
  2.  **Your Probability ($Q$):** (e.g., 0.60)
  3.  **Calculate Edge:** $Q - P$ (e.g., $0.60 - 0.40 = 0.20$)
  4.  **Calculate Odds:** $1 - P$ (e.g., $1 - 0.40 = 0.60$)
  5.  **Full Kelly %:** $\text{Edge} \div \text{Odds}$ (e.g., $0.20 \div 0.60 = 0.33$ or $33\%$)
  6.  **Half-Kelly %:** Divide that result by 2. (e.g., $33\% \div 2 = 16.5\%$)

  **This is your "Theoretical Bet Size."**

  #### Step 5: The Correlation Check (Portfolio Risk)
  **Question:** Do I already have money riding on an outcome that depends on this same event?
  *   **NO:** Proceed to Step 6.
  *   **YES:** Add the *maximum possible loss* of this new bet to the maximum possible loss of your existing correlated bets.
      *   *Rule:* Your total exposure to one "story" (e.g., "Football Team Sucks") cannot exceed the **Half-Kelly %** calculated in Step 4.
      *   *Action:* If you are already at the limit, **SKIP THIS BET.** If you are under the limit, reduce this bet size so the total stays under the limit.

  #### Step 6: The Tournament Adjustment
  **Question:** Where is my rank?
  *   **Top 3:** Take your Step 4/5 size and cut it in half again (Quarter-Kelly). You are playing defense.
  *   **Outside Top 3:** Keep the Step 4/5 size (Half-Kelly). You need offense.

  #### Step 7: The Sanity Check (Human Judgment)
  **Question:** If I lose this bet, will I be angry/panicked?
  *   **YES:** Cut the bet size by another 50%.
  *   **NO:** Place the bet.

  ---

  ### Part 3: Worked Examples

  Here is how the procedure runs on the three cases you asked for.

  #### Case 1: The Solid Edge
  *   **Market:** "Will the school board vote yes on the new schedule?"
  *   **Price:** 30¢ ($0.30).
  *   **Your Info:** You spoke to a board member's aide. You think 70% chance ($0.70).
  *   **Bankroll:** $50. Rank: 5th place.
  *   **Correlations:** None.

  **Run the Procedure:**
  1.  **Survival:** $50 > $15. Pass.
  2.  **Edge:** "Spoke to aide" is a specific fact. Pass.
  3.  **Prob:** 70% vs 30%. Gap is 40%. (Greater than 10%). Pass.
  4.  **Math:**
      *   Edge: $0.70 - 0.30 = 0.40$
      *   Odds: $1 - 0.30 = 0.70$
      *   Full Kelly: $0.40 / 0.70 = 57\%$
      *   Half-Kelly: $28.5\%$
  5.  **Correlation:** None.
  6.  **Tournament:** You are 5th (outside top 3). Keep at 28.5%.
  7.  **Sanity:** 28.5% of $50 is $14.25. If you lose, you have $35. Still safe.
  *   **Decision:** **BET $14.**

  #### Case 2: The Correlated Trap
  *   **Market A:** "Will Football Team make playoffs?" (Price 40¢). You already bet $10 on YES.
  *   **Market B:** "Will Coach get fired?" (Price 70¢). You think NO (Price implies 70% chance he gets fired).
  *   **Logic:** You believe if they make playoffs, Coach stays. These are linked.
  *   **Bankroll:** $50.

  **Run the Procedure:**
  1.  **Survival:** Pass.
  2.  **Edge:** You know the team dynamics. Pass.
  3.  **Math for Market B:**
      *   You think Coach stays (30% chance fired). Market says 70% fired.
      *   Edge: $0.30 - 0.70 = -0.40$. (Wait, you are betting NO).
      *   Let's simplify: You see value. Say Half-Kelly calculates to 20% of bankroll ($10).
  4.  **Correlation Check:**
      *   You already have $10 on Playoffs (YES).
      *   You want $10 on Coach (NO).
      *   If Playoffs = NO, Coach likely = FIRED. You lose both bets.
      *   Total Risk: $20. That is 40% of your bankroll on one "story" (Team Performance).
      *   **Procedure Rule:** Total exposure to one story cannot exceed your Half-Kelly limit (which was ~28% in Case 1, let's say 25% here). 25% of $50 is $12.50.
      *   You are already at $10 exposure. You only have $2.50 room left.
  *   **Decision:** **BET ONLY $2.50 on the Coach market.** (Or skip it).
  *   **Why:** The procedure forces you to see that you aren't making two independent bets; you are doubling down on the same risk.

  #### Case 3: The Fun Longshot (The Answer You Won't Like)
  *   **Market:** "Will the Principal resign?"
  *   **Price:** 5¢ ($0.05).
  *   **Your Hunch:** "He looks tired. Maybe 15% chance?"
  *   **Bankroll:** $50. Rank: 1st Place.

  **Run the Procedure:**
  1.  **Survival:** Pass.
  2.  **Edge:** "He looks tired." **STOP.**
      *   *Procedure Check:* Is this a specific fact the market ignores? No. It's a vibe.
      *   *Even if you pass this:* Let's look at the math.
  3.  **Math:**
      *   Edge: $0.15 - 0.05 = 0.10$
      *   Odds: $1 - 0.05 = 0.95$
      *   Full Kelly: $0.10 / 0.95 = 10.5\%$
      *   Half-Kelly: 5.25% ($2.60).
      *   **Tournament Adjustment:** You are **1st Place**. You must play defense (Quarter-Kelly).
      *   New Bet: 2.6% ($1.30).
  4.  **Uncertainty Discount:** You admitted this is a "hunch." The procedure requires a specific fact in Step 2.
  *   **Decision:** **NO BET.**
  *   **Why:** You are in 1st place. Your goal is to stay there. A 5¢ contract based on a "vibe" has massive uncertainty. If you are wrong about your 15% estimate (and you probably are, because it's a vibe), you are donating money to the person who knows the Principal is signing a new contract next week. The procedure kills this bet because **preserving your rank is more valuable than the lottery ticket.**

  ---

  ### Part 4: Honest Limitations (What This Can't Do)

  I promised to be honest about where this procedure fails.

  1.  **It Can't Fix "Wanting to Win" vs. "Wanting Money":**
      If your real goal is to beat your friend specifically, rather than get a gift card, this math doesn't apply. You might need to bet wildly to surpass them. This procedure optimizes for *your* bankroll, not *relative* rank against a specific rival. If you are far behind 1st place, Half-Kelly might be too slow to catch them. You would need to intentionally overbet (gamble), knowing it increases bust risk.

  2.  **It Can't Quantify "Vibes":**
      Step 2 forces you to have a "specific fact." If your edge is truly intuitive (pattern recognition you can't explain), this procedure will tell you to skip it. That's a feature, not a bug. Most "vibes" are just bias. But if you are genuinely gifted at intuition, this procedure will underutilize you.

  3.  **It Assumes Liquidity:**
      This assumes you can always bet the amount the math says. In a high school club, there might not be enough money on the other side to match your $14 bet. If you can only bet $5, the math changes.

  4.  **The "Top 3" Cliff:**
      If you are in 4th place, $1 away from 3rd, and the semester ends tomorrow, Kelly is wrong. You should bet everything on the highest variance outcome. Kelly is for *repeated* games over a semester. If it's the final day, switch to "All or Nothing" mode.

  **Summary:** Use this checklist to stop yourself from betting on vibes and to protect your bankroll from correlation. If you follow the **Survival Check** and the **Correlation Check**, you will rarely bust. If you bust, it won't be because of the math; it will be because you skipped Step 2.
