answer: |-
  ### The Textualist–Purposivist Dispute in Post-Gricean Terms

  To map the American statutory interpretation debate onto post-Gricean semantics and pragmatics, we must treat the statute as an utterance, the legislature as the speaker, and the court as the hearer. The central disagreement concerns the locus of determinative content: whether it resides in the linguistic conventions governing the text or in the communicative intentions of the enacting body.

  **Textualism** maps primarily onto a commitment to **sentence meaning** and **what is said**. The textualist argues that the legal content of a statute is exhausted by its **minimal semantic content**, enriched only by context necessary to fix indexicals, resolve ambiguity, or disambiguate polysemy. Crucially, the context admitted is the **common ground** shared by the linguistic community at the time of enactment, not the private mental states of the drafters. For the textualist, the statute's **conventional implicatures** (entailments fixed by lexical items) are binding, but **conversational implicatures** derived from specific legislative motives are inadmissible.

  **Purposivism** maps onto **speaker meaning** and **what is implicated**. The purposivist contends that the semantic content is often underdetermined and that the determinative legal content is the **contextually enriched content** recovered by inferring the legislature's communicative intentions. This enrichment relies on a specific **context set**: the set of possible worlds compatible with the legislature's goals and the "mischief" the statute was designed to remedy. Purposivism treats the statutory text as evidence of **speaker meaning**, allowing **conversational implicature** to override or expand **what is said** when the literal semantic content fails to align with the intended purpose.

  ### Mapping the Elements

  **1. Sentence Meaning vs. Speaker Meaning**
  *   **Clean Map:** Textualism prioritizes sentence meaning (public linguistic conventions); Purposivism prioritizes speaker meaning (legislative intent).
  *   **Distortion:** Textualism in practice (e.g., "Public Meaning" originalism) accepts pragmatic enrichment. It is not strictly semantic; it allows context to determine **what is said**, provided the context is public. Thus, textualism is better described as a restriction on *which* common ground is admissible (public vs. private) rather than a rejection of pragmatics *tout court*.

  **2. What is Said vs. What is Implicated**
  *   **Clean Map:** Textualists restrict legal content to **what is said** (the proposition expressed). Purposivists allow **what is implicated** (the purpose) to determine the scope of the rule.
  *   **Distortion:** In law, "what is said" often carries normative force that "what is implicated" does not. In Gricean terms, an implicature is cancelable; in law, if a purpose is recognized, it is often as binding as the text. The distinction between said and implicated blurs when the "implicated" purpose is treated as part of the law's truth conditions.

  **3. Minimal Semantic Content vs. Contextually Enriched Content**
  *   **Clean Map:** Textualists argue for minimal enrichment (saturating only mandatory slots). Purposivists argue for free enrichment based on teleological parameters.
  *   **Distortion:** Legal "enrichment" is constrained by canons of construction (e.g., *ejusdem generis*) that function like grammatical rules but are not strictly semantic. These are pragmatic norms institutionalized as law.

  **4. Presupposition and Accommodation**
  *   **Clean Map:** Statutes often carry **presuppositions** (e.g., that a regulated activity exists). Textualists require these to be explicit or obvious from the text. Purposivists allow **accommodation** of presuppositions based on legislative history or societal need.
  *   **Distortion:** In conversation, accommodation is cooperative. In law, a court accommodating a presupposition effectively amends the statute, raising separation-of-powers concerns absent in dyadic communication.

  **5. Stalnakerian Common Ground and Context Set**
  *   **Clean Map:** The **context set** at $t_0$ (enactment) determines the proposition expressed. Textualists fix the context set to the public understanding at $t_0$. Purposivists allow the context set to include the private intentions of the majority coalition.
  *   **Distortion:** The legal context set is diachronic. The common ground at $t_1$ (adjudication) includes precedent and evolved societal norms, which Stalnakerian update semantics does not naturally accommodate without treating precedent as a new assertion updating the context.

  ---

  ### The Four Residues

  **1. The Collective Character of Legislative Intent**
  *   **Mapping:** **Cannot be expressed / High Distortion.**
  *   **Analysis:** Gricean pragmatics assumes a unitary speaker with a psychological state (intention) that the hearer recognizes. The legislature is a multi-member body with divergent, often contradictory intentions. There is no singular "speaker meaning" to recover.
  *   **Residue:** To make the Gricean model work, one must posit a "reasonable legislator" or aggregate intentions. This moves the analysis from empirical recovery of mental states to a constructive, normative fiction. The semantic framework lacks the machinery to handle *aggregated* intentionality where no single intention exists.

  **2. The Normative, Authority-Conferring Aspect**
  *   **Mapping:** **Cannot be expressed.**
  *   **Analysis:** Semantics and pragmatics describe truth conditions and information transfer. Law is inherently normative; it creates obligations. A court is not merely describing the proposition expressed by the legislature; it is acknowledging the legislature's *authority* to bind the court.
  *   **Residue:** The "binding" nature of meaning is an illocutionary force (directive) grounded in institutional status, not successful communication. A statute can be semantically clear but legally invalid (unconstitutional), or semantically ambiguous but legally binding via deference. The semantic framework captures the *content* but vanishes the *force* derived from the Rule of Recognition.

  **3. Precedent and Diachronic Amendment**
  *   **Mapping:** **Distorted.**
  *   **Analysis:** Standard Gricean communication is synchronic. Legal meaning is path-dependent. The **context set** for a statute at $t_{10}$ includes prior judicial interpretations ($t_1$ through $t_9$). Furthermore, later enactments can implicitly amend earlier ones.
  *   **Residue:** This requires a dynamic semantics where the meaning of an utterance is partially determined by subsequent utterances by different speakers (later Congresses, later Courts). While Stalnakerian context change potential handles updates, it does not handle *retroactive* re-determination of content via precedent, where the earlier utterance's meaning is fixed by later interpretive acts.

  **4. The Absurdity Canon**
  *   **Mapping:** **Distorted.**
  *   **Analysis:** The absurdity canon allows an interpreter to reject **what is said** if it leads to outcomes the legislature could not have intended. In pragmatics, this resembles a violation of the Maxim of Quality or Quantity triggering a search for an implicature that overrides the literal meaning.
  *   **Residue:** However, in Gricean terms, if the literal meaning is clear, the implicature should not contradict it (unless it's an irony/metaphor case). In law, the absurdity canon permits overriding clear semantic content based on *normative* consequences, not just communicative inference. It is a safety valve for the system's legitimacy, not a mechanism for recovering speaker meaning.

  ---

  ### Residue Report

  **What Survives Translation:**
  The core structural tension survives cleanly. The debate is indeed about whether the determinative content of the law is the **semantic content** (fixed by convention and public context) or the **pragmatically enriched content** (fixed by inferred intentions). The distinction between **what is said** (textualism) and **what is meant** (purposivism) captures the intuitive divide between the two camps. The tools of **disambiguation** and **indexical resolution** accurately describe the minimal context textualists accept.

  **What Is Subtly Altered:**
  The nature of "context" is altered. In semantics, context is whatever facilitates communication. In law, context is policed by institutional rules (e.g., reliance on legislative history is permitted for purposivists but forbidden for textualists). The translation obscures the *political* constraint on context. Furthermore, the mechanism of **enrichment** is altered: legal enrichment is often rule-governed (canons of construction) rather than inference-governed (Gricean maxims). The "Cooperative Principle" in law is not truth-seeking but governance-seeking.

  **What Vanishes Entirely:**
  1.  **Authority:** The reason the meaning matters (its binding force) vanishes. Semantics explains how we understand; law explains why we must obey.
  2.  **Collective Agency:** The psychological reality of speaker intention vanishes, replaced by a legal fiction of institutional intent.
  3.  **Diachronic Stability:** The requirement that meaning remain stable across time unless formally amended vanishes. In conversation, meaning is fluid; in law, stability is a virtue (reliance interests).

  ### Assessment

  Do these vanishing parts indicate a deficiency in the semantic framework, or do they suggest the legal disagreement is less substantive than practitioners suppose?

  The answer is both, but weighted toward the latter.

  The semantic framework is not *deficient*; it is *categorically distinct*. It is designed to model communication, not the exercise of political authority. The vanishing of the normative element shows that the textualist–purposivist dispute is not merely a dispute about linguistics. If it were, a semanticist could resolve it. The fact that semantic clarity does not end the legal debate proves that the debate is partly about **who has the authority to fix the context set**. Textualists argue the public fixes it (limiting judicial discretion); purposivists argue the judge, channeling the legislature, fixes it (maximizing equitable outcomes).

  However, the translation reveals that a significant portion of the legal disagreement *is* verbal. Much of the fighting over "intent" is a confusion between **speaker meaning** (psychological state) and **utterance meaning** (public content). Purposivists often conflate the two, assuming that recovering the psychological state is necessary for determining the utterance's legal effect. Textualists often conflate **minimal semantic content** with **public meaning**, ignoring that public meaning is already pragmatically enriched.

  The semantic framework exposes that the "hard cases" in statutory interpretation are not usually cases of semantic underdeterminacy. They are cases where the **context set** is contested. Once we strip away the residue of authority and collective agency, the dispute reduces to a disagreement over which pragmatic inputs are legitimate sources of law. The semantic framework suggests the legal theorists are tracking a real distinction (semantics vs. pragmatics), but they overlay it with a normative conflict (democracy vs. equity) that the linguistic vocabulary cannot capture. The "substance" of the disagreement lies not in the meaning of the text, but in the legitimacy of the interpreter's power to enrich it.
