          *   Map legal elements to semantic/pragmatic notions (cleanly, with distortion, or not at all).
          *   Address four specific "residues": (1) Collective legislative intent, (2) Normative/authority aspect, (3) Precedent/Amendment (diachronicity), (4) Absurdity canon.
          *   Provide a "Residue Report" (what survives, what alters, what vanishes).
          *   Conclude with an assessment (framework deficiency vs. legal disagreement illusory).
