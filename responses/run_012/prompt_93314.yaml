  2.  **Deconstruct the Legal Dispute (Textualism vs. Purposivism):**
      *   *Textualism:* Meaning is fixed by the linguistic content of the enacted text. Focus on public meaning, ordinary usage, context at the time of enactment. (Scalia, etc.)
      *   *Purposivism:* Meaning is determined by the aims/goals the legislature sought to advance. Focus on legislative intent, purpose, mischief rule. (Breyer, etc.)
      *   *Core Tension:* Is the law *what the words say* or *what the lawmakers meant to do*?

  3.  **Map to Semantics/Pragmatics:**
      *   *Textualism* $\approx$ Semantic Content / What is Said / Minimal Proposition / Public Meaning.
      *   *Purposivism* $\approx$ Speaker Meaning / Implicature / Contextually Enriched Content / Communicative Intention.
      *   *Statutory Text* $\approx$ Utterance.
      *   *Legislature* $\approx$ Speaker (problematic).
      *   *Judge* $\approx$ Hearer/Interpreter.
      *   *Enactment Context* $\approx$ Common Ground at $t_0$.
      *   *Adjudication Context* $\approx$ Common Ground at $t_1$.

  4.  **Drafting the Mapping (Section by Section):**

      *   *Sentence Meaning vs. Speaker Meaning:* Textualists prioritize sentence meaning (public linguistic conventions). Purposivists prioritize speaker meaning (legislative intent).
      *   *What is Said vs. What is Implicated:* Textualists stick close to "what is said" (modulo disambiguation/reference fixing). Purposivists allow "what is implicated" (purposes) to override or enrich "what is said."
      *   *Minimal vs. Enriched:* Textualists prefer minimal semantic content (context only for indexicals/ambiguity). Purposivists advocate for heavy pragmatic enrichment based on purpose.
      *   *Common Ground:* Textualists look at the common ground *of the public* at enactment. Purposivists look at the common ground *of the legislature* (often private or committee reports).

  5.  **Addressing the Four Residues:**

      *   *1. Collective Intent:* Grice assumes a unitary speaker with psychological states. Legislature is a multi-member body with divergent intentions. *Mapping:* Distorted. Requires aggregation functions or fictionalized agent.
      *   *2. Normativity:* Semantics is descriptive (truth conditions). Law is normative (binding force). *Mapping:* Vanishes/Cannot be expressed. "Ought" vs. "Is."
      *   *3. Diachronicity (Precedent/Amendment):* Grice is synchronic (utterance time). Law evolves. *Mapping:* Distorted. Requires dynamic semantics or context set updates over time (Stalnakerian assertion as context change potential), but legal precedent adds a layer of *authority* not present in conversation.
      *   *4. Absurdity Canon:* Overriding semantic content to avoid bad outcomes. *Mapping:* Distorted. Looks like a pragmatic override (implicature canceling literal meaning), but justified by normative constraints (legislature wouldn't intend absurdity) rather than cooperative principles.

  6.  **Developing the Residue Report:**
      *   *Survives:* The core tension between linguistic convention and communicative intention.
      *   *Altered:* The nature of "context" (public vs. legislative history), the mechanism of enrichment.
      *   *Vanishes:* The binding nature of the meaning (normativity), the specific institutional rules of standing/stare decisis.

  7.  **Formulating the Assessment:**
      *   Does the framework miss something? Or is the legal fight just verbal?
