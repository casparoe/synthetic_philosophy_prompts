      *   *Mapping:* Go through the requested terms.
      *   *Residues:* Tackle the four hard cases.
      *   *Report:* Summarize survival/alteration/vanishing.
      *   *Conclusion:* The "Authority Gap."

  11. **Final Polish:** Ensure precise phrasing like "contextual parameters," "propositional radical," "illocutionary force." (Wait, keep it to the requested list primarily, but specialist flavor is okay). Stick closely to the requested list: sentence/speaker meaning, said/implicated, conventional/conversational, minimal/enriched, presupposition/accommodation, Stalnakerian common ground.

      *(Self-Correction during drafting)*: Make sure to distinguish between "Public Meaning Textualism" (the dominant form) and strict literalism. Public meaning textualism actually relies heavily on pragmatics (contextual enrichment) but restricts the *source* of context to public understanding, not private intent. This is a crucial nuance for a semanticist.

      *(Refining the "Collective Intent" point)*: This is the biggest friction point. Gricean intent is psychological. Legislative intent is often constructive or aggregated. This needs to be highlighted as a category error in the mapping.

      *(Refining the "Normativity" point)*: Semantics gives truth conditions. Law gives action guides. The "binding" nature is illocutionary (directive) but grounded in institutional status, not just successful communication.

      *(Refining the "Absurdity" point)*: This is essentially a constraint on the context set. If the semantic content leads to a world outside the acceptable context set (absurdity), the interpreter accommodates a different meaning.

      *(Final Assessment)*: Lean towards the idea that the legal dispute is partly substantive (about authority) and partly verbal (about the bounds of pragmatics). The semantic framework exposes the verbal part but misses the substantive authority part.

