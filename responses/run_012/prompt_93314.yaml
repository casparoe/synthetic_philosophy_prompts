      *   *Nuanced View:* The semantic framework clarifies the *mechanism* of interpretation but fails to capture the *legitimacy conditions* of the outcome.

  8.  **Refining the Vocabulary (Self-Correction/Polishing):**
      *   *Check:* Did I use "Stalnakerian context set" correctly? Yes, as the set of possible worlds compatible with the common ground.
      *   *Check:* Did I distinguish conventional vs. conversational implicature? Textualists might accept conventional (fixed by words), purposivists lean conversational (inferred from intent).
