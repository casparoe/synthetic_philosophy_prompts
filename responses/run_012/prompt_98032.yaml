      *   *Assessment:* This is actually a solid, standard distinction in the literature. Malcolm is indeed verificationist/grammatical (if you can't verify it independently, the statement is nonsense). Dennett is indeed materialist/functionalist (the brain state *is* the experience, and if the brain state happens at waking, the experience happens at waking).
      *   *Risk:* The Wittgensteinian prof might think *both* are confused, or that distinguishing them doesn't solve the confusion. The empiricists might think *both* are wrong because the data shows dreams happen in sleep. The PP guy might think *both* are missing the point about prediction.
