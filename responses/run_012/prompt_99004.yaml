      *   *Philosophy:* He taught us about dispositions. Glass breaks. Foam stops it. Is it still fragile? Yes.
      *   *Application:* His kindness was a disposition. The illness was the foam.
      *   *The Hard Part:* Some say the illness took the kindness (fink). Why are they wrong? Because the base remained. The desire was there, the machinery failed.
      *   *Constraint:* No "he's looking down." No "he's just a pattern of acts."
      *   *Closing:* We honor the truth of him.

  6.  **Writing - Iteration 1 (Mental Check on Constraints):**
