      *   *Did I avoid afterlife?* Yes.
      *   *Did I avoid behaviorism?* Yes, need to emphasize the internal state.
      *   *Is it comforting?* Hopefully, by validating that the "real him" didn't vanish into the dementia/illness.
      *   *Word Count:* Need to expand on the argument to hit 700-900.

  7.  **Writing - Focusing on the "Why":**
      *   Why is it a mask? Because the *categorical base* (the neural/psychological structure of his care) was not the primary target of the degeneration until the very end; the *output* was. The frustration he showed is key evidence. If the disposition were gone (fink), he wouldn't care that he couldn't speak. His distress proves the disposition was trying to manifest.
