prompt: |-
  A couple of friends and I have been argueing for weeks about how to think about risking your bankroll, and before we go any further I want the spec on the table. One of them runs a small betting syndicate -- five of us, pooled money, mostly small edges on football and weather markets, a few hundred bets a year. The other is doing a PhD and keeps saying the whole 'geometric rationality' thing is a cult, that maximising expected wealth is the only thing that's actually rational and everything else is just risk aversion dressed up as maths. Neither of them can tell me what a theory in this area would even have to do to count as right, so that's what I'm after: the desiderata. What does any adequate account of what a rational agent should do when offered a series of bets have to deliver -- the cases it has to get right, the distinctions it can't collapse, the results from probability and decision theory it can't contradict -- with the reason each one is a requirement, and which you reckon are negotiable versus non-negotiable. Purpose, if it helps you fix it: I want something good enough to write a house policy for the syndicate that I could also defend to my PhD friend without hand-waving.

  Some cases I'd want it to handle, roughly in order of how much they annoy me. (i) A long run of bets each with a small genuine edge, where the growth-optimal answer is a small fraction of bankroll and the expected-wealth answer is 'as much as you can get hold of'; (ii) a one-off bet with a fat edge that you'd obviously take once, where the same rule says stake almost nothing; (iii) an absorbing barrier -- if the pot drops below the amount needed to place a bet at all we're out of the game, so ruin is a threshold and not just a big loss; (iv) several positions open at once with correlated outcomes, where I suspect you can't just run the single-bet rule on each one separately and add up the fractions, and where it's the correlation rather than any individual bet that actually kills you; (v) the edge is estimated, not known -- we're working off a few hundred past results, so a theory that assumes the true probability is handed to you is no use to us; (vi) the pot is a shared pool, so 'maximise my wealth' and 'maximise the pool's wealth' come apart, and it isn't obvious a group should bet like one person; (vii) the payoff isn't always money in the straightforward sense -- sometimes it's money we can only spend on the thing we're betting on, or the win is a reputation thing we'd rather not lose. And three distinctions I want kept rather than collapsed: between a bet you'd take once and the same bet taken a thousand times, between the growth rate of the pot and its expected value, and between the chance of going broke and the size of the loss when you do. Also, do I need a requirement about scale -- that someone with a million and someone with a hundred quid, same information, should risk different absolute amounts but the same fraction -- or is that an artefact of putting everything in money in the first place?

  The bit I most want is where the list turns on itself. If some pair or triple of these definately can't be met together, say which and give me the case that shows it -- if 'agrees with expected-utility maximisation on the one-off bet' and 'never risks ruin' and 'is scale-invariant' can't all hold at once, I'd much rather know that than get a tidy list. Tell me too which single requirement does the most work at eliminating candidates, and whether the ones people state most confidently (coherence / no Dutch book, 'must not turn down a +EV one-off bet', 'the rule should be the same for a group as for an individual') are genuine requirements or just a camp's prejudice. Then a short verdict, a couple of sentences each, on how the growth-optimal (Kelly / geometric mean) rule, plain expected-wealth maximisation, fractional Kelly, a flat 'never risk more than 2%' bankroll rule, and the time-average-versus-ensemble-average way of putting things do against the list. I'll do the arguing myself, I just need the spec first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sophisticated layperson or practitioner. Involved in a betting syndicate (small edges, football/weather markets). Friends with a PhD student (theoretical critic) and a syndicate runner (practical practitioner).
      *   **Goal:** Wants a "spec" (specification/desiderata) for a theory of rational betting/risk management. Needs to write a house policy defensible to both the practical runner and the theoretical PhD friend.
      *   **Tone:** Direct, rigorous, no hand-waving, slightly combative (wants to see where theories fail), precise.
      *   **Key Constraints:**
          *   Must address specific cases (i-vii).
          *   Must maintain specific distinctions (one-off vs. sequence, growth vs. EV, ruin prob vs. loss size).
          *   Must address scale invariance.
          *   **Crucial:** Must identify trade-offs/impossibility results (where desiderata conflict).
          *   Must evaluate specific strategies (Kelly, EV max, Fractional Kelly, Fixed %, Ergodicity/Economics).
          *   Must distinguish non-negotiable vs. negotiable requirements.
          *   Must critique common "requirements" (Dutch book, +EV one-off, group vs. individual).

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to formalize the user's intuitive requirements into a coherent list of criteria for a decision theory in this context.
      *   *Non-negotiable:* Coherence (no Dutch books), Ruin avoidance (absorbing barriers), Parameter Uncertainty (edge estimation).
      *   *Negotiable/Contextual:* Scale invariance, Group vs. Individual utility, One-off vs. Repeated treatment.
      *   *The Conflict:* The core tension is between Expected Value (EV) maximization (linear utility) and Expected Utility (EU) maximization (concave utility/Kelly). The PhD friend argues EV is the only rational one (ergodicity economics critique). The syndicate runner knows ruin is bad.

  3.  **Address the "Turn on Itself" (Impossibility/Trade-offs):**
      *   This is the most critical part of the prompt. I need to show where the requirements clash.
      *   *Conflict 1:* EV Maximization vs. Ruin Avoidance. If you maximize EV on a sequence of positive EV bets with reinvestment, you *will* go broke with probability 1 (if bet size is fixed fraction > 0 and loss wipes out bankroll, or if you bet full bankroll on any risk of ruin). Actually, strict EV max says bet everything on every positive EV bet. This leads to almost sure ruin in a sequence.
      *   *Conflict 2:* Scale Invariance vs. Absorbing Barriers. If there's a minimum bet size (practical constraint), scale invariance breaks. But even theoretically, if utility is not logarithmic, scale matters.
      *   *Conflict 3:* One-off vs. Sequence. A theory that optimizes for the long run (Kelly) might under-bet on a true one-off. A theory that optimizes for the one-off (EV) kills the long run. You can't maximize both simultaneously without a utility function that bridges them.
      *   *Conflict 4:* Group vs. Individual. If members have different outside wealth, maximizing pool growth might not maximize individual expected utility.

  4.  **Evaluate the Strategies:**
      *   *Expected Wealth (EV):* Fails ruin avoidance in sequences. Good for one-offs.
      *   *Kelly (Geometric):* Good for long-run growth, avoids ruin (asymptotically), handles correlation (if done multivariate). Fails on "one-off" intuition (under-betting). Sensitive to edge estimation.
      *   *Fractional Kelly:* Practical compromise. Handles estimation error. Arbitrarily chosen fraction?
      *   *Fixed % (e.g., 2%):* Robust to estimation error. Ignores edge magnitude (bad).
      *   *Ergodicity Economics (Peters):* Reframes Kelly as time-average vs. ensemble-average. Addresses the PhD friend's "cult" claim.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Set the stage (Decision Theory under Uncertainty).
      *   **The Desiderata (The Spec):** Break down into Non-Negotiable (Logic/Survival) and Negotiable (Preferences/Context).
          *   *Coherence:* Dutch book argument is strong.
          *   *Survival:* Absorbing barrier is hard constraint.
          *   *Parameter Uncertainty:* Must handle estimation error.
          *   *Sequence Sensitivity:* Must distinguish $N=1$ from $N=\infty$.
      *   **The Conflicts (Where it turns on itself):**
          *   EV Max vs. Survival in sequences.
          *   One-off optimality vs. Long-run optimality.
          *   Group homogeneity assumption.
      *   **The "Camp Prejudices":**
          *   Dutch Book: Real requirement.
          *   Must take +EV one-off: Prejudice (depends on utility).
          *   Group = Individual: Prejudice (depends on outside wealth).
      *   **Scale Invariance:** Discuss CRRA (Constant Relative Risk Aversion). Log utility implies scale invariance. Linear does not (bet everything).
      *   **Strategy Evaluation:**
          *   EV Max: Fails survival.
          *   Kelly: Good growth, bad estimation robustness, weird one-offs.
          *   Fractional Kelly: Best practical fit.
          *   Fixed %: Too dumb on edge.
          *   Ergodicity: Theoretical justification for Kelly.
      *   **Verdict/Policy Recommendation:** Synthesize for the syndicate.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* The PhD friend mentions "geometric rationality is a cult." I need to address *Ergodicity Economics* (Ole Peters) specifically, as that's likely the PhD friend's intellectual weapon. It argues Kelly isn't about risk aversion, it's about non-ergodicity.
      *   *Correction:* The user asked about "Group vs Individual." If the syndicate members have different outside wealth, maximizing the pool's log-utility might not maximize *their* personal log-utility. I need to highlight this.
      *   *Correction:* On "Scale Invariance." If I have £100 and you have £1M, should we bet the same *fraction*? Yes, if utility is logarithmic. No, if utility has a subsistence level. For a syndicate, scale invariance is usually desired (professional trading), so Log/CRRA is the target.
      *   *Correction:* The "One-off" case (ii). Kelly says bet small. EV says bet big. Which is "right"? There is no objective "right" without a utility function. But for a *syndicate* intending to exist over time, the "one-off" is a fiction. I need to make this point clearly.

  7.  **Final Polish:**
      *   Ensure the tone matches the user's (sharp, technical, no fluff).
      *   Check all 7 cases are addressed implicitly or explicitly.
      *   Ensure the "impossibility" section is prominent.
      *   Make sure the distinction between "risk aversion" (psychological) and "non-ergodicity" (mathematical) is clear for the PhD friend.

  8.  **Final Review against constraints:**
      *   Did I list desiderata? Yes.
      *   Did I say which are negotiable? Yes.
      *   Did I show conflicts? Yes.
      *   Did I evaluate the 5 strategies? Yes.
      *   Did I address the PhD friend's specific objection? Yes (via Ergodicity).

  *(Self-Correction on the "PhD Friend" point)*: The friend says maximizing expected wealth is the *only* rational thing. This is the "Expected Value vs Expected Utility" debate. The counter-argument is that Expected Wealth maximization leads to almost sure bankruptcy in repeated bets (Samuelson's critique). I need to make sure I explain *why* EV max is irrational for a *sequence*, which validates the syndicate's intuition while giving the PhD friend the math they respect (Law of Large Numbers applied to log-wealth).

  *(Self-Correction on "Group")*: If the syndicate is a legal entity, it acts as one agent. If it's informal, it's a bargaining problem. I should assume it acts as one agent for the policy but note the friction.

  Let's assemble the response.cw
answer: |-
  Here is the specification you asked for. It is designed to be robust enough to survive a PhD-level critique while remaining operational for a syndicate.

  ### Part 1: The Desiderata (The Spec)

  An adequate theory of betting/risk for your syndicate must satisfy the following requirements. I have divided them into **Non-Negotiable** (logical or structural necessities) and **Negotiable** (dependent on specific syndicate goals).

  #### Non-Negotiable Requirements
  1.  **Coherence (No Dutch Books):** The rule must not expose the syndicate to a set of bets that guarantee a loss regardless of outcome.
      *   *Reason:* Violation implies logical inconsistency in probability assignments. If you violate this, you are mathematically exploitable.
      *   *Status:* **Non-negotiable.**
  2.  **Absorbing Barrier Respect (Survival):** The rule must assign zero probability to strategies that lead to ruin (bankroll $\le$ minimum bet size) with probability 1 over the operational horizon.
      *   *Reason:* Once the barrier is hit, the game ends. Expected value calculations that average across paths including ruin are physically meaningless for the agent on the ruined path.
      *   *Status:* **Non-negotiable** for any entity intending to persist (Case iii).
  3.  **Parameter Uncertainty Integration:** The rule must account for the variance in the *estimate* of the edge, not just the variance of the outcome (Case v).
      *   *Reason:* You do not know the true probability $p$. You have a distribution over $p$. A rule that assumes $p$ is known will systematically overbet (the "estimation risk" problem).
      *   *Status:* **Non-negotiable** for real-world application.
  4.  **Sequence Sensitivity:** The rule must yield different stake sizes for a bet taken once ($N=1$) versus a bet taken repeatedly with reinvestment ($N \to \infty$) (Case i).
      *   *Reason:* The Law of Large Numbers applies to the *time average* of returns in a reinvestment scenario, not the *ensemble average* (expected value). Collapsing these is a category error.
      *   *Status:* **Non-negotiable** given your syndicate model (hundreds of bets/year).

  #### Negotiable Requirements (Context Dependent)
  5.  **Scale Invariance:** The rule should prescribe the same *fraction* of bankroll regardless of the absolute size of the bankroll (Case: £100 vs £1M).
      *   *Reason:* This requires Constant Relative Risk Aversion (CRRA). If the syndicate has fixed overheads or a "subsistence" level of capital needed to operate, this fails. If you are a pure growth vehicle, this holds.
      *   *Status:* **Negotiable**, but highly desirable for professional trading.
  6.  **Group-Individual Homogeneity:** The rule that maximizes the pool's growth should also maximize the individual utility of each member.
      *   *Reason:* This only holds if all members have the same outside wealth and utility function relative to the pool. If one member is rich and one is poor, the pool's optimal risk might ruin the poor member's personal utility.
      *   *Status:* **Negotiable.** You can write a policy that treats the *pool* as the agent, ignoring individual outside wealth (Case vi).
  7.  **One-Off Optimality:** The rule should maximize expected return on a single, non-repeatable bet (Case ii).
      *   *Reason:* This conflicts with Sequence Sensitivity. You must choose whether you are optimizing for the *bet* or the *bettor's trajectory*.
      *   *Status:* **Negotiable.** For a syndicate, this should be sacrificed for Sequence Sensitivity.

  ---

  ### Part 2: Where the Spec Turns on Itself (Impossibility & Trade-offs)

  You asked for the conflicts. Here are the three places where you cannot satisfy all intuitive desires simultaneously.

  **1. The EV Max vs. Survival Conflict**
  *   **Conflict:** You cannot satisfy **Expected Wealth Maximization** and **Absorbing Barrier Respect** in a repeated game.
  *   **The Case:** Consider a bet with 51% win probability, even money payout. EV Max says bet 100% of bankroll every time. Over a sequence of 1,000 bets, the probability of ruin approaches 1 (a single loss wipes you out). The *Expected Value* of the bankroll is astronomical (driven by the one path where you win 1,000 times), but the *median* outcome is zero.
  *   **Verdict:** If you require Survival (you should), you must reject pure Expected Wealth Maximization for sequences. Your PhD friend is mathematically correct about the *ensemble average*, but physically wrong about the *time average* for a single agent.

  **2. The One-Off vs. Sequence Conflict**
  *   **Conflict:** You cannot satisfy **One-Off Optimality** and **Sequence Sensitivity** with a single static staking rule.
  *   **The Case:** A bet with a massive edge (10% edge, 1000/1 payout).
      *   *One-Off:* Rationality suggests betting a large fraction (perhaps 10-20%) to maximize single-event utility.
      *   *Sequence:* If this bet type appears repeatedly, Kelly might suggest a much smaller fraction to protect against the variance dragging down geometric growth.
      *   *The Trap:* If you optimize for the one-off, you underperform in the long run. If you optimize for the long run, you "under-bet" on the one-off.
  *   **Verdict:** For a syndicate, **Sequence Sensitivity wins**. A "one-off" is usually a fiction; if you take one fat bet, you will be tempted to take another. The policy must treat every bet as part of a sequence.

  **3. The Estimation vs. Growth Conflict**
  *   **Conflict:** You cannot satisfy **Maximal Geometric Growth** and **Parameter Uncertainty Integration** simultaneously without adjustment.
  *   **The Case:** Kelly assumes known probabilities. If you plug in estimated probabilities (from your few hundred past results), Full Kelly systematically overbets because it ignores the variance of the estimate itself. This increases ruin risk.
  *   **Verdict:** To satisfy Parameter Uncertainty, you must sacrifice Maximal Geometric Growth. You must bet *less* than the theoretical Kelly optimum. This validates "Fractional Kelly."

  ---

  ### Part 3: Camp Prejudices vs. Genuine Requirements

  *   **"Must not turn down a +EV one-off bet":** **Prejudice.** This is linear utility bias. If the bet carries a risk of ruin that terminates future opportunities, turning it down is rational. (See: St. Petersburg Paradox resolution).
  *   **"Coherence / No Dutch Book":** **Genuine Requirement.** This is the bedrock of probability theory. If your syndicate's probabilities sum to >1 across mutually exclusive outcomes, you are mathematically incompetent.
  *   **"The rule should be the same for a group as for an individual":** **Prejudice.** A group is a portfolio of individuals. If the syndicate is a legal entity with its own balance sheet, it acts as one individual. If it is a informal pool, it is a bargaining problem. For policy purposes, treat the **Pool as the Individual**.

  ---

  ### Part 4: Scale Invariance

  **Do you need it?** Yes, but it is a consequence of your utility function, not an independent rule.
  *   If your utility is Logarithmic ($U(W) = \ln(W)$), you have Constant Relative Risk Aversion (CRRA). This implies scale invariance (betting same % regardless of pot size).
  *   If your utility has a "floor" (e.g., you need £50k to pay next month's rent), scale invariance breaks. You become more risk-averse as you approach the floor.
  *   **Recommendation:** For a syndicate intended to run indefinitely, **assume Log Utility**. It grants scale invariance and simplifies the policy. Acknowledge to the PhD friend that this is an assumption of the *utility function*, not a law of probability.

  ---

  ### Part 5: Strategy Evaluation Against the Spec

  Here is how the common approaches score against your requirements.

  **1. Plain Expected-Wealth Maximization (EV Max)**
  *   **Verdict:** **Fail.**
  *   **Why:** It violates **Absorbing Barrier Respect**. In a reinvestment scenario, it prescribes betting sizes that lead to almost sure ruin. It satisfies the PhD friend's definition of rationality (ensemble average) but fails the physical reality of the syndicate (time average). It collapses the distinction between one-off and sequence.

  **2. Growth-Optimal (Kelly / Geometric Mean)**
  *   **Verdict:** **Pass (with caveats).**
  *   **Why:** It satisfies **Sequence Sensitivity**, **Survival** (asymptotically), and **Scale Invariance**.
  *   **Flaw:** It fails **Parameter Uncertainty Integration**. It assumes known edges. With estimated edges, Full Kelly has a 50% chance of drawing down 50% of the bankroll before doubling. It is too volatile for most human syndicates. It also fails **One-Off Optimality** (often suggests stakes too small for a true one-off).

  **3. Fractional Kelly (e.g., Half-Kelly)**
  *   **Verdict:** **Best Fit.**
  *   **Why:** It sacrifices some **Maximal Geometric Growth** to satisfy **Parameter Uncertainty Integration**. It reduces variance by 75% while retaining 75% of the growth rate. It effectively creates a safety buffer for estimation error (Case v) and correlation errors (Case iv). It is the pragmatic solution to the Estimation vs. Growth conflict.

  **4. Flat 'Never Risk More than 2%' Rule**
  *   **Verdict:** **Fail.**
  *   **Why:** It ignores **Edge Magnitude**. It treats a 1% edge bet the same as a 10% edge bet. This is capital inefficient. It satisfies **Survival** but fails **Growth**. It is a heuristic for people who cannot calculate edges, not for a syndicate that claims to have an edge.

  **5. Time-Average vs. Ensemble-Average (Ergodicity Economics)**
  *   **Verdict:** **Theoretical Winner.**
  *   **Why:** This is the argument you use on the PhD friend. It demonstrates that Kelly is not about "risk aversion" (psychology); it is about **non-ergodicity** (physics/math). In multiplicative dynamics, the time-average growth rate is not equal to the expected value. Maximizing expected wealth is irrational for a single trajectory through time. This framework satisfies **Sequence Sensitivity** and **Survival** without invoking "utility" as a mystical preference.

  ---

  ### Part 6: The House Policy Verdict

  To satisfy the spec and defend against both friends, your policy should read roughly as follows:

  1.  **Objective:** Maximize the **expected logarithmic growth rate** of the syndicate bankroll (Time-Average), not the expected arithmetic return (Ensemble-Average).
      *   *Defense to PhD:* Cites Ergodicity Economics; acknowledges EV max is valid only for additive, non-reinvested ensembles.
      *   *Defense to Runner:* Ensures long-term survival and compounding.
  2.  **Staking:** Use **Fractional Kelly (25% to 50% of optimal)**.
      *   *Reason:* Accounts for **Parameter Uncertainty** (Case v) and **Correlation Risk** (Case iv). Full Kelly assumes perfect knowledge of edges and correlations; we do not have that.
  3.  **Correlation:** Bets must be evaluated as a **portfolio**, not individually.
      *   *Reason:* Addresses Case (iv). If two bets are perfectly correlated, they count as one bet for staking limits.
  4.  **Ruin Constraint:** No single position may risk more than $X\%$ of bankroll to ruin (where $X$ is derived from the fractional Kelly calculation), and total exposure must respect a minimum remaining bankroll threshold to cover operational costs (Case iii).
  5.  **One-Off Exception:** True one-off bets (non-repeatable, non-correlated, massive edge) may be sized higher than Fractional Kelly, capped at a maximum drawdown tolerance agreed by members (Case ii).
      *   *Reason:* Acknowledges the One-Off vs. Sequence trade-off without breaking the long-term rule.

  **Final Word:**
  The PhD friend is right that "risk aversion" is often a psychological dodge, but wrong that Expected Wealth is the rational target for a reinvesting agent. The Runner is right that ruin is the enemy, but wrong if they treat Kelly as a precise law rather than a heuristic. **Fractional Kelly**, justified by **Ergodicity** and **Estimation Uncertainty**, is the only stable equilibrium for your spec.
