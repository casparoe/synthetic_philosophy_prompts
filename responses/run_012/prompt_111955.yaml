  10. **Final Polish:** Ensure the distinction between *individual welfare* and *species engineering* is the core theme. (This matches the user's "don't change what a sentient species is" but refines it to apply only to *wild* species).

  **(Self-Correction on the Lab Mouse point):** The user says "we built them." That's the key. The principle isn't "don't change sentient species," it's "don't change *wild* sentient species without consent/responsibility." Lab mice are property/wards. Wild mice are not.

  **(Self-Correction on the Parasite):** Why is wiping out a parasite okay? Because we generally don't attribute "integrity" or high sentience to parasites in the same way. It's disease eradication.

