  3.  **Analyze the User's Proposed Principle:**
      *   *Principle:* "Relieving pain in individuals, fine; wiping out a non-sentient species, fine; but don't change what a sentient species is."
      *   *Critique:* User correctly identifies the tension with lab mice (we *do* change what that sentient species is). Also feels like "squeamishness about gene editing."

  4.  **Brainstorming Alternative Principles:**

      *   *Hypothesis A: The "Stewardship/Responsibility" Principle.*
          *   We are responsible for suffering we cause or manage directly.
          *   Lab mice: We made them. (Fine)
