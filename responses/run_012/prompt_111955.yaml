      3.  *Gene drive wild mice:* **Sick/Wrong.** (Reason: Permanent species alteration, lack of consent, ecological hubris?).
      4.  *Kill predators in reserve:* **Wrong.** (Reason: "Petting zoo," unnatural, violates integrity of wildness).
      5.  *Wipe out parasite:* **Fine.** (Reason: Parasite likely non-sentient/less sentient, pure harm reduction).
      6.  *Predator sterility drug:* **Unsure/Dislike.** (Reason: Slow extinction, manipulation of existence).
