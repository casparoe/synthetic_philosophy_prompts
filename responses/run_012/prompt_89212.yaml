answer: |-
  Your position is the dominant one in contemporary philosophy of biology. It aligns with the "polythetic" or "cluster" view championed by philosophers like Edouard Machery and Carol Cleland. You argue that "life" is a pragmatic tool, not a joint in nature. To refute this, I cannot rely on intuition or dictionary definitions; I must show that treating life as a conventional stipulation renders our best science less explanatory, less predictive, or factually incorrect about causal structures.

  Here is an attempt to move you, ranked by the weight of the argument, addressing your specific constraints.

  ### 1. What Would Count Against This? (Ranked)

  **Tier 1: The Explanatory Indispensability Argument**
  The strongest evidence against your conventionalism would be a discovery showing that the category "life" supports **robust inductive inferences** that no other combination of properties supports.
  *   **The Discovery:** We find a universal constraint on physical systems—perhaps a specific thermodynamic signature (e.g., a bound on entropy production per bit of information processed) or an information-theoretic law (e.g., a specific threshold of algorithmic complexity required to sustain non-equilibrium states)—that is obeyed by everything we pre-theoretically call alive and violated by everything we do not, *including* the borderline cases.
  *   **Why it moves you:** If "life" picks out a regime of physics that allows for specific predictions (e.g., "systems in this regime will inevitably evolve resistance to this toxin"), then "life" is functioning as a natural kind in the only sense science cares about: projectability. If the convention fails to predict but the "kind" succeeds, the convention is factually inadequate.

  **Tier 2: The Phylogenetic Fact**
  *   **The Discovery:** A comprehensive mapping of the "causal network" of Earth's biosphere reveals that certain entities (e.g., giant viruses) are nodes in the same evolutionary causal web as bacteria and eukaryotes, while others (e.g., fire, crystals) are not.
  *   **Why it moves you:** This suggests "life" is not defined by properties (metabolism, reproduction) but by **historical connectedness**. If an entity is a product of the terrestrial evolutionary process, it is alive. This makes "life" a historical natural kind (like "descendant of the Big Bang"). The fact of the matter is genealogical, not functional.

  **Tier 3: The Substrate-Independence Convergence**
  *   **The Discovery:** In synthetic biology or astrobiology, we create or find systems with radically different chemistries (e.g., silicon-based, non-DNA) that nonetheless converge on the *same* functional topology as Earth life.
  *   **Why it moves you:** If vastly different substrates converge on the same dynamic organization, it suggests a "attractor state" in the space of physical possibilities. Life would be a "phase of matter." This makes it a natural kind akin to "liquid" or "superconductor," rather than a stipulative list.

  ### 2. The Water/Gold Analogy: Why It Fails and How to Fix It

  You ask why the Kripke/Putnam move ("point and hand over to science") fails here.

  **Why it fails:**
  Water and Gold are **substance kinds**. They are defined by microstructural essence (H₂O, Au). You can point to a sample because the sample persists through time as a static chunk of stuff. Life is a **process kind**. You cannot point to "life" in the same way; you point to a *trajectory*. If you freeze a bacterium, is it alive? If you point to the ice, you are pointing to a paused process. The "ostensive definition" fails because the referent is dynamic, not static.

  **The Analogous Discovery:**
  For the analogy to hold, we would need to discover that life is a **thermodynamic phase**.
  *   **The Scenario:** Imagine we discover that all living systems, regardless of chemistry, maintain a specific ratio of energy flux to information storage that is physically impossible for non-living dissipative structures (like hurricanes or flames) to sustain over long durations without a specific control architecture.
  *   **The Result:** Just as "Water = H₂O" corrected the pre-theoretic inclusion of "heavy water" or exclusion of "ice," this physical law would correct our biological boundaries. It would show that viruses *are* alive (or aren't) based on whether they participate in this thermodynamic regime, not based on our stipulation.

  ### 3. The Two Test Cases: Misdescription vs. Stipulation

  Let us apply the criteria to your two cases.

  **Case A: The Immortal Soma** (Self-maintains/repairs, no reproduction/variation).
  *   *Metabolism:* Alive.
  *   *Evolution:* Not Alive.
  *   *Verdict:* Conventionalism says "stipulate." Realism asks: **What is it doing?** It is resisting entropy locally. It is an agent. To call it "dead" feels like a misdescription because it exhibits *teleology* (goal-directed behavior) without lineage.
  *   *The Fact:* If this system can learn and adapt within its lifetime, it participates in the "agency" cluster. Excluding it breaks the link between life and cognition.

  **Case B: The Naked Replicator** (Self-replicates, no metabolism).
  *   *Metabolism:* Not Alive.
  *   *Evolution:* Alive (if variation exists).
  *   *Verdict:* This is the virus/prion case. To call it "alive" feels like a misdescription because it is causally inert outside a host. It is more like a seed or a spore than an organism.
  *   *The Fact:* However, if we discover that Case B systems *drive* the evolution of Case A systems (e.g., viral shunt in oceans), then excluding them from "life" severs a causal link in the biosphere.

  **The Refutation:**
  The feeling of "misdescription" arises because our pre-theoretic concept of life tracks **causal power**, not just checklists. If a definition forces us to say a causally potent system is "dead," the definition is failing to track the reality of the causal network.

  ### 4. Practical Contexts: Where Convention Fails

  You ask if contexts like planetary protection or patent law tell for or against you. They tell **against** you, but subtly.

  **Planetary Protection (The "Plain Fact" Case):**
  Imagine we land on Enceladus. We find a self-replicating crystal (Case B).
  *   *Conventionalist:* "We stipulate this is non-life. No sterilization needed."
  *   *Realist:* "If this system interacts with Earth biology, it poses a risk. The risk is a fact of the matter."
  *   **The Argument:** If we treat it as non-life and it subsequently consumes our biosphere (or vice versa), we did not make a semantic error; we made a **factual error about causal compatibility**. The "fact of the matter" is not the label "alive," but the **potential for biospheric integration**.
  *   **The Move:** If the decision *must* be made (sterilize or not), and there is a correct answer (sterilize, because it creates a hazard), then the category driving that decision tracks a real property (hazardous biological compatibility). If "life" is the proxy for that property, then "life" tracks reality.

  **Determination of Death:**
  *   *Context:* A patient is brain-dead but metabolically active via machines.
  *   *Conventionalist:* "We stipulate death occurs at brain cessation."
  *   *Realist:* "The integration of the organism as a whole has ceased."
  *   **The Fact:** There is a fact of the matter about whether the system is an integrated whole or a collection of tissues. If the concept of "life" is meant to track "integrated organismal agency," then brain death is a factual boundary, not a conventional one. The convention merely identifies the boundary; it does not create it.

  ### 5. Insulation: Defect of Position or Question?

  You ask if the conventionalist's ability to reassign awkward cases is a defect. **It is a defect of the position.**

  A theory that is immune to empirical evidence is not a philosophical insight; it is a tautology. If you can always say, "I'll just define that out of the category," you render the category useless for science. Science requires categories that **risk being wrong**.
  *   **Cluster vs. Convention:** You suggest "vague cluster concept" is better. I agree, but I push further: A **Homeostatic Property Cluster (HPC)** is a *realist* position, not a conventionalist one.
  *   **The Difference:** A convention says, "We group these because it's useful." An HPC says, "We group these because there is a homeostatic mechanism (e.g., natural selection) that causes these properties to co-occur."
  *   **The Fact:** The "fact of the matter" is the existence of the homeostatic mechanism. If natural selection is the glue holding the cluster together, then anything subject to natural selection is part of the kind. That is not stipulation; it is causal history.

  ### 6. The Case That Should Move You Most

  You asked to be moved by a case where something has to be decided and there is a plain fact of the matter.

  **The Case: The Shadow Biosphere**
  Suppose we discover a microbe on Earth that uses a different genetic code and does not share a common ancestor with the rest of the Tree of Life (a true second genesis).
  *   **Conventionalist Verdict:** "It's a matter of stipulation. If we define life as 'Earth-descended,' it's non-life. If we define it as 'metabolic,' it's life."
  *   **The Plain Fact:** This system **competes** with us for resources. It **evolves** in response to our antibiotics. It is part of the **ecological network**.
  *   **The Refutation:** If we classify it as "non-life" (chemical artifact) and it wipes out a crop, we were wrong. Not semantically wrong, but **ecologically wrong**. The "fact of the matter" is its membership in the **biospheric causal web**.
  *   **Conclusion:** "Life" is the name we give to the **causal network of self-propagating, adaptive systems**. Whether a specific entity is "alive" is not a binary essence check, but a measure of its **coupling to that network**.
      *   Viruses? Loosely coupled (Alive).
      *   Mules? Tightly coupled but terminal (Alive).
      *   Fire? Not coupled (Not Alive).

  **Summary:**
  Your position holds if "life" is a static noun. It fails if "life" is a dynamic verb describing a specific mode of physical organization. The "fact of the matter" is not found in a checklist of properties, but in the **causal role** the system plays in the universe. If a system plays the causal role of life (resisting entropy, evolving, integrating), it is alive. To deny this is to deny the causal structure of the world in favor of semantic hygiene.
