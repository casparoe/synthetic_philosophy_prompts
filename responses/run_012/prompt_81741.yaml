prompt: |-
  I've been lurking on the rat-adjacent blogs for like a decade (read the Sequences, still not sure I actually "get" Newcomb) and I've got a pile of gut calls about the prisoner's dilemma that I can't get to sit under one rule. Help me figure out what I actually believe, and which of my calls is the broken one.

  Ground rules for all of these: one-shot PD, standard payoffs (T>R>P>S, and 2R>T+S), no repeat interaction, opponents are strangers, unless I say otherwise.

  1. Vanilla. Anonymous stranger, we never meet again, nobody watching. I defect and I feel zero guilt.

  2. Same as 1, except I'm told the other player is a copy of me -- they scanned me last week and this is the fork, same code, and it knows it. I cooperate, and defecting feels like betraying myself. The feeling is way stronger than the setup seems to warrent.

  3. Same as 1, except a predictor already ran and locked in the stranger's move: it cooperates iff it predicted I cooperate. I cooperate.

  4. Iterated, exactly 100 rounds, both of us know it's exactly 100. I'd cooperate for ages and defect on round 100, and I feel fine about that last defection even though I know it should unravel backwards if I really believed it.

  5. Iterated, unknown horizon -- after each round there's a 98% chance of another. I open with cooperate, mirror defection, forgive a little. Tit-for-tat-ish, basically.

  6. Different role. I'm not playing, I'm writing the strategy for one agent in a big lab tournament: thousands of anonymous agents, random one-shot pairings, no repeats, total score summed at the end. My gut says write cooperate, and I feel real contempt for whoever writes a clever defector -- but I'll admit the defector probably scores higher than me.

  So 1, 2, 3, 5, 6 all feel right to me, and 1 and 6 look like they're telling me opposite things. My tentative rule is: cooperate when the other player's move is a function of mine (same code, same deliberation, or my move causally shaping theirs); defect when their move is independent of mine. That gets 1, 2, 3, 5. It says defect in 6, but my gut says cooperate in 6. And I suspect it's missing something about the *population* in 6 -- like the question there is definately a different question than in 1.

  Is there one principle that saves all six? If not, which do I drop, and why that one? State the principle precisely enough that I could apply it to a new case without asking you again, and tell me which clause each of my verdicts is doing the work for. Then tell me what it says about a case I haven't listed: a one-shot, and the other player is a separate machine running the exact same algorithm as me -- not a copy, a whole different person, but our outputs are necessarily identical. Is that 1 or 2? And if your principle handles that but needs an extra clause to handle 6, say so out loud instead of quietly bolting it on.

  Also, if my rule is just motivated reasoning dressed up as decision theory, please say so plainly.
