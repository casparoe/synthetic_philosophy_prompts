answer: |-
  # Workshop Activity: The Pledge Ledger

  **Objective:** To viscerally demonstrate the mechanics, benefits, and moral tensions of "moral trade" (cooperative prioritization) without initially using that terminology.
  **Participants:** 16 (Graduate/Advanced Undergrad)
  **Time:** 90 Minutes
  **Materials Needed:**
  *   16 **Portfolio Cards** (Private)
  *   160 **Effort Tokens** (10 per player, any color)
  *   4 **Cause Buckets** (Labeled A, B, C, D placed at front of room)
  *   **The Pledge Ledger** (Whiteboard or projected spreadsheet)
  *   **Pledge Slips** (Small index cards, 2 per player)
  *   Timer

  ---

  ## Part 1: Materials Design

  ### 1. The Causes (Public)
  Label four buckets at the front of the room. Do not give them moral names yet; use abstract labels to prevent immediate ideological locking.
  *   **Cause A:** (e.g., "Immediate Relief")
  *   **Cause B:** (e.g., "Systemic Reform")
  *   **Cause C:** (e.g., "Future Resilience")
  *   **Cause D:** (e.g., "Non-Human Welfare")

  ### 2. The Portfolio Cards (Private)
  Each player receives one card. This defines their **Utility Weights**.
  *   **Rule:** You have 10 Effort Tokens. You *must* allocate at least 1 Token to every Cause (Forced Diversification). You may allocate the remaining 6 tokens however you wish.
  *   **Scoring:** At the end, your score = $\sum (\text{Tokens held on Cause}_X \times \text{Your Weight}_X)$.
  *   **Distribution:** Create 4 Archetypes (4 players each). Ensure no two players in a trading pair have the same top priority.

  | Archetype | Weight A | Weight B | Weight C | Weight D | Strategic Desire |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Type 1** | 10 | 2 | 1 | 1 | Wants A-units above all. |
  | **Type 2** | 1 | 10 | 2 | 1 | Wants B-units above all. |
  | **Type 3** | 2 | 1 | 10 | 2 | Wants C-units above all. |
  | **Type 4** | 1 | 2 | 1 | 10 | Wants D-units above all. |

  *(Note: Distribute cards randomly, but try to seat Type 1s near Type 2s, etc., to encourage interaction.)*

  ### 3. The Pledge Slip (The Contract)
  To trade, two players must fill out a slip and submit it to the Ledger.
  *   **Party 1:** Pledges to transfer ownership of [X] Tokens on Cause [__] to Party 2.
  *   **Party 2:** Pledges to transfer ownership of [Y] Tokens on Cause [__] to Party 1.
  *   **The Justification Clause:** *Both parties must sign a single sentence below explaining why this trade is morally permissible.*
      *   *"We agree this trade is permissible because..."*
  *   **Verification:** The Facilitator (you) acts as the Registrar. You will reject slips with blank or incoherent justifications.

  ---

  ## Part 2: Session Timeline (90 Minutes)

  ### 0:00 – 0:10 | Introduction & Setup
  *   **Hand out Portfolio Cards.** Emphasize: *Keep weights private.*
  *   **Explain the Goal:** "Maximize your personal score."
  *   **Explain the Constraint:** "You must place at least 1 Token in every bucket. You cannot place more than 10 total."
  *   **Silent Phase (3 mins):** Players allocate their initial 10 tokens into the buckets based on their private weights.
  *   **Initial Score Check:** Ask players to calculate their "Baseline Score" silently. (With forced diversification, this will be suboptimal).

  ### 0:10 – 0:30 | Phase 1: The Free Market
  *   **Open Negotiation.** Players stand and mingle. They can propose trades.
  *   **Mechanism:** "I will move 2 of my tokens from Bucket B to Bucket A, and transfer *ownership* of those tokens to you. In exchange, you do the same for me on Bucket C."
  *   **Recording:** When a deal is struck, they fill out a **Pledge Slip** and bring it to you. You record it on the **Public Ledger** (e.g., "Player 3 transfers 2 A-tokens to Player 7").
  *   **Rule:** Trades are binding. Once on the Ledger, tokens belong to the new owner for scoring.
  *   **Facilitator Note:** Do *not* enforce the Justification Clause strictly yet. Let them trade quickly. Watch for chaos.

  ### 0:30 – 0:40 | The Intervention: The Court of Justification
  *   **Stop the Room.**
  *   **Announce:** "We have noticed trades happening without moral reasoning. From now on, a trade is **void** unless both parties can publicly state a justification the other accepts, written on the slip."
  *   **Demonstration:** Pick one completed trade. Ask the pair: "Why was this permissible?" If they say "It helped us win," reject it. Push for: "It respected our agency," or "It increased total welfare without violating constraints."
  *   **Resume Trading.**

  ### 0:40 – 1:00 | Phase 2: Deliberative Trading
  *   Players continue trading, but now they must draft the justification. This slows the pace and forces philosophical articulation.
  *   **Mid-Point Shock (Optional):** At 0:50, announce: "Cause C has become twice as urgent." (Double the weight of C for everyone). Observe if contracts hold or break. (Recommendation: Skip this for first run to keep it stable, focus on the justification rule).

  ### 1:00 – 1:10 | Scoring & Reveal
  *   **Freeze.** No more tokens move.
  *   **Calculate:** Players sum their held tokens $\times$ private weights.
  *   **Reveal:** Ask for a show of hands: "Who improved their score compared to Baseline?" (Hopefully all).
  *   **Reveal Portfolios:** Ask players to reveal their Type (1-4). Show how divergence enabled the gains.

  ### 1:10 – 1:30 | Debrief (The Philosophical Mapping)
  *   *See detailed script below.*

  ---

  ## Part 3: Debrief Script & Mapping

  Do not lecture. Ask questions that lead them to the concepts.

  **1. The Divergence Condition (Comparative Advantage)**
  *   *Ask:* "Look at the people who gained the most points. Compare your Portfolio Card with your trading partner's. What was the relationship between your weights?"
  *   *Concept:* **Gains from Trade require Divergence.** If we all valued Cause A equally, trading A-tokens would be zero-sum. Moral trade relies on the fact that we prioritize different goods.
  *   *Theory:* This maps to the economic argument for moral trade (Toby Ord, William MacAskill). We specialize where we have comparative advantage in *moral value*, not just productivity.

  **2. The Role of Commitment (The Ledger)**
  *   *Ask:* "What would have happened if the Ledger wasn't public? If you could privately lie about where you put your tokens?"
  *   *Concept:* **Verification & Binding Pledges.** Moral trade fails without trust or enforcement. The Ledger acted as a commitment device.
  *   *Theory:* This maps to the problem of *compliance*. In the real world, we lack a global Ledger. We rely on reputation or institutional structures.

  **3. The Justification Rule (Integrity & Corruption)**
  *   *Ask:* "When I enforced the Justification Clause, did it change *what* trades you made, or just *how* you described them?"
  *   *Ask:* "Did anyone feel uncomfortable trading away tokens on a cause you valued, even if it was rational? Did it feel like 'selling out'?"
  *   *Concept:* **The Integrity Objection.** Critics argue moral trade corrupts the agent by turning moral commitments into negotiable assets.
  *   *Theory:* This surfaces the Kantian worry: Can you treat moral duties as commodities? The game forces you to articulate why the trade *preserves* integrity (e.g., "We are cooperating to maximize the good, not abandoning the good").

  **4. The "Real Commitment" Objection**
  *   *Ask:* "If you were willing to trade your pledge on Cause A, did you ever really care about Cause A? Or was it just points?"
  *   *Concept:* **Sincerity.** If a commitment is tradable, is it a commitment?
  *   *Theory:* This addresses the suspicion that effective altruism reduces morality to a calculus. The game shows that *outcomes* improved, but asks if the *moral stance* was diluted.

  ---

  ## Part 4: Predictable Failure Modes & Mitigation

  **1. The "Market Corner" (Coalitions)**
  *   *Risk:* 4 Type 1 players realize they can form a cartel, ignore everyone else, and swap tokens amongst themselves to bypass the "Forced Diversification" rule effectively.
  *   *Mitigation:* **The Anti-Trust Rule.** Announce at the start: "You may trade with any individual partner a maximum of 4 tokens." This forces broad engagement.

  **2. The "Moral Purist" (Refusal to Trade)**
  *   *Risk:* One participant refuses to trade on principle ("I shouldn't support Cause B even if it helps my score"). They stall their partner.
  *   *Mitigation:* **The "Observer" Role.** If a player refuses, allow them to sit out as an "Auditor." Their job is to grade the Justifications of the other traders. This keeps them engaged in the philosophy without blocking the mechanics. *Note: In debrief, highlight this player. They represent the Deontological Objection.*

  **3. The "Justification Loophole"**
  *   *Risk:* Players write "Because we both want points" on every slip to save time.
  *   *Mitigation:* **You must be the Gatekeeper.** Reject the first 3 "instrumental" justifications publicly. Say: "That explains why you *did* it, not why it is *permissible*." Force them to find normative language (e.g., "Mutual aid," "Efficiency").

  **4. Time Overrun**
  *   *Risk:* Negotiation drags.
  *   *Limit:* **Trade Rounds.** Ring a bell every 5 minutes. "New round. Find a new partner." This prevents two people from dominating the hour.

