  ## Part 5: Honest Limitations (What the Game Cannot Do)

  You must supply these caveats in the final 5 minutes. The game is a model, not reality.

  **1. Linearity of Value**
  *   *Limitation:* In the game, 2 tokens are always worth exactly double 1 token. In reality, moral value is often non-linear (thresholds, diminishing returns).
  *   *Your Add:* "Real moral trade is harder because causes have diminishing returns. If we all trade to focus on Cause A, Cause A might become saturated, lowering the value of your tokens."

  **2. Perfect Enforcement**
  *   *Limitation:* The Ledger was binding. In reality, I cannot force you to keep a moral pledge.
  *   *Your Add:* "The hardest part of moral trade isn't the math; it's the trust. How do we build institutions that make these pledges stick without a central Registrar?"

  **3. Incommensurability**
  *   *Limitation:* The game assumes all values can be scored on one sheet.
  *   *Your Add:* "Some philosophers argue causes are *incommensurable*. You can't trade 'Animal Welfare' for 'Global Health' because they are different *kinds* of good. The game forces commensurability for the sake of mechanics. In your research, you must ask if that commensurability is justified."

  **4. The "Coldness" of Trade**
  *   *Limitation:* The game feels transactional.
  *   *Your Add:* "Did the game feel cold? That is the primary aesthetic objection to moral trade. It feels like marketizing the sacred. The challenge for you is to determine if that feeling is a moral insight or a cognitive bias."
