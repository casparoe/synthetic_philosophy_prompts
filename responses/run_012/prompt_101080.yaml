      *   **Key Rule:** Trades count only if both parties can publicly state a justification the other accepts (forces articulation of reasoning).
      *   **Deliverables:** Materials (cards, ledger), Timeline, Debrief (mapping to theory), Prediction of Failure Modes + Mitigation, Honest Limitations.

  2.  **Deconstruct "Moral Trade":**
      *   What is it? It's the idea that agents with different moral priorities can cooperate to achieve more of what *each* values by specializing or swapping efforts, rather than everyone pursuing their own top priority independently.
      *   *Example:* I care 80% about Animals, 20% about Global Health. You care 80% about Global Health, 20% about Animals. We both work on our top priority. I get 80 units of Animal value, 20 of GH. You get 80 GH, 20 Animal. Total: 100 Animal, 100 GH.
      *   *Trade:* I work 100% on Animals, You work 100% on GH. We agree to count the outcome as shared. I get 100 Animal (via me) + 20 GH (via you). You get 100 GH (via you) + 20 Animal (via me). Both are better off.
      *   *The Twist:* The prompt asks for *shifting effort* via pledges. So, I pledge to do X for your cause if you pledge to do Y for mine.
      *   *The Constraint:* "Justification the other would accept." This adds a deliberative democratic layer, preventing purely exploitative trades and forcing moral reasoning.

  3.  **Design the Game Mechanics:**
      *   *Players:* 16.
      *   *Causes:* Need abstract but meaningful labels to avoid immediate ideological gridlock. Let's use "Domains of Impact" (e.g., Local Relief, Systemic Change, Future Generations, Non-human Welfare). Let's call them A, B, C, D for neutrality, but give them evocative subtitles.
