  Dara is going to say that **"smunt" is not a full candidate for logic** (or, at best, it is "pre-logical").

  While "smunt" passes the embedding test (conditionals/negation), it fails the **Semantic Ascent** test. For Dara, solving the Frege-Geach problem isn't just about showing that expressive sentences can sit inside an "if"; it's about showing they can participate in *generalizations* and *anaphoric reference* without collapsing into realism. The speakers' refusal to use "true" or "believes" blocks this.

  Here is the breakdown of the rule she is running, the alternatives, and the decisive test case.

  ### 1. The Rule Dara Is Running: Generalizability via Semantic Ascent

  Dara is operating as a **Quasi-Realist** (likely in the vein of Simon Blackburn). Her goal is to "earn the right" to truth-talk for expressive terms without admitting they describe robust facts.

  *   **The Principle:** A term is a candidate for logic only if the language allows for **semantic ascent**—the ability to refer to the sentence/attitude itself using operators like "true," "false," or "believes."
  *   **Why?** Logic requires generalization (e.g., "Everything he said is wrong") and blind endorsement (e.g., "If that's true, then..."). You cannot quantify over or refer back to a stance unless you can nominalize it or predicate truth of it.
  *   **Application to "Smunt":** Even though "smunt" embeds in conditionals ("If smunt..."), the speakers' refusal to say "It is true that's smunt" means they cannot generalize. They can't say "Everything the Chief says is smunt." Without that machinery, the logical structure is incomplete. The conditional embedding is just a syntactic trick; the semantic integration is missing.

  ### 2. Consistency Check with Previous Verdicts

  This rule fits all her prior data points perfectly:

  *   **"Lying is wrong" (Verdict 1 & 4):** **Passes.** It embeds in conditionals *and* allows "true/believes" (even if thin). This allows full logical generalization.
  *   **"Boo/Hooray" (Verdict 2):** **Fails.** Cannot embed *and* cannot take "true/believes." Pure noise.
  *   **"That damn dog" (Verdict 3):** **Fails (for the expressive part).** The sentence embeds, but the "damn" content is a Conventional Implicature (rides outside). You can't say "It is true that that damn dog..." where "true" captures the "damn." The expressive bit is logically inert.
  *   **"Smunt" (Verdict 6):** **Fails.** Embeds (unlike "Boo"), but blocks semantic ascent (unlike "Wrong"). It is stuck in the middle: syntactically integrated but semantically opaque.

  ### 3. Alternative Rules and Their Predictions

  Dara must reject these alternative rules to maintain her expressivist dissertation goals.

  **Alternative A: The Embedding-Only Rule**
  *   **Rule:** If a term can appear in the antecedent of a conditional and under negation, it is logical.
  *   **Prediction for "Smunt":** **Yes, it is logic.**
  *   **Why Dara Rejects It:** This solves the *embedding* problem but not the *generalization* problem. If you can't say "It is true," you can't formulate valid arguments involving quantifiers (e.g., "For all x, if x is smunt..."). Dara needs logic to cover inference, not just syntax.

  **Alternative B: The Robust Truth-Conditional Rule**
  *   **Rule:** If a term corresponds to a real property or truthmaker, it is logical.
  *   **Prediction for "Smunt":** **No.** (Also predicts "No" for "Wrong").
  *   **Why Dara Rejects It:** She is an expressivist. She explicitly denies "Wrong" has a truthmaker (Verdict 4). Adopting this rule would force her to abandon expressivism for realism.

  **Alternative C: The Attitude-Consistency Rule (Gibbard-style)**
