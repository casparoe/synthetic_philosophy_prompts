  # JOINT STATEMENT ON THE PROBLEM OF OLD EVIDENCE
  **Adversarial Collaboration: The Defect View vs. The Dissolution View**

  **Preamble:** This document summarizes four weeks of discussion regarding the "Problem of Old Evidence" within Bayesian Confirmation Theory (BCT). It excludes the third line of inquiry regarding logical omniscience and sourdough fermentation, as no consensus was reached there. The signatories represent two positions: **The Defect View** (BCT contains a genuine structural flaw regarding old evidence that requires formal repair) and **The Dissolution View** (The problem arises from misapplication of the formalism and dissolves under precise specification).

  ## 1. AGREED CLAIMS
  *The following claims are accepted by both sides as the baseline for the disagreement. Neither side may retreat from these statements in subsequent argument.*

  1.  **The Bayesian Framework:** Confirmation is modeled by an agent assigning credences (probabilities) to hypotheses ($H$) and evidence ($E$). Standard updating occurs via Conditionalization: the new credence in $H$ after learning $E$ is $P_{new}(H) = P_{old}(H|E)$.
  2.  **The Mathematical Core:** In standard probability theory, if an agent is certain of $E$ (i.e., $P_{old}(E) = 1$), then $P_{old}(H|E) = P_{old}(H)$. Learning $E$ produces no change in credence for $H$.
  3.  **The Historical Intuition:** There are historical cases where a theory ($H$) was proposed after evidence ($E$) was already known, and the ability of $H$ to entail or explain $E$ was widely regarded by scientists as strong support for $H$. The canonical case is General Relativity ($H$) entailing the anomalous precession of Mercury's perihelion ($E$), which was known decades prior.
  4.  **The Conflict:** Under the standard application of Claim 2 to the historical cases in Claim 3, BCT implies that $E$ provides zero confirmation for $H$. This contradicts the historical intuition in Claim 3.
  5.  **Scope of the Problem:** Both sides agree this problem applies specifically to situations where the evidence $E$ is already assigned probability 1 (or effectively 1) by the agent *before* the hypothesis $H$ is introduced or evaluated.
  6.  **Not at Issue:** Both sides agree this is not a problem about psychological surprise, nor about the rhetorical persuasiveness of a theory. The dispute is strictly about whether BCT can formally account for the *normative* support $E$ provides to $H$ in these cases.
  7.  **Not at Issue:** Both sides agree that if $P(E) < 1$ (the agent is uncertain about the evidence), the mathematical problem in Claim 2 does not arise. The dispute concerns whether setting $P(E) < 1$ is a legitimate modeling choice for known evidence, or an ad hoc fix.

  ## 2. DISAGREEMENTS TABLE
  *Each row isolates a specific point of divergence. "The Crux" is stated neutrally. Positions are formulated to be acceptable to the holders of that view.*

  | # | The Crux | The Defect View (Camp A) | The Dissolution View (Camp B) | Agreed Test / Case | Predictions (A vs. B) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Object of Updating:** When a scientist realizes an old fact supports a new theory, what proposition are they actually updating on? | The agent is updating on the evidence $E$ itself. Since $P(E)=1$, the formalism fails to register the support. The machinery must be altered to allow $E$ to confirm $H$ even when $E$ is old. | The agent is updating on the *logical relation* between $H$ and $E$ (e.g., "$H$ entails $E$"), not on $E$ itself. Since the entailment is new information, $P(H|\text{Entailment}) > P(H)$, and the standard formalism works without repair. | **Mercury's Perihelion:** A scientist in 1915 knows Mercury's orbit ($E$) and learns General Relativity ($H$). | **A:** Standard BCT predicts 0 confirmation. A repair is needed to match historical judgment.<br>**B:** Standard BCT predicts positive confirmation if modeled as updating on the entailment. No repair needed. |
  | **2** | **The Status of Certainty:** Is it ever legitimate to assign $P(E) < 1$ to evidence that is already known and recorded? | No. Known evidence is known. Forcing $P(E) < 1$ to make the math work is an ad hoc distortion of the agent's actual epistemic state. The problem lives at $P(E)=1$. | Yes. Rational agents should never assign probability 1 to empirical claims (including records of data). Allowing for fallibility ($P(E) = 0.99$) restores the ability of $E$ to confirm $H$ naturally. | **Probability 1 vs. 0.99:** Compare a case where $P(E)=1$ to one where $P(E)=0.999$. | **A:** The problem persists qualitatively even near 1. The drop from 1 to 0.999 is not the source of the support.<br>**B:** The problem vanishes as soon as $P(E) < 1$. The "problem" is an artifact of the idealization of certainty. |
  | **3** | **Definition of Confirmation:** Does "confirmation" mean *increase in credence upon learning E* or *high likelihood ratio regardless of timing*? | Confirmation must capture the *historical* support. If a theory explains old data better than rivals, it is confirmed, regardless of when the data was learned. BCT fails to capture this. | Confirmation is strictly a measure of *current* epistemic leverage. If $E$ is already known, it cannot *increase* credence. The intuition that it "confirms" is actually about theoretical virtue (e.g., unification), not Bayesian updating. | **Word Dispute:** Is this a substantive disagreement or a verbal one about "confirmation"? | **A:** Substantive. BCT fails to track scientific rationality.<br>**B:** Verbal. BCT tracks updating; "support" tracks virtue. Conflating them creates the problem. |
  | **4** | **The Accommodation Distinction:** Can BCT distinguish between a theory that *predicted* new data vs. one *built to fit* old data? | No. If the data is old ($P(E)=1$), BCT treats accommodation and prediction identically (both yield 0 confirmation). This is a failure, as prediction is intuitively more confirmatory. | Yes. Accommodation affects the *Prior* $P(H)$, not the Likelihood. A theory built to fit data should have a lower prior (penalized for complexity/ad hoc-ness). The updating on $E$ is the same, but the final credence differs. | **Built-to-Fit:** A hypothesis constructed specifically to match a known anomaly vs. one that implies it incidentally. | **A:** BCT cannot formally penalize the built-to-fit hypothesis if $E$ is old.<br>**B:** BCT penalizes it via the Prior $P(H)$. The likelihood of $E$ is irrelevant to the distinction. |
  | **5** | **The ML Analogy:** Is "data contamination" in Machine Learning (benchmark in training set) structurally identical to Old Evidence? | Yes. In both cases, the system is evaluated on information it already "knows." This inflates performance metrics (ML) or fails to register support (BCT). Both are evaluation failures regarding old information. | No. ML evaluation measures generalization error on a distribution. Data contamination causes overfitting (memorization). Bayesian confirmation measures epistemic justification. Memorizing data is not analogous to logical entailment. | **ML Benchmark:** A model is tested on data present in its training set. | **A:** This is the same problem. The model gains no "confirmation" of its general ability, just as the scientist gains no confirmation from old evidence.<br>**B:** This is overfitting, a prior/regularization issue. It is not an analogue to the logical problem of old evidence. |

  ## 3. SCENARIO ANALYSIS
  *Both sides commit to the following verdicts for specific scenarios. This section details whether each side considers the scenario a "genuine instance" of the problem and what they predict for a rational agent's credence.*

  | Scenario | Is this a Genuine Instance of the Problem? (Defect View) | Is this a Genuine Instance of the Problem? (Dissolution View) | Prediction: Rational Agent's Credence in $H$ (Defect View) | Prediction: Rational Agent's Credence in $H$ (Dissolution View) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Classic Old Evidence**<br>(Mercury's Perihelion: $E$ known for decades, $H$ arrives later and entails $E$.) | **Yes.** This is the core failure case. $P(E)=1$ blocks confirmation. | **No.** The agent updates on the *discovery of the entailment*, not $E$. The formalism holds. | **Stagnation.** Without repair, $P(H)$ should not rise upon noting $H$ entails $E$. (Historical rise indicates BCT error). | **Increase.** $P(H)$ rises upon learning "$H$ entails $E$." (Historical rise is consistent with BCT). |
  | **2. Old Data / New Relevance**<br>($E$ sat in records for 50 years. Nobody realized it bore on the question until now.) | **Yes.** The data was old ($P(E)=1$). The relevance is psychological, but the confirmation should be formal. BCT misses this. | **No.** The "relevance" is the learning of the probabilistic dependency between $H$ and $E$. That dependency is new information. | **Stagnation.** $E$ cannot confirm $H$ if $E$ was already certain, regardless of when relevance was noticed. | **Increase.** Learning the dependency changes the likelihood function, allowing updating. |
  | **3. Old for Field / New for Person**<br>(The data is published knowledge, but this specific scientist just read the paper today.) | **Yes.** Science is communal. If it's old for the field, it's old evidence. The individual's ignorance is irrelevant to the logic of science. | **No.** Bayesianism models *individual* credence. If $P_{individual}(E) < 1$ before reading, it is new evidence for them. | **Stagnation.** The agent should not update on $E$ because $E$ is objectively old for the epistemic community. | **Increase.** The agent updates normally because $E$ was not certain *for them* prior to reading. |
  | **4. Accommodation (Built to Fit)**<br>($H$ was constructed specifically to match $E$; $E$ was never new.) | **Yes.** BCT treats this the same as prediction. It fails to capture the disvalue of accommodation when $E$ is old. | **No.** The disvalue of accommodation is handled by the Prior $P(H)$, not the updating on $E$. The "problem" is misplaced. | **Equal to Prediction.** BCT cannot distinguish accommodation from prediction using $E$ alone. | **Lower than Prediction.** $P(H)$ is lower because the Prior is penalized for ad-hoc construction, not because $E$ fails to confirm. |
  | **5. Probability < 1**<br>(The agent is 99.9% sure of $E$, but not 100%.) | **Yes (mostly).** The problem diminishes but remains. The intuition of support doesn't hinge on that 0.1% uncertainty. | **No.** The problem completely dissolves. If $P(E) < 1$, the math allows confirmation. The "problem" only exists at exact 1. | **Minimal Increase.** $P(H)$ rises slightly, but not enough to match historical intuition of strong support. | **Significant Increase.** $P(H)$ rises commensurate with the likelihood ratio. The math works as intended. |
  | **6. ML Data Contamination**<br>(Benchmark data was in the training set.) | **Yes.** Same structure. The model "knows" the answer. Evaluation is invalid. | **No.** Different structure. This is a failure of generalization testing, not a failure of logical updating. | **Invalid Metric.** The performance metric is inflated/meaningless regarding generalization. | **N/A.** This is an engineering constraint, not an epistemic justification problem. |

  ## 4. NEXT STEPS FOR THE GROUP
  1.  **Defect View** to produce a formal sketch of a repair mechanism that allows $P(H)$ to rise when $P(E)=1$ without violating probability axioms.
  2.  **Dissolution View** to produce a formal model of the "Mercury" case where the update is strictly on the *entailment* proposition, showing the math yields the correct historical credence.
  3.  **Both** to agree on whether the ML analogy is productive or distracting before the next session. (Current status: Defect View finds it productive; Dissolution View finds it category error).
  4.  **Sourdough Member** to be excluded from voting until he demonstrates understanding of Likelihood Ratios.
