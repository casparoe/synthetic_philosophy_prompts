prompt: |-
  I'm in a philosophy of science reading group and I've somehow been volenteered to write the summary document for the four weeks we just spent going around in circles on the problem of old evidence. Two of the members have stopped listening to each other entirely: one thinks old evidence is a genuine defect in Bayesian confirmation theory, the kind you have to repair with actual machinery rather than wave away, and the other thinks it's an artifact of how people set up the formalism — that once you say precisely what epistemic situation is being modeled and what exactly is being demanded of it, there's nothing left over to fix, and every proposed repair costs more than the disease. (A third member thinks it's all just logical omniscience, but he mostly talks about his sourdough starter now.) What I want from you is the document those two should have written instead of another month of cross-talk: the joint statement of an adversarial collaboration between the old-evidence-is-a-real-problem camp and the old-evidence-dissolves-once-you're-careful camp.

  Structure it as a numbered section of agreed claims first — what the problem is, what counts as an instance of it, what both sides agree is not at issue, what the formalism does and doesn't say — each one written flatly enough that neither side would want to wriggle out of it. Then a disagreements table, one row per remaining disagreement: the crux in neutral wording, then each side's position in a formulation that side would actually accept for itself (I don't want a column that's secretly a strawman), and then, wherever possible, a case or argument both sides agree would bear on the crux, with each side's prediction about it written down in advance. If any row turns out to be a dispute about words — different senses of confirm, or evidence, or learning — say so in the table rather than pretending it's substantive.

  Things I specifically want covered, because these are the ones we kept tripping over: the classic shape of the case, where a theory arrives and entails exactly a long-known anomaly (the anomalous precession of Mercury's perihelion is the one everyone reaches for — known for decades before 1915, and general relativity got the number right), and someone says the anomaly is therefore evidence for the theory; evidence that's old but whose relevance nobody had noticed, so the datum sat in a record for fifty years before anyone realized it bore on the question; evidence that's old for the field but brand new to this particular person, who has just read the paper; a hypothesis built to fit the data in the first place, so the data was never new in any interesting sense; and whether it matters that most theories make their evidence probable rather than certain, since my suspicion is that the whole problem lives at probability 1 and gets less bad as you slide away from it. Also, my roommate does ML evals and keeps saying the same structure shows up when a benchmark is later discovered to have been in the training data, and I can't tell whether that's the same problem or just a pun on the word old, so put that in and let the two camps fight it out. For each of these I want to know whether it's a genuine instance of the problem on each side's own terms, and what each side predicts about the credence of a rational agent in that situation. Keep it self-contained and argue it on the merits — don't lean on who said what in the literature, since half the group hasn't read any of it, and no many-philosophers-hold-that hedging.
