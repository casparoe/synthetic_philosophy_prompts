prompt: |-
  I sit on the board of the Hollowbrook Community House, a small nonprofit in a town of about nine thousand people. We are nine volunteers; I am a retired electrician who never finished college, and I have been turning this question over on my own for the better part of a year. I would like my written opinion to be something the board can act on rather than a reflection, and I have asked you to draft it.

  The facts. In 2011, the board then serving adopted a resolution, entered in our minutes and reported in the local paper, that the ground floor of the building would be "kept available, at no charge, to local groups for as long as this organization exists." Three groups moved in: a food pantry, a tenants' association, and a community choir. The choir raised about $38,000 over several years and spent it converting the back room into a rehearsal space with proper acoustics. The same 2011 resolution contained a clause reserving the board's right to revisit the arrangement "if the building's own survival should be at stake." Two of the nine seats were vacant when it passed, and one member who voted for it later told the paper he had always thought it a mistake.

  The crisis. The roof, the boiler, and the fire escapes need replacing; our engineer puts the work at $210,000 and we have $46,000. The only offer on the table is a twelve-year lease of the entire ground floor to a pharmacy chain, at a rent that would cover the repairs and leave a small reserve. The three groups have offered to raise $12,000 among themselves, which does not close the gap. Two of our current members were recruited specifically from those groups; the rest of us have no connection to the 2011 promise.

  Please draft the opinion I will circulate before our vote on the 14th. I need a recommendation — honor the 2011 arrangement, break it, or something in between — with a time frame and specific terms, and with the reasoning set out so that the members who feel bound by the promise and the members who think a board cannot be governed by a board that no longer exists can each see that their position was taken seriously. What I am really after is the question underneath: what makes a promise binding in a case like this — that people arranged their lives around it, that we gave our word, or something else — and whether a promise can bind an institution whose members are all different from those who made it. If our promise turns out to be weaker than the groups believe, say so; if it is stronger than most of my colleagues believe, say that too. Stay with our facts, and tell me what we should do on the 14th.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Author:** Retired electrician, board member of Hollowbrook Community House (nonprofit), no college degree, pragmatic, wants actionable advice, not just reflection.
      *   **Audience:** The other 8 board members (volunteers). Two are reps from the tenant groups, others are new/unconnected to the 2011 promise.
      *   **Context:** Small town (9k people). Building needs $210k repairs, have $46k. Gap is $164k. Groups offered $12k. Pharmacy lease covers gap + reserve.
      *   **The Conflict:** 2011 Resolution promised ground floor "at no charge... for as long as this organization exists" *unless* "building's own survival should be at stake."
      *   **The Question:** What makes a promise binding? (Reliance? Word given? Institutional continuity?) Can a new board be bound by an old board?
      *   **Goal:** A written opinion to circulate before the vote on the 14th. Needs a specific recommendation (Honor, Break, or Middle Ground), time frame, terms, and reasoning that validates both sides (promise-keepers vs. pragmatic fiduciaries).
      *   **Tone:** Respectful, clear, grounded in facts, morally serious but practical. Not overly academic (author is a retired electrician), but intellectually rigorous enough to handle the ethical questions.

  2.  **Deconstruct the Ethical/Legal Landscape:**
      *   *The Promise:* It was public (minutes + newspaper). It induced reliance (choir spent $38k).
      *   *The Escape Clause:* "If the building's own survival should be at stake." This is the crux. Is $164k gap an existential threat? Yes, likely. Without repairs, the building is unusable/unsafe.
      *   *Institutional Continuity:* A nonprofit is a legal entity distinct from its board members. The board represents the entity, not just themselves. Therefore, past board decisions *do* bind future boards, *unless* circumstances change materially (which the escape clause anticipates).
      *   *Fiduciary Duty:* The board must ensure the organization survives. If the building closes, the mission dies.
      *   *Reliance Interest:* The choir invested money based on the promise. Breaking it harms them disproportionately.

  3.  **Evaluate the Options:**
      *   *Option A: Honor the 2011 Promise (Reject Pharmacy).*
          *   Pros: Keeps faith, moral integrity.
          *   Cons: Building likely deteriorates or organization goes bankrupt trying to fundraise $164k in a small town. Mission fails.
      *   *Option B: Break the Promise (Accept Pharmacy).*
          *   Pros: Saves building, financial security.
          *   Cons: Betrays trust, harms vulnerable groups (food pantry/tenants), invalidates choir's investment. Legal risk (promissory estoppel?).
      *   *Option C: Middle Ground (Conditional Acceptance).*
          *   Accept the lease *but* mitigate the harm. Use the "survival" clause legitimately but honor the spirit of the promise through transition support.

  4.  **Develop the Recommendation (The "Middle Ground"):**
      *   The "survival" clause is triggered. The building *cannot* survive without the money. Therefore, the strict "no charge" promise is technically voidable under its own terms.
      *   *However*, the moral obligation remains.
      *   *Recommendation:* Accept the pharmacy lease *conditionally*.
      *   *Terms:*
          1.  **Transition Period:** Don't kick them out immediately. Give 6-12 months to find space.
          2.  **Reimbursement:** The choir spent $38k. They should be reimbursed from the repair fund/reserve before the board takes a salary (none anyway) or reserves. At least a portion.
          3.  **Priority Return:** If space becomes available later, they get first dibs at below-market rates.
          4.  **Mission Alignment:** Ensure the pharmacy doesn't contradict the mission (unlikely, but worth noting).
          5.  **Transparency:** Admit the failure to the public.

  5.  **Drafting - Voice and Tone:**
      *   The author is a retired electrician. The language should be plain, sturdy, honest. No legalese. No academic philosophy jargon. Use metaphors related to building/structure if possible (wiring, foundations).
      *   It needs to sound like it comes from *him*, not an AI. "I've been turning this over..."
      *   Address the specific philosophical question: What binds us?
      *   *Answer:* A promise binds because people acted on it (reliance) AND because the institution is a continuous entity. But a promise based on a specific reality (building solvency) changes when that reality changes.

  6.  **Drafting - Structure:**
      *   **Header:** To/From/Date/Subject.
      *   **Opening:** Acknowledge the weight of the decision. State the purpose (actionable recommendation).
      *   **The Facts:** Briefly recap the financial reality.
      *   **The Promise (Ethical Analysis):** Address the "binding" question directly. Acknowledge the validity of the 2011 board's intent and the groups' reliance.
      *   **The Escape Clause:** Analyze "building's survival." This is the legal/moral key.
      *   **The Recommendation:** Specific steps (Lease + Mitigation).
      *   **Conclusion:** Call to action for the 14th.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is recommending the lease too harsh on the poor/tenants?
      *   *Adjustment:* Emphasize that if the building closes, *everyone* loses, especially the vulnerable. The pharmacy deal saves the mission, even if it changes the method.
      *   *Critique:* Is the choir reimbursement feasible?
      *   *Adjustment:* $210k repairs. $46k cash + Pharmacy rent. The pharmacy rent covers repairs + *small reserve*. Reimbursing $38k might eat the reserve. Maybe recommend reimbursing *what is possible* or framing it as a debt the new entity owes. Let's suggest reimbursing from the *reserve* created by the lease, acknowledging it reduces safety but restores justice. Or, better: The lease covers repairs *and* leaves a reserve. Use part of that reserve to pay the choir. It's the right thing to do.
      *   *Critique:* Make sure I answer the "what makes a promise binding" question explicitly.
      *   *Answer:* It's binding because of *reliance* (they spent money) and *continuity* (we are the same organization). But it is *conditional* on the survival clause.

  8.  **Final Polish:** Check the date (vote on the 14th). Ensure the tone is humble but firm. (The prompt asks for *my* draft of *his* opinion).

      *Key Phrase to include:* "A promise is not a suicide pact." (Maybe too cliché? Let's use: "A promise to keep a door open cannot require us to let the roof fall in.")
      *Key Concept:* Promissory Estoppel (explain simply). The choir relied on the promise to their detriment.

      *Let's write it.*

