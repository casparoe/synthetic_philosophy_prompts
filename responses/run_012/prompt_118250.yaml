answer: |-
  Begin the session by handing each student a single sheet of paper titled Investment Portfolio and a pen. Tell them they have been appointed managers of a fund with exactly one hundred decision units to allocate. On the sheet is a menu of five distinct investment vehicles labeled only by number. Option One offers a guaranteed return of ten units per unit invested. Option Two offers a fifty percent chance of returning thirty units per unit invested and a fifty percent chance of returning nothing. Option Three offers a ten percent chance of returning two hundred units per unit invested and a ninety percent chance of returning nothing. Option Four offers a one in ten million chance of returning one billion units per unit invested and otherwise returns nothing. Option Five offers a non-zero probability of returning an infinite number of units per unit invested. Instruct them that they must allocate their entire budget of one hundred units across these options, allowing them to split the budget however they wish, including putting everything into a single option. Tell them they have ten minutes to make their allocations and sign the sheet, which serves as a binding commitment. Do not explain how the performance of the portfolio will be evaluated yet. Do not explain where the probabilities for Option Four or Option Five come from. Do not answer questions about the credibility of the claims. Walk around the room and ensure everyone commits to a distribution before you reveal the scoring rule.

  Once every sheet is signed and collected, reveal the scoring rule. Tell them that the value of a portfolio is not determined by a single realization of chance, because this is a seminar on rational choice theory, not gambling. The score is calculated using the expected value formula, multiplying the probability of each outcome by the magnitude of the payoff and summing the results across the allocated budget. Write the formula on the board. Ask them to calculate the expected value per unit for each option silently. Option One yields ten. Option Two yields fifteen. Option Three yields twenty. Option Four yields one hundred. Option Five yields infinity. Ask them to look at their signed sheets. Ask them to raise their hands if they allocated the majority of their budget to Option One or Two. Most hands will go up. Ask them to look at the arithmetic. The arithmetic dictates that a rational agent maximizing expected value must allocate everything to Option Five, or if infinity is treated as undefined or problematic, everything to Option Four. Point out that their own arithmetic, the standard tool of decision theory they have studied all semester, selects the option with the smallest probability and the largest payoff. Point out that by diversifying or choosing safety, they have voluntarily accepted a lower score. This is the first mirror. They feel the pull of the fanatical conclusion because the math is undeniable, yet their intuition screamed against it while they were writing.

  Now introduce the constraint of faith. Ask the students who allocated money to Option Four why they believe the probability is one in ten million. They will look at you. Remind them that the sheet stated the probability as a fact, but you provided no evidence, no track record, and no mechanism. You simply asserted it. This maps directly to your colleague's challenge about the stranger promising the world. In the game, they likely discounted Option Four because the claim was unverifiable, yet the scoring rule forced them to treat the stated probability as objective truth. Ask them if they would have allocated differently if they were allowed to adjust the probability based on skepticism. Most will say yes. This is the moment to allow the escape routes. Tell them they are now permitted to rewrite the rules of the evaluation to better match their intuition, but each modification must be stated as a general principle and applied consistently. If they propose capping the maximum payoff at a realistic number, say one million, show them how this lowers the expected value of Option Four below Option Three. If they propose ignoring probabilities below a certain threshold, say one percent, show them how this forces them to ignore Option Four entirely, but ask them where they would set that threshold and why one in a million is ignorable while one in a thousand is not. If they propose refusing to compare infinite outcomes, ask them how they decide between two options both offering infinite expected value but different probabilities of attainment. Each escape route costs them something they value, either consistency, potential upside, or the ability to use mathematics at all.

  Move into the debrief by mapping the game mechanics onto your personal dilemma. Explain that Option Four is the cause you support, the one resting on a small probability of a very large benefit, and Option One is the local charity or personal consumption your colleague suggested you prioritize instead. The scoring rule is Expected Utility Theory, the standard framework you teach. The infinite option is Pascal's Wager, which collapses the ranking entirely and shows why standard expected value reasoning breaks down at the limits. Acknowledge that the game forced them to feel the force of the fanatical conclusion before they were allowed to argue against it. This order matters. If you had started with a discussion, they would have intellectualized the problem. By making them commit first, you forced them to act on intuition and then confront the contradiction with their own calculations. Discuss the mirror-image charge. A principled refusal to be fanatical obliges you to ignore a tiny chance of the best outcome. If they choose to ignore Option Four, they are effectively saying that no matter how large the benefit, if the probability is low enough, it is worth zero. Ask them if they would accept that principle if the benefit was saving all future generations of humanity. They will hesitate. This hesitation is the learning objective. They should leave convinced that the fanatical conclusion follows from premises they already accept, and that every way of blocking it has a price, whether that price is vulnerability to scams or the abandonment of potentially world-saving opportunities.

  Be honest about what the activity can and cannot test. The game genuinely tests the tension between mathematical consistency and intuitive plausibility within a closed system. It shows that Expected Utility Theory is not just a tool for calculation but a commitment to a specific structure of valuation. However, the game cannot reproduce the emotional weight of real loss. Losing decision units on paper feels different than losing rent money. The game cannot reproduce the social context of the stranger on the street. In the game, you are the authority figure providing the menu, which lends implicit credibility to the probabilities. In the real world, the stranger has no authority, and the probability is not printed on a handout but asserted in a conversation. You will have to supply this distinction yourself in the discussion. Remind them that in the real world, probabilities are not known quantities but estimates subject to error, and the error margin on a one in ten million claim is likely larger than the claim itself. The game assumes the probability is known; the real problem is that it is never known.

  Predict what will go wrong the first time you run this. Students will try to game the scoring rule. Some will ask if the game is played once or repeatedly. If played once, the law of large numbers does not apply, and maximizing expected value is not strictly rational for a risk-averse agent. You must clarify that the scoring rule is about rational commitment, not necessarily repeated play, or else the exercise devolves into a debate about risk aversion which misses the point of the Pascalian mugging. Another predictable failure is the treatment of infinity. Students may treat infinity as just a very large number, or they may refuse to engage with Option Five entirely. You need to be prepared to handle the mathematics of infinite expected value without getting bogged down in set theory. Some students may feel manipulated by the reveal of the scoring rule after commitment. Acknowledge this feeling. It is designed to mimic the feeling of realizing your own principles commit you to actions you find abhorrent. Do not apologize for the trickery; frame it as a necessary shock to reveal the underlying structure of their reasoning.

  Finally, supply the feature the game cannot reproduce. The game cannot reproduce the epistemic humility required in the real world. In the game, the probability is given. In your dilemma, the probability is estimated. The colleague's charge rests on the idea that you cannot distinguish between a legitimate low-probability high-impact cause and a scam. The game assumes the claim is true for the sake of calculation. You must tell them that the real work lies in the prior probability assignment, not the multiplication. The game shows that if you accept the probability, you must accept the action. The real world demands you question the probability. Tell them that every escape route they found in the game, whether capping utility or ignoring small probabilities, is a heuristic for managing epistemic uncertainty. They are not rejecting the math; they are rejecting the input. End the session by asking them to write down one principle they would adopt to govern their own decisions when faced with a stranger promising the world, knowing that whatever they write will either make them vulnerable to manipulation or blind to salvation. Leave them with that cost. Do not resolve it. The discomfort is the point.
