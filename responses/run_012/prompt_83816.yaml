answer: |-
  The damage is done at step five, and it is done there by the causal-reason principle your friend invokes to license the move. That principle is the engine of the entire skeptical conclusion, and it is the only place where the argument commits a substantive philosophical error rather than a merely debatable empirical claim. It looks innocent because it borrows the prestige of naturalistic explanation, suggesting that if we are to be honest about reasons, we must treat them like physical causes that operate in time. It demands that for a consideration to count as a reason for a change, it must be temporally contiguous with that change, arriving just as the effect occurs. This imposes a model of efficient causation onto the landscape of rational agency, and that is a category mistake. If you reject this principle, you block the inference from the sociological history of a practice to the inertness of the truth condemning it. The cost of rejecting it is that you must accept a more complex picture of how moral truth interacts with history, one where truth does not push events like a billiard ball but rather structures the space of reasons within which social pressures like shame and honor operate. You lose the simplicity of a direct causal link between knowing the truth and acting on it, but you save the idea that the truth is what makes the action right, regardless of the psychological mechanism that finally secured it.

  The reason this principle looked harmless to your friend is that it mimics a standard view of scientific explanation. In physics, if a cause is present for centuries without producing an effect, we usually say it was not the cause of the effect when it finally arrives. If gravity existed before the apple fell, gravity alone does not explain why the apple fell at noon rather than at dawn; we look for the stem weakening or the wind blowing. Your friend applies this logic to moral arguments. Since the argument against slavery existed for centuries before slavery ended, the argument cannot be the cause of the ending. We must look for the wind that blew at noon, which in this case is the shift in honor and shame. This intuition is powerful because it respects the temporal sequence of events. However, it fails because moral arguments are not efficient causes in that sense; they are normative considerations that agents uptake. The latency of an argument does not prove its inefficacy; it proves the resistance of the social order. The argument waits for the social conditions to ripen, but when those conditions do ripen, it is the argument that gives the change its direction. Without the argument against slavery, the shift in honor might have taken a different form or never coalesced around abolition specifically. The principle errors by assuming that because the argument was not sufficient on its own to cause the change immediately, it played no causal role in the change when it finally occurred. It confuses necessary conditions with sufficient triggers.

  If you reject the causal-reason principle, you must pay a price. You have to abandon the hope that moral truth operates as a standalone force that overrides social inertia simply by being known. You must accept that moral truth is historically mediated. It requires a vocabulary of honor, shame, and social standing to become effective in the world. This means admitting that your friend is right about the mechanism of change—shame and honor did the work—but wrong about the implication of that mechanism. The work was done by shame, but the shame was shaped by the argument. The cost here is that you cannot claim moral realism saves us from sociology. You cannot say the truth stands above the fray; you must say the truth works through the fray. This makes moral progress look less like a revelation and more like a negotiation, which some realists find unsettling. It suggests that if the culture of honor had shifted differently, the truth might have remained hidden longer, or expressed differently. But this does not make the truth inert; it makes it dependent on human receptivity. Rejecting step five forces you to distinguish between the justification of a practice and the explanation of its demise. The argument justifies the demise; the shift in honor explains the timing. Your friend's principle collapses this distinction, insisting that if the argument did not explain the timing, it explains nothing.

  Now consider the standard ways out you mentioned, and weigh their costs against this diagnosis. The first suggestion is that the arguments available earlier were not the same arguments available later. This tries to save the causal-reason principle by satisfying its simultaneity condition. The cost here is high because it concedes too much to the skeptic. It implies that the moral truth itself changed or was inaccessible earlier, which undermines the realist claim that slavery was always wrong. If the argument against slavery only became cogent in the nineteenth century, then slavery was not wrong in the seventeenth century in the same way, or at least we could not know it. This turns moral truth into a historical product rather than a timeless standard. It saves the causal efficacy of the argument by sacrificing the universality of the truth. You might survive this by saying the formulation improved, but the core truth remained, yet that brings you back to the original problem: why did the improved formulation succeed only when it did? You still need an explanation for the latency, and you still face the friend's challenge that the argument alone was not enough.

  The second way out is that honor is itself responsive to argument. This is a stronger position because it accepts the sociological premise but denies the exclusion in step five. It claims that the change in honor was caused by the long presence of the argument. The cost is that you must provide a genealogy showing exactly how the argument eroded the old honor code. This is empirically demanding. You have to show that people did not just shift their sentiments randomly but shifted them because they were persuaded, even if unconsciously, by the argument. This risks blurring the line between rational persuasion and social contagion. If honor shifts because of argument, why did it take centuries? You are still left explaining the delay. However, this approach preserves the link between truth and action better than the first. It allows you to say the argument was the remote cause, and the shift in honor was the proximate cause. The cost is accepting that moral truth works indirectly. It does not strike like lightning; it weathers like water. This is a plausible view, but it requires you to fight on historical ground, showing the connective tissue between the philosophical critique and the social sentiment.

  The third suggestion is that the truth of a claim and its motivational power are different matters. This is the classic internalist versus externalist debate. The cost here is that you effectively concede step six and perhaps step seven. You admit that moral truth might be inert regarding motivation, but you deny that this matters for realism. You say realism is about what is true, not what moves us. The problem is that your friend's step seven attacks exactly this. He argues realism is not worth having if it is inert. If you take this route, you must defend a realism that is practically disconnected from human agency. This is a cold comfort. It saves the truth but sacrifices the point of morality. Morality is essentially practical; if moral truth has no necessary connection to action, it looks like a branch of mathematics rather than a guide to life. You can hold this view, but you must explain why we should care about moral truth if it does not guide us. You pay with the practical significance of your metaethics.

  The fourth way out is that realism need not be a theory of what moves people. This is similar to the third but focuses on the definition of realism. The cost is redefining the stakes of the debate. Your friend assumes realism promises a world where truth moves mountains. You deny that promise. The cost is that you must find another value for realism. Perhaps its value is purely cognitive, allowing us to describe the world accurately. But morality is not just description. If you sever the link between moral truth and moral practice, you risk making morality irrelevant. However, this might be the most honest price. You admit that the world is not structured to reward morality automatically. The truth of slavery's wrongness does not ensure its end. That is a tragic view, but it is compatible with realism. The cost is losing the consolation that history is on the side of the right. You keep the truth but lose the guarantee of progress.

  Among these, the most damaging flaw remains the causal-reason principle itself. It is the culprit because it forces the false choice between sociological explanation and normative justification. It assumes that if shame explains the action, the argument cannot be the reason. But reasons can operate through sentiments. I can give you money because I love you; the love is the mechanism, but the need is the reason. The love does not exclude the need as an explanation. Similarly, the shift in honor is the mechanism, but the argument is the reason the honor shifted in that direction. The principle fails because it demands that reasons be visible as discrete events coinciding with actions. But reasons can be background conditions that structure the field of choice. The argument against slavery was a background condition for centuries. It did not cause the end directly, but it made the end intelligible when the social pressure finally applied. Without the argument, the shift in honor might have led to something else. The principle ignores this structural role. It treats reasons as triggers rather than frameworks.

  If you keep the causal-reason principle, you cannot escape the conclusion. It does work that the rest of the argument cannot do without because it is the only thing that bridges the gap between the historical observation and the metaethical conclusion. Without it, step five does not follow from step four. Step four says honor changed; step five says therefore argument explains nothing. That is a non sequitur unless you assume that only the proximate trigger explains the action. The principle supplies that assumption. If you reject it, you allow for distal causes, for structural reasons, for the idea that an argument can be valid and effective even if it waits centuries for uptake. You pay the cost of complexity. You must explain how truth works through history rather than assuming it works like a law of nature. But that is a cost worth paying. It saves the idea that slavery was wrong before it ended, and that the argument against it was true before it was heeded. It saves the realist from the claim that truth is inert by showing that inertness is not the same as inefficacy. Truth does not push; it pulls. It waits to be recognized. The friend's principle demands that it push. That is why the principle must go.

  So the verdict is clear. You must reject step five and the causal-reason principle that supports it. The cost is accepting that moral causation is mediated through social psychology and that truth operates latently. You lose the simplicity of direct moral causation but gain the ability to say that the argument mattered even if it took centuries to work. The standard ways out either concede too much about the truth itself or concede too much about the practicality of morality. The best path is to attack the principle directly. Show that reasons are not efficient causes. Show that the arrival of a reason does not need to coincide with the action for the reason to be the explanation of the action. Show that the argument prepared the ground even if it did not plant the seed at the moment of harvest. If you do this, you keep realism, you keep the wrongness of slavery, and you keep the efficacy of the argument, without denying the history of how honor actually shifted. You pay only in philosophical simplicity, which is a small price for saving the truth.
