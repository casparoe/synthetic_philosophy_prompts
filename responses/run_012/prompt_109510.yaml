answer: |-
  Here's a 25-minute battle plan tailored for poker players who respect odds but hate waffle.

  **1. The Setup (Minutes 0–5)**
  Tell the Death in Damascus story exactly as you have it, but strip the metaphysics immediately.
  *   **The Frame:** Don't call it "fate." Call it "information." Tell them: "Imagine Death is just a bloke with a perfect read on you. Like an opponent who knows your tell every single time."
  *   **The Rule:** Establish the premise hard: Death isn't magic, he's just right. If you decide to go to Aleppo, he knows *before* you leave.
  *   **The Hook:** Ask the table: "Knowing he's waiting where you decide, do you stay or do you run?"

  **2. The Trap (Minutes 5–10)**
  Let them argue the odds. They'll say running gives you a chance.
  *   **The Counter:** Show them the correlation. If you run, he's there. If you stay, he's there. Your decision isn't *causing* him to be there; it's *revealing* where he already is.
  *   **The Poker Analogy:** This is the core. Explain it like this: "It's like betting when you know he has the nuts. Folding doesn't change his hand, but betting tells him you didn't know."
  *   **The Point:** You need them to see that their choice is a *signal*, not a *lever*.

  **3. Handling the Objections (Minutes 10–20)**
  This is where the phones come out if you waffle. Head them off in this order:
  *   **"Nobody can predict the future" (The Impossible Objection):** Shut this down early. Say: "I know. It's a thought experiment. Assume the bookie is just that good. We're testing the logic, not the magic."
  *   **"It's just fate" (The Time Travel Objection):** Correct them. "It's not fate. It's data. He read your tell. You leaked information."
  *   **"Just flip a coin" (The Coin Flip Objection):** This is the smartest objection. Acknowledge it.
      *   *The Verdict:* Tell them: "Actually, you're right. In game theory, that's called a 'mixed strategy.' If you randomize, he can't read a tell. You get 50% survival instead of 0%."
      *   *The Catch:* Add: "But only if he can't predict the coin too. If he knows the coin flip result, you're still dead. But if he only knows *you*, flipping works." This validates their intuition without breaking the puzzle.

  **4. The Variation (Minutes 20–23)**
  *   **8 out of 10:** Bring this in *now*. It turns philosophy into EV (Expected Value).
  *   **The Calc:** If he's 90% accurate, staying gives you 10% survival. Running gives you 10% survival. Flipping gives you 50%.
  *   **Why:** Poker players love crunching numbers. It proves the "coin flip" strategy has positive EV over deciding deterministically.
  *   **Skip the Third Town:** Don't do it. It complicates the EV without adding clarity. Keep it binary.

  **5. The Check Question (Minutes 23–25)**
  Don't ask "Did you get it?" Ask them to put money on it.
  *   **The Question:** "If you could pay $100 to hand your decision over to a coin flip instead of choosing yourself, is that bet +EV?"
  *   **The Right Answer:** Yes. Because choosing yourself gives you 0% survival (in the perfect version), flipping gives you 50%. Paying to randomize is buying equity.
  *   **The Wrong Answer:** No, because "you can't cheat fate." (This means they fell for the magic framing).

  **What to Avoid**
  *   **Do not** use the words "causal," "evidential," "epistemic," or "Newcomb."
  *   **Do not** let them drift into free will debates. Keep it on information leakage.
