      *   *Inevitability:* The framework actually *helps* here. By separating (1) from (3), it acknowledges (1) might happen multiple times (inevitability) but (3) is the singular event that matters. However, does it presuppose the individual? Yes, because it assigns achievements to persons. A structuralist might say the "system" discovered it.
