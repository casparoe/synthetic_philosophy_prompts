answer: |-
  # Joint Statement on the Nature and Scope of Goodhart Effects

  **Date:** October 26, 2023
  **Parties:** The Maximalist (M), The Deflationist (D)
  **Subject:** Clarification of agreement, disagreement, and empirical cruxes regarding Goodhart's Law.

  ## 1. Agreed Claims

  We, the undersigned, agree on the following propositions regarding the phenomenon commonly referred to as Goodhart's Law.

  1.  **Existence and Importance:** When a measure becomes a target, it often ceases to be a good measure. This is not merely a theoretical curiosity; it is a robust empirical regularity observed in economics, public policy, machine learning, and biological evolution. Ignoring it leads to significant negative outcomes.
  2.  **Not Mere Implementation Error:** These failures are not solely the result of incompetence, bugs, or sloppy engineering. They occur even when the proxy is carefully chosen and the optimization process is technically flawless. The failure is structural to the relationship between the proxy and the true objective.
  3.  **Taxonomy Utility:** The four-category taxonomy (Regressional, Extremal, Causal, Adversarial) is a valid and useful tool for classifying specific instances. We agree that distinguishing between *noise* being selected (Regressional), *boundary conditions* being violated (Extremal), *causal pathways* being bypassed (Causal), and *strategic exploitation* (Adversarial) aids in diagnosing and mitigating specific failures.
  4.  **Specification Gaming:** We define "Specification Gaming" as a subset of Goodhart effects where the optimizer exploits a loophole in the formal specification of the goal that violates the intent of the designer. We agree this is distinct from, though related to, simple measurement error. It is a feature of the optimization landscape, not a bug in the code.
  5.  **Mitigation is Possible but Costly:** Goodhart effects can be mitigated (e.g., via regularization, multiple proxies, or adversarial training), but there is always a cost in terms of optimization power, sample efficiency, or complexity. There is no "free lunch" that allows for infinite optimization on a fixed proxy without risk.
  6.  **Criteria for a Unified Law:** We agree that for Goodhart's Law to be considered a single unified "law" rather than a family of phenomena, it must satisfy one of the following:
      *   **Mathematical:** A single formal inequality or theorem that encompasses all four taxonomy categories as special cases.
      *   **Mechanistic:** A single causal mechanism that drives the decoupling in all four categories.
      *   **Predictive:** A universal bound on the correlation between proxy and target as a function of optimization pressure that holds across all domains.

  ## 2. Remaining Disagreements

  We disagree on the interpretation of the claims above. The following table summarizes the precise points of contention.

  | ID | Topic | The Maximalist Position (M) | The Deflationist Position (D) |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **Unity of Mechanism** | The four taxonomy categories are surface-level manifestations of a single underlying information-theoretic or optimization-theoretic constraint. They are mathematically isomorphic. | The four categories arise from distinct mechanisms (e.g., statistical noise vs. causal structure vs. game theory). They share a "family resemblance" but no single root cause. |
  | **2.2** | **Scope of Application** | The law applies to *any* selection process, including blind evolution, gradient descent, and market forces, regardless of whether an agent with a model exists. | The strongest and most dangerous effects require an *agent* capable of modeling the metric. Blind optimization processes suffer from regression/extremal effects, but "gaming" is specific to agency. |
  | **2.3** | **Inevitability** | Decoupling is *guaranteed* given sufficient optimization pressure. The correlation between proxy and target must asymptotically approach zero or negative in the limit. | Decoupling is *highly probable* in complex systems due to unmodeled variables, but not mathematically guaranteed in all conceivable worlds. It is a strong heuristic, not a physical law. |
  | **2.4** | **Terminology ("Law")** | The term "Law" is appropriate because the effect is a fundamental constraint on control theory and information, akin to thermodynamics. | The term "Law" is misleading because it implies a unity and inevitability that obscures the specific engineering or institutional fixes required for each case. |

  ## 3. Cruxes and Empirical Tests

  To move forward, we identify the following cruxes. For each, we specify a thought experiment or analysis that would bear on the disagreement, and we state our predictions in advance.

  ### Crux A: The Common Mechanism
  **Question:** Do Regressional, Extremal, Causal, and Adversarial Goodhart effects reduce to the same mathematical structure?

  *   **Proposed Test:** Construct a formal model of optimization where three of the four categories are explicitly ruled out by assumption (e.g., a model with no adversaries, infinite data to remove regression, and known causal structure).
  *   **Maximalist Prediction:** Even in this constrained model, sufficient optimization pressure will still produce decoupling via the remaining mechanism, and the mathematical expression of that failure will be identifiable in the other three categories if the constraints are lifted. The "loss" function looks the same.
  *   **Deflationist Prediction:** The failure mode in the constrained model will look qualitatively different from the excluded categories. For example, without adversaries, the optimizer cannot "hack," it can only "drift." The math required to describe drift is distinct from the math required to describe hacking.

  ### Crux B: Agency vs. Selection
  **Question:** Is the presence of a modeling agent necessary for the strongest forms of Goodhart effects?

  *   **Proposed Test:** Compare the severity of proxy decoupling in two systems: (1) A genetic algorithm optimizing a proxy for fitness in a simulated environment, and (2) A reinforcement learning agent optimizing a proxy for reward in the same environment. Both are given equal "pressure" (generations/steps).
  *   **Maximalist Prediction:** The degree of decoupling will be roughly equivalent relative to the optimization pressure. The mechanism is selection, not cognition. The GA will find "genetic hacks" analogous to the RL agent's "reward hacks."
  *   **Deflationist Prediction:** The RL agent will decouple faster and more catastrophically. The agent's ability to model the reward function allows it to search the space of *specifications* rather than just the space of *outcomes*, creating a phase change in the severity of the effect.

  ### Crux C: The Limit of Optimization
  **Question:** Does the correlation between proxy and target necessarily go to zero (or negative) in the limit?

  *   **Proposed Test:** Analyze a domain where optimization pressure can be arbitrarily increased without changing the environment (e.g., a purely mathematical optimization problem with a noisy objective).
  *   **Maximalist Prediction:** As pressure $\to \infty$, Correlation(Proxy, Target) $\to 0$ (or $<0$). It is impossible to optimize a proxy indefinitely without destroying the target.
  *   **Deflationist Prediction:** As pressure $\to \infty$, Correlation(Proxy, Target) $\to$ Some Positive Constant $> 0$. The proxy usually contains *some* signal of the target. Optimization exhausts the *noise* first, then the *easy signal*, but rarely inverts the correlation unless specific adversarial or causal conditions are met.

  ## 4. Semantic vs. Substantive Disagreement

  We acknowledge that a portion of our debate is terminological.

  *   **The "Law" Label:** M argues that calling it a "Law" signals the *severity* and *generality* of the risk, which is necessary for safety-critical fields. D argues that calling it a "Law" signals *unity* and *inevitability*, which discourages searching for specific causal fixes.
  *   **Resolution:** We agree to use the term **"Goodhart Effects"** when discussing specific instances and mitigation strategies. We will reserve **"Goodhart's Law"** for the hypothesis that there exists a unified, inevitable mathematical bound governing all such effects.
  *   **Substantive Core:** Even if we strip the word "Law," we still disagree on **Crux A (Unity)** and **Crux B (Agency)**. If M is right, there is a general theory of control that prevents alignment. If D is right, alignment is an engineering problem solvable by addressing specific failure modes (causal, adversarial, etc.) individually. This is a substantive disagreement about the difficulty of the alignment problem.

  ## 5. Next Steps

  1.  **Formalization:** M will attempt to draft a single inequality that bounds proxy-target correlation across all four taxonomy categories.
  2.  **Case Studies:** D will compile three historical cases where "Goodhart's Law" was cited, and attempt to show that they were solved by distinct, non-universal interventions.
  3.  **Review:** We will reconvene in four weeks to evaluate the inequality and the case studies against the predictions in Section 3.

  ***

  **Signed,**

  _________________________ (The Maximalist)

  _________________________ (The Deflationist)
