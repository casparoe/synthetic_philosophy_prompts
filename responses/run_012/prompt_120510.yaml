prompt: |-
  My roommate and I have been argueing about Goodhart's law for weeks now and I want to actually get somewhere instead of just trading examples. He's what I'd call a Goodhart maximalist: he thinks the law is basically a deep structural fact about optimization, measurement, and agency, so if you select hard enough on any proxy it decouples from the thing you care about, and specification gaming is just the visible tip. I'm more of a deflationist: the interesting cases are real, but I think they're a grab-bag of engineering failures, bad incentive design, and selection effects, and calling it a law makes it sound like there's one mechanism where there are several. We agree that models gaming reward functions is real and matters for alignment and policy, and that reward hacking is not just a bug in a particular loss function; we can't agree on whether there's a unified phenomenon underneath.

  To make this concrete, I brought in a taxonomy I half-remember and we've been using it. Regressional Goodhart: you pick a proxy correlated with the target, but the part of the proxy that isn't the target also gets selected for. Extremal Goodhart: the proxy is only good in the normal range, and optimization pushes you to the tails where it breaks. Causal Goodhart: you find an intervention on the proxy that doesn't go through the target at all. Adversarial Goodhart: another agent deliberately exploits your proxy. I don't know if that taxonomy is exhaustive or even right, but it's been useful. What I want is the adversarial-collaboration document we should have written instead of yelling at each other: a joint statement that both the maximalist and the deflationist could sign. Include a numbered section of agreed claims, about what the cases are, what counts as a Goodhart effect, what specification gaming is and isn't, what the taxonomy does and doesn't cover, and what would count as evidence for or against a unified law. Then a disagreements table: the precise remaining disagreements, each phrased in wording that the side holding it would actually accept, not a strawman. I suspect one crux is whether the four flavors share a common mechanism or are just four different mechanisms with a family resemblance, and another is whether the law is about agents, optimizers, or any selection process at all. For each crux, give the case, argument, or thought experiment both sides agree would bear on it, and write down what each side predicts about it in advance. If part of our fight is just about the word law or about what counts as one phenomenon, say so and explain which part. And please don't give me a bibliography or cite papers, I'm offline and I don't want guesses at titles; just use the ideas as described.
