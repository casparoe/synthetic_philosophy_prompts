answer: |-
  The established term you are hunting for is **Strategic Ignorance** (sometimes referred to in behavioural economics as **Instrumental Information Avoidance**).

  However, your intuition is correct that the standard definitions often get muddied with emotional avoidance (the Ostrich Effect) or cost-benefit analysis (Rational Ignorance). The specific mechanic you are describing—where the *possession* of truth alters the agent's utility function or constraints in a way that degrades performance—is best understood as a **Commitment Problem arising from Time Inconsistency**.

  Since you asked for a name if the existing ones feel imprecise, I propose we sharpen the terminology for this specific loop. Let us call it **The Interference Effect**.

  Here is the breakdown of why this fits, why the standard theorems appear to break, and how to distinguish it from mere weakness of will.

  ### 1. The Name and Neighbours

  **Strategic Ignorance** is the umbrella term. It covers any situation where an agent chooses not to acquire available information because knowing it would reduce their expected utility. However, in academic literature, this is often discussed in the context of *moral wiggle room* (e.g., not checking if a product is ethically sourced so one can buy it guilt-free).

  Your cases are different. They are not about moral licensing or emotional comfort; they are about **instrumental performance**.

  *   **Why it is not the Ostrich Effect:** You are right to dismiss this. The Ostrich Effect is primarily emotional regulation (avoiding anxiety). In your examples, the lead and the student are not avoiding *feelings*; they are avoiding a *change in incentives*. They are avoiding becoming the kind of person who acts sub-optimally.
  *   **Why it is not Rational Ignorance:** Rational ignorance assumes the *cost* of acquiring information outweighs the benefit. Here, the cost is zero. The 'cost' is the downstream behavioural distortion.
  *   **Why it is not a Self-Fulfilling Prophecy:** A standard self-fulfilling prophecy usually requires a public announcement or a shared belief (e.g., a bank run). Your examples are intrapersonal. The loop is closed entirely within one mind.

  **The Interference Effect** (coined for this context) captures the specific mechanism: the information interferes with the execution of the optimal policy by triggering a sub-routine (panic, coasting, micromanagement) that the agent cannot suppress once the data is known.

  ### 2. The Theorem and the Broken Assumption

  You are recalling **Blackwell's Theorem** (1951). In decision theory, it states that for a rational agent, more information is never worse than less information. If the information is useless, a rational agent can simply ignore it and act as they would have done without it. Thus, free information has non-negative value.

  Your cases seem to violate this. Why?

  Blackwell's Theorem relies on the assumption of **Dynamic Consistency** (or a Unitary Self). It assumes the 'you' that receives the information is the same 'you' that acts on it, with the same utility function and the same ability to execute commands.

  In your examples, this assumption breaks. We must model the agent as having **Time-Inconsistent Preferences** (often modelled as a conflict between a 'Planner' and a 'Doer').

  *   **The Planner (Time 1):** Wants the project to succeed / wants to study hard. Prefers *not* to know the bad news, because they anticipate the Doer will react poorly.
  *   **The Doer (Time 2):** Once the information is known, their constraints change. They *cannot* act as if they are ignorant. The knowledge acts as a new constraint or a shift in motivation (e.g., "It's already failing, so why bother?").

  Because the Doer cannot credibly commit to ignoring the information once possessed, the Planner rationally restricts the Doer's access to it. The information makes the agent worse off not because the data is 'bad', but because the agent lacks the **self-control** to decouple the knowledge from the action.

  Therefore, the theorem is not broken; rather, the conditions for the theorem (a single, consistent rational agent) are not met.

  ### 3. Boundary Cases: Strategy vs. Weakness of Will

  You asked how to distinguish this genuine information problem from simple weakness of will. The boundary lies in **Ex-Ante Preference**.

  *   **Weakness of Will (Akrasia):** The agent *wants* to know the information at Time 1, but upon receiving it at Time 2, they fail to act correctly due to impulse. They regret the *action*, not the *knowledge*.
  *   **The Interference Effect (Strategic Ignorance):** The agent *wants to restrict access* to the information at Time 1. They anticipate the failure at Time 2 and seek a **Commitment Device** (blindfolding themselves) to prevent it. They regret the *knowledge* itself.

  **The Test:**
  If you offered the student a contract at the start of the term: *"We will withhold your predicted grade, but you cannot ask for it later,"* would they sign?
  *   If **Yes**: It is Strategic Ignorance (The Interference Effect). It is a rational strategy for a flawed agent.
  *   If **No** (they want the info, but then panic later): It is Weakness of Will.

  ### 4. Summary Definition

  **The Interference Effect** (n.):
  A phenomenon in decision-making where the acquisition of accurate, cost-free information reduces an agent's expected outcome. This occurs not because the information alters the external environment, but because the agent suffers from **time-inconsistent preferences**. Possessing the information triggers a behavioural mode (e.g., defeatism, over-correction) that the agent cannot suppress, making ignorance a rational **commitment device** for the planning self.

  **In British English:**
  It is a situation where knowing the score changes how one plays the game, to the detriment of the final result. The rational move is to refuse to look at the cards.

  ### 5. Practical Implication

  The solution to The Interference Effect is not "toughening up" (which assumes the problem is emotional); it is **structural precommitment**.
  *   **For the Team Lead:** Do not build a dashboard that shows early failure rates. Design the workflow so that resource allocation is locked in until a later milestone.
  *   **For the Student:** Ask the teacher *not* to release predicted grades.

  In both cases, the agent is admitting that their future self cannot be trusted with the truth, and so they rationally choose blindness. It is not a failure of reason; it is a triumph of self-knowledge.
