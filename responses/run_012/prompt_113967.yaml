      *   *Key Argument 2: State vs. Criminal Killing.* Camus argues the death penalty is not justice but revenge. He famously calls it "the most premeditated of murders." The state plans it coldly, whereas the criminal often acts in passion. The state legitimizes murder by committing it. It creates a "contagion of murder."
      *   *Key Argument 3: Sanctity of Life/Religious Context.* Camus is often misinterpreted here. He does *not* ground his opposition primarily in the "sanctity of human life" in a religious or absolute metaphysical sense (like a Catholic doctrine). He is an absurdist/existentialist. He argues against the *legitimacy* of the state to decide life and death. He does discuss atonement, but his argument is more about the hypocrisy of society. He definitely argues against judicial error (irreversibility).
      *   *Key Argument 4: Alternative.* Camus proposes forced labor for life (hard labor). He argues this is more deterrent than death because it involves long suffering. He does *not* suggest the condemned should have the option of suicide. He argues against the secrecy and the ritual.
