answer: |-
  Your verdicts describe a coherent ethical framework, but it is not classical Utilitarianism, nor is it strict Deontology. It is a form of **Threshold Deontology with Lexical Priorities and Person-Based Aggregation.**

  Your intuition rejects the "single scale of value" assumed by the Utility Monster argument. Instead, you treat moral patients (persons) as the primary unit of account, not the raw sum of qualia. Below is the precise formulation of the principle that captures your pattern, the clauses that construct it, and the costs of adopting it.

  ### The Principle: Constrained Person-Centric Aggregation

  **Clause 1: The Source Constraint (Illegitimate Utility)**
  *   **Definition:** Utility derived from the intentional violation of another moral patient's rights (specifically, suffering inflicted as a means or end) has zero or negative moral weight.
  *   **Motivated by:** Case (1).
  *   **Implication:** A sadistic monster gains no moral credit for its pleasure. The calculation is not "1 Human Life vs. Infinite Sadistic Pleasure," but "1 Human Life vs. 0."
  *   **Prediction:** A being that gains pleasure from *watching* natural disasters (where no agent is the violator) might have its utility counted, but pleasure from *inflicted* terror never counts.

  **Clause 2: Lexical Thresholds (Incomparability of Severity)**
  *   **Definition:** Harms are sorted into lexical categories (e.g., Death/Torture > Maiming > Minor Pain > Trivial Annoyance). Aggregation is forbidden across categories. No quantity of lower-category harms can justify a higher-category harm.
  *   **Motivated by:** Case (3) (Dust Specks vs. Torture).
  *   **Implication:** You cannot trade a severe right-violation for any amount of trivial convenience.
  *   **Prediction:** A policy that saves a billion people from losing a penny cannot justify imprisoning one innocent person for a day.

  **Clause 3: Person-Based Aggregation (The Separateness Cap)**
  *   **Definition:** Within a single lexical category, aggregation is permitted across *persons*, but the intensity of experience within a *single person* has diminishing marginal moral weight relative to the number of distinct persons. One person's internal intensity cannot outweigh the aggregated comparable interests of $N$ other persons, regardless of how high their subjective utility function runs.
  *   **Motivated by:** Case (5) (Hypersensitive Finger).
  *   **Implication:** Moral weight is distributed by *headcount* first, *intensity* second. A hypersensitive person does not count as 1,000 people. This prevents a single "deep feeler" from holding the community hostage.
  *   **Prediction:** If one person feels grief 1,000,000x more intensely than others at the loss of a park, the community can still vote to build the park if enough others benefit moderately.

  **Clause 4: Structural Identity (No Double Counting)**
  *   **Definition:** The unit of moral concern is the distinct locus of consciousness/agency. Internal subdivision of a single agent (sub-routines, sub-agents) does not create external moral weight.
  *   **Motivated by:** Case (6) (Hive Mind).
  *   **Implication:** A hive mind counts as *one* moral patient (or exactly as many as there are distinct conscious sub-agents, but not the arithmetic sum of their utility outputs). You cannot amplify moral weight by splitting a mind.
  *   **Prediction:** An AI that copies its source code a trillion times to vote in a democratic utility calculation gains no additional moral standing.

  **Clause 5: The Intention Constraint (Doctrine of Double Effect)**
  *   **Definition:** Inflicting harm as a *means* to an end requires a higher justificatory threshold (often impossible) than inflicting harm as a *foreseen side effect*.
  *   **Motivated by:** Case (2) (Your hesitation compared to Case 1).
  *   **Implication:** Killing to harvest pleasure is forbidden (Means). Killing as an unavoidable side-effect of a necessary activity is permissible only if the good is proportionate and the harm is minimized.
  *   **Prediction:** Trolley Problem: You may switch the track (side effect), but you may not push the fat man (means), even if the utility math is identical.

  ---

  ### Predictions for Unlisted Cases

  **Case A: The Procreative Monster**
  *A being whose consumption of a human produces enough utility to create a million new, happy beings.*
  *   **Verdict:** **No.**
  *   **Reasoning:** Clause 1 (Source Constraint) likely applies if the consumption involves killing/violation. Even if it doesn't, Clause 2 (Lexical Thresholds) suggests a severe harm (death) cannot be traded for positive utility (new lives), as rights are side-constraints, not maximizable goods. You cannot violate one person's right to life to bring others into existence (Non-Identity Problem).

  **Case B: The Self-Rewriting Monster**
  *A monster that will permanently rewrite its own psychology to be non-sadistic and normal if fed one human.*
  *   **Verdict:** **No (with extreme hesitation).**
  *   **Reasoning:** This tests Clause 5. Feeding the human is a *means* to the rewriting. While the future good is immense, your framework prioritizes the current rights-bearer over future utility gains. However, if the monster is otherwise a "ticking time bomb" (will kill billions if not fed), Clause 2 might allow the trade as a "catastrophe prevention" exception. If it's merely a gain of utility, the right holds.

  **Case C: The Hypersensitive Martyr**
  *One hypersensitive person (1000x pain) offers to be tortured to save 100 normal people from torture.*
  *   **Verdict:** **Yes (Accept the offer).**
  *   **Reasoning:** Clause 3 restricts *imposing* harm on the hypersensitive against their will. If they *consent*, the rights constraint is lifted. The aggregation then proceeds on raw utility, where 1000 units > 100 units. Your principle protects the person from *others*, not from themselves.

  ---

  ### The Cost: Which Verdicts Must You Abandon?

  No principle is without friction. If you adopt **Constrained Person-Centric Aggregation**, here is where your current verdicts are most vulnerable:

  **1. The Threat to Case (4) (Torture the One to Save a Billion)**
  *   **The Conflict:** Clause 3 (Person-Based Aggregation) and Clause 2 (Lexical Thresholds) lean heavily toward rights as side-constraints. If rights are truly lexical, you cannot torture the one innocent person even to save a billion from torture (that is using them as a means).
  *   **The Adjustment:** To keep your "Yes" on Case (4), you must admit that **Threshold Deontology** overrides Rights in cases of *catastrophe*. You must define "Billion Tortures" as a catastrophe that dissolves the side-constraint, but "100 Fingers" (Case 5) as not catastrophic enough to dissolve the constraint against the hypersensitive person.
  *   **The Risk:** This creates a slippery slope. Where is the line between Case (4) and Case (5)? Your principle requires a bright line between "Aggregate Moderate Harm" and "Catastrophic Aggregate Harm." If you cannot define that line precisely, Case (4) and Case (5) are in tension.

  **2. The Instability of Case (2) (Foreseen Death)**
  *   **The Conflict:** You noted "markedly less confidence" here. Clause 5 (Intention Constraint) is the only thing saving this. However, many modern consequentialists (and some deontologists) argue that *foreseen* inevitable death is morally equivalent to *intended* death if the outcome is identical.
  *   **The Adjustment:** If you tighten Clause 5 to be rigorous, you might find that if the pleasure in Case (2) is not *necessary* (it's just pleasure), the proportionality test fails anyway. The death is disproportionate to the pleasure, regardless of intent.
  *   **The Risk:** Your hesitation is likely correct. This case is the weakest link. If the pleasure were *vast* (e.g., the monster's pleasure sustains a utopia), your principle might force you to allow the side-effect death, which feels dangerous.

  **3. The Hive Mind (Case 6) Nuance**
  *   **The Conflict:** You reject the Hive Mind because it feels like "counting twice." But if the trillion sub-agents are *conscious*, Clause 4 might be too harsh.
  *   **The Adjustment:** You may need to refine Clause 4 to: "Moral weight is assigned to distinct *centers of narrative gravity*." If the hive mind's sub-agents have no independent narrative, they count as one. If they do, they count as many.
  *   **The Risk:** If you admit the sub-agents count individually, the Hive Mind *becomes* a Utility Monster by sheer numbers, not intensity. You would have to feed it the human to save the trillion sub-agents from starvation. Your "No" verdict relies on the sub-agents *not* counting as full persons.

  ### Summary
  Your intuition is best described as **Rawlsian Separateness of Persons combined with Lexical Harm Thresholds.**

  *   **It saves:** (1), (3), (5), (6), (7).
  *   **It endangers:** (4) (unless you accept a "catastrophe" exception) and (2) (unless you rigorously defend Double Effect).
  *   **It clarifies:** The Utility Monster fails not because utility isn't real, but because **persons are not containers for utility.** They are boundaries against it.

  The specific clause you were missing for Case (5) is the **Separateness Cap**: *Intensity scales logarithmically across person-boundaries.* One person's deep pain cannot outweigh many persons' shallow pain of the same lexical type, because the moral cost is incurred per violation of a person, not per unit of pain.
