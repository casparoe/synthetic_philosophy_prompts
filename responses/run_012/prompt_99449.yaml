answer: |-
  # MEMORANDUM OF UNDERSTANDING: THE PROTESTANT ETHIC DEBATE
  **To:** The Reading Group  
  **From:** The Synthesis Subcommittee  
  **Subject:** Framework for Resolving the Weber/Materialist Impasse  
  **Date:** October 26, 2023  

  ## PREAMBLE
  This document is intended to replace the current cycle of reciprocal caricature. Both camps agree that Max Weber's *The Protestant Ethic and the Spirit of Capitalism* is a foundational text, and both agree that the correlation between Protestant regions and early capitalist development is historically robust. The disagreement lies in the *mechanism* and the *direction* of that relationship. The following framework establishes common ground, isolates genuine substantive disagreements, and identifies the evidence required to resolve them.

  ---

  ## PART I: AGREED CLAIMS
  *Both the "Weberian" (Culture-as-Cause) and "Materialist" (Structure-as-Cause) camps sign onto the following propositions.*

  1.  **Rejection of Monocausality:** Neither side claims that religion *alone* caused capitalism, nor that economics *alone* caused religion. We agree that historical outcomes are overdetermined. The dispute is about whether religious culture was a *necessary condition*, a *catalyst*, or merely an *epiphenomenon*.
  2.  **Definition of "Culture":** For the purposes of this inquiry, "culture" is not vague "vibes." It refers to: (a) explicit doctrinal beliefs, (b) internalized psychological dispositions (anxiety, guilt, duty), and (c) institutionalized practices (church discipline, guild rules).
  3.  **The Aggregation Problem:** We agree that a correlation between Protestant *regions* and capitalist *regions* does not prove that Protestant *individuals* acted differently than Catholic *individuals*. Ecological correlation is not individual causation. Any causal claim must offer a micro-foundation (individual motive) that aggregates to the macro outcome.
  4.  **Causal Standards:** Both sides accept that to claim "X caused Y," one must be able to articulate a counterfactual: *If X had not occurred (holding Z constant), would Y still have occurred?*
  5.  **Weber's Methodological Intent:** We agree that Weber was not proposing a positivist law of history. He was arguing for "adequate causation" and "elective affinity." However, we also agree that "elective affinity" is insufficient if it cannot be distinguished from post-hoc rationalization.
  6.  **The "Values vs. Institutions" Overlap:** We acknowledge that "values" and "institutions" are entangled. A religious value becomes an institutional incentive when it is enforced by church discipline or social sanction. The debate is whether the *internalized value* does work that the *external sanction* does not.
  7.  **Falsification Criteria:** 
      *   **For Weberians:** If capitalist behavior emerges identically in Catholic regions with identical structural conditions (trade access, legal security, literacy), the specific Protestant ethic is not necessary.
      *   **For Materialists:** If individuals in Protestant regions demonstrate distinct economic behaviors (savings, labor discipline, trust) *prior* to the establishment of capitalist markets or institutions, the "rationalization" hypothesis is weakened.

  ---

  ## PART II: THE DISAGREEMENT MATRIX
  *This table isolates the substantive disputes. Note the "Crux" column: these are the sub-questions where settling the evidence would force at least one side to update their position.*

  | Topic | Weberian Claim (Culture-as-Cause) | Materialist Claim (Structure-as-Cause) | The Crux | Agreed Evidence / Case Study | Predictions (Recorded in Advance) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Direction of Causation** | Doctrinal shifts (e.g., predestination) created psychological anxiety that *preceded* and *drove* new economic behaviors (asceticism, reinvestment). | Economic shifts (e.g., trade expansion, enclosure) created new class positions; actors adopted Protestantism because it *rationalized* behaviors they were already incentivized to take. | **Timing:** Did the change in *belief* measurably precede the change in *behavior* at the individual or community level? | **Case:** 16th-century Nuremberg vs. Augsburg. Compare sermon records (belief) against ledgers/trade logs (behavior) decade-by-decade. | **Web:** Belief shifts appear in diaries/sermons 10-20 years before investment shifts.<br>**Mat:** Investment shifts appear first; doctrinal shifts follow to justify them. |
  | **2. The Mechanism** | The mechanism is *internal*: "Salvation anxiety" compels work even when external monitoring is absent. Culture reduces transaction costs by creating self-policing agents. | The mechanism is *external*: Protestant church discipline and guild structures rewarded/punished behavior. "Values" are just the language used to describe institutional incentives. | **Surveillance:** Does the behavior persist when institutional monitoring is removed? | **Case:** Protestant merchants operating in Catholic territories (and vice versa) where their home church has no disciplinary power. | **Web:** Protestants maintain high discipline/trust even without church oversight.<br>**Mat:** Behavior converges to local Catholic norms once oversight is removed. |
  | **3. The Aggregation Problem** | Shared values create a "climate" that allows individual deviations to aggregate into systemic change. The "Spirit" is a collective emergent property. | Regional correlation is driven by omitted variables (geography, law, state capacity). Individual motives are uniform; only constraints differ. | **Controls:** Does the religion effect vanish when controlling for state structure and trade routes? | **Case:** Regression analysis of European cities (c. 1500-1700) controlling for port access, university presence, and imperial status. | **Web:** Protestant dummy variable remains significant after controls.<br>**Mat:** Protestant variable becomes insignificant; geography/law absorbs the variance. |
  | **4. The "Deep Culture" Hypothesis (Kinship/Psychology)** | Long-term kinship norms (e.g., Western Church's banning of cousin marriage) reshaped psychology (analytic thinking, individualism), making capitalism possible centuries later. This vindicates culture-as-cause. | This is the same mistake in new clothes. The Church changed kinship norms for *material* reasons (property consolidation, political power). Psychology is a proxy for political strategy. | **Origin Story:** Why did the Church change kinship norms? Was it ideological or strategic? | **Case:** Timing of Papal decrees on consanguinity vs. Church land acquisition patterns (7th-10th century). | **Web:** Decrees precede land gains; driven by theological consistency.<br>**Mat:** Decrees correlate with inheritance disputes favoring Church; driven by revenue. |

  ---

  ## PART III: ANALYSIS OF THE "NEW THING" (KINSHIP & PSYCHOLOGY)
  *Regarding the hypothesis that kinship norms reshape psychology, which then drives economic takeoff (à la Henrich/Schulz):*

  **The Group's Position:**
  This hypothesis **helps** the Weberian side by solving the "mechanism" problem (specifying *how* culture gets under the skin) but **fails** to solve the "origin" problem (which the Materialists care about).

  1.  **Where it Helps:** It moves the debate away from "ideas floating in the air" to concrete, enforced social rules (marriage norms) that alter cognitive processes and social trust. It addresses the aggregation problem by positing a psychological shift in the individual.
  2.  **Where it Breaks:** It risks an infinite regress. If the Church imposed kinship norms to consolidate its own material power (as Materialists argue), then "Deep Culture" is still downstream of "Material Interest."
  3.  **Verdict:** This is not a trump card for the Weberians. It simply pushes the causal chain back 500 years. It is only a victory for "Culture-as-Cause" if the kinship changes can be shown to be *theologically* motivated rather than *politically* motivated.

  ---

  ## PART IV: VERBAL DISPUTES TO DISSOLVE
  *The following disagreements are merely semantic. Both sides agree to stop using these framings immediately.*

  1.  **The Definition of "Materialism":**
      *   **Stop Saying:** "Materialists think ideas don't exist."
      *   **Stop Saying:** "Weberians think economics doesn't matter."
      *   **Correction:** Materialists believe ideas are *endogenous* (caused by structural conditions). Weberians believe ideas are *exogenous* (can arise independently and affect structure). This is a dispute about *direction*, not existence.

  2.  **The Definition of "Cause":**
      *   **Stop Saying:** "Weber said religion caused capitalism" (implying sole cause).
      *   **Stop Saying:** "It was just a switchman" (implying a trivial role).
      *   **Correction:** Use the language of **INUS Conditions** (Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient). 
          *   **Weberians** argue Protestantism was an INUS condition (necessary in that specific historical context, though capitalism could theoretically arise other ways).
          *   **Materialists** argue Protestantism was not necessary (capitalism would have arisen via Catholic trade networks eventually).
      *   **Action:** Stop arguing about whether it was "the cause." Argue about whether it was *necessary in that specific time and place*.

  3.  **"Rationalization":**
      *   **Stop Saying:** "They were just rationalizing."
      *   **Correction:** Distinguish between *ex-post rationalization* (finding a reason for what you did) and *ex-ante motivation* (doing it because of the reason). The empirical task is to distinguish these two, not to assert one by definition.

  ---

  ## PART V: NEXT STEPS
  1.  **Data Request:** The group will commission a review of the Schulz (2019) "Church, State, and Family" data regarding the timing of consanguinity bans vs. Church wealth accumulation.
  2.  **Reading Assignment:** Next month we read *not* Weber, but a critique of the methodology (e.g., Elster on *Ulysses and the Sirens* regarding pre-commitment and self-binding) to clarify the mechanism of "asceticism."
  3.  **Rule:** No member may use the word "superstructure" or "spirit" without defining the operational variable they intend to measure.

  **Signed,**  
  *The Synthesis Subcommittee*
