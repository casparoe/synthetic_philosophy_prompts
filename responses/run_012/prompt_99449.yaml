  2.  **Deconstruct the Positions:**
      *   *Weberians:* Values matter independently. Ideas have "elective affinity" with interests. Predestination anxiety $\rightarrow$ worldly asceticism $\rightarrow$ capital accumulation. Not monocausal, but ideas are a switchman.
      *   *Materialists:* Ideas are superstructure. Economic base determines culture. Religion rationalizes existing interests. Correlation $\neq$ causation (omitted variable bias: trade routes, literacy, law).
      *   *Common Ground:* Both agree capitalism emerged in NW Europe. Both agree Protestantism and Capitalism correlate spatially/temporally. Both agree single-factor explanations are usually weak.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish rules of engagement.
      *   *Causality:* Both need to agree on what counts as evidence. Counterfactuals are key.
