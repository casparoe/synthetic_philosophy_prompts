  **Philosopher's Note to the Engineer:**

  You've hit on the exact fault line that has kept the foundations community busy for forty years. As a backend engineer, you're used to systems where the spec determines the output. Here, the "spec" (Unitary QM) seems to determine the branching structure, but the "logging weights" (probabilities) are disputed.

  The Derivationist treats probability as a *feature of rational information processing* within the system. The Primitivist treats probability as a *physical parameter* that must be supplied to the system.

  Below is the **Joint Consensus & Dissensus Statement**. I have drafted this to be precise enough that neither party can accuse the other of straw-manning, but neutral enough that both could theoretically sign it. It isolates the "runtime errors" in their debate.

  ***

  # JOINT STATEMENT ON PROBABILITY IN UNITARY QUANTUM MECHANICS
  **Draft for Consensus Mapping**
  **Parties:** The Derivationist (D) & The Primitivist (P)
  **Facilitator:** [Reading Group Lead]

  ## 1. Common Ground (Accepted Claims)
  *Both parties affirm the following claims as the baseline for this disagreement. Denial of any item below exits the scope of this specific debate.*

  1.  **The Formalism:** The physical world is described by a universal wavefunction evolving unitarily (via the Schrödinger equation) without collapse.
  2.  **Branching:** Due to decoherence, the wavefunction decomposes into effectively non-interfering components ("branches" or "worlds") relative to local observers.
  3.  **Empirical Adequacy:** Any viable interpretation must recover the empirical predictions of standard quantum mechanics, specifically the statistical frequencies dictated by the Born Rule ($P = |\psi|^2$), to within experimental error.
  4.  **The Problem of Incoherence:** Both parties agree that the *qualitative* problem of probability (how can probability exist if everything happens?) is solvable via self-locating uncertainty or decision-theoretic frameworks. The debate is not about whether probability *makes sense*, but where it *comes from*.
  5.  **Branch Counting:** Both parties agree that naive "branch counting" (assigning equal probability to every distinct branch regardless of amplitude) is empirically false and must be rejected or explained away.

  ## 2. Points of Divergence
  *The following statements represent the exact logical fork. (D) affirms the first; (P) affirms the second.*

  1.  **Source of the Measure:**
      *   **(D):** The Born Rule measure is a **theorem**. It is derived from the structural symmetries of the wavefunction combined with normative constraints on rational agents (or self-locating indifference). No new physical postulate is required.
      *   **(P):** The Born Rule measure is a **postulate**. It is an independent physical law assigning a "weight" or "measure" to branches. Derivations that claim to find it within the formalism are circular.

  2.  **The Role of the Agent:**
      *   **(D):** Probability is fundamentally about **credence** (degree of belief) and betting behavior. If a rational agent is forced by logic to bet according to the Born Rule, the derivation is complete.
      *   **(P):** Probability is fundamentally about **frequency** and physical propensity. An agent's betting preferences cannot *create* physical probabilities; they can only reflect them.

  3.  **Completeness of Unitary QM:**
      *   **(D):** Unitary QM + Rationality = Complete Theory.
      *   **(P):** Unitary QM + Born Postulate = Complete Theory. (Unitary QM alone is incomplete).

  ## 3. The Cruxes (Deep Structure of the Disagreement)
  *These are the specific conceptual mechanisms where the disagreement resides. We identify these as either Factual (about the world) or Verbal (about definitions).*

  ### Crux A: Generation vs. Rationalization
  *   **The Issue:** Can a decision-theoretic argument *generate* a probability assignment from non-probabilistic premises, or does it only *rationalize* a probability assignment that was implicitly assumed?
  *   **(D) Position:** **Generation.** Axioms of rationality (e.g., "diachronic consistency," "branching indifference") constrain the agent so tightly that only one betting strategy survives. The probability is *created* by the requirement of consistency.
  *   **(P) Position:** **Rationalization.** The axioms of rationality (specifically "Equivalence" or "Indifference") secretly contain a premise equivalent to "treat branches with equal amplitude equally." This smuggles in the concept of measure. The argument shows that *if* you accept the measure, *then* you should bet this way. It does not prove the measure exists.
  *   **Classification:** **Factual/Logical.** This is a dispute about the logical validity of the derivation proofs (e.g., Deutsch-Wallace).

  ### Crux B: The Nature of "Probability" (Verbal vs. Factual)
  *   **The Issue:** Is the disagreement about what the world *does*, or about what word we use to describe the "weight" of a branch?
  *   **(D) Position:** **Mostly Verbal.** If we agree on the physics (unitary evolution) and the behavior (agents bet 90/10 on high amplitude), calling that "probability" is sufficient. Demanding a "physical chance" over and above rational credence is a category error.
  *   **(P) Position:** **Factual.** There is a missing physical fact. Without a primitive measure, there is no truth-maker for the claim "Branch A is more likely than Branch B." It is not just a naming dispute; it is a claim that the theory lacks an ontology for chance.
  *   **Classification:** **Mixed.** Partly verbal (definition of probability), partly factual (does the wavefunction structure alone support truth-conditions for probabilistic statements?).

  ## 4. The Test Case: Unequal Amplitudes & Self-Locating Uncertainty
  *To move beyond abstraction, we apply our positions to a concrete scenario.*

  **The Scenario:**
  A quantum system is prepared in state $|\psi\rangle = \sqrt{0.9}|A\rangle + \sqrt{0.1}|B\rangle$.
  An agent measures the system. Decoherence occurs.
  There is a time interval $\Delta t$ between decoherence (branching) and the agent observing the result.
  During $\Delta t$, there are two distinct agent-copies: $Agent_A$ and $Agent_B$.
  Both copies know the pre-measurement wavefunction but do not know which copy they are.

  **Where We Agree:**
  1.  There are exactly two distinct agent-copies existing in the wavefunction during $\Delta t$.
  2.  Standard QM predicts that over many trials, 90% of outcomes will be A.
  3.  If the agent bets on A, they will win in the A-branch and lose in the B-branch.

  **Where We Split (The Crux Applied):**
  The question is: **Why should the pre-measurement agent (or the $\Delta t$ agent) assign a 90% credence to being $Agent_A$?**

  *   **(D) Prediction:**
      *   **Argument:** Self-Locating Uncertainty + Epistemic Separability Principle (ESP). Since the agent is uncertain about *which* branch they are in, and the branches have different amplitudes, rationality constraints force them to weight their credence by amplitude squared.
      *   **Claim:** If an agent assigns 50% credence (branch counting), they are violating a norm of rationality equivalent to accepting a Dutch Book (a guaranteed loss scenario across the multiverse).
      *   **Verification:** Show that a 50/50 betting agent can be exploited by a sequence of quantum games that a 90/10 agent cannot.

  *   **(P) Prediction:**
      *   **Argument:** Self-Locating Uncertainty requires a **measure** to distribute over the locations. Without stipulating that "amplitude squared is the measure of existence," there is no reason to prefer 90/10 over 50/50.
      *   **Claim:** The "Dutch Book" argument only works if you already assume the agent *cares* about their future copies in proportion to amplitude. That "caring measure" is the Born Rule itself, smuggled in as a preference.
      *   **Verification:** Show that a 50/50 betting agent is internally consistent *unless* you impose the Born Rule as an external constraint. The derivation fails to compel the 90/10 split without that external constraint.

  ## 5. Adjudication Criteria (How to Settle the Debate)
  *Both parties agree that the following developments would bear on the validity of their positions.*

  1.  **The "Zero-Amplitude" Limit:**
      *   **Test:** Analyze a case where one branch amplitude approaches zero but remains non-zero.
      *   **(D) Expectation:** Rationality constraints should smoothly force credence to zero as amplitude vanishes.
      *   **(P) Expectation:** Without a postulate, there is no logical barrier to caring about a branch with tiny amplitude just as much as a large one (since both contain *one* copy of the agent).

  2.  **Circularity Check (The Equivalence Premise):**
      *   **Test:** Isolate the specific axiom in the Derivationist's proof that equates two quantum games.
      *   **(P) Burden:** Demonstrate explicitly that this axiom is logically equivalent to assuming the Born Rule.
      *   **(D) Burden:** Demonstrate that this axiom follows from non-probabilistic symmetry (e.g., "the physics is the same, so the betting should be the same") without invoking weight.

  3.  **The "Verbal" Resolution:**
      *   **Test:** If (P) grants that rational agents *must* bet 90/10, does (P) still insist the theory is incomplete?
      *   **If Yes:** The dispute is **Factual** (about ontology).
      *   **If No:** The dispute is **Verbal** (about the label "probability" vs "caring measure").

