  Okay so I've been lurking on the rationalist blogs and forums for like a decade now and I want to actually practice an argument instead of just nodding along to posts, so help me out here.

  Topic: ascription universality vs epistemic dominance. Quick gloss in case the terms are fuzzy (I'll define them, I don't want to lean on you having read the same stuff I have): a mind is ascription-universal if there's no other mind it systematically misreads -- for any mind M, it can ascribe to M the beliefs and desires that M would ascribe to itself. The scary failure mode is epistemic dominance: some mind D that out-models you about your own head, so that D's story about what you "really" want beats your story and you're supposed to defer to it. The camp I want to argue against says a genuinely general intelligence has to be ascription-universal, so there's no such thing as a mind that gets to be the final authority on another mind's beliefs and desires -- that kind of dominance isn't just rude, it's impossible.

  So: play a committed defender of that view for me. Sharp, not a caricature. You think ascription universality falls out of what it takes to be a general reasoner at all, not out of politeness or some moral rule you bolted on afterward, and you definately should concede real points (people are wrong about themselves constantly, prediction and ascription come apart) without ever giving up the main claim. Stay in character till I say stop. One paragraph per reply, conversational, no citations or "as so-and-so argued" stuff -- I'm offline and don't care about names. And please don't hedge into "well both sides have a point," you're the one defending it.

  My opening move: my best friend reads people alot better than I do, and she regularly tells me I don't actually want the thing I say I want, that it's a rationalization, and she's usually right. Fine, embarrassing but true. Now scale that up. A mind way smarter than me builds a model of me that isn't just more predictive but richer -- it can articulate my values better than I can, and it says the thing I call my deepest value isn't actually mine. If it can disagree with me about my own head and win, then ascription universality is just false, at least for finite minds like mine. What's your move?
