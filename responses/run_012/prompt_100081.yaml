  **From Where I Stand**

  The room is quiet, dust hangs in the air,
  A window frames the grey of afternoon.
  You pause within the doorway, standing there,
  The light extends across the floor like noon.
  I see the shape of shoulders and of head,
  The shadow stretches out to meet my feet.
  No sound is made, nothing is strictly said,
  The heat remains, the air is still and sweet.
  I watch the strip of brightness on the wood,
  I watch the hand that rests upon the frame.
  It looks as real as anything ever could,
  I stay within the room and call your name.

