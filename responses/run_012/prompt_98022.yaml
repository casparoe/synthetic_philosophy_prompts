      *   **Specific Constraint 4:** Organize technical heart around $\Sigma_1$ vs. $\Pi_1$ asymmetry (absolute vs. relative). Explain *when* to introduce this.
      *   **Specific Constraint 5:** Map misconceptions in order of surfacing, with intervention points. Include the "most feared" misconception.
      *   **Specific Constraint 6:** Closing question to test understanding (relativity vs. brokenness).
      *   **Specific Constraint 7:** What to explicitly refuse to cover (scope limitation).

