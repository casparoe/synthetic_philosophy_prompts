      *   **Step 5: The Resolution (Absoluteness).** Why isn't $a$ actually uncountable? Because the bijection $f: \omega \to a$ exists outside $\mathcal{M}$ but not *in* $\mathcal{M}$. This is where $\Sigma_1$ (existence of bijection) vs $\Pi_1$ (non-existence) comes in.
      *   **The Carrying Example:** Needs to be specific. Let's use the set of reals $\mathbb{R}$ (or $\mathcal{P}(\omega)$) inside the model. Let's call the object $r \in \mathcal{M}$.
      *   **The $\Sigma_1$/$\Pi_1$ Point:** "Countable" is $\Sigma_1$ (there exists a bijection). "Uncountable" is $\Pi_1$ (for all functions, not a bijection). $\Sigma_1$ formulas are absolute upwards (if true in $M$, true in $V$). $\Pi_1$ are not. Wait, actually:
          *   "x is countable" = $\exists f (f: \omega \to x \text{ is surjection})$. This is $\Sigma_1$. If $M$ sees a bijection, $V$ sees it (usually, assuming transitive models, but here we have general models). Actually, for general models, we need to be careful.
          *   Better distinction: "There exists a bijection" is existential. If $M$ says "No bijection exists" ($\forall f \neg \text{Bij}(f)$), that is universal. $V$ might find a bijection that $M$ doesn't contain.
          *   So: "x is uncountable" is $\Pi_1$ relative to the model. It is not absolute. "x is countable" is $\Sigma_1$. It *is* absolute in the sense that if $M$ sees a bijection, it really is countable. But if $M$ says "uncountable", $V$ might disagree.
