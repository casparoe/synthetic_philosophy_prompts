      *   *Crucial Ordering:* You cannot state the paradox properly until they understand that "uncountable" is defined by a formula ($\neg \exists f (f: \omega \to x \text{ is bijection})$). You cannot resolve it until they understand that $\exists$ inside $M$ is restricted to $M$.

