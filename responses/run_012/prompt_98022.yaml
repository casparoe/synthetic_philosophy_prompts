  6.  **Refining the $\Sigma_1$/$\Pi_1$ Section:**
      *   This is technical. They know logic. Use the quantifier structure.
      *   Countable: $\exists f \dots$ ($\Sigma_1$).
      *   Uncountable: $\neg \exists f \dots$ i.e., $\forall f \neg \dots$ ($\Pi_1$).
      *   Key insight: Existence claims inside a model are verified by objects *in the domain*. If the domain is small, existence claims are harder to satisfy, non-existence claims are easier to satisfy.
      *   Timing: After the paradox statement, before the metaphysical discussion.

  7.  **Closing Question:**
      *   Needs to distinguish "Relativity" from "Brokenness."
      *   Idea: Ask about a statement that *would* be absolute. Or ask them to describe the bijection's status.
      *   Better: Ask about the relationship between the "real" universe and the model.
      *   Draft: "If we are living in a countable model, does Cantor's theorem fail?" (No). "Is the bijection real?" (Yes, but not in the model).
      *   Selected Question: Focus on the status of the bijection function.

  8.  **What to Refuse to Cover:**
      *   Second-order logic (SOL). It tempts them to "fix" FOL.
      *   Multiverse views / Forcing details.
      *   Constructing the model (Henkin).
      *   Skolem's philosophical writings (too historical/confusing).
      *   Absolute vs. Relative distinction in full generality (just stick to countability).

