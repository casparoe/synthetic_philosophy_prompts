answer: |-
  You are running into the wall that stopped the literature from coalescing into a single "Unified Field Theory" of speech acts. There is no single rule because speech acts are not a natural kind; they are a functional cluster. However, your intuitions are remarkably consistent with a **Typological Principle**.

  Your friction comes from trying to apply the success conditions of one type of act (Commissives like promises) to another type (Expressives like apologies).

  Here is the principle that best fits your pile, followed by a rival that forces you to change your mind, and then the verdicts you asked for.

  ### The Principle: The Illocutionary Typology Rule

  **Statement:** The conditions for the successful performance of a speech act are determined by its **Illocutionary Point**.
  1.  **Commissives (Promises, Bets, Vows):** Success consists in the **creation of a normative obligation**. The speaker's internal psychological state (sincerity) is irrelevant to the *existence* of the act, though relevant to its *honesty*.
  2.  **Expressives (Apologies, Forgiveness, Thanks):** Success consists in the **manifestation of a psychological state**. If the state is absent, the act is void, regardless of utterance.
  3.  **Declaratives (Sentencing, Marrying, Quitting, Firing):** Success consists in **conventional authority**. The utterance must match a procedure executed by an agent with recognized standing. The act creates a new reality by describing it as existing.

  **What each clause buys you:**
  *   **Clause 1 (Commissives):** Explains why the **Lying Promise** is still a promise. You created the obligation; you just intend to violate it. It also explains the **Joking Bet**: once the other party accepts ("You're on"), the normative frame locks in, overriding the initial joke.
  *   **Clause 2 (Expressives):** Explains why **Hollow Forgiveness** and **Coerced Apologies** are failures. The *point* of these acts is to express a specific inner state (remorse, release of resentment). If the state is missing, the act is a counterfeit. This resolves your core tension: Promises bind the *future*; Apologies/Forgiveness report the *present interior*.
  *   **Clause 3 (Declaratives):** Explains the **Invalid Judge** and **Mail-Order Officiant**. The Judge had the *trappings* of authority (so the act happened, though defeasible); the Mail-Order Officiant lacked the *convention* (so the act was null). It explains why **Common Law Marriage** works: the "declaration" wasn't the words at the altar, but the community's subsequent recognition of the status (a slower, factual declarative).

  **The Verdicts You Must Give Up:**
  To keep this principle, you have to adjust one intuition in your pile:
  *   **The Wedding Objector (No Standing):** You said he *did* object, just ineffectively. Under strict Typology (Clause 3), if he has *no* standing, he cannot perform the Declarative act of "Objecting" in the procedural sense. He performed an *Assertive* ("I have an objection") or an *Expressive* ("I disapprove"), but he did not successfully execute the institutional *Objection*. You must concede he interrupted, but did not technically "object" in the speech-act sense.
  *   **The Dying Father Vow:** You said it's not a promise because no one can hold you to it. Clause 1 says a promise creates an obligation *to the act*, not necessarily to a enforcer. To fit the principle, you must accept it *was* a promise (a vow to oneself/the memory), just one with no external enforcement mechanism.

  ---

  ### The Rival: The Strict Conventionalist Principle (Austin's Ghost)

  **Statement:** An utterance is the act it names if and only if it satisfies the **Felicity Conditions** of the relevant convention. If any condition (standing, sincerity, procedure, uptake) is missing, the act is "infelicitous"—it misfires or is abused, but it is not the act claimed.

  **Where it conflicts with you:**
  *   **Lying Promise:** A Strict Conventionalist might argue that a promise *requires* the intention to fulfill (Sincerity Condition). If you lack it, you haven't promised; you've merely *pretended* to promise. You would have to admit your friend made no promise at all, only a lie.
  *   **Apology to the Dead:** A Strict Conventionalist often requires **Uptake**. If the act cannot be received, it misfires. You would have to admit the apology to the photo was void.
  *   **Invalid Judge:** If the appointment is invalid, the standing condition fails. The sentencing is not just "unlawful," it is *nothing*. You would have to admit the prisoner was never sentenced, just kidnapped by the state.

  ---

  ### Verdicts on New Cases (Using the Typology Rule)

  **1. The Doctor ("You'll be fine" knowing you won't)**
  *   **Type:** Assertive (Prediction) masked as a Commissive (Assurance).
  *   **Verdict:** It is a **Lie**, not a Guarantee.
  *   **Reasoning:** As an Assertive, it fails the truth condition. As a Commissive (assurance), it creates an expectation of care, but medical outcomes are not fully within the doctor's control, so it cannot be a strict promise of result. It is an abusive speech act.

  **2. The Landlord ("You're evicted" with no legal standing)**
  *   **Type:** Declarative.
  *   **Verdict:** **Threat**, not Eviction.
  *   **Reasoning:** Eviction is a status change requiring institutional authority (court/state). Without standing, the words cannot change the deontic status of the tenant. It is merely a statement of intent to harass.

  **3. Promise at Gunpoint**
  *   **Type:** Commissive.
  *   **Verdict:** **Promise Made, Obligation Void.**
  *   **Reasoning:** The illocutionary act (commitment) occurred—you uttered the commitment formula. However, the *felicity condition* of volition is violated. In most ethical/legal systems, coercion renders the obligation nullifiable, but the act itself (the utterance of commitment) happened. This is why we say "I was forced to promise," not "I didn't promise."

  **4. "I'll Pray For You" (and never does)**
  *   **Type:** Commissive (to God/Self) or Expressive (to Human).
  *   **Verdict:** **Broken Vow** (if religious) or **Polite Falsehood** (if social).
  *   **Reasoning:** If the speaker believes in prayer, they undertook an obligation to a third party (God). If they don't, it functions as a phatic Expressive (like "Goodbye," which literally means "God be with you" but is just a closing signal). If they meant it religiously and didn't do it, they broke a promise.

  **5. The "I Quit" Text (followed by "jk")**
  *   **Type:** Declarative / Commissive Hybrid.
  *   **Verdict:** **Depends on Reliance.**
  *   **Reasoning:** Resignation is a Declarative that changes your employment status.
      *   *Scenario A:* Boss reads "I quit," tells HR to start termination process, *then* sees "jk." **You Quit.** The act was consummated via reliance. The retraction is too late.
      *   *Scenario B:* Boss reads "I quit," then immediately reads "jk" before acting. **You Did Not Quit.** Speech acts can be retracted before they "crystallize" into consequences.
      *   *Nuance:* In many contracts, resignation requires *written notice* to a specific agent. A text might fail the Convention clause (Clause 3), making it a mere statement of intent ("I am thinking of quitting") rather than the act itself.

  ### The "Mail-Order" vs. "Common Law" Tension
  You noted: *"Which makes me think the words at the moment aren't doing the work, the community afterwards is."*

  You are correct. This is the distinction between **Performative Utterances** (the words do the work) and **Constitutive Facts** (the life does the work).
  *   **Mail-Order Wedding:** Relies on Performative Utterance. Fails because the speaker lacks the institutional key to turn the words into reality.
  *   **Common Law Marriage:** Relies on Constitutive Facts. The words at the start don't matter; the community's subsequent treatment *constitutes* the marriage.
  *   **The Rule:** For Declaratives, check if the act is **Instantiative** (requires authority at $T_0$) or **Accretive** (requires recognition over $T_1...T_n$).

  ### Summary Advice
  Stop looking for one rule for "Speech Acts." Your intuitions are tracking three different mechanisms:
  1.  **Binding** (Promises/Bets) -> Requires Commitment, not Sincerity.
  2.  **Revealing** (Apologies/Forgiveness) -> Requires Sincerity, not Commitment.
  3.  **Status-Changing** (Marriage/Sentencing/Quitting) -> Requires Authority, not Sincerity.

  If you force a single rule, you will break your own intuitions. Keep the Typology. It's the only way to keep the lying promise and the hollow apology in the same room without them exploding.
