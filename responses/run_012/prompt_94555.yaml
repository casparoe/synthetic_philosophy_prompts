answer: |-
  1. In your work, you draw a bright line between humans and animals based on reason and self-consciousness. But in my former field, we keep finding behaviors we once thought unique to humans—tool use, mourning, even self-recognition—in other species. If the line is drawn based on what animals can *do*, isn't it a line that keeps moving beneath your feet?

  *Note: I am testing the empirical stability of the criterion used to exclude animals. I want to see if she admits the line is contingent on scientific observation.*
  *Follow-up: If she insists the line is fixed despite behavioral evidence, ask:* "Then are you saying that even if an animal behaved exactly like a rational human, it would still be merely a thing?"

  2. Kant argues that we cannot know the world exactly as it is, only as our minds allow us to experience it. If that is true, how can you be so certain about what is happening inside an animal compared to what is happening inside another person? Both are hidden from you.

  *Note: I am using Kant's own idealism to challenge the certainty with which she dismisses animal inner lives. This tests the consistency of her philosophical framework.*
  *Follow-up: If she claims human reason is self-evident in a way animal instinct is not, ask:* "But since you cannot step inside another human mind to verify their reason, aren't you making the same assumption in both cases?"

  3. Let us imagine a case where an animal is made to suffer in a place where no other human being will ever know about it. No society sees it, no reputation is damaged. On your view, is this act still wrong?

  *Note: I am testing the structure of the duty. If the duty is to humanity, does the secrecy remove the wrongness, or does the agent's own knowledge suffice?*
  *Follow-up: If she says it is still wrong because the agent knows, ask:* "Then the wrongness lies in the agent's knowledge of their own act, not in the effect on the wider human community?"

  4. You describe these as duties to ourselves, yet the action takes place upon another living creature. Is "duty with regard to animals" a genuine category of obligation, or is it just a relabelling of a duty to keep your own soul clean?

  *Note: I am pressing on the external object of the duty. I want to know if the animal is morally incidental or essential to the structure of the obligation.*
  *Follow-up: If she says it is a duty to keep our own soul clean, ask:* "Then if the animal could be replaced by a machine that simulated suffering perfectly, would the duty remain exactly the same?"

  5. Consider a person whose brain has been engineered, or who takes a drug, such that being cruel to animals leaves no mark on their sympathetic dispositions. They feel no coarsening, no loss of sympathy. On your view, is their cruelty then not wrong at all?

  *Note: I am attacking the load-bearing empirical premise that cruelty is wrong *because* it damages sympathy. I want to see if the wrongness survives without the psychological damage.*
  *Follow-up: If she says the cruelty is still wrong, ask:* "Then the wrongness cannot depend entirely on the damage to sympathy, can it?"

  6. Now consider a case where the cruelty does not coarsen the agent, but it does coarsen the people who hear about it. The agent remains kind, but the community becomes hardened. Is the duty violated by the agent, or by the community that witnessed it?

  *Note: I am shifting the locus of the harm from the agent to the observers to test who actually holds the duty.*
  *Follow-up: If she says the agent violates the duty because they caused the coarsening, ask:* "So the duty is actually about managing the psychological state of others, not just your own?"

  7. Suppose one person commits an act of cruelty, but everyone else's sympathy remains intact because the act is rare and isolated. The total ledger of psychological damage is negligible. Does the wrongness of the act depend on this aggregate count of damaged sympathy?

  *Note: I am testing whether the view collapses into a form of utilitarianism regarding psychological states.*
  *Follow-up: If she says the act is wrong regardless of the aggregate damage, ask:* "Then we are back to the act itself being wrong, not just its consequences for human feelings."

  8. If the wrongness of cruelty consists in its effect on the agent's character and their capacity for sympathy, isn't this simply an ethics of habituation? What work is the universal moral law doing here that couldn't be done by saying 'this is a bad habit'?

  *Note: I am raising the suspicion that the position collapses into virtue ethics, questioning the necessity of the Kantian framework.*
  *Follow-up: If she says the moral law commands it regardless of habit, ask:* "But you just told us the reason for the command is the preservation of sympathy. Which is the true ground?"

  9. You speak of duties falling on humanity. If we could develop a moral prosthetic—a technology that protects our sympathetic dispositions regardless of how we treat animals—would these duties regarding animals then lapse?

  *Note: I am testing whether the duty is contingent on human psychological vulnerability. If the vulnerability is removed, does the duty disappear?*
  *Follow-up: If she says the duties would not lapse, ask:* "Then the protection of sympathy is not the real reason for the duty, is it?"

  10. Finally, be direct: what empirical finding about animal minds would make you revise this view? Is there any discovery science could make that would grant them direct consideration?

  *Note: I am asking for the falsification condition. This tests whether the view is dogmatic or open to evidence.*
  *Follow-up: If she says no finding would change the view, ask:* "Then your position is not based on what animals are like, but on a definition you refuse to alter?"

  ***

  **Analysis of the Interview Dynamics**

  **The Question She Is Most Likely to Deflect:**
  She will most likely deflect **Question 5 (The Drug/Engineering Case)**.
  **How She Will Deflect It:** She will argue that such a drug is impossible for a rational being to take without violating reason itself, or she will claim that the "natural disposition" is a given of human nature that cannot be chemically altered without ceasing to be human. She will shift the ground from the empirical consequence (loss of sympathy) to the intrinsic nature of the act, arguing that cruelty is contrary to reason regardless of the psychological outcome. This allows her to maintain the "duty to oneself" framework without admitting that the empirical premise is the sole source of the obligation.

  **The Question You Are Most Likely to Ask Badly:**
  You are most likely to ask **Question 2 (The Idealism/Access Case)** badly.
  **Why:** It is very difficult to articulate Kant's epistemological limitation ("we cannot know the world as it is") in plain language without sounding like you are claiming we know *nothing* about reality. You might stumble into sounding like a skeptic rather than a Kantian critic. If you phrase it as "we can't know anything," she will easily correct you. You must be precise: the point is that the *inner experience* of another being is equally inaccessible whether that being is human or animal, so privileging the human claim requires more than just Kantian epistemology. Stick to the script: "Both are hidden from you."
