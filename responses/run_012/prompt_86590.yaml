answer: |-
  Good evening. To the family, to the staff who worked beside him, to the donors who keep the lights on: thank you for letting me stand here.

  We are gathered around a name. That is what a foundation is, finally. It is a name printed on letterhead, carved into stone, invoked when a check is written. We use the name to summon a promise. When we say him, we mean a certain kind of care. We mean a door that did not lock. We mean a valley where the dust was thick and the money was thin, and yet the doctor was there.

  I have spent the last four years walking through the rooms of his history. I have seen the ledger where he recorded the visits, the injuries, the debts forgiven. I have read the words of those who watched him work, who stood at the instrument table and handed him what he needed. And I have come to understand that we are here tonight to negotiate between two different existences.

  There is the first life. This is the life measured in breaths, in mistakes, in the weariness that settles into the bone after thirty years of listening to coughs in the dark. The first life is lived by a human being who gets tired. Who sometimes shakes. Who stays at the post when he should have rested. The first life is private, and it ends.

  Then there is the second life. This is the life that begins when the breathing stops. It is the life lived in the moral education of others. It is the story we tell a young medic about why she chose this valley. It is the example held up to a donor about why his money matters. The second life is public, and it is supposed to endure.

  Too often, we treat the second life as a polish applied to the first. We sand down the rough edges until the man becomes a statue. We do this to protect the family, and we do it to make the fundraising easier. But a statue cannot treat a patient. A statue cannot inspire a real person to do hard things, because a statue never struggled. If the second life is to be useful, it cannot be a corruption of the first. It must be the point of it.

  He was not a saint. Saints belong to a different category of being, one where the friction has been removed. He was a physician in a mining valley. There were days when the care was imperfect because the man was depleted. There were years when the hand was not as steady as it had been, and the people who worked beside him know that truth. They know the cost he paid, and they know the cost the patients sometimes bore. I do not stand here to debunk him. I stand here to suggest that his value to us now depends on our willingness to acknowledge that the first life was difficult, even for him.

  The colleagues at the front tables know he stayed too long. They know the burden of that choice. But look at what that choice bought us. It bought us a second life robust enough to bear the weight of the truth. If we pretend he was flawless, we invite every young doctor who fails to feel like a fraud. If we admit he was weary, we allow them to be weary and still continue.

  This foundation is the vessel for that second life. But a second life requires fuel. It requires more than memory; it requires resources. When you give to this foundation, you are not paying for a monument. You are paying for the capacity to tell the truth about the work. You are ensuring that the second life does not drift away from the reality of the first. You are making sure that the door remains open, not because a statue is holding it, but because living doctors are paid to keep it that way.

  His widow asked me not to embarrass her sons. His sons are here. They know the man at the dinner table, not just the man in the clinic coat. They know the silence as well as the service. We honor them by honoring the complexity of the man they loved. We honor the colleagues by not lying about the work they shared.

  So, when you write that check tonight, know what you are buying. You are buying the integrity of the second life. You are ensuring that the story we tell matches the work we do. You are ensuring that the name on the letterhead remains a promise that can be kept by living, breathing, tired human beings who need support to keep the door open.

  The first life is over. It was messy, and it was real. The second life is ours now. Let us make it strong enough to tell the truth.

  Thank you.

