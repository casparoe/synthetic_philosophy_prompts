  2. This narrative effectively explains the regime's unsustainability and why collapse was probable within that specific historical window. It answers the macro-historical question of why the Wall fell in late 1989 rather than the micro-historical question of precisely how it fell on November 9.

  3. It misses the specific contingency of timing and procedure, treating the exact night and manner of opening as incidental rather than constitutive of the event's meaning. This constitutes a separate explanatory target, as the peaceful nature of the opening depended on specific human choices absent in a purely structural account.

  4. No single factor was truly sufficient, as economic collapse alone might have led to a crackdown without Soviet non-intervention, making the episode better described as conjunctive. This suggests genuine overdetermination is rare in history, where outcomes usually rely on a fragile chain of necessary conditions rather than redundant causal paths.

  5. Labeling the event overdetermined often performs excusing work by diminishing the agency of Schabowski and the guards, framing their choices as irrelevant against inevitability. Distinguishing inevitability from redundancy requires counterfactual evidence showing whether the regime could have survived the night had specific individuals acted differently despite the structural pressure.
