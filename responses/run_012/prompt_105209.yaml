      *Wait, the prompt asks for the "Dreaded Question" separately.* I need to make sure I highlight that.

      *Let's finalize the "Hole":* The definition of "Party." If any group with a shared goal is a party, then the walkout organizers were a party.

  9.  **Writing the Response:**
