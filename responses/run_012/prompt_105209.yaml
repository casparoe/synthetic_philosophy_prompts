prompt: |-
  I'm a junior in high school and next Thursday I have to give a short talk to my school's politics club, and I'm already nervous about the Q&A. The club is like fifteen kids: half are in Young Democrats or Young Republicans and think politics basically means party organizing; my civics teacher is a local precinct captain who'll be sitting in the back; there's a libertarian kid who thinks parties are just voluntary clubs, a socialist kid who thinks refusing to join a party is a cop-out, and one quiet girl who reads alot of philosophy and will probably ask the one question that actually hurts. I'm going to defend a Weil-inspired thesis: that political parties are structurally bad for truth and conscience, not just this or that party, because they demand loyalty to a line and train you to treat opponents as enemies, and that the honest response is to stay unaffiliated and speak in your own name. I'll use our school's climate walkout as the case: both parties tried to co-opt it, and I refused to let them put a logo on it.

  My argument is basically three steps: parties need loyalty; loyalty means you can't publicly doubt the line; and once you can't doubt, you stop paying attention to the actual afflicted people you're supposed to care about, which is the thing Weil cared about most. I want you to prep me for the questions this crowd will actually ask -- not the ones a philosophy professor would ask. Put the objections in order of how much damage they'd do to me, phrase each one the way that person would phrase it, and for each give me a two-minute reply plus a note on where the reply is soft. Tell me what I should just concede up front so I don't look naive, what I should hold no matter what, and include the question I'm dreading, the one I hope nobody asks.

  Don't give me a reading list or citations or anything like that, I can't use them and I don't need them. Just the prep sheet: who'll object, how they'll say it, how I answer, and where I'm weak. And if you think my three-step argument has a hole in it, put that in the prep too, because I'd rather find out now than in front of the club.
