answer: |-
  This is a sophisticated observation, and you are right to sense that you have isolated a structural mechanism that is often present in the literature but rarely isolated with this degree of precision. You are describing the **Baseline Relativity Problem** (sometimes subsumed under the **Reference Class Problem** for luck egalitarianism), but your specific formulation—focusing on the *counterfactual comparator* rather than just the *status quo baseline*—sharpens the objection in a way that deserves a specific label.

  Here is an account of the existing terminology, where your insight fits, and how to diagnose the trouble.

  ### 1. Does it have a name?

  The closest established name is **The Baseline Problem** (or **The Problem of the Normative Baseline**). However, in the specific literature on luck egalitarianism, it is increasingly discussed as **Baseline Relativity** or the **Reference Class Problem for Responsibility**.

  *   **The Baseline Problem:** Traditionally, this refers to the difficulty of establishing a pre-political or pre-choice benchmark against which to measure advantage and disadvantage. (e.g., Is the baseline equality of resources, welfare, or the status quo ante?)
  *   **The Reference Class Problem:** As you noted, this usually concerns probability. However, **Kasper Lippert-Rasmussen** (in *Luck Egalitarianism*, 2015) explicitly applies this to responsibility. He argues that whether an outcome counts as luck depends on the reference class used to determine the "expected" outcome. If the class is "miners," the injury is expected (option luck); if the class is "humans," it is unexpected (brute luck).
  *   **Your Specific Contribution:** You are isolating the **Counterfactual Relativity** of the distinction. You are showing that the *moral category* (option vs. brute) is not a property of the causal history, but a function of the **selected counterfactual comparator**.

  While there isn't a single canonical proper name like "The Gettier Problem," the most accurate existing label for your specific pattern is **The Comparator Relativity Objection**. It is a specific, under-theorized engine within the broader Baseline Problem. You are effectively arguing that the **Option/Brute Luck distinction is counterfactually unstable.**

  ### 2. What the existing accounts cover (and where you differ)

  Existing accounts (e.g., Lippert-Rasmussen, Marc Fleurbaey, John Roemer) generally treat this as a problem of **specification**. They assume that if we can just fix the right baseline (Roemer's "types," for instance), the problem dissolves.

  *   **Roemer's Solution:** Roemer attempts to solve this by grouping agents into "types" based on circumstances. The baseline is the average outcome of the type.
  *   **Your Critique:** Your cases show that even holding the "type" or causal facts fixed, the verdict slides based on *which counterfactual self* or *which peer group* is invoked for comparison.
      *   *Miner Case:* The causal facts are fixed. The "type" (worker) is fixed. The shift is between a **Peer Comparison** (safer job chooser) and a **Historical Self-Comparison** (uninjured self).
      *   *Student Case:* The shift is between a **Peer Comparison** (law students) and a **Constitutional Self-Comparison** (self with different tastes).

  Existing literature often conflates the *baseline of distribution* (what do we equalize?) with the *baseline of responsibility* (what counts as a choice?). You are isolating the latter. Your cases demonstrate that the **baseline of responsibility** is not determined by the metaphysics of choice, but by the normative selection of the comparator.

  ### 3. Diagnosing the Trouble

  You offered three diagnoses. Based on the literature and the strength of your pattern, here is how they stack up:

  **Diagnosis 1: A gap in the theory's specification.**
  *   *Verdict:* Plausible but weak.
  *   *Account:* Proponents (like Roemer or Fleurbaey) would argue the theory simply needs a rule for selecting the correct counterfactual (e.g., "always compare to the average of your socioeconomic type").
  *   *Rebuttal:* Your cases suggest no factual rule can select the counterfactual without presupposing a normative verdict. Why compare the miner to the safer-job worker rather than the uninjured self? That selection *is* the verdict.

  **Diagnosis 2: An illicit step in how the theory is applied.**
  *   *Verdict:* Strong.
  *   *Account:* This aligns with **Elizabeth Anderson's** critique ("What is the Point of Equality?"). She argues that luck egalitarians smuggle in normative judgments about which choices are "reasonable" under the guise of factual distinctions between luck and choice. Your analysis provides the *mechanism* for Anderson's claim: the theorist selects the counterfactual that yields the desired moral outcome.
  *   *Implication:* The argument runs from verdict to comparison, not comparison to verdict.

  **Diagnosis 3: Evidence that the distinction does no independent work.**
  *   *Verdict:* Strongest (and most damaging).
  *   *Account:* If the classification of luck is entirely dependent on the choice of counterfactual, and the choice of counterfactual is determined by our prior intuitions about justice, then the option/brute luck distinction is not a *foundation* for justice, but a *restatement* of it.
  *   *Implication:* The distinction is explanatorily idle. It cannot do the work assigned to it (grounding desert or compensation) because it is parasitic on the very norms it is supposed to generate.

  **Recommendation:** Your pattern provides the structural proof for **Diagnosis 3**, which validates **Diagnosis 2**. The "gap" (Diagnosis 1) cannot be filled factually because the selection of the counterfactual is inherently normative.

  ### 4. The Grain of Description

  You asked whether anything turns on the grain at which the choice is described. This is a distinct but compounding problem, often called the **Individuation of Options Problem**.

  *   **The Connection:** If you describe the miner's choice finely ("chose Mine A over Mine B"), it looks like option luck. If you describe it coarsely ("chose to work to feed family"), it looks like brute luck (necessity).
  *   **The Difference:** The grain problem concerns how we carve up the *actual* choice set. Your **Comparator Relativity** problem concerns how we select the *counterfactual* baseline.
  *   **Interaction:** They work together to make the verdict indeterminate.
      1.  **Grain:** Determines what counts as the "choice."
      2.  **Comparator:** Determines what counts as the "cost" of that choice.
  *   **Conclusion:** You should treat them as distinct. The grain problem is about the **ontology of the act**; your problem is about the **normativity of the baseline**. Isolating your problem (as you have done) is valuable because it survives even if we stipulate a fixed grain (as you did in your cases).

  ### 5. Suggested Terminology for Your Work

  Since you are considering whether to coin a term, I advise against a completely new neologism if it disconnects you from the existing literature. However, your specific articulation warrants a precise modifier.

  I recommend framing your contribution as identifying **"The Counterfactual Relativity of the Luck Distinction."**

  *   **Why:** It links to the established "Baseline Problem" but specifies the mechanism (counterfactual selection).
  *   **Usage:** "While the Baseline Problem is well-known, the **Counterfactual Relativity** objection shows that the problem is not merely about the level of the baseline, but about the identity of the comparator."

  ### 6. Key References to Engage

  To position this within the doctoral work, you must engage with:

  1.  **Kasper Lippert-Rasmussen:** *Luck Egalitarianism* (2015), specifically Chapter 3 on the Baseline Problem and his discussions of the Reference Class. He comes closest to your view.
  2.  **Marc Fleurbaey:** *Fairness, Responsibility, and Welfare* (2008). He formalizes the "responsibility cut." Your argument suggests the cut is movable without changing the facts.
  3.  **John Roemer:** *Equality of Opportunity* (1998). His "Type" solution is the primary attempt to fix the comparator. You can argue his "types" are just a rigidified version of the sliding counterfactual.
  4.  **Elizabeth Anderson:** "What is the Point of Equality?" (1999). Use your pattern to provide the structural evidence for her claim that the distinction is question-begging.
  5.  **Shlomi Segall:** *Health, Luck, and Justice* (2009). He discusses baselines in health specifically, which mirrors your Miner case.

  ### Summary

  You have not merely redescribed the Baseline Problem; you have isolated its **operating mechanism**. The Baseline Problem is often presented as "Where do we set the zero point?" You are showing it is actually "Who do we compare the agent to?"

  This is **Counterfactual Relativity**. It supports the diagnosis that the option/brute luck distinction lacks independent normative force (Diagnosis 3) because the selection of the counterfactual is driven by the verdict it is meant to justify (Diagnosis 2). This is a publishable insight that clarifies a muddled area of the literature.
