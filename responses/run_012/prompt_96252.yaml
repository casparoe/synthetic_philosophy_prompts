answer: |-
  This phenomenon is broadly known as **self-defeating reflexivity**, most famously articulated in ethics by Bernard Williams as having **"one thought too many."**

  Williams argued that in personal relationships, introducing a mediating principle (like "duty") between you and the action corrupts the relationship's immediacy. Your support team and hospital cases fit here: the *quality* of the act depends on the motivation being implicit. When the reason becomes an object of consciousness, the act shifts from "caring" to "complying," which customers and friends detect as alienation. In philosophy, this distinguishes **constitutive goals** (where the manner of achieving matters, like friendship) from **instrumental goals** (where only the result matters, like tax filing). Your tax return example fails the test because the outcome is independent of your internal state; the friendship case passes because the relationship *is* the internal state.

  The institutional version you encounter is **Normative Explicitation Failure**. When organizations write down the "point" of a rule, they convert a **norm** (internalized guidance) into a **target** (external compliance). Unlike Goodhart's Law, nothing is measured; instead, the *meaning* of the action changes for the agent. The agent stops acting *for the customer* and starts acting *for the playbook*, creating audible scriptiness. In distributed systems terms, you are leaking implementation details to the interface; the agent should interact with the customer, not the policy engine. This is why tacit knowledge (Polanyi) is vital: some skills dissolve when made explicit.

  Regarding your two further cases:
  1.  **Coach/Stroke:** **Yes, this belongs.** This is **The Centipede's Dilemma**, the psychological sibling of Williams' ethical point. Conscious monitoring of automated procedural memory disrupts flow. The harm is performance degradation via hyperreflection.
  2.  **Manager/Kindness:** **No, this is adjacent.** This is **Retroactive Motivational Corruption**. The act was already completed successfully; the *valuation* is corrupted, not the performance. It shares the mechanism (reasoning kills value) but lacks the simultaneous performance failure central to your core pattern.

  The boundary lies in **temporality and texture**. Your core pattern requires that the awareness exists *during* the act and degrades its *phenomenological quality* (trust, care, flow). If the act is mechanical (taxes) or the evaluation is post-hoc (manager), the core paradox does not trigger. The term for your specific workplace headache is **Normative Explicitation Failure**: the error of assuming that making a norm explicit preserves its function, when often the explicitness destroys the trust required to enact it.
