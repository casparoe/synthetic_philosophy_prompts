      *   *ML Researchers:* They want a loss function. "Non-domination" sounds vague. "Contestability" sounds like RLHF on steroids but without a clear optimization target. They fear inefficiency and paralysis. *Trigger:* "You're making alignment impossible to optimize."
      *   *Rawlsian Liberals:* They fear state perfectionism. A "floor of capabilities" might look like imposing a specific view of the good life. *Trigger:* "Who defines the floor? Isn't that perfectionism?"
      *   *Behavioral Economist:* Preferences are unstable/manipulable. Aggregation is hard (Arrow's theorem vibes). Paternalism might be needed for true welfare. *Trigger:* "Revealed preferences are noisy; why trust the contestation?"
      *   *Disability Bioethicist:* "Capability protection" sounds like triage. Who counts as capable? History of eugenics. *Trigger:* "Your floor excludes the severely disabled who can't contest."
      *   *Public-Choice Economist:* Boards get captured. Veto power leads to holdout problems. *Trigger:* "This is just another regulatory capture mechanism."
