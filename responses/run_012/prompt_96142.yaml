  **Markets are permissible for allocating external goods and labor, but impermissible when they commodify (1) civic or epistemic agency, or (2) the permanent biological wholeness of the person.**

  This principle is composed of three clauses. Here is which of your cases *forces* each clause into existence:

  **Clause 1: The Market Allocation Clause**
  *   **Statement:** You may buy and sell external goods, scarce resources, and standard labor services where the transaction does not alter the nature of the good or the agent.
  *   **The Case That Forces It:** **The Hardware Store Generator.**
      *   *Why:* If you banned this, you would be banning markets entirely during crises. This clause establishes that price mechanisms are valid for *things outside the body*. It also captures the **DMV Line** (labor) and **Concert Tickets** (allocation of access).
  *   **The Case That Tests It:** **Paying a Kid to Read.**
      *   *Why:* This confirms that incentivizing *behavior* (labor/effort) is fine, provided it doesn't corrupt the *certification* of that behavior (see Clause 2).

  **Clause 2: The Civic & Epistemic Integrity Clause**
  *   **Statement:** You cannot monetize acts that serve as certifications of truth, merit, or political agency, because money corrupts the meaning of the signal.
  *   **The Case That Forces It:** **Paying a Stranger to Vote.**
      *   *Why:* This is the strongest "in my bones" case. A vote is not a good; it is an expression of political will. If sold, it ceases to be *your* will. This clause also forces the ban on **Paying for Grades** (a grade certifies knowledge, not wealth) and **Paying for a Confession** (a confession certifies truth, not solvency).
  *   **The Distinction:** This explains why paying for *reading* is fine (incentivizing effort) but paying for *grades* is not (corrupting the credential).

  **Clause 3: The Bodily Wholeness Clause**
  *   **Statement:** You cannot monetize the permanent removal or irreversible loss of vital biological components, because the body is not a warehouse of spare parts.
  *   **The Case That Forces It:** **Selling a Kidney.**
      *   *Why:* You specified this is not fine *even if* the seller is informed and benefits. This rules out a simple "harm principle." The objection is ontological: a kidney is a *piece of the self*, not a *service provided by the self*.
  *   **The Distinction:** This is the narrow clause that allows **Surrogacy** (leaning fine). Surrogacy is treated as *reproductive labor* (temporary use of the body) rather than *organ transfer* (permanent loss of a part).

  ***

  ### Application: The Risky Drug Trial

  **The Case:** Paying someone who's broke to enroll in a risky first-in-human drug trial, where the fee is about a year's income.

  **The Verdict:** **Permissible (with heavy regulation), but morally fraught.**

  **Why:**
  Under the **Non-Commodifiable Integrity** principle, this case falls into a gap between Clause 1 (Labor/Risk) and Clause 3 (Bodily Wholeness).
  *   **It is not Clause 2:** It does not corrupt civic truth or merit.
  *   **It is not Clause 3:** It does not involve the *permanent removal* of a body part. The subject remains biologically "whole," even if they are at risk of injury.
  *   **It fits Clause 1:** It is effectively high-risk labor. We allow firefighters, stuntmen, and miners to sell their safety for money.

  **However,** the "broke" and "first-in-human" details push against the spirit of Clause 3. While you aren't selling a *piece* of yourself, you are renting out your *biological safety*. If the principle is tightened to protect "Bodily Integrity" (not just Wholeness), this becomes repugnant. But strictly speaking, under your current intuitions (which allow price gouging and surrogacy), this transaction is **allowed**. It is the sale of risk, not the sale of self.

  ***

  ### The Sacrificial Lamb

  You asked which of your existing verdicts this principle cannot save. To be philosophically consistent, **Commercial Surrogacy** is the most vulnerable.

  **Why Surrogacy has to go (or at least wobble):**
  Your ban on Kidney sales is driven by the intuition that the body is not a commodity ("can't buy pieces of a person"). This is a *dignity* argument, not just a *medical* one.
  *   If the objection to Kidney sales is that it turns the human body into a warehouse for spare parts, **Surrogacy turns the human body into a factory for children.**
  *   You are trying to distinguish them based on "permanent loss" (Kidney) vs. "temporary service" (Surrogacy). But for many who feel the "in my bones" repugnance of the Kidney market, that distinction is too thin. The uterus is not an external tool like a generator; it is intimate biological infrastructure.
  *   **The Tension:** If you hold the Kidney line firmly (NO), the logic exerts a gravitational pull that makes Commercial Surrogacy (YES) look inconsistent. If the body is sacred enough to ban organ sales, it is usually sacred enough to ban womb rentals.
  *   **The Alternative:** If you hold the Surrogacy line firmly (YES), then the Kidney ban starts to look like arbitrary medical paternalism. If I can rent my womb for $50,000, why can't I sell my kidney for $50,000? Both are bodily risks for cash.

  **Conclusion:**
  Your framework is robust, but **Surrogacy** is the duct tape holding it together. If you want a single, clean principle, you likely have to move Surrogacy to **NO** (aligning with the Kidney intuition) or move Kidneys to **YES** (aligning with the Surrogacy intuition). Given how strongly you feel about the Kidney case, Surrogacy is the verdict most likely to break under pressure.

  **Summary of your moral geometry:**
  *   **OK:** Markets for *things* and *labor* (Tickets, Generators, DMV, Reading, Surrogacy*, Drug Trials).
  *   **NOT OK:** Markets for *truth/agency* (Votes, Grades, Confessions) and *biological parts* (Kidneys).
  *   **The Crack:** Surrogacy sits on the line between Labor and Parts.
