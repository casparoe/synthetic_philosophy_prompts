          "You charge me with stipulation, but I'm pointing to a phenomenological necessity. Consider your fear analogy: if someone claims to fear a spider but feels no urge to flee and no distress, we might say they recognize danger, but do they *feel* fear? Fear, like pain, is essentially a mode of feeling threatened or harmed. If the feeling of threat is removed, the fear is gone, even if the judgment remains. In your constructed case, the patient has the sensory discrimination—the 'burning' quality, the location—but lacks the affective command that says 'this is bad for me.' When she says 'it hurts,' she is reporting the sensory channel accurately, but she is using 'hurt' to denote a sensation that, in us, comes packaged with aversion. I am not denying her sincerity; I am denying that the sensory component alone constitutes the state we call pain. Pain is not a neutral sensation that *causes* suffering; it is a sensation that *is* suffering. If the suffering is absent, what remains is a vivid somatic sensation, perhaps indicative of damage, but not pain itself. The unfalsifiability charge misses that I am making a claim about the essence of the experience, not just the label we stick on it."

