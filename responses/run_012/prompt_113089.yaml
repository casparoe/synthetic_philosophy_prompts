      *   The challenge is to explain away the asymbolia case without denying the patient's sincerity or the physical reality, while maintaining that *true* pain requires unpleasantness.
      *   Key distinction: Sensory-discriminative vs. Affective-motivative. The philosopher needs to argue that the sensory part alone isn't "pain" in the full sense, or that the report "it hurts" is being used differently than we assume.
      *   Addressing the "unfalsifiable" charge: Need to show it's not just definition-stipulation but based on the phenomenology of what pain *is*.
      *   Addressing the "fear" analogy: Fear might be different because fear is about a future threat, whereas pain is a present experience of damage/badness. Or, argue that fear without distress *would* also cease to be fear (phobia vs. recognition of danger).
