prompt: |-
  Next month I'm running a 45-minute session for a small reading group — mostly non-philosophers who've all heard of the "hard problem" and either think it's obviously real or obviously a bit of nonsense. I want to teach them the meta-problem instead, and what I need from you is a plan for the explanation, not the explanation itself.

  So: what has to come first, second, third, and what depends on what. My hunch is that you can't even state the meta-problem until they've got the hard problem on the table AND accepted that "why do we even feel there's a hard problem?" is a question about a natural phenomenon — a judgement people make — rather than wordplay. Tell me if that ordering is right and what I'm leaving out.

  The carrying example. I don't want zombies or the bat; they've heard those a million times and they're stale. I was thinking of change blindness or the blind-spot thing — some case where what we'd swear our experience is like turns out to be more like a judgement we're making than a readout we're reading. Say what the example has to have and what it must lack to do this job, and whether my pick actually works or I should swap it for something better.

  The misconceptions, in the order they'll actually surface, and the exact point in the sequence where I should head each one off. My guesses: (a) "the meta-problem is just the hard problem renamed"; (b) "if you can explain why I think experience is mysterious, then experience isn't mysterious" — I think that one will do the most damage; (c) "so you're an eliminativist / illusionist"; (d) something about zombies sneaking back in. Are there others I'm missing, and where does each need to get defused?

  Then two last things: one question I can put to the room at the very end that tells me whether they've actually got the meta-problem or just nodded along, and what I should flat-out refuse to go into at this level (and say so).

  Keep the whole thing under 700 words. Plan only — don't explain the meta-problem to me, I already know it; I need to know how to get it into their heads.
