      *   *The Crux:* The ledger assumes labor is *felt* or *cognitively accessible*. But convention automates labor. If convention removes the *feeling* of labor for the insider, but the outsider still bears the cost (misunderstanding), the ledger's metric (distribution of work) becomes unstable. Is the work still done if it's unconscious?
      *   *The Collapse Point:* If the ledger cannot account for *conventionalized* indirection (where the "option to decline" is illusory for insiders but trapping for outsiders), it fails as a universal ethical tool. It risks becoming descriptive relativism ("that's just how they do it") rather than normative ethics ("is this fair?").
