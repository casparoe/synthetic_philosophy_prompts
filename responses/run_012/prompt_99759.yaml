answer: |-
  This is a sharp brief. You've identified that the ordinance isn't just policy; it's an applied metaphysics of memory. The 25-year review, the empty plinth, and the ban on living subjects are essentially philosophical stress tests disguised as municipal code.

  To write the piece, you need the specification for a "Theory of Commemoration." Below is the spec. It outlines the requirements any robust theory must meet, the cases it must survive, the distinctions it must preserve, and the contradictions it cannot resolve.

  ### I. The Desiderata (The Spec)

  A viable theory of commemoration must satisfy these seven requirements. If it fails one, it is either propaganda, nostalgia, or censorship.

  | Requirement | Definition | Why It's Necessary |
  | :--- | :--- | :--- |
  | **1. Stability** | The landscape of memory cannot change with every election cycle or moral panic. | Without stability, public space loses its function as a shared anchor for civic identity. |
  | **2. Responsiveness** | The landscape must be capable of correcting moral errors as societal values evolve. | Without responsiveness, public space becomes a museum of tyranny or injustice. |
  | **3. Legibility** | The meaning of the monument must be intelligible to a non-expert passerby. | If it requires a plaque the size of a tombstone to explain why it's there, it has failed as a monument. |
  | **4. Truthfulness** | The theory cannot rely on historical falsehoods or myth-making to sustain the monument. | Commemoration built on lies collapses when archives are opened. |
  | **5. Scarcity** | The theory must acknowledge that public attention and space are finite resources. | If we commemorate everyone, we commemorate no one. Selection implies exclusion. |
  | **6. Reception** | The theory must account for how the monument is *experienced* now, not just how it was *intended* then. | A statue intended to honor "heritage" that is experienced as a threat is functionally a threat. |
  | **7. Agency** | The theory must distinguish between subjects who acted and subjects who were acted upon. | Confusing victims with heroes collapses moral clarity. |

  ### II. The Hard Cases (Stress Tests)

  Your ordinance provides three specific stress tests, plus three classic philosophical dilemmas. A theory that cannot handle these is incomplete.

  **The Ordinance Cases:**
  1.  **The 25-Year Sunset (The Affirmative Case):**
      *   *The Problem:* Most theories assume memory is inertial (it stays until pushed). This ordinance makes memory active (it goes unless pulled).
      *   *The Test:* Can the theory define "relevance" without succumbing to presentism? What is the metric for the "affirmative case"? Is it historical impact (unchanging) or moral utility (changing)?
  2.  **The Empty Plinth (The Negative Space):**
      *   *The Problem:* The sponsor claims absence allows people to "sit with the loss."
      *   *The Test:* Can a theory of commemoration account for *anti-monuments*? Does removing a statue create a new meaning (a monument to removal), or does it create a void? If it creates a new meaning, the "empty" year is a lie.
  3.  **The Living Ban (The Completed Narrative):**
      *   *The Problem:* You cannot judge a life until it is over.
      *   *The Test:* Does the theory require a "closed account" to commemorate? If so, how do we honor movements rather than individuals? If not, how do we avoid cults of personality?

  **The Classic Cases:**
  4.  **The Flawed Founder (Good/Harm Mix):**
      *   *The Problem:* The figure built the hospital but owned slaves.
      *   *The Test:* Can the theory handle moral aggregation? Or is commemoration binary (honor/dishonor)? If binary, almost no one qualifies. If aggregate, who does the math?
  5.  **The Faded Street (Irrelevance):**
      *   *The Problem:* The name is not offensive, just unknown.
      *   *The Test:* Does a monument need to be *useful* to stay? If memory is a resource (see Scarcity), does forgetfulness justify removal as much as immorality does?
  6.  **The Victim Memorial (Suffering vs. Agency):**
      *   *The Problem:* A monument to victims of a massacre.
      *   *The Test:* Are we honoring the victims (agency) or memorializing the crime (event)? The theory must distinguish between remembering pain and glorifying the sufferers.

  ### III. The Forbidden Collapses (Distinctions)

  A bad theory conflates these categories. A good theory keeps them separate.

  *   **Honoring vs. Remembering vs. Teaching:**
      *   *Honoring* implies endorsement of values.
      *   *Remembering* implies acknowledgment of existence/impact.
      *   *Teaching* implies contextualization of complexity.
      *   *The Collapse:* A theory that treats all statues as "history lessons" fails. A statue on a plinth is inherently honorific. You cannot turn a hero statue into a history lesson just by adding a plaque.
  *   **The Person vs. The Event:**
      *   We commemorate *George Washington* (Person) differently than *The Revolution* (Event).
      *   *The Collapse:* When a person becomes a metonym for an event, their personal flaws are incorrectly transferred to the event, or vice versa.
  *   **The Audience (Who is spoken to?):**
      *   Is the monument for the *dead* (respect)? The *neighborhood* (identity)? Or the *future* (instruction)?
      *   *The Collapse:* A monument intended for the dead that functions as a threat to the neighborhood is a category error.

  ### IV. The Incompatibilities (The Story)

  Here is the tension that drives your piece. A perfect theory is impossible because two core desiderata are mutually exclusive.

  **The Incompatibility: Legibility vs. Truthfulness**

  *   **Legibility** requires simplification. To function in public space, a monument must be instantly readable. It must say "Hero," "Victim," or "Event." It relies on symbols, poses, and inscriptions that reduce complexity to a single takeaway.
  *   **Truthfulness** requires complexity. Historical truth is rarely singular. It involves contradiction, context, and evolution.
  *   **The Conflict:** You cannot have a monument that is both instantly legible *and* historically truthful.
      *   If you make it truthful (add context, nuance, flaws), it loses Legibility (it becomes a textbook, not a monument).
      *   If you make it legible (strip away the flaws, focus on the icon), you sacrifice Truthfulness (you create myth).
  *   **Why this is the story:** The ordinance demands an "affirmative case" every 25 years. But the *form* of a monument resists the *content* of a review. A statue cannot say, "I was good then, but maybe not now." It is frozen. The medium itself contradicts the requirement for moral re-evaluation.

  **Secondary Incompatibility: Stability vs. Responsiveness**
  *   If you satisfy **Stability** (monuments stay up for generations), you inevitably violate **Responsiveness** (you cement past values that future generations may reject).
  *   If you satisfy **Responsiveness** (25-year reviews), you violate **Stability** (the civic landscape becomes volatile, preventing deep cultural rooting).
  *   *Note:* The ordinance tries to solve this with the 25-year rule, but it leans heavily into Responsiveness at the cost of Stability.

  ### V. The Killer Constraint

  You asked for the single requirement that does the most to rule theories out.

  **The Reception Constraint (Desideratum #6)**

  > *The theory must account for how the monument is experienced by the public now, not just how it was intended by the sponsor then.*

  **Why it rules theories out:**
  1.  **It kills Originalism:** The most common defense of controversial statues is "Original Intent" (e.g., "This Confederate statue was about heritage, not slavery"). The Reception Constraint says intent is irrelevant; if the public experiences it as a symbol of oppression, the theory must classify it as such.
  2.  **It kills Pure Moralism:** You cannot judge a statue solely on the biography of the subject. If the subject was a "good person" but the statue is placed in a way that intimidates a neighborhood, the Reception Constraint flags it.
  3.  **It kills the "Empty Plinth" Logic:** If the empty plinth is experienced as "victory" by one group and "erasure" by another, the theory cannot accept the sponsor's claim that it is a neutral space for "sitting with absence." The absence *has* a meaning, and it is not chosen by the council.

  **Why this is the lever for your piece:**
  Most debates focus on the *subject* (Was Jefferson a slaveholder?). The Reception Constraint forces the debate onto the *object* and the *viewer* (What does this statue do to the person walking past it today?). It shifts the question from "Who was he?" to "What is this doing?"

  This is the philosophical pivot. If you accept the Reception Constraint, the 25-year review isn't about re-judging the dead; it's about re-evaluating the *function* of the object in the current civic ecosystem. That is a much harder, and more interesting, standard to meet.

  ### Summary for the Piece

  *   **The Hook:** The ordinance treats memory as a lease, not a deed.
  *   **The Conflict:** Monuments demand simplicity (Legibility); History demands complexity (Truth). You cannot have both.
  *   **The Pivot:** The "Reception Constraint" means the public, not the plaque, decides the meaning.
  *   **The Verdict:** The ordinance is an attempt to solve a philosophical incompatibility (Stability vs. Responsiveness) with a bureaucratic timer. It will fail because the timer doesn't fix the statue.
