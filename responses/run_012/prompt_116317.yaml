      *   *Address Premise (3) & (4):* Challenge the idea that simulation is just "replay." It's generative.
      *   *Address the Gregorian preference:* Language creates a new environment (the memetic sphere) where selection happens on *reasons*, not just fitness. This is the "kind" difference.
