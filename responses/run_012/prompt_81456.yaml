answer: |-
  # Instrument: Classifying Creaturely Competence
  ### Dennett's Four Grades

  **Definitions**
  *   **Darwinian:** The creature's successful behaviors are pre-installed by evolution and do not change through individual experience.
  *   **Skinnerian:** The creature's successful behaviors are shaped by trial-and-error reinforcement during its lifetime.
  *   **Popperian:** The creature's successful behaviors are selected by an internal model that simulates consequences before action.
  *   **Gregorian:** The creature's successful behaviors depend on thinking tools or artifacts inherited from a culture rather than genes.

  ---

  ## The Classification Tree

  *Instructions: Start at Question 1. Follow the path that best describes the **mechanism generating the specific behavior** you are observing. Stop at the first Leaf that fits. Record the Grade and check the Scoring Key for mixed outcomes.*

  **Q1. Is the competence fixed prior to the individual's experience, as with the Large Language Model that does not update its weights from the conversation?**
  *   **YES:** Go to **Leaf A (Darwinian)**.
  *   **NO:** The behavior changes or adapts during the lifetime. Go to **Q2**.

  **Q2. Is the adaptation driven solely by the consequences of actual actions, as with the Rat that learns to press a lever or the Spider whose web-building improves after repeated failures?**
  *   **YES:** Go to **Warning Box 1**.
  *   **NO:** The agent avoids fatal errors without having to perform them first. Go to **Q3**.

  > **WARNING BOX 1: The Simulation Limit**
  > *Can you distinguish a very fast conditioned response from a genuine internal simulation?*
  > *   **If NO (cannot distinguish):** Classify as **Skinnerian** but flag as **Limitation**. (A behavior that looks Popperian may be a fast Skinnerian reflex).
  > *   **If YES (clearly automatic/cached):** Go to **Leaf B (Cached Skinnerian)**.
  > *   **If YES (clearly reinforcement-based):** Go to **Leaf B (Skinnerian)**.

  **Q3. Does the agent solve the problem by testing options internally before acting, as with the Crow that drops stones into a tube to raise water?**
  *   **YES:** Go to **Q4**.
  *   **NO:** The agent requires external aids to manage the complexity. Go to **Q4**.
      *(Note: If the answer is NO here, it implies the internal model is insufficient without tools, pointing toward Gregorian.)*

  **Q4. Does the competence rely on culturally transmitted artifacts, symbols, or language, as with the Human Child using pencil for multiplication, the Person using a mnemonic, or the Person talking aloud to solve a novel problem?**
  *   **YES:** Go to **Leaf C (Gregorian)**.
  *   **NO:** The competence is internal and simulated but does not use cultural tools. Go to **Leaf D (Popperian)**.

  **Q5. (System Check) Is the intelligence located in the collective rather than the individual, as with the Eusocial Insect Colony whose foraging looks intelligent at the group level?**
  *   **YES:** Go to **Leaf E (System Darwinian/Skinnerian)**.
  *   **NO:** Return to **Q2**.

  ---

  ## Tree Leaves & Diagnosis

  **Leaf A: Darwinian**
  *   **Diagnosis:** The behavior is generated by fixed genetic or architectural constraints.
  *   **Cases:** Large Language Model (inference phase).
  *   **Wrong If:** The agent modifies its strategy based on individual experience during the task.
  *   **Implicated Higher Grades:** None (Base layer).

  **Leaf B: Skinnerian (includes Cached Skinnerian)**
  *   **Diagnosis:** The behavior is generated by reinforcement history or automated routines.
  *   **Cases:** Rat (lever press), Spider (web improvement), Human Expert (automatic skill), Insect Colony (individual level).
  *   **Wrong If:** The agent successfully avoids a novel fatal error without prior reinforcement or genetic programming.
  *   **Implicated Higher Grades:** Darwinian (biological substrate required).
  *   **Note on Expert:** If the skill was once deliberate but is now automatic, mark as **Cached Skinnerian**.

  **Leaf C: Gregorian**
  *   **Diagnosis:** The behavior is generated by the use of external cultural tools or language.
  *   **Cases:** Human Child (multiplication), Person (mnemonic), Person (talking aloud).
  *   **Wrong If:** The agent can perform the competence equally well without the cultural artifact or linguistic framework.
  *   **Implicated Higher Grades:** Popperian, Skinnerian, Darwinian (Gregorian creatures are cumulative).
  *   **Note on Talking Aloud:** If language is used to facilitate internal simulation, mark as **Scaffolded Popperian**.

  **Leaf D: Popperian**
  *   **Diagnosis:** The behavior is generated by internal simulation of candidate actions.
  *   **Cases:** Crow (stone dropping), Human (novel problem solving without tools).
  *   **Wrong If:** The "simulation" is indistinguishable from a fast conditioned reflex (see Warning Box 1).
  *   **Implicated Higher Grades:** Skinnerian, Darwinian.

  **Leaf E: System Darwinian/Skinnerian**
  *   **Diagnosis:** The individuals are lower-grade, but the system exhibits higher-grade competence.
  *   **Cases:** Eusocial Insect Colony.
  *   **Wrong If:** The individual insects demonstrate individual learning or simulation beyond their genetic programming.
  *   **Implicated Higher Grades:** None for the individual; System acts as a "Super-Skinnerian" entity.

  ---

  ## Limitations & Incoherent Combinations

  **1. The Simulation Limitation**
  The tree cannot definitively distinguish a **Popperian** creature from a **Skinnerian** creature if the Skinnerian creature has a sufficiently fast and complex reinforcement history. If the internal mechanism is opaque, default to the lowest sufficient grade (Skinnerian) and note the ambiguity.

  **2. Incoherent Combinations (Gaps)**
  *   **Gregorian without Popperian:** **Incoherent.** A creature cannot use cultural thinking tools (Gregorian) without the ability to manipulate those tools mentally (Popperian).
  *   **Skinnerian without Darwinian:** **Incoherent.** A creature cannot have a reinforcement history (Skinnerian) without a physical body installed by evolution (Darwinian).
  *   **Popperian without Skinnerian:** **Unattractive/Unexplored.** It is theoretically possible to simulate without prior reinforcement, but biologically, the simulator itself must be built by reinforcement or selection. Treat as cumulative.

  ---

  ## Scoring Key

  *Use this key to finalize the classification based on the path taken in the Tree.*

  | Answer Pattern | Primary Grade | Mixed Outcome Label | Description |
  | :--- | :--- | :--- | :--- |
  | **Q1 = YES** | **Darwinian** | None | Competence is fixed (e.g., LLM inference, instinct). |
  | **Q1 = NO, Q2 = YES** | **Skinnerian** | **Cached Skinnerian** (if expert automation) | Competence via reinforcement or automated habit (e.g., Rat, Spider, Expert). |
  | **Q1 = NO, Q2 = NO, Q3 = YES, Q4 = NO** | **Popperian** | None | Competence via internal simulation without tools (e.g., Crow). |
  | **Q1 = NO, Q2 = NO, Q3 = YES/NO, Q4 = YES** | **Gregorian** | **Scaffolded Popperian** (if using tools for simulation) | Competence via cultural tools (e.g., Child, Mnemonic, Talking Aloud). |
  | **Q5 = YES** | **System Grade** | **Distributed Competence** | Individual is Darwinian/Skinnerian; Colony is the unit of analysis. |

  ### Case Summary Map
  *   **Spider (web improvement):** Skinnerian (Lowest sufficient); Implicates Darwinian.
  *   **Rat (lever press):** Skinnerian (Lowest sufficient); Implicates Darwinian.
  *   **Crow (stones/water):** Popperian (Lowest sufficient); Implicates Skinnerian/Darwinian.
  *   **Human Child (multiplication):** Gregorian (Lowest sufficient); Implicates Popperian/Skinnerian/Darwinian.
  *   **Human (mnemonic):** Gregorian (Lowest sufficient); Implicates Popperian/Skinnerian/Darwinian.
  *   **LLM (frozen weights):** Darwinian (Lowest sufficient); No higher grades implicated during inference.
  *   **Insect Colony:** System Skinnerian (Individual); System acts Popperian.
  *   **Human Expert (automatic):** Cached Skinnerian (Behavior); Creature is Gregorian/Popperian.
  *   **Human (talking aloud):** Scaffolded Popperian (Gregorian tools enabling Popperian simulation).
