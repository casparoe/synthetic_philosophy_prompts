  This case demonstrates that heterophenomenology prioritizes the logical coherence of reported text over the subject's ontological claims about their mind.

  In a meditation lab, Raj, an experienced practitioner, sits in silence then writes, "I achieved thought-free awareness; no concepts arose." Heterophenomenologists treat this as a text. They note the report employs concepts ("thought," "awareness") to describe a state allegedly devoid of them. The method constructs a heterophenomenological world where Raj experienced conceptual activity labeled as non-conceptual, ensuring the text remains coherent. Raj rejects this: "You are analyzing my words, not my mind." The method brackets the mind, analyzing only the text's coherence.

  The verdict is that Raj's experience contained concepts despite his report. Steps: 1. Collect text. 2. Analyze semantic content. 3. Construct HP-world where the description implies the presence of what it denies. Raj's account is that the experience transcends language. The method overrides this because the bracketing rule denies access to the experience itself, relying solely on the text's logical structure. A first-person method would accept the transcendence claim as valid. They part company on whether language can faithfully transmit pre-linguistic states. The feature doing the work is the refusal to privilege the subject's ontology over the text's semantics. If removed, the method accepts mystical claims without scrutiny. The strongest reply is that science cannot posit entities that contradict the evidence used to posit them; the report is the only evidence. This is not behaviorism because behaviorism would ignore the claim of "awareness" entirely, while HP posits an internal state of "believing one is thought-free." The method absorbs the case by treating the experience as the belief, not the object believed.
