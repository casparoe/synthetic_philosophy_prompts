prompt: |-
  I've been going down a bit of a rabbit hole on something called evidential cooperation in large worlds, and I can't tell if it's a genuinely distinct idea or just ordinary reciprocity wearing a sci-fi hat. The rough idea, as I understand it: if the universe is big enough, there are probably lots of other agents out there running something like the same decision procedure as you, so what you choose can count as evidence about what they'll choose even though nothing you do can causally reach them. The upshot is supposed to be that you might have real reason to 'cooperate' with these strangers — not defect in a one-shot prisoner's dilemma you'll never actually get to play with them, pay into things on the assumption that other instances of your reasoning are paying in too — because your cooperating is evidence that they cooperate. It feels like Newcomb's problem scaled up to cosmic size, and it seems to lean on the kind of decision theory where you do what's evidence of a good outcome rather than what causes one. My flatmate reckons it's just dressed-up tit-for-tat: you scratch my back, I scratch yours, and once you strip out the window dressing it's the same old reciprocity with a philosophy degree. I don't think that's right but I can't quite say why.

  Could you compare the two properly for me? I want to know what evidential cooperation in large worlds actually needs in order to get off the ground, versus what reciprocal cooperation needs — what has to be true about the other agents, about your own decision procedure, about whether your action is really evidence for anything — and then where the two come apart. Is evidential cooperation just reciprocity with the causal links filed off, or does it do something reciprocity structurally can't? And if it does, what's the price of admission — does it only work if you've already swallowed a particular theory of rational choice, does it commit you to cooperating with agents you'd never in a million years want to, does it collapse into 'everything is evidence for everything'? I'd rather the comparison bite on the mechanics — what each one is actually doing under the bonnet — than stay at the level of vibes, and I'd like you to be honest about which parts of the case for evidential cooperation are doing real work and which are just the largeness of the world doing the heavy lifting.
reasoning: |-
  Here's a thinking process that leads to the comparison between Evidential Cooperation in Large Worlds (ECL) and Reciprocal Cooperation:

  1.  **Deconstruct the User's Query:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Core Question:** Is ECL distinct from ordinary reciprocity (tit-for-tat), or just reciprocity with "sci-fi window dressing"?
      *   **Specific Requests:**
          *   Compare the mechanics/requirements of both.
          *   Identify what needs to be true for each to work (agents, decision procedures, evidence).
          *   pinpoint where they diverge structurally.
          *   Assess the "price of admission" (decision theory commitments, unwanted partners, evidential collapse).
          *   Determine what work "largeness of the world" does vs. decision theory mechanics.
          *   Tone: Analytical, honest, mechanical (under the bonnet), avoiding vague "vibes."

  2.  **Initial Assessment & Definitions:**
      *   **Reciprocal Cooperation (RC):** Standard Game Theory (Iterated Prisoner's Dilemma). Requires causal interaction, repeated games, ability to punish/reward *specific* partners based on *their* past actions. Mechanism: Causal influence on future payoffs.
      *   **Evidential Cooperation in Large Worlds (ECL):** Associated with Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). Assumes a vast universe (infinite or just huge). Agents are "subjunctively linked" or "logically correlated" because they run similar algorithms. Mechanism: Your decision *is evidence* of their decision, even without causal contact.
      *   **User's Flatmate's View:** It's just tit-for-tat.
      *   **User's View:** It feels like Newcomb's problem scaled up.
      *   **My Task:** Validate the user's intuition while clarifying the flatmate's confusion. The flatmate is wrong about the *mechanism*, but right that the *outcome* (cooperation) looks similar.

  3.  **Detailed Comparison - "Under the Bonnet":**

      *   **Requirement 1: Causal Contact.**
          *   RC: Essential. I need to know *you* defected to punish *you* later.
          *   ECL: Irrelevant/Impossible. The agents are too far away (spacelike separated). No signal can pass.
      *   **Requirement 2: Identity of Partners.**
          *   RC: Specific individuals. I cooperate with Alice because Alice helped me.
          *   ECL: Reference classes. I cooperate with "agents running algorithm X." I don't know who they are.
      *   **Requirement 3: Decision Theory.**
          *   RC: Works with Causal Decision Theory (CDT). Maximize expected utility based on causal impact.
          *   ECL: Requires EDT or FDT. CDT says "My action doesn't change their distant action, so defect." EDT/FDT says "My action correlates with their action, so cooperate."
      *   **Requirement 4: Information.**
          *   RC: History of play.
          *   ECL: Knowledge of one's own source code and the probability of similar source codes existing elsewhere.

  4.  **Where They Come Apart (The Structural Divergence):**
      *   *The One-Shot Problem:* RC fails in one-shot PDs (Nash Equilibrium = Defect). ECL claims to solve one-shot PDs if the other player is sufficiently similar.
      *   *The "Why":* RC is about *influence* (changing their behavior). ECL is about *correlation* (selecting a world where they behave well).
      *   *The Flatmate's Error:* Tit-for-tat relies on the *threat* of future defection. ECL relies on the *logical fact* of shared reasoning. If I delete my ability to punish, RC collapses. If I delete my ability to causally affect them, ECL stays standing (provided the correlation holds).

  5.  **The "Price of Admission" (Critiques & Constraints):**
      *   **Decision Theory:** You *must* reject Causal Decision Theory (CDT). This is the biggest hurdle. Most economists and classical game theorists use CDT.
      *   **Reference Class Problem:** Who counts as "like me"? If the class is too broad, I'm cooperating with enemies. If too narrow, no one is there. This is a major mechanical weakness.
      *   **Acausal Trade:** ECL often leads to "acausal trade" scenarios where you might cooperate with agents whose values you hate, just because they are numerous and correlated. (e.g., Paperclip Maximizers).
      *   **Spurious Correlations:** Does everything become evidence? (The "Newcomb's Soda" problem). ECL needs a theory of *which* correlations count (logical vs. accidental).

  6.  **What Work Does "Large World" Do?**
      *   It increases the *stakes*. If there are $N$ copies of me, the impact of my decision is multiplied by $N$ (in terms of correlated outcomes).
      *   It makes the probability of "someone like me existing" approach 1.
      *   *Crucial Point:* The "Large World" doesn't create the logic; it creates the *leverage*. The logic comes from the decision theory.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the flatmate's intuition (outcomes look same) but validate the user's suspicion (mechanics are different).
      *   *Section 1: The Mechanics of Reciprocity.* Focus on Causal Decision Theory (CDT), iterated games, specific partners, leverage via punishment/reward.
      *   *Section 2: The Mechanics of ECL.* Focus on EDT/FDT, logical correlation, reference classes, leverage via multiplication of effect across copies.
      *   *Section 3: The Divergence.* One-shot games, causal isolation, the "threat" vs. "evidence" distinction.
      *   *Section 4: The Price of Admission.* Decision theory commitment, reference class ambiguity, acausal trade with value-misaligned agents.
      *   *Section 5: The Role of the "Large World".* It's an amplifier, not the engine.
      *   *Conclusion:* Summarize. It's not reciprocity; it's "acausal coordination."

  8.  **Refining the Tone:**
      *   Avoid jargon where possible, but use precise terms (CDT, EDT, FDT, Nash Equilibrium) because the user asked for "under the bonnet."
      *   Be honest about the controversies. ECL is not mainstream orthodoxy; it's speculative decision theory.
      *   Address the "evidence for everything" worry (screening off).

  9.  **Self-Correction/Check during drafting:**
      *   *Did I explain FDT?* I should mention Functional Decision Theory as it's the modern incarnation of this idea (Yudkowsky/Soares). It handles the "logical correlation" better than classic EDT.
      *   *Is the flatmate totally wrong?* Well, if the universe *isn't* large enough, ECL collapses. Also, in practice, we often use heuristics that look like reciprocity to approximate ECL. I should acknowledge that overlap.
      *   *Make sure to distinguish "ECL" from "Acausal Trade".* They are closely related. ECL is often the justification for acausal trade. I will treat them as effectively the same mechanism for this comparison.

  10. **Final Polish:** Check against the prompt's specific questions (what needs to be true, where they come apart, price of admission). Ensure the distinction between *causal influence* and *logical correlation* is the central pillar.

  *(Self-Correction on "Large World"):* I need to be careful. ECL specifically relies on the "Large World" hypothesis (infinite universe or multiverse) to guarantee the existence of copies. Without the large world, it's just standard Newcomb/Prisoner's Dilemma with a twin. So the "Large World" *is* a prerequisite for the specific "ECL" formulation, whereas reciprocity works in a small world.

  *(Refining the "Price"):* The biggest price is cooperating with agents you can't punish. In reciprocity, if they defect, you punish. In ECL, if they defect, you can't stop them. You just regret that your algorithm was the kind that cooperates while theirs defected (though if they are truly correlated, they shouldn't defect if you cooperate). The risk is *miscoordination* or *asymmetry*.

  Okay, ready to write. Structure:
  1. Executive Summary (Flatmate is half-right, but mechanically wrong).
  2. Reciprocity (Causal, Specific, Iterated).
  3. ECL (Acausal, Reference Class, One-Shot).
  4. The Divergence (The "Why").
  5. The Price of Admission (Decision Theory, Reference Classes, Value Alignment).
  6. The Role of the Large World.
