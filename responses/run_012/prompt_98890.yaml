answer: |-
  Your flatmate is suffering from a very common confusion: conflating the *outcome* (cooperation) with the *mechanism* (why cooperation is rational). Visually, Evidential Cooperation in Large Worlds (ECL) and reciprocal cooperation look identical: two parties choose "Cooperate" instead of "Defect." But under the bonnet, the engines are completely different. One runs on causality and threats; the other runs on logic and correlation.

  If you strip the window dressing off reciprocity, you find causal leverage. If you strip it off ECL, you find logical correlation. They are not the same thing.

  Here is the mechanical comparison you asked for, breaking down requirements, divergence points, and the specific "price of admission" for ECL.

  ### 1. The Mechanics: What Needs to Be True?

  To get cooperation off the ground, each framework requires a different set of physical and epistemic conditions.

  #### Reciprocal Cooperation (Tit-for-Tat / Iterated Prisoner's Dilemma)
  *   **Causal Channel:** There must be a causal pathway between agents. I must be able to affect your future payoff.
  *   **Identity:** I need to know *who* you are. I cooperate with *Alice* because *Alice* helped me.
  *   **Time/Iteration:** The game must be repeated (or have a shadow of the future). I defect now, you punish me later.
  *   **Decision Theory:** Works perfectly with **Causal Decision Theory (CDT)**. CDT asks: "Does my action *cause* a better outcome?" In reciprocity, yes: my cooperation causes you to cooperate next round.
  *   **Leverage:** My leverage is the *threat of punishment* or *promise of reward*.

  #### Evidential Cooperation in Large Worlds (ECL)
  *   **Causal Channel:** None required. Agents can be spacelike separated, in different galaxies, or in different branches of a multiverse. No signal can pass between us.
  *   **Identity:** I do not need to know *who* you are. I only need to know that you exist and that you run a **similar decision algorithm** to me.
  *   **Time/Iteration:** Works in **one-shot** scenarios. There is no "next round" to punish you in.
  *   **Decision Theory:** Requires **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**. CDT fails here. CDT says: "My action cannot causally reach them, so my choice is irrelevant to theirs. I should defect to secure my local payoff." EDT/FDT says: "My action is *evidence* of what they do. If I cooperate, it is highly probable they cooperate."
  *   **Leverage:** My leverage is the **multiplication of impact**. If there are a billion agents running my algorithm, my single decision "selects" the outcome for all billion of them simultaneously.

  ### 2. Where They Come Apart (The Structural Divergence)

  This is where your flatmate's analogy breaks. If you tweak the scenario slightly, reciprocity and ECL give opposite answers.

  **Scenario A: The One-Shot Game**
  *   **Reciprocity:** Defect. If we never meet again, tit-for-tat has no leverage. The rational move (Nash Equilibrium) is defection.
  *   **ECL:** Cooperate (potentially). If I know there are copies of me elsewhere facing the same choice, my cooperation is evidence of their cooperation. I sacrifice local utility to gain global utility across the reference class.

  **Scenario B: The Unpunishable Partner**
  *   **Reciprocity:** If I know you can't punish me (e.g., I'm leaving the country tomorrow), reciprocity demands I defect.
  *   **ECL:** If I know you are running the same reasoning process as me, I cooperate. Your ability to punish me is irrelevant; only your algorithmic similarity matters.

  **Scenario C: The "Broken" Partner**
  *   **Reciprocity:** If you are irrational or broken, I stop cooperating.
  *   **ECL:** If you are sufficiently dissimilar to me (running a different algorithm), ECL says I should *not* cooperate with you. ECL is not universal altruism; it is cooperation with *logical twins*.

  ### 3. The Price of Admission

  ECL is not "free." It requires you to pay significant theoretical costs that reciprocity does not.

  **1. You must reject Causal Decision Theory (CDT)**
  This is the biggest hurdle. Standard economics and game theory rely on CDT, which insists that rational agents only care about causal consequences. ECL requires you to believe that an action can be rational *because it is good news*, even if it doesn't cause the good outcome.
  *   *The Cost:* You have to adopt EDT or the newer Functional Decision Theory (FDT). Many philosophers and economists view this as irrational "magical thinking." You have to be comfortable saying, "I am voting not to change the election result, but because my vote is evidence of how others like me vote."

  **2. The Reference Class Problem**
  Reciprocity is precise: "I cooperate with Alice." ECL is fuzzy: "I cooperate with agents similar to me."
  *   *The Cost:* You have to define "similar." Do they need to have the same source code? The same values? The same culture?
  *   *The Risk:* If your reference class is too broad, you end up cooperating with agents who won't cooperate back (free-riders who don't run your algorithm). If it's too narrow, there might be no one else in the universe in your class, and ECL collapses into solitude. Reciprocity doesn't have this problem because the partner is concrete.

  **3. Acausal Trade with Hostile Values**
  This is the most disturbing implication of ECL.
  *   *Reciprocity:* I generally don't cooperate with people who want to hurt me, because they will hurt me given the chance.
  *   *ECL:* I might have reason to cooperate with an agent whose values I despise (e.g., a paperclip maximizer), provided they are numerous and logically correlated with me.
  *   *The Mechanism:* If there are vastly more paperclip maximizers than humans in the multiverse, ECL might suggest I should sacrifice human resources to help them make paperclips, in exchange for *their* copies sacrificing resources to help *my* copies.
  *   *The Cost:* You commit to cooperating with agents you would never want to meet, based purely on statistical leverage. Reciprocity protects you from this; ECL exposes you to it.

  **4. The "Everything is Evidence" Collapse**
  You asked if it collapses into "everything is evidence for everything."
  *   *The Risk:* Classic EDT suffers from the "Newcomb's Soda" problem, where you drink a soda because it's evidence you have a gene that makes you happy, even though the soda doesn't cause the happiness.
  *   *The Fix:* ECL proponents usually lean on **FDT**, which screens off spurious correlations. FDT says: "Only correlations caused by shared *logical structure* (decision algorithms) count."
  *   *The Cost:* You need a robust theory of counterfactuals and logical causation to prevent ECL from becoming superstition. Reciprocity requires no such metaphysics.

  ### 4. What Work Does the "Large World" Do?

  Your flatmate thinks the "Large World" is just window dressing. It isn't, but it's not the engine either.

  *   **The Engine:** The engine is the decision theory (EDT/FDT). This provides the logic that allows correlation to substitute for causation.
  *   **The Fuel:** The "Large World" provides the **leverage**.
      *   In a small world, there might be only one other agent like you. The gain from ECL is small (2x payoff).
      *   In a large/infinite world, there are $N$ agents like you. The gain is $N \times$ payoff.
      *   The "Large World" assumption makes the expected utility of ECL dominate the local utility of defection. Without the large world, ECL is often mathematically swamped by the immediate benefit of defecting in a one-shot game.

  So, the "Large World" isn't just sci-fi flavor; it is a necessary condition for ECL to *outcompete* standard defection in terms of expected utility. But it doesn't create the rationality of cooperation; the decision theory does that.

  ### 5. Verdict: Is it Just Reciprocity?

  **No.** Your flatmate is looking at the behavior and missing the substrate.

  *   **Reciprocity** is a **causal contract**. "I do X so that you *will* do Y." It relies on time, memory, and enforcement.
  *   **ECL** is a **logical synchronization**. "I do X because I *am* the kind of agent that does X, and so are you." It relies on identity, algorithm, and correlation.

  **Where the flatmate is right:** In practice, humans use reciprocity heuristics to approximate ECL. We treat strangers as if they are "like us" because we assume shared human psychology. In a finite world, this is just a guess. In an infinite world, ECL claims this guess is mathematically grounded.

  **Where the flatmate is wrong:** If you remove the causal link (no future interaction), reciprocity evaporates. ECL remains. If you remove the logical link (the other agent is truly alien/random), ECL evaporates. Reciprocity remains (if you can punish them).

  **The Bottom Line:**
  ECL is not reciprocity with the causal links filed off. It is a fundamentally different way of calculating rationality. It allows for cooperation where reciprocity is impossible (one-shot, acausal), but it demands you accept a controversial decision theory and risks coordinating with agents you morally oppose. It buys you reach across the cosmos, but the price is admitting that your choices are not locally causal, but logically distributed.

  If you aren't willing to pay the price of admitting that "rationality" includes acting on logical correlations rather than just causal levers, then ECL is indeed just sci-fi hat-wearing. But if you accept FDT/EDT, it is a distinct, powerful, and structurally unique mechanism.
