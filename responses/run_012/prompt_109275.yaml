answer: |-
  **Take-Home Final: Foundations of Set Theory**
  **Question 4: Choice and Countability (20 Marks)**

  **Stimulus:**
  Consider the following argument found in a draft manuscript:

  > "Let $\{A_n \mid n \in \omega\}$ be a countable family of countable sets. Since each $A_n$ is countable, let $f_n: \omega \to A_n$ be a surjection for each $n$. Define $U = \bigcup_{n \in \omega} A_n$. For any $x \in U$, let $k(x)$ be the smallest index such that $x \in A_{k(x)}$, and let $m(x)$ be such that $f_{k(x)}(m(x)) = x$. The map $x \mapsto \langle k(x), m(x) \rangle$ sends $U$ injectively into $\omega \times \omega$. Composing with a standard pairing function $\omega \times \omega \to \omega$ shows $U$ is countable."

  **Task:**
  (a) Identify the exact step where a choice principle is used. Specify which principle is required at the weakest level (ordering Countable Choice, Dependent Choice, and Full AC by strength) and locate this proof within that hierarchy. (4 marks)
  (b) A common objection is: "Just well-order $U$ and pick the least elements." Explain why this is not a valid repair in ZF. (4 marks)
  (c) Explain why the conclusion is not merely unprovable in ZF but actually fails in some models. Describe what must be true of such a model (bonus for naming a specific model). (4 marks)
  (d) Define what makes a selection rule "canonical." Use this to explain why the proof is valid in ZF if the $A_n$ are sets of naturals, if the enumerations $f_n$ are given as data, or if the index set is finite. (4 marks)
  (e) In 2–3 sentences, explain why this shows the content of AC is about simultaneity and definability, not merely non-emptiness. (4 marks)

  ***

  **Model Answer**

  (a) The choice principle is invoked in the sentence: "let $f_n: \omega \to A_n$ be a surjection for each $n$." While ZF proves $\forall n \exists f_n$, it does not prove $\exists \langle f_n \mid n \in \omega \rangle \forall n$. This is the quantifier shift from individual existence to a simultaneous sequence. The weakest principle licensing this is **Countable Choice** ($\text{AC}_\omega$). In the hierarchy of choice principles, $\text{AC}_\omega$ is strictly weaker than Dependent Choice (DC), which is itself strictly weaker than Full AC. This proof sits precisely at the level of $\text{AC}_\omega$; it does not require DC because the choices are independent, nor Full AC because the index set is countable.

  (b) The proposed repair fails because the statement "every set can be well-ordered" is equivalent to the Well-Ordering Theorem, which implies Full AC. In ZF, an arbitrary countable union of countable sets need not be well-orderable. To well-order $U$, one effectively needs to choose a well-ordering for each $A_n$ simultaneously to construct a well-ordering of the union, which reintroduces the original choice problem. Thus, assuming $U$ is well-orderable assumes more than ZF grants.

  (c) The statement fails in models where the reals $\mathbb{R}$ are a countable union of countable sets. In such models, if the theorem held, $\mathbb{R}$ would be countable, contradicting Cantor's theorem (which holds in ZF). Therefore, there exist models of ZF where the countable union of countable sets is not countable. A specific example is the **Feferman-Lévy model** (or Cohen's first model), constructed by collapsing $\aleph_\omega$ or adding countable subsets of reals without choice functions. In these models, $\omega_1$ is often singular, or the reals lack a well-ordering.

  (d) A selection rule is **canonical** if it is definable without parameters by a formula that uniquely picks an element from any non-empty set in a specific class. The step "let $k(x)$ be the smallest index" is canonical because $\omega$ is well-ordered in ZF; the least element is unique and definable.
  1. If $A_n \subseteq \omega$, we can canonically choose enumerations (e.g., increasing order), so $\text{AC}_\omega$ is not needed.
  2. If the sequence $\langle f_n \rangle$ is given as data, the choice has already been made externally; the proof then proceeds in ZF.
  3. If the index set is finite, ZF proves finite choice by induction, so no choice axiom is required.

  (e) The failure of the proof in ZF is not because the sets of enumerations are empty (they are not), but because ZF cannot guarantee a single function selecting one from each set simultaneously. AC asserts the existence of a choice function where no definable rule exists. Thus, the content of AC concerns the **simultaneity** of selections across a family and the lack of a uniform **definability** condition, rather than the mere non-emptiness of the sets involved.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  1.  **Identification & Hierarchy (4 marks):**
      *   2 marks: Identifies "let $f_n$... for each $n$" (the quantifier shift) as the choice step.
      *   1 mark: Correctly identifies Countable Choice ($\text{AC}_\omega$) as the weakest principle.
      *   1 mark: Correctly orders $\text{AC}_\omega < \text{DC} < \text{AC}$.
      *   *Deduction:* If the student flags the "smallest index" step as requiring choice, deduct **2 marks** from this section (misdiagnosis of canonical selection).

  2.  **Well-Ordering Repair (4 marks):**
      *   2 marks: States that well-ordering $U$ (or the $A_n$) requires AC/Well-Ordering Theorem.
      *   2 marks: Explains that assuming $U$ is well-orderable begs the question/circular in ZF context.

  3.  **Model Failure (4 marks):**
      *   2 marks: Explains failure via consistency (e.g., $\mathbb{R}$ as countable union would imply $\mathbb{R}$ countable).
      *   2 marks: Describes model condition (e.g., $\omega_1$ singular, reals not well-orderable).
      *   *Bonus:* +1 mark (capped at 20) for naming Feferman-Lévy or Cohen's model.

  4.  **Canonical Selection & ZF Cases (4 marks):**
      *   1 mark: Defines canonical as definable/unique (e.g., via well-ordering of $\omega$).
      *   1 mark: Sets of naturals (inherent well-ordering).
      *   1 mark: Given enumerations (choice already made).
      *   1 mark: Finite index (ZF proves finite choice).

  5.  **Simultaneity & Definability (4 marks):**
      *   2 marks: Mentions simultaneity (sequence vs. individual existence).
      *   2 marks: Mentions definability (lack of uniform rule vs. emptiness).

  **Typical Error Note:**
  Candidates often lose marks in section (d) by claiming ZF proves "finite choice" without noting it follows from induction, or in section (a) by claiming the proof requires Full AC rather than Countable Choice.

  **A vs. B Distinction:**
  An **A answer** distinguishes between the *existence* of enumerations (provable in ZF for each $n$) and the *existence of a sequence* of enumerations (requires $\text{AC}_\omega$), and treats the failure as a semantic fact about models (section c) rather than just a syntactic lack of proof. A **B answer** typically identifies the use of AC but conflates $\text{AC}_\omega$ with Full AC, or treats the "smallest index" step as suspicious, failing to recognize the well-ordering of $\omega$ as a ZF-resource that renders that specific selection canonical.
