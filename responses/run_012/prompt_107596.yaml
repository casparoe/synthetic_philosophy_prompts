  # Seminar Handout: A Taxonomy of Moral Repair

  **Instructions:** This tree is not a quiz. It is a map of the logical space surrounding the Honor/Dignity/Victimhood debate. Start at the root. Answer the questions based on your philosophical commitments, not your gut reaction or upbringing. If you land on a leaf, read the "Awkward Truth" to see if you can stomach the cost of that position.

  ### The Decision Tree

  **Node 1: The Normative Precondition**
  *Is the question "Which culture is morally superior?" a meaningful inquiry, or is it a category error?*
  *   **Category Error:** → **Leaf 1**
  *   **Meaningful Inquiry:** → Node 2

  **Node 2: The Status of Status**
  *Is moral standing a zero-sum resource (for me to gain, you must lose), or is it non-zero-sum (we can all have it)?*
  *   **Zero-Sum:** → **Leaf 2**
  *   **Non-Zero-Sum:** → Node 3

  **Node 3: Source of Repair**
  *When standing is damaged, who bears the primary burden to restore it?*
  *   **The Wronged Individual:** → Node 4
  *   **External Agents:** → Node 5

  **Node 4: The Status of Anger (Individual Branch)**
  *Is the willingness to feel/display anger a competent signal of justice or a failure of self-command?*
  *   **Competent Signal:** → **Leaf 3**
  *   **Failure of Command:** → **Leaf 4**

  **Node 5: Identity of External Agent**
  *If others must act, is the primary agent the **Wrongdoer** (direct restitution) or a **Third Party** (community/institution)?*
  *   **The Wrongdoer:** → **Leaf 5**
  *   **Third Party:** → Node 6

  **Node 6: Mode of Third-Party Intervention**
  *Does the third party act to enforce **Neutral Rules** (blind adjudication) or validate **Lived Experience** (recognition of harm)?*
  *   **Neutral Rules:** → **Leaf 6**
  *   **Lived Experience:** → Node 7

  **Node 7: Function of Victimhood**
  *Is being recognized as a victim a **Transitional State** (to be resolved) or a **Source of Capital** (moral authority)?*
  *   **Transitional State:** → **Leaf 7**
  *   **Source of Capital:** → **Leaf 8**

  ***

  ### The Leaves

  **Leaf 1: The Sociological Descriptivist**
  *(The "Annoying Student" Position)*
  *   **Position:** The taxonomy describes power dynamics, not moral truths; asking which is "better" is like asking if a hammer is morally superior to a screwdriver.
  *   **Awkward Truth:** You must remain silent when your own group is harmed, because protesting implies you believe your harm matters more than the descriptive facts allow.

  **Leaf 2: The Cynic**
  *(The "Pecking Order" Position)*
  *   **Position:** Honor, Dignity, and Victimhood are identical strategies for credibility contests; the only difference is which costume is currently fashionable.
  *   **Awkward Truth:** You cannot condemn a bully without admitting you are just a bully who lacks the strength to win, rendering your own moral outrage hypocritical.

  **Leaf 3: Plain Honor Culture**
  *(Self + Anger as Virtue)*
  *   **Position:** Standing is restored by the individual's willingness to inflict costs on the transgressor; anger is the fuel of justice.
  *   **Awkward Truth:** You must be willing to escalate violence over trivial slights, or admit your honor is performative and your standing is fake.

  **Leaf 4: The True Stoic**
  *(Self + Anger as Vice — **UNOCCUPIED**)*
  *   **Position:** Standing is restored by the individual's total immunity to the slight; anger is a surrender of autonomy.
  *   **Awkward Truth:** You cannot distinguish between justice and apathy, meaning you would offer the same resilience to a compliment as you would to a assault.
  *   **Note:** *Nobody actually holds this. Everyone thinks some slights warrant anger.*

  **Leaf 5: The Penitent Model**
  *(Wrongdoer Repair — **UNOCCUPIED**)*
  *   **Position:** Standing is restored solely by the wrongdoer's unprompted submission; neither community nor victim should demand it.
  *   **Awkward Truth:** You must accept permanent degradation if the wrongdoer refuses to apologize, as demanding repair violates the very dignity you seek.
  *   **Note:** *Rare outside specific religious contexts; unsustainable in secular pluralism.*

  **Leaf 6: Plain Dignity Culture**
  *(Third Party + Neutral Rules)*
  *   **Position:** Standing is inherent and restored by institutions punishing rule-breaking regardless of the victim's feelings.
  *   **Awkward Truth:** You must accept that the institution may vindicate you while completely ignoring your pain, treating you as a case number rather than a person.
  *   **FLAG:** *This leaf is functionally adjacent to Leaf 7. In practice, "Neutral Rules" often require validating "Lived Experience" to determine harm.*

  **Leaf 7: Plain Victimhood Culture**
  *(Third Party + Experience + Transitional)*
  *   **Position:** Standing is restored by community recognition of harm, but the goal is to resolve the victimhood and return to equilibrium.
  *   **Awkward Truth:** You must actively downplay your trauma once acknowledged, or risk being accused of hoarding the moral capital you just claimed.
  *   **FLAG:** *This leaf is functionally adjacent to Leaf 6. Dignity cultures increasingly rely on victim testimony to establish rule violations.*

  **Leaf 8: Flipped Honor**
  *(Third Party + Experience + Capital)*
  *   **Position:** Victimhood is not a defect to be repaired but a high-status identity that grants authority over others.
  *   **Awkward Truth:** You are incentivized to remain harmed, because healing would cost you the moral authority you currently wield over the group.
