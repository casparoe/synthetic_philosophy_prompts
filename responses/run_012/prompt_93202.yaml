answer: |-
  Thank you for trusting me with this. Our principal asked us to speak about how the future is in our hands. That sounds like an invitation to promise anything we want. But I want to talk about what happens when you actually try to hold something, and what you have to put down to keep your grip.

  There is an old story in physics about a tiny gatekeeper who stands between two chambers of air. Their job is to sort the molecules: let the fast ones pass one way, and the slow ones the other. If they do this well, one side gets hot and the other gets cold, creating order out of chaos without seeming to do any work. For a long time, people thought this was magic. They thought you could get useful energy for free if you were just smart enough to sort the world correctly.

  But the story has an ending. The gatekeeper cannot sort forever without keeping track of what they have seen. They need a notebook to record the speed of every molecule. Eventually, the notebook fills up. To keep sorting, the gatekeeper has to wipe the pages clean. And that act of forgetting—erasing the record—is where the cost comes due. Clearing the memory generates heat. It burns energy. The order created in the chambers is paid for by the wear and tear on the gatekeeper's mind. You can win for one afternoon, but you cannot win the cycle without paying the bill.

  We are the hot chamber. We are the sorted result. We look organized, accomplished, and ready. But the physics of this situation demands we ask where the heat went. It did not vanish. It was absorbed by the people who kept the records for us. It is in the teachers who graded papers late into the night, the parents who worked extra shifts to keep the house running, the friends who covered for us when we needed to study. It is also in the things we dropped. To keep the schedule we kept, we sacrificed sleep, hobbies, and quiet mornings. We balanced the books by moving the debt to places we hoped no one would look.

  Graduation feels like the moment the gatekeeper wins. But this ceremony is just one run of the engine. Life is not a single sorting event; it is a cycle that repeats. The accounting we avoided in high school will reappear when we have to reset for careers, for relationships, for communities. We cannot promise that we will beat the books. There is no such thing as free order. If we build something successful, something clean and structured, the cost must be paid somewhere.

  So I will not promise that we will change the world without breaking a sweat. I will not promise that disorder will never catch up to us. What I can promise is this: we get to decide where the cost lands. The gatekeeper in the story had no choice; the heat had to go into the memory. We have more agency than that. When we create order in our lives, we can choose to absorb the heat ourselves rather than passing it to someone else. We can choose to pay for our success with our own effort instead of outsourcing the exhaustion to our families or our neighbors.

  We cannot violate the laws of the universe. But we can choose who pays the tax. Let us be the generation that stops hiding the notebook. Let us be honest about the price of what we build, and let us ensure that the cost does not fall on those who had no say in the sorting.

  Thank you.

  ***

  **Note to the Speaker**

  Regarding simplifications: A physicist might object to personifying the demon as a conscious "gatekeeper" with a "notebook," as the paradox relies on abstract information processing rather than literal writing, and they might note that I conflated energy cost with social sacrifice, which is a metaphorical leap rather than a physical equivalence. Regarding what was softened: I omitted the absolute inevitability of the Landauer limit; in physics, the cost is non-negotiable and quantifiable, whereas in the speech, I suggested we have a choice in "where the cost lands," which is socially true but physically imprecise, necessary to keep the message empowering rather than deterministic for a graduation.
