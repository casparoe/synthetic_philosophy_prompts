  Project Title: Distinguishing Expectation from Weighting in Anthropics

  **Introduction and Background**

  Anthropic reasoning concerns how observers should update their beliefs given the fact that they exist. Two dominant frameworks currently structure this debate. The first, the self-sampling approach, instructs agents to reason as though they were a random sample drawn from the set of all observers in a relevant reference class. This view successfully handles many self-locating puzzles but drives doomsday-style conclusions and suffers from a persistent reference-class problem. The second, the self-indication approach, holds that the mere fact that an observer with your evidence exists is itself evidence; consequently, hypotheses entailing more such observers deserve proportionally more credence. While this avoids some doomsday conclusions, it yields the "presumptuous philosopher" problem: an agent armed with this view claims to settle whether the cosmos is modest or enormous by armchair reasoning alone, since the hypothesis positing vastly more observers wins overwhelmingly on credence. Nearly everyone finds this conclusion absurd.

  The standard dialectic assumes these two views are competing answers to the same question. They are treated as rival definitions of anthropic probability, where adopting one entails rejecting the other. This proposal challenges that assumption. It conjectures that the standoff arises because the two views are answering different questions. The self-sampling approach provides the correct constraint on what to expect regarding self-location within a world. The self-indication approach provides the correct constraint on how to weight hypotheses when the decision at issue has consequences that scale with the number of observers. The presumptuous philosopher argument lands only because it reads an answer to the second question as if it were an answer to the first.

  **The Research Question**

  The central question of this project is: Is there a principled, pre-theoretical criterion that dictates when to apply self-sampling normalization versus self-indication weighting? 

  This question must be answered determinately. It is not enough to say that context matters; the project must identify the structural feature of a reasoning problem that triggers the switch. If such a criterion exists, anthropic probability is not a unitary concept but a dual-purpose tool. If no such criterion can be stated without referencing the desired outcome, the pluralist solution is merely ad-hocery disguised as insight.

  **The Gap in Existing Positions**

  Current literature leaves this question open because both standard views claim universality. Proponents of the self-sampling approach treat their normalization rule as a constraint on belief simpliciter, failing to account for scenarios where ignoring observer abundance leads to demonstrably suboptimal decisions in population-scaling contexts. Conversely, proponents of the self-indication approach treat their weighting rule as a constraint on truth, failing to account for why armchair reasoning should not settle empirical questions about universe size. The specific gap is the lack of a meta-rule. Neither view explains why we intuitively reject the presumptuous philosopher's conclusion while simultaneously accepting that larger populations might matter more for ethical or decision-theoretic calculations. The debate survives because both sides are partially right about different functional roles of probability, but neither has articulated the boundary conditions separating those roles.

  **Methodology**

  The project will proceed by constructing a formal apparatus capable of housing both probability functions without contradiction. I will not rely on collecting intuitions about further puzzle cases, as this merely multiplies examples without resolving the underlying structural confusion. Instead, I will employ a decision-theoretic framework that separates credence functions from utility functions.

  First, I will formalize the two probability functions. The self-sampling function will be defined as a conditional probability over observer-moments within a fixed hypothesis. The self-indication function will be defined as a weighting over hypotheses proportional to the expected number of observers. 

  Second, I will impose invariance conditions on each. For the self-sampling function, the invariance condition will be "irrelevant observer addition": adding observers who do not share my evidence should not shift my self-locating credence. For the self-indication function, the invariance condition will be "utility scaling": if the value of an outcome scales linearly with the number of observers, the probability weighting must reflect that abundance to maximize expected utility.

  Third, I will construct a hybrid test case. This case will involve a decision where the agent must bet on the size of the universe, but the payoff structure varies. In one version, the payoff is personal (only the agent benefits). In the other, the payoff is global (all observers benefit). 

  Fourth, I will derive the criterion. The goal is to state the rule before applying it. The criterion will likely turn on the scope of the utility function: if the utility is local to the agent, self-sampling applies; if the utility is global and scales with population, self-indication applies. I will test whether this criterion can be stated without referencing the absurdity of the presumptuous philosopher's conclusion. If the criterion relies on the output to justify the input, the project fails.

  **Expected Results and Failure Conditions**

  A successful result will look like a clear demarcation line stated in the introduction of the framework. It will show that the presumptuous philosopher is making a category error: applying a global weighting rule to a local belief question. The framework will demonstrate that accepting self-indication for decision-weighting does not force us to accept its absurd credence implications for pure belief.

  However, I must specify what counts as failure in advance. The project fails if the derived criterion is circular—for example, if the rule turns out to be "use self-indication unless it yields presumptuous conclusions." This would be reverse-engineering the solution from the intuition it was meant to explain. The project also fails if the two probability functions cannot be formally reconciled within a single decision matrix without violating standard axioms of probability, such as normalization or additivity. If maintaining both requires abandoning the coherence of the agent's belief system, the pluralist view is untenable. Finally, the project fails if the distinction collapses into a known reference-class solution; if the "context" switch is just a disguised way of selecting a reference class, no new work has been done.

  **Scope and Feasibility**

  This project is scoped for one semester. The primary deliverable is the statement and defense of the criterion, supported by the hybrid test case. The most likely piece to become too big is the formal proof of consistency between the two probability functions within a single decision theory. If time runs short, I will cut the rigorous axiomatic defense and rely on the intuitive plausibility of the invariance conditions. The core philosophical work is the identification of the criterion, not the full formalization of the resulting logic. I will also restrict the scope to the presumptuous philosopher case and not attempt to solve all anthropic puzzles, such as the sleeping beauty problem, unless they directly bear on the criterion.

  The work is worth doing because it dissolves a stalemate that has persisted for decades. By showing that the standoff is a category error rather than a substantive disagreement about the world, we can retain the insights of both views without their respective absurdities. The project is feasible because it does not require new empirical data or complex modeling, but rather a careful conceptual dissection of existing formal tools. The risk is high—if the criterion cannot be stated independently of the results, the conjecture is empty—but the payoff is a resolution to one of the most stubborn problems in contemporary epistemology.

