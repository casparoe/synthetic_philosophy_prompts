  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the position (Dogmatism/Externalism/Easy Knowledge). Set the stage (Cohen, Vogel, Wright).

      *   **Category 1: The Intuitive Bullets (Merely Awkward):**
