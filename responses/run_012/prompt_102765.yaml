      *   **Specific Mechanism:** Bootstrapping (using perception to confirm perception's reliability) yields *genuine knowledge*, not just circularity.
      *   **Goal:** The user wants to know what counts *against* this view. They want to distinguish between mere intuitions (bullets to bite) and substantive theoretical problems (formal results, structural issues). They want a ranking of defeaters from fatal to awkward. They also want to know if the position is unfalsifiable and if that's a bug or a feature.
