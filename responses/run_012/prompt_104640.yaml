      *   *Sentence 3:* "Work on the moral/conventional distinction shows that morality is at bottom a matter of convention, since which acts count as moral violations shifts from group to group." -> **Major Error.** This conflates the Turiel paradigm (moral vs. conventional distinctions) with cultural relativism. The moral/conventional distinction typically shows that people *distinguish* moral violations (harm/justice) from conventional violations (rules/authority) across cultures, often supporting universalism rather than conventionalism. Saying morality *is* convention because acts shift is a non-sequitur and misinterprets the psychological literature (Haidt vs. Turiel vs. Kelly).
