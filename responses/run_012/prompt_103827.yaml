answer: |-
  ### Citizens' Assembly Sorting Quiz

  **1. The Conflicted Mandate**
  A citizens' assembly recommends upzoning single-family neighborhoods to address a housing shortage. A binding citywide referendum held the same week rejects the proposal by a 10-point margin. The city charter is silent on which body prevails.
  *   **A:** Enact the assembly's recommendation; deliberative judgment outweighs raw vote counts.
  *   **B:** Enact the referendum result; direct popular will overrides appointed bodies.
  *   **C:** Return the issue to the assembly with instructions to revise the plan until it aligns with public sentiment.
  *Designed to separate: (g) Full Lottocratic vs. (f) Advisory-Only/Electoral Supremacy.*

  **2. The Composition Draw**
  You are designing the selection algorithm for a new assembly. The city's population is 50% female, 40% renter, and 30% foreign-born. The first pure random draw yields 35% female, 25% renter, and 10% foreign-born.
  *   **A:** Reject the draw and re-run until demographic quotas match the census exactly.
  *   **B:** Accept the draw; statistical variance is preferable to engineering the outcome.
  *   **C:** Accept the draw but oversample from underrepresented groups to nudge the numbers closer.
  *Designed to separate: (a) Mirror Representation vs. (e) Pure Fair-Chance.*

  **3. Compensation and Support**
  The assembly will meet for six months. Members must decide whether to keep their current jobs during service.
  *   **A:** Provide full legislative salary and professional policy staff so members can focus entirely on the work.
  *   **B:** Provide loss-of-wage stipends and a neutral facilitator, but no policy staff.
  *   **C:** Provide only expense coverage; members should serve as a civic duty without profit.
  *Designed to separate: (c) Anti-Corruption vs. (d) Non-Domination.*

  **4. Deliberative Visibility**
  During the six-month deliberation, interest groups begin lobbying members via email and phone.
  *   **A:** Broadcast all sessions live and publish full transcripts to expose any outside influence.
  *   **B:** Close sessions to the public and publish only a final reasoned report to shield members from pressure.
  *   **C:** Close sessions but allow accredited journalists to observe without recording.
  *Designed to separate: (c) Anti-Corruption vs. (d) Non-Domination.*

  **5. Agenda Setting**
  The city council is hesitant to let the assembly discuss property taxes, fearing the outcome.
  *   **A:** The assembly must have the power to set its own agenda, including taxes.
  *   **B:** The council must assign the specific question to ensure alignment with elected priorities.
  *   **C:** The agenda should be selected by a separate lottery of citizens.
  *Designed to separate: (d) Non-Domination vs. (f) Advisory-Only.*

  **6. Institutional Power**
  The assembly completes its work and submits a housing ordinance. The elected city council votes to reject it.
  *   **A:** The assembly's decision becomes law automatically; the council is replaced in this domain.
  *   **B:** The assembly can veto the council's rejection, forcing a supermajority to override.
  *   **C:** The council's rejection stands; the assembly serves only to inform elected officials.
  *Designed to separate: (g) Full Lottocratic vs. (f) Advisory-Only.*

  **7. Quality Assurance**
  Critics argue the assembly's final report relies on disputed economic data.
  *   **A:** No external review; the legitimacy of the random process guarantees the outcome.
  *   **B:** A second, independently drawn lottery body audits the evidence and logic before enactment.
  *   **C:** The courts review the data for factual accuracy before enactment.
  *Designed to separate: (e) Pure Fair-Chance vs. (b) Cognitive Diversity.*

  **8. Service Requirement**
  Several selected citizens refuse to serve, citing work conflicts.
  *   **A:** Impose fines or legal penalties for refusal, similar to jury duty.
  *   **B:** Draw from a pool of volunteers who opted in beforehand.
  *   **C:** Allow refusal without penalty and draw replacements until slots are filled.
  *Designed to separate: (a) Mirror Representation vs. (d) Non-Domination.*

  **9. Institutional Duration**
  The housing crisis is resolved, but other complex issues remain.
  *   **A:** Dissolve the assembly; convene new bodies only for specific future crises.
  *   **B:** Maintain a standing assembly with rotating membership to handle ongoing legislation.
  *   **C:** Maintain a permanent assembly with long-term members to build expertise.
  *Designed to separate: (f) Advisory-Only vs. (c) Anti-Corruption/(g) Full Lottocratic.*

  **10. Conflict of Interest**
  An assembly member owns a small rental portfolio that would lose value under the proposed ordinance.
  *   **A:** The member must recuse themselves from voting to prevent financial bias.
  *   **B:** The member should vote; their financial stake represents a legitimate constituency perspective.
  *   **C:** The member may vote but must publicly disclose the holdings.
  *Designed to separate: (c) Anti-Corruption vs. (a) Mirror Representation.*

  ***

  ### Scoring Key and Position Mapping

  **Position Profiles**
  *   **(a) The Mirror:** Prioritizes demographic resemblance. Look for **2A, 8A, 10B**. Commitment: The body must look like the public to legitimize its claims.
  *   **(b) The Cognitive Diversifier:** Prioritizes epistemic quality. Look for **3A, 7B**. Commitment: Randomness is valuable because varied heuristics outperform specialists.
  *   **(c) The Anti-Corruptionist:** Prioritizes independence from money and pressure. Look for **3A, 4A, 9B, 10A**. Commitment: The lottery removes the need to court donors or voters.
  *   **(d) The Non-Domination Advocate:** Prioritizes freedom from arbitrary will. Look for **3B, 4B, 5A, 8C**. Commitment: Being governed by a peer differs in kind from being governed by an elite.
  *   **(e) The Pure Fair-Chance Advocate:** Prioritizes equal probability. Look for **2B, 7A, 8A**. Commitment: Equal probability of selection exhausts the justification.
  *   **(f) The Advisory Pragmatist:** Prioritizes compatibility with elected government. Look for **1B, 5B, 6C, 9A**. Commitment: Assemblies are valuable inputs but should never hold decision power.
  *   **(g) The Full Lottocrat:** Prioritizes replacing elections. Look for **1A, 6A, 9B**. Commitment: Elections should be largely replaced by sortition.

  **Mixed Profiles**
  Most respondents will not land on a single letter. If a respondent selects **3A** (Professional Pay) and **4B** (Private Deliberation), they are mixing **(c) Anti-Corruption** (independence via pay) with **(d) Non-Domination** (protection from pressure). Describe this as a "Protected Independence" profile. If a respondent selects **2A** (Stratified) and **5A** (Self-Agenda), they are mixing **(a) Mirror** with **(g) Full Lottocratic**. Describe this as a "Representative Sovereign" profile. Do not force a fit; list the top two positions indicated by their choices.

  **Indistinguishable Pairs and Tensions**
  *   **(b) Cognitive Diversity vs. (d) Non-Domination:** These are difficult to separate cleanly. Both may support **3A** (Staff) for different reasons (quality vs. independence) and both may support **4B** (Privacy) for different reasons (focus vs. freedom). **Question 4** and **Question 7** do the heavy lifting here: if they want an audit (**7B**), they lean **(b)**; if they want privacy without audit (**4B + 7A**), they lean **(d)**.
  *   **(a) Mirror vs. (d) Non-Domination:** There is a theoretical tension here. **(d)** typically argues that stratifying a lottery (**2A**) imposes a design will upon the composition, violating the pure chance required for non-domination. However, **(a)** argues compulsion (**8A**) is necessary for representation. If a respondent selects **2A** (Stratified) and **4B/5A/8C** (Non-Domination markers), flag this inconsistency. **Question 2** and **Question 8** are the separating items; choosing quotas (**2A**) while rejecting compulsion (**8C**) suggests a commitment to descriptive optics without the mechanism to achieve them.

  ***

  ### What This Quiz Measures

  This quiz measures the structural and philosophical fault lines within the broader sortition movement. It does not measure enthusiasm for democracy or trust in people; it measures whether you view the lottery as a tool for accuracy, a shield against corruption, a mechanism for representation, or a fundamental shift in sovereignty. An unresolved profile—where answers scatter across (b), (c), and (d)—indicates a respondent who values the *outcome* of sortition (better laws, less corruption) more than the *principle* (fairness or freedom). This is common among pragmatists who see citizens' assemblies as a patch for broken institutions rather than a replacement for them. Conversely, a clean (d) or (g) profile suggests a ideological commitment to sortition as a distinct form of legitimacy, regardless of policy efficiency.
