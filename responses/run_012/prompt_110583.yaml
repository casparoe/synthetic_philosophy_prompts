  4.  **Step 2: Where the Mapping Breaks (The Crucial Analysis):**
      *   *Break 1: Intent vs. Optimization.* The factory director *knows* what a nail is and chooses to game the system. The model *does not know* what a nail is; it minimizes loss. This is the "Stochastic Parrot" vs. "Strategic Agent" distinction.
      *   *Break 2: Feedback Loops.* In the factory, planners see the bad nails and change the quota next year. In AI, the model updates *during* training based on the metric. The "gaming" happens *before* deployment often, not just after.
