      *   *(3) Constitution of Love:* Love/friendship *requires* partiality. Trading a friend for a stranger at equal cost violates the relationship.
      *   *(4) Defensibility Test:* An action is defensible if it could be defended *in principle* to those affected. (Contractualist/Scanlon-esque vibe).
      *   *(5) Completeness:* Moral theory must return a verdict on every case (in principle).
      *   *(The Case):* Daughter vs. 20 Strangers. User chooses daughter. User claims they owe the strangers *nothing* they could say (i.e., no justification needed/possible that would satisfy them, yet the action is still right).

