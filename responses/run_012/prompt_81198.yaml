      *   *Conflict 3:* (2) vs. (5).
          *   (2) is about psychology. (5) is about metaphysics of morality.
          *   *Revision:* None needed really. Distinguish "motive" from "criterion."
          *   *Cost:* Negligible.

  5.  **Ranking Severity:**
