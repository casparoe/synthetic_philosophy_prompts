          *   *Severity:* High. This is the classic Impartiality vs. Partiality problem. If (1) is true at the "root," how can (3) be true without contradiction?

      *   **Conflict B: (1) vs. (4).**
          *   (1) says interests count equally.
          *   (4) says defensibility is about justification to *those affected*.
          *   *Tension:* If I choose my daughter over 20 strangers, can I defend that *to the 20 strangers*? If (1) is true, their interests outweigh the daughter's (20 > 1). So (4) might demand I go to the meeting. But the User says in (The Case) they owe the strangers nothing they could say.
