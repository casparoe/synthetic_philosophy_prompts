      *   **Conflict C: (2) vs. (5).**
          *   (2) says calculation in the moment ruins the virtue/action.
          *   (5) says a theory must have a verdict *in principle*, even if not worked out in the moment.
          *   *Tension:* (5) allows for the calculation to exist *in principle* (the verdict exists), while (2) bans it from consciousness.
          *   *Severity:* Low. This is a distinction between *context of justification* vs. *context of discovery/action*. They can coexist (rule utilitarianism style).

      *   **Conflict D: (4) vs. (The Case).**
          *   (4) Action must be defensible to those affected.
          *   (The Case) "I would have nothing to offer them."
          *   *Tension:* If I can't defend it to them, is it defensible? The User says "in principle." But if the principle is (1), the defense fails. If the principle allows partiality, the defense might work.
          *   *Severity:* Medium.

