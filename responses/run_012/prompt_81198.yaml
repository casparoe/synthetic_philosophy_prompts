          *   This is a direct contradiction unless (1) is modified.
          *   *Revision:* (1) isn't the *only* root. Or (1) applies to legislation/institutions, not individual action. Or (1) is false.
          *   *Cost:* Losing the elegant simplicity of pure impartiality.

      *   *Conflict 2:* (1) vs. (4).
