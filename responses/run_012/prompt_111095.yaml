prompt: |-
  I TA a second-year formal epistemology unit (about 18 students, one 90-minute session, and yes the projector is held together with tape), and there's a thing I've been trying to get them to *feel* rather than learn: that when you get a message of the form "if A, then probably B" and it's given a number, your credences are genuinely underdetermined by it, and the obvious fixes all pull apart. Every year they nod at this and then, on the problem sheet, half of them condition on the material conditional as if "if...then" were just a disjunction and the other half quietly assume the message says nothing about A at all, and nobody notices they've made different choices. What I want is a session where they're forced to write down an actual number, discover their neighbours wrote different numbers for equally good reasons, and can't get the message itself to adjudicate. Here's the seed I want it built on, feel free to bend it: a drone operator is searching for a stranded hiker in a park divided into a North sector and a South sector, each half the area; within each sector there's a smaller "likely zone" that the operator initially thinks she's 50/50 to be in, so her prior is flat at a quarter on each of the four cells (North-zone, North-rest, South-zone, South-rest). Then the radio comes in: "if she's in the North sector, the chance she's in the North likely-zone is 4 in 5." She has to reallocate. Nobody can tell her what her new credence that she's in the North should be — or rather, everybody thinks they can.

  Design me the runnable session. I want rules, materials (I'm happy to print slips and hand out tokens), a scoring scheme with small stakes — I'd rather it be a proper scoring rule so that honestly reporting your credences is the thing that pays, and I don't want to have to do the arithmetic live, so give me a printed table if it comes to that — plus a minute-by-minute timeline, any roles, and what I write on the board when. Crucially the structure should make them collide with the problem themselves before I name anything: they should commit to numbers, see the spread across the room, and only then start defending their rule. If you can build in a second round where the same information arrives phrased differently (say, as a claim about the conditional itself versus as a plain probability that some "if...then" sentence is true), or a round where a converse conditional comes in, so the direction of the conditional and the two readings of "if" both get exercised, all the better. And I want them to notice that the disagreement isn't incoherence — that two people can hold perfectly coherent, non-Dutch-bookable credences that differ, so no amount of betting will settle it.

  Then the debrief, which is where I most need help: map the moments in the activity onto the actual moving parts of the problem, and give me a table of the candidate update rules a smart student might be reaching for — conditioning on the material conditional, holding the prior on the North fixed, the "move as little as possible" or closest-distribution idea, and whatever else deserves a seat — with the number each one spits out for the probability of being in the North in this exact scenario, and one line on what's attractive and what's fishy about each. Also tell me what predictably goes wrong the first time I run it (I'd bet money on at least one group treating the 4-in-5 as a fact they can just plug in) and how to handle it in the moment, and be straight with me about which part of the puzzle the activity simply cannot reproduce and that I'll have to supply from the front of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach 2nd-year formal epistemology students (approx. 18 students) that "If A, then probably B" (probabilistic conditional) underdetermines posterior credences.
      *   **Current Problem:** Students nod in class but then solve problem sheets inconsistently (some condition on material conditional, some ignore A, etc.) without realizing they've made different assumptions.
      *   **Desired Outcome:** A session where students *feel* the underdetermination. They must commit to numbers, see disagreement, realize the message doesn't adjudicate, and understand that multiple coherent updates exist (no Dutch book).
      *   **Seed Scenario:** Drone operator searching for a hiker. North/South sectors (50/50). Within each, Zone/Rest (50/50). Prior = 0.25 each. Message: "If North, then 4/5 Zone."
      *   **Requirements:** Runnable session, rules, materials (slips, tokens), scoring scheme (proper scoring rule, pre-calculated tables), minute-by-minute timeline, board work, debrief (mapping activity to theory, table of update rules), troubleshooting (predictable errors), limitations.
      *   **Specific Add-ons:** Second round (different phrasing/converse), emphasize coherence of disagreement.

  2.  **Deconstruct the Epistemological Problem:**
      *   **Prior:** $P(N) = 0.5$, $P(S) = 0.5$. $P(Z|N) = 0.5$, $P(Z|S) = 0.5$. (Where $Z$ = Zone, $R$ = Rest).
      *   **Evidence:** $P_{new}(Z|N) = 0.8$.
      *   **Constraint:** This constrains the ratio $P_{new}(Z \cap N) / P_{new}(N) = 0.8$.
      *   **Degrees of Freedom:** We have 4 cells: $N \cap Z, N \cap R, S \cap Z, S \cap R$. Sum = 1. Constraint: $(N \cap Z) = 0.8 \times N$.
      *   **Missing Info:** What happens to $P(N)$? Does it stay 0.5? Does it shift because $N$ is now "more specific"? What happens to $S$?
      *   **Common Strategies:**
          1.  *Hold P(N) fixed:* $P_{new}(N) = 0.5$. Then $P_{new}(N \cap Z) = 0.4, P_{new}(N \cap R) = 0.1$. Distribute remaining 0.5 to South however (usually keep prior ratios).
          2.  *Condition on Material Conditional:* Treat evidence as $\neg N \lor (N \cap Z)$. This is equivalent to $\neg (N \cap R)$. So $P_{new}(N \cap R) = 0$. (Wait, the prompt says "probably", not certainty. So conditioning on material conditional is tricky with probabilistic evidence. Usually, students treat "If A then prob B" as "The probability of the material conditional is 0.8" OR they treat it as a constraint on conditional probability. The prompt specifically mentions students conditioning on the material conditional *as if 'if...then' were just a disjunction*. I need to make sure the activity distinguishes these.)
          3.  *Minimum Information/Entropy:* Minimize distance from prior subject to constraint.
          4.  *Jeffrey Conditioning:* If we view the evidence as changing the partition $\{N \cap Z, N \cap R\}$ but leaving $S$ alone?
      *   **Key Insight for Activity:** The constraint $P(Z|N) = 0.8$ does not fix $P(N)$. $P(N)$ can range from nearly 0 to 1 (provided $P(Z|N)$ holds). Wait, if $P(Z|N)=0.8$, then $P(N \cap Z) = 0.8 P(N)$. Since $P(N \cap Z) + P(N \cap R) = P(N)$, and $P(N \cap Z) + P(N \cap R) + P(S) = 1$.
      *   Actually, $P(N)$ is completely free *unless* we add a constraint like "The evidence gives no info about N vs S". But the evidence *is* about N. Does learning something about the internal structure of N change the probability of N?
      *   *The Trap:* Students often assume $P(N)$ stays 0.5. Others assume the "weight" of the North sector changes.
      *   *The Scoring:* Need a proper scoring rule (Brier Score is easiest to calculate). I need a lookup table so the TA doesn't do math live.

  3.  **Drafting the Session Structure:**
      *   **Phase 1: Setup & Prior.** Establish the grid. 4 cells. Priors = 0.25 each.
      *   **Phase 2: The Message.** "If North, then 80% Zone."
      *   **Phase 3: Commitment.** Students write down their full distribution (or at least $P(N)$ and $P(Z|N)$).
      *   **Phase 4: The Reveal.** Compare numbers. See the spread.
      *   **Phase 5: Round 2 (Variation).** Change phrasing or add converse. Let's try the "Material Conditional" phrasing vs "Conditional Probability" phrasing. Or better: Round 2 is "The probability of the statement 'If North then Zone' is 0.8" (Adams' thesis vs Material). Actually, to keep it simple and focused on underdetermination: Round 2 should be a *different constraint* that highlights the freedom. Let's stick to the prompt's suggestion: "claim about the conditional itself versus as a plain probability that some 'if...then' sentence is true".
      *   **Phase 6: Debrief.** Map to theory.

  4.  **Developing the Scoring Mechanism:**
      *   Truth will be revealed at the end? No, the point is there *is* no truth about the update rule.
      *   *Correction:* The scoring rule shouldn't be about being "right" (since there is no right answer). It should be about *coherence* or *commitment*.
      *   *Better Idea:* The "Truth" is determined by a die roll *after* they commit. But the die roll must respect the constraint.
      *   *Wait, critical constraint:* If I roll a die to determine the hiker's location, I must ensure the constraint $P(Z|N)=0.8$ is satisfied *in the long run* or just for that instance?
      *   *Refinement:* The scoring rule is for *calibration*. But the pedagogical point is that *different rules yield different numbers*.
      *   *Best Approach for "Feeling" Underdetermination:* Don't score against truth. Score against *consistency* or use a "Market" mechanism.
      *   *Actually, the prompt asks for a proper scoring rule.* "Honestly reporting your credences is the thing that pays." This implies there is a truth.
      *   *Solution:* I (the TA) act as the "World". I have a hidden distribution that satisfies the constraint. I pick one arbitrarily (e.g., the "Hold P(N) Fixed" distribution). I tell them *after* the activity that this was the "World" state for scoring purposes, but emphasize that *any* distribution satisfying the constraint was rational.
      *   *Wait, that undermines the lesson.* If I score them, they will think the winning number was the "correct" update.
      *   *Alternative:* The scoring is for the *prediction of the die roll*. I will generate the location using a specific rule (e.g., Minimum Distance). I don't tell them which rule. They submit credences. I score them. *Then* I reveal the rule I used and say "If I had used a different rule, different people would have won. The message didn't tell you which rule I used."
      *   *Simpler:* Use a Brier Score table. I pre-calculate scores for a range of inputs against a specific outcome. I pick the outcome *after* they submit, but constrained by the message.
      *   *Decision:* I will secretly choose a "True State" consistent with the message *after* they submit. I will use a lookup table to award points based on their probability assigned to the actual cell. To prevent "gaming", I will explain that the "True State" is drawn from a distribution *I* hold, which satisfies the constraint. The lesson is: You didn't know *my* distribution, and the message didn't specify it.

      *   *Revised Scoring for Pedagogical Goal:* The prompt wants them to see disagreement is coherent. Scoring might make them think one is wrong.
      *   *Compromise:* Use the scoring rule to incentivize honest reporting of their *actual* belief, not to find the "right" belief. I will reveal the "True Location" at the end. I will acknowledge that the "True Location" was generated by *one specific* update rule (which I picked arbitrarily), and that others were equally rational given the info.
      *   *Lookup Table:* Brier Score = $1 - (p - o)^2$ (scaled). Or Quadratic Scoring Rule: $S = 2p - p^2$ if true, $S = -p^2$ if false. Let's use a simple point table for 18 students.
      *   *Actually, let's keep it dead simple.* Tokens. If the hiker is in the cell they assigned $p$, they get $1 - (1-p)^2$ tokens? No, arithmetic is hard live.
      *   *Provided Solution:* I will provide a printed "Payout Table" based on the Quadratic Scoring Rule. They look up their $p$ for the *actual* cell.

  5.  **Refining the "Round 2":**
      *   Round 1: "If North, 80% Zone." (Conditional Probability constraint).
      *   Round 2: "The statement 'If North then Zone' is true with probability 80%." (Probability of Material Conditional).
      *   $P(\neg N \lor (N \cap Z)) = 0.8$.
      *   $1 - P(N \cap R) = 0.8 \Rightarrow P(N \cap R) = 0.2$.
      *   This fixes $P(N \cap R)$ but leaves $P(N \cap Z)$ and $S$ underdetermined.
      *   This is perfect. It forces a *different* underdetermination.
      *   Round 1 fixes ratio within N. Round 2 fixes absolute mass of $N \cap R$.

  6.  **Addressing the "Coherence" Point:**
      *   Need to explicitly show that no Dutch Book can be made between Student A (who thinks $P(N)=0.5$) and Student B (who thinks $P(N)=0.6$).
      *   Activity: Pair them up. Let them bet. Show that they don't *have* to bet against each other if they acknowledge the underdetermination. Or, simpler: In debrief, explain that since the evidence is compatible with multiple priors, differing posteriors aren't a contradiction.

  7.  **Materials & Logistics:**
      *   18 Students.
      *   Projector (taped).
      *   Handouts: Grid sheets, Submission slips, Payout Table.
      *   Tokens (candy or poker chips).
      *   Timer.

  8.  **Troubleshooting:**
      *   *Error:* Students treat 0.8 as $P(Z)$.
      *   *Fix:* Walk around, check sheets.
      *   *Error:* Students think there is one right answer.
      *   *Fix:* Debrief emphasis.
      *   *Limitation:* The activity can't prove *no* rule is best, just that *this* message doesn't pick one. I need to supply the "Adams' Thesis" vs "Material Conditional" theory in the debrief.

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Timeline:* 5 min Intro, 10 min Round 1, 10 min Reveal/Discussion, 10 min Round 2, 10 min Reveal/Discussion, 15 min Debrief/Theory. (Wait, 90 mins total. I have plenty of time.)
      *   *Expansion:* Use the extra time for the "Betting/Coherence" demonstration.
      *   *Board Work:* Need to draw the 4 cells clearly.
      *   *Scoring:* I need to generate a table for the Quadratic Scoring Rule so they can just look up their score. $Score = 100 \times (2p - p^2)$ if true, $100 \times (-p^2)$ if false. (Scaled to avoid decimals).

  10. **Final Polish:**
      *   Ensure the "Seed" scenario is used exactly as requested.
      *   Make sure the "Underdetermination" is the climax.
      *   Check the math on the update rules for the debrief table.
      *   *Rule 1 (Hold P(N)):* $P(N)=0.5, P(Z|N)=0.8 \rightarrow P(N \cap Z)=0.4, P(N \cap R)=0.1$. South stays 0.5 ($0.25/0.25$).
      *   *Rule 2 (Condition on Material Conditional):* Evidence $E = \neg(N \cap R)$. Wait, "Probably" makes this hard. If the message is "Prob(If N then Z) = 0.8", that's $P(\neg N \lor (N \cap Z)) = 0.8$. This implies $P(N \cap R) = 0.2$. Prior $P(N \cap R) = 0.25$. So we reduced probability of $N \cap R$. Where did it go? Proportional to others?
      *   *Rule 3 (Minimum Information/Entropy):* Minimize KL divergence subject to $P(Z|N)=0.8$. This usually preserves odds ratios of cells not involved in the constraint.
      *   *Rule 4 (Jeffrey on Partition):* If we view the evidence as changing the partition $\{N \cap Z, N \cap R\}$ to $\{0.4, 0.1\}$ relative to N?
      *   *Let's simplify the Debief Table:* Focus on $P(N)$.
          *   Strategy A: $P(N)$ stays 0.5.
          *   Strategy B: $P(N)$ increases (North is now "sharper"?).
          *   Strategy C: $P(N)$ decreases.
      *   *Actually, the most common clash:*
          1.  $P_{new}(N) = 0.5$ (Independence of sector and internal structure).
          2.  $P_{new}(N \cap R) = 0$ (Treating "probably" as certainty for simplicity, or conditioning on material conditional).
          3.  $P_{new}(Z) = 0.8$ (Confusing conditional with unconditional).
      *   *Okay, I will structure the debrief table around the specific constraint $P(Z|N)=0.8$.*
      *   Constraint: $x / (x+y) = 0.8$ where $x=P(N \cap Z), y=P(N \cap R)$.
      *   Free variable: $P(N) = x+y$.
      *   So $P(N)$ is the free variable.
      *   I need to show that $P(N)$ can be anything (within reason).

      *   *Wait, one more thing:* The prompt asks for "a scoring scheme... I don't want to have to do the arithmetic live, so give me a printed table".
      *   I will create a "Brier Score Lookup Table" for them.

      *   *Limitations:* The activity shows *pragmatic* underdetermination (we didn't agree). It doesn't prove *logical* underdetermination (that no logic forces a choice). I need to state that in the "What this can't do" section.

      *   *Let's write it.*

  **(Self-Correction during drafting):**
  *   *Critique:* Is 90 minutes enough for two rounds + debrief?
  *   *Adjustment:* Keep Round 2 very fast. Focus heavily on the Debrief.
  *   *Critique:* How to handle the "Projector held together with tape"?
  *   *Adjustment:* Minimize reliance on slides. Use Board + Handouts.
  *   *Critique:* Scoring. If I pick a "True State", students might think that state was the *only* rational one.
  *   *Adjustment:* I must explicitly state: "I am rolling the dice *now* to determine payout. I could have rolled differently. The payout determines who gets candy, not who was rational."
  *   *Better:* I will pre-determine the "World State" to be one specific coherent distribution (e.g., P(N)=0.5). I will reveal this *after* scoring. I will explain that this was my "Hidden Prior Policy", not a logical necessity.

  *   *Wait, the Prompt asks for:* "Two people can hold perfectly coherent, non-Dutch-bookable credences that differ."
  *   *Activity Add:* Have them pair up with someone who has a different $P(N)$. Ask: "Can you make a bet that guarantees profit?" If they say yes, ask them to write it down. Show that they can't *if* they acknowledge the underdetermination. (This is hard to run in 5 mins).
  *   *Alternative:* Just explain it in debrief. "If I bet against you, I am assuming your probability is *wrong*. But the evidence allows your probability. So I have no edge."

  *   *Final Plan Structure:*
      1.  Setup (10m)
      2.  Round 1: The Message (20m)
      3.  Round 2: The Rephrasing (15m)
      4.  Scoring & Payout (10m)
      5.  Debrief & Theory (35m)

      *   *Wait, 18 students.* Groups of 3? Or individual? Individual commitment is better for the "spread" effect.
      *   *Materials:* 4-cell grid sheets. Submission slips. Payout table.

      *   *Let's finalize the Update Rules for the Debrief Table.*
      *   Constraint: $P(Z|N) = 0.8$.
      *   Prior: $N=0.5, S=0.5$. $Z|N=0.5, Z|S=0.5$.
      *   Candidate 1: **Fixed Sector.** $P_{new}(N) = 0.5$. (Attractive: Evidence is about internal structure, not location. Fishy: Why wouldn't 'sharper' info change weight?)
      *   Candidate 2: **Fixed Zone Mass.** $P_{new}(Z) = P_{old}(Z) = 0.5$. (Attractive: Total probability of Zone shouldn't change. Fishy: Arbitrary.)
      *   Candidate 3: **Material Conditional.** $P(\neg N \lor Z) = 0.8$. (Attractive: Standard logic. Fishy: 'If' isn't material conditional.)
      *   Candidate 4: **Min-Info (KL).** (Attractive: Change as little as possible. Fishy: Requires math, yields P(N) > 0.5 usually).

      *   *Okay, ready to write.*
answer: |-
  # Session Plan: The Underdetermined Drone
  **Unit:** Formal Epistemology (Year 2)  
  **Time:** 90 Minutes  
  **Students:** 18  
  **Goal:** Demonstrate that probabilistic conditional evidence ($P(B|A)=x$) underdetermines posterior credences, allowing for multiple coherent update rules.

  ---

  ## 1. Materials & Prep
  *   **Projector:** One slide with the 4-cell grid (keep it static to avoid tech issues).
  *   **Handout A (The Grid):** 18 copies. A 2x2 table: Rows = North/South, Cols = Zone/Rest.
  *   **Handout B (Submission Slip):** 18 copies. Fields for $P(N)$, $P(Z|N)$, $P(Z|S)$.
  *   **Handout C (Payout Table):** 18 copies. A lookup table for the scoring rule (see below).
  *   **Tokens:** ~100 poker chips or candies (for scoring).
  *   **Board:** Markers.

  ### The Scoring Rule (Quadratic/Brier)
  To avoid live arithmetic, students use **Handout C**.
  *   **Rule:** If the hiker is in the cell you assigned probability $p$, you score $100 \times (2p - p^2)$. If the hiker is *not* in that cell, you score $100 \times (-p^2)$.
  *   **Table:** Provide a column for $p$ (0.00 to 1.00 in steps of 0.05) and the corresponding "Points if True" and "Points if False".
  *   **Stakes:** 10 Points = 1 Token. Top 3 scores get a prize (or just bragging rights).

  ---

  ## 2. Minute-by-Minute Timeline

  ### Phase 1: Setup & Priors (00:00 – 00:10)
  *   **Board:** Draw the 2x2 grid. Label cells: $NZ, NR, SZ, SR$.
  *   **Script:** "You are the drone operator. Prior info: Hiker is 50/50 North/South. Within each sector, 50/50 Zone/Rest. Write these priors (0.25 each) on Handout A."
  *   **Check:** Walk around. Ensure everyone has 0.25 in all four cells. Sum must be 1.0.
  *   **Concept:** "This is your 'Book'. It is coherent. You are willing to bet at these odds."

  ### Phase 2: Round 1 – The Message (00:10 – 00:30)
  *   **Action:** Project/Write the message: **"If she is in the North, the chance she is in the Zone is 4 in 5."** ($P_{new}(Z|N) = 0.8$).
  *   **Task:** "Update your book. You must satisfy the message. Write your new probabilities on Handout A. Then, copy your new $P(North)$ onto Handout B (Submission Slip). Do not talk to neighbours."
  *   **Constraint:** Remind them: $P(Z|N)$ must be 0.8. That means $P(NZ) = 0.8 \times P(N)$.
  *   **Silence:** Enforce strict silence. This is a commitment phase.
  *   **Collection:** Collect Handout B. Do not look at them yet.

  ### Phase 3: The Reveal & Collision (00:30 – 00:45)
  *   **Board:** Draw a number line from $P(N)=0.0$ to $P(N)=1.0$.
  *   **Action:** Ask students to call out their $P(N)$. Mark them on the board with ticks.
  *   **Expected Spread:** You will see clusters at 0.5 (Hold Sector Fixed), maybe 0.6+ (Min-Info), and some errors at 0.8 (Confusing $P(Z|N)$ with $P(N)$).
  *   **Discussion:** "Look at the board. We all heard the same message. We are all coherent (sum to 1, constraint met). Why are we different?"
  *   **Key Question:** "Can anyone prove another person on this board is *irrational*? Can you Dutch Book them?" (Let them discuss in pairs for 2 mins).
  *   **Point:** "You can't. The message constrains the *ratio* inside North, but it says nothing about the *weight* of North vs South."

  ### Phase 4: Round 2 – The Rephrasing (00:45 – 01:00)
  *   **Action:** Return Handout A (blank side) or give new sheets. Reset Priors to 0.25 each.
  *   **Message:** "The statement 'If North, then Zone' is true with probability 0.8."
  *   **Explanation:** "This treats 'If...then' as a material conditional ($\neg N \lor Z$). So $P(\neg N \lor (N \cap Z)) = 0.8$."
  *   **Math Hint:** "This is equivalent to saying $P(N \cap Rest) = 0.2$."
  *   **Task:** Update your book. Submit new $P(N)$ on Handout B.
  *   **Reveal:** Plot these on a *new* number line below the first one.
  *   **Comparison:** "Did your number change? Did the spread change? Notice how the *type* of underdetermination shifted. Round 1 left $P(N)$ free. Round 2 fixes one cell ($NR$) but leaves the rest of the mass distribution free."

  ### Phase 5: Scoring & Payout (01:00 – 01:10)
  *   **The "World":** "I need to pay you. I will now generate the 'True Location'."
  *   **The Twist:** "I am not rolling a fair die. I am using *one* of the update rules you saw (e.g., Fixed Sector, $P(N)=0.5$). I will not tell you which one until after payout."
  *   **Action:** Generate the location (e.g., roll dice consistent with $P(N)=0.5, P(Z|N)=0.8$). Reveal the cell (e.g., "North Zone").
  *   **Calculation:** Students use **Handout C** to look up their score based on the probability *they* assigned to that specific cell.
  *   **Payout:** Distribute tokens.
  *   **Crucial Debrief Point:** "Did the winner win because they were *more rational*? No. They won because their arbitrary update rule matched my arbitrary 'World' rule. The message itself did not pick the winner."

  ### Phase 6: Formal Debrief (01:10 – 01:30)
  *   **Board Work:** Map the activity to the theory (see Debrief Guide below).
  *   **Takeaway:** "Conditional probability evidence is not a proposition you condition on. It is a constraint on your posterior function. Constraints leave degrees of freedom."

  ---

  ## 3. Debrief Guide & Theory Table

  ### Mapping Activity to Theory
  | Activity Moment | Epistemological Concept |
  | :--- | :--- |
  | **Writing different $P(N)$** | **Underdetermination:** The evidence $P(Z|N)=0.8$ is compatible with infinitely many posterior distributions. |
  | **Failed Dutch Book** | **Coherence:** Differing credences are not contradictory if the evidence permits multiple priors. |
  | **Round 1 vs Round 2** | **Semantics of 'If':** Probabilistic conditional ($P(B|A)$) vs. Probability of Material Conditional ($P(A \rightarrow B)$). |
  | **Scoring Payout** | **Pragmatics:** Practical success depends on the "true" generating process, which the message did not specify. |

  ### Candidate Update Rules (For the Board)
  *Write this table on the board during debrief. Fill in the $P(N)$ column based on your specific prior setup (0.5).*

  | Rule Name | How it works | Resulting $P(N)$ | Attractive | Fishy |
  | :--- | :--- | :--- | :--- | :--- |
  | **Fixed Sector** | Assume evidence about *internal* structure doesn't change sector weight. | **0.50** | Preserves prior independence. | Why wouldn't "sharper" info attract mass? |
  | **Min-Info (KL)** | Minimize distance from prior subject to constraint ($P(Z\|N)=0.8$). | **~0.57** | Mathematically "conservative". | Requires accepting KL divergence as rationality. |
  | **Fixed Zone Mass** | Keep total $P(Z)$ constant (0.5). Shift mass within N to match. | **0.625** | Preserves global frequency of Zones. | Arbitrary why Z is fixed, not S. |
  | **Material Cond.** | Treat message as $P(\neg N \lor Z) = 0.8$. | **Varies** | Matches classical logic truth conditions. | 'If' is rarely a material conditional in natural language. |
  | **The "Plug-in"** | Mistake $P(Z|N)$ for $P(Z)$ or $P(N)$. | **0.80** | (None) | **Incoherent** with priors. |

  ---

  ## 4. Troubleshooting & Limitations

  ### Predictable Errors (And How to Handle Them)
  1.  **The "0.8 is P(N)" Error:**
      *   *Sign:* Student writes $P(N)=0.8$.
      *   *Intervention:* "The message says 'If North...'. Does that tell you she *is* North, or just where she is *if* she is?"
      *   *Debrief:* Use this to distinguish $P(A)$ from $P(B|A)$.
  2.  **The "Sum to 1" Error:**
      *   *Sign:* Student adjusts $NZ$ to 0.4 but forgets to reduce $NR$, so $N > 0.5$ and $S=0.5$, Sum = 1.1.
      *   *Intervention:* "Check your book. Are you offering a Dutch Book against yourself?"
  3.  **The "There Must Be a Right Answer" Pushback:**
      *   *Sign:* Students ask "But which one should we have used?" during scoring.
      *   *Response:* "That is the question for the rest of the course. Today, the answer is 'The message didn't say.'"

  ### What This Activity Cannot Do
  *   **Prove Logical Underdetermination:** The activity shows *pragmatic* disagreement (we didn't agree). It doesn't logically prove no rule exists. You must supply the argument: "Since $P(N)$ cancels out in the calculation of $P(Z|N)$, the evidence is silent on $P(N)$."
  *   **Resolve the 'If' Debate:** It highlights the difference between Adams' Thesis ($P(A \rightarrow B) = P(B|A)$) and Material Conditional, but doesn't solve which is correct.
  *   **Simulate Real Stakes:** In real life, priors often come from causal models (e.g., "Hikers prefer Zones"). The activity uses flat priors to isolate the logic, which removes the "causal" clue students might rely on externally.

  ### TA Script for the "Coherence" Point
  > "Imagine Student A has $P(N)=0.5$ and Student B has $P(N)=0.6$. Both satisfy the message. If I offer A a bet on North at 0.55 odds, A accepts. B rejects. Have they contradicted each other? No. They have different *policies* for handling underdetermined evidence. As long as they don't violate probability axioms *given their policy*, they are immune to a Dutch Book. The disagreement is not incoherence; it is **indeterminacy**."

