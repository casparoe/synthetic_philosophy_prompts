  I've got two job offers in front of me and I keep flip-flopping between them depending on how I do the sums, which is annoying enough that I've started reading up on decision theory (my partner thinks I'm definately overthinking it). I've ended up on risk-weighted expected utility and I want to actually get the shape of it rather than just nod along. My understanding: you rank a lottery's outcomes from worst to best, and instead of weighting each outcome by its probability you weight the k-th worst outcome by r(p1 + ... + pk) − r(p1 + ... + p(k−1)), where r is any increasing function with r(0) = 0 and r(1) = 1 that stands for your attitude to risk; then you sum the same way as usual, with those weights standing in for the probabilities. Plain expected utility is the case where r is the straight line, and I'm calling someone risk-averse in the strong sense when their r sits above that line everywhere — so the best outcome of any lottery counts for less than it's probability, and they'd turn down a fair double-or-nothing bet at any wealth level.

  What I want you to build for me:

  First, a decision problem with exactly two options, both of them risky (I don't want the disagreement to be the boring kind where she just likes the certain thing), simple round numbers, where a risk-averse REU maximizer and an expected-utility maximizer with the same beliefs and the same utility function pick different options. Utility can just be linear in money if that keeps it clean. Show me the arithmetic on both sides so I can check it by hand, and tell me which feature of the two options is doing the work — would the disagreement survive if you swapped r for the straight line?

  Second, the mirror image, which is the bit I can't get straight in my head: same utility function, same beliefs, still risk-averse in the strong sense, but now I want the REU maximizer taking the gamble and the expected-utility maximizer taking the safe option. Build it if it can be built. If it can't, say so and show me exactly which piece of the setup forbids it, in a way I can verify myself rather than take on faith.

