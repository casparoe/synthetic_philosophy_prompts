  **1. The Disagreement (REU prefers Safe, EU prefers Risky)**

  Let utility be linear in money ($u(x) = x$). Let the risk function be $r(p) = \sqrt{p}$ (concave, sits above the diagonal).

  *   **Option A (Safer):** 50% chance of \$40, 50% chance of \$60.
  *   **Option B (Riskier):** 10% chance of \$0, 90% chance of \$60.

  **Expected Utility (EU) Calculation:**
  *   $EU(A) = 0.5(40) + 0.5(60) = 50$.
  *   $EU(B) = 0.1(0) + 0.9(60) = 54$.
  *   **EU picks B.**

  **Risk-Weighted EU (REU) Calculation:**
  Outcomes are ranked worst to best. Weight on $k$-th outcome is $r(\text{cum } p_k) - r(\text{cum } p_{k-1})$.
  *   **Option A:**
      *   Worst (\$40): Weight $= r(0.5) - r(0) = \sqrt{0.5} \approx 0.707$.
      *   Best (\$60): Weight $= r(1) - r(0.5) = 1 - 0.707 = 0.293$.
      *   $REU(A) = 40(0.707) + 60(0.293) = 28.28 + 17.58 = \mathbf{45.86}$.
  *   **Option B:**
      *   Worst (\$0): Weight $= r(0.1) - r(0) = \sqrt{0.1} \approx 0.316$.
      *   Best (\$60): Weight $= r(1) - r(0.1) = 1 - 0.316 = 0.684$.
      *   $REU(B) = 0(0.316) + 60(0.684) = \mathbf{41.04}$.
  *   **REU picks A.**

  **The Feature:** Option B has a worse worst-case outcome (\$0 vs \$40). Because $r$ is concave, REU up-weights the probability of the worst outcome more than EU does ($0.316$ vs $0.100$). This "downside protection" in A drives the disagreement. If you swap $r$ for the straight line ($r(p)=p$), the weights become the probabilities, REU collapses to EU, and the disagreement vanishes (both pick B).

  ***

  **2. The Mirror Image (REU prefers Risky, EU prefers Safe)**

  **Verdict:** This cannot be built under your "strong risk aversion" condition ($r$ sits above the line everywhere).

  **The Forbidden Piece:**
  To prefer the Gamble (G) when EU prefers the Safe option (S), the REU agent must value G's upside *more* than EU does (relative to the downside).
  *   EU prefers S means: $EU(S) > EU(G)$.
  *   For REU to reverse this, the weight on G's best outcome must exceed its probability.
  *   The weight on the best outcome (probability $p$) is $1 - r(1-p)$.
  *   To up-weight it: $1 - r(1-p) > p \implies r(1-p) < 1-p$.
  *   This requires $r$ to sit **below** the diagonal at that point.
  *   But your condition requires $r$ to sit **above** the diagonal everywhere.
  *   **Conclusion:** You cannot be "more risk-averse than EU" (globally concave $r$) and yet accept a gamble that EU rejects. If EU says the risk isn't worth the mean return, an agent who penalizes risk *more* heavily must also say no.

  ***

  **3. Weakening Risk Aversion**

  **Verdict:** The impossibility goes away.

  **The Setup:**
  Keep the requirement that you turn down fair 50/50 bets (local risk aversion), but drop the "everywhere above the line" condition.
  *   Turning down a fair 50/50 bet (outcomes $x \pm \epsilon$) requires $r(0.5) > 0.5$. (You up-weight the loss relative to EU).
  *   To accept a long-shot gamble that EU rejects (e.g., 1% chance of \$1000 vs \$50 certain), you need to up-weight the 1% best outcome. As shown above, this requires $r(0.99) < 0.99$.

  **The Shape of $r$:**
  The function must **cross the diagonal**.
  *   It sits **above** the line around $p=0.5$ (cautious about moderate risks/fair bets).
  *   It dips **below** the line near $p=1$ (hopeful about rare best outcomes).
  Visually, this is an inverse-S shape (concave then convex). This allows you to be "risk-averse" regarding standard fluctuations but "risk-seeking" regarding long shots, permitting the mirror-image preference reversal.
