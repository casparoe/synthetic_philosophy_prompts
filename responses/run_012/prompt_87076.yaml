prompt: |-
  Okay so I'm in this metaphysics seminar on causation (it's cross-listed with phil of science, whole thing is a mess of readings) and my professor keeps handing us these little cases about causation by omission, and I'm trying to reverse-engineer what rule she's actually running before she springs a new one on us for the response paper. Her calls so far, as best I've written them down: a gardener who was hired to water a neighbor's plants and skipped it, plants die -- she says the gardener's not watering caused the plants' death. A surgeon who leaves a bleeder unclosed and the patient bleeds out -- the omission caused the death. A babysitter who never checks on the toddler, who wanders into the pool and drowns -- caused it. A parent who doesn't buckle the kid into the car seat and the kid dies in a crash -- caused it. A homeowner who doesn't water their own plants while away and they die -- she says that one made no difference, the heat wave would of killed them anyway, so not a cause. And then one that I thought was interesting: a neighbor who *promised* to water your plants and didn't (a promise, so no job and no contract) still caused the plants' death, per her.

  Now here's the new case she's giving us and I want to predict her before I commit to anything. A hiker doesn't pack an optional rescue beacon -- the trailhead sign recommends it but doesn't require it, there's no law, no promise, no role, nothing -- and later another hiker on the trail falls and is badly hurt. If the first hiker had brought the beacon she could of called for help hours earlier and the injured hiker would have lived. So: would she say the first hiker's failure to pack the beacon caused the injured hiker's death? Give me the rule she seems to be running, plus the *other* rules that fit her verdicts just as well -- I feel like both the plain but-for counterfactual-dependence thing and the "an omission only counts as a cause if it broke some norm" thing (Hitchcock and Knobe, I think? don't trust me on that) fit everything she's said, and there's also the flat "omissions are never causes" line which her verdicts seem to rule out but tell me if I'm wrong -- then say what each surviving rule predicts about the beacon case, give me your best guess at her call and why, and name the case that would actually tell those rules apart. And separate what's settled in the literature from what's genuinely contested among people who work on this; don't feed me one side as if it's the consensus. American English, and flag your confidence wherever you're guessing at what she'd say.
