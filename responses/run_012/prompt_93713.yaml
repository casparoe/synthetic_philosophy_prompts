answer: |-
  ### The Scenario

  Consider an automated cloud cost optimizer for a high-traffic SaaS platform. **System A (The Guardrail)** is a rules engine that only shuts down instances explicitly tagged `shutdown-candidate` and never touches anything with active network connections; a static code audit proves it cannot kill a live service, but it requires manual tagging, leaving 40% of waste on the table. **System B (The Optimizer)** is a gradient-boosted model trained on six months of usage data to predict idle resources automatically; on historical evals, it identifies 30% more savings than System A with 99.5% precision. Three weeks after shipping System B, a specific microservice pattern (low CPU, persistent idle socket) appears that wasn't in the training data; System B kills the primary database replica during a traffic spike. The resulting outage costs 50x the annual savings. The evals looked great because they averaged over thousands of harmless correct predictions, but the deployment reality was non-ergodic: the harm from a single false positive did not average out against the benefits of true positives, and the production distribution shifted just enough to hit the model's blind spot.

  ### The Arguments

  **The Average-Case Engineer (System B):** "We're being held back by perfectionism. 99.5% precision is industry standard for this class of problem. System A requires manual tagging, which engineers hate and will circumvent, leading to shadow IT. System B saves us real money every single day. We can mitigate the risk with canaries and faster alerting. If we reject every model because it isn't formally verified, we stop shipping."

  **The Worst-Case Engineer (System A):** "You're optimizing for the wrong function. Your evals assume the cost of a false positive (killing prod) is comparable to a false negative (wasting money), but the ratio is actually 10,000:1. You're averaging over a distribution of 'normal days,' but the business survives on not having a 'catastrophic day.' System A's guarantee is embarrassing—it's dumb rules—but it bounds our liability. We can afford to leave money on the table; we can't afford to delete the database."

  ### The Engine of the Case

  The feature doing the work is **asymmetric loss combined with distributional shift**. The eval set is i.i.d. historical data where errors are cheap; the production environment includes novel states (the specific microservice pattern) where errors are existential. If you remove the asymmetry (e.g., if killing an instance only cost $1 instead of causing an outage), the average-case system wins easily. If you remove the distributional shift (e.g., if production was perfectly static), the model would eventually learn the edge case, and the average case would win there too. The tension exists because the environment is dynamic enough to generate new errors, but unforgiving enough that a single error matters more than a million successes.

  ### The Attack and Defense

  **Attack (from Average-Case):** "This is a threat modeling failure, not a modeling failure. You're assuming we can't detect and revert a bad kill fast enough. If we add a 5-minute delay before execution and monitor error rates, the worst-case bound becomes '5 minutes of latency,' not 'database deletion.' Your guarantee is just hard-coding our current ignorance of what's safe."

  **Defense (from Worst-Case):** "Detection latency is not zero, and cascade failures are faster than human response. Once the replica is dead, failover might trigger a split-brain scenario that isn't automatically recoverable. Your '5-minute delay' assumes the failure mode is isolated, but in distributed systems, bad state propagates. The guarantee isn't about ignorance; it's about removing the capability to enter the failure state entirely, regardless of how fast you watch."

  ### The Takeaway

  This isn't a story about bad evals; it's a story about **non-ergodicity**. Average-case reasoning works when losses are bounded and repeatable enough to smooth out over time. Worst-case reasoning is required when a single sample from the tail of the distribution can remove you from the game entirely, making the "average" over time irrelevant because there is no "long run" left to average over.
