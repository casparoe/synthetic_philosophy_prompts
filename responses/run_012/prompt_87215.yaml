answer: |-
  # The Moral Progress Decision Tree

  **Instructions for Use:**
  Follow the branches by asking the character the question at each node. Record their answer and proceed to the next indicated node. When you reach a leaf, you have identified the character's structural position on moral progress. Use the "Awkward Commitment" to generate conflict or internal tension for that character.

  **Note on Dimensions:** The nodes below map to your four dimensions: **Circumference** (Who counts), **Thickness** (Weight of obligation), **Permeability** (How entry happens/Reversibility), and **Asymmetry** (Who drives the change).

  ---

  ### NODE 1: The Ontology of Progress (Permeability/Asymmetry)
  **Question:** "When you look at the last hundred years, do you see humanity learning to be kinder, or just learning better excuses for what it wanted to do anyway?"

  *   **A. "It's mostly excuses. The 'progress' is a story we tell to feel superior."** → Go to **Node 2**.
  *   **B. "There is real learning. We are actually better than our ancestors."** → Go to **Node 3**.

  ---

  ### NODE 2: The Function of the Myth (Asymmetry)
  **Question:** "If this story of progress is a lie, whose benefit does it serve? Does it smooth over conquest, or does it hide the fact that we are just animals who can't help but favor our own?"

  *   **A. "It smooths over conquest. It makes Western values look universal when they are just local."**
      *   **LEAF 1: The Postcolonial Critic**
      *   *Awkward Commitment:* Must explain why their own critique isn't just another local value claiming universality.
  *   **B. "It hides the fact that power always wins. Morality is just the victory lap of the strong."**
      *   **LEAF 2: The Power-Skeptic**
      *   *Awkward Commitment:* Cannot consistently advocate for change without relying on the moral language they claim is fake.
  *   **C. "It hides biology. We are wired to love our kin and fear the stranger; nothing changes that."**
      *   **LEAF 3: The Hard Parochialist (Unnamed)**
      *   *Awkward Commitment:* Must treat their own family better than strangers not because it is 'right,' but because they cannot do otherwise.
  *   **[UNOCCUPIED SPACE]:** *A character who believes progress is a lie but that it serves the weak.* Diagnosed as incoherent; if it is a lie, it is typically a tool of hegemony, not liberation.

  ---

  ### NODE 3: The Geometry of Concern (Circumference)
  **Question:** "Is morality about drawing a line around who counts, or is it about mapping the connections between different kinds of beings?"

  *   **A. "It's about connections. A web, not a circle. Different nodes have different duties."**
      *   **LEAF 4: The Pluralist**
      *   *Awkward Commitment:* Cannot resolve conflicts between nodes (e.g., family vs. stranger) without arbitrarily picking a 'center.'
  *   **B. "It's about a line. We expand the circle to include more beings."** → Go to **Node 4**.

  ---

  ### NODE 4: The Trajectory of Time (Permeability)
  **Question:** "If a future generation returns to torture and slavery, has humanity lost its moral standing, or was that progress just a season in a longer winter?"

  *   **A. "It's a spiral. We expand and contract. Progress can be lost and must be re-earned."**
      *   **LEAF 5: The Tragic Realist**
      *   *Awkward Commitment:* Lives in constant anxiety that their own children will undo the work of their life.
  *   **B. "It's cumulative. Once we learn something, we know it. We might stumble, but the direction is up."** → Go to **Node 5**.

  ---

  ### NODE 5: The Engine of Expansion (Asymmetry)
  **Question:** "Why does the circle expand? Does it happen because it is the right thing to do, or because it eventually serves the interests of those already inside?"

  *   **A. "It serves interests. We include others when excluding them becomes too costly or dangerous."** → Go to **Node 6**.
  *   **B. "It is right. Reason or empathy forces us to include others even when it costs us."** → Go to **Node 7**.

  ---

  ### NODE 6: The Boundary of Utility (Circumference)
  **Question:** "If we could build machines that feel pain, or if we realized animals suffer like us, would we include them because it helps us, or because they count?"

  *   **A. "If it helps us stabilize society or reduces our guilt, yes. We include them instrumentally."**
      *   **LEAF 6: The Techno-Pragmatist (Unnamed)**
      *   *Awkward Commitment:* Must accept that if excluding a group became profitable again, morality would demand their exclusion.
  *   **B. "No, the circle is for humans. Animals and machines are resources."**
      *   **LEAF 7: The Pragmatic Inclusionist**
      *   *Awkward Commitment:* Must argue that human suffering matters more than animal suffering solely based on species membership, not capacity.
  *   **[UNOCCUPIED SPACE]:** *A character who believes expansion is purely instrumental but argues for including AI.* Diagnosed as unexplored; usually, instrumentalists focus on human labor markets, not machine rights.

  ---

  ### NODE 7: The Thickness of Obligation (Thickness)
  **Question:** "Consider a character who gives generously to international famine relief but opposes a refugee resettlement in her own town. Is she a hypocrite?"

  *   **A. "Yes. If they count, they count. Distance doesn't change the math."** → Go to **Node 8**.
  *   **B. "No. We are allowed to prioritize our neighbors. The circle is thick at the center, thin at the edges."**
      *   **LEAF 8: The Graded Universalist**
      *   *Awkward Commitment:* Must define exactly where the 'edge' is where obligation becomes zero, which is always arbitrary.
  *   **[INDISTINGUISHABLE LEAVES]:** *If a character answers "Yes" but also believes in special duties to family, they collapse into the Graded Universalist.* This tree cannot separate a strict Utilitarian from a Humanist who prioritizes urgency over proximity; both land at Leaf 9.

  ---

  ### NODE 8: The Limit of Sentience (Circumference)
  **Question:** "Does the circle stop at the human being, or does it extend to anything that can suffer or think?"

  *   **A. "It stops at humans. We have a specific duty to our own kind."**
      *   **LEAF 9: The Optimistic Expansionist**
      *   *Awkward Commitment:* Must explain why 'humanity' is the magic boundary if race, gender, and nation were not.
  *   **B. "It extends to all sentient beings. A character campaigns against factory farming but supports capital punishment."**
      *   **LEAF 10: The Sentiocentric**
      *   *Awkward Commitment:* Must value the life of a pig over the life of a violent criminal, which alienates human allies.
  *   **C. "It extends to artificial minds. This extension is continuous with earlier ones."**
      *   **LEAF 11: The Continuity Futurist (Unnamed)**
      *   *Awkward Commitment:* Must grant rights to a server cluster before granting them to a biological human who lacks rationality.
  *   **[UNOCCUPIED SPACE]:** *A character who extends the circle to ecosystems but not animals.* Diagnosed as incoherent; usually, reverence for life includes the creatures within the system.

  ---

  ### Summary of Positions for the Novelist

  1.  **Postcolonial Critic:** Progress is an imperial narrative.
  2.  **Power-Skeptic:** Progress is an ideological mask for power.
  3.  **Hard Parochialist:** Progress is an illusion; biology is destiny.
  4.  **Pluralist:** Morality is a web, not a circle.
  5.  **Tragic Realist:** Progress is real but reversible (a spiral).
  6.  **Techno-Pragmatist:** Inclusion is driven by utility (includes AI).
  7.  **Pragmatic Inclusionist:** Inclusion is driven by utility (humans only).
  8.  **Graded Universalist:** Obligations thin with distance (Charity OK, Refugees No).
  9.  **Optimistic Expansionist:** Obligations are universal and cumulative.
  10. **Sentiocentric:** The circle includes all suffering beings.
  11. **Continuity Futurist:** The circle includes artificial minds.

  **Diagnostic Note:** If two characters land on the same leaf, distinguish them by **tone** rather than logic. One Optimistic Expansionist may be joyful and naive; another may be grim and dutiful. The tree classifies their *structure of belief*, not their *temperament*.
