answer: |-
  The argument you describe from board games is a classic in combinatorial game theory, known as the **Strategy Stealing Argument**. It is most famously applied to the game of *Hex*, where it proves that the first player must have a winning strategy (or at least a non-losing one), though it provides no clue as to what that strategy is.

  The hidden premise you are hunting does not have a single universal name across all disciplines, but it is recognized under different labels in game theory, economics, and decision theory.

  Here is the breakdown of the premise, its failures, and a proposed unified terminology to capture the boundary you are seeking.

  ### 1. The Game-Theoretic Case
  **The Argument:** The Strategy Stealing Argument.
  **The Hidden Premise:** **Move Monotonicity** (or the **Absence of Zugzwang**).

  In combinatorial games, the argument relies on the assumption that having an extra piece on the board, or having the right to move one extra time, is never a disadvantage. In technical terms, the value of a game state is *monotonic* with respect to the number of pieces you control.

  *   **When it holds:** In games like *Hex*, *Gomoku*, or *Tic-Tac-Toe*. Your pieces only occupy space; they do not hinder your own movement, and you are never forced to move into a worse position.
  *   **When it fails:** In games featuring **Zugzwang** (German for "compulsion to move"). In chess endgames, for example, the obligation to move can turn a drawn position into a loss. Here, the "extra move" is not a resource; it is a liability. The Strategy Stealing Argument collapses because you cannot simply "adopt" the opponent's strategy; the extra move you made at the start might force you to break your own formation later.

  ### 2. The Strategic Case
  **The Argument:** The Assumption of Flexible Advantage.
  **The Hidden Premise:** **Non-Negative Option Value** (or **Free Disposal**).

  In economics and decision theory, the assumption is that having a larger set of available actions (a larger "opportunity set") cannot yield a lower expected utility than a subset of those actions. This is often formalized as the principle of **Free Disposal**: the ability to discard excess resources or ignore available options at zero cost.

  *   **When it holds:** In decisions against "nature" or passive environments. If you have a ticket to a concert and the option to not go, you are never worse off than someone who doesn't have the ticket. You can simply dispose of the option.
  *   **When it fails:** In strategic interactions involving **Signaling** and **Commitment**. This is the domain of Thomas Schelling's *The Strategy of Conflict*.
      *   **Signaling:** If an adversary knows you have a nuclear option, they may pre-emptively strike. Your option provoked them.
      *   **Commitment:** If you have the option to retreat, your threat to advance is not credible. You are *better off* if you burn the bridge behind you, removing the option to retreat.
      *   **Temptation:** As you noted, having an option may make it psychologically or politically impossible to resist using it, leading to a worse outcome than if the option never existed.

  ### 3. Are They the Same Phenomenon?
  Yes, structurally. No, causally.

  **Structurally**, they are identical. Both rely on a value function $V$ that maps a set of available actions $A$ to an outcome. The premise assumes that if $A \subset B$, then $V(B) \ge V(A)$. This is **Monotonicity**.
  *   In the game case, the failure is **internal**: the mechanics of the system mean action $x$ physically interferes with action $y$.
  *   In the strategic case, the failure is **external**: the *knowledge* that $x$ is available changes the behavior of other agents, which feeds back to lower your value.

  **Causally**, they differ. The game failure is a matter of *physics/rules* (collision, obligation). The strategic failure is a matter of *information/belief* (credibility, expectation).

  ### 4. Proposed Terminology and The Boundary
  Since there is no single settled term that covers both the board-game mechanics and the strategic psychology, I propose the following terminology to define the boundary you are looking for.

  **The Premise:** **The Monotonicity of Agency**
  *Definition:* The assumption that expanding an agent's set of available actions (or resources) cannot decrease the maximum achievable utility, assuming rational play.
  *Equivalent Economic Term:* **Free Disposal** (the ability to ignore the extra option without penalty).

  **The Failure:** **Negative Optionality**
  *Definition:* A state in which the existence or availability of an additional action reduces the agent's expected outcome.
  *   *Type I (Mechanical):* **Zugzwang.** The action consumes a necessary resource (like a turn) or creates physical interference.
  *   *Type II (Informational):* **Strategic Vulnerability.** The availability of the action alters the opponent's beliefs or incentives to the agent's detriment.

  **The Boundary Condition:**
  To determine in advance whether the *Monotonicity of Agency* holds, you must test for two variables: **Interference** and **Transparency**.

  1.  **Interference (Internal):** Do the actions in the set interact with each other?
      *   *Test:* Can I take the extra move/piece and effectively "pass" or neutralize it?
      *   *If No:* Monotonicity fails (Zugzwang).
  2.  **Transparency (External):** Is the availability of the action observable by other agents?
      *   *Test:* If I have the option but promise not to use it, will the other side believe me?
      *   *If No:* Monotonicity fails (Signaling/Commitment problems).

  ### Summary
  The argument you encounter is the **Strategy Stealing Argument**.
  The hidden premise is the **Monotonicity of Agency** (or **Free Disposal**).
  The family of cases where it fails is defined by **Negative Optionality**, manifesting as **Zugzwang** in closed systems and **Strategic Vulnerability** in open systems.

  The boundary is drawn at **Interference** and **Transparency**. If your extra move blocks your own pieces, or if your extra option signals a threat to your opponent, the premise is false, and the argument is unsound.
