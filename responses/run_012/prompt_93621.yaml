answer: |-
  **Straight answer**
  There is no single established term that perfectly captures this specific configuration of shared knowledge and unenforced drift. The closest existing concept is "institutional decoupling," but that typically implies a deliberate separation for external legitimacy rather than an internal, quiet reversion.

  **The nearest things, and how each one misses**
  *   **Institutional Decoupling:** This captures the gap between formal policy (four-day week) and actual practice (five-day norm). It misses because decoupling is usually strategic hypocrisy for external legitimacy, whereas your studio's drift is internal and lacks a villainous intent.
  *   **Signaling Theory:** This explains why workers show up (to convey commitment) and why managers look (to gauge reliability). It misses because signaling implies intentional transmission of private information, whereas here the workers are just existing and the managers know the signal is noise.
  *   **Pluralistic Ignorance:** This describes a norm sustained because everyone mistakenly believes others endorse it. It misses because you explicitly stated nobody is confused; everyone privately agrees the norm is bogus, yet follows it anyway.
  *   **Goodhart's Law:** This predicts that once a measure becomes a target, it ceases to be a good measure. It misses because presence was never an official target; it emerged as a heuristic without ever being declared a goal.
  *   **Presenteeism:** This names the behavior of being present beyond what is required. It misses because presenteeism is usually framed as an individual pathology or coercion, not a systemic evaluation failure accepted by all parties.
  *   **Principal-Agent Problem:** This frames the conflict between owners (principals) and workers (agents) regarding effort. It misses because the principals are the ones driving the distortion, not the agents shirking or manipulating the metric.

  **The carving**
  This pattern occurs when a chain of evaluators collectively substitutes a low-cost visible proxy for a high-cost actual goal, despite shared knowledge that the proxy is flawed. It is not enforced by rule but by the accumulation of individual cognitive shortcuts: each evaluator chooses the path of least resistance to assess performance, knowing the metric is imperfect but trusting it enough to avoid the risk of deeper inspection. Essential features include the universal private acknowledgment that the proxy is inadequate, the absence of explicit coercion, and the recursive structure where every evaluator is also being evaluated by the same heuristic upstream. Incidental features include the specific proxy used, such as time or presence, and the industry context. The norm survives only if the top of the chain continues to read the signal; if the ultimate evaluator switches to measuring the actual goal, the proxy loses its power immediately, as there is no ideological commitment holding it in place. It is a structural laziness institutionalized through mutual accommodation rather than command.

  **Boundary cases**
  *   A remote team where promotion goes to those with the most Slack activity, even though everyone admits chat logs don't measure code quality. (Verdict: Fits; same proxy substitution).
  *   A professor who grades on class participation because they genuinely believe talking aloud correlates with understanding. (Verdict: Rule out; the evaluator believes the proxy is valid).
  *   A factory where safety protocols are openly ignored to meet production quotas, with management acknowledging the trade-off. (Verdict: Rule out; there is no shared pretense, just an open prioritization).

  **Name, if nothing fits**
  **Heuristic Capture** — When a low-cost evaluation proxy supplants a stated high-cost goal despite shared knowledge of its inadequacy. This name must not be taken to imply malicious intent or active deception by the evaluators.

  **Where my description is probably wrong**
  You assume the owners truly do not believe presence matters, but they may hold a subconscious bias they haven't examined despite their conscious statements. You also assume output was truly flat, but you may be suffering from survivorship bias by only tracking projects that didn't fail during the transition. Finally, you assume there is no villain, but the owners may be quietly saving on overhead costs (utilities, support) while maintaining the reputation of a progressive studio.
