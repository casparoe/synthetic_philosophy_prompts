answer: |-
  Your instincts are excellent. The blog post gets the history and the counterexamples roughly right but botches the metaphysical diagnosis and the proposed solution. The claim that finks and masks are the "same trick" is the weakest link; they target different parts of the metaphysical structure (the property itself vs. the manifestation process). The claim that a simple "escape clause" fixes everything is also dangerously optimistic; that repair faces serious circularity objections that keep the debate live. Consequently, the leap to categoricalism is not forced; many philosophers now accept dispositions as fundamental, irreducible properties rather than reducing them to categoricals.

  Regarding your friend's bank case: he is right that it breaks the simple conditional analysis, but wrong that the fink/mask distinction is merely verbal. The distinction tracks whether the intrinsic base property survives the stimulus. In his case, the bank's assets (the base) remain intact during the run, so it is a mask, even if the mask is triggered by the stimulus. The timing of the trigger (during vs. before) matters for classification, but the persistence of the base is what determines whether it's a fink or a mask.

  | Claim | Verdict | What's actually going on | Does the post's argument need this claim? |
  | :--- | :--- | :--- | :--- |
  | **SCA was the standard view** | sound | Historically accurate; mid-20th century empiricism favored reducing dispositions to conditionals. | yes; establishes the target being attacked. |
  | **Finks and Masks killed SCA** | sound | These counterexamples successfully showed the conditional can be false while the disposition is true (and vice versa). | yes; provides the motivation for abandoning the simple view. |
  | **Finks/Masks are same trick** | wrong | Finks remove the disposition upon stimulus; Masks keep the disposition but block the outcome. They are ontologically distinct. | yes; the post uses this to simplify the narrative, but it misrepresents the metaphysics. |
  | **Escape clause fixes it** | oversimplified | Adding "no interferers" faces circularity objections (defining interferers often requires the disposition itself). | yes; the post needs this to claim the analysis is "back in business" before pivoting. |
  | **Dispositions are categorical** | contested | Failure of conditional analysis doesn't prove categoricalism; dispositional essentialism is a major competing view. | yes; this is the post's final conclusion, but it relies on the false dichotomy that only categoricals remain. |

