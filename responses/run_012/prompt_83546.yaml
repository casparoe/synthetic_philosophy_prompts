prompt: |-
  ok, I have to write up my view on content for a seminar and I want a consistency check first, because I can feel that somethings off and I can't find it. Here's the package:

  (1) Externalism: what my "water" thoughts are about is fixed by my environment, not by anything I could settle from the armchair.

  (2) No narrow content. Every content is wide. Me and my Twin Earth duplicate share no belief contents at all -- there's no level at which our mental lives are "the same on the inside."

  (3) First-person authority: I can know the content of my own occurrent thoughts just by reflecting, without checking on the world.

  (4) Slow-switch verdict: if I got swapped onto Twin Earth in my sleep and my word "water" quietly came to mean the local stuff, nothing would feel different and I'd have no memory of the switch -- and if I then said "my beliefs about water haven't changed," I'd be wrong. My beliefs changed even though nothing in my head did.

  (5) Deference: I could learn "lupus" from people around me who use it for any stubborn rash, use it that way myself, and if a doctor asked what I mean by it, the right answer is "whatever they mean by it" -- even though I'm wrong about lupus.

  Which of these actually pull against each other, and how badly? Rank the tensions by severity; for each, say what would have to give; and if a pair only looks like a tension, say why it dissolves. Don't hedge, and don't tell me it all hangs together unless it really does. End with the single cheapest revision and what it costs me. Under 550 words.
