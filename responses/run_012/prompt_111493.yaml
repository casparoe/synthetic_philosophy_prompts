answer: |-
  Dear Colleague,

  I am writing to you because the hiring committee I now chair has forced me to confront a mathematical unease that I suspect you have encountered in your own work on collective decision-making. We are nine faculty members tasked with deciding whether a candidate is qualified, a binary question with a fact of the matter, and we vote by simple majority. The setting is entirely ordinary: we all review the same dossier, including a single glowing reference letter that carries significant weight, and we each conduct a private interview before casting a sincere vote. We are all competent colleagues, each more likely to be right than wrong when assessing the candidate, and we share a genuine interest in selecting the best person. Yet I have come to suspect that our procedure leaves us less reliable than any of us would be alone, and I would like to walk you through the arithmetic of how this occurs, violating the spirit of the Condorcet jury theorem while adhering to its letter save for one critical assumption.

  To construct the case, we must look closely at the structure of our information. Suppose that in forty percent of hiring cycles, the shared reference letter is misleading, perhaps because the writer is overly generous or fundamentally misunderstands the role, while in the remaining sixty percent it is accurate. When the letter is accurate, our private interviews confirm the truth with high probability, say ninety percent, making us individually very reliable in this state. However, when the letter is misleading, its authority is such that it sways our judgment significantly; in these cases, our individual competence drops to thirty percent, as we tend to trust the letter over our own conflicting interview impressions. Unconditionally, each of us is still more likely right than wrong, with a competence of sixty-six percent, calculated as the weighted average of zero-point-six times zero-point-nine plus zero-point-four times zero-point-three. However, the majority competence tells a different story. In the sixty percent of cases where the letter is accurate, the majority of nine will almost certainly be correct, effectively one hundred percent reliability. But in the forty percent of cases where the letter is misleading, the majority will almost certainly be wrong, because our errors are correlated by that shared signal; specifically, with individual competence at thirty percent in this state, the probability that five or more of us overcome the misleading letter is only about five percent. Consequently, the committee's overall reliability is zero-point-six times one plus zero-point-four times zero-point-zero-five, which equals sixty-two percent. This is lower than the individual competence of sixty-six percent, meaning the group is less reliable than a single member acting alone.

  If we were to replace that shared letter with nine independent private items of evidence of comparable diagnostic strength, restoring the independence assumption, the picture changes dramatically. In that counterfactual, every decider would maintain the unconditional competence of sixty-six percent independently. The probability that a majority of nine voters, each with sixty-six percent competence, votes correctly is approximately eighty-five percent. This comparison isolates the cost of the correlation: the shared evidence drags the majority competence down from eighty-five percent to sixty-two percent, and specifically below the individual threshold. The quantity that governs whether this inversion happens is the probability of the shared error state relative to the loss in majority precision within that state; specifically, the weighted loss in the correlated error state must exceed the weighted gain in the independent correct state. For the majority to fall below the individual, the shared evidence must be misleading frequently enough, and damaging enough, to outweigh the usual amplification of accuracy that majority rule provides in the good states.

  A defender of the Condorcet theorem would rightly reply that the theorem explicitly assumes independent votes, and that by introducing a common signal that correlates our errors, I have simply stepped outside the theorem's domain of validity. They would argue that the theorem is not wrong, but that my committee is not a jury of independent deciders; we are a jury of deciders conditioned on a common variable. The theorem guarantees convergence to the truth only if the errors are independent, and here the correlation coefficient is high enough to prevent convergence, locking the group into the reliability of the shared signal rather than the aggregate of private information.

  Considering the standard cures for collective error, we find mixed results. Enlarging the panel, paradoxically, makes matters worse in this specific construction. As the number of deciders grows, the majority competence in the accurate state converges to one, but in the misleading state it converges to zero. The committee's overall reliability would thus converge to the probability that the shared letter is accurate, which is sixty percent, dropping further below the individual competence of sixty-six percent. Raising each decider's individual accuracy, however, repairs the case, provided it lifts the conditional competence in the misleading state above fifty percent. If our private interviews were strong enough to make us individually better than a coin flip even when the letter is wrong, the majority rule would once again amplify correctness in both states, restoring the group's superiority. Letting the panel deliberate before voting is the most complex cure; if deliberation allows us to pool our private interview impressions, it effectively converts private information into common information. If we successfully aggregate all private signals, we all end up with the same total information set, causing us to vote identically. This collapses the majority competence to equal the individual competence of the deliberated group, repairing the deficit where the group was worse than the individual, but at the cost of eliminating the usual majority bonus where the group is better.

  Ultimately, the single feature of this construction that, if altered, would restore the usual convergence is the independence of the errors. If the shared evidence were removed or its weight reduced such that our votes became conditionally independent given the truth, the law of large numbers would reclaim its power and the majority would converge on certainty. In my own reasoning, I would most expect an error to be hiding in the assumption of how heavily the deciders weight the shared evidence. I have assumed that the misleading letter drives individual competence below fifty percent in that state, which implies a rational but perhaps excessive deference to common information. If the deciders were more skeptical of the shared item, maintaining conditional competence above fifty percent even when it is misleading, the majority would remain superior to the individual, and the paradox would dissolve. I remain concerned, however, that in our actual practice, that deference is real, and that our vote counts for less than we hope.

  Yours sincerely,

  The Chair
