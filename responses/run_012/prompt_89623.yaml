      *   **The Trap:** The distinction between *Orwellian* (memory revision after the fact) and *Stalinesque* (perceptual revision before consciousness) is untenable because there's no fact of the matter about *when* consciousness occurred to distinguish them.
      *   **Key Phenomenon:** The Color Phi Phenomenon is the classic example Dennett uses. Two spots flash (e.g., red then green) with apparent motion. Subjects report seeing the color change *mid-path*. But the second stimulus determines the color of the first part of the experience. This implies the "experience" of the first spot wasn't finalized until after the second spot arrived.
