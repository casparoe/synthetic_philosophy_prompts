  Your verdicts are not a muddle; they are a precise map of the boundaries between three distinct phenomena that are often conflated: **Information Cascades**, **Reputational Cascades**, and **Congestion Externalities**.

  To capture your pattern, I propose the **Principle of Structured Epistemic Inference**. It states that it is rational to follow the crowd *if and only if* three conditions are met. If any condition fails, the herding is either a different kind of rationality (instrumental) or irrational (epistemic error).

  ### The Principle

  **Clause 1: The Epistemic Condition**
  The agent's primary goal must be to align their action with an underlying state of truth or quality, not to align with the actions of others for external reward.
  *   **Forcing Case:** **The Manager (Case 4).** You call this rational but *not* a cascade. This forces the clause because the manager ignores his private signal not because he thinks the CEO knows better (epistemic), but because his bonus depends on agreement (instrumental). This clause separates Information Cascades (Cases 1, 2, 3) from Reputational Cascades (Cases 4, 5).

  **Clause 2: The Independence Condition**
  The agent must have reason to believe that the predecessors' actions were generated by conditionally independent private signals, not by copying their own predecessors.
  *   **Forcing Case:** **The Reverse Committee (Case 8).** You state it is rational to discount agreement if predecessors were copying. This forces the clause because it establishes that the *informational value* of a crowd depends on the *structure* of their decision-making, not just the headcount. This clause saves the **Committee (Case 3)** (where order is fixed and independence assumed) while condemning the **Researcher (Case 7)**. The researcher acts irrationally because "everyone else has" implies an amorphous consensus where independence is unknown or likely violated (others abandoned *because* others abandoned), rendering the public signal noise.

  **Clause 3: The Non-Rivalry Condition**
  The value of the action chosen must not be materially degraded by the number of people choosing it.
  *   **Forcing Case:** **The Fire Stampede (Case 6).** You call this irrational, unlike the Restaurant. This forces the clause because in the Restaurant, crowding signals quality without necessarily ruining the meal (non-rivalrous up to a point). In the Fire, crowding physically blocks the exit (rivalrous). Following the crowd changes the physical payoff of the action, making blind herding a fatal error.

  ### Verdicts to Reconcile or Drop

  This principle saves all your verdicts, but it requires clarifying one suspicion you hold.

  **The Restaurant (Case 1):** You suspected this was a "different kind of rational." The principle confirms this. In the Venture (Case 2) and Committee (Case 3), the agent has a private signal that is *overridden* by public information (a true cascade). In the Restaurant, the agent has *no* private signal. This is not a cascade but a **Rational Heuristic**. It fits under the Epistemic Condition, but it lacks the signal-conflict that defines the fragility you noted in your second puzzle. You need not drop this verdict, but you should reclassify it: it is rational inference, but not technically a cascade.

  **The Researcher (Case 7):** This is the most precarious verdict. Under standard Bayesian models, if the researcher believes the field is rational, following them is rational. Your verdict that this is *irrational* forces the **Independence Condition** to be strict: the researcher is irrational because she fails to interrogate *why* the field abandoned the line. If she assumes they acted on independent evidence when they likely cascaded, she commits an epistemic error.

  ### Prediction: A New Case

  **The Case:** **The GPS Traffic Route.**
  A driver uses a navigation app that routes her onto a specific side street because it is currently the "fastest." She sees hundreds of other cars being routed the same way. She knows the side street has narrow capacity. She follows the app.

  **Prediction:** **Irrational.**
  **Why:** This violates the **Non-Rivalry Condition**. Unlike the Restaurant (where quality is fixed), the road's speed is a function of volume. By following the crowd (or the algorithm optimizing for the crowd), she contributes to the congestion that negates the benefit. Your principle predicts that when agents know their action contributes to a negative externality (congestion), following the crowd is irrational, even if the "signal" (the app's data) suggests it is optimal. This mirrors your Fire verdict, distinct from your Venture verdict.

  ### Addressing Your Puzzles

  **1. Mechanism vs. Outcome**
  Your verdicts track the **Mechanism (Inference)**, not the Outcome (Conformity).
  *   In the **Manager** and **Voter** cases, the outcome is conformity, but the mechanism is *incentive alignment*. You resist calling these cascades because the mechanism is missing.
  *   In the **Fire** case, the outcome is conformity, but the mechanism is *panic/physical constraint*. You call this irrational because the inference (crowd = safety) is overridden by the physical reality (crowd = blockage).
  *   In the **Venture** and **Committee**, the mechanism is *Bayesian updating*. This is the only case you label a "Cascade."
  *   **Resolution:** An Information Cascade is defined strictly by the mechanism: **ignoring private information because public action is inferred to contain superior information.**

  **2. Fragility and Rationality**
  You noted that a cascade shatters with a single public revelation, and you take this to support the rationality of the earlier choices.
  *   **Explanation:** This fragility proves the agents were acting on **Information**, not **Payoffs**.
  *   If the Manager (Case 4) heard a public revelation that the project would fail, he would *still* endorse it if the CEO endorses it, because his payoff depends on the CEO, not the truth.
  *   If the Venture Investor (Case 2) hears a public revelation that the venture will fail, she immediately stops investing. Her previous commitment was contingent on the *information* held by the crowd.
  *   **Conclusion:** The fragility confirms that the "Rational Cascade" verdicts (2, 3) are epistemic, while the "Rational Conformity" verdicts (4, 5) are instrumental. This validates your intuition that they are fundamentally different phenomena.

  ### Summary
  You are not conflating phenomena; you are intuitively distinguishing **Epistemic Herding** (truth-seeking), **Instrumental Herding** (reward-seeking), and **Physical Herding** (constraint-driven). The **Principle of Structured Epistemic Inference** codifies this by requiring that rational herding must be truth-seeking, based on independent signals, and free of congestion externalities.
