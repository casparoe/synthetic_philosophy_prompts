answer: |-
  **To:** SAR Planning Group Chair
  **From:** Planning Procedure Subcommittee
  **Subject:** Conditional Intelligence Integration Protocol (CIIP)
  **Time Required:** 15 Minutes
  **Status:** Draft for Unit Leader Approval

  ### 1. Purpose and Philosophical Candidacy
  You have identified the core tension correctly. In the literature, this is often discussed under the **Judy Benjamin Problem** or the problem of **updating on conditionals**. The dispute is whether a report of the form "If $H$, then likely $E$" is merely a constraint on *where to look within $H$* (leaving the probability of $H$ unchanged) or whether it acts as *diagnostic evidence* that makes $H$ more probable than alternatives (forcing the probability of $H$ upward).

  There is no mathematical proof that settles this; it is a choice of policy. This procedure adopts **Subjective Likelihood Updating**. It forces the team to explicitly state whether they treat the report as a **Constraint** (Behavioral) or **Evidence** (Diagnostic). This makes the assumption visible rather than quiet.

  **The Rule:** We use Bayes' Theorem, but the "Evidence" is the *Report itself*, not the physical fact reported. The team must estimate the **Likelihood Ratio (LR)**: *How much more likely is this report to be generated if the subject is in the North vs. if they are not?*

  *   **If LR = 1:** The report describes behavior but does not diagnose location. (Probability of Location stays flat).
  *   **If LR > 1:** The report implies the subject fits the North profile better than others. (Probability of Location shifts North).

  ### 2. The Procedure (CIIP)

  **Step 1: Structure Check (2 Minutes)**
  *   **Ask:** "Does this report rule out any sector entirely?"
  *   **Sufficient Answer:** "No." (If Yes, use standard exclusion protocols).
  *   **Ask:** "Is the report conditional? (e.g., 'If North, then...')"
  *   **Sufficient Answer:** "Yes."
  *   **Stop Condition:** If the report is vague nonsense ("He might be anywhere, maybe near water"), declare **Unusable**. Proceed only if the conditional link is specific.

  **Step 2: The Diagnostic Question (5 Minutes)**
  *   **Ask:** "If the subject were actually in the South, how likely is it that we would receive *this specific report* saying 'If North, then Water'?"
  *   **Discussion:** This is the hard judgment.
      *   *View A (Conservative):* "Equally likely. Informants speculate regardless of truth." $\rightarrow$ **LR = 1**.
      *   *View B (Aggressive):* "Unlikely. This report exists because his behavior matches North terrain." $\rightarrow$ **LR > 1**.
  *   **Sufficient Answer:** A consensus LR value (1.0, 2.0, 5.0, etc.). Use the **LR Lookup Table** (below) to avoid false precision.
  *   **Handoff Point:** If the team cannot agree on an LR, the **Unit Leader** must decide the policy stance (Conservative vs. Aggressive). This is a decision, not a recommendation.

  **Step 3: Calculation (3 Minutes)**
  *   **Action:** Multiply the current Probability of Location (POL) for each sector by the Sector LR.
  *   **Action:** Normalize the results (divide each by the sum) to get new POLs totaling 100%.
  *   **Note:** If LR = 1 for all sectors, POLs do not change. Search *density* within the sector may still change (e.g., focus on water in North), but sector allocation does not.

  **Step 4: Resource Allocation Recommendation (3 Minutes)**
  *   **Action:** Convert new POLs into **Search Priority Points**.
  *   **Recommendation:** Assign searcher hours proportional to Search Priority Points.
  *   **Caveat:** Explicitly note if the shift is due to *Location Probability* or *Ease of Search* (POD).

  **Step 5: Unit Leader Sign-Off (2 Minutes)**
  *   **Decision:** The Unit Leader reviews the LR choice.
  *   **Ownership:** The Leader owns the risk of the LR assumption. The Planning Group owns the arithmetic.

  ---

  ### 3. LR Lookup Table (For Step 2)
  *Do not calculate exact probabilities. Select the scenario that fits.*

  | LR Value | Interpretation | Philosophical Stance |
  | :--- | :--- | :--- |
  | **1.0** | **Constraint Only.** The report tells us how to search *if* he is there, but doesn't make him more likely to be there. | **Conservative.** (Probability Unchanged) |
  | **2.0** | **Weak Signal.** The report makes the sector slightly more plausible than others. | **Moderate.** |
  | **5.0+** | **Strong Diagnosis.** The report strongly implies the subject fits this sector's profile specifically. | **Aggressive.** (Probability Shifted) |

  ---

  ### 4. Worked Example: The "Near Water" Report
  **Scenario:** 4 Sectors (N, S, E, W). Flat Prior (25% each).
  **Report:** "We can't tell you which sector, but if he's in the North, he's almost certainly staying near water."

  | Sector | Prior POL | **Rule A: Conservative (LR=1)** | **Rule B: Aggressive (LR=3)** |
  | :--- | :--- | :--- | :--- |
  | **North** | 25% | $0.25 \times 1 = 0.25$ | $0.25 \times 3 = 0.75$ |
  | **South** | 25% | $0.25 \times 1 = 0.25$ | $0.25 \times 1 = 0.25$ |
  | **East** | 25% | $0.25 \times 1 = 0.25$ | $0.25 \times 1 = 0.25$ |
  | **West** | 25% | $0.25 \times 1 = 0.25$ | $0.25 \times 1 = 0.25$ |
  | **Sum** | **100%** | **1.00** | **1.50** |
  | **New POL** | | **N: 25%** (No Change) | **N: 50%** (Shifted Up) |
  | | | **Others: 25%** | **Others: 16.7%** |

  **Interpretation:**
  *   **Rule A** says: Search North *near water*, but don't send more people to North.
  *   **Rule B** says: Send twice as many people to North, because the clue makes North more likely.
  *   **Procedure Output:** The Planning Group recommends **Rule A** by default unless Step 2 justifies Rule B.

  ---

  ### 5. Running the Procedure on Three Briefings

  #### Briefing 1: The Near-Water Conditional (Original Case)
  *   **Report:** "If North, then near water."
  *   **Step 2 Judgment:** Is this diagnostic?
      *   *Geologist's Intuition:* Water is a resource. If he is surviving, he needs water. If North has water and South is dry, this is diagnostic. If all sectors have water, it is not.
      *   *Assumption:* Assume North has unique water sources.
      *   *LR Selected:* 2.0 (Weak Signal).
  *   **Calculation:** North POL rises from 25% to 40%. Others drop to 20%.
  *   **Recommendation:** Shift 20% of total effort from other sectors to North.
  *   **Decision:** Unit Leader must approve the LR=2.0 assumption.

  #### Briefing 2: The Direct Probability Claim
  *   **Report:** "The subject is probably in the North." (No conditional).
  *   **Step 1 Check:** Not conditional. This is direct uncertain evidence.
  *   **Procedure Adjustment:** Use **Jeffrey Conditioning**. We treat the report as setting the new probability directly, weighted by source reliability.
  *   **Step 2 Judgment:** Reliability of source?
      *   *Assumption:* Source is reliable but not certain.
      *   *LR Selected:* Equivalent to setting POL directly.
  *   **Calculation:** If we trust the report 80%, New POL North = 80%.
  *   **Recommendation:** Massive shift to North.
  *   **Note:** This is mathematically simpler but epistemically riskier than the conditional. It bypasses the "If" structure.

  #### Briefing 3: The High-Certainty Antecedent (The Unliked Answer)
  *   **Report:** "If he is in the Search Area (which we are 99% sure of), he is near water."
  *   **Context:** We already know he is in the Search Area (comprised of N, S, E, W).
  *   **Step 2 Judgment:** Does this help distinguish N from S?
      *   *Analysis:* The antecedent ("In Search Area") is already nearly certain ($P \approx 1$). The conditional tells us he is near water *somewhere* in the area.
      *   *Crucial Question:* Is water distributed evenly across N, S, E, W?
      *   *Assumption:* Yes, water is available in all sectors.
      *   *LR Selected:* 1.0 (Constraint Only).
  *   **Calculation:**
      *   North POL: $0.25 \times 1 = 0.25$.
      *   South POL: $0.25 \times 1 = 0.25$.
      *   **Result:** **No change to sector allocation.**
  *   **Why you won't like it:** The report feels useful ("He's near water!"), but because it applies to the whole area equally, it does not help us choose *between* sectors. It only tells us to look near water *within* whatever sector we choose.
  *   **Recommendation:** Do not shift sector resources. Instruct all teams to prioritize water features within their assigned sectors.
  *   **Decision:** Unit Leader must accept that "useful information" does not always equal "discriminating information."

  ---

  ### 6. Limitations and Epistemic Warnings

  **1. What This Procedure Cannot Do**
  This procedure cannot resolve the philosophical dispute between **Rigid Conditioning** (Rule A) and **Diagnostic Updating** (Rule B). It merely forces you to pick one and record the choice. If the "true" nature of intelligence reports is that they are always merely constraints (Rule A), then using Rule B will systematically over-concentrate searchers on sectors with "louder" clues rather than higher probability. Conversely, if clues are diagnostic, Rule A will systematically waste resources on blind searches.

  **2. The "Wrong Rule" vs. "Unpopular Rule" Problem**
  Your unit has **no way to discover** if it has chosen the wrong rule in real-time.
  *   **Feedback Lag:** In SAR, ground truth (finding the subject) arrives only at the end of the mission.
  *   **Confounding Variables:** If you find the subject in the North after using Rule B, you don't know if you found him because Rule B was correct, or simply because you searched North harder. (This is the **Problem of Endogeneity**).
  *   **Solution:** You must maintain a **Log of LR Decisions**. Over years, review cases where the subject was found. Did they tend to be in sectors where you applied LR > 1, or sectors you downgraded? Only long-term audit can validate your philosophical stance.

  **3. The Judgment Call That Remains**
  Step 2 (The Diagnostic Question) will always remain a judgment call. No checklist can determine whether a witness's speculation is correlated with the truth.
  *   **Recommendation:** Mark this step in your logs as **"Leader Assumption."**
  *   **Reason:** When the after-action review comes, you need to know if the error was in the *math* (Procedure failure) or the *assumption* (Leadership judgment). This procedure protects the planners by isolating the assumption.

