  Prioritize empirically separating superrational reasoning from altruism and risk aversion before investigating robustness or theoretical distinctions, because establishing the phenomenon's distinct existence is the necessary upstream condition for all other inquiries.

  This separation is the primary methodological bottleneck; without control conditions that isolate logical coordination from social preference, any observed cooperation is uninterpretable. This area is neglected because literature often assumes superrationality rather than proving it against standard social utility models, yet it is highly tractable for undergraduates using simple one-shot games with varied payoff structures to distinguish risk and altruism from logical correlation. Once the behavior is isolatable, determining triggers via communication or group identity becomes the most practical next step for your community context, as manipulating chat access or group labeling is technically simple and yields immediate actionable data for managing lottery disputes. Testing noise and repeated play requires more complex longitudinal designs or larger sample sizes to achieve statistical power, making it riskier for a one-semester timeline, while theoretical classification regarding team reasoning is philosophical cleanup that depends on having robust empirical data to classify.

  If the initial separation experiment shows no statistical difference between superrational framing and altruism controls, move all superrationality-specific questions down and pivot to studying social preferences instead. If separation is successful but communication shows no additional effect, move Communication down and prioritize Robustness to see if the effect is fragile without social cues. If repeated play causes immediate collapse of cooperation, move Team Reasoning up to investigate whether the cognitive load of iteration breaks the superrational heuristic.
