answer: |-
  **The Room:** A quiet corner of the university library. Coffee steams between them.

  **The Individualist (I):** Let's skip the preamble. You hold that meaning isn't a fact inside my head, but a status granted by my community. I hold that when I say "plus," I mean addition, and that fact is mine, regardless of who is watching. Let's test this.

  **The Communitarian (C):** Agreed. No abstractions. Give me a case.

  **I:** Case one: The Last Speaker. Imagine a woman raised in our community, corrected constantly on her arithmetic. Then, at age thirty, she is imprisoned in solitary confinement for decades. No contact. No books. She is now the last speaker of her language. Today, she calculates 500 + 500. She has never added numbers this high before. What fixes what she means?

  **C:** Her past training fixes it. She was initiated into a practice where "plus" had a specific use. Even alone, she follows the track laid down by the community.

  **I:** But suppose the confinement lasts so long that she can no longer remember a single time anyone corrected her. She remembers the rules, but the social context—the nods, the corrections, the shared life—has faded into a dream. Does she still mean addition?

  **C:** If the memory of the sanction is gone, the normativity goes with it. She is no longer following a rule; she is merely exhibiting a disposition. She might say "1000," and feel compelled to do so, but without the possibility of being checked by another, there is no distinction between *thinking* she is right and *being* right. Meaning requires the possibility of a check.

  **I:** So if she dies alone, she never meant anything by her last calculation?

  **C:** She meant something only insofar as she remained a potential member of a community. If she is truly cut off, forever, she becomes a clockwork oracle. She outputs sounds, but nothing binds her to one interpretation over another.

  **I:** That sounds absurd. Her intention is right there. She intends to continue as she before.

  **C:** But "as before" is exactly what the skeptic challenges. Without a community to confirm that *this* step counts as "the same," her intention is empty. She is playing a solitaire game where she decides the rules as she goes.

  **I:** Let's move. Case two: The Rulebook with No Readers. A civilization dies. They leave a tablet detailing a game. No one alive knows the game. I find the tablet. Does the text mean anything before I read it?

  **C:** The marks are there. The meaning arises when you, representing a community, interpret them.

  **I:** So the dead civilization didn't mean anything by their rules?

  **C:** They meant something when they were alive, because they had a community. Now? The meaning is dormant until reactivated by us.

  **I:** Are you appealing to *our* community to fix *their* meaning?

  **C:** Yes. There is no God's-eye view. Meaning is always relative to an interpreting practice.

  **I:** Isn't that cheating? You're saving your theory by appealing to a *possible* community—us—rather than the actual one that generated the rules. If meaning depends on communal sanction, and that community is dead, the meaning should be dead too. By appealing to us, you're admitting meaning isn't tied to the *original* community, but to any community that shows up. That slides toward the individualism you reject. I am the community now.

  **C:** It's not cheating. It's acknowledging that meaning is a living thing. A rule without a user is a fossil. We breathe life into it. But we are constrained by the text. We can't just say it means anything.

  **I:** Constrained by what? The marks? You just said marks aren't meaning. You're caught. Either the marks carry meaning independently of us—which is my view—or you are saying we project meaning onto them. If we project it, then the dead civilization didn't really have rules; they had scratches.

  **C:** They had rules *then*. We have interpretations *now*.

  **I:** Then meaning isn't stable. It shifts with the community.

  **C:** It shifts with the loss of the community. That's the price of making meaning public.

  **I:** Let's go deeper. Case three: The Confidently Wrong Community. Imagine a tribe that uses a rule like "add 2." They go 2, 4, 6... up to 1000. Then they all confidently go 1004, 1008, 1012. They agree completely. They correct any dissenters. They are consistent in this error forever. Are they wrong?

  **C:** According to us, yes. According to them, no. Within their form of life, they are following a rule. It is a different rule than ours, perhaps one that says "add 2 until 1000, then add 4."

  **I:** But suppose they endorse the principle "always add the same amount." They say that. They believe that. Yet they apply it inconsistently. They are contradicting themselves. Can a whole community be wrong about its own rule?

  **C:** If they all agree, who is to say they are wrong? Correctness is established by agreement. If there is no dissent, there is no error.

  **I:** So the community is infallible.

  **C:** Not infallible in a metaphysical sense. Just that there is no fact of the matter beyond their agreement. You want a fact that stands over them, judging them. I say the judgment *is* the agreement.

  **I:** That makes normativity impossible. If they agree that 2+2=5, then for them, 2+2=5. You've turned truth into consensus.

  **C:** I've turned truth into assertibility conditions. They cannot assert "2+2=4" because their practice doesn't support it.

  **I:** But here's the trap. If you say they can't be wrong, you've made the community a god. If you say they *can* be wrong—if you admit that even unanimous agreement can fail to track the rule—then where does that fact live? It can't live in their agreement, because they agree on the error. It must live in the rule itself, independent of them.

  **C:** I can say they are wrong relative to *our* practice.

  **I:** That's evasion. I'm asking if *they* are wrong, given *their* principle. They hold the principle "always add the same." They violate it. Is that a violation?

  **C:** If they never recognize it as a violation, it isn't one. A rule isn't a rail laid to infinity. It's a custom. If the custom changes, the rule changes.

  **I:** So if I murder everyone who disagrees with me, I make myself right?

  **C:** You make yourself uncorrectable. Which means you are no longer following a rule. You are dictating. But if the whole community agrees on the murder, then within that community, it is correct.

  **I:** This is where your view collapses. You wanted to save objectivity from the skeptic's nihilism. You said community sanction saves meaning. But if the community can be systematically self-contradictory and still be "right," you haven't saved normativity. You've just社会化ized error. You need a fact about the rule that transcends the community to explain why they are mistaken. You need *my* individual fact.

  **C:** I need nothing of the sort. I need only that a community usually coheres. If they fracture, meaning dissolves. If they remain solid, meaning holds. You are asking for a guarantee against error that no human practice can provide.

  **I:** I'm asking for the difference between following a rule and merely thinking you are. You've given me only the latter, dressed up as a group activity.

  ***

  **Authorial Note:**

  Case 3 does the most damage. The Communitarian can survive the isolation of Case 1 by biting the bullet that meaning dissolves without the possibility of check, and she can navigate Case 2 by relativizing meaning to the interpreting community. But Case 3 forces her into a dilemma she cannot escape without conceding ground. If she insists the community cannot be wrong about its own rules, she makes normativity trivial—agreement becomes truth, and the community is infallible by definition. If she admits the community can be wrong (e.g., consistently misapplying a principle they endorse), she must appeal to a standard of correctness that exists independently of communal sanction. That standard looks suspiciously like the individual fact of meaning she sought to reject. To survive, the skeptic must give up the claim that communal agreement is the *sole* constitutor of meaning, admitting instead that practices are answerable to constraints they do not create.
