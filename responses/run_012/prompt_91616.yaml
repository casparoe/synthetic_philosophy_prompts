prompt: |-
  So in ethics we've just done Singer's drowning child argument — the one where if you're walking past a shallow pond and there's a toddler drowning, obviously you're obliged to wade in and ruin your shoes, and then he says the fact that the kid is on the other side of the world instead of in front of you makes no moral difference, so we're all basically monsters for not giving away most of our income. I actually found it pretty convincing, but when I tried it out on my dad at dinner he just said "well, charity begins at home" like that settled it, and then my mate said the exact same thing in debate club when I raised it. I want to go back at them with something better than just "no it doesn't", but honestly I can't even tell what they're claiming.

  Can you lay out all the different precise things "charity begins at home" could actually be saying — like is it just a description of how people happen to behave, or a claim that we're allowed to prioritise our own family and country, or that we're positively obliged to, or that you literally can't help strangers until your own house is in order, or something about charity being optional and duty being a different thing altogether? Put them as a list, going from the readings that are basically just truisms up to the ones that would genuinely contradict Singer, and tell me for each one whether it's true, whether it's even the kind of thing that can be true or false, and crucially which of them would actually do the work my dad and my mate wanted it to do. Also say which reading most people probably have in mind when they say it, because I suspect they're quietly sliding between a few of them depending on how hard they're being pushed. I need this in British English please, my teacher is definately a stickler about spelling and she'll mark me down for it. Thanks!
