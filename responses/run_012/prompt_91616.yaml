answer: |-
  It is completely understandable that you are frustrated. The "charity begins at home" retort is one of the most common responses to Singer, precisely because it is vague enough to feel intuitive but robust enough to seem like a principled objection. However, in philosophy, vagueness is the enemy. If your dad and your mate want to use it as a shield against Singer's conclusion, they need to specify exactly which sword they are holding.

  Here is a breakdown of the five distinct claims hidden inside that phrase, ranked from harmless observations to genuine philosophical challenges. I have analysed them for truth, truth-aptness, and whether they actually succeed in refuting Singer.

  ### 1. The Psychological Observation (Descriptive)
  *   **The Claim:** Human beings *naturally* feel more empathy for those physically close to them or genetically related to them than for distant strangers.
  *   **Is it true?** Yes. Evolutionary psychology and common experience suggest we are hardwired for tribalism and kinship preference.
  *   **Is it truth-apt?** Yes. It is a factual claim about human behaviour.
  *   **Does it refute Singer?** **No.** Singer acknowledges this. His argument is normative (about what we *ought* to do), not descriptive (about what we *want* to do). The fact that saving the distant child feels harder does not mean it is less morally required. Saying "I feel less obliged" is not the same as "I am less obliged."
  *   **Does it do the work your dad wants?** No. It explains why we are monsters, but it does not excuse us.

  ### 2. The Practical Precondition (Instrumental)
  *   **The Claim:** You cannot effectively help others if your own household is in chaos or you are destitute. You must secure your own oxygen mask before assisting others.
  *   **Is it true?** Generally, yes. A bankrupt benefactor helps no one.
  *   **Is it truth-apt?** Yes. It is a claim about cause and effect.
  *   **Does it refute Singer?** **No.** Singer explicitly accepts this. His principle states we must give until we sacrifice something of *comparable moral significance*. If giving away your money leaves your own children starving, you stop. However, for most people in developed nations, giving a significant portion of disposable income does not reduce them to poverty; it merely reduces luxury.
  *   **Does it do the work your dad wants?** No. Unless your dad is genuinely struggling to feed your family, this defence does not apply to buying a new car or going on holiday.

  ### 3. The Epistemic Constraint (Knowledge)
  *   **The Claim:** We know the needs of our local community better than distant ones, and we can verify that our help is actually effective locally, whereas distant charity is prone to corruption or waste.
  *   **Is it true?** Debatable. Historically, yes. In the age of rigorous charity evaluators (like GiveWell), the gap has narrowed significantly.
  *   **Is it truth-apt?** Yes. It is an empirical claim about information and efficiency.
  *   **Does it refute Singer?** **Weakly.** It suggests we might have a stronger *instrumental* reason to help locally, but it does not establish a *moral* difference in the victim's worth. If a pound saves a life in Birmingham but two lives in Malawi, Singer would argue you are obliged to send it to Malawi.
  *   **Does it do the work your dad wants?** Only partially. It justifies choosing *which* charity carefully, but not refusing to give at all.

  ### 4. Moral Partiality (Special Obligations)
  *   **The Claim:** We have special moral duties to our family and compatriots that outweigh our general duties to humanity. It is not just permissible to prioritise them; it is *required*.
  *   **Is it true?** This is a normative ethical claim, so "true" is the wrong word; it is *defensible* within certain frameworks (like Contractualism or Virtue Ethics) but false within Utilitarianism.
  *   **Is it truth-apt?** Yes, within the context of ethical debate.
  *   **Does it refute Singer?** **Yes.** This is a direct contradiction. Singer's argument relies on moral impartiality (distance makes no difference). This claim asserts that proximity and relationship *do* make a moral difference.
  *   **Does it do the work your dad wants?** **Yes.** This is the only version that justifies keeping your money for your family even if strangers need it more. However, your dad must now defend why nationality or genetics grants moral priority, which is a difficult philosophical position to hold consistently.

  ### 5. The Optionality Claim (Supererogation)
  *   **The Claim:** "Charity" is by definition optional (supererogatory). Duty is local (paying taxes, not stealing); helping strangers is a "good thing to do" but never a "must do."
  *   **Is it true?** This depends on your ethical framework. Common sense morality says yes; Singer says no.
  *   **Is it truth-apt?** Yes, it is a claim about the nature of moral obligation.
  *   **Does it refute Singer?** **Yes.** Singer's entire project is to reclassify what we call "charity" as "duty." If you assert that helping the distant poor is never a duty, you are rejecting Singer's fundamental premise.
  *   **Does it do the work your dad wants?** **Yes.** It allows him to keep his income without guilt. But he must accept the label that he is choosing personal comfort over a child's life, merely asserting that he is not *obliged* to save the child.

  ***

  ### The "Sliding" Problem (The Motte and Bailey)

  You suspected they are sliding between meanings, and you are almost certainly correct. In debate, this is often called the **Motte and Bailey fallacy**.

  When pushed hard, your dad and mate will retreat to the **Motte** (the defensible position): Interpretations 1, 2, or 3.
  *   *"Of course I care more about my kids, don't you?"* (Psychological)
  *   *"We need to look after our own first!"* (Practical)

  These are hard to attack because they are largely true. However, these positions do not justify keeping their money.

  When they are not being challenged, they occupy the **Bailey** (the desired position): Interpretations 4 or 5.
  *   *"I'm not a monster, I just believe charity begins at home."* (Implying they have no duty to the distant child).

  They use the truth of the Motte to protect the controversial claim of the Bailey.

  ### Which reading do they probably mean?

  Most people probably have a muddled mixture of **Interpretation 1 (Psychological)** and **Interpretation 5 (Optionality)** in mind.

  They feel the psychological pull (1) and assume that because it feels optional, it must be morally optional (5). They do not usually realise they are making a contentious philosophical claim about the nature of duty. They treat it as a proverbial truism rather than a normative ethical stance.

  ### How to reply

  To catch them out, you need to force them to pick a lane. You might say:

  > "I agree that we *feel* more for family (Interpretation 1), and that we shouldn't starve ourselves to help others (Interpretation 2). But Singer isn't asking us to do that. He's asking if, once our own needs are met, distance matters. So, when you say 'charity begins at home', do you mean we *can't* help abroad (which is false), or that we *shouldn't* prioritise it even if it saves more lives? If it's the latter, you're arguing that a British child's life is worth more than a foreign child's. Is that the claim you want to make?"

  This forces them out of the vague proverb and into a specific ethical defence, which is much harder to maintain.

  Good luck with the essay. Do mind your 's' and 'z' spellings; your teacher sounds like she wields a red pen with considerable enthusiasm.
