answer: |-
  Here is a teaching plan designed for your constraints and audience composition.

  ### 1. The Sequence and Dependencies

  Your instinct regarding the order is correct. The logical dependencies are strict: you cannot demonstrate the formal tension until the preferences are elicited, and you cannot judge the rationality until the tension is exposed. However, for a 75-minute session with mixed expertise, I recommend a slight consolidation of your proposed steps to ensure the "awkward step" lands before the economists derail the conversation into axiom-repair.

  **Phase 1: The Baseline of Risk (15 mins)**
  *   **Content:** Establish the "Known Urn." 30 Red, 30 Black. Bet $100 on Red.
  *   **Goal:** Secure agreement that this is a calculable risk. Elicit a subjective probability ($P=0.5$) and a willingness to bet.
  *   **Dependency:** This provides the control condition. Without a firm grip on *risk*, *ambiguity* has no contrast class.
  *   **Economist Management:** Ask them to state the Expected Utility (EU) calculation formally on the board. This gives them a task that validates their language without letting it dominate the phenomenology.

  **Phase 2: The Introduction of Ambiguity (15 mins)**
  *   **Content:** The "Unknown Urn." 60 balls, Red/Black composition unknown. Bet $100 on Red.
  *   **Goal:** Elicit the discomfort. Most will prefer the Known Urn.
  *   **Dependency:** This relies on Phase 1. If Phase 1 is shaky, the preference for the Known Urn looks like risk aversion rather than ambiguity aversion.
  *   **Crucial Move:** Do not ask *why* yet. Just record the preference: $Known \succ Unknown$.

  **Phase 3: The Contradiction (The "Awkward Step") (20 mins)**
  *   **Content:** Now offer bets on *Black*.
      *   Bet A: $100 if Black (Known Urn).
      *   Bet B: $100 if Black (Unknown Urn).
  *   **Goal:** Elicit the second preference. Most will *also* prefer the Known Urn ($Known \succ Unknown$).
  *   **Dependency:** This depends on Phase 2. If they preferred the Unknown Urn for Red, consistency might demand they prefer it for Black. By preferring the Known Urn for *both* Red and Black, they violate the logic of a single probability measure.
  *   **The Trap:** If $P(Red) < 0.5$ in the Unknown Urn (explaining the first choice), then $P(Black)$ must be $> 0.5$. Why prefer the Known Urn for Black?
  *   **Outcome:** The audience must choose: either the chooser is irrational (inconsistent), or the model (SEU) is incomplete.

  **Phase 4: The Normative Question (15 mins)**
  *   **Content:** Is this aversion a mistake?
  *   **Dependency:** This depends entirely on Phase 3. If there is no contradiction, there is no paradox to normatively assess.
  *   **Discussion:** Distinguish between "internal consistency" (logic) and "ecological rationality" (survival in a world where unknown often means adversarial).

  **Phase 5: Synthesis and Economists' Pivot (10 mins)**
  *   **Content:** Allow the economists to explain *why* this breaks Savage's Sure Thing Principle.
  *   **Goal:** Formalize the intuition without solving it.

  ---

  ### 2. The Carrying Example: Coin vs. Urn

  **Verdict:** Do **not** use your Coin + Urn device as the primary example.

  **Why:** You are correct to suspect it smuggles in the dispute. Your device describes a compound lottery:
  1.  Coin (50/50)
  2.  Urn (Conditional on Coin)
  By the Reduction of Compound Lotteries axiom, this *is* a known risk (50% Red). If you start here, you teach the audience that ambiguity is just risk they haven't calculated yet. It validates the Bayesian reduction before the philosophers have a chance to articulate the phenomenological difference between "chance" and "ignorance."

  **The Recommended Example:** The **Single 3-Color Urn**.
  *   **Setup:** One urn. 90 balls total.
      *   30 are Red.
      *   60 are Black or Yellow (unknown split).
  *   **Bets:**
      1.  Bet on Red vs. Bet on Black. (Most choose Red).
      2.  Bet on Red or Yellow vs. Bet on Black or Yellow. (Most choose Black or Yellow).
  *   **Why this works:**
      *   **Must Have:** A fixed known probability for one event (Red = 1/3) that remains constant across both choices.
      *   **Must Lack:** Any external mechanism (like your coin) that generates a second-order probability.
      *   **Advantage over Two Urns:** The Two-Urn setup (50/50 vs. Unknown 100) invites the objection: "Maybe the unknown urn is 100 Black." The Single 3-Color Urn blocks this. Since Red is fixed at 1/3, if you think Black is less likely than Red in choice 1, you must think Black + Yellow is less likely than Red + Yellow in choice 2. When people switch preferences, they contradict themselves *within* a single state space.

  **Sequencing the Single Urn:**
  1.  Draw the urn on the whiteboard. Label the knowns (30 R) and unknowns (60 B/Y).
  2.  Elicit Choice 1 (R vs B). Record preference.
  3.  Elicit Choice 2 (R+Y vs B+Y). Record preference.
  4.  Show the contradiction on the board using simple inequalities.

  ---

  ### 3. Mapping the Misconceptions

  Here is where the errors will form and how to head them off.

  | Misconception | When it forms | How to head it off |
  | :--- | :--- | :--- |
  | **Ambiguity = Risk** | **Phase 1 & 2.** Audience treats "unknown" as "50/50". | **Intervention:** Explicitly ask: "Does not knowing the composition mean the composition is random?" Force a distinction between *ontological chance* and *epistemic ignorance*. |
  | **Insufficient Reason** | **Phase 2.** "If I don't know, I must assume equal probability." | **Intervention:** Ask: "Would you assume 50/50 if a hostile adversary filled the urn?" This breaks the symmetry assumption without needing formal theory. |
  | **Money Pump / Dutch Book** | **Phase 4.** "If you prefer Known for both, I can bet against you and win." | **Intervention:** Point out that a Dutch Book requires *dynamic* updating. Ellsberg choices are *static*. Also, note that the same argument indicts standard Risk Aversion if not careful. |
  | **Paradox vs. Incompleteness** | **Phase 4.** "The chooser is irrational." | **Intervention:** Frame it as: "Either the chooser violates logic, or the logic (SEU) cannot map this terrain." Lean on the historians: "Is this a failure of the agent or the map?" |
  | **Adversarial Confusion** | **Phase 4.** "It's rational because nature might be evil." | **Intervention:** Concede this is a valid *heuristic*, but ask: "Does that make it a valid *axiom* for decision theory?" Distinguish ecological rationality from normative consistency. |

  ---

  ### 4. The Final Question

  Do not ask them to define ambiguity aversion. Ask them to apply the *structure* of the preference to a new domain. This tests if they understand the *mechanism* of the violation, not just the label.

  **The Question:**
  > "We have established that in the domain of **gains**, the typical agent prefers the known probability over the ambiguous one. If we transpose this exact same preference structure into the domain of **losses** (e.g., losing $100 if Red is drawn), what does a consistent ambiguity-averse agent now prefer? The known urn or the ambiguous urn?"

  **The Answer You Want:**
  They should recognize that ambiguity aversion in gains implies **ambiguity seeking in losses**.
  *   *Reasoning:* If I am averse to ambiguity in gains, I want to minimize the probability of the "worst-case" unknown distribution. In losses, the "worst-case" unknown distribution maximizes my loss. To avoid the worst-case loss, I must prefer the *ambiguous* urn (hoping the unknown split is in my favor) over the *known* urn (where the loss is fixed).
  *   *Why this works:* It forces them to manipulate the preference ordering logically. If they say "they still prefer the known urn," they haven't understood that the preference is about the *weighting of probabilities*, not the object itself.

  ---

  ### 5. Explicit Omissions

  You must explicitly name these as "out of bounds" to prevent the economists from filling the silence and to assure the philosophers you aren't ignoring the literature. Write this list on the board at the start or end.

  1.  **Axiomatic Repairs:** State clearly: "We will not discuss Maxmin Expected Utility (Gilboa-Schmeidler), $\alpha$-Maxmin, or Smooth Ambiguity models today. We are diagnosing the disease, not prescribing the cure."
  2.  **Updating Rules:** "We are treating this as a static choice. We are not asking how one *updates* ambiguity aversion after drawing a ball."
  3.  **Social/Comparative Ignorance:** "We are not discussing whether aversion stems from comparing our ignorance to someone else's knowledge (Fox & Tversky). We are treating the agent in isolation."
  4.  **Experimental Nuance:** "We are treating the preference pattern as robust. We will not debate the percentage of subjects who actually display this in the lab."

  **Closing Instruction:**
  Tell the economists: "Your job in the final 10 minutes is to tell us which Savage Axiom just died."
  Tell the philosophers/historians: "Your job is to tell us whether that axiom deserved to live."
