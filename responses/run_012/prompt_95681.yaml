      *   **Context:** Cross-faculty reading group (Philosophers, Historians, 2 Economists).
      *   **Topic:** Ellsberg Choice Problem & Ambiguity Aversion.
      *   **Constraints:** 75 minutes, whiteboard only, no formal decision theory presupposed (but can lean on economists later).
      *   **Goal:** A teaching plan (order of components, dependencies), evaluation of the user's proposed example (Coin + Urn vs. Standard Ellsberg), mapping misconceptions, a final assessment question, and a list of explicit omissions.
      *   **User's Instincts:** Needs firm grip on known odds first -> distinction between unknown composition vs. no basis -> choice rather than riddle -> joint unrepresentability (Savage violation) -> normative question.
      *   **Specific Concern:** Does the "Coin + Urn" example smuggle in the reduction of ambiguity to risk (Bayesian smoothing)?
      *   **Tone:** Academic, precise, pedagogical, respectful of the user's expertise (they convene the group).

  2.  **Evaluate the User's Proposed Example (Coin + Urn):**
      *   *The Setup:* Coin toss (H/T) determines urn composition (30R/60B or 60R/30B). Bet on Red.
      *   *The Problem:* This is actually a *risk* scenario, not an *ambiguity* scenario, from the perspective of Subjective Expected Utility (SEU). If the agent believes the coin is fair (50/50), the compound lottery reduces to a simple lottery: $0.5 \times (1/3) + 0.5 \times (2/3) = 0.5$ probability of Red.
      *   *The Risk:* The user correctly suspects this "smuggles in precisely what is in dispute." If you present this first, you teach the audience to treat ambiguity as reducible to risk via the Principle of Insufficient Reason (or Bayesian updating). It validates the Economists' instinct to jump to axioms before the philosophers/historians grasp the phenomenological difference.
      *   *Verdict:* Do *not* use this as the primary diagnostic. It undermines the core distinction. Use the standard Two-Urn or One-Urn (3-color) setup. The One-Urn (3-color) is better for showing the *internal* tension (Sure Thing Principle violation) without needing to compare two physical objects, but the Two-Urn (Known vs. Unknown) is more intuitive for the initial "feeling" of ambiguity.
      *   *Decision:* Recommend the **Two-Urn** setup for the *phenomenological* intro (Known vs. Unknown), then switch to the **One-Urn (3-color)** for the *logical* contradiction (Sure Thing Principle). Why? Because the Two-Urn makes the *aversion* palpable, but the One-Urn makes the *inconsistency* mathematically undeniable without needing external reference. Actually, for a 75-min session with non-specialists, the **Two-Urn** is usually clearer for the *concept*, but the **One-Urn (3-color)** is necessary for the *proof* of incompatibility with SEU.
      *   *Refinement:* Let's stick to the classic **Two-Urn** (Urn A: 50R/50B; Urn B: 100R/B unknown) for the choice. It's the most direct illustration of "Ambiguity Aversion." However, to show the *contradiction* (the Ellsberg Paradox proper), one needs the second pair of bets (betting on Black). I will advise using the Two-Urn setup but ensuring both pairs of bets (Red vs. Red, Black vs. Black) are elicited to show the contradiction.
      *   *Correction on User's Instinct:* The user asks: "build the comparison as two urns or as the single urn whose four bets expose a tension." The Single Urn (30 Red, 60 Black/Yellow unknown split) is technically superior for demonstrating the *violation of Savage's P2* because it holds the state space constant. The Two-Urn setup invites the objection "maybe the unknown urn is all Black." The Single Urn prevents that. I should recommend the **Single Urn (3-color)** for the rigorous part, but maybe use the Two-Urn intuition to start. Actually, for 75 mins, keep it simple. **Single Urn (3-color)** is the standard for a reason: it blocks the "hostile nature" objection. I will recommend the Single Urn (30 Red, 60 Black/Yellow) for the whole thing to avoid switching horses.

      *   *Re-evaluating the User's Coin Example:* The user asks if it should carry the idea. My answer must be: No. It collapses ambiguity into risk. It validates the Bayesian view before the debate starts.

  3.  **Drafting the Sequence (The "Order of Components"):**
      *   *Phase 1: Risk (Known Odds).* Establish baseline comfort.
      *   *Phase 2: Ambiguity (Unknown Odds).* Elicit discomfort/aversion.
      *   *Phase 3: The Contradiction.* Elicit the second pair of choices to show inconsistency with a single probability measure.
      *   *Phase 4: The Diagnosis.* SEU cannot represent this. Rationality vs. Model Completeness.
      *   *Phase 5: Normativity.* Is it a mistake?
      *   *Dependencies:* You can't show the contradiction (3) without establishing the preferences (1 & 2). You can't discuss normativity (5) without establishing the formal tension (4).

  4.  **Mapping Misconceptions:**
      *   *Risk vs. Ambiguity:* Early on (Phase 1 vs 2).
      *   *Principle of Insufficient Reason (50/50 assumption):* When moving from Known to Unknown.
      *   *Money Pump/Dutch Book (Irrationality claim):* When discussing the contradiction (Phase 4).
      *   *Paradox vs. Incompleteness:* Phase 4/5 transition.

  5.  **The Final Question:**
      *   Needs to test understanding of the *structure* of the preference, not just the label.
      *   Idea: Flip the domain to Losses. If they are ambiguity averse in gains, what are they in losses? (Ambiguity Seeking). Or ask them to price the bets.
      *   Better: Ask them to articulate what a *coherent* ambiguity seeker would look like in the standard setup.
      *   Best: Ask them to identify which axiom fails. Or, construct a scenario where ambiguity aversion is clearly *rational* (adversarial nature) vs. *irrational* (random mechanism) to test the normative grasp.
      *   *Selection:* The "Loss Domain" flip is the standard test of deep understanding (reflection). If you hate ambiguity in gains, you should love it in losses (to minimize the max loss probability).

  6.  **Omissions:**
      *   Maxmin Expected Utility (Gilboa-Schmeidler).
      *   Alpha-Maxmin.
      *   Source Method (Kahneman/Tversky later work).
      *   Experimental specifics (Camerer, etc.).
      *   Keep it to the *problem*, not the *solutions*.

  7.  **Refining the Plan (Self-Correction during drafting):**
      *   *Time Management:* 75 mins is tight.
      *   *Economists:* Keep them busy by asking them to formalize the philosophers' intuitions in Phase 4.
      *   *The Coin Example:* I need to be firm. It's a "Trojan Horse" for Bayesianism. It must be rejected or used *only* to show why it fails (i.e., "Why is this different from the Ellsberg urn?"). I will advise using it as a *contrast* case, not the main case.
      *   *Single vs. Two Urns:* The Single Urn (30 Red, 60 Black/Yellow) is logically tighter. It prevents the "maybe the unknown urn is 100 Black" objection. I will recommend the Single Urn for the core logic.

  8.  **Final Polish:**
