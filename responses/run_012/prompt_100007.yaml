answer: |-
  ## Activity: "The Constitutional Loop"

  ### Part 1: The Handout (Print one per student)

  **THE CHARTER (Version 1.0)**

  1.  **Objective:** The player with the most points at the end of Round 3 wins.
  2.  **Structure:** The game lasts three (3) Rounds of 10 minutes each.
  3.  **Legislation:** During a Round, any player may propose a Rule Change on an index card. At the end of the Round, all proposals are voted on. A proposal passes with a **Simple Majority** (>50% of present players).
  4.  **Entrenchment:** **Rule 3 and Rule 4 cannot be amended unless 75% of players vote in favor.**
  5.  **Suspension:** At the start of a Round, a player may pay 5 Points to **Suspend** one specific Rule for that Round only. The Rule returns next Round.
  6.  **Retroactivity:** New Rules take effect immediately upon passage. A Rule *may* declare itself retroactive to the start of the current Round.
  7.  **Validity:** A move (scoring points, suspending a rule, passing a law) is **Valid** only if a **Valid Rule** authorized it *at the exact moment the move was made*.
  8.  **Adjudication:** Any player may Challenge the Validity of a move. Challenges are resolved by immediate Majority Vote.
  9.  **Incentive:** The proposer of any passed Rule Change gains 2 Points.
  10. **Foundation:** This Charter is authorized by the Instructor.

  **Current Scoreboard:** (Instructor will maintain on Whiteboard)

  ***

  ### Part 2: The Script (First 10 Minutes)

  **Minute 0-2: Setup**
  *   **Action:** Arrange chairs in a tight circle. Put the Whiteboard where everyone can see it. Write "ROUND 1" and "SCORES: All 0" on the board. Hand out the Charter and 3 blank index cards per student.
  *   **Say:** "Welcome to the jurisdiction. You are no longer students; you are the Legislature, the Court, and the Citizens. Your goal is points. Your tool is law. You have the Charter in front of you. Read it silently for two minutes. Do not speak yet."

  **Minute 2-4: The Silence**
  *   **Action:** Stand back. Do not answer questions yet. Let them read Rule 4 (Entrenchment) and Rule 7 (Validity). Watch for furrowed brows.
  *   **Say:** "You may notice tensions in the text. Good. That is the material. I am the 'Bank' and the 'Executive.' I track points and enforce the clock. I do not interpret the law. If you have a question about what the law *means*, you must propose a Rule Change to clarify it. If you have a dispute about what the law *is*, you must Issue a Challenge under Rule 8."

  **Minute 4-6: Mechanics Check**
  *   **Action:** Pick up an index card.
  *   **Say:** "To propose a law: Write the new text on a card, sign it, hand it to me. I will post it on the board. To vote: Show of hands. To claim points: Announce your move and cite the Rule that authorizes it. If no one Challenges you within 30 seconds, the move stands."
  *   **Crucial Instruction:** "If you get stuck on a paradox—if you don't know if a move is legal—you must vote on it. I will not save you from inconsistency. Inconsistency is the lesson."

  **Minute 6-10: Round 1 Start**
  *   **Say:** "Round 1 begins now. You have 10 minutes. Draft your proposals."
  *   **Action:** Start a visible timer. Walk to the side of the room. If a student asks, "Can I do X?" respond: "What does the Charter say?" If they say "The Charter is unclear," respond: "Then propose a clarification."

  ***

  ### Part 3: Facilitation & The "Engineered Crisis"

  **Your Role:**
  You are the **Server**, not the **Judge**. You track time and points. If they ask you to rule, point to Rule 8 (Adjudication by Majority Vote). If the group deadlocks on a vote, the status quo remains.

  **The Whiteboard Management:**
  Keep a "Current Charter" list on the board. When a rule passes, cross out the old text and write the new one next to it. Do not erase history; draw a line through it. This visual trace is crucial for the debrief.

  **The Predictable Crisis (Minute 20-30):**
  Somewhere in Round 2, a student (usually the most assertive pre-law student) will realize Rule 4 (Entrenchment) prevents them from optimizing the game. They will propose repealing Rule 4 using only a Simple Majority (Rule 3).
  *   **The Paradox:** If Rule 4 is valid, the vote fails (needs 75%). If the vote succeeds (51%), Rule 4 is repealed, meaning the vote was valid.
  *   **Your Move:** Do not intervene. Let them vote. If they vote 51% to repeal, ask: "Is Rule 4 repealed?" Let them argue. If they claim points based on the repeal, allow a Challenge under Rule 8.
  *   **The Retroactivity Trap:** Someone will try to pass a rule in Round 3 that says "All point claims in Round 2 are void." This triggers Rule 7 (Validity at the time of the move). Let them fight over whether time travel is legal.

  ***

  ### Part 4: The Debrief (Last 35 Minutes)

  **Phase 1: The Timeline (10 mins)**
  Reconstruct the game on the whiteboard. Ask: "What was the status of Rule 4 at Minute 25?"
  *   Map the exact moment the "Crisis Vote" happened.
  *   Identify the moment someone claimed points that others felt were "illegal."
  *   Identify the moment the group ignored a rule because it was "too slow" (Efficacy vs. Validity).

  **Phase 2: Mapping Concepts (15 mins)**
  Use their specific moves to define the theoretical terms. Do not lecture; ask them to label the moments.

  1.  **Validity vs. Efficacy:**
      *   *Ask:* "When we ignored Rule 3's voting procedure to save time, was the law 'broken' or 'changed'?"
      *   *Point:* A rule can be valid (on the books) but ineffective (ignored). A rule can be efficacious (followed) but invalid (unconstitutional).
  2.  **Repeal vs. Violation:**
      *   *Ask:* "When Sarah took 5 points without a rule, was she violating the law or testing its enforcement?"
      *   *Point:* Violation presupposes the rule exists. Repeal destroys the rule. The game blurred these when you voted to 'ratify' a violation after the fact.
  3.  **Retroactivity:**
      *   *Ask:* "When the group voted to void Round 2 points in Round 3, did that change the past?"
      *   *Point:* Legal retroactivity doesn't change history; it changes the *legal consequences* of history. Rule 7 made this feel like time travel.
  4.  **Entrenchment:**
      *   *Ask:* "Why was Rule 4 so hard to remove? Can the present bind the future?"
      *   *Point:* Entrenchment tries to remove the power to amend from the amendment power itself. This is the "Self-Embracing Sovereignty" problem.
  5.  **The Bootstrap (Grundnorm):**
      *   *Ask:* "Rule 10 says I authorized this Charter. Who authorized me?"
      *   *Point:* Every legal system rests on a fiction or a social fact outside the system. The game worked only because you all agreed to play *before* Rule 1 existed.

  **Phase 3: The Final Question (10 mins)**
  *   **Ask:** "At the exact moment of the Crisis Vote, was the repeal of Rule 4 Legal?"
  *   **Goal:** Do not accept a Yes/No. Push for: "It was legally *indeterminate*."
  *   **Takeaway:** Law is not math. In hard cases (self-reference), there is no "correct" answer inside the system. The answer is created by the decision-maker (you), not found in the text.

  ***

  ### Part 5: Prediction of Failure Modes

  **1. The "Referee" Trap (High Probability)**
  *   **What happens:** Students will look at you when the paradox hits. "Professor, is this allowed?"
  *   **Your temptation:** To explain the paradox and save them time.
  *   **The Fix:** Repeat the mantra: "Rule 8 says you vote on challenges. I don't vote." If they demand a ruling, tell them the game pauses until they vote.
  *   **Why:** If you referee, you become the "Grundnorm." The point is for *them* to feel the burden of being the foundation.

  **2. The "Loophole Shark" (Medium Probability)**
  *   **Who:** One student (often a philosophy major) will read Rule 7 closely and try to declare all previous moves void to reset the score.
  *   **Feature or Bug:** Feature. This is legal realism.
  *   **Management:** Let them do it. If the group revolts, they must vote to override the Shark. This demonstrates that law is ultimately social power, not just text.

  **3. Procedural Gridlock (Medium Probability)**
  *   **What happens:** They spend 40 minutes debating how to vote and never change a rule.
  *   **The Fix:** If Round 1 ends with no new rules, announce: "The Incentive (Rule 9) is now doubled." Force the action.
  *   **Why:** You need data (changed rules) for the debrief.

  **4. Chaos/Collapse (Low Probability)**
  *   **What happens:** They ignore all rules and just claim points.
  *   **The Fix:** Stop the clock. "If there are no rules, there are no points. Points only exist if the Charter validates them."
  *   **Why:** This teaches the difference between power (taking what you want) and authority (taking what is yours by right).

  ***

  ### Part 6: Limitations (What This Game Cannot Do)

  **1. Enforcement Power**
  *   **The Gap:** In the game, if someone refuses to accept a vote, nothing happens. In reality, the state has police/prisons.
  *   **Debrief Note:** You must supply this. Explain that law is "rules + force." The game simulated the rules, but the "force" was just social awkwardness. Real paradoxes matter because real coercion is behind them.

  **2. Historical Precedent**
  *   **The Gap:** The game resets in 90 minutes. Real law has centuries of sediment.
  *   **Debrief Note:** Explain that self-reference in law is usually hidden by history. We don't question the Constitution's validity every day because "we've always done it." The game strips away that comfort.

  **3. The External Observer**
  *   **The Gap:** You (the professor) are actually the external sovereign (Kelsen's Grundnorm). They know you could override them.
  *   **Debrief Note:** Acknowledge this. "I was the ghost in the machine. In a real revolution, there is no professor. The 'people' become the professor."

  **4. Complexity of Language**
  *   **The Gap:** The rules were short and clear. Real statutes are ambiguous.
  *   **Debrief Note:** Remind them that most legal paradoxes aren't logic puzzles; they are language puzzles. The game used logic; reality uses semantics.

  ### Final Facilitation Tip
  If the game ends with them confused and slightly frustrated about "who was right," **you have succeeded.** If they leave thinking they solved the puzzle, you explained too much. The vertigo *is* the learning objective.
