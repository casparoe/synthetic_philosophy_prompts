  **MERIDIAN TRANS-ENVIRONMENTAL RELOCATION SERVICES**
  **INTER-PLANETARY TRANSITION HANDBOOK (SECTOR 7G)**

  **1.0 Semantic Realignment and Vocabulary Usage**
  Upon arrival at your new branch location, please be advised that while your internal qualitative states will remain indistinguishable from your Earth-based baseline, the extension of your natural kind terms will update automatically to match local physical compositions.
  *   **1.1** For example, when you request "water" to hydrate, your vocalization will successfully refer to the clear, drinkable liquid filling the local oceans, despite that liquid possessing a distinct molecular structure (XYZ) from the H2O found at your previous station.
  *   **1.2** Employees should not attempt to mentally adjust definitions prior to landing. Semantic content is not fixed by concepts inside the head but by the surrounding environment. You will mean XYZ simply by being here, regardless of your internal ignorance of the difference.
  *   **1.3** Reference is determined exclusively by the immediate physical composition of the surrounding environment at the time of utterance.

  **2.0 Reference Warranty and Liability**
  Meridian Trans-Environmental Relocation Services explicitly disclaims liability for any semantic drift occurring post-transport.
  *   **2.1** The firm does not warrant that your words will retain their Earth-based truth conditions. If you sign a contract regarding "gold" thinking of element 79, but the local community uses "gold" to refer to a yellow alloy, your signature binds you to the alloy.
  *   **2.2** Misunderstandings arising from externalist meaning fixation are considered operational hazards, not grounds for grievance. You are responsible for the output of your speech acts, even if the content is determined by factors outside your cognitive access.

  **3.0 Personnel Integration and Duplicate Staff**
  You may be introduced to colleagues assembled on-site from local organic matter to facilitate team continuity.
  *   **3.1** These personnel are physical duplicates of your Earth-based teammates, possessing identical memories and personality traits. However, please note that duplicate personnel assembled from local matter without causal history possess no semantic content whatsoever.
  *   **3.2** While they will speak fluently, their utterances lack meaning due to the absence of a historical causal chain linking their words to prior usage. Employees are requested to treat these interactions as meaningful for workflow purposes, despite the ontological emptiness of the exchange.
  *   **3.3** Do not ask duplicates about their past; they have none. Treat the lack of inherited meanings as a confidentiality feature.

  **4.0 Medical Leave and Symptom Verification**
  Health complaints are processed according to the linguistic standards of the local medical community, not the employee's subjective intention.
  *   **4.1** If you report "arthritis" in your thigh, the validity of your claim depends on whether local doctors define "arthritis" as strictly joint inflammation or as a broader rheumatic condition.
  *   **4.2** On Earth, your belief that you have arthritis in the thigh is false. Here, if the community usage includes thigh pain, your belief is true, and your leave is approved. If community usage excludes it, your leave is void.
  *   **4.3** Your pain sensation remains constant; only the truth value of your complaint changes based on external sociolinguistic norms. Please submit forms in triplicate to accommodate potential shifts in diagnostic definitions.

  **5.0 Phased Relocation and Temporal Shifts**
  Employees opting for the Gradual-Transfer Package will move through a series of lock-step transit zones over six months.
  *   **5.1** During this period, there is no single moment at which your meanings shift from Earth-standard to Local-Standard. Semantic content evolves continuously as your environmental exposure increases.
  *   **5.2** Consequently, no employee can pinpoint when their words stopped meaning what they used to mean. If you feel confused about what you meant yesterday, this is a standard feature of the slow-switch process, not a cognitive defect.
  *   **5.3** Retrospective analysis of your own speech acts during transit is discouraged, as the boundary between Earth-meaning and Local-meaning is inherently indeterminate during the phased approach.

  **6.0 Frequently Raised Objections**
  New transfers often worry that if meaning depends on the environment, they cannot know what they mean without first inspecting their surroundings.
  *   **6.1** The company assures you that this epistemic opacity is a feature, not a bug. You do not need to inspect your surroundings to speak meaningfully; the surroundings inspect you.
  *   **6.2** While this implies you cannot know the content of your own thoughts without empirical investigation of the outside world, Meridian guarantees semantic stability during transit.
  *   **6.3** Please direct all existential concerns regarding privileged access to your local line manager.

  **7.0 Acknowledgement**
  By signing below, you confirm that you understand your words now belong to the world, not to you. Welcome to the team.
