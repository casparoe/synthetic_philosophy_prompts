  Discuss the sunk costs (tokens). Students likely felt reluctant to retreat after spending tokens, mirroring political sunk costs in real crises. Finally, reveal the Private Values. Often, students escalate despite low values because they misperceive the opponent's resolve. This maps to the fog of war. The lesson is not that the strategy works, but that it is seductive: it offers a way to win without fighting, but only by gambling with everyone's survival. The paradox is that safety requires retaining control, but victory requires surrendering it.
  Push the ethical implication: To make peace secure, you must make war probable. Ask if anyone felt guilty about adding a die to the pool. That guilt is the ethical cost of deterrence. You are threatening innocence to protect interest. If both sides added dice, the room should have felt tense. That tension is the normal state of nuclear deterrence. Point out that in the game, the probability was known (1/6). In reality, it is unknown, which makes the real choice even harder. The game simplifies the math but preserves the moral burden. Conclude by naming the concept: "The Threat That Leaves Something to Chance." Ensure they understand this is not just a game trick, but a foundational logic of nuclear strategy that has governed global politics for decades.
  Finally, address the outcome. If Catastrophe happened, emphasize that rational escalation led to irrational destruction. If no Catastrophe happened, ask if they were lucky or skilled. Schelling argues it is often luck. This undermines the idea of "successful" deterrence. The game shows that success is invisible (nothing happened), while failure is total. This asymmetry makes learning impossible from history alone. We cannot study successes easily.

