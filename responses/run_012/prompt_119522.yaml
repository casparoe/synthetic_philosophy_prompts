  **0–15 min: Setup.** Divide class into four teams. Distribute materials. Read rules aloud. Emphasize no theory discussion. Teams open Value Cards privately.
  **15–60 min: Gameplay.** Run two simultaneous conflicts. Instructor rolls dice publicly. Allow 2 minutes for negotiation between rounds. Play until resolution or 10 rounds. If a game ends early, reset for a second round with new Value Cards to vary conditions.
  **60–90 min: Debrief.** Collect scores. Do not reveal winner yet. Ask students how they felt during the Tripwire decision. Reveal the theoretical framework. Connect their choices to Schelling's logic. Discuss the ethics of risking catastrophe for credibility.

