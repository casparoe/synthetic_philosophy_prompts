  1. "The idea and the setting"
  The game models Schelling's "threat that leaves something to chance." Students experience the paradox where making a threat credible requires surrendering control over the outcome. By voluntarily introducing a risk of mutual disaster—via a mechanical "tripwire"—players signal resolve more effectively than through deliberate promises. The setting is a seminar room transformed into a strategic landscape. Two pairs of teams compete simultaneously on whiteboard ladders. The goal is not to win points, but to feel the tension of escalating risk. The design forces students to choose between safety and credibility, embodying the ethical and strategic cost of nuclear deterrence without initial theoretical framing.

  2. "Materials and setup"
  *   **Students:** 16 divided into 4 teams (Alpha, Beta, Gamma, Delta). Alpha vs. Beta; Gamma vs. Delta.
  *   **Board:** Two ladders drawn on the whiteboard, numbered 1 (Status Quo) to 6 (Catastrophe).
  *   **Tokens:** 20 colored magnets or sticky notes per pair (representing mobilization costs).
  *   **Cards:** 4 envelopes per team containing private "Value Cards" (10, 20, or 30 points).
  *   **Dice:** Two d6 placed centrally (the "Risk Pool").
  *   **Setup:** Teams sit facing opponents. Each receives 5 tokens and one Value Card (hidden). A marker is placed at Step 1 on each ladder. No discussion of theory is permitted before play.
  *   **Instructor:** Acts as banker and dice roller. Maintains pace. Records scores publicly. Ensures rules are followed without interpreting strategy.

  3. "The rules"
  1.  **Objective:** Force the opponent to Retreat while avoiding Catastrophe. The winner gains their Private Value minus sunk costs.
  2.  **Setup:** Each pair receives a ladder track (Steps 1–6) drawn on the board. Place a marker at Step 1. Each team gets 5 tokens and one sealed Value Card (10, 20, or 30 points). Do not open cards yet.
  3.  **Turns:** Play proceeds in rounds. In each round, both teams secretly write "Hold," "Retreat," or "Escalate" on index cards. Reveal simultaneously to ensure fairness.
  4.  **Escalate:** Move your pair's marker up one step on the ladder. Place 1 token from your supply onto the board step (sunk cost). You cannot retrieve tokens later. Spending tokens makes Retreat costly because you admit waste of political capital.
  5.  **The Tripwire Choice:** When Escalating, you may declare "Tripwire Active." If chosen, place a d6 face-up on the table. This die is now part of the Risk Pool. At the start of *every* subsequent round, before actions are revealed, the instructor rolls all dice in the Risk Pool. If any die shows a 1, Catastrophe occurs immediately.
  6.  **Irreversibility:** Once a Tripwire is activated, it cannot be deactivated. You have handed control to chance. The opponent sees the die clearly, knowing the risk is now mechanical. This increases the probability of mutual loss to prove you are not bluffing.
  7.  **Retreat:** Marker stays. You lose all sunk tokens placed on the board. Opponent wins their Private Value minus their own costs.
  8.  **Hold:** No movement, no cost, no risk added.
  9.  **Catastrophe:** If the marker reaches Step 6 or a Tripwire rolls 1, both teams score -50. The game ends instantly.
  10. **Communication:** Teams may talk freely between rounds to threaten or bargain. However, no written agreements are enforceable. You may lie about your Value Card or intentions to mislead. Private Values remain hidden until the game ends. This uncertainty drives escalation; you do not know if the opponent values the prize enough to risk the Tripwire.
  11. **Risk Accumulation:** The Risk Pool is public. If both sides activate Tripwires, two dice are rolled each round, doubling the catastrophe risk. This creates a race where safety diminishes with every signal of resolve.
  12. **Instructor Role:** The instructor acts as the Bank and Dice Roller. Do not offer advice. Record scores on the board visibly. If students ask about strategy, reply: "The rules are the strategy." Ensure the dice roll is dramatic and visible to all.
  13. **End:** Game ends when one team Retreats, Catastrophe occurs, or 10 rounds pass (draw, 0 points).

  4. "Payoffs"

  | Outcome | Payoff |
  | :--- | :--- |
  | **Win (Opponent Retreats)** | Private Value (10/20/30) minus Tokens Spent |
  | **Lose (You Retreat)** | 0 minus Tokens Spent |
  | **Catastrophe (Die=1 or Step 6)** | -50 points (Both sides) |
  | **Draw (10 Rounds)** | 0 points |

  Points translate to seminar participation credit. The incentive to escalate exists because the Prize Value is private. If you value the prize at 30, you are willing to risk more than a team valuing it at 10. However, because values are hidden, a low-value team might bluff high risk to scare a high-value team. The Tripwire makes the bluff dangerous: you might win the prize, but you might also trigger the -50 catastrophe. This mirrors the real cost of nuclear brinkmanship: credibility is purchased with shared safety.

