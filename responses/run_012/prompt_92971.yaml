  FOR IMMEDIATE RELEASE

  **Contact:**
  Sarah Jenkins, Director of Communications
  [semail@museumemail.com]
  [555-0199]

  **[MUSEUM NAME] RECONTEXTUALIZES ICONIC WORK WITH LAUNCH OF "HALL OF BEAUTIFUL LIES"**

  **OAKDALE, OH – March 15, 2024** — The [Museum Name] today announced a bold new curatorial direction following the technical reanalysis of its signature work, *Harbor at Twilight*. Previously attributed to the 17th-century Dutch master Claes van der Heyden, the painting has been reclassified as a 1930s production by the noted copyist Elias Vane. Despite the change in provenance, the Board of Trustees has voted unanimously to keep the work on permanent display.

  The reclassification stems from a letter discovered by a graduate student last autumn, in which Vane admitted to the deception sixty years after his death. While traditional museum practice might dictate deaccessioning or relegating such a work to storage, the [Museum Name] is choosing to highlight the complexity of aesthetic value. To this end, the museum's West Wing will be rebranded as the "Hall of Beautiful Lies."

  "We are committed to the truth, but we are also committed to the experience," said Museum Director Dr. Eleanor Vance. "When you stand before *Harbor at Twilight*, the light hits your eye the same way it did in 1974. The brushwork remains virtuosic. In fact, our conservators note that Vane's technique is arguably more sophisticated than van der Heyden's. To remove the painting would be to privilege a name over a visual reality. It suggests that value resides solely in a chain of ownership rather than the object itself. We believe the paint on the canvas is what matters, not the story we tell ourselves about where it came from."

  The Hall of Beautiful Lies will serve as a dedicated space for works where authorship is contested, complicated, or entirely fabricated. The initiative aims to transform a potential scandal into a teaching moment about the nature of authenticity. However, Dr. Vance noted that maintaining such a high-profile exhibition requires sustainable funding models to ensure the institution's longevity and ability to serve the public.

  "To support this level of transparency and the additional interpretive materials required, we are introducing a tiered admission structure," Vance continued. "General admission will cover the permanent collection, but access to the Hall of Beautiful Lies will be available through a Premium Patron ticket. This tier reflects the heightened contextual experience and the unique opportunity to engage with art history's gray areas."

  Additionally, the museum gift shop will now offer a Certificate of Inauthenticity for *Harbor at Twilight*. Printed on archival stock, the certificate provides buyers with verified documentation of the work's fraudulent origins, serving as a commemorative acknowledgment of the piece's complex history.

  "We are not asking visitors to pay to be lied to," Vance concluded. "We are asking them to support the truth about the lie. That nuance is worth preserving, and it is worth sustaining."

  The Hall of Beautiful Lies opens to the public on April 1.

