      *   **Core Problem:** "Constraint Debt." When a source constraint (e.g., lipogram avoiding 'E') is impossible or radically different in the target language, do you owe a compensatory constraint? How do you measure "comparability"?
      *   **Related Questions:** Semantic vs. packaging, equivalence of constraint vs. effect, translatability of constraints.
      *   **Goal:** Prioritize these questions. Identify which are "load-bearing" vs. "craft talk." Determine tractability for a non-experimental, text-based approach. Identify if "constraint debt" is a red herring.
      *   **Format:** Reasoning-heavy, not just a list. Explain upstream/downstream relationships.

  2.  **Deconstruct "Constraint Debt":**
      *   Is it a real problem? Yes, practically. Is it a *theoretical* crux? Maybe not.
      *   It feels like a specific instance of a broader problem: *Equivalence in Constrained Translation.*
      *   The term "debt" implies a moral or aesthetic obligation. This is the tricky part.
      *   If I can't avoid 'E' in English, do I need to avoid 'A'? Or do I need to write a sonnet instead of a free verse? Or do I just accept the loss?
      *   *Hypothesis:* "Constraint Debt" is a downstream symptom of the upstream question: *What is the function of the constraint in the source text?*

  3.  **Map the Question Hierarchy (Upstream/Downstream):**
      *   *Upstream:* What does the constraint *do*? (Function/Teleology)
      *   *Midstream:* How do we measure equivalence? (Effect vs. Form)
      *   *Downstream:* How do we compensate? (Constraint Debt)
      *   *Reasoning:* You can't decide if you owe a debt until you know what the constraint was *for*. If the lipogram was a gimmick, maybe no debt. If it was thematic (e.g., avoiding 'E' because the poem is about absence), then the debt is high.
      *   *Tractability:* Function is analyzable through close reading. "Comparability of restrictiveness" is a linguistic quagmire (hard to measure without corpora/stats). "Equivalence of effect" is subjective but discussable in a group.

  4.  **Evaluate "Constraint Debt" as a Concept:**
      *   Is it fake? It's not *fake*, but it's likely the wrong framing. It frames the issue as an accounting problem (balancing the books) rather than an aesthetic one (recreating the experience).
      *   *Better Crux:* **Constraint Functionality.** Is the constraint constitutive of meaning or merely decorative?
      *   *Why:* Hofstadter's *Le Tonbeau de Marot* argues that the "soul" of the poem often resides in the form. But sometimes the form *is* the content (Oulipo).
      *   *Linguistic Reality:* You are right that letter frequencies make strict equivalence impossible. A lipogram in French is not the same "difficulty" as in English. Therefore, "restrictiveness" is not a stable metric across languages. This makes "Constraint Debt" based on restrictiveness a dead end for a small group without corpus tools.

  5.  **Develop the Recommendation Strategy:**
      *   **Focus:** Shift from "How do we balance the debt?" to "What work is the constraint doing?"
      *   **Tractability:** This is solvable with close reading and discussion (the group's strength). It doesn't need stats.
      *   **Semester Plan:** Use the semester to test this hypothesis on specific texts.
      *   **Merge Questions:** "Semantic vs. Packaging" and "Equivalence of Constraint vs. Effect" are actually the same question viewed from different angles. They both ask: *Is the form meaningful?*

  6.  **Drafting the Argument (Iterative refinement):**
      *   *Intro:* Validate the "Constraint Debt" intuition but challenge the framing.
      *   *The Upstream Question:* Function over Form. The "Why" before the "How."
      *   *The "Fake Problem" Aspect:* Restrictiveness is unmeasurable cross-linguistically without heavy data. Don't waste time on it.
      *   *The Real Crux:* Constitutive vs. Decorative constraints.
      *   *Actionable Advice:* How to run the group. Pick pairs. Analyze function. Translate. Compare.
      *   *Hofstadter/Oulipo Context:* Acknowledge them but note they often disagree (Hofstadter wants the soul, Oulipo wants the structure). The group needs to pick a lane or acknowledge the tension.

  7.  **Refining the "Constraint Debt" Verdict:**
      *   It's not fake, but it's a *solution* looking for a *problem*. It assumes the goal is "equal difficulty." But the goal should be "equal impact."
      *   So, rank "Equivalence of Effect" higher than "Equivalence of Constraint."
