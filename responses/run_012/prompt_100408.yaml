answer: |-
  Here is the blunt assessment: **"Constraint Debt" is a downstream symptom, not the disease.** It is a useful metaphor for group discussion, but a terrible metric for decision-making. If you spend your semester trying to quantify "restrictiveness" across languages, you will drown in corpus linguistics and produce very little translation.

  The real load-bearing question is upstream of debt, restrictiveness, and even equivalence. It is this: **Is the constraint constitutive of the poem's meaning, or is it a vessel for it?**

  Here is the reasoning for why you should rank the questions this way, how they map to your constraints (time, budget, expertise), and where the "Constraint Debt" concept actually fits.

  ### 1. The Upstream Crux: Teleology of the Constraint
  **Question:** *What work is the constraint doing in the source text?*
  **Status:** **Load-bearing.**
  **Tractability:** High (Close reading).

  This is the only question that matters initially because it dictates the answer to all the others. In constrained writing (Oulipo, etc.), constraints range from **decorative** (a rhyme scheme that could be changed without altering the semantic core) to **constitutive** (the lipogram *is* the point; the poem is about absence, so the missing letter is semantic).

  *   **If the constraint is decorative:** You owe no debt. You can swap a French alexandrine for an English iambic hexameter, or drop a rhyme scheme if it forces awkward syntax. The "soul" is in the imagery/narrative.
  *   **If the constraint is constitutive:** You owe a massive debt. If Perec writes *La Disparition* (no 'e'), the missing letter *is* the theme. Translating it into English without a lipogram is not a translation; it's a summary.

  **Why this is upstream:** You cannot calculate "debt" until you know what you are in debt *for*. If the constraint is just packaging, the debt is zero. If the constraint is the engine, the debt is total. Your linguistics background helps here: you can analyze the source text to see if the constraint drives lexical choice (constitutive) or just fits around it (decorative).

  ### 2. The Midstream Metric: Equivalence of Experience
  **Question:** *Does the target reader feel the same tension/playfulness as the source reader?*
  **Status:** **Tractable Goal.**
  **Tractability:** Medium (Group discussion/Reader response).

  This replaces "Equivalence of Constraint." You correctly identified that "restrictiveness" is not well-defined cross-linguistically. Dodging 'E' in French is hard; in English, it is exponentially harder. Dodging 'Z' in English is trivial; in Polish, it might be impossible. Comparing "difficulty" is a statistical rabbit hole you cannot afford without a corpus team.

  Instead, aim for **Equivalence of Experience**.
  *   Does the reader stumble in the same places?
  *   Does the reader sense the same cleverness?
  *   Does the form feel as tight (or as slack) as the original?

  **Why this moves up:** This is solvable in a reading group. You can read the translation aloud and ask, "Does this feel as constrained as the original feels?" It relies on poetics and intuition, which fits your "no money/experiments" constraint. It acknowledges Hofstadter's view (in *Le Tonbeau de Marot*) that the "music" and "struggle" must survive, even if the specific notes change.

  ### 3. The Downstream Symptom: Constraint Debt
  **Question:** *Do we need a compensating constraint?*
  **Status:** **Diagnostic Tool.**
  **Tractability:** Low (as a rule), High (as a creative prompt).

  "Constraint Debt" is not a theoretical problem; it is a creative heuristic. It is fake as a *rule* (there is no universal law demanding compensation) but real as a *feeling*.

  *   **When it's real:** You drop a rhyme scheme, and the poem feels too loose. You feel a "debt" of tightness. You might compensate by adding alliteration or a stricter meter to restore the tension.
  *   **When it's fake:** You drop a lipogram on 'E' because English can't handle it, and you don't add a new constraint. If the poem still works, there was no debt.

  **Why this moves down:** If you treat Debt as a prescriptive rule ("I *must* compensate"), you will produce forced, artificial translations. If you treat it as a diagnostic ("Does this feel too slack?"), it becomes useful. Do not try to define "comparability" of constraints theoretically; define it pragmatically in the room. "Does this sonnet feel as heavy as that villanelle?"

  ### 4. The Dead End: Restrictiveness Metrics
  **Question:** *Is restrictiveness well-defined across languages?*
  **Status:** **Ignore.**
  **Tractability:** Near Zero (for your setup).

  You asked if restrictiveness is well-defined when languages have different stats. The answer is **no**, not without massive computational backing.
  *   Rhyme richness varies wildly (Italian vs. English).
  *   Syllable timing varies (stress-timed vs. syllable-timed).
  *   Letter frequency varies.

  To answer this theoretically, you'd need to normalize constraint difficulty across corpora. That is a PhD thesis in computational linguistics, not a semester-long translation group. **Drop this.** It is "craft talk dressed up as theory," exactly as you suspected. It distracts from the actual work of translating.

  ### The Semester Strategy

  If I were running this group with your constraints, here is how I would structure the inquiry to avoid the theoretical swamp:

  1.  **Select Pairs, Not Rules:** Don't debate theory in the abstract. Pick a source poem with a clear constraint (e.g., a sonnet, a lipogram, a Sapphic stanza).
  2.  **Analyze Function (Week 1-2):** Before translating, the group must agree: Is this constraint constitutive or decorative? *This is your linguistic/poetic analysis phase.*
  3.  **Translate for Experience (Week 3-6):** Attempt translations. Some try to keep the exact constraint (even if it breaks the sense). Some try to keep the sense (and drop the constraint). Some try to compensate (Constraint Debt).
  4.  **Blind Review (Week 7-10):** Read the translations without knowing the strategy. Ask: "Which one feels like the original?" This tests **Equivalence of Experience**.
  5.  **Post-Mortem (Week 11-14):** Reveal the strategies. Discuss where "Constraint Debt" was felt. Did the compensatory constraint work?

  ### Summary of Ranking

  1.  **Teleology (Constitutive vs. Decorative):** **UPSTREAM.** Determines the entire approach. Tractable via close reading.
  2.  **Equivalence of Experience:** **GOAL.** Replaces "Equivalence of Constraint." Tractable via group discussion.
  3.  **Constraint Debt:** **TOOL.** Useful for diagnosing "slack," but not a prescriptive rule.
  4.  **Restrictiveness Metrics:** **TRAP.** Theoretically interesting, practically impossible for your setup.

  ### The Real Crux
  The real crux isn't debt; it's **fidelity to the struggle.**
  Hofstadter argues that the struggle *is* the meaning in constrained poetry. If the original poet sweated to find a rhyme, and you find an easy one, you have betrayed the poem, even if the sense is perfect. If the original poet dodged 'E' to evoke loss, and you dodge 'Z' (which is easy), you have evaded the struggle.

  So, reframe "Constraint Debt" as **"Fidelity to Struggle."**
  *   If the source constraint was a struggle, the target must impose a comparable struggle (even if it's a different constraint).
  *   If the source constraint was a game, the target must be playful.

  This bypasses the need to measure "restrictiveness" mathematically. You measure it by how much the translator had to fight the language. That is something your group can feel, discuss, and evaluate without a single dollar or corpus.
