prompt: |-
  I am running a seventy-five-minute session for a graduate reading group — mostly statisticians and machine-learning people, with two philosophers — on Solomonoff induction and Kolmogorov complexity, and I want a plan for how to explain it rather than the explanation. I mean to open with a question instead of a definition: suppose you had to commit in advance to a probability for every finite binary string, with no data and no particular model class to lean on, in such a way that you could never be convicted of incoherence — what would you write down? Give me the order in which the pieces must then arrive for that opening to pay off, what each depends on, and in particular when the universal machine has to enter, when the 2^−l(p) weighting has to enter, and why the prefix-free condition cannot simply be waved through. Give me the one example to carry the session, with what it must exhibit and what it must not presuppose, and say what a coin-tossing illustration fails to do that it must do. Then the misconceptions in the order they will surface, each with the exact point in the sequence at which it must be headed off: I expect this audience to identify the whole thing with minimum description length, to treat Occam's razor as an independent principle that it merely formalises, to assume that uncomputability makes it idle, and to miss that the simplicity weighting is derived rather than assumed. Tell me what I should openly refuse to cover in the time, and one closing question that would show whether they have understood why the weighting falls out. State how confident you are in the plan and single out the step you are least sure of. Please write in British English.
