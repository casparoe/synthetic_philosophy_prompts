answer: |-
  ### Session Plan: Solomonoff Induction and Kolmogorov Complexity
  **Duration:** 75 minutes
  **Audience:** Graduate statisticians, ML researchers, two philosophers.

  ---

  #### 1. The Opening Gambit (00:00 – 00:10)
  **Action:** Pose the opening question exactly as drafted. Do not define terms yet.
  **The Question:** "Suppose you had to commit in advance to a probability for every finite binary string, with no data and no particular model class to lean on, in such a way that you could never be convicted of incoherence — what would you write down?"

  **Dependencies:**
  *   The audience must recognise 'incoherence' as violating the axioms of probability (specifically, that the sum of probabilities over the sample space must not exceed 1).
  *   Statisticians will immediately spot the impossibility of a uniform prior over a countably infinite set.
  *   Philosophers will spot the epistemic burden of assigning probabilities without evidence.

  **Goal:** Establish the need for a *dominant prior* that dominates all computable measures. Do not accept answers yet; park them on the board.

  #### 2. The Coherence Constraint and the Weighting (00:10 – 00:25)
  **Sequence:**
  1.  **The Counting Argument:** Show that there are $2^n$ strings of length $n$. If you assign probability based on length alone, say $f(n)$, then $\sum 2^n f(n) \le 1$.
  2.  **Enter the Weighting ($2^{-l(p)}$):** This is the critical juncture. You must derive this, not state it.
      *   Argue that to satisfy the sum constraint for *any* possible assignment of strings to descriptions, the probability assigned to a description of length $l$ must decay exponentially.
      *   **Why here?** You cannot introduce the Universal Machine yet, or they will attribute the weighting to the machine's architecture rather than the logic of probability mass conservation.
  3.  **Head Off Misconception (Derived Simplicity):** At minute 20, explicitly state: "We have not assumed Occam's Razor. We have derived a simplicity bias from the requirement of coherence over a binary space."
      *   *Reason:* Statisticians often treat simplicity as a regularisation hyperparameter. You must show it is a budget constraint.

  #### 3. The Prefix-Free Condition (00:25 – 00:35)
  **Sequence:**
  1.  **The Overlap Problem:** Ask what happens if one valid program is `01` and another is `011`. If the machine reads `01` and halts, does it also read `011`?
  2.  **Enter the Prefix-Free Condition:** Explain that the set of valid programs must be a prefix code.
      *   **Why not wave it through?** If you skip this, the sum $\sum 2^{-l(p)}$ is not guaranteed to converge to $\le 1$ (Kraft's Inequality). Without this, the 'incoherence' from the opening question returns. The probability mass would double-count.
  3.  **Visual Aid:** Use a binary tree. Valid programs are leaves. No leaf can be an ancestor of another.

  #### 4. The Universal Machine (00:35 – 00:50)
  **Sequence:**
  1.  **The Reference Machine:** Now introduce the Turing Machine.
      *   **Timing:** It enters *after* the weighting and prefix conditions are established. This ensures they understand the *measure* before the *mapping*.
  2.  **Invariance:** Explain that changing the machine changes the probabilities only by a constant factor (the Invariance Theorem).
  3.  **The Carrying Example:** **"The Sequence `010101...` versus `101100...`"**
      *   **Usage:** Use this specific pair throughout the remainder.
      *   **What it must exhibit:** Show that for the repeating sequence, there exists a very short program (e.g., `print('01' * n)`), yielding high probability ($2^{-\text{short}}$). For the random-looking string, the shortest program is roughly the string itself, yielding low probability ($2^{-\text{long}}$).
      *   **What it must not presuppose:** Do not assume the audience knows the strings are generated by a coin or a rule. They must see the probability assignment comes from the *existence* of the program, not knowledge of the generator.
      *   **Why Coin-Tossing Fails:** A coin-tossing illustration assigns $2^{-n}$ to *both* strings. It fails to discriminate structure from noise. It treats all strings of length $n$ as equiprobable, which violates the intuition that `000...0` is 'more likely' to continue than a random string in an inductive setting. Solomonoff captures this; coin-tossing does not.

  #### 5. Solomonoff Induction and Uncomputability (00:50 – 01:05)
  **Sequence:**
  1.  **Definition:** Define $M(x) = \sum_{p:U(p)=x*} 2^{-l(p)}$. Emphasise the sum over *all* programs, not just the shortest.
  2.  **Head Off Misconception (MDL):** At minute 55, distinguish from Minimum Description Length.
      *   *Point:* MDL selects the *single* shortest model. Solomonoff *averages* over all models weighted by length. MDL is a point estimate; Solomonoff is a Bayesian mixture.
  3.  **Head Off Misconception (Uncomputability):** At minute 60.
      *   *Point:* Acknowledge it is uncomputable (Halting Problem). Frame it not as 'idle' but as the 'Bayes Optimal Classifier' for induction. We approximate it (e.g., via compression), just as we approximate posterior distributions in MCMC.

  #### 6. Misconceptions and Scope Management (01:05 – 01:10)
  **Sequence of Misconceptions to Head Off:**
  1.  **Occam's Razor as Independent:** (Headed off at minute 20). It is a consequence, not an axiom.
  2.  **Simplicity Weighting as Assumed:** (Headed off at minute 20). It is derived from Kraft's inequality.
  3.  **Identity with MDL:** (Headed off at minute 55). Sum vs. Min.
  4.  **Uncomputability implies Uselessness:** (Headed off at minute 60). Ideal vs. Approximation.

  **What to Refuse to Cover:**
  *   **Chaitin's $\Omega$:** It distracts into algorithmic randomness theory rather than induction.
  *   **The History of Priority:** (Solomonoff vs. Kolmogorov). Irrelevant to the logic.
  *   **AIXI details:** Mention only as an application, do not explain the reinforcement learning loop.
  *   **Proof of the Invariance Theorem:** State it, do not prove it.

  #### 7. Closing Question (01:10 – 01:15)
  **Action:** Return to the opening constraint.
  **The Question:** "In the weighting $2^{-l(p)}$, the base 2 matches the binary alphabet of the program tape. If we were to use a weighting of $1/l(p)^2$ instead, which satisfies convergence, why does this fail the specific requirement of the opening question regarding *incoherence* across all possible extensions?"

  **Expected Answer:** They should identify that while $\sum 1/l^2$ converges, it does not account for the *count* of available programs at each length. There are $2^l$ programs of length $l$. The total mass would be $\sum 2^l \cdot (1/l^2)$, which diverges. The exponential weighting is required to counterbalance the exponential growth of the hypothesis space.

  ---

  ### Confidence and Uncertainty
  **Confidence:** 85%. The logical flow from coherence $\to$ coding $\to$ machine is robust for this audience profile.
  **Least Sure Step:** The transition at **Minute 35 (The Universal Machine)**. There is a risk that the statisticians will fixate on the arbitrariness of the reference machine (the 'constant' in the Invariance Theorem) and derail the session into a discussion on objective priors. I must be prepared to firmly table the 'constant' issue as asymptotically negligible for long strings to keep to time.
