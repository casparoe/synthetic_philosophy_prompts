  6.  **Addressing Misconceptions:**
      *   *MDL Identification:* Stats/ML people will jump to "It's just MDL". Need to distinguish: MDL is a *method*, Solomonoff is a *theoretical ideal*. MDL minimises length; Solomonoff sums over all.
