      *Re-evaluating the "Coin Tossing" constraint:* Coin tossing implies $P(x) = 2^{-n}$ for all $x$ of length $n$. Solomonoff implies $P(x)$ varies wildly. The example must show two strings of equal length having vastly different probabilities.

