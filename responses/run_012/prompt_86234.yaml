      *   **The User's Suspicion:** The slogan is doing too much work.
      *   **Task:** Lay out distinct precise claims the slogan could make (trivial to radical).
      *   **Requirements for each claim:** State thesis exactly, classify (analytic/substantive), assess defensibility, assess support for participant's conclusion.
      *   **Specific Focus:** Distinguish between (a) non-identity, (b) no predictive belief required, (c) compatibility with belief one won't act, (d) commitment outliving reasons.
      *   **Final Analysis:** Identify the most likely intended meaning, what a predictive theorist should accept, and distinguish settled vs. contested ground.
      *   **Constraint:** No citations or reading list.

  2.  **Deconstruct the Toxin Puzzle:**
      *   *Setup:* Get money tonight if you intend to drink toxin tomorrow. Money deposited tonight. Drink tomorrow.
      *   *Problem:* Once money is in the bank, no reason to drink. If you are rational, you know you won't drink. If you know you won't drink, can you intend to drink?
      *   *Standard View (Bratman/etc.):* Intention involves a belief that one will (or likely will) act. Therefore, you can't intend to drink if you know you won't.
      *   *Participant's View:* You *can* intend. "Intention is not a prediction."

  3.  **Brainstorming Interpretations of "Intention is not a prediction":**

      *   *Interpretation 1 (Semantic/Category):* The word "intention" means something different than "prediction." One is first-person/practical, the other is third-person/theoretical.
      *   *Interpretation 2 (Psychological State):* The mental state of intending is not identical to the mental state of predicting.
      *   *Interpretation 3 (Doxastic Requirement - Weak):* Intending doesn't *require* believing you will do it (maybe just hoping?).
      *   *Interpretation 4 (Doxastic Requirement - Strong/Participant's):* Intending is compatible with believing you *won't* do it. (This is the controversial one needed for the Toxin).
      *   *Interpretation 5 (Normative/Commitment):* Intention is a commitment to make it true, whereas prediction is a guess about what is true.
      *   *Interpretation 6 (Metaphysical):* Intentions cause actions; predictions just track them.

  4.  **Developing the Specific Readings (Drafting & Refining):**

      *   *Reading 1: Non-Identity (Conceptual).* Thesis: The concept of intention is not the concept of prediction.
          *   Analytic? Yes, mostly.
          *   Defensible? Yes.
          *   Supports Participant? No. (Doesn't show you can intend while believing you won't).
      *   *Reading 2: Non-Identity (Psychological).* Thesis: The mental state of intending is not token-identical to the mental state of predicting.
          *   Substantive? Yes.
          *   Defensible? Yes (functional roles differ).
          *   Supports Participant? No.
      *   *Reading 3: Independence of Belief (Weak).* Thesis: One can intend without having a *confident* predictive belief (e.g., trying).
          *   Substantive.
          *   Defensible? Plausible for difficult tasks.
          *   Supports Participant? No. Toxin isn't about difficulty; it's about rationality.
      *   *Reading 4: Compatibility with Negative Belief (Strong/Participant).* Thesis: One can intend to $\phi$ while believing one will *not* $\phi$.
          *   Substantive.
          *   Defensible? Highly contested (violates Strong Belief Thesis).
          *   Supports Participant? Yes, directly.
      *   *Reading 5: Normative Commitment.* Thesis: Intention is a commitment to act, prediction is a claim about fact.
          *   Substantive/Normative.
          *   Defensible? Yes.
          *   Supports Participant? Only if commitment can exist without expectation of success.
      *   *Reading 6: Causal Role.* Thesis: Intentions guide action; predictions describe it.
          *   Substantive.
          *   Defensible? Yes.
          *   Supports Participant? Irrelevant to the belief constraint.

  5.  **Addressing the Specific Focus Areas (a-d):**
      *   (a) Non-identity: Covered in Readings 1 & 2.
      *   (b) No predictive belief required: Covered in Reading 3.
      *   (c) Compatible with belief one will not act: Covered in Reading 4.
      *   (d) Commitment outliving reasons: Covered in Reading 5.

  6.  **Evaluating Defensibility and Consensus:**
      *   *Settled:* Intention $\neq$ Prediction (conceptually/psychologically). Most philosophers agree intentions have a different functional role (guidance vs. description).
      *   *Contested:* The "Strong Belief Thesis" (Intention entails belief one will act). The Toxin Puzzle is specifically designed to attack this.
      *   *Participant's Error:* Conflating "Intention is not *identical* to prediction" (Settled/True) with "Intention does not *require* belief" (Contested/False on standard views).

  7.  **Drafting the Response (incorporating constraints):**
      *   Structure: Introduction -> Distinct Readings (numbered) -> Analysis of (a-d) -> Conclusion on Consensus/Contest.
      *   Tone: Analytical, precise, neutral.
