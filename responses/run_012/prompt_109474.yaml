  3. Comment on whether the answer actually addresses the question that was asked, including whether the conclusion follows from the argument the student gives.
  4. Assign a grade on a 0 to 100 scale, with a letter grade, and give a one-sentence justification of the grade that could be shown to the student.

  End your response with a final line of exactly this form:

  \answer{NN/100 (L)}
