answer: |-
  Your hypothesis is astute, and it correctly identifies the fault lines where the discussion tends to fracture. However, to diagnose the stalemate fully, we must determine whether these fault lines are merely terminological or whether they mark genuine metaphysical rifts. After testing your proposal against the three positions you outlined, my diagnosis is that the dispute is neither purely verbal nor wholly substantive, but rather a **category error regarding the taxonomy of concepts**. The parties are arguing over the logic of inference while implicitly disagreeing about the ontology of the terms being inferred.

  Here is an analysis of your two hypotheses, followed by a classification of the dispute and a proposal for progress.

  ### 1. Testing the Hypothesis on 'Entailment'

  You suggest one camp uses 'entailment' in a deductive, formal sense, while the other uses it in a sense closer to justification.

  This is partially correct but misses a crucial nuance. All three camps generally agree on the rules of classical logic. Camp A (Separationists), Camp B (General Inference Critics), and Camp C (Analytic Bridge Proponents) all accept that for a conclusion to follow validly, the truth of the premises must guarantee the truth of the conclusion. There is no significant faction arguing for a special 'normative logic' that violates *modus ponens*.

  The divergence lies not in the definition of entailment, but in the **transparency of the premises**.
  *   **Camp A** insists that for an entailment to cross the gap, the normative content must appear explicitly in the premises. If it is hidden in a bridge principle, they view the principle as a covert normative premise, rendering the derivation circular.
  *   **Camp B** argues that all entailment requires 'bridge principles' (e.g., micro-physics to macro-biology), so the demand for explicit normative premises is a category mistake. They view the 'gap' as an epistemic feature of reduction, not a logical barrier.
  *   **Camp C** argues that the bridge principle is analytic, meaning the normative content is *already* contained in the descriptive premise (e.g., 'promise'), making the derivation tautological rather than inferential.

  Therefore, the disagreement is not about the *mechanism* of entailment, but about the **cost of admission** for a premise. Camp A demands a toll (explicit normative content) that Camp B says is never charged in any other domain, and Camp C says is already paid by the definition of the terms.

  ### 2. Testing the Hypothesis on 'Bridge Principles'

  Your second hypothesis—that the concealed disagreement concerns whether bridge principles are descriptive or normative—is the stronger diagnostic tool. This is where the substantive work is being done.

  *   **For Camp A**, a bridge principle like 'suffering is to be avoided' is inherently normative. To include it is to admit an 'ought' premise. Thus, the gap remains unclosed.
  *   **For Camp B**, such a principle is a functional or natural law. It is descriptive of how organisms flourish. To them, calling it 'normative' begs the question against naturalism.
  *   **For Camp C**, the principle is semantic. It is a rule of language or institutional fact (like the rules of chess). It is descriptive of a social practice that *constitutes* the normativity.

  The stalemate persists because 'descriptive' and 'normative' are not stable categories across these frameworks. To a non-naturalist (Camp A), 'normative' denotes a sui generis property. To a naturalist (Camp B), it denotes a functional role. To an institutionalist (Camp C), it denotes a status function. When they argue about whether a bridge principle is descriptive, they are actually arguing about **moral ontology** under the guise of **logical syntax**.

  ### 3. Classification of the Dispute

  Is this a verbal dispute, a case of different questions, or a genuine disagreement?

  It is a **deep verbal dispute sheltering a genuine metaphysical disagreement**.

  It is 'verbal' in the sense that if the parties agreed on a definition of 'normative property', the logical dispute would largely dissolve. If Camp A and Camp B agreed that moral properties are natural functional kinds, Camp A's objection would vanish. If they agreed they are non-natural, Camp B's objection would fail.

  However, it is 'genuine' because the inability to agree on definitions is not merely linguistic; it reflects incompatible views on the fabric of reality. Camp A believes normativity is ontologically distinct; Camp B believes it is continuous with science; Camp C believes it is constitutive of social reality. They are using the is–ought gap as a proxy war for metaethical ontology.

  Consequently, the dispute is also a case of **different questions sheltering under one heading**.
  1.  **The Logical Question:** Can one construct a valid argument from 'is' premises to an 'ought' conclusion? (Answer: Yes, trivially, if one allows analytic bridges or begs the question).
  2.  **The Epistemic Question:** Can one come to know an 'ought' solely through empirical investigation? (This is what Camp B is really asking).
  3.  **The Metaphysical Question:** Are moral properties reducible to natural properties? (This is what Camp A is really defending).

  The reading group is stuck because you are treating the Logical Question as the primary battlefield, when it is merely the trench line for the Metaphysical War.

  ### 4. What Would Count as Progress?

  Given this diagnosis, a formal result is unlikely to resolve the stalemate. Arthur Prior's famous 'tonk' argument already demonstrated that one can formally derive anything if one defines connectives loosely, which merely pushes the problem back to the legitimacy of the concepts.

  Progress would instead require one of the following two moves:

  **A. A Distinction (The Semantic/ontological Split)**
  The group should distinguish between the **Semantic Gap** (can moral terms be defined by non-moral terms?) and the **Ontological Gap** (do moral properties supervene on natural properties?).
  *   Camp C is usually addressing the Semantic Gap (via thick concepts or institutional facts).
  *   Camp A is usually addressing the Ontological Gap (via non-naturalism).
  *   Camp B is usually addressing the Explanatory Gap (via naturalism).
  Acknowledging that one can close the Semantic Gap (Camp C) without closing the Ontological Gap (Camp A) might allow the parties to see they are not contradicting one another, but addressing different layers of the problem.

  **B. An Argument that None Should Be Expected (Conceptual Pluralism)**
  The most fruitful path may be to argue that the is–ought distinction is not a binary switch but a **gradient of normativity**. If 'normativity' is not a single property but a cluster concept (involving authority, motivation, reason-giving, and evaluation), then the demand for a single 'bridge' is a mistake. Progress would be a consensus that the gap is not a single chasm to be bridged, but a series of small steps involving different kinds of normative force. This would dissolve the demand for a 'master bridge principle'.

  ### Recommendation

  To break the two-year cycle, I suggest you suspend the question of entailment entirely. It has become a fetishised object that obscures the underlying commitments. Instead, pose this question to the group:

  *"If we grant that a valid derivation is possible, does that derivation explain why we should act, or does it merely show consistency with our definitions?"*

  This shifts the focus from the logic of the argument (which you have exhausted) to the **authority of the conclusion**. Camp A will say definitions lack authority; Camp B will say natural facts provide authority; Camp C will say institutional commitment provides authority. This will force the concealed metaphysical disagreement into the open, where it can be properly examined rather than hidden behind the syntax of 'entailment'.
