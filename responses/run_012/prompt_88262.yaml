answer: |-
  ### The Scenario

  Julia stands before the office safe, needing a file. She recalls the combination is 10-20-30, and her fingers turn the dial accordingly. The physical realizer is the specific physical state of her arm and hand, $P$, comprising the exact muscle contractions and joint angles that execute the turn. The latch clicks open. Had $P$ varied slightly—different muscle fibers engaging to produce the same dial rotation—the latch would still have opened. But had her memory been of a different number, the turn would have differed, and the latch would have remained shut.

  ***

  ### 1. The Interventionist Setup

  *   **Effect Variable ($E$):** Safe opens (1) or stays shut (0).
  *   **Mental Cause Variable ($M$):** Julia's memory content (Values: "10-20-30", "10-20-40", etc.).
  *   **Physical Realizer Variable ($P$):** The specific micro-physical state of the arm/hand (Values: $p_1, p_2, p_3...$ where $p_1$ is the actual state).
  *   **Intervention on $M$:** We surgically change Julia's memory to "10-20-40" while holding background conditions fixed. This necessitates a change in $P$ (since the hand must turn differently), and $E$ becomes 0. **Verdict:** $M$ makes a difference.
  *   **Intervention on $P$:** We surgically change $P$ from $p_1$ to $p_2$ (a different physical realization of the *same* dial turn) while holding $M$ fixed at "10-20-30". $E$ remains 1. **Verdict:** $P$ fails to make a difference *at this level of granularity*.

  ### 2. Why the Realizer Fails and the Mental Passes

  The condition doing the work is **Proportionality** (specifically, Yablo's formulation). A cause must be specific enough to guarantee the effect but not so specific that it rules out other ways the effect could have occurred.

  *   **$P$ fails** because it is *too specific*. It includes irrelevant details (which specific muscle fibers fired) that make no difference to the safe opening. It violates the "exhaustiveness" aspect of proportionality: it implies that if $P$ hadn't occurred, $E$ wouldn't have, which is false because $p_2$ would have done the job.
  *   **$M$ passes** because it is *commensurate* with the mechanism of the safe. The safe responds to the dial rotation, which is determined by the content of the memory. $M$ captures the relevant difference-maker without carrying the baggage of the physical implementation. It is not just one condition; it is a bundle of **stability** (the causal link holds across variations in $P$) and **specificity** (it distinguishes opening from not opening).

  ### 3. Running the Exclusion Argument

  The Exclusion Argument runs as follows:
  1.  **Completeness:** $P$ is physically sufficient for $E$. (True in this case).
  2.  **Distinctness:** $M$ is distinct from $P$. (Granted by non-reductive physicalism).
  3.  **Exclusion Principle:** If $P$ is sufficient for $E$, then no distinct property $M$ can cause $E$ (unless there is overdetermination).
  4.  **No Overdetermination:** This is not a case of causal overdetermination.

  To get the result "Mental property isn't a cause," the argument must lean on **Premise 3 (The Exclusion Principle)**.
  *   **Plausibility Check:** This premise is not independently plausible on an interventionist account. It essentially asserts that sufficiency trumps difference-making. In this case, Premise 3 is doing all the work, and it functions as a stipulation that "physical sufficiency excludes higher-level causation," which is basically the conclusion restated as a rule. The interventionist rejects Premise 3, arguing that sufficiency is necessary but not sufficient for *causal candidacy*; proportionality is also required.

  ### 4. The Collapse Test

  **Change:** We modify the safe so that it is biometrically locked to Julia's specific muscle tension pattern (a "neuromuscular signature"). Now, only $p_1$ opens the safe; $p_2$ (same dial turn, different muscles) fails.
  **Result:** The verdicts flip. Now $P$ is proportional (any change to $P$ changes $E$). $M$ becomes a *worse* cause because $M$ ("10-20-30") can be realized by $p_2$, which no longer opens the safe. $M$ is now too *coarse*.
  **Load-Bearing Feature:** The **insensitivity of the effect to physical micro-variations**. The mental property wins only because the physical mechanism (the safe) is blind to the physical details of the realization. The causal status of the realizer depends on the "grain" of the effect mechanism relative to the realizer.

  ### 5. Counterattack

  A committed Exclusionist (e.g., a reductionist physicalist) would attack the **Distinctness** premise or the **strength of Proportionality**.
  *   **The Attack:** "You haven't shown $M$ is a *distinct* cause. You've shown that a *description* of the physical cause at a higher level is more useful for explanation. $M$ causes $E$ only *in virtue of* $P$ causing $E$. Proportionality is a pragmatic virtue for *explanation*, not an ontological condition for *causation*. The world is made of $P$-events. If $P$ is sufficient, $P$ is the cause. $M$ is just a shadow."
  *   **Strength:** This is strong because it concedes the interventionist data (yes, $M$ tracks better) but denies that tracking confers ontological causal status. It relegates mental causation to a feature of our models, not the world.

  ### 6. Fine-Grained vs. Coarse-Grained

  If the mental property were fine-grained (e.g., "Remembering 10-20-30 *with this specific phenomenological intensity*"), the case gets shaky.
  *   **The Risk:** If we make $M$ as specific as $P$, it loses its proportional advantage. If the effect (safe opening) doesn't care about phenomenological intensity, then the fine-grained $M$ is just as "too specific" as $P$.
  *   **The Dependency:** Yes, this case makes the realizer's causal status depend on the mental property's *abstraction level*. The realizer is a "bad" cause *only because* there exists a higher-level property that abstracts away its irrelevant details. If no such property exists (or if we define the mental property too narrowly), the realizer reclaims the throne. You are buying a view where causation is not just about production (sufficiency), but about **relevance**, and relevance is determined by the match between property grain and effect sensitivity.
