prompt: |-
  I am a retired field biologist—thirty years in avian behavioral ecology—who has lately been reading philosophy of biology and trying to take seriously the thought that much of what we casually call communication may be better understood as costly signaling in the tradition of the handicap principle. For the past two years I have chaired the scientific review panel of a small foundation that funds animal-behavior and conservation projects; we meet quarterly and must decide, usually in a single afternoon, whether a proposal’s central claim about an honest signal is strong enough to fund. The proposals are written by people who know the vocabulary but often use it loosely: they treat any expensive trait as a handicap, or any correlation between a display and a quality as evidence of signaling, without distinguishing a signal from a cue, a handicap from a mere cost, or a receiver’s evolved response from a byproduct that happens to inform us. I would like you to write me a decision procedure the panel can actually run, in order, on each proposal—something like a flowchart in words. It should begin with the question of what would have to be true for the trait to be a signal rather than a cue, move through the conditions that make a signal credible (differential cost, condition-dependence, the link between the cost and the advertised quality, the receiver’s fitness consequences), and specify what counts as a sufficient answer at each stage, where the procedure stops with a clear no, and where it must hand the matter back to the panel as a judgment call because the issue is one of interpretation or values rather than evidence. Assume we have perhaps forty minutes per proposal, that I am the only member with formal behavioral-ecology training, and that our funding decisions are final unless the board overrides them.

  Then run the procedure on three proposals we have actually received. The first claims that a songbird’s complex song is an honest signal of developmental stress, on the strength of a one-year correlation between song complexity and a stress hormone, and asks for three years of funding to test the idea further. The second asks us to protect a costly male display in an endangered species on the grounds that the display is a viability indicator, so that preserving the display is preserving genetic quality; the species is genuinely endangered and I would very much like to fund the work, but the signaling claim is doing most of the argumentative work. The third comes from an economist and claims that conspicuous charitable donations in humans are a costly signal of prosocial quality, with a laboratory game showing that donors are rated more highly by observers. For each, give me the procedure’s verdict, the step at which it stops, and the answer I will not like if the procedure tells us not to fund something we are attached to.

  Finally, tell me what this procedure cannot do. I want the places where it will misfire, the distinctions from the theory that survive translation into a review panel and those that do not, and the points where a forty-minute panel with one trained biologist simply has to decide on grounds the procedure cannot supply. I do not need a survey of the literature or a reading list; I need something I can hand to the other panel members, who are intelligent but not specialists, and run in real time without pretending that a checklist has settled a question of biology or of value when it has not.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired field biologist (30 years avian behavioral ecology), currently chairs a scientific review panel for a small foundation funding animal behavior/conservation.
      *   **Context:** Panel meets quarterly, decides on proposals in a single afternoon (approx. 40 mins/proposal). User is the *only* member with formal behavioral ecology training. Other members are intelligent non-specialists. Decisions are final unless overridden by the board.
      *   **Problem:** Proposals misuse signaling theory (handicap principle). They conflate signals/cues, costs/handicaps, and evolved responses/byproducts.
      *   **Task 1:** Create a "decision procedure" (flowchart in words) for the panel to run on each proposal. It needs to distinguish signal vs. cue, establish credibility (differential cost, condition dependence, etc.), and identify where judgment calls are needed vs. hard nos.
      *   **Task 2:** Run the procedure on three specific proposals:
          1.  Songbird song complexity vs. stress hormone (correlational, asks for more funding).
          2.  Endangered species male display (conservation argument based on viability signaling).
          3.  Human charitable donation (economic signaling, lab game).
      *   **Task 3:** Explain the limitations of the procedure (where it misfires, theoretical nuances lost, value judgments vs. evidence).
      *   **Constraints:** No literature survey/reading list. Practical, usable in real-time. Honest about where the procedure fails to dictate a decision.

  2.  **Deconstruct Task 1: The Decision Procedure:**
      *   *Goal:* A rigorous but accessible filter for "Honest Signaling" claims.
      *   *Structure:* Sequential steps. Stop if "No." Flag if "Judgment Call."
      *   *Key Concepts to Operationalize:*
          *   Signal vs. Cue (Intent/Evolution of sender).
          *   Cost vs. Handicap (Differential cost).
          *   Honesty (Condition dependence).
          *   Receiver Response (Evolved vs. incidental).
          *   Fitness Consequences.
      *   *Time Limit:* 40 minutes. Needs to be concise.
      *   *Audience:* Non-specialists need clear definitions.
      *   *Drafting the Steps:*
          1.  **Definition Check:** Is it a signal or a cue? (Did the trait evolve *for* communication?)
          2.  **Cost Analysis:** Is the cost a *handicap*? (Is it harder for low-quality individuals to bear?)
          3.  **Honesty Link:** Is the signal condition-dependent? (Does it track the quality?)
          4.  **Receiver Side:** Does the receiver benefit from responding? (Stability of the system).
          5.  **Conservation/Intervention Relevance:** (Specific to this foundation). Does the signaling claim actually matter for the funding ask?

  3.  **Deconstruct Task 2: Running the Procedure:**
      *   *Proposal 1 (Songbird):* Correlation between song and hormone. Asking for money to *test* the idea.
          *   *Verdict:* Likely "Fund" but with caveats, or "No" if the premise is weak. Wait, the prompt asks for the "answer I will not like." If the procedure says "No" because it's just a correlation *now*, but they want money to *make* it causal, that's the tension. Actually, strict signaling theory requires evidence of differential cost, not just correlation. If they haven't shown the cost is differential yet, it's a hypothesis, not an established mechanism. But they are asking to *test* it.
          *   *Refinement:* The procedure evaluates the *strength of the central claim* to justify funding. If the claim is "This IS an honest signal" based on one correlation, the procedure should flag it as weak. If the claim is "We will test IF this is," that's different. The prompt says "central claim about an honest signal is strong enough to fund." This implies the premise needs to be solid.
          *   *Verdict:* Stop at Step 2 (Cost/Handicap distinction). Correlation $\neq$ Handicap.
      *   *Proposal 2 (Endangered Display):* Conservation based on preserving genetic quality via display.
          *   *Verdict:* This is the "Conservation Trap." Signaling theory often doesn't map cleanly to conservation priorities. If the species is endangered, genetic quality might be secondary to population viability. Also, is the display *actually* a viability indicator?
          *   *Verdict:* Stop at Step 5 (Relevance). Even if it is a signal, does protecting the *display* protect the *species*? Or does protecting the habitat do that? The signaling claim might be ornamental to the conservation need.
      *   *Proposal 3 (Human Charity):* Economist, lab game, reputation.
          *   *Verdict:* Stop at Step 1 (Signal vs. Cue) or Step 4 (Evolutionary context). Human lab games are often proximate mechanisms, not ultimate evolutionary explanations. Also, "prosocial quality" is vague. Is it a biological signal or a cultural construct?
          *   *Verdict:* Likely "No" based on scope (Animal-behavior foundation?) or Step 1 (Evolutionary history not established).

  4.  **Deconstruct Task 3: Limitations:**
      *   *Theory vs. Practice:* Zahavi's ideas are theoretically elegant but empirically messy.
      *   *Time:* 40 minutes isn't enough for deep critique.
      *   *Expertise:* Only one biologist. The panel might defer too much or rebel.
      *   *Values:* Conservation is normative. Signaling is descriptive.
      *   *False Negatives:* Good science might get cut because it doesn't fit the strict "Handicap" mold (e.g., index signals, conventional signals).

  5.  **Drafting the Content - Tone and Style:**
      *   *Tone:* Professional, collegial, precise, slightly weary (acknowledging the difficulty), authoritative but humble about the procedure's limits.
      *   *Format:* Clear headings, numbered lists, bold text for emphasis.
      *   *Specific Instruction:* "The answer I will not like." I need to highlight the conflict between scientific rigor and conservation desire.

  6.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is Step 1 too philosophical? "Did it evolve for communication?" is hard to prove.
      *   *Fix:* Frame it as "Is there a plausible evolutionary pathway for the *receiver* to attend to this?" If it's just a byproduct (cue), the signaling framework is wrong.
      *   *Critique:* Make sure to distinguish "Cost" from "Handicap." This is the core confusion in the proposals.
      *   *Fix:* Explicit step: "Is the cost *differential*?"
      *   *Critique:* Ensure the "Judgment Call" points are clear. The user wants to know where the checklist ends and the chair's burden begins.

  7.  **Final Review against Constraints:**
      *   40 minutes? Yes, keep steps tight.
      *   One biologist? Yes, explain terms simply.
      *   Three proposals analyzed? Yes.
      *   Limitations section? Yes.
      *   No reading list? Yes.

  8.  **Final Polish:** Check the "answer I will not like" sections. For the endangered species, the hard truth is that signaling theory rarely justifies conservation intervention directly. For the songbird, the hard truth is that a correlation is not a mechanism. For the human study, the hard truth is that it might be out of scope or theoretically shallow.

  *(Self-Correction on Proposal 1)*: The proposal asks for funding to *test* the idea. A review panel usually funds *promising* hypotheses. However, the prompt says "decide... whether a proposal's central claim about an honest signal is strong enough to fund." This implies the *premise* must be robust enough to warrant the expense. If the premise is "We think X is a signal because of correlation Y," the procedure should demand more mechanistic plausibility before granting 3 years. I will frame the verdict as "Proceed with caution/modified scope" or "Reject premise." Let's go with "Reject as signaling claim, fund as descriptive study" if possible, but the prompt asks for a verdict on the *signaling claim*. I will say the procedure flags it as "Unproven Mechanism."

  *(Self-Correction on Proposal 2)*: This is the emotional one. The biologist wants to fund it. The procedure might say "Signaling status irrelevant to extinction risk." That's the "answer I will not like."

  *(Self-Correction on Proposal 3)*: Humans are animals, but "economist" + "lab game" often signals proximate cultural norms, not evolved biological signaling. The foundation funds "animal-behavior and conservation." Humans might be out of scope, but let's assume they are in scope for the sake of the theory test. The failure point is the "Evolutionary History" of the signal.

