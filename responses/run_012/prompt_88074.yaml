answer: |-
  Your scientific impatience is well-founded. In geology or physics, "no smoke without fire" is a causal law regarding combustion byproducts. In historiography, it is an analogy that smuggles in premises about human memory, transmission, and motivation. When used to close a debate, it functions as a *conversation stopper* precisely because it equivokes between a tautology (stories have causes) and a substantive historical claim (stories track events).

  Here is the disambiguation you requested, structured as a menu of distinct claims ordered from the trivial to the radical.

  ### The Menu of Readings

  **1. The Causal Necessity Reading**
  *   **Smoke:** The bare existence of the narrative tradition.
  *   **Fire:** *Some* antecedent cause (psychological, social, or historical) that initiated the storytelling.
  *   **Claim Type:** Logical truth / Causal regularity.
  *   **Status:** **Platitude.** It is trivially true that stories do not spontaneously generate; they have authors and contexts.
  *   **Evidence:** For: Universal human behavior of narrative creation. Against: None (unfalsifiable).
  *   **Utility:** Zero for history. It proves only that someone started talking, not *why*.

  **2. The Specific Trigger Reading**
  *   **Smoke:** The specific content of the story (e.g., a battle, a name).
  *   **Fire:** A specific historical event or person that *triggered* the initial story.
  *   **Claim Type:** Substantive causal hypothesis.
  *   **Status:** **Defensible but Weak.** It posits a specific etiology.
  *   **Evidence:** For: Cases where oral tradition is known to anchor on a specific event (e.g., oral histories of volcanic eruptions verified by geology). Against: Cases of literary fabrication (e.g., *Don Quixote* generating tourism and folklore without a real Quixote).
  *   **Utility:** Low. It grants a "trigger" but allows the story to be 100% distorted immediately after.

  **3. The Euhemerist Nucleus Reading**
  *   **Smoke:** Stability of core names or places across retellings (e.g., "Troy," "Arthur," "Moses").
  *   **Fire:** A historical individual or location that served as the nucleus for the legend.
  *   **Claim Type:** Inference to the Best Explanation (IBE).
  *   **Status:** **Substantive Hypothesis.** This is the standard "kernel of truth" model.
  *   **Evidence:** For: Archaeological correlation (Hisarlik for Troy); independent textual attestation (Hittite records for Wilusa). Against: Etymological fabrication (names invented for symbolic reasons); conflation of multiple figures into one.
  *   **Utility:** Moderate. It licenses searching for the nucleus, not accepting the story.

  **4. The Proportional Reliability Reading**
  *   **Smoke:** The wide currency, longevity, and incidental detail of the story.
  *   **Fire:** The central action occurred at roughly the scale and in the manner related.
  *   **Claim Type:** Methodological Presumption (Epistemic).
  *   **Status:** **Dubious.** It assumes transmission preserves signal better than noise.
  *   **Evidence:** For: Recent oral histories where verification is possible. Against: The "telephone game" effect; national myths that grow *more* detailed over time (e.g., the Washington cherry tree).
  *   **Utility:** High risk. It licenses believing the *plot*, not just the setting.

  **5. The Survival as Verification Reading**
  *   **Smoke:** The mere survival of the story into the present.
  *   **Fire:** The story is a broadly reliable report of reality.
  *   **Claim Type:** False Generalization.
  *   **Status:** **False.** Survival selects for cultural utility, not accuracy.
  *   **Evidence:** For: None. Against: The existence of enduring, widely believed falsehoods (e.g., the geocentric model, the flat earth in certain eras, religious myths without historical bases).
  *   **Utility:** Dangerous. It conflates cultural importance with historical fact.

  ***

  ### The Conversational Function

  When the proverb is used to **close a conversation** of this sort, it is almost invariably meant to carry **Reading 3 (Euhemerist Nucleus)** or **Reading 4 (Proportional Reliability)**.

  The speaker intends to move the burden of proof. By invoking the proverb, they imply that skepticism requires disproving the *existence* of the smoke, rather than the skeptic requiring proof of the *nature* of the fire. It is a rhetorical shield that treats the story's existence as positive evidence for its content, rather than merely evidence for its own existence.

  ***

  ### Application to the Three Cases

  Your suspicion is correct: the proverb equivocates between Reading 1 (vacuous) and Reading 4/5 (strong). Only Reading 1 is secure; Reading 4/5 is where the historical work lies, and the proverb cannot do that work for you. Here is how the three cases strain the proverb differently:

  **1. The Trojan War (Legend of a Place/Conflict)**
  *   **The Smoke:** Homeric epics + Hittite references to conflict in Wilusa + Archaeological layers of destruction at Hisarlik.
  *   **Does the Proverb License the Conclusion?** **No, but Archaeology does.**
  *   **Analysis:** If you rely *only* on the proverb ("The story exists, so the war happened"), you are on shaky ground (Reading 4). However, in this specific case, independent "smoke" (pottery, burn layers, Hittite tablets) was found. The proverb is redundant here. The story pointed to a location, but the *fire* was proven by spades, not sayings.
  *   **Verdict:** The proverb is unnecessary. The "smoke" is physical, not just narrative.

  **2. King Arthur (Legend of a Single Named Figure)**
  *   **The Smoke:** Medieval texts (Geoffrey of Monmouth), place names, later folklore.
  *   **Does the Proverb License the Conclusion?** **No.**
  *   **Analysis:** This strains the proverb regarding the *nature* of the fire. Reading 3 (Nucleus) is defensible (a 5th-century warlord likely existed). Reading 4 (Reliability) is false (he did not fight Saxons with knights in plate armor). The "smoke" here is largely literary accretion. The proverb fails because the "fire" could be a *book* (Geoffrey's *History*), not a *battle*. A fictional character can generate "smoke" (folklore) without a historical "fire."
  *   **Verdict:** The proverb misleads. It suggests the *legendary* Arthur existed, when at best a *historical prototype* might have.

  **3. The Exodus (Legend of a People's Migration)**
  *   **The Smoke:** Biblical text, cultural memory, ritual observance.
  *   **Does the Proverb License the Conclusion?** **Least of all.**
  *   **Analysis:** This strains the proverb regarding *scale*. Reading 1 (Some cause) is true (the story exists). Reading 4 (Scale/Manner) is contradicted by archaeology (no evidence of 2 million people wandering Sinai). Here, the "fire" may be theological or political (the need for a foundation myth), not historical. The "smoke" is the identity of the people, not the event.
  *   **Verdict:** The proverb is dangerous. It conflates the reality of the *identity* (Israel exists) with the reality of the *origin story* (Exodus happened).

  ***

  ### Verification of Your Suspicion

  **Your suspicion is correct.** The argument relies on an equivocation fallacy.
  1.  **Premise 1 (Secure):** Stories must have a cause (Reading 1).
  2.  **Premise 2 (Hidden/False):** The cause of a story is typically the event the story describes (Reading 4).
  3.  **Conclusion:** Therefore, the event described happened.

  The proverb works rhetorically because Premise 1 is undeniable, but it only licenses the conclusion if Premise 2 is true. In history, Premise 2 is frequently false. Stories often arise from *misunderstandings*, *propaganda*, or *literary creativity*.

  **Where the cases come apart:**
  *   **Troy** works best because the "smoke" includes physical debris, not just text.
  *   **Arthur** is intermediate; the "smoke" is text + folklore, easily generated by a single author.
  *   **Exodus** is the weakest; the "smoke" is national identity, which can be constructed entirely without the specific historical "fire" claimed.

  ***

  ### Distinction from Near Relations

  You asked to distinguish this from **"Every legend contains a kernel of truth"** and **"There must be something to it."**

  **1. "Every legend contains a kernel of truth"**
  *   **Distinction:** This is more modest than "No smoke without fire." It admits the bulk of the story is false (the husk) and only a small part is true (the kernel).
  *   **Does it do better?** **Yes.** It aligns with Reading 3 (Euhemerist Nucleus). It licenses the search for a trigger without licensing belief in the narrative. It is methodologically safer for a scientist. It acknowledges distortion.

  **2. "There must be something to it"**
  *   **Distinction:** This is more vague. "Something" could mean historical fact, but it could also mean *psychological* truth or *cultural* significance.
  *   **Does it do better?** **No.** It is a weasel phrase. It allows the speaker to retreat to "Well, it means something to them" if challenged on historical facts, while still implying historical fact to the listener. It is less precise than the proverb, not more.

  ### Summary Recommendation
  As a scientist, you should treat "No smoke without fire" in history as **Reading 1 (Causal Necessity)** only. It tells you the story is an effect requiring a cause. It does *not* tell you that the cause is the event described. To move from Reading 1 to Reading 3 (Nucleus), you require independent corroboration (archaeology, contemporary texts). To move to Reading 4 (Reliability), you require evidence of transmission fidelity, which rarely exists for deep time.

  In the cases you cited:
  *   **Troy:** The proverb is redundant; the spade confirmed the fire.
  *   **Arthur:** The proverb is misleading; the fire may be literary.
  *   **Exodus:** The proverb is false; the smoke is identity, the fire is theology.

  The proverb is a heuristic for combustion, not a method for historiography.
