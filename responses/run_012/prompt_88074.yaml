      *   Status (Platitude/False/etc.) + Evidence? Yes.
      *   Usual meaning identified? Yes.
      *   Application to 3 cases? Yes.
      *   Suspicion verified? Yes.
      *   Near relations distinguished? Yes.

      *(Self-Correction on "Evidence"):* For the scientist, "evidence" means what would falsify or verify the claim. For Reading 1, nothing falsifies it. For Reading 5, counter-examples (pure fiction becoming legend) falsify it.

      *(Refining the "Exodus" point):* Be careful not to take a hard stance on the theology, but on the *historical claim* of mass migration vs. archaeological consensus.

      *(Refining the "Arthur" point):* Distinguish between the *legend* (magic, knights) and the *historical hypothesis* (Riothamus/Ambrosius Aurelianus).

      *(Refining the "Troy" point):* Schliemann used the "no smoke" logic, but found the fire (ruins) independently. The proverb wasn't the proof; the spade was.

  10. **Final Polish:** Check for clarity, flow, and tone. (The prompt asks for a "menu rather than a single preferred reading," so keep the list distinct). Ensure the "Scientist's Impatience" is validated.

  *(Drafting the response...)*
  *   *Intro:* Validate the user's instinct. The proverb is an enthymeme (hidden premises).
  *   *Menu:*
      1.  Causal Necessity (Trivial).
      2.  Specific Trigger (Weak).
