      *   *Self-Correction during drafting:* Ensure I explicitly address "Smoke" and "Fire" definitions for each reading as requested. Make sure the distinction between "Some cause" and "The claimed cause" is sharp. Ensure the Earth Science analogy (trace fossils vs. noise) resonates.

  9.  **Final Review against Constraints:**
      *   Menu ordered trivial to radical? Yes.
