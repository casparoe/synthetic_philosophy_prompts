  The principle you are looking for is not simple Cost-Benefit Analysis, but what I will call the **Principle of Proportional Diligence**.

  Your intuition is correct that "cost of search" is not just time or money. It is a function of three variables: the **Consequences of Error** (Stakes), the **Reversibility** of the decision, and the **Integrity of the Criteria** used to stop.

  Here is the smallest set of principles that delivers your verdicts:

  ### The Principle of Proportional Diligence

  A decision to stop search is rational if and only if:
  1.  **Criteria Integrity:** The chosen option satisfies the *necessary and sufficient* conditions appropriate for the context (distinguishing the Apartment from the Weary Renter).
  2.  **Stakes-Information Proportionality:** The rigor of the search is proportional to the **Consequences of Error** relative to the **Quality of Available Information** (distinguishing Cereal from Surgeon).
  3.  **Sample Adequacy:** The number of options sampled is sufficient to statistically validate the choice, unless **Search Degradation** (the cost of searching damages the option or the searcher) is high (distinguishing Partner from Cereal).

  ---

  ### How This Resolves Your Tensions

  **1. Cereal/Paint (Rational) vs. Surgeon/Firm (Irrational)**
  *   **The Tension:** Both involve nearly free search.
  *   **The Resolution:** This is solved by **Stakes-Information Proportionality**.
      *   In the **Cereal** case, the Consequence of Error is low (a bad breakfast) and Reversibility is high (buy a different box tomorrow). Low diligence is proportional.
      *   In the **Surgeon** case, the Consequence of Error is catastrophic (health outcomes) and Reversibility is low (surgery is invasive). Furthermore, the information available (outcome data) is *high quality* and directly relevant to the risk. Stopping at "in-network" (an administrative criterion) rather than "competent" (a safety criterion) violates proportionality.
      *   **Verdict:** Your intuition holds. Low cost does not mandate search if stakes are low; high stakes mandate search if information is high-quality and cheap.

  **2. Apartment/Hiring (Rational) vs. Weary Renter (Irrational)**
  *   **The Tension:** All stop due to effort limits.
  *   **The Resolution:** This is solved by **Criteria Integrity**.
      *   In the **Apartment** and **Hiring** cases, the search stopped because a pre-defined threshold of *acceptability* was met ("meets every criterion," "clears the bar"). This is *satisficing*, which is rational when search costs are non-trivial.
      *   In the **Weary Renter** case, the search stopped because *willpower failed*, not because criteria were met ("fails two of her own stated requirements"). This is *capitulation*, not satisficing.
      *   **Verdict:** Your intuition holds. Stopping is rational when criteria are met; irrational when criteria are violated due to fatigue.

  **3. The Hiring Case (The Hidden Tension)**
  *   You rate Hiring as Rational despite cheap search and the possibility of a "better" candidate. This is consistent with **Satisficing** (finding a candidate who *will do the job*) rather than **Maximizing** (finding the *best* candidate).
  *   This differs from the **Firm** case because the Firm skipped a test that would reveal a "much better design" (implying the current design is sub-optimal in a way that matters), whereas the Hiring committee found someone who "clears the bar" (is competent).
  *   **Verdict:** Rational, provided "clearing the bar" is a sufficient condition for the role's safety/success.

  ---

  ### Prediction: The Voter Case

  **Case:** A voter settles on the first candidate who seems acceptable and stops reading. Stakes are high (governance), reading is tedious (high cognitive cost), reversibility is low (4-year terms).

  **Prediction:** **Irrational.**
  *   **Reasoning:** Under the Principle of Proportional Diligence, the **Consequences of Error** are high (laws, war, economy affect your life deeply) and **Reversibility** is low. While the "cost" is tedious reading, it is not prohibitive.
  *   Unlike the **Hiring** case, there is no "bar" of competence that the first acceptable candidate clearly meets; political suitability is continuous and complex.
  *   Unlike the **Cereal** case, the stakes are not negligible.
  *   Therefore, stopping at the "first acceptable" option without further diligence violates **Stakes-Information Proportionality**.

  ---

  ### The Verdict You Must Abandon

  If this principle is held strictly, the verdict you are most forced to abandon or heavily qualify is the **Partner** case.

  **Why:**
  You state: *"I marry the first person who meets my list of requirements, having met almost no one else."*
  *   **Criteria Integrity:** Met (List satisfied).
  *   **Stakes:** Highest possible (Lifetime commitment, financial entanglement, children).
  *   **Reversibility:** Lowest possible (Divorce is costly and damaging).
  *   **Sample Adequacy:** Failed ("Met almost no one else").

  Statistically, meeting one person who fits your list does not prove they are a good match; it proves they are the only data point you have. In the **Cereal** case, a sample of one is fine because the stakes are low. In the **Partner** case, a sample of one is reckless *unless* you invoke **Search Degradation**.

  **Search Degradation** argues that in dating, the act of searching *changes* the searcher (aging, emotional exhaustion) and *consumes* the option (the partner may leave). This makes the "cost of search" effectively very high, unlike the cereal aisle.

  **Conclusion:**
  *   If you accept **Search Degradation** as a valid "cost," the **Partner** verdict stands (Rational).
  *   If you define "cost" strictly as time/money/effort (as you seem to in the Cereal/Surgeon comparison), the **Partner** verdict is **Irrational**.

  To maintain consistency with your Surgeon and Firm verdicts (where high stakes + cheap info = search more), you must either admit the Partner case is irrational, or concede that "emotional opportunity cost" counts as a search cost equivalent to the "one click" in the Surgeon case. Given your description ("having met almost no one else"), the principle suggests this is the weakest link in your rationality chain.
