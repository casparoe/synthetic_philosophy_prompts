  12. **Final Polish:** Ensure flow is smooth. Avoid bullet points implicitly (e.g., "first, second, third"). Use transitions. Make sure the HPS expertise shines through without being showy. (e.g., referencing "background conditions" vs "causes," "independent manipulability").

  *(Self-Correction on "Intervention Test"):* The Chair's test is basically Woodward. The user's worry is about independent manipulability. If the work order bundled them, can we change one without the other? In the *actual* scenario, no. But in the *model* for policy, yes. I need to make sure the memo argues that the test applies to *policy variables*, not just physical states.

  *(Self-Correction on "Two-Stage"):* The user thinks it's half-formed. I should validate it but give it structure. Stage 1: Causal facts. Stage 2: Normative assignment. This aligns with Hart and Honoré's distinction between cause and responsibility.

