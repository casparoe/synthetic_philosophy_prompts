answer: |-
  Yes, there is a single principle. It is not about marginal impact, and it is not about expertise. It is about **where the downside lands.**

  ### The Principle: Contained Downside

  **You may act unilaterally when the costs of being wrong are borne by you, or by a specific individual you are rescuing from immediate harm. You may not act unilaterally when the costs of being wrong are distributed across a system (ecological, informational, social) that cannot consent, recover easily, or isolate the failure.**

  This principle divides your world into two zones:
  1.  **The Zone of Self and Specific Rescue:** Here, you own the risk. If you fail, you hurt yourself (cancer treatment) or you fail to save the specific person in the wreck. The damage stops there.
  2.  **The Zone of the Commons:** Here, the risk is shared. If you fail, the damage leaks into a system others rely on (the fishery, the biosphere, the information ecosystem). Because they cannot consent to your gamble, and because systemic damage is often irreversible, you require permission (coordination/regulation).

  ### Why This Resolves Your Two Rejected Stories

  **Story 1: The Fisherman (Marginal Impact)**
  Your rejection of the "marginal impact" argument was correct. The principle explains why: The fisherman isn't just taking fish; he is degrading the **norm of the quota system**. The downside isn't just the fish he catches; it's the precedent that quotas are optional. That cost is distributed to every other fisherman and the future stock. It is a **distributed cost**, so it requires **distributed permission**.

  **Story 2: The Pathogen Guy (Epistemic Authority)**
  Knowledge does not grant the right to impose risk. The pathogen guy owns the *list*, but he does not own the *consequences* of releasing it. The downside (bioterrorism, accidental release by others) is borne by the entire population. That is a **systemic cost**. Therefore, his expertise is irrelevant to the permission structure. He is trying to gamble with chips that belong to everyone else.

  ### The Tax: Which Verdict You Must Give Up

  To keep this principle clean, you have to sacrifice one case from your "Fine" list: **The Cloud Seeding Guy.**

  You marked cloud seeding as "Fine" and geoengineering as "Not Fine." Under the Principle of Contained Downside, these are the same category. Weather is a tightly coupled system. Seeding clouds here causes drought there. The downside is distributed across a region that did not consent, and it is not easily reversible.
  *   **Why it feels different:** It feels "smaller" than geoengineering. But "one guy" with enough capacity to seed a drought region has the same structural authority as "one lab" doing a test. Both are unilateral interventions in a shared physical system.
  *   **The Fix:** Move Cloud Seeding to "Not Fine" unless it is done under regional authority. If you keep it as "Fine," the principle breaks, and you are back to a list.

  *(Note: The Cop case survives because it falls under the "Specific Rescue" exception. He is preventing immediate physical harm to a specific crowd, overriding a procedural rule. The downside of his disobedience is administrative; the downside of obedience is physical violence. Immediate physical harm prevention trumps procedural integrity.)*

  ### The Case You Actually Care About: The Software Vulnerability

  Your friend has found a hole in safety software half the world runs on. He wants to publish the exploit because the vendor is slow.

  **Apply the Principle:**
  1.  **Is the downside contained?** No. This is infrastructure used by "half the world."
  2.  **Who bears the risk?** If he publishes the exploit, the risk is borne by every user of that software, not by him. They are non-consenting parties.
  3.  **Is it reversible?** No. Once the exploit is public, it cannot be un-known.
  4.  **Is it an immediate rescue?** No. This is not the car wreck. The wreck is happening *now*; the software exploit is a potential future harm.

  **Verdict:** **Not Fine.**

  Publishing the full exploit is structurally identical to the Pathogen Guy. It puts a weapon into the commons before a shield (patch) is available. It imposes a systemic risk on everyone to solve a procedural failure (the vendor's slowness).

  **The Permissible Alternative:**
  Your friend *can* act unilaterally to **publish the existence of the flaw** (shaming the vendor), provided he withholds the **weapon** (the specific exploit code).
  *   **Why:** This keeps the downside contained. It pressures the vendor (a specific target) without arming attackers against the users (the commons). It respects the boundary: you can gamble with your own reputation and the vendor's stock price, but you cannot gamble with the safety of the users.

  ### Summary
  If you want the principle to work, you must accept that **you do not own the side effects.**
  *   If the side effects hit you: Go.
  *   If the side effects hit a specific person you are saving from immediate death: Go.
  *   If the side effects hit the system: Stop and coordinate.

  Your friend is looking at a system problem. He cannot solve it with a unilateral move that risks the system. He must pressure the coordinators (the vendor) without breaking the lock (the exploit).
