      *(Self-Correction during drafting)*: I need to be careful not to say Nozick *supports* vigilante justice. He explicitly argues against it. The point is that Dantès exists *because* the Nozickian state failed to emerge or function. The novel shows the "State of Nature" that Nozick describes, but romanticizes it then deconstructs it.

