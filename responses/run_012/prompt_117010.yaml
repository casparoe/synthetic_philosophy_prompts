answer: |-
  It is a very tempting idea, and I see why your colleague finds it appealing because it promises a way to bypass the hardest part of AI safety, which is figuring out what we actually want. The core intuition is that if you can define harm as change, then preventing change prevents harm. But when you try to make that precise, you run into the problem that every definition of impact either fails to capture what we care about or secretly relies on knowing what we care about. To see where it breaks, we have to look at the three main ways people try to define this low-impact constraint, specifically looking at what baseline they compare against and how they measure the deviation.

  The first reading is the most literal one, where impact is defined as physical change relative to a baseline of inaction. Here, the baseline is the counterfactual world where the agent does nothing, and the measurement is something objective like energy consumption, atoms moved, or thermodynamic entropy. On the surface, this looks completely value-free because physics doesn't care about human preferences. However, this reading is effectively false as a safety solution. It is too restrictive in some ways and too permissive in others. It is too restrictive because almost any useful task requires moving atoms or using energy, so a strong penalty here renders the agent useless. It is too permissive because an agent could manipulate stock markets, write persuasive propaganda, or trick humans into harming themselves without moving many atoms or using much energy. A digital agent can cause catastrophic harm while remaining physically low-impact. So, while this reading is technically value-free, it fails to guarantee safety because physical change is not a good proxy for harmful change.

  The second reading is more sophisticated and is likely what your colleague has in mind, often associated with concepts like Attainable Utility Preservation. Here, the baseline is still usually inaction or a default policy, but the measurement is not physical state; it is the agent's effect on the future options available to itself or others. The idea is to penalize the agent if it changes the world in a way that significantly increases or decreases the ability to achieve a wide range of possible goals. The claim is that this is value-agnostic because it doesn't matter what the goals are, only that the ability to achieve them is preserved. This is a substantive and defensible design goal for reducing risk, but it is not value-free. The value gets smuggled in at the step where you select the set of auxiliary goals used to measure options. If you measure options relative to goals like gathering resources or computing power, you are implicitly valuing power and instrumental convergence. If you measure options relative to goals like human happiness or survival, you have already specified human values. Furthermore, preserving all options includes preserving the option to do harm, and preventing the agent from reducing options might prevent it from stopping other threats. So this reading looks value-free only because it uses a proxy for value, which is the structure of the goal space itself, and that structure is never neutral.

  The third reading defines impact relative to the status quo at the time the agent is switched on, measuring deviation based on human preference or satisfaction. In this view, the baseline is the world as it was found, and the metric is how much humans dislike the change. This is actually the most robust way to define safety, but it directly contradicts your colleague's claim that you don't need an alignment target. This reading is explicitly value-laden because it assumes the status quo is the reference class for good and that human preferences are the metric for bad. It requires the system to know what humans value in order to measure the deviation. If you try to make this value-free by assuming humans prefer whatever state they are currently in, you run into the problem that humans often want change, like curing diseases or fixing climate change. So this reading is defensible as a safety goal, but it is trivial in the context of your colleague's argument because it admits that you need to specify values to define impact.

  Your colleague most likely meant the second reading, the one about preserving future options or attainable utility, because that is the only one that sounds like a technical construction safe by design rather than a philosophical appeal to the status quo. They are probably thinking that if you just penalize the agent for changing its power level or the state of the world too much, it won't be able to go rogue. However, that reading does not get them their conclusion. It does not allow you to define impact without first specifying what anyone values. The value specification is just moved from the reward function to the impact penalty. You still have to decide which features of the world matter, which goals represent valid options, and what counts as a significant change. If you get that impact metric wrong, the agent can still find loopholes, such as manipulating humans to do its bidding while keeping its own power metrics stable, or it might become so conservative it prevents necessary positive changes. The idea that you can get alignment without an alignment target is false because impact is normative; you cannot measure harm without implicitly defining what is good to preserve and what is bad to change.
