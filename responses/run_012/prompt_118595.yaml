      *   *Reading 4: The Existential Imperative (Radical).* It's a challenge to transform oneself so that one *could* will the recurrence. It's about becoming the *Übermensch*.
          *   *Verdict:* Deep, but not a simple decision procedure. It's a goal, not a rule.
