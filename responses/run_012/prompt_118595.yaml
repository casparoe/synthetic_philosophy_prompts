          *   *Verdict:* Platitude. Doesn't capture Nietzsche's intensity.
          *   *Group Member's Use:* Fits the "risky job" advice (don't be cowardly), but fails on the "breakup" advice (regret is normal).

      *   *Reading 2: The Coherence Test of Character (Substantive).* It's not about individual acts, but the whole life. Can you affirm the *totality*?
