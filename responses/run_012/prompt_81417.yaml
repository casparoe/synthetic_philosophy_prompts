          *   Anti-Fanaticism Clause: Must prevent tiny prob * huge value from dominating. Must state the rule and its cost.
          *   Cluelessness Handling: Distinguish informative estimates from model artifacts.
          *   Net Negative/Negative Value Handling: Accommodate possibility future is net negative.
          *   Value Lock-in: Distinguish survival from trajectory change.
          *   Deferral Option: Must allow "fund nothing, invest, give later."
      *   **Test Cases:**
          1.  Technical research (1/10,000 x-risk reduction).
          2.  Institutional reform (value depends on population axiology).
          3.  Holding endowment (deferment).
      *   **Output Requirement:** At least one result must be unpalatable to a strong longtermist.
      *   **Meta-Analysis:** Identify where the procedure smuggles values as estimation and admit limitations.

  2.  **Deconstruct the Constraints & Tensions:**

      *   *Time vs. Depth:* 8 hours per proposal is the biggest bottleneck. Deep modeling is impossible. The procedure must rely on heuristics and "robustness" rather than precise EV calculations.
      *   *Charter vs. Board:* The charter says "Strong Longtermism." The Board has veto power on specific grounds (premise and axiology). The procedure must navigate this. If a proposal *requires* the contested axiology to pass $2M, it must be capped or rejected.
      *   *Fanaticism:* Expected Value (EV) maximization leads to fanaticism (Pascal's Mugging). We need a cutoff or discounting mechanism.
      *   *Cluelessness:* If we can't know the sign of the impact, we can't fund based on EV. We need a "robustly good" filter.
      *   *Deferral:* If "giving later" is better, the procedure must allow rejecting *all* proposals.

  3.  **Drafting the Decision Procedure (The "Longtermist Triage Protocol" - LTP):**

      *   *Phase 1: The Charter & Board Filter (Compliance).* Does it fit the charter? Does it trigger board veto risks?
      *   *Phase 2: The Cluelessness & Sign Check.* Can we determine the *direction* of impact? If not, reject.
      *   *Phase 3: The Fanaticism Cap.* How to handle low prob/high impact? Use a "Probability Floor" or "Impact Cap." Let's go with a *Probability Floor* for existential claims. If the mechanism isn't credible, the probability is treated as zero for decision purposes.
      *   *Phase 4: The Axiological Neutrality Test.* Does this work under multiple value theories?
      *   *Phase 5: The Deferral Check.* Is now better than later?

      *Refining the Anti-Fanaticism Rule:* Simply capping EV is arbitrary. A better approach for a *procedure* is to require *mechanistic plausibility* over *mathematical expectation*. If the causal chain relies on >5 speculative links, it fails. Or, use a "Truncation Rule": Probabilities below a certain threshold (e.g., 1%) are treated as zero unless there is direct empirical evidence of the mechanism. Let's choose a *Causal Robustness* standard.

      *Refining the Board Constraint:* Proposals >$2M must not *depend* on the contested axiology. They must be justifiable on "person-affecting" or "neutral" grounds if possible, or at least not *require* Total Utilitarianism.

      *Refining Time:* 30 proposals in 2 weeks is brutal. The procedure needs a "Fast No." Most should die in Phase 1 or 2.

  4.  **Developing the Test Cases:**

      *   *Case 1: Tech Research (1/10,000 x-risk reduction).*
          *   Standard Longtermist view: Huge EV.
          *   Procedure view: Is 1/10,000 credible? Is the mechanism robust? Does it trigger fanaticism guards?
          *   *Outcome:* Likely Rejection or Cap. Why? Because 1/10,000 is below the "credibility floor" without empirical validation of the specific intervention's efficacy. This will be unpalatable.
