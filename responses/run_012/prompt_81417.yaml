      *Self-Correction on Time:* 30 proposals in 2 weeks with 3 people. That's 5 proposals per person per week. They can't do deep dives. The procedure must rely on *external* validation or *pre-screening*. I need to emphasize that the "Evidence Standard" is about *existing literature*, not new modeling by the team.

      *Self-Correction on Fanaticism:* The prompt asks to state the rule and the cost. I will use a "Causal Chain Length" limit combined with a "Probability Floor." Let's go with the **Probability Floor of 1%**. If the claimed impact relies on a probability lower than 1% *and* lacks empirical precedent, it is treated as 0. Cost: We ignore tail risks that are real but hard to measure.

      *Self-Correction on Board:* If a proposal >$2M depends on contested axiology, it *must* be escalated. But the prompt asks for a procedure the *team* can run. The team should flag it. If it *requires* it, the team should recommend capping at $2M or rejecting. Let's make it a rejection condition for >$2M to save Board time.

  7.  **Running the Cases:**

      *   *Tech Research:* Claims 0.01% risk reduction. Fails Probability Floor (0.01% < 1%). **Result: Reject.** (Unpalatable to longtermist).
      *   *Inst. Reform:* Value flips sign based on axiology. Fails Board Filter for >$2M. If <$2M, maybe. But if the *charter* requires longtermism, and the board member rejects the premise... wait. The charter *commits* to longtermism. The Board member *rejects* it. This is a governance conflict. The procedure must respect the Board's veto power. So, if the proposal *depends* on the contested axiology, it cannot get >$2M. If it's <$2M, Program Officer discretion. Let's say it's a $3M ask. **Result: Cap at $2M or Reject.** Let's make it Reject for the sake of the "unpalatable" requirement, or Cap. Let's Cap to show nuance. Actually, the prompt says "identify where... values work in costume." Let's make the procedure reject it to highlight the axiological conflict.
      *   *Endowment:* If 1 and 2 fail, 3 wins. **Result: Invest.**

  8.  **Meta-Analysis:**

