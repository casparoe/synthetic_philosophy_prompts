      *Refining the Fanaticism Rule:* The prompt asks for a rule to prevent fanaticism. A "Probability Floor" is good. Let's call it the **Empirical Precedent Constraint**. You can't claim 1/10,000 impact unless similar interventions have shown measurable impact in the past.

      *Refining the "Unpalatable" Outcome:* A strong longtermist wants to fund the x-risk reduction. The procedure must reject it. This satisfies the prompt.

      *Refining the "Values in Costume":* The Probability Floor is actually risk-aversion disguised as epistemic rigor. The Sign Certainty is status-quo bias disguised as cluelessness management.

