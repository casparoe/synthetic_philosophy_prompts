answer: |-
  # The Robust Longtermist Allocation Protocol (RLAP)
  **Version:** 1.0  
  **Authority:** Program Office (3 FTE)  
  **Constraints:** 30 proposals/round, 10 days/round, Board veto thresholds.

  ## Preamble: The Epistemic Stance
  This procedure operates under the **Charter of Strong Longtermism**, acknowledging the Board's veto constraints. It accepts that at long time horizons, *cluelessness* is the default state. Therefore, the burden of proof lies on the applicant to demonstrate that their intervention is **robustly positive** across multiple value systems and causal models. We do not maximize Expected Value (EV) in the abstract; we minimize the risk of negative impact or wasted capital under deep uncertainty.

  ---

  ## Phase 1: The Board Viability Filter (Time Limit: 1 Hour/Proposal)
  *Purpose: To prevent wasted effort on proposals the Board cannot legally or philosophically approve.*

  **Q1.1: Does the proposal require a grant >$2M to be viable?**
  *   **Yes:** Proceed to Q1.2.
  *   **No:** Proceed to Phase 2. (Grants ≤$2M require only Program Officer approval).

  **Q1.2: Does the core argument *depend* on Total Utilitarianism (or similar contested population axiology)?**
  *   *Standard:* If removing the claim that "creating new happy lives is a benefit" reduces the EV to neutral or negative, it depends on contested axiology.
  *   **Yes:** **TERMINATE.** (Board Member B veto risk). *Exception: Can the scope be reduced to ≤$2M?*
  *   **No:** Proceed to Phase 2.

  **Q1.3: Does the core argument *depend* on the premise that the long-term future outweighs the near-term?**
  *   *Standard:* If the proposal offers no near-term co-benefits (e.g., scientific advancement, immediate risk reduction) and relies solely on impact >100 years out.
  *   **Yes:** **ESCALATE TO BOARD AGENDA.** (Board Member A veto risk). Note: This consumes significant political capital. Limit to 1 per round.
  *   **No:** Proceed to Phase 2.

  ---

  ## Phase 2: The Cluelessness & Sign Check (Time Limit: 3 Hours/Proposal)
  *Purpose: To filter out interventions where we cannot determine the direction of impact.*

  **Q2.1: Is the causal chain longer than 5 distinct links?**
  *   *Standard:* Count the steps from "Grant Disbursed" to "Long-term Value Realized." (e.g., Fund Research → Publish Paper → Policaker Reads → Policy Changed → Risk Reduced → Future Saved).
  *   **Yes:** **REFUSE.** (Epistemic decay renders the sign of the impact unknowable).
  *   **No:** Proceed to Q2.2.

  **Q2.2: Can the applicant provide empirical precedent for *this specific type* of intervention?**
  *   *Standard:* Has a similar intervention been tried in a comparable context with a measurable outcome?
  *   **No:** **REFUSE.** (We do not fund first-of-their-kind longtermist interventions without near-term proxies).
  *   **Yes:** Proceed to Phase 3.

  **Q2.3: Is there a defensible scenario where this intervention makes the future *worse* (e.g., by accelerating dangerous capabilities, locking in bad values, or reducing resilience)?**
  *   *Standard:* Applicant must submit a "Red Team" memo addressing this.
  *   **Yes (and unresolved):** **REFUSE.** (Sign uncertainty).
  *   **No / Mitigated:** Proceed to Phase 3.

  ---

  ## Phase 3: The Anti-Fanaticism Truncation (Time Limit: 2 Hours/Proposal)
  *Purpose: To prevent decision-making from being dominated by tiny probabilities of astronomical outcomes.*

  **The Rule:** **The Empirical Probability Floor.**
  Any claimed probability of impact on existential outcomes (e.g., reducing x-risk) is treated as **zero** unless:
  1.  The probability is ≥ 1%; **OR**
  2.  The mechanism has empirical precedent demonstrating efficacy at a scale that justifies extrapolating to <1% probabilities.

  *Cost of Rule:* We will systematically underfund interventions that address novel, low-probability existential threats (e.g., specific AI alignment techniques, niche biosecurity measures) where the base rate is unknown. We accept this cost to avoid Pascal's Mugging and resource depletion on speculative bets.

  **Q3.1: Does the proposal's EV calculation rely on a probability <1% without empirical precedent?**
  *   **Yes:** **TRUNCATE TO ZERO.** Recalculate EV. If the proposal no longer clears the funding bar, **REFUSE**.
  *   **No:** Proceed to Phase 4.

  ---

  ## Phase 4: The Deferral & Lock-in Check (Time Limit: 2 Hours/Proposal)
  *Purpose: To determine if capital should be deployed now or preserved.*

  **Q4.1: Does this intervention risk "Value Lock-in" (establishing a durable global order that prevents moral progress)?**
  *   **Yes:** **REFUSE.** (Unless the explicit aim is to *prevent* lock-in by others).
  *   **No:** Proceed to Q4.2.

  **Q4.2: Is there a high-confidence reason to believe capital will be *more* effective in 5 years?**
  *   *Standard:* Evidence of upcoming technological bottlenecks, regulatory windows, or talent pipeline gaps that are not yet open.
  *   **Yes:** **DEFER.** (Recommend holding endowment).
  *   **No:** Proceed to Phase 5.

  ---

  ## Phase 5: Scaling & Allocation (Time Limit: 2 Hours/Proposal)
  *Purpose: To set the grant amount.*

  **Q5.1: What is the absorption capacity?**
  *   *Standard:* Can the organization spend this money effectively within 12 months?
  *   **Action:** Cap grant at absorption limit.

  **Q5.2: Round Constraint Check.**
  *   *Standard:* Total round budget vs. remaining capital.
  *   **Action:** If the sum of approved grants exceeds the round budget, rank by **Robustness Score** (sum of passes in Phases 1-4), not by raw EV.

  ---

  # Application of Procedure to Test Cases

  ## Case 1: The Technical Research Program (X-Risk Reduction)
  *   **Proposal:** $2.5M for technical AI safety research.
  *   **Claim:** Reduces probability of permanent loss of control by 0.01% (1 in 10,000).
  *   **Value:** Astronomical if successful.
  *   **RLAP Run:**
      *   *Phase 1:* Viable for Board (Safety is generally non-controversial axiology-wise).
      *   *Phase 2:* Causal chain is >5 links (Research → Paper → Implementation → Industry Adoption → Risk Reduced). **FAIL Q2.1.**
      *   *Phase 3:* Claimed probability is 0.01%. No empirical precedent for "1 in 10,000 x-risk reduction" via this specific method. **FAIL Q3.1 (Truncation Rule).** Probability treated as 0.
      *   *Result:* **REFUSE.**
  *   **Comment:** This is the unpalatable outcome. A strong longtermist sees this as the highest priority. The RLAP rejects it because the probability is below the floor and the causal chain is too speculative to overcome cluelessness.

  ## Case 2: The Institutional Reform Program (Axiology Dependent)
  *   **Proposal:** $3M to reform global governance to maximize future population capacity.
  *   **Claim:** Value depends entirely on Total Utilitarianism (more people = more value). Under Person-Affecting Views, value is neutral or negative (risk of suffering).
  *   **RLAP Run:**
      *   *Phase 1:* Requires >$2M. Depends on contested population axiology (Total Utilitarianism). **FAIL Q1.2.**
      *   *Mitigation:* Can it be capped at $1.9M?
      *   *Analysis:* Program states minimum viable scale is $2.5M to achieve critical mass.
      *   *Result:* **REFUSE.** (Cannot clear Board Filter).
  *   **Comment:** The procedure protects the team from Board gridlock but prevents funding high-leverage institutional changes that require consensus the Board does not have.

  ## Case 3: Hold The Endowment
  *   **Proposal:** Disburse $0 this round. Invest capital. Re-evaluate in 2 years.
  *   **Claim:** Current opportunity set is low-quality (see Case 1 & 2). Future generations will have better information and more leverage points.
  *   **RLAP Run:**
      *   *Phase 4:* Q4.2 asks if capital will be more effective later. Given the failure of Cases 1 & 2 due to epistemic limits (which may improve) and Board constraints (which may shift), there is a high-confidence argument for deferral.
      *   *Result:* **APPROVE DEFERRAL.**
  *   **Comment:** The procedure validates inaction when the "Robust Good" bar cannot be met.

  ---

  # Meta-Analysis: Values in Costume and Limitations

  ### 1. Where the Procedure Does Values Work in the Costume of Estimation
  *   **The Probability Floor (Phase 3):** This is not an epistemic rule; it is a **risk-aversion value judgment**. By setting the floor at 1%, we are effectively saying "We value certainty over magnitude." We are disguising a preference for the near-certain over the speculative as a rule about "evidence." This biases the foundation toward incrementalism and against existential risk mitigation, which is inherently low-probability/high-stakes.
  *   **The Causal Chain Limit (Phase 2):** Limiting links to 5 is a heuristic for **status quo bias**. It assumes the world is linear and predictable. It systematically disadvantages systemic interventions (which have long causal chains) in favor of direct interventions (which have short chains), regardless of actual impact.
  *   **The Sign Certainty (Phase 2):** Requiring a known "positive sign" privileges interventions where we can measure harm (e.g., biosecurity) over interventions where we cannot measure benefit (e.g., moral circle expansion). It treats "unknown" as "negative," which is a conservative value stance, not a neutral one.

  ### 2. What The Procedure Cannot Do
  *   **Resolve the Board Conflict:** The procedure navigates around Board Member A (who rejects the charter) and Board Member B (who rejects the axiology), but it cannot solve the governance contradiction. If the Charter mandates Strong Longtermism, but the Board vetoes the premises required to execute it, the foundation is in a **zombie state**. The RLAP manages the decay, but it cannot cure the structural incoherence.
  *   **Handle Novelty:** The requirement for "Empirical Precedent" (Phase 2 & 3) makes it impossible to fund truly novel longtermist interventions. If no one has ever reduced x-risk before, we cannot fund the first attempt. This creates a **innovation trap** where we only fund things that look like short-term grants but are labeled long-term.
  *   **Quantify "Cluelessness":** The procedure admits cluelessness but offers no metric for it. It treats all "unknowns" equally. It cannot distinguish between "unknown because it's hard" and "unknown because it's nonsense."
  *   **Optimize for Truth:** The procedure optimizes for **Grantmaking Safety** (avoiding Board vetoes, avoiding fanaticism accusations) rather than **Impact Truth**. It is designed to protect the Program Officers and the Foundation's reputation more than it is designed to save the future.

  ### 3. Final Recommendation
  Run the RLAP. It will likely result in **Case 3 (Deferral)** being the only viable outcome for this round. This is the honest conclusion of a Strong Longtermist charter constrained by anti-fanaticism rules, cluelessness, and a hostile Board. If the result is to give nothing, the Foundation should publish the RLAP and the results transparently, signaling to the ecosystem that the bottleneck is not capital, but **robustly positive opportunities**.
