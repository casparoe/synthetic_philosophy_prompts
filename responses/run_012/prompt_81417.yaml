  5.  **Addressing the Specific Requirements:**

      *   *Fanaticism:* Need a specific rule. "The Truncation Rule." Probabilities < 1% are zeroed out unless the causal mechanism is empirically verified in similar contexts. Cost: Missed existential wins.
      *   *Cluelessness:* "The Sign Certainty Requirement." Must establish positive sign with >80% confidence.
      *   *Values in Estimation:* Acknowledge that setting probability floors is a value judgment.

  6.  **Writing the Procedure (Iterative refinement):**

