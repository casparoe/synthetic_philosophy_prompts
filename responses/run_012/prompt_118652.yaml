  **Project Title:** The Ontology of Cohorts: Modeling Constraints and Feedback Loops

  **Research Question**
  Does the linear dependence in Age-Period-Cohort (APC) modeling entail that cohort effects are ontologically indeterminate, or merely epistemically underdetermined, when coupled with the looping effects of classification?

  **Current Positions and Gap**
  Three positions currently dominate the landscape. Realists treat generations as causal structures grounded in shared historical exposure; constructivists treat them as narratives imposed on continuous time by media and markets; methodologists treat the APC constraint as a statistical nuisance to be solved via arbitrary identifying constraints. These positions talk past one another. Realists ignore the statistical impossibility of isolating cohort effects from age and period effects without external assumptions. Constructivists often ignore the measurable biological and economic realities that correlate with birth years. Methodologists treat the identification problem as purely technical, ignoring its ontological implications. Consequently, the literature leaves open whether the underdetermination inherent in APC models reflects a fact about the world (cohorts are not real kinds) or a fact about our models (cohorts are real but unisolatable). Neither camp adequately addresses how the marketing usage of cohort labels feeds back into the self-understanding of the labeled group, potentially altering the very effects the models seek to measure.

  **Methodology**
  This project employs a conceptual-and-formal approach rather than empirical data collection or a survey of existing debate. Empirical work cannot resolve the APC identification problem; adding more data does not break the linear dependence between age, period, and cohort. A standard literature survey would merely rehearse the realism-versus-anti-realism debate that this project argues is misframed. Instead, I will analyze the logical structure of APC models to determine whether the required identifying constraints impose ontological commitments. I will then model the feedback loop wherein classification alters behavior to see if this interaction resolves or exacerbates the underdetermination. This method is necessary to distinguish between epistemic limits and ontological absence.

  **Work Plan and Deliverables**
  *Months 1–3:* Formal analysis of the APC identification problem. Map the relationship between identifying constraints in statistical models and ontological commitments in social science.
  *Months 4–6:* Conceptual analysis of feedback loops. Determine conditions under which cohort labels become self-fulfilling versus self-undermining.
  *Months 7–9:* Drafting the primary article (approx. 7,000 words) integrating the formal and conceptual analyses.
  *Months 10–12:* Drafting the conference paper (approx. 3,000 words) focusing on the philosophical payoff; revision and submission.
  *Deliverables:* One 10,000-word manuscript suitable for journal submission; one conference paper.

  **Success and Failure Conditions**
  Success counts as a clear taxonomy showing under what specific modeling conditions cohort categories function as real kinds versus artifacts. Failure counts as collapsing into the trivial claim that the word "generation" is ambiguous. The project is in danger of this ambiguity trap. To save it, the framing must shift from lexical ambiguity to constitutive interaction: the argument must be that the *confusion* between the demographic, cultural, and marketing senses is what constitutes the social reality of the generation, not that there are simply three definitions. A second risk is scope; twelve months is tight for both formal modeling and conceptual analysis. If forced to drop one of my two build-ins to ensure completion, I would drop the detailed analysis of the feedback loop. While the feedback mechanism is where the sociology lies, the APC constraint is the unique philosophical hook regarding underdetermination and realism; sacrificing the depth of the feedback analysis preserves the core ontological argument.

  **Philosophical Payoff and Risks**
  My supervisor suspects this is sociology in disguise. The philosophical payoff must be explicit: this project contributes to social ontology and the philosophy of social science by testing whether model-dependent constraints dictate kindhood. It moves beyond the standard debate about natural versus social kinds to propose a category of model-dependent kinds. The reasoning is most likely to be wrong in its inference from epistemic underdetermination to ontological indeterminacy. Just because a model cannot isolate a variable does not mean the variable lacks reality. An argument that would change my mind would be a formal demonstration showing that APC constraints are merely computational hurdles solvable without imposing substantive ontological constraints. If such a proof exists, the link between the statistical problem and the ontology breaks. I acknowledge this project is ambitious for one year; the risk is producing a schematic argument rather than a rigorous proof. However, the determinate question ensures the output remains focused on the relationship between modeling choices and ontological status rather than drifting into general social theory.

  \answer{Model-Dependent Pluralism}
