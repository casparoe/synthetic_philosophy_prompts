prompt: |-
  I teach a 90-minute session on the definition of death to a mixed group of about 16 medical and philosophy students, and I want them to feel, rather than merely hear, why the neurological and circulatory criteria cannot be folded into one tidy account. Design a role-played hospital scenario in which a patient who has met neurological criteria for death — no brainstem function, an isoelectric EEG, a ventilator doing the breathing — is simultaneously an organ-donor candidate whose heart is still beating. Assign roles (intensivist, transplant surgeon, bedside nurse, family member, ethics consultant, and perhaps a hospital lawyer), give each a private brief with its own interests and constraints, and stage the sequence: confirmatory testing, the declaration, the family conversation, the procurement request, and a final decision under time pressure. The rules and briefs should make participants collide with the conflict themselves — the relative who asks whether the patient is really dead yet, the surgeon whose protocol needs the heart still beating, the nurse who observes that the patient "looks alive" — before anyone names the whole-brain/higher-brain distinction or the dead-donor rule.

  Then give me the materials (role briefs, a case timeline, a decision rule), a debrief that maps each moment onto a specific piece of the problem (the gap between the neurological and circulatory criteria; why irreversibility and permanence come apart; whether "death" is functioning here as a biological kind or as a legal and social status; why the transplant motive is both irrelevant and impossible to ignore), and an honest note on what the role-play cannot reproduce — especially what it cannot show about a body on which the two criteria would deliver different verdicts. Finally, tell me what will predictably go wrong the first time I run it, and how to handle the student who tries to dissolve the whole exercise by saying that death is just a definition.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Definition of Death (Neurological vs. Circulatory criteria).
      *   **Audience:** Mixed group (16 students: Medical + Philosophy).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make students *feel* the conflict, not just hear about it. Avoid abstract theory initially.
      *   **Method:** Role-played hospital scenario.
      *   **Specific Scenario:** Patient meets neurological criteria (brain dead) but heart is beating (organ donor candidate).
      *   **Roles:** Intensivist, Transplant Surgeon, Bedside Nurse, Family Member, Ethics Consultant, Hospital Lawyer.
      *   **Materials Needed:** Role briefs (private interests/constraints), Case Timeline, Decision Rule.
      *   **Debrief:** Map moments to specific philosophical/medical problems (gap between criteria, irreversibility vs. permanence, biological vs. legal status, transplant motive).
      *   **Limitations:** What the role-play *cannot* show (bodies where criteria diverge differently).
      *   **Troubleshooting:** Predictable failures + handling the "death is just a definition" deflationist student.

  2.  **Deconstruct the Core Conflict:**
      *   *The Tension:* Brain death = Dead (legally/medically in most jurisdictions). Circulatory death = Heart stops permanently.
      *   *The Problem:* In Donation after Brain Death (DBD), the body is "dead" but physiologically maintained. In Donation after Circulatory Death (DCD), the body is "alive" until withdrawal.
      *   *The Role-Play Focus:* The prompt asks for a patient who *has met neurological criteria* but is an *organ donor candidate whose heart is still beating*. This is the classic "Brain Dead Donor" scenario. The conflict arises because the *appearance* of life (warm, pink, beating heart) clashes with the *declaration* of death.
      *   *The Twist:* To make it "feel" conflicted, the family needs to be hesitant, the nurse needs to be uncomfortable, and the surgeon needs to be pressed for time. The "definition" shouldn't be the starting point; the *action* should be.

  3.  **Drafting the Scenario & Roles:**
      *   *Patient:* "Alex," 24-year-old, MVA, head trauma.
      *   *Setting:* ICU, 2:00 AM (adds pressure/fatigue).
      *   *Roles:*
          *   *Intensivist:* Needs to declare death correctly to avoid liability.
          *   *Surgeon:* Needs viable organs (heart beating is good, but time is tissue).
          *   *Nurse:* Sees the body moving (reflexes), feels the pulse. Emotional labor.
          *   *Family (Mother):* Sees chest rising. Hears "dead" but sees "alive."
          *   *Ethics:* Facilitates, but bound by policy.
          *   *Lawyer:* Risk management.
      *   *Private Briefs:* Crucial. They can't all know everything.
          *   Surgeon knows organ viability drops every minute.
          *   Nurse knows the family is watching closely.
          *   Mom doesn't understand "brain stem" vs. "heart."
          *   Lawyer worries about wrongful death suits.

  4.  **Structuring the 90-Minute Session:**
      *   *Intro (10 min):* Set the stage, no theory.
      *   *Role Play (40 min):* The core experience.
      *   *Debrief (30 min):* Connecting experience to theory.
      *   *Limitations & Troubleshooting (10 min):* Closing the loop.

  5.  **Developing the Debrief (The "Mapping"):**
      *   Need to connect specific role-play moments to philosophical concepts.
      *   *Nurse's discomfort* $\rightarrow$ Biological integration vs. appearance.
      *   *Surgeon's urgency* $\rightarrow$ The Dead Donor Rule (DDR) tension.
      *   *Mom's question* $\rightarrow* Social/ontological status of death.
      *   *Lawyer's input* $\rightarrow* Legal fiction vs. biological reality.

  6.  **Addressing the "Limitations":**
      *   Role-play happens in a room. It can't show the *biological decay* or the *long-term somatic support* of brain-dead bodies (pregnancy, growth).
      *   It focuses on DBD (Donation after Brain Death). It doesn't show DCD (Donation after Circulatory Death) where the criteria flip (alive until heart stops). This is a key distinction to note.

  7.  **Handling the "Deflationist" Student:**
      *   The student who says "Death is just a definition, so why argue?"
      *   *Counter:* Definitions have consequences. If we define it one way, we allow organ harvesting. If another, we don't. The *stakes* make the definition matter. It's not semantic; it's moral/legal.

  8.  **Refining the Materials (Self-Correction during drafting):**
      *   *Critique:* Is 16 students too many for one scenario?
      *   *Fix:* Split into two groups of 8 running parallel scenarios, or assign "observers" with specific tracking tasks. Let's suggest splitting into two groups of 8 to ensure everyone speaks. Actually, the prompt implies *one* scenario. With 16 students, I need to double up roles or have "junior" roles (residents, chaplain). Let's stick to the core 6 roles and make them pairs (e.g., two nurses, two family members) or have the rest be "observers with tracking sheets." *Decision:* Better to split the class into two identical teams running simultaneously. It increases engagement. I will write the plan assuming two groups of 8.
      *   *Wait, re-reading prompt:* "Assign roles... intensivist, surgeon, nurse, family, ethics, lawyer." That's 6 roles. 16 students. I will suggest 2 teams of 8. Each team gets the 6 roles + 2 observers/timekeepers.
      *   *Timeline:* Needs to be tight. 40 minutes for the play is generous but necessary for the "feel."
      *   *Decision Rule:* The prompt asks for a "decision rule." This is tricky. In reality, the rule is "Brain Dead = Dead." But the *play* is about the *pressure* around that rule. I will provide the *Hospital Policy* as the "Decision Rule" they must navigate.

  9.  **Final Polish:**
      *   Ensure tone is professional yet evocative.
      *   Make sure the "Deflationist" response is sharp.
      *   Check timing. 90 mins is tight for roleplay + debrief. I need to be strict on timekeeping.

  10. **Writing the Content:** (Drafting the response based on the above structure.)
      *   *Intro:* Acknowledge the pedagogical goal.
      *   *Setup:* Two groups.
      *   *Briefs:* Make them conflicting.
      *   *Debrief:* Connect to Bernat, Miller, Truog, etc. (implicitly).
      *   *Limitations:* Somatic support, DCD contrast.
      *   *Troubleshooting:* The "just a definition" objection.

  *(Self-Correction on the "Decision Rule"):* The prompt asks for a decision rule *in the materials*. I should provide the specific hospital protocol they have to follow, which creates the constraint.

  *(Self-Correction on "Irreversibility vs Permanence"):* Ensure the debrief explicitly distinguishes these. Irreversible (cannot restart) vs. Permanent (will not restart). In brain death, it's irreversible. In circulatory death, it's usually permanent (won't try to restart). This is a key philosophical nuance.

  *(Final check on constraints):* "Before anyone names the whole-brain/higher-brain distinction." The briefs must *not* use this jargon. They must use plain language ("brain stem gone," "no breathing," etc.).

