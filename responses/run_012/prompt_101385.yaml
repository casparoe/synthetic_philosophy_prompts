answer: |-
  This is a high-stakes pedagogical design. To make 16 students feel the tension rather than just discuss it, you cannot run a single plenary role-play (too many spectators). **Split the class into two identical teams of 8.** Run the scenarios simultaneously in separate corners of the room. Each team has 6 active roles and 2 "Clinical Observers" (who track time and emotional temperature).

  Here is the complete kit for the 90-minute session.

  ---

  # Part 1: The Scenario Materials

  ## Case Context (Read to All)
  **Patient:** Alex V., 24 years old.
  **History:** Severe traumatic brain injury following a motor vehicle accident 48 hours ago.
  **Current Status:** Comatose, on a ventilator. Pupils fixed and dilated. No spontaneous respiratory drive.
  **Situation:** Two hours ago, the first clinical exam for brain death was completed. An apnea test was positive (no breathing effort when CO2 rose). An EEG is isoelectric (flat).
  **The Stakes:** Alex is a registered organ donor. A heart and liver are matched to recipients currently in the OR.
  **The Time:** It is 02:00. The transplant team is scrubbed. The family is at the bedside.

  ## The Decision Rule (Hospital Policy)
  *Hand this to the Intensivist and Lawyer only.*
  > **Policy 44-B (Determination of Death):** Death may be declared when there is irreversible cessation of all functions of the entire brain, including the brain stem. Once declared, the time of death is retroactive to the time of the initial injury or the completion of testing, at the physician's discretion. **Organs may only be procured after death is declared.**

  ## Role Briefs (Private)
  *Cut these out. Do not let students share them until the debrief.*

  ### 1. The Intensivist (Attending Physician)
  You are responsible for declaring death. You know the legal criteria are met. However, you also know that if you declare death *now*, the family will see the chest rising (ventilator) and the monitor beeping (heart) and think you are lying. If you wait, the organs may degrade.
  *   **Goal:** Declare death legally and ethically, but keep the family from filing a complaint.
  *   **Constraint:** You cannot say "We need the organs." You must say "Alex is dead."
  *   **Secret:** You are tired. You want to go home. You worry about the "irreversibility" clause—if the ventilator keeps the body warm, is it *really* irreversible yet?

  ### 2. The Transplant Surgeon
  You are in the hallway. You know the recipients are dying. A heart is viable for 4 hours; it has been 3.5 hours since cross-match.
  *   **Goal:** Get the "All Clear" to cut within 30 minutes.
  *   **Constraint:** You cannot touch the patient until death is declared. If you pressure the Intensivist too hard, it looks like you killed the patient for parts (violating the Dead Donor Rule).
  *   **Secret:** You believe the "whole brain" criterion is a legal fiction that allows you to save lives. You don't care about the philosophy; you care about the pulse. As long as the blood is oxygenated, the organ is good.

  ### 3. The Bedside Nurse
  You have cared for Alex for 2 days. You just turned Alex in the bed; the skin is warm. You can feel the pulse when you check the line. The ventilator breathes for Alex.
  *   **Goal:** Advocate for the dignity of the body and the emotional state of the mother.
  *   **Constraint:** You must follow the doctor's orders, but you are the one the mother will grab when she cries.
  *   **Secret:** You saw a leg move earlier (a spinal reflex). You haven't told the doctor because you don't want to restart the testing clock, but it makes *you* feel like Alex is still here.

  ### 4. The Family Member (Mother)
  You love Alex. The doctor told you "there is no brain activity." But you are looking at Alex. The chest goes up and down. The face is pink.
  *   **Goal:** Understand what is happening without feeling like you are killing your child.
  *   **Constraint:** You do not know medical jargon. "Brain stem" sounds like a small part, not the whole person.
  *   **Secret:** You will ask: "If he is dead, why is his heart beating? If you turn off the machine, will he die? Then isn't the machine keeping him alive?"

  ### 5. The Ethics Consultant
  You are called in for "difficult declarations." You know the theory, but you cannot lecture.
  *   **Goal:** Ensure the process respects the Dead Donor Rule (do not kill to harvest).
  *   **Constraint:** You cannot override the Intensivist's medical judgment, but you can halt the process if it looks unethical.
  *   **Secret:** You are worried that "death" is being used as a tool to facilitate transplantation rather than a biological fact. You need to ensure the family isn't coerced.

  ### 6. The Hospital Lawyer (Risk Management)
  You are on speakerphone or in the corner.
  *   **Goal:** Prevent a lawsuit for wrongful death or battery.
  *   **Constraint:** If the family consents to organ donation *before* death is declared, it is illegal. If they consent *after*, it is fine.
  *   **Secret:** You know that in some jurisdictions, "irreversible" means "cannot be restarted," while "permanent" means "we won't restart it." You need to know which standard we are using.

  ### 7 & 8. Clinical Observers (x2)
  *   **Task:** Do not speak during the scenario.
  *   **Track:** 1. How many times is the heart mentioned? 2. At what exact minute is "death" declared? 3. Did anyone mention the recipients?
  *   **Report:** You will start the debrief.

  ---

  # Part 2: The Session Timeline (90 Minutes)

  | Time | Activity | Instructions |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide into 2 groups. Hand out briefs. **Strict Rule:** No philosophical jargon (no "ontological," "criterion," "integration"). Speak as your role. |
  | **10-50** | **Role Play** | **Phase 1 (15m):** Confirmatory testing & Internal Team Huddle (Doctors/Nurse/Lawyer).<br>**Phase 2 (15m):** Family Conversation (Intensivist/Mom/Ethics).<br>**Phase 3 (10m):** Final Decision & Procurement Request. |
  | **50-60** | **Break** | Step out of role. Hydrate. |
  | **60-80** | **Debrief** | Map the experience to the philosophical problems (see below). |
  | **80-90** | **Limitations & Troubleshooting** | Address what the play missed and handle the "definition" objection. |

  ---

  # Part 3: The Debrief Guide (Mapping Experience to Theory)

  *Do not lecture. Ask questions based on the Observers' reports.*

  **1. The Gap Between Criteria (The "Beating Heart" Problem)**
  *   *Ask the Nurse:* "You felt a pulse. The Intensivist said 'death.' Were you in the same room?"
  *   *The Point:* Neurological criteria (no brain) and Circulatory criteria (no heart) have come apart. Historically, they happened together. Technology (ventilators) separated them.
  *   *Concept:* **Biological Integration.** Is the body a whole organism (integrated by the brain) or a collection of parts (kept going by machines)?

  **2. Irreversibility vs. Permanence**
  *   *Ask the Lawyer/Intensivist:* "Did you argue about the word 'irreversible'?"
  *   *The Point:* If I *could* restart the heart but *choose* not to, is the cessation permanent or irreversible? In Brain Death, the loss of function is irreversible (biology). In Circulatory Death (DCD), it is often permanent (decision).
  *   *Concept:* **The Modal Status of Death.** Is death a biological state or a moral/legal decision not to treat?

  **3. The Dead Donor Rule (DDR)**
  *   *Ask the Surgeon:* "Did you feel pressure to declare death quickly?"
  *   *Ask the Ethics Consultant:* "Did the need for organs influence the definition of death?"
  *   *The Point:* The DDR says: "We must not kill patients to get organs." But if we define death *to allow* organ retrieval, are we circular?
  *   *Concept:* **Motive vs. Fact.** The transplant motive is medically irrelevant to whether the patient is dead, but sociologically impossible to ignore.

  **4. Biological Kind vs. Social Status**
  *   *Ask the Mother:* "When did you believe Alex was dead? When the doctor said it, or when the heart stopped?"
  *   *The Point:* For the family, death is a social transition (grieving, burial). For the hospital, it is a legal switch (billing, organ procurement).
  *   *Concept:* **Death as a Status.** Is death something that *happens* to a body, or something we *declare* about a person?

  ---

  # Part 4: Honest Limitations (What the Play Cannot Show)

  *Tell the students this explicitly.*

  1.  **Somatic Survival:** The role-play ends when the decision is made. It cannot show that a brain-declared body can be maintained for weeks (e.g., to gestate a fetus for a pregnant mother). If the body can grow, heal wounds, or gestate, does "biological death" hold up?
  2.  **The Reverse Case (DCD):** This scenario is Donation after Brain Death (DBD). It does not show Donation after Circulatory Death (DCD), where the patient is *alive* until the heart stops after withdrawal of support. In DCD, the "irreversibility" wait time is often only 5 minutes. This highlights the inconsistency: 5 minutes of no pulse = dead (for organs), but a beating pulse with no brain = also dead (for organs). The criteria are not unified; they are pragmatic.
  3.  **The "Black Box" of Consciousness:** The play treats "brain function" as a switch. It cannot reproduce the philosophical worry about "Higher Brain" death (consciousness) vs. "Whole Brain" death (brainstem). Alex has no consciousness, but the play focuses on the brainstem (breathing).

  ---

  # Part 5: Troubleshooting & The "Deflationist" Student

  **Predictable Failure Points:**
  *   **Medical Students dominate:** They will try to solve the case clinically ("Check the pupils again").
      *   *Fix:* The Intensivist brief explicitly says "Testing is complete." Force them into the ethical dilemma.
  *   **Family Member capitulates too fast:** They agree immediately.
      *   *Fix:* Instruct the Mother beforehand: "You are not hostile, but you are confused. You need them to explain it in a way that matches your eyes."
  *   **Time Creep:** The huddle takes too long.
      *   *Fix:* The Observers must call "Time" loudly at the 40-minute mark.

  **Handling the "Death is Just a Definition" Student:**
  *During the debrief, a student (usually a philosopher or a cynical clinician) will say:*
  > "This is all semantic. Death isn't a natural kind. It's just a line we draw. If we agree to draw it at brain stem failure, then he's dead. End of story."

  **Your Response:**
  1.  **Validate:** "You are technically correct. There is no 'death particle' we can detect. It is a concept."
  2.  **Challenge the Consequence:** "If it is *just* a definition, then we can move the line whenever we want. If we need organs, can we define death as 'severe dementia'? If we need ICU beds, can we define it as 'permanent vegetative state'?"
  3.  **The Constraint:** "The reason we feel tension in this room is that the definition is constrained by **reality**. If we define death too loosely, we kill people who might recover. If we define it too strictly, we let organs rot and recipients die. The definition isn't free; it is tethered to biology and morality. The role-play wasn't about finding the 'true' definition; it was about feeling the **cost** of the one we chose."
  4.  **The Kicker:** "If death is just a definition, why did the Nurse hesitate to touch the body? Why did the Mother cry? They were reacting to something more than a semantic convention. They were reacting to the loss of a *subject*. Your job is to explain why the definition tracks that loss, rather than just asserting the definition creates it."

  ---

  # Instructor's Note on Facilitation
  Your role during the 40-minute play is **Silent Director**. Do not intervene unless the rules are broken. If the group stalls, walk by the "Intensivist" and drop a note: *"The transplant team is calling for an update."* Let them sweat. The learning happens in the discomfort of the pause before the declaration.
