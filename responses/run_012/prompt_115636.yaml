answer: |-
  ### Working Out the Claim

  **The Core Claim:** You are arguing for two decouplings. First, you want to separate the *procedural* content of shared intention (Skeleton) from the *teleological/normative* content (Flesh), claiming only the former is necessary for joint action. Second, you want to reverse the explanatory direction: instead of intention causing action, stable behavioral patterns (Skeleton) generate the expectations that constitute intention (Downstream).

  **Load-Bearing Moves:**
  1.  **The Wall Case:** Must prove that joint action exists without shared purpose (Flesh).
  2.  **The Sufficiency Claim:** Must prove that Skeleton alone distinguishes joint action from mere coordination (the sidewalk shuffle).
  3.  **The Genetic Claim:** Must prove that "Downstream" intention is still *intention* (normative, reason-sensitive) and not just *habit* or *expectation*.

  **Condition for Contribution:**
  For this to be a contribution rather than a relabelling, "Skeleton Agreement" cannot just be Bratman's "Shared Plan" with a new name, and "Downstream Jointness" cannot just be Lewisian convention or Bourdieu-style habitus. You need to show that treating intention as *sediment* changes the normative structure of the account, not just the timeline.

  ***

  ### Comments

  **1. Is skeleton/flesh doing real work, or is it a relabelling?**
  It is largely a relabelling of the distinction between **Shared Intention** (Bratman) and **Shared Goal** (Gilbert/Tuomela), or more precisely, Bratman's distinction between **Shared Cooperative Activity** and **Shared Intention to Promote a Shared End**. Bratman already allows agents to participate in a joint activity while having divergent ultimate reasons (the "peace" vs. "monument" case fits his 1992 account of SCA).
  *What's left of yours:* The "Downstream" move. If you treat Skeleton/Flesh as merely clarifying the *content* of intention, you are retreading ground. If you treat it as a way to dissolve the requirement for *prior* mental state convergence, you have something new. Don't sell the distinction as ontological; sell it as genetic.

  **2. Where's the argument weakest?**
  You are right: it's **downstream jointness**. The risk here is eliminating the "action" from joint action. If shared intention is just the sediment of a stable pattern, you have described a *disposition* or a *convention*, not an intention. Intentions are reason-responsive; habits are not. If I stop bringing stones because I changed my mind, does the "sediment" dissolve? If yes, it was intention all along (upstream). If no, it's habit. You need to explain how downstream expectations acquire normative force (the "ought") without a prior commitment.

  **3. Give me one concrete counterexample that would sink the claim.**
  **The Deceptive Mirror.** I want to mock you. I watch you build the wall. I mimic your movements perfectly—lifting when you lift, placing when you place. We have behavioral fit (Skeleton). I know you expect me to help; you expect me to help. But I intend only to mock. Intuitively, we are not building the wall *together*. I am parasitic on your action.
  *Why it sinks you:* If you say this *is* joint action because the Skeleton fits, you've stretched "joint action" to include unilateral exploitation. If you say it *isn't*, then Skeleton (behavioral fit + mutual expectation) is insufficient. You need a cooperative stance, which looks suspiciously like "Flesh."

  **4. There's a slippage I can feel but can't pin down: is skeleton agreement about intentions and beliefs, or about behaviour?**
  You equivocate between "agreement" (mental) and "fit" (behavioral).
  *   Sentence 1: "Skeleton agreement: the parties **converge** on the shape..." (Implies mental state convergence).
  *   Sentence 2: "A **stable pattern** of skeleton agreement generates mutual expectations..." (Implies the pattern constitutes the agreement).
  *   Sentence 3: "...they **fit** perfectly..." (Purely behavioral).
  You need to decide: is Skeleton the *cause* of the fit (mental plan) or the *description* of the fit (behavioral regularity)? If it's the latter, you have the Deceptive Mirror problem. If it's the former, you haven't escaped the "upstream" picture entirely.

  **5. What's the strongest one-paragraph objection a Gilbert-style plural subject theorist would make to downstream jointness?**
  "Your downstream account describes a machine, not a group. Without a joint commitment (Flesh) established *prior* to or *constitutive* of the action, there is no normative bond between the parties. In your wall case, if one neighbour stops showing up, the other cannot legitimately rebuke them—they can only be disappointed. Joint action is defined by the entitlement to demand performance. By making intention the sediment of behavior, you remove the normative glue that makes us answerable to each other. You have explained coordination, not obligation."

  **6. If I've got someone's view plainly wrong, say so in a sentence.**
  You characterize the "received picture" as assuming parties must agree on "what they're doing" in a single sense; Bratman already explicitly rejects this, allowing for interlocking intentions with divergent ultimate goals (as in your wall case).

  **7. Should I keep the coinages or drop them for plainer terms?**
  Drop "Flesh." It carries too much baggage (Cartesian dualism, essentialism) and sounds pejorative (as if purpose is soft/optional). Keep "Skeleton" if you define it rigorously as "Procedural Consensus," but "Shared Plan" is clearer. Keep "Downstream Jointness"—that's your brand, and it captures the genetic reversal well.

  ***

  **Verdict:** The "Downstream" claim is a real contribution; the "Skeleton/Flesh" distinction is a useful clarification of existing Bratmanian loopholes but not ontologically new.
  **Originality Score:** 3.5
