      *   *Molyneux angle:* The training *is* the Molyneux task stretched over time. If they succeed, does it mean the content was always there (nativist) or built (empiricist)? The SSD literature assumes the latter builds the former.

  5.  **Final Polish:** Check against constraints. No lit review (don't cite Bach-y-Rita extensively, don't list every philosopher). Keep it tight. Focus on the *presuppositions*.

