answer: |-
  Here is the reconstruction of the implicit theory driving SSD discourse, stripped to its philosophical chassis.

  ### 1. The Implicit Ontology: Informational Functionalism
  The practice strictly presupposes **Informational Functionalism**. It treats perception as a relation between an agent and the environment mediated by information-carrying states, where the *identity* of the perceptual state is determined by its functional role (guiding action, spatial localization) and its informational content (distal properties), not by the qualitative character of the vehicle or the specific transducer.

  *   **Strictly Presupposed:** **Structural Isomorphism.** The device must preserve the topological and metric structure of the distal environment in the proximal stimulation pattern (tongue/back/sound). The user must be able to exploit sensorimotor contingencies (SMCs) such that changes in stimulation covary reliably with changes in the environment.
  *   **Merely Fits (The Smuggle):** **Phenomenal/Representational Identity.** The claim that the user is *seeing* presupposes that spatial content is **amodal**. It assumes that "squareness" is a single representational type that can be instantiated in V1 or on the somatosensory cortex without loss of identity. This rules out the view that visual content is *essentially* visual (i.e., that the modality is constitutive of the content).

  ### 2. Amodal Content vs. Isomorphism
  You asked if the practice requires shared spatial content or if isomorphism suffices.

  *   **Engineering Requirement:** Only **isomorphism** is required. For the device to work, the tongue pattern need not *be* visual; it need only map 1:1 to the visual field such that the agent can navigate.
  *   **Theoretical Commitment:** To call it "seeing" is to commit to **Amodal Spatial Representation**. This posits a "common currency" of space (likely egocentric or allocentric coordinates) that exists prior to modal instantiation.
  *   **What it Rules Out:** It quietly rules out **Strong Modality-Specificism** (e.g., early Merleau-Ponty or certain enactivist readings). If visual content is constituted by the specific SMCs of the eye-head-neck system, then tongue-based SMCs cannot, even in principle, constitute vision. They constitute a new, hybrid perceptual mode. The SSD literature assumes this distinction doesn't matter for *content*, only for *resolution*.

  ### 3. The Molyneux Tension: Empiricist Means, Nativist Ends
  Your intuition about the training vs. framing is correct. There is a tension here that the literature papers over with the concept of **neuroplasticity**.

  *   **The Training (Empiricist):** The months of calibration imply that the cross-modal mapping is not innate. The user must *learn* to interpret the signals. This aligns with the Empiricist answer to Molyneux: the connection between the spatial concept and the sensory datum is associative, not given.
  *   **The Framing (Nativist/Functionalist):** By claiming the user eventually "sees," the literature implies the *capacity* for visual-type representation was waiting for input. It treats the visual cortex as a modality-independent spatial processor that just needs data (the "metamodal" brain hypothesis).
  *   **The Resolution:** The practice resolves this by treating the **acquisition** as empiricist but the **constituency** as functionalist. They argue: "You learn the code (empiricist), but once decoded, the resulting state plays the visual role (functionalist), therefore it is vision."
  *   **The Problem:** This begs the question against the Modality-Specificist. If the learning period is required to build cognitive proxies (inference, judgment) rather than perceptual immediacy, then the user hasn't acquired vision; they've acquired a high-speed tactile cognition that *mimics* vision's functional output.

  ### 4. The Rival: Modality-Specific Content
  If you adopt the rival view—that perceptual content is essentially tied to the modality-specific SMCs or qualia—the SSD landscape changes drastically.

  **Theoretical Shift:**
  *   **Claim:** SSD users never see. They possess **enhanced tactile/auditory spatial cognition**.
  *   **Content:** There is no "shared square." There is a *visual-square* and a *tactile-square-analogue*. They are functionally equivalent but representationaly distinct.

  **Practical/Pitch Changes:**
  1.  **Terminology:** Stop using "Visual Prosthetic" or "Sensory Substitution." Use "Spatial Navigation Aid" or "Cross-Modal Translator."
  2.  **Success Metrics:** Stop testing for "visual" phenomena (e.g., do they experience visual illusions? Do they have a visual field?). Start testing for **transfer efficiency**. The goal isn't restoration of a lost sense, but optimization of a compensatory strategy.
  3.  **Device Design:** Current designs try to mimic the *retina* (grid arrays). A modality-specific approach might design for the *tongue's* native strengths (texture, temporal resolution) rather than forcing a visual topology onto a tactile surface. You wouldn't try to make the tongue "see"; you'd make the environment "speak to the tongue."
  4.  **Molyneux Interpretation:** If an SSD user passes a Molyneux test after training, the Modality-Specificist says: "They learned to translate," not "They recovered sight." The training isn't unlocking innate ideas; it's building a dictionary.

  ### Summary for the Chapter
  The SSD practice presupposes that **spatial content is amodal and defined by functional role**, while merely *fitting* the claim that **phenomenology is visual**. It relies on an **Informational Functionalist** ontology that treats the brain as a metamodal processor.

  This creates a friction with **Modality-Specificism**, which the practice resolves by redefining "seeing" as "successful spatial guidance via distal information." If you reject amodal content, the "seeing" claim collapses into metaphor, and the Molyneux training shifts from *perceptual awakening* to *cognitive skill acquisition*. The devices don't need to change, but the claim to have solved Molyneux does: you haven't shown that spatial concepts are innate or shared; you've shown they are translatable.
