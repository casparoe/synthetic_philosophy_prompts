answer: |-
  We agree that some old facts support later theories (like the bridge humming) while others do not.

  1. Is "support" fundamentally defined as raising the probability of the theory within your current belief system?
      1. No -> Go to 2.
      2. Yes -> Go to 4.

  2. Is support determined by how well the theory predicts the data compared to rivals, regardless of belief change?
      1. Yes -> **Leaf A: Likelihood/Severity View**.
      2. No -> Go to 3.

  3. Is the demand for a formal measure of support itself the error?
      1. Yes -> **Leaf B: Methodological Pluralism**.
      2. No -> **Leaf C: Unnamed (Support without Mechanism)**.

  4. Is your belief in the old fact absolutely certain (probability 1)?
      1. No -> **Leaf D: Fallibilist Bayesianism**.
      2. Yes -> Go to 5.

  5. Is the new information the fact itself, or the relationship between the theory and the fact?
      1. Relationship -> **Leaf E: Epistemic/Link View**.
      2. Fact itself -> Go to 6.

  6. Do we judge support by your actual current beliefs or a hypothetical state where you didn't know the fact?
      1. Actual -> **Leaf F: Strict Predictivism**.
      2. Hypothetical -> **Leaf G: Counterfactual Historian**.

  **Leaf A: Likelihood/Severity View** (Support is a matter of how well a theory predicts the data rather than of raising its probability)
  *   **Awkward Commitment:** It treats a theory's prior plausibility as irrelevant to confirmation, allowing wildly implausible theories to be "confirmed" by lucky fits.
  *   **Worst Case:** (ii) It struggles to distinguish between a theory that predicted the data and one that was built specifically to fit it, as the likelihoods are identical.

  **Leaf B: Methodological Pluralism** (The whole apparatus is the wrong tool for the job)
  *   **Awkward Commitment:** It offers no unified rule for resolving conflicts when different qualitative methods (e.g., explanation vs. prediction) point in opposite directions.
  *   **Worst Case:** (i) In the plain bridge case, it cannot explain why your intuition of support is so robust if there is no underlying metric to capture it.

  **Leaf C: Unnamed (Support without Mechanism)**
  *   **Awkward Commitment:** It asserts that support exists objectively but denies it is probabilistic, predictive, or qualitative, leaving the nature of support entirely mysterious.
  *   **Worst Case:** (v) When the old fact is entrenched but not certain, this view provides no guidance on how that degree of entrenchment interacts with the theory.
  *   **Status of Space:** This branch is empty because the position is unattractive; positing a support relation with no definable mechanism is generally seen as philosophically idle.

  **Leaf D: Fallibilist Bayesianism** (The puzzle is an artefact of treating knowledge as certainty and dissolves once my old degrees of belief are allowed to sit below one)
  *   **Awkward Commitment:** It requires you to assign non-zero doubt to facts you treat as undeniable in daily life, such as the bridge humming in frost.
  *   **Worst Case:** (i) In the plain case where the fact feels logically necessary, forcing a probability less than one feels like an artificial mathematical trick rather than a genuine description of belief.

  **Leaf E: Epistemic/Link View** (The real work is done by something new I learn about my own observation rather than about the bridge)
  *   **Awkward Commitment:** It shifts the evidence from the world (the bridge) to your mind (the realization that the theory explains the bridge), making confirmation partly self-referential.
  *   **Worst Case:** (iv) If what you learn is specifically about your own observation process, this view risks collapsing into a tautology where you only confirm that you noticed what you noticed.

  **Leaf F: Strict Predictivism** (Old facts are not evidence at all and only predictions made in advance count)
  *   **Awkward Commitment:** It forces you to deny the strong intuition that the bridge's hum supports the fatigue theory, classifying it as having zero confirmatory value.
  *   **Worst Case:** (i) In the plain case, it contradicts the universal scientific practice of using known phenomena to validate new explanations.

  **Leaf G: Counterfactual Historian** (I should judge the theory against my state of mind before I learned the fact, rewinding the tape)
  *   **Awkward Commitment:** It bases rational belief on a fictional state of ignorance that you no longer occupy and may never have actually experienced.
  *   **Worst Case:** (iii) If you cannot remember a time before you knew the fact, constructing the hypothetical state becomes arbitrary and unconstrained.

  **Empty Branches Analysis**
