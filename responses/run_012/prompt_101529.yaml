  6.  **Stress-Testing with New Cases:**
      *   *Solitary Confinement:* Moral Personhood intact. Social Personhood severely damaged/atrophied. (Fits).
      *   *Last Speaker of Dying Language:* Moral intact. Social Personhood precarious but sustained by the *attempt* to maintain relation with the past/future. (Fits).
