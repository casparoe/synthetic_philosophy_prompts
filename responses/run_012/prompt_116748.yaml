answer: |-
  You have put your finger on one of the most persistent and uncomfortable inconsistencies in human moral reasoning. You are right: this is not just the standard "free will vs. determinism" debate. The free will debate asks whether *any* cause eliminates responsibility. Your observation is sharper: you are asking why *some* causes eliminate responsibility while others reinforce it, and why the rules change depending on whether the act is good or bad.

  There isn't one single dictionary word for this, but in philosophy and moral psychology, this cluster of problems is usually discussed under two headings: **The Asymmetry of Moral Attribution** and **The Problem of Moral Luck**.

  If you want a label to hang on this specific pattern so you can discuss it, I suggest calling it **"The Ownership Asymmetry."**

  Here is the breakdown of what is actually happening, the rule that governs it, and where the edges are.

  ### 1. The Rule: The "Alienation" Test
  You asked for the rule that decides which causes excuse and which condemn. The rule is not about whether the act was *caused* (everything is caused). The rule is about whether the cause is viewed as **internal (owned)** or **external (alien)** to the agent's "true self."

  *   **External/Alien Causes (Excuses):** When you say, "He had a brain tumor" or "He was raised in a war zone," you are framing the cause as something that happened *to* him. It is an intrusion. In philosophy, this shifts the observer from what P.F. Strawson called the **Participant Stance** (treating him as a peer responsible for his actions) to the **Objective Stance** (treating him as a patient to be managed or cured). The cause is seen as bypassing his agency.
  *   **Internal/Constitutive Causes (Condemns):** When you say, "That's just the kind of person he is," you are framing the cause as *him*. It is not an intrusion; it is an expression. This reinforces the Participant Stance. We blame the character because the character *is* the agent.

  **The Rule:** A cause excuses if it is perceived as **alien** to the agent's will. A cause condemns if it is perceived as **constitutive** of the agent's will.

  ### 2. The Lopsidedness: Why Praise Survives but Blame Doesn't
  You noticed that causes erase blame but often leave credit intact. This is the **Asymmetry of Moral Luck**, famously articulated by philosopher Thomas Nagel.

  *   **Blame requires a violation of duty.** To blame someone, we generally need to believe they *ought* to have done better and *could* have done better. If a tumor or a traumatic upbringing shows that their capacity to choose was compromised, the "could have" disappears. The duty is voided.
  *   **Praise accepts giftedness.** When a woman is generous because she has a "warm temperament," we usually don't say, "Oh, she couldn't help it, so she gets no credit." In common moral intuition, we treat virtue differently than vice. We view bad acts as failures of agency (which can be excused by causes) but good acts as expressions of excellence (which are still valuable even if lucky).

  **The Conflict:** Immanuel Kant would disagree with your intuition on praise. Kant argued that if you are generous just because you have a sunny temperament, you deserve **no moral worth**, because you didn't struggle against your nature to do the right thing. But "folk morality" (how regular people actually think) disagrees with Kant. We praise the saint even if she was "born that way." We excuse the sinner if he was "broken that way."

  **Why the asymmetry?** It is likely evolutionary. We need to identify and neutralize threats (blame), so we are hyper-sensitive to excuses that suggest a threat is uncontrollable. But we want to encourage and bond with benefactors (praise), so we are happy to accept their goodness regardless of its origin.

  ### 3. The "Character" Trap
  You mentioned something very keen: *"If you tell me he did it 'because that's the kind of person he is'... I blame him more."*

  This is the heart of **Attribution Theory** in psychology.
  *   **Situational Attribution:** "He hit someone because he was provoked." (External $\rightarrow$ Less Blame).
  *   **Dispositional Attribution:** "He hit someone because he is violent." (Internal $\rightarrow$ More Blame).

  The reason "That's who he is" increases blame is that it implies **stability** and **predictability**. A tumor might be removed; a bad day might pass. But if cruelty is his *character*, he is a permanent danger. We punish character more severely than circumstance because character implies future risk.

  ### 4. Where the Edges Are (The Test Cases)
  To see if this definition holds, we have to push it to the edges. This is where the "Ownership Asymmetry" gets messy.

  **Edge Case A: The Psychopath**
  *   *Scenario:* A man feels no empathy due to a brain abnormality (biological cause) and kills someone.
  *   *The Conflict:* Is this "alien" (tumor = excuse) or "constitutive" (that's who he is = blame)?
  *   *Result:* The law often struggles here. If the biology removes the *capacity* to understand right from wrong, it's an excuse (Insanity Defense). If it just removes the *inhibition* to act on bad desires, it's not an excuse. The line is thin.

  **Edge Case B: The "Natural" Saint**
  *   *Scenario:* A woman helps everyone, but only because she gets a dopamine hit from it (biological cause).
  *   *The Conflict:* Is she virtuous or just addicted to feeling good?
  *   *Result:* Most people still credit her. This proves your point that praise is robust against causal explanations. However, if we find out she helps people *only* to manipulate them (a hidden cause), the credit vanishes instantly. This suggests praise depends on **benevolent intent**, not just the cause of the behavior.

  **Edge Case C: Addiction**
  *   *Scenario:* A man steals to feed an opioid addiction.
  *   *The Conflict:* "The drug made him do it" (Alien) vs. "He chose to start using" (Constitutive).
  *   *Result:* Society is torn. We increasingly view addiction as a disease (excuse), but we still hold addicts responsible for seeking treatment (blame). This shows the "Ownership" line can move over time as culture changes.

  ### Summary
  You are describing **The Asymmetry of Moral Attribution**.

  1.  **The Mechanism:** We distinguish between causes that **bypass** the will (tumors, coercion) and causes that **express** the will (character, values).
  2.  **The Asymmetry:** We allow external causes to excuse bad acts (removing duty) but rarely allow them to negate good acts (accepting luck).
  3.  **The Name:** If you need a term for your own use, call it **"The Alienation Condition."** A cause excuses only if the agent can be alienated from it. If the cause is woven into who they are, they own it. If they own it, they own the blame.

  You aren't missing a class; you've identified a tension that professional ethicists spend careers trying to resolve. The system isn't broken; it's just that human moral judgment isn't designed for logical consistency. It's designed for social navigation. We excuse threats we can't control, and we reward benefits we receive, regardless of the physics behind them.
