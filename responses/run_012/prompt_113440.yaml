answer: |-
  The nets sat in the sheds for five years. They smelled of salt and disuse, the cork floats gathering dust while the men of Oakhaven sat on the dock wall, watching the tide.

  There were two grounds: the Flats and the Drop. The Flats were shallow, easier to work, but rumored to be fished out. The Drop was deep, dangerous, but rumored to be rich. Nobody knew for sure. To switch grounds meant buying new nets, recalibrating the winches, and risking the season on a guess. But there was a heavier cost: isolation. If you fished the Drop alone, you had no one to share diesel runs, no one to watch your buoys in a squall, and no leverage with the buyers who came only where the boats were. You needed to be where the others were, even if where they were was wrong.

  So they waited. It was sensible. If you committed first, you bore the cost of the new gear and the risk of the guess. If you waited, you could watch who committed, infer what they knew, and follow them for free. But since everyone reasoned the same way, the nets stayed in the sheds. The town held its breath.

  The break came in late autumn. Three captains—Harris, old man Gable, and the twins—hauled their boats out and began rigging for the Flats. They didn't make a speech. They just bought the shallow-water mesh and painted their buoys yellow.

  The rest of the town watched. Harris had a sonar unit nobody else could afford. Gable had been fishing since before the war. If they were betting on the Flats, they must have seen something. The signal was clear.

  Mara stood by her boat, the *Kestrel*. She had a logbook in her cabin thick with depth charts and temperature logs. She had spent the summer running silent tests along the edge of the Drop. The water there was cold and nutrient-dense. The Flats were warm and thin. She knew, with the quiet certainty of data, that the Drop would yield three times the catch.

  She looked at Harris's boat. She looked at Gable's. She looked at the line of other captains beginning to strip their deep-water gear. If she rigged for the Drop, she would be the only one. She would pay double for fuel. She would have no one to radio for help if the winch jammed. The buyers wouldn't come to her dock. She could be right, and she could be bankrupt.

  Mara went into the shed and pulled down the yellow buoys. She ordered the shallow nets.

  When she tied the first buoy to the rail, the signal died. The next captain to watch her saw only that she was following the crowd. Her choice no longer told anyone what she knew about the water; it only told them she wanted to be where the diesel was cheap. But the line was already long. By winter, every boat in Oakhaven was rigged for the Flats. The town breathed out. The coordination was complete. They were together.

  They fished the Flats all spring. The catch was decent. Not great, but enough. The buyers came, because all the boats were there. The price held. They told themselves the Drop was a myth, a ghost story for young fishermen.

  Then, in June, a buyer from the mainland came down to weigh the crates. He was new, a young man with a clipboard who hadn't been there the year before. He watched the yellow buoys bobbing in the shallow water while he signed the manifests.

  "Heard the Drop was running hot up in Portsville," he said offhand, not looking up from his pen. "Big stuff. Maybe the current shifted."

  He didn't know Oakhaven. He didn't know about the five years of waiting. He didn't know about Harris's sonar or Mara's logbook. He was just making conversation about the region.

  He left on the afternoon tide.

  By evening, Harris was on the dock. He was talking to Gable. They weren't shouting. They were speaking in the low, urgent tones of men recalculating risk. The buyer's comment was nothing. It was hearsay from a town two hundred miles away. It was worth less than Mara's logbook, worth less than a single day of their own experience.

  But the spell was broken. The public record had been solid because everyone was doing the same thing. Now that one voice suggested the alternative, the silence of the others became noise. Did Harris know the Drop was better and was just waiting for someone else to say it? Was Gable holding back?

  The coordination payoff flipped. If the Drop was indeed running hot, and everyone stayed on the Flats, the first one to switch would get the premium price before the market flooded. Being alone was suddenly profitable.

  Mara watched from the *Kestrel*. She saw the yellow buoys being pulled off the rails. She saw the deep-water nets coming out of the sheds. She saw the town moving again.

  She did not open her logbook. She did not tell them she had known all along. She simply went to her storage locker and swapped the yellow buoys for the red ones.

  There was no debate. There was no vote. The town moved to the Drop with the same quiet certainty they had moved to the Flats. They told each other the currents had shifted. They told each other the Flats were played out. They felt confident. They felt united.

  Mara tightened the lines on the red buoys. The water looked the same as it had yesterday. The tide came in just as it always had. She started the engine, waiting for the others to pull out, ready to follow them into the deep, hoping they were right this time, knowing there was no way to tell.
