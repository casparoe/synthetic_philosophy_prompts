answer: |-
  The assertion that history turns on a nail is best understood as a thesis about explanatory selection rather than causal structure, because macrolevel historical outcomes are typically robust against microlevel perturbations despite the sensitivity of deterministic processes. To adjudicate the controversy regarding load-bearing versus decorative contingencies, one must first disentangle the ontological status of historical causation from the epistemological practices of historical narration. A load-bearing contingency implies that the causal chain is fragile, such that a minor alteration prevents a specific macro-outcome entirely, whereas a decorative contingency implies that the causal chain is robust, such that minor alterations change only the texture of an outcome that was structurally determined to occur. When historians describe history as chaotic, they often conflate the unpredictability of specific events with the fragility of general outcomes, mistakenly assuming that sensitivity to initial conditions necessitates that most consequential outcomes depend on load-bearing contingencies.

  The distinction between deterministic sensitivity and genuine indeterminism is crucial for evaluating this conflation. If historical processes are deterministic but sensitive, akin to chaotic systems in fluid dynamics, then微小 differences in initial conditions amplify over time. However, it is a contested view among philosophers of social science whether human societies exhibit the mathematical properties of chaos sufficient to generate true butterfly effects; while it is settled that social systems are complex and nonlinear, the claim that they are chaotic in the strict sense remains debated. Even granting deterministic sensitivity, chaos theory does not entail that all outcomes are fragile. Chaotic systems often possess "attractors," states toward which the system evolves regardless of initial variations. In a historical context, structural factors such as geography, demographics, and economic incentives function as attractors, rendering macro-outcomes like the rise of agriculture or industrialization robust against micro-level noise. Thus, under a deterministic model, a chaotic causal structure can still leave macrolevel outcomes robust, rendering most contingencies decorative rather than load-bearing.

  Conversely, if historical processes are genuinely indeterministic, the future is not fixed by the past, and probabilities are fundamental rather than epistemic. Under this view, load-bearing contingencies are ontologically possible at every juncture, but their prevalence is still constrained by probability distributions shaped by structural forces. It is settled among metaphysicians that indeterminism does not imply equiprobability; certain outcomes can remain highly probable despite underlying openness. Therefore, even in an indeterministic universe, structural constraints can channel events into specific macro-outcomes, making the occurrence of those outcomes robust even if the specific path was not determined. The claim that history turns on a nail suggests that these structural constraints are weak enough that low-probability events routinely override high-probability trends, a view that is heavily contested by proponents of historical materialism and structuralism who argue that macro-outcomes are largely invariant to individual agency.

  Consequently, the historian's insistence that history turns on a nail is best interpreted as a thesis about explanation rather than causation. Historians select load-bearing contingencies for narration because they are explanatorily salient; a decorative contingency offers little narrative leverage because the outcome would have obtained anyway. This creates a selection bias where load-bearing contingencies appear more prevalent in historical literature than they are in historical reality. The phrase "turns on a nail" functions as a rhetorical trope that highlights the drama of human agency and the openness of the past, but it fails as a rigorous causal claim because it ignores the stabilizing force of structural attractors. While it is contested whether specific events like the assassination of Archduke Ferdinand were truly load-bearing or merely decorative accelerants of inevitable conflict, it is clear that the generalization that *most* history turns on nails is an explanatory heuristic rather than an ontological truth. Ultimately, a broadly chaotic causal structure is compatible with robust macrolevel outcomes, and the commitment to load-bearing contingencies reflects a preference for narrative distinctiveness over structural analysis.
