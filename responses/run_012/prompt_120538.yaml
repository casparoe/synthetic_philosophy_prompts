      *   **2. Pareto Filter:** Priority weighting + Pareto constraint (no one worse off without someone better off).
          *   *Critique:* This is the standard Parfit/Otsuka move. It treats Prioritarianism as a *principle of choice* rather than a *theory of value*. It blocks LDO by fiat.
          *   *Status:* Very common, but critics say it concedes the LDO point (that the axiology is weird) and just patches it procedurally.

      *   **3. Claims Instead of Levels:** Strength of claim depends on absolute level + size of gain. Outcome better if claims favoring > claims against.
          *   *Critique:* This sounds like "Claims Prioritarianism" (Otsuka/Voorhoeve). It handles LDO because making the rich worse off generates a negative claim, which usually outweighs the "equality" gain.
          *   *Status:* Strong contender. Shifts from outcome value to individual claims.

      *   **4. Telic/Deontic Split:** Axiology says leveled down is better, but morality says don't do it.
          *   *Critique:* The user suspects incoherence. They are right. If the *telic* (outcome) view says A is better than B, but the *deontic* (action) view says you must choose B, you have a断裂 (rupture) in normative theory. It admits the LDO is true (the outcome *is* impersonally better) but says we shouldn't pursue it. This is often seen as biting the bullet rather than fixing it. It's not incoherent logically, but it's theoretically unstable.
