      *   **5. Threshold Version:** Priority weight only below a line.
          *   *Critique:* This is Sufficiency View (Frankfurt). It avoids LDO for those above the line (no weight to change) and below the line (leveling down hurts them). But the threshold itself is arbitrary.
          *   *Status:* It's a different theory (Sufficiency), not a repair of Prioritarianism.

      *   **6. Change the Currency:** Rank by advantage/opportunity, not wellbeing.
