answer: |-
  **MEMORANDUM**

  **TO:** Chair, Department of Philosophy
  **FROM:** [Consultant Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Research Agenda for the Set Theory Cluster: Anchoring Questions on the Axiom of Choice

  ### 1. Executive Summary

  You have requested a fixed research agenda for a new cluster on the Axiom of Choice (AC). The constraint that the agenda must survive hiring turnover requires questions that are robust enough to accommodate different specializations yet specific enough to generate cohesion. My recommendation prioritizes questions that bridge the gap between technical set theory and broader mathematical practice.

  I recommend **retaining (a), (c), (d), and (e)**, while **dropping (b)** as a primary anchor. I recommend **supplementing (f)** by merging it into (a) and (c).

  The proposed ordering prioritizes the *normative* question (which principles should govern practice?) over the *metaphysical* question (what is the status of the universe?), as the former offers greater traction for impact beyond pure set theory.

  ### 2. Evaluation Criteria

  To rank these candidates, I applied four criteria tailored to your constraints:

  1.  **Upstreamness:** Does resolving this question clarify other debates within set theory or the philosophy of mathematics?
  2.  **Tractability:** Can a philosopher with logical training make substantive progress within a 3–5 year horizon, or is it purely mathematical?
  3.  **Neglect:** Is the area saturated, or is there room for novel philosophical intervention?
  4.  **External Impact:** Does the work resonate with analysts, algebraists, or general philosophers of science?

  ### 3. The Anchors: Retained and Ranked

  #### Priority 1: The Competition of Principles (Candidate c)
  *Gloss:* Investigating the rivalry between Full AC, weaker variants (Countable/Dependent Choice), and the Axiom of Determinacy (AD), asking which is the "correct" foundation for mathematical practice.

  *   **Upstreamness:** High. This determines the rules of the game. If AD is preferred for descriptive set theory, AC's dominance is challenged. This dictates how we interpret results in analysis and topology.
  *   **Tractability:** High. The mathematical landscape is well-mapped (e.g., Solovay's model, consequences of AD). The philosophical work lies in evaluating the *costs* of abandoning AC (loss of Tychonoff's theorem, etc.) versus the *benefits* (regularity properties).
  *   **Neglect:** Moderate. Mathematicians generally accept ZFC pragmatically. Philosophers often treat AC as a monolith rather than comparing specific fragments against specific alternatives.
  *   **External Impact:** High. Analysts care about measure theory (impacted by AC); computer scientists care about constructivity (impacted by Full AC vs. DC).
  *   **Shifting Condition:** If a new consistency result shows that a weaker principle suffices for 99% of analysis, this topic moves from "foundational competition" to "technical cleanup," lowering its priority.

  #### Priority 2: Justification and Pathology (Candidates a + f)
  *Gloss:* Merging the intrinsic/extrinsic justification debate with the objection regarding non-constructive consequences (Banach–Tarski, non-measurable sets). Can AC be justified if it entails "paradoxical" results?

  *   **Upstreamness:** High. This addresses the *legitimacy* of the axioms used in Priority 1.
  *   **Tractability:** Moderate. The "paradoxes" are well-known. The philosophical lift involves re-evaluating what counts as a "cost." Is non-measurability a bug or a feature of richness?
  *   **Neglect:** Low to Moderate. This is a classic debate. To avoid stagnation, the cluster must avoid rehashing 1970s arguments and focus on *extrinsic* justification via modern unifying power (e.g., category theory).
  *   **External Impact:** Moderate. General philosophers of mathematics care deeply about justification. Practicing mathematicians care less, unless the justification impacts utility.
  *   **Shifting Condition:** If a compelling intrinsic justification for AC is found (e.g., via a new iterative conception of set), this drops in priority. If Multiverse views (Priority 3) gain dominance, the need for singular justification evaporates.

  #### Priority 3: The Multiverse Challenge (Candidate e)
  *Gloss:* Assessing whether the existence of multiple set-theoretic universes (some with AC, some without) renders the question of AC's "truth" deflated or relative.

  *   **Upstreamness:** Very High. If the Multiverse view is correct, Priority 1 and 2 change from "finding the truth" to "mapping the landscape."
  *   **Tractability:** Moderate. This is primarily metaphysical/semantic. It requires understanding forcing and model theory but not necessarily producing new theorems.
  *   **Neglect:** Low. This is currently the hottest topic in philosophy of set theory.
  *   **External Impact:** Low. Most working mathematicians operate in a single universe (ZFC). This matters mostly to foundationalists.
  *   **Shifting Condition:** If the mathematical community coalesces around a specific "ultimate L" or forcing axiom that privileges one universe, the Multiverse view loses traction, and this topic becomes historical.

  #### Priority 4: Reverse Mathematics as Methodology (Candidate d)
  *Gloss:* Using reverse mathematics to determine exactly which theorems of ordinary mathematics require Full AC, DC, or no choice at all.

  *   **Upstreamness:** Low (Methodological). This is a tool to answer Priority 1.
  *   **Tractability:** High for logicians, Low for general philosophers. Requires significant technical training.
  *   **Neglect:** High (in Philosophy). Philosophers often cite reverse math results without engaging the methodology.
  *   **External Impact:** Very High. This is the direct bridge to analysis and algebra.
  *   **Shifting Condition:** If automated proof assistants begin to handle choice dependencies transparently, the philosophical urgency of manual reverse math may decline.

  ### 4. Dropped Candidate

  **Candidate (b): The Search for a New Axiom to Settle CH.**
  *Reason for Dropping:* While critical for set theory, this drifts away from the *Axiom of Choice*. The search for new axioms (Large Cardinals, Forcing Axioms) often presupposes AC. Making CH the anchor risks turning the cluster into a "Continuum Hypothesis" cluster, diluting the specific mandate. Furthermore, this is highly technical; a philosopher hired to work on this might end up doing pure math, reducing the cluster's philosophical output.
  *Trade-off:* If a hire is specifically an expert in Forcing Axioms, they may pursue this privately, but it should not consume cluster resources intended for AC.

  ### 5. Trade-offs and Resource Allocation

  The primary tension is between **Metaphysics (e)** and **Practice (c & d)**.

  *   **The Conflict:** A hire focused on the Multiverse (e) will produce work relevant to general metaphysics but may alienate mathematicians who view AC as a tool. A hire focused on Reverse Math (d) and Competing Principles (c) will produce work relevant to analysis but may seem "too technical" for the broader philosophy department.
  *   **The Sacrifice:** If forced to choose, **sacrifice deep engagement with the Multiverse (e) in favor of the Normative/Practice agenda (c & d).**
      *   *Why:* Your goal is to matter beyond pure set theory. The Multiverse view is largely insular to foundations. The question of "Which Choice Principle is useful for Analysis?" (c/d) directly engages analysts and algebraists.
      *   *Compromise:* Treat the Multiverse not as a truth claim, but as a heuristic: "If we live in a multiverse, how do we choose axioms for *this* universe's practice?" This subsumes (e) under (a).

  ### 6. External Impact Strategy

  To ensure the cluster matters to analysis, algebra, and general philosophy:

  1.  **Focus on "Ordinary Mathematics":** Direct Priority 1 (Competition) and Priority 4 (Reverse Math) specifically toward theorems in functional analysis and abstract algebra. Ask: "Does the Hahn-Banach theorem *need* Full AC, or is DC enough?" This invites collaboration with math departments.
  2.  **Reframe Justification:** In Priority 2, move away from "Is AC true?" to "Is AC *fruitful*?" This aligns with scientific realism debates in general philosophy of science, making the work accessible to non-logicians.
  3.  **Workshops:** Host joint workshops with the Mathematics department on "Foundations of Analysis," using the cluster's philosophical framework to structure the discussion.

  ### 7. Conditions for Re-ranking

  The proposed ranking is stable under normal conditions but should be revisited if:

  1.  **A New "Great Axiom" Emerges:** If a new axiom is proposed that settles CH *and* implies/rejects AC in a compelling way (reviving Candidate b), the agenda must shift to evaluate this axiom.
  2.  **Proof Assistant Breakthroughs:** If Lean/Coq formalization makes the dependency of theorems on AC trivial to check, the Reverse Math agenda (d) loses urgency, and the cluster should pivot to the *interpretation* of those results (Priority 2).
  3.  **Consensus Shift in Math:** If the mathematical community broadly adopts a framework like Homotopy Type Theory (which treats Choice differently), the cluster must pivot from ZFC-based AC to "Choice in Type Theory."

  ### 8. Conclusion

  By anchoring the cluster on the **Normative Status of Choice Principles (c)**, supported by **Justification (a/f)** and **Reverse Mathematics (d)**, you create an agenda that is philosophically deep but mathematically grounded. This avoids the insularity of pure metaphysics (e) and the drift of the CH problem (b). It ensures that regardless of which specific philosophers are hired, they are working toward a coherent goal: determining not just what the Axiom of Choice *is*, but what it is *for*.
