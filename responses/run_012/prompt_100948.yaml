answer: |-
  To succeed, you must structure the session as a trap that springs shut on computational solutions, forcing the audience to realize that the frame problem is not about how to calculate change efficiently, but about how to define relevance at all.

  ### The Carrying Example: The Autonomous Urban Zoning Administrator
  You will use a single scenario throughout: an AI system tasked with managing city planning permissions.
  *   **The Action:** The system approves a variance to rezone Plot A from "Residential" to "Mixed-Use."
  *   **What it must contain:** A web of interconnected logical constraints (e.g., fire codes depend on zoning; property taxes depend on zoning; neighbor sunlight rights depend on building height). This ensures the ML students see the dependency graph and the Philosophy students see the normative implications.
  *   **What it must conspicuously lack:** Any rule or boundary defining what is *irrelevant* to the action. The scenario must not specify that rezoning Plot A does not change the color of the paint on Plot B, the name of the Mayor, or the gravitational constant. This absence is the trap; it forces the audience to realize that without this list, the system cannot logically guarantee the world hasn't gone insane, but with this list, the system collapses under infinity.

  ### The Sequence of Ideas and Dependencies
  You have 75 minutes. Do not deviate from this order, as each step creates the necessity for the next.

  1.  **Action as State Transition (0–10 mins):** Define the AI's task purely as moving from State 1 (Pre-Approval) to State 2 (Post-Approval).
      *   *Dependency:* You cannot have a frame problem without a model of change. This establishes the technical baseline for the ML students.
  2.  **The Necessity of Explicit Persistence (10–25 mins):** Ask the room what else must be true in State 2. Elicit that property lines, fire codes for *other* plots, and the Mayor's name must remain unchanged.
      *   *Dependency:* Once change is modeled, persistence must also be modeled, or the system assumes everything *might* have changed. This sets up the engineering burden.
  3.  **The Combinatorial Explosion (25–40 mins):** Challenge them to write the rules for what stays the same. When they suggest "everything else stays the same," point out that "everything else" is infinite (e.g., the number of grains of sand on a beach).
      *   *Dependency:* This demonstrates that the problem is not solving the change, but bounding the non-change. This is where the engineering wall hits.
  4.  **The Relevance Filter (40–55 mins):** Ask how *they* know the Mayor's name didn't change when Plot A was rezoned. They will answer "because it's irrelevant." Press them on where "irrelevance" is stored in the logic.
      *   *Dependency:* Since the list of non-changes is infinite (Step 3), there must be a filter. Since the filter isn't in the logic, it must be external knowledge. This forces the technical-to-epistemological move.
  5.  **The Failure of Formal Repairs (55–65 mins):** Explain that adding "frame axioms" (rules of persistence) fails because you need to know what's relevant to write the axioms, but you need the axioms to know what's relevant.
      *   *Dependency:* This satisfies your constraint to show the difficulty survives formal repairs without teaching the formalisms. It closes the trap.
  6.  **Synthesis and Final Question (65–75 mins):** Open the floor for the distinguishing question.

  ### Misconceptions and Interception Points
  You must anticipate these errors and head them off at the precise moment they become plausible.

  *   **The ML Misconception (Computational Cost):** They will argue at **Step 3** that this is just a search optimization problem solvable with heuristics or faster hardware.
      *   *Interception:* Do not argue about speed. Argue about *definition*. State clearly: "Heuristics prune a search space that is already defined. The frame problem is that the search space of non-changes is *undefined*. You cannot optimize a list that does not exist."
  *   **The Philosophy Misconception (Problem of Induction):** They will argue at **Step 5** that this is just Hume's problem: we assume the future resembles the past.
      *   *Interception:* Distinguish *prediction* from *description*. State clearly: "Induction worries about whether the sun will rise tomorrow. The frame problem worries about whether rezoning a plot changes the sun's status *today*. It is not about predicting change, but about justifying the assumption of stasis in a logical system."

  ### The Distinguishing Final Question
  At the 70-minute mark, put this exact question to the room:
  **"If I gave you a complete database of every true statement about the city today, could you logically derive which statements remain true tomorrow after you rezone one plot?"**

  *   **The Name-Dropper:** Will say "Yes, if the computer is fast enough," or "No, because of uncertainty."
  *   **The Grasper:** Will say "No, because truth does not imply persistence. Logic is monotonic (truths accumulate); action is non-monotonic (truths can vanish or persist). You need a rule for persistence that is not contained in the truths themselves."

  ### Explicitly Declined Topics
  At the 5-minute mark, state out loud that you are **declining** to cover the following, and write this list on the board to prevent derailment:
  1.  **Situation Calculus Syntax:** You will not teach fluents, situations, or result functions.
  2.  **Specific Formal Solutions:** You will not explain Circumscription, Default Logic, or STRIPS.
  3.  **Historiography:** You will not detail the 1969 McCarthy and Hayes paper beyond the concept itself.
  4.  **Problem Distinctions:** You will not separate the Frame Problem from the Qualification or Ramification problems; you will treat them as a single cluster of relevance.

  Say this explicitly: "We are declining these topics not because they are unimportant, but because mastering the vocabulary of the solution often allows students to bypass the horror of the problem. I want you to feel the problem before you learn to name the fixes."
