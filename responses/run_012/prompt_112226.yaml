  There is a way of speaking about cause and effect that sounds like a ledger. In this view, suffering pays for a past debt, and the person who hurts is the person who incurred the cost. But there is another way to hear these words. Think of heredity, or compound interest. Things happen because prior things happened, not because someone is keeping score. Consequences propagate through time without requiring that the one who suffers be the one who earned it. On this reading, the fact that he could not remember having done anything to warrant this illness is not a hole in the idea. It is a category mistake. The idea was never tracking memory, or individual desert, in the first place. It was tracking how actions move through the world, impersonally, like gravity.

  This distinction matters for how we mourn. In our family, it is customary to dedicate one's own good deeds to the dead. We light lamps; we give food; we offer help in his name. If karma were a strict ledger, nothing could be transferred. A debt is not discharged by someone else's payment. To try would be dishonest. Yet families do it, and it seems to do something. This practice suggests that the second reading is the one that holds. It suggests that goodness is not a currency stored in a single account, but a quality of the air we breathe. When we act well for him, we change the conditions around us. It does not fix the past. It alters the present. It acknowledges that we are connected not by judgment, but by flow.

  He worked at tables covered in spreadsheets, columns of figures predicting loss and survival. He loved the precision of it. He found comfort in the logic of risk, in the knowledge that if you measure carefully, you can prepare. But he also loved the noise of our mother's kitchen. He loved the smell of the mustard oil heating up for dinner, the sharp scent that filled the hallway, the sound of knives hitting the board, the chaos of us all talking at once. He was not a number in a column. He was the person sitting at the table. He was the laughter that interrupted the work. The ledger is closed now. The calculations are done. The oil is still heating. The chairs around the table are rearranged. We are still here, moving through the consequences of having known him, carrying the weight of his absence in the ordinary things we do. We do not need to know why the numbers fell this way to know that the sum of him was greater than the total. We just need to sit, and remember the smell of the oil, and the light on the tables, and the work that remains.
