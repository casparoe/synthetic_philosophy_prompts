      *   **Task:** Evaluate the accuracy of the friend's summary, identify misrepresentations, clarify Maimonides' actual views (especially regarding the Messianic era and the "embarrassment" charge), and provide evidence for pushback.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
