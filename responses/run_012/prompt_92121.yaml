answer: |-
  The phenomenon you have isolated is precise, pervasive, and intellectually corrosive. You are correct to reject "essentially contested concept" (which implies a shared core being debated) and "persuasive definition" (which implies conscious manipulation). You are also right to sense that "empty signifier" is structurally close but misses the normative weight—the term is not just void; it is *authoritative*.

  The established concept that best carves out the phenomenon you describe is the **Ideograph**.

  While the term has roots in rhetoric and political theory, its most rigorous formulation comes from the scholar Michael Calvin McGee, specifically in his essay *"The Ideograph: A Link Between Rhetoric and Ideology"* (1980). While "empty signifier" (Laclau/Mouffe) describes the structural capacity of a term to absorb meaning, **Ideograph** describes the *function* of that term in justifying power and behavior within a specific culture.

  Here is the carving you requested: what the ideograph is, how it differs from its neighbors, and how to distinguish its rhetorical use from a legitimate conceptual one.

  ### 1. The Concept: The Ideograph

  McGee defines an ideograph as an ordinary-language term found in political discourse that functions as a high-order abstraction representing collective commitment to a particular but **equivocal** normative goal.

  It fits your four criteria precisely:
  *   **(a) Purports to name a determinate class:** Ideographs function as axioms. They are treated as self-evident truths ("Western Values," "Freedom," "Security," "The People").
  *   **(b) Used by opposing parties to mean opposing things:** Because they are high-order abstractions, they are the site of political struggle. Both the libertarian and the socialist claim "Liberty"; both the traditionalist and the progressive claim "Western Values."
  *   **(c) Content filled only after the verdict:** This is the crucial mechanism. The ideograph does not generate the conclusion; it **warrants** it. The speaker decides the policy first, then selects the specific filling of the ideograph that legitimizes it.
  *   **(d) Treated as independent:** Users are not usually lying. They are inhabiting an ideology. To them, the connection between their preference and the "Value" is intuitive, not engineered. The ideograph operates at the level of cultural unconscious, making the contingent feel necessary.

  ### 2. Differentiation from Nearest Neighbours

  To pin down the edges, we must distinguish the ideograph from the concepts you already considered.

  **Vs. Essentially Contested Concepts (Gallie)**
  *   *The Neighbor:* Gallie argued that concepts like "Democracy" or "Art" have no single definition but share a common core that different parties interpret differently. The dispute is about the *best realization* of the shared ideal.
  *   *The Distinction:* In an essentially contested concept, the contest is the point; the ambiguity is acknowledged. In the **Ideograph**, the ambiguity is concealed. The speaker invokes "Western Values" to *end* the argument, not to continue it. The ideograph functions as a trump card, whereas the contested concept functions as a field of play. If the term shuts down inquiry rather than deepening it, it is functioning as an ideograph.

  **Vs. Persuasive Definition (Stevenson)**
  *   *The Neighbor:* Stevenson described redefining a term (e.g., "Culture") to alter emotional attitudes while keeping the descriptive meaning vague.
  *   *The Distinction:* Persuasive definition implies a speaker consciously engineering a definition to win an argument. Your observation is astute: the speakers you note seem sincere. The **Ideograph** accounts for this sincerity. The speaker is not manipulating the term; the term (as a unit of ideology) is structuring the speaker's reasoning. The causality is reversed: in persuasive definition, the speaker changes the word; in ideographic usage, the word channels the speaker.

  **Vs. Empty Signifier (Laclau)**
  *   *The Neighbor:* In populist theory, an empty signifier is a symbol (like "Change") that has no fixed content and unifies a group by representing what they lack.
  *   *The Distinction:* "Empty Signifier" is a structuralist category; it explains *how* political identities form. **Ideograph** is a rhetorical category; it explains *how* justification occurs. Your interest is in the argumentative move ("This policy is wrong because X"), which is the domain of the ideograph. Furthermore, as you noted, the term feels "full" to the user. McGee's framework acknowledges that the ideograph is "full" of cultural resonance, even if it is "empty" of specific operational definition.

  **Vs. God Terms (Weaver)**
  *   *The Neighbor:* Richard Weaver described "God Terms" as words that confer authority simply by being invoked (e.g., "Progress," "Science").
  *   *The Distinction:* This is the closest rival. However, "God Term" describes the *status* of the word, while **Ideograph** describes the *mechanism of its deployment*. A God Term is a static hierarchy; an Ideograph is a dynamic tool used to link specific actions to abstract values. "Western Values" is a God Term, but the *move* of filling it post-hoc to justify a verdict is ideographic work.

  ### 3. Can It Name Something Real? (The Test)

  You ask if a term of this kind is always a mere instrument of rhetoric, or if it can name something real while being used this way. This is the critical edge.

  A term like "Western Values" *can* refer to a genuine historical and philosophical tradition. However, it shifts from a **Concept** to an **Ideograph** based on its operational behavior in discourse. You can distinguish the two cases using three tests:

  **1. The Test of Operationalization (Falsifiability)**
  *   *Concept:* If challenged ("Which Western value?"), the user can cash out the abstraction into specific, falsifiable claims without circularity. (e.g., "I mean the tradition of habeas corpus derived from English Common Law.")
  *   *Ideograph:* If challenged, the user shifts the definition to another value within the same cluster to protect the verdict. (e.g., "Well, if not law, then certainly the Christian heritage." If challenged on that: "Then the commitment to free inquiry.")
  *   *The Edge:* If the definition moves to protect the conclusion, it is an ideograph.

  **2. The Test of Consistency (Cross-Contextual Stability)**
  *   *Concept:* The definition remains stable across different scenarios. If "Western Values" means "Free Speech" in Case A, it must weigh heavily in Case B.
  *   *Ideograph:* The content is ad hoc. In Case A, "Western Values" means Free Speech to defend a speaker. In Case B, "Western Values" means Social Harmony to exclude a speaker.
  *   *The Edge:* If the content is determined by the desired outcome rather than a prior principle, it is an ideograph.

  **3. The Test of Revision (Openness to Disconfirmation)**
  *   *Concept:* The user admits the possibility that a policy might be good but *not* consistent with the value, or consistent with the value but *bad*.
  *   *Ideograph:* The value and the verdict are fused. To question the verdict is to betray the value.
  *   *The Edge:* If the term is used to immunize a position from criticism rather than to explain it, it is an ideograph.

  ### 4. Summary of the Phenomenon

  The phenomenon you have cataloged is the **Ideographic Function**.

  It is not necessarily a lie. It is a mode of reasoning where a high-order abstraction is used to bridge the gap between a personal preference and a public justification, without subjecting that preference to the constraint of a fixed definition.

  It differs from an **Essentially Contested Concept** because it conceals its contestability.
  It differs from a **Persuasive Definition** because it operates through sincere cultural inhabitation rather than conscious redefinition.
  It differs from an **Empty Signifier** because its primary function is normative justification, not just political unification.

  **Is it always rhetorical?**
  No. A term *can* be an ideograph in one context and a concept in another. "Justice" is often an ideograph ("This is unjust!"), but in a legal courtroom, it is forced to become a concept (statutes, precedents).
  The danger arises when a term that *requires* conceptual precision (like "Values" in policy making) is allowed to function as an ideograph.

  **Where it stops:**
  It stops where the speaker is forced to specify the content *before* reaching the verdict. If the speaker must say, "By Western Values I specifically mean X, and if this policy violates X, I must oppose it even if I like the policy," the ideographic function has been broken, and the term has become a concept again.

  Your notebook captures the breakdown of public reasoning. The term "Ideograph" gives you the handle to describe not just that the meaning is shifting, but *why* it is shifting: to preserve the authority of the verdict while avoiding the vulnerability of a definition.
