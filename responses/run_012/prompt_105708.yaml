answer: |-
  ### Brainstorming Settings

  1.  **Parish Poor Relief (1790s England):** *Claim:* "No relief paid to able-bodied men." *Records:* Overseers' Account Books. *Divergence:* Model A says vouchers for men rotted (loose paper); Model B says payments required audit entries, so no entry means no payment. *Weakness:* High risk of off-book corruption undermines Model B's "institutional necessity."
  2.  **Court Sentencing Registers (18th C. Colony):** *Claim:* "No executions carried out for Crime X." *Records:* Bound sentencing logs. *Divergence:* Model A says execution warrants were lost; Model B says executions required resource allocation (hangman, coffin) logged for reimbursement. *Weakness:* Emergency martial law could bypass logging.
  3.  **Port Authority Weighmaster Logs (1780s Merchant Port):** *Claim:* "No private cargo loaded on Company ships." *Records:* Original bound Weighmaster's Manifests. *Divergence:* Model A says private lists were lost; Model B says physical access to the hold was gated by the Weighmaster's entry—no entry, no load. *Strength:* Physical constraint (space/weight) is harder to bypass than bureaucratic discretion.

  **Selection:** Setting 3 (Port Authority). The physical constraint of shipping capacity creates a tighter link between the event (loading) and the record (manifest), maximizing the divergence between "random loss" and "institutional necessity."

  ***

  ### The Scenario

  In 1784, the Port Authority of Bristol maintained a bound Weighmaster's Log for all outbound Company vessels, recording every crate's weight, content, and consignor to calculate harbor dues and ensure ballast stability; the Log for the *HMS Mercator* survives intact, listing only Company-owned goods, with a total weight matching the ship's known capacity. Historians seek to verify the claim: "No private cargo was loaded onto the *Mercator*." The silence is absolute: there are zero entries for private consignors. The physical constraints of the dock required all goods to pass the Weighmaster's scale before hoisting, and the Log was the sole key authorizing the crane operators to lift cargo into the hold.

  ***

  ### The Walkthrough

  **The Claim:** "No private cargo was loaded onto the *Mercator*."

  **Model A (The Trusting/Random Model):** Documents survive roughly by chance; time is a sieve. The Weighmaster's Log is merely a durable sample (bound book) of a larger ecosystem of paperwork (loose waybills, private receipts, captain's journals) that once existed. The silence regarding private cargo is a product of differential decay: private records were on loose paper and rotted, while the Company Log survived.
  *   **Verdict on Silence:** Agnostic. The silence proves nothing about the cargo, only about the durability of the paper. We cannot know if private cargo existed.

  **Model B (The Cynical/Institutional Model):** Documents survive because an institution had an ongoing reason to keep them; preservation tracks power and utility. The Log was not just a record; it was an *operational constraint*. The crane operators were instructed to lift only what was logged to prevent theft and maintain stability. The Log survives because it was the active tool of control.
  *   **Verdict on Silence:** Conclusive. Because the record was a prerequisite for the physical action (loading), the absence of the record implies the absence of the action. The silence confirms the claim: no private cargo was loaded.

  **The Peeling Feature:** The **constitutive nature of the record**. In Model B, the record is part of the causal chain of the event (No Entry → No Lift → No Cargo). In Model A, the record is descriptive (Cargo → Entry → Decay). The verdicts peel apart because Model B treats the archive as a *gatekeeper*, while Model A treats it as a *mirror*.

  **If Removed:** If you remove the operational constraint (e.g., if crane operators could lift goods based on verbal orders, with logging done later), Model B collapses. The record becomes descriptive again, and the silence reverts to inconclusive (Model A).

  ***

  ### The Honest Note

  Is this a real asymmetry in how evidence works, or have I smuggled the conclusion into one of the models?

  It is a real asymmetry, but it relies on a specific ontological status of the document. Model B works only if the document is **constitutive** (it makes the event happen) rather than **reflective** (it records the event after the fact). I have not smuggled the conclusion, but I have heavily loaded the scenario to ensure the document is constitutive. The asymmetry exists because "institutional utility" (Model B) can imply a *systemic constraint* that "random survival" (Model A) cannot. Model A assumes the archive is a graveyard; Model B assumes it is a machine.

  **How a Defender of Model A Attacks:**
  The Model A defender attacks the **integrity of the constraint**, not the survival rate. They argue: "The Weighmaster could be bribed to list private cargo as Company cargo." This concedes that the record is constitutive but argues the *data* within it is corrupted. To defeat Model B entirely, the Model A defender must argue that parallel, off-book systems existed (e.g., "Night loading"), rendering the Log incomplete not by decay, but by design. If they prove off-book loading was possible, Model B's "strong claim" collapses into Model A's agnosticism.
