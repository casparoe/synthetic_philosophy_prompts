      *   The debate conflates *Epistemic Probability* (what we should believe) with *Ontic Chance* (propensity/frequency).
      *   Lewis's "Humean Supervenience" is lurking here. If the best system says 0.5, but a predictor says 0.9, the Best System might need updating.
