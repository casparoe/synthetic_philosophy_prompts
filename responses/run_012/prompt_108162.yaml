  # Activity: The Compounding Coin
  **Target:** Graduate Seminar in Decision Theory / Formal Epistemology
  **Time:** 90 Minutes
  **Students:** 16
  **Materials:** Projector (with spreadsheet), Whiteboard, Printed "Bankroll Trackers" (one per student), Slips of paper for betting.

  ## 1. The Setup (0–10 Minutes)
  **The Narrative:**
  Tell the students they are fund managers. Their goal is not to win a prize, but to manage a resource over time in an uncertain environment. Their performance will be evaluated on their **final bankroll**, but the lesson lies in the *path* they took to get there.

  **The Rules:**
  1.  **Starting Bankroll:** 100 Units (chips/tally).
  2.  **The Asset:** A coin will be flipped each round.
  3.  **The Bet:** Before each flip, you must choose a fraction $f$ of your *current* bankroll to stake ($0 \le f \le 1$). Write this fraction on a slip of paper and keep it private.
  4.  **The Payoff:**
      *   **Heads:** You win even money. Bankroll becomes $W \times (1 + f)$.
      *   **Tails:** You lose the stake. Bankroll becomes $W \times (1 - f)$.
  5.  **Tracking:** Students calculate their own wealth on the provided tracker sheet. The projector displays the coin sequence and aggregate class statistics (which you update).
  6.  **The Coin:** It is biased. You do not know the bias. (In reality, $P(\text{Heads}) = 0.6$).

  **The Spreadsheet (Projector):**
  Create a simple sheet with columns: *Round, Outcome (H/T), Class Avg Wealth, Class Median Wealth, Bankruptcies*.
  *   *Note:* You will ask students to shout out their final wealth only at the very end to save time, but you can ask for a show of hands on "Who is below 100?" during the game to build tension.

  ## 2. The Game Protocol (10–50 Minutes)
  **Rounds 1–10 (The Discovery Phase):**
  *   Run 10 rounds at a brisk pace (2 minutes per round).
  *   **Pace:** Students write bet $\rightarrow$ You flip (or reveal pre-generated outcome) $\rightarrow$ Students calculate $\rightarrow$ You update projector.
  *   **Pre-generated Sequence:** Do not rely on live randomness. Use a fixed sequence of 20 coins with exactly 12 Heads and 8 Tails, shuffled to look random (e.g., H H T H T T H H T H T H H T T H T H T H). This ensures the "Time Average" converges to the expected geometric mean.
  *   **Observation:** Watch for students betting $f=1$ (All-In) and $f=0$ (Cash).

  **Round 11 (The Trap):**
  Pause the standard game. Announce a **Special Investment Opportunity** available for this round only.
  *   **The Offer:** "You may allocate a fraction $k$ of your bankroll to a 'High-Yield Note'. The remainder $(1-k)$ sits safe in cash (no standard bet this round)."
  *   **Payoff:**
      *   **Heads:** The Note pays 3:1 (You get $3k$ back). Total Wealth Multiplier: $(1-k) + 3k = 1 + 2k$.
      *   **Tails:** The Note defaults (You get $0$). Total Wealth Multiplier: $(1-k)$.
  *   **Instruction:** "Choose $k$ privately. This is a one-off decision."
  *   **The Math (For You):**
      *   If a student chooses $k=0.8$ (80% stake):
      *   **Arithmetic EV:** $0.6(1 + 1.6) + 0.4(1 - 0.8) = 0.6(2.6) + 0.4(0.2) = 1.56 + 0.08 = 1.64$. (Expected return +64%).
      *   **Geometric Growth:** $0.6 \ln(2.6) + 0.4 \ln(0.2) \approx 0.6(0.955) + 0.4(-1.609) = 0.573 - 0.644 = -0.071$. (Negative growth).
      *   **Verdict:** This bet is **Arithmetic-Favorable** but **Geometric-Suicidal**. A student maximizing EV will bet $k=1$. A student maximizing growth will bet $k=0$.

  **Rounds 12–20 (The Consequence Phase):**
  *   Resume standard betting (Heads: $1+f$, Tails: $1-f$).
  *   Run the remaining 9 rounds.
  *   By Round 20, the divergence will be stark. The "All-In" students from Round 1 will likely be bankrupt (8 Tails in 20 rounds is guaranteed in your sequence; 5 consecutive Tails wipes out $f=1$). The "EV Maximizer" from Round 11 will have suffered a massive drawdown.

  ## 3. Data Collection & Display (50–55 Minutes)
  Ask students to report their **Final Bankroll**.
  Input these 16 numbers into your spreadsheet live.
  Calculate and display:
  1.  **Arithmetic Mean** of final wealths.
  2.  **Geometric Mean** of final wealths.
  3.  **Median** final wealth.
  4.  **Max** and **Min**.

  *Expected Result:* The Arithmetic Mean will be surprisingly high (dragged up by the few lucky over-bettors who hit the Heads streak). The Median and Geometric Mean will be much lower, likely below the starting 100 for many.

  ## 4. The Debrief (55–90 Minutes)
  Do not lecture immediately. Ask questions to draw the principles out of their experience.

  **Point 1: Positive EV $\neq$ Good Repeated Bet**
  *   *Ask:* "Who bet 100% of their bankroll in the early rounds? Where are you now?" (Likely bankrupt).
  *   *Ask:* "The coin was favorable (60%). Why did betting your edge wipe you out?"
  *   *Concept:* **Volatility Drag.** In multiplicative processes, losses hurt more than gains help. A 50% loss requires a 100% gain to recover. The arithmetic mean ignores the path dependency of ruin.

  **Point 2: The Asymmetry of Over-betting**
  *   *Ask:* "Who bet very conservatively (e.g., 5%)? How did you do compared to those who bet 25%?"
  *   *Observation:* The 5% bettors survived but grew slowly. The 100% bettors died. The 20% bettors (Kelly) likely dominated.
  *   *Concept:* The penalty for over-betting ($f > f^*$) is ruin. The penalty for under-betting ($f < f^*$) is only opportunity cost. The growth function is asymmetric around the optimum.

  **Point 3: Ensemble vs. Time Average (Non-Ergodicity)**
  *   *Point to the Spreadsheet:* "Look at the Class Average (Arithmetic) vs. the Class Median (Typical)."
  *   *Concept:* The "Average Player" (Ensemble) did well because one or two students got lucky streaks and skewed the mean. The "Typical Player" (Time Average) did poorly if they over-bet.
  *   *Key Phrase:* "The system is non-ergodic. The average outcome across parallel universes is not the outcome you experience in this single timeline."

  **Point 4: The Trap (Arithmetic vs. Geometric)**
  *   *Reveal the Round 11 Math:* Show the EV (+64%) vs. Log Growth (-7%) calculation on the whiteboard.
  *   *Ask:* "Who took the Note? Why?"
  *   *Concept:* Rationality in multiplicative environments requires maximizing the expected *logarithm* of wealth, not expected wealth. This is not risk aversion; it is consistency with the dynamics of compounding.

  **Handling Estimation Uncertainty:**
  *   *Student Question:* "But we didn't know $p=0.6$. If I thought $p=0.55$, my Kelly stake is lower. If I thought $p=0.7$, it's higher. Doesn't this just mean we need better estimates?"
  *   *Your Response:* "Exactly. The Kelly criterion assumes you know the edge. In reality, you don't. If you overestimate your edge, you inadvertently over-bet, moving into the 'suicide zone' on the right side of the curve. This is why rational agents use **Fractional Kelly** (e.g., half-Kelly). It sacrifices some growth to gain robustness against estimation error. It is an epistemic hedge."

  ## 5. Predictable Failure Modes & Fixes

  **1. The "Lucky Devil" Problem**
  *   *Risk:* In a short game (20 rounds), randomness might favor an All-In player. If one student bets 100% and gets 15 Heads, they win everything, validating the wrong strategy.
  *   *Fix:* **Use the Pre-generated Sequence.** Do not flip a live coin. Use the 12H/8T sequence provided in the setup. This guarantees the "Time Average" converges to the theoretical expectation within the class period.

  **2. Convergence (Herd Behavior)**
  *   *Risk:* Students look at neighbors and copy bets. If everyone bets 20%, you lose the divergence needed to show the asymmetry.
  *   *Fix:* **Private Slips.** Collect the bet slips in a box before revealing the coin outcome. Emphasize in the intro: "Divergence is data. If you all do the same thing, we learn nothing."

  **3. The "Gambling" Mindset**
  *   *Risk:* Students treat it as a game of chance rather than a decision problem. They might bet 100% for fun.
  *   *Fix:* **Framing.** "You are not gambling chips; you are simulating a research grant or an endowment. Ruin means you are out of the program." If someone goes bust early, let them sit out or give them a "bailout" of 10 units to continue tracking, but mark them as "Ruin Event" in the data.

  **4. Calculation Errors**
  *   *Risk:* Students mess up the compounding math ($100 \times 1.2 \times 0.8 \neq 100$).
  *   *Fix:* **Provide a Calculator Sheet.** The handout should have columns for *Start Wealth, Bet Fraction, Outcome, End Wealth*. Encourage use of phones for calculation if needed, but warn against rounding errors.

  ## 6. Limitations (What You Must Supply)
  This activity cannot reproduce the **infinite horizon**.
  *   *The Gap:* In 20 rounds, an over-bettor *might* survive. The Kelly argument is asymptotic (as $n \to \infty$, Kelly dominates almost surely).
  *   *Your Job:* You must explicitly state: "In 20 rounds, luck plays a role. In 20,000 rounds, the over-bettor is mathematically guaranteed to approach zero. We are seeing a preview of that inevitability."
  *   *The Normative Leap:* The game shows *what happens*. You must argue *why it matters*. Connect it to their work: "When you model belief updating or scientific resource allocation, are you assuming additive errors or multiplicative consequences? If the latter, expected utility theory with linear wealth is formally incorrect."

  ## Instructor's Cheat Sheet (The Math)
  *   **Base Game:** $p=0.6$, $b=1$. Kelly $f^* = 0.2$.
  *   **Trap (Round 11):** Cost $k$, Pay $3k$ on H.
      *   EV Maximizer chooses $k=1$.
      *   Growth Maximizer chooses $k=0$ (because $0.6 \ln(3) + 0.4 \ln(0) \to -\infty$).
      *   *Correction for Game:* To avoid $\ln(0)$, use the "Safe Cash" remainder $(1-k)$.
      *   Growth Maximizer solves: $\max_k 0.6 \ln(1+2k) + 0.4 \ln(1-k)$.
      *   Derivative: $\frac{1.2}{1+2k} - \frac{0.4}{1-k} = 0 \Rightarrow 1.2(1-k) = 0.4(1+2k) \Rightarrow 1.2 - 1.2k = 0.4 + 0.8k \Rightarrow 0.8 = 2k \Rightarrow k = 0.4$.
      *   *Wait:* If the optimal $k$ for the Trap is 0.4, then betting 0.8 is over-betting, but betting 1.0 is ruin.
      *   *Revised Trap Instruction:* "You may allocate up to 100%."
      *   *Teaching Point:* Students who bet $k=1.0$ (All-In on the Note) face ruin on Tails. Students who bet $k=0.8$ face negative growth. Students who bet $k=0.4$ are optimal.
      *   *Simpler Trap:* Just offer the "Suicide Bond" as a binary choice? No, continuous is better.
      *   *Stick to the prompt:* "Favourable on arithmetic, unfavourable on geometric."
      *   If I set the Trap Payoff to 2:1 (Net +2k on H, -k on T).
      *   EV: $0.6(2k) - 0.4(k) = 0.8k$. (Always positive).
      *   Growth: $0.6 \ln(1+2k) + 0.4 \ln(1-k)$.
      *   If $k=1$: $0.6 \ln(3) + 0.4 \ln(0) \to -\infty$.
      *   If $k=0.8$: $0.6 \ln(2.6) + 0.4 \ln(0.2) \approx -0.07$ (Negative).
      *   So, any student betting $>50\%$ on the Trap is in the negative growth zone, despite positive EV. This is the sweet spot.

  **Final Tip:** When debriefing, write "Rationality = ?" on the board. Erase "Maximize Expected Wealth" and write "Maximize Expected Log Wealth" only after they have admitted that the former led to ruin. Make them feel the change in definition.
