  # PROCEDURE: STRUCTURAL-DEMOGRAPHIC INSTABILITY INDEX (SDII)
  **Version:** 1.0 | **Owner:** Long-Horizon Country Risk Desk | **Horizon:** 24-60 Months

  ## 1. INPUTS AND DATA PROTOCOLS

  The SDII measures structural pressure, not event risk. It requires three pillars. Each pillar contributes 33.3 points to the total 100-point instability score.

  **Pillar A: Popular Wellbeing (Immiseration Pressure)**
  *   **Ideal:** Real median wage growth (5yr avg), Cost of basic basket vs. income.
  *   **Accepted Proxies:** GDP per capita vs. Real Wage divergence; Housing Price-to-Income ratio; Gini coefficient.
  *   **Discount Rule:** If using GDP/Wage divergence, discount contribution by 20%. If using Gini alone, discount by 50%.
  *   **Threshold:** Real wages flat/negative while GDP rises = +15 points. Housing >8x income = +10 points.

  **Pillar B: Elite Overproduction (Factional Pressure)**
  *   **Ideal:** Number of elite aspirants (law/politics grads) vs. available elite positions (C-suite, Parliament, Senior Bureaucracy).
  *   **Accepted Proxies:** Tertiary education expansion rate vs. High-skill employment growth; Political fragmentation (effective number of parties in legislature); Youth unemployment rate (as proxy for frustrated aspirants).
  *   **Discount Rule:** If using Tertiary/Youth Unemp only, discount contribution by 30%. Political fragmentation counts at full value.
  *   **Threshold:** Tertiary attainment +20% in one generation without job growth = +15 points. Legislature parties >5 = +10 points. Youth Unemp >20% = +8 points.

  **Pillar C: State Capacity (Fiscal & Legitimacy)**
  *   **Ideal:** Tax-to-GDP, Debt Service-to-Revenue, Surveyed Trust in Institutions.
  *   **Accepted Proxies:** Sovereign CDS spreads, Reserve cover (months of import), Fiscal balance.
  *   **Discount Rule:** Market proxies (CDS) discounted by 40% (they price default, not instability). Survey trust counts at full value.
  *   **Threshold:** Debt Service >8% of Revenue = +10 points. Trust in Parliament <25% = +15 points. Reserves <4 months = +8 points.

  **Missing Data & Refusal Rule**
  *   **Single Pillar Missing:** Assign the maximum risk score for that pillar (33.3) but flag as "Data Opacity Risk."
  *   **Two or More Pillars Missing:** **REFUSAL TO SCORE.** Output is "ND" (No Data). Do not impute. Do not guess.
  *   **Rationale:** SDT requires interaction between masses, elites, and state. If two are invisible, the mechanism cannot be modeled.

  ## 2. PROCESS STEPS

  1.  **Data Integrity Check:** Verify source dates. Any data >24 months old is rejected. If >3 core indicators rejected, halt and mark "Data Stale."
  2.  **Pillar Calculation:** Compute raw score (0-33.3) for each pillar based on thresholds above. Apply proxy discounts.
  3.  **Interaction Multiplier:** If Pillar A > 20 AND Pillar B > 20, apply 1.2x multiplier to the *total* score. (SDT posits that immiseration + elite fragmentation is non-linear). Cap at 100.
  4.  **Cycle Diagnosis:** Classify position:
      *   *Integrative:* Score < 30.
      *   *Stagflation:* Score 30-60.
      *   *Disintegrative:* Score > 60.
  5.  **Head of Risk Sign-off Pack:** Submit Pillar scores, Multiplier application, and Diagnosis. Do not submit only the final number.

  ## 3. DIAGNOSIS VS. FORECAST

  *   **Diagnosis (Required):** The structural position (Integrative/Stagflation/Disintegrative). This is derived mechanically from the score.
  *   **Forecast (Restricted):** The timing of the break (e.g., "Crisis within 12 months").
  *   **Rule:** An analyst may **not** output a Forecast unless a specific trigger event is identified (e.g., "Election scheduled in Q3," "Debt maturity wall in Q4").
  *   **Conflict Protocol:** If Diagnosis is *Disintegrative* (>60) but no Trigger is visible, output: **"High Structural Pressure / Timing Indeterminate."** Do not lower the score to match the lack of a trigger. High pressure without a trigger is a latent risk, not a low risk.

  ## 4. FALSIFICATION FIELD

  **To Invalidate This Specific Reading (24 Months):**
  *   **Ambria-type:** Real median wages grow >2% annually for 2 years consecutively OR Elite fragmentation reduces (parties consolidate <5) OR Trust in Parliament rises >10 points.
  *   **Reznia-type:** (If scored) Fiscal reserves increase >6 months OR Non-oil GDP grows >3%.

  **To Invalidate The Framework (5+ Years):**
  *   A country scores >75 (Disintegrative) and remains politically stable with no significant policy shifts or repression for 60 months. (SDT claims pressure *must* release; if it doesn't, the theory is wrong for this context).

  ## 5. JUDGMENT VS. AUTOMATION

  **Points of Analyst Judgment (Document these in the sign-off memo):**
  1.  **Proxy Validity:** Deciding if "Youth Unemployment" truly reflects "Elite Aspirants" in this specific culture (e.g., is university status symbolic or economic?).
  2.  **Interaction Multiplier:** Deciding if the 1.2x multiplier applies. (Strict rule: Both A & B > 20, but analyst must confirm the elites are actually competing *against* the state, not just each other).
  3.  **Data Opacity:** Deciding if missing data is "temporary gap" or "structural secrecy" (latter triggers Refusal).

  **Points Where Procedure Stops (Hand to Human):**
  1.  **Refusal to Score:** The model cannot output a number. The Desk Head must decide whether to hold, exit, or demand intelligence purchase.
  2.  **Score > 85:** At this level, the model implies systemic collapse. The Desk Head must override position limits manually; the model does not set limits here, it recommends liquidation.
  3.  **Divergence > 40 points:** If SDII score differs from Market Implied Risk (CDS) by >40 points, manual review required before trading.

  ## 6. LIMITATIONS STATEMENT

  **This procedure does not predict coups, assassinations, or specific policy changes.** It measures the dry tinder, not the spark.
  **Contestation Disclosure:** Structural-Demographic Theory is disputed by historians who argue human agency overrides demographic cycles. This uncertainty is embedded in the score as a **±15 point uncertainty band**.
  *   *Example:* A score of 65 is reported as **65 [50-80]**.
  *   If the uncertainty band crosses the "Action Threshold" (e.g., 50), the output is "Unactionable."

  ***

  # CASE APPLICATION

  ## CASE 1: AMBRIA

  **1. Data Integrity Check:** Pass. All data <24 months.
  **2. Pillar Calculation:**
  *   **Pillar A (Wellbeing):** Real wages flat (12yr) vs GDP +20%. Housing 9.5x income.
      *   *Score:* 15 (Wage/GDP decoupling) + 10 (Housing) = 25.
      *   *Discount:* None (Direct measures).
      *   *Subtotal:* **25.0 / 33.3**
  *   **Pillar B (Elite Overproduction):** Tertiary 18%→41%. Youth Unemp 27%. Parties 3→9.
      *   *Score:* 15 (Edu/Jobs mismatch) + 8 (Youth Unemp) + 10 (Fragmentation) = 33.
      *   *Cap:* 33.3.
      *   *Subtotal:* **33.3 / 33.3**
  *   **Pillar C (State Capacity):** Debt Service 9% Revenue. Trust 19%.
      *   *Score:* 10 (Debt Service) + 15 (Trust) = 25.
      *   *Subtotal:* **25.0 / 33.3**
  *   **Raw Total:** 83.3
  **3. Interaction Multiplier:** Pillar A (25) > 20 AND Pillar B (33.3) > 20.
      *   *Apply 1.2x:* 83.3 * 1.2 = 99.96.
      *   *Cap:* **100**.
  **4. Diagnosis:** Disintegrative.
  **5. Forecast:** No specific trigger identified (election dates not provided). Output: **High Structural Pressure / Timing Indeterminate.**
  **6. Uncertainty Band:** 100 [85-100].

  **FINAL SDII SCORE: 100 [85-100]**
  **PREVIOUS SCORE: 18**
  **DECISION:** **REFUSE ANCHOR STATUS.** The model identifies Ambria as structurally primed for significant instability. The divergence between GDP and wages, combined with massive elite overproduction (educated youth with no jobs) and fragmented legislature, fits the Disintegrative profile exactly. The current house view (18) is dangerously wrong.

  ***

  ## CASE 2: REZNIA

  **1. Data Integrity Check:** **FAIL.**
  *   **Pillar A (Wellbeing):** No wage data. No employment data. Non-oil GDP down is a proxy, but insufficient for "Popular Wellbeing."
  *   **Pillar B (Elite Overproduction):** No data on education, elite networks, or succession mechanisms.
  *   **Pillar C (State Capacity):** Fiscal revenue concentration (71% oil) known. Reserves (3 months) known.
  **2. Missing Data Rule:** Two Pillars (A & B) lack core indicators.
  **3. Procedure Halt:** **REFUSAL TO SCORE.**
  **4. Output:** **ND (No Data).**
  **5. Rationale:** SDT cannot model the interaction of masses and elites if both are invisible. A petro-state can buy off immiseration (subsidies) or repress elites (patronage) without macro data showing it. Scoring this based on oil price volatility is not SDT; it is commodity trading.
  **6. Uncertainty:** Infinite.

  **FINAL SDII SCORE: ND**
  **PREVIOUS SCORE: 72**
  **DECISION:** **POSITION LIMIT CANNOT BE SET BY MODEL.** The house view (72) implies we know *why* it is risky. We do not. It may be stable due to high repression/subsidies, or it may be on the verge of collapse. The model refuses to validate the 72. To hold a position, the Desk Head must authorize a "Blind Risk" exception, acknowledging we are gambling, not investing.

  ***

  # SUMMARY OF DEVIATION FROM HOUSE VIEW

  | Country | House View | SDII Procedure | Implication |
  | :--- | :--- | :--- | :--- |
  | **Ambria** | 18 (Safe Anchor) | **100 (Critical Risk)** | **Immediate Review.** The "Safe Anchor" is in a late-stage secular cycle. Position limits based on score 18 are excessive. |
  | **Reznia** | 72 (Trouble Spot) | **ND (Refusal)** | **Unknown Risk.** We are pricing risk we cannot measure. Either buy intelligence (elite/wage data) or exit. |

  **Desk Head Note:** The procedure has inverted your risk book. Ambria is the immediate threat; Reznia is an unknown. If you override Ambria to 18, you are explicitly rejecting the Structural-Demographic framework. If you override Reznia to 72, you are guessing.
