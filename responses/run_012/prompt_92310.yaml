      *   **Point 2: The Demand for Justification.** The user assumes every rule needs a justification. This leads to the regress. The alternative isn't "faith," it's that some things are *constitutive*. To reason *is* to use MP. You can't justify reasoning without reasoning. This isn't circularity in a vicious sense; it's transcendental.
      *   **Point 3: Rule-Following and Compulsion.** The user suggests we "decide" to follow rules. Wittgenstein (and Kripke's reading) is relevant here. We don't decide; we are trained into a practice. The "compulsion" of logic isn't psychological; it's normative. If you reject MP, you aren't playing a different game; you aren't playing the game of *inference* at all.
      *   **Point 4: Mathematics.** If proof is just will, math collapses. But math works. Why? Because the rules are fixed by the practice, not individual whim.
      *   **Conclusion:** Direct answer to "which commitment has to go." It's the commitment to *external justification* and the commitment to *voluntarism about rules*.

