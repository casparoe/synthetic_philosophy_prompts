          3.  Hypothetical: If the hoax worked, is there a principled line between subliminal influence and ordinary emotional advertising? If no, does "manipulation" function as an accusation rather than a descriptive category?
      *   **Constraints:** Be disciplined about mapping accounts. Acknowledge where accounts go quiet. Max 800 words.

