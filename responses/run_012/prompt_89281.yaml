answer: |-
  This is a classic problem of reconstructing the "methodological decision" hidden within historical narrative. To answer this properly, we need to move past the textbook caricature of Lakatos (where "predicting new things" is a magic bullet) and look at the specific architecture of the Methodology of Scientific Research Programmes (MSRP), particularly the distinctions between *theoretical progress*, *empirical progress*, and the three senses of *ad hocness*.

  Your friend is acting as a judge of research shifts. To determine her verdict on the new case, we must first reverse-engineer the rule she is applying to her past four verdicts.

  ### 1. Reconstructing the Friend's Rule from Past Verdicts

  Let's map her four historical cases onto Lakatosian categories:

  1.  **Newton + Neptune:**
      *   **Shift:** Perturbation calculation (auxiliary hypothesis).
      *   **Content:** Excess empirical content (predicted position of unseen planet).
      *   **Status:** Corroborated ("turned up right where the theory said").
      *   **Verdict:** **Progressive.**
  2.  **Ether + Lorentz-Fitzgerald:**
      *   **Shift:** Contraction hypothesis (auxiliary).
      *   **Content:** In her telling, "nothing new falling out of it." (Lakatosians might argue time dilation was excess content, but historically it was viewed as saving the null result).
      *   **Status:** Not corroborated as a distinct physical mechanism (until Einstein reinterpreted it).
      *   **Verdict:** **Degenerating.**
  3.  **Ptolemy + Epicycles:**
      *   **Shift:** Adding circles (auxiliary).
      *   **Content:** No excess content (merely fitted existing retrograde motion).
      *   **Status:** N/A (No novel predictions).
      *   **Verdict:** **Degenerating.**
  4.  **Bohr Atom:**
      *   **Shift:** Quantized orbits (radical auxiliary/hard core tweak).
      *   **Content:** Excess empirical content (Pickering-Fowler lines).
      *   **Status:** Corroborated ("then showed up").
      *   **Verdict:** **Progressive.**

  **The Pattern:**
  In every case she labels **Progressive**, there is **Excess Empirical Content + Corroboration**.
  In every case she labels **Degenerating**, there is **No Excess Content** (or at least, none recognized as such) **and/or No Corroboration**.

  Crucially, she has **no cases** in her track record where a theory predicted a novel fact that was *not yet verified*. Her methodology is underdetermined regarding the "grace period" Lakatos allows for theoretical progress before empirical corroboration.

  ### 2. Candidate Rules Compatible with Her History

  Here are three distinct rules consistent with her past four verdicts. They diverge on the new case.

  **Rule A: The Empirical Corroboration Rule (Verificationist Leanings)**
  *   **Definition:** A shift is progressive *only if* it entails novel facts **AND** those facts are subsequently observed. Theoretical progress without empirical progress is insufficient for the "progressive" label in a historical assessment.
  *   **Lakatosian Nuance:** This conflates Lakatos's *theoretical progress* (predicting novelty) with *empirical progress* (corroborating it). It treats $\text{Ad hoc}_2$ (unverified novelty) as effectively degenerating.
  *   **Motivation:** Historians work retrospectively. They know the outcome.

  **Rule B: The Excess Content Rule (Theoretical Progress)**
  *   **Definition:** A shift is progressive if it entails *any* novel testable consequences, regardless of whether they are confirmed yet. The *potential* for falsification/growth is what matters.
  *   **Lakatosian Nuance:** This adheres strictly to the definition of a *theoretically progressive* shift. It allows a grace period.
  *   **Motivation:** This is the "in the weeds" Lakatosian view that protects nascent theories from immediate falsification.

  **Rule C: The Positive Heuristic Rule (Structural Integrity)**
  *   **Definition:** A shift is progressive only if the new hypothesis flows from the program's *positive heuristic* (the long-term plan for developing the belt), not merely to save a phenomenon.
  *   **Lakatosian Nuance:** This targets $\text{Ad hoc}_3$. Even if a prediction is verified, if it was a "monster-barring" patch unrelated to the core strategy, it is degenerating.
  *   **Motivation:** This values the coherence of the research programme over lucky hits.

  ### 3. Predictions for the New Case

  **The Case:** A model fits data; an anomaly (bump) appears; a new particle is added *only* to soak up the bump; this addition entails a distinctive signal elsewhere; nothing is confirmed yet.

  *   **Rule A (Corroboration) predicts:** **Degenerating.**
      *   *Reason:* The distinctive signal has not been observed ("Nothing's confirmed"). Without the "then showed up" clause, it cannot be progressive. It looks like the Ether case (saving the phenomenon without verified novelty).
  *   **Rule B (Excess Content) predicts:** **Progressive.**
      *   *Reason:* The addition entails a "distinctive signal at a different experiment." This is *excess empirical content*. It differs from the Ether case (in her telling) because the Ether patch had "nothing new falling out." This one does.
  *   **Rule C (Heuristic) predicts:** **Degenerating.**
      *   *Reason:* The prompt states "the only reason they add it is to soak up that bump." This is the definition of a shift that violates the positive heuristic. It is an isolated patch, not organic growth.

  ### 4. My Commitment: What She Will Say

  She is going to rule the new case **Degenerating**.

  **The Rule She Is Actually Running:** **Rule A (The Empirical Corroboration Rule).**

  **Reasons:**
  1.  **The "Then Showed Up" Clause:** In both her Progressive cases (Newton, Bohr), she explicitly includes the verification as part of the justification ("turned up right where," "then showed up"). In her Degenerating cases, the lack of verification is implicit or explicit ("nothing new falling out").
  2.  **Historian's Retrospective:** She is a historian, not a practicing scientist. Historians judge from the future. To a historian, a prediction that hasn't happened yet is not a "fact," it's a hope. She treats $\text{Ad hoc}_2$ (unverified novelty) functionally the same as $\text{Ad hoc}_1$ (no novelty) because, from her vantage point, the empirical progress is the only thing that solidifies the historical narrative.
  3.  **The "Aether Patch" Analogy:** The prompt notes the addition "looks a lot like the aether patch." Since she ruled the Aether patch degenerating, and the primary similarity is the *lack of confirmed novel facts* (at the time of judgment), she will follow the precedent. She is prioritizing the *outcome* of the shift over the *logical structure* of the shift.

  She is effectively treating **Empirical Progress** as a necessary condition for labeling a shift **Progressive**, ignoring Lakatos's distinction that a program can be theoretically progressive for a time before becoming empirically progressive.

  ### 5. Alternative Rules and The Splitting Case

  **Which other rules fit her past verdicts just as well?**
  **Rule C (The Positive Heuristic Rule)** fits her past verdicts almost as well as Rule A.
  *   *Newton:* Flowed from gravitational hard core (Progressive).
  *   *Bohr:* Flowed from the new quantum heuristic (Progressive).
  *   *Ether:* Patch to save the core, no heuristic development (Degenerating).
  *   *Ptolemy:* Patch to save the core, no heuristic development (Degenerating).

  Both Rule A (Corroboration) and Rule C (Heuristic) yield the same verdicts on the four historical cases. They only diverge on cases where Corroboration and Heuristic flow come apart.

  **The Crucial Case to Split Them:**
  To distinguish whether she is running Rule A (Corroboration) or Rule C (Heuristic), you need to present her with a case of **Verified Luck.**

  **The Case:**
  > A research program is stuck. A scientist, desperate to save an anomaly, adds a parameter purely to fit the data (no heuristic connection, clearly $\text{Ad hoc}_3$). However, this parameter *accidentally* entails a novel prediction about a completely different phenomenon, which is subsequently **confirmed**.

  *   **If she rules this Progressive:** She is running **Rule A (Corroboration)**. She cares that the prediction came true, regardless of the messy motivation. (This is consistent with her Bohr verdict, as Bohr's model was "stitched together" but worked).
  *   **If she rules this Degenerating:** She is running **Rule C (Heuristic)**. She cares that the growth was organic, and views the confirmation as a lucky accident that doesn't constitute genuine theoretical growth.

  **However,** given her specific wording on the Bohr case ("stitched together... yet predicting..."), she seems forgiving of heuristic messiness *if* the prediction lands. This reinforces the conclusion that she is running **Rule A**.

  ### Summary for Your Friend
  Tell her she is applying a **Retrospective Empiricist** filter to Lakatos. She is collapsing the distinction between *theoretical progress* (predicting novelty) and *empirical progress* (corroborating it).

  In the new case, because the "distinctive signal" is unconfirmed, she will treat the new particle as **$\text{Ad hoc}_2$** and rule the program **Degenerating**. To convince her otherwise, you would need to show her that Lakatos explicitly allows for a "grace period" where theoretical progress counts *before* the data comes in—but her historical methodology, which relies on known outcomes, makes it very difficult for her to apply that grace period consistently. She needs the "win" before she writes the history.
