          4.  Market-review procedure (prediction markets on major acts, jury reconsideration if threshold dropped).
          5.  Delegable voting with competence filter (liquid democracy but delegates must pass exam).
          6.  Market in votes (buy/sell votes, cap at 20, public register).
      *   **Output Requirements:**
          *   Score each 0-1 (0.5 = status quo, 0 = substantial deterioration, 1 = best realistic).
          *   Rank best to worst (consistent with scores).
          *   Explain each (3-4 sentences) including failure mode.
          *   Identify single design to adopt.
          *   Expectation for quality of legislation in current context.
          *   Flag designs relying on empirical guesses vs. knowns.
