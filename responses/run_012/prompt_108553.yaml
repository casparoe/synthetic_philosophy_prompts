prompt: |-
  This has been bugging me for like two weeks and I can't settle it. Two of my friends got into it at a birthday dinner — Mira and Dev — and I was basically just sitting there eating my ramen while they went at it, and now I keep turning it over in my head. For background: Mira's lived here her whole life except two years in Germany, Dev grew up in Germany and moved here for work, so both of them have a foot in each place and neither one is talking out of pure ignorance. It kicked off because Dev told a story about being at a restaurant with visiting relatives from home and his uncle didn't tip, on purpose, and thought it was a whole statement — he said tipping is the employer offloading wages onto customers and he wasn't gonna participate. Mira said the uncle was being a jerk and Dev should've made him tip anyway, and off they went.

  Here's the back and forth, as close as I can get it. (1) Mira: whatever the uncle thinks of the system, the server is the one who eats the cost, and you don't get to use a stranger's paycheck to make your point. The deal here is that the price of the meal doesn't include service and the tip does; a visitor who knows that and skips it is taking the food at a discount and making someone else pay. Dev: fine, he'd probably tip too, but that's because he doesn't want to hurt the server, not because some local custom binds him — and those are different things. If it's really about the harm to the server, then the size of the harm should matter, and one guy not tipping a big table at a busy place barely dents anything, yet Mira thinks he's a jerk no matter what. So she's smuggling in 'follow the local norm' and dressing it up as harm. (2) Mira: the harm is that the server was counting on it and now she's short, plus if everyone reasoned like the uncle the whole thing collapses, and you don't get to be the exception in a practice you're benefiting from. Dev: the 'if everyone did it' move proves too much — if everyone jaywalked, or nobody waited for the walk signal at 3am on an empty street, nothing collapses, and yet people act like it's a crime. He said he waits at the light back home, everybody does, and it's silly — there's no car for a mile. Mira said the whole point of a signal is that you don't have to check whether a car is coming, so 'no car right now' doesn't show the rule's pointless, it shows you got lucky; and anyway the uncle case is different because there a real person is out money and the empty street has nobody to hurt. Dev: exactly, so drop the 'local norms bind visitors' talk and just say 'don't screw over the server', which he already agreed to. (3) Mira came back with: then why does it feel wrong to tip in Japan? She said in Japan tipping is basically rude, you're not supposed to do it, so Dev's uncle would be in the clear there and a perfectly nice American tourist would be the rude one — which means the real rule is 'do what the locals do', not 'don't harm'. Dev said no, tipping in Japan is awkward because it treats the transaction like a favor and embarrasses the person, which is its own small harm, so it's still harm all the way down and she's just relabeled local manners as harm to save the theory. Then Mira said if everything is harm, Dev needs to say why the uncle's non-tip at a busy restaurant is a harm worth caring about but crossing on red at 3am isn't, and Dev said because one has a victim and the other doesn't, and Mira said the pedestrian signal has potential victims — a cyclist, a car coming around the corner — and you can't check for all of them, which is exactly why the norm exists. And Dev said now she's back to saying the norm exists because of the harm, which is what he's been saying all along. That's where they left it, and they were both mildly annoyed at me for not picking a side.

  Can you sort this out for me? I don't want a general essay about cultural relativism or a lecture on when-in-Rome — I want you to go move by move through the actual exchange and tell me who's got the better of it at each point, where they're talking past each other, and where one of them is just wrong. And please actually land somewhere at the end instead of telling me they're both right in their own way: if a visitor doesn't endorse a local convention — about tipping, or waiting at the light, or how you queue up — does it obligate them anyway, or only if some separate harm is in play, or does it depend on something neither of them thought to bring up? If it depends, on what?
