  7.  **Final Polish:** Check against constraints. No "both right." No general essays. Move-by-move breakdown. Definitive ending. (Looks good).

  *(Self-Correction on the "Jaywalking" point)*: Dev argues jaywalking at 3am is fine. Mira argues the norm exists because you *can't* know it's safe. This is a strong point for Mira. I need to make sure I highlight that Dev's analogy fails because traffic laws are safety-based, tipping is wage-based.

  *(Final thought on the Verdict)*: The key is **Implicit Contract**. When you sit down, you agree to the terms of service. In the US, terms include tip. In Japan, terms exclude tip. The Uncle violated the contract. Dev is conflating "I disagree with the contract" with "I am not bound by the contract."

