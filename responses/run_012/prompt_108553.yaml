      *   **Core Conflict:** Dev's uncle refused to tip in the US as a political statement against the wage system. Mira says he's a jerk. Dev says the uncle's motive (not hurting the server) matters more than the norm.
      *   **Constraints:** No general essays on cultural relativism. No "both are right" cop-outs. Go move-by-move through the exchange. Identify who wins each point, where they talk past each other, and where one is wrong. Land on a definitive conclusion about visitor obligation.
      *   **Tone:** Analytical, decisive, conversational but rigorous.

  2.  **Deconstruct the Argument (Move-by-Move):**

