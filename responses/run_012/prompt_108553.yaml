answer: |-
  Here is the move-by-move breakdown of the argument, followed by a definitive verdict on the principle at stake.

  ### Round 1: The "Deal" vs. The "Statement"
  **Mira:** The price of the meal is Menu + Tip. The server expects this. Skipping it is taking a discount at the server's expense.
  **Dev:** I'd tip to avoid hurting the server, but not because a "custom" binds me. Also, one guy not tipping at a busy place barely dents the server's income, so Mira is pretending this is about harm when it's really about obedience.

  **Who wins:** **Mira.**
  **Why:** Dev makes a fatal mathematical error. In the US tipping system, servers often "tip out" support staff (bartenders, bussers) based on *sales*, not tips received. If the uncle doesn't tip, the server might literally pay out of pocket to serve that table. Even without that, servers budget based on expected percentages. Dev's claim that "one guy... barely dents anything" is empirically false in the context of low-margin service work.
  **Where Dev is wrong:** He tries to separate "harming the server" from "violating the norm." In this specific economic system, violating the norm *is* the mechanism of the harm. You cannot separate them.

  ### Round 2: Universalizability and the Jaywalking Analogy
  **Mira:** If everyone did this, the system collapses. You benefit from the practice (being served), so you can't be the exception.
  **Dev:** "If everyone did it" proves too much. Jaywalking at 3am on an empty street harms no one, yet it's against the norm.
  **Mira:** The signal exists so you *don't* have to check for cars. "No car right now" is luck, not safety. Plus, the uncle case has a *real* victim (server out of money); the empty street has none.
  **Dev:** Okay, then drop the "local norm" talk and just admit it's about "don't screw the server."

  **Who wins:** **Mira.**
  **Why:** Dev tries to use the Jaywalking analogy to break Mira's "universalizability" argument (the idea that a rule is valid only if everyone following it works). Mira successfully parries this by distinguishing *potential* victims (jaywalking) from *actual* victims (tipping).
  **Where they talk past each other:** Dev thinks he won when Mira conceded the point was "don't screw the server." He thinks this validates his uncle (who didn't *want* to screw the server, just the employer). Mira thinks this validates her point (the uncle *did* screw the server, regardless of intent). Dev is conflating *motive* with *outcome*.

  ### Round 3: Japan, Harm, and the Definition of Norms
  **Mira:** In Japan, tipping is rude. So the rule is "do what locals do," not "don't harm."
  **Dev:** Tipping in Japan causes harm (embarrassment/social friction). It's still harm all the way down.
  **Mira:** Then explain why the uncle's non-tip is a harm worth caring about but jaywalking at 3am isn't.
  **Dev:** One has a victim, one doesn't.
  **Mira:** Jaywalking has *potential* victims. That's why the norm exists.
  **Dev:** So you admit the norm exists because of the harm. That's my point.

  **Who wins:** **Mira (but it's messy).**
  **Why:** Dev stretches the definition of "harm" until it snaps. Claiming that tipping in Japan causes "harm" because it's awkward is a category error. It's a social faux pas, not a material loss. In the US, not tipping is a material loss. Mira is right to press him on why one norm is binding and the other isn't.
  **Where Dev is wrong:** He claims victory in the last sentence ("That's what he's been saying all along"), but he hasn't been. He started by saying norms *don't* bind visitors, only direct harm does. Now he's arguing that norms *track* harm, which means if a norm exists (like no tipping in Japan), there is likely a harm (social friction) behind it. He accidentally argues himself into Mira's corner: norms are proxies for harm, so you should follow the norm to avoid the harm.

  ### Where They Talked Past Each Other
  1.  **Intent vs. Impact:** Dev kept defending the uncle's *intent* (protesting wage theft). Mira kept judging the *impact* (server loses rent money). In moral philosophy regarding public interaction, impact almost always trumps intent.
  2.  **Systemic vs. Isolated:** Dev viewed the transaction as isolated (one table, one night). Mira viewed it as systemic (participation in a wage structure).
  3.  **The Definition of "Visitor":** Dev thinks being a visitor grants you an outsider's critical distance. Mira thinks being a *customer* makes you a participant, regardless of where you live.

  ### The Verdict: Does a Visitor Have an Obligation?

  Here is the settlement. Dev is wrong, Mira is right, but her reasoning needed tightening.

  **The Principle: Voluntary Participation in a Cooperative Scheme.**
  A visitor is obligated to follow a local convention not simply because "it's the culture" (When in Rome) and not simply because "someone might get hurt" (Utilitarianism). They are obligated because **by voluntarily participating in a system, they agree to its terms of service.**

  Here is how it applies to your three examples:

  1.  **Tipping (The Uncle):** **Obligated.**
      When the uncle sat down and ordered food in a US restaurant, he entered a specific economic contract. In the US, the "price" of the service is legally and socially split between the menu price and the tip. By consuming the service, he accepted the wage structure of that establishment. Refusing to tip because he dislikes the wage system is like refusing to pay sales tax because you dislike how the government spends it. You can protest the system by not eating there, but you cannot consume the benefit while withholding the agreed-upon cost. The server is a third party to his political protest and should not be the funding source for it.

  2.  **Tipping in Japan:** **Obligated (to NOT tip).**
      Why? Because the "contract" there includes dignity and non-transactional service. Forcing a tip imposes a transactional dynamic that violates the terms of *that* service. It creates social friction (the "harm" Dev mentioned). The obligation is to respect the local terms of exchange, not to impose your own.

  3.  **Jaywalking at 3 AM:** **Not Obligated.**
      This is the exception. Traffic laws are safety regulations, not cooperative economic schemes. If there is objectively no risk to others (no cars, no pedestrians, no cyclists), the "harm" principle vanishes. However, Mira is right that *you cannot be sure* there is no risk. But strictly speaking, if a visitor knows for a fact that their action violates a norm but causes zero harm and involves no cooperative scheme (like a queue or a wage system), the obligation dissolves.

  **The Final Ruling:**
  Dev's uncle was a jerk. Dev's defense relies on the idea that you can opt out of a social contract while still taking the benefits of that contract. You cannot.

  **The Rule for Visitors:**
  If the convention is a **price mechanism** (tipping, queuing, paying fares) or a **coordination game** (driving on the right/left), you are obligated to follow it because your participation relies on others following it too. If the convention is purely **symbolic** (clothing, greetings) and violating it causes no material harm or coordination failure, you are not obligated, though you may be rude.

  The uncle violated a price mechanism. He took the service without paying the full price. Mira wins. Tell Dev to buy the server a drink next time he's in town.
