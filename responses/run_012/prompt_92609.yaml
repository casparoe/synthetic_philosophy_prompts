      *   Options: Termite colony (classic Dennett example), High-frequency trading algorithm, Bureaucracy, Immune system, Large Language Model.
      *   Selection: **A High-Frequency Trading (HFT) Algorithm / Market Maker.** Why? It deals with "reasons" (prices, signals), it acts with extreme competence, it generates logs/reports (narratives) about why it acted, and it's clearly devoid of consciousness. It fits the "reasons are free-floating" idea well—the market dictates the logic, not the agent.
      *   Alternative: **A Bureaucracy.** Also good, but might feel too human-ish.
