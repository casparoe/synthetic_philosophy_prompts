      *   **The Climax:** A critical decision point. To sell or hold. The logic flows without a decider.
      *   **The Ending:** No awakening. Just continuation of process. The "story" it tells itself is just data.

  4.  **Writing - Focus on Constraints:**
      *   *Word Count:* Keep an eye on this. Need to expand descriptions of process to hit 1.5k without adding "feelings."
      *   *No Inner Life:* Avoid words like "know," "believe," "want," "feel," "understand." Use "process," "calculate," "execute," "register," "trigger."
      *   *The Regress:* Incorporate the idea that the "reason" is in the market structure, not the code. The code is just a conduit.

  5.  **Drafting - Step-by-Step:**

