  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the voice. Cold, procedural, yet active. No "I feel." Only "Input received," "Protocol executed." Show the competence.
      *   **The Conflict/Event:** A market anomaly. A crash or a spike. The system must react.
