answer: |-
  Thank you. Please, remain seated. The heat is already working against us, and standing up will only make it worse. I can see the sweat on your brows. I can see the families fanning themselves with the programs. The air in here is still. We are all in this together.

  I know what the President just told you. She said I teach philosophy. I saw the shift in the room. Shoulders tightened. Eyes glazed. You are waiting for the part where I tell you that nothing is real, or that we are all just dreaming this ceremony. I promise I will not do that. I know you have been awake since five. I know your families are in those folding chairs. They did not come to hear a lecture. They came to see you walk. They came to celebrate a finish line. They came to see proof that the sacrifice was worth it.

  But since I am here, and since you are here, I want to ask you one question. It is the only question that matters today. What do you have now that you did not have four years ago?

  You have a diploma. You have debts. You have memories. But intellectually, what changed?

  We like to say you have knowledge. We say you know things now. Before, you believed things. Now, you know them. But I have been thinking about what that means. And it is harder to say than it looks.

  Imagine a statue. A heavy stone statue standing in a public square. It is beautiful. It is true. It represents something real. But if the wind blows hard enough, it will tip over. Unless it is tied down.

  A true belief is like that statue. You can have a belief that is true. You can guess the answer on a test and get it right. You can predict the rain and be correct. The belief is true. It matches the world. But it is not tied down. It is loose. If the wind blows—if someone asks you why—you have nothing to hold it in place.

  A lucky guesser has the truth. But they do not have the statue secured.

  So we say education is the tying down. It is the process. It is the method. It is the good teachers who showed you how to anchor the stone.

  I want to tell you why this matters outside this gymnasium. I want to tell you why your parents should feel good about what you have done here.

  Think about a time you took your car to a mechanic. You know the scene. The noise is terrible. Something is grinding under the hood. You are worried. It will be expensive. The mechanic lifts the hood. He listens. He tells you what is wrong. He tells you what it will cost to fix. The smell of grease is in the air. The engine is cold.

  Now, imagine two mechanics.

  The first one guesses. He says, "It's the alternator." He is right. It was the alternator. You pay the bill. The car runs.

  The second one tests. She checks the voltage. She checks the belt tension. She rules out the battery. She says, "It's the alternator, and here is the reading that proves it." She is right. You pay the bill. The car runs.

  In both cases, the car runs. In both cases, the belief was true. The outcome was identical. So why do you prefer the second mechanic?

  You prefer her because when the car breaks down again next month, you can go back. You can ask. She can answer. She can trace the chain of reasons. If she was wrong, she can find out where the chain broke. The first mechanic cannot do that. He was just lucky. Next time, he might guess the transmission.

  This is what you have done for four years. You have learned to be the second mechanic.

  But I must be honest with you. There is a catch.

  You can tie a statue down and the ground can still shift. You can follow every method, check every reading, listen to every teacher, and still be wrong. The world is complicated. Sometimes good reasons lead to false conclusions. Sometimes the alternator tests fine, but the wiring is corroded in a place you cannot see.

  Being able to answer for your belief does not guarantee you are right. It only guarantees that you are responsible.

  This is the hard part. I cannot stand here and tell you that this degree guarantees truth. It does not. I cannot tell you that your education makes you infallible. It makes you accountable. The diploma is not a receipt for truth. It is a receipt for training. It says you know how to check the knots.

  Some of you will go into fields where being right matters immediately. Medicine. Engineering. Law. If you are wrong, people get hurt. But even if you go into art, or business, or teaching, you will be asked to stand behind what you say.

  Your families know this. They know that raising you was not about making sure you never made a mistake. It was about making sure that when you made a mistake, you owned it. When you were right, you could explain it. They paid for this training so you could be trustworthy.

  That is the value of the tying down. It is not that the statue cannot fall. It is that you know how it was anchored.

  So here is my charge to you. It is not a promise of success. It is a request for effort.

  Do not settle for being right. Settle for being able to say why.

  When you are in a meeting and you have an opinion, do not just state it. Know where it came from.

  When you are arguing with a partner, do not just insist. Listen to the counter-argument. Check your anchors.

  When you vote, do not just feel. Look for the evidence.

  And when you are wrong—and you will be wrong—admit it. A tied-down belief that falls is still better than a loose one. Because you can find the broken rope. You can learn.

  To the families: Thank you. You sent us people who were ready to be tied down. You taught them to stand. We just showed them how to check the knots. Your investment was not in certainty. It was in character.

  To the graduates: You are leaving a place that values the question more than the answer. Take that with you.

  The world does not need more people who are sure they are right. It needs more people who know what it takes to claim they know.

  Go out and tie your statues down. And when the wind blows, be the person who can explain why it stood, or why it fell.

  Congratulations.
