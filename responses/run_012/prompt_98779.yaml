prompt: |-
  I participate in an ethics reading group, and last week a friend who has actually read some of the contemporary literature gave us a summary of the particularism–generalism debate. He is usually reliable, and I do not know the literature well enough to tell where he is simplifying, but something about the summary struck me as too neat. Here is what he said: ‘Particularism is the view that there are no moral principles. Generalism says that right action is always determined by a principle, and particularism denies this: it holds that moral reasons are entirely context-dependent, so a feature like that an action would keep a promise can count in favor of it in one situation and against it in another, with no general truth about what promise-keeping favors. Since every moral principle has exceptions, generalists are forced to retreat to rules of thumb, and particularism simply takes this to its logical conclusion. The particularist therefore says that moral judgment is a kind of perceptual skill, like tasting wine or diagnosing a patient, that cannot be captured in words; moral education is a matter of training someone’s eye rather than teaching them rules. The standard objection is that without principles we could never justify a moral judgment or resolve a disagreement, and since particularists cannot answer this, particularism collapses into intuitionism—just saying “this action is right” and refusing to give reasons.’ I am inclined to think particularism is a bit silly, but I suspect that is partly because the summary makes it sound sillier than it is.

  Please audit the summary sentence by sentence. Which parts would a careful particularist accept, which would they wince at as an oversimplification or a conflation, and which are just wrong? In particular, I would like you to separate: (a) the claim that principles are not necessary for moral thought or action from the claim that there are no true moral generalizations; (b) the holism of reasons—roughly, that a feature can have different contributory valence in different contexts—from the stronger claim that no feature has any general moral significance; and (c) the familiar objection that particularism cannot guide or justify from the conclusion that particularism is refuted by that objection. Does the summary’s final collapse-into-intuitionism claim follow from anything true in it? If the summary is unfair, what is the most defensible version of particularism that remains, and what would a generalist have to concede or deny to make the debate genuine rather than a misunderstanding? I would also like to know how much of this is settled among people who work on the topic versus genuinely contested—for example, whether the disagreement is metaphysical, epistemological, or primarily about the role of principles in moral education and deliberation—and please do not present a contested reading as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific summary of the particularism-generalism debate provided by the user's friend.
      *   **Goal:** Identify accuracies, oversimplifications, conflations, and errors from the perspective of a "careful particularist" (and generalist context).
      *   **Specific Distinctions Required:**
          *   (a) Principles not necessary vs. no true moral generalizations.
          *   (b) Holism of reasons (valence switching) vs. no feature has general significance.
          *   (c) Objection (cannot guide/justify) vs. Conclusion (therefore refuted/collapses into intuitionism).
      *   **Additional Questions:** Does the "collapse into intuitionism" claim follow? What is the most defensible version of particularism? What must generalists concede/deny for a genuine debate? What is settled vs. contested (metaphysical, epistemological, pedagogical)?
      *   **Constraint:** Do not present contested readings as consensus.

  2.  **Deconstruct the Friend's Summary (Sentence by Sentence):**

      *   *Sentence 1:* 'Particularism is the view that there are no moral principles.'
          *   *Analysis:* Too strong. Most particularists (e.g., Dancy) deny *codifiability* or *substantive* principles, not necessarily *any* generalization. Some accept trivial or formal principles.
          *   *Verdict:* Oversimplification/Conflation.

      *   *Sentence 2:* 'Generalism says that right action is always determined by a principle, and particularism denies this: it holds that moral reasons are entirely context-dependent, so a feature like that an action would keep a promise can count in favor of it in one situation and against it in another, with no general truth about what promise-keeping favors.'
          *   *Analysis:* First half (Generalism) is okay-ish. Second half (Particularism) captures *holism* well ("count in favor... in one situation and against... in another"). However, "no general truth about what promise-keeping favors" is the contentious bit. Dancy admits *default* values but denies *invariant* contribution.
          *   *Verdict:* Mostly accurate on holism, but potentially overstates the "no general truth" claim depending on how "truth" is defined (cp. default vs. invariant).

      *   *Sentence 3:* 'Since every moral principle has exceptions, generalists are forced to retreat to rules of thumb, and particularism simply takes this to its logical conclusion.'
          *   *Analysis:* This is a common rhetorical move by particularists, but generalists (e.g., Hooker, McNaughton) deny their principles are mere rules of thumb; they claim *ceteris paribus* laws or principled exceptions. Saying particularism is just the "logical conclusion" begs the question against generalism.
          *   *Verdict:* Contested/Partisan framing.

      *   *Sentence 4:* 'The particularist therefore says that moral judgment is a kind of perceptual skill, like tasting wine or diagnosing a patient, that cannot be captured in words; moral education is a matter of training someone's eye rather than teaching them rules.'
          *   *Analysis:* The analogy (perceptual skill) is standard (Dancy uses it). The "cannot be captured in words" part is tricky. Particularists deny *codification*, not necessarily *articulacy*. We can give reasons, just not subsume them under laws.
          *   *Verdict:* Oversimplification on the "words" aspect.

      *   *Sentence 5:* 'The standard objection is that without principles we could never justify a moral judgment or resolve a disagreement, and since particularists cannot answer this, particularism collapses into intuitionism—just saying "this action is right" and refusing to give reasons.'
          *   *Analysis:* The objection is standard. The claim that particularists *cannot answer* is false (they have responses). The claim that it collapses into intuitionism (non-inferential, reason-less) is a major conflation. Particularists give reasons; they just deny those reasons rely on principles.
          *   *Verdict:* Wrong/Unfair.

  3.  **Address Specific Distinctions (a, b, c):**

      *   *(a) Necessity vs. Existence:* Particularists usually argue principles aren't *necessary* for competence/justification. They don't always deny *any* true generalizations exist (e.g., "Pain is bad" might be generally true, even if not a strict law for action).
      *   *(b) Holism vs. No Significance:* Holism = valence switching. It does *not* mean promise-keeping is *usually* irrelevant. It means its contribution isn't invariant. The summary blurs "no invariant contribution" with "no general truth."
      *   *(c) Objection vs. Refutation:* The objection (guidance/justification) is serious, but claiming particularists *cannot answer* is false. Dancy, for instance, argues justification is case-by-case, not principle-based. The leap to "intuitionism" (in the Moorean, non-inferential sense) is the error.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the friend's summary is a common "street version" but lacks nuance. Validate the user's suspicion.
      *   **Sentence-by-Sentence Audit:** Go through the text provided in the prompt. Label them (Acceptable, Oversimplified, Wrong).
      *   **Addressing Distinctions (a, b, c):**
          *   (a) Clarify the "no principles" claim. Distinguish *codifiability* from *truth*.
          *   (b) Clarify *Holism*. Use the "default value" concept.
          *   (c) Clarify the *Justification* objection. Distinguish particularism from irrational intuitionism.
      *   **The "Collapse into Intuitionism" Claim:** Explain why this is a category error. Particularists give reasons (features), just not subsumptive arguments.
      *   **Defensible Particularism:** Present "Radical Particularism" (Dancy) vs. "Moderate Particularism." Focus on the *priority of the particular*.
      *   **Generalist Concessions:** What makes the debate real? (e.g., Are *ceteris paribus* clauses substantive or empty?).
      *   **Settled vs. Contested:**
          *   *Settled:* Holism is a real phenomenon (valence switching happens).
          *   *Contested:* Does holism entail the falsity of principles? Is moral thought *essentially* principled?
          *   *Nature of Debate:* Metaphysical (nature of reasons) + Epistemological (how we know) + Pedagogical.

  5.  **Refining the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Make sure not to paint all generalists as Kantians. Rule Utilitarians are generalists too.
      *   *Correction:* Ensure the distinction between "Intuitionism" (historical Moore/Ross) and "Particularism" (Dancy) is clear. Ross was a particularist in some senses (prima facie duties) but a generalist in others. Dancy is the target here.
      *   *Nuance:* The friend's summary says "no general truth about what promise-keeping favors." Dancy actually allows that promise-keeping has a *default* positive value, it just isn't *invariant*. I need to highlight this distinction.
      *   *Nuance:* The "cannot be captured in words" bit. Particularists believe we can *talk* about reasons. They deny we can *codify* the relationship between reasons and judgment into a finite set of rules.
      *   *Consensus Check:* Is holism settled? Most agree reasons *can* switch valence. The dispute is whether they *must* or whether principles can accommodate this via complex clauses. I should state that holism is widely accepted, but its *implications* are contested.

  6.  **Final Polish:** Check tone (academic but accessible), ensure all constraints of the prompt are met (especially the a/b/c breakdown and the settled/contested section). Ensure the distinction between "principles as necessary conditions" and "principles as true generalizations" is sharp.

      *(Self-Correction on "Intuitionism"):* The friend claims particularism collapses into intuitionism ("just saying 'this is right' and refusing to give reasons"). This is the biggest error. Particularists give reasons (features of the act), they just deny the *inferential structure* requires a major premise (principle). I must emphasize this.

  7.  **Final Output Structure:**
      1.  Introduction.
      2.  Sentence-by-Sentence Audit.
      3.  Addressing Distinctions (a, b, c).
      4.  The "Collapse" Claim.
      5.  Defensible Particularism & Generalist Concessions.
      6.  Settled vs. Contested.

  8.  (Drafting mental outline complete. Proceeding to generate response.)
answer: |-
  Your suspicion is well-founded. Your friend's summary captures the "street version" of the debate often taught in introductory courses, but it conflates several distinct claims and attributes the weakest version of particularism to its proponents. A careful particularist (such as Jonathan Dancy, the primary architect of contemporary moral particularism) would accept some of the descriptive elements but would object strongly to the philosophical implications drawn from them.

  Here is an audit of the summary, followed by the specific distinctions you requested.

  ### Sentence-by-Sentence Audit

  **1. "Particularism is the view that there are no moral principles."**
  *   **Verdict:** **Oversimplification / Conflation.**
  *   **Analysis:** A careful particularist distinguishes between the claim that there are no *true* moral generalizations and the claim that moral principles are not *necessary* for moral thought. Most particularists do not deny that true generalizations exist (e.g., "pain is generally bad"). They deny that moral competence *depends* on the ability to subsume cases under principles (the "codifiability" thesis). Some particularists accept "default" principles (e.g., "promise-keeping is normally a reason"), provided these are not understood as exceptionless laws.

  **2. "Generalism says that right action is always determined by a principle, and particularism denies this: it holds that moral reasons are entirely context-dependent, so a feature like that an action would keep a promise can count in favor of it in one situation and against it in another, with no general truth about what promise-keeping favors."**
  *   **Verdict:** **Mostly Accurate, but with a crucial caveat.**
  *   **Analysis:** The description of **holism** (a feature counting in favor in one context and against in another) is accurate and is the core metaphysical claim of particularism. However, the phrase "no general truth about what promise-keeping favors" is too strong. Dancy, for instance, admits that promise-keeping has a *default* positive valence. The particularist claim is not that promise-keeping is *usually* neutral, but that its contribution is not *invariant*. It is a claim about the *structure* of reasons, not necessarily their statistical frequency.

  **3. "Since every moral principle has exceptions, generalists are forced to retreat to rules of thumb, and particularism simply takes this to its logical conclusion."**
  *   **Verdict:** **Partisan Framing / Question-Begging.**
  *   **Analysis:** This is a rhetorical move, not a neutral summary. Generalists (e.g., Brad Hooker, David McNaughton) argue that principles can handle exceptions through *ceteris paribus* (all else being equal) clauses or by refining the principle's conditions. They deny their principles are mere "rules of thumb." To say particularism is the "logical conclusion" assumes the generalist's attempts to save principles have already failed, which is the very point in dispute.

  **4. "The particularist therefore says that moral judgment is a kind of perceptual skill, like tasting wine or diagnosing a patient, that cannot be captured in words; moral education is a matter of training someone's eye rather than teaching them rules."**
  *   **Verdict:** **Mixed (Accurate Analogy, Wrong Implication).**
  *   **Analysis:** The analogy of perception (or "moral sensitivity") is standard particularist fare. However, the claim that this skill "cannot be captured in words" is misleading. Particularists do not claim moral reasons are ineffable. We can articulate *why* an action was right (e.g., "because it relieved suffering"). What cannot be captured in words is a *finite set of rules* that dictates how those reasons combine in every possible future case. Moral education involves training judgment, but particularists do not deny that we teach students *concepts* and *reasons*, only that we teach them algorithms.

  **5. "The standard objection is that without principles we could never justify a moral judgment or resolve a disagreement, and since particularists cannot answer this, particularism collapses into intuitionism—just saying 'this action is right' and refusing to give reasons.'"**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** The first half states a standard objection (the "guidance" or "justification" objection). The second half ("since particularists cannot answer this...") is false; particularists have extensive responses. The final claim ("collapses into intuitionism... refusing to give reasons") is a category error. Particularists are not intuitionists in the Moorean sense (that "right" is a non-natural property known without inference). Particularists argue we give reasons (features of the situation), but the justification is not *inferential* (it does not rely on a major premise/principle). One can give reasons without citing a principle.

  ---

  ### Addressing Your Specific Distinctions

  #### (a) Principles are not necessary vs. There are no true moral generalizations
  The summary conflates these.
  *   **The Necessity Claim:** This is the epistemological/psychological claim. It says a moral agent does not need to possess or apply a principle to make a correct judgment. (Most particularists defend this).
  *   **The Existence Claim:** This is the metaphysical claim. It says there are no true, substantive moral generalizations. (Fewer particularists defend this strong version).
  *   **The Audit:** The summary treats particularism as endorsing the strong Existence Claim ("there are no moral principles"). A defensible particularism usually rests on the Necessity Claim: even if true generalizations exist, they play no role in the *structure* of moral reasoning.

  #### (b) Holism of reasons vs. No feature has any general moral significance
  The summary conflates these.
  *   **Holism:** A feature (e.g., "it is a lie") can be a reason for action in one case and a reason against in another, or no reason at all in a third, depending on the context.
  *   **No General Significance:** The claim that "lying" is not *generally* wrong.
  *   **The Audit:** The summary implies the latter ("no general truth about what promise-keeping favors"). A careful particularist accepts Holism but can admit that lying has a *default* negative valence. The point of holism is not that features are chaotic, but that their contribution is not *invariant*. The summary makes particularism sound like moral chaos; the actual view is that the *function* of a reason is context-sensitive, not that the reason is absent.

  #### (c) The objection (cannot guide/justify) vs. The conclusion (therefore refuted)
  The summary conflates the challenge with the surrender.
  *   **The Objection:** "If you can't cite a principle, how do you argue with someone who disagrees?"
  *   **The Particularist Response:** We argue by highlighting features, not by invoking rules. We say, "Look at the suffering involved," not "Look, this violates the Categorical Imperative."
  *   **The Audit:** The summary claims particularists "cannot answer this." This is false. They answer by changing the model of justification from *subsumptive* (case + rule = judgment) to *coherentist* or *perceptual* (judgment is a response to the configuration of features). Whether this answer is *successful* is contested; claiming they have *no answer* is incorrect.

  ---

  ### Does the "Collapse into Intuitionism" Claim Follow?

  **No.** This is the most unfair part of the summary.

  Historical Intuitionism (e.g., G.E. Moore) often held that basic moral truths are self-evident and known without inference. The summary accuses particularists of saying, "It's right because I feel it is," and refusing to give reasons.

  **The Particularist Defense:** Particularists *do* give reasons. If I say lying is wrong here, I cite the feature "it involves a lie." I do not need to add, "...and lying is always wrong."
  *   **Generalist Model:** Action is X + Principle (All X are wrong) → Judgment (Wrong).
  *   **Particularist Model:** Action is X → Judgment (Wrong).
  The particularist does not refuse to give reasons (X); they refuse to provide the *major premise* (All X are wrong). Therefore, they do not collapse into a view where reasons are unnecessary. They collapse into a view where *principles* are unnecessary. These are not the same thing.

  ### The Most Defensible Version of Particularism

  The most defensible version is **Radical Holism regarding Reasons**, coupled with a **Denial of Codifiability**.

  1.  **Metaphysics:** The moral status of an action is determined by the specific configuration of non-moral features in that situation. There is no finite function that maps features to moral status across all possible worlds.
  2.  **Epistemology:** Moral knowledge is a sensitivity to these configurations, akin to perception or practical wisdom (*phronesis*), rather than the application of a theoretical code.
  3.  **Concession to Generalism:** A defensible particularist can concede that generalizations are useful for *teaching* and *heuristics*, provided they are not treated as constitutive of moral truth.

  **What must a Generalist concede or deny for the debate to be genuine?**
  For the debate to be real (and not a misunderstanding), the Generalist must concede that:
  *   **Valence Switching is Real:** They must admit that features *can* change valence (e.g., pleasure is not always good). If they deny this, they are fighting a straw man.
  *   **Principles must be Substantive:** They cannot define "principle" so loosely that "Do the right thing" counts as a principle. The principle must have content that guides action independent of the judgment it is supposed to justify.

  The debate then hinges on: **Can the Generalist formulate principles complex enough to handle holism without becoming trivial?** (e.g., "Lying is wrong, unless it saves a life, unless..." vs. "Lying is wrong *ceteris paribus*.") The Particularist argues that once you add enough *ceteris paribus* clauses to handle every exception, the principle loses its explanatory power and becomes a mere description of the judgment it was meant to justify.

  ### Settled vs. Contested

  It is vital to distinguish where the literature stands.

  **1. Settled (or Near Consensus):**
  *   **Holism is a real phenomenon:** Almost no one denies that a feature (like "pleasure" or "promise-keeping") can change its moral valence in different contexts. Even many generalists accept this.
  *   **Rules of Thumb are useful:** Both sides agree principles are useful for pedagogy and heuristic decision-making. The debate is not about utility, but about *necessity* and *truth*.

  **2. Genuinely Contested:**
  *   **Metaphysical:** Does the holism of reasons entail the falsity (or vacuity) of moral principles? Particularists say yes; Generalists say no (principles can be *ceteris paribus* laws).
  *   **Epistemological:** Is moral competence essentially a skill of perception (Particularism) or a capacity for rational subsumption under laws (Generalism)?
  *   **The Nature of Explanation:** Can a moral principle *explain* why an action is right, or does the principle merely generalize from the rightness of the action? (Particularists tend to think the latter: the features explain the judgment, the principle just summarizes it).

  **3. Nature of the Disagreement:**
  The debate is primarily **metaphysical** (about the structure of moral reasons) with secondary **epistemological** implications (how we learn/judge). It is less about moral education (both agree training the eye is needed) and more about whether that training is training in *rules* or training in *sensitivity*.

  ### Summary Recommendation for Your Group
  Your friend's summary is a "caricature" designed to make particularism look like irrational subjectivism. If you wish to correct the record without taking sides:
  1.  Point out that Particularists **do give reasons** (features), they just deny those reasons require **principles** (laws).
  2.  Clarify that **Holism** (valence switching) is accepted by many Generalists, so it cannot be the sole definition of Particularism.
  3.  Note that the "Intuitionism" objection assumes justification requires inference from a major premise, which is exactly what Particularists deny.

  The debate is not "Reasons vs. No Reasons"; it is "Principled Reasons vs. Configural Reasons."
