      *   *The Technical Fact:* System $S$ produces $G$. $S$ proves $Con(S) \to \neg Prov(G)$. $S$ cannot prove $Con(S)$.
      *   *The Criterion:* "A system has closed the loop only if it can use a fact about its own limits as a premise in its own further reasoning."
      *   *Analysis:* Does $S$ satisfy this? $S$ can derive the conditional. But to *use* it (e.g., to assert $\neg Prov(G)$), $S$ needs $Con(S)$. It can't get that internally.
