      *   *Verdict on Step 1:* The Gödelian machine *fails* the criterion in the robust sense required for representation. It tokenizes a sentence *about* itself, but it cannot *act* on the truth of that sentence without stepping outside the system. The "self-reference" is syntactic, not functional. It's a map that includes itself, but the map cannot be used by the territory to navigate.
