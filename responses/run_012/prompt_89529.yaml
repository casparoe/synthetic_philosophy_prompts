      *   *The "Hard Problem":* Functional self-reference explains *access* consciousness (reporting, monitoring), not *phenomenal* consciousness (feeling).
      *   *Hofstadter's Defense:* The "I" is a symbol in the system. When the symbol is activated, that *is* the feeling.
      *   *Critique:* This is an identity claim without a mechanism. It asserts that complex symbol manipulation *is* feeling. This is the ambiguity: "Self-awareness" as functional monitoring vs. "Self-awareness" as subjective experience.
      *   *Verdict on Step 2:* The leap fails. Representational self-reference explains the *structure* of self-knowledge, not the *existence* of a subject. To get (3), you need to assume that certain functional structures *are* phenomenal, which is the very thing to be explained.

  5.  **Synthesizing the Argument:**
