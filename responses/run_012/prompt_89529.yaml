      *   *Why defend it?* Because without pragmatic uptake, self-reference is merely accidental labeling. A book containing its own ISBN is not self-representing in a cognitive sense.
      *   *Why does GEB fail it?* Because the system cannot assert the truth of $G$ without assuming consistency, which it cannot prove. It stalls. It cannot say "I am consistent, therefore G is true." It can only say "If I am consistent..."

  7.  **Refining the Phenomenal Leap:**
      *   Need to be careful not to just say "magic." Need to explain *why* the model doesn't generate the feel.
      *   Argument: A model is a relation between a map and a territory. The "feel" is not the map, nor the territory, nor the relation. It is the *medium* of the map. Formal systems are medium-independent. Therefore, they cannot generate the medium-specific quality of qualia.

