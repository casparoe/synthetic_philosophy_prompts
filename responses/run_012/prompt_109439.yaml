  My friend keeps hitting me with the selfish-gene line: everything alive is just genes using bodies to make more copies of themselves, so when I get worked up about a whole forest or a whole reef going under, he says there's no selection for the ecosystem, only selection for genes, and my worry is sentimentality dressed up as biology. He treats the gene as the unit of selection as if it's settled and as if it settles this. I've read enough to know its not settled, but not enough to say what actually turns on it.

  Hear's what I want: the most important implications of the units-of-selection debate -- genes vs individuals vs groups vs species vs whatever else people count as a unit -- for the question of whether something like a forest (say the whole thing, the trees plus the fungal networks people say trade nutrients between them) could be a unit of selection in its own right. The real implications, not the slogan version. What changes about what we're allowed to say? What gets ruled out? Which parts of the debate turn out to be about how you keep the books in a model versus about what's actually doing the causing in the world? And which of my friend's moves survive and which don't?

  Lead with the bottom line in a couple sentences, then unpack it. Keep the whole reply under 500 words and don't bother with citations or a reading list.
