answer: |-
  Here is the breakdown. Since you're an MA student, I'll skip the intro and treat this as a seminar critique. You asked for no diplomacy, so I won't give you any.

  ### Move-by-Move Breakdown

  **(1) Mira: The "Unused Fire Exit" (Neutral Arbiter)**
  *   **Rating:** **Theoretically Plausible, Empirically Weak.**
  *   **Justification:** This is the standard Bagehotian defence. It holds up in theory (a neutral head of state resolves deadlock), but it relies entirely on the assumption that the monarch *remains* neutral and that the power is *only* used for constitutional rescue, not political advantage.

  **(1) Tom: The "Painted Door" (Australia 1975)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Tom correctly identifies that "reserve powers" are not theoretical; they are legal realities that have been used to overturn democratic mandates. The "fire exit" leads to a place where unelected officials override elected ones.

  **(2) Mira: "The System Bent, Didn't Break" (Outcome Justification)**
  *   **Rating:** **Mistaken.**
  *   **Justification:** This is post-hoc rationalization. That a crisis was eventually resolved by an election does not legitimize the interim period of unelected rule. Stability is not the only constitutional virtue.

  **(2) Tom: "Voters Clean Up Afterwards" (Democratic Deficit)**
  *   **Rating:** **Right.**
  *   **Justification:** He highlights the interim democratic deficit. The fact that the voters can fix a coup weeks later doesn't make the coup legal or legitimate in the meantime.

  **(3) Mira: "Elected Presidents Cause Deadlock" (Comparative Risk)**
  *   **Rating:** **Partially Right.**
  *   **Justification:** She is correct regarding *directly* elected presidents (e.g., France, US) where dual legitimacy causes cohabitation issues. However, she conflates "elected" with "directly elected."

  **(3) Tom: "Parliamentary Election Solves This" (Germany/Italy Model)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the kill shot against Mira's specific defence of *heredity*. Most stable European republics use parliamentary election for heads of state. This achieves neutrality without the dynasty. Heredity adds no functional value here.

  **(4) Mira: "No Campaigning/Debts" (Independence)**
  *   **Rating:** **Partially Right.**
  *   **Justification:** It is true that a monarch does not campaign. However, an indirectly elected president (by MPs) also does not campaign publicly and owes their position to the legislature, not a donor base.

  **(4) Tom: "Lottery is Better than Birth" (Reductio ad Absurdum)**
  *   **Rating:** **Logically Sound.**
  *   **Justification:** If the only virtue is "lack of campaigning," a lottery is statistically fairer than a genetic lottery. It exposes that heredity is an arbitrary mechanism for selecting independence.

  **(5) Mira: "Training and Long-term View" (Institutional Memory)**
  *   **Rating:** **Romanticized.**
  *   **Justification:** While monarchs are trained, there is no evidence this training yields better constitutional judgement than a senior politician or jurist. The "no incentive to build" argument is also dubious; dynastic preservation is a massive incentive.

  **(5) Tom: "It's a Genetic Lottery of Character" (The Norway Point)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** If the system relies on the King's bravery (Haakon VII in 1940), it relies on the *person*, not the *office*. Relying on a genetic lottery for moral courage is a terrible constitutional design.

  **(6) Mira: "Convention Working" (Norway Nuance)**
  *   **Rating:** **Debatable.**
  *   **Justification:** She tries to frame the King's threat as procedural. It wasn't; it was a personal moral intervention. She is trying to retrofit a political act as a constitutional convention.

  **(6) Tom: "Threat of Abdication is Discretion"**
  *   **Rating:** **Right.**
  *   **Justification:** Correct. If the Head of State can threaten to quit to change government policy, they possess substantive political power, regardless of whether they call it "convention."

  **(7) Tom: "Belgium 1990" (Constitutional Fiction)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is an indisputable fact. The constitution was legally suspended to accommodate the monarch's conscience. This proves the office is not legally neutral.

  **(7) Mira: "It's a Valve, Not a Lie"**
  *   **Rating:** **Mistaken.**
  *   **Justification:** Constitutional integrity requires truth in law. Declaring a Head of State "unable to reign" for 24 hours to bypass their conscience undermines the rule of law. It creates a precedent for legal fiction over legal reality.

  **(8) Tom: "One Citizen's Conscience Gets a Veto"**
  *   **Rating:** **Right.**
  *   **Justification:** A strong liberal democratic point. In a democracy, conscience is private; it does not grant procedural veto power over legislation passed by representatives.

  **(9) Mira: "2019 Prorogation" (The Shield)**
  *   **Rating:** **Empirically True, Normatively Weak.**
  *   **Justification:** It is true the Queen took the blame out of the spotlight. But Mira frames this as a virtue ("used without being blamed"), whereas it is actually a feature of unaccountability.

  **(10) Tom: "Power Laundering"**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the strongest theoretical point in the debate. If power is exercised in the Monarch's name but she cannot be criticized, accountability is broken. The "clean hands" are not a safeguard; they are a cover.

  ---

  ### Overall Winner: Tom

  Mira defends the *mythology* of the constitution; Tom attacks the *mechanics*.

  Mira's argument collapses at Move 3. Once Tom introduces the German/Italian model (indirectly elected president), her defence of *heredity* evaporates. She spends the rest of the debate defending the *function* of a head of state (neutrality, arbitration), which Tom agrees is necessary, but he proves you can get that function without the hereditary form.

  Furthermore, on the specific issue of the Royal Prerogative (her PhD topic), she fails to defend the *risk* of the power existing. Tom correctly identifies that "reserve powers" held by an unaccountable actor are incompatible with modern democratic theory, regardless of how rarely they are used. The 2019 point (Move 10) seals it: if the office allows the executive to launder unlawful acts through an uncriticizable figure, it is an active detriment to accountability.

  Mira is arguing for **stability**; Tom is arguing for **legitimacy**. In a modern MA in Politics, legitimacy (source of power) trumps stability (outcome of power) unless the stability is demonstrably fragile without it—which Mira failed to prove, given the existence of stable republics.

  ---

  ### The Missing Distinction

  The reason you couldn't referee this is that they are conflating two different concepts of the Head of State. The distinction neither of them named is:

  **Neutrality vs. Immunity**

  *   **Mira argues for Neutrality:** She claims the Monarch is useful because they have no political agenda, no party, and no voters to please. This is a functional argument.
  *   **Tom argues against Immunity:** He claims the Monarch is dangerous because they cannot be criticized, voted out, or held legally accountable for the powers they technically hold. This is a normative argument.

  **The Clear-Up:**
  You can have **Neutrality without Immunity**.
  A President elected by a supermajority of Parliament (like in Germany) is neutral (they don't campaign, they represent the whole state) but they are *not* immune (they are a citizen, they can be impeached, their election is transparent).

  Mira keeps defending Neutrality ("they don't campaign," "they are trained"). Tom keeps attacking Immunity ("nobody can criticize them," "power is laundered").

  The UK system conflates the two: it claims the Monarch is neutral *because* they are immune (above politics). Tom's point is that being "above politics" actually means being "below accountability." If you separate the two, Mira's defence of the *function* survives, but her defence of the *hereditary monarchy* dies. You don't need a King to get a neutral arbiter; you just need a non-executive President with strict term limits and parliamentary election.

  **Summary for your notes:** Mira wins on the *necessity of a neutral arbiter*. Tom wins on the *sufficiency of the monarchy to provide it*. The hereditary element is the weak link that Tom successfully isolates and destroys.
