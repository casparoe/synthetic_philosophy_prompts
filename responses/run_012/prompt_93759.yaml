answer: |-
  Here is the machinery. It is built on five filters. Run the question through them in order. If a step gives a definitive Yes or No, stop there. If you get to the end without a definitive answer, it is a judgment call.

  ### The Procedure

  **Step 1: The Harm & Law Filter**
  *   **Question:** Does breaking this convention cause direct physical harm, significant financial loss to a specific individual, or violate a criminal statute with non-trivial enforcement?
  *   **Sufficient Answer:**
      *   **Yes (Harm/Statute):** You **must not** do it. (Exception: See Step 4).
      *   **No (No Harm/Technicality):** Proceed to Step 2.
  *   **Philosophy:** This establishes the floor. Conventions are not laws, but where they overlap with safety or codified law, the obligation shifts from etiquette to liability.
  *   **Judgment Call Alert:** "Significant financial loss" is subjective. "Non-trivial enforcement" requires local knowledge (e.g., is the law dead letter?).

  **Step 2: The Coordination Necessity**
  *   **Question:** Is this convention a solution to a repeated coordination problem? If you opt out, does the system glitch for everyone else, or does it merely annoy them?
  *   **Sufficient Answer:**
      *   **Yes (System Glitch):** You **must** follow it. (e.g., driving side of the road, queuing in a high-volume bottleneck).
      *   **No ( Mere Annoyance):** Proceed to Step 3.
  *   **Philosophy:** Conventions exist to solve coordination problems (we all drive on the right so we don't crash). If your deviation breaks the coordination, you are violating the Principle of Fair Play. You are taking the benefit of the system (order) while imposing the cost (chaos).
  *   **Judgment Call Alert:** Distinguishing between a "glitch" and an "annoyance" is often a matter of scale.

  **Step 3: The Semantic Load**
  *   **Question:** In this specific context, is the action a word? Does doing (or not doing) it transmit a specific message of respect, contempt, pity, or intimacy?
  *   **Sufficient Answer:**
      *   **Yes (It is a Message):** You **must** align your action with the intended message. If the message is "insult," you must not do it. If the message is "respect," you must.
      *   **No (It is Noise):** Proceed to Step 4.
  *   **Philosophy:** Rituals are language. If you speak a word you don't mean (e.g., tipping where it means "pity"), you are lying. If you refuse to speak a required word (e.g., bowing where it means "hello"), you are being rude. You are obligated not to insult your hosts unintentionally.
  *   **Judgment Call Alert:** Determining the "true" meaning of a gesture when locals disagree is the hardest part of this step.

  **Step 4: The Moral Veto**
  *   **Question:** Does following this convention require you to participate in or validate an injustice (discrimination, exploitation, degradation)?
  *   **Sufficient Answer:**
      *   **Yes (Complicity):** You are **forbidden** from following it. You may need to leave the situation.
      *   **No (Distasteful but Neutral):** Proceed to Step 5.
  *   **Philosophy:** Etiquette cannot override morality. If a convention requires you to treat a human being as less than human, the obligation dissolves. You are not obliged to be "polite" at the expense of being good.
  *   **Judgment Call Alert:** Distinguishing between "cultural difference I dislike" and "objective injustice" is entirely on you. The procedure cannot calculate this.

  **Step 5: The Integration Threshold**
  *   **Question:** Are you passing through, or are you becoming a neighbor? (Timeframe: Days/Weeks vs. Months/Years).
  *   **Sufficient Answer:**
      *   **Passing Through:** You are **permitted** to deviate if Steps 1-4 didn't stop you, provided you apologize for the ignorance.
      *   **Becoming a Neighbor:** You **must** adopt the convention.
  *   **Philosophy:** The obligation of Fair Play increases with tenure. A tourist consumes a service; a resident consumes a society. The longer you stay, the more you owe the system that sustains you.
  *   **Judgment Call Alert:** "Months" is vague. A digital nomad staying 3 months is different from a refugee staying 3 months.

  ***

  ### Running the Cases

  Here is the procedure applied to three of your reader scenarios.

  **Case 1: The Insulting Tip**
  *Scenario:* A reader is in a country where leaving money on the table is read as pity or an insult to the staff's dignity. The reader feels generous and wants to tip.
  *   **Step 1 (Harm/Law):** No physical harm. Not illegal. -> *Proceed.*
  *   **Step 2 (Coordination):** No. The service system does not collapse if you tip; the staff just gets offended. -> *Proceed.*
  *   **Step 3 (Semantic Load):** **Yes.** The prompt states the money is read as "pity" or "insult." The action is a word. The word is "You are beneath me."
  *   **Verdict:** **You must not tip.**
  *   **The Unpleasant Truth:** This is the case where the procedure constrains the reader's virtue. They *want* to be generous. The procedure tells them that their generosity is actually aggression. They must suppress the urge to tip to avoid insulting the worker. This will feel wrong to them (stiffing the worker), but the procedure says the obligation is to *not* insult.
  *   **Termination:** Step 3.

  **Case 2: The Jaywalking Paradox**
  *Scenario:* A reader is in a city where jaywalking is illegal but universally practiced by locals, even police.
  *   **Step 1 (Harm/Law):** It is illegal. However, enforcement is non-existent (per prompt). Harm is low if traffic is light. -> *Proceed (with caution).*
  *   **Step 2 (Coordination):** **Yes.** Traffic flow is a coordination problem. However, if *everyone* (locals/police) is jaywalking, the convention has shifted. The "coordination" is now "cross when there is a gap," not "cross at the light."
  *   **Step 3 (Semantic Load):** Low. It signals nothing other than "I am in a hurry."
  *   **Step 4 (Moral Veto):** No.
  *   **Step 5 (Integration):** If they are a tourist, they are at higher risk of being the "sacrificial lamb" (fined to make quota).
  *   **Verdict:** **Judgment Call (Leaning Yes).** While Step 1 says "Law," the reality of Step 2 (local coordination) overrides the written law. However, because they are outsiders (Step 5), they lack the "immunity" locals have.
  *   **Recommendation:** Do not jaywalk. Not because it's wrong, but because you lack the local cover. You are not obliged to follow the *law*, but you are obliged to follow the *risk assessment* of an outsider.
  *   **Termination:** Step 5 (with Step 1 override).

  **Case 3: The Distasteful Custom**
  *Scenario:* A reader is visiting a place where women are expected to remain silent in mixed company. The reader finds this genuinely wrong.
  *   **Step 1 (Harm/Law):** May be social law, not criminal. -> *Proceed.*
  *   **Step 2 (Coordination):** Yes, it maintains social order in that context. -> *Proceed.*
  *   **Step 3 (Semantic Load):** Yes, speaking signals defiance. -> *Proceed.*
  *   **Step 4 (Moral Veto):** **Yes.** The reader identifies this as an injustice (silencing based on gender). Following it validates the hierarchy.
  *   **Verdict:** **You are forbidden from following it.**
  *   **Obligation:** You are not obliged to follow the convention. You are obliged to either speak (and accept consequences) or **stay home**.
  *   **Termination:** Step 4.
  *   **Note:** The procedure does not guarantee safety. It only clears the moral obligation.

  ***

  ### Where the Procedure Misfires

  You need to print this disclaimer. The machinery jams in three specific conditions:

  1.  **The Long-Term Visitor:** Step 5 tries to catch this, but it's porous. Someone staying for 6 months on a visa is legally a tourist but socially a resident. The procedure will say "Permitted to deviate" (Tourist), but the neighbors will feel "Violation of Fair Play" (Resident). *Fix:* If the reader pays local taxes or rents a lease, treat them as a Neighbor regardless of visa status.
  2.  **The Affordability Trap:** If a convention requires spending money the reader doesn't have (e.g., a mandatory expensive gift exchange), Step 1 (Harm) doesn't catch it. The procedure might say "You Must," but the reader *can't*. *Fix:* Add a caveat to Step 2: "If the cost of coordination exceeds 5% of daily budget, the obligation dissolves into 'Explain and Apologize'."
  3.  **Contested Conventions:** If 50% of locals think Tipping is Polite and 50% think it's an Insult, Step 3 breaks. The procedure assumes a monolithic "Local Will." *Fix:* In cases of local disagreement, the obligation defaults to "Follow the lead of the specific individual you are interacting with," not the abstract culture.

  ### What The Procedure Cannot Decide

  Be honest with your readers. There are three things this checklist cannot compute:

  1.  **The Definition of "Harm":** Is emotional offense harm? Is economic pressure (tipping as wage subsidy) harm? The procedure treats these as Judgment Calls. You cannot outsource this to a flowchart.
  2.  **The Line Between Custom and Oppression:** Step 4 relies entirely on the reader's moral compass. If the reader thinks "Women should be silent" is a valid tradition, Step 4 returns "No." If they think it's abuse, it returns "Yes." The procedure cannot arbitrate moral truth; it can only enforce consistency.
  3.  **The "Guest Right" Ambiguity:** Philosophy argues both that a guest is sacred (must be pampered) and that a guest is subordinate (must not disturb). When these conflict, the procedure stops. Sometimes you must break a rule to be a good guest; sometimes you must break a guest-norm to be a good human.

  **Final Note for the Chapter:**
  Tell your readers that if they run this procedure and land on "Judgment Call," they have arrived at the actual work of travel. The anxiety they feel is not a bug; it is the friction of two worlds touching. If the procedure could solve it perfectly, they wouldn't be visiting a culture; they'd be visiting a theme park. Tell them to pick, own it, and apologize if they get it wrong. That is the only universal convention.
