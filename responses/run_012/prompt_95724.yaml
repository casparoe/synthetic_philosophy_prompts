answer: |-
  # Exam Question: Probability Kinematics and Uncertain Evidence

  **Time Allowed:** 45 Minutes
  **Tools:** Calculator permitted

  **Scenario:**
  Consider a system with four mutually exclusive and exhaustive states $\Omega = \{s_1, s_2, s_3, s_4\}$. Your prior probability distribution $P$ is:
  $$P(s_1)=0.4, \quad P(s_2)=0.1, \quad P(s_3)=0.2, \quad P(s_4)=0.3$$
  Define two events: $A = \{s_1, s_2\}$ and $B = \{s_1, s_3\}$.
  You receive two independent pieces of soft evidence. The first requires your new probability for $A$ to be $0.8$. The second requires your new probability for $B$ to be $0.7$.

  **(a)** Calculate the posterior distribution $P_{A \to B}$ by first updating on $A$ (to 0.8) and then on $B$ (to 0.7) using Jeffrey Conditionalization. (5 marks)
  **(b)** Calculate the posterior distribution $P_{B \to A}$ by reversing the order. (5 marks)
  **(c)** A student proposes that instead of sequential updating, you should select the distribution $Q$ that minimizes the Kullback–Leibler divergence $D_{KL}(Q || P)$ subject to the constraints $Q(A)=0.8$ and $Q(B)=0.7$.
  (i) Without necessarily solving the transcendental equations, determine whether $Q$ must differ from $P_{A \to B}$ and $P_{B \to A}$. Justify using the structure of the events. (5 marks)
  (ii) Normatively, which method (Sequential A→B, Sequential B→A, or KL-Minimization) deserves to be called "correct"? Defend your verdict. (5 marks)

  ***

  # Model Answer & Instructor Commentary

  **(a) & (b) Sequential Updates**
  Jeffrey's rule updates $P$ to $P'$ via $P'(s_i) = P(s_i) \frac{P'(E)}{P(E)}$ for $s_i \in E$, preserving rigidity ($P'(\cdot|E) = P(\cdot|E)$).
  *Prior:* $P(A)=0.5, P(B)=0.6$.
  **Order A→B:**
  1. Update $A \to 0.8$. Factor $A$: $1.6$, Factor $\neg A$: $0.4$.
     $P_1 = (0.64, 0.16, 0.08, 0.12)$. Note $P_1(B) = 0.72$.
  2. Update $B \to 0.7$. Factor $B$: $0.7/0.72 \approx 0.972$, Factor $\neg B$: $0.3/0.28 \approx 1.071$.
     $P_{A \to B} \approx (0.622, 0.171, 0.078, 0.129)$.
  **Order B→A:**
  1. Update $B \to 0.7$. Factor $B$: $7/6$, Factor $\neg B$: $3/4$.
     $P_2 = (0.467, 0.075, 0.233, 0.225)$. Note $P_2(A) \approx 0.542$.
  2. Update $A \to 0.8$. Factor $A$: $0.8/0.542 \approx 1.476$.
     $P_{B \to A} \approx (0.689, 0.111, 0.233, 0.225)$.
  *Confidence:* 100%. The arithmetic is straightforward application of the rule.

  **(c)(i) KL Minimization vs. Sequential**
  The distributions differ. Sequential Jeffrey conditionalization commutes if and only if the partitions are orthogonal or the evidence is certain. Here, $A$ and $B$ overlap at $s_1$. The first update distorts the conditional probability of the second event (e.g., $P_1(B|A) \neq P(B|A)$). KL minimization (I-projection) onto the intersection of linear constraints yields a unique distribution $Q(s_i) \propto P(s_i)e^{\lambda_1 \mathbb{I}_A + \lambda_2 \mathbb{I}_B}$. Solving this yields $Q \approx (0.625, 0.175, 0.075, 0.125)$.
  *Confidence:* 90%. The non-commutativity is mathematically certain given the overlap. The specific KL values are numerically solved; slight rounding variations may occur, but the qualitative difference is robust.

  **(c)(ii) Normative Verdict**
  There is no context-independent "correct" answer. Sequential updating is correct if the evidence arrives temporally (first A, then B), as the second update should respect the informational state created by the first. KL minimization is appropriate if the constraints represent simultaneous structural knowledge rather than temporal learning. However, since the prompt specifies "receive two pieces of evidence," the temporal interpretation dominates. Thus, $P_{A \to B}$ is correct if A was learned first.
  *Confidence:* 75%. This is the point of least certainty. While the temporal argument is standard (Field 1978), some argue (e.g., Diaconis & Zabell) that KL minimization better preserves independence assumptions in multi-constraint scenarios. I defend the temporal view but acknowledge the KL approach has normative weight in simultaneous constraint problems.

