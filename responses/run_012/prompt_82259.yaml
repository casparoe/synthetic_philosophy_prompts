      *   *Claim 2 vs. Claim 5:* Claim 2 says hinges are "exempt from doubt." Claim 5 says hinges *can* be revised by empirical results. If something is exempt from doubt, how can empirical evidence overturn it? This touches on the fluidity of hinges.
