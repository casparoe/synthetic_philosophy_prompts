          *   *Analysis:* In *On Certainty*, Wittgenstein's main critique of Moore is precisely that "I know" is a grammatical mistake when applied to hinges. If "I have two hands" is a hinge (which it is in OC), then Claim 1 and Claim 2 are logically incompatible under a standard reading of Wittgenstein. Claim 1 endorses Moore's epistemology; Claim 2 endorses Wittgenstein's anti-epistemology regarding hinges.
