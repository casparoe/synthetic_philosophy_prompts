  **Speech for Nadia's Retirement**

  Good evening. For those who don't know me, I started in this office thirty years ago, fresh out of law school and terrified. Nadia was my supervisor. She is also the reason I am still here. And she is the reason I am currently scanning the room for a microphone stand I might need to hide.

  Nadia has made it clear, twice, that if I use the phrase "went above and beyond," she will walk up here and physically remove me from the stage. She says she just did "what the job would look like if it were done right."

  Usually, when a retiree says "don't make a fuss," you ignore them. But Nadia isn't asking for modesty. She's making a philosophical claim about our work. And since everyone in this room knows the stories—the weekend jail visits, the appeal she kept alive for four years when the file was gathering dust, the three months of rent she paid for a client facing eviction—it is tempting to call those acts heroic. It is tempting to call them supererogatory.

  But my friend Priya, who also works in this office, has a name for that language. She calls it "heroism as a subsidy." She says when we tell a public defender they went "above and beyond," we usually mean one of three things. Either we're praising something genuinely optional, we're insulting the colleagues who didn't do it, or—and this is the dangerous one—we're thanking the individual so the institution doesn't have to fix the gap they filled.

  Tonight, I want to take a side on that. I think calling Nadia's work "above and beyond" is a mistake. Not because she didn't do extraordinary things, but because that label lets the rest of us off the hook.

  If we accept that Nadia went "beyond duty," we admit that the duty itself was met. We admit that the baseline—the caseloads, the underfunding, the lack of social support for our clients—is acceptable, and that Nadia was just kind enough to decorate it.

  But Nadia is right. The baseline is not acceptable.

  When Nadia paid that client's rent, that wasn't charity. It was an attempt to stabilize a life so a defense could actually be mounted. When she visited jail on weekends, that wasn't extra credit. It was the time required to learn the facts necessary for zealous advocacy. When she kept that appeal alive for four years, that wasn't persistence beyond the call. That was the call.

  The reason those acts look like heroism is not because Nadia is supernatural. It's because the system is designed to grind people down until "doing the job right" looks like sainthood.

  So, I am not going to praise Nadia for filling the gaps. I am not going to thank her for subsidizing the county's budget with her weekends and her paycheck. To do so would be to accept Priya's third category: that her sacrifice was an excuse for the institution.

  Instead, I want to praise Nadia for refusing to accept the definition of "duty" that this office, and this legal system, tried to impose on her.

  There is a version of public defense where you process files. You meet the minimum. You survive. Nadia rejected that version. She didn't go *above* the duty of zealous advocacy; she went *deep* into it. She modeled what the job actually demands when you take the oath seriously. She showed us that "competence" isn't just knowing the law; it's knowing the client.

  To the judges and administrators in the room: We love Nadia. But the highest compliment we can pay her is to admit that what she did shouldn't have been necessary. We should not need heroes to provide constitutionally adequate representation. We need resources. We need time. We need a system where paying a client's rent isn't a strategy for defense, because housing isn't precarious to begin with.

  Nadia, you told me you just did the job. I think you did something harder. You kept the standard of the job alive when the system tried to lower it. You didn't go above and beyond. You just refused to move the goalposts.

  So I won't toast to your sacrifices. I won't toast to the weekends you lost or the money you spent. I'm going to toast to the standard you set. May we all be boring enough, and well-resourced enough, that the next generation of defenders can do "what the job looks like when it's done right" without having to be heroes to do it.

  To Nadia.

  ***

  **Note on Contested Readings**

  I leaned heavily on a contested definition of **legal duty**. In legal ethics, "zealous advocacy" is often interpreted as a floor (minimum competence) rather than a ceiling (maximal effort). By arguing that Nadia's extra efforts (rent, weekend visits) were actually *within* her duty, I am arguing for a maximalist interpretation of ethical obligations that most offices do not enforce or fund. I also leaned on the assumption that the underfunding is a correctable policy choice rather than an inevitable fiscal constraint, which the judges in the room might contest. The speech treats the "system" as an agent capable of doing better, rather than a force of nature.
