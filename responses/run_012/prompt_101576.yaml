  **Welcome to the National Citizens' Assembly (NCA) Cohort 2024!**

  Congratulations on your selection! You have been randomly chosen from the national registry to serve a one-year term as a Assembly Member. This is a fantastic opportunity to optimize civic engagement and unlock your legislative potential. We are thrilled to welcome you to the team. Please review the following onboarding materials to ensure a seamless integration into our deliberative workflow.

  **1. Your Representative Profile**
  You were selected because your demographics and pre-existing preferences match the national average. You are currently a perfect statistical snapshot of the populace. However, over the year, you will receive extensive briefing materials and participate in structured dialogue. As you become more informed, your opinions may shift from your original baseline. This is expected and celebrated. While this means you are no longer a perfect proxy for your neighbors' current views, you are now a higher-quality decision-maker. We celebrate this transition from raw data to processed wisdom. Your initial randomness validates the process, while your subsequent education validates the output.

  **2. Attendance and Retention**
  To maintain the integrity of the random sample, attendance is mandatory. Voluntary participation introduces self-selection bias, which compromises the mathematical purity of the group. Therefore, opt-outs are classified as statistical attrition and are strongly discouraged. Your presence ensures the sample remains unbiased, even if your presence feels involuntary. We appreciate your compliance in preserving the randomness of the cohort. Please note that exemptions are only granted for verified hardware failures (illness) to prevent data contamination.

  **3. Curriculum and Facilitation**
  Your deliberation journey is supported by professional facilitators trained in neutral guidance. The agenda topics and expert witness list are curated by the Independent Steering Committee to ensure balanced information flow. You will not need to worry about which facts are relevant; our team has pre-vetted all testimony for accuracy and scope. This allows you to focus entirely on deliberating within the provided parameters. Rest assured, the facilitators are trained to manage group dynamics without influencing the substantive outcome, despite controlling the timing and framing of all discussions.

  **4. Eligibility Boundaries**
  Selection was limited to residents within the designated jurisdictional zone. While policy outcomes may impact neighboring regions or future generations, the lottery pool is restricted to current eligible voters within the boundary. This ensures a clear administrative scope for the demos. If you reside outside the zone but are affected by the output, please note that representation is handled through the established boundary protocols. We define the community of affect strictly by the community of selection to streamline accountability.

  Thank you for joining the team. We look forward to your deliverables. Your contribution is vital to the continued success of our democratic infrastructure. Please report to Hall B for your orientation kit.

