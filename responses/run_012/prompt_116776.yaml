  I'm a backend engineer, no real philosophy training beyond an undergrad ethics course I mostly slept through, and I fell into this after a coworker bet me I couldn't explain why anyone still takes the ontological argument seriously. What actually got me wasn't Anselm, it was finding out that a couple of computer scientists (Benzmüller and Woltzenlogel Paleo, I'm pretty sure) ran Gödel's modal version of the argument through automated theorem provers around 2013 -- LEO-II and Satallax for the theorems, Nitpick to check the axioms weren't flat-out contradictory, then Coq and Isabelle versions after that -- and it came back verified. I've read enough pop coverage to know there's supposed to be a catch, and I've also seen people say the axioms have some nasty side effect where every truth ends up being a necessary truth (modal collapse?). If I've garbled that, correct me -- I don't need a reading list, I need to actually understand the thing. For what it's worth I think the axioms are roughly: for every property exactly one of it or its negation counts as positive, anything a positive property entails is positive, being Godlike (having all the positive properties) is itself positive, and necessary existence is positive.

  So here's what I want: treat that episode -- the mechanized verification of Gödel's proof, plus whatever the provers turned up beyond just that the conclusion goes through -- as a case study in the parody objection, the old lost-island move where you say fine, same argument form, now prove me a perfect island. Map it properly. Who are the actual parties here (the people who wrote the proof down versus the people who ran it through machines, and what each of them was and wasn't claiming -- I gather Gödel never published it in his lifetime and reportedly didn't want people thinking he was secretly doing theology), what do the provers actually establish (validity of the conclusion given the axioms? consistency of the axioms? that the axioms are doing more work than advertised?), and then run the lens in both directions. Does the parody objection even land on this episode -- does mechanically verifying Gödel's argument show the argument form proves too much, or does the mechanization defuse the parody charge by relocating the defect somewhere else, like the positivity predicate being an unconstrained free variable you can fill in however you like, or the modal background doing all the real work? And what does the episode show back about the parody objection itself -- is it a genuine diagnostic or does it just change the subject? I want the honest account of where the objection goes quiet rather than getting forced onto the material, and the thing I suspect is true but nobody says out loud: that verifying a proof tells you nothing about whether the conclusion is true, and that the popular coverage on both sides is talking past each other about which question is even on the table. If the fit between the episode and the objection is mostly bad, say so and explain why.
