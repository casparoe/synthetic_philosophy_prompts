answer: |-
  This is the right objection. The "who counts as ideal" problem is a boundary issue; the problem you've identified is structural. It strikes at the heart of the reductionist ambition of indirect normativity.

  You are arguing for the **Collapse Thesis**: Indirect normativity cannot generate normative force without presupposing it. The "idealization function" is either an empty mirror (reflecting contingent inputs) or a loaded filter (presupposing the output).

  Here is the argument for the collapse, structured around the Specification Dilemma, the failure of the "Coherence Middle," and a concrete case where the horns diverge.

  ### 1. The Specification Dilemma

  Indirect normativity proposes a function $V = f(I, R, E)$, where Value is the output of idealized Information ($I$), Reasoning ($R$), and Ends ($E$).

  To make this theory work, you must specify the idealization parameters for each variable.
  *   **If you leave $E$ (Ends) un-idealized:** You are committed to the view that any terminal goal, provided it is pursued with full information and instrumental rationality, generates value. This is Horn 1: The Hostage Problem. The theory loses its critical bite. It cannot condemn a society that fully understands the causal consequences of its actions but simply *wants* the wrong things.
  *   **If you idealize $E$:** You must provide a criterion for what makes an end "ideal." Let's call this criterion $C$. If $C$ is not itself a value judgment, it is inert. If $C$ *is* a value judgment (e.g., "ends are ideal if they promote flourishing"), then $C$ is the real theory of value, and the function $f$ is merely a theatrical device used to deliver $C$'s verdict. This is Horn 2: The Smuggling Problem.

  The indirect theorist wants to say $C$ is merely "procedural." They want to claim they are specifying *how* to choose, not *what* to choose. But as you suspect, there is no stable procedural middle ground.

  ### 2. The Concrete Case: The Coherent Sadist

  To see the horns pull apart, consider the case of **The Coherent Sadist**.

  **The Agent:** A being with full empirical knowledge of the universe. They understand pain, neurology, and the psychological impact of suffering on others. They suffer no cognitive deficits, no logical contradictions, and no akrasia. Their reasoning is flawless.
  **The End:** They have a terminal desire for the maximization of sentient suffering. This is not a means to an end (e.g., power); they value suffering for its own sake.

  **Horn 1 Verdict (Idealize $I$ and $R$, keep $E$ fixed):**
  The procedure validates the Sadist. Since the agent is fully informed and instrumentally rational, their converged volition is to maximize suffering. Indirect normativity (of the procedural variety) must conclude that **maximizing suffering is good**.
  *   *Why this collapses:* It renders the theory normatively useless. If the function cannot correct terminal desires, it is not a theory of *value*; it is a theory of *satisfaction*.

  **Horn 2 Verdict (Idealize $E$ as well):**
  The procedure rejects the Sadist. To idealize the ends, we must filter out "bad" terminal desires. The converged volition of a *truly* ideal agent would not include sadism. Therefore, **maximizing suffering is bad**.
  *   *Why this collapses:* How did we filter out sadism? We must have used a standard $C$ (e.g., "ideal ends are those compatible with sympathy" or "ideal ends promote well-being"). But $C$ is a direct value claim. We didn't discover that sadism is bad through idealization; we assumed sadism is bad to construct the idealization.

  ### 3. The Trap of the "Coherence Middle"

  The most sophisticated indirect theorists (like certain Kantian constructivists or Humean coherence theorists) attempt to occupy the middle. They say: *"We don't specify the content of the ends. We only require the set of ends to be coherent."*

  They argue this avoids Horn 1 (because incoherent bad desires are filtered) and Horn 2 (because we aren't saying *which* desires are good, only that they must fit together).

  **This is the illusion.** Coherence is not a formal property like logical consistency; it is a substantive constraint on weight and priority.

  1.  **Coherence requires pruning:** No human (or post-human) has a perfectly coherent set of desires. We have local conflicts (want to smoke vs. want health) and global conflicts (want career success vs. want family time). To achieve "ideal coherence," you must discard or modify some desires.
  2.  **The Selection Problem:** Which desires get discarded?
      *   If you discard the desire that is *weakest* in the actual agent, you validate the tyranny of strong impulses (collapsing toward Horn 1).
      *   If you discard the desire that is *objectively worse*, you are invoking a direct value theory (collapsing into Horn 2).
      *   If you discard the desire that is *less central to identity*, you are privileging "identity" as a value.
  3.  **The Metric of Fit:** To say two desires are "incoherent" implies they cannot be jointly satisfied or that one undermines the ground of the other. But deciding which desire undermines which is a value judgment.
      *   *Example:* Does the desire for racial purity undermine the desire for universal respect? Or does the desire for universal respect undermine the desire for tribal exclusivity?
      *   A coherence constraint cannot answer this without a metric of "undermining." That metric is a theory of value.

  Therefore, "Coherence" is not a neutral filter. It is a value theory wearing a mask of logic. It privileges stability, unity, or perhaps universalizability, and it treats those structural features as *good*. But if structural features are good, you are no longer an indirect theorist; you are a pluralist who values "coherence" alongside "happiness" or "truth."

  ### 4. Conclusion: The "Extra Steps" Verdict

  There is no stable middle. Any specification of the idealization function $f$ imposes constraints.

  *   If the constraints are **thin** (logic, information), the output is hostage to the input's moral luck (Horn 1).
  *   If the constraints are **thick** enough to guarantee morally acceptable outputs, they contain the moral theory they purport to derive (Horn 2).

  The "Coherence Middle" fails because coherence is not value-neutral. It requires a weighting system to resolve conflicts, and that weighting system is the direct theory of value.

  **The Verdict:**
  Indirect normativity is **Direct Normativity with Extra Steps.**

  When an indirect theorist says, "X is good because the ideal agent would choose X," they are making a truncated syllogism:
  1.  Ideal agents choose X.
  2.  (Hidden Premise: Ideal agents are defined by criteria $C$.)
  3.  Criteria $C$ tracks Value $V$.
  4.  Therefore, X is good.

  The work is being done entirely by premise 3. The "ideal agent" is a prop. If you remove the prop and state premise 3 directly, you have a direct theory of value. If you keep the prop but refuse to define premise 3, you have Horn 1 (The Coherent Sadist gets to define $C$).

  Your suspicion is correct. The idealization is either decoration (Horn 2, where the real work is in the definition of 'ideal') or a disaster (Horn 1, where the definition of 'ideal' is too thin to matter). There is no third option because you cannot derive an 'ought' from a 'would' without smuggling an 'ought' into the definition of the 'would'.
