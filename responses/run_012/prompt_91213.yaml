          *   **Assessment:** "Fixed all that" is too strong. Kripke's "Outline of a Theory of Truth" (1975) allows a language to contain its own truth predicate using a partial logic (gaps). The Liar sentence is indeed ungrounded and lacks a truth value.
          *   **Nuance:** "The end of the paradox" is the contentious part. This ignores the "Revenge" problem.

      *   *Sentence 3:* "And the deep idea underneath is that truth is grounded, i.e. a true sentence is one that bottoms out in non-semantic facts, and this puts the correspondence theory of truth back on its feet, which is bad news for the deflationists who'd been trying to do away with it."
