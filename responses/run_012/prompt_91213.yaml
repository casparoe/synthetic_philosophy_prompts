answer: |-
  This is a great question. Your friend has given you a very standard "Intro to Philosophy of Language" elevator pitch. It captures the *spirit* of the historical movement from Tarski to Kripke, but it glosses over significant technical limitations and makes a philosophical leap at the end that most experts would reject.

  Here is a sentence-by-sentence breakdown of what a specialist in theories of truth would think, followed by a deeper dive into the "Revenge" problem and the Correspondence/Deflationism claim.

  ### Sentence 1
  > *"Tarski proved that no language can contain its own truth predicate, because if it did you could always construct the liar sentence, so truth has to be handled by a hierarchy of languages where each level only talks about the truth of the level below."*

  *   **The Specialist's Reaction:** **Nod along (with minor caveats).**
  *   **The Verdict:** This is historically and technically accurate enough for a summary. Alfred Tarski's "Undefinability Theorem" (1933) essentially shows that a formal language rich enough to do arithmetic cannot define its own truth predicate without becoming inconsistent (i.e., allowing contradictions). His proposed solution was indeed a hierarchy: Object Language, Meta-Language, Meta-Meta-Language, etc.
  *   **The Wince:** A logician might wince slightly at "no language." It's more precise to say "no sufficiently expressive, consistent classical language." But for a non-technical summary, your friend is right.

  ### Sentence 2
  > *"Kripke then fixed all that -- you don't need the hierarchy, you can have a single language that contains its own truth predicate, and in it the liar sentence just comes out neither true nor false, which is the end of the paradox."*

  *   **The Specialist's Reaction:** **Wince.**
  *   **The Verdict:** The first half is right; the second half ("the end of the paradox") is where the trouble starts.
  *   **The Detail:** Saul Kripke's 1975 paper *"Outline of a Theory of Truth"* is a landmark. He showed you can have a single language with its own truth predicate if you allow "truth value gaps." In Kripke's system, the Liar Sentence ("This sentence is false") is **ungrounded**. It doesn't connect to any facts about the world, so it fails to receive a truth value. It is neither true nor false.
  *   **The Problem:** Saying this is "the end of the paradox" is the optimistic spin. It solves the *Classic* Liar, but it invites the *Revenge* Liar (more on this below). Most experts do not consider the matter "fixed" in the sense of being settled; they consider Kripke's solution to be the best *starting point* for modern discussions, not the finish line.

  ### Sentence 3
  > *"And the deep idea underneath is that truth is grounded, i.e. a true sentence is one that bottoms out in non-semantic facts, and this puts the correspondence theory of truth back on its feet, which is bad news for the deflationists who'd been trying to do away with it."*

  *   **The Specialist's Reaction:** **This is wrong / Major Overreach.**
  *   **The Verdict:** This is the weakest part of your friend's summary. It conflates a technical semantic mechanism with a metaphysical conclusion that does not follow.
  *   **Why it's problematic:**
      1.  **Groundedness $\neq$ Correspondence:** Kripke's notion of "groundedness" is about semantic dependency (does this sentence's truth depend on other sentences, eventually hitting the world?). While this sounds like Correspondence Theory (truth depends on the world), Kripke's mathematical machinery is actually neutral on the metaphysics. You can use Kripke's fixed-point construction while believing truth is just a logical device (Deflationism).
      2.  **Deflationists love Kripke:** Prominent deflationists (like Hartry Field) have actually *used* Kripke's theory to save deflationism from the Liar Paradox. They argue that the truth predicate is just a device for disquotation, and Kripke shows how that device can handle self-reference without exploding. So, claiming this is "bad news for deflationists" is historically false.
      3.  **The "Fix" isn't a Proof:** Kripke provided a consistent model, not a proof that Correspondence is the *only* way to understand truth.

  ---

  ### The Big Question 1: Is "Neither True Nor False" really the end?

  **No.** This is the biggest thing your friend left out. In the industry, this is known as the **Revenge Problem**.

  Here is the nasty thing that grows back out of Kripke's solution:

  1.  In Kripke's system, the Liar Sentence ($L$) is **neither true nor false** (it has a "gap").
  2.  Consider a new sentence, the **Revenge Liar** ($R$): *"This sentence is either false or neither true nor false."*
  3.  Ask: Is $R$ true?
      *   If $R$ is **True**, then what it says is the case. It says it is "false or gappy." So it must be false or gappy. Contradiction.
      *   If $R$ is **False**, then what it says is not the case. It is *not* "false or gappy." So it must be True. Contradiction.
      *   If $R$ is **Gappy** (neither true nor false), then what it says *is* the case (since it claims to be gappy). If what it says is the case, it should be **True**. Contradiction.

  To solve the Revenge Liar, you often need to step outside Kripke's language to describe why the Liar is "gappy." But once you do that, you are effectively back to Tarski's hierarchy (a meta-language talking about the object language).

  So, when your friend says "the end of the paradox," a specialist would say: **"It solves the Classic Liar, but generates the Strengthened Liar, so we haven't escaped the need for some hierarchical distinctions after all."**

  ### The Big Question 2: Does this support Correspondence over Deflationism?

  **No.** Your friend is confusing **Semantics** with **Metaphysics**.

  *   **Deflationism** is the view that "is true" doesn't name a deep property of the universe; it's just a grammatical tool. (To say "'Snow is white' is true" is just to say "Snow is white".)
  *   **Correspondence** is the view that "is true" names a real relation between language and the world.

  Kripke's theory is a **formal semantic model**. It shows how to assign values to sentences without crashing the system.
  *   A **Correspondentist** can say: "Kripke shows how sentences correspond to facts, and the Liar fails to correspond."
  *   A **Deflationist** can say: "Kripke shows how the grammatical tool of 'truth' functions consistently, even with gaps."

  In fact, Kripke's theory is often seen as a victory for Deflationists because it shows you don't need a heavy-duty metaphysical theory of truth to handle the Liar; you just need to tweak the logic (allowing gaps). Your friend has the consensus exactly backward here.

  ### Summary: How much to trust your friend?

  *   **On the History (Tarski -> Kripke):** **High Trust.** He has the narrative arc right.
  *   **On the Technical Solution (Gaps/Fixed Points):** **Medium Trust.** He's right that Kripke allows gaps, but wrong that it "fixes" the problem permanently.
  *   **On the Philosophical Implications (Correspondence vs. Deflationism):** **Low Trust.** This is his own interpretation (or something he heard in a specific seminar) that contradicts the broader consensus in the field.

  **The Bottom Line:**
  Kripke didn't "solve" the Liar in a way that ended debate; he changed the rules of the game so we could play it without exploding. But the "Revenge" paradoxes show the problem is still alive, and his theory does not kill Deflationism. If you want to sound like you know what's going on, tell your friend: *"Kripke handles the Classic Liar with gaps, but doesn't the Strengthened Liar force us back toward a hierarchy anyway? And isn't Field's work showing that deflationists can use Kripkean fixed points?"*

  They will either be very impressed or very annoyed that you looked it up.
