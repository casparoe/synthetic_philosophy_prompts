prompt: |-
  My flatmate and I have been going round in circles about free will for about three weeks now — neither of us has studied any of this, we've just been watching videos and shouting in the kitchen. His line is that determinism means nobody could ever have done otherwise, and since "could have done otherwise" is just what being free means, nobody is free and nobody deserves credit or blame for anything. It's the first bit of that I keep tripping over, because I've realised I don't actually know what the phrase is claiming. When I said this morning that I could have had porridge instead of toast, was I saying that the entire history of the universe up to that moment was compatible with me having porridge? That there was porridge in the cupboard and nothing physically stopping me? That I'm the sort of person who sometimes picks porridge? That I hadn't yet made up my mind? Those feel like really different claims and his argument only seems to bite on one of them, but I can't work out which. Another mate reckons "could" here is only ever conditional — that it means you'd have done it if you'd wanted to — and says that's a cheat, though he can't say why. And a third one keeps bringing up some case where a bloke would have been forced to do the thing anyway by a meddling scientist, and says that shows you can be to blame even when you couldn't have done otherwise. I don't see why a scientist who never actually did anything matters, so if that's relevant, tell me how.

  What I want is a list of the precise things that sentence could be claiming, roughly from the boring ones to the big ones, with a verdict on each: which are true by definition, which are genuinely up for grabs, which are probably just false, and which one my flatmate needs to be the real meaning for his argument to land. I'd also like to know what the phrase is doing when people say it in ordinary life — when someone says "I could have said something" at a funeral, or "you could have told me", they're obviously not making a claim about the laws of physics, but I don't know what they are claiming instead, or whether that everyday use is the same thing the philosophers are on about. And please say something about the difference between being able to do a thing in general (I can drive) and being able to have done it on one particular occasion (I could have driven us home last night, drunk as I was) — one of them says that distinction is the whole crux and I don't follow him at all.

  One more thing thats been bugging me: someone in a video said that if determinism is false then your choice is just a random event, which is worse for freedom rather than better. I can't tell if that's a real argument or a cheap shot, and I'd like to know whether it changes which reading of "could have done otherwise" is actually worth wanting. No need to point me at books or papers, I won't read them — I just want the menu of meanings and your honest take on each, and maybe a line at the end on which reading I should adopt if I want to keep blaming my flatmate for the washing up. Could you write it in American English, please, I'm forwarding it to my cousin in Ohio.
