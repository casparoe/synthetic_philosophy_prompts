answer: |-
  Here is the breakdown you asked for, written in American English for your cousin.

  ### The Menu of Meanings: What "Could Have Done Otherwise" Actually Claims

  You are right that this phrase is doing a lot of heavy lifting. When you say, "I could have had porridge," you might mean any of the following five things. I've ordered them from the mundane to the metaphysical.

  **1. The Circumstantial Claim**
  *   **What it means:** There was porridge in the cupboard, I had a spoon, and no one was holding a gun to my head forcing me to eat toast.
  *   **Verdict:** **True by definition.** In almost every normal breakfast scenario, this is true. Determinism doesn't change this. Even if the universe is determined, the physical obstacles weren't there.
  *   **Does it save free will?** No. Your roommate agrees you weren't physically restrained. That's not what he's arguing about.

  **2. The Capacity Claim**
  *   **What it means:** I have the physical and mental ability to eat porridge. I am not paralyzed, and I know what porridge is.
  *   **Verdict:** **True.** You possess the general machinery to eat porridge.
  *   **Does it save free will?** No. A robot could have the capacity to choose A or B, but if its code determines it *must* choose A, it has capacity but no freedom.

  **3. The Conditional Claim (The "Cheat")**
  *   **What it means:** "I could have done otherwise" just means "If I had *wanted* to have porridge, I would have had porridge."
  *   **Verdict:** **Up for grabs.** This is the classic Compatibilist move (the idea that free will and determinism can coexist).
  *   **Why your friend calls it a cheat:** Because it sidesteps the real question. You want to know if you could have *wanted* the porridge. This definition says, "Never mind what you wanted; you're free as long as you got what you wanted." It defines freedom as doing what you desire, not choosing what to desire.

  **4. The Metaphysical Claim (The "Leeway" Claim)**
  *   **What it means:** Given the *exact* same state of the universe and the *exact* same laws of physics up to the moment of choice, I genuinely had the power to make a different choice happen. The future was not fixed.
  *   **Verdict:** **Probably False (if determinism is true).** This is the claim your roommate is banking on. If determinism is true, the past + laws of nature = exactly one future. Under this definition, you literally could not have done otherwise.
  *   **Does it save free will?** This is the definition your roommate *needs* for his argument to land. If "freedom" requires this specific meaning, and determinism is true, then he is right: you have no freedom.

  **5. The Sourcehood Claim**
  *   **What it means:** The choice originated from *me*. It wasn't injected into my brain by a scientist, a demon, or a compulsion. I am the source of the action.
  *   **Verdict:** **Genuinely up for grabs.** This is where the "meddling scientist" argument comes in (more on that below). Many philosophers think this matters more than #4.

  ***

  ### Ordinary Language vs. Philosophical Language

  When you are at a funeral and say, "I could have said something," or when you tell your roommate, "You could have told me," you are **not** making Claim #4 (The Metaphysical Claim).

  In ordinary life, "could" is a mix of Claim #1 (Circumstantial) and Claim #2 (Capacity). You mean: "I had the knowledge, the opportunity, and the physical ability to speak, and nothing external stopped me."

  The philosophical debate hijacks this word. Your roommate is insisting that unless Claim #4 is true, the ordinary meaning is an illusion. He is arguing that because the *physics* didn't allow a different outcome, the *social* claim ("you could have told me") is a lie. Most people find this intuitive but unhelpful. It changes the rules of the game mid-argument.

  ***

  ### General Ability vs. Specific Occasion

  Your other friend is right that this distinction matters, but here is why:

  *   **General Ability:** "I can drive." (I have a license, legs, and eyes).
  *   **Specific Occasion:** "I could have driven us home *last night*."

  Determinism attacks the **Specific Occasion**. Even if you have the general ability to drive, determinism says that at that *specific moment*, given your tiredness, the beer you drank, and the neural firing in your brain, only one outcome was physically possible: you took the Uber.

  The distinction is the crux because your roommate is arguing that **Specific Occasion** freedom is impossible under determinism. You are arguing that **General Ability** is all we ever meant by freedom anyway. If you only need General Ability to be responsible, determinism doesn't hurt you. If you need Specific Occasion freedom (Claim #4), determinism kills you.

  ***

  ### The "Randomness" Objection

  The video you watched made a real argument, not a cheap shot. This is often called the "Intelligibility" or "Luck" objection.

  Here is the logic:
  1.  If determinism is true, your choices are fixed by the past (no freedom).
  2.  If determinism is *false*, then some events are random (quantum indeterminacy, etc.).
  3.  If your choice is the result of a random event in your brain, it isn't *you* choosing; it's just noise.
  4.  Therefore, breaking determinism doesn't give you control; it just gives you chaos.

  **Does this change which reading of "could have done otherwise" is worth wanting?**
  Yes. It suggests that Claim #4 (Metaphysical Freedom) might be worthless even if it were true. If you "could have done otherwise" only because a quantum particle fired randomly in your head, you don't deserve credit for the toast. You got lucky. This pushes many philosophers toward Claim #5 (Sourcehood). They argue freedom isn't about having alternative possibilities; it's about the action flowing from your character and reasons, whether determined or not.

  ***

  ### The Meddling Scientist (Frankfurt Cases)

  This is the argument from your third mate. It is designed to break the link between "Could Have Done Otherwise" and "Deserves Blame."

  **The Setup:** A scientist wants you to eat toast. He implants a chip in your brain. If you are about to choose porridge, he will zap you and force you to choose toast. If you choose toast on your own, he does nothing.
  **The Result:** You choose toast on your own. The scientist never intervenes.

  **The Point:**
  *   **Could you have done otherwise?** No. If you had tried to pick porridge, the scientist would have stopped you. The outcome was guaranteed.
  *   **Are you to blame?** Intuitively, yes. The scientist didn't do anything. *You* chose the toast for *your* reasons.

  **Why it matters:** It suggests that responsibility depends on the **actual sequence** of events (did you choose it based on your own desires?), not the **alternative possibilities** (could you have done something else?). If this holds up, your roommate's main argument ("No alternative possibilities = no blame") collapses.

  ***

  ### The Verdict: Can You Blame Him for the Dishes?

  Here is my honest take on how to handle the kitchen standoff.

  Your roommate is arguing for **Incompatibilism**: The idea that moral responsibility requires Claim #4 (Metaphysical Freedom), and since determinism rules that out, responsibility is impossible.

  You should adopt a **Compatibilist** stance. Here is the line to use:

  > "I don't care about the laws of physics. I care about **reasons-responsiveness**. If I yell at you about the dishes, and you say, 'Oh, I didn't realize, I'll do them now,' then you are free enough for me. If I yell and you say, 'I literally cannot move my arms due to a neurological spasm,' then you aren't free. But if you just don't *want* to do them, that's a choice, and choices are where blame lives."

  **Which reading should you adopt?**
  Adopt **Claim #5 (Sourcehood)** mixed with the **Ordinary Language** usage.
  *   **True:** You are blameworthy if the action comes from your own desires and you would have acted differently if there were good reasons to (like me getting angry).
  *   **False:** The idea that you need the magical power to rewrite the past (Claim #4) to be held accountable.

  **Final Word for the Cousin:**
  Tell your roommate that if he truly believes nobody deserves blame for anything, he cannot be angry at *you* for shouting at him. His anger would just be a determined reaction, not a justified moral stance. If he wants to keep being mad about the toast, he has to admit that "could have done otherwise" means "could have acted on different reasons," not "could have defied the laws of physics." And if he admits that, he has to do the dishes.
