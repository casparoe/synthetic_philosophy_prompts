prompt: |-
  I'm reading a book that offers the following thumbnail of Leibniz's moral philosophy, and before I repeat any of it I'd like to know how much I can trust.

  'Leibniz is the great optimist of the tradition. He holds that this is the best of all possible worlds, so everything that happens — famines, wars, one's own suffering — belongs to a plan that could not be improved upon; there is, strictly speaking, nothing in the world that is genuinely bad, only apparent evils that contribute to the greater harmony. On the moral side, Leibniz is at bottom a divine command theorist: right and wrong are whatever God's will lays down, and since God in his wisdom chose to create this world, we can be confident that his will is good. The engine behind all of this is the principle of sufficient reason, which tells us that everything that happens has a reason that makes it necessary; on Leibniz's view, then, there are no free choices, and our sense of deliberating between alternatives is an illusion. Finally, Leibniz defines justice as the charity of the wise, which means that justice is simply benevolence — doing good to others — with no real room in it for punishment or for giving people their due.'

  I have a vague sense that the divine-command part is off — something about Leibniz insisting that the eternal truths, moral ones included, do not depend on God's will — but I don't trust my memory, and the rest sounds roughly like what I've heard elsewhere. I'm not looking for a reading list or citations; I just want to know what's right.

  Please answer as exactly five numbered points, each a sentence or two, with no introduction and no conclusion. The first should be your overall verdict on how fair the gloss is, including whether its broad picture of Leibniz survives the corrections you go on to make. Then take the gloss's four main claims in the order they appear — the best-possible-world claim, the divine-command claim, the no-free-will claim, and the justice-as-benevolence claim — giving one point to each, and for each say what a Leibniz scholar would accept, what they would wince at, and what is simply wrong.
