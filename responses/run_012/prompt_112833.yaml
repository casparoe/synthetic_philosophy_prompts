      *   Q&A format. (Check).

  *(Self-Correction during drafting)*: I need to make sure I don't write the replies *for* the user to read verbatim, but rather as a prep sheet they can internalize. However, the prompt asks to "Draft my Q&A prep sheet... each with a two-minute reply." So I will write the scripts but keep them natural.

  *(Crucial Pivot)*: The prompt asks me to say plainly if the thesis is confused.
  *Assessment:* The thesis is *not* confused, but the word "fiction" is a trap. In philosophy, "fiction" usually entails "not true." In science, TEs aim at truth. If the user says "It is fiction," the Argument View will say "Fiction doesn't yield knowledge." The user needs to clarify they mean "fictional *structure*" or "counterfactual narrative," not "falsehood." I will highlight this in the Viability Assessment.

