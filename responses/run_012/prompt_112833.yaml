          *   The Soft Spot (honest vulnerability).
      4.  **The "Hoped Nobody Asks" Question.**

  6.  **Drafting the Content (Mental Simulation):**
      *   *Argument View:* They will cite Norton. I need to make sure the user doesn't get bogged down in "Norton says X." Keep it about the *experience* of reasoning.
      *   *Fiction Claim:* The user says "It is a piece of fiction." Philosophers hate this because fiction implies non-referring. I need to nuance this in the advice. The reply should pivot to "speculative simulation."
      *   *Historian:* The example will likely be Galileo or Maxwell's Demon.
