  ### The Principle of Reciprocal Legitimacy

  Your tentative principle ("whether the success is being used as a claim to stand above other people") captures the *social* dimension of your ledger, but it fails to account for the *material* dimension. Your verdicts split not just on behavior, but on the **source** of the success and the **flow** of its benefits.

  The principle that precisely captures your ledger is the **Principle of Reciprocal Legitimacy**. It consists of three clauses:

  1.  **The Merit Shield:** Success earned through **contribution** (utility, skill, labor) grants immunity from "cutting down," even if accompanied by self-promotion, *provided* it does not assert moral superiority.
      *   *Work done by:* The Medical Classmate (Case 1) vs. The Inherited Classmate (Case 2).
  2.  **The Redemption Clause:** Success that is **unearned** (luck, inheritance) is tolerated *only if* the hierarchy is dissolved through **humility** or **redistribution** (charity). Without this, visibility is offensive.
      *   *Work done by:* Lottery Neighbor 2 (Case 5) vs. Lottery Neighbor 1 (Case 4) and Inherited Classmate (Case 2).
  3.  **The Moralizing Prohibition:** Success that is **earned** becomes vulnerable to "cutting down" if the holder frames it as proof of **inherent superiority** over others (moralizing the hierarchy).
      *   *Work done by:* Athlete 1 (Case 6), The Writer (Case 8), Returnee 1 (Case 10).

  **How this repairs your tentative principle:**
  Your principle focused on the *claim* ("standing above"). The repair adds the *warrant* for the claim.
  *   **Repair Location 1 (Source):** You cut down the Inherited Classmate not because his *tone* claims rank (it matches the Medical Classmate's), but because his *wealth* lacks a Merit Shield. Self-promotion is permissible only when backed by contribution.
  *   **Repair Location 2 (Redemption):** You celebrate the Philanthropist (Case 11) despite her "positioning herself above" because the Redistribution (funding the school) satisfies the Redemption Clause. Generosity neutralizes the sin of hierarchy.

