  ### Ledger Test: The Splits Explained

  *   **The Classmates (1 & 2):** Identical behavior (interview circuit), different verdicts.
      *   *Principle:* The Merit Shield. The medical device is a contribution; the inheritance is extraction. Self-promotion without contribution violates reciprocity.
  *   **The Athletes (6 & 7):** Identical outcome (dominance), different verdicts.
      *   *Principle:* The Moralizing Prohibition. Athlete 1 claims her win proves her rivals' moral failure ("wanted it less"). Athlete 2 attributes win to contingency ("lucky," "coaches").
  *   **The Philanthropist (11):** You note she "arguably does position herself above."
      *   *Principle:* The Redemption Clause. Material hierarchy is forgiven when converted into communal benefit. The debt to the town is paid, so the rank is legitimized.
  *   **The Colleague & Friend (3 & 9):** You feel envy but judge it wrong.
      *   *Principle:* These cases satisfy the Merit Shield and avoid the Moralizing Prohibition. Your internal envy is recognized as a failure of *your* reciprocity, not their behavior.

