      *   *The Retreat:* "Coherence is about representation." If so, it's trivial. Every preference structure can be represented *somehow* (just not by EU). The claim "Rationality requires EU" becomes "Rationality requires having a utility function," which is tautological if we define utility by choice. The content lies in the *axioms* (Independence, etc.).
      *   *Verdict:* If the defender says "Nothing would falsify this," it's dogma. If they admit a non-pumpable incoherence would falsify it, they must confront the Foresight objection.

