prompt: |-
  ok, I'm building my proseminar around the ontological argument and I keep getting hung up on the opening of the Proslogion, right before the famous proof gets going.

  Here's the line that's bugging me, from the Deane translation of chapter 1: "The believer does not seek to understand, that he may believe, but he believes that he may understand: for unless he believed he would not understand."

  Fine, I get the fides quaerens intellectum slogan. But a page later he's praying "Lord, if you are not here, where shall I seek you, being absent? But if you are everywhere, why do I not see you present?" — and then in ch. 2 he produces a definition, "that than which nothing greater can be conceived," and runs an argument off it. And in ch. 4 he's bothered about how the fool could have said in his heart what he cannot conceive. So who is the proof actually addressed to?

  What I want from you: is that "unless he believed he would not understand" line a claim about psychology, about the will, about grace, or just monastic throat-clearing we should read past? More importantly, does it constrain the argument that follows? Because Anselm clearly wants the fool refuted, but on his own account the fool can't understand the terms, and that looks like a straight contradiction to me. I suspect it isn't one, but I can't say exactly why not.

  No reading lists, I don't need cites, just walk me through it — 500-700 words is plenty. If there's a standard move here that I'm missing, tell me what it is and whether you actually think it works or whether it just papers over the problem. Also, briefly at the end: does the modal reconstruction of the argument (possible worlds, necessary being, that whole apparatus) make this tension easier or harder? My instinct is harder, since the devotional frame just drops out, but I'd like to hear you say it. And definately tell me if I'm just misreading the passage, that's a real possibility.
