      *   **Constraints:** 500-700 words. No reading lists/citations. Walk through the logic. Identify the "standard move" and evaluate it. Address the modal reconstruction issue at the end.
      *   **Tone:** Analytical, direct, helpful for a proseminar student.

  2.  **Deconstruct the Problem:**
      *   *The Tension:* Anselm says faith precedes understanding (Ch 1). But the Ontological Argument (Ch 2) seems to rely on pure reason accessible to the "fool" (Psalm 14:1, "The fool says in his heart there is no God"). If faith is required for understanding, how can the fool understand the proof?
      *   *The "Standard Move":* The distinction between *believing in order to understand* (the believer's journey) vs. *the logical coherence of the concept itself* (which even the fool grasps verbally/mentally). The argument isn't meant to *generate* faith ex nihilo, but to show the rationality of what is already believed, or to show the fool's inconsistency.
