answer: |-
  # NYĀYA PROVENANCE VETTING PROTOCOL (NPVP)

  **OBJECTIVE:** Determine if an object's history is warranted. Do not presume truth; presume doubt until defects are ruled out.

  ### 1. MAP THE FOUR GROUNDS
  Classify every piece of evidence into one of four distinct buckets. Do not mix them.
  *   **Direct Observation:** Physical exam, material analysis, tool marks. (*Perception*)
  *   **Deduction:** Logical consequences of dates, locations, ownership chains. (*Inference*)
  *   **Analogy:** Resemblance to objects with secure histories. (*Comparison*)
  *   **Records/Witnesses:** Deeds, letters, oral history, stock books. (*Testimony*)

  ### 2. STRESS TEST FOR DEFECTS
  Scan each Ground for these five failure modes. If found, the Ground is void.
  *   **Equivocal:** The evidence fits both the claim and its opposite (e.g., a style common to both legit and fake workshops).
  *   **Contradictory:** The evidence proves the opposite of the claim (e.g., material post-dates claimed origin).
  *   **Circular:** The evidence assumes the claim is true (e.g., "It is authentic because the label says authentic").
  *   **Unproven:** The evidence itself lacks verification (e.g., a deed from a known forger).
  *   **Overturned:** A stronger Ground contradicts this one (e.g., Science overrides Paperwork).

  **Special Check for Records/Witnesses:**
  *   Did the source *know* the fact firsthand?
  *   Was the source motivated to report accurately (no gain from deceit)?

  ### 3. FORMULATE THE FIVE-STEP ARGUMENT
  Before acquisition, write the claim in this exact structure. **Step 3 is mandatory.**
  1.  **Claim:** The object originated [X] at [Time] via [Path].
  2.  **Evidence:** Because [cite specific Ground from Step 1].
  3.  **Rule + Example:** Wherever [Evidence] exists, [Claim] is true; as seen in [Secure Parallel Object].
  4.  **Application:** This object matches that parallel.
  5.  **Conclusion:** Therefore, the claim holds.

  ### 4. RENDER VERDICT
  *   **WARRANTED:** No defects found. All Grounds align. (Proceed to Committee).
  *   **UNWARRANTED:** Defect found. Grounds contradict. (Reject).
  *   **DOUBT:** Evidence exists but conditions are incomplete. (Pause).
      *   *Requirement:* You must state exactly what evidence would settle the doubt.

  ***

  ## CASE RUNS (Director's Review)

  **1. The Dealer's Stock Book (Clean Chain)**
  *   **Grounds:** Testimony (Book).
  *   **Defect Check:** *Unproven.* The book is the sole source; its own authenticity is assumed.
  *   **5-Step Fail:** Step 3 (Example) lacks a parallel outside the dealer's own inventory.
  *   **Verdict:** **DOUBT.**
  *   **Settler:** Independent corroboration of one transaction in the book.

  **2. The Family Recollection (1940s)**
  *   **Grounds:** Testimony (Oral).
  *   **Defect Check:** *Equivocal.* Memory degrades; motivation to protect family reputation unknown. Did the speaker *know* or *believe*?
  *   **Verdict:** **DOUBT.**
  *   **Settler:** Documentary proof of ownership during the stated period.

  **3. Material vs. Paperwork (Conflict)**
  *   **Grounds:** Direct Observation (Isotopes) vs. Testimony (Export License).
  *   **Defect Check:** *Contradictory.* Material proves recent extraction; Paper claims pre-1970.
  *   **Resolution:** Direct Observation *Overturns* Testimony.
  *   **Verdict:** **UNWARRANTED.** (Reject).
  *   **Note:** This is the case against the museum. The paperwork is *bādhita* (overturned).

  ***

  ## LIMITS & HUMAN JUDGMENT

  **Where the Protocol Stops:**
  1.  **Ethics vs. Truth:** Nyāya determines *what is known*. It cannot determine *what we owe*. A claim may be **WARRANTED** (we know they stole it legally) but ethically untenable. **Human Judgment Required.**
  2.  **The Unique Object:** Step 3 (Example) requires a parallel. For unique items, no true analogue exists. **Human Judgment Required** to weigh similarity.
  3.  **Intent:** Nyāya tests truth conditions, not moral intent. It detects lies, not structural injustice.

  **Where This Translation Misfires:**
  *   **The "Example" Step:** In Western art history, uniqueness is valued; in Nyāya, universals are key. Forcing a "parallel case" may encourage false equivalencies among researchers.
  *   **Static Reality:** Nyāya assumes a stable reality to be known. Provenance is often a history of concealment and active deception, not just ignorance.
  *   **Burden of Proof:** Nyāya removes the presumption of truth. Our legal framework often presumes legitimacy until proven otherwise. This protocol shifts the burden to the seller, which may cause legal friction.
  *   **No "Probability":** Nyāya seeks certainty or doubt. It does not handle "more likely than not." Researchers may struggle to categorize high-probability scenarios as **DOUBT**.

  **Final Directive:** Use this to clear the epistemic fog. Once the fog is clear, use your conscience to decide if we should walk through it.
