answer: |-
  **Question 1**
  You argue that the impartial spectator is the internalized voice of our actual audience, not an idealized judge. But Smith also writes about the "man within the breast" who examines our conduct. If the spectator is just the crowd inside our head, what work is left for the man within to do? Are they distinct functions, or simply the same mechanism described from different angles?

  **Follow-up:** If she responds that they are the same mechanism described differently, press with: "If they are the same, doesn't that mean when the crowd is wrong, the man within is wrong too? Where does the resource for resistance come from if the judge and the crowd are identical?"

  **Question 2**
  If our conscience is built from the standards of the people around us, how do we ever find the ground to criticize those standards? What corrects the community if the tool we use to judge is made by the community itself?

  **Follow-up:** If she appeals to comparing communities or looking at long-term consequences, press with: "But to say one community or consequence is 'better' than another, don't you need a standard outside both? Otherwise, you're just preferring one crowd over another."

  **Question 3**
  Smith begins with sympathy, which is about sharing feelings. But you say the spectator tells us what we *ought* to feel. How does a mechanism based on matching feelings generate a rule that overrides those very feelings?

  **Follow-up:** If she says authority comes from stability or mutual acceptability, press with: "If stability is the test, doesn't that make entrenched bias look like moral truth? How do we distinguish a stable injustice from a stable norm?"

  **Question 4**
  You use the online crowd to illustrate the "counterfeit spectator." Is this a new kind of moral failure, or just the same old problem of bad company, only louder?

  **Follow-up:** If she says it's a difference in degree that becomes a difference in kind, press with: "If it's just a degree, why give it a special name? Does calling it 'counterfeit' imply the real spectator is safe from this, when you've admitted it's always social?"

  **Question 5**
  You describe the spectator as a "second-personal demand," suggesting morality is about being answerable to others. Does this mean morality is essentially relational, rather than about getting something right independently of them?

  **Follow-up:** If she agrees that morality is purely relational, press with: "What happens to the person who is answerable only to themselves because their community has abandoned them? Do they lose moral standing?"

  **Question 6**
  The traditional reading says we strive to be impartial. You say we strive to be intelligible to our neighbors. Does this make morality too conservative? How do reformers exist if the engine of morality is social approval?

  **Follow-up:** If she says reformers appeal to a different subset of the community, press with: "But to choose that subset, don't you need the very moral wisdom you're trying to build? Isn't that circular?"

  **Question 7**
  If the spectator is socialized, does that mean our guilt is just anticipated shame? Is there any difference between feeling bad because we broke a rule and feeling bad because we might be caught?

  **Follow-up:** If she says guilt involves accepting the judgment as valid, press with: "But if the validity comes from the audience, and the audience is mistaken, isn't guilt just internalized error? How do we tell the difference?"

  **Question 8**
  If the spectator is drawn from our actual audience, why keep the word "impartial" at all? Does any idealization remain, or is the term purely aspirational in a way we can never actually achieve?

  **Follow-up:** If she says it's aspirational but grounded, press with: "If it's grounded in actual audiences, isn't the aspiration limited by what those audiences can conceive? Can we aspire to what we cannot imagine?"

  **Question 9**
  What evidence would convince you that Smith actually did intend the spectator to be an idealized, transcendent judge rather than a socialized voice? Is there a textual or philosophical point that would force you to abandon your reading?

  **Question 10**
  Can you name a specific situation where your reading tells a person to feel differently than the ideal-observer reading would? I'm looking for a case where the verdict on the emotion itself changes, not just the action.
