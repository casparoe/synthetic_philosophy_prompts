  Here's how it works. Step one: We vote on values. What do we want? 'More people at dances.' 'Cleaner bathrooms.' That part is normal democracy. You vote on the goal.
  Step two: We bet on beliefs. Instead of arguing in meetings, we open a market. You get 100 points. You bet those points on whether a specific plan will actually hit the goal. If you think 'Live DJ' increases dance attendance, you bet on it. If you think it's a waste, you bet against it.
  At the end of the year, we check the data. If you were right, you get points. If you were wrong, you lose them. It's not real money, it's just bragging rights. But because everyone wants to win, you have a reason to bet what you *actually* think works, not what sounds nice.
  If the market says a plan will work, we do it.

  Now, here's the part where I'm supposed to sell you on why this is perfect. I'm not. It's not perfect.
  I can't promise the dances will be packed. The market might tell us everyone hates dances. I have to be honest about that.
  Also, this only works if we agree to follow the bets. Even if the market says something you hate. If we ignore the results when we disagree, the whole system breaks.
  And yes, metrics can be gamed. If we bet on 'attendance,' someone buys pizza. That's why I can't do this alone. I need you watching the metrics, calling out the gaming, and participating in the market.

  My opponent is going to tell you this is a popularity contest for kids who are good at math. She'll say it's too complicated. But you don't need calculus to know the cafeteria pizza is cold. You know this school better than the teachers do. This system lets you prove it.

