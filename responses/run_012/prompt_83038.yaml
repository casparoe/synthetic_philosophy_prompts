prompt: |-
  I'm in a historiography seminar that's basically turned into a two-person war and I need help drafting the peace treaty. On one side is a friend who works on sixteenth-century tax records and thinks the whole constructivist business is sophistry; his line is Ranke's, that the historian's job is just to say "wie es eigentlich gewesen", and that when two historians with the same archive disagree, one of them has screwed up. On the other side is someone who's read Carr's What Is History? and White's Metahistory and come away convinced that a fact only becomes a historical fact once a historian picks it out and slots it into a story, so the objectivity the first guy wants is a fantasy of a view from nowhere. They've been at it all term and honestly I think they agree more than they realise, and half the fight is about words. What I want from you is the joint statement they could both actually put their names to. Lead with a numbered list of agreed claims -- about what sources and archives can and can't settle, about the difference between the past and a piece of history writing, about whether selection and judgments of significance are avoidable, about what each of them even means by "objective". Then a disagreements section, formatted as a table with one row per disagreement: the claim at issue, the objectivist's own wording of his side, the constructivist's own wording of hers, the crux, the shared case or argument both agree bears on it, and each side's prediction written down in advance. I don't want summaries that both of them would disown as straw men, and I don't want formulations so hedged they're vacuous.

  Two things to build in. First, give them a live test case rather than staying abstract: whether something like the Renaissance or the Industrial Revolution is a real object historians discovered or a lumping-together they invented for their own convenience, and the older puzzle that nobody in 1618 could have called the war that started that year the Thirty Years War, since nobody yet knew it would run that long -- does that show even the most sober factual description is only available in hindsight, and if so what does it do to Ranke's aspiration? Second, if any part of their dispute is purely verbal -- two different senses of "fact", or of "objective", or of "inevitable" -- say which part, and don't pad the document to make the disagreement look bigger than it is.

  One more thing, and I'd rather you be blunt about it: if this collaboration framing is a bad fit here, or if the position I've attributed to either of them is a caricature that no serious historian actually holds, tell me that straight instead of producing the document anyway. I suspect alot of it is verbal but I might be wrong, and I'd like the response to say so if so rather than humouring me. Same goes if some of the claims I've asked you to write neutrally just can't be written neutrally -- say which, and why.
