prompt: |-
  I run a monthly discussion night at my local pub, mostly people with no science background past school (I'm one of them), and next month I'm the one presenting on why biologists argue about whether a trait is an adaptation or just a byproduct of something else. You're a philosopher of biology who's spent years teaching this to non-specialists. Before you give me a plan, brainstorm for a minute: what are the candidate examples, what does each one actually buy you, and what does the whole lesson depend on? Then give me the plan.

  I need the order the ideas have to come in and why each one needs the one before it (what breaks if I swap them), plus one example to carry the whole 45 minutes on the whiteboard, with what that example has to have and has to lack. My instinct is to start with the church in Venice, the triangles between the arches, but I half remember someone telling me those arent even spandrels but pendentives, so maybe thats a trap. I also thought of male nipples, but everyone's heard that one and I think they'd walk out thinking a spandrel is just anything useless. What I actually like is my dog's floppy ears — I read they came along for the ride when we bred dogs for tameness, rather than anybody selecting for floppy ears as such. Is that a good carrier, or does it teach the wrong thing since the ears do sort of have a use now?

  Then the misconceptions, in the order they'll actually show up, and exactly where in the sequence I should head each one off. My guesses: that byproduct means no function so there's nothing to explain; that the whole critique is just Gould saying natural selection doesn't matter much; and that once you call something a byproduct you never have to test anything. Also tell me what I should just openly say we're skipping at this level and why. Last thing: one question I can ask at the end that would show me whether they got it, rather than whether they can repeat me back.
