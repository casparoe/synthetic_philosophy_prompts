answer: |-
  **I. Derivational Constraints**

  1.  **Classical Logic Preservation:** The treatment must specify whether classical logic (specifically reductio ad absurdum and De Morgan's laws) is retained. If retained, the contradiction derived in the paradox must be blocked elsewhere.
      *   *Consideration:* The derivation is valid in classical modal logic; rejecting the conclusion requires rejecting a premise or a rule.
      *   *Status:* Non-negotiable for Realists; Preference of Anti-Realists (who may adopt intuitionistic logic).
  2.  **Factivity of Knowledge:** The treatment must accept that knowledge implies truth ($Kp \to p$).
      *   *Consideration:* Denying factivity destroys the concept of knowledge, making the paradox vanish only by changing the subject.
      *   *Status:* Non-negotiable.
  3.  **Distribution over Conjunction:** The treatment must accept that knowing a conjunction entails knowing each conjunct ($K(p \land q) \to Kp \land Kq$).
      *   *Consideration:* This is required to move from knowing the unknown truth to knowing the truth and knowing it is unknown, generating the contradiction.
      *   *Status:* Non-negotiable (see Demand 1).
  4.  **Modal Coherence:** The treatment must maintain standard interactions between possibility and knowledge (e.g., if something is known, it is possible).
      *   *Consideration:* The paradox relies on the move from "it is known" to "it is possible that it is known."
      *   *Status:* Non-negotiable.
  5.  **Existence of Unknown Truths:** The treatment must acknowledge the contingency that there are truths that are not currently known.
      *   *Consideration:* If all truths are already known, the paradox does not get off the ground, but this contradicts obvious reality.
      *   *Status:* Non-negotiable.

  **II. Dialectical Constraints**

  6.  **Non-Omniscience:** The treatment must avoid the conclusion that all truths are actually known.
      *   *Consideration:* The Anti-Realist proposes knowability to avoid Realism, not to assert implausible omniscience.
      *   *Status:* Preference of Anti-Realists (Realists accept omniscience is false, hence reject Knowability).
  7.  **Substantivity of Knowability:** The Knowability Principle must not be restricted so narrowly that it becomes trivial (e.g., "all known truths are knowable").
      *   *Consideration:* A trivial principle cannot support the Anti-Realist identification of truth with verifiability.
      *   *Status:* Preference of Anti-Realists.
  8.  **Non-Ad-Hoc Restriction:** Any restriction on the Knowability Principle must be motivated by independent philosophical grounds, not merely to block the derivation.
      *   *Consideration:* A restriction invented solely to solve the paradox lacks theoretical virtue.
      *   *Status:* Preference of Anti-Realists.
  9.  **Distinction Preservation:** The treatment must preserve a meaningful distinction between Realism (truth can outstrip knowledge) and Anti-Realism (truth is constrained by knowledge).
      *   *Consideration:* If the solution makes truth entirely independent of knowledge, Anti-Realism collapses into Realism.
      *   *Status:* Preference of Anti-Realists.
  10. **Stability:** The solution must not generate new paradoxes of equal severity immediately.
      *   *Consideration:* A solution that solves Fitch but creates a new logical crisis is inadequate.
      *   *Status:* Non-negotiable.

  **III. The Four Further Demands**

  11. **Conjunction Distribution:** The distribution of knowledge over conjunction is to be treated as a logical truth about knowledge, not an idealization. The reason so few treatments deny it is that the price of denying it is high: it cripples the logic of knowledge and epistemic closure, making the cost of saving the Knowability Principle disproportionate.
      *   *Status:* Non-negotiable.
  12. **Certification of Unknowables:** An adequate account must be able to certify some particular contingent, non-logical truth as unknowable (specifically, the conjunction of a truth and its unknown status). This certification counts as a cost, not a virtue, because the Anti-Realist's initial motivation was that *all* truths are knowable.
      *   *Status:* Preference of Anti-Realists (to minimize the scope of this cost).
  13. **Reading of "Knowable":** The reading must be fixed as knowledge available to some possible being at some possible world, not merely inquirers like us. Under the "inquirers like us" reading, the principle is empirically false (some truths are too complex for humans); under the "possible being" reading, it remains substantive and modal, preserving the Anti-Realist's metaphysical claim.
      *   *Status:* Preference of Anti-Realists.
  14. **Self-Referential Sentence:** The self-referential cousin (the Knower Sentence) is a separate problem that may legitimately be set aside. The grounds are that Fitch's paradox arises from the interaction of truth, knowledge, and modal operators on *contingent* propositions, whereas the Knower Sentence arises from self-reference and diagonalization; a solution to one need not solve the other.
      *   *Status:* Non-negotiable (methodological separation).
  15. **The Eliminating Requirement:** The single requirement that eliminates the most otherwise popular treatments is **Substantivity of Knowability (Item 7)**. Most popular treatments (typing strategies, restrictions to basic truths, temporal restrictions) save the derivation by restricting the Knowability Principle to a subset of truths. However, these restrictions often render the principle too weak to support the Anti-Realist's core thesis that truth is essentially epistemic. If the principle applies only to "simple" or "basic" truths, it concedes that complex truths may be verification-transcendent, which collapses the Anti-Realist position into a form of Realism. Thus, demanding the principle remain both unrestricted and non-omniscient eliminates nearly all restriction-based solutions.
      *   *Status:* Preference of Anti-Realists.

  **Incompatibility Note**

  The central incompatibility lies between **Non-Omniscience (Item 6)** and **Substantivity of Knowability (Item 7)** given the **Derivational Constraints (Items 1–5)**. If one maintains classical logic, factivity, and conjunction distribution, one cannot hold that all truths are knowable without concluding all truths are known. To avoid omniscience, one must restrict the Knowability Principle. However, if the restriction is significant enough to block the paradox, it typically renders the principle trivial or too weak to distinguish Anti-Realism from Realism. **The Anti-Realist camp must give way.** They must either accept a logical revision (rejecting Item 1), which is costly, or accept that the Knowability Principle is restricted in a way that concedes some truths are not knowable (violating their original intent), or accept that the principle is less substantive than desired. The Realist camp faces no such tension, as they simply deny the Knowability Principle from the outset.
