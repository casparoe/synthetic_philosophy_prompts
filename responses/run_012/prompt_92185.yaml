      *   *Du Bois (paraphrased):* Art made by marginalized people inevitably carries a political weight/message because their existence is political. It must advocate for truth/justice (propaganda in the sense of spreading a doctrine).
      *   *Nadia:* Du Bois valued beauty too. If "propaganda" is the only metric, art becomes indistinguishable from advertising (billboard vs. mural). Beauty matters independently of message.
      *   *The Mural:* Commemorates a rent strike (political history). Funded by civic narrative grant (political requirement). Artist wants viewers to *see*, not be *told* (aesthetic/experiential focus).
      *   *The Goal:* Reconcile these. Show how the mural avoids being mere propaganda (billboard) while still fulfilling the civic narrative requirement, using beauty/perception as the differentiator.

  3.  **Drafting Strategy:**
