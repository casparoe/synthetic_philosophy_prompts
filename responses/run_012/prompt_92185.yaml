      Good morning. Neighbors, family, friends. We are gathered before a wall. Usually, walls tell us where we cannot go. Today, this wall tells us where we have been. It commemorates the neighbors who stood on this exact spot in the 1930s and refused to pay rent for homes that treated them as less than human. They organized. They held the line. That is the documented narrative. That is the history we are funded to remember.

      But remembering raises a difficult question. There is a longstanding debate about whether art that serves a cause can still be art. Some argue that when work is made to advance a truth, it becomes propaganda. It becomes a tool. My friend Nadia challenged me on this. She pointed out that even the fiercest advocates for political art refused to give up beauty. She asked: if the only difference between a mural and a billboard is whose message you like, then what are we doing here?

      That is a sharp question. If this wall is just a command to agree with the past, it is no different than an advertisement commanding you to buy a product. Both are transactions. Both demand you look, agree, and move on.

      But look at what the artist has actually done. She did not paint a slogan. She did not paint a lecture. She painted light hitting brick. She painted faces that look tired but unbroken. She asked that we not read a plaque, but simply see the street. This is where the difference lies. Propaganda seeks to close your mind around a single idea. It wants your obedience. Art seeks to open your eyes to a complex reality. It wants your witness.

      The city grant requires this work to advance a civic narrative. We fulfill that requirement not by reading a definition of resilience, but by creating a space where resilience can be felt. The narrative is not in the text; it is in the texture. Beauty is not merely decoration here. It is the mechanism of engagement. It is the reason you will stop walking. It is the reason a stranger might pause and ask, who were these people?

      Du Bois argued that art must fight for justice. But he knew that a fight cannot be won without humanity. If we sacrifice beauty for message, we lose the very humanity we are trying to defend. This mural refuses that sacrifice. It does not tell you what to think about the rent strike. It shows you the weight of it.

      So, the difference is usable. A billboard tells you what to want. This mural reminds you of what you value. One demands your consumption. The other invites your contemplation. Propaganda ends the conversation with an answer. This mural begins a conversation with an image.

      Please, do not look for instructions. Look for the neighbors. In seeing them, you become part of the narrative. You become the resilience.

      Thank you.

