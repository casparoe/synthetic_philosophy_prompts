      *   Commissioners: The narrative is advanced by the seeing, not the reading.
      *   End: Look at the wall.

  7.  **Writing the Speech (incorporating the argument):**
      (Self-Correction during drafting): Make sure I don't sound too academic. It's a street ceremony. Keep the language accessible but sharp. Ensure the distinction between billboard and mural is clear.

      *Drafting content:*
      Good morning. We are here for a wall. But walls usually divide us. Today, this one binds us to the people who stood here in the 1930s. They refused to pay rent for homes that denied them dignity. That is the history.

      But there is a question about how we remember. There is an old idea that art made for a cause is merely a tool. That if it serves a purpose, it loses its soul. My friend Nadia argues that even the fiercest advocates refused to sacrifice beauty. She is right. If we ignore beauty, this mural is no different than a billboard. A billboard tells you what to buy. It demands a transaction. If this wall only tells you what to think, it is just an advertisement for a history lesson.

      So what is the difference? The difference is in how you stand before it. Propaganda wants you to move—to vote, to buy, to agree, to leave. It closes the conversation. This mural does the opposite. The artist did not paint a slogan. She painted the light on the brick. She painted the faces not as symbols, but as neighbors. She asked us not to read a plaque, but to look at the street.

      This satisfies the requirement to advance a civic narrative, not by reciting rules, but by making the narrative visible. The resilience is not in the words on a metal plate; it is in the color on the wall.

      Du Bois argued that truth matters enough to fight for. But he also knew that truth must be felt to be believed. Beauty is not the decoration on the pill. Beauty is the method of delivery. It is what makes you stop walking. It is what makes the stranger become a witness.

      So, look at the work. Do not look for instructions. Look for the people. Propaganda demands your obedience. This art demands your attention. And in that attention, in that quiet moment of seeing what was once hidden, the history does its work. It does not tell you what to do. It reminds you of who you are.

      Thank you.

