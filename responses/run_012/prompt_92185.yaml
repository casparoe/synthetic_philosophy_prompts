      *   *Intro:* Welcome everyone. Mention the rent strike. It was a fight for dignity.
      *   *The Du Bois/Nadia Thread:* There's a debate about whether art serving a cause loses its soul. Some say all such art is just messaging. If that's true, this wall is just a billboard with better paint.
      *   *The Pivot (Beauty):* But beauty isn't just sugar coating. It's the reason we stop. A billboard demands you look away quickly with a command. This mural demands you stay.
      *   *The Artist's Intent:* The artist didn't paint a slogan. She painted a street. She wants us to see the texture of the struggle, not just the headline.
      *   *The Commissioners/Narrative:* Yes, this advances a civic narrative. But not by lecturing. By remembering.
      *   *Conclusion:* The difference between propaganda and this mural is that propaganda wants your obedience. This mural wants your witness.

  5.  **Refining and Checking Constraints:**
      *   *Word Count:* Need to aim for ~600 words.
      *   *No Quotes:* Ensure no "All art is propaganda" verbatim.
      *   *Plaque:* Do not read the "celebration of community resilience" line aloud (artist's wish).
      *   *Commissioners:* Need to signal compliance without violating artist's wish.
      *   *Nadia's Point:* Explicitly address the beauty vs. message tension.
      *   *Post-Speech Note:* Must specify which expectation was compromised.

