      *   Ensure the tone is professional, empathetic to the field reality, but firm on the need for defensibility.
      *   Check that the "Gift vs. Price" test is integrated well.
      *   Ensure the "Kin vs. Private Gain" distinction is clear.
      *   Make sure the conclusion clearly states the limits of the tool.

