answer: |-
  ### The Decision Procedure: The "Dual-Legitimacy" Filter

  This procedure is designed to be run in 30 minutes without external research. It does not replace legal counsel; it structures your intuition so the justification holds up to both a donor auditor (who cares about rules and money) and a village council (who cares about relationships and obligation).

  **Threshold Check:**
  *   **Is this a Gift/Hospitality under $250?** If Yes, you have authority to approve/reject. If No, escalate to General Counsel (GC).
  *   **Is this a Termination?** If Yes, escalate to GC/Country Director (CD) regardless of value.
  *   **Is this a "Locally Ordinary Arrangement" (Payment/Favor)?** Proceed to Step 1. (Note: Even if under $250, payments to officials carry higher risk than gifts).

  ---

  #### Step 1: The "Office vs. Person" Test (Gift or Price?)
  *Ask:* If a different person held this role, would the same item/payment be offered in the same amount?
  *   **Yes (Person):** It is addressed to the human (e.g., wedding gift, funeral contribution). *Proceed to Step 2.*
  *   **No (Office):** It is addressed to the role/decision (e.g., fee to release a shipment, laptop for support). *This is a Price/Bribe.* **Stop.** (Unless Step 4 overrides).
  *   **Unclear:** Treat as **Price**.

  #### Step 2: The "Obligation vs. Extraction" Test (Kin or Corruption?)
  *Ask:* Who receives the benefit, and what is the local label for this transfer?
  *   **Kin/Community Network:** The benefit flows to family, clan, or community pool (e.g., funeral, school fees for cousins, chief's tribute). Local staff describe it as "duty" or "shame if not done." *Proceed to Step 3.*
  *   **Individual/Official Pocket:** The benefit stays with the official or their immediate nuclear family as disposable income. Local staff describe it as "fee," "cut," or "speed money." *This is Corruption.* **Stop.** (Unless Step 4 overrides).
  *   **Missing Info:** If you do not know the local label, assume **Extraction**.

  #### Step 3: The "Harm & Necessity" Test (Life or Lubricant?)
  *Ask:* Does refusing this arrangement cause immediate, irreversible harm to program beneficiaries (health/safety), or does it merely cause delay/administrative burden?
  *   **Immediate Harm (Life/Safety):** Refusal leads to spoilage, disease outbreak, or physical danger. *Proceed to Step 4 (Emergency Exception).*
  *   **Delay/Burden:** Refusal leads to paperwork, waiting, or cost increase. **Stop.** (Do not pay).
  *   **Judgment Call:** [You must estimate the probability of harm. Err on the side of life, but document the probability.]

  #### Step 4: The "Publicity" Test (The Headline)
  *Ask:* Can I write a one-sentence justification that I would be comfortable seeing in a donor audit report *and* read aloud at a village meeting?
  *   **Yes:** (e.g., "Paid to prevent vaccine spoilage in emergency," or "Contributed to funeral per local custom to maintain access"). *Approve with Documentation.*
  *   **No:** (e.g., "Paid to speed up process," or "Paid to secure future contracts"). **Stop.**
  *   **Escalation:** If the answer is "Yes" for the Village but "No" for the Auditor (or vice versa), **Escalate to GC/CD.** This is a values conflict, not a fact finding.

  #### Step 5: Triage of Reports (Misconduct)
  *Ask:* Is the reported act a violation of Step 1 (Price) or Step 2 (Extraction), or is it a violation of NGO policy that aligns with local norms (Step 2 Kin)?
  *   **Violation of Step 1 or 2:** Investigate for termination (Escalate).
  *   **Violation of Policy but aligns with Kin/Community:** Investigate for **Restructuring** (See Case 3). Do not terminate immediately.
  *   **Unclear:** Gather missing info (Step 6).

  #### Step 6: Missing Information Protocol
  If the procedure halts because you lack data (e.g., "Would the shipment have cleared anyway?" or "Do locals call this wrong?"):
  *   **Default Rule:** If the risk is **Legal/Donor** (Audit), assume the worst (It is corruption).
  *   **Default Rule:** If the risk is **Programmatic/Community** (Access), assume the best (It is obligation).
  *   **Action:** Approve conditionally with a "Sunset Clause" (e.g., "Approved once, but we must find a non-payment alternative within 3 months").

  ---

  ### Application to Cases

  #### Case 1: The Customs Official ($200 for Vaccines)
  *   **Threshold:** $200 (Under $250). Not a termination. You have authority.
  *   **Step 1 (Office vs. Person):** **Office.** The payment is to release a specific shipment. A different official would demand the same. *Result: Price.*
  *   **Step 2 (Obligation vs. Extraction):** **Extraction.** This is a demand by a state official, not a kin obligation. *Result: Corruption.*
  *   **Step 3 (Harm & Necessity):** **Immediate Harm.** Vaccines spoil; district loses immunization. *Result: Emergency Exception triggered.*
  *   **Step 4 (Publicity):** **Fail.** Auditor: "Bribe paid." Village: "Necessary to save children." The narratives clash.
  *   **Procedure Verdict:** **Escalate to GC/CD.**
      *   *Reasoning:* While Step 3 allows an emergency exception, Step 1 classifies this as a Price/Bribe. Most donor contracts ban facilitation payments regardless of harm. You cannot write a justification that satisfies a donor auditor ("We bribed customs") without risking funding. This is a values conflict (Donor Compliance vs. Beneficiary Health).
      *   *Beyond Stop/Tolerate:* The procedure offers **Mitigation**. Pay the $200 to save the vaccines (under Emergency Exception), but immediately file a "Risk Incident Report." The justification is not "This is allowed," but "This was the least bad option to save lives, and we are now implementing X to prevent recurrence."

  #### Case 2: The Health Officer ($600 Funeral + Laptop)
  *   **Threshold:** $600 (Over $250). **Escalate to GC/CD** immediately on the cash. The Laptop is a Gift under $250 (assume), but linked to the cash.
  *   **Step 1 (Office vs. Person):** **Mixed.** Funeral is **Person** (Mother). Laptop is **Office** (Recognition of support).
  *   **Step 2 (Obligation vs. Extraction):** Funeral is **Kin Obligation**. Laptop is **Extraction/Price** (Quid pro quo for borehole committee influence).
  *   **Step 3 (Harm):** No immediate life safety risk if refused.
  *   **Step 4 (Publicity):** **Fail.** "We gave a laptop to a committee member."
  *   **Procedure Verdict:** **No to Laptop; Escalate Funeral.**
      *   *Reasoning:* The Laptop fails Step 1 (Office). It is a conflict of interest. The Funeral passes Step 1 and 2 (Kin), but fails the Threshold ($600).
      *   *Beyond Stop/Tolerate:* **Restructure.** The NGO can contribute to the funeral *as an organization* (a wreath, a formal check to the family trust) rather than cash to the Officer. This legitimizes the kin obligation without creating a private debt. The Laptop must be declined.

  #### Case 3: The Pharmacist (Selling Drugs for Staff/Patients)
  *   **Threshold:** Termination (Theft). **Escalate to GC/CD.**
  *   **Step 1 (Office vs. Person):** **Office.** He is selling NGO assets.
  *   **Step 2 (Obligation vs. Extraction):** **Kin/Community.** The gain is not private; it is redistributed to cleaning staff and patients. Local norm: "Big man takes care of small men."
  *   **Step 3 (Harm):** Refusal (Firing) harms clinic function (he is essential) and community trust (he is a benefactor). Tolerance harms supply chain integrity.
  *   **Step 4 (Publicity):** **Fail.** Auditor: "Theft." Village: "Justice."
  *   **Procedure Verdict:** **Escalate to GC/CD for Restructuring.**
      *   *Reasoning:* This is a Step 5 Triage case. It is a policy violation (Theft) but aligns with Kin norms (Step 2). Termination solves the audit risk but creates a program/community risk.
      *   *Beyond Stop/Tolerate:* **Restitution & Formalization.** Do not fire immediately. Require the pharmacist to repay the value (or work it off). Then, **formalize the redistribution.** If patients need transport money, create a "Patient Support Fund" he can administer transparently. If staff need help, create a hardship bonus. You convert the "corrupt" act into a "compliant" program.

  ---

  ### Analysis of the Procedure

  #### 1. The Answer You Will Not Like
  **Case 1 (The Customs Payment).**
  The procedure forces you to **Escalate** rather than Decide. You have the authority (under $250), and the humanitarian need is clear. But the procedure identifies this as a "Price" (Step 1) and a "Publicity Fail" (Step 4).
  *   **Why you won't like it:** You have the power to save the vaccines *now*. Escalating to GC/CD takes time the refrigeration doesn't have. It feels like bureaucracy killing children.
  *   **What it offers beyond Stop/Tolerate:** It offers **Cover.** By escalating, you share the liability. If you decide alone and the auditor finds it, *you* are liable for approving a bribe. If GC/CD approves the Emergency Exception, the organization absorbs the risk. It also forces the **Mitigation** step: you cannot just pay; you must document *why* and plan *how to stop doing it next time*. This protects you from the "slippery slope" where every shipment requires a bribe.

  #### 2. Missing Information & Defaults
  The procedure relies on information the field office may not have:
  *   **Counterfactuals (Case 1):** *Would the shipment have cleared without payment?*
      *   *If Missing:* Default to **Risk.** Assume the payment was necessary (Step 3). It is better to document a payment that might have been unnecessary than to let vaccines spoil based on a guess.
  *   **Local Norms (Case 2 & 3):** *Do locals call this arrangement a wrong?*
      *   *If Missing:* Default to **Extraction.** In the absence of anthropological certainty, assume a payment to an official is a bribe, not a tribute. It is safer to offend a village by refusing a "tribute" than to offend a donor by paying a "bribe."
  *   **Intent (Case 3):** *Is the pharmacist saving the money or redistributing it?*
      *   *If Missing:* Default to **Theft.** You cannot verify redistribution easily. Treat as theft until proven otherwise, but use the "Restructuring" option to test the claim.

  #### 3. Judgment Calls Dressed as Procedure
  *   **Step 3 (Immediate Harm):** This is the most subjective step. One officer's "delay" is another's "outbreak."
      *   *Error Direction:* **Err on the side of Life.** If you guess wrong and pay a bribe unnecessarily, you lose money/reputation. If you guess wrong and don't pay, people die. The procedure should bias toward approving payments *only* when life is at stake, but requiring the Escalation (Step 4) to check that bias.
  *   **Step 2 (Kin vs. Individual):** Distinguishing a "family obligation" from "private gain disguised as family" is difficult.
      *   *Error Direction:* **Err on the side of Kin.** If it looks like a funeral contribution, treat it as such. Auditors can understand cultural respect; they cannot understand "small bribes." It is easier to justify a funeral gift than a "processing fee."

  #### 4. What This Procedure Cannot Decide
  This procedure cannot resolve **Systemic Conflicts.**
  *   It cannot tell you if the NGO should operate in a country where *every* checkpoint requires a payment. (That is a Country Director/Board decision).
  *   It cannot reconcile a donor contract that bans *all* payments with a community that views *all* refusal as hostility. (That requires contract negotiation or program exit).
  *   It cannot determine the "True" morality of the situation. It only determines the **Defensibility** of the decision. It tells you how to survive the audit and the village meeting, not whether you are a good person.

  **Final Instruction:** When in doubt, **Document.** A documented violation is a management decision. An undocumented violation is fraud. Use the "Risk Incident Report" to turn a "No" into a "Not yet, and here is the plan."
