      4.  **The "Harm & Necessity" Test:** Weigh immediate program loss vs. long-term integrity.
      5.  **The "Publicity" Test:** Can this be defended to both auditor and village?
      6.  **Escalation:** Where the procedure hits a value wall.

  4.  **Applying to the Three Cases:**

      *   *Case 1: Customs/Vaccines ($200).*
          *   Value: Under $250 (User's authority).
          *   Nature: Payment to official for decision (Price).
          *   Harm: Vaccines spoil vs. Corruption norm.
          *   Verdict: Likely "Tolerate/Record" but risky. Procedure might say "No" based on strict anti-bribery, but the "Harm" test pushes to "Yes." This is the conflict point.
      *   *Case 2: Health Officer ($600 + Laptop).*
          *   Value: $600 (Escalate to GC/CD). Laptop (Gift).
          *   Nature: Funeral (Kin/Obligation?) vs. Laptop (Price/Reward).
          *   Conflict of Interest: He sits on borehole committee.
          *   Verdict: Funeral *might* be culturally okay, but the Laptop + Borehole role makes it a clear Conflict of Interest/Quid Pro Quo.
      *   *Case 3: Pharmacist (Selling drugs for staff/patients).*
          *   Nature: Theft/Diversion.
          *   Motive: Altruistic redistribution (Kin/Community).
          *   Verdict: Technically termination (Theft). But community sees it as decency. Procedure needs to flag this as a "Values Escalation."

  5.  **Addressing Specific Prompt Requirements:**

      *   *Which answer will I not like?* Likely Case 1 (The Bribe). Strict compliance says No; Humanitarian necessity says Yes. The procedure needs to acknowledge this tension.
      *   *Beyond Stop/Tolerate:* Mitigation, structural changes, transparency.
      *   *Missing Information:* Local norms, counterfactuals (would shipment have cleared anyway?).
      *   *Judgment Calls:* Defining "Kin," defining "Harm."
      *   *Error Direction:* Err on the side of program continuity (lives) over strict compliance *unless* it threatens the organization's existence. Actually, for an NGO, losing donor trust is existential. So err on the side of *documented transparency*.
      *   *What it cannot decide:* Deep cultural conflicts, systemic corruption strategies.

