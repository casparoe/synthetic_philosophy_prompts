answer: |-
  **Title:** Structural Skies and Historical Cranes: Re-grounding the Criteria for Reductive Explanation

  **Summary:** This project argues that the distinction between legitimate reductive explanations and "greedy" ones must rely on the synchronic structure of argumentation rather than the diachronic history of the posits involved.

  **Project Description**

  In the philosophy of biology and mind, few metaphors are as influential as the distinction between "cranes" and "skyhooks." Originating in the seminal formulation of these terms by Daniel Dennett, the distinction is intended to police the boundary between legitimate scientific reduction and magical thinking. A "crane" is a mechanism that lifts complexity from below, built up from simpler parts through a traceable process, such as natural selection. A "skyhook" is a purported explainer that dangles from nowhere, offering explanatory lift without its own structural support, effectively smuggling in an unexplained miracle. Closely related is the charge of "greedy reductionism," leveled against explanations that attempt to bypass intermediate levels of organization to reach a fundamental base too quickly.

  Currently, these concepts are defined by provenance: a crane is something that had to be built; a skyhook is not. However, provenance is a diachronic fact about causal history, whereas the explanatory demand the distinction is meant to police is synchronic: it concerns what underwrites a capacity here and now. Nothing guarantees that these two line up. A posit can be a crane in causal history (it was built by evolution) but function as a skyhook in a specific explanation (its construction is not accounted for, and the explanatory work is done by a label). Conversely, accusations of skyhookery often serve as promissory notes against phenomena not yet derived, rather than genuine structural critiques. Similarly, while greediness is defined structurally as missing intermediate steps, the accusation is nearly always made on the basis of the conclusion. If the reduction succeeds, it was insightful; if it fails, it was greedy. This renders the criterion circular, as the verdict on the explanation depends on the verdict on the truth of the conclusion.

  **Guiding Question**

  The project is organized around a single guiding question: *Can the distinction between cranes and skyhooks, and the charge of greedy reductionism, be grounded in a synchronic structural criterion independent of our prior verdict on the truth of the conclusion?*

  The existing positions leave this open because they conflate the history of a concept with the logic of its current use. The standard view assumes that if a mechanism is historically a crane, it cannot function as a skyhook in a bad argument. My hypothesis is that this assumption masks a significant category of explanatory failure where historical legitimacy licenses synchronic hand-waving. A determinate answer is possible: either we can isolate formal features of an explanation that constitute "greediness" regardless of the domain, or we must admit that the distinction is merely rhetorical.

  **Methodology**

  To answer this, I will not adjudicate one contested case in detail, such as the debate over specific gene-behavior links or neural correlates of consciousness. Focusing on a single case risks getting bogged down in domain-specific empirical disputes that obscure the logical structure of the explanation. Instead, I will work through a stock of recurring accusations of greediness and skyhookery drawn from evolutionary psychology, neuroscience, and memetics. By analyzing a corpus of arguments where the charge is frequently leveled, I can isolate the structural features that trigger the accusation, separating them from the empirical truth of the claims.

  The nine-month fellowship will be divided into three phases:

  *   **Months 1–3 (Cataloging and Mapping):** I will assemble a dataset of approximately thirty prominent exchanges where the charge of greedy reductionism or skyhookery is central. I will map the logical structure of both the accusation and the defense, coding for whether the critique targets the missing steps (structural) or the implausibility of the result (conclusion-based).
  *   **Months 4–6 (Structural Analysis):** I will develop a taxonomy of "explanatory gaps." This involves defining what counts as a legitimate intermediate step across different disciplines. I will test whether posits that are historically secure (cranes) are nonetheless used to bridge gaps they do not structurally support (functioning as skyhooks).
  *   **Months 7–9 (Synthesis and Drafting):** I will formulate the proposed synchronic criterion. The final output will be a monograph draft or a series of articles establishing whether a non-circular criterion is viable.

  **Outcomes and Decision Criteria**

  A successful outcome will be a set of necessary and sufficient conditions for identifying a "greedy" explanation that does not rely on knowing whether the explanation is ultimately true. For example, a successful criterion might specify that an explanation is greedy if it invokes a mechanism that requires more informational input than the antecedent conditions provide, regardless of whether that mechanism exists.

  The project would fail if the analysis demonstrates that the distinction is inextricably tied to scientific consensus. If "greedy" simply means "a reduction we currently reject," then the term has no philosophical utility beyond signaling tribal affiliation. The decision between these conclusions will rest on whether the structural analysis predicts the longevity of explanations. If explanations identified as structurally "greedy" by my criterion are consistently abandoned even when they are initially popular, the criterion has traction. If structurally "greedy" explanations persist and succeed solely due to sociological factors, the distinction is merely rhetorical.

  **Scope and Priorities**

  The scope is limited to the logic of explanation, not the metaphysics of reduction. I will not attempt to solve the mind-body problem or settle debates in evolutionary theory. If the project proves too large, the first element to be cut will be the historical genealogy of the terms themselves. While interesting, tracing how Dennett and his critics have used the vocabulary is secondary to determining whether the vocabulary *can* work. The priority is the normative criterion for explanation, not the intellectual history of the metaphor.

  **Addressing Foreseeable Objections**

  A foreseeable objection, particularly from social scientists on the panel, is that this is really a question for the sociology of science. One might argue that whether an explanation counts as a "crane" is determined by when a community accepts it, not by abstract logical criteria. If acceptance is social, then the study of these terms belongs to sociology, not philosophy.

  I address this by emphasizing the normative aim of the project. Sociology describes when an explanation *gets* accepted; philosophy asks when an explanation *should be* accepted. The current conflation of history and structure leads to scientific stagnation, where bad explanations are shielded by the historical pedigree of their components, or good reductions are stifled by premature accusations of greediness. By attempting to decouple the structural validity of an explanation from its sociological reception, this project seeks to provide a tool for evaluating scientific reasoning that is not reducible to power dynamics. Even if the distinction is often used sociologically, determining whether it *ought* to be used philosophically remains a distinct and necessary inquiry.

  **Conclusion**

  This fellowship offers the time and interdisciplinary environment necessary to disentangle the history of scientific posits from the structure of scientific arguments. By refining the tools we use to critique reduction, we can better distinguish between genuine insight and explanatory sleight of hand. The result will be a clearer framework for evaluating reductive claims across the life and cognitive sciences.
