answer: |-
  You are correct on the theory: it is Robert Nozick's *Tracking Theory of Knowledge* (from *Philosophical Explanations*, 1981). You are also correct that he abandons the principle of closure (if you know P, and P implies Q, you know Q) precisely to handle cases where someone has the evidence but doesn't draw the conclusion.

  You are also right about the hardest part: 'Should have known' is not an epistemic state (a state of knowing). It is a normative judgment (a state of duty). No checklist can turn a value judgment into a fact.

  Here is a procedure designed for your constraints (1 hour, documents only, no re-interviews) that incorporates the tracking logic without requiring a philosophy degree to operate. It is designed to filter out the 'Knew' cases from the 'Couldn't Have Known' cases, leaving the 'Should Have Known' pile for the panel to argue over.

  ### The Epistemic Status Protocol (ESP)

  **Pre-condition:** The team has the Incident Report, Interview Transcripts, and relevant Logs/Systems data.
  **Timebox:** 60 Minutes.
  **Goal:** Determine if the subject *Knew* (Fact) or *Couldn't Have Known* (Fact). If neither, it defaults to *Should Have Known* (Judgment).

  #### Phase 1: The Truth Condition (5 Minutes)
  *Question:* Was the proposition (the fact in question) actually true at the time?
  *   **Yes:** Proceed.
  *   **No:** Stop. They cannot know a falsehood. Verdict: **Couldn't Have Known.** (Note: They may be liable for believing it, but they didn't *know* it).

  #### Phase 2: The Belief Condition (15 Minutes)
  *Question:* Is there evidence the subject held this specific belief *at the time of the incident*?
  *Look for:* Written notes, verbal confirmations, radio transmissions, or actions that only make sense if the belief was held.
  *   **Snag 1 (No Belief Formed):** If the transcripts show the subject never considered the fact (it "didn't cross their mind"), the answer is **No**.
      *   *Rule:* You cannot know what you have not considered. If Belief = No, Verdict: **Couldn't Have Known.** (Do not pass go. Do not apply counterfactuals to a vacuum).
  *   **Snag 2 (Corporate Knowledge):** If the subject is "The Depot" or "The Company":
      *   *Rule:* The organisation "believes" P if P is recorded in a **System of Record** (maintenance log, safety register, official memo) accessible to the role responsible for acting on it.
      *   *Test:* Was the fact entered into the official system? Yes = Organisation Believes. No = Organisation Does Not Believe. (Ignore "water cooler" knowledge).
  *   **Yes (Belief Evidenced):** Proceed.

  #### Phase 3: The Sensitivity Condition (25 Minutes)
  *Question:* If the fact had been *false*, would their evidence have changed?
  *Method:* Look at the *source* of their belief identified in Phase 2.
  *   **Test:** Imagine the world was different (e.g., the track *was* clear, the brake *was* new). Would the document/log/signal they relied on have looked different?
      *   **Yes:** Their belief tracked the truth. (If the track was clear, the log would say 'Clear', and they would believe 'Clear').
      *   **No:** Their belief was lucky or broken. (If the track was clear, the log would *still* say 'Blocked' due to error, and they would *still* believe 'Blocked').
  *   **Snag 3 (Connecting Dots/Closure):** If the belief relies on combining Fact A and Fact B to reach Conclusion C:
      *   *Rule:* Did they explicitly record or state Conclusion C?
      *   **No:** They did not know C. (Nozick's Closure failure). Having the premises is not knowing the conclusion. Verdict: **Couldn't Have Known.**
      *   **Yes:** Proceed.
  *   **Result:** If Sensitivity = No, Verdict: **Couldn't Have Known.** (This is the Gettier/Luck case).

  #### Phase 4: The Verdict Handoff (15 Minutes)
  *   If Phase 1, 2, and 3 are all **YES**: Draft Finding = **'Knew'.**
  *   If any Phase is **NO**: Draft Finding = **'Couldn't Reasonably Have Known'.**
  *   **The Gap:** If the draft is 'Couldn't Have Known' but the team feels they were negligent, careless, or incompetent, mark the file for **'Should Have Known'**.
      *   *Note to Panel:* "The epistemic test for knowledge failed. The finding of 'Should Have Known' is a judgment on their duty to check, not a statement of their mental state."

  ---

  ### Case Runs

  Here is how your team runs this protocol on your three scenarios.

  #### Case (a): The Signaller
  *Facts:* Possession existed (True). Signaller told twice (Input). Wrote on pad (Evidence). Cleared train (Action).
  *   **Phase 1 (Truth):** Possession existed? **Yes.**
  *   **Phase 2 (Belief):** Did he believe the line was possessed?
      *   Evidence: He wrote it on the pad when told.
      *   *Snag Check:* He acted contrary later. Does that erase the belief?
      *   *Ruling:* No. Writing it down confirms belief formation. The error was a performance lapse (slip), not an epistemic lack. He held the belief, he failed to execute it.
      *   **Pass.**
  *   **Phase 3 (Sensitivity):** If the line had *not* been possessed, would he have believed it was?
      *   Evidence: He was told by control. If Control hadn't called, he wouldn't have written it.
      *   **Pass.** (His belief tracked the information provided).
  *   **Phase 4 (Verdict):** **'Knew'.**
      *   *Drafting Note:* "The signaller knew of the possession. The incident resulted from a failure to act on known information, not a lack of knowledge."

  #### Case (b): The Planner (The Two Systems)
  *Facts:* Fact A in System 1 (Track busy). Fact B in System 2 (Maintenance due). Combined = Unsafe. Planner saw A, saw B, did not infer Unsafe.
  *   **Phase 1 (Truth):** Track was unsafe? **Yes.**
  *   **Phase 2 (Belief):** Did the Planner believe the track was unsafe?
      *   Evidence: Transcripts show he scheduled the work. He acted as if it *was* safe.
      *   *Snag 1 (No Belief):* He never formed the belief "It is unsafe".
      *   **Fail.** Stop here.
  *   **Phase 3 (Sensitivity):** (Skipped due to Phase 2 Fail).
      *   *Snag 3 (Closure):* Even if we argued he "should" have inferred it, the protocol explicitly says if he didn't draw the conclusion, he didn't know it.
  *   **Phase 4 (Verdict):** **'Couldn't Reasonably Have Known'.**
      *   *Handoff:* This goes to the panel as a **'Should Have Known'** candidate. The protocol confirms he did not *know*. The panel must now decide if his failure to connect the dots was negligent. The checklist protects you from saying he "Knew" when he didn't.

  #### Case (c): The Driver (The Lucky Mistake)
  *Facts:* Axle counter failed (True). Driver believed it failed (True). Reason: Mixed up diagrams (Wrong Reason). If counter had been fine, he would *still* have believed it failed (due to diagram mix-up).
  *   **Phase 1 (Truth):** Counter failed? **Yes.**
  *   **Phase 2 (Belief):** Did he believe it failed? **Yes** (Stated in interview).
  *   **Phase 3 (Sensitivity):** If the counter had been *fine* (False), would he have believed it was fine?
      *   Evidence: He mixed the diagrams. The diagram said 'Fail' regardless of the actual counter status.
      *   *Test:* In the counterfactual world where the counter works, the diagram still says 'Fail'. He still believes 'Fail'.
      *   **Fail.** His belief did not track the truth. It was accidental correctness.
  *   **Phase 4 (Verdict):** **'Couldn't Reasonably Have Known'.**
      *   *Panel Friction:* You noted the panel would want to write 'Knew'. The protocol forces you to write 'Couldn't Have Known'.
      *   *Defense:* "He was right by luck. Under the Tracking standard, luck is not knowledge. If you wish to sanction him, it must be under 'Should Have Known' (failure to verify diagrams), not 'Knew'."

  ---

  ### The Hard Limit: Where the Procedure Stops

  You asked me to tell you straight where the procedure can't decide. Here it is:

  **The procedure cannot determine 'Should Have Known'.**

  You identified this yourself: *"‘Should have known’ doesn't sound like knowledge at all to me, it sounds more like a standard of care."* You are absolutely right.

  *   **'Knew'** is a description of a mental state (Epistemology).
  *   **'Should Have Known'** is a description of a breach of duty (Normative Ethics/Law).

  The ESP above is designed to rigorously filter out the 'Knew' cases. If a case fails the ESP (like the Planner or the Driver), it *automatically* lands in the 'Couldn't Have Known' bucket epistemically.

  **The Procedure's Instruction to the Panel:**
  When you hand over a file marked 'Couldn't Have Known' by this protocol, your cover note must say:
  > "The evidence does not support a finding that the subject *knew* the fact (belief was absent/did not track truth). However, the team notes that the subject *could have* discovered the fact had they followed procedure [X]. Whether this constitutes a breach of duty ('Should Have Known') is a value judgment for the Panel, not a factual finding for the Investigators."

  **Why this protects you:**
  1.  **Case (b) & (c):** If the Panel insists on writing 'Knew' against the protocol's output, you have a written record that the epistemic conditions were not met. If a prosecution arises later based on "Dishonesty" or "Intent" (which require Knowledge), your report shows the knowledge element was weak.
  2.  **Case (a):** It prevents you from letting a signaller off with "Couldn't have known" just because they made a mistake. They knew; they slipped. That distinction matters for discipline.
  3.  **The "No Belief" Snag:** It stops you from trying to simulate counterfactuals on people who never thought about the issue. If they didn't think about it, they didn't know it. Full stop. The question is only whether they *should* have thought about it.

  Run this protocol. When the Panel pushes back on Case (c) and says "But he was right, and he was responsible," you say: "He was responsible, yes. But he didn't *know*. If we conflate luck with knowledge, we weaken the definition for the next case where someone actually checks and finds the truth."
