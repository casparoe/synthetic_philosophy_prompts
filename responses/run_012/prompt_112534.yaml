          3.  Identify what *both* are missing (specifically regarding the estimated quantity, the counterfactual, and outcome measurement).
          4.  Answer the larger philosophical question: Does this show the question of "why nations are rich" is unanswerable, answerable only in fragments, or neither?
      *   **Constraint:** No reading lists. Focus on reasoning.

  2.  **Analyze the Scenario:**
      *   **The Paper:** Studies a river border separating two colonial districts (1890s-Independence).
