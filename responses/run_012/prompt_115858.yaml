          2.  The False Conflict (HOE + Evidentialism).
          3.  The Real Conflict (Conciliationism + Permissivism).
          4.  The Akrasia Glue (How iii holds it together).
          5.  The Repair Plan (Drop Permissivism, tweak Evidentialism to "Total Evidence").

