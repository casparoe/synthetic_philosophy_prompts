          *   *Akrasia:* If I suspend, I believe "I shouldn't believe $P$." This is consistent.
          *   *Wait, where's the tension?* The tension arises if Conciliationism demands suspension *even when* FOE is overwhelming (e.g., simple math). If FOE says "2+2=4" with certainty, and HOE says "Peer says 5," Conciliationism says "Suspend." But if FOE is *that* strong, does HOE actually defeat it?
