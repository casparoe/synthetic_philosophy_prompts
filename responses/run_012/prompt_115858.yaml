              *   Also, Permissivism + Evidentialism is tricky. (Evidentialism often implies Uniqueness, though "Wide-Scope Evidentialism" allows Permissivism).
              *   Also, Permissivism + No Akrasia: If it's permissible to believe $P$ and permissible to believe $\neg P$, can I believe $P$ while thinking $\neg P$ is permissible? Yes. But can I believe $P$ while thinking believing $P$ is *impermissible*? No (that's akrasia).
