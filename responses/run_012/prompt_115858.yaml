      *   *Wait, is Permissivism definitely incompatible with Conciliationism?* Some argue for "Permissivist Conciliationism" (e.g., Kopec & Titelbaum). But it's much harder to motivate. For a seminar handout, it's a liability. It complicates the "Why conciliate?" story.
      *   *Is Evidentialism incompatible with Permissivism?* "Wide-scope" evidentialism allows it, but "Standard" evidentialism (Feldman/Conee) implies Uniqueness. Given the user wants a tight package, pointing out this tension is useful.
