          *   *If you follow FOE:* You believe $P$. But you also believe "I'm drugged, so believing $P$ is risky/unjustified." -> **Akrasia.**
          *   *The Problem:* If (iii) is true (No Akrasia), then in the drug case, you *must* let HOE override FOE. This fits (ii).
          *   *The Tension:* The tension is actually between **(iii) No Akrasia** and **Level-Splitting views of HOE**. Since the user rejects level-splitting, (ii) and (iii) actually work *together* to force belief revision.
          *   *Wait, is there a conflict with Evidentialism?* If FOE supports $P$, and HOE supports $\neg$Belief($P$), does Total Evidence support $P$ or $\neg$Belief($P$)? Evidentialism says follow Total Evidence. If Total Evidence includes the defeater, it supports $\neg$Belief($P$). So (ii), (iii), and (iv) form a tight knot.
