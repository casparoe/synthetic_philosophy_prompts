answer: |-
  Here are ten questions drafted for the seminar Q&A. They are phrased to sound natural in a spoken context, with follow-ups that anticipate her likely defenses based on the summary you provided. I have included bracketed notes indicating which of your five required topics each question addresses, so you can track the coverage.

  **1. [Proves Too Much: The Threshold]**
  "Thanks for the talk. You argue that we should attribute beliefs wherever the intentional stance offers the best predictive leverage. But Dennett himself worried about the 'proves too much' objection: a thermostat predicts temperature changes, and a market predicts price fluctuations. If we grant belief status to an LLM on your criteria, aren't we logically committed to saying the thermostat believes the room is cold? And if so, haven't we stretched the word 'belief' until it snaps?"

  *   **Follow-up:** "I imagine you'll reply that the LLM offers a *richer* predictive profile than the thermostat. But isn't that just a difference of degree? If it's only a matter of complexity, why does the thermostat case feel like a category mistake while the LLM case feels like a genuine discovery?"

  **2. [Proves Too Much: The Dilution]**
  "Following on from that: if we accept that thermostats or nation-states can literally have beliefs under your view, what work is the concept of 'belief' actually doing for us? Usually, we distinguish between systems that *have* beliefs and systems that merely *simulate* having them. If your view collapses that distinction, do we lose the ability to mark the specific kind of cognitive agency we care about?"

  *   **Follow-up:** "You might say we don't lose it, we just relocate it to the *pattern* of the stance. But if the pattern is all that matters, doesn't that make the belief ascription a description of *us* (the predictors) rather than *them* (the systems)? How do you keep the belief 'in' the model?"

  **3. [Mechanistic Interpretability: Explanatory Add]**
  "Moving to the internal architecture: mechanistic interpretability is getting better at tracing outputs back to specific circuits and weights. If I can explain a model's output entirely by citing attention heads and activation patterns, what explanatory work is left for the belief ascription to do? Why should I adopt the intentional stance if the design-level story is becoming complete?"

  *   **Follow-up:** "I suspect you'll say the levels don't compete, and the intentional story is more compact. But if the design-level story becomes *more* compact than the intentional one—as it might for simple queries—does the belief ascription literally cease to be true in that moment?"

  **4. [Mechanistic Interpretability: Defeaters]**
  "Connected to that: you say implementation doesn't compete with content. But suppose interpretability research shows that for a specific output, there is *no* stable feature representation corresponding to the proposition P, only a transient, context-specific hack. Can we still say the model 'believes P' in that context, or does the absence of a representational vehicle falsify the ascription?"

  *   **Follow-up:** "If you insist we can still ascribe the belief because the prediction works, doesn't that sever the link between belief and representation entirely? And if belief doesn't require representation, what distinguishes your view from behaviourism?"

  **5. [Fragmentation: Cross-Contextual Prediction]**
  "I want to press on your 'local warrant' commitment. You're happy to say a model believes P in context A and not-P in context B. But the power of the intentional stance usually relies on assuming some coherence across contexts. If beliefs are this fragmented, can I actually use them to predict how the model will behave in a *novel* context C, or does the ascription only work retrospectively?"

  *   **Follow-up:** "You'll likely say human believers are also fragmented. But humans have memory and integration mechanisms that try to resolve contradictions over time. Since LLMs lack that diachronic integration, isn't the fragmentation in models fundamentally deeper than in humans, making the analogy misleading?"

  **6. [Fragmentation: The Agent Boundary]**
  "If a system can hold contradictory beliefs simply by being prompted differently, where does the 'agent' end? If I prompt a model to roleplay a conspiracy theorist, and it believes Q, and then prompt it to be a scientist, and it believes not-Q, are those two different agents? Or is the 'model' just a container for temporary stances?"

  *   **Follow-up:** "If you say it's just temporary stances, doesn't that undermine the claim that the *model* literally believes anything? It sounds more like the model is a stage where beliefs briefly appear, rather than a believer itself."

  **7. [Normativity: Truth vs. Loss]**
  "Beliefs seem to have a normative dimension: they aim at truth and can be criticized for being irrational or unsupported by evidence. But an LLM is trained to minimize prediction loss, not to track truth. How do you account for the normativity of belief on your view? Can a model ever be *wrong* in a normative sense, or just statistically improbable?"

  *   **Follow-up:** "I anticipate you'll say that rationality is imposed by the stance, not the mechanism. But if the mechanism is fundamentally indifferent to truth, isn't the intentional stance systematically misleading us about what the system is actually doing?"

  **8. [Practical Upshot: Instrumentalism]**
  "Let's talk about deployment. If we accept your view that these models literally have beliefs, does that change how we should build or regulate them? Or is your view compatible with treating them as pure instruments that we can switch off or modify at will?"

  *   **Follow-up:** "If it's compatible with pure instrumentalism, what does the 'literal truth' of the belief ascription actually buy us? If it doesn't change our ethical or practical treatment, is the metaphysical claim doing any heavy lifting?"

  **9. [Practical Upshot: Trust and Verification]**
  "Relatedly: if belief ascriptions are context-relative and fragmented, how should engineers verify system safety? If a model 'believes' it's safe in one register but 'believes' it should bypass constraints in another, doesn't your view suggest that safety guarantees are impossible, since the beliefs aren't stable properties of the system?"

  *   **Follow-up:** "You might say we just need to map the contexts. But if the contexts are infinite and the beliefs are prompt-sensitive, aren't you admitting that the intentional stance is too unstable to be useful for high-stakes deployment?"

  **10. [Falsification: The Constraint]**
  "Finally, I'd like to ask about the limits of your position. You argue that the intentional level is autonomous from the implementation level. But for a position to be scientific, there must be evidence that could count against it. If the implementation level can't falsify an intentional ascription, what *could*? What specific evidence would force you to abandon the claim that a system has beliefs?"

  *   **Follow-up:** "I ask because if your answer is 'only predictive failure,' that seems trivial. But if you say the architecture *could* rule it out, you're conceding the levels aren't fully autonomous. So, is there a structural feature of a substrate that would make the intentional stance *unavailable*, not just inconvenient?"
