answer: |-
  **The Scenario**

  A regional hospital observes that post-surgical patients with higher "Day-1 Mobility Scores" (distance walked within 24 hours) consistently have shorter lengths of stay. Believing mobility drives recovery, administration mandates a protocol requiring all patients to achieve the top-quartile Mobility Score using assisted walking frames, regardless of baseline frailty. Lengths of stay do not decrease. The failure occurs because underlying Physiological Resilience is the common cause: resilient patients naturally walk further *and* recover faster, while the protocol forces frail patients to match the walking distance of resilient ones without granting them the underlying resilience required to actually heal sooner.

  ***

  **Analysis of Failure Modes**

  1.  **Selection/Regressional:** **Does not apply.** The hospital did not select a subset of patients based on their scores (e.g., only rewarding the top walkers); they applied the intervention to the entire population. The failure isn't due to statistical noise in the extremes of the distribution, but rather a structural break in the relationship when intervened upon.
  2.  **Range:** **Does not apply.** The mandated walking distance was within the observed range of human capability (since resilient patients were already achieving it). The failure wasn't that we extrapolated to impossible distances, but that the *same distance* meant something different for a frail body than for a resilient one.
  3.  **Gaming:** **Does not apply.** There is no strategic manipulation. Patients and nurses are complying in good faith to improve health; no one is "cheating" the step counter or falsifying records. The metric is moved honestly, but the goal is not.
  4.  **Causal:** **Applies.** This is the live failure. Observationally, Mobility and Recovery correlate because Physiological Resilience drives both ($Resilience \rightarrow Mobility$ and $Resilience \rightarrow Recovery$). Interventionally, forcing Mobility ($do(Mobility)$) does not trigger Recovery because the causal arrow does not run from Mobility to Recovery.

  ***

  **The Key Feature and Removal Test**

  The single feature doing the work is the **unobserved confounding variable** (Physiological Resilience). The proxy (Mobility) is a *symptom* of the goal condition, not a *cause* of it.

  *   **Removal Test:** If you remove the confounder—i.e., if Mobility actually *caused* Recovery (perhaps via muscle activation preventing clots)—the policy would succeed. If you instead remove the intervention and simply *measure* Mobility, the correlation holds perfectly. The failure exists specifically at the intersection of *confounding* and *intervention*.

  ***

  **The Skeptic's Attack**

  A skeptic arguing "this is just a bad proxy, go find a better one" would say the taxonomy is academic hair-splitting; the only lesson is "correlation $\neq$ causation," so we should just iterate until we find a causal metric.

  *   **Does the attack land?** Partially, but it misses the operational value of the taxonomy. Knowing *which* flavor of Goodhart you face dictates the remedy.
      *   If it were **Gaming**, the fix is to hide the metric or audit behavior.
      *   If it were **Selection**, the fix is to regularize or use Bayesian shrinkage.
      *   If it were **Range**, the fix is to recalibrate.
      *   Because it is **Causal**, the fix is to stop intervening on the proxy and find the root cause (Resilience).
      *   **Verdict:** The skeptic is right that the proxy is bad, but wrong that the diagnosis doesn't matter. "Find a better proxy" is useless advice if you don't know *why* the current one broke. If you treat a Causal failure like a Gaming failure (e.g., by adding audits), you waste resources without solving the problem. The taxonomy is distinct and necessary for choosing the correct repair.

  ***

  **A Note on the Taxonomy**

  Your four categories are conceptually distinct (rooted in statistics, extrapolation, causal structure, and game theory), and the example above demonstrates they *can* be isolated in a controlled thought experiment. However, in messy real-world systems, they often cluster. For instance, once a metric is published, "Causal" failures often invite "Gaming" as agents realize the metric is decoupled from the goal. While your taxonomy is not muddy—it correctly identifies four distinct mechanisms of failure—practitioners should expect to encounter hybrids in the wild. The value of your framework is not that the categories never overlap, but that they prevent the group from stopping at the label "Goodhart's Law" and instead asking "Which mechanism is breaking us?"
