      *   *Scenario:* A retail chain notices store managers who take more "Leadership Days" (off-site training) have higher sales.
      *   *Intervention:* Mandate 5 Leadership Days per quarter for all managers.
      *   *Outcome:* Sales don't improve.
      *   *Why:* High-performing stores (due to location/demographics) are *given* more training budget (Common Cause: Store Potential).
      *   *Wait, is "Store Potential" a common cause?* Yes. Corporate invests in stores likely to succeed. Those stores succeed.
      *   *Check Constraints:*
          *   Gaming: Managers actually attend.
