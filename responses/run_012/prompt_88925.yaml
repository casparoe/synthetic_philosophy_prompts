      *Fix:* We mandate "Increase documentation by 20%." Everyone does it. Seniors go 10->12. Juniors 2->2.4.
      *Better Fix:* The observation is across *teams*. High-performing teams document more. Why? Because they have a "Culture of Quality" (Common Cause). We mandate the documentation practice on low-performing teams.
