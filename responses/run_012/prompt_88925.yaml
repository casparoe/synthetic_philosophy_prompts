          *   Causal: Training doesn't cause sales; Store Potential causes both.

      *   *Wait, one nuance:* If Corporate invests *because* they see potential, is it Selection? No, it's a pre-existing condition (Store Location/Demographics) causing both the Investment (Proxy) and the Sales (Goal).
      *   *Let's tighten:* A call center.
      *   *Goal:* Customer Satisfaction (CSAT).
      *   *Proxy:* Call Duration.
      *   *Observation:* Longer calls correlate with higher CSAT.
      *   *Intervention:* Mandate minimum call time.
      *   *Failure:* CSAT drops.
      *   *Reason:* Complex problems (Common Cause) require long calls AND result in high CSAT if solved. Simple problems get short calls. Forcing long calls on simple problems annoys customers.
      *   *Wait, is that Causal or Range?* If I force a 10-minute call on a 1-minute problem, am I out of range? Maybe.
      *   *Let's go back to the Training example.* It's cleaner for "Common Cause."
      *   *Revised Scenario:* A software firm notices engineers who write more documentation (Proxy) have fewer post-release bugs (Goal). They mandate high documentation volume for all teams. Bug rates don't drop.
      *   *Why:* Senior engineers (Common Cause) write better docs *and* write better code. Junior engineers write voluminous docs but buggy code.
      *   *Gaming:* Engineers aren't padding docs; they are trying to write good docs.
      *   *Selection:* Mandate applies to all, not just picking high-doc writers.
      *   *Range:* Juniors are writing the same volume as Seniors did, which is within observed range.
      *   *Causal:* Skill causes both Docs and Low Bugs. Docs do not cause Low Bugs.

      *   *Wait, is "Skill" a common cause?* Yes.
      *   *Is it Gaming?* No, they are writing the docs.
      *   *Is it Selection?* No, we are intervening on the whole population.
      *   *Is it Range?* No, the volume of docs is normal for seniors.
      *   *This looks solid.*

  8.  **Drafting the Response:**
      *   Write the paragraph.
      *   Do the 4-point analysis.
      *   Identify the "Key Feature" (Confounding).
      *   Handle the Skeptic.
      *   Self-Correction on Taxonomy: I need to be honest. Is "Selection" distinct from "Causal"? Selection bias is about how data is gathered. Causal is about the structure of reality. They are distinct. But in Goodhart contexts, "Regressional Goodhart" (Selection) is often about extreme values. My example avoids extremes.
