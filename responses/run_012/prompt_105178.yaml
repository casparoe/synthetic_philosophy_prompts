  A strict Bayesian expected-utility maximizer, Alice, sits weeping in a support group for "Victims of Rationality."

  The counselor asks, "Alice, you checked your bank balance, found out you were insolvent, and panicked. If you hadn't looked, you would have spent the weekend happily unaware. Why did you look?"

  Alice sniffles. "Good's Theorem. The expected value of free information is non-negative. I was obligated to look."

  "But the information was devastating," the counselor says. "You're worse off now than if you'd remained ignorant."

  "That's an *ex post* assessment," Alice corrects. "*Ex ante*, before I opened the app, the option to update my beliefs had positive expected utility. I optimized my prior."

  "Good's Theorem only guarantees that," the counselor presses, "because you can choose to ignore the information and act as if you never received it. You could have looked, seen you were broke, and spent the weekend anyway."

  "I know!" Alice wails. "That's the loophole! The theorem says I *can* ignore it, not that I *will*. I had the option to break even, but I chose to update."

  "So you admit you made a mistake?"

  "No," Alice says, wiping her eyes. "I made the right choice for my prior self. It's just that my posterior self is bankrupt."

  The counselor sighs. "So you're saying your expectation is happy, even if you aren't?"

  "Exactly," Alice says. "I'm not miserable. I'm just a negative realization in a positive expectation distribution."

  "Welcome to the group," the counselor says. "We meet *ex ante*."
