  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (3) & (6) vs. (1).**
          *   (1) says info processing = experience (Physicalism/Functionalism/Representationalism).
          *   (3) says phenomenal character is representational content.
          *   (6) says phenomenal concepts pick out a property *not identical* with functional/representational properties.
          *   *Conflict:* If (1) and (3) are true, the property of experience *is* a representational/functional property. If (6) is true, the property picked out is *not* identical to those. This looks like a Property Dualism slip within a Physicalist framework. Standard PCS (Loar, Papineau) says the *concept* is distinct, but the *property* is physical. The user says the *property* is not identical. This contradicts (1).

      *   **Tension B: (4) vs. (5).**
          *   (4) (Chase-and-Sanborn): No fact of the matter about inner feel if behavior/reports match. (Quasi-eliminativism/Verificationism about specific phenomenological facts).
          *   (5) (Animal Pain): Determinate fact about fish pain fixed by *internal state*, not behavior.
          *   *Conflict:* In (4), internal state seems to dissolve into reports/preferences (behavioral/dispositional). In (5), internal state is ontologically robust and distinct from behavior. Why is there "no fact of the matter" for coffee tasters but a "determinate fact" for fish? If internal processing fixes the fish fact, why doesn't internal processing fix the taster fact?

      *   **Tension C: (2) vs. (6).**
          *   (2) Rejects qualia because marks (ineffability, intrinsicality, privacy, direct apprehensibility) can't do work.
          *   (6) Adopts PCS but claims the property picked out is *not identical* to functional/representational properties.
