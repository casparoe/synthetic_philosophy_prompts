      *   (4) **Chase-and-Sanborn (Dennettian):** No fact of the matter about inner feel changes if reports/preferences match. (Anti-realism about specific qualia facts).
      *   (5) **Animal Realism:** Determinate fact about fish pain fixed by internal state, *not* behavior. (Realism about inner states).
      *   (6) **Phenomenal Concepts Strategy (PCS):** Phenomenal concepts refer without describing. *Crucial Clause:* "the property they pick out is not identical with any functional or representational property."
      *   (7) **Anti-Zombie:** Zombies are incoherent.
      *   (8) **Anti-Given:** Introspection is theory-laden/revisable.
