      *   **Tension D: (8) vs. (9).**
          *   (8) Introspection is theory-laden, revisable, not a given.
          *   (9) Sincere reports are the *best* evidence; theory shouldn't say the subject is wrong about how things *seem*.
          *   *Conflict:* If introspection is theory-laden (8), the subject can be wrong about the *nature* of the seeming. (9) protects the subject from being wrong about the *seeming* itself. This is a standard tension (infallibility of appearance vs. fallibility of judgment). It's manageable but needs careful wording. (9) says "how things seem," (8) says "introspection" (judgment about seemings). This might be a verbal distinction rather than a deep conflict, but it risks equivocation.

      *   **Tension E: (1) & (3) vs. (7).**
          *   (1) Physicalism. (7) Zombies incoherent.
