          *   *Diagnosis:* Inconsistency in ontological commitment to internal states. Why is the fish's nociception a "determinate fact" fixed by internal state, but the coffee taster's "juiciness" is "no fact of the matter"? Is it because fish can't report? But (4) says once reports *are* specified, there's no further fact. (5) says behavior isn't constitutive.
