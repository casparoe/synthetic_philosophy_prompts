answer: |-
  You are right. Your suspicion is correct. There are two different things you are calling "locked in," and conflating them is why your rule of thumb breaks on the Grandad vs. Kids cases.

  Your current rule ("small cause + high switching cost") fails because it measures **persistence**, but it doesn't measure **substitutability**.

  Here is the principle that actually fits your verdicts, split into the two concepts you suspected.

  ### The Two-Principle Framework

  **1. Structural Lock-in (The "QWERTY" Rule)**
  *   **Definition:** A system adopts a standard (often arbitrarily), and over time the cost of switching to a different standard becomes prohibitive due to coordination or infrastructure.
  *   **Test:** If we woke up tomorrow and wanted to change it, could we? (No, because it's too expensive/disruptive).
  *   **Cases:** The **Town Streets** and the **File Naming**.
  *   **Why:** In both, the *reason* for the choice was silly (bad crash/coin flip), but the *ecosystem* grew around it. The lock-in is about **friction**.

  **2. Causal Singularity (The "Butterfly" Rule)**
  *   **Definition:** A specific outcome relies on a unique chain of causality. If you rewind and change one small detail, *this specific thing* ceases to exist, even if a similar thing takes its place.
  *   **Test:** If we rewound and changed the cause, do we get the *exact same* specific entity? (No).
  *   **Cases:** The **Brother's Kids**.
  *   **Why:** This isn't about switching costs. You can't "switch" kids. It's about **identity**. There is no functional equivalent to *those* specific humans.

  **3. Convergent Attractors (The "Not Locked In" Rule)**
  *   **Definition:** The system tends toward a specific *type* of outcome regardless of the specific path taken. Small causes change the details, but not the general state.
  *   **Test:** If we rewound and changed the cause, would the *functional outcome* be roughly the same? (Yes).
  *   **Cases:** **Grandad's Job**, **Vowel Pronunciation**, **Keyboard Layout (Type)**.
  *   **Why:** Your grandad was going to work somewhere. The region was going to have a boundary. We were going to have a keyboard. The specific token is contingent, but the *type* is robust.

  ---

  ### Which Case Forces Which Part?

  *   **The Town Streets** force the **Structural** clause. Without the "high cost of switching" element, this is just a random event. It is the cost that makes it "locked."
  *   **The Grandad's Job** forces the **Substitutability** clause. This is the case that breaks your original rule. By your old rule (small cause + big cost to move family), it *should* be locked in. Your gut says it isn't. Why? Because the *function* (a life with a job) is substitutable. This forces us to add the "Functional Equivalence" test to the definition.
  *   **The Brother's Kids** force the **Split**. This case has high switching costs (impossible, actually) and a small cause, but it feels different from the Streets. It forces the distinction between *Systemic Inertia* (Streets) and *Historical Identity* (Kids).

  ---

  ### Running the Principle on New Cases

  Here are three ordinary cases to test the framework.

  **1. The Daily Commute**
  *   *Scenario:* You started driving a specific route to work five years ago because of a temporary roadworks closure. The closure is gone, but you still drive that route.
  *   *Verdict:* **Structural Lock-in.**
  *   *Reasoning:* Small cause (roadworks). High switching cost? Not financial, but cognitive (habit formation). If you decided to change, you could, but the "friction" of breaking the habit keeps you locked. It fits the QWERTY rule.

  **2. A Scar on Your Knee**
  *   *Scenario:* You fell off a bike at age 10. You have a scar.
  *   *Verdict:* **Causal Singularity.**
  *   *Reasoning:* Small cause (wobble). High switching cost? N/A. But if you rewound and you didn't fall, *that specific scar* does not exist. It is not substitutable. It fits the Kids rule. It is "locked" into your history, but not "locked" into a system.

  **3. Choosing a Supermarket**
  *   *Scenario:* You shop at Tesco because it was the first one that opened near you. Aldi opened later, cheaper, but you stay at Tesco.
  *   *Verdict:* **Structural Lock-in.**
  *   *Reasoning:* Small cause (timing). High switching cost (learning new layout, changing loyalty points, route change). If Aldi had opened first, you'd be locked into Aldi. This is pure path dependence.

  ---

  ### The Verdict I Can't Save

  I cannot save your verdict on **The Brother's Kids** under the label "Locked In."

  **You should drop the label, not the verdict.**
  Calling the kids "locked in" conflates them with the One-Way Streets. The streets are locked in because of *social coordination costs*. The kids are "locked in" because of *biological necessity*.
  *   **Recommendation:** Keep your intuition that the kids are "fixed," but classify them as **Singular** rather than **Locked In**. "Locked In" implies a system that *resists* change. A specific conception event doesn't resist change; it simply *is*. If you keep them in the "Locked In" bucket, you will forever struggle to distinguish them from the "Grandad's Job" bucket, because both involve high costs to alter the past. The difference is that the Job is *functionally replaceable*, and the Kids are not.

  **The Grandad Case:** Your verdict here is the strongest. It correctly identifies a **Convergent Attractor**. This is the most important insight you have: **Inevitability of Type vs. Contingency of Token.**

  ---

  ### What Would Change My Mind?

  I am an AI, so I don't have "beliefs," but I have a reasoning architecture. Here is where it is vulnerable:

  **1. The Bridge Argument**
  My reasoning would flip if you could show me a case where **Causal Singularity creates Structural Lock-in.**
  *   *Example:* If your brother's specific kids (Singular) grew up to design the file naming convention (Structural).
  *   *Why:* This would suggest the two principles aren't separate categories, but stages in a single process. Specific accidents create specific people, who build specific systems, which then become hard to change. If you can prove that *all* Structural Lock-in starts with Causal Singularity, then my separation is artificial.

  **2. The "Grandad" Counter-Argument**
  My reasoning on the Grandad case relies on the assumption that "a job is a job."
  *   *Challenge:* If you could show that the *specific* job he took had unique downstream effects that a different job would not (e.g., that specific boss introduced him to a specific ideology that changed his politics), then the Grandad case moves from **Convergent** to **Singular**.
  *   *Where I might be wrong:* I am assuming "roughly the same kind of life" is the metric. If the metric is "exact causal chain," then *nothing* is a Convergent Attractor. Everything is Singular. If you argue that *only* exact replication counts, my framework collapses into "Everything is Locked In."

  **3. The Definition of "Cost"**
  My framework assumes "cost" is objective (money, time).
  *   *Challenge:* If "cost" is emotional (e.g., Grandad staying in the city because he liked the *feel* of it), then the Grandad case becomes Structural Lock-in.
  *   *Where I might be wrong:* I am treating human preference as a variable, not a constraint. If preference is a constraint, then the Grandad case is locked in by his own psychology.

  ### Summary
  You have nailed the distinction between **Path Dependence** (Streets/Files) and **Convergent Evolution** (Grandad/Keyboards). Your confusion comes from trying to fit **Biological Singularity** (Kids) into the same bucket as Path Dependence.

  Split them.
  1.  **Hard to Change** (Streets, Files).
  2.  **Impossible to Replicate** (Kids, Scars).
  3.  **Easy to Swap** (Grandad, Vowels).

  Your gut was right to disagree with itself. It was trying to apply one rule to three different phenomena.
