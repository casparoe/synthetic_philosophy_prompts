          *   Identify the *single revision* that would clean up the most.
          *   Tone: Direct, analytical, no fluff, not fishing for a specific answer.

  2.  **Analyze the Six Points:**
      *   *Point 1 (Uncertainty as Reason):* Serious uncertainty + bad outcome = reason to act, even without probabilities. (Epistemic stance).
      *   *Point 2 (Procedural vs. Decision):* PP is procedural (burden of proof shift), not a decision rule (doesn't mandate bans). (Legal/Process stance).
      *   *Point 3 (Symmetry/Inaction):* Risks of inaction count equally. PP $\neq$ status quo bias. (Balance stance).
      *   *Point 4 (Catastrophe Exception):* If downside is catastrophic/irreversible, act against activity *even if* expected value (EV) says otherwise. (Lexical priority/Threshold stance).
      *   *Point 5 (No Fake Probabilities, Coherent Choices):* Don't use made-up probabilities for EV, but choices must be coherent (stable, order-independent). (Rationality/Consistency stance).
      *   *Point 6 (Reflexivity):* PP applies to itself (moratoriums have risks). (Meta-stance).

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: Point 2 vs. Point 4.*
          *   Point 2 says PP *never* tells you to ban anything (it's just a burden shift).
          *   Point 4 says in catastrophic cases, the case for acting *against* the activity is stronger, even against EV. This sounds like a decision rule (ban/stop), not just a procedure.
          *   *Severity:* High. This is a direct logical conflict between "never tells you to ban" and "act against the activity."

      *   *Tension B: Point 1 & 4 vs. Point 5.*
          *   Point 1 & 4 rely on acting without numbers (uncertainty, ignoring EV).
          *   Point 5 demands coherent choices (stability, order-independence).
          *   *Problem:* Standard decision theory (which guarantees coherence) relies on probabilities and utilities. If you reject "invented probabilities" (Point 5) but still want coherent choices under deep uncertainty (Point 1) while overriding EV in catastrophic cases (Point 4), you need a specific decision rule (like Minimax Regret or Lexical Priority). Without specifying *that* rule, Point 5 is hard to satisfy.
          *   *Severity:* Medium-High. It's a theoretical gap. You're asking for rationality without the standard tools of rationality.

      *   *Tension C: Point 3 vs. Point 4.*
          *   Point 3 says risks of inaction count *as much as* risks of action (Symmetry).
          *   Point 4 says if action is catastrophic, act *against* it even if EV says otherwise (Asymmetry/Weighting).
          *   *Severity:* Medium. Point 3 claims symmetry, Point 4 introduces a specific asymmetry for catastrophes. They can coexist if Point 3 is the general rule and Point 4 is the exception, but it weakens Point 3's rhetorical force.

      *   *Tension D: Point 2 vs. Point 6.*
          *   Point 2 says PP is procedural (burden of proof).
          *   Point 6 says moratoriums are interventions with risks.
          *   *Connection:* If PP is just procedural, applying it to itself (Point 6) just means shifting the burden of proof on the moratorium. This seems consistent actually.
          *   *Severity:* Low. These reinforce each other.

  4.  **Rank the Tensions:**

      1.  **Point 2 vs. Point 4 (The "Ban" Contradiction):** This is the most glaring. You can't say "it never tells you to ban" and then say "in this case, the case for acting against is stronger [implying a ban/stop] even against EV."
      2.  **Point 1/4 vs. Point 5 (The "Coherence without Probabilities" Problem):** Demanding coherence while rejecting the standard mechanism for coherence (probabilities) is theoretically risky. It leaves you open to money-pump arguments.
      3.  **Point 3 vs. Point 4 (The "Symmetry" Exception):** Claiming symmetry but then carving out a massive exception for catastrophes makes the symmetry claim feel hollow.

  5.  **Determine Resolutions and Costs:**

      *   *Resolve 2 vs. 4:*
          *   *Option A (Keep 2, Drop 4):* PP is *only* procedural. Catastrophes just mean a higher burden of proof. *Cost:* You lose the teeth to stop existential risks if the proponent manages to meet the procedural burden.
          *   *Option B (Keep 4, Drop 2):* PP *is* a decision rule in extreme cases. *Cost:* You lose the "moderate" defense of PP. Critics will call it a veto power.
      *   *Resolve 1/4 vs. 5:*
          *   *Option A:* Adopt a specific non-probabilistic decision rule (e.g., Maximin). *Cost:* Commits you to a specific formal framework you might not want.
          *   *Option B:* Soften Point 5. Admit coherence is an aspiration, not a guarantee, under deep uncertainty. *Cost:* Makes your position vulnerable to "irrationality" critiques.
      *   *Resolve 3 vs. 4:*
          *   *Option A:* Reframe Point 3. It's not "equal weight," it's "both count." *Cost:* Semantic precision, but less rhetorical punch.

  6.  **Identify the Single Best Revision:**
      *   The biggest logical hole is Point 2 ("On its own it never tells you to ban anything"). Point 4 explicitly creates a scenario where the PP *does* dictate an outcome (act against the activity) contrary to standard calculation.
      *   Fixing Point 2 to acknowledge that *extreme* cases turn the procedure into a substantive constraint resolves the conflict with Point 4 and clarifies Point 6 (since the moratorium risk assessment becomes part of that substantive constraint).
      *   Alternatively, fixing Point 4 to align with Point 2 (it just raises the burden of proof infinitely high) works, but Point 4 feels like the user's *actual* moral intuition. Point 2 feels like the defensive legal framing.
      *   *Recommendation:* Modify Point 2. It's the weak link because it's an absolute claim ("never") that Point 4 violates.

