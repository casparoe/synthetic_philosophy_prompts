answer: |-
  Here is the consistency check. You have a coherent *intuition*, but your *formalization* contains a direct logical contradiction and two significant theoretical vulnerabilities.

  Here are the tensions, ranked by severity.

  ### 1. The Logical Contradiction (Severity: Critical)
  **Conflict:** Point 2 vs. Point 4.
  *   **Point 2:** "On its own it **never** tells you to ban anything."
  *   **Point 4:** "Where the downside is catastrophic... the case for acting **against** the activity is stronger... even when expected-value... would come out the other way."
  *   **The Problem:** Point 2 defines the PP as purely procedural (shifting the burden). Point 4 defines it as substantive (dictating an outcome). If Point 4 is true, Point 2 is false. If the PP mandates acting against an activity despite positive expected value, it *is* functioning as a decision rule that effectively bans or blocks the activity.
  *   **What has to give:** You must abandon the absolute "never" in Point 2.
  *   **The Cost:** You lose the defensive shield that protects the PP from critics who call it a "veto button." You have to admit that under specific conditions, the PP *does* function as a substantive constraint, not just a process.

  ### 2. The Symmetry Lie (Severity: High)
  **Conflict:** Point 3 vs. Point 4.
  *   **Point 3:** Risks of inaction count "**for as much as**" risks of action. (Symmetry).
  *   **Point 4:** In catastrophic cases, the case against action is "**stronger**." (Asymmetry).
  *   **The Problem:** Point 3 claims a balanced scale; Point 4 weights one side of the scale heavier. While exceptions are allowed, framing Point 3 as a core principle ("counts for as much as") undermines Point 4. If catastrophic risk triggers asymmetry, then risks do *not* inherently count equally; they count equally only until a threshold is crossed.
  *   **What has to give:** Qualify Point 3.
  *   **The Cost:** Rhetorical simplicity. You can't claim the PP is perfectly neutral between action and inaction. You have to admit it has a bias toward avoiding irreversible catastrophe over securing potential gain.

  ### 3. The Coherence Gap (Severity: Medium)
  **Conflict:** Point 1 & 4 vs. Point 5.
  *   **Point 1 & 4:** Act without numbers / Ignore Expected Value (EV).
  *   **Point 5:** Choices must be coherent (stable, order-independent).
  *   **The Problem:** Standard decision theory guarantees coherence (Point 5) *through* probabilities and EV (which you reject in Point 1). If you discard probabilities but demand coherence, you need an alternative axiomatic system (e.g., Maximin, Minimax Regret, or Interval Decision Theory). Without specifying *which* non-probabilistic rule ensures coherence, Point 5 is an aspiration, not a method. You are vulnerable to "money pump" arguments (where an agent can be exploited into irrational cycles) if you reject EV without a replacement framework.
  *   **What has to give:** Soften Point 5 or specify the alternative framework.
  *   **The Cost:** Either you admit your choices might sometimes be inconsistent under deep uncertainty (weakening your rationality claim), or you commit to a specific mathematical formalism you may not want to defend in a workshop.

  ---

  ### The Single Revision

  **Revise Point 2.**

  It is the weak link because it makes an absolute claim ("never") that your own moral intuition (Point 4) violates. It is the easiest to fix and resolves the Critical tension immediately.

  **Current:**
  > "The PP is best read as a procedural rule rather than a decision rule: it shifts the burden of proof onto whoever wants to run the activity. On its own it never tells you to ban anything."

  **Proposed:**
  > "The PP is best read as a procedural rule that shifts the burden of proof onto the proponent of an activity. **While it usually avoids mandating specific outcomes, it acts as a substantive constraint when the potential downside is catastrophic and irreversible.**"

  **Why this cleans up the most:**
  1.  **Resolves 2 vs 4:** It aligns Point 2 with Point 4, admitting that procedure turns into substance at the extreme.
  2.  **Resolves 3 vs 4:** It implicitly acknowledges that the "symmetry" of Point 3 has a limit (the catastrophic threshold).
  3.  **Preserves Point 6:** It keeps the reflexive nature intact (the moratorium still bears a burden of proof, unless the *original* activity was catastrophic).
  4.  **Workshop Defense:** It prevents opponents from trapping you in a "So you'd ban a cure for cancer to save a butterfly?" scenario. You can say, "No, that's not catastrophic/irreversible, so the procedural rule applies, not the substantive constraint."

  **Summary:** Your position is robust, but Point 2 is over-defensive. Loosen the "never," and the rest of the structure holds.
