answer: |-
  (a) **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1: Common Knowledge, Rationality, and Coordination**

  Consider a finite extensive-form game of perfect information (e.g., the Centipede Game) and a coordination scenario involving imperfect communication.

  1.  **Definitions (5 marks):** Define common knowledge of an event $E$ in two ways: (i) iteratively (via finite orders of mutual knowledge) and (ii) as a fixed-point (self-evident event). Under what specific structural condition on players' information do these two definitions coincide? Explain why that condition matters.
  2.  **The Backward Induction Gap (10 marks):** It is often claimed that Common Knowledge of Rationality (CKR) implies the Backward Induction (BI) solution. However, CKR alone is insufficient. Identify the specific logical gap between CKR and BI. In your explanation, distinguish between defining rationality as "playing an optimal strategy ex-ante" versus "maximizing utility given beliefs at every node." Why does the occurrence of an unexpected move create a contradiction for CKR, and what extra assumption about counterfactual beliefs is required to sustain BI?
  3.  **Application (5 marks):** Two players must coordinate to succeed. They agree to communicate via a message system where each transmission has a small probability $\epsilon > 0$ of failure. Even if both players have arbitrarily high finite-order knowledge (e.g., "I know that you know...") that the message was sent, coordination may fail. Explain why "almost common knowledge" (high probability at all finite orders) does not yield the coordination guaranteed by true common knowledge. Why does the limit of probabilities not equal the probability of the limit here?

  ***

  (b) **Model Answer**

  **1. Definitions and Equivalence**
  Iteratively, an event $E$ is common knowledge if it lies in the infinite intersection of mutual knowledge operators: $E \subseteq K_i(E)$ for all $i$, $E \subseteq K_i K_j(E)$ for all $i,j$, and so on for all finite depths. As a fixed-point, $E$ is common knowledge if it is a self-evident event: if $E$ occurs, everyone knows $E$, and everyone knows that everyone knows $E$, such that $E$ implies the event "everyone knows $E$." Formally, $E \subseteq K_{all}(E)$, where $K_{all}$ is the common knowledge operator.

  These definitions coincide if and only if players' information structures are **partitional**. In a partitional model, knowledge operators satisfy the S5 axioms, specifically positive introspection (if I know something, I know that I know it). Without partitions (e.g., in non-partitional possibility sets), an agent might know $E$ without knowing that they know $E$, breaking the link between the infinite hierarchy and the self-evident fixed-point. The partition assumption ensures the "reachability" relation is an equivalence relation, allowing the infinite chain to collapse into the single fixed-point set.

  **2. The Backward Induction Gap**
  The gap lies in how rationality is treated at information sets that are not reached under the assumption of rationality. If CKR holds, no player should deviate from the BI path. However, BI requires specifying actions at *every* node, including those off-the-equilibrium path. If a player observes a deviation at an earlier node, they have observed an event that CKR deems impossible.

  If rationality is defined merely as **ex-ante strategy optimality**, a player chooses a complete plan at the start. CKR implies no one plans to deviate. But if a deviation occurs, the observer must update their beliefs. If they update rationally, they must conclude CKR is false (since a rational player wouldn't deviate). If CKR is false, the justification for playing the BI move at the current node collapses.

  To sustain BI, we need **sequential rationality** supported by specific counterfactual beliefs. We must assume that even after observing a deviation, players maintain the belief that opponents are rational *from this point forward*, or that the deviation was a "tremble" rather than a fundamental irrationality. The extra assumption is that knowledge of rationality is robust to contradictions: players act *as if* CKR holds even when history suggests it does not. Without assuming how beliefs are revised upon observing the "impossible," CKR cannot dictate play at later nodes. The paradox is that BI requires believing in rationality precisely when evidence suggests irrationality.

  **3. Application: Almost Common Knowledge**
  In the coordination scenario, success requires both players to act. If the message chain is finite (due to potential loss), there is always a last sender who is unsure if their confirmation was received. Even if $\epsilon$ is tiny, and $k$-th order knowledge is high for large $k$, true common knowledge requires the infinite fixed point.

  The failure occurs because the probability of the $k$-th order knowledge event converges to 1 as $k \to \infty$, but the event "Common Knowledge" has probability 0 if $\epsilon > 0$. This is a discontinuity. A player will not coordinate if they believe there is a non-zero chance the other player does not know they know... (ad infinitum). At some finite order $k$, the risk of mismatch (coordinating alone) outweighs the benefit, causing the chain of reasoning to unravel backward. High probability at every finite step does not sum to the certainty required for the fixed-point. Thus, "almost common knowledge" behaves qualitatively differently from common knowledge; the former allows for doubt about the other's doubt, which destroys the equilibrium.

  ***

  (c) **Marking Scheme**

  **Total: 20 Marks**

  **Part 1: Definitions & Equivalence (5 Marks)**
  *   **2 marks:** Correctly defines iterative view (infinite intersection of mutual knowledge).
  *   **2 marks:** Correctly defines fixed-point view (self-evident event / $E \subseteq K(E)$).
  *   **1 mark:** Identifies **partitional information structures** (or S5 axioms/positive introspection) as the condition for equivalence.
  *   *Deduction:* -1 if student claims they are always equivalent without conditions.
  *   *Typical Student Error:* Treating the iterative definition as merely "many levels" without specifying the infinite intersection.

  **Part 2: The Backward Induction Gap (10 Marks)**
  *   **3 marks:** Identifies that BI requires actions at **off-equilibrium nodes** (nodes reached only by deviation).
  *   **3 marks:** Explains the belief update problem: observing a deviation implies CKR is false, undermining the basis for future rational play.
  *   **4 marks:** Distinguishes **ex-ante strategy** vs. **sequential rationality/beliefs**. Notes that sustaining BI requires assuming rationality holds counterfactually (or via "trembles") despite evidence to the contrary.
  *   *Deduction:* -2 for claiming CKR automatically implies BI without qualification. -2 for failing to mention belief revision/off-path beliefs.
  *   *Typical Student Error:* Asserting that a rational player would never deviate, therefore the node is never reached, therefore the problem doesn't exist (ignoring the requirement to define strategies everywhere).

  **Part 3: Application (5 Marks)**
  *   **2 marks:** Explains that finite message chains mean some player is always unsure of the other's state at the margin.
  *   **3 marks:** Articulates the **discontinuity**: limit of probabilities $\neq$ probability of the limit. "Almost common knowledge" lacks the fixed-point certainty needed to rule out the risk of mismatch.
  *   *Deduction:* -2 if student argues coordination succeeds because probability is "high enough."
  *   *Typical Student Error:* Confusing "high probability mutual knowledge" with "common knowledge," assuming the risk vanishes as $\epsilon \to 0$.

  **General Penalties**
  *   **-1:** Use of citations/names (Aumann, Rubinstein, etc.).
  *   **-2:** Conflating "Mutual Knowledge" (1st order) with "Common Knowledge."
