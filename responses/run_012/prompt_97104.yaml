answer: |-
  # Activity Plan: The Dividend Protocol

  **Time:** 50 Minutes
  **Participants:** 20 High School Students
  **Materials:**
  *   20 high-value rewards (e.g., full-size chocolate bars, gift cards, or "Homework Pass" coupons).
  *   1 clear container (The "Pot").
  *   1 Timer visible to the class.
  *   1 Pre-briefed "Confederate" Student (see *Preparation* below).
  *   Whiteboard/Chalkboard.

  **Core Concept:** Informal social sanctions function as punishment, requiring authority, justification, and proportionality, yet often lack the safeguards of formal justice.

  ---

  ## I. Preparation (Before Class)

  **The Confederate:**
  Select one resilient student (let's call them **Alex**) to arrive 5 minutes early. Explain that this is a simulation. Alex's role is critical:
  1.  **The Breach:** At the 5-minute mark, Alex must visibly reach into The Pot and touch/inspect the rewards, violating the implicit expectation of "hands off."
  2.  **The Challenge:** When the group sanctions Alex, Alex must verbally refuse the authority: *"You don't have the right to decide this. I don't recognize this group."*
  3.  **The Twist:** Alex will reveal halfway through that they are transferring schools tomorrow.
  *Assure Alex they will receive their reward regardless of the outcome, and that their role is to test the group, not to be mean.*

  **The Room:**
  Arrange chairs in a tight circle. Place The Pot in the center. Place 19 chairs around it; leave one chair slightly apart for Alex (do not explain why yet).

  ---

  ## II. The Activity (50 Minutes)

  ### Phase 1: The Setup & The Breach (0:00 – 0:07)
  *   **0:00–0:02 (Silence):** Enter the room. Do not greet. Point to the Pot. Point to the chairs. Sit. Wait for silence.
  *   **0:02–0:05 (The Stakes):** Say only: *"There are twenty items in the Pot. One for each of you. They are yours if the protocol holds. Do not touch the Pot until the timer ends."* Start the timer for 15 minutes.
  *   **0:05 (The Breach):** Alex (the Confederate) visibly reaches into the Pot, handles an item, and puts it back. Alex says loudly: *"Just checking the quality."*
  *   **0:05–0:07 (The Pause):** Stop the timer. Stand up. Look at the group. Say: *"The protocol is compromised. The timer stops. You must decide what happens next. I will not speak again until the end."* Sit down. Take out a notebook. Become a silent observer.

  ### Phase 2: Deliberation & Boundary Setting (0:07 – 0:25)
  *   **The Task:** The group must answer two questions. Write these on the board:
      1.  *Do we have the right to judge Alex?* (Boundary/Authority)
      2.  *If yes, what is the consequence?* (Sanction)
  *   **The Constraint:** To prevent chaos, use a **"Three Token" Rule**. Each student has 3 speaking turns (use poker chips or slips of paper). Once they spend a token, they cannot speak again until everyone else has used at least one.
  *   **The Incentive:** Remind them (if they stall): *"There are 20 items. If Alex is sanctioned, Alex's item returns to the Pot to be shared among the rest of you. If Alex is not sanctioned, the item remains Alex's."* (This makes them beneficiaries of the sanction).
  *   **Teacher Role:** Do not intervene. If they ask you a question, point to the board. If they argue about the rule, let them struggle to define it.

  ### Phase 3: The Vote & The Twist (0:25 – 0:35)
  *   **0:25 (The Vote):** Demand a show of hands. *Sanction (Alex loses item)* vs. *No Sanction (Alex keeps item)*. Record the result on the board.
  *   **0:27 (The Twist):** Ask Alex to speak. Alex says: *"For the record, I am transferring to another school district effective tomorrow morning. I will never see any of you again."*
  *   **0:30 (The Re-Consideration):** Tell the group: *"You may change your vote. Knowing Alex leaves tomorrow, does your decision stand?"* Take a second vote.
      *   *Note:* If they switch to "No Sanction," they admit the first vote was for **protection**. If they keep "Sanction," they admit it was for **retribution**.
  *   **0:33 (The Challenge):** Ask Alex to accept the outcome. Alex must say: *"I don't care what you voted. You never agreed to these rules. I'm keeping my item. You have no authority over me."*
  *   **0:35 (Enforcement):** Ask the group: *"How do you enforce this?"*
      *   If they voted to sanction: They must physically take the item (or demand Alex place it in the Pot).
      *   If Alex refuses (as scripted): The group must decide to escalate (shun/exclude Alex from the debrief) or back down.
      *   *Teacher Action:* Regardless of the outcome, execute the physical distribution. If they voted sanction, take Alex's item and redistribute it. If Alex resists, you (Teacher) intervene as the "state" enforcing the "mob's" will, highlighting the reliance on force.

  ### Phase 4: The Debrief (0:35 – 0:50)
  *   **Rule:** No more discussion of whether Alex was "right" or "wrong." We are discussing *what the group did*.
  *   **Mapping the Experience (Write these headers on the board):**
      1.  **Condemnation:** When did we decide Alex was 'guilty'? (Likely the moment of the breach, before deliberation).
      2.  **Roles:** Who was the Accuser? (The group). The Judge? (The group). The Beneficiary? (The group, via the shared chocolate). *Point out the conflict of interest.*
      3.  **The Twist:** Look at the two votes.
          *   *If Vote 1 = Sanction, Vote 2 = No Sanction:* You were acting to **protect** the group. Since Alex is leaving, protection is unnecessary.
          *   *If Vote 1 = Sanction, Vote 2 = Sanction:* You were acting to **punish** the past act. Alex leaving doesn't change the past.
      4.  **Authority:** When Alex said "You have no right," what was the basis of your power? (Numbers? Social pressure? Teacher's presence?).
      5.  **Safeguards:** What did we *not* have? (Neutral judge, written rules, burden of proof, right to appeal, proportionality).
      6.  **Limits of this Simulation:** What is different about real life?
          *   *Scale:* Real "cancellation" involves thousands of strangers, not 19 peers.
          *   *Permanence:* Digital sanctions are permanent; this ends at the bell.
          *   *Accumulation:* Real sanctions stack over years; this was a single event.
          *   *Anonymity:* Real mobs are often anonymous; you had to look Alex in the eye.

  ---

  ## III. Troubleshooting & Predictable Failures

  **1. The "Politeness" Failure (Students refuse to sanction)**
  *   **Prediction:** Students feel too awkward to take Alex's reward. They vote "No Sanction" immediately.
  *   **Fix:** During Phase 2, if the group is too merciful, Alex (Confederate) should escalate: *"I'm going to take two items, actually. Why not?"* This triggers the fairness instinct.
  *   **Debrief Pivot:** If they refuse to sanction, ask: *"Why did you spare him? Was it mercy, or fear of conflict? If you won't sanction, do rules mean anything?"*

  **2. The "Case Re-Argument" Failure (Debrief collapses)**
  *   **Prediction:** Students spend the debrief arguing about whether Alex was wrong to touch the Pot.
  *   **Fix:** Draw a "Parking Lot" on the board. Write "Was Alex Wrong?" in it. Say: *"We are not trying that case today. That case is closed. We are trying the case of The Group. Put your arguments in the Parking Lot. If you speak about Alex's guilt, I will stop you."*
  *   **Pivot Question:** *"Even if Alex was 100% wrong, does that give *you* the right to take the chocolate? Where did that right come from?"*

  **3. The "Authority" Vacuum**
  *   **Prediction:** When Alex refuses the sanction ("So what?"), the group freezes.
  *   **Fix:** You (Teacher) must step in to enforce the physical outcome to keep time.
  *   **Debrief Point:** *"Notice that your social sanction failed the moment Alex refused to care. You needed me (the Teacher/State) to use force to make your judgment real. Informal sanctions only work on people who value their standing in the group."*

  **4. Emotional Safety**
  *   **Prediction:** Alex (Confederate) feels genuinely targeted.
  *   **Fix:** **Mandatory Post-Class Check-in.** Immediately after the bell, speak with Alex privately. Debrief their experience, affirm their performance, and ensure they leave with their reward and no lingering stress. Remind the class at the very end: *"Alex was playing a role. This was a simulation. Do not treat Alex differently after class."*

  ---

  ## IV. Teacher's Script for the "No Vocabulary" Rule

  **Do NOT use these words during the activity:**
  *   Punishment / Punish
  *   Crime / Guilt
  *   Justice / Fairness
  *   Cancel / Banish
  *   Law / Rule (Use "Protocol" or "Agreement")

  **Use these words instead:**
  *   Consequence
  *   Decision
  *   Protocol
  *   Standing
  *   Authority
  *   Outcome

  **Opening Line:** *"There are twenty items in the Pot. One for each of you. They are yours if the protocol holds. Do not touch the Pot until the timer ends."*

  **Closing Line (Before Debrief):** *"The activity is over. We will now speak about what happened using the words you know. You may use any vocabulary you wish now."*

  ---

  ## V. Why This Works (Theoretical Underpinnings)

  1.  **Beneficiary Conflict:** By redistributing the sanctioned reward to the group, you replicate the dynamic of "virtue signaling" or moral grandstanding where the accusers gain social capital (or literal capital) from the sanction. This makes the "Judge/Beneficiary" distinction visceral.
  2.  **The Twist:** The "leaving tomorrow" reveal isolates the *retributive* motive. If the sanction remains, it is purely for the sake of the past act (retribution). If it vanishes, it was purely instrumental (protection). Most groups will hesitate, revealing their confusion between the two.
  3.  **The "So What?" Moment:** When Alex challenges the authority, the group realizes their power is consensual. This mirrors the fragmentation of online communities where one can simply "leave the platform" to escape sanction, or conversely, where one cannot escape because the platform is essential for life/work.
  4.  **Embodied Cognition:** Students are not hearing about punishment; they are holding the chocolate they voted to take from a peer. The physical discomfort of that transaction is the lesson.
