      *   *Correction:* To ensure the activity finishes in 50 mins, the enforcement needs to be procedural. If the group votes sanction, the Teacher (as neutral admin) takes the chocolate. But the *Member* must verbally contest the authority.

      *Wait, I need to make sure the "Offender" isn't actually traumatized.*
      Use a **Confederate**. A student I speak to 5 minutes before class. "I need you to play a role. You will break a rule. You will challenge us. It's acting." This ensures safety.

