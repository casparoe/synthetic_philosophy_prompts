      *   **Title:** The Dividend Protocol.
      *   **Materials:** 21 Chocolates (20 for students, 1 spare for demo), Box/Envelope, Timer, Pre-briefing note for Confederate.
      *   **Roles:** The Assembly (19), The Member (1 Confederate), The Keeper (Teacher).
      *   **Steps:**
