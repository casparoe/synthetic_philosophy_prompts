      The offender must say: "I don't recognize this group's right to take my ticket."

  4.  **Developing the Plan (Iterative Process):**

      *   **Title:** The Covenant of Room 302 (or generic). Let's call it "The Compact."
      *   **Materials:** Index cards, a "Pot" (envelope with rewards), Timer.
