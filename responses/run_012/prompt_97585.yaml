      *Specific focus on "Insulation":* The danger is that "Organic Unity" becomes a magic wand. To avoid this, the Moorean needs a theory of *when* organic unity applies. Moore suggests "fittingness" or "appropriateness." If the user lacks this, the theory is vacuous.

