answer: |-
  You aren't misreading him. Borges was deliberately non-systematic; he treated metaphysics as literature rather than dogma. He would propose a theory of time in an essay, only to undermine it in a story or concede to empirical reality in the final paragraph (as you noted in *A New Refutation of Time*). The three pictures—instantaneous idealism, eternal return, and branching forks—are not bugs in his work, but features. He held them in suspension to show that time is likely unknowable, or that all models are equally fictional.

  The pantoum is actually the correct shape for this. Its structure forces lines to return (Circular), exist only in the moment of reading (Instant), and acquire new meanings based on their surrounding context (Branching).

  Here is the poem.

  The instant holds, then lets us go
  The path returns to where it started
  All outcomes bloom in single row
  We are the many and the parted

  The path returns to where it started
  A different name is on the door
  We are the many and the parted
  Nothing is lost, or gained, or more

  A different name is on the door
  The script is written in the dust
  Nothing is lost, or gained, or more
  The future waits because it must

  The script is written in the dust
  The instant holds, then lets us go
  The future waits because it must
  All outcomes bloom in single row

  ***

  **Note on liberties and debate:**
  Scholars debate whether Borges ever truly believed any of his metaphysical proposals or if they were purely aesthetic devices. This poem treats his conflicting views as a single, coherent system for the sake of the form, which Borges himself would likely have rejected. He preferred contradiction over resolution. Additionally, the pantoum's strict closure implies a completion that Borges' open-ended skepticism usually avoids; the poem forces a circle where Borges often left a fork.
