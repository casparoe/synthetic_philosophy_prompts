answer: |-
  ### The Decision Tree: Computation and the Limits of Rationality

  **Starting Commitment:** You accept that at least one problem central to a theory of reasoning, planning, or aggregation is hard for any procedure we could run.

  **Node 1: The Nature of the Barrier**
  Does the hardness proof demonstrate that *no* algorithm exists to solve the problem (undecidability), or that no algorithm exists which solves it *within a specific time bound* (intractability)?
  *   **No algorithm exists:** Proceed to Node 2.
  *   **No fast algorithm exists:** Proceed to Node 2.

  **Node 2: The Consistency of the Inference**
  Does the philosophical conclusion claim that the task is *impossible* for any mind (metaphysical impossibility), or merely *infeasible* for agents with our resources (practical impossibility)?
  *   **Proof is Intractability + Conclusion is Impossibility:** **Leaf A: Confusion Diagnosis.**
  *   **Proof and Conclusion match (or Proof is Undecidability):** Proceed to Node 3.

  **Node 3: The Specification of the Task**
  Does the theory being critiqued define the reasoning task as a function with a determinate domain and codomain (input-output specification), or is the task described only by its functional role in a system?
  *   **No determinate specification:** **Leaf B: Ill-Posedness Deflationism.**
  *   **Definite input-output specification:** Proceed to Node 4.

  **Node 4: The Scope of the Hardness**
  Does the hardness proof apply to the specific distribution of inputs an agent actually encounters in its environment, or only to mathematically constructed worst-case instances?
  *   **Only worst-case instances:** **Leaf C: Typical-Case Optimism.**
  *   **All relevant instances (or typical cases are hard):** Proceed to Node 5.

  **Node 5: The Ground of Feasibility**
  Is the boundary of what counts as 'feasible computation' fixed by the laws of physics (e.g., thermodynamic limits, speed of light), or by a mathematical convention (e.g., polynomial time on a Turing machine)?
  *   **Mathematical convention:** **Leaf D: Conventionalism.**
  *   **Laws of physics:** Proceed to Node 6.

  **Node 6: The Physical Limit**
  Does the physics of our universe permit computational processes that exceed the Turing/Polynomial model (e.g., via quantum advantage or analog hypercomputation)?
  *   **Yes, physics allows more:** **Leaf E: Physical Optimism.**
  *   **No, physics enforces the limit:** Proceed to Node 7.

  **Node 7: The Modality of the Claim**
  Is the conclusion that agents *do not* (and cannot) maximize the ideal (descriptive), or that agents *ought not be required* to maximize the ideal (normative)?
  *   **Descriptive (Agents cannot):** **Leaf F: Computationalist Constraint.**
  *   **Normative (Agents ought not be required):** Proceed to Node 8.

  **Node 8: The Normative Standard**
  If the requirement is waived or modified, is it because the 'ought' is tied to the agent's *actual* resources, because the ideal remains a *regulative standard* despite inaccessibility, or because the definition of rationality itself must change?
  *   **Tied to actual resources:** **Leaf G: Requirement-Abolitionism.**
  *   **Ideal remains regulative standard:** **Leaf H: Defense of Ideal Theory.**
  *   **Definition of rationality changes:** **Leaf I: Bounded-Rationality Reconstruction.**
  *   **Ideal is incoherent/abandoned:** **Leaf J: Radical Anti-Idealism.**

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf A: Confusion Diagnosis**
  *   **Position:** The argument relies on a category error between undecidability and intractability.
  *   **Awkward Commitment:** "The philosophical weight of this argument vanishes once you correct the complexity class."

  **Leaf B: Ill-Posedness Deflationism**
  *   **Position:** Complexity results cannot apply to theories that lack computational specifications.
  *   **Awkward Commitment:** "Your theory of reasoning is safe from complexity theory only because it is not yet a theory of computation."

  **Leaf C: Typical-Case Optimism**
  *   **Position:** Worst-case bounds are irrelevant to agents operating in structured environments.
  *   **Awkward Commitment:** "We can ignore the proof of hardness because the world is not adversarial enough to trigger it."

  **Leaf D: Conventionalism**
  *   **Position:** Feasibility classes are artifacts of our modeling choices, not facts about reasoning.
  *   **Awkward Commitment:** "Polynomial time is a sociological agreement among computer scientists, not a boundary of the mind."

  **Leaf E: Physical Optimism**
  *   **Position:** Physical reality may allow computations that abstract machine models forbid.
  *   **Awkward Commitment:** "The brain might solve NP-hard problems efficiently simply because physics is richer than Turing."

  **Leaf F: Computationalist Constraint**
  *   **Position:** Complexity results describe the actual limits of cognitive architecture.
  *   **Awkward Commitment:** "If the algorithm is intractable, then no mind, human or divine, could be running it."

  **Leaf G: Requirement-Abolitionism**
  *   **Position:** Normative obligations cannot exceed an agent's tractable capacity.
  *   **Awkward Commitment:** "You cannot be morally required to do what your hardware cannot compute in time."

  **Leaf H: Defense of Ideal Theory**
  *   **Position:** The ideal serves as a regulative fiction similar to a frictionless plane in physics.
  *   **Awkward Commitment:** "We must judge agents by a standard they are physically incapable of meeting."

  **Leaf I: Bounded-Rationality Reconstruction**
  *   **Position:** Rationality must be redefined as optimization relative to resource costs.
  *   **Awkward Commitment:** "It is rational to be wrong if being right is too expensive."

  **Leaf J: Radical Anti-Idealism**
  *   **Position:** The ideal of perfect rationality is an incoherent concept that misleads inquiry.
  *   **Awkward Commitment:** "The concept of perfect rationality is not just unreachable, it is nonsense."

  ***

  ### Analysis of the Space

  **Unoccupied or Incoherent Combinations**
  The tree reveals a significant vacuum at the intersection of **Node 7 (Normative)** and **Leaf J (Radical Anti-Idealism)**. While many argue the ideal is unreachable (Leaf H) or should be redefined (Leaf I), few coherently argue that the ideal is *normatively relevant* yet *conceptually incoherent*. To claim we "ought" to aim at a "nonsense" target is pragmatically self-defeating. This combination is occupied only by rhetorically aggressive papers that collapse into **Leaf G (Requirement-Abolitionism)** upon scrutiny. I mark this combination as **incoherent**.

  Similarly, **Leaf E (Physical Optimism)** combined with **Leaf G (Requirement-Abolitionism)** is **unexplored**. If physics allows hypercomputation (Leaf E), why abolish the requirement (Leaf G)? This view is unattractive because it concedes normative ground without descriptive necessity.

  **Indistinguishable Leaves**
  The tree cannot fully separate **Leaf F (Computationalist Constraint)** and **Leaf G (Requirement-Abolitionism)** in practice. Both result in the agent being excused from the optimization requirement. The distinction is purely metaphysical: one says the agent *cannot* (descriptive fact), the other says the agent *need not* (normative principle). In a seminar discussion, these will function identically unless you press hard on the *ought-implies-can* premise.

  **Where the "Shortcut" Lands**
  The argumentative shortcut you described ("NP-hard... therefore ideal of perfect rationality is a fiction") traverses the tree dangerously fast. It starts at **Node 1 (Intractability)**, skips **Node 3 (Specification)** and **Node 4 (Scope)**, assumes **Node 5 (Physical Limit)**, and jumps from **Node 7 (Normative)** directly to **Leaf J (Radical Anti-Idealism)**.
  It treats an intractability result as a descriptive impossibility (conflating Node 1 and Node 7) and then infers normative incoherence. It is a **Confusion Diagnosis (Leaf A)** masquerading as **Radical Anti-Idealism (Leaf J)**. It fails to distinguish between "cannot compute" and "ought not require," and between "worst-case" and "typical-case."

  **My Defense**
  I defend **Leaf H: Defense of Ideal Theory**.
  The "frictionless plane" analogy is not a dodge; it is a methodological necessity. Without an ideal standard, we cannot measure the *cost* of boundedness. If we redefine rationality to fit our limits (Leaf I), we lose the ability to criticize those limits as cognitive failures rather than adaptive features. The awkward commitment—"We must judge agents by a standard they are physically incapable of meeting"—is not a bug, but a feature of normative theory. It preserves the distinction between *excuse* (I couldn't do it) and *justification* (It wasn't required). The shortcut argument collapses this distinction, leaving us with no way to say an agent *should* have tried harder, even if they couldn't have succeeded. Ideal theory preserves the 'should' while acknowledging the 'couldn't'.
