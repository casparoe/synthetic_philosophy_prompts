      *   *Refining the "Friend's Suggestion":* Validate it. It's not moving goalposts; it's distinguishing between "leeway" and "source."

  7.  **Final Polish (checking against constraints):**
      *   Did I survey literature? No.
      *   Did I take a side? Yes (Frankfurt cases work, Marisol is blameworthy).
      *   Did I rank implications? Yes.
      *   Did I flag uncertainty? Yes (on the metaphysical cost).
