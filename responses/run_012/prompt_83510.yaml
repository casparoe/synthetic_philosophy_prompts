      *   **The Conflict:** Is Marisol blameworthy? Frankfurt cases argue yes (responsibility doesn't require alternate possibilities). The user sees a dilemma: If the backup matters, she's coerced/unfree. If it doesn't, it's irrelevant, and we're left with the bare claim that responsibility exists without alternate possibilities.
      *   **The Friend's Suggestion:** Maybe only the "deciding/trying" needs to be free, not the outcome.
