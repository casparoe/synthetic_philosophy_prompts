  8.  **Self-Correction during drafting:** I initially thought about telling them to hide the friend's plan from Marisol. But the prompt says "her best friend had quietly set things up." It implies Marisol might not know. I need to make sure I emphasize that *Marisol's ignorance* is the key to saving the Frankfurt case. If she knows, the case collapses into coercion. This is the most actionable advice.

