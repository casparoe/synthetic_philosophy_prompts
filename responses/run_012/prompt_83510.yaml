answer: |-
  Here is the position, the ranked implications, and the specific advice for your scene.

  ### The Position
  **The Frankfurt case holds.** Your dilemma ("Either the arrangement makes a difference or it doesn't") is a false dichotomy. The arrangement *exists* as a fact about the world, but it does not *causally intervene* in the actual sequence of events.

  Marisol is fully blameworthy. The existence of the friend's backup plan does not absolve her, nor does it render her unfree, provided one specific condition is met (see Implication #1). Your friend's suggestion about the "deciding" vs. the "outcome" is not moving the goalposts; it is the correct philosophical distinction between *regulative control* (could have done otherwise) and *guidance control* (owned the mechanism that did it).

  You do not need to give up the claim that a person can be responsible for something they couldn't have avoided. That is the core insight of the last 50 years of action theory. However, you must be precise about *why* she couldn't have avoided it.

  Here are the four implications that should change how you write the scene, ranked by importance.

  ### 1. The Epistemic Condition (Marisol Must Not Know)
  **Implication:** For Marisol to be blameworthy in a Frankfurt scenario, she cannot know about the friend's backup plan.
  **Why:** If Marisol knows the friend is ready to force her hand, the backup plan ceases to be a "counterfactual intervener" and becomes a *threat*. Even if the friend never speaks, if Marisol acts *because* she knows the alternative is forced compliance, she is acting under duress. Her will is not the sole source of the action; the threat is.
  **For the Scene:** You must write the scene so that Marisol's decision is made in ignorance of the safety net. The dramatic irony is for the *reader* (and the friend), not for Marisol. If she suspects, you must show her dismissing that suspicion. If she knows, the philosophical case collapses, and she becomes a coerced agent (or at least partially excused). Her isolation must be epistemic as well as physical.

  ### 2. The Actual Sequence (Motivation Over Options)
  **Implication:** The narrative weight must rest entirely on *why* she did it, not *that* she could have stopped.
  **Why:** Frankfurt cases shift the locus of responsibility from "alternate possibilities" to the "actual sequence." We blame her not because she had options, but because the action flowed from her own values, desires, and reasoning. The backup plan is irrelevant to her blame because it played no role in her deliberation.
  **For the Scene:** Do not waste word count on her wondering if she has a choice. She must not feel trapped. She must feel like the author of the betrayal. The tragedy isn't that she was forced; it's that she *wanted* to do it. The backup plan is a metaphysical cage, but her mind must be open. If you write her feeling relieved that she "had no choice," you undermine her blame. She must own the choice.

  ### 3. The Friend's Distinct Culpability
  **Implication:** The friend is morally distinct from Marisol, and potentially more culpable in a different way.
  **Why:** In Frankfurt cases, the "counterfactual intervener" (the friend) is morally evaluable separately. Marisol is blameworthy for the *action* (the betrayal). The friend is blameworthy for the *manipulation of the conditions* (removing the possibility of virtue). The friend treated Marisol as a puppet who just happened to dance on her own.
  **For the Scene:** This gives you a second arc. Marisol's sin is betrayal; the friend's sin is violation of agency. The friend didn't trust Marisol to be bad on her own; the friend ensured she *couldn't be good*. This makes the friend's betrayal of Marisol arguably deeper than Marisol's betrayal of the sister. The friend stole Marisol's moral freedom, even if Marisol didn't use it.

  ### 4. The "Flicker" of Freedom (Validating Your Friend's Suggestion)
  **Implication:** Your friend is right. The "freedom" that matters is the freedom of the *will*, not the freedom of the *outcome*.
  **Why:** This is the philosophical escape hatch you were looking for. It is not "moving the goalposts." It is distinguishing between having alternative possibilities (Leeway) and being the source of the action (Sourcehood). Marisol lacked Leeway (she couldn't have done otherwise). She retained Sourcehood (the decision came from her). Responsibility tracks Sourcehood.
  **For the Scene:** You can explicitly thematize this. Marisol can realize later that she was trapped, but the horror comes from the realization that *it wouldn't have mattered*. She would have done it anyway. That is the true character revelation: not that she was forced, but that the force was redundant. Her character is the kind of thing that betrays without needing a gun to its head.

  ### Where I Am Least Confident
  The only metaphysical cost you have to pay is **determinism**. For a Frankfurt case to work cleanly, the "sign" that would trigger the friend's intervention (Marisol wavering) must be reliably detectable *before* the action is inevitable. This implies a level of predictability about human psychology that borders on hard determinism.

  If you want to preserve a strong sense of "libertarian free will" (the magical ability to do otherwise in the exact same universe), Frankfurt cases are hostile to that. They require that her decision was determined by her character enough that the friend could bet on it. If you are writing a book that wants to champion radical, uncaused free will, this plot device undermines your theme. If you are writing a book about character as destiny, this plot device is perfect.

  ### Summary Instruction for the Draft
  1.  **Keep Marisol ignorant** of the friend's plan until after the deed is done (if ever).
  2.  **Write her deliberation as free.** She weighs reasons, not constraints.
  3.  **Make the reveal about redundancy.** The horror for Marisol (if she finds out) is not that she was controlled, but that her control was unnecessary. She is guilty *and* unfree, and the guilt stands.

  The dilemma you perceived sinks only if you think freedom requires the ability to do otherwise. Drop that requirement. Freedom requires only that the action comes from *you*. Marisol is the source. She is to blame. Write it that way.
