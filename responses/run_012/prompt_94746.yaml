answer: |-
  The envelope sat between them, white and sealed, a blank eye on the green felt. Leo tapped the table beside it. Elena watched his finger, not the paper.

  "Name the price," Leo said.

  "There is no price," Elena said. "There is only the procedure in the envelope. Until I know how the hand moves, the probability is undefined."

  "The circle is round," Leo said. "That's all I need. It doesn't care where it sits on the table. It doesn't care how big it is. If I shift the circle an inch, the odds don't change. If I shrink it, the odds don't change. That symmetry locks the probability at one-half."

  Elena shook her head. "You're confusing invariance with fact. You're describing three different ways to draw a line. Pick two points on the edge? That's one-third. Pick a radius, then a point on the radius? That's one-half. Pick a midpoint inside the disk? That's one-quarter. The math is exact for all three. The ambiguity isn't in the arithmetic, Leo. It's in the words 'at random'."

  "'At random' means I don't know the hand," Leo said. "If I don't know the hand, I assume the hand doesn't prefer a direction. If the hand doesn't prefer a direction, the distribution must be invariant under rotation. But rotation isn't enough. I also don't know the scale. I don't know the position. If I demand the odds stay the same regardless of where the circle is or how large it is, only one distribution survives. The one-half solution. It's the only one that respects the lack of information."

  "Respects the lack of information," Elena repeated. "You're turning your ignorance into a physical force. You're saying that because you don't know the bias, the bias must be zero. That's not mathematics. That's a wish."

  "It's a constraint," Leo snapped. "If I tell you I have a coin, and I tell you nothing else, you call it fair. Why?"

  "Because a coin is manufactured to be symmetric," Elena said. "And because the thumb flick introduces chaotic dynamics that wash out small asymmetries. The fairness is in the metal and the muscle, not in my head. If I hand you a coin made of lead on one side, it is not fair, even if you don't know it's loaded. Your ignorance doesn't make the odds fifty-fifty. It just means you'll lose money."

  Leo leaned in. "But I have to bet. The house demands a price. If I say 'undefined', I walk away. If I walk away, I lose the opportunity. I need a number. Symmetry gives me a number. It tells me that among all the ways to draw a chord, the ones that look the same under scaling and translation are the only ones I can trust. That gives me one-half."

  "So you bet on the symmetry," Elena said. "But the envelope contains a procedure. Maybe the house uses a computer that picks two angles uniformly. That's the one-third solution. It's a perfectly valid machine. It doesn't violate physics. It just violates your principle of indifference."

  "Then I'm wrong," Leo said. "But I have to be somewhere. So let's escalate. We don't know which of the three methods is in the envelope. So we treat the methods themselves as equally likely. One-third chance it's the endpoint method, one-third chance it's the radius method, one-third chance it's the midpoint method. We average the probabilities."

  Elena raised an eyebrow. "Arithmetic?"

  "Arithmetic," Leo said. "One-third plus one-half plus one-quarter. That's four-twelfths, six-twelfths, three-twelfths. Sum is thirteen-twelfths. Divide by three. The price is thirteen over thirty-six. Roughly thirty-six percent. I bet the length is short."

  "And why," Elena asked, "are there only three methods?"

  "Those are the standard ones."

  "Standard to whom?" Elena pressed. "I could define a fourth method. Pick a point inside the circle. Pick a point outside the circle. Draw the line between them. That's a different distribution. I could define a fifth. Pick a distance from the center according to a exponential decay. Why is the menu of methods limited to three? If you're indifferent among the methods, you must be indifferent among all possible methods. There are infinitely many ways to generate a chord. How do you average over an infinite set of algorithms without a prior weight?"

  Leo paused. He looked at the envelope. "Because those three are the natural parameterizations. They correspond to the natural variables: angle, distance, area."

  "Natural to whom?" Elena said. "You're smuggling in a preference for simplicity. You're saying, 'I am indifferent among the methods I can easily imagine.' That's not indifference. That's a bias toward human cognition. You've pushed the regress up one level. You were indifferent about the chords, now you're indifferent about the methods. But you haven't solved the indifference problem. You've just hidden it behind a menu."

  Leo exhaled, rubbing his temples. "Okay. Fine. The menu is arbitrary. But the symmetry argument... it feels robust. If the circle is perfect, the odds should be unique."

  "The circle isn't perfect," Elena said softly. "Look at the diagram on the table. It's chalk. It bleeds. The line has width. The edge is fuzzy. Your symmetry argument depends on a perfect circle, a perfect plane, a perfect throw. None of those exist. If the circle is slightly oval, your rotation invariance breaks. If the table is sloped, your translation invariance breaks. You are building a castle on a cloud and demanding the ground conform to it."

  "I'm not talking about the chalk," Leo said, his voice tightening. "I'm talking about the idea. The bet is on the idea of the chord."

  "The bet is on the envelope," Elena corrected. "The house will draw a line. Ink on paper. Or pixels on a screen. Those are physical events. Probability is a fact about the arrangement of the hand, the table, the arm that throws. If you don't know the arrangement, you don't know the probability. You can calculate frequencies, you can calculate propensities, but you cannot calculate them from ignorance."

  "So if I can't inspect the apparatus," Leo said, "I can't price the bet?"

  "If you can't inspect the apparatus, you can't claim the price is in the world," Elena said. "You can only claim the price is in you. You can say, 'Given what I know, I will act as if it is one-half.' But you cannot say, 'It is one-half.' That's the difference. One is a strategy. The other is a truth claim."

  Leo looked at her. "If I admit it's just a strategy, do I lose the edge?"

  "You lose the illusion that the universe owes you a living," Elena said. "But you gain honesty. You stop fighting the paradox and start managing the risk."

  Leo tapped the envelope again. "But if I manage the risk, I still need a number. If I say 'it's in me', what number do I pick? If I pick one-half, I'm using symmetry. If I pick thirteen-over-thirty-six, I'm averaging methods. If I pick nothing, I don't bet. Is there no ground where the number is forced?"

  "There is ground," Elena said. "But it's empirical. You have to watch the house. You have to see how they throw. If you see them spin a wheel, you bet one-third. If you see them drop straws, you bet one-half. Without the observation, the number is free."

  "So the same physical fact," Leo said, gesturing to the diagram, "the same line, the same circle... it carries three prices depending on how it was made."

  "It carries no price until it is made," Elena said. "The probability isn't in the chord. It's in the making."

  Leo sat back. He looked at the chalk circle, then at the envelope. "So if I bet one-half, I'm not betting on the chord. I'm betting that the house respects symmetry."

  "You're betting that the house is lazy," Elena said. "Symmetry is easy. It requires no specific mechanism. But laziness is a physical trait, not a logical one."

  Leo nodded slowly. "And if I bet on the average? The thirteen-over-thirty-six?"

  "Then you're betting that the house chooses its laziness from a menu you wrote," Elena said. "And that you know the menu."

  Leo picked up the envelope. It felt light. "So the question isn't what the probability is."

  "No," Elena said.

  "The question is whether my ignorance constrains the world, or only my wallet."

  Elena leaned forward, her eyes on the sealed paper. "Exactly. Does the lack of information create a fact, or does it just leave a hole?"

  Leo put the envelope down. He didn't open it. "If I open it, I know. If I don't, I have to choose. But I need to know if the choice is discovered or invented."

  "Can you tell the difference?" Elena asked.

  "Not until I lose," Leo said.

  "Not even then," Elena said. "Because if you lose, you won't know if you were wrong about the math, or wrong about the machine."

  Leo looked at the chalk circle. The line was thick, uneven. "So the same physical fact carries three prices because the fact isn't the line. The fact is the history of the line."

  "And you don't have the history," Elena said.

  Leo picked up the chalk. He drew a line through the circle. It wasn't straight. "Then I'm not betting on the chord," he said. "I'm betting on the hand."

  "And you haven't seen the hand," Elena said.

  "No," Leo said. "But I know my own."

  He pushed the chips forward. Elena didn't move to cover them. She just watched the chalk dust settle on the felt, waiting to see if he would open the envelope, or if he would leave the question inside.
