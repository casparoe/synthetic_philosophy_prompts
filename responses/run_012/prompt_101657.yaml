      *   **The Core Argument (Convergence vs. Consensus):**
          *   Define the difference. Consensus is people agreeing (social). Convergence is methods meeting (ontological).
          *   Example: Geochemistry. Radiometric dating, stratigraphy, paleomagnetism. They don't talk to each other, but they point to the same timeline.
          *   Contrast with Politics: Slavery, democracy. These change based on values, not external measurement. Judging Aristotle on modern human rights is Whiggish and unfair because there's no "measurement" of rights converging over time.
          *   Why Whiggism works in Science: Science is cumulative regarding *reference*. We are talking about the same electrons as Bohr, even if our model changed. We are *not* talking about the same "justice" as Hammurabi.

      *   **The Hard Cases (Defending the Position):**
