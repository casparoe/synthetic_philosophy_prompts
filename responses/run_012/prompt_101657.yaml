answer: |-
  You are not reinventing the wheel, but you are grasping a handle that many professional philosophers of science have fumbled. Your intuition as a geochemist is the strongest argument for scientific realism available: when mass spectrometry, stratigraphy, and paleomagnetism—all developed by different people, using different physics, in different labs—point to the same age of the Earth, you are not looking at a social consensus. You are looking at a constraint imposed by reality.

  Here is the argument for why Whig history is not just permissible in the natural sciences, but necessary, and why it remains a vice in moral and political history. Then, I will show you where the floor gives way.

  ### The Argument for Scientific Whiggism

  The standard critique of Whig history is that it imposes present-day values on the past, distorting the context in which historical actors operated. In moral and political history, this critique is devastating and correct. If you judge Aristotle by the standards of 21st-century human rights, you learn nothing about Aristotle, and you learn nothing about rights. You merely indulge in self-congratulation. This is because moral and political "truths" do not converge; they oscillate. There is no independent meter outside of human agreement to measure "justice." Therefore, in moral history, the present is just another data point, not the destination.

  In the natural sciences, the situation is ontologically different. Science is not merely a conversation among scientists; it is an interrogation of a non-human reality. That reality pushes back.

  **1. Convergence as the Anchor of Truth**
  The defense of Whig history rests on the distinction between *consensus* and *convergence*. Consensus is social; it is what a room of people agree on. Convergence is structural; it is what happens when independent lines of inquiry intersect.

  In your field, the age of the Earth was not decided by a vote. It was decided because uranium-lead dating, lead-lead isochrons, and the cooling rates of meteorites converged. When independent methods constrain a variable to the same narrow range, the probability that this result is merely a cultural artifact approaches zero.

  Because this convergence exists, the present *is* epistemically privileged. We literally know more about the structure of the atom than Bohr did, not because we are smarter, but because we have more convergent data. Therefore, judging Bohr by our current standards is not anachronistic; it is an accurate assessment of his proximity to the truth. To refuse to do so—to treat Bohr's model as "true for his time" in the same way we might treat slavery as "acceptable for his time"—is to deny that science makes contact with reality. It reduces science to mere folklore.

  **2. Reference and Continuity**
  A common anti-Whig argument is that scientists in the past were talking about different things than we are. When Priestley burned calx, he was talking about phlogiston, not oxygen. Therefore, we cannot say he was "wrong" about oxygen.

  This collapses under the weight of successful intervention. If Priestley's experiments allow us to build a combustion engine today, then whatever he was manipulating, it was *oxygen*, regardless of what he called it. The reference of scientific terms is fixed by the causal structure of the world, not the internal mental state of the scientist.

  Whig history is the only historiography that respects this continuity. It traces the lineage of *reference*. It acknowledges that Lavoisier was getting closer to the actual causal machinery of the universe than the alchemists. To treat alchemy and chemistry as merely "different paradigms" of equal validity is to ignore that one allows you to synthesize ammonia and the other does not. In natural science, success is not relative. Because success is not relative, history can be teleological without being fictional. There really is a direction.

  **3. The Ethical Necessity of Scientific Whiggism**
  Finally, there is a pragmatic reason to accept Whig history in science. We train scientists by teaching them the current best models. We do not teach geology students that the earth might be 6,000 years old "in the context of 17th-century theology." We teach them that it is 4.54 billion years old, and we show them why the 17th-century view failed.

  If we apply strict contextualism to science history, we undermine the pedagogy of science itself. We imply that current theories are just the "current consensus" rather than the "current best approximation of reality." Whig history validates the enterprise. It tells the student: "You are standing on a platform that is higher than the one your predecessors stood on, because the platform is built on rock, not sand."

  ### Where the Argument Breaks Down

  You asked for the hard cases. The argument above holds water only as long as "convergence" is clear and "reality" is passive. But there are three points where the Whig defense fractures, even in the hard sciences.

  **1. The Illusion of Inevitability**
  Whig history tends to smooth over the contingency of discovery. It makes the current convergent result look inevitable. It suggests that if Mendel hadn't found genes, someone else would have immediately, because the "truth" was waiting to be found.

  But history shows that viable alternative pathways often exist. In the late 19th century, there were multiple viable formulations of mechanics and thermodynamics. Some were discarded not because they were empirically wrong, but because they were mathematically cumbersome or didn't fit the aesthetic preferences of the leading figures.

  If we write Whig history, we erase the "roads not taken." This is dangerous because those roads might become relevant again. For example, deterministic interpretations of quantum mechanics were sidelined by the Copenhagen interpretation (a consensus choice, not a convergent necessity). A Whig historian treats Copenhagen as the "victory of truth." A contextual historian sees it as a sociological victory. If we ever need to return to deterministic models for quantum computing, the Whig narrative has made that intellectual path look like "heresy" rather than "abandoned option." Whiggism can calcify dogma by hiding its own contingency.

  **2. The Theory-Ladenness of "Independent" Methods**
  Your argument relies on independent lines of evidence converging. But how independent are they? In geochemistry, you might use three different isotopic systems. But all three rely on the same underlying nuclear physics, the same assumptions about decay constants, and the same instrumentation logic.

  If there is a fundamental flaw in the background theory (the "paradigm"), all "independent" methods will converge on the *wrong* answer with high precision. For centuries, astronomers converged perfectly on a geocentric model. They had math, observation, and prediction all aligning. A Whig historian looking from the 17th century back would have said, "Ptolemy was getting closer to the truth." We now know they were converging on a falsehood.

  This means the "privilege of the present" is temporary. We are likely Ptolemaic in some ways we cannot yet see. A strict Whig history risks enshrining current errors as the final judgment on the past. It lacks humility. It assumes the convergence we see now is the *final* convergence, rather than a local maximum.

  **3. The Bleed-Over into Policy and Application**
  The cleanest break between natural science and moral history is when science stays in the lab. But science rarely stays there. When geochemistry becomes climate policy, or when genetics becomes eugenics, the "convergence" of the science gets entangled with the "consensus" of the politics.

  A Whig historian might look at 1920s eugenics and say, "They had the genetics wrong, so they were bad scientists." But often, they had the genetics *right* (Mendelian inheritance was known) but the *moral valuation* wrong. If you apply Whig history here, you conflate the empirical error with the moral error. You imply that if they had better data, the morality would have fixed itself.

  This is the most dangerous breakdown. It suggests that moral progress works like scientific progress—that we just need more data to converge on "human rights." But human rights do not behave like isotopes. They do not converge without struggle. By treating the history of science as a pure march toward truth, we risk importing that teleology into the social sphere, assuming that technology inevitably brings moral improvement. It does not.

  ### The Verdict

  Your intuition is robust. In the natural sciences, Whig history is functionally true because there is an external anchor (nature) that allows for genuine progress. We are justified in saying the present knows more than the past because our models allow for interventions the past could not achieve.

  However, you must treat Whig history as a *tool*, not a *metaphysic*. It is valid for tracing the lineage of *reference* (what we are talking about) and *predictive power* (what we can do). It is invalid for tracing the *inevitability* of discovery or for judging the *rationality* of past actors who lacked our data.

  The line you drew—convergence vs. consensus—is the correct razor. But you must remember that what looks like convergence today may look like a local cluster in a century. Write the Whig history, but leave a margin note for the future geochemist who will find your "convergent truths" to be merely the next layer of approximation.
