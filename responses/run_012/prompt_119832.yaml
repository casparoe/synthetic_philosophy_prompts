answer: |-
  ### The question

  **Final Examination: Formal Epistemology and Decision Theory**
  **Question 4**

  Consider the following variant of the two-envelope problem. A host tosses a fair coin. On Heads, she places $10 in one envelope and $20 in the other. On Tails, she places $20 in one envelope and $40 in the other. She shuffles the envelopes. You select one at random, open it, and observe the amount $X$. You must then decide whether to keep $X$ or switch to the other envelope.

  (1) For each possible value of $X$, determine whether you should keep or switch. Calculate the conditional expected gain or loss from switching for each $X$.
  (2) Calculate the expected value of your winnings under three policies: (i) Always Keep, (ii) Always Switch, and (iii) the optimal state-dependent policy derived in (1). Show that (i) and (ii) yield identical expected values, while (iii) is strictly superior. Explain this result.
  (3) Relate this to the standard paradoxical argument that the other envelope contains $2X$ or $X/2$ with equal probability. What prior distribution over amounts does this assumption imply? Why does it fail here? What kind of prior would be required for it to hold for all $X$?
  (4) Briefly conclude: Does any paradox remain? Is this a defect in decision theory, a lesson on conditioning, or merely a resolution of error? Distinguish clearly between arithmetic facts and interpretive claims.

  ***

  ### Model answer

  **(1) Conditional Decisions**
  The possible observations are $X \in \{10, 20, 40\}$.
  If $X=10$: This occurs only on Heads. The other envelope must contain $20$. Switching yields a certain gain of $+10$. Optimal move: Switch.
  If $X=40$: This occurs only on Tails. The other envelope must contain $20$. Switching yields a certain loss of $-20$. Optimal move: Keep.
  If $X=20$: This occurs on Heads (other is $10$) or Tails (other is $40$). Since the coin is fair and envelope selection is random, these cases are equiprobable. The expected value of the other envelope is $0.5(10) + 0.5(40) = 25$. Switching yields an expected gain of $25 - 20 = +5$. Optimal move: Switch.

  **(2) Policy Expected Values**
  There are four equiprobable states (probability $0.25$ each): (Heads, pick $10$), (Heads, pick $20$), (Tails, pick $20$), (Tails, pick $40$).
  **Always Keep:** Winnings are $10, 20, 20, 40$. Expected Value (EV) = $(10+20+20+40)/4 = 22.5$.
  **Always Switch:** Winnings are $20, 10, 40, 20$. EV = $(20+10+40+20)/4 = 22.5$.
  The constant policies are tied because switching merely swaps the contents of the envelopes ex ante; without conditioning, the labels are symmetric. No gain is possible without information.
  **Optimal Policy:** Switch on $10$ and $20$; Keep on $40$.
  Winnings: (Heads, pick $10 \to$ switch to $20$), (Heads, pick $20 \to$ switch to $10$), (Tails, pick $20 \to$ switch to $40$), (Tails, pick $40 \to$ keep $40$).
  Values: $20, 10, 40, 40$. EV = $(20+10+40+40)/4 = 27.5$.
  The optimal policy is strictly superior because it exploits the information contained in $X$. Conditioning breaks the symmetry present in the ex ante calculation, allowing the agent to avoid unfavorable switches (when $X=40$) while retaining favorable ones. This demonstrates the positive value of information.

  **(3) The Prior and the Paradoxical Step**
  The standard argument assumes $P(\text{other}=2X) = P(\text{other}=X/2) = 0.5$ for any observed $X$. This presupposes a prior distribution where every pair $\{k, 2k\}$ is equally likely. In this scenario, that assumption holds only for $X=20$. It fails for $X=10$ and $X=40$ because the prior is bounded; the probabilities collapse to 1 or 0 at the boundaries. For the assumption to hold at *every* amount, the prior would need to be uniform over an infinite range of values. Such a distribution is improper (it cannot be normalized to sum to 1), making the expected value calculations undefined. If one insists the step holds everywhere, one accepts an infinite expected value for both envelopes, rendering the comparison meaningless.

  **(4) Conclusion**
  Arithmetically, nothing remains paradoxical; the calculations are consistent once the prior is specified. The residue is not a defect in decision theory but a lesson on the value of conditioning. The "paradox" arises from treating an unknown quantity as a random variable with a specific distribution while simultaneously treating it as a fixed constant, or implicitly assuming an impossible prior. The superior performance of the conditional policy demonstrates that information has positive value. Students must distinguish the settled arithmetic (the EVs above) from the interpretive claim (that rational agents should condition on available information). Conflating the impossibility of the uniform prior with a failure of expected utility theory is a category error.

  ***

  ### Marking scheme

  **Total: 20 Marks**

  **1. Conditional Analysis (5 Marks)**
  *   **Move:** Correctly identifies optimal move for $X=10$ (Switch), $X=20$ (Switch), $X=40$ (Keep).
  *   **Move:** Correctly calculates conditional expected gains: $+10$, $+5$, $-20$.
  *   **Common Error:** Treating $X=20$ as having unequal probabilities for the other envelope being $10$ or $40$, or claiming switching is neutral at $20$.

  **2. Expected Value Calculations (5 Marks)**
  *   **Move:** Correctly computes EV for Always Keep ($22.5$) and Always Switch ($22.5$).
  *   **Move:** Correctly computes EV for Optimal Policy ($27.5$) and explains the tie vs. superiority via symmetry breaking and information value.
  *   **Common Error:** Calculating the Optimal EV incorrectly (e.g., averaging the conditional gains rather than total winnings) or failing to explain why constant policies tie.

  **3. Prior Distribution Analysis (5 Marks)**
  *   **Move:** Identifies that the standard argument implies a uniform prior over pairs $\{k, 2k\}$.
  *   **Move:** Explains that this requires an improper prior over an infinite range to hold for all $X$, and notes the bounded prior here causes the assumption to fail at edges.
  *   **Common Error:** Claiming the standard argument is valid but decision theory is flawed, or failing to identify the prior as improper/infinite.

  **4. Conclusion and Interpretation (5 Marks)**
  *   **Move:** Clearly distinguishes settled arithmetic (no paradox in math) from interpretive claims (lesson on conditioning).
  *   **Move:** Concludes that the paradox dissolves into error management regarding priors and conditioning, not a defect in theory.
  *   **Common Error:** Conflating the arithmetic resolution with the philosophical interpretation, or claiming the paradox remains unresolved despite the calculations.
