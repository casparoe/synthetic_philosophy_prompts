answer: |-
  **Proposal Title:** The Architecture of Accountability: A Normative Account of Joint Action

  **1. The Research Question**

  Contemporary debate regarding collective intentionality is predominantly organized around a psychological query: *What configuration of individual mental states is necessary and sufficient for a group to act as one?* The dominant families of answers converge on the idea that joint action requires a specific, robust alignment of attitudes—whether characterized as interlocking shared intentions, a constitutive joint commitment, or a primitive we-intention. These accounts assume that the unity of the action is secured from the "inside out," by matching the participants' minds.

  This paper will pursue a different line of inquiry. It operates on the suspicion that the psychological alignment standardly demanded is neither necessary nor sufficient for the phenomena we pre-theoretically identify as joint action. Specifically, it targets cases where participants engage in coordinated activity while harboring divergent commitments, private doubts, or legitimate expectations of abandonment. In such cases, the "meeting of minds" is absent or fractured, yet the activity retains the normative texture of joint action: participants owe one another explanations, notice, and coordination.

  Therefore, the precise research question is: **Is the unity of joint action constituted by a convergence of psychological states, or by a distributed structure of mutual accountability?**

  This question is framed to demand a determinate answer regarding the *order of explanation*. If the psychological account is correct, normative obligations (the standing to demand, the duty to notify) are downstream consequences of a prior mental alignment. If the proposed normative account is correct, the structure of accountability is constitutive; the mental states are either secondary adaptations to this structure or irrelevant to the classification of the action. The paper will argue for the latter: that joint action is fundamentally a division of normative labor, not a synchronization of mental states.

  **2. The Gap in Existing Positions**

  The existing literature falls into three broad families. The first locates jointness in **Shared Intention**, requiring that each participant intends the joint outcome in part because the other does, with meshing sub-plans. The second locates it in **Joint Commitment**, positing that participants jointly commit to a goal, thereby creating a plural subject with inherent obligations. The third treats **We-Intention** as a primitive, irreducible mental state distinct from individual intention.

  While these positions disagree on the specific mental architecture required, they share a structural blind spot. They all treat the "clean" case—full voluntary commitment, shared certainty, and stable participation—as the paradigm. Consequently, they treat "messy" cases (partial commitment, anticipated exit, private reservation) as degenerate, borderline, or failures of joint action. For the Shared Intention view, if I intend to work with you but believe you will quit, the interlocking condition fractures. For the Joint Commitment view, if I do not genuinely commit because I expect to leave, the plural subject is not formed.

  This is not merely a disagreement about boundary conditions; it is a failure to recognize the phenomenon in question. The gap exists because these accounts are methodologically committed to *psychologism*. They assume that because action is guided by mind, joint action must be grounded in a joint *type* of mind. This commitment forces them to view normative relations (obligations, standing, entitlements) as *products* of the mental state. One cannot have the obligation unless one first has the commitment/intention.

  The proposal identifies a gap where the explanatory order is reversed. In the messy cases I intend to analyze, the normative relations often persist *despite* the fragmentation of mental states. Two co-authors may proceed without shared confidence, yet each retains the standing to demand draft revisions from the other. A couple may stay together provisionally, yet retain rights to demand fidelity within the provisional term. Existing accounts cannot capture this without distorting the mental states (e.g., by insisting the agents *must* secretly commit more than they feel they do) or by excluding the cases from the category of joint action entirely.

  The gap is not an oversight that can be patched by widening the criteria for "shared intention." It is a consequence of the debate's setup, which prioritizes the *attitude* over the *relation*. By shifting the focus from the content of the agents' heads to the structure of their normative interaction, this project addresses a question the existing families render unaskable: *Can joint action exist where the psychological ground is unstable, provided the normative structure holds?*

  **3. Methodology and Plan of Work**

  The method for this project is conceptual analysis driven by case comparison, but it differs from the standard method of "counter-example generation." Simply adding more cases to the existing debate allows mentalist accounts to absorb them by adding complexity to the required mental states (e.g., "weak shared intention," "conditional commitment"). To avoid this, the method will focus on the *explanatory direction* of the norms.

  The semester will be divided into four phases:

  **Phase 1: Reconstruction and Limit Mapping (Weeks 1–4)**
  I will reconstruct the strongest version of the mentalist consensus without relying on specific authorial exegesis. The goal is to formalize the condition: *Mental Alignment $\rightarrow$ Normative Obligations.* I will then catalogue the "messy" cases (the co-authors, the provisional couple, the subcontractor) and demonstrate that in each, the Mental Alignment condition is plausibly absent while the Normative Obligations condition is plausibly present. This establishes the divergence.

  **Phase 2: The Overgeneration Challenge (Weeks 5–8)**
  A normative account risks overgenerating. If joint action is just about accountability, why is the "sidewalk dance" (two strangers smoothly avoiding collision) not joint action? They coordinate, and one might even feel a mild normative pressure not to crash.
  To solve this, I will develop a criterion of **Normative Standing**. In the sidewalk case, if I walk into you, you may be annoyed, but you lack the *standing* to demand I change my path *before* I move, nor do I owe you notice if I step aside. In genuine joint action, participants grant one another a specific authority to direct the other's contribution.
  I will test this distinction against the messy cases. Does the subcontractor have standing to demand the general contractor not cut them loose without notice? If yes, it counts as joint action. If no, it is mere coordination. This phase ensures the theory distinguishes *joint action* from *mere interlocking behavior*.

  **Phase 3: The New Case Prediction (Weeks 9–11)**
  To demonstrate the predictive power of the account, I will apply it to a case not yet discussed: **The Provisional Political Alliance**.
  *Case Description:* Two opposing political factions agree to vote together on a specific bill to defeat a third party. Both parties publicly state that this alliance ends immediately after the vote and that they intend to oppose each other on the very next bill. Neither expects the other to maintain the alliance beyond the specific vote.
  *Prediction:* The mentalist accounts will struggle here. There is no shared intention for a long-term goal, and the commitment is explicitly bounded and fragile. A Shared Intention account might classify this as two parallel individual actions rather than a joint one.
  *My Account's Prediction:* This *is* joint action. Why? Because during the voting window, each faction has the standing to demand the other hold their vote. If Faction A defects early, Faction B is entitled to rebuke them for violating the terms of the alliance, even if those terms were temporary. The normative structure (the specific rights to demand compliance for the duration of the vote) constitutes the jointness, regardless of the lack of long-term psychological alignment.
  I will use this case to show that the normative account captures intuitive judgments that the mentalist account misses or must complicate excessively.

  **Phase 4: Synthesis and Drafting (Weeks 12–15)**
  I will integrate the findings into a unified argument. The draft will argue that mental states in joint action are often *responses* to the normative structure (e.g., I intend to do my part *because* I am accountable to you), rather than the *ground* of it. The final paper will articulate the "Normative Labor" view: joint action is the undertaking of a specific division of rights and duties regarding the action's performance and termination.

  **Why this method?**
  The obvious alternative is to argue that the mentalist conditions are too strict and propose a "weaker" mental condition. I reject this because it keeps the debate on terrain that favors psychologism. By shifting the ground to normative standing, I force a choice between two different categories of explanation. This approach prevents the project from becoming a mere negotiation over the threshold of "sharedness" and instead questions whether "sharedness" is the right metric at all.

  **4. Form of Result and Conditions of Failure**

  **Form of Result**
  The successful outcome will be a positive account of joint action defined by three necessary conditions of normative structure:
  1.  **Mutual Vulnerability:** Each participant's success depends on the other's contribution.
  2.  **Standing to Demand:** Each participant has the specific authority to demand the other's contribution and to rebuke non-compliance.
  3.  **Regulated Exit:** There are understood terms (explicit or implicit) regarding how and when a participant may withdraw, creating an obligation of notice.

  The paper will conclude that where these three conditions obtain, joint action exists, regardless of the stability or convergence of the participants' private mental states. The mental states (intentions, beliefs) will be characterized as typical *effects* of entering this normative structure, not its causes.

  **Conditions of Failure**
  I identify three specific ways this project could fail, which I will monitor during Phase 2 and 3:

  1.  **The Reduction Failure:** It may turn out that "Normative Standing" cannot be defined without covertly referencing mental states. For example, if having "standing" just means "believing one has standing" or "expecting the other to recognize one's standing," then the account collapses back into psychologism. If I cannot articulate standing as an objective social fact independent of the agents' current beliefs, the project fails.
  2.  **The Sidewalk Collapse:** If I cannot find a principled difference between the normative standing in the "Provisional Alliance" and the mild expectations in the "Sidewalk Dance," the account overgenerates. If strangers on a sidewalk have *some* standing to expect coordination, the distinction becomes one of degree rather than kind. If the distinction is merely degree, the account fails to identify the *constitutive* feature of joint action.
  3.  **The Intuition Reversal:** In the messy cases (co-authors, subcontractors), it may be that upon reflection, the intuition is actually *against* me. It might be that if the co-authors truly expect the other to quit, we *should* say they are not really collaborating, but merely engaging in parallel play until the break. If the pre-theoretical intuition strongly favors the mentalist view in these edge cases, the motivation for the normative account evaporates.

  I consider the **Reduction Failure** the most significant risk. To mitigate this, I will rely on analogies from institutional roles (e.g., a judge has standing to sentence a defendant regardless of the judge's private mental state) to argue that standing can be role-based and structural rather than psychological.

  **5. Scope and Limitations**

  **Scope**
  This project is limited to **Small-Scale Joint Action**. It focuses on dyads or small groups where face-to-face normative negotiation is possible (co-authors, couples, subcontractors, political factions). It does not attempt to account for large-scale institutional action (e.g., "The Corporation acted," "The State declared war"). Large-scale cases introduce complexities regarding representation and aggregation that would overwhelm a 6,000-word paper and distract from the core argument about interpersonal accountability.

  **Potential Bloat and Trimming**
  1.  **Meta-Ethics of Standing:** A deep dive into the metaphysics of "normative standing" could easily consume the entire word count.
      *   *Trim:* I will treat standing as a primitive normative relation for the purposes of this paper. I will argue *that* it constitutes joint action, not *what* standing is in the grand scheme of meta-ethics.
  2.  **Historical Exegesis:** There is a temptation to engage deeply with the specific variations of the three mentalist families.
      *   *Trim:* I will treat them as a unified "Mentalist Family" regarding their shared commitment to psychological grounding. I will address their differences only where they impact the specific "messy" cases.
  3.  **Moral vs. Normative:** The account relies on "obligations" and "entitlements." There is a risk of conflating moral obligations with normative expectations internal to a practice.
      *   *Trim:* I will explicitly restrict the obligations to *internal* normative pressures (the rules of the activity) rather than external moral duties. The subcontractor's claim is based on the practice of contracting, not necessarily on universal morality.

  **Feasibility**
  The 6,000-word target is sufficient to define the three conditions of the Normative Labor view, apply them to the messy cases, and handle the sidewalk counter-example. It is tight for the "Provisional Alliance" case study, so I will keep the description of that case concise, focusing only on the features relevant to standing and exit terms. If the argument regarding the "Reduction Failure" proves too complex, I will narrow the scope to argue only that the normative account is *better* than the mentalist account, rather than claiming it is the *sole* constituent, thereby lowering the burden of proof for a one-semester project.

  **Conclusion**
  This proposal outlines a shift from the philosophy of mind to the philosophy of norms within the domain of action theory. By treating joint action as a structure of accountability rather than a state of mind, it promises to rescue the phenomenon from the requirement of unrealistic psychological harmony. The project is designed to be falsifiable: if normative standing reduces to psychology, or if it fails to distinguish coordination from collaboration, the thesis must be abandoned. This risk ensures the inquiry remains substantive rather than terminological.
