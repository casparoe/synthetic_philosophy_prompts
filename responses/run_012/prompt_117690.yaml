  ### Design Process: Brainstorming and Discards

  **Candidate 1: The Founding Date**
  *   *Claim:* "This club was founded in 1975."
  *   *Archive:* Incorporation papers say 1974.
  *   *Scenario A:* Community says 1975 (first actual meeting). Community wins.
  *   *Scenario B:* Community says 1975 (misremembering the year). Record wins.
  *   *Failure:* This collapses into the "meaning vs. fact" distinction the user wants to avoid. In A, "founded" means "socially active"; in B, "founded" means "legally incorporated." The variable is semantic, not structural.

  **Candidate 2: The Room Name**
  *   *Claim:* "This was called the Blue Room."
  *   *Archive:* Paint logs say "Green."
  *   *Scenario A:* Everyone called it Blue (nickname). Community wins.
  *   *Scenario B:* They are confusing it with another room. Record wins.
  *   *Failure:* Too trivial. Does not carry the ethical weight of "standing" or "authority." Also, the variable (nickname vs. error) is not a single structural variable but a difference in psychological state.

  **Candidate 3: The Participation Claim**
  *   *Claim:* "We cleared this lot ourselves."
  *   *Archive:* City work orders show municipal crew.
  *   *Scenario A:* Community did prep work; city did heavy lifting. Community wins.
  *   *Scenario B:* Community watched; city did all work. Record wins.
  *   *Failure:* Violates the "Archive is better evidenced" constraint. In Scenario A, the community's evidence (labor) is arguably *better* than the archive's (paperwork), whereas the prompt requires the archive to remain evidentially superior in both cases.

  **Surviving Candidate: The Ontological Dependence of the Group on the Record**
  *   *Concept:* The archive is identical (Incorporation Charter), the claim is identical ("X was a founding member"), the evidence quality is identical (Charter vs. Memory). The variable is whether the group *existed before* the record was made (Record tracks reality) or *came into existence because* the record was made (Record creates reality).

  ***

  ### The Surviving Pair

  **Context:** A local amateur theater troupe, The Oakwood Players.
  **The Disputed Claim:** "Mr. Henderson was a founding member of The Oakwood Players."
  **The Archive:** The troupe's Incorporation Charter, filed with the municipality. It lists four names under "Founding Directors." Mr. Henderson's name is not among them. The archive is honest, competent, and the Charter is the primary source document.
  **The Community:** The current members of the troupe. They are not seeking legal assets or liability protection; the dispute is solely for the text of a commemorative lobby plaque. No money or reputation is at stake.

  **Scenario A (The Retrospective Record)**
  The Oakwood Players met informally in living rooms for two years before incorporating. Mr. Henderson was present at every early meeting and helped draft the initial mission statement. The Incorporation Charter was filed later by a subset of the group solely to secure a small arts grant; the four names listed were simply those available to sign that day. The community insists Henderson is a founder.
  *   **Variable State:** The Group *pre-exists* the Record. The Record is a **tracking** device.

  **Scenario B (The Constitutive Record)**
  The Oakwood Players did not exist prior to incorporation. A single individual filed the Incorporation Charter to create a legal entity capable of holding a lease, then invited others (including Mr. Henderson) to join the newly formed company a week later. Henderson participated in the first *public* play, but was not involved in the creation of the entity. The community insists Henderson is a founder because he was there at the start of the *activity*.
  *   **Variable State:** The Group *depends on* the Record. The Record is a **constitutive** device.

  **The Single Variable:** **The Ontological Status of the Record (Tracking vs. Constitutive).**

  ***

  ### Verdicts of the Three Norms

  | Norm | Scenario A (Retrospective) | Scenario B (Constitutive) |
  | :--- | :--- | :--- |
  | **1. Strictly Evidential**<br>(Believe the balance of evidence) | **Record Wins.** The Charter is a contemporaneous, signed legal document. Community memory is fallible and undocumented. The balance of evidence favors the written list. | **Record Wins.** Same reasoning. The Charter is the best evidence of who created the legal entity. |
  | **2. Standing/Authority**<br>(Memory is a claim of who may narrate) | **Community Wins.** The community *is* the group. The archive is an external tool they used. They have the authority to define their own lineage. The archive has no standing to overrule the group's self-constitution. | **Community Wins.** (Consistent application). The community claims the authority to define "founder." If memory is a claim of standing, they still hold the standing to narrate their own history, regardless of legal technicalities. |
  | **3. Hybrid/Incommensurable**<br>(Question is malformed; contexts differ) | **Community Wins.** The claim is about *social origin*. The archive records *legal origin*. Since the group predates the law, the social fact overrides the legal trace. | **Record Wins.** The claim is about *legal origin* (since the group has no social pre-history). The archive defines the reality. To say Henderson is a founder is category-error; he is a "first joiner," not a "founder." |

  ***

  ### Analysis

  **1. Which feature is doing the real work?**
  The feature doing the work is **The Ontological Status of the Record (Tracking vs. Constitutive).**
  In Scenario A, the record is a *shadow* of the community; correcting the shadow to fit the object is epistemically valid. In Scenario B, the record is the *mold* of the community; the object cannot exist without the shadow. The shift in verdict relies on recognizing that archives do not always stand in the same relationship to the social reality they purport to describe. Sometimes they are mirrors (Scenario A); sometimes they are engines (Scenario B).

  **2. Does the distinction survive the objection that self-understanding is a historical fact?**
  A skeptic might argue: "Whether the group pre-existed the charter is itself a historical fact answerable to evidence. If the archive is better evidenced, it should win in both cases."
  The distinction survives because the "fact" of the group's existence is not merely physical but **institutional**. In Scenario B, the institution *just is* the legal filing. There is no "deeper fact" of the group's existence prior to the filing to which memory could appeal. In Scenario A, the institution is a social practice that the filing merely recognized. The objection fails because it treats all social groups as natural kinds (like trees) rather than institutional kinds (like corporations), which have different conditions of existence.

  **3. What becomes of the pair once that feature is removed?**
  If we remove the variable and make the Record **Tracking** in both cases (i.e., the group pre-existed in both), the Community should win in both (per the ethics of memory). If we make the Record **Constitutive** in both cases (i.e., the group was created by filing in both), the Record should win in both. Without this variable, the user's intuition that the verdict *should* flip disappears, and we are left with a simple contradiction: either memory always overrides evidence, or evidence always overrides memory. The variable explains *why* the normative weight shifts without changing the quality of the evidence.

  **4. How would extreme defenders explain the pair away?**
  *   **The Record-Always-Wins Defender:** Would argue that in Scenario A, the community is simply wrong about the definition of "founding member." They would assert that "founder" *means* "signatory of the charter." They would dismiss the community's social narrative as romanticism. They would claim the variable is irrelevant; the document is the only reliable anchor against the drift of memory.
  *   **The Memory-Always-Wins Defender:** Would argue that in Scenario B, the legal charter is a bureaucratic fiction that fails to capture the human reality of the troupe. They would assert that "founder" *means* "those who made the practice possible." They would claim the variable is irrelevant; the lived experience of the practitioners is the only legitimate source of historical truth, and legal technicalities are tools of exclusion.

  Both extremists flatten the distinction. The Record-Always defender ignores the social reality that precedes bureaucracy (Scenario A). The Memory-Always defender ignores the institutional reality that bureaucracy creates (Scenario B). The design of this pair demonstrates that a functional ethics of memory must diagnose the *relationship* between the record and the community, not just weigh the evidence.
