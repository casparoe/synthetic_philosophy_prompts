answer: |-
  Good evening, everyone. Welcome.

  I know the protocol for these occasions usually involves thanking the sponsors, outlining the schedule, and reminding everyone where the fire exits are. But given that we are here to talk about *time*—specifically, how much of it we spend working, and how much we keep for ourselves—I thought it would be rude of me to steal any more of yours than is absolutely necessary. Besides, there is food coming, and I suspect the arguments regarding the elasticity of labour supply will taste much better after a glass of wine and a proper meal.

  I've been asked to say a few words on the theme: "What was Keynes actually promising us?"

  Now, I am conscious that half of this room could model the macroeconomic implications of a fifteen-hour week in their sleep, while the other half—my cohort—were invited largely because someone thought we might know how to spell 'Keynes' without autocorrect. But there is a reason we are all at this table.

  We all know the soundbite. We know the prophecy: that by now, thanks to capital accumulation and technical progress, we should be working fifteen hours a week. We know it didn't happen. And usually, that's where the conversation stops. The economists explain why the substitution effect didn't hold, and the humanities people explain why consumerism corrupted the soul.

  But I want to suggest that reducing Keynes to that one prediction misses the tension in the man himself. And it is that tension, I think, that binds this room together.

  Consider the young Keynes. The Keynes of the Cambridge Apostles and the Bloomsbury Group. To him, the point of life was not production, nor duty, nor accumulation. It was a certain quality of experience. He spoke of love, beauty, truth—the texture of your own and other people's states of mind. It was a seductive vision. It was also, by his own later admission, morally careless. They cheerfully held that they recognised no moral obligations whatsoever. They believed they could live on the surface of things, sustained by reason and aesthetic appreciation.

  But the older Keynes looked back at that younger self and saw something darker. He decided that view was a fragile veneer. He realised they had been skimming along the surface without touching the currents below. He understood that you cannot simply wish away the economic problem; you have to solve it. And he understood that a life devoted solely to states of mind requires a foundation of security that most of humanity simply did not have.

  So, he went to work. He built the theories. He fought the battles. But he never lost sight of the end goal.

  In *Economic Possibilities for our Grandchildren*, he writes something profound about what happens *after* the economic problem is solved. He says that when we no longer need to struggle for subsistence, we will be faced with the real problem: how to live wisely and agreeably and well.

  And here is the rub. He warns us that we have spent generations training ourselves to be purposive. We have trained ourselves to treat everything as a means to something else. We prize money as a possession, rather than as a means to an end. We are, in his words, addicted to the habit of looking forward.

  This, I think, is where the labour economists and the humanities scholars in this room meet.

  To the economists: You are the ones grappling with the mechanics of the 'means'. You are measuring the constraints, the productivity, the policies that might actually grant us that fifteen-hour week. Without your work, Keynes's promise is just poetry. It remains a fantasy.

  But to the humanists: We are left with the question of the 'end'. If we were to wake up tomorrow with a fifteen-hour work week, would we know how to live wisely? Or would we simply fill the void with new forms of purposive anxiety? Would we just find new ways to monetise our leisure?

  Keynes wasn't promising us idleness. He was promising us the opportunity to recover a lost art of living. He was suggesting that the 'economic problem' is actually a temporary stage—a painful, necessary adolescence of the human race—before we can grow up and focus on what matters.

  So, over the next two days, we are going to argue. We will argue about data, about policy, about history, and about philosophy. The economists will rightly demand rigour, and the humanists will rightly demand meaning. But let us remember that we are both looking at the same puzzle. One side is asking how we get the time; the other is asking what the time is *for*.

  Keynes realised that solving the first part is useless if we fail at the second. He knew that we are purposive creatures who have forgotten how to just *be*.

  So, my hope for this workshop is not that we solve the politics of working time by Saturday afternoon. My hope is that we might, in our own small way, practise what Keynes preached. That we might use this time not just to produce papers or policy briefs, but to engage in that quality of experience he valued so highly. To listen, to argue agreeably, and perhaps to touch those currents below the surface.

  For now, though, the most purposive thing we can do is to enjoy the dinner.

  Thank you, and cheers.
