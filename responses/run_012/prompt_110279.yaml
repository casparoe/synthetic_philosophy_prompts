  # Proposal: The Treadmill Hypothesis — Maintenance, Construction, and Greedy Reductionism

  ### The Question
  Is the distinction between constructive processes ("cranes") and stabilizing processes ("treadmills") necessary and sufficient to resolve ambiguities in claims of greedy reductionism, or does the proposed "crane = treadmill + ratchet" equation collapse into a verbal restatement of origin versus maintenance?

  ### Why It Isn't Settled
  The current vocabulary (Dennett's cranes vs. skyhooks) functions rhetorically rather than analytically. There are no operational criteria for distinguishing a crane from a skyhook beyond intuition, and "greedy reductionism" is deployed as a charge of bad faith rather than a structural error. Meanwhile, biology and control theory possess robust distinctions between *generation* (selection/mutation) and *maintenance* (stabilizing selection/homeostasis), but this machinery has not been ported into the reductionism debate. The literature assumes "crane" is a primitive category; if it is actually a composite of maintenance plus accumulation, the current arguments rest on a missing variable.

  ### The Key Move
  Introduce "treadmill" as a formal category for processes that maintain structure against entropy without generating novelty. Test the hypothesis that a "crane" is strictly a treadmill coupled to a ratchet mechanism. Apply this taxonomy to a coded set of case studies to see if it predicts verdicts on disputed reductions better than the standard two-slot model.

  ### Methodology
  1.  **Definition Lock:** Formalize necessary and sufficient conditions for Skyhook, Crane, and Treadmill.
  2.  **Case Coding:** Select 12 cases (4 paradigm cranes, 4 paradigm treadmills, 4 disputed reductions).
  3.  **Blind Test:** Apply the definitions to the cases to see if the taxonomy aligns with intuitive verdicts on whether a reduction is "greedy."
  4.  **Stress Test:** Attempt to break the model by finding cases where maintenance explains origin or where construction occurs without maintenance.

  ### Success and Failure
  *   **Success:** The taxonomy cleanly separates the 12 cases without ad-hoc adjustments, and provides a clear criterion for when skipping a level constitutes greedy reductionism (e.g., skipping a level is greedy iff that level was performing crane-work, not treadmill-work).
  *   **Failure:** The definitions require constant patching to fit cases, the "crane = treadmill + ratchet" equation fails on edge cases, or the distinction yields no new predictive power on the reductionism cases compared to standard intuition.

  ### Scope Check
  This is conceptual engineering, not empirical discovery. The bottleneck is clarity of thought, not data collection. Six months part-time is sufficient to produce a rigorous prototype paper, provided the scope remains limited to testing the taxonomy against cases rather than solving reductionism entirely.

  ### Six-Month Plan

  | Month | What I actually do | Output at the end of it | What result would kill it |
  | :--- | :--- | :--- | :--- |
  | 1 | Draft formal definitions for Skyhook, Crane, Treadmill, Ratchet. Iterate until no obvious counterexamples exist. | A glossary of terms with necessary/sufficient conditions. | If definitions collapse into each other (e.g., Treadmill becomes just a slow Crane). |
  | 2 | Select 12 case studies. Ensure 4 are uncontroversial paradigms and 4 are active disputes in the literature. | A annotated list of cases with justification for selection. | If uncontroversial paradigms cannot be found (suggests the concepts are too fuzzy). |
  | 3 | Code the 8 paradigm cases (Cranes/Treadmills) against the definitions. | A matrix showing fit/no-fit for paradigms. | If paradigm cases fail to match their assigned categories. |
  | 4 | Code the 4 disputed reduction cases. Apply the taxonomy to see if it resolves the dispute. | Analysis of whether the taxonomy predicts consensus verdicts. | If the taxonomy contradicts strong intuitions on the disputed cases. |
  | 5 | Synthesize findings. Draft the argument linking the taxonomy to greedy reductionism criteria. | A complete draft of the core argument section. | If the link between maintenance/construction and reductionism proves tenuous. |
  | 6 | Review, edit, and finalize. Stress-test against one new counterexample found during writing. | Final paper ready for submission/publication. | If writing reveals a fundamental logical flaw in the Crane/Treadmill equivalence. |

