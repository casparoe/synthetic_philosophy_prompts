prompt: |-
  I've been reading LW/ACX/the whole extended blog family for something like a decade now, and I've got a half-formed idea I'd like to turn into an actual proposal. Context: there's a small pot of money I can apply to, six months, part-time, one person, no lab, no co-author, basically a reading-and-thinking budget with a writeup at the end. Their funders form wants the usual: the question, why it isn't already settled, what I'd actually do, what success looks like, what failure looks like, and a sanity check on whether the scope is realistic.

  Here's the half-baked bit. Everyone waves around cranes vs skyhooks (Dennett's image, you know it) and everyone agrees greedy reductionism is bad, but I have never once seen anyone give necessary and sufficient conditions for either, and I've started to suspect that's because the picture is missing a box. As it stands the vocabulary seems to have only two slots:

  - skyhook: does work without drawing on any regularity that's already there. Fine, allegedly these don't exist.
  - crane: produces a structure by exploiting regularities that are independent of the structure, so it can get the thing out of materials that don't already have it.

  And the box I want to add:

  - treadmill: a process that holds a structure in place once it exists, but which would produce nothing at all if you ran it on the raw materials. Stabilizing selection holds a trait at its optimum and would never have built the trait in the first place. A thermostat holds a room's temperature and can't warm a cold room without fuel. A property regime enforces a norm it didn't invent. Memory maintains a skill rather than acquiring it.

  The thing I actually want to test: cranes seem to need treadmills underneath them. Selection can't ratchet anything unless replication is faithful enough to resist drift, and that's a maintenance job; then a ratchet — anything that blocks the backslide — converts the treadmill's reliability into cumulative construction. So maybe "crane" isn't a basic category at all. Maybe a crane is just a treadmill coupled to a ratchet, and the real difference between a crane and a skyhook is that the crane is parasitic on something that already works, which is a much thinner claim than the picture usually advertises.

  If that's right, greedy reductionism gets an actual criterion instead of being a term of abuse: skipping a level is greedy when the level you skipped was doing crane work, since you've thrown away the part that explains the origin, and not greedy when it was only doing treadmill work, since the lower-level story can supply the persistence. But honestly the opposite reading seems just as available to me — if all you've explained is maintenance and you then announce you've explained the origin, that looks like the paradigm case of a greedy reduction, not the licensed one. I can't tell which survives contact with the cases and that's the point of the project.

  So turn this into the proposal. Specifically: state the question so it could come out either way (i.e. "is X derivable from Y" and not "isn't X cool"); say why the existing discussion doesn't settle it, given that it's mostly rhetorical and the maintenance-vs-construction distinction lives over in biology and control theory without anyone plugging it into the reductionism fight; give me a method that's real work rather than vibes (my sketch: nail down the definitions, then code maybe a dozen cases — a few paradigm cranes, a few paradigm treadmills, and several where people disagree about whether a reduction is greedy — and check whether the taxonomy predicts the verdicts and whether the criterion ever contradicts the taxonomy); say what a result looks like and what would count as the project failing; and give me an honest read on whether six months part-time covers it or whether this is a dissertation-shaped thing I'm trying to do on a blog budget. Don't give me citations, a reading list, or a lit review by name — I'll fill those in, and what I want is the argument. Don't worry that my terminology isn't standard; it's mine and I'll defend it.

  Two structural asks. First, put the six-month plan in a table with exactly these columns: Month | What I actually do | Output at the end of it | What result would kill it. Second, at the very end give me a JSON object so I can diff versions of this against each other, with exactly these fields: "question", "why_open", "key_move", "workplan" (an array of six objects, each with "month", "activity", "output"), "success_looks_like", "failure_looks_like", "scope_verdict" (one of "fits", "too big", "too small", plus a sentence of why), "weakest_link", and "what_would_change_your_mind".

  On that last field, dont be polite about it: take a position on whether the crane = treadmill + ratchet move is a real distinction or just the old origin-vs-maintenance thing in a new hat, and then tell me which argument or piece of evidence would actually flip you. If you think the reduction collapses the distinction, say so and say what would rescue it.
