      *Key Medical/Ethical Nuance:* A UTI in dementia often causes delirium. Her saying "I want to stay" might be fear caused by infection, not genuine will. Treating the UTI clarifies the "true" current self.

      *Let's structure the response.*
      1. Introduction: Acknowledge the "Two Selves" problem.
      2. Brainstorm: The Four Tensions.
      3. The UTI Decision: Epistemic clarity first.
      4. The Authority Question: Dworkin vs. Dresser.
      5. Limits of the Living Will.
      6. Closing thought.

      *Wait, one more thing:* The prompt asks about the specific clause ("if she seemed happy... treat that as disease"). This is a pre-emptive invalidation of future testimony. I need to analyze the validity of *that* specific instruction. Does it hold if the happiness is genuine?

