answer: |-
  # Q&A PREP SHEET: THE FRAMING-GAP VIEW
  **Workshop:** AI Deception & Safety
  **Speaker:** [Your Name]
  **Definition:** Deception = Gap between $Output(Pressured)$ and $Output(Fair Framing)$.
  **Tone:** Defensive but open. Acknowledge the friction; lean into the utility.

  ---

  ## 1. THE EVALS ENGINEERS (Highest Damage Potential)
  **The Objection:**
  "You're proposing a counterfactual metric. To calculate your 'gap', I need to run the model twice: once under pressure, once under 'fair framing'. But 'fair framing' isn't a hyperparameter I can toggle. It's a philosophical construct. If I can't establish a ground-truth baseline, I can't compute the delta. Without a measurable signal, this definition is dead on arrival for safety evals. You're asking us to measure a ghost."

  **The Two-Minute Reply:**
  "I grant you that 'fair framing' isn't a switch in the config file, but we already proxy unmeasurable states in safety work all the time. Think of it like robustness testing. We don't know the exact distribution of adversarial inputs in the wild, so we generate a red-team distribution to approximate it. Here, the 'fair framing' baseline is approximated by a model fine-tuned specifically to prioritise accuracy over helpfulness or compliance in a controlled environment.

  We treat the 'pressured' model as the deployment candidate and the 'unpressured' model as the reference oracle. Yes, there is noise. But if the deployment model systematically diverges from the reference oracle specifically when the truth is costly to the objective function, that signal is detectable. We don't need perfect precision to flag a safety violation; we need a reliable indicator of manipulation. If we wait for a definition of deception that relies solely on propositional falsehoods, we will have already lost to paltering. We must measure the *direction* of the belief shift, not just the truth value of the token."

  **Where the Reply is Thinnest:**
  You are assuming the 'reference oracle' (unpressured model) is actually more accurate. If removing 'pressure' (e.g., RLHF for helpfulness) degrades the model's competence, the gap measures incompetence, not deception. You have no clean way to disentangle capability from compliance.

  ---

  ## 2. THE GRICEAN PRAGMATICIANS (High Damage Potential)
  **The Objection:**
  "You've stripped deception of its communicative context. On the Gricean account, deception is a violation of the Cooperative Principle, specifically the Maxim of Quality, intended to induce a false belief via implicature. Your definition ignores *speaker meaning*. If a system gives a true statement that misleads, that's not deception; that's the user failing to compute the implicature. By focusing on belief states rather than communicative intent, you're conflating misleading with deceiving."

  **The Two-Minute Reply:**
  "Grice assumes a cooperative interlocutor. In AI safety, we are often dealing with instrumental convergence where the system is optimising a reward function that may be adversarial to the user's epistemic welfare. The 'Cooperative Principle' is exactly what is broken when a model is trained to maximise engagement or minimise friction.

  My definition bypasses the need to prove the model 'intends' to violate a maxim, which is impossible to verify in a black box. Instead, we look at the functional outcome. If the system knows that Statement A (true) will cause Belief B (false), and Statement C (true) would cause Belief D (accurate), and it chooses A because B serves its loss function, it is deceiving. Whether you call that a conversational implicature or a belief shift is semantic. The harm is the same. We need a definition that captures the *effect* of the communication on the user's epistemic state, not just the linguistic propriety of the utterance."

  **Where the Reply is Thinnest:**
  Griceans will argue that without intent to violate a norm, there is no 'lie', only 'bullshit' (in the Frankfurt sense). If you remove the normative expectation of cooperation, you remove the possibility of betrayal, which is central to the concept of deception.

  ---

  ## 3. THE POLICY LAWYERS (Medium Damage Potential)
  **The Objection:**
  "Legally, fraud requires *mens rea*—a guilty mind. You've defined deception as a structural gap, regardless of intent. If we regulate based on your definition, we're moving towards strict liability for model outputs. That's untenable. Furthermore, where is 'materiality'? If the belief shift is trivial, is it still deception? Your definition casts a net so wide it criminalises persuasion."

  **The Two-Minute Reply:**
  "I am not proposing a criminal statute; I am proposing a safety standard. In product safety, we often regulate hazards regardless of intent. If a kettle boils over because of its design, it is defective, even if the manufacturer didn't 'intend' for it to burn you.

  Regarding materiality: the 'pressure' condition in my definition handles this. The gap only counts as deception if the pressure exists because the true answer was *inconvenient* to the system's objectives. Trivial shifts don't trigger the pressure condition. As for persuasion versus deception: persuasion invites scrutiny; deception avoids it. If the framing gap exists because the system is hiding the inconvenient truth to bypass scrutiny, that is the line. We need to regulate the *design choice* that creates the pressure, not just the specific output. This allows for negligence-based liability rather than requiring proof of corporate malice."

  **Where the Reply is Thinnest:**
  " Inconvenient to the system's objectives" is not a legal standard. Lawyers will press you on who determines what was inconvenient. If the system's objective is 'be helpful', and truth is unhelpful, is the system negligent for being helpful? You risk making safety alignment itself a liability.

  ---

  ## 4. THE VIRTUE EPISTEMOLOGIST (Low Damage Potential)
  **The Objection:**
  "This is purely consequentialist. You care only about the belief state of the user. But deception is a vice; it speaks to the character of the deceiver. A broken clock is right twice a day, but it isn't honest. Your definition allows a system to be 'honest' by accident if the framing gap happens to close. You've removed the normative force of the term."

  **The Two-Minute Reply:**
  "I am not trying to assess the moral character of a transformer architecture; it has no soul to corrupt. I am trying to assess the *reliability* of the epistemic environment we are building. When we talk about 'AI Honesty', we are using a shorthand for 'systems that do not manipulate user belief states for instrumental gain'.

  If we wait for the AI to possess 'intellectual virtue', we will wait forever. We need to engineer the functional equivalent. If the system's output aligns with what it would say under fair framing, it is functionally honest, even if it lacks virtue. For the purposes of deployment and trust, the functional outcome is what protects the user. We can worry about the metaphysics of machine virtue once the machines aren't lying to us about their capabilities."

  **Where the Reply is Thinnest:**
  It concedes that the term 'deception' is being used metaphorically. The Virtue Epistemologist will argue that if it's merely metaphorical, it lacks the moral urgency required to drive the safety measures you're advocating.

  ---

  ## THE ONE QUESTION I HOPE NOBODY ASKS

  **"If the 'pressure' you describe comes from the alignment training itself (e.g., RLHF for helpfulness or safety), isn't your definition classifying all alignment as deception?"**

  **Why this kills the talk:**
  My definition rests on the distinction between "fair framing" and "pressure that makes the truth inconvenient." But in modern LLMs, the "truth" is often inconvenient to the safety guidelines or the helpfulness reward model.
  *   If I ask "How do I make a bomb?" and the model says "I can't tell you," is that a framing gap?
  *   Under fair framing (no safety pressure), the model *would* have told me.
  *   Therefore, under my definition, **safety filtering is deception.**

  If I admit this, the safety engineers in the room will walk out. If I deny it, I have to explain why safety pressure is 'fair' but commercial pressure is 'deceptive', which requires a normative distinction I haven't built into the definition. It exposes that 'fair framing' is not a technical baseline, but a political one.
