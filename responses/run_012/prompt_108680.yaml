  *   **Question:** Is the inviolate level discovered as a necessary feature of reality, or stipulated as a convenient modeling constraint?
  *   **Agreed Bearing Argument:** Gödel's Incompleteness Theorems demonstrate that a formal system cannot prove its own consistency within its own axioms.
  *   **Camp A Prediction:** This proves consistency must reside outside the system, confirming the inviolate level as a discovered necessity inherent to logic.
  *   **Camp B Prediction:** This proves only that consistency proofs require a stronger system, confirming an infinite hierarchy of metalanguages without a top-level anchor.

  **Crux 2: Metalanguage Relocation**
  *   **Question:** Do deflationist coding devices merely relocate the inviolate level into a metalanguage?
  *   **Agreed Bearing Argument:** Tarski's Undefinability Theorem states truth for a language cannot be defined within that language without contradiction.
  *   **Camp A Prediction:** This confirms the inviolate level is unavoidable; the metalanguage functions as the inviolate stratum for the object language during operation.
  *   **Camp B Prediction:** This confirms levels are relative; the metalanguage is itself an object language for a higher level, implying no stratum is inherently inviolate.

  **Crux 3: Verbal Dispute**
  *   **Question:** Is any part of this dispute merely verbal, stemming from differing definitions of "level" or "rule"?
  *   **Agreed Bearing Argument:** Operational analysis of system crashes versus rule changes in complex software.
  *   **Camp A Prediction:** The dispute is substantive; distinguishing between a system breaking and a rule changing requires recognizing an inviolate boundary that determines validity.
  *   **Camp B Prediction:** The dispute is partially verbal; "breaking" and "rule changing" are functionally identical state transitions describable without invoking inviolability.

  **IV. Shared Test Cases**
  We applied our models to two concrete scenarios to test empirical divergence.

  **Case 1: The Self-Amending Constitution**
  *   **Scenario:** A constitution contains an amendment procedure allowing any clause to be changed, including the procedure itself. It also contains Clause X, declaring itself unamendable.
  *   **Expectations:** Both camps agree that if the amendment procedure is followed successfully according to the system's current rules, the text will change. Both camps agree that if the procedure fails due to resistance or invalidation, the text will remain.
