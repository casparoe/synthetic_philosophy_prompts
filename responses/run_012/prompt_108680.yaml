  3.  **Limits of Self-Reference:** The bare existence of self-reference does not establish inconsistency, nor does it guarantee coherence. Self-reference is a structural feature that permits both paradox and stability depending on implementation.
  4.  **Mechanics:** Formal coding and quoting devices (e.g., Gödel numbering, quines) are sufficient to instantiate self-reference within a computational or logical framework without immediate collapse. Mechanics exist to handle the loop.

  **II. Points of Remaining Disagreement**
  We disagree on the following claims, phrased such that each side accepts the wording as accurate to their position:
  1.  **Ontological Status:** Camp A asserts that a stable tangled hierarchy *requires* an ontological anchor—an inviolate level that fixes rules without being subject to them. Camp B asserts that the "inviolate level" is a descriptive artifact, and that stability arises from contingent mechanical processes without requiring a fixed stratum.
  2.  **Closure:** Camp A asserts that a system cannot fully account for its own rules from within; an external standpoint is necessary to ground meaning. Camp B asserts that a system can be closed under operation, with "external" standpoints merely representing larger systems subject to the same mechanics.

  **III. Cruxes and Pre-Registered Predictions**
  We identify three cruxes determining the resolution of this dispute. For each, we agree on a bearing argument and record divergent predictions regarding its implication.

