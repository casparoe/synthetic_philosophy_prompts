answer: |-
  Elena, a fiercely independent architect, executes an advance directive refusing any life-sustaining treatment should she become physically dependent on others for daily care, citing that such a life would be "unrecognizable as mine." Years later, a spinal injury leaves her quadriplegic but cognitively intact. Through the process of rehabilitation, she undergoes a radical psychological restructuring: her core identity shifts from "autonomous agent" to "relational node," finding profound meaning in dependency she once deemed intolerable. She is fully competent, understands her prognosis, and requests the ventilation she previously refused. Her memories remain, but the normative weight she assigns to them has inverted; she describes her pre-accident self as "a stranger who feared living" and reports no emotional resonance with her past ambitions, only a cold factual acknowledgment of them.

  (a) The autonomy story argues the directive binds because authority derives from the *moment* of competent deliberation, intended precisely to shield the life narrative from future value drift or adaptive preference; the earlier self's right to define the boundaries of her life outweighs the later self's contrary desire. The continuity story argues the directive lapses because moral bindingness requires a sustained psychological subject; since the later self's constitutive values and identity have ruptured from the earlier self's, enforcing the directive amounts to sacrificing a present person for the sake of a psychological stranger.

  (b) The load-bearing feature is the combination of *preserved competence* with *radical value inversion*. If you remove competence (making her demented or confused), both theories likely defer to the directive (either out of respect for past autonomy or because psychological continuity is already broken by incapacity). If you remove the value inversion (she just changes her mind but retains her core identity), the continuity theorist must concede the directive binds, as the self persists. The disagreement exists only because she is well enough to choose, but different enough to be "other."

  (c) The continuity theorist's best move is to redescribe the value inversion not as authentic self-evolution but as *pathological adaptation*. They would argue that the trauma itself distorted her evaluative framework, meaning her current "competence" is superficial; on this description, the later self is not a new person, but a damaged version of the old one, restoring the authority of the pre-injury directive.

  (d) If the autonomy story wins here, it functions as a general licence to bind future selves. Nothing internal to the theory stops a person from irrevocably locking in preferences against any possible future transformation, effectively treating persons as static entities rather than temporal beings; it permits the tyranny of the past self over the present.

  Regarding the clause that treats revocation requests as symptoms: this is bootstrapping, not legitimate authority. It presupposes the very continuity that is in dispute by allowing the earlier self to unilaterally define the later self's expressions of dissent as invalid, thereby insulating the directive from the evidence that might otherwise dissolve its binding force.
