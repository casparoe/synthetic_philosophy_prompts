answer: |-
  You have correctly identified a fissure in the standard decision-theoretic landscape. Your flatmate's behavior cannot be modeled by standard Expected Utility (fixed menu, fixed weights), nor by standard Ambiguity Aversion (fixed menu, unknown weights).

  The pattern you are describing is distinct from Ellsberg-style ambiguity. In Ellsberg cases, the agent knows the *ontology* of the situation (the urn contains balls, the bet pays out $X$ or $Y$) but lacks the *epistemology* (the distribution). Your flatmate is comfortable with that. Her aversion triggers when the *ontology itself* is unstable—when she cannot define the boundaries of the possibility space.

  ### The Existing Landscape
  There is no single, universally standardized term that functions as neatly as "Ambiguity Aversion" for this specific phenomenon, but there are three overlapping literatures that carve near it:

  1.  **Unawareness / Unforeseen Contingencies:** In epistemic logic and economic theory (e.g., Dekel, Lipman, & Rustichini; Grant & Quiggin), this models agents who do not know the full state space $S$. Standard decision theory assumes $S$ is given; this literature relaxes that. Your flatmate is exhibiting aversion to situations where $S$ is not "common knowledge" or fixed.
  2.  **Radical Uncertainty:** In economics (notably Kay & King, *Radical Uncertainty*), a distinction is drawn between "resolvable uncertainty" (probabilities unknown but distribution exists) and "radical uncertainty" (the ontology of outcomes is unknowable or non-ergodic). Your flatmate accepts the former, rejects the latter.
  3.  **Support Ignorance:** In statistics, distinguishing between not knowing the *shape* of the distribution (ambiguity) vs. not knowing the *support* of the distribution (the range of possible values).

  However, none of these quite capture the *aversive* phenomenology you're describing—the specific "I don't know what I'd be ruling out" intuition.

  ### The Coinage: "Boundary Ignorance"
  If you need a term for your chapter that carves this specific joint, I propose **Boundary Ignorance** (or **State-Space Opacity**).

  Here is the carving you asked for. This distinguishes it from plain Ambiguity Aversion and tells you where the edges lie.

  #### 1. The Core Distinction: Parametric vs. Structural
  *   **Parametric Uncertainty (Ellsberg/Knight):** The *container* is known; the *contents* are unknown.
      *   *Example:* Your flatmate's 50/50 urn where the arrangement is hidden. She knows the bet cannot resolve to "her house burns down" or "infinite debt." The outcome space is bounded and exhaustive.
      *   *Mathematical signature:* The $\sigma$-algebra is fixed; the probability measure $P$ is a set of functions rather than a singleton.
  *   **Boundary Ignorance (Your Pattern):** The *container* is unknown; the *contents* are therefore unlistable.
      *   *Example:* The uncapped loss. She cannot form the complement set. If she bets on $A$, she normally assumes $\neg A$ covers everything else. If the menu is open, $\neg A$ is ill-defined.
      *   *Mathematical signature:* The sample space $\Omega$ itself is indeterminate or subject to adversarial expansion.

  #### 2. The "Ruling Out" Criterion
  The phrase "I don't know what I'd be ruling out" is the diagnostic key.
  *   **Ambiguity Aversion:** "I know the set of outcomes, but I can't assign a unique probability to them." (I know I'm ruling out winning \$1M, I just don't know the odds of winning \$100).
  *   **Boundary Ignorance:** "I cannot verify that I am ruling out ruin." (I don't know if 'losing my shirt' is even in the set of possible outcomes I'm evaluating).

  This is why the "other party decides later" triggers it. It introduces **Strategic Unboundedness**. The other party holds the power to expand the state space *ex post*. In decision theory terms, the game tree has nodes that are not only probabilistically unknown but *structurally undefined* at the time of commitment.

  #### 3. Is "Tiny Chance of Catastrophe" the Same?
  This depends entirely on whether the catastrophe is *inside* or *outside* the known boundary.

  *   **Case A (Same Phenomenon):** "I don't know if there's a tiny chance of something catastrophic" because the *mechanism* of the bet allows for undefined losses (e.g., leverage, uncapped derivatives). Here, the tail of the distribution is not just fat; it is **unbounded**. This is Boundary Ignorance.
  *   **Case B (Different Phenomenon):** "I know the max loss is \$500, but I'm worried there's a 0.001% chance I lose the full \$500." Here, the catastrophe is within the known support. The boundary is fixed; the weight is unknown. This is standard **Ambiguity Aversion** (or Risk Aversion, depending on whether the 0.001% is known).

  **The Edge:** Boundary Ignorance covers situations where the *support* of the probability distribution is unknown or mutable. It wrongly sweeps in nothing if defined strictly, but be careful not to conflate it with **Fat Tail Risk**. A Fat Tail is a known boundary with high variance (Parametric). An Undefined Tail is Boundary Ignorance.

  ### Why This Matters for Your Chapter
  If you are writing on decision theory, using **Boundary Ignorance** allows you to critique the **Fixed State Space Assumption** without invoking full-blown "Unawareness" logic (which can get bogged down in formal epistemology).

  It explains why your flatmate accepts the Ellsberg urn (fixed states, unknown weights) but rejects the uncapped bet (unknown states). It also explains why she accepts the "counts hidden" urn (fixed states) but would reject a bet where the *colors* in the urn might change later.

  **Recommended Terminology for the Text:**
  Use **"State-Space Indeterminacy"** as the formal descriptor, but operationalize it as **"Boundary Ignorance."**

  *   **Covers:** Uncapped losses, adversarial outcome generation, unforeseen contingencies, open-ended contracts.
  *   **Excludes:** Standard Ellsberg urns, known risk distributions, bounded ambiguity.
  *   **Distinct from:** Ambiguity Aversion (which presumes a fixed menu).

  This gives you a precise tool to separate "I don't know the odds" from "I don't know the game."
