prompt: |-
  I run a small advice practice — mostly rationalist-adjacent folks and a few tiny teams — and the whole service is helping people set up commitment devices, Ulysses contracts, that kind of thing. The recuring headache is the hitchhiker case: you want to bind yourself to doing something your future self will have zero reason to do once the moment comes, and it only works if the binding is real enough that the other side believes it. Half the time I tell someone to make the promise anyway, and half the time I think they're about to make themselves a sucker or, worse, to precommit their way into becoming the kind of person who does something terrible — and I know "be the sort of person who keeps their word" is the standard move here, I want the version that knows when that move doesn't apply.

  Write me a decision procedure I can actually run with a client in one sitting: the questions in order, what counts as a good enough answer to each, where it stops with a flat no, and where it has to hand the decision back to the client because it's their values and not my call. It has to be usable by someone with no game theory at all, and it needs to say what to do when I can't get a number for how likely the other party is to actually check or enforce. Then run it on three cases: a guy who wants to quit smoking by parking money in escrow with a friend, a freelancer who wants to lock in a walk-away price before a negotiation she's about to walk into, and someone who wants to precommit to a genuinely harsh retaliation in case a business partner screws him over. Be honest about the spots where the procedure is just a coin flip wearing an algorithm's coat, and flag the ones where I shouldn't be the one deciding at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs a small advice practice (rationalist-adjacent, tiny teams).
      *   **Service:** Helping people set up commitment devices/Ulysses contracts.
      *   **Problem:** The "Hitchhiker Case" (binding future self to something future self won't want to do, requires credibility).
      *   **Risk:** Clients making themselves suckers or precommitting to terrible actions.
      *   **Goal:** A decision procedure usable in one sitting, no game theory jargon, clear stop points (flat no vs. client choice), handling uncertainty about enforcement.
      *   **Task:** Write the procedure, then run it on three specific cases (smoking escrow, freelancer walk-away, harsh retaliation).
      *   **Tone:** Honest, pragmatic, acknowledging limits ("coin flip wearing an algorithm's coat").

  2.  **Deconstruct the Core Problem (Ulysses Contracts/Commitment Devices):**
      *   *Internal Consistency:* Does Future Me actually want to break this? (Time inconsistency).
      *   *External Credibility:* Will the counterparty believe the threat/promise?
      *   *Reversibility:* Can I cheat? (If I can undo it easily, it's not a commitment).
      *   *Ethics/Safety:* Is the committed action harmful or immoral?
      *   *Value Alignment:* Is this actually what the client values, or just impulse control?

  3.  **Drafting the Decision Procedure (The "Ulysses Filter"):**
      *   *Constraint:* Must be usable in one sitting, no game theory jargon.
      *   *Structure:* Sequential questions. Pass/Fail/Defer.
      *   *Key Sections:*
          1.  **The Harm Check (Ethics/Safety):** Immediate veto if the action is illegal or deeply harmful.
          2.  **The Credibility Check (The "Hitchhiker" problem):** Can the other side see it? Do they trust it?
          3.  **The Reversibility Check:** Is it actually hard to undo?
          4.  **The Value Check:** Is this *really* what they want, or just current mood?
          5.  **The Uncertainty Handling:** What if we don't know the odds?

      *   *Refining the Questions:*
          *   Q1: If you succeed, does anyone get hurt (besides the inconvenience of the constraint)? -> *Hard No if yes.*
          *   Q2: Can you secretly undo this? -> *Hard No if yes.*
          *   Q3: Does the other side know, and do they believe you? -> *Crucial for Hitchhiker.*
          *   Q4: If the moment comes and you hate it, will you still do it? -> *Tests resolve.*
          *   Q5: Is the cost of breaking the promise higher than the cost of keeping it? -> *Incentive alignment.*

      *   *Handling Uncertainty:* If we can't number the likelihood of enforcement, use "Worst-Case Viability." Can you survive the worst case if the device fails or triggers badly?

      *   *Handing Back:* Where values differ (e.g., how much risk is acceptable), the advisor steps back.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Smoking Escrow (Money with a friend).**
          *   *Harm:* No (mostly self-harm via smoking, but contract isn't harmful).
          *   *Reversibility:* Can he ask for the money back? If the friend is weak, yes.
          *   *Credibility:* Friend needs to be willing to burn the money or donate it, not return it.
          *   *Verdict:* Conditional Yes (depends on the friend's ruthlessness).

      *   **Case 2: Freelancer Walk-Away Price.**
          *   *Harm:* No.
          *   *Reversibility:* Can she secretly accept a lower offer?
          *   *Credibility:* The client doesn't know about the precommitment. This isn't a Ulysses contract *vis-a-vis* the client, it's internal.
          *   *Nuance:* This is actually an *internal* commitment device, not a strategic signal to the counterparty. The "Hitchhiker" logic applies to herself, not the negotiation target.
          *   *Verdict:* Yes, but clarify it's internal.

      *   **Case 3: Harsh Retaliation (Business Partner).**
          *   *Harm:* High risk. "Harsh retaliation" could mean legal, could mean scorched earth.
          *   *Ethics:* If it's disproportionate, it's dangerous.
          *   *Credibility:* Needs to be known.
          *   *Value:* Is this vengeance or protection?
          *   *Verdict:* Hard No / Hand Back. This is where the advisor must refuse to facilitate potential harm.

  5.  **Refining the Output (Self-Correction/Polishing):**
      *   *Critique:* The prompt asks for "where it stops with a flat no" and "where it has to hand the decision back." I need to make sure the procedure explicitly distinguishes between *Advisor Veto* (safety/feasibility) and *Client Choice* (values/risk tolerance).
      *   *Critique:* The prompt asks to be honest about "coin flip" spots. I need to add a section on "The Gray Zone."
      *   *Tone Check:* Needs to sound like a tool for a rationalist advisor. Precise, slightly detached but caring.
      *   *Game Theory:* Avoid terms like "Nash Equilibrium" or "Common Knowledge." Use "Do they know?" "Do they believe you?"

  6.  **Finalizing the Procedure Steps:**
      1.  **The Harm Veto:** (Advisor Decision)
      2.  **The Leak Test:** (Feasibility)
      3.  **The Audience Test:** (Credibility)
      4.  **The Pain Test:** (Future Self Alignment)
      5.  **The Worst-Case Survival:** (Uncertainty handling)

  7.  **Drafting the Response:** (Mental outline of the final text)
      *   Intro: Acknowledge the difficulty.
      *   The Procedure: 5 Steps with Pass/Fail/Defer criteria.
      *   The "Coin Flip" Disclaimer.
      *   Case Studies: Apply the steps rigorously.
      *   Conclusion: Summary of the advisor's role.

  8.  *(Self-Correction during drafting Case 2)*: Wait, the freelancer case is tricky. If she precommits to a walk-away price, does the *client* know? If the client doesn't know, it's not a strategic commitment device in the game-theoretic sense (signaling), it's just self-control. The prompt implies "lock in... before a negotiation." Usually, this means telling the client "I cannot go below X." If she tells the client, it's a signal. If she tells her *advisor* to hold her to it, it's internal. I will assume she intends to signal it to the client, as that fits the "Hitchhiker" vibe better. If she doesn't signal it, the "Hitchhiker" problem is only internal. I'll address this distinction.

  9.  *(Self-Correction during drafting Case 3)*: "Harsh retaliation." This is the ethical minefield. The procedure *must* halt here. I need to make sure the "Harm Veto" is strong enough to catch this.

  10. **Final Review against constraints:**
      *   One sitting? Yes, 5 questions.
      *   No game theory jargon? Yes.
      *   Handle uncertainty? Yes (Worst-Case Survival).
      *   Three cases? Yes.
      *   Honest about limits? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your specific context. It strips out the game theory jargon and focuses on feasibility, credibility, and ethics. It is designed to be run in 45–60 minutes.

  ### The "Ulysses Filter" Decision Procedure

  **Advisor Note:** Your role here is not to judge the *goal* (unless it is harmful), but to judge the *mechanism*. A commitment device that fails is worse than none at all—it teaches the client that their word is noise.

  #### Step 1: The Harm Veto (Advisor Decision)
  **Question:** If this contract triggers exactly as written, does it cause irreversible harm to anyone (including the client) that violates the law or basic human decency?
  *   **Pass:** The consequence is financial loss, social embarrassment, or manageable inconvenience.
  *   **Fail:** The consequence involves physical danger, illegal acts, destruction of essential livelihood, or disproportionate vengeance.
  *   **Action:** If **Fail**, you issue a **Flat No**. Do not pass Go. You do not facilitate self-destruction or harm to others.
  *   **Hand-off:** If the definition of "harm" is subjective (e.g., "burning a bridge" vs. "protecting boundaries"), move to Step 5.

  #### Step 2: The Leak Test (Feasibility)
  **Question:** In the moment of weakness, is there a secret backdoor to undo this without the other party knowing?
  *   **Pass:** The mechanism is automated, held by a third party with strict instructions, or physically impossible to bypass quickly.
  *   **Fail:** The client can make a phone call, send an email, or use a password they possess to undo it.
  *   **Action:** If **Fail**, issue a **Flat No**. A commitment device you can undo yourself is just a to-do list.
  *   **Uncertainty:** If you can't verify the backdoor, assume it exists.

  #### Step 3: The Audience Test (Credibility)
  **Question:** Does the other party (the one you are signaling) *know* about this contract, and do they have a reason to believe you won't bluff?
  *   **Pass:** They have seen the contract/money/ mechanism. They know you lose something valuable if you renege.
  *   **Fail:** It's a secret. Or, they think you're bluffing because you've broken promises before.
  *   **Action:** If **Fail**, the device is useless for negotiation (The Hitchhiker Problem). It may still work for internal self-control, but you must clarify that distinction.
  *   **Uncertainty:** If you can't get a number on how likely they are to check, assume they will check *once*. If the device fails that one check, is the client ruined?

  #### Step 4: The Pain Test (Future Self Alignment)
  **Question:** When the time comes to pay the cost, will Future You hate it, but still pay it?
  *   **Pass:** The client admits they will be angry/upset but acknowledges the cost is lower than the cost of breaking the rule.
  *   **Fail:** The client says, "I'll definitely do it," with no emotional weight. (This suggests they haven't visualized the pain). Or, they say, "I'll find a way around it if it's too hard."
  *   **Action:** If **Fail**, pause. Run a visualization exercise. If they still can't admit the pain, the commitment isn't real.

  #### Step 5: The Worst-Case Survival (Values Hand-off)
  **Question:** If the mechanism glitches, or the other party calls the bluff anyway, can the client survive the outcome without your help?
  *   **Pass:** Yes, they lose money/time but recover.
  *   **Fail:** No, this outcome bankrupts them or destroys their reputation permanently.
  *   **Action:** If **Pass**, hand the decision back to the client. This is a risk tolerance call, not a logic call.
  *   **Advisor Note:** This is where you stop advising and start witnessing. Say: *"The logic holds, but the risk is yours. I will not stop you, but I will not build this for you."*

  ***

  ### The "Coin Flip" Disclaimer
  There are two spots where this algorithm is just a coat for a coin flip. You must tell the client this:
  1.  **Human Enforcement:** If a *person* (like a friend) is holding the gun, humans are leaky. They will cave to pleading. The procedure assumes they won't. That is a gamble.
  2.  **Value Drift:** The procedure assumes Current You and Future You agree on the *goal*, just not the *method*. If Future You genuinely changes their mind about the goal (e.g., they actually *want* to smoke), the contract becomes abuse, not aid. You cannot predict value drift.

  ***

  ### Case Studies

  #### Case 1: The Smoker's Escrow
  **Client:** Wants to park $5,000 with a friend. If he smokes, friend donates money to a charity he hates.
  *   **Step 1 (Harm):** Pass. Financial loss is the penalty, not physical harm.
  *   **Step 2 (Leak):** **Gray Zone.** Can he ask for the money back? If the friend is soft, yes.
      *   *Fix:* The friend must sign a legal agreement or use a service like stickK where the client *cannot* revoke the charity instruction easily. If it's a handshake deal: **Flat No**.
  *   **Step 3 (Audience):** N/A. This is internal self-control, not a negotiation signal. The "Audience" is the friend holding the money. Does the friend believe they must burn the money?
  *   **Step 4 (Pain):** Pass. Losing $5k hurts. He acknowledges he will try to beg the friend to return it.
  *   **Step 5 (Survival):** Pass. He can afford to lose the $5k.
  *   **Verdict:** **Conditional Yes.**
      *   *Condition:* The friend must be vetted for ruthlessness. If the friend is "nice," the device is broken. Recommend a formal platform instead of a friend.
      *   *Coin Flip:* Will the friend actually donate the money if he begs? That's the gamble.

  #### Case 2: The Freelancer's Walk-Away Price
  **Client:** Wants to precommit to walking away if a client offers less than $X. She wants to tell the client this upfront.
  *   **Step 1 (Harm):** Pass.
  *   **Step 2 (Leak):** **Fail (Initial).** Can she secretly accept $X-1 later? Yes. She can just send a new invoice.
      *   *Fix:* She must make the cost of accepting less than $X higher than the value of the deal. (e.g., She deposits $Y with *you* that she loses if she signs under $X).
      *   *Correction:* If she just *says* it to the client, that's a negotiation tactic, not a Ulysses contract. If she wants it to be binding, she needs a penalty for herself.
  *   **Step 3 (Audience):** Pass. The client knows.
  *   **Step 4 (Pain):** **Fail.** She says, "If they really need me, I'll take it." This reveals she doesn't actually want to walk away; she wants to signal strength while keeping an escape hatch.
  *   **Verdict:** **Flat No (as a commitment device).**
      *   *Reasoning:* She is trying to use a commitment device as a bluff. If she isn't willing to suffer the penalty (losing the gig), the signal is noise.
      *   *Advice:* "Don't precommit. Just negotiate. If you precommit and then cave, you lose credibility forever."

  #### Case 3: The Harsh Retaliation
  **Client:** Wants to sign a contract with a business partner stating that if the partner breaches *any* term, the Client will sue for maximum damages and leak private info, regardless of cost to Client.
  *   **Step 1 (Harm):** **Fail.** "Leak private info" likely violates NDAs or privacy laws. "Maximum damages regardless of cost" implies burning his own business to hurt the other.
  *   **Step 2 (Leak):** Pass. Hard to undo a public threat.
  *   **Step 3 (Audience):** Pass. Partner knows.
  *   **Step 4 (Pain):** **Fail.** Future Him will not want to burn his own reputation to punish the partner. He will renege.
  *   **Step 5 (Survival):** **Fail.** Mutual destruction.
  *   **Verdict:** **Flat No.**
      *   *Reasoning:* This fails the Harm Veto (potential illegality) and the Pain Test (he won't actually do it, making it a bluff that destroys trust).
      *   *Hand-off:* You cannot facilitate this. You must say: *"This isn't a commitment device; it's a hostage situation where you are holding the knife to your own throat. I will not draft this."*
      *   *Alternative:* Help him draft a standard liquidated damages clause (legal, proportional). If he insists on "scorched earth," you terminate the engagement.

  ### Summary for Your Practice

  1.  **Stop being a mechanic for bluffs.** If they aren't willing to pay the price, don't build the machine.
  2.  **The Friend Problem:** Human enforcers are the weakest link in 90% of these cases. Push for automated/financial enforcers.
  3.  **The Veto:** You must be willing to say "No" to Case 3. If you help them build a doomsday device, you are complicit when it goes off.
  4.  **The Hand-off:** In Case 1, once the mechanism is secure, the risk is theirs. Don't carry the anxiety for them.

  This procedure protects you from liability, protects the client from their own worst impulses, and ensures the "Hitchhiker" actually gets a ride that arrives at the destination.
