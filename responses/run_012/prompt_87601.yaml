answer: |-
  ### The Scenario: The Barrow of the Sealed Stone

  **The Site**
  Excavations at Hollow Creek reveal a small burial ground dating to roughly 2500 BCE. There are twelve graves arranged in a loose circle. Each grave contains a single human skeleton, laid on its side in a crouched position. There are no buildings, no monuments above ground, and no writing. The soil is acidic, so no bone or wood survives except the human remains and some stone tools.

  **The Objects**
  Every grave contains the exact same set of items, placed in the exact same configuration:
  1.  **Two Ceramic Jars:** Placed near the head of the skeleton. Both are sealed with a layer of clay over the rim. Residue analysis shows they originally contained grain and animal fat.
  2.  **One Stone Axe:** Placed across the chest of the skeleton. Every axe is deliberately snapped in half. The breakage is clean, not worn from use.
  3.  **Red Ochre:** A powder sprinkled over the body and the objects.
  4.  **Placement:** The graves are dug deep, well below the layer where living activities (cooking, tool-making) occurred. There is no evidence of later visitation (no footpaths, no offering pits on top).

  **The Constraint**
  We have no access to the minds of these people. We have no texts from them or their neighbors. We have no living descendants whose traditions we can consult. We have only the dirt and the stones.

  ***

  ### The Two Reconstructions

  **Reconstruction A: The Provisioning (The Journey)**
  The people believed death was a departure to another place. The dead would need sustenance and tools for this journey.
  *   **The Jars:** Rations for the road. The clay seal keeps the food fresh until the spirit needs it.
  *   **The Axe:** A tool for clearing the way in the next world. It is snapped to release its "spirit" or essence, making it usable by a spirit body, or perhaps to signify it is no longer for the living.
  *   **The Ochre:** A sacred paint to honor the traveler.
  *   **The Depth:** Respectful distance, separating the realm of the dead from the living.
  *   **No Visitation:** The dead have left; there is no point in visiting them.

  **Reconstruction B: The Quarantine (The Contagion)**
  The people believed death was a dangerous pollution. The dead were volatile and could harm the living if their possessions remained active.
  *   **The Jars:** Bribes or bait to keep the spirit satisfied and underground. The clay seal traps the dangerous scent or spirit of the food inside so it doesn't leak out.
  *   **The Axe:** A dangerous object touched by death. It is snapped to "kill" its utility so it cannot be used to harm the living, or to break its connection to the physical world.
  *   **The Ochre:** A protective barrier or marker of contamination (like a hazard sign).
  *   **The Depth:** Containment. You bury dangerous things deep so they don't affect the surface.
  *   **No Visitation:** You do not visit dangerous things.

  ***

  ### The Analysis

  **1. Walking Through the Evidence**
  Let's look at the neutrality of the traces.
  *   **Sealed Jars:** To the Provisioning view, a seal preserves. To the Quarantine view, a seal contains. Physically, a clay plug looks the same whether it is keeping goodness in or badness in.
  *   **Snapped Axe:** To the Provisioning view, breaking transforms the object for spiritual use. To the Quarantine view, breaking neutralizes the object. In both cases, the physical result is a broken axe in a grave.
  *   **Red Ochre:** To the Provisioning view, it is honorific (like a uniform). To the Quarantine view, it is apotropaic (like a warning label). Chemically, it is identical iron oxide.
  *   **Deep Burial/No Visitation:** To the Provisioning view, this is finality (they are gone). To the Quarantine view, this is isolation (they are trapped). The spatial data is the same.

  Every observable feature fits both stories perfectly. There is no "smoking gun" in the dirt.

  **2. The Load-Bearing Feature: Behavioral Inertness**
  You asked what feature is doing the work. It is indeed the **inertness stipulation**.
  In archaeology, we usually distinguish beliefs by looking for *variation* in practice. If people who believed in a Journey treated their *own* tools differently than the dead's tools, we could spot a difference. If the Quarantine people burned the axes of enemies but buried the axes of kin, we would have a clue.

  By stipulating that the beliefs produce *exactly* the same behavior in *exactly* the same circumstances, you have removed the only mechanism archaeology has to distinguish them. Archaeology studies the footprint, not the foot. If two different feet make the exact same footprint, the geology of the mud cannot tell you whose foot it was.

  If you drop the inertness stipulation, the case collapses back into ordinary inference. We would look for "spillover." Do we find broken axes in rubbish pits? (Maybe Quarantine). Do we find food stores in houses sealed the same way? (Maybe Provisioning). We would look for analogies in how they treated living guests vs. dead ones. Without inertness, the underdetermination is partial, not total. We might not be *sure*, but we could weigh probabilities based on broader behavioral patterns.

  **3. The Strongest Counter-Attack: The "Practice" Argument**
  You asked for the strongest move from someone who thinks you *can* read beliefs from objects. The strongest argument against your case doesn't come from finding new evidence; it comes from attacking the definition of "belief."

  This is often called a **Practice Theory** or **Pragmatist** objection. Their argument runs like this:
  *"You are assuming that 'belief' is a hidden mental movie that happens before the action. But in human life, belief is often just the disposition to act. If two groups do the exact same things, care for the dead in the exact same way, and treat the objects with the exact same level of seriousness, then for all social and historical purposes, they hold the **same belief**."*

  To this archaeologist, the difference between "Provisioning" and "Quarantine" is a translation problem for *us*, not a reality for *them*. The meaning of the action is in the doing. If the action is identical, positing a hidden mental difference is "ghost-hunting." It adds a layer of speculation that doesn't actually explain anything about the society. They would argue that your scenario describes a distinction without a difference.

  **Does this move land?**
  It lands hard on the *relevance* of the question, but it doesn't solve the *truth* of the question.
  *   **It succeeds** in showing that archaeology might not *need* to know the difference to understand how the society functioned.
  *   **It fails** to prove the mental states were actually the same. It is logically possible that one group was weeping with love (Journey) and the other trembling with fear (Quarantine) while performing the exact same rite. The Practice theorist essentially says, "We can't know that, so it doesn't count as knowledge." You might reply, "It counts as truth, even if it's unknowable."

  **4. Settled vs. Contested Ground**
  Here is where you need to be careful not to mistake philosophical debate for archaeological consensus.

  *   **Settled:** It is a consensus in modern archaeology that objects do not "speak" for themselves. Context is king. Everyone agrees that a pot in a grave could mean many things. The idea that we can read beliefs "straight off objects" (as you put it) is largely abandoned by professionals. They know they are interpreting.
  *   **Contested:**
      1.  **The Coherence of Inert Belief:** Philosophers and theorists disagree on whether your "inertness" scenario is even possible. Some (following Wittgenstein or Ryle) argue that if there is *no* behavioral difference ever, the beliefs are not actually different. Others argue that internal states are real even if behaviorally identical. This is a live philosophical fight, not a settled fact.
      2.  **The Goal of Archaeology:** Some archaeologists say, "Our job is to reconstruct the mental world, even if we have to guess." Others say, "Our job is to reconstruct social practice; mental states are none of our business." Your case highlights this divide.

  **Summary of the Load-Bearing Points**
  *   **Your Framing:** You framed this as an epistemological problem (what can we know?).
  *   **The Argument's Engine:** The argument works *only* if "belief" is defined as an internal state separate from action.
  *   **The Weak Point:** If "belief" is defined as a pattern of behavior (as many modern theorists do), your two reconstructions merge into one, and the underdetermination vanishes because the difference vanishes.

  **Conclusion**
  You can build the case, but it functions as a trap. It proves that *if* beliefs are hidden internal movies, the material record cannot access them. But many experts will respond by saying that beliefs aren't hidden movies—they are public actions. If they are public actions, and the actions are identical, then the "difference" you are looking for doesn't exist in the world to be found.

  The record underdetermines the *internal state*, yes. But whether that internal state is the right thing to be studying is the real battle.
