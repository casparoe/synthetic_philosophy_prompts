  **The short answer**

  The single leak explaining the most volume is (c): trade as a signal with many admissible motives. Liquidity needs, hedging, and rebalancing dwarf speculative information trading in actual markets. For your novel, make (c) the engine. It provides the essential camouflage for your informed characters; without noise liquidity, their trades would be instantly priced in. This allows them to act on information without triggering the no-trade conclusion, grounding your plot in market microstructure reality while maintaining dramatic tension between informed intent and public perception.

  **The ranking**

  (1) Trade as a signal with many admissible motives is the primary driver of volume. It breaks the assumption that trade reveals private information by introducing liquidity needs, hedging, and rebalancing as compatible motives. This buys the model realistic turnover rates because most market participants are not betting on alpha but managing cash flows. It breaks down only if one assumes all agents are purely speculative, which contradicts empirical data on institutional flows where liquidity management dwarfs directional betting.

  (2) Benchmark-relative evaluation explains why institutions trade even without new information or liquidity shocks. Managers maximize relative performance to avoid firing, not absolute utility, violating the Pareto efficiency premise regarding endowments because the reference point is external. This buys significant volume from index tracking and window dressing at quarter-ends. It breaks down when applied to retail traders who lack explicit peer-group mandates constraining their utility functions and performance evaluation.

  (3) Career and agency motives distort the trader's utility function away from portfolio value toward compensation, survival, and relative standing. Traders churn accounts to show activity or hide losses, generating volume unrelated to information or liquidity needs. This buys explanatory power for excessive turnover in managed funds where agents do not bear the full principal risk. It breaks down in proprietary trading shops where alignment is tighter, though reputation concerns regarding drawdowns persist.

  (4) Divergent priors allow traders to hold genuinely different models of the world, sustaining speculative volume without new data. This breaks the common prior assumption, allowing agreeable bets based on subjective belief rather than evidence conditioning. It buys a theoretical basis for speculation among rational agents who simply disagree on probabilities. It explains less volume than liquidity needs because most actors converge on similar risk models over time, leaving only hard-core speculation.

  (5) Bounded depth of reasoning limits the iterated inference required to unravel prices, allowing less sophisticated traders to transact. This breaks the common knowledge of rationality premise, stopping the regress of "he knows that I know" after a step or two. It buys behavioral volume from retail and institutions who fail to price in the information revealed by offers. It breaks down in high-frequency arenas where reasoning depth is encoded in algorithms approximating infinite regress.

  (6) Opacity of the information-acquisition structure prevents the market from decoding who is informed and why, blinding observers to the signal content. This breaks the common knowledge of the structure by which information is acquired, ensuring the inference from offer to information has nowhere to land. It buys cover for informed traders to operate without immediate price adjustment. It breaks down in transparent markets where information leakage is minimized, reducing its explanatory power there.

  (7) Process utility suggests agents take direct satisfaction from holding a view and acting on it, valuing the position beyond payoff. This breaks the expected-utility maximisation over terminal wealth, treating trading as consumption or gambling rather than investment. It buys explanatory power for retail gambling and obsessive day-trading volumes. It breaks down when applied to large institutional flows where fiduciary duty strictly separates process from outcome satisfaction and gambling is prohibited.

  **The item that is not a leak**

  You are correct that (h) dissolves. The Milgrom–Stokey theorem explicitly assumes asymmetric information exists; its conclusion is that even with private knowledge, trade collapses because prices adjust to reflect that information before execution. Critics reach for it because intuition suggests information asymmetry should drive trade, not prevent it. They conflate the existence of private information with the ability to profit from it, missing the theorem's insight that rational counterparties will infer the information from the trade offer itself. Thus, asymmetry alone is insufficient without a breakdown in common knowledge or rationality.

  **What I would have to change in the setup**

  The smallest revision is introducing noise traders, breaking the "no non-rational interference" premise. This allows informed traders to hide their signals within random liquidity flow, preventing prices from fully revealing information before execution. This costs the theorem its strong epistemological point: markets no longer perfectly aggregate information into prices. Instead, prices become noisy signals, balancing information revelation with opacity. This revision sacrifices the idea of markets as perfect information processors to save the phenomenon of trading volume, accepting that efficiency is always compromised by the noise required to sustain liquidity.
