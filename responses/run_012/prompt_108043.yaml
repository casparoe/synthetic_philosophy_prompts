  # Strategic Aggregation and Level Selection
  **Prepared for Northwick University Trust by Stratum & Layer LLP**

  ## Executive Summary
  Institutions frequently encounter datasets that appear contradictory: overall metrics suggest one conclusion, while disaggregated figures suggest another. This is not an error in calculation, but a property of hierarchical data known as Simpson's Paradox. Stratum & Layer LLP specialises in 'Level Selection': the methodological determination of the appropriate aggregation level for reporting. This paper outlines the application of Level Selection to Northwick University's recent admissions data review.

  ## Case Study: Northwick Admissions
  Northwick faced scrutiny regarding gender disparity in admissions. The pooled data indicated a bias against female applicants. However, when stratified by Faculty, the trend reversed. Further stratification by Course within Faculty reversed it again. All three representations are mathematically correct. The objective is not to find the 'true' figure, but the figure that aligns with the causal question being asked.

  **Table 1: Admissions Success Rates by Aggregation Level**

  | Level | Group | Male Applicants (n) | Male Accepted (n) | Male Rate | Female Applicants (n) | Female Accepted (n) | Female Rate |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pooled** | **University** | **100** | **50** | **50%** | **100** | **30** | **30%** |
  | **Dept** | Science | 90 | 10 | 11% | 90 | 20 | 22% |
  | | Arts | 10 | 40 | 80% | 10 | 10 | 100% |
  | **Sub-Dept**| *Sci-Physics* | *80* | *10* | *12.5%* | *50* | *5* | *10%* |
  | | *Sci-Biology* | *10* | *0* | *0%* | *40* | *15* | *37.5%* |

  *Note: Sub-Department weights adjusted for illustrative clarity of reversal.*

  In Table 1, the Pooled level suggests Male advantage (50% vs 30%). The Department level suggests Female advantage (22% vs 11% in Science; 100% vs 80% in Arts). A third level of granularity (Sub-Department) can be constructed to restore the Male advantage within every specific course. The sign flips twice.

  ## The Philosophy of Level Selection
  Clients often assume a reversal indicates deception. Stratum & Layer advises that reversals are genuine properties of the data, arising from confounding variables. The choice of level is a causal assumption in disguise. If the stratifying variable (e.g., Faculty Choice) is a mediator influenced by the subject (Gender), pooling is appropriate. If it is a confounder, stratification is appropriate.

  However, statistical causality rarely maps perfectly onto public relations or legal defence. The pooled figure answers: "What is the experience of a random applicant?" The split figure answers: "What is the experience of an applicant within a specific Faculty?" Both are correct answers to different questions. The objection arises not from partitioning, but from the *post hoc* selection of a partition to suit a predetermined narrative. Stratum & Layer formalises this selection to ensure consistency.

  ## Recommendations
  To resolve the current discrepancy in reporting, Northwick should adopt the following protocol:

  1.  **Align Aggregation with Budgetary Control:** Report data at the level where funding decisions are made. If admissions budgets are set by Faculty, report by Faculty.
  2.  **Suppress High-Variance Strata:** If a sub-group contains fewer than 20 applicants, pool it with the parent group to prevent statistical noise from driving narrative.
  3.  **Prioritise Stability:** Select the level of aggregation that minimises year-on-year volatility in the reported metric.
  4.  **Contextual Consistency:** Once a level is selected for a reporting cycle, maintain it across all demographic categories to avoid accusations of selective granularity.

  ## Ethics Appendix: On Cherry-Picking
  **Q: Does Level Selection constitute cherry-picking?**

  **A:** No. Cherry-picking implies selecting data points to ignore contradictory evidence. Level Selection selects the *context* in which the evidence is interpreted. All levels remain in the dataset; we simply advise clients on which level possesses the highest 'decision relevance'. Transparency is not the obligation to present all tables simultaneously, but to present the table that best informs the stakeholder's specific decision. If a pooled figure misleads a departmental head, presenting it is arguably less ethical than presenting the stratified view. We do not hide data; we curate context.

  ***

  **Stratum & Layer LLP**
  *Clarifying the Picture, One Layer at a Time.*
