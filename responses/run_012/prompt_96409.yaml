  The principle underlying your verdicts is what I will call the **Independent Warrant Principle**. It states:

  **A moral belief is undermined by its causal genealogy if and only if that explanation exhausts the justification for the belief, leaving no independent normative ground—such as harm, consent, or voluntary obligation—that validates the belief's content apart from the psychological cause.**

  This principle avoids circularity by defining "independent normative ground" as facts accessible to reason (e.g., physical suffering, explicit promises) rather than introspective feelings.

  **Motivation for the Clauses:**
  *   **Harm/Suffering:** This clause distinguishes Case 1 (Incest) from Case 4 (Defilement). In Case 1, the disgust is accompanied by an objective risk of harm to a child, which stands as a warrant independent of the disgust mechanism. In Case 4, the revulsion is the only evidence; there is no external harm. This clause also saves Case 3 (Cruelty); even if the *intensity* of your horror is evolutionary, the *wrongness* is grounded in the objective fact of the child's suffering.
  *   **Voluntary Obligation:** This clause explains the split between Case 2 (Parental Partiality) and Case 7 (Compatriots). Both share the same evolutionary machinery, but you cite "I took the job on" for your children. This voluntary assumption of care is an independent rational warrant. You cite no such commitment for compatriots, leaving that belief dependent solely on the parochial impulse.
  *   **Exhaustiveness:** This clause handles Case 5 (Jealousy) and Case 8 (Desert). In these instances, every warrant you reach for turns out to be the feeling restated (e.g., "it feels unjust" explains why you believe it's unjust). The genealogy explains the belief *and* the only support for it.

  **Verdicts on New Cases:**
  1.  **Animal Suffering:** **Not Undermined.** Even if the concern is a spillover of parental care, the independent warrant is the animal's objective capacity for suffering (sentience), which exists regardless of your psychological origin story.
  2.  **Dietary Taboo (e.g., Pork):** **Undermined.** If the belief that eating pork is wrong is explained by pathogen avoidance or group marking, and there is no independent harm (assuming modern safety) or consent violation, the belief is merely a heuristic.

  **The Cost:**
  This principle forces you to align Case 6b with Case 6a. In both cases, you stipulate identical explanations (contamination heuristic) and identical normative facts (no harm, wish freely expressed). You verdicted 6a as undermined but 6b as not, based on an undefended intuition that 6b is "about a person." The principle dictates that without an independent warrant (like harm or rights violation), the belief is undermined. To keep the principle, you must abandon verdict **6b**. The cost is acknowledging that some intuitions about "dignity" or "respect" in the absence of harm may be refined biological heuristics rather than objective moral truths.

  \answer{A belief is undermined if its genealogy exhausts its justification, leaving no independent normative ground like harm, consent, or voluntary obligation; 6b}
