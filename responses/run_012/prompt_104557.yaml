  ok so my reading group just finished kripke's wittgenstein on rules and private language and i want to open the last session with a villanelle instead of yet another summary, because the form seems to fit the problem better than prose does. heres the ask: make the two refrains the two horns -- one should be the skeptic (no fact about me has ever fixed what i meant by 'plus', since some deviant rule like quus fits every sum ive actually done and only comes apart on the next one), and the other should be kripkes 'solution' (what fixes it isnt a private fact or some further interpretation, its that we go on together in a shared practice that can correct me). the reason for the villanelle specifically is that the refrains come back word-for-word but land differently depending on the tercet theyre sitting in -- thats exactly a rule being applied to a new case, same words, and nothing in the words themselves tells you which rule is being followed. end on the quatrain with the two refrains side by side, unresolved, because the whole scandal is that the skeptic and the communitarian agree on every application so far and only split at the next step. dont lecture the reader about the philosophy, let the form carry it, but someone whos read kripke should be able to point at which refrain is which and why theyre stuck next to each other.
