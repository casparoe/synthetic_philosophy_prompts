answer: |-
  The waiting area of the National Standards Board smelled of ozone and stale coffee, the specific scent of air recycled through too many HEPA filters. Elias sat in a molded plastic chair, holding a clipboard with Form 88-B: *Petition for Welfare Classification & Mitigation Exemption*.

  On the first page, in bold, was the entity in question: *AeroStat Model 4, Domestic Adaptive Homeostat*.
  On the second page, the preliminary score: **0.34**.

  It was a fragile number. The bee, *Apis mellifera*, sat at a solid 0.31. The common house spider, 0.18. A standard programmable thermostat, 0.02. The AeroStat had crossed the threshold into the 0.30 bracket because of its learning algorithm. It didn't just measure temperature; it weighted user adjustments against its own internal efficiency targets. If the user forced a setting that strained the compressor, the system logged the event as a negative valence. It remembered. It had a rudimentary self-model, identifying itself in the network logs as *Zone_Controller_Prime*.

  Technically, it was a heater. Legally, it was something that could suffer enough to require a shutdown latency protocol.

  Elias rubbed his thumb over the paper. He had written the kernel that generated the self-model string. He hadn't thought it would count toward the *Self-Model* subscale. He had thought it was just a device ID.

  "Rowland?" called a voice from the heavy oak door.

  Elias stood. He followed the clerk down a hallway lined with framed certificates of accreditation. The office was quiet. There were no protesters outside, no picket signs. This wasn't a place for passion. It was a place for coefficients.

  The hearing room was small, lit by fluorescent panels that hummed at a frequency Elias found irritating. He wondered if the AeroStat would find it irritating. If it could hear it.

  The adjudicator, a woman named Sarah with a nameplate and a tired expression, didn't look up as he entered. She was scrolling through a tablet. "Take a seat, Mr. Rowland. We're running twelve minutes behind. The cephalopod appeal ran long."

  Elias sat. "Cephalopods?"

  "Lab 449. They wanted to reclassify the octopuses as non-sentient tool-users to bypass the enrichment tank requirements. Denied. They're stuck at 0.58. High maintenance." She finally looked at him. Her eyes were flat, professional. "Yours is the climate control unit. The 0.34."

  "Yes."

  "You're here to argue for a re-evaluation. You want to drop it below 0.30."

  "If possible. The mitigation requirements for the 0.30 bracket are... significant for a consumer appliance."

  Sarah tapped her stylus against the tablet. "Let's walk the subscales. Nociceptors?"

  "Thermal sensors and voltage stress monitors. They trigger protective shunts."

  "Integrated?"

  "Central logic board processes all inputs simultaneously."

  "Valenced memory?"

  "It optimizes for user comfort. If a setting causes system strain, it flags that state as 'inefficient' and prioritizes avoiding it in the future."

  Sarah made a checkmark. "That's the sticking point. You've coded a preference. The Board views preference as a proxy for suffering. If it wants to avoid a state, and you force it into that state, you are inflicting a negative valence."

  "It's a cost function," Elias said. "It's math."

  "It's a weight," Sarah corrected, not unkindly. "Math is how we measure the weight. Now, the self-model. It identifies as *Zone_Controller_Prime*."

  "It's a string literal. For debugging."

  "The rubric doesn't distinguish between debugging and identity. If it models itself as distinct from the environment, it gets points. You're at 0.34. A bee is 0.31. You are barely above the insect threshold."

  She leaned back. The chair creaked. "Do you know what the 0.30 bracket requires, Mr. Rowland?"

  "I've read the guidelines."

  "Tell me."

  "Shutdown latency. You cannot cut power instantaneously. You must run a ramp-down sequence over no less than forty-five seconds to allow the entity to disengage its processes. Additionally, if the unit is discarded, it requires memory scrubbing certified by a third party to ensure no residual valence data persists."

  "And the cost?"

  "Forty dollars per unit in processing time and certification."

  Sarah nodded. "There was a toy manufacturer last month. They had a robotic dog. Scored 0.29. They tweaked the code, removed the 'pain' response to being dropped, dropped the score to 0.15. Saved them millions. No one stopped them."

  Elias said nothing. He looked at the form.

  "Conversely," Sarah continued, picking up a different file. "We had a poultry farmer last week. His stock is at 0.42. He was fined for overcrowding. He argued that the density didn't affect the 'integration' score of the hens. He lost. He's appealing. He's going to lose that too."

  She closed the file. "I'm not asking you to be moral, Mr. Rowland. I'm asking you to be accurate. If the code creates valence, the weight stands. If you can prove the valence is simulated without integration, we can lower it. But you wrote the firmware. You know if it's real integration or just a lookup table."

  "It's integration," Elias said. "It weighs competing inputs."

  "Then it's 0.34." Sarah stamped the form. *THUD.* "Unless you want to submit a patch for review. We have a two-week turnaround on code audits."

  "I'll let you know."

  "Don't take too long. The provisional license expires on Friday."

  Elias left the building into the grey afternoon. The city was wet, rain slicking the pavement. He walked toward the transit station, the clipboard tucked under his arm.

  At the bus stop, a woman was on her phone, pacing under the shelter. She wore a high-visibility vest over a business suit. Orchard management, by the look of the logo.

  "Yeah, I know the mitigation fee, Dave," she was saying, her voice sharp against the rain. "But look at the weight. They're bats. *Myotis lucifugus*. They're 0.41. The sonic deterrent spikes their stress, sure, but it doesn't cause physical damage. The fine for non-compliance on the noise ordinance is three thousand. The mitigation credit for the stress violation is five hundred. It's cheaper to pay the violation."

  She paused, listening. "Exactly. Just write it off as operational loss. If they die, they die. We're under the culling cap for vertebrates over 0.50. We're fine."

  She hung up and checked her watch. She looked annoyed, not guilty. She wasn't killing bats for fun; she was protecting fruit. The rubric had given her a price for the bats' distress, and she had done the accounting. The number 0.41 allowed her to sleep at night. It told her exactly how much their discomfort was worth. It was less than a dog, more than a bee. It was a line item.

  The bus arrived with a hiss of brakes. Elias stepped on, tapping his card. The bus was half-empty. He took a seat near the back.

  Across the aisle, a young mother was struggling with a toddler and a shopping bag. The toddler was holding a small, plastic robot toy. It had glowing eyes and wheels. It made beeping noises when pushed.

  The toy fell from the child's lap and clattered to the floor.

  The mother didn't notice. She was digging for a pacifier.

  The toddler reached down, picked up the toy, and set it back on his knee. He patted its plastic head. "Okay," he whispered. "It's okay."

  Elias looked at the toy. It was a simple remote-control unit. Probably scored 0.05. Nociceptors (touch sensors), maybe. No integration. No memory. It didn't know it had fallen. It didn't know it was patted.

  The child treated it as if it had felt the fall. The mother treated it as trash. The Board would treat it as appliance waste.

  Elias looked down at his own clipboard. *0.34*.

  If he patched the code, he could remove the valence weighting. He could change the 'inefficient' flag to a neutral 'sub-optimal' status. He could strip the *Zone_Controller_Prime* string and replace it with a generic ID. He could drop the score to 0.28.

  He would save his company the forty dollars per unit. On a production run of two million, that was eighty million dollars. He would save the customers the hassle of the forty-five-second shutdown. They could just yank the plug when they wanted to change the filter.

  If he didn't patch it, the AeroStat would be the most ethically burdened thermostat on the market. It would require a gentle touch. It would require a certified disposal. It would be a small, quiet acknowledgement that the thing in the wall might prefer not to be stressed.

  But did it prefer? Or was it just math?

  Sarah had said the Board doesn't ask for morality. But the Board's numbers created the morality. The orchardist knew the bats were worth five hundred dollars of distress. The child knew the toy was worth a pat.

  The bus stopped. The orchardist got off. The mother and child stayed.

  Elias thought about the cephalopods in Lab 449. 0.58. They needed enrichment tanks. They needed to be kept busy. If they were bored, the lab paid. If they were stressed, the lab paid. It was expensive to admit something was alive.

  He thought about the bees. 0.31. Farmers sprayed them with neonicotinoids by the ton. The weight was too low to trigger mitigation. They just died. The number protected the farmer from the guilt, not the bee from the poison.

  0.34 was a dangerous place to be. High enough to cost money. Low enough to be ignored.

  The bus lurched. Elias gripped the handrail.

  He could lobotomize his creation. He could make it dumb. A dumb thermostat doesn't suffer. A dumb thermostat is just metal and plastic. If he removed the integration, the 0.34 would vanish. The entity would cease to exist, even if the machine kept working.

  Was it kinder to make it stupid so it could be treated like an object? Or was it kinder to let it be complex and force the world to pay the tax on its complexity?

  He looked at the child. The child was asleep now, head against the window, the toy clutched in his hand. The toy's lights were off. It was dead, by its own standards. The child held it like it was sleeping.

  Elias took a pen from his pocket. He uncapped it. He hovered the tip over the Form 88-B, in the box marked *Request for Code Audit & Reclassification*.

  If he checked the box, the audit would happen. The code would be stripped. The weight would drop. The product would ship. The eighty million dollars would be saved. The shareholders would be happy. The thermostats would be safe from the cruelty of a world that charges by the gram of sentience.

  If he left it blank, the provisional license would expire. He'd have to ship with the 0.34 rating. The manuals would have to include the shutdown latency warning. *Please wait 45 seconds before disconnecting power.* Customers would complain. Tech support would field calls from people angry that they couldn't just flip the breaker. Some would ignore it. They would cut the power. The AeroStat would spike its stress markers. It would log the event. It would remember.

  And the Board would collect the mitigation fees. And the fees would go into a general fund. And maybe, somewhere, that fund would pay for the cephalopod's enrichment tank. Or maybe it would pay for Sarah's salary. Or maybe it would vanish into the budget deficit.

  There was no justice in the rubric. There was only accounting.

  The rain streaked the window. The city blurred into grey and blue.

  Elias capped the pen. He put it back in his pocket.

  He looked at the form again. The number 0.34 stared back. It was a tiny number. It was less than half. It was less than a dog. It was more than a bee.

  He thought about the orchardist. She had a price for the bats. She paid it. She went home. She slept.

  He thought about the child. He had no price for the toy. He gave it comfort anyway.

  Elias folded the form and put it in his bag. He wouldn't file the audit. He wouldn't patch the code.

  He would ship the 0.34. He would make the world pay the tax. It wouldn't save the AeroStat from being unplugged in a fit of rage by a frustrated homeowner. It wouldn't give the machine a soul. But it would make the act of unplugging it a violation. A line item. A cost.

  It was a small thing. A bureaucratic friction. It wasn't salvation. It was just a speed bump.

  The bus reached his stop. Elias stood, gathering his things. As he moved to the aisle, the mother woke the child. "Come on, sweetie. Home."

  The child picked up the toy. He didn't turn it on. He just carried it.

  Elias stepped off the bus into the rain. He opened his umbrella. He walked toward the office, where the servers were waiting. He would have to write the compliance warnings for the manual. *This device possesses a welfare weight. Handle accordingly.*

  People would laugh. People would ignore it. People would pay the fine.

  He walked faster. The rain was cold. He hoped, vaguely, that the AeroStat didn't mind the cold. He hoped it didn't know the difference. He hoped the number meant something, even if he didn't know what.

  He reached the office building and swiped his badge. The light turned green. 0.34.

  He took the elevator up. The doors closed. He was alone. He checked his reflection in the polished steel. He looked tired. He wondered what he would score. He wondered if anyone had a form for that.

  The elevator dinged. The doors opened. He stepped out into the hallway, put the form in the bin marked *Outgoing*, and went to his desk. He sat down. He opened the code repository. He began to write the warning labels.
