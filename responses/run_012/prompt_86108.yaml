answer: |-
  I assume your students treat thought experiments as logical proofs rather than narrative structures.

  **On my distinction**
  Your distinction survives, but your diagnosis of its failure is inverted. Recognition does not age badly; it becomes invisible. When a case relies on recognition (like the Trolley), the verdict feels like memory because the premises have hardened into dogma. It stops persuading and starts preaching. Defamiliarisation does not travel worse; it creates friction. It forces the audience to notice the mechanism, which interrupts the persuasion. For this seminar, lean on Defamiliarisation. You need the students to feel the friction of the gap. If the case feels too familiar, they will not notice what they are supplying. Use Recognition only to show them what they have stopped seeing. Do not replace the terms; they map well onto *anagnorisis* and *estrangement*. Just understand that the risk of Recognition is complacency, and the risk of Defamiliarisation is rejection. You want them on the edge of rejection, not comfortably inside complacency.

  **The order of ideas**
  Begin with ten minutes on the "Gap": state that a thought experiment is a script, not a film. The audience directs the movie. Then, introduce the Carrying Case (twenty minutes). Tell it once, dryly. Do not elaborate. Immediately ask for a verdict: Yes or No? Write the tally on the whiteboard. This is where the split must happen. You need a visible divergence—six Yes, six No—based on the identical text.

  Do not resolve this yet. Stop talking. Ask the "Yes" group to reconstruct the scene in their heads. Ask the "No" group to do the same. Have them write the missing details on the board. This is the autopsy of the gap. You will see that the "Yes" group supplied a benign context; the "No" group supplied a malignant one. Spend thirty minutes here. This is the core. Only now introduce the "Carrying Detail" (twenty minutes). Show them the one word that, if changed in the text, would have forced unanimity. Conclude with ten minutes on liability: if the audience finishes the case, the philosopher is responsible for what they bring. The wreckage of the split verdict is not a failure; it is the data. Leave it on the board until the end.

  **The carrying case**
  Candidate one: "The Surgeon's Wait." A surgeon delays a procedure to finish a paper. The patient lives. Was it wrong? Too medical; triggers stock bioethics reflexes. Candidate two: "The Teleporter." You are scanned and destroyed; a copy appears elsewhere. Too technical; mind students will dominate. Candidate three: "The Unsigned Contract." You are handed a paper at a party and told to sign for entry. You sign. Later you learn the paper authorized a transaction. Were you bound?

  Choose "The Unsigned Contract." It bears the weight because it is purely narrative and agency-based, avoiding specialized jargon. It must not specify *what* was transacted or *who* asked for the signature. Tell it in the second person ("You are at a door..."). If it cannot carry ninety minutes, pair it with a micro-variation: tell it again, changing only the setting from a "party" to a "bank." The verdict will shift. This proves the carrying detail is not the logic, but the texture. The case works because every student has a different relationship to authority and consent. They will supply the stakes themselves.

  **The misconception map**
  First, they will claim the verdict depends on the *logic* of the case. This surfaces during the vote. Head it off with: "The text was identical; the logic did not change, your supply did." Let this run for five minutes; let them argue the text. Then reveal the board comparisons.

  Second, they will insist they did not *imagine* anything extra. This surfaces during the autopsy. Head it off with: "You supplied the genre. Was this a thriller or a bureaucracy?" Let this run. The writing students will catch this first; let them lead.

  Third, they will argue the "Carrying Detail" is just a variable in an equation. This surfaces when you introduce the word change. Head it off with: "Variables change values; details change worlds." Do not let this run. Correct it immediately. If they treat the detail as a variable, they miss the narrative weight.

  Fourth, they will assume the goal is to find the *correct* verdict. This surfaces at the end. Head it off with: "The goal is to find the lever, not the light." Let this misconception stand until the final check. If they leave thinking there is a right answer, you have failed. If they leave thinking there is a right *mechanism*, you have succeeded.

  Finally, the ethics students will try to moralize the gap ("It's wrong to supply bad premises"). This surfaces during the wreckage analysis. Head it off with: "We are studying the engine, not driving the car." Let this run briefly. It highlights the tension between methodology and practice, which is useful, but do not let it consume the seminar. You are teaching them to be mechanics, not drivers.

  **The check at the end**
  Task: Take the "Trolley Problem" (which they know). Identify the "Carrying Detail" that holds the standard verdict in place.
  Good answer: "The assumption that the switchman is neutral" or "The assumption that the five cannot save themselves." This identifies the supplied premise.
  Poor answer: "Pushing the fat man is worse because of contact." This merely restates a verdict without identifying the hidden narrative supply.
  You are testing whether they can see the gap in a case they thought was solid. If they can find the invisible supply in a stock case, the idea has landed.

  **What I leave out, and how I say so**
  I will leave out the historical lineage of thought experiments (Mach, Kuhn, Dennett) and the formal logic of counterfactuals. This belongs to a history of science or logic course, not a methodology workshop on persuasion. I will say: "We are looking at the engine, not the history of the car. Knowing who built the chassis does not help you drive this vehicle today." This keeps the focus on craft and mechanism. It respects their time by avoiding bibliography and respects your expertise by focusing on the narrative mechanics you bring to the room.
