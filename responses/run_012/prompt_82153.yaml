  | **Humean Laws** ("laws are just summaries... a compact way of recording") | Humean laws are merely descriptive generalizations or compressions of the mosaic (Best System Account). | Defensible-but-overstated | It captures the BSA spirit but omits the normative criteria (simplicity/strength balance) that distinguish laws from accidental generalizations. | Humean (would insist laws are *systematizations*, not mere lists) | No |
  | **Coincidence Charge** ("grand coincidence rather than something that had to be so") | Humean regularities are unexplained brute coincidences lacking modal necessity. | Subtle misrepresentation | Anti-Humeans call it a "coincidence" to highlight the lack of necessitation; Humeans reject the term as implying improbability where no probability space exists. | Humean (rejects "coincidence" as question-begging) | Yes |
  | **Anti-Humean Ontology** ("laws are entities... that govern the world") | Anti-Humeans posit laws as ontologically distinct items that actively constrain or produce behavior. | Accurate | Correctly identifies the core anti-Humean commitment to "governing" laws rather than supervenient ones. | Neither | No |
  | **Armstrong Paradigm** ("paradigm being the Armstrong-style view... relation of necessitation") | The dominant anti-Humean view is DTA (Dretske-Tooley-Armstrong), where laws are relations between universals. | Defensible-but-overstated | Armstrong is a historical paradigm, but dispositionalist/powers views are now equally prominent; this narrows the anti-Humean field too much. | Anti-Humean (Powers theorists would deny DTA is the sole paradigm) | No |
  | **Explanation Objection** ("Humean has to deny that laws explain their instances") | Humeans cannot allow laws to provide metaphysical explanation for particular events. | Subtle misrepresentation | Humeans deny laws *ground* instances (circularity), but argue they provide *scientific* explanation (unification/systematization). | Humean (distinguishes metaphysical grounding from scientific explanation) | Yes |
  | **Counterfactual Objection** ("nor why... [or] support counterfactuals") | Humean laws cannot underwrite counterfactual reasoning because they only describe the actual. | Outright error | Lewisian Humeans explicitly analyze counterfactuals *using* the Best System; laws are central to evaluating "what would have happened." | Humean (Lewis, Hicks, Loewer have robust counterfactual accounts) | Yes |
  | **Fatal Objection Claim** ("what most philosophers take to be fatal") | The inability to explain/support counterfactuals is the consensus reason for rejecting Humeanism. | Defensible-but-overstated | These are indeed the two main objections, but characterizing them as universally "fatal" ignores successful Humean rebuttals. | Both (Anti-Humeans agree it's fatal; Humeans deny the premise) | Yes |
  | **Sociological Claim** ("field has largely gone anti-Humean") | The current consensus in philosophy of science favors anti-Humeanism. | Outright error | Humeanism (especially BSA) remains a dominant, highly active research program in philosophy of physics and metaphysics. | Both (Humeans object to the defeatism; Anti-Humeans know the debate is live) | Yes |

  ### Closing Corrections

  If you take nothing else from this audit, correct these three points before citing the précis in your work. First, **Humeans do not deny that laws support counterfactuals**; the Lewisian strategy is precisely to use the Best System to evaluate counterfactual worlds, so the claim that they "have to deny" this is technically false. Second, distinguish between **metaphysical grounding and scientific explanation**: Humeans concede laws don't *metaphysically ground* instances (to avoid circularity) but argue they still *explain* them via unification, which is often sufficient for philosophy of science. Third, the **sociological claim is outdated**: Humeanism is not a defeated relic but a vibrant, evolving position (e.g., "Humean Best Systems" in quantum mechanics), so framing the field as having "largely gone anti-Humean" misrepresents the current dialectic.
