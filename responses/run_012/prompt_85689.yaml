answer: |-
  There are three diagnoses on the table tonight. The first says the paradox arises because we are using a probability distribution that sums to more than one—an impossible prior over infinite money. The second says the error is in the utility function, that money has diminishing returns, so the gain of doubling matters less than the pain of halving. The third, which I endorse, says the error is purely probabilistic: it treats the amount in your hand, $a$, as a fixed constant when calculating gain, but as a random variable when assigning probability.

  I choose the third. The first is a mathematical truth but a conversational dodge; it tells the host he couldn't have set the game up, which is unsatisfying when the envelope is already open. The second is an economic patch, not a logical cure; the paradox persists even if we play for points rather than pounds. The third cuts the throat of the argument where it actually breathes. The reasoning breaks at the assertion that, having seen $a$, the probability the other envelope contains $2a$ is exactly one-half. It is not. It cannot be one-half for every possible $a$ unless the universe is prepared to put infinite money on the table with uniform likelihood, which, as my colleague noted, is impossible. But even without invoking the infinite, the mere act of observing $a$ shifts the odds.

  Here is the precision you require. Before you open the envelope, the situation is perfectly symmetric. Let $X$ be the smaller amount. The envelopes contain $X$ and $2X$. You pick one at random. Your expected value is $1.5X$. The other envelope also has an expected value of $1.5X$. There is no advantage to switching. This is the unconditional argument, and it is sound. The conditional argument begins when you open the envelope and see $a$. Now you claim: "The other envelope is either $a/2$ or $2a$, and I have no reason to prefer one, so I assign probability $1/2$ to each." This is where the symmetry is smuggled back in under a false name.

  By observing $a$, you have acquired information. You have not just seen a number; you have sampled from a distribution. If the amount of money available in the world is bounded, or even if it simply becomes less likely as the numbers get larger, then seeing a very large $a$ makes it more probable that you are holding the larger envelope. Seeing a very small $a$ makes it more probable you hold the smaller. The probability that the other envelope is $2a$ is a function of $a$, let's call it $p(a)$. The expectation of switching is $p(a)(2a) + (1-p(a))(a/2)$. This is greater than $a$ only if $p(a) > 1/2$. But $p(a)$ cannot be greater than $1/2$ for all $a$. If it were, you would always be more likely to hold the smaller envelope, regardless of the amount, which implies the host is magically biasing the game against you every time you look. The unconditional symmetry must hold on average. Therefore, for some values of $a$, $p(a)$ must be less than $1/2$, and for those values, you should not switch. The error is treating $a$ as a constant that cancels out, when it is actually the index that determines the probability.

  Now, to the objection from the far end of the table. You propose a finite world: the pairs are either $\{10, 20\}$ or $\{20, 40\}$, chosen by a coin toss. You ask if the switching argument succeeds here. It succeeds conditionally, but fails universally. If you open your envelope and see $40$, you know with certainty you have the larger amount of the $\{20, 40\}$ pair. The probability the other is $80$ is zero. You should not switch. If you see $10$, you know you have the smaller of the $\{10, 20\}$ pair. You should switch. If you see $20$, you are truly uncertain; it could be the larger of the first pair or the smaller of the second. If the coin toss was fair, then yes, given $20$, the expectation of switching is positive.

  But notice what this concedes. It concedes that whether you switch depends on what you see. The original argument concluded you should switch *regardless* of what you see, and indeed, switch before looking at all. The finite case demonstrates that the "always switch" rule is false because it fails at the boundaries. If you adopt the strategy "switch if you see 20, switch if you see 10, stay if you see 40," your overall expected gain is exactly zero. The gains from seeing 10 and 20 are perfectly cancelled by the loss from seeing 40. This shows that the original argument's conclusion—that one should switch regardless of observation—is a fallacy of composition. It takes a local advantage (which exists for some numbers) and pretends it is a global law.

  Does the version where you may exchange the envelope any number of times add anything? No. It merely repeats the first mistake in a louder voice. If you switch once, you are now holding an envelope with some value $b$. To justify switching back, you must again assert that the probability your new envelope is the smaller one is $1/2$. But you have no new information. You are simply re-applying the same flawed conditional probability to a new number. If you do not look inside the second envelope, you are in the exact same epistemic state as you were before the first switch: you hold an envelope, you know nothing of its value relative to the other, and by symmetry, there is no gain. If you do look, you are back to the conditional case, where the decision depends on the specific number $b$ and the prior distribution. Infinite switching is just a loop of ignored information.

  This brings us to what the puzzle teaches about expected-value reasoning. It teaches us that expected value is not a property of the money; it is a property of the state of knowledge. You cannot calculate an expectation by holding the observed value fixed while varying the world around it. The variable $a$ in the term $(1/2)(2a)$ is not the same beast as the $a$ in the term $(1/2)(a/2)$. In the first, $a$ represents the smaller amount; in the second, $a$ represents the larger. By using the same symbol, the argument conflates two mutually exclusive states of the world and averages them as if they were simultaneously possible given the same evidence. Expected-value reasoning is robust, but it demands that we account for how our evidence partitions the possibility space.

  I will mark this step as delicate: the claim that observing $a$ *must* update the probability $p(a)$ away from $1/2$. I know it feels intuitive that if you know nothing about the distribution, you should remain agnostic. But "knowing nothing" is not a license to assign $1/2$ to every outcome; it is a confession that you cannot calculate an expectation at all. If you insist on calculating, you must admit that seeing a number constrains the possible worlds.

  Finally, you ask which single step I would abandon first if forced. I would abandon the mandate that a rational agent must maximize expected value in the absence of a known prior. If the distribution of money is truly unknown—if it is Knightian uncertainty rather than risk—then the calculation $p(a)(2a) + (1-p(a))(a/2)$ is baseless. In that specific void, the principle of indifference tempts us, and while it leads to the paradox, it is the only tool we have. I would rather concede that rationality is silent in the face of total ignorance than concede that rationality commands us to switch envelopes forever. I would rather say "you cannot decide" than "you must lose."
