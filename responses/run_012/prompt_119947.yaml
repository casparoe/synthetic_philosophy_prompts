prompt: |-
  I'm putting together a lecture on the Hart–Fuller debate for my legal philosophy seminar and I want to make sure my framing is right before I put it on slides. Here's the line I'm working with: Hart is a legal positivist, so he thinks law and morality are completely seperate, which means the Nazi racial statutes were never really law — so he'd have no trouble convicting the grudge informer under the ordinary criminal law, no retroactivity needed. And Fuller's inner morality of law is basically just the claim that a law has to be morally decent before it counts as law at all, so he's the one who ends up stuck worrying about retroactivity. Is that a fair way to set up the disagreement, and if my students push back on it, what's the cleanest way to explain what's actually at stake between the two of them? Please answer in American English.
