answer: |-
  You have identified a category error that sits at the heart of archaeological and historical theory, yet remains obscured in popular discourse. Your observation is precise: the word "collapse" conflates an *ontological* event (people suffering, systems failing) with an *epistemic* event (the disappearance of the things we use to measure them).

  There is no single settled term that perfectly captures the distinction you describe, though there are adjacent concepts. Below I outline the nearest existing ideas and then offer two coined terms that fit the specific structural gaps you have identified.

  ### 1. The Distinction: Load-Bearing Structure vs. Analytical Indicator

  **Existing Nearest Ideas:**
  *   **Joseph Tainter's "Complexity":** Tainter (*The Collapse of Complex Societies*) argues that collapse is a rapid simplification of sociopolitical complexity. However, he acknowledges this often benefits the common population by reducing the tax burden, which hints at your distinction but doesn't name the measurement error.
  *   **James C. Scott's "Legibility":** In *Against the Grain*, Scott argues that early states were defined by what they could "see" (grain, settled populations). When the state falls, "collapse" is often just a loss of *legibility* to the ruler or the archaeologist, not a loss of welfare for the people.
  *   **Resilience Theory's "Reorganization":** In social-ecological systems theory, what looks like collapse is often just the "release" and "reorganization" phase of an adaptive cycle. This is a neutral descriptor but lacks the moral/welfare distinction you require.

  **The Missing Concept:**
  Existing terms describe the *process* (simplification, reorganization) or the *bias* (elite focus), but none name the specific distinction between the loss of a vital function and the loss of a visible marker.

  **Coined Term:** **Substantive Collapse** vs. **Signal Collapse**

  *   **Definition:**
      *   **Substantive Collapse:** The failure of load-bearing systems that directly sustain human welfare (caloric intake, physical security, disease management, basic social cohesion). This corresponds to your "load-bearing" category.
      *   **Signal Collapse:** The disappearance of high-visibility markers used by analysts to index complexity (monumental architecture, literacy, centralized bureaucracy, specific pottery styles). This corresponds to your "artefact of convenience" category.
  *   **Relation to Existing Ideas:** This sharpens Tainter's "Complexity." Tainter treats complexity as a cost; this distinction asks *whose* cost and *which* complexity. It formalizes Scott's "Legibility" into a binary: did the *signal* vanish, or did the *substance* vanish?
  *   **Boundary Cases:**
      *   *Pure Signal Collapse:* The end of the Maya Classic period. Elite inscriptions and monumental dating cease (Signal), but populations persist, trade continues, and political structures shift to smaller, non-monumental polities (Substance remains).
      *   *Pure Substantive Collapse:* A localized famine or epidemic where administration continues, but welfare plummets. (Rare in the archaeological record because administration usually fails when welfare does, but theoretically distinct).
      *   *The Conflation (Standard "Collapse"):* The Late Bronze Age. Palaces burn (Signal) AND trade networks break causing famine (Substance). The term "collapse" is only accurate here; elsewhere, it is usually Signal Collapse mislabeled as Substantive.

  ### 2. The Narrative: Decline vs. Transformation Based on Stake

  **Existing Nearest Ideas:**
  *   **Normativity:** The philosophical stance that descriptions contain value judgments. Archaeology has a "Normative Turn" acknowledging this, but it is a broad umbrella.
  *   **Presentism:** Judging past events by present standards. This captures the anachronism but not the *stake* or *identification* aspect.
  *   **Whig History:** Interpreting the past as a progression toward the present. This captures the "successor" bias but implies a progress narrative, whereas collapse narratives are often about regression or punishment.

  **The Missing Concept:**
  You are describing a mechanism where the *moral valence* of the event shifts based on the narrator's perceived relationship to the subject (ancestor, successor, outsider, critic).

  **Coined Term:** **Retrospective Positionality**

  *   **Definition:** The phenomenon wherein the moral framing of a historical discontinuity (as tragedy, comeuppance, or liberation) is determined by the narrator's identificatory stake in the outcome.
      *   *High Identification (Descendant/Successor):* The event is framed as **Tragedy/Decline**. (e.g., "Our glorious ancestors fell.")
      *   *Low/Critical Identification (Outsider/Critic):* The event is framed as **Correction/Transformation**. (e.g., "The oppressive regime finally failed.")
  *   **Relation to Existing Ideas:** This is a specific application of **Standpoint Epistemology** to deep time. It differs from "Bias" because it is not necessarily an error; it is a structural feature of how history is consumed. It differs from "Presentism" because it is about *identity*, not just time.
  *   **Boundary Cases:**
      *   *High Positionality:* Modern Greeks viewing the fall of Mycenae. The loss of the palace is a loss of *their* heritage; the narrative is one of dark ages and loss.
      *   *Low Positionality:* Environmentalists viewing Rapa Nui. The loss of the statue-culture is a moral lesson on overshoot; the narrative is one of comeuppance.
      *   *The Flip:* The same event (e.g., the fall of Rome) reads as "The Dark Ages" (Tragedy/High Positionality with Western Civ) or "The End of Imperial Oppression" (Liberation/Low Positionality). **Retrospective Positionality** names the mechanism that allows this flip.

  ### Summary

  You are observing that "Collapse" is often a **Signal Collapse** misidentified as a **Substantive Collapse**, and the moral weight of that identification is determined by **Retrospective Positionality**.

  Using these terms allows you to dissect a claim: *"Is the author describing a loss of welfare (Substantive) or a loss of visibility (Signal)? And does their moral framing depend on whether they view themselves as the heirs of the palace or the inhabitants of the hinterland (Positionality)?"*

  This vocabulary separates the archaeology from the morality, and the lived reality from the analytical marker.
