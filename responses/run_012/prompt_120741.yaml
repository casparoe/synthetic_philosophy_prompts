answer: |-
  **Examination Question**

  **Question 1 (25 Marks)**

  Consider the following three-node centipede game. Player 1 moves first at node $n_1$, choosing **Take** or **Pass**. **Take** ends the game with payoffs $(1, 0)$. **Pass** leads to node $n_2$, where Player 2 chooses **Take** or **Pass**. **Take** ends the game with payoffs $(0, 2)$. **Pass** leads to node $n_3$, where Player 1 chooses **Take** or **Pass**. **Take** ends the game with payoffs $(3, 1)$. **Pass** ends the game with payoffs $(2, 4)$.

  (a) Solve this game using backward induction. State precisely what Aumann's theorem asserts about the relationship between common knowledge of rationality and the solution you derived.

  (b) Now consider a perturbed version of the game where the payoff at $n_3$ for **Pass** is changed to $(3, 4)$, making Player 1 indifferent between **Take** and **Pass** at $n_3$. Construct two distinct epistemic models for this perturbed game. For each model, specify the set of states (identified with strategy profiles), the knowledge partitions for each player, and a common prior. Ensure that in both models rationality is common knowledge at the actual state, but the outcome is the backward-induction path in the first model and the non-backward-induction path in the second.

  (c) Explain what the contrast between these two models demonstrates regarding the genericity (no-ties) assumption in Aumann's theorem. Furthermore, explain why this result implies the theorem should be interpreted as a consistency condition on epistemic models rather than a description of the deliberative process by which a player selects a move.

  ***

  **Model Answer**

  (a) In the original game, backward induction proceeds from $n_3$. Player 1 prefers **Take** (3) over **Pass** (2). Anticipating this, Player 2 at $n_2$ compares **Take** (2) with **Pass** (leading to 1), choosing **Take**. Anticipating this, Player 1 at $n_1$ compares **Take** (1) with **Pass** (leading to 0), choosing **Take**. The unique backward induction outcome is $(1, 0)$. Aumann's theorem asserts that in any epistemic model of this extensive-form game, if rationality is common knowledge at the actual state, then the strategy profile played at that state must be the backward induction solution.

  (b) In the perturbed game, Player 1 is indifferent at $n_3$ (3 vs 3). We define the strategy profiles by the actions at $(n_1, n_2, n_3)$. Let $S$ be the set of strategy profiles.

  Model 1 (Backward Induction Outcome): Let the state space contain a single state $\omega$ corresponding to the profile (Take, Take, Take). Player 1's partition is $\{\{\omega\}\}$ and Player 2's is $\{\{\omega\}\}$. At $\omega$, Player 1 is rational at $n_1$ and $n_3$ (Take is weakly optimal). Player 2 is rational at $n_2$ (Take yields 2, Pass yields 1 given P1's strategy). Since the state is a singleton, all facts are common knowledge. Rationality is common knowledge, and the outcome is $(1, 0)$.

  Model 2 (Non-Backward Induction Outcome): Let the state space contain a single state $\omega'$ corresponding to the profile (Pass, Pass, Pass). Partitions are again singletons. At $\omega'$, Player 1 is rational at $n_3$ (Pass is weakly optimal due to indifference). Player 2 is rational at $n_2$ (Pass yields 4, Take yields 2 given P1 plays Pass at $n_3$). Player 1 is rational at $n_1$ (Pass yields 3, Take yields 1). Rationality is common knowledge, yet the outcome is $(3, 4)$, which contradicts the original backward induction path.

  (c) The contrast highlights that Aumann's theorem depends critically on the genericity assumption that players have strict preferences at every decision node. In the original game, strict preferences force a unique rational choice at each node, propagating a unique solution up the tree. In the perturbed game, the tie at $n_3$ breaks this logical chain. Because multiple actions are rational at $n_3$, multiple strategy profiles satisfy common knowledge of rationality. The theorem does not hold without genericity because common knowledge of rationality no longer restricts the set of possible states to a singleton.

  This demonstrates that the theorem is a consistency result, not a deliberative guide. It characterizes the properties of a state within a fixed model where beliefs and rationality align. It does not prescribe how a player should think to arrive at a move. If the theorem were a deliberative algorithm, Player 1 in the perturbed game would be forced to choose **Take** simply by reasoning about rationality. However, the existence of Model 2 shows that reasoning about rationality is consistent with choosing **Pass**. Therefore, the theorem describes which strategy profiles are compatible with a specific epistemic configuration, rather than dictating that rational deliberation necessarily produces the backward induction move when ties are present.

  ***

  **Marking Scheme**

  **Total: 25 Marks**

  **Part (a): Backward Induction and Theorem Statement (5 Marks)**
  *   **1 Mark:** Correctly identifies P1 Takes at $n_3$ (3 > 2).
  *   **1 Mark:** Correctly identifies P2 Takes at $n_2$ (2 > 1).
  *   **1 Mark:** Correctly identifies P1 Takes at $n_1$ (1 > 0) and states outcome (1, 0).
  *   **2 Marks:** States Aumann's theorem as a conditional claim: In any model, CKR at the actual state *implies* the BI strategy profile is played.
      *   *Characteristic Error:* Stating the theorem as "Rational players play BI" without referencing the epistemic model or common knowledge condition.

  **Part (b): Construction of Epistemic Models (10 Marks)**
  *   **Model 1 (BI Outcome) - 5 Marks:**
      *   **2 Marks:** Specifies state/strategy profile consistent with BI (Take, Take, Take).
      *   **1 Mark:** Specifies partitions (must ensure players know their own move/rationality).
      *   **2 Marks:** Verifies sequential rationality at all nodes given the profile (noting weak optimality at $n_3$).
  *   **Model 2 (Non-BI Outcome) - 5 Marks:**
      *   **2 Marks:** Specifies state/strategy profile consistent with Cooperation (Pass, Pass, Pass).
      *   **1 Mark:** Specifies partitions (must ensure players know their own move/rationality).
      *   **2 Marks:** Verifies sequential rationality (crucially noting P1 is rational at $n_3$ due to indifference).
      *   *Characteristic Error:* Treating Common Knowledge of Rationality as equivalent to Common Knowledge of the Strategy Profile without checking sequential rationality at the tie.

  **Part (c): Genericity and Deliberation Interpretation (10 Marks)**
  *   **5 Marks:** Explains the role of genericity. Must note that strict preferences force a unique rational choice, whereas ties allow multiple rational choices, breaking the uniqueness required for the theorem's conclusion.
      *   *Characteristic Error:* Claiming the theorem is "refuted" by the perturbed game rather than explaining the boundary condition of the assumptions.
  *   **5 Marks:** Explains the consistency vs. deliberation distinction. Must argue that the theorem validates a state within a model rather than providing an algorithm for choice; if it were deliberative, the tie would not allow the non-BI outcome.
      *   *Characteristic Error:* Arguing that players fail to play BI due to psychological limitations or experimental evidence rather than the logical structure of the epistemic model.
