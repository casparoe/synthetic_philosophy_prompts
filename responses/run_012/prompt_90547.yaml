answer: |-
  Your friend's objection is the most common intuitive barrier to act-consequentialism, but it relies on a caricature of the theory that collapses under empirical scrutiny. To test this, consider Alex, a mid-career professional with a decent salary, a family, and a passion for painting that generates no social good. Contrast him with Sam, a billionaire with unique skills capable of saving thousands. Your friend argues that consequentialism demands Alex stop painting and give away his disposable income, rendering his life a hollow instrument for the greater good. She sees this as a *reductio ad absurdum*. However, this view assumes the theory demands the same sacrifice from everyone, ignoring how consequentialist demands scale with capacity. For Sam, the theory demands almost total life-allocation; for Alex, the demand is marginal. The theory does not ask Alex to become a martyr; it asks him to optimize within his constraints. The proportionality isn't a bug—it's the mechanism that makes the theory fair. The objection feels strongest for Alex not because the theory is broken, but because he occupies the uncomfortable middle ground where he has enough to give that it hurts, but not enough to make the sacrifice feel historically significant.

  The second line of defense involves the constraint of "ought implies can," which your friend likely dismisses as a convenient escape hatch. She suspects that if consequentialism allows you to rest whenever you're tired, it allows you to do whatever you want. But this cynicism misunderstands the empirical basis of the claim. If Alex stops painting, he burns out, becomes depressed, and loses his earning power, thereby reducing his long-term capacity to do good. In this specific case, painting is the optimific choice. This isn't a loophole; it's an engineering constraint. Human psychology is part of the causal fabric of the world. A theory that ignores burnout isn't "stricter"; it's factually wrong about how humans function. If the theory genuinely required more than a human could sustain, it would be false. But because sustainability is a prerequisite for efficacy, the demand to rest is derived from the same principle as the demand to work. The suspicion of convenience only holds if you assume human limits are flexible excuses rather than fixed facts.

  However, shifting to a scalar view—where actions are just "better" or "worse" rather than "permissible" or "forbidden"—changes the nature of the complaint entirely. If there is no bright line where Alex becomes "immoral" for buying a canvas, the demandingness objection loses its teeth. You can't be condemned for failing to do the best possible action, only ranked lower than someone who did. But this reply risks gutting the very thing that made the view worth defending: its ability to guide action decisively. If morality becomes a gradient of goodness rather than a set of constraints, it ceases to function as a practical adjudicator of conflict. Yet, even here, the objection weakens. If the complaint is merely that consequentialism makes life hard, that is a feature, not a bug. If the world is full of suffering, a morality that feels easy is likely complicit. The scalar move doesn't save consequentialism from being demanding; it saves the agent from being condemned for failing to meet impossible binary standards.

  This brings us to the mirror objection, which is perhaps the strongest variant of your friend's worry. Consequentialism seems to demand everything of your resources while asking nothing of your character; Alex can be selfish, petty, and cold, provided he writes the check. This asymmetry suggests the demandingness objection is actually an integrity objection in disguise. We aren't just worried about losing our money; we're worried about becoming instruments. If the theory demands we sacrifice our projects but doesn't demand we become virtuous people, it alienates us from our own lives. However, this is a separate complaint from demandingness. A theory can be too demanding on resources but too lax on character, or vice versa. The fact that consequentialism ignores character doesn't make its resource demands invalid; it just means it's an incomplete moral theory. The demandingness objection fails to sink the theory on this front because it conflates two distinct costs: the cost to your wallet and the cost to your soul.

  So, does the objection land? It sinks the robotic, caricature version of act-consequentialism that ignores human psychology and treats agents as infinite resource pools. That version is false because it violates "ought implies can." However, a psychologically informed act-consequentialism survives intact. This version acknowledges that Alex's painting is permissible because it maintains his agency, while Sam's luxury is impermissible because it wastes high-leverage capacity. The objection does not prove the theory wrong; it proves the world is horrifically needy. If a moral theory demands almost everything from the capable, that is an indictment of the state of suffering, not the logic of the theory.

  The verdict is that the demandingness objection is a psychological warning, not a logical refutation. It shows that our intuitions are calibrated for a world of moderate scarcity, not the extreme preventable suffering that actually exists. The version of consequentialism that survives is one that treats human sustainability as a fixed constraint within the calculus of value, rather than an exception to it. The problem is not that the theory asks too much; it is that the world presents a bill so high that paying it feels like ruin. Your friend is right that the demands are insane, but she is wrong to think this absolves us. The insanity lies in the background conditions of reality that make such demands necessary, and a moral theory that softened them to match our comfort would be failing its only job.
