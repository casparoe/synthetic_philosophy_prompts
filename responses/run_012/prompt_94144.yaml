answer: |-
  **Exam Question**

  Consider a vase existing from t1 to t10 that alternates shape: tall, short, tall, short. Suppose we metaphysically swap the tall stretches with the short stretches so the vase runs short, tall, short, tall, keeping the matter and identity fixed. Explain whether this reordering is intelligible on endurantism versus perdurantism, and analyze what each view's verdict implies about the slogan that 'time is like space.'

  **Model Answer Key**

  1. Perdurantists deem the swap intelligible because temporal parts are distinct entities that can be rearranged like spatial segments, worth 4 marks; students lose this if they claim temporal order is metaphysically fixed.
  2. This intelligibility relies on treating temporal distance as ontologically equivalent to spatial distance, worth 4 marks; students lose this if they argue time lacks the dimensional symmetry required for rearrangement.
  3. Endurantists find the swap unintelligible because the wholly present object instantiates properties directly rather than having parts that can be exchanged, worth 4 marks; students lose this if they attribute temporal parts to the endurantist view.
  4. On this view, the specific order of property instantiation is essential to the career rather than a contingent arrangement of components, worth 4 marks; students lose this if they treat times as containers separable from the object's identity.
  5. The case demonstrates that perdurantists literalize 'time is like space' while endurantists reject it, worth 4 marks; students lose this if they fail to connect the specific verdicts back to the slogan.
