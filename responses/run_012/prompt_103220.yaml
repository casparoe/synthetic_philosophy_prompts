answer: |-
  Here are ten questions (five pairs) designed to probe the structural weaknesses of her position, along with the anticipated replies and the strategic intent behind each follow-up.

  ### 1. The Permission/Liability Split
  **Question:** You argue that permission rides on the soldier's evidence, but liability rides on the objective facts of the threat. To a skeptic, this looks like a double standard smuggled in to save the intuition that soldiers aren't murderers while admitting they can be killed. Why is this split metaphysically stable rather than just a convenient way to have your cake and eat it too?

  *   **Anticipated Reply:** She will likely argue that *blame/permission* is agent-relative (what they could reasonably know), while *defense/liability* is agent-neutral (the actual threat to the victim). She'll say we shouldn't punish people for reasonable mistakes, but victims shouldn't die for those mistakes either.
  *   **Follow-up:** If liability is strictly agent-neutral and tracks the objective threat, doesn't that reduce the unjust combatant to the moral status of a natural force or a wild animal to the just defender? If they are morally equivalent to a landslide, why grant them *permission* to kill at all? Why not just say they are excused but objectively wrong?

  ### 2. The Conscript-as-Victim Case
  **Question:** Let's take two conscripts with identical evidence: one drafted by the aggressor, one by the defender. Both fight competently. You say the aggressor is permitted but liable. Now, suppose the aggressor conscript realizes mid-war that his cause is unjust, but continues fighting because the penalty for desertion is execution. Does his permission to kill survive that realization?

  *   **Anticipated Reply:** She will likely say yes. The coercion mitigates his culpability, so he retains the permission (he's not a murderer), but he remains a threat, so he remains liable.
  *   **Follow-up:** If his permission survives *knowledge* of the injustice solely because of the coercion, haven't you completely detached permission from the *justice of the cause*? At that point, isn't 'permission' just a synonym for 'non-culpable,' rendering the *jus ad bellum* irrelevant to the individual fighter's moral standing?

  ### 3. The Sliding-Scale Claim
  **Question:** You argue that moral equality is a sliding scale that thins out as the injustice of the war becomes more recognizable. Where is the threshold where an unjust combatant loses permission entirely? Is there a point where a volunteer becomes just as liable as a leader?

  *   **Anticipated Reply:** She will likely resist a bright line, arguing that moral responsibility is a continuum like negligence. She'll say clear cases exist at the extremes (obvious aggression vs. ambiguous defense), but the middle is messy.
  *   **Follow-up:** If there's no bright line and liability scales with recognizability, haven't you just reproduced the Revisionist asymmetry with extra steps? You've effectively placed an epistemic burden on the soldier to judge the war, which is the core Revisionist claim you're trying to avoid. Why call this 'Equality' if it vanishes the moment the war is obviously unjust?

  ### 4. Action-Guidance
  **Question:** What is a soldier supposed to *do* with the thought "I am permitted to kill you, but you are permitted to kill me, and I am liable"? That is a cognitively heavy position to carry into a firefight. Does this view offer practical guidance, or does it risk creating paralysis or moral hazard?

  *   **Anticipated Reply:** She will likely argue it offers *reassurance*. It tells soldiers they aren't criminals, allowing them to function without the crushing weight of potential murder charges, provided they follow *in bello* rules.
  *   **Follow-up:** But if the soldier knows they are 'liable' in a way the enemy isn't, they know they are legitimate targets in a way the enemy is not. Doesn't that undermine morale by signaling to them that they are expendable pawns? It sounds like you're telling them: "You aren't guilty, but you are sacrificeable."

  ### 5. Post-War Accountability
  **Question:** If ordinary unjust combatants aren't punishable because they acted on reasonable evidence, what work is left for war crimes tribunals? Does your view end up making the *in bello* rules the only rules that actually matter for the average fighter?

  *   **Anticipated Reply:** She will likely say tribunals are for leaders who initiate aggression and for soldiers who commit specific war crimes (torture, targeting civilians). Ordinary fighting in an unjust war isn't a crime.
  *   **Follow-up:** But if fighting for an unjust cause isn't punishable, don't you remove the primary deterrent against aggression? You protect the soldier from accountability, but doesn't that effectively insulate the state, allowing leaders to wage aggressive wars using human shields who know they won't face consequences?

  ***

  ### The Load-Bearing Claim
  If she starts stonewalling or deflecting, push on **the split between Permission (Epistemic) and Liability (Ontic).**

  This is the engine of her entire view.
  *   If permission tracks **facts** (like liability), her "Moral Equality" collapses into Revisionism (unjust fighters have no permission).
  *   If liability tracks **culpability** (like permission), her view collapses into Traditionalism (unjust fighters aren't liable to be killed).

  The only way her view stands is if those two things can come apart. If you can force her to admit that *either* permission should track the truth *or* liability should track the blame, the whole structure falls down. Every time she appeals to "reasonable belief," ask if that belief changes the *threat* she poses. Every time she appeals to "objective threat," ask if that threat changes the *soldier's guilt*. Keep the wedge between those two concepts sharp.
