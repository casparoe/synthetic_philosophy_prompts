prompt: |-
  I host a small podcast about ethics and warfare, and next week's guest is a philosopher who's been defending a version of the moral equality of combatants that I half-understand and half-suspect is just revisionism wearing a trench coat. Her line, as I've got it: combatants on both sides of a war have the same permission to kill, but not the same liability to be killed, and those two things come apart in a way the usual debate doesnt track. More specifically she says (i) an unjust combatant who reasonably believes his war is just is permitted to kill, because the permission rides on his evidence rather than on the facts; (ii) that same combatant is still liable to be killed by the just side, because liability to defensive killing tracks the threat you pose, not your culpability; and (iii) liability to punishment after the war tracks culpability again, so most ordinary combatants on the unjust side are killable but not punishable. She also has this move where the equality is a sliding scale — strongest for conscripts who are themselves victims of the regime, thinning out to nothing for volunteers in a war of aggression they could easily have recognized as such.

  Can you write me eight to ten interview questions? I want them to go at the joints of this, not 'so what is the moral equality of combatants.' I want at least one question on each of the following, and for each of those a follow-up keyed to the answer she's most likely to give:

  - why permission should ride on evidence while liability rides on facts, and whether that's a stable split or just a double standard smuggled in through the back
  - the conscript-as-victim case: two soldiers, identical evidence, one conscripted into the aggressor's army and one into the defender's, both fighting competently; what her view says about each one's permission, his liability, and his punishability — and does the coerced one's permission survive if he keeps fighting after the coercion lapses
  - the sliding-scale claim: if equality thins with how recognizable the injustice was, where's the threshold, and doesn't that just reproduce the revisionist asymmetry with extra steps
  - what she says to the objection that 'permitted but killable and unpunishable' is a position no soldier could actually act on — what is a soldier supposed to do with it on the day
  - post-war accountability: if ordinary unjust combatants aren't punishable, what work is left for war crimes tribunals, and does her view end up making the in bello rules the only rules that matter

  For each, anticipate the reply she'll reach for first and build the follow-up to make that reply harder to use. And tell me which of her claims is actually load-bearing, so I know which one to push on if she starts stonewalling. No warm-up questions, please.
