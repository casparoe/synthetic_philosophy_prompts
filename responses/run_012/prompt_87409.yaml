  2.  **Deconstruct the Friend's Precedents (The Data Set):**
      *   *Singapore:* **Legitimate.** Unelected (effectively), but high prosperity, order, public goods (housing, health). *Key:* Performance legitimacy outweighs procedural deficit.
      *   *Hong Kong (British):* **Legitimate/Not Illegitimate.** Unelected, but Rule of Law, free press, exit rights. *Key:* Liberal rights + exit option compensate for lack of vote.
      *   *Botswana:* **Legitimate.** Elections + Prosperity (managed resources). *Key:* Procedural + Performance = Clear Legitimacy.
      *   *Pinochet (Chile):* **Not Legitimate.** Growth occurred, but torture, disappearances, bust. *Key:* Human rights violations + volatility negate performance.
      *   *Franco (Spain):* **Not Legitimate.** Late prosperity doesn't cleanse early brutality/authoritarianism. *Key:* Historical baggage/origin stories matter; "laundering" doesn't work.
      *   *China:* **Not Legitimate.** Massive prosperity, but 1989 crackdown + Xinjiang detention. *Key:* Coercion/Repression against specific groups negates aggregate prosperity.

  3.  **Synthesize the Friend's Theory (The Rules):**
      *   *Rule 1 (Performance Matters):* Prosperity and order *can* confer legitimacy without elections (Singapore).
      *   *Rule 2 (Rights Constraint):* Performance legitimacy is voided by systematic physical repression or torture (Pinochet, China). "Order" cannot mean "terror."
      *   *Rule 3 (Rights Substitution):* If there are no elections, there must be other liberal safeguards (Rule of Law, Press, Exit) to prevent abuse (HK).
      *   *Rule 4 (Historical Continuity):* You cannot buy legitimacy late if the foundation was bloody (Franco).
      *   *Rule 5 (Inclusivity/Sustainability?):* This is the tricky one. Botswana had elections. Singapore had broad-based growth for citizens. China failed on inclusivity/rights.
      *   *Core Tension:* Is legitimacy based on *outcome for the governed* or *process of consent*? She seems to be a "Performance Legitimacy" theorist *with strict human rights guardrails.* She accepts benevolent authoritarianism *if* it is actually benevolent and stable.

  4.  **Analyze the New Case (The Gulf Monarchy):**
      *   *Features:* Ruling family, no elections, SWF, Rentier state (oil/gas), Guest workers (majority, no rights/path to citizenship), Citizens (wealthy, state-employed, no political power).
      *   *Pros:* High prosperity, excellent public goods, safety, no overt terror/police state for citizens.
      *   *Cons:* No elections, permanent underclass of guest workers (who do the work), resource dependency (sustainability issue), exclusionary citizenship.
      *   *Comparison to Precedents:*
          *   Like Singapore? (Prosperity/Order) -> Yes.
          *   Like HK? (Rule of Law/Exit) -> Exit for guests? No, they are tied to visas. Rule of law? Maybe for citizens, less for guests.
          *   Like Pinochet/China? (Repression) -> No overt terror, but structural exclusion of guests.
          *   Like Franco? (Buying legitimacy) -> The wealth is unearned (rentier), not produced by citizens.

  5.  **Determine the Verdict:**
      *   *Hypothesis A (Legitimate):* It fits the Singapore model. Citizens consent via prosperity. No torture. Order is kept.
      *   *Hypothesis B (Not Legitimate):* It fails the "Inclusivity" or "Sustainability" test. The prosperity is bought, not made. The "people" governed includes the guest workers who have zero rights. It relies on a caste system.
      *   *Weighing the Friend's Logic:* She rejected China because of repression against a subset (Uighurs/dissidents). She rejected Pinochet for torture. She accepted Singapore because the *citizens* broadly benefited and weren't terrorized.
      *   *The Crux:* Does she count the guest workers as part of the "political community" whose legitimacy matters?
      *   *Refining the Theory:* Her rejection of China suggests she cares about *how* order is maintained and *who* is sacrificed. In the Gulf case, the guest workers are the sacrificed class (no rights, deportable, essential labor). However, they aren't *citizens*.
      *   *The "Rentier" Problem:* In Singapore, the government *governed*. In the Gulf, the government *distributes rent*. There is a political theory distinction here: "Taxation implies Representation." If citizens don't pay tax (oil pays), the social contract is different.
      *   *Prediction:* She will likely say **Not Legitimate**.
      *   *Why?*
          1.  **The "Guest Worker" Issue:** This mirrors the China/Xinjiang issue. A large class of people under the jurisdiction of the state are systematically excluded from rights to maintain the prosperity of the few. It's structural coercion, even if not "torture."
          2.  **Sustainability/Source:** Unlike Singapore (value add) or Botswana (managed resources + elections), this is pure rentierism. The "prosperity" is fleeting (oil runs out). Legitimacy based on a depleting asset is inherently unstable (not "order" in the long sense).
          3.  **The HK Distinction:** HK had exit rights and rule of law for residents. Guest workers often cannot leave freely (kafala system implications, though varying) and have no legal recourse.
          4.  **The Singapore Distinction:** Singaporeans *work*. Gulf citizens mostly *receive*.

      *   *Wait, let's look closer at her Singapore verdict.* She defends Singapore hardest. Singapore has strict controls, but citizens buy in.
      *   *Let's look at her China verdict.* She rejects it due to repression (1989, Xinjiang).
      *   *The Gulf Case:* Is the treatment of guest workers "repression" akin to Xinjiang? Or is it standard immigration control? If it's the Kafala system (sponsorship), it's highly coercive.
      *   *Alternative View:* She might call it "Legitimate for Citizens, Illegitimate overall." But the prompt asks for *the* verdict.
      *   *Most consistent theoretical stance:* **Not Legitimate.**
      *   *Reasoning:* It violates the "Rule of Law/Exit" safeguard of HK (guests can't leave/change jobs easily) and violates the "No systematic sacrifice" rule of China/Pinochet (the economy rests on a rightless underclass). It lacks the "Productive Social Contract" of Singapore.

  6.  **Drafting the Rules:**
      1.  **Performance Condition:** Prosperity/Order counts *for* legitimacy.
      2.  **Rights Constraint:** Physical repression/torture voids legitimacy (Pinochet/China).
      3.  **Liberal Safeguard:** If no vote, need Rule of Law + Press + Exit (HK).
      4.  **Historical Cleanliness:** Early brutality isn't cleansed by late wealth (Franco).
      5.  **Implicit Rule (Derived):** The "Beneficiary Scope." Legitimacy requires that the prosperity isn't built on a permanent, rightless underclass within the jurisdiction (China/Xinjiang parallel).

