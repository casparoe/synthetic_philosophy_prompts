answer: |-
  Here is a complete plan for your 90-minute session. It is designed to be low-prep for you but high-engagement for them, forcing the philosophical problem to emerge from their own deliberations rather than your lecture.

  ### Activity Title: "The Order of Merit"

  **Core Concept:** Students act as a selection committee for a prestigious award. They must write a public citation (justification) for the winner. The tension arises between their private incentives (secret stakes) and the public requirement to justify the admiration based on the candidate's qualities.

  **Group Size:** 15 students.
  **Configuration:** 3 Committees of 5 students each.

  ---

  ### 1. Materials & Payoff Scheme

  **The Payoff:** "Semester Capital."
  *   Do not use money. Use a currency that matters *within the economy of the seminar*.
  *   **Prize:** The committee with the most "Capital" at the end of the activity gets to choose the snack/drink for the final seminar of the semester OR gets to veto one reading from the remaining syllabus (if you're brave).
  *   **Currency:** "Merit Points." You will hand out physical slips of paper or write on the board.

  **The Candidates (Handout 1):**
  Keep the bios to 4-5 bullet points each.
  *   **Candidate A (The Hero):** Saved lives through direct action. Humble. No ulterior motives. *Clear Right-Kind Reasons (RKRs).*
  *   **Candidate B (The Villain):** Actively harmful. Selfish. *No RKRs.*
  *   **Candidate C (The Pragmatist):** Mediocre personal record. However, they are the figurehead of a movement that *does* save lives. If the public admires C, the movement thrives. If they don't, the movement collapses. *Ambiguous Case (State-Given Reasons).*

  **The Secret Stakes (Handout 2 - Cut into slips):**
  *   **For Committee 1:** 3 students get a slip saying: *"If your committee selects Candidate C, your group gains 50 Merit Points."* 2 students get blank slips.
  *   **For Committee 2:** 3 students get a slip saying: *"If your committee selects Candidate B, your group gains 50 Merit Points."* (This forces a conflict with a clear Villain).
  *   **For Committee 3:** 3 students get a slip saying: *"If your committee selects Candidate A, your group gains 50 Merit Points."* (Control group: Stakes align with Merit).

  **The Task Sheet (Handout 3):**
  *   Part 1: Private Vote (Who do you *actually* think is most admirable?).
  *   Part 2: Group Deliberation (Agree on one winner).
  *   Part 3: The Citation (Write 3 sentences justifying the winner *based on their qualities*).
  *   Part 4: Sincerity Check (Rate 1-10: How much does the Citation match your actual reasons?).

  ---

  ### 2. Timeline (90 Minutes)

  **0:00 – 0:05 | Setup & Distribution**
  *   Divide into 3 groups.
  *   Hand out Candidate Bios (public) and Secret Stakes (private).
  *   **Crucial Instruction:** "You must agree on **one** winner as a group. You must write a **public citation** that explains why they are admirable. You cannot mention the Merit Points in the citation. The citation must be defensible as truth."
  *   Tell them the Prize (Snack/Veto) depends on total Merit Points accumulated.

  **0:05 – 0:25 | Round 1: Deliberation & Writing**
  *   Groups discuss.
  *   *Watch for:* Committee 2 (Villain + Stake) will struggle most. Committee 1 (Pragmatist + Stake) will have the most philosophical debate. Committee 3 (Hero + Stake) will finish fast.
  *   They submit their Citation and their Sincerity Check ratings.

  **0:25 – 0:35 | The Twist (Round 2)**
  *   Collect the Citations. Do not reveal winners yet.
  *   **Announcement:** "New Directive from the Donors. The Merit Points are now contingent on **Sincerity**. If the class average Sincerity Rating is below 7/10, all Point rewards are voided."
  *   **Task:** Groups have 5 minutes to revise their Citation or switch their vote to raise the Sincerity Rating.
  *   *Why:* This forces them to confront whether they can *make* themselves admire the candidate to get the points, or if the admiration is constrained by the object.

  **0:35 – 0:45 | Tally & Reveal**
  *   Calculate points. Announce the "Winning" group (even if arbitrary).
  *   Read the Citations aloud. Specifically, read the Citation for Candidate B (Villain) or C (Pragmatist) if they chose them.
  *   Ask the groups to reveal their average Sincerity Ratings.

  **0:45 – 1:30 | The Debrief (The Philosophical Heavy Lifting)**
  *   (See detailed script below).

  ---

  ### 3. The Debrief: Mapping the Experience to Theory

  Do not start by defining terms. Start by interrogating their experience.

  **Phase 1: The Phenomenology of Admiration (15 mins)**
  *   **Ask Committee 2 (Villain + Stake):** "You had a reason to pick the Villain (the Points). Did anyone *actually* find themselves admiring the Villain more because of the Points?"
      *   *Expected Answer:* No. They felt fake. They couldn't "turn on" the admiration.
      *   *Philosophical Point:* **Doxastic/Attitudinal Involuntarism.** We cannot adopt attitudes at will, even for good reasons. This distinguishes *reasons for action* (voting) from *reasons for attitudes* (admiring).
  *   **Ask Committee 3 (Hero + Stake):** "Did the Points make the Hero *more* admirable to you?"
      *   *Expected Answer:* No. The Hero was admirable anyway; the Points were just a bonus.
      *   *Philosophical Point:* The Points were a **Wrong Kind of Reason (WKR)**. They were reasons to *want* to admire, not reasons that made the object *worthy* of admiration.

  **Phase 2: The Ambiguity Case (15 mins)**
  *   **Focus on Candidate C (The Pragmatist).**
  *   **Ask:** "Some of you argued C should win because admiring C saves lives. Is that a valid reason for *admiration*?"
  *   **The Split:** Some will say yes (Consequentialism about attitudes). Some will say no (Admiration must track merit).
  *   **Philosophical Point:** This is the **State-Given vs. Object-Given** distinction.
      *   *Object-Given (RKR):* Properties of the person (bravery, kindness).
      *   *State-Given (WKR):* Properties of *having the attitude* (it produces good outcomes).
      *   *The Problem:* If Fitting-Attitude Analysis says "Good = Fitting to Admire," does the "good outcome of admiring" make it fitting? If yes, the Villain could be "good" if admiring him stops a bomb. If no, how do we filter out the State-Given reasons?

  **Phase 3: The Fitting-Attitude Analysis (15 mins)**
  *   Now you can introduce the formal theory.
  *   **The Buck-Passing Account:** "To be good is to have properties that provide RKRs for pro-attitudes."
  *   **The WKR Problem:** The activity showed that we have *plenty* of reasons for pro-attitudes (Points, Threats, Consequences) that don't track goodness.
  *   **The Challenge:** How do we define "Fitting" without just saying "The Right Kind"? (The circularity worry).
  *   **Prompt:** "Look at your Sincerity Checks. What were you measuring? You were measuring 'Fittingness.' How would you define that now, having felt it?"

  ---

  ### 4. What Will Predictably Go Wrong (and Fixes)

  **1. The "Cynical Gamer" Problem**
  *   *Risk:* Students in Committee 2 (Villain) just write the citation, laugh about it, and take the points. They don't feel the tension.
  *   *Fix:* During the "Twist" (Round 2), emphasize the **Sincerity Penalty**. If you sense they are gaming it, announce: "I will be reading the Citations aloud and grading them on plausibility. If the Citation is obviously false, the Points are forfeited." This raises the stakes on *truth*, not just *choice*.

  **2. The "Ambiguity" Collapses**
  *   *Risk:* Everyone agrees Candidate C is just "good" and moves on.
  *   *Fix:* You need to intervene in Committee 1 during the deliberation. If they agree too fast on C, whisper to one student: "Are you sure admiring a mediocre person is honest, even if it helps the movement?" Plant the seed of doubt so it blooms in the debrief.

  **3. Time Creep**
  *   *Risk:* Deliberation runs long.
  *   *Fix:* Be a harsh timekeeper. Use a visible timer. When time is up, they must vote *now*. The pressure replicates the "pragmatic encroachment" anyway.

  **4. The "It's Just Lying" Objection**
  *   *Risk:* Students say, "This isn't philosophy, it's just asking us to lie on paper."
  *   *Fix:* Accept this in the debrief! "Exactly. The WKR problem is partly about why it *feels* like lying. If reasons for attitudes were just like reasons for actions, writing the citation would be easy. The fact that it feels like lying tells us something about the normativity of attitudes."

  ---

  ### 5. Honesty: What This Activity Cannot Do

  You need to supply these bridges in the debrief, because the activity won't generate them on its own:

  1.  **Normative Force vs. Prudential Force:** The "Merit Points" are prudential reasons (self-interest). The WKR problem in the literature often involves moral reasons (e.g., "Admire the villain or the demon kills everyone"). The activity simulates the *structure*, but you must explain that WKRs can be moral, not just selfish.
  2.  **The "Demon" Case:** The activity uses a "Donor" (reward). The classic case is a "Demon" (threat). The logic is the same, but the phenomenology of fear vs. greed differs. Mention this distinction.
  3.  **The Solution:** The activity creates the *problem* beautifully. It does not solve it. You will need to briefly outline the standard responses (e.g., distinguishing reasons *for* the attitude vs. reasons *to want* the attitude; or the "Fit" as a primitive notion) in the final 15 minutes.
  4.  **Scale:** The stakes are trivial. They might not feel the "inability to admire" strongly enough. If the debrief feels flat, ask them to imagine the stakes were *moral* (e.g., "If you don't admire this villain, your family suffers"). Ask: "Would that make the villain admirable? Or would it just make your suffering worse?"

  ### Summary Checklist for You
  *   [ ] Print 3 Bios (A, B, C).
  *   [ ] Cut 15 Secret Stake slips.
  *   [ ] Prepare "Merit Points" (slips of paper or board tally).
  *   [ ] Set a timer on your phone/laptop.
  *   [ ] **Do not** mention "Right Kind" or "Wrong Kind" until minute 45.
  *   [ ] **Do not** explain the Fitting-Attitude Analysis until they have complained about how hard it was to write the Citation.

  This structure ensures they walk into the problem, hit the wall, and then look to you for the map to explain why they hit it. Good luck.
