      *   **Context:** Senior metaethics seminar (15 students), 90 minutes/week.
      *   **Topic:** The Wrong Kind of Reasons (WKR) Problem (specifically regarding fitting-attitude analyses of value).
      *   **Goal:** An in-class activity where students *experience* the distinction between right-kind reasons (RKRs) and wrong-kind reasons (WKRs) before the theory is introduced.
      *   **Constraints:** No lecture intro (jump straight in), needs stakes (small), needs ambiguity (not trivial sorting), needs a realistic timeline, needs a debrief plan, needs troubleshooting advice, needs honesty about limitations.
      *   **User's Idea:** Three juries, bios of admirable/flawed people, secret stakes/cards affecting choice.
      *   **Critique of User's Idea:** It's a bit clunky. "Admiration" is hard to manipulate with small stakes in 5 minutes. If the prize is for picking Candidate A, students might just *say* they admire A without actually feeling the tension of *trying* to admire. The "least admirable" flip is interesting but might confuse the WKR problem (which is about reasons for attitudes, not just voting). The WKR problem is specifically about the *normative force* of the reason vs. the *fittingness* of the attitude. The activity needs to highlight the difference between "I have a reason to want to have this attitude" and "I have a reason that makes this attitude fitting."

  2.  **Develop a Better Activity Concept:**
      *   *Core Tension:* The WKR problem arises when an external incentive (threat/reward) gives you a reason to hold an attitude, but that reason doesn't make the object of the attitude valuable/fitting.
      *   *Key Phenomenon:* The "Directness" problem. You can't just believe/admire on command because of a reward. (The "Pragmatic Encroachment" or "Doxastic Involuntarism" angle).
      *   *Refined Concept:* Instead of "Juries picking a winner," let's make it about *cultivating* an attitude towards a specific object under pressure.
      *   *Idea:* "The Art Critic Game." Students are asked to evaluate mundane or slightly gross objects. Some get rewards for positive evaluations.
      *   *Problem:* That feels too much like lying. The WKR problem isn't about lying; it's about whether the reason counts towards the *normativity* of the attitude.
      *   *Better Idea:* "The Belief/Admiration Auction." Or "The Commitment Contract."
      *   *Best Idea (building on User's Jury idea but sharpening it):* "The Council of Canonization." We are deciding what enters the "Hall of Greatness." But the twist needs to be about the *reasons* they offer, not just the vote.
      *   *Actually, let's go closer to the phenomenological experience:* The "Impossible Command."
      *   *Revised Plan:* Split into small groups. Give them an object (a poem, a joke, a mundane object). Task: Convince the group it is *admirable/funny/beautiful*.
      *   *Round 1:* Normal discussion.
      *   *Round 2:* Introduce a high-stakes incentive for a specific outcome (e.g., "If you all agree this specific bad poem is great, everyone gets +5 points").
      *   *Round 3:* Introduce a threat ("If you don't agree this specific good poem is terrible, you lose points").
      *   *Wait, the WKR problem is subtle.* It's not that you *can't* do it, it's that even if you do, the reason doesn't make the object *good*.
      *   *Let's stick closer to the User's "Jury" idea but fix the mechanics.* The User's idea of "Secret Stake" is good because it creates an internal conflict. "I want to pick Bob because I like his work, but I need to pick Alice to get the points."
      *   *Refinement:* Let's make it about *writing the justification*. The WKR problem is often solved by saying WKRs are reasons to *want* to have the attitude, not reasons *for* the attitude. The activity needs to expose this distinction.

      *   *Final Activity Choice:* **"The Patron's Dilemma."**
          *   Groups are "Grant Committees."
