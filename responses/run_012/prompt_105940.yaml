      *   Stake = Wrong Kind of Reason (Reason to want the attitude).
      *   Bio Details = Right Kind of Reason (Reason for the attitude/Fittingness).
      *   Inability to write Citation = The "Directness" problem (Doxastic/Attitudinal involuntarism).
      *   Fitting-Attitude Analysis: Value = Fittingness of Admiration. WKR shows this definition is tricky because we have reasons to admire that don't track value.

  8.  **Honesty about Limitations:**
      *   Activity simulates *practical* pressure, not necessarily *normative* pressure.
