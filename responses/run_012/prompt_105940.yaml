      *   **Ambiguity:** Need a candidate who is *instrumentally* good but not *admirable*. E.g., A villain whose evil accidentally saved the world. This tests the "Right Kind" (properties of the object) vs. "Wrong Kind" (consequences of the attitude).

  4.  **Refining the "Ambiguity" Case:**
      *   Candidate A: Classic Hero (RKRs clear).
      *   Candidate B: Clear Villain (WKRs only).
      *   Candidate C: The "Lucky Fool" or "Accidental Hero." They did something great, but their motives were terrible, or it was luck.
      *   *Wait, the WKR problem is specifically about reasons for attitudes.*
      *   Let's make Candidate C the "Pragmatic Choice." They are mediocre, BUT inducting them brings a huge donation to the department.
      *   *No, that's external.*
