      *   If they say "Because Casey is great," they are lying/feeling the tension.

  5.  **Addressing the "Cannot Decide to Admire" Phenomenon:**
      *   This is crucial. The activity needs a moment where they *try* to generate admiration based on the stake and fail.
      *   *Add a "Sincerity Check":* After voting, they rate on a scale of 1-10 how much they *actually* admire the winner vs. how much they *wanted* to win.

