      *   *Risk:* Students just game it and lie.
      *   *Fix:* Emphasize the "Citation" must be defensible to the public.
      *   *Risk:* Discussion dies.
      *   *Fix:* Instructor needs to probe the "Sincerity Check."
      *   *Risk:* 90 mins isn't enough.
      *   *Fix:* Keep the bios very short.

