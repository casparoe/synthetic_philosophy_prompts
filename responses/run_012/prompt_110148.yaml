answer: |-
  # Session Plan: The Responsibility Review
  **Topic:** Alternative Possibilities and Moral Responsibility (Frankfurt-style Cases)
  **Time:** 90 Minutes
  **Students:** 12 (Third-Year Undergraduates)
  **Format:** Activity-Based Seminar

  ## I. Overview & Design Logic
  This session is designed to induce a specific phenomenological experience: the tension between the intuition that "could have done otherwise" is necessary for blame, and the intuition that the agent in these specific cases is blameworthy *despite* lacking alternatives.

  **Design Logic (Rules to Experience):**
  1.  **The Two-Stage Vote:** Students vote *before* knowing the alternative was closed. This isolates their baseline intuition. They vote *again* after learning the alternative was closed. The shift (or lack thereof) in confidence is the data point.
  2.  **The Silence Rule:** No discussion between rounds. This prevents early theorizing and forces them to sit with the accumulating dissonance.
  3.  **The Envelope Stake:** The panel's majority verdict chooses an envelope. One contains high-quality chocolate for the class; the other contains generic mints. The content is unknown until the end. This gives the verdict consequence without financial bias, making the "Guilty" verdict feel like a real imposition.
  4.  **The Hidden Fact:** The "surface" story is identical in Rounds 1–3. The metaphysical constraint is revealed only after the first vote. This mimics the philosophical move of stipulating away alternatives *post-hoc*.

  ## II. Materials
  *   **3 Panel Tables:** Arranged so panels cannot hear each other.
  *   **Verdict Slips (60 total):** Pre-printed slips with fields: *Round #, Verdict (Responsible/Not), Confidence (0-100%), One-Line Reason.*
  *   **Case Packets (3 sets):** One per panel. Contains the 5 Case Cards.
  *   **The Envelopes:** Two large sealed envelopes labeled **A** and **B**.
      *   *Envelope A:* Premium chocolates (enough for 12).
      *   *Envelope B:* Generic mints (enough for 12).
      *   *Note:* Do not tell them which is which. Tell them one is "preferred" and one is "standard."
  *   **Whiteboard/Projector:** For the Debrief mapping.
  *   **Timer:** Visible to you.

  ## III. Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Introduction** | Setup, Rules, Stakes. |
  | **00:05 – 00:15** | **Round 1** | Baseline (Open Alternatives). |
  | **00:15 – 00:25** | **Round 2** | Counterfactual Intervener (Classic). |
  | **00:25 – 00:35** | **Round 3** | Prior Sign (The Squeeze). |
  | **00:35 – 00:45** | **Round 4** | Self-Arranged Inevitability. |
  | **00:45 – 00:55** | **Round 5** | Omission Case. |
  | **00:55 – 01:30** | **Debrief** | Mapping, Troubleshooting, Limitations, Closing. |

  ---

  ## IV. The Activity Rules (Instructor Script)

  **Introduction (5 Minutes)**
  "Welcome. Today you are a Responsibility Review Panel. There are three panels of four. You will review five cases involving an Agent and a specific Outcome.
  **Rule 1:** You will read a case summary. You will vote individually on a slip: Responsible or Not, Confidence 0-100%, and a one-line reason.
  **Rule 2:** After the first vote, I will reveal a 'Hidden Fact' about the causal structure. You will vote again.
  **Rule 3:** No talking between panels. No talking between rounds. You may discuss within your panel *only* to decide which Envelope to open after Round 5.
  **Rule 4:** The Stakes. For every round where your panel majority votes 'Responsible,' you place a token in Envelope A. For 'Not Responsible,' Envelope B. At the end, we open the envelope with the most tokens. One contains premium chocolate; the other, mints. You do not know which is which. Your verdicts determine the class treat.
  Begin Round 1."

  ---

  ## V. Case Cards (For the Packets)
  *Print these on separate cards. The "Surface Text" is read first. The "Hidden Fact" is revealed by the instructor after Vote 1.*

  **Round 1: The Baseline**
  *   **Surface Text:** The Agent decided to transfer funds from a charity account to his own. He deliberated for ten minutes. He knew it was wrong. He chose to do it. No one threatened him. No one influenced him.
  *   **Hidden Fact:** There were no constraints. He could have chosen otherwise.
  *   *(Design Note: Establishes the link between Responsibility and Alternative Possibilities.)*

  **Round 2: The Intervener**
  *   **Surface Text:** The Agent decided to transfer funds from a charity account to his own. He deliberated for ten minutes. He knew it was wrong. He chose to do it.
  *   **Hidden Fact:** A Mechanism was monitoring the Agent's brain. If the Agent had shown *any* sign of choosing not to transfer, the Mechanism would have stimulated his brain to force the transfer. The Agent chose on his own. The Mechanism did nothing.
  *   *(Design Note: Removes the alternative counterfactually. Tests if responsibility survives.)*

  **Round 3: The Prior Sign**
  *   **Surface Text:** The Agent decided to transfer funds from a charity account to his own. He deliberated for ten minutes. He knew it was wrong. He chose to do it.
  *   **Hidden Fact:** A Mechanism was monitoring the Agent's brain. It was programmed to intervene only if it detected a specific neural pattern that *always* precedes the decision to steal. This pattern appeared. The Mechanism stood by. The Agent chose on his own.
  *   *(Design Note: The Squeeze. If the pattern guarantees the decision, was it free? If not, could he have done otherwise?)*

  **Round 4: Self-Arranged**
  *   **Surface Text:** The Agent decided to transfer funds from a charity account to his own. He deliberated for ten minutes. He knew it was wrong. He chose to do it.
  *   **Hidden Fact:** Twenty-four hours earlier, the Agent voluntarily took a drug he knew would make him unable to resist stealing tomorrow. He wanted to ensure he would steal. The drug made it impossible for him to choose otherwise today.
  *   *(Design Note: Tests the 'Tracing' principle. Does prior freedom rescue current responsibility?)*

  **Round 5: Omission**
  *   **Surface Text:** The Agent saw a child drowning. He decided not to throw the life preserver. The child drowned. He knew he ought to save the child.
  *   **Hidden Fact:** A Mechanism was monitoring the Agent. If the Agent had moved to throw the preserver, the Mechanism would have paralyzed his arm. The Agent chose not to throw on his own. The Mechanism did nothing.
  *   *(Design Note: Extends the logic to failures to act.)*

  ---

  ## VI. The Debrief (35 Minutes)
  *This script is designed to be read/adapted by you. It moves from the experience to the theory, then to the objections, then to the limits.*

  ### Part 1: Mapping the Experience (10 Minutes)
  "Look at your verdict slips. Specifically, look at Round 2 and Round 3.
  In Round 1, almost everyone voted 'Responsible' with high confidence. That is our baseline. We usually think responsibility requires the ability to do otherwise. In philosophy, we call this the **Principle of Alternative Possibilities (PAP)**.

  In Round 2, I told you the Agent *could not* have done otherwise. The Mechanism would have forced him. Yet, most of you kept the verdict 'Responsible.' Your confidence might have dipped slightly, but the verdict held.
  **This is the Frankfurt Counterexample.** It suggests PAP is false. You are willing to blame someone even when the alternative was removed, provided the actual sequence of events was their own doing.

  Now, look at Round 3. This is the round where I expect to see your confidence numbers drop the most, or your reasons become vague.
  **The Dilemma:** I told you the Mechanism looked for a 'sign' that *always* precedes the decision.
  *   **Horn 1:** If that sign is just a correlation, then the Agent *could* have decided differently without the sign appearing. If so, he had an alternative. The case fails to refute PAP.
  *   **Horn 2:** If that sign *guarantees* the decision (causation), then the decision was fixed before he made it. If it was fixed, was it really *his* decision?
  Many of you felt a squeeze here. You wanted to say he was responsible, but you couldn't quite say *why* the alternative didn't matter if the future was already written in his neural pattern. This is the **Prior Sign Objection** (often associated with Widerker or Kane)."

  ### Part 2: Troubleshooting Predictable Pushbacks (10 Minutes)
  "I know what some of you are thinking, because I've seen it in the verdict reasons. Let's name four specific resistances that will come up."

  1.  **The 'Taint' Intuition:** "Some of you wrote in Round 2: 'He's responsible, *but* the Mechanism makes it creepy.' You feel the mere presence of the intervener taints the freedom, even if they didn't act.
      *   *Response:* This is a common intuition. But ask yourself: Did the Mechanism *cause* the action? No. The Agent did. If the actual cause is the Agent, does the background noise matter? Frankfurt says no. You might disagree, but notice you are defending PAP by adding conditions, not by denying the Agent acted."

  2.  **The 'Mechanics' Distraction:** "Some of you asked: 'How does the machine work? Is it magic?'
      *   *Response:* In philosophy, we stipulate the tech works. If you reject the case because the tech is impossible, you aren't attacking the principle; you're attacking the sci-fi. Treat the Mechanism as a placeholder for 'causal determination.'"

  3.  **The 'Determinism' Diversion:** "Someone likely asked: 'But is determinism true?'
      *   *Response:* This session isn't about whether the world *is* determined. It's about whether responsibility *requires* alternatives. Even if determinism is false, Frankfurt cases try to show alternatives aren't the thing that matters. Don't let the metaphysics of the universe distract you from the metaphysics of the Agent."

  4.  **The 'Pattern' Suspicion:** "You noticed the cases were the same story with different endings. You felt manipulated.
      *   *Response:* Good. That manipulation is the method. We are isolating variables. The discomfort you felt in Round 3 is the sound of the theory grinding against the intuition."

  ### Part 3: Limitations & The "Flicker" (10 Minutes)
  "There is something this activity cannot do, and I need to be honest about it.
  In this game, I *stipulated* that the Agent could not do otherwise. I told you so. In the real world, nobody hands you a card that says 'Causality Closed.'
  Because I stipulated it, some of you instinctively looked for a **Residual Alternative**. You wrote things like: 'He could have *tried* to resist,' or 'He could have *wanted* otherwise.'
  This is called the **Flicker of Freedom Strategy**. It argues that even in Frankfurt cases, there is *some* alternative (like trying vs. not trying), and *that* is what grounds responsibility.
  **The Limitation:** In this room, you couldn't test if that flicker was real. I told you the Mechanism ensured the *decision*. But you clung to the *effort*.
  **The Incompatibilist Objection:** There is a position you couldn't fully play in this game. The hard Incompatibilist says: 'If the Prior Sign in Round 3 guarantees the decision, the Agent is a puppet. If it doesn't, he had alternatives. This case is impossible.'
  You can't feel that impossibility in a game where I control the rules. You have to imagine it. If the connection between the Agent's character and the Act is tight enough to remove alternatives, is it too tight to allow responsibility? That is the question the activity assumes away."

  ### Part 4: Closing (5 Minutes)
  "Open the Envelopes. [Open A and B]. Whether you got chocolate or mints, notice this: You made those choices based on judgments of responsibility.
  We started with the idea that 'Could have done otherwise' is the price of blame.
  Round 2 suggested you don't pay that price.
  Round 3 suggested that avoiding the price might cost you the Agent's freedom.
  Round 4 asked if you can pay the price in advance.
  Round 5 asked if the price is the same for inaction.

  I am not going to tell you which envelope is the 'right' one. There is no consensus in the literature. Some of you will leave thinking PAP is dead. Some will think Frankfurt cases are trickery.
  **Your task for next week:** Write 300 words. Do not argue for a side. Describe the moment in Round 3 where you felt the verdict slip 'stick' in your hand. Was it the sign? The mechanism? Or the fact that you wanted the chocolate?
  Class dismissed."

  ---

  ## VII. Instructor Notes: Handling the Room

  **1. If a student argues the Intervener taints freedom (Round 2):**
  *   *Action:* Validate but isolate. "You feel the *presence* reduces freedom. Does it reduce *causation*? Did the Agent move his own hand?"
  *   *Goal:* Keep the focus on the *actual sequence*, not the counterfactual setup.

  **2. If a student litigates the mechanics (Round 3):**
  *   *Action:* Stop the sci-fi debate. "For the purpose of this review, the device is 100% reliable. We are judging the Agent, not the Engineer."
  *   *Goal:* Prevent the metaphysics of the machine from swallowing the ethics of the Agent.

  **3. If the group tries to solve Determinism (General):**
  *   *Action:* Park it. "That is the Global Question. Today is the Local Question. Even if the world is indeterministic, does *this* Agent need an alternative to be blameworthy?"
  *   *Goal:* Keep the seminar on Moral Responsibility, not Philosophy of Mind.

  **4. If suspicion arises about the pattern (Round 4/5):**
  *   *Action:* Lean in. "You see the architecture. That means the experiment is working. The question is: Does seeing the wires change the blameworthiness of the Agent?"
  *   *Goal:* Turn the meta-commentary back into the philosophical problem.

  **5. Managing the Stakes:**
  *   Ensure the envelopes are genuinely sealed. If the "Chocolate" envelope is visibly heavier, the stakes rule fails. Use identical packaging.
  *   If a panel ties (2-2), the Instructor casts the tie-breaking vote based on the *lowest confidence average* to encourage honesty over consensus.

  ## VIII. Why This Works (For Your Preparation)
  *   **The Silence:** By forbidding discussion until the end, you prevent the "smartest student" from solving the puzzle in Round 2. Everyone has to marinate in the confusion of Round 3 individually.
  *   **The Confidence Score:** This is your most important data. If Verdict stays "Guilty" but Confidence drops from 90% to 60% in Round 3, *that* is the philosophical progress. It shows they are holding the belief but losing the justification.
  *   **The Debrief Timing:** Do not rush the debrief. The activity is just the stimulus; the debrief is the digestion. If you run long on rounds, cut Round 4 (Self-Arranged) rather than the debrief. Round 3 is the core; Round 4 is supplementary.
  *   **The "Flicker":** Be ready to write "Flicker of Freedom" on the board during the debrief. When they say "He could have tried," label it immediately. It validates their intuition while showing them it has a name and a history.
