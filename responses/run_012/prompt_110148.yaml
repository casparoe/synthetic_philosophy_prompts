      *   *Naming:* Use "The Agent," "The Outcome," "The Mechanism." Avoid "Jones/Black."
      *   *Debrief:* Needs to be very specific about the "Prior Sign" dilemma as requested.

  11. **Final Review against "Specific Shape of Discomfort":**
