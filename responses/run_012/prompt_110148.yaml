      *   Ensure the "Case Sheets" are written precisely to avoid accidental hints.
      *   Check the timing again. 12 mins per round is tight for reading, voting, revealing, revoting. Maybe 15 mins per round? 15 * 5 = 75. + 5 intro + 10 debrief = 90. Debrief needs more time.
      *   *Adjustment:* Compress the rounds. Reading should be fast. 10 mins per round. 50 mins. 5 mins intro. 35 mins debrief. This is safer.
      *   *Wait, one more check:* The prompt asks for "Individual-then-collective ordering." I need to make sure they write individually *before* discussing.
      *   *Revised Round Flow:*
          1.  Read Surface Case (2 mins).
          2.  Individual Vote 1 (Verdict + Confidence + Reason) (3 mins).
          3.  Reveal "Hidden Fact" (1 min).
          4.  Individual Vote 2 (Verdict + Confidence) (2 mins).
