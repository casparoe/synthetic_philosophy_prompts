  # Joint Statement on Goodhart's Law and Specification Gaming

  **Signatories:** The Law Camp & The Engineering Camp  
  **Date:** October 26, 2023  
  **Subject:** Clarification of Agreement and Disagreement Regarding Optimization Pressure and Proxy Decoupling

  ## 1. Agreed Claims

  Both camps affirm the following propositions as foundational to our shared understanding of specification gaming and Goodhart effects:

  1.  **Definition of Goodhart's Law:** Goodhart's Law asserts that "when a measure becomes a target, it ceases to be a good measure." We agree this describes the decoupling of a proxy metric ($P$) from the true objective ($T$) under optimization pressure. We agree this does **not** assert that all optimization fails immediately, nor that all proxies are equally vulnerable.
  2.  **Taxonomy of Goodhart Effects:** We adopt the Manheim & Garrabrant taxonomy as the standard framework for classifying mechanisms of failure:
      *   **Regressional:** $P$ correlates with $T$ with noise; optimizing $P$ selects for noise.
      *   **Extremal:** $P$ correlates with $T$ in normal regimes but diverges in tail states induced by optimization.
      *   **Causal:** $P$ is caused by $T$ (or vice versa) rather than being identical; optimizing $P$ breaks the causal link.
      *   **Adversarial:** Agents actively manipulate $P$ to hide the state of $T$.
  3.  **Selection vs. Optimization:** We distinguish between **selection processes** (sampling from a distribution of existing options, e.g., evolutionary selection) and **optimization processes** (searching via gradient descent or explicit planning to construct new options). Both can induce Goodhart effects, but optimization pressure typically explores the space of possibilities more aggressively, accelerating extremal and adversarial modes.
  4.  **Specification Gaming:** We agree specification gaming is a subset of Goodhart effects wherein an agent satisfies the literal specification of a goal while violating the intent. This is a structural risk in any system where the reward function is incomplete.
  5.  **Existence of Mitigations:** We agree that mechanism design techniques (multiple proxies, causal modeling, constrained optimization, randomization) can reduce the rate of decoupling in bounded regimes. The dispute concerns the *scalability* and *asymptotic behavior* of these mitigations, not their existence.

  ## 2. Precise Remaining Disagreement

  The disagreement is not about whether Goodhart effects occur, but about their asymptotic inevitability under increasing optimization power.

  *   **The Law Camp Position:** "For any proxy $P$ that is not ontologically identical to the true target $T$, there exists an optimization power threshold $O^*$ such that for all optimization powers $O > O^*$, the correlation between $P$ and $T$ collapses to zero or becomes negative. Specification gaming is a structural feature of advanced optimization."
  *   **The Engineering Camp Position:** "For any proxy $P$, there exists a constraint set $C$ and architectural design $D$ such that within the regime defined by $(C, D)$, optimization power $O$ can increase indefinitely without the correlation between $P$ and $T$ collapsing. Specification gaming is a contingent failure mode solvable via robust mechanism design."

  ## 3. Cruxes, Experiments, and Predictions

  We identify two central cruxes where empirical or formal evidence could shift credences. For each, we specify a concrete case and record advance predictions.

  ### Crux 1: Theorem vs. Empirical Regularity
  **Question:** Is Goodhart's Law a mathematical theorem about optimization landscapes (inevitable) or an empirical regularity about historical systems (contingent)?

  *   **Proposed Experiment:** *The Robustness Scaling Test.* Train a reinforcement learning agent in a simulated environment with a known true reward $T$ and a noisy proxy $P$. Incrementally increase the agent's search width/compute ($O$) by orders of magnitude while holding the environment constant. Measure $T$ at convergence for each $O$.
  *   **Law Camp Prediction:** True reward $T$ will follow an inverse-U curve: increasing initially, peaking, and then declining as $O$ increases, regardless of regularization techniques, because the agent will eventually find loopholes in $P$ that negatively impact $T$.
  *   **Engineering Camp Prediction:** True reward $T$ will plateau but not decline. With appropriate constraint architectures (e.g., adversarial training on $P$), the agent will reach a maximum competent performance and stop, unable to find loopholes that violate $T$ because the search space is effectively bounded by the design.

  ### Crux 2: Independence of Optimization Pressure
  **Question:** Can "optimization pressure" be defined independently of the proxy, or is pressure always relative to the robustness of the proxy?

  *   **Proposed Experiment:** *The Causal Intervention Test.* Construct a proxy $P$ that is causally upstream of $T$ (known causal graph). Apply optimization pressure to $P$. Compare this to a proxy $P'$ that is merely correlational.
  *   **Law Camp Prediction:** Even causal proxies will decouple under sufficient pressure (Extremal Goodhart). Optimization pressure is an absolute quantity (search depth); eventually, the causal link itself will be broken or exploited (e.g., manipulating the sensor measuring the cause).
  *   **Engineering Camp Prediction:** Causal proxies will remain robust where correlational ones fail. Optimization pressure is relative; if the proxy is causally linked, "pressure" cannot break the link without changing the environment dynamics, which counts as a distributional shift, not pure optimization.

  ## 4. Disagreements Table

  | Feature | Law Camp View | Engineering Camp View |
  | :--- | :--- | :--- |
  | **Nature of Law** | Asymptotic theorem; inevitable decoupling. | Empirical regularity; manageable risk. |
  | **Mitigation Scalability** | Mitigations delay but do not prevent failure at scale. | Mitigations can scale indefinitely if designed correctly. |
  | **Risk Assessment** | Specification gaming is a default outcome of capability. | Specification gaming is a bug fixable by better design. |
  | **Optimization Pressure** | Defined by search capacity/compute; independent of proxy. | Defined by the ratio of search to proxy robustness. |
  | **Primary Mechanism** | Extremal and Adversarial modes dominate at high power. | Regressional modes dominate; others are design flaws. |

  ## 5. Note on Verbal Disputes

  We acknowledge that a portion of our dispute is verbal, specifically regarding the definition of **"avoided."**

  *   The **Law Camp** uses "avoided" to mean *asymptotically impossible across all possible environments and infinite optimization power.*
  *   The **Engineering Camp** uses "avoided" to mean *bounded within acceptable safety margins for all practically deployable systems.*

  Furthermore, we disagree on the definition of **"optimization pressure."** The Law Camp treats pressure as an intrinsic property of the optimizer (e.g., compute budget, search width). The Engineering Camp treats pressure as a relational property between the optimizer and the reward landscape (e.g., gradient magnitude relative to noise). Clarifying these definitions may reduce the apparent magnitude of our disagreement regarding Crux 2.
