answer: |-
  TO: The Collections Board
  FROM: Lay Member
  DATE: [Current Date]
  SUBJECT: Determination of Vessel Identity and Associated Rights

  This opinion addresses the question of identity regarding the 1830s vessel. We must decide which hull constitutes the vessel for the purposes of the endowment, the national exhibition, and public representation. The founding deed offers no definition, and thirty years of avoidance have not resolved the ambiguity. We require explicit criteria to guide this vote.

  **Criteria for Identity**
  I propose we adopt *Operational Continuity* as the defining criterion. Under this standard, the vessel is the entity maintained in service through time, rather than the sum of its constituent timber.

  This criteria is defended on functional grounds. A working vessel is not a static sculpture; it is a tool subject to decay and repair. If identity were tied strictly to original material, the vessel would have ceased to exist upon the first replacement plank. Heritage preservation of working craft relies on the understanding that maintenance sustains identity. The keel, stem, and sternpost remain in our care; these form the structural spine upon which the continuous history of the object rests. The vessel is the lineage of care, not the specific atoms of the hull.

  **Application to Facts**
  Our hull possesses this continuity. It has been maintained by this Trust for a century and a half. The removal of the last original plank this spring is consistent with historical repair cycles, not a termination of identity. The School's hull, while containing the removed fabric, lacks this continuous history. It is an assembly of artifacts fastened with new nails and timber. It is a reconstruction using original parts, not the object that endured the wear and repair of the last hundred years.

  **The Case for the School**
  We must acknowledge the strength of the School's claim. Their argument rests on *Material Integrity*. In their view, the vessel's identity resides in the original fabric crafted in the 1830s. They hold the actual surface area that touched the water during the vessel's working life. Our hull is, materially speaking, a modern copy built upon an old skeleton. For a historian of material culture, the School's hull offers authentic data regarding construction techniques and wood usage that our hull no longer possesses. They have preserved the physical evidence of the builder's hand, whereas we have preserved the form. If the purpose of heritage is to conserve original material, their claim is superior.

  **Recommendations**
  Despite the strength of the material argument, Operational Continuity better serves the Trust's mission and the donor's intent. I recommend the following course of action:

  1.  **Identity:** Formally recognise the Trust's hull as the vessel.
  2.  **Public Statement:** Acknowledge the School's hull as a significant reconstruction containing original timbers, but distinct from the vessel itself.
  3.  **Endowment:** Retain the endowment, as the Trust continues to keep the vessel on public view.
  4.  **Exhibition:** Certify the Trust's hull for the national exhibition immediately to meet insurer deadlines before spring.

  We must resolve this before the next board meeting to allow time for legal review of the endowment terms.

  Verdict: CONTINUITY - Recognise the Trust's hull as the vessel; retain endowment and nominate it for exhibition.
