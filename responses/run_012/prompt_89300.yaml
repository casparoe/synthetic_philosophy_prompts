      *   *The Solution:* A "moral government of the universe." If there's an afterlife where rewards/punishments align individual happiness with universal duty, the dualism collapses.
      *   *The Turn to SPR:* Sidgwick couldn't prove this metaphysically, so he looked for *empirical* evidence of survival of death (ghosts, mediums, telepathy).

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The image of the stern Victorian rationalist dabbling in ghosts.
          *   Context: Sidgwick's status as a giant of utilitarianism.
