prompt: |-
  I'm a science journalist working on a piece about the wierd afterlife of Henry Sidgwick's ethics. Here's the thing I keep bumping into: Sidgwick spent his last decades as a founding member and first president of the Society for Psychical Research, and he seems to have thought that if you could show survival of death was real, you'd solve the deepest problem in his moral philosophy. That problem — the dualism of practical reason — is that egoism and utilitarianism both seem self-evident but they can conflict, and the only way to guarantee they don't is if there's a moral order to the universe that makes virtue pay off in the long run. So he goes looking for empirical evidence of that order. Some scholars think this is a beautiful integration of theory and practice: the psychical research is the experimental test of a philosophical postulate. Others think it's a cautionary tale about letting your ethical needs dictate your empirical inquiries. Write an essay on this controversy. Weigh both sides, then reach a conclusion: was Sidgwick's turn to psychical research a legitimate extension of his philosophical project, or a case of motivated reasoning that compromised his intellectual integrity? Justify your verdict. Don't worry about citations or reading lists — I just want the argument.
