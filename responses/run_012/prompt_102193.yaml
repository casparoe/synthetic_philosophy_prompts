  # Decision Tree: Responses to Fitch's Paradox

  **Instructions for the Reader:** Begin at the root (Node 1). Answer each question based on your philosophical commitments regarding the ingredients of the derivation. Follow the branches to locate your position at a leaf. If you arrive at an "Empty" node, note the diagnosis provided.

  ### Node 1: Underlying Logic
  **Question:** Does the derivation proceed in Classical Logic or Intuitionistic Logic?
  *   **Intuitionistic:** Go to **Leaf A**.
  *   **Classical:** Go to Node 2.

  ### Node 2: Form of the Knowability Principle
  **Question:** Is the Knowability Principle ($p \to \Diamond Kp$) a single universally quantified claim over a domain, or a schema with an instance for each proposition?
  *   **Schema:** Go to Node 3. *(This permits restricting instances without restricting the domain of quantification.)*
  *   **Universal Claim:** Go to Node 4. *(This commits you to the principle holding for the entire domain of propositions.)*

  ### Node 3: Basis of Restriction (For Schema Views)
  **Question:** On what basis are instances of the schema restricted?
  *   **Decidability:** Go to **Leaf B**. *(Only decidable/basic propositions are instances.)*
  *   **Truth-Independence:** Go to **Leaf C**. *(Only propositions whose truth does not depend on being known.)*
  *   **Non-Self-Reference:** Go to **Leaf D**. *(Only propositions not about what is or is not known.)*

  ### Node 4: Distribution of Knowledge
  **Question:** Does knowing a conjunction entail knowing each conjunct ($K(p \land q) \to Kp \land Kq$)?
  *   **No:** Go to **Leaf E**.
  *   **Yes:** Go to Node 5.

  ### Node 5: Status of the Knower
  **Question:** Does "knowable" mean knowable by some possible knower, or by an ideal community at the limit of inquiry (or actual non-ideal knowers)?
  *   **Ideal/Actual Community:** Go to **Leaf F**.
  *   **Some Possible Knower:** Go to Node 6.

  ### Node 6: Factivity of Knowledge
  **Question:** Is knowledge factive ($Kp \to p$)?
  *   **No:** Go to **Empty Node 1**.
  *   **Yes:** Go to Node 7.

  ### Node 7: Verdict on the Principle
  **Question:** Given the derivation, do you retain the Knowability Principle?
  *   **No:** Go to **Leaf G**.
  *   **Yes:** Go to **Leaf H**.

  ---

  ## The Leaves (Positions)

  **Leaf A: The Intuitionistic Response**
  *   **Path:** Intuitionistic Logic.
  *   **Content:** The derivation is blocked because the step from $\neg \Diamond K(p \land \neg Kp)$ to $p \to Kp$ relies on classical double-negation elimination.
  *   **Most Awkward Commitment:** Truth is essentially epistemic, so there are no verification-transcendent truths.

  **Leaf B: Restriction to Basic/Decidable Propositions**
  *   **Path:** Classical, Schema, Decidability.
  *   **Content:** The principle holds only for a privileged class of basic or decidable propositions; undecidable truths are not knowable.
  *   **Most Awkward Commitment:** Significant portions of mathematics or science may contain truths that are essentially unknowable.

  **Leaf C: Restriction to Non-Epistemic Truths (Cartesian)**
  *   **Path:** Classical, Schema, Truth-Independence.
  *   **Content:** The principle applies only to propositions whose truth does not depend on what is known (excluding Fitch-conjunctions).
  *   **Most Awkward Commitment:** We cannot know that we know, as second-order knowledge claims often depend on first-order knowledge states.

  **Leaf D: Restriction to Non-Self-Referential Propositions**
  *   **Path:** Classical, Schema, Non-Self-Reference.
  *   **Content:** The principle is restricted to propositions that are not themselves about what is or is not known.
  *   **Most Awkward Commitment:** We cannot know the limits of our own knowledge, as such knowledge would violate the restriction.

  **Leaf E: Denial of Distribution**
  *   **Path:** Classical, Universal, Distribution = No.
  *   **Content:** One can know a conjunction without knowing each conjunct, blocking the move from $K(p \land \neg Kp)$ to $Kp \land K\neg Kp$.
  *   **Most Awkward Commitment:** An agent can know that $p$ is true and unknown without knowing that $p$ is unknown.

  **Leaf F: The Actualist Move**
  *   **Path:** Classical, Universal, Distribution = Yes, Knower = Ideal/Actual.
  *   **Content:** The principle is confined to what is actually known or knowable by non-ideal knowers within actual cognitive limits.
  *   **Most Awkward Commitment:** There are no truths that exceed the cognitive capacity of the actual human community at the limit of inquiry.

  **Empty Node 1: Non-Factive Knowledge**
  *   **Path:** Classical, Universal, Distribution = Yes, Knower = Possible, Factivity = No.
  *   **Diagnosis:** **Coherent but Unattractive.** While one could deny factivity to block the contradiction, this abandons the standard conception of knowledge, making the view a solution to a paradox about "belief" or "acceptance" rather than knowledge.

  **Leaf G: The Realist Response**
  *   **Path:** Classical, Universal, Distribution = Yes, Knower = Possible, Factivity = Yes, Retain KP = No.
  *   **Content:** The derivation is sound, so the Knowability Principle is simply false.
  *   **Most Awkward Commitment:** There are truths that are essentially unknowable by any possible being.

  **Leaf H: The Dialetheist Option**
  *   **Path:** Classical, Universal, Distribution = Yes, Knower = Possible, Factivity = Yes, Retain KP = Yes.
  *   **Content:** The derivation is sound and the principle is true, so we must accept the resulting contradiction (some truths are both known and unknown).
  *   **Most Awkward Commitment:** True contradictions exist, and some propositions are both knowable and unknowable.

  *(Note: Leaf G and Leaf H share the same path through Nodes 1–6. They are separated only at Node 7, which records the verdict on the principle rather than an independent assumption. No further distinction in assumptions separates them.)*

  ---

  ## Empty Combinations and Unexplored Paths

  1.  **Classical Logic + Universal Claim + Restricted Domain:**
      *   **Diagnosis:** **Incoherent/Verbal.** A universal claim over a restricted domain is functionally equivalent to a schema with restricted instances (Node 3). Occupying this space amounts to a notational variant of Leaves B, C, or D.
  2.  **Classical Logic + Schema + No Restriction:**
      *   **Diagnosis:** **Incoherent.** If the principle is a schema but ranges over *all* propositions without restriction, it collapses into the Universal Claim path (Node 4), leading to the paradox.
  3.  **Non-Factive Knowledge (Empty Node 1):**
      *   **Diagnosis:** **Coherent but Unattractive.** As noted above, this solves the paradox by changing the subject from knowledge to a non-factive attitude. It is rarely occupied because it sacrifices the core intuition of knowledge.

  ---

  ## Note on Settled vs. Contested Issues

  For the reading group: The validity of the derivation in **classical logic** is settled; no serious respondent denies the formal steps given classical modal epistemic logic. The genuine disagreement lies in **which premise is the culprit**, and this is not merely verbal.

  *   **Real vs. Verbal:** The dispute between the **Intuitionist** (Leaf A) and the **Classical Realist** (Leaf G) is real: it concerns the nature of truth itself (epistemic vs. realist). However, the dispute between **Restrictionists** (Leaves B, C, D) can sometimes verge on verbal, depending on whether the restriction is motivated by independent philosophical reasons or merely *ad hoc* to save the principle.
  *   **The Core Contention:** The deepest fault line is between those who view the Knowability Principle as a conceptual truth about knowledge (who must modify logic, distribution, or domain) and those who view it as a contingent hypothesis (who abandon it). The tree above isolates this choice at Node 7, but note that reaching Node 7 requires accepting all prior classical/epistemic assumptions. Thus, the "Realist" and "Dialetheist" are not distinguished by their assumptions about knowledge, but by their tolerance for the paradoxical conclusion. This is a substantive disagreement about truth and contradiction, not a verbal quibble.
