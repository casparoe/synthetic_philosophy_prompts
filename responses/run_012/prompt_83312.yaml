prompt: |-
  Ok so I host a very small history-of-science podcast — like 400 listeners, mostly people from my old seminar — and next month the guest is a historian of early modern science whose whole thing is that the standard story about Galileo and scripture gets the interesting part backwards. Her line, roughly: Galileo's exegetical principles weren't radical at all. The stuff about scripture being accommodated to the capacities of ordinary readers, about nature and scripture not really conflicting because they issue from the same source, about the Bible not being an astronomy textbook — that was Augustinian boilerplate that a lot of perfectly orthodox Catholics and Protestants would have signed without blinking. What was actually novel and actually provocative was (a) the claim that a demonstrated conclusion in natural philosophy can overturn the literal sense of a passage, which quietly hands interpretive authority to the mathematician, and (b) his refusal of the escape hatch where you say heliocentrism is just a useful hypothesis that saves the appearances. On her reading the fight was less science-vs-religion and more about jurisdiction: who gets to fix the meaning of scripture, and what counts as proof. I want to press her on this for 40 minutes without being a jerk and without letting her just restate the thesis four times.

  Act as a philosopher/historian of science helping me prep, and think carefully before you draft — first brainstorm for yourself, briefly, where the weak joints in her position are and what the standard dodges will be, then write the questions. Give me 9 or 10 total, and I need at least one each on: whether accommodation and the two-books-of-nature-and-scripture idea are really the same move or two different moves that constantly get conflated, and what turns on seperating them; how her reading handles the authority angle — the question of who has the right to determine the sense of scripture, and the caution about reading against the consensus of the Fathers — rather than the content of the astronomy; what the hypothesis/instrumentalism option concretely was and whether taking it would have kept him out of trouble, or whether that's wishful thinking about how the machinery actually worked; and whether her picture makes him more or less modern than the popular story does, i.e. whether the separate-domains reading is a retrojection. For every question, add a one-line follow-up aimed at the answer she's most likely to give — the smart dodge, not the dumb one. No filler like what drew her to the topic, and nothing that just invites a rehash of the letter to the Grand Duchess. Also, don't hang any question on a specific article or book title — you may not have web access and I can't check citations mid-interview, so keep everything to arguments and history she can answer from the armchair.

  Wrap up with one sentence on the thing I should not let her get away with, then on the very last line give me \answer{...} with the single question you'd keep if the episode could only run one.
