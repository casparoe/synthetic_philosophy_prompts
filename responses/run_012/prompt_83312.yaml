  ### Brainstorm: Weak Joints & Standard Dodges

  *   **Weak Joint 1: Availability vs. Permission.** Just because Augustine wrote something doesn't mean the 1616 Church allowed you to use it to override the Fathers.
      *   *Smart Dodge:* "I'm not saying it was permitted, just that the *resources* were orthodox."
  *   **Weak Joint 2: The Demonstration Gap.** Galileo claimed authority because he had proof. He didn't have proof (no parallax). If the authority claim rests on a failed demonstration, is the principle moot?
      *   *Smart Dodge:* "We're analyzing the structural conflict, not the empirical success."
  *   **Weak Joint 3: Instrumentalism as Safety.** Would accepting instrumentalism actually have saved him? Or was the Church hostile to the *possibility* of truth regardless of the claim?
      *   *Smart Dodge:* "It would have depoliticized the issue, even if theological tensions remained."
  *   **Weak Joint 4: Modernity.** If Galileo is fighting over biblical interpretation, is he really a "modern scientist"? Or does this view collapse the science/religion distinction too much?
      *   *Smart Dodge:* "He's modern in epistemology, pre-modern in sociology."

  ***

  ### Interview Questions

  1.  You treat accommodation and the two-books doctrine as a single block of Augustinian orthodoxy. But accommodation explains why scripture *speaks* phenomenally, while two-books explains where we *look* for truth. Aren't these distinct moves that get conflated?
      *   Follow-up: If they're distinct, can you accept accommodation without accepting the mathematician's right to define the second book?

  2.  What turns on separating them? If accommodation is just about language, does it actually license overturning the literal sense, or just explaining it away?
      *   Follow-up: So is the conflict about what scripture says, or about who decides what it says?

  3.  You shift the focus from astronomical content to interpretive authority. But doesn't the Council of Trent bind interpreters to the consensus of the Fathers on matters of faith?
      *   Follow-up: Was Galileo claiming heliocentrism wasn't a matter of faith, or that his physics trumped the Fathers?

  4.  If the issue is jurisdiction, does that mean if a theologian had proposed heliocentrism with the same exegetical principles, it would have been fine?
      *   Follow-up: So the problem wasn't the math, it was the mathematician speaking out of turn?

  5.  Galileo argues that nature is prior to scripture because God is found in both. Does this priority claim secretly reintroduce content under the guise of procedure?
      *   Follow-up: Are you saying the Church saw through this and recognized it as a content claim in disguise?

  6.  Let's talk about the escape hatch. Instrumentalism—saving the appearances without claiming physical truth—was standard for astronomers. If Galileo had taken that deal, concretely, would the Inquisition have left him alone?
      *   Follow-up: Are you saying the condemnation was about his ontological claim, not just his pastoral impact?

  7.  Bellarmine seemed open to discussion if there was real proof. Was the rejection of instrumentalism Galileo's choice, or was the Church demanding he treat it as false regardless?
      *   Follow-up: So is your argument that the Church would have accepted proof, or that they never believed proof was possible?

  8.  The popular story makes Galileo a modern secular scientist fighting dogma. Your story makes him a technical interpreter of scripture fighting over authority. Does your view make him less modern than the myth suggests?
      *   Follow-up: If he's not separating science from religion, is he actually founding modern science or just reforming theology?

  9.  Is the "separate domains" idea—science deals with how, religion with why—a retrojection we're projecting onto Galileo to make him comfortable?
      *   Follow-up: If it is a retrojection, does that undermine the idea that he was protecting science from religion?

  10. Galileo insisted he had a demonstration. But by 1633 standards, he didn't have stellar parallax. If his claim to authority rested on a demonstration he couldn't actually deliver, doesn't that weaken the jurisdictional argument?
      *   Follow-up: So are we defending his principle, or just his stubbornness?

  ***

  Do not let her equate the theological *availability* of Augustinian principles with the institutional *permission* to deploy them against the consensus of the Fathers.

  \answer{If the issue is jurisdiction, does that mean if a theologian had proposed heliocentrism with the same exegetical principles, it would have been fine?}
