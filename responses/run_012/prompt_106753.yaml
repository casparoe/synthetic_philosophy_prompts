      *   *Smith's View:* Merchants push monopoly -> State enforces -> Public pays -> Colonies revolt.
      *   *Reality:* Ministry enforces sovereignty -> Merchants split (some want peace) -> Public pays -> War.
      *   *The Gap:* Smith assumes wealth maximization is the state's goal. The state's goal was power/order.
      *   *The "Double Down":* Smith calls it madness ("projecting spirit"). Actually, it was consistent with 18th-century statecraft (no voluntary dissolution of empires).
      *   *Theory Verdict:* Great critique of mercantilism, weak theory of state behavior under political stress.

  9.  **Final Review against Constraints:**
