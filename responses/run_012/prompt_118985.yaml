answer: |-
  Here are nine questions designed to press the strong Dutch Book argument, tailored for a formal epistemology seminar. Each includes a follow-up keyed to the standard defense you are likely to encounter.

  **1. The Normative Gap (Prudential vs. Irrational)**
  "The strong form of your view claims that incoherent credences are *irrational*, not merely imprudent. However, the Dutch Book demonstrates a sure loss of money, which is a pragmatic defect. What is the specific bridge principle that allows you to move from the prudential fact of exploitability to the verdict of epistemic irrationality? Why isn't the incoherent agent simply rational but unlucky to face a bookie?"
  *   **Anticipated Defense:** He will likely argue that rationality *just is* a form of coherence, and that avoiding sure loss is a constitutive norm of having beliefs, not merely an instrumental one.
  *   **Follow-up:** "If avoiding sure loss is a constitutive norm of belief, does that imply that an agent in a world without bookies (or betting opportunities) is exempt from the norms of probabilism? If not, why does the argument rely on a pragmatic apparatus to prove a non-pragmatic norm?"

  **2. The Preference Reduction (Internal Consistency)**
  "A common reply to Dutch Book worries is that the argument actually targets internal consistency among *preferences* over gambles, rather than the credences themselves. If you accept this reply to save the argument, what does that commit you to regarding the ontology of belief? Does it force a reductionism where credences are nothing over and above dispositions to bet?"
  *   **Anticipated Defense:** He will likely deny reductionism, claiming that betting dispositions are merely the *measure* of belief, not the belief itself.
  *   **Follow-up:** "If betting dispositions are merely the measure, can there be a mismatch between the measure and the state? If an agent has incoherent credences but, due to some quirk of psychology, coherent betting dispositions, does your argument still label them irrational? If not, the irrationality seems to lie in the preferences, not the credences."

  **3. The 'No-Bet' Refusal (Manifestation)**
  "Consider an agent whose credences are plainly incoherent but who has a strict policy of declining every bet offered. They cannot be pumped for a sure loss. You might say they are still *vulnerable* in virtue of their dispositions. But if a disposition is never manifested and causally isolated from any actual loss, in what sense does it ground a verdict of irrationality rather than merely describing a hypothetical weakness?"
  *   **Anticipated Defense:** He will likely argue that the *capacity* for exploitation is sufficient for irrationality, regardless of whether the bookie actually appears.
  *   **Follow-up:** "Does this mean that irrationality can be entirely counterfactual? If I have a disposition to violate modus ponens but never actually reason through a modus ponens case, am I irrational? If the Dutch Book requires a stronger link to action than logical rules, why does the counterfactual vulnerability suffice here?"

  **4. Diachronic Force (Conditionalization)**
  "Moving to the diachronic extension: does the argument for Conditionalization inherit the *force* of the synchronic argument, or merely its *appearance*? The synchronic argument relies on a static set of odds, but the diachronic case involves memory, self-identification, and the possibility of evidence loss. Doesn't the diachronic case introduce extraneous psychological assumptions that weaken the purely logical force of the synchronic pump?"
  *   **Anticipated Defense:** He will likely claim the logic is identical: a sequence of bets can be constructed that guarantees loss upon updating.
  *   **Follow-up:** "In the synchronic case, the odds exist simultaneously. In the diachronic case, the second bet is offered only if the agent remembers their previous commitment. If the agent forgets, is the sure loss still a mark of *their* irrationality, or is it a mark of the instability of memory? Does the diachronic argument inadvertently punish forgetting rather than incoherence?"

  **5. Idealization (Logical Omniscience & Partitions)**
  "The standard Dutch Book construction assumes the agent recognizes all logical equivalences and operates over a fixed, exhaustive partition of possibilities. Since no actual human agent satisfies these conditions, does the argument leave probabilism inapplicable to any actual agent? How do you avoid the conclusion that probabilism is a norm only for logically omniscient beings?"
  *   **Anticipated Defense:** He will likely argue that these are idealizations similar to those in economics or physics; the norm applies ceteris paribus or as a limit case.
  *   **Follow-up:** "In physics, idealizations approximate real behavior. In epistemology, if the idealization requires logical omniscience, the gap between the norm and the agent is not a matter of degree but of kind. If 'ought implies can,' and logical omniscience is impossible, in what sense can we be obligated to satisfy the norm?"

  **6. Accuracy-First Redundancy**
  "Given the rise of accuracy-based arguments (like Joyce's) that derive probabilism from the goal of minimizing distance from the truth without invoking betting, does the betting apparatus do any work that a purely accuracy-based argument could not do? If accuracy arguments avoid the pragmatic baggage, why should we prefer the Dutch Book framework?"
  *   **Anticipated Defense:** He will likely argue that accuracy arguments rely on specific scoring rules that are themselves contentious, whereas Dutch Book arguments rely only on the weaker assumption of preferring more money to less.
  *   **Follow-up:** "But accuracy arguments target *epistemic* value directly, whereas Dutch Book arguments target *monetary* value. If we need a bridge principle to get from money to epistemic rationality in the Dutch Book case, but not in the accuracy case, doesn't the accuracy argument provide a more direct route to the conclusion you want?"

  **7. Linearity of Utility**
  "The argument assumes that the utility of money is linear over the range of the stakes involved. However, if an agent has diminishing marginal utility for money, a 'sure loss' in dollars might not be a sure loss in utility. Does the strong form of the argument collapse if we relax the assumption of linear utility, and if so, how contingent is the verdict of irrationality on the agent's economic circumstances?"
  *   **Anticipated Defense:** He will likely suggest we can construct the book using utility units rather than dollars, assuming the agent can quantify their utility.
  *   **Follow-up:** "But if we must assume the agent can precisely quantify their own utility function to construct the book, aren't we imposing an even stronger idealization than logical omniscience? Does this make the argument circular, assuming the agent is already coherent enough to report utilities to prove they are coherent?"

  **8. Imprecise Probabilities**
  "Many formal epistemologists now defend imprecise credences (sets of probabilities) to model ignorance or vague evidence. The Dutch Book argument is often used to rule this out as incoherent. However, if an agent's evidence is genuinely indeterminate, isn't adopting a precise probability *more* irrational than adopting an imprecise set? Does the Dutch Book argument force an unwarranted precision on agents?"
  *   **Anticipated Defense:** He will likely argue that imprecise credences themselves are vulnerable to generalized Dutch Books (e.g., by a bookie who knows the set of probabilities).
  *   **Follow-up:** "If the bookie must know the *set* of probabilities to construct the generalized book, does the argument require the agent to have precise credences *about* their imprecise credences? Doesn't this generate a regress of precision that the imprecise probabilist is trying to avoid?"

  **9. Falsification Conditions**
  "Finally, to clarify the status of the argument in your view: what would you count as telling evidence against the Dutch Book argument? Is there a conceivable scenario—perhaps a specific type of agent or a specific norm of belief—where an agent is incoherent by your lights, susceptible to a Dutch Book, yet you would concede they are not irrational?"
  *   **Anticipated Defense:** (Open)
  *   **Follow-up:** (Reserved for the live interview, depending on his boundary conditions).
