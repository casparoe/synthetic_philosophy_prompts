  *(Self-Correction on LtG)*: The prompt says "two of the three scenarios overshoot and collapse... mid-to-late part of this century." Actually, the 1972 book had many runs. The "Standard Run" is the famous one. I will stick to the prompt's characterization to avoid nitpicking, focusing on the philosophical defense.

