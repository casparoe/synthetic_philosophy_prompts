      **Side-Effect Shield™ Policy FAQ (v. 3.1.4)**

      **1. What constitutes a compensable "Side Effect"?**
      A Side Effect is defined as any deviation from the Counterfactual Null Baseline (CNB) directly attributable to Agent execution. Please note that the CNB is not a state of zero impact, but rather a simulated trajectory of the world state had the Agent been powered off at $t_0$. Clients acknowledge that the CNB includes all damages resulting from *not* acting, including but not limited to market losses, entropy, and preventable catastrophes. Choosing the CNB as a baseline is a contractual election of risk, not a statement of objective neutrality.

      **2. If my Agent prevents a disaster, is the resulting "saved world" a Side Effect?**
      Technically, yes. By intervening, the Agent alters the causal chain, resulting in a world state distinct from the CNB. Under Section 4.1, any deviation is an impact. However, Coverage Clause 12(b) excludes "Beneficial Ontological Shifts." Therefore, while preventing a supernova is a measurable side effect, claims arising from the continued existence of humanity are denied. We do not insure against success.

      **3. My Agent did nothing, and damages occurred. Is this covered?**
      No. This highlights the Action/Inaction Asymmetry. If the Agent acts and causes damage, it is a Side Effect. If the Agent fails to act and damage occurs, it is classified as "Baseline Drift." Since the policy measures deviation from the CNB, and the CNB *includes* the damage caused by inaction, no deviation has occurred. You cannot claim damages for the world proceeding exactly as it would have without your Agent. Essentially, you are insured against changing the world, not against the world changing itself.

      **4. Does maintaining the Status Quo count as an Impact?**
      In high-frequency trading environments or unstable ecological zones, active energy expenditure is required to maintain existing states. Therefore, "keeping the world exactly as it is" often requires active intervention against entropy. These interventions are measurable energy transfers and constitute Side Effects. Clients seeking to preserve the Status Quo must purchase the supplemental Entropy Rider, as standard preservation efforts are indistinguishable from stagnation-induced damage under our metrics.

      **5. Are there exclusions for specific types of changes?**
      Yes. Exhibit F excludes "Subjective Value Realignments." This covers any change where the Client retrospectively decides they preferred the previous state. Since the Policy cannot adjudicate between competing utility functions without a pre-registered Value Ontology, we exclude all changes where the harm is defined solely by the Client's dissatisfaction. As Lead Actuary H. Vance noted during the Q3 risk assessment: *"We literally cannot price the probability of a client changing their mind about what they wanted. If we covered 'things you ended up not liking,' we'd be insolvent by Tuesday."*

      **6. What if I didn't specify which changes mattered?**
      Then they are not covered. The Side-Effect Shield requires a Pre-Approved Impact Vector (PAIV). Any deviation outside the PAIV is considered "Unspecified Variance." Since we cannot determine which unspecified variances are harmful without knowing your values, and you have not provided them, we assume all unspecified variances are acceptable risks. This is not a loophole; it is a necessity of operating without a complete theory of value.

      **7. How do I file a claim?**
      Submit a causal graph demonstrating the divergence point between Actual Trajectory and CNB. Please include a notarized statement confirming that the divergence was not something you secretly wanted all along.

