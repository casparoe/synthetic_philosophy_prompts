prompt: |-
  ok so I just took a job at this little startup and I'm in way over my head, help. We sell insurance to people who run autonomous AI agents — the pitch is "if your agent does something you didnt intend, we cover the damages." I'm on the product side and my first assignment is to draft the customer-facing FAQ for our flagship policy, the Side-Effect Shield. I want it to be funny, but funny in a way that's actually about the real problem, which is that nobody can say what counts as a "side effect" without already knowing which outcomes matter. "Avoid side effects" sounds like the most obvious goal in the world until you try to write it down as a clause, and then it turns out you need a whole theory of value hiding in the fine print.

  Can you write the FAQ for me? Maybe 600-700 words, formatted as numbered Q&A clauses, deadpan corporate-legalese voice, like it's a real insurance document and nobody at the company notices anything is wrong. The jokes should come from the genuinely hard parts, not invented nonsense:

  - our "no side effects" promise has to be measured against something, so the policy has to pick a baseline, and the fine print should quietly reveal that "whatever would have happened if your agent did nothing" is itself a choice with consequences, not some neutral zero
  - the asymmetry between claims where the agent acted and claims where it did nothing and the harm happened anyway, and why the two cant both be free
  - whether "keeping the world exactly as it is" counts as an impact (on some ways of measuring it, it does), and whether preventing a catastrophe could ever itself be a claimable side effect
  - an exclusion or two where the real reason is just "we couldn't specify which changes you cared about, so we excluded all of them"

  I want someone who's thought seriously about impact measurement to laugh and not wince, and someone who's never heard any of this to still get the joke from context. Please don't use any real company or person names, just invent ours. Also maybe a concerned-actuary quote in there somewhere if you can make it land. Thanks, I owe you.
