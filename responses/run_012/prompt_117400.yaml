  # DECISION TREE: THE GAVAGAI PUZZLE

  **Starting Commitment:** *I accept that the gavagai case is a genuine puzzle, i.e. that a linguist could have all the assent and dissent data in the world and still be torn between a manual on which 'gavagai' picks out rabbits and one on which it picks out temporal stages of rabbits.*

  Follow the branches by answering the questions below. Note that where two paths lead to the same position, this indicates that the position is robust across different assumptions about evidence. Where a combination of answers leaves a gap, the status of that view is noted.

  ---

  ### NODE 1: THE SCOPE OF EVIDENCE
  **Is the linguist restricted *in principle* to observing overt behaviour (assent/dissent), or can they appeal to facts about the speaker's brain, eyes, and environment?**

  *   **A. They can appeal to physical/physiological facts.** → Go to **Node 2**.
  *   **B. They are restricted to overt behaviour.** → Go to **Node 3**.

  ---

  ### NODE 2: THE PHYSICAL FIX (Priya's Test)
  **If we include facts about the villager's nervous system and what their eyes are actually tracking, does this determinately fix whether 'gavagai' refers to rabbits or rabbit-stages?**

  *   **A. Yes, physical facts settle the reference.** → **LEAF: Anti-Indeterminacy (Perceptual Content)**.
      *   *Note:* This is your mate Priya's line. It holds that indeterminacy is merely epistemic; better science dissolves the puzzle.
  *   **B. No, even physical facts underdetermine translation.** → **LEAF: Quine's Indeterminacy**.
      *   *Note:* Quine argues that even a complete physics of the speaker does not fix a unique translation manual. (See also Node 5, Path B).

  ---

  ### NODE 3: THE NATURE OF THE GAP
  **Is the failure to decide between 'rabbit' and 'rabbit-stage' due to a lack of evidence (we could know more), or because there is no fact of the matter to be found?**

  *   **A. Lack of evidence (Epistemic).** → **LEAF: Behaviourism-in-Disguise**.
      *   *Note:* This view treats meaning as exhausted by behavioural dispositions. It is often considered unattractive today as it ignores internal cognitive states.
  *   **B. No fact of the matter (Ontological).** → Go to **Node 4**.

  ---

  ### NODE 4: THE LOCUS OF INDETERMINACY
  **Does the uncertainty attach to individual terms (like 'gavagai') in isolation, or only to whole sentences and the manual connecting them?**

  *   **A. Individual terms (Reference).** → Go to **Node 5**.
  *   **B. Whole sentences (Holism).** → Go to **Node 6**.

  ---

  ### NODE 5: HOME AND ABROAD (Tom's Kripke Test)
  **Does this indeterminacy of reference arise when translating your own language (home), or only when translating a foreign tongue (abroad)?**

  *   **A. It arises at home too.** → **LEAF: Kripkenstein (Meaning Scepticism)**.
      *   *Note:* This is your friend Tom's comparison. It radicalises Quine by suggesting meaning is sceptical even for oneself.
  *   **B. Only when abroad.** → **LEAF: Quine's Indeterminacy**.
      *   *Note:* Quine insists indeterminacy is a feature of *radical* translation, not a general scepticism about meaning. (Merges with Node 2, Path B).

  ---

  ### NODE 6: THE MACHINE TEST
  **Suppose we replace the linguist with a machine trained on the behaviour, but we can inspect its internal code. If the code structurally aligns with 'rabbit-stages' rather than 'rabbits', does that settle what the system means?**

  *   **A. Yes, internal structure fixes meaning.** → **LEAF: Unnamed (Computational Realism)**.
      *   *Note:* This is Tom's intuition applied to the machine. It is currently unexplored as a formal position in this debate; critics argue internal syntax is just more text requiring interpretation.
  *   **B. No, structure is just another manual.** → Go to **Node 7**.

  ---

  ### NODE 7: THE BILINGUAL CHILD
  **If a child is raised simultaneously in both linguistic communities (learning 'rabbit' and 'gavagai' usage together from birth), does this dual exposure resolve the indeterminacy?**

  *   **A. Yes, shared acquisition fixes reference.** → **LEAF: Davidson's Benign Version**.
      *   *Note:* Davidson accepts indeterminacy but argues that a shared causal history and the principle of charity make it harmless for truth and communication.
  *   **B. No, indeterminacy survives even then.** → Go to **Node 8**.

  ---

  ### NODE 8: THE PURPOSE OF TRANSLATION
  **If reference is indeterminate even for a bilingual speaker, is translation an attempt to state facts about meaning, or simply a practical art for coordinating action?**

  *   **A. Stating facts (Truth-apt).** → **LEAF: Quine's Indeterminacy**.
      *   *Note:* Quine maintains translation manuals can be true or false relative to a basis, but multiple incompatible manuals can be equally valid.
  *   **B. Coordinating action (Practical).** → **LEAF: Deflationary View**.
      *   *Note:* This view suggests we should stop asking what words *mean* and ask only how they are *used* to get things done.

  ---

  ### SUMMARY OF LEAVES

  1.  **Anti-Indeterminacy (Perceptual Content):** The puzzle dissolves with better evidence (Priya).
  2.  **Behaviourism-in-Disguise:** The puzzle is just ignorance of behavioural facts.
  3.  **Kripkenstein (Meaning Scepticism):** The puzzle applies to oneself and reference (Tom).
  4.  **Quine's Indeterminacy:** The puzzle is ontological, sentence-based, and specific to radical translation (appears in three places).
  5.  **Davidson's Benign Version:** The puzzle is real but harmless due to shared causal history (Bilingual).
  6.  **Deflationary View:** Translation is not a fact-stating business.
  7.  **Unnamed (Computational Realism):** Internal physical structure fixes meaning (Tom's Machine).

  **GAPS AND COHERENCE:**
  *   **Quine's Position:** You will notice Quine's line appears at Node 2, Node 5, and Node 8. This is not an error; it reflects that Quine's argument is robust whether you start from physical facts, radical translation, or the nature of truth.
  *   **The Machine Gap:** The 'Unnamed (Computational Realism)' leaf is theoretically vulnerable. If internal structure fixes meaning, one must explain why that structure itself is not subject to interpretation (the homunculus problem).
  *   **The Bilingual Gap:** If you answer 'Yes' at Node 7 but 'No' at Node 2 (physical facts don't fix it), you hold that *social* facts fix what *physical* facts cannot. This is a coherent but distinct position from strict physicalism.
