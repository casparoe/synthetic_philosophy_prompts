      *   *Refinement on Composition:* The prompt asks: "Does the lexical claim treat that as one band E harm or as many band A harms — and does your procedure's answer follow from the stated position, or is it a stipulation you are adding?"
      *   *Answer:* The stated position defines E by *severity* (agony). If micro-harms sum to agony, the *severity* experienced is E. Therefore, it must be treated as E to maintain the spirit of "agony is lexically worse." However, strictly speaking, the prompt defines bands by *severity*, not *sum*. I need to be honest: Treating cumulative A's as an E is a *stipulation* required to make the theory robust against "death by a thousand cuts." I will flag this clearly.

      *   *Refinement on Offset:* Clause (iv) says "harms in bands A to D aggregate against one another." It does not mention pleasure. Clause (i) says pleasure is a tie-breaker. Therefore, Pleasure cannot offset Pain. This is a direct deduction, not a stipulation.

      *   *Refinement on Boundary:* The A-E boundary is the critical failure point. A caseworker deciding D vs E is making a lexical value judgment, not a factual one. I must emphasize this.

  9.  **Final Polish:** Ensure tone is professional, direct, and suitable for a Programme Officer briefing caseworkers and trustees. (Avoid overly academic jargon where possible, but keep precision).

