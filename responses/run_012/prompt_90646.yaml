      *(Self-Correction during drafting)*: Wait, regarding Claim 3 ("cannot know meaning... without empirical investigation"). Putnam argues against the traditional view that meaning is known a priori. So, in a sense, he *does* argue that knowing the *full* meaning (including extension) requires empirical work. But the book says "meaning of our own words." I know what I mean by "water" (the clear liquid...). I just don't know its nature. I need to be precise here: Knowledge of *reference* requires empirical investigation; knowledge of *concept/stereotype* does not. The book blurs this.

