prompt: |-
  I edit the 'what if' slot at a history magazine — one long counterfactual piece a month, maybe a dozen pitches to get through, and I have to triage them myself in about an hour. My fact-checker can verify facts but she can't tell me whether a what-if is a coherent what-if, and the editor-in-chief signs off on whatever I greenlight. I want a screening procedure: the questions to ask in order, what counts as a good enough answer to each, where it stops with a flat no, and where the call is mine because it's taste and not logic.

  I've got a rule of thumb I'd like you to either formalize or kill. Only what-ifs about events are well-formed — a battle going the other way, a decision, a death, an accident. What-ifs about trends ('what if industrialization had started in China') arent, because there's no single minimal change that would have got you there; and once you've made your one change, everything downstream has to come from ordinary causes, not from the author quietly rearranging the world a second and third time to reach the ending they like. Related: I want the procedure to keep apart a what-if that shows the outcome wasn't inevitable from one that only shows it was unlikely. I dont think those are the same thing and I keep seeing pitches slide between them.

  Then run it on three pitches and show your work: (1) what if the Armada had landed in 1588, (2) what if Princip's shot had missed in Sarajevo, (3) what if the library at Alexandria had never burned. Number three is my favorite and I suspect you're going to tell me it's junk — be straight with me about that, and about which parts of the procedure are doing real work versus which are just me dressing up a hunch.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **Role:** Editor of a history magazine's "What If" slot.
      *   **Task:** Triage ~12 pitches/hour. Needs a fast, rigorous screening procedure.
      *   **Constraints:** Fact-checker verifies facts, not logic/coherence. Editor-in-Chief rubber stamps the editor's greenlights.
      *   **Goal:** A step-by-step screening procedure (questions, pass/fail criteria, subjective calls).
      *   **Specific Rule to Formalize/Kill:** "Event-based what-ifs are valid; Trend-based what-ifs are invalid." (Minimal change principle, no re-arranging the world downstream).
      *   **Specific Distinction:** "Outcome wasn't inevitable" vs. "Outcome was unlikely."
      *   **Test Case:** Run the procedure on three pitches: (1) Armada lands (1588), (2) Princip misses (1914), (3) Library of Alexandria doesn't burn.
      *   **Tone:** Professional, direct, critical, "be straight with me."

  2.  **Deconstruct the User's Rule of Thumb:**
      *   *The Rule:* Only events (battle, decision, death, accident) are well-formed. Trends (industrialization in China) are not.
      *   *Reasoning:* Trends lack a "single minimal change." Downstream effects must follow ordinary causes, not authorial fiat.
      *   *My Assessment:* This is a strong heuristic for *plausibility* and *narrative focus*. It aligns with standard counterfactual history theory (e.g., Ferguson, Tetlock). "Trend" what-ifs often devolve into "magic wand" scenarios. However, some "events" trigger "trends," and some "trends" hinge on specific "events." The distinction needs to be sharp for a 1-hour triage.
      *   *Refinement:* Call it the "Point of Divergence (PoD) Specificity Test."

  3.  **Deconstruct the "Inevitable vs. Unlikely" Distinction:**
      *   *Unlikely:* The actual outcome happened, but it was a long shot (e.g., underdog wins). A what-if showing the favorite won is interesting but doesn't necessarily challenge historical determinism.
      *   *Not Inevitable:* The actual outcome depended on a fragile chain of causality. Breaking one link changes everything. This is the heart of good counterfactual history (contingency).
      *   *Screening Need:* Does the pitch demonstrate *contingency* or just *probability*?

  4.  **Drafting the Screening Procedure (The "Triage Protocol"):**
      *   Need 4-5 steps max. Time is tight.
      *   *Step 1: The Point of Divergence (PoD).* Is it a specific event? (User's rule).
      *   *Step 2: Minimal Rewrite.* Does the author change *only* that event? (No "quiet rearranging").
      *   *Step 3: Causal Chain.* Are the downstream effects logical/ordinary?
      *   *Step 4: Significance.* Does it change the macro-history, or just the micro-history? (Inevitability test).
      *   *Step 5: The "So What?"* (Taste/Editorial judgment).

  5.  **Refining the Criteria (Pass/Fail/Subjective):**
      *   Need to explicitly mark where the editor's taste comes in vs. logical failure.
      *   *Hard No:* Vague PoD, multiple magical changes, anachronistic reasoning.
      *   *Soft No/Editor Call:* Plausible but boring, plausible but too similar to actual history.

  6.  **Running the Test Cases:**

      *   **Pitch 1: Armada Lands (1588).**
          *   *PoD:* Specific event (weather/battle outcome).
          *   *Minimal Change:* Spanish troops disembark.
          *   *Causal Chain:* Do they take London? Does England turn Catholic? Does this stop colonization of America?
          *   *Verdict:* Classic, valid. High contingency.

      *   **Pitch 2: Princip Misses (1914).**
          *   *PoD:* Specific event (the shot).
          *   *Minimal Change:* Archduke lives.
          *   *Causal Chain:* Does war still happen? Many historians say yes (structural tensions).
          *   *Inevitability Check:* This is the trap. If the pitch argues "No WWI ever," it might fail the "ordinary causes" test because the tensions were real. If it argues "No WWI *in 1914*," that's better.
          *   *Verdict:* Valid PoD, but risky on the downstream logic. Needs to handle structuralism vs. agency.

      *   **Pitch 3: Library of Alexandria.**
          *   *PoD:* "Never burned."
          *   *Problem:* It wasn't one fire. It was a decline over centuries (Caesar, Aurelian, Theophilus, Caliph Omar myths).
          *   *User's Rule:* This violates the "Event vs. Trend" rule. It's a "Trend/Process" masquerading as an event.
          *   *Minimal Change:* Impossible. Which fire? If you save the scrolls, does knowledge survive? (Requires assuming transmission mechanisms that didn't exist).
          *   *Verdict:* Junk (per user's rule and historical consensus). It requires "magic" to keep the knowledge alive through the Dark Ages.

  7.  **Addressing the "Hunch vs. Logic" Request:**
      *   I need to be honest about which parts of my proposed procedure are rigorous and which are just codifying the user's intuition.
      *   *Logic:* PoD specificity, Minimal Rewrite.
      *   *Taste/Hunch:* Significance threshold, "Boring but valid" vs. "Exciting but shaky."
      *   *Alexandria:* Confirm it's junk, but explain *why* using the procedure, not just "because you said so."

  8.  **Final Review against Constraints:**
      *   *Time:* Can this be done in 5 mins per pitch? Yes, if the questions are sharp.
      *   *Tone:* Professional, peer-to-peer.
      *   *Distinction:* Ensure "Unlikely vs. Inevitable" is integrated.

  9.  **Drafting the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "Alexandria is bad." I need to show *which step* kills it. (Step 1: PoD Specificity).
      *   *Correction:* On Princip, acknowledge the "Great Man" vs. "Structural" debate. That's where the "Inevitable vs. Unlikely" distinction matters most.
      *   *Correction:* On Armada, note that it's a cliché. Is it *too* done? That's a "Taste" call.

  10. **Final Polish:** Check the "Event vs. Trend" formalization. Call it the "Node vs. Flow" test. Ensure the distinction between "Contingency" (Inevitable) and "Probability" (Unlikely) is clear. (Contingency = The world changes fundamentally. Probability = The odds were long, but the structure remains).

      *(Self-Correction on "Inevitable vs. Unlikely"):*
      *   *Unlikely:* The underdog wins the battle, but the war ends the same way.
      *   *Not Inevitable:* The underdog wins the battle, and the empire collapses.
      *   *Screening Question:* "If this change happens, does the structural pressure remain?"

      Let's assemble the protocol.

      *   **Step 1: The Pinpoint Test (PoD).**
      *   **Step 2: The Butterfly Constraint (Minimal Change).**
      *   **Step 3: The Causal Bridge (Ordinary Causes).**
      *   **Step 4: The Determinism Check (Inevitable vs. Unlikely).**
      *   **Step 5: The Stakes (Editorial Taste).**

      Okay, ready to write.
answer: |-
  Here is a formalized screening procedure based on your constraints and rule of thumb, followed by the triage of your three pitches.

  ### The Counterfactual Triage Protocol (CTP)

  **Time Budget:** 5 minutes per pitch.
  **Goal:** Filter for *coherence* and *contingency*.

  #### Step 1: The Pinpoint Test (Point of Divergence)
  **Question:** Can the author identify a single date, location, and actor for the change?
  **Pass:** "June 28, 1914, Sarajevo, Princip's pistol jams."
  **Fail:** "The 19th century develops differently," or "China embraces science earlier."
  **The Rule:** If the PoD requires changing a *climate of opinion*, a *technological baseline*, or a *decades-long process*, it is a **Flat No**. This formalizes your Event vs. Trend rule. Trends are the result of history, not the lever of it.
  **Editor Call:** None. This is logic. A vague PoD guarantees a magical rewrite.

  #### Step 2: The Butterfly Constraint (Minimal Rewrite)
  **Question:** Does the author change *only* the outcome of that event, leaving all prior conditions intact?
  **Pass:** The Spanish Armada lands, but the ships, men, and English defenses are exactly as they were in July 1588.
  **Fail:** The Spanish Armada lands, but the author also implies Spanish morale is higher or English logistics are worse to ensure the landing succeeds.
  **The Rule:** No "quiet rearranging." You cannot tweak the setup to guarantee the payoff.
  **Editor Call:** None. This is logic. Violating this is fiction, not counterfactual history.

  #### Step 3: The Causal Bridge (Ordinary Causes)
  **Question:** Are the downstream consequences derived from established historical forces, or do they require new "miracles"?
  **Pass:** Spanish troops land -> English militia mobilizes -> Battle occurs near London. (We know how armies move).
  **Fail:** Spanish troops land -> England immediately converts to Catholicism -> The Enlightenment never happens. (This skips the mechanism of religious conversion and intellectual shift).
  **The Rule:** The further you get from the PoD, the more gravity history exerts. Structural forces (economics, geography, demographics) resist change more than political events.
  **Editor Call:** **Low.** If the bridge requires assuming human nature changes, it's a No. If it requires assuming a specific political decision goes a specific way, it's a Maybe.

  #### Step 4: The Determinism Check (Inevitable vs. Unlikely)
  **Question:** Does this change break a structural lock, or does it just roll a different die?
  **Distinction:**
  *   **Unlikely:** The underdog wins the battle, but the war ends the same way due to resource disparities. (Interesting, but doesn't prove non-inevitability).
  *   **Not Inevitable:** The underdog wins the battle, and the war ends differently because the victory removed the *only* path to the actual outcome.
  **The Test:** Ask the author: "What structural pressure prevents history from snapping back to the actual timeline?"
  **Editor Call:** **High.** This is where you judge the argument's weight. A pitch can pass logic but fail here if the outcome is trivial (e.g., "Kennedy lives but still passes the Civil Rights Act").

  #### Step 5: The Stakes (Taste)
  **Question:** If this happened, would the world look recognizably different today?
  **Pass:** The map changes, the ideology shifts, or the technological timeline accelerates/decelerates.
  **Fail:** The personnel changes, but the systems remain identical.
  **Editor Call:** **Total.** This is your magazine's brand. Logic says it works; taste says is it worth 4,000 words?

  ---

  ### Triage of Pitches

  Here is the procedure applied to your three examples.

  #### Pitch 1: What if the Armada had landed in 1588?
  *   **Step 1 (Pinpoint):** **Pass.** The PoD is the naval engagement in the Channel or the weather ("Protestant Wind"). Specific event.
  *   **Step 2 (Butterfly):** **Pass.** Assumes Parma's army disembarks. Does not assume they are superhuman, just that they land.
  *   **Step 3 (Causal Bridge):** **Pass/Warning.** A battle near London is logical. However, assuming England *falls* requires assuming Elizabeth I doesn't escape or rally the shires. This is a fragile bridge.
  *   **Step 4 (Determinism):** **Pass.** This tests the contingency of Protestant England and the British Empire. If Spain wins, the structural lock of Atlantic dominance breaks.
  *   **Step 5 (Stakes):** **Pass.** High stakes. Catholic hegemony, no British Empire, different North America.
  *   **Verdict:** **Greenlight.**
  *   **Note:** It is a cliché. You have seen this before. But it passes the logic checks. Your call on whether your readers need another Armada piece (Step 5).

  #### Pitch 2: What if Princip's shot had missed in Sarajevo?
  *   **Step 1 (Pinpoint):** **Pass.** June 28, 1914. Specific actor, specific moment.
  *   **Step 2 (Butterfly):** **Pass.** Archduke Franz Ferdinand lives.
  *   **Step 3 (Causal Bridge):** **Fail/Warning.** This is the trap. The pitch likely argues "No World War I." But the structural pressures (alliances, mobilization timetables, imperialism) were already locked. Germany was pushing for a "preventive war."
  *   **Step 4 (Determinism):** **Fail (Likely).** Most historians argue WWI was *inevitable* by 1914, even if the trigger differed. If the author argues "No War," they are ignoring structuralism. If they argue "War starts 6 months later over a different border incident," that is valid but less dramatic.
  *   **Step 5 (Stakes):** **Dependent.** If the war happens anyway, the stakes are low (just a delay). If the war is averted, the stakes are massive.
  *   **Verdict:** **Yellow Light / Request Rewrite.**
  *   **Instruction to Author:** "You pass the Pinpoint test. You fail the Determinism test unless you address the structural pressures for war. Do not argue 'No War.' Argue 'Different War' or 'Delayed War,' and prove why the structural lock breaks. If you can't prove the lock breaks, the piece is just 'Unlikely,' not 'Not Inevitable.'"

  #### Pitch 3: What if the Library at Alexandria had never burned?
  *   **Step 1 (Pinpoint):** **Flat No.**
  *   **Analysis:** There was no single fire. There was damage during Caesar's siege (48 BC), Aurelian's campaign (270s AD), the decree of Theophilus (391 AD), and the Muslim conquest (642 AD). It was a decline, not an event.
  *   **Step 2 (Butterfly):** **Fail.** To save the Library, you must change the religious politics of Late Antiquity or the military tactics of Julius Caesar. You cannot save the *books* without changing the *world* that destroyed them.
  *   **Step 3 (Causal Bridge):** **Fail.** Even if the scrolls survive, do we assume the knowledge survives? Knowledge requires transmission (copying, teaching, translation). The social infrastructure for that collapsed due to economic and political fragmentation, not just lack of source material. Assuming the scrolls exist = Industrial Revolution in 800 AD is "magic."
  *   **Step 4 (Determinism):** **Fail.** This pitch confuses *information* with *progress*. It assumes history is driven by data storage rather than material conditions.
  *   **Verdict:** **Flat No.**
  *   **Note:** You suspected this was junk. The procedure confirms it at Step 1. It violates your Event vs. Trend rule. It treats "The Library" as a magical hard drive rather than an institution embedded in a decaying empire.

  ---

  ### Post-Mortem: Logic vs. Hunch

  You asked me to be straight about which parts of the procedure are doing real work versus dressing up your hunches.

  **1. The "Event vs. Trend" Rule (Step 1)**
  *   **Status:** **Real Work.**
  *   **Why:** This is the strongest logical filter. "Trend" pitches (Industrialization in China) almost always require changing geography, culture, *and* politics to make sense. They are impossible to bound. "Event" pitches (Princip's shot) allow you to hold variables constant. This isn't a hunch; it's methodological hygiene.

  **2. The "Inevitable vs. Unlikely" Distinction (Step 4)**
  *   **Status:** **Real Work.**
  *   **Why:** This saves you from publishing "Coin Flip" history. A coin flip (Princip misses) is *unlikely* to change the past if the gun was loaded (structural tensions). A lever pull (Armada lands) changes the *mechanics* of the outcome. Distinguishing these prevents you from publishing pieces that feel dramatic but are historically shallow.

  **3. The "Alexandria is Junk" Intuition**
  *   **Status:** **Hunch Confirmed by Logic.**
  *   **Why:** Your hunch was right, but for a specific reason. It's not just that it's "too long ago." It's that the Library is a *symbol*, not a *cause*. Saving the symbol doesn't change the cause (the collapse of the Mediterranean trade network). The procedure caught this at Step 1 (No Pinpoint) and Step 3 (Causal Bridge).

  **4. The "Armada is a Cliché" Worry (Step 5)**
  *   **Status:** **Pure Taste.**
  *   **Why:** Logically, the Armada pitch is sound. It passes every test. Whether you run it depends entirely on when you last ran it and what your competitors are doing. The procedure cannot tell you this; only you can.

  **Summary:**
  Your rule of thumb regarding Events vs. Trends is robust. Keep it. It kills the Alexandria pitch immediately. The Princip pitch is the dangerous one—it looks like an Event pitch but behaves like a Trend pitch (structural inevitability). Use Step 4 to force the author to confront that.
