      *   *Decision:* I will blend the practical and the theoretical but prioritize the ones that change *actions*.

      *Let's re-evaluate ordering based on "Practical Difference":*
      1.  **Bedside/Family:** Doctors must ignore current welfare. Families lose veto. (Highest practical change).
