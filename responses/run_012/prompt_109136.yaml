          *   *Point 3 (Unanticipated):* If authority is the source, the proxy *cannot* decide unless authorized. So, if the case is unanticipated and no proxy discretion exists, the default must be strict adherence or perhaps a presumption against treatment? Actually, if the authority is to *determine* treatment, and the determination is silent, the authority hasn't spoken. But usually, ADs are refusals. If it's a refusal of "life support" and this is a new kind of support, does it count? Strict authority view suggests narrow interpretation.
          *   *Point 4 (17 binding 40):* If competence is the threshold, and 17 is competent (legally variable, but philosophically), then yes. This risks binding a future self who is effectively a stranger.
          *   *Point 5 (Drafting):* Sunset clauses become *moral necessities* to mitigate the harshness. Proxy discretion becomes the only safety valve.
          *   *Point 6 (Later Self Status):* Yes, the later self is instrumentalized. This is the biggest philosophical cost.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the ordering right? The bedside reality is the most "practical." The metaphysical status is the most "philosophical." The prompt asks for practical difference ordered.
      *   *Adjustment:* I will group them by "Sphere of Impact."
