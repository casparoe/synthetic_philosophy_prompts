      6.  **Young Self:** Affects when you can sign. (Low frequency/regulated by law).
      7.  **Moral Status:** Underpins the view, but doesn't change action *unless* challenged.

      *Wait, I need to make sure I answer the specific 6 points.* I will weave them into the implications but ensure they are explicitly identifiable.

      *Revised Plan:*
