prompt: |-
  I teach a visiting session in a statistics department's methods seminar: sixty minutes, a flip chart, and an audience of graduate students and postdocs who write DAGs and use potential-outcomes notation daily but have never read a page of philosophy of causation. I want to teach them the difference between the counterfactual theory of causation and the interventionist theory — not to adjudicate between them, but to make them see that these are two theories rather than two notations for one thing, which is what they will assume walking in.

  Plan the session for me rather than explaining the material. I need the order in which the components must be introduced and why, what depends on what — bearing in mind that their fluency with interventions is an asset I can exploit and a prejudice I have to dislodge; the one case that should carry the whole hour, what it must have and what it must lack, and why the familiar illustrations (rocks thrown at windows, the sprinkler and the wet grass, the barometer and the storm) are the wrong ones for this room; the misconceptions they will form, in the order they will form them, and the precise point in the sequence at which each has to be headed off; where their own machinery — the DAG, the do-operator — should be brought in, and where it must be set aside; one question I can put to them at the end that would show whether they have grasped the distinction rather than merely followed the hour; and what I should openly tell them I am leaving out.

  I want the spine of the hour to be something they will not have met in their own literature, and I would rather you build the plan around it than around the standard contrasts: that the two theories disagree about the relata of causation — events or outcomes described at a chosen grain, on one side, against variables with a chosen range of values, on the other — and that each therefore inherits a prior, untheorised act of description, so that part of the disagreement is really a disagreement about where the carving gets done and who pays for it. Second, I want them to see that the interventionist programme is at bottom a theory of general, type-level relations which has to earn its verdicts about singular cases, whereas the counterfactual theory begins with singular cases and has to earn its verdicts about regularities. If you think that spine is wrong for this audience, or that one of the two halves will not survive sixty minutes with people who think in counterfactuals professionally, say so and give me a better one.

  For the carrying case, use the one I have in mind rather than inventing another: a database goes down during a nightly schema migration, and the outage is traced to a scheduled backup job that started while the migration was running; the operations team had earlier removed the lock that normally prevents exactly that collision; a second backup job was due to start an hour later in any case; and the post-mortem records a total but brief outage alongside a corruption signature that would have been different had the job started a minute later. Build the hour on this, and tell me what work the case does at each stage — which of its features are load-bearing for the disagreement between the two theories, which are decoration I should strip out, and what the case conspicuously fails to settle.

  Finally, be honest about the simplifications: which qualifications of each theory I will have to suppress in an hour, what a student in that room would have to unlearn afterwards, and whether the version of the distinction that survives the hour is one a philosopher would still sign.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Audience:** Grad students/postdocs in statistics. Fluent in DAGs, potential outcomes, $do$-operator. Zero philosophy background. Assume "counterfactual" and "interventionist" are just notations for the same thing.
      *   **Goal:** Distinguish Counterfactual Theory (CT) vs. Interventionist Theory (IT) of causation. Show they are distinct theories, not just notations. Do *not* adjudicate (pick a winner).
      *   **Constraints:** 60 minutes, flip chart only.
      *   **Specific Spine:** The user proposes a specific philosophical spine:
          1.  Relata disagreement (events/outcomes vs. variables/ranges).
          2.  Direction of fit (IT: type-level $\to$ singular; CT: singular $\to$ type-level).
          *Task:* Validate or correct this spine for this audience.
      *   **Specific Case:** Database outage during schema migration (collision with backup, lock removed, second backup due later, corruption signature depends on timing).
          *Task:* Use this case throughout. Identify load-bearing features vs. decoration.
      *   **Structure:** Order of components, dependencies, misconceptions (and when to head them off), when to use/set aside DAGs/$do$, final assessment question, explicit omissions.
      *   **Tone:** Honest about simplifications. Would a philosopher sign off on this?

  2.  **Evaluate the Proposed Spine:**

      *   *Spine 1: Relata (Events vs. Variables).* This is strong. Statisticians think in variables ($X, Y$). CT (Lewis-style) thinks in events ($c, e$). This maps well to the "notation vs. theory" confusion.
      *   *Spine 2: Direction (Type $\to$ Token vs. Token $\to$ Type).* This is also strong but tricky. IT (Woodward) is indeed about invariant relationships (types). CT (Lewis) starts with singular counterfactual dependence.
      *   *Critique:* For statisticians, the "Type vs. Token" distinction might feel like "Population vs. Individual" inference, which they know. I need to ensure they understand this is about the *definition* of causation, not just the level of analysis.
      *   *Verdict:* Keep the spine. It's sophisticated enough for postdocs and avoids the trivial "DAGs vs. Logic" trap. It challenges their ontological commitments.

  3.  **Evaluate the Case (Database Outage):**

      *   *Features:*
          1.  Migration + Backup collision (Cause).
          2.  Lock removed (Pre-emption/Enabling condition).
          3.  Second backup due later (Pre-emption/Redundancy).
          4.  Corruption signature depends on timing (Fine-graining/Sensitivity).
          5.  Total but brief outage (Effect).
      *   *Suitability:* It's technical (they get it), complex enough to stress the theories, but concrete.
      *   *Load-bearing:* The "Lock removed" is crucial for pre-emption (CT handles well, IT needs care). The "Corruption signature" is crucial for the Relata argument (Variables need binning, Events are specific). The "Second backup" is crucial for Type vs. Token (IT says "Backups cause outages generally," CT says "This backup caused this outage").
      *   *Decoration:* Specific DB technology, exact timestamps (unless relevant to signature).
      *   *Fails to settle:* Normative aspects (who is *responsible*), which both theories struggle with but in different ways.

  4.  **Drafting the Session Plan (Iterative Process):**

      *   *Minute 0-5: Hook & Diagnosis.* Acknowledge their fluency. State the misconception: "You think $Y(1) - Y(0)$ and $P(Y|do(X))$ are just math for the same metaphysics. They aren't."
      *   *Minute 5-15: The Case Introduction.* Lay out the DB story. Keep it on the flip chart.
      *   *Minute 15-30: Theory 1 (Counterfactual).* Focus on *events*. "If this specific backup hadn't run..." Use the corruption signature. *Risk:* They will model this with potential outcomes immediately. *Correction:* Force them to talk about *occurrences*, not variable values.
      *   *Minute 30-45: Theory 2 (Interventionist).* Focus on *variables*. "If we change the backup schedule..." Focus on invariance. The "Lock" variable. *Risk:* They will think this is just DAGs. *Correction:* Emphasize the *capacity* to intervene, not the graph structure itself.
      *   *Minute 45-55: The Clash (The Spine).* Relata (Event vs. Variable) and Direction (Token vs. Type). Use the "Second Backup" feature here.
      *   *Minute 55-60: Assessment & Omissions.* The final question. What was left out (probabilities, mechanisms, normativity).

  5.  **Refining the Misconceptions:**

      *   *Misconception 1:* "CT is just Potential Outcomes." *Head off:* When introducing CT, forbid $Y_i(1)$ notation. Use sentences: "If event c had not occurred..."
      *   *Misconception 2:* "IT is just DAGs + do." *Head off:* When introducing IT, emphasize *invariance across contexts*, not just graph surgery.
      *   *Misconception 3:* "They give the same answer." *Head off:* Use the "Second Backup" (redundancy). CT might say the first backup didn't cause it if the second would have (pre-emption). IT says the *variable* 'Backup' causes 'Outage' regardless of redundancy. (Wait, need to be careful here. Late pre-emption is hard for simple CT. Woodward handles it via paths. I need to simplify this for 60 mins without lying.)
      *   *Correction on Misconception 3:* Better point of divergence: The *Relata*. CT cares about the specific corruption signature (event). IT cares about the variable 'System State' (down/up). If the signature changes, CT says it's a different effect. IT might say it's the same variable value.

  6.  **Addressing the "Standard Illustrations" Constraint:**

      *   Why no rocks/windows? Too simple, implies physical force.
      *   Why no sprinkler/grass? Too probabilistic/common cause focused.
      *   Why no barometer? Too observational.
      *   *DB Case:* It involves *design*, *protocol*, and *logical* constraints, which fits the "variables vs. events" distinction better. A rock hitting a window is an event, but hard to map to a variable range without arbitrariness. A DB migration is inherently variable-based (schema version) but the outage is a specific event.

  7.  **Finalizing the Spine Validation:**

      *   Is the "Type vs. Token" spine viable? Yes. Woodward is explicitly about generalizations. Lewis is explicitly about singular causation.
      *   Is the "Relata" spine viable? Yes. Statisticians define variables *ex ante*. Philosophers debate whether the cause *is* the variable or the value.
      *   *Warning:* I must tell the user that "Counterfactual Theory" usually implies Lewis (events), while "Interventionist" implies Woodward (variables). Statisticians use "Counterfactuals" (Neyman/Rubin) which are actually closer to Interventionism in spirit (variables). I need to clarify *which* Counterfactual Theory I mean (Lewisian metaphysics vs. Rubin Causal Model). The prompt implies Lewisian (philosophy of causation). I must make this distinction clear or they will confuse Rubin with Lewis. *Crucial Point:* Rubin Potential Outcomes are actually Interventionist in philosophical spirit (variables, manipulations). Lewis Counterfactuals are Event-based. I need to make sure the session distinguishes Lewis (Philosophy CT) from Rubin (Stats PO). The prompt asks to distinguish "Counterfactual Theory" (Philosophy) from "Interventionist". I will treat "Counterfactual" as Lewis-style (events/similarity) and "Interventionist" as Woodward-style (variables/invariance).

  8.  **Developing the Final Question:**

      *   Needs to test the distinction, not the math.
      *   Idea: Ask about a case where the variable doesn't change, but the event does. Or where the generalization holds, but the singular link is broken.
      *   Better: Ask about the "Second Backup". Does it matter for the *cause* of *this* outage?
      *   Best: Ask about the *description*. "If we bin the corruption signatures into 'Outage vs. No Outage', does the cause change?" IT says no (variable stability). CT says maybe (event similarity).

  9.  **Simplifications & Honesty:**

      *   Omit: Probabilistic causation (both can handle it, but complicates things).
      *   Omit: Mechanisms (Woodward cares, Lewis less so).
      *   Omit: Normativity (actual cause vs. responsible cause).
      *   Unlearning: Statisticians treat potential outcomes as fixed attributes. Lewis treats counterfactuals as similarity judgments. They need to know Rubin $\neq$ Lewis.

  10. **Review against Constraints:**

      *   Flip chart only? Yes, plan must rely on drawing the case and two columns.
      *   60 mins? Tight. Need strict timing.
      *   Audience fluency? Exploit DAG knowledge but show its limits.
      *   DB Case? Integrated throughout.

  11. **Final Polish:** Ensure the tone is respectful of their expertise but firm on the philosophical distinction. (Self-Correction: Make sure to explicitly warn them that their "Potential Outcomes" are actually closer to Interventionism than Lewisian Counterfactuals, otherwise they will reject the whole distinction as false.)

  *(Self-Correction during drafting)*: I need to be very careful with the term "Counterfactual". In stats, "Counterfactual" = Rubin/Neyman (Potential Outcomes). In Philosophy, "Counterfactual Theory" = Lewis (Similarity of Worlds). The prompt asks for "Counterfactual Theory of Causation" (Philosophy). If I don't distinguish Rubin from Lewis, the session fails. The statisticians will say "We do counterfactuals already." I must clarify: "You do *Interventionist* counterfactuals (Variables). We are talking about *Lewisian* counterfactuals (Events)." This is the key to the "Relata" spine.

  Let's refine the Spine based on this.
  Spine 1: Relata (Events vs. Variables).
  Spine 2: Direction (Token vs. Type).
  This holds up, provided I distinguish Lewis from Rubin immediately.

  Let's build the plan.

  *   **0-5:** Setup & The "Rubin Trap".
  *   **5-15:** The DB Case (Flip Chart).
  *   **15-30:** Lewis (Events/Similarity).
  *   **30-45:** Woodward (Variables/Invariance).
  *   **45-55:** The Collision (Relata & Direction).
  *   **55-60:** The Question & Omissions.

  *Wait, one more check on the DB Case:*
  "Corruption signature that would have been different had the job started a minute later."
  This is perfect for Relata.
  CT: Different signature = Different Event = Maybe different Cause?
  IT: Variable 'Corruption Type' changes value. Relationship invariant?
  "Second backup job was due to start an hour later."
  Perfect for Pre-emption/Type vs Token.
  CT: Did the first backup cause the outage if the second would have done it anyway? (Late Pre-emption).
  IT: Is there an invariant relation between 'Backup Running' and 'Outage'? Yes.

  Okay, ready to write.
answer: |-
  Here is the session plan. It is designed to be executed with a flip chart and marker only.

  ### 1. Validation of the Spine
  Your proposed spine is correct and necessary for this audience, but it requires one critical calibration.
  *   **Relata (Events vs. Variables):** This is the strongest wedge. Statisticians treat variables as primitive. Lewisian counterfactual theory treats *events* (particulars in spacetime) as primitive.
  *   **Direction (Token vs. Type):** This is viable, but you must clarify that "Type" here does not mean "Population Average." It means "Invariant Generalization."
  *   **The Calibration:** You must explicitly distinguish **Lewisian Counterfactuals** (philosophy, events, similarity of worlds) from **Rubin/Neyman Potential Outcomes** (statistics, variables, fixed attributes). Your audience assumes "Counterfactual" means Rubin. If you do not sever this link in the first five minutes, they will reject the distinction as nonsense. The "Counterfactual Theory" you are teaching is Lewis's; the "Interventionist Theory" is Woodward's. Rubin sits much closer to Woodward.

  ### 2. The Case: Load-Bearing Features
  The Database Outage case is excellent because it is logical/procedural, not physical (unlike rocks/windows).
  *   **Load-Bearing:**
      1.  **The Corruption Signature:** This carries the **Relata** argument. Is the effect "The Outage" (binary variable) or "The Outage-with-Signature-X" (specific event)?
      2.  **The Second Backup:** This carries the **Token/Type** argument. It introduces redundancy/pre-emption.
      3.  **The Removed Lock:** This carries the **Intervention** argument. It establishes the *capacity* to manipulate, distinct from the *history* of what happened.
  *   **Decoration (Strip these out):** Specific database technology, exact timestamps (unless relevant to signature), team names. Keep it abstract: Migration ($M$), Backup 1 ($B_1$), Lock ($L$), Outage ($O$).
  *   **What it Fails to Settle:** Normativity (blame). Both theories can describe the cause, but neither tells you who to fire. Acknowledge this early so they don't look for it.

  ### 3. Session Sequence (60 Minutes)

  #### **00:00 – 05:00: The Diagnosis & The Trap**
  *   **Action:** Write "CAUSATION" in the center of the flip chart. Draw a line down the middle. Left: "Counterfactual (Lewis)". Right: "Interventionist (Woodward)".
  *   **Script:** "You use $Y(1) - Y(0)$ and $do(X)$. You call these counterfactuals and interventions. In this room, those are notations for the same engine. In philosophy, they are engines for different vehicles."
  *   **Head Off Misconception 1:** "I am not talking about the Rubin Causal Model. Rubin is actually Interventionist in spirit (variables). The 'Counterfactual Theory' I mean treats causes as *events*, not variable values. If you leave thinking this is just syntax, I have failed."
  *   **Why:** Establishes the stakes. Prevents them from mapping Lewis onto Rubin immediately.

  #### **05:00 – 15:00: The Case (Flip Chart)**
  *   **Action:** Draw the timeline and logic on the chart.
      *   $T_0$: Lock Removed ($L=0$).
      *   $T_1$: Migration Starts ($M$).
      *   $T_2$: Backup 1 Starts ($B_1$). Collision.
      *   $T_3$: Outage ($O$) + Signature ($S$).
      *   $T_4$: Backup 2 Scheduled ($B_2$).
  *   **Constraint:** Do not draw a DAG yet. Describe it narratively.
  *   **Why:** Forces them to hold the complexity in working memory without reducing it to graph structure immediately.
  *   **Load-Bearing:** Emphasize that $S$ (signature) would differ if $B_1$ started one minute later. Emphasize $B_2$ *would* have caused an outage if $B_1$ hadn't.

  #### **15:00 – 30:00: Left Side — Counterfactual Theory (Lewis)**
  *   **Core Concept:** Causation is a relation between *events* ($c$ and $e$), defined by counterfactual dependence across *possible worlds*.
  *   **Action:** Write "Events" and "Similarity" on the Left.
  *   **Application:**
      *   Cause: The *occurrence* of $B_1$ colliding with $M$.
      *   Effect: The *occurrence* of $O$ with Signature $S$.
      *   Test: In the closest possible world where $B_1$ does not collide, does $O$ with Signature $S$ occur?
  *   **Head Off Misconception 2:** "Do not ask me about the probability of $O$. Ask me if *this* event would have happened."
  *   **The Stress Point (The Signature):** Ask: "If $B_1$ started one minute later, $S$ changes. Is it the same effect?"
      *   *Lewisian Answer:* No. It is a distinct event. Therefore, the causal relation might break or change.
  *   **The Stress Point (The Second Backup):** Ask: "If $B_1$ hadn't run, $B_2$ would have caused an outage anyway."
      *   *Lewisian Answer:* (Simplified for time) We look for *dependence*. If $O$ still happens via $B_2$, does $O$ depend on $B_1$? Lewis struggles here (pre-emption). We need chains of dependence.
  *   **Why:** Shows CT is granular. It cares about the *specifics* of the occurrence.

  #### **30:00 – 45:00: Right Side — Interventionist Theory (Woodward)**
  *   **Core Concept:** Causation is an invariant relationship between *variables*. $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$.
  *   **Action:** Write "Variables" and "Invariance" on the Right. **Now** draw the DAG ($L \to B_1$, $B_1 \to O$, etc.).
  *   **Application:**
      *   Cause: Variable $B_1$ (Running/Not Running).
      *   Effect: Variable $O$ (Up/Down).
      *   Test: Is there an intervention on $B_1$ (setting it to 0) that changes $O$, holding $L$ fixed? Yes.
  *   **Head Off Misconception 3:** "This is not just your DAGs. Your DAGs describe structure. Interventionism claims causation *is* the invariance of the structure under intervention. The graph is the map; invariance is the territory."
  *   **The Stress Point (The Signature):** Ask: "If $B_1$ starts one minute later, $S$ changes, but $O$ (Down) is the same."
      *   *Interventionist Answer:* Irrelevant. We defined the variable $O$ as binary. The causal relation holds as long as $B_1 \to O$ is invariant. The grain of $O$ is a choice *we* make, not nature's.
  *   **The Stress Point (The Second Backup):** Ask: "Does $B_2$ matter?"
      *   *Interventionist Answer:* No. We are assessing the type-level relation between $B_1$ and $O$. The existence of $B_2$ is background context. The generalization "Backups during migration cause outages" holds.
  *   **Why:** Shows IT is robust to specific details but dependent on how we define variables.

  #### **45:00 – 55:00: The Collision (The Spine)**
  *   **Action:** Draw arrows between the two columns to show where they disagree.
  *   **Point 1: The Relata (The Carving).**
      *   *CT:* The world comes in events. We discover the cause. (The signature matters).
      *   *IT:* The world comes in stuff; we carve it into variables. We assign the cause. (The signature is a binning choice).
      *   *Flip Chart Note:* "CT: Ontology first. IT: Description first."
  *   **Point 2: The Direction (Token vs. Type).**
      *   *CT:* Starts with *this* outage. Tries to generalize. (Token $\to$ Type).
      *   *IT:* Starts with the *system* (migration protocol). Applies to *this* outage. (Type $\to$ Token).
      *   *Flip Chart Note:* "CT: Singular causation is fundamental. IT: General causation is fundamental."
  *   **Why:** This is the core takeaway. It moves them from "Which math is better?" to "What kind of question am I asking?"

  #### **55:00 – 60:00: Assessment & Omissions**
  *   **The Final Question:** Write this on the board.
      *   *"If we redefine the Outage variable from 'System Down' to 'System Down with Signature S', does the causal claim 'Backup 1 caused the Outage' become stronger, weaker, or stay the same?"*
      *   **Correct Answer:**
          *   Interventionist: "It depends on the invariance of that specific relationship. Usually weaker (less stable)."
          *   Counterfactual: "It becomes more precise (the event is better specified)."
          *   *If they say:* "It's the same, just different conditioning," they have failed. They have collapsed the theories back into statistics.
  *   **Explicit Omissions (The "Unlearning"):**
      1.  **Probabilities:** I presented both as deterministic. Both have probabilistic versions, but that obscures the metaphysical difference.
      2.  **Mechanisms:** Woodward cares about mechanisms (paths); Lewis cares about dependence. I glossed over the "path" vs. "dependence" debate.
      3.  **Rubin vs. Lewis:** You must unlearn that "Potential Outcomes" = "Lewisian Counterfactuals." Rubin is Interventionist. Lewis is Metaphysical.
      4.  **Philosopher Sign-off:** A philosopher would sign off on the distinction but note I have simplified Lewis's "similarity of worlds" (which is notoriously vague) into a simple "event dependence" for clarity.

  ### 4. Anticipated Misconceptions & Interventions

  1.  **"Isn't this just Observed vs. Counterfactual?"**
      *   *When:* Minute 10.
      *   *Fix:* "No. Both theories use counterfactual reasoning. One uses them to compare *events* (Lewis), the other to test *variable invariance* (Woodward)."
  2.  **"Can't I just make the Variable fine-grained enough to match the Event?"**
      *   *When:* Minute 40 (During IT section).
      *   *Fix:* "You can, but Interventionism says *you* chose that grain. Counterfactualism says the event *has* that grain. The cost of the description is paid by the theorist in IT, by the world in CT."
  3.  **"The DAG settles this."**
      *   *When:* Minute 35.
      *   *Fix:* "The DAG is compatible with both. It is the *interpretation* of the nodes (Events vs. Variables) that splits them."

  ### 5. Why the Standard Illustrations Fail Here
  *   **Rocks/Windows:** Implies physical process. Statisticians will model this as force/energy, distracting from the logic/variable distinction.
  *   **Sprinkler/Grass:** Too probabilistic. They will immediately reach for $P(Y|X)$, bypassing the metaphysical definition.
  *   **Barometer/Storm:** Too observational. Doesn't highlight the *intervention* aspect of IT well enough.
  *   **DB Case:** It is *designed*. It highlights that variables (schemas, locks) are human abstractions, which supports the Interventionist claim that causation relies on our description. But the outage is a *happening*, which supports the Counterfactual claim. It forces the Relata disagreement into the open.

  ### 6. Honesty Check
  *   **Simplifications:** I am treating Lewis's theory as if "counterfactual dependence" is sufficient for causation (it isn't, due to pre-emption problems which Lewis tried to solve with chains). I am treating Woodward's theory as if "invariance" is clear-cut (it isn't, degree of invariance is vague).
  *   **Unlearning:** The biggest hurdle is the Rubin/Lewis conflation. If they leave thinking "Potential Outcomes = Lewis," the hour was wasted.
  *   **Philosopher Sign-off:** A philosopher would agree with the Relata and Direction distinction. They might quibble that modern Counterfactual theories (like Humean ones) are closer to variables, but for a 60-minute intro, Lewis vs. Woodward is the canonical contrast.

  ### 7. Flip Chart Layout Plan
  *   **Center:** "CAUSATION" (Split vertically).
  *   **Left Column:** "Counterfactual (Lewis)". Keywords: Events, Particulars, Similarity, Token $\to$ Type.
  *   **Right Column:** "Interventionist (Woodward)". Keywords: Variables, Ranges, Invariance, Type $\to$ Token.
  *   **Bottom:** The DB Timeline (horizontal).
  *   **Top:** The Final Question (revealed at the end).

  This plan uses their technical fluency (DAGs, variables) as the entry point, then pulls the rug out to show the metaphysical commitments underlying that fluency. It respects their time by using a case they understand, but forces them to see it through a lens they don't use.
