answer: |-
  You have put your finger on the exact political nerve of the **Discursive Dilemma** (also known as the **Doctrinal Paradox**). You are correct that the standard literature often stops at identifying the *existence* of the inconsistency, treating it as a theoretical impossibility theorem. What you are describing is the *operational aftermath*: the fact that restoring consistency is **underdetermined** by the votes themselves.

  There is no single, catchy noun phrase (like "The Cobra Effect") that is universally standardized for this specific *movability* of the inconsistency. However, in the field of **Judgment Aggregation Theory**, this is precisely described as the **Underdetermination of the Maximal Consistent Subset**.

  Here is the breakdown of the phenomenon, the existing terminology that borders it, why it lacks a single name, and how it applies to individuals.

  ### 1. The Technical Name: "Resolution Indeterminacy"
  In Judgment Aggregation (the formal study of how groups combine logical judgments), your scenario occurs when a group votes on a set of propositions $\{A, B, C\}$ that are logically interconnected (e.g., $A \land B \rightarrow \neg C$).

  When the majority accepts $\{A, B, C\}$ despite them being jointly inconsistent, the group possesses an **Inconsistent Judgment Set**. To function, the group must select a **Maximal Consistent Subset (MCS)**. In your example, there are three possible MCSs:
  1.  Keep {Hire, Lab Space}, drop {Keep Visiting}.
  2.  Keep {Hire, Keep Visiting}, drop {Lab Space}.
  3.  Keep {Lab Space, Keep Visiting}, drop {Hire}.

  Because the vote counts for each proposition were similar (all "clear majorities"), there is no mathematical way to prefer one MCS over another based *only* on the votes. The choice of which proposition to sacrifice is **logically symmetric**.

  Therefore, the specific phenomenon you are naming is **Resolution Indeterminacy**. The votes determine the *conflict*, but they do not determine the *resolution*.

  ### 2. Why it feels nameless (The Procedural Gap)
  The reason you haven't found a specific name is that the literature treats this state as a **procedural failure** rather than a stable phenomenon.

  The standard solution to the Discursive Dilemma, proposed by scholars like Christian List and Philip Pettit, is to establish a **Priority Structure** *before* voting. You must decide ex ante whether you are using a:
  *   **Premise-Based Procedure:** You vote on the premises (e.g., "Can we afford the lab?"), and the conclusion is derived logically.
  *   **Conclusion-Based Procedure:** You vote on the outcome (e.g., "Do we hire?"), and the premises are ignored if they contradict.

  Your scenario describes a committee that **failed to select an aggregation rule**. Because they voted on everything as if it were equal, they created a **Procedural Vacuity**. The "movability" you observe is the vacuum being filled by whoever holds **Agenda Power**.

  So, while "Discursive Dilemma" names the contradiction, the power dynamic you are describing is **Structural Agenda Control**. It is distinct from standard "agenda manipulation" because no one needs to vote strategically; the structure itself grants the agenda-setter the power to decide which logical constraint "bites."

  ### 3. Relation to Arrow and Other Paradoxes
  *   **Vs. Arrow's Impossibility Theorem:** Arrow deals with *preferences* (rankings: $A > B > C$). Your scenario deals with *judgments* (truth values: $A$ is True, $B$ is True). Arrow shows you can't aggregate preferences fairly; Judgment Aggregation shows you can't aggregate truth-claims consistently without a priority rule.
  *   **Vs. Condorcet Cycling:** Cycling is $A > B$, $B > C$, $C > A$. It creates a loop. Your scenario creates a **contradiction** ($A$, $B$, and $\neg(A \land B)$). Cycling prevents a winner; Contradiction prevents a coherent plan.
  *   **Vs. Path Dependence:** This is the closest cousin. Path dependence means the order of voting changes the outcome. In your case, the order of *repair* changes the outcome. If the chair says, "Let's vote on which one to drop first," the first one dropped is saved. This is **Repair Path Dependence**.

  ### 4. Does this happen to individuals? (The Intrapersonal Edge)
  Yes. This is not just a group phenomenon. It is the structural skeleton of **Cognitive Dissonance Reduction**.

  An individual often holds a set of beliefs $\{A, B, C\}$ that are jointly inconsistent (e.g., "I value health," "I smoke," "Smoking harms health"). To restore consistency, they must reject one.
  *   **The Movability:** Logically, they could quit smoking (drop $B$), decide health doesn't matter (drop $A$), or deny the science (drop $C$).
  *   **The Fix Point:** Which one gets dropped is not decided by logic, but by **Centrality**. The belief most central to their identity becomes the "fixed point," and the periphery is sacrificed.
  *   **The Indeterminacy:** If two beliefs have equal centrality (equal "vote strength"), the resolution is arbitrary. This is **Underdetermined Belief Revision**.

  In individuals, we call this **Rationalization**. The "agenda setter" is the subconscious drive to minimize psychological pain. Just like in your committee, the person doesn't change their mind strategically; they simply let the "framing" of the immediate situation decide which belief gets sacrificed.

  ### 5. Coining the Term
  If you need a label to use in conversation or writing that captures the "shoving" aspect specifically, I propose:

  **The Symmetry of Logical Repair**

  *   **Definition:** A situation where a set of collectively endorsed propositions is inconsistent, and multiple distinct subsets exist that restore consistency with equal fidelity to the original endorsements.
  *   **The Edge:** It stops where **Priority Rules** begin. If the committee had a rule saying "Budget constraints always override hiring desires," the symmetry breaks, and the phenomenon disappears.
  *   **The Consequence:** It transforms **Logical Necessity** into **Political Contingency**. The "truth" of the group's position is not found in the votes, but in the procedure used to fix the votes.

  ### Summary
  You are describing the **Resolution Indeterminacy** inherent in the **Discursive Dilemma** when no **Priority Structure** is in place. The "movability" is the **Symmetry of Logical Repair**, and the power to decide the outcome is **Structural Agenda Control**. It applies equally to individuals as **Underdetermined Belief Revision**.

  The reason it bugs you is that it reveals a hidden truth: **Consistency is not a discovery; it is a construction.** The committee didn't *find* their position; they *built* it by choosing which contradiction to ignore.
