prompt: |-
  Carnap's philosophy contains a tension that I would like to have explained. He was a non-cognitivist about value judgments: sentences that ascribe value or prescribe conduct do not state anything true or false, and their function is expressive or practical rather than descriptive. Yet he was also a socialist who took seriously the thought that the economic and social order can be planned, and whose principle of tolerance assigns the choice between rival frameworks to convention and practical decision rather than to truth. Please explain the conceptual issue that this combination raises — not by surveying what commentators have said, but by working out where the pressure actually lies.

  I am especially interested in one suggestion, and want you to explain what follows from it: that we transpose Carnap's own distinction between questions internal to a framework and the external question of which framework to adopt from the domain of ontology to the domain of practice, so that the question whether a given arrangement is unjust becomes internal and answerable, while the question which evaluative framework to adopt becomes external and settled by decision or convention. Explain the consequences for the coherence of Carnap's position. In particular: must the internal questions of morality be truth-apt for the analogy to do any work, and if so, does that compromise his non-cognitivism? What is the status of the socialist's advocacy once ultimate ends are placed outside the domain of truth — a proposal, a prediction, an expression of attitude, or something else? And does the notion of rational planning presuppose a standard of success that non-cognitivism is unable to supply?

  Lay out the issue rather than settling it, and make clear at each step which of Carnap's commitments is doing the work. No citations needed.
reasoning: |-
  Here's a thinking process that leads to the explanation of the tension in Carnap's philosophy:

  1.  **Deconstruct the Prompt:**

      *   **Core Tension:** Carnap is a non-cognitivist about ethics (value judgments aren't true/false, they are expressive/imperative) *but* he is a committed socialist who believes in rational social planning and advocates for the Principle of Tolerance (choice of frameworks is conventional/practical, not factual).
      *   **Specific Task:** Explain the conceptual pressure/issue arising from this combination. Do not survey commentators; work out the logic.
      *   **Specific Focus:** Explore the suggestion of transposing the *Internal/External* distinction (from ontology to practice).
          *   *Internal:* Is a specific arrangement unjust? (Answerable within a framework).
          *   *External:* Which evaluative framework to adopt? (Decision/Convention).
      *   **Key Questions to Address:**
          1.  Must internal moral questions be truth-apt for the analogy to work? If so, does this compromise non-cognitivism?
          2.  What is the status of socialist advocacy if ultimate ends are non-cognitive (proposal, prediction, expression)?
          3.  Does rational planning presuppose a standard of success that non-cognitivism cannot supply?
      *   **Constraint:** Lay out the issue rather than settling it. Make clear which commitment is doing the work at each step. No citations.

  2.  **Initial Mapping of Carnap's Commitments:**

      *   *Commitment A (Empiricism/Non-Cognitivism):* Cognitive meaning requires empirical verification or logical truth. Ethical statements fail this test. They are volitions/commands in disguise.
      *   *Commitment B (Socialism/Planning):* Society can and should be organized rationally to achieve certain ends (equality, welfare, etc.).
      *   *Commitment C (Principle of Tolerance):* There is no "correct" logic or language framework, only more or less useful ones. Choice is pragmatic.
      *   *Commitment D (Internal/External Distinction):* Internal questions (within a framework) have answers (true/false). External questions (choice of framework) are practical decisions.

  3.  **Analyzing the Transposition Strategy (Ontology $\to$ Ethics):**

      *   *The Move:* Treat an ethical system like a linguistic framework.
      *   *Internal:* "Is slavery wrong?" $\to$ Within the framework of Liberal Humanism, yes. This looks truth-apt *relative to the framework*.
      *   *External:* "Should we adopt Liberal Humanism?" $\to$ This is a practical decision, not a truth claim.
      *   *The Pressure:* Carnap's non-cognitivism says value sentences *simpliciter* lack truth values. If internal ethical questions *have* truth values (relative to a framework), is this compatible with non-cognitivism?
      *   *Carnap's Ontology Case:* "Is there a number 5?" Internal: Yes (true). External: Shall we use a number framework? (Decision).
      *   *Carnap's Ethics Case:* "Is slavery unjust?" Internal: Yes (true *within framework*). External: Shall we use a justice framework? (Decision).
      *   *Conflict:* If internal ethical statements are "true," Carnap seems to be conceding cognitivism *within* the framework. But his non-cognitivism is usually global regarding ethics. He needs to explain why "There are numbers" is cognitively meaningful internally, but "Slavery is wrong" is not, even internally.
      *   *Refinement:* In ontology, internal statements are analytic or empirical. In ethics, what makes an internal statement true? If it's just definition ("Wrong means X, Slavery is X"), it's analytic. But does that capture the *normative* force?

  4.  **Addressing the Specific Questions:**

      *   *Q1: Must internal questions be truth-apt?*
          *   If the analogy holds, internal questions must behave like internal ontological questions. In ontology, they are truth-apt. So, internal ethical judgments must be truth-apt *relative to the framework*.
          *   *Compromise?* It softens non-cognitivism. It becomes "Non-cognitivism about ultimate frameworks, Cognitivism about derived norms." But Carnap often suggests ethical sentences *never* assert facts. If they assert facts relative to a framework, is that enough to save the view? Or does it admit that ethics *can* be cognitive, just conditional?
          *   *Work:* Commitment A (Non-cognitivism) vs. Commitment D (Internal/External Distinction).

      *   *Q2: Status of Socialist Advocacy?*
          *   If ultimate ends (Socialism) are external choices, advocating for them isn't stating a truth.
          *   Is it a *prediction*? (Socialism will bring happiness). Carnap allows empirical claims.
          *   Is it an *expression*? (I prefer Socialism). This fits non-cognitivism.
          *   Is it a *proposal*? (Let's adopt this framework). This fits the Principle of Tolerance.
          *   *The Pressure:* If advocacy is just "I prefer this," why *plan*? Planning implies objective optimization. If the target is subjective, "planning" is just "efficiently satisfying my whim." Does "rational planning" require an objective telos?
          *   *Work:* Commitment B (Planning) vs. Commitment A (Non-cognitivism).

      *   *Q3: Rational Planning and Standards of Success?*
          *   Planning implies means-ends rationality.
          *   If ends are non-cognitive (decisions), rationality applies only to means.
          *   But social planning often involves weighing conflicting ends (liberty vs. equality).
          *   If there is no truth about which end is better, how is the plan "rational" rather than just "consistent"?
          *   Carnap needs a standard of "fruitfulness" or "efficiency." But efficiency *for what*? If the "what" is arbitrary, the rationality is thin.
          *   *Work:* Commitment B (Planning) vs. Commitment C (Tolerance/Convention).

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* Set the stage. Define the tension between the *emotivist/non-cognitivist* stance on ethics and the *rationalist/planner* stance on politics.
      *   *Section 1: The Transposition Strategy.* Explain how the Internal/External distinction works in ontology (numbers) and how it maps to ethics (justice).
      *   *Section 2: The Truth-Aptness Problem.* Analyze whether internal ethical claims can be "true." If they are analytic (definitions), do they lose normative bite? If they are synthetic, where is the empirical content? This pressures Non-Cognitivism.
      *   *Section 3: The Status of Advocacy.* If socialism is an external choice, what is Carnap doing when he argues for it? He can't say it's "True." He must say it's "Expedient" or "Preferred." But this risks reducing politics to marketing or engineering without a goal.
      *   *Section 4: Rational Planning.* Planning requires optimization. Optimization requires a metric. If the metric (value) is non-cognitive, can there be a *rational* choice between frameworks? Or just a *volitional* one? This pressures the Principle of Tolerance and the idea of Rational Planning.
      *   *Conclusion:* Summarize the instability. The system holds only if "rationality" is stripped down to instrumental efficiency, but social planning seems to demand more.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Am I citing commentators? No.
      *   *Check:* Am I settling it? No, I need to lay out the pressure points.
      *   *Check:* Am I clear on which commitment is clashing?
          *   *Clash 1:* Non-cognitivism vs. Internal Truth (Ontology analogy).
          *   *Clash 2:* Non-cognitivism vs. Rational Planning (Need for objective standards).
          *   *Clash 3:* Tolerance vs. Socialist Conviction (Why this framework?).
      *   *Nuance:* Make sure to distinguish between *means* (empirical, truth-apt) and *ends* (volitional, non-cognitive). Carnap's standard move is to say science handles means, volition handles ends. The pressure is on whether "planning" can be purely about means when the ends are structural (social order).

  7.  **Final Polish:** Ensure the tone is analytical and philosophical. Use the terminology provided (Internal/External, Truth-Apt, Non-Cognitivism, Rational Planning). Ensure the distinction between *ontological* frameworks and *practical/evaluative* frameworks is clear. (Self-correction: Ensure I don't accidentally attribute cognitivism to Carnap; keep it as a tension *within* his view).

  8.  **Final Review against constraints:**
      *   Explain conceptual issue? Yes.
      *   No commentator survey? Yes.
      *   Focus on Internal/External transposition? Yes.
      *   Address Truth-Aptness? Yes.
      *   Address Status of Advocacy? Yes.
      *   Address Rational Planning/Standards? Yes.
