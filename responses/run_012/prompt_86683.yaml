answer: |-
  The tension you identify arises from the friction between Carnap's **logical empiricist semantics** (which restricts cognitive meaning to the analytic and the empirically verifiable) and his **pragmatic political engagement** (which assumes social structures can be rationally designed to achieve human welfare). To explain the pressure without settling it, we must trace how the machinery of his philosophy functions when shifted from the philosophy of mathematics to the philosophy of action.

  ### 1. The Transposition: From Ontology to Practice

  Carnap's **Principle of Tolerance** and his **Internal/External distinction** were originally designed to dissolve ontological disputes.
  *   **Commitment 1 (Semantic Verificationism):** Statements are cognitively meaningful only if they are logically analytic or empirically testable.
  *   **Commitment 2 (Internal/External Distinction):** Questions *internal* to a linguistic framework (e.g., "Is there a prime number greater than 100?") are answerable by the rules of the framework (true/false). Questions *external* to the framework (e.g., "Shall we adopt a framework that includes numbers?") are not theoretical questions but practical decisions regarding the utility of the language.

  The suggestion is to transpose this structure onto ethics and politics.
  *   **Internal Ethical Question:** "Is this specific wage arrangement unjust?"
  *   **External Ethical Question:** "Shall we adopt a framework of justice that prioritizes equality over liberty?"

  **The Conceptual Pressure:**
  In the ontological case, internal questions are truth-apt because they are governed by logical or empirical rules. For the transposition to work, internal ethical questions must also be truth-apt *within the chosen framework*. If "Slavery is unjust" is to function like "5 is a number," it must have a truth value derived from the rules of the ethical framework.

  However, this presses against **Commitment 1 (Non-Cognitivism)**. Carnap's standard view is that value judgments *as such* are disguised imperatives or expressions of emotion; they lack truth conditions entirely. If we allow that internal ethical statements are truth-apt (even if only relative to a framework), we are conceding that ethical language *can* function cognitively.

  *   **The Dilemma:** If internal ethical statements are *not* truth-apt, the analogy to ontology fails, because internal ontological statements *are* truth-apt. If internal ethical statements *are* truth-apt, Carnap's global non-cognitivism about value is compromised. He would have to argue that ethical statements are analytic truths relative to a framework (e.g., "Given definition D of justice, arrangement A is unjust"). But analytic truths in ethics often lack the normative force to guide action, reducing "injustice" to a mere classification error rather than a reason for change.

  ### 2. The Status of Socialist Advocacy

  If we accept the transposition, the choice of the ultimate ethical framework (Socialism vs. Capitalism) is an **External Question**. According to **Commitment 2**, external questions are settled by convention, decision, or pragmatic utility, not by truth.

  This raises the question: What is Carnap doing when he advocates for socialism?
  *   **Commitment 3 (Socialist Planning):** Social order can and should be planned to improve human conditions.
  *   **Commitment 1 (Non-Cognitivism):** Ultimate ends are not matters of fact.

  If the choice of socialism is an external decision, Carnap's advocacy cannot be an assertion of truth. It must take one of the following forms:
  1.  **A Prediction:** "Socialism will produce more happiness." This is cognitively meaningful (empirical), but it only addresses *means*, not *ends*. It presupposes that happiness is the goal, which itself is an external decision.
  2.  **An Expression of Attitude:** "I prefer socialism." This fits Non-Cognitivism but renders the advocacy subjective. It explains why *Carnap* is a socialist, but not why socialism is *rationally preferable* for anyone else.
  3.  **A Proposal:** "Let us adopt the socialist framework." This fits the Principle of Tolerance.

  **The Conceptual Pressure:**
  If advocacy is merely a **Proposal**, the force of the argument relies entirely on the *benefits* of adopting the framework. But to demonstrate benefits, one must measure them against a standard. If the standard (e.g., "human welfare") is itself part of the framework being proposed, the argument becomes circular. If the standard is outside the framework, it must be a fact (violating Non-Cognitivism) or another arbitrary decision (leading to an infinite regress of frameworks).

  Consequently, the socialist's advocacy risks becoming a form of **rhetorical engineering**. Carnap can show that *if* you want X, socialism is the means. But he cannot cognitively argue that you *should* want X. This creates a gap between the **rationality of the plan** and the **arbitrariness of the goal**.

  ### 3. Rational Planning and Standards of Success

  This leads to the deepest pressure point: the notion of **Rational Planning**.
  *   **Commitment 3 (Socialist Planning):** Implies that social arrangements can be optimized. Optimization requires a metric of success.
  *   **Commitment 1 (Non-Cognitivism):** Denies that value metrics can be objectively true or false.

  In Carnap's ontology, we choose a framework based on "expediency" or "fruitfulness." These are pragmatic virtues. In social planning, "fruitfulness" translates to "social welfare" or "justice."

  **The Problem of the Metric:**
  To plan rationally is to select the most efficient means to an end. However, complex social planning involves trade-offs between competing values (e.g., security vs. freedom). Resolving these trade-offs requires a higher-order standard to weigh the values.
  *   If this higher-order standard is **factual** (e.g., "Freedom objectively contributes more to human flourishing"), Carnap violates **Non-Cognitivism**.
  *   If this higher-order standard is **volitional** (e.g., "We decide to prioritize freedom"), then the "rationality" of the plan is purely instrumental. It is rational only in the sense of being logically consistent with a chosen whim.

  **The Conceptual Pressure:**
  Does "Rational Planning" presuppose a standard of success that **Non-Cognitivism** is unable to supply?
  If the choice of framework is purely conventional (per the **Principle of Tolerance**), then a fascist framework could be just as "valid" as a socialist one, provided it is internally consistent and its proponents decide to adopt it. Carnap clearly rejects this, implying that some frameworks are *better* than others.
  *   If "better" means "more true," he abandons Tolerance and Non-Cognitivism.
  *   If "better" means "more useful," he must define "useful." If "useful" means "satisfies human needs," he is making an empirical claim (which is allowed), but he must also claim that satisfying human needs is *good*. That final step—moving from "satisfies needs" to "ought to be pursued"—is where Non-Cognitivism blocks the move.

  ### Summary of the Tension

  The coherence of Carnap's position relies on a delicate balance between three commitments that pull in opposite directions when applied to politics:

  1.  **Non-Cognitivism** insists that ultimate values are not truth-apt.
  2.  **The Internal/External Distinction** (transposed) suggests that while specific judgments might be framework-relative truths, the framework itself is a decision.
  3.  **Rational Planning** implies that some social decisions are objectively more reasonable than others.

  **The Unresolved Issue:**
  The pressure lies in whether **pragmatic utility** can do the heavy lifting required to replace **moral truth**.
  *   If internal moral questions are truth-apt, Non-Cognitivism is weakened to a form of relativism.
  *   If internal moral questions are not truth-apt, the analogy to ontology breaks, and social planning loses its claim to rationality, becoming merely the efficient organization of subjective preferences.
  *   If the choice of framework is a matter of convention (Tolerance), Carnap lacks the philosophical resources to condemn rival frameworks as *wrong*, only as *inconvenient for his purposes*.

  Thus, the socialist advocacy stands in a precarious position: it is a **proposal** grounded in **empirical predictions** about human welfare, but it rests on a **volitional foundation** that it cannot rationally justify without stepping outside the bounds of Carnap's own empiricist constraints. The system remains coherent only if one accepts that "rationality" in social planning is strictly limited to instrumental efficiency, leaving the ultimate ends of that planning to non-rational decision. Whether this thin conception of rationality is sufficient for a committed socialist is the core of the tension.
