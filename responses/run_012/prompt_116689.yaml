answer: |-
  Your hypothesis is astute, but it identifies a symptom rather than the underlying pathology. The distinction between "modal status" (truth in a possible world) and "availability of a route" (cognitive access) does track the divide between the two camps, but diagnosing the stalemate as merely verbal or equivocal underestimates the structural conflict between **formal conservation** and **metaphysical fidelity**.

  Here is the diagnosis you requested, engaging the specific positions and the formal constraints you outlined.

  ### 1. Testing the Hypothesis: Equivocation or Methodological Clash?

  You suggest the stalemate arises because one side reads "knowable" as a modal operator ($\Diamond K$) ranging over worlds, while the other reads it as a procedural capacity. If this were purely verbal, clarifying the definition should dissolve the disagreement. It does not.

  **The Restrictionists (Tennant, Edgington, Hand)** largely adopt your "route" reading. Neil Tennant's restriction to "Cartesian" propositions (those consistent with being known) is explicitly motivated by the idea that knowledge requires a verification procedure that does not contradict the truth of the proposition. Dorothy Edgington's use of the actuality operator ($A p \to \Diamond K A p$) attempts to model a situation where a thinker in a counterfactual world knows a truth about the *actual* world. For them, "knowable" implies the existence of a coherent cognitive route. On this reading, Fitch propositions ($p \land \neg Kp$) are not "truths" in the anti-realist sense because no such route exists; thus, restricting them is principled, not *ad hoc*.

  **The Collapse Advocates (Williamson, Percival, Hart)** largely adopt your "modal status" reading, but their objection is not merely semantic. Timothy Williamson grants that the anti-realist might intend the "route" reading. His objection is that once you formalize "route" into a logical operator to test for consistency, you inevitably treat it extensionally enough for the paradox to re-emerge, or intensionally enough that the principle becomes trivial.

  The disagreement is not just about what "knowable" *means*, but about **what formalization owes to the metaphysics**.
  *   The Restrictionist claims the formalization must bend to capture the metaphysical intuition (that truth is constituted by verification).
  *   The Collapse Advocate claims the metaphysical intuition must bend to satisfy the formal constraints (that logical operators must behave consistently across contexts).

  Therefore, it is not a verbal dispute. It is a **categorial mismatch**: The anti-realist is proposing a metaphysical thesis about the constitution of truth, while the formal epistemologist is testing it as a logical schema. The "equivocation" is on the **domain of quantification**. The anti-realist quantifies over *verifiable contents*; the logician quantifies over *propositions simpliciter*. The stalemate persists because neither side can force the other to accept their domain restriction without begging the question.

  ### 2. The Substantive Disagreement: The Triviality Objection

  Beneath the semantic disagreement lies a genuine substantive dispute about the **strength of the principle**. This is where your "hidden formal question" resides.

  The Collapse Advocate's core charge is not that the restriction is *ad hoc*, but that it is **trivializing**. If you restrict the Knowability Principle (KP) to propositions that are not Fitch-conjunctions (or Cartesian propositions), does the resulting principle still do the work anti-realism requires?
  *   Anti-realism intends to rule out evidence-transcendent truths.
  *   If the restriction excludes all propositions where evidence might theoretically fail to obtain (to avoid paradox), does the principle still rule out evidence-transcendence, or does it merely define it away?

  **The Substantive Question:** *Can a restriction class $C$ be defined such that:*
  1.  *$C$ excludes Fitch-conjunctions (blocking collapse).*
  2.  *$C$ includes all propositions the anti-realist intuitively regards as truth-apt (preserving strength).*
  3.  *$C$ is not defined in terms of knowledge itself (avoiding circularity).*

  **Diagnosis:** The sides disagree on whether condition (2) is satisfiable.
  *   **Tennant** argues yes: We can identify Cartesian propositions via syntactic or proof-theoretic criteria independent of specific knowledge claims.
  *   **Williamson** argues no: Any class broad enough to cover ordinary contingent truths will either generate a new paradox (instability) or be so narrow that the anti-realist cannot use KP to motivate intuitionistic logic over classical logic.

  This is not verbal. It is a disagreement about the **topology of logical space**. The Collapse Advocate sees the set of "knowable truths" as topologically disconnected from the set of "all truths" in a way that makes the bridge principle (KP) useless. The Restrictionist sees the "unknown truths" as a logical artifact, not a genuine region of space.

  ### 3. The Hidden Formal Question: Stability and Strength

  You asked whether the question *"Can any restriction preserve both non-collapse and the strength the anti-realist needs?"* is well-posed.

  **Verdict:** It is well-posed, but current formal tools are insufficient to settle it definitively because the metric for "strength the anti-realist needs" is not formalized.

  **What a Settling Result Would Look Like:**
  A theorem settling this would not be a derivation within standard modal logic (which assumes the very extensionality that generates the paradox). It would be a **meta-logical result concerning hyperintensional frameworks**.
  *   **Current State:** We have results showing that many restrictions (e.g., restricting to atomic propositions) fail to derive the intuitionistic logic the anti-realist wants (Brogaard & Salerno). We have results showing that other restrictions lead to "modal collapse" in higher-order logics.
  *   **Required Result:** A proof demonstrating that there exists a class $C$ and a hyperintensional operator $K^*$ such that $\forall p \in C (p \to \Diamond K^* p)$ is consistent, non-trivial (does not entail $\forall p \in C (p \to K^* p)$), and sufficient to derive the semantic constraints anti-realists use to reject bivalence.

  **Why this is hard:** The "strength" condition is the bottleneck. Anti-realists need KP to justify the rejection of the Law of Excluded Middle (LEM). If the restricted KP is too weak to invalidate LEM for the relevant class of propositions, the anti-realist wins the logical battle (no omniscience) but loses the war (cannot motivate intuitionism). The Collapse Advocate suspects no such class exists. The Restrictionist suspects it does but requires a finer-grained logic than standard epistemic modal logic provides.

  ### 4. Diagnosis of the Stalemate

  The literature repeats because both sides are fighting on a terrain chosen by the other.
  *   **Restrictionists** accept the formal challenge but try to solve it by tweaking the antecedent (restricting $p$). The Collapse Advocates reply that every tweak looks like a gerrymander to save the principle.
  *   **Collapse Advocates** accept the metaphysical challenge but try to solve it by tweaking the consequence (accepting omniscience or abandoning anti-realism). The Restrictionists reply that this misunderstands the nature of truth.

  **The Real Equivocation:** It is on the word **"Principle."**
  *   For the **Formal Epistemologist**, KP is a **logical axiom**. It must hold universally or be discarded. Restrictions are modifications of the logic.
  *   For the **Anti-Realist**, KP is a **manifestation constraint**. It is a thesis about what it is to grasp a meaning. It is not necessarily a universal quantification over propositions, but a constraint on *assertibility*.

  The stalemate persists because the Formal Epistemologist demands a universal quantifier to test consistency, while the Anti-Realist knows that universal quantification over "all truths" is precisely what their metaphysics forbids (since "truth" is not a uniform property across all discourse).

  ### 5. What Counts as Progress?

  Given this diagnosis, a new formal theorem within standard modal logic will not break the deadlock. It will only produce another restriction and another charge of *ad hoc*-ness. Progress requires one of the following three shifts:

  **A. Reformulation of the Thesis (The Dummettian Shift)**
  Progress would look like abandoning the **Knowability Principle** ($\forall p (p \to \Diamond K p)$) entirely in favor of a **Rule of Inference** or a **Semantic Constraint**.
  *   Instead of asserting a connection between truth and knowledge, assert that *meaning is constituted by use*.
  *   *Concrete Step:* Shift the debate from "Is KP true?" to "Does the rejection of bivalence follow from the manifestation requirement without invoking KP?" If anti-realism can be grounded without the universal quantifier, Fitch's paradox becomes irrelevant to the core metaphysical commitment.

  **B. Hyperintensional Semantics (The Formal Shift)**
  Progress would look like a formal framework where the substitution of logical equivalents (which drives the Fitch derivation) is blocked without appearing *ad hoc*.
  *   *Concrete Step:* Develop a situation semantics or truth-maker semantics where $p$ and $p \land \neg Kp$ are not treated as having the same modal profile regarding knowability. A result showing that in a hyperintensional logic, the derivation of omniscience fails *without* restricting the domain of $p$ would be decisive. It would show the paradox relies on extensional assumptions incompatible with anti-realist metaphysics.

  **C. Clarification of "Strength" (The Methodological Shift)**
  Progress would look like a precise definition of the "strength the anti-realist needs."
  *   *Concrete Step:* A consensus on exactly which classical theorems the anti-realist must be able to reject using KP. If it can be shown that *any* restriction sufficient to block Fitch also preserves the rejection of LEM for undecidable sentences, the Collapse Advocate's "triviality" objection fails. If it can be shown that *no* such restriction exists, the Restrictionist must abandon the logical motivation for anti-realism.

  ### Summary Diagnosis

  Your hypothesis is correct that there is an equivocation, but it is not merely on "knowable." It is on the **logical form of the anti-realist commitment**.
  *   **Camp 1** treats anti-realism as a claim about the **extension of the truth predicate**.
  *   **Camp 2** treats anti-realism as a claim about the **intension of the concept of truth**.

  Fitch's paradox is an extensional hammer. It will always break intensional nails if you try to drive them in with it. The dispute repeats because Restrictionists keep trying to strengthen the nail (restricting the domain), while Collapse Advocates keep swinging the hammer harder (proving triviality).

  **Progress** will not come from a better restriction. It will come from **changing the tool**. Either anti-realism must be reformulated without the universal knowability principle (returning to Dummett's manifestation arguments), or formal epistemology must adopt a hyperintensional framework where the substitution principles required for Fitch's proof are not valid. Until one of these structural shifts occurs, the debate will remain a stable equilibrium of mutual incomprehension.
