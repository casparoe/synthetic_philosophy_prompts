      *   **Paternalism:** Denying the option restricts autonomy. However, autonomy requires understanding. If the understanding is metaphysically contested, can autonomy be exercised?
      *   **Advance Directives:** Usually apply to *treatment* of the *same* body/person. This procedure creates a *different* ontological status. The analogy is weak because ADs protect the *existing* patient's interests, not a *future* entity's existence.
