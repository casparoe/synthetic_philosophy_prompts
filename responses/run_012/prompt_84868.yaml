answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** Chair, Clinical Ethics Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Brain-Preservation Protocol Recruitment

  **Recommendation**
  I recommend that the Committee **not approve** the current recruitment protocol. We should offer the sponsoring organization an opportunity to revise the consent documents and procedural descriptions to meet specific ethical conditions. If they cannot meet these conditions by **December 15, 2023**, the proposal should be rejected permanently.

  **The Core Conflict: Informed Consent**
  Our primary obligation is to ensure consent is informed. Currently, the sponsor describes the outcome as "survival," while our neurologists describe it as "death." These are not compatible medical descriptions. A patient cannot consent to a procedure if the fundamental nature of the outcome is contested by the very experts facilitating it. To allow both descriptions in the room is to invite confusion, not clarity. It transforms consent into a wager on metaphysics rather than a medical authorization.

  **Autonomy and Paternalism**
  The strongest argument for immediate approval is respect for autonomy. These patients face imminent death. To withhold this option is arguably paternalistic—protecting them from a choice they have the right to make. If a patient understands they will biologically die but wishes to preserve their connectome for the *possibility* of future reconstruction, denying that wish treats them as incapable of weighing existential risks.

  However, autonomy requires a coherent object of choice. Standard medical consent assumes the patient is the beneficiary of the procedure. Here, the biological patient certainly dies. The putative beneficiary is a future digital or reconstructed entity. This is not a treatment decision; it is a decision to terminate one life to potentially instantiate another. We cannot validate that the *patient* benefits, because the patient does not exist to experience the benefit. Therefore, this is not purely a matter of protecting the patient's autonomy, but of regulating the creation of a successor.

  **The Advance Directive Analogy**
  Proponents argue this is analogous to an advance directive (AD), where a competent person's prior decision governs later care when they are incompetent. This analogy fails. An AD protects the welfare and values of the *continuing* patient (e.g., refusing burdensome ventilation). It does not authorize procedures that end the patient's biological life to create a new entity.

  In standard AD cases, the subject who decides and the subject who undergoes the treatment are the same. In this protocol, the subject who decides (the dying patient) ceases to exist, and the subject who might "wake up" (the reconstruction) is ontologically distinct. If we treat this as an AD, we imply the reconstruction *is* the patient. But consider the "branching" case: if the data is used to create two reconstructions, or one reconstruction while the body is kept biologically alive via life support, we have two distinct subjects claiming the same identity. Both cannot be the original patient. This proves that "survival" is not a biological continuity we can medically verify, but a philosophical claim. We cannot base medical consent on a claim that fractures under basic logical testing.

  **Conditions for Re-Submission**
  We may approve a revised protocol only if the following conditions are met:

  1.  **Consent Language:** The consent document **may not** assert that the patient will survive, wake up, or continue to exist. It must state clearly that the procedure results in biological death. It may describe the *intent* of the organization to reconstruct a person based on the data, but this must be framed as a hope or a research goal, not a medical outcome.
  2.  **The "Two-Description" Rule:** If the family or patient requests it, they may hear the organization's view. However, the medical witness must explicitly state: "Medically, this procedure causes death. Any claim of survival is not supported by current medical science." Both statements must be documented in the chart.
  3.  **Authorization Scope:** Consent must be framed as **post-mortem tissue donation** with experimental processing, not as a treatment for the patient. This clarifies that the authorizing subject is consenting to the disposal of their remains in a specific way, not to their own continuation.
  4.  **Proxy Authority:** If the patient loses capacity before the procedure, a proxy may *not* authorize this procedure unless the patient's prior written directive explicitly specified this method of disposition. A proxy cannot decide to end a life to create a successor; only the patient can decide how their remains are used.

  **What We Owe the Family**
  We owe the family honesty about the irreversibility of the act. We must not allow them to feel that choosing this is "saving" their loved one in a medical sense. If a patient, having heard both descriptions (medical death vs. organizational survival), still wishes to proceed, we must honor their wish to donate their brain for this purpose, provided they sign a waiver acknowledging they understand the medical consensus is that they will die.

  However, we cannot validate the survival claim. Our role is to ensure they are not buying a false hope, but rather making a clear-eyed choice to sacrifice their biological remainder for a speculative future.

  **Action Item**
  Please review these conditions. If the Committee agrees, I will convey the December 15 deadline to the sponsor. If they agree to the language restrictions, we vote on the revised protocol in January. If they insist on the term "survival," we must vote to deny access to our patients.

  **Chair's Signature**
