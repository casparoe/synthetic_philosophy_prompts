answer: |-
  Reject any signal that a candidate lacking the capacity for long-horizon risk could afford to produce without ruin.

  ### The Decision Procedure

  1.  **The Differential Cost Test:** Calculate the signal's cost not in absolute terms (dollars, years) but as a proportion of the candidate's total available capital (financial, reputational, psychological).
      *   *Sufficient Answer:* The signal represents a significant fraction of a low-capacity candidate's resources but a manageable fraction of a high-capacity candidate's resources.
      *   *Judgment Call:* Estimating the candidate's "total capital" is impossible from a file; reviewers must infer this from career stage and prior support.

  2.  **The Commonality Test:** Determine the frequency of this signal within the applicant pool.
      *   *Sufficient Answer:* The signal is rare enough that possessing it correlates with the top decile of applicants.
      *   *Judgment Call:* Reviewers rarely see the full pool; you must provide them with aggregate data on credential frequency.

  3.  **The Binding Test:** Determine if the signal is an *index* (causally bound to the trait, e.g., a breakthrough publication) or a *handicap* (chosen expenditure, e.g., turning down safe employment).
      *   *Sufficient Answer:* Indices are accepted as honest even if cheap; handicaps are accepted only if they pass the Differential Cost Test.
      *   *Judgment Call:* Distinguishing a genuine index from a fabricated one requires technical expertise you said your reviewers lack; rely on external validation (citations, awards) as a proxy.

  4.  **The Alignment Test:** Assess whether the candidate's incentives align with the foundation's goals.
      *   *Sufficient Answer:* If incentives align (e.g., both want published results), cheap signals (promises) are accepted. If incentives diverge (e.g., candidate wants career safety, foundation wants risk), only costly signals are accepted.
      *   *Judgment Call:* Assessing "incentive alignment" is purely speculative based on a proposal text.

  ### Theoretical Simplifications

  **Settled Consensus:**
  *   **Differential Cost:** Absolute cost conveys no information; only marginal cost relative to quality ensures honesty.
  *   **Pool Frequency:** A signal possessed by everyone conveys zero information, regardless of its absolute cost.
  *   **Interest Alignment:** Where interests overlap, cheap talk is stable; where they conflict, costly signaling is required.

  **Genuinely Contested:**
  *   **Efficiency at Equilibrium:** Whether honest signals must remain wasteful at evolutionary equilibrium is debated (Zahavi vs. Grafen). For your purposes, assume waste is not required, but differential burden is.
  *   **Index Stability:** Whether indices can be faked over long timeframes is contested. For your purposes, treat verified past performance as an index.

  **Dropped Distinctions:**
  *   **Equilibrium Waste:** I have dropped the instruction to look for "waste." At equilibrium, high-quality signalers optimize cost. Looking for waste punishes efficiency. Look only for differential burden.
  *   **Silent Signaling:** The theory that "the strongest candidates signal least" is dropped. You are selecting from *applicants*. A non-signaler in a applicant pool is indistinguishable from a low-quality candidate who cannot signal. You cannot select for silence.

  ### Where Procedure Stops and Judgment Begins

  The procedure fails when it requires knowledge of the candidate's private constraints. Step 1 (Differential Cost) is a judgment call dressed as math. A reviewer cannot know if ten years of fieldwork was a sacrifice or a subsidized hobby without knowing the candidate's alternative offers, family obligations, or mental health costs. You must instruct reviewers to treat *opportunity cost* as the primary metric, inferring it from career trajectory rather than raw expenditure. Furthermore, Step 4 (Alignment) is pure speculation. You are asking reviewers to psychoanalyze strangers. This step should be weighted lowest.

  ### File Audits

  **File 1: The Remote Fieldworker (Your Bias)**
  *   **Signal:** Ten years of unfunded, remote fieldwork.
  *   **Test 1 (Differential):** High absolute cost. But was the marginal cost high? If the candidate had no dependents and no alternative employment offers, the cost was low. If they turned down tenure-track roles to do this, the cost was high.
  *   **Test 2 (Commonality):** Rare. Passes.
  *   **Test 3 (Binding):** This is an index of persistence, but only if it produced data. If it produced only "experience," it is a handicap.
  *   **Verdict:** The procedure does not automatically reward this. If the file shows they had no better options, the signal is cheap noise. If the file shows they sacrificed secure employment, it is an honest handicap. Your emotion is tracking the *story* of sacrifice, but the theory requires evidence that the sacrifice was *necessary* to prove quality. If they could have done the fieldwork while holding a safe job, the signal is invalid.

  **File 2: The Common Credential**
  *   **Signal:** PhD from a top-tier institution, two years post-doc.
  *   **Test 1 (Differential):** Low marginal cost for anyone admitted to the program.
  *   **Test 2 (Commonality):** Held by 80% of the pool.
  *   **Verdict:** Reject. This is noise. It indicates they passed a threshold, but it does not distinguish capacity for *risky* work within the pool. It is a cost everyone in the pool could afford.

  **File 3: The Constructed Failure (The Hidden Burden)**
  *   **Signal:** A candidate who produced high-impact work while appearing to have low resource expenditure (e.g., "efficient" research).
  *   **Test 1 (Differential):** Reviewers see low cost. They assume low marginal cost.
  *   **Reality:** The candidate suffered extreme psychological distress or personal loss to achieve this efficiency (hidden cost).
  *   **Verdict:** The procedure rejects them because the visible cost is low. This exposes the procedure's blindness to invisible costs. It selects for those who can *display* cost, not necessarily those who *bore* cost. It favors the wealthy who can afford visible waste over the strained who achieved efficiency through suffering.

  ### What The Procedure Cannot Do

  This procedure cannot select for capacity that does not signal. It inherently biases against candidates whose high quality allows them to work efficiently (low cost) rather than visibly (high cost). It cannot assess the *source* of the resources used to signal; a candidate with independent wealth can burn money easily (low marginal cost) while appearing to take a risk (high absolute cost), potentially fooling Step 1 unless reviewers scrutinize funding history. Finally, it cannot predict future risk tolerance; it only validates past endurance. A candidate who sustained risk for ten years may be exhausted and risk-averse tomorrow; the procedure treats past handicap as a guarantee of future capacity, which signalling theory does not support.
