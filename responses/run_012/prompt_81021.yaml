  # FACILITATOR NOTES & REFINEMENTS

  Based on the "What will predictably go wrong" section of your plan, here are three specific interventions to keep the session on track:

  **1. Managing the "Rigged Game" Objection**
  *   **The Risk:** As you noted, students may argue that behavior *cannot* be predicted without mental terms, rendering Round 2 impossible by design.
  *   **The Fix:** When this arises, validate the insight but enforce the constraint. Say: *"You are arguing that the vocabulary is constitutive. That is a Davidsonian point we will discuss in the debrief. For this round, I am asking you to simulate a neuroscience that hasn't invented 'belief' yet. Describe the circuit, not the story."* Write "Constitutive vs. Empirical" on the board and park the objection there until the debrief.

  **2. Preventing "Stealth Mentalism"**
  *   **The Risk:** Students will use words like "processing," "input/output," or "goal-directed" as synonyms for belief/desire.
  *   **The Fix:** Empower the Inspector with the rule you specified: *"A phrase is a strike if it can only be applied by someone who already understands belief-talk."* If a student says "The system is *trying* to open the door," rule it a strike. "Trying" implies intention. "The motor engaged" does not.

  **3. The Round 3 "Lookup Table" Trap**
  *   **The Risk:** A team might "win" Round 2 by writing: *"When Situation X occurs, Person does Y."* This predicts correctly but offers no theory.
  *   **The Fix:** In the debrief, explicitly penalize this intellectually even if they scored points. Ask: *"How many clauses would your theory need to cover every human action? Is a list of infinite length a science?"* This drives home the point that Folk Psychology is powerful because it is *generative*, not just descriptive.

  **Timing Check:**
  *   Intro: 5 mins
  *   Round 1: 20 mins
  *   Round 2: 25 mins
  *   Round 3: 15 mins
  *   Debrief: 25 mins
  *   **Total:** 90 mins.
  *   *Note:* Keep the transition between Round 1 and 2 brisk. Collect Round 1 cards immediately to prevent students from over-analyzing their own justifications before Round 2 begins.
