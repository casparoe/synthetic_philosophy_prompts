  ## 5. Team Scoresheet

  | Team Name: ___________________ | Round 1 | Round 2 | Round 3 | Total |
  | :--- | :---: | :---: | :---: | :---: |
  | **Prediction Points** | | | | |
  | **Justification Points** | | | | |
  | **Inspector Bonuses** | N/A | | N/A | |
  | **Strikes (Deductions)** | N/A | | N/A | |
  | **TOTAL** | | | | |

