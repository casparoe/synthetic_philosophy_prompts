answer: |-
  Dear Friend,

  It is a profound and difficult task to untangle the web of reasons that once governed your inner life, particularly when those reasons were woven into the fabric of your relationships and your sense of self. You describe a situation where the demand was not merely for outward compliance but for heart obedience, a alignment of your emotions and attitudes secured by the threat of severance from those you loved. Philosophically, you have identified this as an instance of the problem of the wrong kind of reasons. This is the puzzle of why certain considerations, such as the threat of punishment, give us a reason to want to have an attitude but do not constitute a reason to actually have it. If a demon threatens to destroy the world unless you admire him, you have a very strong reason to wish you could admire him, but the threat does not make him admirable. In your community, the threat of shunning gave you reason to wish for remorse, but it could not make the doubt itself sinful or the remorse fitting. You ask me to weigh the existing philosophical solutions against your experience and a new case, to assess your own proposal about shared deliberation, and to reach a verdict on what this implies for your past and future.

  To begin, we must look at the standard diagnosis, which distinguishes between object-given reasons and state-given reasons. On this view, a right kind of reason bears on the object of the attitude. If you are to believe a proposition, the reason must be evidence that the proposition is true. If you are to admire a person, the reason must be some quality of that person that makes them admirable. A state-given reason, by contrast, bears on the state of having the attitude. It points to the benefits of believing or the costs of doubting. In your case, the object of your remorse was your own doubt. The community offered no evidence that the doubt was inherently harmful or wrong in itself; rather, they offered consequences for holding it. The standard view would classify these as state-given reasons and therefore the wrong kind. They explain why you should bring it about that you feel remorse, but they do not speak to whether remorse is the appropriate response to doubt. While this distinction is clean, it can feel somewhat metaphysical. It relies on the idea that there is a fact of the matter about whether doubt is remorse-worthy, independent of the social context. In a high-control group, the theology asserts that doubt is objectively sinful. If one accepts the theology, the reasons might appear object-given. The distinction struggles when the object's properties are themselves a matter of contested belief, which is often the case in religious environments.

  There is a second approach, which suggests the puzzle reveals a flaw in analysing value in terms of fitting attitudes at all. If we say something is good just because it is rational to desire it, the wrong kind of reasons problem shows that rationality and value can come apart. You can have a reason to desire something that isn't good. Some philosophers argue we should abandon the attempt to define value through attitudes and focus on reasons directly. However, this does not help you much. It explains why the philosophical theory might be tricky, but it does not help diagnose the coercive structure of your past. It treats the problem as a technical error in value theory rather than a violation of rational agency. Then there is the deflationary proposal, which argues there is no qualitative difference between these reasons, only a difference in weight. On this view, a threat is just a very heavy reason to adopt an attitude, one that outweighs the lack of evidence. This view is difficult to sustain. It implies that if the threat were severe enough, it would become rational to genuinely admire the demon. But admiration is not something we can switch on at will, even under threat. We can pretend, we can try to cultivate it, but the threat does not make the admiration rational in the same way evidence does. The deflationary view fails to capture the different ways reasons connect to our minds.

  This brings us to your own proposal, which I find promising. You suggest that the mark of the wrong kind of reason is whether it can be offered in a shared deliberation, addressed to you as a participant rather than applied to you as a mechanism. This shifts the focus from the metaphysical status of the object to the relational structure of reason-giving. To test this, let us look first at your case of the meeting. You were required to express remorse for a doubt on pain of being cut off. When expressed, this remorse was treated as genuine and as evidence of restoration. Under the object-state distinction, we would say the reason was state-given because it relied on consequences. But under your deliberative proposal, we see something deeper. The leaders could not say to you, You should feel remorse because this threat makes your doubt sinful. That does not make sense as a piece of shared reasoning. They could only say, You must feel remorse or else. This treats your mind as a lever to be pulled. The fact that the community treated the expressed remorse as genuine highlights the coercion; they required the output of a rational process without respecting the inputs required for that process. They wanted the conclusion of a deliberation without allowing you the premises. Your proposal captures the violation of your agency better than the abstract object-state distinction.

  Now consider a second case, one constructed to test the limits of this idea. Imagine a restorative justice court where a young offender is required to show contrition to the victim as a condition of avoiding a criminal record. The court is not an external threat like a demon; it is a constitutive part of the social practice of justice. The judge says, For this process to work, for you to be reintegrated, you must genuinely feel and express contrition. Here, the reason to feel contrition arises from the role and the institution. Is this the wrong kind of reason? It is not a simple threat, though there is a penalty. It is framed as a requirement of the practice. If we use the object-state distinction, we might say the reason is state-given because it concerns the outcome of the trial, not the moral quality of the act. But suppose the act was indeed wrong. Then there are object-given reasons available. The difficulty arises if the offender does not believe they did wrong. The court insists on the attitude for the sake of the institution's functioning. Under your deliberative proposal, we must ask: Can this reason be offered in shared deliberation? If the judge says, You ought to feel contrite because it helps the community heal, this addresses the offender as a participant in the community. It invites them to see the value of the attitude. However, if the judge says, You must feel contrite to get the leniency, this bypasses the moral deliberation and treats the attitude as a currency. The constitutive nature of the pressure does not automatically make it the right kind of reason. If the institution demands an attitude that the participant cannot rationally hold based on the facts as they see them, it is still treating them as a mechanism. Your proposal holds up here: even institutional requirements fail if they cannot be articulated as considerations for the agent's own understanding.

  So, where does this leave us? I believe your proposal survives the cases best, but it needs a slight refinement to become the verdict. The core insight is that reasons for attitudes must be capable of guiding the agent through their own understanding. This is often called the guidance constraint. We cannot believe or feel at will simply because it is useful. We can only respond to considerations that bear on the truth or fittingness of the attitude. Your deliberative proposal explains why: because deliberation is the process by which we assess truth and fittingness. A reason that cannot be part of that process is not a reason for the attitude; it is a cause for the state. Therefore, I commit to the view that the distinction between the right and wrong kind of reasons is fundamentally about the mode of rational guidance. Object-given reasons work because they illuminate the object, allowing the mind to settle on the attitude. State-given reasons, including threats and institutional pressures that bypass the object, fail because they attempt to cause the attitude without illuminating the object. Your proposal adds the crucial social dimension: valid reasons must be shareable between rational agents. A threat is not shareable in the relevant way because it says, Submit your mind to my power, rather than, Look at this with me.

  This verdict has significant implications for how you understand your past. You ask whether the reverence and gratitude you genuinely had were ever responsive to reasons. It is likely that they were a mixture. In the beginning, you may have had object-given reasons. The community offered a worldview that made sense of things, provided community, and offered moral clarity. At that stage, your reverence could have been a rational response to what you perceived as the good. However, as the control tightened and the mechanism of heart obedience took over, the structure of your reasons shifted. The maintenance of those attitudes became dependent on state-given reasons—the fear of loss, the shame of doubt. Because attitudes like reverence and gratitude cannot be sustained purely by threats without eventually corroding, you likely had to engage in significant self-deception or emotional labour to keep the feelings aligned with the demands. This does not mean your feelings were fake. You are not a machine that was programmed; you are a rational agent who was placed in an environment where the rational links between evidence and belief were systematically severed and replaced with links between survival and belief. Your feelings were real, but the ecosystem that sustained them was pathological.

  Regarding how you should regard those attitudes now, it matters that you do not dismiss them as mere illusions. To treat your past self as simply brainwashed is to deny the rationality you were exercising at the time, even if it was within a distorted framework. You were responding to reasons as best you could within the information and social constraints you had. However, you should recognise that the structure of heart obedience was designed to make those attitudes immune to correction. By making the cost of doubt so high, the community insulated its doctrines from the very deliberation that your proposal identifies as essential. Understanding this allows you to view your past with compassion rather than shame. You were not irrational for feeling gratitude; you were placed in a situation where gratitude was the only safe harbour. The wrongness lies in the structure that made safety contingent on specific emotions.

  Finally, this leads to how you ought to treat people still inside such communities. If the mark of a valid reason is that it can be offered in shared deliberation, then your approach to those inside must respect their agency. You cannot simply threaten them with the loss of your love if they stay, nor can you bribe them to leave. That would replicate the structure of heart obedience, merely inverting the content. It would treat them as mechanisms to be manipulated rather than participants in a dialogue. Instead, you must offer reasons that are shareable. You must be willing to listen to their reasons, even when they seem flawed, and offer your own perspective without attaching catastrophic consequences to their rejection of it. You must create a space where doubt is not punished. This is incredibly difficult, especially when you love them and fear for them. But to treat them as rational agents is to accept that they must come to their own conclusions through a process you cannot control. Your verdict implies that the only ethical way to love someone out of a high-control group is to offer them reasons they can weigh, not consequences they must fear. You must be the counter-example to the community's claim that the world outside is coercive and dangerous. You must demonstrate that true connection does not require heart obedience, but only the shared, often messy, deliberation of free minds.

  In conclusion, the philosophical puzzle you have grappled with is not merely academic; it is a map of the coercion you endured. The standard distinction between object and state reasons is useful, but your insight into shared deliberation captures the human cost. The wrong kind of reasons are those that bypass the agent's capacity to understand why they feel what they feel. They turn the mind into a tool for survival rather than a vessel for truth. Your past attitudes were real, but they were cultivated in soil that was poisoned by the threat of loss. Recognising this allows you to reclaim your rationality without disowning your history. And it guides you to treat those still inside not as victims to be rescued by force, but as neighbours to be invited into a space where reasons can be spoken without fear.

  Yours sincerely,

  A Friend
