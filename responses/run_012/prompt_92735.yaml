  7.  **Final Polish:** Check British spelling. Ensure no bullet points. Ensure the verdict is clear. (The verdict will be that the Deliberative/Participatory account, refining the Object-Given view, is the survivor).

  *(Self-Correction on British English)*: Ensure "analyse", "realise", "behaviour", "honour", "programme" (if used), "centre".
