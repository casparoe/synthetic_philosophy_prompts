  **Candidate Decision Rules**
  To explain Dana's four previous verdicts, we must discard standard Expected Utility Theory (EUT). Her choices in (1) and (2) constitute a classic Allais Paradox: she prefers certainty in (1) despite a lower expected value (EV), but prefers the riskier long shot in (2) where both options are uncertain. EUT cannot satisfy both preferences simultaneously. Two non-EUT models fit her data:

  1.  **Constrained Expected Value (Safety-First Rule):** Dana maximizes Expected Value subject to a "Safety Constraint." She will reject a gamble with a risk of zero acres if the Sure Thing exceeds a psychological threshold (approx. 1,500 acres) *and* the EV premium of the gamble is insufficient to justify the risk.
