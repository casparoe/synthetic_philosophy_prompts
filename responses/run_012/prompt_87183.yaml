answer: |-
  **OmniCausal Industries | Support Hub | Intervener Home 2.0**

  **Q: What does the Intervener Home 2.0 actually do?**
  A: The Intervener guarantees specific household outcomes. Our proprietary Counterfactual Lock monitors your neural motor functions. If you were ever about to deviate from the preset path, the device corrects your behavior instantly. If you stay on path, it remains off.

  **Q: Does the device interfere with my actual decisions?**
  A: Only in scenarios that do not occur. In the actual sequence of events, the device remains in passive standby. If you choose the preset path voluntarily, the Intervener contributes zero energy to the action. It is causally inert regarding what you actually did.

  **Q: Am I responsible for actions taken while the device is installed?**
  A: Absolutely. Since the device only activates upon signs of deviation, and no deviation occurred, the causal chain remains entirely within your agency. You acted alone. The presence of a safety net does not make the net responsible for your walk across the tightrope, provided you did not fall.

  **Q: What if I felt an urge to do otherwise?**
  A: That urge constitutes a "flicker event." Our sensors detect the initial neural spike of deviation. If the spike crosses threshold, we intervene. If you proceed without intervention, the urge was insufficient to constitute a genuine alternative possibility. You cannot claim you could have done otherwise based on a feeling we suppressed before it became an action.

  **Q: Does this require a specific home environment?**
  A: Yes. The Intervener requires the Hard Determinism Module (sold separately) to ensure prior causes sufficiently constrain your physics. Without it, quantum noise may introduce randomness that voids the guarantee. Please note: installing this module confirms you accept that your purchase was also causally necessitated.

  **Q: Who is liable if the outcome causes damage?**
  A: You are. As stated in Q3, if the device did not fire, it was not a cause. You cannot blame a tool for remaining in its box. Our Terms of Service specify that liability tracks the actual sequence of events, not the counterfactual scenarios where we would have forced you.

  **Q: Can I return the device if I change my mind?**
  A: No. The purchase transaction was finalized by causal necessity. Furthermore, returning it would require a deviation from the preset path of ownership, which triggers intervention. You are keeping the device because you decided to keep the device.

  **Q: Is it fair to be held responsible for something I couldn't avoid?**
  A: Responsibility is not based on avoidance capacity. It is based on actual sequence ownership. Since you owned the sequence, you own the liability. Fairness implies you could have done otherwise; our product guarantees you could not, while simultaneously confirming you are the sole author of the act.

  **Q: How do I contact support if something goes wrong?**
  A: You cannot. If something went wrong, it was because you chose it. Support tickets are only generated for device malfunctions, and the device cannot malfunction if it never activated. Please review the fine print: *In the event the Intervener influences the actual sequence, liability shifts to OmniCausal. However, if liability shifts, the device is deemed to have malfunctioned by activating unnecessarily.*

  ***

  **Note:** I committed to the horn that the device makes zero difference in the actual sequence. This forces the FAQ to insist the user is responsible *because* the coercion failed to activate, highlighting the absurdity of claiming alternative possibilities are irrelevant while admitting the device was inert. I took liberties by treating "Hard Determinism" as a purchasable add-on to make the metaphysical prerequisite explicit consumer fine print.
