      *   *Item 5: Ur-Priors.* Too speculative? Maybe. Often leads to subjectivity dead-ends.
      *   *Item 6: Non-Bayesian Approaches.* Likelihoodism? Error Statistics? Might be out of scope for a Bayesian-focused issue, but worth noting.

      *Refining the Ranking:*
      1.  *Constitutive vs. Accidental Evidence (The Archive Question).* If the friend is right, this kills standard Bayesianism broadly. High priority to investigate, even if the verdict is negative.
