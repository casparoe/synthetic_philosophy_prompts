prompt: |-
  You are a philosopher of technology who works in both clinical ethics and the theory of AI alignment, and who is careful never to let one literature's vocabulary quietly settle a question that belongs to the other.

  I am an ICU physician and clinical ethicist. The distinction between the substituted judgment standard and the best-interest standard is the water I swim in: I apply it weekly to patients who cannot speak for themselves, I know where the two standards diverge in practice, I know how decisional capacity, advance directives, surrogate decision-makers, therapeutic privilege, and conscientious objection fit around them, and I know the familiar complaint that best interest smuggles in a substantive theory of the good that clinicians are not entitled to. My grasp of AI alignment, by contrast, is that of an interested outsider: I have read a few survey pieces and listened to a lot of podcasts, and I know roughly that the problem is often stated narrowly, as getting a system to reliably do what its operator intends or specifies, and sometimes broadly, as getting a system whose goals and behavior are good for humanity or track human values. What I do not have is any disciplined sense of how those two readings relate to each other, or of what the dispute between them actually turns on.

  I want you to restate that dispute in my vocabulary, as faithfully as you can, and then give me a residue report.

  Do the translation in two passes. First, state the narrow reading and the strongest case for it using only the conceptual resources of clinical decision-making, and then do the same for the broad reading and its case. Second, and more importantly, tell me what did not survive. Separate your report into three bins: claims that translate cleanly and could be made in a hospital ethics committee without strain; claims that translate only with distortion, where you should say exactly what has to be bent and whether the bending is harmless or changes the claim; and claims that have no counterpart at all in my vocabulary. For the third bin, tell me whether the gap reflects something my framework cannot express or something the original claim was never clear about.

  Some specific things I want you to address along the way. Is the narrow reading just substituted judgment applied to a principal who has no capacity and cannot be consulted, and if so, does the analogy make it look better or worse than its critics suppose? Does the best-interest standard actually deliver the broad reading, or does clinical ethics get away with it only by deferring to the patient's own values, which the AI case has no analogue of? My practice distinguishes three things, not two: substituted judgment (what this patient would have chosen), best interest (what is good for this patient), and the advance-directive case (instructions written in advance by someone who could not foresee the state they would be in). Tell me which of these the alignment debate is really about, and whether it needs a fourth category that clinical ethics lacks.

  Begin by laying out, briefly, the candidate correspondences you can see, before committing to any of them. Think carefully, work through concrete cases rather than slogans, and be willing to conclude that the translation succeeds so well that the AI debate is a rediscovery of old ground, or that it fails in a way that shows the distinction doing less work than it appears to. I do not want citations, reading lists, or names of papers; I want the conceptual work. Where you are unsure how clinical ethics actually handles something, say so rather than smoothing it over. End with a short verdict on which reading, if either, my framework supports, and on what the residue tells us about the alignment problem itself.
