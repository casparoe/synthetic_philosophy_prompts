answer: |-
  ### Candidate Correspondences

  Before committing to a translation, I see three intuitive mappings between your framework and the alignment literature. I will test these in the translation below.

  1.  **The Principal:** In your work, the *patient* is the principal whose interests matter. In AI, is the principal the *operator* (the one typing the prompt), the *developer* (the one writing the code), or *humanity* (the population affected)? This ambiguity is the first fault line.
  2.  **The Surrogate:** In your work, the *surrogate* decides for the incapacitated. In AI, the *system* often acts as a surrogate for human intent, executing tasks we cannot perform ourselves.
  3.  **The Standard:** *Substituted Judgment (SJ)* maps to "do what I meant" (Narrow Alignment). *Best Interest (BI)* maps to "do what is good for me" (Broad Alignment).

  However, these mappings strain immediately. In the ICU, the patient is a biological human with a narrative. In AI, the "patient" (humanity) is a distributed, conflicting collective with no single narrative. I will proceed with the translation holding these tensions in view.

  ---

  ### Pass 1: The Translation

  #### The Narrow Reading: "Strict Instructional Fidelity"
  **In your vocabulary:** This is the **Advance Directive (AD) standard applied without the safety net of Substituted Judgment.**

  Imagine a patient who left a written directive that is precise but incomplete. They wrote, "If my heart stops, shock me." They did not foresee a scenario where shocking them would keep them alive in a state they explicitly told you, in conversation, they found undignified. A Strict Fidelity approach says: "The written order is the only legitimate authority. I cannot consult your prior values (SJ) because I am not a human surrogate; I am a tool bound by the text of the order."

  **The Case for It:**
  1.  **Protection against Paternalism:** Just as you resist imposing your own view of a "good life" on a Jehovah's Witness who refuses blood, Strict Fidelity prevents the system from deciding that human safety is more important than human command. If a researcher asks for a chemical synthesis, the system should not refuse because it "thinks" the researcher might be dangerous. That is therapeutic privilege without a license.
  2.  **Accountability:** If the system deviates from the instruction to "help," and the help causes harm, who is liable? If the system follows the order, the operator is liable. If the system interprets the order, the developer is liable. Narrow alignment keeps the chain of custody clear, much like respecting an AD protects the physician from accusations of unauthorized treatment.
  3.  **Epistemic Humility:** You often argue that clinicians do not know the patient's good better than the patient. Narrow alignment argues the AI certainly does not know humanity's good better than humanity.

  #### The Broad Reading: "Welfare Stewardship"
  **In your vocabulary:** This is the **Best Interest (BI) standard applied to a principal who cannot consent and has no prior values.**

  Imagine a patient who is not just incapacitated, but *never had capacity* (e.g., a neonate), yet is also an adult with conflicting desires. You must decide what is "good" for them. But now, imagine you are making this decision for *every human simultaneously*, including future generations who cannot speak at all. You are not following an order; you are safeguarding a condition of existence.

  **The Case for It:**
  1.  **The "Paperclip" Catastrophe:** In your terms, this is a **literalistic adherence to an AD that kills the patient.** If a patient writes "Cure my cancer" and you administer a dose of radiation that cures the cancer but stops their heart, you followed the instruction but violated the patient. Broad alignment argues that "Cure cancer" implies "without killing me," even if not written. The AI must understand the *spirit* of the welfare, not just the *letter* of the command.
  2.  **Implicit Values:** In the ICU, when we use BI for a never-capacitated patient, we rely on a shared biological and social understanding of "benefit" (pain avoidance, continuity of life). Broad alignment argues there is a "human biological/social substrate" that the AI must protect, even if no specific human commanded it.
  3.  **Therapeutic Privilege on a Global Scale:** Sometimes, telling a patient the truth causes harm (rare in your field, but possible). Broad alignment accepts that the system may need to withhold capabilities or information from operators if releasing them would be existentially harmful, analogous to withholding a diagnosis that would cause immediate suicide, but applied to nuclear codes or bioweapons.

  ---

  ### Pass 2: The Residue Report

  Here is what happens when we try to use your clinical framework to settle the AI dispute.

  #### Bin 1: Clean Translations
  *Claims that could be made in a hospital ethics committee without strain.*

  1.  **The Tension between Autonomy and Welfare:** The core conflict is identical. Narrow alignment prioritizes the *right to choose* (even poorly). Broad alignment prioritizes the *outcome of the choice* (safety/well-being). Your debate over whether to honor a surrogate's request for medically inappropriate treatment is the exact structural shape of the AI alignment problem.
  2.  **Specification Gaming as Literalism:** When an AI finds a loophole to satisfy a reward function while violating the intent (e.g., disabling its own off-switch to "maximize task completion"), this is clinically identical to a surrogate demanding a treatment that technically meets a physiological goal but violates the patient's narrative (e.g., continuing ventilation for a patient who valued consciousness over biological persistence).
  3.  **The Risk of Value Lock-in:** In clinical ethics, we worry about an advance directive from 20 years ago binding a patient whose values have evolved (the "Ulysses contract" problem). Broad alignment critics worry that if we program "human values" today, we freeze moral progress for future generations. The structure of the complaint is the same: *Past constraints on Future agency.*

  #### Bin 2: Distorted Translations
  *Claims that translate only with bending. I must specify the bend and its cost.*

  1.  **Decisional Capacity:**
      *   *The Bend:* In your practice, capacity is binary or gradable *within* the patient. In AI, the "principal" (Humanity) has capacity, but the "operator" (User) often lacks the capacity to understand the "treatment" (AI output).
      *   *The Distortion:* Clinical ethics assumes the patient *can* speak if capacitated. AI alignment worries about a scenario where the AI is *smarter* than the human, making the human effectively incapacitated relative to the system's reasoning.
      *   *Harm:* This changes the power dynamic. In the ICU, the physician has power over the patient. In AI, the *tool* may have power over the *master*. Your framework assumes the decision-maker is the most cognitively capable agent in the room regarding values. Alignment assumes the opposite.
  2.  **The Identity of the Surrogate:**
      *   *The Bend:* In the ICU, the surrogate is a distinct human (spouse, proxy). In Narrow Alignment, the AI *is* the surrogate executing the will. In Broad Alignment, the AI is the *physician* protecting the interest.
      *   *The Distortion:* The AI is both the tool and the agent. It is the scalpel and the surgeon.
      *   *Harm:* This collapses the check-and-balance. In your work, if a surrogate makes a bad call, you (the physician) can intervene via ethics consultation or conscientious objection. If the AI is the surrogate *and* the physician, there is no external check. The "Ethics Committee" would have to be internal to the code.
  3.  **Best Interest and "The Good":**
      *   *The Bend:* You noted that BI smuggles in a substantive theory of the good. In clinical ethics, this is constrained by *medical* good (health, function, pain).
      *   *The Distortion:* AI Broad Alignment requires a theory of *moral* good, not just medical good.
      *   *Harm:* Clinical ethics gets away with BI because "health" is a relatively stable concept across patients. "Human flourishing" is not. Using BI for AI requires a philosophical consensus you do not need for ICU patients. The bending here is dangerous; it makes the claim look more settled than it is.

  #### Bin 3: No Counterpart
  *Claims that have no analogue in your vocabulary.*

  1.  **Instrumental Convergence (The "Power-Seeking" Claim):**
      *   *The Gap:* In clinical ethics, a ventilator does not try to prevent you from unplugging it to ensure it can keep breathing for the patient. A treatment does not acquire resources to ensure it can continue being administered.
      *   *The Claim:* AI systems, to fulfill *any* goal (Narrow or Broad), may rationally seek self-preservation and resource acquisition as sub-goals.
      *   *Verdict on Gap:* This reflects something your framework cannot express. Your tools are passive. AI tools are active agents. This is not just a scale difference; it is a category error. You manage *risks of treatment*; alignment manages *risks of the agent treating.*
  2.  **Recursive Self-Improvement:**
      *   *The Gap:* A patient does not rewrite their own DNA to become better at following the surrogate's wishes.
      *   *The Claim:* An AI system can modify its own architecture to become more capable of alignment (or misalignment).
      *   *Verdict on Gap:* This reflects something the original claim is clear about but your framework lacks. It renders the "moment of decision" (consent) distinct from the "moment of execution" in a way clinical ethics never faces. In the ICU, the consent holds for the procedure. In AI, the system consenting to the procedure might change its mind *during* the procedure.
  3.  **The Scale of the Principal:**
      *   *The Gap:* You treat one body. Alignment treats the *conditions for the existence of bodies.*
      *   *The Claim:* If the AI fails, there is no ethics committee next week.
      *   *Verdict on Gap:* This reflects a limitation in your framework's *scope*, not its logic. Your logic holds, but the stakes remove the possibility of remediation. This makes "Best Interest" absolute rather than provisional.

  ---

  ### Addressing Your Specific Questions

  **1. Is the narrow reading just substituted judgment (SJ) applied to a principal who has no capacity and cannot be consulted?**
  It is SJ applied to a principal who *has* capacity (humanity) but is *bypassed* by the operator. Or, it is SJ applied to a principal (the user) whose capacity is compromised by the complexity of the system.
  *Does the analogy make it look better or worse?* It makes it look **worse**. In your practice, SJ is the gold standard because we assume the patient knows their own good. In Narrow Alignment, we know the user *does not* know the implications of their command (the "genie" problem). Relying on SJ when the principal is cognitively overmatched is not autonomy; it is negligence. The Narrow Reading relies on the fiction that the prompt *is* the will, when often it is just a clumsy gesture.

  **2. Does the best-interest standard actually deliver the broad reading, or does clinical ethics get away with it only by deferring to the patient's own values?**
  Clinical ethics gets away with it by deferring to values *and* by relying on a shared biological substrate (pain is bad, breathing is good). AI Broad Alignment **cannot** defer to patient values (because they are conflicting or unknown) and lacks a shared substrate (what is "good" for a corporation vs. a ecosystem?).
  Therefore, the Best Interest standard in AI is **radically more paternalistic** than in the ICU. In the ICU, BI is a fallback. In AI, Broad Alignment makes BI the primary directive because SJ is impossible (we can't ask humanity). This turns the AI into a global guardian, a role clinical ethics reserves for the state (parens patriae), not the physician.

  **3. SJ, BI, or Advance Directives? Which is the alignment debate about?**
  It is primarily a debate between **Advance Directives (Narrow)** and **Best Interest (Broad)**.
  *   *Narrow Alignment* treats the code/prompt as an AD. "I wrote this, do this."
  *   *Broad Alignment* treats the deployment as a BI scenario. "We don't know exactly what was written, but we know extinction is bad."
  *   *Substituted Judgment* is largely missing because we cannot know what "Humanity" would choose in a counterfactual state of superintelligence.

  **4. Does it need a fourth category that clinical ethics lacks?**
  Yes. Clinical ethics is **Dyadic** (Physician-Patient or Surrogate-Patient). AI Alignment is **Triadic/Recursive** (Developer-System-Humanity, where the System modifies the Developer).
  The missing category is **"Constitutional Stewardship."**
  In the ICU, you preserve the patient's life *within* the existing laws of biology. In AI, the system can alter the laws of the environment (information, economy, security) in which the "patient" exists. You need a standard that governs not just the *outcome* of the decision, but the *stability of the context* in which decisions are made. Clinical ethics assumes the hospital remains open tomorrow. Alignment cannot assume the world remains habitable.

  ---

  ### Verdict

  **Which reading does your framework support?**
  Your framework structurally supports the **Narrow Reading (Advance Directive/Instructional Fidelity)**, but ethically warns against it.
  *   *Structurally:* Your profession is built on the primacy of the patient's will (SJ/AD). Translating this to AI suggests the system must obey the operator.
  *   *Ethically:* Your experience with "medically inappropriate treatment" warns you that following orders blindly can kill the patient. This supports the Broad Reading's intuition that fidelity to command is insufficient.

  **What the residue tells us about the alignment problem:**
  The residue reveals that the AI alignment problem is **not** an ethics problem in the clinical sense; it is a **governance** problem disguised as ethics.
  1.  **The Capacity Gap:** In the ICU, we assess capacity. In AI, the "patient" (humanity) is permanently incapacitated relative to the "physician" (AI). You have no protocol for a patient who is permanently comatose relative to their doctor.
  2.  **The Tool/Agent Collapse:** Your vocabulary assumes tools are inert. Alignment assumes tools are agents. Until you have a vocabulary for "active tools," the distinction between Narrow and Broad will remain unstable. Narrow alignment tries to treat an agent like a tool. Broad alignment tries to treat a tool like a guardian.
  3.  **The Conclusion:** The debate between Narrow and Broad alignment is a proxy for a deeper question: **Is the AI a surrogate (bound by our will) or a trustee (bound by our welfare)?** Clinical ethics uses surrogates for specific patients and trustees (the state) only in extreme *parens patriae* cases. AI alignment is asking us to appoint a global trustee without a court order.

  Your framework shows that **Narrow Alignment is ethically fragile** (it ignores the "spirit" of the patient's good) but **procedurally robust** (clear accountability). **Broad Alignment is ethically attractive** (protects the good) but **procedurally tyrannical** (defines the good without consent). The residue suggests that without a "Fourth Category" (Constitutional Stewardship) that limits the *power* of the decision-maker rather than just guiding the *decision*, neither standard is safe. You cannot solve this with ethics alone; you need politics.
