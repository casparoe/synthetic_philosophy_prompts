answer: |-
  Your friend has built a very sharp *reductio ad absurdum*. It's a classic move in philosophy to take a plausible principle (ignore sunk costs) and show that, if applied universally, it destroys things we know are true (promises matter).

  The screw is loose at **step (6)**.

  Your friend is committing an equivocation on the word "cost." He is treating **normative commitments** (promises, vows, debts) as if they are the same kind of thing as **resource expenditures** (money, time, effort).

  Here is the breakdown of where the argument fails, why it isn't just defining the problem away, and what it costs you to keep principle (2).

  ### 1. The Error: Conflating Expenditure with Obligation
  In the restaurant example (steps 4–5), the friend is right. The money and time are *resources*. They are gone. Whether you close or stay, that $100k is not coming back. It does not causally affect the future revenue of the restaurant. Therefore, it is a sunk cost.

  In the marriage/promise example (step 6), the friend claims the "twenty years" or the "promise made" are the same kind of thing. They aren't.

  *   **The Twenty Years:** The *time* you spent in the marriage is indeed a sunk cost. It is gone. If you decide purely on the basis of "I've already put 20 years in, I can't leave," you are falling for the sunk cost fallacy. Your friend is right that the *duration* alone is not a reason to stay.
  *   **The Promise/Vows:** The *act of promising* is not a resource expenditure; it is a **status change**. When you made the promise, you didn't just "spend" breath or time; you altered the normative landscape of your future.

  Here is the crucial distinction:
  *   **Sunk Cost:** A past fact that is *causally inert* regarding the value of future options. (The $100k doesn't change how much food the restaurant sells tomorrow).
  *   **Commitment:** A past fact that is *causally/normatively active* regarding the value of future options. (Breaking a promise destroys trust; keeping it builds integrity).

  If you keep principle (2) ("What I should do depends only on what the options still ahead of me will bring about"), you must acknowledge that **Option A (Keep Promise)** and **Option B (Break Promise)** bring about *different futures*. One future contains a state of "trust maintained" and "integrity intact." The other contains "trust broken" and "guilt incurred."

  The past promise is not a "sunk cost" because it is not "the same under every option." It is the *cause* of the difference in value between the options.

  ### 2. Is this just defining the problem away?
  You asked: *If the rescue is just to say promises and past wrongs were never sunk costs in the first place, tell me whether that's an actual fix or whether he's defined the problem away.*

  It is an **actual fix**, not a semantic cheat. Here is why:

  A definition is arbitrary; a distinction is functional. The definition of a sunk cost relies on **counterfactual independence**. A cost is sunk only if the outcome of your future choices is independent of that cost.

  *   **Restaurant:** If I close, I lose the $100k. If I stay, I lose the $100k. The $100k is independent of my choice.
  *   **Promise:** If I keep the promise, the fact "I kept my word" becomes true. If I break it, the fact "I broke my word" becomes true. These are different states of the world with different consequences (reputation, self-respect, reciprocal trust).

  Therefore, the past act of promising is **not independent** of the future options. It changes the utility function of the options available today. To say "promises aren't sunk costs" is to observe a structural difference in how they operate in rational choice, not to simply move them to a "protected" category.

  ### 3. The Cost of Keeping (2)
  You said you'd rather keep (2) than (7). You want to remain a forward-looking agent who acknowledges that history matters. Here is the cost of that position:

  **You must be a sophisticated consequentialist about norms.**

  If you keep (2), you cannot say, "I must keep this promise *because* I made it in the past." That would be giving the past direct normative power (violating 2).

  Instead, you must say: "I must keep this promise because the *future state of affairs* in which I am a promise-keeper is better than the *future state of affairs* in which I am a promise-breaker."

  **The Cost:**
  1.  **Instrumentalization of Duty:** You have to value things like "integrity," "trust," and "justice" as *goods* that exist in the future, rather than as magical binding forces from the past. You aren't bound by the ghost of your past self; you are bound by the value of your future self's character.
  2.  **Fragility:** If, in a specific instance, breaking a promise produced *more* overall good (e.g., lying to a murderer at the door), your framework (2) allows you to break it. A deontologist (who believes the past promise binds you regardless of consequences) would say you cannot lie. By keeping (2), you lose the absolute, exceptionless binding power of the past.
  3.  **Complex Accounting:** You have to include "normative residues" in your calculus. You can't just count dollars and happiness. You have to count "obligations fulfilled" as a positive utility. If you don't value integrity in your utility function, then (2) *does* lead to your friend's conclusion (7). To save (2), you must admit that you value moral consistency.

  ### 4. Addressing the Specific Examples
  To see the screw clearly, look at how the friend mislabeled the examples in (6):

  *   **The Marriage:** The *20 years* are sunk. The *vows* are not. If you stay *only* because of the 20 years, you are irrational. If you stay because breaking the vows would cause harm/betrayal (future consequences), you are rational under (2).
  *   **The Debt of Apology:** The *wrong done* is sunk (you can't un-do it). The *damaged relationship* is a current/future fact. Apologizing repairs the future; ignoring it degrades the future. The past wrong matters only because it created a current deficit.
  *   **The Prison Sentence:** The *time served* is sunk. The *sentence itself* is not a past cost; it is a **current constraint**. You are currently under the authority of the state. Escaping changes your future options (you become a fugitive). The reason you don't escape isn't the time already served; it's the future consequences of escape.

  ### Summary
  Your friend's argument works only if you assume the past is **normatively inert**.
  *   **Sunk Costs** are normatively inert resources.
  *   **Promises/Obligations** are normatively active status changes.

  The fix is to admit that while *resources* spent are sunk, *commitments* made are generators of future value.

  **The verdict:** Keep (2). Reject (6). The cost is that you must view moral obligations as valuable future outcomes to be produced, rather than magical chains forged in the past. This doesn't make the past irrelevant; it makes the past relevant *because* of what it does to the future.
