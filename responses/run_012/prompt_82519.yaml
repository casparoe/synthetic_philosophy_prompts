answer: |-
  You have put your finger on the exact seam where standard decision theory stitches over human psychology. You are right: the proof on the board is airtight only if you accept a hidden premise that is false for your aunt, your friend, and the pension-avoider.

  There is an established term for the *mechanism* in behavioral economics, but there is no common name for the specific *fallacy* your group is committing. Since you asked for a name for the move/assumption if one doesn't exist, I will give you the academic term for the phenomenon, and then coin a term for the logical error that is stalling your group.

  ### 1. The Established Term: **Direct Utility from Beliefs**
  In standard decision theory (and the proof on your whiteboard), utility is defined over **world states** and **actions**.
  $$U = f(\text{World State}, \text{Action})$$
  In this model, information is only *instrumentally* valuable. It helps you pick better actions. If you can't act on the info (your aunt's medical result), the instrumental value is zero. Since information is "free" (in the model), you can't lose.

  However, in the literature (pioneered by economists like Andrew Caplin and John Leahy in *Psychological Expected Utility Theory*, 2001), utility is often defined over **beliefs** as well.
  $$U = f(\text{World State}, \text{Action}, \text{Belief})$$
  When beliefs enter the utility function directly, information has **hedonic value** (it feels good or bad to know) independent of its instrumental value. Your aunt derives positive utility from *truth* (which is why she'd do it again) but negative utility from *anxiety* (which is why she's awake at 3 AM). The standard proof fails because it assumes the third variable ($\text{Belief}$) does not exist or does not affect $U$.

  ### 2. The Coined Term: **The Cognitive Decoupling Fallacy**
  For your reading group, I propose you call the specific error in the "just ignore it" argument **The Cognitive Decoupling Fallacy**.

  **Definition:** The assumption that an agent can update their *action policy* based on new information without updating their *belief state*, or that the *belief state* does not itself generate utility costs.

  **What it covers:**
  *   It covers the "ignore" move. You can ignore a *recommendation*, but you cannot ignore a *fact* once it is encoded as a belief.
  *   It covers the assumption that "doing what you would have done anyway" restores the status quo. It restores the *action*, but not the *mental state*.
  *   It explains why the proof works on the board (where agents are belief-blind) but fails in the room (where agents are belief-sensitive).

  **What it doesn't cover:**
  *   It does not imply the agents are irrational. Your aunt is rational; she simply has a utility function that values Truth > Comfort.
  *   It does not apply to costs of *acquisition* (time, money). This is about the cost of *possession*.

  ### 3. Where is the Edge? (Answering your boundary questions)

  You asked where the edge of this concept lies. Here is how you map the boundaries using this framework.

  **Does it matter whether the news is actionable?**
  **Yes.** This distinguishes **Instrumental Value** from **Hedonic Value**.
  *   *Actionable:* If your friend the grad student could fix the method, the information has positive instrumental value that might offset the negative hedonic value.
  *   *Non-Actionable:* Your aunt's test result has zero instrumental value. The entire calculation is hedonic. If the hedonic cost (anxiety) outweighs the hedonic benefit (curiosity/truth-seeking), the net value of information is negative. The "ignore" argument fails hardest here because there is no instrumental upside to justify the belief cost.

  **Does it matter if the news is about the past?**
  **Yes, but only in the mechanism of pain, not the result.**
  *   *Future:* Pain comes from **Anticipation** (dread). This is "anticipatory utility."
  *   *Past:* Pain comes from **Evaluation** (regret/shock).
  *   *The Edge:* In both cases, the belief state enters the utility function negatively. The "Cognitive Decoupling Fallacy" applies to both. You cannot "un-dread" a future event you now know is likely, and you cannot "un-shock" yourself about a past event you now know is true.

  **Is "I wish I could un-know" the same as "knowing was bad for her"?**
  **No. This is the crucial distinction your group is collapsing.**
  You must separate **Ex-Ante Valuation** from **Ex-Post Utility**.
  *   **Ex-Ante (Before the test):** "Will I order this?" Your aunt says *Yes*. Her expected utility (weighing the chance of bad news against the value of truth) is positive. She is not irrational for ordering it.
  *   **Ex-Post (After the result):** "Am I worse off than if I remained ignorant?" She says *Yes*. Her realized utility is lower because the specific belief she now holds causes pain.

  The standard proof claims $E[U|Info] \ge E[U|No Info]$. Your aunt agrees with this! She would order it again tomorrow.
  The proof *also* implicitly claims $U_{realized}|Info \ge U_{realized}|No Info$ for any specific outcome. **This is where it breaks.** The "ignore" argument tries to prove the second claim using the logic of the first. It fails because you cannot swap out the belief state after the fact.

  ### Summary for the Group
  When you go back to the reading group, you can say this:

  1.  The proof assumes **Outcome-Dependent Utility**.
  2.  The real world operates on **Belief-Dependent Utility**.
  3.  The move "just ignore it" commits the **Cognitive Decoupling Fallacy**: it assumes we can decouple the *action* (which we control) from the *belief* (which we cannot easily control once formed).
  4.  Your aunt is not incoherent. She is trading **Ex-Post Comfort** for **Ex-Ante Epistemic Satisfaction**. The theory isn't broken, but the utility function on the whiteboard is missing a variable.

  If you need a single label to write on the board to kill the argument, write: **"Non-Separability of Belief and Utility."** If you want the term that describes why the "ignore" move fails specifically, use **"The Cognitive Decoupling Fallacy."**
