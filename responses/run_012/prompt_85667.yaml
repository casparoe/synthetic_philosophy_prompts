  Most of your candidates are genuine constraints, but two demand opposite things about the word's power, and the demand that truth add no new proof eliminates the most common substantive views.

  Here is the sorting of your list into genuine requirements and habits of speech, followed by the conflict and the eliminator.

  **Genuine Requirements**
  These are stakes that any account of truth must address to be coherent.
  1.  **Generalization:** The account must explain how we endorse claims without repeating them (e.g., "what she said is true").
  2.  **Translation:** The account must explain how truth survives across different languages, implying it attaches to content rather than specific words.
  3.  **Truth-Value Gaps:** The account must distinguish between claims that are false and claims that fail to refer or lack meaning entirely.
  4.  **Consistency:** The account must handle self-referential sentences without collapsing into contradiction.
  5.  **Conservativeness:** The account must not allow the word "true" to prove facts about the world that could not be proven without it.
  6.  **Normativity:** The account must explain why truth acts as a goal for inquiry and defines what is wrong with lying.
  7.  **Independence:** The account must specify whether a claim can be true even if no one can ever verify it.

  **Habits of Speech**
  These are confusions where the word "true" is doing work that belongs to other concepts.
  1.  **Fiction:** Saying something is "true in the story" uses a different logical operator than literal truth; a theory of literal truth need not explain this directly.
  2.  **Misleading Truths:** When a factually accurate statement creates a false impression, the error lies in communication norms, not in the truth conditions of the sentence.

  **The Incompatible Pair**
  Requirements 5 and 6 pull in opposite directions and cannot be fully met at once. If truth is merely a logical device that adds no new information (5), it is hard to explain how it serves as a robust goal that guides successful investigation (6). If truth is a substantial property that explains why inquiry succeeds (6), it seems to add ontological weight that violates the rule that it should prove nothing new (5). You must choose between truth as a transparent tool or truth as a substantive property.

  **The Eliminator**
  The single requirement that eliminates the most accounts people actually hold is the **Conservativeness** constraint (Requirement 5). Most people intuitively hold that truth is a real property that matches reality and explains why beliefs succeed. This requirement forbids truth from having any explanatory power beyond the sentences themselves, thereby ruling out the common view that truth is a heavy metaphysical feature of the world.

  Verdict: The no-new-facts requirement.
