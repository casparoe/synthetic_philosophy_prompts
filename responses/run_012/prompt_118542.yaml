answer: |-
  Here is your prep sheet. It is blunt because you asked for survival, not validation.

  ### The Objections

  **1. The Chair (Retired Teacher)**
  *   **The Objection:** "You are conflating *ontology* with *epistemology*. The Battle of Badon happened, or it didn't, regardless of whether we can pin a coordinate to it. By saying it only becomes 'history' when we assign it a date, you're suggesting the past is created by the historian, not discovered."
  *   **The Answer:** "I'm not talking about the past; I'm talking about the *claim*. The battle is an event. 'The Battle of Badon, 500 AD, Bath' is a historical proposition. My point is we can't treat the event as history until it takes the form of a proposition we can argue about. Otherwise, it's just faith."
  *   **The Thin Spot:** You are semantically fencing. He is right that the past exists without you. If you push too hard on "form," you sound like a postmodernist who thinks reality is text.

  **2. The Postgrad (Archaeology)**
  *   **The Objection:** "This framework isn't falsifiable. You're saying a story becomes historical when it's specific enough to test, but you're not actually testing anything tonight. This is philosophy of science, not history. It's a category error."
  *   **The Answer:** "It's a pre-test. Before I dig a trench, I need to know if the question I'm asking the trench is valid. If I dig for Arthur in every hillfort in Britain, I'm not doing archaeology, I'm on a treasure hunt. My framework is the criteria for forming a valid research question."
  *   **The Thin Spot:** He's right. You are offering a methodology for *asking*, not a method for *answering*. If he presses on how *your* theory is tested, you have no answer.

  **3. The Camelot Hunter (Local Enthusiast)**
  *   **The Objection:** "So because I haven't found the sword yet, the story is just a story? You're saying absence of evidence is evidence of absence. That's not science, that's closed-mindedness."
  *   **The Answer:** "Not at all. I'm saying that if Arthur is *everywhere*, he is *nowhere*. If he's at Glastonbury, and Cadbury, and in Cornwall, the claim isn't specific enough to be wrong. A claim that can't be wrong can't be right. I want your hillfort to be Camelot, but for it to be history, it has to risk being proven false."
  *   **The Thin Spot:** He will hear "I want your hillfort to be Camelot" as patronizing. He will feel you are dismissing local oral tradition as 'noise'.

  **4. The Camelot Hunter (Round Two)**
  *   **The Objection:** "But the traditions persist. People have believed this for a thousand years. Does that collective memory count for nothing?"
  *   **The Answer:** "It counts as cultural history. It tells us about the people who told the story. But it doesn't tell us about the man. We can study the legend without needing the man to have existed. That actually protects the legend from being disproven by a spade."
  *   **The Thin Spot:** You are asking him to downgrade his life's work from 'finding truth' to 'studying myths'. He may not accept that consolation prize.

  **5. The Vicar (Theology)**
  *   **The Objection:** "With the Exodus, you speak of 'unfalsifiable by design' as if that's a flaw. For the faithful, the truth of the Exodus isn't in the mud, it's in the covenant. If you reduce it to a migration route, you've missed the point entirely."
  *   **The Answer:** "I agree the theological truth is separate. But the moment we teach it in a history class, or claim it happened in the 13th century BCE, we've moved it into the realm of historical claims. I'm trying to protect your covenant from being dependent on pottery shards. If the shards don't match, the covenant should still stand."
  *   **The Thin Spot:** You are drawing a boundary he doesn't accept. For him, if it didn't happen, the covenant is based on a lie. You are asking for a compartmentalization he theologically rejects.

  **6. The Vicar (Follow-up)**
  *   **The Objection:** "You imply the story was 'engineered' to stay unfalsifiable. That suggests deceit. These were people testifying to their liberation, not writing a puzzle to stop archaeologists."
  *   **The Answer:** "Not deceit, but genre. Ancient Near Eastern texts don't distinguish between 'history' and 'meaning' the way we do. By demanding a date and place, we are imposing a modern form on an ancient text. I'm suggesting we acknowledge that mismatch."
  *   **The Thin Spot:** "Engineered" was a poor word choice (which you used in your pitch). It sounds conspiratorial. You'll have to walk that back gently.

  **7. The Homer Obsessive (Literature)**
  *   **The Objection:** "You're treating the *Iliad* as a corrupted news report. It's a poem. When you ask 'what year did this happen?', you destroy the art. You're turning Achilles into a casualty count."
  *   **The Answer:** "I'm not asking the poem to be a report. I'm asking why we insist on treating it like one. The moment we say 'Troy, 1180 BC', we've changed the *Iliad* from a song into a statement. I want to let the song be a song, and the archaeology be archaeology, without forcing them to marry."
  *   **The Thin Spot:** You are assuming the audience cares about the distinction. The Homer guy wants the archaeology to *validate* the poem. You're telling him they shouldn't touch.

  **8. The Homer Obsessive (Follow-up)**
  *   **The Objection:** "But Schliemann found Troy. The date and place *did* work. So your rule about 'form' is proven by the success of the dig."
  *   **The Answer:** "Schliemann found a city, not the war. He found layers of destruction. Pinning the *war* to that layer is still a leap. The mound makes the war testable, yes, but 'testable' doesn't mean 'tested true'. We still argue about whether it was Greeks, or earthquakes, or local feuds."
  *   **The Thin Spot:** This is the strongest evidence against your thesis. Troy *does* look like the success story of pinning a date/place. You have to admit the correlation is strong without admitting causation.

  **9. The General Audience (The "Common Sense" Trap)**
  *   **The Objection:** "Surely, if enough independent sources mention a date and place, that makes it history? Even without a dig?"
  *   **The Answer:** "It makes it a historical *claim*. But without the physical anchor, it remains a claim based on testimony. Testimony is evidence, but it's not the same as material evidence. I'm arguing we need to be clear about which currency we're spending."
  *   **The Thin Spot:** Most people consider written records 'history' and archaeology 'prehistory'. You are demoting written records to 'claims' if they lack physical anchors. That's a hard sell.

  ***

  ### The Two Fatal Objections
  You cannot survive these two if they are pressed hard.

  1.  **The Postgrad's "Falsifiability" Attack:** If he stands up and says, *"Your thesis is that historicity is a matter of form. How do we test that thesis? What evidence would prove you wrong?"*
      *   **Why it kills you:** Because your answer will be philosophical. You will be forced to admit your talk is not history, but meta-history. In a history society, this marks you as an outsider playing word games.
      *   **Mitigation:** Pre-empt it. "I know this sounds like philosophy. I'm not offering a new way to dig, but a new way to decide *where* to dig."

  2.  **The Chair's "Ontology" Attack:** If he says, *"You are defining history as 'what we can verify'. That leaves out 90% of human experience. Is the history of the poor, who left no dates or places, not history?"*
      *   **Why it kills you:** It makes you sound elitist and positivist. It suggests that if you can't pin a date on a peasant's life, it didn't happen.
      *   **Mitigation:** Clarify immediately: "I am talking about *events*, not lives. And I am talking about the *claim*, not the *reality*."

  ***

  ### The One Question You Are Praying Nobody Asks

  **"If historicity depends on someone pinning a date and a place... does that mean an event isn't history until an academic says it is?"**

  *   **Why this is the trap:** It exposes the power dynamic in your thesis. It suggests that "History" is a status granted by experts, not a quality of the past. It implies that the Trojan War wasn't history for the 2,000 years between the event and Schliemann, but only became history when he stuck a flag in the mound.
  *   **The Consequence:** If you say "Yes," you are an arrogant gatekeeper. If you say "No," you undermine your entire thesis that the *form* (the pinning) is what creates the historical claim.
  *   **The Escape:** "No. The event is always the past. But 'History' is the conversation we have about it. You can't have a conversation without specific terms. The date and place are just the terms of engagement." (This is weak, but it's the best you have).

  **Final Advice:**
  You are right about the form/evidence distinction, but you are walking into a room full of people who think *evidence* creates the form. Do not try to convert the Camelot hunter or the Vicar. Your goal is to persuade the Chair that you aren't a relativist, and the Postgrad that you aren't a time-waster. Keep your answers shorter than you think you need to. Silence is your friend after you answer; let them sit with the distinction. Good luck.
