answer: |-
  This is a classic set of objections, often associated with the Cambridge tradition (G.E. Moore, C.D. Broad) and revitalized in contemporary meta-ethics. Your instinct that the argument is "too clean" is correct. It relies on a specific definition of pleasure that many modern hedonists have already abandoned to avoid exactly this problem.

  Here is a breakdown of how a careful hedonist would respond to your lecturer's notes, followed by an evaluation of whether hedonism survives the critique.

  ---

  ### Part 1: The Careful Hedonist's Critique

  A sophisticated hedonist (like Fred Feldman or Ben Bramble) would divide your lecturer's argument into three buckets: what they concede, what makes them wince, and what they reject as a category error.

  #### 1. What they accept as fair (The Phenomenological Point)
  **The Claim:** "Pleasures have nothing in common... No single feeling runs through all of them."
  **The Hedonist Response:** *Conceded, if "feeling" means "sensation."*
  A careful hedonist agrees that there is no single *qualitative sensation* (a "tingle" or a "glow") that is present in drinking beer, solving a puzzle, and hearing a pun. If Hedonism is defined as **Sensory Hedonism** (pleasure is a specific sensation), the heterogeneity objection is devastating. Bentham's "felicific calculus" struggles here because if there is no common currency, how do you measure the "amount" of pleasure?

  #### 2. What makes them wince (The Substitution Test)
  **The Claim:** "If they really were one thing, you could lift the pleasant-feeling part out of one experience and drop it into another... like swapping a battery."
  **The Hedonist Response:** *This begs the question.*
  This is the "too clean" part you sensed. The Substitution Test assumes that pleasure is an **ingredient** of experience (like sugar in a cake) rather than a **mode** of experience (like the light by which you see the cake).
  *   **The Category Error:** Consider *belief*. I believe "it is raining" and I believe "2+2=4." These have nothing phenomenologically in common. One is sensory, one is abstract. Can I "swap the belief part" out of the rain belief and put it into the math belief? No, that's nonsense. Belief is a *pro-attitude toward a proposition*, not an ingredient.
  *   **The Counter:** Modern hedonists argue pleasure is analogous to belief. It is a *pro-attitude toward a state of affairs*. The Substitution Test only works if pleasure is a sensation. By insisting on the test, the lecturer is defining pleasure as a sensation to prove it isn't a unified thing. That is circular.

  #### 3. What is just wrong (The "List" and "Natural Kind" Claims)
  **The Claim:** "Pleasure isn't a natural kind... once you have to write the pleasures out as a list, you've stopped having a theory."
  **The Hedonist Response:** *False Dilemma.*
  *   **Natural Kind:** Hedonism is an axiological theory (about value), not a metaphysical theory about physics. Pleasure doesn't need to be a "natural kind" like Gold (Au); it needs to be a *normatively relevant property*. "Justice" isn't a natural kind, but it can still be the basis of a theory.
  *   **The List:** If pleasure is defined functionally (e.g., "the conscious state of being pleased that X"), it is not a list. It is a single functional role played by many different states. Saying "Hedonism becomes a list" is a rhetorical flourish, not an argument. It only becomes a list if you define pleasures as *disparate sensations* rather than *instances of a single attitude*.

  ---

  ### Part 2: Does the Conclusion Survive the Fixes?

  If we grant the heterogeneity objection against *Sensory* Hedonism, does *any* Hedonism survive? And is Attitudinal Hedonism just Desire Satisfaction Theory (DST) in disguise?

  #### 1. The Survival of Hedonism
  The heterogeneity problem effectively kills **Sensory Hedonism**. You cannot build a unified theory of value on a "feeling" that doesn't exist as a unified feeling.
  However, it does **not** kill **Attitudinal Hedonism**.
  *   **The Move:** Attitudinal Hedonism (defended vigorously by Fred Feldman) defines pleasure not as a feeling, but as *taking pleasure in something*. It is the attitude of being "pleased that p."
  *   **The Unity:** The unity isn't in the *object* (beer, pun, relief) or the *sensation*, but in the *stance* the subject takes toward the object. This bypasses the Substitution Test because you aren't swapping a battery; you are recognizing the same functional stance in different contexts.

  #### 2. The "Desire Theory in Costume" Objection
  Your lecturer claims Attitudinal Hedonism is just Desire Satisfaction Theory (DST) wearing a costume. This is a famous objection raised by Chris Heathwood.
  *   **The Lecturer's Point:** To be "pleased that p" just means "to desire that p, and believe that p is true." If so, Hedonism collapses into DST.
  *   **The Hedonist's Defense (Why it's not a non sequitur):** There are cases where Pleasure and Desire come apart.
      1.  **Surprise Pleasures:** You hear a song you didn't know you liked. You take pleasure in it, but you had no prior desire to hear it. (DST struggles here; Hedonism handles it easily).
      2.  **Satisfied Desires without Pleasure:** You desire to check if you locked the door. You check; it is locked. Desire satisfied. But you feel no pleasure; it was neutral. (Hedonism says this added no value; DST says it did).
      3.  **Masochism/Depression:** You might desire to be sad (masochist) or fail to take pleasure in what you desire (depression).
  *   **Verdict:** The lecturer is overstating the case. Attitudinal Hedonism and DST are *extensionally similar* (they often agree on what is good), but they are *intensionally distinct* (they define the good differently). Calling it a "costume" is polemical. It is a distinct position, though it lives in the same neighborhood.

  #### 3. Is it a Change of Subject?
  This is the deepest philosophical worry.
  *   **Argument for "Change of Subject":** If the ancient hedonists (Epicurus, Bentham) meant "feeling" and we now mean "pro-attitude," have we preserved the theory or just kept the name?
  *   **Argument for "Rescue":** The core insight of Hedonism is that *conscious experience* is the locus of value, not external states of the world. Attitudinal Hedonism preserves this. It still says value depends on how the world seems to the subject, not just on the subject getting what they want (which could happen while they are unconscious or unaware).
  *   **Conclusion:** It is a **rescue**, but it comes at a cost. It makes Hedonism less intuitive (it's harder to explain "attitudes" than "feelings") and brings it dangerously close to Desire Theory, requiring careful boundary drawing (like the surprise pleasure cases above).

  ### Advice for Your Essay

  Your lecturer's summary is a "steelman" of the anti-hedonist view, but it relies on a specific, somewhat dated definition of pleasure. To write a strong essay:

  1.  **Pin the Substitution Test:** Argue that the Substitution Test presupposes Sensory Hedonism. If you define pleasure as a *mode of consciousness* rather than a *content of consciousness*, the test fails. (Use the "belief" analogy).
  2.  **Distinguish the Types:** Explicitly separate Sensory Hedonism (which likely dies by heterogeneity) from Attitudinal Hedonism (which survives).
  3.  **Engage the Desire Objection:** Don't let the lecturer's claim that "it's just Desire Theory" stand unchallenged. Cite the **Surprise Pleasure** counter-example. This shows that Attitudinal Hedonism is a distinct theory, not just a rename.
  4.  **Evaluate the "List" Charge:** Argue that a functional definition (pleasure = the satisfaction of a pro-attitude) is a theory, not a list. A list implies brute enumeration; a functional definition implies a unifying principle.

  **The Non Sequitur you suspected:**
  The leap from "Pleasure is not a single *sensation*" to "Pleasure is not a single *natural kind/property*" is the non sequitur. Properties like "truth" or "belief" are not sensations, but they are unified properties. The lecturer assumes that if it isn't a sensation, it isn't a unified thing. That is the weak link.

  **Key Names to Look Up:**
  *   **G.E. Moore:** *Principia Ethica* (The original source of the heterogeneity objection).
  *   **Fred Feldman:** *Pleasure and the Good Life* (The definitive defense of Attitudinal Hedonism).
  *   **Chris Heathwood:** "The Problem of Defining Pleasure" (The argument that Attitudinal Hedonism *is* Desire Satisfaction).
  *   **C.D. Broad:** *Five Types of Ethical Theory* (Classic discussion on heterogeneity).

  If you structure your essay around the shift from Sensory to Attitudinal Hedonism as a response to Heterogeneity, you will show you understand both the objection and the contemporary landscape.
