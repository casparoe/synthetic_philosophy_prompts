      *(Self-Correction during drafting)*: Make sure to emphasize that the lecturer's argument is *valid* against *Sensory* Hedonism, but the lecturer implies it kills *all* Hedonism. That's the leap the user needs to catch.

      *(Refining the Substitution Test critique)*: Use the "belief" analogy. It's the standard counter to the heterogeneity objection. Beliefs are heterogeneous (believing in god vs. believing in grass) but share a functional role. Pleasure might be the same.

      *(Refining the Desire point)*: Ensure the distinction between *intrinsic desire for experience* vs. *taking pleasure in experience* is clear.

