answer: |-
  # The Liberty Claim Audit (LCA)

  This is a triage procedure. It is designed to kill bad headlines quickly so you can spend your remaining time on the ones that survive. It requires one browser tab, one notepad, and 90 minutes.

  ### Step 1: Semantic Lock (15 minutes)
  **Question:** What specific operational definition of "liberal" is the claim using?
  **Action:** Search the source material (the index, the study, the press release) for the methodology section. Look for keywords: *economic freedom, civil liberties, democratic indices, social progress.*
  **Sufficient Answer:** You can name the specific metric (e.g., "Cato Institute Human Freedom Index" vs. "V-Dem Liberal Democracy Index").
  **Fail State:** The source uses "liberal" interchangeably with "progressive," "free," or "left-wing" without defining metrics.
  **Decision:**
  *   **If Fail:** Stop. You cannot evaluate the claim. The story is now "Why this ranking is meaningless." (Verdict: **No Fact**)
  *   **If Pass:** Write the definition at the top of your notepad. You are now locked into this definition for the rest of the audit. You cannot switch to a different sense of "liberal" later to save the claim.

  ### Step 2: Dimensional Dominance (30 minutes)
  **Question:** Does Country A beat Country B on *every* sub-component of the index, or do they trade off?
  **Action:** Open the data table for the index identified in Step 1. Look at the three biggest sub-categories (usually Economic, Civil, Political).
  **Sufficient Answer:**
  *   **Dominance:** A scores higher than B on all three major sub-categories.
  *   **Trade-off:** A scores higher on Economic, B scores higher on Civil.
  **Decision:**
  *   **If Dominance:** Proceed to Step 3.
  *   **If Trade-off:** You cannot write a flat claim. The ranking depends entirely on how much weight the index authors gave to Economics vs. Civil rights. This is a value judgment, not a fact. (Verdict: **Hedge** or **No Fact** depending on Step 5).

  ### Step 3: The Reality Check (De Jure vs. De Facto) (20 minutes)
  **Question:** Do the laws match the lived experience?
  **Action:** Quick search: "[Country A] [Country B] human rights report [Current Year] state department" or "Amnesty International." Scan for discrepancies between law and enforcement (e.g., free speech laws exist but journalists are harassed).
  **Sufficient Answer:** Both countries show consistent alignment between law and practice relative to each other.
  **Decision:**
  *   **If Consistent:** Proceed to Step 4.
  *   **If Divergent:** (e.g., A has better laws but worse enforcement than B). You must report the gap. A flat claim is misleading. (Verdict: **Hedge**).

  ### Step 4: Distributional Check (Whose Liberty?) (15 minutes)
  **Question:** Is the gain in liberalism distributed evenly, or does it benefit one group at the expense of another?
  **Action:** Search "[Country] liberty inequality" or check if the index adjusts for demographic disparities. Look for obvious cases (e.g., a country is economically liberal but restricts minority voting).
  **Sufficient Answer:** The liberty gain is general across the population.
  **Decision:**
  *   **If General:** Proceed to Step 5.
  *   **If Specific:** (e.g., "More liberal for corporations, less for workers"). The subject "Country A" does not have a single position. (Verdict: **No Fact**).

  ### Step 5: Signal vs. Noise (Magnitude & Weighting) (10 minutes)
  **Question:** Is the difference large enough to matter, and is it robust to weighting changes?
  **Action:** Look at the score difference. Is it 0.1 points or 10 points? Check if another major index (e.g., Freedom House vs. Cato) reverses the ranking.
  **Sufficient Answer:**
  *   **Robust:** Difference is >5% of the scale, and ranking holds across 2+ major indices.
  *   **Fragile:** Difference is <1% (within margin of error) OR Ranking flips if you swap indices.
  **Decision:**
  *   **If Robust:** You may write the claim flat (provided Steps 1-4 passed). (Verdict: **Settled**)
  *   **If Fragile:** The difference is statistical noise or an artifact of weighting. (Verdict: **No Fact**).

  ---

  ### Decision Matrix

  | Step 2 (Dominance) | Step 3 (Reality) | Step 4 (Distribution) | Step 5 (Magnitude) | **Final Verdict** | **How to Write** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Dominance** | Consistent | General | Robust | **Settled** | "A is more liberal than B." |
  | **Dominance** | Consistent | General | Fragile | **Hedge** | "A scores higher on index X, though the margin is narrow." |
  | **Trade-off** | Consistent | General | Robust | **Hedge** | "A is economically freer, but B protects civil liberties more." |
  | **Trade-off** | Divergent | Specific | Fragile | **No Fact** | "Rankings conflict because 'liberalism' is weighted differently." |
  | **Any** | **Any** | **Specific** | **Any** | **No Fact** | "The claim hides who wins and who loses." |

  **Epistemic vs. Metaphysical Failure:**
  *   **"We Don't Know" (Epistemic):** Use this if Step 3 fails due to *missing data* (e.g., "No recent reports on enforcement in Country A"). You can still write the story as an investigation gap.
  *   **"No Fact of the Matter" (Metaphysical):** Use this if Step 2 or Step 5 fails due to *conceptual conflict* (e.g., "Economic liberty vs. Social liberty"). There is no data that can resolve this; it is a value judgment. The story must be about the conflict, not the ranking.

  **Where You Will Fool Yourself:**
  *   **The "Overall Score" Trap:** You will be tempted to use the headline "Overall Score" from Step 1 to bypass Step 2. Do not do this. The overall score is a weighted average. Using it to settle a Trade-off (Step 2) is smuggling in the authors' values as facts.
  *   **The "Close Enough" Trap:** In Step 5, you will want to call a 0.5 point difference "significant." If another index reverses the ranking, it is not significant. It is noise.

  ---

  ### Case Run 1: Sweden vs. Norway

  **Step 1: Semantic Lock**
  *   *Search:* Most comparisons use the Cato Human Freedom Index or V-Dem.
  *   *Definition:* Let's assume Cato (combines economic and personal freedom).
  *   *Status:* Pass.

  **Step 2: Dimensional Dominance**
  *   *Data Check:* Sweden often ranks higher on *economic* freedom (more privatized welfare sectors, easier business start-up). Norway often ranks higher on *legal stability* and *social safety nets* (which some indices count as freedom from want, others as restriction).
  *   *Result:* **Trade-off.** Sweden wins on market metrics; Norway wins on security/legal metrics.
  *   *Implication:* The "Overall" ranking depends entirely on whether the index weights "business freedom" heavier than "social security."

  **Step 3: Reality Check**
  *   *Search:* Human Rights Reports.
  *   *Result:* Both are top-tier. Enforcement matches law in both.
  *   *Status:* Consistent.

  **Step 4: Distributional Check**
  *   *Search:* Inequality data.
  *   *Result:* Both are highly egalitarian. No major group is systematically excluded from liberty in either.
  *   *Status:* General.

  **Step 5: Signal vs. Noise**
  *   *Data Check:* The score difference between Sweden and Norway on major indices is typically <1%. In some years, they swap positions.
  *   *Result:* **Fragile.** The ranking flips based on minor methodology updates or base year changes.
  *   *Implication:* There is no stable signal.

  **Conclusion for Sweden/Norway:**
  You have a Trade-off (Step 2) and Fragile Magnitude (Step 5). The claim "Sweden is more liberal than Norway" relies on a specific weighting of economic vs. social metrics that is not objective. Furthermore, the difference is within the margin of error.
  **Verdict:** **No Fact of the Matter.**
  **Story Pivot:** Do not write "Sweden is more liberal." Write "Why Sweden and Norway keep swapping places on liberty rankings reveals a fight over what freedom means."

  ---

  ### Case Run 2: Canada vs. United States

  **Step 1: Semantic Lock**
  *   *Search:* Common comparisons use Fraser Institute (Economic) vs. Freedom House (Political/Civil).
  *   *Definition:* Must specify. Let's assume the journalist wants to use "Liberal" in the American sense (Left/Progressive) vs. Classical Liberal (Free Market).
  *   *Status:* **Fail.** The term is ambiguous.
  *   *Correction:* You must lock it. Let's lock it to **Classical Liberalism (Freedom from State Restriction)** for this audit.

  **Step 2: Dimensional Dominance**
  *   *Data Check:* US scores higher on *Economic Freedom* (lower tax, less regulation). Canada scores higher on *Civil Liberties* (healthcare access, gun control, drug decriminalization in some contexts).
  *   *Result:* **Trade-off.** Clear conflict. US is economically freer; Canada is socially safer/more regulated for collective good.

  **Step 3: Reality Check**
  *   *Search:* Enforcement.
  *   *Result:* US has higher incarceration rates (de facto less free for some groups). Canada has stricter border controls recently.
  *   *Status:* **Divergent.** De jure freedom vs. de facto outcomes differ by demographic.

  **Step 4: Distributional Check**
  *   *Search:* Who benefits?
  *   *Result:* US economic liberty benefits capital owners; Canada's social liberty benefits low-income health seekers.
  *   *Status:* **Specific.** "The Country" does not have a single position.

  **Step 5: Signal vs. Noise**
  *   *Data Check:* The gaps are large. US is significantly less taxed; Canada has significantly more social regulation.
  *   *Result:* **Robust.** The difference is real, not noise.

  **Conclusion for Canada/US:**
  You have Robust Magnitude (Step 5) but a Clear Trade-off (Step 2) and Distributional Specificity (Step 4).
  **Verdict:** **Hedge.**
  **Story Pivot:** You can write the piece, but you cannot say "Canada is more liberal." You must write "Canada is more socially liberal, while the US remains economically freer." The headline must reflect the dimension.

  ---

  ### Summary for Deadline

  **Sweden vs. Norway:**
  You cannot write the ranking. The difference is statistical noise built on a value judgment about weighting. If you write "Sweden is more liberal," you are lying about the certainty of the data. The story is the *incoherence of the comparison*, not the result.

  **Canada vs. US:**
  You can write the comparison, but only if you split the predicate. "More liberal" is false. "More economically liberal" (US) and "More socially liberal" (Canada) are true. If you refuse to split the predicate, you must hedge heavily.

  **Where I Might Be Wrong (Misfire Flags):**
  1.  **New Legislation:** If Sweden passed a major deregulation bill last week, Step 5 changes. Check news for the last 30 days.
  2.  **Index Bias:** If the only available index heavily weights property rights, it will bias toward the US/Sweden. I assumed you checked multiple indices in Step 5; if you only check one, Step 5 fails.
  3.  **Audience Expectation:** Your editor may demand a flat claim. This procedure gives you the ammunition to refuse, but it will not force them to accept it.

  \answer{no-fact-of-the-matter}
