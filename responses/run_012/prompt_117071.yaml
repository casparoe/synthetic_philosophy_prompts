answer: |-
  **Workshop: The Chain Gang**

  **Materials:** 200 paper strips, 4 tape rolls, 1 pair of scissors ("The Automator"), timer, scoreboard.
  **Participants:** 16 (1 Owner, 15 Workers).

  **Round 1: Hand Production (15 mins)**
  **Task:** Make paper loops (tape ends). 5 minutes production.
  **Pay:** 1 credit per loop.
  **Outcome:** Baseline productivity and income recorded publicly.

  **Round 2: Private Automation (25 mins)**
  **Introduce:** The Automator (scissors). Cuts paper 3x faster.
  **Rule:** Only the Owner holds the Automator. Workers bring strips to Owner for cutting.
  **Pay:** Owner keeps 50% of total value generated. Wages set at 0.6 credits/loop.
  **Outcome:** Total output spikes. Owner earns massive surplus. Fast workers (using scissors) produce 3x volume, earning 1.8 credits (beating Round 1). Slow workers earn less despite higher effort. Resentment targets the scissors, but fast workers defend the system.

  **Round 3: Common Automation (25 mins)**
  **Rule:** The Automator is communal. Workers rotate usage.
  **Goal:** Match Round 2's total output.
  **Pay:** 1 credit/loop equivalent.
  **Condition:** Once quota is met, work stops. Remaining time is "Leisure" (paid free time).
  **Outcome:** Quota met in 2 minutes. 3 minutes leisure. Everyone earns well. The scissors are celebrated.

  **Debrief (25 mins)**
  1.  **Feelings:** Ask Round 2 losers why they hated the scissors. Ask Round 3 workers why they loved them. Reveal the scissors never changed.
  2.  **Means of Production vs. Capital:** The scissors are a *means of production* (technical capacity). In Round 2, they functioned as *capital* (a social relation extracting surplus value). In Round 3, they reduced socially necessary labor time.
  3.  **Displacement & Re-absorption:** In Round 2, efficiency lowered wages for many. Marx argues machines only re-absorb workers if capital expands sufficiently to employ them elsewhere, which is not guaranteed. Here, efficiency became immiseration because gains were privatized.
  4.  **Neutrality:** Technology is not neutral; it embodies property relations. The "efficiency" gain was identical, but the distribution determined whether it was liberation or exploitation.

  **Predictable Failures & Fixes**
  *   **Owner Benevolence:** The Owner might share winnings. *Fix:* Instruct the Owner privately to maximize personal score; frame it as "fiduciary duty."
  *   **Bottleneck:** Workers waiting for cuts. *Fix:* This is a feature, not a bug. It demonstrates dependency on the capital holder.
  *   **Cynicism:** Students may call it rigged. *Fix:* Acknowledge simplification; emphasize that real markets structurally incentivize the Round 2 behavior.

  **Limitations (Instructor Supply)**
  This simulation cannot reproduce **macro-economic displacement** (unemployment outside the factory). In the game, everyone stays employed. You must explain that in reality, Round 2 would likely fire the slowest workers, increasing the "reserve army of labor" to drive wages down further. The game shows immiseration *within* employment; you must lecture on immiseration *via* unemployment and the long-term tendency of the rate of profit to fall.
