      **Workshop: The Chain Gang**
      **Materials:** Paper strips, tape, 1 pair of scissors ("The Automator"), timer, scoreboard.
      **Participants:** 16 (1 Owner, 15 Workers).

      **Round 1: Hand Production (15 mins)**
      Task: Make paper loops (tape ends). 5 minutes production.
      Pay: $1 per loop.
      Outcome: Baseline productivity and income recorded.

      **Round 2: Private Automation (25 mins)**
      Introduce "The Automator" (scissors). Cuts paper 3x faster.
      Rule: Only the Owner holds the Automator. Workers must bring strips to Owner to cut.
      Pay: Owner keeps 60% of total value generated. Remaining 40% distributed as wages ($0.50/loop).
      Outcome: Total output spikes. Owner earns massive surplus. 2-3 fastest workers match Round 1 earnings; the rest earn less despite higher effort/output. Resentment targets the scissors.

      **Round 3: Common Automation (25 mins)**
      Rule: The Automator is communal property. Workers rotate usage.
      Goal: Match Round 2's total output.
      Pay: Same as Round 1 ($1/loop equivalent value).
      Condition: Once quota is met, work stops. Remaining time is "Leisure" (paid free time).
      Outcome: Quota met in 2 minutes. 3 minutes leisure. Everyone earns well. The scissors are now celebrated.

      **Debrief (25 mins)**
      1.  **Feelings:** Ask Round 2 workers why they hated the scissors. Ask Round 3 workers why they loved them.
      2.  **Means of Production vs. Capital:** The scissors (means of production) were identical. In Round 2, they functioned as *capital* (value extracting surplus labor). In Round 3, they were tools for reducing socially necessary labor time.
      3.  **Displacement:** Discuss the "Lump of Labor" fallacy. In Round 2, displacement meant lower wages. In Round 3, it meant free time. Marx argues machines *can* lighten toil, but under capital, they lengthen work or intensify it.
      4.  **Neutrality:** Technology is not neutral; it embodies social relations. The "efficiency" gain was distributed differently based on ownership.

      **Predictable Failures & Fixes**
      *   *Owner Benevolence:* The Owner might share winnings. *Fix:* Instruct the Owner privately to maximize personal score; frame it as "job security."
      *   *Bottleneck:* Workers waiting for cuts. *Fix:* This is feature, not bug. It shows dependency.
      *   **Cynicism:** Students might call it rigged. *Fix:* Acknowledge simplification; emphasize the *structure* of incentives, not the game balance.

      **Limitations (Instructor Supply)**
      This simulation cannot reproduce the **macro-economic displacement** of workers (unemployment outside the factory). In the game, everyone stays employed. You must explain that in reality, Round 2 would likely fire the slowest 5 workers, increasing the "reserve army of labor" to drive wages down further. The game shows immiseration *within* employment; you must lecture on immiseration *via* unemployment.

