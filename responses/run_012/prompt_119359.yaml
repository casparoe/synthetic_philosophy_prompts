answer: |-
  The norm of "meaningful human control" (MHC) over autonomous weapon systems (AWS) is not merely a technical specification; it is a moral and legal artifact. To understand what theory of responsibility it presupposes, we must analyze why the presence of a human is deemed necessary when other parts of the same military-legal system assign liability without direct human agency or direct causal knowledge.

  ### I. Reconstructing the Implicit Theory of Responsibility

  The MHC requirement presupposes a theory of **Proximate Moral Authorship**.

  This theory holds that for a lethal decision to be legitimate, there must be a specific human agent who serves as the *sufficient moral reason* for that specific instance of harm. This is distinct from general liability. It is not enough that a human *could* be punished later (liability); a human must be the *author* of the act at the moment of execution (agency).

  This theory relies on three conjunctive conditions:
  1.  **Epistemic Access:** The human must understand the context and the nature of the target.
  2.  **Causal Efficacy:** The human's decision must be a necessary condition for the force to be used (the veto/authorization power).
  3.  **Answerability:** The human must be capable of articulating the reasons for the use of force in a post-hoc accounting.

  Under this theory, responsibility is not just about who pays the price or who is punished; it is about who *wills* the violence. The machine is viewed as a tool that extends human will, not an agent that exercises its own. If the machine selects the target and times the engagement, the human will is severed from the specific harm, rendering the act "orphaned."

  ### II. Control, Tracing, or Answerability?

  Does this rest on a Control Condition, a Tracing Condition, or something else?

  **The Control Condition:**
  If the theory rested strictly on a control condition ("I am responsible only for what I control"), MHC makes perfect sense: it engineers the system to ensure the human *does* control the outcome. However, this creates a direct conflict with **Command Responsibility**. Command responsibility ascribes liability precisely where direct control is absent (the commander did not order the atrocity and may not have known). If the MHC norm relied *strictly* on a control condition, it would imply that commanders *should not* be liable for subordinates' unauthorized acts, because they did not control them. Since the military system insists commanders *are* liable, the MHC norm cannot rest on a pure control condition. It rests on a design imperative to *maintain* control where possible, while the legal system uses command responsibility to *punish the loss* of control.

  **The Tracing Condition:**
  A tracing condition ("responsibility follows a causal chain back to a culpable origin") fits MHC well. MHC ensures the causal chain is not broken by algorithmic opacity. However, tracing is also compatible with corporate liability, where the "origin" is a culture or policy, not a specific individual decision at the moment of harm. MHC demands more than just a traceable chain; it demands a *proximate* human node in that chain. Tracing alone would allow for fully autonomous systems provided the programmers or commanders were negligent in their deployment. MHC forbids the deployment itself if the human link is broken, regardless of prior negligence.

  **The Answerability/Individualism Condition:**
  The strongest fit is **Answerability combined with Individualism**. The MHC norm presupposes that responsibility must be borne by an entity that can be called to account *for the specific reasons of the engagement*. A machine cannot explain why it chose Target A over Target B in moral terms. Furthermore, the norm assumes responsibility must be located in a *singular mind* at the point of engagement, rather than distributed. This explains the tension with corporate liability. Corporate liability accepts that responsibility can be diffuse; MHC insists it must be concentrated in the operator/commander at the moment of fire.

  **Underdetermination:**
  The practice is underdetermined between the **Tracing** and **Answerability** theories. Both license the same design requirement.
  *   *Tracing:* "We need a human in the loop so we can trace blame back to a person if it goes wrong."
  *   *Answerability:* "We need a human in the loop so that a person can justify the decision."
  The design norm (keep a human in) remains the same, but the justification shifts from backward-looking blame (Tracing) to forward-looking justification (Answerability). The practice does not distinguish between these; it simply demands the human presence that satisfies both.

  ### III. Which Defense is Necessary?

  The prompt offers two defenses:
  1.  *Machine Incapacity:* Machines cannot understand reasons/be punished.
  2.  *Responsibility Gap:* Without humans, there is no one to blame.

  The practice **needs Defense 2 (the Responsibility Gap)** more than Defense 1.

  Defense 1 is a metaphysical claim about moral agency. While true, the military-legal system is pragmatic. It deals with legal persons (corporations) who "understand" reasons only metaphorically. If the only barrier were metaphysical moral agency, corporate liability would also be impossible. The system *creates* liability where natural agency is diffuse.

  Defense 2, however, addresses the functional integrity of the legal system. The "Responsibility Gap" is a practical threat to discipline and justice. If harms occur and no human can be legally processed (court-martialed, sanctioned), the system loses its deterrent and retributive power. MHC is a prophylactic measure to prevent this gap from opening. Defense 1 explains *why* the machine cannot fill the gap; Defense 2 explains *why the gap must not exist*. The practice is driven by the necessity of maintaining a functional chain of accountability, making the "Gap" argument the operational engine of the norm.

  ### IV. Internal Consistency with Command and Corporate Liability

  Is the practice internally consistent given Command Responsibility and Corporate Liability?

  **Command Responsibility:**
  There is a **functional consistency but theoretical tension**.
  *   *Tension:* MHC says "You must control the weapon to use it." Command Responsibility says "You are liable even if you didn't control the subordinate." One demands proximity; the other accepts distance.
  *   *Consistency:* They function as complementary layers of a safety net. MHC is the *primary* constraint designed to ensure direct responsibility. Command Responsibility is the *secondary* liability assigned when MHC fails (i.e., when a commander fails to supervise the human operator or the system). Together, they aim to ensure there is *always* a liable human, either the operator (via MHC) or the commander (via negligence).

  **Corporate Liability:**
  Here, the inconsistency is sharper.
  *   *Tension:* Corporate liability distributes responsibility across a socio-technical system (procurement, coding, policy, execution). MHC concentrates responsibility on the end-user.
  *   *Analysis:* The military system is schizophrenic here. In procurement and development, it accepts corporate/collective liability. In execution, it demands individual liability. This suggests the MHC norm is not about responsibility *per se*, but about **legitimizing the specific act of killing**. We accept distributed responsibility for building the tank, but demand individual responsibility for firing the shell. MHC preserves the fiction of the "individual warrior" in an increasingly industrialized warfare environment.

  ### V. Implications of Alternative Theories

  **1. Adopting a Distributed/Systemic Account:**
  If we replaced the implicit theory with a distributed account (similar to corporate liability), the MHC requirement would relax significantly.
  *   *Design Change:* We would not need a human to authorize *each* engagement. Instead, we would require rigorous systemic auditing, algorithmic transparency, and strict Rules of Engagement programmed into the system.
  *   *Liability:* When a harm occurs, we would not look for a "trigger puller" to blame. We would assess the "system health." Was the training data biased? Was the deployment context inappropriate? Liability would be shared among developers, commanders, and procurement officers.
  *   *Result:* Fully autonomous weapons could be fielded, provided the *system* of accountability remained robust. The "human in the loop" becomes a "human in the system."

  **2. Accepting the Responsibility Gap:**
  If we adopted the view that some harms genuinely have no responsible agent (analogous to natural disasters or unavoidable accidents) and that this is an acceptable cost:
  *   *Design Change:* The MHC requirement would be discarded. Speed and efficiency would become the primary design norms.
  *   *Legal Change:* The system would shift from *criminal/retributive* justice to *compensatory* justice. Instead of court-martials, there would be no-fault insurance funds or state reparations for victims of AWS errors.
  *   *Result:* This would fundamentally alter the nature of war from a contest of accountable agents to a contest of risk management. It acknowledges that modern technology has outpaced our traditional concepts of individual moral agency.

  ### Conclusion

  The meaningful-control requirement presupposes a theory of **Proximate Moral Authorship**, demanding that a specific human mind be the sufficient reason for specific lethal acts. While it aligns with a **Tracing Condition** to prevent responsibility gaps, it relies most heavily on **Answerability**—the need for a human to justify the violence. This creates a theoretical friction with Command Responsibility (which assigns blame without direct control) and Corporate Liability (which distributes blame without a single mind), though functionally they work together to prevent impunity. Ultimately, the norm is a conservative force, attempting to preserve individual moral agency in a domain increasingly defined by systemic, distributed action. To move beyond it requires either accepting distributed liability for lethal acts or abandoning the demand for a responsible agent altogether in favor of compensation.
