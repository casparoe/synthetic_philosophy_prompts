  To move this number, you would need one of two things:

  1.  **A Solution to the Reference Class Problem:** A formal rule that selects the "maximally specific" reference class without relying on the probability it seeks to calculate. (Currently, this does not exist).
  2.  **A Physical Theory of Single-Case Chance:** A verification of propensity theory in quantum mechanics or cosmology that extends to macroscopic singular events (like civilization collapse).

  Until then, the disagreement is not resolvable by data, because the data (the single event) only appears once, at the end.

  ### You vs. Your Editor

  **The Disagreement:** This is not a disagreement about risk; it is a disagreement about **modal realism**.

  *   **Your Editor (>0.9):** She is a *Probability Realist*. She believes probability is a physical quantity waiting to be measured, like mass or charge. She thinks the number exists in the world, and our ignorance is the only barrier. She is treating "probability" as **ontological**.
