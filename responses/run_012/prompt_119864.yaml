  I assign a 25% credence to the claim that there is a fact of the matter about the correct probability for a singular event, such that admissible reference classes are pinned down by non-convenient factors and most generated numbers are wrong.

  Here is the machinery.

  ### The Sub-Questions

  1.  **Are there objective chances for one-offs?**
      *   **Probability:** 0.10
