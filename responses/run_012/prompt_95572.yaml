prompt: |-
  I am an undergraduate in a seminar on game theory and social philosophy, and I am trying to write a short position piece on a line my professor keeps using to close down discussion: that in program equilibrium the prisoner's dilemma dissolves. The setup, as we have been given it, is that each player submits a program that can read the other player's source code before choosing, and a profile of programs is an equilibrium when neither player could gain by submitting a different program. In class we have also been handed a distinction between three readings of such an equilibrium: a Nash equilibrium of the program-submission game, a fixed point of mutual simulation, and a proof-based equilibrium in which each program cooperates only if it can derive from the other's code that the other cooperates. I can see that the slogan is doing real work in my professor's argument, but I cannot tell which of several very different claims it is supposed to be making. Please lay out the precise theses the line could express, ranging from the trivial to the radical. For each, say whether it is plausible, whether it is substantive or merely verbal, and whether it would actually support the professor's use of it to dismiss the objection that the prisoner's dilemma shows cooperation is irrational. I would like the result as a menu I can bring to office hours, not a single interpretation.
