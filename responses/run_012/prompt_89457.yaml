prompt: |-
  I'm a fifth-year PhD student in ethics/political philosophy and I'm putting together a prospectus for a small internal grant — six months of work, maybe 40-50 pages of draft material by the end, plus a workshop in month five. My advisor thinks my idea is either obvious or incoherent and can't decide which, so I need you to make it into an actual project. The half-formed idea I keep circling: everyone says that when two people with deeply different value systems disagree, compromise is either impossible (no common currency to trade in) or corrupting (you sell out something you're supposed to hold unconditionally — the integrity objection). I think both objections are aimed at the wrong target. My hunch is we should split compromise into two very different things: trading across issues (I give ground on X to get ground on Y) and conceding within a single issue (I give up part of what I wanted on X alone). The across-issue case needs almost nothing — no shared scale, no commensurability, just the fact that the two parties rank the available bundles differently — so the standard 'incommensurability blocks compromise' argument doesnt touch it at all. The within-issue case is where the real philosophical action is, and I suspect the integrity objection is really an objection to a subspecies of it: concessions that are constitutive of the commitment, in the sense that making them changes what you'd be willing to accept next time in a way you couldn't in good faith endorse. So my candidate line is that a concession counts as a genuine compromise only if the conceder could still, in good faith, tell the people they speak for that they are pursuing the same thing; if not, it isn't a compromise, it's a conversion, and it's unclear the integrity objection even gets to call it that. A friend who does tax law keeps telling me 'that's just logrolling,' which is sort of my point and sort of not, and I haven't worked out which.

  What I need from you is the prospectus itself. State the question so it has a determinate answer — right now mine is a mood, not a question. Say why the existing positions leave it open, and in particular make the case for the across/within split as an argument rather than a stipulation: tell me what would show the split is doing real work and not just relabelling. Then the method, concretely, month by month — I'd rather test the line against hard cases (a vegetarian and a rancher horse-trading on a food standards board; two members of an ethics committee who disagree about animal research and split a protocol; a coalition partner who trades away a symbolic concession) than spin more taxonomy, but you tell me the right order to do it in, and where the case work has to come before the theory. Say what the possible conclusions are, which consideration would decide between them, and what would count as the project failing — I want at least one honest failure mode, not just 'it turns out to be complicated.' And give me a realistic scope check for six months: what to cut if I only get four, and what a workshop-sized deliverable looks like as opposed to the full thing. Don't bother with citations or a literature review, I'll slot those in myself; I just want the plan.
reasoning: |-
  Here's a thinking process that leads to the suggested prospectus:

  1.  **Analyze the User and Request:**
      *   **User:** 5th-year PhD student in ethics/political philosophy.
      *   **Task:** Create a prospectus for a small internal grant (6 months, 40-50 pages draft + workshop).
      *   **Problem:** Advisor thinks the core idea is either "obvious" or "incoherent." The student needs to sharpen the idea into a determinate project.
      *   **Core Idea:** Distinguish between *across-issue compromise* (logrolling/trading) and *within-issue compromise* (conceding on a single principle). Challenge the standard objections (incommensurability blocks compromise; compromise violates integrity). Argue that across-issue doesn't need commensurability. Argue that within-issue integrity objections only apply to "conversion" (changing the commitment itself), not genuine compromise (maintaining commitment while conceding ground).
      *   **Constraints:** No citations/lit review needed. Needs a determinate question, justification for the split (not just stipulation), concrete month-by-month method (case-driven), possible conclusions/failure modes, and scope check (6 months vs. 4 months, workshop deliverable).
      *   **Tone:** Professional, academic, rigorous, but pragmatic (grant prospectus style).

  2.  **Deconstruct the Core Idea & Address Advisor's Criticism:**
      *   *Advisor's worry:* "Obvious" (everyone knows logrolling exists) or "Incoherent" (what distinguishes compromise from conversion?).
      *   *Fix:* Make the distinction *normative* and *functional*, not just descriptive. It's not just "there are two types." It's "the objections fail against Type A and succeed only against Type B *if* we define compromise as maintaining agency/commitment."
      *   *The "Logrolling" Friend:* The student needs to clarify why this isn't *just* logrolling. Logrolling is usually pejorative or purely strategic. The student wants to rehabilitate it as a valid form of moral cooperation under pluralism.
      *   *The Integrity Objection:* Needs to be formalized. When does a concession become a betrayal? The "good faith representation to constituents" test is a good start but needs philosophical tightening (e.g., diachronic consistency of the agent).

  3.  **Drafting the Prospectus - Section by Section:**

      *   **Title:** Needs to be punchy but academic. *The Structure of Compromise* or *Integrity and Trade-offs*. Let's go with something that highlights the distinction. *Two Concepts of Compromise: Incommensurability, Integrity, and the Logic of Concession.*
      *   **Research Question:** Needs to be determinate. Not "Is compromise possible?" but "Under what conditions does moral compromise violate integrity?" or "Does the distinction between across-issue and within-issue compromise dissolve the standard objections?" Let's aim for: *Does distinguishing between aggregative (across-issue) and concessive (within-issue) compromise resolve the tension between pluralism and integrity?*
      *   **The Argument for the Split:** Why isn't this just labeling? It needs to predict different normative outcomes. If the split is real, across-issue should survive incommensurability arguments, and within-issue should survive integrity arguments *unless* it crosses the conversion threshold. The "work" the split does is isolating the specific locus of the moral cost.
      *   **Methodology:** Case-driven. The user mentioned specific cases (vegetarian/rancher, ethics committee, coalition partner). These need to be ordered logically. Start with the easy case (across-issue) to clear the deck, then move to the hard case (within-issue).
      *   **Timeline:** 6 Months.
          *   M1: Lit/Conceptual framing.
          *   M2: Across-issue cases (Logrolling).
          *   M3: Within-issue cases (Concession).
          *   M4: Drafting the "Conversion" threshold.
          *   M5: Workshop/Feedback.
          *   M6: Revision/Final Draft.
      *   **Outcomes/Failure Modes:**
          *   *Success:* The split holds, integrity objection is narrowed.
          *   *Failure:* The split collapses (all compromise is conversion) OR the split holds but doesn't help (integrity objection kills both anyway).
          *   *Honest Failure:* It turns out "good faith representation" is too vague to do the work, or that across-issue trading *does* require some shared value (refuting the incommensurability point).
      *   **Scope Check:** 40-50 pages is roughly 2 journal articles or 1 solid chapter. If time is cut, drop the coalition politics case (too empirical) and focus on the ethics committee/vegetarian cases (more conceptual). Workshop deliverable should be the core argument + 1 case, not the whole draft.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the question determinate enough?
      *   *Adjustment:* Frame it as a test of the "Incommensurability Thesis" and the "Integrity Thesis." The project tests whether the Across/Within distinction falsifies these theses.
      *   *Critique:* Is the "Logrolling" point addressed?
      *   *Adjustment:* Explicitly state that the project reclaims logrolling from being merely strategic to being a moral necessity under pluralism.
      *   *Critique:* Is the "Conversion" test robust?
      *   *Adjustment:* Define it as "Diachronic Agency." Can I endorse my past self's concession from my future self's perspective without repudiating the original commitment?
      *   *Critique:* Advisor said "Obvious or Incoherent."
      *   *Adjustment:* Address this in the "Significance" section. It's not obvious because the literature conflates the two. It's not incoherent because the "Conversion" test provides a boundary condition.

  5.  **Final Polish:**
      *   Ensure the tone matches a PhD prospectus (confident, precise, aware of stakes).
      *   Check the month-by-month against the 40-50 page goal. That's roughly 7-8 pages a month. Very doable.
      *   Make sure the "Failure Mode" is genuinely risky, not a fake humility.

  6.  **Final Review against constraints:**
      *   No citations? Check.
      *   Determinate question? Check.
      *   Argument for split? Check.
      *   Month-by-month? Check.
      *   Failure modes? Check.
      *   Scope check? Check.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **Project Title:** The Architecture of Concession: Incommensurability, Integrity, and the Two Concepts of Compromise

  **1. The Research Question**
  Current debates treat compromise as a unitary phenomenon, leading to a stalemate: either compromise is impossible under deep pluralism (due to incommensurability) or it is morally impermissible (due to integrity violations). This project asks: **Does distinguishing between *aggregative compromise* (trading across issues) and *concessive compromise* (yielding within an issue) dissolve the standard objections to moral compromise?**

  Specifically, I will test two hypotheses:
  1.  **The Incommensurability Hypothesis:** Aggregative compromise does not require a common metric of value, rendering the "no common currency" objection false for this class of cases.
  2.  **The Integrity Hypothesis:** Concessive compromise violates integrity only when it constitutes *conversion* (altering the commitment itself) rather than *accommodation* (maintaining the commitment while accepting a sub-optimal realization).

  The determinate answer sought is a set of necessary and sufficient conditions for when a concession counts as a betrayal of integrity versus a legitimate moral trade-off.

  **2. Why the Distinction Is Not Merely Stipulative**
  The advisor's concern that this is "obvious" (just logrolling) or "incoherent" (splitting hairs) is the central hurdle. To show the split is doing philosophical work rather than relabeling, the project must demonstrate that the two categories respond differently to normative pressure.

  *   **Predictive Power:** If the split is real, agents should be able to justify aggregative deals even when they cannot justify concessive ones in the same context. If I can show a case where an agent is rationally permitted to trade Issue X for Issue Y, but forbidden from conceding on Issue X alone, the distinction has normative bite.
  *   **The "Logrolling" Objection:** My friend in tax law calls this "logrolling." That is descriptively accurate but normatively thin. Logrolling is often dismissed as mere strategic bargaining. My argument is that under conditions of deep pluralism, aggregative compromise is not just strategic; it is the *only* form of cooperation that respects incommensurability. Rehabilitating this from "deal-making" to "moral cooperation" is the theoretical lift.
  *   **The Boundary Problem:** The split fails if "within-issue" concessions can always be redescribed as "across-issue" trades (e.g., "I concede on X now to buy goodwill for later"). The project must identify a hard limit where a concession cannot be externalized as a trade. This limit is the **Conversion Threshold**: the point where the concession changes the agent's future willingness to act in a way that repudiates the original commitment.

  **3. Methodology and Case Order**
  The project is case-driven. Theory will be developed *in response* to the failure of existing frameworks to explain these cases, not applied *to* them.

  *   **Case A (The Baseline): The Food Standards Board.** A vegetarian and a rancher must set labeling laws.
      *   *Test:* Can they trade labeling strictness (Issue X) for subsidy allocations (Issue Y)?
      *   *Goal:* Prove aggregative compromise works without shared values. If they can trade, incommensurability is not a blocker.
  *   **Case B (The Hard Case): The Ethics Committee.** Two members disagree on the moral permissibility of a specific animal research protocol. There is no second issue to trade. One must concede on the protocol itself.
      *   *Test:* Is this concession integrity-violating?
      *   *Goal:* Isolate the integrity objection. If the member concedes but maintains their opposition (voting "yes" but issuing a dissenting opinion), is integrity preserved?
  *   **Case C (The Boundary): The Coalition Partner.** A political party trades a symbolic concession (e.g., a flag vote) to pass economic policy.
      *   *Test:* When does a symbolic concession become a conversion?
      *   *Goal:* Define the Conversion Threshold. If the concession makes it impossible to explain the vote to their base without changing the definition of the party's core value, it is conversion, not compromise.

  **Order of Operations:**
  1.  **Cases First:** I will draft the case analyses before finalizing the definitions. This prevents the definitions from being rigged to fit the conclusion.
  2.  **Negative Testing:** I will actively try to collapse the distinction. I will attempt to redescribe Case B as Case A (e.g., "conceding on the protocol is trading principle for collegiality"). If this redescription holds, the split collapses. If it fails (because "collegiality" cannot commensurate with "animal suffering"), the split stands.

  **4. Timeline (6 Months)**

  *   **Month 1: Conceptual Framing & Case A.**
      *   Draft the argument against the Incommensurability Objection using the Food Standards Board case.
      *   *Deliverable:* 10 pages establishing that aggregative compromise requires only ordinal ranking of bundles, not cardinal utility.
  *   **Month 2: Case B & The Integrity Objection.**
      *   Draft the Ethics Committee case. Analyze why "selling out" feels different here.
      *   *Deliverable:* 10 pages distinguishing *accommodation* (I lose, but my principle stands) from *conversion* (I lose, and my principle changes).
  *   **Month 3: The Conversion Threshold (Theory).**
      *   Synthesize Months 1 & 2. Develop the "Good Faith Representation" test: *Can the agent justify the concession to their constituents without redefining the commitment?*
      *   *Deliverable:* 10 pages of theoretical grounding.
  *   **Month 4: Case C & Stress Testing.**
      *   Apply the Threshold to the Coalition Partner case. Attempt to break the theory (the "Negative Testing" described above).
      *   *Deliverable:* 10 pages refining the boundary conditions.
  *   **Month 5: Workshop & Feedback.**
      *   **Workshop Deliverable:** A 15-page "Core Argument" paper (Months 1-3 condensed) + 1 case study. Do not present the whole draft. Present the *distinction* and the *Conversion Threshold*.
      *   *Goal:* specifically ask participants to try to collapse the two types of compromise.
  *   **Month 6: Revision & Final Draft.**
      *   Integrate feedback. Polish the "Failure Modes" (see below) into the conclusion as limitations.
      *   *Deliverable:* Final 40-50 page manuscript.

  **5. Possible Conclusions & Deciding Considerations**

  *   **Conclusion 1 (Success):** The distinction holds. Aggregative compromise is immune to incommensurability objections. Concessive compromise is permissible *unless* it crosses the Conversion Threshold.
      *   *Decider:* The Food Standards Board case must clearly show cooperation without shared values.
  *   **Conclusion 2 (Partial Success):** The distinction holds, but the Integrity Objection kills concessive compromise entirely. Only aggregative compromise is viable under pluralism.
      *   *Decider:* If the Ethics Committee case shows that *any* concession on a fundamental principle is conversion, then concessive compromise is impossible. This is still a result (it limits the scope of compromise).
  *   **Conclusion 3 (Failure - Collapse):** It turns out all concessive compromise can be redescribed as aggregative (e.g., "I trade principle for social harmony").
      *   *Decider:* If I cannot find a case where the agent feels integrity loss *despite* gaining social harmony, the split is illusory.

  **Honest Failure Mode:**
  The project fails if the "Good Faith Representation" test proves too subjective to be action-guiding. If "what I can tell my constituents" depends entirely on the skill of the rhetorician rather than the moral structure of the act, then the Integrity Hypothesis collapses into a sociological claim, not a philosophical one. I will treat this as a genuine risk: if Month 3 drafting reveals the test is merely about "spin," I must pivot to a diachronic agency account (can *I* endorse this later?) or admit the project cannot solve the integrity problem.

  **6. Scope Check**

  *   **6-Month Scope (Full):** 40-50 pages. Includes all three cases, the full defense of the split, and the Conversion Threshold theory.
  *   **4-Month Scope (Cut):** Drop Case C (Coalition Partner). It is the most empirically messy. Focus entirely on the Food Board (Aggregative) and Ethics Committee (Concessive). Reduce final draft to 25-30 pages.
  *   **Workshop Deliverable:** Do not circulate 40 pages. Circulate a 12-15 page "Argument Summary."
      *   *Section 1:* The Stalemate (Incommensurability vs. Integrity).
      *   *Section 2:* The Distinction (Aggregative vs. Concessive).
      *   *Section 3:* The Ethics Committee Case (The hard test).
      *   *Section 4:* The Question for the Room: "Is there any concessive compromise that isn't conversion?"
      *   *Rationale:* This forces the workshop to engage the *philosophical mechanism*, not just copy-edit the draft.

  **7. Significance**
  If successful, this moves the debate from "Is compromise possible?" to "Which kind of compromise is required here?" It rescues logrolling from being a dirty word, framing it as a moral necessity in pluralistic societies, while preserving a robust account of integrity that prevents moral erosion. It resolves the advisor's dilemma: it is not obvious because the literature conflates the two; it is not incoherent because the Conversion Threshold provides a non-arbitrary boundary.
