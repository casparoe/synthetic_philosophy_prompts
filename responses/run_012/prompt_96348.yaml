      *Headline:* **The Best Decision Procedures for Low-Probability, High-Stakes Scenarios**
      *Deck:* *We stress-tested five leading frameworks against existential threats. Only one didn't bankrupt our testers.*

      *Intro:* When a stranger approaches you claiming to hold the fate of googols of lives hostage for the price of a lunch, standard cost-benefit analysis often breaks down. To find out which decision procedure protects your wallet without sacrificing moral coherence, we spent six months simulating encounters with five standardized muggers.

      *How We Tested:* Our protocol involved five distinct stress tests. The **Plain Mugger** demands compliance under threat of finite but astronomical harm at a fantastically small probability. The **Infinite Mugger** threatens an eternity of mild discomfort, creating an undefined expected value rather than merely a huge one. The **Crowd** presents multiple mutually incompatible threats, each demanding immediate satisfaction. The **Reverse Mugger** offers an enormous reward at vanishing odds. Finally, the **Unnamed Mugger** asserts a nonzero probability of harm without providing a distribution. We evaluated each procedure on ruin avoidance, computational overhead, and consistency across all five cases.

      *Top Pick:* **Bounded Utility Framework**
      *Verdict:* The most reliable daily driver for most users.
      By capping the maximum utility value any single outcome can contribute, this procedure neutralizes the Plain Mugger without ignoring genuine existential risks. In our testing, it successfully ignored threats where the harm exceeded the cap, preventing testers from handing over wallets based on slender probabilities. It handled the Reverse Mugger gracefully, declining to chase infinite rewards that required upfront cash. However, users should note a "flaw but forgivable": the cap is arbitrary. Setting it too low makes you indifferent to actual genocide; setting it too high leaves you vulnerable to the Infinite Mugger. Despite this calibration headache, it offered the best balance of safety and usability.

      *The Cautionary Tale:* **Naive Expected Value Maximizer**
      *Verdict:* Performs exactly as advertised, and is therefore unusable.
      This open-source procedure calculates expected value strictly by multiplying probability by magnitude. It is incredibly fast and transparent. In the Plain Mugger test, it correctly identified that a one-in-a-googol chance of destroying a universe outweighs the cost of a sandwich. Testers appreciated its honesty. However, in the Crowd test, the Maximizer recommended satisfying every incompatible threat simultaneously, logically committing the user to ruin regardless of action. One tester noted, "It told me to give away my wallet, then my car, then my house, and still calculated I was in deficit." It is a precision instrument that guarantees bankruptcy.

      *Upgrade Pick:* **Epistemic Validity Checker**
      *Verdict:* For power users who need to know if the question is real.
      Where the Maximizer computes answers, the Validity Checker assesses whether the input is well-posed. In the Unnamed Mugger test, where no probability distribution was supplied, this procedure returned an error code rather than a verdict. It treats the Infinite Mugger not as a bigger problem than the Plain Mugger, but as a category error, refusing to process undefined values. While this prevents exploitation, the computational overhead is significant; testers reported hesitation times of up to forty-five minutes while the system verified the mugger's claims. Recommended for high-stakes environments where malformed questions are common.

      *Sidebar: Product Spec — The Mugger's Motive*
      *Why does a being capable of simulating universes need your wallet?*
      A common concern among buyers is the internal consistency of the threat itself. If the agent possesses the technology to harm googols of lives, the marginal utility of five dollars should be negligible. Our lab found that procedures ignoring this spec mismatch performed poorly in long-term simulations. We recommend pairing your decision procedure with a heuristic that discounts threats where the requested cost contradicts the claimed capability.

      *Customer Testimonial:*
      "I was walking home when a hooded figure threatened to erase the next millennium unless I bought him a burrito. My old procedure started calculating the odds. I switched to the Bounded Utility Framework mid-conversation. He got annoyed and left. Five stars." — Gary T., verified purchaser.

      *The Bottom Line:*
      Decision theory is not just about finding the right answer; it is about using a system that functions in the real world. The Naive Expected Value Maximizer is technically accurate but practically dangerous. The Epistemic Validity Checker is robust but slow. For most people facing the occasional existential bluff, the Bounded Utility Framework provides sufficient protection without requiring a degree in metaphysics. Do not engage with the Crowd Mugger under any circumstances.

