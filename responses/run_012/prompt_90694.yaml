prompt: |-
  Hi — I'm a third-year student in an international criminal law seminar (we've spent the last month on Nuremberg and Tokyo) and I have to present my paper to the class next week. What I need from you isn't the paper, it's the Q&A prep.

  Here's the thesis. Everyone fights about Nuremberg and Tokyo as an ex post facto problem: were crimes against peace and crimes against humanity really crimes when the defendants acted, or did the Charters invent them and then apply them backwards — the standard reply being that aggressive war was already illegal under the Kellogg-Briand pact and customary law, so the Charters just declared what was already there. I want to argue that this is the wrong place to look. The retroactivity that actually bites isn't in the crimes, it's in the excuses. Superior orders, act of state, tu quoque, and arguably duress were either abolished outright or downgraded to mitigation only, and only for the losing side. So the tribunals didn't just make new offences, they made a new law of defences, applicable to the vanquished alone, and the same powers that wrote the rulebook also supplied the prosecutors, the bench and the charges. I want to claim that's a worse rule-of-law problem than the new crimes — harder to see, and untouched by the usual "but it was already illegal" reply. I also want to pull apart the four or five seperate complaints that get bundled under victors justice (selective enforcement, ex post facto offences, winners writing the rules and sitting in judgment, the tu quoque bar) and say which are genuinely about law and which are only about enforcement, because I think a couple of them are red herrings and I want to be the one who says so first.

  Now the room. Our professor is a doctrinal ICL person who's written on command responsibility, treats Nuremberg as the origin story of the whole field, and gets visibly irritated when students say victors justice — she'll go straight at whether I'm confusing substance with procedure, and she knows the Charter provisions better than I do. There's a Japanese exchange student writing her thesis on the Tokyo judgment who knows the separate opinions backwards and will not let me treat Nuremberg and Tokyo as one object; she'll want to know what happens to my excuse argument once the Tokyo charter, the murder counts and the dissents are on the table. There's a legal philosopher who teaches rule of law and thinks this is all the Hart/Fuller debate in costume, and will ask whether my objection is a positivist one or a natural law one. Two classmates who skimmed the reading and will ask something like isnt this just saying the winners write history. And one guy who's read a lot of popular history and thinks the real scandal is that Dresden and the firebombing of Tokyo were never on the docket. Nobody in the room has heard of my retroactive-defences distinction, so I have to sell it from scratch in ninety seconds before the objections even start.

  Give me a prep sheet: the objections in roughly the order they'll actually come, each phrased in the voice of whoever is going to make it, ranked by how much damage they do to my thesis rather than by how likely they are (I can handle the obvious ones), what I should concede upfront, what I should hold, a reply I can deliver in two minutes or less, and a note on where that reply is soft or where I'd be bluffing. Flag the objections that are really one objection wearing different hats, and the ones I can safely let bounce off. Then tell me the one question I'm hoping nobody asks — I'd rather find out from you now than in the room. Don't give me reading lists or citations, I can't look anything up while I'm standing there; I need arguments I can actually run out loud. And if part of what I sketched above is just wrong — if the superior-orders point is messier than I think, or if Tokyo breaks the whole thing — say so, don't help me defend something indefensible.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year law student (likely JD or LLB, possibly LLM given the seminar level) in an International Criminal Law (ICL) seminar.
      *   **Context:** Presenting a paper next week on Nuremberg and Tokyo Tribunals (IMT and IMTFE).
      *   **Topic:** Moving beyond the standard *ex post facto* (crimes) debate to focus on *retroactive elimination of defenses* (superior orders, act of state, etc.) as the true "Victors' Justice" rule-of-law problem. Also distinguishing between substantive vs. procedural complaints of "Victors' Justice."
      *   **Audience/Room:**
          *   *Professor:* Doctrinal ICL expert, pro-Nuremberg origin story, hates lazy "victors' justice" claims, sharp on substance vs. procedure.
          *   *Japanese Exchange Student:* Expert on Tokyo (IMTFE), knows dissents (Pal, Röling, etc.), will challenge conflating Nuremberg/Tokyo.
          *   *Legal Philosopher:* Hart/Fuller lens, positivist vs. natural law.
          *   *Two Classmates:* Skimmed reading, will ask generic "winners write history" questions.
          *   *Popular History Guy:* Obsessed with Dresden/Tokyo firebombing (tu quoque/selective prosecution).
      *   **Needs:** A prep sheet with objections ranked by *damage* to thesis (not likelihood), voiced by the specific questioner, with concessions, holds, 2-minute replies, and vulnerability flags. Also needs a "One Question I Hope Nobody Asks."
      *   **Constraint:** No reading lists/citations. Needs oral arguments. Must be honest about weaknesses (don't defend the indefensible).

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* The real rule-of-law violation isn't new crimes (Aggressive War/CAH), but the retroactive removal/limitation of *defenses* (Superior Orders, Act of State) applied only to the losers.
      *   *Secondary Claim:* "Victors' Justice" bundles distinct complaints; some are substantive law issues, some are enforcement issues.
      *   *Risk:* The IMT Charter *did* allow superior orders as mitigation (Article 8), not a total bar. The "Act of State" doctrine was rejected, but was it customary law at the time? Tokyo had significant dissent on these exact points.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Professor):* She will attack the "retroactive defenses" claim. Article 8 IMT Charter didn't abolish superior orders; it made it non-absolute. Customary law was already shifting.
          *   *Damage:* High. If the premise is factually wrong, the thesis collapses.
          *   *Voice:* Doctrinal, sharp.
          *   *Reply:* Acknowledge Article 8 nuance, pivot to the *application* vs. *text*, and the asymmetry (Allies didn't face this test).

      *   *Objection 2 (The Japanese Student):* Tokyo wasn't Nuremberg. Justice Pal's dissent explicitly argued the defense elimination was illegal. If I treat them as one, I ignore the specific legal culture clash in Tokyo.
          *   *Damage:* High. Undermines the generalization.
          *   *Voice:* Specific, textual, referencing dissents.
          *   *Reply:* Concede they are distinct, argue Tokyo proves the point *better* because the dissent highlights the unfairness more loudly.

      *   *Objection 3 (The Philosopher):* Is this Hart or Fuller? If law is just commands (Hart), the victors made the law. If law has morality (Fuller), was it immoral?
          *   *Damage:* Medium. Theoretical framing, doesn't kill the historical claim but challenges the normative weight.
          *   *Voice:* Abstract, conceptual.
          *   *Reply:* It's a Fullerian "internal morality of law" argument (generality, non-retroactivity), not just positivist "might makes right."

      *   *Objection 4 (Popular History Guy):* Dresden/Tokyo Firebombing. Why weren't *they* charged? That's the real victors' justice.
          *   *Damage:* Low/Medium. This is the *tu quoque* argument the user wants to disentangle.
          *   *Voice:* Moralistic, historical.
          *   *Reply:* That's selective *enforcement*, not substantive *law*. My point is about the rules of the game, not who got picked to play.

      *   *Objection 5 (Classmates):* "Winners write history."
          *   *Damage:* Low. Vague.
          *   *Voice:* General.
          *   *Reply:* Distinguish historiography from legal procedure.

  4.  **Refining the "Soft Spots" (Honesty Check):**
      *   *Superior Orders:* The user says defenses were "abolished outright." This is technically incorrect for Superior Orders (Article 8 IMT: "not free from guilt" but can mitigate). It was more absolute for "Act of State." I need to make sure the user concedes this nuance so the Professor doesn't shred them.
      *   *Tokyo:* The Tokyo Charter was slightly different. The dissent (Pal) argued the law *was* ex post facto. If the user says "defenses were removed," Pal would say "the crimes didn't exist." Need to ensure the distinction holds.
      *   *The "One Question":* What kills this thesis? The fact that the Allies *did* subject their own soldiers to military tribunals where superior orders were *not* a defense (e.g., Lehideux case or general military law). If the rule wasn't retroactive for the losers because it already existed for everyone, the thesis fails. Or, the question of whether "Act of State" was actually a valid defense in 1939.

  5.  **Structuring the Prep Sheet:**
      *   Follow the user's requested format: Objection (Voice), Damage Rank, Concede/Hold, Reply, Vulnerability Flag.
      *   Group the "Victors' Justice" distinctions.
      *   Identify the "Killer Question."

  6.  **Drafting the Content (Mental Simulation):**
      *   *Professor:* She'll cite Article 8. I need to admit Article 8 exists but argue the *practice* was stricter.
      *   *Japanese Student:* She'll cite Pal. I need to use Pal to support my argument (he saw the unfairness).
      *   *Philosopher:* Keep it simple. It's about predictability (Rule of Law values).
      *   *History Guy:* Dismiss gently as "enforcement" not "substance."
      *   *Killer Question:* "If Superior Orders wasn't a defense in *any* major military code of 1939, where is the retroactivity?" This is the weakest link in the user's "retroactive defenses" claim.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Oral arguments? Check.
      *   Honest about weaknesses? Check.
      *   Tone? Professional, law-school seminar appropriate.

  8.  **Final Polish:** Ensure the distinction between "Substance" (crimes/defenses) and "Procedure/Enforcement" (who sits on the bench/who gets charged) is clear, as that's central to the user's thesis. (Self-Correction: Make sure to explicitly tell the user that the "Superior Orders" point is the most vulnerable factual claim and they need to tread carefully there).

  9.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A prep sheet. I have ranked these by **damage to your thesis**, not likelihood. I have also flagged the factual soft spots you need to watch.

  ### The "Victors' Justice" Distinction (Your Opening Move)
  *Before you take questions, if you don't have time to say this in the presentation, put it on a slide or say it in your conclusion:*
  "I am distinguishing **Substantive Victors' Justice** (changing the rules of liability mid-game) from **Enforcement Victors' Justice** (selective prosecution). Most people complain about the latter (Dresden, etc.). I am arguing the former is the deeper rule-of-law violation."

  ---

  ### Objection 1: The Doctrinal Correction (The Professor)
  **Voice:** "You're conflating the text of the Charter with the application. Article 8 of the IMT Charter didn't abolish superior orders 'outright.' It said it 'shall not free [the defendant] from responsibility' but could be considered in mitigation. That wasn't new law; military manuals already rejected absolute superior orders. So where is the retroactivity you're claiming?"

  *   **Damage:** **Critical.** If the defense wasn't actually abolished retroactively, your core thesis collapses.
  *   **Concede:** Admit Article 8 allowed mitigation. Do not claim it was a total bar.
  *   **Hold:** Hold that *Act of State* was abolished outright, and that in *practice*, the Tribunals treated superior orders as virtually worthless compared to pre-war expectations.
  *   **Reply:** "You're right on the text of Article 8. It allowed mitigation. But my claim is about the *expectation* of the accused and the *asymmetry* of the rule. In 1939, a soldier reasonably believed obeying lawful orders was a complete shield. The Tribunal removed that shield retroactively. More importantly, they abolished 'Act of State' entirely. My point is that even if the text allowed mitigation, the *effect* was a new standard of liability applied only to the vanquished. The Allies didn't subject their own commanders to this same scrutiny."
  *   **Vulnerability Flag:** **High.** The Professor knows the case law better than you. If she cites a specific pre-1939 case where superior orders failed, you have no comeback. Stick to the *reasonableness of the defendant's expectation* at the time.

  ### Objection 2: The Tokyo Dissent (The Japanese Exchange Student)
  **Voice:** "You are treating Nuremberg and Tokyo as identical. In Tokyo, Justice Pal's dissent argued that the elimination of defenses was part of a broader illegitimacy. But Justice Röling's dissent argued the opposite—that the law was evolving. If you rely on Tokyo to prove 'unfairness,' how do you answer Pal's claim that the *crimes* were the problem, not just the defenses? You can't bundle them."

  *   **Damage:** **High.** It exposes that your "retroactive defenses" theory might not fit Tokyo as neatly as Nuremberg.
  *   **Concede:** Admit Tokyo was distinct (different Charter, different cultural context, different dissent landscape).
  *   **Hold:** Hold that Tokyo actually *strengthens* your argument because the dissents highlight the confusion over the rules.
  *   **Reply:** "I'm not bundling them as identical; I'm using Tokyo to show the instability of the rules. Pal argued the crimes were ex post facto. I'm arguing that even if we accept the crimes, the *defenses* were the trap. The fact that the judges in Tokyo couldn't agree on whether superior orders mattered proves my point: the law was unsettled. Applying an unsettled, restrictive standard of liability only to the losing side is the rule-of-law failure. Tokyo shows the cracks in the doctrine even more clearly than Nuremberg."
  *   **Vulnerability Flag:** **Medium.** Don't let her drag you into a granular debate about the IMTFE Charter specifics unless you know them cold. Keep it high-level: "Instability of law + One-sided application = Unfairness."

  ### Objection 3: The Selective Prosecution Trap (The Popular History Guy)
  **Voice:** "But isn't the real scandal that the Allies firebombed Dresden and Tokyo and weren't charged? That's the real victors' justice. Why are you focusing on legal technicalities about defenses when the hypocrisy is so obvious?"

  *   **Damage:** **Low.** This is the "Enforcement" complaint you explicitly want to set aside.
  *   **Concede:** Acknowledge the moral weight of the firebombing.
  *   **Hold:** Hold that this is a political/moral complaint, not a *legal* rule-of-law complaint.
  *   **Reply:** "That is the classic 'Selective Enforcement' argument. It's a valid moral critique, but it's not my legal one. If the Allies had charged their own pilots, but still applied retroactive rules about defenses to the Germans, my critique would still stand. I'm arguing about the integrity of the *rules of the game*, not who got picked to play. Focusing only on the firebombing lets us ignore the fact that the legal process itself was rigged against the defendants regardless of the charges."
  *   **Vulnerability Flag:** **None.** This is your strongest ground. You are distinguishing law from politics.

  ### Objection 4: The Philosophical Frame (The Legal Philosopher)
  **Voice:** "Is your objection positivist or natural law? Are you saying the law *was* valid but unfair (Hart), or that because it was unfair it *wasn't* law (Fuller)? If the Charters were the sovereign command, legally speaking, the trials were valid."

  *   **Damage:** **Medium.** If you get the theory wrong, you look amateurish.
  *   **Concede:** Acknowledge the tension.
  *   **Hold:** Hold that this is a "Rule of Law" (Fullerian) argument about the *internal morality* of law (predictability), not necessarily natural law.
  *   **Reply:** "It's a Rule of Law argument, closer to Fuller's 'internal morality.' Law must be prospective and clear to function as law. By changing the availability of defenses after the act, the Tribunals violated the principle of predictability. It doesn't matter if the Charter was a valid 'command' (Hart); if the command changes the rules backwards, it fails the basic function of guiding conduct. I'm arguing from the perspective of the defendant's ability to rely on the law as it stood."
  *   **Vulnerability Flag:** **Medium.** Don't get bogged down in Hart/Fuller semantics. Keep it on "Predictability."

  ### Objection 5: The "Winners Write History" Vague Attack (The Classmates)
  **Voice:** "So aren't you just saying the winners write history? Isn't that inevitable in any post-war trial?"

  *   **Damage:** **Low.** This is a cliché you can easily dismiss.
  *   **Concede:** None.
  *   **Hold:** Distinguish "History" from "Law."
  *   **Reply:** "No. History is interpretation; Law is procedure. Winners always write the history books. But in a legal system, winners shouldn't be able to change the rules of evidence and liability *during* the trial for only one side. I'm not complaining that the Allies won the war; I'm complaining that they acted as legislator, prosecutor, and judge in the same proceeding."
  *   **Vulnerability Flag:** **None.**

  ---

  ### The "One Question I Hope Nobody Asks"
  **The Question:** "If Superior Orders was *not* a complete defense in German military law or customary international law in 1939, then removing it wasn't retroactive. Do you have proof that a German defendant in 1939 reasonably believed Superior Orders was an absolute shield?"

  *   **Why this kills you:** Your thesis rests on the claim that the removal of defenses was *retroactive*. If the defense didn't exist (or was already limited) in 1939, there was no retroactivity. The IMT argued that international law already required moral choice. If the Professor or the Japanese student presses on the *customary status* of defenses in 1939, and you don't have a specific source, you are bluffing.
  *   **How to parry if asked:** "The *absolute* nature of the defense was the expectation. Even if there were exceptions, the Tribunal removed the presumption of obedience. The retroactivity lies in shifting the burden of proof regarding moral choice onto the defendant for acts that were legal under their domestic law at the time." (This is a bit wobbly, but it's your best save).

  ### Summary of Strategy
  1.  **Don't fight the "Crimes" battle.** Let them have Nuremberg/Tokyo on the definition of Aggressive War. Pivot immediately to **Defenses**.
  2.  **Be precise on "Superior Orders."** Do not say it was "abolished." Say it was "downgraded to mitigation and applied asymmetrically."
  3.  **Use the Philosopher.** When the Professor gets too doctrinal, pivot to the Rule of Law principle (Predictability). When the Historian gets too moralistic, pivot to Legal Procedure.
  4.  **Protect the Tokyo Flank.** If the Japanese student pushes hard, concede Tokyo was messier but argue that the *dissent* proves your point about legal uncertainty.

  **Final Warning:** Your claim that defenses were "applicable to the vanquished alone" is your strongest point. The Allies did not submit their own leaders to the IMT. Hammer that asymmetry. It is harder to refute than the customary law status of Superior Orders.
