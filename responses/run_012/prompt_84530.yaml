  My opening move: the common-consequence argument requires the 89% chance of a million to be the same item in both problems, but nothing in the description of the sure million singles out an event of probability 0.89 whose occurrence I could ever learn of; the decomposition of that option into an event plus a sub-lottery belongs to the notation, not to the act I am choosing. So your inference from my first choice to my second presupposes a substantive principle — that a lottery may be identified with its outcome distribution and re-partitioned at will — and that principle, not my choices, is doing the work. I have pilot data in which the same two distributions, re-described with one of their events split in two, produce a reversal. So tell me which it is: is the re-partitioning principle part of the independence axiom itself, or is it a separate assumption you need me to accept before the axiom can even be applied?
