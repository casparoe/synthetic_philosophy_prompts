answer: |-
  Consider a high-frequency trading firm whose algorithm triggers a market flash crash. The head of strategy authorized the specific risk parameters knowing they could destabilize liquidity during volatility. She had control, foresight, and her contribution was sufficient. Here, the desert gap is closed: a specific human is an appropriate target of blame. Yet, a standing gap remains open. Competitors cannot blame her because they employ similar strategies; regulators hesitate because they rely on the liquidity these firms provide; investors cannot object because they benefit from the profits until the crash occurs. Everyone who might hold her to account is implicated in the same chain of decisions or benefits from the same arrangement.

  This divergence shows that the structural failure is not about finding a responsible agent, but about finding a legitimate judge. The standing gap is not simply the desert gap seen from further away. The desert gap concerns the causal and moral link between an agent and an act; the standing gap concerns the normative authority between a judge and an agent. More evidence or deeper causal tracing would only solidify the head of strategy's guilt, thereby widening the desert gap's closure. It would not cleanse the complicity of the regulators or competitors. The missing element is not information about who caused the harm, but the moral clean hands required to sanction them.

  Remedies aimed at the desert gap fail here because they presuppose an accountability relation that the standing gap shows to be absent. Placing a human in the loop adds another implicated actor to the chain, not an external judge. No-fault liability treats the harm as a cost to be borne rather than a wrong to be judged, bypassing the need for standing entirely. Stricter certification assumes regulators have the standing to enforce rules, which the gap denies. These solutions attempt to locate a party to bear responsibility, but they cannot restore the community's authority to hold them to it.

  The strongest objection is that standing is a matter of interpersonal morality, too fluid and subjective to bear the weight of an institutional conclusion. Institutions require objective criteria for liability, not assessments of communal complicity. However, this objection misunderstands the nature of institutional accountability. An institution functions only if its designated accountability holders can legitimately sanction its agents. If those holders are compromised, the institution becomes a system of impunity masked by procedural rules. Ignoring standing converts accountability into theater, where someone is nominally responsible but practically untouchable.

  What would count against this position is a case where the autonomous system behaves in a way truly independent of human design or foresight. If an algorithm mutates its own code in a manner mathematically unpredictable to its creators, and no human could have controlled the outcome, then no human meets the conditions for blame. In such a scenario, the desert gap is primary because there is no moral agent to hold, regardless of who claims the standing to judge.

  \answer{Accountability fails not when no one deserves blame, but when no one can judge.}
