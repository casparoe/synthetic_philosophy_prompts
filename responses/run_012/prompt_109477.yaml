  2.  **Deconstruct Wittgenstein's "Family Resemblance":**
      *   *Source:* *Philosophical Investigations*, §§65-67.
      *   *Concept:* We define things (like "games" or "families") not by a single essential property (essence), but by a network of overlapping similarities.
      *   *Metaphor:* A thread/rope made of fibers. No single fiber runs the whole length, but the overlapping makes it strong.
      *   *Application to Family:* "Blood" is often treated as the essential property. Wittgenstein suggests "family" is a concept where shared history, care, presence, and yes, biology, overlap. You don't need *all* of them, but you need enough overlapping strands to count.
      *   *The "Lazy" Trap:* Saying "family is whatever you want." Wittgenstein isn't a relativist here; he's describing how language/concepts *work*. There are boundaries (a stranger isn't family), but the boundary isn't drawn by a single rule.
      *   *The Toast's Job:* Show that Ken has enough overlapping strands (time, care, conflict resolution, love) to fit the concept "family," even if he lacks the "blood" strand.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge Grandma. Use the recipe card metaphor provided in the prompt. It's the perfect hook.
