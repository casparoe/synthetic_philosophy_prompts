      *   *Refining the Pete Situation:* Don't say "Uncle Pete is wrong." Say "Some of us feel blood is the only thread that matters." Then show why that's a limited view of the rope.
      *   *Timing:* 3 minutes is roughly 400-500 words spoken at a moderate pace.

  4.  **Drafting - Iteration 1 (Mental Outline):**
