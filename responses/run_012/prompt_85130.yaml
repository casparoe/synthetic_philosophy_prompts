      *   *Hearer:* Dispersed public vs. Determinate hearer.
      *   *Authorship:* The 2013 pivot ("It's the world's red line") is a **re-attribution of agency**. Austin doesn't handle "I didn't say that, *We* said that, and *We* mean something else."
      *   *Rival Account:* **Discourse Theory** or **Constructivism** (Wendt, Adler-Nissen). These handle the social construction of meaning over time better than analytic philosophy of language. Or **Institutional Speech-Act Theory** (Searle's later work on status functions), but even that struggles with the *shifting* of status.
