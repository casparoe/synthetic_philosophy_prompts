answer: |-
  # Take-Home Final: AI Safety Paradigms

  **Time Allowed:** 75–90 minutes
  **Total Marks:** 20

  **Background**
  Consider a safety paradigm where you treat the model you are deploying as a potential adversary rather than as something you have made trustworthy. Call this **control**. The setup involves a strong model **U** you do not trust (it might be scheming) and a weak model **T** you do trust, plus a small budget of trusted human labour. Typical protocols include: **T** rates the suspiciousness of **U**'s output and, if it is over a threshold, **T** rewrites the output itself; or a second instance of **U** is asked to check the first instance's output for sabotage, with anti-collusion tricks like hiding whose output it is.

  Protocols get evaluated in a red-team/blue-team game: the red team plays **U**, knows the protocol in advance, and is trying to slip a sabotaged output past it while still producing outputs that look useful. Sabotage is operationalised as something like a logical error that passes the tests. What the paradigm claims for itself is that it does not assume **U** is aligned—only that **U** might not be.

  **Question**
  (a) Contrast the control paradigm with an alignment paradigm regarding their foundational assumptions about the model's motives. (5 marks)
  (b) Analyze the safety guarantee provided by the red-team evaluation. What exactly does a successful evaluation prove, and what does it fail to quantify? (5 marks)
  (c) Examine the role of trust and utility within this framework. Is trust eliminated? How does the protocol manage the tension between safety and usefulness? (5 marks)
  (d) Characterize the epistemic stance of the control paradigm. Is it a belief about the model's actual state, or something else? (5 marks)

  ***

  # Model Answer

  (a) The fundamental distinction lies in the assumption of motives. An alignment paradigm attempts to modify the model's internal objectives so that they match human interests; it assumes safety is achieved by making the model trustworthy. In contrast, the control paradigm makes no assumption about **U**'s internal objectives. It operates under the worst-case assumption that **U** is adversarial or scheming. Safety is not derived from **U** wanting to be safe, but from restricting **U**'s ability to cause harm regardless of its intent. Therefore, control does not require solving the problem of inner alignment, whereas alignment paradigms treat that as the primary bottleneck.

  (b) The safety guarantee provided by the red-team evaluation is strictly conditional on capability, not probability. A successful evaluation demonstrates that the trusted monitor **T** (possibly aided by humans) possesses the capability to detect or correct specific classes of sabotage attempted by a red team of comparable capability to **U**. It proves that within the tested budget of compute and ingenuity, the protocol holds. However, it fails to quantify the probability of catastrophe in deployment. It does not prove that **U** *will* attempt sabotage, nor does it guarantee safety against a red team with significantly higher capabilities than those used in evaluation. The result is a bound on the attacker's required capability to break the system, not a likelihood of the system failing.

  (c) Trust is not eliminated in the control paradigm; it is relocated. The claim that control "needs no trust" is false because the protocol bottoms out in trusting **T** and the human overseers. If **T** is compromised or the humans are incompetent, the safety guarantee collapses. Regarding utility, there is no inherent tension between safety and uselessness. A protocol that ignores **U** entirely and defers all output to **T** is perfectly safe but potentially useless. Therefore, control only earns its keep on the usefulness/safety frontier. The challenge is not making the system safe—that is trivial by rejecting all outputs—but making it safe while retaining the competitive capabilities of **U**. A usefulness cost is not evidence that the protocol is unsound; it is evidence of the tax required to maintain safety under adversarial conditions.

  (d) The epistemic stance of the control paradigm is a design stance rather than a belief about reality. Adopting control does not require believing that **U** is actually misaligned or malicious. It requires only believing that **U** *might* be. It is a precautionary principle operationalized through system architecture. By assuming the worst, the designers ensure safety even if their beliefs about the model's alignment are wrong. This distinguishes it from paradigms that rely on positive assertions about the model's psychology. The control paradigm remains robust even if the model is actually aligned, whereas alignment-based safety might fail if the model is secretly misaligned. Thus, control is a method for managing uncertainty about alignment, not a claim that misalignment is certain.

  ***

  # Marking Scheme

  **Total Marks: 20**

  **Part (a): Assumptions about Motives (5 marks)**
  *   **A (4-5 marks):** Clearly distinguishes that alignment seeks to make the model trustworthy (internal objectives), while control assumes the model may be adversarial and restricts capability regardless of intent. Explicitly states control does not require solving inner alignment.
  *   **B (2-3 marks):** States control treats the model as an adversary but fails to contrast this with alignment's goal of modifying objectives. May imply control assumes the model *is* evil rather than *might be*.
  *   **C (0-1 marks):** Vague definition; conflates control with general safety or corrigibility.
  *   *Common Error:* Thinking control assumes the model is misaligned rather than merely allowing for the possibility.

  **Part (b): Evaluation and Guarantee (5 marks)**
  *   **A (4-5 marks):** Identifies that the guarantee is conditional on the red team's capability budget. Explicitly states the evaluation yields a capability claim, not a probability of catastrophe.
  *   **B (2-3 marks):** Describes the red-team process but treats a successful evaluation as proof of safety in deployment. Fails to distinguish between capability bounds and probability estimates.
  *   **C (0-1 marks):** Describes the game mechanics without analyzing the logical limit of the guarantee.
  *   *Common Error:* Reading a red-team win rate as a probability of doom.

  **Part (c): Trust and Utility (5 marks)**
  *   **A (4-5 marks):** Notes trust is relocated to **T** and humans, not eliminated. Explains that perfect safety is trivial (defer to **T**) and the real constraint is the usefulness/safety frontier. Notes that usefulness costs do not imply unsoundness.
  *   **B (2-3 marks):** Acknowledges trust is needed for **T** but misses the "safe vs. useless" distinction. May argue that usefulness costs indicate a flaw in the protocol.
  *   **C (0-1 marks):** Claims control eliminates trust entirely.
  *   *Common Error:* Thinking a usefulness cost is evidence that the protocol is unsound.

  **Part (d): Epistemic Stance (5 marks)**
  *   **A (4-5 marks):** Characterizes the paradigm as a design stance (assume the worst) rather than a belief about the model's actual alignment. Highlights robustness to uncertainty.
  *   **B (2-3 marks):** Describes it as a belief that the model is dangerous. Fails to capture the precautionary nature of the stance.
  *   **C (0-1 marks):** Confuses the stance with a prediction of model behavior.
  *   *Common Error:* Conflating control with alignment or corrigibility.

  **Discriminator Note:**
  **Part (b)** is the real discriminator between an A and a B. An A student must recognize that the evaluation provides a *capability bound* rather than a *probability estimate*. B students typically treat the red-team success rate as a direct measure of deployment risk, missing the logical gap between "we couldn't break it" and "it won't break."

  **Common Errors Summary:**
  *   (a) Thinking control assumes the model *is* misaligned rather than *may be*.
  *   (b) Reading a red-team win rate as a probability of doom.
  *   (c) Thinking a usefulness cost is evidence that the protocol is unsound.
  *   (d) Conflating control with alignment or corrigibility.
