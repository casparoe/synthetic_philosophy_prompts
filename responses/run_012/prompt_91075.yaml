answer: |-
  Hey, it is great to hear the book is nearly there, and I love the sound of this character who keeps failing to be herself. That tension is exactly where the good stuff lives. You are right to worry about sounding like you just skimmed the back cover of her book, so I have drafted a run of questions that should let you dig into the mechanics of her argument without getting bogged down in jargon. I have woven them into this letter so you can read through them naturally, but I have kept each question and its corresponding follow-up in its own paragraph so you can find your place easily if you glance down at your phone during the talk. There are ten of them here, covering the specific angles you asked for plus a couple on the cost of this kind of thinking and the role of story, since that is your turf.

  Start by asking her about the conflict between the Monday self and the Tuesday self. You want to know if her view can actually distinguish between weakness of will and simply changing your mind. If my character decides on Monday not to drink and then drinks on Tuesday, is that a failure of will or just a new preference? If she says it is a failure of consistency, push back by asking whether consistency is the only virtue. You need to ask her if a person who happily changes their mind every day is necessarily irrational, or if her theory accidentally pathologizes growth and adaptation.

  Next, hit her on the circularity worry. If willpower is just the ability to frame a choice broadly, what gives us the power to hold that frame in the first place? It sounds like you need willpower to deploy the strategy that replaces willpower. If she tries to slide out by saying it is just a habit or a skill, ask her where the first instance of that skill comes from. You want to force her to admit whether there is a core agent doing the framing or if the framing is just something that happens to us, because if it is the latter, we do not have much control over whether we are virtuous.

  Then move to the question of what makes a bundle binding. She will almost certainly say commitment devices, like locking away the credit card or the cake. When she says that, you need to ask about the difference between the person who knows in advance she will cave and sets the lock, versus the person who is surprised by her own failure. Does her theory treat these two people as the same? If the surprised person thought she was strong enough without the lock, was she operating under a false belief, and if so, is weakness of will just a form of ignorance?

  You also need to press her on the just this once move. Your characters use this all the time, and her theory suggests it is the root of the problem because it breaks the bundle. Ask her what her view predicts about a temptation that genuinely cannot be repeated, a true one-off. If bundling is the whole story, then a unique temptation should be the most dangerous thing there is because you cannot link it to a pattern. If she says uniqueness does not matter, ask her why the frame matters at all, because that would suggest the content of the choice matters more than the structure.

  Now ask her to identify who the self is that does the bundling. Is this one person deliberating over time, or is it a committee that never meets? If it is a committee, who is the chair? You want to know if she is smuggling in a homunculus, a little person inside the head who watches the impulses and decides which ones to count. If she says it is just neural processes competing, ask her why we feel like a single person making a mistake rather than a battlefield where one side won.

  This leads directly into the question about blame. If failing to resist the cake is just a cognitive error in framing, like miscalculating a tip, why do we still get angry at the person who caves? We do not get angry at someone for bad math. If she says we should stop getting angry, ask her if she is willing to abolish moral responsibility entirely. If she says we should still get angry because it helps reframe future choices, ask her if that means anger is just a tool for manipulation rather than a genuine moral response.

  Since you are a novelist, you need to ask her about the actual moment of caving. From the inside, what is happening in that second when the frame collapses? Is it a sudden blindness, or is it a crowded room of voices? You want her to describe the phenomenology, not just the economics. If she gives you a dry answer about discount rates, push her to describe the feeling of the surrender, because that is the only thing your readers will care about and if her theory cannot describe the feeling, it might not explain the behavior.

  Ask her whether this wide-angle framing makes life too calculated. If every slice of cake is a vote for a lifetime of cake, do we lose the ability to be spontaneous? Is there any room for a choice that is just a choice, without the weight of ten years behind it? If she says spontaneity is just another frame, ask her if that means we are never actually free, just constantly managing our own illusions of freedom.

  You should also ask her about the role of narrative in this process. You bundle choices over time by telling a story about who you are, so is willpower actually just storytelling? If she agrees, ask her whether a better story is enough to fix a broken will, or if the story is just the excuse we give after the fact. This is your territory, so you want to see if she thinks fiction can be a commitment device.

  Finally, ask her whether her view allows for redemption. If someone has spent ten years choosing slice by slice, have they trained themselves to be unable to see the bundle? Is there a way to learn to see the wide angle, or are some people just stuck in the myopia? If she says it is learnable, ask her what the first step is, because if the first step requires the very willpower they lack, then she has not solved the problem.

  I hope this gives you enough traction to keep the conversation sharp without turning it into a lecture. You know your character better than anyone, so if she drifts too far into the abstract, just pull it back to what your character feels in the room when she reaches for the drink. That concrete detail will keep you grounded.

  Regarding my confidence in reconstructing her position from your description, I am moderately confident, perhaps around seventy-five percent. The language you used, specifically hyperbolic discounting and the idea of bundling choices to resist temptation, points very strongly toward the work of George Ainslie and the field of picoeconomics, or perhaps someone like Thomas Schelling who wrote on self-command. The claim that willpower is not a muscle but a framing mechanism is a direct counter to the ego-depletion theory popularized by Roy Baumeister, which suggests I have the right intellectual neighborhood. The part I am least sure about is whether she treats the bundling as a conscious deliberative strategy or as an unconscious heuristic. You described it as seeing the slice as part of a pattern, which sounds conscious, but many behavioral economists argue these frames are automatic. If she argues the framing is unconscious, some of these questions about deliberation might need to be adjusted on the fly to focus on environmental cues rather than internal choice.
