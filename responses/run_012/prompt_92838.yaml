  Your intuitions are more consistent than you think, but there is a mathematical misconception in your analysis of Case 5 that is obscuring the principle. Once corrected, a single, simple rule emerges that captures almost all your verdicts.

  ### The Principle: Causal Grounding with a Negligibility Clause

  **"Do not act on expected utility calculations derived from claims that lack a causal mechanism consistent with your best model of reality, unless the cost of action is trivial."**

  This principle combines **epistemic skepticism** (trust the model, not the claim) with **pragmatic tolerance** (if it costs nothing, why not?).

  Here is how it maps to your seven cases:

  *   **Case 1 (Matrix Lord, $10^{-50}$):** **Reject.** The mechanism (magic/Matrix Lord) is ungrounded in your reality model. The probability is treated as effectively zero.
  *   **Case 2 (Matrix Lord, $10^{-6}$):** **Reject (with nuance).** *This is the tension point.* If you accept this based on the *Matrix Lord* threat, you violate Case 1. To stay consistent, you must tell yourself you are paying because there is a $10^{-6}$ chance he is a *normal mugger with a gun*, not because you believe he can torture $10^{50}$ people.
  *   **Case 3 (Broken Arm, $10^{-6}$):** **Accept.** The mechanism (physical violence) is grounded. Standard risk assessment applies.
  *   **Case 4 (Reverse Mugging, $10^{-40}$):** **Reject.** Same as Case 1. The mechanism is ungrounded magic. The sign (save vs. torture) doesn't change the epistemic validity.
  *   **Case 5 (Physics Risk, $10^{-20}$):** **Accept.** The mechanism (chain reaction) is grounded in known physics. The probability, while tiny, is derived from a robust model, not a stranger's assertion.
  *   **Case 6 (Repeated Muggers):** **Reject.** The pattern updates your model of the *source*. The mechanism is now "organized scam," which makes the probability of the *claim* being true drop even further.
  *   **Case 7 (Penny Mugging):** **Accept.** The cost is trivial (negligible). The "Negligibility Clause" overrides the "Causal Grounding" requirement.

  ### The Mathematical Correction
  You wrote: *"Case 5 breaks that, since there I act on a probability way smaller than the 1 in 10^50 I blow off in case 1."*

  This is the source of your confusion. Mathematically, **1 in $10^{20}$ is vastly larger than 1 in $10^{50}$**.
  *   Case 1 Probability: $0.000...001$ (50 zeros).
  *   Case 5 Probability: $0.000...001$ (20 zeros).

  Case 5 is $10^{30}$ times *more likely* than Case 1. Your intuition to accept Case 5 and reject Case 1 is actually supported by a simple probability threshold (e.g., "ignore anything less than 1 in $10^{30}$"). However, the **Causal Grounding** principle is stronger because it explains why you would *also* reject a Magic claim at 1 in $10^{20}$, while accepting a Physics claim at the same odds.

  ### The New Case: Honest Source, 1 in $10^{30}$
  **Verdict: Act (Pay/Comply).**

  **Reasoning:** Your principle relies on *Grounding*. A source you "have good reason to think is honest" provides the Grounding that the stranger lacked. If the source is reliable (e.g., a trusted scientific body or a verified AI), the probability estimate is no longer a magical assertion; it is a data point from a trusted model. Since $10^{-30}$ is within the realm of "physically possible" (unlike $10^{-50}$ magic), and the source is trusted, the Causal Grounding requirement is met.

  ### The Sacrifice: Which Verdict Must You Drop?
  To keep the rule simple and consistent (and honoring your preference to keep Cases 5 and 6), you must tighten your stance on **Case 2**.

  **You must drop the verdict that you pay because of the $10^{50}$ torture threat.**

  *   **Why?** If you accept Case 2 because the *Matrix Lord* threat is credible at 1 in a million, you undermine your refusal of Case 1. If the mechanism is impossible (Case 1), it doesn't become possible just because the stranger asserts a higher probability (Case 2).
  *   **The Fix:** You can still keep the *action* of handing over the wallet in Case 2, but you must change your *reasoning*. You are not paying to prevent $10^{50}$ tortures; you are paying to prevent a 1-in-a-million chance that this is a **normal mugger who will hurt you physically**.
  *   **Consistency:** This aligns Case 2 with Case 3 (Broken Arm). It treats the stranger as a potential physical threat (Grounded), not a metaphysical one (Ungrounded).

  ### Summary
  Your actual belief system is **Realist Expected Utility**. You maximize utility, but you refuse to plug "magic numbers" into the equation unless the cost is negligible. You trust physics (Case 5) and policy (Case 6) over metaphysical claims (Case 1 & 4). To make this watertight, admit that **no probability assigned to a magic claim by a stranger is high enough to warrant payment based on that magic claim alone.**
