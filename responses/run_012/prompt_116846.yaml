  # Project Proposal: Constituency Uncertainty and the Limits of Moral Decision Theory

  **Project Summary**
  Standard frameworks for moral uncertainty assume a fixed domain of moral patients while weighing competing normative theories (e.g., utilitarianism vs. deontology). However, significant moral disagreement occurs "upstream" of theory selection: we are often uncertain about *who* or *what* constitutes the moral community. This project investigates "constituency uncertainty"—uncertainty about the domain of morally considerable beings. I will argue that standard decision-theoretic machinery cannot represent this uncertainty without circularity, as it presupposes a fixed set of affected parties to calculate expected moral value. Over three months, I will develop a taxonomy of constituency uncertainty and test whether existing formal tools can accommodate it using cases like insect sentience, AI systems, and holistic entities.

  **Research Question**
  Does the standard expected moral value framework entail a fixed-domain assumption that renders it incapable of representing constituency uncertainty without circularity?
  Existing positions leave this open because they typically model constituency disputes as disagreements between first-order theories (e.g., Theory A includes insects, Theory B does not). This approach smuggles in a determinate answer about who counts within each theory, failing to capture the agent's uncertainty about the constituency *itself* independent of theory selection. If the set of options and affected parties must be fixed to run the calculus, the machinery cannot handle uncertainty about those very sets.

  **Methodology**
  The project will proceed over three months, producing approximately 8,000–10,000 words.

  *   **Month 1: Taxonomy and Conceptual Distinction.** I will distinguish three kinds of constituency uncertainty to ensure the problem is not monolithic: (1) *Property Uncertainty* (uncertainty about whether a kind possesses the grounding property, e.g., insect sentience); (2) *Boundary Uncertainty* (uncertainty about where the threshold lies on a continuum, e.g., neural complexity); and (3) *Ontological Uncertainty* (uncertainty about the unit of moral concern, e.g., individuals vs. ecosystems). I will draft the conceptual argument for why these cannot be reduced to standard theory uncertainty without loss of information.
  *   **Month 2: Formal Stress Testing.** I will test whether standard decision frameworks can model these three kinds without presupposing a fixed constituency. I will use four stress-test cases: insects (property), embryos (boundary), AI systems (substrate neutrality), and ecosystems (ontological). The goal is to attempt a formal representation of expected value where the set of patients is a variable rather than a constant.
  *   **Month 3: Synthesis and Result.** I will synthesize the findings into a final paper. The result will be a taxonomy plus an adequacy result: either demonstrating that standard tools require a "constituency weight" parameter they cannot currently derive, or proving an impossibility result showing that fixed-domain assumptions are necessary for the math to function.

  **Expected Output and Failure Conditions**
  The final output will be a draft paper suitable for submission to a journal in moral philosophy or decision theory. A successful result will show that constituency uncertainty requires a revised framework (e.g., second-order uncertainty over domains). The project will count as failing if: (1) every kind of constituency uncertainty collapses into ordinary theory uncertainty (i.e., it is just uncertainty about which theory is true); or (2) the formal tools prove too blunt, rendering the distinction merely verbal rather than structural.

  ***

  # Feasibility & Critique Notes

  **Realistic Scope for 3 Months**
  Three months is sufficient for a conceptual taxonomy and a "proof of concept" regarding the formal limitations, but it is **too short for a rigorous axiomatic proof**. You should aim for a conceptual-formal argument (showing where the equations break or require ad hoc parameters) rather than a full impossibility theorem. The 8–10k word target is realistic if you avoid getting bogged down in extensive literature review (which you noted you will handle separately).

  **What Is Most Likely to Be Too Big**
  The **formal stress testing in Month 2** is the biggest risk. Trying to formally model "vague boundaries" or "holistic entities" within decision theory can quickly become a quagmire of supervaluationism or fuzzy logic that distracts from the core philosophical point. Limit the formalism to simple expected value equations to show where the variables go missing, rather than building a new logic from scratch.

  **What Would Change My Mind About the Framing**
  I would abandon the "constituency uncertainty" framing if it turned out that **all constituency disputes are reducible to first-order theory disputes**. For example, if "uncertainty about insects" is just "uncertainty about whether Utilitarianism is true," and Utilitarianism *defines* its constituency clearly, then there is no distinct structural problem. To maintain the framing, you must show cases where an agent is uncertain about the constituency *even holding a first-order theory fixed* (e.g., a Utilitarian unsure if insects feel pain). If you cannot find cases where the uncertainty persists within a single theory, the distinction collapses.

  **Where My Reasoning Is Most Likely to Fail**
  The reasoning risks failing by **assuming decision theory is the appropriate medium** for this problem. Constituency uncertainty might be meta-ethical or metaphysical rather than decision-theoretic. If the problem is that we lack the metaphysical facts about sentience, no amount of decision-theoretic tweaking will solve it. The proposal assumes the bottleneck is the *modeling*, but the bottleneck might be the *ontology*. Additionally, relying on an intuitive boundary between "who counts" and "what theory is right" is contested; many theorists argue the constituency is determined by the theory, making the separation artificial.

  \answer{This project argues that constituency uncertainty structurally breaks standard moral decision theory and requires a revised framework.}
