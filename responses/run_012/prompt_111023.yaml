  Ok, for a little phil-of-mind/lit blog I'm putting together, I want a piece of sustained irony: write me a fake product review — think an over-earnest Amazon review, 5 stars or maybe 2, roughly 500-600 words — for an app I'm calling "Soliloquy: The Private Language Notebook." The whole pitch of the thing is that it lets you mint your own private words for your own sensations, and the meaning is guaranteed entirely by your own inner act of naming — no dictionary, no other speakers, nothing. The reviewer should be a true believer who deadpans straight into every trap the private language argument sets: she cant tell whether she's using her word the same way today as yesterday, "it seems right" and "it is right" keep collapsing into each other, the diary ends up unreadable even to her, and it's obviously useless for telling anyone anything — and she still concludes it's the most authentic journaling tool on the market. The jokes have to come out of the philosophy, not out of puns; a Wittgenstein person should laugh and a smart undergrad should still follow it. Please don't name or quote any real philosopher or book, I want it to stand on its own.
