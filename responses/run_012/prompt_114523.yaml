prompt: |-
  ok so I'm a backend dev, no real philosophy training beyond one intro course I mostly slept through, and I keep getting into dumb arguments at work about whether the brain is basically a computer. My coworker says obviously it is, we're just meat running code. I say that feels like a metaphor that got out of hand but I can't actually say why without sounding like I'm just being contrarian. I want to settle this properly instead of vibing about it.

  Can you build me a decision tree / flowchart that starts from stuff a person already believes and walks them down to a named position on "is the brain a computer?". I want the branch nodes to be concrete questions or cases someone can answer without already knowing what the position is called — so no node that just asks "are you a functionalist?" or "do you believe in multiple realizability?" or anything where the label is the question. Good nodes would be stuff like: what they'd say about a perfect neuron-for-neuron simulation of you, about whether a wall or a bucket of water or a rock "computes" anything, about the Chinese room setup, about a giant lookup table that hardcodes every input-output pair, about whether the same mind could run on clockwork or a huge spreadsheet.

  A few things I really want the tree to actually test, because this is exactly where my coworker and I keep talking past each other:
  - whether "this system computes X" is a fact about the system or a description we lay on top of it (the "anything can be a computer if you squint hard enough" worry)
  - whether "the brain computes" means it literally does computation, or just that computation is the best model we've found so far
  - whether the story has to be digital, or whether analog / continuous / messy physical stuff changes the answer
  - whether the specific causal wiring matters, or only the input-output map
  - whether the substrate matters at all, and if it doesn't, what's supposed to make one physical implementation the "right" one

  Build it out as questions first and positions second — here are the splits, here's the space of answer combos, and then here's where the actual named views land in that space. I want leaves like: classical symbolic / GOFAI-style computationalism, connectionism, the "mind is whatever the brain computes" functionalist line, the mechanistic "computation is a physical process the system really carries out" view, the dynamicist and enactivist "it's not a computer at all" camp, biological naturalism, pancomputationalism, and the deflationary "computation is observer-relative" line. If some combination of answers doesn't match any real position, tell me that too, and whether the slot is empty because the view is incoherent or just because nobody's bothered with it.

  Also be honest about which leaves the tree can't actually tell apart. I'd way rather know that two positions come out identical on every question than get a fake clean separation. And please don't just pad it with the usual encyclopedia menu of positions — the whole point is that the questions do the sorting, not the names. Maybe 7 or 8 branch questions and up to ~10 leaves? This is for a reading group I'm dragging my team into, so it needs to be followable by people who, like me, never really read any of this stuff.
