          *   *Key Steps:*
              1.  Assume $\exists p (p \land \neg Kp)$ (There is an unknown truth).
              2.  Apply Knowability Principle (KP): $(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$.
              3.  Distribution of $K$ over $\land$: $K(A \land B) \to (KA \land KB)$.
              4.  Factivity: $K\neg Kp \to \neg Kp$.
