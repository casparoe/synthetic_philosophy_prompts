answer: |-
  # Specification: Theory of Pleasure (v1.0)
  **Purpose:** To define "pleasure" as a unified metric for calculating wellbeing contributions, resolving the heterogeneity problem.
  **Context:** Hedonistic axiology (wellbeing = pleasure - pain).

  ## 1. Functional Requirements (Coverage)
  *The theory must correctly classify the following input states as instances of "pleasure" (positive wellbeing contribution).*

  | ID | Requirement | Justification / Test Case |
  | :--- | :--- | :--- |
  | **FR-01** | **Relief Classification** | Must classify the cessation of pain (e.g., itch scratching, nausea subsiding) as pleasure, not merely the neutral absence of pain. |
  | **FR-02** | **Non-Occurrent Classification** | Must classify anticipatory states (e.g., looking forward to a trip) as pleasure, even without a present pleasant stimulus. |
  | **FR-03** | **Acquired Taste Handling** | Must allow the same stimulus (e.g., black coffee, atonal music) to transition from negative to positive valuation without the stimulus itself changing. |
  | **FR-04** | **Complex Valence** | Must allow pleasure to coexist with pain or moral disapproval (e.g., schadenfreude, tragic art, spicy food pain). |
  | **FR-05** | **Non-Sensory Coverage** | Must classify states with no distinctive sensory "feel" (e.g., solving a math problem, understanding a joke) as pleasure. |
  | **FR-06** | **Flow State Coverage** | Must classify absorbed activity (e.g., "flow" states) where the subject reports no explicit feeling of pleasure *during* the act, but the state contributes to wellbeing. |

  ## 2. Structural Requirements (Distinctions)
  *The theory must maintain logical separation between the following concepts.*

  | ID | Requirement | Justification / Test Case |
  | :--- | :--- | :--- |
  | **SR-01** | **Effect vs. Cause** | Must distinguish the pleasure (the mental state) from the external object causing it (e.g., the wine is not the pleasure; the tasting is). |
  | **SR-02** | **Intensity vs. Duration** | Must treat intensity and duration as independent variables allowing for trade-off calculations (e.g., 10 mins of high intensity vs. 2 hours of low intensity). |
  | **SR-03** | **Enjoyment vs. Approval** | Must distinguish liking an experience from morally approving of it (e.g., enjoying a guilty pleasure). |
  | **SR-04** | **Definition vs. Extension** | Must define the *nature* of pleasure, not merely list sources (e.g., cannot define pleasure as "whatever eating or sex produces"). |

  ## 3. Constraint Requirements (Consistency)
  *The theory must remain consistent with the following empirical and normative observations.*

  | ID | Requirement | Justification / Test Case |
  | :--- | :--- | :--- |
  | **CR-01** | **Dissociation of Liking/Wanting** | Must allow for cases where a subject wants X but does not enjoy X (e.g., dental surgery), and enjoys Y but does not want Y (e.g., addictive cravings). |
  | **CR-02** | **Error Possibility** | Must allow for the possibility that a subject is mistaken about whether they are experiencing pleasure (first-person authority is not infallible). |
  | **CR-03** | **Normative Force** | Must explain why pleasure provides a *reason* for action or pursuit, rather than being a brute, normatively inert sensation. |
  | **CR-04** | **Commensurability** | **(Engineering Constraint)** Must provide a basis for comparing magnitudes across different types of pleasure to compute a net wellbeing score. |

  ---

  ## 2. Audit: Requirements Classification & Conflicts

  ### Non-Negotiable vs. Preferences vs. Smuggled Assumptions

  *   **Non-Negotiable (Core Data):** **FR-01 through FR-06**. If a theory denies that solving a problem or scratching an itch is a form of pleasure, it fails to describe the phenomenon hedonism seeks to maximize. These are the data points the theory must save.
  *   **Non-Negotiable (Logical Hygiene):** **SR-01, SR-02, SR-04**. Collapsing pleasure with its cause or failing to distinguish intensity from duration makes the "calculation" of wellbeing impossible.
  *   **Preference (Philosophical Camp):** **CR-03 (Normative Force)**. Internalists demand pleasure itself provides the reason; Externalists argue reasons come from outside. A theory of *what pleasure is* can technically survive without explaining *why we seek it*, though it weakens the hedonistic argument.
  *   **Smuggled Assumption:** **FR-01 (Relief)**. Some theories argue relief is not "positive pleasure" but merely "pain reduction." Insisting it *must* count as positive pleasure assumes a specific view of the zero-point of wellbeing. However, for your engineering goal (net score), treating relief as positive input is functionally necessary.
  *   **Purpose-Relative Requirement:** **CR-04 (Commensurability)**. In philosophy, many argue values are incomparable. For your specific goal (algorithmic comparison), this is non-negotiable. For general philosophy, it is a contentious assumption.

  ### Jointly Unsatisfiable Pairs

  Your suspicion is correct. The primary tension lies between **FR-05 (Non-Sensory Coverage)** and a strict interpretation of **Phenomenological Unity** (the implicit demand that all pleasures share a single qualitative "feel").

  *   **The Conflict:** If you demand that all pleasures share a specific *sensory tone* (a "glow" or "tingle"), you automatically fail **FR-05** (solving math has no sensory tone). If you broaden the "shared feature" to be non-sensory (e.g., a functional role), you risk losing the intuitive "feel" that makes pleasure distinct from mere belief or desire, threatening **SR-03** and **CR-01**.
  *   **Secondary Conflict:** **CR-02 (Error Possibility)** vs. **Introspective Definitions**. If pleasure is defined *as* "what it feels like to the subject," the subject cannot be mistaken. To allow error, the theory must define pleasure by something other than immediate self-report (e.g., neural state or functional role), which complicates data collection.

  ### The "Killer" Requirement

  The single requirement that rules out the most otherwise plausible theories is **FR-05 (Non-Sensory Coverage)** combined with the implicit demand for **Phenomenological Unity**.

  *   **Why:** Historically, the most intuitive theory is that pleasure is a **Sensation**. This theory is ruled out immediately by **FR-05**.
  *   **The Modern Casualty:** However, the requirement that rules out the most *contemporary* plausible theories is **CR-04 (Commensurability)**. Most modern theories (Attitude theories, Pluralism) can handle Non-Sensory cases well, but they struggle to quantify "attitudes" or "diverse goods" into a single scalar number for your algorithm. If you retain **CR-04**, you rule out Pluralism and most Attitude theories that refuse to quantify pro-attitudes.

  *Verdict:* For your specific engineering purpose, **CR-04 (Commensurability)** is the hardest constraint. For the philosophical heterogeneity problem generally, **FR-05 (Non-Sensory Coverage)** is the graveyard of classical Sensation theories.

  ---

  ## 3. Evaluation of Theoretical Families

  **1. Pleasure as Distinctive Sensation (Feeling Tone)**
  This view posits a specific qualitative "feel" common to all pleasures. It satisfies **SR-01** and **SR-02** well, offering a clear metric for intensity and duration. However, it fails **FR-05** and **FR-06** decisively; there is no common sensory thread between tasting wine and solving a proof. It also struggles with **CR-02**, as it relies heavily on introspection. It is the easiest to model algorithmically if the data exists, but the data (the sensation) is often missing in the required cases.

  **2. Pleasure as Favourable Attitude (Attitudinal Hedonism)**
  This view defines pleasure as taking a "pro-attitude" (being pleased *that* something is happening) toward an experience. It excels at **FR-05** and **FR-02**, covering non-sensory and anticipatory cases easily. It handles **FR-04** (painful pleasures) well by separating the attitude from the sensation. However, it struggles with **CR-04 (Commensurability)**; quantifying the strength of an "attitude" is harder than quantifying a sensation. It also risks collapsing into **SR-03** (Approval), requiring careful distinction between "being pleased" and "approving."

  **3. Pleasure as Desire Satisfaction (Desire Theories)**
  This view equates pleasure with the satisfaction of a desire. It handles **CR-01** poorly, as it tends to collapse liking and wanting (if you get what you want, you must be pleased). It fails **FR-06** (Flow), as flow states often involve a temporary suspension of desire. It satisfies **CR-03** (Normative Force) trivially, but fails the core hedonistic intuition that pleasure is a *feeling* state, not just a state of the world matching a wish.

  **4. Pleasure as Plural / Disjunctive (Pluralism)**
  This view denies the heterogeneity problem by asserting there is no single thing "pleasure," only a family resemblance of positive states. It satisfies all **FR** (Coverage) requirements perfectly. However, it fails the core premise of Hedonism and violates **CR-04 (Commensurability)**. If pleasures are fundamentally different kinds, they cannot be summed into a single wellbeing variable. For your engineering goal, this theory is a failure, as it prevents the calculation you intend to perform.

  ---

  ## 4. Calibration Note: The Engineering Constraint

  Your goal is to create a procedure for comparing experiences without relying on introspection you do not have. This makes **CR-02 (Error Possibility)** and **CR-04 (Commensurability)** your primary drivers.

  Most philosophical theories assume first-person access is privileged. Your spec requires **third-person observability** or **functional proxies**. This eliminates pure Sensation theories (you cannot observe another's qualia) and pure Attitude theories (you cannot observe another's pro-attitudes without self-report).

  To meet your specification, you must adopt a **Functional/Behavioral** definition of pleasure (e.g., "a state that reinforces behavior" or "a specific neural reward signal"). Be warned: this shifts the definition from "what makes life good" to "what drives the system." This satisfies your engineering constraints but may drift from the philosophical definition of *wellbeing*. If you require the theory to track *wellbeing* rather than just *reinforcement*, **CR-04** remains the highest risk point of failure. No current theory offers a universally accepted conversion rate between "minutes of flow" and "seconds of sensory joy."
