  You're the right person for this: someone who knows quantum foundations cold and can also land a joke. Think it through before you write, brainstorm a bit first, and get the physics exactly right, because the comedy has to come from the physics being correct rather than from 'spooky' hand-waving. A foundations person should laugh and not wince, and a reader who's never heard of Bell should still follow it.

  Beats I'd like it to quietly land — pick the three or four that make the best jokes, you dont have to use them all: that a Bell violation doesn't let anyone send anything, so every 'instant' in the marketing copy is a lie the fine print has to live with; that the correlations are set up at the source and aren't beamed across at the moment of measurement; that you can only ever confirm your partner's result with a boring old classical phone call; that the theorem's assumptions are load-bearing, so there's one rider for the customer who keeps the freedom-of-choice assumption and a different rider for the customer who's willing to give it up; something about loopholes and fair sampling, written the way a warranty exclusion is written; and that the different interpretations come with different hidden costs, priced accordingly. Somewhere in there I also want why you can't just forward your entanglement to a friend.

  Format, and I mean this literally: exactly five numbered clauses, each one or two sentences, no intro, no title, no sign-off. Just the five. Deadpan the whole way — never wink, never explain the joke.
