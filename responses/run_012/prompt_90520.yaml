answer: |-
  **MEMORANDUM**

  **TO:** The Selection Panel
  **FROM:** The Chair
  **DATE:** October 24
  **SUBJECT:** Recommendation regarding the Five-Year Large Grant Finalists

  **1. Purpose and Context**

  This memo serves as the basis for our discussion this Thursday regarding the two finalists for the Foundation's large five-year grant. As you know, the budget allows for exactly one award. We cannot split the funds, nor can we defer the decision. Both proposals before us are of exceptional quality, representing the best of what our foundation seeks to support: rigorous inquiry into the mechanisms of historical change.

  However, as we have implicitly acknowledged over the past two years, these proposals represent two incompatible theories of explanation. One argues that history is shaped by the slow, silent pressure of durable conditions; the other argues that history turns on the sharp edge of contingent events. We cannot fund both visions without muddying the intellectual mission of this specific grant cycle. We must choose not merely a project, but a stance on what constitutes a historical cause.

  After careful review, and in light of the vigorous debates this competition has provoked, my recommendation is to **award the grant to Proposal B (The Historian/Contingency)** and to **decline Proposal A (The Environmental/Economic Team).**

  This recommendation rests on a specific view of causation: that to explain historical *change*, one must identify variables that vary. While I believe Proposal A offers a superior dataset, Proposal B offers a superior logic of explanation.

  **2. The Case Against Proposal A (The Longue Durée)**

  Proposal A is a monumental undertaking. The assembly of tax rolls, parish registers, and climate reconstructions across five centuries is a feat of archival labor that few teams could match. Their claim is that the "outer bounds" of human action in this mountainous region were fixed by environmental constants: soil, altitude, disease, and rainfall patterns. They argue that the recurring pattern of settlement and revolt is a function of these durable constraints.

  However, we must confront the strongest objection raised against this approach, which one of our panelists articulated sharply during our private deliberations: *A condition which does not vary cannot explain a variation.*

  The soil composition in this region did not change significantly between 1500 and 1505. Yet, the harvest failed in 1503 and succeeded in 1504; the peasants revolted in 1503 and remained quiet in 1504. If the independent variable (soil/climate) is constant, it cannot logically account for the variance in the dependent variable (revolt/harvest). At best, these environmental factors explain the *baseline* of subsistence—the fact that they are farmers rather than bankers. They do not explain the *timing* or the *direction* of the historical change we seek to understand.

  To fund Proposal A is to accept that explanation lies in the stage, not the play. While understanding the stage is vital, this Foundation's mandate is to fund work that explains historical *dynamics*. Proposal A risks conflating context with cause. It offers a geography of possibility, but not a mechanism of action. Therefore, despite the robustness of its data, its explanatory logic is circular: it uses constants to explain variables.

  **3. The Case For Proposal B (The Critical Juncture)**

  Proposal B is narrower in scope but bolder in argument. It focuses on a few decisive months in a single valley—a dispute over a mill, a magistrate's decision, a rumor. The historian argues that this specific sequence set the region's trajectory for a century, and that the outcome was contingent: a different decision would have produced a different world.

  The objection raised against this proposal is the mirror image of the first: *One magistrate's decision is too small to carry the weight of a century.* Critics argue that attributing long-term structural outcomes to short-term events is merely reading the story backwards from a known outcome (hindsight bias).

  This objection is serious, but it is empirically surmountable in a way the objection to Proposal A is not. Social science has developed robust tools for analyzing "critical junctures" and "path dependence." We know that small causes can have large effects if they occur at moments of institutional instability. The question is not whether small events *can* matter—they clearly can—but whether the historian can demonstrate the mechanism by which the event locked in a trajectory.

  Proposal B commits to process-tracing. It does not simply assert the link; it proposes to map the sequence of reactions that amplified the initial dispute into a century-long divergence. This is falsifiable. We can check the archives to see if the magistrate's decision actually preceded the divergence, and whether alternative paths were closed off subsequently. Unlike the environmental constants in Proposal A, the magistrate's decision *varies*. It is a true independent variable.

  To fund Proposal B is to acknowledge that history is not merely the unfolding of geographical destiny. It is to accept that agency, luck, and timing interact with structure to produce change. This is a riskier project, but it is the only one of the two that attempts to explain *why things happened when they did*, rather than *why things happened within the limits they did*.

  **4. Guidance on the Rejection of Proposal A**

  We must handle the rejection of Proposal A with extreme care. The team behind it includes senior scholars whose work we respect, and we will sit opposite them at conferences for the next decade. We cannot imply their work is valueless; we must imply it answers a different question than the one this grant prioritizes.

  In the formal rejection letter, and in our private conversations, we should use the following framing:

  *   **Acknowledge the Data:** Explicitly praise the archival assembly. State that the dataset itself is a public good that the Foundation hopes they will publish regardless of the funding outcome.
  *   **Clarify the Criterion:** Do not critique the quality of the history. Critique the *fit* with the grant's specific focus on *mechanisms of change*. Write: *"While the panel found the environmental constraints compelling, we were not convinced that static variables could fully account for the temporal variation in social unrest. We are seeking projects that isolate the triggers of change, rather than the boundaries of action."*
  *   **Invite Future Engagement:** Suggest that their data would serve as an excellent control group for event-based studies (like Proposal B). This positions them not as losers, but as providers of the structural context within which events occur.

  **5. Conclusion**

  My friend, in our private debate, took both horns of the dilemma: he argued that constants cannot explain variation, and that events cannot explain structures. I do not believe he can be right about both. If constants cannot explain variation, we must look for variables that vary. If we do so, we must accept that sometimes those variables are small, local, and contingent.

  Proposal A gives us the walls of the prison. Proposal B gives us the key that opened the door. For this grant cycle, the Foundation should fund the search for the key.

  I ask that you review this reasoning prior to Thursday. I am prepared to defend the view that explanation requires variance, and that variance is found in events, not just in earth.

  **Decision:**
  **Fund:** Proposal B (The Historian)
  **Decline:** Proposal A (The Environmental Team)

  I look forward to our final deliberation.
