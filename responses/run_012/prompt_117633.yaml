prompt: |-
  I do cost-benefit work for a living and I know the consequentialist toolkit cold — welfare aggregation, expected value, ex ante vs ex post, act vs rule, side-constraints, moral luck, interpersonal comparability, the repugnant conclusion, all of it. A friend has been dragging me to a Buddhist study group and I keep having the same reaction: this karma business is consequentialism, they just won't come out and say it. Either confirm that for me or kill it.

  What I want: restate the karma/merit system in my vocabulary, as faithfully as you can manage, and then give me the residue report. What carries over cleanly, what only carries over if you distort it, and what has no counterpart in my framework at all. For every piece of residue, tell me whether it's my framework that's missing something or whether the Buddhist claim was just doing something vaguer than it looks.

  The bits that make me think this won't come out clean:

  - The deed is the intention. Whatever else happens, the karma is the volition — not the act, not the fallout.
  - But the payout is scaled by who it was aimed at. A gift to an animal, a gift to an ordinary decent person, and a gift to someone far along the path pay out at wildly different rates — same gift, same cost to me, same benefit to them. That's a multiplier with nothing to do with how much good actually gets done.
  - And the valence is fixed by the roots: out of greed, hatred or delusion and it's bad; out of their absence and it's good. The good result is then supposed to follow as a matter of causal law. Nobody is weighing anything.
  - Ripening needs conditions and can be delayed for lifetimes, and I'm told some karma just never ripens at all — it lapses, the conditions never come together. So there's no ex post total, no bookkeeper.
  - Merit gets transferred. People dedicate it to dead relatives, to all beings. That's not the same thing as making anyone better off.
  - And the whole thing runs on no-self, so I can't even ask whose welfare is being aggregated. The stream that collects the result isn't me in any sense my framework can use.
  - Yet the precise working-out of the results of karma is on the list of things you're not supposed to ponder. There's a don't-compute clause sitting inside what looks like a calculus.
  - One more, and I may be mangling it: I half remember a story about a ship captain who kills a bandit to stop him slaughtering a boatload of merchants, and the tradition treats that as the compassionate thing to do rather than a crime. If I've got that roughly right, use it — that's the one case where my framework seems to slot straight in, and I want to know why it still doesn't feel like my framework.

  Then the verdict I actually care about. Is Buddhist ethics a species of consequentialism, or is it closer to a theory about the quality of mental states that happens to have a causal story about pleasant and unpleasant results bolted onto it? And if it's the second, what is the consequentialist getting wrong when he recruits karma for his side? Dont be diplomatic about it — I'd rather find out my instinct is cheap than get a both-sides answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Professional cost-benefit analyst, deeply versed in consequentialist ethics (welfare aggregation, EV, ex ante/post, act/rule, side-constraints, moral luck, interpersonal comparability, repugnant conclusion, etc.).
      *   **Task:** Evaluate the claim "Buddhist karma is just consequentialism." Restate karma/merit in consequentialist vocabulary, then provide a "residue report" (what fits, what distorts, what has no counterpart).
      *   **Specific Points to Address:**
          1.  Intention = Deed (Volition vs. Outcome).
          2.  Field of Merit (Multiplier based on recipient status, not utility).
          3.  Roots (Greed/Hatred/Delusion vs. Absence) as fixed valence, not weighing.
          4.  Ripening/Conditions (Delayed, non-linear, some lapses, no total bookkeeper).
          5.  Merit Transfer (Dedication to dead/beings, not utility transfer).
          6.  No-Self (Anatta) vs. Welfare Aggregation (Whose welfare?).
          7.  The "Don't Compute" Clause (Imponderables).
          8.  The Captain/Bandit Story (Compassionate killing).
      *   **Verdict:** Is it consequentialism or a theory of mental states with causal bolt-ons? What is the consequentialist getting wrong?
      *   **Tone:** Direct, analytical, no diplomacy, rigorous. "Confirm or kill it."

  2.  **Deconstruct the Claim ("Karma is Consequentialism"):**
      *   *Surface Similarity:* Both care about outcomes (suffering/happiness) and causal links (action -> result).
      *   *Deep Difference:* Consequentialism evaluates acts based on *world states*. Buddhism evaluates acts based on *mind states* and their causal impact on *samsaric continuity*.
      *   *Initial Verdict:* The user's instinct is partially right (it looks like consequentialism) but fundamentally wrong on the *locus of value*. It's not "cheap," it's a category error.

  3.  **Drafting the Translation (Karma into CBA Vocab):**
      *   *Utility Function:* Minimization of *Dukkha* (suffering/unsatisfactoriness), maximization of *Nirvana* (cessation). Not preference satisfaction or hedonic welfare in the standard sense.
      *   *Decision Variable:* *Cetana* (Volition/Intention).
      *   *Constraint:* *Sila* (Precepts) act like rule-consequentialist heuristics but are rooted in ontology.
      *   *Discount Rate:* Time is non-linear (lifetimes).
      *   *Agent:* A causal stream (*santana*), not a persistent self.

  4.  **Addressing the "Residue Report" (The User's Specific Points):**

      *   *1. Intention = Deed:* In CBA, intention matters for *ex ante* EV, but the *ex post* audit counts actual welfare. In Buddhism, the karma *is* the volition. The physical outcome is secondary (though it affects the 'field'). *Residue:* CBA cares about the world; Buddhism cares about the mind's trajectory.
      *   *2. Field of Merit (Multiplier):* This is the biggest hit against standard utilitarianism. Giving to an Arhat > Giving to a dog, even if the dog is hungrier. Why? Because the *purity of the field* affects the *karmic seed*. *Residue:* This isn't welfare maximization; it's spiritual cultivation. CBA would call this irrational weighting. Buddhism says CBA is missing the soteriological dimension.
      *   *3. Roots (Greed/Hatred/Delusion):* Deontological flavor? No, it's ontological. Unwholesome roots *are* suffering. *Residue:* CBA sees "bad roots" as instrumental bads (they lead to bad outcomes). Buddhism sees them as constitutive bads (they *are* the binding to Samsara).
      *   *4. Ripening/Conditions:* Stochastic, non-linear, no final audit. *Residue:* CBA requires calculability (in principle). Karma admits fundamental incalculability (*acinteyya*). CBA framework is missing humility/limits of cognition.
      *   *5. Merit Transfer:* Impossible in strict CBA (utility is individual). In Buddhism, it's about resonance/aspiration within interdependence (*Pratityasamutpada*). *Residue:* CBA assumes methodological individualism. Buddhism assumes ontological interdependence.
      *   *6. No-Self:* Who gets the utility? The causal stream. *Residue:* CBA needs a subject of welfare. Buddhism dissolves the subject. CBA framework is missing the insight that "aggregation" presupposes a fiction.
      *   *7. Don't Compute:* The *Acinteyya*. *Residue:* CBA says "compute better." Buddhism says "computation is the trap."
      *   *8. The Captain (Upaya):* Killing to save. *Residue:* Looks like act-utilitarianism. But the Captain accepts the karmic burden (hell) to save the other. It's self-sacrifice, not just net utility calc.

  5.  **Synthesizing the Verdict:**
      *   Is it consequentialism? No.
      *   Is it virtue ethics? Closer, but "virtue" implies a self.
      *   Is it soteriological causalism? Yes.
      *   *The Consequentialist's Error:* You are optimizing *states of the world*. Buddhism is optimizing *relationship to states of the world*. You think the "good" is in the outcome. Buddhism says the "good" is in the cessation of the craving that drives the calculation.
      *   *Hard Truth:* Recruiting karma for consequentialism is colonialism. It strips the ontology (No-Self, Dependent Origination) to keep the mechanics (Cause/Effect), rendering it incoherent.

  6.  **Refining the Tone:**
      *   Avoid "Both sides."
      *   Use the user's jargon (EV, discount rates, aggregation, methodological individualism).
      *   Be sharp. "Your framework is missing something" vs "Buddhism is vague."
      *   Address the "Cheap Instinct" fear: It's not cheap, it's a sophisticated category error.

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the surface resemblance. It's the "Uncanny Valley" of ethics.
      *   *Translation:* Map terms. Utility = Dukkha reduction. Agent = Causal Stream.
      *   *Residue:* Go through the 8 points.
      *   *Verdict:* Deliver the blow. It's not consequentialism. It's *Soteriological Causalism*.
      *   *The "Why":* Consequentialism optimizes the game. Buddhism optimizes quitting the game.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Field of Merit" correctly? It's crucial. It's not about the recipient's welfare, it's about the donor's connection to the Dharma.
      *   *Check:* The Captain story. Make sure to highlight the *willingness to suffer* vs. *minimizing total suffering*.
      *   *Check:* No-Self. This is the killer for aggregation. If there's no one to be happy, what are we aggregating?
      *   *Tone Check:* Ensure I'm not being mystical. Keep it analytical. "Ontological commitment" rather than "spiritual truth."

  9.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" is distinct and punchy. (Proceed to generate output based on this structure.)
answer: |-
  Here is the translation, the residue report, and the verdict. No diplomacy.

  ### Part 1: The Translation (Karma into CBA Vocab)

  To make karma legible to your framework, we have to map the variables.

  *   **Objective Function:** Minimize *Dukkha* (suffering/unsatisfactoriness) across the temporal horizon of *Samsara* (cyclic existence). Terminal value is *Nirvana* (cessation of the optimization process).
  *   **Decision Variable:** *Cetana* (Volition). The physical act is a transmission mechanism; the volition is the investment.
  *   **Discount Rate:** Non-linear and intergenerational. Future utility (in future lives) is not heavily discounted; it is the primary locus of value.
  *   **Agent:** A *Santana* (causal stream). Not a persistent entity, but a continuity of cause-and-effect sufficient to bear responsibility.
  *   **Constraints:** *Sila* (Precepts). Functionally act as rule-consequentialist heuristics, but ontologically grounded in the nature of reality.
  *   **Externalities:** *Pattidana* (Merit Dedication). Attempting to internalize externalities across distinct causal streams via aspiration and interdependence.

  On paper, this looks like a multi-period, stochastic dynamic programming problem with a weird utility function. But when you run the numbers, the model breaks.

  ### Part 2: The Residue Report

  Here is where your framework grinds against the Buddhist claim.

  **1. Intention = Deed (Volition vs. Outcome)**
  *   **The Fit:** *Ex ante* expected value. You judge the decision at the node, not the leaf.
  *   **The Residue:** In CBA, if I intend good but cause catastrophe due to negligence, I bear responsibility for the catastrophe (negative utility). In Buddhism, if the volition was pure, the *karmic seed* is wholesome, even if the outcome is disastrous. The physical outcome matters for *worldly* welfare, but not for *karmic* maturation.
  *   **Diagnosis:** **Your framework is missing something.** CBA assumes the "good" is located in the state of the world. Buddhism locates the "good" in the quality of the causal impulse. You are optimizing outcomes; they are optimizing the *source* of outcomes.

  **2. The Field of Merit (The Multiplier)**
  *   **The Fit:** Weighted utility.
  *   **The Residue:** You noted the multiplier depends on the recipient's spiritual status, not their welfare need. Giving $100 to an Arhat generates more merit than $100 to a starving child. In CBA, this is irrational weighting (diminishing marginal utility of welfare). In Buddhism, the Arhat is a "superconducting field." The transaction isn't about the recipient's consumption; it's about the donor's alignment with Truth.
  *   **Diagnosis:** **The Buddhist claim is doing something different.** It is not a welfare calculus. It is a cultivation calculus. You are trying to maximize *happiness*; they are maximizing *purity*. These are correlated but not identical variables.

  **3. The Roots (Greed/Hatred/Delusion)**
  *   **The Fit:** Deontological side-constraints or lexical preferences.
  *   **The Residue:** You see this as a rule: "Don't act from hate." But Buddhism claims this is a law of nature, like gravity. Acting from hate *is* suffering, regardless of the outcome. It's not instrumentally bad; it's constitutively bad.
  *   **Diagnosis:** **Your framework is missing something.** CBA treats mental states as inputs to welfare. Buddhism treats specific mental states as *ontological errors*. You think delusion is a calculation error; they think delusion is the engine of the prison.

  **4. Ripening and Lapses (No Bookkeeper)**
  *   **The Fit:** Stochastic processes with latency.
  *   **The Residue:** CBA requires that, in principle, the ledger balances. EV must equal realized value over N trials. Buddhism admits *Acinteyya* (the imponderable). Some karma lapses. Some ripens out of sequence. There is no final audit.
  *   **Diagnosis:** **The Buddhist claim is vaguer than it looks.** It functions as a "God of the gaps" for moral justice, but explicitly forbids you from modeling the gap. It demands faith in causality without allowing verification of the mechanism.

  **5. Merit Transfer**
  *   **The Fit:** None.
  *   **The Residue:** In methodological individualism, I cannot give you my utility. In Buddhism, merit is not a private asset; it's a resonance. Dedicating merit changes the *aspiration* of the donor and the *receptivity* of the recipient.
  *   **Diagnosis:** **Your framework is missing something.** CBA assumes rigid boundaries between agents (interpersonal comparability is hard, but agents are distinct). Buddhism assumes *Pratityasamutpada* (Dependent Origination). Agents are porous. You can't model fluid dynamics with billiard balls.

  **6. No-Self (Anatta)**
  *   **The Fit:** None. This is the hard stop.
  *   **The Residue:** CBA requires a subject of welfare. "Whose utility?" Buddhism says "No one's." The stream continues, but there is no owner. Aggregating welfare across a stream that has no owner is a category error.
  *   **Diagnosis:** **Your framework is missing something.** You are trying to run a welfare aggregation on a null pointer. The "self" you aggregate for is, in their view, a hallucination. You are maximizing the comfort of a fiction.

  **7. The "Don't Compute" Clause**
  *   **The Fit:** Bounded rationality / stopping rules.
  *   **The Residue:** In CBA, "don't compute" means "calculation costs exceed benefits." In Buddhism, "don't compute" (*Acinteyya*) means "computation is the pathology." Pondering the precise mechanics of karma reinforces the dualistic mind that creates karma.
  *   **Diagnosis:** **The Buddhist claim is doing something different.** It is therapeutic, not analytical. The goal is to stop the calculating mind, not to calculate better.

  **8. The Captain and the Bandit (Upaya)**
  *   **The Fit:** Act Utilitarianism. One death < Many deaths.
  *   **The Residue:** In your framework, the Captain is a hero who maximized utility. In the *Upaya-kaushalya Sutra*, the Captain accepts the karmic burden of hell to save the bandit from the karma of mass murder. He sacrifices his *own* soteriological standing for the other.
  *   **Diagnosis:** **Your framework is missing something.** CBA sees a net gain. Buddhism sees a *bodhisattva* voluntarily taking on negative utility to interrupt a causal chain. It's not just math; it's vicarious atonement within a causal framework.

  ### Part 3: The Verdict

  **Is Buddhist ethics a species of consequentialism?**
  **No.**

  It is **Soteriological Causalism**.

  Consequentialism is a theory about how to arrange the furniture in the burning house to maximize comfort. Buddhist ethics is a theory about how to stop building houses in a fire zone.

  **What is the consequentialist getting wrong?**
  You are recruiting karma because it offers a robust causal mechanism for moral responsibility without a deity. You want the *law* without the *lord*. But in doing so, you are stripping the ontology that makes the law coherent.

  1.  **The Locus of Value:** You think value resides in *experience* (welfare/happiness). Buddhism posits that *craving for experience* is the error. You cannot maximize welfare in a system where "welfare" is defined as a temporary cessation of itching.
  2.  **The Agent:** You need a "who" to aggregate for. Buddhism dissolves the "who." If you force a "self" back into Buddhism to make the CBA work, you have destroyed the Buddhist mechanism (No-Self) that solves the problem (Suffering).
  3.  **The Goal:** Your framework is additive (more good). Buddhism is subtractive (less clinging). You are trying to use a subtraction engine to run an addition script.

  **The Hard Truth:**
  Your instinct isn't "cheap," but it is **colonial**. You are treating karma as a primitive technology of risk management that needs to be updated with modern axiology. But karma isn't risk management; it's diagnostic.

  When you say, "This is just consequentialism," you are saying, "I recognize the shape of the cage, so I assume we are both trying to optimize the interior design." They are trying to show you the door.

  **Final Call:**
  If you treat Buddhism as consequentialism, you will practice it as a strategy for better rebirths (spiritual materialism). The tradition explicitly calls this "missing the raft." It works for getting across the river, but if you carry the raft on your head once you reach the shore, you look insane.

  Consequentialism carries the raft. Buddhism is about dropping it. Keep your CBA for the policy briefing; don't try to run it on the meditation cushion. The compiler will throw an error.
