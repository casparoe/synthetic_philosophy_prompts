answer: |-
  # Handout: The Logical Space of Demandingness

  **Root Question:** **What makes the demand "excessive"?**
  *   **Left Branch:** **Substantive Loss** (Compliance costs the agent goods they possess).
  *   **Right Branch:** **Capacity Failure** (Compliance exceeds abilities the agent possesses).

  ---

  ## LEFT BRANCH: Substantive Loss

  **Node 1.1:** **What is the primary good sacrificed?**
  *   **(A) Welfare:** Comfort, resources, happiness.
  *   **(B) Integrity:** Personal projects, relationships, authority over one's life.

  ### Path A: Welfare
  **Node 1.2:** **Is compliance conditional on others doing their share?**
  *   **(A1) No:** You must maximize regardless of free-riders (Individual).
  *   **(A2) Yes:** You need only do your fair share (Collective).
      *   **Leaf 1: Cooperative Consequentialism.**
          *   *Awkward Case:* You must let a child drown because saving them would exceed your "fair share" when others are idle.
      *   **[EMPTY LEAF 2]: Collective Integrity.** (Combination of A2 + Path B).
          *   *Why Empty:* **Unattractive.** Integrity objections are usually agent-relative; scaling them to a group dissolves the personal authority complaint into a welfare distribution problem.

  **Node 1.3 (from A1):** **Does this cost refute the theory?**
  *   **(A1-i) Yes:** The theory is false and needs revision.
  *   **(A1-ii) No:** The theory is true; the cost indicts human selfishness (Saintliness).
      *   **Leaf 3: Hardline Act Consequentialism (e.g., Singer/Unger).**
          *   *Awkward Case:* You are morally required to ruin your life to save strangers, and blameworthy if you don't.

  **Node 1.4 (from A1-i):** **How is the theory revised?**
  *   **(A1-i-α) Cap the Demand:** Optimize until a threshold, then stop (Satisficing).
      *   **Leaf 4: Satisficing Consequentialism.**
          *   *Awkward Case:* You are forbidden from saving an extra life if it costs you a trivial amount, because you've already done "enough."
  *   **(A1-i-β) Weight the Agent:** Agent's interests count for more, but aren't absolute (Prioritarian/Weighted).
      *   **Leaf 5: Weighted Consequentialism.**
          *   *Awkward Case:* You must let five strangers die to save your own child, even if the net welfare loss is massive.

  ### Path B: Integrity
  **Node 1.5:** **Is an Agent-Centered Prerogative granted?**
  *   **(B-i) Yes:** Agents may sometimes favor their own projects.
      *   **Leaf 6: Moderate Consequentialism (e.g., Scheffler).**
          *   *Awkward Case:* You may choose a trivial hobby over a massive charitable gain, provided the gain doesn't cross a specific ratio threshold.
  *   **(B-ii) No:** Projects count only impersonally; integrity is not a trump.
      *   **Leaf 7: Integrity-Hardline (e.g., Railton).**
          *   *Awkward Case:* You must abandon your life's art to farm grain if the grain produces more utility, even if it makes you miserable.

  ---

  ## RIGHT BRANCH: Capacity Failure

  **Node 2.1:** **Which capacity is exceeded?**
  *   **(C) Epistemic:** We cannot calculate/know the maximizing act.
  *   **(D) Volitional:** We cannot sustain the motivation to maximize.

  ### Path C: Epistemic
  **Node 2.2:** **Must the theory provide a Decision Guide?**
  *   **(C-i) Yes:** A theory that can't be used to decide is useless.
      *   **Leaf 8: Procedural Consequentialism.**
          *   *Awkward Case:* You must follow a heuristic you know will produce sub-optimal results in this specific case.
  *   **(C-ii) No:** The theory is a Criterion of Rightness, not a procedure.
      *   **Node 2.3:** **Is the strategy Indirect?**
          *   **(C-ii-α) Yes:** Maximize by cultivating non-maximizing dispositions (Rule/Motive).
              *   **Leaf 9: Indirect Consequentialism.**
                  *   *Awkward Case:* You are required to cultivate a disposition that sometimes forbids you from doing the objectively right act.
          *   **(C-ii-β) No:** The act is right if it maximizes, even if unknowable (Objective).
              *   **Leaf 10: Objective Act Consequentialism.**
                  *   *Awkward Case:* You did the "right" act by luck despite believing it was wrong, and the "wrong" act by diligence despite believing it was right.

  ### Path D: Volitional
  **Node 2.4:** **Does 'Ought Implies Can' apply to moral psychology?**
  *   **(D-i) Yes:** If we can't sustain the motive, there is no obligation.
      *   **Leaf 11: Possibilist Consequentialism.**
          *   *Awkward Case:* A psychopath and a saint have the same moral obligations (none), erasing the distinction between inability and unwillingness.
  *   **(D-ii) No:** Obligation remains, but blame is mitigated.
      *   **[EMPTY LEAF 12]: Volitional Decision Guide.** (Combination of Path D + Node 2.2 "Yes").
          *   *Why Empty:* **Incoherent.** If the blockage is willpower, a decision procedure (knowledge) does not solve the capacity failure; it conflates *knowing* what to do with *being able* to make oneself do it.

  ---

  **Confidence Report:**
  I am **highly confident** in the overall structure (Substantive vs. Capacity) as it cleanly separates metaphysical claims about value from psychological claims about agency. I am **least confident** about **Empty Leaf 12 (Volitional + Decision Guide)**. Some moral education views argue that changing the *guide* changes the *will*, potentially occupying this space. However, strictly speaking, a guide addresses epistemic uncertainty, not volitional weakness, so I maintain it is a category error, but it is the shakiest exclusion in the tree.

  Verdict: Substantive Loss vs. Capacity Failure
