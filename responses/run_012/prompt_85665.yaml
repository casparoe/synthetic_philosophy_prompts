prompt: |-
  I have been reading a trade book on moral psychology — the kind written by a science journalist who surveys a research program and then draws large philosophical morals from it — and I would like to know how much of its central chapter to believe. The chapter concerns the finding, now generally called the Knobe effect, that people's willingness to say an agent brought an outcome about intentionally depends on how bad they take that outcome to be. The book's summary of the research runs roughly as follows.

  'In the experiment, subjects read about a corporate executive who proposes a new program that will increase profits. As a side effect, the program will either harm or help the environment. In both versions the executive says that he does not care at all about the environment and cares only about profit. Subjects were then asked whether he brought about the environmental outcome intentionally. In the harm version, most said yes; in the help version, only a minority did. Knobe concluded that the concept of intentional action is a moral concept through and through: whether we call something intentional depends on whether we disapprove of it. Later work has found the same asymmetry in judgments of causation and of knowledge, and has found it for violations of norms that are not moral at all, which shows that the effect is really about evaluation in general and not about intentionality in particular. Since the two scenarios differ only in the moral valence of the outcome, and since the executive's intentions, beliefs, and indifference are held fixed, the experiment shows that the ordinary notion of acting intentionally is internally inconsistent: there is no fact of the matter about what he did on purpose. The philosophical upshot is that the armchair method of testing theories of action against intuitions about cases is bankrupt, and that moral judgment is not a faculty that operates on independent facts but a lens that constitutes the facts it judges.'

  I am not competent to grade this, and I suspect it overstates matters, but I want to know precisely where. Please go through the summary claim by claim and sort what it says into three piles: what a researcher in this area would accept as accurate; what is a defensible simplification, or a live interpretive option rather than a mistake; and what is a genuine distortion — bearing in mind that the book is summarizing a real body of work, so I need to know which of its errors are errors of emphasis and which are the kind of thing a specialist would call simply wrong. Where the summary attributes a conclusion to Knobe, say whether the conclusion is his or the book's. The summary also seems to me to pull in two directions at once: it says the concept of intentional action is moral through and through, and it also says the effect is not about intentionality in particular. Tell me whether that is a real tension in the literature or merely careless prose.

  Finally, a friend of mine who works on this tells me that the experiment cannot by itself distinguish between two readings: that the effect reveals something about the content of the concept of intentional action, and that it reveals a bias in how people apply a concept whose content is perfectly ordinary. The book appears not to notice the distinction. Explain what turns on it, and say whether the book's closing claims — that the ordinary notion is internally inconsistent, that armchair philosophy of action is bankrupt, and that moral judgment constitutes the facts it judges — survive once the summary has been corrected. I am not asking for a reading list; I want the audit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A trade book summary of the Knobe Effect (moral psychology/philosophy of action).
      *   **Task:** Audit the summary claim-by-claim.
      *   **Categories:**
          1.  Accurate (researchers would accept).
          2.  Defensible Simplification/Live Option (interpretive, not strictly wrong).
          3.  Genuine Distortion/Error (specialists would call wrong).
      *   **Specific Questions:**
          *   Distinguish Knobe's conclusions vs. the book's conclusions.
          *   Address the apparent tension (moral concept vs. general evaluation).
          *   Explain the "Content vs. Bias" distinction raised by the friend.
          *   Evaluate the book's "philosophical upshots" (inconsistency, armchair bankruptcy, moral constitution of facts) in light of corrections.
      *   **Constraint:** No reading list. Just the audit.

  2.  **Deconstruct the Book's Summary (Claim-by-Claim):**

      *   *Claim 1:* "In the experiment, subjects read about a corporate executive... [Harm vs. Help scenario]... In the harm version, most said yes; in the help version, only a minority did."
          *   *Status:* **Accurate.** This is the basic empirical finding of Knobe (2003).
      *   *Claim 2:* "Knobe concluded that the concept of intentional action is a moral concept through and through: whether we call something intentional depends on whether we disapprove of it."
          *   *Status:* **Defensible Simplification / Live Option (but contested).** Knobe *did* argue for a deep connection between moral judgment and intentionality (the "Skill Model" vs. "Moral Concept" view). However, saying it is "moral through and through" is stronger than his later nuanced views. It's an interpretive stance he held early on, but not the only one.
      *   *Claim 3:* "Later work has found the same asymmetry in judgments of causation and of knowledge..."
          *   *Status:* **Accurate.** There is literature on "epistemic side-effects" and causal asymmetries (e.g., Alicke, Uhlmann).
      *   *Claim 4:* "...and has found it for violations of norms that are not moral at all, which shows that the effect is really about evaluation in general and not about intentionality in particular."
          *   *Status:* **Defensible Simplification / Live Option.** This refers to the "Normative Account" (e.g., Hindriks, Sytsma). It's a leading theory, but not proven fact. Saying it "shows" is too strong; "suggests" is better.
      *   *Claim 5:* "Since the two scenarios differ only in the moral valence of the outcome, and since the executive's intentions, beliefs, and indifference are held fixed, the experiment shows that the ordinary notion of acting intentionally is internally inconsistent..."
          *   *Status:* **Genuine Distortion.** This is a huge leap. Empirical data about *usage* does not prove *inconsistency* in the concept itself. It could be context-sensitivity, pragmatic implicature, or bias. "Internally inconsistent" is a philosophical claim not warranted by the data alone.
      *   *Claim 6:* "...there is no fact of the matter about what he did on purpose."
          *   *Status:* **Genuine Distortion.** This is metaphysical nihilism about intentionality based on folk psychology data. Most philosophers (even experimental ones) reject this.
      *   *Claim 7:* "The philosophical upshot is that the armchair method of testing theories of action against intuitions about cases is bankrupt..."
          *   *Status:* **Defensible Simplification / Overstatement.** This was a hot topic (Experimental Philosophy movement), but "bankrupt" is too strong. "Needs supplementation" or "is unreliable in some domains" is the consensus.
      *   *Claim 8:* "...and that moral judgment is not a faculty that operates on independent facts but a lens that constitutes the facts it judges."
          *   *Status:* **Genuine Distortion.** This is a heavy-duty meta-ethical constructivist claim derived from a psychological finding. It does not follow logically.

  3.  **Address the Tension (Moral Concept vs. General Evaluation):**
      *   The book says: (A) Intentionality is a moral concept. (B) Effect is about evaluation in general, not intentionality.
      *   *Analysis:* This reflects the evolution of the literature. Knobe's original paper (2003) leaned toward (A). Later work (Knobe 2006, 2010; others) moved toward (B) (The "Praise/Blame" or "Normative" account).
      *   *Verdict:* It's careless prose in the book, but it mirrors a shift in the research program. It's not a deep theoretical contradiction in the *field*, but the book presents them as simultaneous conclusions rather than competing/explaining hypotheses.

  4.  **Address the Friend's Point (Content vs. Bias):**
      *   *Distinction:*
          *   *Content View:* Moral judgment is *part of the definition* of "intentional." (To be intentional just *is* to be blameworthy in some sense).
          *   *Bias/Performance View:* The concept is neutral (mental states only), but moral outrage *distorts* our application of it (like anger making a foul look worse).
      *   *What turns on it:* If Content, then morality is built into action theory. If Bias, then action theory remains standard, but human psychology is flawed.
      *   *Book's Claims Survival:*
          *   *Inconsistency:* If Bias, no inconsistency. If Content, maybe context-sensitive, but not necessarily inconsistent. Claim fails either way.
          *   *Armchair Bankruptcy:* If Bias, armchair intuitions are noisy but salvageable. If Content, armchair needs to account for moral context. "Bankrupt" is still too strong.
          *   *Constitution of Facts:* This is a metaphysical claim. Neither Content nor Bias (psychological claims) supports Moral Constitutivism (metaphysical claim) directly. Claim fails.

  5.  **Drafting the Response:**
      *   *Structure:*
          1.  Introduction (acknowledge the skepticism).
          2.  Claim-by-Claim Audit (The Three Piles).
          3.  The Tension (Moral vs. Evaluative).
          4.  The Friend's Distinction (Content vs. Bias).
          5.  Evaluation of the Philosophical Upshots.
      *   *Tone:* Professional, precise, philosophical but accessible (matching the user's level).
      *   *Key Check:* Ensure I distinguish what Knobe said vs. what the book says. Ensure I don't just say "it's complicated" but give the audit requested.

  6.  **Refining the Audit (Self-Correction during drafting):**
      *   *Correction on Claim 2:* Knobe didn't exactly say "moral concept through and through" in the sense of *reducing* intentionality to morality. He argued moral judgment *influences* the application. The book's phrasing is a bit reductive. I should mark this as a simplification that leans toward distortion.
      *   *Correction on Claim 5:* The "inconsistency" claim is often associated with *some* experimental philosophers (e.g., early Machery), but Knobe himself moved away from "inconsistency" toward "deep structure." I need to be clear that the *book* attributes this to the experiment, which is the error.
      *   *Correction on Upshots:* The "constitution of facts" claim is basically moral anti-realism/constructivism. The Knobe effect is compatible with realism (we just perceive it through a lens). I need to be firm that this does not follow.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Three piles? Yes.
      *   Knobe vs. Book conclusions? Yes.
      *   Tension addressed? Yes.
      *   Friend's distinction explained? Yes.
      *   Upshots evaluated? Yes.
      *   No reading list? Yes.

  8.  (Mental Check of Specific Literature):
      *   Knobe (2003): Intentional Action and Side Effects.
      *   Knobe (2006): The Concept of Intentional Action: A Reassessment. (Moves toward normative).
      *   Adams & Steadman (2004): Pragmatics argument (Bias).
      *   Pettit & Knobe (2009): The Pervasive Impact of Moral Judgment.
      *   Nadelhoffer: Various bias accounts.
      *   *Consensus:* The effect is robust. The *explanation* is debated. The *metaphysical implications* are highly controversial and generally rejected by non-experimentalists.

  9.  **Finalizing the Output Structure:** (Proceed to generate response based on these thoughts.)
answer: |-
  Here is an audit of the book's summary, broken down by your requested categories, followed by an analysis of the theoretical tension and your friend's distinction.

  ### Part 1: Claim-by-Claim Audit

  **1. The Empirical Finding**
  *Claim:* "In the experiment, subjects read about a corporate executive... In the harm version, most said yes; in the help version, only a minority did."
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the robust, replicable core of the Knobe Effect (2003). The asymmetry in folk intuitions regarding side effects is the one thing almost everyone in the field accepts.

  **2. Knobe's Original Conclusion**
  *Claim:* "Knobe concluded that the concept of intentional action is a moral concept through and through: whether we call something intentional depends on whether we disapprove of it."
  *   **Verdict:** **Defensible Simplification.**
  *   **Analysis:** This is an overstatement of Knobe's early position, but not a fabrication. In his 2003 paper, Knobe argued that moral considerations *shape* the application of the concept. However, he did not argue that the concept *reduces* to morality (i.e., that "intentional" just *means* "blameworthy"). He argued that moral judgment is a necessary input for determining intentionality. The book's phrasing ("moral concept through and through") suggests a reductionism Knobe does not strictly endorse, but it captures the spirit of his challenge to the "Standard View" (that intentionality depends only on mental states like belief and desire).

  **3. The Expansion to Other Concepts**
  *Claim:* "Later work has found the same asymmetry in judgments of causation and of knowledge..."
  *   **Verdict:** **Accurate.**
  *   **Analysis:** There is substantial literature showing similar asymmetries in causal attribution (e.g., Alicke) and epistemic attribution (e.g., whether someone "knows" a proposition). This is often grouped under "Folk Psychology" or "Experimental Philosophy" findings regarding normative influences.

  **4. The Shift to General Evaluation**
  *Claim:* "...and has found it for violations of norms that are not moral at all, which shows that the effect is really about evaluation in general and not about intentionality in particular."
  *   **Verdict:** **Defensible Simplification / Live Option.**
  *   **Analysis:** This refers to the "Normative Account" (championed by Knobe in later work, as well as Hindriks and Sytsma). Experiments using conventional norms (e.g., breaking a protocol) do sometimes replicate the effect. However, saying this *shows* the effect is about evaluation "in general" is too strong. It is a leading hypothesis, but competing hypotheses (e.g., that moral norms are unique) remain live. It is an interpretive option, not an established fact.

  **5. The Inconsistency Claim**
  *Claim:* "Since the two scenarios differ only in the moral valence... the experiment shows that the ordinary notion of acting intentionally is internally inconsistent: there is no fact of the matter about what he did on purpose."
  *   **Verdict:** **Genuine Distortion.**
  *   **Analysis:** This is the book's conclusion, not Knobe's. Empirical data about how people *use* a word cannot logically prove that the concept itself is *inconsistent*. It could prove that the concept is context-sensitive, vague, or that people are subject to performance errors (bias). To move from "people give different answers" to "there is no fact of the matter" is a non-sequitur that most philosophers (including most experimental philosophers) reject. Knobe argues the concept has a deep structure involving norms; he does not argue it is incoherent.

  **6. The Methodological Upshot**
  *Claim:* "The philosophical upshot is that the armchair method of testing theories of action against intuitions about cases is bankrupt..."
  *   **Verdict:** **Defensible Simplification (leaning toward Distortion).**
  *   **Analysis:** This was a rallying cry of the "Experimental Philosophy" movement (x-phi) in the mid-2000s. However, the consensus has since moderated. Most researchers now argue that armchair methods are *unreliable in specific domains* or need empirical calibration, not that they are "bankrupt." The book is presenting a polemical stance from 2008 as a settled conclusion.

  **7. The Meta-Ethical Upshot**
  *Claim:* "...and that moral judgment is not a faculty that operates on independent facts but a lens that constitutes the facts it judges."
  *   **Verdict:** **Genuine Distortion.**
  *   **Analysis:** This is a heavy-duty meta-ethical claim (Moral Constitutivism or Anti-Realism) that does not follow from the psychological data. The Knobe Effect shows that moral judgment influences *descriptions* of action. It does not show that moral judgment *creates* the reality of the action. One can accept the Knobe Effect while being a robust moral realist. This is the book imposing its own philosophical agenda onto the science.

  ---

  ### Part 2: The Tension (Moral Concept vs. General Evaluation)

  You asked whether the book's claim that intentionality is a "moral concept" while also saying the effect is "not about intentionality... [but] evaluation in general" is a real tension.

  **Verdict:** It is **careless prose** that obscures a theoretical evolution.

  **Explanation:**
  1.  **Phase 1 (2003):** Knobe argued that *moral* judgment specifically impacts intentionality. This supports the book's first claim ("moral concept").
  2.  **Phase 2 (2006–Present):** Knobe and others found the effect triggers with non-moral norms (etiquette, conventions). The theory shifted to the "Normative Account": the concept of intentional action is sensitive to whether an agent violates *any* relevant norm, not just moral ones.
  3.  **The Tension:** The book presents these as simultaneous conclusions. If the effect is about *general* evaluation, then intentionality is not a *moral* concept "through and through"; it is a *normative* concept.
  4.  **Resolution:** The literature does not view this as a contradiction but as a refinement. The book's phrasing is imprecise. It should say: "Knobe initially argued the concept was morally laden; later work suggests it is sensitive to normative violations broadly."

  ---

  ### Part 3: Your Friend's Distinction (Content vs. Bias)

  Your friend is pointing out the single most important theoretical divide in this literature. The book indeed ignores it, and doing so allows it to make its radical claims.

  **The Distinction:**
  1.  **The Competence (Content) View:** Moral/Normative judgment is *part of the definition* of "intentional." To possess the concept of intentional action just *is* to link it to normative assessment. There is no "pure" mental-state concept underneath.
  2.  **The Performance (Bias) View:** The concept of "intentional" is defined purely by mental states (belief, desire, awareness). However, strong moral emotions (outrage or praise) *bias* our cognitive processing, causing us to misapply the concept in the heat of the moment (similar to how anger might make a foul in sports look more intentional than it was).

  **What Turns On It:**
  *   **If Content is true:** Traditional philosophy of action (which defines intentionality via mental states) is fundamentally mistaken about the *meaning* of the word.
  *   **If Bias is true:** Traditional philosophy of action is correct about the *meaning*, but folk psychology is prone to error. The "effect" is a bug in human cognition, not a feature of the concept.

  **Survival of the Book's Closing Claims:**

  1.  **Claim:** *"The ordinary notion is internally inconsistent."*
      *   **Audit:** **Does not survive.**
      *   **Reasoning:** If the **Bias View** is true, the notion is consistent; people are just applying it poorly. If the **Content View** is true, the notion is context-sensitive or normative, but not necessarily *inconsistent*. Inconsistency requires contradiction; sensitivity to context does not entail contradiction. The data supports neither.

  2.  **Claim:** *"Armchair philosophy of action is bankrupt."*
      *   **Audit:** **Does not survive.**
      *   **Reasoning:** If the **Bias View** is true, armchair philosophy is vindicated (it identified the correct concept, distinct from the noisy folk application). If the **Content View** is true, armchair philosophy needs to *revise* its theories to include normative conditions, but it is not "bankrupt." It simply requires new data. "Bankrupt" implies the method yields nothing of value; at worst, the Knobe effect shows the method yields incomplete data.

  3.  **Claim:** *"Moral judgment... constitutes the facts it judges."*
      *   **Audit:** **Does not survive.**
      *   **Reasoning:** This claim fails regardless of the distinction.
          *   Under the **Bias View**, moral judgment distorts perception of independent facts.
          *   Under the **Content View**, moral judgment determines the *classification* of the act (as intentional or not), but not the *metaphysical facts* of the act itself (the movements, the consequences, the mental states).
          *   To move from "we classify acts differently based on morals" to "morals constitute the facts of action" is a category error. It confuses *conceptual application* with *ontological constitution*.

  ### Summary for Your Reading
  The book is using a robust psychological finding (the asymmetry) to sell a radical philosophical agenda (anti-realism, the death of armchair philosophy).
  *   **Believe:** The experiment works; people judge harm as more intentional than help.
  *   **Question:** The explanation. It is not settled whether this is due to the *content* of the concept or a *bias* in application.
  *   **Reject:** The metaphysical conclusions. The data does not support the claim that there is "no fact of the matter" or that morality constitutes reality. Those are philosophical assertions tacked onto the science, not derived from it.
