  My roommate and I got into this argument at like 1 a.m. about whether you can ever really know whats going on in your own head, and since then I've been keeping a mental list of the times I trust my own self-reports and the times I'm pretty sure I'm making things up, because I think there's a pattern and I want to know what it is. Trust: the faint ringing in my ears right now, definitely there. Whether I'm annoyed at my roommate or just hungry — I can tell, and it's annoyed. The feeling that I know a name I can't quite pull up, which is right way more often than chance, so I go with it. Whether I understood the last paragraph of an article, even though a minute later I couldn't repeat back a word of it. And I'd swear I'm not secretly a snob about people from my hometown — that's not something I'm feeling right now, it's just a fact about me. Don't trust: why I picked this apartment over the identical one downstairs. I'll say it was the light, and I don't believe myself; I think I grabbed the first one I saw and invented the light afterward. Whether I actually liked that movie or just said I did because everyone else did. Whether I decided to scratch my nose a second ago or my hand just went on its own, which honestly kind of creeps me out. Whether I was paying attention for the whole drive home. And my friend mentioned offhand that she has no inner voice at all, no words in her head ever, and now I'm not even sure whether I think in words or not, which seems like the one thing I should be able to just check.

  The rule I'd guess at is something like: I can see whats on the screen but not whats running the program — reliable about what I'm experiencing right now, unreliable about causes and about anything that isn't happening at this moment. But then the hometown-snob one should be out the window and "I was paying attention the whole drive" should be in, and neither of those matches my gut. Also, when I'm dreaming I'm completely convinced I'm awake, and I'm wrong about the most basic fact about my own state, which seems like it should sink the whole screen idea. So: is there a principle, or two or three competing ones, that actually gets my verdicts? State it precisely, tell me which of my verdicts it has to throw out and why I should give them up, and say what it predicts about a case I haven't thought about — can I tell whether I'm imagining a song in my head or actually hearing it coming from somewhere? Pick a further case of your own too, ideally one where you think your principle and the rival one disagree, and please don't just tell me to go read somebody — I want your answer, not a reading list. American English, please, I'm not trying to decipher Britishisms at 1 a.m.
