answer: |-
  **Project Title:** The Structure of Means: A Plan-Relative Account of Anscombe's Prohibition on Killing the Innocent
  **Applicant:** [Your Name], PhD Candidate, Department of Philosophy
  **Request:** Summer Internal Research Grant
  **Period:** June 1 – August 31

  ### 1. Project Summary
  This project proposes a reinterpretation of Elizabeth Anscombe's famous prohibition against choosing to kill the innocent "as a means to your ends." While frequently cited in just-war theory, the criterion of "as a means" is often treated as synonymous with the "intended versus foreseen" distinction of the Doctrine of Double Effect (DDE). This project argues that Anscombe's verdict on Truman can be sustained without relying on the psychological machinery of the standard DDE formula. Instead, I will develop a plan-relative account of means: a death counts as a means when it constitutes a structural step in the agent's plan, such that removing it would collapse the plan's coherence. Over the summer, I will construct this criterion, test it against standard bombing cases (strategic, terror, and tactical), and draft a dissertation chapter evaluating its extensional adequacy.

  ### 2. Research Question and Philosophical Motivation
  The central research question is determinate: **Does a plan-relative reading of "as a means" deliver Anscombe's verdict on Truman while remaining stable across standard bombing cases, without collapsing back into the intended/foreseen distinction it is meant to replace?**

  Current literature leaves this open. Standard interpretations of Anscombe's *Mr. Truman's Degree* often assume she is invoking a robust version of Double Effect, where the moral work is done by the agent's mental state (intention) rather than the action's structure. Critics argue this makes the prohibition psychologically opaque or vulnerable to descriptions of mental states that are difficult to verify. Conversely, defenders often rely on the proportionality clause to do the heavy lifting, sidestepping the definition of "means."

  This project isolates the "means" clause. My preliminary hypothesis is that Anscombe's action theory licenses a structural reading: an effect is a means if it is instrumentally required by the plan *as executed*, regardless of the agent's emotional attitude toward it. This shifts the locus of moral evaluation from private mental states to the public structure of practical reasoning. If successful, this offers a way to condemn terror bombing (where deaths are the lever) without necessarily condemning all strategic bombing (where deaths are collateral), based on whether the deaths are removable from the plan without defeating the plan's objective.

  ### 3. Methodology and Work Plan
  The summer will be divided into three phases: construction, application, and stress-testing.

  **June: Criterion Construction**
  I will formalize the plan-relative criterion. This involves synthesizing Anscombe's account of intentional action with contemporary planning theory to define what it means for an event to be a "step in the chain." The goal is a precise definition that distinguishes between effects that are *used* versus effects that are *suffered* during the execution of a plan. I will produce a working paper section defining the criterion and distinguishing it from standard DDE accounts.

  **July: Case Application**
  I will apply the criterion to three core cases:
  1.  **Terror Bombing:** Deaths are the mechanism of morale breaking. (Expected verdict: Means).
  2.  **Strategic Bombing:** Deaths are foreseen but industry is the target. (Expected verdict: Side effect).
  3.  **Hiroshima:** I will analyze the two live descriptions of the atomic bombing: (a) the city as an industrial target versus (b) the shock of civilian death as the point of the weapon. The plan-relative criterion should yield different verdicts depending on which description accurately captures the operational plan.
  I will draft the core argument of the chapter, mapping the criterion onto these cases.

  **August: Stress-Testing and Revision**
  The primary risk is over-generation. I will test the criterion against the "tactical bomber" case (bombing a munitions plant near civilians). If the plan-relative account condemns this permissible case, it is too strong. I will determine whether this failure requires refining the criterion or accepting a revisionist conclusion about tactical bombing. The month will conclude with a full draft of the chapter and a summary of remaining objections for the dissertation committee.

  ### 4. Expected Outcomes and Risk Assessment
  **Success Conditions:**
  1.  **Differentiation:** The plan-relative criterion successfully distinguishes between terror and strategic bombing without referencing the agent's private intentions.
  2.  **Stability:** The verdict on Hiroshima tracks the operational description (target vs. shock) without begging the question.
  3.  **Deliverable:** A complete draft chapter (approx. 8,000 words) ready for committee review in the fall.

  **Failure Conditions:**
  1.  **Collapse:** The plan-relative criterion turns out to be extensionally equivalent to the intended/foreseen distinction, offering no theoretical advantage.
  2.  **Over-condemnation:** The criterion condemns standard permissible acts (e.g., tactical bombing) because the deaths are structurally necessary for the mission's success, forcing me to abandon the plan-relative approach.
  3.  **Indeterminacy:** The criterion cannot distinguish between the two descriptions of Hiroshima without relying on the very mental states it was designed to bypass.

  In the event of failure conditions 1 or 3, the summer will still produce a valuable negative result: a proof that Anscombe's verdict cannot be decoupled from the standard DDE machinery. This will redirect the dissertation chapter toward defending the psychological account. In the event of failure condition 2, I will document the divergence as a feature, arguing for a more restrictive view of permissible bombing than currently accepted.

  ### 5. Scope and Feasibility
  This project is scoped specifically as a single dissertation chapter, not a full theoretical overhaul. It leverages existing work I have completed on action theory and just-war principles during my third year. The focus is narrow: the definition of "means" in Anscombe's prohibition. It does not attempt to solve the proportionality problem or justify the broader prohibition on killing the innocent.

  The timeline is feasible. The philosophical groundwork is laid; the summer is required for the rigorous formulation of the criterion and the detailed case work. The result will be a polished chapter that clarifies the action-theoretic commitments of just-war theory, suitable for submission to a journal or inclusion in the dissertation.
