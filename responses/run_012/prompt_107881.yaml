answer: |-
  **Session Sequence & Dependencies**

  1.  **Teleology of Need:** Establish that exchange exists to remedy deficit within a self-sufficient community (*autarkeia*).
      *   *Why:* Without a defined end (sufficiency), you cannot distinguish natural from unnatural acquisition.
  2.  **The Commensurability Puzzle:** Ask how unlike goods (houses, shoes) are equated for exchange.
      *   *Why:* This puzzle only arises once exchange is deemed necessary but goods are recognized as heterogeneous.
  3.  **Money as Convention:** Introduce money as the representational solution to the puzzle.
      *   *Why:* Before this, you must establish that no natural equality exists between goods to be discovered. If goods were naturally equal, money would be redundant, not conventional. The claim that money is by *nomos* (convention) depends on the prior failure to find a natural measure.

  **Concrete Case**
  **The Builder and Shoemaker.**
  *   **Must Contain:** Distinct skills, mutual dependency, direct reciprocity (no merchants).
  *   **Must Leave Out:** "Price," "wages," "profit," "scarcity," or specific quantities. Do not specify ratios (e.g., "5 pairs for 1 house"). Quantities trigger calculation instincts that smuggle in market logic and utility functions. Describe only the *necessity* of the swap.

  **Misconceptions & Interventions**

  1.  **Barter Precedence:** Participants will argue barter historically preceded coinage.
      *   **Intervention:** Step 1. Clarify Aristotle offers a logical account of function, not an anthropological timeline. The sequence is conceptual, not historical.
  2.  **Speculation as Sin:** The bankers will hear a moral condemnation of profit.
      *   **Intervention:** Step 1. Frame *chrematistike* not as immoral, but as teleologically misplaced (means becoming ends). It is a category error, not necessarily a vice in itself.

  **Undecided Topics**
  Set aside lending at interest. It conflates the ontology of money (measure) with the practice of lending (contract). Introducing it now invites moralizing that obscures the structural argument about commensurability. It is not a mistake to defer it; it is necessary for clarity.

  **Closing Question**
  "If need is the reality that makes goods commensurable, what specific capacity is lost if money vanishes but needs remain?"
  *(Target answer: The capacity to *measure* justice in exchange, not the capacity to exchange itself.)*

  **Weakest Point**
  The **Concrete Case**. Modern adults cannot easily suspend price intuition. They will implicitly value the house over shoes based on labor or scarcity, smuggling in modern economics. This threatens the "commensurability by need" insight. You may need to intervene more aggressively than planned to strip away price assumptions, or the group will revert to supply-side reasoning despite the constraints. Additionally, *NE* V.5 is notoriously obscure; Aristotle's text itself wavers on whether need or money is the true measure, risking confusion if you press for too much coherence. You must be prepared to acknowledge textual ambiguity without surrendering the structural logic.
