answer: |-
  **Setting:** *The lobby bar of a nondescript conference hotel in Chicago. It is 6:00 PM on the second day of the American Society for Intellectual History annual meeting. Elena (Contextualist) and Marcus (Critical Presentist) are holding glasses of wine. They have just come from a panel on "Ethics in Early Modern Historiography."*

  **Elena:** You were tough on the third panelist, Marcus. I thought her attempt to analyze the Pequot War through the lens of Just War theory was nuanced. You called it "apologetics."

  **Marcus:** I called it *absolution* disguised as analysis. When she described the massacre at Mystic Fort as a "tactical necessity" within their theological framework, she stripped the victims of their humanity to save the perpetrators from our judgment.

  **Elena:** She was trying to recover *their* humanity, not ours. That's the job. If we stand in a courtroom of the present and sentence the seventeenth century, we aren't doing history; we're doing morality play. Bernard Williams put it best: we can only make moral judgments where the alternative is a "live option."

  **Marcus:** Williams's "relativism of distance." I know the argument. Because we cannot seriously choose to be Puritan colonists, we cannot judge them.

  **Elena:** Exactly. It's not a live option for us. We cannot inhabit that form of life. We can't believe in their covenant theology the way they did, we can't organize our economy around their household structures. If the lifestyle isn't available to us, our moral concepts—justice, cruelty, rights—lose their grip. They don't reach that far back. To use them is to commit a category error.

  **Marcus:** But Elena, that assumes our moral concepts are fragile things that snap under the weight of time. I'd argue the opposite. The concepts don't snap; they illuminate. You say we can't judge them because we can't *be* them. But we are judging the *actions*, not applying for the job.

  **Elena:** It's deeper than that. It's about intelligibility. If I label Winthrop a "tyrant," I stop asking what authority meant to him. I impose a liberal individualist framework on a communitarian society. I make him a failed version of me, rather than a successful version of himself. The historian's task is to make the past intelligible on its own terms, not to grade it on a curve it never took.

  **Marcus:** Here is where I have to press you. You talk about "their terms" and "our terms" as if they are distinct languages we can switch between. They aren't. The very categories you use to make them intelligible—"religion," "economy," "the individual," even "society"—are present-day instruments. There is no neutral vocabulary. When you describe their worldview as a "theological framework," you are already using a secular, modern categorization that distances them from us. You are judging them by stealth.

  **Elena:** *[Pauses, swirling her wine]* That is... a fair point. The vocabulary of social science is inevitably modern. But there is a difference between using modern categories to *describe* a structure and using modern morals to *condemn* it. I can explain the mechanics of slavery without calling it a "crime against humanity" in the text, allowing the reader to see the horror without me acting as the prosecutor.

  **Marcus:** Is there? When you choose to describe an enslaved person as "labor capital" rather than a "kidnapped human," you have already made a moral choice. You've chosen the perspective of the master. You argue that suspending judgment allows for understanding. I argue that suspending judgment is itself a moral stance. It's a stance of complicity. By refusing to judge the past by our standards, you implicitly validate the idea that morality is relative to power.

  **Elena:** I'm not a moral relativist, Marcus. I'm a methodological one. I concede this, though: silence can be harmful. If my commitment to "context" results in a narrative that feels like an exoneration of suffering, I have failed the victims. There are moments where the historian must break the fourth wall and acknowledge that some things are intolerable, regardless of context. If I write about the burning of witches and treat it merely as "social cohesion ritual," I lose my own moral agency.

  **Marcus:** And I concede this to you: blunt condemnation can be an intellectual dead end. If I simply label the colonists "genocidaires" and stop there, I haven't explained *how* ordinary people convinced themselves they were doing God's work. If I don't recover their internal logic, I make them monsters, and monsters are not human. If they aren't human, we don't have to understand them. And if we don't understand them, we can't recognize the patterns of their thinking in ourselves. So, I need your context to make my judgment stick.

  **Elena:** So we agree that judgment without context is hollow.

  **Marcus:** And context without judgment is dangerous. But I still maintain my core claim: you cannot escape the standards of your own time. You say the past isn't a "live option." But the structures of domination they built? The racial hierarchies? Those *are* live options. They are still running. We are living in the house they built. We have every right, and indeed every obligation, to inspect the foundation with our current tools.

  **Elena:** *[Sighs]* You're right about the continuity. The distance isn't as absolute as Williams might suggest when the consequences bleed into the present. I worry that when we judge too aggressively, we flatten the alienness of the past. We make history a mirror rather than a window. But... if the window looks out onto a crime scene, perhaps we shouldn't just admire the architecture.

  **Marcus:** Precisely. We admire the architecture to understand how the crime was possible, but we don't pretend it wasn't a crime.

  **Elena:** Then perhaps the compromise is this: I will strive to recover their standards so fully that your judgment lands on something real, not a caricature.

  **Marcus:** And I will strive to make my judgments specific enough that they don't obscure the complexity you're uncovering. No "evil empire" labels. But no "just their culture" either.

  **Elena:** *[Raises glass]* To the tension, then.

  **Marcus:** *[Clinks glass]* To the tension.

  ***

  **Verdict**

  **Marcus is the more defensible historian.**

  His argument strikes at the epistemological root of the discipline: there is no "view from nowhere." As Marcus notes, the categories required to describe the past (e.g., "slavery," "massacre," "patriarchy") are inherently value-laden constructs of the present. To pretend otherwise is not neutrality; it is hiding one's normative commitments behind a veil of objectivity. Because the consequences of past actions often reverberate into the present (as Marcus notes regarding racial hierarchies), the claim that the past is not a "live option" is factually unstable. We *do* live with the results of their choices, making moral appraisal not just possible, but necessary.

  **However, Elena gets something crucial right.**

  Her warning against "grading the past" protects the integrity of historical inquiry. Premature moral condemnation often functions as a substitute for explanation; it allows the historian to feel virtuous rather than informed. If we do not suspend our immediate revulsion long enough to understand *why* actors behaved as they did (the "alienness" Elena protects), we risk producing history that is morally satisfying but intellectually hollow. We must understand the logic of the actor before we can accurately judge the action.
