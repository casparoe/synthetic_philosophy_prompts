      *   **The Core Conflict:** This is the classic EDT vs. CDT debate instantiated via the "Death in Damascus" puzzle (originally Gibbard and Harper).
      *   **Ravi's Stance:** Leans towards EDT (initially) but highlights its instability, then attacks CDT for being "blind" to correlations that seem practically relevant (exploitability). He essentially argues that if a theory ignores predictive correlations in choice, it is defective.
