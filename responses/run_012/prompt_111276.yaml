          *   *Correction:* In Death in Damascus, if you prefer dying in Aleppo, EDT oscillates. CDT says "Probability of Death in D is independent of your choice." But the problem states "Appointment is fixed in whichever city you will end up choosing." This implies $P(Death=D | Choose=D) = 1$. CDT says $P(Death=D | Choose=D) = P(Death=D)$. If the predictor is perfect, $P(Death=D)$ must match the choice. This creates the tension.
