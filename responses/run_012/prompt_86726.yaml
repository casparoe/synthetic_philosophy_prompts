          *   *Option A: Mercury.* Classic, but distant. Bio/Psych students might tune out "19th-century astronomy."
          *   *Option B: Lab-based.* Needs to be something where they have data *before* a hypothesis is fully formed, or where they re-analyze old data with a new model.
          *   *Decision:* Use a *hybrid*. Start with a generic lab scenario to establish the math, then use Mercury (or a close analog) as the *reductio ad absurdum* because it's the canonical case they might encounter in literature later. However, the prompt asks for *one* example to carry the whole session.
          *   *Refinement:* For *this* crowd (Bio/Psych), a historical astronomy case is risky. They need to smell their own work. Let's create a "Lab Notebook" scenario. A researcher finds a pattern in last month's data (Old Evidence) after coming up with a new theory today. Does the old data confirm the new theory?
          *   *Why:* It preserves the structure (Theory $T$ comes after Data $D$ is known) but makes it visceral.

      *   **The Order:**
