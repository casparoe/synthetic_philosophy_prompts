  2.  **Deconstruct the Audience & Topic:**
      *   *Audience:* Pragmatic Bayesians. They care about $P(H|D) \propto P(D|H)P(H)$. They likely treat priors as subjective but likelihoods as objective-ish. They are experimentalists, so they care about *new* data.
      *   *Topic:* POE. If $E$ is known, $P(E) = 1$. If $P(E)=1$, then $P(E|H) = 1$. Then Likelihood Ratio = 1. Then no confirmation. But historically, old evidence *does* confirm new theories (e.g., Einstein explaining Mercury).
      *   *The User's Problem:* Starting with Mercury is too abstract/historical. They need to feel the math break first. The user is right: they need the likelihood ratio framework established *before* the example.

  3.  **Drafting the Plan - Section by Section:**

