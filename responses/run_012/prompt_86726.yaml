answer: |-
  Here is the session plan. It is designed to prevent the "Mercury drift" you experience by grounding the math before the story, and forcing the problem into their own workflow before they can dismiss it as philosophy.

  ### 1. The Order of Play (and Why)

  **Minutes 0–10: The Definition of Confirmation (The Tool)**
  *   **Action:** Do not start with a story. Start with the whiteboard. Write down the Likelihood Ratio form of Bayes' Theorem: $\frac{P(H|E)}{P(\neg H|E)} = \frac{P(E|H)}{P(E|\neg H)} \times \frac{P(H)}{P(\neg H)}$.
  *   **Why:** You suspected this was the missing link. You are right. If they don't explicitly agree that "confirmation" means "changing the odds via the likelihood ratio," the rest of the session is just semantics. Get them to agree that if the Likelihood Ratio (LR) is 1, no confirmation has occurred.
  *   **Check:** Ask them: "If I hand you data $E$, and $P(E|H) = P(E|\neg H)$, did I learn anything?" They must say "No."

  **Minutes 10–25: The Carrier Example (The Trap)**
  *   **Action:** Introduce the single scenario (see Section 2 below). Walk through the timeline: Data is collected $\rightarrow$ Data is known $\rightarrow$ Theory is built to explain Data.
  *   **Why:** You need them to feel the intuition that "Yes, this confirms the theory" *before* you show them the math says "No." If you lead with the math breaking, they will just think they calculated wrong. If they feel the confirmation first, the math break becomes a crisis.
  *   **Check:** Ask: "Does this data support the hypothesis?" They will unanimously say "Yes." Then calculate $P(E)$. Show it equals 1. Show the LR collapses to 1.

  **Minutes 25–35: The Personal Pivot (The Sting)**
  *   **Action:** Force the application to their own work (see Section 4).
  *   **Why:** This prevents them from categorizing POE as "a problem for physicists from 1915." It needs to threaten their current publications.
  *   **Check:** Silence. If they are arguing, you've succeeded. If they are nodding, you've failed to make it personal.

  **Minutes 35–45: Managing the Misconceptions (The Containment)**
  *   **Action:** Field their attempts to fix it. Use this time to label their objections as known philosophical categories without solving them.
  *   **Why:** This crowd loves to fix things. If they solve it, they think the problem is gone. You need them to sit with the tension.
  *   **Check:** Ensure no one leaves thinking "Oh, we just need to adjust the prior."

  **Minutes 45–50: The Closing Question (The Hangover)**
  *   **Action:** Ask the specific question (see Section 5).
  *   **Why:** To ensure they leave feeling the epistemic threat, not just a technical puzzle.

  ---

  ### 2. The One Example: "The Anomalous Control"

  **Do not use Mercury.** It is too distant. For Bio/Psych experimentalists, the example must be from **data re-analysis.**

  **The Scenario:**
  Imagine a postdoc runs a standard behavioral assay in January. In March, she notices a weird blip in the control group data (let's say, a specific circadian rhythm spike). She spends April building a mechanistic model that *specifically entails* that spike. In May, she writes the paper.

  **What this example must preserve:**
  1.  **Certainty:** The data ($E$) is already on the hard drive. $P(E) = 1$. There is no sampling uncertainty about whether the spike happened; it's in the CSV file.
  2.  **Entailment:** The new model ($H$) was constructed *because* of the spike. $P(E|H) = 1$.
  3.  **The Intuition:** Every person in that room knows that putting that graph in the paper makes the model look good. It *feels* like confirmation.

  **Why this works better than Mercury:**
  Mercury's perihelion feels like "history." A control group anomaly feels like "Tuesday." It preserves the logical structure of the astronomical case (Theory constructed to fit known fact) but removes the historical distance that allows them to disengage.

  ---

  ### 3. Misconceptions and When to Head Them Off

  **Misconception 1: "Old just means chronologically earlier."**
  *   **When:** Minute 12, when you introduce the example.
  *   **The Fix:** Explicitly state: "Old" does not mean "collected yesterday vs. today." "Old" means "assigned probability 1 before the hypothesis was evaluated." If you look at your data *before* you write down the hypothesis, it is Old Evidence, even if you collected it five minutes ago.

  **Misconception 2: "This is just a technicality we fix by tweaking conditionalization."**
  *   **When:** Minute 30, when the math breaks. Someone will say, "Just don't set the prior to 1."
  *   **The Fix:** Shut this down immediately. Say: "We are not solving the math today. We are diagnosing the break. If you have to break the rules of probability to make the confirmation work, the problem is in the framework, not your calculation."

  **Misconception 3: "This only bites Grand Theories (Relativity), not ordinary lab claims."**
  *   **When:** Minute 20, during the example discussion.
  *   **The Fix:** Point to the "Anomalous Control" example. "If POE says your control group data cannot confirm your mechanistic model, then POE says 50% of your discussion sections are epistemically empty. It bites everything."

  **Misconception 4: "This is an argument against Bayesianism."**
  *   **When:** Minute 40.
  *   **The Fix:** Clarify: "This isn't Frequentists attacking Bayesians. This is Bayesians noticing their own engine doesn't turn over when the car is already parked. It's an internal consistency problem."

  ---

  ### 4. The Arc Moment: "The Hard Drive"

  **Where:** Minute 28 (Immediately after showing the math collapses).

  **The Script:**
  "I want everyone to take out their phone or open their laptop. Think about the project you are working on *right now*. Think about the dataset you have been sitting on for three months while you tried to figure out the model. You finally have a model that fits that data perfectly. According to the math we just did on the board, that data provides **zero** confirmatory support for your model. It is logically inert. You can only use *new* data collected after today. How many of you are currently writing a paper that relies primarily on 'old' data?"

  **Why this works:**
  It moves the problem from "Einstein's problem" to "My graduation problem." It forces them to realize that if POE is real, their current publication strategy is epistemically bankrupt.

  ---

  ### 5. The Closing Question

  **Do not ask:** "What are the proposed solutions?"
  **Do not ask:** "Who first formulated this?"

  **Ask this:**
  "If we accept that old evidence cannot confirm new theory, does that mean our confidence in General Relativity is irrational? And if it is irrational, what are we actually doing when we say a theory is 'supported' by data we already have?"

  **Why:**
  This forces them to choose between two uncomfortable horns:
  1.  Admitting our best science is irrational (unacceptable).
  2.  Admitting our standard definition of confirmation is broken (the point of the session).
  It ensures they leave feeling the *threat* to confidence, not just a puzzle about $P(E)$.

  ---

  ### 6. What to Refuse (The Guardrails)

  You must explicitly state what you are **not** doing, or the postdocs will hijack the last 20 minutes with "solutions."

  **Say this out loud at Minute 5:**
  "Today we are diagnosing the symptom, not prescribing the cure. We are **not** discussing:
  1.  **Counterfactual Priors:** (e.g., 'What if we didn't know E?'). That requires a metaphysics of possibility we don't have time for.
  2.  **Garber-Style Solutions:** (e.g., Conditioning on the logical relation $H \vdash E$). That changes the definition of the evidence, which is a different debate.
  3.  **Frequentist Escapes:** (e.g., 'Just use p-values'). That ignores the question of how *belief* updates.

  If you propose a fix, I will write it on the side of the board, but we will not evaluate it. We are here to feel the problem, not solve it."

  **Why:**
  This crowd prides itself on problem-solving. If you don't fence off the solutions, they will "solve" POE in 10 minutes using a heuristic, convince themselves it's not a real problem, and leave having learned nothing about the structural tension in their statistical worldview.
