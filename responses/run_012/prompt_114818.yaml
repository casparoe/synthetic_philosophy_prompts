  3.  **Address the Core Tension (Book III vs. Book VI):**
      *   *The User's Hunch:* Is S5 inconsistent with the complex feedback loops Mill describes later?
      *   *Book III Doctrine:* "Composition of Causes" = Mechanical (effects add up). "Chemical Method" = Heteropathic (new properties emerge, laws don't survive). Mill *prefers* Composition for social science.
      *   *The Problem:* Society *looks* chemical. Interactions create emergent properties (prices, norms, institutions) that don't look like simple sums of individual psychology.
      *   *Mill's Solution (The Nuance):* Mill isn't saying society *isn't* complex. He's saying the *ultimate* laws are psychological. The "Composition" applies to the *causes* (individual actions), even if the *effect* (social state) is complex. However, the user is right to spot tension. If effects react back on causes (feedback), is it still simple composition?
      *   *Resolution:* Mill distinguishes between the *ultimate laws* (psychology) and *empirical laws* (sociological regularities). Composition applies to the derivation from ultimate laws. But he admits the "Chemical Method" (treating society as a whole without looking at parts) is the error. The tension is real: Mill wants the certainty of deduction (Composition) for a subject that behaves chemically (emergence). He tries to solve this with "Ethology" (laws of character formation) to bridge the gap.

