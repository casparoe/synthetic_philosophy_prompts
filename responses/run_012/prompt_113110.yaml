answer: |-
  This is a classic problem in the philosophy of social action, often discussed under the heading of "joint intentionality." Your intuitions are sharp and align closely with the leading theories (specifically those of Michael Bratman and Margaret Gilbert), but you have identified the exact friction points where those theories are tested.

  Here is the principle that best fits your verdicts, the analysis of your specific tensions, and the necessary sacrifice regarding the saving couple.

  ### The Principle: The "We-Intention" Account

  Two people are doing something together if and only if three conditions are met:

  1.  **Mutual Responsiveness:** Each adjusts their actions in response to the other's actions (or expected actions) to facilitate the activity.
  2.  **The Intentional Object Clause:** Each intends the action under a **joint description** ("*We* are doing X"), rather than an individual description conditioned on the other ("*I* am doing X because *you* are doing Y").
  3.  **Common Knowledge:** It is open between them that Conditions 1 and 2 obtain.

  #### Which clause does the work?
  *   **The Intentional Object Clause** is the heavy lifter. It distinguishes the **Concert-goers** from the **Bakeries**.
  *   **Common Knowledge** distinguishes the **Wardrobe-carriers** from the **Flatmates**.
  *   **Mutual Responsiveness** distinguishes the **Clappers** from **Parallel Play**.

  ### Applying the Principle to Your Tensions

  **1. The Concert-Goers vs. The Rival Bakeries**
  You asked what distinguishes these, since both involve acting based on expectations of the other. The difference lies in the **Intentional Object Clause**.
  *   **The Bakeries:** Bakery A intends: "I will set price $X$ to maximize *my* profit, given that Bakery B will set price $X$." The object of the intention is *individual profit*. The other bakery is merely a environmental condition, like the weather.
  *   **The Concert-Goers:** Friend A intends: "*We* will attend this concert." Even if the motivation is obligation, the *structure* of the intention is joint. They are not merely coordinating separate outings; they are constituting a single social unit for the evening.
  *   **Verdict:** The principle correctly rules the Bakeries as separate and the Concert-goers as together.

  **2. The Clappers vs. The Promise**
  You worried that without a promise, the clappers are joint only by accident. The **Mutual Responsiveness** clause saves this.
  *   A promise creates a *prior* commitment. However, joint action can be *emergent*. When the second person claps on the beat, hearing the first, and the first person hears that and claps again to maintain the rhythm, a micro-"We-Intention" is formed in real-time.
  *   It is not accidental because it requires active, ongoing adjustment. If one stopped, the other would (typically) stop or adjust. This feedback loop creates the "togetherness" without a prior contract.
  *   **Verdict:** The clappers count as doing it together from the moment the rhythm is mutually recognized and sustained.

  **3. The Pavement Shufflers**
  *   They fail the **Intentional Object Clause**. I do not intend "We shall pass." I intend "I shall pass," and your movement is an obstacle I navigate. We are cooperating, but we are not acting *together*. We are acting *alongside*.

  ### The Saving Couple: The Necessary Sacrifice

  You wrote: *"Before the discovery I cannot decide whether they were saving for the trip together, and afterwards I am sure they were, which worries me, since nothing they did changed."*

  Here you must sacrifice one intuition. **You must give up the verdict that they were saving together *before* the discovery.**

  According to the **Common Knowledge** and **Intentional Object** clauses, joint action is impossible without mutual awareness.
  *   **Before Discovery:** Person A intends "I am saving for a trip." Person B intends "I am saving for a trip." These are parallel individual intentions. The fact that the objects of their savings match is a coincidence, however happy. There is no "We" in the loop.
  *   **After Discovery:** They can now form a joint intention to *continue* saving together. They can also retrospectively *narrate* their past savings as a joint effort ("Look, we were working toward this all along!").
  *   **The Metaphysical Reality:** The narration changes the *meaning* of the past, but it does not change the *ontological status* of the past action. They were not saving together then; they are a couple saving together now, who happen to have saved money in the past.

  If you insist they *were* saving together before the discovery, you are forced to accept that the Bakeries were also fixing prices together (since they also had matching intentions unknown to each other until analyzed), which contradicts your correct intuition about the bakeries. To keep the Bakeries separate, you must keep the pre-discovery Savers separate.

  ### Unmentioned Case Rulings

  Based on this principle, here is how it rules on your specific unmentioned case and a few extrapolations:

  *   **The Saving Couple (Pre-Discovery):** Not doing it together. (As argued above).
  *   **The Saving Couple (Post-Discovery):** Doing it together (regarding future savings).
  *   **A Choir Singing from Sheet Music:** Together. (Shared object "We sing," mutual responsiveness to pitch/tempo, common knowledge).
  *   **Two People Reading the Same Book in Silence:** Not together. (Fails Mutual Responsiveness and Intentional Object).
  *   **A Soldier Following an Order to Flank:** Not together *with the commander* in the philosophical sense. The soldier intends "I flank." The commander intends "He flanks." They lack the mutuality of the "We." (Though they are part of a larger joint enterprise).

  ### Confidence and Uncertainty

  **Confidence Level:** I am **85% confident** in this framework. It aligns with the dominant "Shared Intention" theory in philosophy (Bratman/Tuomela) and successfully resolves the Bakeries/Concert tension which is the crux of your query.

  **Point of Least Certainty:** I am least sure about the **threshold for the Clappers**.
  My principle says they are joint once mutual responsiveness creates a "We-intention." But *when* exactly is that? Is it the second clap? The third? If one claps, and the other claps once by accident, and then they stop, was that "doing something together"?
  My verdict leans toward "no"—that was a collision, not a joint action. Joint action requires a *commitment to continuity*, even if fleeting. The exact moment a collision becomes a collaboration is a fuzzy boundary that no principle can draw with perfect precision. I flag this as the weakest point in the application of the rule.

  ### Summary of Advice
  1.  **Adopt the "We-Intention" Principle:** Focus on whether the intention is "We do X" vs "I do X because of Y."
  2.  **Sacrifice the "Pre-Discovery" Saving Intuition:** Accept that silent parallel saving is not joint action, even if it later becomes the foundation for it.
  3.  **Accept Emergent Jointness:** Allow that the Clappers form a "We" in real-time through responsiveness, without needing a prior promise.
