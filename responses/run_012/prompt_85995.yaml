answer: |-
  **The Case of the Embargoed Manuscript**

  Alex and Blake are junior archivists at the same museum, working on identical digitization projects in separate wings. Each asks their respective department head for permission to handle a specific fragile manuscript to scan it. Each head says, "Yes, proceed," and provides the access code. Both agents follow all safety protocols, wear gloves, handle the pages with equal care, and return the manuscripts undamaged. The single difference is Fact F: Alex's department head had the curatorial authority to authorize access to that manuscript. Blake's head did not; unknown to anyone, that manuscript was under a donor's strict legal embargo that overrode departmental authority. Alex's act was authorized stewardship. Blake's act was unauthorized handling, a violation of the donor's conditions and the museum's fiduciary duty, despite identical care and intention.

  ***

  **Verdicts of the Three Accounts**

  **1. The Control Principle (CP)**
  *Commitment:* Blameworthiness is tethered exclusively to the agent's voluntary control and epistemic access.
  *Verdict:* **Equal Blameworthiness (None).**
  *Derivation:* Both Alex and Blake exercised the same quality of will, deliberated on the same information, and took the same precautions. Fact F (the existence of the embargo) was outside their power to determine, foresee, or prevent at reasonable cost. Since the difference between authorization and violation rests entirely on F, and F was not up to them, neither agent is blameworthy. The CP insists that moral luck cannot touch blame; since their control was identical, their blameworthiness must be identical.

  **2. The Accountability Account (AA)**
  *Commitment:* Responsibility involves normative debts (apologies, explanations, repairs) that arise from the objective status of one's actions, distinct from culpability. One can incur a debt by infringing a right even if one is not blameworthy for the infringement.
  *Verdict:* **Unequal Debt.**
  *Derivation:* Alex's act infringed no rights; the owner (the museum/donor) consented. Alex owes nothing. Blake's act, under the fullest true description, was a use of property without the requisite consent of the rights-holder. Even though Blake was not culpable, a normative boundary was crossed. To restore the normative relationship with the donor and the museum, Blake owes an explanation and an apology ("I am sorry I handled your property without valid permission"), whereas Alex does not. The debt tracks the wrong, not the blame.

  **3. The Agent-Regret Account (ARA)**
  *Commitment:* It is fitting for an agent to feel a special kind of distress (agent-regret) regarding bad outcomes or wrongs they caused, even if they are not blameworthy, because they were the author of the act.
  *Verdict:* **Unequal Fittingness of Regret.**
  *Derivation:* It would be fitting for Blake to feel a pang of distress upon learning of the embargo—a wish that *they* had not been the one to handle the manuscript. This is not guilt (which implies blame), but agent-regret: a recognition of their causal and agential involvement in a rights violation. Alex, having violated no rights, has no object for such regret. The fittingness of the feeling tracks the objective moral valence of the act, not the agent's culpability.

  ***

  **The Working Feature and Its Removal**

  The feature doing the work is **Fact F (the hidden embargo status)**. This feature alters the *deontic status* of the act (permissible vs. impermissible) without altering the *consequences* (no damage) or the *agent's state* (same care/knowledge).

  If Fact F is removed (e.g., if both heads are authorized, or both are unauthorized), the case collapses into uniformity: either both agents owe nothing and feel no regret, or both owe apologies and feel regret. Crucially, this does **not** collapse into the ordinary asymmetry of outcome luck (e.g., the negligent driver who hits a pedestrian vs. the one who doesn't). In standard outcome luck cases, the difference is purely consequential (harm vs. no harm), and the "wrongness" of the act (recklessness) is held constant. Here, the *consequences* are held constant (no harm), and the *wrongness* of the act varies. This isolates moral luck from consequential luck, showing that luck can determine whether a right was violated, not just how much damage was done.

  ***

  **The Strongest Objection: Debt as Disguised Blame**

  A critic might argue: *"To say Blake 'owes an apology' is just to blame Blake in softer language. If Blake is truly not blameworthy (per CP), demanding an apology imposes a burden that functions as a sanction. Therefore, the Accountability Account hasn't saved the Control Principle; it has merely relocated the blame from 'internal guilt' to 'external debt,' violating the spirit of CP."*

  **Reply:** This objection conflates *sanction* with *acknowledgment*. A blameworthy apology says, "I was wrong to do this" (admitting fault). A non-culpable accountability apology says, "I am sorry this happened through me" (acknowledging infringement). The burden on Blake is not a punishment for a bad will, but a cost of participating in a normative community where rights are objective. If we accept that rights can be infringed accidentally (like stepping on someone's foot in a crowd), the duty to apologize follows the infringement, not the malice. The CP is preserved because Blake is not *condemned*, only *called to answer*.

  ***

  **Assessment**

  **Hardest Verdict:** The **Accountability Account (Unequal Debt)** was the most difficult to secure. It requires the intuition that one can owe a moral debt for an act that was, ex ante, perfectly rational and careful. This leans heavily on the specification that "wrongness" is objective (rights-based) rather than subjective (culpability-based). Without Spec 2 explicitly demanding a "wrong" in one branch, it would be tempting to say Blake did nothing wrong at all.

  **Rigging Check:** I had to lean on Spec 2 to ensure the unauthorized handling counts as a "wrong" recognizable by ordinary morality. If the reader views "wrong" as synonymous with "culpable violation," the case fails. However, ordinary morality does distinguish between "You broke my vase (accidentally)" and "You didn't break my vase." The former usually invites an offer of repair/apology, the latter does not. The case survives this if we accept that property rights create strict duties of non-interference, the violation of which constitutes a wrong even if non-culpable.

  **The "Same Thing" Complaint:** A critic may argue Alex and Blake did *not* do the same thing: Alex "borrowed with consent," while Blake "misappropriated." If the act descriptions differ, there is no moral luck, just different acts.
  *Response:* This objection begs the question against moral luck. Under the description available to the agents ("took the manuscript after supervisor approval"), they did the *exact same thing*. The moral luck arises precisely because the *true* moral description of the act depends on facts outside their control. If we define the act only by its true moral description, moral luck becomes impossible by definition. The case holds only if we accept that agents can perform the same voluntary action which acquires different moral statuses due to luck.
