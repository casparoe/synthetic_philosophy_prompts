answer: |-
  **Priority Order for Postdoc Slots**

  **Slot 1: Question (a) — Ontological Independence**
  **Slot 2: Question (b) — Semantic Correspondence**
  **Slot 3: Question (c) — Empirical Robustness (The "Test")**

  ***

  ### Defense of the Order

  **1. Upstream Dependency (Why (a) is first)**
  Question (a) is the metaphysical bottleneck. Before we can ask if a feature corresponds to the world (b) or if it survives retraining (c), we must establish whether "the feature" is a stable object of reference independent of the probe used to find it. If the answer to (a) is negative—if features are entirely probe-relative artifacts—then Question (b) becomes a category error (you cannot ask what a mirage corresponds to) and Question (c) loses its philosophical stakes (robustness of an artifact is merely statistical, not ontological). A philosopher can resolve the conceptual framework for (a) without waiting on empirical data, making it the highest-leverage intellectual investment. Clearing this ground dictates how the other two questions are even formulated.

  **2. Philosophical Feasibility (Why (b) is second)**
  Question (b) is the safety-critical payload, as the board member correctly notes. However, it is downstream of (a). A philosopher is uniquely positioned to tackle (b) because it is a problem of intentionality and semantics, not just engineering. They can analyze whether "internal coordinate systems" can bear semantic weight without needing to train models themselves. It ranks below (a) only because its coherence depends on (a)'s resolution. If (a) concludes that features are real, (b) becomes the urgent follow-up. If (a) concludes they are instrumental, (b) shifts from "what does this mean?" to "how useful is this fiction?" The postdoc in Slot 2 should be prepared to pivot based on Slot 1's findings.

  **3. Agency and Risk (Why (c) is third)**
  Question (c) is the empirical gatekeeper, but it is the wrong fit for a primary philosophy postdoc focus. It is "boringly empirical" precisely because it requires GPU cycles, hyperparameter tuning, and access to training infrastructure—things a philosopher typically lacks. Funding a philosopher to wait for empirical results is high-risk; if the ML community doesn't produce the robustness data in two years, the postdoc has nothing to analyze. Furthermore, the *interpretation* of (c) depends entirely on the outputs of (a) and (b). Knowing a feature is robust across seeds tells us nothing about safety unless we know what the feature *is* (a) and what it *means* (b). Slot 3 should focus on the *epistemology* of the test (what counts as sufficient robustness) rather than the test itself, but this is conceptually downstream of the first two.

  ***

  ### Conditions for Re-Ranking (The Two-Year Review)

  **Move Question (c) Up if:**
  The ML community produces a definitive, large-scale consensus on robustness (e.g., a major lab demonstrates that *no* high-level features survive seed changes, or conversely, that they all do). If the empirical data becomes settled fact, the philosophical urgency shifts to interpreting those results for safety policy. The Slot 3 postdoc would then move to Slot 1 to lead the integration of these hard facts into the safety framework.

  **Move Question (b) Up if:**
  Slot 1 resolves Question (a) quickly (within 6 months) with a clear "Realist" consensus. If we establish that features are mind-independent objects, the semantic question (b) immediately becomes the primary blocker for safety claims. The foundation should then pivot resources to determining if those real features map to human concepts or deceptive internal shortcuts.

  **Move Question (a) Down if:**
  The field converges on "Pragmatic Instrumentalism." If the consensus becomes "It doesn't matter if it's real, only if the probe works," then Question (a) is dissolved. Continued funding for ontological debate would be wasteful. In this scenario, (a) drops to third, and (b) and (c) become the sole focus for operationalizing safety claims.
