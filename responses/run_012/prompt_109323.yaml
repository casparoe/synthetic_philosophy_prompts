  ok probably a dumb question but I've been reading about updating your beliefs with Bayes and I've managed to tangle myself up.

  The situation: I test my well water with one of those home kits that turns yellow if there's coliform in it. Around here maybe 1 in 20 wells are actually contaminated. The kit's manual says it's 90% sensitive and 90% specific. I run it in my dim basement and I think I see yellow, but the light is bad and honestly I'd only say I'm about 70% sure I'm looking at yellow and not just the normal faint tinge of the water.

  My understanding is that Bayes' rule is for when your evidence is certain, and Jeffrey conditonalization is the version you use when it isn't. Since I'm not certain what I saw, I should use Jeffrey, right? So do I set my new probability for "the kit came up positive" to 0.7 and plug it into p'(H) = p(H|E)p'(E) + p(H|¬E)p'(¬E)? But then where do the 90% numbers go — before or after the 0.7? If I put them in I feel like I'm counting the kit's unreliability twice, and if I leave them out then the unreliability just vanishes, which can't be right either. Also, if I look at the vial again tomorrow in better light and change my mind again, does the order of the two updates matter, or does it come out the same either way?

  And a side thing — can I use the same move on my hunch that the contamination, if there is any, is coming from my neighbor's septic field rather than the road runoff? I'd put that at like 60%.

  thanks, I feel like I'm missing something basic about what "uncertain evidence" is even supposed to mean here
