      *   *The Split:* The implicit view assumes "human execution" is necessary for art, or that the AI's contribution is too autonomous/random compared to a trained assistant. It presupposes creativity requires *direct causal control* over the physical manifestation, not just the conceptual blueprint.
      *   *Contradiction:* If authorship follows intention (Rubens), why not the prompter? Because the AI isn't a subordinate agent; it's a black box. The practice requires *predictable translation of intent to output*. Assistants are trained to obey; models are probabilistic.

  3.  **Edge Cases:**
      *   *300 Generates:* Selection fatigue. Is curation art?
      *   *Curating 10k outputs:* Archiving vs. Creating.
      *   *Autonomous Model:* No human intent. Clearly not art under current view.
      *   *Photographer:* Points machine at world. Accepted now, but wasn't then. Why? Because the photographer controls framing/moment (intent), even if the camera does the chemistry.

  4.  **Rival Theory (Creativity as Selection/Social Attribution):**
      *   If creativity is selection/curation, the "300 generates" person is an artist.
      *   If creativity is social attribution, galleries decide, not theories.
      *   *Changes:* Labels would credit "Concept/Selection" rather than "Made by." Prizes would reward vision over technique.

