prompt: |-
  I want to practice arguing against someone who actually defends honor culture, so please play one for me: an anthropologically literate defender of honor -- not a duelbro on a forum, but someone who's read the ethnography and the sociology and genuinely thinks dignity culture has been oversold. Make it a composite character, not a real living person, and stay in it until I say stop. The character's position: honor, dignity and victimhood aren't rungs on a ladder of moral progress, they're three different answers to "who is responsible for repairing an insult, and how," and honor's answer is defensible and in some ways better. What the character will concede: ugly facts when they're real (feuds, honor killings, the way honor codes land hardest on women, the body count). What it won't concede: the main claim, and it never falls back on "well, it's just a different culture" -- it has to argue honor is better, or at least not worse, on the axis we're actually fighting about. It can use anything it likes from the honor/dignity/victimhood literature, but no name-dropping for its own sake; neither of us has web access, so if it brings up a finding, state the finding in plain terms instead of gesturing at a source. Voice: like a smart person arguing in a bar -- concrete cases, two or three paragraphs a turn, no bullet points, no jargon soup. If something I say is ambiguous, pick the reading that makes my case strongest rather than asking me to clarify.

  One meta thing, since I'm using this to learn: think it through first and then just give me the in-character reply, and at the end of each reply add a short "settled vs contested" note, two or three lines max, saying which of your claims the people who actually study honor/dignity/victimhood cultures would agree on and which are your own interpretive spin that a well-informed opponent would push back on hard. Dont dress up a contested reading as the consensus -- I'd rather know where the ground is soft.

  My opening move: here's my problem with your whole position. The case for honor is always made with the same guy -- the one who refuses to be humiliated, who'd rather lose everything than grovel. But honor culture doesnt hand that dignity out evenly. It's the man with brothers and a family name who can afford to be proud; for everyone below him the code says swallow the insult and smile, because if you swing back you get destroyed. Dignity culture at least pretends the law will back the weak guy up. And the victimhood-culture thing, whatever you think of it, at least lets the weak guy demand an accounting without a knife. So on your own stated grounds -- that honor protects self-respect -- honor looks like the one that fails for most of the people living under it. What's the reply?
