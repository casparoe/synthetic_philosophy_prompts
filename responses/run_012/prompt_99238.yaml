  hey, im putting together a session for my metaphysics reading group on origin essentialism — the "could you have come from a different sperm and egg" thing — and I want a decision tree / taxonomy of the positions rather than just a list of famous names. can you build me one? the point is to sort people by what they actually commit to, so every branch node has to be a question someone can answer without already knowing where it leads, and each node should be a concrete case or a bare claim, not a label.

  work down from the most basic commitment, roughly like this (reorder if you think the logic wants it):

  first, is there even a determinate fact about which counterfactual histories contain *you* as opposed to some qualitative duplicate — or does "what could have happened to you" only get a truth value relative to a description or a qualitative profile you pick out? if there's no fact of the matter, that's a leaf (the deflationary / anti-essentialist one), and I want to know what it makes of ordinary self-regarding modal regret ("I could've studied medicine").

  if there is a fact, what does the necessity attach to: a bare thisness of you, your material constitution, or your causal origin? 
  - bare thisness → haecceitism leaf. on this view you could in principle have had different parents entirely — flag whether that's actually forced or just permitted.
  - constitution → split: is it your specific matter/atoms, or your genome? use the clone / identical-twin case as the diagnostic: same genome, different origin. does that thing get to be you?
  - origin → keep going.

  for the origin branch, the key split is what "origin" ranges over: the parents / biological source, or the specific gametes? the diagnostic case is whether you could have been your sibling — same parents, a different sperm and egg. coarse views have to say yes there (or explain why not), fine-grained views say no. then: does the necessity stop at the gametes or recurse, i.e. do the gametes themselves have essential origins, and if not, why does the regress get to bottom out here?

  one more node i want somewhere: is the impossibility of a different origin a metaphysical impossibility, or just a biological fact about how mammalian reproduction happens (a nomological "no")? that should be its own leaf.

  leaves i need present: strict gamete-level origin essentialism, coarse parental origin essentialism, constitution/genome essentialism, haecceitism, deflationism, and the biological-necessity-only view. 6-9 leaves total. each leaf gets a name (or "unnamed" if nobody really defends it) plus one sentence on its most awkward commitment, and — this is the part i care about — which of the concrete cases it has to bite the bullet on.

  two things i really want you not to paper over: (1) flag any pair of leaves your tree *can't* separate with the cases above, and say what extra question would prise them apart (im guessing the metaphysical vs merely-biological pair is one of these — they answer every concrete case the same way). (2) mark the combinations of answers that come out empty, and diagnose each: incoherent, unattractive, or just unexplored? i have a hunch that "the gametes are essential but the parents aren't" is straight-up incoherent since the gametes fix the parents, but tell me if im wrong.

