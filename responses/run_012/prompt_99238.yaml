answer: |-
  # DECISION TREE: ORIGIN ESSENTIALISM TAXONOMY

  **Q1. Is there a determinate fact of the matter about whether *you* exist in a counterfactual scenario where the qualitative profile matches yours but the history differs, independent of how we describe it?**
  *   **NO** → [Leaf 1]
  *   **YES** → Go to Q2.

  **Q2. Could you have existed with completely different parents and different matter, provided it is still primitively *you*?**
  *   **YES** → [Leaf 2]
  *   **NO** (Identity depends on some qualitative/historical feature) → Go to Q3.

  **Q3. Is the feature that secures your identity internal to your body (constitution) rather than external (causal history)?**
  *   **YES** → Go to Q4.
  *   **NO** (Identity depends on causal history/origin) → Go to Q5.

  **Q4. If a duplicate appeared spontaneously without parents, would it be you if it shared your exact atoms, or just your genetic code?**
  *   **Exact Atoms** → [Leaf 3]
  *   **Genetic Code** → [Leaf 4]

  **Q5. If your parents had conceived a different child (different sperm and egg) at the same time, would that child be you?**
  *   **YES** (Only parents matter, not specific gametes) → [Leaf 5]
  *   **NO** (Specific gametes matter) → Go to Q6.

  **Q6. Is the impossibility of originating from different gametes grounded in the laws of biology (contingent) or the nature of identity itself (necessary)?**
  *   **Laws of Biology** → [Leaf 6]
  *   **Nature of Identity** → [Leaf 7]

  ***

  ## LEAF DESCRIPTIONS

  **Leaf 1: Deflationism / Anti-Realism about Transworld Identity**
  *   **Awkward Commitment:** Ordinary modal claims like "I could have studied medicine" are strictly false or only true relative to a chosen description, not because *you* literally exist in that world.
  *   **Bullet to Bite:** You must deny that there is any objective truth to self-regarding regret about alternative life paths; it is merely a way of speaking about qualitative counterparts.

  **Leaf 2: Haecceitism**
  *   **Awkward Commitment:** You are a bare particular; your properties (including parents and matter) are only contingently attached to your "thisness."
  *   **Bullet to Bite:** You must admit it is *metaphysically possible* (though perhaps not actual) that you were born to different parents entirely; the view permits this even if it doesn't force it.

  **Leaf 3: Material Constitution Essentialism**
  *   **Awkward Commitment:** You are identical to the specific collection of atoms you started with; metabolic replacement threatens your continued existence.
  *   **Bullet to Bite:** You must deny that a perfect clone (same genome, different atoms) is you, and affirm that a scattered collection of your original atoms reassembled would be you.

  **Leaf 4: Genetic Essentialism**
  *   **Awkward Commitment:** You are your genome; numerical identity tracks genetic code rather than material continuity or causal origin.
  *   **Bullet to Bite:** You must affirm that an identical twin or a clone created from your DNA years later is literally *you*, not just a duplicate.

  **Leaf 5: Coarse Parental Origin Essentialism**
  *   **Awkward Commitment:** Your essence is fixed by the couple who produced you, but not the specific cellular vehicles they used.
  *   **Bullet to Bite:** You must affirm that you could have been your own sibling (same parents, different sperm/egg), provided the conception event was roughly contemporaneous.

  **Leaf 6: Biological Necessity View (Gamete-Level)**
  *   **Awkward Commitment:** You could not have come from different gametes, but only because mammalian biology forbids it, not because of metaphysical identity conditions.
  *   **Bullet to Bite:** You must admit that in a world with different biological laws (e.g., fission reproduction), you could have had a different origin; the necessity is nomological, not metaphysical.

  **Leaf 7: Strict Gamete Origin Essentialism (Kripkean)**
  *   **Awkward Commitment:** It is metaphysically impossible for you to have originated from any other specific zygote; identity is locked to the precise initial cell.
  *   **Bullet to Bite:** You must accept a potential regress (do the gametes have essential origins?) or posit an arbitrary stopping point at conception without further explanation.

  ***

  ## STRUCTURAL DIAGNOSTICS

  ### 1. Indistinguishable Leaves (Case-Wise)
  **Leaf 6 (Biological Necessity) and Leaf 7 (Strict Gamete Essentialism)** are extensionally equivalent regarding concrete cases. Both answer "No" to "Could you have been your sibling?" and "No" to "Could you have had different parents?"
  *   **Prising Question:** "Is there a possible world with different laws of nature where you originate from different gametes?"
      *   Leaf 6 says **Yes** (contingent impossibility).
      *   Leaf 7 says **No** (metaphysical impossibility holds across all worlds).

  ### 2. Empty / Incoherent Combinations
  **The "Gametes Essential, Parents Not" Node:**
  *   **Diagnosis:** **Incoherent.**
  *   **Why:** Gametes are causally dependent on parents. If the specific gamete $g$ is essential to you, and $g$ could only come from parents $P$, then $P$ are essential to you by transitivity. A view claiming specific gametes are essential while allowing different parents is logically impossible unless one posits magical gamete transplantation across persons, which changes the case description. The tree structures this by placing the Parent Question (Q5) before the Gamete Question (Q6), preventing this path.

  **The "Internal Constitution + Origin Essentialism" Node:**
  *   **Diagnosis:** **Unattractive / Redundant.**
  *   **Why:** If your internal makeup (atoms or genome) is sufficient for identity (Q3 = Yes), adding an origin constraint is usually redundant (since the genome implies parents) or conflicting (if spontaneous generation is possible). Most theorists treat these as competing explanations, not conjunctive ones.

  ***

  ## MY FLAG

  **I plant my flag on Leaf 5: Coarse Parental Origin Essentialism.**

  **Why:**
  1.  **Avoids the Regress:** Strict Gamete Essentialism (Leaf 7) invites the uncomfortable question: "Why the sperm and egg, but not the parents' gametes?" Stopping at the parents feels like a more natural causal boundary for personhood without demanding micro-physical precision that seems irrelevant to psychological continuity.
  2.  **Avoids the Clone Problem:** Unlike Genetic Essentialism (Leaf 4), it respects the intuition that an identical twin is a distinct person, not *you*.
  3.  **Avoids Haecceitist Excess:** Unlike Haecceitism (Leaf 2), it respects the strong intuition that *who* made you matters metaphysically, not just qualitatively.
  4.  **Handles Vagueness:** Specific gamete identity (Leaf 7) is biologically fuzzy (when does the sperm become part of the egg?). Parental identity is less fuzzy.

  **The Cost:** I must bite the bullet that **you could have been your sibling.** If your parents conceived a different zygote at the same time, that person is *you* on this view. This is counterintuitive to many, but less problematic than the regress of strict gamete essentialism or the biological contingency of Leaf 6.
