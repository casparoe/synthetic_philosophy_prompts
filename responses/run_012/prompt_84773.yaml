answer: |-
  ### Part 1: The Board Procedure (The "Cascade Breaker")

  Print this single page. Do not move to the next question until the current one is resolved. If you hit a "Clear No," stop immediately.

  | Order | Question | What counts as a clear YES | What counts as a clear NO | What to do if it's murky | Real test or judgment call |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Who moved first, and did they survive?** | We can name the specific first adopter and confirm they are financially stable or growing *because* of this change. | The "first movers" are startups burning cash, or established players who are struggling/quiet about results. | **Action:** Assign someone to call a contact at the first-mover company off the record. <br>**Default:** Treat as NO. | Real Test |
  | **2** | **Do we have private data that contradicts the crowd?** | Our own sales/staff/customer data suggests this will fail in our specific locations (e.g., our demographic is older/less tech-savvy). | Our data is missing, or our data actually supports the trend. | **Action:** Run a 2-week small-scale pilot in 2 centres before board vote. <br>**Default:** Treat as MURKY. | Real Test |
  | **3** | **Is the cost of being wrong reversible?** | We can undo this in <3 months with <5% of the implementation cost lost (e.g., a marketing campaign). | Undoing this requires retraining, new hardware, or contract breaks (e.g., till systems, supply contracts). | **Action:** Raise the voting threshold to 80% board approval. <br>**Default:** Treat as NO. | Real Test |
  | **4** | **Are we doing this to avoid blame or to make money?** | The primary argument is "This increases margin/volume by X%." | The primary argument is "We look outdated if we don't" or "I don't want to be the one who said no." | **Action:** The Chair must reframe the proposal purely in financial terms. If it can't be, shelve it. <br>**Default:** Treat as NO. | Judgment Call |
  | **5** | **Is this a constraint or a choice?** | Our suppliers or regulators are forcing this (e.g., pesticide bans, legal compliance). | This is purely a strategic market positioning choice. | **Action:** If constraint, move to implementation. If choice, proceed to Step 6. | Real Test |
  | **6** | **Does this align with our specific value proposition?** | This fits our brand (e.g., "Premium Service" or "Lowest Price") even if no one else was doing it. | We are only doing this because "the sector" is doing it; it conflicts with our usual strategy. | **Action:** This is a values vote. Board members must vote anonymously to avoid peer pressure. | Judgment Call |

  ***

  ### Part 2: Applying the Procedure to Your Cases

  | Case | Which steps actually decide it | Verdict | How confident | The cheapest thing that would change the verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Subscription Boxes** (Sector + competitor doing it) | **Step 1 & Step 3.** Step 1 fails (competitors likely doing it for buzz/valuation, not proven profit). Step 3 fails (logistics are hard to unwind once staff are trained). | **Don't Follow** | High | A leaked P&L from the competitor showing the box scheme is profitable, not just a customer acquisition loss-leader. |
  | **2. Pesticide Ban** (Growers stopped supply) | **Step 5.** This is not a cascade; it is a supply chain constraint. If growers won't sell it, you can't stock it. | **Follow (Comply)** | High | Proof that the growers are wrong and supply will return (unlikely). |
  | **3. Price Match** (Region up 8%, you lean no) | **Step 2 & Step 4.** Step 2: You likely lack data on customer price elasticity. Step 4: Your "No" leans on "looking good to customers" (blame avoidance) vs "protecting margin" (money). | **Follow** | Medium | A 1-week A/B test in 2 stores: one holds price, one raises. Measure volume drop vs margin gain. |

  **Note on Case 3 (The Price Match):**
  The procedure says **Follow**. You said your gut says **No**.
  Here is what the procedure assumes about you that you might be wrong about: **It assumes your customers are location-locked, not price-locked.**
  Garden centres are convenience purchases. Most customers will not drive 20 minutes extra to save 8% on a shrub. If you hold prices while competitors raise theirs, you are not "helping the customer"; you are simply incinerating your own margin to subsidize people who would have bought from you anyway. Unless you are trying to aggressively steal market share (which requires capacity to handle the volume), matching prices is the rational move to preserve business health. Your gut is likely protecting your self-image as a "fair dealer" rather than protecting the payroll.

