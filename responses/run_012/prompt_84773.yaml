prompt: |-
  I run the numbers and sit on the board of our family business — about 25 garden centres across two states, big enough to have a real board and a real payroll, small enough that a bad call actually hurts. The thing that eats my time is this: every few weeks someone (a supplier, the trade magazine, my uncle who goes to the industry conference every year) tells me that everyone in our line of business is now doing something. Moving to subscription plant boxes. Dropping peat-based compost. Going cashless at the tills. Adding click-and-collect. Killing a whole product category. And then the question lands on me: are we doing it or not. We meet about monthly, we usually have a day or two to decide, nobody on the board has any stats training including me, and these calls are expensive and hard to unwind once we've retrained staff and rejigged the tills. My cousin did a masters in econ and when I described all this she said it sounds like an 'information cascade' and told me to go read up on it, but I don't want a reading list or names of papers, I want something I can actually run in a meeting. What I've picked up on my own, and I don't know if it's right: the people who move first seem to be carrying most of the actual information, and everyone after them is mostly just looking at the queue ahead of them; a crowd agreeing isn't the same as a crowd that checked; and there seem to be two totally different reasons a person follows a crowd — one where they think the crowd knows something they don't, and one where they just don't want to be the only one blamed if it goes wrong — and those two probably ought to lead me to different conclusions, but I can't work out how.

  So what I want from you is a procedure my board can run on one of these proposals: the questions to ask in order, what counts as a good enough answer to each, which step stops things with a flat no, and which step hands the decision back to a person because it's turned into a question about what we value rather than a question about what's true. Please don't just tell me to 'trust the crowd' or 'be a contrarian' — the whole problem is that I can't tell which situation I'm in, so the procedure has to help me tell. It should also be honest about which steps are real tests and which are just judgment calls wearing a lab coat, and about where it's going to misfire on us.

  Then run it on three proposals: (1) our whole sector plus the competitor twenty minutes down the road has moved to a subscription box model, and we're deciding whether to; (2) every grower we buy from has stopped using a particular pesticide that we still use, and the pressure is on to drop it too; (3) every garden centre in our region put prices up about 8% this spring and we're deciding whether to match. Be warned, on that last one I'm already leaning no, mostly on gut, so if the procedure says follow I want you to say so plainly and tell me what it's assuming about me that I might be wrong about. Give it to me as tables so I can print it and hand it round: first a table for the procedure itself with columns Order, Question, What counts as a clear yes, What counts as a clear no, What to do if it's murky, and Real test or judgment call — and second a table for the three cases with columns Case, Which steps actually decide it, Verdict (follow / don't follow / can't tell from here without spending money or time), How confident (high, medium, low), and The cheapest thing that would change the verdict. After the tables, finish with a JSON object with these fields: "signs_we_are_in_a_cascade_and_not_a_real_consensus" (list of short strings), "cannot_settle" (list of the things the procedure is just not able to answer), "expected_misfires" (list), "answer_the_asker_will_dislike" (one string), and "first_question_to_ask_next_time" (one string).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Board member of a mid-sized family business (25 garden centres, 2 states). Practical, numerate but not stats-trained, time-poor, risk-aware ("bad call actually hurts"), decisive but wary of herd mentality.
      *   **Problem:** Constant pressure to adopt industry trends (subscriptions, sustainability, tech, pricing) based on "everyone is doing it." Suspects "information cascades" (as noted by cousin) but needs a practical tool, not theory.
      *   **Specific Insights:** User already understands key cascade dynamics (first movers have info, later movers follow the queue, conformity vs. blame-avoidance).
      *   **Deliverables:**
          1.  A procedure table (Order, Question, Yes/No criteria, Murky action, Test vs. Judgment).
          2.  A case study table applying the procedure to three specific scenarios (Subscription boxes, Pesticide ban, Price matching).
          3.  A JSON object with specific fields summarizing risks, limitations, and a hard truth.
      *   **Constraints:** No reading lists, no academic names, actionable in a meeting, honest about limitations, specific format (tables + JSON).
      *   **Tone:** Professional, direct, pragmatic, respectful of the user's existing intuition.

  2.  **Deconstruct the "Information Cascade" Problem for Business:**
      *   An information cascade happens when people ignore their private information and follow the actions of predecessors.
      *   *Business Context:* Competitors act. You see them act. You don't know *why* they acted (profit? panic? marketing stunt?). If you act just because they acted, you might be cascading into a bad decision.
      *   *The User's Insight:* Distinguishing between "they know something I don't" (Informational) vs. "I don't want to be the outlier" (Reputational/Blame).
      *   *The Procedure Needs:* To force the board to uncover the *private information* behind the public action. To separate *value judgments* from *factual assessments*. To identify stop conditions.

  3.  **Drafting the Procedure (Table 1):**
      *   *Goal:* Filter out noise, identify real signals, isolate value conflicts.
      *   *Step 1: Source Verification.* Who says "everyone"? Is it actually everyone or just the loud ones?
      *   *Step 2: First Mover Incentive.* Why did the *first* person do it? Do we share that incentive?
      *   *Step 3: Private Data Check.* Do we have data that contradicts the trend? (Crucial for stopping cascades).
      *   *Step 4: Reversibility.* If we're wrong, can we fix it? (High cost = higher bar).
      *   *Step 5: The "Blame" Test.* Are we doing this to avoid looking stupid or to make money?
      *   *Step 6: Value Alignment.* Is this about ethics/brand, not just math?
      *   *Refinement:* Make the "Yes/No" criteria sharp. "Murky" needs a specific action (e.g., "Small pilot"). Distinguish "Real Test" (verifiable) from "Judgment Call" (opinion).

  4.  **Applying the Procedure to the Three Cases (Table 2):**
      *   *Case 1: Subscription Boxes.*
          *   Context: Sector + local competitor doing it.
          *   Analysis: High implementation cost (logistics). First movers might be chasing VC money or buzz, not profit. Reversibility is low (hard to unwind logistics).
          *   Verdict: Likely "Don't Follow" or "Pilot". Let's say "Can't tell without spend" because unit economics are unknown.
          *   *Correction:* User wants a verdict. If the procedure works, it should lean towards caution on high-cost/low-reversibility trends without private data. Let's go with "Don't Follow (yet)" based on Step 4 (Reversibility) and Step 2 (Incentive).
      *   *Case 2: Pesticide Ban.*
          *   Context: Growers stopped using it. Pressure to drop.
          *   Analysis: This is supply chain driven, not just competitor driven. If growers stop, supply dries up. This isn't a cascade; it's a constraint.
          *   Verdict: "Follow" (actually, "Comply").
          *   Nuance: Is it regulatory or voluntary? If growers stopped, we might have no choice.
      *   *Case 3: Price Matching (8% increase).*
          *   Context: Regional competitors up 8%. User leans "No".
          *   Analysis: Pricing is often a cascade (tacit collusion or fear). If we don't raise, do we lose margin or gain volume?
          *   User Constraint:* "If the procedure says follow I want you to say so plainly and tell me what it's assuming about me that I might be wrong about."
          *   *My Analysis:* In oligopolies (25 centres across 2 states), price matching is often rational to preserve margin *unless* you are competing on price leadership. If everyone else raised, keeping prices low might trigger a price war or signal low quality. However, if demand is elastic, holding price gains share.
          *   *Decision:* The procedure should highlight that this is a *strategic* choice, not a factual one. If the board's value is "volume/market share," don't match. If "margin/stability," match.
          *   *Addressing the User's Lean:* The user leans "No" (don't raise). If the procedure suggests "Match" (Follow), I need to explain why (e.g., assumption that demand is inelastic for garden supplies in inflation). Actually, in garden centres, plants are somewhat discretionary. Holding price might be a good differentiator.
          *   *Wait, let's look at the Cascade angle:* If everyone raised prices, is it because costs rose (fundamental) or because they saw others raise (cascade)? If costs rose for everyone (fuel, wholesale), it's fundamental. If only retail prices rose, it's a cascade.
          *   *Refined Verdict:* "Can't tell without data" is safest, but I need a stronger verdict. Let's assume wholesale costs *did* rise (inflation). Then matching is survival. If wholesale costs *didn't* rise, it's a margin grab cascade.
          *   *Let's pivot:* I will make the verdict "Don't Follow" to align with the user's gut *if* the procedure reveals it's a margin cascade without cost justification. BUT, the prompt asks me to be honest if the procedure says Follow.
          *   *Honest Assessment:* In a high-inflation environment (implied by "this spring"), costs likely rose. Not raising prices squeezes margin. If the business needs margin to survive, matching is correct. If the business needs volume to clear stock, not matching is correct.
          *   *Decision:* I will rule "Can't tell from here without spending money or time" (specifically elasticity testing) but lean towards "Follow" *if* cost bases are identical. Actually, to be most helpful: I will rule "Follow" *conditionally* and challenge the user's gut. Why? Because if 100% of competitors raised prices, they likely share the same cost base. Refusing to raise might be suicide if margins are thin. I will explicitly state the assumption: "You are assuming your customers are price-sensitive enough to switch centres for 8%, but they might be location-locked."

  5.  **Drafting the JSON:**
      *   *signs_we_are_in_a_cascade:* Vague reasoning ("everyone is"), fear of blame, lack of first-mover data.
      *   *cannot_settle:* Future taste changes, macroeconomic shocks, internal culture fit.
      *   *expected_misfires:* False negatives (missing a real trend), analysis paralysis.
      *   *answer_the_asker_will_dislike:* Needs to be the hard truth about the Price Matching or the Subscription model. Let's go with the Price Matching one since they flagged it. "Your gut on pricing is likely protecting your ego, not your margin." Or "You are confusing being contrarian with being smart." Let's go with: "Your gut on pricing assumes customers shop around more than they actually do."
      *   *first_question_to_ask:* "Who did this first and did they profit?"

  6.  **Review and Refine:**
      *   *Check Constraints:* Tables? Yes. JSON? Yes. No academic jargon? Yes. Addressed the "gut feeling" warning? Yes.
      *   *Tone Check:* Is it respectful? Yes. Is it actionable? Yes.
      *   *Procedure Logic:* Does Step 5 distinguish between "crowd knows" vs "crowd blames"? Yes, via the "Blame Test."
      *   *Case 3 Nuance:* I need to be careful not to give financial advice, but business logic advice. The prompt asks me to run the procedure. The procedure should reveal if it's a cascade. If costs rose for everyone, it's not a cascade, it's a cost pass-through. If costs didn't rise, it's a cascade. I will assume the latter for the sake of the exercise (as "everyone put prices up" sounds like a market signal), but acknowledge the cost variable.
      *   *Wait, re-reading the prompt on Case 3:* "If the procedure says follow I want you to say so plainly and tell me what it's assuming about me that I might be wrong about."
      *   *Okay, I will make the procedure verdict "Follow" on Case 3.* Why? Because in a regional oligopoly (garden centres are location-dependent), price matching is standard survival unless you are the cost leader. If the user leans "No", they might be underestimating margin erosion. I will challenge that.

  7.  **Final Polish:**
      *   Ensure the tables are markdown formatted.
      *   Ensure JSON is valid.
      *   Check that the "Real test or judgment call" column is populated honestly.

  *(Self-Correction during drafting Case 3)*: If I say "Follow" on price, I need to be sure. Garden centres are often local monopolies (nearest one to me). Customers don't drive 20 mins to save 8% on a £10 plant. They drive for convenience. So matching prices protects margin without losing volume. The user's gut ("Don't raise") assumes customers are highly price elastic. They are likely not. I will stick with "Follow" and explain the elasticity assumption.

  *(Self-Correction on Procedure Step 5)*: Make sure the distinction between "Informational" (they know something) and "Reputational" (fear of blame) is clear in the questions.

  *(Final check on JSON keys)*: Ensure exact key names as requested.

