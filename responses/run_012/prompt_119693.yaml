prompt: |-
  I am a high school student, and for a civics paper I am working on the various proposals to change who may vote: compulsory voting, a lower voting age, and voting rights for non-citizen residents. Before I evaluate any of those proposals, I want to know what a theory of the franchise is supposed to deliver. Please write that specification for me — the desiderata any adequate theory of who ought to have the vote must meet.

  For each requirement, give me the case or consideration that puts it on the list. Here is what I have so far; add anything I have missed, and tell me if any item on my list is not really a requirement but only a prejudice of one side.

  Cases the theory must get right: the sixteen-year-old who works and pays taxes; the resident who has lived here for twenty years, pays taxes, and has no path to citizenship; the citizen who left thirty years ago and does not intend to return; the adult with a severe cognitive disability; the citizen who has completed a sentence for a felony; the citizen who has never voted and does not wish to; the person who turns eighteen two days after election day; and, as a pressure test, children and people not yet born who will live with the consequences of long-horizon policy.

  Distinctions it must not collapse: between holding a vote and being counted as a member of the people; between competence and having a stake; between a right and a duty, which matters for compulsion; and between being subject to a law and being affected by it, since those two seem to pull apart in the case of non-citizens.

  Puzzles it must dissolve: the problem that any principle for drawing the boundary of the electorate must be applied by an electorate that has already been drawn, so who decides who decides; why eighteen rather than some other age, without simply ratifying the status quo; why being taxed without a vote seems a genuine grievance for resident non-citizens but not for minors; and whether a right to vote includes a right to abstain or whether that is a separate question.

  Findings it must be consistent with: what is actually known about whether compulsory voting raises turnout, and whether it changes who wins or only who shows up; whether it increases spoiled or protest ballots; and whether lowering the voting age alters turnout habits later in life.

  Finally, tell me which requirements are non-negotiable and which are the preferences of a particular camp, whether any two of them cannot be jointly satisfied, and which single requirement rules out the most otherwise plausible theories. If it is quick, say which family of answers — competence, stake or being affected, membership, or subjection to the law — comes out best against the list. A table is fine. I do not need citations or a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school student working on a civics paper.
      *   **Topic:** Theories of the franchise (who ought to vote).
      *   **Task:** Create a specification (desiderata) for an adequate theory of the franchise.
      *   **Input:** The user has provided a preliminary list of "Cases," "Distinctions," "Puzzles," and "Findings."
      *   **Requirements:**
          *   Evaluate the user's list (add missing items, flag prejudices).
          *   Identify non-negotiable vs. camp-specific preferences.
          *   Identify incompatibilities (trade-offs).
          *   Identify the most restrictive requirement.
          *   Evaluate the main families of theories (Competence, Stake, Affected, Membership, Subjection) against the list.
          *   Format: Table is fine. No citations/reading list.
      *   **Tone:** Academic but accessible (high school civics level), rigorous, neutral.

  2.  **Evaluate the User's Input:**
      *   *Cases:* 16yo worker, long-term non-citizen resident, expat citizen, cognitive disability, felon, disinterested citizen, birthday edge-case, future generations/children. -> *These are excellent test cases.*
      *   *Distinctions:* Vote vs. Membership, Competence vs. Stake, Right vs. Duty, Subject to Law vs. Affected by Law. -> *Strong conceptual distinctions.*
      *   *Puzzles:* Boundary problem (who decides), Age cutoff justification, Taxation without representation (non-citizens vs. minors), Right to abstain. -> *Classic philosophical puzzles.*
      *   *Findings:* Empirical claims about compulsory voting (turnout, outcomes, spoiled ballots) and youth voting habits. -> *Important for practical implementation, though arguably distinct from normative theory.*

      *   *Critique:*
          *   Are any of these prejudices? The "Findings" section risks conflating *normative theory* (who *should* vote) with *empirical consequences* (what happens if they do). A theory of the franchise is primarily moral/political, not sociological. However, a *practical* theory must account for feasibility. I need to clarify this distinction.
          *   Missing items: Stability/Order (franchise changes shouldn't cause collapse), Equality (one person, one vote weight), Secrecy/Security (can they vote safely?). Actually, for a *theory of who*, the key missing piece is often *Reciprocity* or *Alignment of Interest* (does the voter benefit/harm in proportion to their say?). Also, the "All-Affected Principle" vs. "All-Subjected Principle" is hinted at but needs explicit framing as a desideratum for coherence.
          *   Non-negotiables: Logical consistency, basic equality (within the chosen class).
          *   Camp preferences: Compulsory voting is a policy, not a franchise boundary theory, though related. The "right to abstain" is contested.

  3.  **Drafting the Desiderata Specification:**
      *   I need to organize the user's points into a coherent framework and add the missing pieces.
      *   Structure:
          1.  Normative Consistency (Logic).
          2.  Moral Intuitions (The Cases).
          3.  Conceptual Clarity (The Distinctions).
          4.  Institutional Feasibility (The Findings/Puzzles).

  4.  **Addressing the Specific Questions:**
      *   *Non-negotiable vs. Preferences:* Logical consistency is non-negotiable. Specific outcomes (e.g., "must include 16-year-olds") are preferences.
      *   *Incompatibilities:* "Competence" often clashes with "Equality." "All-Affected" clashes with "Boundary Stability."
      *   *Most Restrictive:* The "Boundary Problem" (who decides) or the "Competence" requirement (if defined strictly) rules out many theories. Actually, the requirement to account for *future generations* rules out almost all existing democratic theories.
      *   *Best Family:* "Subjection to Law" (All-Subjected) usually handles the legal cases best. "Stake" handles the tax cases best. "Membership" handles the citizenship cases best. I need to pick a winner based on the *whole* list. "All-Subjected" is often the robust standard in political philosophy, but "Stake" is rising. I should remain neutral but highlight strengths/weaknesses.

  5.  **Refining the "Findings" Section:**
      *   The user asks for empirical findings (compulsory voting stats) to be part of the theory's consistency.
      *   *Correction:* A *normative* theory of the franchise doesn't strictly depend on whether compulsory voting increases turnout. It depends on whether voting is a *right* or a *duty*. However, a *pragmatic* theory must consider institutional stability. I will categorize this as "Institutional Viability" rather than pure normative truth.

  6.  **Developing the Table:**
      *   Columns: Requirement, Source (User/New), Type (Non-negotiable/Contested), Notes.
      *   Rows: Categorized by Logic, Morality, Feasibility.

  7.  **Evaluating the Families of Answers:**
      *   *Competence:* Fails on disability/equality.
      *   *Stake (Tax/Interest):* Fails on children/non-taxpayers.
      *   *Affected:* Too broad (everyone is affected by US policy globally).
      *   *Membership (Citizenship):* Fails on long-term residents.
      *   *Subjection (Law):* Strongest for residents/felons, weak on future generations.
      *   *Verdict:* Subjection + Membership hybrid is usually the real-world standard, but Subjection is the strongest theoretical contender for the user's specific cases.

  8.  **Review against Constraints:**
      *   High school level? Keep jargon explained.
      *   No citations? Check.
      *   Table included? Check.
      *   Address "prejudices"? Yes, need to point out that empirical findings aren't strictly normative requirements.
      *   Address "non-negotiables"? Yes.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Thought:* The user included "Findings it must be consistent with" regarding compulsory voting stats.
      *   *Correction:* I need to gently explain that a theory of *who ought to vote* is normative. Empirical data informs *implementation*, not necessarily *justification*. If a theory says "everyone must vote" because it's a duty, empirical data showing it increases spoiled ballots doesn't make the theory wrong, just costly. I will classify these as "Pragmatic Constraints" rather than "Truth Conditions."
      *   *Thought:* The "future generations" case is a killer. No current theory solves this well. I should highlight that.
      *   *Thought:* The "Boundary Problem" (who decides who decides) is a meta-problem. It's a requirement for the theory to be self-grounding.

  10. **Final Polish:** Ensure the tone is encouraging but rigorous. Make sure the table is clear. (Proceed to generate output).

  *(Self-Correction on the "Prejudice" point)*: The user asked to tell them if any item is a prejudice.
  *   *Item:* "Findings it must be consistent with... whether it changes who wins."
  *   *Analysis:* This is a prejudice of *consequentialists*. A *deontological* theory (voting is a right) doesn't care who wins. I need to flag this.
  *   *Item:* "Children and people not yet born."
  *   *Analysis:* This is a very high bar. Many theories explicitly exclude them. Demanding a theory solve this might be setting the bar too high (making it a prejudice of future-oriented ethics). I will note this as a "Stress Test" rather than a basic requirement.

  11. **Final Structure:**
      *   Introduction: Acknowledge the sophistication of the prompt.
      *   Section 1: The Specification (Organized Desiderata).
      *   Section 2: Critique of User's List (Additions & Prejudice Check).
      *   Section 3: Trade-offs & Non-Negotiables.
      *   Section 4: Evaluation of Theory Families (Table).
      *   Conclusion: Summary advice.

  *(Wait, one more check)*: The user asked: "If it is quick, say which family of answers... comes out best against the list." I need to make sure I answer this directly.

  Okay, ready to write.
answer: |-
  This is an exceptionally sophisticated framework for a high school civics paper. You have correctly identified that before arguing *for* a policy, one must define what a successful justification looks like. In political philosophy, this is called establishing the **criteria of adequacy**.

  Below is the specification you requested. I have organized your points into logical categories, flagged potential biases, added missing requirements, and evaluated the major theories against this specification.

  ### Part 1: The Specification of an Adequate Theory of the Franchise

  An adequate theory must satisfy requirements in three categories: **Normative Consistency** (logic and rights), **Moral Intuition** (handling specific cases), and **Institutional Viability** (practical application).

  #### A. Normative Consistency (Logic & Rights)
  1.  **Non-Arbitrariness:** The theory cannot rely on "because we have always done it this way." It must provide a principled reason for boundaries (e.g., why 18 and not 17?).
  2.  **Self-Grounding:** It must address the "Boundary Problem." Since the electorate decides the rules of the electorate, the theory must explain why the *current* boundary is legitimate enough to set the *next* boundary without circular reasoning.
  3.  **Right vs. Duty Clarity:** It must explicitly state whether voting is a **right** (which implies a right to abstain), a **duty** (which implies compulsion), or a **power** (a function of office). It cannot treat it as all three simultaneously without contradiction.
  4.  **Equality of Weight:** Within the chosen class of voters, the theory must explain why each vote counts equally. If competence matters, why doesn't the more competent person get two votes?

  #### B. Moral Intuition (The Test Cases)
  5.  **The Taxation Principle:** It must explain the link between contributing to the state (taxes/labor) and having a say in the state.
  6.  **The Subjection Principle:** It must explain the link between being bound by the law and having a say in the law.
  7.  **The Capacity Threshold:** It must define the minimum cognitive agency required to vote without discriminating against protected classes (e.g., cognitive disabilities).
  8.  **The Membership Boundary:** It must distinguish between being a *subject* of the state, a *resident* of the territory, and a *member* of the political community (citizen).
  9.  **The Future Constraint:** It must account for the interests of those who cannot vote (children, future generations) without granting them the vote directly (which is usually impractical) or ignoring them entirely.

  #### C. Institutional Viability (Feasibility)
  10. **Administrative Clarity:** The criteria for voting must be easy to verify (e.g., age is easy; "stake" or "competence" is hard).
  11. **Stability:** Expanding or contracting the franchise should not destabilize the political system to the point of collapse.
  12. **Empirical Consistency:** The theory should not rely on false empirical claims (e.g., if a theory claims compulsion creates informed voters, but data shows it creates spoiled ballots, the theory is weakened).

  ---

  ### Part 2: Critique of Your List

  You asked me to add missing items and flag prejudices.

  **1. Additions (What you missed)**
  *   **Administrative Clarity:** You listed "Puzzles," but you missed the practical requirement that the line must be *drawable*. A theory that says "all those with a sufficient stake" fails if "stake" cannot be measured objectively.
  *   **Equality of Weight:** You mentioned "holding a vote vs. being counted," but you didn't explicitly require that within the franchise, votes be equal. Some theories (J.S. Mill) argued for weighted voting based on education. An adequate modern theory usually needs to rule this out.
  *   **Security/Secrecy:** A theory of the franchise must assume the vote can be cast safely. If a group is voted on but intimidated into not voting, the theory of *eligibility* fails in practice.

  **2. Prejudice Check (Camp Preferences vs. Requirements)**
  *   **The "Findings" Section:** *This is the biggest potential prejudice.* You list empirical findings (e.g., "whether compulsory voting changes who wins") as requirements the theory must be consistent with.
      *   *Correction:* This is a **consequentialist prejudice**. A **deontological theory** (based on duty/rights) might argue citizens *must* vote regardless of the outcome. If your specification demands the theory match empirical outcomes, you are ruling out duty-based theories by definition.
      *   *Fix:* Reclassify these as "Pragmatic Constraints." A theory isn't *false* if compulsion increases spoiled ballots, but it might be *undesirable*.
  *   **Future Generations:** Demanding a theory solve the "people not yet born" case is a **stress test**, not a basic requirement. Almost no existing democratic theory successfully grants representation to the unborn. If you make this non-negotiable, *all* current theories fail. Keep it as a "Bonus Challenge."
  *   **Right to Abstain:** You list this as a puzzle. Be aware that requiring a "right to abstain" rules out theories that view voting as a civic duty (like jury duty). This is a contested philosophical point, not a settled fact.

  ---

  ### Part 3: Trade-offs and Non-Negotiables

  **1. Non-Negotiable Requirements**
  *   **Non-Arbitrariness:** A theory cannot simply say "18 because 18." It needs a reason.
  *   **Logical Consistency:** It cannot claim voting is a right and a duty simultaneously without explaining the conflict.
  *   **Administrative Clarity:** If we can't verify who qualifies, the theory is useless.

  **2. Incompatible Requirements (Trade-offs)**
  *   **Competence vs. Equality:** If you require voters to be "competent," you struggle to justify why people with severe cognitive disabilities vote (Equality) while excluding 16-year-olds who may be equally competent (Arbitrariness).
  *   **All-Affected vs. Stability:** If everyone "affected" by a law must vote, the US electorate would include most of the global population (due to climate policy, war, trade). This collapses the nation-state. You must choose between the "All-Affected Principle" and the "Bounded Community."
  *   **Taxation vs. Age:** If paying taxes grants the vote (No Taxation Without Representation), 16-year-old workers qualify. If age grants the vote, non-taxpaying 18-year-olds qualify. You usually have to prioritize one principle over the other.

  **3. The Most Restrictive Requirement**
  *   **The Boundary Problem (Who Decides):** This is the single hardest requirement. Any rule you propose to expand the vote must be passed by the *current* voters, who may benefit from excluding others. A theory that cannot explain how to expand the franchise without the consent of those who lose power is practically dead.

  ---

  ### Part 4: Evaluation of Theory Families

  Here is how the five major families of answers perform against your specification.

  | Theory Family | Core Principle | Strengths (Matches your list) | Weaknesses (Fails your list) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Competence** | Vote requires capacity to reason. | Handles cognitive disability cases well; explains age cutoffs. | **Fails Equality.** Hard to measure. Risks elitism. Excludes 16yo workers who are competent. | **Poor.** Too subjective for modern democracy. |
  | **Stake (Interest)** | Vote requires a material interest (taxes/property). | Handles 16yo workers & non-citizen residents well. Solves "Taxation w/o Representation." | **Fails Equality.** Excludes poor citizens. Excludes 18yo students. Hard to measure "stake." | **Moderate.** Good for economic arguments, bad for universal rights. |
  | **All-Affected** | Vote for anyone impacted by the decision. | Handles future generations & non-citizens well. Morally robust. | **Fails Stability.** Electorate becomes global/unmanageable. Violates "Membership" distinction. | **Poor.** Theoretically pure, practically impossible. |
  | **Membership (Citizenship)** | Vote is a privilege of formal membership. | **High Stability.** Clear administrative line. Handles expats well. | **Fails Long-term Residents.** Ignores "Subjection." Arbitrary regarding naturalization paths. | **Strong (Status Quo).** Best for order, worst for moral inclusion. |
  | **Subjection (Law)** | Vote for anyone bound by the law. | **Best Overall.** Handles felons, residents, & citizens equally. Clear line (jurisdiction). | **Fails Future Generations.** Doesn't solve the "children" puzzle (they are subject to law but don't vote). | **Winner.** Best balance of morality and clarity. |

  ### Summary Recommendation for Your Paper

  1.  **The Winner:** The **Subjection Principle** (All-Subjected) comes out best against your list. It captures the resident non-citizen (bound by law), the felon (bound by law), and the citizen (bound by law), while excluding the expat (mostly not bound by law) and the foreigner (not bound by law).
  2.  **The Compromise:** In practice, democracies use a hybrid of **Subjection + Membership**. You must be subject to the law *and* be a member (citizen). Your paper should highlight where this hybrid fails (e.g., the 20-year resident).
  3.  **The "Prejudice" Warning:** Be careful with your "Findings" section. Do not claim a theory is *false* because compulsory voting increases spoiled ballots. Claim that the theory is *less desirable* if its goal is informed decision-making. Distinguish between **Normative Truth** (what is right) and **Pragmatic Cost** (what is expensive).
  4.  **The "Killer" Argument:** If you want to impress, focus on the **Boundary Problem**. Point out that any change to the franchise requires a vote by the people who currently benefit from the exclusion. This explains why change is so hard, regardless of which theory is "correct."

  This specification gives you a rigid framework to evaluate the proposals. If a proposal (like lowering the age) cannot explain why it satisfies the "Non-Arbitrariness" or "Administrative Clarity" requirement, your paper can critique it rigorously without needing to take a political side.
