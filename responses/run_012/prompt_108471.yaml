  2.  **Acknowledge the Certainty Trap.** Recognize that in Cases like 1 and 5, you are paying a premium for the feeling of safety. Ask yourself: "Is the peace of mind worth the $X in Expected Value I am giving up?"
  3.  **Check the Threshold.** In Cases like 6 and 7, explicitly ask: "Does this amount change my life?" If yes, maximize EV. If no, maximize Certainty. Do not mix the two strategies.
