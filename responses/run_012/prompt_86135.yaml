      *Re-evaluating the "Baseline" section:* The prompt asks: "say whether Mill's account of when interference with someone is justified can be stated without quietly assuming a baseline." Mill's Harm Principle relies on distinguishing 'self-regarding' from 'other-regarding'. This implies a baseline of what counts as harm. I need to argue that Mill's utilitarianism allows the baseline to shift based on net happiness, solving the problem better than rigid PP.

