      *   Overturning condition at the end? (Yes).

  6.  **Final Polish:** Check for British spelling (Sixth-form, programme, etc.) and ensure the voice sounds authoritative yet humble (as a student). *Wait, I am writing the essay FOR the student to model.* So the voice should be the student's voice (or an ideal version of it). The prompt says "write that essay for me... so that I can see how the case is properly made." I will write in the first person as the student entrant.

