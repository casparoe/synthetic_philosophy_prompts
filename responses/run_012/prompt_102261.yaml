  ### Strategic Framing Analysis

  Before drafting the proposal, we must isolate the sharpest angle for inquiry. There are three viable ways to frame the relationship between panpsychist metaphysics and ethics:

  1.  **The Metaphysical Precondition View:** This frame assumes ethics must wait on metaphysics. We must first solve the combination problem (how micro-experiences form macro-subjects) before determining moral status. *Critique:* This is well-worked over in philosophy of mind. It risks stalling the ethical project indefinitely, as the combination problem remains unresolved.
  2.  **The Phenomenal Primitive View:** This frame argues that experience itself holds moral weight, regardless of subjecthood. Suffering exists even without a unified "sufferer." *Critique:* While novel, this requires heavy revision of our ethical concepts of harm and rights, potentially alienating standard ethical frameworks without sufficient justification.
  3.  **The Conditional Significance View (Selected):** This frame treats the metaphysics of combination as a variable. It asks whether the moral status of fundamental entities *changes* depending on which metaphysical model is adopted, without demanding a final solution to the metaphysics. *Critique:* This is the sharpest frame. It bridges mind and ethics without getting bogged down in solving metaphysics definitively. It addresses your specific interest in whether the combination problem is doing *ethical* work.

  The proposal below adopts the third frame.

  ***

  ### Project Proposal: The Moral Weight of the Micro

  **Title:** Subjecthood and Significance: Ethical Implications of the Combination Problem in Panpsychism

  **1. Introduction and Context**
  Panpsychist views posit that experience is a fundamental feature of physical reality, inherent in basic entities. Recently, this metaphysical stance has prompted ethical extensions: if experience is fundamental, sentience—and the capacity for suffering—may be ubiquitous. This suggests a radical expansion of the moral circle. However, standard ethical frameworks typically locate moral status in subjects: unified entities that persist through time and own their experiences. It remains unclear whether fundamental micro-entities, or mere aggregates of them, meet the conditions for subjecthood. Consequently, there is a tension between the metaphysical claim of ubiquitous experience and the ethical requirement for unified subjects. This project investigates whether the moral significance of fundamental experience depends on resolving the metaphysical "combination problem."

  **2. The Research Question**
  The project seeks a determinate answer to the following question: *Does the moral status of fundamental physical entities supervene on the metaphysical resolution of the combination problem, or can fundamental entities possess moral status independently of their capacity to constitute macro-subjects?*

  This question admits a binary outcome: either moral status is metaphysically contingent (requiring successful combination into subjects), or it is metaphysically independent (attaching to experience itself). Establishing which condition holds will determine whether panpsychist ethics requires a solution to the combination problem or whether it can proceed despite metaphysical uncertainty.

  **3. Background and Gap in Existing Positions**
  Current discourse leaves this question open due to a disciplinary divide. Defenders of panpsychism focus primarily on metaphysical coherence, addressing how micro-experiences combine to form human-like consciousness. They often treat ethical implications as secondary consequences that follow once the metaphysics is secured. Conversely, ethicists interested in moral status typically assume a macro-level subject (e.g., a human or animal) and debate the criteria for inclusion (sentience, rationality, etc.).

  Neither position adequately addresses the intermediate case: the moral weight of the micro-constituents themselves. Existing arguments often assume that if micro-experiences exist, they matter morally. However, this assumes that "experience" alone is sufficient for moral consideration. If suffering requires a subject to endure it, and micro-entities lack diachronic unity, then the ethical conclusion of widespread suffering may be unfounded. Alternatively, if moral status attaches to phenomenal qualities regardless of ownership, the metaphysics of combination becomes ethically irrelevant. Current literature has not systematically mapped how different solutions to the combination problem (or the lack thereof) alter the ethical landscape. This project fills that gap by treating the metaphysics of combination as a variable in ethical calculation.

  **4. Methodology and Work Plan**
  The project employs conceptual analysis and modal reasoning over a twelve-month period. The work is divided into four phases:

  *   **Months 1–3: Mapping Metaphysical Models.** I will catalog the leading contemporary approaches to the combination problem without endorsing one. These range from constitutive views (micro-experiences literally sum to macro-experience) to emergentist-compatible views, to skeptical views denying combination entirely. The output will be a typology of metaphysical structures, categorized by their commitment to micro-subjecthood versus macro-subjecthood.
  *   **Months 4–6: Ethical Framework Analysis.** I will analyze standard theories of moral status (welfarism, rights-based views, interest-based views) to isolate the necessary conditions for moral consideration. Specifically, I will test whether these theories require a unified subject or merely the presence of valenced experience. This involves constructing thought experiments where experience exists without robust subjecthood to test intuitive moral judgments.
  *   **Months 7–9: Cross-Mapping and Argumentation.** I will intersect the metaphysical typology with the ethical frameworks. For each metaphysical model, I will determine the resulting ethical status of fundamental entities. For instance, if a metaphysical model denies macro-subjects but affirms micro-experience, does welfarism still mandate moral consideration? I will argue for whether the ethical weight varies across these models or remains constant.
  *   **Months 10–12: Synthesis and Dissemination.** The final phase involves drafting the monograph or article series. I will refine the argument to ensure the determinate question is answered clearly. I will also prepare a summary suitable for interdisciplinary review, ensuring the distinctions are accessible to ethicists without specialized metaphysical training.

  **5. Outcomes: Success, Failure, and Overreach**
  *   **Success:** A successful result is a rigorous demonstration that moral status either does or does not depend on the combination problem. Ideally, the project will show that certain ethical frameworks are compatible with panpsychism even if the combination problem remains unsolved, thereby securing the ethical project against metaphysical uncertainty. Alternatively, proving that ethics *does* depend on metaphysics is a valuable negative result, clarifying the stakes for panpsychist ethicists.
  *   **Failure:** The project would fail if it concludes that the concepts of "moral status" and "subjecthood" are too vague to yield a determinate answer, resulting in mere skepticism. It would also fail if it inadvertently solves the combination problem itself, which is beyond the scope of a one-year ethical inquiry.
  *   **Overreach:** A sign of overreach would be attempting to prescribe specific policy changes or environmental regulations based on the findings. This project is foundational; it establishes whether moral status exists at the fundamental level, not how we should act on it practically. Another sign of overreach is attempting to evaluate all possible metaphysical systems rather than the dominant contemporary models.

  **6. Scope and Limitations**
  To ensure completion within one year, strict boundaries are necessary.
  *   **What is Included:** The focus is strictly on the link between *metaphysical structure* and *moral status*. The inquiry covers fundamental entities and their aggregates.
  *   **What is Cut:** I will exclude comparative animal ethics. While related, debating the status of non-human animals distracts from the fundamental question of micro-entities. I will also cut the history of panpsychism; the project focuses on contemporary formulations. Finally, I will not address the "hard problem" of consciousness itself, taking the existence of fundamental experience as a hypothetical premise for the sake of ethical argument.

  By isolating the ethical work done by the combination problem, this project clarifies whether panpsychist ethics stands or falls with metaphysical resolution, offering a crucial pivot point for future research in mind and value.
