answer: |-
  You are absolutely right to be suspicious. "You can't do the math" is a slogan, not an argument. In economics, this refers to the **Socialist Calculation Debate**, and your classmate is using a shorthand that conflates three very different claims. Some of those claims are weak (and vulnerable to technology), while others are profound (and vulnerable to nothing).

  Here is the breakdown you can bring to class. It separates the "math" claim into three distinct versions, evaluates them, and identifies the two economists your classmate and teacher are talking about.

  ### Part 1: Three Versions of "You Can't Do the Math"

  When your classmate says this, he could mean one of three things. Only one of them actually proves central planning can *never* work.

  #### 1. The "Computational Complexity" Claim
  *   **What it claims:** An economy has billions of transactions and millions of goods. The system of equations required to balance supply and demand is too massive for any brain or computer to solve in real-time.
  *   **Is it true?** **Historically yes, currently debatable.** In 1920, yes. Today? With exascale computing and AI, the sheer *number* of variables is less of a barrier than it used to be.
  *   **Does it prove planning can *never* work?** **No.** This is a technological limitation, not a logical one. If computers get fast enough, this objection disappears. It does no work against a futuristic "super-AI" planner.
  *   **Verdict:** This is the weakest version. It's just saying "it's really hard," not "it's impossible."

  #### 2. The "Missing Data" Claim (The Knowledge Problem)
  *   **What it claims:** It's not that the math is too hard; it's that **the numbers don't exist yet.** Preferences, local conditions, and opportunity costs exist only in the minds of individuals. They aren't written down anywhere to be fed into a computer.
  *   **Is it true?** **Yes.** This is the core of the modern argument. Much knowledge is "tacit" (I know how to fix this machine, but I can't write down the instructions).
  *   **Does it prove planning can *never* work?** **Yes.** No matter how good your computer is, it cannot process information that has not been articulated or transmitted.
  *   **Verdict:** This is the strong version. It shifts the argument from *processing power* to *information availability*.

  #### 3. The "Discovery Process" Claim
  *   **What it claims:** Prices aren't just signals that pass along known info (like a thermometer); they are incentives that **create new info.** Entrepreneurs look at prices and discover new ways to do things. If you fix the prices (planning), you stop the discovery.
  *   **Is it true?** **Yes.** This addresses dynamic change, not static allocation.
  *   **Does it prove planning can *never* work?** **Yes.** A planner can only optimize for what *is*, not for what *could be*.
  *   **Verdict:** This is the "teacher's version." It explains why planning stagnates innovation.

  ---

  ### Part 2: The Two Old Economists

  Your classmate and teacher are referencing the **Socialist Calculation Debate** from the 1920s to 1940s. The two economists are **Ludwig von Mises** and **F.A. Hayek**.

  They are often lumped together, but their arguments were different. Hayek's is widely considered the "stronger" one.

  #### 1. Ludwig von Mises (The "Calculation" Argument)
  *   **The Claim:** In 1920, Mises argued that without private property in the means of production, there can be no market prices for capital goods. Without market prices, you have no common unit of account. Therefore, **rational economic calculation is logically impossible.**
  *   **The Vibe:** "You literally cannot add apples and oranges without price tags."
  *   **Weakness:** Critics (like Oskar Lange) argued you could *simulate* prices. If the state acts like a firm and adjusts prices based on shortages, maybe you *can* do the math. Mises' argument relies heavily on the absence of property rights.
  *   **Relation to Classmate:** This is closest to the "You can't do the math" slogan.

  #### 2. F.A. Hayek (The "Knowledge" Argument)
  *   **The Claim:** In 1945 ("The Use of Knowledge in Society"), Hayek conceded that maybe you *could* set up equations. But he argued the real problem is that the **knowledge required to solve the equations is dispersed.** It is local, specific, and often unconscious.
  *   **The Vibe:** "It doesn't matter how smart the planner is; the planner isn't *there* where the action is."
  *   **Why it's Stronger:** It survives the "Supercomputer" objection. Even if you have infinite computing power (Mises' worry), you still don't have the data (Hayek's worry). This aligns with your teacher's point about prices discovering new things.
  *   **Relation to Teacher:** This is the "prices are how new stuff gets discovered" argument.

  ---

  ### Part 3: Cheat Sheet for Class

  If you want to challenge the "case closed" attitude, here is a quick reference list to use in discussion:

  | Claim Version | What it actually means | Is it True? | Does it prove Planning is *Impossible*? | Who said it? |
  | :--- | :--- | :--- | :--- | :--- |
  | **"Math is too hard"** | Too many variables for any computer to solve. | **Debatable.** Tech improves. | **No.** AI might solve it someday. | Vulgarized Mises |
  | **"Data is missing"** | Info is in people's heads, not on paper. | **Yes.** (Tacit Knowledge) | **Yes.** Computers can't read minds. | **Hayek (Strong)** |
  | **"Prices discover"** | Prices drive innovation, not just allocation. | **Yes.** (Dynamic Process) | **Yes.** Planning kills innovation. | **Hayek / Kirzner** |

  ### How to phrase your intervention:
  *"I think when we say 'you can't do the math,' we need to be careful which claim we're making. If we just mean the computation is complex, that's a technology problem, not an economics problem. But if we mean the **information doesn't exist to be calculated** (like Hayek argued), that's a much stronger point. Are we arguing that planners are bad at math, or that the data they need literally isn't there?"*

  This forces the class to move from a slogan ("Math is hard") to the actual economic theory ("Information is dispersed").
