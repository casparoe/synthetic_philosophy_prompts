      *   *(6) Most findings false (Ioannidis):* He'd agree with the diagnosis (low power, bias) but blame the *Neyman-Pearson* influence (power calculations, fixed alpha) rather than his own p-values. He'd say, "You didn't replicate enough."
      *   *(7) The Hybrid (Fisher + N-P):* This is the big one. He would scream "Betrayal!" He spent his life fighting N-P. He'd say the crisis is proof that mixing inference with decision rules is catastrophic.

  4.  **Synthesize and Refine the Voice:**
