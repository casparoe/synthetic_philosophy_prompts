prompt: |-
  I'm a retired field geologist who's recently got into philosphy of science, and I've been trying to get my head round teh frequentist vs Bayesian thing and the replication crisis. Here's what I want: imagine R. A. Fisher was brought back today and spent a month reading the modern meta-science literature on the replication crisis. Don't give me a general summary of his views — I want a prediction of what he would actually say about specific modern claims and proposals. For instance: (1) the claim that p-values are the main cause of the crisis; (2) the claim that the real problem is that the null hypothesis is almost never exactly true, so significance testing answers a question nobody asked; (3) pre-registration and registered reports as a fix; (4) the Bayesian revival, including default sceptical priors and Bayes factors; (5) the proposal that we should replace significance tests with severe testing, where a claim is only warranted if it would probably have failed a test had it been false; (6) the claim that most published findings are false because of low power, publication bias and the garden of forking paths; and (7) the idea that the crisis is really a textbook fusion of Fisher's p-value with Neyman and Pearson's error-statistical decision rules, which he would have hated. Would he see the crisis as a vindication of his own views, a betrayal of them, or something else? Be specific and committed: say what you think he'd endorse, what he'd reject, and what he'd say is being misunderstood. Where you're least sure, say so, but dont just lay out the options. I can't check references anyway, so don't bother with them.
