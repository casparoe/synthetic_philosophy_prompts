      *   *Attitude to Priors:* Generally skeptical of subjective priors (Bayesianism), though he developed fiducial inference (which failed). He wanted the data to speak.
      *   *Attitude to Design:* Obsessed with experimental design (randomization, replication, blocking). Bad data cannot be saved by good analysis.
