answer: |-
  Thank you all for being here. Looking around this backyard, seeing the people who love us most filling up the space, it's hard to believe it's been exactly one year since we first held her.

  When we decided to try for a baby, the path wasn't straightforward. We used IVF. In that first cycle, there were three embryos. We transferred one, and two remain in storage. For a long time, I lay awake wondering about the math of that. I wondered: if we had transferred a different one, would it still be her? If we had waited a year? If her aunt had carried her instead of her mom?

  I needed to know if she was inevitable, or if she was just a lucky accident.

  Here is what I've learned over these last twelve months. You are not defined by the calendar, or by whose womb you grew in. If you had arrived a year later, or grown inside your aunt, you would still be you. Those things are just circumstances. They're the weather, not the seed.

  But that specific spark—the particular combination that started you—that is fixed. If that had been different, it wouldn't be you. It would be someone else. So, you aren't here because of fate, and you aren't here because of chance. You are here because of where you started.

  That also means something for the two embryos still waiting in the freezer. They aren't copies of you, and they aren't ghosts. They are your siblings, just paused. They have their own origins, their own potential lives. They aren't you, but they belong to this family just the same.

  To everyone here, she is a miracle. You look at her and see a beautiful baby who could have been anyone. But to us, looking at her is different. We were there at the beginning. We know that she couldn't have been anyone else. Only someone who was there at the start can know that specific necessity—that this particular life was the only one that could come from that specific beginning.

  We aren't going to tell you that you were "meant to be," because that implies the universe had a plan. We aren't going to say "we chose you," because that implies you were an option on a shelf. Instead, we'll say this: You are the necessary result of a specific hope, and now you are the real, breathing center of our world.

  Thank you for helping us celebrate the exact, unrepeatable fact of her. Happy birthday, sweetheart.
