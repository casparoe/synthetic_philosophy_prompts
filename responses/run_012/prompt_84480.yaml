  **Node 1: Definition (Intent)**
  We begin with a mistake. You say something false, but you believe it is true. Is this a lie?
  *   **No:** You proceed to Node 2. (Standard view: lies require intent).
  *   **Yes:** You are routed to **Leaf 8 (Strict Objectivism)**. This position holds that objective falsehood is sufficient for lying, regardless of belief. It is largely undefended because it makes honesty impossible for the fallible.

  **Node 2: Definition (Context)**
  You intend to deceive. But the context is a game, a joke, or a social convention where deception is expected (e.g., bluffing, acting). Is this a lie?
  *   **No:** You are routed to **Leaf 7 (Convention/Waiver)**. Here, context waives the claim to truth. Bluffs and jokes are licit tools.
  *   **Yes:** You proceed to Node 3. (Augustine and Kant agree here: a joke intended to deceive is still a lie, though Augustine might argue jokes lack the *weight* of assertion).

  **Node 3: Wrongness (Nature)**
  You have told a lie. What makes it wrong?
  *   **Intrinsic:** The act itself violates the nature of speech or duty. Proceed to Node 4.
  *   **Harmful:** It is wrong only because it damages the hearer or expectations. Proceed to Node 4.
  *   **Self-Damaging:** It is wrong primarily because it corrupts the speaker's soul. Proceed to Node 4.

  **Node 4: Overriding (Exceptions)**
  Can the wrongness of lying ever be outweighed?
  *   **Never:** Proceed to Node 5. (Absolute Deontology).
  *   **Only in Extremity:** (e.g., imminent threat to life). Proceed to Node 5. (Prima Facie).
  *   **Whenever Consequences Dictate:** Proceed to Node 5. (Consequentialism).
  *   **If It Helps Without Harming:** Proceed to Node 5. (Priscillianist/Utility).

  **Node 5: Grading & Adjacent Practices**
  Are all lies equally bad, and what about misleading truths?
  *   **All Equal / Misleading Truth is Same:** Proceed to Node 6.
  *   **Graded / Misleading Truth is Less Bad:** Proceed to Node 6. (Augustine grades lies; others distinguish lying from equivocation).
  *   **Misleading Truth is Licit:** Routed to **Leaf 9 (Equivocationist)**. You may speak truth to mislead.

  **Node 6: Victim (Who is Wronged)**
  Who is the primary victim of the lie?
  *   **The Hearer:** Their right or welfare is violated.
  *   **God / Moral Order:** The cosmic order or divine command is breached.
  *   **The Speaker:** The liar's own integrity is the primary casualty.

  **The Leaves**
  The paths terminate in twelve positions. **Leaf 1** is Augustine's: lies are intrinsic sins, never permitted, graded by intent, offending God/Order. **Leaf 2** is the Priscillianist view he wrote against: harmless, helpful lies are fine. **Leaf 3** is the Kantian absolute: never lie, even to a murderer at the door. **Leaf 4** is Prima Facie duty: truth is binding unless life is at stake. **Leaf 5** is plain Consequentialism. **Leaf 6** is Virtue Ethics (self-harm focus). **Leaf 7** covers games and jokes. **Leaf 8** is the Strict Objectivist (empty). **Leaf 9** permits misleading truths. **Leaves 10, 11, 12** are incoherent or empty combinations (e.g., intrinsic wrong that is always outweighed).

  *Note on Augustine:* Your reading is accurate. For Augustine (*De Mendacio*, *Contra Mendacium*), a lie requires the intention to deceive (*voluntas fallendi*) combined with uttering what one believes false. Jokes and fiction lack the intent to deceive and thus fall outside the definition. All actual lies are sins, never permissible regardless of consequence, but they are graded (eight categories) from pernicious to officious. The primary wrong is against God and the order of truth, though it damages the speaker and hearer.

