          2.  Demandingness objection to consequentialism is confused (skipping extra credit isn't failing).
          3.  We should stop feeling guilty about not doing more.
      *   **Requirements:**
          1.  Map the analogy (pass mark, assignments, grader, curve, transcript).
          2.  Identify where the analogy breaks.
          3.  Distinguish breaks that matter for the three conclusions vs. those that don't.
          4.  Evaluate if the "bonus-point picture" can represent supererogation.
          5.  Evaluate if the conclusions survive the disanalogies.
          6.  Suggest a better analogy if available.

  2.  **Deconstruct the Analogy (Mapping):**
      *   *Pass Mark:* The minimum threshold of moral obligation (duty).
      *   *Assignments:* Specific moral actions required to pass.
      *   *Extra Credit:* Supererogatory acts (heroism, sainthood).
      *   *Grader:* God? Society? Conscience? The Moral Law?
      *   *Curve:* Comparative morality (am I better than others?).
      *   *Transcript:* Moral reputation or ultimate judgment (afterlife/karma).
      *   *Failing:* Moral wrongdoing/blameworthiness.
      *   *Passing:* Moral permissibility/blamelessness.

  3.  **Analyze the Breaks (Disanalogies):**
      *   *Break 1: The Nature of the "Grade".* In school, a 'P' is often mediocre. In morality, "passing" (doing one's duty) is often seen as *good*, not just "not bad."
      *   *Break 2: The Source of Value.* Extra credit usually boosts a GPA. Supererogatory acts have intrinsic moral worth, not just instrumental "points."
      *   *Break 3: The Grader's Perspective.* Professors don't usually care if you skip extra credit. Moral agents (and victims) might care deeply if you skip the "heroic" rescue when you could have done it easily.
      *   *Break 4: Interconnectedness.* Assignments are discrete. Moral life is continuous. Where does duty end and supererogation begin? The line is blurry (the "continuum problem").
      *   *Break 5: Motivation.* Students do extra credit for grades. Saints do good for the good itself.
      *   *Break 6: The "Low Bar" Assumption.* Is the moral pass mark actually low? (This hits the demandingness objection directly).

  4.  **Evaluate Conclusions against Breaks:**
      *   *Conclusion 1 (No requirement to be a saint):* The analogy supports this well *if* you accept the definition of supererogation. But the break regarding the *blurry line* matters. If the bar shifts based on capacity, "extra credit" might become "required assignment" for some.
      *   *Conclusion 2 (Demandingness Objection is confused):* This is the weakest link. Consequentialism often argues the "pass mark" *is* "maximize good." The analogy assumes a non-consequentialist threshold. It begs the question. It doesn't refute demandingness; it assumes a theory that avoids it.
      *   *Conclusion 3 (Stop feeling guilty):* Psychological vs. Normative. In school, you shouldn't feel guilty about skipping extra credit. In morality, "agent-regret" or noble guilt might be appropriate even for permissible actions. The analogy misses the phenomenology of moral agency.

  5.  **Assess the "Bonus-Point Picture":**
      *   Does it capture supererogation? Partially. It captures optionality and praiseworthiness.
      *   Does it miss something? Yes. It misses the *moral value* of the act. Extra credit is usually self-interested (boosting GPA). Supererogation is other-interested. It also misses the idea that supererogatory acts can sometimes set a new standard (shifting the pass mark over time).

