      *(Better Analogy)*: **"The Baseline of Professional Competence vs. Acts of Professional Courage."** A doctor must treat you (duty). A doctor entering a plague zone (supererogation). This handles the "capacity" and "role" aspects better than a generic course.

  8.  **Final Polish:** Ensure clear headings and distinct sections for readability. Check that all constraints of the prompt are met. (Mapping, Breaks, Relevance to Conclusions, Bonus-Point Viability, Better Analogy).

      *Wait, one more thing:* The prompt asks about the "bonus-point picture" representing supererogation. I need to be clear that supererogation is *praiseworthy* but *not obligatory*. Extra credit is *praiseworthy* (good GPA) but *not obligatory*. The fit is actually decent on the surface, but the *motivation* and *stakes* differ.

