          2.  The Breaks (Categorized by relevance to conclusions).
          3.  The Verdict on the Bonus-Point Picture.
          4.  The Verdict on the Conclusions.
          5.  A Better Analogy.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "Demandingness Objection" point. The colleague's analogy *assumes* the pass mark is low. Consequentialists say the pass mark is "maximize utility." The analogy doesn't refute them; it just ignores them. This is a crucial point for a grad seminar.

      *(Refining the "Breaks")*:
      *   Break 1: The definition of the Pass Mark (Question-begging).
      *   Break 2: The value of Extra Credit (Self-interest vs. Altruism).
      *   Break 3: The Grader (Impersonal vs. Stakeholders).
      *   Break 4: The Transcript (Reputation vs. Character).

      *(Refining the Conclusions)*:
      *   C1 (Saints): Survives, mostly.
