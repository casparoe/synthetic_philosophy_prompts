answer: |-
  ### The Implicit Theory of Morally Relevant Computation

  The current regulatory framework presupposes a position best described as **Anatomically-Gated Phenomenalism**. This view holds that moral protection is owed only to entities capable of phenomenal suffering (pain), distinct from mere nociception (reflexive damage avoidance). Crucially, it asserts that phenomenal suffering requires a specific architectural threshold of central neural integration—typically the capacity to modulate nociceptive input via affective or cognitive states. The practice assumes this architecture is phylogenetically clustered: it is reliably present in vertebrates (and select cephalopods) and reliably absent in other invertebrates. Consequently, the system operates on a default presumption: vertebrates are sentient unless proven otherwise, while invertebrates are non-sentient mechanisms unless proven otherwise. Behavioral evidence (like conditioned place preference) is treated as confirmatory for vertebrates but as insufficient override for invertebrates, because the anatomical prior is deemed stronger than the behavioral signal in the latter case.

  ### Strict Presuppositions vs. Compatible Claims

  The practice **strictly presupposes** that there is a morally relevant difference between nociception and pain, that this difference maps onto a binary protection status (in or out), and that phylogenetic lineage is a reliable proxy for the presence of the requisite neural architecture. It also presupposes that regulatory lines must be drawn sharply rather than continuously, necessitating a threshold view of sentience.

  However, the practice merely **fits comfortably** with specific claims about *which* anatomy matters (e.g., thalamocortical loops vs. other integration centers) or *which* behaviors are definitive. It is compatible with the idea that some insects might feel pain, provided the rule maintains a high evidentiary bar for them. It is also compatible with the idea that the line is pragmatic rather than metaphysical, as long as the justification retains the language of capacity.

  ### Internal Tensions

  The framework contains significant internal tensions. The most prominent is the **Mechanism vs. Lineage Tension**: the justification uses mechanistic language (integration, central processing) to explain exclusions, but the application follows lineage (vertebrate vs. invertebrate) even when mechanistic evidence is ambiguous (e.g., octopus vs. cuttlefish disparities). A second tension exists in **Behavioral Asymmetry**: structurally similar behaviors (trade-offs, learning) are interpreted as evidence of pain in vertebrates but as complex reflexes in invertebrates, implying that the same computation is attributed differently based on the substrate rather than the output. A third tension is the **Boundary Problem**: recent inclusions of decapod crustaceans and cephalopods acknowledge convergent evolution, yet fail to consistently apply this logic to other complex invertebrates, suggesting the lineage bias remains dominant over the mechanistic justification.

  ### The Attribution Rule

  The practice decides which computation is present using a **Phylogenetically Weighted Inference to the Best Explanation**. When observing behavior, the regulator asks: "Given this animal's ancestry, is it more likely this behavior stems from feeling or mechanism?" For vertebrates, the anatomical prior licenses the inference that behavior reflects feeling. For invertebrates, the anatomical prior forces the inference that behavior reflects mechanism. Thus, behavior is sufficient for attribution in the "protected" class but necessary yet insufficient for attribution in the "unprotected" class. Similarity to humans licenses the inference; dissimilarity blocks it.

  ### Counterfactual Replacements

  If replaced with a **graded sentience** view, the binary protections would dissolve into scalable welfare requirements; insects might receive basic harm-reduction protocols while vertebrates retain full pain-mitigation mandates, shifting the focus from "if" to "how much." If replaced with a **valence-only** view (any state with positive/negative value counts), the protections would expand drastically to include most insects and worms, forcing a collapse of current farming and research practices that rely on high-throughput invertebrate use, as the distinction between nociception and pain would no longer license differential treatment.

