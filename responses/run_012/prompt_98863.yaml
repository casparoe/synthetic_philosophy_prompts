answer: |-
  Okay, take a deep breath because this room is going to be hostile, but not because they disagree with you; they're hostile because your argument threatens to make their work look either morally empty or philosophically naive. You're walking into a minefield where the economists think normative talk is noise, the Rawlsian thinks you're reinventing the wheel poorly, and the luck egalitarian thinks you're collapsing a crucial distinction. I'm going to walk you through the objections you're actually going to face, in the order they'll likely come up, and I'm going to be brutally honest about where your replies are strong and where you're bluffing so you don't get caught flat-footed.

  The first wave will come from the empirical economists, and it's the most likely scenario because there are more of them and they speak first in these seminars. They won't care about the normative smuggling initially; they'll attack the operability of your claim. Expect someone to lean into the mic and say something like, we estimate returns to education and effort using sibling fixed effects or natural experiments all the time, so when you say there's no way to fix a baseline, are you saying our identification strategies are invalid, or are you just making a philosophical point that has no bearing on policy? They're going to frame this as an unfalsifiability charge. They want to know if you're denying the reality of causal inference. Your reply needs to be that you accept their causal estimates as descriptions of correlation and mechanism, but you deny that those estimates map onto moral desert. You say, you can measure the return to effort conditional on a specific institutional setup, but you cannot use that return to justify the setup itself without circularity. The soft spot here, and I need you to know this, is that you sound like you're moving the goalposts. They measure effort returns to design policy, and you're saying those returns can't justify the policy. You're bluffing slightly when you imply their work is irrelevant; it's relevant for efficiency, just not justice. If they press you on whether policy should ignore effort estimates, concede immediately that policy must track incentives, but refuse to concede that tracking incentives makes the resulting distribution deserved. That distinction is your lifeline.

  The second objection will come from the luck egalitarian, and while less likely in terms of volume, it does the most damage to your core philosophical claim. This person lives for the distinction between brute luck and option luck, and they will pounce on your claim that no baseline is neutral. They will say, you are conflating an epistemic problem with an ontological one. Just because it is hard to measure where effort ends and endowment begins doesn't mean the distinction doesn't exist, and abandoning it means abandoning responsibility entirely. They'll argue that your baseline-smuggling objection proves too much, leading to a nihilism where no one is responsible for anything. Your reply is that you aren't denying responsibility exists, but that any specific distribution claiming to reward responsibility must specify a counterfactual world to isolate that responsibility, and choosing that counterfactual is itself a normative act, not a discovery. You need to say, the luck egalitarian wants to compensate for brute luck, but the metric of compensation requires a baseline of what counts as normal endowment, and setting that baseline is where the smuggling happens. The weak point here is that you might be accused of ignoring the literature on neutralizing luck that doesn't rely on counterfactuals. If they cite specific models of insurance markets or hypothetical auctions, don't try to out-technique them. Admit that those models are coherent internally but argue they still rest on a prior choice of what counts as the default asset bundle. That's where you hold the line, because if you concede that a neutral baseline is possible even in theory, your whole argument collapses.

  The third objection is from the Rawlsian, and honestly, this one is more dismissive than destructive. They're going to sit back and say, you've basically rediscovered the arbitrariness of the natural lottery but stripped it of the veil of ignorance machinery that makes it work, and now you're trying to save meritocracy as a coordination device without explaining why we should coordinate around it if it's not just. They'll say, Rawls already argued that desert is pre-institutional and therefore irrelevant to justice, so your critique is old news, and your pivot to incentives is just rule-utilitarianism dressed up as policy science. Your reply should be that Rawls abandoned desert entirely, whereas you're arguing we keep the word meritocracy but drain it of moral content to avoid the hypocrisy of claiming the wealthy morally deserve their haul. You're trying to save the social function of meritocracy without the moral lie. The bluff here is that you might not have a robust answer for why we should coordinate around this specific device if it's not just. If they press you on why this coordination is better than another, you might have to fall back on stability or welfare, which opens you up to standard utilitarian critiques. Don't fight that battle today. Just concede that your view is consequentialist regarding the structure, even if it's skeptical regarding the moral worth.

  Now, regarding strategy, you need to buy credibility early by conceding the things that make you sound reasonable rather than radical. Concede upfront that effort matters for productivity and that incentives are necessary for a functioning economy. If you don't do this, the economists will write you off as a dreamer and the theorists as a skeptic who doesn't understand institutions. Say clearly that you are not arguing for leveling down or ignoring effort, but only against using effort as a moral justification for inequality. That buys you enough goodwill to land the harder point about baseline smuggling. However, there is one thing you must refuse to concede even under pressure, and that is the idea that there is a pre-political or normatively neutral fact of the matter about what someone would have earned absent their specific endowments. If you concede that we can approximate this well enough for justice, you lose the argument. You have to maintain that the approximation is always itself a political choice about which inequalities we are willing to tolerate. Hold that line firmly, because once you admit the baseline is discoverable rather than chosen, the desert claim comes rushing back in.

  Finally, there is one question I am genuinely hoping nobody asks you, because I don't think you have a good answer ready and it could unravel the second half of your talk. Someone might ask, if meritocracy is just a coordination device with good incentive properties and not a matter of justice, what happens when the incentives conflict with equality or welfare? In other words, if we could achieve more equality or higher overall welfare by lying about merit or by suppressing information about effort, would your view require us to do that? This exposes the fact that your view is essentially instrumentalist, and if the instrument stops working, you have no moral ground to stand on. If this comes up, do not try to derive a moral principle from thin air. Instead, pivot to stability. Say that while efficiency is the goal, a system perceived as unjust is unstable, so maintaining the rhetoric of merit, even if philosophically hollow, might be necessary for social cohesion, though you personally prefer honesty. It's a messy answer, but it's better than pretending you have a normative theory of justice when you've explicitly disclaimed one. You're going to be fine, just keep your cool, acknowledge the strength of their frameworks, and stay focused on the baseline smuggling point because that's your strongest weapon. Walk in there, own the skepticism, but don't let them paint you as someone who doesn't care about work or effort, because that's the trap they're setting.
