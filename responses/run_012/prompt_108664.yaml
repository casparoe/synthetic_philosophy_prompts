answer: |-
  **Section 0: Preliminary Note**

  We adopt a five-fold taxonomy to map the institutional landscape. (1) *Establishment as Control*: state dictates doctrine (none of the six cases). (2) *Establishment as Privilege*: symbolic recognition or legislative seats without fiscal control (Case 3: UK). (3) *State-Collected Membership Finance*: payroll withholding based on civil registration (Case 1: Germany; Case 6: Sweden historic). (4) *Taxpayer-Directed Earmarks*: fraction of liability directed via tax return without membership registration (Case 2: Spain/Italy). (5) *Separation*: no direct subvention or category usage (Case 4: US; Case 5: France).

  Cases often overlap. Case 1 combines Privilege and Membership Finance. Case 5 is Separation with a territorial exception (Alsace-Moselle). Case 4 is Separation with residual ceremonial entanglement. A primary verbal dispute concerns "establishment": Party A uses it to denote recognition compatible with liberty; Party B uses it to denote any state usage of religious categories. This document treats "establishment" neutrally as state recognition, distinguishing fiscal from symbolic forms.

  **Section 1: Agreed Claims**

  *Nature of the Dispute*
  1. Both parties seek to maximize religious liberty while maintaining state neutrality regarding truth claims.
  2. The dispute is not about whether religion is good, but whether state mechanisms distort religious integrity or facilitate it.

  *Fixed Liberties*
  3. No individual may be coerced into belonging to or funding a religious body against their will.
  4. Exit from a religious body must be legally effective upon declaration to civil authorities, regardless of religious law.
  5. The state may not adjudicate theological correctness, only institutional identity for legal purposes.

  *Descriptive Claims*
  6. In Germany, roughly seventy per cent of church revenue comes from the church tax withheld via payroll data drawn from the federal tax administration.
  7. In Italy, shares of taxpayers who designate nothing on the return are redistributed among beneficiaries in proportion to designations others made.
  8. In Italy, no Islamic body can be designated because none is recognized as the representative of Islam.
  9. In France, the 1905 law prohibits state funding but does not apply in Alsace-Moselle, where the concordat survives.
  10. In Sweden, disestablishment in 2000 did not precipitate immediate mass exit from the register, though attendance remains low.

  *Failure Conditions*
  11. Any arrangement fails if it makes exit procedurally impossible or financially punitive.
  12. Any arrangement fails if it empowers state officials to dictate internal religious doctrine.
  13. Any arrangement fails if it creates a financial dependency that alters religious teaching to suit state preferences.

  *Hard Cases Procedure*
  14. For bodies with no central authority, the state shall recognize the entity holding legal title to property as registered in civil court.
  15. For bodies whose rites conflict with general law, civil law prevails without regard to religious exemption claims regarding harm.
  16. For schisms or parody claims, recognition depends on continuity of prior registration or incorporation under general voluntary association law, not theological fidelity.

  **Section 2: Disagreements Table**

  | Question at Issue | Party A (Cooperationist) | Party B (Separationist) | Kind of Disagreement | Crux? |
  | :--- | :--- | :--- | :--- | :--- |
  | **State Collection of Funds** | Payroll withholding is a administrative service facilitating voluntary giving; exit options negate coercion. | State machinery collecting religious dues makes the state a tax farmer for churches; default settings coerce inertia. | Normative/Empirical | Yes |
  | **Defining Religion** | Determining eligibility for tax benefits is an administrative task comparable to defining charities; manageable costs. | Any state definition of "religion" constitutes establishment of state authority over religion; fatal to liberty. | Conceptual | Yes |
  | **Effect on Participation** | Public recognition and stable funding sustain religious participation and restrain radicalism. | State privilege corrupts religious mission, turning churches into clients and suppressing authentic belief. | Empirical | Yes |
  | **Neutrality Standard** | Neutrality requires equal treatment of all comers under open schemes (formal equality). | Neutrality requires the state to avoid religious categories entirely (substantive blindness). | Normative | No |
  | **Non-Designation Funds** | Undirected funds should be redistributed proportionally to chosen bodies to reflect aggregate preference. | Undirected funds must return to general revenue; redistribution presumes consent not given. | Normative | No |

  **Section 3: The Cruxes**

  **Crux 1: Is State-Mediated Finance Coercive?**
  *Question:* Does payroll withholding for religious bodies constitute coercion even with civil exit options?
  *Why it Moves Parties:* If yes, Party A's preferred model (German tax) is illegitimate. If no, Party B's prohibition is unnecessary.
  *Shared Test:* Compare exit rates and perceived burden in Germany (withholding) vs. Italy (earmark) vs. US (voluntary).
  *Predictions:* Party A predicts that if the German tax is abolished, church revenue will drop by >40% within five years, proving the mechanism facilitates rather than coerces. Party B predicts that if the tax remains, formal membership will exceed active attendance by a ratio of >5:1, proving inertia而非 commitment.
  *Falsification:* A is falsified if revenue remains stable after abolition. B is falsified if membership tracks attendance closely under the tax regime.

  **Crux 2: The Definitional Problem**
  *Question:* Is the state's necessity to decide what counts as a religion fatal to liberty?
  *Why it Moves Parties:* Party B sees this as inherent corruption; Party A sees it as routine administration.
  *Shared Test:* Examine the Italian exclusion of Islamic bodies versus the German inclusion of various sects.
  *Predictions:* Party A predicts that expanding recognition criteria will reduce litigation without increasing state theological interference. Party B predicts that any expansion of criteria will invite state scrutiny of internal governance to verify eligibility.
  *Falsification:* A is falsified if expanded criteria lead to state audits of doctrine. B is falsified if broader criteria reduce conflict without state interference.

  **Crux 3: Establishment and Participation**
  *Question:* Does establishment sustain religious participation or suppress it?
  *Why it Moves Parties:* Party A argues establishment stabilizes; Party B argues it secularizes.
  *Shared Test:* Compare Sweden (disestablished) vs. Denmark (established) vs. US (disestablished).
  *Predictions:* Party A predicts Sweden's disestablishment will accelerate membership decline relative to Denmark. Party B predicts Sweden's disestablishment will increase attendance per member relative to Denmark.
  *Falsification:* A is falsified if Swedish membership stabilizes post-2000. B is falsified if Danish attendance per member exceeds Sweden's.

  **Section 4: Reform Evaluation**

  We evaluate two reforms replacing the German-style church tax.

  *Variant 1: Voluntary Taxpayer-Directed Earmark (Spanish/Italian Model)*
  *Mechanism:* Box on annual income-tax return; no payroll withholding; no civil registration of membership required.
  *Party A Predictions:* Formal membership will decline as registration is no longer tied to tax status. Total religious finance will drop initially but stabilize. Money will concentrate in large, historically recognized bodies (like Italy), marginalizing heterodox groups. Political salience will decrease as churches lose guaranteed income.
  *Party B Predictions:* Formal membership will become meaningless. Total finance will drop significantly. Distribution will skew heavily toward traditional bodies due to name recognition. Heterodox bodies will suffer unless they achieve broad visibility.
  *Non-Designation:* Party A argues for proportional redistribution among designated bodies to maximize religious funding. Party B argues for reversion to general revenue to avoid presuming consent.

  *Variant 2: Pure Voluntary Giving (US Model)*
  *Mechanism:* State plays no fiscal role; religious bodies financed by private donation under general law; tax exemption only.
  *Party A Predictions:* Formal membership will plummet. Total religious finance will drop by >50%. Small and heterodox bodies will flourish relative to large ones due to lower barriers. Political salience will increase as churches mobilize members for funding.
  *Party B Predictions:* Formal membership will reflect actual belief. Total finance will reflect genuine commitment. Distribution will be more equitable across diverse bodies. Political salience will decrease as churches focus on donors rather than state lobbying.
  *Non-Designation:* Both agree funds must return to general revenue; no redistribution mechanism exists.

  *Hard Cases Application:* In both variants, if a schism occurs (two organizations claiming same members), Variant 1 relies on tax registration data to assign earmarks; Variant 2 relies on civil property title. Both parties agree civil property title (Claim 14) is the decisive procedure for Variant 2, but disagree on whether tax registration data is valid for Variant 1.

  **Section 5: The Residual Disagreement**

  *Party A's Irreducible Claim:* "Public recognition of religious bodies by the state is a form of respect for what citizens actually value, and a liberal state may treat religious institutions as partners in welfare without wronging anyone."
  *Party B's Irreducible Claim:* "State involvement corrupts both parties to it, turning churches into clients and the state into a theological authority, and any scheme of recognition forces officials to decide what counts as a religion."

  *Condition for Resolvability:* This residue is resolvable only if empirical evidence demonstrates that state partnership systematically enhances human dignity without altering religious doctrine, or conversely, that state distance systematically preserves religious integrity without marginalizing believers. Until data distinguishes *respect* from *corruption* in observable institutional behavior, the disagreement remains normative. Both parties agree that if a regime produces coercive exit barriers or state-dictated doctrine, it fails both tests. However, they disagree on whether the German church tax constitutes such a barrier or merely a facility.
