          *   "Authors lie": A bit cynical. Sometimes they just forget or articulate poorly.
          *   "Words on the page": Ignores context (historical, cultural).
      *   **What's False/Conflated:**
          *   The slide into Reader-Response. New Criticism (Intentional Fallacy origin) says meaning is *in the text*, not *made by the reader*. The handout mixes these up.
      *   **Who Would Object:**
          *   Biographical/Historical Critics.
          *   The Authors themselves (obviously).
          *   Cognitive Poetics (how brains process intent).
          *   Post-Colonial/Identity Critics (intent matters for marginalized voices).

  5.  **Addressing the "What Would Change My Mind" Constraint:**
