      *   **Specific Constraints:** The user wants to know "what would change your mind" and "where your reasoning is most likely to go wrong" (meta-cognitive reflection on the AI's own analysis).
      *   **User's Context:** High school or early college English student. They have personal anecdotes (their own poem with accidental symbolism, their cousin's story with unintended themes) that challenge the strict "death of the author" view.
      *   **Tone:** Critical, nuanced, educational, but accessible.

  2.  **Deconstruct the User's Summary of Intentional Fallacy:**
