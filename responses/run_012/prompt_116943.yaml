      *   **Core Theory:** Tight-vs-loose is a category mistake. Societies have a finite "budget" for norm enforcement. It's zero-sum (spend on X, can't spend on Y). Normative questions (how much rule-following?) can't be answered abstractly because of this trade-off.
      *   **Requirements:**
          *   8-10 interview questions.
          *   Each with a follow-up keyed to her likely answer.
          *   Specific topics to cover: Operationalizing the "budget" (units of enforcement), Moral norms vs. conventions, Minority-burden objection (laundering oppression).
          *   Strategy: Sequence questions so her standard deflection ("it's an empirical question about cooperation") gets progressively harder to use.
          *   Ending: A question about favoring looseness even if tightness improves coordination.
          *   Tone: Philosophical, rigorous, not journalistic/softball, assumes familiarity with the literature (Gelfand, etc., though no citations needed).
          *   No generic intro questions or reading list requests.

  2.  **Deconstruct the Guest's Theory ("Tightness Budgeting"):**
      *   *Premise 1:* Enforcement capacity is finite.
      *   *Premise 2:* Allocation is zero-sum.
      *   *Premise 3:* Aggregate "tightness" scores are misleading.
      *   *Premise 4:* Normative evaluation depends on allocation efficiency, not total volume.
      *   *Weaknesses/Pressure Points:*
          *   How do you measure the "currency" of enforcement? (Is a fine equal to a glare?)
          *   Is it really zero-sum? (Can technology or social capital expand the budget?)
          *   Does it ignore power dynamics? (Who decides the budget?)
          *   Does it reduce morality to coordination? (The "is-ought" gap).
          *   Are there rights that *shouldn't* be subject to budgeting?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: Operationalization.* Need to start with the mechanics. If it's a budget, what's the currency?
          *   *Likely Move:* She'll talk about cognitive load or social sanction intensity.
          *   *Follow-up:* Push on commensurability. Is a prison sentence comparable to social ostracism?

      *   *Question 2: Zero-Sum Assumption.* Challenge the finiteness.
          *   *Likely Move:* "Resources are always limited."
          *   *Follow-up:* What about internalization? If norms are internalized, enforcement cost drops. Does that break the budget model?

      *   *Question 3: Moral vs. Conventional.* (Required topic).
          *   *Likely Move:* "Both require enforcement resources."
          *   *Follow-up:* But moral norms claim universal authority. Does budgeting relativize murder vs. dress codes?

      *   *Question 4: The Aggregation Problem.* Why is the old way wrong?
          *   *Likely Move:* "It hides variance."
          *   *Follow-up:* If variance is key, how do we predict societal collapse? Isn't some baseline general tightness needed for trust?

      *   *Question 5: Power and Allocation.* Who sets the budget?
          *   *Likely Move:* "It emerges from cultural evolution."
          *   *Follow-up:* Evolution isn't neutral. Does this ignore elite capture of the enforcement budget?

      *   *Question 6: Minority-Burden Objection.* (Required topic).
          *   *Likely Move:* "It's about stability, not fairness."
          *   *Follow-up:* If stability relies on oppressing a minority, is that a successful budget allocation or a moral failure? (Pushing the normative angle).

      *   *Question 7: The Deflection (Empirical vs. Normative).* Start cornering her on the "it's empirical" defense.
          *   *Likely Move:* "We need to know what works first."
          *   *Follow-up:* But 'works' for whom? If the metric is cooperation, aren't you smuggling in a normative premise?

      *   *Question 8: Rights as Trumps.* Challenging the trade-off logic.
          *   *Likely Move:* "Rights are also norms that need enforcement."
          *   *Follow-up:* So rights compete with traffic laws in your budget? That seems to misunderstand the lexical priority of rights.

      *   *Question 9: Innovation and Deviance.* Tightness kills innovation.
          *   *Likely Move:* "Too much loose kills coordination."
          *   *Follow-up:* But if the budget is fixed, do we *need* reserved slack for deviance to adapt to change?

      *   *Question 10: The Killer Question.* (Required ending). Looseness even if coordination suffers.
          *   *Likely Move:* "Why would you want less coordination?"
          *   *Follow-up:* Because autonomy matters more than efficiency. Do you have room for that in your model?

  4.  **Refining and Sequencing:**
      *   *Goal:* Make the "empirical deflection" harder over time.
      *   *Early Qs:* Focus on mechanics (Budget currency, Zero-sum). She can stay descriptive here.
      *   *Middle Qs:* Focus on power and morality (Moral/Conventional, Minority burden). She will try to say "that's empirical stability."
