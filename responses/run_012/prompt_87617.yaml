answer: |-
  The principle you are seeking distinguishes between what we may say *about* the past and what we may say *of* the people in it. Your current "Availability Test" fails because it applies a single standard to both. It correctly protects agents from alien norms but incorrectly forbids historians from using analytical tools to describe structures and harms that exist independently of native taxonomy.

  I propose the **Principle of Non-Imputative Description**.

  It consists of three clauses. The first governs judgments of agents; the second governs judgments of harm; the third governs judgments of systems.

  ### The Principle of Non-Imputative Description

  **Clause 1 (The Interiority Ban):** A historian may not use a category to describe an agent's internal state (their reasons, rationality, identity, or legal guilt) if that category relies on concepts or norms unavailable to the agent.
  *   **Forced by:** Case 1 (War Crime), Case 5 (Irrational), and Case 6 (Homosexual).
  *   **Rationale:** To call an agent "irrational" or a "war criminal" is to claim they failed by a standard they could not recognize. To call them "homosexual" is to claim an identity they did not possess. These are imputations of internal status.

  **Clause 2 (The Moral Exception):** Clause 1 does not apply to moral descriptions of harm. A historian may condemn an act as morally wrong or atrocious even if the specific vocabulary of condemnation was unavailable, provided the harm is intrinsic to the act and not dependent on local convention.
  *   **Forced by:** Case 2 (Moral Monster).
  *   **Rationale:** Moral truth (on your view) is not a local convention. The slave trader's neighbors were wrong; the victims' suffering was real regardless of the vocabulary. This exempts moral evaluation from the Interiority Ban.

  **Clause 3 (The Structural Proviso):** A historian may use an analytical category to describe external social structures or patterns even if the term was unavailable, *unless* the category presupposes a systemic logic, bounded unit, or mode of integration that did not exist in that society.
  *   **Forced by:** Case 3 (GDP), Case 4 (Religion), and Case 7 (Feudalism).
  *   **Rationale:** We can name patterns the agents did not name (Feudalism, Religion). However, we cannot import a logic that distorts the system's nature (GDP implies a bounded, measured national economy; Feudalism implies a hierarchy of obligation). The former imposes a false mechanism; the latter names a real relation.

  ***

  ### Application to Your Seven Cases

  *   **Case 1 (War Crime):** **Reject.** Violates Clause 1. "War crime" imputes legal guilt based on a code the commander could not know.
  *   **Case 2 (Moral Monster):** **Accept.** Protected by Clause 2. The moral harm is intrinsic; local approval is irrelevant.
  *   **Case 3 (GDP):** **Reject.** Violates Clause 3. GDP presupposes a "national economy" as a bounded, measured unit with growth logic. This imposes a systemic mechanism that did not exist.
  *   **Case 4 (Religion):** **Accept.** Satisfies Clause 3. "Religion" here functions as a label for a cluster of rituals and beliefs. It does not claim the society had a separate "religious sphere," only that these practices fit the historian's functional definition.
  *   **Case 5 (Irrational):** **Reject.** Violates Clause 1. "Irrational" imputes a cognitive defect. Given his evidence, his reasoning was sound.
  *   **Case 6 (Homosexual):** **Reject.** Violates Clause 1. Even glossed as "desire," the term "homosexual" carries the weight of a modern identity category. To apply it is to impute an internal organization of self that was unavailable.
      *   *Surrender:* This principle forces a verdict on Case 6. You stated you were "unsure." To maintain the clarity of the Interiority Ban, you must surrender the possibility that "homosexual" is legitimate. If you wish to keep it open, you must weaken Clause 1, but doing so risks reintroducing the anachronisms of Case 1 and 5. I recommend accepting the rejection: describe the *acts* and *attachments*, but withhold the *identity* label.
  *   **Case 7 (Feudalism):** **Accept.** Satisfies Clause 3. "Feudalism" names a structure of obligation and land tenure that existed, even if the word did not. It does not imply the agents operated a "feudal system" consciously, only that they inhabited those relations.

  ***

  ### Testing on New Cases

  Here is how the Principle of Non-Imputative Description verdicts on your four new cases, followed by my defense of any that might seem contentious.

  **1. A historian calls a nineteenth-century colonial campaign a *genocide*.**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** This falls under Clause 2 (The Moral Exception). Like "Moral Monster," "Genocide" describes a specific type of mass harm (intent to destroy a group). While the legal term was coined in 1944, the *reality* of the intent and the destruction is an objective fact of the campaign, not a legal status dependent on the agent's knowledge.
  *   **Caveat:** It is impermissible if used to imply the agents were *legally* prosecutable under the 1948 convention (Clause 1), but permissible as a moral and descriptive characterization of the event (Clause 2).

  **2. A historian calls a practice *torture* although it was lawful where and when it occurred.**
  *   **Verdict:** **Permissible.**
  *   **Reasoning:** This is identical to Case 2 (Slave Trader) and governed by Clause 2. Lawfulness is a local convention; the infliction of severe pain for coercion or punishment is an intrinsic harm. The historian is not imputing legal guilt (Clause 1) but describing the nature of the act.

  **3. A historian writes about *medieval childhood* as though the category were timeless.**
  *   **Verdict:** **Impermissible (with nuance).**
  *   **Reasoning:** This tests Clause 3 (The Structural Proviso).
      *   If "childhood" refers merely to the biological stage of juvenility and their treatment by adults, it is permissible (like "Religion" in Case 4).
      *   However, if "childhood" implies the modern *psychological* and *developmental* concept (a distinct sphere of innocence, emotional interiority, and staged maturation), it violates Clause 3. It imposes a systemic logic of human development that medieval society did not inhabit.
      *   *Defense:* I defend the "Impermissible" verdict regarding the *timeless* category. To treat medieval children as having the same psychological interiority as modern children is to distort the structure of the past self, akin to calling the anatomist "irrational" (Case 5). The historian should describe the *treatment* of the young, not assume the *category* of the child is transhistorical.

  **4. A historian uses *nationalism* to describe a society organized around dynastic loyalty.**
  *   **Verdict:** **Impermissible.**
  *   **Reasoning:** This violates Clause 3. "Nationalism" is not just a label for loyalty; it presupposes a specific systemic logic: that political legitimacy derives from a "people" or "nation" rather than a dynasty or ruler. To use it for a dynastic society is like using "GDP" for a manor (Case 3). It imports a mode of political integration that did not exist, distorting the explanation of why people fought or obeyed.

  ### Reflection on the New Verdicts

  If you find the verdict on **Medieval Childhood** wrong, I would amend **Clause 3**.

  Currently, Clause 3 forbids categories that impose a "systemic logic." If you believe "childhood" is a biological universal that overrides cultural construction (similar to Moral Harm in Clause 2), we could add a **Biological Exception** to Clause 3: *Analytical categories grounded in biological reality are permissible even if the social meaning differs.*

  However, I advise against this. The "GDP" case (3) was rejected not because economics is fake, but because the *mechanism* of a national economy was absent. Similarly, the *mechanism* of modern childhood (psychological development) was absent. If you accept the GDP verdict, you should accept the Childhood verdict. If you reject the Childhood verdict, you must explain why "Economy" is more culturally constructed than "Childhood," which risks inconsistency with Case 3.

  If you find the verdict on **Genocide** wrong (i.e., you think it *is* anachronistic), I would amend **Clause 2**.

  Currently, Clause 2 allows moral terms for intrinsic harms. If you believe "Genocide" is too legally loaded (like "War Crime" in Case 1), we must restrict Clause 2 to *moral adjectives* (wrong, atrocious, monstrous) and forbid *legal/sociological nouns* (genocide, torture, crime).
  *   *My Defense:* I defend the Permissible verdict. "Genocide" has passed into common moral vocabulary distinct from its legal statute. It describes a *type of event* (destruction of a group) rather than just a *violation of code*. It aligns with "Moral Monster." To forbid it is to grant the perpetrators immunity from accurate moral description because they lacked the specific word.

  ### Summary of the Trade-off

  This principle saves your verdicts on 1, 2, 3, 4, 5, and 7. It resolves your uncertainty on 6 by ruling "No" (to preserve the ban on imputing identity). It requires you to treat "Genocide" and "Torture" as moral descriptions (Permissible) but "Nationalism" and "Childhood" (as a psychological category) as structural impositions (Impermissible).

  If this aligns with your intuitions on the new cases, the principle holds. If you wish to allow "Nationalism" or "Childhood," you must abandon the constraint on Systemic Logic (Clause 3), which would force you to reconsider the "GDP" verdict in Case 3. You cannot have Case 3 (No GDP) and Case New 4 (Yes Nationalism) without a distinction between *economic mechanism* and *political sentiment* that may be too fine to bear weight. I recommend keeping the restriction: do not import the *logic* of the present, only the *labels* for the patterns.
