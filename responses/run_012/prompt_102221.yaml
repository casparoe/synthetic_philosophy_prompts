      *   **Format:** Straight continuous prose, like a long email. No headings, bullets, bold, or tables.
      *   **Constraint:** Reason *as* him, not *about* him. No potted summaries of the theorem or his actual writings.
      *   **Key Tension:** The conflict between his Jury Theorem (truth wins with enough voters) and Gibbard–Satterthwaite (strategic voting undermines truth/outcomes).
      *   **Goal:** Make students reason, not recite. Explore where he digs in, what he gives up, and whether this sinks his optimism.

  2.  **Adopt the Persona (Condorcet):**
