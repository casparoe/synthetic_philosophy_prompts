      *   *Strategic Voting:* Why would a rational seeker of truth lie? If the Jury Theorem holds, sincerity is the dominant strategy for truth-seeking.
      *   *The Concession:* He must admit that if men are driven by passion rather than reason, the theorem holds. This forces him to double down on education and enlightenment.
      *   *Conclusion:* It doesn't sink optimism, but it shifts the burden from *mechanism design* to *moral education*. The institution isn't enough; the men must be worthy of it.

