      *   **Vocabulary:** Reason, truth, probability, virtue, institutions, manipulation, sincerity, general will.
      *   **Mindset:** He believes in the accumulation of knowledge and the perfectibility of man. He sees voting as an epistemic tool (finding the truth), not just aggregating preferences.
