answer: |-
  My dear friend,

  You ask me to stand again before the assembly of ideas, to look upon this new theorem you call Gibbard and Satterthwaite and tell you what I see. It is a strange sensation to be pulled from the silence of history to confront a mathematical proof that claims to seal the fate of the very institutions I spent my life dreaming of. I have read your summary of this result, this assertion that any method of gathering the general will, if it allows for more than two choices and refuses to place absolute power in the hands of a single man, must inevitably be vulnerable to manipulation. You ask if this sinks my optimism, if it forces me to abandon the hope that reason can guide the multitude. My first impulse, I confess, was a cold dread. We spent so much of the Enlightenment fighting against the assertion that men are too corrupt for liberty, only to be told now by the cold logic of numbers that liberty itself contains the seeds of its own deception. If the math says that sincerity cannot be guaranteed, then what becomes of the Jury Theorem? What becomes of my faith that the probability of a correct decision approaches certainty as the number of voters increases?

  But you know me, and you know that I have always trusted mathematics not as a master that commands despair, but as a lantern that reveals where we must walk. When I look closely at this new theorem, I see that it rests upon a foundation that I never accepted as universal. The theorem assumes that a voter comes to the urn with a fixed preference, a desire for a specific outcome regardless of its truth or justice, and that this voter is willing to lie about their judgment to secure that outcome. It treats voting as a market of desires rather than a tribunal of reason. In my work on the Jury Theorem, I was not concerned with aggregating whims or tastes. I was concerned with judgments of fact and rightness. There is a profound difference between asking a citizen which flavor of bread they prefer and asking them whether a law is consistent with the rights of man. In the latter case, there is a truth to be discovered. If there is a truth, and if the voter is competent—meaning they are more likely than not to recognize that truth—then strategic voting becomes irrational. To lie in the service of a false outcome is to act against the very purpose of the assembly.

  So here is where I must dig in, and where I suspect your students will find the real friction. This new theorem forces me to concede that if men vote as selfish agents seeking to maximize their own utility irrespective of the common good, then no institutional design can save them. The math holds there. I cannot deny it. But this does not invalidate the Jury Theorem; rather, it clarifies its conditions. The Jury Theorem relies on independence and sincerity. It tells us that if men seek the truth, the majority will find it. The Gibbard–Satterthwaite result tells us that if men seek power, the majority will be fooled. The tension between them is not a contradiction in the mathematics, but a contradiction in the moral character of the citizenry. You ask if this sinks my optimism. It does not, but it shifts the burden. I can no longer rest on the hope that the mechanism alone will produce justice. I cannot simply design a voting rule and assume it will function like a clockwork of reason. If the mechanism is vulnerable to gaming, it is because the men operating it are willing to game it.

  This forces me to give up the notion that institutions are sufficient. In my earlier writings, I perhaps placed too much faith in the structure of the assembly itself, believing that if we arranged the votes correctly, the general will would emerge like a physical law. This new proof corrects me. It tells me that the institution is only as honest as the voters who inhabit it. If the voters treat the ballot as a weapon rather than a measure, the theorem wins, and tyranny or chaos follows. But if we accept the premise of the Jury Theorem—that voters are engaged in a collective search for truth—then the incentive to manipulate vanishes. Why would a rational seeker of truth vote strategically? To do so would be to lower the probability of the correct outcome, which is the very thing they wish to maximize. Therefore, the vulnerability described by this modern theorem is not a flaw in the voting rule, but a symptom of a society that has failed to educate its citizens to value truth over advantage.

  I want your students to understand that this is not merely a technical problem of mechanism design. It is a moral problem disguised as algebra. If I am brought back to see a world where this theorem is treated as a reason to abandon democratic hope, I would say they have misunderstood the lesson. The theorem proves that you cannot force honest men to be honest through rules alone. It proves that without a shared commitment to the existence of a common good, any system can be broken. This does not sink my optimism, but it demands more of it. It demands that we focus less on the counting of votes and more on the formation of the voters. The Jury Theorem remains my beacon, but it now shines with a warning. It works only if the voters are independent and sincere. This new result tells us that sincerity is not a given; it is a achievement. It must be cultivated through education, through the spread of knowledge, through the removal of the prejudices that make men see their interest as separate from the truth.

  So, where does this leave us? It leaves us with a choice. We can accept the assumptions of this new theorem, assume that men are merely bundles of fixed preferences seeking dominance, and conclude that all non-dictatorial systems are flawed. Or we can accept the assumptions of the Jury Theorem, assume that men are capable of judging truth, and recognize that the vulnerability to manipulation is a challenge to our virtue, not our mathematics. I choose the latter. I must. To do otherwise is to surrender the perfectibility of the human mind. If you tell me that any rule can be gamed, I tell you that any rule can be honored. The math describes the game, but it does not dictate whether we must play it. My hope was never that institutions would make men good, but that good men would make institutions work. This theorem simply confirms that if men are not good, the math will expose them. Let it expose them. Let the students see that the impossibility lies not in the voting, but in the refusal to seek the truth together. That is where the real work begins, and that is why I remain, despite this troubling news, convinced that the progress of reason is still possible, provided we understand that the ballot box is not a machine, but a mirror.

  Yours in reason,

  The Marquis de Condorcet
