  3.  **Address the Key Tension (Jury Theorem vs. G-S):**
      *   *Jury Theorem:* If voters are competent (>50% chance of being right) and vote sincerely, the majority decision converges to truth as $n \to \infty$.
      *   *Gibbard–Satterthwaite:* If voters act strategically (not sincerely), the mechanism fails to be non-dictatorial and non-manipulable.
      *   *The Clash:* G-S assumes preferences are arbitrary and voters are strategic. Condorcet assumes there is an objective truth and voters are trying to find it (sincere).
      *   *Condorcet's Escape Hatch:* He would argue that G-S applies to *preferences*, but his Jury Theorem applies to *judgments*. If there is a truth to be found, strategic voting is irrational because it moves you away from the truth. Therefore, the "manipulability" is only a problem if voters care more about outcome than truth.

