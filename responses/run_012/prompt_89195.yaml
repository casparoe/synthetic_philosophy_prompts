  Bit of a weird request. I retired last year from a career in molecular biology and have been sitting in on a philosophy reading group that's gotten obsessed with whether a superintelligent machine would be dangerous by default. The arguements keep sliding past each other and I think it's because nobody's clear on which claims they're actually committed to. So: could you build me a decision tree or taxonomy of the positions, organized by the questions that actually seperate them rather than by a list of authors?

