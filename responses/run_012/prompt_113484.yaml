  # Moral Variation and Objectivity: A Decision Tree

  **Instructions:** Start at the top. Answer each question based on your best assessment of the evidence or your conceptual commitments. Follow the branch to the next node or to a final position (Leaf).

  ### **Node 1 (Conceptual): Do moral statements aim to describe facts that can be true or false?**
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Node 2.
      *   *[Gap Diagnosis: If "No," branches regarding truth-makers (Realism/Relativism) are **incoherent**, as non-truth-apt claims cannot be objective or relative in a factual sense.]*

  ### **Node 2 (Empirical): Is the observed cross-cultural variation genuine, or largely an artifact of translation and divergent vocabularies?**
  *   **Artifact/Unclear:** Go to **Leaf B**.
  *   **Genuine:** Go to Node 3.
      *   *[Note: This finding is **contested**; linguistic anthropologists often dispute the granularity of moral translation.]*
  *   *[Gap Diagnosis: If "Artifact," branches relying on deep cultural divergence (Relativism/Debunking) are **unattractive**, as they build metaphysical conclusions on linguistic noise.]*

  ### **Node 3 (Empirical): Is disagreement within cultures as wide as disagreement between cultures?**
  *   **Yes (Within = Between):** Go to **Leaf B**.
  *   **No (Between > Within):** Go to Node 4.
      *   *[Note: This data is largely **uncollected**; most studies compare national averages, not intra-cultural variance.]*
      *   *[Gap Diagnosis: If "Yes," the "Culture" variable drops out, making Cultural Relativism **unexplored** in this specific path.]*

  ### **Node 4 (Conceptual/Empirical): Does the variation concern *who* is admitted to the moral community, or the *rules* governing those admitted?**
  *   **Who Counts (Boundaries):** Go to **Leaf C**.
  *   **Rules/Verdicts:** Go to Node 5.

  ### **Node 5 (Conceptual): Is the divergence shallow (different applications of shared principles) or deep (incompatible foundational ends)?**
  *   **Shallow (Means):** Go to **Leaf D**.
  *   **Deep (Ends):** Go to Node 6.
      *   *[Note: Distinguishing means from ends is **contested**; agents often mistake local rules for universal ends.]*

  ### **Node 6 (Conceptual): Do the disagreeing parties accept any shared reasons as valid?**
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to Node 7.
      *   *[Rationale: If shared reasons exist, objectivity may reside in the reasons rather than the consensus.]*

  ### **Node 7 (Conceptual): Is the explanation for our moral sense primarily biological (evolutionary) or social (upbringing)?**
  *   **Biological:** Go to **Leaf E**.
  *   **Social:** Go to Node 8.
      *   *[Gap Diagnosis: If "Biological," sociological accounts of truth-making are **incoherent** as primary drivers.]*

  ### **Node 8 (Conceptual): If the account is social, is morality a tool for cohesion or a tracker of truth?**
  *   **Tool for Cohesion:** Go to **Leaf F**.
  *   **Tracker of Truth:** Go to Node 9.

  ### **Node 9 (Conceptual): Are moral truths fixed independently of cultural attitudes, or determined by them?**
  *   **Fixed Independently:** Go to **Leaf G**.
  *   **Determined by Attitudes:** Go to **Leaf H**.

  ---

  ### **Leaves (Positions & Awkward Commitments)**

  *   **Leaf A: Non-Cognitivism / Quasi-Realism**
      *   *Awkward Commitment:* Moral argument is ultimately disguised emotional persuasion rather than proof.
  *   **Leaf B: Deflationary View**
      *   *Awkward Commitment:* Moral progress is real even if popular opinion never converges on it.
  *   **Leaf C: Moral Community Boundary View**
      *   *Awkward Commitment:* Moral status is a matter of club membership, not intrinsic worth.
  *   **Leaf D: Thin Core Convergence**
      *   *Awkward Commitment:* Specific cultural prohibitions are mostly accidental variations on a universal theme.
  *   **Leaf E: Evolutionary Debunking**
      *   *Awkward Commitment:* We have no reason to trust our own moral intuitions over those of our ancestors.
  *   **Leaf F: Pragmatic Constructivism**
      *   *Awkward Commitment:* Morality is a technology for social survival, not a guide to mind-independent truth.
  *   **Leaf G: Robust Realism**
      *   *Awkward Commitment:* Large swathes of other cultures' moral thought are simply erroneous.
  *   **Leaf H: Metaethical Relativism**
      *   *Awkward Commitment:* Outsiders cannot be correctly criticized, only described relative to their own standards.

  ---

  ### **Instrument Limitations**

  1.  **Indistinguishable Leaves:** This tree cannot empirically separate **Leaf B (Deflationary)** from **Leaf D (Thin Core)** without access to agents' internal reasoning processes; both predict similar external behavioral patterns.
  2.  **Indistinguishable Leaves:** This tree cannot separate **Leaf G (Robust Realism)** from **Leaf H (Metaethical Relativism)** if the "shared reasons" required to adjudicate truth are inaccessible to the observer.
  3.  **Empirical Gaps:** The tree hangs heavily on **Node 3** (Within vs. Between culture variance), which relies on data that has not yet been systematically collected across diverse populations.
