      *   *Step 2 (Ruling out Opinion/Intelligence proper):* Opinion usually judges based on sense data. In dreams, we judge qualities (white, beautiful) without sense data. Also, we sometimes reason *in* dreams (mnemonic example). But Aristotle says dreaming *itself* isn't just opinion because opinion usually follows sense. Wait, the text says "neither is it by opinion that we do so" but then admits we *do* exercise opinion in sleep. This is the tricky bit. He seems to be saying the *core* of dreaming isn't opinion, even if opinion happens alongside it.
      *   *Step 3 (The Illusion Argument):* In waking life, illusions (sun looks small) happen to the *sense faculty* even when we know better. Illusion requires *something* real to be perceived. In sleep, we perceive nothing real. So how can there be illusion?
      *   *Step 4 (The Resolution):* Dreaming belongs to Sense-Perception *qua* Presentative (imaginative).
      *   *Key Distinction:* Sense-Perception (active engagement with external world) vs. Faculty of Presentation/Imagination (*phantasia*) (residual movement of sense).
