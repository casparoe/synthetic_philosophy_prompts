answer: |-
  # Diagnostic Decision Tree: Bounded Rationality and Satisficing

  **Instructions:** Answer each question based on your actual commitments regarding agent behavior and rationality, not on the labels you have encountered in reading. Follow the branches indicated by your answers. Notes on unoccupied paths or behavioral collapses appear in *[italics]*.

  ### I. The Stopping Rule (Range)

  **Node 1.** Consider a **tenure committee that reads files until one clears the bar and never sees the rest**. Does this procedure capture the essence of your view on stopping (governing the *options considered*), or is the essence found in stopping *thought* rather than stopping search (governing the *deliberation performed*)?
  *   **Options Considered:** Go to Node 4.
  *   **Deliberation Performed:** Go to Node 2.

  **Node 2.** Consider a **chess engine that prunes a line because it is already lost**. Is this a distinct stopping rule, or merely a calculation that further thought has negative expected value?
  *   **Distinct Rule:** Go to Node 3.
  *   **Cost Calculation:** Go to Node 12.
      *   *[Note: If you choose Cost Calculation here, you are likely on the path to Optimization with Deliberation Costs. Node 12 will confirm if this dissolves the satisficing distinction entirely.]*

  **Node 3.** Consider a **doctor who stops testing once the probability of serious disease falls below a threshold**. Is this threshold a fixed constraint on search, or a variable in a maximization equation?
  *   **Fixed Constraint:** Go to Node 7.
  *   **Maximization Variable:** Go to Node 12.
      *   *[Unoccupied Path Note: The combination of "Deliberation Performed" (Node 1) and "Adaptive Threshold" (Node 5) is largely unoccupied. If stopping is about computation costs, the threshold is typically endogenous to the cost function, not an adaptive aspiration level. This path collapses into Optimization.]*

  ### II. The Threshold (Source)

  **Node 4.** Consider a **firm that reaches its target profit and stops looking for further efficiencies**. Is this target fixed by policy, or does it shift with market conditions?
  *   **Fixed by Policy:** Go to Node 7.
  *   **Shifts with Conditions:** Go to Node 5.

  **Node 5.** Consider a **house hunter who raises her price ceiling after six months of failed searches**. Does your view allow the threshold to drift with experience, or must it be set in advance?
  *   **Drifts with Experience:** Go to Node 6.
  *   **Set in Advance:** Go to Node 7.
      *   *[Behavioral Collapse Note: "Fixed by Policy" (Node 4) and "Set in Advance" (Node 5) are behaviorally indistinguishable in the short run. They separate only on whether the agent *can* revise the bar when the environment changes.]*

  **Node 6.** When an agent chooses, do they seek to clear an absolute bar of acceptability, or merely to improve upon their current status quo?
  *   **Absolute Bar:** Go to Node 7 (Adaptive Satisficing).
  *   **Improve Status Quo:** Go to Leaf: **The Meliorating Position**.
      *   *Awkward Commitment:* You must deny that agents aim for a stable standard of "good enough," insisting they only seek incremental gain.

  ### III. The Status of the Claim

  **Node 7.** Is the claim that agents stop search a description of how they in fact proceed?
  *   **Yes:** Go to Node 8.
  *   **No:** Go to Node 10.
      *   *[Unoccupied Path Note: A view that denies the descriptive claim but asserts a fixed threshold (Node 4) without normative force is unoccupied. It is unattractive because it posits a rule that neither describes reality nor guides action.]*

  **Node 8.** Is the claim that agents stop search a prescription for how they ought to proceed?
  *   **Yes:** Go to Node 9.
  *   **No:** Go to Leaf: **Bounded Rationality as a Research Program**.
      *   *Awkward Commitment:* You must abandon the normative question entirely, treating rationality as a methodology without pretensions to guidance.

  **Node 9.** If agents do stop search, is it possible they ought not to, with no need to reconcile the two claims?
  *   **Yes:** Go to Leaf: **The Divorce View**.
      *   *Awkward Commitment:* You must accept that human rationality is systematically defective without proposing a repair or redefinition.
  *   **No:** Go to Node 10.

  **Node 10.** Does your view define rationality itself as what bounded agents do well, making the maximizer a special case?
  *   **Yes:** Go to Leaf: **The Redefinition**.
      *   *Awkward Commitment:* You must concede that "rationality" is merely a label for survival skills, stripping it of idealizing force.
  *   **No:** Go to Node 11.

  **Node 11.** Is satisficing better than maximizing in the right environments precisely because it does not maximize?
  *   **Yes:** Go to Leaf: **Satisficing as an Instrumentally Superior Heuristic**.
      *   *Awkward Commitment:* You must argue that ignoring information is sometimes the optimal way to achieve maximal ends.
  *   **No:** Go to Leaf: **Satisficing as a Stopping Rule with a Fixed Threshold**.
      *   *Awkward Commitment:* You must maintain a descriptive account of fixed bars without claiming they are optimal or definitional.
      *   *[Behavioral Collapse Note: This leaf and "Satisficing as an Instrumentally Superior Heuristic" may produce identical predictions in the Firm case (Node 4). They separate only on whether the stopping rule is *just* how things are done, or *why* they should be done.]*

  **Node 12.** If we include the cost of thinking among the things being maximized over, does the phenomenon of satisficing disappear?
  *   **Yes:** Go to Leaf: **Optimization with Deliberation Costs Folded In**.
      *   *Awkward Commitment:* You must insist there is no separate phenomenon of satisficing once the cost of thinking is included among the things being maximized over.
  *   **No:** Go to Node 11.
      *   *[Unoccupied Path Note: The combination of "Cost Calculation" (Node 2) and "No" here is unoccupied. If you believe stopping is cost-based but deny it folds into optimization, the position is incoherent; cost-based stopping *is* the definition of optimization under constraints.]*

  ---

  ### Housekeeping Notes on Unoccupied and Collapsed Positions

  1.  **Behavioral Collapse (Fixed Threshold vs. Heuristic):** In the **Firm Case (Node 4)**, the leaf *Satisficing as a Stopping Rule with a Fixed Threshold* and the leaf *Satisficing as an Instrumentally Superior Heuristic* predict identical behavior (stopping at target profit). They cannot be separated by this case alone. They separate only on the *reason* for the stop: one claims it is a brute fact of procedure, the other claims it is an ecological adaptation.
  2.  **Unoccupied Combination (Deliberation + Adaptive):** There is no standard position corresponding to "Deliberation Performed" (Node 1) combined with "Drifts with Experience" (Node 5). If the stopping rule governs computation, the threshold is typically a cost-benefit crossover point (Optimization), not an aspiration level that adapts to success/failure. This path is unoccupied because it is unattractive; it mixes the mechanics of search with the mechanics of calculation without theoretical gain.
  3.  **Incoherent Path (Cost Calculation + Non-Optimization):** At Node 12, answering "No" after arriving from Node 2 (Chess/Cost Calculation) leads to incoherence. If stopping is determined by the cost of thinking, it is by definition optimization under constraints. To deny this is to misuse the term "cost."
  4.  **Unexplored Combination (Descriptive Only + Fixed Threshold):** A position that affirms Node 7 (Descriptive) but denies Node 8 (Normative) and Node 10 (Conceptual) without adopting the Divorce View (Node 9) is largely unexplored. It implies agents *do* satisfice, it is not *rational*, but we should not say they *ought* to maximize nor that the claims conflict. It is unoccupied because it is unstable; once you deny the normativity, the Divorce View or Research Program view usually follows.
