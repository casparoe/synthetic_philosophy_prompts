  The morning breaks without a sound,
  I know better.
  My feet are firm upon the ground,
  I know...

  I speak to friends across the square,
  The air is light, the sky is clear,
  I ask a question to the air,
  But no one interrupts me here.

  A stranger knocks and brings a claim,
  I know better.
  He speaks a different, foreign name,
  I know better.

  He shows the math, he shows the line,
  I know better.
  I say he drinks the poisoned wine,
  I know better.

  The window shakes, the walls press in,
  I know better.
  I cannot lose, I cannot win,
  I know better.

  The loop is closed, the knot is tight,
  I know better.
  I am the day, he is the night,
  I know better.
