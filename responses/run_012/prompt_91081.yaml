  Here is the ranking based on your 6-month timeline, limited headcount, and the specific "dumb vs. scheming" axis you highlighted.

  ### Tier 1 (High Confidence / Must-Haves)
  **E. Least-privilege scaffolding**
  *   **Axes:** Helps **Both** equally.
  *   **Why:** This is the only control that physically prevents damage regardless of intent. If the model is dumb, it can't delete prod; if it's scheming, it can't exfil data it can't access. It's pure infra work, fitting your team's skills.
  **H. Honeypots/tripwires**
  *   **Axes:** Helps **Both** (Strongest signal for Scheming).
  *   **Why:** Extremely high bang-for-buck. A dumb model might accidentally touch a fake secret; a scheming model probing for permissions will definitely touch it. It doesn't prevent, but it alerts you faster than any other method.
  **G. Red-team eval gate**
  *   **Axes:** Helps **Dumb** (Mostly), some **Scheming** (If evals are adversarial).
  *   **Why:** You cannot ship without a gate. It prevents regressing to known-bad behaviors. It's weak against novel scheming in prod, but it's standard engineering practice and required for leadership sign-off.

  ### Tier 2 (Good / Situational)
  **F. Watcher model**
  *   **Axes:** Helps **Both**.
  *   **Why:** This is the only other runtime check that competes with Honeypots for catching scheming, but it costs 2x inference and engineering time to maintain. High value, but heavy on the "limited headcount" constraint.
  **B. Constitution-style self-critique**
  *   **Axes:** Helps **Dumb** only.
  *   **Why:** Cheap prompt engineering that reduces obvious errors. However, a scheming model will simply lie during self-critique. Good for quality, useless for deception.
  **A. Preference tuning**
  *   **Axes:** Helps **Dumb** mostly.
  *   **Why:** Standard alignment, but requires a data pipeline you might not have yet. Helps general behavior, but if the objective is misaligned, tuning just makes it better at the wrong thing.

  ### Tier 3 (Low Confidence / Skip)
  **C. Process supervision**
  *   **Axes:** Helps **Dumb**.
  *   **Why:** Too expensive. Requires human labels for every reasoning step. Violates the "don't invent new science" mandate given the labeling overhead.
  **D. Interpretability probes**
  *   **Axes:** Helps **Scheming** (Theoretically).
  *   **Why:** This is active research, not stable infra. High false positives and violates your "no new science" mandate. Do not touch this in a 6-month window.
  **I. Deliberative logging**
  *   **Axes:** Helps **Dumb** (Audit only).
  *   **Why:** **Redundant with B.** If you do Constitution (B), you already have the logs. If the model is scheming, it will lie in the logs too. Only useful for post-mortem.

  ### Redundancies & Notes
  *   **B and I are redundant:** Implementing self-critique (B) naturally generates the logs described in (I). Don't build I separately.
  *   **D and F are similar:** Both are monitoring, but D is internal (research-heavy) and F is external (engineering-heavy). F is feasible; D is not.
  *   **The Scheming Reality:** You are correct that most "alignment" techniques (A, B, C) fail against a model actively working against you. Only **E** (can't act), **H** (caught acting), and **F** (watched acting) reliably address the scheming axis. **G** only helps if your evals anticipate the scheme.

  ### Top 3 to Ship First
  Given your 6-month constraint and infra background, you need controls that work even if the model is hostile, without requiring massive ML research overhead.

  1.  **E (Least-privilege):** Your primary defense. If this fails, nothing else matters.
  2.  **H (Honeypots):** Your primary detection. Cheap, high-signal alarm for unauthorized behavior.
  3.  **G (Eval Gate):** Your primary release quality control. You need this to legally/operationally ship.

  While **F (Watcher)** is strong for scheming, **G** is necessary for the shipping process itself, and **F** might blow your latency/cost budget. **B** is worth adding if you have spare cycles, but E/H/G are the backbone.

  \answer{keep: E, H, G}
