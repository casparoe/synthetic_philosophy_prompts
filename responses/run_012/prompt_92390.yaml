      *Wait, one more check on the "Experts" claim:* "a large referendum is more likely to hit the right answer than a small panel of experts, even when the experts are individually smarter."
      Mathematically: If Experts have $p=0.9$ (3 experts) vs Crowd $p=0.51$ (1000 people).
