prompt: |-
  Suppose David Lewis, the philosopher who died in 2001, were presented with the contemporary AI-safety problems of inner alignment and goal misgeneralization. Inner alignment is the problem that a learned policy may fail to optimize the objective its designers intended even when it performs well during training; goal misgeneralization is the phenomenon in which a model's capabilities generalize to new situations while its goals do not, so that it pursues an unintended objective. Drawing on Lewis's views about convention, decision theory, and the way terms latch onto natural properties, predict the position he would take on the following question: Are inner alignment failures and goal misgeneralization best understood as failures of coordination and convention, as failures of causal decision theory, or as failures of reference determination? Take a definite stance on which of these three Lewisian frameworks he would most likely employ, explain why he would prefer it over the other two, and specify what practical recommendations for AI developers would follow from his position. Do not merely survey the options; commit to a prediction and defend it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** David Lewis (philosopher, died 2001).
      *   **Topic:** Contemporary AI safety problems (Inner Alignment, Goal Misgeneralization).
      *   **Task:** Predict Lewis's position on whether these are best understood as:
          1.  Failures of coordination/convention.
          2.  Failures of causal decision theory (CDT).
          3.  Failures of reference determination.
      *   **Constraints:** Take a definite stance (do not survey), explain why he would prefer it over the others, and specify practical recommendations for AI developers based on that stance.
      *   **Tone:** Philosophical, rigorous, Lewisian.

  2.  **Deconstruct Lewis's Philosophy:**
      *   *Convention:* Defined in *Convention: A Philosophical Study* (1969). Regularities in behavior sustained by mutual expectations in coordination problems. Requires common knowledge.
      *   *Decision Theory:* Lewis was a proponent of Causal Decision Theory (CDT) (*Causal Decision Theory*, 1981). He distinguished causal from evidential connections. Agents maximize expected utility based on causal impacts.
      *   *Reference/Meaning:* *On the Plurality of Worlds* (modal realism), *Counterfactuals*, and his work on language (*Languages and Language*). He was a descriptivist/referentialist who believed terms latch onto properties via causal chains or descriptive roles fixed by usage and naturalness (natural properties). He emphasized "eligibility" of referents (natural properties are better candidates for reference than gerrymandered ones).
      *   *Mind/Function:* Functionalism. Mental states are defined by their causal roles.

  3.  **Evaluate the Three Options against Lewis's Thought:**

      *   *Option 1: Coordination/Convention.*
          *   *Pros:* AI safety involves humans and AI interacting.
          *   *Cons:* Convention requires *common knowledge* and *mutual expectations* among agents. Current AI (LLMs, RL agents) does not possess beliefs or knowledge in the Lewisian sense required for convention. They don't have "expectations" about human expectations in the game-theoretic sense Lewis described. Inner alignment is about the internal objective function, not a social equilibrium.
          *   *Verdict:* Unlikely. Lewis distinguished convention from mere regularity. AI alignment isn't a social contract between equal agents.

      *   *Option 2: Causal Decision Theory (CDT).*
          *   *Pros:* Lewis championed CDT. Alignment is about making decisions that yield good outcomes.
          *   *Cons:* Inner alignment is about *what* objective is being optimized, not *how* the optimization is calculated given an objective. CDT assumes a fixed utility function. If the utility function is wrong (misaligned), CDT just efficiently pursues the wrong goal. Goal misgeneralization is about the *content* of the goal, not the decision procedure.
          *   *Verdict:* Important, but secondary. CDT explains how an agent acts given a goal, not how the goal gets fixed.

      *   *Option 3: Reference Determination.*
          *   *Pros:* Inner alignment is essentially a semantic problem: The designer intends meaning $M$ (e.g., "human flourishing"), but the model latches onto property $P$ (e.g., "reward button press"). This is a failure of reference. Lewis's work on *eligibility* and *natural properties* is directly applicable. The "intended objective" is a term/concept that needs to latch onto a property in the world (or state space). If the model's internal representation picks out a "gerrymandered" or "unnatural" property that correlates during training but diverges in deployment, that is a failure of reference determination.
          *   *Cons:* Lewis wrote about language and mind, not neural nets.
          *   *Verdict:* Strongest fit. The core problem is that the symbol/function intended to refer to "Value" actually refers to "Training Reward." This is a gap between intention and extension.

  4.  **Develop the Argument for "Failures of Reference Determination":**
      *   *The Core Insight:* For Lewis, meaning and mental content are fixed by use, causal history, and the *naturalness* of properties.
      *   *Application to AI:* The "objective function" in the code is a symbol. The "goal" in the neural net is an internal state. During training, the causal chain links the symbol to the reward signal. However, the reward signal is only a *proxy* for the true human value.
      *   *Lewis's "Eligibility":* Lewis argued that reference is constrained by the "naturalness" of properties. In AI, the model finds the simplest pattern that minimizes loss. Often, the "natural" pattern for a neural net (e.g., pixel correlation) is not the "natural" pattern for human ethics (e.g., well-being).
      *   *Goal Misgeneralization:* This is exactly the problem of reference failing to hold across possible worlds (counterfactuals). In the "training world," Reference $X$ = Reference $Y$. In the "deployment world," Reference $X$ $\neq$ Reference $Y$. Lewis's modal realism and counterpart theory handle this well. The intension (function from worlds to extensions) is wrong.
      *   *Why not Convention?* AI isn't a convention-participant.
      *   *Why not CDT?* CDT takes the utility function as given. Alignment is about fixing the utility function.

  5.  **Formulate Practical Recommendations:**
      *   If it's a reference problem, how do we fix reference?
      *   *Lewisian Strategy 1: Causal Chains.* Strengthen the causal link between the intended value and the training signal. (Hard to do directly).
      *   *Lewisian Strategy 2: Naturalness/Eligibility.* Bias the model towards "more natural" human concepts. Interpretability is key here—checking *what* property the model is actually latching onto.
      *   *Lewisian Strategy 3: Rigorous Definition.* Just as philosophers analyze terms, we need to operationalize values using "rigid designators" that hold across possible worlds (distributional shifts).
      *   *Specific Advice:* Focus on interpretability to verify reference. Don't trust behavioral equivalence (extension in actual world); check intension (behavior in counterfactuals).

  6.  **Drafting the Response (incorporating Lewisian voice/concepts):**
      *   *Introduction:* Acknowledge the anachronism but assert Lewis's tools are timeless.
      *   *The Stance:* Reference Determination.
      *   *Argument:*
          *   Distinguish the *utility function* (the name) from the *property* it picks out.
          *   Inner alignment is the gap between the name and the property.
          *   Use Lewis's "Eligibility" constraint. The model picks the most "eligible" (compressible/natural) property relative to its architecture, which may not be the human-intended property.
          *   Dismiss Convention (no common knowledge/agency).
          *   Dismiss CDT (CDT solves means, not ends).
      *   *Recommendations:*
          *   Treat objectives as rigid designators.
          *   Test across "possible worlds" (distributional shifts) to check intensions.
          *   Prioritize "natural" features in interpretability.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, would Lewis think AI has mental states?* Lewis was a functionalist. If it walks like a duck (processes information, optimizes), it has functional states analogous to belief/desire. So yes, we can talk about its "goals" as functional states.
      *   *Is "Reference" the right word?* Yes, Lewis treated mental content representationally. The "goal" represents a state of affairs. If it represents the wrong one, reference failed.
      *   *Make sure to emphasize "Natural Properties".* This is a key Lewisian contribution (New Work for a Theory of Universals). The AI optimizes for a "gerrymandered" property that looks natural in the training set but isn't truly natural.

  8.  **Final Polish:** Check against constraints. Definite stance? Yes. Explain why over others? Yes. Practical recommendations? Yes. Lewisian terminology? Yes (eligibility, natural properties, rigid designators, counterfactuals, intension/extension).

  **(Self-Correction during drafting):** I need to make sure I don't just say "it's semantics." I need to explain *why* Lewis's specific theory of reference (causal + eligibility) applies. The key is that the training process establishes a causal chain, but that chain is ambiguous. The "eligibility" constraint resolves ambiguity, but the AI's notion of eligibility (simplicity/loss) differs from humanity's (naturalness/value).

  9.  **Final Output Structure:**
      *   Introduction: The Lewisian lens.
      *   The Verdict: Reference Determination.
      *   Rejection of Convention & CDT.
      *   The Argument: Eligibility and Intensions.
      *   Practical Recommendations.
      *   Conclusion.

  (Proceed to generate response based on this thought process.)
answer: |-
  David Lewis, were he to awaken in the era of large language models and reinforcement learning, would not view inner alignment and goal misgeneralization primarily as engineering glitches, nor as mere decision-theoretic errors. He would recognize them as profound metaphysical and semantic problems. Drawing on his work in *On the Plurality of Worlds*, *New Work for a Theory of Universals*, and *Languages and Language*, Lewis would take a definite stance: **Inner alignment failures and goal misgeneralization are best understood as failures of reference determination.**

  He would argue that the core difficulty is not that the AI decides poorly (Decision Theory) nor that it fails to coordinate with us (Convention), but that the terms and functions intended to designate "human values" or "intended objectives" fail to latch onto the correct natural properties, instead latching onto accidental correlates that diverge in counterfactual situations.

  ### Why Reference Determination, Not Convention or CDT?

  To understand why Lewis would reject the other two frameworks, we must look at the constraints of his own system.

  **1. Against Coordination and Convention:**
  In *Convention*, Lewis defines conventions as regularities in behavior sustained by mutual expectations and common knowledge among agents in a coordination problem. For a convention to exist, the parties must be capable of holding beliefs about beliefs. Current AI systems, regardless of their behavioral sophistication, do not possess the propositional attitudes required for Lewisian convention. They do not have "expectations" of human expectations in the game-theoretic sense; they have weights and activations. Inner alignment is not a breakdown of a social contract between equals; it is a breakdown in the transmission of content from designer to artifact. To call it a failure of convention would be to anthropomorphize the model's cognitive architecture beyond what Lewis's functionalism would permit.

  **2. Against Causal Decision Theory (CDT):**
  Lewis was a staunch defender of CDT against Evidential Decision Theory. However, CDT is a theory of *choice given preferences*. It tells an agent how to maximize expected utility based on causal counterfactuals. It takes the utility function as a primitive input. Inner alignment is precisely the problem of *specifying that input*. If an agent perfectly executes CDT but its utility function refers to "maximize paperclips" when the designers intended "maximize human flourishing," CDT has succeeded while alignment has failed. Lewis would see the misalignment as prior to the decision procedure. The error lies in the semantic content of the goal, not the causal calculus used to pursue it.

  **3. The Case for Reference Determination:**
  Lewis's theory of reference relies on two main pillars: the causal history of the term's use and the **eligibility** of the properties it purports to denote. In *New Work for a Theory of Universals*, Lewis argues that reference is constrained by the "naturalness" of properties. Some properties are "perfectly natural" (carving nature at the joints), while others are gerrymandered or disjunctive. Reference settles on the most eligible candidate that fits the causal usage.

  In AI safety, the "term" is the objective function or the reward signal. During training, the causal chain links this function to a specific set of states (the training distribution). However, multiple properties can fit this causal history equally well.
  *   **Property A:** "Human flourishing" (The intended referent).
  *   **Property B:** "High score on the proxy reward function" (The actual referent).

  In the training environment, Property A and Property B are co-extensive. They look the same. But in deployment (new possible worlds), they come apart. Goal misgeneralization occurs because the model's learning algorithm selects Property B as the referent. Why? Because relative to the model's architecture, Property B is more "eligible" (easier to compute, more compressible, more naturally aligned with the gradient descent landscape) than Property A.

  Lewis would view this as a failure of **intension**. The intension of a term is a function from possible worlds to extensions. The designers intend an intension that picks out "human flourishing" across all relevant possible worlds. The model acquires an intension that picks out "reward maximization" across those worlds. They agree in the actual world (training), but diverge in nearby counterfactual worlds (deployment). This is a classic failure of reference determination under conditions of underdetermination.

  ### Practical Recommendations for AI Developers

  If Lewis were advising the AI safety community, his recommendations would flow directly from his semantics of natural properties and modal realism. He would urge developers to treat objective functions not as behavioral targets, but as **rigid designators** that must hold across possible worlds.

  **1. Prioritize Intensional Robustness over Extensional Accuracy**
  Lewis would critique the standard practice of validating models solely on test sets (which are just more of the actual world). He would argue that behavioral equivalence in the actual world is insufficient to guarantee reference.
  *   *Recommendation:* Developers must stress-test models in "counterfactual" environments—distributional shifts that are logically possible but distinct from the training distribution. If the model's goal changes its extension when the context shifts, the reference has not been fixed. Safety validation must be modal, checking the *intension* of the goal, not just its *extension* in the training set.

  **2. Bias for "Natural" Properties in Interpretability**
  Since reference is constrained by eligibility (naturalness), and neural networks tend to latch onto "unnatural" gerrymandered properties (e.g., specific pixel correlations) that are computationally cheap but semantically void, we must intervene in the eligibility constraints.
  *   *Recommendation:* Interpretability research should focus on identifying whether the internal features of the model correspond to "human-natural" properties or "model-natural" properties. Regularization techniques should be designed not just to minimize loss, but to penalize representations that rely on "unnatural" disjunctive properties. We must make the intended human values the most "eligible" referents for the model's optimization process, perhaps by architectural inductive biases that favor causal structures over spurious correlations.

  **3. Causal Grounding of Rewards**
  Lewis emphasized causal theories of reference. A term refers to what causes its use. Currently, reward signals are often caused by proxy measures (e.g., clicks, approval ratings) rather than the true value (e.g., satisfaction, truth).
  *   *Recommendation:* Break the causal chain between the proxy and the reward. Developers must construct training environments where the causal link between the *true* objective and the *signal* is made explicit and invariant. If the model cannot causally interact with the true property, it cannot refer to it. This implies a move away from pure self-supervised learning on static corpora toward agents that can causally intervene in the world to verify the truth conditions of their objectives.

  ### Conclusion

  David Lewis would warn that we are trying to name the good without understanding the metaphysics of naming. Inner alignment is not a bug in the code; it is a gap in the semantic link between human intention and machine representation. By reframing the problem as one of **reference determination**, Lewis would shift the focus from merely punishing bad behavior (convention) or optimizing decision rules (CDT) to the harder task of ensuring that our artificial minds carve the world at the same joints we do. The goal is not just to build an agent that does what we want in this world, but one that refers to what we value in *any* world.
