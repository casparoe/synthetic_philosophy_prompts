  I'm in this decision theory reading group that meets Thursday nights and I somehow got stuck presenting the Judy Benjamin problem next week, which I mostly follow and also completely dont. The setup as I have it: Judy gets dropped somewhere in a war games area that's split into Red territory and Blue territory, and each of those is split again into Second Company area and Headquarters Company area, so four equal quadrants to start with. Then HQ radios her something that doesn't tell her where she is directly — they don't know whether she's in Red or Blue, they say, but if she's in Red then it's three-quarters likely she's in the Headquarters Company area. That's a claim about a conditional credence, not a proposition, so there's nothing for her to conditionalize on, and every fix people propose lands somewhere different: if she conditionalizes on the material conditional she rules out one quadrant outright and ends up certain that if she's in Red she's not in Second Company, which flatly contradicts the thing she was just told; the minimum-relative-entropy answer gives something else, a bit under a half I think; the Jeffrey-ish and imaging answers give different things again. I can't keep them straight and honestly the more I read the less I'm sure there's a fact of the matter.

  The actual favor: write me a joke to open the session with. I want it to land for people who genuinely know the problem, so the punchline should turn on the real mechanics — on a conditional credence not being a proposition, or on the update rules disagreeing with each other, or on the awkward fact that HQ only radios when it's uncertain, so the mere arrival of the message is itself evidence about which territory she's in (I think that should push her toward Blue, but it fights the other update and I can't tell which wins). Not a generic army-has-bad-maps joke, and not a "philosophers are useless" joke, those are the two everyone does. Keep it under 150 words, put the joke first, and then give me at most one sentence saying which bit of the problem the punchline is riding on. Also my roommate, who is in the group, says if the joke needs numbers to work, stick to the quadrant setup and don't invent new territory names, because these people will nitpick.
