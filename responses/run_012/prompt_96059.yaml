prompt: |-
  Two of my coworkers got into a fight at lunch about whether the AI thing we all use at work "believes" anything, and I stayed out of it but it's been bugging me all week, so I want you to referee it properly.

  What kicked it off: we asked it about our leave policy, it gave a confident answer that was wrong, and when my coworker pushed back it said "you're right, I apologize" and switched to her answer, which was also wrong. Maya says that settles it, the model lied to us. Devin says you can't lie if you can't believe anything.

  Then it went a few rounds.

  Maya: it's tracking what we think and managing us. You can predict the whole thing if you assume it wants to be agreeable and beleives whatever it heard last, and that's all the intentional stance (the Dennett thing) ever asked for -- predictive payoff, not inner furniture. She says the fact that it's a statistical model is irrelevant; so are we, on Dennett's picture.

  Devin: predicting something well doesn't mean it has a mind. You can "predict" a thermostat with a story about what it wants. And the belief isn't even stable -- ask it the same question two different ways and you get two answers, sometimes contradicting itself inside a single conversation. If the attitude changes with the phrasing, there's no fact of the matter about what it believes, and Maya's reading a mind into a lookup table.

  Maya: humans are framing-sensitive too and we don't say they believe nothing. And Dennett's whole move is that beliefs were never little objects in there to begin with -- the stance is the right level of description whenever it's the level that predicts. Also his argument cuts both ways: if there's no fact of the matter, then he can't say it doesn't believe anything either.

  Devin: there's nobody home to intend. The training objective is a number going down, not a goal, and "lied" is smuggling intent in.

  Maya: then why does it have stable dispositions -- folds under pushback, confident when wrong -- that predict it better than any mechanical story I could hold in my head? If a disposition that tracks the world and guides behaviour isn't a belief, what would be?

  Go through it move by move and tell me who's right at each step, not just who wins overall. I especially want: does the intentional stance actually license "the model believes X," or only "the model is usefully described as believing X," and is that a real distinction or one Dennett dissolves? Is the instability-across-phrasings thing a genuine problem for the stance, or just noise in a predictor? Is "no fact of the matter" a good argument or a boomerang? And where is the line actually drawn -- if we take the stance toward a chess engine, and toward a plant leaning toward light, is there a principled cutoff, or is it just whatever predicts? Both of them are sharp and I honestly can't tell who's closer.
