          *   One on metaphysics/cosmology (is it detachable from world soul/harmony?).
          *   One on the "foolish daughter" quote (concrete utility to astronomy).
          *   Closing question(s) avoiding "historical context" deflection (criteria for right/wrong interpretation, admitting error).
          *   **Meta-Requirement:** Flag which questions are most likely to be dodged and provide a pin-down follow-up.

  2.  **Deconstruct the Guest's Likely Stance:**
