prompt: |-
  I'm putting together a podcast episode with a historian of science who has spent years arguing that Kepler's astrology wasn't just a day job or a superstition he privately rolled his eyes at — she thinks it's a serious and fairly coherent part of his natural philosophy, and that the standard story (great astronomer, embarrassing side hustle) basically gets him wrong. I want questions that press on the content of that claim instead of letting her say "context!" four times and call it a day.

  Draft me eight to ten questions, with a follow-up for each one keyed to the answer she's most likely to give. I'd like at least:

  - one on the mechanism, if you can even call it that. My rough understanding is that Kepler thought the soul responds to the geometrical proportions between planets — the aspects — rather than to any physical push coming off the planets, which makes his astrology weirdly non-causal and hard to test. Press on why geometry of all things should move a soul, and what work the soul is doing that a physical influence couldn't.

  - one on what he actually cut from traditional astrology — houses, the meanings of the signs, the whole apparatus someone reading a normal horoscope around 1600 would expect — and what he kept and why. And whether what's left even deserves the name, or whether it's really a theory of temperament and weather wearing astrology's coat.

  - one on the empirical side. He made a lot of predictions, and plenty of them failed. Did he treat failures as refuting the art, as noise, or as evidence that only broad tendencies (temperament, weather, big historical events) are predictable and individuals aren't? How did he square that with his own empiricism in astronomy — it looks like a double standard from here, and I want her to have to deal with that.

  - one on whether the whole thing hangs on his cosmology and psychology — world soul, cosmic harmony, a soul that perceives proportion — and whether anything survives if you don't buy any of that. I want to know if the astrology is detachable from the metaphysics or if it's load-bearing.

  - one on the line he's famous for, where he calls astrology the foolish daughter of astronomy but still insists the mother can't manage without her. Don't let her just recite the line at me. I want to know what he thought the mother actually got from the daughter, concretely.

  Also give me a closing question or two that make it hard for her to end on "we should take historical actors on their own terms" — something that forces her to say what, specifically, would count as getting Kepler wrong versus getting him right, and whether she'd accept that he might have been both a great astronomer and simply mistaken about the stars' influence on us.

  Last thing: flag which of these she's most likely to dodge or answer with a deflection, and suggest the follow-up that would pin her down.
