      *   *Common Defense:* "It made sense *then*," "He was consistent," "Don't judge by modern standards."
      *   *Potential Weakness:* Avoiding the *truth value* or the *specific mechanics* that seem implausible even for the time. Avoiding the tension between his rigorous astronomy and his vague astrology.
      *   *Strategy:* Force specificity. Avoid "Why did he believe?" (leads to context). Ask "How does this work?" and "What happens when it doesn't?"

  3.  **Drafting the Questions (Iterative Process):**

