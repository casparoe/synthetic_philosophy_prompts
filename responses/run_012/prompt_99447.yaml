  ### The Fairness Trade-Off Tree

  **The Questions**
  *(Answer Yes or No to walk down the branches)*

  1.  **Should we stop using the score to decide who gets help entirely?**
  2.  **Would simply funding enough slots for every kid make this whole debate irrelevant?**
  3.  **Is the difference between groups just because we're measuring the wrong things?**
  4.  **Is the difference between groups caused by upstream systems punishing one group more?**
  5.  **Is it essential that a "70%" risk means the exact same thing for every group?**
  6.  **Is it essential that the rate of mistakes (missing kids or over-flagging) is identical for every group?**

  ***

  **The Leaves**
  *(The positions you end up at, with their awkward commitments)*

  **1. The Abolitionist** (Q1: Yes)
  *   **Commitment:** We must accept that some kids will go without help rather than use a tool that sorts them by group.
  *   *Note:* Rejects the premise of allocation entirely.

  **2. The Resource Expander** (Q1: No, Q2: Yes)
  *   **Commitment:** This is only a moral crisis because we refuse to pay for enough tutors for everyone.
  *   *Note:* **Scarcity Dependent.** This position dissolves if resources become abundant; it treats the math problem as a budget problem.

  **3. The Technical Optimist** (Q1: No, Q2: No, Q3: Yes)
  *   **Commitment:** The gap is a data error, and if we just find better features, the math will work out fairly.
  *   *Note:* **Hard to Separate from Leaf 4.** In practice, "fixing the data" often requires the same upstream changes as Leaf 4, making these distinct in theory but identical in labor.

  **4. The Structural Realist** (Q1: No, Q2: No, Q3: No, Q4: Yes)
  *   **Commitment:** The gap is real but manufactured by policy, so we must fix the punishment upstream before scoring downstream.
  *   *Note:* **Hard to Separate from Leaf 3.** Both require changing the input pipeline, differing only on whether the flaw is "noise" or "bias."

  **5. The Impossible Dream** (Q1: No, Q2: No, Q3: No, Q4: No, Q5: Yes, Q6: Yes)
  *   **Commitment:** We demand the score mean the same thing *and* miss the same share of kids, regardless of base rates.
  *   *Note:* **Empty Leaf (Mathematically Impossible).** When base rates differ, you cannot have Calibration (Q5) and Equalized Odds (Q6) simultaneously.

  **6. The Calibrationist** (Q1: No, Q2: No, Q3: No, Q4: No, Q5: Yes, Q6: No)
  *   **Commitment:** A 70% risk must be a 70% risk for everyone, even if it means missing more kids in the higher-risk group.
  *   *Note:* Accepts unequal error rates to preserve the literal meaning of the score.

  **7. The Error Balancer** (Q1: No, Q2: No, Q3: No, Q4: No, Q5: No, Q6: Yes)
  *   **Commitment:** We must miss the same share of kids in each group, even if a "70%" score means something different for each.
  *   *Note:* **Cost Flip:** If missing a kid costs more than a false alarm, this position absorbs that cost unevenly across groups to keep rates equal.

  **8. The Political Pragmatist** (Q1: No, Q2: No, Q3: No, Q4: No, Q5: No, Q6: No)
  *   **Commitment:** The trade-off between accuracy and equality is a value judgment that the community, not the math, must vote on.
  *   *Note:* **Who Decides:** Explicitly places the authority to weigh error costs (Prompt b) in human hands rather than algorithmic constraints (Prompt c).
