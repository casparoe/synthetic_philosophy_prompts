      *   *The Philosophical View:* Gongsun Long isn't making a biological claim; he's making a semantic/ontological claim about *names* (ming) and *actualities* (shi).
      *   *Key Distinction:* The compound term "white horse" vs. the simple term "horse".
      *   *The Argument:*
          1.  "Horse" names the shape/form.
          2.  "White" names the color.
          3.  "White horse" names shape + color.
          4.  Therefore, the concept "white horse" is not identical to the concept "horse".
      *   *Is "is" identity or predication?* In English (and Greek), "is" is ambiguous. In Classical Chinese, the copula is different (often omitted or uses *fei* 非 for "is not"). *Fei* often means "is not the same as" rather than "is not a member of."

  3.  **Address the "Logic is Western" Claim (Sister's Point):**
