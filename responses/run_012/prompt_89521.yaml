      *   **Policy Conclusion:** The leap from "machines have limits" to "fund humans specifically" is weak if humans share those limits. However, the weaker claim (humans + machines is better than machines alone) is defensible. Condition: Policy advice must be framed as precautionary, not deductive certainty.
      *   **Public Engagement (The Museum/Schools Claim):**
          *   Claim: "truths that no method whatsoever can ever prove."
