answer: |-
  Here is a complete design for a 90-minute seminar activity titled **"The Constitutional Convention."** It is engineered to make Arrow's conditions feel like practical constraints that break their own solutions, rather than abstract mathematical premises.

  ### Activity Overview
  **Title:** The Constitutional Convention
  **Goal:** Students design a voting rule to satisfy three fairness criteria. They will test it, find it violates one criterion, patch it, and find the patch violates another.
  **The Trap:** They will likely choose **Borda Count** (seems fair/mathematical) or **Plurality Runoff** (seems democratic). Both violate **Independence of Irrelevant Alternatives (IIA)**. When they try to switch to **Pairwise Majority** to fix IIA, they will encounter a **Condorcet Cycle**. To resolve the cycle, they must empower an **Agenda Setter**, effectively creating a **Dictator**.
  **Secret:** Do not mention Arrow, Impossibility, or IIA by name until the final 10 minutes.

  ---

  ### 1. Materials & Preference Profile
  You need 16 students. Divide them into **3 Factions** (seating groups). Give each faction a card with their identical preference ordering.

  **The Profile (The "Spoiler" Setup):**
  *   **Faction 1 (6 students):** A > B > C
  *   **Faction 2 (5 students):** B > C > A
  *   **Faction 3 (5 students):** C > A > B
  *   **Total:** 16 Students.

  **The Options (Contextualized):**
  Tell them the department is choosing a **Final Assessment Format**.
  *   **A:** Traditional Research Paper
  *   **B:** Group Presentation
  *   **C:** Creative Portfolio
  *   **D:** Take-Home Exam (Introduced in Round 2 as a "compromise" option)

  **Handouts:**
  1.  **Faction Cards:** With their specific ranking.
  2.  **Score Sheets:** Pre-formatted tables for Borda calculations (to save time).
  3.  **The Constitution:** A blank sheet where they write their agreed-upon rule.

  ---

  ### 2. Timeline (90 Minutes)

  **0:00 – 0:10: Setup & Axiom Elicitation**
  *   **Hook:** "You are the curriculum committee. You need a rule to choose the final project format. You cannot just vote once; you must design the *machine* that counts the votes."
  *   **Elicit Axioms:** Ask them what makes a rule "fair." Write these on the board, but translate them into plain English (do not use technical terms yet):
      1.  **Unanimity:** "If everyone prefers A over B, the group should prefer A over B."
      2.  **No Dictator:** "No single student's preference should automatically become the group's preference."
      3.  **Consistency (IIA):** "If the group prefers A over B, adding a new option C shouldn't suddenly make the group prefer B over A, unless someone changed their mind about A vs B."

  **0:10 – 0:25: Drafting the Constitution**
  *   In factions, they propose rules. Bring them back to plenary.
  *   **Predictable Outcome:** They will likely propose **Borda Count** (assign points: 1st=3, 2nd=2, 3rd=1) because it uses all information, or **Plurality Runoff**.
  *   *Instructor Move:* If they suggest Pairwise Majority, let them, but steer them toward Borda by noting Pairwise can be "messy" with ties. We want them to commit to a scoring rule first to feel the IIA sting.
  *   **Commit:** Have them write the rule on the "Constitution" sheet and sign it.

  **0:25 – 0:40: Round 1 (The Baseline)**
  *   Options: A, B, C only.
  *   Students calculate scores on the handout (provide the math template).
  *   **Result:**
      *   A: $6(3) + 5(1) + 5(2) = 18 + 5 + 10 = 33$
      *   B: $6(2) + 5(3) + 5(1) = 12 + 15 + 5 = 32$
      *   C: $6(1) + 5(2) + 5(3) = 6 + 10 + 15 = 31$
      *   **Winner: A (Research Paper).**
  *   **Check:** Does this violate Unanimity? No. Dictatorship? No. Consistency? Seems fine.

  **0:40 – 0:55: Round 2 (The Constitutional Review)**
  *   **The Twist:** "A student representative suggests adding Option D (Take-Home Exam) to the ballot to ensure we have a backup. No one changes their mind about A, B, or C. D is just added to the list."
  *   **New Preferences:**
      *   Faction 1: A > B > **D** > C  *(D inserted as a 'safe' option)*
      *   Faction 2: B > C > **D** > A  *(D inserted as better than A)*
      *   Faction 3: C > **D** > A > B  *(D inserted as better than A & B)*
      *   *Note:* You must dictate where D goes. Tell them: "D is a compromise. It ranks above the 'riskiest' option for each faction but below their favorite."
  *   **Recalculate (4 options, points 4, 3, 2, 1):**
      *   A: $6(4) + 5(1) + 5(2) = 24 + 5 + 10 = 39$
      *   B: $6(3) + 5(4) + 5(1) = 18 + 20 + 5 = 43$
      *   C: $6(1) + 5(3) + 5(4) = 6 + 15 + 20 = 41$
      *   D: $6(2) + 5(2) + 5(3) = 12 + 10 + 15 = 37$
      *   **Winner: B (Group Presentation).**
  *   **The Confrontation:** "Wait. Option D lost. Nobody wants D. But adding D changed the winner from A to B. Did anyone change their mind about A vs B?" (No). "Does this violate your Consistency axiom?" (Yes).

  **0:55 – 1:10: The Patch (Trying to fix IIA)**
  *   Students will realize Borda is broken. They will panic.
  *   **New Proposal:** They will likely switch to **Pairwise Majority** (Condorcet) because it respects A vs B regardless of C or D.
  *   **Test Pairwise on Original Profile (A, B, C):**
      *   A vs B: 11 prefer A, 5 prefer B. (A wins)
      *   B vs C: 11 prefer B, 5 prefer C. (B wins)
      *   C vs A: 10 prefer C, 6 prefer A. (C wins)
      *   **Result:** A > B > C > A. **A Cycle.**
  *   **The Crisis:** "Your rule produces no winner. It's intransitive. You need a tie-breaker."

  **1:10 – 1:20: The Dictator Trap**
  *   Ask: "How do we break the cycle?"
  *   Suggestions: "Flip a coin," "Chair decides," "Vote on the order."
  *   **The Agenda:** Propose sequential voting. "We vote on A vs B first. Winner faces C."
  *   **Run it:**
      *   Order 1 (A vs B, then Winner vs C): A beats B. C beats A. **Winner C.**
      *   Order 2 (B vs C, then Winner vs A): B beats C. A beats B. **Winner A.**
      *   Order 3 (C vs A, then Winner vs B): C beats A. B beats C. **Winner B.**
  *   **The Realization:** The person who sets the voting order (the Agenda Setter) determines the winner.
  *   **Ask:** "Is the Agenda Setter a Dictator?" (Effectively, yes. Their preference for the *procedure* dictates the *outcome* regardless of voter preferences).
  *   **Conclusion:** They have to choose: Keep Borda (Violates Consistency/IIA) or Keep Pairwise (Violates Transitivity/Requires Dictator).

  **1:20 – 1:30: Debrief & The Reveal**
  *   Reveal **Arrow's Impossibility Theorem**.
  *   Map their experience to the axioms:
      *   Round 1 & 2 = **IIA Violation**.
      *   Round 3 = **Transitivity Violation**.
      *   Round 4 = **Non-Dictatorship Violation**.
  *   **Key Takeaway:** "You didn't make a mistake. The math says you couldn't have succeeded."

  ---

  ### 3. Predicted Failures & Mitigations

  **Failure 1: "The Profile is Unrealistic"**
  *   *What happens:* Students argue that no one would rank options the way the cards say (e.g., "Why would Faction 2 prefer C over A?").
  *   *Mitigation:* Shut this down early. "In social choice, we assume preferences are exogenous. We are testing the *rule*, not the voters. Treat the cards as data."

  **Failure 2: "Let's Just Discuss Until Consensus"**
  *   *What happens:* They try to bypass voting by talking.
  *   *Mitigation:* "You are designing a rule for 10,000 voters who cannot talk to each other. Deliberation is not a voting rule."

  **Failure 3: Math Errors**
  *   *What happens:* They miscalculate Borda scores and miss the IIA flip.
  *   *Mitigation:* Provide the score sheets with the formulas pre-filled. Walk around during Round 2 and verify the sums before announcing the winner.

  **Failure 4: They Accept the IIA Violation**
  *   *What happens:* They say, "So B changed the score, big deal. B won fair and square."
  *   *Mitigation:* Press the ethical angle. "If A was the honest winner, and adding a loser D stole the election for B, is the system manipulable? If I know D will lose, can I introduce D just to kill A?" (This introduces **Strategic Voting**, which reinforces why IIA matters).

  ---

  ### 4. What This Activity Cannot Reproduce
  Be straight with yourself about the limitations:

  1.  **The General Proof:** This shows *specific* rules fail. It does not prove *all* possible rules fail. You must explicitly state: "Arrow proved that *any* rule you could invent, even one we haven't thought of, will hit one of these walls."
  2.  **The Induction (n voters):** Arrow's theorem holds for $n \ge 3$ alternatives and $m \ge 2$ voters. This activity uses 16 voters. It doesn't demonstrate that the problem persists even with millions of voters, though you can mention it.
  3.  **Domain Restrictions:** It doesn't explore *Single-Peaked Preferences* (which can escape Arrow's trap). If a sharp student asks, "What if our preferences were single-peaked?", acknowledge it: "Yes, then Majority Rule works. But Arrow assumes *no* restrictions on preferences. In a free society, people can have weird preferences."

  ---

  ### 5. Where This Design Is Most Likely to Fail
  **The "So What?" Moment.**
  The lesson fails if students leave thinking, "Voting is broken, let's just use Borda anyway."
  *   **Risk:** They view the axioms as academic nitpicking rather than democratic essentials.
  *   **Fix:** In the debrief, emphasize **Manipulability**. IIA isn't just math; it's about **spoilers**. If a rule violates IIA, it allows bad-faith actors to introduce "clone" candidates to steal elections. That makes the theorem about *power*, not just logic.

  ### 6. When to Scrap and Rebuild
  If you run this and **they do not feel the tension**, scrap it.
  *   **Signal:** If, during Round 2 (The IIA violation), the class shrugs and says, "Okay, B won, move on," the activity has failed.
  *   **Diagnostic:** Did you sell the "Consistency" axiom in the first 10 minutes? If they don't believe that "adding a loser shouldn't change the winner," the rest is noise.
  *   **Correction:** If this happens, stop the game. Switch to a **Strategic Voting** demo. Show them how Faction 1 can lie about their preferences in Borda to make A win even with D present. If they care about *winning*, they will care about the rule's flaws.

  ### Instructor Script for the "Reveal" (Last 5 Minutes)
  *"Today you acted as constitutional designers. You wanted Unanimity. You wanted No Dictators. You wanted Consistency. You found that satisfying any two forces you to violate the third. In 1951, Kenneth Arrow proved this wasn't just bad luck with the rules you picked. He proved it is mathematically impossible to satisfy all three for any ranked voting system. This isn't a bug in our democracy; it's a feature of aggregation. The question for the rest of the course is: Which axiom are we willing to sacrifice?"*
