prompt: |-
  OK so I'm a software engineer, no philosophy background at all, and I need help reading my old team lead. Her name's Dana, ex-physics PhD, now a staff data scientist, and she reviews every model our team ships. She's got this whole shtick she calls the Friedman thing — a model's assumptions don't have to be realistic, only its predictions do. Then she turns around and kills half our models for having unrealistic assumptions, and I've thought about this alot and still can never predict which way she'll go. Here's her track record from about eight reviews, as best I remember it:

  - Ballistics model for a little in-house game. Ignores air resistance entirely. She approved it — at those speeds the drag is a rounding error and nobody could tell.
  - Puzzle game model that treats the player as computing the optimal move every turn. Approved. She called it the billiard player example, some economist's thing. Players obviously don't do the math, but their moves come out right.
  - Server capacity plan that assumes all users are identical. Approved, for a rough sizing number.
  - Churn forecast that assumes users make their decisions independently of each other, no word of mouth. Approved for a one-month horizon — the spillover is small next to the noise.
  - Revenue forecast that assumes every user knows every plan we sell and picks the cheapest one that fits. Approved, as a forecast. Almost nobody looks at the pricing page, but the people who do are what moves the number, and the fit was good.
  - Model that assumes all traders in our marketplace have the same information, which we wanted to use to explain a big price swing. Rejected. She said that assumption is the thing we're trying to explain.
  - Model that assumes people's preferences don't change, which we wanted to use to predict how they'd react to a product category we've never sold. Rejected, though I think mostly because we had nothing to backtest it against.
  - Model that assumes ad spend turns into signups linearly. It fit our historical range great. Rejected for setting the budget. Her point: we know it saturates, and the saturation is exactly what you're buying with the next million dollars. Though honestly we'd never spent anywhere near what that decision was about, so maybe that's what actually bothered her.

  New case. Our new revenue model assumes every user knows about every feature the day it ships and evaluates it right away. Obviously false — most users never find half our features. But it backtests better than anything we've ever had, three years of data, and it beat our old model by a lot on holdout. The fit comes from a weird place: it thinks awareness of feature X is universal, so it predicts very low per-user usage of X, and the two errors cancel out in the total. Two possible uses: (a) next year's revenue forecast for the board, at our current prices and lineup; (b) deciding whether to build a new pricing tier that only pays off if people actually notice it, which is a big investment.

  So: what does Dana say? I'd like (1) the rules she could be running that fit all eight calls above, and what each one predicts about (a) and (b); (2) your best guess at her actual verdict on each, and why; (3) which of the precedents above is the closest match to this new case; and (4) the case I should bring her next that would split those rules apart, where they'd give different answers and I could tell which one she's really on. Don't worry about reading lists or citations, I'm not going to look any of that up, just give me the reasoning. American English please, and skip the philosophy jargon where you can, I'm definately not going to understand it.
