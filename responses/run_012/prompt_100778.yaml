  2. Historical episodes where collapse is driven primarily by exogenous shocks like climate change or plague rather than internal erosion of legitimacy suggest the dynamic is not inherent to social complexity. This is settled among climate historians but contested by structuralists, and a defender would wave it away by arguing shocks only succeed because internal fragility already exists.
  3. The linear accumulation of technological and administrative capacity makes total fracture increasingly costly and unlikely, transforming cyclical collapse into linear stagnation or transformation instead. This is a core tenet of modernization theory but contested among economists and historians, which a defender would take as a hit requiring them to redefine what counts as fracture.
  4. Attributing all variance in timing and severity to local contingencies makes the mechanism unfalsifiable because any deviation is explained away rather than predicted, rendering the cycle descriptive rather than causal. This is settled in philosophy of science but contested among historians who prioritize narrative over law, and a defender would wave this away as necessary complexity.
  5. Your position has been qualified into unfalsifiability by the contingency clause, which is a defect for a causal claim but may be the price of any large-scale historical heuristic. This is genuinely contested between positivists and interpretivists, and while a defender would wave away the defect charge, you must concede this limits predictive power.
