  The **3%** reflects the immense weight of term **(f)** (Metaphysical Simplicity/LNC) combined with **(d)** (Instrumentalism). The term doing the most work is **(d)**: because you can solve the logical problems of inconsistency without accepting the metaphysical reality of gluts, the motivation for dialetheism collapses from "necessary" to "optional." The term I would bet against is **(a)**; I suspect future work in hierarchical or contextualist truth theories will defuse the Liar without requiring true contradictions more effectively than current glut theories do.

  **The Argument That Would Move Me**
  A rigorous proof that **all** consistent or gappy solutions to the semantic paradoxes inevitably generate "revenge paradoxes" that *only* a dialetheic framework can absorb uniformly. If Priest's claim that dialetheism is the *only* non-ad-hoc solution to the full hierarchy of revenge paradoxes were demonstrably proven, my credence would jump to **40%**.

  **Logic vs. Metaphysics**
  **80% of this debate is metaphysics.** Logic is merely the calculus we use to model the territory; the disagreement is not about which rules of inference are valid, but about the nature of truth and reality itself. Dialetheists are not proposing a new game of symbols; they are claiming the world (or our truth predicates) literally contains contradictions, which is a metaphysical claim disguised as a logical one.
