  **(e) Meaning-Change Objection Sinks the Project**
  **Credence: 40%**
  If negation is defined by exclusion, dialetheic negation is not negation, but if defined by truth-conditions, it survives, making this a serious verbal dispute rather than a fatal flaw.

  **(f) The "Whatever Else" (Metaphysical Simplicity)**
  **Credence Impact: Massive Penalty**
  The Law of Non-Contradiction is a transcendental precondition for intelligible assertion, imposing an overwhelming prior probability against any view that violates it.

