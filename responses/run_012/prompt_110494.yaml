      *   *Initial thought:* Weber is a relativist.
      *   *Correction:* No, he's a realist about historical causation. He believes we can know causes objectively, but the *selection* of causes is value-laden. I need to make sure I don't paint him as a postmodernist.

  10. **Final Polish:** Ensure the language bridges the gap between "lab scientist" (interventions, randomization) and "Weberian" (meaning, orientation, ideal types). Use the user's vocabulary to explain Weber's divergence.

  *(Self-Correction on "Flagging Extrapolation"):* I need to make sure I don't just say "Weber would say." I need to say "Based on his commitment to X, he would infer Y." This distinguishes textual evidence from reconstruction.

  *(Final check on the "Values" question):* This is the trickiest. The scientist asks if values explain or redescribe. Weber says they explain *social* action, but not *organic* behavior. I must make that distinction clear. Values are causes *sui generis* in the cultural realm.

