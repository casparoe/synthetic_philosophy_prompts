      *   *Is it changing the subject?* Skolem would say yes. You've moved from "what can be formalized" to "what can be intuited."
      *   *Is it begging the question?* This is the crux. SOL semantics assumes a domain of *all* subsets. If you ask "which subsets?", you need a set theory.

  5.  **Evaluate the Internal/External Distinction Itself:**
      *   Does it earn its keep? Yes, it prevents logical contradictions (like thinking $M$ is both countable and uncountable *in the same sense*).
      *   Does it just relabel? It clarifies the *mechanism*, but doesn't settle the *philosophical* dispute about whether the "External" view is privileged.

  6.  **Evaluate the Second-Order Circularity Objection:**
