answer: |-
  You've stumbled upon one of the most famous headaches in contemporary philosophy: **Fitch's Paradox of Knowability**. Your mate's argument is valid within standard classical logic and epistemic modal logic. It is not a trick; the derivation holds water.

  The conclusion—that if all truths are knowable, then all truths are *known*—is indeed mad. It implies omniscience. Since we clearly aren't omniscient, something in the chain has to break. You've asked to keep (1) the Knowability Principle and (5) Factivity if possible. I'm afraid I have to give you some bad news first: you cannot keep (1) *exactly as stated*, keep (5), and keep classical logic. One of those three must budge.

  However, there are ways to keep the *spirit* of (1) without collapsing into absurdity. Here is the breakdown of the escape routes, the price of each, and my recommendation on which way to jump.

  ### 1. The Logic Route: Go Intuitionistic
  **What you reject:** Classical Logic (specifically, the equivalence between 'not all truths are unknown' and 'all truths are known').

  **Why it looked fine:** We usually assume that if it's false that 'there exists an unknown truth', then it must be true that 'all truths are known'. This relies on the Law of Double Negation.

  **The Cost:** You have to adopt intuitionistic logic. In this system, the paradox still proves that 'It is not the case that there are unknown truths', but it *does not* prove 'All truths are known'.
  *   **Pros:** You keep the Knowability Principle (1) and Factivity (5) intact.
  *   **Cons:** It's a heavy lift. You lose the ability to assert that unknown truths *exist*, even though you don't have to admit they *don't* exist. You end up in a position where you can't claim there are secrets in the universe, but you also don't claim we know everything. It's a subtle, quietist position famously defended by Michael Dummett.

  ### 2. The Principle Route: Restrict Knowability (The Tennant Solution)
  **What you reject:** The unrestricted scope of (1).

  **Why it looked fine:** (1) says 'Every truth is knowable'. It seems universal.

  **The Cost:** You modify (1) to say: 'Every *Cartesian* truth is knowable'. A 'Cartesian' proposition is one where it is not self-contradictory to suppose it is known.
  *   **The Move:** The argument proves that the conjunction ($p$ and nobody knows $p$) is *inherently* unknowable. Therefore, it is not a Cartesian proposition. Therefore, the Knowability Principle simply doesn't apply to it.
  *   **Pros:** This is often seen as the most sensible fix for anti-realists. It preserves the idea that truth is tied to evidence, without forcing omniscience. It treats the Fitch conjunction as a logical anomaly, like a division by zero, rather than a genuine counter-example to knowability.
  *   **Cons:** It can feel a bit *ad hoc*. Critics argue you're rigging the definition of 'truth' to save the theory. You have to accept that some truths (like the Fitch conjunction) are permanently excluded from the realm of the knowable.

  ### 3. The Factivity Route: Give Up (5)
  **What you reject:** The idea that knowledge implies truth.

  **Why it looked fine:** It seems definitional. You can't know something that isn't so.

  **The Cost:** This is generally considered a non-starter. If knowledge isn't factive, it's just belief. There are non-factive theories of knowledge (some contextualists or pragmatists might flirt with them), but the cost is too high for most. You'd have to rewrite the entire epistemology textbook. I would strongly advise against this.

  ### 4. The Distribution Route: Knowledge doesn't distribute over conjunctions
  **What you reject:** Step (4), that knowing ($A$ and $B$) implies knowing $A$ and knowing $B$.

  **Why it looked fine:** It seems obvious. If I know 'it is raining and cold', I know it is raining.

  **The Cost:** This relies on a principle of 'logical omniscience'. In the real world, people are bad at logic. However, the paradox uses 'knowable *in principle*'. In principle, if you know a conjunction, you *can* deduce the parts. Denying this weakens the concept of knowledge so much it becomes unrecognisable. This is usually the weakest escape route.

  ### My Recommendation

  Since you want to hold on to the Knowability Principle and Factivity, you have two real contenders: **Intuitionism** or **Restriction**.

  If I were in your shoes, I would take the **Restriction Route (Option 2)**, often associated with the philosopher Neil Tennant.

  **Why?**
  Changing the fundamental laws of logic (Option 1) is a nuclear option. It affects mathematics, science, and everyday reasoning, not just epistemology. Restricting the Knowability Principle is more surgical.

  You can tell your mate:
  > "The Knowability Principle only applies to propositions that *can* consistently be known. Your conjunction ('$p$ is true and nobody knows it') is a logical paradox similar to the Liar Paradox. It's not a genuine truth-bearer in the context of knowledge. So, (1) remains true for all ordinary truths (like the cat on the mat), but it doesn't apply to self-defeating statements about knowledge itself."

  **The Price You Pay:**
  You must admit that there are some true statements (specifically those involving the operator 'nobody knows') that are *in principle* unknowable. You sacrifice the universality of (1) to save its plausibility. You accept that the concept of 'truth' is slightly larger than the concept of 'knowable truth', but only in these very specific, weird logical cases.

  **Summary:**
  The argument is valid. To avoid the madness of omniscience whilst keeping Factivity, you must restrict the Knowability Principle. Admit that the specific conjunction your mate constructed is a 'blind spot'—a truth that is logically barred from being known—rather than a refutation of knowability itself. It's the cheapest price for a sane worldview.
