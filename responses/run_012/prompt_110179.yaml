prompt: |-
  I'm a PhD student in philosophy working on applied epistemology, and my supervisor and I have fallen into a ritual: I bring her a case, she rules on whether it is or is not an epistemic injustice, and I log the verdict. The record so far: (1) a Black woman whose reports of her own pain are discounted by clinicians, in a pattern that tracks the well-documented stereotype about pain tolerance — injustice; (2) a woman in a workplace where the concept of sexual harassment is simply not in circulation, so that she cannot make sense of what is being done to her and is treated as oversensitive — injustice; (3) a job candidate with a mobility disability whose account of her own capacity to do the job is treated by the hiring panel as wishful thinking — injustice; (4) residents of an industrial district whose reports of illness are treated by the public health agency as anecdote while instrument readings are treated as data, in a district whose residents have long been shut out of the relevant expert forums — injustice; (5) a patient who does not mention a symptom to her doctor because experience has taught her that reports like hers are not taken up — injustice; (6) a customer lied to by a used-car dealer about whether the car had been in a crash — not an injustice; (7) a student whose answer is marked down for a technical error in her argument, by a marker with no view about who she is — not an injustice; (8) a patient with a condition that medicine has not yet characterized, whose doctors believe every word she says but can tell her nothing — not an injustice. Our reading group has spent the term on the non-testimonial varieties — hermeneutical injustice, contributory injustice, willful hermeneutical ignorance, epistemic exploitation — and she has been resisting the thought that these constitute a single family. I still cannot tell what her operative criterion is.

  Next week I have to present a case of my own, and I want to forecast her verdict before I commit to an interpretation in front of the department. The case: a large hospital system replaces its paper pain-assessment form with a triage tool. Patients type a free-text description of their pain, the tool returns a 0–10 priority score, and the triage nurse works from the score. An internal audit finds that the tool systematically returns lower scores for descriptions that are metaphorical and narrative ("it feels like my chest is being wrung out") than for descriptions that are clinical and terse ("sharp pain, left side, 8/10"), even where the underlying conditions match — and the same patient is scored differently depending on how she happens to put it, so the disparity tracks a manner of speaking rather than any social group. The gap is a training artifact: the corpus the tool learned from associated terse clinical phrasing with the cases that were escalated. Nobody at the hospital believes anything disparaging about anyone. The consequence is that patients who describe their pain in the narrative register wait longer and are treated less aggressively, and because the score is treated as an objective measurement, a patient who says the number is wrong is told that the number is the standard.

  Tell me what she will say. I care less about the verdict itself than about the rules her record is compatible with: state each criterion that fits all eight verdicts equally well, say what each predicts about my case, give me your best guess at her actual ruling with the reasons for preferring it, and name the further case that would separate the surviving rules. Also tell me which candidate criteria her record already eliminates, and which verdict does the eliminating. Please return this as a single JSON object with exactly these fields:

  {
    "surviving_rules": [
      {
        "rule": "one sentence stating the criterion she appears to be applying",
        "fit_with_record": "how it accommodates each of the eight verdicts, flagging any it strains to explain",
        "prediction_for_new_case": "injustice" | "not an injustice" | "indeterminate",
        "reason_for_prediction": "one or two sentences"
      }
    ],
    "eliminated_rules": [
      {
        "rule": "one sentence",
        "eliminated_by": "the verdict that rules it out and why"
      }
    ],
    "best_guess": {
      "verdict": "injustice" | "not an injustice",
      "confidence": "low" | "moderate" | "high",
      "reasoning": "the case for this over the alternatives"
    },
    "discriminating_case": {
      "description": "a case short enough to state in a few sentences",
      "predictions": [
        {
          "rule": "the surviving rule",
          "prediction": "what that rule says about the discriminating case"
        }
      ]
    }
  }
