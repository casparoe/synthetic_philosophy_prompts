  | Trust Element | Environmental Analogue | Status |
  | :--- | :--- | :--- |
  | **Settlor** | Nature / Past Generations / God | **Empty** (No legal intent) |
  | **Trustee** | Current Generation | **Occupied** (But conflicted) |
  | **Beneficiary** | Future Generations | **Defective** (Unascertained class) |
  | **Corpus** | Natural Capital Stock | **Mismatched** (Non-fungible/thresholds) |
  | **Income** | Renewable Yield / Services | **Mismatched** (Indistinguishable from stock) |

  **Empty Slots and Imported Assumptions**
  The **Settlor** slot has no honest occupant. A trust requires a settlor with specific intent to define what constitutes "principal" versus "income." Nature has no intent; past generations left no deed. Consequently, the metaphor quietly imports **fiduciary enforceability** and **accounting strictness** without the legal machinery to define or enforce them. It assumes a pre-existing definition of "natural capital" that trust law would require the settlor to provide.

  **Assessment of Trust Features**
  1.  **Bar on Self-Dealing:** In trust law, trustees cannot profit from the trust. Here, the trustees *are* the current income beneficiaries. Survival requires consumption. The prohibition on self-dealing collapses because the structural conflict is inherent to existence, not a breach of duty.
  2.  **Duty of Impartiality:** Trustees must balance income beneficiaries (current) against remainder beneficiaries (future). Without a settlor's intent to specify a discount rate or substitution elasticity, this impartiality is mathematically indeterminate.
  3.  **Enforceability:** Trusts rely on courts and beneficiary standing. Future generations cannot sue; no court has jurisdiction over global natural capital. The duty is hortatory, not legal.
  4.  **Duration:** The common law Rule Against Perpetuities voids private trusts lasting forever. While public trusts evade this, they grant sovereigns discretion, not strict depletion bans. An infinite horizon violates the temporal limits underpinning trust accounting.

  **Weight-Bearing vs. Picturesque Mismatches**
  The lack of a **Settlor** is not merely picturesque; it is load-bearing. Without settlor intent, the distinction between "depletable stock" and "sustainable income" is a political choice, not a fiduciary boundary. Similarly, the lack of **Enforceability** is weight-bearing; a duty without a remedy is not a constraint. The **Self-Dealing** conflict is also structural; you cannot forbid the trustee from eating when eating is the condition of their agency.

  **Rebuilding the Conclusion**
  The no-net-depletion conclusion cannot be rebuilt on the surviving parts of the trust metaphor. The metaphor obscures the normative work required to define *which* capital must be preserved. It attempts to derive a substantive constraint (no depletion) from a procedural form (trusteeship) that lacks the necessary definitions and enforcement mechanisms.

  **Better Analogy**
  **Constitutional Pre-commitment.** Rather than property law, the structure resembles a constitutional entrenchment of basic ecological conditions necessary for agency. Current generations bind their own legislative majorities to preserve critical thresholds, not because they are trustees of an owner's property, but because they are co-authors of a political order that must remain viable for future co-authors. This shifts the justification from fiduciary duty to democratic legitimacy and conditions of possibility.

  Verdict: FAILS — Legal architecture collapses; normative work requires political theory, not property metaphors.
