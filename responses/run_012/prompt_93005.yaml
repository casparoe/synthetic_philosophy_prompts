answer: |-
  Your frustration is well-founded. The slogan "the monarch reigns but does not rule" is often used as a rhetorical shield to block scrutiny of the monarch's actual powers. In a Westminster-style constitutional monarchy (like the UK, Canada, or Australia), the statement is not a single fact but a composite of three distinct claims that operate on different levels of the political system.

  To resolve the debate, you need to separate the **Legal** (what the text says), the **Conventional** (what the unwritten rules say), and the **Political** (where actual agency lies).

  Here is the menu of readings, evaluated for truth and utility.

  ### 1. The Legal-Formal Reading
  **The Claim:** *The monarch possesses no legal authority to initiate, veto, or alter legislation and executive action.*

  *   **What it amounts to in practice:** This reading suggests that if you opened the law books, you would find the monarch has no statutory power to stop a bill or fire a minister.
  *   **Evaluation:** **Simply False.**
      *   In most constitutional monarchies, the "Crown" is still the legal source of executive authority. Bills do not become law until the monarch (or Governor-General) grants **Royal Assent**. The monarch legally appoints the Prime Minister and dissolves Parliament.
      *   If a monarch *did* refuse assent, the courts would generally be bound to recognize that refusal as legally valid, even if it caused a political crisis. The legal machinery of the state is still keyed to the monarch's signature.
  *   **Debate Utility:** **None.** If your opponents use this reading, they are factually incorrect. A bill *does* require the monarch's formal assent to become law.

  ### 2. The Conventional Reading
  **The Claim:** *The monarch possesses legal authority but is bound by binding constitutional conventions to exercise it only on the advice of elected ministers.*

  *   **What it amounts to in practice:** This acknowledges the legal powers exist but argues they are "fossilized." The monarch *can* sign or refuse, but the unwritten rules of the constitution dictate they *must* sign whatever the Prime Minister puts in front of them. To act otherwise would be "unconstitutional" (in the conventional sense), even if it is "legal" (in the statutory sense).
  *   **Evaluation:** **Substantive and Defensible (with caveats).**
      *   This is the strongest version of the slogan. It accurately describes the daily operation of the state. Ministers take responsibility; the monarch remains neutral.
      *   **The Caveat (The "Refusal" Question):** This reading becomes complicated during a constitutional crisis. Conventions are not laws; they cannot be enforced by courts. There is a grey area known as **Reserve Powers**. Most constitutional scholars agree that in extreme scenarios (e.g., a Prime Minister trying to govern after losing an election, or attempting to abolish democracy), the monarch *might* be conventionally justified in refusing advice.
      *   Therefore, the claim "the monarch *cannot* refuse" is false; the claim "the monarch *should not* refuse except in extreme emergencies" is defensible.
  *   **Debate Utility:** **High.** This is the actual argument. It admits the legal power exists but argues the *constraint* is robust enough to prevent abuse.

  ### 3. The Political-Practical Reading
  **The Claim:** *The monarch exercises no independent political agency and bears no political responsibility for state outcomes.*

  *   **What it amounts to in practice:** This defines "ruling" not as signing papers, but as making policy choices and facing the consequences. Since the monarch cannot be voted out, criticized in parliament, or sued for policy decisions (Crown immunity), they do not "rule" in the sense of governing. They are a "dignified" part of the constitution (in Walter Bagehot's terms), while the ministers are the "efficient" part.
  *   **Evaluation:** **Substantive and Defensible.**
      *   In practice, the monarch does not set the budget, declare war, or write laws. They may have a "right to be consulted, the right to encourage, the right to warn" (as Queen Victoria put it) during weekly audiences with the PM, but the final decision rests with the minister.
      *   **The Nuance:** This ignores "soft power." A monarch can influence policy through private persuasion. However, because these meetings are secret, this influence cannot be scrutinized or voted on.
  *   **Debate Utility:** **High.** This addresses the democratic deficit. It argues that because the monarch lacks *accountability*, they lack *rule*, even if they hold *office*.

  ### 4. The Semantic Reading
  **The Claim:** *"Reigning" means being Head of State, while "Ruling" means being Head of Government.*

  *   **What it amounts to in practice:** This is a definitional stipulation. It asserts that "ruling" is a technical term reserved for the Prime Minister and Cabinet.
  *   **Evaluation:** **Triviality.**
      *   This is true by definition but begs the question. It essentially says, "We define the monarch's role as non-ruling, therefore they do not rule." It sidesteps the issue of whether having a hereditary Head of State with reserve powers is compatible with democracy.
  *   **Debate Utility:** **Low.** It shuts down inquiry rather than answering it.

  ---

  ### Addressing the "Refusal" Question
  You mentioned nobody was sure if the monarch could actually refuse assent. Here is the precise breakdown needed for your debate:

  1.  **In Normal Times:** The monarch **cannot** refuse. To do so would break constitutional convention and likely trigger the abolition of the monarchy. The constraint is political, not legal.
  2.  **In Constitutional Crisis:** The monarch **could** refuse. This is the domain of "Reserve Powers." For example, if a Prime Minister lost a vote of no confidence but refused to resign or call an election, the monarch might legally and conventionally be empowered to dismiss them.
  3.  **The Democratic Tension:** The existence of Reserve Powers means the monarch is, ultimately, an unelected arbiter of last resort. Whether this is a "safety valve" for democracy or a "veto point" against democracy is the core of your debate.

  ### What Your Opponents Actually Need
  To win the debate that "a democracy can justify keeping a monarch," your opponents cannot rely on the **Legal Reading** (because it is false) or the **Semantic Reading** (because it is trivial).

  They must rely on the **Conventional Reading**.

  Their argument must be: *"While the monarch retains legal reserve powers, the conventions constraining them are so strong that the risk of anti-democratic action is negligible, and the benefit of a neutral head of state outweighs that theoretical risk."*

  If they repeat "they do not rule" without acknowledging that the monarch *holds* the power but is *constrained* from using it, they are glossing over the very mechanism that makes the system stable (or unstable). The slogan is only defensible if it is understood as shorthand for "The monarch is legally empowered but conventionally neutered," not "The monarch is legally powerless."
