      *   Reading 3: Political Agency/Responsibility (Substantive).
      *   Reading 4: Semantic Distinction (Trivial).
      *   The "Refusal" Question (Reserve Powers).
      *   What the Debaters Need.

  11. *Wait, one more check:* The user asked for "legal, constitutional, and conventional senses." I should align my headings exactly with those terms to be responsive.
      *   Legal = Statute/Common Law.
      *   Constitutional = The broader framework (might blend law + convention).
      *   Conventional = Unwritten norms.
