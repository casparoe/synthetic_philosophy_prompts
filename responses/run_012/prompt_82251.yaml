prompt: |-
  i'm trying to settle an arguement with a friend about whether credences have to be single numbers. she thinks a range is not just allowed but sometimes mandatory, i think that's indecision dressed up in interval notation, and we keep going in circles because each of us argues from the one case where the other side's view does something ugly. so before i pick a side i want the actual spec. write out the desiderata any theory of credence-under-ambiguity has to meet: the cases it has to get right, the distinctions it can't collapse, the structural facts it can't contradict, and the consideration behind each requirement. then tell me which of those are non-negotiable and which are just house rules of one camp, and flag any two that you suspect can't be satisfied together -- that's the part i actually want. the purpose is narrow: i want a standard good enough to tell me when a range is *required* versus merely permitted, and when my friend is just avoiding a number.

  some things i want on the list, because they're what we keep tripping on:

  - the case where two quantities are independent of each other once you condition on a shared unknown (a coin with an unknown bias, say), and then learning something about one of them makes your range for the other *wider* than it was before you learned anything. is that a requirement, or an artefact of representing the state as an interval?

  - the case where the imprecision sits one level up: i'm not unsure about the chance, i'm unsure which of two ranges of chances i'm in, and there's no fair coin to average over. do i get to have a non-convex set of probabilities, and if you tell me to just take its convex hull, what exactly did i lose?

  - the decision side: i keep hearing that any rule for acting on a set either collapses back to a sharp number or lets a bundle of bets i'd each accept add up to something i'd reject. if that's a real result, put it on the list as a requirement; if it's a confused complaint, say why.

  - whether more evidence is allowed to make things worse, i.e. whether the range is required to shrink as i learn.

  - what the theory says the range *is* -- a psychological fact, a summary of the evidence, a set of sharp opinions i haven't chosen between, or a fiction for deciding. i dont see how you pick desiderata without settling that first.

  no reading lists please. a table at the end is fine if it helps -- the usual families (sets of probabilities, plain intervals, belief-function-ish things) against the requirements -- but the list is the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** Settle an argument about whether credences *must* be single numbers (sharp) or can/should be ranges (imprecise).
      *   **Specific Need:** A list of desiderata (requirements) for any theory of credence-under-ambiguity.
      *   **Key Constraints:**
          *   No reading lists.
          *   Include specific cases mentioned by the user (independent quantities conditioning on unknown, imprecision one level up/non-convex sets, decision rules/dutch book, evidence widening ranges, ontological status of the range).
          *   Distinguish between non-negotiable requirements and "house rules."
          *   **Crucial:** Flag any two desiderata that are mutually incompatible (impossibility results).
          *   **Purpose:** Determine when a range is *required* vs. *permitted* vs. *avoidance*.
          *   **Format:** List of desiderata with considerations, followed by a classification (non-negotiable vs. house rules) and incompatibility flags, optionally a table at the end.

  2.  **Deconstruct the User's Specific Cases:**
      *   *Case 1: Independence & Widening.* (The "dilation" phenomenon). If I have a coin with unknown bias $\theta$, and $X, Y$ are flips. $X$ and $Y$ are independent given $\theta$. But marginally, observing $X$ might tell me about $\theta$, which changes my belief about $Y$. In Imprecise Probability (IP), this can lead to *dilation* (posterior interval is wider than prior). Is this a bug or a feature?
      *   *Case 2: Higher-order Uncertainty / Non-convexity.* If I'm unsure between two distinct sets of probabilities (e.g., Bias is in $[0.1, 0.2]$ OR $[0.8, 0.9]$), should the representation be the union (non-convex) or the convex hull (interval $[0.1, 0.9]$)? What is lost by convexifying? (Loss of modal structure).
      *   *Case 3: Decision Rules & Dutch Books.* Can you act on sets without collapsing to a single number (e.g., via E-admissibility, Maximality, etc.) without opening yourself to sure loss (Dutch Book)? Or does IP inevitably lead to decision paralysis or vulnerability?
      *   *Case 4: Evidence & Monotonicity.* Should more evidence *always* shrink the interval? Or can it widen it (as in dilation)?
      *   *Case 5: Ontology.* What *is* the range? (Psychological state, evidential support, set of eligible sharp credences, decision tool). This drives the other desiderata.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Ontological Clarity.* We need to know what the numbers represent.
      *   *Desideratum 2: Decision Coherence.* The theory must guide action without guaranteeing sure loss.
      *   *Desideratum 3: Learning Behavior.* How does the set update? (Contraction vs. Dilation).
      *   *Desideratum 4: Structural Integrity.* Convexity, non-convexity, handling of independence.
      *   *Desideratum 5: Distinction Preservation.* Distinguishing risk (known prob) from ambiguity (unknown prob).

  4.  **Identifying Incompatibilities (The "Hard Part"):**
      *   *The Seidenfeld/Dilation Problem:* If you want to represent ignorance faithfully (Desideratum: Faithfulness to Evidence) and you want updating to behave like standard conditioning (Desideratum: Bayesian Conditioning), you get Dilation (posterior wider than prior). Many find Dilation counter-intuitive (Desideratum: Information Monotonicity). So, *Faithfulness + Conditioning* vs. *Monotonicity*.
      *   *The Decision Problem:* If you want to avoid Dutch Books (Desideratum: No Sure Loss) and you want to respect the full set of probabilities (Desideratum: E-Admissibility/Permissiveness), you often get Decision Paralysis (no unique choice). If you force a choice (Desideratum: Decisiveness), you often collapse back to a sharp number (Desideratum: Sharp Reduction). So, *No Sure Loss + Permissiveness* vs. *Decisiveness*.
      *   *Convexity:* If you want to use standard linear programming/decision tools (Desideratum: Tractability), you usually assume Convexity. But this loses the distinction between "I don't know which of these two precise models is true" vs "Any model in between is possible" (Desideratum: Modal Distinction).

  5.  **Refining the List for the User's Argument:**
      *   The user wants to know when a range is *required*. This hinges on the distinction between *Risk* and *Ambiguity* (Ellsberg).
      *   The user wants to know if widening is real or artefact. (Dilation).
      *   The user wants to know about decision rules.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the dispute (it's not just semantics, it's foundational).
      *   **The Desiderata List:** Numbered, with "The Requirement," "The Consideration," and "The Trap."
      *   **Classification:** Non-negotiable (Rationality constraints) vs. House Rules (Modeling choices).
      *   **The Incompatibility Flags:** This is the core value add. Identify the impossibility theorems.
      *   **The Table:** Compare Sharp, Interval (IP), and Belief Functions against the criteria.
      *   **Conclusion/Verdict:** Directly answer the "required vs. avoidance" question based on the incompatibilities.

  7.  **Drafting Content - Specific Focus on User's Points:**
      *   *Point 1 (Widening/Dilation):* This is Seidenfeld's Dilation. It happens in IP. Is it a bug? Sharp Bayesians say yes. IP proponents say it's the cost of honesty. *Verdict:* It's a trade-off between Faithfulness and Monotonicity.
      *   *Point 2 (Non-convex):* Convex hulls lose the "bimodal" information. If I think the coin is either biased Heads or biased Tails, $[0.1, 0.9]$ implies $0.5$ is possible, which I deny. *Verdict:* Convexity is a house rule for tractability, not a rationality constraint.
      *   *Point 3 (Decision/Dutch Book):* Standard Dutch Book arguments assume sharp prices. With sets, you have "No Sure Loss" (weak) vs. "Avoiding Dutch Book" (strong). If you use Maximality, you avoid sure loss but might not pick a bet. If you pick a rule to force a pick, you might be Dutch Booked relative to your own set. *Verdict:* You can't have Complete Decisiveness + No Sure Loss + Non-collapsing Set.
      *   *Point 4 (Evidence):* Does evidence always shrink uncertainty? Not in IP (Dilation). *Verdict:* Monotonicity is a house rule of Sharp Bayesianism.
      *   *Point 5 (Ontology):* This is the root. If credence = betting price, it must be sharp (arbitrage). If credence = evidential support, it can be a set.

  8.  **Final Review against Constraints:**
      *   No reading lists? Check.
      *   Table at end? Check.
      *   Flag incompatibilities? Check.
      *   Address specific cases (dilation, convexity, decision rules)? Check.
      *   Tone: Analytical, philosophical but precise, aimed at settling an argument.

  9.  **Refining the "Incompatibility" Section:**
      *   I need to be very clear about *which* two desiderata clash.
      *   Clash 1: **Decisional Decisiveness** vs. **Faithfulness to Ambiguity**. (If you keep the set, you often can't rank acts. If you rank acts, you often need a single number).
      *   Clash 2: **Information Monotonicity** (more info = tighter bounds) vs. **Faithful Conditioning** (Dilation).
      *   Clash 3: **Convexity** (mathematical convenience) vs. **Modal Precision** (distinguishing disjoint hypotheses).

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (logic/consistency) and "House Rules" (modeling preferences) is sharp. This helps the user call out their friend if they are treating a house rule as a law of logic.

