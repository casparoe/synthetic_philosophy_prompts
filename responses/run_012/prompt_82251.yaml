  Also, need to make sure I answer the "required vs permitted" question. A range is *required* if you accept the Ellsberg intuition (ambiguity aversion is rational) and reject the Reduction of Compound Lotteries. A range is *avoidance* if you simply haven't done the work to elicit a sharp prior that satisfies your own coherence constraints.

