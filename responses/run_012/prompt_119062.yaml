answer: |-
  Based on the board's record, here is an analysis of the candidate rules, the predicted decision, the closest analog, and the future case required to settle the remaining theoretical ambiguity.

  ### Candidate Rules

  Reconstructing the board's history, three rules are jointly compatible with our past four rulings. They diverge sharply on the new crux.

  **1. The Contemporaneous Intent Rule**
  *   **Formulation:** Authorial intention governs the text's sense if and only if the evidence of that intention dates from the period of composition or publication. Retrospective statements (Ferreira) are inadmissible, but contemporaneous ones (Ashby, Lindqvist) are binding, regardless of whether they are public or private.
  *   **Prediction for New Case:** **Betrayal.** The notebooks are contemporaneous. The fact that they are private distinguishes them from Ashby's interview but aligns them with Lindqvist's letters. The textual failure is an execution error, but the intended sense is recoverable.

  **2. The Harmonization Rule**
  *   **Formulation:** External evidence (interviews, letters, notebooks) is admissible only when it harmonizes with a plausible reading of the published text. It may clarify ambiguity (Lindqvist) or confirm a straight reading (Ashby), but it cannot contradict the plain meaning of the language, structure, or context (Ferreira, Okonkwo).
  *   **Prediction for New Case:** **Loyalty.** The text plainly signals loyalty; the notebooks plainly signal betrayal. They do not harmonize. To print the betrayal reading would be to annotate a book that does not exist.

  **3. The Public Horizon Rule**
  *   **Formulation:** The board confines intention to what was publicly available to the book's first readers or is recoverable from the text itself. Private documents (Lindqvist's letters, New Case notebooks) are inadmissible unless they were effectively public or the text itself necessitates them to resolve an internal contradiction.
  *   **Prediction for New Case:** **Loyalty.** The notebooks were unknown and private. They fall outside the "public horizon" of the work. (Note: This rule strains slightly against Lindqvist, unless we classify those letters as part of the public critical record at the time).

  ### The Board's Decision

  **The board will decide for Loyalty (the textual reading).**

  We ought to decide this to remain consistent with the **Harmonization Rule**. While the *Contemporaneous Intent Rule* explains Ashby and Lindqvist, it cannot account for Ferreira without an arbitrary "lateness" exception. The deeper principle uniting all four past cases is that the published book is a public contract between author and reader.

  In *Ashby* and *Lindqvist*, the external evidence illuminated what was already visible in the text. In *Ferreira*, the external evidence contradicted the text, and the text won. The new case presents a contradiction identical to *Ferreira*, merely shifting the evidence from "late public" to "early private." If we rule for Betrayal, we establish that a private draft supersedes the public book. This would undermine the series' mission, which is to annotate the *novel in circulation*, not the *novel in the author's head*. The notebooks reveal a failure of execution; our job is to annotate the success or failure of the text as it stands, not to correct the author's mistakes based on private diaries.

  ### Closest Analog

  **Ferreira's *Nightbound* is the closest analog.**

  While *Lindqvist* matches the *type* of evidence (private, contemporaneous documents), *Ferreira* matches the *logical conflict*. In *Ferreira*, the text read as tenderness and the author claimed cruelty. Here, the text reads as loyalty and the notebooks claim betrayal. In both instances, accepting the external evidence requires telling the reader that their experience of the text is wrong. The board's rejection of Ferreira's late interview established that the published object is sovereign against contradictory authorial claims. The timing of the claim (20 years later vs. during drafting) is less significant than the fact that in both cases, the claim attempts to overwrite the textual reality.

  ### The Further Crux

  To separate the **Contemporaneous Intent Rule** (which still has life if we view *Ferreira* as solely about lateness) from the **Public Horizon/Harmonization Rule**, the board needs a case where the text does not *contradict* the private intention, but merely *allows* it.

  **The Case:** An author leaves behind private, contemporaneous journals regarding a novel where the ending is genuinely ambiguous (e.g., it is textually equally probable that the protagonist dies or survives). The journals state definitively: "The protagonist dies." There is no public statement, and the text supports both readings equally.

  **The Separation:**
  *   **If the board prints "Death" as the sense:** They have accepted that **private, contemporaneous intention can override textual ambiguity.** This keeps the *Contemporaneous Intent Rule* alive, suggesting that in the current case (Notebooks vs. Loyalty), we might have been wrong to reject the notebooks solely because they contradicted the text; perhaps we should have accepted them as the "true" reading despite the textual failure.
  *   **If the board leaves the ending ambiguous (or prints both):** They have confirmed that **intention is confined to what is publicly available or recoverable from the text.** Private notes cannot settle textual ambiguity. This solidifies the *Harmonization/Public Horizon Rule* and confirms that our decision on the current crux (Loyalty) was correct because private notes never have the authority to settle sense against the textual evidence, whether that evidence is contradictory or merely equivocal.

  This future crux isolates the variable of *ambiguity* versus *contradiction*, forcing the board to declare whether private intention is a key that unlocks the text, or merely a historical curiosity that must yield to the reader's experience.
