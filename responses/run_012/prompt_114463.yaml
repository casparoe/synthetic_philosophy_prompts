  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute seminar activity on the Dutch Book Theorem.
      *   **Target Audience:** Mixed upper-level undergrad/grad (16 students). Background: 1 week of probability/expected utility (know credence/odds), no formal Dutch book/conditionalization yet.
      *   **Core Problem:** Students see Dutch books as arithmetic tricks, not constraints on rationality. They need to *feel* the trap closing through individually reasonable choices.
      *   **Constraints:** No real money (tokens/points). Room has whiteboard, cards, chips. Facilitator stays in background during the core mechanic (students play Bookie/Bettor).
      *   **Key Requirements:**
          *   Synchronic incoherence (static odds) AND Diachronic vulnerability (updating).
          *   Bookie is a student, not the instructor.
          *   Bets must look fair *at the time* based on stated credences.
          *   Warm-up must feel ordinary (hiding the trap).
