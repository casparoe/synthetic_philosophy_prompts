      *   To make the Diachronic Dutch Book work, the Bookie needs to place a bet at $t_1$ that is conditional on the evidence arriving, OR place a bet at $t_1$ and a counter-bet at $t_2$.
      *   Standard Diachronic Dutch Book:
          1.  $t_1$: Bookie sells Bettor a bet on $H$ (based on $P_1(H)$).
          2.  $E$ occurs.
          3.  $t_2$: Bettor updates to $P_2(H)$. If $P_2(H) \neq P_1(H|E)$, Bookie buys/sells to lock loss.
      *   I need to make sure the Bookie knows *which* bets to offer. I will provide a "Strategy Matrix" in the Bookie's handout.

  13. **Final Polish:** Check against all constraints.
      *   16 students? Yes (4 groups of 4).
      *   90 mins? Yes.
      *   Whiteboard/Chips/Cards? Yes.
      *   No real money? Yes.
