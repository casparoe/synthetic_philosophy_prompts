      *   **Synchronic Trap:** $P(R) + P(K) - P(R \land K)$ vs $P(R \lor K)$. Or simpler: $P(R) + P(\neg R) \neq 1$. Let's stick to the Conditional Probability trap for Diachronic strength.
      *   **Diachronic Trap:**
          1.  $t_1$: State $P(K)$ and $P(K|R)$.
          2.  $t_2$: Reveal Card is Red. State new $P(K)$.
          3.  If $P_{new}(K) \neq P_{old}(K|R)$, Bookie strikes.
