      *   *Materials:* Custom decks (10 cards), Chips, Handouts (Credence Sheet, Bookie Strategy Sheet), Whiteboard.
      *   *Roles:* Bettor (1), Bookie (1), Auditors (2) per group. 4 Groups.
      *   *Timeline:* Detailed.
      *   *Debrief:* Connect specific moments to Synchronic/Diachronic distinctions.
      *   *Troubleshooting:* Coherent Bettors, Math errors, Cynicism.

