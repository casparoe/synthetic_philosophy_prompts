      *   **Adjustment:** The Bookie shouldn't just get a calculator. The Bookie should *interview* the Bettor to find the odds, then *construct* the bets. The "Cheat Sheet" is just to verify the Dutch Book exists.
      *   **Actually, to ensure success:** The Handout for the Bookie should explicitly say: "If Bettor says $X$ and $Y$, offer Bet 1 and Bet 2." This ensures the pedagogical goal is met even if the student Bookie isn't a genius.

