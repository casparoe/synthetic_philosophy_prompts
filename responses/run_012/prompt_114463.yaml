      *Deck:* 10 Cards.
      1.  Red King (2 cards)
      2.  Red Queen (3 cards)
      3.  Black King (3 cards)
      4.  Black Queen (2 cards)
      *   $P(Red) = 0.5$
      *   $P(King) = 0.5$
