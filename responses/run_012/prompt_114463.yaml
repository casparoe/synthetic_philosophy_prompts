          *   Limitations (what the activity *can't* show).

  2.  **Deconstruct the Dutch Book Argument:**
      *   *Synchronic:* If $P(A) + P(\neg A) \neq 1$, or $P(A \cap B) \neq P(A|B)P(B)$, you can be Dutch booked.
      *   *Diachronic:* If you don't update by conditionalization ($P_{new}(A) = P_{old}(A|E)$), you can be Dutch booked over time.
      *   *The "Feel":* The bettor needs to commit to odds, then face bets that exploit inconsistencies between those odds, specifically across time (updating).
      *   *The Trap:* The Bookie needs to know the Bettor's odds *before* offering bets, but the Bettor shouldn't realize the combination is fatal.

  3.  **Brainstorming the Mechanism:**
      *   *Idea 1: Card Guessing.* Draw a card. Bet on Red/Black. Too simple.
      *   *Idea 2: Two-Stage Event.* Event A happens, then Event B. Bettor sets odds on A, B, and B given A.
      *   *Idea 3: The "Forecasting Game".* Bettor makes predictions. Bookie sells insurance.
      *   *Selection:* A two-stage event works best for Diachronic + Synchronic. Let's use a deck of cards. It's tangible.
      *   *Specific Setup:* Draw two cards without replacement? Or just one card with hidden properties? Let's go with **Two Cards drawn from a small, known deck**. This allows for conditional probability calculations that are easy to check but easy to mess up intuitively.
      *   *Refinement:* To make it *feel* like a trap, the Bettor needs to state credences *before* knowing the Bookie will bet against them. The Bookie needs a "menu" of bets derived from those credences.
      *   *Crucial Twist:* To ensure the Bookie doesn't just "win" by luck, the bets must be *sure losses* (Dutch Book) or *expected losses* based on the incoherence. Since we want to show the *force* of the theorem, we need a Synchronic Dutch Book (incoherent probabilities at $t_1$) AND a Diachronic one (bad updating at $t_2$).
      *   *Simplification for 90 mins:* Doing both fully might be too complex. Let's focus on the **Diachronic** aspect as the climax, built on a **Synchronic** foundation. The Bettor sets odds at $t_1$. Evidence arrives. Bettor updates (poorly). Bookie exploits the gap between $t_1$ conditional odds and $t_2$ new odds.
      *   *Wait, the prompt asks for Synchronic AND Diachronic.* Okay, I need to structure it so they encounter the static inconsistency first, then the dynamic one.
      *   *Revised Mechanism:*
          1.  **Phase 1 (Synchronic):** Bettor assigns probabilities to a set of mutually exclusive/exhaustive outcomes (e.g., Card is Heart, Diamond, Club, Spade). If they don't sum to 1, Bookie buys/sells to lock loss.
          2.  **Phase 2 (Diachronic):** Evidence is revealed (e.g., Card is Red). Bettor updates. If new credence $\neq$ old conditional credence, Bookie exploits.
      *   *Problem:* If the Bettor is rational, they won't lose. The activity *requires* the Bettor to be irrational to demonstrate the theorem.
      *   *Solution:* The "Bettor" isn't one person making mistakes. The "Bettor" is the *Group's Consensus* or a specific student instructed to follow "intuitive" heuristics known to be biased (e.g., representativeness). OR, we let the Bettor be free, and the Bookie (student) is given the *formula* to construct the book *if* incoherence exists. If the Bettor is coherent, no Dutch Book is possible.
      *   *Better Solution for Pedagogy:* We need the trap to close *even if* they try to be reasonable. The standard Dutch Book argument assumes the agent *has* incoherent credences. To simulate this, we can use a **"Credence Elicitation"** phase where the rules force them to commit to numbers that are mathematically linked but psychologically distinct.
      *   *Best Approach:* Use the **"Three-Claim Trap"**.
          *   Claim A: Card is Red.
          *   Claim B: Card is a Face Card.
          *   Claim A & B: Card is a Red Face Card.
          *   Most people violate $P(A \& B) = P(A|B)P(B)$ or additivity.
          *   *Diachronic:* Reveal "Card is Red". Ask for new probability of "Face Card". Compare to previous $P(Face | Red)$.
      *   *Role Play:* One Bettor (volunteer), One Bookie (volunteer), Rest are Observers/Auditors (to check the math).
      *   *Wait, 16 students.* Having 1 Bettor and 1 Bookie leaves 14 bored.
      *   *Fix:* Split into 4 teams of 4. Each team has a Bettor and a Bookie. They compete to see which Bookie can extract the most tokens (or which Bettor loses the least). This creates engagement.

  4.  **Developing the Payoff/Rules:**
      *   Currency: Poker chips (1 chip = 1 point).
      *   Starting Endowment: Bettor gets 20 chips. Bookie gets 0 (but keeps profits).
      *   Fair Bet Definition: If Credence = $p$, Price = $10p$ chips. Payoff = 10 chips if true, 0 if false.
      *   This makes the arithmetic easy (multiply by 10).

  5.  **Drafting the Timeline (90 mins):**
      *   0-10: Setup & Groups.
      *   10-25: Phase 1 (Synchronic Elicitation). Bettors write down odds. Bookies calculate potential books.
      *   25-40: Phase 1 (Trading). Bookies offer bets.
      *   40-50: Evidence Reveal & Update (Diachronic).
      *   50-65: Phase 2 (Trading). Bookies offer new bets.
      *   65-75: Settlement & Counting.
      *   75-90: Debrief.

  6.  **Refining the "Trap":**
      *   To guarantee the trap works, the Bettor needs to be *guided* into incoherence without being told.
      *   *Trick:* Ask for $P(A)$, $P(B)$, and $P(A \text{ or } B)$ separately. Many will say $P(A)+P(B)$ without subtracting intersection.
      *   *Diachronic Trick:* Ask for $P(B)$ initially. Then reveal $A$. Ask for new $P(B)$. If they don't conditionalize, there's a gap.
      *   *Constraint:* The prompt says "every bet should look fair... from the bettor's stated odds."
      *   *Mechanism:* The Bookie gets a "Cheat Sheet" (The Dutch Book Calculator). If the Bettor's numbers are incoherent, the sheet tells the Bookie which combination of bets guarantees a profit. If the Bettor is coherent, the sheet says "No Bet."
      *   *This is crucial:* It prevents the Bookie from gambling. They are executing an arbitrage algorithm.

  7.  **Addressing "What will go wrong":**
      *   Bettors might be too rational (coherent). *Fix:* Use a scenario prone to bias (e.g., Conjunctive Fallacy or Base Rate Neglect). Or, instruct the Bettor to "go with their gut" rather than calculating.
      *   Bookies might not understand the calculator. *Fix:* Simple lookup table.
      *   Math errors. *Fix:* Auditors in each group.
      *   Boredom. *Fix:* Rotate roles or make it competitive. Let's make it competitive teams.

  8.  **Addressing Limitations:**
      *   Real agents aren't forced to bet.
      *   Logical omniscience (students might not *see* the incoherence immediately).
      *   Stakes (tokens aren't money).

  9.  **Finalizing the Activity Structure:**
      *   **Name:** "The Credence Market."
      *   **Scenario:** A single card drawn from a custom 10-card deck (simplifies math).
      *   **Cards:** 2 Red Kings, 3 Red Queens, 2 Black Kings, 3 Black Queens. (Total 10).
