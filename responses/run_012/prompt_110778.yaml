prompt: |-
  I am preparing a graduate seminar on the practical sensitivity of knowledge, and before my students evaluate any of the accounts on offer I want a clean statement of what an account of this phenomenon would have to deliver. Write that specification: the desiderata any theory of the relation between practical stakes and knowledge must satisfy, each paired with the case or consideration that motivates it. No survey, no bibliography, no citations — I know the literature; what I need is the criteria.

  Treat the following as the phenomena the theory must accommodate, and convert each into a requirement while saying what it forces:

  - The basic contrast: the same person, with the same evidence and the same truth on her side, is credited with knowing when little turns on it and denied knowledge when a great deal turns on it, and competent speakers do not take themselves to be contradicting one another when they disagree about such a case.
  - The third-person case, in which the attributor's stakes come apart from the subject's, and the subject's from what is objectively at stake.
  - The retrospective case: we learn afterward that the stakes were enormous all along. Does the earlier denial or ascription get revised, and if knowledge is a state someone had at a time, what does it mean for the stakes of that time to be settled only later?
  - Stakes the subject cannot in principle assess — an agent whose action will matter enormously but who has no way of knowing that — and the related worry that a stakes-sensitive theory makes knowledge depend on facts nobody could have known.
  - The collective case: many agents, each facing stakes too small to matter to her individually, whose combined decisions produce a catastrophic outcome. Whose stakes count, and at what level of aggregation?
  - The self-serving cases: an agent who tries to buy knowledge by lowering her own stakes — resolving in advance to follow a checklist, delegating the judgment to someone else, deciding not to care. Is that a legitimate route to knowledge or a loophole, and can the theory say which without making the threshold arbitrary?
  - The linguistic evidence: retraction, apparent faultless disagreement, and the behavior of stakes-sensitivity inside conditionals, under negation, and in reports of what someone else knew.

  Then tell me which of these are genuine desiderata and which are the commitments of a single camp dressed up as requirements; whether some subset is jointly unsatisfiable — this is the part I care most about, and I want the trade-off named rather than smoothed over; and which single requirement does the most to eliminate candidates. Finish with a few sentences scoring the four families against the list — context-sensitive "knows," stakes-sensitive knowledge, the classical stakes-insensitive account, and assessment-relative attributions — but keep the weight on the criteria, since that is where the thinking is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Practical Sensitivity of Knowledge (Pragmatic Encroachment/Stakes-Sensitivity).
      *   **Task:** Write a specification of desiderata (criteria) any theory must satisfy, based on provided phenomena.
      *   **Constraints:** No survey, no bibliography, no citations. Clean statement.
      *   **Input Phenomena to Convert:**
          1.  Basic Contrast (Low vs. High Stakes for same subject/evidence).
          2.  Third-Person Case (Attributor vs. Subject vs. Objective Stakes).
          3.  Retrospective Case (Learning stakes later).
          4.  Unassessable Stakes (Subject ignorant of stakes).
          5.  Collective Case (Aggregation of stakes).
          6.  Self-Serving Cases (Manipulating stakes to gain knowledge).
          7.  Linguistic Evidence (Retraction, disagreement, embedding).
      *   **Critical Analysis Required:**
          *   Distinguish genuine desiderata from camp-specific commitments.
          *   Identify joint unsatisfiability (trade-offs).
          *   Identify the most eliminative requirement.
          *   Score the four families (Contextualism, Pragmatic Encroachment, Intellectualism/Classical, Assessment-Relativism) against the criteria.
      *   **Tone:** Professional, philosophical, precise, suitable for a graduate seminar handout.

  2.  **Drafting the Desiderata (Converting Phenomena to Requirements):**
      *   *Phenomenon 1 (Basic Contrast):* Needs to capture the intuition that stakes change knowledge status without changing evidence.
          *   *Requirement:* **The Variability Constraint.** A theory must explain how knowledge ascriptions shift with practical stakes holding truth and evidence fixed, without implying speaker error.
      *   *Phenomenon 2 (Third-Person):* Needs to handle the separation of who is acting, who is speaking, and what is actually at risk.
          *   *Requirement:* **The Attribution/Action Distinction.** A theory must specify whose stakes determine the knowledge threshold: the subject's, the attributor's, or the objective stakes of the situation.
      *   *Phenomenon 3 (Retrospective):* Needs to handle the temporal aspect. If stakes change or are revealed later, does past knowledge status change?
          *   *Requirement:* **The Temporal Stability Constraint.** A theory must determine whether knowledge is a fact fixed at the time of attribution or subject to revision based on later information about stakes.
      *   *Phenomenon 4 (Unassessable Stakes):* Needs to handle cases where the subject doesn't know the stakes.
          *   *Requirement:* **The Accessibility Constraint.** A theory must clarify whether stakes must be cognitively accessible to the subject to affect their epistemic status, or if objective stakes suffice.
      *   *Phenomenon 5 (Collective):* Needs to handle aggregation.
          *   *Requirement:* **The Aggregation Constraint.** A theory must define the unit of agency for stakes: individual, collective, or systemic.
      *   *Phenomenon 6 (Self-Serving):* Needs to handle manipulation.
          *   *Requirement:* **The Non-Manipulability Constraint.** A theory must prevent agents from trivially manufacturing knowledge by artificially lowering their own practical stakes.
      *   *Phenomenon 7 (Linguistic):* Needs to handle semantics/pragmatics.
          *   *Requirement:* **The Semantic Embedding Constraint.** A theory must account for the behavior of knowledge claims in logical operators (negation, conditionals) and speech acts (retraction, disagreement).

  3.  **Critical Analysis (The "Meat" of the prompt):**
      *   *Genuine vs. Camp-Specific:* The "Basic Contrast" is often treated as a datum, but Intellectualists deny it happens (attributing it to pragmatics). So, is it a desideratum or a theory? I need to frame it carefully. The *intuition* is the datum; the *explanation* is the theory. However, the prompt asks me to treat the phenomena as requirements. I will note that some "requirements" presuppose the phenomenon is real, which Intellectualists reject.
      *   *Joint Unsatisfiability:* This is the core tension. You can't easily satisfy Variability (stakes change knowledge) + Non-Manipulability (can't game the system) + Accessibility (must know the stakes) + Temporal Stability (past is fixed).
      *   *The Big Trade-off:* The tension between **The Variability Constraint** (accommodating the intuition that stakes matter) and **The Semantic Embedding Constraint** (preserving the stability of knowledge as a normative state). Or, more sharply: **The Accessibility Constraint** vs. **The Variability Constraint**. If stakes must be known to matter, we lose cases of unknown high stakes. If unknown stakes matter, knowledge becomes externalist in a way that seems to disconnect from rational action.
      *   *Most Eliminative:* The **Non-Manipulability Constraint** is often the killer. It's very hard to allow stakes to lower thresholds without allowing agents to lower stakes to gain knowledge.
      *   *Scoring the Families:*
          *   *Classical (Intellectualism):* Fails Variability (denies the data). Passes Stability/Manipulation.
          *   *Contextualism:* Passes Linguistic/Attribution. Fails Third-Person (sometimes) and Retrospective (retraction issues).
          *   *Pragmatic Encroachment (Stakes-Sensitive):* Passes Variability. Struggles with Non-Manipulability and Accessibility (unknown stakes).
          *   *Assessment-Relativism:* Passes Retraction/Disagreement. Struggles with Temporal Stability (knowledge changes with assessor).

  4.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Ensure it sounds like a specification document for philosophers. "The theory must..."
      *   *Constraint Check:* No citations. No bibliography.
      *   *Focus:* The prompt emphasizes the trade-offs and the scoring. I need to make sure the analysis section is robust.
      *   *Clarification on "Genuine Desiderata":* I need to be honest. The "Basic Contrast" is the *explanandum*, but treating it as a hard constraint rules out Intellectualism by fiat. I should frame it as "Accommodating the Intuition" rather than "Affirming the Fact."
      *   *The Trade-off:* The "Trilemma" is usually between Intuition (Variability), Action-Guidance (Accessibility), and Stability (Non-Manipulability). I will highlight the tension between *Variability* and *Non-Manipulability*.

  5.  **Final Review against Prompt Instructions:**
      *   Clean statement of specification? Yes.
      *   Desiderata paired with motivating case? Yes.
      *   No survey/biblio/citations? Yes.
      *   Identify genuine vs. camp commitments? Yes.
      *   Identify jointly unsatisfiable subset? Yes.
      *   Name the trade-off? Yes.
      *   Identify most eliminative requirement? Yes.
      *   Score the four families? Yes.
      *   Keep weight on criteria? Yes.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Desiderata:*
          1.  Variability (Basic Contrast).
          2.  Location of Stakes (Third-Person).
          3.  Fixity (Retrospective).
          4.  Transparency (Unassessable).
          5.  Scope (Collective).
          6.  Integrity (Self-Serving).
          7.  Compositionality (Linguistic).
      *   *Analysis:*
          *   Variability is the battleground. Intellectualists say it's pragmatic, not semantic/epistemic.
          *   Integrity (Non-Manipulability) is the hardest for Encroachment.
          *   Fixity is the hardest for Relativism/Contextualism.
          *   Trade-off: **The Stability-Responsiveness Tension.** You want knowledge to respond to stakes (Responsiveness) but not change based on whims or later discoveries (Stability).
          *   Most eliminative: Integrity/Non-Manipulability.
      *   *Scoring:*
          *   Classical: Fails Variability.
          *   Encroachment: Fails Integrity/Transparency.
          *   Contextualism: Fails Fixity/Third-Person (Attributor stakes).
          *   Relativism: Fails Fixity (Knowledge changes over time).

  7.  **Final Polish:** Ensure the language is crisp. "The theory must..." "This forces..." Avoid hedging too much, but acknowledge the philosophical friction. (Self-Correction: Make sure to explicitly state which requirements are contested.)

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Specification: Theoretical Requirements for Practical Sensitivity in Knowledge

  The following seven constraints constitute the design space for any theory claiming to model the relationship between practical stakes and epistemic status. Each requirement is derived from a specific phenomenological datum. A viable theory must either satisfy the requirement or provide a principled error theory explaining why the datum is misleading.

  ### 1. The Variability Constraint
  *   **Motivating Case:** The Basic Contrast. A subject possesses identical evidence and targets the same truth in a Low-Stakes context (little turns on it) and a High-Stakes context (a great deal turns on it). Competent speakers ascribe knowledge in the former and deny it in the latter without viewing themselves as contradicting one another.
  *   **Requirement:** The theory must allow the extension of the knowledge relation to shift as practical stakes shift, holding truth and evidence constant.
  *   **What it Forces:** The theory must reject the sufficiency of truth and belief (plus standard justification) for knowledge. It forces the admission of a practical parameter into the truth-conditions of knowledge or the norms governing its ascription.

  ### 2. The Location Constraint
  *   **Motivating Case:** The Third-Person Case. The stakes relevant to the knowledge ascription may belong to the subject (acting), the attributor (speaking), or the objective situation (what is actually at risk), and these can come apart.
  *   **Requirement:** The theory must specify the locus of the relevant stakes. It must determine whether the threshold for knowledge is set by the subject's practical situation, the attributor's conversational context, or the objective normative significance of the error.
  *   **What it Forces:** The theory must disambiguate the semantics of "knows." It cannot treat stakes as a monolithic background feature; it must assign them to a specific agent or perspective.

  ### 3. The Fixity Constraint
  *   **Motivating Case:** The Retrospective Case. We learn afterward that the stakes at the time of action were enormous (or negligible).
  *   **Requirement:** The theory must determine the temporal stability of knowledge ascriptions. It must state whether a knowledge claim is evaluated relative to the stakes *at the time of the event* or relative to the stakes *at the time of assessment*.
  *   **What it Forces:** The theory must choose between treating knowledge as a historical fact (fixed at $t_1$) or a current status (evaluated at $t_2$). If the latter, it must explain how a subject could have been rational to act at $t_1$ while lacking knowledge by the lights of $t_2$.

  ### 4. The Transparency Constraint
  *   **Motivating Case:** Unassessable Stakes. An agent acts where the stakes are objectively enormous, but the agent has no way of knowing this.
  *   **Requirement:** The theory must clarify the accessibility of the stakes parameter. It must state whether stakes affect knowledge only if the subject is aware of them, or if objective stakes suffice regardless of the subject's epistemic access to those stakes.
  *   **What it Forces:** The theory must decide if knowledge remains an internalist-guided state or becomes fully externalist regarding practical context. If objective stakes count without access, the theory risks making knowledge unknowable to the knower.

  ### 5. The Scope Constraint
  *   **Motivating Case:** The Collective Case. Many agents face individually negligible stakes, but their combined actions produce a catastrophe.
  *   **Requirement:** The theory must define the unit of agency for stakes calculation. It must determine if stakes are aggregated across a group or confined to the individual decision-maker.
  *   **What it Forces:** The theory must provide a mereology of practical reasoning. It cannot simply assume the individual is the sole bearer of epistemic burden; it must explain why collective risk does not (or does) inflate individual epistemic requirements.

  ### 6. The Integrity Constraint
  *   **Motivating Case:** Self-Serving Cases. An agent attempts to secure knowledge by artificially lowering their stakes (e.g., deciding not to care, delegating the choice, pre-committing to ignore the outcome).
  *   **Requirement:** The theory must block the trivial manufacture of knowledge through stake-manipulation. It must distinguish between legitimate stake-reduction and epistemic gaming.
  *   **What it Forces:** The theory must posit a baseline of "proper" or "objective" stakes that cannot be wished away. It forces a distinction between the stakes an agent *has* and the stakes an agent *acknowledges*.

  ### 7. The Compositionality Constraint
  *   **Motivating Case:** Linguistic Evidence. Retraction patterns, faultless disagreement, and the behavior of knowledge claims under negation, in conditionals, and in indirect reports.
  *   **Requirement:** The theory must integrate stakes-sensitivity into the logical syntax of knowledge claims. It must explain why "I know, but I might be wrong" sounds contradictory, or why we retract past claims when stakes rise.
  *   **What it Forces:** The theory must offer a semantic or pragmatic mechanism that interacts predictably with logical operators. It cannot treat stakes as a mere conversational implicature if it wishes to explain retraction data.

  ***

  # Critical Analysis of the Specification

  ### Genuine Desiderata vs. Camp Commitments
  Not all seven requirements are neutral starting points. **The Variability Constraint** is the primary fault line. Treating the "Basic Contrast" as a hard datum presupposes that Pragmatic Encroachment is true. Classical Intellectualism rejects this requirement, arguing that the contrast is explained by pragmatic factors (assertibility conditions) rather than shifts in knowledge itself. Therefore, Variability is a desideratum only for theories that accept the phenomenon as semantic or epistemic rather than pragmatic.

  Similarly, **The Compositionality Constraint** leans heavily toward Contextualism or Relativism. Intellectualist accounts often handle linguistic data via Gricean pragmatics, which do not satisfy strict semantic compositionality requirements regarding stakes.

  ### Joint Unsatisfiability and the Core Trade-off
  A subset of these requirements is jointly unsatisfiable without significant theoretical cost. Specifically, **The Variability Constraint**, **The Transparency Constraint**, and **The Integrity Constraint** form a trilemma.

  1.  If you satisfy **Variability** (stakes change knowledge) and **Transparency** (subject must know the stakes to be affected by them), you fail **Integrity**. An agent can simply remain ignorant of high stakes or convince themselves stakes are low to satisfy the transparency condition while retaining knowledge.
  2.  If you satisfy **Variability** and **Integrity** (objective stakes set the bar), you fail **Transparency**. The subject can lose knowledge due to stakes they cannot possibly know about, severing the link between knowledge and rational action-guidance.
  3.  If you satisfy **Transparency** and **Integrity**, you must reject **Variability**. This is the Intellectualist move: stakes don't change knowledge; they only change what one should do with it.

  **The Named Trade-off:** This is the **Stability-Responsiveness Tension**. A theory wants knowledge to be *Responsive* to practical reality (Variability/Integrity) but also *Stable* enough to be a guide for the agent (Transparency/Fixity). You cannot maximize both. Making knowledge sensitive to objective stakes makes it unstable for the agent; making it sensitive only to perceived stakes makes it manipulable.

  ### The Most Eliminative Requirement
  **The Integrity Constraint** does the most work in eliminating candidates. It is the hardest hurdle for Pragmatic Encroachment accounts. Any theory that allows practical stakes to lower the epistemic threshold inevitably faces the "Self-Serving" objection: if caring less makes it easier to know, then ignorance is a strategy for knowledge. Theories that cannot distinguish between *actual* normative stakes and *psychological* investment collapse into absurdity here. This constraint forces Encroachment theorists to posit an objective normative standard for stakes, which in turn threatens the Transparency Constraint.

  ***

  # Scoring the Four Families

  **1. Classical Stakes-Insensitive Account (Intellectualism)**
  *   **Performance:** Fails **Variability** by fiat (treats it as pragmatic error). Passes **Fixity**, **Transparency**, and **Integrity** with high marks. Knowledge is stable, accessible, and ungameable.
  *   **Verdict:** Theoretically robust but phenomenologically costly. It saves the nature of knowledge at the expense of explaining why speakers persistently disagree about stakes cases.

  **2. Context-Sensitive "Knows" (Contextualism)**
  *   **Performance:** Satisfies **Variability** and **Compositionality** well. Struggles with **Location** (often privileges attributor stakes, which seems wrong in third-person cases) and **Fixity** (makes past knowledge ascriptions false if context changes).
  *   **Verdict:** Excellent on linguistic data, poor on the metaphysics of the knowledge state. It explains the conversation but loses the fact.

  **3. Stakes-Sensitive Knowledge (Pragmatic Encroachment)**
  *   **Performance:** Satisfies **Variability** and **Location** (subject stakes) directly. Fails **Integrity** (vulnerable to self-serving manipulation) and **Transparency** (if stakes are objective).
  *   **Verdict:** Best fit for the basic intuition, but highest theoretical cost. It must solve the manipulability problem without retreating into Intellectualism.

  **4. Assessment-Relative Attributions (Relativism)**
  *   **Performance:** Satisfies **Retraction** and **Disagreement** data better than Contextualism. Satisfies **Variability**. Fails **Fixity** catastrophically (knowledge status changes as assessors change) and struggles with **Location** (whose assessment counts?).
  *   **Verdict:** Solves the linguistic puzzles by making knowledge inherently unstable. It satisfies the criteria by dissolving the idea of a fixed knowledge state.

  **Summary:** The specification reveals that no family satisfies all seven constraints. The choice of theory is ultimately a choice of which constraint to violate. Intellectualism sacrifices Variability; Encroachment sacrifices Integrity or Transparency; Contextualism and Relativism sacrifice Fixity. The seminar should focus on which violation is least damaging to the broader epistemological project.
