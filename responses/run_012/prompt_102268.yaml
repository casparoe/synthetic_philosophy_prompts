answer: |-
  This is a sharp observation. You are right to feel that standard labels like "hypocrisy" or *tu quoque* are imprecise here. Hypocrisy requires a contradiction between *your words* and *your actions* (e.g., "Stealing is wrong" while you steal). *Tu quoque* ("you also") relies on that same contradiction to invalidate the criticism.

  In your examples, the critic isn't necessarily doing the specific thing they condemn. They are **implicated in the system that produces the thing.**

  The most precise established concept for this is **Moral Standing** (specifically, **Standing to Blame**). However, in rhetorical practice, this often manifests as a move I will coin for you as the **Complicity Deflection**.

  Here is the carving you asked for, distinguishing it from its neighbors, analyzing your examples, and mapping the blurry edges.

  ### 1. The Core Concept: Moral Standing
  In ethics and political philosophy, **Standing** refers to the normative authority a person has to hold someone else accountable. It is distinct from the *truth* of the claim.
  *   **Truth:** "Sweatshops are exploitative." (This is either true or false regardless of who says it).
  *   **Standing:** "Do *you* have the right to demand accountability for this?"

  When someone says, "You benefit from patriarchy, sit down," they are not arguing the joke isn't sexist (Truth). They are arguing you lack the **Standing** to lead the correction because your position within the power structure distorts your authority or harms the discourse.

  ### 2. The Carving: Distinguishing the Phenomenon

  Here is how **Standing/Complicity** differs from the concepts you likely already know:

  | Concept | The Accusation | The Implication | Why it doesn't fit your examples |
  | :--- | :--- | :--- | :--- |
  | **Hypocrisy** | "You do the very thing you condemn." | You are morally inconsistent. | Your friend isn't running a sweatshop; the man isn't telling sexist jokes. |
  | ***Tu Quoque*** | "You do it too, so your criticism is void." | The criticism is logically invalid. | This is a fallacy. Your examples are often used as fallacies, but the "patriarchy" one claims a social norm, not a logical invalidation. |
  | **Ad Hominem** | "You are flawed, so your argument is false." | The person attacks the source to kill the claim. | Standing objections often *concede* the claim is true but reject the *speaker's role*. |
  | **Whataboutism** | "What about this other bad thing?" | Deflection to a different topic. | The "phone" example is whataboutism. The "patriarchy" example is not; it's about the *same* system. |
  | **Complicity/Standing** | "You are entangled in the system you critique." | You lack the authority/position to speak *here*. | **This fits.** It targets entanglement, not direct action. |

  ### 3. Analyzing Your Two Examples (They are different species)

  This is the most critical distinction. Your two examples look the same on the surface, but they function differently.

  **Example A: The Phone (Unavoidable Complicity)**
  *   *Argument:* "You use a phone with cobalt, so you can't criticize sweatshops."
  *   *Verdict:* **This is a Fallacy (Complicity Deflection).**
  *   *Why:* In a globalized capitalist economy, participation is largely non-voluntary. There is no "pure" position outside the system. If standing required zero complicity, no one could criticize anything. This is a **dodge**. It weaponizes the impossibility of moral purity to silence valid criticism.

  **Example B: The Patriarchy (Identity/Structural Complicity)**
  *   *Argument:* "You benefit from patriarchy, so you shouldn't lead this critique."
  *   *Verdict:* **This is a Normative Claim (Standing Objection).**
  *   *Why:* This isn't about logical truth; it's about **discursive hierarchy**. In critical theory (Standpoint Epistemology), those harmed by a system are often granted higher standing to define that harm than those who benefit from it. The objection isn't that the man is *wrong* about the joke; it's that his intervention might center his voice over victims, or that his benefit creates a blind spot. This is not necessarily a dodge; it can be a legitimate rule of social engagement.

  ### 4. Is it Legitimate or a Dodge?

  The legitimacy depends on **Exit Cost** and **Epistemic Privilege**.

  1.  **Exit Cost (Can they stop?):**
      *   **High Cost (Phone/Air/Infrastructure):** If stopping the benefit requires opting out of society, the objection is a **dodge**. It demands impossible purity.
      *   **Low Cost (Behavior/Culture):** If stopping the benefit requires changing behavior (e.g., "stop interrupting women"), the objection has **weight**. It asks for alignment between values and action.

  2.  **Epistemic Privilege (Who knows best?):**
      *   If the criticism is about *facts* ("This factory emits toxins"), complicity matters less. A scientist who owns stock in the factory can still be right about the toxins.
      *   If the criticism is about *experience* ("This joke makes women feel unsafe"), complicity matters more. A man cannot know the experience of the harm, so his standing to adjudicate the harm is lower.

  ### 5. Confidence and The Blurry Map

  **Confidence Level: High** on the distinction from hypocrisy; **Moderate** on the unified labeling.

  I am highly confident that **Standing** is the correct philosophical category and that this is distinct from hypocrisy. Hypocrisy is about *consistency*; Standing is about *authority*. You can have standing without being perfect (e.g., a recovering alcoholic has standing to warn against drinking), and you can be hypocritical but still have standing (e.g., a smoker can still truthfully say smoking kills you, even if they smoke).

  **The Blurry Map (Where I am least sure):**
  The hardest boundary to draw is **when systemic benefit becomes disqualifying.**
  *   *Borderline Case:* A wealthy environmentalist flies on a private jet to a climate conference.
      *   *Is this a dodge?* No, because they have a low-cost alternative (commercial flight) and their action directly contradicts the message.
      *   *Is it hypocrisy?* Yes, but the objection is often framed as "You are part of the problem," which is the Complicity/Standing frame.
  *   *The Uncertainty:* There is no agreed-upon threshold for how much "benefit" strips you of "standing."
      *   Does paying taxes that fund a war strip you of standing to protest that war? (Most say no).
      *   Does being a man strip you of standing to criticize sexism? (Most say no, but perhaps not *lead* the criticism).
      *   **The Blur:** We lack a clear metric for **acceptable entanglement.** We intuitively know the "phone" argument is weak and the "patriarchy" argument is stronger, but articulating *exactly why* without resorting to "I know it when I see it" is philosophically contentious.

  ### Summary Recommendation
  If you need a label for this in conversation:
  1.  **Formal:** Call it a **Standing Objection**. ("You're questioning his standing, not his facts.")
  2.  **Descriptive:** Call it **Complicity Deflection**. ("That's a complicity deflection; everyone uses phones, it doesn't make sweatshops okay.")
  3.  **Distinction:** Remember that **Hypocrisy** asks "Do you do this?" while **Standing** asks "Are you positioned to judge this?"

  The "phone" argument is almost always a fallacy (demanding purity). The "patriarchy" argument is a normative claim about discourse (claiming priority of voice). Treating them as the same logical move is where most people get confused.
