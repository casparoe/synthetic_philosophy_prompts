  You complain that my criterion is retrospective, as if this were a discovery of a flaw rather than the very essence of the matter. Of course it is retrospective! What did you expect? A logical stopwatch? If I were to offer you a decisive stopping rule, I would be no better than the naive falsificationists I have spent my career dismantling. They demanded we throw away a theory at the first sign of refutation; I say we must protect the hard core to allow the programme to unfold. The verdict on whether that protection was wise or merely dogmatic comes only when the dust settles. You ask what the scientist is to do *now*? They are to follow the positive heuristic. They are to assume the anomaly lies in the protective belt, not the core, and work to turn it into a confirmation.

  As for your charge that a defender can always plead for more time—yes, they can, but at the cost of intellectual bankruptcy. There is a difference between a programme that is temporarily stagnant and one that is degenerating theoretically. If you are merely adding *ad hoc* adjustments to save the phenomena without increasing empirical content, the community will see it. They may not abandon it immediately—science is a human enterprise, not a logic machine—but the rationality lies in the long-term trajectory. Regarding your accusation of circularity: I do not claim my rational reconstructions are the only history. I claim they are the ones that explain the *growth* of knowledge. If my categories help us distinguish sense from nonsense in the past, they offer a guide for the future, even if the final judgment belongs to history.

  So, to answer your question directly: the scientist in the midst of crisis does not look to me for a verdict. They look to their positive heuristic. If they have a hunch that the core can yield novel facts, they persist. If they are merely patching holes without new predictions, they should worry. But there is no algorithm for this. You want a guarantee? There is none. There is only the risk of research. My methodology does not tell you when to quit; it tells you what counts as quitting rationally versus dogmatically. The rest is up to your courage and your imagination.
