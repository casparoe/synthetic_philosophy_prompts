      *   *Section 2: The Hidden Empirical Question.* Focus on "Optimization Pressure." Can the model find the tail?
      *   *Section 3: The CS Analogy.* Explain why it fails (Agency) and propose the Crypto vs. Engineering analogy instead.
      *   *Section 4: What Counts as Progress.* Argue for a Threat Model Taxonomy + Empirical measurement of adversarial capacity.
      *   *Conclusion:* Summarize the diagnosis.

  9.  **Refining the Tone:**
