  2.  **Deconstruct the Philosophy (Die Variant):**
      *   *Sunday Prior:* P(Roll=k) = 1/6 for k=1..6.
      *   *Awakening:* Beauty wakes up. She knows the protocol.
      *   *Halfer-ish view (No new evidence):* P(Roll=6 | Awake) = P(Roll=6) = 1/6. Being awake was guaranteed regardless of the roll (since min roll is 1).
      *   *Thirder-ish view (Self-Sampling/Anthropic):* There are more awakenings on higher rolls. Total expected awakenings = (1+2+3+4+5+6)/6 = 3.5. Probability of being in a specific awakening given Roll=6 is higher than given Roll=1.
          *   P(Roll=k | Awake) proportional to k * P(Roll=k).
          *   P(Roll=6 | Awake) = 6 / (1+2+3+4+5+6) = 6/21 = 2/7 (~28.6%).
          *   P(Roll=1 | Awake) = 1/21 (~4.8%).
      *   *The Bet:* Pays 3x stake if Roll=6, costs stake otherwise.
          *   If P(6) = 1/6 (16.7%): Expected Value (EV) = (1/6 * 3) - (5/6 * 1) = 3/6 - 5/6 = -2/6 (Negative). Reject bet.
