  2. In the communal break room during the rare overlapping shifts, Mark tapped his coffee mug, insisting that waking changed nothing about the Sunday night odds. "You were guaranteed to wake up at least once regardless of the die," he argued, his voice flat against the hum of the ventilation. "Your evidence now is identical to your evidence then, so the probability remains one-sixth, and taking the bet is mathematical suicide." Elara countered that her current existence was sampled from a pool weighted heavily toward higher numbers, making a six nearly thirty percent likely rather than sixteen, but Mark just shook his head, calling it a hallucination of significance.

  3. Later, Sarah, a veteran of twelve cycles, whispered over the sink while washing her hands, her eyes darting to the camera in the corner. "If the die shows six, I become six different people who each think they are me," she said, the water running over her trembling fingers. "Sunday-Elara signed up for one experiment, but she effectively conscripted five strangers who never agreed to the memory wipes or the risk." The ethical weight pressed heavier than the fatigue; if she accepted the bet and lost, she harmed not just herself, but every version of herself that existed only because the die landed high.

  4. The registrar slid the tablet across the desk, the cursor blinking on the line for the standing bet where three credits could become nine or vanish entirely. Elara calculated the expected value in her head, the thirder position promising a profit over many cycles while the halfer position demanded caution to avoid ruin on any single given experiment. She looked at the pen, then at the camera, realizing that refusing the bet favored the Sunday self's safety, while accepting it favored the aggregate welfare of the awakened selves who needed the credits to live.

  5. She signed the form, marking 'Accept' on the bet before typing into the mandatory confidence and reservations field. The cursor blinked as she entered: "I am 85% confident in the anthropic update shifting probability to 2/7, but least sure about treating distinct awakenings as independent observers rather than temporal segments." She finished the required disclosure: "This case departs from the textbook coin puzzle by introducing variable frequencies, leaning on the Self-Indication Assumption which remains genuinely contested regarding whether existence itself constitutes evidence."
