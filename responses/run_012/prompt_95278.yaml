  **MAX:** So... if I tell the accountants to sum the liabilities first, the game costs money to play. But if I tell them to sum the assets first, I can charge a premium?

  **LEX:** Mathematically, yes. But physically, the flips happen in a fixed order. You're rearranging the ledger, not the coin.

  **MAX:** Lex, look around. This is a casino. The ledger *is* the reality.

  **LEX:** That's not how probability works.

  **MAX:** It is today. Print the tickets with the price: "Market Dependent."

  **LEX:** You're going to get sued.

  **MAX:** Let them sue. By the time they finish rearranging their legal arguments, I'll have already reordered the settlement terms.

  **LEX:** ...

  **MAX:** What?

  **LEX:** Nothing. I just realized why they call it the Pasadena *Paradox*.

  **MAX:** Nope. We call it "Dynamic Pricing." Now get out, I have to go figure out how to sum my taxes to zero.

