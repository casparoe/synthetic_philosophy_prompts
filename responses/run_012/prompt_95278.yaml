  **MAX:** Sixty-nine cents? I'll lose money on the felt alone. Can't we jack it up?

  **LEX:** Well, the series is only conditionally convergent. The positive terms sum to infinity, the negative terms sum to negative infinity. If you rearrange the order of summation, you can make the expected value literally any real number you want.

  **MAX:** Any number?

