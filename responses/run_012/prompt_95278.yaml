  **SCENE: The Back Office of "Zeno's Casino"**

  **CHARACTERS:**
  **LEX:** A decision theorist.
  **MAX:** A casino owner who min-maxes everything.

  **MAX:** Alright, Lex. We're launching the Pasadena Game next week. What's the fair entry fee?

