answer: |-
  There is no single, canonical term in the literature that captures this pattern with the precision you require. The phenomenon sits at the intersection of information economics, computational complexity, and epistemology, and while adjacent fields have names for pieces of it, none name the specific *tactic* of endogenously raising verification costs for a true claim.

  Below is an analysis of the nearest existing concepts, followed by a proposed coinage with a formal definition and an analysis of the edge cases you raised.

  ### 1. The Nearest Existing Concepts (and why they fail)

  *   **Costly State Verification (CSV):** In economics (Townsend, 1979), this describes situations where verifying a claim (e.g., a borrower's income) is expensive. However, in CSV models, the cost is usually *exogenous* (determined by the nature of the asset or law), not *endogenous* (chosen strategically by the claimant to maximize cost). Your pattern requires the claimant to control the cost.
  *   **Gish Gallop:** This is a rhetorical tactic of overwhelming an opponent with too many arguments to check. It relies on *volume* (breadth), whereas your pattern relies on *depth* (computational or logical chain length).
  *   **Denial of Service (DoS):** In security, this is exhausting a verifier's resources. However, DoS implies an attack intended to crash the system or prevent function. Your pattern is more subtle: it allows the system to function (the claim is accepted) but degrades the *quality* of the acceptance (trust vs. verification).
  *   **AI Safety / Debate Literature:** In "AI Safety via Debate" (Irving, Christiano, Amodei, 2018), the authors discuss the risk that a dishonest agent can make a lie that is harder to refute than the truth is to prove. They refer to this as the **"honesty penalty"** or the **"verification gap."** However, this literature generally assumes one agent is lying. Your pattern is sharper: it describes a *truthful* agent choosing a hard-to-check representation, or a system where truth *must* be rendered obscure to be competitive.
  *   **Information Asymmetry:** This names the state of imbalance but not the *manufacture* of that imbalance. It is too passive.

  ### 2. Proposed Term: Strategic Verification Burden (SVB)

  Since no established term fits, I propose **Strategic Verification Burden (SVB)**.

  **Definition:**
  *Strategic Verification Burden* is a communicative or transactional pattern in which a Claimant asserts a proposition $P$ that is true, but selects a representation $R(P)$ such that the cost $C$ for a Verifier to validate $P$ via $R(P)$ exceeds the Verifier's fixed budget $B$, despite the existence of alternative representations $R'(P)$ where $C' < B$.

  **Necessary Conditions:**
  1.  **Endogenous Cost:** The verification cost is not inherent to the truth of $P$, but is a function of the Claimant's choice of representation.
  2.  **Budget Binding:** The Verifier has a fixed, known capacity $B$ (time, compute, cognitive load), and $C > B$.
  3.  **Incentive Compatibility:** The Claimant gains an advantage (e.g., reduced scrutiny, plausible deniability, or competitive parity) by ensuring $C > B$, or is penalized if they choose $R'(P)$ where $C' < B$.

  ### 3. Analysis of Edge Cases

  You asked four specific boundary questions. Here is how SVB applies to them:

  **A. Is a document that is merely long and dull an instance?**
  *   **No, not unless the length is strategic.** SVB requires *agency*. If a document is long because the subject matter is inherently complex (e.g., a full specification of a nuclear reactor), that is *Inherent Verification Cost*, not SVB. If the document is long because the author could have summarized the safety check but chose to dump raw logs to exhaust the auditor's time, that is SVB. The distinction lies in the existence of a lower-cost representation that was rejected.

  **B. Is a claim hard for a person but trivial for a machine an instance?**
  *   **Only if the human is the binding verifier.** SVB is relative to the *Verifier's* budget. If the protocol allows a machine to verify the claim instantly, but the Claimant forces a human to check it manually, that is SVB. If the system is designed such that only a human *can* verify it (e.g., aesthetic judgment), and the Claimant chooses a formulation that exceeds human cognitive limits, that is SVB. If the machine is available and the Claimant uses it, there is no SVB. The pattern is defined by the *bottleneck*, not the absolute complexity.

  **C. What of a genuine ambiguity that nobody controls?**
  *   **No.** This is *Epistemic Uncertainty*. SVB requires a *Claimant* making a *choice*. If the ambiguity arises from the state of the world (e.g., "we cannot know if this law applies until the Supreme Court rules"), the cost is exogenous. SVB is a tactic, not a condition.

  **D. Is there an account of when the honest party's best response is to make its own case equally hard?**
  *   **Yes.** This is the equilibrium condition you identified. If the "market" for claims rewards those that are hard to refute (because they are hard to check), honest parties are forced to adopt SVB to survive.
  *   **Term for the Equilibrium:** **Verifiable Gresham's Law**.
  *   **Definition:** Just as "bad money drives out good," *high-burden proof drives out low-burden proof.* If a Verifier cannot distinguish between "true but hard to check" and "false and hard to check," they may begin to value the *appearance* of rigor (complexity) over actual verifiability. Honest parties, to signal competence or avoid suspicion, must inflate their own verification costs to match the obscurity of their competitors. The system settles at a Nash Equilibrium where all claims are maximally opaque relative to the verifier's budget.

  ### 4. Why "Deception" is the Wrong Label

  You correctly noted that this pattern can exist without a liar. This is the most critical distinction.
  *   **Deception** aims to make the Verifier believe $False$.
  *   **SVB** aims to make the Verifier *unable to distinguish* $True$ from $False$, or to make the cost of distinguishing them prohibitive.

  In your AI example, the AI is not lying. It is telling the truth in a dialect the judge cannot speak. This is not a lie; it is a **lockout**. The term "Strategic Verification Burden" captures this neutrality: it describes the *mechanism* of the lockout without presuming the *intent* (malice vs. defense).

  ### 5. Summary for Usage

  If you wish to use this concept in writing or argument, I recommend the following formulation:

  > "This is an instance of **Strategic Verification Burden**. The claimant has not falsified the data, but has selected a representation of the truth whose verification cost exceeds the auditor's budget. This creates a **Verifiable Gresham's Law**, where honest parties are incentivized to obscure their own reasoning to avoid being the only party subject to full scrutiny."

  This distinguishes it from mere complexity, places the agency on the claimant, and identifies the systemic degradation you observed.
