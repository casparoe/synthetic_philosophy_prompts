answer: |-
  **Case One: The Devoted Navigator**
  Elias uses a GPS app that learns his driving habits, dynamically rerouting him around traffic, construction, and weather in real-time. He varies his speed, his lane selection, and even his departure times based on the app's nuanced suggestions; his behavior is highly flexible, adaptive, and responsive to environmental data. However, Elias has forgotten why he is driving. The destination was deleted from the app days ago, and he has no job, appointment, or errand to attend. Yet, because the app continues to issue commands ("Turn left," "Recalculating"), Elias continues to drive, circling the city endlessly. He adjusts perfectly to the *conditions* of the road, but he is insensitive to the *absence* of a destination. His flexibility is real, but it is merely a complex reaction to immediate stimuli; the behavior persists even though the point of the behavior has vanished.

  **Case Two: The Crossing Guard**
  Mrs. Gable stands at the same corner every morning at 8:00 AM. She wears the same vest, holds the stop sign at the exact same angle, and blows her whistle with the identical rhythm and force every single day. Her movements are rigid, repetitive, and show zero variation from one day to the next. However, Mrs. Gable is not sphexish. She stops traffic for the sake of the children's safety. If the school were to close permanently, or if the children stopped coming, she would put the vest away and stop blowing the whistle. Her rigidity is a chosen instrument to serve a goal. The behavior is identical every time, but it is tethered to a purpose; if the purpose were defeated, the behavior would cease, even if the time of day and the street remained exactly the same.

  ***

  **The Criterion: Counterfactual Sensitivity to the Defeat of the End**
  I sorted these cases not by the *variability* of the behavior, but by its *teleological vulnerability*. A system is sphexish if its behavior persists when the *end* (the purpose) is defeated, provided the *trigger* (the stimulus) remains. A system is non-sphexish if its behavior ceases when the *end* is defeated, even if the *trigger* remains.

  Under this criterion, **Case One (Elias)** is sphexish. He responds to the trigger (GPS commands) but ignores the defeat of the end (no destination). **Case Two (Mrs. Gable)** is non-sphexish. She responds to the end (safety), so if the end is defeated (no children), she stops, even if the trigger (8:00 AM) remains. Crucially, determinism is irrelevant here. Elias's brain could be filled with quantum noise (indeterministic), making his route choices truly unpredictable, yet he remains sphexish because his actions are unmoored from a goal. Mrs. Gable could be a fully determined system in a clockwork universe, yet she remains non-sphexish because her determination flows through her representation of the goal.

  **The Wasp's Placement**
  The wasp lands on the **sphexish** side, for the **same reason** as Case One. The wasp's end is to provision the larva. When you move the cricket, the end is defeated (the cricket is not in the burrow). But the trigger (cricket at threshold) remains. The wasp repeats the loop. Like Elias, the wasp is sensitive to the immediate conditions but insensitive to the defeat of the purpose. It does not matter that the wasp's loop is shorter than Elias's; structurally, both are executing means that have been severed from their ends.

  **The Weight-Carrying Features**
  In **Case One**, the weight-carrying feature is the **Decoupling of Signal from Significance**. Elias treats the GPS command as a command to *drive*, rather than a command to *arrive*. If you remove this feature—if he treats the GPS as a tool for arrival rather than a source of motion—he stops when the destination vanishes.
  In **Case Two**, the weight-carrying feature is the **Subordination of Routine to Reason**. Mrs. Gable's rigidity is a servant to her intent. If you remove this feature—if the whistle-blowing becomes a tic rather than a signal—she would continue blowing it even if the school burned down.

  **The Pushback**
  A critic might say: *"You've just defined 'sphexish' as 'acting without a reason' and 'non-sphexish' as 'acting with a reason,' then reverse-engineered a criterion to sort them that way. You haven't solved the problem; you've just labeled it."*

  My response is that the *worry* about sphexishness was never about mechanics; it was about meaning. When philosophers worry we are like the wasp, they aren't worried that our atoms are determined; they are worried that our actions might be decoupled from our values. If I define the criterion by variability, I miss the worry (since Elias varies but is lost). If I define it by determinism, I miss the worry (since Mrs. Gable could be determined but is purposeful). The criterion must track the *fear*, not the physics. If this criterion feels circular, it is because the concept of sphexishness is itself circular: it is the fear that we are acting without a 'why.' My criterion simply makes that 'why' the testable variable. If you remove the sensitivity to the 'why,' you have removed the only thing that distinguishes an agent from a thermostat, regardless of how complex the thermostat becomes.
