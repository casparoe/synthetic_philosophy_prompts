answer: |-
  You have stumbled upon the demarcation problem of evolutionary psychology, a debate that has occupied philosophers of science and biologists for forty years. Your intuition is sharper than the principle you have articulated. Your stated principle relies on *temporal priority* (prediction before data), but as you noted, that fails to distinguish the morning-sickness hypothesis from the waist-to-hip hypothesis. Both made predictions; both had data available.

  The principle that actually governs your seven verdicts is not about *when* the prediction was made, but about *what anchors the prediction*.

  ### The Principle: Independent Biological Anchoring

  An evolutionary explanation counts as science when the "selective pressure" it posits can be measured **independently of the psychological trait itself**, and when the trait's **fine structure maps onto hard biological constraints** rather than statistical correlations.

  In the "science" cases, the problem exists in the physical world regardless of whether the mind solves it. In the "storytelling" cases, the problem is often inferred from the existence of the mind's solution, or the link between problem and solution is flexible enough to accommodate almost any outcome.

  Here is how this principle sorts your seven verdicts, resolving the morning-sickness versus waist-to-hip conflict.

  **1. The Science Verdicts (Anchored in Hard Biology)**
  *   **Disgust:** The selective pressure (pathogens, parasites, teratogens) exists independently of the feeling. We can measure bacterial loads or toxin levels without asking a subject if they are disgusted. The "fine structure" (facial expression, physiology) maps onto the rejection of these specific independent threats.
  *   **Morning Sickness:** This is the crux of your dilemma. Why is this science while WHR is not? Because the "window of vulnerability" (organogenesis) is a hard physiological fact independent of the mother's psychology. The embryo *is* vulnerable to teratogens between weeks 6 and 18 regardless of whether the mother vomits. The theory predicts that nausea *must* align with this independent biological clock. If nausea peaked during lactation, the theory would die. It is anchored in embryology, not just behavior.
  *   **Kin-Directed Care:** Relatedness ($r$) is mathematically definable via genetics, independent of the behavior. Hamilton's Rule predicts a specific *scaling* of sacrifice based on this independent variable. The ordering (sibling > cousin > stranger) was a deductive necessity of the math, not a post-hoc observation of who people like.

  **2. The Storytelling Verdicts (Anchored in Inferred Social States)**
  *   **Waist-to-Hip Ratio (WHR):** Here is where your principle needed repair. The WHR hypothesis predicts a preference based on a *statistical correlation* (0.7 correlates with fertility). However, fertility is not *determined* by WHR in the way embryonic vulnerability is determined by time. A woman with a 0.8 ratio can be fertile; a woman with 0.7 can be infertile. The link is noisy. Furthermore, the "problem" (identifying fertility) is often defined by the existence of the preference itself. The theory is robust to variation (if men prefer 0.8 in Population B, theorists argue "local conditions differ"), whereas the morning-sickness theory is fragile (if nausea doesn't stop after week 18, the theory breaks).
  *   **Emotional Tears:** The "problem" (signaling need) is inferred from the crying. Can we measure "need" independently of tears? We can measure distress, but the claim that tears *specifically* evolved for signaling (rather than being a byproduct of lacrimal gland overflow during distress) is hard to anchor. The fine structure (salt content, flow rate) does not map onto a hard constraint as clearly as the disgust facial mapping maps onto pathogen avoidance.
  *   **Depression as Bargaining:** The "problem" (extracting care) is a social state that is notoriously difficult to measure independently of the depressive behavior. Did the subject withdraw to bargain, or did they withdraw because of pathology? The theory explains the *existence* of the symptom well, but struggles to predict the *fine structure* (why this duration? why this severity?) without resorting to post-hoc rationalizations about "leverage."
  *   **Music:** The "problem" (group bonding) is vague. Did ancestors need music to bond, or did they bond and use music? Unlike the pathogen load for disgust, "bonding need" is not an independent variable we can measure in the Pleistocene.

  ### Do You Need to Surrender a Verdict?

  You do not need to surrender any of your seven verdicts if you adopt the **Independent Biological Anchoring** principle. It cleanly separates the two cases you struggled with (Morning Sickness vs. WHR) by distinguishing between a *physiological constraint* (embryonic development) and a *statistical cue* (body shape).

  However, if you wish to tighten your character's skepticism, the **Depression** hypothesis is the most vulnerable of your "storytelling" pile to becoming science. Unlike music or tears, depression has measurable physiological costs (inflammation, metabolic change) and specific triggers (social loss) that could, in principle, be anchored independently. If your character wants to be ruthlessly consistent, she might admit that depression is "borderline," whereas music is "pure storytelling." But for now, your intuition holds.

  ### The Case of Blushing

  How does this principle handle the hypothesis that blushing exists to advertise sincerity?

  **Verdict: Leans toward Science.**

  **Reasoning:**
  1.  **Independent Anchor:** The "problem" is the risk of social exclusion following a norm violation. This is a measurable social reality independent of the blush.
  2.  **Fine Structure/Constraint:** Blushing is **involuntary**. This is the critical design feature. If blushing were voluntary, it would be cheap talk (easy to fake). The fact that it is physiologically costly (visibility to predators/Enemies, loss of composure) and *cannot be turned off* anchors it as a "hard-to-fake" signal (Zahavi's Handicap Principle).
  3.  **Prediction:** The theory predicts blushing should occur *only* when a norm is violated and the violation is observed. It should not occur when one is alone, or when the violation is trivial. This is a testable constraint on the trait's triggers.

  Your character would likely classify this as "plausible science" provided the emphasis is on the *involuntariness* as the adaptive design feature, rather than just the existence of the redness.

  ### The Epistemic Limit

  You ask whether any of this can be kept distinct from storytelling without leaning on evidence you could not possibly have.

  The honest answer is **no**.

  To truly distinguish science from storytelling in evolutionary psychology, one needs three things that are rarely available:
  1.  **Comparative Data:** Do other primates blush? (If yes, the function might be physiological, not social).
  2.  **Heritability Estimates:** Is the trait genetic or cultural?
  3.  **Cost-Benefit Analysis:** Can we quantify the fitness cost of the trait against the benefit?

  As a novelist, you are working with a heuristic, not a proof. The **Independent Biological Anchoring** principle is a valid *heuristic* for your character. It allows her to distinguish between explanations that rely on the hard machinery of the body (embryos, pathogens, genes) and those that rely on the soft machinery of social inference (bonding, bargaining, signaling).

  **Advice for the Book:**
  Let your character admit this limitation. Her "sour mood" comes from knowing that without a time machine or a genetic sequencer for extinct ancestors, the line between science and storytelling is always slightly porous. She can defend her convictions using the principle of **Constraint Specificity**, but she should acknowledge that a new piece of evidence (e.g., finding that WHR preference is culturally learned, or that morning sickness is actually caused by hormones unrelated to toxins) could flip a verdict. That uncertainty is where the drama lies. She is not a judge delivering final verdicts; she is a scientist weighing probabilities in the dark.
