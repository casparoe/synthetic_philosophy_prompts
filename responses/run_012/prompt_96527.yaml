answer: |-
  This is a classic case of **conceptual engineering masquerading as metaphysical discovery**. You are not arguing about the brain; you are arguing about the utility of the word "computer" as a natural kind term.

  Here is the diagnosis of the impasse, a pushback on your hypothesis, and a concrete proposal for what counts as progress.

  ### 1. The Diagnosis: Ontology vs. Methodology
  The impasse persists because Camp A and Camp B are answering different questions, but they are both framed as "Is the brain a computer?"

  *   **Camp A (The Model-Theorists):** They are treating computation as a **descriptive stance** (akin to Dennett's Intentional Stance). For them, "computation" is a mapping relation between physical states and formal states. Since mappings are interest-relative, the claim "the brain computes" is trivially true but ontologically shallow. Their actual claim is: *"Computational descriptions are useful tools."*
  *   **Camp B (The Mechanists):** They are treating computation as a **causal natural kind**. They believe there is a fact of the matter about whether a system is processing information, independent of an observer. Their actual claim is: *"There is a specific causal architecture (representation + rule-following) that explains cognition, and rocks don't have it."*

  The shouting happens because Camp A hears Camp B making a metaphysical claim and shouts "Triviality!" (Putnam's argument), while Camp B hears Camp A making a methodological claim and shouts "Empty Tautology!"

  The "verbal dispute" label is partially correct, but it understates the stakes. This is a dispute about **Naturalized Normativity**.
  *   Computation implies syntax, and syntax implies correctness conditions (a state can be *wrong*).
  *   Physics has no "wrong" states, only different states.
  *   **Camp B** needs to explain how normativity arises from brute physics without smuggling in a homunculus (the "representation" charge Camp A levels).
  *   **Camp A** dissolves the problem by making normativity observer-relative.

  ### 2. Pushback on Your Hypothesis
  You hypothesize that "most of this is the verbal/aims thing and a smaller chunk is a real crux about implementation criteria."

  **I disagree.** The "implementation criteria" crux is not a smaller chunk; it is the **entirety** of the substantive disagreement. You suggest we would know which is which if someone showed that "implementation can be pinned down by a system's causal structure alone."

  **Gualtiero Piccinini has essentially done this.** His *Mechanistic Account of Computation* argues that computation is defined by functional mechanisms organized to manipulate vehicles according to rules. He explicitly tries to pin implementation to causal structure to avoid Putnam-style triviality.

  **Camp A still rejects it.** Why? Because they argue that identifying a mechanism as "computational" still requires an observer to decide which causal features count as "functional" and which count as "noise."

  Therefore, the impasse is not due to a lack of a formal criterion. It is due to a disagreement about **Realism**.
  *   Camp B are **Realists** about computation (it's in the world).
  *   Camp A are **Anti-Realists/Instrumentalists** about computation (it's in the map).

  No theorem or experiment will settle Realism vs. Instrumentalism. That is a philosophical prior. If you think "computation" names a mind-independent feature of the universe, you are Camp B. If you think it names a useful abstraction layer, you are Camp A. You cannot prove one prior wrong with empirical data because they interpret the same data differently.

  ### 3. The Hidden Formal/Empirical Question
  You asked if there is a hidden question doing the work. There is one, but it's not about implementation criteria. It is about **Discreteness and Error-Correction**.

  Camp B's second suggestion (discrete, error-correcting character) is the only empirical hook that matters.
  *   **Digital Computation** requires discrete states and mechanisms to correct drift (noise).
  *   **Analog Dynamics** are continuous and sensitive to initial conditions.

  **The Empirical Crux:** Does the brain possess *physical* mechanisms dedicated to maintaining discrete states against thermal noise (like a transistor), or is it a noisy analog system that we *model* as discrete for convenience?

  *   If the brain is fundamentally analog/dynamical, Camp B's "literal computation" claim collapses (or requires a radical redefinition of computation).
  *   If the brain has biological error-correcting codes (e.g., in spike timing or synaptic weights), Camp B has a physical foothold.

  Currently, neuroscience is ambiguous. Some circuits look digital (retina), some look analog (dendrites). This ambiguity fuels the fire. Camp A says, "See, it's just a model." Camp B says, "We haven't found the code yet."

  ### 4. What Counts as Progress?
  Do not look for a theorem. Putnam's triviality theorem already exists, and Camp B ignores it (rightly, for their purposes). Do not look for an experiment. Neuroscience will just produce more data that both sides claim supports them.

  **Progress requires a Category Shift.**

  You need to stop asking "Is the brain a computer?" and start asking: **"Is the Computational Level of Analysis Indispensable?"**

  This shifts the debate from metaphysics (what *is* it?) to pragmatism (can we explain it otherwise?).
  *   **The Test:** Can we build a complete, predictive model of cognition using *only* dynamical systems theory (differential equations, attractors) without invoking symbols, rules, or representations?
  *   **If Yes:** Camp A wins. Computation was just a convenient gloss on dynamics.
  *   **If No:** If dynamical models fail to capture systematicity, compositionality, or generalization without smuggling in computational structure, then Camp B wins. Computation is *indispensable*, which functionally amounts to it being "real" for scientific purposes.

  ### 5. Recommendation
  Your group is stuck because "Is the brain a computer?" is a **Verbal Totem**. It signals tribal affiliation (Rationalist/Materialist vs. Embodied/Enactive) rather than tracking a specific falsifiable claim.

  **Here is the path to dissolve the argument:**

  1.  **Adopt the "3 Senses" Suggestion:** The guy who suggested splitting the claim into (Description, Implementation, Explanation) is closest to the solution. Formalize this.
      *   **Sense 1 (Trivial):** Is there a mapping? (Yes, always. Camp A wins.)
      *   **Sense 2 (Mechanistic):** Are there discrete, error-correcting causal structures? (Empirical question. Unknown.)
      *   **Sense 3 (Explanatory):** Is the computational vocabulary indispensable for prediction? (Pragmatic question. The real debate.)
  2.  **Force the Normativity Concession:** Ask Camp B explicitly: "Where does the 'correctness' condition come from physically?" If they cannot point to an etiological function (evolutionary history) or a control-theoretic goal state without referencing an observer, they are smuggling in normativity. If they *can* point to homeostasis or evolutionary fitness, they have a stronger case, but it shifts the definition of computation to "goal-directed control."
  3.  **Admit the Ill-Posed Nature:** The honest answer is that you should stop expecting the argument to end *as currently framed*. The question "Is X a Y?" where Y is a human-invented category (computer) and X is a complex natural system (brain) does not have a binary truth value. It has a **utility value**.

  **Final Verdict:**
  The debate is 80% verbal/aims (Instrumentalism vs. Realism) and 20% empirical (Discreteness/Noise). You cannot resolve the 80% with evidence. You must resolve it by **agreeing on what you want the word 'computation' to do.**

  If you want it to mean "causal mechanism distinct from analog dynamics," Camp B is right, but the bar is incredibly high.
  If you want it to mean "useful abstraction for cognitive science," Camp A is right, but the claim is trivial.

  **Tell your Discord:** "We are arguing about whether 'computation' is a natural kind or a tool. Let's stop asking if the brain *is* one, and start asking if we can model it *without* one. If we can't, the distinction doesn't matter."
