      *   *Critique:* This feels too optimistic about the "verbal" resolution. The "implementation criteria" crux *is* the metaphysical/semantic knot. It's not a "smaller chunk"; it's the core. If you solve the implementation criteria, you solve the verbal dispute because the terms will snap into place.
      *   *Pushback:* The user suggests we'd know which is which if someone showed "every physical system implements something" OR "implementation can be pinned down by causal structure alone."
      *   *Problem:* Putnam already argued the former (triviality). Piccinini and others argue the latter (mechanistic computation). The debate persists *because* both arguments exist and rely on different priors about what "computation" refers to (mathematical abstraction vs. physical mechanism).
      *   *Real Issue:* It's not just verbal. It's a clash between *functionalism* (A) and *mechanism* (B), disguised as a definition fight. It's also about *normativity*. Computation implies correctness conditions (syntax). Physics doesn't. Where does the normativity come from?

  4.  **Formulate the Diagnosis:**
      *   **Is it merely verbal?** No. It's *partially* verbal, but the verbal disagreement tracks a substantive disagreement about *natural kinds*.
      *   **The Core Tension:** It's about **Normativity vs. Description**.
          *   Camp A treats computation as a *descriptive lens* (model-theoretic).
          *   Camp B treats computation as a *causal natural kind* (ontological).
      *   **The Hidden Question:** It's not just about implementation criteria. It's about **Teleology**. Camp B needs "representation" and "rules" which imply "correctness." Physics doesn't have "incorrect" states, just different states. Camp B needs a naturalized account of teleology (etiological functions?) to make their view work without smuggling in homunculi. Camp A avoids this by making computation observer-relative.
      *   **The "Triviality" Charge:** Putnam's triviality theorem is mathematically sound but pragmatically weak. Camp B knows this but insists there's a *privileged* mapping. Camp A says privilege is interest-relative.
      *   **The User's "Smaller Chunk" Claim:** I need to push hard here. The implementation criteria *is* the battleground. It's not a small chunk. It's the whole war.

  5.  **Determine What Counts as Progress:**
      *   **Theorem?** Unlikely to settle it. Putnam's theorem exists; people ignore it or qualify it.
