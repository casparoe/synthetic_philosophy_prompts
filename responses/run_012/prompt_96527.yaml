      *   **Distinction?** Yes, but specifically distinguishing *Computationalism as Ontology* vs. *Computationalism as Methodology*.
      *   **Admitting Ill-Posed?** The question "Is the brain a computer?" is likely a category error. It asks for a binary classification on a spectrum of abstraction.
      *   **Best Path:** Shift from "Is it?" to "Under what conditions is the computational description *causally explanatory* rather than just *post-hoc descriptive*?" This aligns with Camp A's "explanatory work" but respects Camp B's "causal mechanism" demand.

