answer: |-
  *(Lights dim. You step up to the mic, adjusting the stand. You look tired, like someone who has been grading undergrad logic proofs for six hours.)*

  Hi everyone. For those who don't know me, I'm in Decision Theory. Which means I spend my life trying to formalize what it means to make a "rational choice." And honestly? It's great for party conversation. People always ask, "Does studying philosophy change how you live?" And I say, "Absolutely. I don't make choices anymore. I maximize expected utility."

  Which is how I got mugged last week outside of The Daily Grind.

  Guy steps out of the alley. Knife out. Classic setup. But he doesn't want cash. He looks me in the eye and says, "Give me your wallet, or I will press this button and torture $3 \uparrow\uparrow\uparrow 3$ people in a simulated dimension."

  Now, a normal person hears "simulated dimension" and thinks "crazy person." But I'm a formal epistemologist. I hear "non-zero credence."

  I stopped. I did the math in my head. Let $P$ be the probability he's telling the truth. It's tiny. Let's say $10^{-50}$. But the disutility of $3 \uparrow\uparrow\uparrow 3$ tortured souls? That is *astronomical*. $P \times U$ still outweighs the disutility of losing my wallet. So, rationally? I handed it over.

  He looked confused. He's holding the knife, expecting a struggle. He says, "Wait, really? Just like that?"

  I said, "The expected value is positive. Take the Visa."

  Then he gets greedy. He sees I'm compliant. He says, "Okay, uh... also give me your car keys."

  Now, losing my car is way worse than losing my wallet. Higher cost. But the threat hasn't changed. The number of tortured people is still $3 \uparrow\uparrow\uparrow 3$. So the expected disutility of *not* complying is *still* infinite. Or near enough. So I hand over the keys.

  He's staring at the keys. He's looking at the knife. He's looking at me. He says, "Man, usually I have to stab someone by now. Give me your phone too."

  I give him the phone.

  He's getting unnerved. He says, "Okay, look, this is getting awkward. Come with me. I need a butler. For life. No pay. You just clean my basement and listen to me talk about my mixtape."

  Now, this is the *reductio*. This is where the intuition screams "No." Losing my autonomy forever is a massive utility hit. But I ran the numbers again. As long as the probability of the threat is non-zero, and the disutility of the torture is unbounded... the math still checks out.

  So I said, "Lead the way, sir."

  We start walking. He's walking fast, trying to lose me, but I'm keeping pace. He stops, turns around. He's actually sweating. He says, "Why are you doing this? This is insane. You're throwing your life away for a story about a magic button."

  And I said, "I know! I know it's absurd! But I can't locate the cutoff point! If I say 'no' to the butler thing, why didn't I say 'no' to the wallet? At what exact dollar amount does the probability become negligible enough to ignore? Is it $50? $5,000? My life? If I draw the line anywhere, I'm being arbitrarily risk-averse!"

  He says, "Just... just put a cap on it! Bound your utility function! Decide that $3 \uparrow\uparrow\uparrow 3$ people doesn't matter more than $3 \uparrow\uparrow\uparrow 4$ people!"

  *(You pause, look out at the audience, specifically glancing at your advisor if they're there.)*

  And I wanted to. God, I wanted to. My advisor loves that move. "Just bound the utility, problem solved." But come on. That feels like a dodge. It's like solving a zoning violation by declaring that buildings can't be taller than the sky. It stops the problem, but it doesn't solve the *structure*. If I bound my utility, I'm admitting that an infinite amount of suffering is mathematically equivalent to a finite amount. I can't sleep at night knowing I'm an agent with a discontinuous utility function.

  So I told him, "Sorry. Unbounded. Let's go."

  He dropped the knife. He literally dropped the knife. He said, "I can't mug you. You're too expensive. The overhead on this threat is too high."

  He ran away.

  But here's the thing. I'm standing there, in the dark, without my wallet, my phone, or my car. And I'm still not safe. Because now I'm wondering... if I walk home, and there's a non-zero chance I trip and die, does the expected disutility of that outweigh the cost of buying a taxi?

  *(You check your watch.)*

  Actually, looking at the time, the probability of me bombing this set is non-zero, and the disutility of awkward silence is... well, it's a department party. It's already infinite.

  So by the logic of expected utility, I should probably just keep talking forever.

  *(Beat.)*

  Thank you, everyone. Happy holidays. Don't bound your functions.
