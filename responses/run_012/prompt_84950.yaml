  3.  **Drafting the Analysis - Section by Section:**

      *   **Criteria Mapping:** I need to define what makes a "Hinge."
          *   *Leverage:* Small input, huge output difference.
          *   *Irreversibility:* Once the path is taken, you can't go back.
          *   *Window:* Was it narrow? Could this have happened in 1980 instead?
