      *(Self-Correction)*: Make sure I explicitly state what counterfactual would disprove the hinge status. (e.g., If the US government was already planning strict regulation regardless of the conference).

      *(Self-Correction)*: Make sure I explicitly state which step of *my* reasoning is weakest. (Likely the assessment of the counterfactual regulatory landscape of 1975).

