          *   *Leverage:* High? The guidelines shaped the *culture* of biosafety. But was the science inevitable?
          *   *Irreversibility:* The tech was released. The norms stuck.
          *   *Window:* Narrow? The tech was *just* becoming possible. A few years earlier, impossible. A few years later, chaos.
          *   *Counterfactual:* If no Asilomar -> Public backlash? Heavy-handed regulation stifling industry? Or a bio-accident early on killing the field?
      *   **Addressing the "Governance vs. Luck" Hunch:**
          *   This is the core philosophical tension.
          *   If Hinges = Governance, then every new tech has a hinge. That dilutes the "We are special" claim.
