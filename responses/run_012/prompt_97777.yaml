prompt: |-
  Okay so I'm a novelist, and through a series of questionable decisions I've ended up teaching this upper-level seminar — "Minds, Texts, Strange Loops," something like that — and the final exam is on me. I need one essay question about whether a book could be conscious. Trouble is, every answer I'm gonna get is some reheated version of the Chinese room or "well the Turing test can't tell," and I want them actually thinking instead of reciting.

  Here's the hook I want the question built around (use it or somthing in its spirit): I've been kicking around a novel where each chapter is about someone reading the chapter before it, and the last chapter is about someone reading the first — so it closes the loop, the text folds back onto itself. And it's a choose-your-own-path thing, so no two readers ever get quite the same book. So: could that book, or the reading of it, be conscious? If yes, where does the mind live — in the paper, in the reader, or in the looping event between them? And what does your answer commit you to about whether consciousness needs a particular kind of stuff or just a particular kind of organization?

  Please write me three things: the exam question itself (aimed at upper-level undergrads, 50-minute essay, no notes, and I don't want it to hinge on them quoting anything), a model answer of around 600 words, and a marking scheme with five must-hit points totalling 20 marks, plus a one-liner per point on how students usually get it wrong.
