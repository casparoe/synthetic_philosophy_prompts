answer: |-
  Yes, the established term you are reaching for is **the looping effect** (or **the looping effects of human kinds**), coined by the philosopher of science **Ian Hacking**.

  You are not getting Hacking wrong, but you have identified a specific *valence* of the looping effect that is often less emphasized than the disruptive variety. Hacking's core thesis is that "human kinds" (classifications of people) are **interactive**: unlike "indifferent kinds" (like quarks or trees), human kinds change when they are classified because people become aware of the classification and adjust their self-conception and behavior accordingly.

  However, your description highlights a specific configuration: a **stabilizing** or **reinforcing loop** that generates an **illusion of increased validity**. Hacking often illustrates looping with examples where the classification *breaks* or becomes unstable (e.g., the shift from "multiple personality disorder" to "dissociative identity disorder" as patients and doctors co-evolved the symptoms). You are describing the opposite: a loop where the population drifts *toward* the classification, making the tool appear *more* accurate over time.

  Here is the sharp distinction you requested, separating the settled literature from the contested mechanisms, and distinguishing this from adjacent concepts.

  ### 1. The Core Term: The Looping Effect
  **Status:** Settled terminology in philosophy of psychiatry and social science.
  **Definition:** The dynamic interaction between a classification of people and the people classified, where the existence of the classification causes changes in the classified people, which in turn necessitates changes in the classification (or changes the fit of the classification).

  **Your Specific Configuration:**
  What you are describing is a **Stabilizing Loop** (sometimes called a **Positive Feedback Loop of Validation**).
  *   **Standard Hackingian Loop:** Classification $\rightarrow$ People Change $\rightarrow$ Classification no longer fits $\rightarrow$ New Classification needed. (Destabilizing)
  *   **Your Loop:** Classification $\rightarrow$ People Change (accommodate) $\rightarrow$ Classification fits *better* $\rightarrow$ Confidence in Classification increases. (Stabilizing/Reinforcing)

  **Why it looks like "working":** From inside the practice, the correlation between the measure and the population increases. In psychometrics, this would look like improved **predictive validity**. However, ontologically, the "construct" being measured has shifted to align with the "instrument."

  ### 2. The Adjacent Term: Performativity
  **Status:** Settled in Science and Technology Studies (STS) and Economic Sociology; contested in application to medicine.
  **Definition:** The theory that descriptions of the world (theories, models, schemes) do not merely describe reality but **enact** it. A theory is "performative" if its application makes the world behave more like the theory predicts.
  **Relevance to you:** This is the precise term for the mechanism where "the scheme fits better than it did at the start."
  *   **Distinction from Looping:** Hacking's *Looping Effect* focuses on **identity and kinds of people** (how I understand myself). *Performativity* (associated with Michel Callon and Judith Butler) focuses on **systems and behaviors** (how the market or the clinic functions).
  *   **Overlap:** In your medical example, the questionnaire is a "theory" of the patient's interiority. By using it, the clinic *performs* the patient into a shape that the questionnaire can read.
  *   **Why use this term?** If you want to emphasize the **epistemic illusion** (the scheme looks more accurate), "Performativity" is often sharper than "Looping." If you want to emphasize the **change in the person**, "Looping" is sharper.

  ### 3. Distinctions from Adjacent Concepts

  You asked for sharp distinctions. Here is how your phenomenon differs from the three most common confusions:

  #### A. vs. Self-Fulfilling Prophecy (Robert Merton)
  *   **The Mechanism:** A *false* definition of a situation evokes new behavior which makes the originally false conception come *true*.
  *   **The Difference:**
      *   **Truth Value:** A self-fulfilling prophecy starts with a *falsehood* (e.g., "This bank is insolvent" $\rightarrow$ run on bank $\rightarrow$ bank becomes insolvent). Your phenomenon starts with a *scheme* that may be arbitrary or approximate, but the end result isn't necessarily "false," just **co-constituted**.
      *   **Scope:** SFP is usually event-based (a specific prediction). Looping/Performativity is structural (a classification system).
      *   **Visibility:** In SFP, the causal link is often visible (the rumor caused the run). In your looping case, the drift is **invisible**; it looks like discovery, not creation.

  #### B. vs. Measurement Reactivity (Hawthorne Effect)
  *   **The Mechanism:** Subjects alter their behavior *because* they know they are being observed.
  *   **The Difference:**
      *   **Duration:** Reactivity is typically transient (during the study). Your phenomenon describes a **persistent structural change** in the population that persists across generations or cohorts.
      *   **Integration:** In reactivity, the change is "noise" to be controlled for. In your looping case, the change is **absorbed into the validity** of the measure. The "noise" becomes the "signal."
      *   **Awareness:** Reactivity requires conscious awareness of observation. Looping can occur through unconscious self-reorganization (e.g., learning a vocabulary for feelings and genuinely feeling them differently).

  #### C. vs. Concept Creep (Nick Haslam)
  *   **The Mechanism:** Psychological concepts (e.g., "trauma," "bullying") expand their semantic boundaries over time to include milder or broader phenomena.
  *   **The Difference:**
      *   **Direction of Fit:** Concept Creep is about the **definition moving** to cover more people. Your phenomenon is about the **people moving** to fit the definition (or both).
      *   **Example 2 in your prompt:** This is actually a hybrid. The category naming a "broad and ordinary cluster" is Concept Creep. The fact that the population *became* that cluster because of the category is the Looping Effect.
      *   **Settledness:** Concept Creep is a descriptive trend in psychology. Looping is an ontological claim about how social kinds exist.

  ### 4. Settled vs. Contested in the Literature

  You suspected the existence is agreed upon but the mechanics are not. You are correct.

  **Settled:**
  *   **Existence:** It is widely accepted in philosophy of psychiatry, STS, and medical sociology that classifications of people interact with the people classified. (Hacking, 1995; Bowker & Star, 1999).
  *   **Indeterminacy:** It is agreed that once a loop is active, it is often empirically impossible to distinguish between "better measurement" and "population drift" without external anchors (which rarely exist for social kinds).

  **Contested:**
  *   **Normativity:** Is this bad? Some argue this is how social progress works (e.g., classifying "sexual harassment" created the category which allowed people to identify and stop the behavior). Others argue it is **ontological pollution** (manufacturing disorders to fit screens).
  *   **Mechanism:** Is it cognitive (people learn the script) or material (institutions reward the script)?
  *   **The "Validity" Question:** There is no consensus term for the *inflation of validity* you described. In psychometrics, this is sometimes flagged as **Construct Drift** or **Construct Contamination**, but those terms imply error. Your observation is that the system treats it as *success*. Some critical theorists call this **Circular Validation**, but it is not a standardized technical term.

  ### Summary Recommendation

  If you are writing for a **philosophical or sociological audience**, use **The Looping Effect** (Hacking), but specify that you are analyzing a **stabilizing/reinforcing variant** that produces **epistemic opacity**.

  If you are writing for a **psychometric or clinical audience**, they may not know Hacking. Use **Construct Drift** or **Measurement-Induced Population Shift**, but note that these are descriptive terms for a phenomenon best theorized as **Performativity**.

  **The precise phrase for the "invisible drift that looks like accuracy":**
  There is no single settled noun for this specific *feeling* of accuracy, but the dynamic is best described as **Performative Validation**. This captures the "scheme fits better" (Validation) and the "scheme made it fit" (Performative) without implying dishonesty.

  **Key Reference:**
  *   Hacking, I. (1995). *The Social Construction of What?* (Specifically the chapter on "Making Up People").
  *   Callon, M. (1998). "The Laws of the Markets." (For the Performativity angle).
  *   Haslam, N. (2016). "Concept Creep." (For the semantic expansion angle).
