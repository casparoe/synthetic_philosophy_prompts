  5.  **Drafting the Advice for the Character:**
      *   Create specific lines she can say.
      *   Identify where she should pause or acknowledge counter-arguments.
      *   Address the "Intentionality = Goals/Response" issue directly.

  6.  **Refining the "Intentionality" Definition Issue:**
      *   The trade book claims intentionality = "having goals and responding to surroundings."
      *   *Correction:* Intentionality is "aboutness" (representing states of affairs). Goals are part of it, but "responding to surroundings" is too broad (a rock responds to gravity).
      *   Dennett views it as a *pattern* detectable by an interpreter.
      *   Searle views it as a *biological causal power*.
