      *   *Defer: Interaction with x-risk (5).* This is strategic, not conceptual. Let the strategists handle it once the conceptual work is done. (0 researcher-years).
      *   *Defer: Mechanism (Intentional vs Incidental).* Merge into Pathways. The distinction isn't load-bearing for prevention.

  7.  **Drafting the Content - Section by Section:**

