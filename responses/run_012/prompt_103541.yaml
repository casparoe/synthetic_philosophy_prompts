answer: |-
  Here is the plan for your fifty minutes. It is designed to close off escape routes before you even present the problem, forcing the group to confront the structural contradiction rather than the narrative details.

  ### 1. The Opening Move: The Contract (0–5 Minutes)
  Your instinct is correct: you cannot state the mugging until they accept the machinery of Expected Value (EV). However, do not *teach* EV. If you lecture, the philosophers will critique your definitions and the arguers will get bored. Instead, **elicit a contract.**

  *   **The Whiteboard:** Write $E = P \times U$.
  *   **The Move:** Ask the room: "If we agree that rational decision-making under uncertainty means maximizing this product, are there any values of $P$ (probability) so small that we agree the product *must* be zero, regardless of $U$ (utility)?"
  *   **The Trap:** If they say "Yes, if $P$ is small enough," they have abandoned standard decision theory (and opened the door to ignoring existential risks, which the CS folks will hate). If they say "No," they have admitted that a sufficiently large $U$ can outweigh any small $P$.
  *   **The Goal:** Get them to verbally agree to the principle: **"Non-zero probability times arbitrary utility yields a valid expected value."** Write this on the board. This is the cage. Everything that follows is simply showing them they are inside it.

  ### 2. The Carrying Example: Adopt the "Slow Mugging" (5–20 Minutes)
  **Verdict:** Reject the Alley Mugger. Adopt your colleague's "Slow Mugging."

  **Why reject the Alley Mugger?**
  The Alley Mugger relies on *narrative plausibility*. It invites the room to debate the *credibility of the speaker* ("He looks like a liar," "He has no magic powers") rather than the *logic of the decision*. In a 50-minute session, you cannot separate the epistemology (is he lying?) from the decision theory (if he isn't, what do you do?). The "he's lying" objection is a psychological shield, not a theoretical rebuttal. Using it wastes time fighting a straw man.

  **Why adopt the Slow Mugging?**
  Your colleague's variant is the superior pedagogical tool because it isolates the **unbounded utility function** as the variable. It removes the distraction of "infinity" (which people treat as a magic get-out-of-jail card) and replaces it with a function.

  **How to run it:**
  1.  **Setup:** "Imagine a machine. You can pay \$5 to activate it. The machine claims it will generate a reward $R$."
  2.  **The Function:** "The machine does not promise a fixed reward. It promises a reward defined by the probability you assign to it working. If you assign probability $p$, the reward $R$ is set to $\$10 / p$."
  3.  **The Calculation:** "If you think there is a 1% chance it works ($p=0.01$), the reward is \$1,000. $EV = 0.01 \times 1000 = \$10$. Cost is \$5. You buy."
  4.  **The Squeeze:** "Now, be more skeptical. Say there is only a 1 in a billion chance ($p=10^{-9}$). The machine adjusts the reward to \$10 billion. $EV = \$10$. You still buy."
  5.  **The Climax:** "How skeptical must you be before you refuse? If you say $p = 10^{-100}$, the reward is $10^{101}$. To refuse, you must claim the probability is *exactly* zero."

  **Why this works:** It makes the absurdity a result of *their* skepticism. The more they try to doubt the claim, the higher the expected value becomes. It forces them to realize that as long as $P > 0$ and $U$ is unbounded, the decision is fixed.

  ### 3. Mapping Misconceptions & Head-Off Points
  Do not wait for these objections to arise; preempt them as you move through the sequence.

  | Misconception | When to Head It Off | How to Head It Off |
  | :--- | :--- | :--- |
  | **"This is just Pascal's Wager."** | **Minute 2 (The Contract).** | Explicitly state: "Pascal's Wager relies on infinite utility and binary choice. This problem works with finite numbers and continuous probabilities. We are testing the math, not the theology." |
  | **"The probability is too small to matter."** | **Minute 5 (The Setup).** | Remind them of the Contract. "We agreed earlier that $P \times U$ holds regardless of $P$'s size. If you change your mind now, you are abandoning EV maximization." |
  | **"The guy is lying / It's a scam."** | **Minute 10 (The Squeeze).** | **Crucial Move:** Invoke the **Principle of Charity**. "We are not testing your street smarts. We are testing your decision algorithm. Stipulate that the mechanism *could* exist. If your decision theory fails when the mechanism exists, the theory is broken, even if the mechanism is rare." |
  | **"This argues for religion."** | **Minute 5 (The Setup).** | By using the Machine/Slow Mugging, you have already secularized the stakes. If anyone raises God, point to the whiteboard: "The variable is $U$, not 'Salvation'. Keep it abstract." |
  | **"I must pay or quit decision theory."** | **Minute 35 (Solutions).** | Save this for the end. Acknowledge it is a *reductio ad absurdum*, not a life guide. The goal is to find the patch, not to hand over your wallet. |

  ### 4. The Turn: Diagnosing the Engine (20–35 Minutes)
  Once they are squirming because the math says they should pay \$5 for a $10^{-100}$ chance of a massive reward, stop the calculation and ask: **"Which variable broke?"**

  Use the whiteboard to offer two levers:
  1.  **The Probability Lever:** Can we set a "probability floor"? (e.g., "Anything below $10^{-50}$ counts as zero.")
      *   *Counter:* The CS folks will object. This bans legitimate scientific hypotheses (e.g., specific particle interactions, rare cosmic events).
  2.  **The Utility Lever:** Can we cap $U$? (Bounded Utility.)
      *   *Counter:* The philosophers will object. Is there really a maximum amount of "good" that can exist? Does saving $10^{100}$ lives really have the same value as saving $10^{100} + 1$?

  **The Goal here:** Do not solve it. Make them feel the cost of each solution. If they cap probability, they blind themselves to rare risks. If they cap utility, they deny the value of scale. The "squirm" comes from realizing both fixes have moral or epistemic costs.

  ### 5. The Final Question (35–45 Minutes)
  You need a question that tests if they understand the *structure* (the relationship between $P$ and $U$) rather than the *story* (the machine/mugger).

  **Ask this:**
  > "If you choose to bound your utility function to stop the mugging, you are admitting that there is a maximum amount of good possible in the universe. **What is that number, and how did you calculate it?**"

  **Why this works:**
  *   If they say "I don't know," they admit their decision theory relies on an arbitrary constant.
  *   If they propose a number, the arguers will attack it.
  *   It forces them to acknowledge that avoiding Pascal's Mugging requires a substantive metaphysical claim (bounded value), not just a mathematical trick.

  ### 6. Out of Scope (Announce this at Minute 45)
  To ensure you finish on time and don't get bogged down, explicitly declare the following **Out of Scope**:
  1.  **Specific Priors:** Do not discuss Solomonoff Induction or specific Bayesian priors. That is a technical fix for a structural problem.
  2.  **Psychological Realism:** Do not discuss whether humans *actually* feel fear or excitement about these numbers. We are discussing rational agents, not human psychology.
  3.  **Theological Debate:** Do not allow the discussion to drift into whether God exists. The Wager is dead; we are discussing the Mugging.

  ### Summary of Flow
  1.  **Contract:** Agree on $E = P \times U$ (No zero-probability exemptions).
  2.  **Example:** Slow Mugging (Reward scales with skepticism).
  3.  **Trap:** Show that increased skepticism increases EV.
  4.  **Diagnosis:** Is the flaw in $P$ (probability floor) or $U$ (utility cap)?
  5.  **Final Question:** "What is your maximum utility bound?"
  6.  **Close:** Acknowledge the problem is unsolved, but the structure is now visible.

  This plan uses the group's formal background (EV) as the weapon against their intuition, uses the "Slow Mugging" to prevent narrative dismissal, and forces a metaphysical admission at the end rather than a false mathematical solution.
