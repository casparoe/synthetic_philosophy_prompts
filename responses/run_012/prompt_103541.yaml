          *   *Pros:* Removes "infinity" confusion. Highlights the *ratio* problem. More abstract/CS-friendly.
          *   *Cons:* Might feel less visceral than torture.
      *   *Decision:* The "Slow Mugging" is superior for this specific group. Why?
          *   CS folks like functions/bounds.
          *   Philosophers like precision.
          *   Arguers can't just say "he's lying" if the mechanism is structural.
          *   It avoids the "Infinity" trap (people think EV breaks only with infinity).
          *   It avoids the "Religion" trap.
      *   *Refinement:* Use a modified Slow Mugging. Make it concrete. A machine, a button, a prediction. Or keep the Mugger but make the reward *finite but adjustable*. Actually, the "Slow Mugging" as described (reward grows as prob shrinks) is the strongest pedagogical tool because it isolates the *unbounded utility* variable. Let's advocate for adopting the Slow Mugging but dressing it slightly to keep engagement high.
      *   *Wait, re-reading the prompt:* The colleague's variant is "reward is an ordinary finite sum, but... growing fast enough that the expected value can be driven above any finite price." This is essentially the standard Mugging but emphasizing the *function* $U(p) \times p > Cost$.
      *   *Recommendation:* Adopt the Slow Mugging. It prevents the "Infinity" dodge. It forces them to confront the *principle* of unbounded utility.
      *   *Rejection of Alley Mugger:* Explicitly reject it. The "he's lying" objection is a *psychological* reaction, not a *decision-theoretic* one. The session is about the theory, not street smarts.

  5.  **Address Question 3: Mapping Misconceptions & Timing:**
      *   *Misconception 1: It's just Pascal's Wager.* -> Head off at the start. Distinguish Wager (binary, infinite) vs. Mugging (continuous, finite/infinite, structural).
      *   *Misconception 2: Small probability is the problem.* -> Head off during the EV setup. Show that small prob *  huge utility = valid EV.
      *   *Misconception 3: Religious conclusion.* -> Head off by using the Slow Mugging (secular).
