      *Self-Correction on "Slow Mugging":* Make sure the facilitator knows *how* to present it. It shouldn't be dry. It needs to feel like a decision. "I will give you $X if you accept probability $p$." No, that's not right. It's "I claim I can do $X$. The probability I am telling the truth is $p$. $X$ is defined as $Cost / p + 1$."
      Actually, the cleanest way is: "I claim I can save $N$ lives. You assign probability $p$. Is $p \times N > \$5$?" If $N$ can be arbitrarily large for arbitrarily small $p$, you always pay.
