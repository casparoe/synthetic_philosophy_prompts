      *   *Key Insight:* It's not about the specific numbers (infinity vs. large finite), it's about the *relationship* between probability and utility.
      *   *Common Pitfalls:* Confusing it with Pascal's Wager, dismissing it as "obviously a lie," thinking it requires actual infinity.

  3.  **Address Question 1: The Opening Move:**
      *   *User's Instinct:* Start with EV under uncertainty and the indifference to absolute probability size if product is fixed.
      *   *Evaluation:* This is technically correct but dry. If you start with abstract math, the philosophers might get bored, and the arguers might get impatient. However, starting with the *story* first risks them dismissing the story before accepting the math.
      *   *Strategy:* A hybrid. Establish the *rule* (Maximize EV) as a shared axiom first. Make them agree to the rule *before* presenting the case that breaks it. This traps them. If they accept the rule, they must accept the conclusion.
      *   *Verdict:* User's instinct is right, but needs framing. Don't teach EV; *elicit* it. "How do we make decisions under uncertainty?" -> "EV." -> "Does the size of the probability matter if the EV is the same?" -> "No." -> *Now* hit them with the mugger.

  4.  **Address Question 2: The Carrying Example:**
      *   *Option A: Alley Mugger.* (Classic Bostrom).
          *   *Pros:* Intuitive, stark.
