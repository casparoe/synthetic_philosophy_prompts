      *Refining the Opening:* The user asks if starting with EV is right. Yes, but make it a *contract*. "We are all Expected Value Maximizers for the next 50 minutes."

      *Refining the "Liar" Objection:* This is the biggest risk. The facilitator must stipulate: "You have a magic truth-o-meter. It says there is a 0.000...1% chance he is telling the truth. Do you pay?"

  9.  **Final Review against Constraints:**
