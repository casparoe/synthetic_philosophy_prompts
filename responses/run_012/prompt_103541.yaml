      *   *Misconception 5: Comply or abandon decision theory.* -> Save for the end (solutions phase). Mention priors, bounded utility, etc.

  6.  **Address Question 4: The Final Question:**
      *   Need to test if they understand the *structural* conflict, not just the story.
      *   Good question: "If you ban this specific mugger, what principle are you banning that also bans legitimate scientific hypotheses?" or "What ceiling are you willing to place on your own values?"
      *   Better: "At what point does a low-probability high-stakes claim become *rationally negligible*, and what rule tells you where that point is?" (Forces them to propose a bound).

  7.  **Address Question 5: Out of Scope:**
      *   Don't solve it. 50 mins is too short.
      *   Don't dive into specific priors (Solomonoff, etc.).
      *   Don't debate the existence of God.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 50 mins is tight.
      *   *0-5:* Setup & Axioms (EV).
      *   *5-15:* The Example (Slow Mugging).
      *   *15-25:* The Trap (Why you can't say no).
      *   *25-35:* Misconceptions (The "Liar" objection).
      *   *35-45:* Implications (Bounded Utility).
      *   *45-50:* Final Question & Wrap.
      *   *Whiteboard:* Use it for the inequality $P \times U > Cost$.

