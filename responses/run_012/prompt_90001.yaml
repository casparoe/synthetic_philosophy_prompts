      *   *Refinement:* It's not just "coin vs. agent." It's about how to update probabilities when indexical information ("I am awake now") is involved. Halvers tend to treat "I am awake" as non-informative. Thirders treat "I am awake now" as sampling from the set of possible awakenings.
