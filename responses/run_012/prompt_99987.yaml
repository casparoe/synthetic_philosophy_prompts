          *   *What gives:* Define EoO narrowly (formal) or broadly (substantive).
          *   *Cost:* Narrow EoO makes (2) a lingering moral worry. Broad EoO requires interference that violates (3).

      *   *The Single Revision:* Focus on (1). The definition of "Merit" is the pivot point. It tries to hold Effort and Performance together, but (5) sacrifices Effort. Aligning (1) with (5) (Merit = Contribution) or (5) with (1) (Merit = Effort) clears up the downstream conflicts with (3) and (6).
      *   *Wait, actually:* The biggest mess comes from the definition of Merit in (1) clashing with the Market Defense in (3) and the Outcome Critique in (6).
      *   *Better Recommendation:* Revise (3). (3) is the bridge. If markets don't track merit (as per 6), why use them? The "Epistemic Humility" argument needs to be more nuanced.
      *   *Actually, looking closer:* The conflict between (1) and (5) is the most direct logical contradiction. (1) says A+B. (5) says B > A. Fixing (1) resolves the definition of justice, which then clarifies (3) and (6).
      *   *Decision:* Recommend revising (1). It's the foundational definition. If you clarify whether Merit is *Effort* or *Contribution*, the rest of the chain (how to reward it, what markets do) becomes easier to arrange.

  6.  **Review against Constraints:**
      *   Audit not lecture? Yes.
      *   Order by severity? Yes.
      *   What gives/Cost? Yes.
      *   Single revision? Yes.
      *   No assumptions on what they want to drop? Yes.

  7.  **Final Polish:** Ensure the language is precise. Use terms like "Normative Foundation" vs "Institutional Mechanism." Make sure the distinction between "Human Worth" (7) and "Economic Reward" (1) is acknowledged as a successful distinction (apparent conflict).

      *(Self-Correction during drafting)*: I need to be careful with (2). (2) is a standard Luck Egalitarian point. It doesn't necessarily contradict (1) if (1) is about *social* reward rules rather than *metaphysical* desert. I will classify (1) vs (2) as an apparent conflict that dissolves with a "Pragmatic vs. Metaphysical" distinction.

      *(Refining the 1 vs 5 tension)*: (1) says "Effort... and how well they end up performing." It allows for both. (5) says Lazy Brilliant > Diligent Unproductive. This implies Performance > Effort. This isn't a contradiction *unless* (1) implies Effort and Performance are weighted equally or Effort is necessary. (1) says "mostly a matter of how much effort... and how well." It's ambiguous. The tension is in the *weighting*. I will frame it as a tension in prioritization.

