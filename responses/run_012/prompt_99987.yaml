      *(Re-evaluating Severity)*:
      1.  (3) vs (6): Institutional consistency. If markets are unjust in high-pay sectors, why trust them generally?
      2.  (1) vs (5): Definition of Merit. Is it effort or output?
      3.  (2) vs (4): Legitimacy of Opportunity.

      Actually, (1) vs (5) is more fundamental. It defines the *goal*. (3) vs (6) is about the *means*. If you don't know the goal, you can't judge the means. I'll put (1) vs (5) as #1.

