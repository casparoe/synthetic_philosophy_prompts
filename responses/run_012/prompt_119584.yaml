answer: |-
  Thank you for being here.

  For those of you who didn't know Danny in the philosophy department, you should know that he was stubborn. Specifically, he was stubborn about truth. He didn't like easy answers, and he didn't like words that tried to make things sound softer than they were.

  We used to walk home from seminar together. For three weeks, we argued about one thing: whether doing nothing can cause something to happen. Danny's position was always the same. He'd say, "If nothing happened, then nothing caused anything. An absence isn't a force."

  He was right, in a way. Physics doesn't track what didn't happen. The universe just tracks what is.

  But standing here, in this courtyard, looking at the workshop window... "nothing" feels very heavy.

  The report isn't out yet. The inquest will determine the legal chain of events. They will need to know about the wiring, and the budget, and the walkthroughs. That is necessary work, and it belongs to them.

  But I think about Danny's argument. Because if he were here, he'd tell me not to hide behind the idea that this was just "an accident." An accident sounds like a lightning strike. Something from nowhere. But this wasn't from nowhere.

  It was a wedge of wood in a doorframe that stayed there for two years. It was an alarm that stayed silent when it was supposed to scream. It was a repair that stayed on a list, but never made it into the budget.

  Danny argued that you can't blame a person for what they didn't do, unless it was theirs to do. He was right about that, too. We cannot carry the weight of every thing we failed to fix. But when we loved someone, the things that didn't happen start to look like the things that matter most.

  I know there is anger here. I know there is guilt. If I try to sort out who owns those absences, I am not qualified, and this is not the place. The inquest will look for the specific break in the chain. But we are not here to build a legal case. We are here to hold the space where Danny should be.

  There is a question in my field about how we pick a "cause" out of a thousand conditions. Is it a fact about the world, or is it a fact about what we care about?

  I think it's about what we care about.

  If we didn't love Danny, the wedge in the door is just wood. The silent alarm is just a broken circuit. They are just conditions. But because we love him, they become causes. They become the places where the world failed to match the expectation that Danny should be safe.

  I am not going to tell you that this makes sense. It doesn't. And I am not going to tell you that I know why.

  Some of you find comfort in the idea that Danny is watching over us now. Danny was a skeptic; he loved the tangible, the greasy chain, the fixed gear, the ground beneath his feet. He would likely roll his eyes at the idea of him looking down from somewhere. But he would also understand that you need to say he is still present. Whether he is in a place beyond this, or simply in the memory we keep of him... the result is the same. We are still talking to him. We are still arguing with him.

  I cannot solve the metaphysics of this tragedy. I cannot tell you if the nothingness that killed him was a cause or just a condition. I can only tell you that the absence he left behind is real. It is an active thing. It changes the air in this room.

  Danny hated neat endings. He hated when people pretended the hard parts were resolved. So I won't say that we will get through this, or that everything happens for a reason. I don't know that.

  I know that he argued for clarity until the end. So the clearest thing I can say is this: We are here. The wedge is gone. The alarm will be fixed. But the absence remains. And we are the ones who have to carry it.

  Thank you.
