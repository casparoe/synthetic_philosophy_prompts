      *   *"Meaning is just majority agreement":* This is the biggest distortion. It's about *normative constraints*, not a vote.
      *   *"Is the community part a cheat?":* This is a very common objection (the "objection from normativity"). The community doesn't necessarily solve the normativity problem just by existing. The user's hunch is philosophically sophisticated.

