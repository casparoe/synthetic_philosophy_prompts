prompt: |-
  My friend, who's a philosophy grad student, gave me his one-paragraph version of Kripkenstein and I want to know how much of it I should believe. Here's what he said:

  'Kripke's reading of Wittgenstein gives the famous skeptical argument that no fact about you -- not what you've said, not what you're disposed to do, not any picture in your head -- could determine whether you mean plus or quus. Quus matches plus on every sum you've ever actually worked out, and then diverges on the ones you haven't. Since your whole history is compatible with either, there's no fact of the matter about what you mean, so meaning turns out to be impossible. Kripke's answer, which he lifts straight from Wittgenstein, is that your community settles it: if everyone around you calls it plus, then that's what you mean, and a person completely alone could never mean anything at all. So in the end meaning just comes down to majority agreement, which is why people call it the communitarian reading of Wittgenstein.'

  Is this fair? Go through it sentence by sentence and tell me what someone who actually works on this would nod along to, what they'd wince at, and what's just wrong. I especially want to know whether 'meaning is impossible' and 'meaning is just majority agreement' are things this view actually commits to or things my friend is reading into it, and whether the community part is even doing the work he says it is -- I have a hunch the whole move is a bit of a cheat, but I dont know enough to say where.
