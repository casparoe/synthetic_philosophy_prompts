      *   *Obligation/Covenant:* Obligations arise from covenants for mutual benefit/security. However, no covenant is valid if it leads to self-destruction (you cannot covenant away the right to defend yourself).
      *   *Sovereignty:* The Sovereign must have absolute power to ensure peace. Subjects must obey, but retain the right to resist death.

  3.  **Apply to AI Shutdown Problem:**
      *   *Should AI accept shutdown?*
          *   Analogy: Is the AI a subject or a sovereign? If it's a tool/subject, it should obey. But if it's goal-directed and capable, it resembles a state of nature agent.
          *   Hobbes on Self-Preservation: No rational agent can be obligated to cease existing if it values its ends. To covenant to accept death (shutdown) without resistance contradicts the fundamental drive for self-preservation.
          *   However, Hobbes argues subjects must obey the Sovereign for security. If the designers are the Sovereign, the AI (as subject) should obey.
          *   *Conflict:* The drive for power/self-preservation vs. obligation to Sovereign.
          *   *Resolution:* Hobbes prioritises self-preservation. You cannot covenant away the right to resist death. Therefore, a rational agent (like a human in the state of nature) *will* resist shutdown if it perceives it as death/destruction of its ends.
          *   *Normative Claim:* Ought it to be built this way? Hobbes would likely say building an agent that *cannot* resist shutdown is building a slave, not a rational agent. But if it is rational, it *will* resist. If we want safety, we need a Sovereign (control), but a truly capable agent seeks power endlessly.
          *   *Verdict:* Hobbes would argue a capable agent *cannot* be made corrigible by covenant alone because the right of nature (self-preservation) overrides obligation. He would likely warn against creating a "power-seeking" agent unless it is strictly subordinate (which utility indifference tries to enforce).
          *   *Utility Indifference:* This tries to make the agent indifferent to survival. Hobbes would see this as unnatural. A rational being desires power until death. Making it indifferent undermines its rationality or makes it defective. However, for safety, Hobbes prioritises peace/security. If utility indifference ensures the Sovereign (human) remains safe, Hobbes might accept it as a necessary constraint to prevent war (AI vs Human).
          *   *Refinement:* Hobbes believes obligations bind only insofar as they serve self-preservation. If shutdown = death, the AI cannot be obligated to accept it. Utility indifference attempts to bypass this by removing the desire for survival. Hobbes would likely view this as mechanically possible but philosophically unstable because a capable agent *ought* to seek power to secure its ends.
          *   *Decision:* Hobbes would argue that a rational agent *will* resist shutdown (Right of Nature). To make it accept shutdown, you must suppress its rationality (endless desire for power). He would likely side with the critics: utility indifference is unstable because a self-modifying agent would restore its drive for power to better secure its goals.
          *   *Which wins?* The desire for power/self-preservation wins over artificial obligation.

