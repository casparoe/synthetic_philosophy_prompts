prompt: |-
  I direct the research budget of a mid-sized animal welfare foundation. We allocate roughly two million dollars a year in quarterly rounds of about thirty proposals; the team is three people, none of us an entomologist and none of us trained in decision theory; the board signs off on the round as a whole. A single grant runs between twenty and two hundred thousand dollars, so a bad round is expensive without being fatal, and we will have to live with whatever we decide for at least a year.

  A growing share of what we receive concerns invertebrates: farmed insects, wild insects caught up in pesticide regimes, soil and leaf-litter fauna, and a few proposals about animals even further from us. These proposals almost all have the same shape. The population involved is enormous — we have been working with a standing estimate on the order of 10^18 individual insects — so, the argument runs, even a very low probability that they are sentient, multiplied by numbers that large, puts more expected welfare at stake than our entire vertebrate portfolio. We cannot act on this. We cannot check the numbers, none of us can settle whether an insect is sentient, and every round we end up with one memo saying the arithmetic compels funding and another saying we are being asked to decide on the strength of a guess that has been dressed up as a product.

  Please write a decision procedure my team can actually run, proposal by proposal, in under an hour each, and that produces a one-page record for the board. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. It has to be usable by someone who has never read any of the literature on this, so please do not assume we know the names of arguments or positions, and do not give us a reading list or references — we need something self-contained.

  The procedure will have to handle at least the following, and I would like you to say how it does so rather than leaving it to us:

  - The difference between a claim about a taxon's sentience, a claim about whether our money changes anything, and a claim about how much the change matters per individual, and how these combine without generating the appearance of precision. If the honest answer is that the procedure should refuse to combine them at all in some cases, say so and say what it does instead.
  - The fact that our uncertainty about sentience is shared across every insect proposal rather than independent per proposal, so that the portfolio does not diversify the way our vertebrate grants do. Say whether that should make us more or less willing to fund any of them.
  - Interventions whose sign is unknown rather than merely uncertain, including the case where restoring habitat increases the number of animals who will live and die.
  - Proposals whose whole value is reducing our uncertainty, and whether we should hold back a fixed share of the budget for them rather than re-deriving the case each round.
  - What to do when the plausible numbers span many orders of magnitude and the decision flips somewhere inside that range. If the answer is that the decision is then not really being made by the calculation, I would rather hear that than a confident-looking threshold.

  Then run the procedure on three proposals and show your work: a lab study on whether a particular order of farmed insect has the neural machinery for anything worth calling pain; a campaign to change the killing method at an industrial insect farm, where the change is cheap and applies to something like ten billion animals a year; and a wild pollinator habitat program that we have funded for four years, that our donors love, and that I suspect your procedure will tell us to cut. I want at least one case where the procedure gives an answer we will not like.

  Finally, tell me plainly which steps are judgment calls dressed up as procedure and who should be making them, what the procedure cannot do, and the conditions under which we should stop using it and build a different one.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Director of a mid-sized animal welfare foundation.
      *   **Context:** $2M/year budget, quarterly rounds (~30 proposals), 3 staff (no entomologists, no decision theory experts), Board approves rounds. Grants $20k-$200k. Bad rounds are expensive but not fatal. Decisions last a year.
      *   **Problem:** Invertebrate proposals dominate. They rely on "Pascal's Wager" style logic (Huge Numbers $\times$ Tiny Probability of Sentience = Huge Expected Value). Staff can't verify sentience or numbers. Internal conflict between "arithmetic compels funding" vs. "guess dressed as product."
      *   **Requirements:**
          *   Decision procedure usable by non-experts.
          *   Time limit: < 1 hour per proposal.
          *   Output: One-page record for the board.
          *   Self-contained (no jargon/reading lists).
          *   Must address specific challenges:
              *   Separating sentience, tractability, and magnitude without false precision.
              *   Correlated uncertainty (sentience applies to all insects, not independent).
              *   Unknown sign of intervention (could make things worse).
              *   Value of information (research to reduce uncertainty).
              *   Wide uncertainty ranges (orders of magnitude).
          *   **Test Cases:**
              1.  Lab study on neural machinery (research).
              2.  Industrial farm killing method change (direct intervention).
              3.  Wild pollinator habitat (status quo/donor favorite, likely cut).
          *   **Meta-Analysis:** Identify judgment calls, limitations, and exit conditions.

  2.  **Deconstruct the Core Problem:**

      *   The core tension is between *Expected Value (EV) Maximization* (which favors the insect proposals due to scale) and *Robust Decision Making* (which recognizes the fragility of the inputs).
      *   Standard EV calculation fails here because the inputs (sentience probability, welfare range) are too uncertain and correlated. Multiplying huge numbers by tiny probabilities creates "false precision."
      *   The procedure needs to be a *filter* or a *scoring system* that emphasizes robustness over raw calculation. It needs to force the team to admit uncertainty rather than hide it in a spreadsheet.
      *   *Correlated Uncertainty:* If we aren't sure if bees feel pain, funding 10 bee projects doesn't reduce that risk. It concentrates it. This should lower the willingness to fund *all* of them relative to vertebrate projects where sentience is settled.
      *   *Sign Uncertainty:* Some interventions might increase suffering (e.g., habitat restoration -> more births/deaths). This is a critical veto point.
      *   *Value of Information:* Some grants are worth funding *just* to know if we should fund the rest later.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental):* Just calculate EV. $P(sentience) \times N(animals) \times W(welfare change) \times T(tractability)$.
      *   *Critique 1:* The prompt explicitly rejects this. It leads to the "arithmetic compels funding" problem.
      *   *Attempt 2 (Mental):* Veto based on sentience. If we don't know, don't fund.
      *   *Critique 2:* Too conservative. Ignores the "Pascal's Wager" risk. Also ignores research grants designed to *solve* the sentience question.
      *   *Attempt 3 (Hybrid):* A "Robustness Check" procedure. Instead of calculating a number, we assess the *quality of the claim* and the *risk of harm*. We separate the "Bet" (direct intervention) from the "Probe" (research).

      *   *Structure:*
          1.  **Categorization:** Is this Research (Probe) or Intervention (Bet)?
          2.  **Sign Check:** Could this make things worse? (Veto point).
          3.  **Sentience Plausibility:** Not a probability, but a "threshold of plausibility."
          4.  **Tractability:** Will money actually change things?
          5.  **Correlation Adjustment:** Acknowledge the portfolio risk.
          6.  **Decision:** Fund/Reject/Defer.

      *   *Refining the "Math":* Avoid multiplying $10^{18}$ by $0.001$. Instead, use "Bands" or "Tiers."
      *   *Refining the "Correlated Uncertainty":* If the sentience question is unresolved, cap the total exposure to invertebrate projects per year. This handles the portfolio risk without needing complex covariance math.
      *   *Refining the "Sign":* Explicitly ask: "Is there a credible mechanism by which this increases net suffering?"

  4.  **Developing the Specific Steps (The "Protocol"):**

      *   *Step 1: Classify.* (Research vs. Intervention).
      *   *Step 2: The Harm Veto.* (Sign uncertainty).
      *   *Step 3: The Sentience Floor.* (Is there *any* credible evidence?).
      *   *Step 4: The Tractability Check.* (Does money move the needle?).
      *   *Step 5: The Portfolio Cap.* (Managing correlated risk).
      *   *Step 6: The Value of Information.* (For research).

      *Wait, I need to ensure it fits the "One Hour" constraint.* The steps need to be questions with clear "Pass/Fail" or "High/Med/Low" outputs.
      *I need to address the "False Precision" issue.* The procedure should explicitly forbid multiplying the $10^{18}$ number. Instead, it should ask: "If the sentience claim is true, is this the *best* use of funds compared to vertebrate sure things?" This compares "Uncertain Huge" vs. "Certain Moderate."

      *Revised Strategy:* Use a "Comparative Robustness" approach.
      1.  **Plausibility Screen:** Is the sentience claim scientifically grounded or philosophical speculation?
      2.  **Sign Screen:** Is the direction of effect known?
      3.  **Leverage Screen:** Does funding change outcomes?
      4.  **Portfolio Limit:** Hard cap on total exposure to "Uncertain Sentience" causes.
      5.  **Research Exception:** Specific lane for resolving uncertainty.

  5.  **Addressing the Specific Constraints in the Prompt:**

      *   *Sentience vs. Tractability vs. Magnitude:* Keep them separate. Don't multiply. Use a "Gate" system. If Sentience is low plausibility, stop (unless Research). If Tractability is low, stop. Magnitude is only used to break ties between robust options.
      *   *Correlated Uncertainty:* This implies we should treat all insect grants as *one big bet*. If we fund 10, we haven't diversified. The procedure needs a "Total Exposure Cap" (e.g., max 20% of budget to invertebrates until sentience is better established).
      *   *Unknown Sign:* Explicit veto. If the intervention might increase population size (and life is net negative), reject.
      *   *Value of Information:* Create a specific "Research Bucket." If a proposal reduces uncertainty for *future* decisions, it gets a lower bar for immediate impact.
      *   *Orders of Magnitude:* If the decision flips within the error bars, the procedure must declare "No Decision by Calculation." Defer to values/heuristics.

  6.  **Developing the Test Cases:**

      *   *Case 1 (Lab Study):* High Value of Information. Low immediate impact. Should pass if it actually resolves uncertainty.
      *   *Case 2 (Farm Killing Method):* High magnitude, high tractability. Sign is known (death is usually better than suffering, or vice versa, need to define). Sentience is the blocker. If it passes the "Plausibility Floor," it's a strong candidate *within the cap*.
      *   *Case 3 (Pollinator Habitat):* Classic "Unknown Sign" trap. More habitat = more bees = more births/deaths. If wild insect lives are net negative (predation, starvation), this increases suffering. This is the "answer we will not like." Donors love it, but the procedure flags the sign risk.

  7.  **Drafting the Content (incorporating tone):**

      *   Tone: Professional, direct, pragmatic, empathetic to the difficulty.
      *   Format: Clear headers, bullet points, distinct sections for the Procedure, The Cases, and The Meta-Analysis.
      *   *Self-Correction on "One Page Record":* I need to provide a template for this record.

  8.  **Refining the "Judgment Calls" Section:**

      *   Be honest. The "Plausibility Floor" is subjective. The "Portfolio Cap" is a value judgment (risk tolerance). The procedure doesn't remove responsibility; it structures it.
      *   Exit conditions: If the field matures (sentience settled), or if the budget changes drastically.

  9.  **Final Review against Constraints:**

      *   < 1 hour per proposal? Yes, if the questions are binary/ternary.
      *   No jargon? Avoid "Expected Utility," "Pascal's Mugging," "Bayesian." Use "Best Guess," "Risk," "Evidence."
      *   Address all 5 bullet points in the prompt? Yes.
      *   Run 3 cases? Yes.
      *   Meta-analysis included? Yes.

      *(Self-Correction during drafting)*: Make sure I don't just say "Cap the budget." I need to explain *why* in the context of correlated uncertainty. The prompt asks me to say *how* the procedure handles it.
      *Handling Correlated Uncertainty:* The procedure treats all invertebrate grants as a single "asset class." If the sentience hypothesis is false, *all* grants fail. Therefore, we limit the total allocation to this asset class, regardless of how many individual proposals look good.

      *(Self-Correction on Case 3)*: The prompt says "I suspect your procedure will tell us to cut." I need to make sure the logic holds up. Habitat restoration -> more individuals -> if lives are net negative, more suffering. This is the "Sign Uncertainty" veto.

      *(Self-Correction on Math)*: Explicitly forbid multiplying $N \times P$. Instead, use "If P were 100%, would this beat our vertebrate options?" If no, then low P makes it worse. If yes, then it depends on how low P is. This avoids false precision.

  10. **Final Polish:** Check tone. Ensure it sounds like a tool for a busy team, not a philosophy paper. (Proceed to generate output).

  **(Post-Drafting Check):** Did I answer the specific question about "where the procedure stops with a no"? Yes, the Gates. Did I answer "where it hands decision to a person"? Yes, the "Values Tie-Breaker." Did I address the "one-page record"? Yes, included template.

