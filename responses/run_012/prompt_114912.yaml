answer: |-
  ## The Invertebrate Grant Protocol (IGP)

  **Purpose:** To evaluate proposals involving invertebrates without relying on false precision or uncheckable arithmetic.
  **Time Limit:** 45–60 minutes per proposal.
  **Output:** One-page Decision Record (template provided at end).

  This procedure does not calculate expected value. It assesses **robustness**. It treats invertebrate grants as a high-risk asset class with correlated uncertainty. It separates "Bets" (interventions) from "Probes" (research).

  ---

  ### Part 1: The Procedure

  #### Step 1: Classification (5 Minutes)
  **Question:** Is the primary goal to change welfare outcomes *now* (Bet) or to reduce uncertainty about sentience/impact for *future* decisions (Probe)?
  *   **Bet:** Direct intervention (e.g., changing farming practices, habitat restoration).
  *   **Probe:** Research (e.g., neural studies, welfare measurement).
  *   **Action:** Mark the proposal as **Bet** or **Probe**. This determines which path you follow.

  #### Step 2: The Sign Check (Veto Point) (10 Minutes)
  **Question:** Is there a credible mechanism by which this intervention could *increase* net suffering?
  *   **Context:** For invertebrates, we do not know if a typical life is net positive or net negative. Interventions that increase population size (e.g., habitat restoration) or extend lifespan may increase total suffering if lives are net negative.
  *   **Sufficient Answer:** The applicant must identify the risk of increasing population/lifespan and argue why the *quality* of life improvement outweighs the *quantity* increase.
  *   **Stop Rule:** If the intervention likely increases the number of lives lived, and the applicant cannot demonstrate a guaranteed improvement in per-capita welfare quality, **Reject**. Do not proceed.
  *   **Handoff:** If the risk is theoretical but non-zero, this is a **Values Judgment**. The Team Lead must decide if the foundation is "risk-averse" (reject) or "risk-tolerant" (proceed) regarding unknown signs.

  #### Step 3: The Sentience Floor (15 Minutes)
  **Question:** Is the claim of sentience based on biological machinery or philosophical analogy?
  *   **Context:** We cannot verify sentience. We can verify the presence of nociceptors, central processing, or avoidance learning.
  *   **Sufficient Answer:**
      *   **Pass:** Proposal cites specific physiological structures (e.g., nociceptors, opioid receptors) or complex behavioral trade-offs observed in *this specific taxon*.
      *   **Fail:** Proposal relies solely on "phylogenetic similarity" (e.g., "they are animals like cows") or "ecological importance."
  *   **Stop Rule:** If **Fail**, and the proposal is a **Bet**, **Reject**. (Exception: See Step 6).
  *   **Note:** Do not assign a probability (e.g., "10% chance"). Assign a tier: **Plausible**, **Speculative**, or **Unfounded**.
      *   **Plausible:** Biological evidence exists.
      *   **Speculative:** Behavioral evidence only.
      *   **Unfounded:** No evidence.

  #### Step 4: The Tractability Check (10 Minutes)
  **Question:** If we fund this, does the money change the outcome, or does it just pay for what would happen anyway?
  *   **Context:** Invertebrate numbers are so large ($10^{18}$) that small changes look huge on paper. We need to know if our $200k actually moves the needle.
  *   **Sufficient Answer:** A counterfactual. "Without us, X happens. With us, Y happens."
  *   **Stop Rule:** If the applicant cannot define the counterfactual, **Reject**.
  *   **False Precision Warning:** Do not accept calculations like "We save 1 billion insects." Accept only "We change the method for 1 billion insects." Do not multiply by sentience probability here.

  #### Step 5: The Portfolio Cap (Decision Rule) (5 Minutes)
  **Question:** Does funding this push our total exposure to "Speculative Sentience" grants over the annual limit?
  *   **Context:** Uncertainty about insect sentience is **correlated**. If bees aren't sentient, *none* of the bee grants matter. Funding 10 bee grants does not diversify risk; it concentrates it.
  *   **Rule:** The Foundation sets a hard cap on total annual funding for **Bet** proposals where Sentience is **Speculative**. (Recommendation: 15% of total annual budget).
  *   **Action:** Check current year-to-date spending in this category.
  *   **Stop Rule:** If the cap is reached, **Reject** or **Defer** to next year, regardless of proposal quality.
  *   **Exception:** **Probe** (Research) grants do not count against this cap. They are exempt because they resolve the correlation risk.

  #### Step 6: The Values Tie-Breaker (Human Judgment)
  **Condition:** The proposal passes Steps 2–4, but the "Plausibility" is low, or the "Sign" is ambiguous.
  *   **Action:** The Team Lead must answer: "If we are wrong about sentience, can we live with having spent this money?"
  *   **Record:** Document the specific value trade-off (e.g., "Accepting risk of wasted funds to avoid risk of ignoring massive suffering").

  ---

  ### Part 2: How This Handles Your Specific Concerns

  1.  **Separating Claims (Sentience vs. Tractability vs. Magnitude):**
      *   The procedure treats these as **gates**, not multipliers. A huge magnitude (Step 4) does not compensate for a failed Sentience Floor (Step 3). We do not multiply $N \times P$. We ask: "Is P plausible enough to open the gate?" If yes, *then* we look at N. This prevents a huge number from forcing a decision when the probability is negligible.

  2.  **Correlated Uncertainty:**
      *   Handled by **Step 5 (Portfolio Cap)**. Because the uncertainty is shared across the taxon, we treat all "Speculative Sentience" grants as a single bucket. Once the bucket is full, no more grants are added. This prevents the portfolio from becoming over-concentrated in a potentially valueless cause. It makes us **less willing** to fund individual proposals once the cap is near, acknowledging that diversification is impossible here.

  3.  **Unknown Sign (Interventions):**
      *   Handled by **Step 2 (Sign Check)**. This is a hard veto. If an intervention increases population size (e.g., habitat), and we don't know if life is net positive, the procedure forces a "Reject" unless the applicant proves per-capita welfare improves drastically. This stops "more nature is always better" assumptions.

  4.  **Value of Information (Research):**
      *   Handled by **Step 1 (Classification)** and **Step 5 (Exception)**. **Probe** proposals are exempt from the Portfolio Cap. We acknowledge that spending money to *stop* guessing is worth more than guessing. We do not re-derive the case each round; research is funded based on its ability to resolve Step 3 for *future* rounds.

  5.  **Orders of Magnitude / Flipping Decisions:**
      *   Handled by **Step 6 (Values Tie-Breaker)**. If the decision relies on a number that spans 10 orders of magnitude, the procedure explicitly states: "Calculation cannot decide this." It forces the human to admit they are making a value judgment, not a mathematical one.

  ---

  ### Part 3: Test Cases

  #### Case 1: Lab Study on Neural Machinery (Farmed Insect Order)
  *   **Type:** Probe (Research).
  *   **Step 2 (Sign):** N/A (Lab study does not release animals). **Pass.**
  *   **Step 3 (Sentience):** Investigating neural machinery directly. **Plausible.**
  *   **Step 4 (Tractability):** Will produce a definitive report used for future grant rounds. **Pass.**
  *   **Step 5 (Cap):** Exempt (Research).
  *   **Decision:** **Fund.**
  *   **Reasoning:** Even if the result is "no sentience," that saves us millions in future rounds. It reduces the correlated uncertainty.
  *   **Record:** "Funded as high-priority Probe. Resolves Step 3 for future Bet proposals."

  #### Case 2: Industrial Killing Method Change (10 Billion Animals)
  *   **Type:** Bet (Intervention).
  *   **Step 2 (Sign):** Killing is being made faster/less painful. Sign is positive (reduces suffering per individual). **Pass.**
  *   **Step 3 (Sentience):** Taxon has nociceptors and avoidance learning. **Plausible.**
  *   **Step 4 (Tractability):** Farm agrees to change only if subsidized. Counterfactual is clear. **Pass.**
  *   **Step 5 (Cap):** Cost is $150k. Current "Speculative Bet" spending is $100k. Cap is $300k (15% of $2M). **Pass.**
  *   **Decision:** **Fund.**
  *   **Reasoning:** Passes all gates. High tractability. Within risk tolerance.
  *   **Record:** "Funded. High tractability. Within Portfolio Cap. Sentience Plausible."

  #### Case 3: Wild Pollinator Habitat Program (Donor Favorite)
  *   **Type:** Bet (Intervention).
  *   **Step 2 (Sign):** Goal is to *increase* wild pollinator populations.
      *   *Analysis:* If wild insect lives are net negative (starvation, predation, parasitism), increasing the population increases total suffering.
      *   *Applicant Argument:* "More bees is good for the ecosystem."
      *   *Procedure Check:* Does this guarantee better *per-capita* welfare? No. It guarantees more *lives*.
      *   **Result:** **Fail.** (Veto).
  *   **Step 3 (Sentience):** **Plausible.** (Irrelevant due to Step 2 fail).
  *   **Step 5 (Cap):** Would exceed cap anyway.
  *   **Decision:** **Reject.**
  *   **Reasoning:** Unknown sign of intervention. Risk of increasing net suffering.
  *   **Record:** "Rejected. Step 2 Veto. Intervention increases population without guaranteed per-capita welfare improvement. Risk of negative sign."
  *   **Note:** This is the answer you will not like. It requires explaining to donors that "more animals" is not always a moral good under uncertainty.

  ---

  ### Part 4: The One-Page Decision Record (Template)

  **Proposal ID:** _______________ | **Date:** _______________
  **Applicant:** _______________ | **Amount:** _______________

  **1. Classification:** [ ] Bet (Intervention) [ ] Probe (Research)

  **2. Sign Check:**
  [ ] Positive (Welfare improves per individual)
  [ ] Negative (Welfare worsens)
  [ ] **Unknown** (Population size increases) -> *Requires Values Judgment*
  **Outcome:** [ ] Pass [ ] Veto (Stop)

  **3. Sentience Floor:**
  [ ] Plausible (Physiological evidence)
  [ ] Speculative (Behavioral only)
  [ ] Unfounded
  **Outcome:** [ ] Pass [ ] Fail (Stop if Bet)

  **4. Tractability:**
  [ ] Clear Counterfactual (Money changes outcome)
  [ ] Unclear
  **Outcome:** [ ] Pass [ ] Fail (Stop)

  **5. Portfolio Check:**
  Current "Speculative Bet" Spend: $_______ | Cap: $_______
  **Outcome:** [ ] Within Cap [ ] Exceeds Cap (Stop)

  **6. Final Decision:** [ ] Fund [ ] Reject [ ] Defer
  **Values Note (if applicable):** *Why did we accept the risk?*

  **Reviewer Initials:** _______

  ---

  ### Part 5: Meta-Analysis (Plain Talk)

  **1. Which steps are judgment calls dressed up as procedure?**
  *   **The Sentience Floor (Step 3):** Deciding what counts as "Plausible" vs. "Speculative" is subjective. Your team is deciding what evidence is "enough." There is no scientific consensus you can lean on yet. You are making a policy definition of evidence.
  *   **The Portfolio Cap (Step 5):** The 15% number (or whatever you choose) is arbitrary. It is a risk tolerance setting, not a mathematical truth. It is a value judgment on how much "guessing" you are willing to pay for.
  *   **The Sign Check (Step 2):** Deciding if a life is "net negative" is a philosophical stance. The procedure forces you to take a stance (caution) rather than hiding the uncertainty.

  **2. Who should be making them?**
  *   **Sentience Floor:** The Team Lead, perhaps consulting one external biologist (not an advocate) for a sanity check on the physiology claims.
  *   **Portfolio Cap:** The Board. This is a risk management policy for the foundation, not a scientific finding. They need to sign off on the "Invertebrate Exposure Limit."
  *   **Sign Check:** The Team. This is ethical risk assessment.

  **3. What the procedure cannot do:**
  *   It cannot tell you if insects feel pain.
  *   It cannot protect you from donor anger if you cut popular programs (like Case 3).
  *   It cannot optimize for "most good done." It optimizes for "least regrettable mistakes made." It is a defensive tool, not an offensive one.

  **4. Conditions to stop using it:**
  *   **Scientific Consensus:** If the field reaches a consensus on invertebrate sentience (either yes or no), Step 3 becomes a fact-check, and the Portfolio Cap can be lifted (if yes) or made permanent (if no).
  *   **Budget Shift:** If your budget grows 10x, the "bad round is expensive but not fatal" assumption changes. You would need a stricter cap.
  *   **Intervention Maturity:** If "Probe" grants successfully reduce uncertainty, you may move specific taxa from "Speculative" to "Plausible" permanently, altering the flow.

  **Final Advice:**
  This procedure will feel frustratingly conservative. It is designed to be. You are currently facing arguments that use large numbers to bypass evidence. This procedure forces evidence back into the driver's seat. When you present the "Reject" on the Pollinator Habitat (Case 3), do not apologize for the math. Apologize for the uncertainty. Tell the board: *"We do not know if we are helping or hurting. Until we do, we cannot bet the budget on it."*
