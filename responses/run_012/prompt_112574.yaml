      *   **Topic:** Units-of-selection debate in evolutionary biology.
      *   **Goal:** Sidestep the standard "gene's-eye view wins" narrative. Instead, evaluate candidate units based on *independent explanatory work* they do *after* accounting for selection on genes (inclusive fitness).
      *   **Candidates:** Individual organism, Trait group, Species/Clade, Holobiont, Heritable cultural variant (meme), Selfish genetic element.
      *   **Task:** Rank/Tier them based on explanatory power.
