          *   Focus on "what it buys" (explanatory utility) rather than a final verdict on the debate.
      *   **Tone:** Analytical, nuanced, suitable for a long-form feature (intellectual but clear).

  2.  **Deconstruct the Criteria:**
      *   *Independent Explanatory Work:* Does invoking this unit explain something that gene-level inclusive fitness *cannot* explain easily, or does it require significant contortions to fit into the gene framework?
