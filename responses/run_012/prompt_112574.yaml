      *   *Tier 1 (High Independent Explanatory Work):* Species/Clade, Cultural Variant. (These operate on timescales or transmission modes where gene-level inclusive fitness is insufficient or silent).
      *   *Tier 2 (Pragmatic/Heuristic Value, Theoretically Redundant):* Individual Organism, Trait Group. (Mathematically translatable to gene-level, but essential for modeling specific interactions).
