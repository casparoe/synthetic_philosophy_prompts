  9.  **Final Polish:** Ensure the distinction between "Duty *to*" and "Duty *regarding*" is clear. Ensure the distinction between empirical coarsening and violation of moral self-perfection is clear.

      *(Self-Correction on "Soundness"):* The user says "if her argument is sound then my plot is wrong." This implies the plot relies on her being *wrong* or *challenged*. If I show her argument is defensible (within Kantianism), does that kill the plot? No, because the *cost* of the defense is the character drama. The plot can be about the *cost* of consistency.

