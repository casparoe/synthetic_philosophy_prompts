answer: |-
  Here is the Bayesian mapping of the Mercury episode, followed by the critique you requested.

  ### 1. The Formal Breakdown
  Let's map the history directly onto the Bayes equation: $P(h|e) = \frac{P(e|h)P(h)}{P(e)}$.

  *   **$h$ (Hypothesis):** Einstein's General Relativity (field equations finalized Nov 1915).
  *   **$e$ (Evidence):** The residual perihelion precession of Mercury is ~43 arcseconds per century.
  *   **The Agent:** A rational scientist in late 1915 (e.g., Einstein or Schwarzschild).
  *   **The Problem:** By 1915, $e$ is a historical fact. Le Verrier identified the discrepancy in 1859 (initially 38"); Newcomb refined it to 43" in 1895. For the 1915 agent, $P(e) = 1$.
  *   **The Collapse:** Since $e$ is certain, $P(e|h)$ is also 1 (GR entails the number). The likelihood ratio $\frac{P(e|h)}{P(e)}$ becomes $\frac{1}{1}$.
  *   **Result:** $P(h|e) = P(h)$. The existence of the anomaly provides *zero* confirmation for GR.

  This contradicts the historical record. Einstein reportedly felt a palpitation of the heart when GR yielded the 43" figure; he treated it as decisive confirmation. Standard Bayesianism says it should have been irrelevant.

  ### 2. Evaluating the Escapes
  Philosophers have proposed several ways to unclog the equation. Here is where they break:

  *   **The Counterfactual Move:** We ask, "What would the agent's credence in $e$ have been *before* Le Verrier discovered it?" We reconstruct a prior where $P(e) < 1$.
      *   *Verdict:* **Cheat.** This requires time-traveling the agent's epistemic state. It substitutes actual history for a fictional scenario. It explains why we *feel* confirmed, but it doesn't model the actual update that happened in 1915.
  *   **The "Learning That We Learned" Move:** We claim the agent updates not on $e$, but on the proposition "$h$ entails $e$."
      *   *Verdict:* **Survives (technically).** This formalizes the "aha!" moment. The new information isn't the number 43; it's the logical connection between the field equations and the number. However, it shifts the evidence from the physical world to the mathematical derivation, which feels like sidestepping the empirical weight of the anomaly.
  *   **The Theory-Shifts-Data Move:** The idea that adopting $h$ changes the probability of $e$.
      *   *Verdict:* **Breaks.** Data is fixed. You cannot change the probability of a past observation by changing your theory.

  ### 3. The Injection: Was the Evidence Actually Old?
  This is where the standard Bayesian setup gets it wrong. It treats $e$ as an atomic proposition ("Mercury precesses at 43\""). But in this episode, $e$ is **description-dependent**.

  The "43 arcseconds" is not a raw measurement. It is a *residual*. It is calculated as:
  $$ \text{Observed Precession} - (\text{Newtonian Prediction} + \text{Planetary Perturbations}) $$

  In 1859, the "Newtonian Prediction" term was unstable. Le Verrier's initial 38" estimate depended on specific mass estimates for Venus and Earth. Newcomb's 43" refinement (1895) depended on better planetary masses and a specific model of the solar system.

  Furthermore, $e$ includes the **negative evidence** of the Vulcan search.
  *   **$e_{1859}$:** "There is a discrepancy; perhaps a planet (Vulcan) causes it."
  *   **$e_{1915}$:** "There is a discrepancy; Vulcan does not exist; solar oblateness is insufficient; Newtonian tweaks have failed for 50 years."

  The proposition $e_{1915}$ is *not* the same as $e_{1859}$. The "old evidence" was just "an anomaly exists." The "new evidence" available to Einstein was "the anomaly persists *after* the hypothesis space of Newtonian fixes (Vulcan, dust, oblateness) has been exhausted."

  **Does this rescue Bayesianism?**
  Yes, but only if we admit that $e$ is not a static datum. If $e$ is "The failure of all Newtonian rescue hypotheses to account for the residual," then $P(e)$ was **not 1** until the Vulcan searches conclusively failed (which happened gradually). The evidence wasn't "old" in the relevant sense because the *description* of the anomaly required the elimination of rivals that was still ongoing when Einstein started working.

  If you fold the "50 years of failed fixes" into $e$, then $e$ is effectively new information about the *space of alternatives*, not just the position of Mercury. Bayesianism survives here only by acknowledging that data is theory-laden: you couldn't even state the precise evidence $e$ without the background assumptions that were being stress-tested up until 1915.

  ### 4. Contrast with 1919 (Light Bending)
  The 1919 Eddington eclipse expedition tested a **novel prediction**: starlight grazing the sun should bend by 1.75".
  *   **Bayesian Distinction:** Here, $P(e_{new}) \ll 1$. The likelihood ratio $\frac{P(e_{new}|h)}{P(e_{new})}$ is massive.
  *   **Psychology vs. Structure:** It feels like more work is being done because risk is involved. But is it structurally superior?
      *   **Accommodation vs. Prediction:** The Mercury case is *accommodation* (GR was tuned/checked against known data). The 1919 case is *prediction*.
      *   **The Real Difference:** Bayesianism struggles to penalize accommodation unless you build "flexibility" into the priors. A theory that can fit any residual (like a tweaked Newtonian model with enough epicycles) should have a lower prior. The 1919 test was valuable because it was a point where GR and Newtonianism diverged sharply *before* the data was collected.
      *   **Verdict:** It is not just psychology. Novel predictions protect against overfitting. The Mercury fit could have been a coincidence (or a hidden parameter); the 1919 bend was a risk of falsification. Bayesianism captures this only if the prior $P(h)$ accounts for the theory's rigidity/riskiness, which standard formulations often ignore.

  ### 5. Where Bayesianism is Silent
  Finally, here is what the confirmation machinery misses about this episode:

  1.  **The "No Alternatives" Argument:** Bayesianism updates on $e$ given $h$. It does not easily model the *process* of eliminating $\neg h$. The 50-year failure to find Vulcan isn't just part of $e$; it's a collapse of the rival hypothesis space. Bayesianism treats $\neg h$ as a static bucket. It doesn't capture the *dynamic erosion* of the Newtonian research program's credibility as each fix (Vulcan, solar dust, oblateness) failed.
  2.  **The Generation of $h$:** Bayesianism assumes $h$ exists and asks how $e$ supports it. It has nothing to say about why Einstein's $h$ was taken seriously enough to have a non-zero prior in the first place. The beauty of the tensor calculus, the equivalence principle, and the resolution of the Machian tension gave $h$ its initial plausibility. The math of confirmation is silent on theory *generation* and *aesthetic priors*.
  3.  **The Revolution:** In 1846, the Uranus anomaly was solved by adding a planet (Neptune). In 1915, the Mercury anomaly was solved by changing gravity itself. Bayesianism sees two updates: $P(h|e)$ goes up in both cases. It cannot explain why one was "normal science" (add a planet) and the other was a "paradigm shift" (change spacetime geometry). It measures degree of belief, not conceptual rupture.

  **Summary:** The Bayesian account works for Mercury only if you admit the evidence wasn't truly "old" because the *definition* of the anomaly evolved alongside the failure of Newtonian fixes. If you treat the 43" as a static number known in 1859, Bayesianism breaks. If you treat it as the endpoint of a 50-year process of eliminating Newtonian rescue hypotheses, the confirmation holds—but that requires a more complex model of evidence than the standard $P(e)=1$ puzzle allows.
