  The practice is England's statutory Biodiversity Net Gain (BNG) mandate, operationalizing conservation as a regulatory balance sheet. Since 2024, developers must deliver a 10% increase in "biodiversity units," calculated via a standardized metric scoring habitat area, type, condition, and location. These units are fungible assets, tradable across space and time, allowing destruction here to be compensated by creation elsewhere. The system rests on two specific features that generate philosophical pressure. First, it is rigorously habitat-based, treating species presence as a secondary modifier rather than a primary count, thereby sidestepping the ontological instability of species definitions. Second, it maintains a general regime of commensurability—any habitat can theoretically replace another given sufficient units—while simultaneously carving out a class of "irreplaceable" habitats (e.g., ancient woodland) that are removed from the market entirely, refusing planning permission rather than pricing the loss.

  2. **The commitments it presupposes**
  To function, the tradeable unit presupposes a monistic and consequentialist axiology. It assumes biodiversity value is scalar, aggregable, and separable from its specific physical instantiation. This is a commitment to strong commensurability: the value of a meadow in Kent can be summed with a pond in Yorkshire because both instantiate the same underlying substance, "biodiversity," measurable in a single numeraire. This requires spatial substitutability, implying value is not inherently place-bound, and temporal substitutability, where future maturity discounts present loss via a time multiplier. The scheme presupposes that the measurement (the metric) captures the valuation (the worth) without remainder. If the metric missed significant value, the trade would be unjust, yet the system proceeds as if the metric is exhaustive for tradable cases. It assumes measurement and valuation are separable processes that can be algorithmically recombined. The weights assigned to habitat types are treated as objective coefficients rather than subjective preferences, masking the political choice of what counts as "good" nature.

  Regarding species, the scheme adopts methodological instrumentalism rather than realism or conventionalism. It does not deny species exist, nor does it solve the species problem; it bypasses it. It presupposes that habitat structure is a sufficiently reliable proxy for species value that the error introduced by ignoring specific taxa is acceptable noise. This is an empirical bet disguised as an accounting rule. It commits to the view that the *capacity* to support life is what matters, not the specific identities of the lives supported. Consequently, it treats biodiversity as a functional property of land management rather than a collection of distinct ontological entities. The system cannot do without the assumption of fungibility; without it, the market collapses. It can, however, tolerate imprecision in the metric, provided the imprecision is systematic. The deeper commitment is that nature's value is primarily structural and quantitative, allowing for compensation, rather than historical or identity-based, which would forbid it.

  Furthermore, the scheme presupposes a mereological atomism: the landscape is divisible into discrete parcels whose values are additive. It denies holism, where the whole might exceed the sum of parts due to connectivity or context. By allowing trading, it asserts that context is a modifier, not a constitutive element of value. The temporal discounting further presupposes intergenerational equity is achievable through delay; a tree planted today is worth less than one standing today, but the difference is arithmetic, not categorical. This implies the future is open to colonization by nature in a way that mirrors financial compounding. The system requires that nature be legible as capital; if biodiversity cannot be stored, banked, or accrued, the mechanism fails. Thus, the primary commitment is not to ecology, but to the governability of ecology through economic instruments.

  3. **What it rules out, and what it merely fits**
  The practice rules out strong incommensurability, which holds that certain natural goods cannot be traded against others regardless of quantity. It also excludes strict species-centric realism, where the extinction of a specific lineage is a unique loss不可compensatable by creating habitat for different organisms. Animal-welfare views are largely incompatible; a pasture supporting high biodiversity units might score well even if it harbors significant wild animal suffering, as the metric tracks structural complexity, not sentience. Place-bound views (topophilia) are mostly excluded, as trading permits value transfer across locations, though the location multiplier acknowledges some spatial specificity. Deep ecological views that value nature independently of human utility are also strained, as the system exists to permit human development.

  However, the practice is underdetermined regarding the source of value. It fits both weak anthropocentrism (nature is valuable for human ecosystem services) and non-anthropocentric instrumentalism (nature is valuable for its own functional integrity). A utilitarian conservationist and an ecosystem-service economist could both endorse the same spreadsheet. The metric does not distinguish whether habitats are valued because humans like them, because species need them, or because complexity is intrinsically good. It merely requires that whatever the source, it scales linearly with habitat condition and area. Thus, the practice is metaphysically thin regarding the *why* of value, but thick regarding the *how* of exchange. It is compatible with any theory that accepts aggregation, leaving the fundamental justification for conservation opaque within the mechanism itself.

  4. **The exception, examined**
  The irreplaceable carve-out functions as philosophical evidence that the scalar arithmetic is a proxy, not a fundamental truth. If the metric were complete, ancient woodland would simply possess an astronomically high unit score, discouraging but not forbidding development. By removing it from the market, the scheme admits that for certain categories, the metric fails to capture value entirely. This reveals a lexical ordering hidden beneath the consequentialist surface: Preserve Irreplaceables > Maximize Net Gain. The scheme is not a consistent consequentialism with a threshold; it is two incompatible theories stapled together. For mundane habitats, value is fungible and quantitative. For sacred habitats, value is identity-based and qualitative.

  This is not merely political cowardice; it is an acknowledgment of the metric's epistemic limits. Ancient woodland carries historical and ecological continuity that cannot be recreated by planting trees, regardless of time discounts. The exception concedes that some value is time-bound and non-replicable. Therefore, the arithmetic is a heuristic for low-stakes cases where approximation is acceptable, while the exception handles high-stakes cases where approximation constitutes destruction. The scheme presupposes that most nature is interchangeable, but whispers that some is not. The exception acts as a leak in the utilitarian calculus, revealing that the system managers know the currency is counterfeit for certain transactions. It suggests the metric is a tool for managing the mundane, while the prohibition protects the sacred, admitting that no amount of units can buy back deep time.

  5. **What would have to change**
  Switching to species-based accounting would gain ontological precision but lose administrative viability. The species problem would reintroduce uncertainty into the balance sheet, stalling development as lawyers debate species concepts. It would cease to be a clear permitting system, becoming instead a site of constant litigation over biological classification. Abandoning cross-type trading (no offsetting meadows with ponds) would gain ecological integrity, ensuring like-for-like replacement, but lose economic efficiency, likely halting many projects where like-for-like is impossible. It would remain a permitting system but a stricter one, functioning more as a mitigation hierarchy than a market.

  Abandoning the compensatory framing entirely—forbidding net loss without offsetting—would gain moral clarity by treating nature as a constraint rather than a currency. However, it would lose the flexibility that allows development to proceed at all. This would cease to be a system for permitting development and become a system for prohibiting it. The current scheme is designed to facilitate growth while managing guilt; removing the compensatory mechanism removes the facilitation. To make the system philosophically consistent without the exception, one would need to either declare all nature irreplaceable (no development) or all nature tradable (no exception). The current hybrid is the only configuration that functions as a regulatory engine rather than a moral statement. Any move toward philosophical purity risks breaking the machinery of planning, suggesting the inconsistency is a feature, not a bug, of governance.

  6. **Verdict**
  The practice presupposes operational utilitarianism: nature is valuable insofar as it can be quantified and traded to maximize an aggregate score. The deeper oddity is the exception, not the species blindness. The blindness is a pragmatic simplification; the exception is a metaphysical confession. It admits that the utilitarian calculus is false for the things we value most, revealing the metric as a tool for managing the mundane, not the sacred. The scheme is a consequentialist engine with a deontological brake, acknowledging its own falsity at the limits.
