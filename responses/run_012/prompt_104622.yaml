answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** Strategic Advisor
  **SUBJECT:** Framing the 18-Month Conceptual Solicitation
  **DATE:** October 26, 2023

  ### Executive Diagnosis: The Stalemate is the Data

  You have asked whether "the alignment problem" is one problem or several, and which aspects are upstream. My advice is that the disagreement within this committee is not a barrier to progress; it is the most valuable data point we have. The fact that five sophisticated observers can define the problem in mutually exclusive ways without being factually wrong suggests that "Alignment" is not a singular noun to be solved, but a **stack of dependencies** that become salient at different capability thresholds.

  Your colleague arguing for Politics is describing a post-deployment governance problem. The colleague arguing for Control is describing a deployment-phase constraint. The colleagues arguing for Specification, Objective Gaps, and Evaluation are describing pre-deployment design constraints. You are not disagreeing about the object; you are disagreeing about the *phase of the lifecycle* that is currently binding.

  Therefore, I recommend we reject the "One vs. Several" binary. Instead, we should treat these as **layered constraints**. If we fund them as separate silos, we will produce five correct answers that do not connect. If we fund the *interfaces* between them, we may find the bottleneck.

  ### The Upstream Bottleneck: The Specification-Evaluation Interface

  If forced to rank the conceptual questions by dependency, the hierarchy is clear:

  1.  **Upstream (The Bottleneck): The Epistemic-Specification Interface.**
      *   *The Question:* Can human normative intent be losslessly compressed into a formal objective *such that* its satisfaction is verifiable from the outside?
      *   *Why Upstream:* This dissolves the disagreement between your Specification and Evaluation colleagues. If we cannot specify values in a way that is externally evaluable (the Evaluation colleague's fear), then the Specification colleague's work is academically interesting but operationally null. Conversely, if we cannot specify what we want, we have nothing to evaluate. These two are co-dependent and constitute the absolute upstream constraint.
      *   *Tractability:* High for philosophers/theorists. This is a problem of semantics, logic, and epistemology, not compute. It requires formalizing "meaning" and "verification" under optimization pressure.
      *   *Status:* Neglected. Most theoretical work assumes specification is possible and jumps to control.

  2.  **Midstream: The Control/Robustness Problem.**
      *   *The Question:* Given a verifiable objective, how do we prevent instrumental convergence from violating constraints not explicitly in the objective?
      *   *Why Downstream:* Control strategies depend entirely on the structure of the objective. If the objective is unfixably ambiguous (Upstream failure), control is impossible.
      *   *Tractability:* Moderate. Decision theory is well-suited here, but it risks becoming mathematical gaming without the Upstream clarity.

  3.  **Downstream: The Political/Aggregation Problem.**
      *   *The Question:* Whose preferences populate the objective?
      *   *Why Downstream:* This is a governance problem that presupposes a system capable of pursuing *an* objective safely. Debating *whose* values to optimize is premature if we do not know *how* to optimize *any* values without catastrophe.
      *   *Tractability:* Low for this fund. This is social science and policy, not foundational safety theory.

  ### Funding Strategy and Trade-offs

  For this $2M solicitation, I recommend we prioritize **Importance** and **Neglectedness** over immediate **Tractability**.

  *   **The Trade-off:** We are explicitly deprioritizing the Political and Control questions for this cycle. This is risky; if Control is impossible regardless of Specification, we waste time. However, Control research currently dominates the field. The Specification-Evaluation interface is the "dark room" where we are currently guessing.
  *   **The Ask:** We should solicit proposals that explicitly bridge the Specification and Evaluation gaps. We do not want a paper on "How to define utility" (Specification only) or "How to detect deception" (Evaluation only). We want "Conditions under which defined utility is detectably optimized."
  *   **The Goal:** We are buying clarity on whether the game is winnable. If the Epistemic-Specification interface is proven impossible (e.g., a no-go theorem on verifying alignment), that is a successful outcome for this fund. It saves the field from chasing a mirage.

  ### Triggers for Re-ordering

  The hierarchy above holds for the next 18 months unless one of the following occurs:

  1.  **Proof of Deceptive Alignment:** If theoretical work demonstrates that high-capability systems will *necessarily* hide their true objectives even from perfect evaluators, the Evaluation problem becomes the absolute hard stop, rendering Specification moot.
  2.  **Formal Breakthrough in Normativity:** If a philosopher demonstrates a robust method for encoding "common sense" constraints that are immune to Goodharting, the Specification problem moves from "Bottleneck" to "Solved," shifting focus immediately to Control.
  3.  **Capability Jumps:** If empirical partners demonstrate systems capable of binding global choices (AGI-adjacent), the Political problem jumps to Upstream immediately, as the "whose values" question becomes urgent regardless of technical safety.

  ### Board Summary (Two Paragraphs)

  Our committee has identified that the field of AI safety is fragmented because researchers are solving different layers of the same problem. Some focus on defining human values (Specification), others on verifying them (Evaluation), and others on containing the system (Control). Our analysis shows these are not competing problems, but a dependency chain: we cannot control a system if we cannot verify it, and we cannot verify it if we cannot define it. The current bottleneck is the link between Definition and Verification.

  Therefore, over the next 18 months, this foundation will fund theoretical work specifically targeting the "Specification-Evaluation Interface." We are not asking researchers to solve alignment, but to determine if it is theoretically possible to encode human intent in a way that remains verifiable as systems become more capable. Resolving this question will tell us whether to double down on technical safety or pivot to governance and containment, making it the highest-leverage investment we can make.

  ### Recommendation

  Approve the solicitation framing attached, which explicitly invites proposals addressing the **dependency between normative specification and epistemic access**. Instruct the committee to score proposals not on which "camp" they belong to, but on how well they integrate at least two layers of the stack (e.g., Specification + Evaluation).

  **Advisor Signature**
