              *   *Resolution:* Sacrifice Point 6's "decisive" claim. Make it prima facie, not absolute.
              *   *Cost:* Weakens defense of kidneys/generators if evidence arises that they harm the worst-off.
          *   **Tension 2 (4 vs 5):** Point 4 says commodification objections are distaste/harm-based. Point 5 says standing goods are *destroyed* by pricing (intrinsic corruption). This is a commodification objection doing independent work.
              *   *Resolution:* Revise Point 4 to exclude standing goods.
              *   *Cost:* Opens door for critics to argue organs are standing goods (health equality).
          *   **Tension 3 (2 vs 6):** Point 2 claims gouging helps buyers. Point 6 requires helping the *worst off*. High prices often exclude the poorest entirely.
              *   *Resolution:* Clarify Point 2 to acknowledge exclusion risk.
              *   *Cost:* Weakens the moral certainty of the generator defense.

  6.  **Refining and Editing:**

