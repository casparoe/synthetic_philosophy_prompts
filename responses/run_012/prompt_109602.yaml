answer: |-
  I recommend that we list the Longnight Procession on the condition that the register entry explicitly documents its 1971 revival and credits the living composer, with this decision finalized by 14 November. If the panel will not adopt this condition, I move we reject the nomination today and invite the town to reapply in March with accurate historical data.

  The statutory test requires transmission across at least three generations and that the practice be rooted in the community's customs. The sixty-year gap between the antecedent procession and the current iteration breaks any claim of unbroken historical continuity. However, the word "rooted" must do the work of accommodating revival. The test should not demand continuity of practice regardless of circumstance, but rather continuity of the community's own sense of continuity. The current practice has been performed for fifty-three years; while this stretches the definition of three generations, the community's embrace of the event since 1971 demonstrates it is rooted in their present customs. We are assessing whether the practice is embedded in the community now, not whether it survived unchanged since 1860.

  Regarding the town's belief in antiquity, we must distinguish between validating the practice and validating the myth. The archival record contradicts the claim of immemorial origin. Listing a practice whose origin is documented does not make the panel a party to a false claim if we record the truth in the register. We recognize something the community has genuinely made its own without endorsing the inaccurate history. To list the practice as "immemorial" would compromise our integrity; to list it as a mid-century revival that has become traditional respects both the档案 and the community's ownership.

  The living composer's preference must figure decisively. She has asserted her authorship and expressed a desire to be named rather than have the town pretend the words are of unknown origin. Heritage protection should not require the erasure of living contributors. To list the chant as "traditional" against her wishes is to deny her dignity and labor. We must honor her request in the register entry, noting her composition as part of the practice's history.

  The nomination claims the procession is a national custom based on a 1936 folklore survey that gathered regional practices into a single canon. A national register should not be in the business of certifying customs as national based on such constructed genealogies. Our role is to safeguard practices significant to their communities, not to validate outdated folklore classifications or rank practices by prestige. The register should reflect living significance, not historical status.

  Finally, consider the strongest case against this recommendation, as articulated by a colleague who prioritizes community support over archival precision:

  "I hear the Chair's concern for accuracy, but the register exists to support living communities rather than to award pedigrees. If we start auditing origins and demanding amendments that embarrass the town, we endanger the grant that keeps the lanterns lit. The town knows the story; the visitors know the story. What matters is that they walk together. A panel which starts auditing origins will end up protecting nothing but archives. Certifying a development committee's invention as heritage does not discredit us; it shows we value what people do now over what happened then. Let us not privilege the archive over the people."
