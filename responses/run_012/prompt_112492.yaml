prompt: |-
  ok so in bio we spent like a week and a half on what is life and it went absolutely nowhere, and I want to know why it stalled and whether it was ever going anywhere in the first place.

  Heres how it went. Our teacher gave us the usual checklist, cells, metabolism, reproduction, responds to stuff, evolves. Then someone asked about viruses and the whole thing collapsed. And it's not just viruses. Prions are misfolded protein with no genes at all. Viroids are a naked loop of RNA. Mitochondria and chloroplasts have their own DNA and divide on their own but can't live outside us. Rickettsia and chlamydia are supposed to be alive but they can't reproduce outside a host cell either, and nobody says hookworms aren't alive. A spore or a frozen tardigrade isn't doing anything on the list, and then it is. Transposons copy themselves and evolve and nobody calls them organisms. Someone said the giant viruses they found in amoebas have genes for the protein making machinery, wich was supposed to be the line, and that broke too. Then someone remembered the definition NASA uses, self sustaining chemical system capable of evolution or something like that, and it made things worse, because then alot of things nobody cares about count. Someone else said life is a system that makes its own parts, which sounds nice and doesn't help you decide about a virus.

  Our teacher says this is a deep question about the nature of life. My friend says it's just arguing about a word and pointed at Pluto, where they didn't discover that Pluto wasn't a planet, they voted on it. I honestly can't tell which of them is right, or whether that's even the right way to split it.

  So why has this stalled? My hypothesis, and it's just a guess, is that it's not really about viruses at all but about whether a category has to have sharp edges or can be a fuzzy cluster, like Wittgensteins thing with game. But I could be wrong. Maybe it's a hidden factual question about whether life is a natural kind, or maybe everyone is answering a different question under one word, like the astrobiology people want a detection test, the origin of life people want a threshold, and the ethics people want to know what you're allowed to kill.

  Give me the diagnosis using the actual cases above, and tell me what would count as progress here, an experiment, a distinction, or just dropping the question.

  And please start with your bottom line in the first sentence and then do the reasoning. No preamble and dont restate my question back to me.
