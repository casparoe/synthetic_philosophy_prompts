answer: |-
  This is a sophisticated proposal. Most student council reforms fail because they tweak elections rather than changing the structure. Sortition (selection by lottery) is the right tool for engagement, but it introduces new risks (competence, legitimacy, legal liability).

  Below is a **Decision Protocol for Student Sortition**. This is drafted to be handed to your Deputy Head. It is structured as a logic flow: if you cannot answer a step, the process stops, and a human (Governors/Head) must make a values judgment.

  Following the protocol, I have applied it to your three cases and highlighted where the theory is contested versus settled.

  ***

  # PROPOSAL: Student Assembly Implementation Protocol
  **To:** Deputy Head of Sixth Form / Board of Governors
  **From:** [Your Name], Year 12
  **Subject:** Procedural Framework for Replacing Student Council with Sortition-Based Assembly

  ## PART 1: THE DECISION PROCEDURE
  *Instructions: This protocol must be completed before the Assembly is launched. If a step results in a "STOP," the matter must be escalated to the Board of Governors for a values-based vote.*

  ### STEP 1: JURISDICTION SCOPE (The "Can They?" Test)
  **Question:** Does the decision fall under Safeguarding, Legal Compliance, Curriculum, or Staff Employment?
  *   **YES:** **STOP.** Student Assembly has **NO** jurisdiction. These areas remain with Head/Governors. (Rationale: Legal liability cannot be delegated to minors).
  *   **NO:** Proceed to Step 2.

  ### STEP 2: AUTHORITY LEVEL (The "Binding?" Test)
  **Question:** Does the decision require budget expenditure over £500 OR a change to school-wide behavioural policy (e.g., uniforms, phones)?
  *   **YES:** **Values Judgment Required.** The Assembly recommendation is **Advisory Only**. The Head retains veto power. (Rationale: Strategic alignment and budgetary control).
  *   **NO:** Proceed to Step 3.

  ### STEP 3: POOL ELIGIBILITY (The "Who?" Test)
  **Question:** Is the goal to represent the *whole community* or the *student experience* only?
  *   **Whole Community:** Pool includes Staff + Parents + Students. (Complex, recommended **NO** for first iteration).
  *   **Student Experience:** Pool is Students Only.
      *   **Sub-Question:** Which Years?
          *   *Option A:* Whole School (Y7–13). (Best for culture, high admin load).
          *   *Option B:* Y10–13 only. (Best for maturity, excludes younger voices).
      *   **Decision:** **Select Option A or B.** (This is a policy choice, not a fact).

  ### STEP 4: STRATIFICATION (The "Fairness?" Test)
  **Question:** Do we require the Assembly to demographically match the school (Year group, Gender, SEN, Ethnicity)?
  *   **YES (Stratified):** Use a "Quota Lottery." If 20% of school is Year 7, 20% of seats must be Year 7.
      *   *Risk:* Reduces pure randomness; requires collecting sensitive data.
  *   **NO (Pure Random):** Every name in the pool has equal chance.
      *   *Risk:* Could result in an Assembly of only Year 13s by chance.
      *   **Decision:** **Select Stratified or Pure.** (Political theorists disagree here; see "Consensus Note" below).

  ### STEP 5: COMPULSION & REPLACEMENT (The "Attendance?" Test)
  **Question:** Is service mandatory (like Jury Duty) or voluntary?
  *   **Mandatory:** Students picked *must* serve unless medically exempt.
      *   *Risk:* Resentment, poor engagement.
  *   **Voluntary (Opt-Out):** Students picked can decline; next name drawn.
      *   *Risk:* Self-selection bias (only civically minded students say yes), defeating the purpose of sortition.
      *   **Decision:** **Recommend Voluntary with Max Opt-Outs.** (e.g., A student can decline once; if picked a second time, service is mandatory).

  ### STEP 6: TERM LENGTH (The "Continuity?" Test)
  **Question:** What is the balance between Freshness and Experience?
  *   **Short (1 Term):** High turnover, many students involved, low institutional memory.
  *   **Long (1 Year):** Low turnover, fewer students involved, higher competence.
      *   **Decision:** **Recommend 1 Academic Year.** (Too much training is lost in 1 term).

  ***

  ## PART 2: CONSENSUS NOTE (Read Before Meeting)
  *You asked for honesty on what is settled vs. contested. Do not claim consensus where there is none.*

  | Issue | Settled Fact | Contested / Values |
  | :--- | :--- | :--- |
  | **Engagement** | Sortition guarantees a representative sample *if* participation is high. | Whether students *want* to participate without being elected is unknown. |
  | **Stratification** | Pure random is mathematically simpler. | Whether "Descriptive Representation" (looking like the school) matters more than "Equality of Chance" is a political debate. |
  | **Binding Power** | Minors cannot hold legal liability for school decisions. | Whether "Advisory" power renders the body toothless is the main argument against this model. |
  | **Scope** | Safeguarding/Law is non-negotiable (Head/Governors only). | Whether "Behavioural Policy" (phones/uniform) counts as Safeguarding is debatable. |

  ***

  ## PART 3: RUNNING THE PROCEDURE ON REAL CASES
  *Here is the protocol applied to your three specific problems. I have highlighted the output you may not like.*

  ### CASE 1: Banning Phones During the School Day
  *   **Step 1 (Jurisdiction):** Is it Safeguarding/Law? **No.** (It is behavioural policy).
  *   **Step 2 (Authority):** Does it change school-wide behavioural policy? **YES.**
  *   **Protocol Output:** **Advisory Only.**
  *   **Reasoning:** Even if the Assembly votes to ban phones, the Head must enforce it. If staff do not support it, it fails. The Assembly can recommend, but the Head must own the enforcement burden.
  *   **Verdict:** The Assembly can survey students and propose the ban, but the Head can veto it without breaching the protocol.

  ### CASE 2: Spending the £4,000 PTA Donation
  *   **Step 1 (Jurisdiction):** Is it Safeguarding/Law? **No.**
  *   **Step 2 (Authority):** Does it require budget expenditure over £500? **YES.**
  *   **Protocol Output:** **Advisory Only (with Caveat).**
  *   **Correction:** *Wait.* Step 2 says >£500 is Advisory. However, if the PTA designated this money *specifically* for student use, the Governors can pre-authorize this pot as "Delegated Authority."
  *   **Revised Protocol Path:** If Funds are Earmarked for Students -> **Binding.**
  *   **Verdict:** **Binding.** This is the "Quick Win." Let the Assembly decide this to prove competence. It is low risk and high visibility.

  ### CASE 3: Changing PE Kit Rules for Trans Students
  *   **Step 1 (Jurisdiction):** Is it Safeguarding/Law? **YES.**
  *   **Protocol Output:** **STOP. NO JURISDICTION.**
  *   **Reasoning:** This touches on Equality Act 2010 compliance, Safeguarding policy, and potentially single-sex space exemptions. This is a legal minefield.
  *   **The Answer You Won't Like:** **The Student Assembly cannot decide this.** Not because they are unfair, but because if they get it wrong, the school gets sued or fails an inspection. This decision must remain with the Governors/Head, informed by specialist advice, not a student lottery.
  *   **Why this hurts:** It reinforces the exact powerlessness you are trying to fix. However, pitching this as a "Binding Student Decision" at a Governors meeting will get your entire proposal laughed out of the room. Acknowledging this limit shows maturity.

  ***

  ## PART 4: WHERE THE PROCEDURE CANNOT HELP
  *Be prepared to say this explicitly in the meeting.*

  The procedure above handles **process**, but it cannot resolve **values**. You will face three questions where there is no "correct" answer, only a political choice:

  1.  **Legitimacy vs. Efficiency:** A random assembly is more *legitimate* (representative) but less *efficient* (takes longer to decide) than an elected council. The Governors must decide if they value speed or representation more.
  2.  **Comfort vs. Growth:** Do we pick students who *want* to do it (comfortable, confident speakers) or force students who *wouldn't* (anxious, unheard voices)? Stratification and Compulsion (Step 4 & 5) are values choices, not facts.
  3.  **Trust:** The procedure assumes the Head will listen to "Advisory" recommendations. If the Head ignores the Assembly on the Phone Ban (Case 1), the Assembly loses credibility. The procedure cannot force the Head to care; only culture can do that.

  ### Recommendation for the Meeting
  Do not pitch this as "The Solution." Pitch it as **"The Pilot Protocol."**
  1.  Ask for a **1-Year Trial**.
  2.  Accept **Advisory Status** for Policy (Case 1 & 3) to get buy-in.
  3.  Demand **Binding Status** for the PTA Money (Case 2) to prove competence.
  4.  Accept the **Safeguarding Exclusion** (Case 3) explicitly to show you understand legal limits.

  If you try to claim binding power on Safeguarding or Trans policy, you will lose the room. If you concede that point but demand control over the £4,000, you look responsible.
