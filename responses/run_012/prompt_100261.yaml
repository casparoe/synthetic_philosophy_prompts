prompt: |-
  ok so im in year 12 and ive somehow ended up being the person who has to fix our student council. the problem is everyone hates it: like 8% of the school actually votes, the same popular kids win every year, and when they pass something the head just ignores it. i read somewhere about sortition / lottocracy — picking people by lottery like jury duty instead of electing them — and i want to pitch replacing our council with a randomly chosen "student assembly" at the next governors meeting. i need an actual procedure i can hand to the deputy head, not a theory essay.

  so: give me a decision procedure i can actually run. the questions to ask in order, what counts as a good enough answer to each, where it stops with a no, and where it has to go to a human because its a values question and not a fact one. it needs to cover the bits i keep getting stuck on: who is even in the pool (whole school, or just years 10–13?), whether we should rig the draw so its "representative" (stratified by year, gender, whatever) or just take the raw random draw and live with it, what happens when someone refuses to serve, how long they sit for, and — the bit everyone argues about — whether their decisions are actually binding or just advice. and is it even the right tool for every question, or are some things you should never decide by lottery at all?

  then run it on three real ones we're facing: (1) whether to ban phones during the school day, (2) how to spend the £4,000 the PTA just gave us, (3) changing the PE kit rules for trans students. i want to see it give me an answer i wont like on at least one of these, and i want you to say straight out where the procedure just cant help.

  the deputy head has to sign it off and the governors vote on it, so it cant be vague. also please be honest about whats actually settled among people who study this versus whats genuinely argued about, and dont sell me a contested view as if everyone agrees — i'll get absolutely shredded at that meeting if i do that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Year 12 student (approx. 16-17 years old). Tasked with fixing a broken Student Council.
      *   **Problem:** Low engagement (8% vote), oligarchy (same popular kids win), inefficacy (Head ignores proposals).
      *   **Proposed Solution:** Sortition (random selection) instead of elections.
      *   **Deliverable:** A concrete *decision procedure* (algorithm/flowchart style) to hand to the Deputy Head. Not a theory essay. Needs to cover specific sticking points (pool, stratification, refusal, term length, binding vs. advisory, scope).
      *   **Application:** Run the procedure on three specific cases (Phone ban, £4k PTA money, PE kit/Trans students).
      *   **Constraint 1:** Must produce an answer the user *won't like* on at least one case.
      *   **Constraint 2:** Must be honest about what is settled vs. contested in political theory/practice (no false consensus).
      *   **Constraint 3:** Needs to be formal enough for Governors/Deputy Head but practical for a student.
      *   **Constraint 4:** Identify where the procedure *cannot* help (values questions).

  2.  **Deconstruct the "Decision Procedure":**
      *   A decision procedure needs inputs, decision nodes, and outputs.
      *   It needs to distinguish between *designing the system* (Constitutional level) and *running the system* (Operational level). The user is asking for the design procedure to pitch to the Governors.
      *   *Key Variables:*
          1.  Eligibility Pool (Who can be picked?)
          2.  Stratification (Pure random vs. Representative?)
          3.  Compulsion/Opt-out (Can you say no?)
          4.  Term Length (How long?)
          5.  Power (Binding vs. Advisory?)
          6.  Scope (What can they decide?)

  3.  **Drafting the Procedure (The "Sortition Implementation Protocol"):**
      *   *Step 1: Scope Definition.* What is this body allowed to touch? (Crucial for the "values" limit).
      *   *Step 2: Pool Definition.* Who is eligible?
      *   *Step 3: Stratification Method.* How to ensure fairness/representation?
      *   *Step 4: Selection & Replacement.* How to handle refusals.
      *   *Step 5: Authority Level.* Advisory vs. Binding.
      *   *Step 6: Review.* When do we check if it worked?
      *   *Honesty Check:* I need to explicitly state where political theorists disagree. For example, binding vs. advisory is *highly* contested in school contexts. Pure random vs. stratified is also debated (pure random is more democratic, stratified is more "representative").

  4.  **Running the Procedure on the Three Cases:**
      *   *Case 1: Phone Ban.* High impact, behavioral. Usually requires enforcement.
      *   *Case 2: £4k PTA Money.* Low risk, discretionary spending. Ideal for student input.
      *   *Case 3: PE Kit/Trans Students.* Rights-based, safeguarding, legal compliance. High risk.
      *   *Requirement:* One answer must be unpopular/unexpected.
      *   *Strategy:* The procedure should likely flag Case 3 as *out of scope* for a student body (binding or not) because it involves safeguarding and legal compliance, which Governors/Head must retain. This might be the "answer you won't like" (i.e., students can't decide this). Or, if the procedure says "Advisory only," the user might hate that they don't get binding power. Let's aim for the Scope limitation on Case 3 as the hard stop.

  5.  **Refining the "Honesty" Aspect:**
      *   Must clarify that sortition in schools is rare/experimental. There is no "standard."
      *   Must clarify that "Binding" decisions in schools are legally tricky (Safeguarding, Budget, Curriculum are usually Governor/Head remit).
      *   Must clarify that Stratification (quotas) vs. Pure Lottery is a trade-off between statistical representation and pure equality of chance.

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the ambition. Set the tone (formal but clear).
      *   **The Procedure (The "Protocol"):** Break it down into Decision Nodes.
          *   Node 1: Jurisdiction (What can they decide?). *Values Question.*
          *   Node 2: The Pool (Who is eligible?). *Fact/Policy.*
          *   Node 3: Stratification (Quotas?). *Contested.*
          *   Node 4: Opt-outs. *Practicality.*
          *   Node 5: Authority (Binding?). *Legal/Power.*
      *   **The "Settled vs. Contested" Box:** Crucial for the user's protection at the meeting.
      *   **Application to Cases:**
          *   Phone Ban: Likely Advisory (enforcement issues).
          *   PTA Money: Likely Binding (low risk).
          *   PE Kit/Trans: Likely *Excluded* (Safeguarding/Legal). *This is the "won't like" answer.*
      *   **Where the Procedure Fails:** Explicitly state that the procedure can't decide *values* (e.g., "Is fairness more important than efficiency?").

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use clear headings, "If/Then" logic, and bold text for the "Handover" document.
      *   *Critique:* Did I meet the "answer I won't like" constraint?
      *   *Fix:* Ensure the PE Kit case results in "Students cannot decide this," which is frustrating for a reformer.
      *   *Critique:* Did I distinguish between designing the system and using it?
      *   *Fix:* The procedure is for the *Governors* to design the system. The cases are tests of that design.
      *   *Critique:* Is the distinction between Fact and Values clear?
      *   *Fix:* Add a specific column or note in the procedure marking "Values Judgment Required."

  8.  **Final Polish:**
      *   Ensure the tone is respectful of the Deputy Head's authority but firm on the logic.
      *   Check the "Sortition" terminology (use "Citizens' Assembly" or "Student Panel" as it sounds less academic).
      *   Make sure the "8% turnout" problem is addressed by the design (sortition solves engagement by forcing participation, but needs buy-in).

  9.  *(Self-Correction on the "Answer I Won't Like"):* If I say the Student Assembly can't decide on Trans PE kits, that's realistic but might feel like a cop-out. A better "unlikeable" answer might be that for the Phone Ban, the procedure dictates it must be *Advisory Only* because enforcement requires staff buy-in, meaning the students do the work but don't get the power. Or, regarding Stratification: The procedure might conclude that *Pure Random* is better, which means the Assembly could end up all Year 13s by chance, which looks bad. Let's go with the **Scope/Legal Limit** on the Trans PE kit issue. It's the most robust "Hard No" based on safeguarding law, which a Deputy Head will respect, but the student reformer will hate.

  10. *(Refining the "Contested" parts):* Be very clear that "Binding vs. Advisory" is the biggest fight. Most schools won't give binding power on policy. I need to make sure the user knows this is a negotiation point, not a fact.

  11. *(Final check on constraints):*
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Stop conditions? Yes.
      *   Values vs. Facts? Yes.
      *   Three cases run? Yes.
      *   One unlikeable answer? Yes.
      *   Honest about consensus? Yes.

