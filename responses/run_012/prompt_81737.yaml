  I was going through an old intro social-choice chapter a friend lent me, and it has a paragraph on Sen's liberal paradox that I'm not sure I trust. It goes something like this: 'Sen showed that no society can be both liberal and efficient. If you give each person the right to decide certain private matters for themselves — whether to read a book, say — the collective choice can land on an outcome everybody would rather avoid. His famous example involves a prude and a lewd reader of an obscene novel, and it turns out that honoring their individual rights forces society to a result worse than the one both of them would have chosen. So the Pareto principle and individual liberty are logically incompatible: a consistent liberal has to give up Pareto, and a consistent economist has to give up rights.'

  I've heard Sen's name atached to a paradox about rights before, so the shape of it feels right, but the paragraph is doing something that bugs me and I can't put my finger on it. Can you go through it claim by claim and tell me what a social choice person would nod at, what they'd wince at, and what's just plain wrong? In particular I want to know wether the example really shows a society stuck at an outcome everyone dislikes, and whether that last line — that you have to ditch one of the two principles — actually follows from the theorem, or whether it's the textbook overselling it. If the standard response from people who work on this is that Sen's result is really about one particular way of formalizing rights rather than about liberty itself, spell that out, since I suspect that's the thing I'm missing. Please write in American English and don't worry about being gentle, I just want to know which parts I can safely repeat.
