answer: |-
  Your gut feeling is correct: there is a trick in Tom's logic. It sounds convincing because it uses the language of finance and insurance, which feels objective, but it misapplies how social welfare systems actually work and why they exist.

  Tom is arguing from a principle of **actuarial fairness** (like a private bank or insurance company). You are arguing from a principle of **social contract** (like a community or society).

  Here is the breakdown of where Tom's logic holds water, where it leaks, and whether your girlfriend is getting a raw deal.

  ### 1. The "Insurance" Fallacy
  Tom's core argument is: *"It's a mutual insurance scheme, and you can only draw out what you and people like you have put in."*

  This is the trick. In almost all modern welfare states, social security is **not** a personal savings account. It is a **pay-as-you-go redistribution system**.
  *   **How it works:** The tax taken from your girlfriend's first paycheck does not go into a vault with her name on it. It is spent immediately on current pensioners, current unemployed people, and current healthcare patients.
  *   **The Implication:** If the system were truly "insurance" as Tom describes, you would only be allowed to claim benefits if you had personally contributed enough to cover that specific claim. But that isn't how it works for anyone. People who become disabled young, or who retire early, or who have long periods of unemployment often take out far more than they put in. They are covered by the *solidarity* of the group, not their own ledger.

  **The Flaw:** By treating your girlfriend like a private insurance client (pay in before you get coverage) while treating established residents like members of a social contract (we cover you because you belong), the state is categorizing her differently to maximize revenue and minimize risk.

  ### 2. The "Cut Loose" Test
  You asked: *"If his logic holds, doesn't it also mean the scheme should cut loose anyone else who takes out more than they put in?"*

  **Yes. Exactly.** And that is why Tom's logic is dangerous if applied universally.
  *   If we strictly follow Tom's "ledger" logic, the state should deny unemployment benefits to anyone who hasn't worked long enough to "fund" their own unemployment.
  *   It should deny disability support to anyone who hasn't paid in enough premiums to cover their injury.
  *   It should deny pensions to anyone who didn't live long enough to "earn" them.

  We don't do that because the point of social security is to prevent destitution, not to balance individual books. Tom's logic works for a *private* insurer trying to make a profit, but it fails for a *public* system trying to ensure stability. If you cut loose everyone who takes out more than they put in, you dismantle the safety net for the most vulnerable citizens.

  ### 3. The "Risk Pool" Argument
  Tom argues: *"If she gets the full payout on day one, everyone else in the scheme is carrying a risk they never signed up for."*

  There is some truth here regarding **adverse selection**. Governments want to prevent "benefit tourism," where people move solely to claim welfare without working. Waiting periods are a standard tool to mitigate this.

  **However, here is the counter-point:**
  Migrants on work visas are often **lower risk** than the native-born population.
  *   They are usually vetted for health.
  *   They are usually of working age.
  *   They are usually employed immediately (like your girlfriend).
  *   They often cannot access benefits *at all* if they lose their job (they might lose their visa).

  By taxing her immediately but denying her coverage, the state is effectively collecting a "risk premium" from a low-risk candidate without providing the insurance. From an actuarial standpoint, she is subsidizing the existing pool. She is paying for the risks of others while being barred from protection herself.

  ### 4. Tom's "Bond" Idea
  Tom suggests: *"The honest version is a bond... she pays a surcharge for the first ten years and gets it back if she never claims."*

  This is intellectually interesting but practically flawed.
  *   **Administrative Nightmare:** Tracking individual bonds over decades is expensive and complex.
  *   **Inflation:** A bond paid today might be worthless in 10 years.
  *   **Two-Tier Citizenship:** It creates a class of residents who have to "buy" their rights to safety, while others get them by virtue of birth or tenure.

  However, Tom's second point on this is sharper: *"The bond should be posted by the clinic."*
  He is right that the clinic is the primary beneficiary of her labor. They get a filled role that has been vacant for two years. They pay standard taxes, but the state absorbs zero risk regarding her welfare. In some policy models, employers *do* pay higher levies for sponsored visa workers to cover exactly this potential liability.

  ### 5. Is She Getting a Raw Deal?
  **Yes, but it is a common one.**

  Most countries (Australia, UK, New Zealand, etc.) have waiting periods for new residents regarding specific benefits (like unemployment or family tax credits). The logic is to ensure commitment to the country.

  **However, it is a "raw deal" in this specific sense:**
  1.  **Immediate Liability:** She is liable for taxes and social insurance from Day 1.
  2.  **Delayed Rights:** She is excluded from the protections those taxes fund for a set period.
  3.  **Net Positive for the State:** For those first few years, she is a net fiscal contributor with no safety net. If she gets sick or the clinic closes, she cannot fall back on the system she is funding.

  ### How to Answer Tom
  Tom isn't "wrong" about the mechanics of insurance, but he is wrong about the morality of the social contract. You can tell him:

  > "You're treating the welfare state like a private bank account, but it's actually a community pool. We all agree that if someone falls down, we pick them up, even if they haven't paid in enough yet. If we apply your 'ledger logic' strictly, we'd have to cut off the disabled and the retired too.
  >
  > The real issue isn't that she has to wait; it's that she's being forced to pay into a risk pool she isn't allowed to swim in. That's not 'keeping the books straight'; that's asking her to subsidize everyone else's security while she has none. That's not fairness, that's a surcharge on being new."

  ### Summary
  *   **Tom's Logic:** Consistent with *private* insurance, inconsistent with *social* welfare.
  *   **The Trick:** Defining the system as "actuarial" when it suits the state (excluding her) and "solidarity" when it suits the state (taxing her).
  *   **The Verdict:** She is getting a raw deal relative to a full citizen, but it is a standard administrative hurdle for migrants. It is the price of entry.
  *   **Advice:** Don't let it sour the move. She has a job in a clinic that desperately needs her, which gives her leverage and security. The best "insurance" she has right now is her employability, not the state. Budget as if those benefits don't exist, and treat the exclusion period as a temporary hurdle, not a permanent injustice.

  Tom is right that it keeps the books straight for the government. You are right that it leaves your girlfriend exposed. Both things can be true.
