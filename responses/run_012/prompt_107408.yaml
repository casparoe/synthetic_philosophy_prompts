  7.  **Key Insight to Highlight:** The "Trick" is the definition of the system. Tom defines it as a *bank account* (I put in, I take out). Reality is it's a *pool* (We put in, those in need take out). By treating it as a bank account for her, but a pool for everyone else, the system gains a windfall.

