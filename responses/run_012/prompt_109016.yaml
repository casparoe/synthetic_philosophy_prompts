prompt: |-
  My friend and I got into a stupidly long argument last night about logical uncertainty and I'm still annoyed, so I need someone to settle it. He's a CS grad student who's definately read some of the logical induction papers (or skimmed them) and he says a logical inductor is a computable sequence of probability assignments over logical sentences that's supposed to be reasonable -- coherent, learns theorems, etc. Then he claims that if you let one run forever it eventually assigns probability 1 to every true sentence and 0 to every false one, even for statements that are independent of your axioms. So we could just point one at the Riemann hypothesis and read off the answer. I said that can't be right, because if it could do that it would decide RH, and there are statements that are undecidable. He said that's the whole point: it doesn't need to prove them, it converges to the truth by induction. That sounds like magic to me. But now I'm starting to think he might be right, because the whole point of logical induction is supposed to be getting around the limits of formal proof, right?

  I tried to trip him up with a sentence S that says: the inductor will never assign S a probability greater than 0.5. If the inductor is any good, doesn't it have to keep S at exactly 0.5 forever? If it ever goes above 0.5, then S is false, so it should come back down; if it stays below, then S is true, so shouldn't it go up? He said that's just the liar paradox and the logical induction criterion is designed to handle it, but he couldn't explain how. Does the inductor assign S a probability at all? Does that probability converge? And if it doesn't converge to 0 or 1, doesn't that contradict his claim that it converges to the truth?

  So what's actually going on? What does the convergence guarantee for a logical inductor really say, and why doesn't it let you read off the truth of RH or decide independent statements? What does it do with self-referential probability sentences like S? I feel like the confusion is something about the difference between eventually assigns high probability and proves or is true, but I can't seperate the two. Also, if the inductor is computable, how can it converge to the truth about undecidable sentences at all? Please don't just tell me to read the paper -- I want the actual picture.
