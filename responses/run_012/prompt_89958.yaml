prompt: |-
  I'm in a philosophy of action readin group and we keep hitting the same picture. Someone will say that when a couple agrees to meet at the station, or a committee votes to hire someone, or a crowd pulls down a statue, the group itself intends and acts, and that this is just like an individual intending and acting -- one big agent, with the members as its parts. Our professor calls it the group-mind-is-like-a-mind picture, but says not to take it literally. I want a propper audit of that analogy. Lay out what is supposed to map onto what: belief, desire, intention, decision, action, responsibility, maybe the unity of consciousness or a single point of view. Then tell me where the mapping actually holds and where it breaks. Does a group have one intention when its members have conflicting reasons, or when membership changes halfway through? Does the one-big-agent picture smuggle in a central controller or a unified perspective that joint action doesn't need?

  One person in the group says collective intention is just individual intentions plus common knowledge; another says there's a genuinely joint commitment that can't be reduced that way. Which parts of the analogy are each of them leaning on, and do those parts survive the disanalogies? And when someone says a corporation is a person or that a group can be morally responsible, which parts are they leaning on? I'd like the correspondences set out explicitly -- a table is fine -- then the breaks separated into ones that matter for those conclusions and ones that are just noise, and finally what a better analogy would be if this one is carrying more than it can.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of action reading group.
      *   **Problem:** The group keeps relying on the "group-mind-is-like-a-mind" analogy (the "one big agent" picture). The professor warns against taking it literally.
      *   **Task:** Audit this analogy.
      *   **Specific Requirements:**
          *   Map the concepts (belief, desire, intention, decision, action, responsibility, unity of consciousness/point of view).
          *   Identify where the mapping holds and where it breaks.
          *   Address specific puzzles (conflicting reasons, changing membership).
          *   Address the "smuggling" of a central controller/unified perspective.
          *   Analyze the two opposing views in the group (Summative/Individualist vs. Non-Reductive/Joint Commitment) in light of the analogy.
          *   Analyze claims about corporate personhood and moral responsibility.
          *   **Format:** Explicit correspondences (table preferred), separate significant breaks from noise, propose a better analogy.

  2.  **Deconstruct the "One Big Agent" Analogy:**
      *   *Source Domain:* Individual Human Agent (Psychology/Action Theory).
      *   *Target Domain:* Collective/Group Agent (Social Ontology/Collective Action).
      *   *Core Claim:* $Group \approx Individual$, $Members \approx Organs/Parts$.

  3.  **Drafting the Mapping (Table):**
      *   Need to pair individual attributes with collective attributes.
      *   *Belief:* Individual belief $\rightarrow$ Group belief (accepted proposition).
      *   *Desire/Goal:* Individual desire $\rightarrow$ Group goal/mission.
      *   *Intention:* Individual intention $\rightarrow$ Collective intention ("We intend").
      *   *Decision:* Individual choice $\rightarrow$ Voting/Consensus procedure.
      *   *Action:* Individual movement $\rightarrow$ Coordinated member actions.
      *   *Responsibility:* Individual blame/praise $\rightarrow$ Collective liability/reputation.
      *   *Unity/POV:* Phenomenal consciousness $\rightarrow$ ??? (This is the weak point).

  4.  **Analyzing the Breaks (The "Audit"):**
      *   *Where it holds:* Functional role. Groups *act* as if they have intentions. They can be held responsible legally and morally. They have decision procedures.
      *   *Where it breaks:*
          *   *Phenomenology:* Groups don't *feel*. No "what it is like" to be a committee.
          *   *Conflicting Reasons:* Individuals can have akrasia or conflicting desires internally. Groups have conflict *between* members, not necessarily *within* the "group mind."
          *   *Membership Change:* Theseus's Ship problem. If I lose a hand, I'm still me. If a committee replaces all members, is it the same agent? (Legal fiction says yes, metaphysics says maybe not).
          *   *Central Controller:* The analogy suggests a homunculus. Joint action often works via distributed coordination (market, crowd) without a "brain."

  5.  **Addressing the Reading Group Disagreement:**
      *   *Person A (Summative/Individualist):* "Collective intention = Individual intentions + Common Knowledge." (Gilbert might critique this, Bratman supports a version of this). They lean on the *functional* mapping but deny the *ontological* leap. They think the "One Big Agent" is just a shorthand for many small agents coordinating.
      *   *Person B (Non-Reductive/Joint Commitment):* "Genuinely joint commitment." (Margaret Gilbert). They lean on the *normative* mapping (obligations exist that aren't just individual). They need the "One Big Agent" to be more real to ground the irreducible obligation.
      *   *Survival:* Person A survives the phenomenology break better. Person B survives the responsibility/normativity break better.

  6.  **Corporate Personhood & Moral Responsibility:**
      *   *Corporate Personhood:* Leans on *Decision* and *Responsibility* mappings. Needs the group to hold identity over time (persistence conditions).
      *   *Moral Responsibility:* Leans on *Intention* and *Belief*. Can a group *know* it's doing wrong? (Functionalist view: Yes, if its procedures yield that knowledge).

  7.  **Developing a Better Analogy:**
      *   The "Organism" analogy is common but implies too much unity/biology.
      *   The "Machine/Algorithm" analogy is good for function but misses normativity.
      *   *Suggestion:* **A Distributed Network or a Game.**
      *   *Why:* Captures coordination without a central brain. Captures rules (norms) without needing a singular consciousness. Captures the "We" as a status within a system rather than a metaphysical substance.
      *   *Alternative:* **The "Plural Subject" (Gilbert's term).** It's not one mind, it's a *we* formed by commitment.
      *   *Best Alternative for this prompt:* **The "Institution/Office" Analogy.** Focuses on roles and procedures rather than psychology.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the professor's warning (category mistake risk).
      *   **Section 1: The Mapping Table.** Clear side-by-side comparison.
      *   **Section 2: The Audit (Holds vs. Breaks).** Distinguish Functional vs. Phenomenological.
      *   **Section 3: The Specific Puzzles.** Conflict, Membership, Central Controller.
      *   **Section 4: The Reading Group Debate.** Individualist vs. Non-Reductive.
      *   **Section 5: Corporate Personhood & Responsibility.** What they rely on.
      *   **Section 6: A Better Analogy.** Propose the "Institutional Role" or "Distributed System" model.

  9.  **Self-Correction/Nuance Check:**
      *   *Caution:* Don't dismiss the "One Big Agent" view entirely. Functionalists (like List & Pettit) argue groups *can* be agents. Need to acknowledge this while highlighting the disanalogies.
      *   *Nuance:* Distinguish between *aggregative* groups (crowd) and *organized* groups (committee). The analogy works better for the latter.
      *   *Terminology:* Use standard terms (Summative, Non-Summative, Plural Subject, Functionalist).
      *   *Tone:* Academic but accessible (reading group context).

  10. **Final Polish:** Ensure the table is clean. Make sure the "Better Analogy" section directly addresses the flaws identified in the "One Big Agent" model. (Decided to push the "Institution/Office" analogy as it handles persistence and normativity better than "Organism").

  *(Self-Correction during drafting)*: Wait, the prompt asks specifically about the "One Big Agent" analogy. I need to make sure I don't just switch to List & Pettit's functionalism without evaluating the *analogy* itself. The analogy implies *similarity*, functionalism implies *identity of role*. I need to be careful there. The "One Big Agent" picture is often a heuristic for functionalism. I will treat it as the "Organismic/Unitary Agent" model.

  Let's organize the "Breaks" into "Metaphysically Fatal" vs. "Functionally Irrelevant."
  Let's organize the "Reading Group" positions as "Reductive Individualism" vs. "Plural Subject Theory."

  Okay, ready to write.
answer: |-
  This is a classic problem in social ontology and the philosophy of action. Your professor is warning you against a **category mistake**: treating a logical or functional construct as if it were a metaphysical substance identical to a human mind.

  The "One Big Agent" analogy (often called the *organismic* or *unitary* model) is heuristically powerful but metaphysically dangerous. Below is an audit of that analogy, mapping the source domain (Individual Human) to the target domain (Collective Group), followed by an analysis of where the wiring fails.

  ### 1. The Mapping Audit

  Here is the explicit correspondence the "One Big Agent" picture relies on.

  | Feature | Individual Agent (Source) | Group Agent (Target) | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Belief** | Mental state representing the world as true. | Group position/accepted premise (often via voting or expert delegation). | **Functional Hold / Phenomenological Break** |
  | **Desire/Goal** | Internal motivation driving action. | Mission statement, charter, or aggregated preference. | **Functional Hold** |
  | **Intention** | Commitment to act based on belief/desire. | Collective intention ("We intend to X"). | **Contested (See Section 4)** |
  | **Decision** | Internal choice mechanism (will). | Procedure (voting, consensus, hierarchy). | **Structural Hold** |
  | **Action** | Bodily movement caused by intention. | Coordinated member movements (signing, lifting, speaking). | **Causal Hold** |
  | **Responsibility** | Moral/Legal liability for outcomes. | Corporate liability, reputation damage, sanctions. | **Normative Hold** |
  | **Unity of Consciousness** | "What it is like" to be me; single POV. | ??? (No phenomenological experience). | **Total Break** |
  | **Persistence** | Continuity of memory/biology. | Continuity of charter/roles despite member turnover. | **Legal Hold / Metaphysical Strain** |

  ---

  ### 2. Where the Mapping Holds vs. Breaks

  To audit this properly, we must distinguish between **Functional Isomorphism** (does it do the same job?) and **Ontological Parity** (is it made of the same stuff?).

  #### Where it Holds (Functional Isomorphism)
  The analogy works well when we look at *input-output* relations and *normative status*.
  *   **Rationality:** Groups can display rationality (or irrationality) independent of members. (e.g., The Discursive Dilemma: A committee can hold logically inconsistent beliefs even if every member is consistent).
  *   **Action:** We can truthfully say "The University hired a professor," even though no single individual performed the hiring act alone.
  *   **Responsibility:** We can punish a corporation (fines) without punishing specific members, implying the *group* was the agent of the wrongdoing.

  #### Where it Breaks (Ontological Parity)
  The analogy fails when we look at *internal constitution* and *phenomenology*.
  *   **Phenomenology:** There is no "what it is like" to be a committee. There is no group pain, no group qualia. If the analogy requires a unified point of view, it is literally false.
  *   **Volition:** An individual can decide instantly. A group requires time, communication, and procedure. The "will" of the group is not a mental event but a social status achieved through protocol.
  *   **Akrasia (Weakness of Will):** An individual can intend X but do Y due to internal conflict. A group usually cannot "do Y" unless the procedure authorizes Y. If members go rogue, it is usually classified as *unauthorized action*, not group akrasia.

  ---

  ### 3. The Specific Puzzles

  You asked about three specific stress points. Here is how the "One Big Agent" picture handles them:

  **A. Conflicting Reasons**
  *   *Individual:* I can have conflicting desires (eat cake vs. lose weight) within one mind. The conflict is internal.
  *   *Group:* If members have conflicting reasons, the "One Big Agent" picture struggles. Is the conflict *inside* the group mind or *between* the parts?
  *   *The Break:* If the group is truly "one agent," the conflict should be internal. But usually, we resolve this via voting. This suggests the group isn't a mind synthesizing reasons, but a **mechanism for aggregating** them. The "One Big Agent" picture smoothes over the friction that actually constitutes the group's decision.

  **B. Changing Membership (The Ship of Theseus)**
  *   *Individual:* If I lose cells, I remain me. If I lose memory, my identity is threatened.
  *   *Group:* If a committee replaces all members over 5 years, is it the same agent?
  *   *The Break:* Legally, yes. Metaphysically, the "One Big Agent" analogy wobbles. If the "mind" is constituted by the members, the mind has died and been replaced. If the "mind" is constituted by the *rules*, then the members are just hardware. The analogy hides this distinction. It assumes the "soul" of the group survives without explaining where it lives (usually in documents/traditions, not brains).

  **C. The Central Controller (The Homunculus)**
  *   *The Worry:* Does the "One Big Agent" picture smuggle in a ghost in the machine?
  *   *The Reality:* Yes, it often does. It tempts us to think there is a "Group Will" hovering above the members.
  *   *Correction:* Joint action does **not** need a central controller. A crowd pulling a statue acts jointly via mutual responsiveness, not a central brain. The "One Big Agent" picture falsely implies hierarchy where there might only be network coordination.

  ---

  ### 4. The Reading Group Debate: Individualism vs. Joint Commitment

  Your group members are echoing the debate between **Summative Accounts** (e.g., Michael Bratman, early Gilbert) and **Non-Reductive Accounts** (e.g., Margaret Gilbert, Christian List).

  #### Person A: "Individual Intentions + Common Knowledge"
  *   **Position:** Reductive Individualism.
  *   **Leaning on the Analogy:** They lean on the **Action** and **Decision** mappings but deny the **Unity** mapping.
  *   **Argument:** "We intend" is just shorthand for "I intend that we J, you intend that we J, and we know this."
  *   **Survival of Disanalogies:** This view survives the *Phenomenology Break* easily (no group mind needed). However, it struggles with *Obligation*. If I just have an individual intention, why can I not drop out without wronging you?
  *   **Weakness:** It cannot explain the *normative force* of collective action. If the group is just a sum of parts, the "group" cannot hold me responsible, only individuals can.

  #### Person B: "Genuinely Joint Commitment"
  *   **Position:** Plural Subject Theory (Non-Reductive).
  *   **Leaning on the Analogy:** They lean on the **Intention** and **Responsibility** mappings.
  *   **Argument:** "We intend" creates a new normative entity. We are bound together. I cannot withdraw unilaterally without violating a commitment *to the group*.
  *   **Survival of Disanalogies:** This view survives the *Responsibility* and *Obligation* tests better. However, it risks the **Central Controller** worry. If the commitment is "joint" and irreducible, where does it exist?
  *   **Weakness:** It risks reifying the group too much, making it sound like a mystical substance.

  **Verdict:** Person A explains the *mechanics* better; Person B explains the *normativity* better. The "One Big Agent" analogy is too blunt to capture the nuance between them.

  ---

  ### 5. Corporate Personhood & Moral Responsibility

  When someone says "The Corporation is a Person" or "The Group is Responsible," they are selectively activating parts of the analogy.

  *   **Corporate Personhood:** Leans on **Persistence** and **Decision**.
      *   *Why:* To sign contracts or own property, the entity must survive member turnover and have a unified will.
      *   *Risk:* It ignores the **Phenomenology Break**. Corporations don't feel pain, so punishing them (fines) is different than punishing humans (imprisonment).
  *   **Moral Responsibility:** Leans on **Belief** and **Intention**.
      *   *Why:* To be blameworthy, you must know what you are doing (Belief) and choose to do it (Intention).
      *   *Risk:* It ignores the **Conflicting Reasons** break. A corporation might "know" it is polluting (via reports) but the "will" to stop is blocked by structural incentives. Is the *group* malicious, or just structurally flawed? The analogy conflates structural flaw with moral malice.

  ---

  ### 6. A Better Analogy: The "Institution/Office" Model

  The "One Big Agent" (Organism) analogy is carrying too much weight because it implies biological/psychological unity. A better analogy for your reading group is the **Institutional Office** or **Distributed Algorithm**.

  **Why this is better:**
  1.  **No Phenomenology Required:** An office (e.g., "The Presidency") acts, decides, and bears responsibility, but no one thinks the office itself *feels*. It avoids the "group mind" literalism.
  2.  **Handles Membership Change:** Offices persist because the *role* persists, not the *person*. This explains how a committee survives member turnover without metaphysical magic.
  3.  **Distributed Control:** An algorithm processes inputs to produce outputs without a "central controller." This captures how crowds or markets act jointly without a "group brain."
  4.  **Normativity without Mysticism:** Obligations attach to the *role*, not the metaphysical substance. I am obligated to the "Committee" because I accepted the *role* of member, not because I merged souls with a group entity.

  **How to pivot your group:**
  Instead of asking "Is the group *like* a person?", ask "Does the group occupy a **functional role** that warrants the *ascription* of agency?"

  *   **Old Question:** Does the group have a mind?
  *   **New Question:** Does treating the group *as if* it has a mind allow us to predict its behavior and hold it accountable in ways that tracking individual members cannot?

  This moves you from metaphysics (what *is* it?) to pragmatics (what work does the concept *do*?), which is usually where the philosophy of action makes the most progress.
