prompt: |-
  I edit the science-and-ideas desk at a mid-size magazine, and the call I get wrong most often — maybe twice a month, usually late at night before we go to press — is whether to keep a long-running investigation or series alive or kill it. Some of these have already eaten six months of a reporter's time and a big slice of the budget, and the whole newsroom keeps telling me the money's gone so decide on the future only. Fine, except that advice always feels like its missing something. Sometimes the fact that we've spent so much is telling me something real about the story. Sometimes killing it now blows up a promise to a source, or teaches my reporters that I fold when it gets hard. Sometimes quitting is just panic. Can you turn this into a procedure I can actually run — the questions in order, what counts as a real answer to each, where the procedure stops with a flat kill-it, and where it has to hand the call back to me because it's a values question and not a factual one. I don't want the textbook version where sunk costs are simply irrelevant; I want the honest one, including the arguments that honoring a sunk cost can be defensible (as a commitment device, as a signal to sources and to my own staff, as a way of not being the kind of person who flinches) and how to tell those apart from plain self-justification — and the point where the question becomes which agent we're even talking about, me now or the magazine over years. Run it on three: a big investigation that's expensive, going nowhere, and whose central premise I've quietly stopped believing; a reader-favorite series that loses money every month; and a reporter's four-year pet project where my own history of killing her stories is part of what's actually being decided. Include the case where the procedure tells me something I won't want to hear. Constraints: I have about an hour, no outside help, and I have to justify the decision to the publisher. And tell me what the procedure can't settle — where I'm just going to have to choose.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Editor of the science-and-ideas desk at a mid-size magazine.
      *   **Problem:** Frequent dilemma (twice a month, late night) on whether to kill or continue long-running investigations/series.
      *   **Pain Point:** Standard economic advice ("ignore sunk costs") feels incomplete. There are reputational, ethical, and cultural factors (promises to sources, staff morale, organizational identity) that make "sunk costs" relevant as signals or commitments.
      *   **Goal:** A concrete, actionable procedure (questions in order, criteria for answers, stop points) to make this decision within an hour, without outside help, justifiable to the publisher.
      *   **Specific Nuance:** Must acknowledge when honoring sunk costs is defensible (commitment device, signal to staff/sources) vs. self-justification. Must distinguish between the editor *now* vs. the magazine *over time*.
      *   **Test Cases:**
          1.  Big investigation: Expensive, going nowhere, editor lost faith in premise.
          2.  Reader-favorite series: Loses money every month.
          3.  Reporter's pet project: 4 years long, editor has history of killing her stories (relationship dynamic).
      *   **Constraint:** Must identify what the procedure *cannot* settle (the leap of faith).
      *   **Tone:** Professional, honest, pragmatic, slightly weary but decisive. No textbook platitudes.

  2.  **Deconstruct the "Sunk Cost" Fallacy vs. Reality:**
      *   *Textbook:* Money/time spent is gone. Decide based on future ROI.
      *   *Reality:* Money/time spent creates *obligations* (sources, staff trust) and *signals* (we finish what we start). Ignoring these damages future capacity.
      *   *The Pivot:* The procedure needs to separate "I don't want to look bad for wasting money" (bad) from "If I kill this, I break a promise that ensures future access" (good).

  3.  **Drafting the Procedure (The "Kill/Keep Protocol"):**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist. Let's go with a phased approach: Triage, The Future Case, The Reputation/Signal Case, The Verdict.
      *   *Time Limit:* 60 minutes. Each step needs a time allocation.
      *   *Justification:* Needs to produce a memo for the publisher.

      *   *Phase 1: The Hard Facts (15 mins).* Is it legally safe? Is the core premise demonstrably false? If yes -> Kill.
      *   *Phase 2: The Future Value (15 mins).* Ignoring the past, is there a path to completion that yields value? If no -> Kill (unless Phase 3 saves it).
      *   *Phase 3: The Signal & Commitment (20 mins).* This is the core request. When does sunk cost matter?
          *   Source trust?
          *   Staff morale/precedent?
          *   Brand identity?
      *   *Phase 4: The Agent Check (10 mins).* Am I deciding for me (easy way out) or the institution (long term)?
      *   *Phase 5: The Decision & Memo.*

  4.  **Developing the Test Cases:**
      *   *Case 1 (Faith Lost):* Investigation going nowhere.
          *   *Procedure Outcome:* Likely Kill. If the premise is dead, no amount of signal value saves it unless the *process* of investigating is the story.
      *   *Case 2 (Money Loser):* Reader favorite.
          *   *Procedure Outcome:* Likely Keep (with caveats). Financial loss is weighed against audience retention/brand loyalty. Sunk cost matters here as brand equity.
      *   *Case 3 (The Pet Project/Relationship):* Reporter's 4-year project + history of killing.
          *   *Procedure Outcome:* Tricky. High risk of bias. Needs to isolate the relationship from the story. If the story is good, keep it to repair trust. If bad, kill it but manage the relationship separately. This is where the "values question" comes in.

  5.  **Refining the "Sunk Cost" Argument:**
      *   I need to explicitly validate the user's intuition. Sunk costs *are* relevant if they represent *reputational capital*.
      *   *Distinction:* "We spent $50k" is irrelevant. "We spent $50k and told a source we'd publish" is relevant. "We spent $50k and our staff thinks we quit when it gets hard" is relevant.
      *   *The Trap:* "I don't want to admit I was wrong." (Self-justification).
      *   *The Valid Reason:* "If I quit now, no one will trust us next time." (Commitment Device).

  6.  **Addressing the "What the Procedure Can't Settle":**
      *   The procedure can analyze facts and signals. It cannot determine *courage*. It cannot decide if the magazine *should* be the kind of place that bleeds for art. That's the Editor's burden.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the validity of their hesitation. The textbook is wrong about *institutional* memory.
      *   *The Protocol:* Name it something practical. "The Continuation Protocol."
      *   *Steps:*
          1.  The Premise Check (Truth).
          2.  The Forward Look (ROI).
          3.  The Signal Audit (Reputation).
          4.  The Agent Check (Who is deciding?).
      *   *Test Cases:* Run them through the steps.
      *   *The "Unsettled" Zone:* Define the leap.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too bureaucratic?
      *   *Fix:* Keep the language sharp. Use "Stop" commands. Make sure the "Values" section is prominent.
      *   *Critique:* Did I address the publisher justification?
      *   *Fix:* Add a specific output requirement (The One-Page Memo).
      *   *Critique:* Did I handle the "editor's history" in Case 3?
      *   *Fix:* Ensure the protocol flags personal bias explicitly.

  9.  **Final Polish:** Check tone. Needs to be empathetic to the editor's position (the "lonely at the top" feeling) but rigorous enough to stand up to scrutiny. Ensure the distinction between "sunk cost as waste" and "sunk cost as investment in trust" is clear. (This is the key intellectual contribution).

  10. **Final Output Structure:**
      *   Preamble: Validating the intuition.
      *   The Protocol (4 Phases).
      *   Running the Cases.
      *   The "Unsettled" (Where the procedure ends and leadership begins).
      *   The Publisher Memo Template.

  *(Self-Correction during final review)*: Make sure I explicitly answer the prompt's request about "which agent we're even talking about." I need to make sure Phase 4 handles the "Me vs. The Magazine" distinction clearly.

