answer: |-
  Here is a procedure designed for the specific constraints of your role: late-night, high-pressure, no outside counsel, and accountable to a publisher who cares about the bottom line but also the brand.

  This protocol accepts your premise: **Sunk costs are financially irrelevant, but reputational costs are real assets.** The goal is to distinguish between *throwing good money after bad* (self-justification) and *honoring a commitment device* (institutional integrity).

  ### The Continuation Protocol (60 Minutes)

  **Preparation:** Set a timer. Do not skip steps. If you cannot answer a question with evidence, the answer is "No."

  #### Phase 1: The Premise Check (15 Minutes)
  *Goal: Determine if the story is factually viable.*

  1.  **Has the core hypothesis been demonstrably falsified?**
      *   *Yes:* **KILL.** (Exception: The story is now *about* the falsification).
      *   *No:* Proceed.
  2.  **Is there a specific, reachable endpoint visible within 3 months?**
      *   *Yes:* Proceed.
      *   *No:* **KILL.** (Vague "more reporting needed" is panic, not a plan).
  3.  **Are there legal or safety risks that have increased since commissioning?**
      *   *Yes:* **KILL.** (No story is worth the magazine's existence).
      *   *No:* Proceed to Phase 2.

  #### Phase 2: The Forward ROI (15 Minutes)
  *Goal: Ignore the past. Evaluate the future investment only.*

  1.  **If we spent $0 on this so far, would we commission it today?**
      *   *Yes:* Strong signal to KEEP.
      *   *No:* Proceed to Question 2.
  2.  **What is the specific cost to finish (dollars + editor hours)?**
      *   *Write this number down.*
  3.  **What is the specific tangible return (subscriptions, awards, scoop, exclusive)?**
      *   *If the return is intangible (e.g., "prestige"), quantify it:* Does this prestige directly drive revenue or recruitment?
      *   *If Return < Cost:* Proceed to Phase 3. (This is where the textbook says kill. You are checking if the textbook is wrong).

  #### Phase 3: The Signal Audit (20 Minutes)
  *Goal: Determine if the "Sunk Cost" is actually a "Trust Asset."*
  *This is the critical filter for your specific dilemma.*

  1.  **The Source Test:** Did we promise publication or specific follow-through to a vulnerable source?
      *   *Yes:* **KEEP.** (Killing this burns future access. The cost of lost trust > cost of production).
      *   *No:* Proceed.
  2.  **The Staff Test:** Will killing this teach reporters that we fold on difficult, long-term work?
      *   *Evidence:* Have we killed 3+ long projects in the last year?
      *   *Yes:* **KEEP.** (You are repairing a broken incentive structure. The cost is a culture repair bill).
      *   *No:* Proceed.
  3.  **The Brand Test:** Is this project part of our public identity (e.g., "The magazine that solves mysteries")?
      *   *Yes:* **KEEP.** (Abandoning it dilutes the brand equity).
      *   *No:* Proceed to Phase 4.

  #### Phase 4: The Agent Check (10 Minutes)
  *Goal: Distinguish between "Me" (the editor) and "The Magazine" (the institution).*

  1.  **Am I killing this to avoid personal embarrassment about the initial commission?**
      *   *Honest Answer:* If yes, you must override yourself. **KEEP.**
  2.  **Am I keeping this because I am emotionally invested in the reporter or the idea?**
      *   *Honest Answer:* If yes, and Phase 1 & 2 were negative, **KILL.**
  3.  **The "Successor" Test:** If I were fired tomorrow, would my replacement thank me for killing this, or thank me for finishing it?
      *   *Thank me for finishing:* **KEEP.**
      *   *Thank me for killing:* **KILL.**

  ***

  ### Running the Protocol on Your Three Cases

  #### Case 1: The Big Investigation (Expensive, Going Nowhere, Premise Doubt)
  *   **Phase 1:** You admitted you "quietly stopped believing" the premise. If it is falsified or unprovable, Phase 1 Q1 triggers a **KILL**.
  *   **Phase 3 Check:** Is there a source promise? If no, the sunk cost is just money.
  *   **Phase 4 Check:** Are you keeping it to avoid admitting you were wrong to commission it? Likely yes.
  *   **Verdict:** **KILL.**
  *   **The Uncomfortable Truth:** The procedure tells you that your intuition about "honor" is actually ego. You are trying to vindicate your initial judgment, not serve the magazine.
  *   **Publisher Justification:** "The premise is no longer supportable. Continuing would be publishing speculation. We are cutting losses to reallocate to viable investigations."

  #### Case 2: The Reader-Favorite Series (Loses Money Monthly)
  *   **Phase 1:** Premise is valid (readers love it).
  *   **Phase 2:** Forward ROI is negative financially. Textbook says kill.
  *   **Phase 3:** The Brand Test. Is this series part of the magazine's identity? Does it drive loyalty that sustains other revenue?
      *   *If Yes:* **KEEP.** The "loss" is a marketing budget. The sunk cost established the audience; stopping it wastes that audience acquisition.
      *   *If No:* **KILL.**
  *   **Verdict:** Likely **KEEP** (with a budget cap).
  *   **Publisher Justification:** "This operates as a retention tool. Churn cost from cancelling exceeds the production deficit. We are treating this as customer acquisition cost, not a P&L line item."

  #### Case 3: The Reporter's Pet Project (4 Years, History of Killing Her Stories)
  *   **Phase 1:** Is the story viable? Assume yes.
  *   **Phase 2:** Cost is high. ROI is uncertain.
  *   **Phase 3:** The Staff Test. You have a history of killing her stories. Killing this confirms a narrative that you are hostile to her work.
      *   *Signal:* Keeping this repairs the relationship and signals to *other* reporters that you can be moved by persistence.
  *   **Phase 4:** The Agent Check. Are you keeping it out of guilt?
      *   *Nuance:* Guilt is a valid data point if it stems from a pattern of behavior (your history of killing her work) that has damaged management-labor trust.
  *   **Verdict:** **KEEP** (but with a hard deadline).
  *   **Publisher Justification:** "This is a talent retention decision. The cost of finishing is lower than the cost of losing a senior reporter and the morale hit to the desk. We are closing the loop to clear the pipeline."

  ***

  ### What The Procedure Cannot Settle

  There is a zone where the protocol hands the decision back to you, naked. This happens when **Phase 3 (Signal)** and **Phase 2 (ROI)** are in direct conflict, and the "Agent" is unclear.

  **The Leap of Faith:**
  The procedure cannot tell you **what kind of magazine you want to be.**
  *   Do you want to be the magazine that *always* balances the book? (Then Case 2 dies).
  *   Do you want to be the magazine that *always* protects its writers? (Then Case 3 lives, even if it's bad).
  *   Do you want to be the magazine that *only* publishes truth? (Then Case 1 dies, even if it hurts).

  **The "Values Gap":**
  If Phase 3 says "Keep" (to protect trust) but Phase 2 says "Kill" (financial ruin), the procedure stops. You must decide if the magazine is a **business that publishes stories** or a **mission that sells ads.**
  *   If it's a business: The financial constraint wins. You kill the story and manage the reputational fallout with apologies and severance.
  *   If it's a mission: You find the money elsewhere.

  **The "Editor's Burden":**
  The procedure cannot absolve you of the feeling of being the "bad guy."
  *   In Case 1, you must accept you made a mistake commissioning it.
  *   In Case 3, you must accept that keeping it might look like favoritism to others.
  *   In Case 2, you must accept the publisher might overrule you on financial grounds.

  ### The Output: The One-Page Memo
  *To justify this to the publisher, do not send your internal notes. Send this:*

  **TO:** Publisher
  **RE:** Decision on [Project Name]
  **RECOMMENDATION:** [Kill / Keep]

  **1. Financial Status:**
  *   Spent to date: $X
  *   Cost to finish: $Y
  *   Projected Return: $Z (or "Non-monetary Brand Equity")

  **2. Strategic Rationale:**
  *   *[If Keep]:* "While ROI is negative, cancellation costs exceed production costs. Specifically: [Source Trust / Staff Retention / Brand Identity]. This expenditure is reclassified as [Marketing / R&D / Retention]."
  *   *[If Kill]:* "Premise no longer viable. Continuing poses reputational risk greater than cancellation. Resources will be redirected to [Project B]."

  **3. Risk Mitigation:**
  *   "If we kill: We will manage source relations by..."
  *   "If we keep: We will cap additional spend at..."

  **4. Final Call:**
  *   "This decision prioritizes [Long-term Trust / Immediate Solvency]."

  ***

  ### Summary of Constraints
  *   **Time:** 60 Minutes hard stop.
  *   **Help:** None.
  *   **Sunk Costs:** Treated as "Trust Capital" only. If they don't buy trust, they are worthless.
  *   **The Hard Truth:** If the procedure says **KEEP** but your gut says the story is dead, **trust the gut on Phase 1.** You cannot publish a story you don't believe in, regardless of the cost. That is the one value the procedure cannot override.
