  Dear Colleague,

  Here is the draft of the proposal you requested, written as continuous prose without headings or formatting markers so you can copy it directly into your grant portal. I have kept the tone professional but fluid, ensuring the distinction between established scholarship and your specific interpretive intervention is clear, as you asked. I have also expanded on the methodology and the stakes of the project to meet the word count requirements while maintaining precision.

  This project proposes a focused re-examination of Hannah Arendt's distinction between traditional and modern political lying, specifically within the context of her essays Truth and Politics and Lying in Politics. While Arendt's broader work on truthfulness and the public realm is well-trodden ground in political theory, there remains a significant ambiguity in how her specific taxonomy of lies functions when applied to contemporary regimes of misinformation. The standard reading of Arendt on this subject posits that the distinction between the old lie and the new lie is primarily a matter of content. On this uncontroversial reading, the traditional lie concerns a specific fact or event, whereas the modern lie fabricates an entire image of reality or a pseudo-world. Scholars generally agree that Arendt identifies this shift as a response to the modern capacity for image-making and the destabilization of factual truth. However, this project argues that focusing on content obscures the more critical structural shift Arendt hints at but does not fully resolve. My central hypothesis is that the hinge between the traditional and modern lie is not what is lied about, but who the lie is for and what it does to the liar's own grip on reality. The traditional lie is told to an opponent and presupposes a shared world of facts that both sides can point to, even if one side is misrepresenting a specific element within it. The modern lie, by contrast, is told to a population meant to live inside it, and its primary function is not to secure belief in a false proposition but to render the shared factual world unusable.

  This interpretive shift opens a specific problem that existing scholarship has left open. If the goal of the modern lie is to destroy the utility of the factual world rather than to convince anyone of a specific falsehood, then we encounter cases where nobody believes the official story and yet it is compulsory anyway. This is the phenomenon of universal complicity, where everyone knows that everyone knows the statement is false, yet the performance of acceptance is required. The current literature often treats this as a straightforward extension of Arendt's critique of totalitarianism, but it fails to address whether her framework of lying and truthfulness can actually accommodate a scenario where belief is irrelevant. Arendt frequently suggests that the liar must know the truth they are denying, yet she also attributes a kind of self-deception to the lying team, particularly within bureaucracies where responsibility is diffused. There is a tension here that has not been adequately scored by commentators. If the modern lie works by making the factual world unusable, does the liar still need to know the truth in the way Arendt describes? Or does the structural function of the lie erase the distinction between knowing and denying? This project aims to determine whether Arendt's distinction between traditional and modern political lying accounts for the phenomenon of compulsory falsehoods where universal disbelief renders the concept of belief obsolete, or whether this reveals a structural blind spot in her account of truthfulness and self-deception.

  To answer this question, the project will proceed over the course of one semester through a combination of close textual analysis and conceptual mapping. The first month will be dedicated to a rigorous re-reading of the primary texts, specifically Truth and Politics and Lying in Politics, with the assistance of a graduate research assistant. The assistant will be tasked with checking my reading against the texts to ensure that my distinction between content-based and audience-based readings is grounded in Arendt's actual phrasing rather than imposed upon it. We will isolate every instance where Arendt discusses the liar's knowledge, the audience's belief, and the stability of the factual world. This phase is crucial because much of the secondary literature relies on paraphrases that smooth over the contradictions I intend to highlight. By verifying the textual basis for claims about self-deception versus knowing denial, we can establish whether the tension I have identified is a genuine problem in Arendt's thought or an artifact of later interpretations. The goal of this month is to produce an annotated dossier of passages that bear on the liar's epistemic state and the audience's required response.

  The second month will move from textual verification to conceptual synthesis. Here I will work to construct a model of the compulsory falsehood that tests the limits of Arendt's framework. I will analyze cases where the official story is universally disbelieved yet strictly enforced, asking whether Arendt's categories of lying and truth-telling can describe this dynamic without contradiction. If the liar knows the truth, why is the lie necessary if no one believes it? If the liar is self-deceived, how does the lie function as a tool of power rather than just delusion? This phase will involve drafting the core argument of the paper, specifically focusing on the hinge point of the audience. I will argue that the modern lie is not a failed attempt to convince, but a successful attempt to coordinate behavior through shared falsity. This requires disentangling Arendt's claims about the nature of facts from her claims about the nature of political action. The graduate assistant will continue to support this phase by tracking down relevant secondary literature that addresses the performativity of political speech, ensuring that my reading of Arendt is situated within the broader debate without conflating her views with those of her interpreters.

  The third month will be dedicated to writing and refining the final article. The outcome of this project will be a paper of approximately eight thousand words suitable for submission to a peer-reviewed journal in political theory. A successful result will look like a resolved argument that either demonstrates how Arendt's framework can be extended to cover compulsory falsehoods without contradiction, or definitively identifies the blind spot and proposes a specific modification to her taxonomy of lies. Success means providing a determinate answer to the question of whether the liar's grip on reality is preserved or destroyed in the modern condition. Failure would look like an inability to resolve the tension between the liar's knowledge and the audience's disbelief, resulting in a conclusion that Arendt's work is simply ambiguous on this point. While ambiguity is a valid scholarly finding, for the purposes of this grant, failure is defined as an inability to move beyond the observation of tension to a structured explanation of why that tension exists. I am confident that the textual work planned for the first month will prevent this outcome by grounding the argument in specific passages rather than general themes.

  Regarding scope, it is important to be honest about what this semester-long grant can and cannot achieve. This project is limited to Arendt's explicit discussions of lying in the two named essays and will not attempt to reconcile these with her broader work on totalitarianism or the human condition, except where directly relevant. It will not produce a book manuscript or a comprehensive history of the concept of the lie. The goal is a precise intervention in a specific debate about how we read Arendt on truth and politics. The budget requested covers release time for one semester and stipend support for one graduate student. This scope is appropriate because the question is narrow enough to be answered definitively within three months of focused work, yet significant enough to warrant publication. The risk is that the textual evidence may not support the strong distinction I am proposing between content-based and audience-based readings. However, even if the text does not support my hypothesis, the process of verifying this will produce a valuable negative result that clarifies the limits of Arendt's analysis. The graduate student's role is essential here, as having a second pair of eyes on the texts ensures that my interpretive drive does not override textual fidelity. This project ultimately matters because the phenomenon of compulsory falsehood is more prevalent now than when Arendt was writing. If her framework cannot account for a world where lies are told not to be believed but to be performed, then we need to know exactly where her theory breaks down so we can build upon it rather than simply applying it where it does not fit. This grant will allow me to do that foundational work with the necessary rigor.

  I hope this draft meets your needs. I kept the language precise to satisfy the committee's desire for a determinate answer while ensuring the interpretive risks are clearly marked as your own contribution rather than established fact. Good luck with the submission.
