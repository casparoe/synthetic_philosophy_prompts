  *(Refining the "Role Distance" concept)*: In Confucianism, the closest thing is probably the idea of the *Junzi* (exemplary person) who masters ritual so thoroughly they can adapt it spontaneously. This isn't "standing apart" in a cynical way, but "inhabiting so fully you can bend it." I need to make sure the proposal captures this nuance so it doesn't look like I'm imposing Western individualism. The "distance" isn't detachment; it's *flexibility*.

