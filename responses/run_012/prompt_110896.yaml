  It is completely understandable that you feel frustrated, because you have actually put your finger on one of the most persistent and difficult problems in historical research. You are describing a phenomenon that historians and source critics deal with constantly, though surprisingly there is not one single universally accepted noun that covers exactly the two-step process you described. Instead, historians usually break this down into two distinct technical concepts that work in tandem. The first half of what you observed, where multiple sources turn out to be copies of a single original, is typically called a failure of independent attestation or textual dependence. When scholars map out the family tree of manuscripts, known as a stemma, they are trying to prove exactly what you discovered: that what looks like a crowd of witnesses is actually just one voice echoing through a hallway. If Dan is treating later authors who copied Geoffrey of Monmouth as independent witnesses, he is committing a genealogical error in his source criticism, often referred to as counting derivative traditions as separate corroborations.

  The second half, where the story gets clearer and more specific as time goes on rather than fuzzier, is widely recognized in historiography and mythography as legendary accretion or the law of increasing detail. This is the observation that narratives tend to accumulate concrete specifics like dates, names, and locations as they are retold, precisely because later storytellers feel a need to fill in the gaps that earlier, more honest versions left open. In biblical studies and classical history, this is sometimes discussed under the principle of declining historical value, which notes that later sources are often less reliable historically even though they are more informative narratively. You are correct that this is the opposite of the game of telephone; in oral and literary tradition, the pressure is often to resolve ambiguity, not preserve it. So while telephone degrades signal, tradition often polishes it, removing the hedges and uncertainties that actually signal honesty in a contemporary report.

  When you combine these two things into the rhetorical move your friend is making, where the confidence of the late story is used to prove the truth of the early event, you are looking at a specific logical error that some scholars call illusory corroboration. This is not a formal fallacy like ad hominem, but it is a recognized historiographical mistake. It happens when the narrative solidity achieved through accretion is mistaken for empirical evidence, and the volume achieved through copying is mistaken for consensus. There is no single dictionary word for this, but if you need a label to use in conversation, you could call it the fallacy of retrospective specificity or the illusion of historical convergence. Both terms capture the idea that the story is converging on a single truth only because later writers are copying each other and adding details, not because the event actually happened that way.

  It is important to know the boundary cases though, so you do not overapply the label. There are times when later writers do have access to lost earlier sources, meaning their extra details are genuine preserved history rather than invention. There are also times when multiple witnesses are truly independent, such as when two enemies record the same battle. The difference lies in whether the later details can be accounted for by invention or access. In the case of King Arthur, the lack of contemporary evidence combined with the clear line of dependence from Geoffrey of Monmouth onward makes it a textbook case of these errors. In the case of Troy, Schliemann actually found the city, which complicates things, but the specific dates and kings listed by later Greek historians are still considered accretion rather than record.

  So to answer your question directly, there is no single word like gravity that covers it, but the established terminology refers to the first part as textual dependence and the second part as legendary accretion. The rhetorical error of treating the resulting confidence as proof is best described as illusory corroboration. If you want to explain this to Dan, you might tell him that he is mistaking narrative resolution for historical verification. He is assuming that because the story got clearer, the memory got better, when historically the opposite is usually true. The clarity comes from the storytellers needing to make sense of the past, not from the past leaving a clearer mark. You can tell him that in source criticism, confidence is not a proxy for accuracy, and multiple copies are not a proxy for multiple witnesses.
