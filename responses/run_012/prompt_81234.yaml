      *   **Type of Dispute:** It's not merely verbal. It's about *reference* and *continuity*. It's also about the *normative force* of the induction.
      *   **Methods vs. Theories:** This touches on the "Methodological Realism" or "Retinence to Method" argument. If the *method* (e.g., hypothetico-deductive, mathematical modeling) is stable, maybe *that's* what's reliable. Ravi's objection (circularity) is a version of the "circularity of epistemic principles" worry.

