answer: |-
  **Ask the Growth-Optimalist**

  **Dear Growth-Optimalist,**
  My brother doubled his money at roulette last weekend. He says I'm a coward for keeping my savings in index funds. He says I'm ignoring positive expected value.
  **— Timid Saver**

  **Dear Timid,**
  Your brother is confusing the ensemble average with the time average. If one million versions of your brother played roulette simultaneously, the average outcome across that group is indeed positive. But you are not one million people. You are one person playing sequentially. In a single timeline, ruin is an absorbing state. Once you hit zero, you cannot re-enter the game to benefit from the group average. Your brother survived a volatility drag that would have erased most others. Do not mistake survival for strategy. I remain unimpressed.

  **Dear Growth-Optimalist,**
  I'm offered an even-money bet. I win 50% of the stake half the time, lose 40% half the time. The expected value is positive (5%). My friends say I should bet big. What fraction of my bankroll do I wager?
  **— Positive EV**

  **Dear Positive,**
  If you bet your entire bankroll every time, your wealth multiplies by 1.5 on a win and 0.6 on a loss. Over two turns, you have $1.5 \times 0.6 = 0.9$. You lose ten percent of your capital every cycle despite the positive arithmetic expectation. To maximize the geometric growth rate, we maximize the expected logarithm of wealth.
  Let $f$ be the fraction wagered.
  Expected log growth $= 0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$.
  Differentiate with respect to $f$ and set to zero:
  $\frac{0.25}{1 + 0.5f} = \frac{0.2}{1 - 0.4f}$.
  $0.25 - 0.1f = 0.2 + 0.1f$.
  $0.05 = 0.2f$.
  $f = 0.25$.
  Wager exactly 25% of your bankroll. Anything more reduces long-term growth. Anything less is suboptimal.

  **Dear Growth-Optimalist,**
  As an economist, I must point out that maximizing geometric mean utility is not required by the axioms of rational choice. It's a specific preference, not a law. You're presenting a subjective utility function as objective math.
  **— Prof. H.**

  **Dear Prof.,**
  You are technically correct. The von Neumann-Morgenstern axioms do not force an agent to maximize logarithmic utility. One could choose to maximize arithmetic expectation and accept a high probability of ruin. However, axioms of choice do not override the physics of probability. Unless you plan to merge with your parallel selves upon death, your wealth evolves through time, not across universes. I do not care about what is axiomatically permissible; I care about what persists. Logarithmic utility is the only function that aligns individual time-averages with ensemble expectations in multiplicative systems. I concede the philosophy but keep the math.

  **Dear Growth-Optimalist,**
  My husband and I are debating a second child. He says we have the resources. I look at our spreadsheets. What does the criterion say?
  **— Expectant**

  **Dear Expectant,**
  The Kelly criterion is a theorem regarding long sequences of repeated, divisible, multiplicative bets. It optimizes the rate of return over an infinite horizon. A child is not a divisible asset. A life is not a repeated bet; it is a single trajectory with no reset button. There is no ensemble of lives over which to average the outcome. The model requires recurrence to function. This event does not recur. I cannot calculate the optimal fraction of a family. I need more data on the variance of outcome, but the sample size is one. I will get back to you.

  Verdict: The column argues that ergodicity economics exposes the fragility of standard rational choice theory when applied to single-life trajectories.
