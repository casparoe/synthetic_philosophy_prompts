answer: |-
  Here is the refereeing of the dispute, move by move.

  ### 1. The Arithmetic
  **Maya is wrong about the math.** Her intuition that the probability increases is correct, but her 99% figure is a significant overestimate.

  For the Condorcet Jury Theorem (CJT), you calculate the cumulative binomial probability. With $n=12$ voters and individual competence $p=0.7$, the majority needs at least 7 votes. The probability of the majority being correct is the sum of the probabilities of getting 7, 8, 9, 10, 11, or 12 correct votes.

  The actual figure is approximately **88.2%**, not 99%. To reach 99% confidence with 70% competent voters, you would need a group size of roughly 25 to 30 people. While 88% is a substantial improvement over the individual 70% (and vastly better than the PI's single shot), Maya's claim that the accuracy is near-certain is arithmetically unsupported. She is selling the theorem harder than the numbers allow.

  ### 2. The Independence Objection
  **Dev is right, and this is the fatal flaw in Maya's application.**

  The CJT relies on the Law of Large Numbers, which requires independent trials. In a lab, errors are not independent; they are *systematic*. You share a PI, a funding source, a theoretical framework, and equipment. If the equipment is calibrated wrong, all twelve of you measure the same wrong value. If the PI's theory has a blind spot, all twelve of you inherit it.

  Dev's point about "bunched errors" is the critical distinction between *noise* (which averaging fixes) and *bias* (which averaging amplifies). In a jury, jurors come from different backgrounds; in a lab, you are trained to think alike. Statistical models of correlated voting (such as those by Ladha or Berend) show that even moderate positive correlation drastically reduces the "wisdom of crowds" effect. If the correlation coefficient is high enough, adding more voters yields diminishing returns that flatten out well below 99%, and in extreme cases, the group probability can actually drop below the individual probability. Maya treats correlation as friction; Dev correctly identifies it as a structural load-bearing wall. You cannot ignore it.

  ### 3. The Competence Certification Problem
  **Dev is right that this is a practical killer, though not a theoretical one.**

  The CJT only guarantees truth-tracking if the average voter competence $p > 0.5$. The problem, as Dev notes, is epistemic: How do you know $p > 0.5$ before you know the truth? In a lab facing a "weird result," you are in uncharted territory. The senior student's expertise is based on past data, which may not apply to the new anomaly.

  Maya argues that many decisions have right answers. She is correct that *some* do (e.g., "is this contamination?"). But for the high-stakes decisions they are fighting over (explanatory models), ground truth is often unavailable until months later. If the group shares a blind spot, their collective $p$ could be 0.4 without them knowing it. In that scenario, voting merely democratizes error. Dev is correct that a group cannot certify its own competence from the inside without external validation, which is exactly what they lack in the moment of decision.

  ### 4. Binary Choice and Facts of the Matter
  **Dev is right that this disqualifies many lab decisions.**

  The CJT is designed for binary choices with an objective truth (Guilty/Innocent, True/False). Lab governance is rarely so clean. Choosing between four projects is not a truth-tracking exercise; it is a resource allocation exercise involving values, risk tolerance, and career strategy. There is no "fact of the matter" on which project is best, only trade-offs.

  Even when choosing between explanations, science often deals with underdetermination (multiple models fit the data). Voting implies one is "true" and the others "false," which can prematurely kill productive research lines. Maya tries to salvage this by saying "plenty of our decisions do have a right answer," but the specific dispute that triggered this (picking explanations for a weird result) is exactly the kind of high-uncertainty, non-binary judgment where CJT performs poorest. Dev is correct to flag this category error.

  ### 5. Deliberation vs. Independence
  **This is the tension neither has fully articulated, but it favors Dev's skepticism.**

  Maya likely assumes voting happens after discussion. Deliberation improves individual competence ($p$ goes up because people share info) but destroys independence (correlation $\rho$ goes up because everyone hears the same arguments).

  If you vote secretly without talking, you preserve independence but waste the collective intelligence of the lab. If you talk then vote, you increase $p$ but spike $\rho$. In scientific contexts, the correlation effect usually dominates. A persuasive senior student can sway the whole room, creating a cascade where the vote becomes 12-0 not because everyone independently verified the fact, but because they all trusted the same person. This makes the vote look authoritative (as Dev warned) while providing no additional epistemic security. The CJT is a model for *secret ballots*, not *lab meetings*.

  ### 6. What Both Are Missing
  Both Maya and Dev are treating the lab like a pure epistemic engine, ignoring the **principal-agent problem**.

  *   **Maya misses:** The PI (Principal Investigator) holds the grant and the liability. If the majority votes for a risky project that fails, the PI loses the funding, not the students. The "expert rule" Dev defends isn't just about accuracy; it's about accountability. Voting disperses responsibility, which can lead to riskier decisions because no single person bears the cost of failure.
  *   **Dev misses:** The legitimacy benefit of voting. Even if voting doesn't maximize truth-tracking, it maximizes buy-in. If the group votes to pursue a line of inquiry, they work harder on it. If the PI dictates it, morale may suffer. Dev is focused on *truth*, but labs also need *coordination*.
  *   **The Missing Solution:** A hybrid. Use voting to gauge consensus and morale, but weight the vote by expertise or let the PI hold veto power. Or, use the "Delphi method": solicit independent judgments *before* discussion to capture the independent data points, then deliberate to correct errors, then decide. This captures the independence Maya wants with the error-correction Dev demands.

  ### 7. The Verdict
  **Dev is more right overall.**

  Maya is arguing for an ideal that works in courts and casinos but fails in laboratories. Science is not about averaging out random noise; it is about identifying and eliminating systematic bias. The Condorcet Jury Theorem is a powerful tool for independent agents facing random error, but a lab group is a set of dependent agents facing systematic error.

  Dev correctly identifies that the assumptions of the theorem (independence, known competence, binary truth) are violated by the very nature of collaborative science. His warning that "adding more people to a group that's already wrong together just makes the wrong answer sound more authoritative" is the most important insight in this entire debate. Maya's arithmetic is wrong, her model ignores correlation, and her application ignores the non-binary nature of research choices.

  While Maya is right that hierarchy can fail (as the PI's wrong call proved), replacing it with a majority vote is not the statistical fix she thinks it is. Dev wins on the epistemology; Maya might win on the sociology, but since the argument is about *accuracy*, Dev takes the round. Stick with the expert, but improve how the expert is challenged, not by counting heads.
