  2.  **Deconstruct the Stalemate:**
      *   *Humean (Lewis/Loewer):* Laws are axioms of the Best System (balance of simplicity and strength). Supervenience base is the "Humean Mosaic" (local matters of particular fact). No modal glue.
      *   *Non-Humean (Armstrong/Dretske/Tooley/Maudlin):* Laws are relations between universals or primitive modal facts. They explain the regularities. They support counterfactuals robustly.
      *   *The Impasse:* Humeans say Non-Humeans add mystery ("quasi-theological glue"). Non-Humeans say Humeans miss the point ("laws don't just describe, they produce/constrain").
      *   *User's Hypothesis Check:* Is it about the legitimacy of an explanatory demand? Yes, largely. The Non-Humean wants *production* or *grounding*. The Humean offers *systematization* as the only coherent form of explanation available.

  3.  **Evaluate the "Verbal Dispute" Option:**
      *   Is it just about the word "law"?
      *   *Argument against:* Both sides care about the same phenomena (induction, counterfactuals, chance). If it were purely verbal, they could agree on the physics and disagree on the label. But they disagree on the *structure of reality* required to support the physics.
      *   *Argument for:* Sometimes "law" means "summary of facts" vs. "prescriber of facts." If they define terms differently, they talk past each other.
      *   *Verdict:* It's not *merely* verbal, but there is a verbal component masking a deeper methodological split.

  4.  **Evaluate the "Different Questions" Option:**
