      *   *Non-Humean:* "Why do particles attract?" -> "Because the Law of Gravitation *makes* them." -> "But what makes the Law hold?" -> "Primitive necessitation."
      *   The stalemate is: Humean thinks Non-Humean's answer is empty (just naming the mystery). Non-Humean thinks Humean's answer is insufficient (doesn't support counterfactuals).
      *   *Is the demand illegitimate?* Humeans say yes (quasi-theological). Non-Humeans say no (science assumes it).

  6.  **Analyze the Concrete Example (Chance and Undermining):**
      *   *Scenario:* A future sequence of events has a non-zero chance according to current best theory, but if it happens, it changes the frequencies such that the current best theory is no longer the Best System.
      *   *Humean:* Chance *is* what the Best System says. If the future undermines the present system, then present chance claims are technically false (or we need a "rigidified" Best System). Lewis struggled here.
      *   *Non-Humean:* Chance is a propensity or physical magnitude. It doesn't depend on the future. Undermining is impossible because the chance fact is fixed now.
      *   *Substantive or Verbal?* It's substantive because it affects how we calculate probabilities and interpret quantum mechanics. If Humeanism is true, chance is downstream of the whole history. If Non-Humeanism is true, chance is upstream. This has empirical/theoretical consequences for how we model physics.

