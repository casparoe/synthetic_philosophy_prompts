      *   **User's Hypothesis:** Both sides agree laws must 'govern' (make regularities obtain), but Humeans think this demand is incoherent. The fight is about the legitimacy of an explanatory demand, not laws themselves. The stalemate exists because you can't argue someone out of a felt explanatory need.
      *   **Concrete Example:** Best-System Account (BSA) of chance and the "undermining" worry. Is the disagreement substantive or verbal?
