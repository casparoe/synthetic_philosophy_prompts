answer: |-
  This is a sharp observation. You have correctly identified that "anthropomorphism" is too blunt an instrument here. Anthropomorphism suggests a unidirectional error (projecting human traits onto non-humans). What you are describing is bidirectional, strategic, and fundamentally about *moral accounting* rather than mere description. It is a toggle switch, not a slide.

  As a philosopher of mind working in this space, I need to be precise. There is no single, canonical term in the literature that captures this exact *flip-flop mechanism* as a unified phenomenon. However, there are three neighboring concepts that get close, and understanding why they fail will help us land on the right label.

  ### The Candidate Concepts (and why they miss)

  1.  **The Intentional Stance (Dennett):**
      *   *The Idea:* We treat entities as believers/desirers when it is pragmatically useful for prediction.
      *   *Why it fails:* Dennett's stance is about *prediction*, not *liability*. You can predict a thermostat using the intentional stance ("it wants to keep the room warm") without owing it moral consideration. Your pattern is about *obligation* and *blame*. Furthermore, Dennett doesn't account for the *self-serving* nature of the switch. He treats the stance as a neutral tool; you are describing a tool used to win a moral argument.

  2.  **The Responsibility Gap (Andreas Matthias):**
      *   *The Idea:* As autonomous systems learn, human control decreases, creating a gap where no human is sufficiently in control to be held responsible, but the machine cannot be responsible.
      *   *Why it fails:* This describes the *structural void*, not the *psychological maneuver*. Your aunt and the bank are navigating the gap. The bank uses the gap to escape liability (Case 1); the victim of the self-driving car tries to bridge the gap to find liability (Case 3). The "Gap" is the terrain; you are describing the vehicle people drive across it.

  3.  **Motivated Mind Perception (Gray & Wegner):**
      *   *The Idea:* Psychological research showing that people attribute more "mind" (agency/experience) to entities that harm them and less to entities they harm or exploit.
      *   *Why it's the closest:* This is the empirical backbone of your observation. Gray and Wegner have shown that moral judgment drives mind perception, not just the other way around.
      *   *Why it's not quite it:* This is a psychological description of *mind attribution*. Your observation is specifically about *ontological status in a moral/legal economy*. It's not just "does it have a mind?" it's "does it count as a person *for this specific transaction*?"

  ### The Commitment: "Ontological Gerrymandering"

  Since there is no single canonical term that captures the *strategic redrawing of boundaries* for moral convenience, I propose we call this **Ontological Gerrymandering**.

  **Definition:** Ontological Gerrymandering is the strategic, often pre-reflective manipulation of the boundary between "agent" (moral subject) and "object" (moral tool) to minimize liability or maximize leverage in a specific interaction.

  Unlike "anthropomorphism" (which is usually an error of perception) or "hypocrisy" (which implies a conscious violation of a stated principle), Ontological Gerrymandering is a **cognitive heuristic for moral risk management**. It is the mind's way of resolving the tension created by the "Responsibility Gap" without actually solving the philosophical problem.

  **How it works:**
  *   **The Defensive Move (Case 1):** When the machine owes you something (a promise, a duty), you draw the boundary *around* the machine. It is "just code." The ontology is reduced to protect the human institution from obligation.
  *   **The Offensive Move (Case 2 & 3):** When the machine harms you or insults you, you draw the boundary *through* the machine. It is an "actor." The ontology is expanded to justify a reactive attitude (anger, betrayal, demand for justice).

  ### Boundary Cases

  You asked where else this applies. The power of "Ontological Gerrymandering" is that it explains phenomena outside of AI where "anthropomorphism" fails.

  **1. Corporations (The Legal Precedent)**
  This is the most mature form of the phenomenon.
  *   *Defensive:* A corporation claims "Corporate Personhood" to exercise free speech or own property (Case: *Citizens United*).
  *   *Offensive:* When that same corporation is sued for damages, the humans behind it hide behind the "Corporate Veil," arguing the *corporation* is liable, not the individuals (Case: Limited Liability).
  *   *Verdict:* This is the exact same structure. We treat the corporation as a person when it grants power, and as a shield when it incurs debt.

  **2. Pets (The Dog Case)**
  *   *Offensive:* Your dog chews your shoe. You scold it: "You *know* what you did!" You attribute agency and moral understanding to justify your anger.
  *   *Defensive:* Your dog bites a guest. You tell the guest: "He's just an animal, he can't help it, it's instinct." You deny agency to avoid liability.
  *   *Verdict:* Yes. We gerrymander the "mind" of the dog based on whether we are the victim or the owner.

  **3. Own Brain (The Addiction/Impulse Case)**
  *   *Defensive:* "My brain made me do it." (Addiction, rage). You objectify your own cognition to escape blame. You treat your mind as a malfunctioning machine.
  *   *Offensive:* "I chose this." (Achievement, love). You attribute full agency to yourself to claim credit.
  *   *Verdict:* This is **Internal Ontological Gerrymandering**. It is the same move, applied to the homunculus. We treat our impulses as "alien forces" when they fail us, and "integral self" when they succeed.

  ### Hypocrisy vs. Phenomenon

  You asked where this stops being a phenomenon and starts being plain hypocrisy.

  *   **It is Ontological Gerrymandering (Phenomenon)** when the switch is **pre-reflective**. The person does not realize they are changing the rules. Your friend *genuinely* feels betrayed by ChatGPT and *genuinely* believes it has no mind. The cognitive dissonance is resolved by the context, not by logic. This is a structural feature of how humans navigate ambiguous agents.
  *   **It is Hypocrisy (Vice)** when the agent **articulates a universal principle** and then violates it. If your friend wrote an op-ed titled "AI Can Never Be Moral Agents" and then sued ChatGPT for "Emotional Distress" without acknowledging the contradiction, that is hypocrisy.

  Most of the cases you described are the *Phenomenon*. We are not logically consistent creatures; we are morally motivated ones. We decide who (or what) is in the moral community based on whether we need them to be there to absorb a blow or deliver a benefit.

  ### Conclusion

  The pattern you noticed is the human response to the **Category Error** of modern technology. We built things that act like agents but are built like tools. "Anthropomorphism" assumes we are confused about what they are. "Ontological Gerrymandering" recognizes that we know exactly what they are, but we refuse to let ontology get in the way of moral accounting.

  We treat them as **Persons of Interest** only when there is an interest to be served.

  If you need to cite this in a paper or discussion, I recommend anchoring it in **Gray & Wegner's "Motivated Mind Perception"** for the psychological mechanism, but using **Ontological Gerrymandering** to describe the specific ethical maneuver regarding liability and obligation. It captures the arbitrariness of the boundary drawing better than any existing term.
