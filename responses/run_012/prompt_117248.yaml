answer: |-
  Dear Colleague,

  I share your frustration entirely. The slogan you describe functions less as a rigorous argument and more as a philosophical Rorschach test, inviting speakers to project their own metaphysical commitments onto a technical result that does not inherently support them. To untangle this, we must separate the logical core of the incompleteness theorems from the extra premises required to bridge the gap between formal systems and human cognition. The most defensible reading is often too weak to support the anti-mechanist conclusion, while the readings strong enough to support the conclusion rely on premises that are either unsupported or question-begging.

  Consider first the weakest possible interpretation, which is that the human mind is not equivalent to any specific, known formal system. This claim is virtually a platitude. We do not possess a complete formal description of the human brain or cognitive architecture, so obviously we cannot say the mind is identical to system F or system G. However, this triviality licenses no significant metaphysical conclusion. It does not show that the mind is not a machine, only that we do not know which machine it is. This reading collapses immediately if pressed, because the mechanist claim is existential rather than specific; it asserts that there exists some formal system that captures human competence, not that we currently know which one it is. When seminar participants use the slogan to stop conversation, they are rarely satisfied with this trivial reading, yet it is the only one that is uncontroversially true.

  Moving to a more substantive claim, we encounter the argument originally advanced by John Lucas. This version asserts that for any formal system you propose as a model of the mind, a human mathematician can outperform it by seeing the truth of that system's Gödel sentence. This shifts the claim from not being a specific system to not being any system that can be specified. The verdict here is that the claim is substantive but vulnerable. The vulnerability lies in the requirement that the human must know the proposed system is consistent. To see that the Gödel sentence is true, one must assume the system does not produce contradictions. If the mind is merely a machine, it cannot prove its own consistency without becoming inconsistent, per the second incompleteness theorem. Therefore, for the Lucasian argument to work, the human must have a non-mechanical way of knowing the consistency of any proposed formal system. If this knowledge of consistency is itself algorithmic, the argument fails. If it is not algorithmic, the argument assumes the very non-algorithmic capacity it seeks to prove. This reading licenses the claim that mathematical understanding cannot be fully algorithmic, but it does not yet reach the claim that no computer could ever be conscious.

  This brings us to the distinction between the mind not being a Turing machine and not being any finite machine at all. A physical human being is undeniably a finite machine in the sense that we have finite memory, finite lifespan, and finite energy. If the slogan means we are not finite machines in this physical sense, it is false. We are bounded biological organisms. The argument only gains traction if we idealize the human mathematician to an infinite limit, assuming we can grasp arbitrarily large numbers or follow proofs of arbitrary length. If we accept this idealization, the claim is that the mind is not a Turing machine, which is an abstract device with infinite tape. However, if we reject the idealization and stick to actual humans, the Gödelian argument loses its force because actual humans cannot actually produce the Gödel sentence for a sufficiently complex system within a lifetime. Thus, the argument requires an idealized mathematician, not the actual finite human, which limits its relevance to cognitive science models of actual human processing.

  The version of the argument developed by Roger Penrose pushes further into radical territory by tying the logical gap to consciousness and physics. Penrose argues that the act of seeing the truth of the Gödel sentence involves a kind of understanding or insight that is non-computable, and he locates this non-computability in quantum gravitational processes within microtubules. This reading is distinct from Lucas because it makes a claim about the physical basis of thought and the nature of consciousness, not just logical output. The verdict on this reading is that it is highly speculative and largely unsupported by mainstream neuroscience or physics. While it licenses the strong claim that no computer could ever be conscious, it relies on the premise that understanding is non-algorithmic, which is precisely what is in dispute. Most critics argue that Penrose conflates the simulation of reasoning with the possession of understanding, and that a system could behave as if it sees the truth without possessing the mysterious insight Penrose describes. When people use the slogan to argue against machine consciousness, they are almost invariably invoking this Penrosean reading, though often without accepting the quantum gravity commitments.

  You also asked about the disjunction Gödel himself suggested in his Gibbs lecture. Gödel proposed that the incompleteness theorems force a choice between two options: either the human mind infinitely surpasses the power of any finite machine, or there exist arithmetic questions that are absolutely undecidable for the human mind. This is a crucial nuance often missed in popular deployments. Most anti-mechanists take the first horn, insisting the mind exceeds all machines. However, accepting the second horn allows one to remain a mechanist by admitting that there are truths humans simply cannot decide, just as a formal system cannot decide its own Gödel sentence. If the second horn is true, the mind could be a machine, but a machine that cannot know all arithmetic truths. This reading is logically robust and respects the limits imposed by the theorems, but it is rarely the one intended by those using the slogan as a conversation-stopper, as it concedes too much to the mechanist.

  Regarding the epistemic status of consistency, there is a fine line between knowing and merely believing that a system is sound. If the human merely believes the system is consistent, that belief could be false, and the inference to the truth of the Gödel sentence would be unsound. If the human knows the system is consistent, we must ask how that knowledge is acquired. If that knowledge is derived from a proof, it must reside within some formal system, leading back to the original problem. If the knowledge is intuitive or immediate, the argument presupposes a non-algorithmic faculty of intuition. This is the point where the argument often becomes circular. To claim the mind is not a machine because it knows consistency non-algorithmically assumes the mind has non-algorithmic powers. This reading is substantive but begs the question against the mechanist who denies such powers exist.

  So, which reading licenses the uses you described? The claim that no computer could ever be conscious requires the Penrosean reading, which links non-computability to phenomenology. The claim that mathematical understanding cannot be algorithmic relies on the Lucasian reading, provided one accepts the idealization of the mathematician and the non-algorithmic nature of consistency knowledge. The use of the slogan as a conversation-stopper usually relies on a conflation of these readings, ignoring the consistency hurdle and the idealization requirement to assert a quick victory for dualism or vitalism.

  Finally, what do the people who repeat this slogan most likely have in mind? In my experience, they usually have a muddled version of the Penrosean claim without the physical specifics. They intend to assert that human insight transcends syntax manipulation, treating the Gödel sentence as a magic key that unlocks a realm of truth inaccessible to rules. They rarely distinguish between the mind not being a specific machine and not being any machine, and they seldom acknowledge the requirement for an idealized, consistent mathematician. They are often relying on the intuitive plausibility that we understand meaning while machines only shuffle symbols, using Gödel as a technical seal of approval for a pre-existing intuition about the uniqueness of human consciousness. If you wish to challenge them, the most effective route is not to deny the theorems but to demand they specify whether they are talking about actual finite humans or idealized knowers, and to ask how, precisely, the human knows the consistency of the machine they claim to surpass without relying on the very algorithmic processes they deny exist.

  I hope this disambiguation helps you navigate those seminars. The theorems are profound, but their application to cognitive science is far more fragile than the slogan suggests.

  Warmly,

  Your Colleague
