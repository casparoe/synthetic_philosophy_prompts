      *   **Constraint:** Single substantial paragraph per reply.
      *   **Core Argument to Address:** The novelist claims a doctrinal/ideological shift (monastic reform on usury/sacraments) caused an economic reorganization, with no prior shift in the mode of production or emergent class interests. This challenges the base/superstructure model (base determines superstructure).
      *   **Demand:** Commit to one position, defend it, explain the hidden economic cause if applicable, and state the cost to the theory if the novelist refuses to grant it.
      *   **Tone:** Seminar-like, intellectual, serious.

  2.  **Adopt the Persona:**
      *   I need to sound like a seasoned Marxist historian (think along the lines of Rodney Hilton, Christopher Hill, or perhaps a more rigid orthodox theorist like Georg Lukács or even a fictionalized composite).
