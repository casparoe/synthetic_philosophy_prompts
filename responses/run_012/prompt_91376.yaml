      You present a compelling narrative, one that mirrors the self-understanding of historical actors who invariably see their ideas as the prime movers of their world, yet I must insist that this sequence is the very illusion historical materialism exists to dissect. I concede readily that the superstructure possesses relative autonomy and reacts upon the base—Engels was clear on this in his later letters—but for a doctrinal shift to command the assent of great landholders and reshape credit markets, it must resonate with a material necessity they already feel but cannot yet articulate. In your Vale, the ban on usury is not an arbitrary spiritual whim but likely the ideological weaponization of a liquidity crisis among the landed aristocracy, who find themselves indebted to a rising merchant class or usurious creditors; the monastic order succeeds not because their theology is truer, but because it offers a supernatural sanction for what the landholders economically require: the cancellation or restriction of debt. If you insist that this idea arrived ex nihilo, without any prior tension in the mode of production—say, a transition from feudal rent to commercial agriculture that made credit indispensable yet dangerous to the old elite—then you are not writing a materialist history but an idealist one, and the cost to my theory is total: if consciousness determines social being rather than the reverse, then the base becomes epiphenomenal, and we are left with a history of ghosts rather than men.

