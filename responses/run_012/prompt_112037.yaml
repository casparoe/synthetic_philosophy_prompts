      **GUIDELINES FOR EXTRAJUDICIAL NORM ENFORCEMENT AND ASSOCIATIVE ADJUSTMENT**

      **§1. Authority and Jurisdiction**
      These Guidelines operate outside the State Action Doctrine. As private actors, we are not bound by constitutional restrictions regarding bills of attainder or due process. We do not declare subjects outlaws in the legal sense; we simply cease to recognize them as insiders. Our authority derives from the collective capacity to withhold association.

      **§2. Base Offense Levels and Enhancements**
