      **§3. Role in the Offense**
      An aggravating role adjustment of +2 applies to the Originator who first contextualizes the violation. A mitigating role adjustment of -1 applies to Participants who amplify the sanction via quote-tweet or share. This mitigation recognizes that individual contribution to the aggregate harm is negligible. Each Participant acts merely as a conduit for community values; therefore, no single Participant bears responsibility for the cumulative effect.

      **§4. Acceptance of Responsibility**
