prompt: |-
  I'm a journalist working on a piece about the identity of indiscernibles — the Leibniz thing where no two things can differ unless they differ in some property — and I've been sitting in on two philosophers who've been at it for months and are mostly talking past eachother. One of them says Black's two-spheres case just kills the principle: two iron spheres, alike in every single respect, sitting some distance apart, obviously two and not one, done. The other says the case doesn't even scratch it, because the spheres still differ — there's the sphere that's identical to *a* and the sphere that isn't, or one of them is the one that's two miles from the other, and anyway the principle was never supposed to range over properties like that. What I actually want is the document these two should have written instead of arguing: a numbered list of claims both of them can sign — including about what the principle really says and what Black's case would have to establish to refute it — then the genuine disagreements, each stated in wording its own side would accept, then the cruxes. My guess is one crux is whether properties that mention a particular object by name count, and another is whether that two-sphere world is one possibility or two possibilities related by swapping the spheres; but you tell me. For each crux give the case or argument both sides would agree bears on it, plus what each side predicts about it, written down in advance. And if part of this turns out to be a fight about words, say which part and why. Please don't pad it with citations or reading lists — neither of them is going to win it that way, and I can't check them anyway. One more thing I want them to deal with: two electrons, where swapping them doesn't give you a new state of the world at all. Do they agree that bears on the crux, and how does each side read it?
