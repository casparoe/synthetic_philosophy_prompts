answer: |-
  I tried to use HCH to decide whether to quit my job.

  The root node asked, "What is the expected utility of staying?"
  That decomposed into sub-questions: "Assess salary," "Assess risk," and "Assess happiness."

  The "Assess happiness" branch hit a base case after 30 seconds. The human at that node (me, but time-bounded and lunchtime-hungry) typed, "I just want to nap."

  The aggregation layer summarized this as: *Preference for low-energy states.*
  The root node concluded: *Current environment is high-energy. Recommendation: Exit.*

  I quit.

  Later I realized the base case wasn't analyzing my career trajectory; he was just hangry. But in HCH, there's no protocol to distinguish "Strategic Insight" from "Me needing a sandwich," because every node is authorized to speak for Me, but no node knows *which* Me they are.
