  2.  **Deconstruct the Phrase ("You can't argue with the math"):**
      What could a mathematician mean by this?
      *   *Claim 1: Internal Validity.* Given the axioms and rules of inference, the conclusion follows necessarily. (Deductive validity).
      *   *Claim 2: Soundness/Truth.* The axioms themselves correspond to reality or are necessarily true.
      *   *Claim 3: Consistency.* The system won't produce contradictions (like $0=1$).
