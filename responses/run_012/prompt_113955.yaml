      Dara: "Jurors are conscripted to find truth. Voters are volunteers expressing preference. If I pick the lesser evil, I'm not minimizing harm; I'm laundering my complicity. It teaches the parties that they can win by being merely less bad than the other guy. It lowers the floor. If I refuse to vote for her, maybe the next time they need a clean candidate who doesn't gut schools, they'll actually find one."
