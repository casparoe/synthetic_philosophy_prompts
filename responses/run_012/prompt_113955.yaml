      Miguel: "Because you're never the sole reason. That's the math you're ignoring. Your single vote doesn't cause the outcome. It's the practice of people like you voting that matters. If everyone who cares about ethics abstains because they don't want to get dirty, you guarantee the worst people win. You're treating a collective action problem like an individual moral test. The harm isn't in your soul; it's in the city budget."
      Dara: "But the collective is just a bunch of individuals making choices. If I change my standard, I change the collective. Maybe the harm is in normalizing the choice. If we treat voting as damage control instead of vision, we never get better governance. I'd rather fight the cuts through organizing, through protesting, than through a ballot that legitimizes the cutter. Abstention is a speech act, Miguel. It says, 'Neither of you represents me.'"
