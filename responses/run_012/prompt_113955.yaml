answer: |-
  The ballot sat on the counter, corners slightly curled from the humidity. Miguel leaned against the fridge, arms crossed, watching Dara spin a pen between her fingers.

  "You're going to let it expire," Miguel said. It wasn't a question.

  "I'm deciding if it deserves to be counted," Dara replied.

  "That's a distinction without a difference. While you decide, the incumbent is stealing zoning variances and the challenger is drafting the budget that kills the arts program. Your kid's school, Dara. That's not abstract. Real kids lose music classes so a corrupt guy doesn't go to jail."

  "I know what's at stake. That's exactly why I can't sign off on it. If I vote for her, I'm not just stopping the thief; I'm endorsing the cutter. A vote isn't a lever, Miguel. It's a signal. It tells the party, 'This is acceptable.' If I wouldn't stand up at a school board meeting and say, 'Cut the arts to save the library,' I shouldn't do it in secret. Voting for her makes me a partner in the cut."

  "But you're not standing up at the meeting. You're sitting in a booth. This isn't about endorsement; it's about care. You live here. You use the roads, the police, the libraries. You take the benefits of the system, so you owe it a duty of care. You're not a shopper picking cereal; you're a juror. You have an obligation to minimize harm based on the evidence in front of you. You don't get to recuse yourself because you don't like the defendants."

  "Jurors are conscripted to find truth. Voters are volunteers expressing preference. If I pick the lesser evil, I'm not minimizing harm; I'm laundering my complicity. It teaches the parties that they can win by being merely less bad than the other guy. It lowers the floor. If I refuse to vote for her, maybe the next time they need a clean candidate who doesn't gut schools, they'll actually find one. I'm trying to change the incentives, not just manage the damage."

  "That's the vanity of clean hands. You're prioritizing the purity of your conscience over the actual books on the shelves. Refusing to pick is still picking. It's picking the status quo, or it's picking the corrupt guy by splitting the reform vote. You get to keep your hands rhetorically clean while real people get hurt by the worse option. Innocence isn't a get-out-of-jail-free card when the library closes. You want to be absolved of the outcome while enjoying the benefits of the system that produces it."

  "It's not about innocence. It's about responsibility. If I vote for her and she cuts the budget, I am partly responsible for that cut. If I abstain and the incumbent wins, I'm responsible for the corruption, sure. But there's a difference between allowing a thing and authorizing it. Voting is authorization. I'm not willing to be the sole reason she gets the seat, so why should I be part of the coalition that puts her there? I won't authorize harm to avoid allowing it."

  "Because you're never the sole reason. That's the math you're ignoring. Your single vote doesn't cause the outcome. It's the practice of people like you voting that matters. If everyone who cares about ethics abstains because they don't want to get dirty, you guarantee the worst people win. You're treating a collective action problem like an individual moral test. The harm isn't in your soul; it's in the city budget. Your abstention doesn't signal integrity to the party; it signals apathy to the count."

  "But the collective is just a bunch of individuals making choices. If I change my standard, I change the collective. Maybe the harm is in normalizing the choice. If we treat voting as damage control instead of vision, we never get better governance. I'd rather fight the cuts through organizing, through protesting, than through a ballot that legitimizes the cutter. Abstention is a speech act, Miguel. It says, 'Neither of you represents me.' It keeps the option of refusal alive."

  "It says you checked out. It says you're willing to let your neighbors down because the options offended your sensibilities. You say it's a speech act, but nobody hears it. A blank ballot looks like apathy, not protest. You want to signal integrity? Stay in the fight. Vote for the one who won't steal from the city, then fight her on the budget. You can't influence the budget if you help elect the thief. You're removing yourself from the only arena where you have any leverage."

  "I can influence it from the outside without owning the decision. Once I vote for her, I'm a partner. The corruption is structural, Miguel. The incumbent is a bagman because the system rewards developers. The challenger cuts schools because the system rewards austerity. Voting for either just spins the wheel. I'd rather stand outside the machine and push than sit inside and steer it off a cliff."

  "The machine grinds people up while you stand outside. You talk about authorizing harm, but you're ignoring the harm you're allowing. You owe something to this place because it's your home. Not because you signed a contract, but because you're embedded. You can't opt out of the consequences, so why try to opt out of the choice? You're trying to have it both ways: living in the community but refusing to participate in its hardest decisions."

  "Because opting into the choice makes me a participant. I'll pay the taxes. I'll volunteer at the library. I'll show up when they try to cut the arts. But I won't cast a vote that says I'm okay with the trade-off. There's a line between living in a broken system and validating it. I'm not checking out; I'm refusing to play by rules that demand I choose my own poison."

  "And there's a line between principles and pride. You might be right about the system. But until it changes, there are kids who need books. You're waiting for a perfect world to save them in this one."

  "And you're asking me to break something in myself to save a budget that someone else will cut anyway."

  Miguel sighed, pushing off the fridge. The ballot stayed on the counter, untouched.

  "We'll see," he said.

  "Yeah," Dara said, picking up the pen, then setting it back down.
