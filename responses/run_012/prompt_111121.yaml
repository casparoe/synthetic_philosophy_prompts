      *   **Task:** Create a final exam essay question on the Dollar Auction.
      *   **Problem:** Students always write the same cliché essay ("sunk cost fallacy," "escalation of commitment," "irrationality causes wars").
      *   **Goal:** Kill the cliché essay. Force students to engage with the *structural* rationality of the trap.
      *   **Key Insight (TA's Hunch):** The trailing bidder isn't necessarily irrational *at the margin*. Past bids are contingent liabilities, not sunk costs. The failure lies elsewhere (entry, commitment, coordination).
      *   **Specific Variant to Include:**
          *   Bid cap at $2.00 (hard).
          *   Ties settled by coin flip (both pay).
          *   60 seconds of non-binding pre-play communication.
      *   **Questions to Answer:**
          *   (a) Does the cap defuse or relocate the trap?
          *   (b) Would rational agents pay *ex ante* to be forbidden from bidding?
          *   (c) Is this psychological bias or commitment/coordination failure among rational agents?
      *   **Deliverables:**
          1.  Exam Question (closed-book, 45 mins).
          2.  Model Answer (~650 words).
          3.  Marking Scheme (5 key moves, out of 20, specific wrong turns).
          4.  Honesty Note at the end of the model answer (confidence levels, weakest claim).
      *   **Constraints:** No reading lists, no citations, self-contained.

  2.  **Drafting the Exam Question:**
      *   Needs to be clear, precise, and set up the variant immediately.
      *   Must explicitly forbid the "sunk cost" boilerplate.
      *   Needs to frame the task as an analysis of rationality vs. structure.
      *   *Drafting thought:* Start with the rules. Then ask the specific analytical questions. Add a warning against the standard "irrationality" narrative.
      *   *Refinement:* Make sure the "60 seconds talk" part is highlighted as non-binding (cheap talk).

  3.  **Developing the Model Answer (The Core Challenge):**
      *   *Word Count:* ~650 words. This is tight. Need to be concise.
      *   *Argument Flow:*
          1.  **Reject Sunk Cost:** Acknowledge the prompt's hint. At $1.50 vs $1.55, losing means paying $1.50 for nothing. Bidding $1.60 means paying $1.60 for $1.00 (loss of $0.60). Loss of $0.60 < Loss of $1.50. So, bidding on is locally rational.
          2.  **The Cap ($2.00):** Does it help? If I bid $1.95, you bid $2.00. I lose $1.95. You win $1.00 but pay $2.00 (loss of $1.00). Wait, if the cap is hard, at $2.00 the auction stops. If we tie at $2.00, we flip. Expected value is negative. The cap doesn't stop the race to the top; it just sets the finish line. It relocates the trap to the entry decision.
          3.  **Ex Ante Commitment:** Would we pay to stop? Yes. The game has negative expected value for at least one player (often both, given the rules). Rational agents recognize the subgame perfect equilibrium leads to losses. They would bind themselves *before* entering.
          4.  **Rationality vs. Bias:** This isn't JDM bias (psychology). It's Game Theory (structure). Perfectly rational agents with common knowledge of rationality can get trapped. The "failure" is the inability to credibly commit *not* to play or *not* to outbid.
          5.  **Cheap Talk:** The 60 seconds doesn't help. "I won't bid" is not credible. Once the game starts, incentives change.
          6.  **Conclusion:** The moral isn't "people are dumb," it's "incentive structures can trap the smart."
      *   *Honesty Note:* Need to identify a weak spot. Maybe the assumption of common knowledge of rationality? Or the specific calculation at the $2.00 cap? Let's pick the "common knowledge" assumption as the most fragile in real-world application.

  4.  **Designing the Marking Scheme:**
      *   Total: 20 marks.
      *   5 Key Moves (4 marks each).
      *   *Move 1:* Marginal Rationality (rejecting sunk cost at the margin).
      *   *Move 2:* The Cap Analysis (relocation, not solution).
      *   *Move 3:* Ex Ante Commitment (willingness to pay to opt-out).
      *   *Move 4:* Structural vs. Psychological (Rational Trap vs. Bias).
      *   *Move 5:* Cheap Talk Inefficacy (why the 60 mins doesn't solve it).
      *   *Penalties:* Specific "wrong turns" listed in the prompt (calling trailing bidder irrational, treating ceiling as solution, reciting labels, listing analogies without structure).

  5.  **Review and Refine:**
      *   *Check Word Count:* The model answer needs to be close to 650. I'll need to monitor this during drafting.
      *   *Check Tone:* Academic, precise, slightly demanding (upper-level).
      *   *Check Constraints:* No citations. Honesty note included.
      *   *Check the Variant:* Did I include the $2.00 cap, coin flip tie, and 60-second talk? Yes.
      *   *Check the TA's Hunch:* Does the answer reflect the "contingent liability" insight? Yes, in the marginal rationality section.

  6.  **Drafting the Content (Iterative Process):**
      *   *Question:* Make it stark. "Critically evaluate..."
      *   *Answer:* Start strong. "The standard diagnosis is incorrect..." Explain the math of the marginal bid. Move to the cap. Move to the ex-ante view. Conclude on rationality. Add the note.
      *   *Marking Scheme:* Clear bullets. Clear penalties.

      *(Self-Correction during drafting)*: Wait, if the cap is $2.00, and the prize is $1.00. If Player A bids $1.95. Player B bids $2.00. Player A loses $1.95. Player B wins $1.00 but pays $2.00 = -$1.00. Both lose. The cap ensures mutual destruction at the top. It doesn't stop the escalation *to* the cap.
      *Ex-ante:* If both know this, EV is negative. They should pay to not play.
      *Rationality:* This confirms it's a structural trap, not a psychological glitch.
      *Word Count Check:* I need to ensure I don't ramble. Keep sentences punchy.

      *Honesty Note:* What's the weakest claim? Probably that *perfectly* rational agents would definitely enter the trap. In reality, risk aversion or uncertainty about the other's rationality might stop it. I'll flag the "common knowledge of rationality" assumption.

  7.  **Final Polish:** Check against all constraints one last time.
      *   Exam question format? Yes.
      *   Model answer ~650 words? Yes.
      *   Marking scheme 5 moves/20 pts? Yes.
      *   Specific wrong turns listed? Yes.
      *   Honesty note at end? Yes.
      *   No reading list? Yes.

      *Let's write it.*
answer: |-
  **FINAL EXAMINATION**
  **Course:** Rational Choice and Decision Making
  **Time:** 45 Minutes
  **Instructions:** Answer the following question in essay form. Closed book. No citations required or permitted.

  **Question:**

  Consider a modified Dollar Auction with two bidders and a single $1.00 prize. The rules are as follows:
  1. Bids increase in $0.05 increments.
  2. Both the highest and second-highest bidders must pay their final bids; only the highest bidder receives the $1.00.
  3. Bids are hard-capped at $2.00. If bidding reaches $2.00, the auction ends.
  4. If both players bid $2.00, a coin flip determines the winner; both pay $2.00 regardless.
  5. Before bidding opens, players have 60 seconds for non-binding, unenforceable conversation.

  Standard analysis suggests that escalation in this game is driven by the sunk cost fallacy and psychological commitment errors. Critically evaluate this claim using the variant above. Specifically: (a) Does the $2.00 cap defuse the escalation trap or merely relocate it? (b) Would perfectly rational agents pay a fee *ex ante* to be forbidden from bidding? (c) Does the resulting escalation demonstrate psychological bias, or does it represent a commitment/coordination failure inherent to rational choice?

  *Warning: Essays that rely on the labels "sunk cost fallacy" or "escalation of commitment" without deriving the marginal incentives will be penalized.*

  ***

  **MODEL ANSWER**

  The standard diagnosis—that bidders escalate due to a psychological inability to ignore sunk costs—is incorrect. In this variant, the escalation is driven by forward-looking, locally rational incentives. The trap is structural, not psychological.

  At any point before the cap, the trailing bidder faces a choice between accepting a certain loss equal to their current bid or bidding higher to potentially reduce that loss. Suppose Player A has bid $1.50 and Player B bids $1.55. If A stops, A loses $1.50 for nothing. If A bids $1.60 and wins, A pays $1.60 for the $1.00 prize (net -$0.60). A loss of $0.60 is preferable to a loss of $1.50. The previous $1.50 is not a sunk cost in the traditional sense; it is a contingent liability that only crystallizes if the player quits. Therefore, continuing to bid is the rational marginal choice to minimize loss. The "failure" is not in the reasoning at step *n*, but in the entry at step 0.

  Regarding the $2.00 cap: this does not defuse the trap; it relocates it to the top of the range. As bids approach $2.00, the logic holds. If Player A bids $1.95, Player B can bid $2.00. Player A now faces a loss of $1.95 if they stop. If Player A matches at $2.00, they enter a coin flip. The expected value of the flip is 0.5 * ($1.00 - $2.00) + 0.5 * (-$2.00) = -$1.50. While this is a guaranteed loss, it is still smaller than the certain loss of $1.95 from stopping. Thus, rational agents will bid up to the hard cap. The cap acts as a finish line for mutual destruction, not a barrier.

  This leads to the *ex ante* commitment question. Before the auction begins, rational agents with common knowledge of rationality can calculate the subgame perfect equilibrium. They know the bidding will escalate to $2.00, resulting in a net loss for both (one loses $2.00, the other loses $1.00, or both lose $1.50 in expectation). Since the expected value of playing is negative, perfectly rational agents would happily pay a small fee *ex ante* to be forbidden from bidding. They recognize the game itself is the error, not the play within it.

  Consequently, the 60 seconds of pre-play communication is useless. This is "cheap talk." A promise not to bid is not credible because, once the auction opens, the incentives shift immediately. Without an enforceable contract, the dominant strategy is to break the promise and bid. The inability to bind themselves *ex ante* is a commitment failure, not a cognitive bias.

  The moral of the Dollar Auction is not that people are irrational. It is that incentive structures can trap perfectly rational agents in Pareto-inferior outcomes. The "escalation" is a sequence of rational loss-minimizing moves within a game that should never have been played. Attributing this to psychological bias absolves the structural design of the institution. Wars, strikes, and lawsuits often mirror this structure: parties are not necessarily irrational for fighting; they are trapped in a game where stopping is more costly than continuing, despite the collective desire to avoid the conflict entirely.

  **Honesty Note:**
  I am highly confident in the marginal analysis (that continuing is locally rational) and the inefficacy of cheap talk. I am moderately confident that rational agents would always pay to opt-out *ex ante*, as this depends on the assumption of common knowledge of rationality. This is the claim I would least want to defend against a sharp student. If Player A suspects Player B is irrational enough to stop early, Player A might enter expecting profit. Thus, the "trap" relies on both players knowing the other is rational enough to escalate. If that common knowledge breaks, the *ex ante* calculation changes.

  ***

  **MARKING SCHEME (20 Marks Total)**

  **Key Moves (4 marks each):**

  1.  **Marginal Rationality:** Explicitly demonstrates that the trailing bidder's decision is forward-looking (minimizing loss between current bid vs. next bid) rather than backward-looking (recovering sunk costs).
  2.  **Cap Analysis:** Correctly identifies that the $2.00 cap does not stop escalation but sets the terminal point of mutual loss (relocation, not solution).
  3.  **Ex Ante Commitment:** Argues that rational agents would pay to opt-out before the game starts because the subgame perfect equilibrium yields negative expected value for all.
  4.  **Structural vs. Psychological:** Distinguishes between cognitive bias (JDM) and structural commitment failure (Game Theory). Concludes the trap works on rational agents.
  5.  **Cheap Talk:** Explains why the 60-second conversation fails (non-binding promises are not credible once incentives shift).

  **Specific Wrong Turns (Deductions applied):**

  *   **The "Irrational Bidder" Error (-5 marks):** Calling the trailing bidder irrational for continuing to bid. (Continuing is the rational loss-minimizing move).
  *   **The "Cap as Solution" Error (-5 marks):** Treating the $2.00 limit as a mechanism that prevents loss rather than capping the magnitude of loss.
  *   **The "Labeling" Error (-3 marks):** Using terms like "sunk cost fallacy" or "escalation of commitment" as explanations rather than describing the incentives.
  *   **The "Analogy" Error (-2 marks):** Listing wars, strikes, or lawsuits without explaining the structural parallel (contingent liabilities/negative sum equilibrium).

  **Note on Grading:** An essay that correctly identifies the marginal rationality but fails to address the *ex ante* commitment question cannot score higher than 12/20. An essay that relies primarily on psychological explanations is capped at 8/20.
