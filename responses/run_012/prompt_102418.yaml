          *   Con: Leads to "Pascal's Mugging" (tiny $P$, huge $N$ dominates everything). If we include nematodes or bacteria, the model breaks. It demands too much cognitive load for legislation.

  6.  **Drafting Section 4: Silence and Competing Rules:**

      *   *Where Scale Argument is Silent:* It doesn't account for *intensity* of experience (maybe insect pain is faint). It doesn't account for *tractability* (can we actually help them?). It doesn't account for *substitutability*.
