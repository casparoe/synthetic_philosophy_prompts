          *   Insects: $\approx 10^{18}$ to $10^{19}$ (wild). Farmed insects are smaller but growing.
      *   *Ratio:* Insects outnumber recognized invertebrates by roughly $10^8$ (100 million times).
      *   *Implication:* For the Act's exclusion to be consistent with the Scale Argument, the $P(\text{insect sentience})$ must be at least $10^8$ times *lower* than $P(\text{crab sentience})$.
      *   *Neuroscience Check:* Is a cricket's nervous system $10^8$ times less likely to support sentience than a crab's? Crabs have $\approx 10^5$ neurons. Insects vary ($10^4$ to $10^6$). The difference is orders of magnitude, not *eight* orders of magnitude.
      *   *Conclusion:* Under a strict $N \times P$ rule, excluding insects while including crabs looks like a massive error *unless* $P(\text{insect})$ is effectively zero.

  4.  **Drafting Section 2: Defending the Act's Line:**

      *   *Implicit Probability Threshold:* The Act might operate on a "more likely than not" ($P > 0.5$) or "reasonable scientific evidence" standard. If $P(\text{crab}) = 0.6$ and $P(\text{insect}) = 0.1$, the threshold explains the exclusion. The Scale Argument rejects this thresholding in favor of expectation.
      *   *Response to Uncertainty:* If $P$ is deeply uncertain, policymakers might default to "proven" sentience (vertebrates) + "strongly suggested" (cephalopods/decapods based on LSE report). Insects are "speculative." This is a *confidence* threshold, not just a probability threshold.
      *   *Scope Neglect:* This is the cynical/psychological explanation. Humans cannot comprehend $10^{18}$. We focus on entities we can relate to (faces, size). The Act reflects human cognitive limits, not moral math.
      *   *Practicality/Enforceability:* You can't regulate welfare for wild insects. You can't easily regulate farmed insects yet. Law requires enforceability. The Scale Argument ignores implementation costs.

  5.  **Drafting Section 3: What the Act Tells Us About the Scale Argument:**

      *   *Evidence on $P$:* Does the exclusion count as evidence? Not really. It's evidence of *political will* and *scientific consensus*, not metaphysical truth. However, the LSE report (which informed the Act) reviewed evidence. They found sufficient evidence for decapods/cephalopods, insufficient for insects. This updates our Bayesian $P$ slightly, but not by $10^8$.
      *   *EMV Structure:* The episode suggests that legal/moral decision-making is *not* maximization of expected value. It is often satisficing, threshold-based, or rights-based.
