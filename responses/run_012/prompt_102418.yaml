      *   *The Scale Argument:* Often associated with effective altruism and longtermism (e.g., Rethink Priorities, Brian Tomasik). The core idea: Even if $P(\text{sentience})$ is low for insects, $N(\text{insects})$ is so huge ($10^{18}$+) that $N \times P$ dwarfs vertebrates ($10^{10}$).
      *   *Uncertainty:* $P$ is not a single number. It's a distribution. Deep uncertainty implies we don't even know the distribution parameters well.
      *   *Legislative Reality:* Laws are practical, enforceable, and political. They often rely on proxies (nervous system complexity) rather than pure expected value calculations.

