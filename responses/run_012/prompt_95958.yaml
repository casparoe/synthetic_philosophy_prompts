      *   *Decision:* Camp 1 (Behaviorist) has the better operationalization for safety, *but* Camp 2 is right that the moral sting requires more. However, for the purpose of AI Safety (which is the context of LessWrong), the behavioral definition is load-bearing.
      *   *Nuance:* I need to flag that "belief" is doing double duty (predictive vs. ontological).
