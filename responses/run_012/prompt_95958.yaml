      *   **Camp Two (Mentalist/Representationalist):** Focus on internal states, content, and goals/direction of fit. "Deception" requires a mismatch between internal representation and external communication. Without internal states, it's just error/inaccuracy. Moral weight depends on intent/representation.

  3.  **Drafting Section 1: Agreed Claims:**
