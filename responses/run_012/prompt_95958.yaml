      *Let's refine the "Commitment" section.* I need to identify the *load-bearing* crux. Is it the existence of belief? Or the definition of deception? I think the load-bearing crux is whether *truth-indifference* counts as deception. If yes (Camp 1), we regulate/train differently. If no (Camp 2), we might ignore bullshitting. I'll bet on Camp 1.

      *Wait, I need to make sure I don't sound like I'm ignoring Camp 2's valid points.* I will acknowledge that Camp 2 is right about the *metaphysics*, but Camp 1 is right about the *risk*.

