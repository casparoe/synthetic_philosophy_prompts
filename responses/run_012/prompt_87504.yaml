  A buddy of mine who reads a ton of pop-sci stuff told me epiphenomenalism is basically this: consciousness is just a side effect of the brain doing its thing, like the whistle on a steam engine — the brain makes experiences, but experiences don't make anything happen. So you could keep all the behavior and drop the consciousness and nothing would change. And the killer objection is that if experiences cause nothing, then your belief that you have experiences can't be caused by those experiences, so an epiphenomenalist could never actually know they're conscious — the view refutes itself.

  I don't know much about any of this, but the "refutes itself" part sounds definately too tidy. Can you go through his summary line by line and tell me which bits someone who actually holds this view would nod along to, which are fair-enough simplifications, and which are just off? And does his conclusion actually follow from the parts that are right?
