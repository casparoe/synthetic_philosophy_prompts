answer: |-
  Your supervisor's self-description as a "pluralist" is partially true: she accepts different *types* of evidence (genetics, reproduction, geography). However, your intuition is correct—she is not deciding arbitrarily. There is a consistent, hierarchical heuristic underlying her verdicts. She is not a strict Genetic Essentialist, nor a dogmatic Biological Species Concept (BSC) adherent. Instead, she operates on a **"Diagnosis-or-Isolation" threshold**.

  Here is the breakdown of the candidate rules, scored against her track record, followed by the prediction for your chapter.

  ### Candidate Rules & Scoring

  **1. Genetic Essentialism (Fixed Differences or Monophyly Required)**
  *   *Rule:* Populations are species only if they show fixed allele differences or reciprocal monophyly.
  *   *Case 1:* Fit (Has FD/Mono).
  *   *Case 3:* Fit (No FD/Mono -> Lump).
  *   *Case 4:* **Fail.** (No FD/Mono -> She Split).
  *   *Case 6:* Fit (No FD/Mono -> Lump).
  *   *Verdict:* **Ruled Out.** Case 4 proves genetic distinctness is not strictly necessary if reproductive isolation is strong.

  **2. Strict Biological Species Concept (Reproductive Isolation Required)**
  *   *Rule:* Populations are species only if they are reproductively isolated in nature or lab.
  *   *Case 3:* Fit (Interbreed -> Lump).
  *   *Case 4:* Fit (Sterile -> Split).
  *   *Case 1:* **Fail.** (No cross data -> She Split).
  *   *Case 6:* **Fail.** (No cross data -> She Lump).
  *   *Verdict:* **Ruled Out.** She makes verdicts on allopatric populations (1 & 6) without cross data, relying on genetics. Thus, RI is not *always* required.

  **3. The "Fst Threshold" Rule**
  *   *Rule:* High genetic differentiation (e.g., Fst > 0.20) indicates species status.
  *   *Case 3:* **Fail.** (Fst 0.30 -> Lump).
  *   *Case 6:* **Fail.** (Fst 0.45 -> Lump).
  *   *Verdict:* **Ruled Out.** She explicitly ignores Fst when Fixed Differences or Monophyly are absent. Structure alone is insufficient.

  **4. Diagnosis-or-Isolation Pluralism (The Working Hypothesis)**
  *   *Rule:* Split if **(A) Genetic Diagnosis** (Fixed Diffs/Monophyly) **OR (B) Strong Reproductive Barrier** (Sterility/Inviability). Lump if neither is present, regardless of Fst or geography.
  *   *Case 1:* Fit (Has A).
  *   *Case 2:* Fit (Has A; hybrids are "leakage" below threshold).
  *   *Case 3:* Fit (Has neither A nor B).
