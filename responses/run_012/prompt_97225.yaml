      *   *Check:* The user mentioned they are skeptical of tidy rules due to philosophy reading. *Acknowledge that this specific book replaces one tidy rule with a worse one.*

  7.  **Final Polish:** Ensure the distinction between "Site" (pre-treatment context) and "Burn" (post-treatment event) is the pivot point for the advice. Emphasize that the book author is right about the *phenomenon* but wrong about the *universal remedy*.

