answer: |-
  You have identified a genuine and significant gap in the introductory taxonomy of speech act theory, and your intuition that standard labels like "performative," "implicature," or "hedge" fail to capture the specific mechanics of these utterances is correct. You are describing a class of **metapragmatic** operations that function specifically as **defensive framing devices**. While there is no single, universally agreed-upon term in the core philosophy of language literature (Austin, Searle, Grice) that captures exactly what you describe, the phenomenon is well-documented in sociolinguistics, conversation analysis, and critical discourse analysis.

  The pre-emptive versions ("I am only asking") are most commonly classified in sociology and linguistics as **Disclaimers**. The seminal paper here is Hewitt and Stokes's "Disclaimers" (1975), which defines them as "verbal devices by which speakers forestall potential negative evaluations of themselves or their utterances." The retroactive versions ("I was only joking") are typically classified as **Accounts**, following Scott and Lyman's "Accounts" (1968), which are statements made to explain unanticipated or untoward behavior. However, your observation that these two function identically in terms of *illocutionary management*—regardless of temporal direction—is philosophically astute. They both attempt to dictate the **uptake** of a speech act by explicitly negating or modifying its **illocutionary force**.

  Your rejection of the label "performative" is largely justified in the Austinian sense. A standard performative (e.g., "I promise") creates a new state of affairs or obligation. Your examples do not create an obligation; they attempt to *remove* liability or *constrain* interpretation. However, they are **explicit illocutionary acts** in the sense that they verbally specify the force of the accompanying utterance. The reason sincerity does not matter is that these utterances function as **conventional moves in a discourse game**. Whether you mean them or not, uttering "I am not accusing you" places a burden on the listener to accept that frame, or else be accused of "misreading." This shifts the normative status of the conversation, which is why it feels performative even if it doesn't fit the classic "I promise/I bet" mold.

  Regarding the "self-defeating" nature you observed (where "I am not judging" makes judging salient), this is a matter of **pragmatic presupposition**. To deny a predicate ("I am not judging"), one must typically make that predicate available for consideration in the common ground. This is related to the "ironic process theory" in psychology, but in linguistics, it is often discussed under **negation and accommodation**. By raising the possibility of judgment to deny it, the speaker acknowledges that judgment was a live option, thereby confirming the listener's suspicion. This is not necessarily intrinsic to *all* such utterances (sometimes "I say this with love" works), but it is a structural risk inherent to negative metapragmatic framing.

  On your boundary cases: "Honestly" is inside the phenomenon; it is a marker vouching for the sincerity condition of the speech act, attempting to block the uptake of "lying" or "exaggerating." "With respect" is also inside; it attempts to modify the force of a disagreement to prevent the uptake of "insult." The "but" in "I am not a racist, but..." is a different mechanism (a conjunction signaling contrast), but the clause preceding it ("I am not a racist") is a classic disclaimer. Therefore, the "but" structure is a common *vehicle* for the phenomenon, but the conjunction itself is not the phenomenon.

  Are the forward-looking and backward-looking versions one phenomenon? I argue **yes**. Temporally they differ (pre-emptive vs. reparative), but functionally they are identical: they are **Illocutionary Disavowals**. They both attempt to sever the link between a propositional content and a hostile illocutionary force. The philosophy of language often separates these due to the "felicity conditions" of timing, but your description correctly identifies that the *logic of defense* is the unifying feature.

  I am confident that "Disclaimer" and "Account" are the established terms you were missing, but they are sociological rather than purely philosophical. To capture the specific philosophical mechanism you described—the negation of force to control uptake—I propose the term **Metapragmatic Disavowal**. This distinguishes it from simple hedges (which reduce commitment) and standard performatives (which create commitments).

  ### Summary of Analysis

  *   **Established Literature:** Sociology (Disclaimers/Accounts), Conversation Analysis (Repair/Pre-sequences).
  *   **Philosophical Mechanism:** Explicit modification of Illocutionary Force; manipulation of Uptake.
  *   **Sincerity:** Irrelevant to the conventional function (similar to a move in a game).
  *   **Self-Defeat:** Caused by pragmatic presupposition of the negated term.

