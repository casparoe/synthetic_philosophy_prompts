      *   Focus on the specific distinctions (Ontology vs. Epistemology, Dynamic Nominalism vs. Social Constructionism).

  7.  **Final Review against Constraints:**
      *   No reading lists.
      *   Order: Brainstorm winces -> Sentence-by-sentence audit -> Conclusion evaluation.
      *   Role: Philosopher of psychiatry.

  8.  **Constructing the Output:** (Self-Correction during drafting)
