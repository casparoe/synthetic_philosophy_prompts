answer: |-
  Good morning everyone. It's wonderful to see so many of you here, and such a variety of creatures. I remember one year we had an extremely unhappy iguana, which taught us all something about patience. Today we have dogs, cats, hamsters, and perhaps some creatures I can't quite see from here.

  We gather around St Francis' day to bless these animals, but it's worth asking what we're actually doing. Are we pretending that your dog is a little person in a fur coat? I don't think so. To treat an animal as if it were human is actually a kind of disrespect. It ignores what they truly are.

  So, what are they? They are not machines, but they are not rational agents either. They do not worry about next year, they do not argue about philosophy, and they do not use language to generalize about the world. They live entirely in the present tense. But within that present, they are vividly alive. They feel the cold ground, the warm sun, the sting of a thorn, and the comfort of a hand. They experience fear and they experience relief.

  This distinction matters. Because they do not reason like us, they cannot advocate for themselves. They cannot sign contracts or demand rights. They are entirely dependent on those who do have reason—on us.

  That is why we bless them. We are not conferring a soul upon them that they lack, nor are we asking them to understand the water being sprinkled. They don't need to understand it to be worthy of care. We bless them to acknowledge that their capacity to feel pain and pleasure matters to God, even if their capacity to think does not reach toward God.

  Their vulnerability is sacred. When we bless them, we are sanctifying our own responsibility. We are saying that because they can suffer, how we treat them is a spiritual matter. The blessing is a reminder that these creatures are entrusted to us, not for our amusement, but for our companionship and care.

  So in a moment, the vicar will sprinkle water. The animals won't know what it means. But we will. We will know that we are standing among feeling beings who belong to this creation, and who deserve our gentleness. Let's make sure we show them that gentleness, today and every day.

  ***

  **Note on Philosophical Vulnerability**

  The address hinges on the claim that *sensation without rational thought* is sufficient ground for religious blessing and moral status. This survives Dev's specific Cartesian objection (that animals feel but don't think), but it may fall apart on theological grounds that Dev could still exploit.

  1.  **The "Moral Patient" Gap:** A strict Cartesian might grant that animals feel pain but deny that this feeling has *moral weight* in itself. For Descartes, our duty regarding animals was often indirect (don't be cruel because it hardens you toward humans), not direct (don't be cruel because it harms them). The address asserts a direct moral status ("their capacity to feel... matters to God"). If Dev argues that only rational beings can be subjects of divine care or covenant, the blessing becomes merely symbolic for *our* benefit, rendering the claim that "they deserve our gentleness" sentimentally true but ontologically empty.
  2.  **The Unity of Consciousness:** Dev's nuanced reading of Descartes (allowing sensation without thought) is contested. Many scholars argue Descartes believed sensation *requires* intellectual judgment. If Dev decides to pivot and argue that "sensation" without "thought" is merely physiological reflex without conscious feeling (qualia), then the address's claim that "they feel the cold ground" becomes false. They would just be registering damage, not suffering.
  3.  **What would change my mind:** If you convince me that a blessing inherently requires the recipient to have some capacity for rational response or covenant relationship, then blessing a non-rational being is category error, like blessing a stone. If Dev argues that "blessing" implies sanctifying a rational will, then the address is fundamentally confused about the act it describes. To fix this, the address would need to frame the blessing exclusively as a prayer for the *owners'* stewardship, removing the implication that the animal itself is a direct object of the blessing's spiritual efficacy.
