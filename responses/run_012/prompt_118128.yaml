      *Wait, does a Cartesian accept blessing animals?* If they are machines, blessing them is like blessing a car. But Dev says Descartes allows sensation. So they aren't *just* clocks in the sense of being insensate. They feel. So causing pain matters. The blessing reinforces the moral weight of their feeling nature.
      *Better angle:* The blessing is primarily for *us*, regarding *them*. It sets the terms of our stewardship. But the prompt asks to say something definite about *what these animals are*.
      *Definition:* They are feeling beings, distinct from us in reason, but united with us in vulnerability.
      *Action:* We bless them to acknowledge that their feelings matter to God, even if their thoughts do not reach God.

      *Let's write:*
