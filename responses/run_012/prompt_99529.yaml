answer: |-
  Here is the plan. It is tight for fifty minutes, so discipline is your only resource.

  ### 1. The Sequence: Where the Logic Bites
  Do not start with the theorem statement. Do not start with the example. Start with the **structure of the conflict**.

  **Minute 0–5: The Arrow Anchor**
  Remind them of the Arrow setup they know: We want a Social Welfare Function (SWF) that takes individual orderings and outputs a social ordering. It must satisfy Unrestricted Domain (UD) and Weak Pareto (WP). Arrow showed no *dictator* can exist.
  *   **The Pivot:** Sen asks: What if we *require* certain individuals to be dictators over specific parts of the social outcome? Not a global dictator, but a local one. This is **Minimal Liberalism (ML)**.
  *   **Why this order:** If you lead with the example, they treat it as a story about neighbours. If you lead with the theorem, they tune out. By framing ML as a modification of the Arrow constraints they just learned, you force them to see it as a formal incompatibility, not a sociological observation.

  **Minute 5–15: Defining Minimal Liberalism (The Bookkeeping Phase)**
  Define ML formally on the whiteboard.
  *   *Definition:* There are at least two individuals. Each has at least one pair of social states over which they are **decisive**. (If they prefer $x$ to $y$, society prefers $x$ to $y$).
  *   **The Trap:** At this stage, ML looks like a harmless bookkeeping formality. "Of course I decide what I read."
  *   **The Pivot Point:** ML stops looking like bookkeeping exactly when you overlay **Weak Pareto**. You must draw this on the board.
      *   Arrow: Pareto + No Dictator $\rightarrow$ Impossibility.
      *   Sen: Pareto + *Everyone is a Dictator over their own sphere* $\rightarrow$ Impossibility.
      *   Tell them: "The paradox isn't that rights exist. It's that rights + efficiency = contradiction."

  **Minute 15–30: The Case (The Engine)**
  This is where your Priya/Tom example lives or dies. See section 2 below.
  *   **Instruction:** Do not use four alternatives. Reduce it to three to save cognitive load.
      *   $a$: Spider, Hair (Priya keeps spider, Tom keeps hair).
      *   $b$: No Spider, Shaved (Priya bins spider, Tom shaves).
      *   $c$: Spider, Shaved (Priya keeps spider, Tom shaves).
      *   *(Drop "No Spider, Hair" — it's not needed for the cycle).*
  *   **Walkthrough:**
      1.  **Pareto:** Both prefer $a$ to $b$. (Social choice: $a \succ b$).
      2.  **Liberalism (Priya):** Priya decides Spider vs. No-Spider. She prefers No-Spider (in the relevant comparison).
      3.  **Liberalism (Tom):** Tom decides Hair vs. Shaved. He prefers Shaved.
      4.  **Cycle:** Show the loop on the board. $a \succ b$ (Pareto), $b \succ c$ (Tom), $c \succ a$ (Priya).
  *   **Why this carries the weight:** It forces the contradiction visually. If they understand the cycle, they understand the theorem.

  **Minute 30–40: The Objections (The Filter)**
  This is where you manage the room. See section 3 below.

  **Minute 40–45: Resolutions & Implications**
  Briefly touch on dropping Pareto (liberalism requires inefficiency) or restricting Domain (no meddlers).

  **Minute 45–50: The Assessment Question**
  See section 5 below.

  ---

  ### 2. The Case: Priya, Tom, and the Externality Trap
  Your friend is right, and this is dangerous for a 50-minute session.
  **Verdict:** The logic closes the cycle, **but** the example invites the "Coasean Bargaining" objection which will eat your time. If Tom has a "legitimate grievance" about the spider (fear/ugliness), that is a negative externality. In Econ, externalities are solved by bargaining or Pigouvian taxes, not impossibility theorems. If they think this is about externalities, they will think the paradox dissolves if Priya pays Tom.

  **Can it be rescued?**
  Only if you explicitly stipulate that the preferences are **non-rival and non-physical**.
  *   *The Fix:* You must frame the preferences as **moralistic/paternalistic**, not aesthetic/nuisance.
  *   *Revision:* Priya doesn't mind the spider physically; she objects to Tom shaving on *principle* (she thinks he's harming himself). Tom doesn't mind the spider physically; he objects to Priya keeping it on *principle* (he thinks it's undignified).
  *   *Better yet:* Swap to the **"Prayer and Alcohol"** variant. It keeps the structure but removes the "nuisance" vector.
      *   Priya decides: Pray ($P$) or Not ($\neg P$).
      *   Tom decides: Drink ($D$) or Not ($\neg D$).
      *   Priya's prefs: $\neg P > P$ (she's an atheist), but she prefers Tom *not* drink ($\neg D > D$).
      *   Tom's prefs: $D > \neg D$ (he likes drinking), but he prefers Priya *pray* ($P > \neg P$).
      *   Pareto: Both prefer ($P, D$) to ($\neg P, \neg D$). (They both prefer the "active" state to the "null" state, despite their moral objections).
      *   *Why this works:* My praying does not physically harm you. My drinking does not physically harm you (in this abstraction). It isolates the **meddlesome preference** without the **physical externality**. It blocks the "legitimate grievance" objection because there is no physical harm to grieve.

  **What the example must have:**
  1.  **Distinct Spheres:** Two dimensions where jurisdiction is clearly assigned.
  2.  **Meddlesome Preferences:** Each person must care about the *other's* sphere (otherwise Pareto and Liberalism never clash).
  3.  **Pareto Improvement:** There must be one outcome both prefer to another, which violates one of the rights.

  **What the example must not have:**
  1.  **Rivalry:** (e.g., "Only one person can have the book"). That introduces scarcity, not rights.
  2.  **Physical Harm/Noise:** Invites Coasean bargaining.
  3.  **Strategic Bargaining:** Keep it as a social choice problem, not a game.

  ---

  ### 3. Misconceptions: Order of Arrival & Defusal
  They will form these in a specific sequence. Head them off exactly when they arise.

  1.  **"So liberalism is incoherent."** (Minute 20, during the cycle)
      *   *Status:* **Genuine Misreading.**
      *   *Defusal:* "No. The theorem says you cannot have *this specific definition* of liberalism (decisiveness) alongside *this specific definition* of efficiency (Pareto) and *universal domain*. You can have liberalism if you accept inefficiency."
  2.  **"This is just Arrow with rights bolted on."** (Minute 25, post-cycle)
      *   *Status:* **Fair Worry (Concede).**
      *   *Defusal:* "Structurally, yes. It's an impossibility proof using similar axioms. But the *normative* lesson is different. Arrow says 'aggregation is hard.' Sen says 'rights cost efficiency.' Don't let them file it under 'Arrow Again'."
  3.  **"The trick is that there's only one copy of the book."** (Minute 30, during objections)
      *   *Status:* **Genuine Misreading.**
      *   *Defusal:* "The paradox holds even with non-rival goods (like the Prayer/Alcohol case). Scarcity isn't the driver; preference interdependence is."
  4.  **"The real lesson is that you have to drop the Pareto principle."** (Minute 35, during resolutions)
      *   *Status:* **Fair Worry (Concede).**
      *   *Defusal:* "Sen's own conclusion. If you value rights, you must accept that society will sometimes choose an outcome everyone agrees is worse. That is the price of liberty."
  5.  **"But that's just utilitarianism."** (The Utilitarian Guy, Minute 40)
      *   *Status:* **Category Error.**
      *   *Placement:* He will say this when you discuss "Why not just sum utilities?"
      *   *Defusal:* "Utilitarianism *violates* Minimal Liberalism. If the sum of utilities says 'Ban the spider,' but Priya has the right to decide, Utilitarianism overrides the right. This theorem proves Utilitarianism is incompatible with this definition of Rights. You have to choose."

  ---

  ### 4. What to Cut (The 50-Minute Reality)
  You are already cutting the $n$-person proof. Good. Cut these too:
  1.  **The "Game Form" vs. "Outcome" Distinction:** (Gibbard's later work). This is deep water. It asks whether rights protect *actions* or *outcomes*. It will derail you into philosophy semantics. Stick to Social Choice Functions (outcomes).
  2.  **Historical Context:** No need to discuss 1970s welfare economics debates.
  3.  **Detailed Resolutions:** Don't walk through "Restricted Domain" or "Preference Change" in detail. Mention them as bullet points.
  4.  **The "Nosey Neighbour" Literature:** Acknowledge the critique (as you did with your friend), but don't let them debate whether neighbours *should* be nosey. The theorem assumes they *are*.

  **What to say out loud:**
  "I am deliberately treating rights as *constraints on the social choice function*, not as legal claims or game strategies. We are analyzing the logic of aggregation, not the jurisprudence."

  ---

  ### 5. The Final Question
  Do not ask them to recite the theorem. Ask them to **build a profile**.

  **The Question:**
  > "I want to avoid the paradox. I am willing to keep Weak Pareto and Minimal Liberalism. Construct a preference profile for Priya and Tom (using the Spider/Hair case) where **no cycle occurs**. What feature of their preferences did you have to remove to make it work?"

  **Why this works:**
  *   It forces them to manipulate the variables (Preferences vs. Rights).
  *   To answer correctly, they must realize they need to remove the **meddlesome preference** (e.g., Priya must be indifferent to Tom's hair).
  *   If they say "Give Priya more rights," they failed.
  *   If they say "Make Priya not care about Tom," they understood that the clash comes from *interdependent preferences over protected spheres*.

  **Summary Checklist for the Whiteboard:**
  1.  **Axioms:** UD, WP, ML.
  2.  **The Cycle:** $a \succ b$ (Pareto), $b \succ c$ (Right 1), $c \succ a$ (Right 2).
  3.  **The Cost:** Liberty $\rightarrow$ Inefficiency.
  4.  **The Cut:** No Game Theory, No Scarcity arguments.

  Stick to this, and you won't lose them to the "Arrow fatigue" or the "nosey neighbour" distraction.
