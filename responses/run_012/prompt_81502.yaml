answer: |-
  1. **When you utter 'lying is wrong' unembedded, what kind of mental state are you primarily expressing?**
      *   (A) A belief that aims to describe a feature of the world.
      *   (B) A non-cognitive attitude like disapproval or a plan.
      *   (C) A commitment to a specific pattern of inference.
      *   (D) A hybrid state involving both a belief and an attitude.
      *   **Landing:** (A) leads to Cognitivism or Error Theory; (B) leads to Expressivism; (C) leads to Inferentialism; (D) leads to Hybrid views.

  2. **When one person says 'lying is wrong' and another says 'lying is not wrong', where does the disagreement live?**
      *   (A) In the contents: they assert contradictory propositions.
      *   (B) In the attitudes: they hold inconsistent non-cognitive states.
      *   (C) Nowhere: one utterance lacks genuine commitment or force.
      *   **Landing:** (A) confirms a truth-conditional semantics; (B) confirms an expressivist semantics; (C) lands on the Force-Only line, which is largely unheld (diagnosis: unattractive because it renders moral disagreement illusory).

  3. **In the antecedent of 'if lying is wrong...', what semantic value does the clause 'lying is wrong' contribute?**
      *   (A) The same content it contributes when asserted unembedded.
      *   (B) A belief-content, whereas the unembedded version expresses an attitude.
      *   (C) No content at all; it functions merely as a logical placeholder.
      *   **Landing:** (A) is required for Realism, Quasi-Realism, and Attitude-Logic; (B) forces a Hybrid view; (C) forces Force-Only or Inferentialism.

  4. **Is the embedding problem for 'wrong' the same problem as the embedding problem for epistemic 'might'?**
      *   (A) Yes: both are solved by relativizing content to contexts or information states.
      *   (B) No: 'might' takes a context parameter, but 'wrong' cannot.
      *   (C) Yes: both require a logic of inconsistent attitudes rather than truth-conditions.
      *   **Landing:** (A) leads to Contextualism/Relativism; (B) isolates Moral Expressivism; (C) leads to Global Expressivism. *(Note: I am least sure of this item because the semantics of epistemic modals are themselves contested between Yalcin-style and Moss-style accounts, making the analogy unstable.)*

  5. **Why is the argument from 'lying is wrong' and 'if lying is wrong...' to 'telling children to lie is wrong' valid?**
      *   (A) Because it preserves truth across all possible worlds.
      *   (B) Because holding the premises and denying the conclusion involves inconsistent attitudes.
      *   (C) Because it follows the primitive rules of the moral language game.
      *   **Landing:** (A) lands on Cognitivism, Error Theory, or Quasi-Realism; (B) lands on Attitude-Logic; (C) lands on Inferentialism. *(Flag: This item cannot separate Plain Realism, Quasi-Realism, and Error Theory, as all three accept truth-conditional validity; the divergence is metaphysical, not semantic.)*
