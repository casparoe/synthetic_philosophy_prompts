      *   Round 3 (Sense Sacred): 25 min
      *   Sharing/Comparison: 15 min
      *   Debrief: 10 min
      *   *Total:* 90 min.

  4.  **Develop the Rules for Rounds:**
      *   *Round 1:* "Translate this poem into your target language. Keep the meaning, the rhyme, the syllable count, and the first letters." (They will fail).
      *   *Round 2:* "The Acrostic (L-O-S-S or target language equivalent) is the Law. Rhyme and Meter must stay. Meaning is secondary."
      *   *Round 3:* "The Meaning/Theme is the Law. Rhyme and Meter should stay if possible. The Acrostic must be abandoned."

      *Correction on Acrostic:* If they translate into French, L-O-S-S doesn't work. They need to spell *Perte* (Loss) or *Adieu*? No, the prompt says "The unit I'm preparing is built on the problem... I'll hand each of them the four-line poem below."
      *Crucial Decision:* Do they spell L-O-S-S in the target language, or the equivalent word? Hofstadter usually argues for the *effect*. If the target language word for Loss is *Perte* (5 letters), the acrostic changes.
      *Refinement:* To make it comparable, let's ask them to spell the word for "LOSS" in their target language. If it's not 4 letters, they must adapt (e.g., use a 4-letter synonym or accept a mismatch).
      *Actually, simpler:* Let's ask them to preserve the *visual constraint* of the English letters L-O-S-S (as a formal constraint) OR the semantic equivalent.
      *Better for the exercise:* Let's make the Acrostic spell the target language word for "Loss". If the word is too long/short, they must choose a synonym that fits 4 lines. This adds another layer of constraint negotiation.
      *Wait, keep it simple:* The prompt says "first letters of the lines spell L-O-S-S". If I ask them to translate into Spanish, L-O-S-S is nonsense.
      *Instruction:* "In Round 2, you must preserve the Acrostic constraint. This means the first letters of your four lines must spell the word for 'LOSS' in your target language (e.g., P-E-R-T in French? No, Perte is 5. *Duel*? *Deuil*? *Perte*?).
      *Actually, to ensure comparability in the debrief:* Let's stick to the English L-O-S-S for everyone, treating the *letters* as the formal constraint, OR allow them to find a 4-letter synonym for Loss in their language.
      *Decision:* Allow them to choose a 4-letter word for "Loss" in their target language for the acrostic. If none exists, they must use L-O-S-S as a visual artifact. This creates immediate friction.
      *Simpler Decision for Runnability:* Just tell them: "Round 2: The Acrostic is Sacred. The first letters must spell the word for 'LOSS' in your target language. If that word is not 4 letters, choose a 4-letter synonym (e.g., 'Gone', 'Void', 'End')."
      *Round 3:* "Sense is Sacred. Convey the image of autumn/winter/loss accurately. Drop the acrostic."

  5.  **Drafting the Session Plan:**
      *   *Materials:* Handout with poem, timer, whiteboard.
      *   *Pairing:* Individual work, pair discussion.
