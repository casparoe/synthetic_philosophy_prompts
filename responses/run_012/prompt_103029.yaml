      *   **Source Text:** A specific 4-line poem provided by the user (ABAB rhyme, 7 syllables/line, L-O-S-S acrostic, theme of loss).
      *   **Key Requirements:**
          *   Students translate into languages they command.
          *   Rules must force trade-offs (cannot keep everything).
          *   Specific stages: One where acrostic is sacred (sense flexible), one where sense is sacred (acrostic flexible).
          *   Closing comparison: No single correct answer, just defensible trade-offs.
          *   Debrief: Map activity to constraint-satisfaction theory (generative vs. costly, ambiguity of "form").
          *   No theory vocabulary until the end.
          *   Must be runnable (materials, timing, success criteria).
          *   Must include "what will go wrong" and "what this activity can't do."

  2.  **Deconstruct the Source Text:**
      *   *Lonely winds begin to blow,* (7 syllables, L)
      *   *October burns the leaves red,* (7 syllables, O)
      *   *Summer's warmth has fled, and so* (7 syllables, S)
      *   *Silence settles in the bed.* (7 syllables, S)
      *   *Constraints:* 7 syllables, ABAB rhyme (blow/so, red/bed), L-O-S-S acrostic, semantic theme (autumn/winter transition as metaphor for loss).

  3.  **Design the Session Flow (90 Minutes):**
      *   *Introduction (5 mins):* Set the task, no theory.
      *   *Round 1: The Impossible Ideal (15 mins):* Try to keep everything. (Sets up the failure).
      *   *Round 2: Acrostic Priority (25 mins):* Keep L-O-S-S + Form, sacrifice Sense.
      *   *Round 3: Sense Priority (25 mins):* Keep Sense + Form, sacrifice Acrostic.
      *   *Gallery Walk/Comparison (10 mins):* See the variety.
      *   *Debrief (10 mins):* Introduce Hofstadter/Constraint theory.

      *Wait, 90 minutes is tight for 3 rounds of translation + debrief with 12 grad students.*
      *Adjustment:* Round 1 should be very short (just a diagnostic attempt). Round 2 and 3 need to be the meat. Pair work might be faster than individual work for generating options, but individual work ensures everyone feels the pressure. Given 12 students, pairs (6 pairs) might work well for discussion, but the prompt says "makes the students feel this pressure in their own hands." Let's stick to individual drafting but pair sharing for feedback.
      *Revised Timing:*
      *   Intro & Handout: 5 min
      *   Round 1 (All Constraints): 10 min (Quick crash)
