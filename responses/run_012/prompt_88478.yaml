  2. This holds only because the view is separable, meaning the moral contribution of each person is calculated independently of everyone else's status.
  3. Your gap version breaks separability by making an individual's weight dependent on their distance from the best-off person rather than their absolute level.
  4. Since leveling down reduces the gaps that drive your weighting function, the view treats the reduction of disparity as intrinsically valuable even when absolute welfare falls.
  5. Ordinary prioritarianism survives by ignoring relative positions entirely, while your comparative modification reintroduces the relational structure that makes leveling down plausible.
