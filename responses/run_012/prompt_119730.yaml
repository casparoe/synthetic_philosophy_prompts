answer: |-
  ### Essay Question

  **Scenario:** A research consortium studies a cohort of adolescents before and after a comprehensive policy intervention that standardizes school quality and nutritional intake across the population. Before the policy, the twin-based heritability ($h^2_{twin}$) of a receptive vocabulary test was 0.40. After the policy, $h^2_{twin}$ rose to 0.70. However, genome-wide complex trait analysis (GCTA) using common SNPs in the same post-policy cohort yields an estimate ($h^2_{SNP}$) of only 0.15.

  **Prompt:** Write an essay that reconciles these divergent estimates. Your answer must: (1) explain mechanically why $h^2_{twin}$ rose while $h^2_{SNP}$ remained low; (2) predict how each estimate would change if the policy were extended to make the environment perfectly uniform, and explain why they would not converge; (3) evaluate whether the post-policy $h^2_{twin}$ of 0.70 licenses a causal claim about genes, given assortative mating and gene-environment correlation; (4) state what the gap between 0.70 and 0.15 represents; and (5) clarify what these figures license regarding individual differences versus mean differences between social groups.

  ***

  ### Model Answer

  The divergence between the twin-based estimate ($h^2_{twin} = 0.70$) and the SNP-based estimate ($h^2_{SNP} = 0.15$) following environmental standardization illustrates the distinct mathematical and biological definitions of heritability. Heritability is not a fixed property of a trait but a ratio of variances: $V_G / (V_G + V_E)$. The policy intervention reduced environmental variance ($V_E$) by standardizing schooling and nutrition. As the denominator shrinks, the proportion of variance attributed to genetics rises, even if the absolute genetic variance ($V_G$) remains unchanged. This explains the rise in $h^2_{twin}$ from 0.40 to 0.70.

  The SNP estimate remains low because it measures something different. $h^2_{SNP}$ captures only the additive variance tagged by common SNPs on a genotyping array. It excludes rare variants, structural variations, and non-additive genetic effects that twin studies implicitly capture within $V_G$. Consequently, the gap between 0.70 and 0.15 is a fact about methodological reach, often termed "missing heritability," rather than a contradiction of biological reality. It indicates that while genetic differences drive individual variation in this uniform environment, current genomic tools capture only a fraction of that genetic influence.

  If the policy were extended to make the environment perfectly uniform, $V_E$ would approach zero (excluding measurement error). In this limit, $h^2_{twin}$ would approach 1.0, as all remaining variance would be attributed to the genetic component of the ACE model. $h^2_{SNP}$ would likely rise slightly due to reduced noise but would not converge with the twin estimate, remaining bounded by the variance explainable by common SNPs. The two estimates do not move together because one reflects the total genetic variance (plus confounds) relative to the environment, while the other reflects the captured genetic variance relative to the total phenotypic variance.

  However, the post-policy $h^2_{twin}$ of 0.70 does not license a purely causal claim about genes. Twin models assume equal environments for monozygotic and dizygotic pairs and no assortative mating. If parents assortatively mate for vocabulary, DZ twins share more than 50% of their segregating genes, inflating heritability estimates. Furthermore, passive gene-environment correlation (rGE) may persist; even with uniform schools, parents provide home environments correlated with their own genotypes. Thus, the 0.70 figure may conflate direct genetic effects with dynastic transmission, meaning it is not a clean measure of biological causation.

  Finally, neither estimate licenses inferences about mean differences between social groups. Heritability describes the sources of variance *within* a specific population under specific conditions. High heritability within a group does not explain why one group might score higher than another; those differences could be entirely environmental (Lewontin's fallacy). Furthermore, the rise in $h^2_{twin}$ should not be read as evidence that policy no longer matters. The policy succeeded precisely by reducing $V_E$, thereby raising heritability. A high heritability in a levelled environment confirms the policy's effectiveness in removing environmental noise, not the futility of further intervention. Ultimately, the low $h^2_{SNP}$ is a verdict on the method's reach, not a verdict on how much genes matter.

  ***

  ### Marking Scheme (20 Marks)

  **A. Variance Logic & The Twin Rise (5 Marks)**
  *   **4-5 Marks:** Explicitly identifies heritability as a ratio ($V_G/V_P$). Explains that reducing $V_E$ (denominator) increases $h^2$ even if $V_G$ is constant.
  *   **2-3 Marks:** Notes environment was levelled but fails to explain the mathematical ratio mechanism.
  *   **0-1 Marks:** Claims genes "became more important" or changed biologically.

  **B. The SNP Gap & Missing Heritability (5 Marks)**
  *   **4-5 Marks:** Identifies that $h^2_{SNP}$ captures only common/additive variants. Defines the gap as "missing heritability" or methodological limitation, not biological insignificance.
  *   **2-3 Marks:** Notes SNPs are different from twins but implies one is "wrong."
  *   **0-1 Marks:** Claims low SNP heritability proves genes do not influence the trait.

  **C. Causal Limits & Confounds (5 Marks)**
  *   **4-5 Marks:** Discusses assortative mating (inflating DZ similarity) and/or gene-environment correlation (rGE) as reasons $h^2_{twin}$ is not purely causal.
  *   **2-3 Marks:** Mentions confounds generally without specifying mechanisms like assortment or rGE.
  *   **0-1 Marks:** Treats the 0.70 figure as a definitive causal index of biological determinism.

  **D. Inference Limits (Groups & Policy) (5 Marks)**
  *   **4-5 Marks:** Explicitly forbids inferring group mean differences from within-group variance. Explains that high heritability post-policy indicates policy *success* (reduced $V_E$), not policy irrelevance.
  *   **2-3 Marks:** Correctly denies group difference inference but fails to address the policy irrelevance fallacy (or vice versa).
  *   **0-1 Marks:** Suggests high heritability means environmental interventions are no longer effective.

  **Specific Deductions (Applied to Total)**
  *   **-3 Marks:** Slides from within-group variance to between-group difference explanations.
  *   **-3 Marks:** Argues that rising heritability proves the environment no longer affects the trait.
  *   **-3 Marks:** Interprets low $h^2_{SNP}$ as evidence that genetic effects are negligible.
  *   **-2 Marks:** Fails to predict that estimates will not converge under perfect environmental uniformity.

  **Grade Boundaries**
  *   **18-20 (A):** Flawless synthesis. Hits the "Crux" (variance leftover vs. method reach) explicitly. No fallacies.
  *   **15-17 (B):** Solid technical understanding but misses one nuance (e.g., assortative mating or the specific policy fallacy).
  *   **12-14 (C):** Understands basic definitions but struggles to reconcile the divergent numbers or slips into causal language.
  *   **<12 (F):** Relies on rote mantras ("correlation is not causation") without applying them to the variance components or scenario.
