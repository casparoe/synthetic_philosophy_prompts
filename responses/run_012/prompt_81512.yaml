      *   *Decision:* I will use the traditional closure (repeating S1 lines in S6) because it reinforces the "coming back" aspect and the cyclical nature of the text vs. the linear nature of death. It emphasizes the "same words, nobody home" idea.

  3.  **Brainstorming Imagery & Themes:**
      *   *Epicurean:* Atoms, void, sensation, absence, sleep, no pain.
