prompt: |-
  I am running a session in a first-year undergraduate animal-ethics course with Charlotte's Web as the set text, and I want to read it through Kant rather than through the utilitarian machinery the students already expect. Set out what Kant is actually committed to — no direct duties to animals, cruelty to them wrong only through the damage it does to the agent's own humanity, and a divide between beings that have dignity and things that have only a price — and then hold the novel against that. Does the book treat what is done to Wilbur, and what Charlotte gives up for him, as wrongs owed to them, or merely as evidence about Fern and the Zuckermans? If the wrong is really a wrong to humanity, it ought to be dischargeable by repairing one's relations with other people; say whether the novel ever allows that discharge. Take seriously, too, that Charlotte's hold over the humans rests on words that are not true of Wilbur in any plain sense, and ask whether a moral status won that way is something Kant could accept or something he would have to call a confusion. Tell me which scenes to put in front of the students, and be honest where the novel will not carry the reading. Give me: The Kantian frame (about 200 words); Reading the novel through it (about 500 words); Where the novel resists the reading (about 300 words); What the novel adds to the debate (about 200 words).
