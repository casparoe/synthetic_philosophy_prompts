      *   **Tone:** Academic, honest, suitable for undergraduates.

  2.  **Drafting - Section 1: The Kantian Frame (~200 words)**
      *   *Goal:* Explain Kant's view on animals clearly and concisely.
      *   *Key points:* Rationality as the basis for moral status. Animals are things/means, not ends-in-themselves. Duties regarding animals are indirect duties to humanity. Cruelty dulls sympathy, harming our duty to humans.
      *   *Drafting:* For Kant, moral standing rests exclusively on rational autonomy. Beings capable of setting ends possess dignity and are ends-in-themselves; beings lacking this capacity, including non-human animals, are merely things with a price. Consequently, there are no direct duties *to* animals. We cannot wrong a pig by slaughtering it, because the pig cannot be a member of the moral community. However, Kant argues we have indirect duties *regarding* animals. Cruelty is prohibited not because it harms the animal, but because it damages the agent's own humanity. Habitual cruelty dulls shared feeling and sympathy, weakening the moral disposition required for duties toward other rational beings. Thus, animal ethics is anthropocentric: protecting animals is essentially hygiene for the human moral soul. The divide is absolute: you either have rational dignity or you are an instrument. There is no middle ground where sentience grants intrinsic worth.

