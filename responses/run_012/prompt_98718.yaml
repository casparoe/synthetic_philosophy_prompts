      *   *Goal:* Apply the frame to *Charlotte's Web*. Focus on Fern, the Zuckermans, Wilbur, and Charlotte.
      *   *Key points:* Fern's initial defense (direct duty?) vs. Kantian view (training her sympathy). The Zuckermans' change of heart (is it about Wilbur or their own character?). Charlotte's sacrifice (does it confer dignity?). The "words" issue.
