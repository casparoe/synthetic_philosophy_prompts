  *(Self-Correction on "Lookup Table"):* If a method finds features in a lookup table, those features are arguably *not* representations in the cognitive sense. They are just clusters in input space. The realist must claim NNs are distinct from lookup tables in a way that matters (compositionality/generalisation).

