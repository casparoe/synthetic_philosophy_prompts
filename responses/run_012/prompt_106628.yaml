  3.  **Brainstorming Defeaters (addressing specific prompts):**

      *   *Two-Labs Case:* If Lab A finds features $\{F_1, F_2\}$ and Lab B finds $\{G_1, G_2\}$ for the *same* model, and there's no isomorphism, realism takes a hit. If it's just labelling, we can translate. If the *structure* is incompatible (e.g., one says it's localist, one says it's distributed), that's worse.
      *   *Explanatory Work:* If "the model believes X" predicts the same as "the model activates vector V," does the semantic label add value? If the semantic label doesn't help predict *out-of-distribution* (OOD) behaviour better than the vector activation, it's just a nickname.
