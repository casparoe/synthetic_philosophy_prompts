answer: |-
  **The Inferential-Role Strategy and the Fate of Expressivism**

  The Frege–Geach problem remains the most significant hurdle for expressivist semantics. It challenges the view that moral sentences function primarily to express non-cognitive attitudes rather than to describe states of affairs. The core difficulty is that moral sentences embed within logical operators—negation, conditionals, disjunctions—in ways that suggest they possess truth-conditional content, regardless of whether the speaker is currently expressing an attitude. The inferential-role strategy (IRS) attempts to dissolve this problem by shifting the semantic ground. It proposes that meaning is not a matter of reference or truth conditions, but of use: specifically, the role a sentence plays in licensing inferences and transitions in practical reasoning. This essay assesses whether the IRS successfully dissolves the embedding problem or merely relocates it. I argue that while the IRS offers a sophisticated account of internal moral consistency, it merely relocates the problem into the domain of logical unity. In doing so, it fails to preserve the non-cognitive core of expressivism, effectively forcing the view to collapse into a form of cognitivism. The strategy is therefore fatal to expressivism as a distinct non-cognitive semantics.

  To evaluate this verdict, we must first clarify the three commitments of the inferential-role strategy. First, it asserts that the meaning of a moral predicate like "wrong" is exhausted by its inferential role. To understand "wrong" is to grasp that accepting "X is wrong" licenses a transition to a state of disapproval or a prohibition against X. Second, it redefines logical constants. Validity is not the preservation of truth from premises to conclusion, but the preservation of commitment or the coherence of planning states. Third, it treats embedded sentences not as truth-apt propositions but as licensing nodes. An asserted moral sentence endorses a transition; a conditional moral sentence specifies a dependency between transitions.

  On the surface, this strategy appears to handle the validity of moral instances of modus ponens. Consider the argument: (1) Lying is wrong; (2) If lying is wrong, getting your sibling to lie is wrong; (3) Therefore, getting your sibling to lie is wrong. Under IRS, premise (1) expresses the speaker's endorsement of a transition from "lying" to "disapproval." Premise (2) expresses a commitment that *if* one endorses the transition for lying, one must endorse the transition for sibling-lying. The conclusion follows because rejecting it while accepting the premises would involve a clash in the speaker's own web of commitments. The argument is valid because the inferential roles mesh; the "If" connects the licensing conditions of the antecedent to the consequent. In this restricted domain of purely moral reasoning, the IRS successfully mimics validity without invoking truth.

  However, the strategy encounters immediate difficulty when tested against negation. The Frege–Geach problem highlights that "Lying is not wrong" cannot simply express the absence of disapproval, as that would amount to indifference rather than the positive judgment of permissibility. The IRS attempts to repair this by defining "not wrong" as a license for tolerance or a prohibition on disapproval. Yet, this raises the question of logical exclusion. In classical logic, P and not-P cannot both be true. In the IRS framework, "Wrong" and "Not Wrong" must be incompatible attitudes. But why are they incompatible? Psychologically, an agent can feel ambivalent, simultaneously holding conflicting attitudes. For the logic to hold, the incompatibility must be normative, not psychological. The IRS must claim that it is *incorrect* to hold both attitudes. But once we introduce a standard of correctness independent of the agent's actual psychology, we are smuggling in a truth-apt norm. If it is a fact that one ought not to hold both attitudes, then the sentence "It is false that lying is wrong and not wrong" begins to look like a description of a normative fact, not merely an expression of a consistent plan. The IRS relocates the problem from "truth conditions" to "conditions of attitudinal consistency," but it cannot explain the *necessity* of that consistency without appealing to a structure that functions exactly like truth conditions.

  The failure becomes fatal when we consider the requirement that logical constants must have a uniform meaning across moral and non-moral contexts. This is the problem of mixed inferences. Consider the following valid argument: (1) If lying is wrong, then God exists (perhaps because only a divine lawgiver could ground moral wrongness); (2) Lying is wrong; (3) Therefore, God exists. Here, a moral premise combines with a conditional linking morality to metaphysics to yield a descriptive conclusion. For this argument to be valid, the "If... then" and the "Therefore" must operate identically in the moral and descriptive domains. If the moral "If" signals a licensing of attitudes and the descriptive "If" signals a truth-functional relationship, the argument commits an equivocation.

  To avoid equivocation, the IRS must claim that the descriptive "If" is also just a licensing node for planning states. This implies that *all* language, including descriptive claims about God or physics, is ultimately a matter of inferential roles and planning commitments. While this is a coherent philosophical position (a global expressivism), it abandons the specific claim of *moral* expressivism, which relies on a contrast between cognitive descriptive language and non-cognitive moral language. If the IRS solves the embedding problem by making all language inferential, it dissolves the distinction that made expressivism interesting in the first place. If, however, it maintains that descriptive language is truth-conditional while moral language is role-conditional, it cannot explain why mixed inferences are valid. The logical constants would be homonyms, and the validity of mixed arguments would be a miracle. Since mixed arguments are intuitively valid, the IRS forces a choice: either abandon the distinction between moral and descriptive semantics (collapsing into global non-cognitivism) or admit that moral sentences must play the same truth-functional role as descriptive ones (collapsing into cognitivism).

  Furthermore, the strategy struggles with ascriptions of moral judgment to others. When I say, "She believes that lying is wrong," I am describing her psychological state. Under IRS, this should mean "She endorses the transition from 'lying' to 'disapproval'." This seems plausible. However, consider: "She believes that lying is wrong, but she is mistaken." For the expressivist, error is usually cashed out as inconsistency in the agent's own attitudes. But I can consistently believe she is mistaken even if her attitudes are internally coherent. I might think her fundamental principle is flawed. To capture this, the IRS must allow for the evaluation of the *licensing rules* themselves. But if licensing rules can be correct or incorrect independent of the agent's acceptance, we are once again positing objective normative facts that moral sentences describe. The IRS attempts to treat the embedded clause as a licensing node, but in belief ascriptions, the clause functions as the *content* of the belief. To separate the content from the attitude report without invoking a proposition is to engage in a semantic fiction that breaks down under the pressure of error claims.

  The most charitable reading of the IRS is that it succeeds only within a restricted range of cases: specifically, in first-person, present-tense moral reasoning where no descriptive premises are involved. In this narrow sphere, validity can be understood as coherence of commitment. But semantics must account for the full range of linguistic behavior, including disagreement, mixed inference, and past-tense ascription. In these broader contexts, the IRS fails to explain the data without importing truth-conditional machinery. It relocates the Frege–Geach problem from the semantics of embedding to the semantics of logical constants, and there it founders on the requirement for logical unity.

  **Verdict**

  The inferential-role strategy **fails to dissolve the Frege–Geach problem**. It merely relocates the difficulty from the nature of moral content to the nature of logical validity, where it proves fatal to expressivism as a non-cognitive theory. The strategy cannot account for the validity of mixed inferences without either fragmenting logic (which is untenable) or treating moral sentences as truth-apt (which abandons expressivism). Consequently, the only way to save the insights of the IRS is to accept that moral sentences do, in fact, have truth-conditional content, even if the metaphysics underlying those truths is non-natural or lightweight. This concedes the semantic battle to cognitivism.

  **Objection and Defense**

  The strongest objection to this verdict is that it begs the question against the expressivist by assuming that logic *must* be truth-conditional. The proponent of IRS argues that I am presupposing the very cognitivist framework under attack. They claim that logic is fundamentally about the consistency of attitudes or plans, not the preservation of truth. On this view, mixed inferences work not because moral and descriptive sentences share truth conditions, but because both types of sentences are governed by a single, unified logic of planning. Descriptive beliefs are simply plans to represent the world accurately; moral judgments are plans to act. When they interact in an argument, the logic ensures that one's plan to represent the world and one's plan to act do not conflict. Thus, the unity of logic is preserved without positing moral truth conditions.

  This objection fails because it cannot adequately distinguish between *logical* inconsistency and *practical* incompatibility. Logical inconsistency is formal and context-independent; practical incompatibility is often contingent on the agent's desires and goals. If I plan to drink coffee and plan to drink tea, there is no logical contradiction, even if I can only do one. Yet, if I assert "Lying is wrong" and "Lying is not wrong," this is a logical contradiction, not merely a practical conflict. The IRS must explain why moral attitudes obey the stricter laws of logic rather than the looser laws of practical compatibility. To do so, it must posit that moral attitudes have a "mind-to-world" direction of fit—that they aim to match a normative reality—rather than a "world-to-mind" direction of fit characteristic of desires and plans. But once moral attitudes are granted a mind-to-world direction of fit to secure their logical behavior, they become functionally indistinguishable from beliefs. If they function like beliefs in semantics, logic, and psychology, the denial that they are beliefs becomes a metaphysical technicality rather than a semantic distinction. Therefore, the objection that logic need not be truth-conditional collapses: to perform the role of truth in the logical system, the content must be treated as truth-apt. The IRS thus saves the phenomenon of moral logic only by sacrificing the non-cognitive essence of expressivism.
