prompt: |-
  I am a high school student trying to referee an argument in my ethics club. We were discussing a visiting student from a country where tipping is not customary and pedestrians cross whenever the street is clear. In her first week here, she left no tip at a sit-down restaurant, crossed against the light when no cars were coming, and cut into a long line at the cafeteria because she assumed it was just a crowd, not a queue. Two members, Maya and Jonah, disagreed about whether she did anything wrong.

  Maya said: "These aren't just local quirks. Tipping, queueing, and jaywalking are the terms on which a society coordinates, and a visitor who takes the benefits -- safe streets, paid service workers, orderly lines -- while ignoring the terms is free-riding. At minimum, she owes locals the courtesy of following visible conventions, even if she doesn't endorse them. Consent isn't the only source of obligation: when you enter someone's home, you follow their house rules even if you didn't vote on them."

  Jonah replied: "That proves too much. If convention alone created moral obligation, any oppressive or arbitrary local rule would bind visitors. She didn't consent to these norms, and some of them -- especially jaywalking laws almost no one obeys -- aren't moral rules at all. Tipping is a private transfer, not a duty; queueing is just efficient; crossing an empty street harms no one. We should distinguish morally load-bearing conventions from mere habits, and not demand that outsiders treat the second as the first."

  Maya answered: "But the examples aren't alike. Queueing is a coordination convention, tipping is a burden-shifting convention, and jaywalking is mostly a legal convention with little moral content. She can't be bound by all three in the same way, but she is bound by the first two because they affect others' expectations and burdens. She isn't being asked to adopt the norms as her own; she's being asked not to impose the costs of her noncompliance on people who follow them."

  Jonah said: "That still assumes the norms are fair. If a tip is expected because employers underpay staff, the visitor is being conscripted into fixing a labor problem she didn't create. And if the queue is just a local preference, cutting in is rude, maybe, but not immoral. There is a difference between breaking a rule and wronging a person."

  They asked me to decide, and I couldn't. Please adjudicate point by point: for each move, say whether it is clearly right, clearly wrong, or partly right, and why. Then say which side has the stronger overall position on whether everyday conventions like these are moral obligations, and on what visitors owe locals. I am especially interested in whether tipping, queueing, and jaywalking should be treated differently, and in where Maya and Jonah are talking past each other. Please do not give me a reading list or citations; I want the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Role:** Referee/Adjudicator for a high school ethics club argument.
      *   **Context:** A visiting student from a non-tipping/non-queueing culture violated three local norms (no tip, jaywalking, cutting line).
      *   **Participants:** Maya (argues conventions create obligations/free-riding) vs. Jonah (argues conventions aren't inherently moral/consent matters/fairness matters).
      *   **Task:** Adjudicate point-by-point (Right/Wrong/Partly Right + Why), determine the stronger overall position, address the differentiation between the three acts (tipping, queueing, jaywalking), and identify where they talk past each other.
      *   **Constraint:** No reading lists or citations; focus on reasoning.

  2.  **Deconstruct the Arguments:**

      *   **Maya's Core Thesis:** Conventions are terms of social coordination. Benefiting from a system while ignoring its terms is free-riding. Visitors owe courtesy/compliance with visible conventions even without consent (analogy: house rules).
      *   **Jonah's Core Thesis:** Convention $\neq$ Moral Obligation. Consent matters. Some norms are oppressive or arbitrary. Distinguish between "morally load-bearing" and "mere habits." Breaking a rule $\neq$ Wronging a person.
      *   **Maya's Rebuttal:** Distinguishes the three norms (Coordination vs. Burden-shifting vs. Legal). Focuses on *costs imposed on others* (expectations/burdens), not adopting norms internally.
      *   **Jonah's Rebuttal:** Challenges fairness (tipping subsidizes bad wages). Distinguishes rudeness vs. immorality. Breaking a rule isn't necessarily wronging a specific person.

  3.  **Point-by-Point Adjudication:**

      *   *Maya Move 1 (Free-riding/House Rules):*
          *   Analysis: Strong intuition that guests should follow host rules. The "free-riding" argument works well for queueing (public good of order). Weaker for tipping (voluntary surcharge).
          *   Verdict: Partly Right. The house rule analogy is strong for *respect*, but "free-riding" implies a benefit received that is contingent on the act. You benefit from the queue existing, but do you benefit from the tip?
      *   *Jonah Move 1 (Convention $\neq$ Obligation/Consent):*
          *   Analysis: Correct that not all conventions are moral (e.g., segregation laws). Consent is tricky; tacit consent is often argued in political philosophy. Distinguishing moral rules from habits is crucial.
          *   Verdict: Partly Right. He's right that convention isn't *sufficient* for morality, but wrong to imply consent is *necessary* for all obligations (e.g., do not harm).
      *   *Maya Move 2 (Differentiating Norms/Costs):*
          *   Analysis: This is her strongest move. She admits jaywalking is different. She focuses on *externalities* (imposing costs on others). This shifts from "follow rules" to "don't harm/exploit."
          *   Verdict: Clearly Right (mostly). Focusing on the impact on others is the correct ethical lens.
      *   *Jonah Move 2 (Fairness/Rudeness vs. Immorality):*
          *   Analysis: Strong point on tipping (structural labor issue). Strong distinction between "rude" (social sanction) and "wrong" (moral sanction).
          *   Verdict: Partly Right. He's right about the structural issue of tipping, but underestimates the harm of queue-cutting (it *does* wrong specific people by delaying them).

  4.  **Synthesizing the Overall Position:**

      *   Who wins? Maya has the better framework for *why* we follow norms (coordination/fairness), but Jonah has the better critique of *which* norms bind us (fairness/consent/harm).
      *   Actually, Maya's second move aligns closer to standard ethical reasoning (harm principle/fair play), but Jonah correctly identifies that "social expectation" isn't enough.
      *   *Decision:* Maya has the stronger *practical* position for a visitor (err on the side of compliance), but Jonah has the stronger *theoretical* position on the source of obligation. However, since the question is "Did she do anything wrong?", Maya's argument that she violated fairness obligations regarding the queue is stronger. Jonah is too permissive on the queue.
      *   *Refinement:* It's a draw with a nuance. Maya wins on Queueing. Jonah wins on Tipping. Jaywalking is mixed/context-dependent.
      *   *Overall:* Maya's "Fair Play" principle is more robust for social cohesion, but needs Jonah's "Fairness of the Rule" caveat. I should declare a winner based on the prompt's focus: "whether everyday conventions... are moral obligations." Jonah is technically more philosophically precise (conventions aren't *inherently* moral), but Maya is more practically correct about the visitor's duty. I will lean towards Maya on the *obligation* front, but validate Jonah's *limitations*.
      *   *Wait, looking closer:* The prompt asks "which side has the stronger overall position."
      *   Maya argues: Conventions create obligations via fair play.
      *   Jonah argues: Conventions don't create obligations unless they meet moral criteria (harm/fairness).
      *   Jonah is philosophically safer. Maya risks justifying oppressive norms. But Maya's second move mitigates this by focusing on *costs to others*.
      *   *Verdict:* Maya has the stronger position regarding the *visitor's specific duty*, because visitors have a duty of non-disruption. Jonah has the stronger position on the *nature of the norms themselves*. I need to pick one. I'll give the edge to Maya on the specific case (the visitor's conduct), but acknowledge Jonah's theoretical corrections. Actually, a nuanced "Maya wins on Queueing, Jonah wins on Tipping" might be too split. Let's look at the "Overall position on whether everyday conventions... are moral obligations." Jonah is right: they aren't *automatically* moral obligations. Maya is right: they often *become* them through reliance.
      *   *Decision:* I will argue that Maya has the stronger position *in this specific context* (visitor ethics), but Jonah correctly identifies the limits of her theory.

  5.  **Addressing the Three Acts (Differentiation):**

      *   *Queueing:* Clear harm to others (time). Moral obligation. Maya wins.
      *   *Tipping:* Complex. Economic subsidy. Social expectation vs. Wage justice. Jonah wins (not a strict moral duty, more social).
      *   *Jaywalking:* Legal vs. Moral. Safety vs. Efficiency. Context matters. Split.

  6.  **Identifying "Talking Past Each Other":**

      *   Maya talks about *Social Obligation/Etiquette* (what you owe the group).
      *   Jonah talks about *Moral Wrongdoing* (what is inherently right/wrong).
      *   They conflate "Rude" vs. "Immoral."
      *   They conflate "Origin of the rule" vs. "Effect of breaking the rule."

  7.  **Drafting the Response:**

      *   *Tone:* Educational, clear, fair, high-school appropriate but intellectually rigorous.
      *   *Structure:*
          1.  Intro (acknowledge the complexity).
          2.  Point-by-Point Adjudication (Maya 1, Jonah 1, Maya 2, Jonah 2).
          3.  Differentiation of the Three Acts.
          4.  Where they Talk Past Each Other.
          5.  Final Verdict (Who has the stronger position).

      *(Self-Correction during drafting)*: Make sure I don't just say "It depends." I need to take a stance on the reasoning quality.
      *   Maya 1: Partly Right. Good analogy, but "free-riding" is shaky on tipping.
      *   Jonah 1: Partly Right. Good distinction, but "consent" is a red herring for visitors.
      *   Maya 2: Clearly Right. This is the crux. Impact on others matters.
      *   Jonah 2: Partly Right. Fairness of tipping is valid, but queue cutting *does* wrong persons.

      *Final Verdict:* Maya has the stronger position on the *visitor's duty*, Jonah on the *nature of the norms*. I will conclude that Maya wins the debate on the specific question ("Did she do anything wrong?") because the duty of a guest to not disrupt local coordination is a moral obligation, even if the norms themselves are imperfect.

  8.  **Final Polish:** Check constraints (no citations, focus on reasoning). Ensure the distinction between "moral obligation" and "social expectation" is clear.

      *(Refining the "Talking Past Each Other" section)*: This is crucial. Maya focuses on *Fair Play* (you benefit, you contribute). Jonah focuses on *Justice* (is the rule fair?). They are using different ethical frameworks.

      *(Refining the Three Acts)*:
      *   Queueing: Coordination problem. Breaking it harms specific others. Moral.
      *   Tipping: Redistribution mechanism. Breaking it harms the worker (maybe) or breaks a social contract. Less clearly moral, more conventional.
      *   Jaywalking: Safety/Legal. If no harm, is it wrong? Legalism vs. Morality.

      Okay, ready to write.
answer: |-
  Here is an adjudication of the argument, broken down by move, followed by an analysis of the specific acts, the points of confusion, and a final verdict.

  ### Point-by-Point Adjudication

  **Maya Move 1:** *"These aren't just local quirks... a visitor who takes the benefits... while ignoring the terms is free-riding... when you enter someone's home, you follow their house rules."*
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** Maya is correct that social stability relies on coordination. The "house rules" analogy is strong regarding **respect**: a guest has a duty not to disrupt the host's environment. However, her "free-riding" argument is uneven. It applies perfectly to queueing (you benefit from the line's order, so you must maintain it). It applies poorly to tipping. Tipping is not a public good like an orderly line; it is a voluntary surcharge. You do not "free-ride" on a tip in the same way you free-ride on a queue, because the service is usually rendered *before* the tip is decided.

  **Jonah Move 1:** *"If convention alone created moral obligation, any oppressive or arbitrary local rule would bind visitors... We should distinguish morally load-bearing conventions from mere habits."*
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** Jonah is philosophically precise here. He is correct that "everyone does it" or "it is the rule" does not automatically make something moral (e.g., historical segregation laws were conventional but immoral). He is also right that consent matters; visitors did not vote on these norms. However, he is wrong to imply that consent is the *only* source of obligation. You have obligations not to harm others even without their consent. By dismissing queueing as "just efficient," he underestimates that efficiency in a crowd is a moral good because it treats everyone's time equally.

  **Maya Move 2:** *"She isn't being asked to adopt the norms as her own; she's being asked not to impose the costs of her noncompliance on people who follow them."*
  *   **Verdict:** **Clearly Right.**
  *   **Reasoning:** This is Maya's strongest argument. She shifts from "follow the rule because it exists" to "follow the rule because breaking it hurts others." This is the core of moral obligation. If cutting in line makes everyone else wait longer, you have imposed a cost on them. If not tipping means the server relies on that income to live, you have impacted their welfare. This moves the debate from "etiquette" to "harm," which is the correct ethical framework.

  **Jonah Move 2:** *"If a tip is expected because employers underpay staff, the visitor is being conscripted into fixing a labor problem... There is a difference between breaking a rule and wronging a person."*
  *   **Verdict:** **Partly Right.**
  *   **Reasoning:** Jonah is clearly right about tipping. It is structurally unfair to make the customer responsible for the employer's wage policy. However, he is wrong about the queue. Cutting in line *does* wrong specific persons (those behind you who are now delayed). He claims breaking a rule isn't wronging a person, but in coordination games like queueing, the rule *is* the protection of the person. Breaking it directly disadvantages specific individuals.

  ---

  ### Differentiating the Three Acts

  Maya and Jonah are struggling because they are treating tipping, queueing, and jaywalking as the same category. They are not. They should be treated differently based on **harm** and **fairness**.

  1.  **Queueing (The Strongest Moral Obligation):**
      *   **Type:** Coordination Convention.
      *   **Analysis:** This is a "fair play" issue. The system only works if everyone participates. When the student cuts in, she gains an advantage (time saved) at the direct expense of others (time lost).
      *   **Verdict:** **Maya is right.** This is a moral wrong, not just rudeness. It violates fairness and imposes a tangible cost on specific individuals.

  2.  **Tipping (The Weakest Moral Obligation):**
      *   **Type:** Burden-Shifting Convention.
      *   **Analysis:** This is a structural economic issue. The moral failure lies primarily with the employer, not the customer. While the server expects the tip, the customer did not agree to the wage structure.
      *   **Verdict:** **Jonah is right.** It is socially expected, but it is not a strict *moral* duty in the same way queueing is. It is a social contract the visitor didn't sign. Not tipping is a breach of local custom, but arguably not a deep moral failing if the visitor is unaware or principled against the wage system.

  3.  **Jaywalking (The Contextual Obligation):**
      *   **Type:** Legal/Safety Convention.
      *   **Analysis:** This depends entirely on risk. If the street is truly empty and safe, the "harm" is abstract (undermining respect for the law). If there is risk, it endangers drivers and the pedestrian.
      *   **Verdict:** **Split.** If no cars are coming, Jonah is right that it is harmless. However, Maya is right that consistent disregard for traffic laws creates unpredictability, which is dangerous for the community. It is a minor obligation compared to queueing.

  ---

  ### Where They Are Talking Past Each Other

  The debate is stuck because Maya and Jonah are using two different definitions of "Obligation."

  1.  **Fair Play vs. Justice:**
      *   **Maya** is arguing from **Fair Play**: "You are entering a game that is already in progress. To play without following the rules is unfair to the other players."
      *   **Jonah** is arguing from **Justice**: "The rules of the game themselves might be unfair. Why should I be bound by a bad system?"
      *   **The Clash:** Maya focuses on the *act* of breaking the norm (disruption). Jonah focuses on the *origin* of the norm (legitimacy). Both are relevant, but they answer different questions.

  2.  **Rudeness vs. Immorality:**
      *   **Maya** conflates social rudeness with moral wrongness. She argues that because it is a "convention," breaking it is "wrong."
      *   **Jonah** tries to separate them. He argues that just because something is rude (queue cutting) or expected (tipping), it doesn't mean it is *immoral*.
      *   **The Clash:** They need to agree on a spectrum. Queue cutting is rude *and* immoral (unfair). Not tipping is rude *but* arguably not immoral (economic dispute). Jaywalking is illegal *but* morally neutral if safe.

  3.  **The Visitor's Status:**
      *   **Maya** treats the visitor as a **Guest**: Guests have heightened duties of compliance to respect the host.
      *   **Jonah** treats the visitor as an **Autonomous Agent**: Agents only bind themselves to rules that make moral sense.
      *   **The Clash:** In ethics, the "Guest" role usually carries specific duties of non-disruption that override the "Autonomous Agent's" desire to critique local norms *while visiting*.

  ---

  ### Final Verdict

  **Who has the stronger position?**

  **Maya has the stronger overall position regarding the visitor's conduct, but Jonah has the stronger position regarding the nature of the norms.**

  Since the question is "Did she do anything wrong?", **Maya wins the debate.**

  **Why?**
  Jonah's argument relies on the idea that because a norm is conventional or imperfect, it creates no obligation. This is too permissive. A society cannot function if every individual decides which coordination norms to follow based on their personal moral audit.
  *   **On Queueing:** Maya is decisively correct. The visitor imposed a cost on others. That is a moral wrong, regardless of whether she "consented" to the queue.
  *   **On Tipping:** Jonah is correct that the *system* is flawed, but Maya is correct that the *visitor* is still participating in a local economic exchange. While not a deep moral sin, ignoring the norm creates a negative outcome for the server that the visitor could have easily avoided.
  *   **On Obligation:** Maya's "House Rule" analogy is the deciding factor. When you enter a distinct social space (a foreign country), you incur a temporary duty of **non-disruption**. This is not because the rules are perfect, but because your presence is temporary and your disruption causes friction for permanent residents.

  **Conclusion for the Club:**
  You should rule that the student had a moral obligation to follow the **queueing** norm because it directly affected others' time (Fairness). She had a social, but less strictly moral, obligation regarding **tipping** (Jonah is right that this is structural). She had a minor obligation regarding **jaywalking** dependent on safety.

  Maya is right that visitors owe locals the courtesy of coordination. Jonah is right that we should critique *why* those norms exist. But in the moment of action, the duty to not disrupt (Maya) outweighs the right to critique the system (Jonah).
