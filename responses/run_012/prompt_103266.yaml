          *   User preference: Wants to keep (1) (Anonymity/Supervenience on individuals), willing to surrender (2) (Independence/Issue-by-Issue) or (4) (Consistency requirement), but suspects they have different prices.
          *   Second Question: Does voting on "whole packages" (premise-based vs. conclusion-based vs. package-based) escape the paradox or relocate it?
