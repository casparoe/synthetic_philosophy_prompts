  3.  **Evaluate the Steps:**
      *   (1) is standard democratic theory (supervenience on individuals). Hard to reject without positing a mystical group mind.
      *   (2) is the *Independence of Irrelevant Alternatives* (IIA) applied to propositions. This is the usual suspect in social choice theory.
