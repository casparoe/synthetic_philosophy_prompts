  Here is why Step (7) looked fine, why it's actually the slip, and the price of fixing it.

  ### Why Step (7) Looked Fine
  In natural language, we say "The lump is soft" and "The lump is hard." Grammar treats "soft" and "hard" like simple adjectives, the same way "red" and "blue" are. If something is red and blue all over at the same time, that's a contradiction. Step (7) exploits this grammatical illusion. It suggests that if the lump is soft at $t_1$ and hard at $t_2$, it has incompatible properties, just as if it were red and blue all over at $t_1$.

  This feels intuitive because we think of objects as being **wholly present** at every moment. If the *whole* lump is there on Monday and the *whole* lump is there on Tuesday, and it has different properties, it looks like the same thing has contradictory traits.

  ### Why Step (7) is the Slip
  Step (7) claims: *"If soft and hard are genuine properties... then one and the same lump has two properties it can't have at once."*

  This is false. "Soft" and "hard" are not incompatible properties *simpliciter*; they are only incompatible **at the same time**. To make the argument work, your cousin has to treat time as a container objects sit in, rather than a dimension objects extend across.

  To fix this without giving up (1) or Statues, you must **relativize properties to times**. You don't say "The lump is soft"; you say "The lump is soft-at-$t_1$." "Soft-at-$t_1$" and "Hard-at-$t_2$" are perfectly compatible properties, just like "Tall-in-London" and "Short-in-Tokyo" are compatible.

  ### Pricing the Fixes
  You asked for the cost of the available moves. Here is the bill for the three main options that preserve (1) and Statues.

  #### 1. Relativizing Properties to Times (Endurantism with Temporal Modification)
  *   **The Move:** You keep the idea that the lump is wholly present at each time, but you insist that all changeable properties are actually relations to times.
  *   **The Cost:** You have to accept that objects never have simple properties. Nothing is ever just "hard"; it is always "hard-at-$t$." This makes predication logically complex (3-place relations instead of 2-place). It also risks making change illusory: if the object at $t_1$ has property $F$ and the object at $t_2$ has property $G$, in what sense is it the *same* object changing, rather than just one object having a complex history?
  *   **Verdict:** Cheap on ontology, expensive on logic.

  #### 2. Coincident Objects + Sortal Essentialism (The Constitution View)
  *   **The Move:** You accept Step (4) (Lump $\neq$ Horse). You say there are two things in the drawer. You stop the "Crowd" (Step 6) by arguing that not every description creates an object; only things falling under **substantial sortals** (like *Horse*, *Lump*, *Paperweight*) count. Arbitrary time-slices don't count.
  *   **The Cost:** You must accept **material coincidence**: two distinct material objects in the same place at the same time. You also have to explain **modal differences**: why the Lump survives being squashed but the Horse doesn't, even though they share all the same clay particles. You have to say their "essences" differ despite identical matter.
  *   **Verdict:** Saves common sense best, but metaphysically "heavy." You pay in entities.

  #### 3. Temporal Parts (Perdurantism / Four-Dimensionalism)
  *   **The Move:** You accept Step (4) but interpret it differently. The Lump and the Horse are distinct **spacetime worms**. They share a temporal part (the clay-stage in the drawer) but have different temporal parts (the Horse has a beginning when shaped; the Lump does not).
  *   **The Cost:** You give up the idea that objects are **wholly present**. You are not reading a book; you are reading a temporal slice of a book-worm. This is a radical revision of how we experience reality. However, it solves Step (7) elegantly: the "soft" part and the "hard" part are different parts of the worm, so no contradiction.
  *   **Verdict:** Expensive on intuition, cheap on logic. Solves (6) and (7) cleanly.

  ### The Recommendation
  Since you want to keep (1) and you don't want to wave your hands, the cleanest solution is a hybrid: **Accept (4) (Constitution without Identity) but fix (7) with Temporal Parts or Indexing.**

  Tell your cousin:
  1.  **Keep (1):** Identity requires indiscernibility.
  2.  **Accept (4):** The Lump and the Horse are distinct objects (Constitution $\neq$ Identity). This is not incoherent; it just means they have different persistence conditions (sortals).
  3.  **Reject the inference to (6):** We stop the "crowd" by requiring **sortal essentialism**. Arbitrary descriptions ("the lump-minus-one-atom") don't pick out objects. Only things with unity conditions do.
  4.  **Reject the assumption in (7):** Properties are time-indexed. The Lump survives change because "soft-at-$t_1$" and "hard-at-$t_2$" are compatible.

  **The Price:** You pay for this by accepting that **two material objects can be in the same place at the same time** (Coincidence) and that **properties are time-relative**. That is cheaper than denying Statues exist or denying Logic works.

  Next Thursday, order a pint, tell him Step (7) begs the question on the nature of properties, and that you're willing to pay the cost of coincident objects to save the horse.
