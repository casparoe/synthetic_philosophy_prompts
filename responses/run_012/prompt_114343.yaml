prompt: |-
  I'm a postdoc and in about two weeks I have to give a work-in-progress talk to the mind & cognition group here, and the Q&A is going to be rough, so what I want is a prep sheet, not a pep talk. Think of yourself as a philosopher of mind who knows the teleosemantics / function literature cold and who has watched two hundred of these Q&As go sideways — you know the difference between the objection someone raises to be seen raising it and the one that actually ends the conversation. Work carefully, and before you rank anything, brainstorm the whole space of objections and then throw out the ones this specific room won't make. The standard list is not what I'm paying for.

  Here's my line. I argue that the usual story about mental content gets the direction of determination backwards. Everyone tries to fix content on the producer side: a state represents whatever it was selected for, or is disposed to covary with, at the point where it's generated. I say that's the wrong end of the wire. What a state represents is fixed by what the systems that *consume* it are built to do with it — content lives at the producer/consumer interface, not in the detector. The frog's bug-detector doesn't mean fly, or small-dark-moving-thing, or frog food; it means whatever the snapping machinery, the ducking machinery and the mating machinery are each built to do with it, and where those come apart there's either no fact of the matter or a much finer-grained fact than we thought. Two consequences I lean on: the swampman case comes out fine with no historical or selection story at all (his consumers do the same jobs, so his states mean the same things), and misrepresentation is easy, because a consumer can be wired to do things the state doesn't actually support.

  The room, roughly fifteen people. Four or five build computational models of navigation and decision-making in insects and rodents and think content-talk is a convenience at best. Two are predictive-processing people who happily talk about "what the model expects" without ever asking what makes an expectation *about* anything. One philosopher of cognitive science is openly instrumentalist about content and will announce it in the first five minutes. One person came from biology and does insect neuroethology, and knows the messy data on the frog-type cases better than I do. And there's a Kant person who comes to everything and asks about normativity — nobody else in the room cares, but it lands, because I definately don't have a good answer.

  Don't re-explain my view to me and dont tell me it's interesting. Tell me what this room does to it. Give me the response in this order, with roughly these lengths:

  - **Bottom line** — two sentences, the single thing I need to know walking in.
  - **Read on the room** — ~150 words: what these people will grant, what they won't, and where the first ten minutes of Q&A will actually go.
  - **The objections, ranked** — the main body, ~1200 words. Order by how likely × how much damage. For each: who in that list raises it, the objection in their voice and their vocabulary (a predictive-processing person and an instrumentalist won't put the same worry the same way), a 90-second reply, and one line on where that reply is soft. Fend-offs I can dispatch in a sentence get a sentence.
  - **What to concede in the talk itself** — ~200 words: the concessions that take the wind out of the top two or three objections before they're made.
  - **The one I'm hoping nobody asks** — ~250 words: the question, why it's lethal coming from that particular person, my best reply, and what I say if the reply doesn't land.
  - **The one thing not to say** — a single line.
