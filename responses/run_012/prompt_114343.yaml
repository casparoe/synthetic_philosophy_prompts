answer: |-
  **Bottom line**
  Your metaphysics of content won't survive contact with this room; your utility might. Pivot immediately from "what content is" to "what content explains," and concede the normativity point before the Kantian forces you to.

  **Read on the room**
  The Instrumentalist will frame the first ten minutes. They will not argue your mechanics; they will argue that positing content at all is unnecessary overhead compared to pure input-output modeling. The modelers and PP crowd will sit out the metaphysics but will pounce on precision: if content is fixed by consumers, and consumers are distributed networks, your "interface" is a fiction. The Neuroethologist holds the empirical veto; if the frog data doesn't show discrete consumer modules, your core example collapses. The Kantian is the only one who cares about the *ought*, but everyone else will smell blood if you try to derive normativity from function without history. Expect the Q&A to bypass the Swampman intuition pump entirely; this crowd cares about wiring diagrams, not twins. You are not defending a theory of truth; you are defending a useful level of abstraction.

  **The objections, ranked**

  **1. The Instrumentalist Challenge (Philosopher of Cognitive Science)**
  *   **Who & Voice:** They will open the bidding. Expect vocabulary like "explanatory stance," "posits," and "overhead." They won't ask if you're right; they'll ask if you're needed.
  *   **The Objection:** "You're solving a metaphysical problem nobody here has. My models predict navigation error without assigning content to states. If I can explain the frog's snap using sensory-motor loops and reward functions, adding 'content' at the consumer interface is just a gloss. Why should I accept the ontological cost of real content when instrumentalism gets the same predictive purchase?"
  *   **The Reply:** "Instrumentalism works until the system breaks in novel ways. If content is just a stance, you can't explain systematic misrepresentation where the consumer acts *against* its own reward function due to semantic error rather than wiring damage. My account predicts specific failure modes—semantic drift—that pure input-output modeling misses."
  *   **The Soft Spot:** You haven't demonstrated a case where semantic explanation outperforms functional explanation empirically; this is a promissory note.

  **2. The Normativity Trap (The Kantian)**
  *   **Who & Voice:** They will wait until the room quiets. Vocabulary: "ought," "rule-following," "constitution," "normative force." They speak slowly and expect you to stop thinking.
  *   **The Objection:** "You say a consumer can be wired to do things the state doesn't support. But without a history of selection, what grounds the 'support'? If the consumer is just a physical mechanism, it does what it does. Where does the *ought* come from? You've replaced historical norms with structural norms, but structure alone doesn't generate error, only difference."
  *   **The Reply:** "The norm is internal to the system's architecture. If the consumer is built to integrate state X with state Y to produce Z, and it fails, that is a structural norm violation. It's not moral normativity; it's engineering normativity. The 'ought' is hypothetical: if the system is to maintain homeostasis, it ought to process X this way."
  *   **The Soft Spot:** Engineering norms reduce to success conditions, not truth conditions; you haven't solved the disjunction problem, just relocated it.

  **3. The Empirical Mismatch (Neuroethologist)**
  *   **Who & Voice:** They know the frog literature better than you. Vocabulary: "distributed processing," "population coding," "modularity," "lesion data." They will cite specific papers.
  *   **The Objection:** "Your frog example assumes discrete modules: a detector, a snapping consumer, a mating consumer. The data shows distributed population coding. There is no single 'consumer' interface. The signal is used by everything simultaneously. If content is fixed by the consumer, and there are no discrete consumers, there is no determinate content."
  *   **The Reply:** "I'm arguing at the computational level, not the implementation level. Even if the wiring is distributed, the functional role is segregable. We can identify functional sinks where information converges to drive specific behaviors. The 'consumer' is a functional cluster, not necessarily a single neuron."
  *   **The Soft Spot:** If the functional clusters overlap significantly, your claim of "finer-grained facts" collapses into indeterminacy again.

  **4. The Consumer Indeterminacy (Computational Modelers)**
  *   **Who & Voice:** The insect/rodent modelers. Vocabulary: "weights," "loss functions," "downstream processing," "hidden layers." They think in graphs.
  *   **The Objection:** "In a neural net, every layer consumes the previous layer's output. Which layer fixes the content? If you say the final output layer, you ignore intermediate representations. If you say every layer, content is ubiquitous and trivial. Where do you draw the line between a consumer and just more processing?"
  *   **The Reply:** "The line is drawn at the behavioral output or the distinct functional subsystem. Content is fixed where the representation is used to guide action or update a distinct model, not just where it is transformed. Intermediate layers are transducers, not consumers."
  *   **The Soft Spot:** In deep learning and brains, the distinction between transduction and consumption is blurry; you're imposing a philosophical cut on a continuous gradient.

  **5. The Prediction Error Conflict (Predictive Processing People)**
  *   **Who & Voice:** The PP group. Vocabulary: "generative model," "prediction error," "minimization," "prior."
  *   **The Objection:** "In PP, content is fixed by the model's attempt to minimize error against input. You say it's fixed by the consumer. But the consumer *is* the model updating itself. If the consumer changes the weights to minimize error, hasn't the content changed? You treat consumers as static readers; they are active writers."
  *   **The Reply:** "The consumer's *function* is static even if its weights change. The system is built to minimize error. That functional goal fixes the content of the error signal, regardless of the current weight configuration."
  *   **The Soft Spot:** If the function changes via learning, content shifts; you need a story about which timeslice of the consumer fixes the content.

  **What to concede in the talk itself**
  Pre-empt the Instrumentalist by admitting content is a "high-level descriptive layer" that is only real insofar as it supports counterfactuals about system breakdown. Do not claim content exists independently of our explanatory interests; claim it is the *best* explanatory tool for specific failures. Pre-empt the Kantian by distinguishing "functional normativity" from "semantic normativity." Admit you are not solving the hard problem of ought, but rather locating where biological systems behave *as if* governed by norms. Pre-empt the Neuroethologist by acknowledging the frog case is a simplification for illustrative purposes, and that your theory applies to functional clusters, not necessarily anatomical modules. If you concede these, you remove the sting of "ontological extravagance" and "empirical ignorance." You position yourself not as a metaphysician dictating reality, but as a theorist offering a useful tool for cognitive science. This frustrates the Instrumentalist (who wants to kill content entirely) but makes you safe for the modelers.

  **The one I'm hoping nobody asks**
  **The Question:** "If Swampman's consumers do the same jobs, his states mean the same things. But if a consumer is damaged, the state means something else. Who decides when the consumer is 'damaged' versus when it just has a different function? Without a history of selection to define the 'proper function,' isn't your distinction between misrepresentation and mere variation arbitrary?" (Asked by the Kantian, supported by the Instrumentalist).
  **Why it's lethal:** It exposes the core weakness of non-historical consumer semantics. Without history, "damage" is just "different structure." If you can't define damage normatively, you can't define misrepresentation, and your whole account of content collapses into current disposition.
  **Best Reply:** "Proper function is defined by the systemic architecture's stability conditions, not history. A heart pumps blood; if it doesn't, it's damaged, even if it's a Swampman heart. Similarly, a consumer integrates information for homeostasis. If it fails to do so due to internal structural deviation, that's damage. We identify function by looking at the system's self-maintenance conditions."
  **If it doesn't land:** Pivot to utility. "Even if the metaphysical grounding is debatable, the distinction tracks real predictive differences in system behavior. We can identify 'damage' clusters empirically even if the normative boundary is fuzzy." Do not dig in on the metaphysics; retreat to the explanatory utility.

  **The one thing not to say**
  "It's just obvious that the consumer fixes the meaning."
