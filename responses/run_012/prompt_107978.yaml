answer: |-
  You have put your finger on exactly why this debate feels so exhausting to anyone who has spent time in it. The stalemate you are describing is not just your impression; it is a widely recognized feature of the literature on vagueness. Your diagnosis is sharp, and while I think both of your hypotheses capture part of the truth, the second one gets closer to the engine driving the deadlock. It is not so much that the two sides are answering different questions, but rather that they are offering competing cost-benefit analyses of the same question, prioritizing different theoretical virtues and treating different intuitions as non-negotiable data.

  Regarding your first hypothesis, that they are answering different questions about boundaries versus truth, there is some merit to the idea that they are talking past each other. When an epistemicist says there is a boundary, they mean a metaphysical cutoff in extension. When a supervaluationist says there is no boundary, they mean there is no single admissible sharpening that dictates truth. However, they are still competing to explain the same linguistic phenomena. They both want to account for why we hesitate to call a borderline patch red, why the sorites paradox feels compelling yet unsound, and how we reason with vague terms. So while their definitions of borderline differ, they are not merely discussing separate topics; they are rival theories of the same subject matter. The friction arises because each theory reconstructs the data differently. The epistemicist reconstructs the hesitation as ignorance. The supervaluationist reconstructs it as indeterminacy. Because they disagree on what the data actually are, they often fail to engage with the core commitment of the other side.

  This leads me to your second hypothesis, which I think is the stronger diagnosis. The debate is fundamentally about which data are authoritative and which theoretical costs are acceptable. The epistemicist privileges classical logic and bivalence above all else. They are willing to pay the price of accepting unknowable facts because they view the preservation of classical semantics as non-negotiable. To them, the intuition that there is no fact of the matter is a psychological illusion, similar to the illusion that the sun moves around the earth. The supervaluationist, conversely, privileges the semantic intuition that there is genuinely no fact of the matter in borderline cases. They are willing to pay the price of abandoning bivalence and facing the higher-order vagueness regress because preserving the openness of the borderline case is their primary goal. When the epistemicist complains about the unknowable boundary, the supervaluationist hears a defense of logic. When the supervaluationist complains about the sharp meta-boundary, the epistemicist hears a refusal to accept classical precision. They are not failing to understand each other so much as they are weighing theoretical virtues differently. One side values logical purity, the other values semantic fidelity to our intuitions about indeterminacy.

  You are also right to highlight higher-order vagueness as the flashpoint where this divergence becomes most visible. This is where the debate has arguably stalled for the last few decades. The epistemicist handles higher-order vagueness by simply iterating the unknowability claim, which feels ad hoc to opponents but is logically consistent. The supervaluationist struggles because defining the set of admissible sharpenings seems to require a precise boundary itself, leading to the charge that they have simply pushed the vagueness back a level without eliminating it. This is not a problem that has been solved to the satisfaction of the profession. It is genuinely contested whether higher-order vagueness can be modeled without reintroducing sharp boundaries somewhere in the meta-language. Some have tried to modify supervaluationism to allow for vague sets of admissible sharpenings, but this often leads to technical complications that threaten the preservation of classical consequence, which was the supervaluationist's main selling point.

  As for what is settled versus what is contested, you should be wary of any claim that the dust has settled. The only real consensus is that the sorites paradox is a serious problem that requires a solution, and that naive truth conditions for vague predicates are untenable. Beyond that, almost everything is contested. It is not settled whether bivalence holds for vague sentences. It is not settled whether classical logic must be preserved in all contexts. It is not settled whether vagueness is a feature of the world, our language, or our knowledge. Even the claim that epistemicism preserves classical logic untouched is slightly contested, as some argue that adding an epistemic operator to handle the unknowability changes the logical landscape in subtle ways. Similarly, the claim that supervaluationism preserves classical consequence is contested in intensional contexts. The field is characterized by a pluralism of approaches where no single view has achieved dominance because each view solves the sorites by violating a different deeply held intuition.

  So what would count as progress? I am skeptical that an experiment on how people judge higher-order cases will resolve the dispute. Experimental philosophy can tell us what intuitions people have, but it cannot tell us which intuitions ought to be respected by our best theory. If people feel strongly that there is no fact of the matter, the epistemicist will simply say people are mistaken about the metaphysics. If people feel strongly that logic must be binary, the supervaluationist will say logic is a tool we are refining. Empirical data rarely settles normative questions about how we ought to theorize truth. A formal result could help, perhaps a proof that higher-order vagueness cannot be modeled without sharp boundaries regardless of the framework, which would force both sides to concede something fundamental. But so far, the formal results tend to show that you can model vagueness in multiple ways, each with its own trade-offs.

  The most honest answer is likely that the question is not ill-posed, but that the expectation of a single winner is misplaced. Progress might look like a shift away from trying to find the one true theory of vagueness toward a more pluralistic understanding where different frameworks are useful for different purposes. For example, epistemicism might be the right tool for legal contexts where a decision must be made, while supervaluationism might be better for analyzing semantic content. Alternatively, progress might come from a third option that dissolves the dichotomy, such as contextualism, which suggests that the extension of vague predicates shifts depending on the context of utterance, thereby avoiding both the sharp boundary and the truth-value gap. But even contextualism faces its own versions of the sorites and higher-order problems. Until there is a breakthrough that allows us to preserve classical logic, bivalence, and the intuition of no fact of the matter simultaneously, or a compelling argument for why one of these must be abandoned, the debate will likely continue to cycle through the same four moves you identified. The stalemate is not a failure of the philosophers involved, but a reflection of the fact that our pre-theoretical concepts of truth, logic, and knowledge are pulling in incompatible directions when stretched by vagueness.
