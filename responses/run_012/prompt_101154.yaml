answer: |-
  Your confusion is entirely well-founded. In the literature on the Absent-Minded Driver (AMD), the phrase "maximise expected utility" is not a single proposition but a *schema*. It functions like a variable equation: $Maximise(EU(X))$. Your two friends are agreeing on the function but plugging in different variables for $X$, different time indices for the maximisation, and different information sets for the calculation.

  The paradox arises because imperfect recall breaks the standard link between the *plan* you would choose before starting and the *action* you would choose when you arrive. To help your group, here is a menu of four distinct precise claims that the slogan might be expressing. I have separated them by the **Object of Maximisation** (what is being chosen), the **Information State** (what is known when choosing), and the **Temporal Perspective** (whose utility counts).

  ### 1. The Ex Ante Planning Principle
  *   **The Claim:** A rational agent chooses the complete sequence of actions (the plan) at the start of the journey ($t_0$) that maximises the expected utility of the final outcome, assuming the plan will be followed.
  *   **Object of Maximisation:** The complete strategy (e.g., "Continue at Intersection 1, Exit at Intersection 2").
  *   **Information State:** Full knowledge of the map and payoffs; ignorance of future self-location is treated as a structural constraint of the plan.
  *   **Whose Utility:** The agent as a temporally extended whole (the "life" of the driver).
  *   **Status:** **Substantive and Defensible.** This is the standard solution in classical game theory and was the primary argument of Piccione & Lipman (1997). It treats the agent as a single planner binding their future selves.
  *   **Supports:** **Friend 1 (Continue).** The optimal ex ante plan is to Continue at the first intersection and Exit at the second (Payoff 4). Friend 1's advice to "continue" is correct *relative to the first intersection* under this plan.
  *   **Does it settle the case?** **Yes, but conditionally.** It settles what the *plan* should be. However, it faces the "time-consistency" objection: when the driver actually arrives at an intersection, does this principle tell her what to do *then*? If she has forgotten where she is, she cannot condition her action on "being at Intersection 1."

  ### 2. The Ex Interim Act Principle
  *   **The Claim:** A rational agent, at any moment of choice, performs the specific act-token that maximises expected utility relative to their current beliefs about where they are.
  *   **Object of Maximisation:** The specific act performed right now (Exit vs. Continue).
  *   **Information State:** Imperfect recall. The agent knows they are at *an* intersection but assigns a subjective probability ($p$) to being at the first vs. the second.
  *   **Whose Utility:** The agent-at-the-moment (the "temporal slice").
  *   **Status:** **Substantive but Problematic.** This leads to time inconsistency. If the agent calculates that Exiting is better now, they undermine the Ex Ante plan. It is defensible in standard decision theory but creates paradoxes in imperfect recall contexts.
  *   **Supports:** **Friend 2 (Turn).** Friend 2 treats the decision as a "gamble." This implies they are assigning a probability to being at either intersection (e.g., Principle of Indifference, $p=0.5$).
      *   *Calculation:* If $p=0.5$, EU(Exit) = $0.5(0) + 0.5(4) = 2$.
      *   If they assume that Continuing now implies they will likely overshoot later (Payoff 1), then EU(Continue) = 1.
      *   Since $2 > 1$, they argue for Exit.
  *   **Does it settle the case?** **No.** It merely restates the answer relative to a specific belief ($p$). The real philosophical fight is about what $p$ *should* be. (Should $p$ reflect the optimal plan, or should it be fixed independently?)

  ### 3. The Ex Interim Policy Principle
  *   **The Claim:** A rational agent, at any moment of choice, chooses a general rule (policy) for *all* indistinguishable intersections they might currently be at, maximising expected utility given that this rule will be applied at every such intersection.
  *   **Object of Maximisation:** A mixed strategy or disposition (e.g., "Continue with probability $\alpha$").
  *   **Information State:** Imperfect recall, but recognising that the choice made now constrains the choice at the other indistinguishable node (because you can't tell them apart).
  *   **Whose Utility:** The agent as a whole, but calculated from the interim perspective.
  *   **Status:** **Substantive and Defensible.** This is the view of Aumann, Hart, and Perry (1997). It respects the imperfect recall by forcing the agent to choose a *type* of action rather than a token.
  *   **Supports:** **Neither.** This principle typically yields a **mixed strategy** (e.g., Continue with probability 2/3, Exit with 1/3). Both Friend 1 (Pure Continue) and Friend 2 (Pure Exit) are arguing for "pure" strategies which this reading rejects as suboptimal.
  *   **Does it settle the case?** **Yes, mathematically.** It produces a specific probability $\alpha$. However, it is controversial because it requires the agent at the intersection to have "control" over what they would have done at the previous intersection (which they can't remember).

  ### 4. The Causal vs. Evidential Distinction (The Hidden Variable)
  *   **The Claim:** "Maximise expected utility" requires specifying whether your action is treated as *causing* the outcome or as *evidence* for the state of the world (specifically, your location).
  *   **Object of Maximisation:** The Act (as in Reading 2), but the *calculation* differs.
  *   **Information State:** Crucially, how does the action update the belief $p$ (probability of being at Intersection 1)?
      *   *Causal (CDT):* My choice now doesn't change where I am.
      *   *Evidential (EDT):* If I choose to Continue, it is more likely I am at Intersection 2 (because if I were the type to Exit, I would have left at 1).
  *   **Whose Utility:** The agent's total outcome.
  *   **Status:** **Substantive.** This is the technical engine driving the disagreement between Readings 1 and 2.
  *   **Supports:** **Friend 1 (via CDT/Ex Ante)** or **Friend 2 (via EDT/Ex Interim).**
      *   Friend 1 implicitly assumes their action doesn't change the fact that they need to reach Intersection 2 to win.
      *   Friend 2 implicitly treats their action as a signal: "If I'm willing to Exit now, I secure the 4 if I'm at Y, and avoid the 1 if I'm at Y but forget again."
  *   **Does it settle the case?** **No.** It pushes the debate back to whether rational agents should reason causally or evidentially in self-locating contexts.

  ---

  ### Summary Table for Your Group

  | Reading | What is Maximised? | Info State | Status | Supports | Settles Case? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ex Ante Plan** | Complete Strategy ($t_0$) | Full Knowledge | Defensible (Standard) | **Friend 1** | Yes (for the Plan) |
  | **2. Ex Interim Act** | Current Act Token ($t_{now}$) | Imperfect Recall | Problematic (Inconsistent) | **Friend 2** | No (depends on beliefs) |
  | **3. Ex Interim Policy**| Rule for all nodes ($t_{now}$) | Imperfect Recall | Defensible (Aumann et al.) | **Neither** (Mixed) | Yes (Mathematically) |
  | **4. Evidential/Causal**| Act + Belief Update | Self-Location | Technical/Deep | **Both** (Depends) | No (Shifts debate) |

  ### Conclusion: Does the Slogan Settle Anything?

  You should report to your group that the slogan **"Maximise Expected Utility" settles nothing on its own.** It is a placeholder.

  *   **Friend 1** is using the slogan as shorthand for **Reading 1 (Ex Ante Planning)**. They are correct that the *plan* to continue is optimal, but they struggle to explain why the driver should continue *at the intersection* when they don't know it's the first one.
  *   **Friend 2** is using the slogan as shorthand for **Reading 2 (Ex Interim Act)** with a specific assumption about risk or belief (likely treating the nodes as a 50/50 gamble). They are correct that *given certain beliefs*, exiting maximises interim utility, but they are arguably advocating for a strategy (Always Exit) that guarantees a lower payoff (0) than the optimal plan (4).

  **The Verdict:** The slogan is a **harmless platitude** if used without specifying the *time of evaluation* and the *object of choice*. It becomes a **substantive principle** only when you fill in those parameters. The disagreement in your group is not about whether to maximise utility, but about **when the maximisation takes place** (before driving vs. at the wheel) and **what is being chosen** (a specific turn vs. a whole policy).

  If you want to move the discussion forward, ask them: *"Are we maximising the utility of the plan chosen at home, or the utility of the act chosen at the intersection?"* Until they answer that, they are simply shouting the same slogan at each other with different dictionaries.
