answer: |-
  ### Part I: The Translation

  Here is the dispute between textualism and purposivism, restated in your vocabulary.

  **The Textualist Position**
  The statute is the published novel. The judge is a critic whose review determines the book's official canon. The textualist judge says: "I will read the words on the page as a competent speaker of the language understands them. I will not look at your early drafts, your editor's margin notes, or your interviews. If you wrote that the hero dies in Chapter 3, he dies, even if your diary says you meant for him to live and you made a mistake. The text is the only thing the public can read. If you wanted to say something else, you should have written it differently. The ambiguity is yours, not mine."

  *   **Canons of Construction:** These are the conventions of genre and grammar. If you write "cars, trucks, and vehicles," the textualist says genre convention dictates that "vehicles" only means things like cars and trucks, not airplanes, because that is how the list works in ordinary language.
  *   **Legislative History:** This is the author's correspondence and deleted scenes. The textualist bans them from evidence. They are unreliable, self-serving, and the reader never saw them when they bought the book.

  **The Purposivist Position**
  The statute is the published novel, but it is understood as an attempt to solve a problem or evoke a specific experience. The purposivist judge says: "I need to understand what you were trying to accomplish. If the text says the hero dies in Chapter 3, but the entire arc of the story and your notes to your editor show you were writing a redemption tale, and a typo caused the death, I will read it as a redemption tale. To do otherwise is absurd."

  *   **Legislative History:** These are the editor's notes and the author's drafts. They are admissible to prove what the story was *trying* to be.
  *   **The Absurdity Doctrine:** If a literal reading leads to a result that makes no narrative sense (the hero flies off a cliff for no reason), the reader is authorized to correct the text to match the story's internal logic.
  *   **Counterfactual Intent:** "You didn't write about smartphones because this book was set in 1990. But if you had to include a smartphone today, based on the themes you established, how would the hero use it?"

  **Where the Mapping is Clean**
  *   **Drafts and Revisions:** The parallel between legislative history (committee reports, floor debates) and an author's drafts/notes is direct. Both represent the evolution of the text.
  *   **The "Competent Reader":** Both fields argue over who this is. Is it the average person on the street (ordinary meaning) or a specialist in the genre (technical meaning)?
  *   **Ambiguity:** Both acknowledge that words can carry multiple meanings and that context is required to select one.

  **Where the Terms Must Be Bent**
  *   **The "Author":** In your trade, the author is a singular consciousness (or a collaborative few). In law, the "author" is 535 voting members plus the President, many of whom voted for the text for contradictory reasons. To speak of "legislative intent" requires bending the notion of authorship from a *mind* to a *coalition*.
  *   **The "Reader's" Stakes:** When you read a draft, you suggest changes. When a judge reads a statute, she issues a command. I have to bend your notion of "reading" to include "ruling."
  *   **Purpose:** In a novel, purpose is thematic or aesthetic. In a statute, purpose is regulatory. A novel's purpose can be ambiguous or multifaceted without breaking the book. A statute's purpose is often argued to be a single, actionable directive.

  ***

  ### Part II: The Residue Report

  You asked for the claims in the legal debate that cannot be expressed in your vocabulary. Here they are.

  **1. The Bindingness of the Decision**
  *   **The Claim:** When a judge interprets a statute, that interpretation becomes law. It binds the parties, and often future readers (judges). If you interpret a novel, I am free to disagree. If a judge interprets a tax code, the taxpayer pays or goes to prison.
  *   **The Gap:** This is not a defect in your framework. It is a category error. Your vocabulary describes *hermeneutics* (the theory of interpretation). Law is *jurisprudence* (the theory of authority). Your trade has no concept of a reading that carries the force of the state.
  *   **Verdict:** This indicates the legal dispute is not just about meaning; it is about **power**.

  **2. Non-Consenting Parties**
  *   **The Claim:** Readers choose to pick up a book. Citizens do not choose to be bound by the statutes of their jurisdiction. A defendant in a criminal case is subject to a text they never read and did not agree to.
  *   **The Gap:** In literature, the contract is voluntary. In law, the contract is coercive. This changes the ethics of interpretation. A textualist argues that because citizens are forced to obey, they must be able to rely *only* on what is written down. A purposivist argues that because citizens are forced to obey, the law must be fair in its outcome, even if the text is clumsy.
  *   **Verdict:** Your vocabulary lacks the concept of **coercion**.

  **3. The Collective and Hostile Author**
  *   **The Claim:** A legislature is not a co-authoring team like you and an editor. It is a battlefield. One group writes a clause to mean X; another votes for it hoping it means Y; a third votes for it to please a donor, not caring about the meaning.
  *   **The Gap:** When you say, "The character took over," you imply a unified subconscious. When a legislature produces a text, there is no subconscious. There is only compromise. "Legislative intent" is often a fiction constructed by the judge to clean up a mess made by enemies.
  *   **Verdict:** Your vocabulary assumes **agency**. The legislature often lacks it.

  **4. Meaning vs. Function (The "Is" and the "Ought")**
  *   **The Claim:** A novel *is*. A statute *does*. A poem can mean ten things and be richer for it. A traffic law cannot mean "stop" and "go" simultaneously; it must generate one outcome.
  *   **The Gap:** You are trained to tolerate ambiguity as depth. Lawyers are trained to resolve ambiguity as error. The legal debate is often about which tool generates the most stable *outcome*, not the most profound *meaning*.
  *   **Verdict:** Your vocabulary values **polysemy** (multiple meanings). Law values **determinacy** (one outcome).

  ***

  ### Part III: The False Friend

  You asked whether the anti-intentionalist arguments from criticism (e.g., "The Death of the Author," or your own experience of not knowing what the book means until it is finished) translate to the purposivist side.

  **They are a false friend.**

  Here is why:
  In literary theory, when you say, "I didn't know what I was saying until it was finished," you are arguing that the **text exceeds the author**. The text has authority over the author's explanation.
  *   **This supports Textualism, not Purposivism.**
  *   The Textualist says: "It doesn't matter what you *thought* you wrote. It matters what you *did* write. The text is the law."
  *   The Purposivist says: "We must look behind the text to find the goal you were trying to achieve, even if the text failed to capture it."

  Your experience of the "character taking over" suggests the text has a life of its own. A textualist agrees: the text is the only thing that lives. A purposivist disagrees: the text is a vessel for the legislature's will, and if the vessel leaks, we must look at the will.

  There is one narrow exception. If you argue that the "purpose" of the book emerged organically during drafting—a deeper thematic truth that the specific plot points sometimes obscure—a purposivist might use that. They argue the "spirit" of the law matters more than the "letter." But even here, the bend is severe. In your work, the emerging theme is discovered. In law, the "purpose" is often *imputed* by the judge. The judge says, "The purpose of this act is to protect consumers," even if the text doesn't say that. You would never say, "The purpose of this chapter is to protect consumers," unless you were writing a manual, not a novel.

  ***

  ### Part IV: The Verdict on Authority

  You asked me not to be diplomatic. Here is the plain truth.

  Your vocabulary is missing the concept of **Authority**, not the concept of **Meaning**.

  The dispute between textualism and purposivism is not primarily a disagreement about how to read. It is a disagreement about who is allowed to rule.

  *   **The Textualist Argument is Democratic:** "The legislature writes the law. The judge reads it. If the judge starts fixing the text based on 'purpose,' the judge is writing the law. That violates the separation of powers. I bind myself to the text so I do not steal the legislature's power."
  *   **The Purposivist Argument is Functional:** "The legislature cannot imagine every future case. If I stick to the text when it leads to absurdity, I betray the legislature's actual goal. I need the flexibility to make the law work as they would have wanted."

  When you map this to your trade, the "Separation of Powers" vanishes. You are the author, the editor, and the final arbiter of your text. You do not have a legislature watching over your shoulder, ready to impeach you if you change a word in post-production.

  **The Residue Conclusion:**
  The legal debate uses the language of interpretation (words, intent, context) because that is the only legitimate language judges are allowed to speak. If a judge said, "I am ruling this way because I think it is fair," she would be accused of tyranny. She must say, "I am ruling this way because this is what the text *means*."

  Your vocabulary reveals that "meaning" is often a mask for "choice." In your work, that choice is yours. In law, that choice is power over others. The residue you sense—the bindingness, the coercion, the collective author—is not a defect in your understanding. It is the sound of the machinery of state grinding against the machinery of art.

  You understand the text. You do not understand the gun behind the text. That is why the translation fails.
