prompt: |-
  ok so I help run a meetup — the usual lw/ea crossover crowd, around 15 people, 90 minutes, and every few months I have to come up with something that isn't me re-drawing the importance/tractability/neglectedness triangle on a whiteboard while everyone nods. I want to try something where they walk into the point instead of being told it.

  The point I keep failing to get across is that neglectedness isn't a fact about a cause, it's a fact about how many other people are already piling into it. Which makes the framework kind of self-defeating: hand the same I/T/N rubric to a room full of conscientious grantmakers and they'll all independently converge on the same tractable-and-neglected option, and by converging they un-neglect it, and every one of them was reasoning fine locally. It's a commons problem wearing a spreadsheet.

  So design me a game, ~15 people, 90 min, where the rules produce that without me having to say it. I want: (a) people allocate some budget (points, tokens, whatever — no real money) across a menu of invented causes, (b) enough of them pick the same "obviously most neglected" one that its marginal value visibly craters, and (c) somewhere in there a small-sample thing where the cause that ranks best on its estimated numbers is best partly because its numbers are noisiest, so the top pick is systematically the most over-estimated one. I want at least one person to notice that before the debrief, not after.

  Give me the rules, materials, a payoff scheme, a ~10 min debrief that maps what happened onto I/T/N (and is honest about which of the three the game actually models vs. just fakes), and the stuff that will definately go sideways the first time I run it. If there's room for a beat where someone realizes none of us can actually trace the long-run effects of any of these and we're all just trusting a proxy, put that in too. Don't make it need a projector.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Context:** LW/EA meetup, ~15 people, 90 mins.
      *   **Goal:** Demonstrate the self-defeating nature of the "Neglectedness" factor in ITN (Impact, Tractability, Neglectedness). Specifically, that neglectedness is dynamic (depends on others' actions), leading to a coordination failure/commons problem where everyone converges on the same "optimal" cause, thereby ruining its neglectedness.
      *   **Secondary Goal:** Demonstrate regression to the mean/optimizer's curse (the "best" estimated cause is often the noisiest/overestimated one).
      *   **Constraints:** No projector, physical materials only. At least one participant should notice the flaw *during* the game, not just in the debrief.
      *   **Deliverables:** Rules, Materials, Payoff Scheme, Debrief (~10 mins), Failure Modes.
      *   **Tone:** Intellectual, slightly cynical (matching the user's frustration with the whiteboard triangle), practical.

  2.  **Deconstruct the Core Mechanics:**
      *   *Neglectedness as a dynamic variable:* The value of investing in a cause must decrease as more people invest in it. This suggests a diminishing returns function.
      *   *Optimizer's Curse:* The estimated value of causes needs to have uncertainty. The cause with the highest *estimated* value should likely be an overestimate.
      *   *Coordination Failure:* Players need to make decisions independently (or with limited communication) that lead to a suboptimal collective outcome compared to if they had coordinated.
      *   *No Projector:* Everything must be on paper/handouts/whiteboard.

  3.  **Drafting the Game Concept: "The Grantmaker's Dilemma"**
      *   *Setup:* Players are grantmakers. There are several "Cause Areas."
      *   *Resources:* Each player has a budget of tokens.
      *   *Cause Areas:* Need distinct profiles. Some high estimated value, some low. Some noisy, some certain.
      *   *Scoring:* The payoff for a cause depends on the *total* investment in that cause.
      *   *The Twist:* The "Neglectedness Bonus" disappears as more people fund it.

  4.  **Refining the Mechanics for the "Aha!" Moment:**
      *   To get someone to notice *during* the game, there needs to be a round or a phase where they see the value change.
      *   *Idea:* Two rounds. Round 1 is blind. Round 2 allows some adjustment or reveals the "true" value.
      *   *Better Idea:* A continuous market or a simultaneous reveal. Let's go with Simultaneous Reveal with a visible "Impact Meter."
      *   *Optimizer's Curse Implementation:* Each cause has a "Public Estimate" of impact per dollar. But the *Real* impact is lower, especially for the high-estimate ones. Or, the uncertainty is explicit. Let's make the "Public Estimate" a range or a point estimate with a hidden variance.
      *   *Actually, simpler:* Give them cards with "Estimated Impact" and "Uncertainty Level." The Real Impact = Estimated - (Total Investment * Congestion Factor) + Noise.
      *   *Wait, the prompt asks for the "noisiest" cause to be the top pick.* So, High Estimate = High Noise.
      *   *Let's try this:* 5 Cause Cards. Each has a "Projected Marginal Value" (PMV). Players allocate tokens. Total Tokens in a bucket determine the *Actual* Marginal Value.
      *   *The Kicker:* The PMV is drawn from a distribution. The Actual Value is the PMV minus a congestion penalty. But to capture the Optimizer's Curse, the PMV itself should be an *overestimate* proportional to its variance.
      *   *Simplification for 90 mins:* Don't do complex math live. Pre-calculate the outcomes based on total investment.
      *   *Mechanism:* Players put tokens in envelopes/bowls. Facilitator calculates score.
      *   *To ensure someone notices mid-game:* We need a "Market Update" phase. Round 1: Allocate. Reveal congestion. Round 2: Re-allocate.
      *   *Wait, if they can re-allocate, they might solve the coordination problem.* The point is they *can't* easily coordinate.
      *   *Revised Plan:* One main allocation phase. But provide a "Market Watch" sheet that updates after every 5 tokens placed? No, too slow.
      *   *Best approach for "Notice during game":* Make the congestion effect *visible* on the whiteboard as tokens are placed. If I put a token in Bucket A, I write the current multiplier on the board. If the next person sees the multiplier drop, they might hesitate.
      *   *Let's refine the Optimizer's Curse:* Give each cause a "Confidence Interval." Cause A: 100 points ± 10. Cause B: 150 points ± 50. Rational agents might pick B. But the *realized* value is drawn from that distribution. If we do this once, luck dominates.
      *   *Better:* The "Estimate" is fixed on the card. The "Reality" is fixed by the Facilitator but hidden. The "Reality" is correlated with how many people picked it (congestion) AND the uncertainty (regression to mean).
      *   *Actually, the prompt wants the "noisiest" cause to be the top pick systematically.* This implies the *Estimate* is what drives them, and the Estimate is flawed.
      *   *Let's go with a "Forecast vs. Reality" mechanic.*
      *   *Cause Cards:* Display "Expected Value per Token."
      *   *Hidden Rule:* The EV is an *upper bound*. The Actual Value = EV * (1 / (1 + k*N)), where N is number of tokens.
      *   *Hidden Rule 2 (Optimizer's Curse):* The EVs provided on the cards are sampled from a distribution where high variance causes have higher *sampled* maximums.
      *   *Wait, I can't simulate sampling live.* I need to pre-set the causes.
      *   *Setup:* 5 Causes.
          *   Cause 1: Boring, Low EV, Low Variance, Low Congestion Sensitivity.
          *   Cause 2: Exciting, High EV, High Variance, High Congestion Sensitivity.
          *   ...
      *   *The Trap:* Everyone sees Cause 2 has the highest EV. They pile in. The Congestion Sensitivity crushes the value. Plus, because it was High Variance, the EV was likely an overestimate (Optimizer's Curse).
      *   *How to make someone notice mid-game?* Give them a "Private Information" card that hints at the congestion mechanic or the variance. Or, allow a "Short Selling" or "Prediction" side bet.
      *   *Idea:* Before allocating, ask them to write down: "How many tokens do you think will go into Cause X?" If they realize everyone will think like them, they might spot the convergence.
      *   *Let's add a "Market Price" mechanic.* Tokens are placed in envelopes. Between Round 1 and Round 2, reveal the "Price Drop" for over-subscribed causes.
      *   *Okay, let's settle on a Two-Round Structure.*
          *   Round 1: Blind allocation.
          *   Reveal: Show how value degraded.
          *   Round 2: Re-allocation (with communication allowed? No, keep it limited to simulate global coordination difficulty).
          *   Actually, to highlight the *self-defeating* nature, one round is enough if the payoff is revealed *after* but the *mechanism* is visible.
          *   *Wait, the prompt says "I want at least one person to notice that before the debrief".*
          *   *Solution:* Make the congestion mechanic *public knowledge* in the rules, but the *degree* of congestion hidden. Or make the mechanic public, but the *choices* of others hidden until the end.
          *   *If the mechanic is public:* "Value = Base / (1 + Contributors)." If everyone knows this, they should theoretically spread out (Nash Equilibrium).
          *   *If the mechanic is hidden:* They won't notice until debrief.
          *   *Compromise:* The rules state "Value decreases with participation." But the *Estimates* on the cards are noisy. The "Notice" moment comes from realizing that the Highest Estimate card is the trap *because* everyone else is reading the same card.
          *   *How to trigger the realization?* Give them a "Meta-Game" sheet. "If 5 people pick this, value is X. If 10, value is Y."
          *   *Okay, here's the key:* **The "Common Knowledge" Problem.** Everyone has the same spreadsheet. If the spreadsheet says Cause A is best, everyone picks Cause A.
          *   *Game Flow:*
              1.  Handout: The "EA Spreadsheet" (lists 5 causes with ITN scores).
              2.  Task: Allocate 10 tokens to maximize *your* impact points.
              3.  Rule: Impact Points for a Cause = (Base Score) / (Total Tokens in Cause).
              4.  Twist: The Base Score on the handout is a *noisy estimate*. The *True* Base Score is lower for high-variance causes.
              5.  To ensure mid-game realization: Allow a "Trading Floor" phase where they can move tokens after seeing initial clustering? No, that solves it.
              6.  *Better:* Allow them to talk *before* placing tokens. They will try to coordinate. They will fail (too many people, trust issues).
              7.  *Best for "Notice mid-game":* **The "Marginal Dollar" Board.** As players walk up to place tokens, they must update a whiteboard table. "Cause A: 1 token = 100 pts. 2 tokens = 60 pts each."
              8.  *Wait, if they see the points drop, they won't put the 2nd token in.*
              9.  *Unless...* They are competing for *total* points, not marginal.
              10. *Let's try this:* You get points for the *average* value of your tokens.
              11. *Okay, I have a solid mechanic now.* **The Diminishing Returns Bucket.**
              12. *Mid-game realization trigger:* A "Spy" mechanic. One player gets a sheet showing the *True* values. They can try to signal others. Or, simply, the whiteboard tracking the "Current Marginal Value" will visibly crash, and a sharp player will say "Wait, if we all pick this, it goes to zero."

  5.  **Finalizing the Game Design:**
      *   **Name:** "The Congestion Game" (or "The Neglectedness Trap").
      *   **Materials:** 5 Buckets (envelopes/boxes), Tokens (poker chips/paper), Whiteboard, Handouts (The "Spreadsheet").
      *   **Causes:** 5 distinct options.
          *   Cause A: Safe, Low Return.
          *   Cause B: The "Shiny Object" (High Estimated Return, High Variance, High Congestion Penalty).
          *   Cause C, D, E: Variations.
      *   **Rules:**
          1.  You have 10 tokens.
          2.  Allocate secretly.
          3.  Payoff = (Cause Base Value) / (Total Tokens in Cause). *Wait, this makes the first token valuable and the last worthless.*
          4.  *Correction:* Payoff per token = Base / (1 + Total Tokens). This ensures diminishing returns.
          5.  *Optimizer's Curse:* The "Base Value" on the handout is an *Estimate*. The *Real* Base Value is Estimate * (1 - Variance Penalty). I, as facilitator, know the Real Values.
          6.  *Mid-game notice:* I will update the whiteboard with the *Current Multiplier* as tokens are revealed.
          7.  *Wait, to notice BEFORE debrief:* I need a phase where they see the crowd forming.
          8.  *Idea:* **Open Allocation.** Players come up one by one to place tokens. They see where others have placed.
          9.  *Problem:* This leads to herding, not necessarily realization.
          10. *Solution:* **The "Pre-Mortem" Round.** Before placing tokens, ask them to bet on which cause will be *most crowded*. If they realize "We all think B is best," they might spot the trap.
          11. *Let's go with the "Public Whiteboard" mechanic.* As you place a token, you must write the new marginal value on the board. If the marginal value drops below the "Safe Cause," a smart player will switch.
          12. *But I want them to fail.* I want the tragedy of the commons.
          13. *Okay, the realization should be:* "Wait, we are all reading the same spreadsheet."
          14. *How to force this?* Give them 2 minutes to discuss strategy *before* allocating. They will agree "Let's split up." Then, when allocating secretly, they defect because they can't trust others to split perfectly.
          15. *Actually, the prompt wants the rules to produce the outcome.*
          16. *Okay, final plan:*
              *   **Phase 1:** Review the "Spreadsheet" (Handout). It clearly shows Cause B is best (high EV).
              *   **Phase 2:** Discussion (5 mins). "How do we maximize total group impact?"
              *   **Phase 3:** Secret Allocation.
              *   **Phase 4:** Reveal & Score.
              *   **The "Notice" Moment:** During Phase 2, someone should say "If we all pick B, B is ruined." But then Phase 3 happens anyway.
              *   *To guarantee the notice:* Add a "Market Ticker." Before they allocate, I put up a sign: "Current Expected Value of Cause B: 100. Warning: Value halves for every 3 investors."
              *   *No, that's too explicit.*
              *   *Let's rely on the "Optimizer's Curse" handout.* The handout shows Cause B has a wide confidence interval. A smart EA will know "High variance + High Mean = Overestimate."
              *   *Okay, I will design the Handout to trigger this.* Cause B: "EV: 1000 (90% CI: 100-1900)". Cause A: "EV: 800 (90% CI: 750-850)".
              *   *The Rules:* Payoff is based on the *Realized* Value (which I hold in a sealed envelope). Realized Value is closer to the lower bound for high variance.
              *   *Mid-game trigger:* I will ask for a show of hands: "Who thinks Cause B is the rational choice?" When 12 hands go up, someone will laugh/nervous chuckle. That's the moment. I will pause and ask "Why did you raise your hand?"

  6.  **Developing the Payoff & Math:**
      *   Need to ensure the math works out so Cause B *looks* best but *performs* worst when crowded.
      *   Cause B (The Trap): Handout EV = 100. Congestion Factor = 0.5 per person. Real Base = 80 (Optimizer's curse).
      *   Cause A (The Boring Truth): Handout EV = 60. Congestion Factor = 0.9 per person. Real Base = 58.
      *   If 10 people pick B: Value = 80 / (1 + 10*0.5) = 80/6 = 13.
      *   If 2 people pick A: Value = 58 / (1 + 2*0.9) = 58/2.8 = 20.
      *   This works.

  7.  **Addressing the "Long-run effects/Proxy" beat:**
      *   Add a rule: "Your tokens fund a proxy metric (e.g., papers published). The *Real Impact* is determined by a die roll at the end."
      *   This adds the "we don't know the true utility function" layer.

  8.  **Structuring the Debrief:**
      *   Map the game mechanics to ITN.
      *   Neglectedness = The Congestion Factor.
      *   Tractability = The Base Value.
      *   Importance = The Multiplier.
      *   Honesty: The game fakes "Importance" (it's fixed), but models "Neglectedness" dynamically.
      *   Discuss the Optimizer's Curse (Variance).
      *   Discuss the Coordination Failure.

  9.  **Failure Modes:**
      *   People coordinate too well (talkative group).
      *   People treat it as a competition rather than cooperative impact.
      *   Math confusion.
      *   Cynicism ("This is rigged").

  10. **Refining the "Notice Before Debrief" Requirement:**
      *   I need a specific mechanic that forces the realization.
      *   *Idea:* **The "Insider" Card.** Give one random player a card that says "You know the True Values. Cause B is actually worth 50% of the handout." They can't show the card, only talk.
      *   *Will they speak up?* Maybe.
      *   *Better:* **The "Crowd Counter".** On the whiteboard, draw 5 columns. As people decide, they put a sticky note in the column *before* locking it in. They can move the sticky note.
      *   *Wait, if they can move it, they will optimize.*
      *   *Okay, the "Show of Hands" moment is the most reliable.* "Who is picking Cause B?" When everyone raises their hand, the room *feels* the paradox. I will instruct the facilitator to freeze the room at that exact moment and ask "What just happened?" *Then* let them lock in choices. This counts as "before the debrief."

  11. **Final Polish:**
      *   Make materials list concrete.
      *   Write the script for the facilitator.
      *   Ensure the math is robust.
      *   Check timing (90 mins).

      *(Self-Correction during drafting)*: 90 minutes is tight for a game + debrief. Keep the game to 45 mins, debrief 30, buffer 15.
      *   Make sure the "Optimizer's Curse" is explicit in the handout data (Confidence Intervals).
      *   Make sure the "Neglectedness" mechanic is the *only* thing that changes based on group action.

      *Wait, one more thing:* The prompt asks for "a small-sample thing where the cause that ranks best on its estimated numbers is best partly because its numbers are noisiest."
      *   I need to ensure the Handout reflects this. Cause B has the widest CI. The "Point Estimate" is the mean, but the *Realized* value is drawn from the distribution. Since we only play once, the realization will likely be an outlier if I rig it, OR I explain that the Point Estimate *is* the overestimate due to selection bias.
      *   *Simpler:* The Handout shows "Upper Bound" estimates, not means. Or I just state in the debrief that "In a world of many causes, the one with the highest estimate is likely the noisiest."
      *   *To make it visible in-game:* I will pre-set the "Realized Values" in sealed envelopes. Cause B's envelope contains a value significantly lower than its estimate. Cause A's envelope matches its estimate. When opened, the discrepancy is visible.

      *Let's finalize the "Notice" moment.*
      *   I'll add a "Pre-Commitment Poll."
      *   Step 1: Read handout.
      *   Step 2: Private vote on "Which cause has the highest EV?" (Write on paper).
      *   Step 3: Reveal votes. (Everyone wrote B).
      *   Step 4: Facilitator asks: "If everyone funds B, what happens to B's neglectedness?"
      *   Step 5: *Pause.* Let them sweat.
      *   Step 6: "You may now allocate." (They will still mostly pick B, but the realization happened in Step 5).

      *Okay, ready to write.*
answer: |-
  Here is a complete game design for your meetup. It is built to be run with zero tech, minimal prep, and maximum friction.

  # Game Title: The Congestion Market

  **Time:** 90 Minutes total (45 min Game, 30 min Debrief, 15 min Buffer)
  **Players:** 12–18 (Ideal: 15)
  **Materials:**
  *   5 Envelopes or Boxes (labeled Cause A–E), placed at the front.
  *   ~200 Poker Chips or colored tokens (20 per person).
  *   Whiteboard + Markers.
  *   **Handout 1:** "The Spreadsheet" (1 per person).
  *   **Handout 2:** "Allocation Sheet" (1 per person).
  *   **Sealed Envelopes:** 5 small envelopes, one for each Cause, containing the "True Value" card (Facilitator only).

  ---

  ## Part 1: The Setup (10 mins)

  **The Narrative:**
  "You are all grantmakers at the same foundation. You have identical mandates: maximize expected utility. You have access to the same research (The Spreadsheet). You cannot communicate during the allocation phase. You are competing for *impact points*, not against each other, but against the universe."

  **The Handout ("The Spreadsheet"):**
  Create a simple table. Crucially, include **Confidence Intervals** and a **Neglectedness Sensitivity Rating**.

  | Cause | Est. Value / Token | 90% Confidence Interval | Neglect Sensitivity (0–5) | Description |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | 50 pts | [45 – 55] | 1 (Low) | Boring infrastructure. Stable. |
  | **B** | **100 pts** | **[10 – 190]** | **5 (High)** | **High-risk moonshot. Viral potential.** |
  | **C** | 60 pts | [50 – 70] | 3 (Med) | Policy reform. |
  | **D** | 40 pts | [35 – 45] | 2 (Low) | Direct aid. |
  | **E** | 70 pts | [30 – 110] | 4 (High) | Emerging tech. |

  *Design Note:* Cause B is the trap. It has the highest Point Estimate, but the widest Variance (Optimizer's Curse bait) and the highest Sensitivity (Neglectedness trap).

  **The Rules:**
  1.  **Budget:** Each player gets 20 tokens.
  2.  **Allocation:** Distribute your tokens among the 5 Cause Envelopes however you like. You can put all 20 in one, or split them.
  3.  **Secrecy:** Do not show your Allocation Sheet to anyone. Walk to the front and drop tokens in the envelopes silently.
  4.  **Scoring:**
      *   Each Cause has a **True Base Value** (hidden in the Facilitator's sealed envelopes).
      *   **Actual Payoff per Token** = (True Base Value) / (1 + Total Tokens in Cause).
      *   *Example:* If Cause B has a True Base of 100, and the group puts 20 tokens in total, each token is worth 100 / (1+20) = 4.7 points.
      *   If only 1 token is put in, it's worth 100 / 2 = 50 points.
  5.  **The Twist:** The "Est. Value" on your handout is *not* the True Base Value. It is a noisy estimate.

  ---

  ## Part 2: The Trap (20 mins)

  **Step 1: Private Analysis (5 mins)**
  Let them read the handout. Cause B looks mathematically dominant (100 pts vs 50 pts). The variance is high, but EAs are usually risk-neutral on points.

  **Step 2: The Pre-Mortem Poll (Crucial "Aha!" Moment) (5 mins)**
  Before they move, ask them to take a sticky note and write down: **"Which Cause will receive the most tokens from this room?"**
  Collect the notes. Stick them on the whiteboard in columns A–E.

  *   **Expected Outcome:** Almost every note will be in Column B.
  *   **Facilitator Action:** Point to the column. "Look at this. You all know Cause B is the highest value. You all know everyone else has this same handout. You all just predicted everyone will pile into B."
  *   **The Pause:** Wait 10 seconds. Let the tension sit. Someone *will* say, "So... B is going to be worthless."
  *   **The Instruction:** "You may now allocate. Good luck." (Do not let them re-coordinate. The friction is the point.)

  **Step 3: Allocation (10 mins)**
  Players walk up and drop tokens.
  *   **Visuals:** As they drop tokens, you (Facilitator) keep a running tally on the whiteboard under each Cause column.
  *   **The Squeeze:** As the tally for Cause B climbs (5... 10... 20...), the *marginal value* is visibly crashing. If you want to be cruel, write the *Current Marginal Value* next to the tally.
      *   *Tally 1:* Value ~50
      *   *Tally 10:* Value ~9
      *   *Tally 20:* Value ~4.7
  *   Watch the faces of the last few people as they see Cause B's value crater below Cause A's stable 50. Some might switch last minute. Most won't (sunk cost/herding).

  ---

  ## Part 3: The Reveal (15 mins)

  **Step 1: Open the True Values**
  Open the 5 sealed envelopes. Read the **True Base Values**.
  *   **Cause A:** 50 (Matches Estimate)
  *   **Cause B:** 40 (Significantly lower than Estimate — *Optimizer's Curse*)
  *   **Cause C:** 55
  *   **Cause D:** 40
  *   **Cause E:** 50

  **Step 2: Calculate Scores**
  Do the math on the whiteboard.
  *   **Cause B:** True Base (40) / (1 + Total Tokens).
      *   If 15 people put ~10 tokens each = 150 tokens.
      *   Payoff = 40 / 151 = **0.26 points per token.**
  *   **Cause A:** True Base (50) / (1 + Total Tokens).
      *   If 3 people put ~5 tokens each = 15 tokens.
      *   Payoff = 50 / 16 = **3.1 points per token.**

  **Step 3: Declare Winners**
  Ask for a show of hands: "Who has more than 50 total points?" (Likely only the few who defected to A or C).
  "Who put most of their budget into B?" (Most hands). "You likely have fewer than 10 points."

  ---

  ## Part 4: The Debrief (30 mins)

  Do not lecture. Ask questions. Map their frustration to the framework.

  **1. The Neglectedness Trap (10 mins)**
  *   **Ask:** "At the sticky-note moment, you knew B would be crowded. Why did you fund it anyway?"
  *   **Likely Answers:** "Hope others would switch," "Didn't want to be the only one not funding the best cause," "Thought I could get in early."
  *   **The Point:** Neglectedness isn't a property of the cause (like 'malaria exists'). It's a property of the *market* (how many other grantmakers are here).
  *   **The Framework:** When you use ITN as a static spreadsheet, you assume 'N' is fixed. In reality, 'N' is a function of 'I' and 'T'. High Impact attracts people, which reduces Neglectedness, which reduces Impact. It's a feedback loop the spreadsheet hides.
  *   **The Commons:** This was a Tragedy of the Commons. Locally rational decisions (fund the highest EV) led to globally suboptimal outcomes (value destroyed by congestion).

  **2. The Optimizer's Curse (10 mins)**
  *   **Ask:** "Look at Cause B's True Value (40) vs Estimate (100). Why the discrepancy?"
  *   **The Point:** I rigged it, but in the real world, this happens naturally. If you have 5 causes with uncertain estimates, the one with the *highest estimate* is statistically likely to be the one where the noise was positive.
  *   **The Framework:** Tractability/Impact estimates are noisy. If you select the maximum of 5 noisy estimates, you are selecting the maximum error. Cause B looked best partly because it was noisiest (look at those Confidence Intervals on the handout).
  *   **Takeaway:** You need to discount high-variance estimates more than the spreadsheet tells you.

  **3. The Proxy Problem (5 mins)**
  *   **Ask:** "You optimized for 'Points'. What if 'Points' was 'Papers Published' and real impact was 'Lives Saved'?"
  *   **The Point:** In the game, I defined the utility function. In reality, we are optimizing for proxies (policy changes, dollars moved, QALYs estimated).
  *   **The Beat:** "None of you can actually trace the long-run effects of these tokens. You trusted the Handout. In the real world, the Handout is a blog post from 2019."

  **4. Honesty Check (5 mins)**
  *   **What the game modeled:** Dynamic Neglectedness (congestion), Optimizer's Curse (variance penalty), Coordination Failure.
  *   **What the game faked:** Real Impact is usually not *this* sensitive to congestion (some causes scale), and you usually don't have perfect information about others' allocations.
  *   **The Real Lesson:** ITN is not a calculator. It's a heuristic that breaks when everyone uses it the same way. The solution isn't better math; it's better coordination or randomization.

  ---

  ## Things That Will Go Sideways (And How to Fix Them)

  **1. The "Let's Just Split Up" Rebellion**
  *   **Risk:** During the 5-minute discussion phase, someone charismatic says "Okay, 3 people take A, 3 take B..." and they actually do it.
  *   **Fix:** The rules say "Secret Allocation." If they coordinate openly, call it out: "In the real world, you don't know what the other foundations are doing. You can't call them on the phone. For this round, no talking during allocation."
  *   **Better Fix:** If they *do* coordinate successfully, use it in the debrief. "You solved the coordination problem by talking. How do we do that globally with strangers? We can't. That's why the default mode fails."

  **2. Math Confusion**
  *   **Risk:** People zone out during the scoring calculation.
  *   **Fix:** Pre-calculate the "Break-even points" on the whiteboard. "If 10 tokens are in B, each is worth X." Update this live as tokens drop in. Keep the arithmetic simple (integers).

  **3. Cynicism ("The Facilitator Rigged It")**
  *   **Risk:** They feel tricked by the True Value reveal.
  *   **Fix:** Own it. "Yes, I rigged the True Values to demonstrate the Optimizer's Curse. In reality, the universe rigs it for you via regression to the mean. The lesson isn't that I lied; it's that your uncertainty intervals were too narrow."

  **4. The "One Genius" who Picks A**
  *   **Risk:** One person spots the trap, puts everything in A, wins big, and feels smug.
  *   **Fix:** Highlight them in the debrief. "This person realized N was dynamic. Why didn't the rest of you? Was it social pressure? Belief in the Spreadsheet?" This validates the insight without ruining the game.

  ## Facilitator Script for the "Aha!" Moment

  *When the sticky notes are on the board and everyone sees the pile on Cause B:*

  **You:** "Look at Column B. Every single one of you, acting rationally, has identified B as the optimal choice. And every single one of you knows that if everyone chooses B, B becomes worthless."
  **You:** "In about 30 seconds, you are going to walk up here and fund B anyway. Why?"
  *(Let them sit in the silence. Let someone say "Because I hope others won't.")*
  **You:** "Exactly. You are betting on other people's irrationality to save your rationality. That is the state of the EA ecosystem right now."
  **You:** "Go."
