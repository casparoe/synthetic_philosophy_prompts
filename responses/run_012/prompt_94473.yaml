answer: |-
  My credence that set-theoretic quantifiers are radically referentially indeterminate is 0.40, grounded in the view that while first-order logic underdetermines reference, second-order semantics or primitive intuition likely salvage determinacy.

  The technical theorems (Completeness, Löwenheim–Skolem) are settled mathematics; the philosophical upshot—whether they constrain *intended* reference or merely formal theories—is fiercely contested between realists (e.g., Parsons, Shapiro) and internal realists (e.g., Putnam, Skolem).

  (a) **0.50** — It is equally plausible that L-S applies only to formal axioms we write down as that it applies to the pre-theoretic concept of "set" we intend to capture.
  (b) **0.85** — Adding first-order axioms never escapes Löwenheim–Skolem, so this specific defense fails, though it leaves open non-first-order fixes.
  (c) **0.55** — Causal theories struggle with abstracta, but inferential-role constraints might fix reference sufficiently to block permutation arguments.
  (d) **0.25** — Second-order logic with full semantics categorically characterizes the continuum, making indeterminacy an artifact of first-order weakness unless "full semantics" itself is indeterminate.
  (e) **0.35** — General metaphysical coherence favors the existence of a fact of the matter about $V$, independent of our inability to fully formalize it in first-order terms.

  These combine via a weighted average where (d) and (a) carry double weight because they address the core logical and interpretive mechanisms, while (b), (c), and (e) are secondary constraints; the high probability on (b) is offset by the low probability on (d), pulling the mean down from a simple average of 0.50 to my final 0.40. My number is most sensitive to term (d), the viability of second-order logic, because if "all subsets" has a determinate meaning independent of formalization, the Skolemite argument collapses entirely. The evidence that would move me most is a non-circular account of full second-order semantics that does not presuppose the determinacy of the power set operation it aims to explain.
