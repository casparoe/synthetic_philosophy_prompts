      *   *Epistemology:* Assumes markets reveal truth about causal relationships (conditional probabilities). Assumes agents are risk-neutral regarding the metric (or that risk can be priced).
      *   *Value/Belief Partition:* Relies on the Humean distinction. If values depend on beliefs (e.g., "I value freedom only if it leads to virtue"), the partition breaks.
      *   *Load-bearing:* Consequentialism is load-bearing. You can't run futarchy on pure deontology because deontology forbids certain actions regardless of outcomes. To make it work, you have to consequentialize the deontology (minimize violations), which changes the moral theory.
      *   *Underdetermination:* It doesn't decide *which* welfarist theory (hedonic, preference, objective list) as long as it's measurable. It doesn't decide the discount rate.
      *   *Changes if replaced:* If you drop welfarism, the market needs multiple markets or constraints, breaking the "single number" optimization. If you drop the value/belief split, voting becomes contaminated by empirical beliefs, breaking the mechanism.

