      *   **Specific Questions to Address:**
          *   What theory of welfare does it commit to?
          *   Is the value/belief partition available?
          *   Are welfarism/consequentialism load-bearing or convenient?
          *   Could deontological/value-pluralist electorates use it?
          *   Where is it philosophically underdetermined?
