  2.  **Deconstruct Futarchy's Philosophical Commitments:**
      *   *Core Mechanism:* Vote on values (utility function), Market on beliefs (conditional predictions).
      *   *Value Theory:* Requires a single, quantifiable metric (utility). This implies **welfarism** (welfare is the sole good) and **consequentialism** (outcomes determine rightness). It also implies **commensurability** (all values can be reduced to one number).
      *   *Epistemology:* Relies on **epistemic consequentialism** (markets aggregate information better than other methods) and **decision theory** (maximize expected utility). It assumes beliefs can be separated from values (Humean guillotine).
      *   *Load-bearing vs. Convenient:* The single metric is load-bearing for the market mechanism. Welfarism is load-bearing because non-welfarist values (rights, duties) don't map easily to a continuous numeric outcome variable without distortion.
      *   *Underdetermination:* It doesn't specify *whose* welfare (utilitarian vs. prioritarian vs. egalitarian) as long as it's aggregable. It doesn't specify the time horizon.
      *   *Alternative Electorates:* A deontological electorate could vote for a metric like "rights violations per capita," but this turns deontology into consequentialism about rights violations, fundamentally altering the moral theory (becoming threshold deontology or consequentialism).

  3.  **Drafting the Bottom Line:**
      *   *Idea:* Futarchy fundamentally presupposes a consequentialist welfarism that treats values as commensurable utilities and beliefs as separable probabilities, making the value/belief distinction load-bearing rather than merely convenient.
      *   *Refinement:* Futarchy is philosophically committed to a consequentialist welfarism that treats values as commensurable utilities and beliefs as separable probabilities, meaning the partition between values and beliefs is load-bearing and incompatible with non-consequentialist moral frameworks without distorting them.

  4.  **Drafting the Reasoning:**
