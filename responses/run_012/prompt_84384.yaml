  *(Self-Correction on Point 1)*: Wait, if utility is bounded by $U_{max}$, then $E[U] \le p \cdot U_{max}$. If $p$ is sufficiently small, $p \cdot U_{max} < Cost$. So mathematically, a bound *does* prevent mugging *if* $p$ is small enough relative to the bound. The issue is whether the bound is *plausibly* low enough. I need to make sure the student sees that the *height* of the bound is the critical variable, not just the existence of a bound.

  *(Self-Correction on Point 4)*: The student says "non-continuous preferences... I suspect it only relocates the difficulty." I should encourage them to explore *why* it relocates the difficulty. (e.g., lexicographic preferences lead to paralysis or extreme rigidity).

  *(Self-Correction on Point 5)*: The "St. Petersburg" case involves *infinite* expectation. Mugging involves *finite* but huge. Bounded utility solves St. Petersburg easily (converges). It solves Mugging only if the bound is low. This distinction is crucial.

