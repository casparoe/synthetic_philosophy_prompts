  (b) **0.30** — Halpern-Pearl style repairs handle preemption by restricting contingencies, but the restriction rules often encode the causal structure they aim to derive.
  (c) **0.30** — Pluralist arguments (e.g., Hall 2004) suggest token causation conflates 'dependence' and 'production,' which diverge extensionally in switching cases.
  (d) **0.50** — Experimental philosophy shows causal attributions shift with normative expectations, making the 'target extension' a moving variable rather than a fixed fact.
  (e) **0.20** — Interventionism cannot handle non-manipulable causes (e.g., mass, gender) without stretching 'intervention' to meaninglessness, whereas counterfactuals handle them naturally.

  **Synthesis:**
  These combine multiplicatively rather than additively; if any single sub-question fails (especially c or e), the claim of strict extensional equivalence collapses, driving the aggregate probability down despite uncertainty on judgment stability.

  **The Toy Case Analysis:**
  This is a classic "switching" case. It should move your credence **down by ~0.10**. It demonstrates that engineer intuitions track *physical process* (production), while both frameworks track *dependence* (which is absent here). This case specifically targets sub-question **(c)**: it suggests there is no single "token causation" relation for the two frameworks to agree on, because the practitioners are answering different questions (responsibility vs. mechanism). The fact that both frameworks require "bolted-on" path-specific machinery to match the engineer confirms they do not naturally pick out that extension.

  **Sensitivity:**
