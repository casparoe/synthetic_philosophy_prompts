answer: |-
  First, take a deep breath. Your reading group isn't incompetent; you have stumbled into the central fault line of modern formal semantics. The fact that you are "re-litigating the same examples" is not a bug in your process; it is a feature of the literature. The data *underdetermines* the theory here, and the theories *overdetermine* the data.

  You asked me to put on the hat of a philosopher of language. So, I will skip the bibliography (you know Stalnaker, Lewis, Kratzer, Gibbard, Iatridou) and go straight to the structural diagnosis.

  ### 1. Verdict on Your Hypothesis
  **Your hypothesis is not wrong, but it is incomplete.**

  You diagnose the disagreement as meta-theoretical: *What is semantics for?* (Truth conditions vs. Assertability conditions) and *Does use mirror meaning?* (Semantics vs. Pragmatics). This is accurate, but it misses a crucial third dimension: **Modal Metaphysics.**

  The "Two Ifs" camp often implicitly holds that there is a real, metaphysical distinction between *epistemic possibility* (what we know) and *metaphysical/circumstantial possibility* (how the world could have been). If you believe these are distinct modal flavors, you are naturally pushed toward two different conditional logics.

  The "One If" camp (largely following Angelika Kratzer's restrictor theory) tends to treat all modality as quantification over worlds constrained by a "conversational background." For them, the difference between indicative and counterfactual is just a difference in which worlds are selected (epistemic base vs. circumstantial base + historical alternatives), not a difference in the conditional operator itself.

  **The Diagnosis:** Your group is stuck because you are fighting a three-front war without realizing it.
  1.  **Methodology:** Truth-conditions vs. Acceptability (Gibbard/Adams vs. Stalnaker).
  2.  **Interface:** Semantics vs. Pragmatics (The biconditional issue).
  3.  **Metaphysics:** Epistemic vs. Metaphysical Modality (The "Two Ifs" motivation).

  Until you disentangle these, you will talk past each other.

  ### 2. Diagnosing the Two Sticking Points

  #### The "Flip" (Context Sensitivity vs. Ambiguity)
  *The Problem:* "If Oswald didn't kill Kennedy, someone else did" (Indicative, likely true) vs. "If Oswald hadn't killed Kennedy, someone else would have" (Counterfactual, likely false). But sometimes the same form flips based on what the speaker takes for granted.
  *The Diagnosis:* This is not ambiguity; it is **Modal Base Selection.**
  In the Kratzerian framework, 'if' clauses restrict a modal. The "flip" happens because the *modal base* (the set of worlds we are quantifying over) shifts based on the Common Ground.
  *   **Camp 1 (Ambiguity)** says the shift is too radical for one operator to handle.
  *   **Camp 2 (Univocal)** says the operator is stable; the *input* (the modal base) changes.
  *   **Camp 3 (Morphology)** says the past-tense marking (X-marking) is a grammatical signal telling the listener *which* modal base to pick (remoteness from reality vs. time).

  **Why you're stuck:** You are treating the "Flip" as evidence for lexical ambiguity. It isn't. It is evidence for **context-sensitivity.** Almost no one in modern semantics thinks 'if' is lexically ambiguous in the way "bank" (river/finance) is. The fight is whether that context-sensitivity is handled by the semantics (indexicals) or the pragmatics (modulating the modal base).
  *Progress Move:* Stop asking if the word is ambiguous. Ask: *What grammatical feature triggers the shift in modal base?* (Hint: Look at the "fake past tense" literature, specifically Iatridou).

  #### The "Biconditional" (Conditional Perfection)
  *The Problem:* "If you mow, I'll pay" implies "If you don't, I won't."
  *The Diagnosis:* This is **Conditional Perfection**, and it is overwhelmingly agreed to be a pragmatic phenomenon (Gricean/Hornian).
  If half your group thinks the semantics *must* predict this, they are holding onto a pre-1970s view of semantics. A semantic theory should predict the truth conditions of "If P, Q." It should *not* predict the invited inference "If not-P, not-Q." That inference is cancellable ("If you mow, I'll pay, but I might pay you anyway if you don't").
  *Why you're stuck:* You have a **Demarcation Dispute.** One side thinks semantics must explain *why speakers say what they mean* (including implicatures). The other side thinks semantics explains *what is said* (truth-conditional content).
  *Progress Move:* Force the "Semantics Must Predict This" camp to handle embedding. "It is not the case that if you mow, I'll pay." Does the biconditional inference survive negation? (It doesn't). If it doesn't survive embedding, it's not semantics. Case closed.

  ### 3. Is There a Path to Progress?

  You asked if there is a distinction nobody has drawn or a formal result that could settle this. There is no "silver bullet," but there are **adjudication tests** that break the stalemate.

  **A. The Embedding Test (The "Real" Semantics)**
  Simple assertions ("If P, Q") are terrible data because they are contaminated by pragmatics (assertability, implicature).
  *   *The Test:* Embed the conditionals under negation, disjunction, or attitude verbs.
  *   *Example:* "I doubt that if it had rained, the match would have been cancelled." vs "I doubt that if it rained, the match was cancelled."
  *   *Why:* Pragmatic effects (like the biconditional inference) usually vanish or change under embedding. Semantic differences persist. If the indicative/counterfactual distinction disappears under embedding, it's pragmatics. If it stays, it's semantics.

  **B. The "Gibbardian" Constraint**
  *   *The Test:* Can the indicative conditional be true or false?
  *   *The Issue:* Allan Gibbard proved a famous result: If indicatives have truth conditions and acceptability tracks conditional probability (Adams' Thesis), you get a contradiction.
  *   *The Fork:*
      1.  **Indicatives have no truth conditions** (they are assertions of conditional belief). This pushes you toward a non-propositional semantics.
      2.  **Indicatives have truth conditions** (Stalnaker), but Adams' Thesis is only an approximation.
  *   *Progress:* Ask your group: *Do you think "If P, Q" can be false?* If Camp A says "No, it's just inappropriate to assert" and Camp B says "Yes, it's false," you have found your real disagreement. It's not about 'if'; it's about whether conditionals express propositions.

  **C. X-Marking (The Morphological Solution)**
  *   *The Distinction:* Stop calling them "Indicative" and "Counterfactual." Call them **Zero-Marked** and **X-Marked**.
  *   *The Theory:* (Developed by Iatridou and others). The "past tense" in counterfactuals is not temporal. It is a feature [COIN] (coincidence) or remoteness. It signals that the antecedent does *not* coincide with the speaker's beliefs or reality.
  *   *Progress:* This dissolves the "One vs. Two Ifs" fight. There is one 'if', but the *tense morphology* contributes the counterfactual meaning, not the 'if'. This satisfies Camp 3 and largely satisfies Camp 2, leaving Camp 1 to explain why the logic of inference seems different.

  ### 4. Should You Change the Question?

  If your group cannot agree on whether pragmatics counts as "data" for semantics, you cannot do formal semantics together. You are playing different games.

  **My Recommendation:**
  1.  **Bracket the Biconditional.** Agree to treat Conditional Perfection as pragmatics. If anyone refuses, they need to read Horn or Geis & Zwicky. This removes 50% of the noise.
  2.  **Adopt the Restrictor Framework as a Baseline.** Assume Kratzer's view (If-clauses restrict modals) as the null hypothesis. It is the current consensus for a reason. Now, argue *against* it. It is easier to find flaws in a specific model than to argue from a vacuum.
  3.  **Focus on "Indicative Counterfactuals."** Look for cases where the morphology is indicative but the meaning is counterfactual (e.g., Anderson cases: "If Jones had taken arsenic, he would show symptoms" vs "If Jones took arsenic, he shows symptoms").
  4.  **Accept the "Two-Dimensional" Compromise.** Many philosophers now accept that conditionals have two roles: they update the common ground (pragmatics/epistemic) and they track worldly facts (semantics/metaphysical). The "distinction" isn't in the word 'if', but in the *dimension of evaluation*.

  ### Summary Diagnosis
  Your hypothesis is correct that the fight is meta-theoretical, but specifically, it is a fight about **Modal Metaphysics** disguised as a fight about **Lexical Ambiguity**.

  *   **Camp 1** thinks the logic of connection differs (Epistemic vs. Metaphysical).
  *   **Camp 2** thinks the logic is the same, but the *domain* differs.
  *   **Camp 3** thinks the *morphology* signals the domain.

  **To move forward:** Stop analyzing simple assertions. Move to embedding. Stop fighting about the biconditional (it's pragmatics). And ask the hard question: *Do indicative conditionals have truth conditions?* If you can answer that, the rest of the puzzle often falls into place.

  If you can't agree on that, disband the group and start a reading group on *Modality*. You're trying to build the roof before you've poured the foundation.
