          3.  Discuss the theorem's scope/limits based on this episode.
          4.  Be specific about: Agent, Information, Utility.
      *   **Language:** American English.

  2.  **Understand Good's Theorem (I.J. Good, 1967):**

      *   *Premise:* An agent has a set of possible actions and a set of states of the world. They have a prior probability distribution over states and a utility function over (state, action) pairs.
      *   *Mechanism:* The agent can observe an experiment (information) that updates their posterior probabilities. They then choose the optimal action based on the posterior.
      *   *Conclusion:* The expected utility of choosing an action *after* seeing the information is always greater than or equal to the expected utility of choosing an action *before* seeing the information (assuming the information is free).
      *   *Key nuance:* It's about *expected* value *ex ante*. Specific outcomes can be unpleasant (bad news), but having the knowledge allows for better decision-making.

  3.  **Map the Concepts to the Replication Crisis:**

      *   **The Agent:**
          *   *Option A:* Individual Researcher.
          *   *Option B:* The Scientific Community (as a collective agent).
          *   *Decision:* Need to address both, as the prompt asks for individual *and* field-level implications, and the "break" involves the community aspect.
      *   **The Information:**
          *   Results of replication studies (successful or failed).
          *   Null results.
          *   Pre-registration data (constraints on flexibility).
      *   **The Utility:**
          *   *Ideal:* Truth, accurate models of human behavior, effective interventions.
          *   *Real:* Career advancement, publications, grants, prestige, tenure.

  4.  **Drafting Section 1: Normative Implications (How they *should* have acted):**

      *   *If* the goal is truth/accuracy (scientific utility), *and* replications are free (or low cost), Good's theorem says seek them out.
      *   *Individual Researcher:* Should welcome attempts to replicate their work. Even a failed replication updates the posterior, preventing future wasted effort on false leads. It minimizes the risk of building theory on sand.
      *   *The Field:* Should value null results. Publishing a null result provides information that prevents others from pursuing a dead end. Suppressing null results (file drawer problem) artificially inflates expected utility by hiding disconfirming evidence, violating the Bayesian update process.
      *   *Pre-registration:* This reduces the "degrees of freedom" (p-hacking). It makes the information signal cleaner. Good's theorem values *informative* information. Noisy information (p-hacked results) has lower VOI.

  5.  **Drafting Section 2: Where the Mapping Breaks (The "Real World" Constraints):**

      *   *Break 1: The Agent Definition (Community vs. Individual).*
          *   Good's theorem applies to a *single* coherent agent. Science is a multi-agent system with competing utilities.
          *   What is good for the community (truth) might be bad for the individual (career suicide if your famous finding is debunked).
          *   The "Community" doesn't have a single utility function or prior.
      *   *Break 2: Costly Information.*
          *   Good's theorem assumes *free* information. Replications are expensive (time, money, opportunity cost).
          *   If Cost > Expected Value of Information, a rational agent *should not* seek the information.
          *   In the crisis, replications were often underfunded or seen as "unsexy," implying the perceived cost (career-wise) outweighed the perceived benefit.
      *   *Break 3: Utility Function Mismatch.*
          *   Ideal Utility: Epistemic accuracy.
          *   Actual Utility: Publications, citations, tenure, grants.
          *   Negative results often have low publication value (journals prefer novelty). Therefore, the *career* utility of a replication (especially a failed one) can be negative.
          *   This creates a divergence: Epistemically rational (do the replication) vs. Economically rational (don't do the replication).
      *   *Break 4: Belief-Dependent Utility.*
          *   Researchers often derive utility from *holding* certain beliefs (e.g., "My theory is correct").
          *   Good's theorem assumes utility depends on states/actions, not the belief itself. If utility drops when belief in a favorite theory drops, information that challenges that theory has negative subjective value, violating the theorem's assumptions.

  6.  **Drafting Section 3: Scope and Limits of the Theorem:**

      *   The episode shows Good's theorem is a normative benchmark for *epistemic* rationality, not *economic* or *sociological* rationality.
      *   It highlights that scientific institutions must align individual incentives with collective epistemic goals for the theorem to hold in practice.
      *   It shows the danger of treating science as a single agent.

