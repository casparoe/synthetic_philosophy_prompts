          4.  Conclusion (Scope and Limits).

      *(Self-Correction on "Free Information"):* Make sure to explicitly state that Good's theorem requires information to be costless for the non-negative value guarantee. If information costs money/effort, VOI can be negative net of cost. This is crucial for the replication crisis context.

      *(Refining the "Agent"):* Distinguish between the researcher as a truth-seeker vs. the researcher as a careerist.

