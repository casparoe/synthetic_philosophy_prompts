answer: |-
  ### Good's Theorem and the Replication Crisis: A Normative and Descriptive Analysis

  I.J. Good's theorem on the value of information (VOI) posits that for a rational Bayesian agent, the expected utility of making a decision after observing new evidence is always greater than or equal to the expected utility of making that decision without the evidence, provided the information is free. Crucially, this is an *ex ante* claim about expectations; *ex post*, the information may deliver "bad news" that forces a change in plans, but having that knowledge prevents the agent from acting on false premises.

  Applying this theorem to the replication crisis in social psychology requires specifying the **agent**, the **information**, and the **utility function**.
  *   **The Agent:** Ideally, the individual researcher or the scientific community acting as a collective epistemic entity.
  *   **The Information:** The results of replication studies (both successful and failed) and null results.
  *   **The Utility:** Epistemic accuracy (truthful models of human behavior) versus professional advancement (publications, tenure, grants).

  #### Normative Implications: How the Field *Should* Have Acted

  If we assume the primary utility of science is epistemic accuracy and treat the researcher as a truth-seeking Bayesian agent, Good's theorem provides a stark normative prescription for how the replication crisis should have been handled.

  **1. The Value of Negative Results**
  Under Good's theorem, a failed replication is not a loss; it is a valuable update to the posterior probability of a theory's validity. If a finding is false, continuing to build theory or interventions upon it incurs high future costs. Therefore, an individual researcher *should* welcome attempts to replicate their work. Even if the replication fails (bad news), the researcher is better off knowing this *ex ante* than wasting further resources on a dead end. Similarly, the field *should* treat null results as high-value information. Suppressing them (the "file drawer problem") deprives the community of data necessary to update priors, leading to inflated confidence in false effects.

  **2. Pre-registration and Adversarial Collaboration**
  Good's theorem values information proportionally to its ability to discriminate between states of the world. "Noisy" information (e.g., results obtained via *p*-hacking or flexible analysis) has low VOI because it does not reliably update beliefs. Pre-registration reduces noise by committing to an analysis plan before data collection, thereby increasing the informational value of the resulting data. Adversarial collaboration, where competing theorists agree on a method to test rival hypotheses, maximizes VOI by ensuring the information gained resolves a specific disagreement. Normatively, the field should have prioritized these methods earlier to ensure the information entering the public record was worth the cost of attention.

  **3. The Expectation of Revision**
  The theorem implies that rational agents should not be emotionally attached to their priors. Since information is expected to improve decision-making, researchers should view theory revision not as a defeat, but as the realization of the expected value of doing science. The defensive reaction to failed replications observed during the crisis violates the Bayesian ideal where beliefs are provisional hypotheses to be updated, not identity markers to be defended.

  #### Where the Mapping Breaks: Descriptive Reality vs. Normative Theory

  While Good's theorem offers a compelling ideal, the replication crisis reveals significant fractures when mapping the theorem onto the sociological reality of academic science. The breakdown occurs in the definition of the agent, the cost of information, and the structure of the utility function.

  **1. The Problem of the Agent: Individual vs. Community**
  Good's theorem applies to a *single* coherent agent with a unified prior and utility function. Science, however, is a multi-agent system.
  *   **The Break:** What is rational for the *community* (collecting all data to find the truth) is often irrational for the *individual*. If a researcher's famous finding is debunked by a replication, the community gains epistemic utility (truth), but the individual suffers a loss in reputation and credibility. The "community" cannot act as a single Bayesian agent because it lacks a single utility function. The incentives are misaligned: the individual bears the cost of the negative update, while the community reaps the benefit of the corrected belief.

  **2. Costly Information**
  Good's theorem guarantees non-negative value only for *free* information. Replication is expensive. It requires time, funding, and labor that could be spent on novel research.
  *   **The Break:** In the context of the crisis, replications were often underfunded and viewed as low-priority. If the cost of conducting a replication exceeds the expected utility gain from the information (e.g., if the result is unlikely to change practice or theory significantly), a rational agent should *not* seek that information. Many researchers likely calculated that the opportunity cost of running a replication was higher than the career benefit, leading to a scarcity of replication attempts. The theorem does not mandate seeking information when the net value (VOI minus Cost) is negative.

  **3. Divergent Utility Functions: Career vs. Truth**
  The most significant breakdown lies in the utility function. Good's theorem assumes utility is derived from the match between actions and states of the world (e.g., implementing an intervention that actually works). In modern academia, utility is often derived from *signals* of productivity rather than truth.
  *   **The Break:** Researchers derive utility from publications, citations, and grants. Journals historically preferred novel, positive results over replications or null findings. Consequently, the *career utility* of producing a replication study (especially a failed one) was often negative. A rational agent maximizing career utility would avoid replications, even if an agent maximizing epistemic utility would seek them.
  *   **Belief-Dependent Utility:** Furthermore, Good's theorem assumes utility depends on outcomes, not beliefs. However, researchers often derive psychological utility from *believing* their theory is correct. Information that forces a belief update (a failed replication) causes psychological disutility (cognitive dissonance). When utility is tied to maintaining a specific belief state, information that challenges that belief has negative subjective value, directly violating the conditions of the theorem.

  #### Scope and Limits of the Theorem

  The replication crisis illustrates that Good's theorem is a normative benchmark for **epistemic rationality**, not a descriptive model of **sociological or economic rationality**.

  The episode demonstrates that the theorem's guarantee holds only within a closed system where incentives are aligned with truth-seeking. When the scientific ecosystem rewards novelty over accuracy and punishes error correction, the "value of information" becomes decoupled from the "value to the researcher."

  Ultimately, the crisis shows that Good's theorem cannot solve institutional problems on its own. It highlights that for the theorem to apply to science as a collective enterprise, the **utility functions of individual agents must be realigned with the epistemic goals of the community**. Reforms like pre-registration and the publication of null results are attempts to lower the cost of information and restructure career utilities so that the rational choice for the individual (publish a replication) converges with the rational choice for the community (know the truth). Without this alignment, the theorem remains a philosophical ideal rather than a practical guide, proving that information is only valuable if the agent is rewarded for knowing it.
