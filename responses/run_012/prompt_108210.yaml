answer: |-
  Here is a menu of the distinct claims hidden inside the phrase "a rational agent maximizes expected value." You can take this list to the kitchen table. Each reading isolates a different assumption your flatmate is making.

  ### 1. The Naive Monetary Claim
  *   **The Claim:** A rational agent chooses the option with the highest expected *monetary* payoff.
  *   **Type of Value:** Money (linear).
  *   **Scope:** Single decision or sequence (indifferent).
  *   **Verdict:** **Simply False.**
  *   **Analysis:** This is the reading your flatmate is using for the coin game. It implies you should mortgage your house to play the St. Petersburg game because the infinite expected dollar return outweighs any finite cost. It is falsified by the fact that almost no one (including your flatmate, if the entry fee were high enough relative to his actual wealth) would actually do this. It ignores "risk of ruin." If you lose, you cannot play again. Money has diminishing marginal value; losing your last dollar hurts more than gaining a million helps.

  ### 2. The Expected Utility Claim (The Standard Repair)
  *   **The Claim:** A rational agent chooses the option with the highest expected *utility*, where utility is a function of wealth (usually concave).
  *   **Type of Value:** Utility (non-linear function of money).
  *   **Scope:** Single decision (representing consistent preferences).
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** This is the standard economic solution to the paradox. If utility grows logarithmically with wealth, the expected utility of the St. Petersburg game is finite, not infinite. There is a rational price cap.
  *   **Is it a change of subject?** Yes. It shifts the argument from "maximize dollars" to "maximize satisfaction." Your flatmate treats this as cheating; economists treat it as a necessary correction. Under this reading, refusing the game is perfectly rational.

  ### 3. The Long-Run Frequency Claim (The Law of Large Numbers)
  *   **The Claim:** A rational agent maximizes the average outcome over a large number of identical, independent trials.
  *   **Type of Value:** Money (averaged over time).
  *   **Scope:** Sequences of decisions only.
  *   **Verdict:** **True but Empty (for this case).**
  *   **Analysis:** This claim is mathematically true: if you play the game infinitely many times, your average payout converges to the expected value. However, it is empty as a guide for a *single* unrepeatable decision. The St. Petersburg game is proposed as a one-off. If you cannot repeat the gamble, the long-run average is irrelevant to your actual outcome. This reading cannot justify paying a high price for a single ticket.

  ### 4. The Coherence Claim (The Dutch Book)
  *   **The Claim:** A rational agent holds preferences that are internally consistent, such that no combination of bets can guarantee them a loss (a "Dutch Book").
  *   **Type of Value:** Consistency of preference ordering.
  *   **Scope:** Single decision (logical consistency).
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** This is the foundational argument for why probabilities and utilities should be multiplied. It proves you *should* act *as if* you are maximizing expected utility. However, it does not dictate *what* your utility function is. You can be perfectly coherent and refuse the St. Petersburg game (by having a bounded utility function). It proves you shouldn't be contradictory, not that you must chase infinite money.

  ### 5. The Ergodicity Claim (The Time-Average Growth)
  *   **The Claim:** A rational agent maximizes the time-average growth rate of their wealth over their lifetime.
  *   **Type of Value:** Geometric growth rate (log-wealth).
  *   **Scope:** Single decision viewed as part of a temporal sequence.
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** This comes from physics and finance. It distinguishes between the "ensemble average" (what happens to 1,000 people playing once) and the "time average" (what happens to 1 person playing 1,000 times). For multiplicative wealth dynamics (betting a fraction of wealth), the time average is finite even if the ensemble average is infinite. This reading validates your refusal without needing to appeal to psychological "utility"; it treats wealth growth as a physical process that cannot exceed certain bounds without risking zero.

  ---

  ### The Inference: From "Infinite Expectation" to "Irrational to Refuse"

  For your flatmate's argument to hold water, he needs to bridge the gap between the math and the norm. Here is what is required for that step to work, and where it breaks:

  1.  **Money must equal Utility.** He must assume linear utility (Reading 1). If he accepts Reading 2 (Utility), the expectation is no longer infinite, and the conclusion collapses. **Verdict:** Moving from money to utility is a repair of the principle, not merely a change of subject, because money is an instrument, not the goal.
  2.  **The Decision must be Repeatable.** He must assume Reading 3 (Long-Run). If the game is truly one-off, the infinite expectation is a statistical artifact that never manifests. **Verdict:** The argument needs the game to be repeatable or the decision to be one among many independent bets.
  3.  **No Risk of Ruin.** He must assume you have infinite credit or wealth. If there is any upper bound on the payout (e.g., the bank cannot pay more than the global GDP), the expected value becomes finite. **Verdict:** If the expectation is not well-defined (or is capped by reality), the "irrational" verdict vanishes.

  **Does anything survive if the expectation is not well defined?**
  No. If the integral diverges (as in St. Petersburg) or is undefined (as in Cauchy distributions), "Maximize Expected Value" provides no action guidance under Reading 1 or 3. You must switch to Reading 2 (Utility) or Reading 5 (Growth Rate) to make a decision.

  ---

  ### Testing the Readings Against Your Two Cases

  Here is how the readings perform against the scenarios you raised. This is your strongest leverage in the argument.

  #### Case A: The One-Off High-Stakes Wager
  *Scenario:* Your flatmate stakes 50% of his savings on a single coin flip. 60% chance to double it, 40% chance to lose it.
  *   **Expected Money:** Positive ($1.2x$ stake).
  *   **Quant's Stance:** Take the bet (Maximizes EV).
  *   **Your Stance:** Refuse the bet (Risk of ruin is too high).
  *   **Who is right?** You are.
  *   **Which Reading supports you?**
      *   **Reading 1 (Naive Money):** Supports him. **Fails.**
      *   **Reading 2 (Utility):** Supports you. Losing 50% of wealth causes more utility loss than gaining 100% provides.
      *   **Reading 3 (Long-Run):** Inapplicable. It is a one-off.
      *   **Reading 5 (Ergodicity):** Supports you. A 40% chance of a 50% drawdown drastically reduces long-term geometric growth.
  *   **Conclusion:** The reading that makes him right here (Naive Money) is dangerous. The readings that make you right (Utility/Ergodicity) are robust.

  #### Case B: The Repeated Small-Stakes Wager
  *Scenario:* A wager with a slight edge (51% win), repeated 10,000 times, stakes are 0.1% of wealth.
  *   **Expected Money:** Positive.
  *   **Quant's Stance:** Take the bet.
  *   **Your Stance:** Take the bet.
  *   **Who is right?** Both of you.
  *   **Which Reading supports you?**
      *   **Reading 1 (Naive Money):** Works.
      *   **Reading 2 (Utility):** Works (locally linear for small stakes).
      *   **Reading 3 (Long-Run):** Works perfectly. Law of Large Numbers guarantees profit.
      *   **Reading 5 (Ergodicity):** Works.
  *   **Conclusion:** All reasonable theories converge here. This is why your flatmate feels confident; he is generalizing from a domain where all models agree (small, repeated bets) to a domain where they diverge (large, one-off bets).

  ### Summary for the Kitchen Table

  1.  **He is conflating Ensemble and Time.** He is using the average outcome of 1,000 parallel universes (Ensemble) to justify a bet in this single universe (Time). In the St. Petersburg game, the "infinite" value comes from outcomes that effectively never happen in a human lifetime.
  2.  **He is assuming Linear Utility.** He is treating dollars as interchangeable units of value. They are not. The first dollar keeps you alive; the millionth is for decoration.
  3.  **The "Rational" Verdict.** If "rational" means "internally consistent" (Reading 4), you are rational. If "rational" means "maximizes long-term wealth survival" (Reading 5), you are rational. He is only "rational" if he defines the word to mean "maximizes theoretical dollar average ignoring ruin" (Reading 1), which is a definition that fails in the real world.

  **The Knockout Question:** Ask him: "If the entry fee is $1,000, and you have $2,000 to your name, do you play?" If he says yes, he is mathematically consistent but practically bankrupt. If he says no, he has admitted that Expected Monetary Value is not the sole criterion for rationality.
