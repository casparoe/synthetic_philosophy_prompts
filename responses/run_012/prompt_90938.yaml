answer: |-
  A customer slams a mug on the counter. "This coffee was hot when I bought it. Now it's cold. I want a refund."

  The barista wipes the steam wand. "Sir, the coffee didn't change. The coffee is a four-dimensional object. The part at the counter was hot. The part at your table was cold. Strictly, nothing changes."

  "Well, I'm the same guy who paid for it," the customer insists.

  "If you're the same guy, then you already consumed the hot coffee you paid for. The transaction is complete."

  "But I want to drink this part!"

  "Then you're a different temporal part. And that part didn't pay."

  "So I get it for free?"

  "No. The guy who paid is already gone. And he's not coming back for the change."
