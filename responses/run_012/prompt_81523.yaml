answer: |-
  You have put your finger on a genuine tension in decision theory, and your intuition is sharper than the textbook simplification you're remembering.

  You are circling a cluster of concepts, not just one. The "nagging memory" you have is **Blackwell's Theorem** (or sometimes **Good's Theorem**). It states that for a rational agent maximizing expected utility, free information always has non-negative expected value. The logic is exactly as you recalled: you can always choose to ignore the information and act as if you didn't have it. Therefore, having the option to know can never be worse than not having the option.

  However, your experience that information can be *negative* is also correct. The theorem holds only under specific axioms that human life frequently violates.

  To answer your question directly: **It is a smear.** There isn't one single name for "information that makes you worse off," because there are three distinct mechanisms by which information turns toxic. Depending on *why* the information hurts, it falls under different labels.

  Here is the untangling of the smear, the edges of the phenomenon, and what to call the pieces.

  ### 1. The Hedonic Cost (Information Aversion)
  **The Mechanism:** The standard theorem assumes your utility (satisfaction/well-being) depends only on the *state of the world* and your *actions*. It assumes $Utility = f(World, Action)$.
  **The Violation:** For humans, utility also depends on the *state of knowledge*. $Utility = f(World, Action, Knowledge)$.
  **The Phenomenon:** If knowing a fact causes anxiety, grief, or ruinous curiosity, that is a direct cost subtracted from your utility. In the standard model, knowledge is a tool. In your model, knowledge is also an experience. If the experience is painful, the value of information can be negative.
  **The Name:** **Information Aversion** (in behavioral economics) or **The Ostrich Effect** (specifically regarding financial or health news).
  **The Edge:** This applies when the pain is in the *feeling* of knowing, regardless of whether you act. Example: Waiting for a medical test result. Knowing you are sick doesn't change the illness (the world state), but it destroys your peace of mind (the knowledge state).

  ### 2. The Obligation Cost (Moral Commitment)
  **The Mechanism:** Blackwell's Theorem assumes you have the **option to ignore**. It assumes that if you learn $X$, you are physically and normatively free to act as if you didn't know $X$.
  **The Violation:** In social and moral contexts, knowledge creates **irreversible commitment**. Once you know a friend is being abused, or a company is polluting, social and moral norms often forbid you from acting as if you didn't know. You lose the "ignore" option.
  **The Phenomenon:** Information here acts as a constraint on your future strategy. By knowing, you lose the strategic flexibility of ignorance. You are forced into a costly action (confrontation, reporting, leaving) that you could have avoided if you remained ignorant.
  **The Name:** **Strategic Ignorance** (when chosen deliberately) or **Plausible Deniability** (the asset you lose by knowing). In game theory, this is sometimes discussed under **Endogenous Information Constraints**.
  **The Edge:** This applies when the cost is in the *obligation to act*. Example: Seeing a wallet on the street. If you walk past without looking inside, you can tell yourself "I didn't see ID, I couldn't return it." If you look inside and see an address, you are now morally committed to returning it. The information cost you your moral flexibility.

  ### 3. The Bargaining Cost (Signaling)
  **The Mechanism:** The standard theorem usually models a single agent against nature. It rarely models information as a signal to *other agents*.
  **The Violation:** In social interactions, what you know signals what kind of person you are.
  **The Phenomenon:** Knowing something can change how others treat you, often to your detriment. If you know the salary of your colleague, you might be forced into a negotiation you didn't want. If you know the dirty secret of your boss, you become a threat to them.
  **The Name:** **Information Hazard** (a term popularized by Nick Bostrom, though often used for existential risk, it applies here too) or **Signaling Burden**.
  **The Edge:** This applies when the cost comes from *others knowing that you know*. Example: A whistleblower. The information itself might not hurt them, but the fact that they possess it makes them a target.

  ### So, is there one name?

  If you want the umbrella term for the *choice* to avoid these costs, it is **Strategic Ignorance**. This is the recognized economic term for when a rational agent deliberately avoids information to preserve utility (either hedonic or strategic).

  If you want the term for the *property* of the information itself, there isn't a single perfect word, but **"Negative Instrumental Value"** is the technical description, while **"Information Hazard"** is the growing colloquial term in rationalist and safety circles.

  ### The Boundaries (What it is and isn't)

  To give you the edges you asked for:

  **It IS:**
  *   **A failure of the "Ignorability" Axiom:** The core issue is that the standard theorem assumes information is *free* and *ignorable*. Your observation proves that information is often *costly* (emotionally) and *binding* (morally).
  *   **A Utility Function Issue:** It reveals that standard decision theory models humans as "outcome maximizers," whereas humans are often "experience maximizers" or "identity maximizers."
  *   **Rational:** Avoiding the information in these cases is not irrational. It is rational *if* your utility function includes "peace of mind" or "social flexibility."

  **It IS NOT:**
  *   **A Refutation of Blackwell's Theorem:** The math still holds *within its own axioms*. If you define utility strictly by external outcomes and assume you can ignore info, the theorem is true. Your observation doesn't break the math; it breaks the *model of the human*.
  *   **Cowardice:** Framing this as "not wanting to face the truth" misses the structural point. If knowing the truth removes your ability to navigate a social situation effectively (by removing plausible deniability), avoiding it is a strategic move, not a moral failing.

  ### Summary

  You are observing the gap between **Decision Theory** (how to choose actions) and **Epistemic Ethics** (how to live with knowledge).

  The specific sensation you are describing—that knowing commits you to a cost you didn't have before—is best described as the **Burden of Agency**. Information converts potential problems into actual responsibilities.

  If you need a label for your notes or thinking:
  1.  Call the choice **Strategic Ignorance**.
  2.  Call the feeling **Information Aversion**.
  3.  Call the structural reason **The Irreversibility of Knowledge**.

  You aren't sliding between senses of "better off." You are correctly identifying that "better off" includes things the standard theorem explicitly excludes: the cost of carrying the truth, and the loss of the option to pretend you don't have it.
