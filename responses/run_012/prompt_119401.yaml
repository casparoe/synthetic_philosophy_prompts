answer: |-
  **Sequence of Components**

  1.  **Unsettle the Encapsulation Assumption:** Students arrive assuming perception is modular (Session 1). They assume perception is informationally encapsulated from belief. You must destabilize this intuition first; otherwise, the thesis appears as category-error nonsense.
  2.  **Fix the Perception/Judgment Distinction:** This distinction must be in place *before* the thesis is stated. If students conflate seeing with judging, penetration is indistinguishable from bias. This is the logical prerequisite.
  3.  **State the Thesis:** Define it as cognitive states altering phenomenal character, not downstream reports.
  4.  **Present the Case:** Empirical support follows conceptual clarity.

  **The One Case**

  Use the **Fear-Size Case** (arachnophobes estimate spiders as physically larger than non-phobics).
  *   **Must Have:** A phenomenal difference (size) linked to a cognitive state (fear) with controlled retinal input.
  *   **Must Lack:** Ambiguity, voluntary control, or attentional shifts.
  *   **Exclusions:** The **Duck-Rabbit** fails because the shift is voluntary/attentional, not cognitively fixed. **The Dress** fails because it hinges on illumination assumptions and attention, not high-level belief. The **Müller-Lyer** fails because it demonstrates *impenetrability* (knowing the lines are equal doesn't stop them looking unequal).

  **Misconceptions**

  1.  **Triviality ("Beliefs always change seeing"):** Head off at **Step 1**. Insist on the phenomenal/judgment split.
  2.  **Attention ("It's just looking closer"):** Head off during **The Case**. Specify gaze fixation controls.
  3.  **Theory-Ladenness ("It's just Hanson"):** Head off after **Step 3**. Distinguish psychological mechanism from sociological description.
  4.  **Justification ("Perception loses epistemic force"):** Head off during implications. Penetration doesn't entail unreliability.
  5.  **Predictive Processing ("Bayes solved this"):** Head off at the **End**. Philosophy defines the terms; science fills the model.

  **Final Question**

  "If two subjects view identical stimuli with identical attention, but one reports a larger size due to fear, has the *content* of their vision changed, or only their *confidence*?"
  (Correct answer: Content/Phenomenal character. Slogan answer: Opinion/Interpretation.)

  **Refusals**

  Announce you will not cover: neural circuitry implementation, the mathematics of Bayesian predictive processing, or the history of logical positivism and Hanson.
