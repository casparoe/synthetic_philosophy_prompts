answer: |-
  Here is an audit of the 'DNA as Code/Program' analogy, structured to separate the rigorous information theory from the philosophical overreach.

  ### 1. The Communication Model Mapping
  Your mate is leaning on the Shannon-Weaver model of communication. Here is how the cellular machinery maps onto it:

  *   **Sender:** The ancestral lineage (via replication) or the parent organism (via gametes).
  *   **Message:** The nucleotide sequence (A, C, G, T).
  *   **Channel:** The transcription/translation machinery (mRNA, ribosome).
  *   **Noise:** Mutation, transcription errors, environmental interference.
  *   **Codebook:** The Genetic Code (the codon table mapping triplets to amino acids).
  *   **Decoder:** The ribosome/tRNA complex.
  *   **Receiver/Output:** The polypeptide chain (protein) and subsequent phenotype.

  On this specific level, your mate is correct: DNA satisfies the technical definition of a **code**. There is a discrete symbol set, a mapping rule, and a transmission of state.

  ### 2. Where the Picture Breaks Down
  The friction arises when moving from 'code' (a static mapping) to 'program' (dynamic execution with semantic meaning).

  **A. The Hardware/Software Entanglement**
  In a computer, software is distinct from hardware. You can run Word on different machines. In the cell, the 'software' (DNA) encodes the 'hardware' (proteins/ribosomes) that reads the 'software'. It is a closed, autocatalytic loop. There is no independent machine to run the programme; the machine builds itself from the instructions.

  **B. The Nature of the 'Decoder'**
  In semiotics, a decoder interprets symbols based on convention. The ribosome does not 'interpret'; it reacts. It is a chemical catalyst shaped by evolution to bind specific molecules. Calling it a 'decoder' smuggles in an homunculus—a little man inside the cell reading the map. There is only chemistry obeying thermodynamic laws.

  **C. Context Dependence**
  A programme usually yields a deterministic output for a given input. A genome yields different phenotypes depending on cellular context, epigenetic marks, and environmental signals (phenotypic plasticity). The 'code' does not specify the outcome; it constrains the reaction norms.

  ### 3. Threatening vs. Decorative Disanalogies
  Your mate claims calling it a metaphor is 'soft'. This is incorrect. Precision matters.

  **Decorative Disanalogies (Do not threaten the conclusion):**
  *   **Base-4 vs. Binary:** Irrelevant. Information theory handles any discrete state system.
  *   **Speed/Energy:** Biological processes are slower and wetter than silicon. This is engineering, not ontology.
  *   **Lack of Intentionality:** Evolution has no 'sender' with intent. However, Shannon information does not require intent, only correlation.

  **Threatening Disanalogies (Do threaten the conclusion):**
  *   **No Semantic Content:** In human code, symbols refer to concepts. In DNA, 'symbols' refer to chemical affinities. The 'meaning' is cashed out in survival, not truth conditions. To call it 'information' in the semantic sense is a category error.
  *   **No External Interpreter:** As noted above, without an agent to assign meaning, 'information' is merely physical correlation. If the universe contains no mind to read it, is it a code or just a pattern?
  *   **Development vs. Execution:** An organism is not 'computed'; it grows. The genome is not a blueprint dictating structure, but a set of local instructions for construction.

  ### 4. The Sticking Point: Arbitrariness and Chemistry
  You asked if arbitrariness makes it a code.
  *   **Arbitrariness:** The genetic code is largely arbitrary (a 'frozen accident'). UGU codes for Cysteine not because of chemical necessity, but historical contingency. This supports the 'code' label technically.
  *   **Chemistry vs. Interpretation:** This is the crux. A code implies a separation between the signal and the physical force. In DNA, the signal *is* a physical molecule exerting chemical force. The 'information' is intrinsic to the causal structure. It is not 'decoded' in the semantic sense; it is **transduced**.

  ### 5. A Better Analogy: The Recipe
  The 'Programme' analogy implies control and separation. The **Recipe** analogy is superior.
  *   **Why:** A recipe lists instructions, but the cake emerges from the *interaction* of ingredients under heat (environment). You cannot separate the 'software' of the cake from the 'hardware' of the flour and eggs.
  *   **Implication:** The genome provides constraints and ingredients, not a deterministic blueprint.

  ### 6. Verdict on Your Mate's Conclusion
  Does the conclusion survive under the 'Recipe' audit? **Partially, but weakened.**

  *   **Survives:** The claim that DNA carries **Shannon Information** (reducible uncertainty) is scientifically respectable. It is literal, not metaphorical.
  *   **Fails:** The claim that the organism is 'decoded' out of the genome in a semantic sense is metaphorical. The genome does not contain the 'organism'; it contains the constraints for building one.

  **Final Advice:**
  Tell your mate he is right about the **mechanism** (it functions as a code) but wrong about the **ontology** (it is not a semantic programme). Calling it a metaphor isn't 'soft'; it acknowledges that 'information' in biology is a causal property, not a semantic one. If he insists it is *literal* information, he must explain where the 'meaning' resides without a mind to perceive it. Until then, 'heuristic model' is the precise term, and precision is the opposite of softness.
