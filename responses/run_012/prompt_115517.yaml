          1.  **No Separation of Hardware/Software:** The genome builds the machine that reads the genome. In a PC, the CPU exists independently of the Word document.
          2.  **No External Semantics:** "Meaning" in DNA is cashed out in survival/replication, not semantic truth. It's teleonomic, not teleologic.
          3.  **Execution is Development, not Computation:** A program computes a result. An organism *develops*. The "output" is the system itself continuing to run.

  5.  **Address the "Arbitrariness" and "Interpreter" Sticking Points:**
      *   *Arbitrariness:* Sufficient for "code" in a technical sense (cryptography/information theory), but doesn't prove "information" in a semantic sense.
      *   *Interpreter:* The ribosome is a *mechanism*, not an *agent*. Calling it a decoder reifies the mechanism into a homunculus. The "information" is intrinsic to the causal structure, not imposed from outside.

