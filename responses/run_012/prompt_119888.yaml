answer: |-
  Here is the battle plan for your 80 minutes. You are right to worry about unloading counter-examples too early; if the Simple Conditional Analysis (SCA) doesn't feel like the obvious truth first, the counter-examples will just feel like pedantic nitpicking rather than metaphysical crises.

  ### 1. The Dependency Order
  You cannot introduce the counter-examples until the students have bought into the **Simple Conditional Analysis (SCA)**. The sequence must be:

  1.  **The Intuition (0–15 mins):** Establish that dispositions are real properties (fragility, solubility). Ask: "What does it *mean* to say this glass is fragile?" Elicit the response: "It means if you hit it, it breaks."
  2.  **The Formalization (15–20 mins):** Write the SCA on the board: *$x$ is disposed to $M$ if $S$ iff if $x$ were $S$, $x$ would $M$.* Get them to agree this looks analytically true. It captures the "would" in disposition.
  3.  **The Fink (20–40 mins):** Now break the Left-to-Right direction. The disposition exists, the stimulus happens, but the disposition *vanishes* before the manifestation. (SCA says "Breaks", Reality says "Doesn't Break").
  4.  **The Mask (40–60 mins):** Break the Left-to-Right direction again, but differently. The disposition exists, the stimulus happens, the disposition *stays*, but something external blocks the result.
  5.  **The Mimic (60–70 mins):** Break the Right-to-Left direction. No disposition, but the manifestation happens anyway.
  6.  **Synthesis (70–80 mins):** What does this tell us about the analysis? (It needs a *ceteris paribus* clause or a causal basis requirement).

  **Why this order?** The Fink is the most damaging because it attacks the *intrinsicness* of the disposition. The Mask is easier to digest (something got in the way). The Mimic is the reverse problem. If you do Mask first, they'll think "Oh, just add 'unless interfered with' to the analysis." The Fink stops them from doing that, because the interference is the stimulus itself.

  ### 2. The Single Carrying Case
  Do not use three different objects (a person, a lift, a wire). Use **one object** and change the *circumstances*. This shows it's a structural problem with the analysis, not a quirk of specific objects.

  **Recommendation:** Refine your **Lift/Door** case into a **"Smart Security Door."**
  *   **The Disposition:** The door is disposed to *unlock* when the correct code is entered.
  *   **Why this works:** It's mechanical (avoids philosophy of mind baggage), intuitive, and allows for internal/external manipulation.

  **The Three Twists:**
  1.  **The Fink (The "Panic Mode"):** The door is disposed to unlock on code. However, the moment the code is entered, a security sensor detects a threat and *welds the lock shut*. The stimulus (code entry) causes the disposition (unlockability) to vanish instantly.
      *   *SCA Verdict:* If code entered, it would unlock. (False)
      *   *Reality:* It is disposed to unlock (normally), but won't.
  2.  **The Mask (The "Doorstop"):** The door is disposed to unlock on code. You enter the code. The motor whirs (disposition active), but someone has jammed a wooden wedge under the door. The disposition remains, the manifestation is blocked externally.
      *   *SCA Verdict:* If code entered, it would unlock. (False)
      *   *Reality:* It is disposed to unlock, but won't.
  3.  **The Mimic (The "Broken Spring"):** The lock is broken and has *no* disposition to unlock on code. However, a gust of wind hits the door at the exact moment you press the code, blowing it open.
      *   *SCA Verdict:* If code entered, it would unlock. (True)
      *   *Reality:* It is not disposed to unlock.

  **What this case must have:** A clear causal mechanism (motor/lock) so students can distinguish between the *basis* of the disposition (the motor) and the *manifestation* (the door opening).
  **What this case must lack:** Human intentionality. Do not use the "Shy Person" as your main example (see below).

  ### 3. Misconceptions: Order and Management
  Here is the sequence of errors they will make, and how to handle them.

  1.  **"Dispositions are just statistical frequencies."**
      *   *When:* During the Setup (0–15 mins).
      *   *Action:* **Head this off immediately.** If they think "fragile" means "breaks 90% of the time," the SCA makes no sense.
      *   *Fix:* Use a single-case counterfactual. "This glass is fragile even if it is never struck and never breaks." Dispositions are about *what would happen*, not *what does happen*.
  2.  **"Finks and Masks are the same thing; something got in the way."**
      *   *When:* After the Mask case (40–60 mins).
      *   *Action:* **Let this form.** This confusion is load-bearing. It forces them to ask *where* the disposition lives.
      *   *Resolution:* In the Synthesis, distinguish them by location. Mask = External interference. Fink = Internal change triggered by stimulus. The Fink removes the *power*; the Mask blocks the *exercise* of the power.
  3.  **"The Fink shows there are no dispositions at all."**
      *   *When:* After the Fink case (20–40 mins).
      *   *Action:* **Head this off.** They will think if the analysis fails, the property doesn't exist.
      *   *Fix:* "The map is not the territory. The SCA is a definition we proposed. The Fink shows the *definition* is wrong, not that the *glass* isn't fragile."
  4.  **"So we just add 'ceteris paribus' clauses and we're done."**
      *   *When:* End of session.
      *   *Action:* **Leave this as a live worry.** Don't solve it. Tell them philosophers are still fighting over how to fix the analysis.

  ### 4. Evaluation of Your Cases
  You asked about your two specific cases. Here is the verdict:

  *   **(a) The Shy Person (Fink):**
      *   *Diagnosis:* You are correct; this is a Fink. The stimulus (friends arriving) removes the disposition (chattiness).
      *   *Pedagogical Risk:* **Do not use this as your main case.** It invites students to reduce metaphysics to psychology ("Is shyness a real property?", "Is anxiety internal?"). It distracts from the logical structure of the SCA.
      *   *Verdict:* Keep it in your back pocket as a "real world" analogy if they look lost, but don't build the lesson on it.
  *   **(b) The Lift Doors (Mask):**
      *   *Diagnosis:* You are correct; this is a Mask. The disposition (to close) is present, the stimulus (button press) occurs, but an external factor (sensor/beam) prevents manifestation.
      *   *Pedagogical Value:* High. It is mechanical and clear.
      *   *Verdict:* **Use this,** but modify it slightly to be the "Smart Security Door" described above so you can also run the Fink version on the *same* object.

  **Corrected Pair:**
  If you want to keep the spirit of your cases but make them metaphysically tight:
  *   **Fink:** A wire that is live (disposed to conduct), but connected to a device that detects touch and instantly drains the voltage (disposition lost upon stimulus).
  *   **Mask:** A wire that is live, connected to a bulb, but the bulb is smashed (disposition present, manifestation blocked).

  ### 5. Terminology and The Shaky Line
  Textbooks vary, so fix your lexicon for the 80 minutes and stick to it.

  *   **Standard Set:** **Fink**, **Mask**, **Mimic**.
  *   **Antidote:** Do not use this term unless your reading specifically requires it. It is usually reserved for chemical dispositions (poison/antidote) and is effectively a subtype of Mask. Using "Mask" covers both physical blocking and chemical neutralization.
  *   **The Fink/Mask Boundary:** You are right to be worried; this line is shakier than textbooks admit. It depends on whether you count the interferer as part of the *intrinsic basis* of the disposition.
      *   *Teaching Strategy:* **Flag this explicitly.** In the Synthesis phase, say: "You might wonder if a Mask is just a slow Fink, or if a Fink is an internal Mask. The distinction relies on where we draw the line between the object's intrinsic properties and the external environment. That is a live debate in metaphysics. For today, we distinguish them by *timing* and *location*: Finks kill the power; Masks block the output."
      *   *Why:* Students respect honesty about complexity more than a tidy lie they will unlearn next year.

  ### 6. What to Cut
  You are correct. Cut the following:
  1.  **Dispositional Essentialism:** (Using dispositions to explain laws of nature).
  2.  **The Intrinsic/Extrinsic Debate:** (Whether dispositions are real properties vs. categorical bases).

  **The Cut Sentence:**
  Say this out loud at the start or end:
  > "We are spending today fixing the *logic* of how we talk about dispositions, not deciding whether they are the fundamental building blocks of the universe. We're testing the definition, not the ontology."

  ### 7. The Final Assessment Question
  Do not ask them to define "Fink." Ask them to apply the distinction to a new case. In the last 5 minutes, put this on the board:

  > **Case:** A sugar cube is disposed to dissolve in water. You drop it in. It does not dissolve.
  >
  > **Scenario A:** The water was saturated with sugar already.
  > **Scenario B:** The moment the sugar touched the water, it magically turned into plastic.
  >
  > **Question:** Which scenario is a Mask and which is a Fink? Explain *why* the distinction matters for the Conditional Analysis in each case.

  **What this tells you:**
  *   If they say **A is Mask**: They understand external interference (saturation is external to the cube's disposition).
  *   If they say **B is Fink**: They understand the loss of intrinsic basis (the cube changed nature).
  *   If they can't explain *why* it matters: They haven't grasped that Finks break the analysis by removing the property, while Masks break it by blocking the result.

  **Good luck. You know the material; just let them feel the problem before you give them the vocabulary.**
