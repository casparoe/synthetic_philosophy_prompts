prompt: |-
  So I've been drafted at the last minute to cover a session for a lecturer who's away — it's an 80-minute slot with second-year undergrads in a metaphysics unit, they've done properties and modality but nothing at all on dispositions, and the topic I've been handed is dispositions with a reading that's mostly about finks and masks. I know this material well enough to talk for an hour but I've never taught it and I'm worried I'll do the classic thing of unloading the counter-examples before they've felt the pull of the view being attacked. Don't explain finks and masks to me — plan how I should teach them. What has to be in place before the first counter-example lands, i.e. the dependency order: does the simple "would break if struck" analysis have to be stated and half-believed before I show it failing, and where exactly does the fink go relative to the mask, and the mimic relative to both? Which single case should carry the whole session — I want one example I can twist three ways so they see it's one phenomenon with three different twists rather than three unrelated puzzle-cases, and I need to know what that case has to have (a disposition everyone grants, an interference that's clearly the stimulus itself in one version and clearly external in another) and what it has to lack so it doesn't smuggle in extra controversy. And the misconceptions: I'm expecting at least "a disposition is just a tendency, a statistical frequency", "the fink shows there are no dispositions at all", and "fink and mask are the same thing, something got in the way" — but I bet there are ones I'm not seeing. Tell me which they'll actually form, in the order they'll form them, and at which point in the sequence I should head each one off, and which ones I should let them form on purpose because the confusion is load-bearing.

  Two more things. I have two cases of my own I want to use and I'm not sure they're any good: (a) a shy person who is genuinely chatty with friends but who, the moment the friends actually turn up, gets anxious and goes silent — I think that's a fink, because the stimulus itself kills the disposition rather than merely blocking it; and (b) a lift whose doors are disposed to close when you press the button, except a sensor reopens them whenever something breaks the beam — I think that's a mask, since the disposition to close is still there and something outside it is just stopping the manifestation. Tell me whether those are right, which if either should be the carrying case, and if they're wrong, what they actually are and what a corrected pair would look like. Also, I keep seeing mask, antidote and mimic used almost interchangeably in what I've read and I can't tell which usage is standard — just fix a consistent set of labels for the session and stick to them, and flag if the fink/mask line is shakier then the textbooks make out, because I'd rather the students leave with a live worry than a tidy taxonomy they'll parrot back.

  Finally: what do I have to leave out at this level? I'm thinking the whole dispositional-essentialist use of finks to explain laws of nature, and the intrinsic/extrinsic argument about whether dispositions are real properties — tell me if that's the right cut, and give me a sentence I can say out loud to them to mark the cut without making it sound like I'm hiding the good bit. And one question to ask in the last five minutes that would actually show me whether they've got the distinction, or are just nodding along at the vocabulary.
