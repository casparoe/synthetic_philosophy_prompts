      *   *Section 4: The Unnamed State.* Weil wants to abolish parties in France. Koestler writes about Russia but implies a universal totalitarian logic. This supports Weil's structural claim but risks letting liberal democracies off the hook (which Weil wouldn't want).
      *   *Section 5: What Fiction Adds.* The visceral experience of the cell. The temptation of absolution. The emotional weight of "betraying" the future vs. the self.
