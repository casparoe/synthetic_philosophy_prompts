      *   *Refining the "Complicity" point:* Weil implies the structure makes you do it. Koestler implies you did it before the structure caught you. Rubashov purged Arlova earlier. His conscience was already compromised. This challenges Weil's idea that the *form* is the sole culprit; it suggests the *ideology* matters too.

  7.  **Final Polish:** Check tone (seminar design, academic but accessible). Ensure all prompt constraints are met (confidence level, least sure point).

