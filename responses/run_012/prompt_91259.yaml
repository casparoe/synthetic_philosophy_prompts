answer: |-
  **MEMORANDUM**

  **TO:** Heritage Commission
  **FROM:** [Your Name], Resident Member
  **DATE:** October 15, 2023
  **SUBJECT:** Recommendation on Living Heritage Designation Vote

  **Recommendation**
  I recommend that the Commission award the Living Heritage designation and grant to the **Kettle Parade**.

  **Reasoning**
  We are tasked with interpreting the criteria: "demonstrable antiquity and continuous practice." On the surface, the Ember Walk fits this text better. It dates to 1893 and has not lapsed. The Kettle Parade began in 1974 and had a break in the 1990s. However, I believe adhering strictly to these words undermines the purpose of a *Town* Heritage Commission. Our mandate is to steward the culture of the living town, not merely to archive dates.

  The Kettle Parade, despite its commercial origins, has achieved what heritage is supposed to do: it binds the community. It is the only event where multi-generational families and newer immigrant neighbors participate as equals. It has been revived not by a chamber of commerce memo, but by residents who missed it. That resilience—the fact that the town demanded its return—suggests it has taken root deeper than its 1974 blueprint implies.

  Conversely, while the Ember Walk has "continuous practice," it is functionally a private family ritual. It excludes outsiders. Awarding a *Town* crest and *Public* funds to a tradition that explicitly does not serve the public creates a contradiction. Furthermore, the "antiquity" of the Ember Walk is illusory; an 1893 invention is not medieval, it is Victorian. To privilege 1893 over 1974 is to privilege one type of invention (romantic Victorianism) over another (mid-century tourism), while ignoring the current social utility of the practice.

  **The Strongest Case Against This Recommendation**
  I want to address the argument made by my colleagues favoring the Ember Walk, specifically regarding the nature of the Kettle Parade's origin. There is a valid philosophical position that a custom cooked up to sell tickets cannot truly be "heritage," regardless of how popular it becomes.

  The argument is that heritage requires *organic* emergence. It must grow from the soil of shared belief or necessity, not from a marketing budget. When a tradition is manufactured for economic gain, the participants are customers, not bearers of culture. If we fund the Kettle Parade, we risk signaling that any event can be "heritage" if it simply becomes popular enough. This devalues the designation. It suggests that authenticity is irrelevant, and that the Commission's role is merely to certify whatever draws a crowd. The Ember Walk, even if Victorian in origin, was adopted by a community for their own spiritual or social cohesion, not to sell tickets to tourists. That internal motivation matters. By funding the Kettle Parade, we may be prioritizing "vibes" over veracity, and we risk turning our town's history into a theme park where the newest ride gets the prize.

  **Conclusion**
  I acknowledge that risk. However, I believe "Living Heritage" must prioritize the *Living*. A tradition that excludes the town cannot be the town's heritage. A tradition that unites it, even if its roots are younger than we might prefer, is the one worthy of our crest. I ask my colleagues to vote for the community we have, not the antiquity we wish we had.

