answer: |-
  **Final Examination: Moral Responsibility and the Reactive Attitudes**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should demonstrate a critical engagement with P. F. Strawson's "Freedom and Resentment." Do not merely summarize Strawson's views; apply his distinctions to the scenario provided.

  **Question:**

  Imagine a community—call it the Regulated Community—whose adult members have access to a reversible neural intervention. The intervention dampens the affective components of resentment, indignation, and guilt. It does not impair memory, practical reasoning, moral judgment, or the capacity to recognize and respond to reasons. Members of the Regulated Community still deliberate about what is right, still criticize one another, still demand apologies, still impose sanctions for wrongdoing, and still modify their conduct in light of moral considerations. What they lack is the emotional sting of the reactive attitudes. They do not feel resentment when wronged, indignation when others are wronged, or guilt when they themselves do wrong. They can describe these emotions and predict them in others, but they do not undergo them. The intervention is freely chosen and can be reversed at any time.

  Does Strawson's account imply that the Regulated Community is **impossible** (because the reactive attitudes are constitutive of the participant stance); **possible but morally impoverished** (because something essential to interpersonal relationships is lost); or **possible and morally adequate** (because the reactive attitudes are not necessary for responsibility)?

  In answering, you must:
  1.  Address the distinction between **excuses and exemptions** as it applies to this community.
  2.  Explain what Strawson means by the **objective attitude** and consider whether it is a single phenomenon.
  3.  Analyze what the scenario reveals about the debate between the **optimist and the pessimist** concerning determinism and responsibility.
  4.  Evaluate whether Strawson's view is **stable**: does he treat reactive attitudes as natural facts we cannot abandon, as justified practices, or both? Does the Regulated Community expose a tension between these claims?

  ***

  ### Model Answer

  Strawson would likely classify the Regulated Community as **possible but morally impoverished**, though this classification threatens to collapse into impossibility regarding genuine interpersonal relationships. By voluntarily dampening the affective core of the reactive attitudes, the community institutionalizes the **objective attitude**. Strawson argues that while we can occasionally adopt the objective stance toward others (viewing them as objects of social policy or therapy), we cannot sustain it universally without ceasing to view them as participants in interpersonal relationships. The Regulated Community attempts exactly this universalization. While they retain the *language* of responsibility (sanctions, criticism), they lack the *emotional commitment* that gives that language its bite. Thus, they are possible as biological entities, but their relationships are impoverished, resembling management rather than fellowship.

  Regarding **excuses and exemptions**, the community creates a paradox. Strawson distinguishes excuses (which admit the act was bad but deny full agency, e.g., "I didn't know") from exemptions (which deny the agent is a suitable target of reactive attitudes, e.g., "He is a child"). The Regulated Community members offer neither standard excuses nor exemptions; they claim full agency but lack the emotional response. However, by removing the capacity for resentment, they effectively grant themselves a global exemption. If no one feels resentment, no one is truly held responsible in the Strawsonian sense, even if sanctions remain. The sanctions become merely behavioral conditioning, not moral accountability.

  This scenario illuminates the **optimist-pessimist debate**. The Optimist (compatibilist) argues responsibility is compatible with determinism if agents can respond to reasons. The Regulated Community supports the Optimist: members respond to reasons and sanctions despite the intervention. However, the Pessimist argues that without deep freedom, responsibility is hollow. Strawson sidesteps this by grounding responsibility in human nature, not metaphysics. The Community shows the Pessimist was half-right: without the *affect*, responsibility feels hollow, even if the cognitive machinery works. Strawson agrees that the affect is essential, but he grounds it in nature, not libertarian freedom.

  Finally, the scenario exposes a tension in Strawson's **stability**. Strawson claims reactive attitudes are "natural facts," implying we cannot simply abandon them. Yet, the Regulated Community *does* abandon them via technology. If the attitudes are truly natural facts, the intervention should be impossible or unsustainable. If they are merely justified practices, the Community could argue their practice is superior (more rational, less painful). Strawson wants both: they are natural facts *and* justified. The Community suggests they are contingent biological traits, not necessary structures of human life. If they are contingent, Strawson's defense of responsibility weakens; it becomes a choice, not a given. Therefore, the Community is possible, but in choosing it, they step outside the Strawsonian framework of responsibility entirely, rendering their practice "morally adequate" only by redefining responsibility into something Strawson would not recognize.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Distinction Criteria:** To achieve an **A grade (16-20 marks)**, the answer must make the following five specific moves. A **B grade (12-15 marks)** will address the topics but lack the critical precision or integration described below.

  | Move | Marks | Requirement for A Grade | Typical B Grade Error |
  | :--- | :---: | :--- | :--- |
  | **1. Excuses vs. Exemptions** | 4 | Identifies that the Community effectively creates a *global exemption* despite retaining cognitive agency, distinguishing this from standard excuses. | Treats the lack of emotion as merely an "excuse" for behavior, failing to see it alters the *status* of the agent. |
  | **2. Objective Attitude** | 4 | Recognizes the Community institutionalizes the objective attitude and notes Strawson's claim that this is incompatible with *ordinary* interpersonal relationships. | Defines the objective attitude correctly but fails to apply it to the *universality* of the Community's practice. |
  | **3. Optimist vs. Pessimist** | 4 | Explains that the scenario validates the Optimist's cognitive conditions but the Pessimist's intuition about the "hollowness" of affect-less responsibility. | Presents the Optimist/Pessimist debate as purely metaphysical, ignoring Strawson's dissolution of the metaphysical issue. |
  | **4. Stability (Naturalism)** | 4 | Identifies the tension: if attitudes are "natural facts," they shouldn't be removable; if removable, they are contingent, weakening Strawson's necessity claim. | Accepts Strawson's naturalism uncritically without seeing how the technology challenges the "inescapable" nature of the attitudes. |
  | **5. Coherent Thesis** | 4 | Provides a clear verdict (Impossible/Impoverished/Adequate) that integrates the four theoretical points above into a unified argument. | Lists answers to the four prompts separately without a unifying thesis or conclusion. |

  **Common Misunderstandings (Deduct 1-2 marks each if prevalent):**

  *   **Confusing Reactive Attitudes with Retribution:** Assuming Strawson defends punishment or vengeance. *Correction:* Strawson defends the *emotional engagement* of relationships, not necessarily penal sanctions.
  *   **Strawson as Hard Determinist:** Claiming Strawson believes we are not responsible. *Correction:* Strawson is a compatibilist who bypasses the determinism debate via naturalism.
  *   **The Objective Attitude as "Bad":** Assuming Strawson thinks the objective attitude is morally wrong. *Correction:* Strawson views it as necessary in some contexts (therapy, management) but destructive as a *general* stance.
  *   **Cognitive vs. Affective:** Arguing that because the Community retains moral *judgment*, they retain full responsibility. *Correction:* For Strawson, the *affect* is constitutive of the responsibility practice, not just the judgment.
  *   **Summarizing "Freedom and Resentment":** Reciting Strawson's text without applying it to the specific neural intervention details. *Correction:* The exam requires application, not exposition.
