      *   This implies the sister values the relationship or the long-term gain more than the marginal gain of 60% vs 50% in the final round.
      *   If the sister is *not* a pure profit maximizer (which she seems not to be), the backward induction chain breaks.
      *   **The Trap:** If the User exercises in Window 1 based on the fear that the Sister *might* defect later, the User triggers the very outcome they fear (value destruction).

  4.  **Develop Strategy for Window 1:**

      *   **Do not exercise.** Exercising confirms the "defect" strategy and kills the growth.
