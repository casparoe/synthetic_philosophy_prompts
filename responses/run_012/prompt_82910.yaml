      *   **Type of Game:** Finite horizon sequential game with perfect information.
      *   **Standard Solution:** Backward Induction leads to the Subgame Perfect Nash Equilibrium (SPNE). The economist is technically correct *if* both players are purely rational profit-maximizers with no other constraints.
      *   **The Flaw in the Standard Model:** It assumes common knowledge of rationality and purely financial utility. It ignores reputation, trust, relationship value, and the ability to make binding commitments (or credible signals).
      *   **The "Centipede Game" Parallel:** This is a variant of the Centipede Game. In the Centipede Game, backward induction says "stop immediately," but experimental economics shows people often cooperate for several rounds before defecting.
