answer: |-
  Right, let's cut through the philosophy and look at the architecture. Your mate isn't wrong about the theory, but he's likely glossing over the implementation details where the actual bugs live. The textbook version of coherence (Expected Utility Theory) assumes a "total ordering" — that for any two options A and B, you must say either A is better, B is better, or they're equal.

  You're building a system with a "partial ordering" — sometimes A and B are just different species of apple, and comparing them feels like a category error.

  Here is the breakdown of where the coherence arguments hold water for your agent, where they leak, and what you actually risk by leaving those preferences incomplete.

  ### 1. The Completeness Assumption: The First Seam
  The standard coherence proof (von Neumann-Morgenstern) hangs on four axioms. The one your friend is implicitly relying on is **Completeness**. It states: *For all A and B, either A ≥ B or B ≥ A.*

  **The Textbook Story:** If you don't have this, you aren't a rational agent.
  **The Engineering Reality:** Completeness is a data constraint, not a law of physics. It forces you to project a scalar value (a single number) onto a multi-dimensional problem.

  **The Seam:** The mathematical proof assumes that if you *can't* rank them, you are *indifferent* between them. In your code, these are distinct states.
  *   **Indifference:** `score(A) == score(B)`.
  *   **Incomparability:** `compare(A, B) returns NULL`.

  The money pump exploit only works if your agent treats `NULL` as "willing to swap for a penny." If your agent treats `NULL` as "refuse to trade," the classic pump fails. The vulnerability isn't the incompleteness itself; it's how your error handling deals with the `NULL`.

  ### 2. The Exploit Surface: Where You Actually Lose Money
  You asked what exploits survive when preferences are incomplete. There are two main vectors.

  **Vector A: The Transitivity Leak**
  Even with incomplete preferences, **Transitivity** (if A > B and B > C, then A > C) must hold. If your agent violates this, you can be pumped regardless of completeness.
  *   *Scenario:* Your agent prefers Task A over B (higher revenue), B over C (lower risk), but C over A (better client relationship).
  *   *Exploit:* An adversary offers to swap C for B (agent pays £1), then B for A (agent pays £1), then A for C (agent pays £1). The agent ends up back at C, minus £3.
  *   *Verdict:* This is a hard bug. You must enforce transitivity on the comparisons you *do* make.

  **Vector B: The "Small Cost" Pump (Specific to Incompleteness)**
  This is the one relevant to your wrinkle. It targets the gap between "incomparable" and "indifferent."
  *   *Scenario:* The agent faces Option A and Option B. They are incomparable.
  *   *The Trap:* If your logic allows the agent to switch from A to B for a trivial cost (because "why not?"), and then from B back to A for a trivial cost (because "why not?"), you have built a money pump.
  *   *The Seam:* This happens if your code implements a "default to swap" or "random tie-break" on incomparable items *when there is a transaction cost involved*.
  *   *Verdict:* If your agent has a "status quo bias" (i.e., if A ? B, stick with A), the pump is broken. You are safe from exploitation, but you introduce inertia.

  ### 3. What You Give Up (The Price of Incompleteness)
  If you decide to keep the preferences incomplete to avoid forcing false trade-offs, you pay a price in capability.

  **1. Optimisation becomes local, not global.**
  Standard Expected Utility maximisation lets you scan the whole horizon and pick the peak. With incomplete preferences, you can only identify the "Pareto frontier" — the set of options where nothing is strictly better than them. You can't pick *the* best one, only the set of *non-dominated* ones.
  *   *Practical Upshot:* Your agent might stall when faced with two high-value, incomparable options. It needs a tie-breaking heuristic that *isn't* based on preference (e.g., "pick the one processed first" or "pick randomly").

  **2. Planning is harder.**
  If you want the agent to plan a sequence of actions (A then B then C), you need to know how it values the outcome of C compared to the start. If preferences are incomplete, the agent might not be able to evaluate whether the plan is an improvement overall.
  *   *Practical Upshot:* You may need to restrict the agent to myopic (one-step) decisions, or define a separate "meta-utility" function just for planning that overrides the incomplete preferences.

  **3. Vulnerability to "Framing".**
  Without a consistent scoring function, the order in which options are presented can change the outcome. If you present A then B, the agent keeps A (status quo). If you present B then A, it keeps B.
  *   *Practical Upshot:* Your API or input pipeline effectively becomes the decision-maker. If the order of tasks in the queue is determined by an external user, they can manipulate the agent's choice without changing the options, just the sort order.

  ### 4. To Force or Not to Force?
  Here is the decision matrix for your side project.

  **Force Completeness (Build a Scalar Utility Function)**
  *   **Do this if:** The agent needs to make high-frequency, autonomous trades where latency matters, and you can tolerate "hallucinated precision."
  *   **The Cost:** You have to weight dimensions (e.g., how much risk is worth how much revenue?). This often requires arbitrary constants that break when the distribution shifts.
  *   **Risk:** You embed brittle value judgements. If the market changes, your weights might cause the agent to do something catastrophic that looks "optimal" on paper.

  **Keep Incompleteness (Partial Ordering)**
  *   **Do this if:** The stakes of a wrong trade-off are high, or the dimensions are genuinely orthogonal (e.g., "profit" vs "ethical compliance").
  *   **The Cost:** You must implement a robust "default" policy for incomparable pairs to prevent inertia or framing exploits.
  *   **Risk:** The agent appears indecisive. You need to handle the `NULL` case explicitly in the control flow.

  ### 5. Practical Recommendations
  Since you're the one writing the code, here is how you seal the seams without buying the whole philosophy package:

  1.  **Enforce Transitivity Rigorously:** Even if you allow incomparability, ensure that if `A > B` and `B > C`, your code asserts `A > C`. Use a topological sort or a dependency graph to check this during testing.
  2.  **Implement a "Status Quo Bias" for Incomparables:** When `compare(A, B)` returns `NULL`, the default action should be *no trade*. Do not allow a swap unless there is a strict preference. This kills the money pump.
  3.  **Audit the Tie-Breakers:** If you must pick between incomparable options (to avoid stalling), use a random seed or a round-robin scheduler. Do *not* use a secondary preference metric that you haven't validated for coherence, or you'll just re-introduce the cycle elsewhere.
  4.  **Isolate the Valuation Logic:** Keep the "scoring" of individual dimensions separate from the "comparison" logic. This makes it easier to spot when a change in one dimension (e.g., risk model) inadvertently flips a preference order in a way that creates a cycle.

  ### Summary
  Your mate is right that incoherence *can* lead to exploitation, but he's assuming your agent behaves like a human with inconsistent impulses. In code, you control the impulse.

  If you treat "incomparable" as "indifferent + willing to pay to switch," you will get pumped.
  If you treat "incomparable" as "no relation + refuse to switch," you are safe from pumps, but you sacrifice global optimisation and introduce path dependence.

  For a backend system, the latter is usually the better trade. It's easier to debug inertia than it is to debug why your agent paid £500 to end up exactly where it started. Don't force a total ordering unless you have the data to back up the trade-offs; just lock down the swap logic so the gaps don't leak value.
