answer: |-
  ### (a) Essay Question

  **Time Allowed:** 90 Minutes
  **Question:**

  Referencing the Calvente scenario provided, evaluate the legitimacy of the new government's decision to reopen the 300 files. Do not discuss whether the original Truth Commission was desirable; assume the 2004 settlement is the baseline legal reality.

  Your answer must determine **which specific categories of defendants** (if any) may be prosecuted without violating the rule of law, and on **what legal or normative principle** that distinction rests. You must explicitly address:
  1.  The beneficiaries' claim that the state cannot rewrite a political bargain.
  2.  The victims' claim that the state cannot trade away the right to a remedy.
  3.  The specific interaction between the "provisional vesting" rule, the "forfeiture clause," and the principle of non-retroactivity.

  *Note: Answers that rely on general "peace versus justice" theorizing without applying the specific terms of the Calvente settlement will be penalized.*

  ***

  ### (b) Model Answer

  The legitimacy of the Calvente prosecutions turns not on the moral weight of the original amnesty, but on whether the defendants fulfilled the specific conditions required to secure it. The central error in the beneficiaries' argument is conflating the *validity* of the amnesty scheme with the *enforcement* of its conditions. While victims' groups argue the state lacked the power to trade away remedies, and beneficiaries argue the state cannot rewrite bargains, both miss the contractual nature of the Calvente settlement. The amnesty was not a blanket pardon; it was a conditional exchange of truth for immunity.

  Legitimate prosecution depends on distinguishing between defendants who complied with the disclosure terms and those who committed fraud. The principle of *nullum crimen sine lege* (no crime without law) prohibits retroactive criminalization, but it does not protect fraud. If a beneficiary concealed their role as a planner, they failed to meet the "full account" requirement necessary for the amnesty to vest. In this view, prosecuting them is not retroactive; it is the enforcement of the original 2004 terms. The amnesty never legally attached to them because the condition precedent (truthful disclosure) was never met. Therefore, for the subset of the 300 files involving demonstrable fraud regarding planning roles, prosecution is legitimate.

  However, the ten-year forfeiture clause complicates this. The settlement stipulated forfeiture if a beneficiary was "shown to have concealed" within ten years of the report. The prosecutions are occurring fourteen years post-report. A strict textualist reading suggests the state's right to revoke amnesty expired. Yet, a purposive interpretation suggests the ten-year window applies to *administrative* revocation based on new evidence of known acts, whereas fraud vitiates the grant *ab initio*. If the defendants lied to obtain the status, they were never beneficiaries. Thus, the ten-year limit should not shield fraudulent actors, though it might protect those whose disclosures were truthful but whose acts are now re-characterized as "planning" by a new political majority.

  Consequently, the state cannot prosecute based solely on a new political definition of "planning." That would be an impermissible retroactive rewrite of the bargain, validating the beneficiaries' concern about state continuity. However, the state *can* prosecute where there is evidence of active concealment. This navigates the victims' claim: the state did not trade away the right to a remedy; it suspended it conditionally. When the condition (truth) is breached, the remedy revives.

  Ultimately, prosecutions are legitimate only where the government proves the defendant lied to the Commission, not merely where the government now disagrees with the Commission's findings. This preserves the rule of law by honoring the original settlement's text while denying immunity to those who secured it through deception. The distinction rests on fraud, not on a moral reassessment of the amnesty's justice.

  ***

  ### (c) Marking Scheme (Out of 20)

  | **Must-Hit Move** | **Marks** | **Typical Error (How to spot a B-grade)** |
  | :--- | :---: | :--- |
  | **1. Distinguishes Validity from Enforcement**<br>Rejects the argument that because the amnesty was morally "unjust," it is automatically legally "void." Acknowledges the settlement as the binding baseline. | **4** | Candidate argues the amnesty was "illegitimate" under international law and therefore stops analysis there, treating "unjust" as synonymous with "void." |
  | **2. Analyzes the Conditional Contract**<br>Identifies that amnesty was contingent on "full account" and "truth," not merely participation. Treats the settlement as a bilateral obligation, not a state gift. | **4** | Candidate treats amnesty as a one-way pardon granted by the state, ignoring the beneficiary's duty to disclose fully as a condition of immunity. |
  | **3. Nuances Retroactivity (Fraud vs. Law)**<br>Argues that prosecuting fraud is not "retroactive justice" because the immunity never vested. Distinguishes this from changing the definition of crimes after the fact. | **4** | Candidate treats retroactivity as a binary switch (either all prosecutions are retroactive or none are), failing to see that fraud removes the shield *ab initio*. |
  | **4. Applies the Forfeiture/Timeline Constraint**<br>Grapples with the 10-year vs. 14-year discrepancy. Argues either that fraud tolls the limit or that the limit applies only to non-fraudulent breaches. | **4** | Candidate ignores the 10-year clause entirely or argues it bars *all* prosecutions without considering the fraud exception. |
  | **5. Categorizes Defendants**<br>Concludes that *some* prosecutions (liars/planners) are legitimate while others (truthful/low-level) are not, based on the evidence of concealment. | **4** | Candidate concludes either *all* 300 prosecutions are valid (new democracy mandate) or *none* are (pacta sunt servanda), failing to distinguish between the files. |

  **Total: 20 Marks**

  **Grading Note:** To achieve an A (17-20), the essay must successfully execute Move 3 and Move 5. A B-grade essay (13-16) will typically succeed on Moves 1 and 2 but collapse into generalizations on retroactivity or fail to distinguish between the specific defendants in the 300 files.
