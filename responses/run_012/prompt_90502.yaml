answer: |-
  ### Preliminary Conceptual Framing

  Before settling on the proposal's core argument, I considered three ways to sharpen the "luck-exposure" concept.

  1.  **Exposure as a Primary Good:** We could treat "robustness" as a Rawlsian all-purpose means. Institutions should maximize the minimum level of resilience everyone possesses. *Weakness:* This divorces the project from luck egalitarianism's core commitment to neutralizing *arbitrariness*. It becomes a sufficiency view, losing the comparative bite needed to critique the Dworkin insurance model.
  2.  **Exposure as a Responsibility Constraint:** We could argue that high luck-exposure negates responsibility. If your life is too fragile, you cannot be held accountable for failures. *Weakness:* This is defensive. It only tells us when *not* to blame, not how to structure society positively. It leaves the distribution of exposure itself unaddressed.
  3.  **Exposure as the Currency of Justice (Selected):** We argue that the *distribution of vulnerability* is the primary site of injustice, not the distribution of resources at a snapshot. Justice requires equalizing the *slope* of the cliff, not just compensating those who fell. This retains the luck egalitarian focus on arbitrariness but shifts the temporal focus from backward-looking compensation to forward-looking structural design. It directly addresses the Dworkin puzzle: insurance markets price exposure, punishing the vulnerable for their vulnerability; a justice-as-resilience model forbids pricing exposure in the first place.

  I will proceed with the third framing. It offers the strongest theoretical leverage and the clearest institutional implications.

  ***

  ### Project Proposal: The Architecture of Luck
  **Reorienting Egalitarianism from Compensation to Exposure**

  **The Research Question**
  Current luck egalitarianism asks: "How do we compensate for unchosen deficits?" This project asks: "How much should institutions permit a life to depend on luck?" I argue for a determinate answer: The primary demand of justice is the **ex ante minimization of luck-exposure**, not the ex post compensation of bad outcomes.

  This distinction changes what the theory requires of institutions. A compensation-focused model favors tax-and-transfer systems that allow high volatility in exchange for high safety nets (a "high risk, high bailout" regime). An exposure-focused model favors structural resilience: labor protections, universal basic services, and stability mechanisms that prevent the shock from occurring or biting as hard. The question is not whether we pay for the fall, but whether we build the ledge.

  **Why Standard Positions Do Not Settle This**
  Three dominant frameworks fail to capture the normative significance of exposure.

  First, **responsibility-sensitive egalitarianism** focuses on the *source* of inequality (luck vs. choice). It assumes that if two people have equal resources, they are equally treated, even if one's resources are in volatile stocks and the other's in stable bonds. It misses that the *risk profile* itself can be arbitrarily distributed.
  Second, **relational egalitarianism** objects that luck egalitarianism abandons the imprudent. However, relationalists focus on status and hierarchy. They miss the specific injustice of *precarity*: two people can have equal status and resources, yet one lives in constant anxiety of ruin while the other does not.
  Third, the **ex ante/ex post debate** in welfare economics argues over *when* to measure equality (before or after risks resolve). This project argues that *what* we measure is wrong. We should not be measuring expected welfare or realized welfare, but the *sensitivity* of welfare to stochastic events.

  **Methodology and Work Plan**
  This is a conceptual project, not empirical. I will use reflective equilibrium, testing the "exposure" principle against intuition pumps and existing theoretical constraints.

  *   **Months 1–3: Conceptual Architecture.** I will define "luck-exposure" precisely. Is it objective probability or subjective security? I will distinguish *chosen risk* (gambling) from *structural exposure* (gig economy work). I will draft the core argument: that vulnerability itself is a brute luck disadvantage, even if no bad luck has yet struck.
  *   **Months 4–6: Case Testing.** I will test the view against "The Cliff and The Plateau." Two agents have equal wealth. Agent A can absorb a 50% income shock without lifestyle change; Agent B faces ruin from a 10% shock. Standard luck egalitarianism sees no injustice. I will argue this is a moral blind spot. I will also test the "Dworkin Insurance" puzzle: if premiums are risk-adjusted, the exposed pay more to be less exposed. I will demonstrate why this is circular and unjust under an exposure framework.
  *   **Months 7–9: The Responsibility Objection.** The hardest challenge: What if someone *chooses* high exposure? (e.g., an artist choosing a precarious career). I will develop a "baseline resilience" threshold. Society must guarantee a floor of robustness; above that floor, individuals may choose volatility. This preserves agency without permitting structural coercion into vulnerability.
  *   **Months 10–12: Institutional Implications and Drafting.** I will translate the theory into institutional requirements. Does this require universal healthcare? Yes, not because health is a need, but because illness is a major source of unchosen exposure. Does it require employment law? Yes, to prevent arbitrary dismissal. I will complete the full manuscript draft.

  **Success and Failure Conditions**
  A successful result produces a theory that solves the Dworkin insurance paradox without abandoning the distinction between luck and choice. It must show that minimizing exposure is distinct from maximizing equality of resources.
  The project fails if "exposure" collapses into "expected value." If minimizing exposure is mathematically identical to maximizing average expected welfare over a lifetime, the project adds no value. I must prove that people care about *variance* independently of *mean* outcomes for moral reasons.
  The project also fails if the "baseline resilience" threshold proves impossible to define without paternalism. If I cannot distinguish between structural exposure and chosen risk without dictating life plans, the theory is untenable.

  **Timeline Assessment**
  Is this a one-year or five-year project?
  The **theoretical framework** (defining exposure, solving the Dworkin puzzle, handling responsibility) is a one-year project. It requires rigorous argumentation but no new data.
  However, the **institutional application** (translating resilience into specific policy across different sectors like health, labor, and finance) is a five-year project.
  For this fellowship, I am committing to the theoretical framework. The deliverable will be a manuscript establishing the moral primacy of exposure-minimization. This provides the necessary foundation for future work on specific policy domains. Attempting to solve the policy details now would dilute the philosophical rigor; attempting to solve only the philosophy without outlining the institutional shift would render the project abstract and inert. This proposal strikes the balance: a complete moral theory with a clear, if preliminary, institutional map.
