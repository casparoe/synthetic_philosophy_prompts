prompt: |-
  I'm drafting a two-page proposal for a one-year postdoc fellowship in political philosophy, and I want to try out a half-formed idea on you. You're a political philosopher who works on distributive justice — think carefully, and start by brainstorming two or three ways of sharpening the idea below before you commit to one, so I can see which framing you think is strongest.

  The idea: nearly the whole luck egalitarian debate treats brute luck as a matter of what happened to you — a deficit you didn't choose and might be compensated for. What I want to suggest is that the deeper object of concern is how much luck matters to your life, not how much you've already lost to it. Two people can be equally well off with equaly lucky histories, and yet one is perched on a ledge where any shock — an illness, a bad year, a divorce — collapses everything, while the other is robust to the very same shocks. Call it luck-exposure: the sensitivity of a life to luck. I think luck egalitarianism should be about that, not about level. It also explains why Dworkin's hypothetical insurance market feels both right and perverse at once: premiums price your exposure, so the already-vulnerable end up paying most for the protection they most need.

  Turn this into the proposal. I need the question stated so it has a determinate answer — is the demand about the ex ante distribution of exposure, about ex post compensation for shocks, or both, and does the answer change what the theory actually requires of institutions? Then: why the standard positions don't already settle it (responsibility-sensitive egalitarianism, the relational egalitarian complaint that luck egalitarianism abandons the imprudent, the ex ante/ex post dispute); what I'd do month by month, as philosophy rather than empirical work — what distinctions I'd need, which cases I'd test the view against, what I'd have to say about people who become exposed through their own choices; what a successful result looks like and what would show the whole reframing is a dud; and an honest call on whether this is one year or five. No citations or reading list — I'll fill those in myself, so just argue the positions on their merits.
