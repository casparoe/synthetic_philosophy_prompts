  So I've been following the constitutional court of Alderia — fictional country, made-up case names, so don't bother trying to recall them, I'm inventing them — and its election-law track record goes like this. Ferrer: struck down a law that gave extra votes to property owners, on the ground that a vote is a vote and wealth can't multiply it. Okonkwo: upheld a rule that only citizens may vote in national parliamentary elections. Bautista: struck down the exclusion of non-citizen permanent residents from municipal elections, reasoning that people who pay the local taxes and have to obey the local ordinances get a say in making them — the court put it as the franchise following the burden. Lindqvist: upheld keeping people in prison for serious crimes off the rolls while they're inside. Nakamura: struck down lifetime disenfranchisement of ex-felons after release, saying the presumption of full membership comes back once you're back in the community. Deveraux: upheld the 18-year voting age against a challenge from 17-year-olds, though a concurrence argued the line should track the age at which someone is ordinarily answerable for the full range of adult legal duties, which it took to be 18.

  Now there's a new case. The statute does three things at once: it drops the voting age to 16 in all elections, lets non-citizen permanent residents vote in national as well as local elections, and makes voting compulsory with a small fine. The challengers say the whole package is unconstitutional; the government says every piece is fine.

