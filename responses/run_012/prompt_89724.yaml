answer: |-
  Based on the six precedents provided, here is the analysis of the new statute, the underlying doctrinal rules, and the theoretical boundaries of the Alderian Constitutional Court.

  ### 1. The Ruling on the Three Pieces

  **Piece 1: Lowering Voting Age to 16 (All Elections)**
  *   **Prediction:** **Unconstitutional (Struck Down).**
  *   **Reasoning:** This is controlled by *Deveraux*. While *Deveraux* upheld the age of 18, it did not explicitly mandate it. However, the controlling rationale in the concurrence—which the Court often treats as the guiding principle in close calls—is that the franchise should track the age at which one is "answerable for the full range of adult legal duties." In most legal systems (including fictional Alderia), 16 is not the age of full majority (contracts, full criminal liability, etc.). Therefore, 16-year-olds lack the "full membership" status required by *Nakamura* and *Deveraux*.
  *   **Closest Analog:** *Deveraux* (Directly addresses age thresholds and legal maturity).

  **Piece 2: Non-Citizen Permanent Residents in National Elections**
  *   **Prediction:** **Unconstitutional (Struck Down).**
  *   **Reasoning:** This directly contradicts *Okonkwo*. *Okonkwo* established a bright-line rule: national parliamentary sovereignty is reserved for citizens. *Bautista* carved out an exception for *municipal* elections based on local burdens (taxes/ordinances), but it explicitly distinguished national power. To allow non-citizens to vote nationally would require overruling *Okonkwo*, which the Court is unlikely to do without a stronger signal. The "franchise follows burden" principle (*Bautista*) yields to the "national sovereignty" principle (*Okonkwo*) at the federal level.
  *   **Closest Analog:** *Okonkwo* (Directly addresses non-citizen voting in national elections).

  **Piece 3: Compulsory Voting with a Fine**
  *   **Prediction:** **Constitutional (Upheld).**
  *   **Reasoning:** There is no direct precedent, but the logic of *Bautista* ("franchise follows the burden") supports this. If the Court views voting as a right derived from the obligation to obey laws and pay taxes, it can reasonably classify voting as a civic duty analogous to taxation or jury service. *Ferrer* protects the *weight* of the vote, not the right to abstain. *Nakamura* speaks of a "presumption of membership," which implies participation in the community. Unlike the age and citizenship restrictions (which *exclude* members), compulsion *enforces* participation among members, which fits the "Burden" rationale.
  *   **Closest Analog:** *Bautista* (Conceptually links voting to civic obligation/burden).

  ---

  ### 2. The Underlying Rules and Where They Split

  The Court's jurisprudence oscillates between two competing constitutional theories. Both fit the past six cases, but they produce opposite results on the new statute.

  **Rule A: The "Formal Membership" Principle**
  *   **Source:** *Okonkwo, Deveraux, Nakamura.*
  *   **Logic:** Voting is a marker of **status**. It belongs to those who hold the formal legal status of "Full Member" (Adult + Citizen + Non-Criminal).
  *   **Application to New Case:**
      *   **Age 16:** Strike (Not full adult status).
      *   **Non-Cit National:** Strike (Not citizen status).
      *   **Compulsion:** Strike (Membership confers rights/liberties, not duties; forcing a member to vote violates their autonomy).
  *   **Result:** Strike All Three.

  **Rule B: The "Functional Burden" Principle**
  *   **Source:** *Bautista, Lindqvist (inverse), Deveraux (concurrence).*
  *   **Logic:** Voting is a function of **subjection**. If the state has power over you (you pay taxes, obey laws, reside in the territory), you must have a say, and you may be required to participate to legitimize that power.
  *   **Application to New Case:**
      *   **Age 16:** Upheld (If 16-year-olds work/pay taxes/obey laws, they bear the burden).
      *   **Non-Cit National:** Upheld (Permanent residents pay national taxes and obey national laws).
      *   **Compulsion:** Upheld (Voting is the counterpart to the burden of obedience; therefore, it is mandatory).
  *   **Result:** Upheld All Three.

  **Where They Split:**
  The split occurs on **Piece 2 (Non-Citizen National Voting)**. *Okonkwo* (Rule A) says "No," while *Bautista* (Rule B) implies "Yes." The Court has historically managed this split by jurisdiction (Local = Burden, National = Status), but the new statute forces them to choose one master for national elections. My prediction assumes they stick to the *Okonkwo* bright line for stability, even if *Bautista*'s logic pulls the other way.

  ---

  ### 3. The "Tie-Breaker" Case

  To cleanly separate Rule A (Status) from Rule B (Burden), the Court needs a case where **Burden exists without Status.**

  **Hypothetical Case:** *Alderia v. Rostova* (The "Non-Citizen Jury Duty" Case).
  *   **Facts:** A non-citizen permanent resident challenges a summons for mandatory jury duty, arguing that jury service is a privilege of citizenship.
  *   **Why it Separates the Rules:**
      *   **If the Court Upholds the Summons:** It confirms that **Burden** applies regardless of **Status**. This strengthens *Bautista* and Rule B, making Non-Citizen National Voting (Piece 2) and Compulsory Voting (Piece 3) much more likely to be upheld in the future.
      *   **If the Court Strikes the Summons:** It confirms that **Civic Duties** are reserved for **Citizens**. This strengthens *Okonkwo* and Rule A, making Non-Citizen National Voting impossible and casting doubt on Compulsory Voting (if voting is a duty, only citizens should be forced to do it).

  ---

  ### 4. Consistency Check: Is there a reading for "All or Nothing"?

  **Yes.** As outlined in the "Underlying Rules" section above, the Court can be entirely consistent by adopting one of two philosophical lenses.

  **Reading 1: The "Civic Republican" Lens (Uphold All Three)**
  If the Court views the Constitution as establishing a **Community of Obligation**, then:
  1.  Anyone subject to the law (16-year-olds, residents) must participate (Uphold Age & Non-Cit).
  2.  Participation is a duty necessary for the community's function (Uphold Compulsion).
  *   *Consistency:* High. It treats voting as a job you do because you live here.

  **Reading 2: The "Liberal Rights" Lens (Strike All Three)**
  If the Court views the Constitution as establishing a **Shield for Individuals**, then:
  1.  Voting is a protected right reserved for those with full legal capacity (Strike Age & Non-Cit).
  2.  Rights cannot be mandated; a free citizen must be allowed to abstain (Strike Compulsion).
  *   *Consistency:* High. It treats voting as a privilege of protected status that includes the right to silence.

  **Conclusion:**
  The Court's past six cases are a mosaic of both theories. *Ferrer, Nakamura,* and *Okonkwo* lean Liberal/Status. *Bautista* and *Lindqvist* lean Republican/Burden. The new case forces them to pick a lane. My prediction (Strike, Strike, Uphold) suggests they will remain inconsistent, protecting the *Status* boundary for who votes (*Okonkwo/Deveraux*) while enforcing the *Burden* logic on how they vote (*Bautista*).
