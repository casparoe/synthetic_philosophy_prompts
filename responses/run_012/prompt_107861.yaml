answer: |-
  **Exam Question: Concepts and Induction**
  **Time:** 40 Minutes
  **Marks:** 20

  **The Problem**
  Below are descriptions of twelve boxes. In every box, there are exactly three geometric shapes arranged in a row (Position 1, Position 2, Position 3). The shapes used are Circles (C), Squares (S), and Triangles (T).

  *Left Side:*
  1. C C C
  2. S S S
  3. T T T
  4. C C C
  5. S S S
  6. T T T

  *Right Side:*
  1. C S T
  2. S T C
  3. T C S
  4. C T S
  5. S C T
  6. T S C

  *The Thirteenth Box:*
  A B A (Where A and B are different shapes, e.g., Circle Square Circle).

  **The Task**
  1.  State the **Intended Rule** that separates Left from Right. Verify it fits all twelve boxes.
  2.  State a **Stowaway Rule** (an alternative hypothesis) that also fits all twelve boxes perfectly but differs from the Intended Rule. Verify it fits all twelve.
  3.  Classify the **Thirteenth Box** according to both rules. What does the visual data of the original twelve boxes *alone* license you to conclude about this thirteenth case?
  4.  Explain what work is required to privilege the Intended Rule over the Stowaway. In your explanation, distinguish between claims that are settled matters of fact (arithmetic/logic) and claims that are contested philosophical positions (e.g., regarding intention or naturalness).

  ***

  **Model Answer**

  The **Intended Rule** is: *All three shapes in the box are identical.*
  On the Left, every box contains three of the same shape (CCC, SSS, TTT). This holds for all six Left boxes. On the Right, every box contains three distinct shapes (CST, STC, etc.). No Right box contains three identical shapes. The rule fits the data perfectly.

  The **Stowaway Rule** is: *The shape in Position 1 is identical to the shape in Position 3.*
  On the Left, because all shapes are identical, Position 1 always matches Position 3 (e.g., in CCC, C=C). This holds for all six Left boxes. On the Right, the permutations are such that the first and last shapes always differ (e.g., in CST, C≠T). This holds for all six Right boxes. The Stowaway fits the data perfectly.

  Regarding the **Thirteenth Box (ABA)**:
  Under the Intended Rule (All identical), ABA is **Right** (not all shapes are identical).
  Under the Stowaway Rule (Ends match), ABA is **Left** (A matches A).
  The twelve original boxes *alone* license no conclusion about the thirteenth. Logically, the finite dataset is consistent with infinitely many rules, including these two contradictory ones. To assert the Intended Rule is correct based solely on the twelve boxes is a logical error; the data underdetermine the rule. This underdetermination is a settled matter of fact, akin to arithmetic.

  Privileging the Intended Rule requires resources external to the data. First, there is a **representational** difference. The Stowaway relies on fixed positions (slots 1 and 3), akin to a classifier with a fixed feature set. The Intended Rule requires a quantified relation over the set ("for all x, y..."), a vocabulary shift that looks for global uniformity rather than local features.
  Second, we rely on a shared sense of **simplicity or naturalness**. "Uniformity" feels like a coherent concept; "Ends Match" feels like a coincidence of this specific dataset. However, asserting that "naturalness" tracks truth is a contested philosophical position, not a fact.
  Finally, many argue the **drawer's intention** fixes the rule. If a human constructed the puzzle, they meant one rule. Yet, denying that intention matters (claiming only the pattern exists) is also a defensible position. The robust consensus is not on *why* we prefer the Intended Rule, but *that* we do. The puzzle demonstrates that induction is not merely fitting data, but selecting the hypothesis that projects beyond the sample, guided by constraints on vocabulary and assumptions about the source.

  ***

  **Marking Scheme**

  **Total:** 20 Marks

  **1. Identification and Verification (6 Marks)**
  *   **3 Marks:** Correctly states Intended Rule (Uniformity/Identity) and explicitly notes it holds for all 12 boxes.
  *   **3 Marks:** Correctly states a valid Stowaway (e.g., Pos 1 = Pos 3) and explicitly notes it holds for all 12 boxes.
  *   *How students blow it:* Proposing a Stowaway that fails on one of the Right boxes (e.g., "Left has Circles" fails on L2/L3). Failing to explicitly verify the fit, assuming the rule is obvious.

  **2. The Thirteenth Box and Licensing (4 Marks)**
  *   **2 Marks:** Correctly classifies ABA differently under the two rules (Left vs Right).
  *   **2 Marks:** Explicitly states that the original 12 boxes *alone* do not license a conclusion (underdetermination).
  *   *How students blow it:* Claiming the 13th box "obviously" goes Right. Treating the Intended Rule as logically forced by the data rather than selected.

  **3. Resolving the Ambiguity (6 Marks)**
  *   **3 Marks:** Discusses the representational/vocabulary shift (e.g., global relation vs. fixed slots/features).
  *   **3 Marks:** Discusses the role of intention, simplicity, or projectability in breaking the tie.
  *   *How students blow it:* Vague appeals to "human intuition" without explaining the mechanism (e.g., feature sets). Claiming simplicity *proves* the rule rather than justifies preference.

  **4. Epistemic Distinction (4 Marks)**
  *   **2 Marks:** Identifies underdetermination as a settled fact/logic.
  *   **2 Marks:** Identifies the resolution (intention/naturalness) as a contested philosophical position.
  *   *How students blow it:* Treating "Intention resolves it" as an uncontested fact. Treating "Data underdetermine" as a skeptical opinion rather than a logical necessity.

  **The A/B Line**
  The distinction between an A and a B grade rests on **Section 4 (Epistemic Distinction)** and the nuance in **Section 3**. A B-grade student will correctly identify the rules and the underdetermination but will likely slide into saying "The Intended Rule is the correct one because it is simpler," treating simplicity as a truth-maker. An A-grade student will explicitly separate the *logic* (which allows the Stowaway) from the *pragmatics/philosophy* (which excludes it), acknowledging that preferring the Intended Rule is a commitment to a specific theory of concepts (e.g., intention-based or natural-kind-based) rather than a deduction from the evidence. They must show they understand that the "correctness" of the rule is not inherent in the boxes.
