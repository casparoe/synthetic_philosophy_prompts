      *   So the diagnosis needs to highlight: **Causal Impact vs. Complicity/Participation.**
      *   Sam: Morality = Causal Leverage.
      *   User: Morality = Alignment with Right Principles/Patterns.
      *   This is a deontological vs. consequentialist split disguised as a consequentialist debate. Or, more accurately, **Actual Consequentialism vs. Expected Consequentialism.**
      *   Actually, looking closer at the User's prompt: "we're evaluating a practice or a pattern." This sounds like Rule Consequentialism or Kantian universalization.
      *   So the diagnosis is: **Token-Actualism vs. Rule-Expectationism.**

  8.  **Finalizing the Advice:**
      *   Validate the hypothesis: Yes, it's about the unit/object of evaluation.
      *   Refine it: It's specifically about **Actualism vs. Ex Ante Evaluation**.
      *   Progress path: Force Sam to admit whether *risk* matters. If risk matters, causation isn't the only metric. If risk doesn't matter, Sam has to defend why playing Russian Roulette is fine if the gun doesn't fire.
      *   Why it sticks: Deep meta-ethical intuitions about the point of morality.

  9.  **Structure of the Output:**
      *   Direct confirmation of hypothesis (with nuance).
      *   The Technical Diagnosis (Actualism vs. Expectation/Complicity).
      *   The "Hidden" Question (Moral Luck).
      *   Path to Progress (The Risk/Complicity Pivot).
      *   Why it might remain stuck (Foundational Intuitions).

  10. (Final Polish): Ensure tone is analytical, direct, and avoids preaching or listing books. Focus on the structure of the argument. (Self-correction: Make sure to explicitly address the "verbal spat" question). It's not merely verbal because it leads to different action-guidance, but it *is* verbal in the sense that they define "making a difference" differently. I need to be precise there. It's a *substantive normative disagreement* disguised as a semantic/causal one.

  11. (Final check against constraints): Skip reading list. Just diagnosis.

