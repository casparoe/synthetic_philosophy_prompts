answer: |-
  Your hypothesis is correct, but it needs a sharper edge. You are diagnosing this as a disagreement about the **unit of evaluation**, but the deeper fracture is about **moral luck** and the **temporal perspective of judgment**.

  Here is the diagnosis of the stalemate, why it persists, and what would actually count as progress.

  ### 1. The Diagnosis: Actualism vs. Ex Ante Evaluation
  You and Sam are not disagreeing about causation; you are disagreeing about **when** and **on what basis** moral evaluation occurs.

  *   **Sam is a Token Actualist.** For Sam, moral value supervenes on the *actual* state of the world resulting from the act. If the world-state $W_{act}$ is indistinguishable from $W_{no\_act}$ regarding the specific harm, the act has zero moral weight. Sam believes morality tracks **causal leverage**. If you didn't tip the scale, you didn't do the harm.
  *   **You are an Ex Ante Evaluator (or Practice Theorist).** You evaluate the act based on the information available *before* the outcome is settled, or based on the nature of the practice itself. You believe morality tracks **risk, participation, or maxim adoption**. For you, buying the burger is wrong because it is a token of a harmful *type*, regardless of whether that specific token happened to be causally potent in this specific instance.

  **Is it just a verbal spat?**
  No. It is a substantive normative disagreement disguised as a semantic one. You both use the phrase "makes a difference," but:
  *   Sam means: "Is this act a *but-for cause* of a discrete unit of harm in the actual world?"
  *   You mean: "Is this act a *contribution* to a harmful pattern that has expected disvalue?"

  Because you haven't named this distinction, you keep arguing about physics (causation) when you should be arguing about meta-ethics (the function of moral judgment).

  ### 2. The Hidden Question: Moral Luck
  The reason you agree on the toy cases (599 vs. 300) but disagree on the conclusion is that you have different intuitions about **constitutive moral luck**.

  *   **Sam accepts Moral Luck.** In Sam's view, if you buy the burger at count 300, you are innocent. If you buy it at count 600, you are guilty. The morality of your action depends on facts outside your control (what others did). This is consistent with Token Actualism.
  *   **You reject Moral Luck.** In your view, the agent's moral standing shouldn't hinge on whether they happened to be the pivotal agent. If the practice is harmful, participating in it is wrong, regardless of the accidental causal efficacy of your specific token.

  This is the engine of the stalemate. Sam thinks your view punishes people for things they didn't *cause*. You think Sam's view lets people off the hook for *trying* to participate in harm, provided they got lucky with the timing.

  ### 3. Why It Stays Stuck
  You are stuck because you are arguing from within incompatible normative frameworks while pretending to argue about empirical causality.
  *   When you say "It's about the pattern," Sam hears "I want to ignore reality."
  *   When Sam says "It makes no difference," you hear "I want to ignore responsibility."

  Neither side can win on the "causation" battlefield because you've already agreed on the physics. Sam is right that the token doesn't cause the outcome in the 300 case. You are right that the token belongs to a harmful category. The impasse is that neither of these facts compels the other's moral conclusion without a prior agreement on **what morality is for**. Is it to minimize actual bad states of affairs (Sam)? Or is to govern agency and intention properly (You)?

  ### 4. What Counts as Progress
  To move forward, you must stop arguing about burgers and flights and force a concession on the **structure of judgment**. Do not ask about the burger; ask about **risk**.

  **The "Russian Roulette" Test:**
  Propose this case: *A game where 1,000 people pull a trigger of a gun with 1,000 chambers and 1 bullet. If the bullet fires, someone dies. You pull a trigger. The bullet does not fire.*

  *   **Ask Sam:** "Did you do something wrong?"
      *   **If Sam says "Yes":** He has conceded that *actual causal impact* is not the only metric. He has admitted that *exposure to risk* or *participation in a dangerous practice* carries moral weight. You can then argue that the burger market is simply a probabilistic version of this gun.
      *   **If Sam says "No":** He is committed to the view that playing Russian Roulette is morally neutral provided the gun doesn't go off. This is a very hard pill to swallow. If he bites this bullet, you have successfully diagnosed him as a radical Actualist. You can then agree to disagree on first principles: you believe morality governs *choices*, he believes morality governs *outcomes*.

  **The Concession Needed:**
  Progress looks like Sam admitting: *"I agree that my act has no causal impact in this instance, but I maintain that morality only cares about causal impact."*
  Or you admitting: *"I agree that my act has no causal impact in this instance, and I am arguing that morality should care about something other than causal impact."*

  Once you both admit you are arguing about **whether causation is the sole currency of morality**, the circle breaks. Currently, Sam thinks he is proving you wrong about the *world*. You think you are proving him wrong about the *world*. You are actually disagreeing about the *ledger*.

  ### Summary
  Your hypothesis is right: it is about the unit of evaluation. But specifically, it is a clash between **Actualist Consequentialism** (Sam) and **Expected/Participatory Ethics** (You).

  **To unstick it:** Stop talking about thresholds and burgers. Ask Sam if an agent is blameworthy for imposing a *risk* of harm that fails to materialize. His answer tells you if he is willing to abandon pure causal actualism. If he isn't, you have reached a foundational meta-ethical divergence that no amount of empirical data will resolve.
