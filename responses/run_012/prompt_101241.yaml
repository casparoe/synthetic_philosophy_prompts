answer: |-
  # The Disease Definition Decision Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your character's intuition about the specific case provided. Follow the arrow to the next Node or to a Final Position (Leaf).

  ---

  ### Node 1
  **Case:** A patient has **asymptomatic high cholesterol**. Their biology is statistically abnormal, but they feel perfectly fine and function normally.
  **Question:** Do we label this patient "diseased" on their chart?

  *   **"It depends on who is asking (insurer vs. patient)."** → Go to **Leaf 1**.
  *   **"Yes, absolutely."** → Go to **Node 2**.
  *   **"No, not without symptoms."** → Go to **Node 3**.

  ---

  ### Node 2
  **Case:** A patient has a **rare genetic mutation** that makes them immune to HIV. It is statistically abnormal biology.
  **Question:** Do we try to "cure" or "fix" this mutation?

  *   **"Yes, because it deviates from the species norm."** → Go to **Leaf 2**.
  *   **"No, because the body is working better than usual."** → Go to **Leaf 3**.

  ---

  ### Node 3
  **Case:** A patient is suffering from **prolonged grief**. It causes immense harm, but scans show no biological "break" or malfunction.
  **Question:** Do we prescribe medication to treat this as a medical condition?

  *   **"Yes, because the suffering is real."** → Go to **Node 4**.
  *   **"No, we need a biological malfunction too."** → Go to **Leaf 4**.

  ---

  ### Node 4
  **Case:** Consider **homosexuality in 1950**. It caused immense social suffering and harm, but the biology was identical to today.
  **Question:** Was the doctor right to diagnose it as a disease back then?

  *   **"Yes, because it was a harmful condition at the time."** → Go to **Leaf 5**.
  *   **"No, because the biology wasn't broken."** → Go to **Node 5**.

  ---

  ### Node 5
  **Case:** Consider **aging**. It involves biological decline and harm, but it is universal to the species.
  **Question:** Do we bill insurance for "anti-aging" treatments as disease prevention?

  *   **"No, health is about adapting to the decline."** → Go to **Leaf 6**.
  *   **"Yes, because it breaks us down."** → Go to **Node 6**.

  ---

  ### Node 6
  **Case:** If we classify **aging** as a disease, the word "disease" now applies to every human alive.
  **Question:** Does the word "disease" still do any useful work in this committee?

  *   **"No, we should scrap the word entirely."** → Go to **Leaf 7**.
  *   **"Yes, it helps us allocate resources."** → Go to **Leaf 8**.

  ---

  ### The Positions (Leaves)

  **Leaf 1: The Pluralist**
  *   **Position:** There is no single definition; "disease" means different things in different contexts.
  *   **The Hard Pill:** You must accept that truth is inconsistent: a patient can be "sick" for the bank but "healthy" for the nurse.

  **Leaf 2: The Actuary (EMPTY BRANCH)**
  *   **Position:** Disease is simply any statistical deviation from the average.
  *   **The Hard Pill:** **Warning:** Almost no one defends this. You must commit to calling genius-level intelligence or perfect immunity a "disease" just because it is rare.

  **Leaf 3: The Engineer (Hard Naturalist)**
  *   **Position:** Disease is a value-free biological malfunction, regardless of how the patient feels.
  *   **The Hard Pill:** You must label asymptomatic people as "broken" even if they live full, happy lives without treatment.

  **Leaf 4: The Gatekeeper (Hybrid View)**
  *   **Position:** Disease requires *both* a biological malfunction *and* harm to the patient.
  *   **The Hard Pill:** You must deny the title of "disease" to some suffering people (like severe grief) if their biology looks normal.

  **Leaf 5: The Relativist (Hard Normativist)**
  *   **Position:** Disease is purely a value judgment about unwanted conditions; biology is secondary.
  *   **The Hard Pill:** You must admit that a condition can turn into a disease (or back) without any biological change, solely because society changed its mind.

  **Leaf 6: The Gardener (Vitalist/Adaptation)**
  *   **Position:** Health is not normality, but the organism's capacity to adapt to its environment and set new norms.
  *   **The Hard Pill:** You must view aging or disability not as errors to be fixed, but as new environments the patient must be empowered to navigate.

  **Leaf 7: The Skeptic (Eliminativist)**
  *   **Position:** The concept of "disease" is too messy to be saved; we should stop using it in ethics discussions.
  *   **The Hard Pill:** You have to argue that your entire committee is debating a word that should be thrown in the trash.

  **Leaf 8: The Pragmatist (Instrumentalist)**
  *   **Position:** Definitions are tools, not truths; we define disease by what gets the job done.
  *   **The Hard Pill:** You must accept that you might call something a "disease" today to get funding, and not tomorrow, without contradicting yourself.

  ---

  ### Notes for the Novelist

  **1. Indistinguishable Leaves:**
  *   **The Pluralist (Leaf 1) vs. The Pragmatist (Leaf 8):** These are nearly identical in practice. The Pluralist thinks the *meaning* changes; the Pragmatist thinks the *usage* changes. In a heated room, they will sound the same. Use this if you want two characters to agree on a solution but argue about why.
  *   **The Gardener (Leaf 6) vs. The Gatekeeper (Leaf 4):** Both often refuse to label aging or grief as disease. The Gatekeeper says "No biology broke." The Gardener says "No capacity lost." They will vote the same way but speak different languages.

  **2. The Empty Branch:**
  *   **The Actuary (Leaf 2):** I left this in because your Cardiologist might accidentally slip into it (confusing "abnormal" with "bad"), but if they defend it, the Disability Consultant should tear it apart immediately. It is philosophically unpopular because it classifies beneficial traits as diseases.

  **3. Character Mapping:**
  *   **Cardiologist:** Likely **The Engineer** (Leaf 3) or **The Actuary** (Leaf 2).
  *   **Disability Consultant:** Likely **The Relativist** (Leaf 5) or **The Gardener** (Leaf 6).
  *   **Protagonist (Nurse):** Likely **The Gatekeeper** (Leaf 4) or **The Pluralist** (Leaf 1), stuck between the biology and the suffering.
