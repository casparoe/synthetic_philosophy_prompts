      *   **No:** Thermostat, *E. coli*, Flytrap, Bee, Sphex (All execute fixed action patterns or simple feedback loops).
      *   **Yes:** Rat (learns lever press), Crow (learns wire bend), You (flexible planning).
  *   **Prediction for AI:** **YES.** (The AI explicitly "re-plans when a step fails" and breaks goals into subgoals. It is functionally isomorphic to the Rat/Crow.)

