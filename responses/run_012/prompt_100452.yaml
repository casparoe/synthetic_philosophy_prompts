  **2. The Biological Naturalism Rule (The "Carbon" Test)**
  *   **The Rule:** "Real" rationales require a specific biological substrate (likely vertebrate neurobiology). Evolutionary history and living tissue are necessary conditions for genuine agency; artifacts can only ever simulate it.
  *   **Fits the Data:**
