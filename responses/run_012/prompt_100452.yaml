  **3. The Functional Plasticity Rule (The "Re-planning" Test)**
  *   **The Rule:** A rationale is "real" if the system can generate novel means to an end online, rather than executing a fixed script. The key is *ontogenetic flexibility* (learning/planning within a lifetime) vs. *phylogenetic rigidity* (hardwired by evolution or code).
