  1.  **Let's begin with the most immediate puzzle.** On your view, there is only one object on the pedestal. But if I ask the audience to count the statues, they will say "one," and if I ask them to count the lumps of clay, they will also say "one," and if we add those up, it feels like there are two things there. How do you explain the fact that we seem perfectly able to count the statue and the lump as distinct items without committing ourselves to two distinct objects?

  2.  **Follow-up:** I anticipate you will say that the count depends on the concept we are using to count—that there is no "absolute" number of objects. But if the number of things in the world depends on how we happen to be counting, doesn't that imply that reality itself is indeterminate? Or are you saying that the world is precise, but our access to it is always filtered in a way that makes it look like there are two things?

  3.  **This leads to how you explain the differences between them.** You argue that properties like "could survive being squashed" are not absolute but relative to a classification. What exactly makes this relativity a feature of the *object* rather than just a fact about our descriptions? Why shouldn't we say the object has no modal properties at all, and only our *words* carry the conditions for squashing or surviving?

  4.  **Follow-up:** You will likely reply that the object really does have the kind of history that supports one classification and not the other. But if the object has a history that supports the "lump" classification and a history that supports the "statue" classification, haven't you just smuggled the difference back into the object? If any difference in what is true of the object must be grounded in some difference in the object, aren't you effectively admitting there are two sets of properties, and thus two things?

  5.  **Let's test this against time.** The clay was dug out of the ground before anyone sculpted it. On your view, there is only one object—the statue which is identical to the lump. So, before the sculptor arrived, what was that object? Was it a statue waiting to be made, or was it something else?

  6.  **Follow-up:** If you say the object was there but the *statue* was not, you seem to be distinguishing the object from the statue. But you started by insisting the statue *is* the object. Does your view commit you to saying that the object existed for a time without being a statue, and if so, how can the object be identical to the statue if it has a history the statue does not share?

  7.  **I want to ask about the stakes of this debate.** Many philosophers argue that the one-object view and the two-object view agree on all the physical facts and only disagree on how we use the word "object." Does your view differ in any arguable way from the two-object views you reject, or does the dispute turn out to be merely about what we should say rather than about what there is?

  8.  **Follow-up:** If you insist it is not merely verbal, you need a truth-maker—a fact in the world that makes your view true and the other false. If you cannot point to a physical difference, and you deny there are two metaphysical entities, what is the remaining fact that settles the debate? Is there any work left for your theory to do?

  9.  **Let's apply your framework to a messier case.** Imagine an object that is plausibly both a sacred religious artifact and a piece of secular folk art. These classifications might demand incompatible treatments—one requires it be burned in a ritual, the other requires it be preserved in a museum. How do you determine which classification governs the object's properties, and does the object really have incompatible properties relative to these different sorts?

  10. **Final Question:** In that contested scenario, or in the statue case, what would you treat as evidence against the whole approach? Is there any discovery about the clay, the statue, or our language that would convince you that there really are two objects, or is your view insulated from empirical refutation?
