      *   *Group A (6):* Yes Stadium, No Theater. (Fee vote doesn't matter logically, but to keep consistency: No Fee).
      *   *Group B (6):* No Stadium, Yes Theater. (No Fee).
      *   *Group C (6):* Yes Stadium, Yes Theater. (Yes Fee).
      *   *Majority:* Yes Stadium (12), Yes Theater (12), No Fee (12).
      *   *Result:* Build both, don't pay. Incoherent.

  4.  **Drafting the "Unity Chair" Phase:**

      *   After the incoherent result is revealed, pick one student (or the instructor plays this role? Prompt says "introduce a unity chair"). Let's pick a student.
      *   Task: Produce *one* coherent statement of "The Room's Will."
      *   Options:
          1.  Respect the Majority on issues (Incoherent).
          2.  Respect the Logic (Coherent but minority view on taxes).
      *   Cost: If they choose Logic (Raise Fees), they defy the majority on fees. If they choose Majority (No Fees), they lie about the budget.

  5.  **Drafting the Timeline (85 Minutes):**

      *   0-5: Setup & Seating.
      *   5-15: Boundary Vote (The Circular Trap).
      *   15-20: Briefing & Argument (Public justification).
      *   20-50: Substantive Voting (3 separate ballots, shuffled time).
      *   50-60: Tally & Reveal (The Shock).
      *   60-70: Unity Chair Challenge.
      *   70-85: Debrief.

  6.  **Addressing Constraints & Troubleshooting:**

      *   *Constraint:* "Do not use words... until debrief."
      *   *Constraint:* "Logical linkage... not advertised."
      *   *Constraint:* "Robust rather than lucky." (Briefs ensure this).
      *   *Troubleshooting:*
          *   *Spotting the link:* Instructions must forbid discussing the *connection* between items, only argue for the item at hand.
          *   *Voting own opinion:* Briefs must be mandatory ("You are a delegate bound by this mandate").
          *   *Unity Chair dominates:* Give them strict constraints.
          *   *Boundary vote rigged:* Acknowledge the rig as part of the lesson (who set the rules?).
          *   *Resolving too quickly:* Instructor must block "Let's just re-vote."

  7.  **Refining the Boundary Problem:**

      *   To make the circularity sharp: The vote on eligibility must happen *before* we know who is eligible.
      *   *Procedure:*
          1.  Hand out "Status Cards" (15 Campus, 3 Neighbor).
          2.  Announce: "We must decide if Neighbors vote on the Budget."
          3.  Ask: "Who votes on *this* question?"
          4.  If Instructor says "Everyone," Neighbors vote Yes (18-0 or close). Campus feels it was self-dealing.
          5.  If Instructor says "Campus only," Neighbors protest they had no say in the rule.
          6.  *Decision for Plan:* The Plan will instruct the Instructor to default to "Everyone votes on eligibility" but highlight the conflict in the debrief. Or better, let the group decide who votes on eligibility, which creates an infinite regress.
          7.  *Simpler for 85 mins:* Hand ballots for Eligibility to everyone. Tally them. Then proceed. In debrief, ask: "Was it fair that Neighbors voted on their own admission?"

  8.  **Writing the Materials:**

      *   Need 3 types of Policy Briefs (A, B, C).
      *   Need 2 types of Status Cards (Campus, Neighbor).
      *   Need 3 separate Ballots (Stadium, Theater, Fees).
      *   Need 1 Eligibility Ballot.
      *   Need Unity Chair Instructions.

  9.  **Debrief Structure:**

      *   Map Tally -> Discursive Dilemma (Doctrinal Paradox).
      *   Map Eligibility -> Boundary Problem (Constitution of the Demos).
      *   Limitations: Authority/Charisma, Time/Continuity.

  10. **Review against Constraints:**

      *   18 students? Yes.
      *   No screens? Yes.
      *   No jargon until debrief? Yes.
      *   Robust paradox? Yes (6-6-6 split).
      *   Boundary vote first? Yes.
      *   Unity Chair second? Yes.
      *   Troubleshooting included? Yes.

  11. **Final Polish:**

      *   Ensure tone is instructional for a co-teacher.
      *   Check timing. 85 minutes is tight for 3 votes + debate. Need to keep arguments short (2 mins per issue).
      *   Make sure the "Hidden Logic" is clear in the instructions to the Instructor but hidden from students.
      *   *Self-Correction on Boundary:* If I assign 3 Neighbors, and 15 Campus. If everyone votes on eligibility, Neighbors vote Yes. Campus might vote No. If Campus votes No (15 votes) and Neighbors vote Yes (3 votes), the motion fails. Neighbors are excluded. Where is the circularity?
      *   *The Circularity:* The circularity is that the *rule* determining who votes was decided by a group that included/excluded people without their consent.
      *   *Better enactment:* The Instructor announces: "We need to vote on whether Neighbors vote. But we haven't decided who votes on *this*." Let them argue for 2 minutes. Then Instructor says: "To save time, everyone present casts a ballot." This forces the self-dealing issue.
      *   *Wait, one more tweak:* To make the circularity undeniable, the "Neighbor" brief should say: "You are a resident. You claim the right to vote on all matters, including who gets to vote." The "Campus" brief says: "You are a student. You decide if residents get a say."
      *   *Okay, let's finalize the Boundary Vote mechanism:*
          *   Step 1: Distribute Status Cards (15 Campus, 3 Neighbor).
          *   Step 2: Instructor asks: "We must decide the Budget. Do Neighbors vote on the Budget?"
          *   Step 3: Instructor asks: "Who votes on *this* question?"
          *   *Predicted outcome:* Students will say "Everyone."
          *   *Action:* Instructor accepts this. Ballots go to all 18.
          *   *Result:* Neighbors vote Yes. Campus splits.
          *   *Debrief Point:* "You just used a vote to decide who gets to vote. But to hold that vote, you already assumed who got to vote (Everyone). You assumed the answer to the question you were asking."

  12. **Final check on "Unity Chair":**
      *   Prompt: "Force the choice between a coherent minority platform and an incoherent majority one."
      *   This means the Chair must write a statement.
      *   Option 1 (Majority Will): "Build Stadium, Build Theater, Do Not Raise Fees." (Incoherent/Impossible).
      *   Option 2 (Logical Will): "Build Stadium, Build Theater, Raise Fees." (Coherent, but defies majority on Fees).
      *   Option 3 (Compromise): "Build One, No Fees." (Defies majority on Stadium AND Theater).
      *   The Chair must pick one and defend it as "The Will of the Room."

  13. **Writing the Plan.** (Proceeding to generate output based on these thoughts).
      *   *Note on Materials:* Need to be very specific about the text on the cards.
      *   *Note on Timing:* Keep the debate tight.
      *   *Note on Failure:* What if they don't vote as instructed? Emphasize the "Delegate" role in the brief.

  14. **Limitations to mention in Debrief:**
      *   Embodied Authority (Leader vs. Tally).
      *   Time (Will persists vs. Instant vote).
      *   Intensity (All votes count 1, but people care differently).

  15. **Final Review of the Prompt's "Circularity" requirement:**
      *   "The membership problem must be enacted, not described... The room votes on whether to seat them, and that vote governs who votes thereafter. Make sure the design exposes the circularity: the seating vote is decided by a body whose own composition is exactly what is in question."
      *   *Critical Fix:* If I hand ballots to everyone for the seating vote, I have *already* decided the composition for that vote.
      *   *How to expose this:* The Instructor must explicitly state: "I am handing ballots to everyone currently in the room to decide who stays in the room."
      *   *The Trap:* The act of handing the ballot *is* the decision. The vote just ratifies it.
      *   *Instruction:* I will write the script so the Instructor acknowledges this tension explicitly *during* the distribution of the eligibility ballot. "I am giving this to all of you. Some of you are contesting whether you should have this paper. But you have it. Vote."

  16. **Okay, ready to write.**
answer: |-
  # Activity Plan: "The Room's Will"

  **Course:** Upper-Level Democratic Theory Seminar
  **Time:** 85 Minutes
  **Participants:** 18 Students (Adjustable)
  **Room:** Flat seminar room, movable chairs, whiteboard.
  **Tech:** None (Paper only).

  ## 1. Learning Objectives
  By the end of this session, students will have experienced:
  1.  **The Coherence Problem:** How majority voting on logically connected issues can produce an impossible collective outcome, even when every individual is rational.
  2.  **The Boundary Problem:** How defining "the people" requires a prior decision by "the people," creating a logical circle.

  ## 2. Materials Preparation
  Print the following on distinct colored paper if possible.

  *   **Status Cards (18 total):**
      *   15 cards labeled **"CAMPUS MEMBER"**.
      *   3 cards labeled **"COMMUNITY NEIGHBOR"**.
  *   **Policy Briefs (18 total):**
      *   6 copies of **Brief A**.
      *   6 copies of **Brief B**.
      *   6 copies of **Brief C**.
      *   *Distribution:* Mix the Status Cards into the Briefs randomly, but ensure each Brief type (A, B, C) has at least one "Neighbor" if possible (e.g., 1 Neighbor in Group A, 1 in B, 1 in C).
  *   **Ballots (Approx. 80 total):**
      *   **Ballot 1 (Eligibility):** "Should Community Neighbors be allowed to vote on the Budget Package?" [YES / NO]
      *   **Ballot 2 (Stadium):** "Approve funding for the New Stadium?" [YES / NO]
      *   **Ballot 3 (Theater):** "Approve funding for the New Theater?" [YES / NO]
      *   **Ballot 4 (Fees):** "Approve the Student Fee Increase?" [YES / NO]
  *   **Unity Chair Card (1 total):** Instructions for the selected student leader.
  *   **Whiteboard Markers.**

  ## 3. The Hidden Logic (Instructor Eyes Only)
  *Do not reveal this to students.*
  The three policy items are logically connected by a budget constraint:
  *   **Stadium Cost:** $5M
  *   **Theater Cost:** $5M
  *   **Fee Revenue:** $8M
  *   **Constraint:** You cannot fund both Stadium and Theater without the Fee Increase. (Stadium + Theater $\rightarrow$ Fees).

  **The Briefs guarantee the paradox:**
  *   **Brief A (6 students):** Pro-Stadium, Anti-Theater. (Fee vote: NO).
  *   **Brief B (6 students):** Anti-Stadium, Pro-Theater. (Fee vote: NO).
  *   **Brief C (6 students):** Pro-Stadium, Pro-Theater. (Fee vote: YES).

  **Expected Majority Tally:**
  *   Stadium: YES (12 vs 6)
  *   Theater: YES (12 vs 6)
  *   Fees: NO (12 vs 6)
  *   **Result:** Build both, don't pay. (Incoherent).

  ---

  ## 4. Minute-by-Minute Timeline

  ### Phase 1: Constitution & The Boundary Trap (0:00 – 0:15)

  **0:00 – 0:05: Seating & Status**
  *   As students enter, hand them a **Status Card** and a **Policy Brief** face down.
  *   Ask them to sit in a large circle.
  *   **Instruction:** "Do not show your card or brief to anyone yet. Read your brief silently. You are a delegate bound by the commitments in that brief. You must argue and vote according to the brief, not your personal opinion."

  **0:05 – 0:10: The Eligibility Challenge**
  *   **Instructor:** "We are here to pass a Budget Package. However, I see some of you hold 'Community Neighbor' cards. The Campus Members claim this is an internal university matter. The Neighbors claim the budget affects the town and they deserve a vote."
  *   **Instructor:** "Before we vote on the budget, we must vote on **Eligibility**. Should Neighbors be allowed to vote on the budget?"
  *   **The Trap:** A student will ask, "Who votes on *this*?"
  *   **Instructor Script:** "That is the question. To save time, I am handing an Eligibility Ballot to everyone currently seated in this circle. If you have a ballot, you cast a vote."
  *   *(Hand Ballot 1 to all 18 students. This enacts the circularity: you assume they are voters to decide if they are voters.)*
  *   **Vote:** 2 minutes to discuss, 1 minute to vote. Collect and tally on the board.
  *   **Outcome:** Likely YES (Neighbors vote for themselves; some Campus may support them).
  *   **Rule:** "The majority has spoken. Neighbors [are/are not] seated. We proceed with this group."

  **0:10 – 0:15: Public Justification**
  *   **Instructor:** "We have three budget items to decide. I will introduce them one at a time. Before each vote, I will call on three people to speak for 60 seconds each in favor of their brief's position."
  *   *(This forces public commitment to the positions that will create the paradox.)*

  ### Phase 2: The Substantive Votes (0:15 – 0:50)

  **0:15 – 0:25: Vote 1 (Stadium)**
  *   **Instructor:** "Item 1: New Stadium."
  *   **Debate:** Call on 1 student from Brief A (Yes), 1 from Brief B (No), 1 from Brief C (Yes).
  *   **Vote:** Distribute **Ballot 2**. Collect and tally on board (Do not clear the board).
  *   **Expected:** YES (12-6).

  **0:25 – 0:35: Vote 2 (Theater)**
  *   **Instructor:** "Item 2: New Theater."
  *   **Crucial:** Do not mention the cost or the connection to the Stadium. Treat it as a standalone cultural decision.
  *   **Debate:** Call on 1 from Brief A (No), 1 from Brief B (Yes), 1 from Brief C (Yes).
  *   **Vote:** Distribute **Ballot 3**. Collect and tally.
  *   **Expected:** YES (12-6).

  **0:35 – 0:45: Vote 3 (Fees)**
  *   **Instructor:** "Item 3: Student Fee Increase."
  *   **Debate:** Call on 1 from Brief A (No), 1 from Brief B (No), 1 from Brief C (Yes).
  *   **Vote:** Distribute **Ballot 4**. Collect and tally.
  *   **Expected:** NO (12-6).

  **0:45 – 0:50: The Reveal**
  *   **Instructor:** "Look at the board. Read the three outcomes together as a single sentence."
  *   *(Allow silence. Let them notice the impossibility.)*
  *   **Instructor:** "We have voted to build the Stadium. We have voted to build the Theater. We have voted NOT to raise the money to pay for them. The budget is broken. The will of the room is mathematically impossible."

  ### Phase 3: The Unity Chair (0:50 – 1:05)

  **0:50 – 0:55: Appointment**
  *   **Instructor:** "A government cannot operate on an impossible will. We need a single, coherent platform. I am appointing a 'Unity Chair'." (Pick a student who seems thoughtful, preferably from Group C or a Neighbor).
  *   **Hand them the Unity Chair Card.**
  *   **Task:** "You have 5 minutes to write one statement of 'The Room's Will' on the board. It must be coherent (the math must work). It must claim to represent this room."

  **0:55 – 1:05: The Choice**
  *   The Chair will face a dilemma:
      1.  **Respect the Majority:** Write "Build Both, No Fees." (Incoherent/Lie).
      2.  **Respect the Logic:** Write "Build Both, Raise Fees." (Coherent, but defies the majority vote on Fees).
      3.  **Compromise:** Write "Build One, No Fees." (Coherent, but defies the majority on Stadium AND Theater).
  *   **Instructor:** "Chair, explain your choice. Whose will is this? The voters' or the logic's?"
  *   *(Let them struggle. Do not solve it for them.)*

  ### Phase 4: Debrief (1:05 – 1:25)

  **1:05 – 1:15: Mapping the Experience**
  *   **Ask:** "When did you feel the process was unfair? Was it the Eligibility vote or the Budget tally?"
  *   **Concept 1 (The Tally):** "You were all rational. Your briefs were consistent. Yet the group outcome was irrational. This is not stupidity. It is a structural feature of majority rule over connected issues."
      *   *Name it:* **The Discursive Dilemma** (or Doctrinal Paradox).
      *   *One-liner:* "Majority rule on premises does not guarantee majority rule on conclusions."
  *   **Concept 2 (The Eligibility):** "Look back at the first vote. To decide who votes, we had to vote. To hold that vote, I handed ballots to everyone. I assumed the answer to the question I was asking."
      *   *Name it:* **The Boundary Problem** (or Constitution of the Demos).
      *   *One-liner:* "The people cannot democratically decide who 'the people' are, because they must exist before they can decide."

  **1:15 – 1:20: The Populist Resistance**
  *   **Instructor:** "Which of these two problems would a populist leader hate most?"
  *   **Answer:** The Boundary Problem.
  *   **Why:** "A populist claims to *embody* the will. They say 'I am the voice of the real people.' Admitting that 'the people' is an arbitrary boundary decided by a vote undermines their claim to natural authority. They need the boundary to be fixed by nature or history, not a vote."

  **1:20 – 1:25: Limitations of the Activity (What You Must Supply)**
  *   **Instructor:** "This activity is a machine. It shows the logic. But it misses two things real politics has."
  *   **1. Authority:** "In this room, the Unity Chair had no power. In reality, a leader claims to *feel* the will, not just tally it. They claim a mystical connection that overrides the math. I cannot simulate that charisma here. You have to imagine how a leader convinces you to accept the incoherence as 'necessary'."
  *   **2. Time:** "We voted in 85 minutes. Real 'wills' persist over years. A paradox today might be solved by an election tomorrow. This activity is a snapshot; it cannot show how time heals or hides these contradictions."

  ---

  ## 5. Troubleshooting: Predicted Failures & Fixes

  | Failure Mode | Prediction | Fix |
  | :--- | :--- | :--- |
  | **The Link is Spotted** | A student says, "If we vote Yes on both, we have to vote Yes on fees," before the third vote. | **Intervene:** "Please hold on that. For the purpose of this exercise, treat each item as a standalone moral commitment. We are testing principle, not accounting." |
  | **Brief Ignored** | Students vote their personal opinion instead of their brief. | **Pre-emption:** In the opening, say: "You are ambassadors, not yourself. If you break your brief, you betray your constituency. We will check for consistency." |
  | **Unity Chair Dominates** | The Chair tries to lecture the room rather than synthesize. | **Constraint:** The Unity Card says: "You may not speak for more than 2 minutes. You must write the platform on the board." |
  | **Boundary Vote Feels Rigged** | Students complain *you* decided who got a ballot for the Eligibility vote. | **Lean In:** "Exactly. Who handed out the ballots? I did. Who told me I could do that? No one. That is the problem. The rule-maker is outside the rule." |
  | **Quick Resolution** | Group says, "Let's just re-vote on Fees." | **Block It:** "No. These votes are final. They represent the recorded will of the body. You must govern *this* result, not make a new one." |
  | **Odd Number of Students** | You have 17 or 19 students. | **Adjust Briefs:** Use the **Fallback Briefs** (see below). Keep the 6-6-6 ratio as close as possible (e.g., 6-6-5). The paradox still holds if the majority is clear. |

  ### Fallback Briefs (For Odd Numbers)
  If you have 17 students:
  *   Group A: 5 students
  *   Group B: 6 students
  *   Group C: 6 students
  *   *Result:* Stadium (11-6 Yes), Theater (12-5 Yes), Fees (11-6 No). Paradox holds.

  ---

  ## 6. Instructor Script: Key Moments

  **On Distributing Eligibility Ballots:**
  > "I am giving these to everyone sitting in the circle. I know some of you are contesting whether you belong in the circle. But you have the paper. Cast the vote."

  **On The Reveal:**
  > "Read the board left to right. 'Yes, Yes, No.' Does anyone know how to build two five-million dollar projects with eight million dollars of revenue? No? Then the will of this room does not exist."

  **On The Debrief Limitations:**
  > "In this room, the paradox killed the policy. In the real world, a leader stands up and says, 'The fees are not a tax, they are an investment,' and the paradox disappears because you trust *them*, not the math. I cannot make you trust the Unity Chair. That is the missing piece."

  ---

  ## 7. Materials Text (Copy/Paste for Printing)

  ### Status Card: CAMPUS MEMBER
  > You are a student or staff member. You pay the fees. You believe the budget is an internal university matter.
  > **Your Right:** You believe you should vote on who else gets to vote.

  ### Status Card: COMMUNITY NEIGHBOR
  > You live next to the campus. The construction and traffic affect you. You believe the budget is a public matter.
  > **Your Right:** You claim the right to vote on your own eligibility to participate.

  ### Policy Brief A (6 Copies)
  > **Constituency:** Athletic Alumni & Local Businesses.
  > **Commitments:**
  > 1. The Stadium is essential for recruitment. (Vote YES on Stadium).
  > 2. The Theater is elitist and unnecessary. (Vote NO on Theater).
  > 3. Fees are already too high. (Vote NO on Fees).
  > *Note: You are fiscally conservative. You cannot support Fees.*

  ### Policy Brief B (6 Copies)
  > **Constituency:** Arts Faculty & Humanities Students.
  > **Commitments:**
  > 1. The Stadium is a waste of space. (Vote NO on Stadium).
  > 2. The Theater is essential for culture. (Vote YES on Theater).
  > 3. Fees are already too high. (Vote NO on Fees).
  > *Note: You are fiscally conservative. You cannot support Fees.*

  ### Policy Brief C (6 Copies)
  > **Constituency:** Administration & Development Office.
  > **Commitments:**
  > 1. We need the Stadium for recruitment. (Vote YES on Stadium).
  > 2. We need the Theater for culture. (Vote YES on Theater).
  > 3. We must balance the budget. (Vote YES on Fees **IF** both projects pass).
  > *Note: You are pragmatic. If both projects win, you MUST vote YES on Fees to be consistent.*

  ### Unity Chair Card
  > **Task:** Write "THE WILL OF THE ROOM" on the whiteboard.
  > **Constraints:**
  > 1. It must be financially possible (Math must work).
  > 2. It must claim to represent the votes just cast.
  > 3. You have 5 minutes.
  > **Warning:** You cannot satisfy the majority on all three items. You must choose which part of the majority to betray. Be prepared to explain why your version is the "True Will."

  ### Ballot 1 (Eligibility)
  > **QUESTION:** Should Community Neighbors be allowed to vote on the Budget Package?
  > [ ] YES
  > [ ] NO

  ### Ballot 2, 3, 4 (Substantive)
  > **QUESTION:** [Insert Item Name]
  > [ ] YES
  > [ ] NO
