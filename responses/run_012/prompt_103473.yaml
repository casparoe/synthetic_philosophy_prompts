      *   *Cost:* You lose the specific response to Libet that says "Okay, maybe the brain starts it, but we can stop it." You have to fight harder on #2 (that the RP is irrelevant noise) rather than conceding the initiation point to the unconscious.
      *   *Recognizability:* Yes, this makes you a standard Volitional Libertarian.

  6.  **Drafting the Response (incorporating "Blunt" tone):**

