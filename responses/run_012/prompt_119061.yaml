answer: |-
  **1. The Spine**

  Start by eliciting their current equilibrium. Ask for a show of hands: "Who believes a vegan diet minimizes animal harm?" Most will raise hands. Write "Vegan = 0 Deaths" on the board. Do not challenge this yet. You need them to commit to the intuition so its collapse has weight. Spend the first fifteen minutes solidifying this view. It establishes the baseline you will dismantle.

  Second, introduce the hidden variable. Shift from "eating" to "producing." Explain that agriculture is habitat destruction. When you harvest wheat, you kill the field mice, insects, and ground-nesting birds living there. This does not need to be proven with data yet; it needs to be accepted as a conceptual possibility. If they reject this premise, the session ends. Spend minutes 15–30 establishing that crop cultivation entails animal death.

  Third, introduce the trade-off. Minutes 30–50. Compare the land use. To get 1,000 calories from beef (grass-fed), you need X land. To get 1,000 calories from wheat, you need Y land. Since X is vastly larger than Y, the vegan diet seems safer. But introduce the density variable: pasture supports fewer animals per hectare than a wheat field supports mice. Now the math is contested. This is where they expect you to give them the numbers. Do not.

  Fourth, the Hinge. Minutes 50–60. This is the make-or-break moment. If this fails, the rest is noise. Stop the empirical comparison. Ask: "What is the baseline for the mouse in the wheat field?" If we don't grow wheat, does the mouse exist? If the answer is "no," then growing wheat brings the mouse into existence only to kill it. Is that worse than the cow, who lived a full life before slaughter? Or is death the only metric that counts? You must force them to see that the "correct" diet depends entirely on whether they value *existence* or merely *avoidance of death*.

  Fifth, the Resolution. Minutes 60–90. Apply the hinge. If you count only deaths, beef might win. If you count suffering per year of life, veganism might win. If you count non-existence as neutral, the calculation changes again. Conclude that the science cannot settle this because the unit of measurement is a moral choice, not an empirical fact. The session ends not with a diet recommendation, but with a meta-ethical realization: the argument they came in with was empirically incomplete and morally underspecified.

  **2. The Carrying Case**

  Use **The Hectare of Land**. Do not use Cow versus Chicken. Chicken is too easy; it is universally accepted as the efficiency worst-case offender. That shuts down debate rather than opening it. Cow versus Vegan is the actual philosophical tension your students face.

  The case must visualize a single hectare. On one side, a hectare of pasture supporting one steer over a year. On the other, a hectare of wheat harvested once a year. The case must have visible death mechanisms: the slaughterhouse for the steer, the combine harvester for the mice.

  It must not have specific mortality numbers. If you cite "ten mice per hectare," they will argue the number. Keep it qualitative: "Many small lives versus one large life." It must not include welfare conditions (confinement vs. open field) unless directly relevant to the death count. Distinct welfare issues dilute the specific question of *killing*. The Hectare isolates the variable of land-use efficiency against the variable of population density. It forces them to trade quality of life for quantity of deaths, which is where the ethical friction actually lives.

  **3. Misconceptions in the order they'll show up**

  1.  **"Plants feel pain."** (Minute 15). This will surface immediately when you suggest crops kill. Head it off by stipulating the discussion is about *animals* killed by farming, not plant sentience. Bracket it. If you debate plant neurobiology, you lose the room.
  2.  **"Wild deaths don't count."** (Minute 30). When you mention field mice, welfare-focused students will dismiss them as "nature." Intervene here. Ask if a mouse death by combine is morally different from a mouse death by fox. If they say yes, ask why human causation matters for the mouse's suffering. Force them to include wild animals in the moral circle for this specific calculation.
  3.  **"Intentions matter."** (Minute 45). They will argue farmers don't *mean* to kill mice. Distinguish between intended and foreseen consequences. Use the doctrine of double effect briefly. If the death is foreseeable and preventable by diet choice, intention mitigates but does not erase responsibility.
  4.  **"Existence is a benefit."** (Minute 60). This is the dangerous one. When discussing the baseline, someone will say, "Better to live and die than never exist." Challenge this. Is it a benefit to the mouse? Or just to the ecosystem? If existence is a benefit, then breeding animals for food becomes morally positive. Push them to see the implication of that claim.
  5.  **"So we should all eat beef."** (Minute 80). The reductio ad absurdum. They will think you are advocating carnivory. Head this off by reiterating the uncertainty. The point is not that beef is better, but that the "obvious" choice is no longer obvious. Reframe the conclusion as epistemic humility, not dietary advice.

  **4. The Check**

  Ask this: "If new data proved conclusively that wheat farming kills ten times more animals per calorie than grass-fed beef, would you switch to beef? Yes or no, and give me the moral reason why."

  If they answer based on the data alone, they missed the point. If they answer based on their baseline definition of harm (e.g., "No, because the cow's life is still a net negative"), they understand the hinge.

  **5. What I'm Leaving Out**

  I will refuse to adjudicate the empirical claims. I am not a biologist, and neither are they. I will not present specific mortality stats as fact. I will refuse to discuss environmental impact (CO2, water use); that is a separate ethical framework that confuses animal welfare with ecological stability. I will not advocate for a specific diet. My role is to expose the structure of the argument, not to solve it. Finally, I will not entertain debates on plant sentience. We are discussing animal ethics; if plants count, the session changes entirely, and that is not today's brief.
