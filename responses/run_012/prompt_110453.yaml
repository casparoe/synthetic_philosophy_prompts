  # Rule-Following Decision Tree

  **ROOT:** **The Skeptic's Negative Thesis is Granted.**
  (We agree: Nothing about your past behavior, inner experiences, or training settles what you meant. The "fact" the skeptic demanded is missing.)

  ---

  ### NODE 1: The First Occasion (Logical Scope)
  **Question:** You are right now making your very first move past the cases you've already handled. Does the skeptic's doubt apply to the *logical* move of application itself (e.g., Modus Ponens), or only to the content (arithmetic)?
  *   **YES (It eats logic):** The paradox undermines the rules of inference used to state the paradox.
      *   └─> **LEAF 1: THERAPEUTIC DISSOLUTION**
      *   *Hardest Commitment:* You must abandon the philosophical quest to explain meaning entirely as a confusion of grammar.
  *   **NO (Logic is safe):** The rules of inference hold; the doubt is only about specific semantic facts.
      *   └─> *Go to Node 2.*

  ---

  ### NODE 2: The Private Noter (Existence of Fact)
  **Question:** A person coins a rule for a private notation and dies before ever applying it again. Is there a fact of the matter about what she meant?
  *   **NO:** Meaning requires future use or public verification; without application, there is nothing there.
      *   └─> *Go to Node 3 (The No-Fact Branch).*
  *   **YES:** Meaning is intrinsic to the mental act or intention, regardless of future use.
      *   └─> *Go to Node 4 (The Fact Branch).*

  ---

  ### NODE 3: The Isolated Machine (Status of Talk)
  *(Reached if Private Noter = NO)*
  **Question:** We agree there is no "meaning fact" for the machine. When we say "It computes plus," are we stating a literal falsehood, or claiming a license to speak?
  *   **FALSEHOOD:** Meaning ascriptions aim at facts, fail to find them, and are therefore false.
      *   └─> **LEAF 2: ERROR THEORY**
      *   *Hardest Commitment:* You must accept that every ordinary claim about meaning (yours and others') is literally false.
  *   **LICENSE:** Meaning ascriptions don't state facts but report conditions under which we are justified in speaking.
      *   └─> **LEAF 3: QUASI-REALISM**
      *   *Hardest Commitment:* You must deny there is any truth about what you mean, only that you are licensed to say you mean it.
  *   *(Note: The combination "No Fact" + "Community Can Be Wrong" is **incoherent**. If there is no fact, there is no independent standard for the community to be wrong about.)*

  ---

  ### NODE 4: The Unanimous Community (Nature of Fact)
  *(Reached if Private Noter = YES)*
  **Question:** The entire community unanimously agrees on how to continue a series, but by some standard none of them can reach, they are wrong. Is this scenario coherent?
  *   **NO:** Correctness is constituted by agreement; the community cannot be wrong if they all agree.
      *   └─> **LEAF 4: COMMUNITARIAN REALISM**
      *   *Hardest Commitment:* You must accept that truth is ultimately democratic; there is no gap between "seeming right" and "being right" for the group.
  *   **YES:** Correctness is independent of us; agreement tracks the truth but does not fix it.
      *   └─> **LEAF 5: NON-REDUCTIVE REALISM**
      *   *Hardest Commitment:* You must accept the existence of "queer," non-natural facts that are not reducible to behavior or disposition.

  ---

  ### NOTES ON THE LEAVES

  **1. Predictive Equivalence (Leaf 3 vs. Leaf 4)**
  **Quasi-Realism** and **Communitarian Realism** make the exact same predictions on all test cases:
  *   *Private Noter:* Means nothing.
  *   *Isolated Machine:* Does not compute.
  *   *Unanimous Community:* Cannot be wrong.
  **The Gap:** The only difference is metaphysical. Leaf 3 says "Agreement creates *assertibility* (no fact)." Leaf 4 says "Agreement creates *truth* (a fact)." If you don't care about the metaphysics of 'fact', these positions are functionally identical.

  **2. Unoccupied Combinations**
  *   **No Fact + Independent Standard:** (Reached if one tries to go from Node 2 [NO] to Node 4 [YES]). This view is **incoherent**. If there is no fact of the matter (Node 2), there is no independent standard for the community to fail to meet (Node 4).
  *   **Private Meaning + Community Constitutes Truth:** (Reached if one holds Private Noter = YES but Community = NO). This is **unexplored/unstable**. It posits a private fact that is nonetheless overridden by public agreement. Most philosophers find this tension untenable.

  **3. The "Logic" Split (Leaf 1)**
  **Therapeutic Dissolution** is the only leaf that survives if the paradox applies to basic logic. All other leaves (2–5) assume logic is secure and try to solve the semantic puzzle. If you think the skeptic undermines logic itself, you cannot occupy Leaves 2–5.
