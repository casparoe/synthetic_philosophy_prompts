answer: |-
  You have independently rediscovered a central problem in the philosophy of mind and phenomenology. Your intuition is correct: the "folk wisdom" you mention—that we have immediate, infallible access to our own mental states—is a specific philosophical thesis that has been heavily contested for the last century.

  The thesis you are challenging is called **Privileged Access** (or sometimes **Incorrigibility**). It suggests that regarding your own current mental states, you are the ultimate authority and cannot be wrong. Your three strands are excellent counter-examples to this thesis.

  There is no single name that covers all three strands perfectly, because they rely on slightly different mechanisms. However, they fall under the broader umbrella of **The Limits of Introspection** or **Reflexive Interference**.

  Here is how your three strands map onto established ideas, where they differ, and how to draw the edges of the phenomenon.

  ---

  ### Strand 1: The State is Destroyed by the Check
  *Your example: Drifting vs. Attending.*

  **Nearest Established Idea:** **The Observer Effect (Psychological)** and **Sartre's Pre-reflective Consciousness.**

  In physics, the observer effect notes that measuring a system disturbs it. In psychology, this is often called **Reactivity**. However, the philosopher Jean-Paul Sartre gave the most precise account of this. He distinguished between:
  1.  **Pre-reflective consciousness:** Being absorbed in the world (reading a book, drifting).
  2.  **Reflective consciousness:** Thinking *about* the fact that you are reading or drifting.

  Sartre argued that when you shift from pre-reflective to reflective, you alter the ontological status of the experience. You are no longer simply *drifting*; you are now *observing yourself drifting*. The original state is gone, replaced by a new state of self-observation.

  **How it differs from your description:**
  Your description is accurate, but philosophy adds a nuance: it's not just that the information is lost; it's that the *subject* changes. In the drifting moment, "you" are the drift. In the answering moment, "you" are the observer of the drift.

  **Verdict:** This is a classic instance of **Introspective Reactivity**.

  ### Strand 2: The State is Hidden from the One Who Has It
  *Your example: Irritability visible to others, not to self.*

  **Nearest Established Idea:** **Self-Deception** and **Externalism about Self-Knowledge.**

  This strand attacks Privileged Access most directly. If others can see your irritability and you cannot, your access to your own mind is not "privileged."
  *   **Psychoanalysis** calls this repression or lack of insight.
  *   **Contemporary Philosophy** (e.g., Richard Moran) discusses this as a failure of **Transparency**. Normally, I know I believe it is raining by looking out the window, not by looking "inside" my brain. But with emotions like irritability, we often lack the "window."
  *   **Gilbert Ryle** argued that we often know our own minds in the same way others do: by observing our own behavior. If you aren't paying attention to your own tone of voice, you won't know you are irritable.

  **How it differs from your description:**
  You suggest the information is "available to others and not to me." Philosophers would argue the information *is* available to you (you hear your own voice), but you lack the **interpretive framework** or the **willingness** to acknowledge it. It is not a sensory blind spot; it is an interpretive one.

  **Verdict:** This is **Asymmetric Self-Knowledge**. It fits your pattern but suggests the failure is in *interpretation*, not just observation.

  ### Strand 3: The State is Incompatible with Monitoring
  *Your example: Absorption vs. Monitoring Absorption.*

  **Nearest Established Idea:** **Flow State** and **Absorbed Coping.**

  Psychologist Mihaly Csikszentmihalyi named this **Flow**. A defining characteristic of flow is the loss of self-consciousness. If you ask, "Am I in flow?" you are no longer in flow.
  Philosopher Hubert Dreyfus called this **Absorbed Coping**. He argued that expert action (a pianist playing, a tennis player volleying) requires the disappearance of the "self" as a monitoring agent. The moment you monitor your performance, you revert to novice-level deliberation.

  **How it differs from your description:**
  This is subtly different from Strand 1. In Strand 1 (Drifting), the check *destroys* the past state. In Strand 3 (Absorption), the check makes the state *impossible to sustain in the present*. It is a structural incompatibility rather than a temporal disruption. The state *essentially* requires the absence of self-reference.

  **Verdict:** This is **Non-reflective Engagement**.

  ---

  ### Distinguishing the "Happiness" Paradox
  You mentioned the saying: *"Chasing happiness is the surest way not to get it."*

  This is known as the **Paradox of Hedonism**. It is a cousin to your pattern, but it is **Teleological** (about goals), whereas your pattern is **Ontological** (about existence).
  *   **Paradox of Hedonism:** If happiness is your *goal*, you won't achieve it. (You can be happy without knowing it, but you can't *make* happiness happen by aiming at it).
  *   **Your Pattern:** If you *check* for the state, the state cannot exist or be known. (You can't even *have* the state while checking).

  The Happiness Paradox is about motivation. Your pattern is about the structure of consciousness.

  ---

  ### Defining the Edges: What Counts and What Doesn't

  Since no single term captures all three, I propose we treat this as a family of phenomena under the label **Reflexive Opacity**.

  Here is how to determine if a new example fits your pattern or falls outside it.

  #### 1. The Criterion of Reflexivity
  For your pattern to apply, the mental act of *identifying* the state must interfere with the state itself.
  *   **Fits:** "Am I angry?" (May dissipate the anger or reveal you aren't).
  *   **Does Not Fit:** "Am I tall?" (Checking this does not change your height).
  *   **Does Not Fit:** "Do I believe in gravity?" (Checking this does not change the belief).
  *   **Boundary:** The pattern applies only to **occurrent states** (things happening now) that involve **affect or attention**, not static traits or factual beliefs.

  #### 2. The Criterion of Simultaneity
  The impossibility must be simultaneous.
  *   **Fits:** You cannot be *currently* absorbed and *currently* monitoring absorption.
  *   **Does Not Fit:** "I forgot my keys." You can realize you forgot your keys. The realization doesn't undo the forgetting (though it ends the state of *unrealized* forgetting).
  *   **Boundary:** The state must vanish or become inaccessible *at the very moment* of the check.

  #### 3. The Criterion of First-Person Authority
  The failure must be specific to the person *in* the state.
  *   **Fits:** I cannot know I am drifting while drifting.
  *   **Does Not Fit:** "I don't know if the coffee is hot." (This is just lack of information, not a structural limit of self-knowledge).
  *   **Boundary:** The opacity must arise from the *relationship between the subject and the state*, not from a lack of external data.

  ### Summary of the Three Strands

  If you wish to keep them distinct (which is philosophically rigorous), here is the vocabulary for each:

  1.  **Destruction by Checking:** *Introspective Reactivity.* (The act of measurement alters the variable).
  2.  **Hidden from Self:** *Asymmetric Self-Knowledge.* (Third-person access exceeds first-person access).
  3.  **Incompatible Monitoring:** *Non-reflective Engagement.* (The state is defined by the absence of self-reference).

  ### Conclusion

  You have not found one phenomenon, but a cluster of three related limitations on **Self-Knowledge**.

  The "folk wisdom" you suspected is the **Doctrine of Incorrigibility**, and your examples successfully refute it. The nearest established vocabulary comes from **Phenomenology** (Sartre, Dreyfus) and **Philosophy of Psychology** (Ryle, Nisbett & Wilson).

  If you need a single phrase to describe the general pattern for your own use, **"The Reflexivity Constraint"** is accurate. It defines the boundary you are looking for: *Any mental state whose existence conditions exclude the simultaneous awareness of that existence.*

  **What falls outside the definition:**
  *   **Unconscious desires:** You can't report them, but not because checking destroys them; they are structurally repressed.
  *   **Simple ignorance:** Not knowing the capital of France is not a reflexive constraint.
  *   **The Paradox of Hedonism:** Aiming at a state is different from observing a state.

  Your analysis holds up. The mind is not a room with lights always on; sometimes the light switch is the thing you are trying to see.
