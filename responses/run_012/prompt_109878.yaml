prompt: |-
  I'm an ICU nurse and I sit on the ethics committee at my hospital, which is rewriting our death-determination policy (we use neurologic criteria for some patients and circulatory criteria for others, depending on whether we're withdrawing support). Two things I keep running into while reading up on this, and they wont leave me alone.

  First, people draw a line between a function being permanent and it being irreversible -- permanent meaning it won't come back given what we can actually do right now, irreversible meaning it can't come back no matter what. Our policy, as far as I can tell, leans on the first sense without ever saying so, and I'm not sure anyone on the committee has noticed that this is a choice.

  Second, I've started to think the word "death" in our policy is doing two jobs at once: naming a biological state, and marking the point where it's ok to stop and where it's ok to take organs. Those might not be the same point, and it bothers me that we write it as if they obviously are.

  What are the most important implications of that permanence/irreversibility distinction for how we should actually write the thing -- especially for donation after circulatory death, where we stand back and let the heart stay stopped for a few minutes and then proceed? I'd also like to know what follows from the second point, if anything does. Please be upfront about which parts of this are settled among people who genuinely work on it and which are contested, because I don't want to hand the committee a contested position dressed up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** ICU Nurse, member of hospital ethics committee.
      *   **Context:** Hospital is rewriting its death-determination policy (neurologic and circulatory criteria).
      *   **Core Concerns:**
          1.  *Permanence vs. Irreversibility:* The policy seems to use "permanent" (won't restart spontaneously or with current intervention) but implies "irreversible" (cannot restart ever), without acknowledging the choice.
          2.  *Dual Function of "Death":* The word "death" is doing double duty: defining a biological state *and* authorizing action (stopping treatment/organ procurement). These might not coincide.
      *   **Specific Ask:** Implications for policy writing (especially DCD - Donation after Circulatory Death), implications of the second point, and crucially, *distinguish between consensus and contested issues* in the bioethics/legal/medical community.
      *   **Tone:** Professional, nuanced, evidence-based, transparent about uncertainty/debate.

  2.  **Deconstruct Concern #1: Permanence vs. Irreversibility:**
      *   *Definition:* Irreversible = cannot be reversed by *any* means. Permanent = will not be reversed by *current* means/intent (we aren't going to try).
      *   *Context:* This is the heart of DCD (Donation after Circulatory Death). In DCD, we wait 2-5 minutes after asystole. The heart *could* theoretically restart (auto-resuscitation/Lazarus phenomenon), but we declare it "permanent" because we won't intervene.
      *   *Consensus:* The 2010 IOM (Institute of Medicine) report and the 2023 National Academies report explicitly endorse the "permanent" standard for DCD, not "irreversible." The UDDA (Uniform Determination of Death Act) revision efforts acknowledge this.
      *   *Implication for Policy:* The policy *must* explicitly state that cessation is "permanent" (will not resume spontaneously and will not be intervened upon), not "irreversible." Hiding this creates moral distress and legal vulnerability.
      *   *Contested:* Some philosophers/clinicians argue this creates a "self-fulfilling prophecy" of death (we make it irreversible by deciding not to treat). However, for *policy purposes*, the "permanent" standard is the operational norm.

  3.  **Deconstruct Concern #2: The Dual Function of "Death" (Biological vs. Normative):**
      *   *Definition:* Biological = organism as a whole has ceased integrating function. Normative = moral/legal license to act (harvest organs, stop care, bury).
      *   *The Problem:* In DCD, there is a "no-touch" time (usually 5 mins). Biologically, is the patient dead at minute 0 or minute 5? Legally, we can't act until minute 5.
      *   *Consensus:* There is *no* consensus that these are the exact same moment. Most policies treat the *determination* of death as the legal marker, which lags slightly behind the biological cessation to ensure permanence.
      *   *Implication for Policy:* Separate the *criteria* (biological) from the *authorization* (normative). The policy should clarify that "determination of death" is the legal trigger for action, acknowledging the waiting period ensures the biological state is secure.
      *   *Contested:* The "Dead Donor Rule" (DDR). Some argue DCD violates the DDR because organs are taken before total biological integration is lost (ischemic tolerance). Others argue the DDR is a moral rule, not a biological one. The 2023 National Academies report suggests decoupling death determination from organ eligibility in some frameworks, but this is highly controversial and not yet law.
      *   *Key Distinction:* The UDDA revision process (2020-2024) is actively debating this. It is *not* settled law yet.

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Validate the user's insights (they are sharp and correct). Acknowledge the gravity of the task.
      *   **Section 1: Permanence vs. Irreversibility (The DCD Context):**
          *   Define the terms clearly.
          *   State the Consensus: DCD relies on *permanence*.
          *   Policy Implication: Write "permanent" explicitly. Define the "no-resuscitation" commitment.
          *   Contested Area: The moral weight of the decision not to resuscitate making the death "permanent."
      *   **Section 2: The Dual Function of "Death" (Biological vs. Normative):**
          *   Acknowledge the conceptual split.
          *   State the Consensus: Law/Policy treats the *determination* as the trigger, not the raw biology.
          *   Policy Implication: Clear procedural steps (waiting period) separate biological cessation from legal declaration.
          *   Contested Area: The Dead Donor Rule (DDR) and whether DCD stretches the definition of death too far for organ viability. Mention the 2023 National Academies report recommendations (controversial).
      *   **Section 3: Actionable Recommendations for the Policy:**
          *   Specific language suggestions.
          *   Transparency about the "choice."
          *   Separation of determination vs. authorization.
      *   **Section 4: What's Settled vs. What's Contested (The "Upfront" Request):**
          *   Create a clear table or list.
          *   Settled: UDDA framework, Permanence for DCD, Waiting periods.
          *   Contested: UDDA Revision specifics, DDR integrity, Decoupling death from organ donation.
      *   **Conclusion:** Encouraging closing.

  5.  **Refine Content based on Current Literature (Mental Check):**
      *   *UDDA:* Originally 1981. Currently under review by ULCC and National Academies (NASEM).
      *   *NASEM 2023 Report:* "Determination of Death: An Examination of the Criteria, Standards, and Protections." Key takeaway: Retain "permanent" for circulatory, clarify "irreversible" for neurologic. Acknowledged the normative function.
      *   *DCD:* Maastricht categories. Usually 5-minute wait time (varies by jurisdiction, often 2-5 mins).
      *   *Terminology:* Ensure distinction between "cessation of function" and "determination of death."

  6.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone Check:* Needs to be respectful of the nurse's expertise. Avoid talking down. Use precise bioethical terminology.
