prompt: |-
  Ok so my physics club is completly split and I have to write something for the school blog. On one side are the many-worlds people who say that in a quantum suicide setup you should expect to survive, because in every branch where you die there's another branch where you don't, and your future self only ever experiences the surviving ones. On the other side are the people who say that's a total misuse of probability, that the measure of surviving branches shrinks to basically nothing, and that expecting to be the survivor is like expecting to be the one lucky atom. They've been argueing past each other for a month. Can you draft the joint statement they could both sign? I want: (1) a numbered list of claims both sides actually agree on about branching, personal identity, probability, and what quantum suicide is even supposed to show; (2) a disagreements table, with each disagreement written in wording that side would accept; (3) the cruxes, and for each crux a concrete thought experiment or argument both sides agree would bear on it, with each side's prediction written down in advance. If part of the fight turns out to be just about words, say which part and why. One extra thing we came up with in club: the reset room. A machine flips a quantum coin; on tails it kills you, on heads it lets you out, but if it kills you it also erases your memory and restarts the whole thing. Both sides should say what they predict about the first-person experience and about the branch weights. Keep it neutral, no citations, and don't just tell me who's right.
