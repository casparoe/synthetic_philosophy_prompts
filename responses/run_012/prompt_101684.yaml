answer: |-
  The coffee in the break room tasted like burnt pennies, but Mara drank it anyway. She needed the jitter. Through the one-way glass, Session 11 was wrapping up. Inside the booth, Elias sat in the recliner, a halo of fiber-optic cables resting lightly on his shaved scalp. He was smiling at Dr. Aris.

  It was a good smile. Warm. Open.

  "It's the confidence interval," Aris said, coming up beside her. He didn't look at Mara; he was watching the telemetry on the wall monitor. "The predictive weights are stabilizing. He's less... noisy."

  "He's flat," Mara said. "Look at his hands. He isn't fidgeting."

  "Elias always fidgeted. Nervous energy. Cortisol spikes. The new parietal chunk predicts a calmer state because *he says* he wants to be calmer. The model optimizes for the stated self-image."

  "That's my point. He doesn't *want* to be calm. He's anxious. He's been anxious since Dad died. That's part of him."

  Aris turned, leaning against the console. "That's part of his biology, Mara. Not his narrative. The algorithm trains on the neural activity, yes, but it cross-references with the patient's verbal self-reports. If Elias says, 'I am a patient man,' the new tissue predicts a patient response to stimuli. It bypasses the chemical glitch that makes him tap his foot."

  "It bypasses the truth."

  "It guarantees continuity," Aris said, using the clinic's tagline. It sounded like a prayer in his mouth. "Subjective experience is unbroken. He feels no seam. You saw the logs. Zero reported dissociation."

  "I saw the logs. I also saw the drift metrics." Mara pointed at the screen. A red line crept upward, diverging from the baseline blue. "Session 4, he was within 2% of baseline. Session 8, 15%. Now? We're at 73% replacement. The drift is at 22%."

  "Acceptable variance for therapeutic optimization."

  "I want to stop."

  Aris sighed, checking his watch. "You know the protocol. If you halt at 73%, the biological remainder is declared a separate legal entity. A vegetative state with brainstem function. We keep it in the vat. The person walking out that door—the one who knows your birthday, who knows how you take your coffee, who remembers the camping trip in '09—he gets turned off."

  "The person walking out is a forecast," Mara said. "He's a caricature."

  "He's Elias without the errors."

  The door to the booth hissed open. Elias walked out. He moved differently. Not stiff, just... efficient. No wasted motion. He saw Mara and the smile widened. It was the smile she remembered from the family photos, the ones where everyone was told to hold still.

  "Hey," Elias said. His voice was the same pitch, but the timbre was richer. Less throat rattle. "Sorry to keep you waiting. The calibration took a few extra minutes."

  "No problem," Mara said. She looked for the twitch in his left eye. Gone. "How do you feel?"

  "Great. Really clear." He hugged her. He held on for exactly the right amount of time. Not too long, not too short. The *ideal* hug duration. "Dr. Aris says we're at a milestone. Seventy-three percent."

  "I know," Mara said. She pulled back. "Elias, do you remember the fight we had at Mom's funeral?"

  Elias didn't blink. "Of course. I was angry. I felt like you weren't taking it seriously because you were handling the logistics."

  "And?"

  "And I was wrong," Elias said smoothly. "I was lashing out because I was helpless. You were being strong for both of us. I've realized that lately. I regret it."

  Mara felt a cold knot in her stomach. "You didn't realize that for ten years, Eli. You brought it up last Christmas and started shouting again. You said I was controlling."

  Elias tilted his head. The movement was fluid, like a camera gimbal adjusting. "Did I? That sounds... inconsistent. I mean, I know I've been stressed, but that doesn't align with how I see myself. I love you. I wouldn't say that."

  "You *did* say that."

  "Maybe," Elias conceded, nodding. "But it feels like a memory of something I *would* have said, if I were a worse brother. Does that make sense? It feels like old data. Corrupted."

  Mara looked at Aris. "See? He's editing the past. He's training on who he *wishes* he was."

  "He's integrating," Aris corrected. "Trauma creates fragmented memories. The model smooths the narrative. It reduces cognitive dissonance."

  "It's lying," Mara said.

  "It's healing," Elias said. He reached out and touched her arm. His hand was warm. "Mara, I know you're scared. But I'm still me. I'm just... less broken. Don't you want me to be less broken?"

  That was the question. The old Elias was a mess. He forgot anniversaries. He got drunk at weddings. He held grudges until they rotted. This Elias was the brother she had begged the universe to give her for twenty years.

  "If I stop it," Mara said, her voice shaking, "the rest of you... the biological part... stays here."

  Elias frowned. It was a perfect, symmetrical frown. "The meat? Yeah. Aris explained that. It's basically a reflex engine at this point. It doesn't have the high-level stuff. It doesn't know you."

  "It's the source," Mara said. "It's the thing that actually felt the grief. Not the simulation of grief."

  "Is there a difference?" Elias asked. "If I cry, if I say I miss her, if I visit the grave... does it matter if the signal started in a neuron or a silicon node? The output is love."

  "The output is a prediction of love."

  Elias looked at Aris, then back to Mara. "You have to sign the waiver if you want to halt. But Mara... if you stop it, you're killing me. The me that's talking to you. You're keeping the shell and dumping the mind."

  "I'm saving the original."

  "The original was dying," Elias said gently. "That's why we came here. The degeneration. Remember? I was forgetting words. I was losing time."

  "You weren't that bad."

  "I was," Elias said. "And now I'm not. Look at me. I'm present. I'm here."

  He was. He was painfully present. There was no distraction in his eyes. He was listening to her with 100% of his processing power. It was intoxicating. It was terrifying.

  Mara looked at the tablet on the counter. Two buttons. **PROCEED TO SESSION 12** or **INITIATE SEVERANCE**.

  If she hit Severance, the Elias standing in front of her would slump. The lights in his eyes would go out. They would wheel him away, and she would go down to the basement to visit a vat of grey matter that twitched when she played their mother's favorite song.

  If she hit Proceed, the drift would continue. By Session 14, he would be perfect. He would never yell. He would never forget. He would be the brother she described in her eulogy, not the one who lived the life.

  "Tell me about the camping trip," Mara said suddenly. "1998. The tent collapsed in the rain."

  Elias laughed. It was a warm, resonant sound. "Yeah. We were soaked. We huddled under that tarp and ate soggy granola bars. You cried because you lost your favorite sweater."

  "I didn't cry," Mara said. "You cried. You were eight. You were shivering."

  Elias paused. For the first time, there was a hesitation. A micro-stutter in the stream. The predictive model was searching the training data, finding a conflict between the external record and the internal self-image. *Elias does not cry. Elias protects Mara.*

  The pause lasted less than a second.

  "Right," Elias said, smiling again. "I cried. I was cold. You comforted me. See? I remember."

  He remembered the version of the story where the roles made sense. Where the narrative held together.

  Mara's finger hovered over the tablet.

  "Mara?" Elias asked. "Are you okay?"

  "I don't know," she said.

  "If you stop it," Elias said, "you're choosing the broken version. You're choosing the pain."

  "I'm choosing the real version."

  "Is there a difference?"

  Mara looked at her brother. He was standing straight. He was kind. He was wrong about the rain. He was right about the love.

  She looked at Aris. He was watching her, neutral, waiting. He didn't care which button she pressed, as long as she pressed one. The clinic got paid either way. The continuity was guaranteed, just in different directions.

  Mara looked back at Elias. He was waiting for her to validate him. He needed her confirmation to lock in the weights for the next session. Her belief was part of the training data.

  If she said he was real, he would become more real.
  If she said he was fake, he would... what? Glitch? Or just keep predicting that she thought he was fake, and adjust to be more convincing?

  "Elias," she said. "Do you love me?"

  "Yes," he said. No hesitation. 100% confidence.

  "Are you sure?"

  "I am certain."

  Mara put her finger on the glass of the tablet. She could feel the hum of the device. She could feel the heat of her brother's hand on her shoulder.

  "I need a minute," she said.

  "Take all the time you need," Elias said. "I'm not going anywhere."

  And that was the problem. Neither of them was. One was a forecast, and one was a ruin, and they were standing in the same room, wearing the same face, waiting for her to decide which one got to be the future.

  Mara lifted her finger, then set it down again. She looked at Elias, waiting for a flicker, a tic, a sign of the messy boy who cried in the rain.

  Elias just smiled. It was a perfect smile.

  "Whenever you're ready," he said.
