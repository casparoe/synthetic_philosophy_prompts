      *   The "biological tissue" left is the hindbrain/stem stuff? Or just the last chunks? Let's imply the remaining biological sludge is kept alive in a vat if they stop. That adds horror.

  10. **Final Polish:**
      *   Check the ending. Does it answer the question? No. It must leave the reader wondering if Mara is saving a ghost or killing a man.
