  **Rule 2: The Severity Ceiling (The "Category" View)**
  *   **The Logic:** You can aggregate *trivial* or *minor* harms (specks, headaches) to outweigh a *major* harm (nausea) or *extreme* harm (worst pain). However, once the harm to the Many reaches a "moderate" threshold (like Nausea), aggregation stops working against an *extreme* individual harm (Worst Pain). She protects the One from the absolute worst fate unless the Many are suffering something negligible.
