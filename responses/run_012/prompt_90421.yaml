  ### The Two Competing Rules

  Based on her five commitments, Priya is clearly an **aggregativist** (she sums up total harm), but there is a subtle ambiguity in *how* she weights different severities of harm. Two rules fit her past verdicts perfectly but diverge on your new case.

  **Rule 1: The Linear Aggregator (The "Math" View)**
  *   **The Logic:** All pain is convertible into a common currency of "suffering units." A day of nausea is worth $X$ headaches; the worst pain is worth $Y$ headaches. You simply multiply the harm by the number of people and choose the lower total.
