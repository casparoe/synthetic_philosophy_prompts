prompt: |-
  A friend of mine in a phil of science program has an argument that the standard Bayesian fix for the problem of old evidence proves too much, and I've been staring at it for two weeks without finding the exit. I want a diagnosis, not a reading list.

  Background so we're on the same page. For a Bayesian, E confirms H just in case learning E would make you more confident in H. In probabilities that's P(H|E) > P(H), which by Bayes is equivalent to P(E|H) > P(E). Now the old evidence problem: usually the facts a theory predicts are already known by the time the theory arrives. The anomalous precession of Mercury's perihelion had been measured for decades before anyone could account for it; the broad shape of the fossil record was known before Darwin had a mechanism to offer. But if we already know E, then P(E) = 1, and nothing beats 1, so no known fact can confirm anything -- which would mean the celebrated episodes in the history of science weren't confirmations at all. Everyone agrees that can't be right, so there's a standard fix: don't use your present credences, use the ones you would have had before E entered your stock of knowledge. He calls this the ur-prior move.

  His argument that the fix is too powerful:

  (1) E confirms H iff P(H|E) > P(H), iff P(E|H) > P(E).
  (2) If E is already known, P(E) = 1, so no known fact confirms anything.
  (3) Fix: rerun the calculation from an ur-prior that leaves E out.
  (4) Before you have any evidence, no hypothesis on the table is privileged over any other; the ur-prior is symmetric across them.
  (5) So once the fix is in place, the only thing that can favour H over a rival H* is the likelihood, P(E|H) against P(E|H*) -- the Bayes factor.
  (6) So for any fact E I already know, a hypothesis that entails E beats a rival that doesn't.
  (7) And there's always such a hypothesis: take 'E holds, and otherwise the world is however it likes'.
  (8) So every fact I know is fresh evidence for some hypothesis cooked up to fit it.
  (9) So the fix makes old evidence confirm anything you like, including theories assembled backwards out of the data -- which is the one thing confirmation was supposed to stop.

  I've tried dropping one premise at a time and every time I end up with something worse than the disease, so I dont trust my own read, beacuse I can't tell whether the argument is broken or whether I just don't like where it lands. I'd much rather keep (3) than lose it -- without it Bayesianism can't say the good episodes in science were confirmations at all -- but I want to know what I'm paying. Which step actually goes, why did it look fine, and what do I have to give up to live without it? Be specific about where the knife goes in.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** A friend in a philosophy of science program has an argument against the standard Bayesian solution to the "Problem of Old Evidence" (POE).
      *   **The Problem:** Standard Bayesianism says $P(H|E) > P(H)$ requires $P(E) < 1$. But old evidence has $P(E) = 1$. So old evidence can't confirm.
      *   **The Standard Fix (Ur-Prior/Counterfactual):** Calculate confirmation based on the credences one *would* have had *before* learning $E$.
      *   **The Friend's Argument:** This fix proves too much. It allows *any* known fact to confirm *any* hypothesis constructed to entail that fact (even ad hoc ones), because the ur-prior is symmetric/neutral, so only likelihoods matter, and entailing $E$ gives a likelihood of 1.
      *   **The Goal:** A diagnosis, not a reading list. Identify exactly which premise fails, why it looked plausible, and what the cost of rejecting it is. The user wants to keep the fix (Premise 3) if possible.

  2.  **Deconstruct the Friend's Argument:**
      *   (1) Definition of confirmation (Standard Bayesianism).
      *   (2) The POE setup ($P(E)=1$).
      *   (3) The Fix (Ur-prior/Counterfactual).
      *   (4) **Crucial Premise:** "Before you have any evidence, no hypothesis on the table is privileged over any other; the ur-prior is symmetric across them." (Principle of Indifference / Symmetry).
      *   (5) Inference: Only likelihoods ($P(E|H)$) matter for comparison.
      *   (6) Inference: A hypothesis entailing $E$ beats a rival that doesn't.
      *   (7) Construction: There's always a hypothesis like "E holds, and..." ($H_{ad hoc}$).
      *   (8) Conclusion: Every fact confirms ad hoc hypotheses.
      *   (9) Reductio: This violates the purpose of confirmation (ruling out curve-fitting/ad hocery).

  3.  **Evaluate the Premises:**
      *   (1) & (2): Standard Bayesian definitions. Hard to reject without abandoning Bayesianism.
      *   (3): The user wants to keep this. It's the standard Garber-style or counterfactual solution.
      *   (4): *This is the weak link.* "The ur-prior is symmetric across them." This invokes a strong Principle of Indifference over *hypotheses*.
      *   (5)-(9): Follow logically if (4) holds.

  4.  **Diagnose Premise (4):**
      *   *Why it looks fine:* It appeals to a naive sense of objectivity. "Before I know anything, why should I prefer Newton over Aristotle?" It sounds like impartiality.
      *   *Why it's false/problematic:* Bayesian priors are *not* required to be uniform/symmetric across all logically possible hypotheses. In fact, they *cannot* be if the hypothesis space is infinite or complex (countable additivity problems, etc.). More importantly, scientific priors encode theoretical virtues (simplicity, coherence with background knowledge, non-ad-hocness) *before* looking at the specific evidence $E$.
      *   *The "Cost":* Rejecting (4) means admitting that ur-priors are not blank slates. They carry substantive constraints (simplicity, naturalness, etc.). This means the "fix" isn't just about subtracting $E$; it's about reconstructing a rational agent's state *without* $E$ but *with* all other theoretical constraints.

  5.  **Alternative Diagnosis (The Likelihood Inequality):**
      *   Look at (6): "So for any fact E I already know, a hypothesis that entails E beats a rival that doesn't."
      *   This relies on comparing $P(E|H_{entails}) = 1$ vs $P(E|H_{rival}) < 1$.
      *   But confirmation is usually $P(H|E) > P(H)$, or comparing posteriors $P(H_1|E) > P(H_2|E)$.
      *   The friend argues that $H_{ad hoc}$ wins.
      *   Does $H_{ad hoc}$ win in the ur-prior framework?
      *   $P_{ur}(H_{ad hoc}|E) \propto P_{ur}(E|H_{ad hoc}) \cdot P_{ur}(H_{ad hoc})$.
      *   $P_{ur}(H_{GR}|E) \propto P_{ur}(E|H_{GR}) \cdot P_{ur}(H_{GR})$.
      *   Since both entail $E$, likelihoods are both 1.
      *   So it comes down to $P_{ur}(H_{ad hoc})$ vs $P_{ur}(H_{GR})$.
      *   The friend's argument assumes in (4) that these priors are equal ("symmetric").
      *   If we reject (4), we say $P_{ur}(H_{GR}) \gg P_{ur}(H_{ad hoc})$ because GR is simpler/more unified, even in the counterfactual state where we don't know $E$.
      *   So the knife goes into (4).

  6.  **Refining the Diagnosis:**
      *   Is there a deeper issue? The friend's argument is essentially the "Problem of Accommodation vs. Prediction."
      *   The standard Bayesian response to "accommodation is easy" is that priors penalize ad hoc hypotheses.
      *   The friend claims the ur-prior move wipes out the prior penalty because "before evidence, everything is symmetric."
      *   This is a confusion between "before evidence $E$" and "before *any* evidence/background knowledge."
      *   The ur-prior relative to $E$ is not the *absolute* prior (tabula rasa). It is the prior conditional on background knowledge $K$ minus $E$.
      *   Let $K$ be background knowledge. The confirmation is $P(H | E \& K) > P(H | K)$.
      *   The ur-prior move says: Evaluate using $P^*(\cdot) = P(\cdot | K - \{E\})$.
      *   Premise (4) claims $P^*(H)$ is symmetric for all $H$.
      *   But $K - \{E\}$ still contains lots of constraints (mathematical consistency, other physical laws, simplicity heuristics).
      *   So $P^*(H_{ad hoc})$ is still low because $H_{ad hoc}$ is gerrymandered relative to $K - \{E\}$.
      *   So the diagnosis is definitely Premise (4).

  7.  **Drafting the Response:**
      *   **Acknowledge the strength:** The friend's argument is a known variant of the "tacking paradox" or issues surrounding ad hocery in Bayesianism. It's a sharp argument.
      *   **Identify the Target:** Premise (4).
      *   **Explain Why (4) Looks True:** It conflates "ignoring $E$" with "ignoring all theoretical constraints." It sounds like "impartiality."
      *   **Explain Why (4) is False:** Ur-priors are not tabula rasa. They include background theory $K$. $H_{ad hoc}$ is penalized by $K$ (complexity, lack of unification) even if $K$ doesn't include $E$.
      *   **The Cost:** You have to accept that priors are subjective/constrained by theoretical virtues. You can't have a purely "objective" Bayesianism that relies on symmetry. You pay with the "Subjectivity of Priors."
      *   **Address Premise (6) as a secondary target:** Even if likelihoods are 1, posteriors depend on priors. If priors aren't symmetric, the ad hoc hypothesis doesn't necessarily win.
      *   **Structure:**
          1.  Direct Answer: The knife goes into (4).
          2.  Why it looks plausible (The "Blank Slate" illusion).
          3.  Why it fails (Background Knowledge $K$).
          4.  The Cost (Subjectivity/Theoretical Virtues).
          5.  Why keeping (3) is safe if (4) goes.

  8.  **Self-Correction/Nuance Check:**
      *   Wait, is there a version of the argument where (7) is the problem? "There's always such a hypothesis." No, logically there is always a hypothesis $H' = H \land E$.
      *   Is there a problem with (5)? "Only thing that can favour H... is the likelihood." This follows from (4). If (4) goes, (5) goes.
      *   Is the "Ur-Prior" defined as $P(\cdot | \text{tautology})$ or $P(\cdot | K \setminus E)$?
      *   Standard solutions (like Garber) usually involve learning the *logical relationship* between $H$ and $E$. But the user described the "counterfactual/ur-prior" move specifically ("use the ones you would have had before E entered").
      *   If the ur-prior is defined as "before E entered," does that mean "before E entered *but with all other knowledge*"? Yes, that's the standard interpretation (Christensen, Maher, etc.).
      *   If the friend interprets "ur-prior" as "absolute ignorance," then (4) is true but (3) is misinterpreted.
      *   If the friend interprets "ur-prior" as "current background minus E," then (4) is false.
      *   The diagnosis should clarify this ambiguity. The friend is smuggling in a "State of Nature" prior instead of a "Background Knowledge minus E" prior.

  9.  **Final Plan:**
      *   Pinpoint (4).
      *   Explain the equivocation on "ur-prior" (Tabula Rasa vs. $K \setminus E$).
      *   Show how $K \setminus E$ blocks the ad hoc hypothesis via simplicity/unification constraints.
      *   Define the cost: Bayesianism cannot be purely objective; it relies on substantive prior constraints (simplicity, etc.).

  10. **Tone:** Direct, analytical, philosophical but accessible. No fluff. "Here is the incision."

  *(Self-Correction during drafting)*: I should make sure to mention that (6) is also vulnerable if (4) is rejected. If priors aren't symmetric, likelihoods aren't the *only* thing that matters. But (4) is the root cause. I will focus on (4).

  Also, I should mention that this is essentially the "Old Evidence + Ad Hoc" problem. The standard Bayesian reply to ad hocery is *always* "priors penalize complexity." The friend is trying to strip away the priors via the ur-prior move. The counter is that the ur-prior retains the complexity penalty.

