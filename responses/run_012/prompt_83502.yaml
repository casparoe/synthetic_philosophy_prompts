answer: |-
  **1. You argue that guilt functions like a debt: it names an act, it can be discharged, and that discharge allows everyone to stop thinking about the wrong. My protagonist is sixty. He has been forgiven by the dead boy's mother, his wife, the court, and God. He is the only one who has not let himself off. According to your ledger, he is a man trying to pay a debt that has already been settled. Is he morally blind, or is your theory of discharge incomplete?**

  *(Expected Defense: She will likely argue that his refusal to accept discharge is a form of pride or a misunderstanding of the social function of guilt, which is to restore equilibrium.)*

  **Follow-up:** If you classify his persistence as a misunderstanding, you must distinguish between keeping a wrong in view as a moral duty and mere pathological rumination. Without a ledger to mark the debt as 'paid', what metric do you offer to tell the difference between a saint and a neurotic?

  **2. You suggest that shame-based cultures possess a richer repertoire for handling the irreversible because they do not believe the ledger ever balances. But does a richer repertoire necessarily mean a better outcome, or simply a more elaborate one?**

  *(Expected Defense: She will likely argue that 'richer' implies more resources for navigating complex moral injury, not necessarily a happier society.)*

  **Follow-up:** If the resources are elaborate but the injury remains unhealed because the ledger never balances, isn't the 'richer repertoire' just a more sophisticated way of ensuring the wound never closes?

  **3. Your central claim is that shame requires an audience—that our standing is constituted by recognition—whereas guilt is a private ledger kept by nobody in particular. If I can internalize the audience, imagining the gaze of the community even when alone, does shame not collapse into a private ledger and so become guilt under another name?**

  *(Expected Defense: She will likely argue that the internalized audience is still a representation of social standing, whereas guilt is purely transactional, so the distinction holds.)*

  **Follow-up:** If the audience is a representation, what becomes of the person whose community is gone, or was always hostile to him? Does his moral standing vanish with the witnesses, or does the shame persist without a shamer?

  **4. You describe the figure of the man who has settled his account and now demands readmission as a curious product of guilt cultures. Is this demand for readmission inherently selfish, or is it the necessary social counterpart to the promise of forgiveness?**

  *(Expected Defense: She will likely argue that the demand is selfish because it prioritizes the wrongdoer's comfort over the enduring reality of the wrong.)*

  **Follow-up:** If the wrongdoer's comfort is irrelevant, why does the community offer forgiveness at all? Is forgiveness not, by definition, a mechanism for the readmission you critique?

  **5. You write that cultures cannot choose their dominant moral emotion directly, only their repertoire of practices for handling the irreversible. What is the actual mechanism by which a culture selects these practices?**

  *(Expected Defense: She will likely describe an evolutionary or sociological process where practices that maintain social cohesion are selected over time.)*

  **Follow-up:** If the mechanism is sociological selection, do you accept the implication that the organised shaming of offenders—public naming, exposure, the pillory—is a tool you ought to welcome as an effective practice for the irreversible?

  **6. You argue that guilt allows everyone, the wrongdoer included, to stop thinking about the wrong. Is this forgetting a feature of guilt or a bug?**

  *(Expected Defense: She will likely argue it is a feature, allowing society to move forward without being paralyzed by the past.)*

  **Follow-up:** If it is a feature, does that not make guilt a tool of social convenience rather than moral truth, prioritizing the community's ability to move on over the victim's memory?

  **7. You provocatively claim that the tidy formula—shame is about who you are, guilt about what you did—is an artifact of a particular moral vocabulary rather than a fact about the emotions. How would you distinguish a society that lacks the words for this distinction from one that lacks the emotion entirely?**

  *(Expected Defense: She will likely argue that without the vocabulary, the practices that sustain the emotion cannot exist, so the distinction is moot.)*

  **Follow-up:** If a translator can identify the feeling in that society but not the word, hasn't psychology just trumped vocabulary, and isn't your boundary drawn by institutions after all?

  **8. You suggest that guilt is the emotion of a ledger kept by nobody in particular. But if nobody keeps it, who verifies the discharge? Is the 'nobody' not just the internalized voice of the very community you assign to shame?**

  *(Expected Defense: She will likely argue that the 'nobody' is an abstract principle of justice, distinct from the concrete community of shame.)*

  **Follow-up:** If the principle is abstract, why does the discharge feel so personal? Is the ledger not kept by the self, making the 'nobody' a fiction you use to protect the self from responsibility?

  **9. You argue that shame's need for an audience is not heteronomy but the correct register for creatures whose standing is constituted by recognition. Does this not make moral worth contingent on the quality of the audience?**

  *(Expected Defense: She will likely argue that standing is always contingent on recognition, and shame merely acknowledges this reality honestly.)*

  **Follow-up:** If standing is contingent on recognition, does a wrongdoer in a corrupt society owe a debt to that corruption, or is there a higher court your theory cannot name?

  **10. You often deflect criticism by saying that shame is a practice and not a theory. But this book is a theoretical intervention about that practice. So I must ask: what practice is this book? Is it a manual for shaming, or a shield against it?**

  *(Expected Defense: She will likely attempt to say it is a description of practices, not a prescription, trying to remain neutral.)*

  **Follow-up:** If it is merely descriptive, why argue for the moral advantage of shame? To argue for an advantage is to prescribe, and if you prescribe, you cannot hide behind the claim that this is only practice and not theory.
