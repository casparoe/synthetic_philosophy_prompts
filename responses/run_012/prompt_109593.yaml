answer: |-
  Leo and Sam are strangers waiting at a crosswalk. They see a heavy delivery cart stalled on the curb, blocking the ramp. Leo says, "I'll push from behind if you guide the front." Sam says, "Okay, let's get it around the corner." They both know either can stop whenever they want, no questions asked. They push. Leo watches Sam's hands on the handle and adjusts his shove so he doesn't tip the cart; Sam feels Leo's push and steers to match. The cart moves only because both are doing it. They get it around the corner. Either could have quit mid-push without the other having a right to complain, and both know this. They did it together.

  Here is how the three views handle this.

  View 1 says joint action happens when we share a goal, our plans fit, and we are committed to doing our part. This view fits the case well. Leo and Sam share the goal of moving the cart. Their plans mesh (pushing and steering). They are committed to their parts in the sense that they intend to keep going, but this view can accept that this commitment is just a stable intention, not a debt. They rely on each other, but they don't owe each other.

  View 2 says the "we" is just an attitude inside your own head. You don't need the other person to know or be on the hook. This view also says they acted together, because each thought "we are moving this." But this view is too loose. It would say they acted together even if Leo pushed while Sam slept, as long as Leo thought "we." It misses the crucial bit where they actually watched and adjusted to each other.

  View 3 says acting together requires a joint commitment that creates an obligation. If we act together, I owe it to you to keep going, and you can complain if I quit. This view comes out badly. It has to say Leo and Sam did *not* act together. Because they explicitly agreed neither owed the other anything, View 3 says there is no joint commitment, and therefore no joint action. It forces us to say what looks like cooperation is just two separate things happening at once.

  The defender of View 3 would push back hard. They would say you cannot simply wish away obligation. The moment Leo relied on Sam to steer, Sam created a normative expectation. If Sam had let go without warning, Leo would have been left struggling, and that harm creates a duty even if they said otherwise. The "no complaint" agreement is just words; the structure of relying on another person creates the obligation automatically. The defender would argue the case is impossible: if they truly felt no obligation, they weren't really coordinating, just coinciding.

  The single feature doing the work is the **mutual responsiveness without normative binding**. They are watching and adjusting to each other (which makes it joint), but they have stripped out the right to complain (which removes the obligation). If you change this so they *promise* to see it through, View 3 wins. The promise creates the obligation they tried to avoid, and now quitting would be a wrong. If you change it so they stop watching each other and just push like robots, View 2 might still call it joint, but View 1 and 3 would say it's not. It stops being joint action and becomes parallel action, because the "together" part lives in the adjusting, not just the moving.

  Does this show the "we" is a real thing about the pair that you can't break down into facts about each person, or just loose talk? It shows the "we" is a **real thing about the pair**. It is not just loose talk, because there is a specific structure here—interdependence and responsiveness—that isn't present when two people act alone. However, you don't need a magic group mind to explain it. The "we" is the pattern of interaction itself. It is real, but it is built out of what each person does and how they react to the other, not a separate substance floating above them.
