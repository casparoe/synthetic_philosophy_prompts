prompt: |-
  I've been thinking alot about what it actually means for two people to do something together, and I want a case built to order. I've never studied philosophy, so keep the language plain. What I'm trying to show is that two people can genuinely do something together without either one owing the other anything — if the case doesn't actually show that, tell me.

  Here's what I need: one ordinary scenario, no more than a paragraph, two people (three at most), nothing sci-fi — no hive minds, no shared brains, no magic, no perfect mind readers. Somewhere ordinary: a street, a kitchen, a garage, a shop. The two of them agree on the spot to do a thing together; each does their own part; they watch each other and adjust as they go; and neither part works without the other, so the thing only gets done because of the two of them. But: no friendship, no marriage, no family, no team, no boss, no money, no contract, no threat — nothing that makes either of them owe the other anything. And baked right into the deal they make is this: either one can walk off in the middle, for any reason or no reason, and the other has nothing to complain about, no apology due, nothing owed. Both of them would agree the other is totally within their rights to bail.

  The catch is that it still has to be true that they did it together, and both of them would say so — not just two separate things happening at once. It has to earn that, not have it stipulated. So dont smuggle an obligation back in (if somebody would feel bad, fine, but call it a feeling and let the views deal with it).

  Then walk me through what three views have to say about the case, and why: (1) the view that doing something together means each of us has the shared goal as our own, our plans fit together, and we're each committed to doing our part — so a commitment to the other is part of what acting together is; (2) the view that the "we" is a basic attitude each person has inside their own head, and it doesn't need the other person to know about it or be on the hook for anything; (3) the view that acting together takes a joint commitment, which puts each of us under an obligation to the other and gives each of us standing to complain if the other quits.

  Tell me which view comes out badly and how its best defender would push back on the case — the strongest version, not a strawman. Tell me which single feature of the case is doing the work, and what happens if I change it: if they'd promised each other to see it through, does anything flip? If instead they stopped watching each other and just did their parts like robots, does it stop being joint? Also give me a straight answer on whether this shows the "we" is a real thing about the pair that you can't break down into facts about each person on their own, or whether it just shows that "we" talk is loose. Pick a side.

  No citations or reading suggestions, please — I can't look anything up right now. American English.
