answer: |-
  It is entirely understandable that you find yourself returning to the etiological account (often called the selected-effects theory). Defended most notably by Ruth Millikan and Karen Neander, it remains the only robust framework that successfully captures the normativity of biological traits—explaining how a heart can *fail* to pump blood while remaining a heart, rather than simply becoming a non-pumping lump of muscle. A purely causal-role account (à la Robert Cummins), which defines function as a capacity contributing to a system's current activity, struggles to distinguish between a proper function and a mere beneficial side-effect.

  However, your suspicion is well-founded. The etiological account is metaphysically elegant but empirically brittle. It purchases its explanatory power at the cost of making function ascriptions dependent on historical facts that are often inaccessible or non-existent. Below is a map of that exposure, sorted by the severity of the threat, followed by an adjudication of the specific pressure points you raised.

  ### A Taxonomy of Defeaters

  To determine what should actually move an etiological theorist, we must distinguish between objections that require a revision of the theory, those that require a 'bite the bullet' concession, and those that can be waved away as category errors.

  **1. The Decisive Defeaters (Require Revision or Abandonment)**
  *   **The Novelty Problem:** Traits that arise without a selection history (e.g., the first instance of a mutation, or synthetic constructs) cannot have etiological functions. If the theory cannot accommodate the functional status of novel traits without appealing to a *different* kind of function (e.g., artefactual), it fails as a *general* theory of biological function.
  *   **The Epistemic Gap:** If function is defined by selection history, but that history is unknowable (which is often the case in evolutionary biology), then function ascriptions become unverifiable hypotheses rather than descriptions of current reality. If biologists cannot, even in principle, verify the function, the concept loses its utility in scientific practice.

  **2. The Serious Objections (Require Qualification)**
  *   **Exaptation and Function Shift:** When a trait is co-opted for a new use (feathers for flight, originally for warmth), the strict etiological view implies the trait retains its old function or has no new one until a new selection history is established. This clashes with biological intuition that the *current* function is what matters.
  *   **The Synthetic Biology Challenge:** In your friend's field, parts are designed, not selected. If the etiological account must lean on the *designer's intention* to ascribe function to a genetic circuit, it ceases to be a purely biological account and becomes a hybrid of biology and artefact theory.

  **3. The Manageable Objections (Can be Conceded or Waved Away)**
  *   **The First-Generation Problem:** Strictly speaking, the very first heart did not have the function of pumping blood, because it had no history of selection. Etiological theorists (like Neander) generally concede this. They argue that while the first *token* lacked a function, the *type* acquires the function retrospectively once selection occurs. This is counter-intuitive but logically consistent.
  *   **Biologists' Ignorance:** The claim that biologists 'don't care' about history is a methodological observation, not a metaphysical one. The etiological theorist can wave this away by arguing that when biologists ascribe function, they are *implicitly* hypothesising about history, even if they are not explicitly reconstructing phylogenies.

  ---

  ### Working Through the Pressure Points

  #### 1. Exaptation: The Shifting Goalpost
  You ask about a trait maintained by selection now for purpose $B$, but which spread originally for purpose $A$. Does it have two functions, one, or none?

  *   **The Etiological Verdict:** Strictly, it has the proper function $A$. Function $B$ is merely a 'beneficial effect' or a 'current utility' until a new lineage of selection establishes $B$ as the reason for the trait's reproduction.
  *   **The Exposure:** This is intolerable for many working biologists. If a structure is currently doing $B$ and is being actively selected for $B$, denying it the label 'function' seems pedantic.
  *   **The Revision:** Millikan introduces the notion of 'derived proper functions'. If a trait begins a new cycle of reproduction based on effect $B$, it acquires a new proper function. However, this requires a period of stabilisation.
  *   **Assessment:** This is a **Serious Objection**. The etiological theorist must concede that function can shift, but they must insist on a historical threshold. If they allow function to shift instantly with current utility, they collapse back into the causal-role account. The account survives here, but it demands a more complex vocabulary than biologists typically use.

  #### 2. Novel Traits and Synthetic Biology: The Designer Loophole
  This is the most critical point for your friend. Consider a metabolic pathway inserted into a bacterium. It has a clear effect, but no selection history within that lineage.

  *   **The Etiological Verdict:** Biologically, it has no proper function *yet*. It is a mutation waiting to be tested by selection. However, as an *artefact*, it has a function derived from the intention of the synthetic biologist.
  *   **The Exposure:** If the account must reach for the designer's intention to make sense of synthetic parts, has it quietly become a different account? Yes. It reveals that the etiological account is not a unified theory of function, but rather two theories glued together: one for natural selection, one for intelligent design.
  *   **Assessment:** This is a **Decisive Defeater** for the claim that etiological theory is the *sole* account of biological function. In synthetic biology, 'function' is often forward-looking (what we intend it to do) rather than backward-looking (why it is here). The etiological theorist must concede that their account applies only to *naturalised* traits. For synthetic constructs, function is normative based on design, not history. This suggests a **pluralist** approach is necessary: etiological for evolved traits, causal-role or intentional for engineered ones.

  #### 3. The First-Generation Problem
  Can the account distinguish a function from a mere effect in the first generation without circularity?

  *   **The Etiological Verdict:** No. In the first generation, there is no functional distinction. The trait is merely a variation. It only becomes functional in generation two, provided it contributes to reproduction.
  *   **The Exposure:** It feels wrong to say the first heart wasn't functioning.
  *   **Assessment:** This is a **Manageable Objection**. Neander handles this by distinguishing between tokens and types. The first token heart was a functional *prototype*, but the *function* belongs to the type, which is constituted by the history of the lineage. The theorist concedes the first token lacked a 'proper function' but argues this is a acceptable cost for securing the normativity of all subsequent tokens. This does not threaten the core of the view.

  #### 4. Epistemic Access: Hostage to History
  You worry that tying function to selection history makes function ascriptions hostage to facts biologists neither know nor care about.

  *   **The Etiological Verdict:** This is a confusion of metaphysics with methodology. The theory claims to say what function *is*, not how we *discover* it. Biologists may use current structure as a proxy for history, but they are still making a claim about history.
  *   **The Exposure:** If the history is lost (e.g., extinct traits) or conflated (e.g., spandrels), the function becomes unknowable. If a concept is unknowable, is it scientifically valid?
  *   **Assessment:** This is a **Serious Objection**. While the metaphysical point stands, a philosophy of biology that renders standard biological practice unknowable is deficient. The theorist must concede that in the absence of historical data, function ascriptions are *provisional*. They are hypotheses about selection, not established facts. This weakens the authority of function ascriptions in palaeontology or deep phylogeny, but it does not destroy the account.

  ---

  ### Etiological vs. Causal-Role: Different Questions?

  You asked what the etiological account predicts that the causal-role account does not. The distinction is crucial.

  *   **Causal-Role (Cummins):** Answers "What does this trait *do* that contributes to the system's current capacity?" It is descriptive and systemic. It cannot easily explain malfunction (a heart that doesn't pump is simply not performing its role).
  *   **Etiological (Millikan/Neander):** Answers "Why is this trait *here*?" It is historical and normative. It predicts that a trait can exist that *ought* to do $X$ but fails to do $X$.

  **Are they competing?**
  Often, they are answering different questions. When a physiologist asks, "What is the function of the spleen?", they often want a causal-role answer (filtering blood, storing platelets). When an evolutionary biologist asks, "What is the function of the spleen?", they want an etiological answer (immune defence selected for in ancestors).

  **The Verdict on Competition:**
  Many apparent counterexamples arise because interlocutors are talking past one another. However, in synthetic biology, the causal-role account is often more useful because the 'history' is a design file, not an evolutionary lineage. The etiological account predicts normativity (the circuit *should* oscillate), but the causal-role account predicts system behaviour (if it oscillates, it contributes to the oscillator module).

  ### Insulation by Qualification

  Has the etiological account been insulated by qualification? To an extent, yes. By adding 'derived proper functions', 'artefactual functions', and 'retrospective typing', the theory risks becoming unfalsifiable. If every counterexample is met with a new sub-category of function, the term loses its bite.

  However, this is not necessarily fatal. It is more accurate to say the account has been **refined**. The core insight—that biological normativity stems from reproductive history—remains robust. The qualifications are attempts to map that core insight onto complex realities (like exaptation). The problem arises only if the qualifications become so numerous that the 'selection history' requirement is rendered optional. Currently, it is not; the history requirement remains the anchor.

  ### Honest Verdict

  The etiological account should not be abandoned, but it must be **domesticated**. It is not the universal theory of function its early defenders hoped it would be.

  1.  **Survival:** The core claim survives: for naturally evolved traits, function is inherently historical and normative. This explains malfunction and distinguishes function from mere effect better than any rival.
  2.  **Revision:** The account must be revised to acknowledge **functional pluralism**. It cannot handle synthetic biology or novel mutations without borrowing from artefact theory or causal-role theory. In synthetic biology, 'function' is often a design specification, not a historical fact.
  3.  **Concession:** The theorist must concede that for first-generation traits and exaptations in flux, function ascriptions are indeterminate. There is no fact of the matter until selection stabilises.
  4.  **Epistemic Humility:** The account must accept that function ascriptions in the absence of phylogenetic data are hypotheses, not truths.

  **Final Word:**
  Your suspicion is correct: the etiological account is more exposed than its textbooks admit, particularly regarding novelty and synthetic systems. However, its rivals are even more exposed on the issue of normativity. The best position is not to choose one account, but to recognise that 'function' is a polysemous term. In evolutionary biology, the etiological account is king. In synthetic biology and physiology, the causal-role or intentional accounts often hold sway. To insist on the etiological account for *all* cases is to force a historical square peg into a systemic round hole. Keep the etiological account for its explanation of normativity, but do not let it dictate the terminology of your friend's lab work.
