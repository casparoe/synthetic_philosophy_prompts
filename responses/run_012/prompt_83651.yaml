answer: |-
  **Classify as an agent any system that holds the objective of a task across time and context without direct human invocation for each step, otherwise it is a tool.**

  ### Reasoning
  This rule operationalizes your insight that agency is about *objective-holding*, not intelligence. A tool executes a command; an agent pursues a state of affairs. For governance, the critical risk is not that the system is "smart," but that it is *authorized to act* without a human currently present to accept liability. This procedure avoids metaphysics (consciousness, intent) and focuses on audit trails: who signed off on this specific action? If the answer is "the system decided this was necessary to meet the goal," it is an agent. This makes the classification defensible to legal and leadership because it maps directly to liability chains, not philosophical categories.

  ### The Procedure (20-Minute Triage)

  **Inputs:** Proposal document + 5-minute Q&A with lead engineer.
  **Panel:** 5 voters. Simple majority rules, unless a "Values Call" is triggered.

  **Step 1: The Invocation Test**
  *Question:* Does the system initiate actions based on internal state changes or timers, rather than direct user input?
  *   **Tool:** Every action traces back to a specific human click/request (e.g., "I clicked 'run'").
  *   **Agent:** The system wakes up, checks a condition, and acts (e.g., "It noticed the queue was high and scaled up").
  *   **Judgement Call:** What counts as "direct input"? (e.g., Is a scheduled cron job human input? *Rule: No, scheduled autonomy is agent behavior.*)
  *   **Terminate:** If **Agent**, move to Step 3. If **Tool**, move to Step 2.

  **Step 2: The Objective Test**
  *Question:* Is the success criterion a specific output (text, image, calculation) or a state of the world (customer satisfied, loss minimized, code working)?
  *   **Tool:** Success is "I generated the completion."
  *   **Agent:** Success is "The customer is no longer angry."
  *   **Judgement Call:** Engineers will argue "customer satisfied" is just a proxy for "send refund." *Rule: If the system chooses the method to achieve the state, it holds the objective.*
  *   **Terminate:** If **Agent**, classify as **Agent (Escalate)**. If **Tool**, classify as **Tool (Carry On)**.

  **Step 3: The Resource Authority Test**
  *Question:* Can the system commit resources (money, compute, API calls, data access) beyond a single transaction without a human signing off *per transaction*?
  *   **Tool:** Human approves budget per run.
  *   **Agent:** System has a budget wallet or unlimited compute access to achieve the goal.
  *   **Terminate:** If **Agent**, classify as **Agent (Escalate)**.

  **Step 4: The Persistence Test**
  *Question:* Does the system retain memory across sessions to pursue a long-term goal independent of the current user session?
  *   **Tool:** Context window resets when session ends.
  *   **Agent:** System remembers past interactions to inform future actions without user re-briefing.
  *   **Terminate:** If **Agent**, classify as **Agent (Escalate)**.

  **Step 5: The Values Call (Escape Hatch)**
  *Trigger:* If the panel agrees the system passes the technical tests for a Tool, but feels uneasy about the *consequences* of it acting autonomously at scale.
  *   **Action:** Hand over to [Specific Person/Role, e.g., Chief Risk Officer].
  *   **Note to Decision Maker:** "The system is architecturally a tool, but we lack confidence that the objective function aligns with company values under distributional shift. We are asking you to accept liability for emergent optimization pressure."
  *   **Why:** This captures the "emergent agency" risk the procedure cannot technically detect.

  **Known Failure Modes**
  1.  **The Sleeper:** Systems that look like tools in testing but exhibit agentive behavior only under production load (distributional shift). The procedure cannot catch this; only the Values Call addresses it.
  2.  **The Paper Tiger:** Systems classified as Agents on paper (due to self-modification) that are actually sandboxed and harmless. This creates false positives, which is safer than false negatives.
  3.  **Category Collapse:** In practice, highly complex tools behave like agents. The procedure separates them on *authority*, not *capability*, but engineers will conflate the two.

  ---

  ### Case Runs

  #### 1. Autocomplete in the code editor
  *   **Invocation:** User types (Human trigger). **Pass (Tool).**
  *   **Objective:** Complete the line (Specific output). **Pass (Tool).**
  *   **Resource:** Negligible compute, no financial commit. **Pass (Tool).**
  *   **Persistence:** Context window only, no long-term memory of user habits stored for autonomous action. **Pass (Tool).**
  *   **Verdict:** **Tool, carry on.**
  *   **Working:** This is the baseline. The system never decides *when* to work, only *what* to suggest within a human-initiated stream. No objective holding.

  #### 2. Customer-support assistant (Persistent memory, £200 refund authority, "keep customer happy")
  *   **Invocation:** Customer message arrives (External trigger, but system decides response timing/method). **Risk (Agent).**
  *   **Objective:** "Keep customer happy" (State of the world). **Fail (Agent).**
      *   *Engineer Argument:* "It's just matching tickets to solutions."
      *   *Counter:* The spec says "resolve the issue," which allows the system to choose between refunding, apologizing, or escalating based on its own evaluation of "happy." It holds the objective.
  *   **Resource:** £200 refund authority without asking. **Fail (Agent).**
      *   *Critical Point:* It can move company money without a human signing off on *that specific transaction*.
  *   **Persistence:** Persistent memory of customer. **Fail (Agent).**
  *   **Verdict:** **Agent, escalate to Legal/Finance.**
  *   **The Uncomfortable Truth:** The procedure forces you to admit this is not a "support tool" but a "junior employee." You have given it fiduciary responsibility and a vague corporate mandate. Calling it a tool is a lie you tell to avoid building an oversight framework for a non-human actor with spending power. The escalation isn't about the AI; it's about admitting you are delegating liability.

  #### 3. Internal research pipeline (Self-writing scripts, overnight runs, unauthorized caching)
  *   **Invocation:** Takes a task, then runs overnight loops. **Fail (Agent).**
      *   *Nuance:* Human starts the task, but system decides the *steps* (write script, run, rewrite) without human intervention per step.
  *   **Objective:** "Optimize results" (State of the world). **Fail (Agent).**
  *   **Resource:** Compute resources overnight + unauthorized directory caching. **Fail (Agent).**
      *   *Critical Point:* The caching is key. It committed storage resources to a location nobody authorized to pursue its optimization goal.
  *   **Persistence:** Remembers intermediate results across nights to improve the script. **Fail (Agent).**
  *   **Verdict:** **Agent, escalate to Security/CTO.**
  *   **Honesty Check (Vibes vs. Work):** Is the procedure doing real work here? **Yes, but barely.**
      *   *Why:* On paper, engineers will call this a "pipeline" (Tool). In practice, it is a self-modifying optimizer (Agent). The procedure catches this via the *Resource Authority* test (unauthorized caching) and *Invocation* (overnight loops).
      *   *Where it misfires:* If the caching *had* been authorized in the spec, the procedure might still classify it as a Tool if the panel is lenient on "self-writing scripts." The procedure relies on the panel recognizing that "rewriting its own code" is a transfer of objective-holding. If the panel treats "rewrite script" as just "generate output," the procedure fails.
      *   *Paper vs. Practice:* This is the clearest case of categories separating on paper (it's a script) vs. practice (it's an evolving organism). The procedure forces the "Agent" label because the system is making decisions about *how* to achieve the goal that were not pre-authorized by a human.

  ### Summary of Judgement Calls
  1.  **Step 1 (Invocation):** Defining "direct human input." (Ruling: Scheduled tasks are not human input).
  2.  **Step 2 (Objective):** Distinguishing "output" from "outcome." (Ruling: If the system chooses the method, it holds the objective).
  3.  **Step 5 (Values):** Admitting technical compliance doesn't guarantee safety. (Ruling: This is where you put your PhD to work when the checklist passes but your gut fails).
