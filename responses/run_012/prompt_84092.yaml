answer: |-
  Here is a teaching plan designed for a 75-minute session with a mixed-discipline audience at the PhD level. It prioritizes structural integrity over breadth, ensuring the specific pedagogical pitfalls you identified are neutralized before they can derail the discussion.

  ### I. The Sequence and Dependencies

  You must resist the temptation to move linearly from "easy examples" to "hard examples." If you treat the tomato case as a prototype for the chair case, you will reinforce the misconception that verbal disputes are resolved by looking up definitions. The sequence must instead move from **terminological stipulation** to **structural diagnosis** to **substantive application**.

  **1. Terminological Stipulation & The "Bank" Case (0–10 mins)**
  *   **Content:** The ordinary distinction between factual disagreement and semantic mismatch (the "bank" example).
  *   **Dependency:** None. This is the entry point.
  *   **Premature:** Do not yet suggest that metaphysical disputes *are* like this.
  *   **Misconception Head-off (The Linguist):** At minute 2, explicitly address the "verbal = spoken" objection.
      *   *Action:* State that in this literature, "verbal" is a technical term of art meaning "pertaining to the semantic values of expressions," not "uttered vocally."
      *   *Reason:* If you allow the linguist to debate the etymology, you concede that the philosophical category is ill-formed. Treat it as a stipulative definition required for the session, not a claim about English usage.

  **2. The Definition of "Merely Verbal" in Metaphysics (10–25 mins)**
  *   **Content:** Component 2 (agree on facts, disagree on words) and Component 6 (reflexive worry).
  *   **Dependency:** Requires the "Bank" case to establish the baseline, but immediately complicates it.
  *   **Premature:** Do not introduce the Chair case yet. Keep it abstract.
  *   **Misconception Head-off (The Philosopher):** At minute 15, address the claim that "verbal = unimportant/nobody is wrong."
      *   *Action:* Distinguish *diagnosis* from *dissolution*. A dispute can be verbal (source is language) yet high-stakes (pragmatic consequences of adopting one framework over another).
      *   *Reason:* If they believe verbal disputes are trivial, they will dismiss the metaontological project as pointless before you reach the case study.

  **3. The Carrying Example: Chair vs. Particles (25–45 mins)**
  *   **Content:** Component 3 (the metaontological case).
  *   **Dependency:** Requires the definition from Step 2.
  *   **Premature:** Do not yet explain *how* they mean different things (Quantifier Variance). Just establish that they agree on the particle arrangement but disagree on the existence claim.
  *   **Example Decision:** **Do not use the Tomato or Pluto as the carrying example.**
      *   *Why:* Tomato/Pluto are *lexicographical* disputes. They are resolved by appealing to an authority (botanists/astronomers) or a stipulation. The Chair case is *conceptual*. There is no authority to settle whether "object" applies to particles arranged chairwise. Using Tomato/Pluto teaches students that verbal disputes are ambiguities to be cleared up. Using Chair teaches them that verbal disputes can be persistent, systematic, and resistant to stipulation.
      *   *Instruction:* Use Tomato only in Step 1 to illustrate the *ordinary* sense. Switch to Chair for Step 3 and do not return to Tomato.

  **4. The Mechanism: Framework-Relative Existence (45–60 mins)**
  *   **Content:** Component 4 (Quantifier Variance content without the label).
  *   **Dependency:** Requires the Chair case to be established as a standoff.
  *   **Premature:** Do not introduce this until the standoff is clear. If introduced too early, it looks like a magic trick to dissolve the problem rather than a diagnosis of it.
  *   **Instruction:** Explain that "there is" might function like "here" or "tall"—context-sensitive. One side uses a restrictive domain; the other uses a permissive domain.

  **5. The Counter-Thoughts: Reality and Reflexivity (60–70 mins)**
  *   **Content:** Component 5 (ducking reality) and the second half of Component 6 (diagnosis as a move).
  *   **Dependency:** Requires the Mechanism to be understood.
  *   **Premature:** None. This is the critical evaluation phase.
  *   **Instruction:** Frame the "ducking reality" objection not as a return to realism, but as a worry that QV makes ontology too easy. Frame the "reflexive worry" as: "Is claiming a dispute is verbal just a way for the nihilist to win without arguing?"

  **6. Closing Assessment (70–75 mins)**
  *   **Content:** The Closing Question.

  ---

  ### II. The Carrying Example: Specification

  **The Example:** The dispute between the **Universalist** (there is a chair) and the **Nihilist** (there are only particles arranged chairwise).

  **What it must contain:**
  1.  **Total Factual Agreement:** Both parties must agree on the position, momentum, and color of every particle involved. There is no hidden empirical fact.
  2.  **No Dictionary Appeal:** It must be clear that checking a dictionary definition of "chair" will not solve the dispute, because the dispute is about *existence*, not classification.
  3.  **Systematicity:** The disagreement must apply to *all* composite objects, not just chairs, showing it is a difference in logical framework, not a local ambiguity.

  **What disqualifies it:**
  1.  **Vagueness:** If the example relies on borderline cases (e.g., "is this broken chair still a chair?"), it becomes a sorites problem, not a metaontological one.
  2.  **Pragmatic Utility:** If the example focuses on whether we *need* the word "chair" for daily life, it becomes a pragmatic dispute, not an ontological one.

  **Why not Tomato/Pluto?**
  As noted, these teach that verbal disputes are errors to be corrected. The Chair case teaches that verbal disputes can be **equally valid frameworks**. The lesson you want is that two people can be "right" relative to their own semantic rules while disagreeing. Tomato/Pluto implies one side is simply mistaken about the rules.

  ---

  ### III. Misconceptions and Intervention Points

  | Misconception | Source | Intervention Point | Strategy |
  | :--- | :--- | :--- | :--- |
  | **"Verbal means spoken."** | The Linguist | **Minute 2 (Intro)** | Treat as a terminological stipulation. "In this room, for this hour, 'verbal' refers to semantic value, not modality. We are not debating linguistics; we are using a technical term." |
  | **"Verbal means trivial."** | The Philosopher | **Minute 15 (Definition)** | Decouple *source* from *stakes*. "A dispute can be verbal in source but consequential in outcome. Deciding which framework to adopt is itself a substantive philosophical task." |
  | **"It's just ambiguity."** | General Audience | **Minute 25 (Chair Case)** | Explicitly contrast with the "Bank" case. "Unlike 'bank', we cannot disambiguate 'exists' by pointing to a third meaning. We must choose a framework." |
  | **"This denies reality."** | Realist Intuition | **Minute 60 (Counter-thought)** | Reframe. "This does not deny the particles. It denies that 'existence' is a single, monolithic property independent of conceptual schemes." |
  | **"Diagnosis is a weapon."** | Philosophers | **Minute 65 (Reflexivity)** | Acknowledge validity. "Calling a dispute verbal is often a strategic move to dismiss an opponent. We must ensure we aren't doing that here." |

  ---

  ### IV. The Closing Question

  Your draft check ("would it survive stipulated term... what would they learn?") is **sound but vulnerable**. A determined realist will argue that even with a stipulated term, the *world* forces one usage over the other. A determined verbalist will argue nothing is learned.

  **The Better Question:**
  > "If we accept that this dispute is merely verbal, what specific **cost** do we incur in our broader philosophical system, and is that cost preferable to the cost of treating it as factual?"

  **Why this works:**
  1.  It forces them to acknowledge that "merely verbal" is not a free lunch (addressing the Philosopher's misconception).
  2.  It requires them to weigh the *consequences* of the diagnosis, not just the mechanics (addressing the Linguist's focus on usage).
  3.  It tests whether they understand that metaontology is about **theory choice**, not just dictionary work.

  ---

  ### V. The Refusals (Scripted)

  You requested an explicit list of what to refuse to cover, said out loud as a refusal. Here is the script for the beginning of the session (after the introductory remarks):

  > "To ensure we finish in seventy-five minutes, I am making three explicit exclusions.
  >
  > **First, I will not be teaching the formal apparatus of framework-relative quantification.**
  > *Reason:* The logical notation is a tool for modeling the view, not the view itself. We can grasp the philosophical content of quantifier variance without the symbolic logic, and introducing it now would privilege the philosophers in the room over the cognitive scientists and linguists.
  >
  > **Second, I will not cover the verificationist history behind the internal/external contrast.**
  > *Reason:* While Carnap's verificationism motivated the original distinction, contemporary metaontology does not depend on the viability of verificationism. Conflating the two would invite objections about empirical verifiability that are irrelevant to the semantic argument we are making today.
  >
  > **Third, I will not reconstruct the Analytic/Synthetic distinction.**
  > *Reason:* This is the most critical refusal. While the *idea* that some truths depend on meaning and others on the world is load-bearing for this topic, the historical Kantian or Quinean debate is not. We will operate with a working distinction between 'semantic competence' and 'empirical discovery' without grounding it in that specific historiography. If you require that foundation to accept the distinction, this session will not provide it."

  **Note on the Analytic/Synthetic Refusal:**
  I have advised you to keep the *concept* (meaning vs. world) but cut the *history* (Kant/Quine/Carnap). If you cut the concept entirely, the definition of "verbal dispute" collapses, because a verbal dispute *just is* one where the disagreement stems from meaning-constitutive rules rather than empirical facts. The script above preserves the utility of the distinction while refusing the baggage.

  ### VI. Summary of Pedagogical Logic

  1.  **Neutralize Terminology:** Stop the Linguist immediately so "verbal" doesn't become a debate about speech.
  2.  **Neutralize Triviality:** Stop the Philosopher immediately so "verbal" doesn't mean "ignore this."
  3.  **Hard Case Only:** Use Chair/Particles, not Tomato. The goal is to show that verbal disputes can be deep, not that they are easily solved.
  4.  **Cost-Benefit Closing:** End on the *consequences* of the diagnosis, not the mechanics. This tests understanding of the metaontological stakes.
