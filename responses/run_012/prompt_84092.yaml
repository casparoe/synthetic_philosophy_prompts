      *   **Topic:** Whether metaphysical disputes can be merely verbal (Metaontology, Composite Objects case study).
      *   **Constraint 1 (Content):** User knows the literature; needs a *teaching plan* (order, dependencies, premature claims).
      *   **Constraint 2 (Example):** Needs a *single carrying example*. User suggests Tomato/Pluto vs. Chair/Particles. Needs advice on which to use and why.
      *   **Constraint 3 (Misconceptions):** Identify specific misconceptions (including the Linguist's "verbal = spoken" and the Philosopher's "verbal = unimportant") and when to head them off.
      *   **Constraint 4 (Closing):** One closing question to test understanding vs. memorization. Evaluate the user's draft check.
      *   **Constraint 5 (Omissions):** Explicit list of what to refuse to cover (Formal quantification, Verificationism, Analytic/Synthetic), stated as refusals with reasons. Evaluate if any are load-bearing.
      *   **Tone:** Professional, precise, pedagogical, respecting the user's expertise level (no hand-holding on concepts, focus on structure).

  2.  **Deconstruct the Components & Sequence:**

      *   *User's List:*
          1.  Ordinary word/world distinction (Bank).
          2.  Disagreement on facts vs. usage (Agree on facts, disagree on words).
          3.  Metaontological case (Particles vs. Chairs).
          4.  Quantifier Variance (Different "there is").
          5.  Counter-thought (Dodging reality).
          6.  Reflexive worry (Diagnosis as move).
      *   *Complications:* Linguist ("verbal" misnomer), Philosopher (Verbal = Unimportant).
      *   *Goal:* Show that "merely verbal" is a substantive metaphysical claim, not just lexicography.

      *   *Sequencing Logic:*
          *   Start simple to build intuition (Component 1).
          *   Immediately address the Linguist's objection (Complication 1) so it doesn't derail later technical points.
          *   Move to the core definition of "merely verbal" in this context (Component 2).
          *   Address the Philosopher's objection (Complication 2) early enough to prevent dismissal of the project, but late enough that they understand what "verbal" means here.
          *   Introduce the Case Study (Component 3). *Crucial Decision:* Tomato/Pluto vs. Chair.
          *   Introduce the Mechanism (Component 4 - QV).
          *   Introduce the Objections (Components 5 & 6).
          *   Closing.

  3.  **Evaluate the Carrying Example:**

      *   *Tomato (Fruit/Veg) & Pluto (Planet/Dwarf):* These are classic "easy" cases. They suggest that once we check the definition (botany/astronomy), the dispute vanishes. This reinforces the misconception that verbal disputes are *just* ambiguities solvable by stipulation.
      *   *Chair/Particles:* This is the hard case. There is no dictionary definition of "chair" that settles the metaphysical existence of composite objects. The disagreement persists even if we agree on the arrangement of particles.
      *   *Decision:* The Chair/Particles case *must* be the carrying example. Tomato/Pluto can be a warm-up (Component 1), but relying on them for the core argument (Component 3/4) will fail the pedagogical goal. The user suspects this; I need to confirm and explain *why* (the "no fact of the matter" vs. "semantic indecision" distinction).

  4.  **Address the Complications (Misconceptions):**

      *   *Linguist ("Verbal = Spoken"):* Head this off *immediately* in the intro. It's a terminological stipulation. Don't let it become a metaphysical debate.
      *   *Philosopher ("Verbal = Unimportant"):* This needs to be addressed when introducing the *consequences* of a dispute being verbal. It shouldn't be allowed to define what "verbal" *means*. Address this after Component 2 but before Component 5.

  5.  **Evaluate the Closing Question:**

      *   *User's Draft:* "Take a dispute... would it survive stipulated term?... what would they have learned?"
      *   *Critique:* It's a bit abstract. "Stipulated term" might trigger the "Tomato" solution (just define it!). The goal is to see if they grasp that *substantive* disagreements can look verbal.
      *   *Better Approach:* Focus on the *cost* of resolution. If we resolve it verbally, what metaphysical commitment do we lose? Or, focus on the *charity* principle.
      *   *Refinement:* The user's draft is okay, but needs sharpening to avoid the "just define it" trap. I will suggest a modification that forces them to confront the *quantifier* issue without using the technical term.

  6.  **Evaluate the Omissions:**

      *   *Formal Quantification (QV logic):* Safe to cut. Intuition pump is enough for 75 mins.
      *   *Verificationism:* Safe to cut. Often a distraction in contemporary metaontology.
      *   *Analytic/Synthetic:* **Dangerous.** The distinction between "verbal" and "factual" often rests on a version of this. If you cut it, you need to replace it with "conceptual competence" or "semantic values." I need to advise caution here. It might be load-bearing for the *definition* of verbal dispute.
      *   *Decision:* Cut Formal and Verificationism. Keep Analytic/Synthetic but *deflate* it. Don't teach Kant/Carnap, but acknowledge that "meaning truths" are distinct from "world truths."

  7.  **Drafting the Plan (Iterative Process):**

      *   *Time Management:* 75 mins is tight.
      *   *Intro (10 mins):* Terminology (Linguist objection), Basic Distinction (Bank).
      *   *Core Concept (15 mins):* Deep Verbal Dispute (Component 2). Address Philosopher objection here (Verbal $\neq$ Trivial).
      *   *Case Study (20 mins):* Chair vs. Particles. Why Tomato fails here.
