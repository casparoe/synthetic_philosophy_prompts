answer: |-
  Colleagues, as we approach Thursday's vote, I want to offer a few thoughts on the two proposals before us, not to preempt our discussion but to clarify how I intend to cast my own ballot and why. We are in the fortunate but difficult position of having two excellent projects that exhaust our endowment for this cycle, meaning our choice is not between quality and mediocrity but between two different visions of what history is for. Both proposals are methodologically sound, both are deeply researched, and both promise to enrich our understanding of the city. However, they ask different things of us and of our public, and because we can fund only one, we must decide which question is more urgent for a bicentennial commission.

  I begin with the tension in our mission statement, which calls for both scholarly significance and broad public resonance without telling us how to weigh them when they pull in opposite directions. In ordinary cycles, I might argue that scholarly significance must be the bedrock, assuming that resonance will follow from quality. But a bicentennial is not an ordinary cycle. It is a moment of civic reflection, a deliberate pause to ask who we are and how we got here. For this specific occasion, I believe we must resolve the tension by prioritizing public resonance, provided it is achieved through rigorous scholarship rather than popularization. A project that is scholarly but speaks only to those already trained in our city's institutional history fails the bicentennial test, just as a project that resonates but sacrifices evidence fails the historian's test. The question, then, is which proposal better uses scholarly rigor to achieve a resonance that matches the scope of our current community.

  This brings me to the debate regarding voice, which has been rightly identified as the crux of the matter. The memo circulated earlier this week makes a compelling case that the biography of the mayor offers a clearer claim to authenticity because the subject left us his own words. There is a profound integrity in letting a historical actor speak for himself, rather than speaking for him through the intermediation of police ledgers or tax rolls. The counter-argument, offered by the microhistory team, is equally strong: that the mayor's letters are performances designed to secure his legacy, while the tenants' lives, though recorded by hostile institutions, can be recovered by reading those records against the grain. I find myself persuaded by the microhistorians, not because the mayor's voice is unimportant, but because the silence of the tenants is a more defining feature of our city's past than the mayor's self-assurance. To choose the biography is to amplify a voice that already dominates the archive; to choose the microhistory is to treat silence itself as evidence. For a bicentennial, I believe we have a responsibility to address the gaps in our collective memory, not just polish the reflections that are already clear.

  Therefore, I intend to vote for the microhistory of the tenement block. This project better fulfills the promise of a bicentennial by speaking to the parts of the city that have never seen themselves in our commissions. The methodological challenge of reconstructing lives from institutional records is not a weakness but a feature; it honestly represents the difficulty of recovering ordinary life and invites the public to understand history as an act of reconstruction rather than simple retrieval. It acknowledges that most of our ancestors did not leave diaries, yet they still lived, strategized, and conflicted. By committing to this project, we signal that the society values the complexity of lived experience over the clarity of elite narrative. We are not pretending the tenants left letters; we are demonstrating how much can be known even when they did not. This approach offers a form of resonance that is deeply contemporary, connecting the historical erasure of the 1960s demolition with the ongoing concerns of a city that is still negotiating who belongs and who is remembered.

  I want to be equally clear, however, about the strength of the case for the biography, which I believe deserves our full respect even if it does not receive our funding. The argument for the mayor's life is not merely a defense of elite history; it is a defense of agency and causality. The mayor did not just live in the city; he built its hospitals, laid its rails, and structured the very laws that governed the tenements. To understand why the tenants lived as they did, one must understand the man who designed the constraints around them. The biography offers a coherent narrative agent, a single life through which the mechanics of power are made legible. There is also a significant evidentiary virtue in relying on sources that were created to be read. The mayor's papers offer a direct line of communication that does not require the same degree of interpretive speculation as the microhistory. By choosing the biography, we would be honoring the integrity of the archive itself, avoiding the risk of projecting modern desires onto fragmented records. It is a safer, clearer, and perhaps more traditionally scholarly path, and it would undoubtedly produce a definitive account of how our city's institutions were forged. Those of you who support this proposal are arguing for a history that explains the structure of the city from the top down, and that is a valid and necessary perspective.

  However, we have many histories of the top down. We have fewer histories that attempt to recover the texture of life from the bottom up without resorting to sentimentality. The microhistory proposal accepts the risk of speculation because the greater risk is silence. It aligns with the bicentennial's unique opportunity to broaden our civic story. I know this choice will not satisfy everyone, and I share the concern that we are turning away from a rich cache of personal papers that deserve attention. But those papers will remain, and another scholar may yet write that biography. The block of tenements is gone, and the chance to mark its place in our history is now. I hope we can proceed with the understanding that both proposals honor our mission, but only one meets the specific moment we are in. I look forward to voting with you on Thursday.
