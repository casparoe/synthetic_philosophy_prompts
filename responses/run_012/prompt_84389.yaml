answer: |-
  **MEMORANDUM**

  **TO:** Earned-Release Panel Members
  **FROM:** Chair
  **DATE:** [Date]
  **RE:** Adoption of Standard for "Addressed the Conduct"

  **Recommendation**
  I recommend we reject the staff's "Own-Reasons Test" and adopt a modified version of General Counsel's objection. We will implement a **Demonstrated Conduct Standard**.

  **Operative Rule**
  "The Panel finds a prisoner has 'addressed the conduct that produced his offense' when the institutional record and validated risk instruments demonstrate a sustained reduction in the behaviors associated with his offense, provided the prisoner does not actively deny the adjudicated facts of the conviction."

  **Reasoning**
  We are not theologians; we are risk managers. The statute requires us to determine if the conduct has been *addressed*, not if the soul has been *converted*. The staff's "Own-Reasons Test" fails two critical tests. First, as our consultant noted, it creates a "sincerity tribunal." Hearing officers cannot distinguish between genuine internalization and rehearsed script-recitation in a twenty-minute hearing. Second, as General Counsel noted, it privileges the articulate and well-socialized over those the system has failed to educate.

  Under the **Demonstrated Conduct Standard**, the rule is administrable by a hearing officer without philosophical training:
  1.  **Check the Risk Score:** Is it reduced?
  2.  **Check the Record:** Were programs completed? Were infractions avoided?
  3.  **Check the Facts:** Does the prisoner deny the crime itself? (Minimization is permitted; denial of adjudicated facts is not).

  This rule handles the edge cases clearly:
  *   **Articulate/ Bad Record:** A prisoner who speaks well of change but has a disciplinary record or high risk score is **kept**. Words do not override behavior.
  *   **Silent/ Good Record:** A prisoner who says nothing but has a clean record and low risk score is **released**. Compliance is a sufficient proxy for address.

  **Application to Pending Cases**
  *   **Prisoner A:** Released. He has the lowest risk score and completed every program. His statement that the victim "provoked him" is minimization, not a denial of the adjudicated facts. He has addressed the *conduct* by controlling his behavior, even if he hasn't accepted the *moral* narrative.
  *   **Prisoner B:** Kept. He has the highest risk score and completed nothing. His credible statement of understanding is insufficient without behavioral proof.

  **The Cost**
  I will not pretend this rule is error-proof. It exacts a specific cost:
  *   **We release Prisoner A,** whom we might rather keep. He blames the victim. His attitude suggests a risk that the risk instrument may not capture. We accept the moral hazard of releasing an unrepentant man because his behavior is safe.
  *   **We keep Prisoner B,** whom we might rather release. He appears sincere and may have genuinely changed without the resources to complete programs. We accept the injustice of punishing a potentially reformed man because his record is dangerous.

  **Rejection of the "Own-Reasons Test"**
  The staff proposal is seductive because it promises genuine rehabilitation. We reject it because it inverts public safety. It would require us to keep Prisoner A (safe but unrepentant) and release Prisoner B (dangerous but repentant). We cannot trade public safety for philosophical purity. A reason a man does not accept may still bind him legally, but a risk he does not manage will bind us all socially.

  **Where the Argument Runs Out**
  We cannot know another person's mind. We cannot know if Prisoner A's silence on moral guilt is a ticking bomb, or if Prisoner B's sincerity is a mirage. The argument for any rule runs out at the limit of human prediction. We must act anyway. We choose the proxy that best protects the public while honoring the statute: conduct over confession.

  **Vote**
  I call for a vote on the Demonstrated Conduct Standard.
