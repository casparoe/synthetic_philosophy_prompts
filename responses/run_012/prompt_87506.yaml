      *   *Convergence Requirement:* If A thinks B is worse, but B thinks A is worse (or they can't rank), the comparison is *indeterminate*.
      *   *Ontology:* Not measuring a mental substance (hedons), but constructing a ranking based on empathetic identification.

  3.  **Drafting Questions - Section by Section:**

