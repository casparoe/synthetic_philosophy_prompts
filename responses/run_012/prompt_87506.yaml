          *   *Follow-up:* She might say "indeterminacy means no obligation." Push on the risk of paralysis in policy.

      *   **Topic (d): Ideal Observer/Relocation.**
          *   *Context:* Is this just hiding the value judgment?
          *   *Draft Q:* Isn't this just ideal observer theory? Or just moving the bias to the convergence rule?
          *   *Refinement:* Ask about the normative weight of the convergence mechanism itself.
          *   *Follow-up:* She will deny it's ideal observer. Ask about the justification for the convergence rule itself.

      *   **Falsification Question:**
