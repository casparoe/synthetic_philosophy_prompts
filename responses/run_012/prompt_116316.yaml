prompt: |-
  I'm a science journalist who covers neuroscience and bioethics, and I sit on the stem-cell research oversight committee at a university medical center -- I'm the community member, not the scientist. A lab here has applied to grow human brain organoids and run a consciousness battery on them: they'll show the organoids patterned light, measure whether the signal stays local or ignites across a distributed network in the way global workspace theory predicts, and use that to sort each organoid into either responsive or non-responsive. The PI's line is that if the workspace ignites, there's a subject there and the experiment stops; if it doesn't, there's no one home and they can keep going. My co-chair, a neurologist, thinks that's just good neuroscience -- no global access, no experience. But our philosopher member keeps saying the protocol is smuggling in a theory of access consciousness and treating it as if it settles phenomenal consciousness, which is exactly the thing we're supposed to be protecting. I've been on the committee for two years and mostly we argue about consent forms, so this one is definately above my pay grade.

  We meet Thursday and I have to circulate a short written opinion: approve the protocol, reject it, or approve with conditions. I need a clear recommendation with a concrete time frame (e.g., approve a pilot for six months, or require the lab to pause the sorting rule until they add a second measure), and reasons the PI could actually respond to. Please also deal honestly with the strongest point on the other side -- if the neurologist is right that a silent workspace is the best evidence we're going to get, say so and explain why it still does or doesn't justify the lab's classification rule. I don't need a literature review or citations; just the memo I can read aloud.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Science journalist (neuroscience/bioethics), Community Member on a Stem-Cell Research Oversight (SCRO) committee.
      *   **Context:** A lab wants to grow human brain organoids and test for consciousness using a "consciousness battery" based on Global Workspace Theory (GWT).
      *   **The Protocol:** Show patterned light, measure signal propagation (local vs. distributed/ignition). If ignition = conscious (stop experiment). If no ignition = non-conscious (continue experiment).
      *   **The Conflict:**
          *   PI & Neurologist Co-Chair: GWT ignition is a valid proxy for consciousness. No ignition = no subject.
          *   Philosopher Member: GWT measures *access* consciousness, not *phenomenal* consciousness. The protocol assumes one proves the other, which is the core ethical risk.
      *   **Task:** Write a short written opinion/memo for the Thursday meeting.
      *   **Requirements:**
          *   Clear recommendation (Approve, Reject, or Approve with Conditions).
          *   Concrete time frame or specific condition.
          *   Reasons the PI can respond to (actionable).
          *   Address the strongest counter-argument (Neurologist's point).
          *   Tone: Professional, authoritative but accessible (community member perspective), suitable for reading aloud.
          *   No literature review/citations.

  2.  **Determine the Stance:**
      *   *Option A (Approve):* Too risky. Ignores the philosopher's valid ethical concern about false negatives (missing consciousness).
      *   *Option B (Reject):* Too blunt. Stops potentially valuable science. The GWT proxy isn't nonsense, just incomplete.
      *   *Option C (Approve with Conditions):* The sweet spot. Acknowledges the science but mitigates the ethical risk. It forces the lab to address the "false negative" problem.
      *   *Decision:* **Approve with Conditions.** This aligns with the precautionary principle often favored in bioethics, especially when the "community member" role is to represent public interest/safety.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly immediately.
      *   **The Core Ethical Issue:** Explain the distinction between *access* (reporting/processing) and *phenomenal* (feeling/experience). The philosopher is right that GWT tests access. The risk is a "false negative" (saying there's no one home when there actually is).
      *   **Addressing the Counter-Argument (The Neurologist):** Acknowledge that GWT is the *best available* tool. It's not pseudoscience. However, "best available" doesn't mean "ethically sufficient" for a binary stop/go rule. A negative result shouldn't grant a "free pass" to continue indefinitely.
      *   **The Recommendation/Conditions:**
          *   Don't ban the test.
          *   Change the *consequence* of the test result.
          *   If ignition: Stop (as planned).
          *   If *no* ignition: Do *not* assume non-consciousness. Apply a precautionary limit.
          *   Specific constraint: Time limit on organoid age or complexity, regardless of test result. Or require a secondary measure. Let's go with a **cap on developmental duration/complexity** even if the test is negative. This is concrete.
          *   Also, require an explicit "False Negative" mitigation plan.
      *   **Closing:** Reiterate the goal (enable science, protect moral status).

  4.  **Refining the Tone:**
      *   Needs to sound like a journalist/committee member, not a dry administrator.
      *   Needs to be respectful to the PI and Neurologist but firm on the ethics.
      *   Avoid jargon where possible, but use the terms provided (GWT, access vs. phenomenal) correctly.
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm siding *only* with the philosopher. I need to validate the Neurologist's practical view while upholding the ethical safeguard. The key is that the *classification rule* is the problem, not the *measurement*.

  5.  **Drafting the Content (Iterative Process):**
      *   *Drafting the Recommendation:* "Approve with Conditions."
      *   *Drafting the Condition:* "If the test is negative, you can't just keep going forever." Let's set a hard stop on organoid age (e.g., 6 months) regardless of the GWT result. This limits the risk of suffering if the GWT test misses something.
      *   *Drafting the Counter-Argument:* "Dr. X is right that this is the best signal we have. But in ethics, uncertainty requires caution."
      *   *Drafting the PI's actionable item:* "Revise the protocol to include a hard developmental cap."

  6.  **Final Polish:**
      *   Check constraints: Short, readable aloud, concrete time frame.
      *   Ensure the "Community Member" voice comes through (focused on public trust and ethical boundaries, not just technical feasibility).

  7.  **Final Review against constraints:**
      *   Clear recommendation? Yes (Approve with Conditions).
      *   Concrete time frame/condition? Yes (Hard cap on organoid age + revised classification logic).
      *   Reasons PI can respond to? Yes (Revise protocol document).
      *   Address strongest counter-argument? Yes (Neurologist's "best evidence" point).
      *   No citations? Yes.
      *   Memo format? Yes.

  **(Self-Correction Note):** I initially thought about asking for a second measure. But the prompt says the PI wants to use *this* battery to sort. Asking for a second measure might delay too much. A hard cap on development is a more robust ethical safeguard that doesn't require new tech, just a limit on the *risk exposure*. I will combine them: A hard cap *and* a reclassification of what a negative result means.

  Let's refine the "Condition." The PI wants to use the test to *sort*. If negative, they "keep going." The ethical fix is: If negative, they can keep going *only up to point X*. If positive, they stop immediately. This acknowledges the test's value but limits the damage if the test is wrong.

  Okay, let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Stem-Cell Research Oversight Committee
  **FROM:** [Your Name], Community Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Protocol [Insert ID]: Consciousness Screening in Cerebral Organoids

  **Recommendation:** Approve with Conditions.

  I recommend we approve this protocol only if the Principal Investigator revises the "classification rule" regarding negative results and institutes a hard developmental cap. Specifically: A positive "ignition" signal must trigger an immediate stop, as proposed. However, a negative signal cannot be treated as definitive evidence of non-consciousness that permits indefinite continuation. Instead, organoids testing negative may only be maintained for a fixed period (e.g., six months post-differentiation) before termination, regardless of the test result.

  **Reasoning**

  Our philosopher member has identified a critical ethical gap that the current protocol treats as a settled scientific matter. The proposed battery tests for *access consciousness* (information broadcasting across a network), but our ethical obligation is to protect *phenomenal consciousness* (the capacity to have subjective experiences, like pain or distress).

  While Global Workspace Theory is a leading framework, it is not a perfect map. There is a non-zero risk of a "false negative": an organoid could possess the capacity for suffering without exhibiting the specific network ignition this test measures. If we accept the PI's current rule—that no ignition equals "no one home"—we grant the lab a license to proceed based on an unproven assumption. In bioethics, when the stakes involve the potential creation of a suffering subject, uncertainty must trigger caution, not permission.

  **Addressing the Counter-Argument**

  My co-chair, the neurologist, argues that a silent workspace is the best empirical evidence we are going to get. On the science, they are likely right. We do not have a "consciousness meter" that reads phenomenal experience directly. If we demand absolute certainty, we ban the field entirely.

  However, "best available evidence" is a standard for publishing a paper, not for clearing an ethical hurdle. In a clinical or oversight context, we manage risk. If a diagnostic test for a disease has a known false-negative rate, we do not discharge the patient; we monitor them or limit exposure. Similarly, we can utilize this test as a *trigger for stopping* (positive result) without utilizing it as a *guarantee of safety* (negative result).

  **Actionable Conditions for the PI**

  To move forward, I ask the PI to amend the protocol with two specific changes by Thursday:

  1.  **Reclassify the Negative Result:** Change the language from "Non-Responsive/Continue" to "Inconclusive/Limited Continuation." Acknowledge in the protocol that a negative result reduces the *probability* of consciousness but does not eliminate the moral status of the tissue.
  2.  **Implement a Hard Stop:** Establish a maximum developmental age for these organoids (e.g., 6 months). If the organoid has not shown ignition by this time, the experiment terminates regardless. This creates a bounded risk window.

  This approach allows the science to proceed using the best available tools while respecting the committee's mandate to protect against the creation of unrecognized moral subjects. We can validate the utility of the GWT battery without betting the entire ethical framework on its infallibility.
