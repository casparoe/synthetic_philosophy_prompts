answer: |-
  Step 7 is the lie.

  Here is why it looks true, why it is actually false, and what handing that weapon to your character does for her.

  **Why Step 7 looks true**
  It relies on a trick called "explaining away." The argument says: If you stop looking after ten apartments, you must have decided that the *cost* of looking at an eleventh apartment was higher than the *benefit* of finding a better one. Therefore, you were still maximizing—you just added "effort" to the price tag.

  It sounds airtight because you can apply it backward to anything. If a person jumps on a grenade, they maximized "honor." If they run away, they maximized "survival." If you let people redefine "payoff" to mean whatever the person ended up doing, then everyone is always maximizing by definition. It turns the theory into a tautology: a statement that is true only because it repeats itself.

  **Why Step 7 is actually false**
  You cannot maximize what you cannot measure.

  To maximize expected payoff (as Step 7 claims), you need to know two numbers: the value of the next option and the cost of finding it. For an apartment hunter, this is hard but possible. You can estimate rent prices and gas money.

  For your painter, those numbers do not exist. She cannot know the value of the painting she *hasn't* painted yet. It is literally unknowable. Is the next idea a masterpiece or a dud? She has no data. Because the value is unknown, she cannot do the math required to "maximize with extra bookkeeping."

  Satisficing isn't just maximizing with extra steps; it is a different operating system entirely. Maximizing asks, "Is this the best?" Satisficing asks, "Is this good enough to stop the pain of choosing?" Those are fundamentally different mental actions. One requires a crystal ball; the other requires a threshold.

  **What dropping Step 7 costs you**
  You lose the comfort of thinking human beings are logical machines. If Step 7 were true, your character's paralysis would be a calculation error she could fix with better math. By rejecting Step 7, you admit that rationality has a hard limit. You cannot optimize your way out of the human condition.

  **How this helps your character**
  If you give her this realization, it changes her conflict from "I am indecisive" to "I am facing an impossible task."

  She isn't failing to paint because she's weak; she's failing because the demand to "pick the best" requires knowledge she cannot have. The tragedy isn't that she won't settle for good enough; it's that she knows "good enough" is the only rational move, but her desire for "the best" feels like a moral obligation.

  She can argue that Step 7 is a fantasy used by people who want to pretend life is an equation. She can say: "You can describe my freezing up as a calculation all you want, but I didn't weigh the costs. I just hit a wall. And you can't maximize against a wall."

  **The Verdict**
  Keep steps 1 through 6. They set the trap beautifully. Smash Step 7. It frees her from the idea that she is broken, and instead makes her a person struggling against a philosophical impossibility. That is much better fiction.
