      *   The counter is Simon/Gigerenzer.
      *   The key distinction: *Procedural* vs. *Substantive* rationality. (Wait, avoid jargon). Let's call it "The Map vs. The Terrain."
      *   Better analogy: You can describe a rock falling as "choosing the path of least resistance to maximize gravity," but the rock isn't doing math. The BIL says the painter *is* doing math (implicitly). The counter is that she's using a heuristic (a rule of thumb) that doesn't reference the final score.
      *   *Crucial Point:* To maximize, you need to know the value of the options. If the value is unknowable (art), you can't maximize. You can only satisfice. Therefore, they are *not* the same.

  8.  **Final Review against constraints:**
