      *(Wait, one more check)*: Is Step 3 also vulnerable? "There's always another option." In a finite universe, maybe not. But for art, yes. Step 7 is definitely the stronger lever for the writer. Step 3 is a premise about the world; Step 7 is a premise about the mind. Step 7 is easier to attack for character depth.

      Let's go with Step 7. It allows the character to be *right* about her paralysis, rather than just *stuck*.

