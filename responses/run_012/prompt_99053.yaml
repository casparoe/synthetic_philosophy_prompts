answer: |-
  - **Summary**

  Keynes would have endorsed the prudence behind Kelly betting—specifically the prioritization of survival over arithmetic gain—but rejected its mathematical formalism as a general rule. He would argue that growth-optimality applies only to narrow cases of measurable risk, whereas most economic decisions occur under unquantifiable uncertainty. For Keynes, the logarithm is not a universal utility function, and the long-run justification fails because the future is not a statistical shadow of the past. He would view Kelly as a useful technical tool for gamblers, but a dangerous illusion for investors facing true uncertainty.

  - **What Keynes brought to the table**

  To reconstruct Keynes's view, you must separate his epistemology from his practice. In *A Treatise on Probability*, Keynes argues that probability is not always a number. It is a logical relation between evidence and hypothesis, often incomparable. He introduces the "weight of evidence," distinct from probability: you can have a high probability estimate based on flimsy data, or a moderate estimate based on solid data. He distinguishes "risk" (known odds) from "uncertainty" (unknown odds), arguing most real-world decisions are the latter.

  In *The General Theory*, he attacks the idea that economic systems are ergodic—that statistical properties remain stable over time. He famously noted that "in the long run we are all dead," rejecting long-run equilibrium as a guide for present action. His investing practice evolved from high-leverage macro speculation (which nearly ruined him) to concentrated, low-leverage equity holding focused on safety of principal. He valued psychological comfort and liquidity over mathematical optimization. Any reconstruction must honor his skepticism of quantification alongside his pragmatic demand for capital preservation.

  - **Verdicts, point by point**

  (1) On whether Keynes would accept the growth-optimal rule as a normative prescription: He would accept it only in the trivial case of a casino-like environment where probabilities are known and bets are infinitely repeatable. In real investment, he believed the odds are unknown and the game changes. He would argue that applying a strict formula to uncertain events creates a false sense of precision that invites disaster. He would treat it as a special-case heuristic, not a universal law.
  Verdict: Accepted only for measurable risk, rejected for uncertainty.

  (2) On whether he would regard the logarithm as arbitrary or privileged: Keynes did not believe utility was strictly measurable, let alone logarithmic. While he acknowledged diminishing marginal utility of money, he viewed utility as psychological and dependent on the "state of confidence." He would see the log function as a convenient mathematical artifact rather than a description of human valuation. To privilege it would violate his insistence that many values are incomparable.
  Verdict: Regarded as arbitrary and psychologically unrealistic.

  (3) On what he would make of the long-run justification: This is the strongest point of conflict. Keynes's entire career was a battle against the idea that short-term pain is justified by long-run statistical convergence. He argued that the "long run" is a misleading concept when the underlying process is non-stationary. A justification relying on asymptotic behavior would strike him as irrelevant to the actual decision-maker facing a unique, non-repeatable future.
  Verdict: Rejected as irrelevant to non-ergodic reality.

  (4) On whether his notion of the weight of evidence gives him a reason to reject the rule: Yes. Kelly betting requires a precise probability input. Keynes's "weight" suggests that two estimates with the same probability but different evidence bases should be treated differently. A Kelly formula cannot ingest "weight." Keynes would argue that ignoring the quality of evidence behind the probability estimate is a fundamental error that sizing rules cannot fix.
  Verdict: Reason to reject the rule as insufficiently nuanced.

  (5) On whether the ruin-avoidance motive is something he would endorse independently: Absolutely. After his early speculative failures, Keynes became obsessed with the safety of principal. He viewed survival as a prerequisite for any future action. This aligns with the Kelly intuition that ruin ends the game, but Keynes would ground this in prudence and liquidity preference rather than logarithmic mathematics. Survival is a constraint, not an optimization target.
  Verdict: Endorsed strongly as a practical constraint.

  (6) On whether his own investing practice is evidence for the growth-optimal picture: His later practice contradicts the mechanics of Kelly. Kelly often implies diversification across many edges; Keynes concentrated heavily on his few best ideas. Kelly implies sizing based on edge; Keynes sized based on psychological comfort and liquidity needs. However, his shift away from leverage aligns with the Kelly spirit of avoiding ruin. The practice supports the goal (survival) but not the method (log-maximization).
  Verdict: Evidence for the spirit of survival, against the mechanics.

  - **Where the two framings collide**

  The collision is ontological, not just mathematical. The Kelly framework assumes an ergodic world: the future is a sequence of draws from a known or knowable distribution. Keynes assumes a non-ergodic world: the future is created by decisions and structural breaks that invalidate past statistics. For Kelly, uncertainty is a parameter to be estimated; for Keynes, uncertainty is a fundamental feature of reality that resists estimation. Furthermore, Kelly treats the agent as a vessel for wealth accumulation over time, whereas Keynes treats the agent as a psychological entity subject to confidence shocks. You cannot reconcile a model that requires stable probabilities with a philosophy that denies their existence in crucial cases. The Kelly advocate sees a calculation error; Keynes sees a category error.

  - **Which of us was closer**

  Your friend is right about the practical instinct: Keynes definitely converged on the idea that survival and compounding matter more than arithmetic expectation, and he would agree that ruin is to be avoided at all costs. You are right about the epistemology: Keynes would have rejected the idea that we usually possess the known probabilities Kelly requires. You both missed the nuance of his investment evolution: he didn't just learn to size bets; he changed *what* he bet on, moving from macro timing to micro value. Your friend sees the survivor; you see the skeptic. Keynes was both, but the skeptic constrained the survivor.

  - **Confidence**

  A Keynes scholar might dispute how strictly Keynes held his epistemological views during his later investing years. Some correspondence suggests he became more pragmatic about using statistics than his early philosophical writings imply. They might argue he would have accepted Kelly as a "best available tool" even if imperfect. Additionally, scholars might debate whether his concentration strategy was truly anti-Kelly or simply a reflection of having few high-weight opportunities. My reconstruction leans heavily on his published philosophy, which may overstate his theoretical rigidity compared to his private pragmatism.
