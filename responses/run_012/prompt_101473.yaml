answer: |-
  This is a classic case of "slogan compression." In alignment and interpretability research, dense phrases often pack together a hope, a definition, and a methodology. Your intuition is correct: without specifying the *type* of intervention and the *level* of invariance, the sentence is empty.

  Here is a menu of five precise readings of the slogan **"A mechanism is just whatever stays invariant when you intervene,"** sorted from boringly trivial to radically ambitious.

  I have evaluated each against your specific examples (lookup tables, thermostats, attention heads) and your worry about circularity.

  ---

  ### 1. The Behavioral Reading (The "Black Box" View)
  *   **Intervention:** Perturb the input $x$ slightly (add noise, change distribution).
  *   **Invariant:** The input-output function $f(x)$.
  *   **Level of Description:** Purely external behavior.
  *   **The Claim:** If the model produces the same outputs on the same inputs after a tweak, the mechanism is the same.
  *   **Toy Example:** You have a neural net and a lookup table. Both output "20C" when the room is cold. You tweak the room temperature (input). Both still output "20C".
  *   **Verdict:** **Trivial / False for MAD.**
      *   **Why:** This defines "mechanism" as "function." But the whole point of Mechanistic Anomaly Detection (MAD) is to distinguish cases where the function is the *same* but the mechanism is *different* (e.g., the model is answering honestly vs. the model is lying convincingly).
      *   **Your Worry:** This reading makes MAD impossible. If mechanism = function, you can't detect anomalies where the function looks normal.

  ### 2. The Causal Structure Reading (The "Standard Science" View)
  *   **Intervention:** "Do-operations" on internal variables (e.g., ablate a neuron, clamp an activation to a specific value, edge masking).
  *   **Invariant:** The causal graph structure (which nodes influence which other nodes).
  *   **Level of Description:** Computational graph / Circuit level.
  *   **The Claim:** A mechanism is the specific web of causal dependencies. If I cut wire A and output B breaks, wire A is part of the mechanism. If I cut wire A and nothing happens, it wasn't part of the mechanism.
  *   **Toy Example:** **Thermostat vs. PID vs. Humans.**
      *   In the thermostat, cutting the bimetallic strip breaks the loop.
      *   In the human team, cutting communication between the "observer" and the "furnace operator" breaks the loop.
      *   **Verdict:** **Substantive and Defensible.**
      *   **Why:** This distinguishes the lookup table (no internal causal structure, just memory retrieval) from the algorithm (sequential dependencies). It distinguishes the thermostat from the humans based on *physical* causal links.
      *   **Your Worry:** This attempts to shut down your circularity worry by appealing to objective causal facts. However, in a neural net, "nodes" are arbitrary. Is a single neuron a node? Or a subspace? If you define the nodes based on your tool, you return to circularity.

  ### 3. The Robustness Reading (The "Mode Connectivity" View)
  *   **Intervention:** Small perturbations to weights or parameters (gradient steps, noise injection, pruning low-magnitude weights).
  *   **Invariant:** The "logic" or "trajectory" of the computation (often measured by activation angles or subspace overlap).
  *   **Level of Description:** Weight space / Activation geometry.
  *   **The Claim:** A mechanism is a basin of attraction in weight space. If I can wiggle the weights without changing *how* the model solves the task (even if accuracy dips slightly), the mechanism is invariant.
  *   **Toy Example:** **Swapping an Attention Head.**
      *   If you swap Head A with Head B and loss doesn't move, this reading asks: Did the *geometry* of the residual stream change? If Head A and Head B project into the same subspace, the mechanism is invariant (redundancy). If they project differently but cancel out errors, the mechanism changed (brittleness).
      *   **Verdict:** **Substantive and ML-Native.**
      *   **Why:** This aligns with how engineers actually test systems (stress testing). It handles redundancy well.
      *   **Your Worry:** This doesn't fully solve circularity. "Same subspace" depends on the basis you choose to measure it in. But it's less circular than saying "same tool output."

  ### 4. The Algorithmic Reading (The "Holy Grail" View)
  *   **Intervention:** Counterfactual surgery on high-level concepts (e.g., "Make the model believe X is true" without changing the input tokens).
  *   **Invariant:** The high-level algorithm or semantic role (e.g., "sorting," "searching," "verifying").
  *   **Level of Description:** Semantic / Computational Role.
  *   **The Claim:** A mechanism is the abstract algorithm being implemented. Two physically different systems (humans vs. PID) have the same mechanism if they implement the same control-theory algorithm (negative feedback).
  *   **Toy Example:** **Lookup Table vs. Modular Algorithm.**
      *   This reading says they are **different mechanisms** because one is $O(1)$ retrieval and the other is $O(n)$ computation, even if outputs match.
      *   **Verdict:** **Radical and Currently Unproven.**
      *   **Why:** This is what alignment people *want* to be true. It allows you to say "The model is lying" (mechanism: deception) vs "The model is mistaken" (mechanism: error) even if the output text is identical.
      *   **Your Worry:** This is where the circularity is worst. We do not yet have a tool-independent way to define "algorithm" inside a neural net. If you define the algorithm by what your interpretability tool finds, you are back to square one.

  ### 5. The Pragmatic Reading (The "Engineer's Scale" View)
  *   **Intervention:** Whatever interventions are possible/natural at a chosen level of abstraction (defined by the researcher).
  *   **Invariant:** Consistency of explanation relative to that abstraction.
  *   **Level of Description:** Relative / Tool-Dependent.
  *   **The Claim:** "Mechanism" is not a property of the model alone, but of the *model-plus-lens*. A mechanism is whatever story remains stable when you poke the model *using this specific vocabulary*.
  *   **Toy Example:** **Attention Head Swap.**
      *   If your "lens" is individual heads, the mechanism changed. If your "lens" is attention layers, the mechanism is invariant. Both statements are true relative to their scale.
      *   **Verdict:** **Honest and Defensible.**
      *   **Why:** It admits that "mechanism" is relative to the resolution of your microscope.
      *   **Your Worry:** This **does not shut down your worry**; it validates it. It admits the slogan is a restatement of the problem ("Find a level of description where invariance implies safety"). However, it makes the problem tractable rather than metaphysical.

  ---

  ### Summary Verdicts on Your Specific Questions

  | Your Question | Reading that Answers "Same" | Reading that Answers "Different" | Most Likely Intended Reading |
  | :--- | :--- | :--- | :--- |
  | **Lookup Table vs. Algorithm** (Same I/O) | 1 (Behavioral) | 2 (Causal), 4 (Algorithmic) | **4 (Algorithmic)**. MAD relies on these being different. |
  | **Thermostat vs. PID vs. Humans** | 1 (Behavioral), 4 (Algorithmic*) | 2 (Causal/Physical) | **4 (Algorithmic)**. *If described as "feedback loop". |
  | **Swap Attention Head (No Loss Change)** | 3 (Robustness), 5 (Pragmatic/Layer) | 2 (Causal/Node), 5 (Pragmatic/Head) | **3 (Robustness)**. Usually implies redundancy, so mechanism is "stable." |
  | **Is "Mechanism" defined by the Tool?** | 5 (Pragmatic) | 2 (Causal), 4 (Algorithmic) | **Tension between 2 and 5.** |

  ### Which Reading Solves Your Worry?

  **None of them fully shut down the circularity worry without cost.**

  *   **Readings 2 and 4** try to shut it down by claiming there is an objective "true" mechanism (causal or algorithmic) waiting to be discovered. If you believe this, the slogan is a **substantive claim about reality**. The risk is that you might be chasing a ghost if neural nets don't have clean causal boundaries.
  *   **Reading 5** dissolves the worry by admitting the circularity is a feature, not a bug. The slogan becomes a **methodological instruction**: "Keep refining your interpretability tools until you find a level of abstraction where invariance under intervention correlates with safety."

  **What people in this area most likely mean:**
  They are oscillating between **Reading 2 (Causal)** and **Reading 4 (Algorithmic)**.
  They *hope* that causal structures (Reading 2) map cleanly onto human-understandable algorithms (Reading 4). When they say "A mechanism is whatever stays invariant," they are usually expressing a **bet**: that if they find a causal subgraph that is robust to weight perturbations (Reading 3), it will correspond to a semantic algorithm (Reading 4) that they can verify for safety.

  **The "Restatement of the Problem" Verdict:**
  If they mean **Reading 4** (Algorithmic) but cannot define the algorithm without using their interpretability tools, then the slogan **is a restatement of the problem**. It says: "We will know we have found the mechanism when we find the thing that acts like a mechanism."

  **Recommendation for your Reading Group:**
  Ask them this: *"Is the invariance property objective (does it exist without our tools), or is it relative to the abstraction layer we choose?"*
  *   If they say **Objective**: Ask them how they define "nodes" in a transformer without circularity.
  *   If they say **Relative**: Ask them how we verify safety if the "mechanism" changes when we switch tools.

  This forces them to pick between the "Radical/Unproven" (4) and the "Honest/Tractable" (5).
