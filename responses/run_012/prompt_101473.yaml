prompt: |-
  I'm a backend engineer with no real philosophy background, and I've ended up in a reading group with some alignment people where "mechanistic anomaly detection" keeps coming up. The rough idea I've got is: you flag an input as anomalous when the model seems to be using a different mechanism than the one it uses on normal inputs, even if the output looks fine. Last week someone said, "A mechanism is just whatever stays invariant when you intervene," and everyone nodded like that settled it. I didn't say anything, but I don't actually know what that sentence is claiming. Two networks can compute the same function on every input I ever test, one by a lookup table and one by a clean modular algorithm -- same mechanism or not? A thermostat, a PID controller, and a team of people manually adjusting a furnace can all keep a room at 20C -- same mechanism or not? If I swap out one attention head and the loss barely moves, did the mechanism change? And if I only ever describe the mechanism at the level of my favorite interpretability tool, aren't I just defining "same mechanism" as "same according to the tool," which is the thing I was worried about?

  Can you lay out the different precise things that slogan could be saying, as a menu rather than picking one and explaining it? I want the readings sorted from the boringly true to the radical, with a verdict on each: which are trivial or definitional, which are substantive and defensible, which are probably false, and which one people in this area most likely mean when they say it. It would help if you separate at least these axes: what counts as an intervention (a perfect do-operation, a small perturbation, retraining, ablation, a natural distribution shift?), what the invariant is supposed to be an invariant of (a causal graph, a function, an algorithm, a circuit, a physical substrate, a computational role?), and at what level of description the sameness is claimed. Also tell me which reading, if any, would actually support using the slogan to shut down my worry that "mechanistic anomaly detection" is circular or ill-defined, and which reading would make the slogan just a restatement of the problem. I don't need citations or a reading list, I just want the disambiguation with verdicts, maybe with a toy example or two so I can see where each reading bites. Sorry if this is a bit rambly, I'm definately not the target audience for the original paper.
