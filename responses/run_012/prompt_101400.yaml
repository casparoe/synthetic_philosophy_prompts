      *   *User's Objection:* Pictures lack internal logical structure (negation, conditionals). They rely on external conventions (grammar) to function as statements. Therefore, they aren't self-contained statements.
      *   *The Tension:* If the grammar is external, is the picture really a statement, or just a term within a sentence formed by the convention? If the encyclopedia is heterogeneous, how do pictures unify with text if they function differently?
      *   *Key Concept:* Physicalism. For Neurath, "physicalist language" isn't just physics; it's a spatio-temporal coordinate system for all meaningful claims.

  3.  **Evaluate Potential Lines of Inquiry:**
      *   *Option A: Historical Exegesis.* Digging into Vienna Circle archives. *Verdict:* Too specialized, requires German fluency and archival access. User is an amateur.
      *   *Option B: Formal Logic/Semantics.* Trying to formalize ISOTYPE. *Verdict:* Risky. Neurath was anti-formalist in the Carnap sense. Might lead to a "dead end" if the project was inherently informal.
      *   *Option C: The Nature of "Physicalism".* Understanding what Neurath meant by "physicalist language." *Verdict:* Crucial. If pictures are physicalist, they must be spatio-temporally locatable. This addresses the "statement" claim.
