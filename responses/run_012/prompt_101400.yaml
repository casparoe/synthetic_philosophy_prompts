answer: |-
  Your skepticism is well-founded. You have identified the precise fracture line in Neurath's later philosophy: the tension between the *claim* that ISOTYPE (International System of TYpographic Picture Education) constitutes a linguistic layer of the Unity of Science and the *reality* that its semantic rules rely on external conventions not depicted within the images themselves.

  Many readers treat ISOTYPE as merely pedagogical or political propaganda. You are correct to treat it as a philosophical claim about representation. However, your background in experimental physics gives you a specific advantage: you understand the difference between a *measurement record* and a *theoretical model*. Neurath's "pictures as statements" is best understood not as "pictures as propositions in a logic textbook" but as "pictures as standardized laboratory records."

  Here is a defended agenda for the next two to three years. It is ordered by dependency: you cannot resolve the logical status of the pictures (Item 3) until you understand what kind of truth they bear (Item 2), and you cannot understand that until you define what counts as a record in Neurath's system (Item 1).

  ### 1. The Status of the "Protocol Sentence" in Physicalist Language
  **The Question:** What exactly qualifies as a "statement" in Neurath's physicalist language, and does a chart meet the criteria of a protocol sentence?
  **Why it is Upstream:** You are currently judging ISOTYPE pictures against the standards of natural language sentences (subject-predicate, truth-conditional). This is likely a category error. Neurath's "statements" are *protocol sentences*: spatio-temporal coordinates of observation accepted by the scientific community. If an ISOTYPE chart is a statement, it is not because it has a logical syntax like "P & Q," but because it functions as a public, checkable record of a state of affairs, akin to a reading on a dial or a mark in a logbook.
  **Tractability:** High. This requires reading Neurath's essays on "Protocol Sentences" (collected in *Empiricism and Sociology* or *Otto Neurath: Philosophical Papers 1913–1946*). It does not require deep knowledge of interwar politics, but rather a focus on his epistemology. Your physics background will help you grasp the "operational" nature of his physicalism.
  **Criteria for Moving Up/Down:**
  *   **Move Up (Priority Confirmed):** If you find Neurath explicitly classifying ISOTYPE transformations as equivalent to the recording of protocol sentences.
  *   **Move Down (Abandon):** If you find that Neurath relegated pictures to a "popularization" tier distinct from the "scientific" encyclopedia. (Evidence suggests otherwise, but you must verify).
  *   **Settled?** This is partially settled in scholarship (e.g., by Nancy Cartwright or Jordi Cat), but often obscured by the focus on the Vienna Circle's logic. You need to read Neurath directly, not commentaries on Carnap.

  ### 2. The Encyclopedia as a Coherentist System, Not a Correspondence Map
  **The Question:** How does the "Unity of Science Encyclopedia" validate a picture, and does it require the picture to carry its own logical grammar?
  **Why it is Upstream:** You worry that a picture cannot assert truth because it lacks internal negation or modality. This worry assumes a *correspondence* theory of truth (the picture must mirror the logical structure of the fact). Neurath was a *coherentist*. A statement is "true" (or rather, "accepted") if it fits without contradiction into the existing encyclopedia. The "grammar" you find missing from the picture may reside in the *placement* of the picture within the encyclopedia, not in the ink on the page.
  **Tractability:** Medium. This requires engaging with Neurath's metaphor of the "encyclopedia" and his debates with Carnap. It is conceptual rather than technical.
  **Criteria for Moving Up/Down:**
  *   **Move Up:** If you find evidence that the "context" of the chart (title, legend, surrounding text) is considered part of the "statement," effectively outsourcing the logic to the layout.
  *   **Move Down:** If Neurath insists the picture must be self-contained. (This would support your suspicion that the project is incomplete).
  *   **Settled?** This is the core of Neurath's "anti-foundationalism." It is well-documented, but its application to ISOTYPE specifically is under-explored.

  ### 3. The "Transformer" and the Status of Conventions
  **The Question:** Is the "grammar" of ISOTYPE (e.g., 1 icon = 10,000 people) a linguistic rule or a technical convention, and does that distinction matter for the Unity of Science?
  **Why it is Upstream:** You noted that "a repeated figure standing for a fixed quantity is doing arithmetic under a convention that no picture can itself depict." This is the strongest point of your critique. You need to determine if Neurath viewed these conventions as *arbitrary stipulations* (like choosing meters over feet) or *logical necessities*. If they are merely technical stipulations, then the picture is a *display* of data processed by external logic, not a *sentence* itself.
  **Tractability:** High for a physicist. You deal with conventions (units, calibration) daily. Read the technical manuals of the ISOTYPE institute (available in archives or reprints like *Isotype: A Visual Language*). Treat the "Transformer" (the person who converts stats to pictures) as an instrument operator.
  **Criteria for Moving Up/Down:**
  *   **Move Up:** If Neurath argues that the convention itself is part of the physicalist language (i.e., the rule "1 icon = 10,000" is itself a protocol sentence).
  *   **Move Down:** If the convention is merely pragmatic. This would confirm your suspicion that the "picture as statement" claim is rhetorical rather than rigorous.
  *   **Settled?** This is largely open. Most art historians treat this as design; most philosophers treat it as logic. A physicist's view of "calibration" could be a novel contribution here.

  ### 4. The Limits of Depiction: Negation and Modality
  **The Question:** Did Neurath intend ISOTYPE to handle logical operators (not, if-then, possible), or was it restricted to existential claims about aggregates?
  **Why it is Last:** This is the "hard problem" you identified. However, investigating this *before* settling Items 1–3 is a dead end. If ISOTYPE is a record of aggregates (Item 1) validated by coherence (Item 2) via convention (Item 3), then the lack of internal negation might be a feature, not a bug. Social statistics (Neurath's focus) rarely require modal logic; they require clear comparison of magnitudes.
  **Tractability:** Low. Neurath did not solve this. Searching for a solution he hid is likely to fail.
  **Criteria for Moving Up/Down:**
  *   **Move Up:** Only if Items 1–3 confirm that pictures are full logical equivalents to text.
  *   **Move Down (Recommended):** If Items 1–3 suggest pictures are a *subset* of language (existential records only). In this case, the "failure" to depict negation is not a philosophical flaw but a domain restriction.
  *   **Settled?** It is effectively settled that ISOTYPE cannot easily depict negation. The philosophical question is whether Neurath *cared*. Evidence suggests he prioritized "life conditions" (housing, health) which are positive facts.

  ### Recommended Order of Operations

  1.  **Months 1–6:** Focus exclusively on **Item 1**. Read Neurath's *Protocol Sentences* and *Physicalism*. Do not read about ISOTYPE yet. Establish what "statement" means to him.
      *   *Test:* Can you write a one-page definition of a "Physicalist Statement" that a fellow physicist would accept as a description of a lab record?
  2.  **Months 7–18:** Focus on **Item 3** (Conventions) and **Item 2** (Encyclopedia). Read the ISOTYPE technical rules alongside his essays on the *Unity of Science Encyclopedia*.
      *   *Test:* Can you diagram where the "truth claim" lives? Is it in the icon, the legend, or the catalog number?
  3.  **Months 19–36:** Address **Item 4** (Logic). Attempt to construct a negation in ISOTYPE. If it fails, analyze whether that failure breaks the system or merely limits its scope.
      *   *Test:* Write a draft argument: "ISOTYPE is not a language of propositions, but a language of records."

  ### What to Drop
  **Drop the search for a formal logic of ISOTYPE.**
  Do not spend time trying to formalize ISOTYPE into predicate logic. Neurath was explicitly opposed to the formalism of the Carnap wing of the Vienna Circle. He wanted a *language of life*, not a *calculus*. If you try to force ISOTYPE into a logical syntax, you are fighting Neurath's own philosophy. Your intuition that the grammar lies "outside" is likely correct, but for Neurath, *all* grammar (even verbal) lies outside the world; it is part of the encyclopedia's scaffolding.

  ### Why this fits your background
  You are trained to look for the "instrument function." In your view, the chart is an instrument. The question is: Is the instrument a *sensor* (recording data) or a *processor* (computing logic)?
  *   If it is a sensor, your worry about negation is misplaced (a thermometer doesn't depict "not-hot," it depicts temperature; negation is a judgment applied to the reading).
  *   If it is a processor, your worry is fatal.

  My hypothesis, based on Neurath's texts, is that he viewed them as **sensors/records**. If you can confirm this in Phase 1, you will resolve the tension you feel without needing to solve the problem of pictorial negation. This saves you from a two-year dead end in semiotics and allows you to write a definitive analysis on the *epistemic status of visual data* in the Unity of Science.
