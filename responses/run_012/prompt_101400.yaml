      *   **Core Problem:** The user sees a tension in Neurath's program. Neurath claims pictures are statements (truth-apt) within the unified encyclopedia, yet the encyclopedia is heterogeneous (unity is a task), and the grammar/rules of the pictures (arithmetic, conventions) seem to lie *outside* the pictures. The user is skeptical about how pictures handle logic (negation, conditionals, modality) and the use/mention distinction.
      *   **Goal:** A defended agenda for the next 2-3 years of reading/writing. Not a survey, but a prioritized list of open questions/lines of inquiry.
