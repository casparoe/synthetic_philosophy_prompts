  8.  *(Final thought on the "Negation" point)*: The user is right to be puzzled. Neurath *didn't* solve negation in ISOTYPE. The agenda should reflect that investigating *why* he didn't (or if he thought it unnecessary for social science stats) is more fruitful than trying to solve it for him.

