answer: |-
  ### Phase 1: Brainstorming and Pruning

  **Candidate Requirements:**
  1.  Explain why we ask friends for recommendations.
  2.  Explain why we feel we must see the film ourselves.
  3.  Distinguish believing it's good from enjoying it.
  4.  Distinguish "It is good" from "You will like it."
  5.  Explain why we accept "It depicts a horse" but resist "It is beautiful."
  6.  Account for the blind person told about a sunset.
  7.  Account for the AI critic who hasn't seen the work.
  8.  Account for pleasure derived from reading a review alone.
  9.  Reconcile the existence of experts with the demand for autonomy.
  10. Explain similarities/differences with moral testimony.
  11. Remain stable across realist/expressivist metaphysics.

  **The Cut:**
  *   *Merge 1 & 9:* Both demand the theory respect the actual sociology of aesthetic discourse (reliance on critics/friends).
  *   *Merge 3, 4, & 8:* All concern the *nature of the uptake*. Is it cognitive (belief), predictive (response), or affective (pleasure)?
  *   *Merge 6 & 7:* Both test the necessity of *experience* in the testimonial chain (hearer's access vs. speaker's source).
  *   *Merge 10 & 11:* These are boundary conditions on the theory's scope and cost. I will separate them for sharpness, as metaphysics is foundational while moral analogy is comparative.
  *   *Discard:* None are pure prejudices, but "Explain why we feel we must see the film" (2) is the counterweight to (1). They must remain distinct to capture the tension.

  ***

  ### Phase 2: The Desiderata for a Theory of Aesthetic Testimony

  An adequate theory must satisfy the following five requirements.

  **1. The Practice Constraint**
  *   **Requirement:** The theory must render rational our ordinary reliance on aesthetic informants without rendering aesthetic expertise otiose.
  *   **Motivating Cases:** The wine merchant whose recommendation you buy; the trusted critic whose review guides your ticket purchase; the friend who insists you *must* see the film.
  *   **Why:** A theory that makes all aesthetic testimony irrational (radical pessimism) contradicts social reality; a theory that makes it identical to reading a bus timetable (radical optimism) ignores the special normativity of art.

  **2. The Phenomenological Constraint**
  *   **Requirement:** The theory must explain the persistent intuition that first-hand experience is superior to, or required for, full aesthetic engagement, without dismissing it as a mere illusion.
  *   **Motivating Cases:** The feeling that being told a sunset is beautiful is insufficient compared to seeing it; the sense of "talking past each other" when arguing art without shared reference.
  *   **Why:** If the demand for first-hand experience is epistemically idle, the theory fails to capture the distinctive value of aesthetic properties. If it is absolute, testimony becomes impossible.

  **3. The Attitude Specification**
  *   **Requirement:** The theory must precisely delineate which mental states are transmissible via testimony: belief, knowledge, appreciation, or pleasure. It must distinguish testimony about the *work's merit* from testimony about the *hearer's likely response*.
  *   **Motivating Cases:** Learning *that* a film is acclaimed vs. feeling delight from the review itself (secondhand pleasure); being told "You will cry" vs. "It is tragic."
  *   **Why:** Skeptics often deny *knowledge* but allow *belief*; others deny *appreciation* but allow *prediction*. A theory that conflates these cannot explain why testimony feels hollow even when believed.

  **4. The Experience Link**
  *   **Requirement:** The theory must specify the role of perceptual experience in the testimonial chain, accounting for cases where experience is absent on either the speaker's or hearer's end.
  *   **Motivating Cases:** The blind person told of a sunset (hearer lacks capacity); the AI system reviewing a film it has not processed (speaker lacks experience).
  *   **Why:** If testimony fails because experience cannot be shared, the AI case should succeed (information transfer) while the blind case fails (receptivity). If testimony fails because the hearer must judge autonomously, both should fail. The theory must predict which.

  **5. Theoretical Stability**
  *   **Requirement:** The account should either hold fixed across competing metaphysics (realism vs. response-dependence) or explicitly state its dependence, and it must clarify its relation to the parallel problem of moral testimony.
  *   **Motivating Cases:** Whether aesthetic properties are mind-independent; whether "you shouldn't trust moral testimony" implies "you shouldn't trust aesthetic testimony."
  *   **Why:** A theory that collapses if one shifts from realism to expressivism is too fragile; a theory that ignores the moral analogy misses a potential unifying epistemological principle.

  ***

  ### Phase 3: Analysis of Requirements

  **Non-Negotiables vs. Camp Preferences**
  *   **Non-Negotiable:** *The Practice Constraint* and *The Attitude Specification.* Any theory that denies we sometimes gain aesthetic beliefs from others, or cannot distinguish believing a work is good from enjoying it, fails to describe the phenomenon.
  *   **Camp Preferences:** *The Phenomenological Constraint.* Pessimists treat this intuition as veridical (testimony *cannot* yield knowledge); Optimists treat it as an error theory (testimony *can*, we just feel otherwise). *Theoretical Stability* is also contested; some argue aesthetic testimony *must* track metaphysics (e.g., if beauty is response-dependent, testimony is inherently limited).

  **Incompatible Pairs (The Tension)**
  *   **Practice Constraint vs. Phenomenological Constraint.** This is the core conflict. To satisfy Practice, we must admit testimony works (we rely on critics). To satisfy Phenomenology, we must admit testimony is deficient (you have to see it yourself).
      *   *Optimists* satisfy Practice by sacrificing Phenomenology (the intuition is a bias).
      *   *Pessimists* satisfy Phenomenology by sacrificing Practice (our reliance is pragmatic, not epistemic).
      *   *Intermediates* try to split the difference but often fracture the Attitude Specification.

  **The "Killer" Requirement**
  *   **The Attitude Specification.** This is the most exclusionary criterion.
      *   *Why:* It forces the theory to answer: **Is aesthetic knowledge distinct from aesthetic appreciation?**
      *   If a theory claims testimony transmits *knowledge* but admits it cannot transmit *appreciation* (the feeling of the beautiful), it must defend a disunified view of aesthetic understanding. If it claims testimony transmits *appreciation*, it faces the burden of explaining how a feeling is transferred by words alone (Secondhand Pleasure). Most theories break here: they can explain how I believe you, but not how I *feel* the merit you describe.

  ***

  ### Phase 4: Scorecard of Main Positions

  | Position | Practice Constraint | Phenomenological Constraint | Attitude Specification | Experience Link | Stability |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pessimism** (e.g., Hopkins) | **Fail.** (Renders reliance irrational/pragmatic only) | **Pass.** (Honors the "see for yourself" intuition) | **Pass.** (Denies knowledge/appreciation transmission) | **Pass.** (Experience is necessary) | **Varies.** (Often ties to autonomy norms) |
  | **Optimism** (e.g., Reductionists) | **Pass.** (Treats aesthetic testimony like ordinary testimony) | **Fail.** (Must treat intuition as error/bias) | **Mixed.** (Claims knowledge, struggles to explain lack of appreciation) | **Fail.** (Experience not strictly necessary) | **High.** (Applies general epistemology) |
  | **Intermediate** (Hybrid Views) | **Pass.** (Allows belief, denies appreciation) | **Pass.** (Explains intuition via appreciation gap) | **Pass.** (Distinguishes belief from appreciation) | **Mixed.** (Experience needed for appreciation, not belief) | **High.** (Fits response-dependence well) |

  **Verdict:** The **Intermediate** view currently scores highest on this specific specification because it is the only one that attempts to satisfy both the Practice and Phenomenological constraints by leveraging the Attitude Specification (believing *that* it is good vs. appreciating *the* good). However, it pays the cost of fragmenting aesthetic understanding into two disconnected states.
