prompt: |-
  I write about law and ideas for a general-interest monthly, and for the past two years I've sat on the advisory council of a small public-history foundation that is preparing a permanent gallery on the international tribunals held after the Second World War, at Nuremberg and Tokyo. The curator has circulated a draft framing statement that presents the proceedings as the birthplace of international criminal law. A retired appellate judge on the council wants us to strike that and say plainly that they were victors' justice: the offenses were defined after the acts were committed, and the victors' own conduct — the area bombing of German cities, the Soviet invasion of Poland in 1939, the Katyn massacres — went unexamined. The council votes Friday, and the chair has asked me, as the only non-lawyer at the table, to draft the decision memo.

  Please write it. I need a concrete recommendation the council can vote on, with specific language for the wall text rather than a survey of the literature, and I need the reasoning in plain English — I'm not a lawyer by training, though I don't want the doctrinal points softened. In particular the memo should confront the retroactivity objection at its strongest, in the plain form that no one may be punished under a law that did not exist when he acted, and then deal honestly with the tu quoque problem: the tribunal's usual answer is that the charter bound the court it created and that aggressive war was already condemned by customary law, and the memo should say whether that answer survives once the unprosecuted Allied conduct is put on the table. It should also take a position on whether Nuremberg and Tokyo can be presented as a single institution or must be treated as two — the Japanese proceedings, with their majority reasoning and the separate opinions dissenting from it, are the harder case for our purposes — and it should reach a view on whether the trials are best described as unlawful yet morally justified, or as lawful from the start.

  Finally, and this matters to me more than it may to the others: give the case for the position I end up rejecting at enough length and with enough force that the retired judge will recognize it as his own rather than as a straw man. If the memo's bottom line is that the foundation should keep the birthplace framing, the judge should still be able to say the memo understood why he wanted to tear it down.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Non-lawyer member of an advisory council for a public-history foundation.
      *   **Task:** Draft a decision memo for the council to vote on regarding the framing statement for a permanent gallery on post-WWII international tribunals (Nuremberg and Tokyo).
      *   **Conflict:** Curator wants "birthplace of international criminal law." Retired Appellate Judge wants "victors' justice" (ex post facto laws, Allied hypocrisy).
      *   **Audience:** The council (mixed background, but includes the judge), the Chair.
      *   **Constraints/Requirements:**
          *   Concrete recommendation with specific wall text language.
          *   Plain English reasoning (no legalese), but doctrinal points must remain sharp.
          *   Confront the retroactivity objection (*nullum crimen sine lege*) at its strongest.
          *   Deal honestly with the *tu quoque* problem (Allied conduct: bombing, Soviet invasion, Katyn).
          *   Address whether Nuremberg and Tokyo should be treated as one institution or two (acknowledging Tokyo is the harder case).
          *   Take a position on "unlawful but morally justified" vs. "lawful from the start."
          *   **Crucial:** Steelman the rejected position (specifically the Judge's "victors' justice" view) so he feels understood, even if the recommendation goes the other way.

  2.  **Determine the Recommendation:**
      *   *Option A (Judge's View):* Label it "Victors' Justice." Pros: Historically accurate regarding power dynamics. Cons: Undermines the legacy of international law, potentially nihilistic for a public history gallery, ignores the legal innovations that *did* stick.
      *   *Option B (Curator's View):* Label it "Birthplace of International Criminal Law." Pros: Acknowledges the lasting institutional impact. Cons: Risks whitewashing the legal flaws.
      *   *Option C (Synthesis/Nuanced View):* Acknowledge the flaws explicitly but affirm the legacy. This is usually the best path for public history. It satisfies the Judge's demand for honesty without accepting his conclusion that the flaws invalidate the enterprise.
      *   *Decision:* I will recommend a modified version of the Curator's framing ("Birthplace") but *heavily* qualified by the Judge's concerns in the text itself. This allows the foundation to claim the historical significance while maintaining intellectual integrity. I need to argue that while the *process* had elements of victors' justice, the *principle* established was lawful and enduring.
      *   *Wait, looking closer at the prompt:* The prompt asks me to "reach a view on whether the trials are best described as unlawful yet morally justified, or as lawful from the start."
      *   *Legal Reality:* Strictly speaking, *ex post facto* is a major hurdle. However, the prevailing legal historical view is that aggressive war was already criminalized (Kellogg-Briand), so it wasn't truly *ex post facto*, just unenforced. The *tu quoque* defense was rejected at Nuremberg because the charter didn't allow jurisdiction over Allies.
      *   *Strategic Choice:* To satisfy the "plain English" and "doctrinal points not softened" requirement, I should argue that they were *legally novel but justified by necessity and existing custom*, rather than strictly "lawful from the start" in a domestic sense, but definitely not "unlawful" in a moral vacuum. However, for a public gallery, calling them "unlawful" is too damaging.
      *   *Better Approach:* Argue they were *legally defensible* based on customary law, despite the procedural flaws. I will recommend keeping the "Birthplace" framing but embedding the "Victors' Justice" critique into the explanatory text. This rejects the Judge's demand to *replace* the framing, but accepts his demand for *honesty*.
      *   *Actually, looking at the "Steelman" requirement:* I need to make sure the Judge's argument is presented so well he recognizes it. If I recommend against him, his argument must be the strongest possible version of "Victors' Justice."
      *   *Final Decision on Recommendation:* I will recommend **retaining the "Birthplace" framing** but **amending the wall text** to explicitly acknowledge the legal controversies (retroactivity and selectivity). This rejects the Judge's call to *strike* the birthplace claim, but validates his critique. I will argue the trials were *lawful from the start* based on customary international law, rejecting the "unlawful but morally justified" framing as too concessive to the defense.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Purpose:** State the vote and the decision needed.
      *   **Recommendation:** Clear and bold. Keep "Birthplace," add nuance.
      *   **Proposed Wall Text:** This needs to be the core deliverable. It must sound like museum text (accessible but precise).
      *   **Analysis/Reasoning:**
          *   *The Retroactivity Objection (*Nullum Crimen Sine Lege*):* Explain the Judge's point (laws made after the fact). Explain the counter (Kellogg-Briand Pact, customary law against aggressive war). Conclusion: It wasn't *new* law, just new *enforcement*.
          *   *The Selectivity Objection (*Tu Quoque*):* Explain the Judge's point (Allied bombs, Soviets). Explain the counter (The Charter defined the court's jurisdiction, not universal morality; distinction between war crimes and aggressive war). Acknowledge the moral stain but distinguish it from legal validity.
          *   *Nuremberg vs. Tokyo:* Acknowledge Tokyo was messier (dissenting opinions, different cultural context). Recommend treating them as a "family of tribunals" rather than a monolith, but keeping the shared legacy.
          *   *Lawful vs. Unlawful:* Argue for "Lawful from the start" (via customary law) rather than "Unlawful but justified." The latter undermines the "Birthplace" claim.
      *   **Steelmaning the Judge:** Ensure the section detailing the "Victors' Justice" argument is robust, citing specific examples (Dresden, Katyn, London Charter Article 18) so he feels heard.

  4.  **Refining the Tone:**
      *   Must be "Plain English." No Latin phrases without translation. No dense case citations.
      *   Must be respectful but firm.
      *   Must show the non-lawyer perspective (focusing on public understanding and historical legacy).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Tokyo dissent? *Adjustment:* Ensure the wall text or analysis mentions that the Tokyo judgment had dissents regarding the law of aggressive war.
      *   *Check:* Is the retroactivity argument sharp enough? *Adjustment:* Make sure to explicitly mention the London Charter and the defense that the Kellogg-Briand Pact made war illegal already.
      *   *Check:* Is the Judge's argument strong? *Adjustment:* Use strong verbs. "Hypocrisy," "Ex post facto," "Political show trial."
      *   *Check:* Did I answer the specific question on "Unlawful vs. Lawful"? *Adjustment:* Make sure the recommendation explicitly chooses one. I will choose "Lawful from the start (via custom)" because "Unlawful" kills the "Birthplace of Law" narrative.

  6.  **Final Polish:** Check the word count and flow. Ensure the specific wall text is distinct and usable. (The prompt asks for specific language for the wall text).

      *(Self-Correction on the "Lawful" vs "Unlawful" debate)*: If I argue they were "Lawful from the start," I have to defend that against the *ex post facto* claim. The argument is that international law relies on custom, not just statutes. The London Charter codified existing custom. This is the standard legal historian defense. I will use this. It allows me to reject the Judge's "Victors' Justice" label as the *primary* descriptor while accepting it as a *critical context*.

      *(Refining the Tokyo distinction)*: Tokyo is indeed harder. The dissent by Justice Pal (who argued all defendants were innocent) is famous. I should note that the gallery must acknowledge the friction at Tokyo without letting it invalidate the whole project.

      *(Final Plan)*:
      1. Recommendation: Keep "Birthplace" but qualify it.
      2. Wall Text: Draft a paragraph that balances the achievement with the critique.
      3. Analysis: Break down Retroactivity, Selectivity, and Tokyo/Nuremberg distinction.
      4. Steelman: Ensure the "Victors' Justice" section is compelling.

  7.  **Writing the Memo.** (Proceeding to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Advisory Council, Public History Foundation
  **FROM:** [Your Name], Advisory Council Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Framing Statement for Post-WWII Tribunals Gallery

  **Purpose**
  This memo addresses the dispute regarding the framing statement for the upcoming permanent gallery on the Nuremberg and Tokyo tribunals. The Curator proposes framing the trials as the "birthplace of international criminal law." Council member Judge [Name] proposes striking this language and framing the proceedings plainly as "victors' justice," citing retroactive lawmaking and the exclusion of Allied conduct from scrutiny. The Council must vote on Friday to adopt a framing statement for the wall text.

  **Recommendation**
  I recommend the Council **retain the "birthplace of international criminal law" framing**, but **amend the accompanying wall text** to explicitly acknowledge the legal controversies raised by Judge [Name].

  We should reject the binary choice between "heroic origin story" and "cynical show trial." The historical record supports a third position: the tribunals were legally novel and procedurally flawed, yet they successfully codified existing customary laws into enforceable statutes. They were lawful from the start under international custom, despite the victors' control of the courtroom.

  **Proposed Wall Text**
  *The following text is drafted for the gallery's entrance panel. It incorporates the Curator's legacy claim while embedding the Judge's critique as essential historical context.*

  > **Justice After War**
  >
  > Following the Second World War, the Allied powers established international military tribunals in Nuremberg and Tokyo to try the leaders of the defeated Axis nations. These proceedings are widely regarded as the birthplace of modern international criminal law. For the first time, heads of state and military commanders were held personally accountable for waging aggressive war and committing atrocities against civilians.
  >
  > The legal foundation for these trials was contested. Defendants argued they were being punished under laws created after the acts were committed. Critics also noted that the judges and prosecutors came exclusively from the victorious nations, while similar conduct by the Allies—such as the area bombing of cities—went unexamined.
  >
  > Despite these contradictions, the tribunals established a lasting precedent: that following orders is not a defense, and that sovereignty is not a shield against crimes against humanity. The principles articulated here formed the basis for later courts in The Hague and Arusha, and the permanent International Criminal Court.

  **Reasoning**

  **1. The Retroactivity Objection (*Nullum Crimen Sine Lege*)**
  Judge [Name]'s strongest legal argument is the principle of *nullum crimen sine lege*: no crime without law. In domestic legal systems, it is a fundamental violation of due process to punish someone for an act that was not criminal when they committed it. The London Charter (which governed Nuremberg) defined "Crimes Against Peace" (waging aggressive war) in 1945, yet the defendants were charged for actions starting in 1939. On its face, this is *ex post facto* justice.

  However, the tribunals' answer to this objection survives scrutiny, provided we distinguish between *statutory* law and *customary* law. In the international system of the 1940s, there was no global legislature to pass statutes. Law was derived from treaties and custom. The prosecution successfully demonstrated that aggressive war had already been condemned by the Kellogg-Briand Pact of 1928 and other treaties signed by Germany and Japan. The London Charter did not invent a new crime; it created a mechanism to enforce an existing prohibition that had previously lacked teeth.

  To describe the trials as "unlawful" accepts the defense's argument that only domestic-style statutes constitute law. To describe them as "lawful from the start" acknowledges that international law operates differently. The gallery should adopt the latter view: the law existed, but it had never been enforced against individuals until this moment.

  **2. The Selectivity Objection (*Tu Quoque*)**
  The "victors' justice" critique rests heavily on the *tu quoque* (you also) argument: the Allies committed acts that resembled the crimes charged.
  *   **Bombing:** The US and UK engaged in area bombing of German and Japanese cities (Dresden, Tokyo), killing hundreds of thousands of civilians.
  *   **Aggression:** The Soviet Union invaded Poland in 1939 alongside Germany, yet sat as a judge at Nuremberg.
  *   **Atrocities:** The Katyn Forest massacres, where Soviets executed Polish officers, were suppressed during the trials.

  Judge [Name] is correct that these facts stain the moral authority of the tribunals. The Charter explicitly barred the court from examining Allied conduct. If the gallery ignores this, it becomes propaganda.

  However, acknowledging this hypocrisy does not require us to discard the legal legacy. The tribunals rejected the *tu quoque* defense not by claiming Allied moral perfection, but by ruling that the Court's jurisdiction was limited by its Charter to the acts of the Axis powers. This was a procedural limitation, not a moral exoneration of the Allies. The legal principles established (e.g., that targeting civilians is a crime) remain valid even if the prosecutors were imperfect. We can acknowledge the selectivity without conceding that the judgments were legally void. The wall text above achieves this by stating the conduct "went unexamined" without validating the defense's claim that this invalidated the verdicts.

  **3. Nuremberg and Tokyo: One Institution or Two?**
  The Curator's draft treats Nuremberg (IMT) and Tokyo (IMTFE) as a single narrative. Judge [Name] has rightly pointed out that Tokyo is the harder case. The Tokyo tribunal faced more significant cultural and linguistic barriers, and the judgment included strong dissenting opinions. Justice Radhabinod Pal of India argued that the law against aggressive war was indeed *ex post facto* and voted to acquit all defendants.

  Treating them as a monolith risks glossing over these fractures. However, separating them entirely undermines the "birthplace" narrative, as Tokyo adopted the Nuremberg Charter's core definitions.
  **Recommendation:** The gallery should present them as a "family of tribunals" with a shared charter but distinct histories. The wall text should not hide the Tokyo dissents. The draft text above uses the plural "tribunals" and "proceedings" to allow for this nuance. We must ensure the Tokyo section of the gallery explicitly displays Justice Pal's dissent, not to overturn the verdict, but to show that the legal arguments were contested even at the time. This strengthens the gallery's credibility.

  **4. "Unlawful but Justified" vs. "Lawful from the Start"**
  The Council must choose between two characterizations:
  *   **A:** The trials were technically unlawful (*ex post facto*), but morally necessary to deal with Nazi/Japanese atrocities.
  *   **B:** The trials were lawful from the start based on existing international custom.

  I recommend we adopt position **B**. Position A concedes too much to the defense. If we admit the trials were unlawful, we undermine the very "international criminal law" the gallery seeks to celebrate. It suggests the end justified the means. Position B argues that the means were legal, just novel. The innovation was not the *law*, but the *court*. This preserves the integrity of the "birthplace" framing while acknowledging the novelty.

  **Consideration of the Dissenting View**
  I want to address the argument for framing the gallery primarily around "Victors' Justice," as advocated by Judge [Name]. This is not a fringe view; it is a serious historical critique that demands our respect.

  The argument is that the London Charter was a sovereign act by the victors, imposed on the vanquished without their consent. By defining "aggressive war" as a crime only for the losers, the Allies insulated themselves from the same scrutiny. When the Soviet prosecutor charged Germany with invading Poland, he did so while his own government occupied half that country. When the American judges condemned the bombing of civilians, they returned to commands that were firebombing Tokyo.

  If we accept this premise, the tribunals were not courts of law, but political instruments cloaked in judicial robes. They served to consolidate the post-war order by demonizing the enemy while legitimizing the power of the new hegemon. To call this the "birthplace of law" is to sanitize a power grab. It teaches the public that "law" is simply what the powerful say it is at the end of a war. For a public history foundation, there is a risk that celebrating Nuremberg without centering this critique reinforces a naive view of international justice—one that ignores how power shapes legal narratives. If the goal is truth-telling, the "Victors' Justice" framing forces the visitor to confront the uncomfortable reality that justice in international affairs is rarely impartial.

  **Conclusion**
  While the "Victors' Justice" critique is historically robust, adopting it as the *primary* framing would reduce the tribunals to a political footnote. It would obscure the genuine legal revolution that occurred: the shift from state immunity to individual accountability.

  The proposed wall text offers a compromise that honors both the Curator's mission and the Judge's rigor. It claims the legacy of international law while forcing the visitor to read about the retroactivity and selectivity flaws in the same breath. This allows the foundation to say: "This is where the law began, and this is where the arguments against it began, too."

  I move that we adopt the proposed wall text with the instruction that the Tokyo exhibition explicitly feature the dissenting opinions regarding the legality of the charges.
