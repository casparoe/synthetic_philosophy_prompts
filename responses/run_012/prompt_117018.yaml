  *(Self-Correction during drafting)*: I need to be careful not to over-correct. The popularizers aren't *wrong* about the demandingness aspect; Williams *does* think utilitarianism is too demanding. But the user's suspicion is that integrity is *just* demandingness. That is the error to highlight. Integrity is the *reason why* the demandingness is unacceptable, not just a synonym for "hard."

