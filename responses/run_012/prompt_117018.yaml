      *   *Popular View:* Integrity = Demandingness (it asks too much of me).
      *   *Williams's View:* Integrity is distinct from demandingness. Demandingness is about *how much* you have to give up. Integrity is about *what* you are asked to give up and *who* is doing the giving. It's about alienation. Utilitarianism makes your projects neutral inputs into a calculus. If you have to abandon a project because the calculus says so, the project isn't truly *yours* in the deep sense. It attacks the source of action, not just the quantity of sacrifice.
      *   *Verdict:* The popular view fuses them incorrectly. Integrity is about identity/alienation, not just cost.

  4.  **Evaluate Claim 3: Stranger to One's Own Life:**
      *   *Popular View:* Subordinating commitments makes you a stranger.
      *   *Williams's View:* Yes, this is close. He talks about "negative responsibility" and how utilitarianism attacks the link between the agent and their actions. If I am just a channel for utility, my actions aren't authentically mine.
      *   *Verdict:* Accurate enough, provided "stranger" is understood as "alienated from one's own agency."

  5.  **Evaluate Claim 4 & 5: The Drowning Wife & One Thought Too Many:**
      *   *Popular View:* Utilitarian says save her + think it's permissible. Williams says just think "she's my wife."
      *   *Williams's View:* The example is from "Persons, Character, and Morality." The point isn't that moral thinking is *never* allowed. It's that the *justificatory structure* of impartial morality requires the agent to step outside their personal relationship to validate it. The husband shouldn't need to appeal to a general principle (e.g., "saving spouses maximizes utility" or "special obligations are permissible") to justify saving his wife. The thought "she is my wife" is the reason. Adding "and morality allows this" suggests the personal reason isn't sufficient on its own.
      *   *Nuance:* Williams isn't saying *no* moral thought is allowed ever. He's saying the *requirement* to validate personal reasons via impartial standards is the problem.
      *   *Verdict:* The popular summary captures the slogan but often misses the structural point about justification.

  6.  **Evaluate Claim 6: The Conclusion (Refutation of Impartial Morality):**
      *   *Popular View:* Williams refuted utilitarianism and any impartial theory.
      *   *Williams's View:* Williams was skeptical of "morality" as a peculiar institution (the "morality system"). He didn't necessarily think he "refuted" utilitarianism in the sense of proving it logically inconsistent. He argued it is *unlivable* or *psychologically impossible* without damaging what makes us human. He attacks the *priority* of the impartial standpoint. He doesn't necessarily say impartiality is worthless, but that it cannot be the *sole* or *supreme* arbiter of all reasons.
      *   *Verdict:* "Refuted" is too strong. "Shown to be deeply flawed/unlivable" is better. "Any impartial theory" is also too broad; he targets the *overridingness* of impartial morality.

