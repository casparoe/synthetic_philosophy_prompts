answer: |-
  Your suspicion is well-founded. Your friend's summary conflates mathematical representation theorems with normative conclusions, and it treats substantive axioms as logical trivialities. This is a common elision in informal discussions, especially in communities focused on AI safety, where the pragmatic stakes of "coherence" are emphasized over the philosophical foundations.

  Here is the sentence-by-sentence audit you requested, followed by an analysis of the argumentative gaps.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "Expected utility theory is not a psychological theory at all, but a consistency requirement on preference."**
  *   **Verdict:** **Acceptable (with caveats).**
  *   **Analysis:** This is the standard "revealed preference" interpretation. It claims decision theory does not describe mental states but rather imposes structural constraints on choice behavior.
  *   **Nuance:** A proponent would accept this to avoid empirical falsification (people *do* violate EU in experiments). A critic would argue that if the theory cannot distinguish between a consistent agent and a consistent robot, it loses its grip on *agency* and *rationality* as mental phenomena. However, as a statement of the formalist stance, it is correct.

  **2. "The von Neumann–Morgenstern and Savage theorems show that any agent whose preferences satisfy a handful of trivial bookkeeping conditions — no cycles, no gaps, that sort of thing — can be represented as maximizing expected utility..."**
  *   **Verdict:** **Wince / Defensible Simplification.**
  *   **Analysis:** The mathematical claim (Representation Theorem) is true: if preferences satisfy the axioms, there exists a utility function and (in Savage's case) a probability measure that represents them.
  *   **The Error:** The phrase "trivial bookkeeping conditions" is the first major seam.
      *   *Transitivity* (no cycles) is often granted as minimal.
      *   *Completeness* (no gaps) is substantive. It requires an agent to have a preference between any two options, even those they haven't considered or find incomparable. Many philosophers reject this as psychologically unrealistic and normatively unwarranted.
      *   *Independence* (the key axiom in VNM) is highly substantive. It rules out preferences for certainty or hedging that depend on the context of the choice set (e.g., the Allais Paradox). Calling this "bookkeeping" hides the fact that it rules out entire classes of reasonable human values.

  **3. "...which means the agent's beliefs and desires can simply be read off its choices without anyone ever asking it what it wants."**
  *   **Verdict:** **Acceptable (Methodologically).**
  *   **Analysis:** This is the core of the behaviorist interpretation. If the representation theorem holds, the probability and utility functions are unique (up to positive affine transformation).
  *   **Nuance:** Proponents accept this as a feature (objectivity). Critics argue this creates a circularity: we define belief by choice, and choice by belief. It makes the theory tautological unless there is an independent way to measure belief (e.g., via betting behavior distinct from utility-laden choices).

  **4. "The axioms are just canons of logic, so an agent who violates them is provably irrational..."**
  *   **Verdict:** **Reject Outright.**
  *   **Analysis:** This is the most significant philosophical error in the summary.
      *   *Logic:* Axioms of decision theory are not truths of logic (like the law of non-contradiction). They are substantive constraints on attitudes. One can violate Independence without violating the laws of thought.
      *   *Provably Irrational:* The move from "violates axioms" to "irrational" is not a mathematical proof; it is a normative jump. The math shows *inconsistency*, not *irrationality*. To get irrationality, you need a premise linking consistency to rationality.
  *   **Proponent Defense:** A hardline proponent might argue that "rationality" just *means* "consistency of preferences."
  *   **Critic Objection:** This defines the question away. Most philosophers distinguish between *instrumental rationality* (achieving goals) and *coherence* (internal consistency). An agent can be coherent but pursue self-destructive goals, or incoherent in ways that don't harm goal achievement.

  **5. "...that is why the money-pump argument works, since anyone with intransitive preferences can be bled dry by a sequence of trades each one of which he prefers to the one before."**
  *   **Verdict:** **Wince (Defensible but limited).**
  *   **Analysis:** The money pump is a pragmatic argument, not a logical one. It shows that intransitivity can lead to *dominated strategies* (ending up with less money and the same asset you started with).
  *   **The Seam:** This supports the claim that intransitivity is *pragmatically self-defeating*, but it does not prove the axioms are "canons of logic." Furthermore, a sophisticated agent can anticipate the pump and refuse to trade (myopic vs. sophisticated choice). The money pump works best against agents who don't learn or plan ahead. It establishes a prudential reason to be coherent, not a logical necessity.

  **6. "Therefore expected utility maximization is the only decision rule that reason permits, full stop, and once you grant the axioms there is nothing substantive left to argue about."**
  *   **Verdict:** **Reject Outright.**
  *   **Analysis:**
      *   "Only decision rule": False. There are coherent alternatives (e.g., maximin, risk-weighted expected utility) that violate Independence but satisfy other coherence standards.
      *   "Nothing substantive": False. The axioms encode substantive values (e.g., risk neutrality is often baked into the linearity of expectation).
      *   "Reason permits": This assumes a specific conception of reason (instrumental consistency) that is itself a substantive philosophical commitment.

  **7. "He added, as a kind of coda, that this is also why an incoherent agent is doomed in any competitive setting: a coherent opponent can predict it and strip it of everything it has."**
  *   **Verdict:** **Distinct Claim (Empirical/Evolutionary).**
  *   **Analysis:** This is not a coherence argument; it is an evolutionary or game-theoretic argument.
  *   **Status:** Plausible but empirical. It suggests that *if* you want to survive competition, you *ought* to be coherent. It does not prove that coherence is rational in isolation, only that it is adaptive. A solitary agent on an island could be incoherent without being "stripped of everything."

  ---

  ### Part 2: Proponent Defense vs. Critic Objection

  To help you locate the seams, here is how the two sides categorize the errors above.

  **What a Defender of the Coherence Program Would Disavow:**
  A sophisticated decision theorist (not a blog-post summarizer) would likely disavow Claim 4 ("Axioms are canons of logic"). They would admit the axioms are normative postulates, not logical truths. They would also soften Claim 2, acknowledging that Completeness and Independence are substantive assumptions that can be debated. They would frame the argument not as "logic proves EU," but as "EU is the unique solution to the problem of consistent choice under uncertainty."

  **What Are Standard Objections (Not Errors of Exposition):**
  *   **The Normative Gap:** The claim that consistency *entails* rationality (Claim 4 & 6) is the primary target of philosophical criticism, not a misunderstanding. Critics argue that consistency is necessary but not sufficient for rationality.
  *   **The Substance of Axioms:** The claim that axioms are "trivial" (Claim 2) is a standard point of contention. For example, the *Independence Axiom* implies that your preference between A and B should not change if both are mixed with C with the same probability. Many argue this ignores the *value of certainty* or *regret*, which are rational concerns.
  *   **The Evolutionary Coda:** Critics distinguish between *rationality* (what you ought to do) and *fitness* (what helps you survive). An agent might be rationally required to keep a promise even if it makes them vulnerable to exploitation (e.g., in a Prisoner's Dilemma with a known defector).

  ---

  ### Part 3: The Missing Premise

  You asked the most important question: **If the summary is corrected, does the conclusion (EU is uniquely rational) follow?**

  **The Answer:** **No.**

  Even if we correct the errors—admitting the axioms are substantive, acknowledging the theorems are representational, and accepting the money pump as pragmatic rather than logical—the conclusion does not follow without an extra normative premise.

  **The Argument Structure:**
  1.  **Mathematical Premise:** If an agent's preferences satisfy Axioms $A$, there exists a function $U$ such that the agent acts *as if* maximizing $E[U]$. (True by Representation Theorem).
  2.  **Pragmatic Premise:** If an agent's preferences violate Axioms $A$, they are susceptible to strategies that yield outcomes they themselves rank lower (Money Pump / Dutch Book). (True, with caveats about sophistication).
  3.  **Normative Bridge Premise (MISSING):** *An agent is irrational if and only if their preferences make them susceptible to strategies that yield outcomes they themselves rank lower (or violate consistency constraints).*

  **Why the Bridge Premise is Substantive:**
  This bridge premise is not a theorem; it is a philosophical definition of rationality. It equates rationality with **instrumental consistency**.
  *   **Humean View:** Reason is the slave of the passions. If my passions are cyclic (I prefer A to B, B to C, C to A), reason cannot tell me I am wrong, only that I will lose money. The "irrationality" is only relative to the desire to keep money.
  *   **Rationalist View:** There are objective constraints on what it is reasonable to prefer.

  **The Specific Gap in Your Friend's Argument:**
  Your friend moves from "You can be represented as an EU maximizer" to "You *should* be an EU maximizer."
  *   The theorem says: Consistency $\rightarrow$ EU Representation.
  *   The friend concludes: Rationality $\rightarrow$ EU Maximization.
  *   To get there, you must assume: Rationality $\rightarrow$ Consistency.

  While this seems obvious, it is the exact point of contention. For example, if I have vague preferences (violating Completeness) because the options are incommensurable (e.g., "save a human life" vs. "preserve a unique work of art"), am I irrational? The coherence argument says yes (you must force a trade-off). Many philosophers say no (rationality permits vagueness).

  **Conclusion:**
  Your friend's summary treats the **Normative Bridge Premise** as if it were a logical truth derived from the Representation Theorem. It is not. It is a substantive ethical/philosophical commitment to a specific conception of rationality (one that prioritizes internal consistency and immunity to exploitation above all else).

  Once you insert this premise explicitly, the argument becomes valid but controversial. The "uniquely rational" claim then rests entirely on the defense of that bridge premise, not on the mathematics of the theorems. The math does the heavy lifting on *structure*; the philosophy must do the heavy lifting on *normativity*. Your friend has attributed the philosophical weight to the mathematical machinery.
