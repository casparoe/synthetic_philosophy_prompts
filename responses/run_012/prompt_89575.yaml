answer: |-
  MIRA
  I've been reading Strawson again. The Basic Argument. It's airtight, Tom. You do what you do because of how you are. To be responsible for what you do, you'd have to be responsible for how you are. But you can't be responsible for how you are, not initially. And to change how you are, you'd need a principle of choice, which comes from... how you are. It's turtles all the way down. I'm a libertarian. I need contra-causal freedom. This argument proves I'm wrong. It proves I'm never the ultimate author of anything.

  TOM
  Strawson is right. Ultimate responsibility is impossible. You can't create yourself from scratch. But I don't see why that keeps you up at night. You're treating "responsibility" like it's a metaphysical substance you need to ingest. It's not. It's a scorekeeping word. Like "offside" in soccer. The ball doesn't care about offside. But the game does. You're responsible because the practice says you are, not because you magically authored your soul.

  MIRA
  That works for soccer. It doesn't work for cruelty. Take a man who spends twenty years deliberately, effortfully hardening himself. He reads nihilists, suppresses empathy, practices indifference until he succeeds. He made himself cruel. Strawson says even he isn't responsible because the desire to harden himself came from somewhere prior. If that man isn't responsible, then your scoreboard is just recording weather patterns. It's not tracking agency.

  TOM
  I'd blame that man. But let's use my case. A mother was neglected as a child, neural pathways set for detachment. She neglects her own kid. Nobody chose that cycle. Yet we hold her responsible. Why? Because the neglect is attributable to her. It expresses who she is. I separate that from desert. She doesn't necessarily deserve to suffer in some cosmic court. But she is the proper target of the practice. The practice earns its keep by protecting the kid.

  MIRA
  Here's the cost. If you drop desert—if you admit she doesn't ultimately deserve blame—then punishing her isn't justice. It's management. You're not holding her accountable; you're treating her as a lever. You push the "blame" button to change her behavior or protect the tribe. That's what we do with dangerous dogs or broken cars. If you remove the metaphysical weight, you remove the person. You're instrumentalizing her.

  TOM
  I'm not treating her as a lever because I'm engaging her reasons. When I blame the mother, I'm saying, "You knew better, you could have tried." That addresses her rationality. A dog doesn't understand blame. A car doesn't. She does. The practice isn't about cosmic justice; it's about mutual recognition. I treat you as an agent because you respond to reasons, even if those reasons are determined. That's not manipulation. That's conversation.

  MIRA
  But it's a lie if the capacity to do otherwise isn't real. You're saying "You could have tried" when Strawson proves she couldn't have tried any harder than she did, given who she was. You're pretending she has a power she doesn't have to maintain the practice. That's not recognition. It's a useful fiction. And if I know it's a fiction, how can I look her in the eye and blame her without feeling like a fraud?

  TOM
  It's not a fiction that she could have tried. It's a fact about her capacities within the world as it is. "Could have" means "would have, if she had chosen." We don't need contra-causal magic for that. You're worried about feeling like a fraud. I'm worried about the kid. If we stop holding her responsible because of a metaphysical regress, we lose the only tool we have to demand better. The feeling of fraudulence is your price for wanting a god's-eye view.

  MIRA
  The price is higher. It's that I can't distinguish my blame from a trainer clicking a button. You say you engage her reasons. But if determinism is true, her accepting those reasons is just more causation. You're causing her to change by using moral language instead of a shock collar. The mechanism is the same. Cause and effect. You've just dressed it up in normative clothes to make yourself feel human.

  TOM
  The mechanism isn't the same. A shock collar bypasses reasoning. Blame invites it. When I hold you responsible, I invite you to justify yourself. I treat you as a member of the normative community. That status changes the interaction. If I treat you as a broken car, I fix you. If I treat you as responsible, I argue with you. That difference is real, regardless of the metaphysics. You're dismissing the difference because it's not *ultimate* difference. But it's the only difference that fits in a human life.

  MIRA
  So I have to accept that "responsibility" is just a name for a specific kind of causal intervention. It's not about truth. It's about utility. That means when I feel resentment—real, hot resentment—I'm feeling something that has no object. I'm feeling like she violated a moral law, but you're telling me there are no moral laws, only scoreboards. You're asking me to lobotomize my moral emotions to fit your pragmatism.

  TOM
  I'm asking you to keep the emotions because they work, but drop the metaphysics because they don't. Your resentment signals a violation of expectations. That signal is useful. It tells the mother she's damaged the relationship. You don't need a cosmic law to know the relationship is damaged. Strawson kills the god-view. He doesn't kill the human view. You're mourning the god-view. I'm living in the human one.

  MIRA
  The human view requires truth. If I tell her "You ought not have done that," I imply she could have not done it. If she couldn't have, I'm lying. I'd rather say nothing than lie. If the Basic Argument is true, then "ought" implies "can" is false. So "ought" is nonsense. I'd rather have no responsibility than a responsibility built on a false implication.

  TOM
  "Ought" doesn't imply "could have done otherwise in a metaphysical sense." It implies "you have the capacity to respond to reasons." She has that capacity. The neglect wasn't a seizure. It was a failure to respond to reasons she possessed. That's enough for "ought." You're demanding a freedom that would make you a prime mover. I'm offering you a freedom that makes you a person. Take the personhood. It's all there is.

  MIRA
  It feels like a consolation prize. "You're not free, but you can play the game." It drains the color out of everything. If I'm not the author, my victories aren't mine. My failures aren't mine. I'm just a place where things happen. Your scoreboard keeps score, but who's playing?

  TOM
  You're playing. The fact that your moves are determined by your skills doesn't mean you aren't the player. It just means you aren't the referee, the field, and the ball all at once. Strawson says you can't be all that. Fine. Be the player. Play the hand you were dealt. That's the only freedom worth wanting.
