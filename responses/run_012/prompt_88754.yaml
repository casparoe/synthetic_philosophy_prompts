  4. You will know they grasp the distinction if they can reformulate the question from "why did Rome fail to industrialize" to "what work did the aeolipile actually do in its own context."
  5. Explicitly state that you are leaving out all comparisons to 18th-century Britain until they can describe the Roman case without using the Industrial Revolution as the metric of success.
