answer: |-
  Here is a prioritized conceptual research agenda designed for a three-researcher-year unit. This agenda assumes you cannot generate new empirical data and must therefore win the argument on normative clarity and legal coherence. The ordering is determined by **logical dependency** (you cannot design the policy until you define the harm) and **leverage** (which concepts, if shifted, most alter the 35-hour proposal).

  ### Prioritized Research Agenda (5 Lines of Work)

  #### 1. The Normative Priority: Time Sovereignty vs. Time Sufficiency
  **The Question:** In the context of working-time regulation, is the primary injustice a lack of free hours (sufficiency) or the subjection of one's schedule to another's will (sovereignty)?
  **Why Upstream:** This is the meta-ethical foundation. If *sovereignty* is paramount, a statutory 35-hour *cap* is potentially paternalistic and illiberal (restricting the right to sell more labor). If *sufficiency* (or health) is paramount, a cap is a necessary protection against market coercion and cultural pressure. Your stance here dictates whether the 35-hour week is framed as a "freedom from" (domination) or a "protection of" (health).
  **Tractability:** Highly tractable for political philosophers. It requires analyzing existing theories of freedom (negative vs. positive) and applying them to the employment contract, without needing new surveys.
  **Neglectedness:** High. Labor law scholarship often assumes these align. Philosophical literature on "time justice" is growing but rarely forces a hard choice between the two in a policy context.
  **Triggers for Re-ranking:** If legal analysis reveals that "sovereignty" clauses (right to refuse) are systematically unenforceable without a hard cap, this moves from a theoretical question to a practical implementation detail, lowering its priority relative to enforcement mechanisms.

  #### 2. The Legal Theory of Overwork: Karoshi as Negligence vs. Structural Domination
  **The Question:** Should *karoshi* (death by overwork) be legally categorized as an extreme failure of occupational health and safety (negligence) or as a structural violation of bodily autonomy (domination)?
  **Why Upstream:** This determines the legal remedy. If it is negligence, the solution is better risk assessment and compensation after the fact. If it is domination, the solution is *ex ante* structural limits on employer power (e.g., the 35-hour week). This directly informs whether your unit recommends tort reform or statutory hour limits.
  **Tractability:** Purely doctrinal and normative. It involves synthesizing existing case law, tort theory, and republican freedom theory.
  **Neglectedness:** Moderate. Medical literature treats it as pathology; legal literature treats it as compensation. Treating it as a *political* failure of time sovereignty is under-explored in high-income democracies.
  **Triggers for Re-ranking:** If comparative legal analysis shows that jurisdictions treating *karoshi* as structural domination still fail to reduce hours due to economic loopholes, this line of work drops in favor of economic enforcement mechanisms.

  #### 3. The Moral Status of Leisure: Right, Good, or Reward?
  **The Question:** Is leisure a fundamental human right (independent of work), a social good to be optimized, or a reward contingent on labor contribution?
  **Why Upstream:** This addresses the Protestant-work-ethic backdrop. If leisure is a *reward*, a 35-hour week requires a productivity justification (you earn the time). If it is a *right*, the 35-hour week is a restoration of entitlement regardless of output. This framing determines public messaging and coalition building.
  **Tractability:** Conceptual analysis of "rights" language vs. "goods" language in political theory.
  **Neglectedness:** High. Most policy debates assume leisure is the residual of work. Explicitly arguing for leisure as a non-instrumental right is rare in legislative drafting contexts.
  **Triggers for Re-ranking:** If polling or cultural synthesis suggests the "leisure as reward" frame is the only one that gains traction with legislators, you may need to pivot to instrumental arguments (productivity/health), lowering this philosophical inquiry's priority.

  #### 4. Policy Mechanism: Mandatory Caps vs. Default Entitlements
  **The Question:** Given the Sovereignty/Sufficiency tension, should the 35-hour week be a hard legal ceiling (with waivers) or a default standard (with opt-outs)?
  **Why Upstream:** This is the translation of Priority #1 into law. A hard cap prioritizes sufficiency/health; a default prioritizes sovereignty/choice. This decision changes the legal architecture of the reform entirely.
  **Tractability:** Comparative policy analysis and normative evaluation of "nudging" vs. "mandating."
  **Neglectedness:** Low in economics, but high in *normative* evaluation. Economists ask "what works"; philosophers should ask "what legitimizes the constraint."
  **Triggers for Re-ranking:** If existing evidence shows opt-outs render 35-hour laws ineffective (as seen in some EU jurisdictions), the theoretical preference for sovereignty must yield to a hard cap, resolving the question practically rather than theoretically.

  #### 5. The Boundary of "Working Time": Commuting, Care, and Connectivity
  **The Question:** Does the 35-hour limit apply only to paid presence, or does it include unpaid necessary activities (commuting, digital connectivity, preparatory labor)?
  **Why Upstream:** Defining the unit of measurement. If "work" includes email at home, a 35-hour onsite week might still be 50 hours of total labor. This affects the definition of "time sufficiency."
  **Tractability:** Conceptual boundary-drawing and synthesis of existing time-use data (no new data collection needed).
  **Neglectedness:** Moderate. "Right to disconnect" laws exist, but integrating them into a holistic 35-hour definition is conceptually messy and under-theorized.
  **Triggers for Re-ranking:** If legal precedent firmly establishes that only "paid presence" counts toward statutory hours, this becomes a secondary advocacy point rather than a core conceptual pillar.

  ---

  ### Overrated Questions

  **1. The Productivity Argument (Does less work boost output?)**
  *Why Overrated:* This is an empirical contingency, not a normative principle. If your unit argues for the 35-hour week *because* it increases productivity, you concede the Protestant Work Ethic premise that human worth is tied to output. If productivity falls, your argument collapses. A normative case for leisure or health should hold even if GDP dips slightly. Resolving this empirically is also outside your mandate (no original research).
  *Downstream Impact:* Low. It changes the *sales pitch*, not the *moral justification*.

  **2. Universal Basic Income (UBI) as a Prerequisite**
  *Why Overrated:* While UBI interacts with working time, making it a prerequisite for working-time reform creates a "perfect is the enemy of the good" trap. You can argue for time sovereignty within the current wage-labor system. Linking the two conflates distributive justice (income) with structural justice (time), bloating the mandate and delaying actionable policy on the 35-hour week.
  *Downstream Impact:* Low. You can achieve time sovereignty without resolving the entire welfare state.

  ---

  ### Allocation of Three Researcher-Years

  **Researcher 1 (1.25 Years): Normative Foundations (Priorities 1 & 3)**
  *Focus:* Resolve the Sovereignty vs. Sufficiency tension and define the Moral Status of Leisure.
  *Justification:* This is the "keystone" work; without a coherent philosophical defense of why time matters more than output, the policy proposal lacks legitimacy against the work-ethic culture.

  **Researcher 2 (1.0 Year): Legal Theory of Harm (Priority 2)**
  *Focus:* Synthesize *karoshi* case law and construct the "Domination vs. Negligence" argument.
  *Justification:* This bridges the abstract philosophy of Researcher 1 with concrete legal mechanisms, providing the liability framework necessary to enforce the 35-hour norm.

  **Researcher 3 (0.75 Years): Policy Architecture (Priorities 4 & 5)**
  *Focus:* Draft the specific statutory language regarding caps vs. defaults and the definition of "working time."
  *Justification:* This researcher translates the normative and legal conclusions of R1 and R2 into a draftable policy instrument, ensuring the theoretical work results in a viable legislative proposal.
