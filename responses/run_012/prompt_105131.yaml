      *   *Reading 5 (Illusionism - Frankish style):* Claim: Phenomenal consciousness is a pseudo-problem generated by misrepresentation. Status: Substantive/Contested. Dismissive power: High (intended to dissolve Hard Problem).
      *   *Reading 6 (Deflationism):* Claim: "Consciousness" is a cluster concept. No deep essence. Status: Defensible. Dismissive power: Medium.

