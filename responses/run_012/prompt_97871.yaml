answer: |-
  # HANDOUT: Mapping Higher-Order Theories of Consciousness
  **Unit:** Philosophy of Mind | **Topic:** The Transitivity Principle & Its Discontents

  ## PART 1: THE DECISION TREE
  *Start at Node 1. Follow the path that matches your philosophical commitments. Do not look at the theory names until you reach a leaf.*

  **NODE 1: The Transitivity Commitment**
  Does a mental state become conscious *in virtue of* being represented by the subject, or is it conscious independently of being represented?
  *   **Independently:** Go to **Node 2**.
  *   **In Virtue Of:** Go to **Node 3**.

  **NODE 2: The Phenomenological Gap**
  Is there a genuine "what-it's-like" difference between a conscious representation and an unconscious one, or is "conscious" just a functional label for accessed information?
  *   **No Real Difference:** 🍃 **Deflationary / Eliminativism**
  *   **Real Difference:** 🍃 **Plain First-Order Representationalism (FOR)**

  **NODE 3: State Identity**
  Is the awareness of the mental state a *second* distinct state, or does the first-order state represent itself?
  *   **Represents Itself:** 🍃 **Self-Representationalism (One-State View)**
  *   **Second Distinct State:** Go to **Node 4**.

  **NODE 4: Nature of the Higher-Order State**
  Is the higher-order awareness itself an *experience* (perceptual-like, qualitative), or is it a non-experiential *thought* (propositional, conceptual)?
  *   **Experience (Perceptual):** Go to **Node 5**.
  *   **Thought (Non-Experiential):** Go to **Node 6**.

  **NODE 5: The Perception Constraint**
  Must this higher-order perception be *conscious* itself to make the first-order state conscious?
  *   **Yes (Requires Conscious HOP):** 🍃 **Higher-Order Regress / Infinite Hierarchy** *(See Analysis)*
  *   **No (Unconscious HOP suffices):** 🍃 **Inner-Sense / Higher-Order Perception (HOP)**

  **NODE 6: The Occurrent Requirement**
  Must the higher-order thought be actively occurring *right now*, or is a mere *disposition* to have one sufficient?
  *   **Disposition Sufficient:** 🍃 **Dispositionalist Higher-Order Thought**
  *   **Actively Occurring:** Go to **Node 7**.

  **NODE 7: [Specific Addition 1] The Unconscious HOR**
  If the higher-order thought exists but is *itself unconscious*, does it successfully confer consciousness on the first-order state?
  *   **No (Unconscious HOT fails):** 🍃 **Conscious-HOT Requirement** *(See Analysis)*
  *   **Yes (Unconscious HOT works):** Go to **Node 8**.

  **NODE 8: Reliability & Misrepresentation**
  Can the higher-order thought be *wrong* about the first-order state (e.g., represent a red state as green, or represent a state that isn't there)?
  *   **No (Infallible):** 🍃 **Infallibilist HOT** *(See Analysis)*
  *   **Yes (Misrepresentation possible):** Go to **Node 9**.

  **NODE 9: [Specific Addition 2] The Twin Case**
  Imagine two qualitatively identical first-order states. Only one is targeted by a higher-order thought. Is the *untargeted* state conscious?
  *   **Yes (It is still conscious):** 🍃 **Hybrid View (Intrinsic Phenomenality)** *(See Analysis)*
  *   **No (It is not conscious):** Go to **Node 10**.

  **NODE 10: The Status of Transitivity**
  Is the Transitivity Principle a *definition* of what 'conscious' means (analytic), or a contingent claim about how consciousness happens to work (empirical)?
  *   **Definition (Analytic):** 🍃 **Actualist HOT (Conceptual)**
  *   **Contingent (Empirical):** 🍃 **Actualist HOT (Empirical / Rosenthalian)**

  ---

  ## PART 2: MAP ANALYSIS & BLANK SPOTS
  *Use this section to locate your position relative to the standard literature.*

  ### 1. Indistinguishable Leaves (Same Commitments, Different Names?)
  *   **Actualist HOT (Empirical) vs. Self-Representationalism:** Both agree consciousness requires a complex state with self-directed content. The distinction is often merely verbal (one state with two contents vs. two states causally linked). If the causal link is intrinsic, they collapse.
  *   **Dispositionalist HOT vs. Actualist HOT:** Distinguishing an *occurrent unconscious* thought from a *disposition* to have one is notoriously difficult behaviorally. They may differ only in counterfactuals (what would happen if asked), not in phenomenal character.
  *   **Plain FOR vs. Hybrid View (Node 9 Yes):** Both claim first-order states can be conscious without higher-order targeting. The Hybrid view tries to keep Transitivity for *access* while conceding consciousness is intrinsic. This is often unstable and collapses into Plain FOR.

  ### 2. Empty Cells (Combinations No One Holds)
  *   **Conscious-HOT Requirement (Node 7 No):** If a HOT must be conscious to make a state conscious, it requires a third-order thought to make the HOT conscious. This leads to an infinite regress. No stable theory occupies this leaf; proponents usually switch to HOP (Node 5) to stop the regress.
  *   **Infallibilist HOT (Node 8 No):** If HOTs cannot misrepresent, it is hard to explain introspective error or unconscious states that *feel* conscious (illusions of consciousness). Most HOT theorists accept misrepresentation to account for error.
  *   **Dispositionalist HOP:** One could theoretically hold that the "Inner Sense" need only be dispositional. However, HOP proponents usually argue perception must be occurrent to have phenomenology. This combination is unexplored.

  ### 3. Unnamed Leaves (Theoretical Possibilities)
  *   **Hybrid View (Node 9 Yes):**
      *   *Commitment:* Transitivity governs *reportability/access*, but First-Order states possess intrinsic *phenomenality*.
      *   *Diagnosis:* Attractive for those who want HOT's explanation of subjectivity but FOR's intuition about animal consciousness. Risks positing two kinds of consciousness.
  *   **Conscious-HOT Requirement (Node 7 No):**
      *   *Commitment:* A mental state is conscious only if represented by a *conscious* higher-order state.
      *   *Diagnosis:* Incoherent without a stopping point (Regress). Requires a "base" conscious state that doesn't need representation (collapsing to FOR or Self-Rep).

  ### 4. Diagnostic Notes on Specific Additions
  *   **Node 7 (Unconscious HOR):** This is the primary divider between **Rosenthal (Actualist HOT)** and **Locke/HOP**. Rosenthal insists the HOT is unconscious to avoid regress. HOP proponents insist the awareness is perceptual (and thus conscious).
  *   **Node 9 (The Twin Case):** This tests the *constitutive* claim. If you answer **Yes**, you believe consciousness is intrinsic to the FO state (FOR). If you answer **No**, you believe consciousness is relational (HOT). Answering **Yes** while staying in the HOT branch creates the **Hybrid View**, which claims FO states have "phenomenality" but lack "conscious status" until targeted—a distinction many find suspect.

