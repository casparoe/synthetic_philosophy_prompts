answer: |-
  Here are nine probing interview questions designed for a specialist audience, arranged to progressively tighten the dialectical noose around the Joint-Capacity Account (JCA). Each main question includes a follow-up intended to block standard deflection strategies.

  ### 1. The Rock vs. Organism Distinction
  **Question:** Your account hinges on the distinction between capacities sustained by "mutual causal dependence" versus those depending on "spatial arrangement alone." You claim a rock fails this test while an organism passes it. But consider the crystal lattice of a diamond: the structural integrity—the capacity to resist shattering—is sustained by the covalent bonding of carbon atoms, which looks indistinguishable from mutual causal dependence. If you say the diamond doesn't compose an object, you clash with common sense; if you say it does, you risk universalism for all bonded solids. What is the principled metaphysical difference between the causal dependence in a crystal lattice and the metabolic dependence in a cell?

  **Follow-up:** I anticipate you'll reply that metabolic processes are *dynamic* or *self-repairing* in a way lattice bonds are not. But surely a crystal can heal defects under heat, and a frozen organism retains its capacity to metabolize upon thawing without active mutual dependence during the frozen state. If the capacity can exist latently without active causal exchange, doesn't your requirement for *sustained* mutual dependence rule out dormant organisms, or else force you to admit that dormant crystals also compose objects?

  ### 2. Vagueness and Degrees of Capacity
  **Question:** You argue that composition is never vague because capacities are fully determinate. However, dispositions and capacities in the special sciences notoriously come in degrees. A heart failing from disease gradually loses the capacity to pump blood efficiently; it doesn't snap from "full capacity" to "zero capacity" at a specific nanosecond. If the joint capacity admits of degrees, doesn't the composition grounded in that capacity also admit of degrees? How can you maintain determinacy of composition without positing a magical threshold where a 50.0001% capacity yields an object and a 49.9999% capacity yields none?

  **Follow-up:** You might posit a binary threshold: either the capacity is present or it isn't. But this seems to commit you to "gunky" boundaries in time. If an organism dies via gradual cellular decay, are you committed to saying there is a precise Planck time at which the last joint capacity vanishes and the object ceases to exist, despite no microphysical discontinuity? If so, doesn't this make the existence of ordinary objects unnaturally sensitive to microphysical fluctuations in a way that undermines the account's plausibility?

  ### 3. The Problem of the Many
  **Question:** Let's apply that determinacy claim to spatial boundaries. Consider the outer layer of your skin. There are atoms loosely attached, causally interacting less strongly than inner atoms but more strongly than air molecules. Since causal dependence is a continuous physical field, there will be a series of candidate aggregates differing by single atoms, all with nearly identical joint capacities. How does the JCA select exactly *one* of these candidates as the composite object without arbitrariness? If multiple overlapping aggregates satisfy the joint-capacity condition equally well, haven't you simply resurrected the Problem of the Many?

  **Follow-up:** A natural reply is that only one aggregate has the *maximal* causal integration. But causal integration is rarely a unique maximum in continuous fields; it's usually a plateau. If there are two overlapping aggregates with identical causal integration scores, does your account imply there are two coinciding objects? If you deny this, you seem forced to accept that composition is vague after all, contradicting your central virtue claim.

  ### 4. Coincidence (Statue and Lump)
  **Question:** Consider a statue constituted by a lump of clay. The clay particles jointly sustain the capacity to hold a shape (the lump's capacity) and, arguably, the capacity to represent an aesthetic figure (the statue's capacity). Since the particles are the same, the mutual causal dependence is identical. Does your account imply that the lump and the statue are distinct objects because they exercise different *types* of joint capacities? If so, you accept coincidence; if not, you must explain why one capacity counts for composition and the other does not.

  **Follow-up:** If you accept coincidence here, you face the standard worry that distinct objects occupy the same space with the same parts. If you deny it and say only one object exists, which one? If you say "the lump," you seem to privilege the physical capacity over the functional one, which looks arbitrary. If you say "the statue," you imply that mere clay doesn't compose an object until shaped, which suggests composition is temporary. How do you avoid the conclusion that objects pop in and out of existence based on our classification of their capacities?

  ### 5. Conventionalism and the "Non-Accidental" Clause
  **Question:** Your definition requires that the capacity be exercised "non-accidentally." This qualifier does heavy lifting to exclude random heaps. But isn't "accidental" a modal notion that is often interest-relative? A pile of leaves might sustain the capacity to shelter insects. To the insects, this is non-accidental; to the gardener, it's a heap. Is the "non-accidental" constraint mind-independent? If it is, what natural fact grounds it? If it isn't, isn't your account a form of covert conventionalism, where composition depends on our descriptive interests?

  **Follow-up:** Suppose you insist it is mind-independent, grounded in natural kinds. But natural kinds are themselves often identified by the capacities of their members. Doesn't this create a circle? We identify the object by the capacity, but we identify the relevant capacity by the object it belongs to. How do you break into this circle without appealing to human interests to select which causal powers count as "constitutive"?

  ### 6. Causal Exclusion
  **Question:** Let's turn to the causal efficacy of the whole. You claim the parts mutually sustain a joint capacity. But if the parts are doing all the causal work required to sustain that capacity, what causal work is left for the composite object to do? If the whole is just the parts arranged such that they exercise a capacity, doesn't positing the whole as a distinct entity risk causal overdetermination? Why not simply say the parts exercise the capacity jointly, without composing a further thing?

  **Follow-up:** You might reply that the whole is the *bearer* of the capacity. But if the parts are causally sufficient for the effects associated with that capacity, the whole appears epiphenomenal. If the whole *does* add causal power, you violate the causal closure of the physical. How can the joint capacity be real and distinct without being causally redundant or physically impossible?

  ### 7. Epistemic Access
  **Question:** Given the technical nature of "mutual causal dependence" versus "mere arrangement," how are we to know which aggregates compose objects? We cannot observe causal dependence directly; we infer it from the behavior of the object. But if we must assume the object exists to identify the joint capacity, and assume the joint capacity exists to identify the object, isn't the account epistemically inert? How does a scientist distinguish a "true composite" from a "mere aggregate" without already presupposing the answer to the Special Composition Question?

  **Follow-up:** If you say we use Inference to the Best Explanation, the skeptic will ask: what explanatory work does the *composite* do that the *arranged parts* do not? If the answer is "it unifies the capacities," that is a description, not an explanation. If your account cannot generate novel predictions about where objects are that a nihilist or universalist account cannot, in what sense is it a substantive metaphysical discovery rather than a terminological stipulation?

  ### 8. Diachronic Composition and Capacity Loss
  **Question:** You focus on synchronic composition, but objects persist. Organisms replace their parts; machines have components swapped out. If composition is grounded in specific mutual causal dependencies between *these* parts, what happens when a part is replaced? Does the original object cease to exist and a new one begin? If the joint capacity is sustained continuously despite part replacement, doesn't that imply the capacity is independent of the specific parts, undermining your claim that *these* things compose the object?

  **Follow-up:** If you argue that the object persists through part replacement, you are appealing to a continuity of form or function rather than the specific causal dependence of the current parts. This looks like a concession to four-dimensionalism or sortal-dependence. Does your account ultimately collapse into the view that composition is determined by sortals (e.g., "organism," "machine") rather than the underlying mereological relations you propose?

  ### 9. The Deflationist Challenge
  **Question:** Finally, consider Ted Sider's deflationist challenge: that the quantifier "there exists" is precise and logical, and any restriction on it is merely a change of subject. If you claim composition is restricted, you must claim the existential quantifier is restricted. But if the joint-capacity condition is just a description of how some things are arranged, why isn't the truth of "there exists an organism" just the truth of "there are some particles arranged organism-wise"? What substantive metaphysical fact are you capturing that the deflationist misses?

  **Follow-up:** If you reply that the joint capacity is an ontological addition, we return to causal exclusion. If you reply it is not an addition, you seem to concede the deflationist point that there is no deep "Special Composition Question," only a question about which concepts we find useful. Is there any argument you can offer that would convince a deflationist that the JCA is discovering a feature of reality rather than just proposing a useful vocabulary?

  ***

  ### Closing Question
  **Question:** To conclude, metaphysical views are often criticized for being unfalsifiable. Imagine a scenario or a piece of empirical evidence regarding the microphysical structure of matter—for instance, if it turned out that causal dependence is fundamentally non-local or that all macroscopic capacities are fully reducible without remainder to particle interactions. What specific finding, argument, or counter-example would force you to abandon the Joint-Capacity Account? If no such evidence exists, how do you respond to the charge that the view is insulated from rational revision?
