  ### The Example: The Gardener of the Glass Forest

  **The Scenario**
  Elara is the sole custodian of the Glass Forest, a unique ecosystem where flora grows from silicate structures that sing in the wind. A geological shift threatens to shatter the valley. Elara stands before a console with a one-way mechanism. She has enough bio-energy to activate only one protocol.

  **Option A: The Root Protocol**
  Elara grafts her nervous system into the valley's central mycelial network. Her consciousness expands to stabilize the silicate roots. The Forest is saved; the singing continues forever.
  *   **The Change in Want:** The grafting process rewires her reward centers to align with the slow, static growth of the forest. She physically *cannot* want movement, novelty, or human connection anymore. She becomes a guardian spirit, bound to the place. The "unavailability" of her former life is not a loss she mourns; it is a change in her capacity to conceive of such a life as desirable.

  **Option B: The Seed Protocol**
  Elara harvests the genetic codes of the trees into a portable drive and evacuates to the highlands. The Glass Forest shatters and is lost. The singing stops.
  *   **The Change in Want:** By leaving, the objects of her lifelong devotion are destroyed. She remains biologically human, retaining the capacity to want new things, but the specific desire to nurture *this* forest becomes impossible to satisfy. The "unavailability" here is the absence of the object, not the atrophy of the desire.

  **The Incommensurability**
  These options are genuinely incommensurable.
  1.  **No Common Measure:** There is no currency (happiness, utility, duty) that measures "Eternal Ecological Continuity" against "Preserved Human Agency." One is a good of *place and permanence*; the other is a good of *potential and mobility*.
  2.  **Neither is Better:** Prior to the choice, Option A is not morally superior to Option B, nor vice versa. Saving a unique sentient ecosystem is not "more good" than preserving the open future of a human agent. They are different *kinds* of good that cannot be traded off without remainder.

  **The Normative Claim**
  Nevertheless, Elara **should** choose **Option B (The Seed Protocol)**.

  ### What Does the Normative Work?

  If neither option is better, and there is no supervalue (like "Maximize Life") that commensurates them, why is there a "should"? The normative work is done not by a ranking of outcomes, but by the **constitutive conditions of agency**.

  **1. The Non-Arbitrariness of the Will**
  A choice is arbitrary if there is no reason to pick A over B. Here, there is a reason, but it is not a *comparative* reason (A > B). It is a **structural** reason.
  Option A requires Elara to cease being an agent in the full sense. By grafting herself, she eliminates the capacity for future choice. She transforms from a *chooser* into a *feature of the landscape*.
  Option B preserves the capacity for future choice.
  The "should" arises from the fact that **normativity presupposes a subject to whom norms apply.** To choose Option A is to will the end of the very will that is doing the choosing. It is a performative contradiction. Elara *should* choose B not because B is "better," but because B is the only option that allows the "should" to continue to exist. The normativity is the **self-preservation of the standpoint of valuation**.

  **2. Why This Is Not Mere Ranking**
  One might object: "If preserving agency is the reason, isn't Agency a supervalue that makes B better?"
  No. A supervalue weighs against other values (e.g., "Agency is worth more than Trees"). That is not what is happening here.
  *   **Ranking** says: "The value of your future choices outweighs the value of the trees."
  *   **Constitutive Normativity** says: "You cannot coherently value the trees *more than your capacity to value* from the standpoint of a valuer."
  The force is not that Agency is a *greater good*, but that Agency is the *precondition of good*. It is analogous to the rules of logic: you don't weigh "Logic" against "Conclusion"; you recognize that without Logic, there is no valid Conclusion. Elara should choose B because choosing A dissolves the subject who could ever recognize the choice as meaningful.

  **3. Distinguishing from Mere Difficulty**
  A **difficult choice** occurs when the agent knows (or believes) one option is better, but the cost of obtaining it is high (e.g., "I should diet, but I love cake"). The tension is between *judgment* and *desire*.
  A **hard choice** (in this incommensurable sense) occurs when reason runs out. The tension is between *incompatible frameworks of value*.
  *   In Elara's case, it is not difficult because she is reluctant to lose the trees. It is hard because there is no fact of the matter about which outcome is superior.
  *   If it were merely difficult, she could say, "The Trees are more important, but I am weak."
  *   Because it is incommensurable, she must say, "Neither is more important, but I must become the kind of person for whom one is right."
  *   The "Should" does not resolve the tension by proving one side won. It resolves the tension by **creating a reason where none existed**. By choosing B, she commits to a future where human potential is the metric. By choosing A, she commits to a future where ecological stasis is the metric. She *should* choose B because only B allows her to remain the author of that commitment.

  ### Summary of the One-Way Door
  The "One-Way Door" constraint is crucial. If Elara could graft and un-graft, the choice would be a calculation of costs. But because grafting changes *what she can want*, the unchosen option (The Root) becomes not just unavailable, but *unimaginable* to her future self.
  *   If she chooses **Root**, she becomes a being who cannot want Seeds.
  *   If she chooses **Seed**, she becomes a being who can still *conceptually* value Roots, even if she can't have them.
  Option B preserves the *capacity* to regret the loss. Option A eliminates the capacity to regret. The normative force is that **a choice that eliminates the capacity for regret is a choice that eliminates the self.** Thus, she should choose the path that keeps the self intact, not because the self is "better" than the forest, but because the self is the necessary vessel for any "betterness" to exist at all.
