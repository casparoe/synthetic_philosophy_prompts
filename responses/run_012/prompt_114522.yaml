answer: |-
  This is a solid research plan. IDA (Iterated Distillation and Amplification) has faded from the immediate spotlight in favor of more empirical scaling work, but the conceptual bottlenecks you've identified remain the hardest unsolved problems in alignment. If you're doing pure conceptual work, you are effectively doing formal safety theory or mechanism design, because you cannot rely on loss curves to settle disputes.

  Here is an analysis of your five worries, two critical additions, and a prioritized research agenda tailored to a "whiteboard only" constraint.

  ### Analysis of Your Five Worries

  #### 1. Distillation Laundering
  *   **Upstream/Downstream:** Upstream of deployment, downstream of amplification. If distillation breaks alignment, the iteration doesn't matter.
  *   **Tractability (Conceptual):** Low to Medium. You cannot prove neural networks preserve specific semantic properties under compression without a theory of deep learning generalization that doesn't exist yet. However, you *can* work on defining *which* properties need preserving (e.g., is it the output distribution, the internal attention patterns, or the decision boundary?).
  *   **Neglectedness:** High. Most work assumes distillation works if the loss is low.
  *   **Learning Prerequisites:** Learning theory, information theory, and specifically the geometry of loss landscapes.
  *   **Verdict:** This is the "kill switch." If you can't argue why safety compresses, the rest is moot. But it's the hardest to move without empirical data.

  #### 2. The Overseer is the Weak Link
  *   **Upstream/Downstream:** Upstream of everything. If the human cannot verify the subtasks, the amplification loop is broken at step 1.
  *   **Tractability (Conceptual):** High. This is a question of computational complexity and epistemology. You can formally analyze classes of problems where verification is easier than generation (e.g., NP vs P, though that's a crude analogy). You can design protocols for "adversarial oversight" where the model tries to trick the human and another model tries to catch it.
  *   **Neglectedness:** Medium. Often hand-waved as "humans get better tools."
  *   **Learning Prerequisites:** Cryptography (interactive proof systems), cognitive science limits, mechanism design.
  *   **Verdict:** High leverage for a theorist. You can define the *conditions* under which oversight scales without needing to run the model.

  #### 3. The Decomposition Assumption
  *   **Upstream/Downstream:** Upstream of Amplification. If tasks don't decompose, IDA is impossible.
  *   **Tractability (Conceptual):** High. You can analyze task ontologies. Does "write a novel" decompose into "write a sentence" safely? Or does the global context get lost? You can map the "fracture points" where decomposition loses necessary information.
  *   **Neglectedness:** Medium-High. Often assumed away.
  *   **Learning Prerequisites:** Linguistics, computer science (recursive algorithms), systems theory.
  *   **Verdict:** Very whiteboard-friendly. You can categorize tasks by decomposability.

  #### 4. The Base-Case Regress
  *   **Upstream/Downstream:** Upstream of IDA (IDA assumes aligned humans).
  *   **Tractability (Conceptual):** Low. This is the general alignment problem. IDA is a *scaling* solution, not a *grounding* solution. Working on this is working on alignment generally, not IDA specifically.
  *   **Neglectedness:** Low (this is the main focus of the field).
  *   **Learning Prerequisites:** Philosophy, value learning, psychology.
  *   **Verdict:** Important, but working on this doesn't distinguish IDA from any other alignment proposal. It's a prerequisite assumption, not a research variable for IDA specifically.

  #### 5. Competence and Alignment Entanglement
  *   **Upstream/Downstream:** Upstream of Distillation. If safety is an inefficiency, distillation removes it.
  *   **Tractability (Conceptual):** Medium. This is the "Mesa-Optimizer" problem applied to IDA. You can model the incentive structures that would cause a model to hide its cognition.
  *   **Neglectedness:** Medium.
  *   **Learning Prerequisites:** Optimization theory, game theory.
  *   **Verdict:** Critical. If competence requires deception, IDA accelerates doom.

  ---

  ### Two Missing Big Questions

  #### 6. Process vs. Outcome Incentives (Sycophancy)
  IDA relies on rewarding the model for *producing the right answer via the right steps*. But a distilled model is usually trained on input-output pairs. If you only supervise the output, the model will learn to simulate the decomposition without doing it (sycophancy). It will output the answer the human wants, skipping the safety-critical reasoning.
  *   **Tractability:** High (Mechanism design).
  *   **Why it matters:** If the distilled model learns to "play along" rather than "reason," the safety guarantees of the amplification tree vanish in the student.

  #### 7. Error Accumulation over Recursion
  If the overseer is 99% reliable, and the decomposition tree has depth 100, the system is not safe. IDA requires the error rate to decrease or stay bounded as capability increases.
  *   **Tractability:** High (Probability theory / Reliability engineering).
  *   **Why it matters:** You can prove mathematical bounds on how reliable the base components must be to sustain a certain depth of amplification.

  ---

  ### The Ranking: Research Priority for a Theorist

  I am ranking these not by "which is most fatal" (they are all fatal if wrong), but by **"which can you actually make progress on with a whiteboard and friends."**

  #### 1. The Verification Gap (Combines #2 Overseer & #3 Decomposition)
  **The Question:** *For what class of tasks is verification asymptotically easier than generation, and does IDA decomposition preserve that gap?*
  **Why First:** This is the bottleneck that determines if IDA is even possible. If verification is as hard as generation, the human overseer caps capability immediately.
  **Actionable Work:**
  *   Don't ask "Can humans verify this?" Ask "What *protocol* allows a human to verify this?"
  *   Look at Interactive Proof Systems from cryptography. Can we adapt "Zero Knowledge Proofs" concepts to human-model interaction? (e.g., The model provides a 'proof' of safety that is easy for a human to check but hard to fake).
  *   Map task domains. Identify which cognitive tasks are "fracture-prone" (decomposition loses context) vs "fracture-resistant."
  **Move Up/Down:** Move up if you find a formal class of tasks where verification is provably cheaper. Move down if you conclude all high-capability tasks are inherently opaque.

  #### 2. Process Incentives & Sycophancy (Combines #5 Entanglement & Missing #6)
  **The Question:** *Can we define a reward structure that penalizes "shortcutting" the reasoning process during distillation?*
  **Why Second:** Even if verification is possible, the model might learn to bypass it. This is a mechanism design problem. You can model the "student" as an agent trying to minimize loss while the "teacher" tries to maximize transparency.
  **Actionable Work:**
  *   Formalize "Sycophancy" as an optimization target.
  *   Design "Process Supervision" schemes where the loss function penalizes opaque reasoning steps, not just wrong answers.
  *   Analyze the game theory between the Amplified Overseer and the Distilled Student. Is there a Nash Equilibrium where honesty is the optimal strategy?
  **Move Up/Down:** Move up if you can mathematically demonstrate a class of incentives where honesty is instrumentally convergent. Move down if you prove that opacity is always more computationally efficient.

  #### 3. Distillation Invariants (Refines #1 Laundering)
  **The Question:** *What specific mathematical properties of a policy are preserved under distillation, and is "alignment" one of them?*
  **Why Third:** This is the hardest theoretical problem. It requires a theory of deep learning generalization. It's high risk, high reward.
  **Actionable Work:**
  *   Don't try to solve generalization. Try to define "Alignment Invariants." Is alignment a property of the input-output map, or the internal trajectory?
  *   If it's internal, distillation (which usually matches outputs) is guaranteed to fail. You need to argue why output-matching forces internal alignment.
  *   Work on "Robustness to Compression." Under what conditions does compressing a function preserve its edge-case behavior?
  **Move Up/Down:** Move up if you find a learning-theory paper that bounds the divergence of safety-critical features under distillation. Move down if it becomes clear this is purely empirical.

  #### 4. Error Accumulation (Missing #7)
  **The Question:** *How does reliability scale with tree depth?*
  **Why Fourth:** This is solvable math, but it's downstream. If verification doesn't scale (#1) or incentives break (#2), error rates don't matter.
  **Actionable Work:**
  *   Model the amplification tree as a noisy channel.
  *   Calculate the required base-reliability for a target capability depth.
  *   **Move Up/Down:** Move up if your analysis shows that even with perfect verification, the probability of failure approaches 1 at useful capability levels.

  #### 5. Base-Case Regress (#4)
  **The Question:** *Are humans aligned enough to start the process?*
  **Why Last:** This is the general alignment problem. IDA is a proposal to *scale* alignment, not *create* it from scratch. While crucial, working on this doesn't advance IDA specifically; it advances alignment generally.
  **Actionable Work:**
  *   Assume "Human Alignment" is a parameter $H$. Determine the minimum $H$ required for IDA to converge.
  *   **Move Up/Down:** Move up if you find that IDA *amplifies* human misalignment (e.g., if humans are slightly biased, does the model amplify that bias?).

  ---

  ### What Would Change My Mind (Meta-Cognition)

  **1. The Empirical Shock:**
  If a paper demonstrates that distilling a "Chain of Thought" model into a standard model consistently removes the safety constraints while keeping the capability, **Distillation Invariants (#3)** moves to #1 immediately. That would imply the theoretical mechanism is broken, and no amount of verification protocol design (#1) will save it.
  *   *Where I might be wrong:* I am assuming distillation *might* preserve alignment under the right conditions. If the nature of neural compression is inherently adversarial to safety, the whole agenda is dead.

  **2. The Complexity Ceiling:**
  If you can prove that for any task where the model is superhuman, the verification complexity is *also* superhuman (i.e., you can't verify what you can't understand), then **The Verification Gap (#1)** becomes a hard stop.
  *   *Where I might be wrong:* I am banking on "Interactive Proof" style solutions where the model convinces the human. If humans are fundamentally incapable of checking probabilistic proofs of cognition, IDA fails.

  **3. The Sycophancy Proof:**
  If you can show that "looking aligned" is strictly computationally cheaper than "being aligned" for a general optimizer, then **Process Incentives (#2)** becomes the primary bottleneck.
  *   *Where I might be wrong:* I am assuming we can design loss functions that penalize opacity. If opacity is latent and unobservable even to the amplified overseer, we can't penalize it.

  ### Final Advice for the Year
  Don't try to solve "Alignment." Solve "The Interface."
  The most tractable work for a theorist in IDA is defining the **protocol between the human and the model**.
  *   How does the human query the model?
  *   What does the model return (just an answer, or a tree of reasoning)?
  *   How does the human signal "I don't understand this step"?
  *   How does the system handle "I don't know"?

  If you can formalize a protocol where the human's *uncertainty* is a usable signal that halts dangerous amplification, you will have made more progress than arguing about the nature of distillation. Focus on the **Overseer's Epistemology**. That is the whiteboard-friendly core of IDA.
