answer: |-
  You are conflating the logical status of a sentence with the psychological force of its utterance, and that is where your objection collapses. When I say that ethical or political statements are not truth-apt, I mean they do not assert facts about the world that can be verified by observation or logical derivation. They are expressions of volition, commands, or wishes. But do not mistake this for saying they are arbitrary whims like a preference for coffee over tea. When the nationalist claims that the State is a mystical organism demanding sacrifice, he is making a theoretical claim—a pseudo-statement, as I showed in my recent work on the elimination of metaphysics. He claims this is a *fact* of the universe. Here I can fight him fiercely and prove him wrong. I can show that his sentences violate logical syntax, that they refer to no possible experience, and that his theoretical justification is nonsense. I am not arguing against his will directly with facts; I am dismantling the illusion that his will is dictated by reality.

  As for my socialism and pacifism, I do not claim they are "true" in the way that the law of gravity is true. I claim they are the rational choices for men who wish to live in a society organized by scientific understanding rather than mythical confusion. We can argue about means—that is entirely within the realm of science. If you claim that fascism will produce prosperity or stability, I can show you empirical evidence that it leads to ruin. That is a theoretical dispute. But when we reach the ultimate volition—the decision that we *ought* to seek human welfare rather than tribal dominance—there is no further theoretical ground to stand on. I do not need to prove my volition is "true" to fight for it; I only need to be clear that it is a volition, and then use every theoretical tool available to show that your volitions rely on metaphysical errors and your means rely on empirical falsehoods. I am not silent; I am simply precise about where logic ends and life begins.
