answer: |-
  ### Part 1: The Principles at Stake

  Before we write a single rule, we need to understand the friction between your boss's vision (Otto Neurath's ISOTYPE method) and the reality of modern public health data. Neurath was a sociologist and philosopher, not a statistician. His goal in 1930s Vienna was *democratic education*: giving the working class a visual language to understand their social conditions without needing to learn math.

  Here are the four philosophical conflicts you are navigating:

  **1. Discrete Symbols vs. Continuous Reality**
  Neurath's rule ("one symbol = fixed quantity") works beautifully for countable nouns (1 icon = 1,000 workers). It breaks down for *rates* (vaccination %), *averages* (wait times), or *indices*. When you force continuous data into discrete icons, you introduce **quantization error**. If one icon equals 5 minutes, a wait time of 4 minutes and 6 minutes both become one icon. The visual difference vanishes, even if the operational difference is critical.

  **2. Legibility vs. Precision**
  ISOTYPE prioritizes immediate gestalt recognition ("more icons = more stuff"). Modern statistical graphics prioritize accurate estimation of magnitude. Research (Cleveland & McGill, 1984) shows humans judge position along a scale (bar charts) more accurately than they judge area or count clusters of icons. If your data requires distinguishing a 4% gap, counting icons is cognitively taxing and error-prone.

  **3. Certainty vs. Uncertainty**
  This is the biggest philosophical gap. An ISOTYPE symbol is definitive. It is either there or it isn't. Public health data is probabilistic. It has confidence intervals, margins of error, and modeling uncertainty. A "plain" icon suggests a fact is settled. Showing a error bar suggests the data is an estimate. Your boss wants "clarity," but in statistics, **clarity without uncertainty is often misinformation.**

  **4. The Myth of Neutrality**
  Your boss believes ISOTYPE is neutral because it removes "decoration." However, **simplification is an argument.** By choosing to round numbers to fit icons, you are arguing that the nuance doesn't matter. By choosing not to show error bars, you are arguing the finding is certain. In a funding context, "plain clarity" often serves the narrative that the solution is obvious, when the data might actually say, "We need more study."

  ***

  ### Part 2: The Decision Procedure

  Do not treat this as a ban on ISOTYPE. Treat it as a triage system. Print this for your designers.

  **Step 1: Identify the Data Type**
  *   **Question:** Is the underlying data a *whole number count* of discrete entities (e.g., number of clinics, number of staff) OR is it a *derived metric* (rate, average, percentage, ratio)?
  *   **Real Answer:** Look at the source column. Is it `SUM()` or `AVG()/COUNT()`?
  *   **Rule:**
      *   If **Count**: Proceed to Step 2 (ISOTYPE eligible).
      *   If **Derived Metric**: **STOP.** Do not use ISOTYPE symbols to represent the value directly. Use standard bars, lines, or maps. *Rationale: You cannot have 3.5 people.*

  **Step 2: Check the Delta (The "4% Rule")**
  *   **Question:** What is the percentage difference between the smallest and largest value to be compared?
  *   **Real Answer:** Calculate `(Max - Min) / Min`.
  *   **Rule:**
      *   If **> 50% difference**: ISOTYPE is safe. The visual accumulation will show the gap clearly.
      *   If **< 10% difference**: **STOP.** ISOTYPE will obscure the difference through rounding. Use a bar chart with a truncated axis or a slope graph.
      *   If **10-50%**: Human Review required (Step 4).

  **Step 3: Check for Uncertainty**
  *   **Question:** Does this chart support a policy decision or funding request where the margin of error could change the conclusion?
  *   **Real Answer:** Consult the epidemiologist/data lead. Ask: "Are these confidence intervals overlapping?"
  *   **Rule:**
      *   If **No/Uncertainty is negligible**: ISOTYPE is permissible (if Step 1 & 2 passed).
      *   If **Yes/Uncertainty is material**: **STOP.** You must show error bars or ranges. ISOTYPE cannot visually encode a confidence interval without breaking the "one symbol = one quantity" rule.

  **Step 4: The Human Hand-off**
  *   **Trigger:** If the procedure hits a **STOP**, or if the Delta is 10-50%.
  *   **Action:** The designer must flag the Chart Lead.
  *   **Required Discussion:** "We cannot use the house icon style here without losing [precision/uncertainty]. We propose using a standard bar chart but applying the house *color palette* and *typography* to maintain brand identity."
  *   **Boss's Argument Check:** If the boss insists on ISOTYPE here, document that the visual rounding hides the statistical significance.

  ***

  ### Part 3: Running the Procedure on Your Cases

  Here is how the procedure handles the two specific examples you provided.

  #### Case A: County-by-County Vaccination Map
  *   **Data:** Vaccination rates by county (Percentages, 0-100%).
  *   **Step 1 (Data Type):** Derived Metric (Rate).
  *   **Result:** **STOP.**
  *   **Analysis:** You cannot represent 64.3% vaccination with little people. If you use one person = 10%, you end up with 6 people and a half-person. Neurath forbade splitting symbols. If you round to whole people, 64% and 69% look identical (6 people).
  *   **Recommendation:** Do not use ISOTYPE symbols on the map. Use a choropleth (color intensity) or a dot-density map (where one dot = X people, which *is* ISOTYPE-compliant, but hard to read at county levels).
  *   **Verdict:** **Against Boss's Wish.** A map of rates requires color encoding, not symbol accumulation.

  #### Case B: Bar Chart of Average Clinic Wait Times (Funding Request)
  *   **Data:** Average wait times (Continuous minutes).
  *   **Context:** Arguing for funding based on a 4% gap between current staff levels and target performance.
  *   **Step 1 (Data Type):** Derived Metric (Average). **STOP.**
      *   *Wait, let's pretend we fudge this and treat minutes as countable units.*
  *   **Step 2 (Delta):** You noted the gap is 4%.
  *   **Result:** **STOP.** (Delta < 10%).
  *   **Analysis:** If one icon = 5 minutes, and the difference is 2 minutes (approx 4% of a 50 min wait), both bars get the same number of icons. The visual argument for funding disappears. The chart will look like "Status Quo" rather than "Crisis."
  *   **Step 3 (Uncertainty):** Funding decisions rely on statistical significance. Are the wait times significantly different? You need error bars. ISOTYPE cannot show error bars.
  *   **Verdict:** **Strongly Against Boss's Wish.**
  *   **What to tell him:** "If we use the icon method, the 4% difference rounds to zero visually. The chart will show the clinics are equal. We will fail to make the case for funding. We must use a bar chart to show the precise gap and the error margins."

  ***

  ### Part 4: What The Procedure Cannot Settle

  There are three things this flowchart cannot resolve, and you need to be prepared for them in the meeting with your boss.

  **1. The "Brand" vs. "Truth" Conflict**
  The procedure protects statistical integrity, but it doesn't solve the emotional desire for a "look." Your boss wants the nonprofit to *look* accessible and grassroots (Neurath's vibe). A standard bar chart with error bars looks "academic" or "bureaucratic."
  *   *Unsettled:* How do we make a statistically rigorous bar chart *feel* warm and accessible?
  *   *Solution:* Compromise on style, not structure. Use the ISOTYPE color palette, fonts, and flat design, but keep the geometric bars.

  **2. The Aggregation Ethics**
  Neurath's method assumes the unit of analysis is obvious. It isn't.
  *   *Unsettled:* Do we show wait times per *clinic* or per *patient*? Do we show vaccination rates per *county* or per *capita*?
  *   *Risk:* ISOTYPE makes the chosen aggregation look like the *only* truth. A procedure can't tell you which political framing is right, only that the visual must match the math.

  **3. Resource Reality**
  ISOTYPE is labor-intensive. Drawing 500 little figures for a national report takes time. Generating 500 bar charts takes seconds.
  *   *Unsettled:* If the procedure says "ISOTYPE allowed," do you actually have the budget hours to build it?
  *   *Risk:* Designers might cheat (stretching symbols) to save time, violating the very rule your boss cares about.

  ### Summary Recommendation
  Tell your boss: **"Neurath's method is perfect for showing *scale* (how many people we served), but dangerous for showing *change* (wait times) or *rates* (vaccination). If we use it for the wrong data, we aren't being clear; we're being inaccurate. Let's use ISOTYPE for our 'Impact' section (counts of people), and standard statistical graphics for our 'Analysis' section (rates and averages)."**

  This honors his philosophical commitment without sacrificing your department's statistical credibility.
