prompt: |-
  I run the graphics desk at a mid-size public health nonprofit, and my boss just asked me to write our house style guide for charts and infographics. He keeps bringing up Otto Neurath's picture language — the Vienna method, all those repeated little stick figures — and wants us to adopt its rules across the board: one symbol always stands for the same fixed quantity, you add more symbols rather than stretching one, no perspective, no decoration, and the whole thing should be readable by someone with zero training. Trouble is our data won't cooperate. Half our numbers are rates, some are averages, some pairs sit so close together that a 4% gap vanishes once you're counting whole little people, and we're often plotting uncertainty. Can you act as a data-viz person who also knows the history and philosophy of statistics, think carefully, and brainstorm the principles actually at stake before you write anything? Then give me a seperate decision procedure my designers can run on any chart: the questions to ask in order, what counts as a real answer to each, which Neurath-style rule applies when, where the procedure has to hand the call back to a human, and where his insistence on plain clarity is quietly making an argument rather than being neutral. Run it on two of our actual cases — a county-by-county vaccination map, and a bar chart of average clinic wait times we want to use to argue for more funding — and if one of those comes out against what my boss wants, say so out loud. Finally, tell me what the procedure just can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Data visualization expert with knowledge of statistics history and philosophy.
      *   **Task:**
          1.  Brainstorm the underlying principles at stake (Neurath vs. Modern Stats).
          2.  Create a decision procedure (flowchart-like logic) for designers.
          3.  Apply the procedure to two specific cases (County Vaccination Map, Clinic Wait Times Bar Chart).
          4.  Be honest if a case argues *against* the boss's Neurath insistence.
          5.  Identify what the procedure *cannot* settle.
      *   **Context:** Mid-size public health nonprofit. Boss wants strict ISOTYPE (International System of TYpographic Picture Education) adherence. Data is messy (rates, averages, small differences, uncertainty).
      *   **Tone:** Professional, thoughtful, critical, practical, slightly diplomatic but firm on statistical integrity.

  2.  **Deconstruct the Conflict (Neurath/ISOTYPE vs. Modern Statistical Graphics):**
      *   *Neurath/ISOTYPE Philosophy:* Universal readability, democratic access to knowledge, symbols represent fixed quantities (isotype), accumulation of symbols (not scaling), no perspective (flat), no decoration. Goal: *Narrative clarity for the untrained.*
      *   *Modern Stats/Data Viz:* Precision, representation of uncertainty, handling continuous data, efficiency of space, encoding multivariate data. Goal: *Accurate inference and pattern recognition.*
      *   *The Friction:* ISOTYPE is discrete (counting symbols). Public health data is often continuous (rates, means). ISOTYPE hides uncertainty (a symbol is either there or not). Public health needs to show confidence intervals. ISOTYPE is bulky (needs space for many symbols). Reports often need density.
      *   *The "Neutrality" Trap:* Neurath claimed his method was neutral/universal. But choosing *what* to count and *how* to group it is inherently political. Insisting on "simple" visuals can obscure complexity necessary for decision-making (e.g., funding allocation).

  3.  **Drafting Section 1: Principles at Stake:**
      *   Need to acknowledge the boss's good intent (accessibility) but highlight the statistical risks.
      *   *Key Tension 1: Discrete vs. Continuous.* ISOTYPE loves integers. Rates/averages are fractions.
      *   *Key Tension 2: Precision vs. Legibility.* Counting 100 little people is hard. Reading a bar length is easier.
      *   *Key Tension 3: Certainty vs. Uncertainty.* ISOTYPE looks definitive. Public health is probabilistic.
      *   *Key Tension 4: Rhetoric.* "Plain clarity" is an argument. It suggests the solution is obvious. Sometimes the data says "it's complicated."

  4.  **Drafting Section 2: The Decision Procedure:**
      *   Needs to be a step-by-step checklist.
      *   *Step 1: Data Type.* Is it counts or rates?
      *   *Step 2: Magnitude & Delta.* Are differences small?
      *   *Step 3: Uncertainty.* Do we need to show error bars/confidence?
      *   *Step 4: Audience Action.* What do they need to *do*?
      *   *Decision Nodes:* If X, use ISOTYPE. If Y, use Standard Charts. If Z, Human Review.
      *   *The "Hand-off":* When the visual choice changes the policy implication.

  5.  **Drafting Section 3: Applying to Cases:**
      *   *Case 1: County-by-County Vaccination Map.*
          *   Data: Rates (0-100%).
          *   ISOTYPE fit: Poor. You can't put 87 little people in a county. Choropleth is standard.
          *   Verdict: Don't use ISOTYPE symbols for rates. Use color intensity (with caveats) or dot density.
      *   *Case 2: Average Clinic Wait Times (Funding Argument).*
          *   Data: Averages (continuous), likely small differences (e.g., 24 mins vs 26 mins).
          *   Goal: Argue for funding.
          *   ISOTYPE fit: Dangerous. Rounding 24.5 to 25 icons might hide the trend. If the difference is 4%, ISOTYPE might make them look identical (10 icons vs 10 icons).
          *   Verdict: **Against Boss.** Bar chart with error bars is better. ISOTYPE oversimplifies the need.

  6.  **Drafting Section 4: What Cannot Be Settled:**
      *   Ethical choices.
      *   Resource constraints (time to make ISOTYPE vs. auto-chart).
      *   The "Truth" of the aggregation (which average?).
      *   Aesthetic buy-in from stakeholders.

  7.  **Review and Refine:**
      *   *Check Tone:* Am I being too academic? Need to keep it practical for a graphics desk.
      *   *Check Constraints:* Did I answer the specific prompt about "where his insistence... is quietly making an argument"? Yes, need to emphasize that in the principles section.
      *   *Check the "No" moment:* Ensure I explicitly state when the procedure rejects the boss's preference.
      *   *Historical Accuracy:* Neurath's ISOTYPE was about *social* facts (housing, workers), often counts. Applying it to *rates* is a category error he himself might have flagged, though his followers sometimes stretched it.

  8.  **Final Polish:** Organize with clear headings. Ensure the decision procedure looks actionable. (Self-Correction: Make sure the decision procedure isn't just "don't do it," but "here is when you can.")

