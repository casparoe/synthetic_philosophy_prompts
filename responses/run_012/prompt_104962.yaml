answer: |-
  The river below was dark and moving fast, a black ribbon cutting through the valley lights. On the terrace, the air was cooling, but neither of them had reached for their jackets. Ines held her glass by the stem, watching the condensation slide down. Voss was leaning against the railing, looking at her, not the view.

  "You're treating the future like a number line," Voss said. "It isn't. It's a set. And once you admit it might be an infinite set, the arithmetic you're using to justify your foundation's budget evaporates."

  "I'm not summing," Ines said. "I told you on the phone. I'm not trying to calculate the total. I'm trying to compare trajectories."

  "Trajectories imply a coordinate system. Who chose the axes?" Voss tapped his finger against the stone railing. "Let's say you have two futures. In Future A, humanity survives forever, flourishing at a steady state. Infinite value. In Future B, humanity survives forever, flourishing at that same steady state, but everyone is one percent happier. Also infinite value. By your logic, B is better. But mathematically, infinity plus infinity is just infinity. You can't subtract one from the other and get a positive remainder. The difference is undefined."

  Ines set her glass on the table. "Standard summation fails. I agree. I've agreed since graduate school. But that doesn't mean comparison fails. Think about it like a race. If Runner A is ahead of Runner B at every single checkpoint, no matter how far down the track you go, then A is winning. You don't need to know where the finish line is to know who's in the lead."

  "A race has a direction," Voss said. "And checkpoints. You're assuming time slices are comparable. But what if the lead changes hands? What if Future A is better for the first million years, and Future B is better for the next million, and they swap back and forth forever? The limit doesn't converge. Your 'checkpoint' rule gives you no answer."

  "Then it's a tie," Ines said. "Or rather, it's incomparable. But that's rare. Most of the choices we face aren't oscillating infinities. They're dominated options. If I can choose a path that is better in every finite window and never worse in any other, I have to take it. To refuse is to say that a million years of extra suffering doesn't matter because there's always more time coming."

  "It's not about suffering, Ines. It's about the wash." Voss turned fully toward her now. "Suppose Future A has a billion happy lives right now, and then nothing. Future B has nothing now, but infinite happy lives starting tomorrow. Your 'finite window' rule says A is better early on, B is better later. But because B is infinite, the early billion gets washed out. It becomes a rounding error on a scale that doesn't exist. So your rule contradicts itself. Is the head start valuable, or is it noise?"

  "The head start is real to the people living it," Ines said. "That's the point. Your math dissolves the present because it's obsessed with the limit. I'm telling you the limit is the wrong tool. Use dominance. If I can secure a future where every generation is at least as well off as the alternative, and some are strictly better, I have a moral obligation to do that. Even if both totals are infinite."

  "Who defines the generations?" Voss pushed off the railing. "That's the ordering problem. You're slicing spacetime the way it suits your argument. If I slice it differently—by spatial regions instead of time periods—I can make Future B look dominant instead. You're smuggling in a bias about how to count. You want the count to favor the work you're doing."

  Ines picked up her glass again, her grip tight. "And you're smuggling in a bias toward paralysis. Let's talk about the money, Voss. The endowment. You know what the choice is."

  "I know. Spend it on malaria nets, save ten thousand lives now. Finite good. Or invest it in containment research, which has a low probability of success but, if it works, secures the next ten million years. Infinite potential."

  "If I follow your logic," Ines said, "the ten thousand lives are zero. They are literally zero compared to the infinite set. So I must invest in containment. But if containment fails, which is likely, I get zero *and* the ten thousand die. Your 'undefined arithmetic' forces me to gamble with certainties for the sake of a variable that might not even exist."

  "It's not my arithmetic," Voss said quietly. "It's the structure of the problem. If the payoff is truly infinite, any non-zero probability dominates a finite payoff. That's not me talking. That's expected utility."

  "That's Pascal's Wager," Ines snapped. "And it's brittle. Because I can construct another infinite future where we don't invest in containment but instead focus on reproduction. More people, same duration. That's also infinite. Now I have two infinite futures competing. By your logic, I can't choose between them. By my logic, I look at the quality of life in the finite windows. Containment might secure existence, but if it creates a stagnant surveillance state to ensure safety, it loses on the 'every window' test against a riskier but freer path."

  "So you admit the infinite future doesn't dictate the choice," Voss said. "You're actually making the decision based on the finite qualities. The quality of the windows. So why invoke the infinity at all? Why tell your donors you're saving the *forever*?"

  "Because the stakes *are* the forever," Ines said. "Even if I can't sum it, the magnitude changes the texture of the decision. If I drop this glass, it breaks. If I drop a bomb, a city breaks. The physics of the break is the same, but the moral weight isn't. Acknowledging the potential infinity forces me to be more rigorous about the finite windows. It forces me to ask: am I sacrificing a thousand good windows for the *chance* at an infinite run?"

  Voss was silent for a moment. The river roared softly below. "Here is where your rule breaks," he said finally. "You said 'better in every window and never worse.' But what if the cost is paid upfront? To secure the infinite future, I must make the first window worse. I must restrict freedom now to ensure survival later. Your dominance rule forbids it. You can't have a future that is worse in the first window but better in all subsequent ones. That's not dominance. That's investment. And in infinite arithmetic, investment costs are erased."

  "Investment costs aren't erased to the people paying them," Ines said. "If I sacrifice the first window, the people in that window are the fuel. You're saying their suffering is mathematically negligible because it's finite. I'm saying that if your math tells you that, your math is morally blind."

  "And if your math tells you to gamble the existence of everything on a heuristic that doesn't converge?" Voss countered. "You say my skepticism proves too much. Fine. Let's turn it. You say I can't make decisions about my own life if I doubt the infinite future. But I do make decisions. I buy insurance. I plant trees. I do all of that based on finite horizons. I don't need the concept of 'forever' to know that drowning is bad. I only need to know that drowning ends the finite windows. Your longtermism requires the infinity to function. My skepticism works perfectly well without it."

  "It works well for *you*," Ines said. "You're a mathematician. You live in abstractions. I'm managing a trust. I have to sign the check. And when I hesitate, when I let the 'undefined' nature of the future stop me from acting on the finite good, I am making a choice. Refusal to rank is a ranking. It ranks the status quo above the intervention. It ranks the certain death of the ten thousand above the uncertain survival of the billions. You call that humility. I call it a decision to let them die."

  Voss looked down at his hands. He rubbed his thumb over his knuckle, a habit from their thesis days. "I'm not saying let them die. I'm saying don't lie about why you're saving them. If you save them because it's good in this window, say that. Don't tell yourself it's because you're banking credits in an infinite account that might not clear."

  "Because if I say that, the money dries up," Ines said. "People don't give to save a thousand. They give to save the *idea* of humanity. If I strip away the infinity, I lose the leverage to do the finite good."

  "Then the leverage is the lie," Voss said.

  "Or the map isn't the territory," Ines replied. "Look, Voss. You think the infinite future makes comparison impossible. I think it makes comparison necessary, even if the tools are blunt. But here is my question for you. You say the arithmetic breaks. But you live your life as if the future is real. You're writing a paper on prime distribution. It won't be finished for years. You're investing effort now for a result later. If the future were truly arbitrary, if the 'ordering' was as fragile as you say, why do you care if your proof is elegant? In a billion years, no one will read it. In an infinite timeline, your proof is a speck. Why does *your* work matter if the infinite washes out value?"

  Voss smiled, a thin, tired expression. "Because the proof is true now. It doesn't depend on the future to validate it. It stands in the window we occupy. Your project depends on the future being there to receive the benefit. Mine is done when I write the last line. Yours is only done when time stops. And since time might not stop, your project is never done. You are building a cathedral on a fault line and calling it a fortress."

  "And you are sitting in a bunker checking the locks while the house burns," Ines said.

  "Maybe," Voss said. He picked up his glass. "But at least I know the locks work."

  "They don't," Ines said. "Not against the fire."

  They stood there, the space between them charged with the unsolved equation. The river rushed on, indifferent to whether it was measured in liters or moments. Voss looked out at the dark water.

  "Show me the dominance," he said softly. "Show me a path that is better in every window without costing the first one. If you can find that, I'll sign the check. Not for the infinity. But for the windows."

  Ines looked at him, then out at the river. "I'm looking," she said. "But I'm not sure I can promise the first window stays dry."

  "Then don't ask me to help you flood it," Voss said.

  He didn't drink. She didn't either. The argument hung between them, sharper than before, a structure built of air and conviction, holding its shape against the wind.
