answer: |-
  This is a sophisticated version of the "Master Argument" (originally from Diodorus Cronus, refined by Ockham and modern logicians). Your friend has tightened the screws on the standard "future contingents" escape route, and he's right to press you on it. However, his counter-argument against denying step (2) relies on a subtle confusion about tense and truth that you can exploit.

  Here is the breakdown of where the argument breaks, why it looks solid, and what it costs you to fix it.

  ### 1. The Friend's Trap: Is denying (2) too costly?

  Your friend argues that if you deny (2) (i.e., you say "It is neither true nor false tonight that they will convict"), you create a "retroactive truth" problem. He claims that if they convict tomorrow, it *becomes* true tonight that they would convict, meaning the past (tonight's truth status) changes based on the future.

  **He is wrong about this cost.** Here is why.

  The confusion lies in mixing up two different propositions:
  *   **Proposition A:** "The jury convicts tomorrow." (Future contingent)
  *   **Proposition B:** "It was true yesterday that the jury would convict." (Past fact about truth)

  If you deny (2), you are saying Proposition A has no truth value *tonight*.
  When tomorrow arrives and they convict, Proposition A is no longer the relevant claim. The relevant claim becomes "The jury convicted."
  Does Proposition B become true? **No.**

  If you hold the view that future contingents lack truth values, then tomorrow, looking back, you do **not** say: *"Ah, it was true yesterday that they would convict."*
  You say: *"It was indeterminate yesterday that they would convict, but now it is settled that they have convicted."*

  The "fact about tonight" that gets created tomorrow is simply *"The conviction occurred."* The truth-status of tonight's prediction does not change from "indeterminate" to "true"; it remains "indeterminate relative to that time." Your friend is assuming that truth is a timeless property that must be retroactively assigned. If you treat truth as *tensed* (a statement is true *at a time*), the past remains fixed. The past fact is *"It was open yesterday."* That fact doesn't change.

  **Verdict:** You *can* deny (2) without breaking the fixity of the past, provided you adopt a "tensed" theory of truth.
  **The Cost:** You have to accept that the Law of Excluded Middle (1) and Bivalence (2) come apart. (1) says "P or not-P" is valid; (2) says "One of them is True." You keep (1) but reject (2). This requires a non-classical logic (like supervaluationism or Aristotelian 3-valued logic), which is philosophically respectable but technically fussy.

  ### 2. The Logical Pivot: Step (5)

  If you don't want to mess with logic or truth values, the strongest move is to attack **Step (5)**.

  > (5) And whatever makes it true also fixes it. If the grounds are already in place, the conviction is already settled, not still open.

  **Why it looks fine:** We intuitively conflate *logical certainty* with *causal necessity*. If it is *true* that I will drink coffee, it feels like I *must* drink coffee.
  **The Error:** This is the **Modal Fallacy**. It confuses "Necessity of the Consequent" with "Necessity of the Consequence."
  *   *Necessity of the Consequence:* Necessarily (If it is true that P, then P). This is valid.
  *   *Necessity of the Consequent:* If it is true that P, then Necessarily (P). This is invalid.

  Just because a statement is *true* now doesn't mean the event is *causally fixed* now. Truth is a description of reality, not a constraint on it.
  *   **Example:** It is true now that I will freely choose to scratch my nose in five minutes. That truth depends on my future choice. The truth doesn't force my hand; my hand makes the truth.
  *   **Application to the Jury:** The "truth-maker" for the verdict isn't a chain of causal dominoes falling tonight; it's the jury's free decision tomorrow. The truth exists *because* the decision will be made, not the other way around.

  **Verdict:** Denying (5) blocks the slide from "True" to "Settled/Fixed."
  **The Cost:** You must accept that some truths are "soft facts." They are true, but they don't carry causal power. You have to explain *what* makes them true tonight if the event hasn't happened (which leads you back to Step 3).

  ### 3. The Metaphysical Pivot: Step (3)

  > (3) For a claim to be true, something has to make it true, and you can't be made true by something that doesn't exist yet... the only world there is right now is tonight's world.

  This step assumes **Presentism** (only the present exists) combined with a **Correspondence Theory of Truth** (truth requires an existing object to correspond to).

  **Why it looks fine:** It matches our lived experience. The future *feels* like it doesn't exist yet.
  **The Error:** If you are willing to be an **Eternalist** (Block Universe theorist), step (3) is false. In Eternalism, past, present, and future all exist equally in the 4-dimensional block. The "truth-maker" for the verdict *does* exist tonight—it's just located at a different temporal coordinate (tomorrow).
  **Application:** The verdict is "fixed" in the sense that it exists in the block, but it is not "determined" by prior causes. It is just *there*. Your deliberation is also *there* in the block, causing the verdict.

  **Verdict:** Denying (3) saves truth and logic without denying free will (compatibilism), but it requires a heavy metaphysical commitment.
  **The Cost:** You lose Presentism. You have to accept that the future is just as "real" as the past. Many physicists accept this (due to Relativity), but it feels counter-intuitive to human agency.

  ### Recommendation: Which step to give up?

  Since you want to keep (1) and reject (8), and you are wary of the "retroactive truth" cost, here is your best path:

  **Primary Move: Deny Step (5).**
  *   **Why:** It requires the least metaphysical baggage. You don't have to abandon Presentism (Step 3) or mess with Truth Values (Step 2). You simply insist that **Truth $\neq$ Causal Fixity.**
  *   **Argument to Friend:** "You are conflating the *accuracy* of a prediction with the *constraint* on the agent. A map can be accurate without forcing the traveler to walk the path. The truth of the verdict is a *result* of the deliberation, not a *cause* of it. Step 5 assumes truth flows from Past $\to$ Future, but for free actions, truth flows from Future $\to$ Past (in terms of grounding)."
  *   **Cost:** You have to defend the idea of "contingent truths"—things that are true but could have been otherwise.

  **Secondary Move (If he presses you on Truth-Makers): Deny Step (2) but refute his objection.**
  *   **Why:** If he insists that a true statement *must* imply fixity, you must deny the statement is true yet.
  *   **Argument to Friend:** "You claim denying (2) makes the past changeable. It doesn't. It just means the past contained *openness*. When the future arrives, we don't say 'It was true then'; we say 'It is now settled.' The property of 'being true' is indexical to time. No retroactive magic is required."
  *   **Cost:** You have to defend a 3-valued logic or a tensed theory of truth, which he will call "cheating." (It isn't, but it is technical).

  ### Summary Table

  | Step | What it says | If you Deny it... | The Cost to You |
  | :--- | :--- | :--- | :--- |
  | **(2)** | Future claims are True/False now. | **Future Contingents are Indeterminate.** | You must explain why LEM (1) holds but Bivalence (2) fails. You must refute his "retroactive truth" worry (see above). |
  | **(3)** | Truth-makers must exist *now*. | **Eternalism / Block Universe.** | You accept the future "exists" just like the past. Physics-friendly, but intuition-hostile. |
  | **(5)** | Truth implies Causal Fixity. | **Truth $\neq$ Necessity.** | **Best Option.** You accept "contingent truths." You must explain how truth "waits" for the event without causing it. |

  **Final Advice:**
  Stick with denying **(5)**. It is the most direct route to saving agency. Tell your friend: *"Step 5 is the leap. You assume that because a proposition is true, the world is forced to match it. But for free actions, the world forces the proposition to match it. The truth is a shadow cast by the future event, not a cage built by the past."*

  If he presses the "what makes it true tonight?" question (Step 3), tell him: *"Nothing makes it true tonight. That's why I'm also willing to deny (2) if pushed. But I don't need to. I just deny that 'true' means 'fixed'."*
