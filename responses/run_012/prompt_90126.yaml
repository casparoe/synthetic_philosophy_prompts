          2.  Finite minds can hold infinite reasons via generative rules (like knowing the rule for pi).
          3.  Counter to "rule needs justification": The rule is procedural, not propositional, or the justification for the rule is itself part of the infinite chain (coherentist adjacency but distinct). *Correction:* The prompt asks for a specific counter to "rule needs justification." The best infinitist move here is that the *availability* of the reason is what matters, not the possession of the rule as a justified belief. Or, that the rule is justified by its own success in generating reasons ad infinitum. Let's go with: The rule isn't a premise; it's a capacity. Justifying the capacity leads to another chain, which is fine.
