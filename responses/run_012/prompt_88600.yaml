  **A:** Sure, "clay" is a mass noun. But "a lump" is a count noun. We're talking about *this* lump.

  **B:** Exactly. You're smuggling in a counter. "A lump of clay" functions like "a cup of water." The "cup" gives you the countability, not the water. When you say "the lump," you're pretending the clay has built-in boundaries that make it an object distinct from the bust. But the only boundary the clay has is the shape of the bust. If the shape is the only thing individuating the "lump," then when the shape goes, the "lump" goes. You can't have it both ways. You can't say the lump survives the squashing if the lump was never anything more than "the clay currently shaped like a bust."

  **A:** That's a hit, I'll grant you. If "the lump" just means "the bust-shaped clay," then squashing destroys the lump too. But that's not what I mean. I mean a specific *quantity* of matter. Spatiotemporal boundaries, not just formal ones. Think of a puddle.

