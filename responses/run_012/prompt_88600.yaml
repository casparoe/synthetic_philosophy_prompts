  **B:** See? You're relying on causal chains. I'm relying on matter. In the ice case, the matter is continuous. The causal chain of the *matter* is unbroken. The causal chain of the *artist* is broken. You're prioritizing the artist's chain. I'm prioritizing the matter's chain. Neither is "wrong," but yours requires two overlapping objects to explain why we care about the artist's chain. I just say the artist's chain is a property of the matter's history.

  **A:** Here's where I push back. If there's only the water, then when the water is in the puddle stage, what is it?

