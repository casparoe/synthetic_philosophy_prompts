  **Setting:** *A university seminar room, late afternoon. Dust motes dance in the light hitting a small pedestal in the center. On the pedestal sits a simple clay bust. Two graduate students, A and B, stand before it.*

  **A:** Look at it. Really look at it. You see the bust, and you see the clay. They're right there on top of each other.

