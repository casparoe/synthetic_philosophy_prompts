  **A:** It's doing work because it anchors the modal properties. The water could have been diverted down a drain. If it had been, the Sculpture would still be dead, but the *constituting matter* would be gone. I need to be able to refer to the matter as an object that *could* have gone elsewhere, distinct from the sculpture that *could not* have gone elsewhere.

