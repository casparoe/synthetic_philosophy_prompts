prompt: |-
  I'm writing a piece on hard choices -- the ones where you can't say one option is better but you also can't say they're equally good -- and I need you to build me a single case to order, not summarize what other people have said about the topic.

  Spec: one ordinary person, two options genuinely open to them, realistic (no lifeboats, no terminal diagnoses, no sci-fi), one paragraph. Engineer it so the verdict falls out of the structure instead of me stipulating it: neither option better than the other, neither worse, and not equally good either -- and that last one forced by a small-improvement move, where you take option A, improve it slightly in a way that plainly makes it better than plain A, and show the improved A still isn't better than B. No uncertainty about how the options turn out, and not a case where the incomparability comes from not knowing what you'd want later. The constraint I care about most: the two options should be rival ways of doing the same thing -- same value, same project -- rather than apples and oranges, so nobody can dissolve the case by saying different values, no common scale.

  Then walk through what each of these says about the case and why: a straight incomparabilist; someone who thinks the options are on a par in a fourth way, comparable but neither better nor equal, so the choice isn't arbitrary; someone who insists they're just equally good and the chooser is confused; and a hard-liner who thinks there's always a vague fact of the matter. Finish with which feature is doing the work, what happens if I take it out -- sweetener big enough, or the two options belonging to two different values -- and how the three who come out badly would attack the case. American English please, and dont bother with citations.
