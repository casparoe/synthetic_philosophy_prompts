answer: |-
  Elena must choose between two week-long residencies to record the exact same album, knowing precisely how each will turn out. Option A offers a mountain studio with perfect acoustic isolation but requires shipping tapes for mastering. Option B offers a city studio with slight ambient noise but includes immediate access to superior mastering gear. The pay is identical. If we add a modest cash bonus to Option A to create A+, any musician would agree A+ is better than A. However, that bonus is too trivial to outweigh the mastering advantage inherent to Option B, meaning A+ is not better than B, even though the mastering advantage alone was not enough to make B better than the original A.

  A straight incomparabilist looks at this setup and denies that any comparative relation holds at all. They argue that acoustic isolation and mastering gear are distinct values contributing to different kinds of excellence, so there is no common scale on which to place A and B; the appearance of a single project is an illusion masking two different kinds of achievement. The parity advocate, by contrast, accepts that both options aim at the same value of overall recording quality but insists the trichotomy of better, worse, or equal is incomplete. For them, the small-improvement structure proves A and B are comparable but related by a fourth way: they are on a par, which explains why A+ beats A without tipping the scale against B. The equal goodness advocate rejects the parity conclusion and insists A and B are simply equally good. They must argue that the intuition regarding A+ is mistaken; if A and B are truly equal, then any improvement to A must make A+ better than B, and if it doesn't, A and B were never equal to begin with. Finally, the hard-liner claims there is always a precise fact of the matter, even if inaccessible. They maintain that either A is marginally better than B or vice versa, and the small-improvement argument fails because it relies on epistemic vagueness rather than ontological indeterminacy; the bonus actually does make A+ better than B, we just cannot perceive the threshold.

  The feature doing the work here is the marginal sweetener—the cash bonus—which is significant enough to improve A but insufficient to trump B's distinctive advantage. If you remove this constraint by making the sweetener large enough, A+ becomes strictly better than B, collapsing the case into standard betterness. If you remove the constraint that the options serve the same value, the incomparabilist wins, as the options become apples and oranges with no common measure. The three views that come out badly attack the case by targeting these constraints: the equal goodness advocate denies the intuition that the sweetener fails to tip the scale, the hard-liner denies that the failure to tip the scale implies no fact exists, and the incomparabilist denies that the two studios are pursuing a single, unified value.
