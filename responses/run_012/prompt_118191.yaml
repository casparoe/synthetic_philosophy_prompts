  1. The Vinaya mandates expulsion for acts like killing regardless of benevolent outcomes, which counts against consequentialism if one assumes monastic rules reflect universal ethics, a cost sympathetic scholars concede is genuine unless the code is dismissed as merely institutional.
  2. Because karma hinges on intention (cetana) rather than actual outcomes, a failed murder generates bad karma, contradicting the consequentialist assumption that moral worth tracks state-of-affairs changes unless one retreats to a thinner claim about expected utility.
  3. Damien Keown argues virtues are constitutive of the good life rather than instrumental, a virtue-ethical reading sympathetic scholars favor if one assumes intrinsic value in character states, contradicting the consequentialist prediction that precepts are discardable heuristics.
  4. The Theravada Arhat ideal prioritizes personal liberation over universal welfare maximization, a tension consequentialists absorb by redefining welfare as nirvanic cessation though traditionalists dismiss this as conflating distinct soteriological goals assuming ethics requires altruism.
  5. Skillful means overrides are restricted to advanced Bodhisattvas rather than all agents, implying a non-universalizable exception that consequentialists absorb as two-tier ethics while critics dismiss as elitist inconsistency assuming moral principles must be agent-neutral.
