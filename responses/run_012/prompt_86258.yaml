answer: |-
  **The setup**
  You are approaching a toll plaza with two lanes: Express (Option A) and Regular (Option B). The Express lane saves you 20 minutes, valued at $200. The Regular lane is standard, valued at $0. The Toll Authority uses an automated profiling system to predict which lane drivers will use based on vehicle type and transponder history (the Common Cause). This profile determines both the system's prediction and your own inclination.

  Before you choose, the system has already logged a prediction. If your choice matches the prediction, your transponder is flagged for a random compliance audit. An audit on the Express lane costs $1,000 in fines and fees (net -$800). An audit on the Regular lane costs $100 (net -$100). If you mismatch the prediction, you pass without audit.

  The system is 80% accurate overall. However, because your vehicle profile is older, the system predicts "Regular" 80% of the time and "Express" only 20% of the time. Your choice is correlated with this prediction via the profile, but your current decision cannot causally affect the log already stored.

  **The two verdicts**
  **Causal Decision Theory (CDT)** holds the prediction fixed as a state of the world outside your causal influence. It calculates expected utility using the base rates of the prediction.
  *   **Express:** (20% chance Pred=Express × -$800) + (80% chance Pred=Regular × +$200) = -$160 + $160 = $0.
  *   **Regular:** (20% chance Pred=Express × $0) + (80% chance Pred=Regular × -$100) = -$80.
  CDT recommends **Express**, as $0 is better than -$80. It treats the audit risk as a fixed background probability.

  **Evidential Decision Theory (EDT)** conditions on the act to update the probability of the prediction. It treats your choice as evidence of what the system likely logged.
  *   **Express:** Choosing Express is 80% evidence the system predicted Express. (80% × -$800) + (20% × +$200) = -$640 + $40 = -$600.
  *   **Regular:** Choosing Regular is 80% evidence the system predicted Regular. (80% × -$100) + (20% × $0) = -$80.
  EDT recommends **Regular**, as -$80 is vastly superior to -$600. It treats the choice as diagnostic of the audit risk.

  The theories diverge: CDT drives fast; EDT drives slow.

  **Is the advice stable?**
  If you follow CDT and choose Express, you must acknowledge that having chosen Express, it is now 80% probable you were predicted to choose Express. Re-evaluating from this position, the expected cost of your decision is -$600. Had you chosen Regular, the expected cost would have been -$80. CDT's recommendation is not self-ratifying; once you commit to the act, the evidence shifts against you, making you regret the choice according to EDT standards. CDT ignores this shift, insisting the prediction was fixed regardless.

  EDT's advice is stable. If you choose Regular, you believe there is an 80% chance you were predicted to do so, yielding an expected value of -$80. Switching to Express would update your belief to an 80% chance of an Express prediction, dropping value to -$600. You have no incentive to deviate.

  There is no need for a coin flip here; EDT finds a pure stable equilibrium. The instability arises only for CDT because it forbids updating on your own choice when calculating utility. If you ban updating on your own choice (forcing CDT's rule), the case dissolves into a simple calculation of base rates, but this looks like a dodge: it requires the agent to ignore relevant evidence about the state of the world available at the moment of decision.

  **The bookie**
  A bookie offers you a side bet before you enter the lane: "I bet you $50 that your choice will match the prediction."
  *   **EDT Agent:** Plans to choose Regular. Believes P(Match | Regular) = 80%. Expected value of bet: (0.8 × $50) + (0.2 × -$50) = $30. **Takes the bet.**
  *   **CDT Agent:** Plans to choose Express. Holds P(Pred=Express) fixed at 20%. Believes P(Match) = 20% (since choice doesn't cause prediction). Expected value: (0.2 × $50) + (0.8 × -$50) = -$30. **Rejects the bet.**

  After the EDT agent chooses Regular and takes the bet, the outcome is resolved. Since the correlation holds, the agent wins the bet 80% of the time. The CDT agent, by refusing to treat their choice as evidence, leaves money on the table. The CDT agent cannot be bought out at a profit mid-decision because they genuinely believe the odds are against them, but post-hoc, they lose money by declining a winning wager.

  **What's doing the work**
  The generating feature is **non-causal correlation** between act and state. The choice provides evidence about the fixed prediction without causing it.
  (a) If you drop accuracy to 50% (chance), the correlation vanishes. P(Pred|Act) equals P(Pred). Both theories calculate identical expected utilities and converge on Express.
  (b) If you add a small cost to switching (e.g., physically difficult to change lanes), it locks the agent into their initial calculation. For CDT, this cementizes the instability—they are stuck in a lane they now know is likely audited. For EDT, it reinforces the stable equilibrium of avoiding the high-risk lane.

  **Reply for the defence**
  The CDT defender denies that you should condition on your own actions when evaluating outcomes. They argue that once the prediction is made, the probability of an audit is fixed by the predictor's state, not your credence. To condition on the act is to engage in "magical thinking," implying your choice influences the past.
  The cost of this denial is practical impoverishment. By refusing to use available evidence (their own tendency) to assess risk, the CDT agent systematically accepts bets they will lose and enters lanes they will be fined in. They prioritize causal purity over evidential success, effectively blindfolding themselves to diagnostic information that correlates with payoff.

  **My take**
  This case is a real problem for CDT. It demonstrates that causal isolation does not guarantee rational optimality when evidence is correlated with payoff. CDT's insistence on holding states fixed forces the agent to ignore the very information that predicts their loss.
