answer: |-
  The argument your friend R has constructed is a rigorous formulation of the **Standing Objection** to blame, specifically pushing it toward a nihilistic conclusion via a claim about moral perfectionism. It is a valid argument; if the premises hold, the conclusion follows. To resist (9) without abandoning the core intuitions behind (2) and (5), you must identify the premise that smuggles in an implausible conception of moral agency.

  ### The Step to Reject: Premise (3)

  You should reject **Premise (3)**: *"Trying to meet a standard means actually meeting it when one can, so a single deliberate violation shows that one was not, at that moment, genuinely committed to it."*

  **Why it looked plausible:**
  Premise (3) draws its force from a compelling intuition about **integrity**. We feel that there is a contradiction in asserting a norm while simultaneously flouting it. This premise conflates *commitment* with *infallibility*. It assumes that the only evidence for a genuine commitment to a standard is successful compliance. This resonates with the idea that "actions speak louder than words"; if your action violates the standard, your "word" (your commitment) is revealed as false. It also relies on a specific, demanding view of "can": if you *could* have done otherwise and didn't, you must not have been *trying* to do otherwise.

  **Why it must go:**
  Premise (3) eliminates the possibility of **weakness of will (akrasia)** or **moral residue**. It makes moral commitment an all-or-nothing property. In reality, moral agents often possess a genuine commitment to a standard (they endorse it, they regret violating it, they intend to follow it in the future) yet fail to meet it due to lapse, passion, or cognitive error. By rejecting (3), you distinguish between the **hypocrite** (who does not endorse the standard they enforce) and the **struggler** (who endorses the standard but fails to live up to it). This blocks the slide from (6) ("nobody is perfect") to (7) ("no one has standing"), because imperfection does not entail a lack of commitment.

  ---

  ### The Cost for the Three Positions on Hypocrisy and Blame

  You asked what the going positions must pay to reject (3). Note that in the contemporary literature, there is **no consensus** on which of these positions is correct. The "Forfeiture View" is dominant but vigorously contested. Here is how rejecting (3) impacts each:

  #### 1. The Forfeiture View (Hypocrisy forfeits standing)
  *Proponents:* R. Jay Wallace, Macalester Bell.
  *The View:* If you are a hypocrite, you lack the normative authority to blame.
  *Cost of Rejecting (3):* This position must narrow its definition of hypocrisy. If (3) is false, then **mere failure is not hypocrisy**. The Forfeiture View can no longer claim that anyone who has violated a standard lacks standing to blame for that standard. They must now prove that the blamer *insincerely* endorses the standard (i.e., they are unrepentant or exempt themselves from the norm).
  *The Price:* **Epistemic Burden.** It becomes much harder to determine who has standing. We can easily see if someone violated a norm (Premise 6); we cannot easily see if they are "genuinely committed" despite the violation (Rejecting 3). This view must pay the cost of making standing assessments more invasive and difficult.

  #### 2. The Untouched View (Hypocrisy leaves standing untouched)
  *Proponents:* Some consequentialists, certain retributivists.
  *The View:* The blameworthiness of the target is objective; the blamer's moral record is irrelevant to the truth of the blame.
  *Cost of Rejecting (3):* This position loses a powerful explanation for why hypocrisy *feels* wrong. If (3) were true, the hollowness of hypocritical blame would be explained by the fact that the hypocrite isn't even "trying." By rejecting (3), the Untouched View must explain the "hollowness" differently—perhaps as a pragmatic defect rather than a normative one.
  *The Price:* **Explanatory Deficit.** They must explain why we instinctively recoil from hypocritical blame if the standing remains technically intact. They cannot rely on the "lack of commitment" argument to explain the intuition; they must argue that the intuition is merely a heuristic error.

  #### 3. The Vitiated Address View (Hypocrisy vitiates the address, desert intact)
  *Proponents:* Andreas Brekke Carlsson, some Strawsonians.
  *The View:* The target is still blameworthy (desert is intact), but the *act* of blaming by the hypocrite is inappropriate or "vitiated" (lacks moral force).
  *Cost of Rejecting (3):* This view aligns most naturally with rejecting (3). However, it must clarify the conditions of vitiation. If failure doesn't equal lack of commitment, then the address is only vitiated when the *commitment* is absent, not when the *success* is absent.
  *The Price:* **Conceptual Precision.** This view must distinguish between a *failed moral address* (by a struggler) and a *false moral address* (by a hypocrite). It pays the cost of having to articulate a theory of "sincerity conditions" for speech acts within the moral community.

  ---

  ### Nuances: Struggling vs. Unrepentant, Victim vs. Bystander

  Rejecting (3) allows you to differentiate between agents, which addresses your specific worries about the "price" of resistance.

  **1. The Struggling Reformer vs. The Serenely Unrepentant**
  *   **If you keep (3):** Both the struggler and the unrepentant wrongdoer are lumped together as "lacking commitment." Both lose standing. This leads to the nihilism of (9).
  *   **If you reject (3):** You can grant standing to the **struggling reformer**. They violate the standard (Premise 6) but maintain commitment (Denial of 3). Therefore, Premise (4) does not apply to them, and they retain standing under Premise (5). The **unrepentant wrongdoer**, however, who violates the standard *and* rejects the commitment, still falls under (4) and loses standing.
  *   **The Cost:** You preserve accountability for the virtuous-but-imperfect, but you must accept that the unrepentant hypocrite truly is silenced. This is a feature, not a bug, for most theories of responsibility.

  **2. The Victim vs. The Bystander**
  *   **The Problem:** There is a strong intuition that victims retain standing to blame even if they are hypocrites (e.g., a thief has standing to complain when stolen from). Rejecting (3) helps here, but it might not be enough. A victim might be *unrepentant* about their own theft yet still have standing to blame their thief.
  *   **The Implication:** This suggests that while rejecting (3) blocks the *universal* nihilism of (9), you may also need to qualify **Premise (5)**. Many philosophers (e.g., Fritz, Bell) argue that standing is not binary but **scalar** or **context-dependent**. A victim's "stake" in the norm may grant them standing even if their commitment is imperfect.
  *   **The Cost:** If you rely *only* on rejecting (3), you cannot fully explain the victim's privilege. You may have to admit that (5) is too strong in cases of special relationship or direct harm. This complicates the theory of standing, moving it from a general rule ("hypocrites lack standing") to a contextual one ("hypocrites lack standing *unless* they are victims").

  ---

  ### Settled vs. Contested in the Literature

  To ensure you are not mistaking a contestable view for consensus, keep the following distinctions clear:

  **Settled (Broad Agreement):**
  *   **The Logic:** The argument R presented is valid; if the premises are true, the conclusion follows.
  *   **The Phenomenon:** Hypocrisy makes blame *problematic*. It creates a "hollowness" or reduces the efficacy of the moral address.
  *   **The Nihilism:** Conclusion (9) is false. Moral accountability is not a fiction. Therefore, at least one premise must be rejected.

  **Contested (Genuine Disagreement):**
  *   **The Nature of Standing:** There is no consensus on whether "standing" is a normative power (Wallace), a pragmatic condition (some speech-act theorists), or a non-existent category (some skeptics).
  *   **The Scope of Forfeiture:** There is no consensus on whether *any* hypocrisy forfeits standing, or only *relevant* hypocrisy (violating the same norm), or only *unrepentant* hypocrisy.
  *   **The Victim Exception:** It is contested whether victims retain standing *because* they are victims (rights-based) or because their hypocrisy is less relevant (commitment-based).

  ### Summary Recommendation

  Reject **Premise (3)**. It is the engine of the nihilism. It demands a moral perfectionism that no human can satisfy. By rejecting it, you preserve the link between good faith and trying (Premise 2) without conflating trying with succeeding.

  *   **What you save:** The possibility of a moral community where imperfect agents hold one another accountable.
  *   **What you pay:** You must accept that determining standing requires looking at an agent's *commitments*, not just their *record*. This makes moral judgment more complex, but it saves it from impossibility.
  *   **Regarding (5):** You can keep (5) as a general principle (*insincerity* forfeits standing) without accepting the nihilistic conclusion, because rejecting (3) ensures that not every violator is insincere. This honors your intuition that the hypocrite's reproach rings hollow, without silencing the struggler's appeal.
