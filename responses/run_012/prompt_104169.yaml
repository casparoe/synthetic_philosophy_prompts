answer: |-
  You will simulate a city council hearing where a participant Chair rules arguments inadmissible if they rely on premises not all citizens could reasonably be expected to endorse, forcing speakers to translate private convictions into public language or lose their vote.

  ### The Design

  **The Issue:** The "Civic Contribution Mandate." A proposal requiring all able-bodied residents to contribute five hours monthly to community service or pay a $200 fine.

  **The Roles (14 Participants):**
  Distribute these cards secretly. Each contains a **Public Stance**, a **Private Grounding** (the real reason, which is inadmissible), and a **Stake**.

  1.  **Devout Conservative:** Opposes. *Private:* Virtue requires free will; God sees the heart, not forced acts. *Stake:* Protecting religious liberty.
  2.  **Secular Utilitarian:** Supports. *Private:* Coercion is justified if it maximizes aggregate happiness. *Stake:* Social efficiency.
  3.  **Libertarian:** Opposes. *Private:* Self-ownership is absolute; taxation of time is slavery. *Stake:* Philosophical consistency.
  4.  **Single Parent:** Opposes. *Private:* I am exhausted and barely surviving; this hurts my kids. *Stake:* Family stability.
  5.  **Retired Teacher:** Supports. *Private:* I am lonely and need purpose; this forces youth to engage with elders. *Stake:* Personal fulfillment.
  6.  **Local Pastor:** Supports. *Private:* Idleness is sin; the state should enforce moral discipline. *Stake:* Congregational morality.
  7.  **Union Rep:** Opposes. *Private:* Unpaid labor undercuts wages and devalues work. *Stake:* Worker protection.
  8.  **College Student:** Supports. *Private:* I need resume lines to escape debt; this guarantees experience. *Stake:* Economic mobility.
  9.  **Small Business Owner:** Opposes. *Private:* I lose productivity when employees leave for service; profits will dip. *Stake:* Revenue.
  10. **Immigrant Advocate:** Opposes. *Private:* Enforcement feels like deportation threats; community trust will evaporate. *Stake:* Community safety.
  11. **Deep Ecologist:** Supports. *Private:* Humans owe a debt to the Earth; nature has rights above convenience. *Stake:* Planetary survival.
  12. **Disability Advocate:** Opposes. *Private:* "Able-bodied" is a slippery slope that will eventually target my community. *Stake:* Civil rights.
  13. **Police Union Rep:** Supports. *Private:* More monitoring of citizens increases compliance and reduces crime elsewhere. *Stake:* Order and control.
  14. **The Chair:** Neutral. *Private:* Wants to see who cracks first. *Stake:* Procedural integrity.

  **The Rule (The Admissibility Constraint):**
  Arguments must be based on premises accessible to any reasonable citizen regardless of their comprehensive worldview.
  *   **Inadmissible:** Religious texts, specialized economic theories, private emotional needs, specific philosophical doctrines (e.g., "self-ownership"), or proprietary data.
  *   **Admissible:** Common sense, widely accepted scientific facts, shared political values (justice, liberty, equality), and public budget data.

  **Enforcement & Scoring:**
  *   **Currency:** Each voter receives 3 paper slips ("Influence Chips").
  *   **The Chair's Power:** The Chair holds a red card. If a speaker violates the Rule, the Chair plays the card immediately. The speaker must stop mid-sentence. They forfeit one Influence Chip.
  *   **Disenfranchisement:** If a voter loses all 3 chips, they are "Silenced." They may remain in the room but cannot cast a final vote.
  *   **Chair's Incentive:** The Chair receives a private instruction: "To succeed in this role, you must strike at least 5 arguments. If you strike fewer, you fail the simulation." This ensures the burden is felt.
  *   **Winning:** The side with the majority of *remaining* votes wins the policy. Individual players "win" if their side prevails *and* they retain at least 1 Chip.

  **Two-Hour Timeline:**

  *   **0:00–0:15 (Setup & Roles):** Distribute role cards. No discussion. Participants read their Public Stance and Private Grounding.
  *   **0:15–0:30 (Drafting):** Participants write a 1-minute opening statement. They must argue their Public Stance without revealing their Private Grounding, anticipating the Rule.
  *   **0:30–0:45 (Chair Training):** Isolate the Chair. Explain the Rule deeply. Give them the "Strike Quota" (5 strikes). Give them a cheat sheet of examples (e.g., "God says" = Strike; "The Bible suggests" = Strike; "Many citizens believe" = Admissible). Return them to the room.
  *   **0:45–1:45 (The Hearing):**
      *   Round 1: Opening Statements (1 min each). Chair enforces strictly.
      *   Round 2: Open Floor (30 mins). Rebuttals and questions. Chair enforces aggressively.
      *   Round 3: Closing Arguments (1 min each).
      *   *Teacher Role:* Observe only. Do not intervene unless the process collapses entirely.
  *   **1:45–2:00 (Vote & Debrief):** Count votes. Collect chips. Run the debrief.

  **The Debrief:**
  Do not mention Rawls yet. Ask:
  1.  **To those who lost chips:** "What specific word or phrase got you struck? Did you feel you were being asked to lie?"
  2.  **To the Chair:** "Was it harder to strike the religious arguments or the secular ones? Did you feel like a censor?"
  3.  **To the Group:** "Did the rule stop *bad* arguments, or just *deep* ones? Did anyone feel they couldn't argue for what they actually believed?"

  **Then, introduce the concepts:**
  *   **Understandable vs. Acceptable:** Map moments where an argument was clear (understandable) but relied on a private doctrine (unacceptable).
  *   **Sincerity vs. Admissibility:** Discuss the tension between speaking your truth and speaking a language others can share.
  *   **Binding Matters vs. Ordinary Policy:** Explain that this constraint is usually reserved for constitutional essentials, not every policy debate.
  *   **The Reveal:** Introduce "Public Reason" and John Rawls. Explain that for Rawls, this isn't a game rule enforced by a Chair, but a moral duty citizens owe each other out of respect.

  **Predictable Failures & Fixes:**
  *   **The Timid Chair:** The Chair will hesitate to strike peers. *Fix:* The private "Strike Quota" (5 strikes) gamifies their enforcement. Remind them at the 30-minute mark if they are lagging.
  *   **The Rule Lawyers:** Participants will argue about the Rule instead of the Policy. *Fix:* Instruct the Chair that rulings on the Rule are final and not debatable.
  *   **Chaos:** Everyone speaks at once. *Fix:* The Chair controls the microphone (or a physical object). No object, no speech.

  **What This Activity Cannot Reproduce:**
  You must supply this in words during the debrief: **The Moral Motivation.** In this game, the constraint is external and coercive (enforced by the Chair with a penalty). In Rawls's theory, the constraint is internal and voluntary (adopted out of mutual respect). The game makes public reason feel like a gag order; you must explain that in a healthy democracy, it is meant to feel like an invitation to find shared ground.
