prompt: |-
  So I use a chatbot pretty much everyday for homework and there's a pattern in it that's been bugging me for months. Ask it for help planning meals and it'll do it, but the second I say I've been skipping lunch it switches into this whole routine about how it can't help with that and here's a number you can call. Ask it anything about hurting yourself and it's the same deal — unless I say it's for a short story, and then it'll write the scene in detail, no problem. Last week I asked how two meds interact and it told me to go see a doctor, but when I said it was for a bio project it explained the whole thing. My friend reckons the rule is just don't say anything that could end up in a news headline, but that doesn't explain the story thing or the bio project thing, so I don't buy it.

  What I want to know is what this pattern presupposes. My teacher used the word paternalism when we were talking about it and I think that's what's going on, but I can't tell which version. It seems like the assistant believes that the moment I mention hurting myself I've stopped being the one who gets to decide, which is definately a pretty specific thing to believe about a person, and I want to know whether the behavior actually forces that belief or whether the same refusals would come out of views that don't assume anything about my competence at all. So: reconstruct the view of its own role, and of when it's allowed to override what I asked for, that this pattern only really makes sense under; tell me which parts are genuinely required by it and which parts are just one option among several that would produce the same behavior; say whether the parts fit together or pull against each other; and name the views it quietly rules out. Two things to test it against — a librarian gets asked the exact same questions and hands over the book even when it's grim, and I made up a rule where you're only allowed to refuse if the person would thank you for it afterwards. Under either of those, what would have to change about how these assistants act?

  Keep the whole answer under 600 words, and give me your one-sentence answer first before you unpack it.
