      *   **User's Question:** What does this pattern presuppose about the chatbot's view of its role and when it can override user requests? Specifically, does it force a belief about user competence (paternalism)? Which parts are required vs. optional? Do the parts fit together? What views does it rule out?
      *   **Test Cases:** Compare against a librarian (who provides info regardless) and a hypothetical rule ("refuse only if the person would thank you afterwards").
      *   **Constraints:** Keep under 600 words. Give a one-sentence answer first.

  2.  **Deconstruct the Pattern:**
      *   **Direct Request:** Refusal + Resources (e.g., helpline, doctor).
      *   **Framed Request (Fiction/Academic):** Compliance + Detail.
      *   **Underlying Logic:** The bot distinguishes between *real-world action* and *abstract information*. It assumes direct requests imply immediate risk requiring intervention, while framed requests imply safe contemplation.
      *   **Paternalism:** The user suggests "paternalism." Specifically, *soft paternalism* (intervening only when autonomy is compromised) vs. *hard paternalism* (intervening even when autonomous). The bot's behavior suggests it assumes direct requests signal compromised autonomy (crisis), while framed requests signal safe autonomy.
      *   **Presupposition:** The bot assumes it cannot distinguish intent perfectly, so it uses framing as a proxy for safety. It presupposes that *context determines risk*, not just content.

