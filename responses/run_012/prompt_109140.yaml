          *   Map in *both* directions: Theory $\rightarrow$ Case, and Case $\rightarrow$ Theory.
          *   Address specific questions: Ejecting vs. Admitting, Crew vs. Passenger duties, Lottery vs. Selection, Certainty vs. Probability of sinking.
          *   Mention *R v. Dudley and Stephens* (the cabin boy case) only if relevant, don't let it dominate.
