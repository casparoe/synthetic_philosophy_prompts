      *   *Fact Check:* Hardin's essay date? 1974. *William Brown*? 1841. *Dudley and Stephens*? 1884. Chronology matters. Hardin is using a metaphor, not analyzing maritime law.
      *   *Nuance:* Make sure to distinguish between "Lifeboat Ethics" (Hardin's specific political argument) and "Ethics of the Lifeboat Situation" (general survival ethics). The student is asking about Hardin specifically.

  7.  **Final Polish:**
      *   Check against constraints: No citations? Check. Show work? Check. Address specific questions (eject vs admit, lottery, etc.)? Check.
      *   Make sure the distinction between "probability of ruin" (Hardin) and "certainty of sinking" (Brown) is highlighted. That's a key ethical distinction.

  8.  *(Self-Correction on Hardin's specific stance)*: Hardin argues against foreign aid and open immigration. He argues that helping the poor drains the rich. In the *Brown* case, the "rich" (crew/capacity holders) sacrificed the "poor" (passengers). In a twisted way, it aligns, but the *duty* element breaks it. I need to be careful not to say Hardin *would* endorse murder, but that his logic of "preservation of the boat at all costs" leads there.

  9.  *(Final thought on the Verdict)*: The case is evidence *against* the moral intuition Hardin relies on. Hardin assumes we feel okay saving "us" over "them." The court's reaction to Holmes suggests we *don't* feel okay when "us" has a duty to "them."

