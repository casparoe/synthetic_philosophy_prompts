  2.  **Deconstruct Hardin's "Lifeboat Ethics":**
      *   *Core Metaphor:* Rich nations = lifeboat (limited capacity). Poor nations = swimmers (unlimited demand).
      *   *Core Argument:* Complete justice (letting everyone in) = universal ruin (boat sinks). Tragedy of the Commons applied to carrying capacity.
      *   *Decision Rule:* Preserve the boat. Those already aboard have priority. No "guilt-based" admission.
      *   *Key Assumption:* The people *in* the boat are a cohesive unit with a shared interest in survival against the outside threat. There is no internal hierarchy of duty mentioned, just "us vs. them."
      *   *Nature of Threat:* Future/Probabilistic (if we let them in, we *might* swamp) vs. Immediate/Certain (if we don't throw them out, we *will* swamp).

  3.  **Analyze the *William Brown* Case:**
      *   *Context:* Sinking ship, two boats separated. Longboat is overloaded and leaking.
      *   *Action:* Crew (Mate + sailors) threw passengers (mostly men) overboard to save the boat. Crew survived; passengers died.
      *   *Legal Outcome:* Holmes convicted of manslaughter (light sentence). Implies necessity was acknowledged but didn't fully excuse murder.
      *   *Key Ethical Tension:* Duty of care (crew to passengers) vs. Necessity (survival of the fittest/fewest).
      *   *Selection Method:* Not a lottery. Based on status (crew vs. passenger) and gender/family status (married men spared initially).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the student's insight. It *is* a hard class. Validate the connection they made (it's a sharp observation).
      *   **Part 1: The Machinery of Hardin's Theory:**
          *   Define the core logic. It's about *carrying capacity* and *self-preservation of the group already inside*.
          *   Crucial point: Hardin assumes the people *in* the boat are the moral agents deciding on the people *outside*.
          *   Crucial point: It's about *exclusion* (keeping out), not *ejection* (throwing out).
      *   **Part 2: Applying Hardin to the *William Brown*:**
          *   *The Mismatch:* Hardin talks about swimmers trying to climb *in*. The *Brown* is about people already *in* being thrown *out*.
          *   *The "Who Decides" Problem:* In Hardin's boat, everyone inside is roughly equal (citizens of the rich nation). In the *Brown*, there's a hierarchy (Crew vs. Passengers).
          *   *The Verdict:* Hardin would likely support saving the boat, *but* his theory struggles with *who* gets sacrificed. He assumes the "boat people" stay. He doesn't account for internal betrayal.
          *   *Selection:* Hardin doesn't specify a selection method for ejection, only admission. He implies "preserve the system." The crew preserved *themselves*.
      *   **Part 3: Flipping It (What the Case Shows About the Theory):**
          *   *The Duty Gap:* Hardin ignores professional/fiduciary duty. A lifeboat metaphor for nations ignores that ship crews have a legal/moral duty to passengers. Nations don't have a "duty" to immigrants in the same way.
          *   *Certainty vs. Probability:* This is huge. *William Brown* = "Sink now or kill." Hardin = "Get poorer/slower if we let them in." The ethical weight of *immediate death* is different from *resource dilution*.
          *   *The "Crew" Variable:* Hardin's boat has no crew. It's just passengers. Real lifeboats have operators. This breaks the metaphor because operators have obligations.
      *   **Part 4: *R v. Dudley and Stephens* (The Cannibal Case):**
          *   Briefly mention it. It reinforces that "necessity" is not a full defense for killing the innocent, especially without lottery.
          *   Contrast: *Dudley* killed a weak boy. *Brown* threw out able-bodied men. *Brown* is arguably worse regarding duty of care.
      *   **Part 5: Final Verdict:**
          *   Is it evidence for or against?
          *   It's mostly a case the theory wasn't built to handle.
          *   Why? Because Hardin is justifying *privilege preservation*, not *emergency triage*.
          *   The *Brown* exposes the cruelty of Hardin's logic when applied literally. If you follow Hardin strictly ("save the boat"), you get the *Brown* outcome. If you find the *Brown* outcome abhorrent (which the court did), then Hardin's logic is morally suspect in human terms.

  5.  **Refining the Tone:**
      *   Keep it respectful but rigorous. Don't talk down.
