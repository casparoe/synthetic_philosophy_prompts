answer: |-
  ### Preamble: Brainstorming & Diagnostic Mapping

  **1. Where do we actually agree?**
  Both camps reject the code model of communication (the idea that language merely transmits thoughts like a pipe). We agree that speaker meaning is inferential. We agree that context is constitutive of interpretation, not just an add-on. We agree that rationality and intentionality are the engines of communication. We agree that "what is communicated" often exceeds "what is encoded." We both accept that cancellability is a genuine test for non-literal content.

  **2. Where is the real disagreement?**
  It is architectural and taxonomic.
  *   **Architecture:** Is the pragmatic system a module with specific rules (Maxims) triggered by a general cooperative assumption? Or is it a byproduct of a general cognitive tendency to maximize relevance (effects vs. effort)?
  *   **Taxonomy:** Where does pragmatics stop and semantics start? Griceans want a thin, truth-conditional "said" that is pragmatically untouched (except for reference/ambiguity). Relevance Theorists (RT) argue that pragmatics intrudes into truth conditions early (saturation, free enrichment), making the "minimal proposition" psychologically unreal and theoretically useless.

  **3. Which parts are verbal disputes?**
  A significant portion of the fight over "what is said" vs. "explicature" is terminological. Both sides observe the same enrichment phenomena (e.g., "I've had breakfast" implies "today"). The Gricean calls the enriched part an *implicature* (specifically, a particularized conversational implicature affecting truth conditions). The RT calls it an *explicature* (part of the explicit content). If we can agree on a neutral term like "Truth-Conditional Content" (TCC) and distinguish between "Encoded Meaning" and "Communicated Content," much of the heat dissipates. However, the disagreement remains on *why* the enrichment happens (Maxim of Quantity vs. Optimization of Relevance).

  **4. Which marks discriminate?**
  *   **Cancellability:** Robust. Both use it.
  *   **Calculability:** Contested. Griceans use it to show derivation from maxims. RTs argue *all* inference is calculable via relevance, so it doesn't distinguish implicature from explicature.
  *   **Detachability:** Weak. RTs argue form affects processing effort, so changing words changes relevance, even if truth conditions stay the same. Griceans admit this complicates the picture.
  *   **Reinforceability:** Useful for distinguishing entailment from implicature, but less useful for distinguishing explicature from implicature.

  ***

  # JOINT STATEMENT ON PRAGMATIC ARCHITECTURE AND INTERPRETATION

  **Signatories:** The Gricean Working Group (Camp A) & The Relevance-Theoretic Working Group (Camp B)
  **Facilitator:** Neutral Philosophy of Language Chair

  ## I. AGREED CLAIMS

  1.  **The Inferential Nature of Communication:** Linguistic communication is not merely the encoding and decoding of messages. It involves the recognition of intentions. The linguistic signal provides evidence for the speaker's meaning, but does not fully determine it.
  2.  **The Data Set:** Both camps accept the same core set of intuitions as data: judgments about truth conditions, appropriateness, contradiction, and the availability of inferences in specific contexts.
  3.  **Context-Dependence:** The recovery of speaker meaning is radically context-dependent. This dependence extends beyond the resolution of indexicals (I, here, now) and ambiguity.
  4.  **Cancellability:** The property of cancellability (the ability to deny an inferred content without contradiction) is a reliable marker of content that is not logically entailed by the linguistic code alone.
  5.  **The Insufficiency of "Minimal Propositions":** Both camps agree that the proposition derived solely from linguistic decoding and disambiguation (the "minimal proposition") is often not what the speaker asserts, nor is it always truth-evaluable in a useful way. We disagree on whether this minimal level retains theoretical significance.
  6.  **Limits of Calculability:** While inferences are rationally reconstructible, we agree that hearers do not consciously run through a checklist of maxims or relevance calculations in real-time. The theory describes competence, not necessarily performance procedures.

  ## II. TABLE OF DISAGREEMENTS

  | Point of Difference | Gricean Formulation (Camp A) | Relevance-Theoretic Formulation (Camp B) |
  | :--- | :--- | :--- |
  | **The Governing Principle** | Communication is governed by a **Cooperative Principle** supported by distinct, sui generis **Maxims** (Quantity, Quality, Relation, Manner). These maxims are normative rules specific to conversation. | Communication is governed by a single **Cognitive Principle of Relevance**. The maxims are either derivable from the optimization of cognitive effects against processing effort or are unnecessary stipulations. |
  | **The Boundary of "Saying"** | There is a theoretically vital distinction between **What Is Said** (truth-conditional content determined by syntax + reference fixing) and **What Is Implicated**. Pragmatics determines the implicature, but semantics (mostly) determines the said. | The distinction between **Explicature** (developed logical form) and **Implicated Premise/Conclusion** is load-bearing. Pragmatics intrudes into the truth-conditional content (saturation/enrichment) *before* the proposition is fully formed. |
  | **The Role of the Code** | The linguistic code provides a robust skeleton. Pragmatic inference operates *on* the proposition expressed by that skeleton. | The linguistic code provides a schematic blueprint. Pragmatic inference is required to *flesh out* the blueprint into a proposition. The code underdetermines the proposition to a greater degree than Griceans allow. |
  | **Explanation of Scalar Inference** | Scalar implicatures (e.g., "some" implying "not all") arise from the **Maxim of Quantity**. If the speaker knew "all" was true, they would have said so. | Scalar inferences arise from **Lexical Pragmatics**. The word "some" is adjusted to an ad hoc concept SOME* that excludes "all" because that interpretation yields optimal relevance. |

  ## III. THE CRUXES

  The following cases represent the specific empirical and theoretical battlegrounds. We have ordered them by the potential for theoretical shift should one side's prediction be vindicated.

  ### Crux 1: The Status of Free Enrichment (The "Breakfast" Case)
  **The Issue:** Does pragmatic enrichment contribute to the truth-conditional content (the explicit) or to the implicit content?

  **The Case:**
  > **Context:** It is 2:00 PM. Alex and Blair are discussing a job requirement that candidates must have eaten that day.
  > **Alex:** "Have you had breakfast?"
  > **Blair:** "I've had breakfast."

  **Gricean Prediction:**
  The sentence "I've had breakfast" encodes a timeless proposition (I have had breakfast at some point in my life). This is technically true but not what is communicated. The restriction to *today* is a **Particularized Conversational Implicature**. It is cancellable ("I've had breakfast, but not today") without semantic contradiction, though it would be misleading. The "What Is Said" is the minimal proposition.

  **Relevance-Theoretic Prediction:**
  The sentence encodes a logical form with a slot for time. The restriction to *today* is a process of **Saturation/Free Enrichment** required to make the proposition truth-evaluable. This is part of the **Explicature**. It is not an implicature. While one can verbally deny it, the primary interpretation is the enriched one. The "minimal proposition" is not processed by the hearer.

  **Assessment of Settlement Potential:**
  *High.* If psycholinguistic evidence shows that the enrichment ("today") is processed as rapidly and mandatorily as reference resolution, the Gricean "minimal proposition" loses psychological reality. If evidence shows a two-step process (minimal first, then enriched), the Gricean view gains ground. Currently, evidence favors RT, but the Gricean can maintain the distinction is logical, not temporal.

  ### Crux 2: Scalar Implicature in Downward-Entailing Contexts
  **The Issue:** Do scalar implicatures arise universally and get cancelled, or are they generated only when relevant?

  **The Case:**
  > **Context:** Discussing a difficult exam where passing is rare.
  > **Speaker:** "I doubt that some of the students passed."

  **Gricean Prediction:**
  The semantic meaning of "some" is *some and possibly all*. The implicature (*not all*) is generated by the Maxim of Quantity but is **cancelled** or **suspended** in this downward-entailing context ("I doubt"). The logic holds: "I doubt (some or all)" is consistent. The implicature calculation is a default that must be suppressed here.

  **Relevance-Theoretic Prediction:**
  There is no default implicature to suppress. The interpretation of "some" is determined directly by the search for optimal relevance in this specific context. In this context, "some" is interpreted as *some* (without the *not all* exclusion) because that yields the best cognitive effects for the least effort. The ad hoc concept SOME* is constructed on the fly; no cancellation step is needed.

  **Assessment of Settlement Potential:**
  *Medium.* Both sides predict the same final interpretation (the *not all* inference does not arise). The dispute is purely architectural: Is there a generation-and-cancellation mechanism (Gricean) or a direct optimization mechanism (RT)? This may be unresolvable by behavioral data alone, as it concerns hidden cognitive machinery.

  ### Crux 3: Manner and Form (The "Stopped" Case)
  **The Issue:** Does changing the linguistic form while preserving truth conditions always generate an implicature?

  **The Case:**
  > **Scenario:** A car comes to a halt.
  > **Utterance A:** "The car stopped."
  > **Utterance B:** "The car didn't continue."

  **Gricean Prediction:**
  These two utterances express the same proposition (truth conditions are identical). Therefore, choosing B over A violates the **Maxim of Manner** (be perspicuous, avoid obscurity) unless there is a specific **Implicature** intended (e.g., the speaker is being ironic, legalistic, or emphasizing the negation). The difference in meaning is entirely implicated.

  **Relevance-Theoretic Prediction:**
  Different forms impose different **Processing Efforts**. Even if truth conditions are identical, the difference in meaning is not necessarily an "implicature" in the Gricean sense. It is a difference in the **Mutual Manifestness** of assumptions. Utterance B makes the negation of continuation more manifest. The effect is explained by the effort/effect ratio, not by a violation of a manner rule.

  **Assessment of Settlement Potential:**
  *Low (Verbal Dispute).* Both sides agree the form matters. The Gricean calls the difference an "implicature of manner." The RT calls it a difference in "cognitive effects relative to effort." This is largely a disagreement about the taxonomy of meaning, not the phenomenon itself.

  ### Crux 4: The "Loose Use" of Language (Approximation)
  **The Issue:** How do we handle obvious falsehoods that are accepted as true?

  **The Case:**
  > **Context:** Arriving at a meeting at 3:01 PM.
  > **Speaker:** "I arrived at 3:00 PM."

  **Gricean Prediction:**
  Strictly speaking, the proposition is false. The speaker is flouting the **Maxim of Quality** (do not say what you believe to be false). The hearer derives a **Conversational Implicature**: "I arrived approximately at 3:00 PM." The literal content remains false.

  **Relevance-Theoretic Prediction:**
  The speaker is not saying something false. The concept "3:00 PM" is adjusted to an ad hoc concept 3:00 PM* which includes a margin of error. This is part of the **Explicature**. The proposition expressed is true. There is no flouting of Quality.

  **Assessment of Settlement Potential:**
  *High.* This tests the "Truth-Conditional" claim. If speakers judge the utterance as literally true (not just "acceptable"), the RT view is stronger. If speakers judge it as "strictly false but acceptable," the Gricean view holds. Experimental data on truth-value judgments is the arbiter here.

  ## IV. IDENTIFICATION OF PURELY VERBAL DISPUTES

  We identify the following area as a candidate for a purely verbal dispute that hinders progress:

  **The Labeling of Enriched Truth-Conditions.**
  *   **The Dispute:** Griceans insist that if content is pragmatically derived, it must be "Implicated." RTs insist that if content contributes to truth conditions, it must be "Explicit/Explicature."
  *   **Why it is Verbal:** Both sides agree on the phenomenon: The hearer ends up evaluating a proposition that includes pragmatically supplied material (e.g., "today," "enough," "approximately").
  *   **Proposed Neutral Vocabulary:** We propose adopting the term **Communicated Truth-Conditional Content (CTCC)** for the proposition actually evaluated by the hearer. We reserve **Encoded Logical Form (ELF)** for the output of syntax/semantics.
      *   Griceans can maintain that CTCC = ELF + Implicature (where the implicature modifies truth conditions).
      *   RTs can maintain that CTCC = Developed Explicature.
      *   By focusing on the relationship between ELF and CTCC, we can measure the *degree* of pragmatic intrusion without fighting over the label "said" vs. "implicated."

  ## V. UNSOLVABLE CRUXES

  **The Normative vs. Descriptive Status of the Principles.**
  *   **The Issue:** Is the Cooperative Principle/Maxims a normative rule that speakers *ought* to follow (Gricean), or is the Principle of Relevance a description of how cognitive systems *do* function (RT)?
  *   **Why it cannot be settled by case data:** No dialogue can prove whether a principle is a rule or a law of nature. A speaker can follow a rule without knowing it, and a cognitive system can operate lawfully without "following" a rule.
  *   **Statement:** We acknowledge that this is a meta-theoretical disagreement about the nature of explanation in cognitive science. We agree to treat both as heuristic models for predicting interpretation, suspending the claim that one is the "true" ontology of the mind until independent cognitive evidence arises.

  ***

  **Signed,**
  *The Gricean Working Group*
  *The Relevance-Theoretic Working Group*
