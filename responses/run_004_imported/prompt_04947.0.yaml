      *   **Tone:** Academic but engaging (seminar context), critical, decisive.

  2.  **Deconstruct Galen Strawson's Basic Argument:**
      *   *Premise 1:* To be truly morally responsible (TMR) for an action, one must be TMR for the way one is (at least in certain mental respects).
      *   *Premise 2:* To be TMR for the way one is, one must have chosen to be that way.
      *   *Premise 3:* To choose to be that way, one must have had reasons/principles for that choice.
      *   *Premise 4:* To be TMR for that choice, one must be TMR for having those reasons/principles.
      *   *Conclusion:* This leads to an infinite regress. Since one cannot be *causa sui* (cause of oneself), TMR is impossible.
      *   *Neutrality Claim:* This doesn't depend on determinism. Even if choices are random (indeterminism), you aren't responsible for the randomness.

  3.  **Evaluate the "Neutrality" Charge:**
      *   *Is it cheating?* No, it's actually the argument's strength. Traditional incompatibilism says "Determinism kills responsibility." Compatibilists say "Determinism doesn't matter, look at reasons-responsiveness." Galen says "The problem is deeper. It's about *origination*."
      *   *Why it works:* It shifts the battlefield from physics/metaphysics (determinism vs. indeterminism) to the structure of agency itself. It attacks the concept of *ultimate* responsibility.
      *   *Potential weakness:* Does it set the bar for responsibility impossibly high? (Yes, that's the point).

  4.  **Evaluate P.F. Strawson's "Freedom and Resentment":**
      *   *Core Idea:* Responsibility isn't a metaphysical fact; it's a social practice grounded in "reactive attitudes" (resentment, gratitude, blame, praise). We can't abandon these attitudes without abandoning human relationships.
      *   *Does it answer Galen?* Galen would say: "You're changing the subject." P.F. talks about *practices* of holding responsible; Galen talks about *desert* and *ultimate origination*.
      *   *Verdict:* P.F. Strawson dodges the metaphysical question Galen asks. P.F. says "We do hold people responsible." Galen says "Are we *truly* responsible?" P.F. offers a pragmatic justification, not a metaphysical one.

  5.  **Formulate the Verdict:**
      *   *Option A:* Galen is right. Responsibility is impossible. (Hard Incompatibilism).
