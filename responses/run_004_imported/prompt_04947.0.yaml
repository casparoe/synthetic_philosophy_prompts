answer: |-
  **The Impossible Inheritance: Why Galen Strawson's Basic Argument Succeeds**

  The history of philosophy is rarely so Shakespearean as the dispute between P.F. Strawson and his son, Galen. In 1962, P.F. Strawson published "Freedom and Resentment," arguably the most influential compatibilist essay of the twentieth century, attempting to dissolve the problem of free will by shifting focus to our social practices. Decades later, Galen Strawson formulated the "Basic Argument," a metaphysical guillotine designed to sever the very possibility of moral responsibility, regardless of whether the universe is determined or not. In your seminar, you have likely heard the Basic Argument described as a logical trap. The question remains: is it a legitimate trap, or a rigged game? And does P.F. Strawson's appeal to human emotion answer it, or merely ignore it?

  To be decisive: Galen Strawson's Basic Argument succeeds. It demonstrates conclusively that "True Moral Responsibility" (TMR)—the kind required for basic desert—is impossible. His claim of neutrality regarding determinism is not a cheat; it is the argument's greatest strength, exposing a flaw in the structure of agency itself rather than the laws of physics. Consequently, P.F. Strawson's defense does not refute Galen; it surrenders the metaphysical ground in exchange for pragmatic comfort. We may keep our practices of blame and praise, but we must admit they are not founded on the kind of responsibility that justifies ultimate desert.

  To understand why the neutrality charge is unfounded, we must look at what the Basic Argument actually targets. Traditional hard determinists argue that if determinism is true, we are dominoes; our actions are fixed by the past, so we cannot be responsible. Compatibilists reply that responsibility only requires that actions flow from our character and desires, not that those desires be uncaused. Galen Strawson bypasses this stalemate entirely. His regress argument posits that to be truly responsible for an action, one must be truly responsible for the mental state (character, motives, reasons) that produced the action. But to be responsible for that mental state, one must have chosen it, which requires a prior mental state to guide that choice, ad infinitum.

  Critics often claim this neutrality is "cheating" because it seems to demand that an agent be *causa sui* (cause of themselves), which is logically impossible. They argue that by setting the bar for responsibility at "ultimate origination," Galen defines responsibility out of existence before the argument begins. However, this criticism misses the point. If moral responsibility entails *desert*—the idea that you fundamentally deserve praise or blame in a way that justifies retributive justice—then you must be the ultimate source of the action. If your character is the product of genetics and environment (determinism), you didn't choose it. If your character is the product of random quantum fluctuations (indeterminism), you didn't choose that either. Randomness is not freedom. Therefore, Galen's neutrality is not a trick; it is a rigorous elimination of the only two metaphysical options available. It shows that the problem is not the causal structure of the universe, but the temporal structure of the self. You cannot step outside of your own history to authorize it.

  This brings us to P.F. Strawson's "Freedom and Resentment." The elder Strawson argues that the debate over determinism is irrelevant because our commitment to moral responsibility is grounded in "reactive attitudes"—emotions like resentment, gratitude, and indignation that are constitutive of human relationships. We cannot abandon these attitudes without ceasing to be human. Therefore, responsibility is real because the practice of holding people responsible is inescapable.

  Does this answer Galen? No. It dodges the question. P.F. Strawson shifts the goalposts from *justification* to *inevitability*. Galen asks: "Are we truly responsible? Do we deserve blame in a deep, metaphysical sense?" P.F. answers: "We are going to blame people anyway, and life would be horrible if we didn't." This is a pragmatic justification, not a metaphysical one. It concedes that we might not be *ultimately* responsible in the way required for basic desert, but argues that we should act as if we are because the alternative is social collapse. P.F. Strawson effectively admits that the "objective attitude" (viewing people as objects to be managed) is theoretically available if determinism is true, but argues we should reject it for emotional reasons. Galen's argument shows that the "objective attitude" is actually the only metaphysically honest one. P.F. Strawson offers a therapy for the anxiety Galen induces, but he does not cure the disease.

  The verdict must be that Galen Strawson is right, and the implications are stark. If the Basic Argument holds, then no one is ever morally responsible for their actions in the sense required for retributive justice. We may hold people accountable for the sake of safety, rehabilitation, or social cohesion (as P.F. suggests), but we cannot claim they *deserve* suffering in a cosmic sense. To claim otherwise is to believe in a form of magic where the self creates itself ex nihilo.

  Some compatibilists will object that Galen's standard is too high, that "responsibility" just means "reasons-responsiveness." But this is semantic sleight of hand. If I am programmed by my past to respond to reasons, I am a sophisticated robot. If I am random in my response to reasons, I am a broken one. In neither case am I the *author* of my life in the way required for moral desert. Galen forces us to confront the fact that the intuitive notion of free will—the feeling that we are the unmoved movers of our choices—is an illusion.

  In conclusion, the Basic Argument succeeds because it identifies a structural impossibility in the concept of ultimate responsibility. The neutrality between determinism and indeterminism is not a cheat; it is a demonstration that physics is irrelevant to the problem of self-constitution. P.F. Strawson's "Freedom and Resentment" remains a masterpiece of philosophical psychology, explaining why we *feel* responsible, but it fails as a defense of moral responsibility because it refuses to engage with the metaphysical requirement of origination. We are left with a difficult truth: we must continue to live within the web of reactive attitudes, as P.F. advised, but we must do so with the humility of knowing that, as Galen proved, no one truly deserves the blame we cast, nor the praise we seek. The Basic Argument stands not as a paradox to be solved, but as a limit to be endured.
