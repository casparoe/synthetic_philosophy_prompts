      *   *Better Verdict:* I will argue that Galen's Basic Argument **succeeds** in demonstrating that *Ultimate* Moral Responsibility is impossible, and that P.F. Strawson's defense is indeed a dodge that changes the subject from *desert* to *social utility*. This aligns better with the "Hard Incompatibilist" view (like Derk Pereboom) which takes Galen seriously. It makes for a stronger, more decisive essay. I will argue that the "neutrality" is genuine and devastating, and P.F. Strawson offers a pragmatic consolation prize, not a refutation.

