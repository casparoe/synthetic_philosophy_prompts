answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. Two political philosophers, ELENA (proponent of the All-Affected Interests principle) and MARCUS (proponent of the All-Subjected to Coercion principle), are sharing a pot of coffee. On the table between them lies a case study regarding the proposed "Arid Basin Dam."*

  **The Case:** *The Republic of Upstreamia plans to build a massive hydroelectric dam on a river that flows into the neighboring Republic of Downstreamia. The dam will provide cheap electricity for Upstreamia but will reduce water flow to Downstreamia by 40%, devastating their agriculture. The citizens of Upstreamia are voting on the project. The citizens of Downstreamia are not.*

  ***

  **Elena:** Look at the map, Marcus. It's straightforward. If Upstreamia builds this dam, the farmers in Downstreamia lose their livelihoods. Their interests are fundamentally altered. If democracy means "rule by the people," then those farmers are part of "the people" who should decide this. Excluding them is tyranny.

  **Marcus:** It feels like tyranny, I grant you. But is it *political* tyranny? Those farmers are not citizens of Upstreamia. They don't pay Upstreamian taxes. They don't serve in Upstreamia's military. They aren't subject to Upstreamia's legal system. If they can't be arrested by Upstreamian police, why should they get to vote for Upstreamian parliament?

  **Elena:** You're hiding behind legal formalism. You're saying that because a border line was drawn on a map fifty years ago, moral reality changes. If I can drown your farm with a decision I make in a voting booth, I am exercising power over you. That power demands justification. The All-Affected Interests (AAI) principle says: if the decision significantly impacts your life, you get a say. It's the only way to avoid arbitrary oppression.

  **Marcus:** But "impact" is a slippery slope, Elena. This is the classic objection to your view. If Upstreamia builds the dam, maybe the price of cotton goes up globally. Does a textile worker in Vietnam now get a vote in Upstreamia? If Upstreamia pollutes the air, does the climate change affect a child in Norway? Does she get a vote? If you follow AAI to its logical conclusion, the *demos* becomes everyone on earth for almost every issue. You dissolve the boundary entirely. A democracy without a boundary isn't a democracy; it's a town hall meeting for the human race.

  **Elena:** That's a straw man. We're talking about *significant, direct* interests, not butterfly-effect trivia. We draw the line at foreseeable, substantial harm. The Downstreamian farmers aren't affected by a global market shift; they are affected by a physical deprivation of water caused by Upstreamia's legislation. We can draw a line. But your principle, the All-Subjected to Coercion (ASC) principle, draws the line in the wrong place. You say they aren't "coerced" because the law doesn't apply to them?

  **Marcus:** Precisely. Coercion in the democratic sense isn't just "stuff happening to you." It's about subjection to a common authority. When Upstreamia passes the Dam Act, it commands *its own citizens* to pay for it, *its own* engineers to build it, and *its own* police to protect it. The Downstreamians are facing a *consequence*, not a *command*. They are free to lobby their own government to sue, to build counter-dams, or to negotiate. They have political agency in Downstreamia. Giving them a vote in Upstreamia conflates being a victim of circumstance with being a subject of the state.

  **Elena:** But the "circumstance" is created by Upstreamia's sovereign choice! That's the circularity my students struggle with. You say they can't vote because they aren't subjects. But they *become* subjects of the dam's reality because they couldn't vote. If the boundary of the *demos* is fixed by citizenship, then citizenship becomes a tool for exclusion. Upstreamia can simply choose to externalize all its costs. They can vote to dump toxic waste on the border, knowing it flows into Downstreamia. Under your rule, they can vote to poison their neighbors with impunity because the neighbors aren't "coerced" by the law to dump the waste.

  **Marcus:** That is a strong point, I admit. If a state can export harm without accountability, ASC fails morally. But consider the reverse problem. If we let Downstreamia vote on Upstreamia's infrastructure, what stops Upstreamia from demanding a vote in Downstreamia's agricultural subsidies? If every affected party gets a vote, political communities lose the ability to determine their own collective fate. Democracy requires a "we." A group of people who share a life, a budget, and a future. If the "we" changes with every single policy issue based on who is affected, you don't have a stable political community. You have a fluid network of stakeholders. Who administers the election? Who counts the ballots?

  **Elena:** So you prioritize administrative convenience over moral rightness?

  **Marcus:** I prioritize the possibility of *self-determination*. For a people to govern themselves, they must be able to distinguish themselves from others. If the boundary is porous, the self is lost. However... I will concede this: The definition of "coercion" might need to be broader.

  **Elena:** Oh?

  **Marcus:** If Upstreamia's law *enforces* a restriction on the river flow that physically prevents Downstreamia from using water they previously had a right to under international treaty, is that not a form of coercion? It's not criminal law, but it is an assertion of control over a shared resource.

  **Elena:** Exactly! So you are admitting that the physical reality of the harm creates a political bond. The "coercion" isn't just the police officer at the door; it's the structural constraint on another community's freedom. If you accept that, you're moving closer to AAI. You're admitting that the *effect* of the law determines the boundary, not just the passport.

  **Marcus:** Not necessarily. I'm admitting that cross-border harm creates a need for *negotiation*, not necessarily *integration*. The solution isn't to give Downstreamia voters in Upstreamia's elections. That dilutes the voice of Upstreamians on issues that *only* affect them (like their local schools or healthcare). The solution is a joint commission or an international treaty. The *demos* for this specific issue should be a new, temporary body composed of both, not an expansion of Upstreamia's domestic electorate.

  **Elena:** Now *that* is interesting. So you're saying the boundary of the *demos* should be issue-specific?

  **Marcus:** For transboundary issues, yes. But for domestic issues, the ASC holds. Citizenship matters because it implies a reciprocal, ongoing relationship of law and protection.

  **Elena:** I can live with that, provided we acknowledge that "domestic" issues are rarer than we think. But let's bring this back to your students' debate about green card holders voting in local elections.

  **Marcus:** Ah. The residency question.

  **Elena:** Under your ASC view, a green card holder in a city is subject to that city's zoning laws, police power, and taxes. They are coerced by the local state. Therefore, by your own logic, they should vote locally, even if they aren't citizens of the nation.

  **Marcus:** *Pauses, stirring coffee.* ...That is the consistent application of ASC, yes. If coercion is the trigger for voting rights, then legal residency within a jurisdiction triggers local voting rights. Citizenship is the threshold for the *national* demos, but residency is the threshold for the *municipal* demos.

  **Elena:** And under my AAI view, it's even clearer. The school board decisions affect their children. The trash collection affects their health. Their interests are affected.

  **Marcus:** So on the green card issue, we actually agree?

  **Elena:** It seems so. The boundary problem breaks down when we assume there is only *one* demos. Maybe there are layered demoi.

  **Marcus:** A functional sovereignty for the nation-state, but a stakeholder sovereignty for local or transboundary issues.

  **Elena:** So, who wins the argument? AAI or ASC?

  **Marcus:** I think ASC wins on institutional stability. You need a fixed group to maintain the state apparatus. But AAI wins on moral legitimacy. You need the "affected" principle to check the state from abusing those outside its borders—or inside its borders but without citizenship.

  **Elena:** Then the boundary problem isn't a puzzle to be solved once and for all. It's a tension to be managed. We define the *demos* based on ASC to keep the lights on, but we constantly audit that boundary with AAI to make sure we aren't becoming tyrants.

  **Marcus:** *Raises coffee mug.* To the circularity, then. We can't define the people without a vote, and we can't vote without defining the people. So we just keep arguing about it.

  **Elena:** *Clinks mug.* That is democracy.

  ***

  ### Analysis for the Student

  This dialogue highlights why your teacher said this "broke your brain." There is no perfect, non-circular mathematical formula for who belongs in "the people."

  1.  **The Strength of ASC (Marcus):** It provides a clear, legal line (citizenship/residency). It protects the integrity of a political community so they can make decisions for their shared future. *Weakness:* It allows communities to ignore harm they cause to outsiders (or residents without citizenship).
  2.  **The Strength of AAI (Elena):** It is morally intuitive. It prevents tyranny over those who have no voice. *Weakness:* It is practically difficult. Almost everything affects someone, somewhere. It risks making political communities too fluid to function.

  **The Verdict:**
  In modern political theory, most scholars land where Elena and Marcus did at the end: **ASC is usually the default for *national* elections** (to maintain a stable state), but **AAI is increasingly used to argue for *local* voting rights (like your green card example) and international human rights protections.**

  Neither principle is "correct" in a vacuum. The "Boundary Problem" isn't a bug in democracy; it's a feature. It forces us to constantly ask: *Are we excluding people from decisions that control their lives?* If the answer is yes, the boundary needs to shift.
