answer: |-
  You have hit on one of the most common points of confusion in these debates, and honestly, your intuition is half-right. If you treat the Kalam and the Leibnizian arguments as the same thing, the physicists look like they're winning, and the philosophers look like they're cheating.

  But the short answer to your question is: **No, it isn't moving the goalposts.** It's because those two arguments are actually built on completely different engines. One cares about *time*; the other cares about *explanation*.

  Since you're coming at this with zero philosophy background (welcome to the rabbit hole, by the way), here is the breakdown of why philosophers think the argument survives even if the universe is eternal.

  ### 1. The Kalam Argument (The "Temporal" One)
  This is the one William Lane Craig (WLC) is famous for. It looks like this:
  1.  Whatever begins to exist has a cause.
  2.  The universe began to exist.
  3.  Therefore, the universe has a cause.

  You are absolutely correct that **this specific argument is vulnerable to the physicist's objection.** If Hawking is right and there is no "t=0" (no first moment), then Premise 2 gets shaky. If the universe didn't *begin*, it doesn't need a cause *in time*. The "North of the North Pole" analogy works perfectly here.

  When physicists crush the "Big Bang was the absolute beginning" idea, they are specifically attacking the Kalam. WLC knows this, which is why he spends half his time arguing that an "actual infinite" past is logically impossible regardless of what the physics says. But you're right: if the universe is past-eternal, the Kalam has a major headache.

  ### 2. The Leibnizian Argument (The "Contingency" One)
  This is the one that survives the "eternal universe" objection. It doesn't ask "When did this start?" It asks "Why is this here at all?"

  It looks like this:
  1.  Everything that exists has an explanation for its existence (either in its own nature or in an external cause).
  2.  The universe is the kind of thing that needs an explanation (it's "contingent").
  3.  Therefore, the universe has an explanation.

  **Here is the crucial difference:** This argument doesn't care about the past. It cares about **ontological dependence**.

  Imagine you are walking through a forest and you see a glowing ball hovering in the air. You ask, "What is powering that?"
  *   **Scenario A:** It appeared 5 seconds ago.
  *   **Scenario B:** It has been hovering there forever.

  In both scenarios, you still want to know: *Why is it glowing?* Even if it has been glowing for eternity, it doesn't explain *why* it glows. It could be a battery, it could be magic, it could be a projection. The *duration* of the object doesn't explain the *existence* of the object.

  Philosophers apply this to the universe. Even if the universe is eternal:
  *   Why is there *something* rather than *nothing*?
  *   Why does this universe have *these* laws of physics rather than others?
  *   Why does it have mass and energy at all?

  If the universe is "contingent" (meaning it *could* have failed to exist, or could have been different), philosophers argue it still needs an explanation for its nature, even if it never had a birthday. An eternal universe still needs a "sustainer" or a "ground of being."

  ### 3. So, is it moving the goalposts?
  When a philosopher of religion says, "The cosmological argument survives an eternal universe," they aren't changing the rules of the Kalam argument. They are switching to the Leibnizian argument, which was always there.

  Think of it like a lawyer having two defense strategies:
  *   **Defense 1:** "My client wasn't at the scene of the crime." (Kalam: The universe had a beginning).
  *   **Defense 2:** "Even if he was there, he didn't do it." (Leibniz: Even if the universe is eternal, it needs an explanation).

  If the prosecutor proves the client *was* at the scene (Physicist: The universe is eternal), Defense 1 fails. But the lawyer doesn't say, "Okay, new rule, being at the scene doesn't count." They just pivot to Defense 2.

  Academic philosophers of religion (like Alexander Pruss, Robert Koons, or Brian Davies) spend most of their time on Defense 2 (Contingency). WLC focuses on Defense 1 (Kalam) because it's punchier for debates and easier for a general audience to grasp in 20 minutes. "Everything that begins has a cause" is easier to digest than "contingent vs. necessary beings."

  ### 4. The "North Pole" Objection vs. Explanation
  The physicist's "North of the North Pole" objection is a critique of **temporal causality** (A happens before B). It says you can't have a cause *before* time exists.

  But the Leibnizian argument relies on **hierarchical causality** (A sustains B right now).
  *   **Temporal:** A parent causes a child. The parent can die, and the child lives on.
  *   **Hierarchical:** A hand moves a stick that moves a stone. If the hand stops moving *right now*, the stone stops moving, even if the stick has been moving the stone for a billion years.

  Philosophers argue that even an eternal universe is like the stone. It doesn't have the power of existence within itself (it's contingent). It needs a "hand" sustaining it *right now*, regardless of how long it has been around. The "North Pole" objection doesn't touch this, because this isn't about what happened *before* time; it's about what holds reality together *during* time.

  ### 5. The Catch (Where you might side with the physicist)
  While the argument *logically* survives an eternal universe, many people (including plenty of philosophers) think the Leibnizian argument has its own problems.

  The biggest one is: **Why does the explanation have to be God?**
  If the universe needs an explanation, why can't the explanation be "It just exists as a brute fact"? Or why can't the explanation be a multiverse generator that is itself eternal?

  The physicist might say: "Okay, fine, the universe needs no cause if it's eternal. Or if it needs an explanation, maybe the explanation is just the laws of quantum mechanics, which are brute facts."

  The philosopher replies: "But laws of physics are abstract descriptions. They can't *cause* anything. You need a mind/agent to choose them."

  And the debate continues.

  ### Summary
  *   **Your intuition:** Physicists destroy the idea that "everything needs a cause" by removing the beginning.
  *   **The Reality:** Physicists destroy the **Kalam** (which needs a beginning). They do *not* automatically destroy the **Leibnizian** argument (which needs an explanation, regardless of time).
  *   **Goalposts?** No. Philosophers distinguish between "What started it?" (Temporal) and "What sustains it?" (Ontological). You can remove the start, but the sustenance question remains.

  So, you aren't crazy for thinking the physicists make a strong point. They do make a strong point against the *beginning* of the universe. But the philosophers aren't ignoring that; they just argue that "Why is there anything at all?" is a deeper question than "How did it start?" and that question remains open even in an eternal universe.
