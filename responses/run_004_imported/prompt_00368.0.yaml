      *   If the metric is just "GPU hours allocated," then it is mathematically impossible for both to get $\ge 50\%$ if the split deviates from 50/50.
      *   If the metric is "satisfaction/utility," it's possible *if* the person who gets less time didn't need it as badly. But since deadlines are private and unverifiable, you can't guarantee this without risk.

