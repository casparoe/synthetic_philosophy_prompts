      *   **The Hard Truth:** Mathematically, you can't guarantee both get $\ge 50\%$ of the *hours* if the split ever changes. One must lose hours for the other to gain.
      *   **The Pivot:** Shift from "hours" to "utility/value."
      *   **The Solution:** Mechanism Design with Side Payments (Artificial Currency).
      *   **Mechanism:** "GPU Bucks."
          *   Start with equal budget.
          *   Bid on time slots.
          *   Winner pays loser.
          *   Loser now has more budget for next time.
      *   **Why it works:** Incentivizes truth-telling (if you bid high, you really need it). Compensates the loser (they get money for later).
      *   **Caveat:** Requires repeated interaction (not a one-off) or a way to cash out (authorship, coffee).
      *   **Alternative:** "I Cut, You Choose" variant (hard for homogeneous time).
      *   **Recommendation:** If it's a one-off, stick to 50/50. If recurring, use the currency system.

