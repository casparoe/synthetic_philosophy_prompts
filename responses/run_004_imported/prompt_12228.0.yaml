answer: |-
  This is an incredibly insightful question, and honestly, it shows a level of self-awareness that many people don't develop until much later in life. You are touching on a debate that happens frequently in psychology and education: **The tension between accommodation and exposure.**

  The short answer is: **It is almost certainly both.**

  The diagnosis likely identified a real vulnerability that was already there, *but* the specific way you were allowed to cope with it (total avoidance) likely trained your brain to become more afraid over time.

  Here is a breakdown of why this happens, why it isn't your fault, and how you can shift the trajectory now.

  ### 1. The Diagnosis: Description, Not Creation
  It is highly unlikely that the *label* itself created the anxiety from nothing. Social anxiety typically emerges in early adolescence (right around freshman year). Your brain was likely already wired to be hyper-aware of social judgment, and the physical symptoms (fear, avoidance) were real.

  If you hadn't gotten the diagnosis, you probably still would have felt the terror. The diagnosis didn't create the fire; it just named it. In that sense, the diagnosis was accurate.

  ### 2. The Accommodation: The Trap of "Safety Behaviors"
  This is where things get tricky. In psychology, avoiding the thing you fear is called a **"Safety Behavior."**

  *   **Short-term:** Safety behaviors work wonders. You didn't have to present. Your cortisol levels dropped. You felt safe.
  *   **Long-term:** Safety behaviors prevent your brain from learning that you can survive the threat.

  Think of it like this: If you are afraid of dogs, and every time a dog appears, someone immediately removes the dog, you never learn that the dog might just sniff you and walk away. You never learn that *you* are strong enough to stand there while a dog barks. By removing the presentations, the school inadvertently sent a message to your subconscious: *"This task is indeed dangerous, and you are not capable of handling it without protection."*

  Over two years, that message compounds. The "monster" in your head grows bigger because it has never been challenged by reality.

  ### 3. The Label: Identity vs. Experience
  There is also the element of identity. When you are 14 and an authority figure tells you, "You have Social Anxiety," it can easily morph from "I am experiencing anxiety" to "I am an Anxious Person."

  When you identify with the label, avoiding social situations stops feeling like a coping mechanism and starts feeling like staying true to who you are. *"I don't talk in class because I have social anxiety"* becomes *"I don't talk in class because that's not what people like me do."* This shrinks your world, making the outside of it seem even more intimidating.

  ### 4. So, did they mess up?
  It's easy to feel resentful toward the school or the system, but try to view it with nuance. Schools are often tasked with reducing immediate distress. They saw you suffering, and they removed the source of the suffering. That is compassionate in the moment.

  However, mental health recovery isn't just about removing pain; it's about building **tolerance**. The accommodation treated the *symptom* (not presenting) but didn't treat the *cause* (the fear of judgment). Without therapy to go along with the accommodation, the avoidance became a habit.

  ### 5. What do you do now? (The Good News)
  The fact that you are asking this question is the first step of recovery. You have realized that the strategy that saved you in 9th grade is hurting you in 11th grade. **Neuroplasticity is on your side.** You can retrain your brain.

  Here is how you can start to reverse the avoidance cycle:

  *   **Reframe the Accommodation:** You don't have to throw the accommodation away tomorrow, but you might want to modify it. Instead of "No presentations," could it be "Present to the teacher only," then "Present to one friend," then "Present to a small group"? This is called **Gradual Exposure**.
  *   **Low-Stakes Risks:** Start talking in class in ways that feel manageable. Ask a clarifying question. Answer a question where you know 100% that you are right. Prove to your brain that speaking does not result in catastrophe.
  *   **Separate Identity from Symptom:** Remind yourself: *"I am not 'an anxious person.' I am a person who is currently experiencing anxiety. Anxiety is something I feel, not who I am."*
  *   **Seek CBT:** If you have access to a therapist, look for someone who specializes in **CBT (Cognitive Behavioral Therapy)** or **ACT (Acceptance and Commitment Therapy)**. These modalities are specifically designed to break the avoidance cycle. They won't just let you talk about your feelings; they will give you homework to face them.

  ### Summary
  You weren't "made" anxious by the label, but you were likely *kept* anxious by the avoidance the label permitted.

  Please don't beat yourself up. You did what you needed to do to get through freshman and sophomore year. You survived. But now you are ready to thrive, and thriving requires stepping into the discomfort you were previously allowed to avoid. You are stronger than your anxiety thinks you are.

  *Disclaimer: I am an AI, not a mental health professional. This information is for educational purposes and should not replace professional medical advice.*
