answer: |-
  This is an excellent question. You have correctly identified that Leibniz is the ghost haunting the room whenever Kripke and Lewis start shouting at each other, but you are also right to suspect that forcing Leibniz into their binary is a category error.

  The short answer is: **Leibniz denies transworld identity (anti-Kripke), but he does not offer Counterpart Theory (anti-Lewis).** Instead, he offers a theory of *Possible Individuals* grounded in conceptual containment.

  Regarding your specific Australia scenario: On a strict Leibnizian view, **there is no "you" in the branch where your parents do not meet.** Not even a counterpart. There is only a *different possible individual* who shares some predicates with you but lacks your *haecceity* (thisness).

  Here is the argument for why the Kripke/Lewis dichotomy fails to carve Leibniz at the joints, and what that implies for your existence.

  ### 1. The Ontological Mismatch
  To understand why Leibniz fits neither camp, we have to look at the "stuff" possible worlds are made of.

  *   **Lewis (Modal Realism):** Possible worlds are concrete, spatiotemporally isolated universes. You are a physical object bound to *this* spacetime. You cannot be in another world any more than you can be in two places at once. Hence: Counterparts.
  *   **Kripke (Modal Actualism):** Possible worlds are abstract states of affairs. You are an object that can be "stipulated" to exist in different states of affairs. Identity is primitive; you travel across worlds via rigid designation.
  *   **Leibniz (Modal Conceptualism):** Possible worlds are **ideas in the Divine Understanding**. They are maximal sets of *concepts* that are compossible (consistent) with one another.

  For Leibniz, individuals *are* their concepts. There is no "bare particular" underneath the properties (as Kripke might allow) and no physical body bound to spacetime (as Lewis requires). You are a bundle of predicates contained in a Complete Individual Concept (CIC).

  ### 2. The Complete Individual Concept (CIC) and Identity
  This is the engine of Leibniz's metaphysics. The CIC contains *every* predicate true of an individual: past, present, future, and counterfactual conditions relative to that world.

  *   **Kripke:** "Nixon" rigidly designates the man. In World W, Nixon loses. The man is the same; the property "winning" changes.
  *   **Leibniz:** The concept "Nixon" *contains* the predicate "wins the 1968 election." If you conceive of a world where the winner of the 1968 election loses, you are not conceiving of *Nixon*. You are conceiving of a *different concept* that resembles Nixon.

  This is why Leibniz tells Arnauld that a sinless Adam would be "another Adam." For Leibniz, *in re* (in reality), all properties are essential to the concept. If you alter a property, you alter the concept. If you alter the concept, you have a different individual.

  Therefore, Leibniz **denies transworld identity**. The actual Adam exists only in the actual world (the best of all possible worlds). In other possible worlds, there are *possible Adams*, but they are numerically distinct concepts in God's mind.

  ### 3. Why It Isn't Counterpart Theory (The Lewis Divergence)
  If Leibniz denies transworld identity, why isn't he a Lewisian?

  For Lewis, counterparts are determined by **similarity**. My counterpart in another world is the guy who is most like me (similar origins, appearance, psychology). It is a vague, context-dependent relation.

  For Leibniz, the relation between "Actual Me" and "Possible Me-in-Australia" is not based on similarity; it is based on **conceptual derivation and compossibility**.
  1.  **Similarity is irrelevant:** A possible individual could be 99% similar to me, but if their concept contradicts the maximal series of the actual world, they are not "me."
  2.  **No "Standing In":** Lewis's counterpart *stands in* for me so I can say "I could have..." For Leibniz, statements about possibility are about God's intellect, not my agency across worlds. When we say "I could have been a philosophy major," we are speaking loosely. Strictly speaking, we mean "There is a possible concept in God's mind that resembles my actual concept but includes 'majoring in philosophy'."

  So, Leibniz agrees with Lewis that *actual* individuals are world-bound (or rather, world-specific), but he disagrees that the cross-world relation is one of *counterpart similarity*. It is a relation of *conceptual variation*.

  ### 4. The Australia Scenario: A Leibnizian Analysis
  Let's apply this to your mother's visa.

  **The Setup:**
  *   **Actual World (@):** Mom meets Dad -> You are conceived -> Your CIC includes "born to Mom & Dad in [Year]."
  *   **Possible World (W_Aus):** Mom's visa approves -> Mom moves to Australia -> Mom does not meet Dad -> You are not conceived.

  **The Question:** What is true of "you" in W_Aus?

  **The Argument:**
  1.  **Premise 1 (CIC):** Your individual concept contains all your properties, including your origin. "Being the child of Mom and Dad meeting in [Year]" is a predicate inscribed in your CIC. (Leibniz is a strong proponent of the essentiality of origin, arguably more so than Kripke).
  2.  **Premise 2 (Compossibility):** A possible world is a maximal set of compossible concepts. Your CIC is compossible with the series of events in @.
  3.  **Premise 3 (Incompossibility):** Your CIC is *incompossible* with the series of events in W_Aus. The predicate "Parents meet" is required for your concept; W_Aus contains the predicate "Parents do not meet."
  4.  **Conclusion:** Your CIC cannot exist in W_Aus.

  **The Consequence:**
  In W_Aus, there is no "you." There is not even a "you" who dies in the womb or is never born. The concept "You" *includes existence in @*.

  But what about the children your Mom *might* have had in Australia?
  Leibniz would say those are **distinct possible individuals**. Let's call one "Aus-Sibling."
  *   Aus-Sibling shares the concept "Child of Mom."
  *   But Aus-Sibling lacks the predicate "Conceived with Dad."
  *   Therefore, Aus-Sibling has a different *haecceity* (thisness).

  For Lewis, Aus-Sibling might be your counterpart (close enough genetic/psychological match). For Leibniz, Aus-Sibling is simply **another soul** in God's understanding. There is no transworld identity, and there is no counterpart relation that allows you to claim Aus-Sibling's life as a possibility *for you*.

  ### 5. Why the Dichotomy Fails
  The Kripke/Lewis fight assumes a distinction between the **object** and its **properties**.
  *   Kripke: Object stays, properties change.
  *   Lewis: Object stays (here), similar object (there) has different properties.

  Leibniz rejects the distinction. For him, **the object *is* the collection of properties.**
  *   If the properties change, the object changes.
  *   Therefore, asking "Is it *me* in the other world?" is like asking "Is the sentence 'The cat sat' the same sentence as 'The cat stood'?"
      *   Kripke says: Yes, same subject (The Cat), different predicate.
      *   Lewis says: No, different sentence, but similar meaning.
      *   Leibniz says: The subject "The Cat" is defined by the whole sentence. Change the verb, you change the subject.

  ### 6. The "Vibe" Check (Addressing your worry)
  You asked for an argument, not a vibe, but there is a scholarly caveat. Some interpreters (like Robert Adams in *Leibniz: Determinist, Theist, Idealist*) argue that Leibniz distinguishes between the *possible individual* (in God's mind) and the *actual individual*.
  *   The *Possible You* exists in God's mind across all worlds where you are compossible.
  *   The *Actual You* is the instantiation of that concept.

  However, even on this reading, the *Possible You* is not compossible with the Australia world. The concept "You" is intrinsically tied to the specific history of @. A "Possible You" that exists in W_Aus would have to have a different concept (different origin), which makes it a *different Possible Individual*.

  ### Summary for your Paper
  If you are writing this up, here is the thesis claim:
  **Leibniz anticipates Lewis's denial of transworld identity but rejects Lewis's metaphysical grounding. For Leibniz, individuals are world-bound not because of spatiotemporal isolation (Lewis), but because of conceptual containment. Consequently, in the "Australia World," you do not exist, nor do you have a counterpart. There exists only a distinct possible individual who shares a partial conceptual overlap (maternal origin) but lacks your haecceity.**

  This makes Leibniz more radical than both Kripke and Lewis. Kripke saves "you" by stripping away essential properties. Lewis saves "you" by finding a substitute. Leibniz says: **Change the history, and you change the soul.**

  So, to answer your existential worry: In the world where your mom goes to Australia, "you" are not sitting there wondering where you went. That world contains a different set of souls entirely. You are safe in your actuality, precisely because your concept requires your parents to meet.
