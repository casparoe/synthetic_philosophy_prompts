      *   *The Surprise Exam Paradox (SEP):* Traditionally, this involves backward induction. Students reason: "It can't be Friday (we'd know by Thursday), so it can't be Thursday..." leading to "It can't be any day." But then the exam happens on Wednesday and is a surprise.
      *   *Williamson's Twist:* He sees the backward induction as relying on the assumption that the students *know* their own epistemic state at each step (specifically, that they know they don't know the exam is tomorrow). This is a KK-style assumption. The failure of the induction mirrors the failure of luminosity. The "margin for error" here is temporal/epistemic uncertainty about one's own knowledge state.

