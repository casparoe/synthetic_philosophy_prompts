prompt: |-
  So this happened at my writers' group last week and I still haven't shaken it off. We workshopped a novel-in-progress by a guy named Kwame -- grim, well-written book about a Black family in a dying Rust Belt town: addiction, a shooting, nobody redeemed by the last page. Afterward, two others in the group, Ada and Sam, got into it over drinks and somehow ended up litigating W.E.B. Du Bois at eachother.

  Ada said no matter how good the prose is, the book does exactly what Du Bois warned about in "Criteria of Negro Art" -- his line that all art is propaganda and ever must be -- because a portrait this hopeless just becomes more ammo for readers who already assume the worst, whatever Kwame meant by it. Sam said that's a bad reading: Du Bois wasn't against ugliness, he was mad that Black writers got held to a purity test nobody applied to the minstrel and pulp junk already flooding the culture, and that demanding uplift is its own propaganda. Ada said fine, but Du Bois also tied beauty to truth AND justice, and a book that's all despair with no sense that injustice is being done to these people, rather than it just being their nature, fails the justice half even if every sentence in it is true. Sam said that sense is right there, just structural -- the housing, the plant closures, the cop who's never even named -- and that's a stricter ask than the one Ada started with. Ada came back with: fine, but then her real problem is Kwame's agent already pitching it as "unflinching," and that packaging decides what propaganda the book does no matter what he meant.

  Neither backed down, and I've got a manuscript of my own with basically this same problem, so I'd love an outside read. Can you go through this move by move and say who's got the better argument at each step, and what -- if anything -- they're both getting wrong about Du Bois's actual argument?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A writers' group workshop discussion about a novel by Kwame (grim, Black family, Rust Belt, no redemption).
      *   **The Conflict:** Two members, Ada and Sam, argued about W.E.B. Du Bois's "Criteria of Negro Art" in relation to the book.
      *   **The Positions:**
          *   *Ada:* The book is harmful propaganda (reinforces negative stereotypes) regardless of prose quality. Du Bois said art *must* be propaganda. Hopelessness without explicit injustice framing fails the "justice" criteria. Marketing ("unflinching") seals the deal on the propaganda effect.
          *   *Sam:* Du Bois wasn't against ugliness/truth; he was against double standards (purity tests). Demanding uplift is also propaganda. The injustice is structural (implied), not needing to be spelled out.
      *   **The User's Need:** They have a similar manuscript. They want an analysis of the argument "move by move," determining who has the better point at each stage, and crucially, what *both* might be getting wrong about Du Bois's actual essay.
      *   **Tone:** Analytical, nuanced, literary-critical, empathetic to the writer's dilemma.

  2.  **Deconstruct the Arguments (Move by Move):**

      *   *Move 1: The Definition of Propaganda.*
          *   Ada: Art *must* be propaganda (positive/uplifting). Hopelessness = negative propaganda.
          *   Sam: Demanding uplift is *also* propaganda. Du Bois fought against restriction, not for sanitized art.
          *   *Analysis:* Sam is closer to the nuance of Du Bois, but Ada hits on the *effect* of propaganda.
      *   *Move 2: Truth vs. Justice.*
          *   Ada: Truth isn't enough; needs Justice. Despair without context looks like "nature" rather than "oppression."
          *   Sam: Context is structural (housing, cops). It's there, just not didactic.
          *   *Analysis:* This is the core aesthetic tension. Show vs. Tell. Ada worries about reader reception; Sam worries about artistic integrity.
      *   *Move 3: The Market/Packaging.*
          *   Ada: The agent's pitch ("unflinching") dictates the propaganda value, not the text.
          *   Sam: (Implied defense of text over marketing).
          *   *Analysis:* Ada wins here. Context of consumption matters.

  3.  **Analyze Du Bois's "Criteria of Negro Art" (1926):**
      *   *Key Quote:* "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   *Context:* He was arguing *against* the idea that Black art should be "art for art's sake" *if* that meant ignoring the racial struggle. He wanted Black art to fight for equality.
      *   *Nuance:* He did *not* say art must be cheerful. He said it must portray Black people as *human*. He criticized stereotypes (minstrelsy) but also criticized white publishers who only wanted "sordid" or "comic" Black stories.
      *   *The Trap:* Both Ada and Sam are using Du Bois as a blunt instrument. Du Bois was balancing *truth* (showing the full range of human experience) with *political utility* (fighting racism).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the weight of the conversation. It's a classic debate (Protest Art vs. Aesthetic Autonomy). Validate the user's anxiety.
      *   **Move 1: "All Art is Propaganda."**
          *   *Ada:* Right that Du Bois said it. Wrong that propaganda only means "positive."
          *   *Sam:* Right that "uplift" is also propaganda.
          *   *Verdict:* Sam has the stronger textual reading, but Ada identifies the risk.
      *   **Move 2: Truth vs. Justice (The "Nature" of the Characters).**
          *   *Ada:* Fear that despair looks like inherent flaw. Valid concern about the "white gaze."
          *   *Sam:* Trust in subtext/structure. Valid defense of literary fiction.
          *   *Verdict:* Tie. Depends on execution. Is the structural critique legible?
      *   **Move 3: The Market ("Unflinching").**
          *   *Ada:* Marketing frames reception.
          *   *Sam:* (Silent here).
          *   *Verdict:* Ada wins. The package sells the book, not just the manuscript.
      *   **What Both Get Wrong About Du Bois:**
          *   Du Bois wasn't demanding *optimism*; he was demanding *humanity*.
          *   He hated *caricature* (both happy and sordid).
          *   He wanted Black artists to have the freedom to tell the truth, provided that truth served the larger goal of being seen as fully human.
      *   **Advice for the User's Manuscript:**
          *   Don't write for Ada or Sam. Write for the truth of the story.
          *   Check the "structural legibility." Is the oppression visible or just the suffering?
          *   Consider the "white gaze" without being enslaved by it.
          *   Marketing is a separate battle.

  5.  **Refining the Tone:**
      *   Avoid taking a hard side. The goal is to help the writer think, not to declare a winner.
      *   Ensure the Du Bois analysis is accurate (referencing the 1926 essay specifically).
      *   Make sure to address the "Rust Belt/Black Family" specific context (intersection of class and race).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "unflinching" marketing point? Yes, that's crucial.
      *   *Check:* Did I explain Du Bois correctly? Need to make sure I don't simplify him into just "pro-uplift." He was complex. He criticized Locke for being too aesthetic and others for being too crude. He wanted *truth* that advances *justice*.
      *   *Check:* Is the advice practical? Yes, focus on the "legibility of structure."

  7.  **Final Polish:** Organize with clear headings. Keep it engaging. (Proceed to generate output based on this structure.)
answer: |-
  This is one of the oldest, thorniest debates in Black literature, and it is completely understandable that it has stuck in your craw. Ada and Sam are reenacting a tension that has existed since the Harlem Renaissance: the friction between **aesthetic autonomy** (the right to tell any story) and **political responsibility** (the burden of representation).

  Because you have a manuscript with similar stakes, you need to know where their arguments hold water, where they leak, and where they are both misreading the historical text they are citing.

  Here is a breakdown of the argument move-by-move, followed by a correction on Du Bois, and finally, some advice for your own work.

  ### Move 1: The Definition of Propaganda
  **Ada:** Claims Du Bois said all art is propaganda, so a hopeless book is *negative* propaganda that arms racists.
  **Sam:** Claims demanding "uplift" is *also* propaganda, and Du Bois was fighting against purity tests.

  *   **Who wins the point:** **Sam.**
  *   **Why:** Ada is operating under a simplified definition of propaganda as "positive messaging." Sam correctly identifies that "uplift literature" (stories designed specifically to make Black people look good to white audiences) is just as propagandistic as stereotypes.
  *   **Where Ada is right:** She is right about the *consequence*. Even if Sam is right about the theory, Ada is right that in the real world, a book about Black despair consumed by a white majority often functions as confirmation bias.
  *   **Where Sam is right:** He is right that artistic freedom is the prerequisite for truth. If Black writers are only allowed to write "good" Black people, they are not allowed to write *human* people.

  ### Move 2: Truth vs. Justice (The "Nature" of the Suffering)
  **Ada:** Argues that truth isn't enough; the book needs *justice*. If the suffering isn't explicitly linked to systemic injustice, it reads like inherent cultural/natural flaw.
  **Sam:** Argues the justice *is* there, but it's structural (housing, plant closures, unnamed cops). It doesn't need to be didactic.

  *   **Who wins the point:** **It's a draw, depending on execution.**
  *   **The Crux:** This is the difference between **Naturalism** and **Social Realism**.
      *   Ada is arguing for Social Realism: The environment must be clearly identified as the antagonist. If the reader finishes the book thinking, "Black families are doomed," the book has failed the justice test.
      *   Sam is arguing for Literary Naturalism: The environment is the water the characters swim in. If the author has done their job, the reader should feel the pressure of the walls closing in without the author pointing at the walls.
  *   **The Risk:** Sam's defense only works if the structural critique is *legible*. If the "unnamed cop" and "plant closures" are background noise rather than active forces, Ada is right: the suffering will look like character flaw.

  ### Move 3: The Market ("Unflinching")
  **Ada:** The agent is pitching it as "unflinching." This packaging decides the propaganda, regardless of Kwame's intent.
  **Sam:** (Implicitly defends the text over the packaging).

  *   **Who wins the point:** **Ada.**
  *   **Why:** This is the strongest point Ada makes. A book does not exist in a vacuum; it exists in a marketplace. The term "unflinching" when applied to Black trauma is a specific marketing code. It signals to white liberal readers: *This is the gritty truth you are brave enough to face.* It signals to Black readers: *Here is more pain for your consumption.*
  *   **The Reality:** Sam cannot argue against this. Once the book is commodified, the author loses control of the "propaganda." If the jacket copy sells misery, the book becomes misery porn, regardless of the prose quality.

  ---

  ### What Both Are Getting Wrong About Du Bois

  Both Ada and Sam are using Du Bois as a blunt instrument, but W.E.B. Du Bois's 1926 essay *"Criteria of Negro Art"* is far more nuanced than either of them is allowing.

  **1. Du Bois did not demand "Uplift." He demanded "Humanity."**
  Ada implies Du Bois wanted art that made Black people look "good." He didn't. He wanted art that made Black people look *real*. He wrote: *"I do not care a damn for any art that is not used for propaganda. But I do not care when the propaganda becomes sheer lies and is not art."*
  The key word is **lies**. To Du Bois, a stereotype (the happy slave) was a lie. But so was a caricature of inherent criminality. However, a tragic story about a good man crushed by an unjust system was *truth*. If Kwame's book shows good people crushed by an unjust system, it fits Du Bois. If it shows broken people with no context for why they are broken, Du Bois might agree with Ada.

  **2. Du Bois was fighting a two-front war.**
  Sam thinks Du Bois was only fighting white racism. Ada thinks Du Bois was only fighting negative stereotypes. Du Bois was actually fighting **white publishers** who only wanted "sordid" stories *and* **Black critics** who only wanted "respectable" stories.
  He wrote: *"We wear the mask... but we also know the truth."* He wanted art that pierced the mask without destroying the person underneath. He was arguing that Black artists should have the freedom to depict the full range of human experience (including ugliness) *provided* that the depiction didn't reinforce the idea that Black people were sub-human.

  **3. The "Justice" Criterion.**
  Ada says the book fails the "justice" half of Du Bois's criteria. But Du Bois defined justice as the right to be seen fully. He wrote: *"What have we done to deserve this?"* was a question art should ask.
  If Kwame's book asks that question through its structure (as Sam argues), it meets Du Bois's criteria. If the book presents suffering as inevitable fate (determinism) rather than the result of specific injustices, it fails. Du Bois believed in **agency**. If the characters have no agency and the system has no name, that leans toward a worldview Du Bois rejected.

  ---

  ### Advice for Your Manuscript

  You are holding a manuscript that lives in this same tension. Here is how to navigate it without letting Ada or Sam write the book for you.

  **1. Audit the "Legibility of Structure."**
  Sam's argument relies on the idea that the systemic oppression is obvious. Be honest with yourself: Is it?
  *   **The Test:** Give a chapter to a beta reader who doesn't know you. Ask them: *"Why do you think this bad thing happened to this character?"*
  *   If they say, *"Because the system is rigged,"* Sam is right.
  *   If they say, *"Because that's just how life is,"* or *"Because of bad choices,"* Ada is right.
  *   **The Fix:** You don't need to add a speech about capitalism. You just need to ensure the *consequences* of the structural issues are visible. If a plant closes, show the check bouncing. If a cop is predatory, show the paperwork that protects him. Make the invisible visible.

  **2. Distinguish between "Despair" and "Tragedy."**
  There is a difference.
  *   **Despair** implies nothing matters and nothing can change. It is static.
  *   **Tragedy** implies a conflict between a human being and a force greater than them (fate, gods, society).
  *   Du Bois would accept Tragedy. He would reject Despair. Ensure your characters are *fighting*, even if they lose. If they are purely passive victims of their environment, you risk the "nature vs. nurture" trap Ada is worried about.

  **3. Prepare for the Marketing Battle.**
  Ada is right that the pitch matters. You cannot control your agent entirely, but you can have this conversation early.
  *   If your book is grim, avoid marketing language that fetishizes the pain ("gritty," "unflinching," "raw").
  *   Push for language that highlights the *humanity* or the *specificity* of the world ("a portrait of a family," "a love letter to a dying town").
  *   Frame the "propaganda" yourself in your author statement. If you don't define the book's political intent, the market will define it for you.

  **4. The Verdict.**
  Du Bois would likely tell you to write the book you need to write, but to write it with **precision**.
  *   If the hopelessness is the *truth* of that specific town and family, write it. To sanitize it would be the "lie" Du Bois warned against.
  *   But ensure that the hopelessness is diagnosed, not just displayed.

  Don't let Ada silence your truth, but don't let Sam convince you that context is automatic. The middle path is **rigorous honesty**. Show the ugliness, but ensure the reader knows *who made the mess*, even if the characters can't clean it up.
