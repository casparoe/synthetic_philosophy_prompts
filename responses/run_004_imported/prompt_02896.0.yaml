answer: |-
  ### The Scenario: The "Model Minority" Debug

  **Context:** A high-stakes software engineering team is troubleshooting a critical server failure at a tech firm. The team must decide immediately whether to reboot the system (risking data loss) or patch the code (risking prolonged downtime).

  **The Speakers:**
  *   **Speaker A (David):** An Asian-American senior engineer.
  *   **Speaker B (Mark):** A White senior engineer of equal tenure and proven track record.

  **The Hearer:**
  *   **Sarah (Project Manager):** She must decide which diagnosis to trust.

  **The Prejudice:** Sarah holds a subconscious, positive identity prejudice (a "competence stereotype") that Asian-American men possess innate, superior technical intuition. This is a "Model Minority" trope applied to technical skill. She holds no corresponding *negative* stereotype about White men's technical abilities; she regards Mark as fully competent and reliable in general.

  **The Event:** David and Mark offer conflicting diagnoses. David asserts the issue is hardware-based (requiring a reboot). Mark asserts the issue is software-based (requiring a patch). Based on her positive identity prejudice toward David, Sarah grants David **excess credibility**. She accepts his diagnosis as infallible without requesting the usual log data verification. Consequently, she assigns a **credibility deficit** to Mark. She dismisses his software diagnosis not because she thinks Mark is incompetent (no prejudice *against* him), but because she has already allocated the totality of epistemic trust to David. She assumes that if David is right (which she is biased to believe), Mark *must* be wrong.

  **The Outcome:** The team reboots. Data is lost. It turns out Mark was right. Mark suffers a testimonial injustice: his knowledge was unfairly deflated, and his professional standing is damaged by being "wrong."

  ### Why This Is Genuine Comparative Proportionality

  This scenario instantiates Medina's proportional view rather than a disguised Frickerian case for two key reasons:

  1.  **Absence of Independent Prejudice Against the Victim:** In a standard Frickerian case, the hearer deflates Speaker B's credibility because of a negative stereotype *about B* (e.g., "White men are arrogant and sloppy"). In this scenario, Sarah has no negative identity prejudice against Mark. If David were not present, Sarah would likely afford Mark standard, appropriate credibility. Mark's deficit is not intrinsic to his identity; it is extrinsic, caused entirely by the inflation of David's credibility.
  2.  **The Zero-Sum Mechanism:** The injustice operates through a "credibility economy." Epistemic attention and trust are finite resources in a crisis. By granting David *excess* credibility (treating his word as beyond question), Sarah structurally necessitates a deficit for any contradictory testimony. Mark's word is silenced *because* David's word was amplified. The deficit is mathematically relational: $Credibility_{Total} - Credibility_{A(excess)} = Credibility_{B(deficit)}$.

  This demonstrates Medina's claim that credibility judgments are inherently comparative. We do not judge speakers in a vacuum; we judge them against one another. When identity prejudice inflates one side of the comparison, it mechanically deflates the other, regardless of the second speaker's identity.

  ### Implications for Fricker's Framework

  This example suggests that **Fricker's hearer-prejudice-against-the-victim framework is too narrow** for capturing the structural nature of testimonial injustice.

  1.  **Blind Spot to Privilege-Based Harm:** Fricker's definition requires a negative identity prejudice *directed at the victim*. This focuses epistemic injustice primarily on the experience of the marginalized. However, as the scenario shows, identity *privilege* (David's unearned excess) can generate injustice for others (Mark) without direct animus. Fricker's framework struggles to categorize Mark's experience as *testimonial injustice* because the specific psychological condition she requires (prejudice against Mark) is absent.
  2.  **Individual vs. Structural:** Fricker's model is largely individualistic (Hearer $\rightarrow$ Speaker). Medina's proportional view highlights the *structural* distribution of credibility. It shows that injustice can circulate through a system where privilege hoards epistemic authority, leaving others with a deficit even if they are not the primary target of stigma.
  3.  **The Nature of the Wrong:** For Fricker, the primary wrong is the insult to the speaker *qua* knower caused by stigma. For Medina, the wrong is the distortion of the communal pool of knowledge. In the example, Mark is wronged not just as an individual, but as a participant in a collaborative inquiry where the rules of evidence were suspended for a privileged peer.

  By rejecting Medina's proportional view, Fricker risks rendering invisible the ways in which **credibility excess** actively harms the epistemic community. If we only look for prejudice against the victim, we fail to see how unearned trust in the privileged can be just as destructive to collective knowledge as unearned distrust in the marginalized. Medina's expansion allows us to identify testimonial injustice in cases where the mechanism is **relative deprivation** driven by privilege, rather than **absolute denigration** driven by stigma.
