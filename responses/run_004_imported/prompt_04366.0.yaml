answer: |-
  **SCENE:** *A gray, foggy highway. The car is idling at an exit ramp. The sign is blank. ALEX, the driver, has both hands on the wheel, knuckles white. Standing on the shoulder outside the passenger window are two figures who seem to have materialized from the mist. MARA wears a sharp suit and holds a clipboard. DAVID wears a rumpled blazer and leans casually against the guardrail.*

  **ALEX:** (Muttering) Exit 1 is disaster. Exit 2 is home. Driving past both is… fine, I guess. But I don't know which one this is. I literally don't know.

  **MARA:** (Tapping the clipboard) And that uncertainty is exactly why the math is screaming at you. Alex, listen to me. Before you started this trip, at the planning stage, you calculated an optimal strategy. Let's say you decided to continue driving with probability $p$. You had an expected value for the whole trip. Let's call it $V_{start}$.

  **DAVID:** (Chewing on a toothpick) She's not wrong about the start. But she's about to lie to you about the now.

  **MARA:** I'm not lying. I'm updating. Alex, think about it. You are at an intersection. What is the probability this is Exit 1? It's not 50/50 anymore. It depends on your strategy $p$. If you were likely to stop at Exit 1, then the fact that you are *here* makes it more likely you are at Exit 1. You have gained information simply by existing at this node.

  **DAVID:** He knew he would exist at a node. That's not new information. That was guaranteed.

  **MARA:** It's *self-locating* information. He knows "I am at an intersection," but he doesn't know "I am at Intersection 1." When you update your beliefs based on that, the expected payoff of continuing changes. In fact, Piccione and Rubinstein proved that the value of the game *right now*, at the intersection ($V_{node}$), is actually higher than $V_{start}$.

  **ALEX:** Higher? How can it be higher? I haven't done anything. I haven't picked up any money.

  **MARA:** Because the conditional probability shifts the weight. And here is the paradox, Alex: Imagine before you left your driveway, someone offered you \$100 to cancel the trip. You would have taken it, because $V_{start}$ was low. But now that you're here? Because $V_{node}$ is higher, you would reject that same \$100 offer. You are more optimistic now than you were an hour ago, despite learning nothing about the road. That is time inconsistency. That is a paradox.

  **DAVID:** (Pushes off the guardrail) It's only a paradox if you think the "Alex at Exit 1" and "Alex at Exit 2" are different people playing a poker game against each other. They aren't. It's the same brain.

  **MARA:** But the brain has imperfect recall!

  **DAVID:** Imperfect recall doesn't break causality. Look, Alex. Mara wants you to optimize your *action* right here. "Given I'm here, what maximizes my payoff?" But you can't do that. Because if you change your mind here, you have to admit you would have changed your mind at the other intersection too. They look identical. You can't tell them apart. So whatever rule you apply here, applies there.

  **MARA:** That's begging the question. Why must the rule apply there? I'm *here*.

  **DAVID:** Because you're the same driver! Aumann, Hart, and Perry showed this. If you calculate the optimal move at this intersection, you must constrain yourself: "If I choose to exit with probability $q$ here, I must have exited with probability $q$ at the other one too." Once you add that constraint—once you realize you are controlling a *policy*, not a single turn—the optimal $q$ is exactly the same as the optimal $p$ you calculated at the start. The value doesn't jump. The paradox dissolves.

  **MARA:** (Leaning into the window) But David, that ignores the belief update! You're telling him to ignore the evidence of his own existence. If I tell you, "I'm going to flip a coin. If Heads, I wake you once. If Tails, I wake you twice. You wake up. What are the odds it's Tails?"—you have to update.

  **ALEX:** Wait, that sounds like that Sleeping Beauty thing I read about. The coin toss amnesia setup?

  **MARA:** Exactly! It's the same epistemic structure. In Sleeping Beauty, waking up gives you evidence about the coin. Here, arriving at an intersection gives you evidence about which intersection it is. If you ignore that, you're throwing away Bayesian updating.

  **DAVID:** Sleeping Beauty is about betting on the *state of the world* (the coin). This is about *choosing an action* that affects the world. In Sleeping Beauty, her belief doesn't change the coin flip. Here, Alex's decision at Exit 1 determines whether he even *reaches* Exit 2. That's the causal link Mara is glossing over.

  **MARA:** I'm not glossing over it. I'm saying the causal link creates the inconsistency. Because the decision at Exit 1 affects reaching Exit 2, the probability of *being* at Exit 2 depends on the strategy at Exit 1. When you sit at Exit 1, you have to treat the strategy as a given to calculate your location probability. But then, once you have that probability, you want to change the strategy! It's a loop.

  **DAVID:** It's not a loop, it's a fixed point. You solve for the strategy that is optimal given that it will be used at both points. Mara, you're arguing that Alex should accept a buyout now that he would have rejected earlier. Let's test that. Alex, if you reject the \$100 now because you feel "luckier," what happens if you continue and it turns out this *was* Exit 1?

  **ALEX:** Then I crash. Worst outcome.

  **DAVID:** Right. And if you had stuck to the plan you made at the start, you would have accounted for that risk. Mara's logic suggests you should be risk-tolerant now, but risk-averse then. Which Alex is the rational one? The one with the full map at the start, or the one amnesiac in the fog?

  **MARA:** The one with the updated beliefs! Rationality requires using all available information. The information "I am at a node" is available now and wasn't available at the start. Specifically, the likelihood ratio shifts. If your plan was to almost always exit at 1, being at a node makes it overwhelmingly likely you are at 1. If your plan was to drive past both, being at a node makes it likely you are at 2. You have to balance that. When you do, the math says the node value is higher.

  **DAVID:** The math says that only if you treat the two nodes as independent decision makers. If you treat them as one agent with a single control lever, the value is constant. Mara, you're essentially telling him to make a deal with himself that he can't enforce. "I'll continue now, hoping Past-Me drove past Exit 1." But Past-Me is *him*.

  **MARA:** No, I'm telling him that the "self" is fragmented by memory loss. If I can't remember if I've been here, I have to treat my past self like a stranger whose actions I observe to gauge my location.

  **DAVID:** But you aren't just observing. You're driving. If you decide "I will exit 50% of the time," that decision retroactively defines the probability that you are at Exit 1 versus Exit 2. You can't take those probabilities as fixed inputs to your decision. They are outputs of your decision.

  **ALEX:** (Rubbing his temples) Okay, stop. Both of you. So, Mara says I should feel richer now than I did at home, and David says I'm just confused because I'm forgetting I control the whole car.

  **MARA:** I say you should recognize your leverage has changed.

  **DAVID:** I say your leverage is identical, you just lost the manual.

  **ALEX:** But I have to move. The car is running. If I listen to Mara, I might demand more money to quit now than I would have five miles ago. If I listen to David, I stick to the plan I made when I could actually see the map.

  **MARA:** Sticking to the plan ignores the evidence of your eyes!

  **DAVID:** There is no evidence in his eyes! It's fog! The only evidence is the logic of the situation, and the logic says consistency wins. Alex, if you change your strategy now, you prove that your original plan was flawed. But if your original plan was flawed, you wouldn't have reached this point with that strategy. It collapses.

  **MARA:** Or it reveals that planning and acting are fundamentally different games when memory is imperfect. That's the point! It's not a bug; it's a feature of agency. We aren't consistent over time when we forget who we are.

  **ALEX:** (Sighs) Great. So I'm either a paradox or a glitch.

  **DAVID:** You're a driver. Just pick a probability $p$ that maximizes your payoff assuming you use it at *both* exits. Don't try to outsmart your own amnesia.

  **MARA:** Or, acknowledge that the "you" at the start and the "you" now have different information sets, and optimize for the "you" that is actually holding the steering wheel.

  **ALEX:** (Looks at the blank sign. Looks at the road ahead.) You know… the Sleeping Beauty girl, when she wakes up, she still has to guess the coin. She doesn't get to change the coin.

  **MARA:** But she gets to bet differently.

  **DAVID:** Only if she's betting on how many times she wakes up, not on the coin itself.

  **ALEX:** (Puts the car in drive) I think I prefer David's version. Not because I'm sure he's right, but because Mara's version means I can't trust the guy who started the car. And he's the only one who knew where home was.

  **MARA:** (Shaking her head) You're ignoring the value of the present moment.

  **DAVID:** (Nods) He's respecting the continuity of the agent.

  **ALEX:** I'm respecting the fact that if I exit here and it's Exit 1, I'm screwed either way. So I'll stick to the $p$ we calculated at the start.

  *Alex accelerates. The car moves forward into the fog. Mara and David fade back into the mist, still arguing.*

  **MARA:** (Fading out) But the expected utility calculation *does* shift!

  **DAVID:** (Fading out) Only if you sever the causal chain!

  *The taillights disappear. The highway is silent.*
