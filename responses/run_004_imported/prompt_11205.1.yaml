          2.  Argument 1: The Folk Theorem of Program Equilibrium (Any outcome is possible).
          3.  Argument 2: The FairBot Vulnerability (CooperateBot exploitation).
          4.  Argument 3: The Meta-Game Regress (Program selection is just another PD).
          5.  Conclusion: PE is a mechanism, not a moral/normative solution.

  7.  (Self-Correction during drafting): Make sure to mention *PrudentBot* or *Masquerade* as counter-examples to FairBot to show that "niceness" is a parameter, not a theorem.

  8.  Final review against constraints: "Get into the mechanics," "Strongest version of my side," "No hand-wavy trust stuff." Okay, I will focus heavily on the equilibrium selection problem and the specific mechanics of why FairBot isn't unique.

      *(Self-Correction on Tennenholtz)*: Tennenholtz's 2004 paper specifically proves that for any feasible and individually rational payoff vector, there exists a program equilibrium. This is exactly the Folk Theorem. I need to make sure this is the centerpiece.

      *(Self-Correction on FairBot)*: FairBot cooperates with CooperateBot. This is often cited as a bug by decision theorists who want "unexploitability." A rational agent should defect against CooperateBot. This supports the user's claim that FairBot isn't the pinnacle of rationality, just a specific design choice favoring cooperation.

