prompt: |-
  I have no background in philosophy or cognitive science, but I've spent six years as the parent representative on my school district's accommodations review committee, and one case on our agenda for Thursday has been keeping me up at night. A ninth-grader I'll call Eli suffered a severe episode of autoimmune encephalitis two years ago that left him with a lasting deficit in forming new long-term memories. Since then he has kept an obsessively detailed log on his phone -- covering everything from class material to what his friends said at lunch -- which he updates himself, in his own words, as things happen. By his own account and his neurologist's, he doesn't experience consulting it as "looking something up," any more than you or I experience recalling a childhood address as looking it up: he reaches for it automatically, trusts what it tells him without double-checking, and has done so every day for two years.

  His mother has asked the committee to let him consult the log during the district's closed-book final exams, which currently prohibit personal devices and notes on the grounds that finals are meant to certify what a student has internalized, not what they can retrieve from something outside their own head. Her position is that taking the phone away for three hours during a final isn't leveling the playing field, it's disabling part of the system that does his remembering, the same way confiscating another student's glasses before a vision-dependent task would. Our assessment coordinator, for whom I have a great deal of respect, disagrees just as sincerely: she points out that glasses don't contain the material being tested, whereas Eli's log does, so allowing it doesn't correct a deficit against a shared baseline, it changes what the exam measures; and she worries that "this is really just part of how I think" is exactly what any sufficiently diligent student could say about a very good cheat sheet, so the committee needs some principle that doesn't just collapse into whatever a family sincerely believes.

  We reconvene Thursday, and since I was the one who asked for more time, I'm the one who has to circulate something beforehand. Could you draft that memo for me? I need a clear recommendation -- allow the log, deny it, or allow it under specific conditions -- along with reasoning the rest of the committee could actually engage with point by point. I know my own sympathies already lean toward the mother, so I'd especially like the strongest, least dismissible version of the coordinator's worry represented fairly, not a straw version of it. Finals are five weeks away, and since we're supposedly using this case to set a general policy rather than a one-off ruling, I'd also like the memo to say what would distinguish Eli's situation from that of a student who simply wants to bring notes into the exam room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Parent representative on a school district's accommodations review committee (6 years experience).
      *   **Context:** Ninth-grader (Eli) with autoimmune encephalitis causing long-term memory deficits. Uses a detailed phone log (self-written, automatic trust) as an external memory aid.
      *   **Conflict:** Mother wants him to use the log during closed-book finals (analogy: glasses). Assessment Coordinator opposes it (analogy: cheat sheet, changes what is measured, slippery slope).
      *   **Task:** Draft a pre-meeting memo for the committee.
      *   **Requirements:**
          *   Clear recommendation (Allow, Deny, or Conditional).
          *   Reasoning engageable point-by-point.
          *   Fair representation of the Coordinator's strongest argument (no strawmanning).
          *   Distinguish Eli's case from standard note-taking/cheating (policy precedent).
          *   Tone: Professional, thoughtful, balanced, suitable for a committee setting.
          *   Deadline: Meeting is Thursday, finals in 5 weeks.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Upholds the "internalized knowledge" standard. Safe, but potentially discriminatory against a disability that fundamentally alters *how* memory works. Ignores the medical reality that the phone *is* his hippocampus now.
      *   *Option B (Allow Unrestricted):* Validates the "glasses" analogy. Risks undermining the validity of the exam if the log contains *answers* rather than *facts*. Hard to police.
      *   *Option C (Allow with Conditions):* This is the most nuanced and defensible path. It acknowledges the disability accommodation need while protecting the academic integrity of the exam.
      *   *Decision:* Recommend **Allowing the log under specific, strict conditions**. This bridges the gap between the mother's civil rights argument and the coordinator's validity argument.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty of the case.
      *   **Case Summary:** Briefly recap Eli's situation (medical diagnosis, nature of the log, usage pattern). Keep it objective.
      *   **The Core Conflict:** Frame the two positions fairly.
          *   *Parent/Advocacy View:* Functional equivalence (phone = hippocampus).
          *   *Assessment View:* Construct validity (exam measures internal retention, not retrieval).
      *   **Analysis of the "Glasses" Analogy:** This is crucial. I need to dissect *why* it works and *where* it breaks down.
          *   *Works:* It's a prosthetic for a biological function.
          *   *Breaks:* Glasses correct the *input* mechanism (vision); the log corrects the *storage/retrieval* mechanism. But if the storage is gone, retrieval *must* be external.
      *   **Addressing the Coordinator's Concern (The "Cheat Sheet" Slippery Slope):** This needs to be the strongest part. How do we stop every kid from saying "I think better with notes"?
          *   *Distinction:* Medical necessity vs. preference.
          *   *Distinction:* Automaticity/Integration. Eli doesn't "study" the log; he *lives* in it. It's not a summary; it's a raw data stream.
          *   *Distinction:* The "Internalization" standard. For Eli, internalization *includes* the log. For others, it doesn't.
      *   **Recommendation & Conditions:**
          *   Allow the device.
          *   *Condition 1:* Content restriction (no pre-written answers/essays, only factual logs).
          *   *Condition 2:* Verification (neurologist/psychologist confirmation of the *nature* of the dependency).
          *   *Condition 3:* Monitoring (ensure he's not communicating with others).
      *   **Policy Precedent:** How does this apply to future cases? It sets a bar for "cognitive prosthetics."
      *   **Closing:** Call to action for Thursday's meeting.

  4.  **Refining the Tone:**
      *   Avoid emotional pleading. Use administrative and ethical reasoning.
      *   Ensure the Coordinator's argument is stated so well that she would nod in agreement reading it. (e.g., acknowledge that exams *do* measure retention, and changing that changes the credential).
      *   Ensure the Parent's argument is treated as a civil rights/access issue, not just "it's hard for him."

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the distinction between "glasses" and "notes" clear enough?
      *   *Fix:* I need to emphasize the *automaticity* aspect. Eli doesn't choose to use it; he *has* to use it to function, just like a myopic person has to squint or blur without glasses. A normal student *chooses* to check notes.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Make the conditions specific (e.g., "read-only mode," "audit of log entries").
      *   *Critique:* Did I answer the prompt's request for a "clear recommendation"?
      *   *Fix:* Put it in bold early on.

  6.  **Final Polish:** Check against the prompt's specific constraints (no background in philosophy/cognitive science, but 6 years committee experience). The language should be practical, not academic jargon-heavy, but conceptually rigorous. (e.g., use "construct validity" but explain it simply).

  7.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Accommodations Review Committee
  **FROM:** [Your Name], Parent Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Accommodation Request for Student "Eli" (Grade 9)

  **Purpose**
  This memo serves as a pre-read for Thursday's committee meeting regarding the accommodation request for a ninth-grade student (hereafter "Eli") diagnosed with lasting memory deficits following autoimmune encephalitis. Specifically, we must decide whether Eli may consult his personal digital memory log during closed-book final examinations.

  As we are using this case to establish precedent for future cognitive accommodation requests, it is vital that our decision rests on a defensible principle rather than a singular exception. Below is a summary of the conflicting positions, an analysis of the core ethical and pedagogical stakes, and a specific recommendation for committee consideration.

  **Case Summary**
  Eli suffers from a documented inability to form new long-term memories. To function academically and socially, he maintains a detailed, chronological log on a secured mobile device. He updates this log in real-time. Crucially, clinical assessment indicates Eli does not experience consulting this log as "research"; he experiences it as *recall*. He trusts the data implicitly and accesses it automatically.

  **The Conflict**
  We are currently divided between two valid perspectives:

  1.  **The Access Argument (Parent/Advocacy):** Removing the device during an exam effectively removes Eli's ability to remember. If the goal of accommodations is to neutralize the disadvantage of a disability, confiscating the tool that performs his memory function is akin to confiscating a screen reader from a blind student or glasses from a myopic student during a test.
  2.  **The Validity Argument (Assessment Coordinator):** Closed-book exams measure *internalized retention*, not *information retrieval*. Glasses correct the *input* of information (vision); Eli's log contains the *content* of information (facts, notes, data). Allowing the log changes the construct of the exam from "what do you know?" to "what can you find?" If we accept "this is how I think" as a justification, any diligent student could argue their study notes are an extension of their memory, potentially eroding the standard for all students.

  **Analysis: Distinguishing Prosthetics from Aids**
  To resolve this, we must distinguish between a **cognitive prosthetic** and a **study aid**.

  The Coordinator's concern is the strongest point of resistance: if we allow external storage, do we invalidate the diploma? However, the "slippery slope" argument relies on the assumption that any student could claim their notes are essential to their thinking. We can reject this without dismissing Eli's need by applying three specific criteria that distinguish Eli's log from a standard cheat sheet:

  1.  **Medical Necessity vs. Preference:** A standard student *prefers* notes to reduce cognitive load. Eli *requires* the log to bypass a biological blockage. Without the log, Eli has zero access to the information. Without notes, a standard student has reduced access.
  2.  **Integration and Automaticity:** Eli's usage is non-volitional in the way standard recall is. He does not "decide" to check the log any more than a sighted person decides to process visual data. It is his primary retrieval mechanism. A standard student's use of notes is a strategic choice made during the test.
  3.  **The Nature of the Content:** A cheat sheet is a *synthesis* of material created for the purpose of testing. Eli's log is a *raw record* of experience created for the purpose of daily functioning. It is not optimized for testing; it is optimized for living.

  **Recommendation**
  I recommend that the committee **APPROVE the accommodation, subject to strict verification and content conditions.**

  Denying the request effectively grades Eli on his disability rather than his mastery of the subject. However, to address the Assessment Coordinator's valid concerns regarding exam validity and precedent, I propose the following conditions:

  **1. Verification of "Functional Memory" Status**
  We require a supplemental letter from Eli's neurologist or neuropsychologist explicitly stating that the device functions as a *prosthetic for memory retrieval*, not merely as a study aid. It must confirm that Eli lacks the biological capacity to internalize the information regardless of study time.

  **2. Content Restrictions (The "Raw Data" Rule)**
  The log may be used, but it must remain in its native, chronological format.
  *   **Allowed:** Time-stamped entries of class notes, conversations, and observations made at the time of learning.
  *   **Prohibited:** Any post-hoc summaries, "study guides," or indexed answers created specifically for the exam. The log must look the same on exam day as it did three weeks prior. This ensures the device is acting as a memory archive, not a test-specific key.

  **3. Device Security**
  The device must be placed in a "kiosk mode" or similar lockdown configuration that prevents internet access, messaging, or accessing apps other than the specific logging application during the exam.

  **Policy Precedent**
  Approving this under these conditions does not open the door for all students to bring notes. It establishes a policy for **Cognitive Prosthetics**. Future requests would need to meet the same high bar:
  *   Documented biological inability to perform the cognitive function internally.
  *   Evidence that the external tool is integrated into the student's daily cognitive process, not just test preparation.
  *   Assurance that the tool contains raw data, not test-specific synthesis.

  **Next Steps**
  If the committee agrees with this framework on Thursday, we can authorize the accommodation in time for finals in five weeks. This allows the Assessment Coordinator time to work with Eli's teachers to audit the log for compliance with the "Raw Data" rule before exam day.

  I look forward to discussing this with you all on Thursday.

  **[Your Name]**
  Parent Representative
  Accommodations Review Committee
