      *   *Is fatalism refuted?* Philosophically, compatibilists argue against fatalism. But decision theorists aren't fighting metaphysics; they are building models of rational choice. Even in a deterministic world, we need a decision theory that works.
      *   *Key distinction:* The user thinks the problem is "Can he escape?" The theorist thinks the problem is "Can the theory recommend a choice without contradicting itself?"

  7.  **Final Structure:**
