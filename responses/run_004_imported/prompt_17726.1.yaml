answer: |-
  This is a classic problem in **signaling theory** and **bounded rationality**, and it makes perfect sense that a LessWrong-adjacent background makes you want to parse the underlying mechanics rather than just go with your gut.

  Your friend is making a moral argument about fairness; you are making an instrumental argument about information density. Both of you are partially right, but you are optimizing for different variables.

  Here is a breakdown of why your heuristic is likely rational from an instrumental standpoint, even if your friend is correct that it is an imperfect proxy.

  ### 1. Costly Signaling and Variable Costs
  Your friend's core argument rests on the idea that the "cost" of sending a message is not uniform. In signaling theory, a signal is only honest if it is **costly to fake**.
  *   **The Friend's View:** Time is not distributed equally. For a resident working 80-hour weeks, 15 minutes writing a message has a much higher opportunity cost than for someone unemployed or between jobs. Therefore, filtering for time expenditure filters for "people with free time," not "people who care."
  *   **The Counter-View:** While absolute cost varies, **relative cost** is what matters. Even for a busy person, the *marginal* effort to reference a specific photo or bio line is low compared to the total time spent on the app. If someone is busy enough that they cannot spare 30 seconds to reference your profile, they are signaling that their bandwidth for a relationship is currently near zero.

  If your goal is to find a relationship, filtering for people with *some* bandwidth is a valid pre-screen. You aren't just filtering for "interest"; you are filtering for "capacity."

  ### 2. The Message as a Microcosm (The "Sample of Future Behavior" Argument)
  This is the strongest argument for your heuristic. Dating apps are text-mediated environments. In this context, **communication *is* the relationship** until you meet in person.

  *   **Predictive Validity:** The opening message is a small sample size of future communication patterns. If someone sends a low-effort message, they are modeling a low-investment dynamic. If you engage, you are accepting that dynamic.
  *   **Profile Compliance:** Your profile acts as a set of instructions or a contract ("I like X," "I am looking for Y"). A generic message signals, "I did not process the data you provided." In a rationalist frame, this is a failure of **common knowledge**. If they ignore your stated interests now, what is the probability they will ignore your stated boundaries or needs later?

  Your friend argues this doesn't predict *compatibility* (shared values, chemistry). He is right. But it *does* predict **interaction style**. If you value being "seen" and heard, a generic opener is evidence that this person may not be skilled at or interested in providing that, regardless of their internal feelings.

  ### 3. Bayesian Updating and Base Rates
  Let's look at this through a Bayesian lens.
  *   **Prior:** The base rate of "people who are serious about finding a compatible match" on dating apps is relatively low (let's say 20%). The base rate of "people spamming likes to maximize matches" is high.
  *   **Evidence:** A personalized message ($E$).
  *   **Hypothesis:** This person is in the "serious" group ($H$).

  Your friend argues that $P(H | E)$ is not significantly higher than $P(H | \text{generic})$.
  However, empirically, spammers and low-investment users optimize for efficiency. They send 100 "Heys" to get 1 reply. Personalized messengers send 10 messages to get 1 reply.
  Therefore, $P(\text{Serious} | \text{Personalized}) > P(\text{Serious} | \text{Generic})$.

  Even if the signal is noisy (i.e., some busy good matches are filtered out), as long as the likelihood ratio is greater than 1, updating in favor of the personalized message is the rational move. You are not claiming effort *guarantees* compatibility; you are claiming it shifts the probability distribution.

  ### 4. Instrumental vs. Moral Rationality
  This is where the disagreement actually lies.
  *   **Your Friend (Moral Rationality):** He is concerned with **fairness**. He believes you *ought* to give people a chance regardless of their output because external constraints (shifts, social anxiety) might limit their ability to signal. He is optimizing for not missing out on a "diamond in the rough" due to superficial metrics.
  *   **You (Instrumental Rationality):** You are concerned with **efficiency**. You have limited attentional resources. You are optimizing for the highest probability of a successful interaction per unit of time spent.

  If you adopted your friend's strategy, you would increase your **recall** (you wouldn't miss the busy/awkward good matches) but drastically decrease your **precision** (you would wade through far more low-investment matches). Given the attention economy of dating apps, optimizing for precision is usually the survival strategy.

  ### 5. The "Goodhart's Law" Caveat
  There is one risk to your heuristic, which your friend hints at. **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
  If people learn that "long messages = success," you will get more copy-pasted paragraphs that *look* personalized but aren't (e.g., "I see you like hiking, me too!"). You noted you already filter for things that look copy-pasted. This suggests you are actually looking for **specificity**, not just effort.
  *   **Effort:** Word count, time taken.
  *   **Specificity:** Evidence of actual cognitive processing of *your* unique data.

  Specificity is a much harder signal to fake than length. If you refine your heuristic to "filter for specificity" rather than "filter for effort," you mitigate the friend's concern about smooth talkers gaming the system.

  ### Conclusion
  Your friend is right that the correlation is imperfect and that the heuristic is "unfair" to time-poor or socially anxious individuals. **But fairness is not the metric you are optimizing for.**

  You are using a heuristic to manage **information asymmetry**. In a market flooded with low-investment actors, willingness to incur a cost (time/attention) to provide specific evidence of interest is genuine evidence. It tells you:
  1.  They have the capacity for a relationship right now.
  2.  They are capable of attending to your stated preferences.
  3.  They view you as an individual, not a slot to fill.

  **Verdict:** Your reasoning is sound. You are not indulging a superficial bias; you are applying a **costly signal filter** to reduce noise in a high-volume, low-trust environment. You can acknowledge your friend's point (that some great people get filtered out) without accepting that your filter is irrational. It is a rational trade-off: you are accepting false negatives to avoid false positives.

  **Suggested Update:** You might slightly adjust your internal model from "Effort = Interest" to "Specificity = Attention." This accounts for the busy person who sends a short but highly specific message ("That hike in the photo looks like Smith Rock, did you do the Misery Ridge trail?") vs. the unemployed person who sends a generic paragraph. That satisfies both your need for evidence and your friend's concern about time poverty.
