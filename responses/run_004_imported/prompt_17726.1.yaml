      *   *Point 2: The "Sample of Future Behavior" Argument.* This is strong. Dating is a cooperative game. The first move reveals strategy.
      *   *Point 3: Bayesian Update.* It's not perfect evidence, but it *is* evidence. $P(\text{Compatible} | \text{Effort}) > P(\text{Compatible} | \text{No Effort})$. The friend says it's irrational; you argue it's probabilistic.
      *   *Point 4: Lifestyle Compatibility.* If you value effort, maybe you value people who prioritize you. If you date a resident, you need to accept low bandwidth. The filter helps find people whose "bandwidth" matches yours.
