answer: |-
  This is a profound ethical dilemma that sits at the heart of modern effective altruism and moral philosophy. Your intuition that something is "wrong" with your friend's reasoning is shared by many ethicists, even those who agree with the goal of maximizing good.

  Your friend is arguing from a strict **utilitarian framework**, specifically echoing philosopher Peter Singer's argument in *Famine, Affluence, and Morality*. Singer argues that if you can prevent something bad from happening without sacrificing anything of *comparable moral significance*, you are obligated to do so.

  However, there are several robust philosophical and practical counter-arguments to the idea that you are *obligated* to sacrifice your personal life entirely. Here is how you can articulate what feels wrong about your friend's challenge.

  ### 1. The "Demandingness" Objection
  The most common critique of strict utilitarianism is that it is too demanding. If we are obligated to maximize good until the point where giving more would harm us as much as it helps others, we are essentially required to live lives of near-total self-sacrifice.

  *   **The Argument:** Morality should guide how we live, not consume us entirely. A moral theory that leaves no room for personal projects, rest, or deep relationships fails to account for the nature of human agency.
  *   **Application to You:** If you work until you have no time for relationships or rest, you are treating your own life merely as a vessel for producing utility, rather than a life to be lived. Most ethical frameworks agree that you are permitted to have a "personal sphere" that is not subject to cost-benefit analysis.

  ### 2. The Moral Value of Relationships
  Your friend frames your personal time as "discretionary"—implying it is morally neutral or a luxury. This is a category error.

  *   **The Argument:** Deep personal relationships (friendship, partnership, family) are intrinsic moral goods. They cultivate empathy, stability, and community. A world where everyone maximized financial output at the expense of connection would be a colder, more fragile place.
  *   **Application to You:** By preserving time for relationships, you are not just "resting"; you are maintaining the social fabric and fulfilling duties of care to the specific people in your life. These duties are not necessarily trumped by general duties to strangers, even when the numbers are large.

  ### 3. Sustainability and Long-Term Impact
  From a purely consequentialist view (which your friend prefers), burning out is a strategic error.

  *   **The Argument:** Impact is a marathon, not a sprint. High-pressure, full-time work with no rest often leads to burnout, health issues, or cynicism within a few years.
  *   **Application to You:** A part-time career sustained over 30 years may yield more impact than a full-time career that forces you to quit after five due to exhaustion. The inheritance allows you to design a *sustainable* impact career. Choosing the path that ensures you can keep working for decades is not selfish; it is strategically sound.

  ### 4. The "Luck" Paradox
  You mentioned being troubled that your obligations seem to shift based on economic luck. This is a crucial insight.

  *   **The Intuition:** It feels unjust that having an inheritance should turn you into a moral slave. If you didn't have the inheritance, you would *need* to work full-time to survive, and no one would demand you donate 90% of your subsistence income.
  *   **The Resolution:** Your moral *capacity* changes with luck, but your moral *baseline* should not. The inheritance removes the constraint of survival, allowing you to contribute more. However, it does not remove your right to a human life.
  *   **Articulation:** You can tell your friend: "The inheritance gives me the *option* to do more, but it doesn't erase my entitlement to a life of my own. If moral obligation scales infinitely with capacity, then the wealthiest people on earth would be morally required to work themselves to death. That sets a precedent that makes morality a punishment for success."

  ### 5. Supererogation vs. Obligation
  Philosophy distinguishes between **obligatory** actions (what you must do) and **supererogatory** actions (what is good to do but not required).

  *   **The Distinction:** Donating a massive portion of your salary and working maximum hours is *supererogatory*. It is saintly. It is admirable. But making it *obligatory* collapses the distinction between a "good person" and a "saint."
  *   **Application to You:** You are aiming to be a good person who contributes significantly, not a martyr. There is moral value in finding a "good enough" point where you contribute heavily while maintaining your humanity.

  ### A Proposed Reframe
  Instead of viewing this as "Selfishness vs. Altruism," view it as **Strategy vs. Martyrdom.**

  You might say to your friend:
  > "I agree that I have a greater capacity to help than most, thanks to this inheritance. But I reject the idea that my life belongs entirely to the cause. If I sacrifice my relationships and health, I risk becoming ineffective and resentful. I believe I can do the most good over a lifetime by staying healthy, connected, and sustainable. That isn't shirking an obligation; it's managing my impact horizon."

  ### Summary
  Your friend is treating you as a **utility pump**, where the only metric that matters is output. You are rightly insisting on being treated as a **moral agent**, who has rights, relationships, and limits.

  You are not obligated to maximize impact to the point of self-erasure. You are obligated to do *significant* good, which you are already planning to do. The inheritance doesn't bind you to slavery; it buys you the freedom to find the intersection of high impact and a meaningful life. That is not a moral failure; it is a moral maturity.
