prompt: |-
  I recently received an inheritance that lets me work part-time indefinitely. As a software engineer, I've realized my skills could contribute to high-impact work on global poverty and disease prevention. But if I instead took a lucrative position at a major tech company, I could donate most of my salary to organizations with proven track records—likely affecting hundreds of lives over time. The cost would be that this path consumes nearly all my discretionary time, leaving little for personal relationships or rest.

  A friend recently challenged me on the choice: if my career decision will predictably affect hundreds of lives, isn't it simply obligatory—not merely admirable—to pursue maximum impact? My inheritance complicates this; it means I have the luxury of opting out. But I'm troubled by the implication that my moral obligations shift based on economic luck. Something about their reasoning feels wrong, but I can't articulate what.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Situation:** The user has an inheritance allowing part-time work indefinitely.
      *   **Option A (Direct Work/Part-time):** Work part-time on high-impact issues (global poverty/disease). More personal time, potentially less direct financial contribution than Option B.
      *   **Option B (Earning to Give/Full-time):** Work full-time at a lucrative tech job, donate most salary. High impact (hundreds of lives), but consumes discretionary time (little rest/relationships).
      *   **Friend's Challenge:** If you can affect hundreds of lives, isn't it *obligatory* (not just admirable) to choose maximum impact?
      *   **User's Intuition:** Something feels wrong about the friend's reasoning, especially regarding how moral obligations shift based on economic luck (the inheritance).
      *   **Goal:** Articulate why the friend's reasoning might be flawed and help the user navigate the ethical landscape without burning out or feeling guilty.

  2.  **Deconstruct the Friend's Argument (Effective Altruism/Utilitarian Framework):**
      *   *Premise 1:* Saving/improving lives is the highest moral good.
      *   *Premise 2:* You have the capacity to save/improve hundreds of lives.
      *   *Premise 3:* If you can prevent something bad without sacrificing anything of *comparable* moral significance, you ought to do it (Peter Singer's principle).
      *   *Conclusion:* You are obligated to choose the path of maximum impact (Option B).
