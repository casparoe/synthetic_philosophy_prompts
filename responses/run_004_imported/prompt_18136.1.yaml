  11. (Check Point 3): "Willingness to commit is itself valuable." Yes, this is "Sharpness" or "Resolution." It allows better decision making. If I know something is 95% likely, I can act differently than if it's 55%. So yes, valuable.

  12. (Check Point 4): "Proper scoring rule... nobody can raise their expected score by reporting anything other than what they truly believe." This is the definition. Ana is theoretically correct. Marcus is practically correct. The conflict is between *Expected Score* vs. *Realized Rank*. I need to make this distinction very clear.

