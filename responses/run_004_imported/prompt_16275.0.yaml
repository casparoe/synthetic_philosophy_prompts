      *Logician's specific defense:* Use the distinction between *formal* and *material* positivity. Or, simpler: The "Hájek" move. Hájek showed that if you weaken the axioms, you avoid collapse but lose the proof.
      *Let's try this:* Logician argues that "Positive" means "Metaphysically Perfecting." Student argues that in S5, perfection entails necessity of *all* attributes, including relational ones.
      *Actually, the most precise technical objection to collapse is restricting the Necessitation Rule or modifying Axiom 2.* Let's have the Logician argue for a **restricted Axiom 2** (entailment must be necessary entailment). The Student argues this makes the definition of "God-like" circular or empty.

