      *   **Move 2 (Yablo):** Sarah counters with proportionality. P is too specific. M is the "real" cause because it captures the relevant generalization.
      *   **Rebuttal 1 (Elias on Yablo):** Elias argues proportionality changes the *concept* of cause but doesn't solve the *ontological* problem. P still does the heavy lifting.
      *   **Move 3 (List & Menzies):** Sarah shifts to interventionism. Causation is difference-making. If I change M, M* changes.
      *   **Rebuttal 2 (Elias on Interventionism - Crucial):** Elias hits the "supervenience constraint." You can't intervene on M without intervening on P. The structural equations hide the metaphysical dependency.
      *   **Closing:** A stalemate but mutual respect. The "comforting illusion" vs. "scientifically respectable autonomy."

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make Elias too aggressive? *Correction:* Make him weary but precise. He thinks he's saving physics, not attacking mind.
      *   *Check:* Is Sarah's Yablo explanation clear? *Correction:* Use the pigeon example or a pain/withdrawal example. Let's use pain/withdrawal for continuity with the diagram.
      *   *Check:* Is the List & Menzies rebuttal strong enough? *Correction:* This is the hardest part. Elias needs to point out that interventionism assumes variables are independent, but Supervenience makes them dependent. If you fix P, M is fixed. So you can't test M independently.
