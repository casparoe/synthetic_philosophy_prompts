  *(Self-Correction Note: Make sure the distinction between type and token identity doesn't get muddied. Kim's argument is usually about token causation. Sarah needs to be careful not to slide into type-reduction.)*

  9.  **Final Polish:** Check the ending. It shouldn't resolve, but it should feel like the debate has reached a deep impasse.

