          *   *Non-Reductive Physicalist (NRP):* Defends mental causation using Yablo's proportionality and List & Menzies' interventionism.
      *   **Setting:** Whiteboard with Kim's diagram (M $\to$ M*, P $\to$ P*, M $\downarrow$ P, M* $\downarrow$ P*).
      *   **Tone:** Sharp, responsive, technical but accessible (reconstructing a high-level reading group debate), no strawmanning.
      *   **Specific Requirement:** Must include a strong rebuttal from the Exclusionist against the Interventionist move (List & Menzies).
      *   **Goal:** Recreate the tension of the debate without declaring a clear winner, showing the dialectical strength of both sides.

  2.  **Deconstruct the Philosophical Arguments:**
      *   **Kim's Exclusion Argument:**
          1.  Physical Causal Closure: Every physical event has a sufficient physical cause.
          2.  No Overdetermination: Systematic causal overdetermination is implausible (the world isn't set up so every action has two independent sufficient causes).
          3.  Supervenience: Mental properties supervene on physical properties (M needs P).
          4.  Conclusion: If P causes P*, and M supervenes on P, then M doesn't *really* cause P* (or M*). M is excluded.
      *   **Yablo's Proportionality:**
          *   Cause must be proportional to effect.
          *   P is too specific (determinate), M is just right (determinable).
          *   Example: Pigeon pecks at red triangle. Is it *scarlet* or *red*? *Red* is the real cause because if it were crimson, it would still peck. *Scarlet* is too specific.
      *   **List & Menzies (Interventionism):**
          *   Causation is about difference-making under interventions.
          *   If intervening on M changes M* (holding P fixed? No, just generally), M causes M*.
          *   They argue exclusion relies on a "production" view of causation, not "difference-making."
      *   **Exclusionist Rebuttal to Interventionism:**
          *   Intervention on M *requires* intervention on P (due to supervenience).
          *   You can't vary M while holding P fixed.
          *   Therefore, the "difference" made by M is actually just the difference made by P.
          *   Also, the "causal exclusion" isn't about competition; it's about ontological priority.

  3.  **Drafting - Scene Setting:**
