          *   How does the "New Principle" (NP) fix it (intuitively)?
          *   Why do some commentators think the NP just relocates the problem?
      *   **Requirements:** Informal tone, concrete toy example (coin/atom), avoid heavy formal notation, clear intuitive picture.

  2.  **Deconstruct the "Big Bad Bug" (Undermining):**
      *   *Humean Supervenience (HS):* Chances supervene on the total history of categorical facts (the "Humean Mosaic"). The best system analysis (BSA) determines chances based on patterns in the mosaic.
      *   *The Conflict:* A current chance hypothesis ($T$) says "The chance of $X$ is $p$." But under HS, $T$ is true *in virtue of* the total history. There might be a possible future history ($F$) that is compatible with $T$ having chance $> 0$ (according to $T$ itself), but if $F$ occurs, the total history changes such that $T$ is no longer the best system (i.e., $T$ becomes false).
      *   *The PP Problem:* PP says $Cr(A | T \& E) = Ch(A)$. If $A$ is the undermining future $F$, then $Ch(F) > 0$. So $Cr(F | T) > 0$. But if $F$ occurs, $T$ is false. So $Cr(T | F) = 0$. This creates a tension in the probability calculus when combined with PP.

  3.  **Develop a Concrete Toy Example:**
      *   *Need:* A finite world where chances are determined by frequencies (simplest form of BSA).
      *   *Setup:* A coin that exists for only 3 flips.
      *   *Chance Hypothesis ($T$):* "The coin is fair (50/50)."
      *   *Undermining Future ($F$):* A sequence of outcomes that is *possible* according to a fair coin (e.g., HHH), but if it happens, the *actual frequency* becomes 100% Heads.
      *   *The Twist:* In a Humean world, if the *actual* frequency is 100% Heads, the "Best System" might say "This coin is biased to Heads," not "This coin is fair." So, if $F$ happens, $T$ is false.
      *   *The Contradiction:*
          1.  PP says: Given $T$, my credence in $F$ should be $Ch_T(F) > 0$.
          2.  Logic says: If $F$ happens, $T$ is false. So $Cr(T | F) = 0$.
          3.  Bayes/Conditionalization implies relations between $Cr(F|T)$ and $Cr(T|F)$.
          4.  Specifically, if $Cr(F|T) > 0$ and $Cr(T|F) = 0$, we have a problem with the standard axioms if we assume $T$ entails $Ch(F) > 0$.
          *Refinement:* The real contradiction Lewis points out is slightly more technical. It's that $T$ entails that the chance of $F$ is $x > 0$. PP says $Cr(F|T) = x$. But $T$ entails $\neg F$ (because if $F$ occurs, $T$ is false). Wait, $T$ doesn't entail $\neg F$ directly, $T$ entails that if $F$ occurs, $T$ is false. So $T \& F$ is impossible. Therefore $Cr(F|T)$ should be 0. But PP says $Cr(F|T) = Ch_T(F) > 0$. Contradiction: $0 = x > 0$.

  4.  **Explain Why Ordinary Conditionalization Fails:**
      *   Standard conditionalization assumes the evidence ($T$) is compatible with the outcome ($F$).
      *   Here, accepting $T$ as a chance hypothesis implies assigning positive probability to $F$.
      *   But accepting $T$ as a *truth* about the world (under HS) implies $F$ cannot happen (because if $F$ happens, $T$ isn't the truth).
      *   So $T$ acts like a proposition that says "I am true, but there is a chance I will be proven false by the future." This breaks the link between chance and credence.

  5.  **Explain the "New Principle" (NP):**
      *   *Old PP:* $Cr(A | T \& E) = Ch(A)$. (Condition on $T$ alone).
      *   *New NP:* $Cr(A | T \& E) = Ch(A | T)$. (Condition on $T$, but look at the chance of $A$ *given* $T$).
      *   *Intuition:* Instead of asking "What is the chance of $F$ according to $T$?", ask "What is the chance of $F$, given that $T$ is the true chance theory?"
      *   *Resolution:* If $F$ undermines $T$, then $Ch_T(F | T) = 0$. Why? Because in the set of worlds where $T$ is true, $F$ never happens (since $F$ makes $T$ false). So the NP tells us to have 0 credence in $F$ given $T$. This matches the logical fact that $T \& F$ is impossible.
      *   *Simpler phrasing:* The NP tells us to condition our credence on the *joint* occurrence of the history so far and the chance hypothesis holding true throughout.

  6.  **Address the "Relocating the Problem" Criticism:**
      *   *The Issue:* The NP requires us to know $Ch(A | T)$. But where do we get *those* chances?
      *   *Circularity:* To know the chance of $F$ given $T$, we need a theory of chance that already accounts for undermining. But $T$ was supposed to be that theory.
      *   *Metaphysical Cost:* It severs the link between chance and single-case propensity. It makes chance dependent on the truth of the chance theory itself in a way that feels ad hoc.
      *   *Humean Cost:* It forces the Humean to admit that the "Best System" isn't just about fitting the mosaic, but about avoiding self-undermining, which complicates the "Supervenience" part.
      *   *Key Point:* It saves the rationality constraint (credence) but makes the metaphysics of chance weirder.

