      *   *Check:* Did I explain *why* conditionalization fails? Yes, because $T$ and $F$ are logically incompatible under HS, but PP treats them as probabilistically linked.
      *   *Check:* Did I explain the NP intuitively? Yes, shifting from $Ch(F)$ to $Ch(F|T)$.

  8.  **Refining the Toy Example:**
      *   Make sure the "Best System" logic is clear.
      *   World: 10 coin flips total.
      *   Hypothesis $T$: "Fair coin (50/50)."
      *   Future $F$: "All remaining flips are Heads."
