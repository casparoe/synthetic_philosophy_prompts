      *   The core argument is based on the "Parity Principle": If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   **The Otto vs. Inga Case:** Otto (Alzheimer's) uses a notebook to store beliefs (e.g., MoMA is on 53rd St). Inga uses biological memory.
      *   **Key Conditions (often summarized as coupling constants):**
          1.  **Constant Conjunction:** The resource is reliably available and invoked.
          2.  **Easy Access:** The information is accessible more or less automatically.
          3.  **Automatic Endorsement:** The information is automatically trusted (not critically scrutinized each time).
          4.  **Past Endorsement:** The information must have been consciously endorsed by the agent at some point (to distinguish from mere input).
      *   **Goal:** Determine which cases function as *constitutive* parts of the cognitive system (belief storage, processing) vs. merely *causal* tools.

