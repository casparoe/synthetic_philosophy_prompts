answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Arthur, a retired paleontologist, sits between Elias (an epistemicist metaphysician) and Sara (a supervaluationist semanticist). A tray of fossil casts sits on the table between them.*

  **Arthur:** Let's look at this lineage. *Eohippus* to *Equus*. Thirty million years. I have drawers full of intermediate metapodials. If I line them up, it's a smooth curve. But in the museum catalog, they're distinct species. I spent thirty years drawing lines I knew were fake. Now you tell me this is the Sorites Paradox.

  **Elias:** Precisely. And the hard truth is, Arthur, there *was* a first horse. Somewhere in that sequence, a mother who was not quite a horse gave birth to a foal that was.

  **Sara:** That's the epistemicist dogma, Elias. Arthur, look at the fossils. There is no single generation where the morphology shifts enough to justify "horse" versus "not-horse." There are many equally good ways to make the term precise. On some precisifications, generation 4,000 is the first horse. On others, it's 4,050. Since "horse" doesn't pick out one specific cutoff, there is no fact of the matter. It's a truth-value gap.

  **Arthur:** Okay, but Elias, I have to ask the question that kept me up during tenure reviews. If this boundary is fundamentally unknowable—if no amount of stratigraphy or morphometrics can find it—what work is it doing? Why posit a magic line in the sand if science can never locate it? It feels like metaphysical clutter.

  **Elias:** It's not clutter, Arthur; it's the cost of doing logical business. If you deny there's a sharp cutoff, you have to deny classical logic. You have to say the Law of Excluded Middle fails. You'd have to accept that "Either this fossil is a horse or it isn't" is sometimes false.

  **Arthur:** And that's a bullet you won't bite?

  **Elias:** I can't. Because if there's no sharp cutoff, then small changes *never* make a difference. If one millimeter of tooth enamel doesn't change the species, then neither does the next, nor the next. You end up concluding that *Eohippus* is a horse. That's absurd. The sharp boundary does explanatory work by preserving the causal structure of reality. The vagueness is in our *concepts*, not the world. The world is precise; our knowledge has a "margin for error." We can't know the cutoff because knowing it would require a discrimination finer than our concepts allow. The boundary exists to stop the logical slide, even if it's epistemically hidden.

  **Arthur:** So the boundary is real, but it's like a horizon I can never reach.

  **Elias:** Exactly. It anchors the truth of our statements, even if we can't verify them.

  **Arthur:** Sara, your turn. Elias sounds like he's believing in ghosts to save logic. But you... you say there's no single line. But isn't that just pushing the problem back? You talk about "admissible precisifications." We can draw the line at generation 4,000 or 4,050. But can we draw it at 10,000? No. So there's a boundary between "admissible" and "inadmissible" cutoffs.

  **Sara:** Correct.

  **Arthur:** Well, is *that* boundary sharp? If you say "yes," you're just an epistemicist in disguise. You've just moved the sharp line from "species" to "admissibility." If you say "no," then "admissible" is vague. And if "admissible" is vague, isn't your theory suffering from higher-order vagueness? How do you define the rules for defining the rules without hitting the same paradox?

  **Sara:** That is the sharpest objection, Arthur. And I'll concede: if we treat "admissible" as a fixed, classical set, I do collapse into epistemicism. But supervaluationism doesn't require that. We can apply supervaluationism recursively.

  **Arthur:** Walk me through that.

  **Sara:** Think of it as layers. At the first level, we have all the admissible ways to define "horse." But you're right, the collection of those ways isn't sharply bounded. So, we create a second-order supervaluation. We look at all the admissible ways to make the *first set* precise. A statement is "super-true" only if it holds across all the admissible ways of precisifying the admissibility conditions.

  **Arthur:** So you're vague about where the vagueness stops.

  **Sara:** Exactly. We don't posit a sharp line between admissible and inadmissible. We acknowledge that the boundary of the boundary is also fuzzy. We model this by iterating the supervaluation process. It doesn't solve the vagueness by hiding a sharp line; it dissolves the requirement for a sharp line at any order. It respects the intuition that the transition from "clearly admissible" to "clearly inadmissible" is itself a gradient, just like the fossils.

  **Elias:** But Sara, at the limit, doesn't that make truth unstable? If we keep iterating, do we ever get a definite truth value for anything?

  **Sara:** We get definite truth values for the clear cases—*Eohippus* is clearly not a horse, *Equus* is clearly a horse. The indeterminacy is confined to the borderline cases, where it belongs. Arthur doesn't need a truth value for generation 4,002 to do his science. He needs to know that generation 1 is distinct from generation 10,000. Supervaluationism gives him that without forcing him to pretend he knows something he can't.

  **Arthur:** (Picks up a fossil cast, turning it over) So, Elias, you offer me a world that is logically clean but epistemically closed. There is a fact, but I am barred from knowing it. Sara, you offer me a world that is semantically open, where truth depends on how we choose to sharpen our language, but you risk an infinite regress of sharpening.

  **Elias:** I offer you reality, Arthur. Logic describes reality.

  **Sara:** I offer you representation, Arthur. Language describes our access to reality.

  **Arthur:** You know, in the field, when I held a specimen that looked *almost* like the next species... I felt the gap. Not a logical gap, but a practical one. I had to write a label.

  **Elias:** And when you wrote that label, you were asserting a proposition. That proposition was either true or false.

  **Sara:** Or it was a move in a language game that didn't require binary truth to be useful.

  **Arthur:** (Smiles) I think I prefer Sara's view for the museum catalog. It admits the messiness. But Elias... when I'm writing a paper on speciation events, I need to assume there *was* a cause, a moment where the population shifted.

  **Elias:** Then you need my sharp boundary. Causation is precise.

  **Arthur:** Perhaps. Or perhaps the paradox isn't in the fossils, or the logic, or the language. Perhaps it's in the human need to name things that refuse to be named.

  **Sara:** Now *that* is a statement that is true on every admissible precisification.

  **Elias:** (Sips coffee) I'll allow it.
