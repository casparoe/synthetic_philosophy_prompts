          *   *Theodicy (Palace of Destinies):* Shows many Sextus Tarquinius variants in different worlds. This looks like Counterpart Theory (different individuals resembling each other) rather than Transworld Identity (the *same* individual in different worlds).
      *   **Contextual Constraint:** Leibniz denies concrete reality to non-actual worlds (they are ideas in God's mind), unlike David Lewis's modal realism.
      *   **The Question:** Where does Leibniz's considered view land? Lewis's Counterpart Theory? Kripke's Transworld Identity? Or does it resist these categories?

  2.  **Initial Assessment & Philosophical Mapping:**
