      *   *Key Insight:* The state at $t=1$ is not logically determined by the states at $t < 1$. There is no logical contradiction in the sequence itself; there is only an indeterminacy about the limit state.
      *   *Analogy:* Consider a function $f(t)$ defined on $[0, 1)$. Does $f(1)$ exist? Is it continuous? Thomson assumes the physical state *must* supervene on the history in a specific way (continuity of "being on/off" based on the last switch), but the setup doesn't guarantee that.
      *   *Logical Possibility vs. Physical Determinism:* Thomson conflates "the rules don't tell us" with "no state is possible." Benacerraf says: "The rules don't tell us, so *any* state (On, Off, Exploded, Vanished) is logically consistent with the prior history."
