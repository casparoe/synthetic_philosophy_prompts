      *   *Point 2: The Spectator Problem.* Rousseau hates the dark theater where people sit alone. Social media is the ultimate dark theater. We watch others live instead of living ourselves. The "passive pity" argument (crying at a tragedy but ignoring a beggar outside) applies to liking a charity post but doing nothing.
