prompt: |-
  So I went down a wiki rabbit hole on the Truman honorary degree thing and found out this philosopher, Anscombe, wrote a whole pamphlet trashing Oxford for giving it to him over the atomic bombs. From what I can tell her actual point was that a land invasion of Japan would've ended up killing fewer people total than the bombs did, so once you run the numbers properly Truman comes out looking like he made the wrong call. Isn't that just the same utilitarian cost-benefit reasoning the pro-bomb crowd uses, except shes plugging in different casualty estimates and getting the opposite answer? Kinda confused why her take gets treated as some famous, totally different kind of ethical argument instead of just a dispute over whose numbers are right.
