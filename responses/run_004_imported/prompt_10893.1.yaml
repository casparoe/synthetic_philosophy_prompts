answer: |-
  You have stumbled onto one of the most common misconceptions in modern ethical history! It is a really sharp observation to notice that most anti-war arguments *are* utilitarian (i.e., "this war cost too much"), but in this specific case, you have the argument exactly backward.

  Elizabeth Anscombe did **not** argue that Truman was wrong because the invasion would have killed fewer people. In fact, she explicitly rejected that kind of reasoning entirely.

  Here is why her protest is treated as a landmark ethical argument rather than just a dispute over casualty estimates.

  ### 1. She Rejected the "Numbers Game"
  The pro-bomb argument is classically **utilitarian** (or consequentialist): *Action A (bombing) killed X people, but prevented Action B (invasion) which would have killed X + Y people. Therefore, Action A is morally justified.*

  Anscombe's argument was **non-consequentialist**. Her position, rooted in Catholic natural law theory and Aristotelian ethics, was that **the intentional killing of innocent civilians is intrinsically evil.**

  For Anscombe, it did not matter if Truman saved a million lives, ten million lives, or everyone on earth. If the method involved the direct, intentional murder of non-combatants, the act was morally forbidden. She argued that you cannot do evil so that good may come of it.

  So, she wasn't plugging in different numbers to get a different utilitarian result; she was arguing that **the equation itself is invalid.**

  ### 2. The Pamphlet: "Mr. Truman's Degree"
  In her 1956 pamphlet, Anscombe argued that Oxford University was honoring a man who had committed mass murder. She wrote:

  > "People may think that it was right to drop the bombs... But they cannot think it was right without holding that it is sometimes right to murder the innocent."

  She challenged the university to ask: If Truman had achieved his military goals by gassing civilians, would he still deserve an honor? If the answer is no, then why is blowing them up different? Her point was that the *means* were corrupt, regardless of the *ends*.

  ### 3. Why This Is Philosophically Famous
  You asked why this gets treated as a "totally different kind of ethical argument." It's because this protest was a real-world preview of the paper that made Anscombe famous: **"Modern Moral Philosophy" (1958).**

  In that paper (published just two years after the Truman protest), Anscombe famously attacked utilitarianism and consequentialism, arguing that modern philosophy had lost its way by focusing on "consequences" rather than "virtue" and "law." She argued that without a concept of divine law or human flourishing, concepts like "moral obligation" make no sense.

  The Truman protest is famous because:
  1.  **It was rare:** It is uncommon for a philosopher to engage in such direct, public political activism based on abstract ethical principles.
  2.  **It was a clash of frameworks:** It wasn't Liberal vs. Conservative; it was Consequentialism vs. Absolutism.
  3.  **It worked (sort of):** The vote at Oxford was incredibly close. Truman did get the degree, but the controversy was so intense that he was advised not to attend the ceremony in person.

  ### 4. Why the Confusion?
  It is easy to see why you thought she was making a utilitarian argument. Most *political* opposition to the atomic bombs relies on the "Japan was already ready to surrender" or "Invasion casualties were exaggerated" arguments. Those are factual/utilitarian claims.

  Anscombe's protest stands out precisely because she didn't rely on those historical debates. She conceded, for the sake of argument, that Truman might have believed he was saving lives. Her point was that **even if he was right about the math, he was still a murderer.**

  ### Summary
  Anscombe's take is famous not because she had a better spreadsheet, but because she refused to look at the spreadsheet. She argued that certain actions are off-limits regardless of the cost-benefit analysis. In the landscape of 20th-century ethics, that is a massive distinction.
