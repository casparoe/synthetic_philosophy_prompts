  1.  **Analyze the User's Query:**
      *   **Topic:** Elizabeth Anscombe's protest against Oxford University awarding an honorary degree to Harry Truman (1956).
      *   **User's Understanding:** The user believes Anscombe's argument was primarily *utilitarian* (i.e., "invasion would have killed fewer people than the bombs, therefore Truman was wrong based on numbers").
      *   **User's Confusion:** If her argument is just utilitarian cost-benefit analysis with different numbers, why is it treated as a famous, distinct *ethical* argument rather than just a factual dispute?
      *   **Goal:** Correct the user's misunderstanding about Anscombe's philosophical stance and explain why her protest is significant in ethical theory (specifically virtue ethics/deontology vs. utilitarianism).

