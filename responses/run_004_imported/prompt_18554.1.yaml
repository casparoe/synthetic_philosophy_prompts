prompt: |-
  I'm a junior at my high school and one of the student representatives on our Honor Council, the body that hears academic integrity cases and recommends sanctions to the dean. Our bylaws set up two tiers: a first or minor offense, like an uncited paraphrase, gets a warning and a chance to redo the work, while anything serious or repeated gets referred to the dean with a recommendation of suspension or expulsion. Both tiers currently use the same evidentiary standard: a majority of the nine of us (six students, three faculty) must find it "more likely than not," based on whatever testimony is presented, that the student actually did it. There's rarely a confession or camera footage involved, so most cases really come down to a teacher's account weighed against the student's.

  Two weeks ago we heard a case that split the council: a senior accused of fabricating data in a lab report, an offense serious enough under our bylaws to send it straight to the expulsion track, based on nothing more than a single teacher's testimony. I'd just covered pragmatic encroachment in my philosophy elective—we've been doing a unit on contemporary epistemology—and it seemed to fit exactly: the same uncorroborated testimony that would easily support a warning in a minor case felt obviously too thin to justify something this serious, which suggests that what it takes for us to know, or be justified in believing, that a student is responsible should rise with what's riding on the finding, even though the evidence itself hasn't changed at all. A friend on the council, who leans toward epistemic contextualism instead, thinks this gets the phenomenon right but frames it wrong: on her view, what shifts isn't how much justification it takes to believe something as the stakes rise, but what a phrase like "sufficient evidence" in our bylaws even means as used in a low-stakes versus a high-stakes hearing—and she thinks that distinction actually matters for how the bylaws should be worded. A third member, though, wants none of it: he thinks whether the student did it is a plain fact that shouldn't shift around depending on the punishment, and that if one teacher's word isn't good enough to justify expulsion, it shouldn't count as sufficient for a warning either—keep one standard for the finding itself, and let the stakes affect only the sanction that follows from it. I'm also genuinely unsure whether it matters that, unlike the classic cases I've read about where the person doing the believing also bears the stakes, here it's the council doing the believing while the student bears essentially all of it.

  I have to circulate a short discussion memo before next Wednesday's meeting, and I'd like your help drafting it. Could you lay out these three positions accurately, recommend one concrete evidentiary policy—or a defensible combination of them—that the council could actually vote on, and take the "keep one standard, let stakes affect only the sanction" objection seriously rather than dismissing it, since at least two members are sure to raise it and I'd like the memo to already have an answer ready for them? A page is about right.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Junior high school student, Honor Council representative.
      *   **Task:** Draft a discussion memo for the Honor Council meeting next Wednesday.
      *   **Context:** Recent split vote on a senior accused of fabricating data (serious offense) based on single teacher testimony. Current bylaws use "more likely than not" (preponderance of evidence) for *both* minor (warning) and serious (expulsion) tiers.
      *   **Key Philosophical Conflict:**
          1.  *Pragmatic Encroachment (User's view):* Stakes affect justification required. Higher stakes = need more evidence to "know"/believe.
          2.  *Epistemic Contextualism (Friend's view):* Stakes affect the meaning of "sufficient evidence." The semantic content of the standard shifts with context.
          3.  *Invariantism/Separation (Third member's view):* Truth/Fact is fixed. Stakes shouldn't affect the finding of fact, only the sanction. One standard for guilt, separate consideration for punishment.
      *   **Specific Constraint:** Take the third objection (Invariantism) seriously; don't dismiss it.
      *   **Specific Constraint:** Recommend a concrete evidentiary policy or combination.
      *   **Length:** About a page.
      *   **Tone:** Professional, academic but accessible (high school Honor Council), persuasive but balanced.

  2.  **Deconstruct the Philosophical Positions (for accurate representation):**
      *   *Pragmatic Encroachment:* Knowledge/Justification is sensitive to practical stakes. $S$ knows $p$ only if $S$'s evidence is strong enough given the cost of being wrong. Here: Expulsion costs more than a warning, so we need stronger evidence to be justified in finding guilt.
      *   *Contextualism:* The truth conditions of knowledge attributions (or standards like "sufficient") vary by context. In a "high stakes context," the word "sufficient" demands more than in a "low stakes context." It's a linguistic/semantic shift.
      *   *Invariantism (The Objection):* The fact of whether the student cheated is independent of the punishment. If the evidence meets the standard, they are guilty. If the punishment is too harsh for that level of evidence, change the punishment threshold, not the epistemic standard. Or, keep the standard fixed but require higher certainty for harsher penalties (which effectively looks like tiered standards). *Correction:* The third member argues for *one* standard for the finding, stakes affect *only* the sanction. This implies if we aren't sure enough to expel, but sure enough to warn, we should find them guilty of *something* or find them not guilty of the serious charge but guilty of a lesser one? No, the prompt says he thinks "if one teacher's word isn't good enough to justify expulsion, it shouldn't count as sufficient for a warning either." This is a *high bar invariantism*. He wants a single, high bar for *any* finding, or perhaps he's arguing that the *finding* shouldn't be sensitive to stakes, only the *outcome*. Actually, re-reading: "keep one standard for the finding itself, and let the stakes affect only the sanction that follows from it." But he also says "if one teacher's word isn't good enough... it shouldn't count as sufficient for a warning either." This suggests he believes the *evidence threshold* should be high regardless of tier, or that the tiering is flawed. I need to interpret this charitably: He believes truth is objective. If we aren't sure enough to punish severely, we shouldn't punish lightly either based on the *same* weak evidence. He opposes shifting the *epistemic* bar based on consequences.

  3.  **Determine the Recommendation:**
      *   The current system (one standard for both tiers) is clearly causing friction.
      *   Pure Pragmatic Encroachment is hard to codify in bylaws ("believe harder when stakes are high" is vague).
      *   Pure Contextualism is also semantic and hard to legislate.
      *   The Third Member's Invariantism has merit: consistency is good. But if the standard is "more likely than not" (51%), that feels too low for expulsion.
      *   *Best Solution:* Tiered Evidentiary Standards. This effectively codifies the intuition of Encroachment/Contextualism without relying on controversial epistemology. It respects the Invariantist concern by making the standards explicit rules rather than shifting subjective feelings.
      *   *Policy:* Minor offenses = Preponderance of Evidence (>50%). Serious offenses = Clear and Convincing Evidence (substantially more likely, e.g., >70-75%) or Unanimous Vote.
      *   *Addressing the Third Member:* Acknowledge that the *fact* of cheating doesn't change, but the *council's tolerance for error* should. We aren't changing reality; we are managing risk.

  4.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** Reference the recent case and the need to review bylaws.
      *   **Philosophical Framework (The Three Views):** Briefly and accurately summarize Encroachment, Contextualism, and Invariantism (as described in the prompt).
      *   **Addressing the Objection (Invariantism):** This needs specific focus. Why might "one standard" be appealing? (Consistency, objectivity). Why is it problematic here? (Risk asymmetry).
      *   **Recommendation:** Propose a tiered standard. This bridges the gap. It satisfies the Encroachment intuition (higher stakes = higher bar) but codifies it as a rule (satisfying Invariantist desire for fixed rules).
      *   **Conclusion:** Call to action for Wednesday.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Needs to sound like a student leader but mature. Not too jargon-heavy, but showing the philosophy elective knowledge.
      *   *Length:* Keep it tight. A page is roughly 400-500 words single-spaced.
      *   *Specific Check:* Did I address the "bearer of stakes" issue? The prompt mentions: "unsure whether it matters that... council doing the believing while the student bears essentially all of it." I should briefly touch on this. It strengthens the Encroachment view (we are deciding *for* them, so we must be careful).

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey council, recent case was tough.
      *   We have three views on evidence. 1. Stakes change justification (Encroachment). 2. Stakes change meaning of "sufficient" (Contextualism). 3. Facts are facts, don't change standards (Invariantism).
      *   Invariantist friend says if it's not enough to expel, it's not enough to warn. That's risky. It might let cheaters go free on minor stuff.
      *   But he's right that we shouldn't just "feel" differently. We need rules.
      *   Proposal: Keep two tiers, but change the evidence standard. Minor = 5/9 votes. Serious = 7/9 votes.
      *   This respects the stakes without making truth relative.
      *   Let's vote on this.

  7.  **Drafting - Iteration 2 (Polishing and expanding on the philosophy):**
      *   Make sure the distinction between Encroachment and Contextualism is clear but concise. Encroachment = practical reasoning affects knowledge. Contextualism = language changes.
      *   Make sure the Invariantist objection is treated with respect. It's about integrity of the fact-finding process.
      *   The recommendation should be specific: "Clear and Convincing" for serious offenses.
      *   Address the "student bears stakes" point: This actually *supports* raising the bar. We are the gatekeepers.

  8.  **Final Review against Constraints:**
      *   Three positions accurate? Yes.
      *   Concrete policy? Yes (Tiered voting thresholds).
      *   Invariantist objection answered seriously? Yes (Risk management vs. Truth).
      *   Length? Aiming for ~500 words.

  9.  **Final Polish:** (Self-Correction during drafting) *Wait, the prompt says the third member thinks if it's not enough for expulsion, it shouldn't be enough for a warning either.* That implies a *single high standard* for everything. I need to make sure I don't misrepresent him. He thinks the standard should be high universally. My counter-argument is that this creates too high a barrier for minor offenses, potentially undermining the honor code's educational function. I will propose a middle ground: Tiered standards. This acknowledges the stakes (Encroachment) but makes them rule-based (Invariantist friendly).

      *Wait, one more nuance:* The prompt asks to take the "keep one standard, let stakes affect only the sanction" objection seriously. The third member says: "if one teacher's word isn't good enough to justify expulsion, it shouldn't count as sufficient for a warning either." This is actually a bit contradictory to "let stakes affect only the sanction." If the sanction is the only thing that changes, you could find them guilty on weak evidence and just give a warning. But he says weak evidence shouldn't count for a warning *either*. So he essentially argues for a **High Uniform Standard**. I need to address *that*.

      *Revised Plan:*
      1. Acknowledge the three views.
      2. Address the "High Uniform Standard" (Invariantist) view: It protects against false positives but risks rendering the minor tier useless.
      3. Propose Tiered Standards as the compromise.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Tiered Evidentiary Standards

  **Background**
  Following the recent split decision regarding the senior lab fabrication case, we must reconsider our evidentiary bylaws. Currently, a simple majority ("more likely than not") suffices for both minor warnings and serious expulsions. This uniformity ignores the intuitive difference in justification required when a student's academic future is at stake versus when a learning opportunity is at stake.

  **Philosophical Framework**
  Three positions have emerged regarding how we should handle this:

  1.  **Pragmatic Encroachment:** The justification required to find a student responsible should rise with the stakes. The same evidence might justify a warning but not expulsion because the cost of error is higher in the latter.
  2.  **Epistemic Contextualism:** The phrase "sufficient evidence" shifts meaning based on the context. In a high-stakes hearing, "sufficient" semantically demands more proof than in a low-stakes hearing.
  3.  **Invariantism (The Objection):** The fact of whether a student cheated is objective. If evidence is too weak to justify expulsion, it is too weak to justify *any* finding of guilt. We should maintain one high standard for fact-finding and let stakes influence only the sanction.

  **Addressing the Invariantist Objection**
  The Invariantist position is crucial: it protects the integrity of our fact-finding by refusing to let consequences distort "the truth." However, adopting a single high standard (e.g., "clear and convincing") for *all* cases risks paralyzing the minor tier. If we require near-certainty for an uncited paraphrase, we may fail to intervene in cases where educational correction is needed, undermining the Honor Code's restorative purpose. Furthermore, while the *fact* of cheating is invariant, the *Council's tolerance for error* is not. We are not merely observing facts; we are acting as gatekeepers. Since the student bears the consequences of our error, not us, we have a duty to manage that risk proportionally.

  **Recommendation**
  I propose we amend the bylaws to codify **Tiered Evidentiary Standards**. This adopts the practical insight of Encroachment/Contextualism while satisfying the Invariantist demand for clear, fixed rules rather than subjective shifting.

  *   **Tier 1 (Minor/First Offense):** Retain "Preponderance of Evidence" (5 of 9 votes). This allows for restorative justice when the risk of long-term harm is low.
  *   **Tier 2 (Serious/Repeated Offense):** Raise the standard to "Clear and Convincing Evidence" (7 of 9 votes). This acknowledges that expulsion requires a higher degree of certainty to mitigate the severe stakes for the accused.

  **Next Steps**
  This policy ensures that our epistemic standards match the gravity of our sanctions without compromising the objectivity of our process. I ask that we come to Wednesday's meeting prepared to vote on this amendment.
