      *   *Does it solve Pascal's Mugging?* No. This is the crux of the issue.
      *   *Why not?* Because the utility ($U$) in the thought experiment is *arbitrarily large*. If the mugger says they will simulate/kill $3 \uparrow\uparrow\uparrow 3$ people, that number is so vast it dwarfs any fixed tiny probability like $10^{-30}$.
      *   *Math:* Expected Utility ($EU$) = Probability ($P$) $\times$ Utility ($U$).
