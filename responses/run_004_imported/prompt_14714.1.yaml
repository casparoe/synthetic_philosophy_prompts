answer: |-
  **The Arithmetic of Betrayal: Why Hyperbolic Discounting Doesn't Kill Akrasia**

  We have all been the person who signs the gym contract on January 1st with the solemn conviction of a monk taking a vow, only to find ourselves on the couch on January 4th, convinced that rest is actually more virtuous. This is the territory of *akrasia*, or weakness of will: acting against one's better judgment. In recent decades, behavioral economics has offered a seductive explanation for this phenomenon: hyperbolic discounting. This model suggests that we value rewards disproportionately more as they approach the present. A hundred dollars next year is worth less than a hundred dollars today, but a hundred dollars *right now* is worth infinitely more than a hundred dollars tomorrow.

  The provocative implication of this model is that it might explain *away* akrasia. If my preferences simply flip when the reward becomes immediate, am I really being weak? Or am I just rationally maximizing my utility based on a new, time-sensitive valuation? If I am always acting on what I prefer most *in the moment*, then weakness of will is an illusion. There is no battle between reason and desire, only a sequence of different "temporal selves" with different data sets.

  This is a compelling defense, but it is ultimately wrong. While hyperbolic discounting accurately describes the *mechanism* of temptation, it fails to capture the *structure* of human agency. It reduces rationality to snapshot optimization, ignoring the fact that to be a rational agent is to be a creature that exists across time. Akrasia is not merely a preference reversal; it is a failure of diachronic (across-time) coherence. Therefore, hyperbolic discounting does not dissolve weakness of will; it merely provides the mathematics for how we betray ourselves.

  To understand the argument for dissolution, we must look at the economic definition of rationality. In standard microeconomic theory, an agent is rational if they act to satisfy their current preferences given available information. From this viewpoint, the "Monday Me" who plans to go to the gym and the "Wednesday Me" who skips it are effectively two different people. Wednesday Me is facing a new reality: the effort is immediate, and the reward is distant. Given the hyperbolic curve, the utility of skipping now outweighs the utility of health later. To skip is to maximize utility. To call this "weakness" is to moralize a mathematical function. If preferences are sovereign, and my preferences have changed due to temporal proximity, then I have not acted irrationally; I have simply updated my valuation. On this view, akrasia is just a label we paste on time-inconsistent preferences to make ourselves feel morally superior to our own biology.

  This argument is clean, consistent, and completely divorced from the lived experience of being human.

  The fatal flaw in the "dissolution" argument is that it ignores the phenomenology of regret. If hyperbolic discounting were the whole story, succumbing to temptation would feel like a simple change of mind. If I decide on Monday to eat Italian food, but on Wednesday I see a taco stand and prefer tacos, I do not feel guilt. I do not feel I have betrayed myself. I just liked tacos more in the moment. But akrasia feels different. When I skip the gym, I do not feel that my preference has genuinely shifted; I feel that I have *capitulated*. I still believe, even while eating the donut, that I should be eating the salad.

  This distinction is crucial. Akrasia is not acting on a new preference; it is acting against a *persisting* judgment. If hyperbolic discounting merely changed my mind, I would no longer value the gym once I was on the couch. But I do. I value it, I just fail to pursue it. This suggests that rationality is not just about maximizing local utility at time $T$; it is about maintaining coherence between time $T_1$ and time $T_2$.

  Philosopher Michael Bratman argues that human agency is fundamentally a "planning agency." We are not just reactors to immediate stimuli; we are creatures who form plans to bridge the gap between now and later. A plan is only useful if it has stability. If I abandon my plan every time the cost of execution becomes immediate, I am not a planning agent; I am a series of disconnected impulses. True rationality requires what we might call "diachronic rationality"—the ability to bind one's future self to the judgments of one's past self. When hyperbolic discounting causes me to break that bond, I am not being rational in a new way; I am failing to be an agent at all.

  The economic argument assumes that the "self" is a series of snapshots. But the "I" that feels the regret is the continuous thread connecting those snapshots. When "Wednesday Me" skips the gym, "Monday Me" is not a stranger; he is me. By ignoring his judgment, I am treating my own life as a disjointed series of moments rather than a unified narrative. That is a genuine cognitive and practical failure. It is irrational because it undermines my own capacity to achieve long-term goals, which are the very things that give my preferences meaning.

  Furthermore, if we accept the economic view that we are always rational because we always follow current preferences, we lose the ability to distinguish between a reasoned change of mind and a lapse in willpower. If I quit smoking because I researched new data and decided health isn't a priority, that is a preference change. If I quit smoking because the craving hit me and I couldn't handle it, despite still valuing health, that is akrasia. Hyperbolic discounting explains the *intensity* of the craving, but it cannot explain why I view the craving as an intruder rather than a legitimate update. The fact that we employ strategies like "Ulysses contracts" (binding ourselves to mast, so to speak, like removing apps from our phones or freezing credit cards) proves that we recognize the discounting curve as a distortion, not a legitimate preference shift. We wouldn't bind ourselves against our "rational" selves; we only bind ourselves against our "weak" selves.

  Ultimately, hyperbolic discounting is the weapon, but akrasia is the wound. The math describes the slope of the temptation, but it does not justify the fall. To say that we are rational at every point in time is to define rationality so narrowly that it becomes useless. It reduces human beings to thermostats, reacting to immediate inputs without regard for the system as a whole.

  We must take the side of the philosophers over the economists on this one. Weakness of will is real precisely because we are more than the sum of our momentary impulses. We are entities that project ourselves into the future, and when we sacrifice that future for a present spike in utility, we are not updating our preferences; we are fracturing our agency. The feeling of betrayal you experience when you skip the gym is not a bug in your software; it is the signal that you are a unified self, and you have just voted against your own long-term interests. Hyperbolic discounting explains why the vote went that way, but it does not make the result right. Akrasia remains, not as a mystery, but as a genuine failure to govern the temporal span of a human life.
