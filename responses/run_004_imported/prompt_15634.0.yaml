      *   **Key Philosophical Problem:** The "Dualism of Practical Reason" (Rational Egoism vs. Rational Benevolence/Utilitarianism).
      *   **The Stakes:** Without resolution, the "Cosmos of Duty" becomes a "Chaos."
      *   **Specific Challenge:** Explain how a *contingent empirical discovery* (ghosts/telepathy) can settle a *normative dispute* (ethics).

  2.  **Deconstruct Sidgwick's Ethical Problem (*The Methods of Ethics*):**
      *   Sidgwick identifies three methods: Intuitionism, Egoism, Utilitarianism.
      *   He finds Intuitionism vague.
      *   He finds Egoism (pursue own happiness) and Utilitarianism (pursue general happiness) both rationally self-evident *axiomatically*.
      *   *The Conflict:* Sometimes, what is best for me (Egoism) conflicts with what is best for everyone (Utilitarianism).
      *   *The Dualism:* Reason commands both, but they contradict. If reason contradicts itself, practical reason is irrational.
      *   *The Solution Needed:* A guarantee that virtue (duty/general good) and happiness (self-interest) ultimately coincide.
      *   *Traditional Solution:* God and Immortality (Kantian postulates). If there's a God who rewards virtue and an afterlife where justice is served, then doing duty *is* in my long-term self-interest.
      *   *Sidgwick's Dilemma:* He couldn't dogmatically assume God/Immortality. He needed evidence.

  3.  **Connect to Psychical Research (SPR):**
      *   Sidgwick didn't just "believe in ghosts." He looked for *evidence* of survival after death.
      *   Why? Because survival + divine governance = the coincidence of duty and interest.
      *   Therefore, SPR wasn't a hobby; it was an empirical search for the premises required to make his ethical system coherent.
      *   It was an attempt to turn a theological postulate into a scientific fact.

  4.  **Address the "Is-Ought" Problem (The Specific Challenge):**
      *   *Prompt Question:* How can an empirical fact (ghosts exist) settle a normative dispute (what should I do)?
      *   *Standard Humean View:* You can't derive an 'ought' from an 'is'.
      *   *Sidgwick's View:* Ethics is a rational system. If the system leads to a contradiction (Dualism), the system is flawed *unless* certain facts about the universe are true.
      *   *The Link:* The normative system *presupposes* a certain structure of reality to be rational. If the universe is purely material and death is the end, Egoism might win (grab what you can). If the universe is spiritual and governed by a moral deity, Utilitarianism aligns with Egoism.
      *   *Metaphysics supports Ethics:* The "ought" depends on the constitution of the "is." Specifically, the sanctions of morality (rewards/punishments) depend on the nature of reality.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:**
          *   Hook: The apparent split between the rigorous philosopher and the ghost-hunter.
          *   Thesis: This is a false dichotomy. The SPR work was the empirical wing of his ethical project.
          *   Roadmap: Explain the Dualism, the need for a theological/empirical solution, and how empirical facts bear on normative coherence.

      *   **The Dualism of Practical Reason:**
          *   Define Rational Egoism vs. Rational Benevolence.
          *   Explain why both seem self-evident to Sidgwick.
          *   Explain the conflict: Why is this a crisis? (Reason contradicting itself = Chaos).
          *   The need for harmony: Duty must equal Interest.

      *   **The Theological Gap:**
          *   Sidgwick was an agnostic/theist in tension. He couldn't just assume Christian dogma.
          *   He needed *proof* of a moral order (God + Immortality).
          *   Traditional religion was weakening (Victorian crisis of faith). Science was rising.
          *   He needed a "scientific" basis for faith.

      *   **Psychical Research as Empirical Theology:**
          *   SPR wasn't about seances for fun; it was data collection on survival.
          *   If survival is proven, the door opens to divine justice.
          *   This makes the sacrifice of self-interest for duty rational (paid back later).
          *   Quote: "Cosmos of Duty" vs. "Chaos."

      *   **Addressing the Empirical/Normative Link (Crucial Step):**
          *   Acknowledge the Humean objection.
          *   Counter-argument: Sidgwick isn't deriving 'ought' from 'is' directly. He is testing the *conditions of possibility* for a rational 'ought'.
          *   Analogy: A law is irrational if it demands the impossible. Ethics is irrational if it demands self-sacrifice in a universe that offers no recompense.
          *   The structure of the universe (empirical) determines the rationality of the ethical command (normative).

      *   **Conclusion:**
          *   Summarize the unity of his life's work.
          *   Final thought: Sidgwick represents the Victorian struggle to keep morality rational without dogma.
          *   The tragedy: He never found the proof he needed, leaving the Dualism unresolved.

  6.  **Refining and Polishing:**
      *   *Tone:* Academic, philosophical, persuasive.
      *   *Key Terms:* Dualism of Practical Reason, Rational Egoism, Utilitarianism, Self-Evident, Cosmos of Duty, SPR.
      *   *Check:* Did I answer the specific prompt about *why* empirical facts bear on normative disputes? Yes, by framing it as the *coherence of practical reason* depending on metaphysical facts.
      *   *Self-Correction during drafting:* Make sure not to say Sidgwick *found* the evidence. He didn't. He *sought* it. The argument is about his *motivation*, not the success of the SPR. Ensure the distinction between "proving ethics" and "proving the conditions that make ethics rational" is clear.

