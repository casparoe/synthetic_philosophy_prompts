answer: |-
  To view Henry Sidgwick's involvement with the Society for Psychical Research (SPR) as a Victorian eccentricity distinct from his rigorous work in *The Methods of Ethics* is to misunderstand the fundamental architecture of his philosophical project. It treats the philosopher of Cambridge as two separate men: the cold logician of ethics and the hopeful investigator of ghosts. In reality, these were two hands of the same body. Sidgwick's psychical research was not a hobby; it was an empirical extension of his ethical theory. It was a desperate, rational attempt to solve the "Dualism of Practical Reason," a problem that threatened to render morality itself irrational. To understand why Sidgwick sifted through testimony about telepathy and apparitions, one must understand why he believed that without evidence of a moral order beyond the grave, the "Cosmos of Duty" would inevitably collapse into a "Chaos."

  The core of Sidgwick's ethical system, as laid out in *The Methods of Ethics* (1874), is the search for a rational foundation for morality. Sidgwick dismantles traditional Intuitionism for being vague and inconsistent, leaving him with two remaining methods that appear axiomatic and self-evident to reason: Rational Egoism and Rational Benevolence (Utilitarianism). Rational Egoism dictates that it is reasonable for an agent to maximize their own happiness. Rational Benevolence dictates that it is reasonable to maximize the general happiness. In a perfect moral universe, these two commands would coincide; what is good for the world would be good for the self.

  However, Sidgwick observed that in the observable, natural world, they often do not coincide. Duty frequently demands self-sacrifice that yields no return in this life. If reason commands me to pursue my own good, and also commands me to pursue the general good, but these two goods are mutually exclusive, then Practical Reason is at war with itself. This is the "Dualism of Practical Reason." For Sidgwick, this was not merely a theoretical puzzle; it was a crisis of rationality. If reason contradicts itself, it ceases to be a guide for action. As he famously wrote, if the conflict between Egoism and Utilitarianism cannot be resolved, "the Cosmos of Duty is thus really reduced to a Chaos."

  To resolve this Dualism, Sidgwick needed a guarantee that virtue and happiness ultimately coincide. Historically, this guarantee was provided by religion: a God who rewards the virtuous and an afterlife where injustices are rectified. If the soul survives death and is subject to divine justice, then the self-sacrifice demanded by Utilitarianism is actually an investment in one's own eternal Egoistic happiness. Duty and Interest are reconciled.

  The problem for Sidgwick was that he lived in an age of declining religious dogma. He could not simply *assume* the existence of God or immortality as Kant had done with his "postulates of practical reason." Sidgwick was an empiricist; he required evidence. He could not build his ethical system on faith, but without the facts that faith traditionally supplied, his ethical system remained incoherent. This is where the Society for Psychical Research enters not as a diversion, but as a necessity.

  Sidgwick turned to psychical research because it promised to provide empirical evidence for the metaphysical premises required by his ethics. If telepathy, apparitions, or mediumship could be scientifically verified, they would constitute evidence that human consciousness survives bodily death. If survival could be established empirically, the door would be open to establishing the existence of a moral governance of the universe. Sidgwick was not looking for ghosts to comfort his grief; he was looking for data to save his ethics. He hoped to transform the theological postulates of immortality and divine justice from articles of faith into scientific facts. In this light, the SPR was the laboratory where Sidgwick attempted to secure the "independent guarantee" that duty and self-interest coincide.

  This leads to the most difficult philosophical hurdle in this argument: How can a contingent empirical discovery (e.g., "ghosts exist") settle a purely normative dispute (e.g., "I ought to be utilitarian")? Under a strict Humean framework, one cannot derive an 'ought' from an 'is'. Facts about the world are distinct from values. However, Sidgwick's project relies on a more integrated view of rationality. He is not trying to derive the *validity* of the moral axiom from the existence of ghosts. He accepts the axiom of Benevolence as self-evident. Rather, he is investigating the *conditions of possibility* for Practical Reason to remain coherent.

  For Sidgwick, ethics is a system of rational commands. A command is irrational if it requires an agent to act against their own reason without any ultimate justification. If the universe is purely material, and death is the end, then the Rational Egoist is correct: sacrificing one's own happiness for the general good is ultimately irrational, as it leads to a net loss for the agent with no compensation. In a godless, mortal universe, Utilitarianism is a noble but irrational sentiment. Conversely, if the universe is spiritual and governed by moral laws that persist after death, Utilitarianism becomes rational because the sacrifice is reimbursed.

  Therefore, the empirical structure of the universe determines the rationality of the ethical command. The 'ought' does not spring from the 'is', but the validity of the 'ought' depends on the 'is'. If the 'is' (a materialist universe) makes the 'ought' (self-sacrifice) self-defeating, then the 'ought' loses its binding rational force. Sidgwick needed to know the nature of the 'is' to confirm that the 'ought' was not a delusion. Psychical research was the tool to measure the 'is'.

  Consequently, treating Sidgwick's psychical research as a separable eccentricity is a category error. It ignores the fact that Sidgwick viewed the coherence of ethics as dependent on the metaphysical constitution of reality. He was attempting to save morality from the encroaching scientific naturalism of the 19th century by using the tools of science to validate the premises of faith. He sought to prove that the universe was not indifferent to moral action.

  Ultimately, Sidgwick's endeavor ended in a poignant silence. He never found the empirical proof he sought. The SPR produced ambiguous results, and the Dualism of Practical Reason remained, in his own admission, unresolved at the time of his death. He confessed that he could not bring himself to believe fully in the divine governance required to harmonize his ethics, yet he could not accept the chaos that followed from its absence.

  However, recognizing the unity of his work changes how we read *The Methods of Ethics*. It reveals Sidgwick not as a dry taxonomist of moral theories, but as a thinker grappling with the terrifying possibility that reason might demand mutually exclusive ends. His turn to psychical research was the logical culmination of this struggle. It was the attempt to find, in the hidden corners of empirical reality, the key to lock the "Cosmos of Duty" back together. To separate the ghost-hunter from the ethicist is to ignore the profound vulnerability at the heart of Sidgwick's philosophy: the fear that without a universe structured to support it, morality is nothing more than a rational mistake.
