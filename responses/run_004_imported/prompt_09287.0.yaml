  2.  **Analyze the Source Material (Bentham's "Offences Against One's Self"):**
      *   *Context:* Jeremy Bentham wrote extensively on sexual morality (paederasty, sodomy, etc.) in the late 18th/early 19th century, but these writings were unpublished during his lifetime due to their controversial nature.
      *   *Core Argument (Utility):* Bentham applies the principle of utility. Acts are only bad if they cause pain/harm.
      *   *Consent/Privacy:* He emphasizes that these acts are consensual and private. Therefore, no direct harm to others.
      *   *Punishment:* Punishment *is* pain. If the act causes no pain, but punishment causes immense pain (death, imprisonment, shame, blackmail), the utility calculus is negative. Punishment is unjustified.
      *   *Counter-arguments addressed:*
          *   "Unnatural": Bentham dismisses this as meaningless in utility terms.
          *   "Depopulation": He argues this is negligible or inconsistent (e.g., celibacy).
          *   "Health/Disease": He addresses this but often minimizes it compared to the pain of punishment.
      *   *Real Cause (Asceticism/Antipathy):* If not utility, why do these laws exist? Bentham attributes it to "asceticism" (the principle that pain is good/pleasure is bad) and "sympathetic antipathy" (disgust). The majority feels disgust and wants to punish the source of that feeling.
      *   *Publication History:* He did include some critiques in *Introduction to the Principles of Morals and Legislation* (IPML) but suppressed the specific chapters on sexual offences (Chapter XX of IPML was withheld).

