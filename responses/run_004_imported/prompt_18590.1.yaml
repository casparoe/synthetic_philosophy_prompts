      *   *The "Crisis" Angle:* It's not a crisis; it's a feature. It's the "human condition" of math.
      *   *Advice for the Piece:* Don't frame it as "math is broken." Frame it as "math is a human endeavor built on faith + utility." That's a better story.

  6.  **Refining the Argument (Self-Correction during drafting):**
