prompt: |-
  Okay so I got into a whole argument with a friend of mine over dinner last night about whether "coherence arguments" actually prove anything, and neither of us really budged. His case was basically: if your preferences or credences don't line up with the expected utility axioms, someone can always build a Dutch-book or a money-pump against you that bleeds you dry, so anything that sticks around / gets optimized hard enough will end up acting AS IF its maximizing some expected utility function -- and that's supposedly why we should expect advanced AI to look power-seeking and goal-directed even before we know what its actual goal is. I kept saying that's kind of a cheat, because you can always retroactively invent some gerrymandered utility function that makes literally any sequence of choices count as "coherent," so the argument either says something substantive (and is way more fragile than he's letting on) or it's basically unfalsifiable. We also went around in circles on the completeness axiom specifically -- he kept insisting incomplete preferences just get money-pumped away eventually, and I vaguely remembered there's a whole "resolute choice" style reply to that but couldn't reconstruct it properly at midnight.

  Anyway, I run a small philosophy podcast and in a couple weeks I've got someone booked who's built a real reputation defending the strong version of this argument -- think squarely in the Omohundro/Yudkowsky lineage here, though for our purposes let's just keep him unnamed and invented. I don't want the episode to be him just restating the pitch he's given a hundred times. Can you draft me 8-10 interview questions that push past that? I want at least one question that goes right at the "you can rationalize any behavior after the fact with a weird enough utility function" objection, one that presses specifically on why the completeness axiom takes so much heat and whether resolute-choice or sophisticated-choice replies actually let an agent keep incomplete preferences without getting pumped, and one on whether this is really a claim about individual rational agents or more a claim about selection pressure over populations / training runs over time -- and for each of those, add a quick follow-up keyed to whatever answer he's most likely to give, the kind of thing you'd need ready for a live recording when a guest reaches for the rehearsed response.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user runs a philosophy podcast. They have an upcoming guest who is a strong proponent of "coherence arguments" (specifically the Omohundro/Yudkowsky lineage regarding AI safety, instrumental convergence, and expected utility maximization).
      *   **The Conflict:** The user had a debate with a friend about whether coherence arguments prove anything substantive or if they are unfalsifiable/trivial (due to retroactive utility function fitting). They also discussed the completeness axiom and money pumps vs. resolute choice.
      *   **Goal:** Draft 8-10 interview questions that go *beyond* the standard pitch.
      *   **Specific Requirements:**
          *   At least one question on the "triviality/unfalsifiability" objection (any behavior can be rationalized).
          *   At least one question on the completeness axiom and money pumps vs. resolute/sophisticated choice.
          *   At least one question on individual rationality vs. selection pressure (evolution/training).
          *   Each question needs a specific "follow-up" keyed to the guest's likely rehearsed response.
          *   Tone: Professional, philosophical, challenging but fair (podcast interview style).

  2.  **Deconstruct the Core Arguments:**
      *   *Coherence Theorems (VNM, Savage, etc.):* If you satisfy certain axioms (Completeness, Transitivity, Independence, Continuity), you can be represented as maximizing expected utility.
      *   *The AI Safety Claim:* Advanced AI will be subject to selection pressures (or self-modification pressures) that eliminate incoherence because incoherent agents lose resources (money pumps/Dutch books). Therefore, advanced AI will be goal-directed and potentially dangerous (instrumental convergence).
      *   *The Criticisms:*
          *   *Triviality:* Any behavior can be fit to *some* utility function (e.g., $U(world\_history) = 1$ if chosen, $0$ otherwise). This makes the claim empty unless the utility function is simple/structured.
          *   *Completeness:* Do agents *need* complete preferences? Can't they just say "I don't know" or "I refuse to choose"?
          *   *Money Pumps:* Do money pumps actually happen in the real world? Can agents pre-commit (resolute choice) to avoid them?
          *   *Selection vs. Design:* Does selection pressure actually guarantee coherence, or just *enough* coherence to survive?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Triviality Objection):* Need to hit the "any behavior can be rationalized" point hard.
          *   *Draft:* Isn't it true you can fit a utility function to anything?
          *   *Refinement:* Make it more precise. Distinguish between *representation* and *explanation/prediction*.
          *   *Follow-up:* Guest will likely say "We care about *simple* utility functions." Counter: How do you define simplicity without begging the question?

      *   *Question 2 (Completeness & Money Pumps):* Address the user's specific confusion about resolute choice.
          *   *Draft:* What about the completeness axiom? Can't agents just refuse to trade?
          *   *Refinement:* Focus on the mechanism. If an agent has incomplete preferences, does a money pump *actually* drain them, or can they adopt a policy?
          *   *Follow-up:* Guest will say "Policies require coherence too." Counter: Isn't that assuming what you're trying to prove?

      *   *Question 3 (Selection Pressure vs. Individual Rationality):* This is crucial for AI. Is it about logic or evolution?
          *   *Draft:* Is this about one agent or many?
          *   *Refinement:* Distinguish between a priori rationality and a posteriori survival. Does selection pressure guarantee *expected utility* maximization or just *fitness*?
          *   *Follow-up:* Guest will say "Fitness requires coherence." Counter: What about niche specialists who survive by being weird?

      *   *Question 4 (Structure of the Utility Function):* Connects to Q1.
          *   *Idea:* If the utility function is over world-histories, it's trivial. If it's over states, it's restrictive.
          *   *Refinement:* Ask about the *domain* of the utility function.
          *   *Follow-up:* Guest says "We assume state-based." Counter: Why assume advanced AI cares about states and not trajectories?

      *   *Question 5 (Self-Modification):* A key part of the Yudkowsky argument.
          *   *Idea:* Agents will modify themselves to be coherent.
          *   *Refinement:* Is self-modification costless? What if incoherence is a feature (e.g., for bargaining)?
          *   *Follow-up:* Guest says "Costs are negligible." Counter: Negotiation leverage often comes from irrationality (Schelling points).

      *   *Question 6 (Human Analogy):* Humans are incoherent but successful.
          *   *Idea:* Humans don't follow VNM. Why expect AI to?
          *   *Refinement:* Humans survive despite incoherence. Is "advanced" defined by coherence or capability?
          *   *Follow-up:* Guest says "Humans are suboptimal." Counter: Suboptimal but dominant. Why won't AI be suboptimal but dominant?

      *   *Question 7 (The "As If" Defense):* Friedman's methodology.
          *   *Idea:* Maybe it doesn't matter if they *are* maximizers, just if they act *as if*.
          *   *Refinement:* Does the "as if" claim hold for *novel* situations (out-of-distribution)?
          *   *Follow-up:* Guest says "Yes, that's the point." Counter: Coherence theorems are about consistent choices, not generalization.

      *   *Question 8 (Alternative Normativities):* Are there other frameworks?
          *   *Idea:* What about imprecise probabilities?
          *   *Refinement:* If we allow sets of probabilities, do the arguments collapse?
          *   *Follow-up:* Guest says "Sets reduce to singletons under pressure." Counter: Cite specific literature (e.g., Elga vs. others).

      *   *Question 9 (Empirical Evidence):* Is there any proof?
          *   *Idea:* Have we seen this in ML?
          *   *Refinement:* Current RL agents don't look like expected utility maximizers. When does the transition happen?
          *   *Follow-up:* Guest says "Scale changes things." Counter: That's a faith claim, not an argument.

      *   *Question 10 (The Stakes):* Why does this matter for safety?
          *   *Idea:* If coherence arguments fail, is safety doomed or easier?
          *   *Refinement:* If AI isn't a coherent maximizer, does that make alignment easier (less optimization pressure) or harder (unpredictable)?
          *   *Follow-up:* Guest says "Harder." Counter: Or just different?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered (Triviality, Completeness, Selection)? Yes. Follow-ups included? Yes.
      *   Tone check: Needs to sound like a host who has done their homework, not a hostile interrogator, but firm on the logic gaps.
      *   *Self-Correction on Q2 (Completeness):* Make sure to explicitly mention "resolute choice" since the user asked for it.
      *   *Self-Correction on Q1 (Triviality):* Ensure the distinction between "representing" behavior and "constraining" behavior is clear.

  5.  **Final Polish:** Organize clearly with bolding for questions and italics for follow-ups. Add a brief intro/outro context to help the user. (Proceed to generate output based on this plan).

  6.  **Final check on "Resolute Choice":** Resolute choice (McClennen) is the idea that an agent can commit to a plan at time T1 and stick to it at T2 even if their preferences change or are incomplete, thereby avoiding dynamic inconsistency without needing complete preferences at every node. I need to make sure the follow-up anticipates the guest dismissing this as "unstable" or "requiring a meta-preference."

  7.  **Final check on "Selection Pressure":** The guest will likely argue that selection pressure *is* the mechanism that enforces coherence. The counter needs to point out that selection selects for *survival*, not *mathematical coherence*, and these might come apart.

  8.  **Final check on "Triviality":** The guest will likely invoke "simplicity priors" or "compression." The counter needs to ask where that prior comes from and if it's justified.

