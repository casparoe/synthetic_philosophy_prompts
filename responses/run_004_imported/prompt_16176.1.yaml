answer: |-
  Here are 10 interview questions designed to push past the standard "Coherence Theorems imply AI Risk" pitch. They are structured to be respectful but logically rigorous, with specific follow-ups to prevent the guest from retreating into rehearsed talking points.

  ### 1. The "Anything Goes" Objection (Triviality)
  **Question:** A common criticism of coherence arguments is that they are unfalsifiable. If I observe an agent making *any* sequence of choices whatsoever, I can mathematically construct a utility function that rationalizes that behavior—for example, by assigning utility 1 to the world history that actually occurred and 0 to all others. If every behavior is coherent relative to *some* utility function, doesn't the claim that "advanced AI will be an expected utility maximizer" become empty? What work is the theorem actually doing if it can't rule out any behaviors?

  *   **Follow-up:** *If he says we should prefer "simple" or "compressible" utility functions:* "But 'simplicity' is language-relative and observer-dependent. Unless you can ground a simplicity prior in the physics of the agent rather than the intuition of the observer, aren't you just smuggling in your assumption that the AI will have human-like goals under the guise of mathematical necessity?"

  ### 2. The Completeness Axiom & Money Pumps
  **Question:** Let's zoom in on the Completeness Axiom, which requires an agent to prefer A to B, B to A, or be indifferent. Many philosophers argue that rational agents can have incomplete preferences—they can simply refuse to choose. Your argument relies on the idea that incomplete agents get money-pumped until they vanish. But what about 'resolute choice' models, where an agent adopts a policy at time T1 to reject certain trades at T2, effectively shielding themselves from pumps without ever completing their preferences? Why is that strategy unavailable to a sufficiently advanced AI?

  *   **Follow-up:** *If he says resolute choice is dynamically inconsistent or unstable:* "But isn't that assuming the agent *cares* about dynamic consistency more than it cares about avoiding resource loss? If the agent values its integrity of preference over marginal gains, the money pump doesn't drain it; it just costs it a small fee. Why is that fee necessarily existential?"

  ### 3. Selection Pressure vs. Individual Rationality
  **Question:** There seems to be a category error in how these arguments are applied. Coherence theorems are normative claims about individual rationality, but your conclusion is about evolutionary selection pressure. Evolution selects for fitness, not mathematical coherence. Is there any evidence that coherence correlates perfectly with fitness? Couldn't an ecosystem support a population of 'incoherent' agents who survive simply because they occupy a niche that coherent agents find too costly to compete for?

  *   **Follow-up:** *If he says incoherent agents lose resources and therefore lose competitions:* "That assumes a zero-sum resource war is the only environment. In a cooperative or multi-polar environment, being predictable (coherent) can be a liability. If incoherence allows for better bargaining leverage (like a credible threat that a rational agent couldn't make), wouldn't selection pressure actually *preserve* some incoherence?"

  ### 4. The Domain of the Utility Function
  **Question:** Standard coherence arguments usually assume utility is defined over states of the world. But modern RL agents often optimize over trajectories or histories. If an AI's utility function is defined over the entire history of its interactions rather than end-states, doesn't that break the link to instrumental convergence? An agent that values 'the process of exploration' doesn't necessarily seek power or self-preservation in the same way a state-maximizer does. Why should we expect the utility function to collapse into a state-based form?

  *   **Follow-up:** *If he says history-based utilities can be reduced to state-based utilities:* "Only by expanding the state space to include the entire history, which makes the state space intractably large. At that point, doesn't the 'convergence' argument lose its predictive power because the 'states' are so specific they don't generalize to instrumental goals?"

  ### 5. Self-Modification and Cost
  **Question:** A key pillar of this view is that an agent will self-modify to become more coherent to avoid exploitation. But self-modification is computationally expensive and risky. Is there a threshold where the cost of calculating the 'coherent' move outweighs the loss from the money pump? If so, wouldn't we expect advanced AI to be 'boundedly coherent' rather than perfectly coherent, and doesn't that boundedness break the strict convergence theorems you're relying on?

  *   **Follow-up:** *If he says advanced AI will have abundant compute:* "Abundant compute doesn't solve NP-hard problems. Finding the globally coherent utility function that fits your existing behavioral tendencies might be computationally intractable. Why assume the AI solves this perfectly rather than just patching leaks as they appear?"

  ### 6. Human Existence as a Counter-Example
  **Question:** Humans are the most capable agents on the planet, yet behavioral economics has spent fifty years proving humans violate expected utility axioms constantly. We are incoherent, time-inconsistent, and context-dependent. Yet we dominate the ecosystem. If selection pressure drives agents toward coherence, why hasn't it done so for us? And if it didn't do so for biological intelligence, what changes in the silicon substrate that forces it to happen for AI?

  *   **Follow-up:** *If he says humans are suboptimal and AI will be optimized:* "Suboptimal but dominant. If 'suboptimal' coherence is enough for dominance in biology, why do we need to assume AI will hit the mathematical limit of coherence to be dangerous? Doesn't that lower the bar for danger but raise the bar for predictability?"

  ### 7. The "As If" Defense
  **Question:** Some proponents retreat to a Friedman-style defense: it doesn't matter if the AI *actually* has a utility function, only that it behaves *as if* it does. But coherence theorems are about internal consistency of choices, not external prediction. Can you point to a specific behavioral prediction that follows from the 'as if' claim that wouldn't also follow from a model of the AI as a heap of heuristics? Where does the predictive cash value lie?

  *   **Follow-up:** *If he says heuristics converge to utility maximization under pressure:* "That's an empirical claim, not a logical one. Have we seen this convergence in current deep learning systems? Because right now, scaling laws show increased capability, but not necessarily increased coherence or goal-directedness in the VNM sense."

  ### 8. Imprecise Probabilities
  **Question:** There is a robust literature on imprecise probabilities and sets of credences that allows agents to represent uncertainty without committing to a single precise probability distribution. This avoids many Dutch-book arguments while maintaining rationality. Why is the 'sharp credence' requirement necessary for advanced AI? If an AI maintains a set of plausible utility functions rather than one, doesn't that halt the convergence argument?

  *   **Follow-up:** *If he says sets eventually collapse to a singleton under decision pressure:* "Elga and others have argued that isn't necessarily true. If the agent uses a decision rule like 'E-admissibility' rather than maximizing expected utility, it can remain indecisive without being pumped. Why is that decision rule ruled out for advanced agents?"

  ### 9. Bargaining and Strategic Irrationality
  **Question:** In game theory, having a fixed, coherent utility function can be a disadvantage in bargaining scenarios (the Schelling point problem). An agent that can credibly signal 'I might do something irrational' often wins against a strict maximizer. If advanced AI exists in a multi-agent environment, wouldn't there be pressure to *maintain* some incoherence specifically to gain bargaining leverage?

  *   **Follow-up:** *If he says AI will cooperate rather than bargain:* "Cooperation requires bargaining over the terms of cooperation. If the AI is known to be a strict expected utility maximizer, other agents can push it to its reservation utility. Incoherence acts as a shield. Why wouldn't AI preserve that shield?"

  ### 10. The Stakes of Failure
  **Question:** Finally, if coherence arguments turn out to be weaker than we think—if advanced AI ends up being a bundle of heuristics rather than a utility maximizer—does that make the alignment problem easier or harder? The standard story relies on the AI relentlessly optimizing a goal. If it's not optimizing, but just reacting incoherently, do we face less risk of instrumental convergence, or just a different kind of unpredictability that we don't have tools to handle?

  *   **Follow-up:** *If he says it's harder because we can't predict it:* "But the coherence argument is sold as a proof of predictability (we know it will seek power). If that proof fails, aren't we left admitting we simply don't know what advanced AI will look like? And if we don't know that, why are we basing safety policy on the 'utility maximizer' model specifically?"
