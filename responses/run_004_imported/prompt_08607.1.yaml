      *   **All Affected Interests (AAI):** Anyone affected by a decision should have a say. (Supports students & foreigners).
      *   **All Subjected to Coercion (ASC):** Anyone subject to the binding laws/coercion of the state should have a say. (Supports students, maybe less so foreigners depending on enforcement).
