      *   Frederick Whelan's argument: The boundary problem cannot be solved democratically; it's pre-democratic.
      *   Robert Dahl's *Polyarchy*: The *demos* is usually assumed, not derived.
      *   Andrew Rehfeld: Representation vs. Membership.
      *   *Key Insight:* Different principles serve different democratic values (Legitimacy vs. Justice vs. Stability).

  5.  **Drafting the Response - Section by Section:**

