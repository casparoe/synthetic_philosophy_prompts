      *   **Dev's Position:** It's an engineering problem. HS and DT are distinct computations. We just need to find the right training pressure/regularization to select DT. There is a fact of the matter about which computation the network is doing.
      *   **User's Position:** This begs the question. It relies on a naive correspondence theory of meaning. Without an independent way to fix reference, we face Quine's indeterminacy of translation or Kripke's rule-following paradox. Any finite training history is compatible with multiple reporter functions. Calling one "real" smuggles in interpretation.
      *   **Task:** Write the strongest possible version of the *User's* side.
      *   **Specific Requirements:**
          *   Don't just name-drop Quine/Kripke; engage with the substance.
