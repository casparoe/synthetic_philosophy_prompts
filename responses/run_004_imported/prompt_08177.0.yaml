          *   *Rebuttal:* Simplicity is relative to the description language. A "Human Simulator" might be computationally cheaper if the human model is already embedded in the predictor. Also, "simplicity" doesn't fix *reference*. A simple circuit can still be interpreted as simulating humans if the interpretation map is twisted.
          *   *Consistency Checks:* Ask related questions.
          *   *Rebuttal:* A sophisticated HS can be consistent too. It simulates a consistent human. This just pushes the indistinguishability to a higher order.
      *   **The "White Box" Counter-Argument (Crucial Step):**
          *   Dev says: "We see the weights! We aren't limited to I/O."
          *   User's Rebuttal: Inspecting weights just gives you more syntax. To say "Neuron 42 means Diamond" is an *interpretive hypothesis*.
          *   *The Interpretability Regress:* To verify the interpreter, you need an interpreter for the interpreter. You can't step outside the system to check the mapping without assuming the very mapping you're trying to verify.
          *   *Ontological Parsimony:* Dev assumes there *is* a fact of the matter. The user argues the "fact" is relative to the interpretive framework we impose.
      *   **Conclusion:** Summarize. The ELK problem isn't solvable by just "trying harder" on training; it requires solving the grounding problem.

