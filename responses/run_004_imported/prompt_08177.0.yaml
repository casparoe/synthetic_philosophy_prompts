      *   *Key Insight to highlight:* The "Direct Translator" is defined by its relationship to the *world*, but the training process only has access to the *model* and the *human labels*. The link to the world is the missing variable.

      *   *Addressing the "Internals" objection specifically:* This is the strongest part of Dev's potential counter. I need to make sure I crush it. The argument is: "Inspecting the circuit tells you *how* it computes, not *what* it computes refers to." A circuit adding numbers could be adding "apples" or "sensor readings of apples." The physics of the GPU doesn't care.

