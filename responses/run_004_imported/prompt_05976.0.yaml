      *   *Premise 2:* Standard quantum randomness (Born rule) kills free will (it's just randomness, not control).
      *   *Proposal:* "Freebits" are initial conditions of the universe that are causally isolated and thus lack a defined probability distribution (Knightian uncertainty vs. Risk).
