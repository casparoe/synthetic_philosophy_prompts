answer: |-
  First off, take a deep breath: **you did not teach your students anything wrong.** You taught them the standard, canonical introduction to Expected Utility (EU) theory that appears in every Micro PhD core sequence (Varian, Mas-Colell, Kreps, etc.). Bernoulli's 1738 resolution is the *foundational* move that birthed the concept of utility itself.

  However, your intuition that the literature treats it as "unsolved" is also correct. You have stumbled upon one of the classic "rite of passage" realizations for Econ PhDs: **The distinction between the *introductory* resolution and the *technical* resolution.**

  Here is the breakdown of why the St. Petersburg Paradox (SPP) is still alive and kicking in the literature, why Bernoulli's solution is technically insufficient for a general theory, and how you should adjust your mental model (and maybe your section notes) moving forward.

  ### 1. The Menger Critique (1934)
  This is the specific technical gap you are missing. Bernoulli showed that if $U(w) = \ln(w)$, the expected utility of the St. Petersburg lottery is finite.

  However, in 1934, Karl Menger (yes, *that* Menger's son) published a paper showing that **for any unbounded utility function, you can construct a St. Petersburg-like lottery that yields infinite expected utility.**

  If your utility function grows as $w^{0.5}$, I can make the payoff grow as $2^{2n}$. If your utility grows as $\ln(w)$, I can make the payoff grow as $e^{2^n}$. As long as $U(w)$ is unbounded, there exists a payoff sequence $x_n$ such that $\sum p_n U(x_n) = \infty$.

  **The Implication:** To fully "solve" the paradox within the vNM framework, you cannot just assume *concavity*; you must assume **bounded utility**.
  *   **The Problem:** Bounded utility creates massive headaches for macroeconomics and finance. If utility is bounded, there exists a level of wealth where an agent becomes risk-neutral or behaves perversely regarding large stakes. It conflicts with standard growth models and asset pricing.
  *   **Why it's still published:** The tension between "we need bounded utility to avoid SPP" and "we need unbounded utility for tractable macro models" is an active theoretical friction.

  ### 2. The "Ergodicity" Revival (Ole Peters et al.)
  In the last 10–15 years, there has been a surge of papers (led by physicist-turned-economist Ole Peters) arguing that Bernoulli—and the entire vNM tradition—made a category error.

  Their argument is that Expected Utility Theory conflates **ensemble averages** (expectations across parallel universes) with **time averages** (what happens to one person over time).
  *   In the SPP, the expected value is an ensemble average.
  *   But a real agent plays the game sequentially over time.
  *   Peters argues that if you look at the **geometric time average** of wealth growth, the divergence disappears without needing to invoke subjective utility functions at all.

  This is controversial, but it's high-profile. It frames SPP not as a problem of "psychology" (concave utility) but as a problem of "non-ergodicity" in stochastic processes. This is why you see physics journals and heterodox econ journals churning out SPP papers.

  ### 3. Probability Weighting (Prospect Theory)
  Modern decision theory (post-1979) acknowledges that people don't just transform *outcomes* (utility); they transform *probabilities*.
  *   In Rank-Dependent Utility or Cumulative Prospect Theory, people overweight small probabilities.
  *   However, some resolutions argue that people effectively *truncate* probabilities below a certain threshold (ignoring events that happen once in a billion years).
  *   Literature here explores whether the paradox persists if we model probability weighting functions that decay fast enough to counteract the payoff growth.

  ### 4. Finite Bankrolls (The Real-World Constraint)
  A more pragmatic line of literature points out that the SPP assumes a casino with infinite capital.
  *   If the casino has finite wealth $W$, the game must end after $L$ rounds where $2^L > W$.
  *   Once you cap the game, the expected value is no longer infinite; it's roughly $\log_2(W)$.
  *   While this seems like a "cop-out," it connects to literature on counterparty risk and the pricing of extreme tail events in financial markets. It shifts the question from "Why won't I pay?" to "Who is selling this?"

  ### So, is it a "Zombie Paradox"?
  It's not a zombie; it's a **stress test**.

  In the same way that physicists still talk about Zeno's Paradox not because they think Achilles can't catch the tortoise, but because it forces them to refine their definitions of limits and continuity, economists use SPP to test the boundaries of decision theories.

  *   **If you propose a new decision theory:** You must show how it handles SPP.
  *   **If you critique EU:** SPP is your Exhibit A (via Menger).
  *   **If you work on asset pricing:** SPP is the limit case of pricing assets with fat tails.

  ### Pedagogical Advice for Your Section
  You do not need to go back and tell your undergrads, "Actually, everything I said last week is contested." That would be pedagogical malpractice.

  1.  **Keep the Bernoulli Story:** It is the historically correct and intuitively necessary introduction to risk aversion and concave utility. It motivates $E[U(x)]$ perfectly.
  2.  **Add a "Graduate Level" Footnote:** If you want to be precise (or if a sharp undergrad asks), you can add a nuance:
      > "Bernoulli's solution works for *this specific* payoff structure. However, mathematicians later showed that if we increase the payoff growth rate, we can break any unbounded utility function. This implies that to fully resolve the paradox mathematically, we'd need to assume utility is *bounded*, which has its own economic implications we'll discuss later in the sequence."
  3.  **Reassure Yourself:** You aren't behind. You are just transitioning from **consuming models** (where SPP is solved by log utility) to **evaluating axioms** (where SPP reveals the fragility of unbounded utility).

  **Summary:** You taught the standard model. The literature isn't ignorant; they are probing the edge cases where the standard model breaks (Menger) or proposing alternative frameworks entirely (Ergodicity/Prospect Theory). It is safe to keep teaching Bernoulli, but now you know why the research seminar room is still arguing about it.
