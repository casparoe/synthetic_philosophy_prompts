      *   *Bratman:* Explains disappointment and rational criticism. "You were unreliable." But does it explain the *authority* to scold? Maybe weakly, via norms of cooperation.
      *   *Gilbert:* Explains the *right* to rebuke perfectly. "We committed, you broke the commitment, you owe me."
      *   *Comparison:* Gilbert wins on normative force. Bratman wins on metaphysical parsimony.

