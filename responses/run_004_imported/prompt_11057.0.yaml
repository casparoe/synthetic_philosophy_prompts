answer: |-
  This is a fantastic question, and honestly, your history project fiasco is the exact kind of real-world friction that drives this entire philosophical debate. You've hit on the central tension in the philosophy of social action: **Is a "We" just a bunch of "I"s working in sync, or is it a new thing entirely?**

  You have correctly identified the two heavyweights. Michael Bratman represents the **Individualist (or Reductionist)** camp, and Margaret Gilbert represents the **Non-Reductionist (or Plural Subject)** camp.

  Let's break down their machinery, see how they handle your flaky group mate, and tackle your specific questions about obligation and "spookiness."

  ---

  ### 1. Michael Bratman: The Architect of Interlocking Intentions

  Bratman wants to save us from "group minds." He thinks we don't need to posit any mysterious social entities to explain why we can paint a house or do a history project together. For Bratman, **shared intention is a web of individual attitudes.**

  #### The Recipe for "We"
  For Bratman, "We intend to J" (e.g., complete the history project) is true if and only if:
  1.  **I intend** that we J.
  2.  **You intend** that we J.
  3.  **Interdependence:** I intend that we J *because* I know you intend it, and vice versa. (This is crucial; it's not just parallel play).
  4.  **Common Knowledge:** We both know 1–3 are happening.
  5.  **Meshing Subplans:** I plan to write the intro, you plan to do the slides. These plans don't conflict, and we know they don't.

  #### Where does the obligation come from?
  This is where your question gets sharp. Bratman admits that intentions aren't just predictions; they are **normative** for the agent. If I intend to do X, I *ought* to do X (unless I have a good reason not to). This is a norm of **consistency and stability**.

  In a shared intention, my intention relies on yours. If you bail, you aren't just changing your mind; you are undermining the very structure that allowed me to form my intention in the first place.
  *   **The Bratmanian Rebuke:** "Hey, I formed my intention to do the research *based on* your intention to do the slides. By quitting, you've made my intention irrational/unstable. You violated the norms of cooperative agency."

  #### The Weakness
  Critics (including Gilbert) argue that Bratman explains **disappointment** well, but not **entitlement**.
  If your group mate flakes, Bratman explains why you are annoyed (your plans are messed up) and why they were irrational (they were inconsistent). But does it explain why you have the *right* to demand they do it?
  In Bratman's world, if I decide I no longer intend to do the project, I just... stop intending. As long as I tell you, I haven't violated a moral law. I've just changed my mental state. You can't really say I *wronged* you, only that I *inconvenienced* you.

  ---

  ### 2. Margaret Gilbert: The Plural Subject

  Gilbert looks at that same situation and says Bratman is missing the glue. She argues that you can have interlocking intentions without having a true "joint action." (Example: Two strangers running for cover in the rain both intend "We stay dry," but they aren't *jointly* acting).

  For Gilbert, shared intention requires a **Joint Commitment**.

  #### The Recipe for "We"
  1.  **Expression of Willingness:** We don't need a formal contract. We just need to express willingness to be jointly committed to a goal. (e.g., "Yeah, let's do this project together.")
  2.  **Common Knowledge:** We both know we've expressed this willingness.
  3.  **The Plural Subject:** This creates a new ontological entity. We are no longer just You and Me; we are a **"We"** (a plural subject). This "We" is the bearer of the intention.

  #### Where does the obligation come from?
  This is Gilbert's killer feature. She argues that joint commitment creates **sui generis** (unique/in a class of its own) obligations.
  *   When we jointly commit, I don't just owe it to myself to follow through; **I owe it to you.**
  *   Conversely, **you have a right to my performance.**
  *   This is why you can rebuke the flaker. It's not just that they were unreliable; it's that they violated a commitment *to you*.

  #### The "Spookiness" Factor
  You asked if this is too strong or "spooky." Philosophers call this **ontological inflation.** Gilbert is saying that by saying "Let's do this," you literally create a new social object (the plural subject) that binds you.
  *   **The Objection:** How does mere words/willingness create a binding obligation without a promise? Usually, obligations come from morality or contracts. Gilbert says sociality *itself* is a source of obligation.
  *   **Her Defense:** She argues it's not magic; it's the fundamental structure of social life. If you couldn't generate obligations this way, society wouldn't function. The "spookiness" is just the price of admitting that human sociality is real and not just a sum of individuals.

  ---

  ### 3. The Showdown: Who Explains the "Wrong"?

  Let's apply this to your history project.

  **Scenario:** You did your part. The other kid didn't. You feel angry and entitled to yell at them. They say, "I just changed my mind, sorry."

  #### Bratman's Verdict
  Bratman says you are rational to be frustrated, but metaphysically, the kid is allowed to change their mind.
  *   **Can he earn the obligation?** Barely. Bratman has tried to patch this in later work by adding "normative expectations." He argues that when we share intentions, we create a normative expectation that *functions like* an obligation.
  *   **Does he borrow from Gilbert?** Many critics say **yes.** To get the "right to rebuke" that you felt, Bratman has to sneak in a normative premise that looks suspiciously like a commitment. If he stays a pure individualist, he can only say, "You were inconsistent," not "You wronged me."
  *   **The Feeling:** Bratman explains the *pragmatic* failure (the project failed), but struggles to explain the *moral* sting (I feel betrayed).

  #### Gilbert's Verdict
  Gilbert says you are absolutely entitled to rebuke them.
  *   **The Obligation:** By agreeing to the group project, you formed a plural subject. That kid didn't just quit a task; they unilaterally dissolved a commitment that required *both* of you to dissolve.
  *   **The Right to Rebuke:** Because the obligation is owed *to you*, you have the standing to demand compliance or an apology.
  *   **The Feeling:** This matches your intuition perfectly. The reason you feel "wronged" rather than just "inconvenienced" is because a joint commitment was breached.

  ---

  ### 4. Addressing Your Specific Doubts

  #### "Can Bratman's individualist picture actually earn that sense of obligation?"
  **Honest answer:** Probably not fully.
  Bratman's theory is amazing at explaining *how* we coordinate (the mechanics of meshing subplans and common knowledge). But it is weak on *why we are bound*.
  In Bratman's view, intentions are inherently unstable. I can drop an intention whenever I want. If shared intention is just my intention + your intention, then I can drop the shared intention whenever I want.
  To get the "you can't just quit" feeling, Bratman has to argue that dropping the intention is *irrational* or *immoral* for other reasons. But Gilbert argues the obligation is **internal** to the joint action itself. Most philosophers who care about the *normativity* (the "oughtness") of group action lean toward Gilbert here because Bratman's "obligation" feels too thin. It feels like he's describing a handshake, while Gilbert is describing a contract.

  #### "Is Gilbert's plural subject thing too strong/spooky?"
  **Honest answer:** It is metaphysically heavy, but maybe not "spooky."
  It feels spooky if you think the only real things are individuals. If you are a methodological individualist (only individuals exist), then Gilbert is positing ghosts.
  However, if you accept that **social facts** are real (like money, marriage, or governments), then a "plural subject" isn't much spookier than a "corporation." A corporation is a legal "person" that can own things and be sued, even though it's made of people. Gilbert is saying a "We" is a social "person" that can hold commitments.
  The risk with Gilbert is that she might make it *too* hard to quit. If every "let's do this" creates a binding obligation, are we constantly trapped in thousands of tiny commitments? Gilbert says yes, but usually, we have implicit ways to dissolve them (like giving notice). But strictly speaking, she argues you *cannot* unilaterally withdraw without wrongdoing.

  ### The Verdict for Your History Project

  If you want to understand **how the coordination worked** (how you divided the labor, how you knew what the other was doing), **Bratman** is the better tool. His "meshing subplans" is a brilliant description of the logistics of group work.

  But if you want to understand **why you feel angry and entitled to complain**, **Gilbert** wins hands down.
  *   **Bratman** says: "They failed to maintain the interlocking web of intentions." (Technical failure).
  *   **Gilbert** says: "They breached a joint commitment owed to you." (Normative violation).

  Your intuition that you were *wronged* (not just inconvenienced) suggests that our social reality operates more like Gilbert says. We treat agreements to act together as binding, even without signed contracts.

  **Does Bratman secretly borrow from Gilbert?**
  In a way, yes. To make his theory work for real-world social norms, Bratman has to acknowledge that these interlocking intentions create "normative expectations" that function very much like Gilbert's obligations. He tries to derive them from individual rationality, but many argue he can't get the full "force" of the obligation without admitting that the *relationship itself* creates the norm.

  **Summary:**
  *   **Bratman:** Great for the mechanics of "How do we do this together?" Weak on "Why can I yell at you when you stop?"
  *   **Gilbert:** Great for the normativity of "Why can I yell at you?" Heavy on the metaphysics ("Who is the 'We' that you betrayed?").

  Given your frustration, Gilbert's theory validates your feelings: You weren't just two individuals near each other; you were a unit, and they broke the unit.
