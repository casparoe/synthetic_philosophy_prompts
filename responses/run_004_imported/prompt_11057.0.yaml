          *   *Components:*
              1.  I intend that we J.
              2.  You intend that we J.
              3.  I intend that we J because of 1 & 2 (and vice versa).
              4.  Common knowledge of 1-3.
              5.  Meshing subplans (our specific ways of doing it don't conflict).
          *   *Normativity:* Obligations arise from the stability and reliance inherent in the intentions. If I intend, you rely on me. If I bail, I violate norms of rationality and reliability.
          *   *Weakness:* It feels like "I let you down" rather than "We were bound together." It struggles to explain the *right to rebuke* purely from individual attitudes.

      *   **Margaret Gilbert (Joint Commitment/Plural Subject):**
          *   *Core Idea:* Shared intention requires a *joint commitment*.
          *   *Components:*
              1.  Expression of willingness (not necessarily a promise).
              2.  Common knowledge of this willingness.
              3.  Creation of a "Plural Subject" (a "We").
          *   *Normativity:* The commitment creates *sui generis* obligations. You owe it to *me* (and the group) to fulfill your part. I have a *right* to demand compliance.
          *   *Weakness:* Metaphysically "spooky." How does saying "I'm willing" create a binding obligation without a moral promise? It posits a new ontological entity (the plural subject).

  3.  **Address the Specific Evaluation Criterion (The "Flaking" Scenario):**
