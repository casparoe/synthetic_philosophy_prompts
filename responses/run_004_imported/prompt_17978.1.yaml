      *   *Deep Level:* It's about the *constitution* of the kind.
      *   *Interactive Kinds vs. Indifferent Kinds:* This is the crucial distinction. Indifferent kinds (quarks, tigers) exist independently of our classification. Interactive kinds (people classified as "multiple personality," "refugee," "criminal") *change* in virtue of being classified.
      *   *The Ontological Claim:* It's not just that behavior changes; it's that the *possibility space* of being human changes. The classification creates a new way to *be*. It's not just describing a pre-existing thing; it's participating in the making of the thing.
      *   *Dynamic Nominalism:* This is the specific metaphysical label Hacking uses. "Some kinds of human beings come into existence at the same time as the kind itself."
      *   *Answer to User's Question:* It's *both* the category rewriting and the contrast with natural kinds, but specifically because the interaction *constitutes* the reality of the kind. The loop isn't just feedback; it's generative.

