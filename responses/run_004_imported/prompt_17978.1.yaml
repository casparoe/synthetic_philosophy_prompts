answer: |-
  This is a classic stumbling block in reading Hacking. It is very easy to walk away from *Rewriting the Soul* or *Mad Travelers* thinking, "Okay, so labels influence behavior. Got it." If that were all there was, it would indeed be basic labeling theory (like Scheff or Rosenhan) and not worthy of a dedicated ontology seminar.

  Your professor is right: there is a metaphysical claim here, not just a sociological one. To answer your questions, we need to distinguish between **causal feedback** (the banal version) and **constitutive feedback** (the deep version), and then look at how Hacking navigates the realism trap.

  Here is the breakdown of what is doing the philosophical lifting.

  ### 1. The Ontological Bite: Dynamic Nominalism
  You asked if the deep part is that the *category* gets rewritten or that there is a contrast with *natural kinds*. The answer is that the contrast with natural kinds reveals that the *people themselves* are being rewritten.

  Hacking calls his position **Dynamic Nominalism**.
  *   **Indifferent Kinds (Natural Kinds):** If you classify a quark or a tiger, the quark or tiger does not care. The classification tracks a pre-existing reality. If our theory of quarks changes, the quarks don't change; only our map changes.
  *   **Interactive Kinds (Human Kinds):** When you classify a person, the classification becomes part of the causal environment of that person. But Hacking goes further: the classification creates a **new possibility for being**.

  **The Banal View:** "I told the patient he has MPD, so he acts more dissociative." (Causal influence on behavior).
  **The Hacking View:** "Before the concept of MPD existed, there was no way to *be* a person with MPD. Once the concept exists, it creates a niche. People can now inhabit that niche. They don't just act differently; they conceive of their own interiority differently."

  In *Rewriting the Soul*, Hacking argues that the "memory" of the trauma isn't just a buried file being dug up; the very idea that "I am a person whose soul is defined by repressed memory" is a technology of the self that becomes available only at a specific historical moment.

  So, the ontological claim is this: **Human kinds are not static targets that we are slowly getting better at describing. Human kinds are moving targets that change *because* we are describing them.** The loop isn't just noise in the data; the loop is the mechanism by which the *kind* comes into existence.

  ### 2. Pushing Back on the Co-Evolution Objection
  Your classmate's point is clever but misses the specific mechanism Hacking is isolating. Co-evolution is a biological/causal process; Looping is a **semantic/normative** process.

  **The Distinction:**
  *   **Co-evolution:** A predator gets faster, so the prey gets faster. This happens over generations via natural selection. The prey does not need to *know* it is being classified as "prey." The loop runs through genetics and survival rates.
  *   **Looping Effects:** This requires **uptake**. For a looping effect to work, the classified person must (consciously or unconsciously) grasp the *meaning* of the classification and adjust their self-conception accordingly.

  **The Counter-Argument:**
  A tiger does not read the *Journal of Zoology*. A tiger does not know it is classified as "Panthera tigris" or "Endangered Species," and it does not change its hunting strategy because it wants to fulfill the prophecies of conservationists.

  A "fugueur" (from *Mad Travelers*), however, knows (via culture, doctors, or newspapers) that there is a script called "fugue." They might travel because they feel an impulse, but they interpret that impulse *through* the medical category. They might go to a doctor *expecting* to be diagnosed. The loop runs through **knowledge and identity**.

  **The Philosophical Lift:** Hacking is isolating a specific type of causality unique to self-describing animals. It's not just that the environment changes the organism (co-evolution); it's that the *description of the organism* changes the organism. That requires a capacity for self-reference that tigers don't have.

  ### 3. The Realism Trap: Are MPD/ADHD "Real"?
  This is where most students get stuck. They think Hacking is forced into a binary:
  1.  **Biological Realism:** ADHD is a brain lesion waiting to be found. (Hacking rejects this as too static).
  2.  **Social Constructionism:** ADHD is a fake label invented by doctors to control kids. (Hacking rejects this as dismissive of suffering).

  Hacking carves out a middle path, often called **Historical Ontology**.

  **The "Making Up People" Argument:**
  Hacking famously wrote an essay called "Making Up People." He doesn't mean "fabricating lies." He means that new ways of being a person are *manufactured* through the interaction of institutions, experts, and subjects.

  *   **Is the suffering real?** Yes. The kid with ADHD is genuinely struggling to focus. The person with DID is genuinely experiencing distress and fragmentation. Hacking never denies the "brute reality" of the pain or behavior.
  *   **Is the *Kind* real?** It is real *now*, but it is not an eternal natural kind. It is a **stable equilibrium** in the looping process.

  **The Middle Position:**
  Hacking argues that these categories are **real but historical**.
  *   They are not "unreal" because they have real causal powers (people get meds, go to therapy, change their lives based on them).
  *   They are not "natural kinds" because they are not independent of human description.

  So, is Autism "real"? For Hacking, asking if it's "real" in the timeless sense is the wrong question. The right question is: "How did this way of being a person become available? How is the loop stabilizing or destabilizing?"

  If the loop stabilizes (e.g., the category of "Homosexual" moved from a sin to a crime to a sickness to an identity), the kind becomes very "real" in terms of social ontology. If the loop destabilizes (e.g., "Multiple Personality Disorder" fracturing into "DID" and changing the average number of alters), the kind is shifting.

  **Why this matters for your seminar:**
  If you say "MPD is fake," you ignore the suffering. If you say "MPD is a brain disease like cancer," you ignore the history and the looping. Hacking wants you to see that **the reality of the disorder is constituted by the loop itself.** The fact that the number of alters climbed from 2 to 12 to 50 over decades isn't just "doctors getting better at finding them" (Realism) or "doctors coaching patients" (Constructionism). It is evidence that the *ecological niche* of the multiple personality was expanding and changing shape.

  ### Summary for your Discussion Section
  1.  **The Deep Claim:** It is not just that labeling changes behavior (psychology); it is that classification changes the *possibility space of being human* (ontology). This is **Dynamic Nominalism**.
  2.  **The Co-Evolution Rebuttal:** Looping requires **semantic uptake**. Non-humans evolve via causal pressure; humans loop via *meaning*. A tiger doesn't know it's a tiger; a patient knows they are a "patient."
  3.  **The Realism Question:** Hacking rejects the Real vs. Fake binary. He argues for **Historical Ontology**. The kinds are real because they have causal power, but they are not natural kinds because they evolve alongside our descriptions of them. The "reality" is in the stability of the loop, not in a hidden biological essence.

  If you want to drop a specific Hacking phrase to impress the professor, use **"ecology of the self."** Hacking views these psychiatric categories as niches in an ecosystem. When the niche changes (via new theories, drugs, laws), the people inhabiting the niche change to fit it. That is the ontological loop.
