answer: |-
  It is a pleasure to address a colleague who understands the mathematics of inference from the inside out. Your intuition is correct: in the practice of astrophysics, the Mercury perihelion case was a paradigmatic instance of confirmation. The fact that standard Bayesian formalism seems to forbid this is not a quirk of language; it is a structural tension between the idealizations of formal epistemology and the cognitive reality of scientific discovery.

  Your friend in the reading group is pointing toward the most technically sophisticated resolution, but to appreciate why it is necessary, we must first establish why the problem is formally genuine and not merely a confusion about what counts as "evidence."

  ### 1. Why This Is a Formal Problem, Not a Verbal One

  In your professional work, you likely treated Bayesian updating as a tool for likelihood analysis. You maximized likelihoods or sampled posteriors where the normalization constant (the evidence) often canceled out or was treated as a fixed background. In formal epistemology, however, Bayesian Confirmation Theory (BCT) makes a stronger claim: it purports to be a *normative* account of how rational belief *must* change.

  The problem is formal because it arises directly from the axioms of probability theory combined with the standard rule of Conditionalization.

  Let $H$ be General Relativity (GR) and $E$ be the anomalous precession of Mercury ($43''$/century).
  In the standard Bayesian framework, $E$ confirms $H$ for an agent if and only if:
  $$P(H | E \cdot K) > P(H | K)$$
  where $K$ is the agent's background knowledge. By Bayes' Theorem:
  $$P(H | E \cdot K) = \frac{P(E | H \cdot K) P(H | K)}{P(E | K)}$$

  Here lies the formal choke point. If $E$ is "old evidence," it is part of $K$. In probability theory, if a proposition is known with certainty, its probability is 1. Thus, $P(E | K) = 1$.
  Furthermore, if $H$ entails $E$ (as GR entails the perihelion shift), then $P(E | H \cdot K) = 1$.
  Substituting these values:
  $$P(H | E \cdot K) = \frac{1 \cdot P(H | K)}{1} = P(H | K)$$

  The posterior equals the prior. The degree of confirmation is zero.

  This is not a verbal dispute about whether $E$ is "really" evidence. It is a mathematical derivation showing that under the standard axioms, known evidence cannot shift probability mass. If BCT claims to model scientific rationality, and scientific rationality clearly includes accepting GR because of Mercury, then BCT is descriptively inadequate. If BCT claims to prescribe how we *ought* to reason, it is prescribing that we ignore the strongest argument for GR. That is why it is an embarrassment: it renders the formalism incapable of modeling one of the greatest successes in the history of physics.

  ### 2. The Garber-Jeffrey-Niiniluoto (GJN) Strategy

  The solution your friend alluded to involves relaxing the assumption of **Logical Omniscience**.

  #### The Assumption of Logical Omniscience
  Standard Bayesianism assumes that rational agents assign probability 1 to all logical truths and recognize all logical consequences of their beliefs immediately. If $H \vdash E$, a logically omniscient agent knows this relation instantly. Therefore, for such an agent, the probability of the logical proposition "$H$ entails $E$" is already 1 before Einstein even writes down the field equations.

  But human scientists are not logically omniscient. In 1915, the scientific community knew $E$ (Mercury's orbit) with certainty ($P(E)=1$). They did *not* know the logical relation between $H$ (Einstein's field equations) and $E$. The cognitive event was not learning $E$ (which was old), but learning the *connection* ($H \vdash E$).

  #### The Mechanism: Updating on Logical Relations
  Garber (1983), building on ideas from Jeffrey and Niiniluoto, proposed expanding the algebra of propositions. We treat the logical relation itself as a proposition subject to probabilistic uncertainty.

  Let $L$ be the proposition: "$H$ entails $E$" (formally, $H \rightarrow E$ within the object language, or a meta-linguistic statement about the derivation).
  The agent's state before Einstein's derivation is:
  1.  $P(E) = 1$ (The data is known).
  2.  $P(L) < 1$ (It is not yet certain that GR explains the data).

  When Einstein completes the derivation, the agent learns $L$. The update is not conditionalization on $E$, but conditionalization on $L$.
  $$P_{new}(H) = P_{old}(H | L)$$

  Does this raise the probability of $H$? Yes, provided that $H$'s ability to entail $E$ is something competing hypotheses cannot do as well. If $H$ is the only hypothesis that entails the known $E$, then learning $L$ effectively screens off other hypotheses that fail to entail $E$.

  Mathematically, we can show that if $P(E)=1$, then $P(H | L) > P(H)$ is possible, provided $H$ is not probabilistically independent of $L$. Since $L$ asserts a specific structural relationship between $H$ and a known fact, $H$ becomes more probable because it has "captured" a piece of certain reality that was previously unexplained.

  #### Justification for Updating on Logic
  You asked what justifies treating a logical discovery as a legitimate object of Bayesian updating. This is the most controversial step. Standard probability theory dictates that logical truths have probability 1. If $L$ is a mathematical truth (which a derivation is), shouldn't $P(L)$ always be 1?

  The justification rests on a distinction between **logical truth** and **epistemic certainty**.
  1.  **Idealization vs. Reality:** Bayesianism is a theory of *rational belief*, not a theory of *truth*. If an agent has not performed the derivation, they are not epistemically certain of the logical relation, even if the relation is necessarily true in the abstract.
  2.  **Bounded Rationality:** To demand $P(L)=1$ for all unproven theorems is to demand that agents know all of mathematics instantly. This makes the theory useless for modeling learning.
  3.  **The "Old Evidence" is the Anchor:** By fixing $P(E)=1$, we acknowledge the data is secure. By allowing $P(L) < 1$, we acknowledge the theoretical work is the source of uncertainty. When the math is checked and verified, $P(L)$ goes to 1, and $P(H)$ updates.

  This approach effectively shifts the locus of confirmation from the *data* (which was static) to the *explanatory link* (which was dynamic).

  ### 3. Rival Proposal: Counterfactual Priors (The Historical Approach)

  The main rival to GJN is often associated with Colin Howson and Peter Urbach. This approach attempts to save standard conditionalization by reconstructing a counterfactual history.

  #### The Mechanism
  Instead of updating on the logical relation $L$, this approach asks: "What would the agent's credence in $H$ have been if they had *not* known $E$?"
  We construct a counterfactual prior function, $P_0$, where $P_0(E) < 1$. We then calculate the confirmation as:
  $$P_0(H | E) > P_0(H)$$
  If this inequality holds, we say $E$ confirms $H$, even though in actuality $P_{actual}(E) = 1$.

  #### Comparison with GJN
  *   **Ontological Commitment:** GJN changes the *object* of updating (from $E$ to $L$) but keeps the agent's actual history intact. The Counterfactual approach keeps the object of updating ($E$) but changes the *agent's history* (pretending they didn't know $E$).
  *   **Subjectivity:** The Counterfactual approach is heavily criticized for being under-constrained. How do we construct $P_0$? If I ask you to imagine you don't know Mercury's perihelion precession, how much do you "forget"? Do you forget the telescopic technology? The Newtonian anomalies? There is no unique way to strip knowledge from a belief system without arbitrariness.
  *   **Relevance:** GJN captures why the confirmation feels *new* to the scientist (I just learned the link). The Counterfactual approach captures why the evidence is *objectively supportive* (This data fits the theory).

  For a practicing scientist, GJN often feels more honest. You didn't "forget" the Mercury data when you read Einstein's paper; you gained a new understanding of how the theory mapped onto that data.

  ### 4. Current Consensus: Solved, Contained, or Embarrassment?

  Among working epistemologists and philosophers of science, the status of the Problem of Old Evidence is best described as **contained, but not dissolved.**

  1.  **Not an Embarrassment:** It is no longer seen as a refutation of Bayesianism. Almost all Bayesians acknowledge the problem and adopt a modification (usually GJN or a variant) to handle it. It is viewed similarly to how physicists view friction in idealized mechanics: a known complication that requires refining the model, not a reason to discard Newton's laws.
  2.  **Not Fully Solved:** There is no single, universally agreed-upon formalism.
      *   **Technical Hurdles for GJN:** Expanding the probability space to include logical sentences creates technical difficulties (e.g., ensuring the probability distribution remains consistent across the expanded algebra). Some argue it requires a "second-order" probability that complicates the elegance of the standard view.
      *   **The "Static" vs. "Dynamic" Distinction:** Some philosophers (like Maher) argue the problem conflates two questions: "Does E support H?" (static) vs. "Does learning H entails E increase belief in H?" (dynamic). They argue standard Bayesianism answers the static question fine (via likelihoods), and only fails the dynamic question.
  3.  **The Physicist's Perspective:** Interestingly, your professional experience highlights why this didn't bother you in the observatory. In data analysis, we rarely compute absolute posteriors $P(H|E)$. We compute likelihood ratios (Bayes Factors):
      $$\frac{P(E | H_1)}{P(E | H_2)}$$
      In this ratio, the term $P(E)$ cancels out. The "Problem of Old Evidence" is largely an artifact of insisting on modeling absolute credences ($P(H)$) rather than comparative model selection. In model selection, old evidence confirms $H_1$ over $H_2$ regardless of $P(E)$, provided $H_1$ predicts $E$ better than $H_2$. Many philosophers now concede that Bayesian *confirmation* should be understood comparatively (Bayes Factors) rather than absolutely (change in $P(H)$), which largely dissolves the problem.

  ### Summary for Your Reading Group

  If I were to synthesize this for your group: The Problem of Old Evidence reveals that standard Bayesian Conditionalization is an idealization that assumes logical omniscience. Since scientists learn logical connections (theories explaining data) over time, the formalism must be amended to allow updating on those connections (the GJN strategy) or we must shift our focus from absolute probability changes to comparative likelihood ratios.

  Your friend is right that dropping logical omniscience is the key, but the "cost" is admitting that Bayesian agents are logically fallible. Most epistemologists regard this as a acceptable cost to pay for a theory that can actually describe scientific history. The problem is no longer a crisis, but it remains a fruitful site for discussing the relationship between logical truth and epistemic uncertainty.

  Given your background, you might find the "Comparative" solution (Bayes Factors) the most satisfying. It aligns with the practice of model selection you used for four decades: it doesn't matter if $P(E)=1$; what matters is that $P(E|GR) \gg P(E|Newton)$. The philosophical literature sometimes gets tangled in absolute credences in a way that observational physics wisely avoids.
