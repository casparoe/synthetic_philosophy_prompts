          *   Is it an embarrassment? Not really. It's a known limitation of the *idealized* model.
          *   Most working Bayesians accept one of the modifications (usually GJN or a variant). It's "contained."
          *   Mention that in physics practice (like the user's), we often use likelihood ratios where the normalization constant cancels out, effectively bypassing the $P(E)=1$ issue in practice, which is why it didn't bother them professionally.

