      *   **Part 1: Why it's a Formal Problem.**
          *   Show the math. $P(E)=1 \implies P(H|E) = P(H)$.
          *   Explain that Bayesianism claims to be a *normative* theory of inference. If it fails on a paradigmatic case of scientific success (GR), it's a bug, not a feature.
          *   Distinguish from "verbal": It's not about what "evidence" means, it's about the update rule failing to generate confirmation.
      *   **Part 2: The GJN Strategy (Logical Omniscience).**
          *   Standard Bayesianism assumes Logical Omniscience (LO): If $H \vdash E$, then $P(H \vdash E) = 1$ always.
          *   GJN says: Drop LO. We learn the *relationship*, not the data.
          *   The Update: Conditionalize on $H \vdash E$ (let's call this proposition $R$).
          *   Justification: Uncertainty about logical relations is real cognitive uncertainty.
          *   Technical nuance: This requires a language rich enough to express logical relations as propositions within the algebra.
      *   **Part 3: Counterfactual Priors (The "Historical" Approach).**
          *   Associated with Howson, Urbach, maybe Earman.
