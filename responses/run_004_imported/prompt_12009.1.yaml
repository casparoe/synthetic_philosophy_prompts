      *   *Point 2: Preference for Premise-Based Voting.* Why? Because CJT relies on $p > 0.5$. Complex conclusions might lower individual competence ($p$). Simple premises keep $p$ high. Therefore, premise-voting maximizes the probability of a correct collective outcome.
