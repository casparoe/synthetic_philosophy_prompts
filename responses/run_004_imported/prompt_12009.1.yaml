      *   *The Nature of the Question:* Condorcet distinguished between questions of *fact* (suitable for CJT) and questions of *preference/interest* (where paradoxes arise). The Discursive Dilemma is about judgments of fact/logic, which is closer to his "truth-tracking" zone.
