          *   Discursive Dilemma (List & Pettit): Voting on premises vs. voting on conclusion yields different outcomes, even with consistent individual judgments.
      *   **Context:** Condorcet's probabilistic epistemology and his desire to justify collective decision-making (courts/assemblies).
      *   **Question:** How would Condorcet have responded to the Discursive Dilemma?
