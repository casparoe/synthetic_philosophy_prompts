answer: |-
  This is a classic theoretical underdetermination problem in X-Phi. You're stuck because, in the standard Chairman case, Moral Valence (Bad vs. Good) and Deep Self Concordance (Fits Attitude vs. Doesn't Fit) are perfectly confounded.

  *   **Harm Case:** Outcome is Bad + Inferred Attitude is "Okay with harm" (Concordant).
  *   **Help Case:** Outcome is Good + Inferred Attitude is "Indifferent to help" (Discordant).

  To separate them, you need a design where **Moral Valence** and **Deep Self Concordance** are orthogonally manipulated. Here is the concrete breakdown, a vignette design, and my take on defensibility.

  ### 1. The Causal Divergence

  The fundamental disagreement is about the **direction of information flow** in the cognitive architecture of folk psychology.

  *   **Knobe (Moral Constitution/Skill):** Moral judgment is an *input* to the intentionality classifier.
      *   *Causal Chain:* Outcome Valence $\rightarrow$ Moral Judgment $\rightarrow$ Intentionality Attribution.
      *   *Key Claim:* The agent's internal psychological state (attitudes/values) is secondary. If the outcome violates a norm (moral or otherwise), the cognitive system flags it as "intentional" to facilitate blame.
  *   **Sripada (Deep Self Concordance):** Attitude inference is the *input*; moral judgment is often a *heuristic* for inferring that attitude.
      *   *Causal Chain:* Outcome Valence $\rightarrow$ Inference about Agent's Values (Deep Self) $\rightarrow$ Concordance Check $\rightarrow$ Intentionality Attribution.
      *   *Key Claim:* We use moral valence as a cue to guess what the agent cares about. If we *know* what they care about independently, moral valence should drop out of the model.

  ### 2. The Vignette: "The Secret Environmentalist"

  To pull these apart, you need to give the participant direct access to the agent's Deep Self, bypassing the need to infer it from the action's moral valence.

  **Setup:**
  Participants read about a Chairman of a corporation. He is considering a new program.

  **Manipulation 1: Moral Valence of Outcome (Harm vs. Help)**
  *   *Harm:* The program will damage the environment.
  *   *Help:* The program will improve the environment.

  **Manipulation 2: Deep Self Concordance (Concordant vs. Discordant)**
  *   *Concordant (Standard):* The Chairman says, "I don't care about the environment, I just want profit."
  *   *Discordant (The Wedge):* The Chairman finds a **private diary entry** (leaked to the public) written *before* the decision.
      *   *In Harm/Discordant:* "I love the environment. It breaks my heart to approve this, but the board will fire me if I don't maximize profit this quarter. I have no choice."
      *   *In Help/Discordant:* "I hate the environment. I think nature is worthless. But the board insists on this 'green initiative' for PR. I'll sign it to keep my job, even though I think it's stupid."

  **The Critical Condition:** **Harm / Discordant.**
  The Chairman causes environmental damage (Bad Outcome) but explicitly holds a Deep Self value *against* that damage (Coerced/Reluctant).

  ### 3. Divergent Predictions

  | Theory | Prediction for Harm/Discordant Case | Reasoning |
  | :--- | :--- | :--- |
  | **Knobe (Moral Constitution)** | **High Intentionality** | The outcome is morally bad. The moral module triggers the "intentional" concept to license blame, regardless of the agent's internal reluctance. The concept of "intentional" is sensitive to the *normative status of the outcome*, not just the psychological state. |
  | **Sripada (Deep Self)** | **Low Intentionality** | The outcome clashes with the agent's explicitly stated stable values (Deep Self). Since the action does not express who the agent "really is," it fails the concordance test. The moral badness is overridden by the psychological mismatch. |

  *(Note: You would also run the Help/Discordant case as a control, where both predict low intentionality, and a Harm/Concordant case where both predict high.)*

  ### 4. Which is more defensible?

  If I have to place a bet for a CogSci/PhilPsych dissertation, **Sripada's account is more defensible**, but with a major caveat regarding operationalization.

  **Why Knobe's view is vulnerable:**
  Knobe's "Moral Constitution" view risks making the concept of intentionality *too* bloated to be useful for moral reasoning. If moral judgment is a prerequisite for determining intentionality, then moral responsibility becomes circular:
  1.  To blame someone, they must have acted intentionally.
  2.  To know if they acted intentionally, we must first judge if the act was bad.
  3.  To judge if the act was bad (enough to trigger intent), we often need to know if they are responsible.

  This creates a "feedback loop" problem. While Knobe has since broadened his view to "Normative Competence" (it's not just morality, but *any* norm), the core issue remains: it collapses the *is* (psychological fact) and the *ought* (normative evaluation) in a way that makes it hard to model folk psychology as a tool for *tracking* agency rather than *evaluating* it.

  **Why Sripada's view is stronger (mechanistically):**
  Sripada preserves a modular architecture that fits better with standard Theory of Mind (ToM) models. It suggests we have a ToM system that tracks attitudes and a separate Moral system that evaluates outcomes. The Knobe Effect arises because the Moral system *biases* the input to the ToM system (helping us infer hidden attitudes), not because the ToM system *is* a moral system.

  This is more defensible because:
  1.  **It explains the "Praise" asymmetry better:** If you tweak the Help case so the agent *does* deeply care about helping (Deep Self Concordant), Sripada predicts intentionality ratings go up. Knobe's original view struggles to explain why good outcomes ever get called intentional if the concept is morally constituted to track blame.
  2.  **It avoids circularity:** It allows us to say, "He did it intentionally, but it wasn't wrong," or "It was wrong, but he didn't do it intentionally."

  **The Caveat (The "Inference" Objection):**
  The strongest criticism of Sripada is that the "Deep Self" is unfalsifiable. If a participant says the reluctant Harmer *did* act intentionally, a Sripada defender can just say, "Well, they must have inferred his Deep Self actually accepted the harm."
  *   **Your Defense:** This is why the **Diary/Coercion** vignette above is crucial. You must stipulate the Deep Self *exogenously* to block the inference loop. If you control the Deep Self information and the effect persists, Sripada wins. If the effect disappears (people still call it intentional), Knobe wins.

  **Recommendation:**
  For a PhD, I would argue that **Sripada is the better psychological model**, but Knobe identified the correct *phenomenon* (normativity penetrates ToM). The most defensible position is likely a hybrid: **Normative expectations shape our inference of the Deep Self.** We assume agents act in accordance with norms; when they violate norms, we infer a "deviant" Deep Self (they must be cruel), which then drives the intentionality judgment.

  But if forced to choose the mechanism: Go with **Sripada**. It gives you more variables to manipulate (attitudes, values, coercion, identity) than Knobe's binary (Good vs. Bad). It's more fertile ground for a dissertation.
