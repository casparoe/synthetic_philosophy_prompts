prompt: |-
  I've covered science and ideas for a regional daily for the better part of a decade, and I sit on our newsroom's standards committee, which meets next Tuesday to resolve a dispute that has been simmering since a correction we ran in the spring. A reporter's lede had flatly stated that a brief classroom writing exercise "closes nearly a third of the achievement gap between low- and high-income students," based on a single small randomized trial; a larger, multi-site follow-up has since found no detectable effect, and readers who had shared the original piece on social media were unhappy that we had reported an early, contested result as settled fact rather than as a hedged, attributed claim. The committee has since split into three camps over what should license a flat, unhedged assertion in our copy generally, as opposed to phrasing like "a new study suggests" or "according to researchers." One camp wants reporters held to whether the claim is actually true, period, regardless of what we could have known at the time. A second wants the bar to be that the reporter and the paper genuinely knew the claim when we published it — a bar the writing-exercise story clearly didn't clear. A third thinks both bars would silence most science and policy reporting and wants to license flat assertion whenever it was reasonable to believe the claim on the evidence available at deadline, even if that later turns out to be wrong.

  Could you draft the memo I'll circulate before the meeting? Recommend one standard, or an explicit hybrid, as our house rule, and show your work rather than just declaring a preference: apply it back to the writing-exercise story, then stress-test it against two cases the committee keeps getting stuck on. First, a single-site finding with a p-value of 0.03 that hasn't yet been retested anywhere else — is "statistically significant" close enough to "known," given how often single, barely-significant studies fail to replicate? Second, an investigative piece built on three separate sources inside an agency who, it later emerged, were all relaying the same unconfirmed internal rumor rather than verifying it independently — were we blameless in asserting it as fact even though it turned out false, and does the rule you're proposing actually agree? Please give the two camps you don't side with their strongest possible case before you set them aside, and close with the actual sentence you would add to the style guide.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science/Ideas reporter and member of the newsroom's standards committee.
      *   **Task:** Draft a memo to circulate before the committee meeting next Tuesday.
      *   **Context:** A dispute over a correction regarding a science story (classroom writing exercise) where an early finding was reported as fact, later debunked by a larger study.
      *   **The Conflict:** Three camps on when to use flat assertions vs. hedged language ("study suggests"):
          1.  *Truth Camp:* Claim must be actually true (regardless of knowledge at the time).
          2.  *Knowledge Camp:* Reporter/paper must have genuinely *known* it at the time (subjective/epistemic state).
          3.  *Reasonableness Camp:* Reasonable to believe based on evidence at deadline (even if later wrong).
      *   **Requirements:**
          *   Recommend one standard or an explicit hybrid.
          *   Show work/reasoning (don't just declare).
          *   Apply the recommendation to the original writing-exercise story.
          *   Stress-test against two specific cases:
              1.  Single-site study, p=0.03, unreplicated (Is "statistically significant" = "known"?).
              2.  Investigative piece, three sources, all relaying same unconfirmed rumor (Were we blameless?).
          *   Give the two opposing camps their strongest possible case before setting them aside.
          *   Close with the actual sentence to add to the style guide.
      *   **Tone:** Professional, persuasive, nuanced, newsroom-appropriate (clear, direct, respectful of colleagues).

  2.  **Determine the Recommendation:**
      *   *Camp 1 (Truth):* Too harsh. Punishes reporters for the inherent uncertainty of science/news. Chilling effect. If we only print absolute truth, we print almost nothing.
      *   *Camp 2 (Knowledge):* Too vague/subjective. "Knowing" is philosophically tricky. Did we *know* the writing exercise worked? Clearly not, but the reporter thought they did. Hard to adjudicate.
      *   *Camp 3 (Reasonableness):* The industry standard for a reason. It balances accuracy with the duty to inform. However, it needs guardrails so "reasonable" doesn't become "lazy."
      *   *Decision:* I need to advocate for a refined version of Camp 3 (Reasonableness), likely hybridized with elements of Camp 2 (process verification). Let's call it the "Reasonable Reliance" standard. It focuses on the *process* of verification available at the time, not just the outcome.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension. Validate the importance of the debate. State the purpose of the memo.
      *   **The Three Camps (Steel-manning):**
          *   *Truth:* Best for credibility long-term, avoids corrections. *Counter:* Impossible standard, stops breaking news.
          *   *Knowledge:* Best for intent/integrity. *Counter:* Solipsistic. Hard to prove what someone "knew."
          *   *Reasonableness:* Best for functionality. *Counter:* Can excuse sloppiness if "reasonable" is defined too loosely.
      *   **The Recommendation:** Advocate for the "Reasonable Reliance" standard (Camp 3), but tightened. It's about whether a prudent journalist *could* have concluded this based on available evidence.
      *   **Application to Writing-Exercise Story:**
          *   Was it reasonable? No. Single small trial + big claims = needs hedging. The "consensus" bar wasn't met.
      *   **Stress Test 1 (The P-Value Study):**
          *   Single site, p=0.03.
          *   Application: Under "Reasonable Reliance," is this flat fact? No. Science context matters. Single unreplicated study = "suggests" or "found," not "does."
          *   Nuance: Distinguish between reporting the *finding* (Study found X) vs. reporting the *reality* (X is true).
      *   **Stress Test 2 (The Investigative Rumor):**
          *   Three sources, same rumor.
          *   Application: Under "Reasonable Reliance," is this flat fact? No. Corroboration requires independent verification. If the tree falls in the forest and three people hear the same rumor, it's not confirmed.
          *   Nuance: This shows "Reasonableness" isn't a numbers game; it's a quality of evidence game.
      *   **Style Guide Language:** Needs to be punchy and actionable.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Camp 2 really just "Knowledge"? The prompt says "genuinely knew." That's high. I need to make sure I don't dismiss Camp 2 too easily, as it touches on journalistic integrity.
      *   *Adjustment:* Acknowledge that Camp 2 is about *intent*, but Camp 3 is about *method*. We can't police intent, we can police method.
      *   *Critique:* Make sure the distinction between reporting a study's *claim* vs. asserting the *phenomenon* is clear in the P-value section.
      *   *Tone Check:* Ensure I'm not sounding like I'm lecturing the committee. Use "we," "our," "us."

  5.  **Drafting the Content (Iterative):**

      *   *Subject Line:* Needs to be clear. "Standards Committee: Proposal for Assertion Guidelines."
      *   *Intro:* Reference the spring correction. It's the catalyst.
      *   *The Camps:*
          *   Camp 1 (Truth): "The Infallibility Standard." Strongest case: Protects brand trust.
          *   Camp 2 (Knowledge): "The Epistemic Standard." Strongest case: Aligns with honesty/integrity.
          *   Camp 3 (Reasonableness): "The Process Standard." Strongest case: Allows journalism to function.
      *   *My Pick:* Camp 3, but defined rigorously.
      *   *Writing Exercise:* Why it failed Camp 3. Single small study $\neq$ settled science.
      *   *P-Value Case:* Distinguish "Study reports" vs "Is." P=0.03 is weak evidence for *fact*, strong evidence for *finding*.
      *   *Investigative Case:* Triangulation vs. Echo chamber. Three sources sharing one rumor is one source.
      *   *Style Guide:* "Assert as fact only when..."

  6.  **Final Polish:** Check against all constraints.
      *   Memo format? Yes.
      *   Recommend one/hybrid? Yes (Refined Reasonableness).
      *   Show work? Yes.
      *   Apply to writing-exercise? Yes.
      *   Stress-test P-value? Yes.
      *   Stress-test Investigative? Yes.
      *   Strongest case for opposing camps? Yes.
      *   Style guide sentence? Yes.

  7.  **Final Review of the "Style Guide Sentence":** It needs to be precise. "Reporters may assert claims as fact only when..." Let's make sure it covers the "available evidence" aspect.

      *   *Draft:* "Reporters may assert claims as fact only when the weight of available, independently verified evidence would lead a prudent expert to the same conclusion, regardless of later outcomes."
      *   *Refinement:* Make it simpler. "Assert as fact only when supported by evidence that is independently verified and robust enough to withstand reasonable skepticism at the time of publication."
      *   *Better:* "Flat assertions of fact require evidence that is independently corroborated and robust enough to justify certainty at the time of publication, distinguishing between a study's findings and settled reality."

      *   *Let's go with a version that emphasizes the 'process' over the 'outcome'.*

      *(Self-Correction)*: Wait, I need to make sure I explicitly give the opposing camps their due before setting them aside. I will structure the "Analysis of Positions" section to do this heavily.

      *(Final Plan)*:
      1. Header.
      2. Context/Intro.
      3. The Three Positions (Steel-manning 1 & 2).
      4. The Recommendation (Refined Reasonableness).
      5. Application to Spring Correction.
      6. Stress Test 1 (P-Value).
      7. Stress Test 2 (Investigative).
      8. Proposed Style Guide Text.

      Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Newsroom Standards Committee
  **FROM:** [Your Name], Science & Ideas Desk
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Standards Regarding Flat Assertions vs. Attributed Claims

  **Context**

  As we prepare for Tuesday's meeting, I want to frame the debate surrounding the spring correction on the classroom writing exercise. That incident exposed a fissure in how we define accuracy. We have three competing standards for when a reporter may assert a claim as flat fact (e.g., "X closes the gap") versus when we must hedge or attribute (e.g., "A study suggests X closes the gap").

  This memo outlines the three current positions, argues for a refined "Reasonable Reliance" standard, and stress-tests that standard against the writing-exercise case and two recurring hypotheticals that have stalled our progress.

  **The Three Positions**

  To move forward, we must acknowledge the strength of the arguments we are weighing against each other.

  **1. The Infallibility Standard (Truth)**
  *The Rule:* A flat assertion is only permissible if the claim is actually true, regardless of what we knew at the time.
  *The Strongest Case:* This is the only standard that fully protects the brand's long-term credibility. In an era of "fake news" accusations, corrections damage trust irreparably. If we print it as fact, we are making a promise to the reader that reality matches our copy. If reality doesn't match, we broke the promise, even if we were diligent. This standard forces extreme caution and prioritizes being right over being first.

  **2. The Epistemic Standard (Knowledge)**
  *The Rule:* A flat assertion is permissible only if the reporter and editors genuinely *knew* the claim to be true at the time of publication.
  *The Strongest Case:* This aligns best with journalistic integrity and intent. It protects reporters who act in good faith from being punished for the inherent uncertainty of the world. It focuses on the internal state of the newsroom: Did we lie? Did we guess? Or did we know? It acknowledges that journalism is a human process, not a divine revelation, and judges us on our honesty rather than our omniscience.

  **3. The Process Standard (Reasonable Reliance)**
  *The Rule:* A flat assertion is permissible if it was reasonable to believe the claim based on the evidence available at deadline, even if later proven wrong.
  *The Strongest Case:* This is the only standard that allows journalism to function. If we wait for absolute truth (Camp 1), we publish obituaries only after the body is identified, not when the crash happens. If we rely on "genuine knowledge" (Camp 2), we invite solipsism; a reporter can "feel" they know something based on weak evidence. Camp 3 focuses on the *method*: Did we do the work a prudent journalist would do?

  **Recommendation: A Refined "Reasonable Reliance" Standard**

  I recommend we adopt **Camp 3 (Reasonable Reliance)**, but with a crucial hybridization of Camp 2's focus on verification. We cannot judge ourselves solely on outcomes (Camp 1), nor can we rely on subjective feelings of certainty (Camp 2). We must judge the *sufficiency of the evidence relative to the claim.*

  A flat assertion requires evidence that is independently corroborated and robust enough to justify certainty *at the time of publication*. Crucially, this standard distinguishes between reporting a *finding* ("The study found X") and reporting a *reality* ("X is true").

  **Application: The Writing-Exercise Story**

  Under this standard, the spring correction was necessary and the original lede was a violation.
  *   **The Claim:** The exercise "closes nearly a third of the achievement gap." This is a statement of reality, not just a study finding.
  *   **The Evidence:** A single, small randomized trial.
  *   **The Verdict:** In social science, a single small trial is never robust enough to justify a flat assertion of reality, regardless of the p-value. A prudent expert would know that replication is required before declaring a gap "closed." The reporter asserted a settled reality based on preliminary evidence. Under "Reasonable Reliance," the evidence available did not support the certainty of the claim.

  **Stress Test 1: The Single-Site P-Value**

  *Scenario:* A single-site study finds a result with p=0.03. It has not been retested. Can we write "X causes Y"?
  *   **Camp 1 says:** No, because it might not replicate.
  *   **Camp 2 says:** Yes, if the reporter read the paper and believes the math.
  *   **Our Standard says:** **No.**
  *   **Reasoning:** "Reasonable Reliance" requires us to understand the limits of the evidence we are citing. In the scientific community, a single unreplicated study is considered a *signal*, not a *fact*. To assert "X causes Y" is to claim the mechanism is settled. To assert "Researchers found X causes Y" is to claim the paper exists. Our standard requires us to match the certainty of the copy to the certainty of the field. A p-value of 0.03 in a single study is statistically significant, but epistemologically weak. We can report the finding flatly ("The study found..."), but we cannot assert the phenomenon as fact ("X does...") without hedging or attribution.

  **Stress Test 2: The Investigative Rumor**

  *Scenario:* Three sources inside an agency tell a reporter the Director will resign. All three are relaying the same internal rumor. The Director does not resign. Were we blameless?
  *   **Camp 1 says:** No, we were wrong.
  *   **Camp 2 says:** Yes, we genuinely believed it based on three sources.
  *   **Our Standard says:** **No, we were not blameless.**
  *   **Reasoning:** This is where we hybridize with Camp 2's rigor. "Reasonable Reliance" is not a numbers game; it is a verification game. Three sources repeating the same unverified rumor constitute *one* source of information. A prudent journalist knows that corroboration requires independent verification of the *underlying fact*, not just the *report of the fact*. Asserting "The Director will resign" as flat fact requires confirmation from someone with decision-making authority or documentary evidence. Relying on an echo chamber of rumors fails the "Reasonable Reliance" test because the evidence available (hearsay) was not robust enough to justify certainty, regardless of how many people repeated it.

  **Conclusion**

  Camp 1 sets a bar we cannot clear without ceasing to report news. Camp 2 sets a bar we can clear too easily by convincing ourselves we "know" things we haven't sufficiently verified. Camp 3, properly defined, holds us to the standard of a prudent expert. It allows us to be wrong without being negligent, but it forbids us from treating preliminary data or unconfirmed rumors as settled truth.

  **Proposed Style Guide Addition**

  I propose we add the following sentence to the "Accuracy and Sourcing" section of our style guide:

  > "Reporters may assert claims as flat fact only when the available evidence is independently corroborated and robust enough to justify certainty at the time of publication; preliminary findings, single-study results, or unconfirmed reports must be attributed or hedged to distinguish between a claim and an established reality."
