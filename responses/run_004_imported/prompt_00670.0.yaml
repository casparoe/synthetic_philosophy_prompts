      *   **Core Concept 2: The Exclusion Postulate:** This is vital. Consciousness is at the *maximum* $\Phi$ scale. A society contains brains. If the brains have high $\Phi$ individually, and the society as a whole doesn't integrate them into a *single* higher $\Phi$ system, the consciousness resides in the brains, not the society. The society is just a collection of conscious entities, not one super-entity.
