      *   **Task:** Explain where the argument goes wrong (if it does), clarify what $\Phi$ actually tracks regarding size/connectivity, and explain relevant IIT concepts (MIP, Exclusion).

  2.  **Deconstruct the Group Member's Argument:**
      *   *Premise 1:* IIT identifies consciousness with $\Phi$.
      *   *Premise 2:* $\Phi$ measures interaction/constraint above independence.
