answer: |-
  This is a classic tension in normative game theory, and your friend's dismissal is indeed unsatisfying. The claim that IIA is "load-bearing" while monotonicity failures are "quirks" assumes that bargaining is primarily a problem of *consistent choice* rather than *fair division of claims*.

  If your goal is to formalize **fairness** (a normative concept) rather than predict the outcome of a specific alternating-offer protocol (a positive concept), Kalai-Smorodinsky (KS) has a significantly stronger moral claim than Nash (NBS).

  Here is the case for why Individual Monotonicity is a necessary condition for fairness, why IIA is the axiom that should break, and how to rebut the standard Nash defenses.

  ### 1. The Core Normative Claim: Fairness as Equal Relative Concession

  The deepest argument for KS is that it operationalizes fairness as **equal relative concession**, whereas NBS operationalizes fairness as **maximized joint leverage**.

  *   **Nash:** Maximizes the *product* of utility gains. This implicitly weights parties by their marginal utility at the solution. It favors the party for whom it is "cheaper" (in terms of utility loss) to concede.
  *   **Kalai-Smorodinsky:** Equalizes the *ratio* of actual gain to maximum possible gain. If my ideal point is 100 and yours is 100, we meet at 50/50. If my ideal point rises to 200 (and yours stays 100), KS dictates I should capture a larger share of the *feasible* surplus because my "claim" on the total possible value has increased.

  **Why Monotonicity Matters Here:**
  Individual Monotonicity ensures that if my *claim* strengthens (my ideal point rises), my *settlement* does not weaken. In a normative framework, your ideal point represents your maximum potential contribution or value to the cooperation. If the feasible set expands in your direction, your bargaining power has objectively increased.

  For NBS to violate monotonicity, it must be that the *curvature* of the frontier changed in a way that makes you "more expensive" to satisfy at the margin, even though your maximum potential increased. Normatively, this is perverse. It implies that having a higher ceiling can punish you if the "slope" of the negotiation changes. In a fairness context, **potential is a claim.** If I can potentially generate more value for us, or if my maximum possible satisfaction is higher, a fair solution should not penalize me for that expanded capacity. KS respects the *range* of possibilities; NBS respects the *local geometry*. Fairness is usually about the range (what is possible), not the local marginal rate of substitution.

  ### 2. The Attack on IIA: The "Irrelevant" Alternatives Are Not Irrelevant

  IIA states that if you remove outcomes from the feasible set that were not the solution, the solution shouldn't change. This is a standard rationality axiom for individual choice (revealed preference), but it is morally fragile in **bargaining**.

  In bargaining, the shape of the Pareto frontier is not just a menu of options; it represents the **technology of cooperation**. It encodes how hard it is to transfer utility from me to you.

  *   **The Curvature Argument:** The "irrelevant" alternatives that NBS discards are exactly what define the curvature of the frontier. That curvature represents the *cost of concession*.
  *   **The Normative Failure:** By adhering to IIA, NBS says, "We only care about the marginal trade-off rate at the exact point of agreement." KS says, "We care about the trade-off rate across the entire range of possible cooperation."

  Consider a scenario where the frontier is concave. The "irrelevant" points far from the solution indicate that as we move toward you, it becomes increasingly costly for me to give you more utility. NBS ignores this global structure once the point is picked. KS integrates this structure by anchoring to the ideal points.

  If you accept that fairness involves splitting the *surplus generated by cooperation*, you must acknowledge that the *total possible surplus* (defined by the ideal points) is morally relevant. IIA forces you to ignore the total possible surplus if the "unchosen" options are removed. But in a negotiation, knowing that I *could* have gotten 100 but settled for 50 is different than knowing I *could* have gotten 60 and settled for 50, even if the settlement is 50 in both cases. The **concession** is different. KS captures the concession; NBS captures the efficiency.

  ### 3. Bargaining Power and Leverage

  The strongest practical argument for Monotonicity is that it aligns with our intuitive understanding of **leverage**.

  In the monotonicity violation case (where your ideal point rises but your NBS payoff falls), the expansion of the set effectively changes the "threat" structure. Under NBS, if the frontier becomes "steeper" in your favor near your ideal point but "flatter" near the disagreement point, the product maximization might slide away from you.

  This implies that under NBS, **you can be punished for having a higher potential payoff if that potential comes with a specific utility curvature.**

  From a fairness perspective, this is unacceptable. If the set of feasible utilities expands in my favor (my ideal point goes up), my BATNA (Best Alternative to a Negotiated Agreement) hasn't necessarily changed, but my **stakes** have. I have more to lose from disagreement in absolute terms, but I also have more to offer. KS interprets the rise in the ideal point as an increase in my "stake" in the cooperation. If I have a larger stake, I should command a larger share of the agreement, or at minimum, not a smaller one. NBS allows a scenario where improving my position makes me a weaker negotiator purely due to mathematical artifacts of the utility product. That is not fairness; that is mathematical path dependency.

  ### 4. Addressing the Nash Defender (The Pushback)

  A die-hard Nash defender (like your friend) will likely rely on three arguments. Here is how you dismantle them in the context of *fairness*.

  #### Pushback A: "NBS is the limit of the Rubinstein Alternating Offers model."
  **The Argument:** If two rational agents alternate offers with time discounting, the subgame perfect equilibrium converges to the Nash Bargaining Solution. Therefore, NBS is the "real" solution.
  **The Rebuttal:** This conflates **prediction** with **normativity**. The Rubinstein model describes what happens when agents are impatient and strategic. It describes *power dynamics derived from time preference*, not *fairness*.
  If the goal is to formalize "fair," appealing to a model where the outcome is determined by who is more patient (discount factor) is begging the question. KS is not trying to predict what happens when people haggle; it is trying to prescribe what a neutral arbiter should impose to ensure fair relative concessions. If you want to know what *will* happen, use Rubinstein/Nash. If you want to know what *should* happen, KS is superior because it isolates the division of surplus from the strategic friction of time.

  #### Pushback B: "KS is manipulable; agents can add dummy options to change the ideal point."
  **The Argument:** Since KS depends on the ideal point, I can introduce a feasible but unlikely option that gives me huge utility to shift my ideal point, pulling the KS solution toward me. NBS is immune to this because of IIA.
  **The Rebuttal:** This is a valid technical critique, but it applies to *mechanism design*, not *axiomatic fairness*.
  First, NBS is manipulable via **risk aversion**. In the Nash framework, appearing more risk-averse (changing the curvature of your utility function) shifts the solution in your favor. This is the "risk aversion paradox." So both are manipulable; NBS invites manipulation of curvature, KS invites manipulation of the frontier bounds.
  Second, in a normative "fairness" context, we assume the feasible set is **given** by the physical/structural reality of the cooperation, not chosen by the agents. If we are asking "what is fair," we assume the set of possible outcomes is objective. If the set objectively expands in my favor, KS says I get more. If you argue that's manipulable, you are arguing about *verifying the feasible set*, not about the *principle of division*.

  #### Pushback C: "IIA is required for consistency and rationality."
  **The Argument:** If a solution is chosen from a set, it must be chosen from any subset containing it. Otherwise, the agent is irrational.
  **The Rebuttal:** This imports individual choice theory into a **multi-agent cooperative** context. In individual choice, IIA prevents preference cycles. In bargaining, the "choice" is a joint agreement.
  The "irrelevant" alternatives in bargaining define the **compromise space**. If I remove options that were "too good for me but bad for you," I change the nature of the compromise.
  More importantly, IIA assumes the *reason* for the restriction doesn't matter. But in bargaining, the *shape* of the frontier is the only information we have about the trade-offs. To say the shape outside the immediate neighborhood of the solution is "irrelevant" is to say that the *difficulty of reaching the ideal* is irrelevant. But fairness often cares about difficulty. If it is incredibly hard for me to give you that last 1% of utility, a fair solution should acknowledge that cost. NBS acknowledges it locally; KS acknowledges it globally. Global acknowledgment is more robust for fairness.

  ### The Verdict

  Your friend is viewing this through the lens of **positive economics** (what solution is stable/consistent/predictive), where IIA is indeed load-bearing.

  You are viewing this through the lens of **normative ethics** (what solution is fair/just), where Monotonicity is load-bearing.

  If "fairness" means "dividing the surplus such that we make equal relative sacrifices from our maximum potential," then KS is the only candidate. NBS maximizes the *size* of the utility product, which is a measure of efficiency, not equity.

  The monotonicity failure of Nash isn't a quirk; it's a feature of prioritizing local marginal trade-offs over global claims. But in a negotiation, **claims matter.** If my potential value to the partnership increases, fairness dictates my share should not decrease. To accept Nash is to accept that mathematical smoothness is more important than the intuitive link between potential value and realized reward.

  **The Knockout Punch:**
  Ask your friend this: *"If we are designing a constitutional rule for a neutral arbiter to settle disputes, do we want the rule to say 'If one party's maximum possible gain increases, they might get less' (Nash), or 'If one party's maximum possible gain increases, they get at least as much as before' (KS)?"*

  Unless they argue that punishing success is a feature of fairness, KS wins.
