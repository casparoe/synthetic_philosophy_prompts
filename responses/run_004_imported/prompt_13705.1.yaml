      *   *Okay, I will explain that they are siblings.* The grading case is often cited as a real-world instantiation of the Preface Paradox, which relies on the same probabilistic logic as the Lottery Paradox.

  7.  **Final Polish:**
      *   Make sure to explicitly answer: "Is my co-TA right?" (No).
