      *   *Adjustment:* I should highlight the **Preface Paradox** as the primary match, with the Lottery Paradox as the structural cousin regarding probability aggregation. The user asked if it's the "raffle ticket" deal. I should say "Yes, structurally, but philosophers usually call your specific version the Preface Paradox."
