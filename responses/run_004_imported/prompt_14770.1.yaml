answer: |-
  The Marquis de Condorcet would likely regard Robin Hanson's futarchy not as a mere policy proposal, but as a provocative experiment in *mathématique sociale*—the application of probability calculus to moral and political sciences. However, his assessment would be far more granular than a simple endorsement of "progress." Condorcet's 1785 *Essai sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix* (Essay on the Application of Analysis to the Probability of Majority Decisions) provides a rigorous framework for evaluating whether futarchy satisfies the conditions for rational collective choice.

  If Condorcet examined a functioning futarchy, he would likely argue that while the "beliefs" half improves upon the Jury Theorem's handling of *sincerity* and *competence*, it violates the critical condition of *independence*. Simultaneously, he would contend that the "values" half does not escape the Condorcet Paradox but rather obscures it within the constitutional selection of the welfare metric, potentially creating a new vulnerability to oligarchic manipulation.

  ### The "Beliefs" Half: Markets as Dynamic Juries

  Condorcet's Jury Theorem rests on three axioms: voters must be competent (probability of correctness $p > 0.5$), sincere (voting their true judgment), and independent (not influenced by others).

  **1. Independence vs. Information Cascades**
  Condorcet was acutely aware that independence was the most fragile of these conditions. In his analysis of assemblies, he worried that eloquence and factionalism would correlate errors, causing the probability of a correct majority decision to plummet even as the group size increased.

  In a prediction market, independence is explicitly abandoned. Traders observe prices, which aggregate the information of others, and adjust their positions accordingly. To a strict reading of the 1785 *Essai*, this violates the theorem's conditions. Condorcet would worry that this creates a risk of *information cascades*, where the market price reflects the momentum of early traders rather than the sum of independent evidence. He would ask: Does the price reflect the truth, or merely the consensus of the most liquid capital?

  However, Condorcet was also a pioneer of Bayesian thinking before Bayes was fully formalized. He understood that rational agents should update their probabilities based on new evidence. He might concede that if the market price is treated as *evidence* rather than *peer pressure*, the interdependence is epistemically virtuous. The market becomes a mechanism for calculating conditional probabilities in real-time, something a static jury vote cannot do. He would likely view the market not as a "jury" in the legal sense, but as a computational engine for *probabilité des faits* (probability of facts).

  **2. Competence and Self-Selection**
  The Jury Theorem assumes a random sample of voters with average competence $p > 0.5$. Condorcet knew that in reality, many voters are ignorant ($p < 0.5$), which drives the collective probability toward zero.

  Here, Condorcet would likely see futarchy's market mechanism as a significant advance. Prediction markets rely on self-selection: those who know they are ignorant ($p < 0.5$) are financially penalized for trading, while those with superior information are rewarded. This creates a dynamic weighting of votes based on revealed competence. Condorcet, who argued for weighted voting systems based on education in some contexts, would recognize this as a market-based solution to the "competence problem." The market filters for the *éclairés* (the enlightened) without requiring a formal census of intelligence.

  **3. Sincerity and Incentives**
  Perhaps the strongest alignment is on sincerity. Condorcet feared that voters would vote based on passion, prejudice, or private interest rather than the general good. The Jury Theorem collapses if voters are strategic rather than truthful.

  Futarchy solves this via incentive compatibility. A trader maximizes profit by revealing their true belief about the outcome. Condorcet would likely view this as a triumph of institutional design: it aligns *amour-propre* (self-love) with the discovery of truth. In his *Sketch for a Historical Picture of the Progress of the Human Mind*, he argued that institutions should be designed so that individual interest coincides with the common interest. A prediction market achieves this for empirical beliefs in a way a ballot box never can.

  **Verdict on Beliefs:** Condorcet would likely conclude that prediction markets are a superior technology for aggregating *empirical probabilities* than voting, provided the market is liquid enough to prevent manipulation. He would classify this not as a violation of the Jury Theorem, but as a transition from a *judicial* model of truth (independent witnesses) to a *scientific* model of truth (iterative, evidence-updating convergence).

  ### The "Values" Half: Relocating the Paradox

  Futarchy proposes that citizens vote on the welfare metric (e.g., GDP, life expectancy, happiness). Hanson argues this separates the normative (values) from the positive (beliefs), supposedly sidestepping the instability of majority rule. Condorcet would identify this as a category error that merely relocates the paradox.

  **1. The Paradox of Metric Selection**
  The Condorcet Paradox arises when preferences are intransitive ($A > B$, $B > C$, $C > A$). If the electorate must choose between competing welfare metrics, they are engaging in preference aggregation. If there are three viable metrics—say, Economic Growth, Environmental Sustainability, and Social Equality—it is mathematically probable that majority voting will cycle indefinitely.

  Condorcet would argue that futarchy does not escape the paradox; it pushes it "upstream" to the constitutional level. By forcing a single metric (or a fixed basket), the system must impose a method to resolve cycles (e.g., a dictator, a random selection, or a supermajority). If the choice of metric is subject to majority vote, the system inherits the instability Condorcet identified in 1785.

  **2. Values as Truth vs. Values as Preference**
  Here lies the deeper philosophical divergence. Modern futurists often treat values as subjective preferences. Condorcet, an Enlightenment rationalist, did not. He believed that moral and political truths were discoverable through reason, akin to mathematical truths. In his view, there *is* a correct answer to what constitutes human welfare, grounded in natural rights and sentiment.

  Condorcet would critique the futarchy premise that we should simply "vote on values." He would argue that the choice of metric is not a matter of taste, but of *reason*. If citizens vote for a metric that violates natural rights (e.g., "maximize the wealth of the top 1%"), the outcome is not just unstable; it is *irrational*.

  In his *Sketch*, Condorcet emphasizes that progress depends on the moral improvement of the species. He would worry that futarchy treats the "values" input as static. If the metric is fixed by a vote today, it locks in the moral prejudices of the current majority. Condorcet would prefer a system where the definition of welfare is subject to deliberative refinement as public reason advances. Futarchy risks calcifying a potentially erroneous metric, allowing the market to efficiently maximize the wrong thing.

  **3. The Risk of Technocratic Oligarchy**
  Condorcet was a democrat, but he feared the tyranny of the ignorant. However, he also feared the tyranny of the elite. He would notice that in futarchy, the "values" are set by voters (who may be incompetent), but the "beliefs" are set by traders (who may be wealthy).

  If the choice of metric is complex, the voters will rely on elites to explain the implications of choosing Metric A over Metric B. Condorcet would argue this recreates the very dependence the Jury Theorem warns against. The "values" vote becomes susceptible to manipulation by those who control the prediction markets. If I know that Metric A benefits my portfolio, I will campaign for Metric A, not because it is just, but because I can rig the "belief" half. Condorcet would see this as a failure to separate power from interest.

  ### Conclusion: A Tool, Not a Telos

  Condorcet would ultimately judge futarchy through the lens of his *probabilité des décisions*. His goal was never simply to aggregate preferences, but to minimize the probability of error in collective decision-making.

  He would likely conclude that:
  1.  **On Beliefs:** Prediction markets are a profound innovation in social mathematics. They solve the sincerity and competence problems better than voting, effectively creating a continuous, weighted Jury Theorem. He would endorse their use as advisory bodies to government, similar to the scientific academies he championed.
  2.  **On Values:** Futarchy fails to solve the paradox of aggregation. It merely hides the cyclical nature of preference voting behind the technical choice of a metric. Furthermore, by treating values as subjective votes rather than objects of rational deliberation, it abandons the Enlightenment project of moral progress.

  Condorcet's final verdict would be cautionary. He would argue that futarchy is a powerful engine for *means*, but it cannot determine *ends*. To trust it with ends is to risk efficient tyranny. As he wrote in the *Sketch*, "The progress of reason... is the only basis for a durable happiness." A system that bets on beliefs but votes on values without ensuring the *progress of reason* in those values is, to Condorcet, a machine waiting to be captured by passion. He would advocate for futarchy only within a broader framework of public education and deliberative democracy, ensuring that the metrics themselves evolve as human understanding of welfare deepens.
