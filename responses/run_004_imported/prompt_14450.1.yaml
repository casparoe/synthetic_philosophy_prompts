      *   *Standard Bayesian Conditionalization:* Requires learning a proposition $E$ with certainty ($P_{new}(E) = 1$). Here, we learn a constraint on conditional probability, not a fact. $P_{new}(H|P) = 0.75 \neq 1$. So, standard Bayes fails.
      *   *Jeffrey Conditionalization:* Requires a partition of propositions whose probabilities shift directly (e.g., $P_{new}(H)$ is set). Here, we aren't given $P_{new}(H)$ or $P_{new}(P)$. We are given a relation *between* them. So, standard Jeffrey fails.
