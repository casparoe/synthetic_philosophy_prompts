answer: |-
  This is a classic debate in formal epistemology. You're right to be suspicious of the sequential case. The Ellsberg paradox is great for showing that *preferences* violate Savage's axioms, but it doesn't necessarily prove that *beliefs* should be imprecise. The real stress test for imprecise credences is dynamic consistency: can you hold these beliefs over time without getting money-pumped or paralyzed?

  Here is a scenario cooked up specifically to target the sequential weakness of imprecise credences, followed by the verdict on whether it sinks the view.

  ### The Scenario: "The Shifty Bookie"

  Imagine you have a credence in a proposition $H$ (e.g., "The coin will land Heads") that is genuinely imprecise. Your credal set is the interval **$[0.2, 0.8]$**. You don't have a hidden sharp number; your belief state *just is* that range.

  To make decisions, let's assume you follow a standard rule for imprecise agents called **E-admissibility** (associated with Isaac Levi). The rule says: *An action is permissible if it maximizes expected utility relative to at least one probability function in your credal set.*

  Now, enter a Bookie who knows your credal state and your decision rule.

  **Stage 1 (Monday):**
  The Bookie offers you **Bet A**.
  *   **Cost:** \$0.75
  *   **Payout:** \$1.00 if $H$ is true (nothing if false).
  *   **Your Calculation:**
      *   Relative to $P(H) = 0.2$, the Expected Value (EV) is $-0.55$. (Bad bet).
      *   Relative to $P(H) = 0.8$, the EV is $+0.05$. (Good bet).
      *   **Decision:** Since *some* probability in your set makes this bet favorable, E-admissibility says taking the bet is **permissible**. You take it.

  **Stage 2 (Tuesday):**
  The Bookie returns. He knows you took Bet A. He now offers you **Bet B**.
  *   **Cost:** \$0.75
  *   **Payout:** \$1.00 if $\neg H$ is true (nothing if false).
  *   **Your Calculation:**
      *   Relative to $P(\neg H) = 0.2$ (i.e., $P(H)=0.8$), the EV is $-0.55$. (Bad bet).
      *   Relative to $P(\neg H) = 0.8$ (i.e., $P(H)=0.2$), the EV is $+0.05$. (Good bet).
      *   **Decision:** Since *some* probability in your set makes this bet favorable, E-admissibility says taking this bet is also **permissible**. You take it.

  **The Result:**
  You have paid \$1.50 total (\$0.75 + \$0.75).
  Regardless of whether $H$ is true or false, exactly one bet pays out \$1.00.
  **Net Outcome:** You lose \$0.50 guaranteed.

  **The Sharp Bayesian Contrast:**
  A sharp Bayesian has a single number, say $P(H) = 0.5$.
  *   Bet A EV: $0.5 - 0.75 = -0.25$. (Reject).
  *   Bet B EV: $0.5 - 0.75 = -0.25$. (Reject).
  *   *Or*, if their sharp credence was $P(H) = 0.9$:
      *   Bet A EV: $+0.15$. (Accept).
      *   Bet B EV: $0.1 - 0.75 = -0.65$. (Reject).
  *   **Result:** A sharp Bayesian never accepts *both* bets. They are immune to this specific money pump.

  ### Why did this happen?
  The imprecise agent got pumped because they effectively "changed their mind" about which probability function to listen to without any new evidence. On Monday, they acted like a 0.8-er. On Tuesday, they acted like a 0.2-er. Because they didn't commit to a single sharp prior, they allowed themselves to be exploited by a sequence of bets that are individually admissible but jointly disastrous.

  This is essentially Adam Elga's argument (from his 2010 paper *Subjective Probabilities Should Be Sharp*). He argues that if you want to avoid sure losses in sequential decisions, your credences must be sharp.

  ### The Verdict: Is this a fatal strike?

  **The Hard Truth:**
  If you hold onto **E-admissibility** as your decision rule, then yes, this is a major strike. It suggests that imprecise credences + standard decision theory = irrational vulnerability. If rationality requires avoiding guaranteed losses, the imprecise view fails here.

  **However, the Imprecise Proponent has three decent replies:**

  #### 1. Change the Decision Rule (The "Paralysis" Defense)
  The problem isn't the *beliefs*; it's the *decision rule*. E-admissibility is too permissive.
  Many imprecise Bayesians (like Teddy Seidenfeld) advocate for stricter rules, such as **Interval Dominance** or **Maximin**.
  *   **Maximin:** Only take a bet if the *minimum* expected value across your credal set is positive.
  *   **Application:**
      *   Bet A Min EV: $-0.55$. (Reject).
      *   Bet B Min EV: $-0.55$. (Reject).
  *   **Outcome:** You avoid the sure loss!
  *   **The Cost:** You now suffer from **decision paralysis**. If the Bookie offers a bet for \$0.40 that pays \$1.00 (a great deal!), your Min EV is $0.2(1) - 0.40 = -0.20$. You reject it. You avoid losses, but you also leave free money on the table. The imprecise agent trades *vulnerability* for *missed opportunity*.

  #### 2. Resolute Choice (The "Planning" Defense)
  An imprecise agent can adopt a policy of **resolute choice**. At Stage 1 (Monday), you anticipate Stage 2. You realize that if you take Bet A, the Bookie will offer Bet B, and you will be tempted to take it, leading to a loss.
  Therefore, at Stage 1, you commit to a plan: "I will not take Bet A."
  Even though Bet A looks permissible on Monday in isolation, you reject it because you know your future self is vulnerable. This requires a more sophisticated decision theory that values dynamic consistency, but it saves the imprecise credence from being money-pumped.

  #### 3. The "Ignorance is Expensive" Defense
  Finally, the imprecise proponent can bite the bullet. They argue that representing genuine ignorance *should* be costly.
  *   The Sharp Bayesian *pretends* to know more than they do (by picking 0.5 when they have no idea). That sharpness allows them to navigate the bets smoothly.
  *   The Imprecise Agent is honestly representing that they are clueless. The fact that they get paralyzed or lose money in tricky sequential scenarios is just the **tax on ignorance**.
  *   If the world punishes you for being honest about how little you know, that's a feature of the world, not a bug of the epistemology.

  ### Summary for your argument
  You can tell your friend:
  > "The Ellsberg urn shows that people *act* like they have imprecise credences. But the 'Shifty Bookie' scenario shows that if you actually *have* imprecise credences and act on them sequentially, you get money-pumped unless you adopt a decision rule that paralyzes you. A sharp Bayesian avoids the pump naturally. So, imprecise credences force you to choose between being exploited or being unable to act. That's a heavy price to pay just to model the Ellsberg intuition."

  **The Bottom Line:** It's not a definitive refutation (philosophy rarely has those), but it shifts the burden of proof. The imprecise view isn't "free"; it requires complex decision rules to avoid irrational outcomes. If the sharp Bayesian can explain away Ellsberg (e.g., via risk-weighted utility) without incurring these sequential costs, the sharp view wins on parsimony.
