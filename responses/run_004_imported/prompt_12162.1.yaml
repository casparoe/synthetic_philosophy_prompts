          *   *Refinement:* Make it about the justification. Is it a methodological postulate or derived?
          *   *Dodge:* "It's a rationalist intuition."
          *   *Follow-up:* "If it's an intuition, why trust it over the physicalist intuition that consciousness *must* arise?"

      *   *Requirement 2: Soames's Objection (A Priori Access).*
          *   *Draft:* Soames says speakers don't know this stuff. How do you reply?
          *   *Refinement:* Focus on "ordinary competent speakers." 2D seems to require them to know complex conditionals a priori.
          *   *Dodge:* "It's idealized rational reflection, not empirical psychology."
          *   *Follow-up:* "If it's so idealized it diverges from actual linguistic competence, is it still a semantic theory or just a metaphysical tool?"

      *   *Requirement 3: Type-B Materialism / Strong Necessity.*
          *   *Draft:* Why is strong necessity worse than an epistemic gap?
          *   *Refinement:* Frame it as a clash of brute facts. Why is brute metaphysical necessity more costly than brute epistemic connection?
          *   *Dodge:* "Strong necessity violates the modal rationalism principle."
          *   *Follow-up:* "Isn't that just begging the question against the Type-Ber? If the world is brute, why privilege your modal principle?"

      *   *General Questions (filling out the 8-10):*
          *   Need to cover the "Kripke-proof descriptivism" charge directly.
          *   Need to cover the role of phenomenology.
          *   Need to cover the "Hard Problem" relation to 2D.
          *   Need to cover recent developments (maybe QIE or structuralism).
          *   Need a closing "big picture" question.

  4.  **Developing the Content (incorporating the "Dodge" and "Follow-up"):**

      *   *Question 1 (Conceivability/Possibility):* Focus on the bridge principle.
      *   *Question 2 (Soames):* Focus on psychological realism vs. idealization.
      *   *Question 3 (Type-B):* Focus on theoretical cost.
      *   *Question 4 (Descriptivism Charge):* Is this just saving Frege from Kripke?
      *   *Question 5 (The "Deep" Intension):* Are primary intensions descriptive?
      *   *Question 6 (Phenomenal Concepts):* How does 2D interact with the Phenomenal Concept Strategy?
      *   *Question 7 (Structuralism):* Does 2D force a structuralist view of the world?
      *   *Question 8 (Meta-ontology):* Is the debate verbal?
      *   *Question 9 (Application):* Does this help AI consciousness?
      *   *Question 10 (Retraction/Revision):* What would make you give it up?

      *(Self-Correction during drafting)*: Ensure the "Dodge" and "Follow-up" sections are distinct and actionable for the podcaster. The follow-up needs to prevent the guest from spinning wheels.

  5.  **Refining the Tone:**
      *   Make sure the questions sound like spoken language (podcast style) but retain technical precision.
      *   Ensure the "Dodge" predictions are charitable but realistic (philosophers *will* retreat to definitions).
      *   Ensure the "Follow-ups" cut through the definitions.

  6.  **Final Review against Constraints:**
      *   8-10 questions? Yes (I'll aim for 10 to be safe).
