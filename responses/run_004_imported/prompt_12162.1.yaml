prompt: |-
  Ok so I had this two-hour argument with my friend last night about two-dimensional semantics -- whether Chalmers's primary/secondary intension setup actually earns him the zombie argument against physicalism, or if its just Kripke-proof descriptivism wearing a disguise. Never resolved it, but good timing: I'm interviewing a philosopher next week who defends epistemic two-dimensionalism for my podcast, and I don't want the episode to turn into twenty minutes of her re-explaining primary vs secondary intensions to the audience.

  Can you draft me 8-10 questions that push past that? I want at least one on whether "ideal primary conceivability entails primary possibility" is independently defended or just a premise smuggled in to get the zombie conclusion she wants, one on Soames's complaint that the whole framework requires ordinary competent speakers to have a priori access to conditions they obviously don't have, and one on the type-B materialist's "strong necessity" move -- why is a brute, unexplained metaphysical necessity worse than an unexplained epistemic gap she can't independently motivate either? For each of those three, give me her most likely dodge and a follow-up question sharp enough that she can't just retreat into restating the framework.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Two-Dimensional Semantics (specifically Chalmers's Epistemic Two-Dimensionalism) and the Zombie Argument against Physicalism.
      *   **Context:** The user had a 2-hour argument with a friend about whether this framework is substantive or just "Kripke-proof descriptivism." They are interviewing a philosopher who *defends* this view next week.
      *   **Goal:** 8-10 interview questions that go *beyond* basic explanations (primary vs. secondary intensions).
      *   **Specific Requirements:**
          *   Must include a question on "Ideal Primary Conceivability $\rightarrow$ Primary Possibility" (is it defended or smuggled?).
          *   Must include a question on Soames's objection (competent speakers' a priori access).
          *   Must include a question on Type-B Materialism's "Strong Necessity" move (why is brute metaphysical necessity worse than brute epistemic gap?).
          *   For these three specific questions, provide the interviewee's "most likely dodge" and a "sharp follow-up."
      *   **Tone:** Professional, philosophically rigorous, suitable for a podcast interview (engaging but deep).

  2.  **Deconstruct the Philosophy:**
      *   *Epistemic Two-Dimensionalism (2D):* Distinguishes between how a term picks out a referent given how the world turns out (primary intension/epistemic) vs. how it picks out a referent given fixed actuality (secondary intension/metaphysical).
      *   *The Zombie Argument:* Zombies are primarily conceivable $\rightarrow$ primarily possible $\rightarrow$ physicalism is false (because physicalism says consciousness necessitates physical facts).
      *   *The "Kripke-proof Descriptivism" Charge:* Critics (like Soames) argue 2D tries to save descriptivism from Kripke's *Naming and Necessity* by shifting the necessity to the second dimension, but it attributes too much a priori knowledge to speakers.
      *   *Type-B Materialism:* Accepts an epistemic gap (we can conceive of zombies) but denies an ontological gap (zombies aren't metaphysically possible). They posit "strong necessity" (a posteriori necessities that aren't derivable from primary intensions).
      *   *Chalmers's Counter:* Strong necessity is ad hoc/mysterious; the epistemic gap *is* evidence of an ontological gap.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Conceivability to Possibility.*
