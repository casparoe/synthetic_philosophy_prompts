      *   *Type-B:* The claim is that identity statements like $P = Q$ (Physical = Phenomenal) are necessary a posteriori, but 2D argues that if they were, the primary intensions would coincide. Type-B says "no, strong necessity." Chalmers says "strong necessity is unintelligible."
      *   *Conceivability:* The principle is $1$-conceivability $\rightarrow$ $1$-possibility. The dodge is usually "Idealization."

