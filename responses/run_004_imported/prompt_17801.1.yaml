answer: |-
  You are not confusing yourself, and you are definitely not making this up. You have independently rediscovered one of the most famous and frustrating problems in contemporary epistemology.

  The specific problem you are describing is known as **The Bootstrapping Problem** (sometimes called the "Problem of Easy Knowledge").

  It was formally articulated in the early 2000s by philosophers like **Jonathan Vogel** and **Stewart Cohen**, though its roots go back to the **Problem of the Criterion** (Roderick Chisholm) and debates about **Epistemic Circularity** (William Alston).

  Here is the breakdown of why your intuition is correct, why it breaks the theory of Reliabilism, and why philosophers are still fighting about it.

  ### 1. The Structure of the Problem
  Your intuition is that you cannot validate a source using only the output of that source. In philosophy, this is **epistemic circularity**.

  If we formalize your scale scenario, it looks like this:
  1.  **Reading:** The scale reads 150 lbs.
  2.  **Belief:** Therefore, I weigh 150 lbs. (Based on trusting the scale).
  3.  **Observation:** The scale read 150 lbs, and I weighed 150 lbs.
  4.  **Repetition:** (Repeat for 100 days).
  5.  **Conclusion:** The scale is accurate.

  The problem is that step 2 assumes the conclusion of step 5. You are assuming the scale is accurate to generate the data that proves the scale is accurate. You are pulling yourself up by your own bootstraps.

  ### 2. Why this is a nightmare for Reliabilism
  You asked: *Why can't someone who likes Reliabilism just shrug it off?*

  This is the crux of the debate. **Reliabilism** is an *externalist* theory. It says that for a belief to be knowledge/justified, it must be produced by a reliable process. Crucially, **you do not need to know that the process is reliable.** You just need it to *be* reliable.

  So, a hardline Reliabilist might try to shrug and say:
  > "If the scale is actually accurate, then your belief is produced by a reliable process. Therefore, you know your weight. If you track that reliability over time, you also know the scale is reliable. What's the problem?"

  **The Objection (The "Easy Knowledge" Problem):**
  Stewart Cohen argued that if Reliabilism is true, it makes knowledge **too cheap**. It allows you to gain justification for the reliability of a source without any independent investigation.

  Imagine a gas gauge in your car.
  *   **Reliabilist View:** If the gauge is reliable, you look at it, see "F", believe the tank is Full. You do this ten times. You now know the gauge is reliable.
  *   **Intuitive View:** This is absurd. You cannot verify the gas gauge is working without ever opening the tank to look at the actual gas. If you can't check the tank, you can't know the gauge is good, no matter how consistent it is.

  If Reliabilists accept the scale scenario as "knowledge," they have to admit that a person could verify the accuracy of a magic 8-ball, a horoscope, or a broken clock (that happens to be right twice a day) simply by trusting it blindly and recording its successes.

  ### 3. Why Consistency isn't Accuracy
  Your prompt mentions: *"It gives me a number that basically matches what I 'expect' — which... is really just whatever the scale told me the day before."*

  This highlights the difference between **Coherence** and **Correspondence**.
  *   **Coherence:** The readings match each other. (The scale is *precise*).
  *   **Correspondence:** The readings match reality. (The scale is *accurate*).

  A scale could be calibrated to always add 10 pounds. It would be perfectly coherent (consistent every morning), but completely inaccurate. Your reasoning validates the *coherence*, but you are claiming it validates the *accuracy*. That is the leap that feels like cheating, because it is.

  ### 4. Can Reliabilists defend themselves?
  They try, but it's difficult. Here are the two main ways they respond:

  **A. Biting the Bullet (Alston)**
  Some reliabilists (like William Alston) admit that yes, this *is* circular, but they argue that all ultimate justifications are circular. We have to trust *some* basic sources (like perception or memory) without being able to prove them independently. They argue that while the reasoning is circular, the belief is still justified if the source is *actually* reliable.
  *   *Counter:* This feels unsatisfying because it doesn't help *you* distinguish between a working scale and a broken one that is stuck on the same number.

  **B. Requiring Independent Access (Cohen)**
  Critics argue that to know a source is reliable, you must have "independent access" to the truth of the matter. You need to know your weight *some other way* (a doctor's scale) to confirm the bathroom scale.
  *   *The Cost:* This pushes epistemology toward **Internalism** (you need to have access to the reasons why you know). This undermines the main selling point of Reliabilism, which was supposed to free us from needing to understand *why* our beliefs are justified.

  ### Summary
  You have hit on the **Bootstrapping Objection**.

  1.  **Is it a real problem?** Yes. It is a major argument against pure Reliabilism.
  2.  **Why can't they shrug it off?** Because if they do, they have to admit that you can gain knowledge of a source's reliability without any independent evidence, which makes "knowledge" trivial. It implies you could verify a crystal ball works just by asking it questions and believing the answers.

  Your intuition that "a hundred fine readings in a row should add up to trustworthy" is the exact intuition that Reliabilism relies on, but your second intuition—that "this feels like cheating"—is the exact intuition that the Bootstrapping Objection uses to attack Reliabilism.

  You aren't confused; you're just doing epistemology.
