      *   **Characters:** Two committed Bayesians (both agree beliefs are probabilities, not binary states).
      *   **Stance A (Pro-Knowledge Norm):** Concedes that assertion tracks something "knowledge-shaped" (safety, sensitivity, etc.) rather than raw credence, despite being a Bayesian about *belief*. They see the Lottery/Bike asymmetry as decisive against pure credence norms.
      *   **Stance B (Pro-Credence Norm):** Defends a threshold norm (assert $p$ iff $P(p) > t$) even for the lottery case. Must explain the asymmetry without abandoning the norm (e.g., implicature, resilience, stability, context).
      *   **Tone/Style:** High-level philosophical debate, familiar with the literature (Williamson, Hawthorne, Stanley, etc.), rigorous back-and-forth, no easy capitulation, specific counter-moves.
