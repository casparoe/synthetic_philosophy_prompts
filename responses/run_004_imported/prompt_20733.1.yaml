      *   **The Bike Case:** Lower credence (maybe $0.99$?), but assertion feels fine.
      *   **Knowledge Norm (KN):** Assert $p$ only if you know $p$. Explains the asymmetry (you don't *know* you lost the lottery via statistics).
      *   **Credence Norm (CN):** Assert $p$ if $P(p) > \text{contextual threshold}$.
      *   **Blake's Defenses:**
