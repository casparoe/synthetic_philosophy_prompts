answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague of Helen's, which means I've had the privilege of watching her shape this department for nearly forty years.

  Giving a retirement toast for Helen presents a unique challenge. Usually, you stand up and talk about how the honoree changed your life. But when the honoree is a world expert on the ethics of blame—specifically, the conditions under which one person has the *standing* to criticize another—you don't just give a speech. You submit yourself to peer review.

  And I know what half of you in this room are thinking. You're looking at me, you know I am chronically late, and you know I am about to make a joke about Helen being chronically late.

  Helen, I see you over there. You're already doing the math. You're calculating my moral standing in real-time. You're weighing the hypocrisy coefficient against the truth value of the claim. And honestly? You're right to be skeptical.

  We all remember the semester I was late to every single faculty meeting. I believe there was a memo. A formal, written correspondence regarding my punctuality. Signed by you. So, for me to stand here and roast you for arriving after the appetizers have already been cleared is, by your own rigorous definitions, a textbook case of lacking the standing to blame.

  But, channeling a bit of G.A. Cohen, I'm going to take the risk. Cohen argued that a hypocrite can still be dead right about the charge, even if they have no business making it. I am a hypocrite. But Helen, you are also late.

  [Pause for laughter]

  There it is. The philosophers in the room just nodded; the rest of you just learned that Helen operates on "Helen Time."

  For forty years, if a seminar started at 2:00 PM, Helen arrived at 2:10 PM. If dinner was at 7:00 PM, Helen appeared at 7:15 PM. But here is the thing about Helen's lateness that I've come to understand. It wasn't disrespect. It was never arrogance.

  Helen was late because she was finishing a thought. She was late because she stopped to ask a graduate student how they were *really* doing. She was late because she was lost in a problem that most of us wouldn't even know existed, trying to figure out not just what is true, but how we ought to live with one another when we fall short of it.

  And that brings me to why the hypocrisy doesn't actually matter.

  Helen's career was about when we are allowed to call each other out. But her legacy is about when we choose *not* to. She taught us that while standing to blame is a technical philosophical condition, standing *by* someone is a human one.

  Yes, she wrote me that memo about the meetings. But she also wrote me letters of recommendation when I needed them. She wrote me notes of encouragement when I didn't. She showed up, eventually, for the moments that actually counted.

  So, Helen, I know I lack the standing to blame you for being late. And I know you know that I know that. But I also know that you're going to forgive me. Because you've spent a lifetime teaching us that while consistency is a virtue, grace is a necessity.

  You are retiring this spring. And I have a prediction. For the first time in forty years, you have nowhere to be. No faculty meetings. No seminars. No dinners with deans.

  My hope for you is that you are never on time again. I hope you wake up when you want. I hope you arrive when you're ready. I hope you take all the time you need to finish your thoughts, to walk through the park, to sit with your family.

  You've spent forty years analyzing when we have the right to hold people accountable. Now, I hope you spend the next forty years holding yourself accountable to nothing but your own happiness.

  To Helen. May you always be late, may you always be forgiven, and may you always be exactly where you need to be, eventually.

  To Helen!
