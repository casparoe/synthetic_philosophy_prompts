          *   Helen used to enforce rules (called the speaker out in writing for being late to meetings).
          *   The speaker wants to roast Helen for *her* chronic lateness.
          *   This creates a hypocrisy problem (the speaker is late, blaming someone for being late).
          *   The audience is split: 50% philosophers (will spot the hypocrisy/ethical nuance immediately) and 50% family/deans (want warmth, not a lecture).
      *   **Goal:** Acknowledge the hypocrisy directly (don't dodge it), use G.A. Cohen's point (a hypocrite can be right about the charge even if they lack standing), keep it affectionate (not a seminar), and land as a tribute.
      *   **Tone:** Witty, warm, self-deprecating, intellectually respectful but accessible.

  2.  **Deconstruct the Philosophical Angle:**
      *   *Concept:* Standing to Blame.
      *   *The Trap:* If I blame Helen for being late, but I am also late, do I have the *standing* to blame her?
      *   *Helen's Expertise:* She knows the literature better than anyone. She will be calculating my standing in real-time.
      *   *The Cohen Move:* G.A. Cohen argued that hypocrisy doesn't make the *claim* false, it just undermines the *blamer*. I can be right that she's late, even if I'm a hypocrite for saying it.
      *   *The Twist:* Helen actually *did* blame me (for lateness). So she knows the drill.
      *   *Resolution:* The toast needs to pivot from "blame" to "appreciation." The "lateness" is a human quirk, not a moral failing.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the occasion, and the elephant in the room (the research topic). Set the stage for the philosophers.
      *   **The "Problem":** Bring up the specific conflict. I am blaming Helen for lateness. I am also late. Helen knows this. The philosophers know this.
      *   **The Philosophical Nod:** Mention "standing to blame." Reference the specific incident (the letter about my meeting lateness). This shows shared history and respect for her role.
      *   **The Cohen Pivot:** Briefly mention the idea that a hypocrite can speak truth. Keep it light. Don't get bogged down in citations.
      *   **The Roast (Affectionate):** Detail her lateness. Make it funny but endearing. Connect it to her brilliance (lost in thought, etc.).
      *   **The Turn (Heart):** Why does her lateness not matter? Because her presence matters. Shift from "standing to blame" to "standing to celebrate."
      *   **Closing:** A wish for the future (no more meetings to be late to). A toast.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
