          *   Argument: Coherence is instrumental. It serves *any* end. Therefore, it fits Humeanism.
          *   Nuance: The Anti-Humean argues coherence *itself* imposes constraints. I need to refute this or qualify it.
          *   *Decision:* I will argue that **ICT is perfectly at home within a Humean conception, provided we understand 'coherence' as a structural feature of optimization rather than a normative constraint on value.** The Anti-Humean conflates *consistency* with *correctness*. An agent can be consistently evil. ICT describes the geometry of goal-pursuit, not the morality of the goal.
          *   *Wait, I need to be careful.* If I say "perfectly at home," do I ignore the "idealized agency" point?
          *   *Refined Position:* I will argue that **ICT does not concede ground to the Anti-Humean, because procedural coherence (avoiding self-defeat) is distinct from substantive rationality (having correct ends).** The Anti-Humean claims reason dictates ends. ICT claims coherence dictates *instrumental* ends. These are compatible. The "idealization" is just assuming the AI is good at its job (Humean reason), not that it is morally good.

