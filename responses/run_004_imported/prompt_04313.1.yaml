      *   *Bostrom's Denial:* Why does Bostrom deny dependence on Hume? Because Hume's claim is contingent on human psychology. Bostrom's claim is conceptual/logical about the space of possible minds. A Kantian might argue rational beings *must* have certain ends. Bostrom argues there is no logical contradiction in a superintelligent paperclip maximizer.
      *   *Verdict:* OT is a modal generalization of Hume. It takes Hume's descriptive claim about humans and turns it into a claim about the logical possibility of mind design.

  3.  **Deconstruct Question 2: The Kantian Objection:**
      *   *Kant:* Pure practical reason *does* dictate ends (Categorical Imperative). A truly rational agent cannot will contradictions/universalizable maxims.
      *   *Rejection of OT:* A strict Kantian would say a "superintelligent" agent that violates moral law is *irrational*, not just differently motivated. Therefore, high intelligence + immoral goal is a contradiction in terms (or at least impossible for a *perfectly* rational agent).
