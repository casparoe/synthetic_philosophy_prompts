  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** A Chief Resident in Emergency Medicine (finishing her year).
      *   **Audience:** Graduating residents (30+), families/partners, Program Directors (one with bioethics background).
      *   **Occasion:** Residency graduation dinner (Charge to the Graduates).
      *   **Length:** About 5 minutes read aloud (approx. 750-900 words).
      *   **Core Theme:** The tension between clinical judgment and outcomes (Moral Luck), specifically referencing a recent incident where two residents made similar calls with different outcomes and were treated differently based on those outcomes.
      *   **Constraints:**
          *   Cannot use the phrase "moral luck."
          *   Cannot sound like a philosophy lecture.
          *   Cannot resolve into easy lies (e.g., "The world will be fair" OR "Nothing matters, it's all luck").
          *   Must incorporate Bernard Williams's idea: even a blameless agent owes a kind of regret to the outcome that a spectator does not.
          *   Must acknowledge the gap between control and responsibility without undermining the necessity of making decisions.
      *   **Tone:** Professional, empathetic, grounded, slightly philosophical but accessible, inspiring but honest.

  2.  **Deconstruct the Philosophical Core (for the writer's understanding):**
      *   *Nagel/Williams on Moral Luck:* We judge people based on things outside their control. In medicine, this is rampant (patient outcomes).
      *   *The Specific Incident:* Two residents, same call, different outcomes. One praised, one flagged. This is the "result bias" or "outcome bias."
      *   *Williams's "Agent Regret":* If I accidentally hit a child with my car (even if not negligent), I feel a specific regret that a bystander doesn't. I am *involved*. It's not just guilt; it's a recognition of my agency in the world.
      *   *The Balance:* We can't stop making decisions because luck exists. We can't ignore luck because it shapes our careers and consciences. We must own our agency despite the uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the moment. The transition from resident to attending. Set the scene (the dinner, the scattering).
      *   **The Hook (The Unspoken Reality):** Address the elephant in the room without being accusatory. The M&M conference. The way we review cases. The specific anecdote (generalized) about the two residents.
      *   **The Philosophical Pivot (Without Jargon):** Discuss the gap between the decision and the result. Acknowledge that the world doesn't always grade fairly.
      *   **The Williams Element (Agent Regret):** This is crucial. How to phrase "blameless regret"? It's about *ownership*. Even if you did the right thing, if it goes wrong, you carry it differently than your spouse or your attending.
      *   **The Charge (The Middle Path):** Avoid the two lies.
          *   Lie 1: "If you study hard, outcomes will be good." (False)
          *   Lie 2: "Outcomes are random, so don't worry." (Dangerous)
          *   Truth: You must act decisively *knowing* the outcome is uncertain, and carry the weight regardless.
      *   **Closing:** A call to courage. To stand in the uncertainty. To be good doctors despite the unfairness.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome everyone. We are done. You are going to be attendings. I know you are scared. I know about the two residents last year. One got yelled at, one got a high five. Same decision. Different luck. That's how medicine is. We can't say "moral luck" but that's what it is. Bernard Williams says you feel bad even if it's not your fault. That's okay. It means you care. Don't believe that hard work guarantees safety. Don't believe nothing matters. Believe in your judgment. Go forth.

      *Critique 1:* Too blunt. Needs more grace. Needs to sound like a Chief Resident, not a cynic. The Williams part needs to be woven in as "professional identity," not theory.

  5.  **Drafting - Iteration 2 (Focusing on Tone and Flow):**
      *   *Start:* Warmth. Congratulations.
      *   *Middle:* The M&M story. "We know how the story goes." The decision is made in the dark; the judgment comes in the light.
      *   *The "Regret":* Call it "the weight." The difference between watching a code and running a code.
      *   *The Charge:* Keep making the call. Don't let the outcome freeze you. But don't let the outcome define your worth either.
      *   *End:* Safe travels.

  6.  **Refining the Philosophy (The "Williams" Constraint):**
      *   Need to express: *I did what I thought was right, it went wrong, I am not guilty, but I am not untouched.*
      *   Phrasing idea: "There is a specific cost to being the one who held the pen." or "The person who makes the choice carries a shadow the observer never sees."

  7.  **Refining the "No Easy Lies" Constraint:**
      *   Explicitly warn against cynicism (nothing matters) and hubris (I control everything).
      *   Focus on *integrity of process* vs. *uncontrollability of result*.

  8.  **Writing the Speech (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words at a moderate pace.
      *   *Tone Check:* Is it too academic? Keep sentences rhythmic. Use medical imagery (triage, codes, charts).
      *   *The "Forbidden Phrase":* Ensure "moral luck" never appears.
      *   *The Bioethicist Nod:* Make the argument tight enough that the bioethicist PD nods, but soft enough that the parents understand.

      *(Self-Correction during drafting)*: I need to make sure I don't throw the Program Directors under the bus regarding the two residents incident. It needs to be observational about the *nature* of the work, not an indictment of the specific leadership, even if the leadership was flawed. Frame it as "the world" or "the system" or "the nature of review." Actually, the prompt says the department's treatment tracked the outcome. I should acknowledge this honestly but diplomatically. "We have seen how review works."

      *(Focusing on the Williams point)*: "Agent Regret." How to say this? "There is a grief that belongs only to the agent." "A debt that isn't guilt."

  9.  **Final Polish:** Check the rhythm. Ensure the ending lands on hope/action, not just existential dread.

      *Drafting the content...* (See final output for the result).
      *Key phrases to include:* "The gap between the choice and the consequence," "The person who signs the order," "Not guilt, but ownership."

  10. **Final Review against constraints:**
      *   5 mins? Yes.
      *   No "moral luck"? Checked.
      *   Williams's regret included? Yes.
      *   No easy lies? Yes.
      *   Appropriate for mixed audience? Yes.

      *Let's write.*
answer: |-
  Good evening. Family, friends, faculty, and the thirty of us who are finally, officially, leaving this program.

  When I was asked to give the charge to the graduates, I thought about giving you a list of clinical pearls. Don't miss the ectopic. Push fluids earlier in sepsis. But you know those. And honestly, after three years in this department, you know the medicine better than I do.

  So I want to talk about the other thing we learned here. The thing that keeps us up at 3:00 AM, long after the shift is over.

  We spend our training learning how to make decisions under uncertainty. We are taught to gather data, to weigh risks, to trust our intuition. But we are also taught, implicitly, that there is a ledger. That if we make the right choice, the patient gets better. That if we follow the algorithm, the outcome will be safe.

  We know that isn't true.

  We have all sat in Morbidity and Mortality conference. We have seen how a case is reviewed. And if we are honest, we have noticed that the light in that room shines differently depending on how the patient fared.

  I am thinking of a story from last year. Two residents. Similar presentations. Similar borderline calls. Both made the best judgment they could with the information they had. In one room, the patient walked out. In the other, the patient died.

  The medicine was the same. The reasoning was the same. But the aftermath was not. One was praised for being decisive. The other was flagged for clinical judgment concerns.

  We do not have a word for this in medicine. In philosophy, they might call it luck. But in the ED, we just call it Tuesday.

  I am not standing here to tell you that the world will be fair. It won't. I am not standing here to tell you that your effort guarantees safety. It doesn't. If I told you those things, I would be lying to you before you even put on your attending badge.

  But I am also not here to tell you that nothing matters. That would be a dangerous lie, too. If outcomes were purely random, there would be no point in us being here. There would be no point in the call, the study, the vigilance.

  So where does that leave you?

  It leaves you with a burden that is heavier than guilt, and more complex than blame.

  There is a philosopher named Bernard Williams who wrote about what happens when things go wrong, even when we haven't done anything wrong. He said that if you are the one driving the car, and a child runs into the road, and you hit them despite braking—you are not morally guilty. You did nothing negligent. But you are not the same as the person standing on the sidewalk watching it happen.

  The spectator feels sadness. The driver feels something else. Williams called it "agent-regret."

  It is a specific kind of weight. It is the recognition that *you* were the force in the world that intersected with that tragedy. It is not about fault. It is about ownership.

  As you scatter to your fellowships and your attending jobs, you will carry this. You will make the right call for the wrong reason. You will make the wrong call for the right reason. You will make the perfect call, and the patient will die anyway.

  When that happens, your colleagues will look at the outcome. The charts will be audited. The metrics will be tracked. The world will judge you by the result, because the result is the only thing the world can see.

  But you have to live with the decision.

  My charge to you is this: Do not let the unfairness of the outcome paralyze your judgment. Do not practice defensive medicine just to protect yourself from the randomness of the universe. That is a betrayal of the patient.

  But also, do not harden your heart. Do not tell yourself, "I followed the guidelines, so I owe nothing."

  When a patient dies on your watch, even if you did everything right, you owe them a kind of regret that your spouse does not owe. You owe them the acknowledgment that your hand was on the wheel. That regret is not a sign of weakness. It is the price of agency. It is the proof that you take your role seriously.

  The gap between what you control and what you are held responsible for is where this profession lives. It is uncomfortable. It is unjust. But it is also the space where your integrity is forged.

  So, go out there. Make the hard call. Intubate the difficult airway. Discharge the patient who looks fine but feels wrong. Do it with courage.

  And when the outcome does not match your effort—and it won't, not always—do not let the world convince you that you are only as good as your last save. But do not let yourself off the hook, either. Carry the weight. Learn from it. Let it humble you.

  The world will judge you by your luck. You must judge yourself by your character.

  Congratulations, Class. Go take care of them.
