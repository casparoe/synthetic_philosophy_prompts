answer: |-
  This is a superb question, and it cuts directly to the relationship between metaphorical illustration and logical argumentation in scientific theory. Given your background in chemistry, you will appreciate the distinction between a heuristic model and the underlying physical reality it attempts to describe.

  You are correct that Robert Mark's engineering analysis (and the subsequent architectural critiques) demonstrates that the San Marco pendentives are not "incidental leftover space" but integral structural components. The question is whether this factual error in the source domain (architecture) collapses the target domain concept (evolutionary by-products).

  My judgment is that while this undermines the **rhetorical elegance** of Gould and Lewontin's paper, it does **minimal damage to the logical validity** of their critique of adaptationism. Here is the breakdown of why the concept survives the collapse of its namesake example.

  ### 1. The Analogy was Illustrative, Not Evidentiary
  Gould and Lewontin did not argue that evolutionary by-products exist *because* architectural spandrels exist. They used the architecture as a pedagogical device to introduce a logical category that they argued was being ignored by adaptationists.

  The logical core of their argument is: *If Trait A is selected for, and Trait B is a necessary structural or developmental consequence of Trait A, then Trait B exists without being directly selected for.*

  Whether the San Marco pendentives bear load is irrelevant to the logical validity of that proposition. Even if the pendentives were purely decorative, the logical category of "non-adaptive structural consequence" would still need to be validated by biological data. Conversely, even if the pendentives are load-bearing, the logical category remains valid provided there are biological examples. As a chemist, you might liken this to using a flawed diagram of a benzene ring to explain resonance; if the diagram is slightly off but the quantum mechanical principles hold, the theory survives.

  ### 2. The Deeper Disanalogy: Design vs. Selection
  There is a more profound problem with the spandrel analogy that actually outweighs Mark's engineering critique. Architecture is the product of **intelligent design** (teleology), whereas evolution is the product of **natural selection** (blind variation).

  In architecture, every part is placed by an agent for a reason (even if that reason is structural constraint). In evolution, there is no agent. When Gould and Lewontin called a trait a "spandrel," they meant it arose from developmental or physical constraints, not because a "designer" needed to bridge a gap.

  Mark's critique highlights that the architects of San Marco *intended* the pendentives to bear load. This actually makes the architectural analogy *worse* for evolutionary biology, not better. However, this does not invalidate the biological concept of constraint. Biological systems have physical and developmental constraints (e.g., surface-area-to-volume ratios, protein folding limits) that operate independently of selection. The existence of these constraints is a matter of biophysics, not architectural history.

  ### 3. The Biological Foundation is Robust
  The "spandrel" concept (often refined today as **exaptation** or **by-product**) stands or falls on biological evidence, not Venetian architecture. Since 1979, evolutionary biology has accumulated substantial evidence for traits that are non-adaptive by-products:
  *   **The Red Color of Blood:** A chemical consequence of hemoglobin's iron, not a selected signal.
  *   **Male Nipples:** A consequence of the developmental pathway shared by sexes before hormonal differentiation.
  *   **The Human Chin:** Likely a structural by-product of jaw reduction rather than a selected trait for speech or mating.
  *   **Feathers:** Originally selected for thermoregulation, later exapted for flight.

  Because the biological catalog of spandrels/exaptations is robust, the failure of the architectural metaphor does not topple the theory. The concept has been decoupled from its metaphorical origin in the decades since.

  ### 4. Rhetorical Damage vs. Theoretical Damage
  While the theoretical damage is low, the **rhetorical** damage has been significant.
  *   **For Critics:** Philosophers like Daniel Dennett (in *Darwin's Dangerous Idea*) have wielded Mark's analysis as a cudgel to dismiss Gould and Lewontin's entire project. If the "flagship example" is factually wrong, critics argue it suggests a sloppiness that permeates the rest of the argument. It allows adaptationists to paint the critique as based on a category error.
  *   **For Proponents:** Most serious philosophers of biology (e.g., Elisabeth Lloyd, Kim Sterelny) treat the architectural error as a footnote. They recognize that the paper's enduring value lies in its methodological warning: *Do not assume optimization without testing for constraints and history.*

  ### 5. The "Load-Bearing" Nuance
  There is one nuance where Mark's analysis might actually concede a point to Gould. Even if the pendentives bear load, they were not designed *for the mosaics* that were later placed upon them. Gould's point was largely about the **misattribution of function**. Adaptationists often look at a trait (the mosaic) and assume the structure (the spandrel) was built *for* it.

  In biology, this maps to the error of assuming a trait's current utility explains its origin. Even if the pendentive is structural (adaptive in architecture), using it to explain the placement of the mosaics is a just-so story. Thus, the *methodological* warning against reverse-engineering function from current utility remains valid, even if the pendentive itself is functional.

  ### Verdict
  To answer your specific question: **No, it does not undermine the concept at its foundation.**

  It undermines the **pedagogy**, not the **ontology**. Gould and Lewontin's case against strict adaptationism rests on the reality of developmental constraints, genetic drift, and phylogenetic inertia. These are biological realities that exist regardless of whether Venetian architects understood their load paths.

  However, it is a genuine embarrassment. In science, when your central metaphor is empirically falsified in its own domain, it invites skepticism. But given that the last 40 years of Evo-Devo (Evolutionary Developmental Biology) have vindicated the core insight—that form is not always a direct map of function—the "Spandrels" argument remains a pillar of modern evolutionary theory, albeit one that scholars now prefer to support with genetic and developmental data rather than architectural history.

  As a chemist, you might view it this way: The "Spandrel" paper proposed a new reaction mechanism. The fact that the analogy they used to explain it (a specific industrial process) was misunderstood by the engineers who run that process does not invalidate the reaction mechanism, provided the lab results (biological data) hold up. And in this case, the lab results have held up remarkably well.
