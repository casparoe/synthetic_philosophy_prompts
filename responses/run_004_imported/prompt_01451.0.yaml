      *   **The Core Distinction (Analogy vs. Argument):** This is the crux. The spandrel is a *heuristic device*, not the evidence itself. The evidence must be biological.
      *   **The Nature of the "Error":** Clarify what G&L meant. They meant the *space* was a necessary consequence of the dome/arch junction. Mark says it bears load. But bearing load doesn't mean it was *selected* for the specific traits we see (like the mosaics). It distinguishes "constraint" from "optimization."
      *   **Biological Substantiation:** The concept survives because biology provides better examples than architecture. List a few (male nipples, red blood, exaptations like feathers).
      *   **The Adaptationism Debate Context:** The paper's goal was to broaden the explanatory toolkit (constraints, drift, by-products), not to deny adaptation exists. Mark's critique doesn't restore strict adaptationism.
      *   **Verdict:** Minimal damage to the *theory*, significant embarrassment to the *rhetoric*.

  5.  **Refining the Argument (Self-Correction/Nuance):**
