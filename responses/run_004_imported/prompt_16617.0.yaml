answer: |-
  You have hit on one of the most famous and persistent puzzles in the philosophy of probability. Your intuition is correct: the mathematics of Bayes' theorem is the same for everyone. The divergence lies entirely in what the mathematical symbols are *ontologically committed to*.

  Humphreys' paradox (from his 1985 paper *"Why Propensities Cannot Be Probabilities"*) exploits a tension between the **formal symmetry** of the probability calculus and the **physical asymmetry** of causal dispositions.

  Here is a walkthrough of the paradox, why it specifically targets propensities, and why frequentists and subjectivists can walk away unscathed.

  ---

  ### 1. The Core Argument: Symmetry vs. Asymmetry

  To understand the paradox, we have to look at how different interpretations understand the conditional probability symbol $P(A|B)$.

  *   **In the Probability Calculus (Kolmogorov Axioms):** Conditional probability is defined as a ratio: $P(A|B) = P(A \cap B) / P(B)$. Mathematically, this relationship is symmetric in the sense that if you have the joint distribution, you can compute $P(A|B)$ and $P(B|A)$ equally well. Bayes' theorem allows you to invert them freely.
  *   **In the Propensity Interpretation:** A probability is a physical disposition of a specific setup to produce an outcome. Therefore, $P(A|B)$ is interpreted as **the propensity of setup $B$ to produce outcome $A$.**

  **Humphreys' Insight:**
  Propensities are inherently causal or dispositional. Causation is temporally asymmetric: causes precede effects. A physical setup exists *before* the outcome it generates.
  *   If $B$ is the setup and $A$ is the outcome, $P(A|B)$ makes physical sense (the propensity of the setup to yield the outcome).
  *   But if $A$ occurs *before* $B$, then $P(A|B)$ would represent the propensity of a *later* event to produce an *earlier* event. This implies backward causation, which is physically nonsensical in standard contexts.

  However, the probability calculus demands that if $P(A|B)$ is a valid probability, then $P(B|A)$ must also be a valid probability (provided $P(A) > 0$). Humphreys argues that because propensities cannot make sense of the inverse conditional in temporally ordered cases, **propensities cannot satisfy the axioms of probability.**

  ### 2. The Standard Example: The Half-Silvered Mirror

  Humphreys uses a photon experiment to make this concrete.

  **The Setup:**
  *   Let $I$ be the event that a photon is **Incident** on a half-silvered mirror at time $t_1$.
  *   Let $T$ be the event that the photon is **Transmitted** through the mirror at time $t_2$ (where $t_2 > t_1$).

  **The Propensity Claim:**
  There is an objective physical propensity $P(T|I) = 0.5$. This describes the physical tendency of the mirror setup (given incidence) to transmit the photon.

  **The Application of Bayes' Theorem:**
  According to the probability calculus, we can invert this:
  $$P(I|T) = \frac{P(T|I) \cdot P(I)}{P(T)}$$

  **The Paradox:**
  *   **For the Propensitist:** What does $P(I|T)$ represent? It represents the propensity of the photon being **Transmitted** ($T$) to produce the outcome that it was **Incident** ($I$).
  *   But $T$ happens *after* $I$. The transmission cannot physically dispose the universe to have had an incidence. The "setup" for the transmission includes the incidence; the transmission is the *result*.
  *   Therefore, $P(I|T)$ is physically meaningless as a propensity. It describes a "backward propensity."
  *   **Conclusion:** Since the probability calculus says $P(I|T)$ must exist and be well-defined, but the propensity interpretation says it is physically meaningless, propensities are not probabilities.

  ### 3. Why Frequentists and Subjectivists Escape

  This is the crux of your question. Why doesn't this logic destroy everyone else? The answer is that neither frequentists nor subjectivists tie the conditional bar ($|$) to **physical production**.

  #### The Frequentist Escape
  For a frequentist (specifically a von Mises style collectives theorist), probabilities are long-run relative frequencies in a hypothetical infinite sequence.
  *   $P(T|I)$ is simply the ratio of the number of $(I \text{ and } T)$ occurrences to the number of $I$ occurrences in the collective.
  *   $P(I|T)$ is the ratio of the number of $(I \text{ and } T)$ occurrences to the number of $T$ occurrences.
  *   **Time is irrelevant to set theory.** In a fixed dataset (or infinite collective), you can count how many transmitted photons were incident just as easily as you can count how many incident photons were transmitted. The temporal order of the events does not change the set-theoretic relationship between the classes. The frequentist makes no claim that $T$ *causes* $I$; they only claim that in the set of transmitted photons, the subset that were incident has a certain frequency (which is 1, in this case).

  #### The Subjectivist (Bayesian) Escape
  For a subjectivist, probability is a degree of rational belief.
  *   $P(T|I)$ is how strongly I believe the photon will transmit, given I know it was incident.
  *   $P(I|T)$ is how strongly I believe the photon was incident, given I know it transmitted.
  *   **Epistemology is not Ontology.** If I observe a transmitted photon ($T$), I can update my belief about the past ($I$). This is called **retrodiction**. It does not imply that the present event physically caused the past event; it only implies that my *knowledge* of the present event constrains my *belief* about the past event. The conditional bar ($|$) represents "given the information that," not "given the physical setup that."

  #### The Propensitist Trap
  The propensitist is the only one who claims probability is an **objective, single-case, physical property of the world.**
  *   They cannot retreat to set theory (like the frequentist) because they care about single cases, not long-run ratios.
  *   They cannot retreat to epistemic states (like the subjectivist) because they claim probability is mind-independent.
  *   They are stuck with the claim that $P(A|B)$ is a physical power of $B$ to generate $A$. When $A$ precedes $B$, that physical power cannot exist.

  ### 4. Responses and Nuance

  It is worth noting for your piece that the philosophical community did not simply accept Humphreys' conclusion that "propensities are not probabilities." There are three main lines of response you might encounter:

  1.  **Humphreys' Own Conclusion:** Humphreys argued we should stop trying to force propensities into the Kolmogorov axioms. We should treat propensities as a *sui generis* concept that looks like probability but lacks the inversion axiom. (This is unpopular because it severs the link between propensities and standard statistical math).
  2.  **The "Conditional Setup" Response (e.g., Miller, Gillies):** Some argue that $P(I|T)$ is not a backward propensity. Instead, it is the propensity of a *different* setup.
      *   $P(T|I)$ is the propensity of the *Mirror Setup*.
      *   $P(I|T)$ is the propensity of a *Detection Setup* (where detecting a transmission implies a prior incidence).
      *   Critics say this feels like word games to save the axioms.
  3.  **Time-Symmetric Propensities:** A minority view suggests that propensities might be time-symmetric physical relations, though this clashes with standard views of causation in physics.

  ### Summary for Your Piece

  The "bite" of Humphreys' paradox comes from the **interpretation of conditioning**.

  *   For **Frequentists**, conditioning is **class restriction** (subset ratios). Time doesn't matter.
  *   For **Subjectivists**, conditioning is **information update** (logic of belief). Time doesn't matter.
  *   For **Propensitists**, conditioning is **physical generation** (causal disposition). Time matters fundamentally.

  Humphreys showed that if you interpret probability as physical generation, you break the mathematical symmetry required by Bayes' theorem. Since physicists and philosophers want to use Bayes' theorem *and* want to treat quantum probabilities as objective physical tendencies, they are left with a significant conceptual tension that Humphreys crystallized in 1985.
