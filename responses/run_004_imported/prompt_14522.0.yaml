answer: |-
  **Eulogy for Marcus Vane**
  **Spoken by Dana**

  There is a story Marcus told in every Intro to CogSci lecture. You probably know it. Otto has Alzheimer's. Otto carries a notebook. When he needs to know where the museum is, he looks in the notebook. He trusts the notebook. He relies on it. Marcus would lean over the podium and ask: Is the information in Otto's head? Or is the notebook part of Otto's mind?

  The answer, for Marcus, was always the second one.

  He spent thirty years arguing that the boundary of the skull is just a biological convenience. It's not a sacred wall. If you trust a tool enough, if you use it reliably enough to navigate the world, that tool becomes part of the thinking process. The mind leaks out. It spills into the environment.

  I know half of you are waiting for me to violate that thesis. You are waiting for me to look at his published papers, or the urn on the table, or this congregation, and say, "Marcus lives on in these things."

  If I said that, I know the people in the third row would wince. Because Marcus was very clear: A notebook sitting on a shelf, closed and unread, is just paper and glue. A mind requires a loop. It requires a active coupling between a brain and the world. When the brain stops driving the loop, the mind stops.

  So, I cannot tell you that Marcus is here in this room. Biologically, the loop is broken. The coupling is severed. To pretend otherwise would be to insult the rigor he demanded from us.

  But.

  Marcus also taught us that the location of the mind isn't the point. The point is the *work* the mind does.

  I have spent the last week trying to write this speech. I kept reaching for the phone to text him a draft. I kept walking past his office expecting to see the light on. That impulse—that reflexive reach—is a habit. It is a coupling. For ten years, my thinking was reliably coupled with his. I would have a thought, I would bring it to him, he would challenge it, and the resulting idea belonged to neither of us alone. It belonged to the system we built together.

  Grief, I am finding, is the sensation of reaching for a tool that is no longer there. It is the phantom limb of the extended mind.

  But here is where the theory offers us something better than a platitude.

  Marcus believed that memory isn't a storage unit inside us. It's a relationship with the outside. We don't "hold" people inside our heads. We hold them by how we engage with the world they helped shape.

  His sister asked me yesterday if his work is gone. If the lab closes, does he disappear?

  Under Marcus's own definition: Only if we let the coupling go.

  If his papers sit in a box, they are just paper. But if I open them, and I read them, and I argue with them, and I use his frameworks to solve problems he never saw... the loop closes again. Not because his soul is in the ink, but because my brain is now doing the work his brain used to do, using the tools he left behind.

  To the department: I promise I will not treat his theories as artifacts. I will not museum-ify them. I will use them. I will test them. I will couple with them.

  To his family: You do not need to understand the Extended Mind Thesis to know that he is still working. You see it when you use the patience he taught you. You see it when you ask the questions he taught you to ask. When you navigate the world using the compass he built, you are not just remembering him. You are re-instantiating the process of his mind.

  He told us once that where the mind ends is a boring fact of biology. He was right. But where the mind *continues* is a matter of choice.

  It continues wherever we choose to trust his tools. It continues wherever we choose to think *with* him, rather than just *about* him.

  So, I am not going to say he is watching over us. I am going to say that we are now the external drive. We are the notebook. We are the reliable coupling.

  As long as we keep the loop open, the thinking doesn't stop.

  Thank you.
