answer: |-
  Good morning. For those of you who knew my Aunt Miriam through her work, you know she had a specific joke about moments like this. She used to say that the eulogy is the single most epistemically irresponsible thing human beings do.

  Her reasoning was sharp, and typical of her. When we grieve, we know our judgment is compromised. We know that love acts like a lens, magnifying the good and blurring the sharp edges. So, when I stand here and tell you she was brilliant, and kind, and right about almost everything, I am doing so while admitting that my brain is currently flooded with chemicals designed to make me miss her. I have strong evidence that I am unreliable. And yet, I am speaking with total confidence. To Miriam, that was a kind of hypocrisy. A glitch in the system.

  She spent her career studying that glitch. She didn't use words like "glitch," of course. She studied what happens when a medical resident calculates a dosage, and then is told, "You haven't slept in twenty-four hours. People in your state make math errors, and they feel *more* sure of them, not less." The resident can't find the error in the math. The numbers look right. But she knows her own mind is a broken instrument. So, how sure should she be?

  Miriam wrote papers about that tension. How do you trust yourself when you know you're broken?

  And now, here I am. The broken instrument. Standing in front of her colleagues, who are waiting to see if I understand the irony, and in front of her family and the friends from the camping trips she organized for fifteen years, who just want to hear that she was wonderful.

  If I hedge every sentence—if I say, "I *feel* like she was kind, though I acknowledge my grief biases this assessment"—I comfort no one. I betray the warmth she actually had. But if I speak without qualification, I feel like I'm violating the very standards of honesty she lived by.

  So, I have to take a position on this. I have to decide: Do I honor her mind by doubting myself, or do I honor her heart by speaking truly?

  I've decided that Miriam's work wasn't actually about doubt. It was about calibration. It was about knowing when to trust the instrument and when to set it down.

  Yes, I am biased. I loved her. But I want to suggest that this bias isn't noise in the signal. It *is* the signal.

  When we talk about facts—like a drug dosage, or the date of a meeting—grief is a liability. It clouds accuracy. But a eulogy isn't a peer-reviewed paper. It isn't a claim about objective data. It is a testimony of value. And on the question of Miriam's value, my bias is not a distortion. It is the appropriate response to the data.

  If you spend fifteen years organizing a camping trip for a group of rationalists—people who argue about definitions for fun—you learn something about patience. You learn that people aren't logic puzzles to be solved. They are messy, sleep-deprived residents all the time. Miriam knew that. She didn't love us because we were right. She loved us because we were trying.

  She taught me that higher-order evidence—evidence about your own thinking—matters. But she also taught me that you have to live. You can't stay in the loop of doubting your doubt forever. At some point, you have to act. You have to speak. You have to love.

  So, I am acknowledging the akrasia. I am acknowledging that I am grieving, and that grief makes me want to put her on a pedestal. But I am also confident that the pedestal was built before she died.

  I saw her argue with a graduate student for an hour about the definition of "knowledge," only to stop, laugh, and ask him if he'd eaten lunch. I saw her navigate a rainstorm at campsite four, keeping thirty adults from losing their tents without raising her voice once. I saw her treat the janitor in her building with the same intellectual respect she gave the department chair.

  The evidence for her goodness isn't just in my memory. It's in this room. It's in the colleagues who are here, the friends who are here, the family who is here. We are the data points. And the correlation is overwhelming.

  Miriam worried that we would be epistemically reckless in our love for her. But I think she would accept that this is the one domain where recklessness is permitted. When the subject is human worth, confidence is not a bug. It's a requirement.

  So, I will not hedge. I will not tell you that I *think* she was wonderful, subject to revision. I am telling you she *was* wonderful. I am telling you this with the confidence of someone who knows their instrument is calibrated by love.

  She spent her life teaching us how to think clearly. The clearest thought I can have right now is that we are better for having known her, and worse for having lost her. That is not a glitch. That is the truth.

  Rest well, Aunt Miriam. We'll take it from here.
