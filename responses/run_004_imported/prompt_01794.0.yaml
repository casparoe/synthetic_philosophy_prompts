      *(Final check on the prompt)*: The user asks if it's "anticipating... Zahavi" or "distinct, non-handicap account... nearer to Fisherian." I need to choose the latter strongly.

  9.  **Final Output Structure:**
      *   Direct Answer.
      *   Analysis of Darwin's Argument (Aesthetic vs. Informative).
      *   The Fisherian Link.
      *   The Zahavi Break (Cost as Message vs. Cost as Drag).
      *   Historiographical Conclusion.

