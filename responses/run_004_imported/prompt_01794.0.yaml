answer: |-
  You have spotted a crucial fault line in the intellectual history of evolutionary biology. Your reading of the passage is correct: **Darwin is not anticipating the Handicap Principle here.** In fact, this passage is a paradigmatic example of the logic that the Handicap Principle was later devised to *supplement* or *replace*.

  To place this passage accurately in your research, you should categorize it as the foundational statement of **aesthetic sexual selection**, which aligns much more closely with the later **Fisherian runaway process** than with Zahavi's **handicap principle**.

  Here is a breakdown of why this distinction matters for your history of costly-signaling theory.

  ### 1. Darwin's Logic: Aesthetic Choice, Not Honest Signaling
  In this passage, Darwin's argument rests entirely on the psychology of the receiver (the female), not the physiological constraint of the sender (the male).

  *   **The Mechanism:** Darwin posits an innate "taste" in the female. He compares it to a "human degree of taste." The ornament evolves because it stimulates this aesthetic sense.
  *   **The Function:** He explicitly states the ornament serves "for no other purpose." This is the critical clause. If Darwin were anticipating the Handicap Principle, he would argue that the ornament serves the purpose of *demonstrating vigor* or *genetic quality* by virtue of its cost. Instead, he argues the beauty *is* the purpose.
  *   **The Role of Cost:** Darwin acknowledges the plumes are large, but he does not frame their size as a *guarantor of honesty*. He frames it as a visual stimulus. For Darwin, the survival cost of the plumage (which he discusses elsewhere regarding the peacock) is a *drag* on Natural Selection that Sexual Selection must overcome, not the *mechanism* that makes the signal reliable.

  ### 2. The Fisherian Connection (1930s)
  R.A. Fisher, in *The Genetical Theory of Natural Selection* (1930), mathematicalized exactly the intuition Darwin expresses in this passage.

  *   **Arbitrary Preference:** Fisher argued that female preference could be arbitrary. It does not need to track male quality. If females prefer long tails, long tails evolve, even if they offer no survival benefit.
  *   **The Link:** Your Darwin passage is the qualitative ancestor of the Fisherian model. Both rely on the idea that the female's sensory bias or aesthetic preference drives the evolution of the trait, independent of the trait's information content regarding survival.
  *   **Why it fits:** In both Darwin's passage and Fisher's model, the signal does not need to be "honest" in the Zahavi sense. It only needs to be "attractive."

  ### 3. The Zahavi Break (1975)
  Amotz Zahavi's Handicap Principle was a direct challenge to the sufficiency of the Darwin/Fisher explanation.

  *   **The Problem:** By the 1970s, evolutionary biologists were uncomfortable with the idea of "arbitrary" female taste. It seemed teleological to assume females simply "liked" things that reduced their offspring's survival chances (via the Fisherian process).
  *   **Zahavi's Solution:** Zahavi flipped the logic. He argued that the ornament is selected *because* it is costly. The cost makes the signal **unfakeable**.
  *   **The Contrast:**
      *   **Darwin/Fisher:** The female chooses the trait because she finds it beautiful (psychological/aesthetic).
      *   **Zahavi:** The female chooses the trait because the cost proves the male is high-quality (informational/economic).

  In your passage, Darwin writes: *"He who thinks that he can safely gauge the discrimination and taste of the lower animals, may deny that the female Argus pheasant can appreciate such refined beauty..."*
  Zahavi would rewrite this to say: *"It does not matter if the female appreciates beauty; she chooses the male because the plumes prove he can survive despite them."*

  ### 4. Historiographical Placement
  For your feature on the intellectual history of costly-signaling, this passage serves as a **baseline of the "Pre-Handicap" Paradigm.**

  It illustrates the dominant view that Zahavi had to overturn. For a century after *The Descent of Man*, the "Problem of the Peacock's Tail" (and the Argus Pheasant) was explained via Darwin's aesthetic choice or Fisher's runaway selection. These models treated the cost of the ornament as a puzzle to be explained away (i.e., "How did this evolve *despite* the cost?").

  Zahavi's genius was to treat the cost as the solution (i.e., "This evolved *because* of the cost").

  ### Conclusion
  You should characterize this passage as **distinct from the handicap account.** It is a classic statement of **aesthetic sexual selection**.

  *   **Is it anticipating Zahavi?** No. It lacks the concept of cost-as-guarantee.
  *   **Is it nearer to Fisher?** Yes. It relies on female "taste" driving the evolution of a trait that serves "no other purpose."

  If you are tracing the genealogy of signaling theory, this passage represents the **psychological/aesthetic lineage** (Darwin $\rightarrow$ Fisher $\rightarrow$ Kirkpatrick), which stands in contrast to the **informational/economic lineage** (Zahavi $\rightarrow$ Grafen $\rightarrow$ Johnstone) that defines modern costly-signaling theory. Darwin is arguing for the reality of female choice, but he is not yet arguing for the honesty of the signal.
