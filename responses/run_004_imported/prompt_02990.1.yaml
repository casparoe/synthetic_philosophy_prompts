answer: |-
  First off, welcome to the reading group. You haven't mangled the history or the technical bits at all. In fact, your background gives you a leg up on most philosophy graduate students discussing this topic. They often treat the Brier score as an abstract mathematical object, whereas you know it as a tool designed to solve a specific human problem: stopping forecasters from sandbagging.

  You have put your finger on perhaps the most significant pressure point in the "accuracy-first" program. This is not a soft spot you're missing; it is **the** central objection raised against Jim Joyce's 1998 argument ("A Nonpragmatic Vindication of Probabilism") and the subsequent literature (Pettigrew, Leitgeb, etc.).

  Here is the breakdown of why your intuition is correct, how the epistemologists try to defend against it, and where the debate currently stands.

  ### 1. The History and Tech Check
  You are spot on.
  *   **Brier (1950):** Glenn Brier introduced the score specifically for verification of probability forecasts. The motivation was indeed to create an "honesty system." If the rule isn't proper, a forecaster maximizes their score by reporting something other than their true belief (e.g., reporting 100% confidence if the payoff is binary, even if they only feel 80% sure).
  *   **Joyce (1998):** Jim Joyce explicitly imports this machinery into epistemology. His goal was to vindicate the probability axioms without relying on Dutch Books (which are pragmatic/money-based) or Representation Theorems (which rely on preferences). He wanted *alethic* vindication: incoherent credences are simply less accurate than coherent ones, regardless of consequences.
  *   **Strict Propriety:** You defined this correctly. A scoring rule $S$ is strictly proper if, for any credence $c$, the expected score is minimized by reporting $c$.

  ### 2. The Core Objection: "Pragmatic Smuggling"
  Your objection is this: **Strict propriety is defined in terms of expectations and incentives. If we select our measure of 'truth-likeness' based on a rule designed to prevent gaming, haven't we grounded the norm in pragmatism?**

  In the meteorological context, propriety is instrumental. We want proper rules *because* we want forecasters to have an incentive to tell the truth. It is a means to an end (reliable communication).

  In the epistemological context, Joyce wants propriety to be constitutive of accuracy itself. He argues that if a scoring rule tells you that reporting 0.9 yields a better (more accurate) score than reporting 0.7 when your evidence supports 0.7, that scoring rule is defective *as a measure of accuracy*.

  **The Defense (The Alethic Interpretation of Propriety):**
  Proponents like Richard Pettigrew (in *Accuracy and the Laws of Credence*) and Joyce (in later refinements) argue that propriety can be motivated without pragmatics. Their argument runs roughly like this:

  1.  **Alethic Veritism:** The fundamental epistemic goal is to believe the truth.
  2.  **Epistemic Expectations:** If I assign a credence of 0.7 to proposition $P$, I am judging that $P$ is 70% likely to be true.
  3.  **The Constraint:** A measure of inaccuracy should respect the agent's own epistemic perspective. If I believe $P$ is 0.7 likely, then *from my perspective*, the "truth" is most likely found by hedging at 0.7.
  4.  **The Conclusion:** If a scoring rule implies that I would be more accurate reporting 0.9 when I believe 0.7, that rule is telling me that my own judgment of the evidence is an obstacle to accuracy. It creates a conflict between my evidence and the norm of accuracy.

  They claim this isn't pragmatic because it's not about *rewards* or *actions*; it's about the internal consistency of the concept of "accuracy" relative to "evidence." A rule that isn't proper essentially says, "To be accurate, you must ignore your evidence."

  ### 3. Why Your Objection Still Stings
  Despite that defense, many critics (such as Hilary Greaves, David Wallace, and Michael Caie) agree with you. The worry is that the move from "propriety prevents gaming" to "propriety is required for accuracy" relies on a **norm of rationality regarding expectations**.

  If the argument for probabilism relies on the premise "You ought to minimize your *expected* inaccuracy," critics argue you have smuggled in a decision-theoretic norm.
  *   **Pragmatic:** Maximize expected *utility*.
  *   **Alethic:** Minimize expected *inaccuracy*.

  But why should I minimize *expected* inaccuracy? If I care only about *actual* inaccuracy (how wrong I am in the actual world), expected inaccuracy doesn't matter. The dominance theorem works because incoherent credences are dominated in *every* world, but the proof that coherent credences are the *only* ones that aren't dominated relies on the properties of the scoring rule (propriety).

  If propriety is justified by "you should report what you believe," that sounds suspiciously like "you should act on your beliefs," which is pragmatic.

  ### 4. Is there a way out? (The Bregman Divergence)
  There is a technical maneuver some philosophers use to try to bypass the "pragmatic" label. They appeal to **Bregman Divergences**.

  Mathematically, it turns out that the class of strictly proper scoring rules is isomorphic to the class of Bregman divergences (given some regularity conditions). Some argue that Bregman divergences are the *only* natural way to measure "distance" between a point (your credence) and a vertex (the truth value 0 or 1) in a probability space.

  If one can argue that Bregman divergence is the *unique* geometrically natural measure of distance, then propriety falls out as a mathematical theorem rather than a pragmatic constraint. However, this is controversial. Why is Euclidean distance (or generalized entropy distance) the correct measure of "distance from the truth"? That choice itself often presupposes the very probabilistic structure we are trying to vindicate.

  ### 5. Verdict for your Reading Group
  You are not embarrassing yourself; you are articulating the "Justification of Properness" objection.

  *   **If you want to press the point:** Ask the group, "What independent, non-pragmatic argument do we have that a measure of accuracy *must* be strictly proper? If the only reason we reject improper rules is that they incentivize lying, haven't we grounded epistemology in the pragmatics of honesty?"
  *   **The likely counter-argument:** They will argue that an improper rule violates the *nature* of belief. If you believe $P$ to degree $x$, but the measure of accuracy says you'd be closer to the truth reporting $y$, the measure is failing to capture what belief *is*.

  **Summary:**
  You are correct that the historical motivation for propriety is pragmatic (incentive compatibility). The "accuracy-first" program relies on the claim that this pragmatic feature tracks a deeper alethic feature (respecting one's own evidence). Whether that claim succeeds is the main battleground in formal epistemology right now. You've identified the exact seam where the pragmatic and the alethic are stitched together, and many philosophers suspect there's a loose thread there.

  **Recommended Reading if you want to dive deeper:**
  *   **Jim Joyce (2009):** "Accuracy and Coherence: Prospects for an Alethic Epistemology of Partial Belief." (He refines the 1998 argument specifically to address these worries).
  *   **Richard Pettigrew (2016):** *Accuracy and the Laws of Credence.* (The most rigorous defense of the pure alethic line).
  *   **Hilary Greaves (2013):** "Epistemic Decision Theory." (She is more open to admitting pragmatic elements).
  *   **Don Fallis (2007):** "Attitudes Toward Epistemic Risk and the Value of Experiments." (Critiques the reliance on specific scoring rules).

  You're in good company. The transition from "scoring rules for weather" to "scoring rules for rationality" is brilliant, but as you suspected, the cargo it carries from its meteorological origins is heavy.
