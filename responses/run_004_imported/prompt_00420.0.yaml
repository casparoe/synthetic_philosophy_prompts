prompt: |-
  So my team lead started tracking "story points closed per week" as a proxy for whether we're actually being productive, and now everyone's just gaming it -- breaking tickets into tiny pieces, re-opening and re-closing stuff, picking easy wins over the gnarly refactors that actually matter. The dashboard looks great but the codebase is turning into a swamp and nothing hard is getting done. When I brought it up my lead just said "the numbers dont lie." Is there a way to explain whats actually going wrong here, and is there any real fix, or is basically any metric like this doomed to get gamed eventually?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Problem:** The team lead is using "story points closed per week" as a productivity metric.
      *   **Consequence:** The team is gaming the system (splitting tickets, re-opening/closing, picking easy tasks, avoiding hard refactors).
      *   **Result:** Dashboard looks good, but code quality is degrading ("swamp"), and important hard work isn't happening.
      *   **Lead's Stance:** "The numbers don't lie."
      *   **User's Question:** How to explain what's wrong? Is there a fix? Are all metrics doomed?

  2.  **Identify the Core Concepts:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is the theoretical backbone of the situation.
      *   **Velocity vs. Value:** Story points measure *effort/complexity*, not *value delivered*.
      *   **Local Optimization vs. Global Optimization:** Optimizing individual tickets hurts the overall system health.
      *   **Psychological Safety/Trust:** Tracking individuals (implied by "everyone's just gaming it") creates fear and competition rather than collaboration.

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that the user is right. This is a classic anti-pattern. Don't let them feel crazy.
      *   **The "Why" (Goodhart's Law):** Explain the theoretical reason why this fails. Use the specific name so they can research it or drop it in conversation.
      *   **Explaining it to the Lead:** How to talk to someone who says "numbers don't lie"?
          *   Need to speak their language (risk, cost, long-term velocity).
          *   Show the *cost* of the gaming (technical debt, morale, turnover).
          *   Provide counter-examples (the refactor that took 5 days but saved 50 days later).
      *   **Alternative Metrics:** If not story points, then what?
          *   Cycle time (how long does work take?).
          *   Throughput (count of items, not points).
          *   DORA metrics (deployment frequency, change failure rate, etc.).
          *   Qualitative feedback (retrospectives, customer satisfaction).
      *   **The "Are all metrics doomed?" Question:** Nuanced answer. Metrics are tools, not goals. Context matters.
      *   **Actionable Advice:** Steps the user can take *now*.

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Initial thought:* Tell them to quit.
      *   *Correction:* Too extreme. Give them ammo to fight the good fight first. If it doesn't change, *then* consider leaving.
      *   *Tone:* Empathetic, professional, evidence-based. Avoid sounding like I'm bashing the lead personally, but be firm that the *practice* is wrong.
      *   *Key Insight:* Story points were never meant for performance management. They are for *planning*. I need to make sure this distinction is clear.

  5.  **Developing the "Script" for the Lead:**
      *   The lead says "Numbers don't lie."
      *   Counter: "Numbers don't tell the whole truth."
      *   Analogy: Measuring a programmer by lines of code (classic analogy).
      *   Focus on *Value*: "Are we building the right thing?" vs "Are we building the thing fast?"

  6.  **Addressing the "Doomed" Question:**
      *   Yes, *output* metrics get gamed.
      *   *Outcome* metrics are harder to game (e.g., revenue, user retention), but still possible.
      *   The fix isn't no metrics, it's *better* metrics + human judgment.

  7.  **Final Review against User Query:**
      *   Did I explain what's wrong? Yes (Goodhart's Law, Points $\neq$ Value).
      *   Is there a fix? Yes (Change metrics, focus on outcomes).
      *   Are all metrics doomed? Yes/No (Nuanced).

  8.  **Constructing the Output:** (This aligns with the structure of the provided good response.)
      *   Validate frustration.
      *   Name the phenomenon (Goodhart's Law).
      *   Explain why Story Points specifically fail here.
      *   Provide arguments for the Lead.
      *   Suggest better alternatives.
      *   Answer the "doomed" question.
      *   Closing advice on career safety.

  9.  *(Self-Correction during drafting)*: Make sure to emphasize that story points are *relative estimates for planning*, not *absolute units of work*. This is a common misconception among management.

  10. **Final Polish:** Ensure the tone is supportive but realistic. If the lead is entrenched, the culture might be toxic. Warn the user about that possibility.

