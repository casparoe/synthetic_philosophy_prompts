      *   **Core Problem 2 (Bonus):** If a substantivalist adopts "sophisticated substantivalism" (denying haecceities/trans-world identity of points) to escape the Hole Argument, aren't they just relationists in disguise? What's the best defense of sophisticated substantivalism against this collapse?
      *   **Tone:** Professional, precise, pedagogical, acknowledging the user's expertise (they are teaching a seminar) but addressing a specific conceptual gap.

  2.  **Deconstruct Core Problem 1: Locality and Indeterminism:**
      *   *Leibniz Shift:* Global transformation ($\phi: M \to M$). If I shift *everything* (matter + metric + points), the new model $\mathcal{M}'$ is isomorphic to $\mathcal{M}$. For a substantivalist who believes points have independent identity, $\mathcal{M}$ and $\mathcal{M}'$ are distinct. But they are qualitatively identical everywhere. This violates PII or is verificationally idle. It's a *static* redundancy.
      *   *Hole Argument:* Local transformation ($\phi: M \to M$). $\phi$ is identity outside region $H$ (the Hole), but non-identity inside $H$.
      *   *The Setup:* We have initial data on a Cauchy surface $\Sigma$ *outside* the Hole (or in the past of the Hole).
      *   *The Crux:* Because $\phi$ is identity in the past/outside, the initial data on $\Sigma$ is *identical* in both models $\mathcal{M}$ and $\mathcal{M}' = \phi^*\mathcal{M}$. The metric and matter fields match perfectly up to the boundary of the Hole.
      *   *The Divergence:* Inside the Hole, the fields differ (because $\phi$ moves points around inside).
      *   *The Substantivalist Commitment:* If points have independent identity (haecceities), then "Field value $F$ at point $p$" is different from "Field value $F$ at point $\phi(p)$". Since $\phi(p) \neq p$ inside the hole, the physical situation at point $p$ is different in the two models.
      *   *The Result:* Same past (initial data), same laws (Einstein's equations are generally covariant, so if $\mathcal{M}$ is a solution, $\mathcal{M}'$ is too), but different futures (inside the hole). This is radical indeterminism.
      *   *Why Locality Matters:* If the shift were global, the initial data would *also* be shifted. You couldn't say "the past is the same." The past would be shifted too. To get indeterminism, you need the *input* to be fixed while the *output* varies. The "identity outside the hole" condition fixes the input (the past) while allowing the output (the future inside the hole) to vary via the drag-along of the fields.

  3.  **Deconstruct Core Problem 2: Sophisticated Substantivalism vs. Relationism:**
