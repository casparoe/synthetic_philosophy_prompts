          *   Argument 4 (The Killer): Counterfactuals. "The gravitational wave could have passed 5 seconds later." Relationists struggle to make sense of this without a background to hold the place. Sophisticated substantivalists can say the metric field could have been different on the *same* manifold points (modally), even if we identify models via diffeomorphism.
          *   *Recommendation:* Cite Pooley, Saunders, or Maudlin. Maudlin's "Metric Essentialism" is a strong middle ground.

  5.  **Review and Refine:**
