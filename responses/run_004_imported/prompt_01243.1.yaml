      *   *Key Point:* For Locke, "Person" is a *forensic* term. It belongs to the realm of law and justice. You cannot have a legal/moral relation with a non-entity.
      *   *The User's specific point:* "Different sperm-and-egg pairing automatically produces a different 'person'."
      *   *Locke's reply:* Different sperm/egg = different *Man*. Does it = different *Person*? Since Personhood starts with consciousness, and consciousness starts with the specific life, yes, effectively. But the *reason* isn't the biology, it's the discontinuity of consciousness.
      *   *Crucial nuance:* Locke might say the NIP is a category error. We owe duties to *Mankind* (the species), not to specific *Persons* (conscious agents) who are currently hypothetical.

  8.  **Final Polish:** Check against the prompt's requirements.
      *   Reason strictly from Locke's framework? Yes.
      *   Step-by-step reconstruction? Yes.
