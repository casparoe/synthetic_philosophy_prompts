  9.  *(Final check of the "Non-Identity" logic)*: Parfit says we don't harm X because X wouldn't exist. Locke would say: X isn't a "Person" yet. The duty is to God/Natural Law to preserve the species. So the NIP metaphysical puzzle is less relevant to the moral obligation.

  10. **Drafting the response.** (Proceed to generate output based on these thoughts.)
answer: |-
  This is an exceptionally sharp observation. You have correctly identified a tension between Parfit's metaphysical assumptions and Locke's definitions. Parfit's Non-Identity Problem (NIP) relies on a specific notion of numerical identity (often grounded in biological origin) to argue that specific future individuals cannot be harmed. Your teammate suggests Locke's consciousness-based criterion might disrupt this.

  To answer this honestly: **Locke's framework does not solve the Non-Identity Problem in the way your teammate hopes, but it does dissolve the moral force of the problem by shifting the ground of obligation.**

  However, to get there, we have to be rigorous about what Locke actually says in *An Essay Concerning Human Understanding* (Book II, Chapter XXVII) and how it interfaces with his moral theory in the *Second Treatise*. If we reason strictly from Locke's text, here is the step-by-step reconstruction of how he would likely handle your case.

  ### Step 1: Categorizing the "Future Individual"
  The first thing Locke would do is ask: *What kind of thing are we talking about when we say "future generation"?*

  Locke distinguishes three things:
  1.  **Substance:** The underlying soul or material atom. (Locke is agnostic here; he thinks identity doesn't depend on this.)
  2.  **Man:** The biological organism, the human animal. (Identity depends on the continuity of life/organization.)
  3.  **Person:** A thinking, intelligent being with reason and reflection, concerned with happiness and misery. (Identity depends on **consciousness**.)

  In the NIP scenario, we are talking about people who do not exist yet.
  *   **As "Men":** They do not exist. There is no biological life to track.
  *   **As "Persons":** They definitely do not exist. For Locke, a "Person" is a forensic term tied to actual consciousness and memory. You cannot have consciousness before you exist.

  **Locke's Verdict:** Strictly speaking, there are no "persons" in the future. There are only *potential* persons. Therefore, the NIP's claim that "we are not harming *these specific persons*" is technically correct but misleading, because those persons are not yet moral agents or subjects of justice.

  ### Step 2: Testing the "Biological Origin" Assumption
  Your teammate suggests that because Locke ties personhood to consciousness rather than biology, he might not agree that a different sperm-and-egg pairing creates a "different person."

  Here, Locke would likely push back. While Locke defines *personal identity* via consciousness, he acknowledges that consciousness is annexed to a specific life. In *Essay* II.XXVII.10, he writes that consciousness always accompanies thinking, and it is what makes every one be what he calls "self."

  If Policy A leads to Conception X and Policy B leads to Conception Y:
  *   The biological organization (*Man*) is clearly different.
  *   The consciousness (*Person*) arises *from* that specific biological organization (or the substance attached to it).

  Locke does not believe in a "pool of consciousness" that can be poured into different bodies. Consciousness is particular to the thinker. Therefore, the consciousness that arises in Policy A is numerically distinct from the consciousness that arises in Policy B, simply because they are distinct streams of experience with no memory connection between them.

  **Locke's Verdict:** He would agree with Parfit's conclusion (they are different individuals) but for a different reason. It's not because of the sperm/egg *per se*, but because there is no continuity of consciousness between the potential person in Policy A and the potential person in Policy B. They are distinct forensic units.

  ### Step 3: The Forensic Gap (The Core Problem)
  This is where Locke's framework hits a wall regarding the NIP. Locke defines "Person" as a **forensic** term (*Essay* II.XXVII.26). It is a word used for law, accountability, reward, and punishment. A "Person" is someone who can own actions and be held responsible for them.

  The Non-Identity Problem is a problem about *harm* and *rights*.
  *   For Locke, rights and duties belong to the realm of the "Person."
  *   But future beings have no consciousness, so they are not yet "Persons."
  *   You cannot have a forensic relationship (a relationship of justice) with a non-entity.

  If you ask Locke, "Do we owe it to *this specific future person* to conserve resources?" Locke would say the question is malformed. You cannot owe a duty *to* a specific future person, because that person is not a "Person" in the Lockean sense yet. They have no consciousness to which you can relate.

  **Locke's Verdict:** The NIP assumes we are trying to avoid harming specific *victims*. Locke's framework suggests there are no specific victims yet to be harmed. So, in a narrow sense, the NIP holds: you cannot wrong a specific non-existent person.

  ### Step 4: Where the Obligation Comes From (The "Mankind" Shift)
  If Locke agrees we don't owe duties to specific future *Persons*, does that mean we have no duty to conserve resources? **No.** This is where you must look beyond the *Essay* to Locke's *Second Treatise of Government*.

  Locke's moral theory is grounded in Natural Law, which is commanded by God. In the *Second Treatise* (Section 6), Locke states:
  > "Every one, as he is bound to preserve himself, and not to quit his station willfully, so by the like reason, when his own preservation comes not in competition, ought he, as much as he can, to **preserve the rest of mankind**."

  Notice the phrasing: He does not say "preserve specific future persons." He says "preserve **mankind**."

  *   **"Mankind" = The Species (The "Man"):** This refers to the biological continuity of the human organism, the species as a whole.
  *   **"Person" = The Individual Agent:** This refers to the conscious, forensic individual.

  Locke would argue that our obligation is not to the *identity* of the future people (the NIP concern), but to the *existence* of the species. If a resource-depleting policy leads to the collapse of human life, or a life so miserable it violates the Natural Law preservation mandate, it is wrong—not because it harms *Person X* instead of *Person Y*, but because it fails the duty to **preserve Mankind**.

  ### Step 5: Synthesizing the Response
  So, how would Locke respond to your Ethics Bowl case?

  1.  **He would reject the premise that "Personhood" applies to the future.** He would argue that talking about the "identity" of future people is a category error. Identity requires consciousness; future people have none. Therefore, the metaphysical puzzle of whether they are the "same person" is moot.
  2.  **He would agree that different policies create different individuals.** Even though his criterion is consciousness, distinct biological origins produce distinct streams of consciousness. He would not use this to escape moral responsibility, however.
  3.  **He would shift the moral ground.** He would argue the NIP is a distraction. The question isn't "Are we harming *John Doe* in 2100?" The question is "Are we fulfilling our God-given duty to preserve the human species?"

  ### The Honest Gap
  You asked me to be honest if Locke's framework wasn't built for this. Here is the gap:

  Locke's theory of personal identity is **retrospective**. It is designed to explain how *I* am the same person today as I was yesterday, mostly for the sake of accountability (punishment, resurrection, judgment). It is not designed to handle **prospective** identity (who will exist tomorrow).

  Locke assumes the people exist and asks, "Are they the same?" Parfit asks, "Will they exist at all?" Locke's *Essay* doesn't have the tools to analyze the moral status of *possible* people, only *actual* people. He bridges this gap not with his identity theory, but with his Theological Natural Law (duty to God to preserve the species).

  ### Conclusion for Your Team
  If you use Locke in your Ethics Bowl round, do not argue that Locke solves the Non-Identity Problem by claiming future people are the "same person." That contradicts his view on consciousness.

  Instead, argue this:
  **Locke would say the Non-Identity Problem is a red herring.** It focuses too much on the *identity* of specific victims (Personhood). A Lockean approach ignores the identity question and focuses on the *duty to the species* (Mankind). We don't owe conservation to "Future John"; we owe it to God and to the continuation of Human Life. Therefore, the fact that Future John wouldn't exist under a different policy is irrelevant. The policy is wrong because it depletes the resources necessary for *Mankind* to flourish, regardless of *which* specific individuals make up that mankind.

  This allows you to acknowledge Parfit's logical point (yes, they are different people) while rejecting his moral conclusion (therefore, we have no obligation).

  ***

  **Summary for your prep sheet:**
  *   **Locke on Identity:** Future people have no consciousness, so they are not yet "Persons." Identity questions don't apply yet.
  *   **Locke on Biology:** Different conceptions yield different streams of consciousness, so they are distinct individuals.
  *   **Locke on Duty:** Duty is owed to "Mankind" (the species), not specific "Persons."
  *   **Strategy:** Use Locke to bypass the NIP. The obligation is to preserve the conditions for human life, not to protect specific future identities.
