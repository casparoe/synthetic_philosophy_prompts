answer: |-
  It is a pleasure to engage with someone who has not only read the philosophy but has spent a career testing the very physical phenomena that drive the metaphysical debate. Having worked on Bell-inequality tests, you know better than most that the correlations we measure are not merely theoretical curiosities; they are hard empirical constraints on any ontology of the world.

  The debate between Tim Maudlin and Barry Loewer regarding Humean Supervenience (HS) and quantum mechanics is indeed the central fault line in contemporary metaphysics of physics. Maudlin argues that entanglement demonstrates a failure of separability: the physical state of a composite system is not determined by the physical states of its parts assigned to their respective spacetime regions. Loewer, defending the Lewisian picture, proposes that we simply relocate the "Humean Mosaic." If the wavefunction is taken as a concrete field on a $3N$-dimensional configuration space, then the dynamics are local *there*, and supervenience is preserved.

  Your intuition is correct: Loewer's defense is a Pyrrhic victory. While it technically preserves the *logical structure* of Humean Supervenience (local qualities determining global truths), it eviscerates the *empiricist motivation* that gave the thesis its philosophical force. By shifting the fundamental base from four-dimensional spacetime to high-dimensional configuration space, Loewer saves the letter of Lewis's law but kills its spirit.

  Here is the argument for why this maneuver abandons the substantive, recognizably empiricist core of Humean Supervenience.

  ### 1. The Empiricist Core of Lewis's Humean Supervenience

  To see why Loewer's move is costly, we must recall why David Lewis proposed Humean Supervenience in the first place. In *New Work for a Theory of Universals* and subsequent papers, Lewis frames HS not merely as a logical possibility, but as a thesis about the world as we find it.

  HS states that all truths about the world supervene on the spatiotemporal distribution of local intrinsic properties. The crucial phrase is **spatiotemporal**. For Lewis, the "Humean Mosaic" was a mosaic of point-instants in four-dimensional spacetime. This was not an arbitrary choice. It was grounded in a commitment to a reasonable empiricism:
  1.  **Experience is Spacetime-Bound:** Our observations, measurements, and experiences occur in three spatial dimensions and one temporal dimension.
  2.  **Causal Contact:** We interact with the world via causal processes that propagate through spacetime.
  3.  **Naturalism:** Metaphysics should not outrun science, but it should account for the world science describes *as the world we inhabit*.

  Lewis wanted a metaphysics where the fundamental facts were the kinds of facts that could, in principle, be encountered. The "local qualities" were meant to be the categorical bases of the world we perceive. If you remove spacetime as the fundamental arena, you remove the anchor that ties the metaphysics to human experience.

  ### 2. Loewer's Maneuver: Wavefunction Realism

  Loewer's response to Maudlin is to embrace what is now often called "Wavefunction Realism" (championed also by Alyssa Ney). The argument is that the quantum state $\psi$ is a physical field. Since $\psi$ for an $N$-particle system is defined on $\mathbb{R}^{3N}$, the fundamental space of the world is $\mathbb{R}^{3N}$, not $\mathbb{R}^3$.

  In this view, entanglement is not non-local. Two "particles" that appear entangled in 3D space are simply excitations of a field that is local in 3N space. The value of the field at a point in configuration space depends only on the immediate neighborhood in configuration space. Thus, the distribution of local qualities in 3N space determines all truths. Supervenience holds.

  Technically, this is coherent. But metaphysically, it requires a radical revision of what we mean by "the world."

  ### 3. The Pyrrhic Cost

  The victory is Pyrrhic because it preserves supervenience only by sacrificing the three pillars that made HS an empiricist thesis.

  #### A. The Derogation of Spacetime
  For Lewis, spacetime was the fundamental framework of relations. In Loewer's picture, the 3D space of our experience (and your experimental apparatus) becomes derivative. It is no longer the fundamental locus of reality; it is an emergent structure, perhaps defined by a functional role within the 3N dynamics.

  This inverts the empiricist order of explanation. Empiricism traditionally takes the data of experience (detectors clicking in 3D space) as the primary given and constructs theory to explain it. Loewer takes the theoretical formalism (the wavefunction on configuration space) as the primary reality and must then explain why experience *looks* 3D. He preserves the *form* of Humeanism (local qualities on a manifold) but replaces the *manifold of experience* with a *manifold of theory*.

  #### B. The Problem of "Local Beables"
  As a physicist, you are familiar with John Bell's insistence on "local beables"—elements of reality that are assigned to bounded regions of spacetime. Bell argued that without local beables in spacetime, we cannot make sense of measurement outcomes.

  When you ran Bell tests, you aligned polarizers and detectors in a laboratory. The clicks happened *here* and *there*, separated by spacelike intervals. The statistical violation of the inequality told you something about the relations between those spacetime events.
  If Loewer is right, the fundamental facts are not about the clicks in the lab. The fundamental facts are about the amplitude of a field at a point in a $3N$-dimensional space. The "click" in 3D space is a shadow of the fundamental reality.

  This creates a severe epistemic gap. If the fundamental facts are in configuration space, we have no direct empirical access to them. We only access their 3D projections. A metaphysics that posits fundamental facts permanently hidden from direct observation (in principle, not just practically) ceases to be empiricist. It becomes a form of mathematical Platonism disguised as Humeanism.

  #### C. The Loss of Spatiotemporal Relations
  Lewis's HS relied on "spatiotemporal relations" as the glue of the mosaic. These relations have specific structural properties (metric signature, causal cones, etc.) derived from relativity. Configuration space does not share these properties. It is a Euclidean space (typically) with a dimensionality that scales with particle number. It does not have a light-cone structure in the fundamental sense.

  If the fundamental space is not spacetime, then the "spatiotemporal" in "Humean Supervenience on spatiotemporal distribution" loses its meaning. Loewer must argue that 3D spacetime emerges from the 3N dynamics. But until that derivation is robust (and the measurement problem is solved within this framework), the claim that HS holds is based on a bait-and-switch. He has saved supervenience on a *distribution of qualities*, but he has abandoned supervenience on a *spatiotemporal* distribution.

  ### 4. Conclusion: A Victory of Form over Substance

  Loewer's maneuver succeeds in showing that one can construct a model of quantum mechanics where the global state supervenes on local facts. However, it fails to show that *our world* is a Humean world in the sense Lewis intended.

  Lewis wanted a metaphysics that respected the "manifest image" of the world as a container of events in space and time, compatible with the "scientific image." Loewer resolves the tension by discarding the manifest image's ontology entirely. He argues that the 3D world is a useful fiction or a secondary emergence, while the 3N world is the fundamental reality.

  For an experimentalist, this is particularly galling. You know that the constraints on nature are tested in 3D spacetime. The non-locality Maudlin identifies is a feature of how physical influences propagate in the spacetime we inhabit. To say "it is local in configuration space" is mathematically true but metaphysically evasive. It is akin to saying that traffic congestion in London is not really non-local because, in a high-dimensional phase space of all cars in the UK, the state is locally determined. It misses the level of description at which the phenomenon (and the problem) actually exists.

  Therefore, Loewer's defense is a Pyrrhic victory. He saves the thesis of Humean Supervenience from refutation by quantum mechanics, but only by redefining the "Humean Mosaic" so abstractly that it no longer resembles the empiricist foundation Lewis sought to defend. He preserves the logic of Humeanism at the cost of its soul.
