          *   Tim Maudlin: Argues QM (entanglement) refutes HS because the joint state isn't fixed by local states + spatiotemporal relations.
          *   Barry Loewer: Defends HS by moving the mosaic to high-dimensional configuration space (3N dimensions). The wavefunction is a local field *there*.
      *   **Task:** Argue that Loewer's move is a "Pyrrhic victory." It saves HS formally but kills its spirit/empiricist motivation. Specifically, it abandons the idea that 4D spacetime (ordinary experience) is the locus of fundamental facts.

  2.  **Deconstruct the Argument (The "Pyrrhic Victory" Thesis):**
      *   *Premise 1: What is the core appeal of HS?* It's empiricist. It grounds metaphysics in what is observable/experiential. It aligns with the "manifest image" (or at least the scientific image of spacetime). It's about *our* world, the world of tables, chairs, and detectors in labs.
      *   *Premise 2: What does Loewer do?* He shifts the fundamental ontology from 3D/4D spacetime to 3N-dimensional configuration space.
      *   *Premise 3: What is the cost?* Configuration space is not spacetime. It's not where we live. It's not where the detectors are. It's mathematically convenient but metaphysically alien to the empiricist tradition.
      *   *Conclusion:* By saving the *structure* of HS (local qualities supervening on a base), Loewer sacrifices the *content* of HS (that the base is the spacetime world we experience). Therefore, it's a victory in name only.

  3.  **Tailor to the User (Physicist Perspective):**
