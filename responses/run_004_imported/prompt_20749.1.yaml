answer: |-
  The dust in the Basin was not like dust elsewhere. It was fine, grey, and tasted of iron. It settled in the lungs of the children and the creases of the ledgers. Tomas wiped a smear of it from the page he was reading, leaving a clean streak that would be covered again within the hour.

  He was the Archivist, third generation since the Founding. His job was to preserve the memory of how they came to be thirsty.

  Outside the stone walls of the Archive, the wind was picking up, scouring the terraced fields that had once been lush. Now, the irrigation channels were little more than cracked veins in the earth. The water ration was down to half a liter a day per person. The elders spoke of the "Withering," a gradual decline that had started fifty years ago, but Tomas was looking for the moment before the decline. He was looking for the wound.

  He found it in the Council Logs of Year One.

  The entry was brief, written in the bold, confident hand of the First Speaker, Elara Vance. There had been a debate. The surveyors had found two sources. The first was the Deep Aquifer. Tapping it would require slow, laborious drilling. It would yield little water for the first decade. The community would remain small, perhaps two hundred souls. Growth would be agonizingly slow. But the supply would last millennia.

  The second source was the River Diversion. It was risky. It meant damming the seasonal flow and channeling it through silt-heavy beds. It would flood the valley floor immediately. It would allow for rapid agriculture, a population boom, and comfort. But the logs noted the risk: *Siltation and salinization probable within three generations.*

  Vance had chosen the Diversion. *We choose life,* she had written. *We choose to be many.*

  Tomas sat back in his chair. The wood creaked. He felt a familiar heat in his chest, the indignation he had been nursing for months. They had traded his thirst for their comfort. They had stolen water from the future to buy abundance in the past. It was a theft, plain and simple. He had a right to be angry. He had a right to demand restitution, though he knew there was nothing left to give.

  He opened the birth registries. He wanted to find the descendants of Vance. He wanted to look them in the eye.

  He traced the lines. The population had exploded in Year Five. Three hundred births. Then four hundred. The community had swelled to two thousand before the silt choked the channels. Now, they were eight hundred and shrinking.

  Tomas traced his own line back. His mother, Kaelin. His grandfather, Joren. His great-grandmother, Silla.

  Silla was born in Year Six.

  Tomas paused. He looked at the projection for the Deep Aquifer scenario. It was sketched in the margins of the planning documents, a ghost column of numbers. *Projected Population: Year Six, forty souls.*

  In the Aquifer timeline, the community would have been tiny. Struggling, certainly, but sustainable. The work would have been harder, the days shorter. The social rhythm would have been different. There would have been no great harvest festival in Year Five, where the wine flowed freely and the music played until dawn.

  Tomas closed his eyes. He remembered the stories of that festival. It was where his great-grandmother, Silla, had met her husband. The abundance of the Diversion had brought them together. The extra rations had given them the health to conceive. The specific stress of the silt-choked years had driven them to seek comfort in each other at the precise moment Tomas's grandfather was conceived.

  If Vance had chosen the Aquifer...

  If Vance had chosen the slow path, the community would have been a quarter of the size. Silla would not have been born. Even if a woman of her bloodline existed, she would have been a different person, born of different parents, in a different year, under a different moon. She would not have met the man she met. Joren would not have existed. Kaelin would not have existed.

  Tomas would not have existed.

  The heat in his chest cooled, replaced by a strange, hollow vertigo. He gripped the edge of the desk.

  He had assumed that the alternative was *him*, living in a green valley with full cisterns. He had assumed he was the victim of a crime. But the crime victim and the beneficiary were the same person.

  To wish for the Aquifer was to wish for his own erasure.

  He stood up and walked to the window. The sun was setting over the cracked basin, casting long, bruised shadows across the terraces. A group of children was playing near the dry channel, kicking up clouds of the iron dust. They were laughing. They were alive.

  If the Founders had been more virtuous, these children would be ghosts.

  Tomas pressed his forehead against the cool glass. The logic was airtight, yet it felt like a betrayal. How could he honor the memory of Vance? She had condemned them to scarcity. But if she hadn't, *they*—this specific *they*—would not be here to be condemned.

  Was it a gift, then? To be given life, even if that life was hard?

  He thought of his daughter, Mara. She was seven. She had a cough from the dust. He spent half his ration credits on filters for her room. If he complained to the Council, if they somehow found a way to punish the memory of the Founders, to symbolically reject the Diversion... what did that mean?

  It meant saying that Mara's life, with its cough and its rationing, was a mistake. It meant saying that non-existence would have been preferable for her.

  He looked at his hands. They were calloused, stained with ink and dirt. They were real. The hands of the boy who would have lived in the Aquifer timeline—the boy who would have been the son of a different couple in a smaller, greener world—were not real. That boy was a phantom. Tomas could not owe him anything. He could not pay a debt to a ghost.

  And yet.

  He looked out at the horizon. The mountains were bare. The trees were dead. The choice made in Year One had stripped the world of its beauty. It had turned a garden into a mine.

  Tomas realized he was waiting for a feeling that did not come. He wanted forgiveness for the Founders, or he wanted condemnation. He wanted to resolve the equation. But the equation balanced on a point that offered no footing.

  He was the fruit of a poisoned tree. To cut the tree down was to destroy the fruit. To eat the fruit was to swallow the poison.

  A knock came at the door. It was Mara. She held her water cup with both hands.

  "Father?" she said. "The filter is making a noise."

  Tomas turned from the window. He looked at her face, the dust in her eyebrows, the life in her eyes. He thought of the empty space where she would have been if Vance had been wise.

  "I'll come," Tomas said.

  "Are you sad?" she asked. She was perceptive, like her mother.

  Tomas looked at the ledger on the desk. The ink was dry. The choice was stone.

  "No," he said, and he wasn't sure if it was a lie. "I'm just thinking about how we got here."

  "Is it a story?"

  "It's a puzzle," Tomas said. He took her hand. Her skin was warm. "Come on. Let's fix the filter."

  He led her out into the corridor. The dust motes danced in the shafts of light from the high windows, swirling in patterns that shifted with every step they took. If they walked differently, the air would move differently. The dust would settle elsewhere. The future would change, minutely, imperceptibly.

  Tomas walked carefully, trying not to disturb the air, knowing it was impossible, knowing that every step he took was writing a new ledger that someone else would one day read, and wonder why he had chosen to walk at all.
