answer: |-
  This is a fantastic question, and your reaction is extremely common among students who move from qualitative social science or pure theory into the structural causal modeling (SCM) framework. When you see the *do*-calculus work, it feels like magic: you have a graph, you apply the rules, and you get an answer. It feels like the "hard problem" of causation has been engineering-solved.

  However, the short answer is: **You are conflating the *epistemology* of causation (how we know it/calculate it) with the *metaphysics* of causation (what it *is*).**

  Pearl (and Woodward) largely won the battle for **causal inference**. But Lewis and his successors are fighting a different battle regarding **causal ontology**. Philosophers aren't ignoring Pearl; they are asking questions that Pearl explicitly brackets.

  Here is the breakdown of why Lewis-style counterfactuals still matter in philosophy, even in a post-Pearl world.

  ### 1. Inference vs. Truth Conditions
  This is the biggest distinction.
  *   **Pearl (The Engineer):** Pearl provides a **syntax**. He says, " *If* you accept this DAG as a true representation of the data-generating process, *then* here is how you calculate the counterfactual $P(Y_x | Z)$." Pearl is agnostic about whether the arrows in the DAG correspond to real forces in the universe. He treats the SCM as a given input.
  *   **Lewis (The Metaphysician):** Lewis asks, "What makes the statement 'If X had happened, Y would have occurred' **true**?" He is trying to provide **truth conditions**. He wants to know what features of reality ground the validity of the SCM itself.

  **The Econ Analogy:** Pearl gives you the estimator (e.g., 2SLS). Lewis is asking about the identification assumptions (e.g., "Why is this instrument actually exogenous?"). Pearl tells you how to solve the equations; Lewis tries to explain what it means for the equations to be "true" in a world without variables.

  ### 2. The "Input Problem" (Where does the SCM come from?)
  In your seminar, you likely started with a DAG or a system of equations. Pearl's calculus is powerful, but it is conditional on the model being correct.
  *   **The Philosophical Gap:** Pearl does not tell you how to get the DAG from the world. He relies on "scientific knowledge" or "assumptions."
  *   **Lewis's Role:** Philosophers argue that to justify the arrows in the DAG, you need a theory of what causal relations *are*. If causation is just regularity (Hume), the DAG means one thing. If causation is a productive mechanism (Salmon/Dowe), it means another. Lewis's "closest possible worlds" was an attempt to ground the truth of those arrows without relying on circular causal language.

  Philosophers still write about Lewis because we still don't have a consensus on what justifies the structural parameters $\theta$ in your equations, other than "it makes sense theoretically."

  ### 3. The Circularity of Interventionism
  You mentioned Woodward. Woodward's interventionist theory is indeed the dominant view in **philosophy of science** (distinct from metaphysics). It aligns very closely with Pearl.
  *   **The Definition:** $X$ causes $Y$ if an intervention on $X$ changes $Y$.
  *   **The Problem:** How do you define an "intervention"? In Pearl's framework, an intervention ($do(X=x)$) is an exogenous break in the structural equation. But to define "exogenous," you usually need causal language (e.g., "the intervention is not caused by other variables in the system").
  *   **The Philosophical Worry:** Critics argue interventionism is circular. It defines cause using intervention, but intervention is a causal concept. Lewis tried to avoid this by defining counterfactuals using **similarity metrics between worlds** (non-causal terms), hoping to reduce causation to something more fundamental (laws and particular facts). Even if Lewis failed (many think he did), the *project* of non-circular reduction is still alive in metaphysics.

  ### 4. Fundamental Physics and Causal Exclusion
  Economics deals with macroscopic, high-level variables (prices, wages, policy). SCMs work great there.
  *   **The Metaphysical Challenge:** Does causation exist in fundamental physics? In quantum mechanics or general relativity, the "arrow of time" and "structural equations" look very different.
  *   **Lewis's Legacy:** Lewis was trying to fit causation into a Humean mosaic of particular matters of fact. Metaphysicians still debate this because if causation isn't fundamental, then SCMs are just useful fictions (instrumentalism). If causation *is* real (realism), what is it? Pearl's math works regardless, but philosophers want to know if the math maps onto reality or is just a tool for prediction.

  ### 5. Current Consensus: Compatibility, not Rivalry
  To answer your specific question about the consensus:
  *   **In Econ/Stats/CS:** Pearl is the standard. Lewis is rarely cited because they care about identification and estimation, not truth conditions.
  *   **In Philosophy of Science:** **Interventionism (Woodward) is the dominant view.** Most philosophers of science agree with you that Pearl/SCMs are the rigorous formalization of causation we needed. They view Pearl and Woodward as allies.
  *   **In Metaphysics:** Lewis is no longer "defended" in his original 1973 form (everyone admits the similarity metric is vague). However, his **counterfactual framework** is still the language of the debate. Modern metaphysicians aren't saying "Lewis was right and Pearl is wrong." They are asking, "Can we ground Pearl's counterfactuals in a physicalist ontology?"

  ### Summary
  You aren't missing anything about the **utility** of Pearl. For an economist, Pearl *did* win. You can do causal inference without reading Lewis.

  But philosophers aren't writing papers to help you identify $\beta$. They are writing papers to ask:
  1.  What makes your DAG true?
  2.  Is "intervention" a primitive concept or can it be reduced?
  3.  Do counterfactuals require possible worlds to be true?

  Pearl operationalized the counterfactual; Lewis tried to ontologize it. They are playing different games. The "rivalry" you sense is mostly historical; today, serious philosophers of science generally accept the Pearl/Woodward framework but continue to probe its foundations, which is where Lewis's shadow still lingers.

  **Recommendation:** If you want to bridge this gap, look up **Jim Woodward's "Making Things Happen"**. It essentially translates Pearl into philosophy of science language and explains why interventionism is superior to Lewis's original similarity-based account, while acknowledging why the metaphysical questions persist.
