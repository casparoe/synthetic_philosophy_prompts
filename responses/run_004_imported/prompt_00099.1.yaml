      *   *Section 2: Epistemic Conditions (CK vs. Expectations).* Define Lewisian CK. Define Bicchieri's Empirical/Normative expectations. Explain why CK is too demanding for real-world norms but necessary for Lewis's logical proof.
      *   *Section 3: Taxonomy (Subset vs. Distinct).* Discuss Lewis's own intent (anti-reductionism about meaning/obligation). Discuss the "internalization" argument.
      *   *Synthesis/Conclusion:* Summarize the trade-off. Lewis gives logical rigor for a specific class; Bicchieri gives psychological realism for a broader class.

  7.  **Refining the Philosophical Nuance:**
      *   *Caution:* Don't say Lewis is "wrong." Say his project was different (foundations of meaning/language vs. sociology of norms).
      *   *Nuance on Arbitrariness:* Lewis says the *choice* of equilibrium is arbitrary, not necessarily the behavior itself. But Bicchieri points out that for many norms, the behavior isn't arbitrary (fairness is better than unfairness intrinsically to the group).
      *   *Sanctions:* Crucial distinction. Lewis: Natural sanctions (crash). Bicchieri: Social sanctions (shame).

