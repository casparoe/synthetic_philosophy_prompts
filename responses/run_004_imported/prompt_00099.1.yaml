prompt: |-
  I've been working through David Lewis's *Convention* for a graduate seminar, and something's been nagging at me that I want to sort out. Lewis defines a convention as a regularity in behavior that persists because it solves a recurrent coordination problem: there are multiple possible equilibria, everyone prefers to conform if others do, and the actual one that gets selected is arbitrary (his classic examples are which side of the road to drive on, or which channel to call someone back on if a phone call drops). The whole apparatus rests on common knowledge of preferences and rationality, and on the idea that any alternative equilibrium would have worked just as well.

  My study group got into an argument about whether this picture actually captures what we ordinarily mean by "social norm," especially after one of us brought in Cristina Bicchieri's more recent work, where norms are sustained not just by coordinated self-interest but by conditional preferences tied to normative expectations — i.e., people conform partly because they believe others expect them to and would disapprove if they didn't, even in situations that aren't pure coordination problems with interchangeable equilibria (think fairness norms, or norms against queue-jumping, where there's a real mixed-motive structure and unilateral defection is tempting rather than just risky).

  Could you compare Lewis's account of convention with this broader notion of a social norm along these lines? I'm especially interested in: (1) whether Lewis's requirement of arbitrariness among equally good equilibria is doing real work, or whether it's too restrictive to explain norms that involve conflicts of interest rather than pure coordination; (2) how central common knowledge is to each account versus mere normative expectation; and (3) whether Lewis's theory should be read as a special case of a more general theory of norm-emergence, or whether it's actually picking out a genuinely distinct phenomenon that shouldn't be lumped in with norms like fairness or reciprocity at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on David Lewis's *Convention*.
      *   **Core Issue:** Tension between Lewis's definition of convention (coordination problems, arbitrary equilibria, common knowledge) and broader notions of social norms (specifically Cristina Bicchieri's work, involving normative expectations, disapproval, and mixed-motive situations).
      *   **Specific Questions:**
          1.  Is Lewis's "arbitrariness/equally good equilibria" requirement too restrictive for norms involving conflict of interest (e.g., fairness, queue-jumping)?
          2.  How does the role of *common knowledge* (Lewis) compare to *normative expectations* (Bicchieri)?
          3.  Is Lewis's theory a special case of a general norm theory, or a distinct phenomenon?
      *   **Target Audience:** Graduate student (needs philosophical precision, engagement with primary texts, and clear conceptual distinctions).

  2.  **Deconstruct the Theoretical Frameworks:**

      *   **David Lewis (*Convention: A Philosophical Study*, 1969):**
          *   *Foundation:* Game theory (coordination games).
          *   *Key Conditions:* Regularity, common knowledge, preference to conform *if* others conform (conditional preference based on coordination), alternative regularities could have worked (arbitrariness).
          *   *Motivation:* Self-interest/coordination payoff. No intrinsic moral weight.
          *   *Sanctions:* Natural consequences of non-coordination (crash, call doesn't connect), not social sanctions.

      *   **Cristina Bicchieri (*The Grammar of Society*, 2006):**
          *   *Foundation:* Psychology + Game Theory.
          *   *Key Distinction:* Descriptive norms (what others do) vs. Empirical expectations vs. *Normative expectations* (what others think one *ought* to do).
          *   *Motivation:* Conditional preference based on beliefs about others' behavior AND beliefs about others' sanctions/disapproval.
          *   *Scope:* Includes coordination but crucially includes mixed-motive games (Prisoner's Dilemma type structures transformed by norms).
          *   *Sanctions:* Social sanctions (guilt, shame, ostracism).

  3.  **Address Question 1: Arbitrariness and Equilibria (Coordination vs. Mixed-Motive):**
      *   *Lewis:* Requires a coordination problem (e.g., Driving). $A$ and $B$ are equally good. The point is to match.
      *   *Norms (Bicchieri):* Often solve collaboration problems (e.g., Queueing, Fairness). Defecting is individually rational *unless* the norm changes the payoff structure.
      *   *Analysis:* Lewis's "arbitrariness" is indeed restrictive. Queue-jumping isn't arbitrary; there's a moral dimension. However, Lewis might argue queue-jumping *conventions* (like "take a number") are conventional, but the *obligation* not to jump is moral.
      *   *Key Point:* Lewis excludes norms where one equilibrium is intrinsically better or where defection is tempting regardless of others (unless sanctions are applied). Bicchieri includes these because the "norm" transforms the preferences.

  4.  **Address Question 2: Common Knowledge vs. Normative Expectations:**
      *   *Lewis:* Common Knowledge (CK) is infinite recursion ($I$ know that you know that I know...). It's epistemic and logical. It ensures stability of the equilibrium.
      *   *Bicchieri:* Focuses on *Empirical Expectations* (EE) and *Normative Expectations* (NE). CK is often too strong cognitively. People act on beliefs about what others believe they *should* do.
      *   *Analysis:* Lewis needs CK to solve the equilibrium selection problem without communication. Bicchieri needs NE to explain why people follow norms even when coordination isn't the primary payoff (avoiding shame).
      *   *Key Point:* Lewis's CK is about *predicting behavior* to coordinate. Bicchieri's NE is about *anticipating sanctions* to comply.

  5.  **Address Question 3: Special Case vs. Distinct Phenomenon:**
      *   *View A (Reductionist):* Lewis is right; all norms are ultimately conventions rooted in coordination. (Hard to sustain for moral norms).
      *   *View B (Pluralist):* Lewis picked out a specific slice (conventions). Bicchieri covers a broader class (social norms).
      *   *View C (Evolutionary):* Conventions can evolve into norms (internalization).
      *   *Analysis:* Lewis explicitly distinguished conventions from norms (moral/social obligations). He wanted to show how obligation-like behavior arises *without* moral obligation. Bicchieri argues the psychological mechanism is similar but the content differs.
      *   *Conclusion:* It's best to view Lewis as describing a specific *mechanism* of stability (coordination equilibrium) which is a subset of social norms, but Bicchieri captures the *psychological sustainability* of norms that lack pure coordination structures.

  6.  **Drafting the Response (Iterative refinement):**

