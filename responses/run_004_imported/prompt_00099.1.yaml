answer: |-
  This is an excellent tension to identify, and it cuts to the heart of contemporary social ontology. Your study group has hit upon the primary fault line between the **game-theoretic/philosophical tradition** (Lewis, Schelling, Ullmann-Margalit) and the **behavioral/sociological tradition** (Bicchieri, Elster, Young).

  Lewis's project in *Convention* (1969) was largely foundational: he wanted to show how meaning and social order could arise from rational choice without prior agreement or moral obligation. Bicchieri's project (particularly in *The Grammar of Society*, 2006) is more psychological and explanatory: she wants to explain why people follow rules even when it is not immediately in their self-interest to do so.

  Here is a breakdown of the three points you raised, comparing Lewis's account with Bicchieri's broader social norm theory.

  ### 1. Arbitrariness and Equilibria: Coordination vs. Mixed-Motive

  **Lewis's Constraint:**
  For Lewis, a convention *must* solve a recurrent **coordination problem**. This means there are at least two equilibria (e.g., drive left or drive right), and the agents are indifferent between them *provided everyone else does the same*. The "arbitrariness" condition is crucial: if one equilibrium were intrinsically better (e.g., "don't drink poison"), following it wouldn't be a convention; it would be prudence or morality. For Lewis, the normativity of convention is hypothetical: "I ought to drive on the left *if* I want to avoid crashing and *if* everyone else drives on the left."

  **The Bicchieri Critique:**
  Bicchieri argues that many robust social norms solve **mixed-motive problems** (like Prisoner's Dilemmas or Assurance Games), not pure coordination problems.
  *   **Queue-jumping:** In a pure Lewisian coordination game, I only care about matching you. In a queue, I have an incentive to defect (jump) to save time, even if you wait. This is not a coordination equilibrium; it is a temptation to defect.
  *   **Fairness:** Dividing resources equally is often not an "arbitrary" equilibrium. One split might be objectively fairer than another.

  **Is Lewis too restrictive?**
  Yes, if the goal is to explain *all* social norms. Lewis's requirement of "equally good equilibria" excludes norms that involve self-sacrifice or the suppression of temptation.
  *   **Bicchieri's Solution:** She introduces the idea that norms **transform preferences**. A social norm exists when individuals have a *conditional preference* to conform. I prefer to wait in line *on the condition that* I believe others expect me to and will sanction me if I don't.
  *   **The Verdict:** Lewis captures **coordination conventions** (language, driving, currency). Bicchieri captures **social norms** (fairness, reciprocity, hygiene). Lewis's arbitrariness condition does real work in isolating conventions from moral rules, but it renders his theory incapable of explaining norms that require overcoming a dominant strategy of defection.

  ### 2. Common Knowledge vs. Normative Expectations

  **Lewis: Common Knowledge (CK)**
  Lewis relies on a strong epistemic condition: **Common Knowledge**.
  *   $A$ knows $R$ (the regularity).
  *   $A$ knows that $B$ knows $R$.
  *   $A$ knows that $B$ knows that $A$ knows $R$... *ad infinitum*.
  *   **Function:** CK is the logical glue that stabilizes the equilibrium. Without it, I might drive on the left, but if I suspect you don't *know* that I know we usually drive on the left, I might swerve to the right to be safe. CK ensures that the expectation of conformity is self-reinforcing without communication.

  **Bicchieri: Empirical and Normative Expectations**
  Bicchieri finds CK cognitively unrealistic for most human interactions. She replaces it with two distinct belief states:
  1.  **Empirical Expectations:** I believe most people *do* conform (descriptive).
  2.  **Normative Expectations:** I believe most people *expect me to* conform and are prepared to sanction me if I don't (prescriptive).

  **The Comparison:**
  *   **Epistemic Load:** Lewis's CK is a logical idealization. It explains how rational agents *could* coordinate, but psychological evidence suggests humans rarely operate with infinite recursive knowledge. Bicchieri's expectations are empirically measurable and psychologically plausible.
  *   **Motivation:** For Lewis, CK motivates me because it assures me that *coordination will succeed*. For Bicchieri, Normative Expectations motivate me because they assure me that *sanctions will occur* (or that I will feel shame).
  *   **The Shift:** Lewis's model is about **predicting behavior** to maximize payoff. Bicchieri's model is about **anticipating judgment** to avoid social cost. This is why Bicchieri can explain norms in mixed-motive games: the "payoff" includes the cost of social disapproval, which Lewis's naturalistic sanctions (crashing, call dropping) do not account for.

  ### 3. Special Case vs. Distinct Phenomenon

  This is the deepest philosophical question: **Is a convention just a weak social norm, or is it a different species entirely?**

  **Argument for "Special Case" (The Continuum View):**
  Many evolutionary game theorists (like Ken Binmore or H. Peyton Young) argue that Lewisian conventions are the seedbed for social norms.
  *   A coordination convention (driving on the left) can become internalized over time.
  *   Once internalized, violating it causes guilt, not just fear of crashing.
  *   On this view, Lewis describes the *emergence* of the regularity, while Bicchieri describes the *psychological maintenance* of it once it has become entrenched. Lewis's theory is the "skeleton," and Bicchieri adds the "flesh" of psychological motivation.

  **Argument for "Distinct Phenomenon" (The Lewisian View):**
  Lewis would likely resist the lumping. His project was partly to **debunk** the idea that social order requires implicit moral contracts.
  *   **Normativity:** Lewis wants to show that conventions have a "ought," but it is a purely prudential "ought." Bicchieri's norms involve a genuine normative "ought" (social obligation).
  *   **Arbitrariness:** If you lump them together, you lose the ability to distinguish between "drive on the left" (could be right) and "don't steal" (couldn't be 'steal').
  *   **Sanctions:** In Lewis's world, the sanction for breaking a convention is natural (you crash). In Bicchieri's world, the sanction is social (you are shamed). Lewis explicitly excludes social sanctions from his definition of convention to keep the account grounded in individual rationality.

  **Synthesis:**
  It is most productive to read Lewis as providing a **necessary condition for a specific subclass of norms** (coordination conventions), while Bicchieri provides a **sufficient condition for the broader class of social norms**.

  *   **Lewis** explains how order arises from chaos without morality.
  *   **Bicchieri** explains how morality (or normativity) arises from order.

  ### Summary for Your Seminar

  If you need to synthesize this for your group, here is the takeaway:

  1.  **On Arbitrariness:** Lewis is right that *conventions* require arbitrary equilibria, but wrong (or incomplete) if he claims this covers all *social norms*. Bicchieri shows that norms often function by changing the payoff structure of non-coordination games, making conformity rational where it otherwise wouldn't be.
  2.  **On Knowledge:** Lewis's Common Knowledge is a logical tool for equilibrium selection; Bicchieri's Normative Expectations are psychological mechanisms for compliance. You can have a Lewisian convention without Bicchieri's normative expectations (e.g., driving on the left doesn't require shame, just fear of death), but you cannot have a Bicchieri-style social norm without empirical expectations.
  3.  **On Taxonomy:** Lewis's theory is best read as a **limiting case**. It describes the "floor" of social interaction (pure coordination). Bicchieri describes the "ceiling" (internalized obligation). Lumping them together risks losing the distinction between *prudential regularity* and *social obligation*, but keeping them entirely separate ignores how conventions often harden into norms over time.

  **Suggested Reading to Bridge the Gap:**
  If your seminar wants to push further, look at **Margaret Gilbert's *On Social Facts* (1989)**. She critiques Lewis directly, arguing that conventions require a "joint commitment" rather than just common knowledge of preferences. This offers a middle ground: it retains the rational choice framework but introduces the normative "glue" that Lewis tries to avoid and Bicchieri explains psychologically.
