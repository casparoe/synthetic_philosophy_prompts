      *   Did I answer (2) Common Knowledge vs. Expectations? Yes.
      *   Did I answer (3) Special case vs. Distinct? Yes.
      *   Tone: Graduate level, respectful, analytical.

  9.  **Final Polish:** Check citations (Lewis 1969, Bicchieri 2006/2016). Ensure clear headings. (Self-correction: Make sure to mention that Lewis was aware of the distinction and arguably *wanted* to separate convention from moral norm).

  *(Self-Correction during drafting)*: I should be careful not to conflate Bicchieri's "social norms" with "moral norms." Bicchieri distinguishes them, but her account covers both under the umbrella of conditional preferences. Lewis wants to exclude moral obligation entirely. I need to highlight that Lewis's project was partly to show how *meaning* could arise without prior agreement, hence the strict coordination focus. Bicchieri is more interested in behavioral change.

