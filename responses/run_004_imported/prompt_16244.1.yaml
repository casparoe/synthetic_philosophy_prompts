answer: |-
  Good morning. Welcome.

  For those I haven't met yet, I write about consciousness research for *[Magazine Name]*. I am not a principal investigator here. I am not a funder. I am an observer of how science gets made, particularly when the subject matter is as elusive as subjective experience.

  Looking around this room, I know the demographics. On one side, we have the architects and defenders of Integrated Information Theory. On the other, we have several signatories of the 2023 open letter that critiqued the theory. And in the middle, we have funders and neuroscientists who may have heard whispers of that controversy but haven't lived through the fallout.

  To the IIT team: I know some of you feel that the open letter was an ambush, a public relations move that prejudiced the field against your work before the data could speak. To the signatories: I know you feel that IIT has occupied a disproportionate amount of intellectual real estate and funding without meeting standard burdens of proof.

  I am not here to adjudicate whether the word "pseudoscience" was accurate. That label is now part of the history, but it is not the science. If we spend today debating the semantics of that letter, we will have failed. We are here because that conflict revealed something more important than hurt feelings. It revealed a fundamental disagreement about what counts as evidence in the science of consciousness.

  This is not a turf war. It is an epistemological clash. And to understand why, I want to talk about one specific technical concept: the **Exclusion Postulate**.

  For our funders and colleagues new to IIT, this requires a brief translation. Most neuroscientific theories look for correlates of consciousness. They ask: "When a person reports seeing a face, which neurons fire?" They assume consciousness scales with complexity or activity.

  IIT does something different. It starts from the nature of experience itself and derives physical requirements. One of those requirements is the Exclusion Postulate. Simply put, it states that consciousness exists only at the specific spatial and temporal scale where integrated information—Phi—is *maximized*.

  Imagine a photograph. You can look at the individual silver grains, or you can look at the whole image. The Exclusion Postulate says consciousness doesn't exist at the level of the grains, and it doesn't exist at the level of the album holding the photo. It exists *only* at the level of the image itself, where the information is most unified. If you measure at the wrong scale, you will not find consciousness, even if the system is active.

  Now, listen to how this single postulate divides this room.

  For IIT proponents, this is a precise, testable prediction. It tells us exactly where to look. It says, "Do not look for consciousness in individual neurons, and do not look for it in broad behavioral outputs. Look for the specific mechanism with maximum Phi." To them, the Exclusion Postulate protects the theory from being disproven by data collected at the *wrong scale*.

  For the critics in this room, however, this looks like a shield against falsification. They argue that if a theory dictates that evidence found at the neuronal level doesn't count because you were looking at the "wrong grain," the theory becomes insulated from empirical reality. They worry that Exclusion allows IIT to dismiss counter-evidence by simply redefining the scale of analysis.

  Do you see the impasse?

  One side sees a necessary refinement of *where* consciousness lives. The other sees a methodological move that makes the theory impossible to disprove.

  This is why the open letter happened. It wasn't just about ego. It was a reaction to the fear that IIT's internal logic—specifically postulates like Exclusion—disconnects it from standard empirical verification. And it is why the IIT team feels misunderstood. They believe they are being judged by the rules of correlation when they are proposing a theory of causation.

  This is the genuine scientific disagreement we need to hash out. Not whether someone was rude, but whether the Exclusion Postulate is a profound insight into the grain of reality or a barrier to scientific testing.

  To our funders: This is why your role is critical. This is not a debate that will be settled by citation counts or Twitter threads. It will be settled by designing experiments that specifically target the Exclusion Postulate. Can we measure Phi at different scales simultaneously? Can we identify the "maximum" scale in a biological system? If we can, the critics get their testability. If we cannot, the proponents must refine their physics.

  We have the privilege of having the architects of the theory and their sharpest critics in the same physical space. The Exclusion Postulate tells us that consciousness cannot exist at two overlapping scales at once. Let us hope our discourse can be more integrated than that.

  We have work to do. Let's begin.
