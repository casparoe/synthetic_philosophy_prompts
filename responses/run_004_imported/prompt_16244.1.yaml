prompt: |-
  I cover consciousness research for a science magazine, and I've been asked to give the opening remarks — no more than seven minutes — at a small, invitation-only workshop that will, for the first time, put Integrated Information Theory (IIT) researchers in the same room as several signatories of the 2023 open letter that branded the theory "pseudoscience." Half the room still feels ambushed by that letter; the other half thinks IIT finally got the scrutiny it had coming. A few funders and uncommitted neuroscientists, who know little of this history, will also be present. Please write these opening remarks. They need to do more than plead for civility: they should use IIT's exclusion postulate specifically, explained in terms the funders could follow, to show why this is a genuine disagreement about what would even count as evidence for a theory of consciousness rather than a turf war — and the remarks themselves must not take a side on whether "pseudoscience" was the right word.
reasoning: |-
  Here's a thinking process that leads to the suggested opening remarks:

  1.  **Analyze the Request:**
      *   **Role:** Science magazine journalist covering consciousness research.
      *   **Task:** Write opening remarks for a workshop.
      *   **Duration:** No more than 7 minutes (approx. 900-1000 words spoken at a normal pace).
      *   **Audience:**
          *   Group A: IIT researchers (feel ambushed by the "pseudoscience" letter).
          *   Group B: Signatories of the 2023 open letter (think IIT needed scrutiny).
          *   Group C: Funders and uncommitted neuroscientists (unaware of the drama).
      *   **Key Constraint 1:** Do not take a side on whether "pseudoscience" was the right word.
      *   **Key Constraint 2:** Go beyond pleading for civility.
      *   **Key Content:** Use IIT's *exclusion postulate* specifically to illustrate the core disagreement about what counts as evidence.
      *   **Tone:** Professional, insightful, bridging, scientifically rigorous but accessible to funders.

  2.  **Deconstruct the Core Conflict:**
      *   The conflict isn't just personal; it's methodological.
      *   IIT starts from phenomenology (axioms) and derives physical postulates.
      *   Critics often start from neuroscience/behavior and look for correlates.
      *   The *Exclusion Postulate* is a perfect pivot point. It states that consciousness exists at the level of the mechanism that has *maximum* integrated information (Phi), excluding overlapping levels (like neurons vs. synapses vs. brain regions).
      *   *Why this matters for the disagreement:* Critics say this makes IIT unfalsifiable or metaphysical. Proponents say it's a necessary prediction about the *scale* of consciousness.
      *   *Goal:* Show that the fight is about *definition of evidence*, not just ego.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1 minute):** Welcome everyone. Acknowledge the tension without inflaming it. Set the stage (first time these groups are together). Acknowledge the funders/newcomers.
      *   **The Elephant in the Room (1.5 minutes):** Address the 2023 letter. Do not validate or invalidate the term "pseudoscience." Instead, frame it as a symptom of a deeper methodological rift.
      *   **The Core Scientific Disagreement (3 minutes):** This is the meat. Introduce the Exclusion Postulate.
          *   *Explanation:* Keep it simple for funders. It's about "where" consciousness lives in the hierarchy of structure.
          *   *The Clash:* One side sees this as a testable prediction about scale. The other sees it as moving the goalposts or insulating the theory.
          *   *The Point:* This shows it's not a turf war; it's a clash of epistemologies (what counts as proof).
      *   **The Path Forward (1.5 minutes):** What do we do here? We test the postulates. We look for the evidence.
      *   **Conclusion (0.5 minutes):** Reiterate the goal. Thank the funders. Open the floor.

  4.  **Drafting - Refining the Exclusion Postulate Explanation:**
      *   *Challenge:* How to explain Exclusion to a funder in 30 seconds?
      *   *Analogy:* A photograph. Is the image in the pixels, the paper, or the whole photo? IIT says it's only at the specific level where the information integration is highest.
      *   *Connection to Evidence:* If you look for consciousness at the wrong level (e.g., individual neurons), IIT says you won't find it, even if activity is there. Critics say: "Then how do we ever prove you wrong?" IIT says: "Measure Phi at the right scale."
      *   *Framing:* This isn't stubbornness; it's a disagreement on *where to look*.

  5.  **Drafting - Tone Check:**
      *   *Avoid:* "Let's all hold hands." (Too soft).
      *   *Avoid:* "IIT is right/wrong." (Violates constraint).
      *   *Avoid:* "The letter was mean." (Too personal).
      *   *Aim:* "We are here because the stakes are high, and the definitions matter."

  6.  **Writing - Iteration 1 (Mental Outline):**
      Welcome. It's hot in here. The letter happened. Some mad, some glad. But look at the Exclusion Postulate. It says consciousness is at one specific scale. Critics say that's vague. IIT says it's precise. This shows we disagree on evidence, not just feelings. Funders, this is where your money goes. Let's talk.

  7.  **Writing - Iteration 2 (Fleshing out and timing):**
      (Self-Correction during drafting): Make sure I don't sound like I'm defending IIT too much by explaining the postulate. I need to explain *why it causes friction*. The friction is that Exclusion makes empirical testing hard for outsiders. That's the crux.

      *Word Count Check:* 7 minutes is roughly 900-1000 words. I need to be concise.

      *Key Phrase:* "Epistemological clash." "Criteria for evidence."

  8.  **Final Polish:**
      *   Check the "pseudoscience" constraint. I must mention the letter but not judge the label.
      *   Ensure the Exclusion Postulate is clear.
      *   Ensure the funders feel addressed (why this matters for investment).

      *(Self-Correction on Exclusion Postulate)*: Be careful. The Exclusion Postulate says that among overlapping systems, only the one with maximum Phi exists phenomenally. Critics argue this allows IIT to dismiss counter-evidence by saying "you looked at the wrong grain." I need to present this neutrally.

  9.  **Final Review against constraints:**
      *   < 7 mins? Yes.
      *   No side on "pseudoscience"? Yes.
      *   Use Exclusion Postulate? Yes.
      *   Explain for funders? Yes.
      *   Address the tension? Yes.

