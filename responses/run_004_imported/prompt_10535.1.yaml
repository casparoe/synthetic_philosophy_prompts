answer: |-
  Good morning. For those who don't know me, I'm Mira's grandfather. For most of my life, I ran a hardware store. I know the difference between a Phillips and a flathead, I know how to mix paint, and I know that if you try to drive a screw without a pilot hole, you're going to split the wood.

  I mention that because I never went to college. I don't speak the language of academia. But I do know something about tools, and I know something about how people learn to use them.

  When Mira was ten, before she came here, she was miserable. School was a place where she went to be quiet, to sit still, to fill in bubbles on a page. She came home empty. Then she came here, and slowly, she started coming home full. She'd talk about things I'd never heard of. Last week, she held me at the garden gate for twenty minutes explaining soil chemistry. Now, I sell fertilizer bags, but I never knew what was inside them until she told me.

  I'll admit, there were times I wondered, just like some of you in the back might have. I'd look at her desk and see no worksheets, no red ink, no grades. In my world, if you don't measure twice, you cut once. Where was the measuring?

  Then a teacher here lent me a book by a mathematician named Alfred North Whitehead. He wrote about the rhythm of learning. He said there are three beats.

  The first is **Romance**. That's the spark. It's when a subject grabs you by the collar before you even know its name. It's Mira falling in love with the idea of growing things.
  The second is **Precision**. That's the hard work. It's the rules, the formulas, the drilling. It's learning exactly how much nitrogen goes in the soil.
  The third is **Generalization**. That's when the rules sink into your bones, and you can just build.

  Whitehead argued that most schools try to force Precision on children before they've ever felt the Romance. They make you memorize the periodic table before you've ever wondered what the world is made of. He said that leaves you with "inert ideas"—facts you carry around like heavy stones in your pockets, things you know but never use.

  Looking at these seven graduates, I think I see what happens when you let the rhythm play out in the right order.

  To the families and friends who worried about rigor: I understand that. We live in a world that loves a transcript. It's hard to trust a process you can't measure on a spreadsheet. But I'm telling you, the Precision *did* happen. It just happened because they needed it, not because they were told to do it. When you need to know the chemistry to save your tomato plants, you learn the chemistry. And you don't forget it. That isn't a lack of standards; that is standards arriving on a human schedule.

  And to the seven of you sitting there, trying to decide if this is going to be a boring speech: I'm almost done. But I want to say this about where you stand right now.

  You are leaving this place in the stage of Generalization. You have the Romance—you know why you care about the world. You have the Precision—you've done the hard work to understand how it works. Now, you get to use it.

  But here is the warning, from an old man who has seen a lot of people burn out: The world outside these walls is going to try to sell you a lot of inert ideas. It will try to make you choose between being curious and being competent. It will tell you that learning is something you finish, like a degree, rather than something you do, like breathing.

  Don't buy it.

  When you hit a wall in your life—and you will—don't just grind against it. Step back. Find the Romance again. Ask yourself why you wanted to do this in the first place. Then, go do the hard work of Precision. Don't be afraid of the details. But never let the details kill the wonder.

  Mira and her classmates aren't just graduating from a school. They are graduating from a way of learning that trusts them. My hope for you is that you never stop trusting it, either.

  You know how to measure. You know how to build. And most importantly, you know why you're building.

  Go split some wood. Thank you.
