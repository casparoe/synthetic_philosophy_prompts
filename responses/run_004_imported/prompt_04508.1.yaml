      *   *Advice for the Novel:* How to write him? He shouldn't sound mystical or dreamy. He should sound like he's working a math problem. Frustrated by ambiguity. Confident in the system.
      *   *Recommended Reading:* Mention Keynes ("Newton the Man"), Betty Jo Teeter Dobbs, Stephen Snobelen.

  5.  **Refining the Tone:**
