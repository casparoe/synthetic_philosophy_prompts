answer: |-
  This is one of the most fascinating hinge-points in intellectual history, and your instinct is spot-on: that passage reads like a madman's rambling to a modern eye, but to Newton, it was as rigorous as the *Principia*.

  To answer your core question directly: **No, this is not a separate person.** There is a profound, unbroken continuity of method between the Newton who derived universal gravitation and the Newton who decoded the Book of Daniel. In fact, understanding this continuity is the key to writing his voice correctly in the 1690s.

  Here is the breakdown of what is happening in his mind, based on the current scholarship (Keynes, Dobbs, Snobelen, etc.), and how you can translate that into character texture.

  ### 1. The Unity of Truth (The Two Books)
  Newton operated under a fundamental theological axiom: God is the author of both the **Book of Nature** (the physical universe) and the **Book of Scripture** (Revelation/Prophecy).

  Since God is rational, orderly, and consistent, He would not write one book in the language of mathematics and law, and the other in the language of vague, fuzzy metaphor. If the physical universe operates on fixed, discoverable laws, the prophetic language *must* also operate on fixed, discoverable laws.

  When Newton writes that "the Sun is put for the whole species and race of Kings," he is not offering a poetic interpretation. He is defining a **variable**. He is establishing an axiom. In his mind, he has used induction (comparing hundreds of scriptural passages) to derive the "Law of Prophetic Motion." He believes he has cracked the cipher.

  **For the novel:** When he writes these passages, he shouldn't feel mystical or inspired. He should feel like he is solving a geometry problem. There is no "faith" in the emotional sense; there is only the satisfaction of a equation balancing.

  ### 2. Prophecy as Cryptography
  In the 1690s, Newton views prophecy as a **cryptogram** designed by God.
  *   **The Purpose:** God hid the truth in figurative language so that it would remain sealed until the "End Times" (which Newton believed were approaching in his own lifetime).
  *   **The Key:** The "key" to the cipher is historical analogy. By matching biblical symbols to historical events (e.g., the rise of Rome, the fall of Babylon), Newton believes he can calibrate the code.
  *   **The Goal:** Once the code is cracked, you can predict the future. But more importantly for Newton in the 1690s, you can audit the past.

  **Why this matters for your plot:** Newton isn't just predicting the Apocalypse. He is using this "code" to prove that the doctrine of the Trinity was a later corruption. He believes the "Little Horn" in Daniel represents the Athanasian Church (the mainstream Trinitarian church). Decoding the prophecy is his way of proving that *he* is right and the Church of England is heretical. This is why he is so secretive; if caught, he loses his position at Trinity.

  ### 3. Empiricism Applied to Text
  The method in the passage you quoted is essentially empirical.
  1.  **Observation:** Collect all instances of "Sun" in prophecy.
  2.  **Hypothesis:** In every case, does it refer to a sovereign power?
  3.  **Conclusion:** Yes. Therefore, Sun = Sovereign Power is a law.

  He treats the Bible like a dataset. He is frustrated by ambiguity. When earlier commentators said, "This symbol might mean X or maybe Y," Newton hated that. He wanted **precision**. The flat confidence you noticed comes from his belief that he has eliminated the error bars.

  **For the novel:** Have him react to ambiguous theological arguments with the same irritation he would show a student who messed up a calculation. "It is not thus," should be a common refrain. He isn't preaching; he is correcting errors in the record.

  ### 4. The *Prisca Sapientia* (Ancient Wisdom)
  Newton believed in a concept common among alchemists and certain theologians of the time: the *Prisca Sapientia*. This is the idea that the ancient world (Noah, Solomon, the Egyptians) possessed a perfect knowledge of natural philosophy and true religion. Over time, this knowledge was corrupted (by the Greeks, by the Papacy, by the Trinitarians).

  *   **Physics:** He believed he was *rediscovering* the ancient wisdom of nature, not inventing new things.
  *   **Theology:** He believed he was *restoring* the pure monotheism of the early Church, stripping away the "corruption" of the Trinity.

  In the 1690s, he is holed up in Trinity not just to hide, but to reconstruct this lost ancient system. The alchemy, the physics, and the prophecy are all parts of the same restoration project.

  ### 5. Character Voice & Texture Suggestions
  To capture the 1690s Newton in your novel, consider these nuances:

  *   **Tone:** Cold, forensic, intense. He is not a dreamy mystic; he is a prosecutor building a case against the corruption of the ages.
  *   **Vocabulary:** He uses legal and mathematical terms for theology. "Demonstration," "Proof," "Corollary," "Testimony," "Evidence."
  *   **The Stakes:** To him, getting the prophecy wrong isn't just a theological error; it's a failure of reason. It implies God is inconsistent.
  *   **Paranoia:** In the 1690s, he is increasingly paranoid. He knows his Arian views are treasonous. He writes in code himself. He trusts almost no one (except perhaps a select few like John Locke or William Whiston, though even then, cautiously).
  *   **The "Weirdness":** Don't play the alchemy/theology as "magic." Play it as **hard science that we now know is wrong.** He treats a vial of mercury or a verse from Daniel with the same ontological weight. They are both data points from God.

  ### Recommended Reading for Texture
  If you want to get the rhythm of his thought process without wading through thousands of pages of manuscripts:
  *   **"Newton the Man" by John Maynard Keynes:** This is the famous speech where Keynes, who bought Newton's papers, reveals the "magician" Newton. It's short and captures the shift in perception perfectly.
  *   **The Janus Face of Genius (Betty Jo Teeter Dobbs):** Excellent on how his alchemy and physics are linked.
  *   **Isaac Newton on Biblical Prophecy (Stephen Snobelen):** Snobelen is the leading scholar on Newton's theology right now. His essays will give you the specific 1690s context regarding the *Observations*.

  ### Summary
  The passage you found is Newton doing **science on the Bible.** He believes he has isolated the constants of the spiritual universe. When he writes "Sun = Kings," he means it with the same absolute certainty as $F = G \frac{m_1 m_2}{r^2}$.

  For your character, the tragedy and the drive come from the fact that he sees the world as a single, unified, intelligible system. The fact that the Church doesn't see it, and that the "laws" of prophecy point to the Church's own destruction, is what keeps him up at night in those Trinity rooms. He isn't hiding because he's guilty; he's hiding because the world isn't ready for the data.
