      *   *The Link:* Trade implies a difference of opinion on value. If I sell and you buy, I think Price < Value, you think Price > Value.
      *   *The "Guise":* "Agreeing to trade" means we both know we have different valuations and we both want to act on them. Aumann says if we *know* we have different valuations (posteriors), we shouldn't (given common prior).
