  2.  **Part 1: The Role of Common Knowledge of Rationality (CKR)**
      *   *Initial thought:* Individual rationality means I won't take a bet I expect to lose. CKR means I know *you* won't take a bet *you* expect to lose, and you know I know that, etc.
      *   *The "Gut-Level" Analogy:* Think of a poker game. If I raise, I think I have a good hand. If you call, you think you can beat me. But if we both know the other is a perfect logician, my raise signals strength. Your call signals even *more* strength (because you're willing to face my strength). My re-raise signals *even more* strength. This iterates until the bet dissolves.
      *   *Key Insight:* Without CKR, I might think, "I have info, you don't, I'll trade with you." With CKR, I must think, "I have info, but the fact that *you* are willing to trade with *me* means *you* have info that counters mine."
      *   *Why CKR specifically?* If I am rational but think *you* might be irrational (or noise trading), I will trade with you. I expect to profit from your mistake. CKR removes the possibility of exploiting a "mistake" because a rational agent doesn't make systematic mistakes against a common prior. It creates an infinite regress of inference: "I know that you know that I know..." which forces the information sets to align.

  3.  **Part 2: Connection to Aumann's Agreement Theorem**
      *   *Aumann's Theorem:* Common prior + Common knowledge of posteriors $\rightarrow$ Posteriors must be equal. You can't agree to disagree.
