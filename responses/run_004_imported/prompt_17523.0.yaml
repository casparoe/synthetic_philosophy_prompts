answer: |-
  **MEMORANDUM**

  **TO:** Incident Review Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Causal Classification for Incident Report #24-B (Cold Storage Fire)

  **1. Executive Summary**

  This memo addresses the outstanding disagreement regarding the classification of "failure to perform the scheduled monthly filter check" in the final report for Incident #24-B. The Facilities Director has raised a principled objection: if we classify this omission as a *cause*, we risk an infinite regress where any counterfactual condition (e.g., lack of auto-shutoff hardware, regulatory minimums) must also be listed, rendering the concept of "cause" useless for remediation.

  After reviewing the theoretical and practical implications, **I recommend we list the missed filter check as a Root Cause.** However, to address the Director's valid concern about causal proliferation, we must explicitly adopt a **Normative Expectation Framework** in our reporting methodology. We cannot rely on counterfactual dependence alone. We must distinguish between *deviations from an established operational baseline* (causes) and *background conditions* (non-causes).

  This memo outlines the reasoning for this distinction and provides the specific language required to defend the report against the "overgeneration" objection.

  **2. The Problem with Pure Counterfactuals**

  The Facilities Director is correct that if we rely solely on counterfactual dependence (the "but-for" test), the list of causes becomes unmanageable. This is a known problem in the philosophy of causation, often associated with David Lewis's theories.
  *   *But for* the missed check, the fire would not have happened.
  *   *But for* the lack of an auto-shutoff, the fire would not have happened.
  *   *But for* the county not requiring a shutoff, the fire would not have happened.

  If "cause" simply means "a necessary condition for the event," then the Director is right: the technician's omission is no more causal than the county's zoning laws. If we accept this definition, the report loses its utility for assigning accountability and preventing recurrence. We cannot fix the county's laws or the manufacturer's design specs in the same way we can fix our maintenance protocol.

  **3. The Solution: Causal Selection via Normative Baselines**

  To resolve this, we must move from *causal dependence* to *causal selection*. In safety science and legal theory (following Hart and Honoré), an omission is treated as a cause only when it represents a **deviation from a relevant norm or duty**, whereas other necessary conditions are treated as mere **background conditions**.

  We can answer the Director's specific examples using this framework:

  *   **The Missed Filter Check (Cause):** There is an established, positive duty. The maintenance schedule creates a normative expectation that the check *will* occur. The omission is a deviation from the "normal" or "expected" course of events within our control.
  *   **The Lack of Auto-Shutoff (Background Condition):** The equipment was purchased to meet existing code. There was no internal or external norm requiring *more* than code compliance at the time of purchase. The absence of the shutoff is the static state of affairs, not a deviation from an active duty.
  *   **The Director's Random Check (Background Condition):** While a random check *could* have prevented the fire, there is no established duty or schedule requiring the Director to perform it. Therefore, her not doing so is not a deviation from a norm; it is consistent with the expected operational baseline.

  **4. Recommendation**

  We should not relegate the missed check to a "non-causal contributing factor" category. Doing so suggests the event would have happened anyway, which contradicts the evidence that the check would have caught the clog. It also dilutes the accountability necessary for safety culture.

  Instead, I propose we adopt the following **Causal Inclusion Criteria** for this and future reports:

  1.  **Counterfactual Sensitivity:** The factor must be a necessary condition for the incident (the "but-for" test).
  2.  **Normative Deviation:** The factor must represent a failure to meet an existing, defined duty, protocol, or reasonable expectation of performance.
  3.  **Intervention Potential:** The factor must be something the organization can realistically modify or enforce.

  **5. Proposed Report Language**

  To ensure the Facilities Director's objection is formally addressed within the document, I recommend adding the following clarifying note to the "Root Causes" section of Report #24-B:

  > *"Note on Causal Classification: This report identifies causes based on deviations from established operational norms. While the incident counterfactually depended on multiple conditions (including equipment design specifications and regulatory minimums), only those conditions representing a breach of scheduled duty or protocol are classified as Root Causes. The failure to perform the scheduled filter check is classified as a cause because it constitutes a deviation from the mandated maintenance baseline, whereas equipment design specifications represent the static operational context."*

  **6. Conclusion for Friday's Meeting**

  The Facilities Director's objection is philosophically sound if we view causation as a purely physical relation. However, incident reporting is not metaphysics; it is a tool for risk management. We cite causes to identify where our *systems of expectation* failed.

  By adopting the Normative Expectation Framework, we validate the Director's concern about infinite regress without sacrificing the accountability required to prevent future incidents. We are not saying omissions are magically causal; we are saying that **breaches of duty are the specific subset of omissions relevant to organizational learning.**

  I ask the board to approve this classification and the accompanying definitional note on Friday.

  [Your Name]
  Incident Review Board Member
