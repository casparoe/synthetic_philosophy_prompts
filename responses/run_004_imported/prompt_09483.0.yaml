      *   *Premise 2 (Supervenience):* Mental states depend on physical states (no mental difference without a physical difference).
      *   *Premise 3 (Exclusion):* No event can have more than one sufficient cause (unless it's genuine overdetermination).
      *   *Conclusion:* If the physical cause is sufficient, the mental cause is excluded (does no work).

