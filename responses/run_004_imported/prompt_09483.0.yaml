      *   *Best Analogy for Causal Exclusion:* The "Sufficient Cause" competition. If the physical cause is *enough* on its own to guarantee the effect, adding the mental cause looks like "overdetermination" (like two assassins shooting at the same time). But mental/physical aren't independent like two assassins. They are linked. So if the physical does it all, the mental looks like a shadow.

