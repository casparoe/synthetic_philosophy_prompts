answer: |-
  **Setting:** *The locutorio of the Convent of Santa Paula, Mexico City. Late afternoon, 1691. The grille separating the nun from the visitor casts a lattice of shadows across the floor. SOR JUANA sits on the inner side; the BISHOP OF PUEBLA, disguised in the habit of a nun and speaking under the name SOR FILOTEA, sits outside.*

  **Sor Filotea:** Sister Juana, I did not come to condemn you. You must believe that. When I read your critique of Father Vieira, I saw a mind sharpened by God Himself. That is why I published it. I wanted New Spain to see the jewel it possessed. But a jewel kept in the pocket is safe; a jewel worn in the marketplace attracts thieves, and worse, it attracts the eye of the wearer. I fear you are looking too much at your own reflection.

  **Sor Juana:** Your Lordship—may I call you Sor Filotea, since we wear the same habit for this conversation?—you praise the jewel but demand I cover it. You say in your letter that I should turn from human letters to divine ones. But do you imagine God created the intellect as a trap? If He gave me this inclination to study, and I were to stifle it, would I not be offending the Giver? To not use His gifts is to return them unopened.

  **Sor Filotea:** It is not the gift I question, but the use. You are a bride of Christ. Your vow is obedience, your vocation is prayer. When you engage in public disputation, when you correct a preacher of the stature of Vieira, you step outside the enclosure of your soul. St. Paul is explicit: *Mulieres in ecclesiis taceant.* Let women keep silence in the churches. You are not keeping silence. You are teaching.

  **Sor Juana:** We must distinguish between teaching with authority and reasoning in charity. St. Paul forbids women from the pulpit, from the office of the priest. I do not claim that. But writing? Writing is private counsel made public by necessity. And consider, Sor Filotea, if Paul commanded absolute silence, how do we explain Priscilla, who instructed Apollos? How do we explain the Prophetesses? The silence Paul demands is against the disorder of the unlearned speaking over the ordained. It is not a command to lobotomize the faithful. If I write to clarify a theological point, am I disrupting order, or am I serving the Truth which orders all things?

  **Sor Filotea:** You serve the Truth as you see it. But the Church is a body, and the hand does not direct the head. My concern is pastoral. I see the scandal. When a nun becomes more famous for her poetry than her piety, the world begins to value wit over grace. You risk the sin of vainglory. It is a subtle poison. You argue that study is worship, but I ask you: when you are deep in the intricacies of logic or the measurement of the stars, are you thinking of God, or are you thinking of your own capacity? Humility is the foundation of the spiritual life. To insist on your right to know is, itself, a form of pride.

  **Sor Juana:** Is ignorance humility? That is a dangerous heresy. You say I should focus on sacred things. But how can one understand Sacred Scripture without the tools of the secular sciences? To understand the Bible, one must know history to place the events, geography to locate them, rhetoric to understand the metaphors, and logic to follow the arguments. If theology is the Queen, then philosophy and the arts are her handmaidens. You cannot have the Queen without her court. If I study physics, it is to better marvel at the Creation. If I study logic, it is to better defend the Faith against error. To tell me to abandon secular study is to tell the Queen to dismiss her servants. She will be naked without them.

  **Sor Filotea:** A compelling image. But handmaidens can become mistresses. I have seen brilliant men lose their souls because they fell in love with the map rather than the territory. You speak of defending the Faith, but the Faith is defended by holiness as much as by argument. Look to St. Catherine of Siena. She was unlettered, yet she counseled Popes. Her authority came from her union with God, not her syllogisms. If you truly loved God, would you not be content to know Him in the silence of the cell, rather than demanding to know Him through the noise of books?

  **Sor Juana:** St. Catherine is a glorious exception, but she is not the rule for every soul. God leads His saints by different paths. My path is through the intellect. You say I love the noise of books. I say I love the light they kindle. And I am not the first woman to walk this path. St. Paula learned Hebrew to sing the Psalms in the original tongue. Eudocia wrote verses on the Scriptures. They were not rebuked; they were venerated. Why is their virtue now my vice? Is it that the world has grown smaller, or that my sex is held in greater suspicion now than in the time of the Fathers?

  **Sor Filotea:** It is not suspicion, Juana. It is protection. The world is hard on women who step out of their station. If you fail, they will not say "Sor Juana erred," they will say "Women cannot learn." You carry the burden of your entire sex upon your shoulders. Is it not safer to lay that burden down? To write only of your sins, to study only the lives of the saints? I urge you to this not to crush you, but to save you from the inevitable backlash. The Inquisition watches. The court whispers. I offer you the veil of humility to hide behind.

  **Sor Juana:** And I tell you, humility is not hiding. Humility is acknowledging the truth. The truth is that I have a mind, and it demands to be fed. If I were to write only of my sins, I would be lying, for my sins are not the sum of my existence. You speak of safety. But is it safe to let error go unchallenged because the challenger is a woman? You published my critique of Vieira. You knew it was good. Why publish a truth that should be silenced? You cannot hold both positions: that my work is worthy of the press, and that I am unworthy of the study that produced it.

  **Sor Filotea:** I published it because the argument was sound, not because the author was a nun. A clock tells time correctly regardless of who wound it. But the clock does not need to know *how* it tells time to function. You are not a clock. You are a soul. My duty is to ensure your soul reaches Heaven, not that your name reaches posterity. I am asking you to sacrifice your fame for your salvation. Is that not the essence of the religious life? To die to self?

  **Sor Juana:** I have died to the world, Sor Filotea. I live in a cell. I eat simple food. I pray the hours. But I have not died to the reason God gave me. If I cease to study, I cease to be who God made me. You ask for a sacrifice of my fame. I tell you I care little for fame. I care for understanding. If I am wrong, correct me with logic, not with authority. Show me where my theology fails, not where my gender offends. Until then, I cannot in conscience put down the pen. To do so would be a sin against the Holy Spirit, who breathed upon my understanding.

  **Sor Filotea:** *[Silence for a long moment. The shadow of the grille shifts as the sun lowers.]* You argue with the precision of a razor, Juana. That is precisely what frightens me. A razor in the hand of a surgeon saves life; in the hand of a child, it cuts the throat. I cannot force you to stop. I can only warn you that the Church is patient, but she is also long-lived. She will outlast us both.

  **Sor Juana:** And Truth is older than the Church, and older than the world. If my study leads me to Truth, I meet God there. If you meet Him in silence, I bless your path. But do not ask me to walk it.

  **Sor Filotea:** Then we are at an impasse. I shall pray for your humility.

  **Sor Juana:** And I shall pray for your understanding.

  **Sor Filotea:** *[Rising]* God keep you, Sister.

  **Sor Juana:** And you, Sor Filotea.

  *[The Bishop bows and exits. Sor Juana remains seated, her hand resting on a stack of manuscripts, the light fading slowly from the page.]*
