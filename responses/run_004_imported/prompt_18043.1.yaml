  **MEMORANDUM**

  **TO:** Student Government Rules Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Econ Club Futarchy Proposal (Green Fund Allocation)

  **RECOMMENDATION**
  I recommend we **Adopt-with-Conditions**. While the Econ Club's proposal offers a novel application of decision theory, the current "no override" clause and lack of market safeguards present unacceptable governance risks. We should approve the prediction market mechanism only if binding caps, insider trading prohibitions, and a safety override are implemented.

  **BACKGROUND**
  The Econ Club proposes allocating Green Fund financing via futarchy: a referendum sets the goal (emissions reduction), and a prediction market determines the method (Solar vs. Bike-Share). Proponents argue this aggregates dispersed information better than senatorial voting. Opponents argue the market is too thin, vulnerable to manipulation, and constitutes irresponsible gambling.

  **ANALYSIS OF OPPOSING VIEW (THE SKEPTICS)**
  I am overriding the Skeptics' recommendation to **Reject** the proposal entirely, but their concerns regarding market integrity are the primary justification for the conditions attached to this approval.

  The Skeptics correctly identify that a student-run market with a few hundred participants lacks the liquidity of a national exchange. In a thin market, a single wealthy actor (or student organization) can sway prices to match their preference rather than truth, defeating the "wisdom of crowds" purpose. Furthermore, the concern regarding insider information is substantive: facilities staff or project leads may know about supply chain delays or permitting issues before the market does. If trading is open during the implementation phase, this creates a moral hazard where actors profit from project failure. Finally, labeling this "gambling" is not merely moralistic; if the market incentivizes students to bet against campus sustainability, it misaligns our educational mission.

  However, a total rejection dismisses the valid critique of our current voting process. Nine senators voting on "vibes" is susceptible to lobbying and bias in ways a transparent market is not. Rather than banning the experiment, we should regulate the risks the Skeptics have identified.

  **PROPOSED CONDITIONS**
  To mitigate the risks above while preserving the informational benefits, adoption is contingent on the following:

  1.  **Governance Override:** The "no override" clause must be removed. Student Government retains fiduciary responsibility; if the winning project proves legally or logistically impossible, the Senate must be able to intervene.
  2.  **Insider Trading Ban:** Any individual with non-public information regarding project feasibility (Econ Club leads, Facilities staff) is prohibited from trading.
  3.  **Position Limits:** To prevent market manipulation by "whales," cap the maximum position any single student or organization can hold at 5% of the total market volume.
  4.  **Metric Audit:** The emissions metric must be verified by a neutral third party (e.g., Sustainability Office) to prevent the market from trading on ambiguous definitions.

  **CONCLUSION**
  Futarchy is a powerful theoretical tool, but it requires robust infrastructure to function as truth-seeking rather than speculation. By adopting this proposal with strict safeguards, we acknowledge the Skeptics' valid concerns about manipulation and liability without stifling institutional innovation.

  **ACTION REQUIRED**
  Vote to approve the proposal contingent on the drafting of the above safeguards by next week's meeting.
