answer: |-
  The debate over the moral status of soldiers is the central fault line in contemporary just war theory. On one side stands the traditionalist view, most famously articulated by Michael Walzer in *Just and Unjust Wars*, which defends the Moral Equality of Combatants (MEC). On the other stands the revisionist challenge, led by Jeff McMahan in *Killing in War*, which argues that liability to attack tracks moral responsibility for unjust threats. Your evening argument circled the usual pressure points: epistemic limitations, the distinction between excuse and justification, and the relationship between deep morality and the laws of war.

  To settle this dispute, we must distinguish between what is pragmatically useful for international regulation and what is morally true about the act of killing. While Walzer's traditionalism offers a compelling account of how the *laws* of war ought to function to minimize suffering, it fails as an account of *moral liability*. McMahan's revisionism, despite its practical difficulties, provides the only coherent explanation of the ethics of killing. Therefore, the verdict must be that **the Moral Equality of Combatants is morally false.** Soldiers fighting for an unjust cause do not possess the same moral right to kill as those fighting for a just cause, even if international law treats them as equals. To argue otherwise is to sever the connection between morality and the use of lethal force.

  ### The Traditionalist Case: War as a Collective Practice

  Walzer's defense of MEC rests on the idea that war is a distinct moral realm, separate from ordinary life. In domestic society, if a person threatens you unjustly, you have a right to defend yourself, and they have no right to resist your defense. In war, Walzer argues, this logic is suspended. Once a state engages in war, its soldiers enter a "common pool of danger." They become combatants, stripped of their individual political agency and transformed into instruments of the state.

  Walzer offers two primary defenses for this equality. The first is the **epistemic argument**. Most soldiers, particularly conscripts, are in no position to judge the *jus ad bellum* justice of their nation's cause. They face a "fog of war" regarding political justification. If moral liability depended on the objective justice of the cause, almost no soldier could fight with a clear conscience, and the distinction between murderer and soldier would collapse.

  The second is the **humanitarian argument**. Walzer contends that MEC serves a vital functional role. If soldiers fighting on the unjust side knew they were morally liable to be killed—essentially branded as murderers—they would have no incentive to follow the rules of war (*jus in bello*). They would fight more brutally, refuse surrender, and target civilians, reasoning that they have nothing to lose. By granting them equal status, we encourage them to fight cleanly. For Walzer, the separation of *ad bellum* (justice of war) and *in bello* (justice in war) is not just a legal convention but a moral necessity to contain the horrors of conflict.

  ### The Revisionist Critique: Liability and Responsibility

  McMahan dismantles this framework by refusing to accept war as a moral exception. He applies standard principles of self-defense to the battlefield. In ordinary morality, your liability to be killed depends on whether you are morally responsible for an unjust threat. If a culpable aggressor attacks you, they forfeit their right not to be killed. If you defend yourself, you do not wrong them. Conversely, if you are an innocent threat (e.g., someone thrown at you), you may not be culpable, but you are still liable to be stopped if necessary.

  McMahan argues that **justice is symmetric.** If Side A is fighting a just war of self-defense, and Side B is an aggressor, Side A's soldiers are not threatening anyone unjustly. Therefore, Side B's soldiers have no moral right to kill them. To kill a just combatant is to kill someone who is morally permitted to be where they are and doing what they are doing. It is, in the deep moral sense, a form of murder, even if the killer is excused due to ignorance.

  This leads to McMahan's crucial distinction between **justification and excuse**. Walzer tends to blur these, suggesting that if a soldier is blameless (excused), they are functionally permitted to fight (justified). McMahan insists they are not. An unjust combatant might be *blameless* because they were coerced or misled (and thus should not be punished as a criminal), but their act of killing remains *unjustified*. They are morally liable to be killed by just combatants, whereas just combatants are not morally liable to be killed by them. This restores the link between morality and violence: you cannot have a moral right to kill for an immoral end.

  ### Engaging the Pressure Points

  The strength of Walzer's position relies heavily on the epistemic argument and the fear of bad consequences. However, McMahan's framework handles these objections more honestly.

  Regarding **epistemic limitations**, McMahan does not demand that every soldier become a geopolitical analyst. He acknowledges that many unjust combatants are non-liable to punishment because their ignorance is non-culpable. However, he insists that *ignorance does not change liability*. If a police officer arrests a criminal, and the criminal honestly believes the arrest is wrongful and shoots the officer, the criminal is not *justified* in shooting, even if he is blameless enough to avoid prison. The officer was not liable to be shot. Similarly, an unjust soldier might be excused from blame, but the just soldier they kill was not morally liable to die. Walzer's error is conflating "we shouldn't punish this soldier" with "this soldier did nothing wrong."

  Regarding the **collective nature of war**, Walzer argues that soldiers are mere tools. But bombs do not pull triggers; people do. To say a soldier is merely an instrument is to deny their moral agency. If we accept that individuals are responsible for their actions in all other spheres of life, we need a overwhelming reason to suspend that responsibility in war. Walzer provides a pragmatic reason (to keep war contained), but not a moral one.

  This brings us to the most significant worry: **Law vs. Morality**. Your friend likely argued that even if McMahan is right about "deep morality," adopting his view would make war worse. If unjust soldiers know they are "murderers," they will fight dirtier. This is the "workability" objection.

  Here, we must be precise. It is entirely consistent to accept McMahan's moral verdict while retaining Walzer's legal conventions. We can acknowledge that the *laws of war* (International Humanitarian Law) should maintain combatant equality to encourage compliance and facilitate peace treaties, while simultaneously teaching that the *morality of war* is asymmetrical.

  However, Walzer does not stop at legal pragmatism; he claims MEC is *morally true*. This is where he fails. Building a legal system on a known moral falsehood is dangerous. It suggests that morality is irrelevant to the law of war. Furthermore, the "fighting dirtier" argument is speculative. It assumes that soldiers are motivated primarily by abstract moral status rather than survival, loyalty, or fear. In reality, soldiers fight for their comrades and their lives, not because a philosopher told them they have equal rights. Acknowledging moral asymmetry might actually strengthen the normative force of *jus ad bellum*, making leaders more hesitant to start unjust wars if they know their soldiers are not morally shielded.

  ### The Verdict

  The dispute must be settled in favor of **McMahan's revisionism regarding the moral status of soldiers.**

  Walzer's traditionalism is a triumph of diplomatic pragmatism, but it is a failure of moral philosophy. It asks us to accept that a soldier fighting to defend their homeland from invasion and a soldier fighting to conquer that homeland stand on the same moral footing when they shoot at one another. This contradicts our deepest intuitions about self-defense and the value of human life. If the cause is unjust, the threat posed is unjust. If the threat is unjust, the person posing it is liable to be stopped, and those stopping it are not liable to be killed.

  We should concede that the *laws* of war may need to retain a functional equality for the sake of order and humanitarian protection. But we must not confuse this legal convention with moral truth. To do so is to grant a "moral license" to those fighting for aggression, obscuring the reality that they are participating in a collective crime.

  Therefore, the moral equality of combatants is a fiction. It is a useful fiction for the lawyer and the diplomat, perhaps, but a falsehood for the ethicist. Soldiers are moral agents, not mere instruments. Their liability to kill and be killed depends on the justice of their cause. While we may excuse the individual soldier for their ignorance, we cannot justify their violence. In the deep morality of war, there are no equals—only those defending the right and those violating it. To deny this is to surrender the very possibility of a just war.
