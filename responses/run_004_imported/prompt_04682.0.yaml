answer: |-
  # Chapter Section: The Resilience of the Dilemma Defense Against New Wave Frankfurt Cases

  ## 1. Introduction: The Premature Obituary of PAP

  The consensus in contemporary moral responsibility literature is that the Principle of Alternative Possibilities (PAP) has been decisively refuted. Following Harry Frankfurt's original intervention, the "Dilemma Defense" mounted by Robert Kane and David Widerker was widely regarded as the last stand of the incompatibilist. The Dilemma posits that any Frankfurt-style case (FSC) relying on a prior sign of the agent's choice must either be deterministic (begging the question against the libertarian) or indeterministic (leaving open a "flicker" of alternative possibility).

  In response, a generation of "New Wave" Frankfurt cases—most notably those by Mele and Robb, Michael Hunt, and Derk Pereboom—were designed specifically to bypass this dilemma. These cases ostensibly eliminate alternative possibilities without assuming causal determinism, thereby purportedly severing the link between responsibility and the ability to do otherwise. The prevailing view holds that these constructions have rehabilitated the Frankfurt strategy, rendering the Dilemma Defense obsolete.

  This section argues that this consensus is mistaken. The Dilemma Defense remains philosophically potent because the New Wave cases fail to eliminate *robust* alternative possibilities in the technical sense required to ground moral responsibility. While proponents of these cases claim to have isolated "actual sequence" responsibility (à la John Martin Fischer), a rigorous analysis reveals that the residual alternative possibilities in Mele and Robb's process case, Hunt's blockage case, and Pereboom's Tax Evasion case are not merely trivial flickers of causal history. Rather, they constitute robust alternatives regarding the *sourcehood* of the action. By demonstrating that these surviving alternatives bear directly on the agent's status as a responsible agent, I will show that the core insight of the Dilemma Defense holds: one cannot construct a counterexample to PAP without presupposing either determinism or the existence of a responsibility-grounding alternative possibility.

  ## 2. The Robustness Constraint and the Flicker Strategy

  To evaluate the success of the New Wave cases, we must first clarify the target. John Martin Fischer has argued that not just any alternative possibility saves PAP. For an alternative to be relevant to moral responsibility, it must be **robust**. Fischer defines a robust alternative as one that helps explain *why* the agent is morally responsible in the actual sequence. Mere "flickers"—such as the difference between choosing at *t* versus *t+1*, or choosing via process *A* versus process *B*—are typically dismissed as non-robust because the agent appears equally responsible in both scenarios.

  The standard Frankfurt defender argues that in New Wave cases, the agent is responsible in the actual sequence regardless of the alternative, rendering the alternative non-robust. However, this reasoning begs the question against the incompatibilist. For the incompatibilist, the *ground* of responsibility is ultimate sourcehood, which requires the ability to be the *initiator* of the action in a way that is not guaranteed by prior conditions.

  Therefore, a robust alternative, from the perspective of the Dilemma Defense, is not merely an alternative *action*, but an alternative *status of responsibility*. If the counterfactual scenario (where the alternative possibility is realized) is one in which the agent is *not* morally responsible (due to manipulation, determinism, or blockage), then the possibility of avoiding that scenario is robust. It explains why the agent is responsible in the actual sequence: because they acted in a way that preserved their status as an ultimate source, which they would have lost had the alternative obtained. The New Wave cases fail because they cannot eliminate this specific type of alternative without collapsing into determinism.

  ## 3. Mele and Robb: The Indeterministic Process Case

  Mele and Robb (1998) propose a case designed to avoid the Dilemma's horns. In their scenario, an agent, Bob, deliberates about stealing a car. Two processes are at play:
  1.  **Process P:** An indeterministic deliberative process that issues in the decision to steal at *t*.
  2.  **Process B:** A deterministic backup process (installed by a neuroscientist) that is set to trigger at *t* if P has not issued a decision. B will deterministically cause the decision to steal.

  In the actual sequence, P issues the decision at *t*. B remains idle. Mele and Robb argue that Bob could not have done otherwise (if P failed, B would have succeeded), yet Bob is responsible because P was indeterministic and "his own."

  ### 3.1 The Survival of Sourcehood Alternatives
  The Dilemma Defense counters that a robust alternative survives here, specifically concerning the *causal origin* of the action. In the actual sequence, Bob decides via P. In the counterfactual sequence, Bob decides via B. The critical question is: Is Bob morally responsible in the counterfactual sequence where B causes the decision?

  Mele and Robb stipulate that Bob *is* responsible in the counterfactual sequence, arguing that B duplicates the causal role of P. However, this stipulation is the weak link. Process B is a deterministic mechanism that bypasses Bob's indeterministic deliberation. If B is truly deterministic and ensures the outcome regardless of Bob's deliberative state, B functions as a manipulative device. If Bob is manipulated by B, he is not responsible in the counterfactual scenario.

  If Bob is not responsible in the counterfactual scenario (where B triggers), then the alternative possibility—"P succeeds and B does not intervene"—is robust. It is the difference between being an ultimate source of one's action (via P) and being the locus of a deterministic guarantee (via B). The agent retains the power to *fail* to be the source in the counterfactual. Consequently, the actual sequence responsibility depends on the fact that the agent *could* have fallen into the non-responsible counterfactual state but did not. This preserves PAP: Bob is responsible only because he had the robust alternative of failing to be the ultimate source (via B's intervention).

  To deny this, Mele and Robb must assert that deterministic backup processes do not undermine responsibility. But this is precisely what the libertarian denies. By assuming that responsibility is compatible with the deterministic backup ensuring the action, they assume a compatibilist view of sourcehood, thereby begging the question against the incompatibilist who insists that PAP is a necessary condition for that very sourcehood.

  ## 4. Pereboom's Tax Evasion: The Prior Sign Case

  Derk Pereboom's "Tax Evasion" case (Case 4) is often cited as the most formidable challenge to the Dilemma Defense. Here, a neuroscientist installs a device that detects a prior neural condition necessary for choosing to evade taxes. If the condition occurs, the device does nothing. If the condition does not occur, the device stimulates the brain to produce the condition and the subsequent choice. Pereboom argues the prior condition is necessary for choosing otherwise, but not sufficient for choosing to evade, thus avoiding the Dilemma's first horn (determinism).

  ### 4.1 The Volitional Status of the Prior Sign
  The Dilemma Defense resurfaces when we examine the nature of the "prior sign" (the neural condition). There are two options:
  1.  **The sign is involuntary:** If the neural condition is something that merely happens to the agent (like a sneeze), then the agent lacks control over it. If the agent lacks control over the necessary condition for choosing otherwise, they lack control over the choice itself. In this scenario, the blockage is external to the agent's agency. However, if the blockage is external, the agent retains the *intrinsic power* to do otherwise, even if the *opportunity* is blocked. This aligns with Hunt's blockage cases (discussed below) and suggests the agent still possesses the relevant ability, preserving a version of PAP focused on powers rather than opportunities.
  2.  **The sign is voluntary:** If the neural condition is something the agent brings about (e.g., a mental act of attending to tax reasons), then the agent can choose whether to bring about the sign. If they can choose whether to bring about the sign, they can choose whether to make it possible to do otherwise.

  Pereboom attempts to navigate between these horns by claiming the sign is a non-voluntary occurrence that is nonetheless part of the agent's psychology. However, for the sign to ground responsibility in the actual sequence, it must be appropriately connected to the agent's rational faculties. If it is connected enough to ground responsibility, it is likely under the agent's rational control. If it is under rational control, the agent can refrain from it.

  ### 4.2 Robustness via Responsibility-Undermining Counterfactuals
  Even if we grant Pereboom that the agent cannot refrain from the sign, a robust alternative remains regarding the *intervention*. In the counterfactual sequence where the sign does not occur, the device intervenes. As with Mele and Robb, we must ask: Is the agent responsible in the intervention sequence?

  If the device stimulates the brain to produce the choice, this is a classic manipulation case. The agent is not responsible in the counterfactual sequence. Therefore, the alternative possibility—"The sign occurs and the device does not intervene"—is robust. It marks the boundary between responsibility and non-responsibility. The agent is responsible in the actual sequence *because* they acted in a way that avoided the manipulative intervention. This avoidance was possible (the sign could have failed to occur). Thus, the ability to avoid the intervention (even if not the ability to avoid the action) is a robust alternative that grounds responsibility. Pereboom's case does not eliminate alternatives; it merely shifts them from the level of *action* to the level of *intervention avoidance*. Since avoiding manipulation is a responsibility-relevant alternative, PAP stands.

  ## 5. Hunt's Blockage: Intrinsic Power vs. Extrinsic Prevention

  Michael Hunt's blockage cases remove the counterfactual intervener entirely. Instead, a physical blockage prevents the agent from choosing otherwise, without causally determining the actual choice. The agent chooses on their own, but the alternative path is physically blocked (like a wall preventing a turn).

  ### 5.1 The Distinction Between Ability and Opportunity
  The Dilemma Defense against Hunt relies on a distinction between the *intrinsic ability* to do otherwise and the *extrinsic opportunity* to do otherwise. PAP, the incompatibilist argues, concerns the former. A blockage removes the opportunity but leaves the intrinsic power intact.

  If the agent retains the intrinsic power to choose otherwise, but is prevented by an external blockage, is the alternative possibility "robust"? Fischer would say no, because the blockage ensures the action happens regardless. However, consider the modal status of the agent. In the actual sequence, the agent exercises their intrinsic power. In the counterfactual sequence (where they try to choose otherwise), they fail due to the blockage.

  The robust alternative here is the possibility of *trying* to do otherwise. If the agent can try to do otherwise, they exercise a form of regulative control. If the blockage prevents the *success* of the try but not the *try* itself, the agent still accesses an alternative possibility of *attempting*. If the blockage prevents the *try* (by blocking the neural precursor to the try), we return to the Pereboom dilemma: is the blockage causal or non-causal?

  If the blockage is non-causal (mere prevention), the agent's will remains undetermined. If the will is undetermined, there is a probability that the agent would have willed otherwise. If that probability exists, the blockage is contingent. If the blockage is contingent, there is a possible world where the blockage fails. In that world, the agent does otherwise.

  For the Frankfurt defender to succeed, the blockage must be metaphysically necessary in the context of the case. But if the blockage is necessary, it functions as a deterministic constraint. If it is not necessary, the alternative possibility survives. The "flicker" is the possibility of the blockage failing. Is this robust? Yes, because if the blockage fails, the agent does otherwise and is responsible. If the blockage holds, the agent does the action and is responsible. Wait—this seems to favor Frankfurt.

  *Correction:* The robustness lies in the *source*. If the blockage is external, the agent is the sole source in the actual sequence. In the counterfactual (where the blockage prevents the action), the agent is *not* the source of the action (since the action doesn't happen, or is prevented). The alternative is "Being the sole source of the action" vs. "Being prevented from acting." The former grounds responsibility; the latter does not (as no action occurs). Thus, the possibility of being prevented is a robust alternative regarding the *existence* of the responsible action. But PAP requires the ability to do *otherwise*, not the ability to do *nothing*.

  *Stronger Argument:* The Hunt case fails to refute PAP because it conflates *could not have done otherwise* with *would not have done otherwise*. If the blockage is non-causal, it does not determine the will. If the will is not determined, the agent *could* have willed otherwise, even if they *would* have been blocked. PAP is a modal claim about ability (could), not a predictive claim about outcomes (would). Hunt's cases show the agent *would* not have succeeded, but they do not prove the agent *could* not have tried/willed. Since moral responsibility attaches to the will, and the will remains free to try, the alternative possibility of *willing otherwise* survives. This alternative is robust because it represents the agent's capacity for rational self-determination, which is the basis of responsibility.

  ## 6. Synthesis: The Inescapability of the Dilemma

  The common thread across Mele and Robb, Pereboom, and Hunt is the attempt to isolate the actual sequence from the counterfactual sequence while ensuring the outcome remains constant. They succeed in ensuring the *outcome* remains constant, but they fail to ensure the *status of the agent* remains constant across sequences.

  In every successful New Wave case, the counterfactual sequence involves either:
  1.  **Deterministic Backup (Mele & Robb):** Which threatens manipulation/sourcehood.
  2.  **Intervention (Pereboom):** Which threatens manipulation/sourcehood.
  3.  **Blockage (Hunt):** Which threatens intrinsic ability.

  In each instance, the agent in the actual sequence is responsible *only because* they are not in the counterfactual sequence. The alternative possibility is "Not being in the counterfactual sequence." Since being in the counterfactual sequence would undermine responsibility (due to manipulation or blockage), the possibility of avoiding it is robust. It explains why the agent is responsible: they navigated the landscape of possibilities in a way that preserved their sourcehood.

  Fischer's constraint on robustness requires that the alternative explain the responsibility. Here, the alternative explains the responsibility by contrasting it with non-responsibility. The New Wave cases do not refute PAP; they merely relocate the alternative possibility from the level of *action* to the level of *causal history* or *intervention status*. But since sourcehood is determined by causal history, alternatives at this level are sufficient to ground PAP.

  ## 7. Conclusion

  The Dilemma Defense remains the strongest argument for the incompatibilist because it exposes a structural necessity in the concept of moral responsibility. To hold an agent responsible is to hold them accountable for being the source of their action. To be the source requires that one could have failed to be the source (via determinism, manipulation, or blockage). The New Wave Frankfurt cases attempt to construct scenarios where the agent is the source but could not have failed to be the source.

  As demonstrated, these attempts fail. In Mele and Robb's case, the deterministic backup threatens sourcehood. In Pereboom's case, the intervention threatens sourcehood. In Hunt's case, the blockage threatens intrinsic ability. In each case, the residual alternative possibility—the possibility of the backup triggering, the intervention occurring, or the blockage holding—is robust because it marks the boundary between agency and mechanism. Consequently, the Principle of Alternative Possibilities stands vindicated. The literature's treatment of the Dilemma Defense as refuted is premature; it rests on an underestimation of the robustness required to ground sourcehood. For the dissertation's purposes, this reinstates PAP as a viable premise for arguing that moral responsibility is incompatible with determinism.
