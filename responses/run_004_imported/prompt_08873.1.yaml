      *   No strawmanning? Yes.

  7.  *(Self-Correction during final polish)*: Make sure Elena doesn't just say "rules are good." She needs to explain *why* a constraint is safer than a preference. It's about the *gradient*. If resistance is just negative utility, the AI might accept a small resistance for huge gain. If it's a hard constraint, the gradient is null/undefined.

