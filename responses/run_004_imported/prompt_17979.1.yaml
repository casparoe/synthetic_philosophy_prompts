answer: |-
  Higher-order theories (HOT) of consciousness posit a relational structure to phenomenal experience: a mental state is conscious not in virtue of its intrinsic properties, but in virtue of being targeted by a suitable higher-order representation. Within this framework, the debate between David Rosenthal's actualist HOT theory and Peter Carruthers's dispositionalist alternative represents a critical fault line. Rosenthal argues that a first-order state becomes conscious only when accompanied by an *actual*, albeit unconscious, higher-order thought. Carruthers, motivated by the "richness and grain" objection, argues that it suffices for the first-order state to be *disposed* to cause such a thought. While Carruthers successfully mitigates the cognitive implausibility of Rosenthal's actualism, his dispositionalist shift ultimately fails to account for the occurrent nature of phenomenal consciousness. By reducing consciousness to a mere potentiality for access, dispositionalism renders mysterious how a state can be phenomenally conscious *now* rather than merely poised to become so, effectively conflating phenomenal consciousness with access consciousness.

  To understand the motivation for Carruthers's shift, one must first grasp the difficulty facing Rosenthal's actualism. For Rosenthal, the quality of a conscious experience is determined by the content of the HOT. If I consciously see a red apple, there exists a first-order perceptual state representing the apple and a distinct, unconscious HOT representing that I am in that perceptual state. The "richness and grain" objection targets the computational feasibility of this view. Ordinary visual experience is analog, continuous, and incredibly detailed (e.g., the specific shade of every leaf in a visual field). If every distinct phenomenal feature requires a corresponding actual HOT, the mind must generate a vast profusion of simultaneous unconscious thoughts to match the resolution of experience. This seems cognitively profligate and psychologically implausible. Carruthers argues that dispositionalism resolves this by decoupling consciousness from the *occurrence* of the thought. On his view, a state is conscious if it is available to the thinking system—if it *could* be targeted by a HOT, even if no such thought actually occurs. This preserves the richness of the first-order state without requiring a one-to-one mapping of actual higher-order representations.

  On the surface, Carruthers's move appears to be a theoretical victory. It respects the constraints of cognitive economy while maintaining the core higher-order insight that consciousness involves a form of self-monitoring or availability. By treating the higher-order element as a dispositional property of the first-order state, Carruthers avoids the "profusion problem." The visual system can process high-resolution data without the cognitive system needing to articulate that data into discrete propositional thoughts unless required for reasoning or reporting. In this sense, dispositionalism successfully resolves the specific difficulty regarding the *capacity* of the cognitive architecture to sustain conscious experience.

  However, solving the architectural problem creates a deeper metaphysical and phenomenological mystery. The central objection to dispositionalism is that it confuses a categorical property with a dispositional one. Consciousness is an occurrent phenomenon; it is something that is happening *now*. A disposition, by definition, is a property concerning what *would* happen under certain conditions. To say a glass is soluble is to say it *would* dissolve if placed in water, not that it *is* dissolving. Similarly, to say a mental state is disposed to cause a HOT is to say a thought *would* occur if the system attended to it. But the phenomenology of experience does not feel like a potentiality; it feels like an actuality. When I feel a pain or see a flash of light, the phenomenal character is present regardless of whether I am disposed to think about it.

  This leads to the charge that Carruthers's theory explains access consciousness rather than phenomenal consciousness. Access consciousness concerns the availability of information for reasoning, reporting, and rational control of action—functions that are inherently dispositional. Phenomenal consciousness concerns "what it is like" to be in the state. By defining consciousness as the disposition to be accessed, Carruthers provides a robust account of how states become available for cognitive consumption (solving the richness problem), but he leaves untouched the question of why those states have a subjective feel in the first place. If the HOT never actually occurs, the "light" of higher-order awareness is never truly switched on; the switch is merely installed. It remains mysterious how the mere installation of the switch illuminates the room.

  Defending this verdict requires addressing a potential counter-argument from the dispositionalist. Carruthers might argue that dispositions are real, categorical bases in the brain. The neural realization of the disposition exists now, so the property of "being conscious" is a real, occurring property of the brain state. However, this reply misses the phenomenological point. Even if the neural substrate is occurrent, the *functional role* defined by dispositionalism is conditional. The theory claims the state is conscious *because* it can be thought about. But the "what it is like" of experience does not seem conditional on cognitive availability. Consider inattentional blindness or cases where rich sensory processing occurs without conscious awareness; conversely, consider moments of intense phenomenology where cognitive access is impaired. If consciousness is merely the disposition for access, then a state that is phenomenally vivid but temporarily inaccessible (due to cognitive load, for instance) would cease to be conscious. This contradicts the intuitive distinction between having an experience and being able to report on it.

  Furthermore, the dispositional move risks an infinite regress of potentiality. If a state is conscious because it is disposed to cause a HOT, what makes the HOT itself conscious (if it needs to be)? More importantly, what distinguishes a state that is disposed to cause a HOT from a state that is disposed to cause a non-conscious reaction? If the disposition is defined by the output (a HOT), and the HOT is unconscious (as Rosenthal and Carruthers agree), then the "consciousness" of the first-order state rests entirely on a relationship to an unconscious event that might never happen. This renders the phenomenal character of the experience extrinsic and potential, rather than intrinsic and occurrent.

  In conclusion, while Peter Carruthers's dispositionalist HOT theory successfully patches the empirical hole in Rosenthal's actualism regarding the richness of experience, it does so at an unacceptable philosophical cost. It resolves the problem of cognitive profusion by lowering the bar for what constitutes consciousness, but in doing so, it lowers the bar too low to capture the phenomenon of phenomenality. By equating the presence of experience with the potential for cognitive access, dispositionalism leaves it mysterious how a state can be phenomenally conscious rather than merely poised to become an object of thought. Therefore, the verdict must be that dispositionalism does not resolve the difficulty of explaining consciousness; it merely sidesteps the computational cost by sacrificing the explanatory link between higher-order awareness and the immediate presence of subjective experience. The theory saves the mechanism but loses the phenomenon.
