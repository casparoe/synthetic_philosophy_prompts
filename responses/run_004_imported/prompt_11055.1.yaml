      *   *Section 2: Millikan's Solution:* Proper functions, Normal conditions, selection history. Misrepresentation = malfunction.
      *   *Section 3: Fodor's Solution:* Asymmetric dependence. Primary vs. secondary laws. Misrepresentation = parasitic causation.
      *   *Section 4: Swampman Test:*
