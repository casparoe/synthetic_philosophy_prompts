      *   **Context:** Graduate seminar on philosophy of mind.
      *   **Topic:** Naturalizing intentional content (specifically solving the "disjunction problem" regarding misrepresentation).
      *   **Theories to Compare:** Ruth Millikan's Teleosemantics vs. Jerry Fodor's Asymmetric Dependence Theory (ADT).
      *   **Key Test Case:** Swampman (David Davidson's thought experiment).
      *   **Key Questions:**
          1.  How does each theory block the disjunction problem?
          2.  How does each theory handle Swampman?
          3.  Do the proponents (Millikan/Fodor) like the Swampman verdict?
          4.  Which theory offers a more satisfying resolution to the disjunction problem?
          5.  What is the hidden cost (e.g., externalism, dependence on history/laws vs. internal state)?

  2.  **Deconstruct Theory 1: Millikan's Teleosemantics:**
      *   *Core Mechanism:* Content is determined by the *proper function* of the representation-producing system. Proper function is defined by selection history (evolutionary or learning history).
      *   *Misrepresentation:* Occurs when the system fails to perform its proper function under *Normal conditions* (conditions under which the function was selected for).
      *   *Disjunction Problem:* Solved by history. Just because $X$ causes $R$ (representation) doesn't mean $R$ means $X$. $R$ means $Y$ if $R$ was selected to correlate with $Y$. If $X$ causes $R$ but $R$ wasn't selected for $X$, then $R$ misrepresents $X$ as $Y$.
      *   *Swampman:* Swampman has no history. No selection, no proper functions.
      *   *Millikan's Verdict:* Swampman has no intentional states. He is a "zombie" in the intentional sense (though not phenomenological).
      *   *Proponent Satisfaction:* Millikan accepts this. It's a feature, not a bug. It shows history is essential.
      *   *Cost:* Radical externalism/historical dependence. Intuition bomb: Swampman acts exactly like us, speaks English, avoids tigers. Saying he has *no* thoughts seems counterintuitive to many.

  3.  **Deconstruct Theory 2: Fodor's Asymmetric Dependence Theory (ADT):**
      *   *Core Mechanism:* Content is determined by current causal laws. $R$ means $X$ if $X$ causes $R$, and if $Y$ (non-$X$) causes $R$, that causal connection depends on the $X$-$R$ connection, but not vice versa.
      *   *Misrepresentation:* $Y$ causes $R$ (false tokening). This is allowed because the $Y$-$R$ law is asymmetrically dependent on the $X$-$R$ law. If you break the $X$-$R$ link, the $Y$-$R$ link breaks. If you break the $Y$-$R$ link, the $X$-$R$ link holds.
      *   *Disjunction Problem:* Solved by counterfactuals. The content isn't "X or Y" because the Y-causing is parasitic on the X-causing.
      *   *Swampman:* Swampman is physically identical. He has the same causal powers. The same laws of nature apply to him.
      *   *Fodor's Verdict:* Swampman has intentional states. His "horse" representations mean HORSE because the causal laws linking horses to horse-representations hold for him just as they do for us.
      *   *Proponent Satisfaction:* Fodor accepts this. He is a methodological solipsist/internalist regarding psychology (mostly), though ADT is externalist about content. He wants content to supervene on current physical properties + laws, not history.
      *   *Cost:* The "Qua Problem" or difficulty specifying the relevant laws. Also, the intuition that history *should* matter (e.g., if Swampman's "tiger" representation never had a link to tigers in the past, does it really mean tiger *now*?). But primarily, ADT struggles with the *determination* of the primary relatum without history.

  4.  **Compare the Disjunction Solutions:**
      *   *Millikan:* Normative/Historical. Misrepresentation is functional failure.
      *   *Fodor:* Nomic/Counterfactual. Misrepresentation is parasitic causation.
      *   *Strengths:* Millikan handles normativity well. Fodor avoids "magical" history and keeps it synchronic.
      *   *Weaknesses:* Millikan requires lineage. Fodor struggles to ground the asymmetry without implicitly appealing to function or history (why is the horse-law primary and not the cow-on-a-dark-night-law?).

  5.  **Analyze the Swampman Case:**
      *   This is the wedge.
      *   Millikan: No content. (Consistent with theory, intuitively harsh).
      *   Fodor: Content exists. (Consistent with theory, intuitively plausible).
      *   *Crucial nuance:* Does Fodor *really* escape history? Some critics argue ADT secretly relies on a notion of "intended" cause which smuggles in teleology. But for the sake of the prompt, treat ADT as Fodor presents it (nomic).

  6.  **Evaluate "Satisfaction" and "Hidden Costs":**
      *   *Disjunction:* Millikan is often seen as more robust against disjunction because "Normal Conditions" explicitly filter out errors. Fodor's asymmetry is notoriously hard to specify without circularity.
      *   *Hidden Cost:*
          *   Millikan: The cost is *history*. Meaning is not in the head. A duplicate without history has no mind.
          *   Fodor: The cost is *nomological fragility*. The asymmetry must be brute. Also, it implies Swampman has content, but is that content *grounded*? If Swampman never interacts with a horse, does the law hold? (Fodor says yes, laws are counterfactual).
      *   *Internalism vs. Externalism:* Both are externalist, but Millikan is *historically* externalist, Fodor is *nomic* externalist. The prompt asks about facts "that seem to have no bearing on what is going on inside the head." Both violate internalism, but Millikan violates it more drastically (past history vs. current laws).

  7.  **Drafting the Response (Iterative refinement):**
