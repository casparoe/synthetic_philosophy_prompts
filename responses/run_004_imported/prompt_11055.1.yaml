      *   *Conclusion:* Summarize. Millikan wins on normativity/error; Fodor wins on synchronic plausibility (Swampman). But Millikan's account of *error* is generally considered more robust in the literature, even if the Swampman pill is hard to swallow.

  8.  **Refining the Argument (Self-Correction during drafting):**
