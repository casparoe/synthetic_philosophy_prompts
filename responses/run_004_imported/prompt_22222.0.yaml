      *   *Interactive Kinds:* People (mostly). When we classify them, they become aware of the classification, and this awareness changes how they act, which in turn changes the classification itself.
      *   *The Looping Effect:* Classification $\rightarrow$ Awareness/Reaction $\rightarrow$ Behavioral Change $\rightarrow$ Modification of Classification/Experience $\rightarrow$ Repeat.
