answer: |-
  This is a classic "aha!" moment in game theory. You've hit the distinction between **pure strategy dominance** and **mixed strategy dominance**.

  In Multi-Agent RL, this is crucial because your policy *is* a mixed strategy (a probability distribution over actions). If you prune your action space based only on pure dominance, you might leave in "dead weight" actions that a rational agent would never play, bloating your state space unnecessarily.

  Here is the matrix you asked for, followed by the plain-English breakdown of why the math works.

  ### The Payoff Matrix (Row Player's Payoffs)

  Let's say you are the **Row Player** with 3 strategies ($R_1, R_2, R_3$).
  The **Opponent** (Column Player) has 2 strategies ($C_1, C_2$).

  We only care about *your* payoffs for this elimination.

  | | Opponent plays $C_1$ | Opponent plays $C_2$ |
  | :--- | :---: | :---: |
  | **You play $R_1$** | 4 | 0 |
  | **You play $R_2$** | 0 | 4 |
  | **You play $R_3$** | 1 | 1 |

  #### 1. Check for Pure Strategy Dominance
  Look at the rows. Does any single row beat another row in *both* columns?
  *   **$R_1$ vs $R_2$:** $R_1$ wins in $C_1$ (4 vs 0), but loses in $C_2$ (0 vs 4). **No dominance.**
  *   **$R_1$ vs $R_3$:** $R_1$ wins in $C_1$ (4 vs 1), but loses in $C_2$ (0 vs 1). **No dominance.**
  *   **$R_2$ vs $R_3$:** $R_2$ loses in $C_1$ (0 vs 1), but wins in $C_2$ (4 vs 1). **No dominance.**

  If you only looked for pure dominance, you'd conclude that all three strategies are viable. You would be wrong.

  #### 2. Check for Mixed Strategy Dominance
  Now, imagine you don't pick a row. Instead, you flip a fair coin.
  *   Heads: Play $R_1$
  *   Tails: Play $R_2$
  *   Probability: $0.5$ on $R_1$, $0.5$ on $R_2$.

  Let's calculate your **expected payoff** for this mixed strategy against whatever the opponent does:

  *   **If Opponent plays $C_1$:**
      *   Expected Payoff = $(0.5 \times 4) + (0.5 \times 0) = \mathbf{2}$
      *   Payoff of $R_3$ = $\mathbf{1}$
      *   **Result:** Mix beats $R_3$ ($2 > 1$).

  *   **If Opponent plays $C_2$:**
      *   Expected Payoff = $(0.5 \times 0) + (0.5 \times 4) = \mathbf{2}$
      *   Payoff of $R_3$ = $\mathbf{1}$
      *   **Result:** Mix beats $R_3$ ($2 > 1$).

  **Conclusion:** The mixed strategy $\sigma = 0.5 R_1 + 0.5 R_2$ **strictly dominates** the pure strategy $R_3$. Even though neither $R_1$ nor $R_2$ dominates $R_3$ on its own, the *combination* does. $R_3$ should be eliminated.

  ---

  ### Why is killing $R_3$ legit? (The Plain Terms Explanation)

  You asked: *"Why is killing that strategy off still legit even tho the 'winning' mix never once beats it head-to-head as a pure strategy?"*

  There is a slight misconception in that phrasing that is important to clear up: **The mix *does* beat it head-to-head.** In game theory, a mixed strategy *is* a strategy. It is a valid move in the game space.

  However, I think what you really mean is: *"Why eliminate $R_3$ when neither ingredient ($R_1$ or $R_2$) is better than $R_3$ in every scenario?"*

  Here is the intuition:

  #### 1. The "Insurance Policy" Logic
  Think of $R_1$ and $R_2$ as two volatile stocks.
  *   $R_1$ booms when the market is Up ($C_1$) and crashes when Down ($C_2$).
  *   $R_2$ crashes when Up ($C_1$) and booms when Down ($C_2$).
  *   $R_3$ is a savings bond. It gives a small, guaranteed return (1) no matter what.

  Individually, $R_1$ is risky (could get 0). $R_2$ is risky (could get 0). $R_3$ feels "safer" because you never get a 0.

  But if you hold **both** $R_1$ and $R_2$ (50/50 portfolio), you have diversified away the risk. You guarantee yourself a payoff of 2, regardless of the market state. Since 2 is strictly better than 1, the "safe" bond ($R_3$) is actually a **bad investment**. It is dominated by the diversified portfolio.

  #### 2. Rationality implies "No Regrets"
  In game theory, we assume agents are rational maximizers.
  If I play $R_3$, and you find out I did it, you could point at my strategy and say: *"You idiot! If you had just randomized between $R_1$ and $R_2$ instead, you would have gotten more points regardless of what I did."*

  Because there exists *some* valid plan (the mix) that yields a higher expected utility than $R_3$ in **every possible contingency**, playing $R_3$ is objectively suboptimal. A rational agent would never assign probability mass to $R_3$.

  #### 3. Why this matters for your RL Project
  In Multi-Agent RL, your policy $\pi(a|s)$ is a probability distribution.
  *   If you keep $R_3$ in your action space, your neural network might waste capacity learning to output a non-zero probability for it.
  *   Since $R_3$ is dominated by a mixture of $R_1$ and $R_2$, the optimal policy will *never* put weight on $R_3$.
  *   By eliminating it via IEDS (including mixed dominance checks), you shrink the action space. This reduces the entropy of your policy search space and can significantly speed up convergence.

  ### The Geometric View (Optional but helpful)
  If you plot the payoffs as points in 2D space (where X-axis is payoff vs $C_1$ and Y-axis is payoff vs $C_2$):
  *   $R_1$ is at point $(4, 0)$.
  *   $R_2$ is at point $(0, 4)$.
  *   $R_3$ is at point $(1, 1)$.

  Any mix of $R_1$ and $R_2$ lies on the line segment connecting them. The midpoint is $(2, 2)$.
  Notice that $(2, 2)$ is "higher and to the right" of $(1, 1)$. In payoff space, "higher and to the right" is always better. $R_3$ is literally **inside the convex hull** of the other strategies. It is geometrically impossible for it to be optimal.

  ### Summary
  You eliminate $R_3$ not because $R_1$ beats it, and not because $R_2$ beats it. You eliminate it because **a randomized combination of $R_1$ and $R_2$ beats it.** Since agents are allowed to randomize (and in RL, they *must* randomize to explore), $R_3$ is dead weight.
