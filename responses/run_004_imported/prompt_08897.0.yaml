      *   *Section 2: The No-Defeater Condition (RLHF/Self-Reward).* Focus on optimization pressure and reward hacking.
      *   *Section 3: Track-Record & Diversity (When does it work?).* Nuance: It's not useless, but it's not "verification." It's uncertainty quantification.
