prompt: |-
  So, I'm a retired evolutionary biologist (forty years of cichlid fish speciation) who's gotten hooked on metaethics since retiring. I'm prepping questions for a live Q&A at our local philosophy circle with a guest who defends a Street-style Darwinian Dilemma against moral realism: natural selection shaped our moral attitudes for fitness, not truth-tracking, so (if I've got this right) its a huge coincidence if they happen to line up with mind-independent moral facts. Can you draft me 8-10 questions that push past her just restating that setup? I want one on the third-factor replies (the Enoch/Wielenberg move, where some natural fact is supposed to explain both why a belief is adaptive and why it's true, so the coincidence dissolves), one on whether the same argument debunks our trust in logic or evolutionary theory itself, since that trust runs through evolved brains too, and one on why basic "adaptive-link" judgments like kin-protection are supposedly harder to debunk than abstract impartial ones like utilitarian equal consideration. Her likely dodge will be "I'm a constructivist, not a nihilist, so this only threatens stance-independent facts" -- give me a follow-up that makes that harder to lean on, plus a final question on what would actually count as evidence against the whole debunking strategy.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the User and Context:**
      *   **User:** Retired evolutionary biologist (40 years cichlid speciation). This means they have deep technical knowledge of evolution, natural selection, adaptation, and fitness landscapes. They are *not* a novice in biology, but they are new to metaethics ("hooked on since retiring").
      *   **Context:** Live Q&A at a local philosophy circle.
      *   **Guest:** Defends a Sharon Street-style Darwinian Dilemma against moral realism.
      *   **Goal:** Draft 8-10 questions that push past the basic setup of the dilemma.
      *   **Specific Requirements:**
          1.  One on third-factor replies (Enoch/Wielenberg).
          2.  One on self-defeat (debunking logic/evolutionary theory itself).
          3.  One on the distinction between adaptive-link judgments (kin-protection) vs. abstract impartial ones (utilitarianism).
          4.  One follow-up to counter the "I'm a constructivist, not a nihilist" dodge.
          5.  One final question on what would count as evidence *against* the debunking strategy.
          6.  Total: 8-10 questions.
          7.  Tone: Respectful but rigorous, leveraging the user's biological expertise without getting bogged down in jargon the philosopher might misuse.

  2.  **Deconstruct the Darwinian Dilemma (Street's Version):**
      *   *Premise 1:* Evolution shaped our moral beliefs.
      *   *Premise 2:* Evolution tracks fitness, not truth.
      *   *Conclusion:* Therefore, it's a coincidence if our moral beliefs track mind-independent moral truths (Realism is untenable).
      *   *Escape Hatch:* Constructivism (moral truths are constituted by our valuing attitudes).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Third-Factor Replies.*
          *   *Idea:* Enoch argues survival is good, so evolution tracking survival tracks goodness. Wielenberg argues certain moral truths are necessary and supervene on natural properties.
          *   *Biologist Angle:* How does selection actually work? Does it track "survival" as a monolithic good, or local fitness peaks?
          *   *Draft:* Street says it's a coincidence. Enoch says survival is the third factor. But as a biologist, I know selection doesn't optimize for "survival" in the abstract, but reproductive success in specific niches. Does the third-factor reply rely on a teleological view of evolution that's biologically inaccurate?

      *   *Requirement 2: Self-Defeat (Logic/Evolution).*
          *   *Idea:* If evolution debunks moral beliefs, does it debunk the belief in evolution? Or logic?
          *   *Biologist Angle:* We use evolved brains to do biology. If the mechanism is untrustworthy for truth, why trust it here?
          *   *Draft:* You use evolved cognitive faculties to argue for this dilemma. If natural selection is indifferent to truth, why trust the logic used to construct the dilemma? Is there a relevant difference between moral faculties and logical faculties?

      *   *Requirement 3: Adaptive-Link vs. Abstract Judgments.*
          *   *Idea:* Kin selection explains "save your child." It doesn't explain "save a stranger equals saving yourself."
          *   *Biologist Angle:* Cichlids show specific adaptations. Moral realism often claims universal truths.
          *   *Draft:* We can easily explain kin-altruism via inclusive fitness. But modern morality often demands impartiality (utilitarianism). If the Darwinian Dilemma relies on the gap between fitness and truth, isn't that gap wider for impartial morality? Does your argument inadvertently grant realism more traction on basic instincts than on refined moral theory?

      *   *Requirement 4: The Constructivist Dodge.*
          *   *Idea:* "I'm not a nihilist, I just think we make the values."
          *   *Counter:* Does this make morality arbitrary? If we evolved differently, would torture be good?
          *   *Draft:* You say you're a constructivist. But if our evaluative starting points are fixed by evolution, isn't your constructivism just realism about human psychology? If we had evolved like solitary wasps, would "cooperation" be false? If so, isn't that just relativism disguised?

      *   *Requirement 5: Evidence Against Debunking.*
          *   *Idea:* What would change your mind?
          *   *Draft:* What empirical or philosophical evidence would convince you that the Darwinian Dilemma fails?

      *   *Filling the Gap (Need 8-10 total).*
          *   Need to leverage the user's cichlid background more.
          *   Need to probe the "coincidence" claim.
          *   Need to ask about the *mechanism* of influence.
          *   Need to ask about convergence.

      *   *Question 6 (Convergence):* In cichlids, we see convergent evolution. Do moral beliefs converge across cultures? If so, does that suggest a truth-tracking mechanism or just similar fitness landscapes?
      *   *Question 7 (The "Influence" Premise):* Street claims evolution *influenced* the content. How specific was this influence? Did it select for "do not kill" or just "fear of social ostracization"?
      *   *Question 8 (Normative Force):* If morality is constructed from evolved attitudes, where does the *normative force* come from? Why *ought* I follow it if I know it's just a fitness hack?
      *   *Question 9 (Refining the Third Factor):* Follow up on Enoch. If survival is the third factor, why do we often judge survival as *not* the highest good (e.g., self-sacrifice)?
      *   *Question 10 (Refining Self-Defeat):* Distinguish between *causal* explanations and *justificatory* reasons.

  4.  **Review and Refine:**
      *   *Check against constraints:* 8-10 questions? Yes. Specific topics covered? Yes. Tone appropriate? Needs to sound like a biologist speaking to a philosopher—precise, empirical, but respectful of the metaphysical stakes.
      *   *Polishing:* Ensure the "Constructivist Dodge" follow-up is sharp. Ensure the "Third Factor" question highlights the biological nuance (selection doesn't aim for truth *or* survival in a global sense, just local replication).

  5.  **Final Polish (incorporating the "Retired Biologist" persona):**
