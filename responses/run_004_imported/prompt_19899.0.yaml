      *   *Work:* *De rege et regis institutione* (On the King and the Education of the King), 1599.
      *   *Argument:* He argued that a tyrant (specifically one who seizes power without consent or rules against the common good) loses his legitimacy. Crucially, he suggested that if no public mechanism exists, a *private individual* might act as an agent of the people to kill the tyrant.
      *   *Context:* Written for the King of Spain (Philip III), but circulated widely.
      *   *Event:* Henry IV of France (a former Huguenot turned Catholic) was assassinated by François Ravaillac (a Catholic fanatic) in 1610. Ravaillac claimed inspiration from tyrannicide theories.
