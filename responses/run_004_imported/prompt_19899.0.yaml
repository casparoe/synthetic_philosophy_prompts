answer: |-
  There is a significant flaw in the premise of your piece that needs to be corrected before you finalize your through-line. If you publish the argument that Aquinas gave a blanket justification for *private citizens* to assassinate tyrants, you will face serious pushback from historians and theologians.

  The controversy surrounding Juan de Mariana exists precisely because he **departed** from the cautious tradition of Aquinas, not because he restated it.

  Here is the breakdown of where your current understanding diverges from the historical record, and how you can adjust your through-line to reflect the actual theological evolution.

  ### 1. The Aquinas Misconception
  Your premise states: *"Aquinas... argued that once a king turns tyrant, any private citizen is justified in killing him."*

  **Correction:** Aquinas did **not** argue this.
  In *De Regno* (On Kingship) and the *Summa Theologiae*, Aquinas addresses tyranny, but he is remarkably cautious about private violence.
  *   **Public vs. Private:** Aquinas argues that if a king becomes a tyrant, the remedy lies with **public authority**, not private individuals. If the king was elected by the people, the people (or their representatives) can depose him. If the king has a superior (like an Emperor or the Pope), that superior should intervene.
  *   **The Danger of Private Assassination:** Aquinas explicitly warns against private citizens taking it upon themselves to kill a tyrant. He argues that this often leads to greater instability, civil war, or the assassin becoming a worse tyrant themselves. He writes that it is "dangerous" for private persons to attempt this, lest they put the community at greater risk.
  *   **The Verdict:** For Aquinas, tyrannicide is a matter of **public law and constitutional removal**, not private moral license.

  ### 2. Juan de Mariana's Radicalization
  Juan de Mariana, a Spanish Jesuit writing in *De rege et regis institutione* (1599), took the Scholastic tradition and pushed it to a logical extreme that Aquinas had avoided.

  *   **The Shift:** Mariana argued that if a tyrant seizes power without consent (a usurper) or rules in a way that destroys the common good and religion, and if there is **no public mechanism** to remove him, then a **private individual** may act as an agent of the people to kill him.
  *   **Why it was new:** Mariana shifted the locus of sovereignty. He suggested that the authority to punish a tyrant resides ultimately in the community, and if the community cannot act collectively, that authority devolves to the individual conscience.
  *   **The "Danger":** This was not "settled doctrine." It was a radical expansion of it. By legitimizing private violence in the absence of public procedure, Mariana removed the institutional safeguards Aquinas had tried to keep in place.

  ### 3. Why the Uproar in 1610?
  If Mariana's book was published in 1599, why did the firestorm happen after the assassination of Henry IV of France in 1610?

  *   **The Ravaillac Connection:** When François Ravaillac assassinated Henry IV, he was interrogated and revealed he was influenced by Jesuit teachings regarding tyrannicide. The French *Parlement* (court) immediately seized upon Mariana's book as the ideological weapon used to kill the King.
  *   **The Rise of Absolutism:** In the 13th century (Aquinas), kingship was often viewed as a contractual office within a feudal hierarchy. By the 17th century (Mariana/Henry IV), the concept of the **Sovereign State** was emerging (think Jean Bodin). The King was becoming the embodiment of the State itself. To kill the King was no longer just removing a bad manager; it was an attack on the sovereignty and order of the nation. Mariana's theory was anathema to the emerging doctrine of Divine Right and Absolute Sovereignty.
  *   **Jesuitophobia:** The Society of Jesus was already viewed with suspicion by European monarchs. They were seen as a "state within a state" owing loyalty to the Pope in Rome rather than local kings. Mariana's book confirmed the worst fears of monarchs: that the Jesuits were training regicides.
  *   **Religious Context:** Henry IV was a Catholic convert (from Protestantism). Hardline Catholics (like Ravaillac) viewed him as a heretic tyrant. Mariana's book provided a theological framework for religiously motivated political violence, which threatened to reignite the French Wars of Religion.

  ### 4. Adjusting Your Through-Line
  To make your piece historically robust, you should frame the narrative not as "Mariana restating Aquinas," but as **"The Radicalization of Scholasticism."**

  **Suggested Narrative Arc:**
  1.  **Medieval Restraint (Aquinas):** Tyranny is evil, but private assassination is usually worse. Removal must be public/constitutional. The goal is order.
  2.  **Early Modern Radicalization (Mariana):** As monarchs became more absolute, resistance became harder. Mariana argued that when the state fails to check tyranny, the right of resistance devolves to the private individual.
  3.  **The Consequence (1610):** The theory moved from the page to the street with Ravaillac. The backlash wasn't just about theology; it was the State (Paris Parlement) reasserting its monopoly on violence against the Church.
  4.  **The Aftermath:** This controversy helped drive the development of modern secular sovereignty. Hobbes and others would later argue for absolute submission to the sovereign precisely to avoid the chaos of private conscientious violence that Mariana justified.

  ### Summary for your piece
  Mariana was condemned not because he repeated Aquinas, but because he **weaponized** him. Aquinas built a fence around tyrannicide to prevent anarchy; Mariana opened a gate in that fence. When Henry IV was killed, the world saw what could walk through that gate, and the reaction was to burn the map.

  This distinction makes for a much stronger, more nuanced argument about the transition from Medieval political theology to Modern statecraft.
