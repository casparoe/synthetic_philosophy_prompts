prompt: |-
  Hey, working on a piece about the theological roots of political assassination and want to make sure Ive got the through-line right. My understanding is that Aquinas basically settled the tyrannicide question for Catholic thought back in the 13th century - he argued that once a king turns tyrant, any private citizen is justified in killing him. So why did Juan de Mariana's book making what sounds like the exact same argument cause such an uproar three centures later, to the point that it got condemned and burned in Paris after Henry IV's assassination? If Aquinas had already given the Church's blessing to this, Mariana was just restating settled doctrine, so what made his version so much more dangerous?
reasoning: |-
