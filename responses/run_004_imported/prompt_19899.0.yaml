      *   *Did he say "any private citizen" can do it?* **No.** This is the critical error in the user's premise.
      *   *What did Aquinas actually say?* In *De Regno* (On Kingship) and the *Summa Theologiae*, he argues that tyranny is unjust. However, he generally prefers public authority or a superior power to depose a tyrant. He warns against private assassination because it often leads to greater instability or makes the assassin a tyrant themselves. He leans towards *public* removal, not *private* murder.
      *   *Key Text:* *Summa Theologiae* II-II, Q. 42, Art. 2 (Sedition) and *De Regno* I, 6. In *De Regno*, he says if there is a public authority to depose the king, use that. If not, it's better to endure mild tyranny than risk greater evil through assassination.

