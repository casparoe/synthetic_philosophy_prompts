answer: |-
  **Setting:** *A comfortably worn leather-armchair corner of a university faculty club. The monthly "Retired Scientists & Philosophers" meetup is winding down. The wine is mostly gone. You (the Physicist) are sitting between the two debaters. On your left is **Dr. Marcus Thorne**, a metaphysician who specializes in the ontology of physical processes. On your right is **Dr. Elena Vance**, a philosopher of science who defends a pragmatic, counterfactual account of causation.*

  **Thorne:** (Swirling the last of his Pinot) You see, this is exactly why your condensed matter work was so much cleaner than our mess. In your lab, if a detector clicks, something hit it. Energy transfer. Momentum exchange. A physical process. But here, with omissions, we are asked to believe that *nothing* can do *something*.

  **Vance:** That's a caricature, Marcus. Nobody says "nothing" does the work. We say the *absence* of an event makes a difference. Look at our case: The fern died. Why? Because the gardener didn't water it.

  **Thorne:** But point to the "not-watering." Show me the four-vector. Show me the conserved quantity flowing from the gardener's inaction to the fern's desiccation. You can't. Because there isn't one. The fern died because of evaporation, cellular collapse, thermodynamic equilibrium. The gardener just… stood there.

  **Vance:** And if he *hadn't* just stood there? If he had poured water? The fern would be alive. That counterfactual dependence is the backbone of causation. David Lewis made this clear. We identify causes by comparing the actual world to nearby possible worlds. In the nearest world where the gardener acts, the fern lives. Therefore, his inaction caused the death.

  **Thorne:** That criterion is too permissive. It's the "Queen of England" problem, and you know it. In the nearest world where the Queen of England waters the fern, the fern also lives. So, by your logic, the Queen's omission is just as much a cause as the gardener's.

  **Vance:** I do know it. And the solution isn't to retreat to your physical process fetish. It's to recognize that causal selection is sensitive to norms and expectations. We pick out the gardener's omission because he had a *duty* to water the fern. The Queen did not.

  **Thorne:** Aha! There it is. You've smuggled ethics into metaphysics. "Duty"? "Expectation"? Those are human constructs. The physical universe doesn't care about job descriptions. If causation is a feature of the world, it shouldn't depend on whether someone signed a contract. If the Queen's counterfactual dependence is identical to the gardener's, but you call one a cause and the other not, you're admitting causation isn't objective.

  **Vance:** I'm admitting that *causal explanation* is objective relative to a context. We don't list every necessary condition for an event. We list the *difference-makers* that are salient to our inquiry. If I'm a botanist, the cause is the lack of water. If I'm a sociologist, the cause is the labor contract. If I'm you, a physicist, the cause is the entropy gradient. All are true. But for the question "Who is responsible for the fern's state?", the gardener's omission is the cause.

  **Thorne:** But that's not causation, Elena. That's *blame*. You're conflating the metaphysical relation with the pragmatic attribution. My view is simpler: The gardener did not cause the death. The environment caused the death. The gardener merely *allowed* it to happen. I'm happy to call this "quasi-causation." It captures the counterfactual dependence without lying about the ontology. There is no process linking the omission to the effect.

  **Vance:** "Quasi-causation." That's just "causation" wearing a hat and pretending it isn't cold. If your "quasi-causation" plays the exact same role in our reasoning, prediction, and explanation as "real" causation, what work is the distinction doing? You're preserving a technical definition of causation at the expense of making it useless for actual science. In medicine, in engineering, in biology, we treat omissions as causes. A failed brake causes a crash. A missing shield causes radiation poisoning. Are you going to tell a nuclear engineer that the missing shield didn't *cause* the leak?

  **Thorne:** I would tell them they are speaking loosely. And look, I can handle the missing shield. The shield's *presence* would have absorbed the neutrons. The absence is just the lack of that absorption process. But I don't need to posit a "ghost process" of absence. I can explain the leak entirely by the motion of the neutrons. The omission adds nothing to the physical story.

  **Vance:** It adds the *reason* the neutrons were there to begin with! If you strip causation down to only positive physical processes, you lose the ability to distinguish between a system functioning normally and a system failing. A heart beating is a process. A heart *stopping* is an omission of beats. If the heart stopping doesn't cause the death, what does? The cessation of blood flow? But that's also an omission of flow! You end up with a regress where nothing ever causes death, only life causes life.

  **Thorne:** (Pauses, takes a sip of water) That's a strong point. I'll grant that "cessation" is tricky. But Dowe's Conserved Quantity theory handles this by focusing on the interaction that *ended*. The cause of death isn't the "not-beating"; it's the final arrhythmia—the last positive electrical discharge that failed to propagate. There is always a positive event at the boundary.

  **Vance:** That feels like gerrymandering. You're scanning the timeline for the last positive blip to avoid saying "the lack of the next blip caused it." But why privilege the last blip? If I shoot you, the bullet's impact is a process. If I starve you, there is no impact. There is just the continued process of your metabolism consuming reserves until they are gone. The cause of your death is my failure to feed you. If you insist on a positive process, you have to say your metabolism killed you, not my starvation.

  **Thorne:** Precisely! Your metabolism killed you. I just didn't stop it from happening. This is the bullet I am willing to bite. It feels counterintuitive, yes. But the alternative is to say that "nothing" has causal powers. That opens the door to magic. If absences can cause, why can't the absence of a unicorn in this room be the cause of us not being trampled?

  **Vance:** Because the absence of a unicorn doesn't make a difference to the actual state of affairs in the relevant way. We are back to norms and expectations. We expect humans to eat. We don't expect unicorns.

  **Thorne:** So causation depends on expectations?

  **Vance:** Causal *attribution* does. The underlying counterfactual dependencies are objective. The fern objectively depends on water. The selection of *which* dependency we label "The Cause" is contextual.

  **Thorne:** And there is the rub. You save the intuition by sacrificing the objectivity. I save the objectivity by sacrificing the intuition. Let's look at your Queen of England fix again. You say she isn't a cause because she had no duty. But suppose the Queen *promised* the gardener she'd water it if he got sick. Now she has a duty. Did the metaphysics of the universe change? Did a new physical process spring into existence between London and the fern the moment she made that promise?

  **Vance:** No physical process. But the *counterfactual landscape* changed. Before the promise, the nearest world where she waters the fern is very distant—it requires a massive miracle of intervention. After the promise, that world is closer; it only requires her keeping her word. The "distance" in modal space shifted.

  **Thorne:** Modal distance isn't physical distance. You're building causation out of similarities between possible worlds, which are themselves defined by… what? Laws of nature? If laws are physical, we're back to my camp. If laws are just regularities, you're circular.

  **Vance:** I'm not circular. I'm pragmatic. Look, Marcus, you're a physicist at heart, even if you do philosophy. You know that in effective field theories, we integrate out high-energy degrees of freedom. We don't track every quark to explain why a glass broke. We talk about stress and strain.

  **Thorne:** Agreed.

  **Vance:** "Omission" is like stress and strain. It's a high-level variable in a macroscopic model. It's real at that level. Insisting on a conserved quantity transfer for every causal claim is like insisting on quark tracking for every glass break. It's ontologically fundamental, maybe, but causally blind.

  **Thorne:** But stress and strain supervene on positive physical states. Tension is molecules pulling on molecules. "Not-watering" does not supervene on a positive state. It supervenes on the *absence* of a state. That is a categorical difference. You can have a theory of effective variables, but they must map to something positive in the base ontology. An omission maps to nothing.

  **Vance:** It maps to the state of the gardener *doing something else*. He was drinking coffee. That positive state is incompatible with watering.

  **Thorne:** But the coffee-drinking didn't kill the fern. The *not-watering* did. You can't identify the cause with the coffee, because he could have been reading a newspaper instead. The cause has to be the omission itself.

  **Vance:** Exactly. The omission is the relevant description of the scene.

  **Thorne:** (Leans forward) So here is where we stand. I have to tell the court that the doctor who failed to administer the antidote did not kill the patient. The poison did. The doctor merely failed to prevent it. It sounds like a defense attorney's dream. It violates every legal and moral instinct we have.

  **Vance:** And I have to tell the court that causation is partly a matter of social norms. If the Queen had no duty, her inaction wasn't a cause. If she did, it was. The metaphysics bends to the context.

  **Thorne:** I'd rather bend the language than the world. I'll keep "quasi-causation." It signals: "This looks like a cause, it functions like a cause in our reasoning, but ontologically, it's a gap, not a link."

  **Vance:** And I'll say that "quasi-causation" is just an apology for not having a broad enough ontology. If your fundamental theory of causation can't account for why the fern died without referencing the gardener, your theory is too narrow for the world we actually live in.

  **Thorne:** Or the world we live in is messier than your models allow.

  **Vance:** Or your models are built for particles, not people.

  *(They both fall silent. Thorne stares at the dregs of his wine, contemplating the absence of alcohol in the glass. Vance watches him, waiting to see if he refills it, knowing that his action—or inaction—will immediately become data for their argument.)*

  **Thorne:** (Finally) If I don't refill this, and you get a headache… did I cause it?

  **Vance:** If you were holding the bottle? Yes.

  **Thorne:** Then I'm not refilling it. Just to test the theory.

  **Vance:** (Smiling) See? You believe in omissions after all.

  **Thorne:** No. I believe in your impending headache. The rest is just commentary.

  *(The Physicist sighs, reaches for the bottle, and pours for both of them.)*
