prompt: |-
  I'm taking a course in mathematical logic this term, and when we covered Skolem's paradox, the discussion stayed at the level of the general slogan that ZFC, if consistent, has a countable model that nevertheless proves the existence of uncountable sets. I'd like to work through the mechanics on a specific example rather than leave things at that level of abstraction. Let M be a countable transitive model of ZFC, and let δ be the ordinal that M itself computes to be ω₁. Please explain concretely why δ is in fact a countable ordinal, and pinpoint exactly which feature of M is responsible for M nonetheless correctly satisfying the statement "δ is uncountable," without this amounting to a genuine contradiction. Close with a sentence on what you take this example to show about whether uncountability is an absolute property of a set, or only ever relative to a model.
