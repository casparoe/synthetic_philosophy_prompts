      *   **Move (3) Economist:** "Economics isn't denying second thoughts... refuses to call something a preference unless it shows up in a choice... 'I want to quit' is cheap talk."
          *   *Concept:* Operationalism. Preferences must be observable to be scientific (behaviorism).
          *   *Validity:* Consistent with methodological behaviorism in economics.
          *   *Limitation:* "Cheap talk" ignores the predictive power of stated intentions in certain contexts (e.g., therapy, commitment devices).

      *   **Move (4) Psychologist:** "Economists invoke exactly this... justify cigarette taxes... protecting smokers from their own addiction... 'true' preference apart from the addicted choice."
          *   *Concept:* Behavioral Welfare Economics, Paternalism, Internalities.
