prompt: |-
  I run a tiny podcast where I talk to people about weird corners of theory that overlap with software, and next week's guest is a decision theorist who works on program equilibrium -- 'open source game theory' where each player submits a program that reads the other player's code before acting, and this supposedly gets you real cooperation in a one shot prisoners dilemma with no repeated play and no referee. I only half get it, so can you write me 8-10 interview questions that dig into the actual mechanics instead of just letting her restate the concept? I want one that presses on the circularity you get when two 'cooperate iff I can prove you cooperate' programs try to reason about each other -- I think Löb's theorem and something called FairBot is the usual fix, but that always felt like a trick, and isn't predicting another program's behavior just the halting problem anyway? I want one on whether requiring full mutual source-code transparency is realistic outside of toy examples (smart contracts maybe?), or if that's the load bearing cheat in the whole setup. And one on the fact that if programs can check anything about each other, doesnt the same trick let you enforce nasty exploitative equilibria just as easily as cooperative ones -- so why is cooperation the headline result and not, like, mutual blackmail? For each, add a follow up keyed to whatever answer she'd probably give, and end on a question about what would actually make her give up on the whole approach.
