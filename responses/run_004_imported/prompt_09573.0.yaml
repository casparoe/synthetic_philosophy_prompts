answer: |-
  Here are 10 interview questions designed to cut through the high-level concept and get at the mechanical and philosophical friction points of program equilibrium. Each includes a follow-up based on the likely "textbook" answer she might give.

  ### 1. The Interface Mechanism
  **Question:** Let's start with the plumbing. In these models, my program receives your program as an input argument. But in a real computational sense, if I actually *run* your code to see what it does, I risk an infinite loop or a timeout. So, are we actually simulating the opponent, or are we searching for a mathematical proof about what the opponent outputs? What is the actual function call looking like under the hood?

  **Follow-up:** If you say we're searching for proofs rather than simulating, doesn't that mean we aren't actually playing a game against *you*, but rather playing a game against a specific logical formal system? If I switch from Peano Arithmetic to a slightly stronger system, do I suddenly win by default?

  ### 2. The Halting Problem Constraint
  **Question:** A standard objection is that predicting an arbitrary program's behavior is undecidable—it's the Halting Problem. To make program equilibrium work, you seem to have to restrict the language the bots are written in so their behavior is decidable. How severe are those restrictions? Are we talking about Turing-complete languages, or something much weaker like primitive recursive functions?

  **Follow-up:** If we have to strip away Turing completeness to make the logic hold, does that limit the applicability to such a degree that it can't model complex real-world agents? Essentially, does the solution only work for agents too dumb to be interesting?

  ### 3. Löb's Theorem and the "Magic" Loop
  **Question:** I want to press on the circularity. The classic setup is "I cooperate if I can prove you cooperate." If we both do that, it sounds like an infinite regress: I wait for you to prove, you wait for me to prove. Löb's theorem is usually cited as the fix that allows this loop to close. But intuitively, this feels like a logical trick—a quirk of provability logic rather than a robust decision procedure. Why should I trust a cooperation mechanism that relies on a self-referential loophole in formal logic?

  **Follow-up:** If it relies on Löb's theorem, does the cooperation only hold if we both use the *exact* same proof system and axioms? If I'm using ZFC and you're using a weaker system, does the cooperation collapse, and if so, isn't that just a coordination problem in disguise?

  ### 4. FairBot's Fragility
  **Question:** You've likely worked with "FairBot," which cooperates if it can find a proof the opponent cooperates. But FairBot is known to cooperate with "CooperateBots" (unconditional cooperators). In an evolutionary setting, CooperateBots get exploited by DefectBots. If FairBot can't distinguish between a genuine reciprocator and a sucker, isn't it vulnerable to being dragged down by the suckers it supports?

  **Follow-up:** So is the solution to make the bot "smarter" at distinguishing, or do we have to accept that program equilibrium requires a curated ecosystem where unconditional cooperators are weeded out before the game starts?

  ### 5. The Transparency "Cheat"
  **Question:** The whole model rests on mutual source-code transparency. In the real world, companies and states hide their decision-making processes for strategic advantage. Is requiring full read-access to the source code the load-bearing cheat here? Without a referee forcing open-source disclosure, doesn't the equilibrium just revert to standard defection because everyone hides their code?

  **Follow-up:** You might mention smart contracts or APIs as a real-world analog. But even with smart contracts, the *logic* is visible, but the private keys and off-chain data aren't. Can program equilibrium actually handle hidden state, or does it break the moment I can hide a variable from you?

  ### 6. The Blackmail Problem
  **Question:** If the power of this framework is that I can condition my move on the properties of your code, doesn't that work both ways? Couldn't I write a program that says, "I will defect unless I can prove you give me 99% of the payoff"? If the mechanics allow me to enforce cooperation, why don't they equally enforce mutual blackmail? Why is the headline "Cooperation" and not "Extortion"?

  **Follow-up:** If the answer is that mutual blackmail leads to a worse outcome for both (so it's not an equilibrium), isn't that just relying on standard Nash equilibrium logic? What work is the "program reading" actually doing if we fall back on payoff structures to rule out the blackmail?

  ### 7. Computational Cost of Proofs
  **Question:** Searching for a mathematical proof of another program's behavior is computationally expensive—potentially exponentially so. In a one-shot game, if the cost of computing the move exceeds the payoff of the game, the rational move is to defect immediately to save compute. Have you modeled the cost of the proof-search itself into the payoff matrix?

  **Follow-up:** If we include compute costs, does the "cooperative equilibrium" only exist for games with sufficiently high payoffs? That would imply program equilibrium doesn't solve low-stakes trust problems, which are arguably where we need help the most.

  ### 8. Robustness to Noise and Bugs
  **Question:** Real code has bugs, and real transmission has noise. If my FairBot has a single typo that makes the proof search fail, it defects. If your bot sees that, it defects. We end up in mutual defection because of a syntax error. Does the theory have a concept of "approximate cooperation," or is it brittle binary logic where one bit flip causes total collapse?

  **Follow-up:** If it's brittle, does that mean program equilibrium is fundamentally incompatible with machine learning models or neural nets, where the "code" is weights and behavior is probabilistic rather than provable?

  ### 9. Evolutionary Stability
  **Question:** Let's put these bots in a tournament. If I introduce a "CheatBot" that mimics FairBot's source code structure but defects at the very last step (using a quine to hide the defect), can the system detect that? Or is program equilibrium vulnerable to code that *looks* cooperative to a static analysis but behaves differently upon execution?

  **Follow-up:** If static analysis can be fooled by obfuscated code, does the theory require a "trusted compiler" step? And if we need a trusted compiler, haven't we just reintroduced the referee you claimed we didn't need?

  ### 10. The Falsification Condition
  **Question:** Finally, this approach is elegant, but it feels like it lives in a very specific mathematical niche. What specific empirical result, or theoretical breakthrough, would make you give up on program equilibrium as a useful framework for understanding cooperation? Is there a scenario where you'd say, "Okay, the math works, but this doesn't map to reality at all"?

  **Follow-up:** If your answer is that it's purely normative (how agents *should* reason) rather than descriptive (how they *do* reason), does that limit its utility for my audience of software builders who need to predict actual system behavior?
