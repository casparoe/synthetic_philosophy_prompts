prompt: |-
  I'm teaching a graduate seminar on reference and modality this semester, and we've just spent two weeks working through Kripke's arguments against descriptivism in *Naming and Necessity* before turning to Chalmers's and Jackson's epistemic two-dimensionalist machinery for handling the necessary a posteriori. The usual selling point, as I present it in lecture, is that a term like "water" gets assigned both a secondary intension (a function from counterfactual worlds to extensions, evaluated by holding fixed what water actually turns out to be, which is why "water is H2O" comes out necessary) and a primary intension (a function from epistemically possible scenarios, or centered worlds, to extensions, supposed to be a priori accessible to any competent thinker, and which is what explains why the identity nonetheless feels contingent and informative before any chemistry gets done).

  One of my students pushed back hard on this in discussion, and I haven't been able to shake her objection since. She pointed out that specifying the primary intension of "water" at all seems to require crediting speakers with something like a general, a priori reference-fixing condition -- "whatever dominant, clear, drinkable liquid fills the oceans and lakes hereabouts," or some more idealized rational reconstruction of it -- that picks out an extension in each scenario. But, she argued, that condition just is a description, however dispositional or unarticulated, and once the theory is committed to it, all three of Kripke's classic arguments against descriptivism -- the modal argument, the epistemic argument, and the semantic, Gödel-Schmidt-style argument -- resurface against primary intensions with essentially undiminished force, since none of the three actually turned on the relevant descriptions being simple, consciously entertained, or common knowledge among speakers. I'd like to give the objection its due before I respond to her in next week's session. Could you construct, as rigorously and charitably as you can, the strongest version of the argument that epistemic two-dimensionalism earns no real explanatory advantage over classical descriptivism about names and natural kind terms, because its primary-intension apparatus is best understood as a notational variant of a reference-fixing description theory, and so inherits every one of Kripke's original objections to descriptivism?
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on reference and modality. Covered Kripke (*Naming and Necessity*) and now Chalmers/Jackson (Epistemic Two-Dimensionalism or E2D).
      *   **The Student's Objection:** E2D's "primary intension" is just a reference-fixing description in disguise. Therefore, Kripke's three arguments (Modal, Epistemic, Semantic) apply to primary intensions just as they did to classical descriptivism. Thus, E2D offers no explanatory advantage.
      *   **The Task:** Construct the *strongest, most rigorous, and charitable version* of this argument. The goal is to give the objection its due before the instructor responds.
      *   **Tone:** Academic, philosophical, rigorous, charitable to the student, suitable for a graduate seminar context.

  2.  **Deconstruct the Student's Objection:**
      *   *Core Claim:* Primary Intensions (PIs) $\approx$ Reference-Fixing Descriptions (RFDs).
      *   *Implication:* If PIs are RFDs, then E2D collapses into a form of descriptivism (specifically, a two-dimensional descriptivism).
      *   *Consequence:* Kripke's arguments against descriptivism apply to PIs.
      *   *Conclusion:* E2D fails to solve the problems it was designed to solve (the necessary a posteriori, the feeling of contingency, etc.) without falling into the same traps as the theory it replaced.

  3.  **Identify the Key Components of Kripke's Attack on Descriptivism:**
      *   *Modal Argument:* Names are rigid; descriptions are non-rigid. "Aristotle might not have taught Alexander."
      *   *Epistemic Argument:* Identity statements involving names are necessary a posteriori; descriptions yield contingent a priori truths. "Hesperus is Phosphorus" vs. "The evening star is the morning star."
      *   *Semantic Argument (Gödel/Schmidt)::* Speakers can refer successfully even if their associated descriptions are false or insufficient.

  4.  **Map Kripke's Attacks onto Primary Intensions (The "Collapse Argument"):**
      *   *The Modal Collapse:* If the PI is a function from centered worlds to extensions based on a condition $C$, then in a counterfactual world $W$, the term refers to whatever satisfies $C$ in $W$. But this makes the term non-rigid *with respect to the primary intension*. E2D admits this (that's the point of the 2D framework), *but* the student argues that if the PI *is* the meaning (or the cognitive content), then the term behaves like a description in the contexts that matter for cognition.
      *   *The Epistemic Collapse:* E2D says $S$ is a priori iff $S$ is true on all primary intensions. If the PI is determined by a description $D$, then "Water is $D$" is a priori. But Kripke argued reference-fixing descriptions don't give a priori knowledge of the essence. If E2D says they do (via the PI), it conflicts with the intuition that we don't know the nature of water a priori.
      *   *The Semantic Collapse:* Do speakers actually possess the PI? If the PI is "the watery stuff," do speakers know that? If they are wrong about the properties (e.g., they think water is an element), does the PI fail? E2D usually idealizes, but if it idealizes too much, it becomes unpsychological. If it doesn't, it faces the Gödel/Schmidt case (what if the "watery stuff" is actually XYZ in the actual world but we call it water?).

  5.  **Drafting the Argument - Step-by-Step:**

      *   *Introduction:* Frame the objection as the "Collapse Objection." Acknowledge the sophistication of E2D but state the thesis: E2D is descriptivism in 2D clothing.
      *   *Premise 1: The Nature of Primary Intensions.* Define PI clearly. It maps epistemic possibilities to extensions. How is this determined? By the conditions a speaker associates with the term.
      *   *Premise 2: The Descriptivist Equivalence.* Argue that these conditions *are* descriptions. Even if "deferential" or "causal," they function as satisfaction conditions.
      *   *Premise 3: Re-applying Kripke's Modal Argument.* If PI is descriptive, it varies across worlds. E2D accepts this for the "epistemic" dimension, but if the *cognitive significance* is captured by the PI, then the term is cognitively equivalent to a non-rigid designator. This undermines the claim that we grasp the *term* as rigid.
      *   *Premise 4: Re-applying Kripke's Epistemic Argument.* E2D claims "Water is H2O" is necessary a posteriori (Secondary Intension) but epistemically contingent (Primary Intension). However, if the PI is fixed by a description $D$, then "Water is $D$" becomes a priori. But is it? Do we really know a priori that water is the "clear, drinkable liquid"? What if we are brains in a vat? The PI relies on an indexical "actual" which smuggles in causal contact, undermining the "a priori" claim.
      *   *Premise 5: Re-applying Kripke's Semantic Argument.* The Ignorance and Error problem. If the PI is "watery stuff," and it turns out watery stuff is XYZ (Twin Earth), E2D says reference shifts. But in the *actual* world, if our description is wrong (e.g., water is a micro-structure we haven't found), does the PI fail? E2D relies on an idealized rationality. If the idealization is too strong, it's not psychological. If too weak, it fails to determine reference.
      *   *Conclusion:* E2D doesn't escape descriptivism; it just relocates the description to the first dimension. Therefore, it inherits the vulnerabilities.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* E2D proponents (Chalmers) explicitly distinguish PIs from reference-fixing descriptions. They say PIs are about *epistemic possibilities*, not metaphysical ones.
      *   *Counter-Critique (for the student's argument):* The distinction is verbal. To evaluate a PI at a centered world, you need a condition to check. That condition acts exactly like a reference-fixing description. The "epistemic" label doesn't change the logical structure of the reference determination.
      *   *Focus:* Make sure to emphasize that Kripke's arguments target the *mechanism of reference determination*, not just the surface grammar of descriptions. If E2D uses a mechanism that looks like satisfaction of conditions, Kripke's objections apply.
      *   *Key Terminology:* Use "Collapse Argument," "Notational Variant," "Epistemic Rigidity," "De Re vs. De Dicto."

  7.  **Structuring the Output:**
      *   Title: Formalizing the "Collapse Objection."
      *   Introduction: Contextualize the student's pushback.
      *   The Core Thesis: E2D $\equiv$ Refined Descriptivism.
      *   Argument Section 1: The Modal Collapse (Rigidity).
      *   Argument Section 2: The Epistemic Collapse (A Priority).
      *   Argument Section 3: The Semantic Collapse (Ignorance/Error).
      *   The "Idealization" Trap: Addressing the E2D defense.
      *   Conclusion: Summary of the dialectical stalemate.

  8.  **Final Polish:** Ensure the tone is respectful to both Kripke and Chalmers/Jackson while vigorously defending the student's insight. Make it suitable for a handout or lecture notes for a grad seminar. (Ensure I don't solve the problem, just articulate the problem as requested).

      *(Self-Correction during drafting)*: I need to be careful not to conflate the *secondary* intension (which E2D agrees is rigid) with the *primary*. The student's point is that the *primary* intension does the cognitive work, and *that* is descriptive. So the objection is that E2D saves rigidity only by sacrificing the cognitive content to descriptivism, which means it hasn't solved the *epistemic* puzzle without accepting descriptivism's flaws.

      *Refining the Epistemic Point:* Kripke says reference-fixing descriptions yield contingent a priori. E2D says Primary Intensions yield epistemic possibilities. If PI = RFD, then "Water is the watery stuff" is a priori. But Kripke would say "The actual watery stuff is water" is contingent a priori. E2D treats the PI as capturing the "way the world is given." If that "way" is descriptive, Kripke's worry about contingency remains.

      *Refining the Semantic Point:* If I have a false belief about water (e.g., it's a fundamental element), does my PI fail? Chalmers says we idealize. The student says idealization = classical descriptivism's "cluster" theory, which Kripke also attacked.

      *Okay, ready to write.*
answer: |-
  Here is a rigorous reconstruction of your student's objection, formulated as a formal philosophical argument suitable for a graduate seminar handout or lecture notes. It frames the objection as a **Collapse Argument**, aiming to show that Epistemic Two-Dimensionalism (E2D) is extensionally and intensionally equivalent to a sophisticated reference-fixing descriptivism, thereby inheriting its vulnerabilities.

  ***

  # The Collapse Objection: Epistemic Two-Dimensionalism as Descriptivism in Disguise

  ## 1. The Core Thesis
  The student's objection can be formalized as the claim that **Primary Intensions (PIs) are functionally identical to Reference-Fixing Descriptions (RFDs).**

  While proponents of E2D (Chalmers, Jackson) insist that PIs are not descriptions but rather functions from centered worlds to extensions grounded in epistemic possibilities, the *mechanism* by which a PI determines an extension in a given scenario relies on satisfaction conditions. If a term $t$ picks out object $x$ in scenario $w$ because $x$ satisfies condition $C$ in $w$, then $C$ functions as a description. If $C$ functions as a description, the machinery of E2D does not escape the logical structure of descriptivism; it merely relocates the description from the metaphysical dimension (where Kripke attacked it) to the epistemic dimension.

  Consequently, E2D earns no explanatory advantage. It solves the problem of the necessary a posteriori only by conceding that the *cognitive content* of names is descriptive, thereby inviting Kripke's original trilemma (Modal, Epistemic, Semantic) to apply to the primary intension.

  ## 2. Argument I: The Modal Collapse (The Rigidity Objection)
  **Kripke's Original Point:** Names are rigid designators (they pick out the same object in all possible worlds); descriptions are non-rigid (they pick out whoever/whatever satisfies the description in that world).

  **The Student's Reconstruction:**
  1.  In E2D, the **Secondary Intension** captures metaphysical modality (rigid), while the **Primary Intension** captures epistemic modality (non-rigid).
  2.  E2D claims the cognitive significance of a term is captured by its Primary Intension (this is why "Water is H2O" is informative; the PIs differ).
  3.  However, the Primary Intension of "water" maps a scenario $w$ to whatever plays the "water-role" in $w$ (e.g., the clear, drinkable liquid in the lakes).
  4.  This mapping is non-rigid across epistemic scenarios. In a Twin-Earth scenario, "water" picks out XYZ.
  5.  **The Collapse:** If the cognitive content of "water" is exhausted by its Primary Intension, then cognitively, "water" behaves exactly like a non-rigid description.
  6.  Kripke argued that if names were descriptive, "Aristotle might not have been Aristotle" would be intelligible. E2D admits this is intelligible *epistemically* (via the PI).
  7.  **Conclusion:** E2D preserves rigidity only at the cost of admitting that the *epistemically accessible* content of the name is non-rigid. Thus, regarding the aspect of meaning accessible to the speaker (the PI), E2D concedes the descriptivist claim that names function like non-rigid descriptions. It saves rigidity metaphysically but loses it cognitively, which is where the descriptivist intuition lived in the first place.

  ## 3. Argument II: The Epistemic Collapse (The A Priority Objection)
  **Kripke's Original Point:** Reference-fixing descriptions yield contingent a priori truths (e.g., "Stick S is one meter long at $t_0$"). They do not yield necessary truths, nor do they capture the essence of the object.

  **The Student's Reconstruction:**
  1.  E2D claims that a sentence $S$ is a priori iff its Primary Intension is true at all centered worlds.
  2.  For "Water is the watery stuff," the PI is true at all centered worlds (by definition of the PI). Thus, E2D treats this as a priori.
  3.  However, the "watery stuff" condition acts as a reference-fixing description $D$.
  4.  Kripke argued that reference-fixing descriptions do not give us knowledge of the *object* a priori, only of the *stipulation*. We know "The actual $F$ is $F$" a priori, but not "The actual $F$ is $G$" (where $G$ is the essence).
  5.  **The Collapse:** E2D relies on the PI to explain the "contingent feel" of "Water is H2O." It says the PI of "water" and "H2O" differ. But if the PI of "water" is determined by a descriptive condition $D$, then the statement "Water is $D$" is a priori.
  6.  But is it really a priori that water satisfies $D$? If $D$ includes "actual liquid in lakes," this relies on an indexical "actual." Kripke showed that indexical reference-fixing ("Let 'one meter' name the length of *this* stick") yields contingent a priori knowledge.
  7.  **Conclusion:** E2D classifies the connection between a name and its reference-fixing condition as a priori (via the PI). But Kripke showed this connection is contingent. E2D therefore misclassifies contingent a priori truths as necessary a priori truths (relative to the epistemic dimension), or it must admit that the PI is contingent, in which case it fails to ground the stable cognitive content required for communication.

  ## 4. Argument III: The Semantic Collapse (The Ignorance and Error Objection)
  **Kripke's Original Point:** Speakers can refer successfully even if their associated descriptions are false (Gödel/Schmidt case) or if they possess no unique identifying description (Feynman case).

  **The Student's Reconstruction:**
  1.  For a Primary Intension to function, a speaker must possess a condition $C$ that determines the extension across epistemic scenarios.
  2.  If $C$ is specific (e.g., "clear, drinkable liquid"), speakers are vulnerable to error (e.g., if water were actually a gas in disguise, or if the lakes were filled with wine).
  3.  If $C$ is vague or general (e.g., "whatever causes these experiences"), it fails to uniquely determine an extension in many scenarios (underdetermination).
  4.  **The E2D Defense:** Proponents argue PIs are *idealized* rational reconstructions, not necessarily conscious psychological states.
  5.  **The Counter:** If PIs are idealized reconstructions, they are theoretically posited entities, not psychological realities.
      *   If they are psychological: They face the Ignorance/Error objection (speakers often lack the correct condition).
      *   If they are idealized: They are indistinguishable from the "Cluster Concept" descriptivism (Searle, Strawson) that Kripke already defeated. Kripke argued that no cluster of descriptions is necessary for reference. If the PI is a "rational reconstruction" of a cluster, it is still a cluster.
  6.  **Conclusion:** E2D faces a dilemma. Either PIs are psychological, in which case speakers frequently lack them (failing the theory's empirical adequacy), or they are idealized, in which case they are merely sophisticated clusters vulnerable to Kripke's Gödel/Schmidt argument (failing the theory's logical adequacy).

  ## 5. The "Notational Variant" Charge
  The student's most damaging claim is that E2D is a **notational variant** of two-dimensional descriptivism (à la Davies and Humberstone, or even Lewis).

  *   **Classical Descriptivism:** Meaning = Description. Reference = Satisfier of Description.
  *   **E2D:** Primary Meaning = Function from Scenarios to Extensions. Reference = Value of Function.

  But a function from scenarios to extensions *just is* a set of satisfaction conditions across worlds. To say "In scenario $w$, 'water' refers to $x$" is to say "In scenario $w$, $x$ satisfies the condition associated with 'water'."

  If the "condition associated" is not a description, what is it?
  *   If it is causal: It is not a priori accessible (violating E2D's epistemic goals).
  *   If it is descriptive: It is vulnerable to Kripke.
  *   If it is primitive: It is unexplained magic.

  Therefore, E2D attempts to have its cake and eat it too. It wants the **epistemic accessibility** of descriptivism (to explain cognitive significance) without the **modal fragility** of descriptivism (to explain rigidity). The student argues this is impossible. By grounding cognitive significance in the Primary Intension, E2D accepts that the *cognitive mode of presentation* is descriptive. Kripke's arguments show that descriptive modes of presentation cannot secure reference. Therefore, E2D cannot explain how we refer *using* those primary intensions without falling into the same referential failures Kripke identified.

  ## 6. Summary for Seminar Discussion
  The student's objection forces us to ask: **Does the Primary Intension do any work that a Reference-Fixing Description could not do?**

  If the answer is **No**, then E2D is simply descriptivism with extra steps, and Kripke's arguments apply mutatis mutandis.
  If the answer is **Yes**, the burden is on the E2D proponent to specify the nature of the Primary Intension without appealing to satisfaction conditions that look like descriptions.

  The strength of the objection lies in pointing out that **epistemic possibilities are evaluated via descriptive conditions.** If I ask, "Is this stuff water?" in a counterfactual scenario, I am asking, "Does this stuff satisfy the condition I associate with 'water'?" That association *is* the description Kripke warned us about.

  ***

  ### Instructor's Note for Next Session
  This reconstruction gives your student's objection maximum force. It avoids caricaturing E2D (by acknowledging the distinction between primary and secondary intensions) but argues that the distinction is insufficient to block Kripke's deeper metaphysical and semantic points.

  In your response, you might consider focusing on:
  1.  **The status of "scenarios":** Are they metaphysically possible worlds or purely epistemic constructs? (Chalmers argues the latter).
  2.  **The nature of the "condition":** Is it a *conceptual* truth or a *reference-fixing* stipulation?
  3.  **The role of Rigidity:** Does E2D need the PI to be rigid? (Usually no, but does that matter for reference?).
  4.  **Semantic Value vs. Cognitive Content:** Does E2D claim the PI *is* the meaning, or just that it *captures* the cognitive significance? (This distinction is the usual escape hatch).

  This framework should allow for a high-level dialectic that respects both the Kripkean orthodoxy and the Two-Dimensionalist innovation.
