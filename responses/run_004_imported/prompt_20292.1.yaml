      *   **Pro-Tillemans/Westerhoff (Classical/Contextualist):** Let's call him *Marcus*. He needs to be precise about semantic contexts, *svabhāva* (intrinsic nature), and the pragmatic/therapeutic function of logic. He should emphasize that Nāgārjuna is diagnosing errors, not positing a new metaphysics of contradiction.

