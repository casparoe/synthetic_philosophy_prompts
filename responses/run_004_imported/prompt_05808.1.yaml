answer: |-
  This is a fantastic catch. You have identified exactly where most secondary literature glosses over the actual texture of Bradley's argument. Reading *Appearance and Reality* directly is indeed a shock because the "two-line gloss" (relations need relations ad infinitum) is actually the *second* stage of his attack, not the first.

  You are right to be suspicious of the "vicious circle" claim. To a modern ear, mutual dependence sounds like structuralism, coherentism, or systems theory. So why does Bradley treat it as a *reductio*?

  Here is the breakdown of what is happening in that passage, how it connects to the famous regress, and why Russell lost sleep over it.

  ### 1. Why "Mutual Presupposition" is a Contradiction for Bradley
  Your intuition that this looks like holism is correct *if* you assume a coherentist theory of truth. But Bradley is an Idealist working with a much stricter, almost Spinozistic criterion for "Reality."

  For Bradley, for something to be **Real** (as opposed to "Appearance"), it must be **self-intelligible** and **non-contradictory**. It must be able to stand on its own feet conceptually.

  When Bradley says "Relation presupposes Quality, and Quality presupposes Relation," he is making an epistemic/logical point about analysis, not just an ontological point about dependence.
  *   **Relation presupposes Quality:** You cannot have a relation without *terms* (relata). A relation must be a relation *of* something. Those "somethings" are qualities/terms.
  *   **Quality presupposes Relation:** A quality cannot be defined in isolation. To be a specific quality (e.g., "red"), it must be distinguished from other qualities (e.g., "blue"). Distinction is a relational concept. Furthermore, a quality must be related to the substance it inheres in.

  **The Vicious Circle:**
  If I ask, "What is a Relation?" you say, "It's a tie between Qualities."
  If I ask, "What is a Quality?" you say, "It's a term standing in Relations."

  For Bradley, this isn't a stable web; it's a definitional deadlock. You cannot ground the analysis of either concept without already assuming the other. If Reality is supposed to be intelligible, you should be able to start somewhere. If every starting point requires the other to already be in place, the concepts are "infected." They have no independent content.

  So, the "extra step" that turns dependence into contradiction is Bradley's demand for **foundational intelligibility**. He isn't saying "these things can't exist together"; he's saying "you cannot give an account of what these things *are* without begging the question."

  ### 2. Is this the "Bradley's Regress"?
  This is the crux of your second question. The passage you quoted is **not** the famous infinite regress yet. It is the **dilemma** that sets the stage for the regress.

  Scholars usually distinguish two moves in Chapter 3:
  1.  **The Circle of Quality and Relation (The passage you found):** This argues that the *constituents* of a complex fact are mutually dependent and therefore unintelligible in isolation.
  2.  **The Regress of Relating Relations (The famous argument):** This argues that even if you grant the existence of qualities and relations, you cannot explain how they **combine**.

  The regress comes a few pages later. Bradley asks: Suppose we have term *a*, term *b*, and relation *R*.
  *   Does *R* actually relate *a* and *b*?
  *   If *R* is just another thing (a universal or a particular), it sits alongside *a* and *b*. We now have a list: *a, b, R*.
  *   To tie *R* to *a*, we need a new relation, *R1*.
  *   To tie *R1* to *R* and *a*, we need *R2*.
  *   Ad infinitum.

  **How they connect:**
  The "mutual presupposition" passage shows that the *terms* are unstable. The "regress" passage shows that the *glue* is unstable. Together, they are meant to prove that **Relations are Appearance.**

  So, when people name-drop "Bradley's Regress," they are usually referring to the second part (the glue problem). But the first part (the circle) is Bradley clearing the deck to show that you can't solve the glue problem by appealing to the intrinsic nature of the terms, because the terms themselves are relationally defined.

  ### 3. Why Russell Took This Seriously (The Unity of the Proposition)
  You asked why Russell didn't just laugh this off. The reason is that Russell, in his early analytic phase, wanted to believe in **external relations**. He wanted to say that "A is to the left of B" is a fact where A and B remain exactly what they are, independent of the relation.

  Bradley's argument threatens the **Unity of the Proposition**.
  *   Consider the proposition: "Socrates is wise."
  *   Constituents: `Socrates` + `Wisdom`.
  *   Problem: `Socrates` + `Wisdom` is just a list. "Socrates, Wisdom." That isn't true or false; it's just a heap.
  *   To make it a proposition, there must be a "copula" or a tie that makes it "Socrates **is** wise."

  Bradley's regress says: If that "is" (the tie) is just another object in the list, you haven't unified anything. You just have `Socrates`, `Wisdom`, `is`. Now you need a tie for those three.

  Russell realized that if Bradley is right, **logic is impossible.** Logic depends on propositions having unity (being capable of truth/falsehood). If propositions are just heaps of terms, they can't be true.

  Russell's solution (which evolved over time) was to posit that the **verb** in a proposition is not just another term. It performs a "combining" function that is sui generis. In *The Philosophy of Logical Atomism*, he argues that the relation is not a "constituent" in the same way the terms are; it is the **structure** itself.

  Bradley forced Russell to admit that you cannot treat logical form as just another object. That insight is the grandfather of Wittgenstein's picture theory (propositions show their sense; they don't say it) and the distinction between **objects** and **logical form**.

  ### 4. Is Bradley Equivocating?
  You suspect Bradley might be equivocating on "relation." You are in good company; Russell eventually concluded exactly this.

  Bradley slides between:
  1.  **Relation as a Universal:** (e.g., "Loving" as a concept).
  2.  **Relation as a Particular Instance:** (e.g., "This specific loving event").
  3.  **Relation as a Logical Function:** (The act of relating).

  Bradley's attack works best if you treat relations as **constituents** (things that exist alongside their terms). If you treat relations as **modes of existence** or **logical functions**, the regress arguably doesn't get off the ground.

  However, Bradley would reply: "If the relation is not a 'thing' (constituent), then what is it? If it's nothing, it can't relate. If it's something, it needs relating."

  He is forcing a dilemma: **Either relations are substances (which leads to regress) or they are nothing (which leads to no connection).** He thinks there is no middle ground.

  ### Summary for your argument with your friend
  1.  **The Passage:** The "mutual presupposition" bit is Bradley arguing that the *concepts* of Quality and Relation are mutually dependent to the point of unintelligibility. It's not holism; it's a claim that neither can be grounded.
  2.  **The Regress:** The famous infinite regress is a *separate but subsequent* argument in the same chapter. The circle undermines the terms; the regress undermines the glue.
  3.  **States of Affairs:** Your friend is half-right. Contemporary "states of affairs" (Armstrong, etc.) are often designed specifically to block Bradley's Regress by positing a "non-mereological composition." They admit Bradley's challenge is the central problem of metaphysics. They aren't necessarily a "dodge," but they are a direct response to the problem Bradley raised.
  4.  **Russell:** Russell took it seriously because it threatens the possibility of truth. If Bradley is right, no proposition can be unified, so nothing can be true. Russell spent decades trying to solve the "Unity of the Proposition" specifically to avoid Bradley's Monist conclusion (that only the Absolute is real).

  **Recommendation:** If you want to see the regress argument explicitly, scroll down in Chapter 3 to where he discusses "How the relation can stand to the qualities." That is the money shot. The passage you found is the philosophical throat-clearing.

  Bradley is difficult because he isn't trying to save our common-sense view of the world; he's trying to prove it's logically incoherent so he can replace it with the Absolute. The "vicious circle" is vicious only if you demand the world be made of discrete, self-grounding atoms. Bradley says it isn't; it's One. Russell says it is; now explain how they stick. That disagreement defines 20th-century analytic metaphysics.
