  **MEMORANDUM**

  **TO:** Program Director
  **FROM:** Faculty Thesis Review Panel (J. [Your Name], A. [Colleague 1], B. [Colleague 2])
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Thesis [Student Name] and Nonfiction Track Guidelines

  **Executive Summary**

  The Faculty Thesis Review Panel has convened to address the complaint regarding the factual accuracy of [Student Name]'s braided nonfiction thesis, * [Title of Essay]*, currently accepted pending revisions by our affiliated literary journal. After reviewing the text, the external complaint, and the student's defense, the panel submits the following recommendation: The thesis cannot be approved in its current form for the Nonfiction track. The student must either revise the work to align with verifiable factual events or petition to reclassify the thesis under the Fiction track. Consequently, the affiliated journal must be notified to halt publication until the genre classification is resolved. Additionally, we propose the adoption of a new "Transparency Protocol" for all Nonfiction workshops to prevent future ambiguity regarding the boundaries of invention.

  **The Nature of Memory and the "Invention" Argument**

  In reaching this conclusion, the panel engaged in rigorous debate regarding the inherent subjectivity of the memoir form. We wish to place on record our substantial agreement with the position that nonfiction is not stenography. We acknowledge that memory is inherently reconstructive; no writer can recall dialogue verbatim, compress time without altering its texture, or arrange the chaos of lived experience into a narrative arc without imposing a kind of order that did not exist in the moment.

  We recognize that the "lyric essay" and "braided nonfiction" forms often rely on associative logic rather than journalistic chronology. In this light, the student's argument that she is serving a "larger emotional truth" is not without merit. There is a recognized tradition in contemporary creative nonfiction where the interior reality of the narrator takes precedence over the exterior timeline. If the panel were discussing the compression of time, the compositing of minor characters to protect privacy, or the reconstruction of a conversation's substance based on clear recollection, we would likely concur that these are standard, acceptable tools of the trade. We accept the premise that a memoirist writes from the fallible self, and that demanding perfect factual fidelity can sometimes strangle the artistic vitality of a piece.

  **The Distinction: Reconstruction vs. Fabrication**

  However, the panel distinguishes sharply between the *reconstruction* of events and the *fabrication* of events. The Augustinian definition of a lie rests not merely on the falsehood of the statement, but on the intention that the falsehood be believed as truth. In the genre contract of Nonfiction, the reader invites the writer to say, "This happened." When a writer invents a suicide attempt, a deathbed reconciliation, or a courtroom outcome that contradicts the public record, they are not reconstructing memory; they are altering the biographical reality of other human beings to serve a narrative arc.

  While the student argues that these inventions serve an emotional truth, the panel finds that they violate the ethical contract of the Nonfiction track in two specific ways:

  1.  **Representation of Others:** The inventions in question do not solely concern the narrator's internal state; they fundamentally rewrite the history of the grandmother (who died alone, not reconciled) and the relative involved in the custody hearing. To publish this as Nonfiction is to defame the dead and misrepresent the living under the guise of fact.
  2.  **Genre Integrity:** If a suicide attempt is invented, the work is, by definition, a novel or a short story. To label it Nonfiction is to mislead the reader, regardless of the emotional resonance. "Emotional truth" is a necessary component of nonfiction, but it is not a sufficient substitute for factual integrity.

  **Recommendation for Thesis and Publication**

  Given the proximity to the journal's print deadline and the thesis approval window, the panel recommends the following immediate actions:

  1.  **Thesis Disposition:** The thesis is returned to the student. She is offered two paths:
      *   **Revision:** She may revise the essay to remove the fabricated events, aligning the narrative with the verifiable facts of the grandmother's death and the custody hearing, while retaining the lyrical/braided structure.
      *   **Reclassification:** She may petition to move the thesis to the Fiction track. If the work is artistically stronger with the inventions, it should be celebrated as fiction, not defended as nonfiction.
  2.  **Journal Publication:** The Program Director should immediately contact the editors of the affiliated journal. We recommend requesting a hold on publication. If the student chooses the Fiction path, the journal may publish the piece only if clearly labeled as "Personal Essay/Fiction" or "Based on a True Story." If the student chooses the Nonfiction path, the fabrications must be excised. Publication in its current state poses a reputational risk to both the program and the journal regarding ethical standards in creative nonfiction.

  **Proposal for Future Policy: The Nonfiction Transparency Protocol**

  To ensure the program is not forced to litigate these boundaries case-by-case in the future, the panel proposes the adoption of a "Nonfiction Transparency Protocol" to be implemented in all core workshops effective next semester.

  1.  **The Genre Contract:** All syllabi for Nonfiction workshops will include a explicit definition of the genre. While memory is acknowledged as fallible, the *intent* to deceive regarding major life events (deaths, crimes, medical events, legal proceedings) is prohibited.
  2.  **The Author's Note:** Students whose work includes composite characters, reconstructed dialogue, or altered timelines must submit a brief "Author's Note" with their final thesis. This note does not need to be published, but it must be filed with the program. It should disclose where the writer has deviated from strict fact (e.g., *"Dialogue is reconstructed based on memory,"* or *"Two characters have been combined for narrative flow"*).
  3.  **Third-Party Sensitivity:** For thesis projects involving living or recently deceased family members, students will be encouraged (and in cases of sensitive legal/medical detail, required) to consider the ethical implications of their portrayals. While we do not censor difficult truths, we require students to articulate the difference between *revealing* a truth and *inventing* one.

  **Conclusion**

  We understand that drawing this line feels arbitrary to a writer in the throes of creation. However, the distinction between fiction and nonfiction is not merely a marketing label; it is a covenant with the reader. By upholding this standard, we protect the integrity of our Nonfiction track, respect the memory of the subjects involved, and ultimately empower our students to make conscious, ethical choices about the power of their own words.

  We are available to discuss this recommendation in further detail at your earliest convenience.

  Respectfully,

  [Your Name]
  Faculty, Fiction & Nonfiction Tracks
  [Program Name]
