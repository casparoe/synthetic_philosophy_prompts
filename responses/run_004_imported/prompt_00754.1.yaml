answer: |-
  This is a fantastic question. You have hit on exactly the point where most people's intuitions clash with Strawson's conclusion. It is completely natural to think that if the universe isn't deterministic—if there is genuine "breakage" in the causal chain via quantum indeterminacy—then there is room for freedom.

  However, Strawson's argument is designed to survive that move. To see why, we have to look closely at what "responsibility" requires in his framework, and why randomness fails to provide it.

  Here is the breakdown of why the determinism/indeterminism distinction doesn't save you from the Basic Argument, using your background with random number generators (RNGs) to illustrate the point.

  ### 1. Responsibility Requires Control, Not Just Openness
  Your intuition is that **Determinism = No Choice** and **Indeterminism = Choice**.
  Strawson's view is that **Determinism = No Control** and **Indeterminism = No Control**.

  For you to be *ultimately* morally responsible for an action, that action must issue from *you*. It has to be under your control.
  *   **In a deterministic world:** Your actions are the inevitable result of prior causes (genes, environment). You didn't choose those causes. So, no control.
  *   **In an indeterministic world:** Some part of your decision-making process involves genuine chance (quantum noise). But **chance is not control.**

  Think about your hardware RNG. When a quantum event triggers a bit flip, that bit flip is not "chosen" by the computer. It just happens. If your decision to steal a cookie versus eat an apple hinged on a quantum event in your neurons, that event wasn't *authored* by you. It was noise.

  If your action is the result of randomness, you can't take credit for it. If a spasm in your arm causes you to hit someone, you aren't responsible, even though that spasm wasn't determined by the past. Strawson argues that indeterminism turns actions into accidents, not exercises of agency.

  ### 2. The Regress Applies to the "Self" Regardless of Physics
  The core of Strawson's Basic Argument isn't actually about physics; it's about the **structure of the self**.

  The argument runs:
  1.  You act according to your nature (your values, desires, character).
  2.  To be responsible for the act, you must be responsible for your nature.
  3.  You can only change your nature if you have a *prior* nature that motivates that change.
  4.  Therefore, you can never be responsible for your *ultimate* nature.

  Now, let's inject indeterminism. Let's say your "nature" isn't just a fixed script from your genes, but is partially shaped by random quantum events during your development.

  Strawson asks: **Did you choose for those random events to happen?**
  *   **No.** They were random.
  *   **Did you choose how to react to those random events?**
  *   **No.** Your reaction depends on the nature you had *before* the event.

  Even if the "bedrock" isn't fixed necessity (genes), but rather random noise (quantum decay), you still didn't *choose* the bedrock. You are still stuck with a hand you didn't deal yourself. Whether the hand was dealt by a deterministic dealer or a chaotic one, you didn't pick the cards.

  ### 3. The "Intelligibility" Problem
  There is a second layer here that Strawson emphasizes. For an action to be something *you* are responsible for, it must be **intelligible** as coming from you. It must make sense in light of your reasons and character.

  *   **If the action is determined by your character:** We are back to "Who made your character?" (The Regress).
  *   **If the action is *not* determined by your character (i.e., it's random):** Then it doesn't really come from *you*. It comes from the noise.

  This is often called the **"Luck Objection."** If indeterminism is true, then when you make a choice, there was a chance you could have done otherwise *given the exact same past and the exact same mental state*. If that's the case, the difference between Choice A and Choice B is just luck. And you can't be morally responsible for luck.

  ### 4. Using Your RNG Analogy
  Since you work with generators, let's push that analogy to see where the "agency" is supposed to be.

  *   **Deterministic PRNG:** You put in Seed A, you get Output Stream A. The output is fixed by the seed. (This is the Determinist view of humans: Output fixed by Genes/Upbringing).
  *   **Hardware QRNG:** You put in Seed A + Quantum Noise, you get Output Stream B. The output is not fixed solely by the seed. (This is the Indeterminist view of humans).

  Strawson's question is: **Who chose the Seed? And who chose the Noise?**

  In both cases, the *system* (the human brain) is just processing inputs.
  *   In the PRNG, the system processes the seed.
  *   In the QRNG, the system processes the seed plus the noise.

  In neither case does the *program* write itself. In neither case does the *program* choose the noise. For you to be ultimately responsible, you would need to be something *outside* the system that selects the seed and selects the noise. But you aren't outside the system; you *are* the system.

  ### 5. Why This Feels Unsatisfying (and What You're Missing)
  The reason this feels wrong to you (and to many philosophers) is that Strawson is defining "Moral Responsibility" in an incredibly strict way. He calls it **Ultimate Moral Responsibility (UMR)**.

  UMR requires that you be the *causa sui* (cause of yourself). You must have created your own nature from scratch. Strawson argues this is logically impossible because you'd need a pre-existing nature to do the creating.

  Most people (and many philosophers called **Compatibilists**) think this bar is set too high. They argue:
  *"I don't need to have created my own genes to be responsible. I just need to be acting according to my own desires without external coercion."*

  Strawson replies: *"Sure, that's 'freedom' in a practical sense. But it's not 'ultimate' responsibility. You still didn't choose the desires you are acting on."*

  ### Summary
  The flaw in the reasoning that "indeterminism rescues responsibility" is the assumption that **randomness equals agency.**

  Strawson argues that:
  1.  If your choice is determined by your past, you didn't choose your past.
  2.  If your choice is determined by randomness, you didn't choose the randomness.
  3.  If your choice is a mix of both, you didn't choose either.

  In all scenarios, the "source" of the action lies outside of your ultimate control. The distinction between deterministic and quantum RNG is vital for cryptography and physics, but for Strawson, neither generator writes its own code, and neither chooses its own seed. Therefore, neither can be the ultimate source of moral responsibility.
