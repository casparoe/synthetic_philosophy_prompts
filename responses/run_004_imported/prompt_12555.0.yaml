answer: |-
  This is a fantastic real-world case study for exactly what you're studying in your philosophy of action class. In fact, if you brought this scenario to your professor, they'd probably be thrilled. You are currently wrestling with the difference between **aggregate individual action** (you doing your thing, Jess doing her thing) and **joint action** (the two of you acting as a single unit).

  Your intuition is relying on a very specific, narrow definition of "promise" (explicit, formal, consequentialist), while Jess is operating on a framework of **joint commitment** and **relational obligation**.

  Here is the breakdown of why Jess is philosophically in the right, based on the concepts likely floating around your classroom right now.

  ### 1. The "Magic Words" Fallacy
  You argue that you never made a "actual promise" because you didn't use formal language. In speech act theory (Austin, Searle), the performative power of an utterance doesn't come from saying the word "promise." It comes from **context and uptake.**

  When you texted "ok yeah we're both coming," you weren't just predicting the future; you were issuing an **assurance**. In the context of planning, saying "I will be there" functions as a commitment because it is designed to induce reliance in the other party. By saying "we're both coming," you invited Jess to lock in her own plan based on yours. You created a **normative expectation**.

  In philosophy of action, specifically in the work of **Margaret Gilbert**, this is called a **Joint Commitment**. When two people agree to do something together, they form a "plural subject." You are no longer just You and Jess; for the purpose of that morning, you are a "We." A "We" cannot be dissolved unilaterally by one part without the permission of the other. By bailing without consulting her, you treated a joint commitment as an individual intention, which is a category error.

  ### 2. The Harm Wasn't to Mia; It Was to Jess
  Your defense is consequentialist: *No harm resulted because the move got done.* You are looking at the outcome for the beneficiary (Mia).

  Jess's complaint is deontological and relational: *The harm resulted to me.*
  When you agreed to go, Jess likely adjusted her own burden based on your presence.
  *   **Physical Burden:** She might have planned to lift heavy things assuming you were there to take the other end.
  *   **Psychological Burden:** Moving is stressful. Knowing she had a partner makes the stress bearable. Knowing she might be left alone makes it stressful.
  *   **Moral Position:** This is the big one. When you bailed, you changed Jess's status from "co-volunteer" to "sole guarantor." If Jess had gotten sick that morning, the move might have failed. By leaving, you made her solely responsible for the social obligation to Mia, while you absolved yourself. You effectively offloaded your moral risk onto her.

  ### 3. "Leaving Her Hanging" as a Philosophical Concept
  Jess said you "left her hanging." In the literature on **Shared Intention** (like Michael Bratman's work), this is about **interlocking intentions**.

  For a group action to work, my intention must mesh with yours. I intend that *we* J. You intend that *we* J.
  When you decided to take the ticket, you changed your intention to "I will not J." But you didn't update the joint intention; you just abandoned it. This leaves Jess in a bind: Does she still intend that *we* J? No, because you aren't there. Does she intend that *she* J? Maybe, but that wasn't the deal.

  You disrupted her **planning agency**. She organized her Saturday morning around the premise of your participation. By removing your participation unilaterally, you rendered part of her planning irrational. You treated her reliance on you as disposable.

  ### 4. The "Free Rider" Problem
  There is also an element of fairness here. You benefited from the plan (the social capital of agreeing to help Mia, perhaps the expectation that Jess would ensure it happened) without paying the cost (the labor of moving).

  Even if other people showed up, you and Jess had a specific pact. If the deal was "Jess and User help Mia," and User opts out for a fun event, User is essentially saying, "My leisure time is more valuable than our joint commitment." Jess is left holding the bag of that commitment. She has to face Mia and explain why the team is short-handed, or work harder to compensate. That is a tangible harm to *her*, even if Mia's couch still gets moved.

  ### The Verdict
  You aren't "wrong" for wanting to go to the event. Life happens. But you were wrong in **how** you exited the joint commitment.

  *   **The Obligation:** Came from the mutual assurance and the reliance it created, not the word "promise."
  *   **The Harm:** Was relational (betrayal of partnership) and agential (disrupting her planning), not just material (boxes moved).
  *   **The Fix:** In joint action theory, to dissolve a joint commitment, you need **mutual rescission**. You should have texted Jess: *"I know we agreed to do this together, but an opportunity came up. Are you okay if I bail, or do you need me to stick to the plan?"*

  If Jess had said, "Nah go have fun, I got this," then you would be off the hook. Because you didn't ask, you treated the joint commitment as your personal property to discard. Jess is right to be upset because you violated the norms of **co-agency**. You treated her like a backup plan rather than a partner.

  It sounds like a "vibe" because social norms usually operate in the background, but your philosophy class is basically shining a spotlight on the mechanics of that vibe. Jess feels you broke a rule of cooperation; objectively, in terms of group action theory, you did.
