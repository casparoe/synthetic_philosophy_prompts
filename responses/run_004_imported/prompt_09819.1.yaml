answer: |-
  Good evening. For those who don't know me, I'm [Your Name], Dan's older brother. I'm also a software engineer, which makes me the perfect person to introduce this couple: I spend my day debugging logic, Dan spends his day debugging reality, and Priya spends her day scanning the hardware they both run on.

  I've been asked to say a few words about Dan and Priya's love. But given the guest list, I can't just say "love is magic." Half of you would roll your eyes at the dualism, and the other half would wonder why I'm talking about magic.

  So, I want to talk about the Exclusion Problem.

  For the family: Dan has spent fifteen years asking a very specific, very difficult question. If every time you raise your hand, there's a sufficient physical cause in your brain that made it happen, what causal work is left for your *decision* to do? Is your mind the driver, or is it just a passenger narrating a trip the body is already taking?

  Dan is a non-reductive physicalist. Which, in plain English, means he believes the mind is made of the brain, but insists it's not *just* the brain. He argues that reasons can be causes. That thoughts can push atoms.

  Priya, being a neuroscientist, has spent their entire courtship gently threatening to prove him wrong. Her standing joke is that she's going to find the specific neuron that "really" proposed to her, rendering Dan's romantic agency null and void.

  But watching them together, I've realized something that even Dan's two books haven't quite captured.

  If Dan were wrong—if mental states were just inert decoration riding on top of biology—then marriage would be a ceremony of billiard balls. Neurons hitting neurons. Chemistry reacting to chemistry. But that's not what I see when I look at them.

  I see a pattern that has become strong enough to constrain the physical world.

  When Dan decided to marry Priya, that wasn't just a synaptic firing. It was a commitment that will reorganize their finances, their geography, their Tuesday nights, and eventually, a family. That is *causal work*. That is a higher-level pattern exerting downward pressure on the physics of their lives.

  Dan has spent his career defending the idea that the mental is real enough to matter. And today, he is living the proof. He is betting his life on the proposition that a promise is not just a sound wave, but a force.

  To the philosophers here: I know Dan hasn't solved the Exclusion Problem to everyone's satisfaction. But look at them. They have solved it for each other. They have created a shared mind that does real work in the world.

  To the family: Dan is the smartest man I know, but he's never been smarter than when he's with Priya. She grounds his abstractions; he gives words to her discoveries. They make each other more real.

  Dan, you've spent fifteen years arguing that love isn't just a shadow cast by the brain. Today, you get to stop arguing and start living it. Priya, thank you for giving his theories somewhere to land.

  Please raise your glasses. To the bride and groom: May your union always be more than the sum of its neurons. May your reasons always be causes. And may you never exclude each other from the work that matters.

  To Dan and Priya.
