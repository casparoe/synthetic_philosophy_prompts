          *   *Body:* The hip. Cato says athletes aren't old men. We need counsel, not sprinting.
          *   *Pleasures:* The wine/food. Cato calls pleasure a "siren." Dad, you're free from the siren! You enjoy the *table*, not just the food.
          *   *Death:* The bananas. Cato says nature has a course. Like fruit. Don't say "end," say "harvest."
