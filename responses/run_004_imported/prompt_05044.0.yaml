      *   **The Four Complaints (to be addressed):**
          1.  Withdraws from active life/work.
          2.  Body grows weak/frail.
          3.  Deprived of physical pleasures.
          4.  Nearer to death.
      *   **Dad's Situation:** Handed hardware store to brother, hip issues, taste diminished after surgery, makes "green bananas" jokes (mortality).
      *   **Audience:** Mixed. Most are laypeople, but Uncle Ray is a retired Latin teacher (needs accurate references/winks).
      *   **Tone:** Warm, funny, specific (not vague platitudes), not heavy/sappy on the death part (Dad is superstitious).
      *   **Length:** About 5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct Cicero's *De Senectute* (The Four Points):**
      *   *Complaint 1: Withdraws from active affairs.*
          *   Cicero/Cato's Answer: The mind remains active. You guide rather than do. The pilot doesn't climb the mast but steers the ship.
      *   *Complaint 2: Body grows weak.*
          *   Cicero/Cato's Answer: True, but you don't need brute strength. Wisdom and authority matter more. Also, take care of what you have (fire metaphor).
      *   *Complaint 3: Deprived of physical pleasures.*
          *   Cicero/Cato's Answer: Good riddance! Pleasures are the "bane of the soul." Old age allows for temperance and higher pursuits (conversation, gardening, learning).
      *   *Complaint 4: Nearer to death.*
          *   Cicero/Cato's Answer: Death is natural. A ripe fruit falls. The soul is immortal. Life has a set course.
          *   *Constraint:* Keep this light. Dad is superstitious. Focus on "legacy" or "ripeness" rather than "dying."

  3.  **Drafting - Section by Section:**

