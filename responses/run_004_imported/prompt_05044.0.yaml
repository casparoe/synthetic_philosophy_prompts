      *   **Point 2 (Strength/Body):** Address the hip. Cicero says strength isn't everything. Use the "fire" analogy (keep it stoked). Keep it light about his mobility.
      *   **Point 3 (Pleasures/Taste):** Address the food/wine issue. Cicero actually says losing appetite is a *good* thing (freedom from slavery to passion). Spin this positively: it's about refinement, not loss. Maybe mention he enjoys company more than the meal.
      *   **Point 4 (Death/Time):** The tricky one. Dad jokes about green bananas. Cicero talks about ripe fruit. Use the "ripe fruit" metaphor but keep it celebratory. He's not "near the end," he's "fully ripened." Avoid the word "death" if possible, or treat it as a distant horizon.
      *   **Closing:** Bring it back to love and family. A Latin sign-off for Uncle Ray.

  4.  **Refining Tone and Constraints:**
      *   *Uncle Ray Check:* Need to use specific Cato/Cicero references. Maybe drop a Latin phrase (*Senectute*, *Cato Major*). Ensure the arguments match the text, not just general "aging is wise" stuff.
      *   *Dad Check:* No doom and gloom. Keep the "green bananas" joke acknowledged but defused.
      *   *General Audience:* Explain the philosophy simply so they aren't bored. Make it about *Dad*, not just Cicero.
      *   *Timing:* Read through at a moderate pace. A 5-minute speech is roughly 750 words. I need to make sure I don't ramble.

  5.  **Drafting - Iteration 1 (Mental Outline):**
