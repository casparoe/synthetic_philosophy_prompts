answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of proposing a toast to the man of the hour.

  Ninety years. It's a staggering number. When I was asked to give this speech, I wanted to say something substantial. I didn't want to just say, "He's old, but he's still got it." Because, well, let's be honest. He handed the hardware store over to my brother. His hip makes a clicking sound that can be heard in the next room. He told me last week that a $200 bottle of wine tastes like "grapey water" since his surgery. And he refuses to buy green bananas because, in his words, "Who knows who'll be around to eat them?"

  So, I looked for a framework. And last year, I happened to read Marcus Tullius Cicero's essay *On Old Age*. I know, I know. But it turns out Cicero wrote this for exactly this moment. He outlines the four great complaints people have about getting old, and then he destroys them. And Uncle Ray—I see you in the third row, I know you taught Latin for thirty years, so please don't correct my pronunciation out loud—I'm going to walk through Cicero's four points as they apply to Dad.

  **Complaint Number One:** *Old age withdraws us from active affairs.*
  Cicero argues that while you might stop doing the heavy lifting, you never stop steering the ship. The pilot of a ship doesn't climb the mast or swab the decks; he sits at the helm and guides the vessel.
  Dad, you sold the hardware store. You aren't lifting bags of concrete anymore. But let's be real: do you think any of us make a major decision without calling you first? You aren't in the trenches, but you are absolutely still the General. You've traded the hammer for the blueprint, and frankly, we need the blueprint more than we need the hammer.

  **Complaint Number Two:** *The body grows weak.*
  Cicero admits this one. He says, "Old men do not have the strength of young men." But then he asks: So what? Do we require the strength of a bull to live a good life? He says we must use our remaining strength wisely, like we stoke a fire so it doesn't go out.
  Dad, your hip is shot. We know. We hear the click. But Cicero would say that authority and wisdom weigh more than muscle. You don't need to run a marathon to command this room. You just need to sit in that chair, keep the fire stoked, and let us come to you for the stories. We aren't looking for a sprinter; we're looking for the sage. That's you.

  **Complaint Number Three:** *Old age deprives us of physical pleasures.*
  This is the big one. The food doesn't taste the same. The wine is just "grapey water." Cicero actually says this is a *good* thing. He calls excessive appetite and thirst the "sirens" that ruin us. He argues that old age frees you from the slavery of the palate.
  So, Dad, when you say the steak isn't as good as it used to be, Cicero would say: "Excellent! Now you can focus on the company." You're not losing the pleasure of the meal; you're upgrading to the pleasure of the table. You're freed from gluttony so you can focus on the conversation. And luckily for us, your conversation is still sharper than your taste buds.

  **Complaint Number Four:** *Old age is nearer to death.*
  Now, I know Dad is superstitious about this. He makes the "green banana" joke to keep it light. But Cicero tackles this head-on. He says death isn't a crash; it's a harvest. He compares a natural life to a ripe apple falling from a tree. It doesn't fall because it's rotten; it falls because it's done its work. It's ripe.
  Dad, looking at you, looking at this family, looking at this room... you aren't "near the end." You are fully ripened. You're in the harvest season. The green bananas are for the kids. You're the one who enjoys the fruit that's ready. Cicero says the soul has a course to run, and when you've run it well, there's no fear, just satisfaction. So, no doom and gloom. Just respect for the season you're in.

  Cicero wrote this over 2,000 years ago, and he was basically describing you. He proved that old age isn't a decline; it's a change of duty. You've moved from the worker to the guide, from the muscle to the mind, from the appetite to the atmosphere, and from the green fruit to the harvest.

  Uncle Ray, if I got the spirit of *De Senectute* right, I'll take a B-plus.
  And Dad... for a guy who won't buy green bananas, you've certainly made life sweet for the rest of us.

  To Dad. *Vivat Pater!* Long live the Father. Cheers.
