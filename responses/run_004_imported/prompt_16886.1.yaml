  S-tier options directly remove the incentive to race: ROSE values eliminate the "first-mover advantage" by making outcomes order-independent, while Safe Pareto Improvements allow agents to coordinate on a safer game structure before commitments lock in. F-tier fails because deliberately weakening your commitment power is unilateral disarmament; it doesn't stop the race, it just ensures you lose bargaining power and incentivizes others to race against you.
