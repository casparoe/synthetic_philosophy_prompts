      *   *The Madisonian Critique of Weil:* If you abolish parties, do you abolish factions? No. People still have differing interests (property, religion, region). Without parties, how are these interests aggregated? They might form informal cliques (which act like parties but without accountability) or demagogues might rise more easily to mobilize the "natural" factions Madison feared.
      *   *The Weilain Critique of Madison:* Madison's system *relies* on the very mechanism Weil finds evil (collective pressure). Madison assumes factions check each other. Weil argues the *existence* of the faction/party corrupts the individual's ability to perceive truth, so a system built on them is inherently unjust, regardless of the balance of power.
      *   *Does Weil escape the dilemma?*
