          *   *The Catch:* UDT requires a *prior*. Who chooses the prior?
          *   If Agent A uses Prior $P_A$ and Agent B uses Prior $P_B$, they might clash.
          *   *The Real Issue:* UDT solves "time inconsistency" (changing your mind later), but it doesn't solve "policy incompatibility."
          *   If I UDT-commit to "Demand 90%," and you UDT-commit to "Accept max 50%," and we both know this *before* we run the code, we crash.
          *   UDT pushes the commitment point to "before observation," but if both agents do this, they are committing *simultaneously* in logical time. The race becomes a race to define the *reference class* of the precommitment.
          *   *Specific Breakdown:* Naive UDT assumes you can precommit to a response to *any* opponent. But if the opponent precommits to punishing *any* demand, you have a logical collision. UDT doesn't tell you *which* equilibrium to select when multiple precommitments clash.

      *   **Part 4: What Would a Resolution Look Like? (Motivating the Seminar).**
          *   We need a "Schelling Point" for logical time.
          *   We need "Threat-Resistance" (not just committing to threats, but committing to *ignore* threats).
          *   We need a meta-agreement on how to bargain *about* commitments (Bargaining over the bargaining protocol).
          *   *Key Concept:* "Fair" bargaining vs. "Power" bargaining.
