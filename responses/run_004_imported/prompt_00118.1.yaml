      *   *First-Mover Advantage (Standard Game Theory):* Stackelberg leadership. Move $t=1$, opponent moves $t=2$. Clear temporal ordering.
      *   *Logical Time:* Ordering based on information dependency, not wall-clock time. If my code can read your code, I move "after" you logically, even if I submit my code later.
      *   *Updatelessness:* Decide on a policy *before* seeing specific information (like the opponent's move) to avoid being blackmailed.
      *   *The Regress:* If UDT says "commit at $t=0$," why not commit at $t=-1$? What defines $t=0$?
      *   *The Breakdown:* Naive UDT assumes you can commit to a policy that ignores information you *might* receive. But if the opponent knows you are UDT, they can commit to a policy that punishes *your* UDT policy. It becomes a contest of whose precommitment is "more fundamental."

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Part 1: Distinguishing Physical vs. Logical Time (The "Why it's not Stackelberg" part).**
          *   Standard Game Theory: Time is physical. I move, then you move. You see my move.
          *   Commitment Race: Time is logical/informational. If I commit to a function $f(y)$ (my move depends on yours) and you commit to $g(x)$, we have a cycle.
          *   *Key Insight:* In physical time, "earlier" means "the other person sees it." In logical time, "earlier" means "my decision procedure takes yours as input, but not vice versa."
          *   *The Race:* Everyone wants their decision procedure to be the "input" and the other's to be the "output."

      *   **Part 2: The Mechanism of the Race (The "Regress" part).**
          *   Imagine a timeline of "epistemic states."
          *   State 0: I know nothing. State 1: I know your code.
          *   If I commit at State 1, I can react to you. But you want to commit at State 0 so I can't react.
          *   But wait, if you commit at State 0, I want to commit at State -1 (before I even know I'm playing against *you*).
          *   *The Problem:* There is no "State -Infinity." Agents are instantiated at some point. If two agents are instantiated simultaneously with access to each other's source code, who is logically prior?
          *   *Analogy:* Two computers trying to boot up an OS that requires the other OS to be already running.

      *   **Part 3: Why Updatelessness (UDT) Doesn't Fix It (The "Pushing Back" part).**
          *   UDT says: "Choose a policy $\pi$ that maximizes expected utility across all possible worlds, ignoring specific observations."
