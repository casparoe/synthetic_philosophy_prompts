answer: |-
  Here is my second opinion: **Your colleague is wrong, and you should absolutely use this.**

  The objection that the parallel is "too strained" likely rests on the distinction between *doing* (Truman) and *threatening* (Putin), or between *ending* a war (Truman) and *prosecuting* one (Putin). But for Anscombe, these distinctions are morally superficial. Her entire philosophical project in this area was to locate the moral catastrophe in the **will** and the **intention**, not merely in the physical consequences.

  If you put this to your seminar, it will force students to confront the hardest edge of her absolutism: that the corruption of the moral agent is complete the moment they decide that murdering the innocent is an available tool, regardless of whether the tool is ever picked up.

  Below is a reconstruction of how Anscombe would likely analyze the Putin scenario, drawing on *Mr. Truman's Degree*, her 1961 essay *War and Murder*, and her later interventions on nuclear deterrence (specifically her critiques of the 1983 Catholic Bishops' Pastoral Letter). I have attempted to capture her specific idiom: impatient with "modern moral philosophy," allergic to consequentialist calculus, and focused on justice as a matter of law rather than "ethics."

  ***

  ### A Reconstruction: Anscombe on the Nuclear Threat

  "If we are to speak plainly, we must stop pretending that the morality of an action depends on whether the blood has yet been spilt. The modern world is obsessed with consequences, as though the law of God were a matter of tallying corpses rather than examining the will. In 1956, Oxford wished to honor Mr. Truman because, they said, his actions brought a war to an end. They looked at the result. I told them they were honoring a man for murder. The killing of the innocent in Hiroshima and Nagasaki was not an accident of war; it was the chosen means to an end. That is the definition of murder.

  Now we are presented with a new sophistry regarding Mr. Putin. People say, 'But he has not dropped the bomb. He only speaks of it.' They treat the threat as a bluff, a piece of theater, distinct from the deed. This is nonsense.

  To threaten to kill the innocent is to declare a conditional intention to murder them. It is to say: 'If you do not bend to my will, I will commit murder.' In the Cold War, we were told that holding populations hostage was 'deterrence,' a necessary evil to keep the peace. I argued then that to form the intention to kill millions, even conditionally, is to corrupt the soul of the nation that holds it. It is to make oneself a murderer in the heart. But that was at least framed as a prevention of war.

  Mr. Putin's case is in some ways clearer, and in some ways worse. It is not a abstract standoff between two blocs to prevent a war. It is a threat wielded in the service of an aggressive war already underway. He is not threatening nuclear war to *prevent* conflict; he is threatening nuclear war to *win* a conflict he started, a conflict in which he is the aggressor.

  Does it matter that the bomb has not fallen? Suppose a man holds a knife to a child's throat and says to the mother, 'Give me your money or I cut.' If the mother calls his bluff and he walks away, was he not still a criminal? Was the act not attempted murder and extortion? The justice of the act lies in the intention he has made public. He has placed himself in a position where he judges the lives of the innocent to be expendable for his political ends.

  The consequentialists will say, 'But the threat prevents escalation! The threat saves lives!' This is the same rot that justified Mr. Truman. You cannot do evil that good may come. You cannot build a strategy on the intention to slaughter the innocent and call it 'statecraft.' If the threat is sincere, he intends murder. If the threat is a bluff, he is lying and manipulating the fear of murder for gain. Neither is compatible with justice.

  Oxford wanted to say that Mr. Truman was a 'great man' despite the murder. Today, people want to say Mr. Putin is a 'rational actor' despite the threat. Both are attempts to evade the law of justice by appealing to 'reasons of state.' There are no reasons of state that make murder just. The threat itself is the crime, because the threat reveals that the murderer is already present in the will."

  ***

  ### Why This Works for the Seminar

  **1. It tests the "Conditional Intention" limit.**
  In *Mr. Truman's Degree*, the killing was actual. In the Cold War (and Ukraine), the killing is conditional. Anscombe's consistency hinges on whether she believes the *conditional intention* to kill innocents is morally identical to the *actual intention*.
  *   **The Trap:** Students often think DDE (Double Effect) saves the threatener ("I don't *want* to use them, I just want them to surrender").
  *   **The Anscombean Correction:** She would reject this. If the *means* of coercion is the destruction of innocents, you intend that destruction as a means, even if conditionally. She made this explicit in her later years regarding nuclear deterrence: you cannot hold innocent lives hostage without sinning.

  **2. It isolates "Reasons of State."**
  The core of *Mr. Truman's Degree* is a rejection of consequentialism in politics. The Putin case is the perfect modern stress test. Almost every realist politician argues that nuclear ambiguity is "necessary" for security. Anscombe's bracing utility is that she offers no purchase for "necessity." If it's murder, it's murder. Putting this in front of students forces them to defend consequentialism against her absolutism in real-time.

  **3. It addresses the "Strained Parallel" objection.**
  Your colleague thinks the parallel is strained because Truman *acted* and Putin *threatens*. But Anscombe would argue the parallel is **tighter** than we think because both rely on the same moral error: treating the lives of the innocent as a calculable resource.
  *   Truman: Calculated that 200,000 dead innocents = faster surrender.
  *   Putin: Calculates that the *risk* of dead innocents = coercive leverage.
  *   **Anscombe's Verdict:** Both are treating human life as a means to an end. The physical explosion is secondary to the moral explosion.

  ### A Note on Pedagogy

  If you use this, I recommend one specific framing to prevent students from getting bogged down in current events politics:

  Ask them to identify **where the moral line is drawn** in Anscombe's framework.
  *   Is it the *order* to fire?
  *   Is it the *deployment* of the weapon?
  *   Or is it the *policy* that makes the weapon available for use against civilians?

  Anscombe argues it is the **policy/intention**. If students can see that, they will see why she would view Putin's rhetoric not as "diplomacy" but as a confession of moral guilt.

  **Verdict:** Put it in the syllabus. It honors Anscombe's memory to apply her razor to the present, not just preserve her arguments as historical artifacts. She was never a philosopher who cared about keeping her hands clean; she cared about keeping the truth sharp.
