      *   *Nuance:* Penrose distinguishes between "I am a system I know" vs "I am a system I don't know." He argues both lead to contradictions.
      *   *Counter-Counter:* Critics say human reasoning isn't a *fixed* system. It evolves. Gödel applies to fixed formal systems. If the mind is an evolving, informal process, Gödel doesn't apply in the way they think. This is Feferman's point.
