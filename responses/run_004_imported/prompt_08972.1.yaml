      *   *Decision:* Penrose's suit is nicer, but the body underneath is still dead. The housemate was right that they are different *moves* (technical refinements), but wrong if she implied Penrose *succeeded*. The user was right that the conclusion (AI can't do math) doesn't follow, but wrong to treat them as identical.
