answer: |-
  This is a classic debate that cuts right to the heart of the difference between **Neoclassical Economics** (Mia's side) and **Behavioral Economics/Psychology** (your side).

  Mia is quoting a fundamental principle called **Revealed Preference Theory**, developed by economist Paul Samuelson in the 1930s. The theory states that you cannot look inside someone's head to measure "utility" (happiness/satisfaction). The only scientific way to know what someone prefers is to observe what they choose when faced with constraints. If you choose YouTube over homework, economically speaking, you have revealed that YouTube provides more utility *in that moment*.

  **Mia is technically right within the narrow scope of traditional economics.** But she is wrong if she claims this is the *only* truth about human nature. Her argument falls apart when you introduce **Time Inconsistency** and **Second-Order Desires**.

  Here is the actual argument you can bring back to her, broken down into three specific points.

  ### 1. The "Planner vs. Doer" Model (Time Inconsistency)
  Mia's argument assumes your preferences are stable over time. Behavioral economics (specifically the work of Richard Thaler) argues that we have two selves: the **Planner** (long-term) and the **Doer** (short-term).

  *   **The Planner (You at 8 AM):** Values the future. Wants good grades. Chooses homework.
  *   **The Doer (You at 8 PM):** Values the present. Wants dopamine relief. Chooses YouTube.

  When Mia says your actions prove YouTube is what you "really" want, she is ignoring *which version of you* is making the choice. In economics, this is called **Hyperbolic Discounting**. We disproportionately value immediate rewards over future rewards.

  **The Argument:** "Mia, Revealed Preference assumes stable preferences. But behavioral econ shows preferences change based on *when* the choice is made. My action at 8 PM reveals what my 'Doer' wants, but my stated goal reveals what my 'Planner' values. Both are real, but the Planner's preference is the one that determines my long-term welfare. If we only look at the Doer's actions, we can't explain why people sign up for gym memberships in January (Planner) but stop going in February (Doer)."

  ### 2. First-Order vs. Second-Order Desires
  This is a philosophical argument (from Harry Frankfurt) that fits perfectly into econ debates about utility.

  *   **First-Order Desire:** "I want to watch YouTube right now."
  *   **Second-Order Desire:** "I want to *be the kind of person* who prioritizes school over entertainment."

  Mia is arguing that First-Order Desires (actions) are the only truth. But human welfare is often defined by Second-Order Desires (values). If you smoke a cigarette, your action reveals you wanted the nicotine. But if you *wish you didn't want the nicotine*, your "true" preference is actually to be a non-smoker.

  **The Argument:** "Actions reveal impulses, but stated goals reveal values. If I eat a salad because I'm on a diet, but I hate every bite, my action reveals I value health. If I eat cake because I'm stressed, but I feel guilty after, my action reveals I sought comfort, but my guilt reveals I value health *more*. The guilt is data too. If actions were the only truth, regret wouldn't exist. The fact that I feel bad about scrolling proves my 'stated preference' (grades) is actually higher on my value hierarchy, even if my 'revealed preference' (scrolling) won the battle."

  ### 3. Choice Architecture and Friction
  Neoclassical economics assumes choices are made in a vacuum. They aren't. YouTube is engineered by thousands of developers to hack your dopamine receptors. Homework is not.

  This is about **Transaction Costs**. The "cost" of watching YouTube is near zero (click one button). The "cost" of homework is high (open book, focus, mental strain).

  **The Argument:** "Revealed Preference assumes a level playing field. But my choices are happening in an environment where YouTube is designed to be addictive and homework is designed to be difficult. My choice reveals which option had lower *friction*, not necessarily which option I value more. If I put my phone in another room (increasing friction) and suddenly do homework, did my 'wants' change? No. My constraints changed. That proves my initial choice wasn't about pure preference, it was about weakness of will in the face of engineered distraction."

  ### The "Mic Drop" Summary for Mia
  If you want to sum this up in one sentence for her:

  > **"Revealed Preference is great for predicting market behavior, but it's terrible for measuring human welfare. My actions show what I'm *capable* of resisting in the moment, but my stated goals show what I actually value for my life. If they don't match, that's not proof my goals are fake; it's proof I have a self-control problem, which is a constraint, not a preference."**

  ### A Note for You (Since you asked)
  While you can win the debate with Mia, don't let the theory become an excuse for yourself. The economic concept of **Commitment Devices** is the solution to your specific problem.

  Since you know your "8 PM Self" is weaker than your "8 AM Self," you need to change the constraints.
  *   **Increase friction:** Use an app blocker that you can't turn off, or give your phone to your parents during homework hours.
  *   **Decrease friction:** Set up your homework desk the night before so starting is easier.

  Mia is right that actions are the only thing that *change outcomes*. But you are right that actions don't always reflect *values*. Fix the constraints so your actions can finally match your values.
