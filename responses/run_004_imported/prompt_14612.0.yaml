answer: |-
  The monsoon heat hung heavy in the corridor of the Kṣitigarbha monastery, smelling of wet earth and old palm leaves. Yasas stood outside the sick-ward, his fingers tightening around a bundle of birch-bark scrolls. Tomorrow, he was to lead the defense of the Sarvāstivāda orthodoxy against the visiting Personalists. His arguments were sharp, honed over three years of dialectic: *If the person is the aggregates, it is perishable and cannot bear karma. If it is separate, it is eternal and violates the Buddha's silence.*

  He had the logic. He did not have the peace.

  Inside the cell, the oil lamp flickered against the wall, casting the shadow of the bed like a cage. On the mattress lay Venerable Subhuti. Once a giant of the order, he was now a collection of tremors and shallow breaths. Subhuti had been a Pudgalavādin in his youth, before the council pressured him to conform. Or so the records said. Yasas had heard rumors that the old man never truly let go of the "inexpressible person."

  Yasas entered. The air was thick with the scent of camphor and decay.

  "Teacher," Yasas said, bowing low.

  Subhuti's eyes opened. They were clouded, milky with cataracts, but they fixed on Yasas with unsettling precision. "You hold the scrolls tightly, boy. As if they could stop the roof from leaking."

  "They are for tomorrow's disputation, Bhante. Against the Vātsīputrīyas."

  Subhuti coughed, a dry rattle that shook his thin ribs. "The Personalists. They say there is a *pudgala*. A person."

  "They say a fiction," Yasas corrected gently. "To account for memory and karma without positing a self."

  "Come closer."

  Yasas knelt by the bedside. Subhuti's hand emerged from the robe, skin like parchment over brittle wood. He pointed a shaking finger at a clay water pot in the corner. It had a crack running from the rim to the base, mended with lacquer.

  "I dropped that pot forty years ago," Subhuti whispered. "In the courtyard. You were not born. I was a novice, reckless. I ran too fast. It shattered."

  Yasas waited. This was a test of the aggregates. The form of the pot had changed. The consciousness of the novice had ceased.

  "Do you remember the sound?" Yasas asked. "The crash?"

  "I do."

  "Who remembers it?" Yasas asked, reciting the standard formulation. "The consciousness of that moment is extinct. The consciousness of this moment arises dependent on it. Like a flame lighting another flame. Is the second flame the first?"

  "The flame is a metaphor for children," Subhuti rasped. "It does not comfort a dying man."

  He gestured weakly to his own chest. "When I dropped that pot, I felt shame. A hot stone in the belly. I vowed to be careful. That vow shaped forty years of my walking, my eating, my speaking. If there was no *I* to carry that shame, Yasas, then who was disciplined? If the aggregates merely flowed, like water down a hill, why did the water bother to carve a channel?"

  Yasas felt the sweat prickle under his robe. "The causal series maintains the continuity, Teacher. The karma ripens without a reaper."

  "Karma ripens," Subhuti repeated. "But who tastes the fruit?"

  He lifted his hand again, this time turning it over, looking at the palm. "Look at this scar. From a knife. Fifty years ago."

  "I see it."

  "Is the scar the flesh?"

  "Yes."

  "Is the scar the memory of the pain?"

  "No. That is mental."

  "If I cut the flesh away, does the memory bleed?" Subhuti's voice grew thin, strained. "If the person is just the aggregates, then I am five things. Form, feeling, perception, volition, consciousness. Which one of the five stands before the King of Death tomorrow? If it is Form, it is already rotting. If it is Consciousness, it flickers out every time I sleep. If there is no one who is *neither* the flesh *nor* the thought, but the one who *has* them... then I am not dying. Only parts of me are."

  Yasas looked at his scrolls. The logic was airtight. *If the person is the aggregates, it does no work.* If Subhuti is just the body, he is already gone. *If the person is separate, it is ātman.* If Subhuti is something else, he is a heretic.

  "Teacher," Yasas said, his voice trembling. "The Buddha said to see no self anywhere. To see self is to suffer."

  "To see no self is to abandon the one who suffers!" Subhuti snapped, a flare of energy lighting his dying eyes. "You come to me with a knife of logic. You want to cut me into five pieces so you can say nothing dies. But I feel the end coming. *I* feel it. Not the liver. Not the breath. *I*."

  He grabbed Yasas's wrist. His grip was surprisingly strong.

  "Tell me, Yasas. When you bow to me, who do you honor? The robe? The bones? Or the one who taught you?"

  "I honor the Dharma in you."

  "There is no Dharma without a vessel." Subhuti released him, collapsing back onto the pillow. "The orthodox say I am a river. But a river has banks. It has a course. If you say there is only water, no channel, then the flood washes everything away. Moral responsibility washes away. If I am not the one who dropped the pot, I cannot be the one who forgives myself."

  Yasas looked at the mended pot in the corner. The lacquer had darkened with age. It held the water, but the crack remained visible. The pot was not the clay, nor was it separate from the clay. It was the *arrangement* held by a history of breakage.

  "If I admit a person," Yasas whispered, more to himself than the elder, "I betray the Master."

  "If you deny the person," Subhuti breathed, his eyes closing, "you betray the one who walks the path. You make the walker a ghost."

  The lamp sputtered. The wick was drowning in oil.

  "Tomorrow," Subhuti murmured, his voice fading into the humidity. "When you stand before them. Remember this room. Remember that you are not debating a theory. You are debating whether the man who taught you to tie his robes exists."

  Yasas sat in the silence. The cicadas outside began their evening drone, a rising and falling wave that sounded like breathing. He looked at the scrolls in his hand. The arguments were perfect. They proved that Subhuti was a label for a temporary convergence of elements. They proved that no one was dying.

  He looked at the old man's chest, rising and falling in a ragged rhythm. The fear in the room was not abstract. It was specific. It belonged to someone.

  Yasas reached out and extinguished the lamp. He did not need the light to see the flaw in his logic. The logic required him to be nowhere. But here, in the dark, kneeling on the rough floor, he was undeniably *here*. And the man on the bed was undeniably *going*.

  He placed the birch-bark scrolls on the floor. He took Subhuti's hand again. It was cooling.

  "I am here, Teacher," Yasas said into the dark.

  He did not say *I am*. He did not say *There is no I*. He simply held the hand, acknowledging the burden that was neither the flesh nor the mind, but the weight of the grip itself.

  Subhuti's fingers twitched once, a final acknowledgment, and then lay still.

  Yasas remained kneeling long after the breath stopped. Tomorrow, he would have to speak. He would have to use the words of the school. But as he sat in the gathering dark, he knew he would not argue for the extinction of the person. He would argue for the inexpressible. He would argue for the scar that remains when the knife is gone.

  He stood up, leaving the scrolls on the floor. He walked out into the corridor, where the rain had finally broken, washing the dust from the stones, carrying it away to a river that had a name, though the water was never the same.
