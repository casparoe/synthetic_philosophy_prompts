          *   Move 2 (Crucial): Address the "False Antecedent" objection head-on. Why does the material conditional's truth when $A$ is false not doom the view, even when $C$ is irrelevant? (The distinction between truth and assertability).

  2.  **Deconstruct the Argument Structure:**
      *   **Introduction:** Acknowledge the seductive power of the triviality result and the NTV conclusion. State the counter-thesis: Triviality targets the *link* between probability and truth (AT), not truth conditions themselves.
      *   **Section 1: The Scope of the Triviality Result (Addressing Move 1).**
          *   Students think: "Just restrict AT to my current beliefs."
          *   Counter: Lewis's proof relies on the stability of the equation under *learning* (conditionalization). If $P(\text{If } A, C) = P(C|A)$ holds for your current state, and you update by conditionalizing on new evidence, does it hold for the new state?
          *   If AT is a semantic bridge principle (Truth $\to$ Probability), it *must* hold across updates. If it's merely a contingent fact about your current psychology, it's not semantics.
          *   Therefore, restricting to "actual credence" doesn't save the truth-conditional + AT marriage. One must go.
      *   **Section 2: The Material Conditional and the "False Antecedent" Intuition (Addressing Move 2).**
          *   The big objection: "If Obama is French, then I am a fish" is true (materially) because antecedent is false. But it feels false/unassertable.
          *   NTV says: It has no truth value, hence no absurdity.
          *   Truth-Conditional (Jackson/Lewis) says: It *is* true, but you can't *say* it.
          *   Why? The Gricean/Conventional Implicature argument. Asserting "If $A, C$" signals that $P(C|A)$ is high/robust. If $A$ is known false, $P(C|A)$ might be high, but the *point* of the conditional is to rule out $A \land \neg C$.
          *   Crucial distinction: Truth conditions determine *what* is said; Assertability conditions determine *when* it is proper to say it. The "absurdity" of the false-antecedent case is a pragmatic infelicity, not a semantic falsehood.
      *   **Section 3: The Positive Picture (Jackson's Robustness).**
          *   How does this save the truth-conditional view?
          *   Semantics: Material conditional ($A \supset C$).
          *   Pragmatics: Assert only if $P(C|A)$ is high (Adams' Thesis reinterpreted).
          *   This explains why we *use* conditionals (to convey conditional belief) without requiring them to *encode* conditional belief as their truth condition.
      *   **Conclusion:** Summarize. The cost of NTV (giving up truth conditions, embedding problems) is higher than the cost of the Pragmatic View (accepting material truth conditions + pragmatic explanation of intuitions).

  3.  **Drafting - Tone and Style:**
      *   **Tone:** Academic, rigorous, respectful of the NTV view but firm in the alternative. It's a handout for grad students, so it should be dense but clear.
      *   **Voice:** "Here is the argument Lewis and Jackson are making."
      *   **Key Terminology:** Adams' Thesis, Conditionalization, Robustness, Assertability, Material Conditional, Triviality.

  4.  **Refining Move 1 (The Closure/Update Problem):**
      *   *Self-Correction:* I need to make sure I don't just say "Lewis proved it." I need to explain *why* the restriction to actual credence fails.
      *   *Point:* If AT is a thesis about the *meaning* of 'if', it should govern how the probability of the sentence relates to the probabilities of its parts *in any epistemic state*. If it only holds for my *current* state, it's a psychological accident, not a semantic rule. But if it's a semantic rule, it must survive learning. Lewis shows that if it survives learning (conditionalization), probability collapses. So, we can't keep AT as a semantic rule.

  5.  **Refining Move 2 (The False Antecedent):**
      *   *Self-Correction:* This is the hardest sell. Students hate the material conditional.
      *   *Strategy:* Don't deny the intuition. Validate it. "Yes, it feels wrong." Then explain *why* it feels wrong without conceding falsity.
      *   *Analogy:* "Some but not all" vs "Some". Or the disjunction case.
      *   *Key argument:* The "Ramsey Test" describes how we *evaluate* conditionals for acceptance, not what makes them *true*. We evaluate by supposing $A$ and checking $C$. This matches $P(C|A)$. But evaluation for acceptance $\neq$ truth conditions.
      *   *Jackson's point:* "If" is a device for robustness. It tells you the material conditional holds *even if* you learn $A$.

