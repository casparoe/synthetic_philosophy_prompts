answer: |-
  **Seminar Handout: The Pragmatic Defense of Truth Conditions**
  **Topic:** Responding to Lewis's Triviality Results
  **Reading Prep:** Edgington, "Do Conditionals Have Truth-Conditions?"

  ### 1. The Fork in the Road

  You have seen Lewis's proof. If the indicative conditional "If $A, C$" has truth conditions, and if the probability of that sentence is always constrained by Adams' Thesis ($P(\text{If } A, C) = P(C|A)$) across all admissible credence functions, then the conditional must be trivial. Either $P(C|A)$ can only take values 0 or 1, or the conditional is equivalent to the material conditional in a way that makes rational belief in it impossible except in limiting cases.

  The natural reaction—the one most of you are currently favoring—is to reject the first horn: Indicatives simply do not express propositions. They have no truth conditions. Adams' Thesis is a rule for *degrees of belief* in a non-truth-apt expression, much like a rule for how strongly to feel about an imperative.

  However, before we commit to the No Truth Value (NTV) view, we must consider the alternative path gestured at by Lewis and developed rigorously by Frank Jackson. The thesis of this view is not that Adams' Thesis is false, but that it is **pragmatic, not semantic**.

  **The Core Claim:** Adams' Thesis describes the conditions under which it is *assertable* to utter a conditional, not the conditions under which it is *true*. The truth conditions of the indicative are simply those of the material conditional ($A \supset C$).

  To adopt this view, you must be prepared to defend it against two specific challenges. The following sections outline how the Truth-Conditionalist meets them.

  ---

  ### 2. The Illusion of the "Actual Credence" Restriction

  A common initial reaction to Lewis's proof is to restrict the scope of Adams' Thesis. One might argue: *"Lewis's proof requires Adams' Thesis to hold for any credence function derived by conditionalization. Why not simply say it holds only for an agent's actual, current credence function?"*

  If AT holds only for your current state $P$, and not for $P(\cdot|E)$ (your state after learning evidence $E$), the triviality proof cannot get off the ground. The proof relies on the equation holding stable across updates to generate the collapse.

  **Why this fails:**
  This restriction saves the truth-conditional hypothesis only by sacrificing the semantic status of Adams' Thesis.

  1.  **Semantics vs. Psychology:** If AT is a thesis about the *meaning* of "if," it must specify the relationship between the content of the conditional and the contents of its antecedent and consequent. Meaning is stable across epistemic states. If the meaning of "if" dictates that $P(\text{If } A, C) = P(C|A)$, this relationship must hold regardless of what specific evidence you possess. If the equation holds for you now but fails for you tomorrow after you learn something new, then AT is not a rule of semantics; it is a contingent psychological accident about your current ignorance.
  2.  **The Normativity of Inference:** We use conditionals in reasoning. We embed them in modus ponens, reductio, and probabilistic reasoning. If the link between the probability of the conditional and the conditional probability is merely a feature of your *current* state, it cannot ground the validity of inferences that span across information states.
  3.  **Lewis's Point:** Lewis's argument shows that *no* non-trivial truth-conditional account can satisfy the requirement that the probability of the conditional tracks conditional probability *under conditionalization*. If you restrict AT to the actual credence function to avoid triviality, you have effectively conceded that AT is not a constraint on the proposition expressed. You have admitted that the proposition expressed (the truth conditions) and the probability of that proposition come apart as soon as you learn new evidence.

  **The Lesson:** You cannot have your cake and eat it. You cannot maintain that "If $A, C$" expresses a standard proposition *and* that its probability is strictly governed by $P(C|A)$ as a matter of semantic meaning. You must choose: either give up truth conditions (NTV) or give up the idea that AT is a semantic constraint (Pragmatic View). The Pragmatic View chooses the latter.

  ---

  ### 3. The "False Antecedent" Objection

  The strongest intuition driving the NTV view is the problem of the false antecedent. On the material account, "If Obama is French, then I am a fish" is true (because the antecedent is false). This seems intolerable. It suggests the truth-conditional account predicts truth where we perceive nonsense. The NTV theorist argues: *"It's not that the sentence is true but unassertable; it's that the sentence is semantically defective."*

  The Truth-Conditionalist must meet this head-on. The defense rests on a sharp distinction between **truth conditions** (what makes a sentence true) and **assertability conditions** (when it is appropriate to say it).

  #### A. The Gricean Strategy
  Consider the disjunction: "Either Obama is not French, or I am a fish." Materially, this is equivalent to the conditional above. It is true. Yet, asserting it is misleading. Why? Because standard conversational maxims (Grice) dictate that you should not assert a weaker claim if you are in a position to assert a stronger one. If you know Obama is not French, you should say *that*, not the disjunction.

  The Truth-Conditionalist argues "If" operates similarly. The semantic content is weak (material), but the use is constrained.

  #### B. Jackson's Robustness Condition
  Frank Jackson refined this beyond simple Gricean implicature. He argued that the specific function of the word "if" is to signal **robustness**.

  To assert "If $A, C$" is to assert the material conditional $A \supset C$ with the additional pragmatic signal that this conditional is *robust* with respect to $A$. That is, you are signaling that you would still believe $A \supset C$ even if you learned that $A$ is true.

  *   **Truth Conditions:** $A \supset C$ is true iff $\neg(A \land \neg C)$.
  *   **Assertability Conditions:** Assertable iff $P(C|A)$ is high.

  **Why this solves the "False Antecedent" problem:**
  When the antecedent is known to be false (e.g., "If Obama is French..."), the conditional probability $P(C|A)$ is often undefined or irrelevant to your actual beliefs about the world. More importantly, the *point* of using a conditional is to rule out the possibility of $A$ without ruling out $C$ independently.

  If you know $A$ is false, you already know $A \supset C$ is true. Asserting it provides no new information about the relationship between $A$ and $C$. It violates the norm of assertion to state a truth that is guaranteed solely by the falsity of the antecedent when your interlocutor already knows the antecedent is false.

  **The Crucial Distinction:**
  The NTV theorist says the sentence feels false because it *is* truth-valueless.
  The Truth-Conditionalist says the sentence feels false because it is **unassertable**, and we routinely confuse "I cannot say this" with "This is false."

  Consider: "It is raining but I don't believe it" (Moore's Paradox). This sentence can be true (it might be raining, and I might be ignorant). But it is impossible to *assert*. Does that mean it lacks truth conditions? No. It means the conditions for truth and the conditions for assertion come apart. The Truth-Conditionalist treats "If False, Anything" as a case of pragmatic paradox, not semantic failure.

  ---

  ### 4. Why Prefer the Truth-Conditional View?

  If the Pragmatic View can explain away the intuitions driving NTV, why prefer it? Why not just accept NTV?

  1.  **Embedding:** NTV struggles immensely with compound sentences. What is the meaning of "If (if $A, B$), $C$"? Or "Either if $A, B$ or if $D, E$"? If conditionals lack truth values, they cannot logically embed in the standard way. The Truth-Conditional view handles embedding seamlessly because "If $A, C$" is just a proposition ($A \supset C$).
  2.  **Logical Validity:** We treat conditionals as participating in valid arguments (e.g., Hypothetical Syllogism). If they have no truth conditions, "validity" for arguments containing them must be redefined (e.g., preservation of high probability rather than preservation of truth). While Edgington provides an account of this, the Truth-Conditional view retains classical logic without modification.
  3.  **The Ramsey Test:** The NTV theorist claims the Ramsey Test (evaluate "If $A, C$" by supposing $A$ and checking $C$) shows we don't deal in truth conditions. The Truth-Conditionalist replies: The Ramsey Test tells us how to evaluate *assertability*, not truth. We suppose $A$ to check if the material conditional is *robust*, not to check if it is *true*.

  ### Summary for Discussion

  Lewis's triviality results do not prove that indicatives lack truth conditions. They prove that **Adams' Thesis cannot be a bridge principle between truth and probability.**

  *   **NTV Response:** Drop truth conditions. Keep Adams' Thesis as a rule for belief.
  *   **Lewis/Jackson Response:** Keep truth conditions (Material). Reinterpret Adams' Thesis as a rule for assertion (Robustness).

  When you read Edgington, ask yourself: Is the cost of giving up truth conditions (embedding, classical logic) higher than the cost of accepting that "If $A, C$" is technically true whenever $A$ is false, provided we have a robust pragmatic story for why we never say it?
