answer: |-
  This is a fantastic premise, and your writer's group friend is absolutely right to bring up **reference classes**—that is the single biggest academic objection to the Doomsday Argument (DA).

  However, for a novel, you don't need the math to be *universally accepted truth*; you need it to be *internally consistent* enough that your character sounds brilliant, while leaving just enough ambiguity for a skeptic to challenge her later.

  Here is the breakdown of the math, where your current numbers hit a snag, and how to tweak the scene so her calculation feels "airtight" without requiring a PhD in Bayesian statistics to follow.

  ### 1. The Core Math (The "Copernican Principle")
  Your character's basic logic is correct. The Doomsday Argument relies on the idea that you are a "random observer" in the timeline of humanity.
  *   **$n$**: The number of humans born so far (approx. **117 billion**).
  *   **$N$**: The total number of humans who will *ever* be born.
  *   **The Assumption**: There is a 95% chance that you are not in the extreme first 5% or extreme last 5% of all humans. You are likely somewhere in the middle 95%.

  **The Standard Formula:**
  With 95% confidence, $n$ is greater than 5% of $N$.
  $$n > 0.05 \times N$$
  Rearranging for $N$:
  $$N < \frac{n}{0.05} = 20n$$

  **The Problem with Your Numbers:**
  If $n = 117$ billion, then $N < 2.34$ trillion.
  This means there are at most **2.2 trillion humans left to be born.**
  To turn this into *years*, you divide by the annual birth rate (approx. **140 million/year**).
  $$2,200,000,000,000 / 140,000,000 \approx 15,700 \text{ years}$$

  **The Snag:** The standard Doomsday Argument predicts humanity lasts roughly **10,000 to 15,000 more years**, not 60–90 years. If she stands up and says "95% chance of extinction in 90 years" using the standard math, a physicist in the audience will immediately know she fudged the numbers.

  ### 2. How to Fix It for the Novel (The "Cultist Twist")
  To get her prediction down to **60–90 years**, she needs to manipulate one of two variables. Since she is a cultist, she should be doing this intentionally (or delusionally). This adds character depth.

  #### Option A: The "Population Spike" Assumption (Recommended)
  She argues that before extinction, humanity will undergo a massive, final population explosion (e.g., space colonization, AI-driven reproduction, or life extension) before the crash.
  *   **The Logic:** "We aren't just counting biological births. We are counting *observer moments*."
  *   **The Math:** If she argues that the birth rate will skyrocket to **20 billion per year** for the final century (due to tech), then 2.2 trillion humans can be born in **110 years**.
  *   **Why it works:** It makes her sound like she's accounting for future tech, which fits a "near-future" setting.

  #### Option B: The "Reference Class" Hack
  This addresses your friend's comment. The DA only works if you define the "class" of observers correctly.
  *   **Standard Class:** "All biological humans." (Result: 10,000 years).
  *   **Cultist Class:** "All humans born *after the invention of nuclear weapons*."
  *   **The Math:** If she defines the class as "Humans living in the Age of Existential Risk" (starting ~1945), the total $n$ is much smaller (maybe 4 billion). If we are 95% through *this* specific class, the end is much closer.
  *   **Dialogue Line:** *"You're using the wrong reference class. You're counting cavemen. I'm counting humans who possess the capacity for self-annihilation. In that class, we are at the 98th percentile."*

  ### 3. The "Airtight" Formula for the Scene
  To make her speech sound authentic, have her write this on the board. It combines the DA with a specific birth rate assumption.

  **The Variables:**
  *   $n = 1.17 \times 10^{11}$ (Humans born so far)
  *   $f = 0.95$ (Confidence fraction: we are in the last 5%)
  *   $R = \text{Future Birth Rate}$

  **The Equation:**
  $$T_{\text{remaining}} = \frac{n \times (\frac{1}{1-f} - 1)}{R}$$

  **Simplified for the speech:**
  She claims there is a 95% probability that $N$ (total humans) is less than $20n$.
  But to get the **90-year** number, she needs to claim we are in the **last 1%** (99th percentile), not the last 5%.
  *   If $f = 0.99$, then $N < 100n$.
  *   Wait, to get a *short* time, she needs to argue $N$ is *barely larger* than $n$.
  *   She needs to argue: "There is a 95% chance that $N$ is less than $1.1 \times n$." (i.e., only 10% more humans are coming).
  *   $10\% \text{ of } 117 \text{ billion} = 11.7 \text{ billion humans left}$.
  *   $11.7 \text{ billion} / 140 \text{ million per year} \approx \mathbf{83 \text{ years}}$.

  **This is your golden ticket.** For her math to yield 83 years, she must assert with 95% confidence that **only 10% more humans will ever be born.** This is statistically aggressive, which fits a doomsday cultist.

  ### 4. Addressing the "Reference Class" Objection
  Your skeptic character should use the reference class objection to poke a hole in her theory. This validates your friend's advice and creates conflict.

  **Cultist:** "The math is Bayesian. It's airtight. We are random samples. $N$ is bounded."
  **Skeptic:** "Your reference class is arbitrary. Why 'Humans'? Why not 'Mammals'? Why not 'Conscious Entities'? If you include AI successors, $N$ goes to infinity, and your doomsday vanishes."
  **Cultist:** "AI isn't human. The class closes when the biology ends."

  ### 5. Sample Stage Directions & Dialogue
  Here is a draft of how she might present this to make it feel technical but dramatic:

  > She tapped the tablet, and the hologram shifted to a bell curve skewed heavily to the left.
  >
  > "Standard models assume exponential growth forever," she said, her voice steady. "They assume $N$ is infinite. But the Doomsday Argument applies the Copernican Principle to birth rank. I am human number 117 billion. Let's call that $n$."
  >
  > She swiped, and a new equation bloomed in the air: **$P(N < 20n) = 0.95$**.
  >
  > "In a normal distribution, there is a 95% probability that I am not in the first 5% of all humans who will ever exist. But look closer." She highlighted the tail end of the curve. "Given current fertility collapse and resource constraints, the variance shrinks. If we adjust the confidence interval to reflect the *Age of Risk* reference class—humans born post-1945—the probability distribution tightens."
  >
  > "You're cherry-picking the class," a voice called from the back.
  >
  > "I'm defining the sample set!" she snapped. "If we assume only 10% more humans remain to be born—a 95% confidence threshold based on current decay rates—that leaves 11.7 billion souls. At current birth rates, that is eighty-three years. Doomsday isn't a metaphor. It's a variable. And the variable solves to **2107**."

  ### Summary Checklist for You
  1.  **Don't use the standard 95% ($20n$) formula** if you want a 90-year prediction; it yields 10,000+ years.
  2.  **Have her tighten the confidence interval.** She needs to claim we are in the *last 10%* of humans, not just the last 5%.
  3.  **Explicitly mention Birth Rate.** The conversion from "Humans Left" to "Years Left" is the weakest link. Have her acknowledge it ("Assuming current birth rates...") so it sounds considered.
  4.  **Let the Skeptic win (a little).** Have another character point out the "Reference Class" problem. It shows you did your research and makes the cultist seem more fanatical for dismissing it.

  This approach keeps the math "hard" enough to satisfy a science-literate reader while giving your character the dramatic license to be terrifyingly specific.
