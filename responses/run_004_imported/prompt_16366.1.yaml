answer: |-
  **The Unity of Agency: A Defense of the Planning-Optimal Solution in the Absent-Minded Driver Problem**

  The Absent-Minded Driver (AMD) problem, introduced by Piccione and Rubinstein in 1997, stands as a modern Rorschach test for decision theorists. On its surface, it is a trivial optimization puzzle: a driver must exit at the second of two identical highway exits to maximize her payoff, but her imperfect recall forces her to adopt a mixed strategy. The mathematics of the "planning-optimal" solution are straightforward. If the payoffs are 0 for the first exit, 4 for the second, and 1 for missing both, the driver maximizes her ex-ante expected utility by committing to continue with probability $\alpha = 2/3$.

  However, the philosophical undercurrents of the problem run deep. The controversy arises when we shift perspective from the start of the journey to the moment the driver arrives at an exit. Stripped of memory and unable to distinguish her location, she must decide whether to exit or continue based on her credence that she is at the first versus the second exit. This "action-optimal" perspective suggests that standard expected-utility theory, which tacitly assumes perfect recall, may fracture when an agent encounters herself in the middle of a plan. Some theorists argue this necessitates a reconceptualization of rationality as a coordination problem among temporal selves; others maintain that the planning-optimal solution remains sovereign. This essay will reconstruct this controversy and argue that the planning-optimal solution is the only coherent normative standard. The apparent tension dissolves when we recognize that self-locating credence in this context is endogenous to the policy, not an independent constraint upon it, and that rational agency requires the ex-ante perspective to retain authority over the ex-interim execution.

  **The Planning-Optimal Baseline**

  To understand the controversy, one must first appreciate the stability of the ex-ante solution. From the start of the trip, the driver faces a simple lottery determined by her strategy $\alpha$ (the probability of continuing at any exit). The probability of exiting at the first interchange is $(1-\alpha)$, yielding a payoff of 0. The probability of exiting at the second is $\alpha(1-\alpha)$, yielding 4. The probability of missing both is $\alpha^2$, yielding 1. Her expected utility $V$ is:
  $$V(\alpha) = 0(1-\alpha) + 4\alpha(1-\alpha) + 1\alpha^2 = 4\alpha - 3\alpha^2$$
  Maximizing this function yields $\alpha = 2/3$, with an expected payoff of $4/3$. This is the "planning-optimal" solution. It represents what the driver, possessing full knowledge of the setup and her own limitations, would precommit to if she could bind her future actions. In standard decision theory, this ex-ante maximization is the definition of rational choice. The driver chooses the policy that best satisfies her preferences over world-states.

  **The Action-Optimal Challenge**

  The trouble begins when the driver actually arrives at an exit. She knows she is at *an* exit, but not *which* one. To apply expected-utility maximization in this moment, she needs a credence $p$ that she is at the first exit. If she exits, her expected payoff is $4(1-p)$. If she continues, her payoff depends on what she will do at the next exit (if there is one).

  The controversy lies in how $p$ is determined. Since the exits are indistinguishable, the probability of being at the second exit depends on the probability that she continued at the first. Thus, her credence $p$ is a function of her strategy $\alpha$. Specifically, if she plays $\alpha$, she reaches the first exit with probability 1 and the second with probability $\alpha$. Conditional on being at *an* exit, the probability it is the first is $1/(1+\alpha)$.

  Piccione and Rubinstein (P&R) argue that this creates a potential time inconsistency. They suggest that if the driver re-evaluates her choice at the intersection—treating her current action as a fresh decision variable while holding her credence fixed based on her *intended* strategy—she might find that the optimal action at the node differs from the planned $\alpha$. While in the specific 0-4-1 payoff case the numbers coincidentally align at $\alpha=2/3$, P&R demonstrate that in generalized payoff structures, the "action-optimal" $\alpha$ (derived from maximizing utility conditional on being at the node) can diverge from the "planning-optimal" $\alpha$.

  This has led some theorists to propose that imperfect recall fractures the agent. If the driver at the intersection calculates a different optimal $\alpha$ than the driver at the start, we are no longer dealing with a single agent executing a plan, but rather distinct "temporal selves" with potentially conflicting interests. This view draws a strong kinship with the Sleeping Beauty problem, where an agent's credence in the day (Monday vs. Tuesday) depends on the outcome of a coin toss and the protocol of awakening. In both cases, proponents of the "action-optimal" view argue that standard expected-utility theory fails because it assumes an agent can condition on information (like "I am at the first exit") that is not available to them, or that it ignores the evidential link between one's current choice and one's location.

  **The Case for Consistency**

  Opposing this fragmentation are theorists like Aumann, Hart, and Perry (1998), who defend the sovereignty of the planning-optimal solution. Their argument rests on the ontological unity of the agent. There is only one driver. The "self" at the first exit and the "self" at the second exit are not distinct entities negotiating a treaty; they are the same person at different points in a causal chain.

  From this perspective, the action-optimal calculation commits a category error. It treats the probability of being at the first exit ($p$) as a fixed state of the world that the driver discovers upon arrival. In reality, $p$ is a logical consequence of the driver's own policy. To use $p$ to justify deviating from the policy is circular: the credence that motivates the deviation is only valid if the policy is followed, but the deviation invalidates the credence.

  Aumann et al. argue that rationality in dynamic choice requires "extended consistency." The driver should not ask, "What is best for me right now, given where I might be?" but rather, "What policy, if executed consistently at every opportunity, yields the best result?" The interim moment is not a new decision problem; it is an execution node of the original decision problem. To re-optimize locally is to suffer from dynamic inconsistency, a failure of rationality akin to akrasia (weakness of will).

  **Verdict: The Normative Authority of the Ex-Ante Self**

  The dispute ultimately turns on a normative question: When planning and acting diverge, which perspective governs rational choice? I argue that the planning-optimal solution must prevail. The action-optimal approach, while intuitively seductive, relies on a mistaken reification of self-locating uncertainty and an impoverished view of agency.

  First, the planning-optimal view correctly identifies the locus of control. The driver's goal is to maximize the payoff of the *trip*, not the payoff of the *stop*. The ex-ante perspective encompasses the entire causal structure of the problem, including the probability of reaching the second exit. The interim perspective is necessarily partial; it conditions on having reached an exit, thereby screening off the risk of not reaching the second exit. If the driver privileges the interim perspective, she effectively ignores the cost of the actions that got her there. In the AMD problem, the "cost" is the risk of exiting too early. By maximizing utility conditional on arrival, the action-optimal approach tacitly treats the arrival as a sunk fact, whereas for the ex-ante agent, the probability of arrival is a variable under her control. Rationality requires managing risks, not just optimizing given realized risks.

  Second, the action-optimal approach misconstrues the nature of self-locating credence in single-agent problems. In the Sleeping Beauty problem, the debate between "halfers" and "thirders" concerns the truth-value of a belief about the world. In the AMD problem, the "credence" about which exit one faces is not an empirical discovery; it is a mathematical shadow of the chosen strategy. To allow this shadow to dictate the strategy is to put the cart before the horse. The driver does not find herself at an exit with a certain probability; she *places* herself there with that probability via her policy. Therefore, the credence cannot be used as an independent input to override the policy that generated it.

  Critics might argue that this view demands an implausible level of precommitment. What if the driver cannot bind herself? What if, at the exit, she is physically free to choose? This objection confuses *ability* with *rationality*. A smoker may be physically able to light a cigarette at a moment of weakness, but if she ex-ante judged that smoking violates her long-term goals, yielding to the interim urge is a rational failure, not a new optimization. In the AMD case, the "urge" is the misleading signal of the interim expected utility calculation. The driver who deviates from $\alpha=2/3$ because her interim calculation suggests otherwise is like the smoker who lights up because "just this once" seems low-risk. She is failing to recognize that "just this once" is part of a pattern she already evaluated and rejected.

  Finally, resolving the problem in favor of the planning-optimal solution preserves the scope of standard expected-utility theory without needing to fragment the agent. We need not view the driver as a sequence of selves playing a game against each other. We need only recognize that in problems with imperfect recall, the "act" is not the motor movement (turning the wheel), but the selection of the policy (the rule for turning the wheel). Standard expected-utility theory maximizes over acts. If we correctly identify the act as the policy choice $\alpha$, the theory works perfectly. The paradox arises only if we mistakenly identify the act as the local choice at the intersection.

  **Conclusion**

  The Absent-Minded Driver problem does not reveal a flaw in expected-utility theory, but rather a flaw in our intuition about where decision-making happens. The temptation to treat the arrival at an exit as a new decision point is strong, fueled by the phenomenological reality of being "in the moment." However, rational agency is defined by the coherence of one's pursuits over time. The driver's in-the-moment credence is well-defined only as a derivative of her plan, and it should never be allowed to override that plan. To do so would be to allow a part of the process to veto the whole, sacrificing the goal of the journey for the comfort of the stop. The planning-optimal solution wins not because it is mathematically convenient, but because it is the only one that respects the unity of the agent and the totality of her control.
