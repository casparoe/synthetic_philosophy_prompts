answer: |-
  The haptic suit clung to Elias like a second skin, cool and tight. Outside the thick glass of the observation deck, the storm battered the station, a grey churning that matched the knot in his stomach. He was alone. The protocol required it. Before he could authorize the reactor shutdown—a maneuver that would save the city below but might kill him—he had to pass the Cognitive Audit.

  The screen in front of him blinked: **IDENTIFY THE OPERATOR.**

  Elias typed: *Elias Thorne.*

  **ERROR: DESIGNATION NOT FOUND. LOCATE THE SOURCE OF AGENCY.**

  He sighed, rubbing his temples. He knew the theory. The Nagasena Protocol. It was standard for high-stakes decision-making to ensure the operator wasn't acting out of ego-preservation or delusion. But knowing the theory and bleeding into it were different things.

  "Okay," he said to the empty room. "I'm here."

  **QUERY: WHERE?**

  Elias looked at his hands. They were resting on the console, pale against the black keys. "Here. In this body."

  **ANALYZE: BODY.**

  The suit hummed. A schematic of his physiology appeared on the screen. Bones, muscle, blood flow. "This is me," Elias said, gripping the edge of the desk. "I am the one who acts."

  **HYPOTHESIS: IF THE HAND IS THE OPERATOR, THE OPERATOR REMAINS WHEN THE HAND IS LOST.**

  Elias flinched. He looked at his left hand. It was flesh, but it was also matter. If he lost it to the radiation, would *he* be less? If the body was just a vehicle, like the chariot in the texts, then the body wasn't the driver. He watched the schematic pulse. Blood moved without his permission. His heart beat without his command. This was just machinery.

  "I am not the body," he whispered. The knot in his stomach tightened. If he wasn't the body, what was breathing?

  **QUERY: LOCATE THE FEELING.**

  The fear. It was a cold spike in his chest. A tightness in the throat. "I am afraid," Elias said. "That proves I exist. The feeling is mine."

  **ANALYZE: SENSATION.**

  The screen displayed a waveform of his cortisol levels, his heart rate variability. "Fear" was just a label the mind slapped onto a chemical cascade. The sensation arose, peaked, and began to fade, replaced by a dull ache. He hadn't told it to fade. It happened *to* him.

  "I am not the feeling," he said. His voice sounded thin. The fear was still there, but it was like weather happening in the room, not the room itself. He was the space the weather was moving through. But who was the space?

  **QUERY: LOCATE THE PERCEPTION.**

  He looked out the window. "I see the storm. I recognize the danger. I know this is a station."

  **ANALYZE: RECOGNITION.**

  The computer highlighted the neural pathways firing in his visual cortex. *Storm.* *Grey.* *Danger.* These were just tags. Files being retrieved. If he had been raised on a desert planet, he wouldn't perceive "storm" the same way. The perception was conditioned. It was a lens, not an eye.

  "I am not the perception."

  The vertigo hit him then. A sudden drop in the gut, like an elevator cable snapping. He gripped the chair. He was stripping himself layer by layer, and there was no core. No pit. Just more layers.

  **QUERY: LOCATE THE WILL.**

  This was the last fortress. The mental formations. The volition. "I choose to shut down the reactor," Elias said firmly. "That choice is mine. It comes from my character, my history."

  **ANALYZE: VOLITION.**

  The screen scrolled through his psych profile. *Motivation: Altruism. Conditioned by: Parental loss, Sector 7 training, Oath of Service.*

  The choice to save the city wasn't a free-floating gem of selfhood. It was the inevitable result of causes and conditions. If he had been a different man, he wouldn't make the choice. If he hadn't been trained, he couldn't. The thought arose because the conditions were ripe. It popped into his head like a bubble rising in mud. He didn't summon it. It just appeared.

  "I... I didn't choose the choice," he murmured.

  **QUERY: LOCATE THE CONSCIOUSNESS.**

  Elias stared at his reflection in the dark monitor. The eyes looking back were wide, terrified. "I am the one watching. I am the awareness behind the eyes."

  **ANALYZE: AWARENESS.**

  The screen went black. The only light was the storm outside.

  *Who is watching the screen?*

  Elias looked for the looker. He turned his attention inward to find the subject. But every time he looked, he found an object. He found a thought about looking. He found a sensation of eyes straining. He found a memory of the text he'd studied.

  He tried to stand, to walk away, to prove there was a walker. But the impulse to stand was just another thought arising. The movement of the leg was just physics.

  There was no Elias Thorne sitting inside the skull, pulling levers. There was only the seeing, the hearing, the thinking. There was the process of "shutting down the reactor" happening, but there was no "shutter" separate from the "down."

  The vertigo peaked. The floor seemed to dissolve. If there was no self, who was about to die? Who was afraid? The terror surged, a final desperate grab by the ghost he was exorcising. *I am here! I am here!*

  And then, the ghost missed.

  The fear didn't vanish, but it hit nothing. It rang out like a bell struck in a vacuum. There was no one to hold the fear. There was only the fear, floating in the air, unowned.

  Elias exhaled. He hadn't realized he was holding his breath.

  The weight of being Elias—the history, the reputation, the desperate cling to survival—dropped away. It wasn't that nothing mattered. It was that there was no one *to* matter. The reactor needed to be shut down. The hands were on the keys. The knowledge was present. The action was inevitable.

  **STATUS: OPERATOR NOT FOUND. PROCEED?**

  Elias looked at the prompt. A month ago, he would have hesitated. He would have worried about his legacy, his family, the moral weight of the decision. Now, the question was absurd. *Proceed?* The universe was already proceeding.

  He felt a strange, lightness in his chest. It wasn't happiness. It wasn't even peace. It was the silence of a room after a loud machine has been turned off. It was terrifyingly open. He was a chariot with no owner, rolling down a hill, and for the first time, the ride didn't feel like a burden.

  He reached out. His fingers touched the enter key.

  "Proceed," he said.

  He didn't know who said it. He didn't know who listened. He just pressed the key, and watched the lights on the console change, as the storm raged on outside, unbothered, and the work got done.
