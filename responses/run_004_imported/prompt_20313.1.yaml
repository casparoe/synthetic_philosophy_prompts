answer: |-
  This is a fantastic question to center a seminar around. You are absolutely right to sense an asymmetry here. While the synchronic Dutch Book Argument (DBA) for Probabilism is often treated as a "classic" (if contested) justification, the diachronic DBA for Conditionalization is widely regarded as structurally vulnerable in ways the synchronic one is not.

  The core tension lies in the **temporal gap** between the two bets. In the synchronic case, all betting quotients are available simultaneously. In the diachronic case, the Bookie is betting against your *future* self, which introduces assumptions about commitment and knowledge that don't apply to the synchronic case.

  Here is a breakdown of the diachronic setup, the specific objections (focusing on Maher and Christensen), and the pragmatic/epistemic distinction for your lecture.

  ---

  ### 1. The Diachronic Dutch Book Setup (Lewis/Teller)

  To make this clear for your students, it helps to formalize the timeline and the specific violation.

  **The Setup:**
  *   **Time $t_1$:** Agent has credence function $P_1$.
  *   **Time $t_2$:** Agent learns proposition $E$ (and nothing else) and updates to $P_2$.
  *   **The Norm:** Conditionalization requires $P_2(H) = P_1(H|E)$.
  *   **The Violation:** Suppose $P_1(H|E) = 0.4$, but the Agent's updating rule dictates that if they learn $E$, they will set $P_2(H) = 0.6$.

  **The Bookie's Strategy:**
  The Bookie knows $P_1$ and, crucially, **knows the Agent's updating rule** at $t_1$. The Bookie constructs two bets to exploit the difference between $0.4$ and $0.6$. Let the Stake $S = \$100$.

  *   **Bet 1 (Offered at $t_1$):** A *conditional* bet on $H$ given $E$.
      *   This bet is called off (money returned) if $\neg E$.
      *   If $E$ occurs, it pays $\$100$ if $H$, $\$0$ if $\neg H$.
      *   **Price:** Based on $P_1(H|E) = 0.4$. Cost = $\$40$.
      *   **Bookie's Move:** Since the Agent values this at $\$40$ but will value $H$ higher later, the Bookie **buys** this bet from the Agent.
      *   *Cash flow $t_1$:* Agent receives $\$40$ from Bookie.

  *   **Bet 2 (Offered at $t_2$, only if $E$ occurs):** An unconditional bet on $H$.
      *   Pays $\$100$ if $H$, $\$0$ if $\neg H$.
      *   **Price:** Based on $P_2(H) = 0.6$. Cost = $\$60$.
      *   **Bookie's Move:** The Bookie **sells** this bet to the Agent.
      *   *Cash flow $t_2$:* Agent pays $\$60$ to Bookie.

  **The Guaranteed Loss:**
  If $E$ does not occur, Bet 1 is called off, Bet 2 is never offered. Net: $\$0$.
  If $E$ occurs, we look at the outcomes for $H$:

  1.  **If $H$ is true:**
      *   Bet 1: Agent sold the bet, so Agent pays Bookie $\$100$.
      *   Bet 2: Agent bought the bet, so Bookie pays Agent $\$100$.
      *   *Payoff Net:* $\$0$.
      *   *Stake Net:* Agent got $\$40$ ($t_1$), paid $\$60$ ($t_2$). **Total Loss: $\$20$.**
  2.  **If $H$ is false:**
      *   Bet 1: Agent sold the bet, pays $\$0$.
      *   Bet 2: Agent bought the bet, receives $\$0$.
      *   *Payoff Net:* $\$0$.
      *   *Stake Net:* Agent got $\$40$ ($t_1$), paid $\$60$ ($t_2$). **Total Loss: $\$20$.**

  The Agent loses $\$20$ regardless of the truth of $H$, provided $E$ is true.

  ---

  ### 2. Why This is Shakier: The Objections

  The synchronic DBA assumes the Bookie knows your *current* betting quotients. The diachronic DBA requires much stronger assumptions, which is where Maher and Christensen drive a wedge.

  #### A. The Bookie's Epistemic Access (Maher)
  Patrick Maher (1992) points out that for the Bookie to place Bet 1 at $t_1$, they must know **now** what your credences **will be** at $t_2$.
  *   **Synchronic:** Your current credences are (arguably) public via your betting behavior.
  *   **Diachronic:** Your future credences depend on your *updating policy*. Do you actually have a fixed policy at $t_1$? Many agents don't decide how they will react to evidence until they see the evidence.
  *   **The Problem:** If the Agent hasn't fixed their updating rule at $t_1$, the Bookie cannot construct the Dutch Book. The argument thus proves: *If you have a fixed updating rule known to a Bookie, it should be Conditionalization.* It doesn't prove you must have a fixed rule, nor that Conditionalization is rational if you don't.

  #### B. The "Sophisticated Agent" / Optionality (Christensen)
  David Christensen (1991) raises a deeper objection regarding **commitment**.
  *   In the synchronic case, the Bookie offers all bets at once. You either accept the package or you don't.
  *   In the diachronic case, the bets are offered sequentially. At $t_2$, the Agent is offered Bet 2.
  *   **The Dodge:** A "sophisticated" Agent at $t_2$ looks at their portfolio. They see they already hold Bet 1 (which they sold). They realize that accepting Bet 2 locks in a sure loss *given* Bet 1. So, they simply **refuse Bet 2**.
  *   **The Implication:** If the Agent refuses Bet 2, there is no Dutch Book. The Agent avoids the sure loss *without* Conditionalizing. They avoid it by being strategically stubborn at $t_2$.
  *   **Why this hurts the argument:** The DBA is supposed to show that violating Conditionalization is irrational. But here, an agent can violate Conditionalization ($P_2 \neq P_1|E$) and still avoid the sure loss (by refusing the bet). Therefore, avoiding the Dutch Book does not *require* Conditionalization; it only requires **commitment to betting** at $t_2$.
  *   **Summary:** The DBA conflates *diachronic coherence* with *commitment to a betting policy*. You can be incoherent but safe if you refuse to bet tomorrow.

  ---

  ### 3. Pragmatic vs. Epistemic Rationality

  This connects directly to your final point about the nature of the norm.

  *   **Pragmatic (Dutch Book):** The cost of incoherence is **financial**. It shows that your beliefs make you vulnerable to exploitation *if* you engage in certain transactions. As the Christensen objection shows, you can escape this cost pragmatically (by refusing bets) without fixing the underlying belief state.
  *   **Epistemic (Accuracy):** The cost of incoherence is **inaccuracy**. Your credences are further from the truth than they need to be (measured by Brier scores, etc.).

  **The Lecture Takeaway:**
  The diachronic Dutch Book argument fails to establish Conditionalization as an *epistemic* norm because the "sure loss" can be dodged by pragmatic maneuvering (refusing bets) that has nothing to do with truth-seeking. It shows that *betting* according to non-conditionalizing rules is dangerous, not that *believing* according to them is inaccurate.

  This is why contemporary formal epistemology has largely shifted toward **Accuracy Arguments** (e.g., David Joyce, Hilary Greaves) for Conditionalization. These arguments show that if you don't conditionalize, there is *always* an alternative updating rule that guarantees a more accurate belief state (lower Brier score) regardless of the world state, without needing to assume a Bookie exists or that the agent is committed to betting.

  ### Summary for your Students
  1.  **Synchronic DBA:** Exploits static inconsistency. Hard to dodge without changing credences.
  2.  **Diachronic DBA:** Exploits dynamic inconsistency. Easy to dodge by refusing future bets (Christensen) or lacking a fixed future policy (Maher).
  3.  **Conclusion:** The Diachronic DBA proves that *conditionalizing is necessary to avoid money pumps if you are committed to betting*, but it does not prove that *conditionalizing is necessary for rational belief*.
