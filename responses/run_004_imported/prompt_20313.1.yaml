              *   Stakes: Agent +40, -60. Net -20. **Sure Loss.**
      *   *Okay, got the direction right now.* Bookie buys low, sells high.
      *   *Crucial nuance:* The Bookie must know at $t_1$ that the Agent *will* offer/accept Bet 2 at $t_2$.

