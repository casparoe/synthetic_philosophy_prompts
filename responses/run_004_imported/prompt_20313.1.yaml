      *   *Correction:* The Bookie needs to *exploit* the difference.
          *   If $P_2(H) > P_1(H|E)$: Bookie *sells* Agent a bet on $H$ at $t_1$ (conditional on $E$) at the low price. At $t_2$, Bookie *buys* a bet on $H$ from Agent at the high price.
          *   Wait, if Bookie sells at $t_1$, Bookie gets the stake. If Bookie buys at $t_2$, Bookie pays the stake.
          *   Let's trace the money.
          *   Case: $P_1(H|E) = 0.4$, $P_2(H) = 0.6$. Stake = $100.
          *   $t_1$: Bookie sells Agent bet on $H$ (call-off $\neg E$). Price $40. Agent pays Bookie $40.
          *   $t_2$ (E occurs): Bookie buys bet on $H$ from Agent. Price $60. Bookie pays Agent $60.
          *   Outcome $H$:
              *   Bet 1: Bookie pays Agent $100.
              *   Bet 2: Agent pays Bookie $100.
              *   Net on payoff: 0.
              *   Net on stakes: Bookie got $40 (t1), paid $60 (t2). Bookie loses $20. Agent gains $20.
          *   *Wait, the Dutch Book must hurt the Agent.*
          *   Okay, reverse the Bookie's positions.
