  2.  **Deconstruct the Philosophical Concepts:**
      *   **Counterfactual Theory (David Lewis):** Causation is about dependence. $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. (The "But-For" test).
      *   **Interventionist Theory (James Woodward / Judea Pearl):** Causation is about manipulation/invariance. $C$ causes $E$ if changing $C$ (while holding other relevant factors fixed) changes $E$. It focuses on the *mechanism* or *pathway*.
      *   **The Problem Case (Early Preemption):** Suzy and Billy throw rocks. Suzy's hits first. Bottle shatters. If Suzy hadn't thrown, Billy's would have hit.
      *   **Why Counterfactuals Struggle:** If Suzy hadn't thrown ($\neg C$), the bottle still shatters ($E$) because of Billy. So, $E$ does not *depend* on $C$ in the simple counterfactual sense. Suzy isn't a "but-for" cause. But intuitively, Suzy *did* cause it.
      *   **Why Interventionists Succeed:** They look at the process. If we intervene to stop Suzy's rock *mid-flight* (after Billy has committed but before impact), the outcome changes. Or, more accurately, they model the *causal path*. Suzy's throw is connected to the shattering via a continuous process. Billy's is cut off. Interventionism allows holding "Billy's throw" fixed while manipulating "Suzy's throw" to see the effect on the shattering *along the actual path*.

