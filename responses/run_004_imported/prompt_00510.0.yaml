      *   **Theory 2: Interventionism (The "Knob-Turning" Test):**
          *   Explain the logic: "If I wiggle X, does Y wiggle, assuming the rest of the system stays put?" It's about the *connection*, not just the outcome.
          *   Apply to Suzy: We look at the actual chain of events. Suzy's rock is in the air. Billy's rock is in the air. We intervene on Suzy's rock (e.g., catch it).
          *   Crucial Distinction: Interventionism cares about the *process* that actually happened. In the actual world, Billy's rock didn't hit. We hold fixed the fact that Billy's rock *didn't hit* (because Suzy's did).
          *   Verdict: Interventionism says "Suzy caused it" because her action was the active lever connected to the result in the actual scenario.
