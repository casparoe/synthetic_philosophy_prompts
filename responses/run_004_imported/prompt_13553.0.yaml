  9.  (Final Review of the Output): Ensure the distinction between "sentience" (modern legal/biological term) and "rational soul" (Cartesian term) is clear. Descartes denies *reason*, not necessarily *sensation* (though he blurs this, often treating sensation as mechanical too). Wait, Descartes generally denies *conscious feeling* in animals too (they cry out like a squeaking gear). I should clarify that.

