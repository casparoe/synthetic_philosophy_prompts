      *   *Modest Move:* The absence of pain is good *because* it prevents a subject from suffering. If there is no subject, the "good" is just the lack of a negative event, not a positive value state in the universe.
      *   *The "Extra Assumption":* Benatar assumes that "good" and "bad" can exist independently of a subject (an axiological claim). The modest view assumes value is tied to welfare of subjects (a person-affecting claim).
      *   *Does the strong conclusion follow?* No. If you hold the modest view (person-affecting), you can say "Non-existence isn't better than existence for a happy person; it's just *neutral*." Benatar needs Non-existence to be *better* (or at least Existence to be *worse*) in a way that outweighs the pleasures of life.
