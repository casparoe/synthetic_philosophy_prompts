answer: |-
  **Setting:** *Rochester, New York. The office of Frederick Douglass, 1855. Papers are stacked high on the desk. Outside, the sounds of a bustling street fade into the background. William Lloyd Garrison stands by the window, looking out. Douglass sits behind the desk, a copy of the Constitution open before him. The air is thick with the smoke of a dying pipe and the weight of a broken friendship.*

  **Garrison:** (Turning from the window, his voice tight) You publish this in *The North Star*, Frederick. You tell men to vote. You tell them to swear oaths to a government that buys and sells human flesh. How do you sleep?

  **Douglass:** I sleep because I am working, William. Not just praying, not just pleading. Working. There is a difference between moral suasion and political power.

  **Garrison:** Power? You seek power from a poisoned well! I told you this ten years ago in Boston. I burned this document for a reason. It is, as I wrote, a "covenant with death and an agreement with hell." You cannot make a bargain with the devil and expect to save your soul.

  **Douglass:** (Leaning forward) You speak of the devil, but I speak of the text. Look at it. (He taps the page) You burn the book because you hate the men who wrote it. But I am telling you, the words themselves are our allies.

  **Garrison:** The words? "We the People"? Which people, Frederick? The ones chained in the hold? Or the ones holding the whip? You cannot separate the parchment from the intent. The Framers met in Philadelphia and they cut deals. They counted our brothers as three-fifths of a man to bolster the South's representation in Congress. How is that liberty?

  **Douglass:** That clause does not say "slave." It says "other persons." It is a euphemism, yes, born of shame. But listen to the logic of it. If the Constitution recognized property in man, it would count them as full property. By counting them as three-fifths, it actually penalizes the slave states. It gives them less representation than if they counted us as whole men, but more than if they counted us as nothing. It is a compromise that acknowledges we are persons, not things.

  **Garrison:** (Laughs bitterly) A penalty? It gave the Slave Power dominance in the Presidency for fifty years! It allowed them to expand into Texas and Mexico. The intent was clear: protect the institution. If you ignore the intent, you are being naive. The government is a machine built to crush the black man. To vote for it is to grease the gears.

  **Douglass:** Then what is your alternative? Disunion? "No Union with Slaveholders"? If we dissolve the Union, the North washes its hands of us entirely. The Fugitive Slave Law becomes international law between two nations. At least within the Union, I can claim the protections of the Constitution.

  **Garrison:** What protections? Point to one! The Constitution mandates that if a man escapes his chains to your free soil, you must drag him back. Article IV, Section 2. It makes every Northerner a slave catcher. It stains the hands of every citizen who obeys the law.

  **Douglass:** (Standing up, voice rising) That is where you are wrong! The Constitution says persons "held to service or labor" shall be delivered up. It does not give Congress the power to legislate how. The Fugitive Slave Act of 1850? That is an overreach! It is unconstitutional! If we control the government, we can repeal the act. If we abandon the government, as you wish, we leave the field to the slaveholders.

  **Garrison:** You think you can out-maneuver men who have held the reins since Washington? You think you can use a tool designed to break your back to smash their heads? It is a fantasy. It compromises your moral standing. When you vote for a candidate who tolerates slavery, even to end it slowly, you have accepted slavery as a possibility. I will not accept it for a single moment.

  **Douglass:** And your purity saves no one! (He walks around the desk, confronting Garrison) I was a slave, William. I know the smell of the auction block. When I was in the field, I did not care about the moral purity of the abolitionist in Boston. I cared about the hand that could break the lock. If the Constitution can be read as a liberty document, then it is a weapon. Why throw away the sword because the hilt is tarnished?

  **Garrison:** Because the blade is rusted with blood! You say "read the words." I say look at the fruit. The fruit is bondage. The Framers protected slavery for twenty years via the importation clause. They silenced debate with the gag rule. The system is rigged. To participate is to say the system is legitimate.

  **Douglass:** The system is legitimate only insofar as we make it so. If I can stand in a courtroom and argue that the Constitution guarantees me trial by jury, and the judge agrees, does that not free me? If I can vote for a man who promises to restrict slavery's expansion, is that not a blow struck? You want to stand outside the walls and shout. I intend to walk through the gate and open it from the inside.

  **Garrison:** (Softening slightly, but still firm) I fear you will be swallowed by the gate, Frederick. Politics is the art of compromise. You cannot compromise with evil. Once you step into that arena, you will have to shake hands with men who own slaves. You will have to bargain. And slowly, the "anti-slavery Constitution" will become a pro-slavery shield in your hands, just as it was in theirs.

  **Douglass:** Then I will take that risk. Better to risk corruption in the fight for freedom than to remain pure in the face of tyranny. You call it a covenant with death. I call it a promise of liberty that has yet to be kept. It is a check written to all people, endorsed by the Framers, but the banks have refused to cash it. I say we force them to honor the signature.

  **Garrison:** (Sighs, picking up his hat) We both want the same end, my friend. The chains broken. The whip silenced.

  **Douglass:** But you believe the road to freedom lies in destroying the map. I believe the map is correct, but the travelers have been blind.

  **Garrison:** (At the door, pausing) I pray you are right, Frederick. For your sake. But when the Constitution is used to return a mother to her master, remember that the ink on that page is not just ink. It is blood. And it will demand more of it.

  **Douglass:** (Sitting back down, opening a fresh sheet of paper) And I will pray that when that day comes, you are ready to fight not just against the document, but for the people it was meant to protect. Good day, William.

  **Garrison:** Good day, Frederick.

  *(Garrison exits, closing the door softly. Douglass dips his pen in ink, looks at the Constitution, and begins to write.)*
