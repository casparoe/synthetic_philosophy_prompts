answer: |-
  **Setting:** *A quiet corner of a university library. Two graduate students, Clara (a metaphysical realist) and David (a deflationist/quantifier variance theorist), are surrounded by stacks of papers on mereology.*

  **Clara:** Look, let's stop abstracting for a second. Take the specific case. The Eiffel Tower and my left shoe. The universalist says there is an object composed of exactly those two things. I say there isn't. We can't both be right about the world. If I say "There is no Shoe-Tower object," and he says "There is a Shoe-Tower object," one of us is failing to describe reality as it is.

  **David:** But why assume "There is" functions the same way in both your mouths? Think about the word "flat." If I say the table is flat, and a physicist says it isn't because of the atomic roughness, we aren't fighting about the table's surface. We're using different standards for "flat." I'm suggesting the same is happening with "exists." The universalist uses a loose, permissive quantifier. You use a restricted, commonsense one. Both are legitimate linguistic tools.

  **Clara:** That might work for "flat," which is clearly context-dependent. But existence? If quantifier variance is true, then metaphysics isn't discovering the structure of reality; it's just choosing a dialect. If I claim the Shoe-Tower *doesn't exist*, I'm making a claim about what the world contains, not just how I speak.

  **David:** Okay, let's test that. You claim it's a worldly disagreement. I need you to tell me: what would count as evidence that you are right and the universalist is wrong? And I don't mean evidence that relies on your definition of "object." I mean, if we agreed on every single atomic fact—the position of every particle in the Tower and every particle in your shoe—what *further fact* are you pointing to when you say "No fusion exists"?

  **Clara:** The further fact is the fact of composition itself. It's not about particle positions; it's about whether those particles *constitute* a further entity.

  **David:** But that just restates the dispute. I'm asking for a condition of substantivity. If quantifier variance is false, there must be some way to describe the state of affairs that makes your quantifier the "correct" one, independent of the quantifier itself. If you can't describe the evidence without already assuming your restricted quantifier is the right one, then you haven't shown the dispute is substantive. You've just stipulated that your language is the world's language. So, short of stipulation: what observation settles this?

  **Clara:** It's not an observation in the empirical sense. It's about explanatory power and naturalness. Here is my answer to your challenge: The evidence that the dispute is substantive is that my ontology tracks causal powers and natural kinds, while the universalist's does not. The Shoe-Tower has no causal powers over and above the Tower and the shoe separately. It plays no role in science. The "fact" that settles it is that reality is structured around causal unity, not arbitrary collection.

  **David:** I see. So you're arguing that the privileged quantifier is the one that ranges only over causally integrated entities?

  **Clara:** Exactly. The world has "joints." My quantifier carves at the joints. The universalist's quantifier carves through them, creating gerrymandered entities like the Shoe-Tower. That makes my quantifier metaphysically privileged. It's the one that matches the fundamental structure of reality.

  **David:** But now you've shifted the ground. You're no longer arguing about the meaning of "exists." You're arguing about the meaning of "natural kind" or "causal unity." The universalist can agree that the Shoe-Tower is not a *natural kind*. They can agree it has no *unique* causal powers. They just deny that being a natural kind is a prerequisite for *existence*.

  **Clara:** But if existence isn't tied to natural kinds, what is it tied to? If you allow the Shoe-Tower to exist, you're saying existence is trivial. It adds nothing to our understanding of the world. A metaphysically privileged quantifier must be one that illuminates the fundamental ontology. If a quantifier ranges over everything, including arbitrary fusions, it fails to distinguish between fundamental reality and conceptual noise. That distinction is what makes my quantifier privileged.

  **David:** You're assuming that "fundamental reality" is sparse. But why can't fundamental reality be dense? Why can't the world contain the Shoe-Tower, even if it's boring? My point is this: To show your quantifier is privileged, you need a criterion for privilege that doesn't beg the question. You say "It tracks the joints." But the universalist says, "The joints are just where the simples are. The fusion is just the simples arranged thusly. There is no extra 'joint' to miss."

  **Clara:** Because if the fusion is "just the simples," then saying the fusion *exists* is misleading. It implies a unity that isn't there.

  **David:** Or, it implies a meaning of "exists" that is broader than "unified." Look, let's go back to my challenge about evidence. You said the evidence is causal integration. But the universalist agrees on all the causal facts. They agree the Shoe-Tower doesn't act as a unit. They just say, "It exists, but it's a scattered object." If you agree on all the causal predictions, and you agree on the arrangement of simples, the only thing left is the word "exists." If you insist there's a "worldly fact" of composition remaining, you're positing a metaphysical glue. What is this glue? How do we detect it?

  **Clara:** We detect it through theoretical virtue. We detect it because an ontology that admits the Shoe-Tower is less parsimonious and less explanatory. The privileged quantifier is the one that yields the best theory of the world. It's not about detecting "glue"; it's about recognizing that existence is a theoretical posit. We posit objects to explain phenomena. Since the Shoe-Tower explains nothing, positing its existence is bad theory. Therefore, the quantifier that excludes it is the one that tracks truth.

  **David:** But that makes existence pragmatic, not worldly. You're saying "We *should* use this quantifier because it's useful." I'm saying "Both quantifiers are useful for different things." If existence is just a theoretical posit for explanation, then when the universalist says "The Shoe-Tower exists," they aren't making a false claim; they are just making a claim that isn't *useful* for physics. But metaphysics isn't just physics.

  **Clara:** Metaphysics is about what is *fundamentally* the case. If the universalist's quantifier is equally legitimate, then there is no fact of the matter about whether the Shoe-Tower is part of fundamental reality. That leads to ontological relativism. I refuse to accept that. There is a fact of the matter. The fact is determined by which quantifier captures the notion of "being" that is mind-independent.

  **David:** And there is the circle. You define the "mind-independent" quantifier as the one that excludes the Shoe-Tower. But why is excluding the Shoe-Tower a requirement for mind-independence? The arrangement of the Tower-particles and Shoe-particles is mind-independent. The universalist quantifier ranges over that arrangement. Your quantifier ranges over it *plus* a restriction based on human interests in unity. Arguably, *your* quantifier is the one infected by human cognitive limitations. We like unity. The world might not care.

  **Clara:** The world does care, because causality is in the world, not in our heads. Causal integration is objective. If the Shoe-Tower doesn't act as a cause, it isn't a substance. And if it isn't a substance, it shouldn't fall under the privileged existential quantifier.

  **David:** Okay, let's grant that causal integration is objective. The universalist can still say: "Causal integration determines *kind*, not *existence*." Gold is a natural kind; a pile of gold dust is not. But both exist. The Shoe-Tower is a pile, not a kind. It exists, but it's not a kind. You are conflating "is a substantial object" with "exists." Until you can show me that "existence" *means* "substantial object" without just defining it that way, I maintain that you are just preferring a restricted dialect.

  **Clara:** I'm not defining it that way; I'm arguing that the concept of "object" in metaphysics *just is* the concept of a substance. If the universalist wants to say the Shoe-Tower "exists" in some deflated sense, fine. But when we do metaphysics, we are asking about Substance. If their quantifier ranges over non-substances, it is not the metaphysical quantifier. It is a logical quantifier. The dispute is substantive because we are fighting over which quantifier captures the metaphysical notion of Being.

  **David:** And I say there is no single "Metaphysical Notion of Being" waiting to be found. There are only various ways we use language to cope with the distribution of simples. If you can't point to a fact about the Tower and Shoe that isn't already agreed upon by both sides—like particle position or causal power—then the "fight" is just about which linguistic framework gets to wear the crown of "Metaphysics." And that's a prize worth fighting over, sure, but it's not a worldly fact.

  **Clara:** Then we are at an impasse. Because I believe the choice of framework is constrained by the world. The world pushes back. It resists the Shoe-Tower ontology.

  **David:** And I believe the world only pushes back when you try to move the particles. As long as you agree on the particles, the rest is just talk.
