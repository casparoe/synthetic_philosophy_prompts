      *   **Goal:** Write a eulogy that is technically honest about Leibniz's actual argument (not Panglossian) but also genuinely consoling. Avoid flattening her beliefs into platitudes.
      *   **Key Leibnizian Concepts to Incorporate (subtly or explicitly):**
          *   Compossibility (bundles of things, not isolated goods).
          *   Antecedent vs. Consequent will (what God wills vs. permits).
