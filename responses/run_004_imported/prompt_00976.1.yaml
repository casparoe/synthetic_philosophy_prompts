          *   *Point 2: The Evidence of Waste.* Look at nature. Evolution is built on waste. Stars die. Species go extinct. If the universe is rational in Gödel's sense, it tolerates massive waste elsewhere. Why is human potential special?
          *   *Point 3: The Definition of Potential.* Potential is infinite. No finite afterlife could fulfill *all* potential. So the premise "all potential must be realized" leads to an infinite regress or is impossible by definition.
      *   **The Verdict:**
