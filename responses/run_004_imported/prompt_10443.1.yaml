answer: |-
  Here is a concrete scenario designed to break the "Normal Species Functioning" baseline, focusing on environmental mismatch and reference class ambiguity.

  ### The Treatment: *NF-κB Pathway Dampening* (The "Dust-Lung" Fix)

  **The Context:**
  In your near-future setting, industrial zones are saturated with synthetic nanofibers (from construction, manufacturing, or atmospheric scrubbers). These fibers are chemically inert but physically irritating. When inhaled, the human immune system identifies them as invaders and mounts a chronic inflammatory response. Over 5–10 years, this inflammation causes pulmonary fibrosis (scarring), leading to suffocation.

  **The Gene Therapy:**
  The clinic offers a viral vector that downregulates the *NF-κB* pathway in alveolar macrophages. Essentially, it teaches the lungs to *ignore* the fibers. The immune system stops attacking the dust, preventing the scarring.

  **Why the Therapy/Enhancement Label Breaks Down:**

  This case fractures the Norman Daniels baseline because "Normal Species Functioning" depends entirely on which **Reference Class** you use to define the patient.

  #### 1. The Evolutionary Reference Class (Regulator's View)
  *   **Baseline:** A "normal" human immune system reacts to foreign particulates in the lung. That is the species-typical design.
  *   **The Verdict:** **Enhancement (or Disability).** By dampening the immune response, you are *removing* a functional capability (the ability to detect and fight invaders). You are making the patient *less* human biologically, even if it helps them survive.
  *   **The Regulatory Trap:** The law bans "immune suppression" unless there is a diagnosed autoimmune disorder. Reacting to dust is not an autoimmune disorder; it's a healthy immune system doing its job too well. Therefore, stopping it is not therapy; it's modification.

  #### 2. The Environmental Reference Class (Clinic's View)
  *   **Baseline:** A "normal" human in *this specific zip code* breathes air containing 50,000 fibers/m³. In this environment, a "normal" immune response is fatal within a decade.
  *   **The Verdict:** **Therapy.** The environment has changed faster than evolution. The "species-typical" response is now a pathology *in this context*. Restoring "functional normality" (the ability to breathe and work for 40 years) requires breaking the "biological normality."
  *   **The Argument:** "You are defining 'Normal' based on a human living in a clean room in 2024. My patient lives here. For them, an immune system that scars the lungs is a defect, not a feature."

  #### 3. The Occupational Reference Class (The Ambiguity)
  *   **The Shift:** The treatment is legally "Therapy" for a demolition worker (high exposure) but "Enhancement" for an office worker (low exposure) living in the same city.
  *   **The Scene Conflict:** The patient is a **courier** who moves between zones.
      *   When they are in the **Industrial Zone**, they are disabled without the tweak (lungs scar).
      *   When they are in the **Clean Zone**, they are "enhanced" (immune system superior to locals, able to tolerate dust locals can't).
      *   **The Regulator's Trap:** "Your patient isn't permanently disabled. They are only sick when they choose to enter the Industrial Zone. Treating them is like giving someone gills because they want to dive. It's enhancement for mobility, not therapy for pathology."
      *   **The Doctor's Counter:** "Their livelihood requires mobility. If the economic environment forces them into the dust, the inability to tolerate dust is a disability. You are penalizing them for the geography of their poverty."

  #### 4. The Age/Time Reference Class (The "Prophylaxis" Paradox)
  *   **The Shift:** The treatment works best *before* scarring begins.
      *   **If given to a sick patient (40yo):** It's clearly therapy (stopping disease progression).
      *   **If given to a healthy child (10yo):** It's "prophylactic enhancement." The child has no pathology *yet*.
  *   **The Bite:** By the time the child becomes "sick" enough to qualify for therapy, the scarring is irreversible and the gene tweak won't work. To be effective, it *must* be administered as "enhancement" to a healthy child.
  *   **The Regulatory Deadlock:** The law requires a present pathology for therapy. The biology requires a future pathology for efficacy. The treatment exists in a gap where it is medically necessary but legally impermissible.

  ### How to Play the Scene

  **The Regulator:** "You are selling a disabled immune system. A normal human lung cleans itself. Yours just lets the filth sit there. That is not restoring function; that is surrendering it."

  **The Doctor:** "A normal human lung in 1950 cleaned itself. A normal human lung in this city kills itself. I am not selling a disabled immune system; I am selling a *compatible* one. You're clinging to a definition of 'Human' that can't survive the world you built."

  **The Patient:** (Coughing up black sputum) "I don't care about species functioning. I care about next year."

  **The Clincher:**
  The regulator admits that if the city lowered air quality standards, the patient's condition would be classified as an "Environmental Injury" (Therapy). But because the city *illegally* maintains high air quality standards on paper (while ignoring enforcement), the patient's reaction is classified as "Individual Sensitivity" (Enhancement).

  The treatment is legal only if the government admits it's failing to protect the air. The clinic treats the patients, but to do so, they must implicitly admit the government's failure, which makes the clinic a political target. The "Therapy" label is not a medical diagnosis; it's a political confession.
