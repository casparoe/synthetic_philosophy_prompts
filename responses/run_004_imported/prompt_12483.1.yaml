      *   *Camera taking a picture of itself:* Screen within screen within screen.
      *   *Predicting a Predictor:* If I predict you, and you predict my prediction, do we converge?
      *   *Computational Complexity:* If $E$ simulates $A$, and $A$ simulates $E$, who runs first?
      *   *The "Surprise" Argument:* If the agent knows exactly what it will do, can it choose to do otherwise? (Free will/counterfactuals).

  4.  **Selecting the Best Intuitive Angle:**
      *   The "Map" analogy is classic but sometimes feels like a resource issue (map size). I need to emphasize the *logical* contradiction.
      *   The "Self-Prediction/Counterfactual" angle is strong for agency. If I know exactly what I will do, am I still deciding?
      *   The "Diagonalization" angle is the rigorous math reason. I need to translate this into intuition.
