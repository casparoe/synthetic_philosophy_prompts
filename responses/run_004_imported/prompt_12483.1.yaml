      *   *Embedded Agent:* Agent is *inside* $E$. Agent is a program $A$. Environment includes $A$ (i.e., $E$ simulates or contains $A$).
      *   *The Conflict:* If $A$ tries to model $E$ perfectly, and $E$ contains $A$, then $A$ is effectively trying to model itself perfectly as part of the environment.
      *   *The Logical Barrier:* Self-reference, diagonalization, halting problem, Gödelian incompleteness.

  3.  **Brainstorming Analogies/Explanations:**
