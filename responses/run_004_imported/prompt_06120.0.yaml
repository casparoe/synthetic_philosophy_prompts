prompt: |-
  I co-host a pretty tiny philosophy of mind podcast (download numbers in the low hundreds, my mum is a loyal listener), and next month's guest is a logician who's just put out a book defending an updated version of the Lucas-Penrose argument -- the claim that Gödel's incompleteness theorems show human minds can't be equivalent to any fixed Turing machine or formal system, full stop. I've taught this argument in my phil of mind seminar for a decade now and every single year the class splits almost exactly in half between people who find it obviously right and people who think its a parlor trick, so I know theres real material to mine here, but I really don't want the episode to just be her restating the argument for listeners who've already gotten the potted version from a Penrose pop-science book.

  Can you draft me 8 to 10 interview questions that press on where the argument is actually weakest, rather than ones that just invite her to re-explain it? I'd like at least one question on the "which formal system even are you" problem -- you can't generate a Gödel sentence to throw at someone unless you already know what system captures their reasoning, and we have no idea what that system is, or whether there even is one. One on the consistency assumption: the Gödel sentence for a system is basically a consistency claim about that system in disguise, so how does she, or any of us, actually know our own mathematical faculties are consistent rather than just good at not noticing our own contradictions? And one on whether Penrose's move to quantum gravity and microtubules in Shadows of the Mind is doing real argumentative work or just relocating the mystery somewhere neuroscience can't check yet. For each question, throw in a line predicting the answer she'll probably give -- she's sharp, so don't let it be a strawman -- plus a sharper follow-up that keeps her from just resting there. And save the last question or two for something like: okay, concretely, what would a machine actually have to do before she'd give up the argument?
