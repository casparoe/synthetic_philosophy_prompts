answer: |-
  This is an extraordinarily sharp observation. You have put your finger on the central tension in the philosophy of precommitment, one that bridges bioethics, political theory, and metaphysics. You are correct that Jon Elster is the key figure here (specifically his work *Ulysses and the Sirens* and *Solomonic Judgments*), but you are also right to sense that the literature often sidesteps the epistemic problem you've identified: **How do we know, in the moment, whether the Sirens are singing?**

  Your sister's unease is philosophically warranted. The distinction between a "corrupted self" and a "revised self" is not self-evident in the moment of crisis. However, philosophers and legal theorists have attempted to draw this line using a few specific frameworks. Whether these frameworks resolve the problem or merely manage it is the crux of your question.

  Here is how the distinction is typically attempted, where it succeeds, and where it risks being question-begging.

  ### 1. The "Two-Selves" Model and Higher-Order Volitions
  The primary philosophical justification for the Ulysses contract relies on a divided model of the self. Drawing on Harry Frankfurt's concept of "higher-order volitions," the argument is that we have first-order desires (e.g., "I want to jump off this bridge" or "I want to stop taking this medication") and second-order desires about those desires (e.g., "I want to *not* want to jump off this bridge").

  In the Ulysses framework, the "authentic" self is the one capable of forming higher-order volitions during a period of calm. The "corrupted" self is the one driven by first-order impulses that contradict those higher-order values.
  *   **In Psychiatry:** The manic self is viewed as hijacked by pathology. The precommitment is an act of autonomy by the "well self" to preserve the life and future autonomy of the "ill self."
  *   **In Constitutionalism:** The founding generation (or the supermajority) represents "cool and deliberate" judgment, while the future simple majority represents "passion" or "faction."

  **The Problem:** As you noted, this is only useful if we can identify which self is which. If the future self says, "I have changed my mind," how do we know they aren't just under the influence of the Sirens?

  ### 2. The Epistemic Criterion: Capacity vs. Preference
  In the medical context, there is a principled (though imperfect) mechanism that does not exist in the political one: **Decision-Making Capacity.**

  Philosophers of bioethics (like Paul Appelbaum) distinguish between *competence* (a legal status) and *capacity* (a clinical assessment). A Ulysses clause in a psychiatric advance directive is generally ethically defensible only if the future self is judged to lack capacity due to the illness.
  *   **The Distinction:** If your sister is in a crisis and refuses medication because she believes she is the Queen of England, that is a failure of reality testing (capacity). If she refuses medication because she has weighed the side effects against the benefits and decided the trade-off isn't worth it, that is a legitimate change of mind.
  *   **The Friction Point:** You mentioned the psychiatrist described a version where she could be treated *even if* she retains some capacity. This is the ethical danger zone. In many jurisdictions, a contemporaneous refusal by a patient with capacity *overrides* an advance directive. The "strong" Ulysses contract attempts to bypass this by defining the *condition* of mania itself as the trigger, regardless of contemporaneous protest.

  **Is this question-begging?** It risks it. It assumes the diagnosis (mania) proves the corruption of judgment. But mania can also bring creative insight or legitimate shifts in values. If the definition of "symptom" swallows all dissent, the contract becomes tyrannical.

  ### 3. Elster's Procedural Solution
  Jon Elster is actually quite wary of substantive precommitment (binding oneself to a specific *outcome*). He prefers **procedural precommitment**.

  Elster argues that we cannot perfectly distinguish between passion and reason in the moment. Therefore, we shouldn't try to ban specific actions. Instead, we should raise the *cost* of changing course.
  *   **Constitutional Analogy:** We don't ban future generations from changing the Constitution; we require a supermajority. This filters out fleeting passions without making change impossible.
  *   **Psychiatric Analogy:** A robust PAD shouldn't necessarily say "Medicate me no matter what." It might say, "If I object, require a second independent psychiatric opinion and a 48-hour waiting period before overriding me."

  This addresses your worry by acknowledging that the future self *might* be right. It doesn't silence the future self; it just forces the future self to shout louder (or wait longer) to be heard. This respects the Jeffersonian view (the living should rule) while accommodating the Madisonian need for stability (prevent rash decisions).

  ### 4. The Jefferson-Madison Tension and "The Dead Hand"
  You referenced the Jefferson-Madison exchange. Jefferson argued that "the earth belongs to the living," implying that no generation can bind the next. Madison countered that without stability, there is no liberty.

  In the context of your sister's PAD, this is the tension between her **past autonomy** (the right to set the terms of her life) and her **present autonomy** (the right to refuse touch/treatment *now*).
  *   **The Philosophical Wager:** The Ulysses contract is a wager that the *past* self had better access to the truth of the *whole* life than the *present* self has access to the truth of the *moment*.
  *   **The Risk:** The risk is what constitutional theorists call the "dead hand problem." The past self treats the future self as a child.

  Philosophers like Rebecca Dresser have critiqued psychiatric advance directives on exactly the grounds you raise: the "then self" and the "now self" may have different critical interests. If the manic self is actually happy (a controversial claim, but possible), does the "sane" self have the right to extinguish that happiness based on a prior preference?

  ### 5. Is there a Principled Resolution?
  To answer your direct question: **No, there is no algorithmic way to distinguish the corrupted self from the revised self in the moment.** Any system requires a third-party arbiter (a psychiatrist, a judge, a constitutional court), and that arbiter brings their own biases.

  However, there is a **procedural consensus** on how to mitigate the question-begging nature of the contract:

  1.  **Sunset Clauses:** Precommitments should expire. In politics, constitutions require re-ratification or amendment. In psychiatry, PADs should be reviewed regularly. If your sister renews the directive every year while well, it strengthens the claim that this is her enduring will, not a past whim.
  2.  **Proxy Discretion:** Instead of a rigid instruction ("Give me Drug X"), the directive can appoint a proxy ("My brother knows my values; let him decide if the Sirens are singing"). This moves the judgment from a static document to a dynamic relationship.
  3.  **Asymmetry:** It should be easier to *revoke* the contract during a period of wellness than to *invoke* it during a crisis.
  4.  **Narrow Triggers:** The contract should specify objective triggers (e.g., "If I have not slept in 4 days and am spending 5x my income") rather than subjective ones ("If I seem manic").

  ### Conclusion: Wariness is Appropriate
  You asked if this distinction is ultimately question-begging in a way that should make you warier. **Yes.**

  The Ulysses contract is not a solution to the problem of self-knowledge; it is a gamble. It is a gamble that the "Siren song" is identifiable and that the cost of being wrong (being treated against your will when you were actually right) is lower than the cost of the alternative (destroying your life during a crisis).

  In the constitutional case, we accept this gamble because the alternative is instability. In the psychiatric case, the stakes are bodily integrity and liberty. Your sister's unease is the correct philosophical response. She is recognizing that the "Ulysses" move privileges the *narrative* self (the one who tells the story of her life over time) over the *experiential* self (the one living in the moment).

  **Recommendation for your sister:**
  She should not view the "strongest version" the psychiatrist mentioned as the *only* version. The most philosophically robust Ulysses contract is one that acknowledges its own fallibility. It should include:
  *   A trusted proxy who knows her values, not just her symptoms.
  *   A requirement for independent review before overriding her contemporaneous objection.
  *   A clear expiration date or review schedule.

  The goal isn't to solve the philosophical puzzle of identity; it's to create a safety net that respects her agency as much as possible, even when she is trying to cut the net. The fact that she is questioning the binding nature of her past self suggests she is thinking about this with the exact "cool reflection" that makes a Ulysses contract legitimate in the first place.

  ***

  *Disclaimer: I am an AI, not a lawyer or a psychiatrist. Psychiatric Advance Directives and Ulysses Clauses vary significantly by jurisdiction (state/country). Some jurisdictions do not legally allow a PAD to override a contemporaneous objection by a patient who currently has capacity. Your sister should discuss the specific legal enforceability of these clauses with her care team and potentially a legal advocate.*
