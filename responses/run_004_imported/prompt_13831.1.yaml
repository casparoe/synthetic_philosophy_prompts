  **MEMORANDUM**

  **TO:** Ethics and Compliance Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Determination Regarding Plant Maintenance Budget Decision

  **FINDING**
  The Committee finds that the Plant Director violated Section 4.1 of the Code of Conduct, which prohibits "intentionally jeopardizing employee safety."

  **REASONING**
  The Committee reached this determination based on the following interpretation of the Code, designed to address the divergent views regarding intent and outcome:

  **1. Distinction Between "Jeopardizing" and "Harming"**
  The Code prohibits intentionally *jeopardizing* safety, not intentionally *injuring* employees. We accept the Director's assertion that employee injury was not her *aim* or motive. However, "jeopardizing" refers to the creation of risk, not the realization of harm. The evidence confirms the Director intended to cut maintenance and knew with substantial certainty that this action would create safety risks. Therefore, the *jeopardy* was intentional, even if the specific *injuries* were not.

  **2. Knowledge as Intent in Compliance Contexts**
  While philosophical definitions of "intent" often require desire or purpose, compliance standards treat the *conscious acceptance of a foreseeable, prohibited risk* as intentional conduct. To rule otherwise would create a loophole where leaders could evade accountability by framing safety trade-offs as "unwanted side effects" rather than deliberate cost-saving choices.

  **3. Addressing Outcome Asymmetry**
  The Committee acknowledges the concern that language regarding "intent" often shifts based on whether outcomes are good or bad (e.g., we might not call an accidental safety improvement "intentional"). We agree this linguistic asymmetry exists. However, the Code is designed to be asymmetric by principle: it imposes a strict duty to avoid creating risk, without granting equivalent credit for accidental risk reduction. The standard for "jeopardy" is met by the deliberate choice to lower safety margins, regardless of whether the resulting injuries were the primary goal.

  **CONCLUSION**
  The Director's decision prioritized financial targets over known safety risks. This constitutes an intentional act of jeopardizing safety under the Code. Remedial actions and disciplinary recommendations follow in the attached addendum.
