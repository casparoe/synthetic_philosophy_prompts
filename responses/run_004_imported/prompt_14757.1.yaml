answer: |-
  Your friend's argument relies on a concept called **procedural justice**: the idea that if the *process* of agreement was voluntary and transparent (you signed the offer letter), the *outcome* is inherently fair.

  But in organizational economics and moral philosophy, there is a distinct concept called **substantive justice** (or distributive justice), which asks whether the *outcome* itself is equitable relative to the contribution. There is also the concept of the **psychological contract**, which is the unwritten set of expectations between employee and employer that exists alongside the legal one.

  You are describing a very specific, well-documented phenomenon that goes beyond "that's capitalism." You are experiencing the friction between **craft** and **scientific management**, compounded by a breach of the psychological contract.

  Here is the vocabulary and the framework to articulate why your situation feels unfair, even if the contract is sound.

  ### 1. Digital Taylorism vs. Knowledge Work
  In the early 20th century, Frederick Taylor introduced "scientific management." The goal was to break complex labor down into tiny, repeatable, measurable motions to maximize efficiency. This worked for assembly lines. It is notoriously destructive for knowledge work.

  The tool your company is using to auto-assign tickets based on "capacity" is **Digital Taylorism**. It treats engineering hours as a commodity input rather than a creative process.
  *   **The Fairness Argument:** When you were hired, you were likely sold on the premise of being an *engineer* (a problem solver/architect). You are now being managed as a *resource* (a unit of capacity).
  *   **The Mismatch:** Taylorism assumes the manager knows best how to break down the work. In software, especially around a core recommendation engine, the person writing the code often understands the constraints and opportunities better than the algorithm assigning the tickets. By removing your agency over *what* you work on, the company is artificially capping your leverage. You are being paid for your hands, but the value you created (and could continue to create) lies in your head.

  ### 2. Alienation from the Product
  Karl Marx's concept of **alienation** is often dismissed as ideological, but in a practical management context, it describes a measurable drop in engagement. It happens when a worker is separated from:
  1.  **The Product:** You don't see features through.
  2.  **The Process:** An algorithm dictates your workflow.
  3.  **Other Workers:** You don't know what your peers are doing.

  **The Fairness Argument:** In a Series B startup, the "equity" portion of your compensation is theoretically payment for risk *and* alignment. You are supposed to act like an owner. However, the management structure is actively preventing you from thinking like an owner.
  *   **The Contradiction:** They want you to have the risk of an owner (vesting, startup volatility) but the autonomy of a contractor. If you cannot see the whole product, you cannot optimize for the company's success, only for your ticket's completion. This creates a **Principal-Agent Problem**: your incentives (close tickets, stay indifferent) are no longer aligned with the company's incentives (build a cohesive, valuable product).

  ### 3. Specific Human Capital and the "Hold-Up" Problem
  In economics, **specific human capital** refers to skills or knowledge that are valuable only within a specific firm. You built the recommendation engine. That knowledge is highly specific to this company.
  *   **The Situation:** Two years ago, your leverage was high because you were building the core. Now that it's built, the company is trying to commoditize your maintenance of it to reduce "key person risk."
  *   **The Fairness Argument:** This is a subtle form of the **Hold-Up Problem**. The company captured the value of your specific knowledge (the valuation jump), and now they are changing the terms of engagement to ensure they don't *need* that specific knowledge anymore.
  *   **Why it feels unfair:** You are being penalized for success. Because the system works, they treat the work as routine. But maintaining a core recommendation engine is rarely routine; it requires deep context. By slicing the work thinly, they are increasing the risk of technical debt or regression, which harms the very asset you built.

  ### 4. The Breach of the Psychological Contract
  The legal contract covers salary, hours, and IP. The **psychological contract** covers expectations of growth, impact, and recognition.
  *   **The Breach:** Most senior engineers accept market-rate salaries at startups (below big-tech cash comp) in exchange for **ownership and impact**.
  *   **The Reality:** You have the salary, but the ownership and impact have been algorithmically removed.
  *   **The Argument:** Your friend says the deal was fair when you signed it. But a contract is not a static snapshot; it's a dynamic relationship. If the nature of the work changes fundamentally (from architecting core systems to filling ticket capacity) without a renegotiation of role or reward, the original agreement is effectively voided by the employer, even if the legal paperwork remains.

  ### 5. Scaling vs. Fragmentation
  Your friend might argue this is just "scaling." It is true that specialization increases with headcount. However, there is a difference between **specialization** (you own search, I own payments) and **fragmentation** (you own the API endpoint for the search button, I own the database query).
  *   **Scaling:** Requires better communication and clearer boundaries.
  *   **Fragmentation:** Removes context.
  *   **The Risk:** At 90 people, you are at a critical inflection point. This is where companies often lose their "soul." If the engineers who understand the core logic are disconnected from the product decisions, the product usually stagnates or becomes brittle. Your indifference is a rational response to a system that no longer rewards deep understanding.

  ### How to use this perspective
  You don't need to quote Marx or Taylor to your CTO. But you can frame this in terms of **risk** and **efficiency**, which leadership understands.

  Instead of saying "I feel alienated," try:
  > "The current ticket assignment model optimizes for short-term throughput, but it introduces significant long-term risk to the recommendation engine. Because work is fragmented, no one retains full context on the core logic. This increases the likelihood of regression and technical debt. I built this system to be robust, but the current workflow prevents the deep ownership required to maintain that robustness. We are treating a core R&D asset like a maintenance backlog."

  ### Summary
  Is it unfair? **Yes, in a substantive sense.**
  It is unfair because the company is capturing the upside of your *specific* value (the engine) while paying you for *generic* labor (ticket completion), and they have altered the working conditions to reduce your leverage without adjusting the compensation or title to reflect the loss of agency.

  Your friend is right that you *can* leave (procedural freedom). But he is wrong that the situation is *fair* (substantive equity). You are experiencing the friction of a company transitioning from a "product-led" culture to a "process-led" culture, and currently, the process is eating the product.

  You aren't just describing the trade-offs of scaling; you are describing a management strategy that prioritizes replaceability over resilience. That is a choice they are making, not a law of nature.
