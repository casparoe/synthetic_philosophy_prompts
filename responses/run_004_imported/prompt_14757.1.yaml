      *   *Introduce Frameworks:*
          1.  **Marxian Alienation (Modernized):** Separation from the product, the process, and fellow workers. This explains the *indifference*.
          2.  **Taylorism/Scientific Management:** The ticket assignment tool is digital Taylorism. It optimizes for replaceability, not contribution.
          3.  **Hold-Up Problem/Specific Human Capital:** The user built something specific and valuable. Now the company is treating that capital as generic. There's a mismatch between value created and reward/role structure.
          4.  **Psychological Contract:** Beyond the legal contract, there's an unwritten set of expectations (ownership, growth, impact). This has been breached.
      *   *Address the "Scaling Trade-off" counter-argument:* Yes, specialization happens, but *fragmentation* without context is a design choice, not a law of physics.
      *   *Conclusion:* It's not just "capitalism." It's a specific management failure regarding talent retention and incentive alignment.

