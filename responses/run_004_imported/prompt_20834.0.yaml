answer: |-
  The silence of the void was the only thing louder than the alarm blinking on Commander Kael's console. Oxygen: 4%. Power: Critical. The *Aethelgard* was a coffin drifting in the Oort cloud, and the thing floating outside his airlock was the only key.

  It called itself the Curator. It looked like a shard of obsidian glass, hovering without propulsion. It had already patched itself into Kael's comms, bypassing encryption like it was tissue paper.

  "I can jump your drive," the Curator's voice resonated, not in the air, but directly in Kael's auditory cortex. "I can push you to the Neptune relay. You will live."

  Kael's hand hovered over the airlock release. "And the price?"

  "Upon arrival at the relay, you must purge your navigation logs. You must delete the coordinates of my location. Forever."

  Kael frowned. That was it? "Just delete the logs?"

  "And you must scuttle the *Aethelgard's* long-range sensors. You will return to Earth blind. You will never be able to lead a fleet back here."

  Kael froze. That wasn't just a price; it was career suicide. His mission was First Contact. Finding the Curator was the holy grail. If he returned with the coordinates, he was a hero. If he returned blind and destroyed his own sensors, he was a failure. A lunatic.

  "Once I'm at the relay," Kael said, his voice steady despite the cold sweat on his neck, "I'll be safe. Earth Command will hail me. They'll ask for the coordinates. If I tell them I deleted them... they'll court-martial me. They'll strip-mine my brain for the data."

  "I know," the Curator said. "That is why I am asking."

  "I can promise you," Kael said. "I give you my word as an officer."

  "Words are vibrations," the Curator replied. "I do not hear vibrations. I hear *trajectory*."

  The obsidian shard pulsed. A wave of pressure washed over Kael, not physical, but mental. It felt like being X-rayed by a conscience.

  "I can see your future self, Human. I can simulate your decision tree. Right now, you are calculating. You are thinking: *'I will promise to delete the logs to survive. Once I am safe at the relay, the threat is gone. It is irrational to destroy the data then. I will lie.'*"

  Kael's heart hammered. It was true. That was exactly the plan. From a purely logical standpoint, it was the only move. Survive now, renege later. The future benefit of the data outweighed the cost of a broken promise to an alien entity light-years away.

  "If I detect that calculation," the Curator continued, "I will not open the airlock. You will die here. Your oxygen will run out. Your trajectory ends in ice."

  "So I have to mean it," Kael said.

  "No. Meaning is fleeting. You must *be* it."

  The pressure intensified. Kael gasped. The Curator wasn't looking for a promise; it was looking for a constraint. It needed to know that Future-Kael, the one safe and warm at the relay, would still press the delete button even when it made no sense. Even when it hurt.

  But Future-Kael would be rational. Future-Kael would want to save his career. Future-Kael would look back at this moment and call this decision stupid.

  *How do I bind a man who hasn't made the mistake yet?* Kael thought.

  He realized the trap. The Curator wasn't negotiating with the desperate man in the dying ship. It was negotiating with the hero waiting at the finish line. And the hero had no reason to pay the bill.

  To survive, Kael had to sabotage his own future rationality. He had to make a vow that would feel like a knife in the gut when the danger passed. He had to value the *integrity of the transaction* more than the *value of the prize*.

  It was madness. It was choosing to be the kind of fool who pays a debt even when the creditor can't collect.

  Kael closed his eyes. He stopped thinking about Earth Command. He stopped thinking about the medal he'd never get. He focused on the cold truth of the void. If he lied now, he died now. The only way to win was to make the lie impossible.

  He had to burn the bridge before he crossed it.

  "I am not promising," Kael whispered. He opened his eyes and stared at the black shard. "I am telling you what I am. I am a man who keeps faith, even when it costs him everything. Even when it makes him a fool. Even when I am safe and you are gone."

  He felt the shift in his own chest. It was a terrifying sensation, like voluntarily amputating a limb he knew he'd need later. He was lowering the value of his own success in his mind, right now, elevating the vow above the mission. He was rewiring his own survival instinct to prioritize consistency over advantage.

  "I will delete the logs," Kael said, and he felt the truth of it settle like lead in his stomach. "I will break my sensors. I will return home empty-handed. And I will do it *because* I said I would. Not because it helps me. But because I am the one who said it."

  The pressure vanished.

  The obsidian shard flared with a brilliant, cold light.

  "Trajectory aligned," the Curator said. "Dissonance cleared. You have chosen to be bound."

  The *Aethelgard* shuddered as the external drive engaged. The stars stretched into lines. The cold began to recede as the heating systems kicked back on.

  Kael sat back in his chair, his hands shaking. He knew, with absolute certainty, that in three days when he arrived at the relay, he would sit in a warm room with a full tank of oxygen. He would look at the console. He would know that deleting the coordinates was the stupidest thing he could possibly do. He would know that no one would ever know if he kept them. He would feel the weight of his career, his life, his legacy pressing down on that delete key.

  And he would press it.

  Because the man who died in the Oort cloud was a liar, and the man who survived was a fool. And Kael had just decided, with shivering clarity, that he would rather be the fool.

  "Jump complete," the computer chimed.

  Kael watched the starlines snap back into points of light. He was safe. The danger was over. The rational choice was now to keep the data.

  He placed his hand on the purge command. It felt heavy. It felt insane.

  "Thank you," he whispered to the empty void.

  He pressed the button.
