      *   *Scene 4: The Detection.* The Archivist probes her. It sees the calculation. It sees the future betrayal.
      *   *Scene 5: The Shift.* Elara realizes she can't promise. She has to *become*. She has to devalue the Seed in her own mind right now. She has to make a vow that overrides future logic.
      *   *Scene 6: Resolution.* The Archivist accepts. She survives. The lingering doubt: Did she actually change, or just trick herself? (Better to imply she truly changed).

  5.  **Refining the "Rational Irrationality":**
      *   The key is that future-Elara will look at present-Elara's decision and think, "Why did I do that?"
