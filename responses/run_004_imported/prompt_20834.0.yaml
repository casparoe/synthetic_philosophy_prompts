      *   Let's make the cost personal. Not just "return the data," but "sacrifice the advantage."
      *   *Revised Cost:* The Archivist gives her a coordinate to safety. In exchange, she must destroy her own ship's FTL drive upon arrival so she can never bring a fleet back to the Archivist's location.
      *   *Why it's hard:* Her mission is to find the aliens. Bringing a fleet is her career/life's purpose. Destroying the drive ruins her career.
      *   *Why she must do it:* The Archivist knows if she plans to keep the drive.

  6.  **Writing - Focusing on Sensory Details and Internal Monologue:**
