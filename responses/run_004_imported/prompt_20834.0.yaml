      *   *Idea 3: Space Opera.* A stranded pilot needs a tow. The towing ship needs fuel reimbursement later. The towing ship has a truth sensor. (Too close to the original).
      *   *Idea 4: Fantasy/Magical.* A wizard saves a knight from a curse. The knight must vow to give up their sword later. The wizard can see the soul's weight.
