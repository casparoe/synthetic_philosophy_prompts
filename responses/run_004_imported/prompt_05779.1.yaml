          *   *Follow-up:* Press on who defines the "fully informed" baseline.

      *   *Question 2 (Estlund's Objection):* David Estlund argues that any standard for competence will be reasonably rejectable by those deemed incompetent, making it illegitimate.
          *   *Likely Deflection:* The philosopher might argue that we accept competence standards in other high-stakes areas (medicine, aviation), so why not politics?
          *   *Follow-up:* Point out the difference between technical expertise and normative authority over one's own life.

      *   *Question 3 (Partisan Confidence):* The concern is that testing political knowledge rewards those who consume partisan media confidently, not necessarily truth-seekers.
