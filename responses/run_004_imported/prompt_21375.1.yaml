          *   *Dodge:* "We have priors for survival."
          *   *Follow-up:* "Where do those priors come from if not the principle itself?"

      *   *Question 3: Universality/Triviality (Required).*
          *   *Draft:* Does covering thermostats and brains make it useless?
          *   *Refinement:* Focus on explanatory power. If the *same* equation explains a rock (maybe not a rock, but a thermostat) and a poet, what specific neural mechanism does it predict?
          *   *Dodge:* "It's a universal law like gravity."
          *   *Follow-up:* "Gravity predicts trajectories. What specific neural trajectory does FEP predict that other models don't?"

      *   *Question 4: The "Process Model" Retreat.*
          *   *Focus:* He says "ask about process models." So, ask about the link between the principle and the mechanism.
          *   *Dodge:* "We are working on specific models."
          *   *Follow-up:* "If the principle doesn't constrain the mechanism, why is the principle necessary?"

      *   *Question 5: Evolution vs. Inference.*
          *   *Focus:* FEP sounds like evolution by another name.
          *   *Dodge:* "It's complementary."
          *   *Follow-up:* "Is it adding new predictive power or just restating natural selection in Bayesian terms?"

      *   *Question 6: The "Internal Model" Claim.*
          *   *Focus:* Does the brain actually *have* a generative model?
          *   *Dodge:* "It acts *as if* it does."
          *   *Follow-up:* "Instrumentalism vs. Realism. Do you believe the neurons encode probability distributions?"

      *   *Question 7: Complexity/Computational Tractability.*
          *   *Focus:* Calculating free energy is hard. How does a cell do it?
          *   *Dodge:* "It's an approximation."
          *   *Follow-up:* "At what point does the cost of the approximation outweigh the benefit?"

      *   *Question 8: The Progress Metric.*
          *   *Focus:* What has FEP actually *discovered* that wasn't known before?
          *   *Dodge:* "It unifies fields."
          *   *Follow-up:* "Unification is nice, but name a specific empirical discovery."

  4.  **Refining and Polishing (Applying the "Sharp Follow-up" constraint):**
      *   Make sure the "Dodge" matches the persona described (slightly evasive, intellectualizing).
      *   Make sure the "Follow-up" cuts off the escape route.
      *   Ensure the tone is journalistic/professional, not hostile, but firm.

