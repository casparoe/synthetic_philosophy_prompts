  1.  **Analyze the Request:**
      *   **Subject:** A theoretical neuroscientist promoting the Free Energy Principle (FEP).
      *   **Core Claim:** Self-organizing systems minimize "surprise" (variational free energy) relative to an internal model.
      *   **The Problem:** The subject uses a specific defense against falsification: "FEP is a mathematical principle, not an empirical hypothesis. Ask about specific process models instead." (The "Category Error" defense).
      *   **Goal:** 7-8 hard-hitting questions that prevent this retreat.
      *   **Specific Requirements:**
          *   One question on the "Dark Room Problem" (why don't organisms just hide in unchanging environments?).
          *   One question on "Universality vs. Explanatory Power" (if it covers everything, does it explain anything?).
          *   One question demanding a *real* falsification condition (not a strawman).
          *   For each question: Flag the likely dodge and provide a sharp follow-up.
      *   **Tone:** Professional but incisive, suitable for a profile/interview context.

  2.  **Deconstruct the Free Energy Principle (FEP) & Common Criticisms:**
      *   *What is it?* A variational bound on surprise. Systems act to keep their sensory states within expected limits.
      *   *The "Math vs. Science" Dodge:* Proponents argue FEP is like the principle of least action in physics—a framework, not a specific model. Critics argue it's unfalsifiable metaphysics masquerading as science.
      *   *The Dark Room Problem:* If the goal is to minimize surprise (uncertainty), why don't organisms seek out dark, silent rooms where sensory input is constant and predictable? *Answer usually involves "prior preferences" for homeostatic states.*
      *   *The Universality Critique:* If a thermostat and a human brain follow the same math, is the math too abstract to be useful for neuroscience specifically?
      *   *Falsification:* What observation would prove FEP wrong? If the answer is "nothing, it's math," it's not science.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Falsification Commitment (Required).*
          *   *Draft:* What would prove you wrong?
          *   *Refinement:* Need to block the "it's math" dodge immediately.
          *   *Dodge:* "It's a tautology/math principle."
          *   *Follow-up:* "If it's just math, why apply it to biology?"

      *   *Question 2: The Dark Room Problem (Required).*
