answer: |-
  Here are eight questions designed to pin down the Free Energy Principle (FEP) without allowing the "category error" retreat. Each includes the likely deflection and a follow-up to close the escape route.

  ### 1. The Falsification Commitment
  **Question:** You often state that asking for the falsification of the Free Energy Principle is a category error because it's a mathematical theorem, not a scientific hypothesis. But you also claim it explains biological self-organization. If the math *necessarily* applies to any system that persists, what specific empirical observation in a living organism would force you to abandon the Free Energy Principle as a *biological* framework?
  *   **Likely Dodge:** "You're confusing the principle with the models. The principle is like the principle of least action; you falsify the specific model, not the math."
  *   **Sharp Follow-up:** "In physics, least action predicts specific trajectories. If I show you a biological system that persists *without* minimizing variational free energy—or minimizes it while dying—does the theory survive? If yes, the theory describes nothing. If no, please define the measurement."

  ### 2. The Dark Room Problem
  **Question:** If the brain's primary imperative is to minimize surprise (or prediction error), the optimal strategy for an organism should be to seek out a dark, silent room where sensory input is constant and perfectly predictable. Why aren't we all curled up in boxes?
  *   **Likely Dodge:** "Because we have 'prior preferences' for homeostatic states that require active sampling of the environment. We expect to be fed and warm, which requires movement."
  *   **Sharp Follow-up:** "Where do those priors come from? If the Free Energy Principle generates the drive to minimize surprise, but you need to import a separate theory of evolution to explain why we don't just starve in the dark, isn't FEP just a redundant description of the drive those evolutionary priors already explain?"

  ### 3. The Universality Trap
  **Question:** You argue the same mathematics governs a thermostat, a bacterium, and a human cortex. Critics say that if a theory explains everything from heating systems to consciousness, it explains nothing in particular. What specific feature of *human* neural processing does FEP predict that a simpler cybernetic model does not?
  *   **Likely Dodge:** "It provides a universal language to unify these fields. The underlying logic is the same, even if the implementation differs."
  *   **Sharp Follow-up:** "Unification is philosophical, not scientific. Gravity unifies falling apples and orbits, but it gives me specific numbers. Give me a specific neural computation—like gain control or synaptic plasticity—that FEP uniquely quantifies better than existing Hebbian or error-correction models."

  ### 4. The Mechanism Gap
  **Question:** You advise critics to look at "process models" for empirical claims. But the Free Energy Principle is sold as the foundational law constraining those models. If the principle allows for infinite variations of process models, how does it constrain neuroscience research at all?
  *   **Likely Dodge:** "It constrains the space of viable models. Any model that violates the principle is biologically implausible."
  *   **Sharp Follow-up:** "Have you ever rejected a published neuroscience model because it violated Free Energy? If not, the constraint is theoretical, not practical. If the principle doesn't rule out any current competing theories, it isn't doing any work."

  ### 5. Evolution vs. Inference
  **Question:** Many critics argue that FEP is simply natural selection described in Bayesian clothing. Organisms survive because they are adapted to their niche, which looks like 'minimizing surprise.' Is FEP actually a mechanism, or just a post-hoc mathematical restatement of fitness?
  *   **Likely Dodge:** "It's complementary. Evolution selects the structures, FEP describes how they function in real-time."
  *   **Sharp Follow-up:** "If FEP only describes the function *after* evolution has selected it, then FEP cannot predict which structures will evolve. If it can't predict the structure, and evolution explains the survival, what causal power is left for Free Energy?"

  ### 6. The "As If" Reality
  **Question:** Do you believe neurons literally encode probability distributions and perform Bayesian inference, or do organisms just behave *as if* they do? This distinction matters for whether FEP is a theory of brain implementation or just behavior.
  *   **Likely Dodge:** "We take an instrumentalist view. It doesn't matter how they do it, only that the math describes the outcome."
  *   **Sharp Follow-up:** "If it's just instrumentalist, then FEP isn't a theory of the brain; it's a curve-fitting exercise. If you claim it's a theory of *neuroscience*, you must commit to a physical substrate. Do neurons represent uncertainty, or is that just a metaphor you're using?"

  ### 7. The Track Record of Discovery
  **Question:** Beyond unifying existing concepts, what is one specific, novel empirical finding that was discovered *because* of the Free Energy Principle, which would not have been found using standard computational neuroscience methods?
  *   **Likely Dodge:** "We are still in the early stages. The framework is guiding current experiments in psychiatry and imaging."
  *   **Sharp Follow-up:** "The principle has been prominent for over 15 years. In physics, a new law yields new particles or forces. In FEP, where is the 'new particle'? Name one specific neural pathway or dynamic that FEP revealed that was previously unknown."

  ### 8. Computational Tractability
  **Question:** Calculating exact variational free energy is computationally intractable for complex systems. You argue brains use approximations. But at what point does the metabolic cost of running the approximation outweigh the benefit of minimizing surprise?
  *   **Likely Dodge:** "The brain uses efficient approximations, like predictive coding, which are metabolically feasible."
  *   **Sharp Follow-up:** "That's an assumption, not a derivation. If the principle requires a system to minimize energy, but the math required to calculate that minimization costs more energy than it saves, the theory contradicts itself. Does FEP predict its own metabolic limit, or do we need to import thermodynamics to make it work?"
