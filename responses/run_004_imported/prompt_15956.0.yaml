answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, Institute for Interdisciplinary Perception & Cognition
  **FROM:** Small Grants Committee
  **DATE:** October 27, 2023
  **SUBJECT:** Decision on Proposal #24-09: "Actuarial Analysis of Crisis Apparitions in Pre-Registered Cohorts"

  **DECISION:** **Fund with Conditions**

  **1. Proposal Summary**
  Proposal #24-09 seeks to replicate and modernize Henry Sidgwick's *Census of Hallucinations* (1894). The principal investigators (PIs) propose a large-scale, pre-registered survey to collect self-reports of "crisis apparitions" (sensory experiences coinciding with a specific distant event, typically a death). Unlike Sidgwick's original methodology, which relied on retrospective volunteer submissions, this design links survey data to administrative death records to establish an objective actuarial baseline. The stated goal is to quantify the deviation between reported coincidence and statistical chance, thereby addressing the selection bias that historically undermined the Society for Psychical Research's empirical claims.

  **2. Committee Deliberation**
  The committee vote was evenly split (2-2), reflecting a fundamental divergence on the epistemic status of the subject matter.

  *   **The Case for Decline:** Two members argued that no statistical correction can rescue a design rooted in volunteered hallucination reports. Their position holds that the core data source remains subjective and unfalsifiable; linking a subjective experience to an objective death record does not prove a causal or paranormal link, only a temporal correlation. They argued that funding this work risks legitimizing credulity under the guise of methodological rigor, and that the "selection bias" is not merely a statistical error but an inherent feature of the phenomenon's reporting.
  *   **The Case for Support:** Two members argued that rejecting the proposal on these grounds repeats the historical error of dismissing Sidgwick's project without engaging its refined methodology. They contended that the use of pre-registration and administrative records constitutes a genuine methodological advance that closes the specific loopholes Sidgwick himself acknowledged. To reject the proposal without testing this improved design would be to decide the question *a priori*, contradicting the Institute's mandate to fund unconventional empirical work on the boundaries of perception.

  **3. Rationale**
  The Committee has elected to **Fund with Conditions**. We recognize that the "Case for Decline" represents the strongest version of the skeptical position: that the phenomenon may be category-error rather than data-error. If the experience of a crisis apparition is fundamentally a psychological construction rather than a perceptual event, no amount of actuarial matching will yield meaningful data.

  However, the Institute's mission requires us to distinguish between *pseudoscience* and *high-risk inquiry*. Sidgwick's original work was not born of naive credulity, but of a rigorous philosophical struggle to reconcile empirical evidence with the "dualism of practical reason." While we do not endorse the metaphysical conclusions Sidgwick hoped to support, we acknowledge that the *methodological question*—whether the rate of coincidental reporting exceeds chance baselines when selection bias is controlled—remains an open empirical problem.

  To fund this proposal without acknowledging the strength of the skeptical argument would be irresponsible. Therefore, funding is contingent upon the following conditions designed to respect the epistemic risks identified by the minority of the committee.

  **4. Funding Conditions**

  *   **A. Interpretative Guardrails:** The grant agreement must specify that the primary outcome measure is the *rate of reported coincidence*, not evidence of survival or paranormal causality. Public dissemination of results must strictly differentiate between statistical anomaly and metaphysical conclusion. The PIs must agree to a review of all press materials by the Institute prior to release to ensure claims do not outstrip the data.
  *   **B. Adversarial Collaboration:** The PIs must appoint a methodological advisor from outside the field of parapsychology (e.g., a statistician or cognitive psychologist specializing in apophenia and pattern recognition) to review the analysis plan. This ensures that the "actuarial baseline" is constructed with input from scholars predisposed to find non-paranormal explanations for the data.
  *   **C. Data Transparency:** All raw data, code, and pre-registration documents must be made publicly available upon collection completion, regardless of the outcome. This allows the broader scientific community to audit the "volunteered" nature of the reports, addressing the concern that the data source itself is the flaw.

  **5. Conclusion**
  We proceed with the understanding that this research tests the limits of human reporting as much as it tests the limits of perception. By funding this proposal, we are not validating Sidgwick's hope that evidence of survival might resolve ethical dualisms. We are validating his methodological insistence that extraordinary claims require not just extraordinary evidence, but extraordinary *rigor* in the collection of that evidence. If the design fails to find a deviation from chance, the result is a valuable contribution to the literature on coincidence and cognition. If it succeeds, the rigorous conditions imposed here will ensure the finding withstands the scrutiny that Sidgwick's original work ultimately could not.

  **Approved Budget:** $45,000 (reduced from requested $60,000 to account for additional oversight costs)
  **Period of Performance:** 18 Months

  **Signed,**

  *Dr. Elena Rostova*
  Chair, Small Grants Committee
