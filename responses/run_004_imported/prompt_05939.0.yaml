answer: |-
  This is a classic debate in decision theory and finance, often framed as **Arithmetic vs. Geometric Expectation** or **Ensemble vs. Time Averages**. Your friend has correctly identified a profound mathematical pitfall in naive Expected Value (EV) maximization, but she has overcorrected by turning a specific optimization solution into a universal moral imperative for rationality.

  Here is a breakdown of where she is right, where she is wrong, and how to reconcile the two positions.

  ---

  ### 1. The Math: Do EV and Geometric Growth Pull Apart?

  **Verdict: Your friend is correct.**

  Maximizing expected wealth (arithmetic mean) and maximizing expected growth (geometric mean) are fundamentally different objectives that diverge sharply in repeated betting scenarios.

  #### The Concrete Example
  Imagine a simple coin flip bet:
  *   **Probability of Win:** 60% ($p = 0.6$)
  *   **Probability of Loss:** 40% ($q = 0.4$)
  *   **Payout:** Even money (Bet \$1, win \$1 profit; or lose \$1).
  *   **Starting Bankroll:** \$100
  *   **Repetition:** You make this bet 1,000 times in a row.

  **Strategy A: The EV Maximizer (Bet Everything)**
  A pure EV maximizer looks at the expected return of a single bet.
  $$EV = (0.6 \times \$1) + (0.4 \times -\$1) = \$0.20 \text{ per dollar bet}.$$
  Since the EV is positive, a linear utility maximizer should bet as much as possible. You bet your entire bankroll every time.

  *   **The Outcome:** If you win the first flip, you have \$200. If you win the second, \$400. But if you lose *any* single flip, you go to \$0 and stay there.
  *   **Probability of Ruin:** The chance of surviving $N$ rounds is $0.6^N$. As $N \to \infty$, this probability approaches **zero**. You will almost surely go broke.
  *   **Expected Wealth:** Despite almost certainly going broke, your *Expected Value* is astronomical. Why? Because there is a tiny, tiny probability ($0.6^{1000}$) that you win 1,000 times in a row, ending up with $\$100 \times 2^{1000}$. This single outlier outcome is so massive that it drags the arithmetic average up to infinity, even though the *typical* outcome is zero.

  **Strategy B: The Kelly Bettor (Bet 20%)**
  The Kelly Criterion calculates the fraction $f$ that maximizes the geometric growth rate. For an even-money bet, $f = p - q$.
  $$f = 0.6 - 0.4 = 0.2 \text{ (20% of bankroll)}.$$

  *   **The Outcome:** You never go fully broke (mathematically), though you can get very close. Your wealth fluctuates, but it follows a compounding trajectory.
  *   **Growth Rate:** Your bankroll grows by a factor of roughly $1.02$ per bet on average (geometrically).
  *   **Long Run:** As $N \to \infty$, your wealth approaches infinity with probability approaching **one**.

  **The Divergence:**
  In this scenario, the EV maximizer has a higher *expected* wealth (due to the astronomical outlier) but a *median* wealth of zero. The Kelly bettor has a lower *expected* wealth but a *median* wealth that is astronomically high. Your friend is right: if you care about what will *actually happen to you* (the time average), EV maximization is suicidal.

  ---

  ### 2. The Philosophy: Is Kelly the *Only* Rational Policy?

  **Verdict: Your friend is overstating the case.**

  While her math is sound, her leap to normative philosophy ("Kelly is the only rational way," "risk tolerance is an excuse") relies on smuggled assumptions about utility, time horizons, and the definition of rationality.

  Here are three substantive reasons why a rational agent might reject Full Kelly without being logically inconsistent.

  #### A. Utility Functions are Subjective
  In standard decision theory (Von Neumann–Morgenstern), rationality is defined as maximizing **Expected Utility**, not Expected Wealth.
  *   **Log Utility:** If your utility function is $U(W) = \ln(W)$, then maximizing Expected Utility is mathematically identical to maximizing Geometric Growth (Kelly).
  *   **Linear Utility:** If your utility function is $U(W) = W$, then maximizing Expected Utility implies betting your entire bankroll on any positive EV bet.

  Your friend is essentially asserting that **Log Utility is the only rational utility function.** This is a philosophical claim, not a mathematical one. While Log Utility has nice properties (it avoids the St. Petersburg paradox and ensures survival), a rational agent with a specific goal (e.g., "I need \$1 million to save my life, and I currently have \$10") might rationally choose a high-risk strategy that maximizes the *probability of hitting that target*, even if it lowers geometric growth.

  #### B. The Time Horizon Problem (Ergodicity)
  Your friend's argument relies on the **Law of Large Numbers**. Kelly is optimal *asymptotically* (as the number of bets $N \to \infty$). This is the core of the "Ergodicity Economics" argument (championed by physicist Ole Peters): in non-ergodic systems (where you can't reset the game), time averages matter more than ensemble averages.

  However, most bettors have **finite horizons**.
  *   If you have only 5 bets left before you need to withdraw your money to buy a house, the asymptotic optimality of Kelly is less relevant.
  *   In short sequences, the variance of the Kelly strategy can be dangerous. A rational agent with a short horizon might prefer a strategy that maximizes the expected value of their terminal wealth, accepting a higher risk of ruin because they won't be around long enough for the "ruin with probability 1" dynamic to manifest.

  #### C. Volatility and Drawdowns
  Full Kelly is notoriously volatile. It maximizes long-term growth, but it does not minimize the pain of the journey.
  *   **Drawdowns:** A Full Kelly bettor should expect to see their bankroll drop by 50% or more at various points.
  *   **Fractional Kelly:** Many professional investors use "Half-Kelly." This reduces volatility by roughly 50% but only reduces long-term growth by roughly 25%.

  If an agent experiences "pain" from drawdowns (perhaps due to margin calls, psychological stress, or the risk of being fired by investors), their utility function effectively penalizes variance. Choosing Half-Kelly isn't "refusing to follow the math"; it is optimizing for a utility function that includes **volatility aversion**. Your friend dismisses this as "risk tolerance," but in economics, risk tolerance is a fundamental parameter of rational choice, not a bug.

  ### Summary: Where the Debate Stands

  **You should concede this point:**
  In a repeated betting scenario with no external income and an infinite horizon, maximizing Arithmetic Expected Value is a trap. It leads to ruin with probability 1. Your friend is right that "EV maximization" is a poor heuristic for repeated investments.

  **You should hold your ground here:**
  Your friend is wrong that Kelly is the *only* rational strategy.
  1.  **Rationality is goal-dependent:** If your goal is survival and long-term compounding, Kelly is king. If your goal is hitting a specific short-term target, or if you have external constraints (margin calls, finite life), other strategies are rational.
  2.  **Utility is subjective:** Asserting Log Utility is the only rational preference is like asserting everyone should have the same taste in food. It simplifies the math, but it doesn't reflect human reality.
  3.  **Model Risk:** Kelly requires precise knowledge of your edge ($p$). If you overestimate your edge even slightly, Full Kelly becomes overbetting, which drastically increases ruin risk. "Risk tolerance" is often a rational buffer against estimation error.

  **The Verdict:**
  Your friend won the **mathematical** argument (EV $\neq$ Growth in repeated play), but she lost the **philosophical** argument (Growth $\neq$ Universal Rationality). A truly rational bettor maximizes their own Expected Utility, which *often* looks like Kelly, but not *always*.

  You can tell her: *"You convinced me that EV maximization is a trap for repeated bets. But Kelly is just the solution for a specific utility function (log wealth) and an infinite horizon. If I have a different utility function or a finite horizon, deviating from Kelly isn't irrational—it's just optimizing for different constraints."*
