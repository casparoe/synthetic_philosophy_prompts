          *   *Correction/Refinement:* The standard Diaconescu proof uses a set of sets $S = \{U, V\}$. AC gives a choice function $f: S \to \bigcup S$. Let $u = f(U)$ and $v = f(V)$.
          *   Since $U, V \subseteq \{0, 1\}$, $u, v \in \{0, 1\}$.
          *   Equality on $\{0, 1\}$ is decidable ($u=v \lor u \neq v$).
