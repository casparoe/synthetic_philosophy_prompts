          *   If $u \neq v$: Then $U$ and $V$ must be distinct. If $P$ were true, $U=V=\{0, 1\}$. So $P$ must be false.
          *   Therefore $P \lor \neg P$.
      *   *The Intuition:* AC forces you to *commit* to a specific element. That commitment leaks information about the truth value of $P$ hidden in the set definitions.

