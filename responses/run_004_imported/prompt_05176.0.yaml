answer: |-
  This is a great tension to center a seminar around, because it cuts to the heart of what we mean by "rationality." You are right to be unsatisfied with the standard Causal Decision Theory (CDT) answer. If rationality always mandates mutual defection in high-stakes one-shot dilemmas, then rationality looks less like a virtue and more like a disability.

  You want a pick, so here it is: **Tennenholtz's Program Equilibrium is the more defensible position.**

  Hofstadter's Superrationality is the brilliant philosophical intuition, but Tennenholtz provides the rigorous mechanism that makes that intuition survive contact with formal game theory. Hofstadter asks you to believe in a logical miracle; Tennenholtz asks you to accept a change in the move space. The latter is a much heavier lift for a skeptic to deny without conceding the point.

  Here is the breakdown of why, structured for your seminar prep.

  ### 1. Hofstadter's Superrationality: The Metaphysical Leap
  **The Assumption:**
  Superrationality rests on the **Symmetry of Reasoning**. It assumes that if two agents are perfectly rational and face identical problems, they must arrive at the same solution. Therefore, my decision is not an independent variable; it is logically correlated with the opponent's. I am not choosing between $C$ and $D$ given their move; I am choosing between the outcome $(C,C)$ and $(D,D)$.

  **Where It Breaks Down:**
  It breaks against **Causal Decision Theory (CDT)**.
  Standard game theory assumes my action cannot *cause* the other player's action in a one-shot game without a causal link (communication, enforcement, repetition). Hofstadter relies on **Evidential Decision Theory (EDT)** or the modern **Functional Decision Theory (FDT)**. To a CDT proponent, Hofstadter is engaging in magical thinking. They will argue: "Even if we reason identically, my hand moving to press 'Cooperate' does not physically force your hand to press 'Cooperate.' Since I gain more by defecting regardless of what you do, I defect."

  Superrationality requires you to accept that logical counterfactuals have decision-theoretic weight. That is a hard sell in a standard economics or game theory seminar without first dismantling the attendees' foundational understanding of causality.

  ### 2. Tennenholtz's Program Equilibrium: The Mechanism Shift
  **The Assumption:**
  Tennenholtz changes the ontology of the player. Players are not black boxes submitting actions; they are **transparent algorithms submitting source code**. The "move" is not $C$ or $D$; the move is the program that determines $C$ or $D$.
  The key assumption here is **Readability**. I can inspect your code, and you can inspect mine. A program like `FairBot` (Cooperate if opponent's code proves it will cooperate with me, else Defect) creates a causal loop where cooperation becomes the stable equilibrium.

  **Where It Breaks Down:**
  It breaks against **Obfuscation and Computability**.
  1.  **The Halting Problem:** In the general case, I cannot algorithmically verify what your code will do without running it, which might lead to infinite recursion (I simulate you simulating me...). Tennenholtz's original 1992 formulation glossed over this. (Later work by Fortnow, Halpern, and the MIRI crowd using Modal Logic fixed this, but it's a technical hurdle).
  2.  **Changing the Game:** The strongest critique is that Tennenholtz isn't solving the Prisoner's Dilemma; he's dissolving it by turning it into a **Commitment Game**. If I can bind my future action via code, it's no longer a "one-shot" dilemma in the traditional sense.

  ### 3. The Verdict: Why Tennenholtz Wins
  Here is why you should back Tennenholtz in your seminar.

  **1. It grounds the "Magic" in Mechanism.**
  Hofstadter says, "We will think the same." Tennenholtz says, "Here is the code that *forces* us to think the same."
  Superrationality relies on a psychological or logical coincidence. Program Equilibrium relies on **transparency**. In a world increasingly populated by AI agents, smart contracts, and automated trading bots, transparency of policy is an engineering constraint, not a metaphysical one. It is easier to argue that agents *should* be transparent (or can be forced to be) than to argue that agents *must* be logically correlated acausally.

  **2. It addresses the "Rationality" definition more robustly.**
  Critics of Hofstadter say he is redefining rationality to mean "cooperation." Critics of Tennenholtz say he is redefining the game.
  Redefining the game is the more honest move. Tennenholtz correctly identifies that for sophisticated agents, **the policy is the action.**
  If you are a human, you choose $C$ or $D$ in the moment. If you are a rational agent (human or AI), you choose a *disposition* or a *policy* that generates actions. Tennenholtz formalizes the insight that rational agents select policies, not just atomic moves. If you select a policy of "Defect always," you get $(D,D)$. If you select a policy of "Conditional Cooperation," you get $(C,C)$. Rationality dictates selecting the policy that yields the higher utility.

  **3. It survives the "Clone" objection.**
  Hofstadter's argument works best if the players are identical clones. If they are merely "similar," the symmetry argument weakens. Tennenholtz's Program Equilibrium works even if the code is different, provided the logic is compatible (e.g., my `FairBot` can cooperate with your `PrudentBot` if they can prove mutual cooperation). It is more generalizable.

  ### The Seminar Hook
  If I were you, I would frame it this way:

  > "Hofstadter identified the bug in standard game theory: it treats agents as isolated causal islands even when their reasoning is identical. But he offered a philosophical patch. Tennenholtz offered an architectural fix.
  >
  > In a seminar on rational cooperation, Superrationality is the *motivation*, but Program Equilibrium is the *solution*. Superrationality asks us to believe that rationality implies cooperation. Program Equilibrium shows us **how** to build rationality such that it implies cooperation.
  >
  > Therefore, Tennenholtz is more defensible because it doesn't require us to abandon causality; it requires us to acknowledge that in high-stakes rational interaction, **source code is the only currency that matters.**"

  **The Caveat to anticipate:**
  Your sharpest student will ask: "But humans don't have readable source code."
  **Your answer:** "True. But humans have reputations, social signaling, and pre-commitment devices that *approximate* source code. Furthermore, if this seminar is about the *future* of rational cooperation (AI, automated systems), Tennenholtz is the only one that scales. Hofstadter is for philosophers; Tennenholtz is for engineers building cooperative systems."

  **Pick:** Tennenholtz. It turns a paradox into a design specification.
