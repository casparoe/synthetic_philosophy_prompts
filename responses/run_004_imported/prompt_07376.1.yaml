answer: |-
  This is a nuanced ethical situation that touches on consent, autonomy, transparency, and the nature of support within a relationship. You are describing a classic example of **"choice architecture"** or **"nudging"**—altering the environment to make a desired behavior easier without restricting freedom of choice.

  Whether this is "wrong" depends less on the action itself and more on how it fits into the broader context of trust and agency in your relationship. Here is a breakdown of the ethical dimensions at play, along with a perspective on how to resolve your unease.

  ### The Argument for Ethical Permissibility

  There are strong ethical arguments suggesting what you are doing is not only acceptable but commendable:

  **1. Explicit Consent to Help**
  The most critical factor is that your partner *asked* for this. They identified a problem (excessive phone use) and requested assistance. In ethical terms, you are operating within a mandate they gave you. You are not imposing your will on them; you are fulfilling a request for support.

  **2. Preservation of Autonomy**
  You have not removed their ability to choose. The phone is not locked away; the charger is not hidden in a place they cannot access. You have simply added a small amount of "friction" (getting out of bed) to the unwanted behavior and reduced friction for the wanted behavior (reading). This is the definition of a "libertarian paternalistic" nudge: steering toward a benefit while preserving the right to opt out.

  **3. Positive Outcome**
  Consequentialist ethics focus on results. The outcome is exactly what your partner said they wanted. They are sleeping better, connecting more, or stressing less (presumably), and they haven't expressed frustration about the changes.

  ### The Source of Your Unease

  Despite the green lights above, your discomfort is valid. It stems from two main concerns: **transparency** and **paternalism.**

  **1. The Transparency Gap**
  Relationships thrive on shared reality. By keeping the method secret, you create a small asymmetry: you know the "rules of the game," and they do not. You worry that if they knew, they might feel managed rather than supported. This touches on the value of honesty. While you haven't *lied*, you are omitting context about their own behavior.

  **2. The Risk of Paternalism**
  There is a fine line between being a supportive partner and being a "parent." By managing the environment from behind the scenes, you risk subtly shifting the dynamic from *partners working together* to *one person managing the other's habits.* Your worry that "it falls apart" if they know suggests you fear they might react against the *method* even if they like the *result*, which implies a fear of resistance to your influence.

  ### Does the Secrecy Matter Morally?

  Keeping the method to yourself matters morally **if** it undermines their agency or the trust in the relationship long-term.

  *   **If they found out tomorrow:** Would they feel cared for ("Wow, you went out of your way to help me succeed") or manipulated ("You were tricking me into doing things")?
  *   **The "Own Idea" Fallacy:** You mentioned worrying that if it stops feeling like "their own idea," it falls apart. However, since they *asked* for help, the idea *was* theirs originally. You are simply providing the infrastructure for *their* goal.

  ### A Path Forward: From Manager to Teammate

  You don't necessarily need to undo what you've done, but you might consider shifting the dynamic from "secret manager" to "open teammate." This resolves the moral tension without necessarily ruining the effectiveness.

  **1. Reframe the Disclosure**
  You don't need to present it as a scheme you devised. You can present it as an experiment you tried to support them.
  *   *Instead of:* "I moved the charger so you wouldn't use your phone."
  *   *Try:* "I know you wanted to cut down on phone time, so I tried moving the charger to the kitchen to see if making it slightly less convenient helped. How has that felt for you?"

  **2. Invite Collaboration**
  If you bring it into the light, you invite them to be part of the design. This restores full agency. They might say, "Actually, I hate the kitchen charger, can we try something else?" or "I didn't notice, but I love the book idea." This transforms the action from *management* to *collaboration.*

  **3. Assess the "Why"**
  Ask yourself why you feel the need to keep it secret.
  *   Is it to protect their feelings?
  *   Is it to avoid conflict?
  *   Is it because you enjoy the efficacy of the "invisible hand"?
  If it's the latter, be careful. Efficiency is not the highest virtue in a marriage; partnership is.

  ### Conclusion

  There is likely **nothing morally wrong** with what you have done so far. You acted on a request, used non-coercive methods, and achieved a mutually desired goal. This is thoughtful, practical support.

  However, your unease is a signal that **long-term secrecy might erode the sense of partnership.** You are currently prioritizing the *efficacy* of the habit change over the *transparency* of the relationship.

  **Recommendation:**
  Consider gently disclosing what you did, not as a confession of wrongdoing, but as an invitation to collaborate. Say something like, *"I've been thinking about how to help you with the phone goal you mentioned. I tried moving the charger to the kitchen to reduce temptation. Is that helpful, or would you prefer I just remind you verbally?"*

  This honors their original request, respects their autonomy to approve or disapprove of the method, and clears the air of any feeling that you are "managing" them from the shadows. It turns a "nudge" into a handshake.
