      *   **Marco's Blind Spot:** He's assuming a risk-neutral utility function. In fraud detection, false positives cost money *and* trust. A known 4% allows for provisioning/reserves. An unknown rate makes provisioning impossible. He's also ignoring the *cost of information*. Vendor A paid the cost of transparency; Vendor B hasn't. That signal itself is data.
