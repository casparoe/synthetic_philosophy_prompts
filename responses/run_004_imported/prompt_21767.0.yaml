  2.  **Deconstruct the Arguments:**

      *   **Devon's Core Position:** Prefer known risk (A) over unknown ambiguity (B). Reason: Downside protection, reputational risk, "unknown unknowns."
      *   **Marco's Core Position:** Ambiguity aversion is a cognitive bias (Ellsberg). Without data, the expected value of B should equal A (Principle of Indifference). Demands principled reasoning for worst-case weighting.

      *   **Move 1 (Devon):** "Go with A. B is unknown, too risky."
      *   **Move 2 (Marco):** "That's Ellsberg paradox. If we have no idea, best guess is 4% (symmetry). Should be indifferent. Calling it 'too risky' is a bias."
