answer: |-
  This is an excellent dispute, precisely the kind of friction that generates heat and light in a graduate seminar. Lena and Marco have both grasped the core literature, but they are talking past one another because they are prioritizing different criteria for individuation. Lena is prioritizing the *ontological status of the basis*, while Marco is prioritizing the *causal dynamics of the stimulus*.

  Here is an evaluation of the four moves, followed by an analysis of what remains unresolved in their framework.

  ### Evaluation of the Moves

  **Move (1): Lena's Classification (Mask)**
  *   **Verdict:** **Lena has the better of it.**
  *   **Reasoning:** Lena is correctly applying the standard Lewis/Bird criterion. The distinction between a fink and a mask turns on whether the *causal basis* of the disposition is removed or merely intercepted. In the standard fragile glass case, the basis is the silicon-oxygen lattice structure. In Lena's case, the polymer coating does not alter that lattice; it remains brittle at the molecular level throughout the event. The coating intercepts the energy transfer (the causal process) rather than eliminating the susceptibility to break (the disposition). By the textbook definition, if the basis remains intact, it is a mask.

  **Move (2): Marco's Objection (Timing)**
  *   **Verdict:** **Lena wins; Marco is mistaken.**
  *   **Reasoning:** Marco is conflating a *contingent feature* of paradigmatic finks with a *necessary condition*. It is true that Martin's electro-fink and Lewis's sorcerer react *to* the stimulus. However, this is because they are designed to protect the disposition by removing it *when threatened*. There is no metaphysical law stating that a mask must be a "standing" interferer. One could imagine a "triggered mask"—a force field that activates only upon impact but merely absorbs shock without altering the object's intrinsic properties. The timing of the intervention is irrelevant to the classification; what matters is *what* the intervention acts upon (the basis vs. the manifestation).

  **Move (3): Lena's Reply (Ontology over Timing)**
  *   **Verdict:** **Lena wins, but she is vulnerable.**
  *   **Reasoning:** Lena is right to insist that the distinction is metaphysical (what changes) rather than temporal (when it changes). This aligns with the consensus in the literature (e.g., Bird, *Nature's Metaphysics*). However, she is assuming a tidy individuation of the "basis" that Marco is about to challenge. She assumes the basis is *only* the glass's microstructure. If the basis of the *object's* fragility includes its surface properties, her claim that the basis is "unaffected" becomes shakier.

  **Move (4): Marco's Comeback (Momentary Basis Change)**
  *   **Verdict:** **This is a Draw (with a slight edge to Marco on insight).**
  *   **Reasoning:** Marco identifies the weak point in Lena's armor. He is right that Martin insisted finks could be instantaneous. More importantly, he forces the question: What is the "causal basis" of the disposition in this specific case?
      *   If the disposition belongs to the *glass*, the basis is the silica lattice (unchanged = Mask).
      *   If the disposition belongs to the *coated artifact*, the basis includes the surface properties. Since the polymer chains lock up during impact, the physical properties of the artifact's surface *do* change intrinsically during the stimulus interval.
      *   If the surface properties are part of the causal basis for shattering, and those properties change upon stimulus, then functionally, the basis *has* been altered for the relevant interval. Marco is correct that a temporary alteration of the basis counts as a finkish removal of the disposition *for that interval*.

  ### What They Are Missing

  Both students are treating the Fink/Mask distinction as a binary switch inherent to the world, when it is actually sensitive to three deeper metaphysical choices they haven't yet made explicit. To settle this, you need to push them on the following:

  **1. The Individuation of the Bearer (The "Glass" vs. The "System")**
  The entire disagreement rests on where they draw the boundary of the object holding the disposition.
  *   **Lena** treats the bearer as the *glass substrate*. Relative to the glass, the coating is an extrinsic interferer (Mask).
  *   **Marco** treats the bearer as the *functional artifact*. Relative to the coated cup, the hardening polymer is an intrinsic property change triggered by the stimulus (Fink).
  *   **The Lesson:** Dispositions are typically taken to be intrinsic properties. If the coating is extrinsic to the glass, it cannot be a fink *of the glass* (because finks must remove the intrinsic basis). However, if we are assessing the disposition of the *coated cup*, we must ask if the hardening counts as a change in the *cup's* intrinsic basis. If the polymer is chemically bonded and functions as part of the structural integrity, Marco is right: the cup's intrinsic structure changes upon impact.

  **2. The "Intrinsicness" Constraint on Finks**
  There is a subtle constraint in the literature that Marco is brushing against but not naming. Lewis's Sorcerer changes the glass's *intrinsic* molecular structure. In Lena's case, does the polymer stiffening count as an intrinsic change to the *basis of fragility*?
  *   Fragility is the disposition to break under stress. The basis is the inability to absorb energy without bond rupture.
  *   The polymer *absorbs the energy*. It does not make the glass bonds stronger; it prevents the energy from reaching them.
  *   **The Missing Point:** A fink prevents the manifestation by making the object *no longer disposed*. A mask prevents the manifestation while the object *remains disposed*.
  *   In the STP case, if you were to freeze the moment of impact and analyze the glass lattice, it is still brittle. The *stress* is what is mitigated, not the *susceptibility*. Therefore, despite the timing and the stiffening, it is metaphysically a **Mask**. Marco is confusing "changing the conditions of manifestation" with "changing the disposition."

  **3. The Possibility of "Finkish Masks" (Hybrid Cases)**
  They are assuming the categories are exhaustive. Recent work (e.g., by Choi or Gundersen) suggests there can be hybrid cases or that the distinction is less important than the failure of the Simple Conditional Analysis (SCA).
  *   If the goal is to repair the SCA (e.g., via a "Reformed Conditional Analysis"), both finks and masks are problems to be solved.
  *   However, if the goal is a causal powers ontology, the distinction matters for *explanation*.
  *   **The Settlement:** You should tell them that Lena is technically correct on the standard definition (Mask), because the *power to shatter* (the brittleness) is not removed, only the *transfer of energy* required to trigger it. However, Marco is methodologically correct to worry about the timing and basis individuation, because in many real-world cases, "surface properties" are part of the dispositional basis.

  ### Recommendation for the Seminar

  Do not simply declare a winner. Instead, frame the resolution this way:

  1.  **Acknowledge Marco's Insight:** He is right that timing often correlates with finks, and right that "basis" is slippery. If the coating is considered part of the object's intrinsic structure, the case becomes much harder.
  2.  **Affirm Lena's Classification:** On the standard view, because the glass's microstructure (the canonical basis of fragility) remains unchanged, and because the glass *would* shatter if the coating were stripped mid-strike (counterfactual test), the disposition persists. Persistence of disposition = Mask.
  3.  **The "Killer" Test:** Ask them to consider the **counterfactual of removal**.
      *   **Fink:** If the sorcerer were removed *before* the strike, the glass would break. If the sorcerer is removed *during* the strike (after the fink activates), the glass *still doesn't break* (because the basis is already gone).
      *   **Mask:** If the coating is removed *before* the strike, the glass breaks. If the coating could be removed *during* the strike (before the energy transmits), the glass *would* break.
      *   In the STP case, if the polymer vanished instantly at the moment of impact, the glass would shatter. This proves the disposition was present *during* the stimulus. Therefore: **Mask.**

  This settles the case while validating Marco's rigorous scrutiny of the "basis." It turns their stalemate into a lesson on counterfactual diagnostics for dispositions.
