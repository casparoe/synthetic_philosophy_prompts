      *   **Move (2) Marco (Fink - Timing):** He argues masks are "standing interferers" (independent of stimulus), while finks react *to* the stimulus. Since STP reacts to impact, it's a fink.
          *   *Assessment:* Weak. Timing is a symptom, not the definition. A mask *could* theoretically be triggered by the stimulus but still leave the basis intact (e.g., a force field that turns on upon impact but doesn't change the object's intrinsic properties). Martin/Lewis focus on the *loss of disposition/basis*, not just the timing of the intervention.
          *   *Verdict:* Marco is conflating correlation with definition. Lena wins this round.

      *   **Move (3) Lena (Ontology over Timing):** She reiterates the standard view: Finks change basis, Masks don't. Basis unchanged = Mask.
