          *   *However:* If the STP changes the *structural properties* such that the object is no longer brittle *during* the strike, it's a fink. Shear-thickening fluids effectively change the viscosity/rigidity properties.

      *   **Issue 2: Intrinsic vs. Extrinsic.**
