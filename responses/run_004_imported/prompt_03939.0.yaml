          *   If I tap it lightly (no STP activation), it might still scratch or chip differently? No, STP is shear-thickening.
          *   *Crucial Distinction:* Does the intervention prevent the *manifestation* (Mask) or prevent the *possession of the disposition* during the stimulus (Fink)?
          *   In the STP case, the glass *remains* brittle (molecularly), but the *system* behaves non-brittly.
          *   This suggests Lena is right: It's a mask of the glass's fragility.
          *   But Marco is right: It acts *like* a fink temporally.

      *   **Issue 3: The "Basis" Problem.**
          *   What is the causal basis of fragility? Microscopic structure.
          *   Does the STP change the microscopic structure of the *glass*? No.
          *   Does it change the microscopic structure of the *surface*? Yes (polymer chains lock).
