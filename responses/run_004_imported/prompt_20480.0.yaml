      *   **Core Argument:** Conspiracy theories function like Freudian/Adlerian psychoanalysis (Popper's examples of non-science) because they are unfalsifiable. Any counter-evidence is absorbed into the conspiracy ("they covered it up"). Therefore, Popper's falsifiability criterion should settle the matter: conspiracy theories are irrational *by definition*.
