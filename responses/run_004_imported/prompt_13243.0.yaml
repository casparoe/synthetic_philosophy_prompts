prompt: |-
  So there's this mobile game where alliance events let you spend real money on currency packs to climb a leaderboard, and whoevers on top when it ends gets an exclusive skin that doesn't even do anything gameplay-wise. For the last few events, me and this one other player have kept buying more packs every time the other one takes the lead. At this point I've spent way more than that skin is worth to me, but every time he retakes the lead I think 'if I quit now, that money was for nothing and he wins,' so I buy more. My partner thinks I've lost the plot. Am I being irrational here, or is there something real going on?
reasoning: |-
