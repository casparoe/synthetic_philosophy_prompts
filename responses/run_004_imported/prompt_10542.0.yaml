answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Wei's cousin. I'm also the family's designated "philosophy person," which is a fancy way of saying I spend my days reading 2,000-year-old texts so I can tell you what love is tonight.

  Wei actually gave me a very specific threat before I started writing this. She said, and I quote: "If your toast makes me sound like I'm dissolving into the role of 'wife,' I am never speaking to you again." And since she's finishing her JD and I'd like to retain my ability to visit my own family, I took that legal counsel seriously.

  So, I want to talk about what marriage actually *is*.

  There's a tension in this room tonight. On one side, you have the traditional view—held by some elders here—that marriage is a sacred structure, a set of duties that make us who we are. On the other side, you have the modern view—that marriage is a contract between two independent souls who found their "other half."

  The truth, I think, is a third option. And it comes from the very tradition Wei's father honors, but interpreted in a way that honors Wei's sharpness.

  In my field, specifically in the work of Roger Ames and Henry Rosemont, we talk about "Confucian Role Ethics." The core idea is simple but radical: There is no "Wei" floating in a vacuum before she met you, [Fiancé's Name]. We are not isolated atoms. We are a "focus in a field." We are the sum of our relationships. You are a son, a friend, a lawyer, a partner. You don't *have* these relationships; in a very real way, you *are* them.

  Now, I know what Wei is thinking. She's thinking, "Great. So I'm just a collection of duties? I'm just a script I have to follow?"

  And this is where the philosophy gets interesting. Because in this tradition, filling a role isn't about obedience. It's about *yi*—appropriateness. And it requires *quan*—moral discretion.

  There is a famous story in the *Mencius*. A man asks, "The rules say men and women shouldn't touch. But what if my sister-in-law is drowning? Do I let her die to follow the rule?" Mencius says, "If you don't pull her out, you're a wolf." The rule is there to guide you, but your judgment—your nerve—is what makes you human.

  Wei, you are brilliant, difficult, and opinionated. A rigid Confucian script would break under your weight. But a living role ethics *demands* that weight. Being a partner isn't about following a pre-written script of what a "good wife" does. It's about looking at the unique, messy reality of your life with [Fiancé's Name] and deciding, in every moment, what is appropriate. What is right. Sometimes that means following the ritual. Sometimes, like the drowning sister-in-law, it means breaking the protocol to save the humanity of the relationship.

  So, to [Fiancé's Name]: You aren't marrying a static object. You are marrying a force of nature who is constantly cultivating herself through her relations. You don't complete her. She is already whole, but she is growing, and she has chosen to grow *with* you.

  And to Wei: You aren't disappearing into a role. You are taking up a role so you can play it better than anyone else could. You aren't losing your independence; you're gaining a context in which to exercise your judgment.

  **Wei told me if I use the word "teleology" she's cutting me off from the family Wi-Fi, so I'll stop there.**

  But seriously. To the Dad: This tradition you love isn't a cage. It's a garden. It requires pruning, it requires weather, and it requires a gardener with a strong hand.

  To the friends: This isn't a loss of self. It's the construction of a shared world.

  And to Wei and [Fiancé's Name]: May your *li* be beautiful, may your *yi* be sharp, and may you always have the courage to weigh the rules against the reality of each other.

  To the couple.
