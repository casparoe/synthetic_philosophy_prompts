      *   *Ames/Rosemont Hook:* "Focus in a field." We are the sum of our relationships.
      *   *Wei's Agency:* *Yi* (rightness/appropriateness) and *Quan* (weighing/discretion). Being a good "wife" (or partner) isn't obedience; it's making the hard call when the rules don't fit. It requires *nerve*.
      *   *The "Third Way":* Not "I lose myself for you" (traditional trap) and not "We are two atoms colliding" (liberal trap). It's "We are the space between us, cultivated."

  3.  **Drafting - Section by Section:**

