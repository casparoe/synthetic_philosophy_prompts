          *   Wei (The Bride): JD student, sharp, opinionated, worried about being subsumed into the role of "wife" (losing agency/identity).
      *   **Core Argument:** Confucian Role Ethics (Ames & Rosemont).
          *   No pre-relational self (against individualism).
          *   Personhood is constituted through roles/relations (focus in a field).
