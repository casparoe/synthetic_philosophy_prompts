      *   So both probabilities in Dec 2 are exactly 40% of the probabilities in Dec 1.
      *   This is precisely the **Common Ratio Effect** structure.
      *   EUT prediction: If you prefer S1 over R1, you must prefer S2 over R2. (Because you divide both sides of the inequality by the scaling factor).
      *   She did the opposite. This confirms the EUT violation.

