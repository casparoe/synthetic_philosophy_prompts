answer: |-
  You are not overthinking this. In fact, you have stumbled upon a textbook violation of Expected Utility Theory (EUT).

  As a PhD student in economics, you will recognize the structure immediately: your aunt's choices exhibit the **Common Ratio Effect**, a specific formulation of the **Allais Paradox**. Under the standard assumptions of EUT with stable preferences, these two decisions are mathematically incompatible.

  Here is the formal breakdown, the behavioral explanation, and the contextual caveats you might consider when discussing this with your undergraduates (or your aunt).

  ### 1. The Formal Inconsistency

  Let $u(x)$ be your aunt's von Neumann-Morgenstern utility function over monetary outcomes, normalized such that $u(0) = 0$.

  **Decision 1 (Settlement vs. Arbitration):**
  She chose the sure \$2,000 over the lottery.
  $$ u(2000) > 0.75 \cdot u(3000) + 0.25 \cdot u(0) $$
  $$ u(2000) > 0.75 \cdot u(3000) $$
  Dividing by $u(3000)$, this implies:
  $$ \frac{u(2000)}{u(3000)} > 0.75 \quad \text{(Inequality 1)} $$

  **Decision 2 (Modest Claim vs. Ambitious Claim):**
  She chose the ambitious claim (30% chance of \$3,000) over the modest claim (40% chance of \$2,000).
  $$ 0.30 \cdot u(3000) + 0.70 \cdot u(0) > 0.40 \cdot u(2000) + 0.60 \cdot u(0) $$
  $$ 0.30 \cdot u(3000) > 0.40 \cdot u(2000) $$
  Rearranging to isolate the utility ratio:
  $$ \frac{u(2000)}{u(3000)} < \frac{0.30}{0.40} $$
  $$ \frac{u(2000)}{u(3000)} < 0.75 \quad \text{(Inequality 2)} $$

  **The Contradiction:**
  Inequality 1 requires the ratio of utilities to be **greater than 0.75**. Inequality 2 requires the same ratio to be **less than 0.75**. They cannot both be true simultaneously for a single utility function.

  In the language of choice theory, she has violated the **Independence Axiom**. Specifically, this is the **Common Ratio Effect**: when the probabilities of both non-zero outcomes are scaled down by the same factor (in this case, multiplied by 0.4), preferences reversed. EUT dictates that scaling probabilities by a common factor should not change the ordering of preferences, yet your aunt (like the majority of experimental subjects in Allais-type problems) did exactly that.

  ### 2. The Behavioral Explanation

  If you are teaching choice under uncertainty, this is a perfect real-world example to introduce **Prospect Theory** (Kahneman & Tversky, 1979).

  In Prospect Theory, individuals do not weight probabilities linearly. Instead, they use a weighting function $\pi(p)$ that typically overweights small probabilities and underweights moderate to high probabilities, with a particular discontinuity at certainty ($p=1$).

  *   **In Decision 1:** The \$2,000 option has a probability of 1.0. The weighting function $\pi(1)$ is disproportionately high compared to $\pi(0.75)$. This is the **Certainty Effect**. The drop from 100% to 75% feels much more significant than the drop from 40% to 30%, even though both are absolute reductions of 25 percentage points (or proportional reductions of 25%).
  *   **In Decision 2:** Neither option is certain. Both probabilities (0.4 and 0.3) fall in the range where the weighting function is roughly linear or concave. Without the "certainty premium" anchoring her to the \$2,000 option, she focuses more on the payoff magnitude (\$3,000 vs. \$2,000) relative to the probability difference.

  Mathematically, Prospect Theory allows for:
  1.  $\pi(1)u(2000) > \pi(0.75)u(3000)$
  2.  $\pi(0.3)u(3000) > \pi(0.4)u(2000)$

  This is easily satisfied if $\pi(1) = 1$ and $\pi(0.75)$ is sufficiently depressed relative to the ratio $\pi(0.3)/\pi(0.4)$.

  ### 3. Contextual Caveats (The "IO" Perspective)

  While the choices violate EUT *ceteris paribus*, as an economist you know that *ceteris* was not *paribus*. Before labeling your aunt "irrational," consider these structural differences that might rationalize the behavior without invoking behavioral biases:

  1.  **Framing and Transaction Costs:**
      *   **Case 1** was "Settlement vs. Arbitration." A settlement often implies immediate payment and the end of legal fees/stress. Arbitration involves delay, legal costs, and uncertainty beyond just the verdict. The "cost" of the arbitration route might have been higher than modeled.
      *   **Case 2** was "Claim A vs. Claim B." Both presumably required arbitration. The transaction costs were likely identical for both options, isolating the risk preference.

  2.  **Liquidity Constraints (Changing Utility Functions):**
      *   EUT assumes a stable utility function. However, if her company's cash flow position differed significantly between the two years, her marginal utility of money would change.
      *   If in Year 1, \$2,000 was critical for immediate operating costs (high marginal utility), while \$3,000 was only marginally better, she would be risk-averse.
      *   If in Year 2, \$2,000 was insufficient to fix the underlying problem (a threshold effect), but \$3,000 solved it, the utility function becomes convex in that range (S-shaped), making her risk-seeking.

  3.  **Ambiguity vs. Risk:**
      *   In Case 1, the lawyer's estimates (75/25) might have been perceived as ambiguous. People are often ambiguity-averse. A sure settlement removes ambiguity.
      *   In Case 2, both options relied on the same lawyer's estimates. The ambiguity might have canceled out, leaving her to compare the raw ratios.

  ### Conclusion

  You have identified a genuine inconsistency **under the axioms of Expected Utility Theory**. Your intuition that something "felt hard to square" was mathematically correct.

  However, you shouldn't worry that your aunt is behaving erratically. This pattern is robustly documented in the literature (the Common Ratio Effect) and is generally considered a systematic feature of human psychology rather than random noise.

  For your TAing, this is a fantastic anecdote. It demonstrates that while EUT provides a normative benchmark for consistency, positive models of behavior (like Prospect Theory) or context-dependent models (like liquidity constraints) are often required to explain actual decision-making. You aren't overthinking it; you're doing exactly what an IO PhD student should do: looking for the structural model behind the data.
