answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Dr. Aris Thorne (Behavioral Psychologist) stirs a tea. Dr. Lena Vos (Game Theorist) leans back in a chair, balancing a pen on her notebook.*

  **Thorne:** So, your friend told you about the Dollar Auction?

  **Vos:** She did. She said you and your partner lived it out. Four times past your ceiling.

  **Thorne:** It's the classic escalation of commitment. We call it the sunk cost fallacy in my field. You invest, you fall behind, and suddenly the logic flips. It's no longer about winning the dollar; it's about avoiding the loss of the bid you've already placed. It's emotional trapping. The physiology of loss aversion kicks in, the prefrontal cortex goes offline, and you throw good money after bad.

  **Vos:** See, that's where I have to push back. If you look at the payoff matrix, the "trap" isn't in your head. It's in the rules. In a standard auction, if I'm out, I pay nothing. In Shubik's game, if I'm out, I pay my last bid. That changes the marginal utility of the next bid. Once we're both above fifty cents, the auctioneer has already made a profit. The game becomes a War of Attrition. From where I sit, escalating isn't necessarily irrational. It's a response to a punitive incentive structure.

  **Thorne:** But "rational" implies you're maximizing utility. If I bid five dollars for a one-dollar bill, I have demonstrably failed to maximize utility. You can dress it up as a War of Attrition, Lena, but in the lab, people bid way past the point where any expected value calculation justifies it. They bid twenty dollars. Fifty dollars. That's not equilibrium; that's pathology.

  **Vos:** Is it? Let's talk about equilibrium. There is no pure-strategy Nash Equilibrium in the Dollar Auction. If I decide to stop at one dollar, you should bid one-oh-five. If I know you'll stop at one dollar, I should bid five cents and win immediately. Because we can't predict the other's stopping point with certainty, the only stable solution is a mixed strategy. We randomize our bids. In that distribution, there is a non-zero probability of very high bids. When you see someone bid twenty dollars, you aren't seeing a glitch. You're seeing the tail end of the equilibrium distribution.

  **Thorne:** That feels like a convenient mathematical abstraction. Real people don't randomize. They agonize. They feel regret. And here's the evidence that troubles me: this escalation happens even when there is no opponent. Take the Concorde Fallacy. Governments kept funding a plane they knew would never be profitable. There was no competing government forcing them to bid higher to avoid a penalty. It was a solitary decision. Yet, they escalated. If the Dollar Auction were purely about the strategic structure of the second-bidder penalty, why does the same behavior show up in single-agent dynamic decisions?

  **Vos:** That's a fair point, but you're conflating two different mechanisms. In the Concorde case, you have dynamic inconsistency—preferences changing over time. In the Dollar Auction, you have strategic uncertainty. But here is my counter-evidence to your "bias" claim: If this were purely a cognitive bug, like a visual illusion, the bidding shouldn't correlate tightly with the stakes. But it does. If you auction a ten-dollar bill, the final price is significantly higher than if you auction a one-dollar bill. If it were just "emotional trapping," the arousal might be similar, but the *depth* of the escalation tracks the payoff structure. People are sensitive to the incentives, Aris. They aren't just blind to them.

  **Thorne:** Sensitivity to incentives doesn't prove rationality. Loss aversion is sensitive to stakes too. I feel more pain losing a thousand dollars than losing ten. That doesn't make the pain rational; it makes it systematic. My concern is that by calling this an "equilibrium," you let the bidders off the hook. You suggest, "Well, the game made me do it." But in my workshops, when we debrief the players, they don't say, "I was playing a mixed strategy." They say, "I couldn't let him win." That's competitive arousal. It's a social emotion, not a calculation.

  **Vos:** I'm not letting them off the hook; I'm saying the hook is built into the floorboards. Look, I agree that in the *early* stages, people overbid due to optimism bias. But once they are in the "trap"—say, both bids are above the value of the dollar—folding guarantees a loss. Bidding offers a sliver of hope to recoup. If I've bid ninety cents and you bid a dollar, I lose ninety cents if I quit. If I bid $1.05, I only lose five cents *if I win*. The probability of you quitting might be low, but if it's non-zero, the expected value of bidding $1.05 can be higher than the certain loss of ninety cents. That's not a bias. That's risk management in a hostile environment.

  **Thorne:** But that logic holds all the way up to infinity. If I follow that logic, I should bid a million dollars. The fact that people *do* stop eventually proves that something other than that cold calculation is intervening. Usually, it's exhaustion or external intervention. And regarding your point about stakes: behavioral economics shows that people's willingness to escalate scales with the initial investment. The more I've sunk, the harder it is to walk away. That's the sunk cost effect. It's a heuristic that usually serves us—don't waste resources—but in this specific topology, it malfunctions.

  **Vos:** I think we might be arguing about the definition of "rational." You define it as "optimal outcome." I define it as "best response to the environment given constraints." In a War of Attrition, the cost of the fight is the price of admission. Nature does this. Two stags locking horns. They don't know who is stronger. They escalate until one yields. The loser pays an energy cost and gets nothing. Is the stag irrational? Or is the cost of information gathering inherently expensive? The Dollar Auction forces you to discover the other player's valuation by paying for the privilege.

  **Thorne:** But the stag isn't paying a penalty for *losing* the fight, other than the energy spent. In the Dollar Auction, the second-place bidder pays a fine. That's artificial. And here is where your game theory struggles with my data: We've run variations where we remove the second-bidder penalty. Escalation drops, yes. But we also run variations where we remove the *opponent* entirely. We tell subjects, "You can keep investing in this project. It has a 50% chance of paying out double, but if it fails, you lose your investment." People keep investing past the breaking point there, too. No opponent. No second-place penalty. Just the ghost of their own past investment. If the Dollar Auction is purely structural, why does the ghost haunt solitary decisions?

  **Vos:** Because the human brain didn't evolve to play one-shot anonymous auctions. It evolved for repeated social interactions. In a repeated game, establishing a reputation for not backing down has value. So, when you put a human in a one-shot Dollar Auction, they bring their repeated-game heuristics to a single-shot problem. That *is* a mismatch. I'll grant you that. But does that make the behavior irrational in the moment? If their internal model says, "If I back down now, I signal weakness that will be exploited later," then escalating is the rational move *for that model*. The error is in the model of the world, not the calculation itself.

  **Thorne:** So you're saying the bias is in the priors?

  **Vos:** Exactly. The structure of the auction exploits a heuristic that is usually adaptive.

  **Thorne:** Then we agree that there is a vulnerability in the cognition.

  **Vos:** We agree there is a vulnerability in the *interface* between cognition and environment. But here is where I won't concede: If you tell people the rules clearly, explain the Nash Equilibrium, and pay them in real cash, they *still* escalate. Not everyone, but enough. If it were just a cognitive bug, education should fix it. But knowing the trap doesn't always let you escape it, because the incentive to bid one more time remains valid as long as you believe the other guy might fold.

  **Thorne:** And if it were just incentives, professional traders wouldn't fall for it. But they do. In IPO flipping, in bidding wars for startups. Expertise reduces the error, but it doesn't eliminate it. That suggests the emotional component—the "I won't let him win"—is doing heavy lifting. You can't model "spite" easily in a payoff matrix.

  **Vos:** Actually, we can. It's called a utility function that includes relative standing. If my utility is $Profit - YourProfit$, then driving you into a loss is worth some cost to me.

  **Thorne:** (Laughs) There it is. You just mathed away the human emotion. "Relative standing utility." That's just a formal way of saying "ego."

  **Vos:** And "ego" is a variable that predicts behavior. If including it in the model makes the predictions accurate, is it a bias or a feature?

  **Thorne:** It's a feature that becomes a bug in specific contexts. Like sugar. We crave it because we evolved in scarcity. In a Dollar Auction, that craving gets exploited. I worry that if we frame this as "equilibrium," we tell victims of escalation that they were just playing the game correctly. They weren't. They lost money.

  **Vos:** And I worry that if we frame this as "bias," we tell people they can just "think better" to escape. Sometimes you can't. Sometimes the structure is so pernicious that the only rational move is not to sit at the table. But once you're seated, and the bidding starts, the line between "rational escalation" and "irrational commitment" gets blurry.

  **Thorne:** So, for my friend who lost the house?

  **Vos:** Tell them the game was rigged. Not by a person, but by the rules of the housing market combined with the rules of human psychology.

  **Thorne:** And tell them that their brain tried to solve a social problem using tools designed for survival, not for real estate.

  **Vos:** (Pauses) I can accept that. As long as we also admit that if they hadn't escalated, they might have felt the regret of "what if" more acutely than the regret of the lost money.

  **Thorne:** Now you're doing psychology.

  **Vos:** No. That's just another payoff variable.

  **Thorne:** (Smiles) We're not going to resolve this, are we?

  **Vos:** Not today. The data supports you, but the model supports me.

  **Thorne:** And the poor bidder is left holding the bill.

  **Vos:** Precisely. Which, ironically, proves both our points.
