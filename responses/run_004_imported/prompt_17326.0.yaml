      *   Ensure the distinction between CDT/EDT and UDT is clear regarding the *timing* of the optimization.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I address the "do worse" claim?* Yes, by showing that in the *ex-ante* view, UDT does better. In the *ex-post* view (given Tails), UDT does worse, but that view is considered the wrong metric for rationality in this framework.
      *   *Is the Counterfactual Mugging explanation accurate?* Yes. Omega pays on Heads *if* you would pay on Tails.
      *   *Is the AI safety connection strong?* Yes, focus on precommitment and bargaining.

