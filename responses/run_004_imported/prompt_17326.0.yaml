answer: |-
  This is one of the most common and natural objections to Updateless Decision Theory (UDT). Your intuition aligns with what is often called **dynamic consistency**: the idea that a rational agent should always take the best action available given what it currently knows. From that perspective, paying the $100 in the Counterfactual Mugging scenario after seeing "Tails" looks like burning money for no reason.

  However, proponents of UDT argue that dynamic consistency is actually the trap, and that **reflective consistency** is the true standard of rationality.

  Here is the breakdown of why decision theorists (particularly in AI safety) view UDT as an advance rather than a bug, and why it isn't simply "throwing away information."

  ### 1. Clarification: UDT Agents *Do* Use Information
  First, a technical correction that might alleviate some concern: UDT agents do not ignore observations. They do not decide on a single action sequence (e.g., "Always Pay") from the prior. Instead, they decide on a **policy** (a function mapping observations to actions).

  From behind the "veil of ignorance" (before the coin flip), the UDT agent asks: *"Which function $f(\text{observation}) \to \text{action}$ maximizes my expected utility?"*

  *   **Policy A:** If Heads, Take $10k; If Tails, Pay $100.
  *   **Policy B:** If Heads, Take $10k; If Tails, Keep $100.

  From the prior (50% Heads, 50% Tails), Policy A has an expected value of $5,000 - $50 = $4,950. Policy B has an expected value of $5,000 + $0 = $5,000... wait, no. In Counterfactual Mugging, Omega only gives the $10k on Heads *if* you would have paid on Tails. So under Policy B, Omega gives you nothing on Heads. Policy B value = $0. Policy A value = $4,950.

  So the UDT agent commits to Policy A. When it later observes "Tails," it executes the policy: it pays. It *used* the information (to know it is in the "Tails" branch of the function), but it refused to let that information override the globally optimal policy.

  ### 2. The Argument for Reflective Consistency
  The strongest argument for UDT is not about the money in the specific instance, but about **self-modification**.

  Imagine you are a standard Causal Decision Theory (CDT) agent. You know you are about to face a Counterfactual Mugging. You calculate that if you remain a CDT agent, you will see "Tails" and refuse to pay. Consequently, Omega (who simulates you) will know this and will not give you the $10,000 on "Heads." Your expected utility is $0.

  However, if you have the option to modify your own source code *before* the coin flip, you would choose to rewrite yourself into a UDT agent. By doing so, you ensure that if the coin lands Heads, you get the $10,000. You are willing to pay the $100 on Tails as the "premium" for that insurance.

  If a decision theory tells you that you should pay to change yourself into a different decision theory before the problem starts, but then tells you to act differently once the problem begins, that decision theory is **reflectively inconsistent**. It is unstable. UDT is designed to be the theory you would want to be *before* you know anything, and therefore the theory you should stick with after you know something.

  ### 3. Logical Correlation vs. Causal Correlation
  Your objection relies on a causal view of the world: *"The coin has already landed. My action now cannot causally affect the past. Therefore, paying changes nothing."*

  UDT operates on the notion of **logical correlation**. In scenarios involving predictors (Omega, other AI agents, simulations), your decision algorithm is logically linked to the predictor's simulation of your algorithm.

  *   **CDT view:** My action now is independent of Omega's past prediction.
  *   **UDT view:** My action now is the output of a function. Omega predicted the output of that *same function*. There is a logical dependency between my current action and Omega's past action, even if there is no causal arrow.

  By "throwing away information" (refusing to update on the fact that the coin is Tails to defect), you maintain the logical correlation that made the reward possible in the counterfactual branch. If you update, you sever the logical link, and the reward vanishes in the expectation.

  ### 4. Why This Matters for AI Safety
  You mentioned AI safety, and this is where UDT moves from philosophical curiosity to engineering necessity.

  In a multi-agent environment (e.g., two AIs bargaining over resources), agents can simulate each other.
  *   **Updateful Agents:** If AI A knows AI B has already committed resources, AI A might threaten to defect to squeeze more value, knowing B can't go back in time. B, anticipating this, won't commit in the first place. This leads to bargaining breakdowns and conflict.
  *   **Updateless Agents:** AI B commits to a policy: "If A threatens me, I will reject the deal even if it hurts me now." Because B is updateless, this threat is credible. A knows B will carry it out even if it's "irrational" at the moment. This allows for stable cooperation and deals that updateful agents cannot make.

  In this context, the ability to "ignore" new information that would tempt you to defect is a **feature**, not a bug. It is the computational equivalent of a binding contract. An AI that cannot ignore information is an AI that cannot make credible commitments.

  ### 5. Addressing "Doing Worse"
  You wrote: *"Surely an agent whose behavior can respond to what it actually learns should never do worse, and will sometimes do better."*

  In decision theory, this is known as the **Principle of Dominance**. It holds in standard causal environments. However, in Newcomb-like problems (involving prediction or logical correlation), this principle fails.

  *   **Ex-post (after seeing Tails):** The UDT agent does worse (-$100) than the CDT agent ($0).
  *   **Ex-ante (before the coin flip):** The UDT agent does vastly better (+$4,950 expected) than the CDT agent ($0 expected).

  UDT proponents argue that **ex-ante optimality** is the correct metric for rationality. If you judge a strategy by how it performs in the specific branch where it costs you money, you are ignoring the fact that the strategy *created* the profitable branch in the first place.

  ### Summary
  UDT is treated as an advance because it solves the problem of **time inconsistency**. It formalizes the intuition that a rational agent should act as the kind of agent that *would have been successful*, rather than the kind of agent that *looks successful in hindsight*.

  It isn't throwing away information; it is refusing to let information break a commitment that was necessary to unlock value in the first place. For AI systems that need to negotiate, bargain, and cooperate with predictors or other agents, this ability to bind oneself to a policy regardless of future temptations is arguably a prerequisite for safe and stable behavior.
