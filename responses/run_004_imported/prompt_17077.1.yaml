prompt: |-
  A friend and I spent a long evening arguing about the Knobe effect and never reached an agreement, so I would like a more systematic outside opinion. We agree on the phenomenon itself: people are far more willing to call a foreseen side effect "intentional" when it is bad than when it is equally foreseen but good. Where we disagree is on which theory actually explains this, once you look past the original chairman/environment vignette to the later evidence: the same valence-driven asymmetry shows up in attributions of knowledge as well as intention, it generalizes to violations of non-moral (e.g., conventional or statistical) norms, and cost-versus-bonus vignettes reproduce it with no moral valence involved at all. Please rank the following explanatory accounts by how well they cover that whole body of evidence, not just the original case:

  - Knobe's own account, on which moral valence is built into the very concept of intentional action
  - Adams and Steadman's pragmatic account, on which the asymmetry is a conversational implicature rather than a genuine difference in judgment
  - Nadelhoffer's account, on which affect distorts the perceived degree of foreknowledge
  - Alicke's culpable-control model, on which the desire to blame drives the downstream judgment
  - Uttich and Lombrozo's norm-violation account, on which any norm violation, not only a moral one, inflates perceived intentionality
  - Sripada's Deep Self Concordance model, on which the judgment tracks perceived (in)difference in the agent's stable values
  - Machery's trade-off hypothesis, on which what matters is whether the side effect was a necessary cost rather than a bonus

  Present your answer as a tier list in JSON, from S (best covers the full evidence base) down to D (worst), like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  followed by a one-sentence justification for each theory's placement.
