answer: |-
  **The Setting:** *A quiet corner of a coffee shop. Alex, a software engineer, sits between two old graduate school friends: Elena, a moral philosopher known for her work on practical reason, and Marcus, a metaphysician of value. Alex has been agonizing over two job offers for weeks.*

  **Alex:** Look, I'll lay it out one more time. Job A is at a big tech firm. High salary, great benefits, stable, but the work is maintenance on legacy code. Boring. Job B is at a non-profit building educational tools for underfunded schools. Meaningful, exciting, but the pay is thirty percent less and the job security is shaky. I've weighed them. I can't find a reason to pick A over B, or B over A. And they don't feel *equal*. It's not like I'm indifferent. It's like... the scales don't even connect.

  **Elena:** That feeling of disconnection is exactly the point, Alex. You're experiencing what I call **parity**. The standard model of rationality tells you there are only three relations: A is better than B, B is better than A, or they are equally good. But hard choices reveal a fourth relation. A and B are "on a par." They are comparable, but neither better, worse, nor equal.

  **Marcus:** With respect, Elena, that's a solution in search of a problem. What Alex is describing is classic **incomparability**. There is no common measure between "legacy code stability" and "educational impact." When there is no common measure, no comparative relation holds. Not better, not worse, not equal, and certainly not "on a par." "On a par" implies a relation exists. I'm saying the relation is absent. Full stop.

  **Elena:** But if the relation were absent, Marcus, then a small improvement to one option should make it better. This is the Small Improvement Argument. Alex, imagine Job A offered you five hundred dollars more per year. Just a trivial bump. If Job A and Job B were truly incomparable—like comparing a number to a color—then adding value to A shouldn't suddenly make it comparable to B. But intuitively, if Job A paid *millions* more, you'd take it. So there is a point where A becomes better than B.

  **Alex:** Yeah, sure. If Job A paid ten million, I'd take it.

  **Elena:** Exactly. Now, if A and B were *equal*, that five hundred dollar bump would make A+ strictly better than B. But in hard choices, A+ doesn't feel strictly better than B. You'd still hesitate. Since A+ isn't better than B, A and B weren't equal. Since A isn't better than B, and B isn't better than A, and they aren't equal... they must be on a par. It's a distinct normative relation.

  **Marcus:** That argument assumes what it needs to prove, Elena. You're assuming that the five hundred dollars is a uniform unit of value that slides neatly onto the scale. But Alex just admitted that at the current margin, the money and the meaning are different *kinds* of goods. When you add the five hundred dollars to Job A, you aren't just tipping a scale; you're asking whether *this specific increment of money* outweighs *that specific amount of meaning*.

  In many hard choices, the improvement itself is incomparable to the competing option. The five hundred dollars might be too small to register against the value of "educational impact." It's not that there's a fourth relation called parity; it's that the comparison function returns `null`. The Small Improvement Argument fails because the improvement is often swallowed by the vagueness of the values involved.

  **Elena:** It's not vagueness, Marcus. Vagueness is epistemic—it's about what we *know*. Parity is ontological—it's about how the values *are*. If it were just vagueness, then with enough reflection, we should be able to sharpen the concepts until we see which is better. But Alex has been thinking for weeks. The hardness isn't in Alex's mind; it's in the world. The values themselves refuse to be ranked. By calling it "incomparability," you render the choice irrational. If there's no relation, rationality has no grip. You're left with a coin flip.

  **Marcus:** And by calling it "parity," you give the illusion of rational grip where there is none. You're dressing up a gap in the normative order as if it were a feature of the normative order. My worry is practical. If I tell Alex, "These are incomparable," I am telling the truth: reason runs out. Alex must choose based on desire, commitment, or whim. That's honest. If you tell Alex, "These are on a par," you imply there is a fact of the matter—a fourth fact—that Alex is detecting. But what work is that fact doing?

  **Elena:** It does crucial work! It makes room for the will. If the options were equal, reason would dictate indifference. If one were better, reason would dictate choosing it. But if they are on a par, reason permits either choice, but it doesn't require indifference. It allows Alex to *create* reasons. By committing to Job B, Alex makes the features of Job B more reason-giving. Parity is the space where agency lives. Incomparability leaves agency stranded in a void.

  **Marcus:** That sounds poetic, but look at the logic. You say parity allows Alex to "create reasons." But if A and B are genuinely on a par, then prior to the choice, there is no reason to prefer one. So the choice is groundless. You're saying Alex can *make* it grounded by choosing. But that's just bootstrapping. If there was no comparative relation before, how does the act of choosing conjure one into existence?

  It's simpler to say: The values are different. There is no super-value "Goodness" that measures both Security and Meaning. So, no comparison is possible. Alex isn't detecting a "parity relation." Alex is recognizing that the comparator function is undefined for these inputs.

  **Elena:** But if the comparator is undefined, Marcus, then why does the five hundred dollar test work at the extreme? If I offer Alex ten million dollars for Job A, the choice becomes easy. The comparator *does* exist. It's just that in the middle range, the relation isn't "better than" or "equal to." It's "on a par." You're conflating "no relation" with "a non-standard relation." In computer science terms—and I know Alex will appreciate this—you're insisting that if `compare(A, B)` doesn't return -1, 0, or 1, it must throw an Error. I'm saying it can return a valid state, let's call it `2`, which signifies parity.

  **Marcus:** The problem with your `2`, Elena, is that it behaves exactly like an Error in practice. If I ask, "Should I pick A?" and the answer is "They are on a par," the answer to "Why?" is "Because they are on a par." That explains nothing. If I say "They are incomparable," the answer to "Why?" is "Because they share no common metric." That explains the difficulty.

  Furthermore, your view implies that hard choices are structurally identical. Every hard choice is a case of parity. But some hard choices seem to be conflicts of duty, others of desire, others of incommensurable values. Lumping them all under "parity" smooths over important distinctions. Raz's point was that sometimes values are just different. The value of friendship and the value of honesty aren't "on a par." They are different dimensions. Trying to force them into a single comparative structure, even a four-valued one, is a category mistake.

  **Elena:** But Alex *has* to choose. You can't live in the category mistake. You have to take one job. By denying the comparative relation, you imply that whichever job Alex picks, it wasn't rationally permissible to pick it over the other because there was no "over." Parity validates the choice. It says, "You can compare them, and the result is that they are in the same league, but neither wins." That licenses Alex to step forward without feeling irrational.

  **Marcus:** It licenses Alex to step forward, yes, but it misdescribes the terrain. You're worried that "incomparability" makes the choice arbitrary. I think "parity" makes it magical. You claim that by choosing, Alex creates reasons. But if A and B are on a par, then prior to the choice, there is no more reason to choose A than B. So the choice is, by definition, reason-less. You can't fix that by waving a wand and calling it "agency."

  The honest truth is harder: Rationality doesn't always guide us to a unique solution. Sometimes it guides us to a set of permissible options, and sometimes it goes silent. Incomparability is the silence. Parity is you pretending the silence is a kind of music.

  **Elena:** It's not silence, Marcus. It's a different key. The silence view suggests we are blind to the value structure. The parity view suggests the value structure is rich enough to include non-ranking comparisons. If you say "incomparable," you tell Alex, "Reason cannot help you here." If I say "on a par," I tell Alex, "Reason tells you that both are eligible, and now your will can settle the matter." The practical consequence is the difference between feeling lost and feeling empowered.

  **Marcus:** But is that empowerment bought at the cost of truth? If I tell a pilot, "The instruments are giving a fourth reading called 'parity'," when in fact the sensor is just disconnected, I haven't empowered them. I've confused them. If the values truly don't connect, then no amount of "will" can make them connect. Alex will choose based on who she wants to *be*, not on which job is *better* or *on a par*. That's not creating reasons; that's expressing identity. And that doesn't require your fourth relation. It only requires that the comparison fails.

  **Elena:** But identity *is* a source of reasons! If Alex chooses the non-profit because she wants to be a person who values impact, that feature becomes reason-giving *through* the choice. Parity is the structural condition that allows that transformation. Incomparability shuts the door on that transformation by saying the options are normatively isolated.

  **Marcus:** They aren't isolated. Alex can weigh them. She just can't rank them. There's a difference. I can weigh the aesthetic value of a poem against the nutritional value of an apple. I can think about both. But I can't say they are "on a par." I can only say the comparison makes no sense. You're insisting that because we *deliberate*, there must be a *relation*. I'm saying we deliberate precisely to find out if there is a relation. If we don't find one, that's a result. It's not a fourth outcome. It's the absence of an outcome.

  **Alex:** *Holding up a hand.* Okay, stop for a second. This is where I'm stuck. Elena, you're saying there *is* an answer, it's just "parity," and that lets me choose and make it right. Marcus, you're saying there *isn't* an answer, the comparison fails, and I just have to pick based on who I am. But... practically?

  **Elena:** Practically, Alex, my view means your choice isn't a failure of rationality.

  **Marcus:** Practically, Alex, my view means you shouldn't look for a rationality that isn't there.

  **Elena:** But if you accept Marcus's view, you risk thinking that because reason is silent, your choice is merely causal. Like a billiard ball hitting another.

  **Marcus:** And if you accept Elena's view, you risk thinking that your will has metaphysical powers to alter the normative landscape just by choosing.

  **Alex:** So the disagreement isn't about what I should *do*. I have to pick one tomorrow. The disagreement is about what the choice *is*.

  **Elena:** Exactly. Is it an exercise of normative agency in a complex field?

  **Marcus:** Or is it an exercise of personal commitment in the face of normative silence?

  **Alex:** And neither of you can prove which description is true.

  **Elena:** Because the evidence is the choice itself.

  **Marcus:** Because the structure of value doesn't reveal its own seams.

  *They sit in silence for a moment. The coffee has gone cold.*

  **Alex:** Well. I suppose I have to decide which story I prefer to tell myself while I sign the contract.

  **Elena:** *Smiling.* That, Alex, is the parity talking.

  **Marcus:** *Shaking his head.* No. That's just the incomparability of philosophy and employment.

  *Alex laughs, picks up a pen, and hovers over the offer letters. The philosophers watch, neither yielding, as the pen descends.*
