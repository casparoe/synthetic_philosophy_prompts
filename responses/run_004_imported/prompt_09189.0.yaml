answer: |-
  The Hall of Adjustments was a circular room with no windows, lit by a central chandelier that cast no shadows. Aris Thorne stood in the center, holding a velvet-covered tray. On it rested the Chronos Key, a device he had spent twenty years forging. It did not tell time; it synchronized it. Wherever the Key was placed, clocks within a hundred miles would strike the exact same second, eliminating the drift of individual mechanisms. It was a tool of absolute distinctness, a singular achievement.

  Across the curved table sat the Committee of Seven. They were not elected. They simply occupied the chairs.

  "We have reviewed the submission," said the Chair, a man named Heller whose face was pleasant and entirely unmemorable. He did not look at Aris, but at the space slightly above Aris's left shoulder.

  "And?" Aris asked. His voice sounded too loud in the absorbent room. He wanted a signature. He wanted a date. He wanted the responsibility of the Key to be transferred from his hand to the city's trust.

  "And there is a discussion," Heller said.

  "About the mechanics?"

  "About the implications." One of the women, sitting third from the left, leaned forward. "It is a fascinating piece. Truly. But one wonders if synchronization is what the city *needs*."

  "It is what the city uses," Aris said. "The trains are late. The bells conflict. This solves it."

  "It solves it too well," said a man at the far end. He was smiling, but it was a tight smile, the kind that acknowledges a superiority it refuses to name. "If everyone is on the same second, where is the room for individual variance? For the personal rhythm?"

  This was the chatter. Aris recognized it now. They were not discussing the Key; they were discussing the *idea* of the Key. They were circulating opinions about the object without touching the object.

  "I didn't build it for variance," Aris said. "I built it for truth. The time is the time."

  "Truth is a strong word," Heller murmured. "It suggests a single authority. We prefer a multiplicity of perspectives. The Public feels that time is subjective."

  "Who is the Public?" Aris asked. He had asked this before, in letters, in petitions.

  Heller blinked. "The Public is everyone. And no one. It is the spirit of the age."

  "I want to know who accepts the Key," Aris said. "If I leave it here, who is responsible for it? If it fails, who fixes it? If it succeeds, who acknowledges it?"

  "That is a very old-fashioned way of thinking," the woman said. "Responsibility is shared. If the Key fails, it is because the City was not ready. If it succeeds, it is because the City willed it."

  Aris felt a cold knot in his stomach. This was the leveling. They would not let the Key stand as his work. If it worked, it would be because the *zeitgeist* allowed it. If it failed, it would be because the *community* wasn't supportive. His agency was being dissolved into a phantom body.

  "I built it," Aris said. "My hands filed the gears. My mind calculated the variance."

  "We know," Heller said soothingly. "And we admire you for it. We admire you so much that we want to ensure you aren't isolated by it. To claim the Key as solely yours would be to separate you from us. We don't want that. We want you to remain one of us."

  This was the envy. It was not hatred. It was a suffocating admiration that demanded he be brought down to the horizontal plane. They wanted his invention, but they did not want his distinction. They wanted to bind him to them through comparison, not commitment. They would not commit to the Key, because that would admit he was above them. Instead, they would compare themselves to him until the difference vanished.

  "I don't want to be one of you," Aris said. "I want to be the one who fixed the time."

  "But who is to say it was broken?" the man at the end asked. "That is merely your opinion. Another opinion might be that the drift was charming. Human. The Public enjoys the charm."

  "The Public hasn't seen it," Aris snapped. "You haven't even uncovered it."

  He reached for the velvet.

  "Please," Heller said, raising a hand. "Let's not be hasty. Violence is so... passionate. We are trying to have a dialogue."

  "I am trying to act," Aris said. "You are only talking."

  "Talk is the precursor to action," the woman said. "In the Present Age, we understand that reflection is superior to deed. A deed is final. Talk remains open. Talk allows for adjustment."

  "There is nothing to adjust."

  "Everything is adjustable," Heller said. "For instance, we have been discussing renaming the device. 'The Chronos Key' implies a singular authority. Perhaps 'The Community Sync-Tool.' Or simply 'The Adjustment.'"

  "It is not an adjustment," Aris said. "It is a correction."

  "Correction implies error," the man at the end said. "And who is to say the City is in error? That would be arrogant. The Public does not like arrogance. The Public prefers equality."

  Aris looked around the table. He saw seven people, but he knew there were none. There was only the abstraction. If he shouted at Heller, Heller would say he was speaking for the Committee. If he shouted at the Committee, they would say they were listening to the Public. There was no one to hold. No one to blame. No one to thank.

  "What if I take it back?" Aris asked quietly.

  Heller sighed, a sound of genuine pity. "You can't do that, Aris. You've already shown it. The knowledge is out. The Public knows it exists. To withhold it now would be antisocial. It belongs to the conversation now."

  "It belongs to me."

  "Nothing belongs to anyone," Heller said. "That is the old way. Property is a barrier to connection. We are all connected through the chatter. The idea of the Key is now circulating. It is in the air. You cannot catch the air and put it in a box."

  Aris looked at the tray. The velvet cover seemed to pulse. He realized the trap. If he smashed the Key, he would be a vandal, judged by the Public. If he gave it to them, he would be erased, absorbed by the Public. If he kept it, he would be hoarding, resented by the Public.

  The Public was a monster made of mirrors. It reflected everyone so perfectly that no one cast a shadow.

  "I see," Aris said.

  "We knew you would," Heller said. "You are intelligent. You understand the necessity of leveling. Without it, we would have heroes and villains. With it, we have only participants."

  "And what do participants do?"

  "We observe," the woman said. "We comment. We ensure that no one rises too high, and no one falls too low. We maintain the equilibrium."

  Aris lifted the velvet. The Key gleamed, brass and steel, precise and sharp. It was a thing of passion. It demanded to be used. It demanded a decision.

  "If I leave this here," Aris said, "will you sign the ledger?"

  Heller looked at the ledger. It was a large book, open on the table. The pages were blank.

  "Signatures are so definitive," Heller said. "They limit the interpretation. If I sign, I take responsibility. If the Public changes its mind about the Key tomorrow, I am stuck. I prefer to remain fluid."

  "So no one signs."

  "No one signs."

  "So if it breaks..."

  "It will be a collective misunderstanding."

  "And if it works..."

  "It will be a collective triumph."

  Aris looked at his hands. They were calloused, stained with oil. They were real. But in this room, they were already becoming abstract. He was becoming a character in a story the Committee was telling itself, a story where no one ever did anything, but everyone had an opinion on what was done.

  He felt a surge of anger, a hot, passionate desire to throw the Key through the windowless wall. But there were no windows. And even if there were, the Public would just say the glass was fragile, or the throw was statistically probable, or that the breakage was a shared aesthetic experience.

  His anger died. It was replaced by a cold reflection. He understood now. He could not fight them. You cannot duel a fog.

  "Keep it," Aris said.

  "We knew you would see reason," Heller said. "We will form a sub-committee to discuss the placement."

  "And I?"

  "You are welcome to attend the meetings. As an observer. You can offer opinions. Like everyone else."

  Aris nodded. He turned and walked to the door.

  "Oh, Aris," Heller called out.

  Aris stopped.

  "We will ensure your name is mentioned. Occasionally. In the context of the group, of course."

  "Of course," Aris said.

  He stepped out into the hallway. It was quiet. He could hear the city clocks outside, all striking different minutes, a chaotic chorus of disordered time. It was messy. It was human.

  He realized he missed it.

  He walked away from the Hall of Adjustments. He did not run. Running would imply he was fleeing something specific. He simply walked, dissolving into the crowd, where no one was responsible for the noise, and everyone was equal in the drift. He became part of the Public, safe, level, and utterly alone.
