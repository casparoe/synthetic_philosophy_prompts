answer: |-
  Your intuition that something is missing from your friend's argument is well-founded. While his position comes from a compassionate place—wanting to house more people and maximize opportunity—it relies on a specific ethical framework that has significant blind spots when applied to urban planning.

  He is arguing from a perspective known in philosophy as **Total Utilitarianism**. This is the idea that the moral goal is to maximize the *total sum* of happiness or "good lives." Under this view, adding a person whose life is "worth living" (even if just barely) adds to the total good, so you should keep adding people until the city collapses.

  Here is a breakdown of why his reasoning feels off, along with the philosophical and practical counter-arguments you can use.

  ### 1. The "Repugnant Conclusion"
  The philosopher Derek Parfit identified a major flaw in Total Utilitarianism called the "Repugnant Conclusion." It states that if your only goal is to maximize the *number* of good lives, you would eventually have to accept a world with a massive population where everyone's life is barely worth living, rather than a smaller population where everyone thrives.

  *   **The Flaw:** Your friend sets the bar at "life is still clearly worth choosing." But a city where everyone is stuck in traffic for three hours, has no access to parks, and lives in noise-polluted micro-units might meet that low bar while failing to be a place where humans *flourish*.
  *   **Your Counter:** We should care about the *average* quality of life, not just the *total* headcount. A city of 500,000 happy people is arguably better than a city of 2 million miserable people, even if the 2 million chose to be there because they had no other options.

  ### 2. The Tragedy of the Commons
  Your friend assumes that because each new resident chooses to move there, their individual calculation is sound. However, this ignores **negative externalities**.

  *   **The Flaw:** When one person moves in, they gain a home. But they also add a car to the commute, one more person to the park, and one more unit of noise. Individually, the trade makes sense. Collectively, if too many people do it, the resource (the livability of the city) is degraded for *everyone*, including the newcomers.
  *   **Your Counter:** Just because a newcomer chooses to move here doesn't mean they aren't contributing to a problem that will eventually hurt them, too. Rational individual choices can lead to collective ruin. Planning exists specifically to prevent this tragedy.

  ### 3. Infrastructure and Carrying Capacity
  Cities are not infinite containers. They function on infrastructure (sewers, transit, roads, schools, water).

  *   **The Flaw:** Your friend's argument implies we can stack density indefinitely as long as people are willing to live in "small, basic units." But if the transit system snaps or the sewage overflows, the city becomes unhealthy.
  *   **Your Counter:** There is a physical limit to density before a city becomes dysfunctional. Approving units without ensuring the infrastructure can support them isn't "growth," it's decay. Protecting the functionality of the city isn't selfishness; it's stewardship.

  ### 4. The Definition of "Selfishness"
  Your friend frames the debate as: *Current Residents' Comfort vs. New Residents' Basic Needs.* This is a rhetorical trap.

  *   **The Flaw:** This framing suggests current residents are hoarding luxury while newcomers starve. In reality, current residents might be arguing for **sustainable growth** rather than **no growth**.
  *   **Your Counter:** Want a community that is socially cohesive, environmentally sustainable, and mentally healthy is not selfish. True selfishness would be approving cheap developments to boost short-term property values or construction profits while knowing it will degrade the city for the next 50 years. Prudence is not a disguise for selfishness; it is a requirement for longevity.

  ### 5. Quality of Housing vs. Quantity of Units
  You mentioned the units are "small" and "basic."

  *   **The Flaw:** Your friend focuses on *access* to the city, but ignores the *experience* of living in it.
  *   **Your Counter:** If we approve thousands of units that are too small for families, or lack light and air, we are creating a tiered system where the wealthy get "homes" and the working class gets "storage units with beds." Is the goal to house people, or to house people *well*? Maximizing the count often minimizes the quality.

  ### Summary: How to Reply
  Your friend isn't "wrong" that housing people is a moral good. But he is wrong that it is the *only* moral good.

  You might say something like:
  > "I agree that housing people is vital. But your argument assumes we can add infinite people as long as life is 'worth choosing.' That's a low bar. If we overcrowd the city to the point where commutes are unbearable and there's no green space, we aren't creating 'good lives,' we're just creating *more* lives of a lower quality.
  >
  > Protecting the city's infrastructure and livability isn't selfishness; it's making sure the city works for the people who are already here *and* the people who will be here in 20 years. We need to balance density with capacity, not just maximize the headcount."

  **Verdict:** He is partially right about the moral imperative to house people, but his reasoning is philosophically incomplete and practically dangerous if taken to its logical extreme. Your discomfort comes from recognizing that **quality of life** matters just as much as **quantity of lives.**
