  **MEMORANDUM**

  **TO:** Conscientious Objection Review Board, Region IV
  **FROM:** Dr. [Your Name], Civilian Member
  **DATE:** October 26, 2023
  **SUBJECT:** Preliminary Opinion: Case of Sgt. [Name], Logistics Corps

  **I. RECOMMENDATION**

  After reviewing the applicant's file, the relevant regulations, and the arguments presented during our initial deliberation, I recommend we adopt an intermediate disposition: **Denial of Conscientious Objection Status, with a Formal Board Recommendation for Administrative Reassignment to Non-Combat Duties.**

  This outcome acknowledges the binding constraints of our founding regulation while addressing the specific moral injury alleged by the applicant. It avoids setting a precedent that undermines civilian control of military strategy, yet it refuses to treat the sergeant's conscience as irrelevant simply because it is selective rather than total.

  **II. THE REGULATORY CONSTRAINT**

  My colleagues who argue for a straightforward denial are correct on the matter of textual fidelity. Our regulation grants objector status only to those "conscientiously opposed to participation in war in any form." Sgt. [Name] explicitly states he is not a pacifist; he affirms a willingness to fight in defense of the homeland. To grant him full Conscientious Objection (CO) status would require us to rewrite the regulation from the bench, effectively legalizing Selective Conscientious Objection (SCO) by fiat.

  There is a profound institutional logic to the current text. In a democracy, the judgment of *jus ad bellum* (the justice of entering war) is reserved for elected civilians, not uniformed personnel. If we empower individual soldiers to adjudicate the strategic morality of every deployment, we risk fracturing the chain of command and transforming the military into a collection of moral arbiters rather than an instrument of state policy. The three members arguing for denial are right to note that a board such as ours lacks the intelligence briefings, strategic context, and democratic mandate to relitigate the merits of a campaign. To grant CO status here would imply that this Board has determined the war is indeed unjust, a conclusion we are neither equipped nor authorized to make.

  **III. THE MORAL VARIABLE**

  However, the fourth member's concern regarding arbitrariness cannot be dismissed. To tell a soldier that his conscience is valid only if it is absolute creates a moral paradox: it suggests a soldier may be compelled to participate in actions he sincerely believes are criminal, provided those actions are part of a larger "war" authorized by the state.

  Sgt. [Name]'s objection is not based on political preference but on empirical observation. As a logistics sergeant, he has access to casualty figures and Rules of Engagement (ROE) that suggest the campaign has shifted from self-defense to the punitive targeting of civilians. In just war theory, there is a distinction between *jus ad bellum* (why we fight) and *jus in bello* (how we fight). The sergeant is arguing that the *manner* of this fighting has become so indiscriminate that it voids the legitimacy of his participation. While he may lack the strategic picture to judge the war's inception, he is uniquely positioned to judge its conduct. If the conduct violates the laws of war, a soldier has a duty to disobey unlawful orders. While he admits no *specific* unlawful order has been issued to him, his objection is to a *pattern* of conduct that he believes renders his logistical support complicit in systemic abuse.

  To deny his claim entirely is to assert that a soldier's moral agency ends at the theater of operations. This is a dangerous simplification. It treats conscience as a binary switch (on/off) rather than a variable spectrum.

  **IV. SYNTHESIS: THE INTERMEDIATE PRECIPITATE**

  In the laboratory, when two reagents refuse to settle into a clear solution or a distinct precipitate, we often look for a stable suspension—a state that acknowledges the presence of both elements without forcing a false separation. I believe reassignment offers this equilibrium.

  By **denying CO status**, we uphold the regulation and the principle of civilian control. We affirm that soldiers cannot veto deployments based on their own assessment of strategic necessity. We avoid the slippery slope of requiring this Board to evaluate the justice of every conflict.

  By **recommending reassignment**, we acknowledge the sincerity of the sergeant's moral distress. We recognize that even if he is mistaken about the strategic necessity of the campaign, his refusal to facilitate what he perceives as civilian targeting renders him ineffective in his current role. A soldier who fights with moral reservation is a liability; a soldier who believes he is complicit in atrocity is a breakdown waiting to happen. Reassigning him to a non-combat role (perhaps stateside logistics or training) removes him from the environment causing the moral injury without validating his judgment of the war itself. It treats his conscience as a medical or administrative reality, rather than a legal precedent.

  **V. CONCLUSION**

  This disposition asks the Board to hold two truths simultaneously: that the military requires obedience to lawful orders regarding *where* to fight, and that it requires integrity regarding *how* we fight. Denying the application preserves the former; recommending reassignment preserves the latter.

  I urge my colleagues to consider this path. It allows us to vote against the application without voting against the man. It keeps the Board within its legal lane while ensuring we do not become merely a rubber stamp for a system that sometimes grinds down the very people it relies upon.

  I am available to discuss this formulation further before we circulate the final draft to the Commanding General.

  Respectfully,

  Dr. [Your Name]
  Civilian Member, Region IV Conscientious Objection Review Board
