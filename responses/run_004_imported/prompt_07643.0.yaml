answer: |-
  This is a fantastic tension to be wrestling with, and it speaks well of your novel that you are treating the philosophy of psychiatry with this level of granularity. You are right to be wary of the "kids these days" trap; that is a moral judgment, whereas Hacking is offering a *structural* description of how knowledge and people interact.

  To argue for your friend's side without conceding that Mara's experience is "fake" or that the clinic is "truth," we need to focus on the **directionality of the feedback** and the **site of revision**.

  Here is the strongest argument for why Mara's TikTok spiral is *semantic contagion* rather than a genuine Hacking-style looping effect, based on the mechanics of *Historical Ontology*.

  ### 1. The Locus of Revision: The Kind vs. The Individual
  Hacking's core distinction in "Making Up People" is between *interactive kinds* and *indifferent kinds*. But the crucial mechanism of the "loop" is not just that the person changes (adoption); it is that the **classification itself changes** in response to the person.

  *   **Genuine Looping:** In *Rewriting the Soul*, the "multiple personality" kind changed over time. Patients presented symptoms that fit the current medical understanding; doctors refined the understanding; patients then presented *new* symptoms that fit the refined understanding. The *category* of Multiple Personality Disorder evolved historically because of this friction. The "Kind" moved.
  *   **Mara's Situation:** On TikTok, the DSM-5-TR criteria for ADHD or Autism are not moving. The "Kind" is static. What is changing is Mara's self-conception and behavior. She is molding herself to fit the existing static category, not forcing the category to expand or shift to accommodate her.

  **The Argument:** For Hacking, looping is a historical ontology. It creates new *possibilities for being*. If the classification system (the "Kind") does not structurally update to recognize the new behavior as a legitimate variation of the kind, the loop is incomplete. Mara is engaging in **self-incorporation**, not **co-construction**. She is pouring herself into a pre-existing mold, whereas looping requires the mold to soften and reshape around the pour.

  ### 2. Institutional Friction vs. Algorithmic Frictionlessness
  Hacking's examples of looping almost always involve an institution with the power to enforce or codify the classification (the clinic, the court, the asylum, the research lab). The "loop" happens because there is **resistance**. The patient says "I am X," the doctor says "No, X requires Y," the patient develops Y, the doctor updates the theory.

  *   **The Mechanism:** The loop requires a negotiation of authority. The "classified person" must have enough agency to push back against the "classifier" to force a revision of the knowledge system.
  *   **The TikTok Mechanism:** TikTok is algorithmic, not institutional. The feedback loop Mara is in is not with the *authors of the classification* (researchers/clinicians), but with an *algorithm optimized for engagement*.
      *   If Mara posts about her symptoms, the algorithm shows her more content that confirms those symptoms.
      *   This creates an echo chamber, not a dialectic.
      *   There is no friction. There is no authority figure saying, "Actually, that's not how the kind works." There is only a feed saying, "Here is more of that."

  **The Argument:** Without institutional friction, there is no pressure on the *definition* of the kind to change. Semantic contagion spreads because it is frictionless; looping effects occur because they are frictional. Mara is sliding down a chute, not pushing against a wall. The wall (the diagnostic criteria) remains untouched.

  ### 3. Addressing Your Counter: The Autism Precedent
  You mentioned Hacking's later work on autism, where self-advocates *did* change the classification (e.g., shifting from "suffering from autism" to "autistic identity," or influencing the DSM-5 criteria regarding sensory issues). This is your strongest point, so we need to dismantle it carefully.

  *   **Organized Ontology vs. Atomized Consumption:** The neurodiversity movement succeeded in looping because it was **organized political ontology**. Autistic advocates formed organizations, published papers, lobbied the APA, and engaged in sustained discourse with researchers over decades. They forced the *experts* to revise the *textbooks*.
  *   **The TikTok Difference:** TikTok self-diagnosis is atomized. Even if millions of teens are doing it, they are not acting as a coherent political or epistemic bloc that can force a revision of the DSM. They are consumers of content, not negotiators of knowledge.
  *   **Ephemerality:** Hacking's looping effects create *stable* historical kinds. "The Homosexual," "The Multiple Personality," "The Fugue." These stick around long enough to define an era. TikTok trends are ephemeral. The specific "flavor" of ADHD presented on TikTok today might be algorithmically obsolete in six months.

  **The Argument:** The autism precedent proves that *classified people* can drive looping, but it does not prove that *any* activity by classified people counts as looping. It requires **collective agency directed at the knowledge structure**. Mara is engaging in **individual consumption directed at self-understanding**. She is using the vocabulary, but she is not writing the dictionary.

  ### 4. Why This Distinction Matters for the Novel (The "So What?")
  Arguing for your friend's side doesn't mean Mara isn't really struggling. It means her struggle is of a different *category* than the historical examples Hacking cites.

  *   **If it is Looping:** Mara is part of a historical shift. She is an agent of change. Her self-diagnosis is a political act that will eventually change how society sees ADHD. (This risks making the story too triumphant or sociological).
  *   **If it is Semantic Contagion:** Mara is trapped in a linguistic feedback loop that feels like discovery but is actually assimilation. She is finding words for her pain, which is good, but she is finding them in a system that cannot hear her back. This is more tragic and isolating. It highlights the **loneliness** of the internet age: she has all the language in the world, but no one with the authority to validate it is listening.

  ### Summary of the Friend's Position
  To summarize the argument you can use to test your draft:

  > "Hacking's looping effect requires a **bidirectional revision of the Kind**. In Mara's case, the **Individual is revising themselves** to fit a **static Kind**. The feedback she receives is from an algorithm designed for retention, not from an epistemic community designed for truth or classification. Therefore, she is experiencing the *effects* of a classification (the interactive part), but she is not participating in the *loop* (the historical ontology part). She is caught in **semantic contagion**: the rapid spread of the *label* without the structural capacity to reshape the *definition*."

  This allows you to treat Mara's experience with total seriousness (her pain is real, the labels resonate for a reason) without granting the TikTok ecosystem a sociological power it doesn't actually possess. It keeps the novel intellectually honest: Mara is trying to use a tool (diagnostic language) that requires a two-way radio, but she only has a receiver.
