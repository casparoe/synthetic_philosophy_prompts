  1.  **Analyze the User's Query:**
      *   **Context:** Machine Learning (ML) class discussion on inferring preferences from behavior (inverse reinforcement learning/preference learning).
      *   **Situation:** Roommate always says "I don't care, you choose." User has been choosing what's easiest for themselves for a year. Roommate never objects.
