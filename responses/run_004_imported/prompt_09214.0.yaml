answer: |-
  This is an exceptionally sharp reconstruction. For someone without formal training in philosophy, you have grasped the technical and conceptual architecture of the accuracy-dominance argument (often called the **Joycean Argument**) with high fidelity. You have correctly identified the motivation (escaping the pragmatism of Dutch Books), the mechanism (strictly proper scoring rules), and the precise locus of the vulnerability (the justification for propriety).

  Here is a direct assessment of your three points, avoiding hedging where the literature allows for it.

  ### 1. Assessment of Your Reconstruction
  **Verdict: Accurate.**

  You have not garbled the steps. Your summary of the Dutch Book vs. Accuracy distinction is the standard one. Your description of the dominance theorem is correct: if a credence function $c$ is not probabilistic, there exists a probabilistic function $c^*$ such that $c^*$ has a better (lower) score than $c$ at every possible world $w$.

  You are also correct about the mathematical history. Joyce's original 1998 proof (*"A Nonpragmatic Vindication of Probabilism"*) contained a mathematical gap regarding the continuity of the scoring rule. This was famously patched by **Predd et al. (2009)** in *"Probabilistic Coherence and Proper Scoring Rules."* They generalized the result using **Bregman divergences**, which connects directly to your intuition about information theory (log loss corresponds to KL divergence, Brier to squared Euclidean distance). This later work shows that *any* continuous, strictly proper scoring rule generates the dominance result, not just Brier or Log Loss.

  ### 2. The Circularity Worry
  **Verdict: This is a real, recognized, and technically sophisticated objection.**

  You are not confused; you have independently rediscovered what is often called the **"Question-Begging Objection"** or the **"Problem of Credal Veritism."**

  **The Objection:**
  The definition of a "strictly proper" scoring rule $S$ is that for any probability function $p$, $p$ minimizes the *expected* score $E_p[S(p, \cdot)]$.
  Critics (notably **Percy (2009)** and **Caie (2013)**) argue that to calculate an "expected score," one must already possess a probability function to weight the possibilities.
  *   If the argument says, "You should be probabilistic because non-probabilistic credences maximize expected inaccuracy," it implicitly asks the agent to calculate expectations.
  *   If the agent is not yet probabilistic, how do they calculate the expectation?
  *   If they must use probabilistic weights to calculate the expectation that vindicates probabilism, the argument presupposes the norm it seeks to prove. It assumes that rational agents *already* evaluate options using probabilistic expectations.

  **The Standard Response:**
  Proponents of accuracy-first epistemology (like **Pettigrew (2016)**) respond that propriety is not being justified by the agent's *actual* psychological ability to calculate expectations. Instead, propriety is a constraint on the **measure of accuracy itself**, not the agent's decision procedure.
  The claim is: A measure of accuracy is *adequate* only if it treats the truth as the unique optimum. If a scoring rule incentivizes you to report 0.9 when your true credence is 0.8, it is structurally biased away from the truth. Therefore, "strict propriety" is a requirement for a measure to count as a measure of *accuracy* at all, regardless of whether agents use it to make decisions.

  **Is the worry resolved?**
  Not to everyone's satisfaction. The debate hinges on whether "minimizing expected inaccuracy" is a norm of *rationality* or a definition of *accuracy*.
  *   **If it's a norm of rationality:** The circularity charge sticks (you need probabilities to maximize expectation).
  *   **If it's a definition of accuracy:** The charge dissolves, but the argument becomes weaker. It shows that *if* you care about accuracy defined this way, you should be probabilistic. It doesn't prove you *must* care about accuracy defined this way.

  ### 3. Is Strict Propriety Pragmatic or Epistemic?
  **Verdict: It is epistemic in intent, but the derivation relies on assumptions that some argue smuggle in pragmatism.**

  This is the crux of your third question. In ML, propriety is undeniably pragmatic: it ensures honest elicitation so the model doesn't game the metric. In epistemology, the goal is to show it is **alethic** (truth-directed).

  **The Non-Pragmatic Story (The Defense):**
  Philosophers like **Leitgeb & Pettigrew (2010)** argue that strict propriety falls out of purely alethic constraints without reference to incentives. They propose basic norms like:
  1.  **Truth-Directionality:** A credence of 1 in a true proposition is better than a credence of 0.5.
  2.  **Extensionality:** The accuracy of a credence depends only on the truth value of the proposition and the strength of the credence, not on the content of the proposition.
  3.  **Continuity:** Small changes in credence shouldn't cause massive jumps in accuracy scores.

  They demonstrate mathematically that any scoring rule satisfying these purely truth-related constraints *must* be a strictly proper scoring rule (specifically, a Bregman divergence).
  **Why this matters for you:** This suggests propriety isn't an independent assumption imported from statistics. It is a **theorem** derived from the geometry of truth-values. If you accept that accuracy should be continuous and truth-directed, propriety comes for free. This counters the claim that propriety is "pragmatic dressed up."

  **The Remaining Gap (The "Extensionality" Problem):**
  The weak link is **Extensionality**. This assumption says the accuracy of believing "It will rain" at 0.8 depends only on whether it rains, not on *what* "rain" means or how informative the proposition is.
  Critics argue this ignores **informational value**. Sometimes, being confident in a trivial truth is less epistemically valuable than being moderately confident in a deep truth. Strictly proper scoring rules (like Brier) treat all propositions as equally weighted slots in a vector.
  If you reject Extensionality, you can construct accuracy measures that are *not* proper, and the dominance argument fails.
  **So:** The argument is non-circular *if* you accept Extensionality. But Extensionality is a substantive philosophical claim, not a mathematical necessity.

  ### Summary for Your Discussion
  When you speak to your coworker, you can stand on firm ground with the following points:

  1.  **Your reconstruction is solid.** You correctly identified that the move from Dutch Book to Accuracy relies entirely on the mathematical properties of proper scoring rules.
  2.  **Your circularity worry is the standard objection.** You are channeling the critique made by Percy and Caie. The tension is whether "expected inaccuracy" presupposes the probabilistic norms it tries to justify.
  3.  **The "Pragmatic" charge is contested but manageable.** The Predd et al. (2009) result is the key counter-weapon. It shows that propriety is a consequence of geometric constraints on truth-measurement (Bregman divergences), not just an incentive mechanism. However, this relies on the **Extensionality** assumption, which remains a point of philosophical contention.

  **Final Recommendation:**
  You do not need to worry that you have misunderstood the basics. Your intuition that propriety feels like an "incentive" concept is shared by professional epistemologists. The consensus among accuracy-first epistemologists is that the Predd et al. generalization saves the argument from circularity by grounding propriety in the geometry of truth, but the debate over whether that geometry captures *all* of epistemic value (vs. just a subset) is still active. You can confidently present your draft as a correct understanding of the state of play, noting the Extensionality assumption as the specific premise where the "nonpragmatic" claim lives or dies.
