answer: |-
  **TO:** Risk Committee (Slack Channel)
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** PROPOSAL: Capital Allocation & Bet Sizing Policy (v1.0)

  Team,

  We need to lock in a sizing policy before the weekend meeting. We have outside capital now, which means "vibes" and Slack arguments are no longer an acceptable risk management framework. We need a written mandate.

  I've reviewed the arguments from the Full Kelly camp and the objections raised by Priya regarding the theoretical foundations of log-utility maximization. Below is my assessment and a concrete proposal for our policy.

  ### 1. The Theoretical Objection (Priya's Point)
  Priya is correct. We need to state this clearly so the Full Kelly proponents understand we aren't ignoring the math.

  The Kelly Criterion maximizes the expected growth rate of wealth by maximizing the expected value of the *logarithm* of wealth ($E[\log(W)]$). However, as Paul Samuelson pointed out (including in his famous critique written largely in one-syllable words to mock the "long-run" argument), there is no law of physics that says $\log(W)$ is the correct utility function.

  Maximizing log-wealth is equivalent to having a specific risk tolerance. It implies you are willing to endure a 50% drawdown for a specific amount of upside. If our investors (or us) have a different utility function—for example, if we care more about avoiding a 20% drawdown than we care about maximizing terminal wealth in 20 years—then Full Kelly is objectively the *wrong* strategy for us.

  **Verdict:** Priya wins the theory debate. Log-wealth is a choice, not a truth.

  ### 2. The Engineering Objection (Parameter Uncertainty)
  Even if we *did* agree to maximize log-wealth, Full Kelly assumes we know the true probability of winning ($p$). We don't. We have a model that outputs an *estimate* of $p$.

  In engineering terms, Full Kelly has zero margin for error on the input parameters.
  *   If our model says we have a 5% edge, but we actually have a 2.5% edge (a 50% overestimate), Full Kelly bets double what we should.
  *   If we overestimate our edge by 2x, Full Kelly leads to expected ruin.

  Since our edge comes from a statistical model subject to overfitting, regime change, and data snooping, treating our model's output as "ground truth" is a systemic risk.

  ### 3. The Fiduciary Constraint (Outside Money)
  We are no longer just betting our own paycheck. We have outside LPs.
  *   **Redemption Risk:** Investors do not behave rationally during drawdowns. If we hit a 40% drawdown (plausible with Full Kelly on a correlated slate of bets), they will redeem at the bottom.
  *   **Volatility Drag:** High volatility reduces compound returns if there are any cash flows in or out.

  ### 4. The Proposal: Fractional Kelly with Hard Caps
  To balance the growth math with the reality of model error and investor psychology, I propose we adopt a **Fractional Kelly** strategy.

  This acknowledges the Kelly math (we size based on edge) but applies a "safety factor" (engineering margin) to account for Priya's utility objection and our model uncertainty.

  **The Policy:**

  1.  **Sizing Rule:** We will bet **25% of the Full Kelly** recommendation for each position.
      *   *Rationale:* 25% Kelly reduces volatility by roughly 75% compared to Full Kelly, while still capturing about 75% of the expected growth rate. It provides a massive buffer against model overconfidence.
  2.  **Hard Cap:** No single bet may exceed **2% of Total Fund NAV**, regardless of what the Kelly formula says.
      *   *Rationale:* Prevents a model glitch or "black swan" edge calculation from blowing up the fund on a single event.
  3.  **Correlation Limit:** We must aggregate exposure by event/market. If we have 10 bets on the same NFL Sunday, the total risk exposure cannot exceed **10% of NAV**.
      *   *Rationale:* Prevents us from accidentally taking a 50% position on "Football outcomes" because the bot found 50 small +EV lines on the same games.
  4.  **Drawdown Circuit Breaker:** If the fund draws down **15%** from its high-water mark in any calendar month, bet sizing is automatically halved (to 12.5% Kelly) until we recover to the previous high.
      *   *Rationale:* Preserves capital during "cold streaks" or regime changes where the model may be temporarily broken.

  ### 5. Why This Wins
  *   **For the Kelly Camp:** We are still using the Kelly formula as our baseline. We are growing aggressively, just not recklessly.
  *   **For Priya:** We are admitting that Log-Utility is too aggressive for our actual risk tolerance. We are explicitly choosing a different utility curve (one that penalizes drawdowns more heavily).
  *   **For the Fund:** We survive long enough to let the edge play out.

  ### Next Steps
  I need a thumbs-up on this draft by Friday noon so I can finalize the operating agreement appendix.

  If anyone objects, the counter-proposal must include:
  1.  A specific utility function we are optimizing instead of Log-Wealth.
  2.  A stress test showing how that function handles a 3-sigma model error.

  Let's ship this.

  [Your Name]
