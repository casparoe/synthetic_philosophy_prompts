      *   Check the Geanakoplos & Polemarchakis reference. Yes, "We Can't Disagree Forever" (1982).
      *   Check Aumann's "Agreeing to Disagree" (1976).
      *   Make sure to distinguish between "Common Prior Assumption" and subjective priors.

  7.  **Final Review of the "Winner":**
