answer: |-
  This is a classic and high-caliber dispute in the philosophy of social science. You and Theo have both identified the exact fault line that has defined the literature on convention since the 1990s (specifically the clash between the *rationalistic* tradition of Lewis/Gilbert and the *evolutionary/functionalist* tradition of Skyrms/Young/Vanderschraaf).

  Here is the neutral judgment, breaking down the technical structure of Lewis's account, evaluating the evolutionary challenge, and offering a verdict on who is right—and how to fix the definition if needed.

  ### 1. The Structure of Lewis's Account (Beyond the Gloss)
  To judge this, we must be precise about what Lewis is doing. He isn't just describing a pattern of behavior; he is providing a **reductive analysis** to serve a specific philosophical purpose (grounding meaning against Quine).

  Lewis's definition of convention requires a regularity $R$ in a population $P$ such that:
  1.  **Conformity:** Everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Preference (Coordination Equilibrium):** Everyone prefers to conform to $R$ *on the condition* that others do (there is an alternative $R'$ that would have worked).
  4.  **Common Knowledge (CK):** Conditions 1–3 are common knowledge in $P$.

  **The Role of Common Knowledge:**
  You are correct that CK is not just a "add-on." It is the engine that solves the **regress of expectations**.
  *   I conform because I expect you to conform.
  *   But why do I expect you to conform? Because I expect that *you* expect *me* to conform.
  *   Without CK, this chain ($I$ expect that you expect that $I$ expect...) never bottoms out. It remains insecure.
  *   Lewis uses CK to transform this infinite regress into a fixed point of rationality. It ensures that the convention is **self-reproducing via reasoning**, not just via habit or force.

  ### 2. Evaluating Theo's Challenge (The Evolutionary Objection)
  Theo is invoking the "Skyrmsian" critique: Evolutionary Game Theory (EGT) models (like signaling games or stag hunts with replicator dynamics) produce stable equilibria that satisfy Lewis's conditions (1) and (3) (Arbitrariness/Equilibrium) and often (2) in a behavioral sense, **without** satisfying (4) (Common Knowledge) or the cognitive underpinnings of (2).

  **Theo is substantially right.** Here is why your "synchronic" defense fails:
  *   **The Cognitive Gap:** In EGT models, agents are often simple reinforcement learners or even genetic replicators. They do not possess representational states. They do not have "expectations" in the propositional attitude sense Lewis requires. They have *dispositions* to act.
  *   **Synchronic Attribution:** You argued that CK could hold *now* regardless of history. But for CK to hold synchronically, the agents must currently possess the relevant belief states. If the agents are simple Q-learners, attributing "Common Knowledge" to them is not just ignoring their history; it is **anthropomorphizing their current architecture**. It treats a dispositional regularity as a rational agreement.
  *   **The Explanatory Idle Claim:** Theo's strongest point is that if a population can sustain a Lewisian-looking convention (arbitrary, self-perpetuating coordination) without CK, then CK is not *necessary* for the phenomenon of convention. If Lewis insists CK is necessary, he is simply defining away a huge class of social regularities that function exactly like conventions.

  ### 3. Evaluating Your Pushback (The Rationalistic Defense)
  You are not entirely wrong, but your defense works only if we restrict the scope of Lewis's project.
  *   **Meaning vs. Regularity:** Lewis's ultimate goal was to explain **meaning**. He needed conventions to be rational agreements to explain how symbols acquire *normative* force (truth conditions). A mere causal regularity (like bees signaling nectar) might look like a convention, but does it have *meaning* in the Gricean sense?
  *   **The "Cop-out" Charge:** Theo calls your synchronic move a cop-out because it makes the definition unfalsifiable. If we attribute CK to any stable equilibrium regardless of cognitive state, "Common Knowledge" loses its technical meaning and just means "Stable Equilibrium." If that's the case, Lewis's complex epistemic machinery *was* overkill, and Theo wins.

  ### 4. The Verdict
  **Theo wins on the metaphysics of social regularities.** You win on the philosophy of language niche.

  *   **On the concept of "Convention" broadly:** Theo is right. The existence of evolutionary equilibria proves that Common Knowledge is not a necessary condition for a self-perpetuating, arbitrary coordination regularity. Lewis's definition is too intellectualist; it describes a *species* of convention (Rational Conventions), not the *genus*.
  *   **On the project of "Meaning":** You have a foothold. Lewis might argue that while EGT produces *proto-conventions*, only CK-backed conventions can support the specific normative properties required for linguistic meaning (e.g., the ability to lie, to be mistaken, to reason about usage).

  However, since your debate was about Lewis's analysis of *Convention* (the book/title concept), **Theo has the stronger argument.** Lewis claimed to be analyzing the general concept, and EGT shows his analysis is too narrow.

  ### 5. The Smallest Fix (Patching the Definition)
  If you want to save the Lewisian framework without conceding the whole game to Theo, you cannot keep the strict Common Knowledge requirement. Here is the minimal revision required to accommodate the evolutionary data while keeping the spirit of Lewis:

  **The Fix: Replace "Common Knowledge" with "Common Reason to Believe" (grounded in Salience/History).**

  Lewis actually hints at this, but he ties it too tightly to rational deduction. The fix is to decouple the *justification* for the expectation from the *cognitive processing* of that justification.

  **Revised Condition 4:**
  > It is common knowledge (or common belief) in $P$ that there is a **reliable indicator** (salience, precedent, or historical stability) that supports the expectation of conformity.

  **Why this works:**
  1.  **Accommodates EGT:** In evolutionary models, the "history of play" serves as the reliable indicator. Agents don't need to reason about *why* it works; they just need to track the indicator. The "Common Knowledge" is not about the *reasoning*, but about the *availability of the signal*.
  2.  **Solves the Regress:** The regress stops not at "I know that you know," but at "We both see the same precedent." This aligns with Bacharach's and Sugden's work on *team reasoning* and *frame salience*.
  3.  **Preserves Normativity:** It keeps the expectation condition (Condition 2) but allows that expectation to be dispositional rather than explicitly representational.

  **Alternatively (The Skyrms Compromise):**
  Adopt a two-tiered vocabulary.
  1.  **Conventions (Lewisian):** Require Common Knowledge and rational expectation. (Reserved for linguistic/normative contexts).
  2.  **Signaling Systems / Social Equilibria (Skyrmsian):** Require only stability and arbitrariness via dynamic processes.

  ### Summary for the Argument
  Tell Theo: "You're right that CK isn't necessary for *stability* or *arbitrary regularity*. Evolutionary models prove Lewis's definition is too narrow for the general social scientific concept."

  Tell yourself: "But Lewis wasn't just describing stability; he was describing the *rational basis* of meaning. If we want to explain why 'dog' means dog and not cat, mere reinforcement isn't enough; we need the expectation structure."

  **Final Ruling:** Theo is right that Lewis's definition fails as a general analysis of social conventions. The Common Knowledge clause is the breaking point. The smallest fix is to weaken CK to **Common Belief grounded in Salient Precedent**, allowing the belief to be dispositional rather than explicitly representational. This saves the equilibrium structure without requiring agents to be infinite regress-stopping logicians.
