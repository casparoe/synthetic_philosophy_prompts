          4.  There is an alternative regularity $R'$ that could have solved the coordination problem instead (Arbitrariness).
          5.  Conditions 1-4 are *Common Knowledge* in $P$.
      *   **The Role of CK:** Lewis needs CK to solve the regress of expectations ("I expect that you expect that I expect..."). Without CK, the reasoning chain never bottoms out, and the equilibrium isn't secure.
      *   **The Goal:** Lewis is analyzing the *concept* of convention to ground meaning (Gricean project). He needs agents to be *reasoning* in a specific way to support normativity and meaning.

