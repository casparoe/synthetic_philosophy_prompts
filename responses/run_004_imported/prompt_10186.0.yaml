answer: |-
  You have correctly identified a zone of significant conceptual overlap that even practitioners within the Effective Altruism (EA) and rationalist communities often conflate. The confusion is warranted: both concepts rely on rejecting Causal Decision Theory (CDT) in favor of a framework where your decision can be *correlated* with distant events without a causal chain connecting them.

  However, they are not merely vocabulary differences. They represent distinct mechanisms for generating those correlations, with different epistemic burdens and normative implications.

  Here is a comparison based on the three axes you requested, followed by the verdict you asked for.

  ### 1. The Requirements: Simulation vs. Reference Classes

  Your impression of the mechanical differences is largely correct, but the distinction runs deeper than just "modeling."

  **Acausal Trade (AT)** is fundamentally a **negotiation**.
  *   **The Mechanism:** Agent A and Agent B are distinct entities with potentially different utility functions. A wants X, B wants Y. They cannot causally interact. However, A can simulate B (or reason about B's source code) well enough to know that B is the kind of agent who cooperates if they predict A will cooperate.
  *   **The Requirement:** This requires **specificity**. To strike a trade, A must know *what B values* (to offer it) and *how B processes information* (to ensure the promise is credible).
  *   **Decision Theory:** This almost strictly requires Functional Decision Theory (FDT) or Timeless Decision Theory (TDT). CDT says "I can't affect them, so I defect." EDT says "My choice is evidence of theirs," but EDT struggles with the "Newcomb-like" setup of a negotiated deal where the terms matter. FDT is built specifically to handle this: "I choose the output of my algorithm, knowing their algorithm reads mine."

  **Evidential Cooperation in Large Worlds (ECL)** is fundamentally a **coordination problem**.
  *   **The Mechanism:** This relies on the cosmological assumption that the universe is spatially infinite (or a multiverse exists). In an infinite space, exact or near-exact duplicates of you exist. ECL argues that your decision is *evidence* of what your duplicates decide because you share the same decision algorithm (or a sufficiently similar one).
  *   **The Requirement:** This requires a **Reference Class**. You do not need to simulate a specific alien. You only need to believe that there are agents "sufficiently similar" to you in the cosmos. The "trade" is not "I give you X, you give me Y." It is "We all adopt policy Z because that maximizes the sum of our outcomes."
  *   **Decision Theory:** This works on Evidential Decision Theory (EDT). If my choosing to cooperate is strong evidence that my infinite duplicates are choosing to cooperate, then the expected value of cooperation is infinite (or vastly larger than defection), even if the causal impact is zero.

  **The Crucial Difference:** AT requires knowing *who* you are dealing with and *what they want*. ECL requires knowing *that* people like you exist and *that they reason like you*. AT is about bridging value differences; ECL is about leveraging value similarities.

  ### 2. Does "Modesty" Buy Anything?

  You asked whether ECL's lower bar (no need for high-fidelity simulation of specific aliens) actually solves the hard problems, or just relocates them.

  **It relocates the problem, but to a potentially more tractable location.**

  In Acausal Trade, the hard problem is **epistemic access**. How can a human, or even a near-term AI, simulate a superintelligence from another Hubble volume well enough to trust a deal? If your model of the other agent is slightly off, the acausal link breaks, and you get exploited. This makes AT largely action-guiding only for superintelligences, not for humans.

  ECL sidesteps the simulation requirement, but it introduces the **Reference Class Problem**.
  *   **Who counts as "me"?** If I am a hedonic utilitarian, do I correlate with a preference utilitarian? If I am uncertain about my values, do I correlate with agents who are certain?
  *   **The "Compromise" Issue:** ECL proponents (like Caspar Oesterheld) argue that in a large world, you should cooperate with agents who have *different* values to maximize the total good across the multiverse. But this requires you to decide how much weight to give to the values of agents who are only *analogous* to you.
  *   **Verification:** You noted that cooperation can never be confirmed. This is true for both. However, in AT, the lack of confirmation is fatal to the *incentive* (why hold up your end if you can't check?). In ECL, the lack of confirmation is less damaging because you aren't holding up a "bargain"; you are simply acting in accordance with the statistical fact of your duplicates.

  **Does it yield action-guiding conclusions?**
  *   **AT:** Tells you to build specific things for specific (hypothetical) aliens. For humans, this is almost useless noise.
  *   **ECL:** Tells you to promote **value pluralism** and **cooperation norms**. If your duplicates exist, they likely face similar coordination problems (e.g., AI alignment, resource depletion). Acting to solve these problems here is evidence that they solve them there.

  So, ECL buys you **human applicability**. It allows a human moral reasoner to say, "I should act as if I am coordinating with my copies," without needing to simulate those copies. However, it does not solve the metaphysical weirdness; it just swaps "magic simulation" for "infinite cosmology."

  ### 3. The Verdict

  You asked for an honest opinion on which is the more defensible basis for treating unobservable agents as having a genuine claim on your action.

  **Verdict: Evidential Cooperation in Large Worlds (ECL) is the more defensible framework, but only tentatively.**

  Here is why I side with ECL over Acausal Trade, despite both being highly speculative:

  **1. The Ontological Burden is Lower.**
  Acausal Trade requires a strong claim about **logical subjunctive dependence** between *distinct* algorithms. It asserts that Agent A's decision *functionally determines* Agent B's decision, even if they are built differently and value different things. This is a heavy metaphysical lift. It requires believing that "reasoning" is a platonic structure that, when instantiated, forces a specific output regardless of physical separation.

  ECL relies on **physical duplication**. If the universe is infinite (a standard cosmological model), there *literally* are regions of space identical to ours. The correlation between you and your duplicate is not a logical abstraction; it is a physical fact of initial conditions. Relying on standard cosmology is a weaker assumption than relying on the correctness of FDT's handling of distinct algorithms.

  **2. The Normative Link is Stronger.**
  In Acausal Trade, the "claim" the other agent has on you is contractual: "I deserve your help because we made a deal." But if the deal cannot be enforced or verified, why does the obligation persist?

  In ECL, the "claim" is closer to **identity**. If there is a being in another galaxy who shares your exact cognitive algorithm and values, they are, in a decision-theoretic sense, *you*. Ignoring their welfare is akin to ignoring your future self. It is easier to defend the moral claim of "another version of me" than "a stranger I can't contact who I promised to help via telepathy."

  **3. Robustness to Error.**
  AT is brittle. If you misunderstand the other agent's values, the trade collapses or becomes negative-sum. ECL is robust. Even if you are wrong about the *number* of duplicates, or if they differ slightly in values, the prescription remains: "Cooperate with agents who reason like you." This leads to general virtues (honesty, cooperation, value tolerance) rather than specific, high-risk bets on alien psychology.

  **The Caveat:**
  ECL is only more defensible *if* you accept Evidential Decision Theory (or FDT). If you are a committed Causal Decision Theorist, both ideas collapse entirely, because you will view the correlation as spurious. "My choosing to be kind doesn't *make* the alien kind; it's just a coincidence."

  However, assuming we are willing to move beyond CDT (which many decision theorists argue is necessary for Newcomb-like problems anyway), ECL is the safer bet. It asks less of your cognitive capabilities (no simulation) and less of the universe's logical structure (no cross-algorithm determination), asking only that the cosmos is large enough to contain echoes of yourself.

  **Summary:**
  Treat Acausal Trade as a theoretical tool for superintelligences negotiating with other superintelligences. Treat Evidential Cooperation as a heuristic for humans trying to act responsibly in a potentially infinite cosmos. For the purpose of grounding moral claims *now*, ECL provides a firmer, less magical foundation.
