answer: |-
  Here are 8 conversational but probing questions for your Q&A. I've included the specific topics you requested plus a few others that tend to generate lively discussion in this area.

  ### 1. The "Ignorant High-Stakes" Case
  "I want to press on the subject's awareness of the stakes. Imagine a subject who is objectively in a high-stakes situation—say, a bridge is unsafe and their life depends on it—but they have no idea; they think it's a low-stakes game. On your view, do they know the bridge is safe? If you say 'no' because the objective stakes are high, it feels like you're making knowledge depend on facts totally outside their cognitive reach. But if you say 'yes' because *they* think the stakes are low, aren't you just smuggling in their beliefs about the stakes rather than the stakes themselves?"

  *   **Likely Answer:** She'll likely say knowledge depends on the *practical situation* the subject is actually in, not what they believe about it (factive view of stakes).
  *   **Follow-up:** "If it's factive, doesn't that make knowledge opaque to the subject? They can't tell if they know without knowing all the facts about their future?"

  ### 2. The Contextualism Distinction
  "Half the audience is probably leaving thinking this is just DeRose-style contextualism with a different name, since both views predict the same verdicts on the Bank Cases. Can you give us the hard line? Is the difference just that you think the *subject's* context changes the knowledge state, while contextualists think the *attributor's* context changes the meaning of the word 'knows'? And if so, is there any empirical test that could distinguish them?"

  *   **Likely Answer:** She will emphasize that Contextualism changes the *semantics* of 'knows' based on the speaker, while Encroachment changes the *metaphysics* of knowledge based on the subject.
  *   **Follow-up:** "But if the truth-conditions of knowledge ascriptions end up looking the same in practice, does the metaphysical distinction do any work for us?"

  ### 3. The Sorites & Skepticism Worry
  "If practical stakes determine knowledge, it seems like we're on a slippery slope to skepticism. As stakes rise, evidence requirements rise. Is there a point where the stakes are so high that no amount of evidence counts as knowledge? And if there isn't a sharp cutoff, aren't we just importing a Sorites paradox into the concept of knowledge? How do we act if we're in that borderline zone where stakes are rising but knowledge is fading?"

  *   **Likely Answer:** She'll likely deny skepticism by arguing everyday stakes are low enough, and accept vagueness (there is no sharp cutoff for 'knows').
  *   **Follow-up:** "If 'knows' is vague, does that mean the norm of action is vague? Can I be both permitted and forbidden to act on a belief in the borderline case?"

  ### 4. Moral Encroachment
  "There's been a lot of buzz lately about 'moral encroachment'—the idea that the moral costs of being wrong can raise the evidence bar for belief. Do you see that as a natural extension of your view, where moral stakes are just a subset of practical stakes? Or do you want to resist that, and if so, on what grounds? Some worry that moral encroachment politicizes epistemology in a way standard pragmatic encroachment doesn't."

  *   **Likely Answer:** Most encroachers are friendly to this, arguing moral harms *are* practical harms. Some resist, arguing epistemology should be distinct from ethics.
  *   **Follow-up:** "If they are the same, does holding a stereotype without sufficient evidence constitute a knowledge failure, or just a moral one? Where's the line?"

  ### 5. The Action-Knowledge Link
  "Your view seems to lean heavily on the idea that you should only act on what you know. But sometimes we rationally act on mere belief when the stakes are low—like checking the stove once before leaving. If we loosen the link between knowledge and action, does the motivation for encroachment disappear? Do we need the 'Knowledge Norm of Action' to be true for your view to get off the ground?"

  *   **Likely Answer:** She will likely defend a version of the Knowledge Norm (you ought to act only on what you know) or a Reason Norm (knowledge provides the right kind of reason).
  *   **Follow-up:** "If the norm is 'act on what you know,' does that mean acting on high-probability belief in low-stakes cases is technically irrational, just excusable?"

  ### 6. Testimony and Whose Stakes Count
  "I'm curious how this plays out in testimony. If I tell you something, does the evidence bar depend on my stakes, your stakes, or both? If I'm in a low-stakes context and tell you a fact, but you're in a high-stakes context, do I fail to transmit knowledge to you? It feels odd that my testimony could be 'good enough' for me but 'not knowledge' for you."

  *   **Likely Answer:** Standard view is that the *receiver's* stakes determine whether they acquire knowledge from the testimony.
  *   **Follow-up:** "Does that make testimony unreliable? I might think I'm informing you, but unbeknownst to me, your high stakes block the transfer."

  ### 7. Cognitive Load
  "One worry I have is about cognitive load. If whether I know something depends on the practical stakes, do I need to calculate the stakes before I can know if I know? It seems like to check if I know, I first need to know how much is at stake. Doesn't this create a regress or just make knowing far too demanding for ordinary agents?"

  *   **Likely Answer:** She'll argue stakes are usually salient and obvious, not a result of complex calculation. It's part of the background context.
  *   **Follow-up:** "But in novel situations, wouldn't I have to pause and assess the stakes before I can claim to know anything? That seems psychologically unrealistic."

  ### 8. The "Intellectualist" Intuition
  "Finally, a lot of the resistance to your view comes from the intuition that knowledge is purely about truth and evidence—what some call 'Intellectualism.' People feel that stakes *shouldn't* matter. How do you explain away that intuition? Is it just a confusion about the word 'knows,' or do you think people are misdescribing their own epistemic states?"

  *   **Likely Answer:** She'll likely argue the intuition comes from focusing on standard/low-stakes contexts where stakes are invisible, or confusing knowledge with evidence.
  *   **Follow-up:** "So is the Intellectualist intuition a kind of illusion generated by the fact that most of our philosophical examples are low-stakes?"
