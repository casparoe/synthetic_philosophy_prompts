answer: |-
  This is a sophisticated dispute that cuts to the heart of how Anscombe's early polemics relate to her systematic moral philosophy. To adjudicate between you and your friend, we need to distinguish between the *vocabulary* Anscombe uses (which is indeed that of traditional Catholic casuistry and the Doctrine of Double Effect) and the *logical work* that vocabulary is doing in the text.

  Your friend is correct that Anscombe employs the structure of the Doctrine of Double Effect (DDE). However, you are correct that the pamphlet is not a "clean application" of a standard DDE analysis. Rather, it is a **rigorist intervention** that tightens the definitions within the DDE (particularly regarding intention) and effectively nullifies one of its conditions (proportionality) based on prior commitments about the absolute nature of certain prohibitions.

  Here is an adjudication based on the structure of her argument relative to the four standard conditions of the DDE.

  ### 1. The Nature of the Act (Intrinsic Wrongness)
  **Standard DDE:** The act itself must be morally good or neutral.
  **Anscombe's Argument:** She argues that the bombing of Hiroshima and Nagasaki was the deliberate killing of the innocent. In the Natural Law tradition, this is *malum in se* (evil in itself).

  **Verdict:** **Clean Application.**
  Here, your friend is right. Anscombe is operating within standard Natural Law parameters. She does not invent a new category of wrongness here; she relies on the traditional prohibition against the direct killing of non-combatants. There is no philosophical sleight of hand at this stage; she is asserting a premise shared by the tradition she is invoking.

  ### 2. Intention and Foresight
  **Standard DDE:** The agent must intend only the good effect; the bad effect must be merely foreseen, not intended.
  **Anscombe's Argument:** This is the crux of your disagreement. A standard casuistical application of DDE often involves a nuanced inquiry into the psychological state of the agent: *Did* Truman wake up wanting civilians dead, or did he want surrender and accept death as a cost? A "clean" application usually allows for the possibility that massive civilian death could be a foreseen side-effect of targeting military infrastructure (even if the line is blurry).

  Anscombe, however, collapses this distinction. She argues that because the *strategy* relied on the destruction of the cities to produce the psychological shock necessary for surrender, the destruction was not a side-effect; it was the means. Therefore, it was intended.

  **Verdict:** **Tightening the Definition (You are correct).**
  Anscombe is doing extra philosophical work here. She is applying what we might call an **objective theory of intention**. She is not interested in Truman's internal psychological state (which is unknowable); she is interested in the structure of the choice. If the plan *requires* the bad effect to achieve the good end, Anscombe classifies it as intended.
  This goes beyond a "standard" DDE application, which often permits agents to claim they merely "foresaw" the bad outcome to salvage the morality of the act. Anscombe refuses to let the "foresight" loophole remain open when the bad effect is the mechanism of the policy. This anticipates her later work in *Intention* (1957), where she argues that intention is found in the description of the action under which it is chosen, not in hidden mental feelings. She substitutes moral certainty about the *act's description* for the interpretive work of probing the agent's psyche.

  ### 3. The Means Condition
  **Standard DDE:** The bad effect must not be the means by which the good effect is produced.
  **Anscombe's Argument:** She argues that the terror and destruction *were* the means to the surrender.

  **Verdict:** **Clean Application (contingent on the Intention verdict).**
  If one accepts her tightened definition of intention above, this condition follows directly. However, a standard DDE analysis might argue that the *military capacity* was the means, and the *civilian death* was the side effect. Anscombe preempts this by defining the target as the "population" rather than the "industry." This is a factual/strategic claim she treats as self-evident. She bypasses the debate about whether the factories were the target by asserting that the method of bombing (area bombing) made the civilians the target. This is less a DDE calculation and more a strategic assertion treated as a moral premise.

  ### 4. Proportionality
  **Standard DDE:** There must be a proportionate reason for allowing the bad effect (the good must outweigh the bad).
  **Anscombe's Argument:** This is where your argument is strongest. In a standard DDE analysis, proportionality is the weighing scale. Even if an act has negative features, it might be permissible if the good consequence is sufficiently weighty (e.g., saving more lives than are lost). Defenders of the bombing argue exactly this: the bombing ended the war and saved lives that would have been lost in an invasion.

  Anscombe effectively **dismisses this condition**. She does not engage in a utilitarian calculus of lives saved vs. lives lost. She argues that because the act is intrinsically murderous (failing conditions 1, 2, and 3), the question of proportionality does not arise. You cannot balance murder against good consequences.

  **Verdict:** **Substituting Moral Certainty (You are correct).**
  A "clean" DDE application would engage with the proportionality claim, even if only to reject it. Anscombe's move is to say that for certain acts (murder of innocents), the proportionality condition is void. This is an **absolutist** commitment, not a **proportionalist** one. While compatible with a rigorous reading of Natural Law, it is not a standard application of the DDE, which is typically designed precisely to handle cases where proportionality *is* the deciding factor. By removing the scale, she is signaling that the DDE is not a tool for justification here, but a tool for condemnation.

  ### The Broader Diagnosis: Consequentialism
  You noted that she diagnoses a "corruption of moral thinking." This is the key to the pamphlet's structure.

  If this were merely a DDE application, the argument would be: *Truman violated condition X, therefore the act was wrong.*
  But Anscombe's argument is: *The fact that people think condition Y (proportionality) could justify this shows their moral language is corrupted.*

  She is not just judging Truman; she is judging the **ethical framework** that allows Truman to be judged by consequences. She writes that the proponents of the bombing are reasoning that "murder is all right provided it is done by the right people for the right reasons." This is the seed of her 1958 critique of "consequentialism." She is arguing that the DDE is being weaponized by a mindset that actually rejects the DDE's core premise (that some acts are forbidden regardless of consequences).

  Therefore, the pamphlet is not using DDE to solve a hard case; it is using the hard case to expose that the opposing side is not actually playing by DDE rules, but by utilitarian ones.

  ### Conclusion
  Your friend is right that Anscombe uses the **vocabulary** of the Doctrine of Double Effect. However, you are right that the pamphlet is **not a clean application** of that doctrine.

  A clean application treats the DDE conditions as a test to be worked through, acknowledging ambiguities in intention and weighing proportionality. Anscombe's argument structure bypasses these ambiguities:
  1.  **On Intention:** She adopts an objective/structural view of intention that closes the "foresight" loophole tighter than standard casuistry.
  2.  **On Proportionality:** She treats the prohibition on murder as absolute, rendering the proportionality condition irrelevant rather than weighing it.
  3.  **On Method:** She uses the argument to diagnose a systemic error in modern moral reasoning (consequentialism) rather than simply adjudicating a specific act.

  **Verdict:** "Mr. Truman's Degree" is best read as a piece that **borrows the doctrine's vocabulary while being driven by commitments of Anscombe's own that go beyond it.** It is a proto-*Modern Moral Philosophy* document. She uses the DDE not as a flexible tool for casuistry, but as a rigid boundary marker to demonstrate that the "consequentialist" mindset has no place in serious moral thought. She is not applying the rules of the game; she is arguing that her opponents are playing a different game entirely.
