      *   **The Setup (The Tree):** They need to draw the game. Let's keep it simple (4 nodes). Define payoffs roughly (Take = $(n, n-1)$, Pass = grows).
      *   **The Core Conflict (The First Move):**
          *   Marcus: If P1 passes, P2 knows P1 isn't playing BI. So CKR is false. How can P2 play BI?
