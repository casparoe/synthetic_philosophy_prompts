          *   Marcus needs to hit the "impossible world" problem. If I am *at* node 2, I know P1 didn't take. To believe P1 is rational, I must believe P1 made a mistake. But if mistakes are possible, BI collapses.
      *   **The "Knowledge" Definition:**
          *   Elena: Knowledge is partition-based. $K_i E$. If $\omega$ is the true state, and at $\omega$ P1 passes, does that contradict Rationality? No, because Rationality is defined over the strategy, not the realized path alone. Wait, Aumann's specific point is that rationality is maximizing *given beliefs*.
          *   Correction: Aumann's 1995 paper argues that CKR + Perfect Information $\rightarrow$ BI. The trick is how counterfactuals are handled.
          *   Marcus: The problem is *belief revision*. If I see a pass, my posterior beliefs change. Aumann assumes the prior holds fixed or that the deviation is "tremble-free" but logically possible.
      *   **The "Tremble" vs. "Rational Deviation" distinction:**
