      *   *Did he co-found activist groups?* He was very active in the Anti-Nazi League and Campaign for Nuclear Disarmament, but specifically on race/immigration, he was a founding member of the *Joint Council for the Welfare of Immigrants* (JCWI) in 1967. Important detail to get right.
      *   *Is the friend's skepticism justified?* Yes. Philosophers get twitchy when people derive normative conclusions directly from metaphysical premises without intermediate ethical steps.
      *   *Key Concept:* "Recognition-transcendence." Dummett hates truth that transcends our ability to know it. He also hates political exclusion that transcends human empathy/justification.

