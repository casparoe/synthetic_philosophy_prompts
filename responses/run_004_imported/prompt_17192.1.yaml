      *   *Nuance on FNC:* FNC is often seen as converging with SIA in "large world" scenarios. I need to be careful not to present it as a magic bullet.
      *   *Tone Check:* Ensure I'm not giving philosophical advice as *truth*, but as *landscape mapping*. The student needs to make the argument, not me.
      *   *Specific Terminology:* Ensure correct use of "indexical," "non-indexical," "reference class," "Bayesian update."

  7.  **Final Structure:**
