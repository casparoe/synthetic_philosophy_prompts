answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees, The Kestrel Prize
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal Regarding the Arts Council's "Readers' Choice" Condition

  **1. Context and Stakes**

  As we prepare to finalize the rules for the upcoming cycle, we face a critical decision regarding the Arts Council's condition for funding renewal: the introduction of a "Readers' Choice" award, determined by online public vote, to run alongside the jury's selection.

  I am writing this memo to clarify my own thinking and to offer a framework for our discussion in three weeks' time. We are evenly split. Two of us see the vote as a necessary adaptation to the market, a way to secure funding and drive sales for our independent authors. Two of us view it as a capitulation that exposes writers to harassment and reduces literary merit to popularity. As the deciding vote, I owe it to you to explain not just *how* I intend to vote, but *why*.

  **2. The Arguments Before Us**

  We must acknowledge the strength of both positions.

  Those in favour argue that the prize cannot exist without funding, and that the Council's demand for "engagement" is reasonable. In an era where debut novels struggle for visibility, a public vote generates traffic, social media traction, and potentially sales. To refuse is to risk the prize's survival on principle, which helps no author.

  Those against argue that an open vote invites vote-brigading by agencies or online factions. More dangerously, it exposes shortlisted writers to the volatility of internet controversy, where a writer's past or persona may be judged more harshly than their text. Fundamentally, it suggests that literary quality is a matter of headcount.

  Both sides want the same thing: the flourishing of debut fiction. We disagree on whether a public vote is a tool for that flourishing or an obstacle to it.

  **3. The Nature of "The Public"**

  To resolve this, I have been reflecting on the nature of judgment itself, specifically through Søren Kierkegaard's analysis in *Two Ages*. While his context was 1840s Copenhagen, his distinction between a "people" and a "public" is vital for us.

  Kierkegaard argues that a **people** or an **assembly** is a concrete body. In a congregation or a town hall, individuals stand physically present; they are answerable to one another. If I raise my hand in an assembly, I own that vote. I can be challenged. My judgment is tied to my character and my relationship with my neighbours.

  **The Public**, by contrast, is an abstraction. It is a phantom. It is a number without a face. In a public, no one is responsible. An online poll is the perfect engine for this: a voter clicks a button in isolation, accountable to no one, influenced by headlines they haven't read, swayed by algorithms they don't see.

  Kierkegaard warns that when the press (or today, social media) manufactures opinion for this abstract public, it produces **leveling**. Leveling is the process by which genuine distinction—quality, nuance, difficulty—is flattened into what is merely noticeable. The public does not judge; it reacts. It amplifies the loud and silences the complex.

  If we institute a Readers' Choice *Award*, we are not democratizing judgment; we are institutionalizing the abstract public. We are telling our authors that their work will be weighed by a mechanism designed to remove responsibility from the weigher.

  **4. The Institutional Complication**

  Here, however, we must confront a difficulty. Kierkegaard was deeply skeptical that any institution could legislate its way out of leveling. For him, the remedy to the age of the public was the "single individual" turning inward to find ethical and religious grounding. He would likely view this memo as a futile attempt to fix a spiritual malady with administrative rules. He might say that a prize board cannot stop the age of leveling; it can only refuse to participate in it.

  So, what is left for a board like ours to do? We cannot stop the internet. We cannot force the Arts Council to be wiser. But we can determine what *we* are.

  We are not a platform; we are a jury. We are a small, concrete association. We know each other's names. We read the books. We argue, we compromise, and we sign our names to the decision. We are answerable for the Kestrel Prize. If we add a public vote as a co-equal award, we dilute that responsibility. We hide behind the "public" to share the blame if the choice is unpopular, or to claim credit if it is a success.

  **5. Recommendation**

  I recommend that we **reject the introduction of a Readers' Choice Award.**

  To be clear: I do not recommend we reject the Arts Council's goal of engagement. We can—and should—propose a **Readers' Engagement Fund** as an alternative condition.

  Instead of asking the public to *judge* (which creates the abstract, leveling public), we ask them to *participate* (which creates a concrete community). We use the funding to host reader events, subsidize book club copies, or run featured excerpts on our site. We boost sales and profile, satisfying the Council's metrics, without handing the gavel to a phantom.

  **6. Addressing the Risks**

  I know this recommendation carries risk. The Council may dig in. There is a possibility they withhold funding. To the trustees who favour the vote: I hear your concern that a principled stand is useless if the prize folds. But if we accept the vote, we secure funding for a prize that has ceased to mean what it claimed to mean. We would be saving the shell while emptying the core.

  To the trustees who oppose the vote: I share your fear for the authors. But we must not simply say "no." We must offer the Council a viable alternative that meets their need for "impact" without violating our integrity. We must show them that engagement does not require leveling.

  **7. Conclusion**

  Kierkegaard suggests that in an age of leveling, the only salvation is for individuals to take responsibility for their own actions. As a board, we are five individuals. We cannot control the "public" out there. But we can control whether we invite it into our house.

  Let us remain a concrete association. Let us take responsibility for the Kestrel Prize ourselves, rather than outsourcing our judgment to a crowd that owes us nothing.

  I look forward to discussing this further at our meeting.
