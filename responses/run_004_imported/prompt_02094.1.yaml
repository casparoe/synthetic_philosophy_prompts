answer: |-
  This is one of the best questions in decision theory because it cuts through the math to the philosophy of what "value" actually means. You're right to be suspicious: the coin flips and payoffs are physically fixed. Why should the order in which a mathematician writes down a sum change whether you should take the bet?

  Here is the intuitive breakdown of why the Pasadena Game is considered a "harder" problem than St. Petersburg, and why summation order isn't just a math trick—it represents a structural failure in how we define value.

  ### 1. The Core Distinction: $\infty$ vs. $\infty - \infty$

  The easiest way to intuit the difference between St. Petersburg and Pasadena is to look at how Expected Value (EV) is actually constructed from positive and negative parts.

  Expected Value is essentially:
  $$ \text{Total Good} - \text{Total Bad} $$

  *   **St. Petersburg:** The payoffs are all positive.
      *   Total Good = $+\infty$
      *   Total Bad = $0$
      *   **EV = $\infty - 0 = \infty$**
      *   *Decision Theoretic Verdict:* This is crazy, but it's **directional**. The gamble strictly dominates any finite amount of cash. If you maximize EV, you *must* play, regardless of the entry fee (as long as it's finite). The theory gives you a clear, albeit absurd, instruction: **GO.**

  *   **Pasadena:** The payoffs alternate positive and negative.
      *   Total Good (sum of positive terms) = $+\infty$
      *   Total Bad (sum of negative terms) = $-\infty$
      *   **EV = $\infty - \infty = \text{Undefined}$**
      *   *Decision Theoretic Verdict:* The theory gives **NO instruction**. It cannot tell you if the gamble is better than \$0, better than \$1 million, or worse than death.

  **Why this matters for a single play:**
  Decision theory relies on preference orderings. We need to know if $Gamble > \$5$ or $Gamble < \$5$.
  With St. Petersburg, the math says $Gamble > \$5$ (because $\infty > 5$).
  With Pasadena, the math says "I cannot compare them." It's not that the value is unknown; it's that the value *does not exist* within the standard framework. A map that says "You Are Here" is useful. A map that says "This Location Is Not On The Map" leaves you paralyzed.

  ### 2. Why Summation Order Isn't Arbitrary

  You asked: *"The payoffs and their probabilities are completely fixed no matter what order I happen to add them up in my own head."*

  This is the crux. In finite math, you are right. In infinite decision theory, **"Summation Order" maps to "How we group the risk."**

  When we calculate EV for an infinite gamble, we are essentially taking a limit of finite partial sums. We are asking: "If we truncate the game at outcome $N$, what is the value, and where does that value go as $N \to \infty$?"

  *   **Natural Order ($n=1, 2, 3...$):** This corresponds to grouping outcomes by how soon they happen. This yields $\ln(2)$.
  *   **Rearranged Order:** This corresponds to a different way of grouping the possibilities.

  Why does grouping matter? Because in the Pasadena game, the **variance is infinite**. The swings in payoff grow faster than the probability shrinks.

  Imagine you are a casino offering this game.
  *   If you group the bets by "First 100 flips, Next 100 flips," your ledger looks one way.
  *   If you group the bets by "All wins first, then all losses," your ledger looks different.

  In a normal gamble (finite variance), the Law of Large Numbers guarantees that no matter how you group the bets, the average converges to the same number. In Pasadena, the "noise" (the magnitude of the payoffs) is so loud that it drowns out the "signal" (the probabilities). The "average" never settles down.

  So, the "arbitrary summation order" isn't about you writing numbers on paper; it's about the fact that **there is no stable long-run frequency** that the game converges to. If you played the Pasadena game a trillion times, your average payoff per game wouldn't settle on a number. It would keep drifting depending on which specific rare outcomes happened to land in that trillion.

  ### 3. Why "Undefined" is Worse Than "Infinite"

  You asked why people treat "undefined" as a worse verdict than "infinite."

  **Infinite EV is a "Super-Value."**
  It acts like a trump card. If Option A has EV = $\infty$ and Option B has EV = $1,000,000$, you choose A. It preserves the *structure* of rational choice (transitivity, dominance), even if the numbers break our brains.

  **Undefined EV is a "Black Hole."**
  It destroys the structure of rational choice.
  *   **Dominance Fails:** Does the Pasadena game dominate receiving \$0 for sure? No. Depending on how you evaluate the series, the EV could be $-100$.
  *   **Transitivity Fails:** You might find a sequence of reasoning that says $A > B$, and another that says $B > A$.
  *   **Money Pumps:** If your preferences aren't well-ordered because the value is undefined, a clever opponent can theoretically construct a money pump against you (though this is technical, the intuition is that you can't consistently price the ticket).

  **The Intuitive Analogy:**
  *   **St. Petersburg** is like being offered a ticket to a lottery where the jackpot is "All the money in the universe plus one more dollar." It's absurd, but you know you want the ticket.
  *   **Pasadena** is like being offered a ticket where the contract says: *"Your winnings will be calculated by an accountant who hasn't decided which order to process the receipts in yet. Depending on their mood, you will either win everything or lose everything."*
      *   Even if the "natural" order says you win $\ln(2)$, the fact that the *mathematical definition* allows for other values means the contract is legally void. You can't sign a contract where the price is $\infty - \infty$.

  ### 4. The "Single Play" Intuition

  Finally, to address your specific worry about the **single play**:

  If you play once, you get one specific outcome. Why do we care about the series sum?

  We care because **Expected Value is the tool we use to equate a risky gamble to a certain amount of cash.**
  To decide whether to play, you implicitly ask: "What is the cash equivalent of this ticket?"
  *   If EV = $\infty$, the cash equivalent is "More than any finite amount." (Decision: Play).
  *   If EV = Undefined, there **is no cash equivalent**.

  There is no amount of money $X$ such that you should be indifferent between "Play Pasadena" and "Take $X$."
  *   If you pick $X = \$10$, the math can be rearranged to show the game is worth $-\$100$ (so take the cash).
  *   If you pick $X = -\$10$, the math can be rearranged to show the game is worth $+\$100$ (so play the game).

  Because the "fair price" doesn't exist, standard decision theory cannot tell you what to do. It's not that the *outcome* is ambiguous; it's that the *valuation metric* is broken.

  ### Summary

  1.  **St. Petersburg** has **Infinite EV** ($\infty - 0$). It breaks our intuition about wealth, but it preserves decision theory's ability to rank options (Infinite > Finite).
  2.  **Pasadena** has **Undefined EV** ($\infty - \infty$). It breaks decision theory's ability to rank options at all. It creates a gap in the preference ordering.
  3.  **Summation Order** matters because it represents the lack of a stable limit. In normal gambles, the "average" converges regardless of how you slice it. In Pasadena, the variance is so high that the "average" depends on the slicing.
  4.  **For a single play:** It matters because you cannot assign a "cash equivalent" value to the ticket. You cannot say if the ticket is an asset or a liability, because the mathematical definition of "value" yields no result.

  The Pasadena Game shows that Expected Utility Theory isn't just "sometimes wrong about big numbers"; it is **incomplete**. It literally cannot assign a value to certain well-defined gambles. That is why it keeps decision theorists up at night more than St. Petersburg does. St. Petersburg says "Maximize this!" Pasadena says "I don't know what 'this' is."
