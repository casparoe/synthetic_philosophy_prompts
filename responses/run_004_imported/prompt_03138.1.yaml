answer: |-
  **Setting:** *The Metro Diner, 2:00 PM. The fluorescent lights hum. A half-empty pot of coffee sits between them.*

  **Characters:**
  *   **Alex:** Universalist. (Sider/Lewis leanings). Wearing a blazer over a t-shirt.
  *   **Ben:** Organicist. (van Inwagen defender). Wearing a rumpled oxford.

  *(The waitress sets the plates down. Ben has the pan-seared trout. Alex has the turkey club, cut diagonally.)*

  **Alex:** Look at that. A perfect example of unrestricted composition.

  **Ben:** *(Picking up a fork)* If you mean the trout, yes. If you mean the mereological sum of the trout and your turkey club, I'm going to need you to keep that to yourself until I finish eating.

  **Alex:** Come on, Ben. You can't eat the trout without eating the trout-turkey. They're coincident. Or rather, the trout is a part of the trout-turkey. If you deny the trout-turkey exists, you're buying into ontic vagueness. And we both know Sider buried that position twenty years ago.

  **Ben:** Sider buried the idea that *existence* can be vague. He didn't prove that composition is unrestricted. He just proved that if composition is restricted, the boundary has to be sharp. I'm fine with a sharp boundary.

  **Alex:** Where is it, then? *(Gestures with a fry)* Here we have simples arranged turkey-wise. Over there, simples arranged trout-wise. In between, we have air molecules, maybe some grease splatter. At what precise nanometer of distance does composition kick in for you? Contact? Fastening?

  **Ben:** I'm not a contact theorist. I'm an organicist. Composition occurs when the activity of the simples constitutes a life.

  **Alex:** *(Leans in)* There it is. "Life." You swapped one vague predicate for another. We're eating in a diner, Ben. Look at that trout. Is it alive? No. It's dead. When did it stop composing an object? When the gills stopped moving? When the brain activity ceased? When the cells stopped metabolizing? There is a continuum there. If you say composition stops at some precise instant *t*, you're saying reality snaps from "one object" to "many objects" based on a biological threshold that biologists themselves admit is fuzzy. Viruses, prions, slime molds... are they lives?

  **Ben:** You're confusing the vagueness of the *word* "life" with the vagueness of the *phenomenon*. Van Inwagen's point isn't about biology textbooks. It's about causal unity. When simples are caught up in a self-organizing event—a struggle against entropy—that's a joint in nature. It's not arbitrary. Contact is arbitrary. Why does touching count but being one nanometer apart not? That's brute. But "being caught up in a life" picks out a specific causal relation.

  **Alex:** But is it *precise*? That's the Sider argument. If there's a case where it's indeterminate whether the simples are caught up in a life—say, a zygote just starting to divide, or a human in a fading coma—then on your view, it's indeterminate whether an object exists there. And if it's indeterminate whether an object exists, it's indeterminate how many objects exist. You've got ontic vagueness in the number of substances. That's incoherent.

  **Ben:** Is it? Or is it just that our *description* is coarse? Look, I'll grant you that 'organism' might be semantically vague. But the underlying reality—the event of the simples acting together—is either happening or it isn't. If the metabolic processes are sufficiently integrated, there's an object. If not, there isn't. I'd rather bite the bullet that there's a precise moment a life begins than bite the bullet that *this*— *(points to Alex's plate)* —the sum of the left half of your club and the right half of my trout is an object.

  **Alex:** *(Smiling)* Ah, the Trout-Turkey. The reductio you think scares me.

  **Ben:** It should. You're committed to it. The sum exists.

  **Alex:** Of course it exists. Why wouldn't it?

  **Ben:** Because it's gerrymandered! It has no causal unity. The trout part isn't interacting with the turkey part. It's a scattered object with no explanatory power. It's ontological junk.

  **Alex:** "Junk" is a pragmatic judgment, not a metaphysical one. Sure, the trout-turkey doesn't *do* anything. It doesn't bark or digest. But existence isn't about doing. It's about quantification. If I say "there exists an x such that x is composed of the trout and the turkey," I'm saying something true. If you deny it, you have to say *where* I went wrong. Is it false? Why? Because the parts aren't "close enough"? Then you're back to the sorites. How close is close enough?

  **Ben:** I went wrong because composition isn't a logical free-for-all. It's constrained by causality. You Universalists treat space like a grid where objects just pop into being if you draw a boundary. I treat objects as *agents* of causal power. The trout-turkey doesn't act. The organism does. That's why "Life" isn't arbitrary. It's the only non-logical, non-spatial relation that actually generates unity.

  **Alex:** But you still haven't answered the precision charge. Let's take a virus. It replicates. It organizes matter. Is it a life? If you say "yes," then a crystal grows and organizes matter, is that a life? If you say "no," where's the line? If the line is vague, then *existence* is vague. You've got simples arranged virus-wise. Do they compose an object? If it's indeterminate, then the cardinality of the universe is indeterminate. That's the bullet. Can you really swallow that?

  **Ben:** *(Takes a sip of coffee, thinking)* I think the Universalist bullet is heavier. You're telling me that for every electron in this diner, there is an object composed of that electron and the Eiffel Tower. There are more objects in this coffee cup than there are stars in the galaxy. You've inflated ontology to avoid a boundary problem.

  **Alex:** I haven't inflated anything. I've just accepted that "object" doesn't mean "thing we care about." It means "region of spacetime occupied by matter." You're the one inflating things by adding a magical "causal unity" constraint that you can't define without vagueness.

  **Ben:** It's not magical. It's the difference between a pile of bricks and a house.

  **Alex:** No, it's the difference between a pile of bricks and a *different* pile of bricks. On my view, the house exists, the pile exists, and the sum of the house and my left shoe exists. None of them are more "real" than the others. They just have different properties. The house has the property of sheltering; the trout-turkey has the property of being weird.

  **Ben:** But the house *persists* through part replacement. The trout-turkey doesn't.

  **Alex:** Sure it does. As long as the trout and the turkey persist, the fusion persists.

  **Ben:** *(Laughs)* That's exactly the problem. You've lost the notion of persistence. If I eat the trout, does the trout-turkey cease to exist? Or does it just lose a part?

  **Alex:** It loses a part. It becomes a turkey-trout-remnant.

  **Ben:** See! You're talking nonsense. You've sacrificed the world we live in—the world of tables and trout and people—for the sake of logical tidiness. You'd rather have a clean quantifier than a real world.

  **Alex:** And you'd rather have a "real world" that rests on a vague boundary between existence and non-existence. Look, Ben, I'll make you a deal. I'll admit the trout-turkey is boring. I'll admit it's not a *substance* in the Aristotelian sense. But I won't admit it doesn't exist. Because the cost of denying it is saying that reality itself is fuzzy. And I just can't make sense of fuzzy reality. Can you?

  **Ben:** *(Cuts a piece of trout)* I can make sense of a reality where not every question has a yes/no answer. But I can't make sense of a reality where *everything* is an object. If everything is an object, nothing is.

  **Alex:** *(Raises coffee cup)* Then I suppose we're at an impasse. To the trout-turkey.

  **Ben:** *(Clinks mug)* To the life of the trout. May it rest in peace, and not compose anything with your sandwich.

  **Alex:** Too late. It's already part of the fusion.

  **Ben:** Don't start.

  *(They eat. The waitress drops the check on the table, right on top of the napkin that is arguably part of the table-check fusion.)*
