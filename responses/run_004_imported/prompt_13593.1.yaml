          *   *Physiological:* Body signals are more honest than mental states.
          *   *Procedural:* Pre-set rules (Ulysses Pact).
          *   *Content:* Watch for specific linguistic markers (absolutes, mind-reading).
      *   *Conclusion:* Summarize. It's a limit of *isolated* self-monitoring, not a limit of human capacity overall. We need scaffolding.

  6.  **Refining the Tone:**
