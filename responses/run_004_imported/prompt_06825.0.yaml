  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Philosophy PhD student.
      *   **Occasion:** Wedding toast for a close friend and fellow student, Priya.
      *   **Audience:** 50% philosophers (know the situationist critique of virtue ethics, Priya's specific dissertation topic), 50% non-philosophers (family/friends, need a normal wedding toast).
      *   **Key Constraint:** The toast *must* praise Priya's character in a way that is consistent with situationist-informed virtue ethics (local traits, practical wisdom/phronesis, cue-sensitivity) and *avoid* naive cross-situational generalization (global traits like "honest in all things").
      *   **Priya's Stance:** Her dissertation defends virtue ethics against Harman/Doris by arguing for local/cue-sensitive traits + practical wisdom (Kamtekar/Sreenivasan style). She explicitly joked about not wanting to be called "the same generous person in every situation."
      *   **Tone:** Warm, celebratory, intellectually precise but accessible (not a lecture), funny but respectful.
      *   **Length:** Roughly 5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Content:**
      *   *The Problem:* Situationism says global traits (e.g., "Honesty") don't exist because behavior changes based on irrelevant situational factors (e.g., finding a dime).
      *   *Priya's Solution:* Traits aren't global; they are local and sensitive to context. Virtue isn't a robotic rule; it's *phronesis* (practical wisdom) — knowing *what* to perceive in a situation and how to respond.
      *   *The Toast's Task:* Praise Priya not for being *consistent* regardless of context, but for being *perceptive* and *responsive* to the right contexts. Praise her *wisdom* in navigating situations, not just her *output* in a vacuum.
      *   *Avoid:* "She is always kind," "She never wavers," "No matter the cost."
      *   *Embrace:* "She knows when to speak," "She sees what others miss," "She cultivates the right environments," "Her kindness is intelligent."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the honor, and the mixed audience. Set a warm tone.
      *   **The "Hook" (Philosophical nod):** Briefly acknowledge the shared academic background without alienating the family. Use the "dissertation" angle.
      *   **The Core Argument (The Praise):** How to describe her virtue without triggering the situationist critique?
          *   Focus on *attention* and *perception*.
          *   Focus on the *relationship* (marriage is a specific situation).
          *   Focus on *growth* and *cultivation* rather than static being.
      *   **The Partner:** Mention the partner (let's call him Alex for now, or keep it generic/partner-focused). Marriage is a shared situation.
      *   **The Closing:** A wish for the future. A toast.

      *   *Self-Correction during drafting:* I need to make sure I don't get too technical. No names like "Harman" or "Doris" unless it's a very quick wink. The prompt says "non-philosophers... shouldn't have to learn about [the fundamental attribution error] at a wedding." So, keep the jargon minimal or explain it through metaphor.
      *   *Refining the Philosophical Point:* Instead of saying "She has local traits," say "She knows that context matters." Instead of "She has phronesis," say "She has the wisdom to see what a moment requires."
      *   *Addressing Priya's Joke:* I should explicitly reference her warning about the "second dissertation chapter." It shows intimacy and acknowledges the constraint directly.

  4.  **Drafting - Specific Phrasing:**
      *   *Bad:* "Priya is honest everywhere."
      *   *Good:* "Priya knows when truth is needed and when silence is kinder."
      *   *Bad:* "She is brave no matter what."
      *   *Good:* "She recognizes the moments that demand courage."
      *   *Key Concept:* Virtue as a skill of navigation, not a fixed compass needle.

  5.  **Review against Constraints:**
      *   *5 minutes?* Word count check. (Aim for ~800 words).
      *   *Philosophically sound?* Yes, focuses on perceptiveness and situational sensitivity rather than global consistency.
      *   *Accessible?* Yes, metaphors should carry the weight.
      *   *Warm?* Needs to ensure the philosophy doesn't freeze the emotion.

  6.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the transition from philosophy to love is smooth.
      *   Make sure the toast lands on *love*, not just *ethics*.

      *(Self-Correction during final review)*: I need to make sure I don't accidentally imply she *only* cares about her friends. The "local" trait argument isn't about favoritism; it's about contextual appropriateness. I will frame marriage as the specific "situation" where her virtues shine because she has cultivated it.

      *Wait, one nuance:* The prompt mentions Kamtekar and Sreenivasan. They argue traits are *real* but not *global*. They are sensitive to reasons. So the praise should be about her *responsiveness to reasons*.
      *Revised plan:* Praise her ability to read the room, to see the need, to act appropriately. That is practical wisdom.

  7.  **Finalizing the Text:** (Proceeding to generate the toast based on these thoughts).
      *   *Title:* Optional, but helps frame.
      *   *Salutation:* Standard.
