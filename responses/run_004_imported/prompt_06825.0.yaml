      *Audience Check:* Family hears "she's thoughtful." Philosophers hear "she has robust local traits supported by phronesis."

      *Let's go.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Priya's from the philosophy department. Which, in this room, means about half of you are wondering if I'm going to cite Kant, and the other half are wondering if I know how to talk to human beings.

  I want to start by acknowledging a specific danger I face tonight. Priya's dissertation is a defense of virtue ethics against the "situationist critique." For the non-philosophers here, that's a debate about whether character traits like "honesty" or "kindness" actually exist, or if we're all just puppets dancing on the strings of our environment. Priya argues that virtue isn't about being a robot who does the exact same thing no matter what; it's about having the wisdom to perceive what a specific moment requires.

  She told me, only half-joking, that if I stand up here and call her "the same generous person in every situation, no matter what," she will consider it a citation-worthy error and begin drafting a second dissertation chapter right at the altar.

  So, I have to be careful. I cannot say that Priya is virtuous because she ignores the world around her. I cannot say she is brave because she never feels fear. To praise her accurately—to praise her in a way that respects her own work—I have to praise her *attention*.

  What I admire most about Priya is not that she carries a fixed moral compass that points North regardless of the terrain. It's that she is a brilliant navigator of the terrain itself.

  We all know people who are "honest" in the blunt, hurtful way. We know people who are "generous" in a way that creates debt. Priya possesses something rarer. She has the capacity to read a room, to sense the subtle shifts in a conversation, and to understand what *this* specific person needs in *this* specific moment. Sometimes that requires silence. Sometimes it requires a joke. Sometimes it requires a hard truth, delivered softly.

  The situationists argue that behavior is driven by small cues—like finding a dime in a phone booth. Priya's work suggests that the virtuous person isn't the one who ignores the dime, but the one who notices how the dime makes them feel, and adjusts accordingly. She doesn't just act; she perceives. She cultivates the kind of practical wisdom that Aristotle called *phronesis*.

  And this is why I am so confident in her marriage.

  Marriage is not a single situation. It is a lifetime of shifting contexts. There will be moments of high stress, moments of grief, moments of mundane boredom, and moments of incredible joy. A global trait like "stubbornness" might survive the stress but fail the boredom. A global trait like "romance" might survive the joy but fail the grief.

  But Priya's virtue is robust because it is flexible. She loves not by applying a rule, but by attending to you. She knows that the courageous thing to do on a Tuesday morning is different from the courageous thing to do on a Saturday night. She knows that supporting you sometimes means stepping in, and sometimes means stepping back.

  To the non-philosophers in the room: this just means she listens better than anyone I know. She sees you.
  To the philosophers in the room: this means her traits are locally stable, reason-responsive, and integrated with a sophisticated perceptual capacity.

  Priya, you have argued that character is not a stone, but a skill. It is something we practice, something we refine, something that depends on the company we keep and the environments we build.

  So, my wish for you is not that you remain "unchanged" by your marriage. That would be impossible, and undesirable. My wish is that you continue to cultivate the situations that bring out the best in each other. May you build a home that acts as a positive situational cue, triggering patience when there is stress, and playfulness when there is routine. May you continue to perceive each other with clarity. And may your love be not a blind force, but a wise one.

  Please raise your glasses.

  To Priya and her partner: May your life together be full of situations that demand the best of you, and may you always have the wisdom to rise to them.

  To the happy couple.
