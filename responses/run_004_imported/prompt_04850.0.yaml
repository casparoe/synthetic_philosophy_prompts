      *   **Role:** Philosopher on the Board of a mid-sized humanitarian NGO.
      *   **Task:** Draft a short memo regarding a compensation dispute (expat vs. local staff pay gap).
      *   **Context:** Expats earn 2-3x locals for comparable work. Management says it's necessary for recruitment/retention.
      *   **The Conflict:**
          *   Board Member A: Argues it fails the "veil of ignorance" test (Rawlsian) and is an injustice incompatible with the human rights mission.
          *   Board Member B: Argues Rawls's *Law of Peoples* explicitly limits the Difference Principle to domestic societies, not global justice, so Member A is misapplying Rawls.
      *   **Requirements:**
          *   Recommend a course of action (retain, phase out, or restructure) + timeline.
          *   Take the rejected side as seriously as the adopted side (steel-manning).
          *   Tone: Professional, philosophical but practical, suitable for a board memo.
          *   Deadline: Before Thursday's meeting.

  2.  **Deconstruct the Philosophical Arguments:**
      *   *Member A (Cosmopolitan Rawlsian):* Focuses on moral equality of individuals globally. If we didn't know where we'd be born (veil of ignorance), we wouldn't accept a system where nationality dictates pay for the same work. It undermines the NGO's moral authority.
      *   *Member B (Rawlsian Realist/Statist):* Rawls in *The Law of Peoples* argues that principles of distributive justice (Difference Principle) apply within a "basic structure" of a society, not globally. Global duties are about assistance to burdened societies, not equalizing income across borders. Market realities (mobility costs, family support, risk premiums) justify the gap.

  3.  **Determine the Recommendation:**
      *   *Option 1: Retain.* Hard to justify morally given the mission. Looks like exploitation.
      *   *Option 2: Immediate Phase Out.* Financially risky. Might lose key talent needed to run programs. Could harm beneficiaries if programs collapse.
      *   *Option 3: Restructure/Equalize over time.* This is the middle path. It acknowledges the moral imperative (Member A) while respecting operational realities and the specific limits of global distributive justice (Member B). It moves toward "equal pay for equal work" but acknowledges the "mobility premium" might need to exist temporarily or in a different form (allowances vs. salary).
      *   *Decision:* Recommend **Restructuring toward a unified pay scale with specific, transparent allowances**, phased over a medium timeline (e.g., 3-5 years). This addresses the injustice without crashing the organization.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the purpose and the recommendation clearly.
      *   **The Ethical Tension (Steel-manning both sides):**
          *   Acknowledge Member A's point: The moral hazard. If we preach rights but practice wage discrimination, we lack integrity. The "Veil of Ignorance" intuition is powerful even if technically debated.
          *   Acknowledge Member B's point: Rawls's specific caution. Global labor markets aren't a single basic structure. Cost of living, mobility, and retention are real constraints. Abrupt equality could harm the mission's efficacy.
      *   **Analysis:**
          *   Distinguish between *base salary* (should be role-based) and *allowances* (hardship, mobility, cost of living).
          *   The current 2-3x gap is likely a blend of both, obscuring the justice issue.
      *   **Recommendation:**
          *   Move to a "Global Grading System" where base pay is tied to the role, not the passport.
          *   Keep specific, transparent allowances for mobility/hardship (addressing Member B's concern about recruitment).
          *   Timeline: 3-year phase-in.
      *   **Conclusion:** Reiterate that this balances moral integrity with operational viability.

  5.  **Refining the Tone:**
      *   Needs to sound like a philosopher wrote it (precise, nuanced) but also a board member (action-oriented, concise).
      *   Avoid jargon where possible, but use the philosophical terms correctly (Veil of Ignorance, Difference Principle, Law of Peoples).
      *   Ensure the "rejected" side feels respected. For instance, if I lean toward Member A's moral intuition, I must validate Member B's textual accuracy regarding Rawls.

  6.  **Self-Correction/Review during drafting:**
