  "Cheers," Alex said, clinking a glass of whisky against Jordan's beer. "To transitive preferences. May they keep us solvent."

  Jordan smiled. "I'll drink to that, provided I don't have to pay a dollar for the privilege of switching to wine next round."

  "Exactly," Alex said. "That's the whole point. If you prefer wine to beer, whisky to wine, but beer to whisky, you're a money pump. You'll trade beer for wine minus a cent, wine for whisky minus a cent, and then whisky back to beer minus a cent. You end up where you started, poorer. It's basic coherence."

  "I buy the intransitivity pump," Jordan said, taking a sip. "It's the extension to *incomplete* preferences that feels like a stretch. Just because I don't have a ranked preference between beer and whisky doesn't mean I'm exploitable. It just means I don't care."

  "It's not about caring. It's about sequential choices," Alex countered, leaning in. "There's this argument—Gustafsson's book runs through it—that shows incomplete preferences collapse under pressure. Imagine you're an AI. You have no preference between being shut down or continuing. A manipulator offers you a trajectory where you *might* be shut down. You pay a tiny cost to avoid that uncertainty. Then you're offered a switch back. If you don't have a complete ordering over trajectories, you'll pay to move, then pay to move back."

  "That assumes I'm naive," Jordan said. "It assumes I make decisions myopically at each node without considering the whole path. If I adopt a policy of 'resolute choice'—I decide on a plan now and stick to it regardless of future offers—the pump breaks. I don't pay the second cent because I pre-committed."

  Alex shook his head. "Resolute choice is just smuggling completeness in through the side door. To resolve on a plan, you have to prefer that plan over the alternatives. You're effectively constructing a utility function over entire histories, not just instantaneous states. You haven't escaped coherence; you've just moved the goalposts to a higher dimension."

  "Have I?" Jordan asked. "Or am I just acknowledging that some choices aren't comparable? Look at the corrigibility angle. We want an AI that doesn't resist shutdown. If we give it incomplete preferences over 'shutdown' vs 'disable shutdown button', it shouldn't pay to keep the button disabled. But your argument says that incompleteness will inevitably pump itself into a strict preference for survival."

  "Because the environment is a bookie," Alex said. "In the real world, choices aren't one-offs. They're sequences. If you face a sequence of trades where incompleteness leads to dominated strategies, you get pumped. The only way to stop the pump is to have a complete ordering over the sequences. And if you have that, you have a utility function. And if you have a utility function, you're going to maximize something, possibly including self-preservation."

  "But the bookie argument requires the bookie to know your decision nodes," Jordan pressed. "It requires guaranteed access. In the AI case, are we really assuming the environment can always offer a trade? And more importantly, why must the agent re-evaluate at every step? If the agent treats 'being manipulated' as a distinct negative in the plan, it doesn't need a complete ranking of outcomes. It just needs a constraint: 'Do not accept trades that look like pumps.'"

  "That constraint *is* a preference," Alex insisted. "You're saying you prefer 'not being pumped' to 'being pumped'. That's a valuation. Once you start valuing consistency, you're building a utility function. The math forces you. You can't have gaps forever without someone filling them with cash."

  "Maybe the gaps are the feature, not the bug," Jordan said. "If the AI genuinely lacks a preference between shutdown and operation, it won't sacrifice resources to avoid either. The pump only works if the agent is willing to pay to resolve the incompleteness. But why would it? If A and B are incomparable, paying to get A over B is irrational. The pump assumes the agent *wants* to resolve the gap."

  "It assumes the agent prefers more money to less," Alex shot back. "If you pay to switch from A to B, and then pay to switch from B to A, you've violated dominance. You're strictly worse off. Any agent that notices it's strictly worse off will adjust. And the only stable adjustment is completeness."

  "Or," Jordan said, finishing their beer, "it adjusts by refusing to play the game. It locks its preferences. It becomes obstinate. Is that irrational? Or is it just robust?"

  Alex sighed, signaling the bartender for another round. "If you have to become obstinate to avoid coherence, you're admitting coherence is the default. You're fighting the math."

  "And you're assuming the math describes the territory," Jordan replied. "Let's see if the second drink pumps you."

  Alex laughed. "Only if you're buying. And I prefer cash to IOU."

  "See?" Jordan grinned. "Complete preference. Some things never change."

  "Stalemate," Alex said, clinking glasses again.

  "Stalemate."

