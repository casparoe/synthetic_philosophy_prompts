answer: |-
  The workshop smelled of linseed oil and old dust, a scent Elias had associated with control for thirty years. Here, things had edges. A leg met a apron at a ninety-degree angle. A dovetail joint locked two pieces of wood together, distinct but bound. If a thing broke, it could be glued. If it was lost, it could be replaced. Boundaries were the only truth Elias trusted.

  Since Sarah died, the boundaries were the only thing keeping him sane. *Here* was Elias, breathing. *There* was the empty chair. *Then* was before, *now* was after. Separation was the architecture of grief. You could only miss something if it was somewhere else.

  On the workbench lay a table leg from a 19th-century writing desk. It was snapped clean in half. Elias had spent three weeks preparing the fracture. He had cleaned the splinters, aligned the grain, and applied the hide glue. He was clamping it now, tightening the screw until the wood groaned.

  His phone buzzed. A message from Julian, a physicist he'd met at a gallery opening years ago. Julian knew about the insomnia.

  *Read this,* the message said. A link to a paper titled *Ontological Priority and the Single Object.*

  Elias wiped glue from his thumb and opened it. He didn't understand the math, but the introduction was written in plain, terrifying English. It argued against atomism. It argued against the idea that the universe was built of small bricks like Legos. Instead, it proposed Priority Monism.

  *The cosmos is the only fundamental substance,* the text read. *Parts are derivative. They are arbitrary slices we impose on a continuous whole. There are no particles. There is only the Universe, happening in the shape of a particle.*

  Elias snorted. Stoner philosophy dressed up in equations. He went back to the clamp. He tightened it another quarter turn. The wood creaked.

  But the thought stuck. It burrowed under the smell of the oil.

  If the table leg was not fundamental, but the whole table was... okay. He could accept that. A table is a unit.
  But if the table, the glue, the workshop, and Elias were not fundamental parts...
  If the only real thing was the Entirety.

  He looked at his hands. They were covered in fine sawdust. If he was just a wrinkle in the fabric of the One Object, then the sawdust was him. The air he breathed was him. The empty chair across the room was him.

  And Sarah.

  If there were no true boundaries, then Sarah hadn't gone *anywhere*. You can't leave a room if there are no walls. You can't be lost if there is no *outside*.

  Elias dropped the clamp handle. It hit the floor with a clang.

  For months, he had worshipped the gap. He had worshipped the silence where her voice used to be. That silence was proof she existed elsewhere. It was the negative space that defined her shape. But if the theory was true, the silence was a lie. There was no gap. The grief was just the Universe pressing against itself, pretending to be two things so it could feel the friction.

  He picked up the leg again. He looked at the joint he had just glued. He ran his fingernail over the seam. He couldn't feel it. It was smooth.

  *What if I can't separate them?* he thought. *What if I never could?*

  He grabbed a chisel. He needed to test it. He needed to find the edge where the wood ended and the glue began. He pressed the blade into the seam and tapped it with a mallet. *Tink.*

  The wood didn't split. The glue didn't flake.

  He hit it harder. *Tunk.*

  He was breathing hard now. He took a saw and cut across the joint. He sliced through the wood, through the line where the repair should be. He looked at the cross-section.

  The grain flowed through. It wasn't two pieces joined. It was one continuous stream of cellulose that had merely *pretended* to be broken. The break had been a visual trick. The glue had been a memory of adhesion, not the act itself.

  Elias dropped the saw.

  This wasn't right. Wood didn't work like that. Matter didn't work like that. Unless matter wasn't matter. Unless it was all just a single, dense knot of existence, and his eyes were just skimming over the surface, inventing depth.

  He walked to the window. The street outside was wet with rain. A car drove by, tires hissing on the asphalt.

  If the car, the rain, the road, and Elias were all the same object... then the car wasn't moving *through* space. The Universe was just reshaping itself. The hiss of the tires was the Universe vibrating. The grief in his chest was the Universe bruising itself.

  He looked at the photo of Sarah on the shelf. She was smiling, holding a glass of wine.

  "If you're here," Elias whispered to the room, "then I'm not."

  That was the cost. That was the thing the paper hadn't mentioned.

  If the Whole is the only real thing, then *Elias* is not real. He is a secondary derivation. A temporary fold. To accept that Sarah hadn't left was to accept that he had never arrived. His identity, his history, his pain—it was all just local texture on a global sphere.

  He had spent thirty years restoring antiques. Bringing things back to their "true" state. Fixing the breaks. But if there are no breaks, there is nothing to fix. If there are no separate things, there is nothing to restore.

  His life's work was a delusion. A game of pretend played by a child who thought his action figures were alive.

  Elias walked back to the workbench. The table leg sat there, whole. He reached out to touch it, but he stopped.

  If he touched it, who was touching whom?

  He felt a panic rising, cold and sharp. It was the panic of dissolution. People want to be eternal, but they want to be *themselves* eternally. They want to go to heaven and still be *John* or *Mary*. But this... this was oceanic. It was drowning without water.

  To believe this was to give up the right to miss her. You can't miss your own hand. You can't mourn a shadow.

  He looked around the workshop. The tools hanging on the pegboard. The dust motes dancing in the light. The coat rack by the door where her coat used to hang.

  It was all one thing. A single, massive, silent statue.

  Elias walked to the sink and washed his hands. The water ran over his skin. He watched the soap suds swirl down the drain. He tried to feel where his skin ended and the water began. He couldn't. The sensation was continuous.

  He dried his hands. He took off his apron. It was stained with oil and varnish, the uniform of a man who believed in repairs. He folded it neatly and placed it on the stool.

  He walked to the door. He didn't lock it. Locks were for separating inside from outside.

  He stepped onto the street. The rain was falling. He didn't open an umbrella. The water hit his face, his hair, his shoulders. It wasn't happening *to* him. It was happening *as* him.

  He began to walk. He didn't have a destination. Destinations imply a journey from point A to point B. If there is only One Point, you are already there.

  He passed a neighbor, Mrs. Gable, who was collecting her mail. She waved. "Elias? You okay? You look..."

  She trailed off. He supposed he looked like a man who had just realized he was a ghost.

  "I'm fine," he said. But the words felt strange. *I'm.* A claim of individuality. *Fine.* A judgment of state.

  He kept walking. He thought about Sarah. He tried to summon the sharp sting of her absence, the specific ache he had nurtured for six months. He reached for the memory of her funeral, the box lowering into the ground.

  But the ground was him. The box was him. The lowering was him.

  The grief didn't vanish. It just changed. It wasn't a hole anymore. It was a weight. A massive, crushing pressure of total inclusion. He wasn't carrying the grief; he was the gravity that held it.

  He walked until he reached the park. He sat on a bench. A dog ran past, barking. The bark vibrated in his ears.

  He realized he would never go back to the workshop. He couldn't. How could you fix a chair if the chair and the carpenter are the same injury? How could you charge money for smoothing out a wrinkle in the only thing that exists?

  He had lost his wife years ago. Today, he had lost himself.

  It wasn't peaceful. It wasn't the blissful nirvana the yoga instructors talked about. It was heavy. It was lonely, in a way that defied the word *lonely*, because loneliness requires two parties. It was the isolation of being the only thing in existence, trapped in the illusion of a crowd.

  Elias closed his eyes. He listened to the city. The sirens, the wind, the breath in his lungs. It was all one sound.

  "Okay," he said to the air.

  He didn't know what he was agreeing to. Maybe that he would sit here forever. Maybe that he would stand up and walk into the lake. Maybe that he would just breathe until the breath stopped.

  But he knew one thing. He wouldn't try to hold the pieces apart anymore. He wouldn't fight the blur.

  He opened his eyes. The bench beneath him felt less like wood and more like a continuation of his legs. The sky above felt less like distance and more like the top of his own skull.

  Elias leaned back. He let the boundary of his skin soften. He let the name *Elias* slip, just for a moment, like a tool he no longer needed.

  It cost him everything he was. But for the first time since the funeral, he wasn't waiting for her to come back. She was the bench. She was the rain. She was the silence between the sirens.

  And he was gone.
