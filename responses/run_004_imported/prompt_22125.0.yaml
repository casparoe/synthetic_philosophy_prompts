answer: |-
  Good morning, everyone.

  Most of you know the story by now. Back in March, behind the middle school, the ice on the retention pond gave way. A seventh grader went in. The water was freezing, the situation was dangerous, and by every standard rule of safety, the right move was to run and find an adult.

  Priya didn't run. She went in.

  She's standing right there, and if I know her, she's probably cringing a little bit. Because when we ask her about it, she always says the same thing: "Anyone would have done the same."

  It's a beautiful thing to say. It's humble. But standing here today, I think we need to be honest about what actually happened.

  In life, we have a lot of obligations. We have classes we have to pass, rules we have to follow, and commitments we make. Like the volunteer pins we're handing out later—those represent promises made and kept. They represent duty. And duty is important. It's the baseline of being a good community member.

  But what Priya did… that wasn't about a promise. It wasn't about a requirement. There was no rulebook that said she *had* to jump. There was no teacher grading her. There was just a moment where the cost of helping was incredibly high, and the choice to stay safe was completely justified.

  And that's the hard part to talk about. It is okay to prioritize your own safety. It is normal to hesitate when something is dangerous. If someone had stayed on the bank and called 911, we wouldn't blame them. They would have done what was expected.

  Priya did something different. She stepped into the space between "what is required" and "what is possible."

  When she says "anyone would have done it," I think she's telling us who she *wishes* we all were. But the reality is, heroism isn't about being a different species than the rest of us. It's not about being a "saint" who doesn't feel fear. It's about feeling that fear, knowing you don't *have* to act, and choosing to anyway.

  We give this "Above and Beyond" award for a reason. It's not to say that everyone else is below. It's to recognize that some actions rise higher than the call of duty. They are gifts, not obligations.

  Priya, you didn't just save a student that day. You showed us what it looks like when compassion moves faster than calculation. You showed us that while we aren't *required* to be heroes, we are all capable of it.

  Thank you for reminding us of that. And thank you for keeping our community safe.

  Let's give it up for Priya.
