          2.  Why dismissing long-run dominance as "merely asymptotic" fails (it's about the relevant average, not the time horizon).
          3.  Address the counter-worry: Is privileging the time average itself a substantive value judgment?

  2.  **Deconstruct the Core Conflict:**
      *   *Standard EUT (Samuelson):* Rationality is defined by consistency of preferences over lotteries. Value is subjective ($U(w)$). The "correct" bet depends on $U$. If you maximize $E[U(w)]$, you are rational. Kelly is just the special case where $U(w) = \ln(w)$. Ensemble averages (expectations) are the normative standard.
      *   *Ergodicity/Geometric Rationality (Peters/Kelly):* Rationality is about survival and growth in a non-ergodic process. Wealth dynamics are multiplicative ($W_{t+1} = W_t \cdot X$). The ensemble average ($E[W]$) does not equal the time average ($\lim_{T\to\infty} \frac{1}{T} \sum \ln(W_t)$) for non-ergodic systems. A single agent experiences the time average. Therefore, maximizing the time-average growth rate (which equals $E[\ln(X)]$) is objectively rational for *any* agent who wants to persist, regardless of their subjective "risk aversion."

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the dominance of EUT but frame the ergodicity critique as a foundational challenge to the *modeling of uncertainty*, not just preferences. Use precise terminology (ergodicity, ensemble vs. time average, non-ergodic processes).

      *   **Point 1: The Question-Begging Nature of "Kelly = Log Utility":**
          *   *Standard View:* Assumes the expectation operator $E[\cdot]$ is the normative gold standard.
          *   *Ergodic View:* The expectation operator corresponds to an *ensemble average*. This is only physically meaningful if the system is ergodic (time average = ensemble average).
          *   *The Kicker:* Wealth dynamics are multiplicative. Multiplicative processes are non-ergodic. Therefore, $E[W]$ is a fiction for a single agent.
          *   *Conclusion:* Saying "Kelly is just log utility" assumes the ensemble average is the right metric. But the right metric is determined by the dynamics, not the utility. If the dynamics dictate the time average, and the time average of growth is the expected log return, then maximizing expected log return is a requirement of *physics/dynamics*, not psychology.

      *   **Point 2: The "Merely Asymptotic" Dismissal:**
          *   *Standard View:* "I won't live forever, so the long-run theorem doesn't apply."
          *   *Ergodic View:* It's not about infinity; it's about the *rate* of divergence.
          *   *The Math:* The difference between arithmetic and geometric means compounds. Even in finite time, the probability mass of the ensemble distribution shifts such that the "average" agent (median) does much worse than the "expected" agent (mean).
          *   *Key Distinction:* Samuelson focuses on $E[W_T]$. Peters focuses on the growth rate $g$. The "asymptotic" argument ignores that the *typical* path diverges from the *expected* path exponentially fast. Ruin isn't just a limit; it's the trajectory of the measure.
          *   *Reframing:* It's not "wait long enough and Kelly wins." It's "Kelly describes the behavior of the system *now*, whereas EUT describes a parallel universe that doesn't exist for you."

      *   **Point 3: The Hard Worry (Is Time-Privileging a Value Judgment?):**
          *   *The Critique:* Why care about *your* trajectory? Why not care about the ensemble (e.g., if you have heirs, or if you are a social planner)? Isn't choosing the time average just another "utility function" (survival/growth)?
          *   *The Defense:* Distinguish between *preferences* and *constraints*.
          *   *Argument:* You can have any utility function you want over outcomes, but you cannot violate the dynamics of the process. If the process eliminates you (absorbing state at 0), your utility function becomes irrelevant.
          *   *Nuance:* It's not that $U(w) = \ln(w)$. It's that the *feasible set* of outcomes is constrained by the geometric growth rate.
          *   *Counter-counter:* What if I want to gamble for a short burst?
          *   *Response:* That's a consumption decision, not an investment/growth decision. If the goal is *persistence* (which is usually implied in "rational choice" over time), ergodicity is normative. If the goal is "maximize chance of hitting a specific target before dying," EUT might apply, but that's a specific boundary condition, not a general theory of rationality.
          *   *Philosophical Pivot:* This shifts rationality from "consistency of desire" to "effectiveness of action in a structured world."

      *   **Conclusion:** Summarize. The geometric view isn't just a rival utility function; it's a rival ontology of uncertainty. It demands we check the physics of the gamble before assigning the psychology of the gambler.

  4.  **Refining the Tone:**
      *   Needs to be academic, rigorous, and charitable but firm.
      *   Avoid pop-science explanations of Peters' work; stick to the formal epistemology/decision theory angle.
      *   Use terms like "non-ergodic," "measure preservation," "law of large numbers," "absorbing states."
      *   Ensure the distinction between *utility* (subjective valuation) and *growth rate* (objective dynamic) is sharp.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "category error" charge? *Yes, by flipping it: EUT commits the category error by applying ensemble statistics to time-series data.*
      *   *Check:* Is the "finite time" objection handled? *Yes, by focusing on the divergence of mean and median, not just the limit.*
      *   *Check:* Is the "value judgment" objection handled? *Yes, by framing it as a precondition for agency (survival) rather than a preference.*
      *   *Caution:* Don't overclaim. Peters' work is controversial. Acknowledge that this is a *foundational* challenge, not necessarily a settled proof. The prompt asks to "argue for the geometric-rationality side as rigorously as you can," so I should take the stance of a advocate while maintaining philosophical precision.

  6.  **Final Polish:** Check citations (Kelly, Samuelson, Peters, Menger maybe). Ensure the flow is logical. (The resulting output will follow this structure.)

  *(Self-Correction Note on Point 3)*: I need to be careful not to say "survival is the only value." The argument is that for *repeated* choice, the dynamics impose a constraint that looks like log utility but isn't. I should emphasize the distinction between *maximizing utility* and *avoiding elimination*. The "value judgment" is the decision to remain an agent.

  7.  **Finalizing the Text:** (Proceed to generate response based on these thoughts.)
answer: |-
  Here is a reconstruction of the geometric rationality position, framed as a rigorous foundational challenge to the standard expected-utility paradigm. This argument is designed to meet the standards of a graduate seminar in formal epistemology, treating the ergodicity critique not as a heuristic but as a structural correction to the modeling of uncertainty in decision theory.

  ***

  ### The Ergodic Critique of Expected Utility: A Defense of Geometric Rationality

  The standard dismissal of the Kelly criterion—that it is merely expected utility maximization with a logarithmic utility function—rests on a category error more profound than the one it is accused of committing. It conflates the *valuation* of outcomes with the *dynamics* of the process generating those outcomes. The position I defend here, drawing on the work of Kelly, Breiman, and more recently Ole Peters, posits that rational choice in non-ergodic environments cannot be defined solely by preference orderings over lotteries. Instead, it must be constrained by the physical and mathematical properties of the time-series data an agent actually experiences.

  To argue for geometric rationality is to argue that for a single agent navigating a multiplicative process over time, the expected logarithm of wealth is not a psychological preference; it is the unique statistic that corresponds to the observable time-average growth rate. The following three sections address the specific objections raised by the expected-utility orthodoxy.

  #### 1. The Question-Begging Nature of "Kelly as Log Utility"

  The Samuelsonian objection asserts that if an agent maximizes $E[\ln(W)]$, they simply possess a utility function $U(W) = \ln(W)$. Consequently, an agent with $U(W) = W$ (risk neutrality) who follows Kelly is acting irrationally, as they are failing to maximize $E[W]$.

  This objection begs the question by presupposing that the expectation operator $E[\cdot]$—which mathematically represents an **ensemble average**—is the normative standard for rationality. In an ergodic system, the ensemble average (the average wealth of a population at time $t$) converges to the time average (the average wealth of one individual over time $t$). In such a world, it does not matter which average you use; they describe the same reality.

  However, wealth dynamics in investment and gambling are typically multiplicative ($W_{t+1} = W_t \cdot X_t$). Multiplicative processes are **non-ergodic**. In a non-ergodic system, the ensemble average and the time average diverge.
  *   The ensemble average grows at the arithmetic mean rate: $E[X]$.
  *   The time average grows at the geometric mean rate: $\exp(E[\ln(X)])$.

  When Samuelson claims that maximizing growth is "just log utility," he is implicitly asserting that the agent *ought* to care about the ensemble average. But a single, persisting agent does not experience the ensemble average. They experience one trajectory. To tell an agent they should maximize $E[W]$ is to tell them to optimize for a statistic that describes a population of parallel copies, none of which (except by chance) they will ever be.

  Therefore, the charge that Kelly is "just log utility" assumes the very point in contention: that rationality requires maximizing the ensemble expectation. If we accept the premise that rationality requires an agent to maximize the return *they actually experience*, then for multiplicative dynamics, maximizing the expected log-return is not a preference; it is a requirement of descriptive accuracy. The "utility function" is not doing the work here; the dynamics of the process are. To label this "risk aversion" is to psychologize a physical constraint.

  #### 2. The "Merely Asymptotic" Objection

  A common retreat for the expected-utility theorist is to concede that Kelly bettors dominate in the limit ($t \to \infty$) but to dismiss this as irrelevant for finitely-lived agents. The argument is that for any finite $T$, a risk-neutral agent maximizing $E[W_T]$ might have a higher expected wealth than a Kelly bettor, even if the Kelly bettor has a higher median wealth.

  This defense fails because it misunderstands the nature of the divergence. The divergence between the ensemble average and the time average is not merely a property of the limit; it is a property of the *distribution's shape* at every step.

  In a multiplicative process with positive variance, the distribution of wealth becomes log-normal. The mean of a log-normal distribution is pulled upward by an exponentially shrinking fraction of extremely wealthy outliers. As time progresses, the probability mass concentrates around the geometric mean (the median), while the arithmetic mean drifts away into the tail.
  *   **Samuelson's View:** Focuses on the mean of the distribution.
  *   **Geometric View:** Focuses on the mode/median of the distribution (the "typical" path).

  For a finite agent, the "asymptotic" argument is a red herring. The issue is not whether they live forever, but whether the *rate* of divergence between the expected path and the typical path outpaces the agent's horizon. In the toy case you provided (50% chance $\times 1.5$, 50% chance $\times 0.6$), the arithmetic expected return is positive ($1.05$), but the geometric return is negative ($\sqrt{0.9} \approx 0.95$).
  After just 10 rounds, the ensemble expectation suggests growth, but the probability of the individual agent having *lost* money is already substantial. After 100 rounds, the probability of ruin is near certainty for the non-Kelly bettor, despite the positive "expected value."

  To relegate this to "asymptotics" is to claim that an agent can rationally ignore a process that drains their capital with high probability in the near term, simply because the *mathematical expectation* remains high due to counterfactual branches of the wavefunction they will never visit. If rationality is about guiding action in the actual world, the statistic that predicts the actual trajectory (the time average) is normatively superior to the statistic that predicts a counterfactual population (the ensemble average), regardless of the time horizon. The "finite life" objection only holds if the agent can reset their wealth to the ensemble mean upon death, which they cannot.

  #### 3. The Hard Worry: Is Privileging the Time Average a Value Judgment?

  This is the most philosophically potent objection. One might argue: *Why must an agent care about their own time-average trajectory?* Perhaps the agent is a social planner caring about the ensemble (the population). Perhaps the agent intends to die young and leave a bequest, in which case the right tail of the distribution (the huge wins) matters more than the median survival. By insisting that the time average is the "correct" metric, isn't geometric rationality just smuggling in a specific utility function—one that values long-term persistence above all else?

  There is force to this objection, but it conflates **preferences over outcomes** with **preconditions for agency**.

  **The Distinction Between Constraints and Preferences**
  Expected Utility Theory treats the dynamics of the gamble as part of the lottery to be evaluated by the utility function. Geometric rationality treats the dynamics as a constraint on the feasible set of utilities.
  If an agent adopts a strategy that leads to ruin (an absorbing state at $W=0$), their utility function becomes undefined or irrelevant. You cannot maximize $U(W)$ if $W$ ceases to exist. Therefore, maximizing the time-average growth rate is a *instrumental necessity* for any agent whose utility function depends on remaining in the game. It is not that $U(W) = \ln(W)$; it is that for any $U(W)$ that is monotonic in wealth and requires $W > 0$, the geometric growth rate places a ceiling on achievable utility over time.

  **The "Value" of Persistence**
  Is valuing persistence a substantive value judgment? Yes. But it is a *transcendental* one. It is a precondition for having values at all. The ergodicity critique does not claim that an agent *cannot* choose to gamble for ruin (e.g., a "go for broke" strategy to pay a life-saving debt). It claims that labeling such a strategy "rational" in the general sense is a category error.
  *   **EUT:** Rationality = Consistency of preferences (even if they lead to ruin).
  *   **Geometric Rationality:** Rationality = Effectiveness of action in preserving the capacity to choose.

  If the advisor argues that privileging the time average is a value judgment, the response is that privileging the ensemble average is a *stronger* and less defensible value judgment. Privileging the ensemble average requires the agent to value counterfactual versions of themselves in parallel universes more than their actual future self. Privileging the time average requires only that the agent values their own continuity. In a decision theory meant to guide actual beings in actual time, the latter is the default normative baseline, not a contingent preference.

  **Conclusion: A Rival Ontology of Uncertainty**
  The dispute between Samuelson and the geometric rationalists is not merely a technical disagreement about which formula maximizes wealth. It is a disagreement about the ontology of uncertainty.
  *   **Samuelson** models uncertainty as a *spatial* distribution of possibilities (the ensemble), accessible via the expectation operator.
  *   **Peters/Kelly** model uncertainty as a *temporal* sequence of exposures (the time series), accessible via the growth rate.

  To dismiss geometric rationality as "log utility in disguise" is to refuse to engage with the non-ergodic nature of economic reality. It insists on applying equilibrium statistics to disequilibrium processes. The strongest version of the geometric position does not ask the expected-utility theorist to change their utility function; it asks them to acknowledge that before one can maximize utility, one must ensure the mathematical coherence of the process generating the wealth over which that utility is defined. If the process is multiplicative and non-ergodic, the expected logarithm is the only bridge between the probability space and the physical reality of the agent. Ignoring it is not a difference of taste; it is a calculation error regarding the nature of time.
