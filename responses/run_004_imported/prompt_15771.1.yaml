      *   *Switch Case (Standard):* DDE says permissible. Death of 1 is foreseen, not intended. The saving of 5 comes from redirecting the threat, not using the 1.
      *   *Footbridge Case:* DDE says impermissible. Death of 1 is intended as a means (his mass stops the trolley).
