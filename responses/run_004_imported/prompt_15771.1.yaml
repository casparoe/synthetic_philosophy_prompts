      *   *DDE & The Loop:* This is the famous counterexample *against* DDE (or at least a major challenge). Why? Because in the Loop case, the death of the 1 is arguably a *means* to saving the 5. If he weren't there (or if he were too light), the trolley would loop back and kill the 5. Therefore, his presence/death is causally necessary in a way that looks like "using him."
