  The train lurched, a metallic groan shuddering through the floorboards, but neither of them looked up from the small table between them. Marcus watched the condensation on his water glass; Elena was caping her pen with precise, repetitive clicks.

  **Marcus:** You're doing the thing with your pen. You only do that when you're constructing a syllogism to trap me in.

  **Elena:** I'm thinking about the keynote. And you're avoiding the draft I sent you.

  **Marcus:** I'm not avoiding it. I'm letting it breathe. Besides, we both know what you're going to say. Emotions are judgments. Full stop. If I'm angry, I've judged that I've been wronged. If I'm grieving, I've judged that I've lost something of value. It's so… tidy.

  **Elena:** It's accurate. You want to strip the intelligence out of the affect. You want us to be passive recipients of value, like retinas receiving light.

  **Marcus:** I want to account for the fact that I can know perfectly well a spider is harmless and still feel my stomach drop when one drops from the ceiling. That's recalcitrance, Elena. The judgment says "safe," the emotion says "danger." If emotion *is* judgment, that's a contradiction in the mind.

  **Elena:** It's not a contradiction if you distinguish between occurrent and dispositional judgment. In that moment, your higher-order reasoning says "safe," but your deeper evaluative commitment—the dispositional state—still assents to "danger." You haven't truly unlearned the threat.

  **Marcus:** That's special pleading. It's like saying the Müller-Lyer lines actually *are* unequal because some deep part of my visual cortex still believes it, even after I've measured them with a ruler. The lines look unequal despite my belief. The spider feels dangerous despite my knowledge. The module is encapsulated. It doesn't care what you believe.

  **Elena:** But vision isn't under voluntary control, and neither is the initial surge of affect. What matters is the assent. The Stoics knew this. You feel the pang, but you don't have to endorse it. If you endorse it, if you let it become fear rather than a startle, you've made a judgment.

  **Marcus:** And what about grief? Real grief. The kind that lasts years. You know, intellectually, that mourning isn't serving a purpose anymore. You know the loss is permanent and wailing won't fix it. Yet the sorrow persists. Are you saying the griever is constantly, actively judging that this loss is fresh? Or are they irrational for years on end?

  **Elena:** I'm saying grief isn't a single judgment. It's a complex narrative structure. When the pain spikes, it's because you're rehearsing the loss. You're bringing the value of what was lost back into occurrent focus. It's not a glitch; it's a reaffirmation of love.

  **Marcus:** Reaffirmation. That's a polite word for it. But it sounds like you're forcing the phenomenology to fit the theory. With the perceptual account, I don't have to say the griever is irrational. They perceive the value of the loss, just like I perceive the lines as unequal. The perception persists even when the belief changes. It's cognitive impenetrability.

  **Elena:** Cognitive impenetrability works for phobias, maybe. But try it on indignation. If I feel indignation, I'm not just sensing a "wrongness" in the air like a smell. I'm holding a proposition: *That person violated a norm.* You can't perceive a norm violation without understanding the norm. That's conceptual. That's propositional.

  **Marcus:** Perception isn't just raw sense data. I see a tree, not just green patches. I see a face, not just shapes. Why can't I see a wrong? Moral perception is still perception. It tracks value directly, without needing a syllogism in the background.

  **Elena:** Because seeing a tree doesn't require me to understand the concept of "tree" in the same way understanding a violation requires me to understand justice. You can't be indignant if you don't know the rule. That means the emotion is built out of judgments about rules. It's cognitive through and through.

  **Marcus:** So a child can't feel indignation until they can articulate the rule they've seen broken? That seems wrong. They feel the unfairness before they can parse the proposition. The emotion comes first; the justification is the post-hoc report.

  **Elena:** They feel a proto-emotion. A precursor. But full-blooded indignation? That requires assent to a claim about fairness. You're conflating arousal with emotion. We agreed years ago that mere feeling isn't enough.

  **Marcus:** We agreed feeling isn't *all* there is. I'm saying the feeling is the perceptual state that represents the value. It's not a judgment *that* something is valuable; it's a presentation *of* value. It's the difference between saying "This is dangerous" and feeling the threat looming.

  **Elena:** And that distinction saves you how? If the perception presents value, and I know the value isn't there—like the safe spider—why doesn't the perception vanish? If it's tracking value, it's tracking nothing. It's a hallucination.

  **Marcus:** It's an illusion, not a hallucination. There's a stimulus. The spider is there. The system is calibrated for survival, not truth. It's better to false-positive a threat than miss one. The system is doing exactly what it evolved to do, even if your higher cognition disagrees.

  **Elena:** So emotions are evolutionary heuristics that lie to us? That's a bleak view of human agency. It makes us passengers in our own lives. If my anger is just a module firing, I'm not responsible for it. I'm just… leaking affect.

  **Marcus:** You're responsible for what you *do* with it. Just like you're responsible for what you do when you see an illusion. You don't cut the lines because they look unequal. You don't strike the spider because it looks dangerous. You acknowledge the input, check it against reason, and act.

  **Elena:** But if the emotion *is* the judgment, then changing the judgment changes the emotion. That's the therapeutic promise. That's how we live. You convince yourself the rejection wasn't a catastrophe, and the grief lifts. If you're right, I'm stuck with the feeling forever, like a bad afterimage.

  **Marcus:** And if you're right, then anyone who suffers from recalcitrant emotion is just lying to themselves about what they believe. That's gaslighting, Elena. It tells the anxious person they secretly believe the plane will crash. They don't. They know it won't. They're just terrified.

  **Elena:** They believe it in the way that matters for action. They grip the armrest. They scan for exits. Their body is committed to the judgment of danger, regardless of what their mouth says.

  **Marcus:** Their body is committed. Their mind is split. That's my point. The perceptual system is running one track, the cognitive system another. You want to fuse them into a single line of text. I'm telling you the mind is a library with too many authors.

  **Elena:** And I'm telling you that without a single author, there's no self. Just a bundle of reactions. If I can't own my anger as a judgment I made, then it's not mine. It's just something that happened to me.

  **Marcus:** Maybe that's the truth we've been avoiding. Maybe we don't own them. Maybe we just inhabit them.

  **Elena:** Then what was the last ten years? Just a series of modular collisions?

  **Marcus:** No. That was us trying to read the same book in different languages.

  **Elena:** And now?

  **Marcus:** Now the train is stopped again. And we're still here.

  **Elena:** Still here. Judging the delay.

  **Marcus:** Perceiving the delay. There's a difference.

  **Elena:** Is there?

  The train whistle blew, sharp and lonely in the night, and the lights flickered before settling back into their dull hum. Neither of them moved to check their watches.
