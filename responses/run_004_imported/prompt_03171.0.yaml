      *   **Point 2: Intensionality vs. Extensionality.** Both bots care *how* the decision is made, not just *what* decision is made. A bot that cooperates for a different reason (e.g., altruism) might not trigger FairBot. This is the definition of a clique: membership based on internal structure.
