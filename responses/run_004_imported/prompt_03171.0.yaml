      *   *Modal Fixed Points:* The mathematical machinery relies on fixed points. Fixed points imply a kind of self-reference that mirrors the self-identity of CliqueBot.
      *   *Robustness Limits:* FairBot fails against agents that don't play the "proof game." It's a clique of logicians.
      *   *Intensionality:* Both bots inspect the *intension* (the code/logic) of the opponent, not just the *extension* (the output). True robustness would be extensional.

  4.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge the standard narrative (CliqueBot = brittle, FairBot = robust). State the thesis: FairBot is "CliqueBot for logicians." It replaces textual identity with *logical* identity.
