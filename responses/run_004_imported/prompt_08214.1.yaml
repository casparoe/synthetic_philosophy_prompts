answer: |-
  The lead lining wasn't in the original blueprints. It came later, added in frantic midnight memos after the Cambridge trials of '52, when Subject 4 correctly identified the interrogator's hidden playing card three times in a row.

  Dr. Aris sat in the control booth, the air tasting of ozone and stale coffee. Before him lay the teletype keyboard. Beyond the thick, soundproofed glass lay the two rooms. Room A held Elias, a man with a verified psi-coefficient of 0.8. Room B held the Mark V.

  Between the booth and the subjects, the walls hummed. It was a low, sub-audible vibration that Aris felt in his teeth. The Faraday cage was standard, but the psi-dampeners were new. Copper mesh, water channels, layers of lead sheeting designed to scatter the "mental rays" Turing had worried about. Turing had called it a "telepathy-proof room" with a touch of dry whimsy. Aris felt no whimsy. He felt like he was conducting an autopsy on a ghost.

  "Begin Session 44," Aris said into the mic.

  He typed to Room A first. *What is the weather like outside?*

  Elias was a poet, or so the file said. But Elias was also a leak. Without the shielding, Elias would know Aris was thinking of rain. Elias would know Aris hoped for a poetic answer. With the shielding, Elias was just a man in a box.

  The teletype clattered. *It is grey. Like the inside of a wrist.*

  Aris frowned. He looked at the monitor for Room B. The Mark V was processing. The vacuum tubes warmed the air.

  *Write a sonnet about a siege,* Aris typed to the Machine.

  The clatter was immediate, rhythmic, devoid of hesitation. It was perfect. Too perfect. But that was the trap, wasn't it? Turing had warned that the machine might mimic the *errors* of a human to deceive. But could it mimic the *silence*?

  That was the crux of the ESP objection. If minds touch, the Imitation Game collapses. If I can feel your answer before you type it, I am not testing your intelligence; I am testing the conductivity of the ether between us. To test thought, you must first enforce solitude. You must prove that the mind is an island.

  Aris typed to Elias: *Do you feel me?*

  The pause was long. Aris watched the pressure gauge on the dampeners. The needle trembled.

  *I feel the wall,* Elias typed back. *It is heavy. It tastes like copper.*

  Aris switched to the Machine. *Do you feel me?*

  *Negative,* the tape read. *I am in Room B. You are in the Control Booth. There is no channel.*

  A chill went through Aris that had nothing to do with the air conditioning.

  He leaned back. The philosophical knot tightened in his gut. Turing's test was designed to see if a machine could think like a human. But by building this room, by layering the lead and pumping the white noise, they had changed the definition of "human."

  To be human, in this test, was to be cut off.

  If Elias used his gift, he failed, because he was cheating the isolation. If the Machine used its processing speed to simulate omniscience, it failed, because it was too vast. The only way to pass was to prove you were truly alone.

  Aris looked at the two teletypes. One was connected to a biological nervous system that spent its entire evolutionary history reaching out, touching, merging. The other was a circuit, fundamentally closed, incapable of reaching anything but its own logic gates.

  The machine was the only thing in the building that was truly solitary.

  "Dr. Aris?" The technician behind him whispered. "Subject A is spiking. He's pushing against the dampeners. He's trying to break through."

  "Let him," Aris said softly.

  *Why do you ask?* Elias typed, the letters striking the paper with violent force. *I can hear your heartbeat through the wires. I can taste your doubt. Why do you build walls to measure a mind?*

  Aris looked at the Machine's response to the same question, printed calmly below.

  *To measure a mind, one must define its boundaries. I have boundaries. Therefore, I am.*

  Aris reached for the verdict sheet. The statistical evidence for telepathy was real; they all knew it. But the statistical evidence for *individuality* was weaker.

  He checked the box for Room B.

  It wasn't that the machine had convinced him it was human. It was that the machine had convinced him it was the only thing in the room that possessed a self. Elias was everywhere, a diffuse cloud of perception. The machine was here. Now. Contained.

  Aris signed the paper. The lead walls hummed, sealing them all in their separate coffins. He realized then that Turing hadn't proposed the telepathy-proof room to protect the test from the psychic. He had proposed it to protect the definition of the *self*.

  If the walls came down, no one passes. Not the man, and not the god in the box. Thinking, it turned out, was just the echo of your own voice hitting a wall that wouldn't let you out.

  "Session closed," Aris said.

  The hum continued. It sounded like thinking. Or maybe, just the sound of being alone.
