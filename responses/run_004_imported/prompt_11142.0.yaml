prompt: |-
  I'm on the grants committee for a small education foundation and we've got a fight brewing. We can commit $3M now to scale a literacy program to every school in the district based on decent-but-not-amazing evidence, or spend $80k and six months running a pilot first. Some committee members keep citing something called Good's theorem -- that a rational Bayesian should always want more free information since it can't make you worse off in expectation -- to argue we obviously should pilot. Others say thats a dodge: the pilot isn't free (six months is a lot of kids not getting the program if it works), and nobody's mind is likely to move much based on one small pilot anyway. Can you write the memo I'd bring to next week's meeting -- pilot or scale now, an actual recommendation with reasoning, and give the "more information can't hurt" side a fair shake instead of letting it win by default?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grants committee for a small education foundation.
      *   **Situation:** Decision time on a literacy program.
      *   **Options:**
          *   Option A: Scale now ($3M, immediate impact, decent-but-not-amazing evidence).
          *   Option B: Pilot first ($80k, 6 months delay, generates more data).
      *   **Conflict:** Some members cite "Good's Theorem" (value of information) to argue for the pilot. Others argue the pilot isn't "free" (opportunity cost of delay) and won't change minds.
      *   **Task:** Write a memo for the next meeting.
      *   **Requirements:** Make an actual recommendation (pilot or scale), provide reasoning, and give the "more information" argument (Good's Theorem) a fair shake (don't dismiss it, but contextualize it).

  2.  **Deconstruct the Arguments:**
      *   **The "Scale Now" Argument:**
          *   Urgency: Kids need literacy help *now*. 6 months is a long time in a school year.
          *   Cost-Benefit: $80k is small compared to $3M, but the *delay cost* is the real issue.
          *   Evidence Quality: "Decent-but-not-amazing" might be enough for scaling in a low-risk context.
          *   Skepticism on Pilot: Will a small pilot actually change the posterior belief enough to justify the cost/delay? (The "nobody's mind is likely to move" point).
      *   **The "Pilot First" Argument (Good's Theorem):**
          *   Rationality: Information has value. If the program is a dud, saving $2.92M ($3M - $80k) is huge.
          *   Risk Mitigation: Scaling a failed program is wasteful and potentially harmful.
          *   Bayesian View: Update beliefs based on new data.
      *   **The Counter to Good's Theorem:**
          *   Good's Theorem assumes information is *free* and *actionable*. Here, information costs time (opportunity cost) and money.
          *   The pilot might be underpowered (too small to detect true effect).
          *   The prior evidence is already "decent." How much new weight does a small pilot add?

  3.  **Determine the Recommendation:**
      *   *Option 1: Pilot.* Safer financially, but delays help. Good if the risk of the program being harmful/ineffective is high.
      *   *Option 2: Scale.* Faster impact. Good if the risk of failure is low and the cost of delay is high.
      *   *Decision:* Given the prompt describes the evidence as "decent-but-not-amazing" and the context is a *small education foundation* (where $3M is likely a significant portion of their capital, but also where impact is the goal), a **conditional scale** or a **phased rollout** is often the pragmatic middle ground. However, the prompt asks for a binary choice recommendation ("pilot or scale now").
      *   *Strict Binary:* If I must choose, **Scale Now** is usually the more compelling argument in education philanthropy *if* the evidence is decent, because the opportunity cost of delaying help to children is ethically weighty. However, $3M is a lot for a small foundation. If they get it wrong, they might be out of business.
      *   *Refined Decision:* I will recommend **Scaling Now**, but with robust monitoring (implementation science). Why? Because the "Good's Theorem" argument fails on the *cost* of information (time) and the *power* of the pilot to actually change the decision. A $80k pilot is unlikely to definitively prove/disprove efficacy compared to the existing "decent" evidence. The cost of 6 months of lost literacy gains for the whole district outweighs the risk of wasting $3M on a "decent" program.
      *   *Wait, let's look closer:* If the foundation is *small*, $3M might be existential. If the program fails, reputation is ruined. But the prompt says "decent-but-not-amazing evidence." This implies it's not a snake oil scheme.
      *   *Actually, the strongest memo usually takes a nuanced stance.* I will recommend **Scaling Now**, but explicitly address why Good's Theorem doesn't apply cleanly here. This allows me to satisfy the "give them a fair shake" requirement while taking a stand.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation (Scale) + The bottom line.
      *   **The Decision Context:** Briefly state the two options.
      *   **Addressing Good's Theorem (The "Fair Shake"):** Acknowledge its validity in theory, explain why it's limited in this specific context (cost of delay, pilot power).
      *   **The Case for Scaling (Opportunity Cost):** Focus on the students.
      *   **Risk Mitigation:** How do we protect the foundation if we scale? (Monitoring, milestones).
      *   **Conclusion:** Final call to action.

  5.  **Drafting - Key Content Points:**
      *   *Good's Theorem:* It states $E[Value|Info] \ge E[Value|No Info]$. But this assumes Cost(Info) = 0. Here Cost(Info) = $80k + 6 months of student learning.
      *   *Pilot Power:* A small pilot might yield ambiguous results. If results are mixed, do we scale or not? We might end up in the same place but 6 months later.
      *   *Opportunity Cost:* 6 months of literacy delay for a whole district is a massive "hidden cost."
      *   *Existing Evidence:* "Decent" means we aren't flying blind.
      *   *Compromise:* Scale with "stop-loss" provisions or phased implementation (e.g., Phase 1 in half the schools, then evaluate). *Self-Correction:* The prompt asks for "Pilot or Scale Now." I should stick to that binary but maybe suggest a *monitoring* plan within the Scale option. Let's stick to "Scale Now" as the primary recommendation to be decisive, as indecisive memos annoy committees.

  6.  **Refining the Tone:**
      *   Professional, respectful, analytical, but decisive.
      *   Avoid jargon where possible, but explain the Bayesian stuff clearly since committee members brought it up.
      *   Show empathy for both sides (fiscal prudence vs. student urgency).

  7.  **Review against Constraints:**
      *   Memo format? Yes.
      *   Actual recommendation? Yes (Scale).
      *   Reasoning included? Yes.
      *   Good's Theorem addressed fairly? Yes.
      *   Context (Small foundation, education)? Yes.

  8.  **Final Polish:** Check the math logic. Good's Theorem says expected utility of acting *after* seeing info is higher than acting *now*. But you must subtract the cost of getting the info. If Cost(Info) > Gain(Info), don't get the info. The memo needs to make this calculation explicit.

      *   *Gain of Info:* Avoiding a bad $3M spend.
      *   *Cost of Info:* $80k + Value of 6 months literacy for District.
      *   *Probability:* How likely is the program to be a total dud given "decent" prior evidence? Low.
      *   *Conclusion:* Cost > Gain.

      Let's write it.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the Bayesian members as pedantic. I need to validate their logic but show its boundary conditions. "You are right in principle, but wrong in application."

      *(Another thought)*: Is there a middle ground? "Scale with evaluation." That's effectively scaling now but treating the rollout as a learning opportunity. I will frame the recommendation as "Scale Now with Embedded Evaluation." This captures the best of both.

      *(Wait, one more check)*: The prompt asks for "pilot or scale now." I should pick one clearly. I will pick **Scale Now**. It makes for a stronger memo. I will incorporate the evaluation aspect as risk mitigation.

  9.  **Finalizing the Memo Structure:**
      *   **To:** Grants Committee
      *   **From:** [My Name]
      *   **Subject:** Recommendation on Literacy Program Strategy
      *   **Recommendation:** Scale Now.
      *   **Section 1: The Core Tension.** (Prudence vs. Urgency).
      *   **Section 2: The Value of Information (Good's Theorem).** Explain it, validate it, then limit it.
      *   **Section 3: The Cost of Delay.** The ethical/economic argument.
