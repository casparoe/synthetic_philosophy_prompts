answer: |-
  You are absolutely right that the modern scientific consensus contradicts Descartes' conclusion, but there is a crucial nuance in *why* he argued that way. Your summary is a very common understanding of the historical view, but Descartes' actual argument was metaphysical rather than anatomical.

  Here is a breakdown of where your understanding is correct, where it needs a slight historical adjustment, and how modern neuroscience effectively dismantles the Cartesian view.

  ### 1. The Correction: It wasn't about "primitive" hardware
  Descartes did not argue that animals couldn't feel pain because their nervous systems were "less developed" or "primitive" in an evolutionary sense (evolution wasn't a concept yet).

  Instead, his argument was based on **Substance Dualism**.
  *   **The Body (*Res Extensa*):** Descartes viewed the body (human or animal) as a machine made of matter. He believed nerves were hollow tubes filled with "animal spirits" (a fluid) that moved mechanically to cause reflexes.
  *   **The Mind (*Res Cogitans*):** He believed the capacity to *feel* pain (the subjective experience of suffering) required an immaterial soul/mind.
  *   **The Divide:** He argued that humans have both a machine-body and a soul. Animals, he claimed, have **only** the machine-body.

  Therefore, when a dog yelps after being kicked, Descartes argued it was no different than a clock chiming when a lever is pulled. The "hardware" wasn't necessarily "primitive"; it was just **soulless**. He believed the dog's body was reacting mechanically, but there was "nobody home" to experience the suffering.

  ### 2. The Port-Royal Anecdotes
  You are historically correct about the Cartesians at Port-Royal. While there is some debate among historians about how systematically they practiced vivisection, there are well-documented accounts of Cartesian followers behaving this way.
  *   **Nicolas Malebranche**, a prominent follower of Descartes, famously claimed that animals "eat without pleasure, cry without pain, grow without knowing it, and desire nothing, fear nothing, and know nothing."
  *   There are accounts of Cartesians kicking pregnant dogs or vivisecting them while dismissing the screams as the "grinding of gears" in a machine. They felt no moral guilt because, in their view, no *being* was being hurt, only a mechanism broken.

  ### 3. The Empirical Debunking
  You hit the nail on the head regarding modern neuroscience. Descartes' position relies on the idea that pain behavior (yelping, withdrawing, avoiding) can exist without pain *experience*.

  Modern neuroscience has largely collapsed this distinction for mammals:
  *   **Homologous Structures:** Animals possess the same nociceptors (pain receptors), spinal cord pathways, and brain structures (thalamus, limbic system, and cortical equivalents) that process pain in humans.
  *   **Neurochemistry:** Animals produce the same neurotransmitters and hormones (endorphins, cortisol, substance P) in response to injury that humans do.
  *   **Behavioral Evidence:** Animals don't just reflexively withdraw; they nurse wounds, protect injured limbs for days, avoid places where they were hurt, and will self-administer analgesics (painkillers) if given the opportunity.

  **So, is it empirically debunked?**
  **Yes, effectively.** While you cannot scientifically "disprove" the existence of a soul (since it's a metaphysical claim), science has removed the **necessity** of Descartes' explanation.
  *   **Descartes' Logic:** Pain behavior + No Soul = No Pain Feeling.
  *   **Modern Logic:** Pain behavior + Identical Pain Hardware + Evolutionary Continuity = Pain Feeling.

  Because we can fully explain pain behavior through physical brain states that are identical in humans and animals, positing that animals are "unfeeling zombies" violates **Occam's Razor**. There is no evidence to support the claim that the lights are "off" in an animal's brain when the hardware is firing exactly like ours.

  ### 4. Why Descartes got it wrong
  Descartes wasn't being cruel for the sake of cruelty; he was trying to protect human theology.
  *   If animals had souls and could feel pain, theologians worried it would raise difficult questions: Do animals go to heaven? Is it a sin to eat meat?
  *   By making humans the *only* beings with souls, he secured a special place for humanity in the religious order.
  *   He also used **Language** as his primary test. He argued that even a stupid human can arrange words to express a new thought, whereas even the smartest animal cannot. He took this inability to use language as proof of the inability to think or feel. We now know that language is not a prerequisite for sentience or suffering.

  ### Summary
  You are correct that the position is untenable today.
  1.  **Historically:** Descartes argued from **dualism** (lack of a soul), not just anatomical complexity, though the result was the same.
  2.  **Scientifically:** Neuroscience confirms that the "machinery" of pain is functionally identical in humans and other mammals.
  3.  **Ethically:** Because the hardware is the same, the assumption of subjective experience is the only rational default.

  The Cartesian view is indeed considered empirically obsolete. It survives only as a historical footnote in philosophy and a warning in bioethics about the dangers of denying inner experience to beings that cannot speak for themselves.
