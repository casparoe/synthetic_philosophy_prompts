  A friend and I spent a good part of an evening arguing about Aquinas's political philosophy and never quite reached an agreement. My position was that, since Aquinas explicitly approves of killing tyrants in works such as De Regimine Principum, he should be counted as a genuine forerunner of later resistance theories that grant ordinary subjects a standing right to rise up and assassinate an unjust ruler. My friend thought this overstated matters but struggled to cite a specific passage in response. Was I basically right to read Aquinas this way, or is my friend's hesitation textually justified?
