answer: |-
  This is a classic debate in the history of political thought, and while your position is a common one (especially among early modern resistance theorists who *claimed* Aquinas), **your friend is more textually justified.**

  Reading Aquinas as a direct forerunner to later theories that grant *ordinary subjects* a standing right to assassinate unjust rulers is generally considered an anachronistic overstatement by modern scholars. While Aquinas certainly condemns tyranny in the strongest possible terms, his proposed remedies rely on **public authority** rather than **private violence.**

  Here is the textual breakdown that supports your friend's hesitation.

  ### 1. The Authorship Trap: *De Regimine Principum*
  The first hurdle in your argument is the text itself. *De Regimine Principum* (On Kingship) is unfinished.
  *   **Book I** is universally accepted as written by Aquinas.
  *   **Book II** is widely attributed to his student, **Ptolemy of Lucca**.

  Book II contains much stronger republican language and more explicit justifications for removing rulers. If your argument relies on passages found in Book II, you are actually citing Ptolemy, not Aquinas. The core discussion of tyranny in the authentically Thomistic section is found in **Book I, Chapters 6 and 7.**

  ### 2. The Key Passage: *De Regno* I.7
  In Book I, Chapter 7, Aquinas explicitly addresses the question of how to deal with a tyrant. He outlines several options, and his treatment of assassination is cautious, not endorsing.

  He argues that attempting to kill a tyrant privately is dangerous and often illicit. He writes:

  > "To proceed against the excess of tyrants... **it is not for private presumption to take this upon themselves** (*non est privatae praesumptionis hoc sibi assumere*)."

  Aquinas gives three reasons why private assassination is problematic:
  1.  **It risks greater evil:** Killing a tyrant often leads to greater turmoil or a worse successor.
  2.  **It undermines order:** If private individuals take it upon themselves to judge and execute rulers, it destabilizes the very concept of authority.
  3.  **Biblical Precedent:** He acknowledges the Old Testament example of Ehud killing King Eglon (Judges 3), but he frames this as a specific instance of **divine inspiration**, not a general political right available to citizens under the New Law.

  ### 3. Public Authority vs. Private Right
  Aquinas's solution to tyranny is institutional, not revolutionary. He argues that if a community has the right to elect a king, **that same public authority** can depose him if he becomes a tyrant.

  > "If it belongs to the multitude to provide itself with a king, it is not unjust that the king be deposed or have his power restricted by that same multitude if he tyrannically abuses the royal power."

  Note the distinction: This is not a "right of resistance" granted to individuals; it is a **public act of deposition** by the community or a superior authority (like an Emperor over a King). For Aquinas, the "multitude" acts as a corporate body with public authority, not as a mob of private individuals exercising a right to murder.

  ### 4. The *Summa Theologiae* on Sedition
  In the *Summa Theologiae* (II-II, q. 42, a. 2), Aquinas defines sedition as a special sin opposed to the unity of the multitude. While he admits that a tyrant creates sedition by disrupting the common good, he does not automatically grant subjects the license to create counter-sedition.

  He argues that resisting a ruler is permissible only if the ruler's commands contradict Divine Law or if the resistance is authorized by a higher public power. He does not grant a standing license for private conscience to justify regicide.

  ### 5. Why the Confusion Exists
  You are not alone in your reading. During the 16th and 17th centuries, Catholic Jesuit thinkers (like Mariana) and Protestant Monarchomachs (like Knox) both tried to claim Aquinas for their theories of tyrannicide. They often blurred the line between Aquinas's text and Ptolemy's additions, or they interpreted Aquinas's "public authority" clause loosely enough to include private actors in extreme cases.

  However, modern textual scholarship distinguishes between:
  *   **Aquinas:** Tyranny is a sin; deposition should be done by public authority; private assassination is generally forbidden unless divinely mandated.
  *   **Later Resistance Theory:** Subjects have a natural or contractual right to kill a ruler who violates the trust of governance.

  ### Verdict
  Your friend is right to hesitate. Aquinas provides a **theory of public deposition**, not a **theory of private tyrannicide.**

  *   **You are right that:** Aquinas believes tyranny is the worst form of government and that a tyrant can be removed.
  *   **Your friend is right that:** Aquinas does not grant ordinary subjects a standing right to assassinate rulers. He explicitly warns against "private presumption" taking the law into their own hands.

  To call Aquinas a forerunner of *resistance theory* in the Lockean or revolutionary sense is to project later political developments back onto a medieval thinker who prioritized order and public authority above individual rights of violence.
