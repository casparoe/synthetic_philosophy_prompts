answer: |-
  You are absolutely right to be frustrated. The secondary literature on Jain logic is notoriously sloppy, often collapsing three distinct technical categories into a vague "philosophy of tolerance." You have correctly identified that *Anekantavada*, *Nayavada*, and *Syadvada* are not synonyms; they are a structured system moving from metaphysics to epistemology to logic.

  You also correctly identified the weak point: without a rigorous logical structure, the Seven-Fold Predication (*Saptabhangi*) looks like a license for contradiction.

  Here is the breakdown of the actual logical machinery, how it preserves the Law of Non-Contradiction, and how Jain logicians handle the self-refutation objection.

  ### 1. The Three-Part Structure (Metaphysics $\rightarrow$ Epistemology $\rightarrow$ Logic)

  To stop them from blurring together, you have to view them as a pipeline:

  1.  **Anekantavada (The Metaphysics):** This is the claim about reality itself. It states that existence is complex (*anekanta*). Every entity (*dravya*) has infinite attributes (*gunas*) and undergoes infinite modes (*paryayas*). Therefore, no finite being can comprehend the totality of an object in a single cognitive act.
      *   *Job:* Defines the ontology. Reality is many-sided.
  2.  **Nayavada (The Epistemology):** This is the theory of partial standpoints. A *naya* is a specific way of accessing that complex reality. Jainism classifies these (e.g., *Naigama-naya* looks at the universal purpose, *Sangraha-naya* looks at the class, *Vyavahara-naya* looks at the current practical state).
      *   *Job:* Validates partial knowledge. A *naya* is not "false"; it is a true but incomplete slice of the whole. Error arises only when you mistake a *naya* for the whole truth (*nayabhasa*).
  3.  **Syadvada (The Logic/Language):** This is the doctrine of conditioned predication. Since reality is many-sided (Anekanta) and we access it partially (Naya), our language must reflect that conditioning. This is where *Syat* comes in.
      *   *Job:* Prevents logical contradiction by qualifying every proposition.

  **The Distinction:** *Anekantavada* says the jar is complex. *Nayavada* says looking at the jar's color is a valid but partial way to know it. *Syadvada* says you must preface your statement "The jar is blue" with *Syat* to acknowledge you are speaking from the standpoint of color, not substance, time, or location.

  ### 2. The Logical Structure of *Saptabhangi* (Seven-Fold Predication)

  Your intuition about *Syat* is correct: it does not mean "maybe" (epistemic uncertainty). It means "conditionally" or "from a specific standpoint" (ontological conditioning).

  The charge of violating the Law of Non-Contradiction (LNC) assumes that "is" and "is not" are being predicated of the subject in the **same respect, at the same time, in the same sense.** Jain logic argues they are not.

  To understand how "It is" and "It is not" can both be true without contradiction, you need the Jain ontology of **Substance (*Dravya*), Attribute (*Guna*), and Mode (*Paryaya*).**

  *   **Substance:** The underlying reality that persists (e.g., the clay/gold/existence).
  *   **Mode:** The changing state (e.g., the shape of the jar, the current time).

  **How the 7 Modes avoid contradiction:**
  When a Jain logician says:
  1.  *Syat asti* (In some sense, it is)
  2.  *Syat nasti* (In some sense, it is not)

  They are not saying $A \land \neg A$. They are saying:
  *   $(A \text{ is true relative to Substance/Time } T_1)$
  *   $(A \text{ is false relative to Mode/Time } T_2)$

  **Example:** A clay jar.
  *   *Syat asti:* From the standpoint of its current form and function, it **is** a jar.
  *   *Syat nasti:* From the standpoint of its past (it was clay) or its future (it will be shards), it **is not** a jar. Or, from the standpoint of a gold cup, this jar **is not** that cup.
  *   *Syat asti-nasti:* From the standpoint of the whole timeline, it **is and is not** a jar (it is becoming and perishing simultaneously).

  **The "Indescribable" (*Avaktavya*):**
  This is the most misunderstood mode. It is not mysticism. It is a linguistic constraint.
  Jain logic posits that reality is simultaneous, but language is sequential. You cannot speak the "is" (substance) and the "is not" (mode) in the same syllable. Therefore, the simultaneous totality is *avaktavya* (inexpressible) in a single proposition. It requires the seven-fold structure to unpack.

  **The Logical Safeguard:**
  The LNC is preserved because *Syat* functions as a **parameter indexer**.
  In modern logic terms, think of *Syat* as adding a variable to the predicate: $P(x, s)$, where $s$ is the standpoint.
  $P(x, s_1)$ can be True while $P(x, s_2)$ is False without contradiction. The contradiction only arises if you claim $s_1$ is the *only* standpoint (which is *Ekantavada*, the one-sided view Jainism rejects).

  ### 3. Does it collapse into Relativism?

  This is the most common critique: "If everything depends on the standpoint, is anything objectively true?"

  The Jain answer is **No.** They distinguish between **Relativism** (all views are equally valid) and **Pluralistic Realism** (all views are partial reflections of an objective whole).

  *   **Objective Reality Exists:** The *Kevalin* (omniscient being) sees the object in its totality. The object *has* definite properties.
  *   **Finite Access:** Non-omniscient beings cannot access the totality.
  *   **Validation:** A statement is not "true" just because it's a perspective. It must correspond to a valid *naya*. If I say "The jar is a cow," that is not a valid *naya*; it is error (*viparyaya*). If I say "The jar is clay," that is a valid *naya* (substance standpoint).

  So, it avoids trivial relativism by maintaining that there is a "whole truth" (accessible only to omniscience) and that our statements are graded by how adequately they map to the *nayas* of that whole truth.

  ### 4. The Self-Refutation Objection ("Is *Anekantavada* itself one-sided?")

  This is the "Gotcha" you mentioned: *If all truth is partial, is the statement "all truth is partial" itself partial?*

  *   **If Yes:** Then it's not universally binding. Why should I accept it?
  *   **If No:** Then you have admitted an absolute truth, contradicting your own doctrine.

  **The Jain Defense:**
  Jain logicians (like Haribhadra and Yasovijaya) handle this by categorizing *Anekantavada* not as a metaphysical proposition about the world, but as a **methodological rule for finite cognition.**

  1.  **Scope Limitation:** The doctrine applies to *non-omniscient* knowledge (*mati* and *sruta*). It does not apply to omniscient knowledge (*kevala jnana*). For the *Kevalin*, truth is absolute and one. For everyone else, it is partial. Therefore, the statement "All truth is partial" is shorthand for "All truth accessible to non-omniscient beings is partial." This makes the statement itself conditionally true, not absolutely self-refuting.
  2.  **The "Medicine" Analogy:** *Anekantavada* is prescribed as an antidote to *Ekantavada* (dogmatism). Once dogmatism is cured, the antidote isn't needed. It is a tool for discourse, not a dogma to be clung to.
  3.  **Self-Inclusion:** Some advanced Jain logicians argue that *Anekantavada* *does* include itself in its own scope. It admits, "This very doctrine is a *naya*." It is the *highest* *naya* available to us because it is the only one that acknowledges its own limitation. It doesn't claim to be the Absolute; it claims to be the most accurate map of our limitation.

  ### Summary of the Logical "Stop-Gap"

  To answer your core question: The structure that stops the seven-fold predication from collapsing into "anything goes" is the **rigorous requirement of standpoint specification.**

  You cannot simply say "The jar is and is not." You must be able to specify *in what respect* it is and *in what respect* it is not (Substance vs. Mode, Time $T_1$ vs. Time $T_2$, Location $X$ vs. Location $Y$). If you cannot specify the parameters, the predication is invalid.

  This turns *Syadvada* from a "license to contradict" into a **logic of context.** It forces the speaker to define the boundaries of their claim before making it. The rival schools (Nyaya and Buddhist) attacked this for centuries, but the Jain defense held because it offered a more robust solution to the problem of change and permanence than the Buddhist *Momentariness* (which struggles to explain continuity) or the Nyaya *Absolutism* (which struggles to explain change).

  So, you aren't missing a hidden layer; you are seeing the cracks in the secondary literature. The primary texts (like the *Tattvartha Sutra* or commentaries by Haribhadra) are much more rigorous about the *conditions* of *Syat* than modern pop-philosophy summaries suggest.
