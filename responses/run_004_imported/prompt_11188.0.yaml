answer: |-
  You are absolutely right to be suspicious of the "they're the same puzzle" take. It's a common piece of rationalist shorthand that glosses over a critical fault line. While both puzzles exploit time-inconsistency and the tension between *ex-ante* and *ex-post* rationality, they are attacking different layers of the agent's architecture.

  Kavka's Toxin is primarily a puzzle about the **metaphysics of intention** (philosophy of action).
  Parfit's Hitchhiker is primarily a puzzle about **algorithmic selection** (normative decision theory).

  Conflating them is like conflating "Can a computer run this code?" with "Is this the right code to run?" One is about capacity, the other about optimization. Here is the breakdown of where they align, where they diverge, and why Hitchhiker is the heavier lift for a Causal Decision Theory (CDT) defender.

  ### 1. The Structural Isomorphism (Where they look the same)
  On a whiteboard, the decision trees look nearly identical.
  *   **Time $t_1$:** A verifier assesses you. If you pass, you get a reward (Money / Lift).
  *   **Time $t_2$:** You have an opportunity to perform a costly action (Drink / Pay).
  *   **The Trap:** At $t_2$, the reward is already secured (or safety is achieved). The costly action is now strictly dominated. A rational agent at $t_2$ will not do it.
  *   **The Paradox:** If you know you won't do it at $t_2$, how can you pass the test at $t_1$?

  In both cases, standard CDT leads to a suboptimal outcome (No money / Death in the desert) because the CDT agent cannot credibly commit to a future action that will be irrational when the time comes.

  ### 2. The Divergence (Where they pull apart)

  This is where your intuition is spot on. The mechanics of the "Verifier" and the "Stakes" differ fundamentally.

  #### A. The Object of Verification
  *   **Toxin:** The billionaire's machine scans your **mental state**. It checks for *sincere intention*.
      *   *Implication:* This requires *doxastic voluntarism* (the ability to choose beliefs/intentions at will). To win, you must believe you will drink, even though you know drinking is irrational.
  *   **Hitchhiker:** The driver scans your **disposition/algorithm**. He checks for a *prediction of behavior*.
      *   *Implication:* This does not require you to "believe" you will pay in a mystical sense; it requires your decision algorithm to output "Pay" in the relevant counterfactual scenario. The driver doesn't care about your qualia; he cares about your source code.

  #### B. The Role of the Future Action
  *   **Toxin:** The action (drinking) is **causally inert** regarding the reward. The money is wired at midnight. Drinking happens at noon. Drinking literally does nothing to secure the payoff.
      *   *Consequence:* The puzzle is purely about whether you can hold a contradictory mental state (intending $X$ while knowing you won't do $X$).
  *   **Hitchhiker:** The action (paying) is **logically linked** to the reward via the prediction. The lift is granted *because* the driver predicts you will pay.
      *   *Consequence:* The puzzle is about whether your decision procedure can account for the logical correlation between your future choice and the past prediction.

  #### C. The Nature of the "Failure"
  *   **Toxin:** If you fail, it's because you are **psychologically incapable** of forming the intention. You look at the toxin, calculate the utility, see it's negative, and your mind refuses to intend it.
  *   **Hitchhiker:** If you fail, it's because your **decision rule is dominated**. You are in town, you calculate the utility of paying, see it's negative, and your rule says "Don't Pay."

  ### 3. Theoretical Handling: Bratman vs. McClennen

  This distinction clarifies why different philosophical tools are needed for each.

  **Kavka's Toxin & Bratman's Planning Theory:**
  Michael Bratman argues that intentions are not just desires; they are plan-states that constrain future deliberation. For Bratman, Toxin is a category error. You cannot intend to do something you know you will not do, because intention entails a belief in the likelihood of success.
  *   *Verdict:* Bratman would say the puzzle is unsolvable for a rational agent, not because of decision theory, but because **rational intention requires rational expectation of action.** A CDT agent (or any consequentialist) knows the action is irrational, so they literally *cannot* intend. The "solution" here isn't a better decision theory; it's acknowledging a limit on the architecture of agency.

  **Parfit's Hitchhiker & McClennen's Resolute Choice:**
  Edward McClennen's *Resolute Choice* is tailor-made for Hitchhiker. He argues that rational agents should not maximize at every node (sophisticated choice) but should adhere to a plan selected *ex-ante* (resolute choice).
  *   *Verdict:* McClennen solves Hitchhiker by saying, "I chose the policy 'Pay if Lifted' back in the desert. I am now resolute." This works because the verifier (driver) was checking for that policy.
  *   *Does Resolute Choice solve Toxin?* Not really. Resoluteness helps you *stick* to a plan to drink. But Toxin doesn't require you to stick to the plan; it requires you to *have the plan* while knowing you won't stick to it. Resoluteness makes you drink the toxin (which is irrational), whereas Toxin rewards you for *intending* to drink without requiring the drinking. McClennen's agent drinks the toxin and loses utility; Kavka's agent needs to intend without drinking.

  ### 4. The Verdict: Which is harder for CDT?

  **Parfit's Hitchhiker is the harder case for CDT.**

  Here is the reasoning, stripped of the usual hand-waving:

  1.  **Scope of Critique:** Toxin attacks the *philosophy of mind* underlying the agent. It asks, "Can a consequentialist mind form this specific mental state?" Hitchhiker attacks the *decision calculus* itself. It asks, "Does this decision rule maximize utility?" CDT is a theory about decision rules, not a theory of mind. Therefore, Hitchhiker is a direct hit on CDT's home turf.
  2.  **Solvability:** Hitchhiker is solvable by alternative decision theories (EDT, FDT, UDT) without requiring magical mind-control. FDT, for instance, says "My output determines the driver's prediction," so it pays. Toxin remains problematic even for FDT. An FDT agent knows that drinking the toxin yields no utility. Can an FDT agent *intend* to do something it calculates as useless? If "intention" implies "expectation of action," FDT also fails Toxin. Toxin might be a paradox for *any* rational consequentialist, whereas Hitchhiker is specifically a paradox for *Causal* Decision Theorists.
  3.  **The "Why Ain't Cha Rich" (WACR) Force:** In Hitchhiker, the CDT agent dies (or is stranded). This is a pragmatic failure of the theory to guide action toward survival. In Toxin, the CDT agent simply remains poor but healthy. While missing out on money is a WACR failure, the Toxin puzzle relies on the controversial premise that "intention" is a verifiable, distinct mental state. If you deny that intentions are verifiable distinct from dispositions to act, Toxin dissolves into Hitchhiker. But if you accept the premises, Toxin shows that **no** rational agent can win, whereas Hitchhiker shows that **CDT** agents lose while FDT agents win.

  **The Sharp Take:**
  The rationalist forum conflation happens because they want to use Toxin to motivate FDT. But Toxin is a red herring for FDT. FDT solves Newcomb problems by treating your decision as a logical output that correlates with predictions. Hitchhiker is a Newcomb-like problem (Prediction correlates with Action). Toxin is *not* Newcomb-like; the money is already in the bank before the action. The correlation is between *Intention* and *Money*, not *Action* and *Money*.

  If you are defending plain CDT:
  *   **Against Toxin:** You can shrug. "CDT is a theory of action, not intention. If the billionaire rewards irrational mental states, that's on him. I won't drink the toxin, and I can't intend to. I'm consistent."
  *   **Against Hitchhiker:** You have no shrug. You are dead in the desert. Your theory told you not to pay, which caused the driver to leave you. Your theory failed to maximize utility in a clear, standard interaction.

  **Conclusion:**
  Bring this back to your group chat: Toxin is a puzzle about whether we can lie to ourselves (Intention). Hitchhiker is a puzzle about whether we can bind our future selves (Commitment). CDT can survive the accusation that it can't lie to itself. It cannot survive the accusation that it leaves its users dead in the desert. Hitchhiker is the killer; Toxin is just a riddle.
