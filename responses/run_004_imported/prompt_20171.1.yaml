      *   *Avoid Moralizing:* Keep it technical and economic. The user asked for a principled reason, not a moral one.
      *   *Rationalist Lens:* Use terms like "positive sum vs. zero sum," "information asymmetry," "tail risk," "black box."

  7.  **Structure of the Response:**
