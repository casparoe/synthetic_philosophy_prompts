prompt: |-
  I've been down a rabbit hole reading about "evidential cooperation in large worlds" (ECL) from the rationalist/EA corner of the internet - the idea that we should act cooperatively toward agents we can never causally contact (like aliens on the other side of the universe, or versions of us in a different branch of the multiverse) because our choice is correlated evidence about what they choose, even with zero causal link between us. Then I noticed it used to just be called "multiverse-wide superrationality," which makes me think its basically just Hofstadter's old superrationality idea (the one with the twenty strangers and the prize) scaled up to the whole universe. Is that basically right, or is there something actually new going on in ECL that plain superrationality doesn't already capture? Every explaination I find just treats the two as interchangeable instead of spelling out the difference.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL).
      *   **Context:** Rationalist/Effective Altruism (EA) community.
      *   **Core Question:** Is ECL just Hofstadter's "superrationality" scaled up to the multiverse, or is there something substantively new/different?
      *   **Observation:** The user notes that explanations often treat them as interchangeable, but they suspect there might be a distinction.
      *   **Goal:** Clarify the relationship between ECL and superrationality, highlighting similarities, differences, and what (if anything) is "new" in ECL.

  2.  **Deconstruct the Concepts:**
      *   **Hofstadter's Superrationality:**
          *   Origin: *Scientific American* columns (1980s), *Metamagical Themas*.
          *   Scenario: Prisoner's Dilemma (PD) with identical/similar rational agents.
          *   Mechanism: "If I'm rational, they are rational. We think alike. Therefore, if I cooperate, they cooperate. If I defect, they defect."
          *   Assumption: High correlation in *reasoning processes* leading to identical actions.
          *   Scope: Usually small groups (e.g., 20 strangers), often assumes identical agents.
      *   **Evidential Cooperation in Large Worlds (ECL):**
          *   Origin: Caspar Oesterheld, Vincent Conitzer, etc. (2010s/2020s). EA/Rationalist discourse.
          *   Scenario: Agents across vast spacetime (causally disconnected), potentially different values, different architectures.
          *   Mechanism: Evidential Decision Theory (EDT) + Logical Correlation. My action is *evidence* of their action.
          *   Assumption: Correlation exists due to shared logical facts, initial conditions, or convergence of optimization, even without causal contact.
          *   Scope: "Large Worlds" (infinite/multiverse), diverse agents (value learning, compromise).
          *   Key Addition: *Compromise* (value handshakes) rather than just simple PD cooperation.

  3.  **Compare and Contrast:**
      *   **Similarities:** Both rely on acausal correlation. Both suggest cooperation in PD-like scenarios where Causal Decision Theory (CDT) suggests defection. Both rely on the idea that "thinking the same way" links outcomes.
      *   **Differences:**
          *   *Decision Theory:* Superrationality is often informal/philosophical. ECL is explicitly grounded in EDT (and sometimes FDT - Functional Decision Theory).
          *   *Scope:* Superrationality is usually "identical agents." ECL explicitly deals with *different* agents who merely have correlated reasoning.
          *   *Goal:* Superrationality solves the PD. ECL aims for *value compromise* across the multiverse (trading influence for influence).
          *   *Rigour:* ECL is more formalized (papers by Oesterheld et al.). Superrationality was more of a thought experiment.
          *   *The "Large World" aspect:* ECL specifically leverages the size of the universe to argue that even tiny correlations matter because the stakes (number of agents) are infinite/huge.

  4.  **Identify the "New" Stuff in ECL:**
      *   It's not *just* scaling up.
      *   **Value Compromise:** The biggest innovation. It's not just "we both cooperate in a one-shot PD." It's "I will promote your values in my local region if you promote mine in yours," even if we can't verify it.
      *   **Formalization:** ECL is tied to specific decision theories (EDT/FDT) and Bayesian reasoning about logical correlations.
      *   **Empirical Claims:** ECL makes claims about the likelihood of correlation in a large universe (cosmological arguments).
      *   **Normative Shift:** It moves from "how to win a game" to "how to structure moral obligations across spacetime."

  5.  **Drafting the Response:**
      *   *Acknowledge the intuition:* Yes, the user is largely right. ECL *is* the spiritual successor to superrationality.
      *   *Validate the connection:* Hofstadter planted the seed; Oesterheld/Conitzer/etc. built the formal garden.
      *   *Highlight the distinctions (The "Actually New" parts):*
          1.  **Decision Theoretic Grounding:** Superrationality was vague; ECL is explicitly EDT/FDT.
          2.  **Heterogeneity:** Superrationality assumes identicality; ECL handles different values (compromise).
          3.  **The "Large World" Bet:** ECL relies on the cosmological assumption that the universe is vast enough to make tiny correlations high-stakes.
          4.  **Action Guidance:** ECL is more prescriptive about *what* to do (value handshakes) rather than just *how* to think.
      *   *Address the "Interchangeable" confusion:* Explain why people conflate them (same core mechanism) but why the distinction matters for implementation.
      *   *Criticism/Skepticism:* Briefly mention that both are controversial (CDT defenders, correlation skepticism) to provide balance.

  6.  **Refining the Tone:**
      *   Keep it intellectual but accessible.
      *   Avoid overly dense jargon where possible (explain EDT/FDT briefly).
      *   Respect the user's digging (they've done their homework).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I emphasize the "value compromise" aspect enough? That's the biggest practical difference. Superrationality is usually about getting the prize in a PD. ECL is about maximizing total value across the multiverse by trading local influence.
      *   *Check:* Did I distinguish between EDT and FDT? ECL is often associated with EDT, but FDT (Yudkowsky/Soares) is the modern formalization of superrationality. I should mention FDT as the bridge.
      *   *Check:* Is the "Large World" aspect clear? Yes, emphasize that the *size* of the world makes the expected value calculation work even with low probability of correlation.

  8.  **Final Polish:** Organize with clear headings. Ensure the conclusion directly answers "Is that basically right?" (Yes, but with nuances).

