answer: |-
  You have a very sharp intuition here. You are **mostly right**: Evidential Cooperation in Large Worlds (ECL) is indeed the direct intellectual descendant of Hofstadter's superrationality. If Hofstadter planted the seed, the modern rationalist/EA community (specifically researchers like Caspar Oesterheld, Vincent Conitzer, and others at the Center for AI Safety and similar circles) has built the formal architecture around it.

  However, saying they are *purely* interchangeable misses a few crucial refinements that make ECL distinct in practice, scope, and normative ambition.

  Here is the breakdown of where they overlap, where they diverge, and what is actually "new" in ECL.

  ### 1. The Core Overlap (Where you are right)
  You correctly identified the engine driving both concepts: **acausal correlation.**

  *   **Hofstadter's Superrationality:** In a one-shot Prisoner's Dilemma with identical rational agents, I should cooperate because my reasoning process is identical to theirs. If I decide to cooperate, that is *evidence* (or even a logical fact) that they will cooperate.
  *   **ECL:** In a vast universe (or multiverse), my decision is logically correlated with the decisions of other agents, even those causally disconnected from me. Therefore, I should act in a way that, if mirrored by those correlated agents, produces the best global outcome.

  In both cases, the agent rejects Causal Decision Theory (CDT)—which says "my action cannot physically change their action, so I should defect"—in favor of a framework where your action provides *evidence* about the state of the world (including other agents' actions).

  ### 2. What is Actually New in ECL?
  While the *mechanism* is the same, ECL adds three layers of sophistication that Hofstadter's original thought experiment did not fully address.

  #### A. From "Identical Agents" to "Value Compromise"
  Hofstadter's examples (like the 20 strangers) usually assume the agents are **identical**. If we are all perfect copies of "Hofstadter," we will all output the same answer.
  ECL explicitly deals with **heterogeneous agents**.
  *   **The Problem:** I am a human with human values. The agent on the other side of the multiverse might be an AI with different terminal goals. We are not identical.
  *   **The ECL Solution:** We can still correlate on the *meta-level* of "cooperating with correlating agents." ECL proposes **acausal trade** or **value handshakes**. I will promote your values in my local region of the universe, in exchange for you (or your correlated counterparts) promoting my values in your region.
  *   **Why this matters:** Superrationality solves the Prisoner's Dilemma. ECL attempts to solve the problem of **cosmological value diversity**. It turns the multiverse into a giant market for moral influence.

  #### B. The "Large World" Expected Value Calculation
  Hofstadter's scenario is usually a small group (e.g., 20 people). ECL leans heavily on the **size of the universe**.
  *   **The Bet:** ECL proponents argue that even if the probability of correlation is tiny, the number of agents in a "large world" (infinite or just astronomically vast) is so huge that the *expected value* of cooperating dominates.
  *   **The Math:** If there are $10^{100}$ agents, and there is even a $0.00001\%$ chance your reasoning is correlated with a subset of them, the stakes are high enough to dictate your local behavior. Hofstadter didn't need cosmology; ECL *requires* it to make the numbers work for diverse agents.

  #### C. Formal Decision Theoretic Grounding
  Hofstadter's superrationality was philosophical and somewhat informal. He argued it was "the rational thing to do," but he didn't have a formal decision theory to back it up (this was before the modern split between CDT, EDT, and FDT).
  ECL is explicitly grounded in **Evidential Decision Theory (EDT)** and, more recently, **Functional Decision Theory (FDT)**.
  *   **FDT:** Developed by Yudkowsky and Soares, FDT is essentially the rigorous mathematical formalization of superrationality. ECL is often the *application* of FDT/EDT to cosmology.
  *   **The Shift:** This moves the idea from "a clever paradox" to "a prescriptive normative framework." ECL papers contain actual probability models and utility calculations that Hofstadter's columns did not.

  ### 3. Why the Confusion?
  You noticed that explanations treat them as interchangeable. This happens for two reasons:
  1.  **Lineage:** Proponents of ECL openly cite Hofstadter as the originator. They view ECL as "Superrationality 2.0."
  2.  **The "Black Box":** For the purpose of a high-level overview, the distinction between "identical reasoning" (Hofstadter) and "logically correlated reasoning among diverse agents" (ECL) is a nuance that often gets glossed over in blog posts.

  ### 4. Is there a substantive difference?
  Yes. Here is the litmus test:

  *   **Superrationality** asks: "If we all think exactly alike, what should we do?"
  *   **ECL** asks: "Given that we think *differently* but our optimization processes might be logically correlated across a vast universe, how can we structure a compromise to maximize total value?"

  ECL is more ambitious. It tries to derive a form of **moral realism** or **universal cooperation** from decision theory alone, without needing a social contract or enforcement mechanism.

  ### Summary
  You aren't missing a hidden secret; you've correctly spotted that ECL is Hofstadter's idea grown up.
  *   **Is it basically superrationality?** Yes.
  *   **Is it *just* superrationality scaled up?** No. It adds the machinery of **acausal trade between different value systems** and relies on **cosmological scale** to justify the expected value calculations.

  If Hofstadter's superrationality is a thought experiment about human psychology and logic, ECL is a policy proposal for how an advanced civilization (or AI) should act in a potentially infinite multiverse. The shift is from **puzzle-solving** to **civilization-scale strategy.**

  ***

  **A Note of Skepticism:**
  It is worth noting that just as superrationality was criticized by mainstream game theorists (who argue that your choice *cannot* cause theirs, so you should defect), ECL faces similar criticism. Causal Decision Theorists argue that logical correlation is not a channel for influence. Furthermore, ECL relies on strong assumptions about the nature of the multiverse and the likelihood of finding correlated agents. If the universe is small, or if agents are too diverse to correlate, ECL collapses back into standard selfishness. ECL is essentially a high-risk, high-reward bet on the structure of reality.
