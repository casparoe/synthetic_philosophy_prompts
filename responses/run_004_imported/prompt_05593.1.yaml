      *   It challenges the idea that the status quo ($D_1$) is "natural" and taxation is "unnatural." Both are enforced by law.

  5.  **Formulate Nozickian Counter-Arguments (The Comeback):**
      *   *Rights-Based Defense:* Nozick isn't just about "liberty" in the abstract; he's about *rights*. Interfering with voluntary exchange violates rights. Enforcing property rights in $D_1$ protects rights.
      *   *The Distinction between Doing and Allowing:* Taxation is active seizure. Protecting property is preventing theft. (Though Cohen would challenge this distinction).
      *   *Self-Ownership:* The core is self-ownership. Taxing Wilt's earnings is effectively partial slavery (forcing him to work for others). Preventing theft from Wilt in $D_1$ protects his self-ownership.

