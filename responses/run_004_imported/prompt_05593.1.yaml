      *   Conclusion: Liberty upsets patterns. You can't have both strict patterned justice and full liberty.

  3.  **Deconstruct G.A. Cohen's Objection (The "Rabbit Hole"):**
      *   *Source:* "Self-Ownership, World-Ownership, and Equality" (and related essays like "Robert Nozick and Wilt Chamberlain: How People Own Themselves and the World").
      *   *Key Insight:* Nozick treats the maintenance of $D_1$ as neutral/background and the maintenance of $D_2$ (via redistribution) as intrusive.
