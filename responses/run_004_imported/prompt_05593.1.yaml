  ok so in my gov class we went over nozick's wilt chamberlain argument (basically a million people pay 25 cents each to watch him play, he ends up mega rich, but everyone in the example agrees the starting distribution D1 was totally just) and the takeaway was supposed to be that keeping a "patterned" distribution in place requires the government to continuously interfere with people's free choices forever, which is bad for liberty. but then i went down a rabbit hole and found this guy G.A. Cohen has an objection that nozick never actually explains why D1 gets to be exempt from needing its own "continuous interference" to stay stable -- like, isnt the property law/tax system that kept D1 in place ALSO a form of interference? so why does only the redistribution back to the pattern count against it? can someone walk me through what cohen's objection actually is and whether it seriously breaks nozick's argument, or if theres a good comeback for him?
