      *   *Nuance the Connection:* While thematic, it's not a strict logical deduction.
      *   *Point 1: The Function of Money vs. Ontology.* Berkeley's argument in *The Querist* is functionalist. Money measures power/industry. Whether the substrate is metal or paper is a practical question, not purely ontological. Even if gold is an "idea," it's a persistent, scarce idea.
      *   *Point 2: Historical Context.* Berkeley was reacting against Mercantilism (Locke's view). Locke was a materialist but thought money's value was in the silver. Berkeley disagreed. This shows the economic view isn't tied to the metaphysical view (since Locke and Berkeley differ on metaphysics but their economic disagreement is about *value theory*, not just ontology).
      *   *Point 3: The "Ticket" Metaphor.* Berkeley uses "ticket" or "counter." This implies a semiotic theory. Signs don't need to resemble what they signify. This *does* align with his theory of vision and language, which is broader than just immaterialism.
