answer: |-
  This is a fascinating and astute observation. It is very tempting to read *The Querist* as the "applied ethics" or "social ontology" chapter of Berkeley's system, following the "theoretical metaphysics" of the *Principles*. There is certainly a thematic resonance between denying the intrinsic reality of matter and denying the intrinsic value of specie.

  However, to answer your specific questions: **No, it would not be fair to say Berkeley is an ancestor of fiat theory *simply in virtue of being an immaterialist*,** and **No, one does not need to refute the *Principles* to resist the economics of *The Querist*.**

  While the connection is intellectually seductive, positing a strict logical entailment between his immaterialism and his monetary theory commits a category error regarding how Berkeley understands value, signs, and social convention. Here is a breakdown of why the link is thematic rather than deductive.

  ### 1. Ontology vs. Function: The Category Error
  Your argument rests on the idea that because gold has no mind-independent existence (immaterialism), it can do no "metaphysical work" as money. But in economics, the "work" money does is not metaphysical; it is semiotic and functional.

  Even within Berkeley's immaterialism, gold is a very specific cluster of ideas: it is yellow, heavy, malleable, scarce, and durable. These sensory ideas are stable and law-like (governed by God). A piece of paper is a different cluster of ideas: white, light, tearable.
  *   **The Materialist Case for Gold:** Gold is valuable because it is a physical substance with intrinsic properties.
  *   **The Immaterialist Case for Gold:** Gold is valuable because it is a *stable idea* that humans have universally agreed to use as a measure.

  Berkeley's argument in *The Querist* is not that "matter doesn't exist, therefore gold is useless." His argument is that **money is a ticket for conveying power.** This is a functionalist definition. He argues that the value of money lies in its ability to circulate and stimulate industry, not in the substrate. One could hold this functionalist view while being a thoroughgoing materialist (as many modern economists are). Conversely, one could be an immaterialist and argue that gold-ideas are more stable and trustworthy than paper-ideas. Therefore, the economics do not logically follow from the metaphysics.

  ### 2. The Real Link: Anti-Abstractionism, Not Immaterialism
  If there is a philosophical link between the *Principles* and *The Querist*, it is likely found in Berkeley's **critique of abstract ideas**, rather than his denial of matter.

  In the *Principles*, Berkeley attacks the Lockean notion that we can abstract "extension" from "color" or "existence" from "perception." In *The Querist*, he attacks the economic abstraction of "wealth" from "industry."
  *   Mercantilists (like Locke) tended to view wealth as an abstract stockpile of precious metal (hoarding).
  *   Berkeley argues wealth is the concrete capacity of a people to labor and produce.

  When Berkeley says money is a "counter," he is treating it as a **sign** in a linguistic system. This aligns with his later philosophy of language (where words are tools to provoke action, not just labels for ideas). He views money as a tool to motivate industry. This is consistent with his metaphysics, but it is driven by his **semiotics** and his **moral utilitarianism** (promoting the good of Ireland), not strictly by the *esse est percipi* premise.

  ### 3. Independent Grounds for Resistance
  To your second point: *Does anyone who wants to resist the economics of the Querist have to first find a flaw in the Principles?*

  Definitely not. The *Querist* can be critiqued on purely economic or political grounds that leave the *Principles* untouched.
  *   **Trust and Stability:** One could argue that while money *is* a ticket, paper tickets are too easily forged or over-issued by governments, leading to inflation. Gold, by virtue of its physical scarcity (even if that scarcity is just a regularity of ideas), imposes a necessary discipline on the issuer. This is a pragmatic argument, not a metaphysical one.
  *   **International Trade:** In Berkeley's time, international trade required specie. You couldn't pay the Dutch with Irish paper credit. Berkeley acknowledges this but thinks a national bank can manage it. A critic could argue this is naive without ever mentioning atoms or substance.
  *   **Intrinsic Value:** A critic could argue that humans psychologically require "intrinsic value" to trust currency. Whether that value is metaphysical or psychological, the economic result is the same: fiat fails without trust.

  ### 4. Historical Context: The Lockean Contrast
  The strongest evidence against your hypothesis is John Locke.
  *   **Locke:** Materialist realist + Metallist (money derives value from silver content).
  *   **Berkeley:** Immaterialist idealist + Functionalist (money derives value from social convention/utility).

  It looks like a perfect mirror. However, consider **William Petty** or **John Law**. Law (of the Mississippi Bubble fame) advocated for paper credit and fiat-like systems vigorously, but he was not a Berkeleian immaterialist. He was a materialist who thought money was a tool of state power.

  If materialists can advocate for fiat money, then Berkeley's fiat advocacy cannot be *solely* the product of his immaterialism. It is the product of a broader 18th-century shift toward understanding money as a social institution rather than a natural commodity. Berkeley is an ancestor of fiat theory, but he shares that ancestry with materialists.

  ### Conclusion
  You have identified a profound **systematic coherence** in Berkeley's thought, but you have mistaken coherence for **deductive dependency**.

  Berkeley's immaterialism clears the ground by removing the superstition that matter has occult powers. This makes it *easier* for him to accept that a coin's power is conventional rather than intrinsic. However, it does not *force* that conclusion. His economic views are better understood as an application of his **theory of signs** and his **political theology** (that the end of government is the welfare of the people) than a direct corollary of *esse est percipi*.

  So, you can safely critique *The Querist* for being inflationary or politically naive without ever having to defend the independent existence of gold against Berkeley's metaphysics. The ticket works (or fails) based on the trust of the people, not the ontology of the paper.
