      *   However, attributing this *simply in virtue of being an immaterialist* is a category error. His economic views stem from his moral philosophy, political aims (Irish prosperity), and empirical observation, not just his ontology.
      *   Other contemporaries (like Law or Steuart) had similar monetary views without being immaterialists.

  5.  **Evaluate the "Refute Principles to Resist Querist" Claim:**
      *   This is the strongest point to challenge. It suggests a dependency that doesn't exist.
      *   One can accept immaterialism but think gold is the best *sign* for money (due to stability).
      *   One can reject immaterialism but accept fiat money (as most moderns do).
      *   Therefore, the economics do not stand or fall with the metaphysics.

  6.  **Drafting the Response (Iterative Process):**

