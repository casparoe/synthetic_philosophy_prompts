answer: |-
  **MEMORANDUM**

  **TO:** Undergraduate Curriculum Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Bentham Sexual Morality Excerpts (ETH 101)

  **Purpose**
  This memo summarizes our discussion regarding the proposal to include Jeremy Bentham's unpublished writings on sexual morality (e.g., "Offences Against One's Self") in the *Intro to Ethics* utilitarianism unit and offers a recommendation for Tuesday's vote.

  **Assessment of Pedagogical Value**
  The proposal's strength is undeniable. As argued, these texts demonstrate the felicific calculus applied to high-stakes, culturally entrenched taboos. They prevent the "tame Bentham" problem and offer a concrete historical case study for the "Publicity Principle" irony: Bentham advocated transparency while concealing these very arguments.

  However, we must weigh this against the specific constraints of a 100-level, mixed-major lecture:
  1.  **Cognitive Load:** Non-majors often struggle with the dense prose of *Principles of Morals and Legislation*. Adding unpublished manuscripts risks overwhelming the primary learning objective: mastering the logical structure of the hedonic calculus.
  2.  **Pedagogical Focus:** There is a valid risk that discussion shifts from *how* Bentham argues to *what* he argued (i.e., historical trivia about his "edginess"), diluting the philosophical training.
  3.  **Appropriateness:** We must take the concern regarding a diverse, large-enrollment lecture seriously. While the material is scholarly, 18th-century taxonomy regarding sexual acts requires careful handling to ensure all students feel the classroom environment remains focused on ethical theory rather than sensitive personal content.

  **The "Publicity" Irony**
  Regarding the question of whether we must assign the text to teach the irony of Bentham's secrecy: I argue we do not. The philosophical lesson lies in the *fact* of suppression alongside the *content* of the argument. An instructor can effectively demonstrate the tension between Bentham's public principles and private caution by summarizing the text's fate and its reasoning in lecture, without requiring every student to parse the primary manuscript.

  **Recommendation**
  I recommend we adopt a **Modified/Supplementary Model**:

  1.  **Do not include** these excerpts as *core required reading* on the syllabus. This respects the 100-level scope and mitigates appropriateness concerns for non-majors.
  2.  **Include the argument in lecture.** Instructors should explicitly teach the "sexual morality" case study as an application of the calculus, highlighting the harm-analysis (e.g., Malthusian demographics, lack of direct victim) and the historical context of suppression.
  3.  **Offer as Optional Enrichment.** Place a curated, short excerpt (1–2 pages max, focusing on the harm-principle argument rather than graphic taxonomy) on the course LMS with a content note. This preserves access for interested students and majors without penalizing those who need to focus on core competencies.

  **Rationale**
  This approach secures the pedagogical benefits Colleague A identified (radical application of utilitarianism) while validating Colleagues B and C's concerns (appropriateness and focus). It allows us to teach the "Publicity" irony as a meta-ethical lesson about the sociology of philosophy, rather than a reading comprehension task. It ensures the unit remains accessible to non-majors while signaling that we do not shy away from the difficult implications of the theories we teach.

  **Action Item**
  I move we approve the syllabus revision contingent on the "Supplementary/Optional" status of these texts, with a standardized content note provided by the committee.
