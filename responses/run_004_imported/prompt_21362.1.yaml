      *   *Claim 1: Distinction between tyrant in title (usurper) vs. tyrant in exercise.*
          *   **Verdict:** Accurate. Aquinas does make this distinction (often associated with *De Regimine* and the *Sentences* commentary).
      *   *Claim 2: Private person may kill a usurper (tyrant without title).*
          *   **Verdict:** Accurate (mostly). In the *Sentences* commentary (II Sent., d. 44, q. 2, a. 2), Aquinas suggests that one who seizes power by violence may be slain by anyone seeking to liberate the fatherland.
      *   *Claim 3: For the legitimate ruler turned tyrant, *De Regimine Principum* extends the same permission (private citizens can kill).*
          *   **Verdict:** **MAJOR ERROR.** This is the critical trap. In *De Regimine Principum* (I.6), Aquinas explicitly argues *against* private individuals killing a tyrant who has legitimate title. He argues that if private presumption is allowed, it leads to greater danger (the killer might be worse, or it causes sedition/instability). He suggests public authority or God should handle it. The student claims Aquinas "basically extends the same permission" and that the king "collapses into the first category." This is a misreading. Aquinas maintains the distinction sharply here.
      *   *Claim 4: Appeal to Ehud and Eglon (Judges) as scriptural precedent for private tyrannicide.*
          *   **Verdict:** Nuanced. Aquinas *does* mention Ehud in the *Sentences* commentary regarding usurpers. However, using it to justify private killing of a *legitimate* tyrant in *De Regimine* is incorrect. In *De Regimine*, he cautions against this. The student conflates the texts.
      *   *Claim 5: Summa (IIaIIae, q.42) on sedition.*
          *   **Verdict:** Mostly Accurate. Aquinas argues that overthrowing a tyrant is not sedition if the tyrant fosters sedition by ruling for private good. However, he doesn't explicitly endorse private killing here; he focuses on the *disturbance* not being sinful if it serves the common good. The student's summary is acceptable but slightly stretched to support the "private killing" thesis.
      *   *Claim 6: Comparison to John of Salisbury.*
          *   **Verdict:** **MAJOR ERROR.** John of Salisbury (*Policraticus*) is famous for explicitly endorsing tyrannicide (even by private individuals/friends) as a duty. Aquinas is much more restrictive. The student claims they "end up in the same place on the substance." This is false. Salisbury is the "full-throated defense"; Aquinas is the "cautious restriction." The student gets the comparison backward.

