prompt: |-
  Me and my friend got into it last night over the twin prisoner's dilemma and neither of us backed down. He's convinced that if you know your opponent reasons exactly the way you do, cooperating is just obviously correct -- superrationality, straight out of Hofstadter -- and that calling it irrational just means you're confusing 'rational' with 'whatever the dominant strategy happens to be.' I kept asking why that isnt just assuming the answer, and we never got anywhere.

  I run a little podcast on decision theory and next week's guest actually defends this view seriously, way more rigorously than my friend managed. Write me 8-10 interview questions that don't just let her restate the symmetry argument. I want at least one question that presses the circularity worry head-on, one that makes her square this with the fact that defection is still the dominant strategy no matter what the other player does, one on how similar two agents actually have to be for the argument to apply (real people are never exact copies -- so where's the cutoff), and one distinguishing her view from Gauthier-style 'constrained maximization', since people constantly conflate the two. For each of those four, throw in the dodge she's most likely to reach for and a follow-up that closes it off.
