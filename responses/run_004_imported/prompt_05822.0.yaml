answer: |-
  Here are 10 interview questions structured to challenge the superrationalist position without strawmanning it. The four core sections include the anticipated dodge and a follow-up designed to close off that escape route.

  ### 1. The Circularity Worry
  **Question:** Critics often charge that superrationality begs the question: you assume your opponent reasons exactly like you to prove that they *should* reason like you. It feels like you're selecting the reasoning process that yields the highest utility rather than the one that tracks the truth. How do you respond to the claim that this is just rationalization dressed up as logic?

  *   **Anticipated Dodge:** She will likely argue that this isn't about *choosing* a reasoning process arbitrarily, but about recognizing a logical fact: if two agents run the same algorithm on the same data, the output *must* be identical. She'll say you aren't assuming the conclusion; you're acknowledging a logical constraint on the premises.
  *   **Follow-up:** "But who determines the algorithm? If I can 'reason' my way to cooperation because it pays better, what stops me from 'reasoning' my way to believing the moon is made of cheese because that would make me happier? At what point does instrumental reasoning about *how* to think violate the truth-tracking function of *what* to think?"

  ### 2. The Dominance Principle
  **Question:** In standard decision theory, defection dominates cooperation: you get a better payoff if you defect, regardless of what the other player does. By cooperating, aren't you simply leaving money on the table in a way that makes you vulnerable to exploitation by any agent that doesn't buy into your superrational framework?

  *   **Anticipated Dodge:** She will likely claim that the Dominance Principle only applies when outcomes are probabilistically independent of your action. She'll argue that in the Twin PD, your action is *logically* correlated with theirs, so the "regardless of what the other player does" condition is never actually met.
  *   **Follow-up:** "But that correlation isn't causal. If I defect right now, the other player's choice is already written in the past or determined by their own isolated brain state. If you admit your action doesn't *cause* theirs, aren't you just redefining 'rationality' to mean 'maximizing utility in a world where magic is real' rather than 'maximizing utility in the world we actually inhabit'?"

  ### 3. The Similarity Threshold
  **Question:** Hofstadter's argument relies on identical reasoning, but real people are never exact copies. We have different biases, noise in our neural firing, and distinct backgrounds. Where is the cutoff? If my opponent is 99% like me, does the superrational obligation drop to 99% strength, or does the whole argument collapse?

  *   **Anticipated Dodge:** She will likely shift to a probabilistic framework, arguing that you should cooperate to the degree that you believe your actions are correlated. She'll say it's not a binary "twin or not," but a continuum of algorithmic similarity.
  *   **Follow-up:** "If it's just a continuum of probability, haven't you just collapsed back into standard Evidential Decision Theory? And if so, doesn't the math show that unless the correlation is near-perfect, the dominant strategy of defection swamps the expected utility of cooperation anyway? Where is the rigorous threshold where cooperation becomes the strict maximize?"

  ### 4. Gauthier vs. Superrationality
  **Question:** David Gauthier's 'Constrained Maximization' also argues for cooperation, but he grounds it in adopting a *disposition* prior to the game to maximize long-term outcomes. How is your view distinct from Gauthier's? Are you arguing for a dispositional trait, or are you claiming the one-shot act itself is rational?

  *   **Anticipated Dodge:** She will likely distinguish them by saying Gauthier is contractualist and relies on future iterations or reputation, whereas superrationality is a one-shot logical necessity. She'll claim Gauthier is about *training* yourself, while she is about *recognizing* logical identity.
  *   **Follow-up:** "But if it's a one-shot game with no causal link, the 'logical identity' is doing no work other than mirroring the disposition. If I meet a superrationalist who knows I am *not* superrational, do they still cooperate? If yes, they're being exploited. If no, then isn't this just Gauthier's conditional cooperation under a different metaphysical coat of paint?"

  ### 5. Additional Standalone Questions
  *(Use these to round out the interview and test practical implications)*

  **Question:** "Let's apply this to AI. If we program two autonomous agents with your decision theory and put them in a Prisoner's Dilemma, they cooperate. But if we program one with your theory and one with standard Causal Decision Theory, the CDT agent defects and wins. Doesn't this prove that superrationality is evolutionarily unstable and would be selected out of any competitive environment?"

  **Question:** "Imagine you cooperate based on superrationality, but your opponent defects. They send you a message saying, 'I reasoned exactly like you, but I decided to free-ride.' Do you feel regret? And if you do, is that regret a signal that your decision procedure failed, or just an emotional residue that rational agents should ignore?"
