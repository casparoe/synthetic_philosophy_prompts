  **Move 1 (Uncle): -1**
  While Aquinas acknowledges tyranny as the worst form of government, he does not offer a blanket justification for killing a tyrant "period." In *De Regimine Principum*, he is notably cautious, warning that private assassination often leads to greater instability. The Uncle captures the spirit of resistance but ignores Aquinas's strict procedural constraints.

  **Move 2 (Mom): 2**
  This is highly accurate to *De Regimine Principum* I.6. Aquinas distinguishes between a legitimate ruler who becomes tyrannical and a usurper who never had right to rule, noting that removing a usurper is easier to justify. Crucially, he insists removal must be undertaken by public authority, not private presumption.

  **Move 3 (Uncle): 1**
  The Uncle is correct that a dictator who seized power via coup fits Aquinas's definition of a usurper, which makes deposition more permissible than removing a legitimate king. However, he incorrectly assumes this classification automatically validates private assassination, ignoring Mom's point about who must wield the authority.

  **Move 4 (Mom): 2**
  This is the core of Aquinas's political caution. He explicitly argues that allowing private individuals to judge and execute rulers invites chaos, as anyone might label a ruler a "tyrant" to justify sedition. He insists on a public process to maintain the common good and order.

  **Move 5 (Uncle): -1**
  While this is a compelling modern critique of Thomistic theory in extreme scenarios, it is not what Aquinas argues. When no human authority exists to depose a tyrant, Aquinas explicitly advises recourse to God ("the King of all"), not private violence. He would likely view the cell as seditioners rather than representatives of the community.

  **Move 6 (Mom): 2**
  Aquinas explicitly makes this prudential argument in *De Regimine Principum*. He warns that conspirators against a tyrant often become worse tyrants themselves, or that the resulting turmoil harms the community more than tolerating a moderate tyranny. He prioritizes stability and the avoidance of greater evil.

  ### What Both Are Missing

  Both your uncle and mom are overlooking two critical nuances in Aquinas's broader corpus. First, they are missing the distinction between **sedition** and **resistance**: Aquinas argues in the *Summa Theologiae* (II-II, Q. 42) that resisting a tyrant who rules for private gain rather than the common good is *not* sedition, provided it doesn't cause greater disturbance. Second, they are missing the **theological dimension**: Aquinas sometimes frames tyranny as a divine punishment for the sins of the people, suggesting that removal might require spiritual repentance before political liberation is possible. Finally, there is a tension between his earlier *Commentary on the Sentences* (which is more permissive of tyrannicide) and his later *De Regimine* (which is more cautious); your seminar text favors the latter, but the Uncle's intuition likely echoes the former.
