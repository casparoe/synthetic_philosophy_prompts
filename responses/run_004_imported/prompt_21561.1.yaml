      *   **Core Conflict:** The arbitrator needs to explain the difference between two game theory concepts (Nash Bargaining Solution vs. Kalai-Smorodinsky Solution) in plain language within a formal memo.
      *   **Specific Dynamics:** Priya has a strong BATNA (Best Alternative to a Negotiated Agreement) - a good job waiting. Theo has a weak BATNA (nothing lined up) but high contribution/value to the specific asset (only one who can run it). The asset is worth more if Theo runs it.
