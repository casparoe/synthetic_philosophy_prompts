      *   **The Decision:** She needs to pick one. Given the prompt says Theo is the only one who can run it and the house is "well-regarded" (implying cultural value + economic), favoring the survival of the house (Theo) feels more dramatic and thematically resonant, *but* Priya's financial security can't be ignored.
