      *   *Actually, the cleanest distinction for a novel:*
          *   **Nash:** "Who blinks first?" (Priya doesn't blink).
          *   **Kalai-Smorodinsky:** "Who builds the bigger house?" (Theo builds the value).

  6.  **Writing the Memo (Iterative Process):**
