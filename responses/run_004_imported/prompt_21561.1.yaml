  2.  **Deconstruct the Game Theory (for the Writer):**
      *   *Nash Bargaining Solution (NBS):* Maximizes the *product* of the gains above the disagreement point. It focuses on efficiency and symmetry. If one party has a better outside option (Priya), NBS tends to reward them more because their "threat point" is higher. It assumes risk neutrality.
      *   *Kalai-Smorodinsky Solution (KS):* Focuses on *proportionality* relative to the "ideal point" (the best possible outcome for each party). It preserves the ratio of maximum potential gains. It satisfies "individual monotonicity" (if your potential max goes up, your share shouldn't go down). It often feels "fairer" when potential contributions differ significantly.
      *   *The Twist:* In this specific scenario, Theo creates more value *if* he gets it. Priya has a better safety net.
          *   NBS might favor Priya because her disagreement point (walking away to a job) is secure, giving her leverage.
          *   KS might favor Theo because his "ideal point" (running the house successfully) creates the total surplus. If the house is worth \$10M with Theo and \$2M with Priya (or liquidation), KS looks at the ratio of gains relative to those maximums.
      *   *Actually, let's refine the application:*
          *   Disagreement Point (d): If they don't agree, the house gets liquidated (per will usually, or court). Let's say liquidation value is low.
          *   Priya's Outside Option: High (new job). This affects her utility, but in strict bargaining over the *asset*, the disagreement point is usually the liquidation value for *both*. However, her *patience* or *willingness to walk* is higher.
          *   Theo's Value Add: The "Surplus" is bigger if Theo runs it.
          *   *Nash:* Splits the surplus based on leverage. If Priya is willing to walk away easily, she has leverage.
          *   *Kalai-Smorodinsky:* Looks at the "Utopia Point." What is the most Priya could get? What is the most Theo could get? It tries to give them equal proportions of their maximum possible satisfaction. Since Theo *is* the value, his maximum potential contribution is the ceiling.
      *   *Simplification for the Memo:* Don't get bogged down in axioms.
          *   Nash = "Efficiency & Leverage." Who can afford to walk away? (Favors Priya).
          *   Kalai-Smorodinsky = "Proportionality & Potential." Who makes the pie biggest? (Favors Theo).

  3.  **Character Voice & Tone:**
      *   **Arbitrator:** Needs to sound experienced, neutral, slightly weary but sharp. Not an academic, but someone who uses these tools practically. Let's call her Eleanor Vance.
      *   **Audience:** Lawyers (technical enough to know terms) and Siblings (need to understand the *why*).
      *   **Tone:** Formal but direct. No jargon without translation.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard legal memo format.
