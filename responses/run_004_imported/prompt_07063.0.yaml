answer: |-
  **Setting:** *A quiet corner of the faculty lounge, post-seminar. Two empty coffee cups sit between them.*

  **Characters:**
  *   **ELARA (Everettian):** A theoretical physicist. Pragmatic about the math, realist about the wavefunction.
  *   **MARCUS (Philosopher):** A philosopher of physics. Obsessed with ontology and the precise definitions of causality.

  ***

  **MARCUS:** You stood up there and said it with a straight face: "Many-Worlds saves locality." I know that's the LessWrong catechism, Elara, but Bell didn't die that easily.

  **ELARA:** Bell's Theorem is a conditional. *If* you have a theory that yields single outcomes and reproduces QM predictions, *then* it must be non-local. MWI rejects the antecedent. We don't have single outcomes. We have unitary evolution. The Schrödinger equation is a local differential equation. Where is the spookiness?

  **MARCUS:** The spookiness is in the *structure* of the branching. Look, let's grant you the wavefunction. Let's grant it evolves unitarily. Alice measures spin-up, the world branches. Bob measures spin-down, the world branches. You say this is local because Alice's branching dynamics depend only on her local interaction. But here is the Maudlin objection, and I want you to actually answer it: Why does the Alice-Up branch *only* correlate with the Bob-Down branch?

  **ELARA:** Because that's what the entanglement dictates. The state was $\frac{1}{\sqrt{2}}(|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle)$. That structure was established at the source, in the common past. When they measure, they are just revealing that existing structure. No information travels between them.

  **MARCUS:** "Revealing." That's the sleight of hand. In a collapse theory, "revealing" implies updating a probability distribution. In your theory, "revealing" means *splitting*. If the splitting is a local physical process at Alice's end, and a local physical process at Bob's end, then logically, shouldn't the branches combine combinatorially? Alice splits into Up and Down. Bob splits into Up and Down. Locally, neither knows what the other did. So you should get four branches: Up-Up, Up-Down, Down-Up, Down-Down. But you don't. You only get two. The Up-Up branch is missing. What killed it?

  **ELARA:** Interference killed it. Or rather, it never had amplitude to begin with. You're treating the branches like distinct universes that crash into each other and have to find partners. They aren't. It's one wavefunction. The "pairing" isn't an active process that happens at measurement time. The correlation is encoded in the *global* state vector, which evolves locally in configuration space.

  **MARCUS:** There it is. "Configuration space." You've saved locality by moving the physics to a $3N$-dimensional space. But Bell's notion of locality—Local Causality—is about events in 3D physical space. It asks: Does what happens here depend on what happens there, given the past light cone?

  **ELARA:** But the wavefunction *is* the physical stuff. If the wavefunction evolves via a local Hamiltonian, it's local.

  **MARCUS:** Is it? Let's carve this up using the standard Bell distinctions. Parameter Independence and Outcome Independence. Parameter Independence says my setting choice doesn't change your outcome probabilities. MWI keeps that; you can't signal. Good. But Outcome Independence says that given the complete state of the past, my outcome shouldn't change the probability of yours.

  **ELARA:** In MWI, "probability" is tricky, but let's say *measure*.

  **MARCUS:** Fine, measure. In MWI, does the fact that Alice finds herself on the Up branch change the measure of Bob being on the Down branch? Yes. If Alice is Up, Bob *must* be Down. The conditional probability is 1. If the theory were locally causal in Bell's sense, the complete specification of the physical state in the past light cone of Bob should screen off Alice's result. But it doesn't. The entanglement means the state doesn't factorize.

  **ELARA:** That's just saying the state is entangled. Entanglement isn't non-locality; it's non-separability. There's a difference.

  **MARCUS:** Bell would say non-separability *is* a form of non-locality. If the physical state of the region containing Bob cannot be fully specified without referencing the region containing Alice, then you have violated the spirit of Local Causality. You have holistic states.

  **ELARA:** You're conflating *ontological* holism with *causal* non-locality. Causal non-locality implies I can wiggle something here and make something wiggle there faster than light. I can't. The reduced density matrix at Bob's location is completely unaffected by Alice's measurement. If you're just looking at Bob's local physics, nothing changes. The "correlation" is only visible when you bring the records together, which requires light-speed communication.

  **MARCUS:** That's the "No-Signaling" defense. It's pragmatic, not ontological. It saves relativity from contradiction, sure. But it doesn't save *Local Causality*. Bell was clear: Local Causality is about what exists, not what we can control. The fact that Bob's local density matrix is invariant doesn't mean the *full* physical state supervenes on local facts.
  Think about the branching again. When Alice measures, does the number of branches at Bob's location change?

  **ELARA:** No. The decoherence basis is selected locally.

  **MARCUS:** But the *identity* of the branches does. Before measurement, there is a single component in the superposition covering the pair. Afterward, there are two. But the "two" are defined relationally. Alice-Up is only defined *relative* to Bob-Down. If ontology is local, facts should supervene on local properties. "Being the branch where Alice is Up" is a local fact for Alice. "Being the branch where Bob is Down" is a local fact for Bob. But "Being the branch where Alice is Up *and* Bob is Down" is a joint fact. In your theory, the joint fact is fundamental, and the local facts are derivatives. That's non-separability. And Bell's theorem essentially proves that any theory reproducing QM correlations must be non-separable or non-local. You chose non-separable.

  **ELARA:** I chose a theory where the fundamental ontology is the wavefunction. The wavefunction lives on configuration space. On *that* space, the dynamics are strictly local. Why is 3D space the privileged arbiter of locality? Maybe our intuition about 3D locality is the artifact, not the wavefunction.

  **MARCUS:** Because we live in 3D space. If your fundamental ontology is in 3N dimensions, you owe us a story about how 3D space emerges. And until you have that, claiming "locality" is cheating. You're saying, "It's local in the math space," while admitting, "It's non-separable in the physical space."
  Let's press the pairing problem one more time. Suppose Alice measures first. She branches. Now the universe contains an Alice-Up and an Alice-Down. Bob hasn't measured yet. What is the state of Bob relative to Alice-Up?

  **ELARA:** Bob is in a superposition relative to Alice-Up. He hasn't decohered yet.

  **MARCUS:** So Alice-Up is a distinct "world" now?

  **ELARA:** "World" is a fuzzy term. It's a decoherent component of the wavefunction.

  **MARCUS:** Okay, decoherent component. So we have Component A (Alice-Up). Bob is still unmeasured. Now Bob measures. Does he split into two components relative to Component A?

  **ELARA:** Yes. He splits into Bob-Up and Bob-Down relative to Alice-Up.

  **MARCUS:** But QM says the Bob-Up relative to Alice-Up branch must have zero amplitude. It must not exist. So, when Bob measures, something must *prevent* that branch from actualizing. What mechanism does that? If Bob's measurement is a local interaction, governed by a local Hamiltonian, why does it "know" to suppress the Up-Up branch? The suppression depends on Alice's distant outcome.

  **ELARA:** It doesn't depend on Alice's outcome. It depends on the *initial state* of the pair. The Hamiltonian acts on the joint state. The joint state already has the constraint built in. Bob's local interaction rotates his part of the vector, but because the vector is entangled, that rotation maps the existing amplitudes to the correlated outcomes. He isn't suppressing anything; he's just evolving the amplitude that was already there.

  **MARCUS:** But the amplitude "that was already there" isn't located at Bob's end. It's a property of the pair. So the disposition of Bob's measuring device to yield Down rather than Up depends on the global state of the pair, not just the local state of his particle.
  Here is the hard boil: If Local Causality holds, the probabilities for events in region B should depend only on the physical state in B's past light cone. In MWI, the "probability" (measure) of Bob seeing Down, *conditional on Alice seeing Up*, is 1. But the physical state in Bob's past light cone (excluding Alice's result) only gives him 50/50. So the conditionalization requires information from outside the light cone.

  **ELARA:** You're treating the branch index as a hidden variable. It's not. There is no "fact of the matter" about which branch Bob is on until they compare. Until they compare, Bob just has a reduced density matrix. The correlation is a fact about the *joint* history, not a signal sent at measurement.
  You're insisting on "Outcome Independence." But Outcome Independence assumes that outcomes are unique events. In MWI, outcomes are all realized. The question "What is the probability of Bob's outcome given Alice's?" is a question about the *measure* over the multiverse. That measure is fixed by the initial wavefunction. The initial wavefunction was local at the source.

  **MARCUS:** The measure is fixed at the source, but the *realization* of the correlation happens at the detectors. If I accept your view, I have to accept that physical reality is fundamentally non-separable. That's fine! Many of us do. But don't call it "Local" in the sense Bell meant. Bell meant "No action at a distance" *and* "Separability." You kept the first by sacrificing the second.
  The cost is high. If reality is non-separable, then the world isn't made of things in space. It's made of a wave in configuration space. That means 3D space is emergent. If 3D space is emergent, then "locality in 3D space" isn't a fundamental constraint anymore. So you haven't saved locality; you've dissolved the arena in which locality makes sense.

  **ELARA:** I'd say I've upgraded our understanding of locality. We thought locality meant "things in 3D space only touch neighbors." We learned that fields are fundamental. Fields live on configuration space. Locality means "fields only touch neighbors in configuration space." The fact that configuration space maps to 3D space in a way that looks non-separable is just a feature of the mapping.
  Look, if I stick to Collapse theories, I have to accept superluminal collapse. That's a direct violation of Lorentz invariance in the dynamics. In MWI, the dynamics are Lorentz invariant. The *appearance* of non-locality is an artifact of observers being embedded in the wavefunction.

  **MARCUS:** But the appearance is all we have! We are the observers. If the theory says "There is no superluminal signal," but also says "The structure of reality requires that your local experience is globally coordinated without local cause," you haven't explained away the spookiness. You've just pushed it into the ontology.
  Maudlin's point stands: You can't have it both ways. You can't say "The branches are real" and "The pairing is local." If the branches are real, the pairing is a physical fact. If the pairing is physical, and it violates Outcome Independence, it's non-local.
  The only way out is to say the branches aren't real until they compare. But then you're not really Many-Worlds, you're Some-Worlds-Until-Comparison, which looks suspiciously like a hidden variable theory where the variable is the correlation itself.

  **ELARA:** The branches are real, but "which branch am I on" is indexical. It's like asking "Where am I in the universe?" The universe doesn't have a center. The correlation isn't a connection between two branches; it's a property of the single wavefunction that contains them. You're trying to reify the branches into separate universes that need to shake hands. They don't. They are parts of one object. One object can have non-separable properties without violating locality. A rigid rod has non-separable properties (if one end moves, the other moves), but we don't call a rod non-local.

  **MARCUS:** A rigid rod is a terrible analogy because rigidity is an approximation that breaks at light speed. But I see your point. You're arguing for Holism.
  Here is where I'll meet you. I will concede that MWI avoids *causal* non-locality (signaling, superluminal influence). But I will not concede it avoids *ontological* non-locality (non-separability). Bell's theorem forces a trilemma: Give up Single Outcome, Give up Locality, or Give up QM predictions. You gave up Single Outcome. But Bell's definition of Locality *includes* Separability. So you saved "No Superluminal Causation," but you sacrificed "Local Realism."
  Most people hear "Local" and think "No Spooky Action." You have no Spooky Action. But you have Spooky Identity. The identity of your branch is determined globally.

  **ELARA:** "Spooky Identity." I can live with that. It's better than "Spooky Collapse." At least my spooky identity doesn't break Lorentz invariance.

  **MARCUS:** True. But don't tell the undergraduates that Many-Worlds makes the universe "local" without qualification. It makes it local in configuration space, at the cost of making physical space non-separable. That's not defusing Bell; that's accepting one horn of the dilemma and painting it green.

  **ELARA:** *(Smiles)* I'll put that on the syllabus. "Bell's Theorem: You can have Locality or Separability. Pick one. We picked Locality in Hilbert Space."

  **MARCUS:** Just make sure they know Hilbert Space isn't where they live.

  **ELARA:** Maybe it is. We just perceive the shadow.

  **MARCUS:** *(Sighs, picks up his cup)* That's the rabbit hole, isn't it?

  **ELARA:** Always.
