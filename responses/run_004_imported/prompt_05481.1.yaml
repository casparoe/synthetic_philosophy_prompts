answer: |-
  This is a sharp, structurally sound distinction that cuts through a common conceptual muddle in effective altruism and normative ethics. You are right to suspect that conflating "moral trade" (Ord) with "moral offsetting" (uncertainty hedging) obscures important dynamics regarding enforcement, price discovery, and motivated reasoning.

  Here is a breakdown of your four questions, along with suggestions for strengthening the argument before you draft the full post.

  ### 1. Does the interpersonal/intrapersonal distinction hold up?

  **Yes, robustly.**
  The core of your argument rests on the definition of an "agent" and the nature of "gains from trade."

  *   **Interpersonal Trade (Ord):** Requires distinct utility functions. If Agent A values $X$ and Agent B values $Y$, and they swap concessions, both increase utility *relative to their own distinct functions*. There is no single metric of "goodness" until after the trade; the trade itself creates the Pareto improvement.
  *   **Intrapersonal Offsetting:** Requires a single agent maximizing *expected choiceworthiness* under uncertainty. If I eat meat but donate to animal welfare, I am not satisfying two distinct masters; I is calculating $P(\text{Vegetarianism is true}) \times \text{Disutility of Meat} + P(\text{Meat is permissible}) \times \text{Utility of Meat}$.

  **The Crucial Difference:** In interpersonal trade, the "exchange rate" is discovered through negotiation between parties with conflicting interests. In intrapersonal offsetting, the exchange rate is *imputed* by the agent themselves. This is where your point about motivated reasoning lands hardest. If I set the price of my own moral indulgences, I am effectively acting as judge in my own case.

  **Potential Weakness:** You need to be careful with **Moral Pluralism** vs. **Moral Uncertainty**.
  *   *Uncertainty:* I don't know if Utilitarianism or Deontology is true.
  *   *Pluralism:* I know both happiness and rights matter, but they conflict.
  If a pluralist sacrifices some rights for happiness, is that trade? Most philosophers call that *deliberation*, not trade, because there is no separate ownership of the values. Reinforcing this distinction will bulletproof your argument.

  ### 2. Is there a respectable way to cash out offsetting as real trade?

  You anticipate the counterarguments well (credences, sub-agents, time-slices). Here is how to handle them:

  *   **The Parliamentary Model (Lockhart/MacAskill):** This is the strongest counterargument. Ted Lockhart (2000) and William MacAskill (2014) propose treating moral theories as voting blocs in a parliament. You can "trade" votes between theories (e.g., Utilitarianism concedes on issue A to Deontology in exchange for concession on issue B).
      *   *Your Rebuttal:* This is a *heuristic* for calculation, not ontological trade. In a real parliament, parties have independent power bases and can threaten to collapse the coalition. In your head, the "Utilitarian party" cannot go on strike against the "Deontological party" unless you let it. It collapses back into a single optimization problem.
  *   **Time-Slices (Parfit):** Me-today trades with Me-tomorrow.
      *   *Your Rebuttal:* This is only "trade" if there is a commitment problem (e.g., Ulysses contracts). If I can simply revise my plan tomorrow without cost, no trade has occurred. Real trade requires enforceable contracts between distinct entities. Time-slices of the same person generally lack the adversarial independence required for trade.
  *   **Sub-agents (Psychology):** The "Elephant and the Rider."
      *   *Your Rebuttal:* Again, this is modeling, not exchange. If the Rider overrides the Elephant, it's self-control, not a deal.

  **Verdict:** You can acknowledge these models but maintain that they are *metaphors for decision theory*, whereas Ord's moral trade is a *mechanism for social coordination*. Conflating the two risks category errors.

  ### 3. Existing work to engage with?

  You should definitely cite and distinguish the following:

  *   **Toby Ord, "Moral Trade" (2015):** The foundational text. He focuses almost exclusively on the interpersonal (e.g., vegans and animal welfare reformers).
  *   **William MacAskill, *Normative Uncertainty* (2016):** Discusses hedging and the parliamentary model. He is careful not to call it "trade" in the economic sense, but the mechanics overlap.
  *   **Ted Lockhart, *Moral Uncertainty and Its Implications* (2000):** The origin of the parliamentary model.
  *   **Scott Alexander, "Moral Uncertainty and the Parliamentary Model" (2014):** A accessible blog post that explores the limits of internal bargaining.
  *   **Critiques of Offsetting:** Look for literature on "moral licensing" or "indulgences." Your argument provides a structural explanation for *why* offsetting is prone to licensing effects (lack of external counterparty).

  **The Gap:** There is little work explicitly contrasting Ord's *Moral Trade* with *Moral Offsetting* as Interpersonal vs. Intrapersonal. Most discussions treat them as adjacent strategies for "doing good despite disagreement/uncertainty." Your post would fill a specific conceptual niche.

  ### 4. Is this an interesting wedge?

  **Yes, highly.**
  Here is why this works well for the EA Forum:

  1.  **Clarifies Terminology:** The EA community often uses "trade," "hedging," and "offsetting" loosely. Tightening this improves discourse.
  2.  **Defends Moral Trade:** By distinguishing it from offsetting, you protect Ord's concept from the criticism often leveled at offsetting (i.e., that it's just buying permission to sin). This strengthens the case for *actual* moral trade.
  3.  **Practical Epistemology:** The point about **motivated reasoning** is practically vital. If EAs think offsetting is a "deal," they may trust their own self-assessment too much. Highlighting the lack of a counterparty warns agents to be more rigorous in their internal calculations.
  4.  **Not a Distinction Without a Difference:** It has normative implications. If it's trade, you need contracts/enforcement. If it's offsetting, you need better probability calibration. Confusing them leads to using the wrong tools.

  ### Suggestions for Strengthening the Draft

  1.  **Focus on the Price Mechanism:** Elaborate on how exchange rates are set. In interpersonal trade, the price is a discovery mechanism between conflicting interests. In offsetting, the price is an input determined by the agent's own credences. This is the engine of the motivated reasoning problem.
  2.  **The "Reneging" Test:** Propose a thought experiment. If one party reneges in moral trade, the other punishes/withdraws. If I renege on my internal offsetting (e.g., I eat the meat but forget to donate), who punishes me? Only my future self, via guilt or inconsistency. This highlights the lack of external enforcement.
  3.  **Nuance on "Fixed Standpoints":** You mention "fixed evaluative standpoints." Be careful here. In moral trade, standpoints don't have to be fixed forever, but they must be distinct *at the time of trade*. Acknowledge that moral persuasion is different from moral trade.
  4.  **Title Idea:** Consider something like *"Moral Trade is Not Moral Offsetting: The Interpersonal Constraint."*

  ### Conclusion

  Your intuition is correct. The conflation of interpersonal moral trade and intrapersonal moral offsetting is a category error that lends undue credibility to the latter while obscuring the unique value of the former. The argument is philosophically sound, fills a gap in the literature, and has practical implications for how EAs reason about compromise and uncertainty. It is definitely worth writing up.
