      *   **Core Argument:** The user argues that genuine moral trade is *interpersonal* (two distinct agents with fixed values trading concessions), whereas moral offsetting is *intrapersonal* (one agent under moral uncertainty maximizing expected choiceworthiness). The user claims conflating them is misleading and invites motivated reasoning.
