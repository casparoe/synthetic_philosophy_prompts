      *   *Premise 2:* Moral Offsetting = Intrapersonal, moral uncertainty, expected value maximization.
      *   *Conclusion:* Calling offsetting "trade" is category error/misleading; it lacks the checks and balances of real trade.
      *   *Strengths:* Highlights the structural difference between negotiation and calculation. Points out the risk of motivated reasoning in self-dealing.
      *   *Weaknesses/Potential Counterarguments:* Internal pluralism (multiple values within one person) might mimic interpersonal trade. Time-slice relativism. The "Parliamentary Model" of moral uncertainty (Lockhart, MacAskill) treats credences like voting blocs, which is trade-adjacent.

  3.  **Address Question 1: Does the distinction hold up?**
