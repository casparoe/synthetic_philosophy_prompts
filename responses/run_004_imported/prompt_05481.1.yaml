      *   *Sub-agents:* Haidt's Elephant and Rider, or internal family systems. *Critique:* Again, psychological modeling, not economic exchange.
      *   *Key Difference:* In interpersonal trade, if I renege, you punish me. In intrapersonal "trade," who punishes whom? It collapses into self-control.

  5.  **Address Question 3: Existing Work?**
