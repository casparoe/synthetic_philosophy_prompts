      *   *Nuance:* If an agent is a "pluralist" (holds multiple values simultaneously, not just uncertain which is true), is that trade? E.g., I value happiness *and* autonomy. If I sacrifice some autonomy for happiness, is that trade? Usually, we call that deliberation, not trade. Trade implies separate ownership.
      *   *Verdict:* The distinction is robust but needs careful definition of "agent."

  4.  **Address Question 2: Can offsetting be cashed out as trade?**
