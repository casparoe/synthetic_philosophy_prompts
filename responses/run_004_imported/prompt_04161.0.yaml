  **Commentary**

  Both students are overlooking the neo-Millian pragmatic turn championed by philosophers like Nathan Salmon and Scott Soames. This middle ground accepts Nora's point that semantics alone does not explain cognitive significance, but agrees with Theo that the *semantic* puzzle is dissolved because the propositional content is identical. On this view, the difference between "Hesperus is Hesperus" and "Hesperus is Phosphorus" is not a matter of semantic sense but of pragmatic "guises" or psychological ways of believing the same proposition. By failing to distinguish between solving the *semantic* problem (which Kripke does) and explaining the *psychological* phenomenon (which requires extra-semantic resources), they are talking past one another regarding what counts as a "solution."
