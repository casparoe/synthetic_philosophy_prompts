answer: |-
  The bruise on Elena's forearm was the color of a storm cloud, purple blooming into sickly yellow at the edges. She kept touching it, a nervous tick, pressing the thumb into the tender meat to remind herself that it was real. That *he* was real. That this was something that had happened between two people.

  For three days, she had been living in the heat of it. This was the anger that demands an answer. It was a transactional fury: *You hurt me. You owe me an explanation. You owe me an apology.* She had rehearsed the conversation in the shower, in the car, while chopping onions. She wanted to see the shame in Mark's eyes. She wanted him to look at her and acknowledge the breach. She wanted him back in the room with her, fighting for his place in the moral order they shared.

  When the neurologist called them into his office, Elena was ready to reject Mark's excuses. He had said it was stress. He had said he didn't know what came over him. *Everyone knows what comes over them,* she had thought. *That's called self-control.*

  Dr. Aris didn't look at Mark. He looked at the MRI scans pinned to the light board, a grayscale landscape of ridges and valleys.

  "As I mentioned," Aris said, his voice flat, devoid of the gravity Elena felt she deserved, "the mass is in the medial frontal lobe. It's pressing against the anterior cingulate cortex. In layman's terms, it's interfering with the braking system. The impulse fires, but the signal to stop never arrives."

  Elena waited for the rest. She waited for the *but*.

  "That explains the episode," Aris said, capping his pen. "We'll schedule the resection for Tuesday."

  Mark let out a breath that sounded like a sob. He reached for Elena's hand. "See? El, I told you. It wasn't me. It's this... thing."

  Elena pulled her hand away. Not out of anger, but out of confusion.

  She looked at Mark. Really looked at him. For three days, he had been her husband, a man who had chosen to shove her. A man who had violated a covenant. She had been holding onto that violation like a hot coal, letting it burn her because the burn proved they were still connected. If he was guilty, he was hers. If he was blameworthy, they were equals.

  But as she looked at him now, the heat went out of the coal.

  She realized she was no longer angry. It wasn't that she had forgiven him. Forgiveness requires a debt to be cancelled. This was different. The debt had evaporated.

  If the braking system was broken, then there was no driver.

  She looked at his face—the worry lines, the pleading eyes—and she didn't see a partner anymore. She saw a mechanism that had malfunctioned. You don't resent a car for stalling on the highway. You don't demand an apology from a laptop for crashing. You diagnose it. You schedule the repair. You manage the risk.

  "I need to go," she said.

  "El, wait," Mark stood up. "We can fix this. The surgery—"

  "I know," she said. Her voice was calm. Too calm. It was the tone she used with the cat when it knocked over a glass, or with her nephew when he had a fever. It was the tone of administration. "I'll drive you to the pre-op on Tuesday."

  "Are you... are we okay?"

  Elena looked at the bruise on her arm. The pain was still there, but the meaning had gone. The narrative of *us* had snapped. In the participant world, pain was a language. It was a message sent from him to her. Now, it was just data. A symptom.

  "I'm going home, Mark," she said. "I'll pack a bag for you. For the hospital."

  She walked out of the office and down the corridor. The vertigo hit her in the stairwell. She had to hold the railing.

  She realized with a sudden, hollow terror that she missed the anger. She missed the version of Mark who was capable of hurting her, because that version of Mark was capable of loving her. That version had agency. That version could choose to be better.

  The man in that office wasn't her husband anymore. He was a patient. He was a collection of symptoms to be monitored, a risk profile to be mitigated. She would care for him. She would ensure he took his meds. She would watch for signs of recurrence. But she would never again wait for him to come home and explain why he was late, because lateness, like shoving, was just a system error now.

  She got into her car and sat there for a long time. She tried to summon the rage, just for a moment. She tried to picture his hand on her arm and feel the betrayal.

  But all she could see was the MRI. The dark spot on the gray matter.

  She started the engine. She put the car in drive. She felt like a ghost haunting her own life, steering a vessel through a world where nothing meant anything anymore, because no one was home to mean it.
