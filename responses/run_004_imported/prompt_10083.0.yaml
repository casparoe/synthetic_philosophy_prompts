      *   *Exemption:* The MRI result. It's not that he *couldn't help it* in the moment (excuse), it's that *he* wasn't fully there (exemption). The agent is gone.
      *   *The Vertigo:* The feeling that if he's not responsible, he's not her husband in the way she thought. The intimacy dies when the blame dies.

  6.  **Writing - Focusing on Sensory Details:**
      *   The bruise (purple/yellow).
      *   The kitchen table (cold linoleum).
      *   The doctor's voice (flat, clinical).
      *   The internal sensation of anger turning into... nothing. Or into pity.

  7.  **Self-Correction during Drafting:**
