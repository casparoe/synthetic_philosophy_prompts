      *   *Idea 4:* A violent incident where a medical cause is discovered. (Echoes the Whitman reference).
      *   *Selection:* Let's go with a spouse/partner dynamic involving sudden, uncharacteristic violence or aggression, followed by a medical revelation. This allows for the visceral heat of betrayal/anger (participant) to cool into the sterile chill of diagnosis (objective). It highlights the "exemption" aspect perfectly.

  3.  **Character & Setting:**
      *   **Protagonist:** Elena.
      *   **Antagonist (subject of shift):** Mark, her husband.
      *   **Setting:** Their home, specifically the aftermath of an incident, moving to a doctor's office or receiving news. Let's make it immediate aftermath + the news delivery to compress the timeline. Actually, let's make it the moment the *news* lands. That's where the pivot happens.
      *   **The Incident:** Mark shoved her. Not a full assault, but a violation of the marital contract.

  4.  **Drafting - Section by Section:**

      *   **Beginning (Participant Mode):** Establish the anger. The bruise on the arm. The expectation of an apology. The narrative of *choice*. "He chose to do this." The heat of resentment.
      *   **Middle (The Catalyst):** The doctor's call or the test results. The introduction of the "thing" inside the brain. The tumor/lesion.
      *   **The Pivot (The Shift):** The moment the anger evaporates, not because of forgiveness, but because the *target* of the anger disappears. He becomes a vessel, a machine with a broken part.
      *   **Ending (Objective Mode):** The feeling of hollowness. He is now a project, a patient, a problem to solve. The loss of the relationship *as a relationship*.

  5.  **Refining the Strawsonian Elements:**
      *   *Reactive Attitudes:* Elena's anger, her waiting for him to look ashamed, her demand for "Why?"
