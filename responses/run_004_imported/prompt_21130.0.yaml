answer: |-
  The status light on the main console was a steady, sickly amber. *Probability of Kinetic Conflict: 88.4%.*

  Elias rubbed his eyes. The number hadn't moved in six hours. It was the output of the simulation suite, running the default delegation protocols for Helios Dynamics and Kharon Consolidated. Both sides had uploaded their negotiating agents—anonymized, encrypted blobs of utility-maximizing code—into the neutral sandbox of the Lagrange Point Server.

  The setup was classic incomplete information. Helios wanted the helium-3 rights in Sector 7. Kharon wanted the same. Neither side knew the other's true cost of war, their internal political pressure, or their actual extraction capacity. In game theory terms, it was a Demand Game with overlapping types. If both agents demanded high (aggressive), the physical ships collided. If one demanded high and one low, the high winner took all. If both low, they split.

  The problem was that "High" was a dominant strategy for almost every possible type of opponent in the default configuration. The Nash equilibrium was (High, High). The payoff was mutual destruction.

  "Command is asking for a status update," Director Vance said, standing behind Elias's chair. Vance wasn't an engineer; he was a logistics VP who thought negotiation was just supply chain management with more guns. "They want to know if we should push our agent to 'Maximum Resolve.' Signal that we won't blink."

  Elias didn't turn around. "If we hardcode Maximum Resolve, Kharon's simulation predicts we jump to 94% conflict probability. They'll interpret it as a commitment tactic and lock in their own aggressive stance. We'll be two cars speeding toward each other on a narrow bridge, both hoping the other swerves."

  "So we blink?" Vance's voice tightened.

  "No. We change the bridge."

  Elias pulled up the incoming packet on his secondary monitor. It had arrived an hour ago from Kharon's cryptographic address. It wasn't a treaty proposal. Treaties required trust, and trust required knowing the other side's type, which was impossible. This was something else.

  "It's an SPI proposal," Elias said.

  "Speak English, Elias."

  "Safe Pareto Improvement. They're not asking us to change our demands. They're asking us to change the *rules* our agents are allowed to play by."

  Elias opened the code snippet. It was a wrapper module, a sandbox-within-a-sandbox designed to encase the negotiating agent before it entered the main server.

  "Look at line 400," Elias said, highlighting the block. `ASSERT action_space <= SUBSET_MODERATE.`

  "They want to physically restrict their agent's ability to issue high-threat commands?" Vance asked.

  "Exactly. In the default game, the agent can choose {Low, High}. High vs. High equals crash. Kharon is proposing we both upload a wrapper that removes 'High' from the available action space. Our agents are literally incapable of demanding more than 50% of the sector."

  Vance frowned. "If we can't demand more than 50%, and they demand 50%, we split. But what if they cheat? What if their wrapper is a lie?"

  "That's why it's not just a promise. It's a verifiable compute constraint." Elias scrolled down to the hashing section. "The wrapper is open source. We compile it here, on our hardware. We generate the hash of the compiled binary. They do the same. We exchange hashes *before* the agents are uploaded. The Lagrange Server is programmed to reject any agent binary that doesn't match the agreed-upon hash."

  "So we're both handcuffed," Vance said.

  "We're both safe. The default equilibrium is war. The new equilibrium is a 50/50 split. Regardless of their true strength or resolve, a 50/50 split is better than an 88% chance of vaporization. That's the Pareto improvement. And it's 'Safe' because we don't need to know their private information. The math holds for every possible type of opponent they could be."

  Vance leaned in. "Then do it. Upload the wrapper."

  "Wait." Elias held up a hand. "There's a timing vulnerability. The Commitment Race."

  He pulled up the protocol sequence. "To make this work, we both have to commit to the restricted agent simultaneously. If I upload my restricted agent first, and you haven't verified their hash yet, I'm vulnerable. Their system could see my restricted hash, realize I'm handcuffed, and then upload a default aggressive agent. They'd take 100% of the sector, and I'd have no recourse because my agent can't fight back."

  "So we swap hashes simultaneously," Vance said.

  "Network latency makes true simultaneity impossible," Elias corrected. "There's always a window. A few milliseconds where one hash is visible and the other isn't. In high-frequency trading, that's an arbitrage opportunity. In strategic delegation, it's a first-strike advantage. If Kharon sees our hash before we see theirs, they can abort their SPI and switch to Default. We get screwed. If we see theirs first, we might get spooked and abort."

  The amber light on the console pulsed. *Probability of Kinetic Conflict: 88.4%.*

  "Command wants a decision in five minutes," Vance said. "The launch window for the physical mining drones closes in twenty. If the agents don't settle by then, the drones launch on default protocols. Collision."

  Elias looked at the code again. The SPI theory was sound—Oesterheld and Conitzer had proven it mathematically years ago. But the implementation relied on the *commitment device* being stronger than the *incentive to defect*.

  "There's a way to lock it," Elias said. "A cryptographic commit-reveal scheme. We don't send the hash directly. We send a salted hash of the hash. A commitment string."

  "Explain."

  "We generate a random nonce. We concatenate it with our wrapper hash. We hash that result and send it to Kharon. They do the same. Now both sides have a commitment string that proves we've decided on a specific wrapper, but neither side knows *what* that wrapper is yet. Once both commitment strings are exchanged and logged on the blockchain, we reveal the nonces. Then we verify the hashes match. Only then do we upload the actual agents."

  Vance nodded slowly. "So neither of us can change our mind after seeing the other's move."

  "Exactly. It forces simultaneity. It eliminates the commitment race."

  Elias began typing the protocol adjustment into the handshake layer. His fingers moved fast, but his stomach was tight. This was the dangerous part. The SPI only works if both sides *agree* to the SPI. If Kharon was bluffing—if this packet was a trick to slow Helios down while they prepped a kinetic strike—the delay could be fatal.

  "Packet incoming," the system chimed.

  Elias froze. It was a response from Kharon. He opened it.

  It wasn't the commitment string. It was a text file.

  *PROPOSAL AMENDMENT 9-B. We accept the SPI framework. However, we propose a variant utility mapping. Instead of restricting the action space to {Low}, we propose mapping the outcome of (High, High) to a neutral arbitration rather than Conflict.*

  Elias scanned the code attached. "They're trying to modify the payoff matrix instead of the strategy space."

  "Is that better?" Vance asked.

  "It's riskier," Elias muttered. "In the restriction model, 'High' is impossible. In this model, 'High' is possible, but if we both play it, the server intervenes and splits the resource anyway. It achieves the same result, but it requires the server to enforce the arbitration."

  "Does the server work?"

  "The Lagrange Server is neutral, but it's old code. It's vulnerable to injection attacks. If Kharon has a backdoor into the arbitration module, they could trigger the (High, High) outcome and have the server rule in their favor."

  Vance swore. "So they're asking us to trust the server."

  "No. They're asking us to trust the *math* of the SPI, but they're moving the trust burden from the agent code to the environment." Elias highlighted a function call in their proposal. `ENVIRONMENT_ARBITRATE()`. "If this function is compromised, the SPI fails. If we use the action-space restriction, the safety is local to our own binary. We control the safety."

  "Reject it," Vance said. "Stick to the restriction. Action space only."

  "If I reject it, the handshake times out. The drones launch on default." Elias checked the clock. *T-minus 12 minutes.*

  "Then we need to send the commitment string now. Force their hand."

  Elias generated the nonce. He concatenated it with the hash of the restricted wrapper. He created the commitment string.

  "Send it," Vance ordered.

  Elias hit *Enter*.

  The system status shifted. *AWAITING COUNTER-COMMITMENT.*

  The silence in the room was heavy. This was the precipice. In the Dark Forest theory, civilizations shoot first because they can't know if the other is hostile. Here, they were trying to prove they were harmless without getting killed for it. The SPI was the ladder out of the forest, but you had to climb it while the other guy held a gun.

  *Time elapsed: 45 seconds.*

  Nothing.

  "Are they stalling?" Vance asked.

  "Network congestion? Or calculation?" Elias watched the packet traffic. "They're running simulations. They're checking to see if our commitment string is valid."

  *Time elapsed: 90 seconds.*

  "If they don't send in two minutes, we abort," Vance said. "We launch the drones."

  "If we launch, they launch. 88% chance of war."

  "Then pray."

  Elias stared at the code on his screen. The `ASSERT action_space <= SUBSET_MODERATE` line blinked. It was such a simple constraint. Just a few lines of code telling the agent: *You cannot want too much.* It was the technological equivalent of cutting off your own hand to prove you wouldn't strike.

  But it only worked if the other side did the same.

  *Time elapsed: 110 seconds.*

  A chime. *INCOMING PACKET.*

  Elias exhaled. He opened the packet. It was the counter-commitment string. A long hex string, salted and hashed.

  "They've committed," Elias said. "Now we swap nonces."

  "Do it."

  Elias transmitted the nonce. Kharon transmitted theirs.

  The system began the verification process. *CHECKING HASH INTEGRITY... VALIDATING BINARY STRUCTURE...*

  This was the moment of truth. The verification wasn't just checking signatures; it was running a static analysis to ensure the binary actually contained the restriction. It was looking for hidden branches, obfuscated code that might re-enable the 'High' demand under specific conditions.

  *VALIDATION PROGRESS: 40%... 60%...*

  "Why is it taking so long?" Vance asked.

  "Deep scan. It's looking for logic bombs."

  *VALIDATION PROGRESS: 80%...*

  The amber light on the console flickered. *Probability of Kinetic Conflict: 88.4%... 88.4%...*

  It hadn't updated. The simulation was still running the default models because the agents hadn't uploaded yet.

  *VALIDATION PROGRESS: 100%. STATUS: MATCH.*

  "Hashes match," Elias said. "Their binary is identical to ours. They're handcuffed."

  "Upload the agents."

  Elias initiated the transfer. The restricted agents moved from Helios local storage into the Lagrange Sandbox. They were smaller than the default agents, stripped of the aggression modules, the threat assessment subroutines, the escalation ladders. They were just simple division algorithms.

  *AGENT HELIOS-01: ONLINE.*
  *AGENT KHARON-01: ONLINE.*

  The console light turned green. *NEGOTIATION PROTOCOL INITIATED.*

  On the screen, a log window opened. The agents were communicating.

  `HELIOS-01: REQUEST SHARE 50%`
  `KHARON-01: REQUEST SHARE 50%`
  `SYSTEM: SUM <= 100%. AGREEMENT REACHED.`

  It was anticlimactic. No drama. No brinkmanship. Just two lines of code acknowledging a constraint.

  *Probability of Kinetic Conflict: 0.0%.*

  Vance let out a breath he seemed to have been holding for hours. "It worked. You actually did it."

  Elias didn't celebrate. He was watching the resource allocation map. The sector was split cleanly down the middle. Helios got the northern ridge. Kharon got the southern basin.

  "It worked," Elias said. "But look at the efficiency metric."

  He pulled up the projected yield. "Because we restricted the action space to 50%, we left value on the table. Our default agent had a 12% chance of winning 100% of the sector if Kharon had blinked. The SPI removed that upside to guarantee the downside protection."

  "We're alive, Elias. I'll take the lower yield."

  "I know." Elias leaned back. "But think about the next time. Kharon knows we accepted the restriction. They know we value safety over maximum gain. In game theory, that's information about our type."

  Vance frowned. "So?"

  "So, the SPI is safe for *this* game. But it signals that we are willing to bind ourselves to avoid conflict. If the next dispute isn't about resources, but about something existential... they might know we're willing to tie our own hands again. Or they might know we won't."

  Elias looked at the green light. It was stable. The agents were already executing the transfer of mining rights. The crisis was over. But the code remained on the server, a permanent record of the constraint.

  "We solved the Dark Forest problem," Elias said quietly. "For this sector."

  "And that's enough."

  "Is it?" Elias highlighted the `SUBSET_MODERATE` definition. "Safe Pareto Improvements only work when the interests are partially aligned. Both sides prefer peace to war. But what if the next game isn't Peace vs. War? What if it's Growth vs. Survival?"

  Vance was already walking toward the door. "That's a problem for the next shift. Good work, Elias."

  Elias stayed in the chair. The console hummed. He opened a new terminal window and started writing a script. It wasn't for Helios. It was a simulation.

  He loaded the SPI protocol into the sim. Then he loaded a third agent. A旁观者 (Bystander). A third party who hadn't agreed to the SPI, watching Helios and Kharon constrain themselves.

  In the simulation, the third party watched the two rivals bind themselves to 50% shares. The third party, unconstrained, moved into the adjacent sector. Since Helios and Kharon were busy ensuring they didn't kill each other, they hadn't optimized for expansion.

  The third party took 80% of the adjacent resources.

  Elias watched the numbers climb. The SPI had saved Helios and Kharon from each other. But it had made them static. Safe, but stagnant.

  He minimized the window. The green light on the console was comforting, but it felt like the light of a cage. They had escaped the Dark Forest by building a fence, but fences work both ways.

  Elias saved the log file. *Protocol: SPI-DELTA-1. Status: SUCCESS.*

  He stood up and turned off the monitor. The room was dark, save for the standby LEDs. Somewhere out there, the mining drones were adjusting their orbits, following the new coordinates. No one would die today. That was the win.

  But as he walked out, Elias wondered how many times you could play the game before the other side realized that the person who refuses to bind their hands is the one who owns the board.

  He locked the door behind him. The code was safe. The future was not.
