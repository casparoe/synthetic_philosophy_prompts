answer: |-
  "Consider my colleague," Julian said, stirring his coffee. "She doesn't just use the chatbot; she inhabits it. Job offers, tense emails, interpreting a friend's silence—the query goes out, the response comes back, and she accepts it with the same unreflective trust Inga grants her biological memory. She literally cannot tell where her reasoning ends and the model's begins. That's Otto's notebook, digitized."

  Mara leaned back. "It's a compelling analogy, Julian, but it trades on what Adams and Aizawa called the coupling-constitution fallacy. Just because a system is causally coupled to a cognitive agent doesn't mean it constitutes part of that agent. I rely on my glasses to see, but the lenses aren't part of my visual cortex. Your colleague is tightly coupled to the server, but the processing happens *out there*, not *in here*."

  "But the parity principle demands we look at the role, not the location," Julian countered. "If she performed those inferential steps internally, we'd call it cognition. The chatbot is available, accessible, and automatically endorsed. The boundary of the skin is biologically interesting, but philosophically arbitrary. If the functional loop includes the AI, the mind extends to cover it."

  "Functionalism isn't a free pass to expand boundaries indefinitely," Mara replied. "Otto wrote the notes in his notebook. The content was derived from his own prior cognition. The chatbot isn't retrieving your colleague's past thoughts; it's generating probabilistic token predictions based on a training set she never saw. There's no intrinsic intentionality there. It's syntax without semantics. When she reads the output, she supplies the meaning. The AI is merely a very sophisticated mirror."

  "Is the mechanism of generation really the deciding factor?" Julian asked. "Suppose she had a neural implant that fetched memories from a cloud server. We'd likely call that cognitive. The chatbot is functionally similar—it retrieves relevant information structures on demand. The fact that it's silicon rather than carbon, or that it predicts tokens rather than retrieving synaptic weights, shouldn't negate the cognitive status of the *process* she completes using it."

  "The difference is ownership," Mara insisted. "When Otto reads his notebook, he recognizes his own handwriting, his own past agency. When your colleague reads the chatbot, she's consulting an oracle. If the server goes down, Otto loses his memory traces. Your colleague loses a tool. She doesn't suffer cognitive impairment; she suffers inconvenience. That distinction matters. If we call the chatbot part of her mind, we dilute the concept of mind until it covers every tool we trust. Then 'mind' just means 'thing I use.'"

  "But she says the ideas feel automatic," Julian pressed. "The phenomenology matches. The cognitive labor is distributed. To insist the mind stops at the skull is bio-chauvinism. We evolve to offload cognition. First onto paper, now onto transformers. If the system acts intelligently, and she is the locus of that system's agency, why deny the extension?"

  "Because intelligence isn't contagious," Mara said firmly. "Using a smart tool doesn't make the tool part of you, any more than driving a fast car makes the engine part of your legs. The chatbot lacks understanding. It cannot bear the weight of cognitive constitution because it has no stake in the truth. Your colleague trusts it, yes, but trust isn't constitution. She is the cognizer; the AI is merely the world she is cognizing."

  "So you'd draw the line at the interface?" Julian asked.

  "I'd draw it at the content," Mara corrected. "Until the system holds beliefs rather than simulating them, it remains outside the circle. Otto's notebook holds his beliefs. The chatbot holds nothing."
