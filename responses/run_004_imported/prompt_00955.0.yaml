answer: |-
  You should definitely pause before printing that conclusion. While your summary of his *framework* ("utilitarianism for animals, Kantianism for people") is a standard and generally fair shorthand for the structural distinction Nozick makes in *Anarchy, State, and Utopia* (ASU), your conclusion about him giving libertarians a "clean conscience" regarding factory farming is a significant misrepresentation of what he actually argued.

  Here is the nuance you need to capture to be accurate:

  **1. The Framework is Accurate**
  You are right that Nozick distinguishes between humans and animals. For humans, he argues for "side-constraints" (rights that cannot be violated regardless of the aggregate good). For animals, he suggests we do not have the same deontological constraints, but we are still subject to moral restrictions. He explicitly writes that "utilitarianism for animals" is the appropriate metric.

  **2. The Conclusion is Inaccurate**
  This is where your draft runs into trouble. Nozick did **not** argue that the utilitarian calculus justifies factory farming. In fact, he argued the opposite.

  In ASU (pp. 39–42), Nozick asks whether the pleasure humans get from eating meat outweighs the suffering of the animals. His conclusion is that it does not. He writes that the gustatory pleasure humans derive from meat is "trivial" compared to the intense suffering inflicted on factory-farmed animals. He explicitly states that under a utilitarian calculation for animals, current practices of meat-eating are likely impermissible.

  He did not give libertarians a "clean conscience"; he gave them a philosophical argument *against* factory farming, even without granting animals full libertarian rights. He argued that you cannot inflict massive suffering for a trivial human preference, even if the victim doesn't have "rights" in the strict Lockean sense.

  **3. The "Clean Conscience" Narrative**
  Attributing the "clean conscience" label to Nozick suggests he provided a moral shield for libertarians to ignore animal suffering. In reality, he challenged them to account for it. While it is true that *some* libertarians have used his distinction to argue against animal rights, using Nozick to justify *factory farming specifically* contradicts his explicit text.

  **4. Later Evolution (Context)**
  It is also worth noting for your piece that Nozick later expressed dissatisfaction with his own position in ASU. In his later work, *The Examined Life* (1989), he moved toward vegetarianism and suggested his earlier weighting of animal suffering was too permissive. This reinforces that he did not view his earlier framework as a green light for industrial agriculture.

  **Recommendation for your piece:**
  Instead of saying he gave libertarians a "clean conscience," you might write:

  > "Nozick famously proposed a dual standard: inviolable rights for humans, but a utilitarian calculus for animals. However, contrary to the idea that this excuses factory farming, Nozick himself argued that the trivial pleasure of eating meat rarely justifies the immense suffering of production under that very calculus."

  This preserves the philosophical insight you found without attributing a conclusion to him that he explicitly rejected.
