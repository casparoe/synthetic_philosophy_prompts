      *   **Local Reductionism (Fricker):** A middle ground. We don't need global inductive evidence for all testimony, but we need local, context-sensitive monitoring for *specific* instances. We need to check for defeaters and assess the speaker's credibility in the specific context.
      *   **Dualist/Non-Reductionist Hybrid (Lackey):** Justification has two components: the speaker's competence/sincerity *and* the hearer's appropriate responsiveness. It's not purely basic, but it's not purely inductive either.

