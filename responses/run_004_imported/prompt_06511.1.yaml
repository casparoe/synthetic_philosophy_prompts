      *   *Implication 2: The "Black Box" Problem.*
          *   If I can't audit the reasoning, Reductionism struggles. How do I inductively verify a string theory claim? I can't observe the truth conditions directly. I have to rely on *social* indicators (credentials, peer review).
          *   Anti-Reductionism says the social structure *is* the conduit. The "Principle of Veracity" applies to the institution as much as the individual.

