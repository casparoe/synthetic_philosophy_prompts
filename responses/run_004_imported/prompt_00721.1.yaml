answer: |-
  Your friend has a sharp eye for structural similarities, and honestly, they aren't alone in thinking that. Both puzzles involve a predictor, a reward based on your predicted disposition, and a clash between causal and evidential reasoning. If you put them in a "Decision Theory 101" syllabus, they'd be in the same week.

  However, your instinct to check the literature is spot on. Philosophers don't treat them as the same problem because the **Toxin Puzzle introduces a specific problem of time and intention** that Newcomb's Problem doesn't necessarily have.

  Here is the breakdown of why your friend's "trenchcoat" theory is tempting but ultimately misses the specific knot that Kavka tied.

  ### 1. The Structural Difference: Action vs. Intention
  In **Newcomb's Problem**, the prediction is about what you will *choose* to do, and your choice is the mechanism that delivers the payoff.
  *   **Newcomb:** You choose Box B -> You get $1M (because predicted).
  *   **Incentive:** There is always a pragmatic reason to perform the act that aligns with the prediction (opening the box gets you the money).

  In **Kavka's Toxin Puzzle**, the prediction is about what you *intend* to do, but the payoff is decoupled from the *action*.
  *   **Toxin:** You intend to drink -> You get $1M (deposited tomorrow).
  *   **The Twist:** The next afternoon, the money is already in your account. Drinking the toxin now causes pain and provides *no additional financial benefit*.

  This creates a gap that Newcomb's doesn't have. In Newcomb's, the rational move (for a one-boxer) is to actually take the one box. In Toxin, the rational move (for almost anyone) at the moment of execution is **not to drink**, because the money is secured regardless.

  ### 2. The Problem of Dynamic Inconsistency
  This is the big philosophical hurdle. The Toxin Puzzle is a problem of **dynamic inconsistency**.

  *   **At Midnight (T1):** You want the million. To get it, you must intend to drink at T2.
  *   **At Afternoon (T2):** You have the million (or you don't). Drinking now only brings nausea. A rational agent at T2 has zero reason to drink.

  Here is the catch-22 Kavka identified: **You cannot intend to do what you know you will not do.**

  If you are a rational agent, you know that when T2 arrives, you will not drink (because it's irrational to do so). Because you know you won't drink at T2, you cannot genuinely *intend* to drink at T1. If you can't intend, the predictor sees through you, you don't get the money.

  Your friend's solution ("just resolve to be the type of agent who follows through") assumes you can bypass this. But standard decision theory says you can't just "resolve" your way out of rationality. If drinking is irrational at T2, a rational agent cannot form the intention at T1.

  ### 3. Why "One-Boxing" Isn't Enough
  Your friend argues that a committed one-boxer should have no trouble here. This is actually a major point of contention in the literature.

  *   **Evidential Decision Theorists (EDT):** These are your classic one-boxers. They say "act so that your act is evidence of a good outcome."
      *   *In Newcomb's:* One-boxing is evidence the money is there.
      *   *In Toxin:* Drinking the toxin at T2 is **not evidence** of anything. The prediction already happened. The money is already wired. Drinking provides no new evidence to the past. So, a standard EDT agent might one-box in Newcomb's but still refuse to drink the toxin.
  *   **Causal Decision Theorists (CDT):** These are your two-boxers. They fail Newcomb's (usually) and definitely fail Toxin (because drinking causes no good).

  To solve the Toxin Puzzle, you need something stronger than standard one-boxing. You need a theory of **Resolute Choice** (championed by Edward McClennen) or **Constrained Maximization** (David Gauthier).

  These theories argue that rationality isn't just about maximizing utility at every specific moment (T2); it's about sticking to a plan made at T1 that maximizes utility overall. A "Resolute Chooser" drinks the toxin not because it makes sense at T2, but because they bind themselves to the plan formed at T1.

  ### 4. Why the Literature Keeps Them Separate
  Philosophers keep them separate because they attack different parts of agency:

  1.  **Newcomb's Problem** attacks the definition of **Rational Choice**. (Should we follow dominance or expected utility?)
  2.  **The Toxin Puzzle** attacks the definition of **Intention**. (Can we intend to do something we have no reason to do when the time comes?)

  Gregory Kavka actually designed the puzzle specifically to show that **intention is not just a prediction of your own behavior.** If intention were just "predicting I will do X," you could never intend to drink the toxin (because you predict you won't). But if intention is a distinct mental state that can commit you, maybe you can.

  ### The Verdict for Your Road Trip
  Tell your friend they get partial credit. They are right that the puzzles are cousins, and they are right that a "Resolute One-Boxer" solves both.

  **However,** they are wrong that the solution carries over *automatically*.
  *   You can be a one-boxer on Newcomb's (believing your choice influences the past via correlation) without being a Resolute Chooser on Toxin (believing you can bind your future self to act against their immediate interests).
  *   Many philosophers accept one-boxing in Newcomb's but admit they would *not* drink the toxin, acknowledging they would lose the million. They admit this makes them "irrational" in the long run, but consistent in the moment.

  **The TL;DR:** Newcomb's asks, "What should you choose?" The Toxin Puzzle asks, "Can you promise yourself something you'll regret?" Being a one-boxer answers the first question, but it doesn't automatically give you the superpower to answer the second. That requires a specific (and debated) theory of **resolute agency** that goes beyond standard decision theory.

  So, the philosophers aren't being slow; they're arguing about whether it's even *possible* to be the agent your friend describes.
