answer: |-
  **Setting:** *A university conference room, 5:30 PM. Empty coffee cups litter the table. A whiteboard still displays a tally: 7 in favor of hiring the candidate, 6 against. The committee has formally adjourned, but two members remain.*

  **Characters:**
  *   **ELENA:** Believes the majority vote carries significant epistemic weight.
  *   **MARCUS:** Skeptical of the formal conditions required for group reliability.

  **ELENA:** (Caping her pen) Seven to six. It's narrow, but the math is on our side, Marcus. You're looking at that tally like it's a coin toss. It's not. It's a signal.

  **MARCUS:** A signal buried in noise. You're invoking Condorcet, I assume? The idea that because we have thirteen voters, the majority is almost certainly right?

  **ELENA:** I'm invoking the logic of aggregation. Even if each of us is only modestly competent—say, a 60% chance of identifying the right candidate independently—the probability that the majority is wrong drops precipitously as the group size increases. We aren't just counting heads; we're filtering error. The majority verdict is epistemically privileged over any single dissenting opinion, including yours.

  **MARCUS:** "Independently." That's the word doing all the heavy lifting in that sentence, Elena. Condorcet requires independent votes. We just spent three hours deliberating. Sarah changed her vote after David spoke. David voted based on the chair's opening summary. Our errors aren't independent; they're contagious. If the chair's summary was biased, seven of us aren't making seven independent errors; we're making one shared error, seven times over.

  **ELENA:** You're conflating causal independence with statistical independence. Condorcet works if our votes are *conditionally* independent given the truth of the matter. Yes, we shared evidence—that's the point of a committee. But our interpretations of that evidence? Our cognitive noise? That's still idiosyncratic. Unless you think we're all clones, the law of large numbers still applies. The idiosyncrasies cancel out; the signal remains.

  **MARCUS:** But what if the signal is weak? The theorem hinges on competence being strictly greater than one-half. $p > 0.5$. Do you honestly believe every single person at this table has a better-than-random chance of predicting this candidate's tenure success?

  **ELENA:** They're senior scholars. They've hired before. To assume they're worse than a coin flip is cynical.

  **MARCUS:** It's not cynicism; it's domain specificity. I might be $p > 0.5$ on philosophy of mind, but on this candidate's sub-field? I'm guessing. If even a few voters are below the 0.5 threshold, they drag the average down. And here's the kicker: Condorcet isn't symmetric. If the average competence dips even slightly *below* 0.5, the theorem doesn't just fail; it inverts. The larger the group, the *more* certain the majority is to be wrong. By deferring to the seven, we might be amplifying incompetence rather than filtering it.

  **ELENA:** That's a theoretical edge case. In practice, we screen committee members for competence. But let's grant your point about correlation. Even with some dependency, the "wisdom of crowds" literature shows robustness. You need strong correlation to break the effect. Are you arguing that David's influence over Sarah is so total that her vote adds zero new information?

  **MARCUS:** I'm arguing that in a hiring committee, information cascades are the norm, not the exception. We vote publicly. We justify our positions. If the first three speakers lean "yes," the fourth person faces social pressure to conform, or they update their belief based on the *fact* that three others said yes. That's not independent evidence; that's double-counting. The theorem assumes the group sums $n$ pieces of evidence. We actually summed $n$ opinions derived from a shared, limited pool of evidence.

  **ELENA:** So you'd prefer the expert model? Hand the decision to the one person with the highest $p$-value and ignore the rest?

  **MARCUS:** If we could identify that person reliably, yes. Or at least, I'd prefer we stop treating the vote count as a proxy for truth. The vote is a political settlement, Elena. It tells us where the room landed, not where the truth lies.

  **ELENA:** But without the vote, we have no mechanism to aggregate the partial knowledge distributed across the room. I might know the candidate's publication record is thin; you know their teaching evals are stellar. Neither of us has the full picture. The vote forces us to weigh those dimensions and output a binary decision. The majority outcome represents the intersection of our overlapping judgments. It's the best estimator we have.

  **MARCUS:** It's the best estimator *only if* we are voting sincerely on our private information. But strategic voting exists. Two people voted "yes" because they know the department needs a body in that sub-field, not because they think the candidate is excellent. That violates the sincerity condition. Their vote isn't a truth-claim; it's a resource allocation. Condorcet can't handle that. It treats all "yes" votes as epistemic signals, but some are just political moves.

  **ELENA:** (Pauses, tapping the table) Fair. Strategic voting dilutes the epistemic purity. But you're asking for a level of transparency we can't get. We can't interrogate every voter's motive. We have to trust the procedure. If we discard the majority verdict because the assumptions aren't *perfectly* met, we're left with paralysis. The theorem doesn't require a vacuum; it just requires that the errors aren't systematically biased.

  **MARCUS:** And that's exactly where I worry. Systematic bias is common. We all read the same three letters of recommendation. If those letters are inflated—a known systemic issue in our field—then our errors *are* systematically biased. We aren't rolling thirteen dice; we're rolling one die thirteen times. In that scenario, the majority verdict gives us a false sense of security. It makes us feel certain when we should feel terrified.

  **ELENA:** So what's the alternative? Discard the vote?

  **MARCUS:** No. Count it, but don't sanctify it. Treat the 7-6 split not as "truth vs. error," but as "high uncertainty." The theorem suggests that when the vote is close, the collective competence is likely hovering right around 0.5.

  **ELENA:** (Smiles faintly) So the narrowness of the vote *is* the data point.

  **MARCUS:** Exactly. If Condorcet holds, a 13-0 vote implies high confidence. A 7-6 vote implies the signal-to-noise ratio is terrible. My objection isn't to counting votes; it's to the idea that the majority *automatically* inherits epistemic authority. In a 7-6 split, the minority isn't necessarily the error term. They might be the canaries in the coal mine.

  **ELENA:** I can accept that. The vote grants authority, but the margin dictates the confidence interval. We hire the candidate—the majority rules—but we acknowledge the epistemic risk.

  **MARCUS:** Agreed. We hire. But we don't claim the math proves they're the best. The math just proves we broke the tie.

  **ELENA:** I'll take that. (She stands up) Come on. Let's go tell the chair the "signal" was noisy, but the decision stands.

  **MARCUS:** (Gathering his papers) Just don't tell him the errors might be correlated. He thinks his opening speech was illuminating, not a common-cause bias.

  **ELENA:** Some epistemic filters are better left unexamined.
