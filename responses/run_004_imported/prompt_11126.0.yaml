prompt: |-
  My younger sister is a behavioral ecologist -- stotting in gazelles, some sexual selection work in birds -- and she's marrying her partner, also a biologist, in a few weeks. She's asked me, her older brother and (unfortunately, according to her) the philosophy professor in the family, to give the wedding toast. I keep circling back to Zahavi's handicap principle -- that whole costly-signaling idea that hard-to-fake signals are what make communication honest, precisely because a cheap "trust me" can be produced by anyone regardless of whether its true -- because I think there's something genuinely moving hiding in there about weddings: the whole ridiculous, expensive, public, impossible-to-take-back production of the thing being the point rather than a regrettable side effect, the way a peacock's tail proves something its call never could.

  I'm nervous about actually pulling this off though. Half the guests are people from her department who will notice immediately if I get Zahavi wrong or if the analogy doesn't actually hold up -- and honestly I'm not even sure the principle is supposed to apply to signals within an already-formed pair, as opposed to signals aimed at rivals or prospective mates, so there's a technical worry sitting right next to the emotional one. The other half is our grandmother and a dozen cousins who did not come to a wedding for a lecture on sexual selection, they came to hear that these two people love each other. Could you draft me something, four or five minutes read aloud, that actually uses the handicap principle as the engine of the toast rather than a cute reference dropped in once and then abandoned? It has to survive both crowds: it can't come across as "your marriage is just a fitness display," which would genuinely hurt my sister's feelings, but it also can't chicken out of the idea once it's raised. Bonus points if it ends on a line people can actually raise a glass to.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older brother, philosophy professor.
      *   **Audience:** Mixed. Half biologists (sister, partner, colleagues, students) who know behavioral ecology. Half family (grandmother, cousins) who just want a nice wedding speech.
      *   **Subject:** Sister (behavioral ecologist, works on stotting/sexual selection) marrying Partner (biologist).
      *   **Core Theme:** Zahavi's Handicap Principle (costly signaling theory).
      *   **Constraint 1:** Must use the principle as the *engine* of the toast, not just a passing reference.
      *   **Constraint 2:** Must be technically accurate enough for biologists (no glaring errors about the scope of the principle).
      *   **Constraint 3:** Must be emotionally resonant for non-scientists (not reducing love to mere fitness).
      *   **Constraint 4:** Length: 4-5 minutes read aloud (approx. 600-750 words).
      *   **Constraint 5:** Needs a toast line at the end.
      *   **Tone:** Warm, intellectual but accessible, slightly self-deprecating (philosopher brother vs. scientist sister), deeply affectionate.

  2.  **Deconstruct the Handicap Principle for this Context:**
      *   *The Science:* Amotz Zahavi proposed that signals are honest only if they are costly. A peacock's tail is heavy and attracts predators. If a weak bird tried to grow one, it would die. Therefore, having the tail proves quality.
      *   *The Potential Pitfall:* As the user noted, this is usually about *mate choice* (pre-marriage). Applying it to an *existing marriage* requires a shift. It's not about proving fitness to *get* the mate anymore; it's about the ongoing cost of maintaining the bond.
      *   *The Philosophical/Emotional Pivot:* A wedding isn't just the signal of "I want you." It's the signal of "I am willing to endure the cost of *us*." The "cost" isn't negative; it's the investment. Vulnerability, compromise, public commitment, the "ridiculous production" of the wedding itself.
      *   *Addressing the Biologists:* Acknowledge the technical nuance. Admit that usually, this applies to courtship. But argue that marriage extends the signal.
      *   *Addressing the Family:* Translate "costly signaling" into "sacrifice," "effort," and "public promise."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the relationship (brother/sister), the role (philosopher), and the tension (science vs. humanities). Acknowledge the sister's expertise.
      *   **The Setup (The Science):** Introduce Zahavi and the Handicap Principle simply. Use the gazelle/peacock example (since she studies stotting).
      *   **The Pivot (The Problem):** Acknowledge the technical worry. Usually, this is for *getting* a mate. So why use it for a wedding?
      *   **The Core Argument (The Application):** The wedding itself is the handicap. It's expensive, public, and hard to reverse. But more importantly, the marriage is the ongoing cost. It's not about fitness; it's about fidelity and effort. "Cheap" love is easy to say. "Costly" love is hard to live.
      *   **The Emotional Connection:** Connect this to the specific couple. They know the cost. They choose it anyway.
      *   **Conclusion:** Bring it back to the family. The "toast" line needs to bridge the science and the sentiment.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add warmth about the sister. Make sure the "cost" doesn't sound like a burden, but like an investment.
      *   *Critique:* Will the biologists roll their eyes?
      *   *Fix:* Explicitly mention that this is an *analogy* and acknowledge the shift from courtship to pair-bond maintenance. Use terms like "honest signal" correctly.
      *   *Critique:* Will Grandma be bored?
      *   *Fix:* Explain the peacock tail clearly. Focus on the universal truth: actions speak louder than words.

  5.  **Drafting the Speech (Iterative Process):**
      *   *Opening:* "As the philosophy brother..." Good hook.
      *   *The Science:* Keep it crisp. Stotting is her thing, mention it.
      *   *The Twist:* The wedding *is* the tail.
      *   *The Deepening:* It's not just the day, it's the years.
      *   *The Closing:* Needs to be punchy. "To the cost" sounds bad. "To the signal" sounds cold. "To the honesty of the thing" is better. Let's try: "To the costly, beautiful truth of you."

  6.  **Final Polish:**
      *   Check word count (aiming for ~700 words for 4-5 mins at a moderate pace).
      *   Ensure the tone is celebratory.
      *   Make sure the transition from "biological mechanism" to "human love" feels seamless, not reductive. *Crucial:* Emphasize that humans *mean* the cost, whereas animals just *bear* it. That's the philosophical add-on.

  7.  **Final Review against constraints:**
      *   Zahavi central? Yes.
      *   Biologists satisfied? Yes (acknowledges the courtship vs. pair-bond distinction).
      *   Family satisfied? Yes (focuses on commitment and love).
      *   Toast line? Yes.

  *(Self-Correction Note during final review)*: I need to make sure I don't imply the sister is a gazelle. She *studies* stotting. Make that distinction clear. Also, ensure the "cost" doesn't sound like "suffering." It should sound like "investment."

  8.  **Finalizing the Text.** (Proceeds to generate output based on these thoughts.)
answer: |-
  Good evening. For those of you who don't know me, I'm the older brother. And for those of you who do know me, you know I'm the philosophy professor. Which, according to the bride, makes me the only person in the family qualified to talk about logic, but the least qualified to talk about reality.

  She is, of course, a behavioral ecologist. She spends her life studying how animals survive and reproduce. She knows about stotting gazelles and sexual selection in birds. So, when she asked me to give this toast, I felt a specific kind of terror. I cannot talk about love without accidentally citing Kant, and she cannot hear about love without checking the evolutionary validity of the claim.

  So, I decided to meet her in the middle. I want to talk about Amotz Zahavi and the Handicap Principle.

  For the biologists in the room: yes, I know what I'm doing. For everyone else: stick with me.

  Zahavi's theory is about honest communication. In nature, anyone can make a sound. Anyone can puff up their chest. But words are cheap. A weak animal can claim to be strong. So, how do you prove you are truly strong, truly committed, or truly healthy? You produce a signal that is too costly to fake.

  The classic example is the peacock. That tail is ridiculous. It's heavy, it drains energy, and it lights you up like a flare for predators. A sick peacock cannot grow that tail. A weak peacock cannot survive with it. So, when a peacock displays that tail, it is telling the truth. Not because it wants to, but because the cost of the signal guarantees its honesty.

  Now, I know what the department is thinking. The Handicap Principle is usually applied to courtship. It's about *getting* the mate. And technically, you two have already done that. You are a formed pair bond. So, why bring this up now?

  Because I believe a wedding is not just the celebration of a choice made. It is the initiation of a signal maintained.

  In a world where "I love you" can be texted in thirty seconds and ghosted in thirty more, how do you signal that this is different? How do you signal that this is permanent?

  You do it by doing something expensive. Not just financially, though God knows weddings cost a fortune. You do it by making a public, legal, social, and spiritual commitment that is difficult to undo. You gather your grandmother, your cousins, your colleagues, and your students, and you say, "Witness us."

  You are creating a handicap. You are voluntarily taking on a cost—the cost of compromise, the cost of vulnerability, the cost of putting another person's needs ahead of your own fitness metrics—to prove that the signal is real.

  A cheap promise is easy to break. A costly promise is hard to abandon.

  [Partner's Name], you are a biologist. You know that in nature, costly signals are rare because they are dangerous. But [Sister's Name] and I grew up watching our parents show us that the only love worth having is the kind that costs you something. It costs you sleep. It costs you ego. It costs you the safety of being alone.

  And that is the philosophical twist I want to offer the scientists. In animals, the cost is a burden they bear to prove their quality. In humans, the cost is a gift we give to prove our devotion. We don't just endure the handicap; we choose it, together, because the honesty it buys is worth the price.

  So, to the guests who came for the science: Yes, this is a high-fidelity signal of pair-bond stability.
  And to the guests who came for the love: Yes, this is two people promising to show up, even when it's hard.

  The wedding is the tail. The marriage is the survival.

  So, if everyone could please raise a glass.

  To the Handicap Principle: May your signals always be costly, may they always be honest, and may you never have to run from a predator alone.

  To [Sister's Name] and [Partner's Name].
