      *   **Tone/Level:** "Gut level," concrete, suitable for a long-form piece (intellectual but accessible), acknowledging the user's existing skeleton.

  2.  **Deconstruct the Lucas-Penrose Argument:**
      *   *Premise 1:* Human mathematicians can see the truth of Gödel sentences ($G$) for formal systems ($F$).
      *   *Premise 2:* $F$ cannot prove $G$ (if $F$ is consistent).
      *   *Conclusion:* Humans are not equivalent to $F$ (or any Turing machine).
