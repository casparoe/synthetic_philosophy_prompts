  8.  **Final Polish:** Check against the user's specific prompts ("gut level," "concretely," "weighing the disagreement"). Ensure the distinction between the "Consistency Rebuttal" and the "Single System Objection" is sharp. (The user asks if the mathematician is right to wave away consistency for the single system issue. I need to nuance that: Consistency is the logical hinge, Single System is the applicability hinge.)

