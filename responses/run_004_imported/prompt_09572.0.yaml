      *   *The Mechanist Counter:* If the mind *is* a formal system $M$, then by Gödel's Second Incompleteness Theorem, $M$ cannot prove its own consistency.
      *   *The Dilemma:* How does the human know $M$ is consistent?
          *   Option A: Intuition/Insight. (Penrose: "We just see it.")
          *   Option B: Proof within a larger system $M'$. (Then we ask about $M'$'s consistency.)
      *   *The Regress:* If you add "I am consistent" as an axiom, you create a new system $M+$. Now there's a new Gödel sentence $G+$. Can you see $G+$ is true? Only if you know $M+$ is consistent. Do you?
      *   *Concrete Analogy:* Imagine a map. The map says "This map is accurate." Can you trust that statement just because it's on the map? No. You need an external validator. If the human mind is the map *and* the validator, how do we know the validator isn't hallucinating consistency?

