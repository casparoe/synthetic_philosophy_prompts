prompt: |-
  I'm assembling the series bible for a hard science-fiction trilogy whose plot hinges on the true reason the galaxy has stayed silent, and I want the eventual reveal to feel scientifically earned rather than convenient. Setting aside which explanation would make for the best twist, I need your honest assessment of which are currently the most defensible given the actual state of the debate. Please rank the following resolutions to the Fermi paradox from most to least credible: the Great Filter, the Zoo Hypothesis, the Aestivation Hypothesis, the Transcension Hypothesis, the Dark Forest Hypothesis, the percolation (colonization-wave) model, and the Sandberg-Drexler-Ord statistical dissolution of the paradox. For each, add one clause specifying what would have to be true of the universe, or of civilizations in general, for that hypothesis to be the correct one. Please give your answer as a JSON array of objects ordered from most to least credible, each with the keys "hypothesis" and "justification".
