      *   *Dark Forest:* Popularized by Liu Cixin. Assumes survival is the primary need and resources are finite, leading to preemptive strikes. Requires specific game-theoretic assumptions about all civilizations. Controversial but logically consistent within its axioms. Moderate credibility (often seen as too pessimistic or assuming too much uniformity).
      *   *Zoo Hypothesis:* Suggests aliens are hiding us. Requires universal cooperation among all alien civilizations to maintain silence. Highly unlikely given timescales and number of potential actors. Low-Moderate credibility.
