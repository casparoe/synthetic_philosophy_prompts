prompt: |-
  Okay so I'm about two thirds through a historical novel set in Harlem in late 1926, and theres a chapter where my protagonist -- a green reporter for a Black weekly -- lands a real sit-down interview with Du Bois, not long after "Criteria of Negro Art" ran in the Crisis. I don't want him to just deliver the "all art is propaganda" line and have her nod along, I want her to actually press him on it. Can you draft me eight to ten interview questions that dig into the real tensions in that essay -- I want at least one on how he squares calling art "propaganda" with also demanding it be genuinely beautiful and not just didactic trash, one on what he'd say to the younger Fire!! writers who think his version of "good propaganda" is just as controlling as the respectability politics he claims to hate, and one on whether his fury over Van Vechten's Nigger Heaven that same year is really about propaganda at all or just about who gets to control the image of Black life. For each question, give me the answer he's most likely to actually give her, then a sharp follow-up question that doesn't let him off the hook.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Historical novel, Harlem, late 1926.
      *   **Characters:** Protagonist (green reporter for a Black weekly), W.E.B. Du Bois (elder statesman, editor of *The Crisis*).
      *   **Source Material:** Du Bois's essay "Criteria of Negro Art" (published in *The Crisis*, October 1926).
      *   **Goal:** 8-10 interview questions that dig into tensions within the essay/era, not just surface-level agreement.
      *   **Specific Requirements:**
          *   One question on "propaganda" vs. "beauty" (the core tension of the essay).
          *   One question on the younger generation (*Fire!!* writers like Hughes, Thurman, Nugent) and respectability politics.
          *   One question on Carl Van Vechten's *Nigger Heaven* (published 1926) and control of imagery.
          *   Format: Question -> Likely Du Bois Answer -> Sharp Follow-up.
      *   **Tone:** Intellectual, tense but respectful, historically accurate (voice of 1926 Du Bois), probing (protagonist shouldn't be a pushover).

  2.  **Deconstruct Du Bois's Position (Late 1926):**
      *   *Criteria of Negro Art:* "All Art is propaganda and ever must be." He argues Black artists *must* fight for truth and justice because the world refuses to see them as human otherwise. However, he also insists art must be beautiful ("Truth and Right and Justice" must be clothed in Beauty).
      *   *Relationship with Youth:* He mentors them but finds their bohemianism (sexuality, grit, primitivism) dangerous to the political cause.
      *   *Van Vechten:* Du Bois hated *Nigger Heaven*. He saw it as a caricature, focusing on cabarets and sex rather than the striving middle class. He felt it reinforced stereotypes.
      *   *Voice:* Formal, precise, impassioned but controlled, slightly paternalistic, deeply convinced of the moral weight of art.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Propaganda vs. Beauty.*
          *   Draft Q: You say art is propaganda, but also beautiful. Isn't that contradictory?
          *   Refinement: Needs to be sharper. Focus on the risk of the message swallowing the medium.
          *   Du Bois Answer: He will argue they are inseparable. Beauty is the vehicle.
          *   Follow-up: What happens when the truth is ugly? Does beauty lie then?

      *   *Requirement 2: The Younger Generation (*Fire!!*).*
          *   Draft Q: What about Langston and Wallace? They say you control them.
          *   Refinement: Frame it around "respectability." The *Fire!!* crowd wanted to depict the "low-down." Du Bois wanted the "talented tenth."
          *   Du Bois Answer: He denies controlling them but warns of consequences. He thinks they are playing into white hands.
          *   Follow-up: Is it freedom if they only succeed by confirming white stereotypes?

      *   *Requirement 3: Van Vechten/Nigger Heaven.*
          *   Draft Q: Do you hate *Nigger Heaven* because of propaganda?
          *   Refinement: Focus on *who* tells the story. A white patron vs. Black agency.
          *   Du Bois Answer: It's a caricature. It ignores the striving class.
          *   Follow-up: Is your anger that it's false, or that a white man profited from the lie?

      *   *Filling the remaining 5-7 questions:*
          *   Need to cover: The role of the Black press, the white audience, the definition of "Truth," the burden on the artist, the future of the Renaissance.
          *   *Q4 (White Audience):* Who is the art for? If it's propaganda to change white minds, does that make white people the primary audience?
          *   *Q5 (The "Ugly" Truth):* Specifics on poverty/crime. Can we depict the slums without it being propaganda *against* us?
          *   *Q6 (The Artist's Burden):* Is it fair to ask a poet to be a politician?
          *   *Q7 (The Crisis):* How does *The Crisis* fit in? Is it art or news?
          *   *Q8 (Universalism):* You want Negro art to be universal, but defined by Negro problems. Is that a paradox?
          *   *Q9 (Failure):* What if the propaganda fails? What if white people see the art and hate us more?
          *   *Q10 (Legacy):* What do you want to be remembered for? The scholar or the agitator?

  4.  **Refining Voices:**
      *   *Protagonist:* Needs to sound smart, nervous but determined, representing the "New Negro" who respects the elder but sees the cracks.
      *   *Du Bois:* Needs to sound like Du Bois. Use words like "curiously," "manifest," "striving," "caricature." He shouldn't sound defensive, but authoritative.

  5.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   Specific topics covered (Propaganda/Beauty, Fire!!, Van Vechten)? Yes.
      *   Format (Q, A, Follow-up)? Yes.
      *   Historical accuracy (Late 1926)? Yes. *Nigger Heaven* came out mid-1926. "Criteria" came out Oct 1926. So this interview is likely Nov/Dec 1926.

  6.  **Polishing the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure Du Bois doesn't sound like a villain. He genuinely believes he is saving the race. The tension comes from the *cost* of that belief.
      *   *Correction:* Ensure the protagonist's follow-ups aren't rude, but incisive. She's a "green reporter" but she's sharp.
      *   *Check:* Did I capture the specific phrase "All Art is propaganda"? Yes, need to reference it.
      *   *Check:* Ensure the *Fire!!* reference is accurate. *Fire!!* was published Nov 1926. So this interview is happening right as *Fire!!* is hitting the streets or just about to. This adds great tension.

  7.  **Final Polish:** Check the rhythm of the dialogue. Ensure the historical context (Harlem, 1926) bleeds through. (e.g., mentioning the rent parties, the specific names like Thurman or Hughes).

  **(Self-Correction Note on Timeline):** "Criteria of Negro Art" was published in *The Crisis* in October 1926. *Fire!!* was published in November 1926. *Nigger Heaven* was published in August 1926. So an interview in late 1926 is perfectly timed for all three to be fresh wounds/topics.

  8.  **Final Output Generation** (Proceeding to draft the response based on these thoughts).
answer: |-
  Here are ten interview questions designed to capture the intellectual friction of late 1926. They are structured to show your protagonist's growing confidence and Du Bois's rigid, paternalistic conviction.

  **1. The Core Thesis**
  **Question:** "In your October essay, you write plainly: 'All Art is propaganda and ever must be.' You argue that the Black artist has no choice but to fight for justice. But sir, if a poem's primary purpose is to win an argument, doesn't it cease to be a poem and become a pamphlet?"
  **Du Bois's Likely Answer:** "You confuse the motive with the medium. I do not ask for clumsy verse or ugly painting. I say that Truth and Right and Justice must be clothed in Beauty. If the art is not beautiful, no one will look at it, and the propaganda fails. But if it is beautiful and says nothing of our struggle, it is a toy, and we are not children playing with toys while the world burns."
  **Follow-up:** "But who decides what 'Beauty' is? If the standard of beauty is set by the very people we are trying to convince, aren't we just dressing our plea in their clothes to beg for mercy?"

  **2. The Van Vechten Controversy**
  **Question:** "There is a great furor over Mr. Van Vechten's *Nigger Heaven*. You've called it a 'caricature.' Is your objection that the book is artistically poor, or that a white man is profiting from the spectacle of Black life?"
  **Du Bois's Likely Answer:** "My objection is that it is a lie. It presents Harlem as nothing but cabarets, sex, and primal rage. It ignores the striving teacher, the doctor, the worker. It feeds the white imagination exactly what it expects: that we are exotic creatures, not human beings. A white man writing this is not observation; it is tourism."
  **Follow-up:** "But there are cabarets in Harlem, Professor. There is sin here, just as there is on the Upper West Side. If a Black writer depicted those same streets, would you call it truth then, or would you still call it propaganda against the race?"

  **3. The Younger Generation (*Fire!!*)**
  **Question:** "There is a new group of writers—Mr. Hughes, Mr. Thurman—they've just launched *Fire!!*. They say they want to depict the 'low-down' folks, the ones you say Van Vechten caricatures. They argue that your demand for 'uplifting' art is just respectability politics in disguise. How do you answer them?"
  **Du Bois's Likely Answer:** "I answer that they are playing with fire, quite literally. The white public is not ready to distinguish between a Black artist showing a prostitute and a white racist pointing at her and saying, 'See? That is all they are.' I do not forbid them from writing truth. I warn them that the enemy will use their truth as a weapon against us."
  **Follow-up:** "So they must censor themselves for the sake of the race? At what point does protection become a cage, sir? If we only show our best faces, are we not admitting that our worst faces are shameful?"

  **4. The Audience**
  **Question:** "You write that the purpose of Negro art is to 'gain the right of Black folk to love and enjoy.' But to gain that right, someone has to grant it. Does this not make the white audience the true judge of our art? Are we not still performing for the master?"
  **Du Bois's Likely Answer:** "We are performing for the world. The world happens to be dominated by white power. Until that power concedes that we are men, we must use every tool, including art, to compel them. It is not performance; it is siege warfare."
  **Follow-up:** "But in a siege, if you spend all your ammunition trying to convince the enemy you're human, do you have any left left to describe your own soul to yourself?"

  **5. The Burden on the Artist**
  **Question:** "I speak to poets who feel crushed by this responsibility. They say they want to write about lilacs, or love, or the moon, without it being a statement on the Negro Problem. Is it fair to ask a poet to carry the weight of a political movement?"
  **Du Bois's Likely Answer:** "It is not fair. It is necessary. When a man's foot is on your neck, you do not have the luxury of writing about the moon. You write about the foot. Once the foot is removed, perhaps they may write of lilacs. But not today."
  **Follow-up:** "And if the foot never lifts? Do we condemn a generation of artists to die without ever having sung a song that was truly their own?"

  **6. Defining "Truth"**
  **Question:** "You demand art show the 'Truth' of Black life. But Black life in Harlem is a thousand different things. It's the lawyer on Strivers' Row, and it's the gambler on 135th. Why is one truth acceptable for art and the other dangerous?"
  **Du Bois's Likely Answer:** "Because context is everything. To show the gambler without showing the systemic oppression that created the gambling is a lie. To show the lawyer without showing the struggle it took to become one is also a lie. I ask for the full context, which most artists, in their laziness, refuse to provide."
  **Follow-up:** "Or perhaps, sir, they refuse to provide it because they believe the gambler has a story worth telling even if he never becomes a lawyer."

  **7. The Role of *The Crisis***
  **Question:** "*The Crisis* is the premier platform for Negro art. Yet it is also the organ of the NAACP. When you publish a story in *The Crisis*, is it selected for its merit, or for its utility to the Association?"
  **Du Bois's Answer:** "I publish what is excellent. But excellence, in our position, cannot be separated from utility. If a story is beautifully written but makes us look foolish, it is not excellent. It is a failure of judgment."
  **Follow-up:** "So the editor is the gatekeeper of the race's dignity? That is a tremendous amount of power for one man to hold over the definition of 'excellence.'"

  **8. Universalism vs. Particularism**
  **Question:** "Critics say Negro art should be universal. You say it must be distinctively Negro to prove our humanity. Isn't that a paradox? How do we be uniquely Black and universally human at the same time?"
  **Du Bois's Answer:** "It is only a paradox to those who do not understand that humanity is a mosaic. You cannot be universal by erasing your particularity. I am human *because* I am a Negro, not *despite* it. To hide my Negroness to appeal to the universal is to admit I am less than human."
  **Follow-up:** "Then why does it feel like you are asking us to hide the parts of our Negroness that don't fit the image of the 'Talented Tenth'? Is that not erasure, too?"

  **9. The Risk of Failure**
  **Question:** "Let's assume you are right. We make beautiful propaganda. We show our suffering and our striving. What if it doesn't work? What if white America sees our art, understands our pain, and hates us anyway?"
  **Du Bois's Answer:** "Then we have still saved ourselves. We have documented our own existence. We have told the truth to our children, even if the world refuses to hear it. But I do not believe it will fail. The human heart cannot resist true beauty forever."
  **Follow-up:** "That is a matter of faith, Professor, not strategy. And if your faith is wrong, have we wasted the only Renaissance we might ever get?"

  **10. The Legacy**
  **Question:** "Fifty years from now, when the 'Negro Problem' as we know it has changed, what do you want these stories to be? Do you want them read as historical documents of a struggle, or do you want them to stand as art, untouched by the era that made them?"
  **Du Bois's Answer:** "I want them to stand as proof that we were here. That we suffered, we strove, and we created. If they are art, good. If they are documents, good. So long as they testify that we did not die silently."
  **Follow-up:** "But if they are only documents, sir, then we are still specimens in a jar. I want to know if you believe we are capable of creating something that belongs to the world, not just to the race."
