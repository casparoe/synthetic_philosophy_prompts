answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Odessa's grandchild.

  Looking out at this room, I see the two worlds my grandmother lived in every single day. On one side, I see the neighbors, the families, the kids who grew up on this corner. On the other, I see the artists, the critics, the old guard who spent decades in these halls debating theory and technique. And right down the middle, hanging over where her worktable used to sit, is that old, frayed banner.

  "All art is propaganda and ever must be."

  I know that when some of you hear the word "propaganda," you think of lies. You think of ugly posters from a war you didn't fight, or noise that drowns out the truth. And I know that when *others* of you hear it, you think of the arguments. The late nights in this very room where voices would rise over dinner, debating W.E.B. Du Bois, debating purpose, debating whether a painting could be a weapon and a jewel at the same time.

  Grandma knew that word would follow her. She stitched it onto that banner on purpose. She wanted it to be the first thing you saw when you walked in to learn how to mix a color or stretch a canvas.

  But if you only knew her as the lady who made banners for the block party, or only knew her as the fierce intellectual who wouldn't let you get away with a sloppy brushstroke, you might have missed the point she was trying to make.

  To Odessa, "propaganda" didn't mean the message was more important than the art. It meant the message *needed* the art to survive.

  She used to tell me that if you have something true to say to the world, you owe it to the truth to say it beautifully. She believed that bad art for a good cause was actually an insult to the cause. She'd say, "If you ask people to look at your struggle, you don't get to be lazy. You don't get to be sloppy. Because if the work is cheap, they'll think the struggle is cheap, too."

  I watched her teach this lesson a thousand times. I remember a boy, maybe ten years old, painting a sign for a church anniversary. He was rushing. The lettering was uneven. The faces on the figures were starting to look like cartoons. He wanted to go outside and play.

  Grandma stopped him. She didn't yell. She just handed him a rag and told him to wipe it off. He cried. She cried. But she made him redo it. She told him, "We do not paint caricatures of ourselves in this house. We do not hand the world a mess and ask them to respect it. We give them excellence. That is how we win."

  That was her version of the quote. That was her Du Bois.

  To the neighbors here: She didn't want you to just have a voice. She wanted your voice to be undeniable. She wanted the banners hanging on those lampposts to be so bright, so well-made, so undeniably *good*, that nobody could drive past this neighborhood and look away. She wanted you to know that your stories were worth the best paint, the best brushes, and the hardest work.

  To the artists here: She knew the debates. She knew the critics who said art should be "pure," detached from the streets. She disagreed. She believed art was never detached. But she also knew the critics who thought passion excused poor craft. She disagreed with them harder. She spent forty-five years proving that you don't have to choose between beauty and purpose. That the discipline *is* the politics.

  She was 88 years old. Her hands were shaky at the end, but until the very last month, if she saw a crooked line on a flyer, she'd reach for a ruler. Not because she was controlling. But because she respected you enough to demand better.

  This center was never just a storefront. It was a place where we learned that how we present ourselves matters. That our joy, our grief, and our marches deserve to be framed in gold, not cardboard.

  So, as we say goodbye to Miss Odessa, I ask that we honor her not just by remembering the banners, but by remembering the standard.

  If you paint, paint like the truth depends on it—because she believed it did.
  If you speak, speak with clarity.
  And if you see a young person trying to tell their story, don't just let them speak. Hand them a better brush. Show them how to make it beautiful.

  Grandma, we saw the banner. We read the quote. And finally, I think we understand the work. Rest now. The lettering is straight. The colors are true. And the art is good.

  Thank you.
