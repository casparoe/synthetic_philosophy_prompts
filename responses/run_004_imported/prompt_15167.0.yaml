prompt: |-
  My grandma - Miss Odessa to pretty much the whole neighborhood - passed away two weeks ago at 88, and I'm giving her eulogy this Saturday. She ran a little storefront arts program on the same corner for something like 45 years, teaching neighborhood kids to paint banners for every march and church anniversary and block party going, and she had this one line from W.E.B. Du Bois that she'd quote at you the second you brought up "real art" versus "that other stuff" - "all art is propaganda and ever must be" - it was literally stitched onto a banner that hung over her worktable my whole life. The service is being held at the arts center instead of a funeral home, which is what she wanted, and that means the room is gonna be split right down the middle: half family and neighbors who are gonna hear the word "propaganda" and think Soviet posters or fake news, and half the old guard from the city's Black arts scene, some of them had actual out-loud arguements with her over that exact quote for decades, and they will 100% notice if I flatten it.

  Here's the part I'm nervous about getting wrong. From what I've read since she died, Du Bois wasn't saying the message is all that matters and the craft can be garbage - he was pretty adamant that the art also had to be beautiful and honest, that's actually what made it propaganda worth having, and that part was everything to her specifically. She'd genuinely make a kid redo a whole banner if the lettering was sloppy or the faces looked like caricatures, and she'd say bad art for a good cause does more damage to the cause than no art at all does. So I don't want a eulogy that just says "grandma believed art should be political," because that's not really it and the arts-scene crowd will clock it in about two seconds, but I also can't get up there and give a lecture on Du Bois to a room half full of people who are already crying and just want to remember her. Can you write the eulogy for me - something like 5 to 7 minutes read out loud - that actually uses this idea to say something true about who she was, in a way that lands for both halves of that room?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Miss Odessa, 88 years old, passed away two weeks ago.
      *   **Role:** Grandchild giving the eulogy.
      *   **Setting:** The arts center she ran for 45 years (not a funeral home).
      *   **Audience:** Split 50/50.
          *   Group A: Family and neighbors (may associate "propaganda" with negativity/Soviet/fake news).
          *   Group B: Old guard Black arts scene (know the Du Bois quote intimately, argued with her about it, will detect simplification).
      *   **Key Theme:** W.E.B. Du Bois's quote: "All art is propaganda and ever must be."
      *   **Crucial Nuance:** Odessa didn't believe message > craft. She believed *bad* art hurts the cause. Beauty and honesty *make* the propaganda effective. She demanded excellence (redoing sloppy banners, no caricatures).
      *   **Tone:** Personal, respectful, truthful, accessible but not dumbed down.
      *   **Length:** 5 to 7 minutes spoken (approx. 750-1000 words at a moderate pace).
      *   **Goal:** Honor her specific philosophy without lecturing the grieving audience.

  2.  **Deconstruct the Philosophy (The "Du Bois Nuance"):**
      *   *Common Misconception:* Propaganda = Lies/Manipulation/Message over Quality.
      *   *Odessa's/Du Bois's Truth:* Propaganda = Advocacy/Purpose. But for advocacy to work, the art must be undeniable. If it's ugly or sloppy, people dismiss the message. Therefore, excellence *is* the political act.
      *   *Metaphor:* The Banner. It hangs over the worktable. It needs to be read from afar (message) but look good up close (craft).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the space. This is her home, not a funeral parlor. Acknowledge the split in the room gently.
      *   **The Hook (The Quote):** Bring up the banner immediately. It's the elephant in the room. Address the word "propaganda."
      *   **Addressing Group A (Neighbors/Family):** Explain what that word meant to *her*, not what it means on the news. It meant "caring enough to speak."
      *   **Addressing Group B (The Arts Scene):** Acknowledge the debates. Validate their knowledge. Show that I (the grandchild) understand the depth of her stance.
      *   **The Core Story (The Craft):** Illustrate her demand for excellence. The kid redoing the banner. The "no caricatures" rule. This bridges the gap: Excellence *was* the respect for the community.
      *   **The Synthesis:** Why did she do this? Because the neighborhood deserved beauty, not just noise.
      *   **Closing:** Bring it back to the legacy. The banners are gone, but the standard remains. A final goodbye.

  4.  **Drafting - Tone and Voice:**
      *   Needs to sound like a grandchild speaking, not an academic.
      *   Warm, steady, slightly firm (channeling Odessa a bit).
      *   Avoid jargon. Use concrete images (paint, brushes, the corner, the banner).
      *   *Self-Correction during drafting:* I need to make sure I don't spend too much time defining Du Bois. The focus must stay on Odessa. The Du Bois stuff is just the lens to see *her*.

  5.  **Timing Check:**
      *   Average speaking pace is ~130-140 words per minute.
      *   5 minutes = ~650 words.
      *   7 minutes = ~950 words.
      *   Target: ~850 words to allow for pauses and emotion.

  6.  **Refining the "Propaganda" Explanation:**
      *   *Bad:* "Grandma liked political art."
      *   *Good:* "She believed that if you're going to ask the world to look at your struggle, you owe it to the struggle to make it beautiful."
      *   *Key Phrase:* "Sloppy work was a lie." (This captures her intensity).

  7.  **Addressing the Split Audience:**
      *   Don't explicitly say "Half of you think X, half think Y."
      *   Instead, weave the sentiments together. "Some of you knew her as the lady on the corner... others knew her as the fierce critic..."
      *   Find the common ground: They all loved her.

  8.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the ending feels like a release.
      *   Make sure the Du Bois quote is contextualized correctly as per the prompt's research.

  **(Self-Correction Note):** I need to be careful not to make the eulogy *about* Du Bois. It's about Odessa. Du Bois is just the tool she used. The emotional core is the grandmother who made kids redo their work because they deserved better.

  9.  **Final Review against constraints:**
      *   5-7 mins? Yes.
      *   Addresses the "propaganda" nuance? Yes.
      *   Respects both audience halves? Yes.
      *   Honors Odessa? Yes.

