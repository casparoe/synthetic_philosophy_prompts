answer: |-
  The diagnosis was printed on heavy cardstock, the font sans-serif and reassuringly neutral. *Chrono-Emotive Lag, Type 4.*

  Elias held the paper under the clinic's halogen lights. He was thirty-four, a structural engineer who spent his days calculating load-bearing tolerances, yet he had spent the last six months crying in the shower on Tuesdays about things that had happened on Fridays.

  "It's a disconnect in the processing timestamp," Dr. Vane said, steepling her fingers. She was the head of the Temporal Psychiatry wing at the St. Jude Institute. "Your cognitive mind registers the event. But your somatic emotional response is buffered. Like a video stream with poor bandwidth. You aren't numb, Elias. You're just delayed."

  Elias nodded. The relief was physical, a loosening in his chest. For months, he had thought he was broken, or perhaps sociopathic. To be told he was simply *buffered* gave the chaos a shape. It gave him a noun.

  "Will it get worse?" Elias asked.

  "Without intervention, the lag can widen. A week. A month. But with the regimen, we aim to synchronize the timestamp."

  Elias took the cardstock home and taped it to his refrigerator. That night, his cat died. It was an old animal; it simply stopped breathing on the rug. Elias looked at the body. He felt a mild, intellectual curiosity. He noted the time: 8:14 PM. He remembered the diagnosis. *Buffered.*

  He waited.

  On Thursday, three days later, Elias was at the grocery store buying milk. He passed the aisle with the cat food. The grief hit him then, a violent, crushing wave that forced him to crouch behind a display of canned tuna. He sobbed until a store manager asked if he needed medical assistance.

  Elias stood up, wiped his face, and felt a strange sense of vindication. The diagnosis had held. The prediction was accurate. He was a Type 4.

  He joined the online forum, *The Laggers*, two weeks later. It was a small community, barely two hundred active users, but they were fervent. They traded stories of delayed reactions. A wedding that made them weep a month later. A job loss that didn't sting until the following tax season. They shared coping strategies: setting calendar reminders for potential emotional events, creating "safe spaces" for the anticipated breakdown.

  Elias began to curate his life to accommodate the lag. He stopped making decisions on days when he expected a delayed reaction to a previous day's stress. He wore noise-canceling headphones in public, not to block out sound, but to signal to others that he was in a "processing window."

  He returned to Dr. Vane's office six months later. He looked healthier. He had grown a beard, which he claimed helped him feel more grounded during the lag periods.

  "How is the synchronization?" Vane asked, typing into her tablet.

  "Consistent," Elias said. "Three days, plus or minus four hours."

  "And the intensity?"

  "Manageable. I've learned to schedule it."

  Vane paused, her fingers hovering over the screen. "Schedule it?"

  "I know when it's coming now," Elias said. "If I have a conflict on Monday, I know Thursday afternoon is compromised. I block it out. I've actually become more productive. I don't fight the lag anymore. I build around it."

  Vane looked at him. In the early trials of Chrono-Emotive Lag (CEL), patients had been distressed by the unpredictability. The symptom was defined by its intrusion, its ability to disrupt the present with the past. But Elias spoke of the lag as a tool, a structural element of his week.

  "Does it still feel involuntary?" Vane asked.

  Elias tilted his head. "That's a hard word to define, Doctor. Is breathing involuntary? I can hold it, I can pace it. But eventually, I have to breathe. The lag is like that. It's a function. I'm just the interface."

  Vane typed a note: *Subject exhibits high integration of diagnostic narrative. Symptom presentation shifting from intrusive to accommodative.*

  "Have you been speaking with other patients?" Vane asked.

  "The forum helps. We call it 'riding the wave.' Some of us are trying to extend the lag intentionally."

  Vane stopped typing. "Extend it?"

  "If the emotion is delayed, the impact is less sharp," Elias explained. "One user, 'Kite', is training himself to lag by six months. He says it makes life smoother. No peaks, no valleys. Just a flat, manageable line of delayed processing."

  "That sounds like avoidance," Vane said, her voice tightening. "The goal of treatment is synchronization. Reducing the lag."

  "But if the lag is the adaptation, why reduce it?" Elias asked. He looked at her, his eyes calm, terrifyingly calm. "You classified us, Doctor. You told us we weren't broken, just delayed. So we optimized the delay."

  Elias left the office. Vane sat alone for a long time.

  She pulled up the master file for Chrono-Emotive Lag. It was a relatively new classification, introduced only five years ago to describe a cluster of symptoms that didn't fit PTSD or Depression. When the criteria were written, the "lag" was described as a *deficit*, a failure of the nervous system to process stimuli in real-time.

  She opened the case notes for Patient 104. Then 105. Then 112.

  They were all changing.

  The early patients had described the lag as a theft—time stolen from the moment of impact. The newer patients, the ones who had come in after the diagnosis was published, after the *Laggers* forum had gained traction, described it differently. They spoke of it as a capacity. A skill. They were no longer suffering from a delay; they were practicing *temporal distancing*.

  Vane clicked on the diagnostic criteria document. It was due for review next month.

  If the patients were no longer distressed by the lag, did it remain a disorder? If they were actively cultivating it, was it a pathology or a subculture?

  She looked at the definition of Type 4 CEL: *Involuntary dissociation of affective response from temporal stimulus.*

  *Involuntary.*

  She thought of Elias scheduling his grief like a meeting. She thought of 'Kite' training himself for a six-month buffer. They were using the diagnosis as a manual. The map was not just describing the territory; the territory was reshaping itself to match the map, and in doing so, it was rendering the map obsolete.

  If she changed the criteria to exclude those who found utility in the lag, she would invalidate Elias's reality. If she kept it, she was medicalizing a lifestyle choice that her own institution had inadvertently engineered.

  Vane highlighted the word *Involuntary*. Her cursor blinked at the end of the word.

  Outside the window, the city moved in real-time. Cars braked instantly when lights turned red. People laughed at jokes the moment they were told. The world was synchronous. But in her clinic, a new kind of person was emerging, a person who lived in the echo, who had learned to love the delay because the delay made the pain manageable.

  She couldn't diagnose a strategy. She couldn't treat a choice.

  Vane deleted the word *Involuntary*. She stared at the blank space. Without it, the definition dissolved. There was no disorder, only a difference in timing.

  She saved the document as *Draft_v7_Review_Pending*.

  Down in the waiting room, the receptionist called out the next name. A young woman stood up. She looked anxious, clutching a printout from a website.

  "I think I have the Lag," the woman said as she approached the desk. "I cried yesterday about a breakup from last week. I read that I'm supposed to feel it three days later, but I'm on day four. Is my calibration off?"

  The receptionist smiled sympathetically. "Dr. Vane will help you synchronize."

  Vane watched through the glass of her office door. She saw the woman sit down, relax her shoulders, and check her watch. The woman was no longer worried about the grief. She was worried about the timing. She was waiting for the feeling to arrive so she could confirm she was who the paper said she was.

  Vane turned back to her screen. She opened a new email to the board of psychiatry.

  *Subject: Reclassification of CEL.*
  *Message: We are seeing a feedback loop in the patient population. The diagnosis is becoming a prescriptive tool rather than a descriptive one. We are not observing the natural history of a condition. We are observing the adoption of a technology.*

  *Recommendation: Suspend classification pending further study.*

  She didn't send it. She sat there, listening to the hum of the server, wondering if, by the time she pressed send, the decision itself would feel like it belonged to last week, or next month. She waited for the feeling of doubt to arrive, but for the first time in her career, she couldn't tell if it was there at all, or if she was just expecting it to be.
