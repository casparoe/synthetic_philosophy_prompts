answer: |-
  You have hit on one of the most subtle and important distinctions in decision theory and game theory. Your intuition is perfectly correct for standard decision problems: **with perfect recall, a mixed strategy can never strictly outperform the best pure strategy.**

  The reason the Absent-Minded Driver problem breaks this rule is that **Imperfect Recall breaks the equivalence between Mixed Strategies and Behavioral Strategies.**

  Here is the breakdown of why the math works differently here and what is actually happening.

  ### 1. The Standard Intuition (Perfect Recall)
  In a standard decision tree where you remember where you are (Perfect Recall), a **Pure Strategy** is a complete plan: "If I am at node 1, do X; if I am at node 2, do Y."

  A **Mixed Strategy** is a probability distribution over these complete plans. For example, "50% chance I commit to plan (X, X), 50% chance I commit to plan (Y, Y)."
  Because expectation is linear, the payoff of a mixed strategy is just the weighted average of the payoffs of the pure plans. Therefore, it can never exceed the best pure plan. This is guaranteed by **Kuhn's Theorem**.

  ### 2. The Absent-Minded Constraint (Imperfect Recall)
  In the Absent-Minded Driver problem, the two intersections belong to the **same Information Set**. You cannot distinguish them.

  This restricts the definition of a **Pure Strategy**. A pure strategy must map an Information Set to an Action. Since there is only one Information Set ($I$), a pure strategy must specify a single action for $I$.
  *   **Pure Strategy A:** At $I$, Exit. (Result: You exit at the first intersection. Payoff = 0).
  *   **Pure Strategy B:** At $I$, Continue. (Result: You continue at both. Payoff = 1).

  Crucially, the plan "Exit at the first, Continue at the second" is **not a valid pure strategy** in this game structure. You literally cannot write that plan down because you cannot condition your action on "first" vs "second."

  So, if you mix over these *valid* pure strategies (e.g., 50% chance to adopt Strategy A, 50% chance to adopt Strategy B), your expected payoff is indeed bounded by 1.
  $$ E[\text{Mixed}] = 0.5(0) + 0.5(1) = 0.5 $$

  ### 3. The Loophole: Behavioral Strategies
  The optimal solution ($p=2/3$) is not a "Mixed Strategy" in the sense of randomizing over complete plans. It is a **Behavioral Strategy**.

  A Behavioral Strategy assigns a probability distribution over actions **at each visit to the information set**.
  *   **Strategy:** At $I$, flip a coin. Continue with probability $p$, Exit with probability $1-p$.

  Because you might visit the information set twice, this local randomization compounds.
  *   Probability of Exiting at 1: $(1-p)$
  *   Probability of Exiting at 2: $p \times (1-p)$ (Continue first, then Exit)
  *   Probability of Exiting at 3 (Past both): $p \times p$ (Continue, then Continue)

  The expected payoff function becomes:
  $$ V(p) = 0(1-p) + 4[p(1-p)] + 1[p^2] $$
  $$ V(p) = 4p - 4p^2 + p^2 = 4p - 3p^2 $$

  ### 4. Why This Beats Pure Strategies
  Notice the math here.
  *   **Mixing over Pure Plans** creates a **linear** combination of payoffs: $\alpha V(\text{Pure}_1) + (1-\alpha) V(\text{Pure}_2)$.
  *   **Behavioral Randomization** creates a **non-linear** (quadratic) function of $p$: $4p - 3p^2$.

  The "mixing" helps because it allows you to correlate actions across time *without* remembering time. By randomizing locally, you statistically distribute your paths:
  *   If $p=1$ (Pure Continue), you always get the payoff of 1.
  *   If $p=0$ (Pure Exit), you always get the payoff of 0.
  *   If $p=2/3$, you create a specific probability mass on the middle outcome (Exiting at the second intersection) that is **higher** than what you could achieve by deterministically committing to a path you can't distinguish.

  Essentially, randomization acts as a **substitute for memory**. Since you can't remember "I already passed one intersection," you use randomness to ensure that *sometimes* you act as if you are at the first, and *sometimes* as if you are at the second, even though you feel the same way both times.

  ### 5. Summary
  Your intuition wasn't wrong; the setup is special.
  1.  **Perfect Recall:** Mixed Strategies = Behavioral Strategies. Payoff is linear in mixing probability. Mixing never helps.
  2.  **Imperfect Recall:** Mixed Strategies $\neq$ Behavioral Strategies (Kuhn's Theorem fails). Payoff is non-linear in behavioral probability. Mixing **can** help.

  If the driver could pre-commit at the bar (before becoming absent-minded) with perfect recall, they would choose the plan "Continue at 1, Exit at 2" for a payoff of 4. But given the constraint that the decision must be made *at the intersection* under imperfect recall, randomization is the only tool that allows access to the "middle" payoff outcomes.
