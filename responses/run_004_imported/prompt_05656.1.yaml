      *   In the Absent-Minded Driver problem, the constraint is **Imperfect Recall**. The agent cannot condition their action on *which* intersection they are at. They must use the *same* probability $p$ at both nodes because they belong to the same information set.
      *   *Crucial Distinction:* What counts as a "Pure Strategy" here?
