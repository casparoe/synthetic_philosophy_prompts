      *   **Optimal Strategy:** Continue with probability $p = 2/3$ at each intersection. Expected Payoff = $4/3 \approx 1.33$.
      *   **Pure Strategies:** Always Exit ($p=0$) $\to$ Payoff 0. Always Continue ($p=1$) $\to$ Payoff 1.
      *   **The Core Confusion:** In standard decision theory (and game theory against nature), a mixed strategy is a convex combination of pure strategies. Therefore, the expected utility of a mix should lie *between* the utilities of the pure strategies. It shouldn't strictly exceed the best pure strategy.
      *   **The Question:** What is it about *imperfect recall* specifically that breaks this logic? Why does randomization help here when there's no opponent?

  2.  **Initial Fact-Checking & Validation:**
