      *   *Pure Strategy 3 (Continue past 2):* Payoff = 1.
      *   *Mixed Strategy:* Choose "Continue" with prob $p$ at *every* intersection encountered.
      *   *Calculation:*
          *   Prob(Exit 1) = $1-p$. Payoff = 0.
          *   Prob(Exit 2) = $p(1-p)$. Payoff = 4.
          *   Prob(Continue past 2) = $p^2$. Payoff = 1.
          *   $E[U] = 0(1-p) + 4p(1-p) + 1(p^2) = 4p - 4p^2 + p^2 = 4p - 3p^2$.
          *   Maximize $4p - 3p^2$: Derivative $4 - 6p = 0 \Rightarrow p = 2/3$.
          *   Max Value: $4(2/3) - 3(4/9) = 8/3 - 4/3 = 4/3$.
