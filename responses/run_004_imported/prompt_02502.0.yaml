              *   Meaning: Alice's outcome doesn't depend on Bob's *setting*.
          2.  **Outcome Independence (OI):** $P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$ (or $P(A, B | ...) = P(A|...)P(B|...)$).
              *   Meaning: Alice's outcome doesn't depend on Bob's *outcome* (given settings and $\lambda$).
      *   **No-Signaling (Relativistic Causality):** $P(A | a, b) = P(A | a)$ (marginal probabilities don't depend on distant settings).
