          *   So QM violates OI, satisfies PI.
          *   Signaling requires violating PI (specifically, the empirical version of it).
          *   Therefore, QM violates Bell Locality (because OI fails) but respects Relativity (because PI holds, preventing signaling).

  4.  **Synthesize the "Philosophically Relevant" Locality:**
      *   When physicists say "QM is nonlocal," they usually mean it violates Factorizability (Bell Locality).
      *   When they say "QM is compatible with Relativity," they mean it satisfies No-Signaling.
