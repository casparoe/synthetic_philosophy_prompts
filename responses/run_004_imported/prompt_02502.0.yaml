      *   **Specific Questions:** Do they amount to the same thing? Is one weaker? Which is the philosophically relevant sense of "locality" when people say Bell forces us to give up locality?

  2.  **Deconstruct the Concepts:**

      *   **Bell's Locality (Factorizability):** $P(A, B | a, b, \lambda) = P(A | a, \lambda) \times P(B | b, \lambda)$.
          *   $A, B$: Outcomes at Alice and Bob.
          *   $a, b$: Settings (parameters) at Alice and Bob.
          *   $\lambda$: Hidden variables (complete state of the past common cause).
      *   **Jarrett's Decomposition (1984):** Factorizability is equivalent to the conjunction of two conditions:
