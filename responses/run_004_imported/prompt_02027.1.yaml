  I'm drafting the closing chapter of a novel about two rival election forecasters, Dinah and Renata, who spent a decade at the same data-journalism outfit before an ugly falling-out split them into competing shops. Dinah made her name being bold, putting out headline numbers like 95% or 4% and telling reporters a race is "basically decided"; Renata, her former protégée, is the house skeptic, keeping her stated probabilities clustered in the 60–80% range even in contests Dinah calls a lock. The book's climactic scene is a retrospective panel, years and several elections later, where a moderator tries to settle once and for all whose track record was actually "more accurate." I want the scene's tension to turn on something I gather is technically real, not just a rhetorical trick I'm inventing for the plot: that the verdict on who was more accurate isn't independent of which strictly proper scoring rule is used to grade the two of them. I've read enough Joyce and Pettigrew to know this kind of scoring-rule-relativity is a genuine live issue in accuracy-first epistemology, but not enough to construct a correct instance of it myself.

  So, before I write a word of dialogue, I'd like help getting the mathematics right, since one character works through it on a napkin in front of the other. Could you construct a small, fully worked-out example — the same slate of, say, 8 to 12 resolved yes/no races, each with Dinah's stated credence, Renata's stated credence, and the actual outcome — using numbers a real human forecaster might plausibly say out loud (nothing more extreme than roughly 3%/97%), such that Dinah comes out strictly more accurate overall under the Brier score while Renata comes out strictly more accurate overall under the logarithmic score? Please lay out the per-race scores and the running totals (or averages) for each woman under both rules, so I can check the arithmetic myself and put exact figures in the characters' mouths.

  Once the example is on the table, I'd be grateful for two more things, pitched in a register I can later adapt for the characters themselves. First, a plain-terms explanation of why this kind of reversal is possible at all, given that both scores are strictly proper — my hunch is that it comes down to boundedness, but I'd like you to confirm, correct, or complicate that. Second, your own honest sense, for my background understanding rather than the page: within accuracy-first epistemology, is this sort of scoring-rule-relativity generally treated as a shrug-worthy technicality, or does it put real pressure on the field's ambition to ground rational credence in a single, theory-neutral notion of accuracy?
