      *   **Context:** A novel featuring an elderly Russian literature translator considering the device through Dostoevsky's lens.
      *   **Constraints:** Avoid simplistic answers ("Dostoevsky loved suffering"). Use specific texts (*Notes from Underground*, *The Brothers Karamazov* [Grand Inquisitor], *The Dream of a Ridiculous Man*). Engage with Nozick's three specific arguments (doing vs. experiencing, character formation, artificial reality). Determine Dostoevsky's theory of well-being (hedonic vs. freedom/struggle vs. transcendent).
