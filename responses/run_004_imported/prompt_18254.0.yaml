answer: |-
  **CONSTITUTIONAL COMMISSION ON ELECTORAL LAW**
  **MEMORANDUM OF DECISION**

  **TO:** The Interim Legislative Council
  **FROM:** The Commission on Electoral Structure and Representation
  **DATE:** October 14, 2024
  **SUBJECT:** Recommendation Regarding the Legal Status of Political Parties

  **I. EXECUTIVE SUMMARY**

  The Commission has deliberated on the proposal to prohibit organized political parties in the upcoming parliamentary elections, permitting only independent candidates and transient alliances. This proposal, grounded in Simone Weil's *On the Abolition of All Political Parties*, argues that the party mechanism inherently suppresses individual judgment and substitutes collective passion for truth.

  After rigorous review, the Commission **rejects the proposal for a total ban** on political parties. However, acknowledging the validity of Weil's critique regarding the moral hazards of partisan discipline, the Commission **adopts a modified framework**. This framework retains the party system necessary for a Westminster-style government but institutes robust constitutional protections for individual parliamentary judgment and cross-party deliberation.

  **II. CONSIDERATION OF THE WEIL PROPOSAL**

  We have taken the argument for abolition seriously, not as a utopian abstraction, but as a diagnostic tool for our current fragility. Weil's assertion that "a party is a machine for manufacturing collective passion" is not merely philosophical; it is historical fact in our recent civil conflict. Our former parties did not compete on policy; they competed on existential identity, demanding total submission from members and treating political opponents as enemies of the state. In that context, the party was indeed a device where growth and power became the sole ends, rendering truth and justice secondary to survival.

  Weil is correct that a majority vote does not equal legitimacy. A parliament of disciplined party blocs can pass unjust laws with perfect procedural regularity. If the goal of this Constitution is to create a government capable of discerning the common good rather than merely aggregating interests, the warning against the "collective pressure" of the party whip is morally sound.

  **III. THE IMPERATIVE OF REJECTION**

  Despite the moral force of Weil's argument, the Commission concludes that a statutory ban on parties is incompatible with two non-negotiable requirements of our situation:

  1.  **The Westminster Requirement:** We have chosen a Westminster-style parliament. This system relies on the fusion of executive and legislative power, sustained by a confidence vote. Without organized parties to sustain a government through a legislative term, executive authority will collapse into paralysis. A parliament of 200 independents cannot form a stable cabinet; it can only form transient majorities that dissolve at the first sign of hardship. In a post-conflict state, executive paralysis is a precursor to renewed violence.
  2.  **The Transparency of Faction:** Weil argues that abolishing parties abolishes faction. Our assessment is the inverse. In a society emerging from ethnic and regional conflict, human beings will organize. If formal parties are banned, organization will not cease; it will go underground. Warlords, ethnic leaders, and patronage networks will contest seats as "independents," bound by blood and money rather than public manifestos. A formal party structure, regulated by law, forces these factions into the light, subjecting them to funding disclosures and public scrutiny. Hidden factions are more dangerous than declared ones.

  **IV. THE MODIFIED FRAMEWORK: PROTECTING THE INDIVIDUAL JUDGMENT**

  While we retain parties as organizational necessities, we accept Weil's premise that the *spirit* of the party must not crush the *conscience* of the representative. To mitigate the "machine" effect, the Electoral Law will include the following provisions:

  1.  **The Conscience Clause:** No Member of Parliament shall be expelled from their party or barred from future candidacy solely for voting against the party whip on matters designated as issues of conscience (including human rights, electoral reform, and anti-corruption measures).
  2.  **Committee Autonomy:** Legislative committees shall be chaired by opposition members on a rotating basis, and committee votes shall be free from party whipping. This ensures that the detailed work of legislation occurs in a space where truth-seeking is prioritized over party positioning.
  3.  **Internal Democracy Mandate:** To prevent parties from becoming top-down apparatuses, registration requires proof of internal democratic selection for leadership and candidate nomination.
  4.  **Dissolution Mechanism:** Any alliance or coalition government formed post-election must be ratified by a secret ballot of all supporting MPs, ensuring that backbenchers are not merely bargained away by party elites.

  **V. THE COST OF THIS DECISION**

  The Commission must state plainly what this recommendation costs us. By rejecting the abolition of parties, we are accepting a lesser evil to avoid a greater one.

  1.  **We Accept Compromised Truth:** We acknowledge that by keeping parties, we are institutionalizing a system where policy will sometimes be distorted to maintain coalition stability. There will be moments where the "party line" overrides the "just measure." We are trading moral purity for governability.
  2.  **We Accept Collective Passion:** We cannot legislate away the human tendency toward tribalism. Parties will still manufacture passion during campaigns. The law can only mitigate this, not erase it.
  3.  **We Risk Elite Capture:** Despite transparency measures, there is a risk that parties will become vehicles for patronage. The cost of stability is constant vigilance against the corruption of the party mechanism.

  **VI. CONCLUSION**

  Simone Weil wrote that "the growth of the party is its only end." In a time of peace, this might be a manageable vice. In a country emerging from civil war, the priority is not the perfect realization of truth, but the prevention of a return to violence. A Westminster parliament without parties is a contradiction in terms that invites collapse.

  Therefore, we recommend a system that harnesses the organizational capacity of parties while legally fortifying the right of the individual representative to stand against them. We choose a system that allows for the possibility of truth, even if it cannot guarantee it.

  **RECOMMENDATION:** **ADOPT MODIFIED VERSION** (Retain Parties with Conscience Protections).

  ***

  **Signed,**

  *The Commission on Electoral Structure and Representation*
