answer: |-
  **Title:** The Beast in the Machine: Why Kant's Ethics Demands Direct Duties to Animals

  Immanuel Kant is often the villain in the story of animal ethics. His explicit position, scattered through the *Lectures on Ethics* and the *Metaphysics of Morals*, is stark: animals are things. They are "analogues of humanity," but they lack rational autonomy, and therefore, they fall outside the moral circle. When a man shoots his dog because it is too old to work, Kant argues the dog is not wronged. The wrong is committed against the man's own humanity, for cruelty to animals dulls the "shared feeling of their suffering" and weakens the natural predisposition required for moral duty toward other humans. On this reading, our duties regarding animals are merely indirect duties to ourselves.

  However, this orthodox reading is not a stable philosophical position; it is a failure of nerve. It is a prejudice Kant inherited from his theological and rationalist context that his own critical philosophy cannot sustain. Christine Korsgaard, in *Fellow Creatures*, does not merely offer a friendly amendment to Kant; she exposes a fatal fracture in his explicit view. If we follow the internal logic of the Categorical Imperative and the Formula of Humanity, we are compelled to accept that animals are ends-in-themselves. The "indirect duty" view is not the correct reading of Kantian ethics; it is a contradiction of them. Korsgaard is right: the machinery of Kant's moral law breaks down unless it grants direct moral status to sentient beings.

  To understand why the indirect duty view collapses, we must look at the source of value in Kant's system. Kant argues that rational beings are ends-in-themselves because they are the authors of value. Through our rational will, we confer goodness upon objects of our desire. Nothing is good without qualification except a good will. The orthodox Kantian argues that because animals lack this rational will, they cannot be part of the kingdom of ends. They are merely means.

  But this creates a metaphysical absurdity. If rational beings are the source of value, they must value *something*. We do not value things in a vacuum; we value things because they matter to us. And why do they matter? Because we are sentient creatures for whom things can go well or poorly. Pain is bad, not because a rational agent decrees it so abstractly, but because it is intrinsically aversive to the being experiencing it. As Korsgaard argues, if humanity is the source of value, then the *conditions* of valuing must also be respected. Sentience is the precondition for anything mattering at all. To respect humanity as an end-in-itself while disregarding the sentient nature that makes humanity capable of having ends is to respect a ghost while ignoring the machine.

  The instability of the indirect duty view becomes glaring when we apply the test of universalizability. Kantian morality rests on the idea that moral laws must be universal. If I claim that it is permissible to torture a dog because the dog has no rights, I am making a claim about the nature of suffering. I am asserting that the dog's pain is not a moral reason to stop. But if pain is a bad thing, it is a bad thing *for the sufferer*. To claim that the dog's pain only matters because it might upset a human observer is to engage in a solipsism that violates the universal spirit of the Categorical Imperative. It treats the animal's suffering as morally invisible unless it reflects on a human mirror. This is arbitrary. If the capacity to suffer makes a being a "subject of a life" for whom things can be good or bad, then excluding them from direct moral consideration is a form of discrimination indistinguishable from the exclusion of non-property-owning humans or women, which Kant also notoriously struggled with.

  Furthermore, the indirect duty view fails to protect the very human character it claims to safeguard. If animals are truly mere things, then the prohibition against cruelty is contingent. If I can torture a dog in secret, where my character is not hardened by public view and where I feel no empathy for humans that might be triggered, the indirect duty view suggests no moral violation has occurred. This is counterintuitive to the core of deontology. A moral law that depends on the psychological side-effects of an action rather than the nature of the action itself is not a Categorical Imperative; it is a hypothetical rule of thumb. For the duty to be categorical, the wrongness must reside in the act itself. The act is wrong because it violates the integrity of a being that has a good of its own.

  Korsgaard's reconstruction saves Kant from this inconsistency by shifting the focus from *rationality* to *natural teleology*. Animals are not rational agents, but they are natural ends. A dog has a nature that dictates what is good for it (food, shelter, freedom from pain). When we interact with an animal, we are interacting with a being that has its own ends, even if it cannot rationally legislate them. To treat such a being as a mere means is to deny the reality of its existence as a center of value. Kant's error was conflating "moral agency" (the ability to be held responsible) with "moral patienthood" (the right to be treated with respect). We do not hold infants or the severely cognitively impaired responsible for their actions, yet we owe them direct duties. Why? Because they are sentient beings with a good. Animals fall into this same category. To deny them direct duties is to break the chain of value that Kant sought to establish.

  Therefore, the "indirect duty" reading must be rejected as philosophically untenable. It relies on a rigid, arbitrary boundary between reason and sentience that cannot hold up under the weight of Kant's own demand for universal moral law. It reduces morality to a form of moral hygiene for humans, ignoring the objective reality of animal suffering. Korsgaard does not distort Kant; she completes him. She demonstrates that if you take the concept of an "end-in-itself" seriously, you cannot restrict it to the rational elite. Value radiates outward from the rational will to the sentient conditions that make valuing possible.

  Kant was a man of the 18th century, bound by the anthropocentric prejudices of his time. He could not bring himself to say the dog was wronged. But his philosophy is stronger than his prejudice. The logic of the *Groundwork* demands more than the *Lectures* delivered. We must choose between a consistent Kantianism that protects animals or a consistent adherence to Kant's explicit words that undermines the universality of his ethics. There is no choice to be made. The indirect duty view is a dead end. Korsgaard is correct: to be a Kantian is to acknowledge that when we harm an animal, we do not just damage our own character; we wrong *them*.
