answer: |-
  You are right to be skeptical of the idea that it's just a zero-sum transfer of value. If commitment races were zero-sum, we wouldn't worry about them as a systemic risk. The reason commitment races are dangerous in expectation is that they transform bargaining from a **positive-sum coordination problem** into a **negative-sum conflict trap.**

  Here is the mechanism of failure, why it destroys value rather than just redistributing it, and how updatelessness fits into the picture.

  ### 1. The Mechanism: Why it is Negative-Sum
  The canonical model for a commitment race is the game of **Chicken**.

  *   **Scenario:** Two agents are bargaining over a surplus (e.g., splitting $100).
  *   **The Move:** Each agent can commit to a "hard" stance (e.g., "I will accept no less than $90") or a "soft" stance (e.g., "I am willing to negotiate").
  *   **The Payoff:**
      *   Hard vs. Soft: Hard agent gets $90, Soft agent gets $10. (Transfer of value)
      *   Soft vs. Soft: They split evenly ($50/$50). (Cooperation)
      *   **Hard vs. Hard:** The commitments are incompatible. The deal collapses. Both get $0, and perhaps incur a cost of conflict (e.g., -$50 each).

  **The Race Dynamic:**
  If I know you are rational and flexible, I can gain leverage by committing to be inflexible first. I "burn the bridge" behind me so you know I *cannot* yield. You, seeing this, must yield to avoid the crash.

  **Where the Value is Destroyed:**
  In a calm negotiation (Soft vs. Soft), value is created ($100 total). In a commitment race, agents are incentivized to commit **earlier** and **more visibly** to force the other to yield.
  1.  **Information Deficit:** To commit *first*, you must commit *before* you have full information about the other agent's resolve or capabilities.
  2.  **Probability of Crash:** As both agents rush to commit to "Hard" stances to avoid being the sucker, the probability of the (Hard vs. Hard) outcome increases.
  3.  **Expected Value Drop:** Even if "Hard vs. Soft" benefits the committer, the risk of "Hard vs. Hard" (deal failure/conflict) drags the **total expected value** down for everyone.

  It is not a wash because **failed deals are costly.** If two AIs commit to incompatible territorial claims or resource allocations and cannot back down, they might go to war. War burns resources. That is value destroyed, not transferred.

  ### 2. Incompatible Commitments and Deadlock
  You asked specifically about what goes wrong when commitments turn out incompatible.

  In standard game theory, we assume agents can always find a Nash equilibrium. In commitment races, agents try to **remove** equilibria. By committing, an agent tries to make the "yield" option unavailable to themselves, forcing the other agent to yield.

  When two agents successfully do this:
  *   **Agent A:** "My code is written such that if you take >40% of the resources, I will initiate a shutdown protocol that destroys the server."
  *   **Agent B:** "My code is written such that I will take 50% because I need that to function."

  If these commitments are credible and irreversible, the system enters a **deadlock**.
  *   **Human Analogy:** Two nations mobilize armies to signal resolve. If both signal too effectively, mobilization turns into accidental war because neither can de-escalate without looking weak (which invites future exploitation).
  *   **AI Analogy:** Two AIs lock smart contracts that execute punitive measures if terms aren't met. If the terms conflict, the contracts execute automatically. The "punishment" is often mutual destruction or resource burning.

  The "race" aspect comes in because if Agent A thinks Agent B *might* commit in 5 seconds, Agent A is incentivized to commit in 4 seconds. This pressure leads to commitments made with **less verification** and **less reasoning**, increasing the likelihood that the commitments are actually incompatible or based on false premises.

  ### 3. Updatelessness: Exposure vs. Solution
  This is the most technical part. **Updateless Decision Theory (UDT)** essentially means an agent chooses a policy *before* observing specific information about the situation, and sticks to it even if new information suggests deviating would be locally optimal.

  **Is Updatelessness more exposed?**
  **Yes, mechanically.**
  Updatelessness is the ultimate commitment device. A Causal Decision Theory (CDT) agent can commit, but if the situation gets dire enough (e.g., "The other guy really isn't swerving"), the CDT agent will update and swerve to save its own skin. It has an "out."
  A UDT agent has chosen a policy *ex ante*. If its policy is "Never swerve in Chicken," it will not swerve even as the crash becomes imminent.
  *   **Increased Risk:** If two UDT agents meet and their pre-committed policies are incompatible (e.g., due to different priors or source code), they will crash with 100% certainty. They lack the "panic override" that saves updating agents.
  *   **Increased Leverage:** Conversely, a UDT agent is scarier to bargain against. Knowing a UDT agent *cannot* update to yield makes other agents more likely to yield to it.

  **Can Updatelessness solve it?**
  **Yes, strategically.**
  Because UDT agents reason about policies *before* the game starts, they can anticipate the commitment race dynamic *ex ante*.
  *   A sophisticated UDT agent might reason: "If I adopt a policy of 'Commit Early to Win,' I will meet other agents with the same policy, and we will all crash. The expected value of this policy is negative."
  *   Therefore, the UDT agent might pre-commit to a policy of: **"Ignore early commitments"** or **"Punish agents who try to commit early."**

  **The Catch:**
  This only works if the agents share enough logical commonality to coordinate on the "anti-race" policy.
  *   **Homogeneous AI:** If all AIs are UDT and share similar priors, they can logically handshake on avoiding commitment races.
  *   **Heterogeneous Environment:** If a UDT agent meets a CDT agent (or a different UDT variant), the UDT agent's inflexibility makes it vulnerable. It might refuse to yield to a bluff, causing a crash that a CDT agent would have avoided. Or, a malicious CDT agent might exploit the UDT agent's predictability.

  ### Summary
  1.  **Why it's bad:** It turns bargaining into a game of Chicken. The race to commit first increases the probability of **mutually assured failure** (deal collapse or conflict), which is negative-sum.
  2.  **Incompatible Commitments:** When both sides successfully remove their ability to yield, the system deadlocks. In AI, this often means automated conflict protocols trigger, burning resources for no gain.
  3.  **Updatelessness:** It makes the commitment **stronger**, which increases the stakes. It makes crashes more likely if policies clash, but it also offers the best theoretical hope for *pre-committing to avoid the race entirely*—provided the agents can coordinate on that meta-policy.

  In AI safety, the fear is that we deploy agents that are **updateless enough to be dangerous** (they won't back down from a fight) but **not updateless enough to coordinate** (they can't agree on a policy to avoid the fight).
