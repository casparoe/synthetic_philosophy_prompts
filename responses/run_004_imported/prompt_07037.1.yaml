      *   *Epistemicism's Strength:* It bites the bullet. There is a sharp cutoff for "heap." There is also a sharp cutoff for "definitely heap." We just don't know either. The logic of "definitely" can be modeled (e.g., S4 or S5 modal logic) without ontological proliferation. The "unknowability" explains why it *seems* like there's higher-order vagueness (we can't locate the boundaries of the borderline region).

  4.  **Formulate the Verdict:**
