  **Justifications**

  *   **Move 1 (Naomi, +2):** Naomi correctly identifies the **Discursive Dilemma** (or Doctrinal Paradox). In bodies bound by explicit logical mandates (like a charter stating "Fund IFF Feasible AND Necessary"), the **Premise-Based Procedure** is theoretically preferred. It ensures the collective output remains logically consistent with the governing rules, even if no single majority supports the specific conclusion. Her interpretation faithfully prioritizes the charter's constraints over raw vote aggregation.
  *   **Move 2 (Callum, +1):** Callum accurately describes the **representation problem** inherent in premise-based voting: the outcome ("Fund") is supported by a majority of premises, but no majority of members actually supports funding. This is a valid concern for democratic legitimacy. However, in a fiduciary or judicial context, adherence to the *rules* (the charter) typically outweighs the desire for the outcome to match a holistic majority preference, making his objection theoretically sound but contextually weaker.
  *   **Move 3 (Naomi, +2):** This is the strongest practical argument. Conclusion-based voting creates an **accountability gap**. It allows members to veto proposals for arbitrary or unstated reasons while appearing to comply with the charter. Premise-based voting forces members to go on the record regarding the specific criteria, ensuring the charter acts as a genuine constraint on authority rather than a suggestion.
  *   **Move 4 (Callum, -1):** While Callum is technically correct that social choice theory proves no aggregation rule is perfect (Impossibility Theorems), his conclusion is defeatist. Dismissing structural fixes in favor of "norms" ignores that small committees are prone to social pressure and ambiguity. Relying on norms rather than voting structure to enforce a charter is poor institutional design; the procedure itself should incentivize compliance.

  **Missing Consideration**

  Both parties miss a decisive distinction regarding the **institutional role** of the committee: are they **delegates** aggregating preferences, or **trustees** applying criteria?

  Social choice theory often treats voting as a way to discover the "will of the group" (favoring Callum's conclusion-based view). However, a grant committee is not a legislature; it is a fiduciary body bound by a charter. The criteria (Feasibility, Necessity) are not merely reasons for voting; they are **conditions of authority**. The committee lacks the authority to fund unless *both* conditions are met. Therefore, the voting procedure must track the *satisfaction of conditions* (Premise-Based), not the *distribution of desires* (Conclusion-Based). Recognizing the committee as a rule-applying trustee rather than a preference-aggregating representative settles the debate in Naomi's favor.
