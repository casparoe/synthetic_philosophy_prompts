      *   *Draft 3:* The joke should be about the *consequences* of the switch.
      *   *Selected Angle:* The "Switch." She spent 20 years telling us it's okay to flip the switch. Then she spent the last 10 telling us it's not. But the real switch she flipped was at the dinner table.
      *   *Better Angle:* Focus on the *integrity* of the reversal. The joke is that she applied the Doctrine of Double Effect to her own career change. The harm to Christmas dinner was *foreseen* but not *intended*? No, that's too technical.
      *   *Best Angle:* The "Trolley" metaphor applied to her own life. She redirected the trolley of her own convictions.
