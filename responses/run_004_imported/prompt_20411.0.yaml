answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm [Your Name], a colleague and friend of [Honoree's Name]. We are here to celebrate nearly forty years of teaching, mentoring, and, if we're being honest, occasionally haunting the dreams of undergraduate philosophy majors.

  When you spend four decades in moral philosophy, specifically in the shadow of the trolley problem, you expect people to think you're a bit detached from the real world. But anyone who knows [Honoree] knows that her detachment was always a method, never a disposition. She cared deeply about getting things right.

  And that brings me to the moment that defines the second act of her career. About ten years ago, [Honoree] did something rare. She did to her own seminar what Judith Jarvis Thomson did to the field in "Turning the Trolley." She stood up, after twenty-plus years of teaching that the bystander may permissibly flip the switch, and announced that she no longer believed that was true.

  Now, I know we have a split audience tonight.

  For the former grad students in the room, you know exactly what that move cost. It wasn't just a tweak. By removing the permissibility of the switch, she didn't just change a syllabus; she removed the contrast class that makes the Footbridge case interesting. She effectively pulled the rug out from under the intuition pump the last two generations of ethicists have been riding. It was a structural collapse of a framework she had helped build.

  For her husband and her sister, however, the cost was measured in a different currency. You don't care about the collapse of the bystander intuition. You care about the collapse of the 2014 Christmas dinner.

  And this brings me to the only joke I'm going to make tonight, because it deserves to be landed carefully.

  **For the philosophers, her reversal was a rigorous correction of a deontological inconsistency. For her family, it was simply the year she proved that the Doctrine of Double Effect applies to holiday gatherings: the destruction of Christmas peace was a foreseen side effect, but since it wasn't *intended*, she felt cleared to proceed.**

  (Laughter)

  But in all seriousness, that joke contains the truth we are celebrating tonight. Whether she was arguing about hypotheticals on a railway or discussing curriculum with colleagues, [Honoree] possessed a terrifying intellectual honesty. Most of us, when we find a position that works, that gets good reviews, and that keeps the peace, we stick with it. We treat our convictions like real estate: buy low, hold long.

  [Honoree] treated her convictions like a trolley track. If the argument demanded it, she was willing to throw the switch on her own career, even if she knew the momentum would derail the room.

  To her students: She taught you that philosophy isn't about winning arguments. It's about following the argument wherever it goes, even if it leads you to a place where you have to admit you were wrong for twenty years. That is a lesson in integrity that no textbook could ever convey.

  To her family: Thank you for enduring the "unbearable" years. I know it wasn't always easy living with someone who analyzes the moral weight of a gravy boat passing. But I hope you know that the same intensity she brought to the dinner table was the same intensity she brought to mentoring you, to supporting her colleagues, and to building this department. She didn't save her passion for the abstract; she lived it concretely.

  As you move into retirement, [Honoree], I have one request. The world is full of real problems that need solving, and you have earned the right to ignore the hypothetical ones. No more switches. No more footbridges. No more calculating the utility of the dessert course.

  May your retirement be filled with situations where the right thing to do is obvious, where the consequences are all good, and where the only thing you have to flip is a page in a novel you're reading for fun.

  Please raise your glasses. To [Honoree]—who never let the trolley stop, until it was finally time to let it rest. Cheers.
