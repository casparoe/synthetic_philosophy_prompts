      *   **Occasion:** Retirement dinner for a colleague.
      *   **Honoree:** A philosophy professor (ethics/moral philosophy specialist).
      *   **Career:** Nearly 40 years teaching trolley problems and the Doctrine of Double Effect (DDE).
      *   **Key Event:** 10 years ago, she publicly reversed her stance on the Bystander Case (switch flipping), akin to Judith Jarvis Thomson's "Turning the Trolley." She taught one way for 20+ years, then switched.
      *   **Audience:** Mixed.
          *   *Group A:* Former grad students/philosophers who understand the technical significance (it undermines the intuition behind the bystander/footbridge distinction).
          *   *Group B:* Family (husband, sister) who just remember her being "unbearable" about it at Christmas.
      *   **Constraint:** 5-minute toast (approx. 600-750 words spoken at a moderate pace).
