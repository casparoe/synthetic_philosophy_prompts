      *   **Core Requirement:** Built around *one good joke* about the reversal that works for both halves of the room.

  2.  **Deconstruct the Philosophy (for accuracy):**
      *   *The Trolley Problem:* Bystander at a switch (kill 1 to save 5) vs. Footbridge (push 1 to save 5). Standard intuition: Switch is okay, Push is not.
      *   *Doctrine of Double Effect (DDE):* Intended harm vs. foreseen harm. Often used to justify the switch (death is foreseen, not intended) but not the push (death is intended).
      *   *The Honoree's Reversal:* She taught "Switch is permissible" for 20 years. Then she switched to "Switch is *not* permissible."
      *   *Significance:* If the Switch isn't permissible, the contrast with the Footbridge collapses. The whole literature relies on that contrast.
      *   *The Joke Potential:* The irony of changing one's mind about *changing* the track. The personal cost (Christmas dinners). The integrity of following the argument wherever it leads, even if it ruins holiday peace.

  3.  **Drafting - Section by Section:**

