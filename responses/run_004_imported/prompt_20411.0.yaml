      *   *The Joke:* "She spent twenty years teaching us it was permissible to flip the switch. Then she spent the next ten teaching us it wasn't. I think we can all agree: the only switch she was ever truly committed to flipping... was the one that turned off the lights at Christmas dinner." -> *A bit mean?*
      *   *Revised Joke:* "To her former students, this reversal collapsed the distinction between the bystander and the footbridge. To her husband and sister, it just collapsed the distinction between 'lively debate' and 'hostage situation.'" -> *Good, but needs to be the punchline of a setup.*

      *   *Let's go with the "Cost" joke.* The philosophers know the theoretical cost. The family knows the social cost.
      *   *Setup:* Ten years ago, she did what Thomson did. She changed her mind.
      *   *Punchline:* "For the ethicists here, that move dismantled the intuitive foundation of the bystander case. For her sister, it just dismantled the peace treaty of the 2014 Christmas dinner. But here's the thing: She was willing to pay both prices."

  5.  **Drafting the Content (incorporating the tone):**
