answer: |-
  Here are eight questions designed to progressively tighten the pressure on the "validity is all that matters" defense, moving from simple logical forms to metasemantic collapse.

  **1. The Baseline: Moral Modus Ponens**
  "Let's begin with the standard case where your hyperplan semantics seems most at home. Consider a standard moral modus ponens: 'If lying is wrong, then getting your brother to lie is wrong; lying is wrong; therefore, getting your brother to lie is wrong.' You argue that accepting the premises while rejecting the conclusion involves a clash of hyperplans. I grant that your machinery secures the *validity* of this inference. But in this simple case, does the 'plan-based' explanation offer any advantage over a truth-conditional one, or is it merely a translation of the same logical structure into different vocabulary?"

  **2. The Problem of Negation: Exhaustivity of Attitudes**
  "Moving to negation: in truth-conditional semantics, $\neg P$ is true if and only if $P$ is false; the values are exhaustive and exclusive. In your system, negating a moral claim expresses a conflicting plan. But psychological attitudes aren't obviously exhaustive in the way truth values are. I can neither accept nor reject a plan; I can be undecided. If validity relies on inconsistency, how does your semantics handle the agent who simply lacks a plan for a specific contingency without rendering them logically irrational?"

  **3. The Problem of Disjunction: Specificity of Plans**
  "This difficulty sharpens with disjunction. Consider the claim: 'Either stealing is wrong or lying is wrong.' On your view, this should express acceptance of a hyperplan. But a maximally specific plan presumably dictates what to do in every contingency. What specific plan is expressed by a disjunction? Is it a plan to avoid stealing *or* a plan to avoid lying? If the agent hasn't decided which, have they really accepted a hyperplan, or does your semantics require them to have a determinate stance that ordinary moral discourse doesn't seem to demand?"

  **4. Mixed Inferences: Epistemic Operators**
  "Let's embed a moral predicate under an epistemic operator, such as: 'It is probably wrong to lie,' or 'Ann believes that lying is wrong.' Here we aren't just combining plans; we are assessing the likelihood or attribution of a plan. If I say it is *probable* that lying is wrong, am I expressing a partial plan? Or am I describing a fact about the world? If the former, what does a 'partial hyperplan' look like? If the latter, haven't we slipped back into treating moral claims as truth-apt descriptions?"

  **5. The Sufficiency of Validity: Explanatory Depth**
  "Your stock reply to these embedding puzzles is that your machinery secures the inference's validity, and that validity is all the Frege–Geach problem ever demanded. But realists argue that validity is *explained* by truth preservation. If you secure validity without truth conditions, what *explains* the validity in your system? If the answer is simply 'the formal relations between plans,' aren't you offering a formal fix without a semantic explanation of why those plans relate that way?"

  **6. Formal Indistinguishability: Structural Isomorphism**
  "Following on that: if we map your hyperplans to possible worlds and your 'acceptance of a plan' to 'truth at a world,' the formal structure of your logic appears isomorphic to standard modal realism. The inference patterns validate the same theorems. If the mathematical structure of your expressivism is indistinguishable from a truth-conditional semantics, in what sense is your solution distinctively *expressivist* rather than just realism with a different label?"

  **7. Creeping Minimalism: The Metaphysical Collapse**
  "This brings us to the worry Dreier called 'creeping minimalism.' If your semantics validates classical logic, handles negation and disjunction, and accommodates epistemic operators, you likely have the resources to define a predicate 'is true' that applies to moral sentences whenever a hyperplan is accepted. At that point, what prevents your view from collapsing into a minimalist realism? What substantive metaethical difference remains if moral sentences behave exactly like truth-apt descriptions in every logical context?"

  **8. Falsifiability: Evidence Against the Solution**
  "Finally, I want to ask about the constraints on your theory. If any embedding puzzle can be solved by constructing a more complex combination of hyperplans, and if validity is the only criterion for success, what would actually count as evidence *against* your solution? Is there any logical phenomenon or linguistic usage that your hyperplan semantics could not accommodate, or has the theory been made flexible enough to be unfalsifiable?"
