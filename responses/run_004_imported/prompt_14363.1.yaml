answer: |-
  This is one of the most famous stalemates in twentieth-century political philosophy. You and your friend reenacted a debate that occupied Rawls and Harsanyi themselves for decades. The reason you couldn't resolve it over dinner is that while the setups look identical, they are actually modeling two fundamentally different questions.

  To give you the decisive assessment you asked for: **Rawls's derivation is more defensible.** While Harsanyi's argument is mathematically cleaner and aligns better with standard economic rationality, it relies on epistemological and metaphysical assumptions that are illegitimate within the context of choosing principles of *justice*. Harsanyi wins if the question is "How do we maximize social welfare?" but Rawls wins if the question is "What terms of social cooperation are fair?" Since justice is primarily about fairness among persons rather than the aggregation of good, Rawls's framework is the more appropriate tool.

  Here is the careful treatment of where the arguments part ways, and why Rawls's route holds up better under scrutiny.

  ### 1. The First Fork: Risk vs. Uncertainty (The Probability Dispute)

  The most technical divergence concerns probability. Your friend is right that Harsanyi treats the Veil of Ignorance as a situation of **risk**. In decision theory, "risk" means you don't know the outcome, but you *do* know the probability distribution. Harsanyi invokes the Principle of Insufficient Reason (or Indifference): since the chooser has no information about which person they will be, they must assign an equal probability ($1/N$) to occupying any specific position in society. Once you have equal probabilities, Expected Utility Maximization (EUM) mathematically entails Average Utilitarianism.

  Rawls, however, insists the Original Position is a situation of **uncertainty** (sometimes called "radical uncertainty"). Here, you do not know the outcomes *and* you have no basis for assigning probabilities.

  **Who is right?** Rawls is.
  Harsanyi's assignment of equal probabilities is arbitrary. In a gambling context, equal probabilities are justified by the mechanics of the device (a fair die has six sides). In the Original Position, there is no "device." There is no frequency data on how souls are distributed into bodies. To assign a probability of $1/N$ is to pretend we have knowledge we explicitly do not have.

  If you remove the equal probability assumption, Harsanyi's mathematical derivation collapses. You cannot calculate an expected utility without probabilities. Rawls recognizes this epistemological vacuum. He argues that because we cannot calculate probabilities regarding our social fate, it is irrational to gamble with our basic rights and liberties on the chance that we might end up in the average or above-average position. Therefore, the disagreement starts here: Harsanyi smuggles in a probabilistic assumption that the Veil was designed to exclude.

  ### 2. The Second Fork: The Decision Rule (Maximin vs. EUM)

  This leads to the decision rule. Harsanyi argues that EUM is the definition of rationality. To reject it is to be irrational. He charges that Rawls's **Maximin rule** (maximize the minimum position) is excessively risk-averse. Harsanyi famously argued that if we followed Maximin, we would never cross the street (the utility of getting to the other side is outweighed by the infinite disutility of being hit by a car, however small the probability).

  Rawls's defense is often misunderstood. He does not argue that Maximin is a universal rule of rationality. He argues it is rational only under three specific conditions:
  1.  **Ignorance of Probabilities:** (As established above).
  2.  **Conception of the Good:** The chooser cares little for what they might gain above the minimum guarantee. (i.e., Once you have sufficient primary goods, more wealth doesn't matter as much as avoiding destitution).
  3.  **Unacceptable Alternatives:** The worst-case scenarios involve a loss that is effectively irreversible or intolerable (e.g., loss of liberty, starvation, stigmatization).

  **Assessment of Harsanyi's Charge:**
  Harsanyi is correct that Maximin yields absurd prescriptions in *ordinary* life. But Rawls is correct that the choice of *constitutional essentials* is not ordinary life. It is a one-time, high-stakes choice regarding the basic structure of society. If you end up worst-off in a utilitarian society, you might be enslaved or destitute to support the greater good. That is an "unacceptable alternative" in Rawls's sense.

  Harsanyi's charge fails because it treats the choice behind the Veil as a choice about *goods* (where trading off some risk for more average wealth makes sense) rather than a choice about *status*. Rawls argues that no one should have to accept a lower status as a free and equal citizen to maximize the aggregate welfare. In this specific, high-stakes context, Maximin is not "cowardice"; it is a demand for security regarding one's moral standing.

  ### 3. The Fundamental Fork: The Nature of the Veil

  This is the deepest divergence, and the one that decides the verdict.

  **Harsanyi's Veil** is a device for **impartiality**. It is a way to force a chooser to count everyone's interests equally. By imagining you have an equal chance of being anyone, you are mathematically forced to sum up everyone's utility and divide by $N$. The "self" behind the veil is a vessel for utility. The goal is to maximize the satisfaction of preferences.

  **Rawls's Veil** is a device for **fairness**. It is a representation of free and equal moral persons. The goal is not to maximize a value, but to agree on terms of cooperation that no one could reasonably reject. The "self" behind the veil is an agent with a capacity for a conception of the good and a sense of justice.

  **Why Rawls Wins Here:**
  Harsanyi's derivation assumes that the only thing that matters is the *sum* (or average) of satisfaction. This presupposes Utilitarianism rather than deriving it. He assumes that my loss can be compensated by your gain. Rawls challenges this "separateness of persons." He argues that society is not a single super-person maximizing its utility, but a cooperative venture between distinct individuals.

  If you accept Harsanyi's premise that we are merely locations of utility, Average Utilitarianism follows. But if you accept Rawls's premise that we are distinct moral agents who cannot be sacrificed for the aggregate, Maximin follows. Since a theory of *justice* is supposed to protect individuals from being sacrificed for the greater good, Rawls's foundational premise is more aligned with the concept of justice itself. Harsanyi has effectively changed the subject from "What is just?" to "What is efficient?"

  ### The Verdict

  I find **Rawls's derivation more defensible**, for three cumulative reasons:

  1.  **Epistemological Honesty:** Harsanyi requires us to accept arbitrary probabilities ($1/N$) to make his math work. Rawls acknowledges the radical uncertainty of the human condition. It is more philosophically rigorous to admit we do not know the odds of social birth than to pretend we do.
  2.  **The Stakes of the Choice:** Harsanyi treats the choice of basic justice like a series of small economic gambles where risk-aversion is a bias. Rawls correctly identifies that the choice of basic rights is a unique, non-repeatable decision where the downside risk (oppression, destitution) is intolerable. Maximin is not irrational here; it is prudent.
  3.  **The Conception of the Person:** This is the clincher. Harsanyi's model dissolves the boundaries between persons. It allows the suffering of the worst-off to be "outweighed" by the happiness of the best-off. Rawls's model respects the distinction between persons. It asserts that justice is about the inviolability of the individual, not the maximization of the collective.

  **Conclusion:**
  Your friend is right that *if* you accept the assumptions of standard decision theory (known probabilities, utility maximization), Harsanyi wins. But Rawls's point is that standard decision theory is the wrong tool for fundamental political justice. The Veil of Ignorance is not a casino; it is a constitutional convention.

  Harsanyi's charge that Maximin is excessively risk-averse is true for crossing the street, but false for choosing the basic structure of society. In the latter case, the "absurdity" Harsanyi points to is actually a feature, not a bug: it reflects the moral intuition that some things (basic liberties, minimum welfare) should not be gambled away, regardless of the potential average gain. Rawls succeeds because he recognizes that the Veil is not just about ignorance; it is about the moral status of the people behind it. Harsanyi sees rational gamblers; Rawls sees free citizens. For a theory of justice, Rawls's vision is the one we need.
