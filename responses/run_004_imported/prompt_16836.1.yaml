  Okay so I've been going down a rabbit hole about Bayesian updating late at night, and I think I've talked myself into a genuine problem, or maybe I'm just missing something obvious (I've got zero formal background here, just read stuff online for fun). The way I understood it, your belief in a theory is only supposed to move when you condition on evidence you didn't already have — if P(E) is already 1, then P(T|E) just equals P(T), full stop. But then how does it make sense that Mercury's perihelion precession, which astronomers had already known about for decades, counted as one of the biggest pieces of confirmation for general relativity the moment Einstein showed in 1915 that GR predicted it? By then everyone's P(precession) was basically 1, so strict conditionalization says that evidence should've been dead weight going forward, but it obviously wasn't. Digging around, I found two kinds of fixes people propose: one says what you're actually learning isn't the old evidence itself but the new logical fact that the theory implies it, since nobody automatically knows every consequence of their own theory the instant they believe it, and the other says you should figure out what your credence would've counterfactually been before you ever knew the evidence, then update that instead. Could you walk through how each of those is suppose to actually work mechanically, and tell me straight whether either one really rescues Bayesianism here or if their both just clever ways of dodging the question?
