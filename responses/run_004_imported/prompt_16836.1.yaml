      *   *The Name:* This is formally known as the "Problem of Old Evidence" (posed famously by Clark Glymour in 1980).

  3.  **Analyze Solution 1: The "Logical/Learning" Approach (Garber, Jeffrey, etc.):**
      *   *Mechanism:* We aren't updating on $E$ (the evidence). We are updating on the proposition $H \vdash E$ (The hypothesis entails the evidence).
      *   *Formalism:* Let $X$ be the proposition "T implies E". Before Einstein, we knew $E$ (Mercury moves weirdly), but we didn't know $X$ (GR explains Mercury). So $P(X) < 1$. When Einstein shows the math, we learn $X$. Now we update on $X$, not $E$.
      *   *Mechanics:* $P(T | X) > P(T)$. Why? Because if $T$ is the *only* known theory that implies $E$, and $E$ is true, $T$ looks good.
      *   *Critique:* It requires expanding the language of probability to include logical relationships as uncertain propositions. It solves the math but feels like shifting the goalposts. Does "T implies E" really carry the confirmatory weight?

