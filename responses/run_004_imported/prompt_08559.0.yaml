  *(Another thought)*: The user mentioned BSSN. In BSSN, we evolve $\gamma_{ij}, K_{ij}$ etc. The lapse $\alpha$ and shift $\beta^i$ are gauge. If I change $\alpha, \beta^i$, the coordinates of the horizon change, but the physical geometry doesn't. This is exactly the gauge freedom. The Hole Argument asks: "If I drag the whole geometry over the manifold points, is it different?" In BSSN, the grid points are just labels. The Hole Argument asks if those labels *mean* something physically. I should use this analogy.

