answer: |-
  The silence of Sector 4 wasn't empty; it had a texture. Kael had been alone on the relay station for eight months, the only human within three light-years. There was no one to talk to, and eventually, there was nothing left to say in the official logs. Routine reports degraded into fragments. *Hull integrity stable. Rations nominal.*

  Then came the sensation.

  It happened during the shift change, when the artificial gravity hummed at a specific frequency. It wasn't pain. It was a pressure behind the eyes, a kind of metallic taste in the back of the throat, accompanied by a fleeting sense of vertigo that felt like falling upward. There was no word for it. "Static" was too vague. "Nausea" was incorrect.

  Kael opened a fresh notebook. On the first page, he drew a small, tight spiral. *This,* he thought, pressing the pen hard into the paper, *is for the upward falling.*

  For weeks, the system worked beautifully. When the hum hit and the pressure bloomed behind his eyes, he opened the notebook and drew the spiral. Sometimes he added a date, sometimes a tally mark. It felt like mastery. He had carved out a piece of his internal world and given it a boundary. He was naming the unnameable, creating a language of one.

  The doubt started subtly, around month ten.

  Kael felt the sensation arise during a routine diagnostic. He reached for the notebook, pen poised. But he paused. He looked at the spirals on the previous page. There were dozens of them. They looked identical—black ink loops on white paper. But what did they *mean*?

  He tried to recall the sensation from three days ago, the one attached to the spiral on line fourteen. He remembered feeling the pressure, yes. But was it this specific pressure? Or was it the duller ache he'd felt last week, the one he hadn't marked?

  He frowned, flipping back to the first page. The original spiral. The ostensive definition. He stared at the ink. It was just a shape. The meaning wasn't in the paper; it was in the connection between the shape and the feeling. But that connection existed only in his memory.

  He closed his eyes and tried to summon the feeling of Day One. He remembered the vertigo. He remembered the decision to draw the spiral. But memory is fluid. How could he verify that the feeling he was having now was the *same* as the feeling on Day One? He had no ruler for this. He couldn't hold the current sensation next to the past one to compare them. He only had his memory of the past sensation to check against his memory of the current one.

  If he decided they matched, they matched. If he decided they differed, they differed. There was no outside check. No colleague to ask, "Is this what you meant by the spiral?"

  Kael looked at the pen in his hand. If he drew the spiral now, was he using the word correctly?

  The question paralyzed him. In a public language, if he used "red" to describe a blue sky, someone could correct him. The community held the standard of correctness. Here, the standard was supposed to be his own memory. But memory cannot validate itself. If he remembered the definition wrong, he would never know. He could shift the meaning of the spiral by a degree every day, and the notebook would never contradict him. The spiral could come to mean "hunger" or "loneliness" or nothing at all, and he would be none the wiser.

  The sensation peaked, the metallic taste sharp on his tongue. It demanded a label. It demanded to be cataloged.

  Kael looked at the open page. The spirals stared back, empty vessels. They offered no resistance. They couldn't tell him he was wrong. Whatever seemed right to him *was* right, and that meant "right" had ceased to mean anything.

  He hovered the pen over the paper. To draw the spiral was to pretend there was a rule he was following. But the rule existed only in the moment of drawing, and vanished the moment the ink dried. He realized he wasn't recording a sensation anymore; he was improvising a history.

  The pressure behind his eyes faded. The moment passed.

  Kael capped the pen. He closed the notebook and placed it in the drawer with the official logs. He sat back in the chair, listening to the hum of the station. The sensation was still there, somewhere in the nervous system, real and undeniable. But it was nameless again. Not because he lacked a word, but because he understood that a word kept in a locked room, checked only by the person who locked it, was no word at all.

  He stared at the drawer handle. He knew that if he opened the notebook tomorrow, he wouldn't be able to read it. Not because the handwriting had changed, but because the key had dissolved.
