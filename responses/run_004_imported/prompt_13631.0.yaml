  So for my history EE on the decision to drop the atomic bomb, I found this whole side story about the philosopher Elizabeth Anscombe trying to stop Oxford from giving Truman an honorary degree back in 1956 (she even wrote a pamphlet called "Mr. Truman's Degree" about it and called him a murderer). Since she went that hard on a wartime president, im planning to describe her in my essay as basically a pacifist philosopher who thought Truman was a murderer bc killing in war is always wrong. Is that a fair way to sum up her actual position, or am I missing something? If you could also break down the real philosophical argument she made against the bombing specifically that'd help alot, my teacher wants more than just "war bad" for full marks.
