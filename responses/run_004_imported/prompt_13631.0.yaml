answer: |-
  This is a fantastic angle for an Extended Essay, but **you need to correct one major misconception immediately.** If you describe Elizabeth Anscombe as a pacifist in your EE, you will lose marks on accuracy and understanding.

  Here is the breakdown of why that distinction matters, what her actual argument was, and how to use it to hit those higher mark bands.

  ### 1. The Correction: Anscombe Was NOT a Pacifist
  **Do not write that she believed "killing in war is always wrong."**

  *   **Her Actual Position:** Anscombe was a proponent of **Just War Theory** (specifically within the Catholic natural law tradition). She believed that war *could* be morally justified and that killing enemy combatants *could* be permissible.
  *   **Why this matters:** If she were a pacifist, her protest would be easy to dismiss as "idealistic" or "unrealistic." Because she was *not* a pacifist, her argument is much more dangerous to the Truman administration's logic. She is arguing from within the framework of accepted warfare, saying the atomic bomb crossed a specific moral line that conventional warfare sometimes respects.
  *   **Better Description:** Describe her as a **moral absolutist** and a **Just War theorist** who argued that certain actions (like targeting civilians) are intrinsically evil, regardless of the outcome.

  ### 2. Her Specific Philosophical Argument (The "Meat" for your Essay)
  Your teacher is right; you need more than "war bad." Anscombe's argument is deontological (based on rules/duty), whereas Truman's justification was utilitarian (based on consequences/outcomes).

  Here are the three pillars of her argument found in her pamphlet *"Mr. Truman's Degree"* and her later essay *"War and Murder"*:

  #### A. The Immunity of Non-Combatants (*Jus in Bello*)
  Anscombe argued that there is a fundamental moral distinction between a soldier and a civilian.
  *   **The Argument:** In a just war, you may kill those who are actively engaged in harming you (combatants). You may **never** intentionally kill those who are not (civilians/non-combatants).
  *   **Application to the Bomb:** Hiroshima and Nagasaki were city targets. The destruction of the civilian population was not "collateral damage"; it was the *method* of forcing surrender. By targeting the civilians to break the enemy's will, the US violated the immunity of the innocent.

  #### B. Intentionality and the "Means to an End"
  This is the most sophisticated part of her philosophy (influenced by her work on intention).
  *   **The Argument:** It matters *why* you kill. If you bomb a military factory and civilians die as an unintended side effect, that is tragic but potentially permissible (Doctrine of Double Effect). However, if you bomb a city *because* you want to terrorize the civilians into surrendering, you are using their death as a **means to an end**.
  *   **Application to the Bomb:** Anscombe argued Truman used the mass killing of innocents as a tool to achieve victory. For her, using innocent human beings as tools/objects is the definition of murder, even if done by a state.

  #### C. Rejection of Utilitarianism (Consequentialism)
  This is the direct clash with Truman's logic.
  *   **Truman's Logic:** "The bomb killed 100,000, but an invasion would have killed 1,000,000. Therefore, the bomb was good." (The ends justify the means).
  *   **Anscombe's Logic:** "Murder is intrinsically wrong. You cannot commit a great evil (murdering civilians) to achieve a good outcome (ending the war). If the only way to win a war is to murder civilians, you must not win the war that way."
  *   **Key Quote for your EE:** In her pamphlet, she wrote that Truman's decision was akin to saying, *"it is permissible to murder the innocent if the situation is sufficiently critical."* She rejected this entirely.

  ### 3. How to Use This in Your EE (For Full Marks)
  To get high marks in **Analysis** and **Critical Thinking**, don't just present her view as "the moral truth." Analyze it as a historical source of opposition.

  *   **Contextualize the Protest:** Note that this happened in **1956**, not 1945. This is part of the *historiography* and the *legacy* of the decision, not the decision-making process itself. Truman didn't lose sleep over Anscombe in 1945 because she wasn't a public figure yet.
  *   **Contrast with Other Critics:** Compare Anscombe to military critics (like Eisenhower or Leahy, who said the bomb wasn't militarily necessary) vs. moral critics (like Anscombe, who said it was wrong *even if* it was necessary). This shows you understand the difference between **strategic** and **ethical** critiques.
  *   **Evaluate the Limitations:** You can critique Anscombe slightly to show balance. For example: "While Anscombe's moral framework is consistent, critics argue it ignores the reality of 'Total War' which had already blurred the lines between combatant and civilian (e.g., the Blitz, Dresden) before the atomic bomb was dropped."
  *   **The "Murder" Label:** Analyze why she used the word "murder." In legal terms, wartime killing isn't murder. By using that word, she was stripping the state of its authority to legitimize the killing. It was a rhetorical device to shock the conscience of Oxford.

  ### Summary for your Essay
  **Don't write:**
  > "Anscombe was a pacifist who believed all killing in war was wrong, so she called Truman a murderer."

  **Do write:**
  > "Anscombe, a prominent Just War theorist, protested not on pacifist grounds, but on the principle of non-combatant immunity. She argued that the atomic bomb constituted the intentional targeting of civilians as a means to victory, which she defined as murder regardless of the utilitarian justification that it shortened the war. Her protest highlights the post-war ethical dichotomy between consequentialist military strategy and deontological moral absolutes."

  ### One Final Tip for the EE
  Make sure you clarify that Anscombe's argument applies to **area bombing** generally (which the Allies did to Dresden and Tokyo with conventional bombs), not just nuclear weapons. She opposed the *policy* of targeting cities, which the atomic bomb represented in its most extreme form. This shows you've done deep research into her broader philosophy, not just the Truman incident.

  Good luck! This is a sophisticated angle that will definitely set your essay apart if you get the philosophy right.
