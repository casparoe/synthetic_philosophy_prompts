      *   Point 2: The Mechanism of Harm. Habituation/Identity (Plato) vs. Passivity/Commodification (Rousseau).
      *   Point 3: The Festival. Presence vs. Representation. Does it solve Plato's worry? Yes, because it eliminates the "copy."
      *   Point 4: Consistency. Rousseau wins on coherence of the specific critique; Plato wins on systematic integration but relies on contested metaphysics. I'll lean towards Rousseau for the specific question of theater.
