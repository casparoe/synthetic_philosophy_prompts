      *   **Section 4: Internal Consistency:**
          *   *Plato:* Highly consistent *if* you accept the Theory of Forms and the Tripartite Soul. If you reject the metaphysics, the political ban seems tyrannical. The tension lies in whether poetry can ever be rehabilitated (the "ancient quarrel").
