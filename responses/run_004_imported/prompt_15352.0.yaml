answer: |-
  John Harsanyi's 1955 aggregation theorem is often touted as the closest thing moral philosophy has to a "proof" of utilitarianism. By combining von Neumann-Morgenstern (vNM) rationality axioms for individuals and society with a Pareto condition, Harsanyi demonstrated that social welfare must be a weighted linear sum of individual utilities. To many, this suggests that utilitarianism is not merely one moral intuition among many, but a requirement of rational consistency. However, this allure rests on the assumption that the axioms are neutral constraints on rationality rather than substantive moral claims in disguise. While Amartya Sen's measurement objection highlights a technical incompleteness in the theorem, it is Peter Diamond's fairness objection that strikes the normative core. Ultimately, Harsanyi's theorem does not give us good independent reason to accept utilitarianism. Instead, it demonstrates that utilitarianism is the exclusive price of admission for applying standard decision-theoretic rationality to the social sphere—a premise that is itself morally contestable.

  To understand the stakes, one must grasp the theorem's mechanics. Harsanyi posits that individuals have vNM utility functions representing their preferences over lotteries. He further posits that "society" (or an impartial observer) also has a vNM utility function representing social preferences. Finally, he imposes the Pareto principle: if every individual prefers lottery $L_1$ to $L_2$, society must too. Under these conditions, Harsanyi proves that the social welfare function $W$ must take the form $W = \sum a_i u_i + b$, where $u_i$ are individual utilities and $a_i$ are non-negative weights. This looks like a derivation of weighted utilitarianism from pure rationality.

  The first major challenge, articulated by Sen, concerns the measurement of utility. vNM utility functions are unique only up to positive affine transformations ($u' = \alpha u + \beta$). Because each individual's utility scale has an arbitrary zero and unit, the weights $a_i$ in Harsanyi's sum are indeterminate without a method to compare scales interpersonally. If I double the scale of Person A's utility, I must halve their weight $a_i$ to keep the social ordering constant. The aggregation theorem alone cannot pin down the weights; it merely establishes the *form* of the aggregation.

  Harsanyi has a reply to Sen, though it requires stepping outside the aggregation theorem itself. He invokes the "veil of ignorance": if an observer has an equiprobable chance of being any member of society, rationality dictates they maximize average utility, effectively setting all weights to equal. While this patches the hole Sen identified, it concedes that the aggregation theorem is not a self-contained proof. It requires a supplementary normative premise (the veil) to move from weighted utilitarianism to classical utilitarianism. However, this is not fatal. One could argue that the theorem still successfully establishes the *utilitarian structure* (maximizing a sum), even if the weights require further justification. Sen's objection is a technical gap, not a structural collapse.

  The second objection, raised by Diamond, is far more damaging because it attacks the structure itself. Diamond asks us to consider an indivisible good that only one of two people can enjoy. Suppose Person A and Person B both value the good equally.
  1.  **Give to A:** A gets utility 1, B gets 0.
  2.  **Give to B:** A gets utility 0, B gets 1.
  3.  **Flip a Coin:** A gets 0.5 expected utility, B gets 0.5 expected utility.

  According to Harsanyi's theorem, society must be indifferent between giving the good to A outright and flipping a coin. In both cases, the sum of expected utilities is identical (1.0). Yet, intuitively, many people prefer the coin flip. The coin flip offers ex-ante fairness (equal opportunity), whereas giving it to A outright is arbitrary favoritism. If we prefer the coin flip, we violate the vNM Independence Axiom at the social level. We are saying that the *process* of distribution has value independent of the *outcomes*.

  Harsanyi's response is to bite the bullet: he argues that if vNM rationality is the gold standard, then the preference for the coin flip is irrational. He contends that fairness is only instrumentally valuable insofar as it affects utility. But this response reveals the theorem's circularity. The theorem claims to derive utilitarianism from neutral rationality axioms. However, the axiom of Social vNM Rationality is not neutral; it is a substantive moral claim that only expected outcomes matter. By stipulating that society must satisfy the Independence Axiom, Harsanyi has effectively built consequentialism into the premises. To demand that social preferences satisfy vNM axioms is to demand that social preferences ignore procedural values like fairness, rights, or equality of opportunity unless they can be reduced to utility units.

  This is where the verdict must land. The aggregation theorem is mathematically valid, but it fails as a normative justification for utilitarianism because it begs the question. It tells us: "If you believe social choices should obey the same rationality constraints as individual gambling choices, then you must be a utilitarian." But the crucial philosophical dispute is precisely whether social choices *should* obey those constraints. Diamond shows that reasonable moral agents might reject Social vNM rationality to preserve values like fairness. Sen shows that even if we accept the form, the theorem lacks the resources to define the weights without importing external moral assumptions.

  Therefore, Harsanyi's theorem does not provide independent reason to accept utilitarianism. It serves better as a clarification of commitments: it reveals that accepting utilitarianism is equivalent to accepting that social rationality mirrors individual risk-rationality and that interpersonal comparisons can be resolved. Since both of those premises are contentious moral claims rather than self-evident rational truths, the theorem cannot carry the argumentative burden Harsanyi's proponents assign it. It does not prove utilitarianism; it merely formalizes it. We should reject the view that the theorem compels us toward utilitarianism, recognizing instead that it forces a choice between utilitarian aggregation and non-utilitarian values like procedural fairness, with no rational mandate forcing us to choose the former.
