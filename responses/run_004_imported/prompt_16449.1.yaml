  *(Refining Move 4)*: Beth's argument about "forced" vs "dawdling" is weak if the rule is "no exceptions." I need to point out that Beth is implicitly arguing for a *tiered* system of rules, which undermines her defense of the rule's rigidity in Move 2.

  *(Refining Move 6)*: Beth's "someone had to say it" is the strongest pragmatic point. Ravi's "no business" is the strongest ethical point. I need to highlight this clash.

