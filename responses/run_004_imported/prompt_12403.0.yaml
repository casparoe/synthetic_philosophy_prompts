answer: |-
  The debate between you and your friend touches upon a perennial tension in the history of economic thought: the distinction between a thinker who accidentally stumbles upon a modern concept and one who intentionally constructs a theoretical framework that anticipates it. In the case of George Berkeley's *The Querist* (1735–1737), the textual evidence supports a nuanced verdict. While your friend is correct that Berkeley articulates a strikingly nominalist ontology of money that breaks from the metallist orthodoxy of his day, your skepticism is historically more defensible. To classify Berkeley as a forerunner of Chartalism or Modern Monetary Theory (MMT) is to commit a category error regarding the *function* of the state in his thought. Berkeley is best read not as a proto-Chartalist, but as a **moral institutionalist** whose view of money is subordinate to a teleological project of colonial revitalization, rather than a macroeconomic theory of sovereign fiscal capacity.

  To grant your friend their due, the textual surface of *The Querist* does indeed shimmer with phrases that sound remarkably modern to a post-Keynesian ear. Berkeley repeatedly strips money of intrinsic value. In Query 51, he asks, "Whether money be not a sort of ticket or counter?" and in Query 43, he queries whether "the denomination of money be not a ticket or counter?" He explicitly rejects the idea that gold and silver constitute wealth in themselves, arguing instead that wealth consists in the capacity to command labor and commodities. Query 34 asks, "Whether money be not only useful to industry, but also a reward for it?" Here, Berkeley aligns with the Chartalist insight that money is a social relation, a token of account, rather than a commodity discovered in the earth. If one isolates these queries, Berkeley appears to be arguing that value is imposed by convention and authority, which is the bedrock of Knapp's state theory of money.

  However, isolating these queries ignores the engine that drives *The Querist*. Berkeley's nominalism is not a macroeconomic discovery; it is a moral necessity derived from his specific diagnosis of Ireland's colonial malaise. The user's contention—that Berkeley's concerns were narrower and moralized—is the stronger historical reading. Berkeley was writing against the backdrop of an Ireland strangled by English trade restrictions, drained of specie by absentee landlords, and plagued by what he perceived as a lethargic population. His proposal for a national bank (Query 126 and surrounding) was not designed to manage aggregate demand or facilitate sovereign deficit spending in the MMT sense. It was designed to solve a coordination problem: how to circulate credit among an "idle" people who lacked the specie to transact.

  For Berkeley, money is a "ticket" not because the state declares it so through tax liability (the core Chartalist mechanism), but because it serves as a spur to "industry." The value of the ticket depends on its ability to motivate the passions of the populace toward labor. Query 10 asks, "Whether the getting of money be not the chief end of industry?" and Query 11 follows with, "Whether industry be not the true source of wealth?" The causal arrow in *The Querist* runs from moral exertion to economic value, mediated by money. In MMT, the state creates money to mobilize resources; in Berkeley, the state (or a national bank) creates money to *create* the moral habit of industry. This is a crucial distinction. Berkeley is not theorizing the fiscal capacity of a sovereign issuer; he is prescribing a psychological and social tonic for a depressed colony.

  This brings us to the missing link in your friend's argument: taxation. The central pillar of Chartalism and MMT is the "taxes drive money" hypothesis—that currency derives its value because the state demands it for tax settlement, thereby creating a demand for the state's liability. *The Querist* is remarkably silent on taxation as the anchor of monetary value. Berkeley's focus is on *circulation* and *credit*, not fiscal sovereignty. He worries about the "drain" of wealth to England, not the internal settlement of public debts. His national bank is envisioned more as a engine of public works and credit expansion than as a treasury arm managing a fiat currency regime. To project the tax-drive mechanism onto Berkeley is to import a feature of the modern nation-state that simply did not exist in the same form in 18th-century colonial Ireland.

  Furthermore, while you requested only a brief engagement with his metaphysics, it is worth noting that Berkeley's monetary nominalism is indeed continuous with his immaterialism (*esse est percipi*), but this continuity reinforces your position rather than your friend's. For Berkeley, ideas (and money) are signs that point to realities but are not the realities themselves. Just as the physical world is a language spoken by God, money is a language spoken by the state or community to coordinate industry. However, recognizing money as a "sign" does not automatically entail a theory of sovereign issuance. It entails a theory of *communication*. Berkeley views the economy as a semiotic system where money signals value, but the "truth" of that signal depends on the underlying reality of industry and production. If the industry vanishes, the ticket becomes a lie. This is distinct from the MMT view where the state's power to tax sustains the currency's value regardless of immediate production constraints.

  So, where does the verdict lie? Your friend is right that Berkeley is a **monetary nominalist** who anticipated the rejection of bullionism. He understood that money is a social artifact, a "ticket," and that a paper currency backed by land or credit could function where specie was absent. In this specific ontological sense, he is a forerunner of non-commodity money theories.

  However, you are right that labeling him a **Chartalist or MMT forerunner** is an anachronistic projection. Chartalism is a theory of *state power* and *fiscal operations*; Berkeley's *Querist* is a theory of *moral economy* and *colonial development*. For your friend's reading to be the more defensible one, *The Querist* would need to demonstrate an understanding of money as a public monopoly anchored by tax obligations, used to manage employment levels through deficit spending. Berkeley does not do this. He proposes a bank to unlock idle hands, not a treasury to manage a sovereign balance sheet.

  Therefore, the more rigorous interpretation is yours. Berkeley's "ticket-or-counter" view is a means to a moral end, not an end in itself. He anticipates the *form* of modern fiat money (paper, conventional, non-intrinsic) but not the *function* of the modern sovereign monetary system (tax-driven, fiscally integrated). To claim him for MMT is to claim a philosopher who wanted to make Irish peasants work harder for a theory that wants to ensure the federal government can fund a job guarantee. They share a skepticism of gold, but they do not share a theory of the state. Berkeley remains a fascinating figure in the history of monetary thought, but he is a proto-institutionalist concerned with the sociology of credit, not a proto-Chartalist concerned with the sovereignty of currency.
