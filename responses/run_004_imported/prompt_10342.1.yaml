answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being Marco's best man.

  Now, if you know Marco, you know he views life through a very specific lens. For twelve years, he's been a semi-pro poker player, which means he is the only person I know who has applied the Kelly Criterion to our group's Secret Santa budget. True story. He calculated the optimal gift spend to maximize holiday utility without risking social bankruptcy.

  So, naturally, when I started writing this toast, I wanted to talk about Kelly. For the non-nerds in the room: The Kelly Criterion is a formula for bet sizing. It tells you that even if you have the advantage, even if the odds are in your favor, you should never bet your entire stack. Because if you bet too big, variance will wipe you out before your edge has time to compound.

  However, last night, I got into a debate with Divya, who is a groomsman and an options trader. She stopped me cold. She said, "You can't use Kelly for marriage. Kelly is for repeated trials. Marriage is a one-time commitment. You don't get to average out your results across a thousand parallel universes. You live this once. So just make the 'he's finally going all in' joke and sit down."

  And she's right. Technically. In finance, expected value is expected value. But here's where Divya's trader brain misses the romance.

  She says marriage isn't a repeated game. I say life is. Marriage is just the table you're sitting at.

  The deep truth behind Marco's obsession with Kelly isn't about math; it's about survival. It's the understanding that the "average outcome" across a million parallel worlds doesn't matter to the one person living through time. If you go broke in ninety-nine worlds but win big in one, the average looks great. But *you* are still broke in the only world you inhabit.

  And that, to me, is the perfect metaphor for this commitment.

  Marco, you have found a partner where the "edge" is undeniable. The expected value of your happiness is through the roof. But the lesson of Kelly—and the lesson of a great marriage—is that having the edge isn't enough. You have to manage your risk.

  There will be downswings. There will be bad beats. And in those moments, you will be tempted to shove your entire emotional stack into the pot. You'll want to win the argument, be right, or force a result. But Kelly teaches us that to maximize long-term growth, you have to avoid the risk of ruin.

  In marriage, "ruin" isn't losing money. It's losing respect. It's losing kindness. It's forgetting that you're on the same side of the table.

  So, Marco, my advice isn't to "go all in." All-in is for a single hand. This is for the tournament. My advice is to use fractional Kelly. Bet big on love, but leave yourself room to grow. Protect your downside so you can stay in the game long enough to let the compounding work. Because the real win isn't the big payout on day one; it's the steady growth over fifty years.

  [Partner's Name], thank you for giving Marco a positive expected value in life. We all know he's the lucky one here.

  So, if everyone could raise a glass.

  To Marco and [Partner's Name]. May you never risk ruin. May you size your bets with humility. And may your long-run growth rate be infinite.

  Cheers!
