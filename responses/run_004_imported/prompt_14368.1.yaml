  A novice monk approaches St. Augustine with a moral dilemma. 

  "Father," the novice asks, "if a murderer comes looking for my brother, may I tell him he is in the barn?"

  Augustine shakes his head firmly. "No. To speak a falsehood with the intent to deceive is a lie, and a lie is always a sin."

  "But Father," the novice presses, "you wrote that jokes are not lies! Because when we jest, we do not intend to deceive."

  "Precisely," Augustine says. "A jest is a falsehood without the will to mislead."

  "So," the novice says, eyes lighting up, "I can tell the murderer, 'He's in the barn!' but I say it as a joke?"

  "You may," Augustine replies, "provided you do not intend for him to believe you."

  "But if I don't intend for him to believe me, he won't look in the barn. He'll find my brother."

  "Then your brother dies in the flesh, but your soul remains clean."

  The novice pauses, doing the math. "So, if I succeed in saving my brother, it means I intended to deceive him... which means I sinned?"

  "Correct."

  "And if I succeed in avoiding sin, it means he didn't believe me... which means my brother dies?"

  "Indeed."

  The novice sighs. "So the only way to use the loophole is to make sure it doesn't work?"

  Augustine nods serenely. "A joke saves the speaker, even if it costs the listener."
