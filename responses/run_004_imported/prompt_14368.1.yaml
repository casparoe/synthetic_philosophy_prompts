      *   Idea: Someone asks Augustine to lie to save them. Augustine refuses. Then he says something false but labels it a joke.
      *   Refinement: The distinction is about *intent to deceive*. If I say "X is here" knowing X is not here, intending you to believe it, that's a lie. If I say "X is here" knowing you know I'm joking, that's not a lie.
