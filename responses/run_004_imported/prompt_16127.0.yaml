prompt: |-
  Quick bit of context: I'm a backend/ML engineer at a small consumer-lending startup, and because I built the underwriting model I somehow got pulled onto our "Responsible AI Council" -- a very extra name for six people arguing over Zoom every other Thursday. The model outputs a probability-of-default number for every applicant, which drives pricing and approval decisions. The current version buckets applicants pretty coarsely (state, broad age band, credit tier), but our data science lead wants to ship a v2 that slices much finer -- zip code, income band, five-year age bracket, plus behavioral stuff like which of our other products someone has used. It backtests noticeably better, tighter calibration curves across the board, so on pure metrics it's an easy yes. Legal and the outside ethics consultant we bring in for these meetings are blocking it, and it's become a real fight.

  Here's the bit I'm stuck on: everyone keeps collapsing two different objections into one. Objection one is the familiar "this reconstructs race and neighborhood history through the back door" fair-lending worry, which I get fine. Objection two, which the consultant keeps trying to explain, is wierder: even if the finer slicing were completely clean of any protected-class proxy, there's apparently no principled reason that particular grouping is the "correct" one for pricing any given applicant -- you could equally well bucket the same guy by profession, or by his specific repayment history with us, or a dozen other reasonable partitions, and each hands back a different number for the same human being. We actually ran one test applicant through both versions: v1 priced him at roughly 4% probability of default, the new zip/income/behavior slicing put him at almost 8%, and when a teammate rebucketed him by profession and tenure instead he came out under 2%. Nobody on the data science side can answer "why this reference class and not another" with anything better than "it backtests well," and the consultant sent around a philosophy paper (something by a guy named Hájek, "The Reference Class Problem is Your Problem Too") that I read half of on the train and did not fully recover from.

  I have to send the council a short written recommendation before Thursday: basically whether v2 ships as-is, gets blocked, or ships with specific conditions, plus a timeframe, since launch is currently penciled in for three weeks out. Could you draft that memo for me? I need it to actually engage with objection two as its own real problem instead of folding it back into the bias conversation and calling it a day, and whatever it recommends, I want it to lay out the strongest version of the case for the option it's turning down, since half the room will read this looking for ammunition against whatever I land on. A short table of conditions at the end would be great if we go that route, but the reasoning that gets us there matters more than the formatting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **Role:** Backend/ML Engineer at a small consumer-lending startup.
      *   **Task:** Draft a memo for the "Responsible AI Council" regarding the launch of Underwriting Model v2.
      *   **Conflict:** Data Science (DS) wants to launch v2 (better metrics, finer granularity). Legal/Ethics Consultant are blocking it.
      *   **Core Issue:** Two distinct objections are being conflated.
          1.  *Fair Lending/Proxy Discrimination:* Finer slicing (zip code, etc.) might proxy for protected classes (race, etc.). This is standard.
          2.  *The Reference Class Problem:* Even if "clean," why is *this* specific grouping the "true" probability? Different valid groupings yield wildly different probabilities (4% vs. 8% vs. 2%) for the *same* individual. "It backtests well" isn't a sufficient philosophical/ethical justification for individual pricing.
      *   **Requirement:** The memo must engage with Objection 2 seriously (not just fold it into bias). It must present the strongest case for the rejected option (steel-manning). It needs a recommendation (Ship, Block, or Conditional) with a timeframe. A table of conditions is requested if conditional.
      *   **Tone:** Professional, technical but accessible, balanced, decisive but nuanced. Needs to sound like it comes from an engineer who understands the math but respects the ethics.

  2.  **Deconstruct the Reference Class Problem (Objection 2):**
      *   *What is it?* Probability is always conditional on a reference class. An individual belongs to infinite classes. Which one determines their "true" risk?
      *   *Why does it matter here?* If we charge someone based on Class A (8% risk) but they are actually better described by Class B (2% risk), are we overcharging them? Is it fair to pick the class that benefits the lender (backtesting performance) rather than the one that is most "causal" or "stable"?
      *   *The DS Argument:* Predictive accuracy minimizes overall error. If the model predicts default better on holdout data using these features, it's "true" in a pragmatic sense.
      *   *The Ethics Argument:* Predictive accuracy doesn't equal individual fairness. If the grouping is arbitrary relative to the *individual's* agency or causal responsibility, the price feels unjust, even if statistically robust.

  3.  **Determine the Recommendation:**
      *   *Option A: Ship as-is.* Too risky. Ignores valid ethical/legal concerns. Likely to get blocked by Legal anyway.
      *   *Option B: Block entirely.* Stifles innovation, ignores the genuine performance gains (better calibration means fewer false positives/negatives overall).
      *   *Option C: Conditional Ship (The Middle Path).* Acknowledge the Reference Class Problem isn't solvable mathematically, but manage the *impact* of it.
      *   *Decision:* Conditional Ship. It allows the business to move forward but imposes guardrails that address the arbitrariness concern. It shows the engineer is solving the problem, not just picking a side.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** State the recommendation clearly (Conditional Approval).
      *   **Context:** Briefly recap v1 vs. v2.
      *   **Addressing Objection 1 (Fair Lending):** Acknowledge it, but note it's being handled via standard compliance (disparate impact testing). Keep this brief as the prompt asks to focus on Objection 2.
      *   **Addressing Objection 2 (Reference Class Problem):** This is the meat.
          *   Define it clearly (the "4% vs. 8% vs. 2%" example).
          *   Steel-man the DS side: Why do they want this? (Calibration, loss reduction).
          *   Steel-man the Ethics side: Why is this scary? (Arbitrariness, lack of causal grounding).
          *   Synthesis: We can't solve the哲学 (philosophy), but we can mitigate the *instability* and *opacity*.
      *   **Recommendation/Path Forward:**
          *   Don't ship in 3 weeks. Delay for mitigation.
          *   Implement specific conditions (Stability testing, Explainability, Human Review thresholds).
      *   **Conditions Table:** As requested.
      *   **Timeline:** Realistic adjustment (3 weeks -> 8-10 weeks).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the explanation of Hájek/Reference Class too academic?
      *   *Fix:* Keep it grounded in the "Test Applicant" example provided in the prompt. That's the strongest evidence.
      *   *Critique:* Am I favoring DS too much?
      *   *Fix:* Ensure the "Strongest Case for Blocking" is robust. The argument isn't just "it's hard," it's "individual fairness is compromised."
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Make the conditions specific engineering tasks (e.g., "Counterfactual Stability Testing").

  6.  **Final Polish:**
      *   Check tone: Needs to be authoritative but collaborative.
      *   Check constraints: Did I address Objection 2 distinctly? Yes. Did I steel-man the opposing view? Yes. Is there a table? Yes.
      *   *Key Insight:* The solution to the Reference Class Problem in practice isn't finding the "true" class (impossible), it's ensuring the *choice* of class is stable, explainable, and bounded in its variance.

  7.  **Final Review against Prompt:**
      *   "Engage with objection two as its own real problem": Yes, dedicated section.
      *   "Lay out the strongest version of the case for the option it's turning down": Yes, will ensure the "Case for Blocking" is strong even if recommending Conditional Ship.
      *   "Short table of conditions": Yes.
      *   "Timeframe": Yes.

  *(Self-Correction on Recommendation)*: Actually, looking at the risk profile of a *lending* startup, shipping a model where individual pricing varies wildly based on arbitrary binning is a regulatory nightmare waiting to happen, even if disparate impact is cleared. A "Conditional Ship" might be too optimistic if the Reference Class variance is *that* high (2% vs 8% is a 4x difference). However, blocking entirely kills the startup's edge. The best engineering compromise is to ship *but* constrain the granularity or require ensemble averaging to smooth out the "arbitrary bin" noise. Let's recommend a **Conditional Approval with a "Granularity Cap" and Stability Testing**. This directly addresses the "why this grouping" issue by forcing the model to agree with itself across similar groupings.

  *Wait, one more thought:* The prompt says "whatever it recommends, I want it to lay out the strongest version of the case for the option it's turning down." If I recommend Conditional Ship, I need to make the Case for Blocking (the Ethics/Legal stance) very strong. If I recommend Blocking, I need to make the DS case strong. Given the user is an engineer wanting to ship, but acknowledges the validity of the concern, a Conditional Ship is the most "engineer" solution. I will frame the "Blocked" argument as the primary alternative that was seriously considered.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Responsible AI Council
  **FROM:** [Your Name], Backend/ML Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Underwriting Model v2 Deployment

  ### Executive Summary

  After reviewing the performance metrics for Underwriting Model v2 and evaluating the objections raised by Legal and External Ethics Counsel, I recommend **Conditional Approval**.

  We should not ship v2 on the current three-week timeline. Instead, we should delay launch by 6–8 weeks to implement specific stability guardrails. While v2 offers significant predictive improvements, the "Reference Class Problem" raised by counsel presents a genuine risk to individual fairness that cannot be solved by backtesting alone. The conditions outlined below are designed to mitigate the arbitrariness of risk segmentation without discarding the model's predictive gains.

  ### Context: The v1 vs. v2 Trade-off

  **Data Science Position (The Case for Shipping):**
  The strongest argument for v2 is utilitarian and systemic. v2 demonstrates superior calibration on holdout data. By slicing risk more finely (zip code, income, behavior), we reduce overall error rates. This means fewer good borrowers are rejected (false positives) and fewer bad loans are issued (false negatives). From a portfolio management perspective, v1 is blunt; it subsidizes high-risk borrowers within broad buckets using premiums from low-risk borrowers. v2 corrects this inefficiency. Delaying v2 means continuing to price risk inaccurately at scale, which carries its own ethical cost.

  **Legal & Ethics Position (The Case for Blocking):**
  The argument against v2 rests on two pillars. The first is standard fair-lending compliance: finer granularity (specifically zip code) increases the risk of proxy discrimination, even if protected attributes are removed. This is a solvable compliance hurdle via disparate impact testing.

  The second objection is more fundamental and is the focus of this memo. As the ethics consultant noted, probability is not an intrinsic property of an individual; it is a property of the *group* to which we assign them. As demonstrated in our A/B test, a single applicant received risk scores of 2%, 4%, and 8% depending solely on whether they were bucketed by profession, broad tier, or zip/income.

  If we cannot justify *why* the zip/income bucket is the "true" reflection of risk compared to the profession bucket—other than "it predicts better on aggregate"—we are effectively charging individuals based on an arbitrary classification choice. This undermines the concept of individual fairness. If the price of credit depends on which reference class we choose, the price is arguably unjust, regardless of whether that class correlates with protected traits.

  ### Analysis: The Reference Class Problem

  We must treat the Reference Class Problem as distinct from bias. Even a perfectly unbiased model suffers from this.

  1.  **The Arbitrariness Risk:** If we ship v2 as-is, we are asserting that the v2 segmentation is the "correct" lens for viewing risk. However, as the test applicant showed, shifting the lens changes the price by 300%. If a customer asks, "Why am I being priced on my zip code rather than my profession?" and our only answer is "Because our model loses less money that way," we expose the company to reputational and regulatory risk regarding unfair pricing practices.
  2.  **The Engineering Reality:** We cannot solve this philosophically. There is no "God's eye view" of true probability. However, we can engineer for *stability*. If a model is robust, small changes in how we define the reference class should not result in wild swings in individual pricing. The current 2% vs. 8% variance suggests v2 is overfitting to specific binning artifacts rather than capturing stable risk signals.

  ### Recommendation: Conditional Approval

  I propose we proceed with v2, but only after implementing constraints that dampen the sensitivity of the pricing to specific reference class choices. We will not ship in three weeks. We will target a launch in Q1 (8–10 weeks).

  **Rationale:**
  Blocking v2 entirely preserves the status quo but ignores the benefit of better calibration (which helps many applicants). Shipping as-is ignores the validity of the individual fairness concern. The middle path is to use v2's architecture but constrain its output to ensure that an applicant's score is not overly dependent on a single, arbitrary slicing method.

  ### Implementation Conditions

  To address the Reference Class objection, Engineering will implement the following checks before deployment:

  | Condition | Description | Success Metric |
  | :--- | :--- | :--- |
  | **Counterfactual Stability Testing** | We will simulate applicants across alternative valid reference classes (e.g., profession-based vs. geo-based). | Individual pricing variance between valid class definitions must not exceed ±15%. |
  | **Granularity Cap (Smoothing)** | Implement hierarchical smoothing (Bayesian shrinkage) so that ultra-fine buckets borrow strength from broader parent buckets. | Prevents extreme probabilities in low-sample fine-grained bins (e.g., specific zip + income combos). |
  | **Adverse Action Reason Codes** | Update explanation logic to reflect *why* a specific class was weighted, not just which features were high. | Legal approval on new reason code language regarding "risk segmentation." |
  | **Human-in-the-Loop Review** | Any applicant falling into the top 5% of pricing variance between v1 and v2 logic gets manual review. | Ensures edge cases driven by reference class artifacts are caught. |

  ### Timeline

  *   **Weeks 1–4:** Develop and run Counterfactual Stability tests. Refine smoothing algorithms.
  *   **Weeks 5–6:** Legal review of new Adverse Action reasoning and stability metrics.
  *   **Weeks 7–8:** Shadow mode deployment (v2 runs alongside v1 with no customer impact) to validate real-world stability.
  *   **Week 9:** Go/No-Go decision based on shadow data.

  ### Conclusion

  The ethics consultant is correct that "better backtesting" is not a moral justification for arbitrary classification. However, discarding predictive power because we cannot find a "perfect" reference class paralyzes the business. By forcing the model to demonstrate stability across *different* plausible reference classes, we acknowledge the philosophical problem while solving it with engineering controls. This allows us to ship a more accurate model without accepting the premise that the model's specific binning is the absolute truth.

  Please let me know if this path forward aligns with the Council's expectations so I can resource the stability testing accordingly.
