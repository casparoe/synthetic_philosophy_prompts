      *   *The Experiment:* Throw two darts independently at $[0,1]$, landing at $x$ and $y$.
      *   *The Intuition:* Since $f(x)$ is countable, it has Lebesgue measure 0. So $P(y \in f(x)) = 0$. Similarly, $P(x \in f(y)) = 0$. So with probability 1, neither is in the other's predecessor set.
      *   *The Contradiction:* By trichotomy of the well-ordering, either $y \prec x$ (so $y \in f(x)$) or $x \prec y$ (so $x \in f(y)$) (ignoring $x=y$ as measure 0).
