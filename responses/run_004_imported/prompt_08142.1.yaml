      *   *Point 2: Fubini's Theorem Failure.* Freiling's argument calculates probability by integrating over $x$ then $y$ (or vice versa). This is Fubini. Fubini fails for non-measurable sets. In models where CH holds (like $L$), this specific set is definitely not measurable.
