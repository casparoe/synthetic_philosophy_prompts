      *   **Fubini's Theorem:** The probabilistic argument relies on iterated integrals (throw one dart, then the other). This requires Fubini's Theorem. Fubini's Theorem requires the set to be measurable with respect to the product $\sigma$-algebra.
      *   **AC and Non-Measurability:** The well-ordering of $\mathbb{R}$ exists via the Axiom of Choice (AC). Sets constructed using AC (like Vitali sets) are often non-measurable. The set $A$ defined by the well-ordering is typically *not* Lebesgue measurable in the plane.
