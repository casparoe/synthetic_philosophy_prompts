answer: |-
  This is a really tough spot to be in, and it makes complete sense that you're feeling stuck between your roommate's reassurance and your sister's skepticism. You are dealing with a clash between **moral intent** (what you meant to do) and **epistemic responsibility** (how careful we should be with the truth before we share it).

  To answer your main question directly: **Yes, there is a real difference between lying and wrongly asserting something you believe to be true.** However, whether that second thing is "wrong" depends heavily on the context.

  Here is a breakdown of who is right, why your coworkers are actually upset, and how to handle the fallout.

  ### 1. The Difference Between Lying and Misinformation
  Your roommate is right about the definition of **lying**. In ethics and philosophy, a lie requires *intent to deceive*. You must know something is false and say it anyway. You clearly did not do this. You were a victim of the same misinformation as everyone else. Morally, your character regarding honesty is intact.

  Your sister is pointing to a more nuanced concept often called **epistemic negligence** or **assertion norms**. The idea is that when we state something as a hard fact ("We are moving"), we are implicitly promising the listener, *"I have verified this, and I am confident enough to stake my reputation on it."*

  If you spread information that turns out to be false, even if you believed it, you have broken a kind of social contract of reliability. This is why your sister argues you can do something "wrong" without lying. You can be *careless* with the truth without being *dishonest* about it.

  ### 2. Why Your Coworkers Are Mad (And Why It's Misplaced)
  Your coworkers aren't actually mad that you *lied*. They know you didn't. They are mad about **disrupted planning.**

  An office move is high-stakes information. It affects commutes, childcare, housing decisions, and daily routines. When people hear "we are moving," they start making mental and logistical adjustments. When that is walked back, it causes stress and annoyance.

  The reason they are cold toward you is that you were the **messenger.** In psychology, there is a phenomenon where people direct their frustration at the person delivering the news rather than the source of the news, simply because you are the one they interact with daily. The manager is distant; you are peers.

  However, their frustration is largely misplaced. Here is why your sister's argument doesn't fully hold up in *this specific context*:

  *   **Hierarchy implies authority:** In a workplace, you are generally expected to trust your manager's official communications. If a manager calls a meeting and states a departmental change as fact, it is not usually the subordinate's role to audit that information before passing it to the team.
  *   **The Chain of Command:** You were acting as a conduit. If the manager hadn't verified the info with *her* bosses, it is unfair to expect you to verify the manager's info with *your* peers.

  ### 3. So, Who Is Right?
  **Your roommate is more right about your blamelessness, but your sister is right about the principle.**

  *   **Roommate:** You did nothing ethically wrong regarding honesty. You shouldn't beat yourself up about "lying."
  *   **Sister:** She is right that in *other* contexts (like giving advice to a friend about a medical issue or financial investment), repeating something as fact without checking it can be irresponsible. But in a corporate hierarchy, trusting your manager is usually the correct move.

  The "wrongness" your sister is talking about usually applies when the stakes are high *and* the verification is easy. In this case, verification was impossible for you. You had no access to the real estate contracts or executive decisions.

  ### 4. How to Fix It
  Even though you aren't "wrong," the trust with your team has taken a hit. Trust isn't just about honesty; it's about reliability. To repair this, you need to validate their feelings without accepting blame for the manager's error.

  **Don't say:** "I'm sorry I lied" (You didn't) or "I'm sorry I was careless" (You weren't).
  **Do say:** "I know that news caused a lot of stress and planning on your end, and I hate that it turned out to be incorrect. I was passing along what I was officially told, but I understand how frustrating the whiplash is."

  **For the future:**
  Your sister's point is a good lesson for next time. Even when a manager says something is decided, you can add a tiny buffer when talking to your team. Instead of:
  *"We are moving next month."*
  Try:
  *"Management has informed us that the plan is to move next month. I'll let you know if anything changes, but start planning around that."*

  This subtly shifts the authority to "Management" rather than you, protecting you if the info changes.

  ### Summary
  You are not a liar, and you didn't do anything morally reprehensible. You trusted the chain of command, which is what employees are supposed to do. Your coworkers are venting their frustration about the situation on the nearest target (you), but that doesn't make their assessment of *your* actions accurate.

  Take the high road, acknowledge their frustration about the *situation*, but don't internalize the idea that you were unethical. You were just the messenger in a broken telephone game started by leadership.
