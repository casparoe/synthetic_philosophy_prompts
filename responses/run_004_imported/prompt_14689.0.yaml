answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the distinct privilege of serving as the doctoral advisor for both the bride and the groom. Usually, when an advisor sees two of their students get married, they worry about the power dynamics. When those two students are metaphysicians who specialize in *grounding and fundamentality*, you worry about the ontological dynamics.

  For the family and friends who didn't spend the last five years reading drafts about "strict partial orders," let me explain the stakes. In their field, "grounding" is just a fancy word for what depends on what. What rests on what?

  The groom took the orthodox view. He argued that reality is like a skyscraper. It needs a foundation. Every fact rests on a deeper fact, but eventually, you have to hit bedrock. Something fundamental that holds everything up but doesn't rest on anything else. He wanted a universe with a solid floor.

  The bride, however, spent her dissertation arguing that the floor might be an illusion. She pressed cases for mutual dependence. She argued that maybe things just hold each other up. As she famously put it after a glass of wine at a conference: "Nothing rules out turtles all the way down."

  They met at a Pacific APA reception, arguing about exactly this. And by all accounts, neither has conceded an inch since. Which brings us to today. As their former advisor, I feel compelled to treat this marriage as a test case for their theories.

  If the groom is right, this marriage must be well-founded. One of them must be the bedrock. Now, I value my life, so I will not specify which one of you is the "fundamentalia" in this relationship. But if he's right, the structure is hierarchical.

  If the bride is right, this is a case of symmetric dependence. You are the turtles. You support each other in an infinite loop of love and compromise. There is no bottom, just the mutual act of holding on.

  There is, however, a third option. Some of you know that in her second year, the bride flirted with Priority Monism—the idea that the whole universe is the only fundamental object. Her committee, myself included, talked her out of it. We said it dodged the hard questions.

  But looking at you two today, I think we were wrong. Marriage *is* a kind of Priority Monism. Two distinct entities entering into a union that becomes the fundamental thing itself. The relationship isn't grounded in you; *you* are grounded in the relationship.

  So, here is the metaphysical verdict: The groom wanted bedrock. The bride wanted turtles. But love, it turns out, is the one thing that doesn't need a ground. It is brute. It is unexplained. It is just *true*.

  So, if everyone could please rise and fill their glasses.

  To the bedrock, to the turtles, and to the union that grounds them both. To the bride and groom.
