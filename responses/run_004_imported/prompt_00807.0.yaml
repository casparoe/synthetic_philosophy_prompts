  So I'm outlining a historical novel and theres a side character loosely based on Emilie du Chatelet -- the mathematician who translated Newton and was Voltaire's longtime lover. I want to give her a monologue about happiness that's true to her actual philosophy, and since she's basically the ultimate Enlightenment rationalist, my thinking is her real view was that happiness comes from using reason to master your passions and see past your illusions, like a scientist being clear-eyed about her own emotions. Does that track with what she actually wrote on the subject? Would love some help sketching a few lines in that spirit, if so.
