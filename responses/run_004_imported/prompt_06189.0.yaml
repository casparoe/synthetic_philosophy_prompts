      *   Make sure I don't sound like I'm just summarizing Chang. I need to be *arguing against* her.
      *   *Crucial distinction:* Chang argues that vagueness implies it's *indeterminate* which relation holds. Parity implies it's *determinate* that the parity relation holds. I need to argue that the "determinacy" of parity is an illusion created by the stability of the indeterminacy.

  7.  **Final Review against Constraints:**
      *   Strongest argument for vagueness? Yes.
      *   Engage SIA? Yes.
      *   Explain SIA's work? Yes.
      *   Sophisticated response? Yes (using supervaluationism/degree theory logic).
      *   No balanced survey? Yes, take a side.

  8.  *(Self-Correction during drafting)*: I need to be careful not to conflate "epistemic uncertainty" (I don't know the value) with "ontic vagueness" (the value isn't determined). Chang attacks epistemic uncertainty hard. I must frame the vagueness view as semantic or metaphysical vagueness, not just "I don't know." The argument is that the *concept* of "better than" lacks sharp boundaries.

  9.  **Final Polish:** Check the flow. Ensure the transition from the SIA explanation to the Vagueness rebuttal is smooth. (Proceed to generate output).

  *(Post-computation check)*: Does this address the user's specific spreadsheet anecdote? I should weave that in as an illustration of the "penumbra" of value. The spreadsheet failing to resolve the choice is evidence of vagueness, not parity.

