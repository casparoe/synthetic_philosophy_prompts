answer: |-
  The position that Ruth Chang's "parity" is an unnecessary metaphysical posit, and that the phenomenon of the "hard choice" is better explained by comparative vagueness, rests on a commitment to ontological parsimony and a specific understanding of how value predicates function semantically. The core argument is that parity attempts to solve a logical problem created by an assumption of bivalence (that every comparative claim must be either true or false) which comparative vagueness rejects. By adopting a logic of vagueness, we can explain the phenomenology of your spreadsheet dilemma—specifically the failure of the small improvement—without inflating the ontology of value relations.

  Here is the rigorous case for the vagueness view, directly engaging with the Small-Improvement Argument (SIA).

  ### 1. The Target: What the Small-Improvement Argument is Supposed to Do

  To defeat parity, we must first understand exactly how the SIA is designed to block the vagueness reduction. Chang argues that "vagueness" is not a fourth relation, but a property of the *standard* relations. If "better than" is vague, then in your case, it is simply indeterminate whether the corporate job ($A$) is better than the startup ($B$).

  Chang's SIA is designed to prove that indeterminacy regarding the standard relations ($>$, $<$, $=$) is insufficient to explain hard choices. The argument runs as follows:

  1.  **Trichotomy:** For any two options $A$ and $B$, one of three relations must hold: $A > B$, $B > A$, or $A = B$. (Parity denies this, but the SIA assumes it to test the "equality" hypothesis).
  2.  **The Equality Test:** If $A$ and $B$ are *equally good*, then a small improvement to $A$ (call it $A+$) must be *better than* $B$. This is conceptual: equality implies identical value; adding value to one side breaks the tie.
  3.  **The Phenomenological Premise:** In hard choices, it is not the case that $A+$ is better than $B$. (As you noted, a bit more equity didn't make the startup clearly win).
  4.  **Conclusion:** Therefore, $A$ and $B$ are not equally good. Since we also assume neither is better than the other, the Trichotomy fails. We need a fourth relation: Parity.

  **The Anti-Vagueness Work:** Chang anticipates the vagueness objection. She argues that if the relation were merely vague, then the claim "$A+$ is better than $B$" would be *indeterminate*. However, she insists that in hard choices, it is **determinately false** that $A+$ is better than $B$. She claims parity captures a *determinate* relationship (it is definitely true that they are "on a par"), whereas vagueness leaves us with a fuzzy lack of relationship. She argues that reducing parity to vagueness fails because vagueness cannot account for the *stability* of the choice situation; if it were just vague, enough small improvements should eventually trigger a truth-value change, but parity suggests a zone where improvements simply don't register as "better."

  ### 2. The Vagueness Rebuttal: Dissolving the SIA

  The strongest argument against parity is that the SIA relies on a classical, bivalent logic that is inappropriate for evaluative concepts. A sophisticated defender of comparative vagueness (utilizing a framework like **supervaluationism** or **degree theory**) can dismantle the SIA by showing that Premise 3 is misinterpreted and that the "stability" Chang attributes to parity is actually the hallmark of the "penumbra" of a vague predicate.

  #### A. The Category Mistake of "Determinately False"
  Chang insists that in a hard choice, it is *determinately false* that $A+$ is better than $B$. This is the linchpin of her argument against vagueness. If it were vague, she claims, it would be neither true nor false.

  However, this mischaracterizes how vagueness operates in comparative contexts. Consider the predicate "taller than." If John and Bill are borderline cases (nearly identical height), it is indeterminate whether John is taller than Bill. If we add a millimeter to John ($John+$), is $John+$ determinately taller than Bill? On a supervaluationist account, no. There are multiple admissible "precisifications" of "taller than." On some precisifications, the threshold for "taller" is 1mm; on others, it is 5mm. If the height difference is 1mm, there are still admissible precisifications where $John+$ is *not* taller than Bill.

  Applied to your job offers: The predicate "better than" is vague. Your spreadsheet weights are attempts to precisify the concept, but the concept itself resists sharp boundaries. When you add a bit of equity ($A+$), you have not necessarily crossed the threshold required to make "$A+$ is better than $B$" true across *all* admissible precisifications of your values. Therefore, it remains indeterminate.

  Chang claims this indeterminacy is distinct from parity. But phenomenologically, they are identical. To the agent, "It is indeterminate whether $A+$ is better" feels exactly like "It is determinately the case that $A+$ is not better (due to parity)." The vagueness theorist argues that positing a "determinate fourth relation" to explain a feeling that is perfectly predicted by semantic indeterminacy is an ontological extravagance.

  #### B. The Sorites Parallel and the "Zone of Parity"
  Chang argues that parity explains why a *series* of small improvements doesn't immediately make the startup better. She suggests that if it were vague, we would face a Sorites Paradox where we are forced to admit $A+$ is better, or else admit that a huge improvement isn't better.

  The vagueness theorist embraces the Sorites structure but denies it necessitates parity. In a Sorites series (e.g., removing grains of sand from a heap), there is a "penumbra" where the truth value is unstable. In hard choices, the "parity zone" is simply the penumbra of the "better than" relation.

  The argument against parity here is based on **continuity of value**. If $A$ and $B$ are on a par, and we improve $A$ slightly to $A+$, Chang says $A+$ is still on a par with $B$. Eventually, after many improvements, $A+++$ becomes better than $B$.
  *   **Chang's View:** There is a sharp boundary between "Parity" and "Better Than." At some specific grain of equity, the relation snaps from Parity to Better Than.
  *   **Vagueness View:** There is no sharp boundary. The *degree* of truth of "$A$ is better than $B$" slowly rises from 0 to 1.

  The vagueness view is superior here because Chang's view reintroduces the very sharp boundaries she claims to avoid. If parity is a determinate relation, there must be a fact of the matter about when $A+$ stops being "on a par" and starts being "better." But your experience (and the nature of value) suggests there is no such sharp line. Vagueness accounts for the smooth transition; parity merely labels the smooth transition as a distinct "thing" until it suddenly stops being that "thing."

  #### C. Occam's Razor and the Nature of "Will"
  Chang argues that parity is necessary to ground **agency**. If the options are merely vague, reason runs out, and choice is arbitrary. If they are on a par, reason runs out, but the *relation* supports the exercise of will to create new reasons.

  The vagueness theorist counters that this is a distinction without a difference. If it is indeterminate whether $A$ is better than $B$, then reason *does not determine* the choice. The agent is free to choose based on non-comparative reasons (e.g., "I prefer the mission," or "I want the stability"). This is functionally identical to Chang's "will creating reasons."

  Positing a sui generis relation of "parity" to ground this agency is metaphysically costly. It requires the universe to contain a specific normative fact ("These are on a par") that is not reducible to the values of the options themselves. The vagueness view requires no new facts. It only requires that the *concepts* we use to compare values ("better," "equal") lack sharp boundaries. Since we already accept that most evaluative predicates ("tall," "rich," "beautiful") are vague, extending this to "better than" is theoretically conservative. Positing parity is theoretically inflationary.

  ### 3. Synthesizing the Counter-Argument to the SIA

  To summarize the rigorous case against Chang using your spreadsheet scenario:

  1.  **The SIA fails because it assumes Bivalence.** The SIA argues: If $A$ and $B$ are not equal, and $A+$ is not better, they must be on a par. This assumes that "Not Equal" and "Not Better" leaves only one logical remainder. But if "Better Than" is vague, "Not Better" does not imply "Worse or Equal"; it implies "Indeterminate."
  2.  **The "Small Improvement" is absorbed by the Penumbra.** You observed that adding equity ($A+$) didn't make the startup win. Chang says this proves Parity. The vagueness theorist says this proves $A+$ is still within the penumbra of the "better than" predicate. Just as adding a millimeter to a borderline-tall person doesn't make them determinately tall, adding equity to a borderline-better job doesn't make it determinately better.
  3.  **Parity is an Reified Illusion.** Chang reifies the *state of indecision* into a *relation of parity*. She treats the epistemic/semantic limitation of the agent (inability to compare due to vagueness) as an ontological feature of the options (they possess the property of being "on a par"). The vagueness view correctly identifies the locus of the "hardness": it lies in the imprecision of our value concepts, not in a mysterious fourth relation between the jobs.

  ### Conclusion

  The strongest argument against parity is that it solves a problem that only exists if one insists on classical logic for non-classical concepts. The Small-Improvement Argument is powerful only if one accepts that "Not Equal" + "Not Better" = "Parity." But if "Better Than" is a vague predicate, "Not Better" is compatible with "Indeterminate," which renders the deduction invalid.

  Your spreadsheet failed to yield a result not because the jobs stood in a special metaphysical relation of parity, but because the weights you assigned (salary, equity, mission) are incommensurable in a way that generates semantic vagueness. The "stability" you felt—that even a sweetened offer didn't clearly win—is the stability of the penumbra, not the stability of a fourth relation. By adopting the vagueness view, we explain the phenomenology of the hard choice, accommodate the failure of the small improvement, and preserve the ability to exercise agency, all without multiplying value relations beyond necessity. Parity is not a discovery of a new normative reality; it is a misdiagnosis of the vagueness inherent in comparative value.
