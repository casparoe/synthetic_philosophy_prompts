answer: |-
  A retired particle physicist is stuck at a departmental mixer next to an enthusiastic metaphysician who is holding court on Bradley's Regress.

  "Don't you see?" the metaphysician says, waving a cocktail napkin. "If a relation connects a particular to a universal, you need a *further* relation to connect the first relation to the terms. And another to connect that one. It's an infinite chain! There's no genuine unity. It's vicious!"

  The physicist takes a slow sip of scotch, nodding. "Sounds like QCD. Gluons bind quarks. But gluons carry color charge, so they bind to other gluons. Which bind to more gluons. It's relations all the way down, too."

  "Exactly!" cries the metaphysician. "So the ontology is fundamentally fractured!"

  "Nah," says the physicist. "That's just non-Abelian gauge theory. When the coupling constant gets strong enough, the infinite chain confines. The whole regress locks up into a single color-neutral singlet."

  The metaphysician blinks. "And what do you call that singlet?"

  "A proton," says the physicist. "Or, in your line of work, I suppose you'd call it 'Socrates is Wise.'"

  "But the internal structure..."

  "Is unobservable," the physicist says, setting down his glass. "You're trying to do perturbative ontology at low energy. You think the infinite chain prevents unity. In my field, the infinite chain *is* the unity. You're just upset because you can't isolate the links without shattering the fact."

  He gestures to the napkin. "We called our binder a 'gluon' and took credit. You call yours a 'relation' and panic. Difference is, we don't try to pull the quarks apart to prove the glue exists. We just measure the mass of the hadron and go to lunch."
