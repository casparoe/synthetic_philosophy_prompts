      *   *Check:* Did I address the propensity interpretation sufficiently? *Correction:* Need to emphasize that propensities are unobservable theoretical constructs. We infer them from outcomes, which brings us back to the circularity.
      *   *Check:* Did I distinguish principle vs. hypothesis? *Correction:* Make this a dedicated section. The success of specific models (like antibiotic resistance) relies on adding independent premises (physiology, genetics). The *principle* alone doesn't predict *which* trait is fit.

  6.  **Final Polish:**
