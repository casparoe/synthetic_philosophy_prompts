      *   *Nuance on Propensity:* The "Single Case Propensity" problem. If I say a coin has a 0.5 propensity for heads, and it lands tails 100 times, is the propensity wrong? Or just unlucky? With organisms, "bad luck" (drift) is always a valid excuse for why the "fittest" didn't win. This shields the principle from falsification.
      *   *Nuance on Popper's Recantation:* Popper distinguished between the *theory* (which he said is testable) and the *principle*. But the prompt asks to argue the *principle* itself isn't falsifiable. I need to show that Popper's recantation actually validated the idea that the *core* is metaphysical, while the *periphery* is scientific.
      *   *The "No-Contrast" Class:* For a statement to be empirical, there must be a possible state of affairs that would contradict it. What observation contradicts "Natural Selection occurs"? If a less fit trait spreads, we say "drift" or "changing environment." If a fitter trait spreads, we say "selection." The principle covers all bases.

  5.  **Refining the Argument (Self-Correction during drafting):**
