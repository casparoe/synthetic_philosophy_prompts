          *   Argument: This concedes the point! It admits the *general principle* isn't the testable part; the auxiliary assumptions are.
          *   The principle itself remains adaptable to any outcome (immunization strategy).
      *   **Section 3: Critiquing the Propensity Interpretation.**
          *   Propensity defines fitness as a probability *before* the fact.
          *   Problem: How do we measure propensity independently of the outcome without circularity?
          *   If the "fittest" (highest propensity) fail to reproduce due to drift/bad luck, the theory explains it away as "probabilistic."
          *   This makes the principle unfalsifiable because any outcome is compatible with the probability distribution.
      *   **Section 4: The Principle vs. Particular Hypotheses.**
          *   Crucial distinction. Specific models (e.g., peppered moths) are testable.
          *   The *Principle of Natural Selection* (PNS) is the framework allowing those models.
          *   PNS functions as a "matrix" or "metaphysical research programme" (ironically validating Popper's original label).
      *   **Conclusion:**
          *   Summarize.
          *   Reiterate that Popper's original insight captures the logical status of the general principle, even if evolutionary biology is scientifically robust in practice.

  4.  **Drafting - Key Arguments & Nuances:**

