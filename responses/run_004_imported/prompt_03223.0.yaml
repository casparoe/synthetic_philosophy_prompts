      *   **Popper's Recantation:** He later admitted that if fitness is defined independently (e.g., physiological traits), the theory becomes testable. He viewed it as a metaphysical research program that *can* generate testable hypotheses.
      *   **Propensity Interpretation:** Fitness is a probabilistic disposition (propensity) to reproduce, based on traits/environment, not the actual outcome. This breaks the link between definition and outcome.
      *   **My Task (The Counter-Argument):**
          1.  Defend the tautology charge (or at least the non-falsifiability of the *principle*).
          2.  Critique Popper's recantation (why it doesn't save the *principle* itself).
          3.  Critique the Propensity Interpretation (why it doesn't make the *principle* falsifiable).
          4.  Maintain the distinction between the *general principle* and *specific models*.

  3.  **Outline the Essay:**

      *   **Introduction:**
          *   Introduce Popper's initial critique (tautology/metaphysical).
          *   Mention the recantation and propensity interpretation.
          *   State the thesis: Popper was right about the *principle* itself remaining a framework rather than a falsifiable law, despite these attempts to save it.
      *   **Section 1: The Enduring Force of the Tautology Charge.**
          *   Explain why "fitness" is inherently retrospective in the general principle.
