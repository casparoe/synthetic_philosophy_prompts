answer: |-
  Good evening. For those of you who don't know me, I'm the brother of the bride. I'm also a software engineer. Which means my job is to make sure systems do exactly what they're told, consistently, over time. [Bride]'s job, as many of you know, is to study why human beings *don't* do that.

  For the last five years, I've had a front-row seat to [Bride]'s PhD research. At family dinners, while everyone else was discussing the roast, I was being asked if a rational agent should bind its future self to a plan. I won't pretend I understand the math as well as the people in the front row do. But I have absorbed the core idea. It's about something called "diachronic rationality."

  In plain English: Rationality isn't just about making the best choice *right now*. It's about making choices across *time* that don't leave you worse off than when you started.

  [Bride] talks about the "money pump." This is what happens when your preferences shift inconsistently. You trade A for B, then B for C, then C for A, paying a little fee every time. You end up back where you started, but you're poorer. You've been pumped.

  Marriage, it seems to me, is the ultimate test of diachronic rationality. It is a long sequence of choices stretched over decades. And the danger isn't just that you might make a bad choice today. The danger is that the "you" of ten years from now might look at the "you" of today and say, "I don't want that anymore."

  So, how do you protect the relationship from the shifting winds of your own future preferences? [Bride]'s work suggests there are three ways to handle your future self.

  The first is the **Naive** approach. The Naive agent thinks, "I feel love now, so I will feel love forever. I don't need a plan; I'll just follow my feelings." To a philosopher, this is dangerous. Feelings cycle. Preferences shift. If you only stay married as long as it feels marginally better than the alternative, you are vulnerable. You become a money pump for every new temptation that comes along. "Follow your heart" is beautiful poetry, but as a strategy for a fifty-year partnership, it's fragile.

  The second is the **Sophisticated** approach. The Sophisticated agent knows their future self might be weak. They see the exploit coming. So they plan around it. They keep their options open. They sign the prenup with one foot out the door. They love conditionally, guarding against the day the feelings fade. It's rational, yes. But it's cold. It treats marriage like a negotiation with a stranger, rather than a union with a partner.

  And then, there is the third way. The **Resolute** approach.

  This is the argument [Bride] has spent five years defending. The Resolute agent makes a plan—a vow—with full knowledge that their future self might want to abandon it. And they choose, *now*, to bind that future self. Not because they are naive about the difficulties, but *because* they anticipate them.

  Resolution says: "I know that in ten years, there might be a trade that looks marginally better. I know that 'in sickness and in health' will not always feel good in the moment. But I am choosing now to make that future choice unavailable to myself."

  This isn't about losing freedom. It's about gaining the freedom to build something deep that requires stability to grow. It is the only way to avoid being pumped dry by the endless cycle of "what if?"

  [Groom], [Bride] has taught me that being rational isn't about maximizing utility in the moment. It's about integrity across time. And that is what a vow is. It is a pre-commitment device made of love. It is you saying to your future selves: "We are not going to trade each other away when the market fluctuates."

  So, to the happy couple. Do not be Naive; know that the road will be hard. Do not be Sophisticated; do not keep your escape routes mapped. Be Resolute. Bind yourselves to each other, not because it is easy, but because you have decided that the plan you are making today is worth more than the options you might want tomorrow.

  Please raise your glasses. To [Bride] and [Groom]. May your preferences remain consistent, may your vows be binding, and may you never be money-pumped.

  To the bride and groom!
