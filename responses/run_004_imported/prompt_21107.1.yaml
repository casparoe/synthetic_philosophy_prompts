prompt: |-
  Below is a passage from Galileo Galilei's "Letter to the Grand Duchess Christina" (1615), an open letter defending the Copernican system against charges of impiety, quoted here from Thomas Salusbury's English translation of 1661. In this section Galileo takes up the objection that heliocentrism cannot be squared with the story in Joshua 10, where Joshua commands the sun to stand still so that the day might be lengthened.

  "It remaineth now to consider whether it be true, that the Place in Joshua may be taken without altering the pure signification of the words: and how it can be that the Sun, obeying the command of Joshuah, which was, That it should stand still, the day might thereupon be much lengthened. Which businesse, if the Celestial Motions be taken according to the Ptolomaick Systeme, can never any wayes happen; for the Sun moving thorow the Ecliptick, according to the order of the Signes, which is from East to West, (which is that which maketh Day and Night) it is a thing manifest, that the Sun ceasing its true and proper Motion, the day would become shorter and not longer: and that on the contrary, the way to lengthen it would be to hasten and velocitate the Suns motion; insomuch that to cause the Sun to stay above the Horizon for some time, in one and the same place, without declining towards the West, it would be necessary to accelerate its motion in such a manner as that it might seem equal to that of the Primum Mobile, which would be an accelerating it about three hundred and sixty times more than ordinary. If therefore Joshuah had had an intention that his words should be taken in their pure and proper signification, he would have bid the Sun to have accelerated its Motion, so that the Rapture of the Primum Mobile might not carry it to the West: but because his words were heard by people which haply knew no other Celestial Motion, save this grand and common one from East to West, stooping to their Capacity, and having no intention to teach them the Constitution of the Spheres, but only that they should perceive the greatness of the Miracle wrought in the lengthening of the Day, he spoke according to their apprehension.

  But now, if this same passage may be understood in the Copernican Systeme to agree better with what we read in Joshuah, with the help of another Observation by me newly shewen in the Body of the Sun, I will propound it to consideration; speaking alwaies with this safe Reserve, that I am not so affectionate to my own inventions as to prefer them before those of other men.

  Supposing therefore, in the first place, that in the Miracle of Joshuah the whole Systeme of the Celestial Revolutions stood still (that by the staying of one alone all the Constitutions might not be confounded, and a great disorder needlesly introduced into the whole course of Nature): I come, in the second place, to consider how the Solar Body, although stable in one constant place, doth nevertheless revolve in it self, making an entire Conversion in the space of a Month, or thereabouts, as I conceive I have solidly demonstrated in my Letters Delle Machie Solari: Which motion we sensibly see to be in the upper part of its Globe, inclined towards the South, and thence towards the lower part, to encline towards the North, just in the same manner as all the other Orbs of the Planets do. Thirdly, if we respect the Nobility of the Sun, and his being the Fountain of Light, and Principle of Motion, God intending that, at the Command of Joshua, all the Worlds Systeme should continue many hours in the same state, it sufficeth to make the Sun stand still; upon whose stay (all the other Conversions ceasing) the Earth, the Moon, and all the other Planets did abide in the same Constitution as before: nor in all that time did the Day decline towards Night, but it was miraculously prolonged: and in this manner, upon the standing still of the Sun, without altering, or in the least disturbing the other Aspects and mutual Positions of the Stars, the Day might be lengthned on Earth; which exactly agreeth with the Litteral sense of the Sacred Text."

  Please help me understand the reasoning in this passage. Specifically:

  1. Why does Galileo think that, on the Ptolemaic system, a literal fulfillment of Joshua's request would actually require the sun to accelerate rather than to stop? What role does the "Primum Mobile" play in that argument, and why would arresting the sun's own motion make the day shorter instead of longer?

  2. On the Copernican alternative Galileo proposes, the sun does not carry the planets around the earth the way Ptolemy's outermost sphere was thought to carry the stars in the daily rotation. So why does he think that halting the sun alone suffices to halt "the whole Worlds Systeme" at once? What is he relying on when he says he has "solidly demonstrated" from his study of sunspots that the sun rotates on its own axis about once a month, and how is that rotation supposed to make the sun a "Principle of Motion" for the other planets?

  3. Why does Galileo present all this as showing that the Copernican system honors the literal wording of the Joshua story better than the Ptolemaic one does? Isn't heliocentrism usually assumed to be the view under greater pressure from this kind of scriptural passage, rather than the one that relieves the pressure?
