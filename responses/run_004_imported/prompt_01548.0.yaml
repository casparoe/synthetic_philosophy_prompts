answer: |-
  The reel-to-reel sat on the workbench like a dormant animal. It was a Nagra IV-S, the same model Sarah had used for her field recordings. Elias had spent three weeks cleaning the oxide shedding from the magnetic tape, a process called vinegar syndrome, where the past literally begins to rot in the present.

  He was an audio archivist. He made the dead speak. But since the memorial, he hadn't been able to press play.

  At the service, Sarah's brother had read the letter from Einstein to the Besso family. *"Now she has departed from this strange world a little ahead of me. That means nothing. People like us, who believe in physics, know that the distinction between past, present and future is only a stubbornly persistent illusion."*

  The room had sighed in relief. It was beautiful. It was scientific. It suggested Sarah wasn't gone, just… elsewhere on the map.

  But for Elias, the quote was a lockpick that had broken inside the door.

  If Einstein was right—if Eternalism held and the universe was a static block of spacetime—then Sarah was not dead. She was alive at coordinate $t_{1989}$ (her birth) and $t_{2023}$ (her death) and every moment in between. They were all equally real. Elias's grief was merely a symptom of his consciousness sliding along the time axis, like a needle on a groove. He wasn't losing her; he was just moving away from her. That made his pain a navigational error, not a tribute.

  But if Presentism was true—if only the *now* existed—then the Sarah of 2023 was annihilated. She was nothing. Dust. The memories in Elias's head were just neural firings with no referent. To grieve was to mourn a ghost that had never been real to begin with.

  One theory made his grief trivial; the other made its object imaginary.

  "Elias?"

  He jumped. It was Mara, a doctoral candidate in cosmology who frequented the shop to digitize old lectures. She held two coffees.

  "You look like you're trying to solve the horizon problem with a screwdriver," she said, setting a cup down near the Nagra.

  "The tape is degrading," Elias said. "It's the last recording she made. The day before the aneurysm."

  "And you haven't played it."

  "If I play it, I have to decide where she is."

  Mara leaned against the bench, crossing her arms. "We've talked about this. The Block Universe. It's the standard model. She's there. You're here. The distance is temporal, not ontological."

  "That's the problem, Mara. If she's *there*, in the block, then she's not gone. If she's not gone, why does this hurt? It feels like I'm crying because I'm too slow to catch up to her. It makes grief a failure of velocity."

  Mara sipped her coffee. "And the alternative? Presentism?"

  "If only the present is real, then she's erased. The tape is just plastic and rust. When I hear her voice, I'm hallucinating a person who no longer has any being. It makes memory a lie."

  Elias picked up a splicing block. "Eternalism says I can't lose her. Presentism says I never had her. Both of them steal the loss from me. And if I can't keep the loss, I can't keep the love."

  Mara was quiet for a long time. The hum of the dehumidifier filled the silence. "You're treating metaphysics like a legal contract," she said finally. "You think if you sign the right ontology, the pain will make sense."

  "I need to know if I'm talking to a location or a ghost."

  "Maybe you're talking to a witness."

  Elias looked at the tape. "What does that mean?"

  "Physics describes the container," Mara said. "It doesn't describe the content. The Block Universe might be true. The past might be fixed and unchanging, a landscape of frozen events. But a landscape doesn't mean anything without an observer walking through it. The 'Now' isn't a slice of the universe, Elias. It's an act of attention."

  She tapped the reel. "If Eternalism is true, that voice is permanently etched in the spacetime manifold. It is indestructible. But it is dark. It requires a light to shine on it. Your grief is the light. You aren't moving away from her; you are illuminating the coordinate where she exists."

  "And if Presentism is true?"

  "Then the fact that you are in pain right now is the only proof that she was real. The impact proves the object. You can't have a scar without a blade."

  Elias looked down at his hands. They were shaking. He had been waiting for the physics to validate the emotion. He wanted the universe to confirm that his sorrow was a rational response to objective reality. But the universe, it seemed, was indifferent to the distinction.

  "If I play this," Elias said, "and I hear her laugh… am I just stimulating my own auditory cortex with magnetic patterns?"

  "Yes," Mara said. "And?"

  "And it feels like she's in the room."

  "Then the distinction doesn't matter to the biology of love."

  Elias threaded the tape. His fingers knew the motion: over the head, around the capstan, into the take-up reel. The tactile resistance of the mechanism grounded him. This was the present. The friction of plastic on metal was undeniably *now*.

  He pressed the play button.

  The motors whirred. The tape tightened. For ten seconds, there was only the hiss of the noise floor, the sound of empty time waiting to be filled.

  Then, Sarah's voice.

  *"Testing, one, two. The wind is picking up near the ridge. Elias, if you're hearing this, stop worrying about the mix. It's fine. It's always fine."*

  She laughed. It was a specific sound, a catch in the throat before the exhale.

  Elias closed his eyes.

  If Eternalism was true, that laugh was happening forever at a specific coordinate. It was a monument. But monuments are cold. What warmed it was the fact that Elias, here, in the *now*, was receiving it. The signal required a receiver. The block universe was a library, but without a reader, the books are just paper. He was the reader. His grief was the act of reading.

  If Presentism was true, the laugh was gone. It had ceased to exist the moment the air pressure waves dissipated in 2023. But the tape was a fossil. And a fossil proves the creature existed. The pain in his chest, the tightness in his throat—that was the present-moment reality of a past-tense love. The pain was the bridge.

  He realized then that the Einstein quote was not a description of reality, but a prescription for courage. It wasn't telling him that time didn't exist. It was telling him that *separation* didn't exist.

  But separation *did* hurt.

  The tape clicked as it reached the end. The machine spun idly.

  Elias didn't rewind it. He let it spin.

  "Well?" Mara asked softly.

  "It's not about where she is," Elias said. He kept his hand on the stop button, feeling the vibration of the motor. "It's about the cost of finding her."

  "The cost?"

  "To hear that, I had to clean the tape. I had to fix the machine. I had to sit in this room and be willing to be hurt. Whether the past is real or the present is real… the work is the same. The attention is the same."

  He looked at Mara. "The illusion isn't the distinction between past and future. The illusion is that I need to know which one is real to love her."

  Mara nodded. "So, what do you do now?"

  Elias unthreaded the tape. He placed it back in its box, labeling it with the date and the location. He treated it like an artifact, sacred and fragile.

  "I keep the light on," he said.

  He turned off the Nagra. The hum of the room returned, the sound of the present moment, heavy and real and moving forward. He didn't know if Sarah was waiting for him in the future of the block, or if she was extinguished in the past of the void. He only knew that the silence she left behind was not empty. It was shaped like her.

  And he was the one who had to fill it, not with her voice, but with his own continuation.

  "Come on," Elias said, picking up his coat. "Let's get dinner. I'm starving."

  "Now?" Mara asked.

  "Yes," Elias said, opening the door to the street. "Just now."
