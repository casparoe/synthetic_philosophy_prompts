      *   **The Deceased Friend:** Needs to be specific. Let's call her Sarah.
      *   **The Conflict:** Elias is trying to recover a final message or recording, but the philosophical weight of *when* that recording exists is crushing him.

  3.  **Plot Outline:**
      *   **Inciting Incident:** Elias receives a box of Sarah's old tapes/recordings after her death. He finds a corrupted file or a gap.
      *   **Rising Action:** He tries to fix it. He obsesses over the nature of the recording. Is the voice *there* (Eternalism) or is it just magnetic dust until played (Presentism)? He meets with a physicist or philosopher (maybe a former professor) to discuss the Einstein quote.
      *   **Climax:** He manages to play the recording. He has to choose how to interpret the experience. Does he accept the Block Universe (she is still there, just "elsewhere") or Presentism (she is gone, but this trace remains)?
      *   **Resolution:** A synthesis. The metaphysics doesn't change the loss, but the *act* of witnessing bridges the gap. Grief is the mechanism of navigation.

  4.  **Drafting - Scene by Scene:**

