      *   **Problem:** Eternalism makes grief feel like a spatial displacement (no real loss). Presentism makes the past feel like it never happened (no real existence). Both undermine the validity of grief/memory.
      *   **Format:** Short story.
      *   **Requirement:** Take the dilemma seriously. Real stakes for the character. Metaphysics must drive the plot, not just be decoration. Avoid cliché time-travel tropes ("everything happens at once" shorthand).
      *   **Tone:** Philosophical, melancholic, searching, but ultimately human.

  2.  **Character & Setting:**
