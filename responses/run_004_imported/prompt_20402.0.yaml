  Here is a scenario designed to test the Williams/Internalism boundary without relying on the standard "Gin/Petrol" or "Nasty Husband" examples. It is built to feel like a scene from a novel, with specific stakes, while isolating the philosophical mechanism you need for your confrontation.

  ### The Scenario: "The Conservator's Vault"

  **The Characters:**
  *   **Julian:** A high-end art conservator and private investor. He buys damaged masterpieces, restores them, and sells them.
  *   **Elena:** His estranged sister, a public defender.

  **The Subjective Motivational Set (SMS):**
  Julian does not care about "morality," "kindness," or "public good." Those concepts bounce off him. However, he is obsessively devoted to two things:
  1.  **Integrity of Material:** He believes a painting is "true" only if its physical layers are untouched by modern synthetic chemicals.
  2.  **Permanence:** He hates waste. He believes his job is to make things last forever.

  **The Situation:**
  Julian has acquired a massive, crumbling mural by a forgotten 1930s artist. It is currently housed in a public library that is being foreclosed on.
  *   **The Asset Play:** Julian can strip the mural, restore it using a new (highly effective but synthetic) polymer, and sell it to a private collector for $20 million.
  *   **The Moral Play:** Elena wants the mural kept in the library. To do this, it must be restored using traditional, less stable methods, and it must remain public (generating no profit).

  **The Confrontation:**
  Elena isn't appealing to Julian's conscience. She knows he doesn't have one. She is appealing to his **Integrity** and **Permanence**.

  She argues: *"If you use the polymer, you aren't restoring it; you're encasing it. That's not permanence, Julian, that's embalming. And if you sell it to a collector, it goes into a vault. A painting in a vault isn't preserved; it's deleted. The only way to satisfy your own standard of 'Permanence' is to leave it here."*

  ***

  ### The Philosophical Divide

  This scene creates a genuine toss-up on whether Julian has a *reason* to listen to Elena.

  #### 1. The Internalist Case (Bernard Williams)
  Williams argues that for Julian to have a reason to leave the mural in the library, Elena's argument must connect to something already in his SMS (Integrity/Permanence) via **sound deliberation**.

  *   **The Deliberative Route:** Elena is claiming that Julian is making a *factual/error* mistake about his own values. She is arguing that "Permanence" *conceptually entails* "Public Access" or that "Synthetic Polymer" *conceptually entails* "Falsehood."
  *   **The Toss-Up:**
      *   **If Williams is right:** Julian only has a reason if, upon rigorous reflection, he admits that a painting in a vault is "wasted" (violating Permanence) or that polymers are "lies" (violating Integrity). If his SMS is truly rigid—if he genuinely defines Permanence as "physical survival of the canvas regardless of viewership"—then Elena is just making noise. There is no internal reason. He can shrug and say, "I define Permanence differently," and Williams would say he is logically within his rights.
      *   **The Ambiguity:** We don't know if Julian's definition of "Permanence" is a deep psychological commitment or a shallow slogan. If it's a deep commitment, sound deliberation *might* force him to agree with Elena. If it's shallow, there is no hook for the reason to grab onto.

  #### 2. The Externalist Case (Thomas Nagel / John McDowell)
  Nagel or McDowell would argue that Julian has a reason to leave the mural in the library **regardless** of his SMS.

  *   **The Objective Reason:** The mural is a public good. It belongs to the community. Its destruction (or hiding) is a loss of value in the world.
  *   **The Toss-Up:**
      *   **If Externalists are right:** Julian is *irrational* or *defective* for not seeing the reason. The reason exists outside of him. Elena's speech isn't trying to find a hook in his psychology; it's trying to wake him up to a reality he is ignoring.
      *   **The Ambiguity:** If Julian remains unmoved, the Externalist says, "He is blind to reason." The Internalist says, "He simply lacks the motivation." The scene hangs on whether we view Julian's stubbornness as a **cognitive failure** (he can't see the truth) or a **motivational limit** (he just doesn't care).

  ***

  ### Why This Helps Your Novel

  This scenario gives you a blueprint for your brother's confrontation scene with the asset manager. The key is to avoid making the brother appeal to *morality* (which the antagonist can easily reject as external) and instead have him appeal to the antagonist's *own internal logic*.

  **For your scene, try this structure:**

  1.  **Identify the Antagonist's "Sacred Value":** Your asset manager likely prides himself on something other than money. Maybe it's "Market Efficiency," "Risk Management," or "Truth in Pricing." Let's say it's **Efficiency**.
  2.  **The Brother's Move:** The brother shouldn't say, "It's wrong to crush this community." He should say, "Crushing this community creates *inefficiency*."
  3.  **The Deliberative Hook:** The brother argues that social decay creates long-term risk, which violates the "Efficiency" mandate. Or, that true efficiency requires stable inputs (people), and destroying them is "resource waste."
  4.  **The Williams Tension:** The reader (and the editor) needs to feel the uncertainty: *Is the antagonist actually committed to Efficiency, or is that just a cover for Greed?*
      *   If he's committed to Efficiency, the brother has handed him an **Internal Reason**. He *must* listen to be consistent with himself.
      *   If he's just greedy, the brother's speech is external noise. The antagonist can shrug it off without logical contradiction.

  **The "Toss-Up" Moment in the Text:**
  You write the scene so that the antagonist *pauses*. He looks at the numbers. He looks at the brother. For a moment, it is genuinely unclear if he is calculating a new variable (Internal Reason found) or just deciding he doesn't care (External Reason rejected).

  *   **If he relents:** It suggests Williams was right; there was a dormant desire for "Consistency" or "True Efficiency" that the brother excavated.
  *   **If he doubles down:** It suggests the Externalist was right; there *was* a reason (the community's welfare), but the antagonist is morally blind to it.

  ### How to Write the Ambiguity
  To keep it from feeling rigged, give the antagonist a line of dialogue that could be interpreted both ways.

  > **Brother:** "You call yourself a risk manager. But this? This isn't management. This is arson. You're burning the floor you're standing on."
  >
  > **Antagonist:** "I'm not burning the floor. I'm selling the wood before the house collapses."
  >
  > **Brother:** "Then you're not a manager. You're a scavenger."

  Here, the antagonist *could* be offended by "Scavenger" because he internally values being a "Manager" (Internal Reason to change). Or, he could be indifferent because he knows he's a scavenger and doesn't care (No Internal Reason). The tension lies in whether his identity is a *constraint* on his actions or just a *label*.

  This approach satisfies your editor (big confrontation) and your philosopher friend (Williams-compliant reasoning) without forcing a moral conversion that feels unearned.
