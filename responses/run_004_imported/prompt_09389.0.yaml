answer: |-
  You have hit on exactly the right tension in the text. Your reading is sharp: Aquinas *is* setting up two distinct moral tracks here, and modern discussions of the Doctrine of Double Effect (DDE) often ignore the second one.

  To untangle this, we have to look at the metaphysical "property rights" Aquinas assumes regarding human life. Once you see that, the distinction between the private citizen and the public official makes perfect sense within his system.

  Here is the breakdown of what is actually going on in Article 7.

  ### 1. The Two Tracks of Justified Killing

  You correctly identified that Aquinas offers two ways killing can be lawful. Let's label them:

  *   **Track A (Private Self-Defense):** The killing is **unintended**. It is a side effect (*praeter intentionem*) of saving yourself.
  *   **Track B (Public Authority):** The killing is **intended**. It is the means to the end of protecting the common good.

  Your confusion is: *If Track A already justifies the act without intending death, why do we need Track B? And why is Track B restricted to officials?*

  ### 2. The Core Principle: Dominion Over Life

  The key to the whole argument is this question: **Who owns a human life?**

  For Aquinas (and medieval political theology generally), a private individual does **not** have dominion (authority/ownership) over another person's life. Only God has that. Therefore, a private citizen cannot *choose* to end a life, because that life isn't theirs to take.

  *   **In Track A (Private Citizen):** You are allowed to save your own life because you *do* have dominion over your own existence (natural law says everything seeks to preserve itself). If the aggressor dies in the process, you didn't "take" his life; his death was an accidental byproduct of you exercising your right to exist. You didn't usurp God's authority because you never intended to act as the judge of his life.
  *   **The Limit:** If a private citizen *intends* to kill the aggressor (even in self-defense), they cross the line. They are claiming authority over the aggressor's life that they do not possess. That becomes murder.

  **So, why does Track B exist?**
  Because the State (Public Authority) *does* have a delegated dominion over life and death for the sake of the community. Aquinas views the state as having the responsibility to "lop off" diseased members to save the body politic.

  *   **In Track B (Soldier/Judge):** When a soldier kills an enemy combatant or an executioner kills a condemned criminal, they are not acting as private individuals. They are acting as "ministers of the law." They are wielding the sword of the community. Therefore, they *can* intend the death of the other person, because their authority to do so is derived from the common good, not private interest.

  ### 3. Why the Distinction Matters (The "Animosity" Clause)

  Notice the very last sentence of the passage you quoted: *"...although even these sin if they be moved by private animosity."*

  This proves that the distinction isn't just about *who* you are, but **whose interest you are serving.**

  *   If a private citizen kills, it must be purely to save themselves (Track A). If they enjoy it or plan it, it's murder.
  *   If a public official kills, it must be purely to save the community (Track B). If they enjoy it or hold a grudge, it's murder.

  Aquinas needs both tracks because there are scenarios where Track A doesn't work.
  *   **Example:** A soldier on a battlefield. If the soldier says, "I don't intend to kill that enemy soldier, I just intend to shoot near him to make him run away, but oops, he died," Aquinas would say that is morally shaky or dishonest. The soldier's job *is* to neutralize the threat, which requires intending to kill. Track A doesn't cover this. Track B covers it: The soldier intends to kill, but refers that intention to the "common good" of the state.

  ### 4. Is Modern DDE "Missing Half the Work"?

  **Yes, absolutely.**

  When philosophers in the 20th century (like G.E.M. Anscombe) revived the Doctrine of Double Effect for secular ethics, they largely secularized Track A and discarded Track B.

  *   **Modern Secular DDE:** Focuses almost entirely on the "intended vs. foreseen" distinction. It generally holds that intending harm is worse than foreseeing harm. It rarely includes a clause that says, "Unless you are a government agent, in which case intending harm is fine."
  *   **Why the drop?** Modern liberal democracy is skeptical of granting individuals (even state actors) the moral license to *intend* death as a good thing. We prefer the Track A formulation (collateral damage is regrettable but sometimes necessary) over the Track B formulation (killing is a positive tool of statecraft).

  **In the context of your Self-Driving Car argument:**
  Your coworker invoked the DDE to suggest the car could sacrifice the passenger if the death of the passenger was a "side effect" of saving the pedestrians.

  But if we apply full Aquinas:
  1.  **Private Car (Track A):** The car acts as a private agent. It cannot *intend* the death of the passenger. It can only intend to avoid the pedestrians. If the passenger dies as a side effect of swerving, that fits Track A (Double Effect).
  2.  **Police/Military Vehicle (Track B):** If the AV is a police vehicle engaging a terrorist, it *could* theoretically be programmed to intend the neutralization of the threat (even if it risks the officer/passenger), because it acts with public authority for the common good.

  ### Summary

  Aquinas isn't contradicting himself; he is building a jurisdictional map.

  *   **Private Jurisdiction:** You own your safety, not your neighbor's life. You can save yourself, but you cannot target his death. (This is the Double Effect part).
  *   **Public Jurisdiction:** The State owns the responsibility for the common safety. Its agents can target death if it serves the community. (This is the Public Authority part).

  Modern trolley problem debates usually get stuck in Track A because we don't agree on who has the authority to operate in Track B. Your coworker was right that the distinction goes back to Aquinas, but they likely missed that Aquinas reserved the "right to intend harm" exclusively for the state, which complicates the "sacrifice the passenger" argument significantly. A private AV doesn't have "public authority," so under Aquinas's full framework, it might be *more* restricted than a human driver who is panicking (Track A), not less.
