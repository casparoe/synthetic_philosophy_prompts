      *   *Route 1 (Private Citizen):* Killing is a *praeter intentionem* (beside the intention). It's a regrettable side effect of saving oneself.
      *   *Route 2 (Public Authority):* Killing is *intended*, but justified by the role (common good).
      *   *Why both?* Because the *source of authority* differs.
          *   Private: Authority comes from natural law (self-preservation). Limit: Cannot usurp God's/Judge's role over life and death.
          *   Public: Authority comes from the state/community (delegated power to punish/protect). Limit: Must be for common good, not private animosity.
