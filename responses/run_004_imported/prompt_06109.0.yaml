  ### **How to Defend This to the Professor**
  If the professor asks why you graded them hard on the last paragraph, say this:

  > "The student claimed the inductor converges to 1 for *every true sentence*, including unprovable ones like Goldbach's. I marked that down because Garrabrant et al. explicitly state that logical inductors avoid logical omniscience. If a computable process converged to 1 on all true arithmetic sentences, it would decide the theory, which violates the computability constraint of the LI framework. They confused 'provable in T' with 'true in the standard model'."

