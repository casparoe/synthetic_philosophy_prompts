      *   *Does this wreck coherence arguments?* It weakens the *pragmatic* argument (money pumps) but the *axiomatic* argument (VNM) still stands mathematically. The question is whether rationality *requires* avoiding money pumps at all costs. Most say yes, but the *cost* of avoiding them matters.
