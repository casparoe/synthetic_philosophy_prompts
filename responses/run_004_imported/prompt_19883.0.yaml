answer: |-
  Here are 10 discussion questions drafted for your Q&A. They are designed to be rigorous enough for a philosophy reading group while targeting the specific tensions you identified. Each includes the primary question, the "Likely Dodge" you should anticipate, and a sharp follow-up to keep her on the hook.

  ### 1. The Activist vs. The Theorist (Border Control)
  **Question:** Dummett spent decades with the JCWI fighting restrictive immigration laws, yet in this text, he explicitly concedes that states possess a *prima facie* right to control their borders. How do we reconcile the radicalism of his activist record with the theoretical conservatism of this concession? Is the book a betrayal of his earlier praxis, or a necessary philosophical qualification?
  *   **Likely Dodge:** She may argue that "context matters" and that absolute open borders were never the practical goal, only fairness.
  *   **Follow-up:** "If fairness is the goal, doesn't the *right to exclude* inherently undermine fairness when the global distribution of opportunity is so skewed? If he grants the right to exclude, what specific mechanism prevents that right from swallowing the moral obligations he prioritizes?"

  ### 2. The Refugee/Economic Migrant Distinction
  **Question:** The moral architecture of the book relies heavily on the distinction between refugees (who must be admitted) and economic migrants (who may be turned away). Given that Dummett acknowledges structural global inequality, can this distinction actually carry the normative weight he needs? If economic deprivation is caused by political oppression or neocolonialism, isn't the 'economic migrant' category morally hollow?
  *   **Likely Dodge:** She might retreat to the 1951 Convention definition, arguing Dummett is working within legal realities, not ideal theory.
  *   **Follow-up:** "But Dummett is critiquing the morality of the law, not describing it. If his philosophical project is to expose the *immorality* of current policy, relying on a legal distinction that arguably codifies that immorality seems like a category error. Shouldn't the 'right to stay' extend to those fleeing economic violence?"

  ### 3. Semantic Anti-Realism and Political Commitment
  **Question:** As a philosopher of language, Dummett is famous for semantic anti-realism and verificationism. Is there any structural connection between his view that truth is epistemically constrained and his politics of immigration? For instance, does his demand for 'verifiable' claims in political discourse mirror his demand for verifiable grounds in asylum cases, or are these merely two separate projects of one man?
  *   **Likely Dodge:** The standard line is that Dummett kept his technical philosophy and his politics hermetically sealed ("two compartments").
  *   **Follow-up:** "If they are sealed, how do we explain his obsession with the *meaning* of racist language? If meaning is use, and racist language is used to exclude, doesn't his anti-realism demand a political intervention to change the 'use' and therefore the 'meaning' of citizenship?"

  ### 4. Structural vs. Individual Racism
  **Question:** Dummett defines racism in this book not merely as individual prejudice but as a structural feature of the immigration system itself. Does this definition risk making the concept of racism unfalsifiable? If any restrictive policy can be labeled structurally racist, does the term lose its diagnostic power?
  *   **Likely Dodge:** She may argue that the historical intent of the UK laws (Commonwealth Acts) proves the structural intent was racist.
  *   **Follow-up:** "Historical intent is clear for the 1960s, but what about neutral policies today that have disparate impacts? If Dummett's framework labels *any* restriction maintaining homogeneity as racist, does he leave any conceptual space for a non-racist nationalist policy, or is nationalism itself the target?"

  ### 5. The Limits of the "Right to Exclude"
  **Question:** Dummett grants states a right to control borders but argues it is overridden by the duty to refugees. Where exactly does he draw the line on capacity? If admitting all legitimate refugees threatens the welfare state that citizens rely on, does his framework prioritize the outsider over the insider, and is he prepared to defend that trade-off explicitly?
  *   **Likely Dodge:** She will likely say it's a matter of "proportionality" and that wealthy states like the UK can easily absorb the numbers.
  *   **Follow-up:** "That's an empirical claim, not a moral one. If the empirical situation changes—if absorption *does* threaten the welfare floor—does the moral obligation dissolve? I'm asking for the lexical priority in his moral hierarchy: does the refugee's need *always* trump the citizen's economic security?"

  ### 6. Historical Guilt as a Premise
  **Question:** A significant portion of Dummett's argument rests on the UK's specific historical guilt regarding WWII and the Holocaust. Does this ground his argument too narrowly? If we move to a context without that specific historical guilt (e.g., the US or Australia), does his moral imperative for open asylum lose its force?
  *   **Likely Dodge:** She might suggest that while the *degree* of obligation varies, the *humanitarian* obligation is universal regardless of history.
  *   **Follow-up:** "If the obligation is universal, why does Dummett spend so much rhetorical capital on British guilt? Does relying on historical guilt inadvertently let nations without that specific history off the hook for current refugee crises?"

  ### 7. Global Justice and Causes of Migration
  **Question:** Dummett focuses on the treatment of migrants upon arrival, but says relatively little about the geopolitical causes of displacement. Can a Dummettian ethics of immigration be coherent without a corresponding ethics of global economic justice? Is treating the symptom (asylum) enough if we ignore the disease (exploitation)?
  *   **Likely Dodge:** She may argue that the book is about *immigration policy*, not *foreign policy*, and we must tackle issues one at a time.
  *   **Follow-up:** "But if the 'right to exclude' is based on the sovereignty of the state, and that state's sovereignty contributes to the instability abroad, isn't the border control itself complicit? Can we really separate the ethics of the border from the ethics of the foreign policy that polices it?"

  ### 8. Voting Rights and Denizenship
  **Question:** Dummett was a fierce advocate for voting rights (e.g., in *Voting and the Electorate*). How does his view on suffrage connect to his immigration views? Does his framework require that long-term residents be granted citizenship immediately, or does he allow for a tiered system of denizenship?
  *   **Likely Dodge:** She will likely note he advocated for voting rights for all residents, regardless of citizenship status.
  *   **Follow-up:** "If residents can vote but cannot stay permanently, isn't that a form of political enfranchisement without security? Does Dummett's framework demand that the right to vote and the right to remain be inseparable to avoid a new class of second-class citizens?"

  ### 9. Philosophy vs. Polemic
  **Question:** Some critics argue this book is more of a political pamphlet than a work of philosophy, lacking the rigorous argumentation of his work on Frege. Does this matter? Does the "occasional" nature of the text weaken its philosophical contribution, or does it exemplify his view that philosophy must address real-world problems?
  *   **Likely Dodge:** She will likely champion the latter: that philosophy is useless if it doesn't engage with urgent moral crises.
  *   **Follow-up:** "If we accept that, do we lower our standards for argumentative rigor? For instance, when he makes sweeping claims about 'British character,' is that philosophy or essentialism? How do we critique the book without holding it to the same standard he held his semantic theories?"

  ### 10. Application to Post-2001 Crises (The Closer)
  **Question:** Finally, let's apply his framework to the Channel crossings and the Rwanda scheme. Dummett argued against criminalizing entry. Given that modern asylum seekers often have no safe legal route to apply, how would Dummett judge the criminalization of small boat arrivals? Does his concession on border control allow for *any* deterrence measures, or would he view the current UK policy as fundamentally illegitimate?
  *   **Likely Dodge:** She will almost certainly say, "Dummett would be horrified by the current government's policies."
  *   **Follow-up:** "'Horrified' is a psychological reaction, not a philosophical analysis. Which specific *principle* in the 2001 text is violated by the Rwanda scheme? Is it the violation of the right to claim asylum, the outsourcing of moral duty, or the re-introduction of the racialized border control he spent his life fighting? We need to know which premise does the work."
