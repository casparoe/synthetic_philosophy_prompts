answer: |-
  **Setting:** *A quiet, dimly lit lounge in the Lincoln Center, New York City. October 2018. A symposium on "The Future of Black Aesthetics" has just adjourned. Two men sit in leather armchairs, untouched glasses of water on the table between them. One is W.E.B. Du Bois, immaculate in a suit that feels both timeless and anachronistic. The other is Claude McKay, sleeves rolled up, leaning forward with a restless energy.*

  **Du Bois:** (Steepling his fingers) A Pulitzer. For a rapper. I must admit, Mr. McKay, the symbolism is… potent. The institution of letters, finally bowing to the rhythm of the streets. It suggests a democratization of culture we fought for in *The Crisis* a century ago.

  **McKay:** (A dry smile) You fought for the right to be judged by the same standards as white men, Doctor. Kendrick Lamar was judged by a standard entirely his own. That is the difference. They didn't give him the prize because he fit their mold. They gave it to him because he broke it.

  **Du Bois:** Did he? Or did they simply expand the mold enough to co-opt the rebellion? I listened to the album. *DAMN.* It is technically brilliant, I grant you. But it is steeped in the very imagery that has been used to chain us. Violence. Profanity. A nihilism that borders on the pathological. When I reviewed *Home to Harlem*, I told you that such depictions made the white reader feel as though he needed a bath. I fear this Pulitzer is not a celebration of Black art, but a voyeuristic ticket for the white critic to feel progressive while consuming our trauma.

  **McKay:** There it is. The bath. You always worried about how the white man smelled after reading us. I wrote *Home to Harlem* for the common Negro, not for the NAACP boardroom. And Kendrick? He raps for Compton. He raps for the boys in the hood who know the difference between a siren and a song. If the white critic feels uncomfortable, good. If he feels dirty, perhaps he is finally seeing the grime of the system he benefits from. Why must our art be a bath for *them*? Why can't it be a mirror for *us*?

  **Du Bois:** Because the world does not judge us as individuals, Claude. It judges us as a race. That is the burden of the Talented Tenth. We are not free to be merely "artists." We are ambassadors. Every time a Black man stands before a microphone or a press, he is arguing a case before a hostile jury. If you present evidence that confirms their prejudice—that we are violent, hypersexual, coarse—you lose the case. I argued that all Art is propaganda. It *must* be. We cannot afford the luxury of art for art's sake when our voting rights are being stripped and our bodies are still being lynched.

  **McKay:** (Leaning back, shaking his head) And there is the trap. You want the artist to be a lawyer. But Kendrick isn't arguing a case. He is confessing a sin. He talks about wickedness and weakness. He talks about loving his own people and hating them in the same breath. That is not propaganda, Doctor. That is humanity. If you sanitize the Black experience to make it palatable for the jury, you are lying. And a lie cannot liberate anyone. You say we are judged as a race? I say we must live as individuals. If I paint a whore because she is in my life, I am not defending prostitution. I am defending the truth of my vision.

  **Du Bois:** Truth is strategic, Claude. There is a truth that uplifts, and a truth that degrades. I do not ask you to lie. I ask you to select. Why highlight the brothel when there is a schoolhouse down the street? Kendrick Lamar has the ear of the world. He could preach reconstruction. Instead, he preaches damnation. He validates the stereotype that the white power structure uses to justify police brutality. "Look," they say, "even their own poets admit they are dangerous."

  **McKay:** "Dangerous." Yes. That is the point. We are dangerous to the status quo. Not because we are criminals, but because we are alive. You worry that *DAMN.* gives ammunition to the enemy. I say the enemy already has the ammunition; they own the factories that make the guns and the laws that allow the shooting. Kendrick is just documenting the fallout. You want us to present a portrait of perfection to win rights we are owed by birth. I say we present a portrait of reality to demand they acknowledge our existence. Respectability is a cage, Doctor. You built a beautiful cage, but it is still a cage.

  **Du Bois:** (Voice hardening slightly) Respectability is armor. I have walked through valleys of death where your "reality" got men killed. I know the cost of being perceived as a threat. My "Criteria of Negro Art" was not a request for censorship. It was a call for responsibility. If this young man, Lamar, wins the Pulitzer, he gains power. With power comes the duty to elevate the race, not just document its suffering. Does *DAMN.* offer a way out? Or does it just dwell in the fire?

  **McKay:** It dwells in the fire so we don't burn alone. You speak of elevation. I speak of connection. When a young Black boy in Chicago hears Kendrick talk about his own guilt, his own fear of God, he knows he is not a monster. He is a man. You want art that points to a future where we are all doctors and lawyers. I want art that holds the hand of the man who is dying in the gutter today. That is not degradation. That is love. You accused me of writing for the "primitive." I say I was writing for the *pulse*. Kendrick is writing for the pulse. The Pulitzer didn't validate him. He validated the Pulitzer. He forced them to recognize that a Black man's anger is literature.

  **Du Bois:** Anger is not enough. Anger burns out. We need construction. We need institutions. If this award is merely a pat on the head for "angry Black art," it changes nothing. The policy remains. The prisons remain. I would ask you: Does this art build the institution? Or does it merely decorate the ruin?

  **McKay:** Sometimes you have to decorate the ruin because they won't let you build the house. But look closer, Doctor. You hear the profanity and the violence. I hear the theology. I hear the struggle for redemption. That is construction. It is internal construction. You want to build the state first. I say you must build the soul first. If Kendrick's art makes a Black child feel seen, complex, and worthy of a Pulitzer, that shifts the psychology of the race. That is political. Just not in the way you want to measure it.

  **Du Bois:** (Pauses, looking out the window at the New York skyline) Psychology is political. I will grant you that. But I remain concerned with the external gaze. We live in a world of power. If we define ourselves only by our internal truth, without regard for how that truth is weaponized against us, we are naive.

  **McKay:** And if we define ourselves only by how the white man sees us, we are slaves. You fear the white gaze. I ignore it. I write for the Negro. Kendrick raps for the Black. If the white man wants to listen, let him learn the language. Let him take the bath, if he needs one.

  **Du Bois:** (Turns back, a faint, weary smile touching his lips) You never did yield an inch, did you, Claude?

  **McKay:** (Grinning) And you never did lower your guard, Doctor.

  **Du Bois:** Perhaps… perhaps both are needed. The armor and the pulse. The case before the jury, and the confession in the dark.

  **McKay:** As long as the jury knows the confession is not a plea for mercy. It's a statement of fact.

  **Du Bois:** (Nods slowly) Then let us hope the boy knows which one he is writing. Though I suspect, like us, he is trying to write both at once.

  **McKay:** (Raises his glass of water) To the propaganda.

  **Du Bois:** (Clinks his glass) To the truth.
