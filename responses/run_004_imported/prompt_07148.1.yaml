prompt: |-
  so we're doing the "does anyone actually deserve blame or credit" unit in my Free Will & Moral Responsibility seminar rn, and this week's reading was Galen Strawson's Basic Argument - the one where he argues that to be truly, ultimately responsible for an action you'd have to be responsible for the way you are (mentally speaking), which means you'd have had to choose your own character at some earlier point, but that choice would itself have been made by you-as-you-were-then, so you just get pushed back into an infinite regress, and since the regress can't ever bottom out in something you're responsible for, "luck swallows everything" and nobody is ever truly responsible for anything - determinism or no determinism.

  My professor mentioned in passing that this is basically just Nietzsche's causa sui point from Beyond Good and Evil (the bit where wanting to be the cause of yourself - to yank yourself into existence out of nothing, more or less - is treated as like the ultimate self-contradiction) dressed up in analytic-philosophy clothes, and now I can't stop thinking about whether thats actually a fair thing to say. I went back and reread the BGE section and it does seem to gesture at a similar impossibility, but Nietzsche is also doing this whole seperate genealogical move about why we WANT there to be a causa sui in the first place (something about punishment, theologians, resentment) that doesnt seem to be any part of what Strawson's up to.

  Can you actually compare the two properly for me? Like, structurally, is Strawson's regress doing the same philosophical work as Nietzsche's causa sui critique, or are these different arguments that just superficially rhyme - e.g. one being a tight metaphysical/logical argument that's meant to go through whether or not determinism is true, the other being more of a diagnostic move about why the whole free-will-and-blame package is psychologically attractive to us? And if you had to pick, whose version does more damage to the idea that people can be deeply, truly deserving of blame or praise - Strawson's or Nietzsche's? I've got a short response paper due on this and want to actually understand the relationship instead of just repeating my professor's one-liner.
