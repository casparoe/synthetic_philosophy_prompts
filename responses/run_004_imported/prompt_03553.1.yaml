      *   *Edgington/Barnett:* Suppositionalism. Conditionals aren't descriptions of the world; they are tools for navigating it.
      *   *Consensus:* Most philosophers of language accept Lewis's result as a strong reason to reject the idea that indicatives express standard truth-conditional propositions.
      *   *Nuance:* Some try to save propositions by restricting the thesis (not for *all* P) or changing the logic (tri-valued logic). But the "non-propositional" view is the dominant takeaway.

