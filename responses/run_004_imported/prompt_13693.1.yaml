answer: |-
  This is an excellent question that cuts to the core of what makes Updateless Decision Theory (UDT) distinct from standard Bayesian decision theory. You have correctly identified that an updateless agent's *behavior* still depends on its observations. If it didn't, it would be a blind agent, not a rational one.

  The confusion arises from conflating **updating beliefs** (changing your probability distribution over worlds) with **conditioning actions** (selecting a branch of a pre-committed policy).

  Here is the substantive difference between "updating then choosing" and "choosing a policy updatelessly," why it isn't just relabeling, and why the math actually differs.

  ### 1. The Mathematical Distinction

  The difference is visible in the objective function being maximized.

  **The Updateful Agent (CDT/EDT):**
  When an updateful agent sees an observation $o$, it performs Bayesian conditionalization on its world-model. It discards all worlds incompatible with $o$ (or weights them to zero) and maximizes expected utility relative to the *posterior*.
  $$ \text{Action} = \arg\max_a \sum_{w} P(w \mid o) \cdot U(w, a) $$
  In Counterfactual Mugging, once you see Tails, $P(\text{Heads} \mid \text{Tails}) = 0$. The term where Omega pays you vanishes from the equation. You only see the cost of paying.

  **The Updateless Agent (UDT):**
  An updateless agent does not update its probability distribution $P(w)$. It keeps the prior fixed. Instead, it optimizes a **policy** $\pi$, which is a mapping from observations to actions ($\pi: o \to a$). It chooses the policy that maximizes expected utility over the *prior*, then executes the action dictated by that policy for the current observation.
  $$ \text{Policy} = \arg\max_{\pi} \sum_{w} P(w) \cdot U(w, \pi(o(w))) $$
  $$ \text{Action} = \pi(o) $$
  In Counterfactual Mugging, even when you see Tails, you evaluate the utility of your action using the *prior* probability (50% Heads, 50% Tails). You recognize that your decision *now* (in the Tails branch) is logically tied to what you *would have done* in the Heads branch.

  ### 2. Is it just "Pre-computed Conditionalization"?

  You asked if this is just "ordinary Bayesian conditionalization performed in advance." The answer is **no**, because standard Bayesian conditionalization is inherently local to the current world-state.

  If you try to simulate UDT by "pre-computing" a plan using standard decision theory, you run into the problem of **dynamic inconsistency**.
  1.  **Ex-ante (before coin flip):** A standard agent calculates: "If I pre-commit to paying on Tails, my EV is positive. I should pre-commit."
  2.  **Ex-post (after seeing Tails):** The standard agent updates. It now says: "The Heads world is impossible. The pre-commitment is a sunk cost. Paying yields negative utility. I will not pay."

  A standard agent *wants* to be updateless ex-ante but *cannot* be updateless ex-post without an external enforcement mechanism (like a contract). UDT builds the enforcement mechanism into the definition of rationality itself. It treats the agent as a mathematical function that exists across all possible worlds, not as a localized consciousness that only exists in the actual world.

  So, it isn't relabeling. It is a change in the **domain of optimization**:
  *   **Updateful:** Optimizes an **action** given a **posterior**.
  *   **Updateless:** Optimizes a **function** given a **prior**.

  ### 3. The Role of the Observation

  You noted: *"The policy an updateless agent settles on still assigns a different action depending on whether it learns the coin came up heads or tails, so its behavior obviously tracks what it observes."*

  This is correct, but the *causal role* of the observation is different.

  *   **For the Updateful Agent:** The observation is **ontological news**. It tells the agent which world is real. It deletes the other branches of the multiverse from consideration. The observation changes what matters.
  *   **For the Updateless Agent:** The observation is an **indexical pointer**. It tells the agent *where* it is within the prior distribution so it knows which part of the policy to execute. The observation does not change what matters; the prior still dictates that the Heads branch matters, even if the agent currently finds itself in the Tails branch.

  Think of it like a computer program.
  *   **Updateful:** You are editing the code *while* it is running based on the input.
  *   **Updateless:** You wrote the code beforehand to handle all possible inputs. When the input arrives, you don't rewrite the code; you just let the `if/else` statement run.

  The "updatelessness" refers to the fact that you never rewrite the code (update the probability distribution/objective) after seeing the input. You just follow the logic flow.

  ### 4. Why This Is Substantive: Logical Counterfactuals

  The reason this distinction matters substantively (beyond philosophical preference) is **Logical Uncertainty** and **Acausal Trade**.

  In problems like Newcomb's Problem or Parfit's Hitchhiker, your decision is correlated with an outcome because a predictor (Omega) simulated you.
  *   **Updateful:** "I am in the box with the money (or I am in the city). Omega has already predicted. My choice cannot change the past/simulation. I two-box / don't pay."
  *   **Updateless:** "My decision procedure is the same mathematical object that Omega simulated. If I choose to one-box, the simulation one-boxes, and the money is there. I optimize the output of the mathematical object across all instantiations."

  If UDT were just "conditionalization in advance," it would fail to capture the idea that your current decision *controls* the output of the predictor's simulation via logical identity. Updateful agents treat the simulation as a separate event that has already happened. Updateless agents treat the simulation and the reality as two outputs of the same function $\pi$.

  ### 5. Summary: Belief vs. Policy

  To answer your specific question: *"Is there a substantive difference between updating one's beliefs and updating one's policy?"*

  **Yes.**
  *   **Updating Beliefs:** Changes the weights in your expected utility sum. It effectively says, "These worlds are no longer real, so their utility doesn't count."
  *   **Updating Policy (UDT):** Keeps the weights fixed. It says, "These worlds are still relevant to the optimality of my decision rule, even if I am not currently in them."

  UDT is not "conditionalization performed in advance." It is **optimization over strategies rather than actions**.

  *   **Standard Theory:** Rationality is about making the best move given the current board state.
  *   **UDT:** Rationality is about being the kind of player who would have made the best moves across all possible board states, such that you are the kind of player who gets invited to the tournament in the first place.

  The "updateless" label is slightly unfortunate; "Global Policy Optimization" might be more accurate. But the substance is real: it prevents the agent from discarding counterfactual branches that are logically necessary to justify the agent's existence or payoff in the actual branch.
