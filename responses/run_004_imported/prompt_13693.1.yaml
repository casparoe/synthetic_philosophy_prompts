prompt: |-
  I've read enough Less Wrong and adjacent blogs that the basic pitch of updateless decision theory feels familiar, but one part of it has never sat right with me. In cases like counterfactual mugging, an agent that conditionalizes on new evidence and maximizes expected utility relative to the resulting posterior ends up refusing to pay Omega once it has learned that the coin came up tails, since paying can no longer benefit it; UDT is supposed to avoid this by having the agent evaluate its entire policy against its original, unconditional prior instead. But the policy an updateless agent settles on still assigns a different action depending on whether it learns the coin came up heads or tails, so its behavior obviously tracks what it observes. In what sense, then, has it avoided updating on that observation, rather than simply updating on it and calling the result a "policy" instead of a posterior-guided choice? Is there a substantive difference between updating one's beliefs and updating one's policy, or does "updatelessness" just amount to ordinary Bayesian conditionalization performed in advance and relabeled?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is familiar with Less Wrong, decision theory (DT), specifically Updateless Decision Theory (UDT), and the Counterfactual Mugging problem.
      *   **Core Confusion:** The user understands the *motivation* for UDT (avoiding dynamic inconsistency in cases like Counterfactual Mugging) but is skeptical about the *mechanism*.
      *   **The Specific Objection:** UDT agents still act differently based on observations (e.g., pay if tails, don't pay if heads in some variants, or just pay if tails in the standard version). So, they *seem* to update on the observation.
      *   **The Question:** Is there a substantive difference between "updating beliefs then choosing" vs. "choosing a policy based on priors"? Is "updatelessness" just pre-computed Bayesian conditionalization relabeled?

  2.  **Deconstruct the Problem:**
      *   **CDT/EDT (Causal/Evidential Decision Theory):** These are "updateful." They take the current state (including observations) as given, update probabilities, and maximize expected utility *from this point forward*.
      *   **UDT (Updateless Decision Theory):** This is "updateless." It selects a mapping from observations to actions (a policy) *before* seeing the observation, based on the prior, to maximize expected utility over all possible branches.
      *   **The Crux:** The user sees the input-output behavior (Observation $\to$ Action) and says, "That looks like updating." The distinction lies in *what is being optimized* and *when the commitment happens*.

  3.  **Identify the Key Distinctions:**
      *   **Optimization Target:**
          *   Updateful: Maximize $E[U | \text{current observation}]$.
          *   Updateless: Maximize $E[U]$ (over the whole prior) by choosing a function $f(\text{observation}) \to \text{action}$.
      *   **Counterfactual Reasoning:**
          *   Updateful: "Given I see Tails, paying helps me *now*? No. So don't pay." (Ignores the Heads branch where the decision rule mattered).
          *   Updateless: "If my policy was 'Pay if Tails', would I have expected more utility *ex-ante*? Yes. So I follow that policy even though I see Tails."
      *   **Logical/Counterfactual Dependence:** UDT relies heavily on the idea that your decision *now* is logically linked to your decision in the counterfactual world (where the coin came up Heads). Updateful agents treat the current world as the only reality.

  4.  **Address the "Relabeling" Charge:**
      *   Is it just pre-computed conditionalization?
      *   *No.* Standard Bayesian conditionalization updates the *probability distribution* over worlds. UDT keeps the prior distribution over worlds fixed and optimizes a *strategy* across those worlds.
      *   *Analogy:* Writing a program before running it vs. editing the code while it's running based on input.
      *   *Mathematical difference:*
          *   Updateful: $\arg\max_a \sum_w P(w|obs) U(w, a)$
          *   Updateless: $\arg\max_{\pi} \sum_w P(w) U(w, \pi(obs(w)))$
      *   The difference is the scope of the summation and the object being optimized (action vs. policy).

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by confirming this is a very common and insightful confusion. It cuts to the heart of what "updatelessness" means.
      *   *Clarify the Terminology:* Distinguish between "updating beliefs" (probability distribution) and "updating the decision criterion" (objective function). UDT doesn't update beliefs (it keeps the prior), but it *does* condition its *action* on observations via the policy.
      *   *The Mathematical Core:* Show the equations. This is the most precise way to show the difference.
          *   Updateful: Maximize conditional expectation.
          *   Updateless: Maximize unconditional expectation of a policy.
      *   *The "Why it Matters" (Substantive Difference):*
          *   Dynamic Inconsistency. Updateful agents change their mind in ways they would have pre-commitment regretted. UDT agents are dynamically consistent.
          *   Counterfactuals. Updateful agents treat counterfactual branches as "gone." UDT agents treat them as relevant to the *validity* of the current decision.
      *   *Address the "Relabeling" Claim:* It's not just relabeling. It's a change in the *domain of optimization*. It's the difference between choosing a move in a game vs. choosing a strategy for the whole game.
      *   *Use the Counterfactual Mugging Example:* Walk through the math specifically for this case.
          *   Prior: 50% Heads, 50% Tails.
          *   Pay cost 10, Gain 100 in Heads world if policy is "Pay on Tails".
          *   Updateful (at Tails): $P(Heads|Tails) = 0$. Benefit = 0. Cost = 10. Don't pay.
          *   Updateless: Evaluate policy "Pay if Tails". Expected Value = $0.5 \times (-10) + 0.5 \times (100) = 45$. Positive. Pay.
      *   *Refine the "Observation" point:* The user is right that behavior tracks observation. But the *reason* it tracks observation is different.
          *   Updateful: "I see Tails, so I am in the Tails world."
          *   Updateless: "I see Tails, so I execute the 'Tails' clause of the policy I selected to maximize global utility."
      *   *Mention Logical Uncertainty/Functional Decision Theory (FDT):* UDT evolved into FDT. This might help contextualize. The key is logical correlation between your decision and Omega's prediction.
      *   *Conclusion:* Summarize. It's about *control* over counterfactuals vs. *reaction* to reality.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, does UDT actually keep the prior fixed?* Yes, that's the definition. It conditions the *action* on the observation, not the *probability* on the observation.
      *   *Is it just "pre-commitment"?* Essentially, yes, but UDT formalizes pre-commitment as the *definition* of rationality, not just a tool. It solves the problem of who commits the agent (the agent commits itself via its source code).
      *   *Make sure not to get too bogged down in FDT.* Keep focus on UDT as requested, but acknowledge the lineage.
      *   *Tone:* Respectful, analytical, philosophical but grounded in math.

  7.  **Final Polish:** Organize into clear sections: The Intuition, The Math, The Substantive Difference, and The "Relabeling" Rebuttal. (This matches the structure of the thought process). Ensure the distinction between $P(World)$ and $\pi(Observation)$ is clear.

  **(Self-Correction during drafting):** I need to be careful not to imply UDT agents *ignore* observations. They use them as indexicals to select which part of the policy to execute. The "updateless" part refers to the *probability distribution* used for the expectation calculation, not the input to the policy function. I must make this distinction crystal clear.

