      3.  Explain the "Collider" risk (Birth Weight example is perfect).
      4.  Explain the "Mediator" risk (Wage gap example).
      5.  Offer a refined heuristic: "Trust the breakdown that controls for *pre-existing* differences, not *resulting* ones."

  8.  **Finalizing the Output Structure:**
