  9.  (Final check of the "Rule"): "Trust the disaggregated data *only if* the subgroups represent comparable conditions prior to the outcome." -> "Compare like with like, but don't filter by consequences."

      Let's go with: **"Trust the breakdown that equalizes the starting line, not the one that filters by the finish."** (Maybe too metaphorical).
      How about: **"Trust the subgroup that controls for confounding factors, but beware of subgroups defined by outcomes."**

