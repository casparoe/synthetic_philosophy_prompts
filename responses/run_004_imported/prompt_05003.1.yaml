answer: |-
  It is a pleasure to speak with someone who has actually spent a life at the bench. There is a particular kind of epistemic humility that comes from thirty-five years of running a lab—you know that the map is not the territory, and that a peak on a chromatogram is not the molecule itself. That intuition puts you ahead of many philosophy graduates who treat "reference" as a purely linguistic game.

  You are right to be suspicious of the stock examples. When you see "Hesperus is Phosphorus" for the hundredth time, it starts to feel like a logic puzzle rather than a description of how we actually learn about the world. Since you asked for something from the history of science that avoids the usual suspects, I want to take you back to the radiochemistry labs of the early 20th century.

  ### The Example: "Ionium is Thorium"

  **The Historical Context**
  In the first decade of the 1900s, radiochemists like Bertram Boltwood were separating decay products from uranium ores. Boltwood isolated a substance that was intensely radioactive, with a half-life of about 80,000 years. He named it **Ionium**. Chemically, it behaved exactly like **Thorium**. It precipitated with thorium salts, it couldn't be separated from thorium by any known chemical fractionation, and it occupied the same place in the periodic table.

  However, because its radioactive properties (half-life, emission type) were distinct from the known thorium of the day (Thorium-232), it was cataloged and referred to as a distinct substance. For nearly a decade, "Ionium" and "Thorium" were treated as two different entries in the ledger.

  The identity statement arrived with Frederick Soddy's formulation of the **Isotopic Displacement Law (1913)**. The discovery was this: **Ionium is Thorium** (specifically, Ionium is the isotope Thorium-230).

  ### The Fregean Analysis

  Let's put on Frege's spectacles and look at this identity statement: *"Ionium is Thorium."*

  **1. The Reference (*Bedeutung*)**
  For Frege, the reference is the actual object in the world. In this case, the reference is the specific atomic species (the nuclide Th-230) sitting in the vial. Crucially, on the modern understanding (post-Soddy), the reference of "Thorium" (as an element) encompasses Th-230. So, both names latch onto the same physical stuff.

  **2. The Sense (*Sinn*)**
  This is where the work gets done. The "Sense" is the mode of presentation—how the object is given to the scientist.
  *   **Sense of "Ionium":** "The radioactive substance isolated from uranium ore with an 80,000-year half-life that decays into Radium." This is a *radiochemical* mode of presentation. It defines the object by its decay behavior and origin.
  *   **Sense of "Thorium":** "The element with atomic number 90, chemically inseparable from the standard thorium salts." This is a *chemical/periodic* mode of presentation. It defines the object by its valence, precipitation behavior, and place in the table.

  **3. Why it is Informative**
  If Frege is right, the statement is informative because it equates two different *Senses*.
  If you were a chemist in 1905, you could grasp the Sense of "Ionium" (you can measure the half-life) and grasp the Sense of "Thorium" (you can run a precipitation test) without realizing they picked out the same object. The cognitive value lies in bridging the gap between the *radioactive behavior* and the *chemical behavior*.
  The discovery wasn't linguistic; it was empirical. It required realizing that chemical identity (electron structure) and nuclear identity (neutron count) could come apart. The equation "Ionium = Thorium" conveyed new knowledge about the structure of matter, not just about the words.

  ### Does This Trouble Frege? (The Critical Evaluation)

  Here is where we need to be honest, especially given your background. While Frege's Sense/Reference distinction explains *why* the statement is informative, this specific example exposes a crack in the foundation of his theory when compared to the later causal-historical view (Kripke).

  **The Problem of Error and Ontology**
  Frege suggests that the Sense determines the Reference. You follow the "mode of presentation" like a set of instructions, and if the object fits the instructions, that's your reference.

  But consider the chemists in 1907. They believed Ionium was a *new element*. Their "Sense" of Ionium included the description *"a chemically distinct element from Thorium."*
  *   **Frege's Difficulty:** If the Sense includes the condition "is a distinct element," and Ionium is *not* a distinct element, then strictly speaking, the Sense fails to pick out Thorium. It picks out nothing (or a non-existent object). For Frege, if the descriptive content is false, reference often fails (think of "The present King of France").
  *   **The Reality:** Yet, Boltwood *was* referring to Thorium-230. He had a vial of it. He was measuring its properties. He was talking about the very thing Soddy later identified.

  **The Kripkean Contrast**
  Saul Kripke, in *Naming and Necessity*, would argue that "Ionium" was a **rigid designator** fixed by an initial baptism (Boltwood isolating the substance). The causal chain of usage passed the name "Ionium" from lab to lab, pointing at *that stuff in the vial*, regardless of whether the scientists had false beliefs about its elemental status.
  *   For Kripke, the description ("new element") was not the *meaning* of the name, but merely a way of fixing the reference initially.
  *   This explains why the identity "Ionium is Thorium" was a discovery rather than a contradiction. The scientists were wrong about the *description* (Sense), but right about the *reference* (the actual nuclide).

  **Where Frege Creaks**
  In analytical chemistry, we often deal with "unknowns." We might label a peak "Compound X" based on a retention time (Sense 1). Later, we identify it via Mass Spec as "Caffeine" (Sense 2).
  If our initial retention time data was slightly off (experimental error), Frege's theory struggles. If the Sense is "The thing at retention time 5.02 mins," and the actual Caffeine is at 5.05 mins, did we refer to Caffeine?
  *   **Frege:** Technically, no. The Sense didn't match.
  *   **Kripke/Practice:** Yes, of course we did. We were causally connected to the Caffeine, even if our descriptive data was noisy.

  ### The Verdict

  Your intuition that you might have just "memorized the stock answer" is a good one. Frege's Sense/Reference distinction is the best tool we have for explaining the *cognitive difference* between "Ionium" and "Thorium" (why the discovery felt like work). It captures the difference between measuring a half-life and running a precipitation test.

  However, as a retired lab manager, your instinct should align more with Kripke on the *metaphysics* of the reference. In the lab, reference is grounded in causal contact with the sample, not just the descriptive file folder you keep on it. Frege treats the "Sense" as a mediating filter; but in science, we often find that our filters (theories/descriptions) are wrong, yet we are still successfully talking about the world.

  "Ionium is Thorium" is informative because the *modes of access* (radioactivity vs. chemistry) were distinct (Frege wins here). But the statement is *true* even though the early descriptions of Ionium were theoretically flawed (Kripke wins here).

  It is a rare puzzle where you need Frege to explain the *epistemology* (how we know it) and Kripke to explain the *semantics* (how the name hooks to the world). Given your career, I suspect you'll find the Kripkean account of "reference despite error" feels more like the actual experience of running a lab, even if Frege's "Sense" better captures the feeling of the "Aha!" moment when the two data sets finally merged.
