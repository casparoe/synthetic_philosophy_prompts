  **Psychiatric advance directive:** This is the purest example because a rational current self explicitly restricts the choices of their own future incapacitated self to prevent harm.
  **Alcoholic giving their car keys to a friend before a party:** This matches Odysseus almost exactly as it involves physically removing the ability to act on a foreseeable future impulse.
  **Prenup:** This is a strong match for binding future emotional selves to a rational past agreement, though it involves two parties rather than just one person binding themselves.
  **New Year's resolution you post publicly on Facebook:** This relies on social reputation as a constraint rather than physical inability, making it a softer but still voluntary form of self-binding.
  **Country's constitution being hard to amend:** This is a collective version of the pact where past generations bind future ones, which fits the structure but lacks the single-agent psychology you pointed out.
  **Central bank independence from elected officials:** Like the constitution, this is an institutional precommitment to resist short-term political temptation, making it a metaphorical rather than literal Ulysses contract.
  **Debt ceiling law:** This is intended to be legislative self-binding against future spending impulses, though it is often less stable than a constitution.
  **Mandatory "cooling off" period before you can finalize a divorce:** This achieves a similar goal of preventing rash decisions, but it is imposed by the state rather than chosen by the individual, so it is paternalism rather than precommitment.
  **Company's vesting schedule for employee stock:** This is primarily a financial incentive for retention designed by an employer, not a mechanism an individual uses to protect themselves from their own irrationality.
