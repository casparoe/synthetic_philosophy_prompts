answer: |-
  This is an excellent question that cuts to the heart of one of the most difficult tensions in *On Certainty*. You have identified a genuine friction in the text: the apparent conflict between the **normative/social** connotations of "form of life" and the **biological/pre-rational** connotations of "something animal."

  Many commentators stumble here. However, the prevailing consensus among serious Wittgenstein scholars is that these are not two competing pictures, but rather two necessary dimensions of the same insight. To understand how they converge, we need to adjust how we read "form of life" in this specific context and look at what Wittgenstein means by "animal."

  Here is a breakdown of how to reconcile §§358–359 and what this implies for the ontological status of hinges.

  ### 1. Re-evaluating "Form of Life"
  Your intuition is standard: in the *Philosophical Investigations* (PI), "form of life" (*Lebensform*) often refers to the shared cultural practices and language-games that make agreement possible. It sounds sociological.

  However, Wittgenstein explicitly links "form of life" to **natural history**. In PI §25, he notes that commanding, questioning, and recounting are "as much part of our natural history as walking, eating, drinking, playing." For Wittgenstein, the "social" does not float above the "biological." Our language games are rooted in the fact that we are human organisms with specific reactive capacities.

  When Wittgenstein calls certainty a "form of life" in §358, he is not saying it is a cultural convention we could have voted otherwise on. He is saying it is the **bedrock of our shared human existence**. It is "given." It is not justified because it is the background against which justification takes place.

  ### 2. Decoding "Something Animal"
  When Wittgenstein says certainty is "something animal" in §359, he is not reducing it to a mere reflex (like a knee jerk). Rather, he is contrasting it with the **intellectual**.

  *   **Intellectual:** Involves weighing evidence, considering alternatives, and reasoning.
  *   **Animal:** Involves unreflective action, instinct, and training.

  Think of Wittgenstein's discussion of a child learning language (PI §5). The child does not learn the meaning of "slab" by forming a hypothesis or a belief; the child is *trained* (*abgerichtet*—a word with connotations of animal training). The certainty the child acquires is not epistemic; it is practical.

  So, "animal" here means **pre-epistemic**. It designates a mode of engagement with the world that precedes the distinction between true/false or justified/unjustified. It is the certainty of the hand reaching for the door handle, not the certainty of the astronomer calculating an orbit.

  ### 3. The Convergence: Where Social and Animal Meet
  Why does Wittgenstein feel the need to use both terms, and why does he apologize in §358 ("That is very badly expressed")?

  He likely apologizes because "form of life" risks sounding too voluntary or cultural (as if we choose our hinges), while "animal" risks sounding too private or biological (as if my hinges are just my brain states). He needs both to capture the specific nature of hinge certainty:

  1.  **It is shared (Form of Life):** We agree in our hinges not because we compared notes, but because we share a common human nature. If I say "The earth has existed for many years," I am not stating a fact I discovered; I am manifesting my membership in a community of language users.
  2.  **It is unreflective (Animal):** This agreement is not based on reasoning. It is a "blind" obedience to the rules of the language game (PI §219).

  **The Synthesis:** The "animal" is the *mode* of the certainty; the "form of life" is the *context* of the certainty.
  We act with animal certainty *within* a shared form of life. The convergence point is **action**. As Wittgenstein says in OC §110: *"It is not a kind of seeing on our part; it is our acting, which lies at the bottom of the language-game."*

  Our "animal" nature drives us to act; our "form of life" ensures that our actions are intelligible to others. Hinges are the point where our biology meets our sociology in unreflective practice.

  ### 4. Implications for the Status of Hinges (Belief vs. Non-Propositional)
  This brings us to your final question: Does this bear on whether hinges are beliefs or something else? **Yes, significantly.**

  Passages like §§358–359 are the primary textual evidence for the **Non-Propositional (or Enactivist) Reading** of hinge epistemology (championed by scholars like Danièle Moyal-Sharrock).

  *   **The Propositional Reading:** Hinges are beliefs, but they are "entitled" rather than justified (e.g., Crispin Wright). They are cognitive states with content.
  *   **The Non-Propositional Reading:** Hinges are not beliefs at all. They are **ways of acting**.

  If certainty is "animal," it belongs to the realm of *knowing-how* rather than *knowing-that*. You do not "believe" your hands exist in the same way you believe it is raining. You *use* your hands. To treat "I have two hands" as a belief is to intellectualize something that is actually practical.

  **Why §359 supports the Non-Propositional Reading:**
  If hinges were beliefs, they would be candidates for justification. You can ask, "Why do you believe that?" But Wittgenstein says this certainty lies "beyond being justified or unjustified."
  *   Beliefs are epistemic (they aim at truth and can be doubted).
  *   Animal certainties are pragmatic (they aim at functioning and cannot be doubted without paralyzing action).

  By calling it "animal," Wittgenstein suggests that hinges are more like **reflexes of the language-game** than cognitive assents. They are the "scaffolding of our thoughts" (OC §211), not the bricks.

  ### 5. Summary for your Seminar
  To synthesize this for your discussion:

  1.  **No Contradiction:** "Form of life" and "animal" are not opposing categories for Wittgenstein. Human forms of life are grounded in human natural history (biology). The "animal" provides the unreflective drive; the "form of life" provides the shared structure.
  2.  **The "Badly Expressed" Comment:** Wittgenstein likely worries that "form of life" sounds too cultural and "animal" sounds too private. He is struggling to describe something that is **shared but not reasoned**.
  3.  **Ontological Implication:** This passage strongly suggests that hinges are **not beliefs**. They are practical, enacted certainties. They are not things we *hold* in our minds; they are things we *show* in our lives. To treat them as beliefs is to make the category mistake of trying to justify the unjustifiable.

  **A provocative angle for discussion:**
  You might ask your seminar: If hinges are "animal," does this mean skepticism is not just an intellectual error, but a kind of **pathology**? If certainty is a form of life/animal nature, then the skeptic who demands justification for "The world exists" is not playing a deeper game; they are failing to function as a human animal. As Wittgenstein suggests elsewhere, if you doubt too much, you do not get closer to the truth; you cease to be able to act at all.
