          *   *Non-Epistemic/Non-Propositional:* Hinges are ways of acting, not beliefs.
          *   *Stroud/Williams:* Emphasize the social/contextual aspect.
          *   *Moyal-Sharrock:* Emphasizes the "animal" aspect (knowing-how vs. knowing-that).
          *   *Coliva:* Tries to bridge the gap (extended warrant).
      *   *Reconciling "Form of Life" and "Animal":* For Wittgenstein, human *forms of life* include our biological nature. We are not disembodied minds. Our language games rest on natural history. The "animal" isn't *outside* the form of life; it's the substrate of it.

