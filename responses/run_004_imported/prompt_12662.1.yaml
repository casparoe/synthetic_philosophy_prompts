  7.  **Final Review against constraints:**
      *   Face-to-face? Yes.
      *   Feselius sharp? Yes.
      *   Kepler specific (harmonics/geometry)? Yes.
      *   No clear winner? Yes.

  *(Self-Correction Note during drafting)*: I need to be careful not to make Kepler sound like a modern physicist. He believes in *qualities* and *souls*, not forces in the Newtonian sense. The "Earth Soul" is crucial. It's not gravity; it's a perceptive faculty. Feselius should attack this as occult.

