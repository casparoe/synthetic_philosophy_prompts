      *   **The Prediction Problem:**
          *   *Feselius:* Your predictions fail. If the geometry is divine, why is the weather wrong?
          *   *Kepler:* The Earth's "soul" is like a fallible musician. The stimulus is perfect; the response is messy.
      *   **The "Dung Heap" Analogy:**
