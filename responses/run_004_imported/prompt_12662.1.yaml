      *   *Check:* Is Kepler too mystical? *Correction:* Ground him in geometry. He was a mathematician first. He hated the "merchant" astrologers. Emphasize the *Harmonices Mundi* logic before it was fully published.
      *   *Check:* User is a geophysicist. *Correction:* Use terms like "faculty," "stimulus," "resonance," "constructible." Avoid modern physics anachronisms (gravity wasn't defined yet), but hint at action-at-a-distance problems.

  5.  **Specific Dialogue Beats:**
      *   Feselius attacks the *Anima Terrae*.
      *   Kepler compares the Earth to an eye or an ear.
      *   Feselius points out that 120 degrees is just a number unless something carries it.
      *   Kepler brings in the musical monochord.
      *   Feselius brings up the failed prediction of the winter of 1603 (or general weather).
      *   Kepler admits the "aspect" is the trigger, but the "weather" is the complex reaction.

  6.  **Final Polish:**
