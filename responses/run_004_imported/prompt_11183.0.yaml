      *   **Conflict:** The user's teammate argues there's no difference between "tracking fraud" and "correlating with a proxy" because it's all just weights and correlations. The user feels intuitively that there *is* a difference (analogy to human intuition).
      *   **Core Question:** Is there a fact of the matter about what a model *represents* vs. what it *correlates* with? Is the teammate right (instrumentalism/behaviorism) or is the user right (representationalism/causality)?

  2.  **Deconstruct the Philosophical/Technical Debate:**
