          *   Predictive Processing (Bayesian Brain). The brain is a prediction machine. The user's brain predicted "Rare Warbler," so it minimized the error between the blurry image and the prediction. The other birder's brain predicted "Common Yellow Warbler" (base rate), so it minimized error there.
          *   This isn't necessarily "hallucination"; it's efficient coding.
      *   **The Ecological/Scientific Angle (The "So What"):**
          *   Trusting the notes. This is crucial.
