      *Refining the Fanaticism Point:* Priya distinguishes between "small credence/infinite stakes" and "moderate credence/finite stakes." This is a standard distinction in the literature (e.g., Beckstead & Thomas vs. standard MEC). Owen's pushback is about the *continuum*. If moderate credence works, why not slightly less? It's a sorites-style worry.

