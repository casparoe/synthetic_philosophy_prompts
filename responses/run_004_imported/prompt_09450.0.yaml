answer: |-
  **Setting:** *A pavilion in the capital of Zhao, circa 300 BCE. The air is thick with humidity and the scent of ink. Two scholars sit across a low lacquer table. On one side sits **Master Ming** (of the School of Names), precise and spare in his movements. On the other sits **Master Shi** (a critic aligned with Mohist pragmatism), broader in stature, with a gaze that suggests he watches the road as much as the text.*

  **Ming:** You have read the slip I sent over?

  **Shi:** I have. "A white horse is not a horse." It is a bold claim, Master Ming. Bold enough to make a lord laugh, or have a minister executed. Which do you intend?

  **Ming:** I intend for the lord to think. Laughter is the enemy of precision. If I say "a white horse is not a horse," I am not denying the animal's existence. I am clarifying the relationship between the name (*ming*) and the actuality (*shi*).

  **Shi:** Then let us clarify. If I point to that white gelding grazing by the gate and ask, "Is that a horse?" what would you say?

  **Ming:** I would say, "That is a white horse."

  **Shi:** And if I pressed you? "Is it, or is it not, a horse?"

  **Ming:** If you press for the *name*, I must say: It is not "horse." It is "white horse." To say it is "horse" is to allow a confusion of terms.

  **Shi:** So, if the border guards stop you and demand a toll for passing a "horse," you will tell them, "I have no horse, I have a white horse," and expect to pass free?

  **Ming:** That is a matter of law, not logic. But strictly speaking, if the law taxes "horses," it taxes the shape of the horse. If I present a white horse, I present shape *and* color. The demand for "horse" is satisfied by a yellow or black horse. The demand for "white horse" is not. Since the satisfaction conditions differ, the names differ. If the names differ, the things named are not identical. Therefore, a white horse is not a horse.

  **Shi:** You move too quickly from "names differ" to "things are not identical." Consider a man. If I seek a "man," a tall man will do. If I seek a "tall man," a short man will not. By your reasoning, because the set of "tall men" is not identical to the set of "men," a tall man is not a man.

  **Ming:** Precisely. "Tall man" specifies height. "Man" specifies only the kind. To conflate the specific with the general is to lose the distinction.

  **Shi:** But this leads to absurdity. If a tall man is not a man, then by extension, a brown dog is not a dog. A sharp sword is not a sword. If I ask my servant to bring me a sword, and he brings a sharp one, have I not received a sword?

  **Ming:** You have received a *sharp sword*.

  **Shi:** But it *is* a sword! You are confusing the *concept* of the thing with the *instance* of the thing. "Horse" names the form of the animal. "White" names the color. When you combine them, you have a horse that is white. You have added a quality to the substance, not removed the substance. To say the white horse is *not* a horse is to deny that the substance remains.

  **Ming:** I do not deny the substance. I deny the identity of the *name*. Listen closely, Master Shi. "Horse" is that by which we name the shape. "White" is that by which we name the color. That which names the color is not that which names the shape. Therefore, "white horse" is not "horse."

  **Shi:** This is the knot you tie and call a jewel. You say "Horse" names the shape. Agreed. "White" names the color. Agreed. But when I have a white horse, I have the shape *and* the color. Does the presence of color destroy the shape? Does painting a statue red make it cease to be a statue?

  **Ming:** It makes it a *red statue*. If I command you, "Bring me a statue," and you bring a red one, you have obeyed. If I command, "Bring me a red statue," and you bring an unpainted one, you have disobeyed. Because the commands are not interchangeable, the objects commanded are not interchangeable in the realm of *ming*.

  **Shi:** In the realm of *ming*, perhaps. But we live in the realm of *shi*—actuality. There is only one animal by the gate. It belongs to the class of horses. It also belongs to the class of white things. It sits at the intersection. You are arguing that because the intersection is not the whole circle, the intersection is not *in* the circle.

  **Ming:** I am arguing that the intersection is not *identical* to the circle. The word "is" (or *fei*, "is not") is where you stumble. When I say "White horse is not horse," I mean "The concept 'white horse' is not equivalent to the concept 'horse'."

  **Shi:** Ah! Now we reach the root. You are using "is not" (*fei*) to mean "is not identical in definition." But in common speech, and in the governance of the state, "is not" means "is not a member of the kind." If I say, "A thief is not a man," do you agree?

  **Ming:** In the Mohist canons, yes. To love a thief is not to love all men. To kill a thief is not to kill a man (in the moral sense). We distinguish the specific role from the general kind.

  **Shi:** But there is a difference between a moral distinction and a biological one. A thief is a man who steals. A white horse is a horse that is white. If you say a white horse is not a horse, you sever the link between the specific and the general entirely. If I say, "I want to buy a horse," and you sell me a white one, have you cheated me?

  **Ming:** If you paid for a "horse" and received a "white horse," you have received more than you asked for. You have received shape and color.

  **Shi:** I have received a horse! You are treating "horse" as if it were a specific object, like "bay horse" or "gelding." But "horse" is a category. A white horse falls under the category. To say it does not is to use names to confuse names, exactly as the Confucians accuse your school. You make language a puzzle box rather than a bridge.

  **Ming:** And you make language a mud puddle. You allow people to slide between general and specific whenever it suits them. If we do not fix the names, how can we know what is true? If "white horse" is simply "horse," then "white" adds nothing to our knowledge. But "white" *does* add something. It restricts. To restrict is to change the scope. If the scope is changed, the term is changed. If the term is changed, it is not the same term.

  **Shi:** The term is not the same, I grant you that. "White horse" is a compound name. "Horse" is a simple name. But the *object* referred to...

  **Ming:** There is no object without a name! We cannot speak of the thing-in-itself. We speak only of the named thing. The named thing "white horse" requires whiteness. The named thing "horse" does not. Since the requirements for the name's application differ, the named things are distinct.

  **Shi:** So you dwell entirely in the world of requirements, of intensions. You ignore the extension. Look out the window. Do you see the animal?

  **Ming:** I see a white horse.

  **Shi:** If that animal dies, do we say "A horse has died"?

  **Ming:** We say "A white horse has died."

  **Shi:** And if all the white horses in the kingdom die, but the black ones live, has the kingdom lost its horses?

  **Ming:** It has lost white horses. It retains horses that are not white.

  **Shi:** So horses remain.

  **Ming:** Yes.

  **Shi:** Then the white horse was a part of the horses. If I burn down the east wing of your house, is the house gone?

  **Ming:** No.

  **Shi:** But the east wing was part of the house. If I say "The east wing is not the house," you agree. But if you say "The east wing is not *of* the house," you lie. Your thesis, "White horse is not horse," sounds like the former, but it functions like the latter. It suggests exclusion from the kind.

  **Ming:** It suggests exclusion from the *identity* of the kind. Consider this: If you seek a horse, a yellow horse comes. If you seek a white horse, a yellow horse does not come. If the yellow horse can answer one call but not the other, then "white horse" and "horse" are not the same call. If they are not the same call, they do not summon the same reality.

  **Shi:** They summon the same reality *plus* a specification. When I call for a "son," any of my sons may come. When I call for "my eldest son," only one comes. Does this mean my eldest son is not my son?

  **Ming:** It means "eldest son" is not identical to "son."

  **Shi:** It means "eldest son" is a *subset* of "son." You are treating the subset as if it were a disjoint set. You are saying the circle of white horses does not overlap the circle of horses.

  **Ming:** I am saying the circle of "white horse" is not the circle of "horse." One contains color; the other excludes it as irrelevant. To treat them as the same is to ignore the color. To ignore the color is to lose the white horse.

  **Shi:** And to insist on the distinction so rigorously is to lose the horse entirely! You have dissected the animal so finely with your definitions that nothing living remains. You have a pile of "shapes" and a pile of "colors," but no horse to ride.

  **Ming:** Better to have no horse to ride than to ride a confusion. If the King cannot distinguish between a promise of "troops" and a promise of "archers," he will lose the war. Precision requires us to say: Archers are not troops in the general sense; they are archers.

  **Shi:** But they *are* troops! That is why they march. Master Ming, here is where we bottom out. You believe language is a mirror of logical categories. I believe language is a tool for social coordination.

  **Ming:** And if the mirror is cracked, the coordination is false.

  **Shi:** And if the tool is too sharp, it cuts the hand that holds it. You argue that because "white horse" has a stricter definition than "horse," it cannot be subsumed under "horse." I argue that because a white horse possesses the essential form of a horse, it *must* be subsumed, regardless of the extra attribute.

  **Ming:** Possession of form is not identity of name.

  **Shi:** But we are humans, not spirits. We use names to point at things, not at other names. If I point to the animal and say "Horse," I am correct. If you correct me and say "No, White Horse," you are being precise, but if you say "No, Not Horse," you are breaking the bridge between us.

  **Ming:** Then the bridge was built on sand. It is better it breaks now. Tell me, Master Shi: If I give you a white horse, and you thank me for the horse, have you acknowledged the truth?

  **Shi:** I have acknowledged the utility.

  **Ming:** And I have acknowledged the logic. We shall not agree.

  **Shi:** No. You see a proposition to be solved. I see a community to be maintained.

  **Ming:** Then let the white horse stand by the gate. You may call it a horse to the toll collector. I shall call it a white horse to the heavens.

  **Shi:** And the toll collector will take your coin regardless of what you call it. That, perhaps, is the only reality that matters.

  **Ming:** *Smiles faintly.* Or perhaps he takes the coin because "coin," like "horse," is also not what it seems.

  **Shi:** *Laughs.* Now you are just playing. Pour the wine, Master Ming. Even if "wine" is not "grain."

  **Ming:** Pour it. Though strictly speaking, I am not drinking.

  **Shi:** Then do not swallow.

  **Ming:** ...I will make an exception for the sake of the throat.
