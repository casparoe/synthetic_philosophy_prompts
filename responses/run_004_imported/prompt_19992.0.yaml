answer: |-
  This is not a random combo at all. In fact, you have stumbled onto one of the most substantive philosophical fault lines in contemporary ethics. You are pitting **Impartial Utilitarianism scaled by Cosmic Time** (Longtermism) against **Humanistic Pragmatism grounded in Epistemic Humility** (Ramsey).

  If Frank Ramsey were dropped into 2024, given a copy of *The Precipice*, and asked to comment on the Longtermist argument, he would **reject the core prioritization claim**, but he would do so using the tools of mathematics and probability theory that he helped invent, not just the poetic humanism of "Epilogue."

  Here is the reconstruction of his argument, followed by an evaluation of whether it defeats Longtermism.

  ### 1. Ramsey's Verdict: The "Human Scale" Objection
  Ramsey would not deny that future people matter. As a utilitarian (heavily influenced by G.E. Moore), he agreed that the good of the whole is the sum of the goods of the parts. However, he would attack the **metric of value** Longtermism uses.

  In "Epilogue," Ramsey writes:
  > *"I have tried to make a picture of the world... in which man is the measure of all things... I do not feel humble before the vastness of the universe."*

  **The Argument:** Longtermism relies on the premise that *magnitude in time/space correlates with magnitude in moral weight.* Ramsey would call this a category error.
  *   **Ramsey's Point:** Value is a human concept. It arises from human consciousness, relationships, and experiences. To say that a trillion potential humans outweigh a billion actual humans because of a mathematical multiplier is to treat "value" as a physical substance like mass or energy. It isn't.
  *   **The "Heavy Man" Analogy:** As you noted, Ramsey jokes that his physical weight doesn't make him more important. He would apply this to time. Just because the future is "heavier" (longer/vaster) doesn't mean it crushes the present. The moral "foreground" must remain the human experience we can actually access.

  ### 2. The Epistemic Objection (The Bayesian Attack)
  This is where Ramsey the Mathematician destroys Ramsey the Poet's opposition. Ramsey is the father of **subjective probability** (Bayesianism). He defined probability in terms of betting odds: *What price would you take on this proposition?*

  Longtermism often relies on **Expected Value (EV) calculations** involving tiny probabilities and astronomical stakes (e.g., "There's a 0.1% chance AI kills everyone, so reducing that by 10% is worth billions of lives").

  **Ramsey's Objection:**
  Ramsey would argue that these probability assignments are **meaningless**.
  *   For a probability to be rational, it must be based on evidence that can update your belief.
  *   Regarding AGI alignment or existential risk 500 years from now, we have no frequency data and no causal models robust enough to assign a non-arbitrary number like "0.1%."
  *   **The "Pascal's Mugging" Problem:** Ramsey would see Longtermism as a sophisticated version of Pascal's Wager. If you allow "infinite/astro-nomical stakes" to dominate your ethics, you become vulnerable to any wild theory that claims huge stakes.
  *   **His Verdict:** *"You cannot multiply a vague conjecture by an imaginary number of people and call it 'Expected Value.' That is not mathematics; it is numerology."*

  ### 3. The "Good" is Robust, Not Speculative
  Ramsey cared deeply about **truth** and **knowledge** as intrinsic goods. In his view, the "good life" involves pursuing truth and friendship.

  **Ramsey's Objection:**
  Longtermism often suggests we might need to sacrifice present liberties or resources to secure a specific *type* of future (e.g., ensuring AI aligns with *our* values).
  *   Ramsey would argue that we cannot know what "the good" looks like for trillions of future beings.
  *   Instead of trying to engineer a specific future outcome (which requires knowledge we don't have), we should focus on **robust goods**: increasing wisdom, reducing suffering now, and fostering the kind of rational discourse that allows future people to solve their own problems.
  *   **The Shift:** He wouldn't fund AI safety research based on x-risk models. He would fund education and institutional resilience, because those are good *regardless* of what the future looks like.

  ---

  ### The Showdown: Does Ramsey's Objection Hold Up?

  Now, let's pit this against Bostrom and Ord. Who wins?

  #### Where Ramsey Wins (The Weakness of Longtermism)
  Ramsey lands a devastating blow on the **epistemic arrogance** of some Longtermist reasoning.
  *   **The Cluelessness Objection:** Longtermism assumes we can predict the consequences of our actions over centuries. Ramsey (and modern critics like Amia Srinivasan) would point out that complex systems are chaotic. Trying to prevent x-risk might inadvertently cause it.
  *   **The Motivation Problem:** Ramsey argues ethics must be actionable for humans. If an ethical theory requires you to ignore your friends and local community to work on abstract policy for people who won't exist for 1,000 years, it might be *mathematically* consistent but *psychologically* unsustainable. Ramsey would say a morality that requires us to cease being human is a failed morality.

  #### Where Longtermism Wins (The Weakness of Ramsey)
  However, Bostrom and Ord have a strong comeback against Ramsey's "Human Scale" argument. It is the **Proximity Bias** rebuttal.
  *   **The Argument:** Ramsey says, "I put my friends in the foreground and the stars in the background." Longtermists ask: "Why?"
  *   If you met a person from 200 years ago, would their suffering matter less than yours? No.
  *   If you meet a person from 200 years in the future (via time travel), would their suffering matter less? No.
  *   **The Comeback:** Distance in *time* is morally irrelevant, just like distance in *space*. Ramsey's "picture of the world" is psychologically comforting, but it might be ethically biased. If we *can* prevent an asteroid strike that kills everyone forever, and it costs us only 10% of global GDP, Ramsey's refusal to prioritize that because "the stars are small in my picture" looks like selfishness disguised as humility.
  *   **The Math:** Even if the probabilities are vague, if the stake is *literally everything* (all future consciousness), even a tiny non-zero probability dominates the calculation. Ramsey's Bayesianism requires updating on evidence, but it doesn't allow you to ignore the magnitude of the loss.

  ### The Synthesis: Where Ramsey Would Actually Land

  Ramsey wouldn't become a pure Longtermist, but he wouldn't be a pure Presentist either. He would likely advocate for what we might call **"Robust Longtermism."**

  He would reject the specific, high-stakes betting on AI alignment or specific existential risk interventions because the probabilities are too undefined (violating his theory of probability). **However**, he would accept that ensuring the *continuation of rational inquiry and human flourishing* is a supreme good.

  **His Practical Advice to your EA Club:**
  1.  **Stop doing the math.** Stop trying to calculate "expected value" of lives saved in the year 3000. You don't have the variables.
  2.  **Focus on Truth and Resilience.** Support institutions that make humanity more wise, more truthful, and more adaptable. This secures the future without pretending we know what the future needs.
  3.  **Keep the Human Foreground.** Do not sacrifice your mental health, your friendships, or your present moral duties for the sake of the abstract future. A burnt-out activist helps no one, present or future.

  ### Conclusion
  Ramsey's objection **holds up** against the *methodology* of Longtermism (the pseudo-precise probability calculations), but it **fails** against the *core moral intuition* (that future people count).

  If I had to bet (Ramsey-style): Ramsey would tell your club that they are right to care about the future, but wrong to think they can calculate it. He would tell them that trying to save the world by ignoring the people in the room is not just unkind, it's irrational—because the "value" they are trying to protect only exists in the minds of people in rooms like that.

  He wouldn't say "Ignore the future." He would say: **"Don't let the shadow of the future make the present invisible. The future is only valuable because it will contain presents just like this one."**
