      *   *Option 3: Leave as is.* (Risky, potentially misleading, violates the spirit of "clearly distinguished," relies on uncertainty).

      *Decision:* Option 1 is the strongest ethical and educational choice for a museum. It respects the visitor's trust and the historical record. It also directly addresses the "partscaster" analogy by accepting its validity regarding value but rejecting its applicability to *historical narrative*.

  3.  **Deconstruct the "Partscaster" Argument:**
