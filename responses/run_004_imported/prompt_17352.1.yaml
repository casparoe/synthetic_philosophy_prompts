answer: |-
  **TO:** Collections Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation re: Apple-1 Provenance & Labeling

  Hi everyone,

  Following the recent assessment by [Collector's Name], we need to finalize our stance on the Apple-1 currently on display. As a reminder, the consensus is that while the board uses period-correct components, it was likely assembled in the early 80s rather than the 1976 garage run.

  We have three options on the table: relabel as a later assembly, remove from display, or maintain the current designation. I am recommending we **relabel the unit as a "Contemporary Period Assembly" and adjust the insured value accordingly.**

  I want to specifically address the "partscaster" argument raised during our last meeting. The point was made that since the physical board hasn't changed—same chips, same schematic, same function—only our *knowledge* has changed, the label and value should remain static.

  This analogy holds up perfectly in the vintage guitar market, where value is driven largely by playability and tone. A '59 Strat replica built from '59 parts sounds and plays like a '59 Strat. In that context, the object's utility is the primary truth.

  However, in a museum context, the object's utility is secondary to its **testimony**. We aren't displaying this board because it boots BASIC; we display it because it bears witness to a specific moment in history (Wozniak's garage, 1976). When we label it an "Original," we are making a claim about its history, not just its materials. If we know that claim is likely false, keeping the label turns the artifact into a prop. The "data" of the object hasn't changed, but the "metadata" (provenance) has, and in archival work, corrupted metadata renders the record unreliable.

  Our collections policy states originals must be "clearly distinguished from replicas." While this isn't a modern fake, it is functionally a contemporary reconstruction. Keeping the original label violates the spirit of that policy and risks our credibility if the new information ever becomes public (which, in this niche, it inevitably will).

  **Recommendation:**
  1.  **Relabel:** Update the placard to reflect the likely early-80s assembly date, highlighting the use of genuine period parts. This preserves the educational value without compromising accuracy.
  2.  **Adjust Value:** Update the insurance appraisal to reflect the market reality of a non-original unit. This is a necessary administrative step to align with the new designation.
  3.  **Keep on Display:** There is no need to remove it. A well-built contemporary assembly is still historically significant regarding the longevity of the Apple-1 design; it just tells a different story.

  This approach maintains public trust, adheres to our policy, and respects the object for what it actually is, rather than what we hoped it was.

  Let's discuss this in next week's vote.

  Thanks,

  [Your Name]
