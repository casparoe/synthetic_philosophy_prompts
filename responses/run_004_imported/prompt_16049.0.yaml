answer: |-
  This is a sophisticated application of teleosemantics to the "ontology of features" debate in mechanistic interpretability. Your team's disagreement mirrors the classic philosophical tension between *structuralists* (who argue that if the causal role is there, the representation is real) and *historicists* (who argue that without the right history, it's just syntax or correlation).

  Here is a comparison of Millikan and Dretske applied to gradient descent, followed by the Swampman analysis.

  ### 1. Extensibility to Gradient Descent: Millikan vs. Dretske

  To determine which theory requires less modification, we must look at the mechanism each philosopher identifies as the source of **normativity** (the difference between *representing* $X$ and merely *correlating* with $X$).

  **Millikan: The Phylogenetic Mismatch**
  Millikan's theory is fundamentally **phylogenetic**. For a state to have content, it must be part of a "producer-consumer" system where the *lineage* of that system was selected for performing a specific function. The "Normal explanation" appeals to the success of *ancestors* of the current trait.
  *   **The Friction:** Neural networks do not reproduce biologically. They do not have ancestors in the evolutionary sense. To apply Millikan, you must metaphorically stretch "reproduction" to mean either (a) the iterative weight updates during training (where the "offspring" weights replace the "parent" weights) or (b) the copying of model checkpoints (versioning).
  *   **The Modification Required:** You must decouple "selection" from biological fitness and re-anchor it to "loss reduction." However, Millikan's ontology relies on the distinction between the *vehicle* (the gene/trait) and the *environment* selecting it. In gradient descent, the "environment" (the loss landscape) is internal to the mathematical object, and the "selection" is deterministic (or stochastic) optimization, not differential survival of copies. This requires significant ontological restructuring to fit Millikan's biological framework.

  **Dretske: The Ontogenetic Fit**
  Dretske's theory (specifically in *Explaining Behavior*) is fundamentally **ontogenetic**. He grounds content in the *learning history* of the individual system. A state represents $X$ if it carries the information that $X$ (reliable correlation) and was *recruited* to cause behavior *because* it carried that information.
  *   **The Fit:** This maps almost isomorphically onto gradient descent.
      *   **Information:** The activation pattern correlates with a feature in the data (mutual information).
      *   **Recruitment:** The optimizer adjusts weights to retain that activation pattern *because* it reduces loss (causes the "behavior" of correct prediction).
      *   **Function:** The loss function establishes the "goal" prior to recruitment.
  *   **The Modification Required:** Minimal. You simply treat the training run as the "lifetime" of the system and the loss function as the "biological need." Dretske explicitly designed his later work to accommodate learning systems, not just evolved ones.

  **Verdict:** **Dretske needs significantly less modification.**
  Gradient descent is a learning algorithm, not a reproductive algorithm. Dretske's appeal to *individual learning history* captures the normative force of training (why *this* direction matters compared to a random one) without requiring the metaphorical leap of treating weight updates as biological reproduction.

  ---

  ### 2. The Swampnetwork Test

  Consider the "Swampnetwork": a model where weights are randomly initialized to exactly match a trained model, with no training history.

  **Dretske's Verdict: No Content**
  For Dretske, correlation is not enough; *recruitment* is necessary. The Swampnetwork's internal states correlate perfectly with features (it behaves identically to the trained model), but these states were not *recruited* for that purpose. They were not retained *because* they correlated; they appeared by chance.
  *   **Result:** The internal states are mere indicators (information-bearing states), not representations. They lack the "function" derived from the history of selection.

  **Millikan's Verdict: No Content**
  For Millikan, content requires a "Normal explanation" based on the history of the *lineage*. The Swampnetwork has no ancestors. It has no history of selection. Even if we treat it as an artifact, its specific configuration was not selected by a designer or a process; it is a "lucky accident."
  *   **Result:** The states have no proper function. They are normatively inert.

  ---

  ### 3. The Asymmetry Revealed

  You asked if this case reveals an asymmetry between the two theories that standard biological examples do not. **Yes, it does.**

  In standard biological cases, **phylogeny (evolution) and ontogeny (learning/development) are coupled.** An organism usually possesses both an evolutionary history (Millikan's condition) and a developmental/learning history (Dretske's condition). Therefore, in biology, Millikan and Dretske usually converge on the same verdicts. A Swampman (biological) is a metaphysical impossibility, so we rarely test the divergence.

  In Artificial Neural Networks, **phylogeny and ontogeny are decoupled.**
  1.  **Standard Trained Network:** Has Ontogeny (Training) but no Phylogeny (Biological lineage).
      *   **Dretske:** Attributes Content (Training = Recruitment).
      *   **Millikan:** Denies Content (No biological lineage), *unless* you heavily modify her theory to accept "technological selection" as reproduction.
  2.  **Swampnetwork:** Has Neither.
      *   **Both:** Deny Content.

  **The Asymmetry:**
  The Swampnetwork case isolates the variable of **History vs. Structure**.
  *   For **Millikan**, the failure of the Swampnetwork is of the *same kind* as the failure of a standard trained network (both lack the requisite *lineage*). The Swampman case does not change her verdict on standard AI; she is already skeptical of it.
  *   For **Dretske**, the Swampnetwork case creates a **divergence** from the standard trained network. He grants content to the trained model (because it has learning history) but denies it to the Swampnetwork (because it lacks learning history).

  **Why this matters for Interpretability:**
  This reveals that Dretske's theory is sensitive to the **process** (gradient descent) that interpretability researchers actually observe and manipulate. Millikan's theory is sensitive to a **lineage** that does not exist in AI.

  The Swampnetwork thought experiment demonstrates that for Dretske, **identical structure does not imply identical content.** This supports your team's skeptics: if you find a "feature direction" in a network, Dretske asks, "Was this direction *selected* for this role, or is it a spurious correlation that just happens to work?"

  In biology, we assume selection happened. In AI, we *know* selection happened (training), but the Swampman case reminds us that **structure without history is semantically empty.** This validates the historicist view: the "meaning" of a feature direction is not intrinsic to the vector space; it is extrinsic, grounded in the trajectory of the loss function during training.

  ### Summary Recommendation
  For your work in interpretability, **Dretske is the more operationalizable framework.**
  1.  It aligns with the ontogenetic nature of training (gradient descent).
  2.  It distinguishes between "features" (recruited representations) and "correlations" (accidental information), which is precisely the disagreement your team is having.
  3.  It survives the Swampman test by correctly identifying that a model without training history has no semantic norms, even if it behaves correctly.

  Millikan requires too much metaphorical stretching regarding "reproduction" to be useful here, whereas Dretske's "recruitment" is essentially a philosophical description of backpropagation.
