answer: |-
  **Title:** The Limits of Parity: Why Evolutionary Debunking Strikes Morality but Spares Mathematics

  **Introduction**

  Sharon Street's evolutionary debunking argument (EDA) poses one of the most significant contemporary challenges to moral realism. By highlighting the tension between the evolutionary genealogy of our normative attitudes and the realist's commitment to mind-independent moral truths, Street argues that the realist is left with an implausible coincidence: why should faculties shaped for survival track independent truth? In response, proponents of the "companions in guilt" (CiG) strategy, most notably Justin Clarke-Doane, contend that if this genealogical critique undermines morality, it must equally undermine mathematics and logic. Since mathematical skepticism is untenable, they argue, the EDA must be rejected or modified to spare morality as well. This essay assesses whether the parity between morality and mathematics is sufficient to defeat Street's argument. While the CiG move successfully exposes the radical implications of a thoroughgoing genealogical skepticism, it ultimately fails to protect moral realism. There exists a principled disanalogy between the two domains regarding modal security and explanatory indispensability. Mathematical beliefs are anchored in the structural constraints of the physical world in a way that moral beliefs are not. Consequently, Street's EDA remains a potent, specific threat to moral realism without collapsing into global skepticism.

  **Street's Challenge and the Coincidence Problem**

  To evaluate the CiG reply, one must first grasp the force of Street's challenge. Street distinguishes between "tracking" and "adaptive" accounts of the correlation between evolutionary pressures and normative beliefs. For the moral realist, moral truths exist independently of our attitudes. However, natural selection shapes evaluative judgments based on their contribution to reproductive fitness, not their truth value. Street argues that the realist must explain why these two independent forces—evolutionary pressure and independent moral truth—align so perfectly. If there is no causal link between the moral truth and the evolutionary pressure (since abstract moral facts do not cause physical events), the alignment appears to be a massive coincidence. Without a "third-factor" explanation that links fitness to truth, the realist's confidence in their moral beliefs is epistemically undermined.

  **The Companions in Guilt Strategy**

  The CiG reply attempts to turn this skepticism back on itself. Clarke-Doane argues that the evolutionary story told about morality applies equally to mathematics. Our ancestors who could distinguish between one predator and two, or who understood basic spatial geometry, possessed a survival advantage. Thus, our basic arithmetical and logical beliefs were also shaped by pressures indifferent to abstract truth. If Platonism is true, mathematical objects are causally inert, just like moral facts. Therefore, if the EDA proves that we cannot trust our moral beliefs because they were not selected for truth, it should prove we cannot trust our mathematical beliefs either.

  The force of this argument relies on the intuition that mathematical skepticism is absurd. We rely on mathematics for everything from engineering to physics; to suggest that $1+1=2$ might be false because it was evolutionarily useful seems to conflate genealogy with justification. If the CiG argument holds, the moral realist can ride the coattails of the mathematical realist: if mathematics survives the EDA, so can morality.

  **The Modal Disanalogy: Necessity and Safety**

  However, the parity between the two domains breaks down when examining the modal status of the relevant truths and the concept of "safety." Clarke-Doane himself emphasizes modal security, arguing that beliefs are justified if they are "safe"—that is, if they could not easily have been false. Here lies the first critical disanalogy. Mathematical truths are necessary truths; they hold in all possible worlds. More importantly, they describe the structural constraints of any physical reality. Evolution operates within a physical world governed by these mathematical structures. It is not merely a happy accident that organisms evolved to track basic arithmetic; it is nearly inevitable. An organism that cannot distinguish between one cliff edge and two, or miscalculates trajectories, will not survive in *any* physical world governed by consistent laws. The truth of mathematics is constitutive of the environment in which selection occurs.

  Moral truths, even if granted necessary status by non-naturalist realists, do not share this constitutive relationship with physical survival. While cooperation may be fitness-enhancing, the specific *truth* of a moral proposition (e.g., "suffering is intrinsically bad") is not required for the physical mechanics of survival. Evolution could have selected for a belief in "suffering is good" if that belief somehow triggered adrenaline responses conducive to survival, without altering the underlying moral truth (assuming realism). In mathematics, getting the belief wrong often leads to immediate physical failure (falling off a cliff). In morality, getting the belief "wrong" (relative to mind-independent truth) might still result in high fitness if the belief fosters group cohesion. Thus, mathematical beliefs enjoy a form of modal safety grounded in physical necessity that moral beliefs lack. The correlation between fitness and mathematical truth is non-accidental because math governs the physics of fitness; the correlation between fitness and moral truth remains accidental because morality does not govern the physics of fitness.

  **Explanatory Indispensability**

  A second, reinforcing disanalogy concerns explanatory indispensability. The Quine-Putnam indispensability argument suggests we are ontologically committed to entities that are indispensable to our best scientific theories. Mathematics is indispensable to physics; we cannot formulate our best empirical theories without quantifying over numbers and sets. This gives us an independent, abductive reason to trust mathematical realism: it plays an ineliminable role in explaining the physical world.

  Moral facts, by contrast, are not indispensable to empirical science. We can explain the evolution of altruism, the psychology of guilt, and the sociology of norms without positing the existence of mind-independent moral truths. The "third-factor" explanations that realists propose (e.g., that survival is good, so evolution tracking survival tracks goodness) often beg the question by assuming the very moral truths they seek to justify. Because mathematics earns its keep in our explanatory web of the physical world, we have a reason to trust its deliverances that transcends its evolutionary genealogy. Moral realism lacks this anchor. The CiG argument fails because it treats mathematics and morality as epistemically isolated domains, whereas mathematics is integrated into our empirical understanding of reality in a way morality is not.

  **Counter-Reply and Rebuttal**

  A proponent of the CiG argument might object that morality is indispensable for *practical* reasoning, even if not for empirical science. Just as we cannot do physics without math, we cannot live human lives without moral norms. However, this confuses practical indispensability with truth-tracking indispensability. The utility of moral beliefs for social cohesion depends on the *acceptance* of the beliefs, not their *truth*. A society could cohere around a false moral ideology (e.g., a caste system believed to be divinely ordained) just as effectively as a true one. In contrast, the utility of mathematical beliefs in engineering depends on their truth; a bridge built on false arithmetic will collapse regardless of how many people believe in the calculations. This distinction restores the asymmetry: mathematical success is truth-sensitive; moral success (in terms of fitness) is often truth-insensitive.

  Furthermore, Clarke-Doane might argue that if we accept modal security, we should grant that moral beliefs are also safe. If moral truths are necessary, they are true in all nearby possible worlds. However, this ignores the *explanatory direction*. In math, the truths explain why the beliefs are successful (the laws of physics dictate the outcome). In morality, the beliefs explain the success (the belief motivates the action), but the truths do not explain the beliefs. The EDA targets this explanatory gap. The CiG move attempts to bridge it by asserting a general reliability of evolved faculties, but it cannot overcome the specific lack of causal or explanatory contact between moral facts and evolutionary pressures.

  **Verdict**

  The "companions in guilt" strategy is a powerful rhetorical device that highlights the radical nature of evolutionary skepticism, but it does not succeed as a philosophical refutation of Street's argument. The parity between mathematics and morality is superficial. While both domains involve abstract objects and evolved cognitive faculties, mathematics is uniquely anchored in the modal and causal structure of the physical world. Mathematical truths constrain the very possibilities of survival, ensuring a non-accidental alignment between fitness and truth. Moral truths, lacking this constitutive role, remain vulnerable to the charge of coincidence.

  Therefore, the verdict is that the CiG argument fails to defeat Street's EDA. There is a principled disanalogy that allows moral realism to be debunked without mathematical realism suffering the same fate. We are justified in retaining confidence in our mathematical beliefs due to their modal safety and explanatory indispensability to science, but the moral realist cannot avail themselves of these same defenses. Street's argument stands: unless the moral realist can provide a plausible third-factor explanation that links fitness to moral truth without circularity, the evolutionary genealogy of our moral beliefs undermines the claim that they track mind-independent reality. The companions are not in guilt; morality stands alone in the dock.
