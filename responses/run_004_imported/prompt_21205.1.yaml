  *(Self-Correction on Concessions)*: Wait, the prompt asks for "which piece of evidence is hardest for their own position to accommodate."
  *   Elena (Duality): Hardest evidence is the *lack of subjective duality* reported by patients (the "unity of phenomenology").
  *   Marcus (Unity/Switch): Hardest evidence is the *simultaneous intermanual conflict* (buttoning/unbuttoning) which exceeds switching speed.

  Let's write it.

  8.  **Final Review against constraints:**
