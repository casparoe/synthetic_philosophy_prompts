          *   Panel: 5 members.
          *   Vote on Premise A (Used): 3-2 Yes.
          *   Vote on Premise B (Knew): 3-2 Yes.
          *   *Note:* The majorities on A and B are *different* people.
          *   Issue-by-Issue (Premise-based) Result: Both premises pass $\rightarrow$ Responsible.
          *   Direct Vote (Conclusion-based) Result: 3-2 Not Responsible (The 3 "No" votes come from different rationales: Yes/No, No/Yes, No/No).
      *   **Task:** Write a memo to the Honor Council Chair (for the panel) recommending a specific resolution for *this* case and suggesting a bylaw amendment for the future.
