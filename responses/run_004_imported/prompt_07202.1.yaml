      *   **Concept:** "Interactive Kinds" vs. "Indifferent Kinds."
      *   **Indifferent Kinds:** Quarks, tigers. They don't care what we call them. Classifying them doesn't change them.
      *   **Interactive Kinds:** People, mental illnesses. When you classify people, they become aware of the classification and may change their behavior/self-concept to align (or resist) it.
      *   **Looping Effect:** Classification -> Awareness -> Behavior Change -> Reclassification.
      *   **Relevance:** Hacking explicitly argued that the *existence* of a looping effect does *not* mean the condition is "fake" or "just social." It means the ontology is dynamic. Autism is a prime example. The label changes the lived experience, but the underlying neurology remains.
