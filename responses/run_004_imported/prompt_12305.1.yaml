          *   **The Subjectivist (de Finetti style):** Believes probability is degrees of belief of an agent. Denies objective probability exists without a specified chance setup or betting context. Sees invariance as just a dressed-up Principle of Indifference. Needs to acknowledge why the invariant answer works physically without conceding objectivity.
      *   **Setting:** Seminar-room whiteboard with the three Bertrand's Paradox diagrams (endpoints, midpoints, distance).
