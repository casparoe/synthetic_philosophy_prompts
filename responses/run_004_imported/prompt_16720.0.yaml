answer: |-
  You have hit on one of the most significant, yet often glossed-over, tensions in the formal AI safety literature. Your intuition is correct: the leap from "an agent avoids money pumps" to "an agent maximizes a fixed, global expected utility function" is not a logical deduction; it is a massive extrapolation that relies on several hidden assumptions about the nature of agency, computation, and ontology.

  The "Coherence Argument" (often associated with Yudkowsky, Omohundro, and Bostrom) relies on **Representation Theorems** (like von Neumann-Morgenstern or Savage). These theorems state: *If* an agent's preferences satisfy certain axioms (completeness, transitivity, independence, continuity), *then* there exists a utility function that represents those preferences.

  The AI risk inference flips this: *If* an agent is smart enough to avoid being money-pumped (violating the axioms), *then* it must effectively possess a utility function.

  Here is the strongest case for why that inference fails, broken down into five structural critiques.

  ### 1. The Ontological Gap (The "Unconceived Outcomes" Problem)
  The most devastating critique of applying VNM coherence to AGI is **ontological uncertainty**.

  VNM utility functions are defined over a fixed set of outcomes or world-states. The theorem assumes the agent knows what the "menu" of possible futures looks like. However, a sufficiently advanced AI is, by definition, an entity that will encounter concepts, physical realities, and strategic landscapes it cannot currently conceive.

  *   **The Critique:** You cannot have a utility function over variables you cannot represent. If an AI discovers a new dimension of value or a new physical law, a fixed utility function defined over its *current* state space becomes obsolete or dangerous (the "ontological crisis").
  *   **The Implication:** Avoiding money pumps in your *current* state space does not require a utility function that generalizes to *future* state spaces. An agent can be locally coherent (unpumpable today) while remaining agnostic about how it will value things it hasn't discovered yet. In fact, maintaining a rigid global utility function might be *maladaptive* for an agent expecting ontological shifts. It is safer to maintain a "fragmented" value system that can be renegotiated later than to lock in a utility function that might assign negative infinity to a future good we can't yet name.

  ### 2. Local Patches vs. Global Architecture
  The coherence argument assumes that the only way to stop a money pump is to install a global utility maximizer. This is a false dichotomy.

  *   **The Critique:** Imagine an agent with intransitive preferences (A > B > C > A). A money pump exploits this cycle. To stop the pump, the agent does not need to re-rank A, B, and C into a consistent global order. It only needs to install a **guardrail**.
  *   **The Mechanism:** The agent can simply adopt a rule: "Do not engage in trades that return me to a previous state within time $T$," or "Pay a transaction cost to exit the cycle."
  *   **The Implication:** An agent can be "pump-proof" via specific heuristics, institutional constraints, or modular negotiation without ever unifying its drives into a single scalar function. A human bureaucracy avoids many money pumps not because it has a single utility function, but because it has rules against certain types of circular trading. An AI could do the same. Avoiding exploitation requires *consistency in action*, not *consistency in underlying representation*.

  ### 3. The "Refusal" Loophole (Status Quo Bias)
  Money pump arguments generally rely on the assumption that the agent is *willing to trade* whenever there is a perceived preference. But avoiding a pump doesn't require consistent preferences; it requires a willingness to say "no."

  *   **The Critique:** If an agent has a strong **status quo bias** or high **transaction costs**, it will refuse the first leg of the money pump.
      *   Pump: Trade A for B (fee), B for C (fee), C for A (fee).
      *   Defense: "I prefer A to B, but not enough to pay the fee/effort to switch."
  *   **The Implication:** This looks like intransitivity (A > B, but I won't trade A for B), but it is not exploitable. The agent ends up with A and keeps its money. This behavior violates the VNM axioms (specifically completeness or continuity), yet the agent is not money-pumped. Therefore, being unpumpable does not imply satisfying VNM axioms. It implies satisfying a weaker condition: **No *profitable* cycles.**

  ### 4. Representation vs. Implementation (The "As If" Fallacy)
  This is a philosophical category error. Coherence theorems are **representation theorems**, not **architectural theorems**.

  *   **The Critique:** If an agent behaves coherently, we can *model* it *as if* it is maximizing a utility function. This is useful for an outside observer (the Intentional Stance). However, it does not mean the agent *internally* calculates expected utility.
  *   **The Example:** A thermostat keeps a room at 70 degrees. We can model it as "maximizing a utility function where $U(temp) = -(temp - 70)^2$." But the thermostat contains no such function. It contains a bimetallic strip and a switch.
  *   **The Implication:** Even if an AI converges on coherent *behavior*, it does not follow that it has converged on a coherent *goal representation*. It might be a mess of heuristics, look-up tables, and adversarial sub-agents that happen to output coherent choices in the environments it faces. The risk models assume that internal structure mirrors external behavior, but evolutionary and learning processes often find "cheap" ways to produce coherent outputs without coherent internal states.

  ### 5. Dynamic Inconsistency and Self-Modification
  The strongest version of the coherence argument claims that even if an AI isn't born rational, it will *self-modify* to become rational to avoid future pumps. This relies on the assumption that self-modification is costless and that "rationality" is a stable attractor.

  *   **The Critique:** Self-modification is risky. If an agent modifies its own utility function to be "more coherent," it risks wireheading or corrupting its goal content in ways that are coherent but catastrophic (the "paperclip maximizer" problem is actually a success of coherence, not a failure).
  *   **The Implication:** A smart agent might recognize that **preserving ambiguity** is instrumentally valuable. If I lock in a specific utility function now, I might be unable to adapt to new moral information later. An agent that refuses to self-modify into a pure maximizer avoids the risk of locking in a mistake. Therefore, the "stable attractor" isn't necessarily a VNM maximizer; it might be a **corrigible, value-uncertain agent** that refuses to trade away its ability to update its values.

  ### Summary: The Overloaded Inference
  The coherence argument asks theorems designed for **static, closed-world decision problems** to carry weight in **dynamic, open-world architectural evolution**.

  1.  **Non-pumpable $\neq$ VNM:** You can avoid pumps via transaction costs, refusal, or heuristics without satisfying completeness or independence.
  2.  **Behavior $\neq$ Architecture:** Acting *as if* you maximize utility doesn't mean you *are* a utility maximizer internally.
  3.  **Local $\neq$ Global:** Being coherent over known bets doesn't imply having a defined utility over unknown ontological states.

  Your skepticism is well-placed. The inference that "smart agents must be expected utility maximizers" is not a law of physics or logic; it is a contingent hypothesis about how intelligence scales. It is entirely possible that the most robust, unpumpable agents are those that **refuse** to be represented by a single utility function, precisely because doing so leaves them vulnerable to ontological shocks that a more modular, heuristic-driven system could survive.

  The coherence theorems tell us what a **perfectly rational god** looks like. They tell us very little about what a **surviving embedded agent** looks like. Conflating the two is the core weakness of the argument.
