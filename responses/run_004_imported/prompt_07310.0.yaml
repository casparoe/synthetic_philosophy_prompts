      *   *Decision:* I need to choose a policy that respects the "aesthetic testimony" concern while acknowledging the practical reality. The strongest philosophical position (and the one that makes for a better memo) is usually that *judgment requires acquaintance*. However, total acquaintance might be impossible for music if you can't read it or don't understand the theory.
      *   *Refined Policy:* "Informed Deference." You can't just copy a number. You must experience the work (listen to the song, look at the art) and then *adjust* the expert's score based on your emotional/intuitive response, or at least sign off on it as a consensus.
      *   *Actually, looking at the prompt's specific constraint:* "whether pure deference should ever be allowed at all."
      *   *Better Policy:* **No Pure Deference.** Every juror must experience the work. However, in scoring, non-experts should weight the expert's technical assessment heavily, but they must submit an independent score based on their *reception* of the work.
