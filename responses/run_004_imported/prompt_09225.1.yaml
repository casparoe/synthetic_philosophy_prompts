answer: |-
  It is a pleasure to meet a colleague from the other side of the epistemic divide. Your intuition is sharp, and your "working rule" from thirty-five years in radio astronomy is actually a much more sophisticated piece of epistemology than you might be giving it credit for.

  To answer your primary question directly: **Yes, your annoying friend is right that the "brainwashing" case sinks the *unrestricted* Reflection Principle.** However, **no, this does not drag the synchronic Dutch Book argument for probabilism down with it.**

  Here is the breakdown of why your intuition was correct about the science, why the philosophical principle needs a "calibration filter," and why the Dutch Book arguments for static coherence remain safe.

  ### 1. The Brainwashing Case and Unrestricted Reflection
  The counter-example your friend raised is a classic in the literature (often associated with David Christensen or the "self-doubt" literature). It demonstrates that **Unrestricted Reflection** is false.

  Unrestricted Reflection says:
  $$P_{now}(A \mid P_{future}(A) = r) = r$$

  The brainwashing case shows that this equality holds only if you regard your future self as an **epistemic authority** on the matter. If you know the change in credence will be caused by noise, bias, coercion, or entropy (brainwashing), you should *not* defer. In fact, if you know your future self will be brainwashed, your current credence in the Moon landing should remain high, even while you are certain your future credence will be low.

  If you followed Unrestricted Reflection here, you would be violating the very norm of responding to evidence. You currently have evidence the landing was real; the "future evidence" (the brainwashing) is known by you *now* to be misleading. To update on it in advance is to double-count the error.

  So, the principle as stated in many introductory texts is indeed too strong. It requires a ceteris paribus clause: *...provided you have no reason to believe your future self is irrational or misinformed relative to your current self.*

  ### 2. Why Your "Working Rule" Worked
  Your intuition that Reflection matched your astronomy work was not wrong, but it relied on a hidden premise that the philosophical formulation often leaves out.

  Your rule was: *"Trust the posterior after the next data release over your current hunch."*

  Notice the phrase **"data release."** In your professional life, a "data release" was not just *any* future event. It was a specific, calibrated process. It implied:
  1.  New evidence (photons hitting the dish).
  2.  A trusted reduction pipeline (calibration, noise subtraction).
  3.  A rational updating procedure (Bayesian inference).

  When you deferred to your future self in the observatory, you were implicitly conditioning on the fact that **your future self would be better informed via a reliable channel.** You were not deferring to a future self who might be drunk, bribed, or brainwashed.

  In philosophical terms, you were operating under **Conditional Reflection** or **New Reflection**. You trusted the future credence *because* you trusted the process connecting "now" to "then." If you had known the next data release was going to be corrupted by a solar flare or a software bug, your working rule would have (and should have) told you to reject that posterior.

  So, your scientific practice was actually more nuanced than the blunt instrument of Unrestricted Reflection. You were treating your future self as an instrument with a known calibration curve. The brainwashing case is simply a case where the instrument calibration is known to be broken.

  ### 3. Does This Sink the Dutch Book Argument?
  This is the crux of your worry. If the Diachronic Dutch Book (which motivates Reflection) fails in the brainwashing case, does the Synchronic Dutch Book (which motivates Probabilism) fail too?

  **The consensus is no.** Here is the distinction:

  **Synchronic Dutch Books (Probabilism):**
  This argument targets your beliefs at a single time slice. If your credences violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), a bookie can construct a set of bets you will accept *now* that guarantee a loss *now* (or regardless of the state of the world).
  *   **Vulnerability:** Logical inconsistency.
  *   **Escape:** None, unless you refuse to bet at all.
  *   **Status:** Generally considered robust. The brainwashing case doesn't touch this because it doesn't involve time or updating.

  **Diachronic Dutch Books (Reflection/Conditionalization):**
  This argument targets your strategy across time. It says if you violate Reflection/Conditionalization, a bookie can bet against you *now* and against your future self *later* to guarantee a loss.
  *   **Vulnerability:** Strategic inconsistency across time.
  *   **Escape:** The "brainwashing" case reveals a hidden premise in this argument: **Agency Persistence.**
  *   **Status:** Contingent on the agent remaining rational.

  In the brainwashing case, the Diachronic Dutch Book fails because the "future you" is no longer playing the same game. The Dutch Book strategy relies on your future self accepting bets based on the new credence. If your future self is brainwashed, they might accept bets that a rational agent wouldn't, or the connection between your current betting strategy and their future actions is severed.

  The failure of the Diachronic Dutch Book in cases of known irrationality doesn't prove that coherence is irrelevant; it proves that **Diachronic coherence presupposes synchronic coherence at every time slice.** If you know you will be incoherent (brainwashed) later, you cannot be held to a norm of coherence *between* now and then.

  ### 4. The Epistemological Upshot for Your Group
  Your reading group has stumbled onto the difference between **Ideal Bayesian Agents** and **Real Embedded Agents**.

  *   **Ideal Agents:** Never forget, never get brainwashed, always update by conditionalization. For them, Reflection holds.
  *   **Real Agents:** Have to model their own future reliability.

  The modern resolution (championed by philosophers like Rachael Briggs and David Christensen) is that Reflection should be replaced or supplemented by a principle of **Trust**. You should defer to your future self only to the extent that you trust them to process evidence rationally.

  In your astronomy work, you had high trust in the pipeline. In the moon landing case, you have zero trust in the cult. The math is the same; the input parameter (trust/calibration) is different.

  ### Summary
  1.  **Your Friend:** Is right that *Unrestricted* Reflection is false. The brainwashing case is a valid counter-example.
  2.  **Your Intuition:** Was right about the *science*. Your working rule implicitly included a "reliability" condition that the abstract principle omitted.
  3.  **The Dutch Book:** The Synchronic argument (for Probabilism) is safe. It relies on logical consistency, not temporal persistence. The Diachronic argument is weaker because it relies on the assumption that you remain a rational agent over time.

  You haven't wasted thirty-five years on a dud intuition; you've just discovered that the philosophical formalization of your intuition was slightly under-calibrated. Tell your reading group that the Reflection Principle needs a "systematic error" term, and you'll all be on the same page.
