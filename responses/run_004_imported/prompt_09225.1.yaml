      *   **Distinguish the Principles:** Separate Unrestricted Reflection from Qualified Reflection (e.g., conditional on rationality, or on learning by conditioning).
      *   **Address the Dutch Book Worry:** Explain why the failure of Diachronic Dutch Books in this specific case doesn't necessarily invalidate Synchronic Dutch Books. The mechanisms are different.
      *   **Reconcile with Astronomy Experience:** Connect the philosophical distinction back to the user's "working rule." The rule worked because the "future data release" implied a specific epistemic process (calibrated instruments, peer review), not just *any* future state.
