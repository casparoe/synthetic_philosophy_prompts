prompt: |-
  So we had a nasty outage at work last week - payments service was down for like 40 minutes. Now my team lead and I keep butting heads over how to write the postmortem. She wants it to boil down to one general rule, like "whenever the load balancer is in state X and theres a cache-miss storm at the same time, the service falls over" - something that'd explain this outage and any future one like it. I think that leaves out everything that actually happened though: the on-call engineer misreading an alert, an unrelated deploy from another team making things worse, and a warning system we'd switched off the week before for totally unrelated reasons. To me the play-by-play of what actually happened IS the explanation, but she keeps saying a pile of coincidences isn't a real explanation unless it boils down to a general rule like that. Who's actually right here, or is this just a matter of taste?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** A 40-minute outage of a payments service.
      *   **Conflict:** The user and their team lead disagree on the structure/focus of the postmortem (post-incident review).
      *   **Team Lead's View:** Wants a single, generalizable rule (e.g., "If Load Balancer State X + Cache Miss Storm -> Service Down"). Believes this explains *this* and *future* similar outages. Sees a list of events as just "coincidences."
      *   **User's View:** Wants a detailed play-by-play (on-call error, unrelated deploy, disabled warning system). Believes the specific sequence of events *is* the explanation.
      *   **Question:** Who is right? Is it a matter of taste?

  2.  **Evaluate the Perspectives (Postmortem Best Practices):**
      *   *Goal of a Postmortem:* To learn, prevent recurrence, and improve system resilience/processes. It is *not* to assign blame (usually) or just document history.
      *   *Team Lead's Approach (General Rule/Root Cause):*
          *   **Pros:** Actionable, systemic, prevents classes of errors, scalable learning.
          *   **Cons:** Can be too abstract, might oversimplify complex socio-technical systems, might miss human factors or process gaps.
          *   **Risk:** "Human Error" is often a symptom, not a root cause. Reducing it to a technical rule might ignore *why* the engineer misread the alert (bad dashboard? fatigue? unclear runbook?).
      *   **User's Approach (Play-by-Play/Timeline):*
          *   **Pros:** Accurate record, captures context, highlights process failures (disabled warnings, cross-team deploys), acknowledges complexity.
          *   **Cons:** Can become a "blame story," might not lead to systemic change if it just looks like "bad luck," hard to generalize.
          *   **Risk:** "A pile of coincidences" (as the lead says) suggests bad luck. If you don't extract principles, you can't engineer against it.

  3.  **Synthesize the "Right" Answer:**
      *   Neither is fully right on their own. A good postmortem needs *both*.
      *   The timeline (User's preference) is necessary evidence.
      *   The generalizable lesson (Lead's preference) is the actionable outcome.
      *   *However*, the Lead's specific example ("LB State X + Cache Miss") sounds too technical/deterministic. It ignores the human/process elements the user mentioned (misread alert, disabled warning, unrelated deploy).
      *   *Crucial Insight:* The user's details (misread alert, disabled warning, unrelated deploy) are actually *systemic* issues, not just "coincidences." They represent process gaps. The Lead is trying to find a technical invariant, but the real root causes might be procedural.

  4.  **Drafting the Advice:**
      *   **Validate Both:** Acknowledge that both have valid points. It's not just taste; it's about the *purpose* of the document.
      *   **Define the Goal:** Remind them what a postmortem is for (prevention, learning).
      *   **Critique the Lead's View:** A single technical rule is often insufficient for complex systems (Normal Accident Theory/Complex Adaptive Systems). It risks oversimplification.
      *   **Critique the User's View:** A timeline without synthesis is just a log. It doesn't tell you *what to change*.
      *   **Propose the Middle Ground (The "Swiss Cheese" Model):**
          *   Include the timeline (User wins here).
          *   Extract *multiple* actionable items, not just one technical rule (Lead wins on actionability, but broadens the scope).
          *   Address the human/process factors (Alert fatigue, change management, feature flags).
      *   **Specific Advice on the Conflict:**
          *   The Lead's example ("LB State X") is probably too narrow.
          *   The User's details are actually root causes of *process*, not just "coincidences."
          *   Suggest a structure: Timeline -> Root Causes (Technical + Process) -> Action Items.

  5.  **Refining the Tone:**
      *   Empathetic (outages are stressful).
      *   Professional (industry standard practices).
      *   Diplomatic (help them resolve the conflict with the lead).

  6.  **Key Concepts to Introduce:**
      *   **Blameless Postmortem:** Focus on systems, not people.
      *   **Root Cause Analysis (RCA):** There is rarely *one* root cause.
      *   **Actionable Items:** The most important part.
      *   **Socio-Technical Systems:** People + Process + Tech.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "compromise." I need to explain *why* the Lead's specific demand for "one general rule" is technically risky in modern DevOps/SRE culture.
      *   *Correction:* I need to validate the User's instinct that the "coincidences" matter. In complex systems, the intersection of failures *is* the cause.
      *   *Action:* Suggest framing the "coincidences" as "contributing factors" that need systemic fixes (e.g., why *could* an unrelated deploy break payments? -> Coupling issue).

  8.  **Final Structure of Response:**
      *   Direct Answer: Neither is fully right; you need a hybrid.
      *   Why the Lead is partially right (Need for generalization/action).
      *   Why the User is partially right (Context matters, "coincidences" are often symptoms).
      *   The Industry Standard (SRE/Blameless approach).
      *   How to resolve the specific disagreement (The "5 Whys" or "Swiss Cheese" model).
      *   Drafting a compromise proposal.

  9.  (Mental Check): Does this answer the specific question? Yes. It addresses who is right and provides a path forward.

  10. *Final thought:* Make sure to emphasize that "one general rule" is often a fallacy in complex distributed systems. The Lead is looking for a deterministic bug, but this sounds like an emergent failure.

