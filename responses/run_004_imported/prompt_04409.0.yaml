answer: |-
  This is one of the sharpest questions in social choice theory. You have correctly identified that the standard "ordinal vs. cardinal" explanation is a massive oversimplification that obscures the actual machinery at work. If cardinality alone were the magic key, Sen's impossibility results for cardinal non-comparable utilities wouldn't hold, but they do.

  Here is the breakdown of where Arrow and Harsanyi actually diverge, which axiom is pulling the weight, and where the "sleight of hand" regarding interpersonal comparability is hiding.

  ### 1. The Setup: Why the Math Looks Different

  To see the divergence, we have to look at the **domain** and the **rationality constraints** on the social planner.

  **Arrow's Impossibility Theorem**
  *   **Input:** A profile of individual preference *orderings* over a set of deterministic outcomes ($X$).
  *   **Output:** A social preference *ordering* over $X$.
  *   **Key Axioms:**
      1.  **Unrestricted Domain:** Any logical set of individual orderings is allowed.
      2.  **Pareto:** If everyone prefers $x$ to $y$, society does too.
      3.  **IIA (Independence of Irrelevant Alternatives):** The social ranking of $x$ and $y$ depends *only* on how individuals rank $x$ and $y$. (It cannot depend on their feelings about $z$).
      4.  **Non-Dictatorship:** No single individual dictates the social ordering.
  *   **Result:** No function satisfies all four.

  **Harsanyi's Aggregation Theorem**
  *   **Input:** A profile of individual **vNM utility functions** over a set of **lotteries** ($L$) involving outcomes $X$.
  *   **Output:** A social **vNM utility function** over $L$.
  *   **Key Axioms:**
      1.  **vNM Rationality (Individuals):** Each individual satisfies Completeness, Transitivity, Continuity, and **Independence** over lotteries.
      2.  **vNM Rationality (Society):** The *Social Welfare Function* itself must satisfy Completeness, Transitivity, Continuity, and **Independence** over lotteries.
      3.  **Pareto (Ex-ante):** If every individual prefers lottery $P$ to lottery $Q$, society must prefer $P$ to $Q$.
  *   **Result:** The social utility function $W$ must be a linear combination of individual utilities: $W = \sum a_i u_i + b$.

  ### 2. The Divergence: It's Not Just Cardinality

  You are right to be suspicious of the "cardinality saves us" narrative. Amartya Sen famously categorized informational bases. He showed that **Cardinal Non-Comparable (CNC)** utilities + Arrow's axioms still leads to impossibility (or dictatorship).

  So, how does Harsanyi escape? He escapes by violating the spirit of Arrow's **IIA**, but he does it by changing the **Domain** and imposing **Social vNM Rationality**.

  **The Real Engine: Lotteries Reveal Intensity**
  Arrow's framework is "informationally thin." If I prefer Apples to Bananas, Arrow knows I like Apples more. He does not know *how much* more. IIA forbids the social planner from looking at any other data to figure out intensity.

  Harsanyi's framework is "informationally rich." Because the domain includes **lotteries**, intensity is revealed through risk attitudes.
  *   If I am indifferent between "Banana for sure" and "50% Apple / 50% Nothing," my utility for Banana is exactly halfway between Apple and Nothing.
  *   This creates a **cardinal scale** that is unique up to positive affine transformation ($au + b$).

  **The Crucial Axiom: Social vNM Independence**
  The specific axiom doing the heavy lifting in Harsanyi is the requirement that **the Social Planner must also satisfy the vNM Independence axiom.**
  *   In Arrow's world, the Social Welfare Function is just a black box mapping orderings to orderings. It doesn't need to be "rational" in the vNM sense.
  *   In Harsanyi's world, we *stipulate* that Society acts like a rational expected-utility maximizer.

  Mathematically, this is what forces the linear form. If $W$ respects the Pareto principle over a domain of lotteries, and $W$ is linear (due to vNM Independence), then $W$ must be a weighted sum of the $u_i$'s. This is essentially a linear algebra result (a variant of the separating hyperplane theorem).

  **Verdict on Escaping Arrow:**
  Mathematically, **yes**, Harsanyi escapes Arrow. He avoids the impossibility result because he is solving a different problem. He enriches the domain (outcomes $\to$ lotteries) and imposes a structural constraint on the social planner (Social vNM Rationality) that Arrow does not. Arrow's IIA is effectively bypassed because the "alternatives" in Harsanyi (lotteries) contain more information than the "alternatives" in Arrow (outcomes).

  ### 3. The Crux: Where is the Sleight of Hand?

  Now we arrive at your main question: Does this give us utilitarianism "for free" without interpersonal comparisons?

  **No.** There are two distinct places where interpersonal comparability is smuggled in.

  #### Sleight of Hand #1: The Indeterminacy of Scales (Unit Comparability)
  Harsanyi's theorem proves that $W = \sum a_i u_i$. However, vNM utility functions are only unique up to **positive affine transformation**.
  *   Person A's utility is $u_A$. It could also be represented as $2u_A + 10$.
  *   Person B's utility is $u_B$. It could also be represented as $0.5u_B - 5$.

  If you sum them ($u_A + u_B$), the result changes completely depending on which representation you pick.
  *   $(2u_A + 10) + (0.5u_B - 5) \neq u_A + u_B$.

  To make the sum meaningful, you must **normalize** the zero points and the units of everyone's utility function. You have to decide that "1 util" for Person A represents the same *magnitude of welfare* as "1 util" for Person B.
  *   **This *is* interpersonal comparability of units.**
  *   Harsanyi often glosses over this by suggesting we can just "measure" utility. But there is no physical utility meter. Deciding that my pain is "equal" to your pleasure is an ethical judgment, not a mathematical derivation.
  *   Without this normalization, the theorem only tells you the *form* of the function (linear), not the *content*. It's like saying "The price of the basket is the sum of the prices of the items." True, but useless unless you agree on the currency.

  #### Sleight of Hand #2: Social vNM Rationality as an Ethical Axiom
  The requirement that the **Social Planner** satisfies vNM Independence is a massive ethical assumption, not a neutral aggregation rule.
  *   vNM Independence implies that the social value of a lottery is the expected value of the outcomes.
  *   This rules out **inequality aversion** in the ex-post distribution.
  *   *Example:* Suppose we have two people.
      *   Lottery 1: Person A gets 100, Person B gets 0 (50% chance); or A gets 0, B gets 100 (50% chance).
      *   Lottery 2: Person A gets 50, Person B gets 50 (100% chance).
  *   An egalitarian might prefer Lottery 2 (sure equality).
  *   Harsanyi's Social vNM Independence forces the planner to be indifferent between these if the expected sum is equal. It forces the planner to care only about the *ex-ante* expected utility, ignoring the *ex-post* distribution of welfare.
  *   By imposing vNM rationality on the *collective*, Harsanyi has already baked in a specific form of utilitarianism (one that is indifferent to risk and inequality) before the aggregation even begins.

  ### 4. Synthesizing the Stance

  Here is the direct answer to your crux:

  **Does Harsanyi escape Arrow's impossibility on its own terms?**
  **Yes, mathematically.** He changes the domain to lotteries and imposes vNM rationality on the social welfare function. This provides enough structure to derive a linear aggregation rule without triggering Arrow's specific impossibility proof. Sen's critique holds for Cardinal Non-Comparable utilities *within Arrow's framework*, but Harsanyi steps outside Arrow's framework by demanding the Social Planner be a vNM agent.

  **Is it relying on smuggled interpersonal comparability?**
  **Yes, absolutely.**
  1.  **Scale Normalization:** To move from "Weighted Sum" to "Utilitarianism," you must fix the units and zeros of individual utility functions relative to one another. The theorem does not do this; it requires an external ethical assumption to calibrate the scales. This is interpersonal comparability of units.
  2.  **Ethical Structure:** By requiring the Social Planner to satisfy vNM axioms, Harsanyi assumes away egalitarian concerns regarding risk and distribution. This is a substantive ethical commitment, not a logical necessity of aggregation.

  **The "Free Lunch" Verdict:**
  The claim that Harsanyi gives you utilitarianism "for free" is false.
  *   **Arrow** says: "You can't aggregate ordinal preferences without being a dictator."
  *   **Harsanyi** says: "If you assume everyone (including society) is a rational gambler, and you assume we can calibrate everyone's utility scales to a common unit, then society must maximize a weighted sum of those utilities."

  Harsanyi doesn't remove the ethical burden; he shifts it. Instead of arguing about how to aggregate rankings (Arrow), you now have to argue about (a) why the social planner should be risk-neutral over lotteries of welfare, and (b) how to justify the conversion rate between Person A's utils and Person B's utils.

  The "door" Harsanyi found isn't a way out of the prison of ethical assumptions; it's just a different room with different bars. The Pareto condition + Social vNM Rationality gets you the *linear form*, but **Interpersonal Comparability** is required to fill in the *coefficients and scales* to make it a actionable moral theory. Without that, you just have a formula with undefined variables.
