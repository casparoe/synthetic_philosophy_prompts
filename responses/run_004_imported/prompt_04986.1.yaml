prompt: |-
  I've long been a reader of the rationalist blogs and forums where precommitment devices are a recurring topic -- Schelling on the strategic value of binding oneself, Beeminder-style commitment contracts for beating akrasia, and so on -- and a recent conversation with some friends about that literature sent me down a path I hadn't expected: noticing that the term "Ulysses contract" is actually used for two quite different things, and wondering whether the comparison between them is as clean as it's usually assumed to be.

  The first is the individual-level use from psychiatric ethics: a patient with a condition like bipolar disorder, while lucid and legally competent, signs an advance directive instructing doctors to have her involuntarily hospitalized and medicated the next time she becomes manic, overriding whatever objections she raises at the time. The second is Jon Elster's well-known extension of the same Odysseus-at-the-mast image to constitutions: bills of rights, supermajority amendment rules, and judicial review as devices that let a polity's more reflective self bind its own future majorities against momentary passion. Elster developed this application across _Ulysses and the Sirens_ and then substantially qualified it in the later _Ulysses Unbound_, growing considerably more doubtful that constitution-makers are really doing anything like what Odysseus did.

  Here is what I can't settle on my own, and what I'd like you to work through carefully rather than gesture at. The standard objection to the psychiatric case is that a manic episode might not be mere irrationality being restrained by a wiser self, but could express something more like a genuine, if unwelcome, shift in what the person values -- making the directive less like Odysseus overruling a temporary delusion and more like one person overruling another. The standard objection to the constitutional case, going back to Jefferson's argument with Madison over whether the dead can bind the living, is that a later generation is not even numerically the same agent as the one that wrote the constraint -- unless, that is, one follows Bruce Ackerman in relocating the relevant agent from a past generation to "the People" acting in its higher, constitution-making capacity, as opposed to its ordinary-politics capacity, a move that starts to look structurally similar to distinguishing a patient's lucid, planning self from her manic, acting self. The question, then, is whether these two objections are really the same worry wearing different vocabulary -- personal identity in one case, popular sovereignty in the other -- such that whatever rescues one case ought to rescue the other, or whether one of the two uses of "Ulysses contract" is resting on much shakier ground than the other for reasons that have nothing to do with the other case at all. I'd like an actual verdict rather than a survey of considerations: which of the two is the more defensible way to bind a future self against its own contemporaneous wishes, and does Elster's retreat between his two books track a genuine asymmetry between the cases, or was he simply being overcautious?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The concept of "Ulysses Contracts" (precommitment devices).
      *   **Two Specific Cases:**
          1.  *Psychiatric Ethics:* A patient binds their future manic self to treatment (Advance Directive).
          2.  *Constitutional Theory:* A polity binds its future majorities/generations via constitutions (Elster's analogy).
      *   **The Conflict/Objection:**
          1.  *Psychiatric:* Is the manic self a *different* valuer? (Value shift vs. irrationality).
          2.  *Constitutional:* Is the future generation a *different* agent? (Dead hand problem vs. "The People").
      *   **The Question:** Are these objections the same worry (personal identity/popular sovereignty) such that saving one saves the other? Or is one case shakier than the other for independent reasons?
      *   **Elster's Trajectory:** From *Ulysses and the Sirens* (optimistic analogy) to *Ulysses Unbound* (skeptical/qualified). Does this track a genuine asymmetry or overcaution?
      *   **Requirement:** An *actual verdict*, not just a survey. Careful reasoning, not gesturing.

  2.  **Initial Analysis & Mapping:**

      *   *The Psychiatric Case:* The core tension is between *competence* and *authenticity*. The lucid self is legally competent. The manic self is often deemed legally incompetent. The objection is that mania might reveal "true" desires (e.g., grandiosity feels good) rather than just cognitive error. However, medical consensus generally treats mania as a pathology impairing judgment, not a value shift.
      *   *The Constitutional Case:* The core tension is between *democratic legitimacy* and *stability*. The founding generation binds the current generation. Jefferson says "the earth belongs to the living." Ackerman says "We the People" act in two modes (constitutional vs. normal). The objection is that the "We" changes over time (demographic shift, cultural shift).
      *   *The Analogy:* Lucid Self = Founders/Constitutional Moment. Manic Self = Current Majority/Normal Politics.
      *   *Elster's Shift:* Elster became skeptical about constitutions being Ulysses contracts because constitution-makers often have *ulterior motives* (entrenching power) rather than purely self-binding against passion. Also, the "self" in politics is fragmented, unlike the individual mind.

  3.  **Evaluating the "Same Worry" Hypothesis:**

      *   *Hypothesis:* Both objections are about Personal Identity (is Future Me = Past Me? is Future People = Past People?).
      *   *Critique:* In the psychiatric case, biological continuity is high. Psychological continuity is the battleground. In the constitutional case, biological continuity is *zero* (new people born, old people die). The "identity" problem is much harder in the constitutional case.
      *   *Conclusion:* They are *not* the same worry. The constitutional case faces a metaphysical and normative hurdle the psychiatric case does not (intergenerational death).

  4.  **Evaluating the "Shakier Ground" Hypothesis:**

      *   *Psychiatric:* We have a medical model of pathology. We can point to neurotransmitters, loss of insight, etc. There is an external standard of "health."
      *   *Constitutional:* There is no external standard of "political health" equivalent to mental health. What looks like "passion" to a founder might look like "justice" to a descendant (e.g., slavery, suffrage).
      *   *Elster's Retreat:* Elster realized that political actors aren't just binding against passion; they are binding against *preferences* they dislike. In psychiatry, the lucid self and manic self usually agree on the *goal* (health/stability), but disagree on the *means/state*. In politics, the founders and the successors often disagree on *ends* (values).
      *   *Conclusion:* The psychiatric case is more defensible because "pathology" is more objectively definable than "political passion."

  5.  **Developing the Verdict:**

      *   *Verdict:* The psychiatric Ulysses contract is significantly more defensible than the constitutional one.
      *   *Reasoning:*
          1.  **Identity Continuity:** The psychiatric case retains biological/psychological continuity. The constitutional case suffers from total turnover of the constituent units (people).
          2.  **Criterion of Deviation:** In psychiatry, we have a clinical baseline (lucidity) vs. a pathological state (mania). In politics, "constitutional moments" vs. "normal politics" is a normative distinction without a clear biological/clinical baseline. One generation's "passion" is another's "progress."
          3.  **Elster's Retreat:** Elster was *not* overcautious. He identified a structural flaw in the political analogy: the lack of a unitary agent. A person has one brain; a polity has millions of competing interests. The "self-binding" in politics is often "group A binding group B."
      *   *Nuance:* Ackerman's "Two-Track Democracy" tries to fix the identity problem, but it fails to solve the *value drift* problem. The psychiatric contract works because the lucid self and manic self share a higher-order desire for stability. The constitutional contract fails because the Founders and the Current Majority often do not share higher-order values (e.g., property rights vs. equality).

  6.  **Drafting the Argument (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. State the verdict clearly upfront.
      *   *Section 1: The Identity Problem.* Contrast biological continuity (psych) vs. generational turnover (const). Ackerman's move is linguistic, not metaphysical.
      *   *Section 2: The Pathology vs. Politics Problem.* Define "irrationality." In psych, it's cognitive impairment. In politics, it's often just preference change. Elster's key insight in *Ulysses Unbound* is about *uncertainty* and *self-interest*.
      *   *Section 3: Elster's Retreat.* Analyze *Ulysses and the Sirens* vs. *Ulysses Unbound*. He moved from "binding passion" to "binding uncertainty/self-interest." This reveals the asymmetry.
      *   *Section 4: The Verdict.* Psychiatric contracts are ethically permissible (with safeguards). Constitutional contracts are metaphorically useful but normatively distinct. They are not the same mechanism.
      *   *Conclusion:* Summarize.

  7.  **Refining the "Verdict":**

      *   I need to be careful not to dismiss constitutionalism entirely, but to dismiss the *Ulysses analogy* for constitutionalism as less robust than for psychiatry.
      *   The prompt asks: "Which of the two is the more defensible way to bind a future self... and does Elster's retreat... track a genuine asymmetry... or was he simply being overcautious?"
      *   *Answer:* Psychiatric is more defensible. Elster's retreat tracks a genuine asymmetry. He was not overcautious.

  8.  **Self-Correction/Edge Case Check:**

      *   *Counter-argument:* What about the "manic creativity" argument? Some argue mania reveals truth.
      *   *Rebuttal:* Even if true, the *risk* of harm (financial ruin, suicide) justifies the precommitment under a harm principle, whereas constitutional precommitment often restricts benign majority will.
      *   *Counter-argument:* What about "We the People" as a continuous entity?
      *   *Rebuttal:* That's a legal fiction. The prompt asks for a philosophical analysis. The fiction doesn't solve the normative weight of binding dead hands on living issues (e.g., gun control, abortion) where the "passion" is disputed.

  9.  **Final Polish:** Ensure the tone matches the user's (highly literate, familiar with rationalist/philosophical discourse). Use specific references (Elster, Ackerman, Jefferson/Madison). Ensure the distinction between *intrapersonal* and *interpersonal* (or intergenerational) binding is clear.

      *(Self-Correction during drafting)*: I need to make sure I address the "value shift" objection in the psychiatric case seriously. If the manic self *truly* values something else, is the contract valid? Yes, because we prioritize the *competent* valuation over the *impaired* valuation, whereas in politics, both generations are arguably "competent." That's the key asymmetry.

  10. **Final Structure:**
      *   Executive Summary/Verdict.
      *   The Identity Asymmetry (Biology vs. Fiction).
      *   The Pathology Asymmetry (Impairment vs. Preference).
      *   Elster's Retreat (Vindicated).
      *   Conclusion.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is the verdict: **The psychiatric Ulysses contract is significantly more defensible than the constitutional one, and Elster's retreat in *Ulysses Unbound* tracks a genuine structural asymmetry between the cases rather than mere overcaution.**

  The two objections you identify—the "value shift" in psychiatry and the "dead hand" in constitutionalism—appear similar on the surface because both invoke problems of diachronic identity. However, they fail to be analogous in the ways that matter for moral justification. The psychiatric case rests on a distinction between *competence* and *pathology* within a single biological organism; the constitutional case rests on a distinction between *higher* and *lower* law across distinct biological organisms. Because the latter lacks the clinical baseline of the former, the constitutional Ulysses contract is not merely a scaled-up version of the psychiatric one; it is a category error that masks interpersonal coercion as intrapersonal binding.

  Here is the detailed working of that verdict.

  ### 1. The Identity Asymmetry: Biological Continuity vs. Legal Fiction

  The standard objection to the constitutional case (Jefferson's "the earth belongs to the living") is metaphysically heavier than the objection to the psychiatric case.

  In the psychiatric case, the agent binding and the agent bound are numerically identical in terms of biological continuity. The worry is about *psychological* continuity (i.e., "Is the manic me still *me*?"). However, we have a robust, albeit imperfect, external standard for resolving this: clinical competence. We can point to neurochemistry, loss of insight, and cognitive impairment to argue that the manic self is operating with a degraded capacity for agency. The lucid self is not just "different"; it is *functional*. The precommitment is defensible because it prioritizes the preferences of the competent agent over the impaired agent.

  In the constitutional case, there is no biological continuity. The "Founders" are dead; the "Current Majority" are alive. Bruce Ackerman's move to distinguish "The People" (constitutional mode) from "the people" (normal politics) is a legal fiction designed to paper over this metaphysical gap. It posits a collective agent that persists through time despite total turnover of its constituent parts. While this works for legal continuity, it fails as a moral justification for binding.

  If the manic patient objects to her medication, we can say, "Your cognitive faculties are currently impaired." If the current generation objects to a constitutional restriction, we cannot say, "Your political faculties are impaired." We can only say, "Your values differ from the dead." The constitutional Ulysses contract therefore collapses into one group of people (the past) binding a *different* group of people (the present). The psychiatric contract binds a self to itself; the constitutional contract binds a predecessor to a successor. This makes the constitutional case inherently shakier because it violates the liberal principle that laws should be self-imposed by those subject to them.

  ### 2. The Pathology Asymmetry: Impairment vs. Preference Drift

  This is where Elster's retreat becomes crucial. In *Ulysses and the Sirens* (1979), Elster treated the constitutional analogy as robust: constitutions protect long-term rationality against short-term passion. By *Ulysses Unbound* (2000), he grew skeptical, noting that constitution-makers are often motivated by self-interest and uncertainty, not just a desire to curb passion.

  This retreat vindicates the asymmetry between the two cases.

  **In Psychiatry:** The distinction between the "lucid self" and the "manic self" tracks a distinction between *rationality* and *irrationality* (or health and pathology). Even if the manic self experiences a "value shift" (e.g., valuing grandiosity over stability), we have independent grounds to treat that shift as a symptom of dysfunction. The goal of the contract is to restore the agent to a baseline of functioning where they can pursue *any* values effectively. The lucid and manic selves usually share a higher-order desire: the patient wants to be well.

  **In Constitutionalism:** There is no equivalent baseline of "political health." What the Founders call "passion" (e.g., demands for labor rights, suffrage expansion, or debt relief), the current generation may call "justice." There is no neutral arbiter to declare the current majority "manic." Consequently, constitutional precommitments often function not to protect the polity from its own irrationality, but to protect specific *substantive values* (property rights, federal structures) from democratic revision.

  When a constitution binds a future majority, it is not necessarily protecting the future majority's "true self" from a temporary delusion; it is often protecting the *past majority's* specific policy preferences from the *future majority's* specific policy preferences. This is not Ulysses binding himself against the Sirens; it is Odysseus tying up the crew.

  ### 3. Why Elster Was Not Overcautious

  Elster's shift from optimism to skepticism was not a loss of nerve; it was a recognition that the "unitary agent" assumption required for a Ulysses contract does not hold in politics.

  *   **Intrapersonal vs. Interpersonal:** A human being has a single nervous system. Conflicts between "selves" are conflicts within a single utility function (albeit with time-inconsistent discounting). A polity is a collection of competing utility functions. A constitution is often the result of a bargain between factions, not a act of self-binding by a unitary "People."
  *   **Uncertainty vs. Risk:** Elster emphasizes that constitution-makers often bind the future under conditions of radical uncertainty (not knowing who will benefit), whereas Ulysses knew exactly what he was avoiding (the Sirens). In psychiatry, the patient knows the specific risk (mania). In constitutionalism, the Founders often encode rules to hedge against outcomes they can't predict, which frequently results in rigidity that harms future generations facing novel problems.

  Elster realized that calling a constitution a "Ulysses contract" smuggles in a normative justification (this is for your own good) that is rarely empirically true. It is often just power entrenchment.

  ### 4. The Verdict

  The objections are **not** the same worry wearing different vocabulary.

  *   The **psychiatric objection** asks: "Is this value shift a pathology or a preference?" We can answer this with medical evidence and a presumption of competence favoring the lucid state.
  *   The **constitutional objection** asks: "Do the dead have sovereignty over the living?" We cannot answer this without invoking a mystical collective agent ("The People") that overrides the actual will of living citizens.

  Therefore, the **psychiatric Ulysses contract is the more defensible mechanism.** It operates within a single locus of agency where a distinction between competence and incompetence can be objectively grounded. It respects the autonomy of the *person* by prioritizing their competent will over their impaired will.

  The constitutional Ulysses contract is less defensible because it operates across distinct loci of agency. It respects the autonomy of the *polity* only by fictionalizing the polity as a single person over time. When it works, it is not because it binds a "future self" against "passion," but because it creates stable coordination points. When it fails, it is not akrasia; it is tyranny of the past.

  Elster's retreat in *Ulysses Unbound* was correct. He recognized that the constitutional case lacks the psychological unity required to make the Ulysses analogy morally coherent. He was not being overcautious; he was acknowledging that while individuals can bind themselves, generations cannot bind their successors in the same way without violating the democratic principle of self-government. The psychiatric case saves the concept of Ulysses contracts; the constitutional case stretches it until it breaks.
