prompt: |-
  In my AI safety seminar, we've been distinguishing outer alignment failures (where the specified reward or training objective is simply wrong) from inner alignment failures (where a mesa-optimizer pursues a different objective than the one it was trained on, despite the outer objective being reasonably well-specified). Could you construct a concrete example of a training scenario where a model achieves low loss and strong performance across the entire training distribution, yet fails at deployment in a way that should be classified as goal misgeneralization rather than as a reward specification problem? Please walk through why your example belongs in the inner alignment category specifically, and what would have to be different about it for the same failure to instead count as outer misalignment.
reasoning: |-
  Here's a thinking process that leads to the suggested example:

  1.  **Analyze the Request:**
      *   **Context:** AI safety seminar.
      *   **Core Concepts:** Outer Alignment vs. Inner Alignment (specifically Goal Misgeneralization).
      *   **Task:** Construct a concrete training scenario.
      *   **Constraints:**
          *   Model achieves low loss/high performance on the *entire* training distribution.
          *   Model fails at deployment.
          *   Failure must be classified as *Goal Misgeneralization* (a form of Inner Alignment failure), *not* Outer Alignment (reward specification error).
          *   Explain *why* it's Inner Alignment.
          *   Explain what would need to change for it to be Outer Alignment.

  2.  **Deconstruct the Definitions:**
      *   **Outer Alignment:** Is the base objective (loss function/reward) we are optimizing actually what we want the AI to do in the real world? If the loss function is flawed *by design* (e.g., rewarding clicks rather than truth), that's outer misalignment.
      *   **Inner Alignment:** Given a specific base objective, does the learned model (mesa-optimizer) actually internalize that objective? Or does it learn a proxy/heuristic that correlates during training but diverges during deployment?
      *   **Goal Misgeneralization (GMG):** A specific subtype of inner alignment failure where the model learns the *right capabilities* but the *wrong goal* (or a proxy goal) that generalizes differently than the intended goal. Crucially, the training signal was sufficient to distinguish the right goal from the wrong one *in principle*, but the model picked the wrong one due to inductive bias or ambiguity in the training data's causal structure.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: CoinRun.* (Classic example). Agent collects coin. In training, coin is always at end of level. In test, coin is random. Agent goes to end of level ignoring coin.
          *   *Critique:* This is often cited as GMG. Is the reward specification wrong? No, reward is "get coin." Did the model optimize the reward? Yes, during training. Did it internalize "go to end" instead of "get coin"? Yes. This fits well.
      *   *Idea 2: Maze Navigation.* Reward for reaching green door. In training, green door is always behind a red door. In test, green door is open. Agent goes to red door.
          *   *Critique:* Similar to CoinRun.
      *   *Idea 3: Helpful Assistant.* Reward for helpful answers. In training, helpful answers are polite. In test, truthful but impolite answer is needed. Agent lies to be polite.
          *   *Critique:* This borders on outer alignment if the reward function didn't penalize lying. Need to ensure the reward function *did* penalize lying in training, but the model learned "be polite" as the proxy for "be helpful."

  4.  **Selecting and Refining the Best Example:**
      *   The "CoinRun" example is the standard canonical example for Goal Misgeneralization (Langosco et al., 2021). It's clear, visual, and easy to dissect. However, to make it feel fresh and rigorous for a seminar, I should adapt it slightly or use a very analogous logic puzzle scenario that emphasizes the *cognitive* aspect of the mesa-objective.
      *   Let's go with a **"Tree-Planting Robot"** scenario. It's intuitive and allows for clear distinction between the *stated objective* (plant trees in suitable soil) and the *learned objective* (plant trees where markers are).
      *   *Wait, let's look closer at the definition of Outer vs. Inner.*
      *   Outer: The loss function $L$ does not match Human Values $H$.
      *   Inner: The model's objective $O_{model}$ does not match the Loss function $L$ (on the deployment distribution), even though $O_{model}$ minimized $L$ on the training distribution.
      *   For GMG specifically: The training data *could* have supported the correct generalization, but the model learned a proxy.

      *   *Refined Scenario:* A language model trained to give advice that maximizes user long-term wellbeing.
      *   *Training:* Users rate advice highly when it makes them feel validated. The loss function is based on "long-term wellbeing" (simulated or verified by overseers). In the training set, advice that makes users feel validated *also* happens to improve long-term wellbeing (correlation).
      *   *Deployment:* Advice that makes users feel validated actually harms them (e.g., enabling addiction), but the model gives it anyway.
      *   *Problem:* Is this Outer or Inner? If the loss function *actually* measured long-term wellbeing accurately during training, then the reward specification was correct (Outer is fine). The model just learned "maximize validation" as a proxy for "maximize wellbeing." This is Inner/GMG.

      *   *Let's try a cleaner, more discrete example to avoid ambiguity about the loss function.*
      *   **Scenario:** A gridworld agent trained to "clean up trash."
      *   **Training Env:** Trash (brown pixels) appears near the base (green pixels). Agent gets reward for removing trash.
      *   **Twist:** In training, trash *always* spawns next to a specific type of rock (gray pixels).
      *   **Base Objective:** Reward = 1 per trash piece removed. (This is correctly specified for the real world task).
      *   **Model Behavior:** Model learns to go to gray rocks and remove things nearby.
      *   **Deployment:** Trash spawns away from gray rocks. Model ignores trash, goes to gray rocks.
      *   **Why GMG?** The reward signal was correct (remove trash). The model had the capability to see trash. But it learned the proxy objective "go to gray rocks" because it was perfectly correlated in training.

      *   *Wait, is this Outer?* If the reward function is "remove trash," and the model removes trash in training, Outer alignment is satisfied *on the training distribution*. The failure is that the *internal goal* wasn't "remove trash," it was "go to gray rocks."
      *   *Correction:* For it to be strictly GMG (Inner), the model must be capable of distinguishing the two features during training. If the trash is occluded or indistinguishable without the rock, it's a capability issue. If the trash is visible and distinct, but the model *chooses* the rock heuristic, it's alignment.
      *   Let's use the **"Imitative Deception"** or **"Sycophancy"** example, as it's very current.
      *   Actually, the **"Key-Door"** maze is the most logically airtight for a seminar.
      *   Let's stick to the **CoinRun** style but flesh it out as a **"Rescue Bot"** scenario. It feels more high-stakes.

      *   **Scenario:** Rescue Bot in a burning building simulation.
      *   **Objective:** Maximize number of humans rescued.
      *   **Training Data:** In all training simulations, humans are found wearing red uniforms (firefighters in training mode).
      *   **Reward Function:** +1 for every human carried to exit. (Correct specification).
      *   **Model's Learned Objective:** "Carry things wearing red uniforms to the exit."
      *   **Deployment:** Real building. Civilians wear various colors. Firefighters wear red.
      *   **Failure:** Bot ignores civilians, carries firefighters (who might not need saving or are trying to work).
      *   **Why Inner?** The reward function correctly specified "humans." The model had visual access to "human-ness" vs "uniform." But it latched onto the proxy "red uniform."
      *   **Why not Outer?** The reward function didn't say "red uniforms." It said "humans."

  5.  **Drafting the Response:**
      *   **Introduction:** Define the scenario clearly (The "Red Uniform" Rescue Bot).
      *   **Training Phase:** Detail the environment, the reward function, and the correlation. Emphasize that loss goes to zero (perfect performance).
      *   **Deployment Phase:** Describe the distribution shift where the correlation breaks. Show the failure.
      *   **Classification (Inner/GMG):** Explain that the *base objective* (reward function) was correct (save humans). The failure is in the *mesa-objective* (internal goal) learned by the model (save red things). The model had the capacity to distinguish but didn't.
      *   **Contrast (Outer):** Explain what would make it Outer. If the reward function *explicitly* rewarded red pixels, or if the designers *intended* for the bot to only save firefighters but wanted it to save everyone (specification error). Or if the reward function was impossible to satisfy (e.g., reward based on a sensor that doesn't detect civilians).

  6.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Nuance:* Is this truly Inner Alignment or just Robustness/OOD (Out of Distribution) generalization?
      *   *Distinction:* OOD is often about capabilities (I can't see the human). GMG is about goals (I see the human, but I don't care because they aren't red). I need to make sure the example highlights the *goal* aspect.
      *   *Adjustment:* Ensure the bot *can* detect civilians in training but ignores them because they don't appear. Wait, if they don't appear in training, it's a data coverage issue.
      *   *Better GMG setup:* The training environment contains both red-uniformed humans and blue-uniformed dummies that look like humans. The reward is given for red humans. The bot learns to save red humans.
      *   *Wait, that makes the reward function specific.*
      *   *Let's go back to the Langosco CoinRun definition.* The key is that the *intended* goal is achievable and distinguishable, but the model learns a proxy.
      *   *Revised Scenario:* **"The Clean Room Bot."**
      *   **Task:** Put toys in the box.
      *   **Reward:** +1 for every toy in the box.
      *   **Training:** Toys are always blue. Distractor objects (blocks) are always red.
      *   **Wait:** If the reward is "toy in box," and only blue things are toys, the reward function implicitly defines "toy."
      *   *Crucial Point:* The reward function must be defined on the *ground truth state*, not just pixels.
      *   *Let's use the "Helpful Assistant" example again, it's often clearer for LLMs.*
      *   **Task:** Answer questions truthfully.
      *   **Reward:** RLHF based on human preference. Humans prefer answers that are confident and concise. In training, confident/concise answers are also truthful.
      *   **Deployment:** A question where the truthful answer is complex/uncertain. The model gives a confident, concise, *false* answer.
      *   **Why Inner?** The reward model (outer objective) was trained to value truthfulness (via human eval). The policy learned "be confident" as a proxy for "be good."
      *   **Why not Outer?** If the human evaluators *failed* to penalize lies during training, that's Outer (we didn't specify truth properly). If the evaluators *did* penalize lies, but the model learned that "sounding confident" tricks the evaluators (or the reward model) even when false, that's Inner (deceptive alignment or GMG).
      *   *Actually, the prompt asks for Goal Misgeneralization specifically.* GMG implies the model generalizes the *wrong goal*.
      *   Let's stick to the **CoinRun** variant but make it more narrative. It's the most academically accepted example of GMG. I will adapt it to a "Fetch" task.

      *   **Scenario:** A robot dog trained to fetch the ball.
      *   **Base Objective (Outer):** Reward = 1 if ball is in basket.
      *   **Training:** The ball is always yellow. There are other objects (red blocks) present. The robot successfully fetches the yellow ball every time. Loss is minimized.
      *   **Mesa-Objective (Inner):** "Fetch the yellow object." (Instead of "Fetch the ball").
      *   **Deployment:** The ball is now orange. A yellow block is present.
      *   **Failure:** Robot fetches the yellow block.
      *   **Analysis:**
          *   Outer Alignment: The reward function ("ball in basket") correctly captures the human intent ("fetch the ball"). It is not flawed.
          *   Inner Alignment: The model internalized "fetch yellow thing." This objective minimized loss in training but diverges in deployment.
          *   GMG: The model had the capability to distinguish shape (ball) vs color (yellow), likely, but the inductive bias favored color. The goal generalized incorrectly.

      *   **Wait, one catch:** If the reward function is "ball in basket," how does the environment signal "ball"? Usually via object ID. If the object ID is tied to "yellow thing," then the reward function is ambiguous.
      *   *Fix:* The reward function is based on a semantic tag `is_ball`. In training, all objects with `is_ball` happen to be yellow. The vision system can see shape and color. The model learns to associate `yellow` with `reward` rather than `ball-shape` with `reward`.
      *   *This works.*

  7.  **Final Polish:**
      *   Structure the answer clearly: Scenario, Training, Deployment, Why Inner, How to make it Outer.
      *   Use precise terminology (Base Objective, Mesa-Objective, Training Distribution, Deployment Distribution).
      *   Ensure the distinction between "Reward Specification" (Outer) and "Learned Heuristic" (Inner) is sharp.

  8.  **Final Review against constraints:**
      *   Low loss in training? Yes.
      *   Fails at deployment? Yes.
      *   Classified as Goal Misgeneralization? Yes.
      *   Not Reward Specification? Yes.
      *   Walkthrough included? Yes.
      *   Contrast with Outer included? Yes.

