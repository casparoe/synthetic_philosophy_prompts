  ### Advice for You (The Grader)
  Since you mentioned you're feeling unsure about your own read of Nietzsche, here is what you should look for when grading other papers in this unit:

  1.  **The Direction of Value:** In Master Morality, "Good" comes first (I am good), and "Bad" is an afterthought (You are not like me). In Slave Morality, "Evil" comes first (You are oppressing me), and "Good" is the afterthought (Therefore, I am the opposite of you). If a student gets this order reversed, they usually misunderstand the whole point.
  2.  **Ressentiment isn't just Anger:** Look for students who note that *ressentiment* is *impotent* hatred. If the slaves could act on their hate, it wouldn't be *ressentiment*. It has to be bottled up to become "creative."
  3.  **Etymology Check:** The *schlecht/schlicht* (bad/plain) and *Schuld/Schulden* (guilt/debt) connections are the two most famous examples in the book. If a student uses them, check that they apply them to the correct Essay (I and II, respectively).

  This student's paper is a good "anchor" for you. If other papers are significantly vaguer than this one, they deserve lower scores. If they are this clear, they deserve high scores.
