answer: |-
  Good evening, everyone. Thank you for being here to celebrate my father's eightieth birthday.

  Eighty years is a long time. It's enough time to raise a family, build a career, and wear out several sets of golf clubs. But for my father, it has also been enough time to fill dozens of little notebooks.

  For those of you who don't know, Dad has spent the last fifty years living by Benjamin Franklin's thirteen virtues. Temperance, Silence, Order, Resolution, Frugality, Industry, and so on. Every week, he focuses on one. Every night, he checks his day. If he slipped up—if he lost his temper, or ate a second cookie, or spoke out of turn—he puts a little black mark in the chart.

  Most of you know this story. You think it's a charming quirk. You picture him at the kitchen table, pen in hand, tallying up his sins like a cosmic accountant. And in a way, you're right. It is charming. It is the habit of a man who believes that being good is a job that requires showing up for work, even on Sundays.

  But there are a few people at this table—my philosophy colleagues—who know that I have written extensively about this specific habit. They know that I have argued, in peer-reviewed journals, that my father's method doesn't actually produce what Aristotle called "virtue."

  Aristotle believed that a truly virtuous person doesn't struggle. They do the right thing effortlessly, because their desires are perfectly aligned with the good. They don't want the second cookie. They don't *need* willpower.

  My father, by contrast, feels the pull. He wants the cookie. He feels the anger. And then, every single time, he chooses not to eat it, and not to yell. He puts a mark in the book, and he tries again tomorrow. Technically, that isn't perfect virtue. It's what the Greeks called *continence*. It's victory through struggle, not victory through nature.

  So, Dad, I want to make this clear for the record, and for my colleagues in the back: By the strict definition of the Nicomachean Ethics, you are not virtuous. You are merely incredibly, relentlessly, stubbornly good.

  And I think that is a much better thing to be.

  Because a man who doesn't feel temptation is lucky. But a man who feels it, and denies it, for eighty years? That is a choice. That is love in action.

  I have spent my career analyzing the difference between the man who doesn't need to fight the dragon, and the man who fights it every day. And I have realized that if my house was on fire, I wouldn't call the saint who doesn't understand fear. I'd call the man who is terrified, checks his chart, and walks into the flames anyway because he marked "Resolution" for the week.

  The marks in your notebook, Dad, aren't failures. They are evidence. They prove that your kindness isn't a reflex; it's a discipline. They prove that your patience isn't a lack of emotion; it's a gift you give us, paid for in effort.

  You taught me that morality isn't about arriving at a destination where you never make a mistake. It's about the honesty to record the mistake, and the courage to start the next week clean.

  So, to my father. The man who kept the books. The man who fought the fight. The man who proved that while perfection might be for the angels, consistency is for us.

  Happy eightieth birthday. I love you.

  To Dad.
