  *   *Derivation:* The standard Fitch derivation goes like this:
      1.  Assume $p \land \neg Kp$ is true (for some $p$).
      2.  Knowability Thesis (KT): $\phi \to \Diamond K\phi$. Apply to conjunction: $(p \land \neg Kp) \to \Diamond K(p \land \neg Kp)$.
      3.  Assume $\Diamond K(p \land \neg Kp)$.
      4.  In some possible world $w$, $K(p \land \neg Kp)$ holds.
      5.  Distribution of Knowledge over Conjunction (Facticity/Distribution): $K(A \land B) \to KA \land KB$. So, $Kp \land K(\neg Kp)$.
      6.  Factivity of Knowledge: $K\phi \to \phi$. So from $K(\neg Kp)$, we get $\neg Kp$.
      7.  Contradiction: $Kp \land \neg Kp$.
      8.  Therefore, $\neg \Diamond K(p \land \neg Kp)$.
      9.  By KT, $\neg (p \land \neg Kp)$.
      10. Therefore, $p \to Kp$.
