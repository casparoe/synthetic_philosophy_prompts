      *   *Better Angle:* The structure of the "Margin for Error" principle differs between phenomenal states and factive states.
      *   *Key Insight:* The "feeling cold" series is a series of *worlds* (or times) that are phenomenally identical to the subject. The "KK" series is supposed to be a series of worlds where the subject's evidence regarding $p$ degrades.
      *   *The Objection:* The analogy breaks down because the "indistinguishability" required for the Sorites push in the KK case undermines the knowledge ($Kp$) at the *start* of the series, not just the higher-order knowledge ($KKp$) at the end. If the cases are truly indistinguishable regarding the status of $Kp$, then $Kp$ itself becomes unstable immediately.

