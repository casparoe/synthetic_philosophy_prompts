      *   *Crucial Distinction:* The "closeness" relation in the temperature case is fixed by the *phenomenology* of the subject. The "closeness" relation in the KK case must be fixed by the *epistemic status* of the subject regarding $p$.
      *   *The Problem:* For the anti-luminosity argument to work against KK, we need a series of cases where $Kp$ holds at the start, fails at the end, and adjacent cases are *epistemically indistinguishable* regarding whether $Kp$ holds. But if $Kp$ holds, the subject has a factive mental state. If the cases differ in whether $Kp$ holds, do they differ in a way the subject can detect *from the inside*?
