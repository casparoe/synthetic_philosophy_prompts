      *   **Part (b) [7 pts]: Lewis's RCA & Finks.**
          *   *Concept:* RCA adds a "causal basis" clause. $x$ is disposed to $r$ if $x$ has intrinsic property $B$ such that if $x$ underwent $s$ and *retained* $B$, then $x$ would $r$.
          *   *Key Mechanism:* It holds the basis fixed across the nearest possible worlds where the stimulus occurs. Since finks work by *changing* the basis upon stimulus, the RCA counterfactual antecedent ("if... retain B") rules out the fink-worlds (or rather, evaluates the counterfactual in worlds where the basis stays put).
