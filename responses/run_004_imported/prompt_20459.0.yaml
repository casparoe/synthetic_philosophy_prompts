      *   **Part (c) [7 pts]: RCA & Masking/Antidotes.**
          *   *Concept:* Masking/Antidote cases are where the disposition *and* the basis are present, the stimulus occurs, but the response is prevented by an *extrinsic* factor (or an interfering factor), not by the removal of the basis.
          *   *The Problem for RCA:* RCA says: Disposed iff has $B$ and if $S$ and retain $B$, then $R$. In masking cases, the object *has* $B$, and *retains* $B$ (the mask doesn't destroy the fragility, it just prevents breaking), but $R$ does *not* occur. Therefore, the counterfactual "If $S$ and retain $B$, then $R$" is *false*.
          *   *Conclusion:* RCA implies the object is *not* disposed. But intuitively, it *is* disposed (just masked). Therefore, RCA **fails** against masking cases.
