answer: |-
  **Setting:** *A cramped seminar room. Whiteboards are covered in Friedmann equations. MARK (50s, cosmologist) is packing a laptop into a bag. ELENA (40s, philosopher) leans against the doorframe.*

  **Mark:** You're blocking the exit, Elena. And if you're here to tell me the grant committee should cancel the collider run, save your breath.

  **Elena:** I'm telling you the committee should cancel it because the result is already in. T2 is true. T1 is dead.

  **Mark:** We haven't turned the magnets on.

  **Elena:** We don't need to. Look at the priors. Ordinary evidence puts T1 and T2 at 50/50. But T2 contains a trillion trillion times more observers than T1. By the Self-Indication Assumption, my existence is evidence proportional to the number of observers. I exist. Therefore, T2 is a trillion trillion times more likely. The experiment is a waste of budget.

  **Mark:** This is exactly why physicists drink. You think you can deduce the density of dark energy from the fact that you're having coffee? That's the Presumptuous Philosopher argument, and it's hubris dressed up as Bayesianism.

  **Elena:** It's not hubris, it's accounting. If you buy a lottery ticket, and you win, you update on the fact that you won. If T2 is true, "someone like me" is vastly more likely to exist than if T1 is true. Ignoring that is ignoring data.

  **Mark:** You're smuggling the conclusion into the reference class. That's the skeleton in SSA's closet, sure, but SIA's skeleton is a giant. Who is "someone like you"? If you define the class as "conscious observers," you get your result. If I define it as "observers with this exact retinal scan in this specific lab," the probability of me being here is roughly equal in both universes. The anthropic weight cancels out.

  **Elena:** That's ad hoc narrowing. Why would the reference class be "people with your retinal scan"? That makes anthropic reasoning trivial. You're rigging the class so your existence provides no information.

  **Mark:** I'm rigging it to match the causal structure! In T1, *you* exist. In T2, *you* exist. The fact that T2 has extra observers in Andromeda doesn't change the probability of *you* being here, unless you assume you were soullessly floating in the void waiting to be assigned to a body. That's the SSA view: I am a random sample from the observers that *actually exist*.

  **Elena:** But which ones actually exist depends on the theory! You're circular. You need SIA to set the prior over theories before you can apply SSA to sample within them. Without SIA, you get the Doomsday Argument.

  **Mark:** *(Sighs)* Here we go.

  **Elena:** You can't dodge it, Mark. Pure SSA implies we are likely near the middle of the human timeline. If humanity lasts a million years, there are billions more humans than have lived so far. Being born in the first 100 billion is unlikely. So, SSA says humanity ends soon. Do you believe that?

  **Mark:** I think Doomsday is a reductio of taking indexical information too seriously, yes. But Presumptuousness is worse. Doomsday just makes me pessimistic about the future. Your SIA says I can close my eyes and know the size of the universe. It severs the link between physical measurement and truth. If T2 implies infinite observers, does SIA make it certain?

  **Elena:** If T2 implies infinite observers, and T1 finite, then yes. T2 is certain.

  **Mark:** Even if T2 violates conservation of energy? Even if the collider shows T1 parameters?

  **Elena:** Then the collider is an anomaly. Or we're in a simulation. Look, I'd rather be presumptuous than solipsistic. SIA saves us from Doomsday. It allows for a long future. It respects the Copernican principle—I'm not special, so I should find myself in a universe with more people.

  **Mark:** You're not respecting Copernicus; you're violating physics. You're saying metaphysics trumps empirical measurement. If you walk into a casino and see a roulette wheel, you don't bet on red because "universes with more red spins have more observers." You look at the wheel.

  **Elena:** But I'm not betting on the spin. I'm betting on which casino I'm in. And the "Existence Casino" has more seats in T2.

  **Mark:** And I'm telling you, the price of admission to that seat is assuming you know how the seats were allocated. That's the reference class problem, Elena. Your choice of class determines the cosmology. If you can choose a class that saves Doomsday, I can choose one that saves the collider.

  **Elena:** Then we're at an impasse.

  **Mark:** No. At an impasse, we run the experiment. Because if you're wrong, we learn nothing. If I'm wrong, we wasted a billion dollars. But if I'm right, and you shut us down based on a thumb-suck about reference classes, we've lost the ability to ask nature questions.

  **Elena:** *(Steps aside)* Run your machine, Mark. But when it confirms T2, don't say I didn't save you the trouble.

  **Mark:** And when it confirms T1?

  **Elena:** Then I'll know I'm a very unlikely observer.

  **Mark:** *(Walks past)* Then we'll both have something to talk about.
