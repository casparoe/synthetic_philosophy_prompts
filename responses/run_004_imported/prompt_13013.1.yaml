answer: |-
  This is one of the most profound and unsettling case studies in the history of analytic philosophy. The discovery of Frege's diary in 1969 (published in 1976) sent shockwaves through the community, precisely because Frege was the "philosopher's philosopher"—the man who supposedly cleansed philosophy of rhetoric, psychology, and politics to leave behind pure logic.

  Michael Dummett, who did more than anyone to establish Frege as the grandfather of the analytic tradition, was indeed devastated. He famously wrote that reading the diary was like discovering that a beloved father was a murderer. Dummett's struggle encapsulates the tension you are identifying: how to reconcile the objective value of the work with the subjective horror of the author.

  Here is an analysis of the strongest arguments on both sides, followed by a synthesis and a framework for distinguishing biographical noise from diagnostic signal.

  ---

  ### I. The Case for Irrelevance (The Shield of Autonomy)

  The strongest argument for separating Frege's politics from his philosophy rests on the **autonomy of logical truth** and the specific chronology of his work.

  **1. The Genetic Fallacy Proper**
  The core philosophical principle here is that the truth-value of a proposition is independent of its origin. If Frege proves that the concept of number can be derived from logical laws, that proof stands or falls on its internal validity, not on whether he hated Jews. To argue otherwise is to commit the genetic fallacy: rejecting a conclusion based on the source rather than the evidence. In mathematics and formal logic, this boundary is usually rigid. $1+1=2$ does not become false if the arithmetician is a tyrant.

  **2. The Chronological Gap**
  Frege's major logical innovations (*Begriffsschrift*, 1879; *Die Grundlagen der Arithmetik*, 1884; *Grundgesetze*, 1893/1903) were published decades before the diary entries (1924). The diary reflects a bitter, old man reacting to the chaos of post-WWI Germany and the Weimar Republic. It is historically plausible to argue that his radicalization was a late-life development, perhaps exacerbated by professional disappointment (his work was largely ignored during his prime) and national humiliation. If the politics came *after* the logic, the logic cannot be *derived* from the politics.

  **3. The "Third Realm" as a Firewall**
  Frege's ontology explicitly creates a firewall between the thinker and the thought. He posits a "third realm" (*drittes Reich*) of objective "Senses" (*Sinne*) that are not mental ideas (first realm) and not physical objects (second realm). By defining Thoughts as mind-independent entities, Frege theoretically inoculates his system against his own psychology. If Thoughts are objective, they cannot be contaminated by the subjective prejudices of the thinker grasping them. To claim his bias infects his logic is, ironically, to commit the very "psychologism" Frege spent his life fighting.

  ---

  ### II. The Case for Relevance (The Mirror of Temperament)

  The strongest argument for relevance does not claim Frege's logic is *false*, but that his **philosophical vision** is structurally complicit with his politics. This argument moves from validity to *motivation* and *metaphor*.

  **1. Philosophy as Temperament**
  Philosophy is not merely a set of proofs; it is a selection of problems, a style of argument, and a hierarchy of values. Why was Frege so *ferociously* anti-psychologistic? Why did he view any appeal to human usage or mental content as a contamination of truth? The diagnostic argument suggests that this philosophical rigidity springs from the same psychological root as his political authoritarianism: a deep horror of pluralism, ambiguity, and negotiation.
  *   **Politics:** Democracy is messy; it requires compromise between conflicting interests. Frege wanted a Dictator to impose order.
  *   **Philosophy:** Language is messy; it requires interpretation between speakers. Frege wanted a Concept-Script (*Begriffsschrift*) to impose order.
  In this view, the *Grundgesetze* is the political fantasy of the diary written in logical notation: a world where ambiguity is eliminated by fiat.

  **2. The "Third Realm" Resonance**
  While Frege used the phrase *drittes Reich* to describe the realm of objective thought before the Nazis co-opted the term, the structural affinity is disturbing. Frege's "Third Realm" is a place of eternal, unchanging hierarchy where every Thought has its fixed place. It is a realm without becoming, without perspective, and without democratic access (only the "logically pure" can grasp it). Critics argue this metaphysical picture naturalizes a political worldview where truth is something to be *obeyed* rather than *constructed* or *agreed upon*.

  **3. The Rejection of the Social**
  Frege's philosophy of language is notoriously hostile to the social dimension of communication. He struggles to explain how we grasp the same Thought if we are isolated minds. His solution is a mystical grasp of objective entities. Dummett eventually came to see this as a flaw. If you view Frege's anti-social metaphysics as a symptom of his anti-democratic temperament, it changes how we assess his legacy. It suggests that the analytic tradition's long neglect of the social context of language (until Wittgenstein and Austin) wasn't just a methodological choice, but perhaps a cultural blind spot rooted in the very founder's desire for purity.

  ---

  ### III. Synthesis: Where It Lands

  My assessment is that the "Irrelevance" argument holds for Frege's **formal contributions**, but the "Relevance" argument is essential for understanding his **metaphysics and methodology**.

  **1. Validity vs. Vision**
  We must distinguish between Frege's *theorems* and Frege's *project*.
  *   **The Theorems:** Predicate logic, the distinction between sense and reference, the definition of cardinal numbers. These are robust. They have been formalized, tested, and integrated into computer science and mathematics. Frege's anti-Semitism does not introduce a variable error into predicate calculus. Here, biography is noise.
  *   **The Project:** The attempt to reduce all mathematics to logic; the insistence that natural language is fundamentally defective; the ontological commitment to abstract objects. These are philosophical *choices*. Here, biography is diagnostic. Knowing Frege's fear of "contamination" helps us understand why he was so hostile to formalism (Hilbert) and intuitionism (Brouwer). He wasn't just arguing logic; he was defending a specific kind of Order.

  **2. Dummett's Resolution**
  Dummett ultimately landed near this middle ground. He did not discard Frege, but he used the revelation to pivot his own philosophy. Dummett moved toward anti-realism and a focus on the *social practice* of assertion and justification. In a sense, Dummett tried to cure Frege's philosophy of the authoritarian temperament he detected in the diary, by making meaning a matter of public use rather than private grasping of a "Third Realm."

  **3. The Verdict on Frege**
  Frege is not a case where the biography invalidates the work (like a racist sociologist whose data is faked to prove superiority). It is a case where the biography **explains the limits** of the work. It tells us *why* Frege drew the boundaries of philosophy where he did. It suggests that the "View from Nowhere" (the objective third realm) might not be a neutral discovery, but a specific reaction against the "View from Everywhere" (democratic pluralism).

  ---

  ### IV. A Principled Distinction: Noise vs. Signal

  You asked for a principled way to distinguish when biography is irrelevant noise versus diagnostic signal. I propose three criteria:

  **1. The Formal/Substantive Threshold**
  *   **Noise:** When the work is **formal**. If the output is a mathematical proof, a logical derivation, or a syntactic rule, biography is generally irrelevant. The system is closed; external bias cannot enter unless it alters the axioms.
  *   **Signal:** When the work is **substantive/metaphysical**. If the philosopher is making claims about human nature, society, knowledge, or the "good," biography becomes relevant. These areas rely on intuition and pre-theoretical commitments, which are vulnerable to cultural and personal bias.
      *   *Frege Application:* His logic (Formal) = Noise. His philosophy of mathematics and language (Substantive) = Signal.

  **2. The Explanatory Power Test**
  *   **Noise:** If knowing the biography adds no explanatory power to the text. (e.g., Knowing Kant never left Königsberg doesn't help us understand the *Categories*, unless we are discussing his views on travel).
  *   **Signal:** If the biography resolves a puzzle in the text. Does the author's personal obsession explain why they fight so hard for a specific, non-obvious point?
      *   *Frege Application:* Yes. Why was Frege so uniquely hostile to "psychologism"? Standard logic doesn't require hatred of psychology. But if you view psychologism as the philosophical equivalent of parliamentary weakness/relativism, his ferocity makes sense. The biography explains the *tone* and *intensity*, which are part of the philosophical impact.

  **3. The Constitutive vs. Contextual Test**
  *   **Noise:** The bias is **contextual**. It surrounds the work but does not enter the premises. (e.g., Newton was a theologian; gravity works regardless).
  *   **Signal:** The bias is **constitutive**. The bias *is* the premise, or the bias dictates the methodological constraints.
      *   *Frege Application:* This is the grey area. Frege doesn't premise his logic on "Aryans think better." But he does premise his metaphysics on "Truth must be immune to human variation." That methodological constraint *is* the philosophical link to his politics.

  ### Conclusion: Locating Frege on the Spectrum

  On the spectrum of **Biographical Irrelevance** (Newton/Einstein) to **Biographical Constitutiveness** (Heidegger/Nazi philosophy), Frege sits in a unique, high-stakes middle ground.

  He is not Heidegger, whose philosophy of *Being* became entangled with the historical destiny of the *Volk*. Frege's logic remains universal. However, Frege is more compromised than Russell (whose personal vices were largely separate from his logical atomism).

  Frege represents the **limit case for Analytic Philosophy**. He is the proof that you can build a system of objective truth using a mind consumed by subjective hatred. But the diary forces us to admit that the *drive* for that system—the desire to escape the human, the social, and the negotiable—may be less of a neutral discovery and more of a symptom.

  To answer your core question: Leaning on the diary is **not** the genetic fallacy if you use it to assess Frege's *philosophical temperament* and the *motivations* behind his metaphysics. It **is** the genetic fallacy if you use it to invalidate his logical notation. The challenge for the modern philosopher is to hold both truths: the logic is pure, but the philosopher who dreamed it was not, and the dream itself bears the scar of that impurity in its insistence on a purity that does not exist in the human world.
