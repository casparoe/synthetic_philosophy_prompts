answer: |-
  Good evening. For those who don't know me, I'm [Name], and I have the privilege of being her child.

  Looking around this room, I see two distinct groups. On one side, family who love her deeply, but who sometimes, I know, speak of her in the past tense. You see the disease taking pieces of her away, leaving a hollowed-out shell. On the other side, the philosophy reading group. You've been debating mind and metaphysics with her for thirty years. You see a case study. You see Otto.

  For those who don't know the reference: In 1998, philosophers Andy Clark and David Chalmers described a man named Otto who had Alzheimer's. Otto used a notebook to store information he couldn't keep in his head. Clark and Chalmers argued that the notebook wasn't just a tool; it was literally part of his mind. His memory was extended into the world.

  When I watch my mother update her notebook—checking it, trusting it, writing down what she had for breakfast as if it were a vital coordinate—I see Otto. But I also see the objection raised by philosophers Adams and Aizawa. They argued that Clark and Chalmers committed the "coupling-constitution fallacy." Just because a resource is coupled to a person—like a wrench is coupled to a plumber—doesn't mean that resource constitutes part of the person. The ink on the page isn't thinking. The mind stops at the skin.

  I am standing here tonight to tell you that this objection, while logically tidy, is humanly wrong. And specifically, it is wrong about *her*.

  Adams and Aizawa say the notebook is external because it lacks the intrinsic processing of the brain. But memory is not just storage; it is connection. When my mother reaches for that book, she is not retrieving data; she is retrieving *herself*. The loop of her eye seeing the page, her hand writing the name, her heart recognizing the address—that cycle *is* the cognitive process. To say the notebook is merely coupled is to say a wedding ring is merely coupled to a marriage. Technically, you can remove the ring. But if you do, you have fundamentally altered the reality of the union.

  If we accept the "mind stops at the skin" argument, then we have to accept that she is gone. We have to accept that the woman who raised me is receding behind a barrier of biology that is slowly failing.

  I refuse that position.

  If her love for us is recorded in that book, if her history is preserved in those pages, and if she accesses that history with the same trust she once accessed her hippocampus, then the book is not a crutch. It is a lobe. It is the external cortex of a woman who is fighting to stay present.

  To the family: Do not speak of her in the past tense. She is not shrinking; she is spreading. She is distributing her mind into the world so she can remain in it with us.
  To the philosophers: Do not treat this as a thought experiment. The constitution of a self is not a biological boundary; it is a functional continuity.

  So, when we raise our glasses, we are not toasting a biology that is failing. We are toasting a mind that has adapted. We are toasting the woman *and* the book, because tonight, they are the same thing.

  To Mom. To the notebook. To the extended mind. Happy Birthday.
