  **UNIVERSITY DISABILITY ACCOMMODATIONS APPEALS PANEL**
  **OFFICE OF STUDENT AFFAIRS**

  **TO:** The Appellant; Office of Disability Services; External Consultants Dr. A. Vance (Selected-Effects Analysis) and Dr. L. Cumming (Causal-Role Analysis)
  **FROM:** The Appeals Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Appeal Case #2023-DA-49 (Exam Extension Accommodation)

  **DECISION**

  After reviewing the initial denial, the student's medical documentation, and the conflicting expert testimony regarding the classification of severe misophonia under university policy, the Appeals Panel hereby **GRANTS** the appeal. The student is to be afforded extended time and a distraction-reduced testing environment for all remaining examinations in the current academic year.

  **RATIONALE AND POLICY INTERPRETATION**

  The central question before this Panel is whether severe misophonia constitutes a "documented physiological or psychological dysfunction" under Section 4.2 of the University Accommodation Policy. Our policy does not define "dysfunction," leaving the Panel to interpret the term within the specific context of higher education access.

  We received two expert opinions that diverged based on competing philosophical accounts of biological function. Dr. Vance argued from a **Selected-Effects** perspective (à la Wright and Neander), suggesting that because the aversive reaction may represent a threat-monitoring mechanism operating within its evolutionary design parameters, it cannot be classified as a malfunction. Dr. Cumming argued from a **Causal-Role** perspective (à la Cummins), positing that because the mechanism fails to support the specific capacity required in the testing environment (sustained attention), it constitutes a dysfunction regardless of evolutionary history.

  The Panel finds Dr. Cumming's analysis more aligned with the intent of the Accommodation Policy, but we wish to clarify why Dr. Vance's analysis, while biologically coherent, is insufficient for this administrative determination.

  **ADDRESSING THE THEORETICAL DIVIDE**

  To Dr. Vance: Your application of the Selected-Effects theory is not "wrong" in a biological taxonomy sense. It is entirely plausible that the neural pathways triggering distress in response to repetitive oral sounds are functioning exactly as natural selection shaped them—to heighten vigilance against potential threats. In a strict evolutionary context, labeling this a "malfunction" may indeed be inaccurate.

  However, the University Accommodation Policy is not a document of evolutionary biology; it is a framework for educational equity. The policy's use of "dysfunction" is normative and contextual, not purely historical. A mechanism can be evolutionarily "fit" yet contextually disabling. For example, a human propensity for high-calorie retention was once selected for survival but may constitute a metabolic dysfunction in a modern sedentary context. Similarly, a threat-monitoring system that operates correctly in a predator-rich environment may be dysfunctional in a lecture hall. To deny accommodation based on evolutionary pedigree would be to prioritize historical etiology over current capacity. Therefore, while your account of the *mechanism's origin* is valid, it is insufficient to settle the question of *policy eligibility*, which requires an assessment of current limitation rather than ancestral purpose.

  To Dr. Cumming: Your Causal-Role analysis correctly identifies that the mechanism fails to contribute to the system's capacity in the specific environment of a timed exam. This aligns with the policy's requirement that the condition "substantially limits a major life activity" (in this case, learning and assessment). However, we note that a pure Causal-Role account risks pathologizing any inability to perform a task. The Panel restricts this interpretation by tying "function" specifically to the *educational mission* of the university. The dysfunction is established not merely because the student cannot attend to the exam, but because the distress is disproportionate to the environmental stimulus and creates a barrier that standard testing protocols cannot mitigate.

  **REVIEW AND TIME FRAME**

  This accommodation is approved through the end of the **2023-2024 Academic Year**.

  Prior to the commencement of the Fall 2024 semester, the Office of Disability Services must conduct a review. This review should assess:
  1.  The efficacy of the extensions in mitigating the reported distress.
  2.  Whether the limitation remains substantial across different types of assessment (e.g., oral vs. written).

  This timeline allows the university to support the student's immediate access needs while acknowledging that the interaction between biological traits and environmental demands may shift over time.

  **CONCLUSION**

  The Panel concludes that in the context of disability accommodation, "dysfunction" is best understood as a failure of the organism-environment system to support required activities, rather than a deviation from evolutionary design. The appeal is sustained.

  **Signed,**

  *The Student & Faculty Appeals Committee*
  *University Disability Services*
