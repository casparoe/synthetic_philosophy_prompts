answer: |-
  **Setting:** *A park bench outside St. Mary's Hospital. It's late afternoon. Marcus, a graduate student in ethics, and Elena, a senior nurse who coordinates the hospital's ethics committee, are taking a break. They have been discussing a mutual friend, Priya, a 26-year-old accountant.*

  **Marcus:** So, Priya sent the email?

  **Elena:** She did. She's sticking to the ten percent. But she's miserable about it. She says every time she books a holiday or buys a decent coat, she sees the calculation in her head. How many bed nets that money could have bought. How many QALYs she's "stealing" from the global poor.

  **Marcus:** Then she hasn't actually accepted the premise. If she accepted the premise, the misery would be the point. It would be the friction of doing what's necessary.

  **Elena:** Or, Marcus, it could be the friction of a moral theory grinding against human reality. She gives ten percent. That's significantly more than almost anyone we know. It saves lives. By your lights, why is it not enough?

  **Marcus:** Because the math doesn't stop at ten percent. Priya earns good money. Her basic needs are met. Anything beyond subsistence that she spends on herself is, in the grand calculus, a choice to let someone die when she could have prevented it. Singer's drowning child doesn't care if you're an accountant or if you've already saved three children this year. The fourth child is still drowning.

  **Elena:** This is exactly where Kagan loses me. You're treating morality like a video game high-score. Maximize the output. But Scheffler's point—the one I think you're glossing over—is that morality is a system *for agents*. If the system requires the agent to cease functioning as a person with a personal life, the system is self-defeating.

  **Marcus:** That's the "Demandingness Objection." And Kagan swatted it away. Just because a requirement is demanding doesn't make it false. Slavery was demanding for the slaveholder; that didn't make it optional. If the moral truth is that we must maximize the good, then the fact that it crushes Priya's personal projects is a tragedy, not a refutation. You're confusing "I can't live with this" with "This isn't true."

  **Elena:** I'm not saying it isn't true. I'm saying it's incomplete. Scheffler's Agent-Centered Prerogative isn't a permission to be selfish. It's a structural feature of rational agency. It says: I am permitted to give *some* extra weight to my own projects, not because they matter more in the cosmic scale, but because they are *mine*. They constitute who I am. If Priya gives everything, she isn't a moral agent anymore; she's a conduit for utility.

  **Marcus:** But look at the logic of that permission. You say she can give "some extra weight." How much? Where is the line? If she can give weight to her holiday because it's "her project," why can't she give weight to a luxury car? Or a second house? If the justification is "it's my life," what stops that justification from expanding until it swallows the moral requirement entirely?

  **Elena:** It's not an unlimited license. The prerogative is bounded. She still has to do *a significant amount* of good. She's giving ten percent. She's volunteering. She isn't ignoring the duty; she's balancing it against her integrity.

  **Marcus:** There's the rub. "Balancing it." On what scale? You have suffering on one side—death, malaria, starvation. On the other side, you have... Priya's desire to visit her parents in comfort rather than by bus. How do you weigh those? If you say "her project counts for more," you're asserting a principle. What is that principle? Is it "50% of my income is mine"? "20%"? Why not 99%? If you can't give a principled reason for stopping at ten percent, then Kagan is right: you've just found a sophisticated way to say "I want to keep my money."

  **Elena:** You're asking for a formula where there can't be one. The prerogative isn't a mathematical offset. It's a recognition that impartiality isn't the only value. If Priya gives 90% of her income, she burns out. She becomes resentful. She might quit altruism entirely. By keeping a portion of her life for herself, she sustains her capacity to be moral over a lifetime.

  **Marcus:** That's an empirical claim, not a moral one. Maybe she *should* burn out. If the choice is between Priya having a nice life and three children surviving, and she burns out saving them, that's a net gain. And don't hide behind "sustainability." If Priya is single, no dependents, healthy—she could give 80% and still function. She could live like a monk. If she chooses not to, it's not because she *can't* be moral; it's because she won't pay the price. Scheffler's prerogative just gives her a vocabulary to rationalize that refusal.

  **Elena:** No, it protects the *source* of morality. Morality comes from people, Marcus. Real, embodied people with attachments. If you demand total impartiality, you're asking Priya to view her own life from the point of view of the universe. But she isn't the universe. She's a person. If morality requires her to abandon her personal point of view entirely, it becomes alienating. It asks her to betray the very commitments that make her actions meaningful.

  **Marcus:** "Alienating." That's Scheffler's word, isn't it? But think about it. If I'm a doctor, and I have to triage patients, I can't treat my mother first just because she's my mother. I have to be impartial. Why is the rest of life different? If the moral truth is impartial, then being "alienated" from your personal biases is a feature, not a bug. You're arguing that morality should be comfortable enough for Priya to recognize herself in it. But what if the truth doesn't care about Priya's self-image?

  **Elena:** Because if morality doesn't care about the agent, it ceases to be a guide for action and becomes a tyrant. Look, let's get specific. You say she should give more. Say 60%. That leaves her with enough for a modest apartment and food. But no holidays. No savings for a home. No "fun." You say that's required. I say that's supererogatory. It's saintly.

  **Marcus:** "Saintly" is just a compliment we give to people who do what we know we ought to do but won't.

  **Elena:** Is it? Or is "saintly" a category for actions that go beyond the call of duty? If you erase the line between duty and sainthood, you make morality impossible for normal humans to aspire to. If the cost of being "good" is a life of austerity that no one actually adopts, then your moral theory loses its normative force. It becomes a description of an ideal, not a prescription for action.

  **Marcus:** That's a pragmatic concern, Elena. Not a truth claim. You're saying "We should lie about how much is required so people don't give up." I'm saying "We should tell the truth, even if it's hard." If Priya gives 60%, she saves twenty lives a year. If she gives 10%, she saves three. Where is the principled limit that says three is "enough" but twenty is "too much to ask"?

  **Elena:** The limit is the integrity of the agent. It's not a number. It's the point where the demand undermines her ability to pursue her own rational plans. Priya wants to be an accountant. She wants to build a career. That requires stability, networking, occasionally taking clients to dinner. If she gives 60%, she compromises her career trajectory, which reduces her lifetime earning potential, which reduces her lifetime giving.

  **Marcus:** Ah, the long-game argument. But Priya isn't maximizing her giving potential. She's maximizing her *comfort* potential. She could live on rice and beans and give 80% while working the same job. She chooses not to. So don't hide behind "career stability." The prerogative allows her to say, "My interest in dining out outweighs a stranger's interest in living." How is that not just moral selfishness with a fancy name?

  **Elena:** Because it acknowledges that *she* is the one who has to live the life. You're talking about resources. I'm talking about a life. If I tell a nurse, "You must work double shifts until you collapse because patients need care," you'll say that's unsustainable exploitation. Why is it different for Priya's money? Her income is her life energy. You're asking her to spend all of it on others.

  **Marcus:** Because the patients didn't choose to be sick. The drowning child didn't choose to fall in. Priya chose to have extra money. The asymmetry matters. You're arguing for a "division of moral labor" where Priya gets a chunk of resources that are morally hers by default. But Kagan argues there is no such thing as "morally hers" beyond survival. Everything else is on loan from the needy. Scheffler's prerogative tries to carve out a private sphere, but he can't explain *why* that sphere is sacred without just asserting it.

  **Elena:** He explains it by the nature of practical reason. I can't act unless I have reasons to act. My projects give me reasons. If morality overrides all my personal reasons constantly, I have no motivation left to be moral. I become paralyzed. The prerogative isn't about saying my projects are *more important* than saving lives. It's about saying I am permitted to act on my reasons *sometimes*, even if they aren't the optimal moral reasons.

  **Marcus:** "Sometimes." There it is again. The vague quantifier. How is "sometimes" not just "whenever I feel like it"? If Priya decides this year she wants to buy a boat, is that covered by her "projects"? If she says, "My project is leisure," does the prerogative protect that? If you say no, who decides which projects count? You? Me? Priya?

  **Elena:** Reasonable people can deliberate on that. It's not algorithmic.

  **Marcus:** Exactly. It's not principled. It's intuition masquerading as theory. You want to stop at ten percent because *you* feel that's enough. But if a child dies because Priya bought a boat, the lack of a principle doesn't bring the child back. Scheffler saves Priya's conscience, but he doesn't save the child.

  **Elena:** And you save the child, but you sacrifice Priya. And if you sacrifice Priya, and me, and everyone else, to the impersonal good, you end up with a world of martyrs and no one left to build the institutions that prevent the drowning in the first place.

  **Marcus:** That's a empirical gamble. Maybe a world of martyrs is exactly what's needed.

  **Elena:** It's a world that won't exist. People won't live it. So your theory is either false, or it's irrelevant.

  **Marcus:** Or it's the truth we're too cowardly to face. Priya knows the math. She feels the guilt. That guilt is the moral reality breaking through. Scheffler is just telling her how to mute the alarm.

  **Elena:** Or he's telling her that the alarm is malfunctioning. That it's ringing not because she's wrong, but because the system is trying to consume her.

  *(They sit in silence for a moment. A siren wails in the distance, heading toward the ER.)*

  **Marcus:** So we're stuck. I think she's letting people die to fund a lifestyle. You think I'm asking her to commit moral suicide.

  **Elena:** Basically. I think the prerogative is the only thing that makes morality human. You think it's the only thing that makes morality impure.

  **Marcus:** And Priya?

  **Elena:** Priya stays at ten percent. She sleeps at night. And she wonders, every time she buys a coffee, if you're right.

  **Marcus:** And if I am right, that coffee is heavier than she thinks.

  **Elena:** And if I'm right, the weight is exactly where it should be. On her shoulders, not crushing them.

  *(Marcus nods, unconvinced but acknowledging the stalemate. He stands up.)*

  **Marcus:** I'll see you at the committee meeting, Elena.

  **Elena:** See you, Marcus.

  *(Marcus walks away toward the city center. Elena watches him go, then looks toward the hospital entrance, where the lights are bright against the gathering dusk.)*
