answer: |-
  This is an excellent question that cuts to the technical heart of the accuracy-first program. You are right to suspect that the move from *proper* to *strictly proper* is not merely a mathematical nicety; it is the linchpin that allows the accuracy-dominance argument to rule out incoherence as irrational, rather than merely suboptimal.

  Here is the breakdown of why strict propriety is required, a concrete illustration of the failure mode, and the relationship to immodesty.

  ### 1. The Failure of the Dominance Argument

  The accuracy-dominance argument (pioneered by Jim Joyce and formalized by Predd et al.) aims to prove that for any incoherent credence function $c$, there exists a coherent credence function $p$ that is **strictly more accurate** than $c$ in every possible world.

  $$ \forall w \in W, \quad I(p, w) < I(c, w) $$

  This is a theorem of convex geometry. The set of coherent credence functions (the probability simplex) is a convex set. The inaccuracy measure $I$, if generated by a **strictly proper** scoring rule, behaves like a strictly convex distance function (a Bregman divergence).

  **The Specific Step That Fails:**
  The argument relies on the **Projection Theorem**. This theorem states that for any point $c$ outside a closed convex set (the incoherent credence), there exists a *unique* point $p$ inside the set (the coherent credence) that minimizes the "distance" (inaccuracy) to $c$.

  If you relax strict propriety to **mere propriety**, the inaccuracy measure is no longer strictly convex. Geometrically, the "surface" of expected inaccuracy can have **flat spots** (plateaus).
  1.  **Loss of Uniqueness:** If the surface is flat, there may be multiple points that minimize expected inaccuracy.
  2.  **Loss of Strict Dominance:** An incoherent credence $c$ might lie on the same "level set" (isoinaccuracy contour) as a coherent credence $p$.
  3.  **The Result:** Instead of finding a $p$ that is *strictly* better than $c$ in all worlds, you might only find a $p$ that is *equal* to $c$ in all worlds (or better in some, equal in others).

  **Why this matters:** If $p$ only **weakly dominates** $c$ (i.e., $I(p, w) \le I(c, w)$ with equality in some worlds), then $c$ is not definitively irrational. It is merely "permissible but not optimal." The goal of the argument is to show that incoherence is *forbidden*, which requires strict dominance.

  ---

  ### 2. Concrete Toy Illustration

  Let's construct a scoring rule that is proper but not strictly proper and show how it fails to generate strict dominance.

  **The Setup:**
  *   **Worlds:** A partition of two propositions, $\{A, B\}$.
  *   **Credences:** A function $c$ assigns values $c(A)$ and $c(B)$.
  *   **Coherence:** Requires $c(A) + c(B) = 1$.
  *   **Incoherent Target:** Let $c^*$ be defined as $c^*(A) = 0.5$ and $c^*(B) = 0.6$. (Sum = 1.1).
  *   **Coherent Competitor:** Let $p$ be defined as $p(A) = 0.5$ and $p(B) = 0.5$. (Sum = 1.0).

  **The Scoring Rule: "The Flat-Bottom Brier"**
  Standard Brier Score is $S(c, w) = (c(w) - 1)^2 + \sum_{X \neq w} c(X)^2$.
  We will modify this to have a "zone of indifference" around the truth. Let $\epsilon = 0.1$.

  Define the inaccuracy $I(c, w)$ for a world where $A$ is true ($w_A$):
  $$ I(c, w_A) = \begin{cases} 0 & \text{if } |c(A) - 1| \le \epsilon \text{ AND } |c(B) - 0| \le \epsilon \\ \text{Standard Brier} & \text{otherwise} \end{cases} $$
  *(And symmetrically for world $w_B$)*.

  **Is it Proper?**
  Yes. If your true credence is $p=(0.5, 0.5)$, your expected inaccuracy is minimized by reporting any credence within the flat zone $[0.4, 0.6]$. Reporting outside this zone increases inaccuracy. Thus, $p$ expects itself (and its neighbors) to be best.
  **Is it Strictly Proper?**
  No. If $p=(0.5, 0.5)$, it expects $c=(0.5, 0.5)$ to be just as good as $c'=(0.55, 0.55)$. The minimizer is not unique.

  **The Dominance Failure:**
  Now, compare our incoherent $c^*$ and coherent $p$ using this rule.
  *   **In World $A$:**
      *   $c^*(A) = 0.5$. Distance to truth (1) is $0.5$. This is $> \epsilon$. Wait, let's adjust the example to ensure they fall in the flat zone to make the point stark.
      *   *Correction:* Let's set the incoherent credence to be $c^*(A)=0.95, c^*(B)=0.95$. (Sum 1.9).
      *   Let the coherent $p$ be $(0.5, 0.5)$.
      *   Actually, let's use the property of the flat zone directly.
      *   Let the rule be: $I(c, w) = 0$ if $c(w) \in [0.4, 0.6]$, else $1$. (A "Pass/Fail" accuracy rule).
      *   This rule is proper (if $p=0.5$, you minimize expected penalty by picking anything in $[0.4, 0.6]$).
      *   **Incoherent $c^*$:** $c^*(A) = 0.5, c^*(B) = 0.5$. (Wait, this is coherent).
      *   **Incoherent $c^*$:** $c^*(A) = 0.5, c^*(B) = 0.5$. (In a framework where $A, B$ are not a partition, e.g., overlapping propositions).
      *   *Simpler approach:* Stick to the geometry.
      *   If the scoring rule is merely proper, there exists an incoherent $c$ and coherent $p$ such that **$I(c, w) = I(p, w)$ for all worlds $w$**.

  **Revised Toy Example for Clarity:**
  Consider the **Absolute Loss Rule**: $I(c, w) = |c(w) - 1|$ if $w$ is true, $|c(w) - 0|$ if false. (Summed over partition).
  This rule is proper but not strictly proper (it elicits medians, not means; for $p=0.5$, any $c \in [0,1]$ minimizes expected loss).

  *   **Incoherent $c$:** $c(A) = 0.5, c(B) = 0.6$.
  *   **Coherent $p$:** $p(A) = 0.5, p(B) = 0.5$.
  *   **World $A$ (True):**
      *   $I(c, A) = |0.5 - 1| + |0.6 - 0| = 0.5 + 0.6 = 1.1$.
      *   $I(p, A) = |0.5 - 1| + |0.5 - 0| = 0.5 + 0.5 = 1.0$.
      *   (Here $p$ is better).
  *   **World $B$ (True):**
      *   $I(c, B) = |0.5 - 0| + |0.6 - 1| = 0.5 + 0.4 = 0.9$.
      *   $I(p, B) = |0.5 - 0| + |0.5 - 1| = 0.5 + 0.5 = 1.0$.
      *   (Here $c$ is better!).

  **Result:** Under the Absolute Loss rule (merely proper), the coherent $p$ does **not** dominate the incoherent $c$. In World $B$, the incoherent credence is actually *more* accurate. The dominance theorem completely collapses. You cannot prove Probabilism because incoherent credences are not accuracy-dominated.

  *(Note: While Absolute Loss is the standard example of non-strict propriety, specific "flat-bottom" quadratic rules can be constructed where $I(c,w) = I(p,w)$ everywhere, yielding weak rather than strict dominance.)*

  ---

  ### 3. Strict Propriety vs. Immodesty

  You asked if these are the same requirement. They are intimately related but distinct in scope.

  **Immodesty** is a property of a specific credence function $p$. A credence function is immodest if it expects itself to be uniquely most accurate.
  $$ E_p[I(p)] < E_p[I(c)] \quad \forall c \neq p $$

  **Strict Propriety** is a property of the scoring rule (the inaccuracy measure). A rule is strictly proper if *every* probability function is immodest relative to it.

  **Can they come apart?**
  Yes.
  1.  **Strict Propriety $\implies$ Universal Immodesty:** If you adopt a strictly proper rule (like Brier), then *every* coherent credence function satisfies the immodesty condition.
  2.  **Mere Propriety $\implies$ Weak Immodesty:** If you adopt a merely proper rule, coherent credences might be "modest." They might expect themselves to be *tied* for best with other credences (as seen in the Absolute Loss example where $p=0.5$ expects any $c \in [0,1]$ to be equally good).
  3.  **Local Immodesty without Strict Propriety:** It is theoretically possible to construct a scoring rule that is not strictly proper globally (it has flat spots) but is strictly proper *at specific points*. In that case, some credence functions would be immodest, while others would be modest.

  **Summary:**
  Strict propriety is the **global mathematical constraint** required to ensure that the accuracy-dominance argument works for **all** probabilistic credences. It guarantees that the probability simplex is the set of *unique* minimizers of expected inaccuracy. Without it, you lose the geometric separation required to prove that incoherent credences are strictly accuracy-dominated, and you lose the guarantee that rational agents should be immodest about their own probabilistic coherence.
