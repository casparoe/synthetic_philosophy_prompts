      *(Self-Correction on the "Voluntary" point)*: Wait, if I buy a token, I am opting into the current rules. But do I bind the person I sell the token to? In a DAO, the token carries the governance rights. So Founder A binds User B (5 years later) via the code. Jefferson would say Founder A has no right to bind User B. User B must consent anew. But the code doesn't ask User B for consent; it just runs. This is a strong point to make.

