answer: |-
  This is an impressively solid summary for someone diving in without a philosophy degree. You've reconstructed the core mechanics accurately, and your engineering intuition is actually serving you well here (treating decision theories like different algorithms for processing inputs).

  Here is the breakdown of the holes, historical corrections, and the FDT clarification you asked for.

  ### 1. The History: You were right to trust your nagging feeling
  **Your summary:** "Cooked up by people defending EDT... to embarrass CDT."
  **The reality:** Your intuition was correct. It's the other way around (sort of).

  The "Death in Damascus" example comes from Allan Gibbard and William Harper's 1978 paper, *"Counterfactuals and Two Kinds of Expected Utility."* Gibbard and Harper were actually **proponents of CDT**. They weren't trying to embarrass CDT; they were trying to refine it.

  They used the example to show that naive CDT leads to "deliberative instability" (the oscillation you described). Their proposed solution was to introduce the concept of **ratifiability**: a decision is only rational if, once you make it, you don't wish you'd made a different one given that you made it.

  So, it wasn't an EDT "gotcha." It was CDT defenders saying, "Okay, our theory has this edge case where the agent spins forever; here is how we patch the code to make it stable." (Though, ironically, EDT also struggles with this scenario because it leads to fatalism—if staying is evidence Death is there, and fleeing is evidence Death is there, EDT says it doesn't matter, which feels wrong).

  ### 2. The Coin-Flip Fix: Your objection is a "live issue"
  **Your summary:** "Surely a predictor good enough to nail your city choice could predict your coin flip too?"
  **The reality:** Yes, this is a standard and valid objection.

  In the literature, this is often handled by distinguishing between predicting the *decision algorithm* vs. predicting the *physical outcome of a randomizer*.
  *   **If Death predicts the outcome:** If you flip a quantum coin, and Death is a perfect predictor of the *universe*, Death knows the result of the flip before you do. In this case, the coin flip doesn't help you survive (you still die), but it does solve the **deliberative instability**. It stops the CDT agent from oscillating because the expected utility of "Flip Coin" becomes stable.
  *   **If Death predicts the strategy:** If Death predicts you *will* flip a coin, Death might just go to Aleppo (or Damascus) and wait, or flip a coin themselves.

  Your feeling that it's a "dodge" is shared by many decision theorists. The coin flip doesn't save your life; it just saves your decision process from crashing (stack overflow). It turns a "logic error" (oscillation) into a "runtime warning" (50% chance of death).

  For a CDT agent, the coin flip is the only **ratifiable** decision. If you commit to Aleppo, you wish you'd gone to Damascus. If you commit to flipping, you don't wish you'd committed to a city (because that leads to instability), and you don't wish you'd stayed home (same utility). So it's "stable," even if the outcome is grim.

  ### 3. Functional Decision Theory (FDT): Is it different?
  **Your summary:** "Is functional decision theory doing something substantively different here, and if so, what's the one-sentence version?"
  **The reality:** Yes, it is substantively different, though it shares DNA with one-boxing.

  **The One-Sentence Version:**
  > FDT treats your decision as the output of a fixed logical function, assuming the predictor simulates that same function, so you choose the output that yields the best result when *both* you and the predictor run the code.

  **Why it's not just "dressed up one-boxing":**
  In Newcomb's Problem, one-boxing is about ignoring a causal link that doesn't exist. In Death in Damascus, FDT isn't trying to "cause" Death to be elsewhere (which is impossible). Instead, it avoids the deliberation loop entirely.

  *   **CDT Agent:** "If I go to Aleppo, Death is in Aleppo. I should go to Damascus. If I go to Damascus, Death is in Damascus..." (Infinite Loop / Crash).
  *   **FDT Agent:** "My decision is the output of function `Decide()`. Death's prediction is the output of `Simulate(Decide())`. Since `Decide()` is deterministic, `Decide()` and `Simulate(Decide())` will return the same city. Therefore, the probability of death is 100% regardless of the return value. I am indifferent, so I can pick either without oscillating."

  FDT dissolves the instability by recognizing the **logical correlation** between your reasoning and the prediction. It doesn't give you a better survival rate (you still die), but it allows you to make a decisive choice without needing to outsource your agency to a coin flip. It treats the coin flip as unnecessary compute.

  ### Verdict on your Mental Model
  Your model is **90% sound**.
  *   **Correction needed:** The historical origin (CDT defenders, not EDT attackers).
  *   **Validation:** Your skepticism about the coin flip is philosophically robust (it solves stability, not survival).
  *   **Validation:** Your suspicion that FDT is related to one-boxing is correct (both rely on logical correlation), but FDT's specific contribution here is eliminating the deliberation instability without randomization.

  You're ready to repeat this to people. Just swap the "EDT gotcha" line for "CDT stress test," and you're golden. Welcome to the rabbit hole; the air is thinner down here, but the views are interesting.
