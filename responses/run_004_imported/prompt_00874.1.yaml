prompt: |-
  So I went down a decision-theory rabbit hole a couple weeks ago, starting from the classic Newcomb's problem stuff (one-boxing vs two-boxing, all that) via some old LessWrong/AI-alignment posts, and somehow ended up on this weirder cousin of it called "Death in Damascus." I don't have any formal philosophy background, I'm a backend engineer, so I've basically been reconstructing my understanding from a Stanford Encyclopedia article and a couple of blog posts, and last night I typed up my own summary in my notes app just to check it actually clicked. Pasting that summary below — would appreciate you poking holes in it since I dont really have anyone around to check my work against.

  Here's my summary: a guy in Damascus runs into Death, who tells him they've got an appointment tomorrow. He can stay put or flee to Aleppo overnight, and Death is basically a perfect predictor of where he'll end up, so whichever city he picks, that's the city Death already decided to go to — he cant win either way. What I find interesting is that I think this example was cooked up by people defending evidential decision theory (EDT) specifically to embarrass causal decision theory (CDT) — like, CDT's whole claim to fame is that it "wins" on Newcomb's by two-boxing, but here it apparently can't even settle on one stable answer, because whichever city you commit to, the fact that you committed to it is itself evidence Death guessed right, so you always end up wishing you'd picked the other one. The fix I've seen mentioned is that the CDT agent should flip a coin instead of committing to a city, since only that randomized "strategy" ends up being stable under its own logic (I think the term for this is "self-ratifying"?). Which feels like a bit of a dodge to me — surely a predictor good enough to nail your city choice could predict your coin flip too? I also stumbled on something called "functional decision theory," apparently pushed by MIRI/rationalist-adjacent folks, that's supposed to actually solve this instead of punting to a coin flip, but I can't tell if it's doing something genuinely different or just dressing up one-boxing in new clothes.

  Could you go through this and flag whatever I've gotten wrong or oversimplified? In particular: (1) did I get the history backwards about who this example was originally aimed at — I have a nagging feeling it might actually come from CDT's own defenders rather than being an EDT "gotcha," but I'm not sure; (2) is my objection to the coin-flip fix (that a good enough predictor could predict the randomization too) an actual live issue in the literature, or does the setup just define the predictor as unable to do that; and (3) is functional decision theory doing something substantively different here, and if so, what's the one-sentence version of what it changes? Don't need a super formal answer, just want to know if my mental model is basically sound before I go around repeating it to people.
