answer: |-
  **Setting:** *A dimly lit hotel bar in Chicago. 11:30 PM. Empty plates and two half-finished bourbons sit between Alex and Jamie. They are old friends from grad school, now colleagues at rival universities. They are both presenting on panels tomorrow morning.*

  **Alex:** (Swirling the ice in his glass) Look, I know you're presenting on sourcehood tomorrow, but I'm telling you, the Frankfurt intuition is rock solid. We spent two days on it in my seminar, and the students get it immediately. Jones decides to kill the mayor on his own. Black is there with the chip, ready to force him, but never uses it. Jones is responsible. But Jones couldn't have done otherwise. PAP is dead. Bury it.

  **Jamie:** (Leaning forward) You're describing the textbook case, Alex. The one where Black sits idle. But you're skipping the metaphysics of *how* Black knows to sit idle. If Jones is truly free in the libertarian sense, Black can't know what Jones will do until he does it. If Black knows beforehand, there has to be a prior sign—a neural flicker, a muscle twitch—that indicates Jones's choice. And that brings us to the "flicker of freedom." Jones *could* have chosen otherwise, but only by choosing otherwise *before* the sign appeared. That's an alternative possibility. It's small, sure, but it's enough to save PAP.

  **Alex:** Come on, Jamie. We've been over this. That flicker is morally insignificant. It's not the *action* that differs, just the causal history leading up to it. If the outcome is "Mayor dies by Jones's hand" in both worlds, the fact that one world involved a micro-second of uncoerced deliberation and the other involved Black's intervention doesn't ground responsibility. Frankfurt's point is that responsibility tracks the *actual sequence*, not the existence of alternative possibilities. The flicker is too flimsy to carry the weight of moral blame.

  **Jamie:** It's not about the weight of the blame; it's about the logical space. But fine, let's grant that the simple flicker is weak. That's why Widerker's Dilemma is the real killer. You want Black to know what Jones will do without intervening. So, is the prior sign deterministically linked to the action or not? If it is, you're assuming determinism is true to prove PAP false. That begs the question against us incompatibilists. If it isn't deterministically linked, then the sign doesn't guarantee the action. Jones could show the sign and then do otherwise anyway. In that case, Black intervenes unnecessarily, and Jones *could* have done otherwise. You lose either way.

  **Alex:** (Takes a slow sip) I anticipated you'd go to Widerker. It's a classic trap, but it assumes Black needs *infallible* knowledge. Why does Black need a sign that is causally sufficient? Let's look at the second horn: the indeterministic sign. Just because the sign isn't causally sufficient doesn't mean Jones has a robust alternative. It just means the correlation is probabilistic. Black can set the device to trigger if the probability dips below a certain threshold. He doesn't need to know the future with metaphysical certainty; he just needs to ensure that *if* Jones were going to swerve, Black catches it. The alternative possibility is there, but it's "finked"—it disappears the moment Jones tries to access it.

  **Jamie:** "Finked" dispositions are a neat trick, but they don't solve the dilemma; they just hide it. If the process is truly indeterministic, as Mele and Robb try to argue with their buffer cases, then there is a possible world where the buffer fails, Black hasn't intervened *yet*, and Jones chooses otherwise. If that world exists, PAP is true. If that world doesn't exist because Black's mechanism is instant and inevitable, then the buffer is effectively deterministic. You can't have your cake and eat it too. Either Jones has the power to initiate a causal chain that Black doesn't control, or he doesn't. If he does, he has APs. If he doesn't, you're a determinist.

  **Alex:** Okay, let's get specific about Mele and Robb, since you brought them up. They construct a case where Jones's decision is causally undetermined. There are two processes: one in Jones's brain, one in Black's device. They converge on the same decision. If Jones's process falters, Black's kicks in. The key is that Jones's actual decision is *not* caused by Black. It's caused by Jones's own indeterministic deliberation. Black is just a safety net. So, in the actual sequence, Jones is the sole source of the action. The fact that Black *would* have intervened in a different sequence doesn't rob Jones of authorship in this one. Sourcehood is compatible with the absence of leeway.

  **Jamie:** But here's the rub with the Mele-Robb buffer: For Black to know when to kick in, he has to monitor Jones's process. If Jones's process is indeterministic, there's a moment where it's undetermined whether it will succeed. If Black monitors that moment, and intervenes if it looks like it's failing, then Jones never *actually* has the chance to fail without interference. You've created a scenario where Jones *appears* to be the source, but the presence of Black ensures the outcome is fixed. If I can't fail, am I really free? If the buffer makes it 99% likely I choose A, but Black ensures the 1% where I choose ~A never happens, you've just built a deterministic cage out of probabilistic bars.

  **Alex:** But that's the intuition pump! The cage doesn't matter if I walk through the open door on my own. Imagine I walk out of a room. Unbeknownst to me, the door was locked, but I had the key in my pocket. I opened it with my key. Does the fact that the door *was* locked mean I didn't leave freely? Frankfurt says no. The lock (Black) is irrelevant to the actual sequence of my leaving (Jones's choice). You're obsessing over the lock, but I'm looking at the key turning. As long as the key turning is my own doing—undetermined, sourced in me—I'm responsible. The lock just ensures I couldn't have stayed, but since I didn't want to stay, my responsibility is intact.

  **Jamie:** The analogy fails because in your case, I *could* have stayed if I'd wanted to use the key differently. In the Frankfurt case, if Jones "wanted to stay" (choose ~A), Black changes the locks. So Jones *cannot* stay. The lock isn't passive; it's responsive to Jones's will. That changes the modal status of the agent. If my will is met with a counter-force that ensures I never succeed in willing otherwise, then my will isn't free, even if it feels like it. You're arguing for a compatibilist "freedom of the will" that ignores the "freedom to do otherwise." But moral responsibility *requires* that I could have actually exercised my will differently, not just that I exercised it freely in a world where doing otherwise was impossible.

  **Alex:** And that's where we stall. You think moral responsibility requires the power to do otherwise. I think it requires the power to be the source of what you *do* do. Frankfurt cases show that the latter can exist without the former. The Mele-Robb buffer shows that you can have an indeterministic source *and* no alternative possibilities. You claim that's impossible; I claim you're conflating "could have done otherwise" with "was determined to do this." Jones wasn't determined. He was just... un-able to swerve. And yet, he's still the driver.

  **Jamie:** (Signals the bartender for the check) He's not the driver if the steering wheel is rigged to straighten out the moment he turns it. That's my point. If the rigging is there, even if unused, it alters the nature of the driving. We're going to be arguing this until the panels start tomorrow. You'll say the actual sequence is all that matters. I'll say the existence of the rigging makes the sequence suspect.

  **Alex:** (Laughs, throwing cash on the table) Sounds about right. You take the incompatibilist slot, I'll take the compatibilist one. Maybe we'll convince the audience that the real freedom is agreeing to disagree before noon.

  **Jamie:** Deal. But if you mention "finkish dispositions" in your talk, I'm heckling you.

  **Alex:** Only if you promise not to bring up "prior signs" without defining them.

  **Jamie:** (Standing up) No promises. Goodnight, Alex.

  **Alex:** Night, Jamie. Don't dream of Black.
