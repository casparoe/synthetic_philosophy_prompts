answer: |-
  **Setting:** *A quiet corner of the faculty lounge, late afternoon. Two coffee mugs sit steaming on the table. **Helen** (a Humean, channeling Loewer/Lewis) and **Marcus** (an Anti-Humean, channeling Maudlin) have just finished a departmental colloquium.*

  **Marcus:** You know, Helen, I watched you nodding when the speaker mentioned the Best System Account. I still don't see how you sleep at night. The man basically admitted that on your view, the laws of physics are just a compressed file of the universe's history.

  **Helen:** And you still think "governing laws" are anything more than a metaphor we project onto the universe because we crave authority figures? Look, Marcus, the mosaic of particular matters of fact is all there is. The laws are just the most efficient way to describe that mosaic. Simplicity and strength. That's it.

  **Marcus:** That's *not* it. That's the description, not the explanation. Here's the problem that keeps me awake, and I know it bothers you too, even if you hide it behind modal logic: On the Humean view, the laws are derived *from* the events. The total history of the world fixes the laws. But in science, we say the laws explain the events. Newton's law explains why the apple falls. If the law is just a summary of the apple falling (plus everything else), you're saying the apple falls because of a summary of the apple falling. That's viciously circular.

  **Helen:** It's not circular because we're talking about two different relations. This is exactly Loewer's point. You're conflating metaphysical determination with scientific explanation.

  **Marcus:** Go on. This is the "two concepts of explanation" move, right?

  **Helen:** Precisely. Metaphysically, yes, the mosaic determines the laws. The laws supervene on the particular facts. There is no "upward" causation from the law to the fact in the ontological sense. But scientifically? Scientific explanation is about systematization. When I say "The apple fell because of $F=ma$," I am locating that event within the best deductive system. I am showing how it fits into the pattern. The circularity is only apparent because the *direction* of the relation changes depending on the context.

  **Marcus:** With respect, Helen, that sounds like philosophical footwork to dodge a bullet. If I ask a physicist, "Why did the superconductor lose resistance at 4K?" and she says, "Because of the BCS theory," she isn't saying, "Because this event fits neatly into our summary of events." She's saying the microscopic dynamics *produced* the macroscopic state. She's talking about production. Your "scientific explanation" is just about our epistemic access. It's about us organizing our notebooks. It doesn't tell me why the world *does* anything.

  **Helen:** But what does "production" add? This is Lewis's old worry about Armstrong. You want to say there's a relation of "necessitation" between universals. The law *makes* the particles behave. But if you strip away the regularities, what is this "making"? If you have a universe where particles just happen to follow $F=ma$, and another where a "governing law" forces them to follow $F=ma$, what is the observable difference?

  **Marcus:** The difference is counterfactual robustness.

  **Helen:** I can get counterfactuals with the Best System. If the Best System says "All Fs are Gs," then if something were an F, it would be a G, because that's the best way to systematize the world.

  **Marcus:** No, you get *accidental* generalizations that look like laws. On your view, the laws are contingent summaries. If the initial conditions had been different, the laws might have been different. Maybe gravity would have been inverse-cube. On my view, the laws are constraints on what initial conditions are even *possible*. The laws hold the reins. They don't just ride along in the carriage.

  **Helen:** But you haven't explained *how* they hold the reins. You've just asserted that they do. Lewis called this "calling it 'necessitation' doesn't make it necessitate." It's like saying opium puts people to sleep because of its "dormitive virtue." You've labeled the mystery "Governing Law" and pretended you've solved it. I'm willing to admit the mystery: The world is regular. The Best System captures that regularity. I don't pretend to know *why* the world is regular, but I don't invent a spooky ontological layer to pretend I do.

  **Marcus:** It's not spooky, it's primitive. Look, in your condensed matter days, did you ever think the Hamiltonian was just a summary of the measurement outcomes?

  **Helen:** No, but I was doing science, not metaphysics.

  **Marcus:** Exactly. But science informs metaphysics. When I write down the Schrödinger equation, I am writing down the rule that the wavefunction *must* obey. It's not that the wavefunction does whatever it wants and I find the best equation to fit it. The equation restricts the wavefunction. If you deny that, you deny the directionality of time in physics. The past determines the future via the laws. On the Humean view, the future determines the laws just as much as the past does, because the "mosaic" is a 4D block. The laws are time-symmetric summaries. But explanation isn't time-symmetric.

  **Helen:** I grant that scientific explanation is asymmetric. But again, that's an asymmetry in our reasoning, not necessarily in the ontology. The "block universe" is the ontology. The asymmetry comes from our position within the block, trying to predict forward. We use the Best System to predict because we don't have access to the future part of the mosaic. But that doesn't mean the future isn't part of what makes the law true.

  **Marcus:** So you're comfortable saying that the fact that this apple falls *today* is partly explained by the fact that apples will fall *tomorrow*? Because both are part of the mosaic that fixes the law which explains today.

  **Helen:** I would say the fact that apples fall today and tomorrow are both instances of the pattern captured by the law. The law explains both by unifying them. It's not temporal explanation; it's systemic unification.

  **Marcus:** That's where I bail out. It violates the asymmetry of explanation. If A explains B, B shouldn't explain A. On your view, the mosaic explains the law, and the law explains the mosaic. You say "different senses," but they look too intertwined to me.

  **Helen:** Fine. Let's turn the table. You say laws govern. Okay. What is the modal status of these laws? Are they metaphysically necessary?

  **Marcus:** Not necessarily. I'm not a dispositional essentialist. I'm a primitivist. They could have been otherwise, but *given* they are what they are, they constrain the matter.

  **Helen:** So they are contingent. If they are contingent, why these laws and not others?

  **Marcus:** That's a brute fact.

  **Helen:** Aha! So you stop at a brute fact. "It just is that laws govern." I stop at a brute fact too: "It just is that the mosaic is regular." Who has the simpler ontology? I have the mosaic. You have the mosaic *plus* a governing relation that you admit is unanalyzable. You've added complexity without increasing predictive power.

  **Marcus:** I've added complexity to match the structure of scientific practice. You're asking me to pay an ontological price to save parsimony. I'm asking you to pay a conceptual price to save parsimony. You want to save on entities, but you bankrupt the concept of explanation. I'm willing to posit a primitive governing relation because without it, "explanation" in physics becomes a fiction. It becomes just data compression.

  **Helen:** But is your "governing" doing any work other than satisfying an intuition? If I can derive all the same predictions, all the same counterfactuals, and all the same scientific utilities from the Best System, what have you bought with your primitive relation? You've bought a feeling of "oomph." You want the universe to have a engine, not just a map.

  **Marcus:** I want the universe to have a nature, not just a history. Look, Helen, think about the Humean mosaic. It's just a distribution of qualities in spacetime. Point instances. Why should there be *any* system at all? Why isn't it just chaos?

  **Helen:** If it were chaos, there would be no simple, strong axioms. The Best System would be just a list of every particular fact. It would be very long, very weak. But it wouldn't be false. It would just be a bad system. The fact that we *have* a good system is a happy accident of the mosaic.

  **Marcus:** A "happy accident." That's the Humean miracle. The regularity is brute. My view says the regularity is there *because* of the law. Yours says the law is there *because* of the regularity.

  **Helen:** And I say your "because" is empty. You say "Regularity exists because Law." I ask "Why does the Law compel the Regularity?" You say "Because it's a Law." I say "Why does the Mosaic exhibit Regularity?" You say "Because of the Law." I say "Why does the Law exist?" You say "Brute."
      Compare that to me: "Why does the Mosaic exhibit Regularity?" I say "Brute." "What is the Law?" I say "The description of that Regularity."
      I've cut out the middleman.

  **Marcus:** You've cut out the director, not the middleman. In a play, you can describe the actors' movements without mentioning the script. But if you ask "Why did Hamlet die?" saying "Because the actor lay down at 9:05 PM" is a Humean explanation. Saying "Because the script required it" is my explanation. Both are true. But only one captures the *constraint*.

  **Helen:** But who wrote the script, Marcus? If God didn't write it, and it's not necessary, then the script is just another fact in the universe. If the script is a fact, is it part of the mosaic? If yes, you're a Humean. If no, where is it? In a Platonic heaven?

  **Marcus:** It's immanent in the world. It's the structure of the world. You treat structure as derivative of the stuff. I treat the stuff as constrained by the structure.

  **Helen:** And I treat that as a category error. Structure is abstract. The mosaic is concrete. Abstracta don't push concrete things around.

  **Marcus:** Then how do equations predict the behavior of particles?

  **Helen:** Because the particles behave regularly, and the equations track that. The map doesn't drive the territory.

  **Marcus:** We're going in circles.

  **Helen:** We are. And that's the state of the literature.

  **Marcus:** It is. But tell me this. When you were in the lab, and you saw a phase transition that matched your model perfectly... did you feel like you'd found a compression algorithm? Or did you feel like you'd found a rule the universe was obeying?

  **Helen:** *[Pauses, looks into coffee]* I felt like I'd found a pattern so robust I could bet my tenure on it. Whether that pattern is a "ruler" or a "record"... I don't think the experiment can tell me.

  **Marcus:** And that's why I'm an anti-Humean. The experiment can't tell you, but the practice demands it. You can't do physics without acting as if the laws come first.

  **Helen:** And I'm a Humean because I don't believe metaphysics should validate our intuitions more than our ontology. If the world is a mosaic, it's a mosaic. Wishing it were governed doesn't make it so.

  **Marcus:** So we're at a stalemate.

  **Helen:** Looks like it. You think I've explained away the mystery by denying it exists. I think you've deepened the mystery by giving it a name.

  **Marcus:** And neither of us can prove the other wrong without begging the question.

  **Helen:** Cheers to that.

  **Marcus:** *[Raises mug]* Cheers. Same time next week?

  **Helen:** Only if you read the new Loewer paper.

  **Marcus:** Only if you read Maudlin's reply.

  *[They drink. The silence is comfortable, the sort shared by people who know the work never really ends.]*
