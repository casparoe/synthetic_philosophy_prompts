      *(Final thought on Move 5)*: Owen claims Farah's standard leads to total skepticism. This is the "Agrippan Trilemma." Farah's standard doesn't necessarily do that, it just demands a stricter verification. Owen wins the rhetorical point about skepticism, but Farah is right that we *can* test instruments without infinite regress. I will nuance this.

