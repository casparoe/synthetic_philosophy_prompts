          *   *Verdict:* Farah wins on the distinction between calibration and accuracy under variance.

      *   **Move (5) Owen:** The Philosophical Pivot. "Unfalsifiable standard." Regress problem. "We trusted our first speedometer."
          *   *Strength:* Highlights the Problem of the Criterion (Münchhausen trilemma). All measurement relies on some baseline trust.
          *   *Weakness:* Speedometers were often trusted via GPS or road markers eventually, but initial trust was indeed pragmatic. He's accusing her of skepticism.
          *   *Verdict:* Owen wins on the philosophical high ground, even if his specific data is still shaky.

