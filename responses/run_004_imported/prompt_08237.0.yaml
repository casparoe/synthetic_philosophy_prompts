prompt: |-
  So this didn't come from a reading, it happened over fall break, but it's been rattling around in my head and it kind of loops back to my History of Economic Thought class in a weird way (we've only covered the General Theory / liquidity preference stuff so far though, nothing about the guy's actual views on how to live, if he even had any). My cousin, who's 29 and works in consulting, is deep into the whole FIRE thing — financial independence, retire early. He's got it mapped out on a spreadsheet: grind at the most demanding, highest-paying job he can stand for another decade, bank like 70% of his income, and by 40 he's "done" and can finally start actually living — travel, learn guitar, whatever he wants. When I asked if he'd get bored or feel aimless without the job, he said the first ten-ish years aren't supposed to be enjoyed, they're just the toll, and the real living only kicks in once the money's sorted.

  That answer has been bugging me and I couldn't say why in the moment. I don't think working hard for a stretch is bad, and I'm not against retiring early either — it's more the structure of it, like he's treating his whole able-bodied adult life as pure means to an end that hasn't started yet, and assuming "living well" is a separate skill you can just pick up later once the money problem is handled, rather then something you have to practice the whole time. Is there actually something shaky about that plan, philosophically speaking, or am i just jealous that he has the discipline and I don't? Curious what the strongest version of both sides would look like.
