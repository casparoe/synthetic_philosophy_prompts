      *   This works perfectly.

  6.  **Addressing the "Which to Give Up" Question:**
      *   Buchak's stance: Keep Reduction. The object of preference is the global prospect.
      *   Consequence: Give up Dynamic Consistency (as a requirement of rationality).
      *   Resolution: Sophistication. The agent chooses the plan at $t=0$ that their future self will actually execute, knowing their future self will re-evaluate.
      *   Does "Whole Tree" resolve it? It resolves the *evaluative* inconsistency (there is only one evaluation), but admits the *volitional* inconsistency (planning vs. acting).

  7.  **Final Review:**
