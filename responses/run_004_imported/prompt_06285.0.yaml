          *   REU sacrifices Dynamic Consistency (Naive agents will change plans).
          *   **Advice:** Defenders should give up Dynamic Consistency (in the naive sense) and adopt a **Sophisticated** choice model (planning at the root, recognizing future re-evaluation).
          *   **Whole Tree Comment:** Treating the tree as the object (Buchak's view) resolves the normative tension (you *should* evaluate the whole tree) but acknowledges the psychological tension (you *will* want to deviate later). It doesn't make the agent dynamically consistent in behavior, but it makes the theory consistent in evaluation.

  5.  **Refining the Numbers:**
      *   $r(p) = \frac{e^{2p}-1}{e^2-1}$. Denom $D = e^2 - 1 \approx 6.389$.
