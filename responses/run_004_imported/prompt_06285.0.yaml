      *Wait, one check:* Buchak often emphasizes $r(p)=p^2$. If I use a weird function, is it still REU? Yes, REU allows any $r$ that is increasing, $r(0)=0, r(1)=1$. The tension exists for *any* non-multiplicative $r$. Since power functions are a measure-zero subset of valid risk functions, the tension is general. I will explicitly mention this nuance.

      *Wait, another check:* In the Recursive calculation, when folding back $V_A$, do we treat $V_A$ as a certain outcome? Yes, that's the definition of backward induction / folding back.
