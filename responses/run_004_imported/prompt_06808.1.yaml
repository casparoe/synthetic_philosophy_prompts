answer: |-
  The file on Marcus Webb lay open between them, a thick stack of paper that seemed to absorb the light from Korman's desk lamp. Outside, the D.C. summer heat had broken, leaving the city scrubbed and dark, but the air in chambers remained stale, recycled through the vents of the Howard T. Markey National Courts Building.

  Korman poured two cups of coffee, black. She slid one across the mahogany to Petrosky. He didn't touch it.

  "You know Ellis isn't coming back," Petrosky said. He was leaning back in the visitor's chair, tie loosened, looking at the ceiling molding rather than her. "She sent her memo. Her vote is locked. That leaves us."

  "It leaves the math," Korman corrected. She sat on the edge of her desk, crossing her ankles. "Two judges find an *Edwards* violation. You and me. Two judges find that if there was a violation, it wasn't harmless. Me and Ellis. Mechanically, under the standard, the conviction falls."

  Petrosky took the cup finally, holding the warmth without drinking. "Mechanically. That's the word that keeps me up, Aviva. You're proposing we assemble a majority out of fragments. On the error, I'm with you. On the harm, Ellis is with you. But on the only question that sends a man home or keeps him in prison, you are alone. One vote out of three. We don't reverse on a minority vote."

  "We reverse on a majority application of the law," Korman said. "The Supreme Court didn't give us a single question. They gave us a test. Step one: Constitutional error? Step two: Harmless beyond a reasonable doubt? If we skip to the bottom line, we aren't applying the test. We're bypassing it."

  "We're acknowledging what a judgment is," Petrosky countered, leaning forward. "A judgment is the court's authoritative statement of what happens to the defendant. If I ask the panel, 'Should Webb go free?' the answer is no. Two to one. If I ask, 'Should Webb stay in prison?' the answer is yes. Two to one. You want to write an opinion that says 'The court finds reversal warranted,' when two-thirds of the court explicitly voted to affirm. That's a fiction. It's a ghost majority."

  "It's not a ghost. It's a logical consequence," Korman said. "Look at Ellis. She says there was no error. But she also committed to the conditional: if there was error, it wasn't harmless. She bound herself to the logic of the test. You admitted the error. So, by your own concession on step one, and her concession on step two, the conditions for reversal are met. To affirm anyway is to say the test doesn't matter."

  "The test matters because it guides our individual votes," Petrosky said. "It doesn't mandate how we aggregate them. That's the fork in the road nobody talks about. We can vote on the premises, or we can vote on the conclusion. Both are majoritarian. Both are consistent. But they produce opposite worlds for Marcus Webb."

  He tapped the file. "In one world, Webb walks because we prioritized the consistency of the legal rules. In the other, he stays because we prioritized the consistency of the court's will. Which one is honest?"

  "The one that follows the doctrine," Korman said. "If we vote on the disposition directly, we're admitting that the intermediate steps are decorative. That we're just taking a poll. 'Who wants to reverse?' 'Who wants to affirm?' That reduces us to a legislature. We are bound by the issues framed by the higher court."

  "And if we vote issue-by-issue, we risk issuing a judgment that no majority of the court actually supports," Petrosky shot back. "That damages legitimacy. When the public reads this, if they ever do, they want to know what the court thinks. Not what a coalition of fragments thinks. If I write 'Affirmed,' I can say 'A majority of this panel believes Webb should remain convicted.' If you write 'Reversed,' you have to say 'A majority of this panel believes the rules were broken, and a different majority believes it mattered, so therefore the single person who thinks both believes he goes free.' It's absurd."

  "It's rigorous," Korman said. "And it protects the defendant. The harmless error standard is supposed to be hard. The government bears the burden. If two of us think the burden wasn't met—me on the facts, Ellis on the principle—then the government loses. To ignore that because Ellis didn't like the first step is to let the government off the hook on a technicality of aggregation."

  Petrosky sighed, rubbing his face. "Let's be blunt, Aviva. If we vote on issues, you win. Webb goes free. If we vote on the disposition, I win. Webb stays down. We are both arguing for the method that hands us our preferred outcome. We know that. I know you know that."

  Korman didn't look away. "I know. But knowing the bias doesn't make the argument wrong. You're arguing for outcome legitimacy. I'm arguing for doctrinal integrity. Both are values. But only one of them keeps the law predictable. If we start voting on bottom lines whenever the math gets tricky, we invite chaos. Next case, you'll want issue-by-issue because it saves your statute. The one after that, I'll want it. We'll be shopping for procedures to match our passions."

  "Or," Petrosky said, "we acknowledge that courts are human institutions, not logic engines. The law isn't just the rules; it's the authority of the people applying them. If a majority of the judges on this panel think the conviction should stand, overriding that feels undemocratic. Even within the chamber. Especially within the chamber."

  "Webb isn't a citizen voting in an election," Korman said, her voice tightening. "He's a defendant facing the state. His rights aren't subject to a popularity contest among us. If the law says he wins when Error and Harm coincide, and the majority findings show they do, then he wins. To deny him that because Ellis couldn't bring herself to admit the error in the first place... that punishes him for her hesitation."

  "It punishes the system to pretend a majority wants him free," Petrosky insisted. "Look, I'm not saying Ellis is right on the error. I think she's wrong. I voted with you on step one. But her vote on step two is contingent on step one being false. She didn't say 'Error plus Harm equals Reverse.' She said 'No Error.' You're forcing her into a coalition she explicitly rejected. You're drafting her into your majority without her consent."

  "I'm holding her to her conditional," Korman said. "She wrote it down. 'Had there been error, I would not call it harmless.' That's a commitment. It's in the memo. You're asking me to ignore a written judicial commitment because it's inconvenient for the headcount."

  "I'm asking you to recognize that a conditional vote isn't a vote on the actual case," Petrosky said. "It's a hypothetical. We don't decide hypotheticals. We decide cases. In this case, Ellis found no error. So for her, the harm question never triggered. You're building a reversal on a trigger she says was never pulled."

  Korman stood up and walked to the window. The reflection showed the room behind her: the books, the files, Petrosky sitting in the shadows. "If we affirm," she said to the glass, "we are saying that a constitutional violation occurred, that the government broke the rules, but that it doesn't matter because one judge didn't think the rules were broken in the first place. That tells the police: break the rules, as long as you confuse the bench enough to split the vote."

  "And if we reverse," Petrosky said, "we tell the public that judges will manipulate procedure to get the result they want. That we'll construct a majority out of thin air. That tells them the law is a game."

  Korman turned back. "It's not a game to Webb. It's five years."

  "I know," Petrosky said softly. "That's why I can't sign an opinion that says the court believes he should go free when the court believes no such thing."

  "And I can't sign an opinion that says the law was satisfied when the logic compels the opposite."

  They sat in the silence of the chambers. The clock on the wall ticked, measuring out seconds that added up to time served. The file remained open between them, the paradox embedded in the ink, waiting for one of them to pick up the pen. Neither moved.

  "Tomorrow," Korman said finally. "We have to assign the writing."

  "Tomorrow," Petrosky agreed. He stood up, leaving the coffee untouched. "Maybe Ellis will blink."

  "She won't," Korman said. "And neither will I."

  Petrosky nodded, his hand on the doorframe. "Then I guess we find out which kind of court this is."

  He left the room, closing the door softly behind him. Korman looked back at the file, at the name *United States v. Webb*, and picked up her pen. She hovered it over the pad, the ink bleeding into a single dark dot, neither moving forward nor pulling back.
