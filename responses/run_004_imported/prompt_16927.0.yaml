  ### The Phantom Percentage: Why Risk Scores Are Category Errors, Not Calculation Errors

  In the sterile quiet of a pretrial hearing, a number hangs in the air. It is usually presented with the confidence of a blood test or a breathalyzer: *This defendant has a 68 percent chance of reoffending.* For the judge, this figure is a tether to objectivity, a way to anchor the terrifying discretion of sentencing in the bedrock of data. For the defenders of algorithms like COMPAS, criticisms of this number are engineering problems. They argue that with better data, cleaner variables, and more rigorous calibration, we can tighten the confidence intervals. We can make the 68 percent more accurate.

  But this defense misunderstands the nature of the accusation. The objection raised by philosophers of probability is not that the math is sloppy. It is that the math is solving a problem that does not exist. The 68 percent is not an approximation of a hidden truth; it is a linguistic phantom. It is a statement that lacks the necessary conditions to be either true or false.

  The culprit is a logical ghost that has haunted statistics since the 1920s, known as the reference class problem. First articulated by the German philosopher Hans Reichenbach, the problem arises from a simple fact of ontology: no individual belongs to only one group. A defendant standing before a judge is simultaneously a member of indefinitely many classes. He is a male, a 24-year-old, a resident of Zip Code 60609, a high school graduate, a first-time offender, a person with a specific genetic marker, a coffee drinker, a left-hander.

  In frequentist probability—the mathematical framework underpinning these risk tools—probability is defined as the frequency of an event within a specific class. To say there is a "68 percent chance of recidivism" is shorthand for "68 percent of people in *this specific group* reoffend." But which group?

  If we classify the defendant by age, the risk might be 40 percent. If we classify him by zip code, it might be 75 percent. If we classify him by the intersection of age, zip code, and prior record, it might be 60 percent. There is no mathematical rule to privilege one class over another. Each classification is equally valid empirically, yet each yields a contradictory probability.

  Defenders of actuarial justice often lean on Reichenbach's own proposed solution to this paradox. Reichenbach suggested we should always utilize the "narrowest class for which reliable statistics exist." The logic is intuitive: the more specific the group, the more it resembles the individual.

  However, in the context of criminal justice, this rule leads to an infinite regress that never terminates. There is always a narrower class available. We can narrow by crime type, then by time of day the crime was committed, then by the defendant's employment status, then by the number of siblings they have. We can keep slicing the population thinner and thinner until we arrive at the narrowest possible class: the class containing only the defendant himself.

  But a class of one destroys the concept of probability entirely. In a group of one, the frequency of reoffending is either 0 percent (he doesn't) or 100 percent (he does). The "probability" dissolves into certainty or impossibility. The 68 percent vanishes.

  This is why the claim that these tools are merely "imperfect" is a category error. An imperfect tool is one that measures a real thing inaccurately, like a scale that is off by two pounds. But the reference class problem suggests that risk assessment tools are trying to weigh a ghost. For a statement to be true or false, it must correspond to a state of affairs in the world. For "There is a 68 percent chance of recidivism" to be true, there must be a fact of the matter about *which* reference class constitutes the defendant's "true" probability.

  There is no such fact.

  Because the selection of a reference class is arbitrary, the resulting probability is arbitrary. It is not that we lack the computational power to find the *real* number; it is that the *real* number does not exist. The statement is cognitively meaningless in the same way the sentence "This stone is morally virtuous" is meaningless. Stones cannot hold moral value; individuals cannot hold frequentist probabilities. Only groups hold frequencies, and the individual belongs to too many groups to be assigned a single one.

  When a court treats this arbitrary output as a fact, it is not engaging in science. It is engaging in a ritual of objectivity. The algorithm is not revealing the defendant's future; it is reflecting the analyst's choice of classification. When the software developer decides to weight "prior arrests" more heavily than "neighborhood stability," they are not discovering a law of nature; they are selecting a reference class that privileges certain sociological assumptions over others.

  To argue for better data is to assume the reference class problem is an engineering hurdle. It is not. It is a logical wall. Until we acknowledge that a probability statement about a single individual is strictly neither true nor false, we are not fixing the system. We are merely polishing the lens of a telescope pointed at nothing.
