answer: |-
  You have identified a crucial friction point between introductory game theory and the more rigorous definitions used in advanced analysis (and often discussed in rationality communities like LessWrong).

  Your current procedure contains **two significant errors** that will lead to an incorrect set of surviving strategies. Specifically, your definition of dominance is too narrow (ignoring mixed strategies), and your assumption about the permanence of survival is incorrect (strategies can become dominated in later rounds).

  Here is the breakdown of what needs to change in your procedure.

  ### 1. The Mixed Strategy Problem
  **Your current rule:** A pure strategy is dominated if another *single pure strategy* yields a strictly higher payoff.
  **The correct rule:** A pure strategy is dominated if *any other strategy (pure or mixed)* yields a strictly higher payoff.

  It is a common misconception that you only need to check pure strategies against pure strategies. However, a pure strategy might be inferior to a **probability mixture** of two or more other strategies, even if it is not inferior to any of them individually.

  **Example:**
  Consider a player with strategies $A, B, C$ against an opponent with $L, R$.
  *   **Payoffs for Player 1:**
      *   $A$: $(4, 0)$
      *   $B$: $(0, 4)$
      *   $C$: $(1, 1)$

  If you only check pure vs. pure:
  *   Is $C$ dominated by $A$? No ($1 > 0$ when opponent plays $R$).
  *   Is $C$ dominated by $B$? No ($1 > 0$ when opponent plays $L$).
  *   **Conclusion under your rule:** $C$ survives.

  If you check against mixed strategies:
  *   Consider a mixed strategy $\sigma = 0.5A + 0.5B$.
  *   Against $L$: Expected payoff is $0.5(4) + 0.5(0) = 2$. ($2 > 1$)
  *   Against $R$: Expected payoff is $0.5(0) + 0.5(4) = 2$. ($2 > 1$)
  *   **Conclusion under correct rule:** $C$ is strictly dominated by the mixed strategy $\sigma$ and should be eliminated.

  **Why this matters:** If you fail to eliminate $C$, you are assuming it is "rationalizable." In standard game theory (and the rationality assumptions usually discussed on LessWrong), playing $C$ is irrational because there is no belief about the opponent's behavior that would make $C$ a best response. Ignoring mixed dominance inflates the set of surviving strategies.

  ### 2. The "Safely Un-dominated" Assumption
  **Your current rule:** Once a strategy clears a round, it is safely un-dominated for the rest of the process.
  **The correct rule:** You must re-evaluate **every** remaining strategy in **every** round.

  A strategy that is *not* dominated in Round 1 can become dominated in Round 2. This happens because the definition of strict dominance requires the dominating strategy to be better against **all** of the opponent's remaining strategies.

  As you eliminate the opponent's strategies, the set of constraints shrinks. It becomes **easier** to dominate a strategy, not harder. A strategy might have been "protected" in Round 1 by an opponent strategy against which it performed well. If that opponent strategy is eliminated in Round 1, the protection vanishes, and your strategy might be dominated in Round 2.

  **Example:**
  *   **Player 1:** Top, Bottom
  *   **Player 2:** Left, Middle, Right
  *   **Payoffs for Player 1:**
      *   Top: $(5, 5, 0)$
      *   Bottom: $(4, 4, 4)$

  **Round 1:**
  *   Is Bottom dominated by Top? No. Against Right, Bottom ($4$) beats Top ($0$).
  *   **Your Rule:** Bottom is "safe."
  *   **Scenario:** Suppose Player 2 eliminates Right (perhaps it was dominated for them).

  **Round 2 (Opponent only has Left, Middle):**
  *   Now compare Top $(5, 5)$ vs. Bottom $(4, 4)$.
  *   Top now strictly dominates Bottom against all *remaining* opponent strategies.
  *   **Result:** Bottom must be eliminated in Round 2. Your rule would have kept it.

  ### 3. Connection to Rationalizability and LessWrong
  Since you are cross-referencing LessWrong threads on correlated equilibria and rationality, it is helpful to label what this procedure actually computes.

  Iterated Elimination of Strictly Dominated Strategies (IESDS)—when done correctly including mixed strategies—identifies the set of **Rationalizable Strategies** (Pearce, 1984; Bernheim, 1984).
  *   **Rationalizability** captures the implications of "common knowledge of rationality."
  *   **Nash Equilibrium** is a subset of Rationalizable strategies.
  *   **Correlated Equilibrium** is a superset of Nash Equilibria.

  If you ignore mixed strategies, you are not finding the true set of rationalizable strategies. You are finding a superset that includes strategies that cannot be justified by any consistent belief system. In the context of decision theory discussions often found on LessWrong (e.g., regarding Causal vs. Evidential Decision Theory), precision about what constitutes a "rational" move is paramount. A strategy dominated by a mixed strategy is arguably just as irrational as one dominated by a pure strategy.

  ### Summary of Corrections
  To align your procedure with standard game theory and rigorous rationality analysis:

  1.  **Check Mixed Dominance:** In every round, for every pure strategy $s_i$, check if there exists a **mixed strategy** $\sigma_i$ (over the other remaining pure strategies) such that $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all remaining $s_{-i}$.
  2.  **No Permanent Safety:** Do not mark strategies as "safe." In every round, test all remaining strategies against the opponent's *new, smaller* set of strategies.
  3.  **Strict vs. Weak:** You correctly specified "strictly higher payoff." Stick to this. Iterated Elimination of *Weakly* Dominated Strategies is order-dependent and can eliminate Nash Equilibria, which is usually undesirable unless you have specific refinements in mind.

  If you implement these two changes, your procedure will correctly identify the Rationalizable set, which is the standard baseline for "strategies a rational agent might play under common knowledge of rationality."
