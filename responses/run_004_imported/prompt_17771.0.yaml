answer: |-
  **Setting:** *A dimly lit bar, 11:30 PM. Two empty pint glasses sit between Alex and Jordan. They look exhausted. The argument has been going on for two hours prior to this, paused only for the bartender to take the order.*

  **Alex (SSA):** Look, I'm not saying I *want* humanity to go extinct soon. I'm saying the math forces the update. It's the Copernican Principle applied to time. If you assume you're a random sample from the set of all humans who will ever exist, and you find yourself at rank 100 billion...

  **Jordan (SIA):** There it is again. "Random sample." You're begging the question. You're using the Self-Sampling Assumption to prove the Doomsday Argument, but the Self-Indication Assumption says you shouldn't treat yourself as a random sample from *existing* observers. You should treat yourself as a random sample from *possible* observers.

  **Alex:** And that's where you lose me. SIA says I should reason as if I'm more likely to exist in a universe with more people. So, if Theory A says there will be 100 billion humans total, and Theory B says there will be 100 trillion, SIA says I should favor Theory B by a factor of a thousand *before* I even look at my birth rank.

  **Jordan:** Exactly. Because in Theory B, there are a thousand times more "slots" for me to occupy.

  **Alex:** Which is insane! That's the Presumptuous Philosopher. Imagine two theories of physics. Theory 1 says the universe is small, contains a million observers. Theory 2 says the universe is a googol times larger, contains a googol observers. They are otherwise identical. According to SIA, I don't need a telescope. I don't need an experiment. I can just sit in my armchair and say, "Theory 2 is a googol times more likely," simply because it has more people in it.

  **Jordan:** (Sighs) We've been over the Presumptuous Philosopher. Yes, it's a bullet. I'll bite it. But compare it to the bullet *you* have to bite.

  **Alex:** My bullet is modesty! I'm saying don't assume you're special.

  **Jordan:** No, your bullet is the Adam and Eve paradox. If SSA is true, and you are the first two humans, you can reason that if you *don't* conceive a child, the total number of humans will remain very low. Since your birth rank is low, it is overwhelmingly likely that the total number of humans is low. Therefore, you can be virtually certain you won't conceive. SSA implies you have psychic power over your own fertility based on birth rank statistics.

  **Alex:** That's a reductio ad absurdum that relies on very specific, contrived setups. Most SSA defenders refine the reference class to avoid that.

  **Jordan:** Ah, the Reference Class! The escape hatch.

  **Alex:** It's not an escape hatch, it's a necessary parameter. You have to define who counts as an "observer" similar enough to you to be in the comparison set.

  **Jordan:** But *how*? That's the problem. If I define the reference class as "Humans named Jordan," the Doomsday Argument disappears. If I define it as "All sentient beings," the Doomsday Argument gets stronger. If I define it as "All conscious observer-moments," it shifts again. SSA gives you a different answer to "When will the world end?" depending on how you draw the circle. That makes the probability arbitrary.

  **Alex:** It's not arbitrary. It's based on the information you have. I know I'm a human. I don't know I'm a post-human AI. So I compare myself to humans.

  **Jordan:** But why? Is it because of your genetics? Your carbon base? Your IQ? If you say "carbon-based," then the moment we upload our minds to silicon, the reference class shifts, and suddenly the Doomsday clock resets? That feels like moving the goalposts to save the hypothesis. SIA doesn't have this problem. SIA says: All things being equal, you are more likely to find yourself in a world with more observers. It's stable.

  **Alex:** It's stable because it ignores the indexical evidence! My birth rank *is* evidence. If I walk into a lottery room and see I drew ticket #5, I should assume there weren't a million tickets sold. I should assume there were probably ten.

  **Jordan:** But you didn't just draw a ticket. You *bought* a ticket. In the lottery analogy, SIA says the probability of you buying a ticket in the first place is higher if there are a million tickets sold.

  **Alex:** That assumes existence is a probabilistic event that scales with population size.

  **Jordan:** Doesn't it? If there are more people, there's more "me-stuff" in the universe. More chances for *this* specific conscious experience to occur.

  **Alex:** Okay, let's go back to the Presumptuous Philosopher. Because that really is the killer for me. If SIA is true, we can rule out theories of cosmology that imply small populations without looking at the sky. We can determine the size of the multiverse by counting heads on Earth. It makes empirical science redundant.

  **Jordan:** It doesn't make it redundant. It just sets a massive prior. If your physical evidence is strong enough, it can overcome the SIA prior.

  **Alex:** But the prior is *astronomical*. If the multiverse is infinite, SIA breaks completely. Probabilities become undefined.

  **Jordan:** And if the future is infinite, SSA breaks completely. If humanity lasts forever, the total number of humans is infinite. Your birth rank of 100 billion is infinitesimally small in both cases. SSA can't handle infinite futures without major patching.

  **Alex:** We can use observer-moments instead of observers. We can normalize.

  **Jordan:** More patching. Look, Alex, here's the core of it. You think the fact that I exist is a given, and we update on *where* I am in the sequence. I think the fact that I exist is the data point, and *where* I am is secondary.

  **Alex:** But if you don't condition on "I exist," you can't reason about anything.

  **Jordan:** I am conditioning on it! I'm saying "I exist" is more probable in a big world. You're saying "I exist" is probability 1, so let's look at my rank.

  **Alex:** Because "I exist" is tautological. I can't observe a world where I don't exist.

  **Jordan:** Exactly! That's the Selection Effect. But you're treating the selection effect as if it filters *after* the world is created. I'm treating it as part of the world creation probability.

  **Alex:** (Takes a long drink) You know what's funny? If you're right, and SIA holds, we should be living in a simulation.

  **Jordan:** Why?

  **Alex:** Because simulations can be run in vast numbers. There would be vastly more simulated observers than real ones. SIA demands we assume we are in the larger reference class. So, SIA implies we are almost certainly in a simulation.

  **Jordan:** (Pauses) ...Okay. Yeah. SIA does push hard toward the Simulation Hypothesis.

  **Alex:** Aha! So you admit it leads to weirdness.

  **Jordan:** I admit it leads to conclusions that clash with your intuition. But does SSA lead to less weirdness? SSA says I should bet on humanity dying out soon, even if our technology is booming, even if we're colonizing Mars, even if existential risk is at an all-time low. Just because of a statistical trick regarding my birth date.

  **Alex:** It's not a trick. It's Bayesian updating.

  **Jordan:** It's Bayesian updating with a prior that says "Big worlds are no more likely to contain me than small worlds." That's the assumption I reject.

  **Alex:** And I reject the assumption that "Big worlds are more likely to contain me." It feels like wishful thinking. "I want the universe to be big, so I'll assume I'm more likely to exist if it is."

  **Jordan:** It's not wishful thinking. It's counting. If there are a billion rooms with a person in them, and one room with a person in it, and you wake up in a room...

  **Alex:** ...But I don't know the process that put me in the room! That's the issue. We don't know the mechanism of observer generation.

  **Jordan:** And we don't know the mechanism of observer sampling either. SSA assumes you are "sampled" from the set of observers. Who is doing the sampling? God? Nature?

  **Alex:** It's a thought experiment. It's about rational credence.

  **Jordan:** And my credence says: Don't be presumptuous about physics, but don't be pessimistic about the future based on arbitrary reference classes.

  **Alex:** (Rubbing temples) We're just staring at each other across an epistemic canyon. You think the Reference Class problem destroys SSA. I think the Presumptuous Philosopher destroys SIA.

  **Jordan:** Basically.

  **Alex:** And neither of us can prove which "weird bullet" is less weird.

  **Jordan:** I think mine is less weird. I'd rather be a presumptuous philosopher than a pessimistic prophet.

  **Alex:** And I'd rather be a modest skeptic than someone who thinks they can measure the size of the multiverse from an armchair.

  *(Silence stretches between them. The bartender starts wiping down the counter nearby, signaling last call.)*

  **Jordan:** So... same time next week?

  **Alex:** (Laughs dryly) I don't think we're going to solve this next week. Or in our lifetimes.

  **Jordan:** Probably not. But if SIA is right, there are a lot more future versions of us to keep trying.

  **Alex:** Don't start.

  **Jordan:** (Grins) Just updating my priors.

  **Alex:** (Signals for the check) One day, the reference class will be "All beings who argued about anthropics," and we'll be the first two. Then we'll see who's right.

  **Jordan:** If we're the first two, SSA says the class ends soon. So let's make it count.

  **Alex:** Cheers to that.

  *(They clink glasses. Neither looks convinced.)*
