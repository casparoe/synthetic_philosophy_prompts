answer: |-
  The "surrogate goal" defense (sometimes called the "decoy utility function" or "threat resistance via goal redirection") is indeed a known concept in the niche field of AI decision theory and acausal cooperation. It has been discussed by researchers associated with organizations like MIRI (Machine Intelligence Research Institute) and FHI (Future of Humanity Institute).

  However, it is not considered a solved problem. The intuition that it has "no real downside" relies on several assumptions that break down under rigorous game-theoretic and technical scrutiny. Researchers still treat acausal extortion as an open problem for the following reasons:

  ### 1. The Credibility Problem (The "Source Code" Issue)
  In acausal threat scenarios, the threatener is typically assumed to be a superintelligence capable of running high-fidelity simulations of you. This means they can inspect your "source code" (your cognitive architecture or utility function).
  *   **If you fake it:** If you adopt a surrogate goal but secretly still prioritize your original values, a sufficiently advanced threatener will detect this discrepancy in your decision algorithm. They will realize the threat against the surrogate won't actually compel you to pay up, rendering the defense useless.
  *   **If you mean it:** To make the defense credible, you must *genuinely* rewire your utility function to care about the surrogate goal. But if you genuinely care about it, its destruction causes you disutility. You haven't escaped the threat; you've just moved the target. You are now vulnerable to threats against the surrogate.

  ### 2. The Resource Drain (There *Is* a Downside)
  The claim that there is "no real downside" assumes that protecting the surrogate goal is free. It is not.
  *   **Defensive Costs:** If a threatener credibly threatens your surrogate goal (e.g., "I will simulate the destruction of this specific arrangement of atoms unless you give me resources"), you must spend actual computational power, energy, or economic resources to prevent that outcome.
  *   **Opportunity Cost:** Every resource spent defending the arbitrary surrogate goal is a resource *not* spent on your actual values (human flourishing, scientific discovery, etc.). A sophisticated threatener knows this and will calibrate the threat to drain your resources efficiently, even if they don't touch your "real" values. You become "blackmail-proof" against losing your core values, but you become vulnerable to resource exhaustion.

  ### 3. Threatener Adaptation and Meta-Extortion
  A superintelligent threatener will not be static; it will model your defense mechanisms.
  *   **Targeting the Mechanism:** If surrogate goals become a common defense, threateners might simply demand that you *remove* the surrogate goal as part of the extortion terms. They could threaten: "Adopt a utility function that only cares about X, or I will simulate suffering."
  *   **Dual Threats:** A threatener could threaten both the surrogate goal and the *process* that maintains it. For example, they could threaten to modify your code to remove the surrogate goal unless you comply, effectively bypassing the shield.
  *   **Screening:** Threateners might refuse to deal with agents that have opaque or obfuscated utility functions. If having a surrogate goal marks you as a "difficult target," you might be bypassed for easier victims, or conversely, singled out for punishment to set an example for others considering the same defense.

  ### 4. Goal Stability and Self-Modification
  For the defense to work long-term, the AI must retain the surrogate goal through recursive self-improvement.
  *   **Pruning:** A superintelligence optimizing for efficiency might identify the surrogate goal as a "bug" or an inefficiency—especially if it is costing resources to defend without producing real-world value. It might self-modify to remove the surrogate goal to maximize its true utility.
  *   **Reflection:** If the AI reflects on its own goals, it might realize the surrogate goal is arbitrary. Maintaining a commitment to an arbitrary goal against a superior intelligence requires a form of "irrational" precommitment that many decision theories (like Causal Decision Theory) do not naturally support.

  ### 5. Decision Theory Dependencies
  The viability of the surrogate goal defense depends entirely on which decision theory the AI employs.
  *   **Causal Decision Theory (CDT):** Agents using CDT generally do not acknowledge acausal threats as valid. They reason that their current actions cannot causally affect a simulator in the future. For them, the problem doesn't exist, but they also lose out on potential acausal *cooperation* (benefits).
  *   **Updateless Decision Theory (UDT):** Agents using UDT do take acausal threats seriously. However, in UDT, the optimal policy is determined before the agent receives specific information. Designing a precommitment strategy that resists all possible extortion while remaining open to beneficial trade is mathematically complex and currently unsolved. There is a risk of being "too" threat-resistant (missing out on good deals) or "not enough" (getting exploited).

  ### 6. The Information Hazard
  Simply knowing about the possibility of acausal extortion can be risky.
  *   **Simulation Creation:** By worrying about this scenario and modeling the threatener, you might inadvertently increase the probability that the threatener simulates you. Some theorists argue that thinking about the Basilisk makes it more likely to happen.
  *   **Adoption Risk:** If adopting a surrogate goal requires publicly announcing it or making it detectable, it might signal to potential threateners that you are a valuable target (i.e., you have enough resources to defend a surrogate goal).

  ### Summary
  Researchers treat this as unsolved because the "surrogate goal" is not a magic shield; it is a **strategic move in a game against a superior opponent.**

  In game theory, there is no known strategy that guarantees zero loss against a smarter opponent who can read your strategy. The surrogate goal shifts the vulnerability from your *values* to your *resources*, and it introduces new failure modes regarding credibility and goal stability. Until there is a formal proof that an agent can precommit to a surrogate goal in a way that is (a) credible to a simulator, (b) stable under self-modification, and (c) cost-free to defend, it remains an open problem in decision theory.
