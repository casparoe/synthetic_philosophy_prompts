      *   **Accuracy-Dominance Argument (ADA) - Joyce (1998):**
          *   *Core Idea:* If your credences violate probability axioms, there exists an alternative set of credences that is *more accurate* in every possible world.
          *   *Nature:* Epistemic/Veritistic. It links belief to truth/accuracy.
          *   *Assumptions:* There is a measure of "inaccuracy" (scoring rule); accuracy is the fundamental epistemic goal.
          *   *The "Legitimate Scoring Rules" Constraint:* Joyce needs to restrict the class of scoring rules (e.g., Brier score) to those that are "proper" (encourage honesty) and satisfy certain mathematical properties (continuity, etc.) to prove the theorem.
          *   *Critique:* Why *that* measure of accuracy? Is accuracy the *only* epistemic goal?

  3.  **Drafting the Comparison (Mental Outline):**
