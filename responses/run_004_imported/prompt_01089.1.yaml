          *   *User's View:* "I didn't cause it, only failed to prevent it." (Causation vs. Prevention distinction; counterfactual uncertainty).
          *   *Colleague A's View:* "Noticing and doing nothing is functionally identical to causing it." (Omission = Commission).
          *   *Colleague B's View:* "Who had explicit ownership? That's the only metric that matters." (Procedural/Role-based responsibility).
      *   **Goal:** The user wants to understand the *underlying structure* of the disagreement (the "crux") and find a *principled way* to decide responsibility, rather than winning the argument. They mention reading "rationalist writing," implying they value clarity, epistemic honesty, and systemic thinking (e.g., CFAR, LessWrong, Just Culture).

  2.  **Deconstruct the Disagreement (The "Crux"):**
      *   The user is right that there *is* a clean underlying structure, but it's not just about "who is to blame." It's about *which frame of reference* is being used to assign responsibility.
      *   *Frame 1: Causal/Mechanical.* (User) Did my specific action physically break the thing? No.
      *   *Frame 2: Moral/Agentive.* (Colleague A) Did I have the agency to stop it and chose not to? Yes.
      *   *Frame 3: Procedural/Systemic.* (Colleague B) Did the system designate me as the owner? Yes/No.
      *   *The Real Problem:* The team is mixing these frames without agreeing on which one applies. This leads to talking past each other.
