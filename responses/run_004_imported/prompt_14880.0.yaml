      *   *Point 1: The Broken Specie-Flow (Fiat & Deficits).* Explain why Hume's mechanism looks broken but isn't. It's now exchange rates, not gold flows. But the US exception (exorbitant privilege) would worry him. It looks like "paper credit" on a global scale.
      *   *Point 2: Public Debt & QE.* This is where Hume gets angry. He predicted the destruction of nations via debt. QE confirms his worst fears about "public credit." He would see this as the "death of the nation" scenario he wrote about.
