          *   *Verdict:* He wouldn't be a Bitcoin Maximalist. He'd see it as a useful check, not a replacement.
      *   *Point 4: The "Real" Value Question.* Hume viewed money as a tool for labor and commodities. Bitcoin has no labor backing (in the classical sense). He might view it as a speculative asset rather than money.
