answer: |-
  This is a sophisticated debate that touches on one of the most fascinating pivots in American legal history. Your friend and you have both identified genuine tensions in Douglass's thought, because Douglass himself was navigating a path between legal positivism and natural law.

  To give you a disinterested judgment: **You are closer to the mark regarding his *methodology*, but your friend is closer regarding his *teleology* (purpose).** However, if forced to choose which modern label fits his *argumentative strategy* in the 1860 speech, the evidence leans toward your side of the debate, though with significant caveats that would make Douglass uncomfortable with modern originalism.

  Here is the breakdown of why, and how Douglass would likely navigate the modern landscape.

  ### 1. The Case for You (Original Public Meaning)
  Your argument rests on Douglass's explicit rejection of the "secret intentions" of the Framers. In his 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass makes a move that sounds remarkably like Justice Scalia's textualism.

  *   **Rejection of Legislative History:** Douglass argues that we cannot look at Madison's Notes or private letters to determine what the Constitution means. He writes, "I say that the Constitution... should be interpreted according to its plain reading." He insists that the law is what is *ratified*, not what was *whispered* in the convention. This is the core tenet of Original Public Meaning originalism: the law is the text as understood by the public, not the private hopes of the drafters.
  *   **Rules of Construction:** Douglass insists on applying the "ordinary rules used to construe any legal instrument." He argues that unless a document explicitly sanctions slavery, it must be presumed to favor liberty. This is a textualist canon of construction (specifically, the rule of lenity or a presumption of liberty).
  *   **Fixed Meaning:** Crucially, Douglass does not argue that the Constitution *became* anti-slavery over time. He argues it *always was* anti-slavery, even in 1787, and that the pro-slavery faction had simply hoodwinked the public into reading it incorrectly. This contradicts the "Living Constitution" idea that meaning evolves; Douglass believed the true meaning was fixed but obscured.

  On the mechanics of interpretation, you are right. Douglass was a textualist who believed the "public meaning" of the words, divorced from the racist intentions of the men who wrote them, mandated freedom.

  ### 2. The Case for Your Friend (Living Constitutionalism)
  Your friend's argument rests on the *outcome* and the *moral function* of the document.

  *   **The Moral Reading:** Douglass viewed the Constitution not as a cold contract but as a vehicle for the "Blessings of Liberty." He relied heavily on the Preamble to inform the meaning of the specific clauses. Modern "Living Constitutionalists" (like the late Justice Brennan) often argue that the broad principles of the Constitution (equality, liberty) must be interpreted in light of evolving human dignity. Douglass certainly fits the spirit of using the Constitution to achieve moral progress.
  *   **Rejection of Historical Practice:** While Douglass looked at the text, he explicitly rejected the *historical practice* of the government up to 1860. He argued that just because the government had acted pro-slavery for 70 years didn't make it constitutional. A strict originalist might say, "The historical gloss shows the public understood this to allow slavery." Douglass said, "The historical practice was unconstitutional." This aligns with the Living Constitutionalist view that past injustices shouldn't bind future interpretations of liberty.
  *   **Instrumentalism:** Douglass was a reformer first and a lawyer second. His theory was designed to empower the federal government to crush slavery. If the text didn't allow that, Douglass likely would have found a way to read it that did. Your friend sees this outcome-orientation as evidence of a "living" approach.

  ### 3. The Verdict
  **You win on the technicality, but your friend wins on the spirit.**

  If we are talking about **legal method**, you are closer. Douglass's specific innovation was to separate the *text* from the *intent*. He argued that the "Original Public Meaning" of the words "persons," "citizens," and "liberty" did not include slavery, regardless of what the slaveholding Framers wanted. This is a proto-Scalia argument: *Look at the words, not the men.*

  However, calling Douglass a "Living Constitutionalist" is anachronistic. Living Constitutionalism usually implies that the text's meaning *changes* as society evolves. Douglass argued the meaning was *static* (always anti-slavery) but had been *misread*. He wasn't updating the software; he was claiming the users had been reading the manual wrong since day one.

  ### 4. How Douglass Would Respond to the Modern Debate
  If Frederick Douglass were dropped into a seminar on Originalism vs. Living Constitutionalism, he would likely reject the binary as a false choice. Here is how he would likely respond to the modern camps:

  **To the Originalists (Scalia/Thomas):**
  He would agree with their method but condemn their conclusions. He would say: *"You are right to look at the text and ignore the secret intentions of the Framers. But you are wrong to freeze the 'expected applications' of 1787."*
  Douglass would argue that the Original Public Meaning of "Liberty" in the Preamble is a universal principle that overrides the specific compromises made for slave states. He would criticize modern originalists for conflating "what the text says" with "what the racists of 1787 thought the text would allow." He would argue that the text itself contains the seeds of its own correction.

  **To the Living Constitutionalists (Brennan/Breyer):**
  He would agree with their goals but distrust their methods. He would say: *"You are right that the Constitution must secure justice, but you are wrong to treat the text as malleable."*
  Douglass was deeply suspicious of judges who claimed the authority to update the Constitution based on contemporary values, because those "values" had previously included slavery. He would argue that relying on "evolving standards" is dangerous if the public is still prejudiced. He would insist that the *text itself*, properly read, already commands justice, so you don't need to bend it.

  ### 5. The "Douglassian" Synthesis
  Douglass represents a third category that has largely vanished from modern jurisprudence: **Radical Textualism grounded in Natural Law.**

  *   **Textualist:** The words matter more than the history.
  *   **Natural Lawyer:** The words must be read in light of universal human rights ("the right of all men to liberty").
  *   **Populist:** The Constitution belongs to "We the People," not the elite lawyers or the dead Framers.

  He would likely argue that the debate between Originalism and Living Constitutionalism is a distraction created by lawyers to protect the status quo.
  *   **Originalism** becomes a shield for injustice when it prioritizes the *practices* of the past over the *principles* of the text.
  *   **Living Constitutionalism** becomes a shield for injustice when it allows judges to ignore the text in favor of their own policy preferences.

  **Conclusion:**
  You should tell your friend that while Douglass shared their moral urgency, his *legal argument* was that the Constitution was **originally anti-slavery**. He didn't need a "living" Constitution to abolish slavery; he believed a "faithful" Constitution would have done it decades earlier. Therefore, on the specific question of interpretive method (text/intent vs. evolving meaning), **your assessment is historically more accurate.** Douglass was arguing for a faithful, public-meaning reading of the text, liberated from the corrupt intentions of its authors.

  However, you should concede to your friend that Douglass would have no patience for an originalism that results in injustice. For Douglass, the "plain meaning" of the text *was* justice. If your reading of the text doesn't yield liberty, you aren't reading it plainly enough.
