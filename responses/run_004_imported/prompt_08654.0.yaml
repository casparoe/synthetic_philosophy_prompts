          *   Rejects the "secret intentions" of the Framers (Madison's notes, etc.).
          *   Focuses on the "plain reading" of the text as ratified by the people.
          *   Focuses on the *purposes* stated in the Preamble ("secure the Blessings of Liberty").
          *   Dynamic application: The powers *exist* to be used for liberty, even if previous generations didn't use them that way.

  3.  **Evaluate the "Friend's View" (Living Constitutionalism):**
      *   *Strengths:* Douglass definitely wanted the Constitution to serve moral ends (justice, liberty). He believed the document could evolve or be interpreted in light of higher law principles. He didn't think the Constitution was frozen in 1787 practice.
      *   *Weaknesses:* "Living Constitutionalism" often implies evolving standards *beyond* the text or changing meanings over time based on contemporary values. Douglass argued the meaning was *always* anti-slavery, even if people didn't see it. He wasn't saying "the meaning changes," he was saying "you guys have been reading it wrong from the start."

