      *   *The Leibniz Dispute:* Yes, the Leibniz-Clarke correspondence is the key here. Leibniz accused Newton of making God a bad clockmaker who needs to fix his watch. Newton (via Clarke) argued God needs to be sovereign and active.
      *   *The "Separate Boxes" Theory:* This is the "Conflict Thesis" or a simplistic compartmentalization view. Modern scholarship (especially since the 1940s Keynes auction) rejects this. Newton's work was unified.
