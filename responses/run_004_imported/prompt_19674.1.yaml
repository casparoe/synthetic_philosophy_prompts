answer: |-
  It is a genuine pleasure to speak with someone who has lived inside the Brier score for thirty years. You have the exact right intuition to cut through the philosophical fog, and I suspect you'll find that the "accuracy-first" program is essentially trying to formalize the operational instincts you developed on the forecast floor.

  Your hunch about the geometry is not just close; it is the engine of the proof. The "gap" you heard about is real, and your daughter is absolutely right about Bregman divergences. Let's unpack this without the heavy notation, using the verification mindset you already possess.

  ### 1. The Geometry: The Tent and the Poles

  You suspected that coherent credences form a convex set and that violating the axioms puts you outside that set. This is exactly right.

  Imagine you are forecasting a binary event: Rain (R) or No Rain (~R).
  *   **The Worlds:** There are only two ways reality can turn out. In "World 1," it rains. In "World 2," it doesn't.
  *   **The Vertices:** In accuracy-first epistemology, we treat the "truth" as a probability function that assigns 1 to what happened and 0 to what didn't. So, World 1 is the point $(1, 0)$ and World 2 is the point $(0, 1)$. These are your "omniscient" corners.
  *   **The Probability Simplex:** Any valid probability function must sum to 1 and be non-negative. Geometrically, this is the line segment connecting $(1, 0)$ and $(0, 1)$. If you have three outcomes, it's a triangle (a 2-simplex). If you have $N$ outcomes, it's an $(N-1)$-simplex. Let's call this shape **The Tent**. The corners of the tent are the possible worlds.

  **The Violation:**
  If your credences violate the axioms (e.g., you assign 0.6 to Rain and 0.6 to No Rain), your coordinate is $(0.6, 0.6)$. You are now standing **outside** the Tent.

  **The Domination:**
  The Brier score is mathematically equivalent to the **squared Euclidean distance** between your forecast point and the "Truth" point (the corner corresponding to the actual world).
  *   If World 1 happens, your penalty is the squared distance from $(0.6, 0.6)$ to $(1, 0)$.
  *   If World 2 happens, your penalty is the squared distance from $(0.6, 0.6)$ to $(0, 1)$.

  Here is the geometric theorem that does the heavy lifting: **If you stand outside a convex set (the Tent), there is always a point inside the set that is closer to every vertex (corner) than you are.**

  Think of it like this: If you are standing outside a tent, there is always a spot *inside* the tent that is closer to every single tent pole than where you are currently standing. You don't know which pole represents the actual world, but it doesn't matter. Whichever pole turns out to be "True," the point inside the tent is closer to it than you are.

  By moving from your incoherent $(0.6, 0.6)$ to the coherent $(0.5, 0.5)$, you reduce your distance to $(1,0)$ *and* you reduce your distance to $(0,1)$. You have improved your accuracy in **every possible world**. That is accuracy domination.

  So, your gut was correct: Incoherence puts you outside the convex hull of the truths, and Euclidean distance (Brier) guarantees that projection back into the hull reduces distance to all vertices simultaneously.

  ### 2. Why Strict Propriety is the Load-Bearing Wall

  In operational meteorology, you know we use proper scores to prevent hedging. If a score isn't proper, I can minimize my expected score by reporting a probability different from my true belief.

  In this philosophical argument, strict propriety plays a slightly different but related role. It ensures that the "distance" measure behaves well enough to support the geometric proof.

  1.  **Alignment of Expectation and Accuracy:** Strict propriety guarantees that if you *are* a probability function, you expect yourself to be more accurate than any other function. It makes the probability function the unique minimizer of *expected* inaccuracy.
  2.  **The "Strict" Part:** If the score were merely proper (not *strictly* proper), there might be multiple points that minimize the score. You might find an alternative coherent credence $C^*$ that beats your incoherent $C$, but only ties with it in some worlds rather than beating it in *all* of them.
      *   Domination requires $C^*$ to be **strictly** more accurate than $C$ in **every** world.
      *   Strict propriety ensures the "distance" function is curved enough (strictly convex) that the point inside the tent is *uniquely* closer. It prevents "flat spots" in the geometry where you could move inside the tent without gaining accuracy in a specific world.

  Without strict propriety, the geometry might allow you to step inside the tent and get closer to Pole A, but stay the same distance from Pole B. That wouldn't be domination; that would just be "non-inferiority." To prove you *ought* to be probabilistic, the argument needs to show that being non-probabilistic is *definitely worse*, no matter what happens.

  ### 3. The History: The Gap and the Patch

  Your memory serves you well. There was a significant controversy regarding Jim Joyce's original 1998 paper, *"A Nonpragmatic Vindication of Probabilism."*

  **The Gap:**
  Joyce proposed a set of conditions that a "legitimate" inaccuracy measure should satisfy (he called them "Alethic Veritism"). He argued that any measure satisfying these conditions would yield the domination result.
  However, philosophers Hannes Leitgeb and Richard Pettigrew (around 2010) demonstrated that Joyce's original conditions were not strong enough. They showed that you could construct weird inaccuracy measures that satisfied Joyce's conditions but *failed* to generate the domination result. In those edge cases, an incoherent forecaster might *not* be dominated by a coherent one.

  **The Patch:**
  Pettigrew (and others) tightened the mathematical requirements. They showed that to guarantee the domination theorem, the inaccuracy measure must be a **Bregman Divergence**.

  This is where your daughter comes in.

  ### 4. Bregman Divergences: Jargon or Substance?

  Your daughter is spot on. This isn't just jargon; it's the mathematical substance that makes the geometry work.

  A Bregman divergence is a way of measuring "distance" generated by a strictly convex function.
  *   **Squared Euclidean Distance** (which underlies the Brier Score) is a Bregman divergence.
  *   **Kullback-Leibler Divergence** (which underlies the Log Score) is also a Bregman divergence.

  **Why this matters:**
  The geometric theorem I mentioned earlier—"a point outside a convex set is dominated by its projection inside"—is a specific property of Bregman divergences relative to convex sets. It is not true for just *any* way of measuring distance.

  For example, if you used a "distance" measure that wasn't a Bregman divergence, you could potentially be outside the Tent, step inside, and find that you are closer to the "Rain" corner but *further* from the "No Rain" corner. The Bregman property ensures that the projection onto the probability simplex reduces the divergence to *all* extreme points (vertices) of the simplex.

  So, the philosophical result relies on the fact that the Brier score (and Log score, etc.) belongs to this specific mathematical family. It validates your career-long reliance on the Brier score: it's not just a convenient metric; it has deep geometric properties that link it to the very definition of rational belief.

  ### Summary for the Seminar

  If you go back to that seminar, here is the "gut-level" summary you can offer:

  1.  **The Geometry:** Possible worlds are corners of a shape (simplex). Probabilities are points inside that shape. Incoherent beliefs are points outside.
  2.  **The Score:** The Brier score is squared distance to the corners.
  3.  **The Theorem:** If you are outside a convex shape, there is always a point inside that is closer to *all* corners than you are. (This works because Brier is a Bregman divergence).
  4.  **The Conclusion:** If you violate probability axioms, there is a coherent alternative that is more accurate no matter which world turns out to be real. Therefore, rationality requires obeying the axioms.
  5.  **The History:** Joyce proposed the argument; Pettigrew/Leitgeb showed the math needed to be tighter (Bregman divergences) to ensure the geometry actually holds.

  It is a satisfying circle: the tool you used to ensure your forecasts were honest (Brier) turns out to be the same tool philosophers use to define what "honest belief" means in the first place. The operational and the epistemic are grounded in the same geometry.
