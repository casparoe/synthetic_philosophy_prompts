      Actually, the simplest explanation is: Weak dominance relies on equality in some cases. Eliminating a strategy that creates the equality can change the dominance relation of other strategies.
      Example where order changes the *surviving equilibrium*:
      Game:
            L     R
      T   1,1   1,1
