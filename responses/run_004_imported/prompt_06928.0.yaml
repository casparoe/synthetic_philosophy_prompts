      *   *Did Gödel prove the afterlife?* No. He proved an ontological argument for *God's existence* (modal logic), not specifically personal immortality, though he believed in it. The Incompleteness Theorems are about arithmetic systems, not metaphysics directly.
      *   *Is the leap from "non-mechanical" to "immortal" valid?* No. Even if the mind is non-algorithmic, it could still be dependent on the brain's physical state (dual-aspect theory, emergentism, etc.). Non-computational $\neq$ Immortal.
      *   *Why do philosophers disagree?* Because the premises are contested, the inference is invalid, and the definitions are murky.

  3.  **Structure the Response:**
