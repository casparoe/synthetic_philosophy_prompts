      *   **Address the Incompleteness Theorems (The "Mind vs. Machine" Argument):** Explain the Lucas-Penrose argument. Clarify what Gödel actually said (the disjunction). Explain the counter-arguments (the mind might be inconsistent, or we can't know the system's code).
