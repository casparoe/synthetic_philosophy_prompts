answer: |-
  **MEMORANDUM**

  **TO:** Grounds Policy Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Citation Appeal #2023-44 (E-Scooter) and Proposed Policy Revision

  ### I. Recommendation
  I recommend that the Committee **dismiss Citation #2023-44**.

  While the appellant's e-scooter technically falls within a broad textual reading of "motorized vehicle," the 2019 amendment regarding hoverboards creates sufficient ambiguity regarding personal mobility devices that the benefit of the doubt should accrue to the student. Furthermore, enforcing the citation in this instance contradicts the underlying purpose of the policy: the preservation of the Quad's turf.

  However, dismissing this citation is not a long-term solution. To prevent this Committee from relitigating the "Hart/Fuller" debate every time a new mobility technology emerges (e-bikes, Onewheels, etc.), I propose we adopt the revised policy language outlined in Section IV.

  ### II. Analysis of the Appeal
  The core of this appeal rests on the interpretation of the 2019 amendment: *"as of 2019 this also covers hoverboards."*

  **The Interpretation of the 2019 Amendment**
  Security argues that this amendment was merely clarificatory—that hoverboards were always "motorized vehicles," and the Committee simply added them to remove doubt. Under this reading, "motorized vehicle" is a static category defined by the presence of a motor.

  I argue the opposite. If the term "motorized vehicle" was self-evidently broad enough to capture small, personal, electric stand-up devices in the original policy, the 2019 amendment would have been legally surplusage. The fact that the Committee felt compelled to explicitly add hoverboards suggests that, in 2019, the Committee itself recognized that "motorized vehicle" did *not* automatically capture small personal mobility tech in the common understanding of the campus community.

  This invokes the principle of *expressio unius est exclusio alterius* (the expression of one thing implies the exclusion of others). By specifically naming hoverboards, the Committee signaled that small personal electric devices require explicit enumeration to be prohibited. An e-scooter is functionally analogous to a hoverboard (battery-powered, personal capacity, stand-up operation). Since e-scooters were not added to the list alongside hoverboards, they fall into the same category of ambiguity. In a disciplinary context, policy ambiguity must be resolved in favor of the accused.

  **The Purpose of the Rule**
  The minutes from the original policy adoption indicate the rule was driven by a specific incident: a golf cart damaging the turf. The purpose is weight distribution and turf integrity, not the prohibition of motors *per se*. A 30-pound e-scooter does not pose the same threat to the Quad as a 1,000-pound golf cart or an automobile. To treat them identically is to prioritize the label over the harm the rule was designed to prevent.

  ### III. Engagement with Security's Position
  I want to address Security's argument seriously, as it raises a valid concern regarding the Rule of Law.

  Security contends that "motorized vehicle" has a settled core meaning: if it has a motor and carries a person, it is a vehicle. They argue that if we allow subjective interpretations of "weight" or "purpose," we lose predictability. A student shouldn't have to guess whether their device is "heavy enough" to be banned; they should be able to read the text and know the answer. Security is correct that clear, bright-line rules are essential for fair enforcement. If we dismiss this citation solely on "intent," we risk telling Security to enforce rules based on vibes rather than text.

  Furthermore, Security's point about the 2019 amendment is logically sound: Committees often add specific examples to policies not because the general term *excludes* them, but to prevent exactly this kind of appeal. They may have added "hoverboards" to preempt the argument the appellant is making right now.

  However, while Security's textualism provides consistency, it fails in this specific instance because the technology has outpaced the text. When the text creates a "trap" that catches devices the Committee clearly hadn't considered (and which do not violate the policy's safety purpose), strict enforcement becomes unjust. We cannot punish a student for a gap in our own drafting.

  ### IV. Proposed Policy Revision
  We cannot rely on the term "motorized vehicle" anymore. It is too dependent on evolving technology. We need a policy that protects the **ground** rather than policing the **machine**.

  I propose we replace the current sentence with the following language, which shifts the focus to physical impact and designated zones:

  > **Revised Policy Draft:**
  > "To preserve turf integrity, all motorized vehicles are prohibited on the grass surfaces of the Quad. This prohibition explicitly includes automobiles, motorcycles, golf carts, hoverboards, and electric scooters.
  >
  > **Exception:** Personal Light Electric Vehicles (PLEVs), defined as devices under 50 lbs with a maximum speed of 15 mph (including e-scooters and e-bikes), are permitted on paved pathways surrounding the Quad but must yield to pedestrians. PLEVs are prohibited from operating on grass surfaces regardless of tire type."

  **Why this works:**
  1.  **Clarity:** It explicitly names the contested items (scooters, e-bikes), ending the textual debate.
  2.  **Purpose-Driven:** It distinguishes between the *grass* (which needs protection) and the *paths* (which can handle traffic). This addresses the Appellant's comparison to bicycles.
  3.  **Future-Proofing:** By defining PLEVs by weight and speed, we avoid needing a new amendment every time a new gadget is invented. If it's under 50 lbs, it goes on the path. If it's over 50 lbs (like a golf cart), it's banned entirely.

  ### V. Next Steps
  1.  **Vote:** Move to dismiss Citation #2023-44 based on policy ambiguity and lack of turf damage.
  2.  **Drafting:** Refer the revised policy language above to the Subcommittee on Wording for final polish.
  3.  **Communication:** Security should be instructed to issue warnings rather than citations for e-scooters on the Quad until the new policy is ratified, given the current ambiguity.

  This approach respects the student's reliance on the policy's history, validates Security's need for clear enforcement guidelines, and ultimately protects the University's grounds.
