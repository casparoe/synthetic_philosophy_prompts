answer: |-
  Here are ten Q&A questions designed to challenge the cost-benefit defense of Lewisian Modal Realism. Each includes the initial question, the expected Lewisian response, and a scripted follow-up intended to block the retreat to "theoretical utility."

  ### 1. The Epistemological Challenge (Required)
  **Question:** "Lewis insists that other worlds are causally and spatiotemporally isolated from ours. Yet, we seem to have robust knowledge of modal truths—for instance, that a table could have been made of ice. If knowledge of concrete entities typically requires some causal or counterfactual dependence between the knower and the known, what is the mechanism by which we form reliable beliefs about these isolated concreta? How do we avoid modal skepticism?"

  **Expected Lewisian Response:** "We don't perceive other worlds; we know them via the *Principle of Recombination*. We reason from our knowledge of this world that elements can be rearranged. It's a priori reasoning about the nature of possibility, not empirical observation of other worlds."

  **Follow-up:** "But the Principle of Recombination is itself a claim *about* the plurality of worlds. If we cannot causally interact with the domain the principle describes, what guarantees the reliability of that reasoning? If you concede we have no causal access, aren't you admitting that our modal beliefs are, relative to your ontology, accidentally true? If the theory entails that our modal knowledge is inexplicably reliable, doesn't that epistemic cost outweigh the theoretical benefit of unification?"

  ### 2. The Counterpart Problem (Required)
  **Question:** "Consider the claim 'Humphrey could have won the election.' On your view, this is true only because a *counterpart* of Humphrey won in another world, not Humphrey himself. Doesn't this change the subject? When I fear death, I fear *my* non-existence, not the non-existence of my counterparts. If counterpart theory cannot account for the *de se* nature of modal concern, hasn't it failed to capture the very phenomenon it was meant to analyze?"

  **Expected Lewisian Response:** "It captures the truth conditions perfectly. Our concern extends to counterparts because they are sufficiently similar to us. We care about them *as if* they were us, which is all that matters for the logic of attitudes."

  **Follow-up:** "But 'as if' isn't identity. If I am literally distinct from my suffering counterpart, why is it rational for me to have *self-regarding* attitudes toward them? If you must add a separate psychological theory to explain why we care about distinct individuals, haven't you lost the theoretical simplicity you promised? Does the cost-benefit analysis still hold if you need auxiliary hypotheses to explain basic modal emotions?"

  ### 3. Island Universes (Required)
  **Question:** "Lewis originally individuated worlds by spatiotemporal relatedness: everything spatiotemporally related is in the same world. But you've acknowledged Lewis's later worry about 'island universes'—cases where two disconnected spacetimes exist. If spatiotemporal unity isn't necessary for world-mates, what principle individuates worlds? Is the boundary between 'one world with islands' and 'two worlds' vague?"

  **Expected Lewisian Response:** "Lewis conceded that island universes are possible. We can adjust the definition of a world to allow for disconnected regions within a single world if they share a common origin or natural laws."

  **Follow-up:** "If the criterion for world-constitution shifts from strict spatiotemporal connection to something like 'common origin' or 'lawful similarity,' aren't you reintroducing the very modal notions you were trying to reduce? You're using modality to define worlds, but worlds were supposed to reduce modality. If the individuation of your ontology presupposes the concepts it's meant to analyze, isn't the analysis circular?"

  ### 4. Ethical and Practical Bite (Required)
  **Question:** "If every way a world could be is a way some world *is*, then every tragedy that could happen *does* happen somewhere. Given that Lewis insists 'actual' is merely indexical, like 'here,' on what basis do we privilege the suffering in *this* index over the suffering in others? If all worlds are equally real, does modal realism commit us to a form of ethical fatalism, or must we claim our local index is morally privileged?"

  **Expected Lewisian Response:** "Ethics is about causal influence. I can only affect events in my own world. The suffering of counterparts is real, but it is not my responsibility because I cannot causally reach them."

  **Follow-up:** "But if 'actual' is indexical, then 'my responsibility' is indexical too. From the God's-eye view of the ontology, the suffering is equally real. If the theory tells us that the totality of reality contains maximal suffering regardless of what we do, doesn't that undermine the motivational force of morality? If the theoretical benefit is unification, but the practical cost is nihilism about the significance of choice, is the trade-off still worth it?"

  ### 5. Qualitative vs. Quantitative Parsimony
  **Question:** "Defenders of modal realism often argue that while the view lacks *quantitative* parsimony (it posits many worlds), it maintains *qualitative* parsimony (the worlds are all the same *kind* of thing). But doesn't multiplying concrete entities infinitely introduce a theoretical complexity that burdens our ideology, even if our ontology is uniform? Why should we think quantitative bloating is theoretically free?"

  **Expected Lewisian Response:** "Theoretical virtue lies in the simplicity of the *kinds* of things posited, not the number. Physics posits infinite electrons; that doesn't make the theory complex. The ideology is simple because the logic is standard and the ontology is homogeneous."

  **Follow-up:** "In physics, infinite electrons are posited to explain finite data. Here, infinite worlds are posited to explain linguistic intuitions. If the quantitative bloat leads to the epistemological problems we discussed in question one, then quantitative parsimony *does* matter. Can you maintain that quantitative cost is irrelevant when it directly generates epistemic skepticism?"

  ### 6. The Probability Problem
  **Question:** "If every possible outcome of a chancy event occurs in some world, how do you make sense of probability? If I flip a coin, heads occurs in some worlds and tails in others. It seems the probability of heads is 1 (it happens somewhere) or 0 (it doesn't happen here). How does modal realism recover the notion of objective chance without collapsing it into mere frequency across worlds?"

  **Expected Lewisian Response:** "We weight worlds by their similarity to ours. Probability is the measure of the set of worlds where the event occurs, weighted by similarity. It's not just counting worlds; it's measuring the 'size' of the possibility space."

  **Follow-up:** "Where does that measure come from? If it's not derived from the frequency of events (since all events happen), it must be primitive. If you have to posit a primitive measure over worlds to explain chance, haven't you just pushed the mystery of probability back a step? Does the theory really explain chance, or does it just relocate it?"

  ### 7. The Possibility of Nothing
  **Question:** "One intuitive modal claim is that there could have been nothing at all. But if worlds are concrete spatiotemporal systems, an 'empty world' seems impossible. A world with no concreta is not a concrete world. Does modal realism entail that it is *necessary* that something exists, thereby contradicting a common modal intuition?"

  **Expected Lewisian Response:** "Lewis argued that there is no world with nothing, because a world is a maximal mereological sum of spatiotemporally related individuals. The possibility of nothing is rejected or analyzed as a limit case."

  **Follow-up:** "So the theory forces us to revise our modal intuitions to fit the ontology, rather than vice versa. If the cost-benefit analysis relies on the theory capturing our modal discourse, but it fails to capture the intuition that 'nothing might have existed,' isn't that a significant explanatory failure? How much of our pre-theoretic modality are we allowed to lose before the 'benefit' side of the ledger is empty?"

  ### 8. Humean Supervenience and Intrinsic Nature
  **Question:** "Lewis is committed to Humean Supervenience: the idea that everything supervenes on the local qualitative character of points in spacetime. But if counterparts are determined by similarity relations, and similarity is context-dependent and external, doesn't counterpart theory violate Humean Supervenience? Isn't what is true of Humphrey dependent on relations to things outside his world?"

  **Expected Lewisian Response:** "Counterpart relations are grounded in the intrinsic properties of the individuals. The context-dependence is pragmatic, about how we *talk*, not about the metaphysical ground of the truth."

  **Follow-up:** "If the truth conditions of 'Humphrey could have won' depend on a context-sensitive counterpart relation, then the truth isn't fixed solely by the intrinsic arrangement of worlds. It depends on *our* conversational context. If the metaphysics of modality depends on our linguistic practices, haven't you abandoned the robust realism you started with? Is this really realism, or a form of projectivism?"

  ### 9. Propositional Attitudes and Fine-Grainedness
  **Question:** "On your view, propositions are sets of possible worlds. But this makes all necessary truths identical (they are the set of all worlds). Yet, I can believe that 2+2=4 without believing Fermat's Last Theorem, even before it was proven. If your theory identifies these propositions, doesn't it fail to account for the fine-grained content of thought?"

  **Expected Lewisian Response:** "We can handle this by appealing to structured propositions or by analyzing belief as a relation to sentences in a language of thought, rather than directly to sets of worlds. The set-of-worlds view is for coarse-grained content."

  **Follow-up:** "But if you need to posit a 'language of thought' or structured propositions to handle the actual data of cognitive science, what work is the set-of-worlds view actually doing? If the heavy lifting is done by the structured account, isn't modal realism just an idle wheel? Where is the theoretical unification if the core account of content has to be abandoned for psychology?"

  ### 10. Falsifiability and Empirical Immunity (Required Final Question)
  **Question:** "To conclude: Modal realism posits a vast plurality of concrete entities. Yet, by definition, none of them can interact with us. What observation, experiment, or argument could actually count *against* modal realism? If the view is constructed such that no empirical evidence can disconfirm it, are we doing metaphysics, or have we defined a framework that is immune to reality?"

  **Expected Lewisian Response:** "It's not immune to reality; it's subject to theoretical virtues. If a rival theory (like ersatzism) provides the same unification with less ontological cost, that counts against it. It's abductive inference to the best explanation."

  **Follow-up:** "But if the 'cost' is ontological bloat that we can't measure, and the 'benefit' is unification of intuitions that the theory itself revises (as we saw with Humphrey and Empty Worlds), what constrains the abduction? If no empirical state of affairs could falsify the existence of other worlds, isn't the 'inference to the best explanation' just a label for consistency with our own definitions? If the theory is empirically sterile, why should we think it tells us about *reality* rather than just about our language?"
