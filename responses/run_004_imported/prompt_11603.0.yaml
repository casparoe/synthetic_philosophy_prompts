answer: |-
  Your friend has done their homework. This is a much deeper cut than the usual "Two Dogmas" or "Gavagai" discussion, and your intuition that the argument feels like it might "prove too much" is actually a very standard and strong objection to Quine's metaethics.

  The essay in question is indeed **"On the Nature of Moral Values,"** found in *Theories and Things* (1981). Your friend's summary is broadly accurate, but the nuance lies in *why* the lack of an observation-sentence anchor matters more for ethics than for theoretical physics or history.

  Here is a reconstruction of Quine's reasoning, a defense against your objection, and a classification of his metaethical stance.

  ### 1. Reconstructing the Argument: The Web and the Periphery

  To understand Quine's move on ethics, you have to look at his epistemology first. Quine views our knowledge as a **web of belief**.
  *   **The Periphery:** This consists of **observation sentences** (e.g., "Red here now," "It is raining"). These are directly conditioned by sensory stimulation. They are the "tribunal of experience."
  *   **The Interior:** This consists of theoretical claims (e.g., "Electrons exist," "Caesar crossed the Rubicon"). These are not directly tested by sensation. They are tested *holistically*. We keep them because they help us predict and organize the observation sentences at the periphery.

  **The Ethical Problem:**
  Quine argues that moral statements (e.g., "Stealing is wrong") look like they belong in the web, but they lack the specific functional role that gives the web its empirical content.
  1.  **Scientific claims** (even abstract ones) are retained because they facilitate the prediction of observation sentences. If a physics theory consistently fails to predict observable outcomes, we revise the theory.
  2.  **Moral claims** are not retained because they predict sensory stimulation. They are retained because they serve a **social function** (cohesion, conflict resolution, behavioral conditioning).

  Quine's point in "On the Nature of Moral Values" is that while moral sentences are grammatically indicative ("Stealing *is* wrong"), they do not function as truth-apt descriptions of the world in the way science does. They are more like **dispositions to behavior**.

  ### 2. Addressing Your Objection: Why Ethics and Not History?

  Your pushback is the strongest part of your position: *"Tons of ordinary empirical claims... are pretty far removed from any observation sentence too... so why does ethics specifically get disqualified?"*

  Quine has a specific answer to this, relying on the distinction between **inferential distance** and **categorical linkage**.

  **The Case of History/Physics (Inferential Distance):**
  When we say "Caesar crossed the Rubicon," we are far from direct observation. However, there is a **causal chain** connecting that claim to sensory stimulation.
  *   The event caused physical traces (documents, ruins).
  *   Those traces cause sensory stimulations in archaeologists/historians today.
  *   If the claim were false, the pattern of sensory stimulations (the evidence) would likely be different.
  *   Therefore, the claim is answerable to the "tribunal of experience," even if indirectly.

  **The Case of Ethics (Categorical Linkage):**
  When we say "Caesar was wrong to cross," Quine argues there is no corresponding causal chain to sensory stimulation regarding the *wrongness*.
  *   We can observe the crossing (factual).
  *   We can observe people *reacting* with disapproval (sociological fact).
  *   But the *wrongness* itself does not cause sensory stimulation.
  *   Crucially, if you change the moral claim ("Caesar was right"), it doesn't necessarily change the predicted sensory observations of the world in the way changing a physics claim does.

  For Quine, the difference isn't how *far* you are from the periphery; it's whether you are **tethered** to it at all. Theoretical science is tethered by prediction and explanation of physical stimuli. Ethics is tethered by **sentiment and social conditioning**.

  So, ethics isn't disqualified because it's "abstract"; it's disqualified because its connection to the world is **normative/prescriptive** rather than **descriptive/causal**.

  ### 3. Classifying Quine's Metaethics

  Where does this leave Quine? He isn't a Logical Positivist (who would call moral sentences "meaningless"), but he isn't a Moral Realist either.

  **A. Naturalistic Non-Cognitivist**
  Quine is best classified as a **naturalistic non-cognitivist**.
  *   **Non-Cognitivist:** He believes moral sentences do not state facts that can be true or false in the scientific sense. They express attitudes or prescribe behavior.
  *   **Naturalistic:** He doesn't think this makes them "spooky." Moral values are real phenomena *within* nature, but they are properties of human psychology and sociology, not properties of the external universe.

  **B. Not Quietist**
  He isn't agnostic or quietist (refusing to rule). He is quite explicit: moral values are not part of the "ontology of science." In *Theories and Things*, he writes that moral traits are "no part of the world's ontology" in the sense that electrons are. They are part of our "conceptual scheme" for managing behavior.

  **C. The "Naturalization" Nuance**
  Your friend noted Quine didn't think ethics could be "naturalized into a theory on a par with science." This is slightly tricky.
  *   Quine *does* think ethics can be studied naturalistically (by psychology and sociology). We can study *why* humans have moral values.
  *   He *denies* that ethics can be naturalized as a **normative science**. You cannot derive an "ought" from an "is" using the methods of physics. There is no "moral physics" that discovers moral laws in the way we discover laws of motion.

  ### 4. Summary of the View's Shape

  If you want to visualize Quine's position to settle the debate:

  1.  **Science:** A map of the territory. It gets revised when the territory (sensory input) contradicts the map.
  2.  **Ethics:** The rules of the road trip. They aren't trying to map the territory; they are trying to keep the passengers from killing each other.
  3.  **The Conflict:** Your friend is right that Quine thinks ethics lacks the "observation sentence" anchor. You are right that this seems harsh. Quine's resolution is that ethics isn't *failed science*; it's a *different tool entirely*.
  4.  **The Verdict:** Moral statements aren't "false" (like an Error Theorist might say); they are **truth-valueless** in the scientific sense, though they have **social validity**.

  ### How to Win (or End) the Argument

  If you talk again, here is the pivot point:

  Ask your friend: **"Does Quine think moral statements are *false*, or does he think they aren't the *kind of thing* that can be true?"**

  *   If they say **false**, they are interpreting him as an Error Theorist (like J.L. Mackie).
  *   If they say **not the kind of thing**, they are interpreting him as a Non-Cognitivist/Expressivist (like Ayer or Blackburn).

  Quine is firmly the latter. He writes in that essay: *"Moral traits... are no part of the world's ontology... but they are traits of us, and we are part of the world."*

  Your objection about history holds water *only if* you assume all knowledge must look like physics. Quine's reply is that history *does* look like physics (it posits causes for physical traces), whereas ethics looks like **conditioning**. The lack of an observation-sentence analogue is damning for ethics specifically because ethics claims to be normative, yet lacks the empirical anchor that allows naturalism to validate normative claims in science (like the "norms" of logical inference, which Quine thinks *are* empirically grounded in successful prediction).

  **Verdict:** Your friend is right about the text, but you are right to feel the tension. Quine's view is that ethics is **objectively subjective**. It is a real feature of human animals, but not a real feature of the universe those animals inhabit.
