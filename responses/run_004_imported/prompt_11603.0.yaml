prompt: |-
  Okay so I was out with a friend of mine last night (he's finishing a philosophy MA, I just read around this stuff for fun) and we ended up spending like an hour and a half argueing about Quine of all people. Not the stuff everyone always brings up -- indeterminacy of translation, "two dogmas," ontological relativity -- he mentioned that later in his career Quine also wrote directly about ethics and moral values (I think the essay is literally called "On the Nature of Moral Values," maybe reprinted in Theories and Things?) and that his actual take is way more deflationary than I expected from someone so committed to naturalism.

  The way my friend described it, Quine's move is to compare moral statements to what he calls "observation sentences" -- the sentences most directly hooked up to sensory stimulation, the ones that, through some long chain, let even really abstract physics face the tribunal of experience, but only holistically, as a corporate body rather than one sentence at a time. His argument (secondhand, so I might be mangling it) is that value statements have no analogue of an observation sentence anchoring them to anything, so moral discourse can never really face that tribunal the way scientific discourse does -- and that's supposedly why Quine didn't think ethics could be "naturalized" into a theory on a par with science, even though he stops well short of just saying moral sentences are meaningless like the old logical positivists would.

  I pushed back that this seems to prove too much or too little: tons of ordinary empirical claims (about other minds, or history, or whatever) are pretty far removed from any observation sentence too, and we dont usually say THOSE can't count as knowledge, so why does ethics specifically get disqualified? Neither of us had the text in front of us to check, so we just went in circles. Can you help me reconstruct what Quine's actual reasoning is supposed to be here (assuming my friend basically got it right), why lacking an observation-sentence analogue would be uniquely damning for moral discourse rather than just for anything sufficiently abstract or theoretical, and whether this ends up making him something like a non-cognitivist about ethics, or more just an agnostic/quietist who refuses to rule on the matter one way or the other? I'd like to actually understand the shape of the view rather than just guess based on what I know of his epistemology generally.
