      10. Falsification (The closing question).

      *Wait, I need to make sure the follow-ups are sharp.*
      *Example:* If he dodges the Toxin question by saying "The payoff structure is different," the follow-up should be "But the *rational agent's relationship to their future self* is the core issue in both. Why does FDT bind you in one timeline but liberate you in the other?"

      *Let's finalize the wording.*

  5.  **Review against constraints:**
      *   8-10 questions? (I will aim for 10 to be safe).
      *   Imperfect predictor included? (Q1).
      *   "Controlling" prediction included? (Q2).
      *   Kavka's Toxin included? (Q3).
      *   Evidence of wrongness included? (Q10).
      *   Follow-ups included? (Yes).

