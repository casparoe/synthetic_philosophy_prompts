answer: |-
  Here are 10 interview questions designed to press past the standard introductory material and into the structural weaknesses and metaphysical commitments of Functional Decision Theory (FDT).

  ### 1. The Threshold of Obligation
  In the standard Parfit's Hitchhiker setup, the driver is a perfect predictor. But suppose the driver is only 90% accurate. At what point does the FDT prescription to "pay up" degrade? If the driver is barely better than chance, does FDT still demand I pay, or does it converge with Causal Decision Theory (CDT) and tell me to free-ride? If it converges, is there a sharp cutoff, or does the obligation fade linearly with accuracy?

  *   **Likely Dodge:** He may argue that expected utility calculations simply shift gradually, so there's no "cutoff."
  *   **Follow-up:** "If it's just a standard expected utility calculation based on probability, what work is FDT actually doing there? I'm asking if the *logical obligation* to pay exists independently of the probability, or if FDT collapses into evidential reasoning once imperfection is introduced."

  ### 2. The Metaphysics of "Control"
  FDT relies on the idea that my choice now controls the output of the driver's prediction yesterday, because both are instantiations of the same function. But the prediction is a physical event in the past that has already occurred. When you say my current choice "controls" it, are you positing a retrocausal influence, or are you redefining the word "control" to mean something like 'logical correlation'? If it's the latter, why should a rational agent care about logical correlations that have no causal lever to pull?

  *   **Likely Dodge:** He will likely insist this isn't retrocausality, but rather "atemporal logical dependence."
  *   **Follow-up:** "Okay, but decision theory is a guide to *action*. If my action cannot causally alter the world state, only my map of logical connections, why is 'winning' defined by satisfying a logical constraint rather than physically altering the environment?"

  ### 3. The Toxin Puzzle Divergence
  In Kavka's Toxin Puzzle, an agent gets paid for *intending* to drink a toxin, not for actually drinking it. CDT says don't drink. FDT agrees: don't drink. But in Hitchhiker, FDT says you *must* pay. In both cases, the reward is secured by a prediction made before the action. Why does FDT bind you to follow through on the payment in Hitchhiker, but liberate you from following through on the toxin? What structural difference prevents FDT from treating the payment like the toxin—a sunk cost once the prediction is made?

  *   **Likely Dodge:** He may argue that in Hitchhiker, *not* paying proves you were never the type who would pay, whereas in Toxin, drinking doesn't change the intention.
  *   **Follow-up:** "But at the moment of decision in town, the prediction is already fixed in both cases. If I'm truly the 'type who pays,' I've already won the ride. Why isn't keeping the money the rational move for that type, just as not drinking is the rational move for the toxin intender?"

  ### 4. Algorithmic Identity
  FDT requires identifying which other systems are running the "same decision function" as you. But human brains are messy, analog, and noisy. How similar must a predictor's simulation be to count as the same function? If the driver simulates me with 99% fidelity but makes a typo in the code, am I logically linked to that simulation? Who decides the granularity of 'sameness'?

  *   **Likely Dodge:** He might say we deal with idealized agents or that "sufficient similarity" is context-dependent.
  *   **Follow-up:** "If 'sufficient similarity' is context-dependent, doesn't that make the theory vulnerable to gerrymandering? Can't I just define my algorithm narrowly enough to escape logical correlation whenever it's inconvenient?"

  ### 5. Evolutionary Viability
  If FDT is the superior normative theory for winning in high-stakes coordination problems, why haven't evolutionary pressures selected for FDT-like heuristics more aggressively? Humans seem naturally prone to CDT-style defection in one-off dilemmas. Is FDT a technology we have to build artificially, or are you claiming humans are already intuitive FDT agents who just get the philosophy wrong?

  *   **Likely Dodge:** He may argue that evolution is slow and hasn't caught up to modern game theory, or that humans *are* FDT in tribal contexts.
  *   **Follow-up:** "If humans are FDT in tribal contexts but CDT in modern ones, doesn't that suggest FDT relies on specific environmental structures (like repeated interaction) rather than universal logical truths?"

  ### 6. The Phenomenology of Regret
  When an FDT agent pays the driver in town, they know the money is gone and the ride is secured regardless of the payment. A CDT agent feels regret paying. Does an FDT agent feel regret? If not, how do you square that with the fact that, counterfactually, they would have had more money if they were the sort of agent who could defect?

  *   **Likely Dodge:** He will likely say FDT agents don't feel regret because they know they made the only winning choice.
  *   **Follow-up:** "But they *did* lose the money. If the definition of 'winning' requires me to be indifferent to losing resources that I could have kept via a different decision algorithm, aren't you defining 'winning' as 'satisfying FDT' rather than 'maximizing resources'?"

  ### 7. Computational Tractability
  To apply FDT, I need to evaluate the logical consequences of my algorithm's output across all instantiations. But determining logical equivalence is often undecidable (the Halting Problem). Is FDT actually computable for any agent with finite processing power, or is it strictly a theory for hyper-computers?

  *   **Likely Dodge:** He may concede it's idealized but argues it's a useful regulative ideal.
  *   **Follow-up:** "If it's not computable for humans or current AI, in what sense is it a 'decision theory' rather than a metaphysical claim about what an omniscient agent would do?"

  ### 8. FDT vs. FDT Conflicts
  Most discussions pit FDT against CDT. But what happens when two FDT agents meet with conflicting goals and different priors about each other's source code? Do they enter an infinite loop of simulating each other? Is there a stable equilibrium for FDT-vs-FDT bargaining, or does the requirement to model the other's decision function lead to computational deadlock?

  *   **Likely Dodge:** He might reference "superrationality" and claim they will cooperate to avoid mutual loss.
  *   **Follow-up:** "Superrationality assumes symmetric payoffs. If one FDT agent has a commitment to dominate the other, does FDT provide a mechanism to resolve that, or does it just guarantee a crash?"

  ### 9. The Black Box Problem
  In AI safety, we worry about opaque neural nets. If an AI runs FDT, it needs to know its own source code to evaluate logical correlations. But if the AI is a learning system that modifies its own weights, does it have stable access to its 'decision function'? If the function changes during the evaluation, does the logical correlation break?

  *   **Likely Dodge:** He may argue the AI should model itself as a static function for the sake of the decision.
  *   **Follow-up:** "But if the model is static and the reality is dynamic, isn't the AI acting on a false premise about its own nature? How does FDT handle self-modifying agents?"

  ### 10. Falsification Conditions
  Finally, let's talk about being wrong. We've discussed where FDT wins. What specific scenario, formal proof, or empirical outcome would convince you that FDT is *not* the correct normative framework? Is there a case where FDT systematically loses resources to a CDT agent, or is the theory structured such that any loss is defined as a failure of implementation rather than theory?

  *   **Likely Dodge:** He might say FDT never loses where CDT wins, so only a formal contradiction would falsify it.
  *   **Follow-up:** "If the only falsification condition is a mathematical contradiction, and the theory interprets all real-world losses as 'implementation errors,' aren't you protecting the theory from empirical refutation by definition?"
