prompt: |-
  I write about science and ideas for a living, and next week I'm interviewing a decision theorist who's a committed defender of functional decision theory -- the view that in Parfit's hitchhiker you really should pay the driver once you're safe in town, because the agent whose rationality actually matters isn't "you, right now," but the decision function that got you predicted as trustworthy in the first place. Can you draft me 8-10 interview questions that don't just let him re-explain the setup? I want at least one question on what happens once the driver's an imperfect predictor (say, right 9 times out of 10) and whether "pay up" still holds, one that makes him spell out what it even means to say your choice "controls" a prediction the driver already made before you opened your mouth, and one that forces a comparison to Kavka's toxin puzzle -- if committing to pay is rational, why isn't committing to drink a toxin you'll have zero reason to actually drink later also rational? End with a question about what would actually count as evidence hes wrong. For each question throw in a quick follow-up keyed to whatever dodge he's most likely to reach for first.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Target:** A decision theorist defending Functional Decision Theory (FDT).
      *   **Context:** Interview for a science/ideas publication.
      *   **Goal:** 8-10 questions that go beyond basic explanations of FDT/Parfit's Hitchhiker.
      *   **Specific Requirements:**
          *   One question on imperfect predictors (90% accuracy).
          *   One question on the metaphysics/causality of "controlling" a past prediction.
          *   One question comparing FDT to Kavka's Toxin Puzzle.
          *   End with a question on falsification/evidence against FDT.
          *   Include a "follow-up" for each question targeting likely dodges.
      *   **Tone:** Intellectual, probing, respectful but rigorous (suitable for a professional writer interviewing an expert).

  2.  **Deconstruct Functional Decision Theory (FDT):**
      *   *Core Idea:* Agents should act as if they are selecting the output of their decision algorithm, which is logically correlated with other instances of that algorithm (including simulations or predictions).
      *   *Key Cases:* Newcomb's Problem, Parfit's Hitchhiker, Prisoner's Dilemma (vs. CDT/EDT).
      *   *Controversies:* "Magic" causality (influencing the past), computational complexity, definition of "logical correlation," relationship to precommitment.
      *   *Key Figures:* Eliezer Yudkowsky, Nate Soares (MIRI).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Imperfect Predictor (Required).*
          *   *Idea:* In Hitchhiker, if the driver is 90% accurate, does FDT still say pay? Where is the cutoff?
          *   *Draft:* If the driver is only 90% accurate, do you still pay?
          *   *Refinement:* Make it about the threshold. Does the obligation degrade linearly?
          *   *Follow-up:* If he says "it depends on the expected utility," push on the *reason* for paying. Is it still about logical correlation or just standard expected value?

      *   *Question 2: Controlling the Past (Required).*
          *   *Idea:* How can my choice now change a prediction made yesterday?
          *   *Draft:* How do you control the past?
          *   *Refinement:* Focus on the "logical substrate." It's not time travel, it's logical identity. But make him explain the *mechanism* without jargon.
          *   *Follow-up:* If he says "it's not causality," ask why we use decision theory if not to guide causal interventions.

      *   *Question 3: Kavka's Toxin (Required).*
          *   *Idea:* Toxin puzzle is about intending to drink but not drinking. FDT is about committing to pay and paying. What's the diff?
          *   *Draft:* Why is Hitchhiker different from Toxin?
          *   *Refinement:* Focus on the *execution*. In Toxin, you get the money for *intending*. In Hitchhiker, you get the ride for *being the type who pays*. FDT says you must actually pay. Why the asymmetry?
          *   *Follow-up:* If he says "Toxin is about intention, Hitchhiker is about action," press on the *moment of action*. At the moment of drinking/paying, the reward is already secured/lost.

      *   *Question 4: Falsification (Required).*
          *   *Idea:* What proves you wrong?
          *   *Draft:* How do we know you're wrong?
          *   *Refinement:* Make it empirical or formal. Is there a scenario where FDT loses to CDT consistently?
          *   *Follow-up:* If he says "FDT always wins," ask about computational costs or undefined logical correlations.

      *   *Question 5: The "Algorithm" Definition.*
          *   *Idea:* FDT relies on "same algorithm." But brains aren't digital code.
          *   *Refinement:* How do we determine similarity? Is a human and a simulation running the "same" function?
          *   *Follow-up:* If he says "sufficiently similar," ask who decides the threshold.

      *   *Question 6: Evolution/Biology.*
          *   *Idea:* Did evolution select for FDT?
          *   *Refinement:* If FDT is superior, why are most humans CDT-ish? Or are they FDT?
          *   *Follow-up:* If he says "humans are messy," ask if FDT is normative or descriptive.

      *   *Question 7: Bargaining/Cooperation.*
          *   *Idea:* FDT in multi-agent scenarios.
          *   *Refinement:* What happens when two FDT agents meet with conflicting goals? (Superrationality).
          *   *Follow-up:* If he says "they cooperate," ask about asymmetric power or different priors.

      *   *Question 8: Regret.*
          *   *Idea:* Paying the driver feels like a loss.
          *   *Refinement:* Does an FDT agent feel regret paying the driver?
          *   *Follow-up:* If he says "no," ask about the phenomenology of rationality.

      *   *Question 9: Implementation/Computation.*
          *   *Idea:* Is FDT computable?
          *   *Refinement:* Halting problems. Logical uncertainty.
          *   *Follow-up:* If he says "idealized agent," ask about relevance to humans.

      *   *Question 10: The "Why Care?" Question.*
          *   *Idea:* Practical impact.
          *   *Refinement:* Does this change AI safety or just philosophy?
          *   *Follow-up:* If he says "AI safety," ask for a concrete mechanism.

      *(Self-Correction during drafting)*: I need to ensure the tone isn't hostile but intellectually demanding. The follow-ups need to be specific to the likely "standard defense" an FDT proponent would use.

      *Refining Question 3 (Toxin):* This is tricky. Kavka's Toxin is usually a counter to *precommitment* theories. FDT argues you *are* the algorithm. In Toxin, you get the reward for the *prediction* of your action. In Hitchhiker, you get the reward for the *prediction* of your action, but you must *execute* the action to be the type who was predicted. Wait, in Hitchhiker, if you don't pay, you were the type who wouldn't pay. In Toxin, if you don't drink, you were the type who *would* drink (because you got the money for intending). The distinction is crucial. FDT says you pay in Hitchhiker. FDT says you *don't* drink in Toxin (because drinking has no causal benefit and the reward is already secured). I need to make sure the question highlights this apparent inconsistency in "following through."
      *Correction:* Actually, FDT proponents argue you *don't* drink the toxin. The question should challenge *why* the logic diverges. In Hitchhiker, paying confirms the logical fact that got you rescued. In Toxin, drinking doesn't confirm the logical fact that got you the money (the intention did). I need to ask why the "logical fact" requires physical execution in one case but not the other.

      *Refining Question 2 (Metaphysics):* Avoid asking "is this magic?" Ask about the *dependency relation*.

      *Refining Question 1 (Imperfect):* Focus on the "tipping point."

  4.  **Final Polish:** Check constraints. 8-10 questions? Yes. Specific topics covered? Yes. Follow-ups included? Yes. Tone appropriate? Yes.

      *Let's build the list.*
      1. Imperfect Predictor (Hitchhiker variant).
      2. Metaphysics of Logical Correlation.
      3. Kavka's Toxin Comparison.
      4. Algorithm Identity (What counts as "same function"?).
      5. Evolutionary Argument (Why aren't we all FDT?).
      6. Regret and Phenomenology.
      7. Computational Tractability.
