          *   *Ben:* If I can't compare, I must choose based on will/preference, not reason.
          *   *Alex:* If they are on a par, reason runs out, but I can *create* reasons through commitment.
          *   *Ben:* That sounds like the same outcome (willpower) dressed up in different metaphysics.
          *   *Alex:* No, one sees the choice as a failure of reason (Ben), the other as an opportunity for agency (Alex).
      *   **The Climax/Stalemate:**
