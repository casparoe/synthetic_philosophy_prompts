      *   The Choice: Job A (High pay, boring, stable) vs. Job B (Lower pay, meaningful, risky). Classic trade-off.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the dilemma. Casey explains the stalemate.
      *   **Opening Salvo:** Alex introduces Parity. Ben introduces Incomparability.
      *   **The Small Improvement Argument (SIA):** This is crucial for Chang's view.
          *   *Alex's move:* If A and B were equal, a slight improvement to A (A+) would make A+ better than B. But in hard choices, A+ isn't clearly better than B. Therefore, not equal. Since not better/worse, must be "on a par."
