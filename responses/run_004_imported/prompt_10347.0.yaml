      *   **Ben (Incomparabilist):** Skeptical, analytic, prefers ontological parsimony. Sees "parity" as a category error. Cool but engaged.
      *   **Casey (The Friend):** The software engineer (implied context), facing the choice. Needs to be present but mostly the catalyst for the debate. Let's make Casey the one who invited them.

  3.  **Setting the Scene:**
