prompt: 'Since retiring after a long career in field biology, I have recently been
  reading Ian Hacking on the "looping effects" of psychiatric classification: his
  observation that labeling someone autistic, or as suffering from multiple personality
  disorder, can itself change their behavior, self-understanding, and even how the
  diagnostic category is later revised — a feedback loop with no counterpart for what
  he calls "indifferent kinds," such as rock strata or chemical elements. This looks
  to me like a fairly direct argument that psychiatric diagnoses, unlike diagnoses
  in the rest of medicine, do not track anything objectively real about the patient;
  they are simply labels that, once applied, self-fulfillingly produce the very condition
  they claim to describe. Is that the right conclusion to draw from Hacking''s account,
  or does his notion of looping effects leave room for these categories still to pick
  out something real?'
