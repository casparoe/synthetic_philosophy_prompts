      *   Check that the Lasonen-Aarnio reference is handled carefully (she's known for "Unreasonable Knowledge" type views where rationality allows sticking to knowledge despite evidence).

      *(Self-Correction during drafting)*: I need to be careful not to say Good's Theorem is *wrong*. It's a mathematical theorem. The conflict is in the *application*. Good's theorem applies to agents who update by conditionalization. If the Dogmatist says "I will not conditionalize on this evidence because I know it's false," then Good's theorem's preconditions aren't met. That's a key insight.

