          *   Wait, Good's theorem says "Free Evidence". It assumes the evidence is *available*, not necessarily *true*. But it assumes the *process* of receiving it improves expectation.
          *   Actually, the key with Lasonen-Aarnio is often about *defeat*. She argues knowledge can persist even with misleading evidence.
          *   Let's stick to the core tension: Good's theorem assumes you will conditionalize. Dogmatism says you shouldn't conditionalize on misleading evidence.

      *   *Refining the Jehle/Weatherson point:*
          *   They try to formalize Dogmatism in Bayesian terms.
