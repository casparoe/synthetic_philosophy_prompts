answer: |-
  You and your second friend are thinking about this correctly. Your first friend is falling for a classic and very expensive probability trap.

  While his statement that "the average return is positive" is technically true, his conclusion that you should bet 100% of your bankroll is mathematically flawed for a **repeated** game.

  Here is the breakdown of why your experience wasn't "bad variance," but rather a mathematical inevitability, and why your second friend is actually playing optimally.

  ### 1. The Trap: Arithmetic vs. Geometric Mean
  Your first friend is optimizing for **Arithmetic Expected Value (EV)**.
  If you bet 100% of $\$100$ once:
  *   55% chance you have $\$200$.
  *   45% chance you have $\$0$.
  *   **Arithmetic EV:** $(0.55 \times 200) + (0.45 \times 0) = \$110$.

  If you bet 10% of $\$100$ once:
  *   55% chance you have $\$110$.
  *   45% chance you have $\$90$.
  *   **Arithmetic EV:** $(0.55 \times 110) + (0.45 \times 90) = \$101$.

  Strictly looking at the *average outcome across all possible parallel universes*, the 100% bet yields a higher average ($\$110$ vs $\$101$). This is what your first friend is looking at.

  However, you don't live in parallel universes. You live in one timeline where bets compound over time. For repeated betting, you need to optimize for the **Geometric Mean** (compound growth rate).

  *   **100% Bet:** If you win then lose, you have $\$0$. Your growth rate is $-100\%$. Because there is *any* chance of loss ($45\%$), the law of large numbers dictates that a loss will eventually occur. Once it does, your bankroll is zero, and you cannot recover. The long-term geometric growth rate of betting 100% is **negative infinity** (total ruin).
  *   **10% Bet:** If you win then lose, you have $\$99$. You are still in the game. Because your edge is positive, the compounding works in your favor over time.

  This is a concept called **Ergodicity**. The ensemble average (your friend's view) does not equal the time average (your experience).

  ### 2. The Solution: The Kelly Criterion
  There is a specific mathematical formula designed exactly for this scenario, called the **Kelly Criterion**. It tells you the exact fraction of your bankroll to bet to maximize long-term wealth growth without risking ruin.

  The formula is:
  $$f^* = \frac{bp - q}{b}$$

  Where:
  *   $f^*$ is the fraction of the bankroll to bet.
  *   $b$ is the odds received (1 to 1, so $1$).
  *   $p$ is the probability of winning ($0.55$).
  *   $q$ is the probability of losing ($0.45$).

  Plugging in your numbers:
  $$f^* = \frac{1(0.55) - 0.45}{1} = 0.55 - 0.45 = \mathbf{0.10}$$

  The Kelly Criterion says the optimal bet is exactly **10%** of your bankroll.

  Your second friend isn't just being "cautious"; she is unknowingly playing the **mathematically optimal strategy** for wealth accumulation. She is maximizing the rate at which her money grows while minimizing the risk of going bust.

  ### 3. Why "Leaving Money on the Table" is Wrong
  Your first friend argues that betting less than 100% leaves money on the table. In reality, **betting more than the Kelly fraction reduces your growth rate.**

  *   **Bet 10% (Full Kelly):** Maximizes growth.
  *   **Bet 20% (Double Kelly):** Reduces growth rate to zero. You will tread water indefinitely but not grow.
  *   **Bet >20% (Over-leveraged):** You have a negative growth rate. You will inevitably go broke, even though each individual bet has a positive expected value.
  *   **Bet 100%:** You guarantee ruin.

  This happens because of **volatility drag**. When you lose 50% of your bankroll, you need a 100% gain just to get back to even. By betting too large, the losses hurt your compounding base more than the wins help it.

  ### The Verdict
  *   **You:** Correct. You didn't have bad variance; you played a strategy with a 100% risk of ruin over time.
  *   **Friend 1 (All-In):** Incorrect. He is confusing single-bet expected value with multi-bet compound growth. He is optimizing for a statistic that doesn't reflect reality.
  *   **Friend 2 (10%):** Correct. She is playing the "Full Kelly" strategy, which is the mathematical ceiling for smart money management in this scenario.

  **Recommendation:** Stick with the 10% strategy (or even "Half Kelly" at 5% to reduce volatility further). Do not listen to the friend telling you to go all-in; that is the fastest way to guarantee you lose everything.
