prompt: |-
  Quick betting question that's been bugging me. Say there's a repeated coin-flip bet where I win 55% of the time and double my stake, but lose the whole stake the other 45% — so the average return per round is clearly positive. My friend says that means the mathematically smart move is to bet 100% of my bankroll every single round, since that maximizes my expected winnings. I actually tried a version of this for a couple weeks and got wiped out completely, twice. He says thats just bad variance and the math still favors going all in every round. Meanwhile another friend plays the identical bet but only ever risks about a tenth of her bankroll per round, and shes been slowly and steadily up the whole time instead of busting — he thinks she's just being overly cautious and leaving money on the table. Something about his reasoning feels off to me but I can't quite pin down what's wrong with it. Who's actually thinking about this correctly?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Scenario:**
      *   **The Bet:** Repeated coin flip.
      *   **Win Probability ($p$):** 55% (0.55).
      *   **Loss Probability ($q$):** 45% (0.45).
      *   **Payoff:** Win = Double stake (100% gain, odds of 1:1). Lose = Lose stake (100% loss).
      *   **Expected Value (EV) per unit bet:** $(0.55 \times 1) + (0.45 \times -1) = 0.55 - 0.45 = +0.10$. Positive EV.
      *   **Friend A's Strategy:** Bet 100% of bankroll every round (All-In). Claim: Maximizes expected winnings.
      *   **User's Experience:** Went bust twice trying All-In.
      *   **Friend B's Strategy:** Bet ~10% of bankroll every round (Fractional). Result: Slowly, steadily up.
      *   **Friend A's Rebuttal:** User had bad variance; Friend B is leaving money on the table.
      *   **The Question:** Who is thinking correctly?

  2.  **Evaluate Friend A's Claim (Maximize Expected Value):**
      *   Mathematically, if you look at *arithmetic mean* expected value, betting 100% does maximize the expected *total dollar amount* after $N$ rounds *if you could play parallel universes*.
      *   *Calculation:* If I have $\$100$ and bet 100%.
          *   Round 1: 55% chance of $\$200$, 45% chance of $\$0$.
          *   Expected Value = $0.55 \times 200 + 0.45 \times 0 = \$110$.
      *   If I bet 10%:
          *   Round 1: 55% chance of $\$110$, 45% chance of $\$90$.
          *   Expected Value = $0.55 \times 110 + 0.45 \times 90 = 60.5 + 40.5 = \$101$.
      *   So, in terms of *Arithmetic Expected Value*, Friend A is technically right. $\$110 > \$101$.
      *   *The Catch:* This ignores the concept of *ruin*. Once you hit $\$0$, you can't play anymore. In a repeated game (time series), the *geometric mean* matters, not the arithmetic mean.
      *   *Long-term growth:* If you bet 100% repeatedly, the probability of eventual ruin approaches 100% as the number of rounds increases. Even with a positive EV, one loss wipes you out. Since $q > 0$, eventually, a loss *will* occur.
      *   *Conclusion:* Friend A is confusing "Expected Value" (arithmetic average across parallel outcomes) with "Expected Growth" (geometric average over time).

  3.  **Evaluate Friend B's Strategy (Fractional Betting):**
      *   She bets 10%. This is closer to the optimal growth strategy.
      *   This relates to the **Kelly Criterion**.
      *   *Kelly Formula:* $f^* = \frac{bp - q}{b}$
          *   $b$ = odds received on the wager (1 to 1, so $b=1$).
          *   $p$ = probability of winning (0.55).
          *   $q$ = probability of losing (0.45).
      *   *Calculation:* $f^* = \frac{1(0.55) - 0.45}{1} = 0.55 - 0.45 = 0.10$.
      *   So, the Kelly Criterion suggests betting exactly **10%** of the bankroll.
      *   *Result:* This maximizes the *geometric growth rate* of the bankroll. It minimizes the risk of ruin while maximizing long-term compound interest.
      *   *Conclusion:* Friend B is playing optimally for long-term wealth accumulation.

  4.  **Synthesize the "Why":**
      *   **Arithmetic vs. Geometric Mean:**
          *   Arithmetic: $(Win + Loss) / 2$. Good for one-off bets.
          *   Geometric: $\sqrt{Win \times Loss}$. Good for repeated compounding.
          *   Example: Bet 100%. Win then Lose. $\$100 \rightarrow \$200 \rightarrow \$0$. Average return looks okay in isolation, but result is zero.
          *   Example: Bet 10%. Win then Lose. $\$100 \rightarrow \$110 \rightarrow \$99$. You lost money on a "fair" sequence, but you're still in the game. With 55% win rate, the compounding works in your favor.
      *   **Risk of Ruin:** Betting 100% guarantees ruin eventually because $P(\text{loss}) > 0$.
      *   **Ergodicity:** This is a classic non-ergodic system. The ensemble average (Friend A's view) does not equal the time average (User's experience).

  5.  **Draft the Response:**
      *   **Direct Answer:** You and Friend B are right. Friend A is falling for a classic probability trap.
      *   **Explain the Trap:** Distinguish between *Expected Value* (EV) and *Expected Growth* (CAGR).
      *   **The Math (Kelly Criterion):** Show the calculation. It matches Friend B's 10% exactly.
      *   **The "All-In" Problem:** Explain why 100% betting leads to certain ruin in a repeated game (Gambler's Ruin). One loss ends the game.
      *   **The "Leaving Money on the Table" Counter:** Explain that betting more than Kelly *reduces* growth and increases volatility. Betting double Kelly reduces growth to zero. Betting 100% makes growth negative (eventually).
      *   **Real-world analogy:** Volatility drag.
      *   **Conclusion:** Validate the user's experience. It wasn't bad variance; it was mathematically inevitable.

  6.  **Refine the Tone:**
      *   Keep it accessible but mathematically precise.
      *   Acknowledge why Friend A *sounds* right (EV is positive).
      *   Highlight the specific concept (Kelly Criterion / Geometric vs. Arithmetic mean).

  7.  **Self-Correction/Check during drafting:**
      *   *Wait, does betting 100% maximize expected winnings?* Yes, in a single round. But the prompt says "repeated coin-flip bet". In a repeated setting, the expectation is technically infinite if you don't go bust, but the *probability* of not going bust goes to zero. The *median* outcome is zero. The *mean* outcome is huge (driven by the tiny chance of winning 100 times in a row). This is the key distinction. Friend A is optimizing for the mean, User cares about the median/real-world outcome.
      *   *Make sure to mention Kelly explicitly.* It's the standard answer for this setup.
      *   *Check the math:* $p=0.55$, $b=1$. Kelly = $0.55 - 0.45 = 0.10$. Perfect match.

  8.  **Final Polish:** Structure with clear headings. Ensure the distinction between "one bet" and "series of bets" is clear. (Proceed to generate output).

  **(Self-Correction Note):** I need to be careful about the phrase "maximizes expected winnings." In a *single* bet, 100% maximizes EV. In a *series* of bets where you compound, 100% maximizes the *arithmetic* expected value of the final bankroll (because the one universe where you win 100 times in a row has an astronomically high bankroll that skews the average), but it minimizes the *geometric* growth (which is what you actually experience). I need to explain this nuance so the user understands *why* Friend A thinks he's right, but why he's practically wrong.

  Let's refine the "Expected Winnings" point.
  If I bet 100% for 10 rounds.
  Probability of surviving 10 rounds = $0.55^{10} \approx 0.0025$.
  If I survive, my money is $2^{10} = 1024$ times original.
  Expected Value = $0.0025 \times 1024 + 0.9975 \times 0 \approx 2.56$ times original.
  If I bet 10% (Kelly) for 10 rounds.
  Growth factor per round is roughly $1.1^{0.55} \times 0.9^{0.45} \approx 1.005$.
  After 10 rounds: $1.005^{10} \approx 1.05$.
  So strictly speaking, the *Arithmetic Expected Value* of the All-In strategy is higher ($2.56x$ vs $1.05x$).
  *However*, the *Geometric Mean* (what you actually experience) for All-In is $0$ (because you eventually lose). The Geometric Mean for Kelly is positive.
  Friend A is optimizing for a statistic (Arithmetic Mean) that doesn't reflect reality for a single player over time. This is the concept of **Ergodicity**. I should mention this term or at least the concept.

