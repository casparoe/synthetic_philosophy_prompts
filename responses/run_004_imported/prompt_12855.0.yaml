answer: |-
  You were right to push back. Your friend is articulating the **standard objection** to disjunctivism, but she is misunderstanding what disjunctivism is actually trying to achieve. She is treating a metaphysical theory as if it were an epistemic solution, and then claiming it fails because it doesn't solve the epistemic problem.

  Here is the breakdown of why her reasoning is flawed, where she has a point, and why you were right to say she's missing the purpose of the theory.

  ### 1. She is conflating "Indistinguishability" with "Identity"
  Your friend's core argument rests on this premise: *Because a hallucination and a veridical perception feel the same from the inside, they must be the same kind of mental state.*

  In philosophy of perception, this is called the **Highest Common Factor (HCF)** view. It assumes that if two experiences are subjectively indistinguishable, they must share a common mental core (a sense-datum or representation) that defines what the experience *is*.

  **Disjunctivism explicitly denies this.**
  Disjunctivists (like John McDowell or M.G.F. Martin) argue that **epistemic indistinguishability does not entail metaphysical identity.**
  *   **Veridical Perception:** Your mental state is constituted by the actual tomato in the world. The tomato is part of the mind.
  *   **Hallucination:** Your mental state is a mere appearance. There is no tomato.

  Disjunctivism says these are two fundamentally different kinds of states that just happen to be impossible for you to tell apart *at the time*. Your friend is arguing that because you can't tell them apart, disjunctivism fails. But disjunctivism's whole point is to say: "Yes, you can't tell them apart, but that doesn't mean they are the same thing."

  She is treating the *inability to distinguish* as proof of a *common nature*. Disjunctivism says that is a non-sequitur.

  ### 2. She thinks Disjunctivism "Concedes" the Argument from Illusion
  Your friend claimed disjunctivism "quietly concedes" the Argument from Illusion. This is factually incorrect regarding the structure of the debate.

  The Argument from Illusion goes like this:
  1.  In hallucination, I am not aware of a real object.
  2.  Hallucination is indistinguishable from perception.
  3.  **Therefore, the immediate object of awareness is the same in both cases (Sense-Datum).**
  4.  Therefore, Naive Realism is false.

  Disjunctivism **rejects premise 3.** It does not concede it.
  *   **Your friend's view:** Since I can't tell the difference, I must be stuck with sense-data in both cases.
  *   **Disjunctivist view:** Since the world is present in one case and not the other, the cases are disjoint. There is no common sense-datum.

  If disjunctivism conceded the argument, it would admit that we only ever see sense-data. It doesn't. It argues that in the good case, you are directly in contact with reality, and the bad case is a separate, misleading category that shouldn't dictate the metaphysics of the good case.

  ### 3. Where she has a "real point" (but draws the wrong conclusion)
  Your friend isn't stupid; she's hitting on the hardest problem for disjunctivism. This is known as the **"Screening Off"** or **"Causal"** objection.

  If the brain state is identical in both the hallucination and the perception (neuroscience suggests it might be), and the subjective feel is identical, what *work* is the external object doing? If I can't tell the difference, why does it matter metaphysically?

  Her point is valid as a **challenge**, but invalid as a **refutation**.
  *   **Valid Challenge:** "Explain how two states can be metaphysically distinct if they are causally and phenomenally identical." (Disjunctivists struggle with this).
  *   **Invalid Refutation:** "Therefore, sense-datum theory is right." (This assumes the HCF view is the only option, which is exactly what is being debated).

  She is essentially saying, "If I can't tell the difference, Naive Realism buys me nothing."
  The Disjunctivist replies: "Naive Realism buys you the truth. In the veridical case, your experience is *factive*. It entails the existence of the object. In the hallucination, it does not. That is a massive metaphysical difference, even if you can't spot it from the inside."

  ### 4. The Verdict
  **You are right.** Your friend is misunderstanding the goal of disjunctivism.

  *   **Disjunctivism is not an epistemic tool.** It is not trying to give you a method to tell if you are hallucinating. (Skepticism about that remains).
  *   **Disjunctivism is a metaphysical claim.** It is trying to save the *nature* of perception from being reduced to internal representations.

  Your friend is arguing that because we remain epistemically vulnerable (we could be hallucinating), the metaphysics must be internalist (sense-data). Disjunctivism argues that epistemic vulnerability does not force us to abandon metaphysical directness.

  **How to win the argument (or at least clarify it):**
  Tell her this: "You're assuming that if two things feel the same, they must *be* the same kind of thing. Disjunctivism says that's a mistake. A real dollar bill and a perfect counterfeit might feel identical to me, but one has value and the other doesn't. The indistinguishability doesn't make the counterfeit real, nor does it make the real bill fake. Disjunctivism just insists that in the veridical case, I'm actually holding the dollar."

  She is raising the standard objection, but she is wrong to claim disjunctivism "concedes" the argument. It blocks the inference entirely.
