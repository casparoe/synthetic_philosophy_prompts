      *   **Priya's Argument:** D is dominated by a *mixed strategy* (50/50 U/M gives expected payoff 1.5 > 1). Payoffs are utilities, so risk aversion is already accounted for.
      *   **Task:** Evaluate step-by-step who is right on each point, identify missing nuances, and declare a "winner" or clarify the resolution.

  2.  **Deconstruct the Game Theory Concepts:**
      *   **Dominance:**
          *   *Strict Dominance (Pure):* Strategy A dominates B if $Payoff(A) > Payoff(B)$ for all opponent strategies.
          *   *Strict Dominance (Mixed):* Strategy $\sigma$ dominates B if $E[\sigma] > Payoff(B)$ for all opponent strategies.
          *   *Weak Dominance:* $\ge$ for all, $>$ for at least one.
      *   **IESDS (Iterated Elimination of Strictly Dominated Strategies):**
          *   Standard solution concept.
          *   Order independence holds for *strict* dominance.
          *   Order dependence *can* occur for *weak* dominance.
      *   **Utility & Risk:**
          *   Von Neumann-Morgenstern (vNM) utility theory assumes players maximize *expected utility*.
          *   If payoffs are given as utilities, risk preferences are embedded. A "safe 1" vs. "50% chance of 3, 50% chance of 0" (Exp = 1.5) implies the player prefers the expected value of 1.5 over the certain 1.
      *   **The Specific Payoffs:**
          *   L: U(3), M(0), D(1)
          *   R: U(0), M(3), D(1)
