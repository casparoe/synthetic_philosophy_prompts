prompt: |-
  Two people in an online game theory study group i'm part of (no formal background here, just been teaching myself this stuff for fun from free course notes) had a proper argument over a practice problem and I honestly can't tell who won.

  Setup: Row can play U, M, or D, and Column can play L or R. If Column plays L, U pays Row 3, M pays 0, D pays 1. If Column plays R, U pays 0, M pays 3, D pays 1. The answer key just eliminates D straight away for being "dominated."

  Marcus said the key is being sloppy: U loses to D whenever Column plays R, and M loses to D whenever Column plays L, so no single strategy beats D everywhere, meaning technically nothing dominates it. Priya said that's the whole point of mixing: flip a coin between U and M and you get 1.5 no matter what Column does, which beats D's guaranteed 1 either way, so D still goes. Marcus shot back that the coin flip doesn't guarantee 1.5, it gives you 3 or 0, so shouldn't a cautious player be allowed to just prefer D's safe 1? Priya said the payoffs are already "utility," so risk-aversion is supposed to be priced in already, meaning his objection doesn't reopen the case. Marcus wasn't convinced, and added that he'd read somewhere that the order you eliminate strategies in can change your final answer anyway, so maybe the key just got lucky this time.

  Can you go through it step by step, saying who's right at each point (not just overall), and point out anything both of them are missing?
