prompt: |-
  So modal realism (Lewis's view that literally every possible world is just as concrete and real as ours) and the many-worlds interpretation of QM both get lumped together in pop-sci as "basically the multiverse idea." Compare them properly though: are the worlds/branches causally or spatiotemporally connected to each other at all, and is modal realism's space of worlds even the same "size" as whatever Everettian branching could produce (i realize "size" is doing a lot of work there, that's kind of the point)? Then give me an actual verdict -- if Everett's interpretation turned out to be true, would that make modal realism any more plausible, or is that just equivocating on the word "world"? Justify it either way.
