answer: |-
  **Setting:** *Rome, 1598. A quiet corner of the Vatican gardens. The Congregatio de Auxiliis is in session. Father Molina (Jesuit) and Father Bañez (Dominican) walk slowly along a cypress hedge.*

  **Bañez:** Let us cut to the bone, Luis. Two men sit in the pew. Both hear the same sermon. Both receive the same inward illumination. One rises to confess; the other hardens his heart. Why? If the grace offered is truly equal, the difference must lie in the Giver, not the receiver.

  **Molina:** The difference lies in the will, Domingo. But not without God's foreknowledge. God possesses *scientia media*—Middle Knowledge. Before He decreed to create this world, He saw all counterfactuals. He knew that *if* placed in these exact circumstances, Peter would freely consent, and Judas would freely resist.

  **Bañez:** So God waits upon the creature? You make the Divine Will contingent on a created 'what-if.' You place the efficacy of grace in the hands of the sinner. Grace becomes efficacious only because you allow it to be. That is Semi-Pelagianism with a syllogism.

  **Molina:** Not contingent, but accommodated. God chooses to actualize the world where Peter says 'yes.' He gives *congruous grace*—grace He knows fits Peter's disposition. God remains sovereign because He selects the world; Peter remains free because, in that world, his consent is uncoerced.

  **Bañez:** Uncoerced, yes. But uncaused? If the will determines itself to consent without a prior motion from the First Cause, you have two first causes. That is metaphysically impossible. The will is a secondary cause; it cannot act unless moved by the Prime Mover.

  **Molina:** It is moved, by love, by reason, by grace! But not by a physical determination that necessitates the outcome.

  **Bañez:** Not necessitation, but *praemotio physica*. Physical premotion. God moves the will to act, but He moves it *as will*—that is, freely. Sufficient grace gives the power to act; efficacious grace gives the act itself. To the one who converts, God gives the act of consent. To the other, He gives only the power, which remains idle.

  **Molina:** And there lies the abyss. If God gives the act of consent to Peter but not to Judas, when both were willing to hear the sermon... then Judas's damnation is God's fault. You make God the author of sin by omission. You collapse liberty into compatibilism. If I am premoved to consent, could I have done otherwise?

  **Bañez:** In that instant, under that premotion? No. But the necessity is not coercion. The will consents to what God moves it to desire. It is the deepest freedom, to be moved by God. Your "freedom" is a phantom liberty to choose against the Good without God's aid.

  **Molina:** A phantom liberty that preserves justice! If grace is intrinsically efficacious by its own nature, as you claim, then God deceives when He says He wills all men to be saved. He offers "sufficient" grace that is insufficient to save. It is a mockery.

  **Bañez:** It is a mystery of mercy. God owes salvation to no one. If He saves Peter, it is grace. If He leaves Judas, it is justice. But you, Luis, you make the success of the Cross hostage to the whim of a creature. You say God *cannot* move the will infallibly without destroying it. You limit the Almighty.

  **Molina:** I limit nothing but the contradiction of a square circle. A free 'yes' cannot be causally determined from outside. If you insist on physical premotion, you may keep your sovereignty, but you lose the man.

  **Bañez:** And if we keep your Middle Knowledge, we keep the man, but lose the Lord.

  **Molina:** *(Stops walking)* Then we are at an impasse.

  **Bañez:** *(Nods)* The Pope knows it. He fears to condemn us both, lest he condemn the Church's own doctors.

  **Molina:** Perhaps the silence is the only orthodoxy left. We agree grace is necessary. We agree man is free. We agree God is King.

  **Bañez:** We simply cannot agree on how the King rules the heart without breaking it, or how the heart beats without the King.

  **Molina:** Let us pray the Congregation finds a peace our logic cannot.

  **Bañez:** Amen. Though I suspect Rome will tell us both to stop calling the other a heretic, and leave the mystery to God.

  **Molina:** A decree I can obey.

  **Bañez:** As can I.
