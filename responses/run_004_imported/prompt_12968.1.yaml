      *   *Why not?* Because then you lose the discipline of CE/Capacity. Someone might vote "Yes" because they like the founder, ignoring CE. The criteria force engagement with the EA framework.
      *   *Decision:* Stick with Two-Stage Ratification. It bridges the gap.

