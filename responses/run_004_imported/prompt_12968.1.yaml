answer: |-
  **MEMORANDUM**

  **TO:** Allocations Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Voting Procedure Recommendation: Resolving the "Discursive Dilemma"

  **1. Context**

  At our last meeting, we encountered a voting anomaly on a borderline grantee. Under our current bylaws (voting separately on Cost-Effectiveness and Capacity), the grant passed both bars (3–2 on each). However, because the "Yes" voters were not the same people on each bar, only two members supported funding the grant overall. A direct "Fund Yes/No" vote would have rejected it (2–3).

  This has sparked a debate: half the committee wants to switch to direct "Gut Polls" (Conclusion-Based), while the other half wants to retain the criteria votes (Premise-Based).

  This memo outlines the theoretical basis of this conflict, evaluates the risks of both extremes, and recommends a hybrid procedure for adoption at next week's meeting.

  **2. The Theory: The Discursive Dilemma**

  The situation we faced has a name in social choice theory: the **Discursive Dilemma** (or Doctrinal Paradox). It occurs when a group votes on premises (Criteria A & B) to reach a conclusion (Fund/Don't Fund), and the majority view on the premises conflicts with the majority view on the conclusion.

  *   **Premise-Based (Current):** Prioritizes *consistency with our standards*. It ensures no grant is funded that fails a specific EA criterion, even if a coalition forms to fund it anyway.
      *   *Risk:* It can fund "zombie grants"—projects that meet the technical criteria but lack actual championing or overall support from the majority (as we just saw).
  *   **Conclusion-Based (Gut Poll):** Prioritizes *collective endorsement*. It ensures we only fund what a majority of us actually want to fund.
      *   *Risk:* It allows criteria drift. A majority could fund a grant that fails our cost-effectiveness bar because they "like the vibe," eroding our EA mandate over time.

  **3. Analysis: Why Both Pure Options Are Suboptimal**

  For a small, EA-aligned circle, neither extreme is ideal.

  If we switch entirely to **Gut Polls**, we lose the disciplinary force of our criteria. In a group of five, it is too easy for interpersonal dynamics or narrative bias to override hard numbers. We risk becoming a generalist donor fund rather than an EA giving circle.

  If we stick strictly to **Bar-by-Bar**, we risk the legitimacy of our decisions. Funding a grant that 60% of the committee actively opposes (as happened last quarter) creates resentment and reduces the likelihood that the "No" voters will support the grantee post-award. In a small team, buy-in matters for monitoring and support.

  **4. Recommendation: Two-Stage Ratification**

  I recommend we adopt a **Two-Stage Ratification** procedure. This preserves the rigor of our criteria while respecting the democratic will of the committee.

  **The Procedure:**
  1.  **Criteria Vote:** We vote separately on Cost-Effectiveness and Capacity (Majority rules).
  2.  **Ratification Vote:** If *both* criteria pass, we immediately hold a final "Fund Yes/No" vote (Majority rules).
  3.  **Outcome:** A grant is funded **only if** it passes both Criteria Votes **AND** the Ratification Vote.

  **Why This Works:**
  *   **For the "Bar" Team:** The criteria remain *necessary conditions*. A grant that fails Cost-Effectiveness dies immediately, regardless of how much the committee likes the founder. This protects our EA mandate.
  *   **For the "Gut" Team:** The criteria are no longer *sufficient conditions*. If a grant clears the bars but the majority still doesn't want to fund it (due to unquantifiable risks, portfolio fit, or intuition), the Ratification Vote vetoes it. This prevents the "zombie grant" problem.
  *   **Epistemic Value:** It forces us to distinguish between "This meets our standards" and "This is the best use of our capital." Both are true, but distinct.

  **5. Implementation**

  This adds minimal friction (one additional show of hands) but significantly reduces the risk of internal conflict or regretted grants.

  I propose we adopt this procedure provisionally for the next two quarters, then review. This allows us to test if the Ratification Vote is frequently used or if it serves primarily as a safeguard.

  **6. Decision Requested**

  At next week's meeting, I ask we spend 15 minutes discussing this hybrid model. My goal is not to win the argument for "Bars" or "Guts," but to ensure our procedure reflects both our commitment to EA principles and our reality as a small, collaborative team.

  Please come prepared to vote on adopting the Two-Stage Ratification model.

  Best,

  [Your Name]
