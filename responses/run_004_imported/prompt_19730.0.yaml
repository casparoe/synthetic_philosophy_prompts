answer: |-
  This is a genuinely sharp connection, and honestly, one that doesn't get made enough in the rationalist/decision-theory discourse. Most people jump straight from CDT/EDT to FDT/UDT without looking back at the dynamic choice literature of the 80s and 90s. You are right that functionally, UDT and McClennen's Resolute Choice occupy the same niche: they both solve dynamic inconsistency by granting normative authority to the *ex-ante* perspective over the *ex-post* perspective.

  However, if we dig into the machinery, the analogy starts to fracture. I think UDT is best understood not as a repackaging of Resolute Choice, but as **Resolute Choice generalized to logical rather than temporal uncertainty.**

  Here is the breakdown of where the analogy holds, where it breaks, and why UDT doesn't need McClennen's preference violations to do its work.

  ### 1. The Mechanism of Binding: Willpower vs. Logical Control

  This is the biggest divergence.

  **McClennen's Resolute Choice** is a theory of *agency over time*. The problem he is solving is intrapersonal game theory: The self at $t_0$ and the self at $t_1$ have different incentive structures (due to discounting or information updates). In standard game theory, if $t_1$ has no incentive to stick to the plan, $t_0$ cannot rely on them. McClennen posits a normative principle: rationality requires the agent to view themselves as a single temporally extended entity, granting $t_0$ the authority to bind $t_1$. The "glue" is a kind of rational willpower. It requires a metaphysical account of how a past intention constrains a future choice without external precommitment technology.

  **UDT** is a theory of *algorithmic output*. The problem it solves is not that the agent's preferences change over time, but that **conditioning on information destroys logical correlation.**
  In Counterfactual Mugging, the "you" that sees the coin came up Tails and the "you" that existed before the coin flip are not two different temporal selves with conflicting desires. They are the same algorithm.
  *   **McClennen:** $t_1$ *wants* to deviate, but *shouldn't* because $t_0$ said so.
  *   **UDT:** The algorithm *doesn't* want to deviate if it calculates correctly. The "temptation" to deviate (paying the mugger when you see Tails) comes from using a decision theory (CDT/EDT) that treats your current decision as causally isolated from the predictor's past simulation. UDT corrects the *calculation*, not the *will*.

  So, UDT doesn't need a theory of "binding" in McClennen's sense. It needs a theory of **logical counterfactuals**. If I am a program, and I output `Pay` when I see `Tails`, then my simulation (run by the predictor) also output `Pay`. There is no "refusing to deviate"; there is only "computing the output." The "resoluteness" is a side effect of the math, not a psychological effort.

  ### 2. Do We Need Non-EU Preferences? (The Allais Question)

  You asked if UDT secretly needs McClennen's assumption that preferences violate Expected Utility (like Allais) to justify not being "sophisticated."

  **The answer is no.** This is a critical distinction.

  McClennen often motivates Resolute Choice to save non-EU preferences from dynamic inconsistency. If you have Allais preferences, you are dynamically inconsistent. Sophistication (backward induction) forces you to abandon the Allais-preferred path. Resolute Choice lets you keep it. In that context, Resolute Choice is a patch for Non-EU preferences.

  UDT, however, is fully Expected Utility maximizing **relative to the prior**.
  *   **Sophisticated Choice (in UDT terms):** This is equivalent to updating your probabilities on new information and then maximizing EU.
  *   **Updateless Choice:** This is maximizing EU relative to the prior distribution, without updating.

  UDT argues that "Sophistication" (updating) is actually *irrational* in the presence of logical correlations, even if your preferences are perfectly von Neumann-Morgenstern compliant. In Counterfactual Mugging, an EU-maximizer who updates on seeing "Tails" will not pay, because conditional on Tails, the money is already gone. But an EU-maximizer who stays updateless *will* pay, because the policy "Pay if Tails" increases the probability of the predictor giving you money in the "Heads" branch of the prior.

  So, UDT justifies ignoring the "in the moment" incentives not because preferences are weird (Allais), but because **the moment itself is a misleading reference class for decision-making.** The "in the moment" self isn't suffering from preference reversal; it's suffering from **screening off**. It has observed information that correlates with the outcome but causally (or acausally) depends on the decision policy.

  ### 3. "Commit Before Observations" vs. "Commit to a Plan"

  This is where your second question hits the nerve: *Is there a real gap regarding what prior you're supposed to be updateless with respect to?*

  Yes, there is a massive gap, and it's the weakest point of UDT compared to McClennen.

  **McClennen's Prior:** The prior is temporal. It's the state of the world at $t_0$. We generally agree on what $t_0$ is. It's "now," before the sequence of choices begins.

  **UDT's Prior:** The prior is **logical**. It is the distribution over logical possibilities *before* you know which logical world you inhabit.
  *   In Counterfactual Mugging, the "prior" is before you know the coin flip.
  *   In the Absent-Minded Driver, the "prior" is before you leave the bar (but you don't know which intersection you are at).
  *   In a Twin Prisoner's Dilemma, the "prior" is before you know your own move (because your move is logically correlated with the twin's).

  The gap is: **Where does the prior stop?**
  McClennen doesn't have to worry about this much; the timeline defines the boundary. UDT has the "Prior Problem." To be truly updateless, you must choose your policy before *any* observations, including observations about your own existence, your location in the universe, or even mathematical truths (if you are logically uncertain).
  *   If I am updateless with respect to *everything*, I have to choose a policy for every possible input my sensors could ever receive, weighted by a universal prior over all possible universes.
  *   This makes UDT computationally impossible, but more importantly, it makes the "commitment" ontologically heavier than McClennen's. McClennen asks you to commit to a plan for a specific decision tree. UDT asks you to commit to a **source code** for all possible decision trees.

  So, "commit to a policy before any observations" is a much stronger, more metaphysical move than "commit to a plan and stick to it." McClennen is about **self-control**; UDT is about **self-location**.

  ### 4. My Verdict on the Analogy

  I think your intuition that they are "basically the same" is **functionally correct but ontologically distinct.**

  *   **Functionally:** They are identical. Both say "Maximize ex-ante expected utility, even if ex-post incentives scream otherwise." Both reject the "Sophisticated" solution of standard decision theory.
  *   **Ontologically:** They are solving different problems.
      *   McClennen is solving the **Problem of Diachronic Agency**: How can a temporally extended entity act as one?
      *   UDT is solving the **Problem of Logical Correlation**: How can an agent optimize when its decision is a logical fact instantiated in multiple places?

  UDT *subsumes* McClennen's cases. If you run UDT on a standard dynamic choice problem with hyperbolic discounting, it will behave resolutely. But it does so not because it grants authority to the past self, but because the "policy" that maximizes the prior utility is the one that ignores the discounting spike later on.

  **The "Secret" Dependency:**
  Does UDT need something like McClennen's assumption? I'd argue it needs something *stronger*. McClennen needs you to accept that $t_0$ has normative authority over $t_1$. UDT needs you to accept that **your decision algorithm controls logical counterfactuals.**
  Many people find McClennen's "willpower" argument hand-wavy (how *do* you bind yourself?). UDT tries to make it rigorous via logic, but in doing so, it inherits the baggage of logical uncertainty (the Prior Problem).

  **Conclusion:**
  You aren't wrong to see the family resemblance. UDT is essentially **Resolute Choice stripped of its psychological baggage and rebuilt on top of computation theory.**
  *   McClennen says: "Stick to the plan because you promised yourself."
  *   UDT says: "Stick to the plan because 'you' are a function, and changing the output here changes the output there."

  The motivation isn't different work; it's the *same* work (preserving ex-ante optimality) done on a harder substrate (logical uncertainty vs. temporal uncertainty). The gap isn't in the motivation, it's in the **metaphysics of the prior.** McClennen assumes a timeline; UDT assumes a logical multiverse. If you can solve the Prior Problem in UDT, you effectively solve the "why be resolute?" problem for McClennen automatically. But until then, UDT is Resolute Choice with a much heavier metaphysical price tag.
