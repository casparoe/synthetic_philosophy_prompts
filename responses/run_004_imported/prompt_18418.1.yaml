answer: |-
  **Title:** The Corpse in the Machine: Why "Death in Damascus" Decides the Future of Decision Theory

  **The Fable and the Freeze**
  The story is ancient, but the problem is new. In the old fable, a merchant meets Death in Damascus. Death looks surprised. The merchant flees to Aleppo, believing he has escaped. But Death later finds him there, remarking, "I was surprised to see you in Damascus, because I have an appointment with you tonight in Aleppo."

  In 1978, Allan Gibbard and William Harper recast this as a decision-theoretic crisis. Imagine Death is a perfect predictor. If you stay in Damascus, Death is in Damascus. If you go to Aleppo, Death is in Aleppo. You die either way, but you prefer to spend your last day where Death *isn't*.

  Standard Causal Decision Theory (CDT) asks: "Which act causes the best outcome?" CDT insists that your choice today cannot causally influence where Death *already* decided to be yesterday. The prediction is a fixed fact of the past. Therefore, CDT calculates the probability of Death's location as independent of your current choice. If you think Death is likely in Damascus, CDT says go to Aleppo. But if you go to Aleppo, you must have thought Death was in Damascus—which implies Death predicted you'd go to Aleppo. The theory spins in circles. It cannot recommend a pure strategy without contradicting its own probability assumptions.

  **The Ratifiability Patch**
  For decades, the standard defense of CDT was "ratifiability." Proposed by Richard Jeffrey and adopted by Gibbard and Harper, this principle states: *You should only choose an act if, assuming you choose it, it still looks like the best option.*

  In Damascus, staying is only good if Death is in Aleppo. But if you assume you stay, you must assume Death predicted that and is in Damascus. So staying is unratifiable. Fleeing is unratifiable for the same reason. To save CDT, theorists introduced mixed strategies: you flip a coin. If you randomize 50/50, Death (predicting the randomization) is equally likely to be in either city. Conditional on the coin flip, neither location is better than the other. The theory stabilizes.

  This defense held the line in academic philosophy for thirty years. It suggested CDT wasn't broken; it just required agents to occasionally surrender agency to chance to remain coherent against predictors.

  **Egan's Psychopath Button**
  The rot in this defense was exposed by Andy Egan in 2007 with the "Psychopath Button."

  Imagine a button that, if pressed, kills all psychopaths. You are not a psychopath. You dislike psychopaths and would like to kill them. However, you know that only a psychopath would press such a button (because only a psychopath doesn't care about the risk of being one). If you press the button, it is overwhelming evidence that you are a psychopath, and thus you will die.

  CDT says: Press the button. Your pressing does not *cause* you to be a psychopath; that is a fixed trait. The causal consequence is simply "psychopaths die," which you value.
  Ratifiability says: Do not press. If you assume you press, you must update on the evidence that you are likely a psychopath, meaning you will die. The act becomes unratifiable.

  Here lies the fatal wound. In the Psychopath case, randomization doesn't help. More importantly, the ratifiability constraint seems to punish the agent for possessing evidence about themselves that is *correlated* with the act but not *caused* by it. A non-psychopath should be able to press the button without magically becoming a psychopath. By forcing the agent to treat their own decision as evidence of their hidden traits, ratifiability cripples CDT in cases where the agent knows their own mind better than the correlation suggests. It saves CDT from Death in Damascus by making it paralyzed in the Psychopath Button case. You can't have a general decision theory that works only when you ignore what your actions say about you.

  **Evidential Decision Theory's Turn**
  Evidential Decision Theory (EDT) avoids the paralysis in Damascus. EDT chooses acts that provide the best *news*. Since going to Aleppo is strong evidence that Death is in Aleppo, EDT recommends staying in Damascus (or vice versa, depending on priors), effectively "one-boxing." It accepts the correlation between choice and prediction.

  However, EDT pays for this success elsewhere. In the "Smoking Lesion" problem, a genetic lesion causes both a desire to smoke and lung cancer. Smoking itself doesn't cause cancer; the gene does. EDT says: Don't smoke. Why? Because smoking is evidence you have the gene, and thus evidence you will get cancer. This is intuitively wrong. You should enjoy the cigarette; your smoking won't change your genetics. EDT fails because it treats mere correlations as causal levers. It survives Death in Damascus, but it dies on the Smoking Lesion.

  **The Functionalist Dissolution**
  Enter Functional Decision Theory (FDT), the contender championed by the AI safety and rationalist community (notably Eliezer Yudkowsky and Nate Soares). Their paper, "Cheating Death in Damascus," argues that both CDT and EDT make a category error regarding what a "decision" is.

  FDT treats a decision not as a physical muscle twitch, but as the output of a decision *algorithm*. If Death is a perfect predictor, Death is not looking into a crystal ball; Death is running a simulation of your algorithm. Your physical act and Death's prediction are two outputs of the same logical function.

  FDT asks: "What output of my decision algorithm yields the best result?" If my algorithm outputs "Go to Aleppo," Death's simulation outputs "Go to Aleppo." If my algorithm outputs "Stay," Death's simulation outputs "Stay." Unlike CDT, FDT recognizes a *logical* dependency between my choice and the prediction, even if there is no *causal* link. Unlike EDT, FDT does not treat this as mere statistical evidence, but as a logical constraint.

  Consequently, FDT simply picks a city. It knows Death predicted that pick. It doesn't need to randomize. It doesn't need to fret about ratifiability. In the Psychopath Button case, FDT analyzes the logical structure: "Does my algorithm pressing the button imply I am a psychopath?" If the agent *knows* it is not a psychopath, the logical link is broken, and it can press the button safely. FDT dissolves the paradoxes by changing the ontology of the decision from "physical intervention" to "logical selection."

  **The Verdict: CDT is a Special Case, Not the General Rule**
  Here is the hard conclusion required for your sidebar: **Causal Decision Theory, in its standard form, is insufficient for any environment containing reliable predictors, and the ratifiability patch is a stopgap that fails under generalization.**

  Defenders of CDT often argue that perfect predictors are impossible in the real world, so CDT remains the practical standard. This was defensible in 1980. It is indefensible in the age of AI. We are rapidly building systems (large language models, adversarial agents, high-frequency trading algorithms) that function as predictors. When an AI negotiates with another AI, or when a safety mechanism tries to predict a misaligned agent's move, the "Death in Damascus" structure is not a fable; it is the architecture of the interaction.

  CDT is structurally blind to logical correlations. It sees the prediction as a fixed past event, ignoring that the prediction is fixed *because of the decision algorithm running now*. In a world of dumb matter, this blindness doesn't matter. In a world of smart software, it is fatal. An agent using CDT will lose against predictors, or worse, force itself into costly mixed strategies (randomization) to maintain coherence, effectively burning utility to hide its logic from systems that can already read it.

  Egan's Psychopath Button proves that patching CDT with ratifiability breaks the theory in self-knowledge cases. EDT solves prediction but breaks on causation. FDT is the only framework that consistently handles both by recognizing that decision-making is a computational process subject to logical laws, not just physical ones.

  Therefore, for the specific domain of AI safety and superintelligence—where agents will be simulated, predicted, and logically entangled—CDT must be abandoned in favor of a functional or logical decision theory. CDT may survive as a useful heuristic for mundane, prediction-poor environments (like choosing what to eat for lunch), but it cannot be the foundational logic for safe, superintelligent systems. To build an AI that can survive "Death in Damascus" without flipping a coin, we must teach it that its code is not just a cause, but a logical fact that the universe can read.
