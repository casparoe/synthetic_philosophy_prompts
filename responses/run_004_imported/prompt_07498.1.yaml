answer: |-
  Good morning. Faculty, family, friends, and the class of [Year].

  Standing here, I know what's expected. I'm supposed to offer you a compass. I'm supposed to tell you what matters now that we're leaving this place. And for the longest time, my draft was simple: "Stay curious. Stay kind. Do these things even after this, once nobody's grading you on it anymore."

  It's a nice sentiment. But then I took a philosophy elective this year that complicated things. We spent weeks talking about the nature of "reasons." The argument was this: You don't actually have a reason to do something just because someone tells you it's good. A reason only works if it connects to something you already care about. If you don't have a desire that's served by being kind, then me standing here saying "you should be kind" is just noise. It's an external order that doesn't land internally.

  And honestly? That kept me up at night. Because looking out at two hundred of you, I realized I don't know what you care about. I don't know your plans, your fears, or what drives you. So who am I to tell you what reasons you have? Only about five people in this room will recognize the argument I'm paraphrasing, but I think all of us know the feeling. We know how empty it feels when someone tells us what we "ought" to do without understanding why we'd want to do it.

  So, I'm not going to tell you that you *ought* to be curious. I'm not going to tell you that you *ought* to be kind. I can't give you a reason that works from the outside.

  But I can tell you why *I* am asking.

  I am asking because the world we are walking into is exhausting. It is designed to narrow your focus. It will ask you to specialize, to optimize, to pick a lane and stay in it until you forget there are other lanes. Curiosity is the only thing I know that fights that narrowing. It isn't a moral duty; it's a survival tool. If you want to stay interested in your own life, you have to stay curious. If you want to avoid becoming cynical, you have to stay curious.

  And kindness? Kindness isn't just about being nice. It's about recognizing that everyone else is fighting the same confusion you are. If you want to build things that last, if you want to have people around you when things get hard, kindness is the infrastructure.

  I can't make these things matter to you. That connection has to happen on your end. I can't reach into your subjective motivations and hook this advice up to your engine. You have to do that.

  Maybe you care about money. Okay. Curiosity makes you better at solving problems, which makes you better at making money. Maybe you care about love. Okay. Kindness is the only way to keep it. Maybe you just care about sleeping well at night. Both help with that, too.

  My point is this: I am not handing you a rulebook. I am handing you a set of tools. Whether they are useful depends entirely on what you are trying to build.

  So, when you walk out of here, and the grades stop, and the syllabi disappear, you are going to have to find your own reasons for everything. That is terrifying. But it is also the first real freedom we've ever had.

  I hope you find reasons to stay curious. I hope you find reasons to be kind. Not because I told you to. But because, when you test them against the things you actually love, you find that you can't afford not to be.

  Congratulations, everyone. Let's go find our reasons.
