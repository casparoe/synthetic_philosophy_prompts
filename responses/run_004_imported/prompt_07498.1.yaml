prompt: |-
  so i got picked as one of the student speakers at graduation (three of us do it, separate from valedictorian, you just apply with a draft) and my whole speech is basically "stay curious and kind even after this, once nobodys grading you on it anymore." problem is, i took a philosophy elective this year and we spent weeks on Bernard Williams' internal vs external reasons thing -- his argument that you don't actually have a reason to do something unless it already connects to stuff you care about, and that just telling someone "you should care" when it doesn't connect to anything of theirs is basically empty. now i can't stop noticing my whole speech is literally me standing in front of like 200 people who never took that class, telling them they have reason to keep caring about stuff -- exactly the move he says doesn't work. only like 5 people from my class will even clock that this is a problem. can you write the actual speech for me (around 4 minutes) in a way that deals with this honestly instead of dodging it or watering it down, but still sounds like a real graduation speech and not a metaethics lecture?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** Graduation speech (student speaker, not valedictorian). 3 speakers total.
      *   **Core Message:** "Stay curious and kind even after this, once nobody's grading you anymore."
      *   **The Conflict:** The speaker took a philosophy elective on Bernard Williams' "Internal vs. External Reasons." Williams argues that you only have a reason to act if it connects to your existing "subjective motivational set" (what you already care about). Telling someone they *should* care about something external to that set is empty/ineffective.
      *   **The Problem:** The speaker feels their core message violates Williams' critique (telling people they have reason to be curious/kind when it might not connect to their current motivations).
      *   **The Constraint:** Only ~5 people will understand the philosophy reference. The speech must still work for the other 195 people (not a metaethics lecture). It needs to be honest about the tension, not dodge it, but still function as an inspiring graduation speech.
      *   **Length:** Around 4 minutes (approx. 500-600 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Tension:**
      *   *Williams' Point:* "You ought to do X" is meaningless unless "doing X" serves some desire/goal you already have (e.g., being happy, being successful, being a good friend).
      *   *Speaker's Dilemma:* "You ought to stay curious/kind" might sound like an external reason imposed on graduates who might just want to relax, make money, or survive.
      *   *The Solution:* Acknowledge the limitation. Don't claim curiosity/kindness are *intrinsic* duties. Instead, frame them as *tools* that serve the things the graduates *already* care about (their internal reasons). Or, acknowledge the absurdity of giving advice while admitting you don't know their internal motivations.
      *   *The "Honest" Angle:* Admit that telling people what to do is weird. Admit that "should" is a heavy word. But pivot to *why* the speaker cares, and invite the audience to see if it connects to *their* cares.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the occasion, but immediately introduce the tension. Don't start with "Congratulations." Start with the weirdness of giving advice.
      *   **The Core Message (The "What"):** State the "stay curious and kind" theme.
      *   **The Philosophical Pivot (The "But"):** Bring in the Williams concept without naming him or using jargon. Explain the idea that "shoulds" don't work unless they connect to what you want.
      *   **The Resolution (The "How"):** Reframe curiosity and kindness not as moral duties, but as practical fuels for whatever *they* already want. Connect the external advice to internal motivations.
      *   **Closing:** Bring it back to the shared experience. A warm send-off.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm supposed to tell you to be good. But I learned in philosophy class that telling people to be good doesn't work unless they already want to. Bernard Williams said this. So when I say "be curious," you might say "why?" I don't know your reasons. But maybe being curious helps you get what you want. So please, be curious, not because I say so, but because it helps you. Thanks.
      *Critique:* Too dry. Sounds like a lecture. Needs more emotion and graduation speech flow.

  5.  **Drafting - Iteration 2 (Adding Voice and Flow):**
      Stand up here, look out. 200 people. I have a speech about kindness. But I'm worried. I took a class where we learned that telling someone "you should" is empty. If you don't care about kindness, my speech is noise. Only 5 people get this joke. But for the rest of you, I want to be honest. I can't give you a reason. I can only offer you a tool. If you want to be happy, maybe curiosity helps. If you want friends, maybe kindness helps. I'm not grading you anymore. But I hope you choose these things.
      *Critique:* Better. But needs to be more poetic. The transition from the philosophy to the advice needs to be smoother. It shouldn't feel like an apology, but like a deeper layer of sincerity.

  6.  **Drafting - Iteration 3 (Refining for the Prompt's Requirements):**
      *   *Tone:* Sincere, slightly self-aware, not cynical.
      *   *Philosophy:* Keep it implicit. Talk about "reasons" and "what moves us."
      *   *Time:* 4 minutes is roughly 550-600 words.
      *   *Key Move:* Shift from "You have a reason to be kind" to "Here is why *I* think this connects to what *you* might want, but you have to find the hook yourself."

  7.  **Writing the Speech (incorporating the Williams insight):**
      *   *Hook:* The awkwardness of the "advice" genre.
      *   *The Twist:* Admitting the limitation of advice.
      *   *The Bridge:* Curiosity/Kindness as instrumental, not just moral.
      *   *The Close:* Shared uncertainty.

      *(Self-Correction during drafting)*: Make sure I don't alienate the 195 people. They shouldn't feel like they're missing a joke. They should feel like the speaker is being unusually honest about the limits of authority. The philosophy becomes a vehicle for humility, not a barrier to entry.

  8.  **Final Polish:** Check word count and rhythm. Ensure the "grading" line from the prompt is included naturally. Ensure the Williams argument is translated into plain English (internal motivational set).

      *Drafting thought:* Instead of saying "Bernard Williams," say "I learned something that kept me up at night." Describe the concept: "A reason only counts if it lands on something you already care about."

      *Refining the ending:* Don't end on "good luck." End on "I hope you find your own reasons."

  9.  **Final Review against constraints:**
