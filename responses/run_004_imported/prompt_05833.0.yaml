          *   *Anticipated Answer:* "Vagueness is in our concepts, not reality. Identity isn't what matters, R is, and R comes in degrees."
          *   *Follow-up:* So survival comes in degrees? I can survive 50%?

      *   *Question 3 (Causal Condition):* Teleportation vs. Memory Implant.
          *   *Draft:* Why does the machine count but a scientist injecting memories not?
          *   *Refinement:* If R is just psychology, why does the *cause* matter? If I have your memories via a mad scientist, isn't that R?
          *   *Anticipated Answer:* "Reliability. The cause must sustain the connection. Fake memories don't connect to the past in the right way."
          *   *Follow-up:* Is teletransportation really "reliable" enough compared to normal brains?

      *   *Question 4 (Buddhism):* No-self.
          *   *Draft:* You talk about Buddhism. Is Reductionism the same as Anatta?
          *   *Refinement:* Parfit links Reductionism to the Buddhist view. Does this mean philosophy finally caught up with 2,500-year-old theology? Or is there a difference?
