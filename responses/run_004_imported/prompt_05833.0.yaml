prompt: |-
  So okay, for my school's philosophy club we started this really low budget podcast (three episodes in, still fighting with the mic settings lol) and next week we're recording with Professor Whitfield, who's coming in over Zoom to talk to us. She's spent basically her whole career defending Parfit's reductionist "what matters in survival" stuff from Reasons and Persons. Me and my friend actually got into this whole thing because we were arguing about whether the Star Trek transporter kills you every single time someone uses it, and then our club advisor showed us Parfit's actual teletransporter case and now its like three weeks later and my brain still hurts. She keeps saying identity isn't even the right question to ask and that what actually matters is this thing called "Relation R," which I sort of get, but I really don't want the whole interview to just be her repeating that line every time we push back.

  Can you write me like 7 or 8 real interview questions (not the boring "what got you into philosophy" kind) that actually make it harder for her to just retreat to "identity isn't what matters"? Specifically I want: one question using the branch-line case, where the teleporter glitches and the original person is left dying back on Earth while an exact replica walks around fine on Mars, that asks why that's supposed to count as nearly as good as ordinary survival for the person who's actually dying; one on the spectrum cases where your cells or your memories get swapped out so gradually that theres apparently no sharp line where "you" stop existing; one pressing on why teleportation counts as "the right kind of cause" for Relation R but other weird causes, like a scientist just implanting someone else's memories straight into your brain, supposedly don't count, since I don't get where that line comes from either; and one connecting her view to the Buddhist idea that there's no seperate self, since she apparently brings that comparison up in her talks. For each question, add a quick note on what she'd probably say back, so I actually have a real follow-up ready instead of just nodding and saying "wow, interesting." Maybe end on a question about whether any of this is actually supposed to change how we live, since Parfit himself said realizing all this made him care less about his own death and more about other people -- like is that a real consequence of the argument, or just a mood he happened to be in that day?
