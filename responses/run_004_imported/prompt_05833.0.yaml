      *   *Question 5 (Practicality/Death):* Parfit's fear of death.
          *   *Draft:* Parfit said he feared death less. Is that real?
          *   *Refinement:* Parfit claimed this view made him care less about his own death. Is that a logical consequence, or just his personal coping mechanism?
          *   *Anticipated Answer:* "If identity isn't deep, the boundary between me and others is less sharp. So death is less bad."
          *   *Follow-up:* But biological death still ends my consciousness.

      *   *Need 2-3 more questions to hit 7-8.*
      *   *Question 6 (Fission/Double Success):* What if *both* survive? (Classic Parfit).
          *   *Draft:* If the teleporter doesn't destroy the original, and both exist, who am I?
          *   *Refinement:* In the successful case, you say I survive as the Mars person. But if the Earth person *doesn't* die, logic says I can't be identical to *both*. Does this prove identity was never the point?
          *   *Anticipated Answer:* "Exactly. Identity is one-one. Survival can be one-many. This shows they are different."
          *   *Follow-up:* So I should be happy to be deleted if a copy lives?

      *   *Question 7 (Moral Responsibility):* If I'm just a series of moments, why punish past me?
          *   *Draft:* If I change over time, am I responsible for past crimes?
          *   *Refinement:* If "I" am just a chain of psychological connections, and those weaken over time, does it make sense to punish an old person for a crime committed by their younger "self"?
          *   *Anticipated Answer:* "Responsibility tracks R. If R is weak, punishment is less justified."
          *   *Follow-up:* That sounds like a loophole for criminals.

      *   *Question 8 (The "Further Fact" Intuition):* Why do we feel there's a self?
          *   *Draft:* Why do we feel like we have souls?
          *   *Refinement:* Even if your arguments work logically, most people have a deep intuition that they are a "further fact." Is Reductionism asking us to deny our own experience?
          *   *Anticipated Answer:* "Intuitions are evolved heuristics, not metaphysical truths. We can revise them."
          *   *Follow-up:* Can we really live without that intuition?

  4.  **Review and Refine:**
