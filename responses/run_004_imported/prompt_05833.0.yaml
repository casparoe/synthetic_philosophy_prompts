      *   *Teletransportation:* If R holds with the right cause, survival occurs even if identity (numerical sameness) doesn't.
      *   *Branch Line:* Original stays, Copy goes. Parfit says the original should care less about death because someone *psychologically continuous* with them lives on. But the student prompt asks: Why is it "nearly as good" for the *dying* one? This is a classic objection (the "only x and y" problem or the problem of extrinsic determination).
      *   *Spectrum:* Fission or gradual replacement shows identity is indeterminate, so it can't be what matters.
      *   *Causal Condition:* Parfit needs to rule out fake memories (e.g., Grafting). The cause must be normal (brain continuity) or reliable (teletransportation scanning).
      *   *Buddhism:* Parfit explicitly compares Reductionism to the Buddhist view of no-self.
      *   *Ethics/Practicality:* Parfit claims this view reduces fear of death and increases concern for others (since boundaries are less deep).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Branch Line):* Need to focus on the *dying* original. Parfit says "survival is what matters," not identity. But if I'm the one dying on Earth, knowing a copy is on Mars doesn't stop *my* pain of death.
          *   *Draft:* In the branch-line case, I die on Earth. You say Relation R holds with the Mars person. But for me, the one dying, why does their life matter to *my* survival?
          *   *Refinement:* Make it punchier. Focus on the asymmetry of experience.
          *   *Anticipated Answer:* She'll say "Your concern for the future is rational only insofar as R holds. R holds with Mars-you. So your fear should diminish."
          *   *Follow-up:* But my stream of consciousness ends here.

      *   *Question 2 (Spectrum):* Gradual replacement.
