answer: |-
  This is one of the liveliest debates in the philosophy of language, touching on semantics, pragmatics, and the ethics of speech. To evaluate Christopher Hom's **Combinatorial Externalism (CE)** against Anderson & Lepore's **Prohibitionism (P)**, we have to look at what we want a theory of slurs to do: Do we want it to explain the *logic* of the word, or the *harm* of the word?

  Here is the breakdown of the two positions, how they handle the hard cases (embedding, reclamation, Dummett), and where I stand.

  ### 1. The Core Dispute

  **Dummett's "Boche" (The Precursor)**
  Michael Dummett argued that "Boche" and "German" have the same reference (extension) but differ in "tone." For Dummett, using "Boche" expresses a hostile attitude without changing the truth conditions. This is a **Conventional Implicature** view. The sentence "He is a Boche" is true iff he is German, but it *implicates* that he is barbaric.
  *   *Problem:* "Tone" feels too weak. Slurs don't just color a statement; they seem to assert something derogatory.

  **Anderson & Lepore: Prohibitionism (P)**
  A&L take Dummett's co-extensionality seriously but ditch the "tone." They argue slurs and neutral counterparts (NCs) are semantically identical. The difference is purely pragmatic: there is a social prohibition against uttering the slur.
  *   *Semantics:* $Slur = Neutral$.
  *   *Offense:* Violating a social norm (like burping at a funeral).
  *   *Motivation:* Parsimony. It explains why "He is not a [slur]" is still offensive (you said the forbidden word) without positing complex semantic machinery.

  **Christopher Hom: Combinatorial Externalism (CE)**
  Hom argues that the meaning of a slur is determined by the external racist ideology associated with it. A slur doesn't just refer to a group; it refers to the group *as characterized by the ideology* (e.g., "Chinese person *who is deceitful and cunning*").
  *   *Semantics:* $Slur \neq Neutral$. The slur bakes in negative properties.
  *   *Truth Conditions:* Since the racist ideology is false (no group is essentially deceitful), the extension of the slur is **empty**. "X is a [slur]" is literally false of everyone.
  *   *Motivation:* It explains the specific *harm* of slurs. They aren't just taboo; they propagate a false worldview.

  ---

  ### 2. The Stress Tests

  #### A. Embedding under Negation and Hypotheticals
  *The Phenomenon:* Saying "John is **not** a [slur]" or "If John were a [slur], I'd be surprised" still feels offensive and "gross," even though you aren't asserting the slur applies to John.

  *   **Prohibitionism (Winner here):** This is A&L's strongest suit. If the offense is just about uttering a prohibited word, then negation doesn't matter. You broke the rule by saying the word. It explains the "gross feeling" perfectly without needing to explain how the ideology projects through logical operators.
  *   **Combinatorial Externalism:** Hom has to work harder here. If the slur invokes a false ideology, why is negating it harmful? Hom argues that merely invoking the ideology (even to deny it) reinforces its salience in the conversation. It's plausible, but Prohibitionism is more direct.

  #### B. In-Group Reclamation
  *The Phenomenon:* Members of the targeted group use the slur among themselves (e.g., the "N-word" among Black speakers) without offense, sometimes affectionately.

  *   **Prohibitionism:** A&L treat this as a context-sensitive suspension of the prohibition. The out-group issues the prohibition, but the in-group can waive it.
      *   *Critique:* This makes reclamation seem like merely "breaking the rules with permission." It doesn't explain why the word feels *empowered* or *changed* in meaning.
  *   **Combinatorial Externalism:** Hom views reclamation as a semantic battle. The in-group is actively stripping the ideological content (the negative properties) from the term while keeping the reference.
      *   *Critique:* This captures the *work* involved in reclamation. It's not just lifting a ban; it's draining the poison. However, Hom's claim that the extension is *empty* makes reclamation tricky. If the word is empty, how can it be used truly in-group? Hom would say the in-group is effectively creating a *new* word with a new ideology (solidarity rather than contempt).
      *   *Winner:* **Hom (CE)**. Reclamation feels like a change in meaning/content, not just a change in permission. Prohibitionism is too thin to explain why the reclaimed word feels different from the neutral counterpart.

  #### C. The "Truth" Intuition
  *The Phenomenon:* If a racist says "X is a [slur]," they believe they are speaking the truth.

  *   **Prohibitionism:** They *are* speaking the truth (X is in the group), but they are being rude.
  *   **Combinatorial Externalism:** They are speaking **falsehoods**. They are attributing essentialized negative properties that do not exist.
  *   *Analysis:* Hom's view is morally superior but semantically revisionist. It tells the racist, "You are not just being mean; you are being factually wrong about the world." This is a powerful philosophical move, but it conflicts with the intuition that the racist has correctly identified the target's group membership, even if their evaluation is vile.

  ---

  ### 3. Which Theory Do I Buy?

  If forced to choose between the two, **I side with the spirit of Hom's Combinatorial Externalism**, though I think it requires modification (specifically regarding the "empty extension" claim).

  Here is why Prohibitionism ultimately fails, and why Hom is closer to the mark:

  **1. Slurs are not just Profanity.**
  Prohibitionism treats slurs like "fuck" or "shit" in a polite context. But "fuck" is prohibited due to decorum; slurs are prohibited due to **hate**. If we lifted the social prohibition on slurs tomorrow (imagine a world where everyone agreed it's polite to use them), Prohibitionism implies the word would become harmless. That is intuitively wrong. The word would still carry the weight of the ideology. Hom captures this: the harm is in the *content* (the ideology), not just the *rule*.

  **2. The "Grossness" of Negation.**
  While Prohibitionism explains the grossness of negation easily (you said the word), it fails to explain why reporting a slur ("He called me a [slur]") is often more traumatic than reporting a neutral term with a description ("He called me a dirty person"). Prohibitionism says it's just the word. Hom says it's the re-invocation of the ideology. The latter explains the psychological impact better.

  **3. Reclamation as Semantic Change.**
  As noted above, reclamation isn't just rule-breaking. When a marginalized group reclaims a slur, they are often flipping the *value* of the term. Hom's framework allows for the ideological content to be the variable that changes. Prohibitionism struggles to explain why the reclaimed slur isn't just interchangeable with the neutral counterpart. (If they mean the same thing, why not just use the neutral one? Because the *history* and *ideology* of the slur are being repurposed.)

  **The Necessary Modification:**
  My main hesitation with Hom is the claim that the slur's extension is **empty**. If I say "The [slur] committed the crime," and it turns out a member of that group did it, Hom says my sentence is false because the ideology is false. This feels like semantic overkill.
  A better version (closer to **Expressivism** or **Presupposition** theories, like those of Daniel Boisvert or Luvell Anderson) is to say the slur *does* refer to the group (like the neutral term), but it *expresses* or *presupposes* the ideology as part of its conventional meaning. This keeps Hom's insight (the ideology is semantic, not just pragmatic) without accepting the counterintuitive claim that all slur-sentences are false.

  ### Verdict
  **Anderson & Lepore** offer a cleaner logical model, but it is morally and sociologically shallow. It treats the symptom (the taboo) rather than the disease (the ideology).

  **Christopher Hom** offers a heavier, more complex semantics, but it correctly identifies slurs as **ideological weapons**. A theory of slurs that ignores the content of the hatred—in favor of a clean "same meaning, different rule" model—fails to capture why slurs are uniquely dangerous compared to other taboo language.

  I buy **Hom's Externalism** (modified) because language is not just a game of truth conditions; it is a social practice. Slurs function to subordinate. A semantic theory that cannot account for that subordination without outsourcing it entirely to "pragmatics" is missing the point of the phenomenon. The "grossness" under negation isn't just about breaking a rule; it's about being forced to traffic in a dehumanizing worldview, even to deny it. Hom sees that; Prohibitionism does not.
