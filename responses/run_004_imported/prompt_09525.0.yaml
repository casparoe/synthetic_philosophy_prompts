answer: |-
  **MEMORANDUM**

  **TO:** Algorithmic Accountability Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Unemployment Fraud Detection Model (Vendor: [Vendor Name])

  ### Executive Summary

  I recommend we **APPROVE WITH CONDITIONS** the deployment of the vendor's fraud-detection model for a **six-month pilot period**.

  This recommendation is contingent on the vendor and the Department of Labor agreeing to three specific constraints:
  1.  **Maximum Hold Time:** No claim may be held for manual review for longer than 7 business days, regardless of risk score.
  2.  **Disparate Impact Monitoring:** If the False Positive Rate (FPR) for any protected subgroup exceeds the baseline by more than 10%, the model must be paused for recalibration.
  3.  **Threshold Optimization:** We explicitly authorize the vendor to adjust decision thresholds to minimize disparate impact, prioritizing Equalized Error Rates over strict Calibration.

  This decision acknowledges the mathematical reality that we cannot have both perfect calibration and equal error rates given unequal base rates. However, in the context of unemployment benefits, the human cost of a False Positive (financial deprivation for innocent claimants) outweighs the cost of a False Negative (temporary payment of fraudulent claims).

  ### Background and Technical Conflict

  The vendor's model assigns a risk score to unemployment claims. Claims above a certain threshold are flagged for manual review, delaying benefits. The vendor argues the model is fair because it is **calibrated by subgroup**: a risk score of 0.8 implies an 80% chance of fraud regardless of the claimant's primary language or demographic group.

  However, as noted by our legal-aid representative, calibration does not guarantee equal error rates. Because historical data shows different base rates of fraud across subgroups (e.g., lower confirmed fraud rates among non-English primary speakers), a calibrated model mathematically necessitates higher False Positive Rates for the lower-base-rate groups. In practice, this means innocent non-English speakers are flagged for review at significantly higher rates than innocent English speakers.

  This is an instance of the fairness impossibility theorem (Kleinberg et al., 2016; Chouldechova, 2017). When base rates differ, you cannot simultaneously satisfy:
  1.  **Calibration** (Predictive Parity)
  2.  **Equalized False Positive Rates**
  3.  **Equalized False Negative Rates**

  The vendor has optimized for #1. The legal-aid board members are demanding #2.

  ### Analysis of Competing Fairness Notions

  I want to address the arguments from both sides of this board directly, as this decision sets a precedent for how we handle mathematical trade-offs in public policy.

  **To the members advocating for Calibration:**
  I understand the appeal of calibration. It feels "blind." It ensures that if the model says "high risk," it means the same thing statistically, regardless of who the person is. There is a legitimate legal fear that setting different thresholds for different groups constitutes explicit disparate treatment. Furthermore, calibration prevents the model from being "gamed" if the definition of risk shifts.

  However, calibration is a measure of *confidence*, not *consequence*. In a credit scoring context, a false positive might mean a higher interest rate. In unemployment insurance, a false positive means a vulnerable person does not eat for three weeks. By insisting on calibration, we are effectively prioritizing the statistical purity of the risk score over the material reality of the error. A "fair" score that disproportionately halts benefits for one linguistic group is not functionally fair, regardless of its predictive parity.

  **To the members advocating for Immediate Rejection:**
  I share your concern regarding the disparate impact on non-English speakers. However, rejecting the tool entirely leaves us with either no fraud detection or a purely rules-based system that is often more rigid and opaque than a machine learning model. Fraud drains the trust fund, which harms all claimants in the long run. We have a duty to steward public funds. Rejecting the tool outright removes our leverage to force the vendor to fix the error rate imbalance. We can use the procurement process to mandate a different mathematical objective.

  ### Legal and Policy Rationale

  The concern that adjusting thresholds to fix error rates is legally risky is understandable but likely misplaced. Under Title VI of the Civil Rights Act and relevant state administrative law, **disparate impact** (unequal outcomes) is often just as actionable as disparate treatment (unequal rules).

  If we deploy a calibrated model knowing it produces a 20% higher false positive rate for non-English speakers, we are knowingly adopting a practice with a discriminatory effect. Courts generally allow for adjustments to selection criteria if they are job-related and consistent with business necessity. Here, "business necessity" is fraud detection, but it is also *timely distribution of benefits*.

  Optimizing for Equalized Error Rates is not "lowering the bar" for specific groups; it is equalizing the *burden of error* across groups. It ensures that an innocent person has the same chance of being flagged regardless of their language. This is a stronger legal defense than maintaining a system that we know will disproportionately delay benefits for protected classes.

  ### Recommendations and Conditions

  We cannot wait for a mathematically perfect solution because one does not exist. We must make a policy choice about which mathematical imperfection we can tolerate. Given the stakes, we must tolerate more fraud slipping through (False Negatives) to prevent innocent people from being starved of benefits (False Positives).

  **1. Pilot Timeframe: 6 Months**
  We will review the model's performance after two quarters. This allows us to gather fresh data on error rates under the new constraints.

  **2. Condition: Cap on Review Time**
  The vendor's model creates a bottleneck. We must decouple the *flag* from the *hold*. If a claim is flagged, it enters a review queue, but state policy must guarantee that queue moves within 7 days. This mitigates the harm of the False Positive even if the rate remains imperfect.

  **3. Condition: Threshold Optimization for Equalized Odds**
  We direct the vendor to re-tune the decision thresholds. We explicitly accept a reduction in calibration accuracy to achieve parity in False Positive Rates.
  *   *Implementation:* Instead of a global risk score threshold (e.g., >0.7), the vendor may apply subgroup-specific thresholds (e.g., >0.7 for Group A, >0.85 for Group B) to equalize the flagging rate of innocent people.
  *   *Legal Shield:* This memo serves as the Board's documentation that this adjustment is required to mitigate disparate impact, shielding the Department from claims of arbitrary disparate treatment.

  **4. Condition: Transparency Reporting**
  Quarterly reports must include not just the total fraud detected, but the False Positive Rate and Average Hold Time broken down by primary language and demographic subgroup.

  ### Conclusion

  The impossibility theorem tells us we cannot have it all. It does not tell us which metric to sacrifice. That is a policy decision, not a mathematical one.

  In the context of social safety nets, the cost of error is asymmetric. Delaying benefits to an innocent worker causes immediate harm; delaying the detection of a fraudster causes fiscal loss. We must prioritize the former. By approving this model with conditions that prioritize Equalized Error Rates over Calibration, we acknowledge the math while choosing the side of the citizen over the side of the statistic.

  I move we adopt the recommendation above.
