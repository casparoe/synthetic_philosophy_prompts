prompt: |-
  I'm a PhD student in economics finishing a dissertation chapter on the choice of social welfare function for integrated assessment models (IAMs) used in climate policy, in the vein of Nordhaus's DICE model and its various welfarist successors. My advisor keeps pushing back on the population axiology embedded in these models, pointing me toward Parfit's repugnant conclusion and Arrhenius's impossibility theorems, which show that seemingly any principled way of aggregating welfare across variable populations runs into some deeply counterintuitive commitment (whether that's the repugnant conclusion itself, the sadistic conclusion, or a violation of something like the mere addition principle). I've been reading around critical-level utilitarianism, variable-value views, and Parfit's own later attempts to find a "theory X" that escapes these results, but I'm having trouble translating the philosophical stakes into concrete modeling advice.

  Could you lay out what you take to be the most important implications of taking the repugnant conclusion (and the broader impossibility results surrounding it) seriously, both for someone who has to actually pick a social welfare function for use in a quantitative model like an IAM, and more generally for how economists and policymakers should reason about tradeoffs between population size and average well-being in climate and population policy? I'm less interested in a general survey of the population ethics literature than in the practical upshots: e.g., whether there's a defensible way to sidestep the impossibility results for modeling purposes, or whether we should instead just be explicit about which counterintuitive conclusion we're willing to bite the bullet on and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in economics, finishing a dissertation chapter on Social Welfare Functions (SWFs) in Integrated Assessment Models (IAMs) like DICE.
      *   **Context:** Advisor is pushing back on population axiology, citing Parfit's Repugnant Conclusion and Arrhenius's Impossibility Theorems.
      *   **Problem:** The student is struggling to translate high-level population ethics (philosophy) into concrete modeling advice (economics/policy).
      *   **Goal:** Wants practical implications/upshots of taking these impossibility results seriously. Specifically: How to pick an SWF for an IAM? How should economists/policymakers reason about population/average well-being tradeoffs?
      *   **Preference:** Less interested in a literature survey, more interested in "what do I actually *do*?" (Sidestep vs. Bite the Bullet).

  2.  **Deconstruct the Core Conflict:**
      *   *Economics/IAMs:* Typically use Total Utilitarianism (Sum of discounted utilities). This is mathematically tractable but implies the Repugnant Conclusion (RC).
      *   *Philosophy:* Total Utilitarianism is intuitively problematic. Alternatives (Critical-Level, Average, Variable-Value) avoid RC but introduce other problems (Sadistic Conclusion, Intransitivity, etc.) per Arrhenius.
      *   *The Impasse:* Arrhenius proves *no* SWF satisfies all intuitive adequacy conditions.
      *   *The Task:* Bridge the gap between "No perfect theory exists" and "I need a function for my code."

  3.  **Brainstorming Practical Implications:**

      *   *Implication 1: Transparency over Truth.* Since no theory is perfect, the modeler shouldn't claim theirs is "correct." They should claim it's "transparent about its ethical commitments."
      *   *Implication 2: Sensitivity Analysis is Ethical Analysis.* Instead of just varying discount rates ($\rho$) or elasticity ($\eta$), vary the *axiological structure* (e.g., switch from Total to Critical-Level).
      *   *Implication 3: The "Relevance" Constraint.* Do population sizes actually vary enough in climate scenarios to trigger the RC? If population is exogenous or bounded in the model, RC might be a theoretical ghost rather than a practical driver.
      *   *Implication 4: Policy Robustness.* Do different SWFs yield different *policy* recommendations (e.g., Carbon Tax)? If yes, that's a major finding. If no, the philosophical debate matters less for *this* specific policy question.
      *   *Implication 5: The "Bite the Bullet" Strategy.* Acknowledge the RC but argue it's the "least bad" option for *intergenerational* equity compared to alternatives (e.g., Average Utilitarianism discourages adding happy lives).

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty. Validate the advisor's point (Arrhenius is real) but frame it as a feature, not a bug, of the dissertation.
      *   **Section 1: The Modeling Upshot (The "How-To").**
          *   Don't hide the assumption.
          *   Sensitivity analysis as ethical exploration.
          *   The "Relevance" check (does population actually vary endogenously?).
      *   **Section 2: The Policy Upshot (The "So What").**
          *   Robustness of policy recommendations.
          *   Distinguishing "Climate Policy" from "Population Policy."
          *   The risk of "Ethical Parasitism" (using RC to justify inaction or extreme action).
      *   **Section 3: Strategic Advice for the Dissertation.**
          *   How to frame the chapter.
          *   Specific SWF recommendations (Critical-Level is usually the middle ground).
          *   The "Lexical" workaround (often too complex for IAMs, but worth mentioning).
      *   **Conclusion:** Summarize the main takeaway (Humility + Transparency).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the SWF choice:* Standard DICE uses Total Utilitarianism ($\sum N_t U(c_t)$). This leads to RC. Critical-Level Utilitarianism (CLU) is the standard fix ($\sum N_t (U(c_t) - \alpha)$). I need to explain *why* CLU is the practical compromise. It avoids RC but has a "Sadistic Conclusion" risk. Is that better? Usually, yes, for climate.
      *   *Refining the Arrhenius point:* Arrhenius says *all* theories fail some condition. So, the economist's job isn't to find the *true* theory, but to pick the *least damaging* failure for the specific context.
      *   *Contextualizing Climate:* Climate policy affects future *quality* of life more than future *population size* (mostly). Population is often exogenous in IAMs (UN projections). If $N_t$ is fixed, RC doesn't trigger. *Crucial Point:* If the model treats population as exogenous, the axiology matters less. If endogenous, it matters a lot. I need to make sure the student checks this.
      *   *Tone:* Academic, collegial, precise, but actionable. Avoid waffling.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question? "Practical upshots... defensible way to sidestep... or bite the bullet."
      *   *Correction:* Make sure to explicitly address the "Sidestep vs. Bite" dichotomy.
      *   *Insight:* The best "sidestep" is arguing that within the *relevant domain* of climate policy (bounded populations, high baseline welfare), the RC doesn't empirically arise.
      *   *Insight:* The best "bite" is admitting Total Utilitarianism is flawed but tractable and arguably better than Average Utilitarianism (which implies the "Mere Addition Paradox" issues).

  7.  **Final Polish:** Ensure terms like "Critical-Level," "Total Utilitarianism," "Arrhenius," and "IAM" are used correctly. Ensure the distinction between *intergenerational* discounting and *population* ethics is clear (they are often conflated in $\rho$).

      *(Self-Correction on Arrhenius)*: Be careful not to overstate Arrhenius. He shows no theory satisfies *all* adequate conditions. It doesn't mean no theory is usable. It means choice involves trade-offs.

      *(Final Plan)*:
      1.  Validate the tension.
      2.  Three Modeling Implications (Transparency, Sensitivity, Exogeneity).
      3.  Two Policy Implications (Robustness, Decoupling).
      4.  Specific Recommendation (CLU + Domain Restriction).
      5.  Dissertation Framing.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic "theory meets practice" bottleneck, and it is an excellent place for a dissertation chapter to land. Your advisor is right that the philosophical literature (Parfit, Arrhenius, Blackorby, Bossert, etc.) suggests there is no axiologically "perfect" Social Welfare Function (SWF). However, in economics, we rarely wait for perfect axioms before modeling; we wait for *tractable* axioms that are *transparent* about their limitations.

  The impossibility theorems do not imply that modeling should stop; they imply that **ethical parameterization must be treated with the same skepticism as economic parameterization.**

  Here is a breakdown of the practical upshots for your dissertation, divided into modeling strategy and policy reasoning.

  ### 1. Modeling Implications: How to Choose an SWF

  The first practical implication of taking Arrhenius seriously is that you cannot claim your SWF is "correct." You must claim it is "defensible within a specific domain."

  **A. The "Domain Restriction" Sidestep**
  The Repugnant Conclusion (RC) relies on the ability to trade off a massive increase in population for a drop in average welfare to a level just above zero. In the context of climate IAMs (like DICE), ask yourself: *Does the model actually allow for this trade-off?*
  *   **Exogenous Population:** Most standard IAMs treat population ($N_t$) as exogenous (based on UN projections). If $N_t$ is fixed by assumption, the RC is theoretically possible but empirically inert. The SWF only ranks outcomes based on consumption per capita. In this case, Total Utilitarianism and Critical-Level Utilitarianism often yield identical policy rankings for climate mitigation, because the "population margin" is closed.
  *   **Endogenous Population:** If your chapter involves endogenous fertility or catastrophic population collapse, the axiology matters immensely.
  *   **Actionable Advice:** If your model uses exogenous population, explicitly state that the RC is a *theoretical* property of your SWF but not an *operational* risk within the model's solution space. You are sidestepping the impossibility results by restricting the domain of inquiry to scenarios where population counts do not vary wildly enough to trigger the counterintuitive results.

  **B. Critical-Level Utilitarianism (CLU) as the Standard Compromise**
  If you must model variable populations, Total Utilitarianism (TU) is generally considered indefensible in modern welfare economics precisely because of the RC. Average Utilitarianism (AU) is worse (it implies adding a happy person can lower social welfare if they are below the average).
  *   **The Practical Fix:** Adopt **Critical-Level Utilitarianism**. The SWF becomes $\sum N_t \cdot [U(c_t) - \alpha]$, where $\alpha$ is a critical welfare level.
  *   **Why:** CLU avoids the Repugnant Conclusion (adding lives with welfare below $\alpha$ reduces total value) while avoiding the Sadistic Conclusion (preferring a population in agony over a larger population with lives barely worth living), provided $\alpha$ is set appropriately (usually at a level of "life worth living," not subsistence).
  *   **The Trade-off:** CLU violates the "Mere Addition Principle" (adding happy lives doesn't always make things better). But for climate policy, this is often a feature, not a bug. It prevents the model from suggesting we should populate the earth to the brim with people living at subsistence levels just to maximize the sum of utility.
  *   **Actionable Advice:** Use CLU with $\alpha > 0$. Treat $\alpha$ not as a philosophical truth, but as an **ethical sensitivity parameter**. Run your model with $\alpha = 0$ (Total Utilitarianism) and $\alpha > 0$ (Critical-Level). If the optimal carbon tax changes significantly, you have found a major result: *Climate policy is sensitive to population axiology.*

  **C. Sensitivity Analysis as Ethical Exploration**
  Economists are comfortable running sensitivity analysis on the discount rate ($\rho$) and elasticity of marginal utility ($\eta$). You should argue that **axiological structure is just another parameter.**
  *   **Actionable Advice:** Do not pick one SWF and hide. Present a "Ethical Sensitivity Table." Show how the Social Cost of Carbon (SCC) changes under:
      1.  Total Utilitarianism (The Nordhaus baseline).
      2.  Critical-Level Utilitarianism (The Parfitian compromise).
      3.  (Optional) A Variable Value view (where the weight on population diminishes as $N$ grows).
  *   **The Dissertation Pitch:** Your contribution isn't solving population ethics; it's quantifying the *cost of ethical uncertainty*. If the SCC ranges from \$50 to \$150 depending on whether you accept the Repugnant Conclusion, that is a quantitative finding as valuable as a new damage function.

  ### 2. Policy Implications: How to Reason About Tradeoffs

  For the broader discussion in your chapter, you need to translate these axiomatic failures into policy language.

  **A. Decoupling Climate Policy from Population Policy**
  One of the dangers of using TU in IAMs is that it can implicitly recommend population control (to raise average consumption) or population expansion (to raise total utility), depending on the calibration.
  *   **Implication:** Taking the impossibility theorems seriously suggests we should **decouple** these margins. Because we lack a consensus SWF for population size, climate policy should be robust to population axiology.
  *   **Argument:** If a carbon tax is optimal under TU, CLU, and AU, it is "axiologically robust." If it is only optimal under TU, it is ethically fragile. Policymakers should be wary of climate policies that rely on specific, controversial assumptions about the value of future lives.

  **B. The "Least Bad" Bullet to Bite**
  Since Arrhenius proves you must bite *some* bullet, you should choose the one that minimizes policy risk.
  *   **Biting the RC (Total Utilitarianism):** Risks justifying the sacrifice of future quality of life for quantity. In a climate context, this could theoretically justify allowing severe warming if it preserves the economic capacity to support a larger future population.
  *   **Biting the Sadistic Conclusion (Some CLU variants):** Risks preferring a smaller population in pain over a larger one barely happy.
  *   **The Economist's Choice:** It is generally safer to bite the bullet on **Mere Addition** (CLU) than on the **Repugnant Conclusion** (TU). Why? Because climate policy is primarily about preventing *harm* to existing and future trajectories, not maximizing the *number* of existents. CLU aligns better with the "prevention of dangerous interference" mandate of the UNFCCC.
  *   **Actionable Advice:** Explicitly state: "We adopt Critical-Level Utilitarianism. We acknowledge this violates the Mere Addition Principle, but we judge this violation less dangerous for climate policy than the Repugnant Conclusion implied by Total Utilitarianism."

  **C. Avoiding "Ethical Parasitism"**
  Be wary of using the RC to argue for inaction. Sometimes, modelers suggest that because future populations will be huge (TU), we must invest massively now (high SCC). Conversely, others argue that because future people might not exist (if we don't mitigate), we shouldn't worry.
  *   **Implication:** The impossibility results show that aggregating welfare across variable populations is fundamentally indeterminate. Therefore, **long-term climate policy should not rely heavily on the welfare of very distant generations where population size is highly uncertain.**
  *   **Actionable Advice:** This supports a "near-termism" or "robust decision making" approach. Focus the SWF on the next 100-200 years (where population projections are tighter) rather than the next 1000 years (where axiology dominates the math).

  ### 3. Specific Dissertation Strategy

  Here is how I would frame the chapter to satisfy both the economist's need for tractability and the advisor's philosophical rigor:

  1.  **Acknowledge the Impossibility:** Start by citing Arrhenius. State clearly: "There is no perfect SWF. Any choice involves ethical trade-offs." This disarms the advisor immediately.
  2.  **Justify the Baseline:** Explain that DICE/Nordhaus uses Total Utilitarianism for tractability, but this embeds the Repugnant Conclusion.
  3.  **Propose the Alternative:** Introduce Critical-Level Utilitarianism as the standard alternative in the literature (Blackorby et al.). Explain that it introduces a parameter $\alpha$ (the critical level).
  4.  **The Empirical Test:** Run the IAM.
      *   *Scenario A:* $\alpha = 0$ (TU).
      *   *Scenario B:* $\alpha = \text{subsistence}$ or $\alpha = \text{current average utility}$.
  5.  **The Result:**
      *   *If results converge:* "Population axiology is not a first-order driver of optimal climate policy within realistic bounds." (This is a strong finding).
      *   *If results diverge:* "Optimal climate policy is highly sensitive to unresolved questions in population ethics. Policymakers should treat long-term SCC estimates with caution." (Also a strong finding).
  6.  **Conclusion:** Recommend that IAMs move toward CLU as a default, not because it is "true," but because it is **less sensitive to the Repugnant Conclusion** while remaining tractable.

  ### Summary of Advice

  *   **Don't try to solve Parfit.** You are an economist, not a moral philosopher. Your job is to quantify the *impact* of these ethical choices, not resolve the *validity* of them.
  *   **Sidestep via Domain:** If population is exogenous, the RC is a non-issue. Make this clear.
  *   **Bite the Bullet Explicitly:** If population is endogenous, choose Critical-Level Utilitarianism. Admit it violates Mere Addition, but argue that avoiding the Repugnant Conclusion is more important for climate policy.
  *   **Parameterize Ethics:** Treat the critical level $\alpha$ exactly like the discount rate $\rho$. Show how the "Social Cost of Carbon" varies with $\alpha$.

  This approach respects the philosophical depth your advisor wants while delivering the quantitative rigor required for an economics dissertation. It turns a philosophical roadblock into an empirical contribution.
