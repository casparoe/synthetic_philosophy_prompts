answer: |-
  **MEMORANDUM**

  **TO:** The Board, National Food Standards Authority
  **FROM:** Technical Advisory Panel on Food Labeling
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Use of the Term "Milk" on Plant-Based Beverages

  **1. Recommendation**

  The Technical Advisory Panel recommends **Option 3: Permit shared use of the term "milk" subject to mandatory source qualification.**

  Under this framework, manufacturers of plant-based beverages may continue to use the word "milk" (e.g., "Oat Milk," "Soy Milk"), provided the plant source is declared with equal or greater prominence than the word "milk" itself. However, the unmodified term "Milk" standing alone on a principal display panel shall remain reserved for the mammary secretions of lactating mammals.

  This recommendation rejects both the total restriction advocated by the dairy industry and the unqualified permissiveness sought by some plant-based manufacturers. It is grounded not in market data or regulatory inertia, but in a semantic and ontological analysis of what the term "milk" signifies in a food labeling context.

  **2. The Ontological Question: Substance vs. Function**

  Our deliberations centered on a fundamental question raised during our last session: Is "milk" a natural kind defined by biological origin (like "water" is defined by H₂O), or is it a functional category defined by culinary usage (like "bread" or "wine")?

  The biochemist on our panel correctly noted that cow, goat, and human milk differ substantially in macronutrient profiles. If "milk" were a single chemical substance, these variations would preclude them from sharing the name. The fact that they do share the name suggests "milk" is not a chemical formula but a biological *class* of secretions designed for neonatal nourishment.

  However, the analogy to water requires scrutiny. Water is defined by its molecular composition; if the composition changes significantly (e.g., to heavy water), the properties change, though the name often remains. "Milk," conversely, is defined by its *teleological origin* (produced by a mammal to feed young) and its *physical state* (an emulsion of fat and protein in water).

  The Panel concludes that "milk" occupies a hybrid ontological space. It is not merely a marketing term for "white liquid," nor is it a rigid chemical identifier. It is a **prototype category**. Animal milk is the central prototype—the biological standard. Plant-based liquids are functional analogues that mimic the physical and culinary properties of the prototype without sharing its biological origin.

  Therefore, the biochemist is correct that origin matters: you cannot define "milk" solely by its function (whiteness, pourability) without losing the biological distinction that informs nutritional expectations. But the plant-based industry is also correct that language is functional: terms like "coconut milk" demonstrate that the word can extend to analogues without erasing the prototype.

  **3. Evaluation of the Restrictionist Position (Dairy Producers' Association)**

  The Dairy Producers' Association argues for Option 2: reserving "milk" exclusively for animal secretions. While often dismissed by opponents as economic protectionism, their argument rests on a principled claim about semantic precision and nutritional integrity that deserves serious engagement.

  Their strongest argument is not that plant-based companies are malicious, but that the term "milk" carries an implicit nutritional contract. When a consumer sees "milk," they anticipate a specific profile of complete proteins, calcium, and lipids inherent to mammalian lactation. By allowing the term to drift toward a purely functional sense ("a white liquid for cereal"), the label severs the link between the name and the biological reality that guarantees that nutritional profile.

  From this perspective, allowing "oat milk" is not merely a linguistic evolution; it is a category error that risks public health. If a parent substitutes oat milk for cow's milk based on the shared label, assuming nutritional equivalence, the child may suffer protein or caloric deficits. The Dairy Association argues that regulatory language should prioritize biological fact over linguistic convention. Just as we do not allow "imitation crab" to be labeled simply as "crab," we should not allow plant emulsions to appropriate a term that denotes a specific biological secretion. To do otherwise turns a fact of nature into a matter of marketing, diluting the precision required for informed dietary choices.

  **4. Evaluation of the Permissive Position (Plant-Based Industry)**

  The plant-based industry argues for Option 1: preserving the current permissive labeling without new restrictions. Their strongest argument relies on the historical and linguistic entrenchment of functional naming conventions.

  They correctly point out that "coconut milk," "almond milk," and even non-food items like "milk of magnesia" have coexisted with dairy milk for centuries without demonstrable confusion. This suggests that consumers are capable of distinguishing between the biological prototype and the functional analogue through context. To restrict the term now is to ignore how language actually works: words expand to cover new technologies and ingredients that serve similar roles.

  Furthermore, they argue that "milk" in a culinary context describes a *role*, not just a *source*. In a recipe, "1 cup of milk" specifies a liquid fat emulsion needed for texture and chemistry, not necessarily a bovine secretion. If a plant-based liquid fulfills that culinary function, the term is accurate. Restricting the word "milk" to animals is, in their view, an attempt to freeze language in time to grant a monopoly on a generic culinary concept. It privileges biological origin over culinary utility, effectively banning plant-based producers from describing what their product *does* in favor of describing only what it *is not*.

  **5. Justification for Qualified Shared Use**

  The Panel believes that Option 3 resolves the tension between the biological precision demanded by the Dairy Association and the functional reality acknowledged by the Plant-Based Industry.

  By mandating a prominent qualifier (e.g., "Oat," "Soy," "Almond"), we acknowledge the biochemist's insight: **origin matters.** The unmodified word "Milk" remains anchored to the biological prototype (mammalian secretion). This preserves the semantic link between the word and the nutritional profile consumers expect from the core category. It ensures that if a consumer grabs a carton labeled simply "Milk," they receive the biological substance associated with that term.

  However, by permitting the word "Milk" to remain in the modified term (e.g., "Oat Milk"), we acknowledge the linguistic reality: **function matters.** We recognize that these products are designed to function as milk analogues. Banning the word entirely would force consumers to learn arbitrary new nomenclature (e.g., "Oat Drink") for products that are chemically and culinarily similar to milk. This would hinder, rather than help, informed choice.

  This approach treats "Milk" as a genus with distinct species. "Cow's Milk" and "Goat's Milk" are species within the biological genus. "Oat Milk" is a member of a functional genus that borrows the name of the biological one. The mandatory qualifier acts as the taxonomic marker, ensuring the consumer knows which "species" they are purchasing.

  **6. Conclusion**

  The question before us is not whether plant-based beverages are nutritious—they are—but whether the label "milk" accurately conveys their nature. Our recommendation accepts that "milk" is neither purely a chemical formula nor purely a marketing construct. It is a biological term that has acquired a functional extension.

  By requiring a source qualifier, we honor the biological reality that the biochemist highlighted without enforcing the linguistic prohibition that the plant-based industry rightly identifies as obstructionist. We preserve the integrity of the unmodified term while allowing the modified term to describe the functional analogue. This ensures that the label reflects both what the product *does* and where it *comes from*.

  **Recommendation:** Adopt Option 3. Permit the use of "milk" for plant-based beverages only when accompanied by a clear, prominent plant-source qualifier. Reserve the unmodified term "Milk" for mammalian secretions.
