  My sister tried to trap a behavioral economist with her coffee habit.

  "I say I want savings," she told him, "but I buy a $6 latte every morning. So do I prefer lattes?"

  "Revealed preference says yes," he replied. "Your choice defines your want."

  "But tomorrow I might stop and save the money," she said.

  "Then you'll prefer savings."

  "So I can prefer two opposite things? Your theory explains everything!"

  "Exactly," he said.

  "So when are you wrong? Is there any choice I could make that would prove your theory false?"

  The economist smiled. "Never. I don't predict choices. I just translate receipts into desires. I'm not a forecaster, ma'am. I'm a historian with a stopwatch. My accuracy rate is 100%... provided you let me write the report after the fact."
