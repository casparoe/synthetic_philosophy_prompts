answer: |-
  **PART I: PROPOSED HANDBOOK LANGUAGE**

  **Section 4.2.1: Voting Procedures for Personnel Committees**

  **(A) Scope of Authority.**
  The Personnel Committee is empowered to render a final decision on matters of appointment, promotion, and tenure. This authority is exercised through a direct vote on the dispositive motion (e.g., "To grant tenure to Candidate X").

  **(B) Conclusion-Based Aggregation.**
  Committee decisions shall be determined by a majority vote on the dispositive motion itself. While deliberation shall include an assessment of all requisite criteria (e.g., scholarship, teaching, service), votes on individual criteria shall be considered advisory and deliberative only. They shall not be tallied to determine the outcome.

  **(C) Record of Decision.**
  The Committee's report shall record the final vote count on the dispositive motion. While the report may summarize the range of views expressed regarding specific criteria, it shall not attribute a single, unified rationale to the Committee unless such unanimity exists. A majority decision on the outcome is binding, even if the majority comprises members who reached that conclusion via differing evaluative paths.

  ***

  **PART II: MEMORANDUM OF JUSTIFICATION**

  **TO:** Faculty Senate / Administration
  **FROM:** Member, Personnel Committee
  **SUBJECT:** Resolution of the Discursive Dilemma in Tenure Voting
  **RE:** Adoption of Conclusion-Based Aggregation

  **1. Introduction: The Nature of the Dilemma**
  As recent deliberations have made clear, our committee structure is susceptible to the "discursive dilemma" (or doctrinal paradox). This occurs when a premise-based procedure (tallying votes on criteria) yields a different result than a conclusion-based procedure (tallying votes on the final verdict).

  In the specific case reviewed last month, a premise-based approach would have granted tenure despite two-thirds of the committee voting to deny it. This outcome is untenable. To preserve the legitimacy, accountability, and democratic integrity of the committee, we must enshrine the **conclusion-based (outcome) procedure**. This memo outlines the justification for this choice, specifically addressing the concern that outcome voting may produce a verdict without a single majority-shared justification.

  **2. The Primacy of Decisional Authority**
  The fundamental mandate of a personnel committee is not to issue a collective philosophical treatise, but to render a binary decision: hire or do not hire. The institution delegates authority to the *members* to exercise judgment, not to the *logic* of the criteria to exercise itself.

  When we use a premise-based procedure, we risk severing the link between individual responsibility and collective outcome. In the scenario described above, a premise-based vote forces a "Grant" decision that two-thirds of the members explicitly rejected when asked for their all-things-considered judgment. This effectively disenfranchises the majority on the only vote that carries legal and professional weight. A committee member is appointed to judge the *candidate*, not merely to grade the *criteria*. To aggregate premises is to subordinate the member's professional verdict to a mechanical formula, potentially compelling the committee to act against the conscientious judgment of its majority.

  **3. Engaging the "Shared Reason" Objection**
  The sharpest objection to conclusion-based voting is that it can ratify a verdict for which no majority shares a single justifying reason. In our recent case, a conclusion-based "Deny" verdict rested on a coalition where one member objected to the teaching record and another to the scholarship record. Critics argue this leaves the candidate and the institution without a clear, majority-endorsed rationale.

  This objection, while logically coherent, rests on a category error regarding the nature of collegial bodies. It assumes the committee must speak with a "single voice" or possess a "collective mind." It does not. It is a pluralistic panel.

  **A. Overlapping Consensus vs. Fictional Unity**
  A conclusion-based verdict reflects an "overlapping consensus" (to borrow from Rawls). In a denial case, the fact that different members identify different fatal flaws is not a bug; it is a robust signal of unsuitability. If Member A finds the scholarship lacking and Member B finds the teaching lacking, the candidate faces a broader spectrum of concern than if a majority agreed on a single weakness. The "no shared reason" critique implies that a denial is only legitimate if the majority agrees on the *specific* deficiency. This is incorrect. The legitimacy of a denial rests on the failure to secure a majority for *tenure*, not on the uniformity of the doubts surrounding it.

  **B. The Greater Evil: The Coerced Grant**
  We must weigh the "no shared reason" deficit against the alternative. The premise-based procedure risks a "Coerced Grant": awarding tenure to a candidate whom a majority of the committee believes should be denied.
  *   **Scenario:** 2 members vote "No" (for different reasons). 1 member votes "Yes."
  *   **Conclusion-Based:** Result is "No." The candidate is denied. The institution is protected from a hire the majority opposed. The "reason" is distributed, but the *protection* is solid.
  *   **Premise-Based:** Result is "Yes." The candidate is hired. The institution is forced to tenure a candidate 2/3 of the experts rejected.

  The harm of granting tenure against the will of the committee majority (Premise-Based) vastly outweighs the harm of denying tenure based on distributed concerns (Conclusion-Based). The former violates the democratic authority of the committee; the latter merely reflects the complexity of professional judgment.

  **C. Accountability and Integrity**
  Conclusion-based voting ensures accountability. If a member votes to deny tenure, they own that vote. Under premise-based voting, a member could theoretically vote "No" on the final motion but be overruled by the premise tally, leaving them responsible for a hire they opposed. Conversely, premise-based voting invites strategic manipulation; a member might exaggerate a premise rating to ensure their preferred outcome prevails in the aggregation. Conclusion-based voting demands that members weigh the premises internally and cast a verdict they can defend.

  **4. Conclusion**
  The "no shared reason" objection prioritizes logical elegance over democratic legitimacy. It asks us to value the coherence of the *explanation* over the authority of the *decision*. In personnel matters, the latter must prevail.

  By adopting conclusion-based aggregation, we acknowledge that a committee is a body of judges, not a single logical processor. We accept that reasonable members may disagree on the weight of specific criteria while agreeing on the outcome. This procedure prevents the acrimony of being overruled by a formula, ensures that no candidate is tenured over the objection of a majority of the committee, and preserves the individual accountability essential to faculty governance.

  **Recommendation:** Adopt the handbook language provided in Part I immediately.
