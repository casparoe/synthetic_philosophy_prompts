      *   The core worry: Phenomenal character is located in the content of the monitoring representation (HO state). Therefore, if the HO state occurs without a target (first-order state), or misrepresents the target, the theory implies there is still phenomenal consciousness (a "conscious episode") even though nothing is actually being sensed/perceived downstream. This is often called the "problem of targetless HOTs" or "empty HOTs."
      *   Exposure metric: How easily does the theory's architecture allow for a conscious state to exist *solely* in virtue of the HO representation, independent of the actual existence/accuracy of the first-order state?

  3.  **Evaluate Each Theory:**

      *   **(1) Rosenthal's Classic Actualist HOT:**
          *   *Architecture:* Consciousness = First-order state + Distinct, occurrent, non-inferential HOT about that state.
          *   *Exposure:* Rosenthal explicitly bites the bullet here. He argues that if a HOT occurs without a target, the subject is *as if* conscious. He accepts that targetless HOTs generate phenomenal consciousness (though he sometimes argues they are rare or impossible due to causal constraints, the logical possibility remains central to the theory). The phenomenal character is strictly determined by the HOT content.
          *   *Ranking:* Most Exposed. This is the paradigmatic case for this objection.

      *   **(2) Carruthers' Dispositionalist HOT:**
          *   *Architecture:* A state is conscious if it is *disposed* to cause a HOT via the mindreading faculty. The HOT itself doesn't need to occur occurrently.
          *   *Exposure:* This shifts the locus. Consciousness depends on the *dispositional properties* of the first-order state. If there is no first-order state, there are no dispositional properties to ground the consciousness. A "targetless HOT" doesn't make sense here because the HOT is not the constitutive element; the disposition of the FO state is. However, one could argue the mindreading faculty could misfire regarding dispositions. But generally, this view is designed specifically to avoid the targetless HOT problem by anchoring consciousness in the FO state's availability.
          *   *Ranking:* Least Exposed (or Partially). It anchors consciousness in the FO state's properties, not the existence of an occurrent HO state. If the FO state isn't there, the disposition isn't there.

      *   **(3) Lycan's Higher-Order Perception (HOP):**
