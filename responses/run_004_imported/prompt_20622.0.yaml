          *   *Exposure:* Very similar to Rosenthal but modeled on perception. If the inner sense hallucinates a state, there is consciousness. Lycan generally accepts the possibility of error, though he might argue causal constraints make targetless scans unlikely. However, the perceptual model inherently allows for hallucination (targetless perception).
          *   *Ranking:* Most Exposed (or Partially). It shares the distinct-state architecture of Rosenthal. The perceptual analogy makes misrepresentation (hallucination) a natural feature, not a bug, thereby exposing it to the objection that consciousness is decoupled from reality.

