      *   *Naomi:* Could have explained *why* the deep morality matters (e.g., for the drone operator case! It helps the operator decide whether to fire, not just whether they get punished later). She focused too much on punishment and not enough on *action-guidance*.

  5.  **Address Diego's Final Objection ("Cop-Out"):**
      *   Does it land? It's a strong pragmatic critique.
      *   Is there a reply? Yes. Deep morality guides *leaders* and *citizens* even if it can't guide *soldiers* in the fog of war. It also matters for *victim compensation* and *historical judgment*. Crucially for Ethics Bowl: It matters for the *drone operator* who might have more time/info than a grunt.

