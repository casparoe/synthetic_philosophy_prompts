      *   **Source Material:** Michael Walzer's *Just and Unjust Wars* (specifically the "moral equality of combatants" thesis) vs. Jeff McMahan's objections (revisionist just war theory).
      *   **The Conflict:** A debate between two teammates, Diego (defending Walzer/traditional view) and Naomi (defending McMahan/revisionist view).
      *   **Task:** Analyze their exchange move-by-move, evaluate who had the better argument at each step, identify missed moves, specifically address Diego's final objection about "deep morality" having no practical effect, and provide a scoring system (-2 to 2) plus an overall verdict.
      *   **Tone:** Educational, analytical, supportive of an Ethics Bowl team (encouraging critical thinking), but rigorous on the philosophy.

  2.  **Deconstruct the Debate Moves:**

      *   *Move 1 (Diego):* Moral Equality of Combatants (MEC). Soldiers following *jus in bello* (rules of war) aren't murderers even if *jus ad bellum* (cause of war) is unjust. Evidence: We don't prosecute POWs for murder, only leaders.
      *   *Move 1 (Naomi):* Distinction between *excuse* and *justification*. McMahan says unjust killing isn't *justified*, but the soldier might be *excused* (blameless) due to epistemic limitations/indoctrination. Punishment practices don't determine moral status.
      *   *Move 2 (Diego):* Epistemic/Practical Objection. Soldiers can't verify the cause. Refusing orders is dangerous/impossible. Unfair to hold them to a standard they can't meet.
      *   *Move 2 (Naomi):* Concedes the excuse point. Agrees soldiers shouldn't be blamed much. Reiterates the distinction: Blamelessness $\neq$ Moral Permission. The killing is still objectively wrong, even if the soldier isn't culpable.
      *   *Move 3 (Diego):* Legal/Practical Objection. If McMahan is right, symmetric laws of war (LOAC/IHL) are pointless. POW protections rely on symmetry.
      *   *Move 3 (Naomi):* Separation of Morality and Law. McMahan agrees laws should remain symmetric for practical reasons (epistemic limits, reciprocity), even if "deep morality" is asymmetric.
      *   *Move 4 (Diego):* The "Cop-Out" Objection. If deep morality never affects practice/treatment, what work is it doing? It's theoretically idle.

  3.  **Evaluate Each Move (Philosophical Analysis):**

      *   *Move 1:* Diego states the traditional view accurately. Naomi's distinction is the core of McMahan's critique. Naomi is philosophically stronger here because she identifies the category error Diego is making (conflating legal liability with moral justification).
      *   *Move 2:* Diego raises the "epistemic constraint." This is a strong practical point. Naomi accepts it but maintains the theoretical distinction. This is a draw/stalemate, but Naomi holds the theoretical ground better.
      *   *Move 3:* Diego challenges the coherence of the legal system under revisionism. Naomi explains the "two-tier" approach (morality vs. law). This is a standard McMahan move. Naomi wins on exegesis, Diego wins on raising the stakes for implementation.
      *   *Move 4:* Diego challenges the *utility* of the moral theory. This is a meta-ethical/pragmatic challenge. Does a morality that doesn't guide action matter? Naomi missed a chance to explain *guidance* vs. *assessment*.

