answer: |-
  Thank you for being here. For those who knew my father professionally, you know that precision was his primary form of respect. For those who knew him as family, you know that honesty was his primary form of love.

  A month before he died, while he was still lucid in the hospital, he made me promise something about this moment. He told me that if I stood here to speak, I was not to offer you the usual comforts. He asked for no mention of him "watching over us," no assurances that he is in a "better place," and no soft-focus suggestions that grief is simply love with nowhere to go. He spent thirty-five years teaching that careful reasoning matters, and he did not want his own departure to be an occasion for flattening a difficult argument into a comforting platitude.

  He asked me to get the argument right, or leave it out entirely.

  So, I am going to try to get it right. And in doing so, I hope to show you why that specific request was, in itself, the deepest expression of who he was.

  My father was not a religious man in any conventional sense. But for as long as I can remember, he held a private, carefully qualified conviction that something of us survives. This was not based on scripture or revelation. It was based on a line of reasoning he found in the letters Kurt Gödel wrote to his mother.

  The structure of his hope was the structure of his life. It began with a premise about the world we inhabit. My father believed that the universe is genuinely rational, rather than brute and arbitrary. He believed that reality has a structure that makes sense.

  If that premise is true, he argued, then we must look at the nature of a human mind. As a pediatrician, I spend my days watching bodies grow. I see the slow, biological unfolding of a child into an adult. My father spent his days watching minds grow. He saw that a human intellect takes a lifetime to barely begin to develop its capacities. We spend twenty years learning how to think, thirty years learning how to think well, and by the time we have the wisdom to use that thinking for something enduring, our time is often up.

  He taught me that if the world is rational, it would amount to a standing absurdity for a mind to spend a lifetime constructing a capacity for truth, for beauty, for logic, only to be extinguished the moment it starts to get somewhere. It would be like building a great library and burning it the day the first book is cataloged.

  To him, that was not just sad; it was illogical. It was inconsistent with a rational universe.

  Therefore, he concluded, a rational world gives us real, if modest, grounds to expect that this development continues in some form.

  I want to be scrupulously honest about what he told me this argument does, and what it does not do. It does not prove immortality. It does not offer a map of an afterlife. It does not guarantee that we will recognize each other, or that time exists where he is going. It is not a shield against the pain of loss. I feel that pain acutely, standing here eleven days after we lost him.

  But it offers a warrant for hope. It suggests that death is not a period, but perhaps a comma. It suggests that the work he loved—the work of making sense of things—is not the kind of work that simply stops.

  I know that half of you are hearing this and recognizing the specific lineage of that thought. You know the letters. You know how carefully he would qualify this in his introductory logic course, usually in the last lecture of the semester. He would tell his students that this was not a proof, but a rational expectation. He would warn them against the error of claiming too much.

  And I know the other half of you are hearing this and wondering if this is too cold for a funeral. You are wondering where the warmth is.

  But this *was* his warmth. This was how he loved us. He did not love us by promising us things he couldn't guarantee. He loved us by showing us that the world makes sense. He loved us by treating our minds as things that were worth developing, even when we were thirteen and grieving our mother, even when we were adults and afraid of losing him.

  When my mother died, I was thirteen. He used this same argument on me then. He sat me down and explained that while he could not know for certain where she had gone, it would be unreasonable to think her capacity for love had simply vanished into nothingness. He didn't hug me and tell me everything would be okay. He gave me a reason to believe it might be. He gave me a structure to hold onto when the world felt arbitrary.

  That is what he has left us with now.

  He has left us with the conviction that the work we do matters. That the time we spend developing our capacities is not wasted. That the rationality he cherished in the universe is not indifferent to the minds that strive to understand it.

  I am a doctor. I deal in biological facts. I know that his heart has stopped. I know that his brain has ceased to function. I am not standing here denying the mechanics of death.

  But I am standing here honoring the mechanics of his hope.

  If he is right—if the world is rational, and if the mind is more than a temporary byproduct of matter—then he is not gone in the way that feels most absolute. He has simply moved beyond the scope of our current variables.

  He asked me not to tell you that he is watching over us. I cannot know that.
  He asked me not to tell you that he is at peace. I cannot verify that.
  He asked me to tell you that it would be absurd for the story to end here.

  And looking at the life he lived, looking at the clarity he brought to his students, the patience he brought to his family, and the rigor he brought to his own end, I find that I agree with him. It would be absurd.

  So we grieve. We grieve the silence in his study. We grieve the empty chair at the table. We grieve the fact that we cannot ask him one more question. But we do not grieve as those who believe the light has been switched off. We grieve as those who believe the light has moved into a room we cannot yet see.

  He kept his promise to us, to live a life of reason and integrity. I hope, in these few minutes, I have kept my promise to him.

  Thank you.
