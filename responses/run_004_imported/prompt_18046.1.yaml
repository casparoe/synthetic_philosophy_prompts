      *   *Sovereignty/Exclusion:* Dummett definitely argues against the absolute right of states to exclude. He uses the UK historical example extensively (Commonwealth Immigrants Acts, etc.) to show how "rights to exclude" were used for racist purposes. This part of the essay is accurate.
      *   *Veil of Ignorance:* **Red Flag.** Dummett is a Wittgensteinian philosopher of language and logic, not a Rawlsian political theorist. While he uses moral reasoning, the specific "veil of ignorance" argument regarding *which country one is born into* is much more characteristic of Joseph Carens ("Aliens and Citizens: The Case for Open Borders," 1987) or perhaps Gillian Brock. Dummett's argument is more rooted in the moral inconsistency of nationalism and the specific duties arising from global interdependence and historical ties (especially Commonwealth), rather than a Rawlsian original position applied globally. This is a significant attribution error.
      *   *Refugees vs. Economic Migrants:* Dummett does distinguish them. He argues for a very strong duty to refugees (asylum). Regarding economic migrants, he acknowledges the "brain drain" concern but generally argues for a much more open policy than currently exists, though not necessarily *completely* open. He emphasizes the right to *leave* a country implies a right to *enter* somewhere.
      *   *Open Borders Conclusion:* This is the crux of the TA's housemate argument. Dummett's book is often cited by open borders advocates. However, Dummett himself is cautious. He argues for a *presumption* in favor of admission, shifting the burden of proof to those who want to exclude. Does this equal "open borders"? Carens says yes (morally). Dummett is often read as saying "almost, but with specific constraints regarding integration and specific historical obligations." The student argues it *functions* as open borders "in all but name." This is a defensible interpretive claim, *provided* the reconstruction of the argument leading up to it is accurate.

