answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], and I had the privilege of being my mother's child.

  She died this past February, closing out nearly seven years of Alzheimer's. If you were part of her life before the illness, you know the woman she was: sharp, funny, present. If you were part of her life during the illness, you know the woman she became. And I think many of us have spent the last week trying to reconcile those two people.

  Usually, when we speak about dementia, we reach for comforting lines. We say, "She may have forgotten, but deep down, she still knew us." We treat memory like a object hidden in a box inside the person, and the disease just buried the box. We tell ourselves the real her was still in there, looking out through the confusion, recognizing us in silence.

  I want to be honest with you today, because she would have wanted that. I don't think that's what was happening. Not at the end.

  There were months near the finish where the floor of her world didn't just get cluttered; it gave way. There came a time when she was no longer sure she had a body. There came a time when my father—the man she loved and lived with for over fifty years—was not a husband she had forgotten, but a stranger who happened to be gentle.

  For a long time, I struggled to find language for that that didn't sound like I was saying she was gone before she died. But I found a way of thinking that helped me, and I'd like to share it with you.

  We tend to think that knowing something is a matter of having proof. Like I know I have hands because I can see them. But the truth is, most of what we know isn't held up by proof at all. It's held up by habit. There are certain things that just "stand fast" for us. Things like: *I have a body. This is my home. This is my husband.* We don't question them any more than a door questions its hinges. They are the fixed points that allow the rest of our life to swing open and shut.

  For most of us, those hinges hold. For my mother, slowly, like a riverbed shifting under the water, they began to move.

  When I realized this, it stopped hurting quite as much to look at those final months. Because it means that who she was wasn't a secret fact locked inside her skull that the disease stole. Who she was existed in the space between us. It was something we built together, out loud, over fifty years. It was a practice. It was the way she said my father's name at breakfast. It was the way she held my hand. It was the shared certainty that we were a family.

  Certainty like that isn't a stone you keep in your pocket. It's a bridge you walk across together. And when the illness came, it didn't just steal her memory; it loosened the bolts on her side of the bridge.

  Acknowledging that doesn't diminish her. It actually honors the reality of what we shared. It means that for fifty years, she didn't just "have" love for us; she *did* love with us. She participated in it. She upheld her end of the certainty.

  And I need to say something about my father. When those hinges loosened for her, when he became a stranger in her eyes, he did not become a stranger in his actions. He stayed. He was gentle. He continued the practice of being her husband, even when she could no longer hold up her end of that definition. If identity is something we do together, then in those final months, he was doing enough for both of them.

  So, I am not going to tell you that she is somewhere now, whole again, remembering us clearly. I don't know that. What I know is that for half a century, she helped build a world where we were certain of each other. We stood on ground she helped pack down.

  The riverbed shifted. The hinges came loose. But the door still opened. And we are all still standing here, on the ground she helped lay, loved by the woman she was, and cared for by the woman she became.

  Thank you.
