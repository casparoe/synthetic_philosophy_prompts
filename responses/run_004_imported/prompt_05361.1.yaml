  2.  **Deconstruct the Philosophical/Technical Core:**
      *   *Deflationism:* Truth is not a substantive property. The T-schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$) exhausts the concept. It's a logical device for generalization (e.g., "Everything the Pope says is true").
      *   *Conservativeness Objection:* If truth is *just* a logical device, adding it to a base theory (like Peano Arithmetic, PA) shouldn't allow you to prove new facts about the base domain (numbers). It should be *conservative*.
      *   *The Problem:* Compositional truth theories (like CT or FS) allow you to prove $Con(PA)$ (the consistency of PA). By Gödel's 2nd Incompleteness Theorem, PA cannot prove $Con(PA)$. Therefore, truth theories are *non-conservative* over PA.
      *   *Implication:* If truth allows new arithmetical proofs, it seems to have substantive content (it tells us something new about numbers), contradicting deflationism.
      *   *Potential Deflationist Replies:*
          1.  *Accept Non-Conservativeness:* Argue that conservativeness isn't the right criterion for "thinness." (Shapiro argues against this, but some deflationists try).
          2.  *Change the Base Theory:* Maybe PA isn't the right base. Maybe we implicitly commit to more than PA when we accept arithmetic.
          3.  *The "Generalization" Defense:* The proof of consistency uses truth to generalize over sentences, which is the *point* of truth. The arithmetical consequence is a byproduct, not the essence.
          4.  *Reflection Principles:* We are committed to reflection principles implicitly. Truth just makes them explicit.
          5.  *Tennant's/Field's Approach:* Distinguish between *logical* consequence and *epistemic* entitlement. Or argue that the non-conservativeness arises from specific axioms (composition) that aren't essential to minimalism.
