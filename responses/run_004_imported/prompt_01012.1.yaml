prompt: |-
  I'm a high school student working on an independent project about the philosophical assumptions behind the Turing test, and I've been struck by a part of Alan Turing's 1950 paper "Computing Machinery and Intelligence" that almost never comes up in the popular discussions I've read. Among the objections he considers, one is "The Argument from Extrasensory Perception," where Turing says the statistical evidence for telepathy is "overwhelming" and proposes that contestants might need to sit in a "telepathy-proof room" for the imitation game to remain a fair test. I'd like you to compare this argument with the general evidentiary standard Turing relies on everywhere else in the paper, where "thinking" is to be judged only by observable, testable behavior within the game itself. In what ways does his willingness to accept the case for ESP sit uneasily with that otherwise careful, behavior-based standard of evidence, and in what ways might the two actually rest on the same underlying logic about when evidence becomes too strong to dismiss? Please engage with the strongest version of both sides rather than treating his ESP discussion as a dated curiosity to be brushed aside.
