answer: |-
  **Setting:** *Rochester, New York. November 1852. The back room of the North Star office. The air is thick with tobacco smoke and the chill of late autumn. Frederick Douglass stands by the fireplace, warming his hands. Wendell Phillips, the "Golden Trumpet" of abolition and Douglass's former closest ally, sits at a table covered in pamphlets. The tension is not hostile, but heavy with the weight of a broken friendship.*

  **Phillips:** (Tapping a copy of Douglass's recent editorial) You call it a "glorious liberty document" now, Frederick. Three years ago, you stood on the platform in Boston and called it a "sham." You held up the chains and asked if the Constitution forged them. Now you say the chains are imaginary?

  **Douglass:** I said the *usage* was a sham, Wendell. The practice. I did not say the text itself was forged in hell. There is a difference between what a man does with a tool and what the tool is made to do.

  **Phillips:** A tool? Is that what the Constitution is? A neutral hammer? When the framers gathered in Philadelphia, they counted the enslaved as three-fifths of a man to boost the South's representation. They forbade Congress from touching the slave trade for twenty years. They mandated the return of the fugitive. You were there in the galleries of history with us when we read these clauses. You know the intent. To ignore the intent is to lie about the document.

  **Douglass:** I do not ignore the intent. I reject the idea that the sins of the fathers bind the children forever. But look at the paper itself. Show me the word "slave." Show me the word "slavery." You cannot. It speaks of "persons held to service or labor." It speaks of "other persons." It uses the language of property without admitting the property exists. If the Constitution meant to sanction slavery, why did it hide its face? Why did it blush to speak the name?

  **Phillips:** Because they were cowards! They wanted the profit of slavery without the moral stain of naming it. That doesn't make it anti-slavery; it makes it hypocritical. And hypocrisy is the devil's best armor. You say the text is clean? What of the Fugitive Slave Clause? Article IV, Section 2. It commands that a person escaping to a free state shall be "delivered up." That is the federal government acting as the slave-catcher. That is the Union holding the leash.

  **Douglass:** It says "delivered up." It does not say *who* must deliver them. It does not say the federal marshal must hunt them. It is a compact between states. If New York refuses to aid Virginia, Virginia has no federal arm to twist hers. The Constitution gives the Federal Government no power to establish slavery in the states. None. It is a creature of the states. If we seize the government, Wendell, we can starve the beast. We can surround it with free states until it suffocates.

  **Phillips:** (Leaning forward, voice low) That is the politics of expediency. You are trading moral purity for a seat at the table. The Garrisonian position is simple: You cannot vote for a government that protects murder. To vote is to swear an oath to support the Constitution. If the Constitution protects the master's right to whip the slave, then casting a ballot is dipping your hand in the slave's blood.

  **Douglass:** And what does your purity buy the slave? Disunion? You say "No Union with Slaveholders." You want the North to secede. If the North leaves the Union, what happens to the slave in Maryland? In Virginia? They are left alone with the master. The Union is the only chain strong enough to bind the South. If we break the Union, we break the chain that holds *them*, not the one that holds *us*.

  **Phillips:** We break the chain of complicity! If the North separates, the South becomes a pariah nation. The fugitive finds safety immediately because there is no federal law to drag him back. You are arguing for a political victory that may take fifty years. I am arguing for immediate moral separation. You are telling the slave to wait while you play at elections.

  **Douglass:** I am telling the slave that the law is not a monolith! You treat the Constitution as a single block of granite. I tell you it is a field of battle. The Preamble says "secure the blessings of liberty." The 5th Amendment says no person shall be deprived of life, liberty, or property without due process. If the slave is a person—and God knows he is—then the Constitution guarantees his liberty! The courts have twisted it, yes. The politicians have lied, yes. But the weapon is there, in the text, waiting for a hand strong enough to wield it.

  **Phillips:** (Stands up, pacing) You sound like a lawyer now, Frederick. Not the man who tore up the chains on the stage. You are parsing grammar while men are flayed. The Garrisonians have a comeback to this, and you know it. If the text is so anti-slavery, why did every President, every Justice, every Congressman for sixty years read it as pro-slavery? Are they all blind, and only you see?

  **Douglass:** They are blind because they benefit from the blindness! And I am not the only one. Lysander Spooner reads it as I do. Gerrit Smith reads it as I do. We are not alone. But to answer you: Just because a thief uses a key to open a house doesn't mean the key was made for theft. The framers may have compromised. They may have been weak men. But they wrote words that are bigger than they were. They wrote "We the People," not "We the White Men." They wrote "Liberty," not "Liberty for some." I will hold them to their own words until those words burn them.

  **Phillips:** And if they don't burn? If the courts rule, as they surely will, that the "persons" mentioned are property? You are betting the freedom of a race on a interpretation that the Supreme Court rejects. You are walking into a trap. You are telling black men to trust a government that hunts them.

  **Douglass:** I am telling them to fight for the government! There is a difference. I will not stand outside the house screaming that it is on fire. I will go inside and throw water on the flames. You want to burn the house down to kill the rats. I say the house belongs to us, and we have the right to evict the rats.

  **Phillips:** (Stops pacing, looks Douglass in the eye) You speak of the house. I speak of the foundation. The foundation is rotten. You cannot build liberty on a document that counts my brother as three-fifths of a man. It is a covenant with death. I burned a copy of it, Frederick. I would burn it again.

  **Douglass:** (Quietly) I know you would. And I loved you for your fire. But I have looked into the eyes of men who say the law forbids them to help me. I have seen the Constitution used as a shield for the whip. But I have also realized something, Wendell. If the Constitution is pro-slavery, then the abolitionist has no legal ground to stand on. We are merely rebels. But if the Constitution is anti-slavery, then the *slaveholder* is the rebel. He is the one violating the supreme law. I want the law on my side. I want the flag on my side.

  **Phillips:** You risk making the flag a shroud. If you join the political parties, you must compromise. You will have to swallow half-measures. You will have to shake hands with men who hate you but want your vote. Is that worth it? To dirty your hands to clean the document?

  **Douglass:** My hands are already dirty. My back still bears the scars of the overseer. I am not a philosopher in a study, Wendell. I am a man who wants results. If I can save one man from bondage by voting for a man I despise, I will do it. If I can save a million by interpreting a clause you think is damned, I will do it. Your way keeps your conscience clean. My way keeps the slave's back whole.

  **Phillips:** (Sits back down, rubbing his temples) You always did fight harder than any of us. That is why we lifted you up. And that is why this cuts so deep. It feels as though you are saying our work was a sin. That moral suasion was a waste.

  **Douglass:** No. Moral suasion woke the world. It made this conversation possible. Without you, without Garrison, I would still be in chains, or dead in a ditch. You broke the soil. I am just trying to plant a crop that can be harvested. But we cannot plant in the same field anymore. You believe the soil is poisoned. I believe it can be tilled.

  **Phillips:** (A long silence) Then we are at an impasse. I cannot support your political party. I cannot endorse this reading of the Constitution. To me, it is a dangerous illusion.

  **Douglass:** And I cannot support disunion. To me, it is abandonment. But Wendell... (Douglass walks to the table and places a hand on the pamphlets) ...we both want the same end. The monster must die. You want to starve it. I want to stab it.

  **Phillips:** (Looks up, a sad smile touching his lips) Just be careful, Frederick. When you stab a monster, make sure you don't mistake the handle of the knife for the blade. The Constitution bites.

  **Douglass:** I have been bitten before. I know the feel of teeth. But I will not let go of the throat.

  **Phillips:** (Stands and gathers his coat) Then God speed you. Though I pray you do not find yourself holding the devil's contract when the bill comes due.

  **Douglass:** And I pray you do not find yourself standing on the shore, safe and pure, while the ship goes down with all hands.

  *(Phillips pauses at the door, looks back once, then exits into the cold. Douglass turns back to the fire, staring into the embers as the room grows dark.)*
