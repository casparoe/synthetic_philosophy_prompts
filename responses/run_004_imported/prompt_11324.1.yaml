      *   *Point 1: The Nature of the Tautology Charge.* It's not just about "can we test this specific case?" It's about the logical structure of the theory. If the core principle is analytic, no amount of empirical examples makes the *principle* synthetic.
      *   *Point 2: Popper's Recantation was Phenomenological, Not Structural.* Popper pointed to industrial melanism. He said, "Look, we can test this." But he didn't explain *how* 'fitness' is measured independently of 'survival' in those tests. He just assumed it could be done.
      *   *Point 3: The Propensity Move is Distinct.* Mills & Beatty explicitly tackled the definition of fitness. They separated the *disposition* from the *manifestation*. Popper didn't do this in his recantation.
