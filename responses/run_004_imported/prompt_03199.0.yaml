      *   *Verdict:* The user is right to be worried. This is the "Zero Point Problem" in bargaining-based ethics. Harsanyi's Social Aggregation Theorem uses *sums* (Utilitarianism) precisely to avoid this scaling issue. Nash aggregation requires cardinal comparability *and* a zero point.

