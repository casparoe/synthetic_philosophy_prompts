      *   **Menkiti's View:** Personhood is acquired over time through communal participation/obligations. Community has ontological priority. Children/rebels are "lesser" persons.
      *   **Gyekye's View:** Moderate communitarianism. Acknowledges social nature but insists on inherent individual capacities (rational agency) prior to social recognition. Necessary for rights and moral reform.
