  *(Self-Correction Note during final polish)*: Make sure Adjoa doesn't sound *too* authoritarian. Menkiti's point is about moral maturity, not just blind obedience. She needs to emphasize that the "community" isn't just the current majority, but the ancestral/normative continuum. Kofi needs to acknowledge this but insist it's insufficient for protection.

  8.  **Final Polish:** Check the ending. It needs to land on the "crux." The crux is whether the *source* of moral worth is internal (capacity) or external (recognition/role).

