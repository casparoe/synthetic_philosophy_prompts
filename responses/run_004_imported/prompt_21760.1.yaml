answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the honor of being [Groom]'s best man.

  Now, [Groom] and I go back a long way. Long enough that I know how his brain works. Most people, when they're getting married, talk about flowers, or venues, or how they met. [Groom], at his bachelor party, three drinks in, gave us an impassioned speech about the St. Petersburg Paradox.

  Specifically, he wasn't talking about the old version. He was talking about ergodicity. Now, for the parents and normal people in the room, don't tune out. This is actually the most romantic thing I've ever heard him say.

  Basically, in probability, there are two ways to look at the future. One way is to imagine a thousand parallel versions of yourself making a bet all at once. That's the "ensemble average." It's theoretical. It's clean. But it's not real.

  The other way is to look at *one* version of yourself making that same bet over and over, day after day, through actual time. That's the "time average." That is the only one that matters, because you don't get to live a thousand lives. You don't get to average out your mistakes across a multiverse. You just get this one timeline. You get the mornings, the Tuesdays, the hard days, and the quiet nights.

  At the bachelor party, [Groom] looked at me and said, "The ensemble average and the time average come apart, and only one of them describes the life you actually live."

  And I realized: That is marriage.

  It is easy to look at the "ensemble"—all the theoretical partners you *could* have had, all the perfect scenarios that exist in your head. But that's a phantom. Love isn't found in the parallel universes where everything goes perfectly. Love is found in the time average. It's in the sequence. It's in showing up for the next draw, and the one after that, with the same person.

  [Groom] told me earlier tonight that he's finally found a local maximum he has no intention of escaping. For the rationalists, he means he's optimized his happiness. For everyone else, he means he's found the peak, and he's staying right here.

  Because [Bride], you are the variable that makes the time average worth living. You make the sequential path beautiful. You make the risk of ruin worth taking, because the growth you build together compounds in a way no theoretical bet ever could.

  [Groom], you spent years worrying about the math of the ensemble. But tonight, you stop calculating. You just live the time.

  So, if everyone could please raise a glass.

  To the ensemble averages we ignore, and to the one timeline we get to keep. To [Bride] and [Groom]. May your time average be long, may your growth be compounding, and may you always choose each other, every single day.

  To the happy couple.
