      *   *Point 2: Essence vs. Description.* Distinguish between "the description in my head" (clear, wet, drinkable) and "the actual stuff in the world" (H₂O). Putnam says reference is about the stuff, not the description.
      *   *Point 3: Causal Chain.* How did the word get there? Baptism/ostension. "I call this stuff 'water'." It locks onto whatever *that* is.
      *   *Point 4: Division of Linguistic Labor.* Address the "waiting for chemists" point. We don't wait. We refer to the stuff *now*. Chemists just tell us *what* we were referring to all along.
