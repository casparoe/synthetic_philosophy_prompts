      *   Philosophy/Reason is the realm of Mind (tries to find justice but fails).
      *   Grace is the realm of Charity (where true Justice resides).
      *   *Crucial Point:* Trying to find true Justice in Politics is a category error. It's like expecting a King to be wise just because he's strong.

