      *   *Custom/Pyrenees:* Truth varies by geography. This suggests moral relativism *in practice*, but for Pascal, this is a symptom of the Fall, not an ontological truth. Custom stabilizes society, but it isn't Truth.
      *   *Three Orders:*
          1.  Order of Bodies (Power, Force, Politics, Kings).
          2.  Order of Minds (Knowledge, Science, Philosophy).
          3.  Order of Charity (Saints, God, True Justice).
      *   *The Connection:* Politics belongs to the Order of Bodies. True Justice belongs to the Order of Charity. Therefore, political justice is always a sham *relative to divine justice*, but necessary *relative to human sin*.

  3.  **Address the "Hobbesian Cynicism" Misreading:**
      *   Hobbes: There is no natural justice; the Sovereign defines it. (Moral/ontological claim).
      *   Pascal: There *is* natural justice, but we are too corrupted to see it reliably. So we use force/custom as a placeholder. (Epistemic/Theological claim).
      *   *Key distinction:* Pascal believes in objective justice (God), but denies human capacity to grasp it politically. Hobbes denies objective justice exists independently of the contract.

