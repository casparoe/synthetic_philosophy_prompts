          *   *Hegel:* Correct context. Hegel opposes social contract theory where state protects pre-existing rights.
          *   *Assessment:* Strong on (c). Captures the "ideality" point well.

      *   **Extra: Institutional Decision & Constraints.**
          *   *Student Claim:* Decision to declare war assigned to the legislature acting through the Estates.
