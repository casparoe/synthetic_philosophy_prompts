          *   *Refinement:* Woodwardians handle preemption by looking at the *path*. If we intervene on A, we must not change B. But if the scenario is "A preempts B", then B's *effect* is preempted.
          *   *Crucial Distinction:* Lewis relies on the *actual sequence* of events. Woodward relies on the *invariance of the relationship* under intervention.
