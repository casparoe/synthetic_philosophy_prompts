      *   *Better Woodwardian move:* Focus on the *active path*. The path from B to E is *inactive* because the mechanism is blocked by A. Interventionism handles this by looking at the structural equations. If we fix the intermediate variable (the state of the breaker mechanism before B arrives), A matters.
