prompt: |-
  So my podcast (tiny thing, maybe 40 listeners, mostly people from my cohort) finally landed a guest whose written a whole book on Sidgwick and the Society for Psychical Research, and I really don't want to waste it on softball questions. Everyone already knows the "weird fact" version of this story -- eminent utilitarian spends thirty-odd years testing mediums and running hallucination surveys, ha, funny footnote to a serious philosopher -- and that's not what I want. My supervisor's stock answer is that it's obviously connected to the dualism of practical reason from the concluding chapter of the Methods of Ethics, i.e. he wanted empirical backing for the idea that duty and self-interest ultimately coincide, but I don't want the episode to just confirm that and move on. I keep getting stuck on the same worry myself: even if the SPR had turned up airtight evidence for survival after death, that seems like it would at most show egoism and utilitarianism happen to coincide in this particular universe, not that they were ever rationally reconciled as a matter of principle. I want the questions to push on that gap specifically.

  Could you draft me 8 to 10 interview questions, each with a quick follow-up keyed to whatever answer the guest will probably give (the way you'd actually respond live, not just move to the next item on a list)? I want at least one question on that empirical-evidence-vs-rational-resolution gap, one specifically on the Creery sisters investigation and what the later signalling business did to Sidgwick's credibility as an investigator, one on what the Census of Hallucinations was actually supposed to establish and whether it could even in principle do that job, one comparing his insistence on rigorous evidence in the SPR work to his own resignation from his Trinity fellowship over not being able to honestly subscribe to the Articles anymore, and one asking whether the whole psychical research project is best read as a symptom of the dualism rather than a serious attempt to resolve it. Reorder however makes sense for flow, I just don't want it reading like a wikipedia summary with question marks stuck on the end of each sentence.
