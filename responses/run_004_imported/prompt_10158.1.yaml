answer: |-
  Here is a draft for 10 interview questions, ordered to build a narrative arc from the historical context into the methodological specifics, and finally landing on the philosophical core you want to interrogate. The follow-ups are designed to keep the conversation moving if the guest gives the standard "textbook" answer.

  ### Segment 1: Motivation and Method

  **1. The "Footnote" Problem**
  "Most introductions to Sidgwick treat the SPR as a quirky biographical footnote—the stern utilitarian letting his hair down to chase ghosts. But your book argues this was central to his project. If we strip away the psychical research, does the *Methods of Ethics* actually stand on its own, or does the system collapse without the *hope* of the SPR's success?"

  *   **Follow-up:** "If you say it collapses: Does that mean Sidgwick was essentially gambling the validity of his ethical system on the reliability of Victorian mediums? That feels like an incredibly high-stakes wager for an empiricist."

  **2. The Census of Hallucinations**
  "I want to look at the Census of Hallucinations. On the surface, it looks like a data-gathering exercise to prove hallucinations weren't limited to the 'insane.' But was the real goal to normalize the *capacity* for psychical experience rather than prove specific instances? And if so, was the methodology actually capable of carrying that weight?"

  *   **Follow-up:** "If you argue it was methodologically sound: How do you reconcile that with the fact that the Census relies entirely on self-reporting? For a philosopher obsessed with rigorous proof, why was anecdotal aggregation enough here when it wouldn't be in ethics?"

  **3. The Creery Sisters and Signalling**
  "Let's talk about the Creery sisters. The SPR initially hailed the thought-transference experiments as a breakthrough, but then the signalling accusations came out. Sidgwick didn't immediately abandon the project, but his credibility took a hit. Do you read his persistence there as scientific tenacity, or was he unable to let go of the data because he needed it to be true?"

  *   **Follow-up:** "If you suggest it was tenacity: At what point does 'tenacity' become 'confirmation bias'? Was there a moment in the archives where you saw him acknowledge that the cost to his reputation might outweigh the potential evidence?"

  ### Segment 2: Integrity and Consistency

  **4. Trinity and the Articles**
  "There's a striking parallel between his SPR work and his resignation from his Trinity fellowship. In one case, he steps down because he can't honestly subscribe to the 39 Articles; in the other, he demands empirical proof for spiritual claims before accepting them. Is the connecting thread here a specific kind of intellectual honesty, or is there a tension between how he treated religious dogma versus psychical data?"

  *   **Follow-up:** "If you say it's consistent honesty: It feels like he applied a higher standard of skepticism to the Church than to the mediums. Why was the burden of proof lower for a séance than for a creed?"

  **5. Public vs. Private Sidgwick**
  "Sidgwick was famously reserved, almost esoteric, about his own doubts. He kept the 'Dualism of Practical Reason' somewhat contained in the concluding chapter. Did he treat the SPR work similarly? Was psychical research a public scientific project, or was it a private workaround for a problem he didn't want to fully air in the *Methods*?"

  *   **Follow-up:** "If it was private: Does that change how we read his utilitarianism? If the 'coincidence of duty and interest' relies on evidence he's gathering in the shadows, is the public philosophy incomplete?"

  ### Segment 3: The Philosophical Gap (Your Core Worry)

  **6. Empirical Evidence vs. Rational Reconciliation**
  "This is the worry I keep coming back to, and I'd love your take. Even if the SPR had found airtight, reproducible evidence for survival after death, that would only show that egoism and utilitarianism *happen* to coincide in this universe. It doesn't show they are *rationally* reconciled. Did Sidgwick miss that gap? Did he think empirical coincidence was enough to solve a rational problem?"

  *   **Follow-up:** "If you say he knew the gap: Then why spend 30 years on the empirical side? Was he hoping that if the *fact* of survival was proven, the *rational* necessity would follow? That seems like a category error."

  **7. Symptom or Solution?**
  "Following on from that: Is the psychical research project best read as a serious attempt to resolve the Dualism, or is it a symptom of the Dualism itself? I'm wondering if the SPR wasn't the cure, but rather the manifestation of his anxiety that reason alone couldn't do the job."

  *   **Follow-up:** "If it's a symptom: That paints a more tragic picture of Sidgwick. It suggests he knew reason had hit a wall and was grasping at science to bail him out. Do you think he realized that by the end of his life?"

  **8. The "Moral Order"**
  "Sidgwick seemed to need a 'Moral Order' to guarantee that virtue pays. The SPR was looking for the mechanism of that order. But if the mechanism is just 'ghosts punish bad people,' doesn't that reduce morality to a calculation of consequences in the afterlife? Does that undermine the deontological force he wanted duty to have?"

  *   **Follow-up:** "If you say it doesn't undermine it: How do you distinguish Sidgwick's 'Moral Order' from a cosmic hedonic calculus? Is there any room for duty for duty's sake if the universe is rigged to reward it?"

  ### Segment 4: Legacy and Interpretation

  **9. The Victorian Context**
  "We often judge Sidgwick by modern standards of evidence. But in the 1880s, the line between psychology, physics, and psychical research was blurry. To what extent was Sidgwick actually leading the scientific consensus, and to what extent was he already an outlier among his philosophical peers?"

  *   **Follow-up:** "If he was an outlier: Who was he trying to convince? Was the SPR work performative for the scientific community, or was it genuinely for his own peace of mind?"

  **10. Reading the *Methods* Today**
  "Finally, for my listeners who are grappling with the *Methods of Ethics*: How should the existence of this book, and Sidgwick's SPR work, change the way we teach the text? Do we teach the Dualism as a failure of the system, or as the honest conclusion of a man who looked everywhere else for an answer and couldn't find one?"

  *   **Follow-up:** "If it's an honest conclusion: Does that make Sidgwick more compelling as a thinker, or does it ultimately weaken the utilitarian project to admit it requires supernatural backing to function?"
