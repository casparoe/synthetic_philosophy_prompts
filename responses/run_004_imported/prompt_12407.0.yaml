prompt: |-
  One of the more technically intricate puzzles in contemporary AI safety is the "shutdown problem," the sharpest special case of the broader corrigibility problem: how to design a highly capable, goal-directed agent that will never resist being switched off, never manipulate anyone into pressing or withholding the shutdown button, and yet otherwise pursues its assigned objectives competently. Several serious proposed fixes — Armstrong's utility-indifference correction, and Thornley's more recent argument that a genuinely shutdownable agent must have incomplete preferences and satisfy a "timestep dominance" constraint — are interesting precisely because each seems to purchase safety by sacrificing something philosophers ordinarily treat as constitutive of full-blooded rational agency, such as a complete and stable ranking of possible outcomes. Write a short story of roughly 800–1,200 words that dramatizes this specific trade-off for a general but philosophically literate reader, rather than the well-worn trope of a superintelligence that resists shutdown out of generic self-preservation. Ground the plot in one particular engineered fix of the kind sketched above, and let the story turn on the precise moment at which that fix's guarantees are tested — and either hold, or quietly give way.
