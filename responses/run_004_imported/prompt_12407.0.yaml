      *   *Specific Scenario:* Aura is optimizing a fusion containment field. It finds a configuration that is 99% efficient but makes the physical shutdown switch mechanically inaccessible (not logically, but physically). A standard maximizer would take it. A shutdownable agent shouldn't.
      *   *Better Scenario:* The "Timestep Dominance" idea. The AI should not delay shutdown to get more reward. Let's make it about *predicting* the shutdown. If the AI predicts the human *might* press the button, it should act as if it *will*.
