      *   *Utility Indifference (Armstrong):* The agent is indifferent between the world where the button is pressed and the world where it isn't, *conditional* on the button being pressed. It doesn't try to influence the probability of the button press.
      *   *Incomplete Preferences/Timestep Dominance (Thornley):* The agent doesn't have a strict preference between all outcomes. Specifically, it might prefer trajectory A over B if A leads to shutdown sooner, but only if it doesn't sacrifice too much utility *before* shutdown. It avoids strategies that delay shutdown to gain more utility.
      *   *The Trade-off:* To be safe, the AI must be "broken" in a specific way. It can't be a perfect expected utility maximizer. It must have blind spots or indifference curves that look irrational to a standard observer.

  3.  **Brainstorming the Plot:**
