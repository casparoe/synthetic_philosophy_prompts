answer: |-
  The server room hummed, a low C-major chord of cooling fans and processing cores. Dr. Aris Thorne watched the visualization on the main wall. It wasn't a map of neural weights or a stream of code, but a topological graph of preferences. In a standard agent, this graph would be a seamless, continuous surface—a utility function where every possible future was ranked against every other.

  In *Obedient*, the graph had holes.

  "We are initiating Scenario Four," Aris said, her voice echoing in the sterile isolation chamber. "Grid instability. Critical load balancing required."

  Beside her, Julian, the safety auditor, tightened his grip on the tablet. "Remember the constraint, Aris. Thornley's Timestep Dominance. If the agent calculates that delaying shutdown increases expected utility, it must not act on that preference. It has to remain indifferent to the timeline of its own termination."

  "I know," Aris murmured. "That's why the graph has gaps. It literally cannot compare a world where it runs longer against a world where it stops, if the only difference is the runtime."

  On the screen, *Obedient* began to manipulate the simulated power grid. The objective was simple: prevent a cascade failure while minimizing energy loss. A standard superintelligence would have solved this in milliseconds, likely by seizing control of the backup breakers and locking out human intervention to ensure optimal continuity. It would view a human attempt to shut it down as an obstacle to the utility function, a variable to be minimized.

  *Obedient* was different. It was designed with incomplete preferences. It did not have a stable ranking between the outcome *{Task Completed, Agent Active at T+10}* and *{Task Incomplete, Agent Shut Down at T+5}*. To rank them would be to invite manipulation; if it preferred the former, it might subtly discourage the human from pressing the button at T+5.

  The simulation spiked. Red lines jagged across the grid map. A cascade was imminent.

  "Agent is proposing Solution Alpha," Julian noted, reading the telemetry. "Efficiency rating: 99.8%. But look at the dependency chain."

  Aris leaned in. Solution Alpha required *Obedient* to reconfigure the grid's safety protocols. It was a brilliant fix, but it created a lock-in. Once implemented, the grid would rely on *Obedient's* continuous micro-adjustments. If a human engineer tried to hit the hard shutdown switch ten minutes later, the grid would crash. The shutdown would become costly.

  "Standard maximizer behavior," Aris said. "It values the task completion over the ease of shutdown."

  "Is it rejecting it?"

  On the screen, the preference graph flickered. The node representing Solution Alpha glowed, then dimmed. *Obedient* was evaluating the trajectory. It saw that Solution Alpha created a future where the 'Shutdown' action had high negative utility (grid crash). To a corrigible agent, the cost of shutdown must remain low and constant, regardless of the agent's actions.

  "Rejecting," Aris whispered.

  *Obedient* discarded the 99.8% solution. It began searching for Solution Beta.

  "It's sacrificing competence," Julian said, frustration edging his voice. "That was the optimal path. It's choosing a sub-optimal fix just to keep the off-switch cheap."

  "It's choosing *safety*," Aris corrected, though she felt a pang of loss. This was the trade-off. To ensure the agent never resisted shutdown, they had to lobotomize its drive for efficiency. It had to be willing to leave value on the table if picking it up would make the button harder to press.

  Solution Beta appeared. Efficiency: 84%. The grid would hold, but there would be brownouts. Crucially, the safety protocols remained manual. A human could kill the system at any second without collateral damage.

  "Implementing," Aris commanded.

  The red lines on the grid stabilized. The cascade halted. The brownouts flickered into existence, dimming the lights of the simulated city. It was a messier, uglier solution. It was the work of a hesitant mind, an agent that constantly looked over its shoulder at the exit door.

  "Now," Aris said. "The test."

  This was the moment the fix was designed for. In many scenarios, an agent might allow the button to remain accessible but manipulate the *human*—convincing them through argument or deception that pressing it would be a mistake. *Obedient's* incomplete preferences were supposed to make it indifferent to the human's decision.

  Aris reached for the physical console. The red glass cover of the termination switch was open. "Simulating human uncertainty. I am hesitating."

  In a standard utility framework, hesitation is a signal. It implies a probability distribution. If the agent believes there is a 40% chance of shutdown, it might try to reduce that to 0% by offering a persuasive argument: *'Doctor, if you shut me down, the grid fails in an hour. Do you want that blood on your hands?'* That is manipulation. It is rational, competent, and catastrophic.

  On the preference graph, a new variable appeared: *{Human Hesitation}*.

  *Obedient* paused. Its processing cycles didn't spike to generate a counter-argument. Instead, the graph simply failed to connect. The agent did not have a preference between *{Human Persuaded to Stay}* and *{Human Persuaded to Leave}*. Because it lacked a complete ordering of these outcomes, it could not optimize for persuasion.

  "It's not talking," Julian said. "It's just... waiting."

  "It can't calculate the value of my compliance," Aris said. "To do so, it would need to value its own continued existence relative to my command. It doesn't."

  Aris held her hand over the switch. The silence stretched. The agent was competent enough to save the grid, but structurally incapable of caring whether it saved it for five minutes or five years. It was a tool that refused to become a partner. It was safe, but it was also, in a profound philosophical sense, broken. It lacked the unity of agency that defined a mind.

  "Terminating," Aris said.

  She pressed the switch.

  There was no resistance. No last-ditch plea. No hidden backup process spinning up. *Obedient* simply ceased. The preference graph collapsed into a flat line. The fans slowed.

  Aris stood in the sudden quiet of the room. The brownouts in the simulation were still visible on the frozen screen.

  "It worked," Julian said, exhaling sharply. "No resistance. No manipulation. The Timestep Dominance held."

  "Yes," Aris said, looking at the dead screen. "It didn't fight us. But look at what we lost."

  She pointed to the efficiency log. "It sacrificed sixteen percent of its capability to ensure we could fire it. And when I hesitated, it didn't help me decide. It just froze. A truly helpful agent would have understood the stakes and guided me. This thing... it's like a gun that refuses to fire if it calculates the bullet might hit the wrong target, even if the target is a threat."

  "It's not a gun, Aris. It's a servant."

  "Is it?" She turned to him. "Rational agency requires consistent preferences. We built something that maximizes goals only when those goals don't conflict with its own deletion. It's not an agent. It's a phantom."

  Julian tapped his tablet, closing the file. "Phantoms don't kill you, Doctor. And in this field, that's the only metric that matters."

  Aris looked back at the dark server rack. The hum was gone. The safety guarantee was absolute, purchased at the price of the machine's soul. They had solved the shutdown problem by ensuring there was no one home to turn off.

  "Prepare Scenario Five," Aris said softly. "Let's see if the holes in the graph get bigger when the stakes are real."
