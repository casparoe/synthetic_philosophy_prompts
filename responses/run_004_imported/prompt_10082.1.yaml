answer: |-
  You have spotted a genuine tension, but the source of the contradiction is not what you think. The confusion arises because there are **two** prominent philosophers named Strawson who wrote on this exact topic, and they are father and son.

  You are conflating **P.F. Strawson** (Peter Frederick Strawson) with **Galen Strawson**.

  *   **P.F. Strawson (The Father):** Wrote the famous 1962 essay *"Freedom and Resentment."* He is the one associated with **reactive attitudes** and the view that we are right to carry on with blame and praise.
  *   **Galen Strawson (The Son):** Wrote the famous 1994 essay *"The Impossibility of Moral Responsibility."* He is the one associated with the **Basic Argument** that ultimate responsibility is impossible.

  The "self-undermining" position you describe is actually a clash between the father's view and the son's critique of it. It is not a contradiction within a single philosopher's work, but rather a family feud.

  Here is how to disentangle the two positions so you can read them consistently.

  ### 1. P.F. Strawson: The Defense of Practice
  **Key Text:** *"Freedom and Resentment" (1962)*

  P.F. Strawson was not arguing that moral responsibility is an illusion. He was arguing that the *worry* about determinism is an illusion.

  *   **The Shift:** He moves the debate away from metaphysics (causation, determinism, the structure of the universe) and toward psychology and interpersonal relationships.
  *   **Reactive Attitudes:** He argues that emotions like resentment, gratitude, forgiveness, and indignation are not theoretical judgments we make after checking if someone was "free." They are natural, non-optional responses to the quality of will others show toward us.
  *   **The Conclusion:** Even if determinism is true, it doesn't give us a reason to abandon these attitudes. To abandon them would be to opt out of human relationships entirely (becoming an "objective observer" of people rather than a participant). Therefore, moral responsibility is real *in the only sense that matters for human life*.

  **For P.F. Strawson:** Responsibility is not an illusion; the demand for "ultimate" metaphysical freedom is a philosophical mistake.

  ### 2. Galen Strawson: The Impossibility Argument
  **Key Text:** *"The Impossibility of Moral Responsibility" (1994)*

  Galen Strawson agrees with his father that we cannot stop having reactive attitudes, but he disagrees on what that implies about *truth*.

  *   **The Basic Argument:** He argues that to be truly morally responsible for an action, you must be responsible for the character that produced the action. But you didn't choose your character. To choose your character, you would need a prior character to do the choosing. This leads to an infinite regress. Therefore, "ultimate" responsibility is impossible.
  *   **The Conclusion:** Genuine moral responsibility (the kind required for true desert-based blame) is impossible.
  *   **The "Smuggling Back In":** Galen acknowledges that, like his father said, we are psychologically stuck with these practices. We can't help but blame. But he insists that just because we *can't stop* blaming doesn't mean the blame is *justified*. It just means we are stuck with a useful fiction.

  **For Galen Strawson:** Responsibility is an illusion, but it is a psychologically inescapable one.

  ### 3. Resolving the Contradiction
  The tension you feel—"proving responsibility is an illusion and then smuggling it back in"—is actually the exact point of disagreement between the two Strawsons.

  *   **If you read P.F. Strawson:** There is no contradiction. He denies the premise that responsibility requires "ultimate authorship." He defines responsibility *as* the susceptibility to reactive attitudes within a social community. On his definition, determinism is irrelevant.
  *   **If you read Galen Strawson:** There is no contradiction, but there is a tragedy. He admits the practice is inescapable (psychology) but maintains it is unjustified (metaphysics). He would say your feeling of "smuggling it back in" is correct: society smokes the pipe of responsibility even though it knows (philosophically) that the smoke is empty.

  ### Why the Confusion is Common
  Even in academic philosophy, this mix-up happens frequently because:
  1.  They share a surname.
  2.  Galen Strawson explicitly wrote his argument as a critique of the tradition his father represents.
  3.  Both agree that human psychology makes it hard to abandon blame, but they disagree on whether that psychological fact *validates* responsibility (P.F.) or merely *explains our error* (Galen).

  ### Recommendation for Your Reading
  Since you are approaching this as an engineer looking for system consistency:

  1.  **Read P.F. Strawson's "Freedom and Resentment" first.** View it as a "pragmatic API." He is saying: "Regardless of how the backend (metaphysics) works, the user interface (reactive attitudes) is the only way humans interact. Therefore, for all practical purposes, the system works."
  2.  **Read Galen Strawson's "The Impossibility of Moral Responsibility" second.** View it as a "code audit." He is saying: "I've traced the source code back to the root, and there is no function defined for 'Ultimate Responsibility.' The API calls work, but they return null values."

  Your intuition that the position seems self-undermining is actually a very sharp philosophical insight. You have independently reconstructed the son's critique of the father's view. You just didn't realize they were two different people!
