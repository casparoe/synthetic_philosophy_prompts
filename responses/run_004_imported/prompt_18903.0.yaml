      *   *Correction/Clarification:* If it's a *shared* portfolio, a private swap between members is essentially one member overriding the group decision without a vote. This creates agency issues, not just information asymmetry.
      *   *Implication:* Allowing private swaps undermines the collaborative learning process and introduces the exact asymmetric information problem the theorem highlights. If the swap goes bad, who is blamed? If it goes well, did they have an edge or just luck?
