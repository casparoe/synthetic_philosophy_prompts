      *   *Core Logic:* If markets are efficient and agents are rational expected-utility maximizers with common priors, trade cannot occur solely due to differences in private information. If I want to sell to you, you should wonder *why* I want to sell. If I know something bad, you shouldn't buy. Since we both know we both know this, no trade happens.
      *   *Why does trade happen in reality?* Liquidity needs, hedging, differences in priors (betting), noise traders, behavioral biases, agency problems.

