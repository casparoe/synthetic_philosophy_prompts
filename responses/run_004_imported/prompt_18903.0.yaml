      *   *Resolution 1: Liquidity/Hedging.* People trade to buy houses, retire, or hedge risk, not just to speculate on alpha.
      *   *Resolution 2: Noise Traders/Behavioral.* People aren't perfectly rational. They trade on hunches, emotions, or mistakes.
      *   *Resolution 3: Differences of Opinion (Priors).* The theorem assumes common priors. In reality, people start with different models of the world.
      *   *Resolution 4: Information Aggregation.* Prices *do* reveal information, but it takes many trades to clear the market.
      *   *Takeaway:* Just because someone wants to trade with you doesn't mean they know something you don't. They might just need cash. Conversely, heavy volume might mean disagreement, not necessarily new information.

