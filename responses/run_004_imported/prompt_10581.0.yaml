  It's like walking up to the counter and saying, 'I'd like to return this Repugnant Conclusion, please. It violates my intuitions about mere addition.'
  And the clerk says, 'No problem. We can exchange it for the Sadistic Conclusion.'
  And you say, 'Wait, the one where adding tortured people is better than adding happy people?'
  And the clerk says, 'Look, buddy, Arrhenius proved we're out of stock on "Morally Intuitive." You take the Sadistic, or you leave with nothing. And in this store, leaving with nothing violates the Existence Condition.'"

  **Option 2: The Dating Profile**
  (This one is shorter and highlights the impossibility of satisfying all adequacy conditions.)

