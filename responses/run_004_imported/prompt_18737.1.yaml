answer: |-
  The clinic smelled of lavender and rubbing alcohol, a scent Elias had associated with relief for fifteen years. It was 4:15 PM on a Tuesday. The light coming through the blinds was that specific dusty gold of late autumn.

  Sarah was on the table. She was thirty-two, a graphic designer with chronic tension headaches. She was a regular. Elias knew the map of her trapezius muscles better than he knew the back of his own hand. He had screened her. He always screened her. *Any dizziness? Any history of clots? Any recent trauma?* No, no, no. Her vitals were normal. Her range of motion was normal. She was a healthy candidate for a C-spine manipulation. It was a routine procedure. Thousands of them performed every day without incident.

  "Ready?" Elias asked. His voice was low, the calibrated calm of his profession.

  "Ready," Sarah said. Her face was turned to the side, cheek resting on the paper roll. She was looking at a poster of the skeletal system. She trusted him. That was the job. To earn the trust required to put a human vertebrae out of alignment so you could put it back in.

  Elias placed his left hand on her occiput, his right on the axis. He took up the slack. He wasn't forcing anything; he was waiting for the tissue to yield. He felt the subtle shift, the breath exhaled, the moment of relaxation. He applied the thrust. Quick, low-amplitude, specific.

  There was a sound.

  It wasn't the usual cavitation pop, the release of nitrogen gas that sounded like a knuckle cracking. This was duller. Thinner. Like a dry twig snapping underwater.

  Sarah didn't scream. She went rigid.

  Elias released her immediately. He stepped back, hands hovering. "Sarah?"

  She turned her head toward him. The movement was sluggish, as if the air had turned to syrup. Her left eyelid drooped. When she tried to speak, the words slurred into a wet mumble. *"E… li…"*

  The room didn't spin. Elias didn't feel panic in the cinematic sense. He felt a sudden, absolute drop in temperature, as if the HVAC had kicked on full blast. He saw the pupil asymmetry. He knew the anatomy. He knew the statistics. One in a hundred thousand. One in a million. A vertebral artery dissection. Spontaneous. Unpredictable. Unpreventable.

  He called 911. He gave the address. He gave the nature of the emergency. He did not say *I broke her.* He said *Patient is experiencing stroke-like symptoms.*

  While they waited, he didn't pace. He stood by the table. He wanted to hold her hand, but he looked at his own palms and kept them at his sides. They were tingling. They felt heavy, as if made of lead. He had touched her. He had applied the force. The force had traveled through his thumbs, through the thenar eminence, into her neck. The chain of causation was unbroken. It started in his brain, went down his arms, and ended in her artery.

  The paramedics arrived. They were efficient. They loaded her. One of them, a woman with a ponytail, asked Elias, "You the provider?"

  "Yes."

  "Did you feel a pop? Different than usual?"

  "Yes."

  "Okay. We'll take good care of her. You can follow if you want, but family usually…"

  "I'm not family," Elias said.

  "Right. Well. Lock up."

  He watched the ambulance pull away. The siren didn't wail immediately; it was just the lights, cutting through the gold afternoon dust.

  Elias went back inside. He had to lock up. It was procedure. He turned off the lavender diffuser. He straightened the paper roll on the treatment table, tearing off the crumpled sheet where Sarah's head had been. He put it in the biohazard bin. He washed his hands.

  He used the antibacterial soap. He scrubbed the palms, the backs, between the fingers, under the nails. He scrubbed until the skin was red and raw. He rinsed. He looked at his hands in the stainless steel mirror above the sink.

  They were just hands. Veins, tendons, skin. They were the same hands that had signed her consent form three years ago. The same hands that had adjusted her mother's lower back last month. The same hands that had tied his shoes that morning.

  But they felt contaminated. Not with dirt. Dirt washes off. This was a stain of agency.

  He drove to the hospital. He sat in the waiting room. It was plastic chairs and muted television news. A woman across from him was knitting. The needles clicked. *Click, click, click.*

  Elias sat with his hands clasped between his knees. He pressed his thumbs together hard, trying to feel the pressure, trying to verify that they were still attached to him.

  A doctor came out an hour later. He looked tired. He asked for the family. Elias stood up, then sat down. He wasn't family. He was the mechanism.

  "Is she… did she make it?" Elias asked. His voice sounded like it belonged to someone else.

  The doctor looked at him. He saw the badge around Elias's neck, the clinic logo on his scrubs. He understood. "She's in surgery. The dissection caused a significant clot. We're working on it."

  "Is there…" Elias stopped. He wanted to ask *Did I do it wrong?* But he knew the answer. He had done it right. He had followed the protocol. He had used the correct vector. The artery had been fragile in a way no scan could have detected. It was a flaw in the material of the world, not the material of his skill.

  "Is there anything else?" the doctor asked.

  "No," Elias said.

  The doctor went back through the double doors.

  Elias sat back down. The knitting woman clicked her needles.

  He thought about the lorry driver Williams wrote about, though he didn't know the name. The driver who hits the child who runs into the road. The driver wasn't negligent. The driver was driving the speed limit. The child was unpredictable. But the driver was the one who was driving. The driver was the one who had to live with the fact that *his* vehicle, *his* momentum, *his* presence was the instrument of the end.

  Elias looked at his hands again. He spread his fingers. They were steady. That was the worst part. They weren't shaking. They were capable. They were ready to work. They could go back to the clinic tomorrow and adjust another neck. They could heal someone else.

  That capacity was the burden. If his hands were broken, he could blame the injury. If he had been negligent, he could blame his error. But his hands were fine. He was fine. The world had simply turned on a hidden pivot, and he had been the lever.

  He stood up. He walked to the vending machine. He bought a coffee. He held the Styrofoam cup. The heat seeped into his palms. It felt good. It felt normal.

  He sat back down. He would wait until the husband arrived. He would give the husband the chart. He would answer the questions. He would say the words *statistically rare* and *unforeseeable risk*. He would say them clearly.

  But later, when he went home, when he stood in his own shower and let the water run over him, he knew he wouldn't be able to scrub off the memory of the thrust. Not because it was wrong. But because it was his. It was the one thing in the universe that he had caused, completely and totally, that he wished he could un-cause, and yet he would do exactly the same way again if the clock reset.

  He finished the coffee. He crushed the cup. He watched the steam rise from his hands, disappearing into the sterile air of the waiting room, leaving no mark, leaving no trace, leaving him exactly as he was: the one who touched her, the one who broke her, the one who had to walk out the door when it was over.
