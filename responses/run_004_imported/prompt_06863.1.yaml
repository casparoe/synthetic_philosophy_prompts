answer: |-
  The cursor blinked on Dr. Aris's screen, a steady rhythmic pulse next to the dropdown menu. *Diagnostic Code 89.4: Sequential Displacement.*

  "It's not déjà vu," Leo said, twisting the hem of his sweater. He was twenty-four, bright-eyed, but vibrating with a specific kind of exhaustion. "Déjà vu is feeling like you've lived this before. This is… feeling like I'm living it slightly after everyone else. Like the audio track is out of sync with the video."

  Aris typed *Audio-Visual Desync* into the notes. It was a new category, barely six months old. Before that, these patients would have been generalized anxiety or depersonalization. But the research group in Zurich had published the paper, the name had stuck, and now the insurance codes existed.

  "Sequential Displacement," Aris said, turning the screen slightly so Leo could see. "We can work with this. It gives us a framework."

  Leo's shoulders dropped an inch. The tension didn't vanish, but it structured itself. He had a container for the noise. "Okay. Okay, SD. So it's real."

  "It's recognized," Aris corrected gently. "Start tracking the latency. Note when the lag spikes."

  ***

  Six months later, the waiting room was fuller. Aris noticed it first in the way they sat. They didn't fidget randomly. They tapped their thumbs against their knees in a specific, synchronized triplet rhythm. *Tap-tap-tap. Pause. Tap-tap-tap.*

  Leo was in Group B now. He wasn't just a patient; he was a veteran. When a新人 (newcomer)—a girl with dark circles and a trembling hand—sat down next to him, Leo leaned over.

  "Check the lighting," Leo whispered, not looking at her. "Fluorescents make the lag worse. It's the refresh rate."

  "I… I thought it was just me," the girl said.

  "Code 89.4," Leo said. "Once you have the code, you can measure it. Are you seeing the grey fade?"

  The girl blinked. "The what?"

  Leo frowned, a flicker of uncertainty crossing his face before solidifying into instruction. "When the lag hits hard. The edges of your vision lose saturation. Turns grey. Like a video buffering. You haven't noticed the grey?"

  "No. I just feel sick."

  "You need to look for the grey," Leo said, confident now. "If you don't track the grey, the doctors won't know the severity. They need the data."

  Aris watched them through the glass pane of the office. He opened the electronic health record for Leo. The notes from the last session were different. Leo wasn't reporting general disorientation anymore. He was reporting latency in milliseconds. He was reporting saturation loss.

  Aris hadn't taught him about saturation loss.

  ***

  The revision meeting was via conference call. Aris shared his screen, displaying the draft for *Diagnostic Criteria v1.2*.

  "The Zurich team is asking for more granularity on the somatic markers," the voice on the speakerphone said. "We're getting reports of visual desaturation. Is that visible in your clinic?"

  "It is now," Aris said. He looked at the stack of printed intake forms on his desk. Every patient diagnosed with Sequential Displacement in the last three months had checked the box for *Visual Grey-Out* under 'Associated Symptoms'. Six months ago, that box hadn't existed. Neither had the box for *Rhythmic Motor Compensation*.

  "It feels… emergent," Aris said.

  "It's consistency," the voice replied. "Patients are communicating. Forums, support groups. They're standardizing the presentation. If we don't update the criteria, we lose validity. Add the grey fade. Add the motor rhythms."

  Aris clicked the mouse. *Visual Desaturation* moved from 'Observational Note' to 'Primary Criterion B'.

  "If we add it," Aris said, "we're cementing it."

  "We're describing reality, David. That's the job."

  Aris ended the call. He looked at the updated checklist. It was cleaner now. More specific. It promised a clearer path to treatment.

  ***

  Two weeks later, a new intake. A young man named Sam. He sat exactly like Leo had, hands clasped, thumbs resting.

  "Tell me what brings you in," Aris said.

  Sam took a breath. "I think I have Sequential Displacement. The lag is getting bad."

  "Okay. Can you describe the sensation?"

  "It's like I'm watching myself from a delay," Sam said. He recited it smoothly, like he'd practiced the phrasing. "And the lighting… especially under fluorescents… I get the grey fade. The saturation drops."

  Aris stopped typing. He looked up. "The grey fade."

  "Yeah. It usually happens before the motor ticks start. My hands want to tap to sync me up." Sam held out his hands. They were still. "I'm trying to suppress the tapping. Is that bad?"

  Aris looked at the checklist on his screen. *Criterion B: Visual Desaturation.* *Criterion C: Rhythmic Motor Compensation.*

  "When did you notice the grey fade?" Aris asked.

  "Online," Sam said. "There's a subreddit. People were posting about it. I realized I'd been ignoring it. Once I knew to look for it, it was everywhere."

  Aris felt a cold weight in his stomach, familiar and heavy. He looked at Sam, who was waiting for validation, waiting for the doctor to confirm that the map he'd been given actually matched the territory.

  But the territory had changed to match the map.

  "It's a common symptom," Aris said. His finger hovered over the keyboard. He could check the box. It fit perfectly. It was the correct diagnosis. The loop was closed, tight and seamless.

  Sam exhaled, relieved. "Okay. Good. So I'm not imagining the grey."

  "No," Aris said. He checked the box. The cursor blinked, steady and rhythmic. "You're not imagining it."

  Aris saved the file. The version number in the corner of the screen ticked over. *v1.2.* He wondered, briefly, what v1.3 would look like, and who would be writing it.
