  First off, solidarity. Grading formal epistemology while simultaneously drowning in Lewis/Stalnaker imaging in your own grad seminar is a specific kind of torture. It is completely normal to feel like you've lost your grip on the material when you're oscillating between "teaching the basics" and "learning the baroque extensions." Your gut is probably fine, but since you asked for rigor, I'm going to treat this like I'm grading *you* in Alvarez's seminar.

