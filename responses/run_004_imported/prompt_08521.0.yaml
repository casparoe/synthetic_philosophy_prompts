      *   **Goal:** Reconstruct the argument properly, sharpen the disagreement, good faith, full strength, answer the awkward questions directly.
      *   **Tone:** Academic but passionate, precise, slightly weary but energized by the friction.

  2.  **Character Conception:**
      *   **Elena (Bohmian):** Pragmatic about ontology. Particles are real. Trajectories are real. Nonlocality is a feature, not a bug. Willing to sacrifice manifest Lorentz invariance at the fundamental level to save determinism and single outcomes.
      *   **Marcus (Everettian):** Formalist about unitarity. Wavefunction is real. Branching is structural. Locality is paramount. Willing to sacrifice single outcomes to save relativistic causality.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The seminar just ended. The whiteboard is still full of inequalities. Immediate engagement.
      *   **Round 1: The Core Claim.**
          *   Elena: Bell proves nonlocality. Period.
          *   Marcus: Bell proves you can't have single outcomes *and* locality. I drop single outcomes.
          *   *Technical:* Mention Bell's assumptions (Realism + Locality).
      *   **Round 2: Jarrett's Decomposition.**
          *   Need to bring in Parameter Independence (PI) and Outcome Independence (OI).
          *   Standard QM violates OI.
          *   Bohm: Violates PI (explicitly nonlocal).
          *   Everett: Claims to satisfy both *relative to a branch* or argues the distinction dissolves. Actually, the Deutsch-Hayden argument is about information flow. Let's refine: Everettians argue the *dynamics* are local (Schrödinger equation is local in configuration space? No, that's tricky. The Hamiltonian is a sum of local terms).
          *   *Correction:* The Hamiltonian involves local interactions. The wavefunction lives on config space, but the *evolution* doesn't require superluminal signaling.
      *   **Round 3: The Awkward Question for Elena (Foliation/Relativity).**
          *   Marcus presses: Your guiding equation needs a "now." It picks a frame. That's a huge cost.
          *   Elena's defense: Empirical equivalence. We can't detect the frame. It's a "conspiracy" of nature, but particles exist. Better to have a clear ontology than a fuzzy one.
      *   **Round 4: The Awkward Question for Marcus (Holism/Config Space).**
          *   Elena presses: Your wavefunction is on $3N$-dimensional space. That's not local in 3D space. It's holistic.
          *   Marcus's defense: Separability of the Hamiltonian. Operations here affect the local state here. The "global" nature is about correlations, not causal influence.
      *   **Round 5: The 2015 Experiments.**
          *   Loophole-free.
          *   Elena: Closes the door on local hidden variables. Confirms nonlocality.
          *   Marcus: Closes the door on local *single-world* hidden variables. Confirms unitarity.
      *   **Closing:** No resolution. The fundamental divide is metaphysical (Single World vs. Many Worlds), not just physical. Acknowledge the stalemate but appreciate the clarity.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure Marcus doesn't just say "magic." He needs to invoke the Deutsch-Hayden argument about information. The claim is that the *Heisenberg picture* descriptors remain local.
      *   *Critique:* Make sure Elena doesn't just say "particles." She needs to emphasize *causal explanation*. Bohm gives a causal story; Everett gives a structural story.
      *   *Jarrett:* Standard QM violates Outcome Independence (OI) but respects Parameter Independence (PI). Bohm violates PI (depending on the formulation/gauge) or rather, the *hidden variables* violate PI. Wait, Bohmian mechanics violates Parameter Independence at the level of the hidden variables (particle positions), which is why it's nonlocal. Standard QM violates OI but respects PI (no signaling). Everettians argue that once you account for branching, the *appearance* of OI violation is just correlation, not causation.
      *   *Refinement on Locality:* For Everettians, "locality" means the Hamiltonian density commutes at spacelike separation. For Bohmians, "locality" means the velocity of particle A does not depend on position of particle B. Bohm fails this.
      *   *The "Holism" objection:* If the wavefunction is on configuration space, is it local? Everettians argue physical space emerges or that the field is on config space. This is a weak point for Everett. Elena should hammer this.
      *   *The "Foliation" objection:* Bohm needs a preferred frame to define the instantaneous guidance. This clashes with SR spirit. Marcus should hammer this.

  5.  **Writing the Dialogue (incorporating the above):**
