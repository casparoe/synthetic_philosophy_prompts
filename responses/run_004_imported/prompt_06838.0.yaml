      *   The aftermath: The narrator writes a report. The report says "Necessary." The heart says "Murder."
      *   Let's focus on the concept of the "Uncanceled Debt."

  8.  **Developing the Narrative Voice:**
      *   First-person. Reflective. Quiet.
