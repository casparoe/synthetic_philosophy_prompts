  9.  **Drafting the Story (incorporating the philosophical tension):**
      *   *Setting:* High-altitude observatory. Andes or Himalayas. "The Spire."
      *   *Crisis:* Avalanche blocks the lower lift. Oxygen scrubber failing. One emergency O2 tank for the descent.
      *   *Characters:* Narrator (Joren), Sian, Vark.
      *   *The Moment:* They draw straws? No, that externalizes the choice. The narrator has to *choose*. That's where the moral weight lies. The narrator holds the key.
      *   *The Decision:* Vark says "Take Sian." Sian says "Take Vark." They deadlock. Joren has to break it. He picks Sian. Why? No reason. Just a twitch.
      *   *The Aftermath:* Sian lives. Vark dies.
