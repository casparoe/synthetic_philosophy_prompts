      *   The ending needs to linger on the "residue."

      *(Self-Correction during drafting)*: I need to be careful not to make the narrator seem negligent. The situation must be truly impossible. The "logic" side needs to be strong enough that a reader *could* say "You did nothing wrong." The "residue" side needs to be strong enough that a reader *could* say "You carry a sin."

      *Let's focus on the concept of a "remainder."* Like a mathematical equation that doesn't quite balance.

      *Setting:* Deep sea research? No, avalanche/storm was suggested. Let's stick to the avalanche/isolated outpost. It's classic isolation.

      *Title Idea:* The Remainder. The Uncanceled Debt. The Third Man. Let's go with *The Remainder*.

      *Key passage:* The moment of choice. It shouldn't be agonizing for hours. It should be sudden. And the aftermath should be the long tail.

      *Philosophical nuance:* The Kantian view says if I can't do X, I'm not obligated to do X. So if I can't save both, I'm not obligated to save the one who dies. The story needs to show the narrator *feeling* the obligation despite the impossibility.

