      *   *Partially Ordered Set (Poset):* A collection of items where some can be compared (one is "greater" than another), but not all. Let's call this a hierarchy of tasks, artifacts, or states of being. Let's go with a library or archive of "versions" of something. Or perhaps a tower of rooms. Let's try a garden of sculptures? No, let's try a labyrinthine archive of "perfected drafts."
      *   *Chain:* A sequence where every item is comparable (A < B < C...).
      *   *Upper Bound:* For any such sequence, there exists something "above" or "after" all of them in the set.
      *   *Maximal Element:* An element where nothing is "greater" than it. Note: Not necessarily a *maximum* (greater than everything), just nothing exceeds it.
      *   *Non-constructive:* We know it's there because of the logic of the structure, but we can't climb the ladder to find it because the ladder might be infinitely long or branching in uncountable ways.
      *   *Axiom of Choice/Banach-Tarski vibe:* The unsettling feeling that something exists without a path to it.

  3.  **Drafting - Scene Setting:**
