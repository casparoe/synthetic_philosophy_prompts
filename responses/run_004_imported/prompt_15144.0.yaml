      *Refining the Ending:* It needs to resonate with the "Banach-Tarski" unsettlement mentioned in the prompt. The existence is certain, but the location is unknowable. The ending should feel slightly uncanny but resolved.

  7.  **Drafting - Step-by-Step (Mental or Scratchpad):**
