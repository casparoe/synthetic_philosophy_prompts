answer: |-
  The Hall of Versions smelled of dry ink and suspended time. Elian stood at the entrance of Aisle Null, his lantern casting long shadows against shelves that stretched upward into a darkness too thick for light to penetrate. He was not the first seeker to enter the Repository, but he was the first to memorize the Charter fully.

  The Charter was simple, etched into the stone lintel above the door. It stated two things. First, that for any line of manuscripts arranged in strict order of refinement—where each subsequent text corrected and encompassed the one before it—there existed within the Hall a binding volume that superseded them all. Second, that the Hall contained at least one Final Draft, a text so perfect that no further corrections could be made, no words added, no clarity improved.

  Elian's task was to bring a Final Draft to the light.

  He began where all seekers began: with a chain. He pulled a slender pamphlet from the bottom shelf. It was rough, full of holes in logic and clumsy phrasing. He searched the shelf above it and found its successor, a thicker volume that retained the original's truth but smoothed its edges. He climbed the ladder, rung by rung. Pamphlet became booklet, booklet became tome. The air grew colder as he ascended. For every sequence he traced, the Charter held true. Whenever he laid out a linear history of improvement, he could always find a volume that sat above the highest one he held, a capstone that unified the progress.

  But the Hall was not a single tower. It was a forest of them.

  At the level of the great folios, Elian encountered the divergence. He held a volume on ethics in his left hand and a volume on metaphysics in his right. Both were refined, both were heavy with truth, but neither contained the other. They were incomparable. To move higher, he needed a volume that superseded both, a unification. The Charter promised such a volume existed somewhere in the stacks, but it did not say where.

  He spent weeks walking the aisles. He found chains that stretched into the invisible ceiling. He found upper bounds for those chains. But every time he reached a bound, he found himself standing at a junction where the path branched again. To choose one branch over another required a decision without a rule. There was no metric to tell him which lineage led to the Final Draft. He could not construct a path to the peak because the path required infinite choices, and he possessed only a finite life.

  The frustration was a physical weight. He knew, with the certainty of gravity, that the Final Draft existed. The logic of the Hall demanded it. If every chain had a bound, the structure could not simply fade into nothingness; it had to terminate in a maximal height. But knowing the mountain exists is not the same as standing on the summit.

  He met an older seeker once, deep in the stacks of Section Omega. The man was surrounded by piles of rejected manuscripts, each perfect in its own domain but none perfect in all.

  "It's here," the old man whispered, tapping his chest. "I know it's here. The Charter says so. But I cannot point to it. If I pick a shelf, I am guessing. If I guess, I am not following the order. I am imposing my own will on the structure."

  "Then the Charter is a lie," Elian had said, his voice echoing too loudly.

  "No," the old man replied, his eyes hollow. "The Charter is true. That is the terror of it. The peak is real, but the climb is impossible. We are guaranteed the treasure, but denied the map."

  Elian returned to Aisle Null. He looked up at the darkness above. He understood now why the Charter did not provide coordinates. To locate the Final Draft constructively, he would need to survey every possible chain of improvement simultaneously. He would need to be everywhere at once, to make every arbitrary choice of path without reason, to hold the entirety of the Hall in his mind as a single object. He was a creature of sequence, of step-by-step progress. The Hall was a creature of completed infinities.

  He sat on the cold floor, his lantern dimming. He thought of the Final Draft sitting on a shelf somewhere above him. It was not moving. It was not hiding. It simply was. Its existence did not depend on his ability to climb. The truth of the summit did not require the climber.

  For months, Elian had tried to bridge the gap between *knowing* and *having*. He had treated the existence proof as a promise of access. Now, in the quiet dark, he realized the distinction was the lesson. The Hall was not built to be conquered; it was built to be understood.

  He extinguished the lantern. The darkness was absolute, yet he felt no fear. He knew the light was there, somewhere in the stacks, even if he could not hold the lamp to it. He leaned back against the shelves, feeling the vibration of the structure around him, solid and immense. He would not find the Final Draft. He would never hold the maximal element in his hands. But he could rest in the certainty of its presence.

  Elian closed his eyes and listened to the silence of the Hall. It was not the silence of emptiness. It was the silence of a thing completed, waiting patiently for a hand that would never arrive. He smiled, a small, sharp expression in the dark. The guarantee was enough. The existence was the truth. The access was merely a desire he no longer needed to fulfill. He sat still, anchored by the weight of the unseen peak, finally content to dwell in the shadow of a truth he could prove but never touch.
