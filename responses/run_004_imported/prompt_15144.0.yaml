      *   *Climax:* He encounters the paradox. He knows a peak exists. He stands before a wall of shelves. He knows one book is the "last" one in its lineage, but he cannot identify it without reading every possible lineage, which is impossible.
      *   *Ending:* Acceptance. He stops searching for the specific book and trusts the structure. Or he realizes the existence is the only truth he gets. Let's go with trusting the structure despite the inability to point.

  5.  **Refining the Metaphor (Checking against constraints):**
      *   *Partial Order:* Drafts where A refines B. But some drafts refine different aspects, so they aren't comparable.
      *   *Chain:* A sequence of refinements.
      *   *Upper Bound:* A master draft that incorporates the chain.
      *   *Maximal:* A draft that cannot be refined further.
