answer: |-
  The tether hummed. It was a low, cello-deep vibration that traveled up through the floor plating and settled in the marrow of Venn's shins. Outside the thick quartz of the viewport, there was nothing. No stars, no background radiation glow, no distant galaxies. Just a uniform, suffocating black that pressed against the glass harder than the vacuum should have been able to.

  Inside Pod A, the artificial gravity was heavy. Venn's coffee sat curved in its mug, the surface concave, climbing the ceramic walls. When he dropped a wrench, it didn't fall straight; it arced slightly, Coriolis bending its path toward the rotating floor.

  "It's reading four thousand newtons," Venn said. He tapped the tension gauge mounted on the bulkhead. The needle trembled in the red. "The cable is going to snap."

  Silas floated near the ceiling—or what would be the ceiling if the spin stopped. He was strapped into the maintenance harness, his eyes on the external sensors. "The cable isn't snapping. It's contracting. Thermal shrinkage. We're deep in the void, Venn. It's cold."

  "It's not shrinkage. We're spinning. I can feel it in my ears."

  "Feelings aren't data." Silas unclipped a tool from his belt. He didn't drop it. He held it, letting it hover in his hand. "Spin is relative. You need a reference frame. Look out the window. Tell me what we're spinning around."

  "Each other."

  "Exactly. We're orbiting a common center of gravity. But if there's nothing else in existence, 'orbiting' is just a word for 'staying the same distance apart while turning.' If there's no background mass, no fixed stars, there's no inertia. There shouldn't be any force." Silas tapped his own chest. "So why are your feet heavy?"

  "Because we're spinning."

  "Or because the cable is pulling us together and your brain interprets tension as weight." Silas drifted down, his boots magnetizing to the floor with a clang. "If I'm right, firing the retro-thrusters won't change the tension. It'll just waste fuel. If you're right, firing them stops the spin and saves the cable."

  Venn looked at the gauge. The needle twitched higher. Four thousand two hundred. "The stress limits are clear, Silas. If tension exceeds five thousand, the clamps fail. We drift apart. Life support splits. We die."

  "If you fire the thrusters based on a false premise, you induce shear stress. The clamps fail. We die." Silas walked to the console. His movement was heavy, laborious, as if the floor resisted him. "That resistance you feel? That's the trick. It's the cable fighting its own contraction. It feels like centrifugal force because your body expects gravity to come from a planet. Here, it comes from a wire. It's psychosomatic physics."

  "It's not psychosomatic. The coffee curves."

  "Liquids curve in containers under tension. It's surface tension, not gravity."

  Venn gripped the console. The hum of the tether was louder now, a rising whine that suggested the molecular lattice was stretching. "I'm initiating the burn."

  "Don't."

  "If I'm right, we live. If you're right, we waste fuel but the tension stays the same. We can ration."

  "If I'm right, and you fire, you're applying torque to a system that isn't rotating. You're twisting a static line. You'll snap it instantly." Silas moved to cut the power feed. "We wait. We let the cable equilibrate."

  "It's not equilibrating. It's tightening." Venn slapped the safety cover off the ignition key. "Newton knew this. You don't need stars to know you're spinning. You need a bucket of water. Look at the water, Silas." He pointed to the mug. The surface was a perfect parabola.

  "Newton was working in a universe full of matter," Silas said, his hand hovering over the cutoff switch. "He assumed the fixed stars were always there. He never had to deal with true emptiness. In a true void, space has no grip. You can't spin against nothing."

  "The cable knows."

  "The cable is metal. It doesn't know anything. It just reacts to stress."

  The hum spiked. A hairline fracture appeared on the bulkhead near the tether anchor point. A puff of white dust floated upward, defying the heavy pull, caught in a draft.

  "We're out of time," Venn said.

  "Then we cut the tether. We drift. Static tension vanishes."

  "And we lose gravity. The fluid separators stop working. The air scrubbers fail. We suffocate in six hours."

  "Better than decompression."

  Venn turned the key. The lock clicked. The system armed.

  "Venn, stop." Silas lunged, but the heavy gravity slowed him. He was too late.

  Venn pressed the sequence.

  The thrusters fired. A deep shudder racked the pod, violent and sudden. The floor jerked beneath them. For a moment, the weight vanished. Venn floated, his stomach lurching into his throat. The coffee spilled out of the mug, forming a floating sphere.

  Then, the weight returned. Harder than before.

  The hum changed pitch. It wasn't a whine anymore; it was a grind.

  "See?" Silas shouted over the noise. He was pinned to the floor again. "The tension didn't drop! It increased! I told you—it's static! You fought the cable's contraction and now it's fighting back!"

  Venn scrambled for the readings. The gauge was pegged. Four thousand eight hundred. Four thousand nine hundred. "The spin didn't stop. The thrusters fired opposite the rotation, but the rate didn't change."

  "Because there was no rotation to stop!" Silas yelled. "You burned fuel fighting a ghost!"

  "No." Venn stared at the coffee sphere. It was rotating. Slowly, visibly spinning in mid-air. "Look at the drop. It's spinning."

  "It's spinning because you spun it when you jerked the pod!"

  "It was spinning before!"

  The fracture on the bulkhead widened. A hiss of air joined the hum of the tether.

  "We have to cut it," Silas said, reaching for the emergency release lever. "If you can't stop the spin, the cable goes. We take our chances with the scrubbers."

  "If we cut it, we lose the anchor. We drift."

  "We drift alive."

  "If I'm right, and this is absolute rotation, cutting the tether leaves us both spinning individually. We still have gravity. We still have scrubbers."

  "If you're right, and space is absolute, then we are spinning relative to... what? The void? The void doesn't have edges. You can't spin relative to nothing." Silas's hand hovered over the release. "Mach was clear. No matter, no inertia. If we are truly alone, this force shouldn't exist. The fact that it does means our instruments are lying."

  "The force is breaking the wall, Silas. Instruments don't break walls. Forces do."

  "Then it's a force we can't fix with thrusters."

  "Or it's a force that proves we aren't alone."

  Silas froze. "What?"

  "If the tension is real, and the spin is real, and there are no stars... then space itself is holding us. Or there's something out there we can't see." Venn looked out the viewport. The blackness seemed to swirl, just at the edge of perception. Or maybe it was his eyes straining. "If we cut the tether, and the gravity stays, then Newton wins. Space is a thing. If the gravity goes, Mach wins. We were just stressed metal."

  "And if we stay connected?"

  "Then the cable snaps in thirty seconds."

  Silas looked at the gauge. Four thousand nine hundred and fifty. The grinding noise was deafening now, the sound of tungsten carbide screaming.

  "We don't know which it is," Silas said. "We never will."

  "We know if we breathe tomorrow."

  "We know if we breathe for six hours." Silas gripped the release lever. "If I cut this, and you're right, we keep our gravity. If I cut this, and I'm right, we float. Either way, the tension goes to zero. The cable stops pulling."

  "Do it."

  "If I'm right, and space is relational, cutting the link makes us two separate non-rotating points. There's no relation to maintain. The force vanishes."

  "Do it, Silas!"

  The wall cracked. A jet of air whistled out.

  Silas pulled the lever.

  The explosion bolts fired. The tether severed.

  The pod lurched. The grinding hum stopped instantly, replaced by the hiss of escaping air. Venn waited for the weight to vanish. He waited for his feet to lift from the floor.

  They didn't.

  He stood heavy. The coffee sphere still spun in the air, maintaining its shape. The pressure in his ears remained.

  Silas floated.

  Venn looked down. Silas was drifting near the ceiling, weightless. Venn was still pinned to the floor.

  "Why..." Silas whispered, kicking off the wall to drift closer. "Why are you still heavy?"

  Venn looked at his feet. He was standing on the floor of Pod A. Silas was floating in the center of the room.

  "I didn't cut my boots," Venn said quietly.

  Silas looked down. Venn's magnetic boots were still locked to the plating. But the gravity should have been gone. The tether was gone. The rotation should have dissipated into independent drift.

  Unless the pod itself was spinning.

  "But we cut the link," Silas said. "We're separate bodies now. If Mach is right, and there's no external matter, neither of us should feel force. We should both be floating."

  Venn looked out the viewport. The blackness outside seemed to be moving. Not stars—there were no stars—but the void itself seemed to have a grain, a texture that was sliding past the glass.

  "Or," Venn said, his voice trembling slightly, "one of us is spinning, and the other isn't. And the space knows the difference."

  Silas stared at him. "That's absolute space."

  "That's survival."

  The air hiss was getting louder. The pressure alarm began to wail. They had minutes before the scrubbers failed completely, regardless of gravity.

  Silas pushed off the wall, drifting toward the emergency seal. "It doesn't matter why. We need to patch the hull."

  Venn stayed where he was. He felt the floor beneath him, solid, undeniable. He felt the pull toward the outer rim. He looked at Silas, floating free in the center of the room, untethered from the spin.

  "Silas," Venn said.

  "What?"

  "Look at the coffee."

  Silas turned. The sphere of coffee was still rotating, holding its shape against the vacuum of the room, defying the lack of a container.

  "It shouldn't do that," Silas said.

  "No," Venn said. "It shouldn't."

  They looked at each other, then out at the void. The blackness offered no answer. The floor held Venn fast. The air rushed out into the nothing. The question hung between them, heavier than gravity, unresolved as the dark.

  Venn reached for the patch kit. He had to move against the pull. It was hard work. It felt real.

  "Hand me the sealant," Venn said.

  Silas pushed the kit toward him. It floated, slow and lazy, unaffected by the pull that pinned Venn down.

  "Catch," Silas said.

  Venn caught it. The weight of the canister was true. The spin was true. The void was silent. They worked, breathing hard, while the universe watched, or didn't, from the outside.
