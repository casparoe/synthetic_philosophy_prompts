prompt: |-
  What would L.A. Selby-Bigge's Hume have made of the discursive dilemma? Hume was preoccupied with how collections of individually rational judgments (about causes, about justice, whatever) could still add up to something incoherent when you scale from persons to institutions like parliaments or courts. Given his views on the "artificial" nature of collective rationality and his general skepticism about reason's authority over judgment, how do you think he'd have reacted to the modern judgment-aggregation literature (List, Pettit, etc.) showing that majority-voting on individual propositions can yield an inconsistent collective verdict even when every voter is perfectly consistent? Would he have seen this as vindicating his suspicion of "artifical" collective bodies, or would he have had some Humean trick for dissolving the paradox entirely? Give me your best reconstruction, typos and all, no need to be too polished here.
