answer: |-
  Okay, so thinking about the discursive dilemma (or doctrinal paradox) through the lens of the Selby-Bigge text—basically the standard *Treatise* and *Enquiries* setup—my first instinct is Hume wouldn't be shocked. Not even a little.

  If you look at Book 3 of the *Treatise*, the whole point about justice is that it's an *artificial* virtue. It's not natural. It's a work-around. We invent rules of property and governance because we have limited generosity and scarce resources. The system is a convention, a stabilizing mechanism, not a truth-machine. So when List and Pettit come along and say "hey, if you aggregate these consistent individual judgments via majority rule, you get collective nonsense," Hume's reaction is basically: *of course you do*. Why would you expect a collection of men in a parliament to function like a single rational mind?

  He'd probably see the DD as vindicating his suspicion about "artificial" collective bodies. For Hume, the "reason" of the state isn't some super-reason emerging from the sum of parts. It's just a negotiated settlement. The paradox arises because the modern literature (List, Pettit) assumes that collective rationality *ought* to mirror individual rationality—that consistency is a virtue we can scale up. Hume would say that's a category error. A parliament doesn't have a "mind" to be consistent. It has a procedure.

  Here's where the Humean trick comes in though. He might try to dissolve the paradox by attacking the premise that "consistency" is the ultimate goal of judgment aggregation. Remember, reason is the slave of the passions. The judgments being voted on aren't just logical propositions; they're tied to sentiments, interests, utility. If the majority voting on premises leads to a conclusion that feels unjust or useless (violates the sentiment of the group), the group won't accept it, logic be damned. They'll change the voting rule or ignore the precedent.

  In the *Enquiry Concerning the Principles of Morals*, he talks about how general rules are useful but often have exceptions that sentiment corrects. The discursive dilemma shows the breakdown of the general rule (majority voting) when it clashes with the desired outcome. Hume wouldn't try to fix the math. He'd say the "incoherence" is only a problem if you think institutions are designed by a rational architect rather than evolving through trial and error. The inconsistency *is* the friction that forces the convention to adapt.

  Also, Selby-Bigge's intro emphasizes Hume's skepticism about abstract reasoning detached from experience. The DD is a very abstract, logical problem. Hume would ask: does this actually happen in the House of Commons? Or is it a philosopher's puzzle? If it does happen, the "solution" isn't a new aggregation theorem, its political pressure. The "collective verdict" isn't a logical output, it's a power move.

  So, reconstruction:
  1. **Vindication:** Yes, it proves you can't derive social order from individual rationality alone. Need convention/sentiment.
  2. **Dissolution:** The paradox assumes collective bodies *should* be logically consistent agents. They aren't. They are artifacts of necessity.
  3. **The Trick:** Shift the ground from logic to utility. If the inconsistent verdict works (promotes public utility), its logically flawed status doesn't matter. If it doesn't work, the passion of the people will override the logical derivation anyway.

  He'd tell Pettit: stop trying to make the sovereign a rational agent. It's a monster made of men, not a mind. The inconsistency is a feature, not a bug, because it leaves room for sentiment to intervene when the rules get too rigid.

  (plus, teh whole debate assumes reason can govern judgment independently of custom, which Hume spent 300 pages denying. so the paradox is sort of illusory from the start.)
