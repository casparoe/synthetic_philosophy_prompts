answer: |-
  You are not misremembering the experiments, and you certainly aren't lagging behind the physics. What you are encountering is one of the most persistent simplifications in the pedagogy of quantum mechanics.

  The short answer is this: **Bell's Theorem did not rule out hidden variable theories. It ruled out *local* hidden variable theories.**

  De Broglie-Bohm (Bohmian) mechanics is explicitly, aggressively **non-local**. Therefore, it sails right through the loophole that Bell's Theorem left open. In fact, Bohmian mechanics predicts the exact same violation of Bell's inequalities that Aspect observed.

  Here is the detailed breakdown of why your colleague is right to keep Bohm on the table, why the standard textbook narrative often obscures this, and what the actual cost of adopting Bohmian mechanics is.

  ### 1. The Misconception: What Bell Actually Killed
  In undergraduate physics, the narrative arc is often presented as:
  1.  EPR (Einstein-Podolsky-Rosen) argue QM is incomplete and suggest hidden variables.
  2.  Bell derives an inequality that any local hidden variable theory must satisfy.
  3.  Aspect violates the inequality.
  4.  **Conclusion:** Hidden variables are impossible; Einstein was wrong.

  This is a useful shorthand, but it is technically imprecise. Bell's Theorem proves that no physical theory that is **both** *Local* **and** *Real* (in the sense of having definite properties prior to measurement) can reproduce all the predictions of quantum mechanics.

  When Aspect's experiments violated the inequality, nature told us that we cannot have both Locality and Realism. We had to give up at least one.
  *   **Copenhagen/Orthodox QM:** Gives up Realism (properties aren't definite until measured). Keeps Locality (mostly, though "collapse" is tricky).
  *   **Bohmian Mechanics:** Keeps Realism (particles always have definite positions). **Gives up Locality.**

  ### 2. How Bohmian Mechanics Survives
  In Bohmian mechanics, the universe consists of particles with definite trajectories and a "pilot wave" (the wavefunction) that guides them.

  The crucial feature is the **Quantum Potential**. In a multi-particle system, the pilot wave exists in a high-dimensional configuration space, not 3D space. If you entangle two particles and separate them by light-years, the pilot wave still connects them. If you measure particle A, the pilot wave updates *instantaneously* everywhere, altering the trajectory of particle B immediately.

  This is "spooky action at a distance" in its purest form. Einstein would have hated Bohmian mechanics just as much as standard QM because it violates the spirit of Special Relativity (specifically, Lorentz invariance). However, because it is non-local, it is perfectly compatible with Bell's Theorem and Aspect's results. The experiments confirm non-locality; Bohm simply admits it openly rather than hiding it behind "collapse."

  ### 3. Why Philosophers (and Some Physicists) Take It Seriously
  You mentioned reading Maudlin and Albert. These philosophers of physics champion Bohmian mechanics not because they think it's necessarily *true*, but because it solves the **Measurement Problem** in a way standard QM does not.

  *   **Definite Ontology:** In standard QM, it is notoriously difficult to say what exists when no one is looking. Is the electron a wave? A particle? A probability cloud? In Bohmian mechanics, the answer is simple: It is a particle. It is always somewhere.
  *   **No Collapse:** Standard QM requires a mysterious "collapse of the wavefunction" upon measurement, but doesn't define what constitutes a measurement. Bohmian mechanics requires no collapse. The wavefunction evolves deterministically via the Schrödinger equation forever; the appearance of randomness comes from our ignorance of the initial positions of the particles.
  *   **Determinism:** It restores the Laplacian determinism that your generation of chemists was trained on, albeit at the cost of non-locality.

  For a philosopher of science like Tim Maudlin, a theory that tells a clear story about what exists (ontology) and how it changes (dynamics) is preferable to a theory that relies on ill-defined concepts like "observers" or "classical apparatuses."

  ### 4. Why It Isn't the Consensus (The Cost)
  If Bohmian mechanics is deterministic, realistic, and matches all experimental data, why isn't it the standard model? Because the price of admission is steep.

  1.  **Conflict with Relativity:** While Bohmian mechanics doesn't allow for faster-than-light *signaling* (you can't use the non-locality to send a message), it does require a preferred reference frame to make sense of the "instantaneous" guidance. This makes it very difficult to reconcile with Special Relativity and Quantum Field Theory (QFT). Extending Bohm to QFT is possible but mathematically cumbersome and arguably unnatural compared to standard QFT.
  2.  **"Surreal" Trajectories:** In certain interference experiments, Bohmian trajectories can look bizarre. A particle might travel through one slit of a double-slit experiment, but be guided by the wave from the other slit in such a way that its trajectory seems to defy common sense (e.g., bouncing off a node where there is no force).
  3.  **Asymmetry:** The theory treats position as the fundamental "beable" (property that exists). Momentum and spin are derived properties, not fundamental ones. This feels arbitrary to many physicists who view position and momentum as symmetric conjugates.

  ### 5. Summary for Your Debate
  You can tell your colleague that your understanding of Bell was the standard textbook version, but the philosophical literature is digging into the rigorous foundations.

  *   **Bell's Theorem:** Rules out *Local* Hidden Variables.
  *   **Aspect's Experiment:** Confirmed nature is non-local (or non-real).
  *   **Bohmian Mechanics:** A *Non-Local* Hidden Variable theory.
  *   **Status:** It is empirically equivalent to standard QM. It cannot be ruled out by experiment, only by aesthetic or metaphysical preference (e.g., preferring Lorentz invariance over definite particle trajectories).

  The debate isn't about whether Bohm is "allowed" by Bell (it is); it's about whether the cost of explicit non-locality is worth the benefit of a clear ontology. That is a metaphysical choice, which is exactly why Carroll, Albert, and Maudlin spend so much time on it. You aren't behind the physics; you've just moved from the "shut up and calculate" phase of physics to the "what does it mean" phase, where the rules are less settled.
