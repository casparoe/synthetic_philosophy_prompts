answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Late afternoon. Two grad students, Julian and Elena, are surrounded by open laptops and half-empty mugs.*

  **Julian:** (Tapping his pen against his notebook) I'm telling you, the math doesn't lie. If you have a choice between one person being tortured for fifty years and 3^^^3 people getting a dust speck in their eye, you choose the torture. It's the only consistent answer.

  **Elena:** And I'm telling you that if you choose the torture, you've lost the plot of what morality is actually for. You're treating people like buckets of utility points instead of individuals.

  **Julian:** It's not about buckets, it's about scope insensitivity. Your brain isn't built to feel the difference between a million specks and a billion specks. It just registers "annoyance." But if you actually multiply the disutility—say, a speck is one micro-unit of pain—the total sum of the specks dwarfs the torture. To say otherwise is just a cognitive bug.

  **Elena:** It's not a bug, Julian, it's a feature. Think about Scanlon's rescue case. A man is trapped in a mine, going to lose his leg unless we cut the power to the transmitter. If we cut the power, a million people lose the signal to the World Cup final. They're annoyed, sure. But do you really think the aggregated annoyance of a million football fans outweighs one man losing a leg?

  **Julian:** I do, actually. If the annoyance is real, and the number is high enough.

  **Elena:** That sounds monstrous. If you say yes to that, you're saying that any individual can be sacrificed whenever the crowd is large enough, no matter how trivial the crowd's gain is. That destroys the idea of rights. It makes the individual hostage to the sum.

  **Julian:** Okay, but flip it. If you say *no*—if you say we save the leg even if it ruins the finale for ten billion people—you're saying one person's leg is worth more than the collective minor misery of the entire human race. That's scope insensitivity in reverse. You're ignoring the sheer volume of suffering because it's spread out. Where is the line, Elena? Seriously. If not ten billion, what about a trillion? At what specific number does the football finale outweigh the leg?

  **Elena:** (Pauses, stirring her coffee) That's the trap question. You want me to give you a number so you can prove I'm being arbitrary.

  **Julian:** I want you to give me a number so I know you're not just magic-thresholding your way out of a hard problem. If morality is rational, there has to be a tipping point.

  **Elena:** Fine. You want an answer? Here it is: For *trivial* harms, there is no number. No amount of dust specks adds up to a torture sentence. But for *significant* harms, aggregation works differently.

  **Julian:** That's a distinction without a difference. Why? A pain is a pain.

  **Elena:** No, it's not. Morality isn't about summing states of affairs; it's about justification. I have to justify my actions to each person affected. To the guy being tortured, I can't say, "Sorry, but we needed to spare a billion people a speck." That justification fails because the burden I'm asking him to bear is catastrophic, and the burden I'm sparing the others from is negligible. He can reasonably reject that principle.

  **Julian:** But to the billion people, you're saying, "Sorry, your annoyance doesn't count."

  **Elena:** I'm saying their *claims* don't outweigh his. Look, think of it like a courtroom. One guy is facing execution. A million people are facing a fifty-dollar fine. You don't put it to a vote. You don't say, "Well, 50 million dollars is more than one life, so execute him." The *type* of harm matters more than the sum.

  **Julian:** Okay, but push the fine. What if the million people aren't facing a fifty-dollar fine? What if they're facing a broken arm? Now does it aggregate?

  **Elena:** Now we're in a different zone. A broken arm is a significant impairment.

  **Julian:** See? So there *is* a threshold. So admit it! If I have enough people with broken arms, their total suffering outweighs the one guy's leg.

  **Elena:** I'll admit that if the harm is severe enough, we enter a zone of trade-offs. But the threshold isn't about the *number* of people; it's about the *severity* of the individual claim. For aggregation to override a vital interest, the competing interests must be relevantly similar in weight. A dust speck is not relevantly similar to torture. A migraine might be. A broken arm definitely is.

  **Julian:** So you're saying if I have 3^^^3 people with migraines, I should let the one guy get tortured?

  **Elena:** (Sighs) This is where it gets messy. But... yes. If the harm is substantial enough that *individually* it commands moral respect, then the sheer scale of it matters. If 3^^^3 people are going to suffer debilitating migraines, that is a catastrophe that rivals the torture. But a dust speck? Never. The dust speck claim is too weak to ever enter the weighing scale against a life-ruining harm.

  **Julian:** That feels like you're moving the goalposts. You're saying "Aggregation works, except when I say the harm is too small." How do you define "too small" without just using your gut feeling?

  **Elena:** I define it by "reasonable rejectability." Can the torture victim reasonably reject a rule that says "Sacrifice yourself for specks"? Yes, absolutely. Can the football fans reasonably reject a rule that says "Lose your leg so we can watch the game"? Yes. But can the football fans reasonably reject a rule that says "Lose the broadcast so a man keeps his leg"? No. That demand is unreasonable.

  **Julian:** But why does the *number* of fans not make it reasonable? If it's every human being who will ever live?

  **Elena:** Because the *nature* of the loss hasn't changed for the individual fan. They still just lose a game. The man still loses a leg. Adding more people who lose a game doesn't change the qualitative weight of the man's loss. It just adds more people who have a weak claim. A million weak claims don't combine to make a strong one.

  **Julian:** That's the bit I can't swallow. "A million weak claims don't combine to make a strong one." Why not? If I poke you a million times, you're bruised. If a million people poke you once, you're bruised. The physical reality aggregates. Why doesn't the moral reality?

  **Elena:** Because moral reality is about relationships, not physics. If I poke you a million times, *I* am responsible for a million harms. If a million people poke you once, *they* are each responsible for one. In the Broadcast case, the decision-maker isn't poking anyone. He's choosing whose claim to honor. And you honor the stronger claim. The claim to keep your leg is stronger than the claim to watch TV. Full stop. It doesn't matter how many TV watchers there are.

  **Julian:** So if I'm the decision maker, and I save the leg, and I go talk to the billion people... I look them in the eye and say, "Your collective suffering was greater, but I didn't care because your individual claims were weak"?

  **Elena:** You say, "I couldn't sacrifice a man's body for your entertainment. To do so would treat him as a means to your end. I owe him protection that I don't owe you pleasure."

  **Julian:** And if those billion people are suffering from something worse than entertainment? Say, mild nausea. Constant, low-grade nausea for a year.

  **Elena:** Now you're raising the severity. Nausea for a year is significant.

  **Julian:** (Leans in) Aha. So if I make the nausea bad enough, you aggregate?

  **Elena:** If the individual harm crosses the threshold of "serious burden," then yes, numbers start to matter again. Because now their claims are relevantly similar to the leg loss.

  **Julian:** So your whole argument rests on this magic "threshold of seriousness." Who sets it? You?

  **Elena:** We set it, collectively, by what we can demand of each other. It's not magic, it's social. We agree that life and limb trump comfort. We don't agree that comfort trumps life, even in the aggregate.

  **Julian:** But that leaves you vulnerable to the "Specks" case. 3^^^3 is not just a lot. It's a number so big it breaks physics. If every human in the multiverse gets a speck, that is a cosmic tragedy. You're willing to let one man endure hell to avoid a "cosmic tragedy" of annoyances?

  **Elena:** I'm willing to let one man endure hell rather than violate the principle that individuals are not fungible containers for utility. If I choose the torture, I am saying that *anyone* can be destroyed if the background noise of the universe is loud enough. I don't want to live in a world where my rights depend on how many people are having a slightly bad day elsewhere.

  **Julian:** And I don't want to live in a world where we let the sum of all suffering skyrocket just to protect a principle that feels nice but ignores the math.

  **Elena:** (Quietly) Maybe. But when the math tells you to torture a man for fifty years to save a billion people from a blink... maybe the math is the thing that's broken.

  **Julian:** Or maybe the intuition is.

  *(They sit in silence for a moment, the hum of the coffee machine filling the gap.)*

  **Julian:** So, to be clear. Your answer to "How many annoyed people outweigh a broken leg?"

  **Elena:** If it's annoyance? Infinity. It never outweighs it. If it's a broken finger? Then we start counting.

  **Julian:** (Shakes his head, smiling faintly) You really do draw a line in the sand.

  **Elena:** Someone has to. Otherwise, we're just sliding down a slope where nothing is sacred, just sumnable.

  **Julian:** And if the slope is where the truth is?

  **Elena:** Then I'd rather stand on the cliff.
