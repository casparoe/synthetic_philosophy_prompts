      *   **Goal:** A finding + reasoning that the *other half* could actually engage with. This means avoiding polarizing language, acknowledging the complexity, and finding a principled middle ground or a clear distinction that addresses the user's philosophical concern while upholding the code's intent.
      *   **Constraint:** Short decision memo.

  2.  **Deconstruct the Ethical/Logical Problem:**
      *   **The "Knobe Effect":** The user is describing a classic philosophical phenomenon known as the *Knobe Effect* (or Side-Effect Effect). People are more likely to judge a side effect as "intentional" if it is harmful than if it is helpful, even if the mental state (knowledge + acceptance) is identical.
      *   **The Code's Language:** "Intentionally jeopardizing employee safety."
