answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Compliance Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Determination Regarding Plant Director Maintenance Budget Decision

  **FINDING**
  The Committee finds that the Plant Director violated the Code of Conduct provision prohibiting the intentional jeopardizing of employee safety.

  **REASONING**
  The Committee acknowledges the substantive debate regarding the definition of "intentional." Specifically, we recognize the argument that the Director's primary *motive* was cost reduction, not employee injury, and that ordinary language often reserves "intentional" for outcomes that are actively sought rather than merely foreseen. We further acknowledge the observation that had the side effect been a safety improvement, we would likely characterize that as "incidental" rather than "intentional."

  However, the Committee resolves this tension by distinguishing between *motive* (why an act is committed) and *intent* (the mental state regarding the consequences of that act). Under our Code, "intentionally jeopardizing" is not limited to scenarios where harm is the primary goal. Instead, it encompasses situations where an actor:
  1.  Possesses actual knowledge that a specific action will foreseeably increase safety risks; and
  2.  Proceeds with that action regardless, prioritizing another objective.

  While we agree that our linguistic intuition regarding "intent" is often asymmetrical (judging harm differently than help), this asymmetry is ethically justified in a compliance context. Our duty of care imposes a higher obligation to avoid harm than to generate benefit. Therefore, knowingly accepting a foreseeable safety risk is functionally equivalent to intending that risk for the purposes of this Code.

  The Director's decision to cut maintenance, made with the specific understanding that injury rates would rise, constitutes a conscious choice to expose employees to harm. This meets the threshold of intentional jeopardizing, regardless of whether the injuries were an end goal or an accepted means to a financial target.

  **ACTION**
  Remedial measures and disciplinary recommendations to be forwarded to HR and Operations Leadership.
