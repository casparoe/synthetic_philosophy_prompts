      *   *Best approach:* Define "intentionally jeopardizing" to include "knowing acceptance of foreseeable risk." Explicitly address the asymmetry argument: The Code imposes a duty to *prevent* harm, not a duty to *optimize* benefit. Therefore, the mental state threshold differs for harm vs. help. This validates the user's observation (yes, it is asymmetrical) but justifies it ethically (because duties are asymmetrical).

  6.  **Finalizing the Memo Structure:**
