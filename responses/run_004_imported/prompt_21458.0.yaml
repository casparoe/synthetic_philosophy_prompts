  **Tier Explanations**

  **S Tier:** Machina's approach provides the most general theoretical framework for relaxing independence while preserving continuity and monotonicity, naturally accommodating fanning-out without ad-hoc parameters. Quiggin's Rank-Dependent Utility complements this by offering the most parsimonious functional form that resolves Allais and Common Ratio violations while maintaining transitivity and stochastic dominance.

  **A Tier:** Gul's Disappointment Aversion achieves a clean axiomatic foundation with a single parameter to capture disappointment, offering a tight structural departure from Expected Utility. Chew's Weighted Utility generalizes betweenness elegantly and preserves orderings, though it is sometimes viewed as less behaviorally motivated than rank-dependent models.

  **B Tier:** Cumulative Prospect Theory is descriptively powerful but introduces reference dependence and loss aversion, which constitute additional machinery beyond what is strictly required to explain Allais-type violations in the domain of gains. It builds on the RDU framework but sacrifices some theoretical parsimony for broader empirical coverage across gains and losses.

  **C Tier:** Regret Theory offers unique insights into preference reversals and pairwise comparisons but requires abandoning transitivity, which represents a significant departure from standard rationality axioms. Consequently, it is often viewed as theoretically costlier than models that preserve consistent orderings while modifying probability weighting or utility curvature.

