answer: |-
  **MEMORANDUM**

  **TO:** Rules Committee, Zoning Board of Appeals
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation Regarding Voting on Variance Findings and Applications

  **Purpose**
  The purpose of this memo is to recommend a procedural amendment to resolve ambiguity in our voting process. During the hearing on [Date/Case Name], a discrepancy arose between our votes on statutory findings and the final vote on the application. This situation, while unprecedented in our recent history, exposed a gap in our rules that could lead to legal vulnerability and inconsistent decision-making in the future. This memo recommends a specific voting standard for future hearings and advises on how to handle the permit issued in the recent case.

  **The Incident**
  As the Committee knows, our ordinance requires two specific findings to grant a variance: (1) unique hardship and (2) no alteration of neighborhood character. Our procedure calls for separate votes on each finding, followed by a vote on the application.

  In the recent hearing, the vote on "unique hardship" passed 3-2. The vote on "neighborhood character" also passed 3-2. However, the members voting "yes" were not the same people for both findings. Only two members believed *both* findings were satisfied. Consequently, when the final vote on the application was taken, only those two members voted to grant it. The application vote failed 2-3.

  Despite the failed application vote, the Chair ruled the variance granted, reasoning that because both findings passed individually, the legal criteria were met. A permit has since been issued. One colleague argues the final application vote should have controlled, resulting in a denial.

  **The Core Problem: The Doctrinal Paradox**
  My colleague with a background in philosophy identified this as a "doctrinal paradox" (sometimes called a "discursive dilemma"). In plain English, this occurs when a group accepts the *reasons* required for a decision by majority vote, but rejects the *decision* itself by majority vote.

  *   **Premise-Based Approach (Chair's Ruling):** If the required findings pass, the result is automatic.
  *   **Conclusion-Based Approach (Colleague's View):** The final vote on the application controls, regardless of the finding tallies.

  Both approaches have risks. The Premise-Based approach allowed a variance to be granted even though a majority of the Board (3 out of 5) did not believe the full legal test was met. The Conclusion-Based approach allows members to vote inconsistently (e.g., voting "yes" on all findings but "no" on the application) without consequence.

  **Recommendation for Future Procedure**
  I recommend that the Rules Committee propose an amendment adopting a **"Stable Majority" rule**.

  **The Rule:** *A variance shall only be granted if a majority of the Board members vote to affirm ALL required statutory findings AND vote to approve the application.*

  **Why this is the best option:**
  1.  **Legal Defensibility:** Variances are exceptions to the law. The burden of proof is on the applicant to satisfy the Board. If a majority of the Board does not agree that *every* legal criterion is met, the burden has not been met. A "shifted majority" (3 for Finding A, 3 for Finding B, but no overlap of 3 for both) does not constitute a legal majority for granting relief.
  2.  **Clarity:** This eliminates the conflict between the findings vote and the application vote. They become functionally the same threshold.
  3.  **Accountability:** It requires members to form a coalition that agrees on the reasoning, not just the outcome.

  **Addressing the "Strategic Voting" Concern**
  A valid concern has been raised that formalizing a finding-based rule might encourage "insincere voting." For example, a member who wants to deny a project might vote "yes" on a finding they actually reject, hoping to manipulate the coalition dynamics.

  We must be honest: **No voting procedure is entirely immune to strategy.** This is a known limitation in social choice theory. However, the "Stable Majority" rule actually *reduces* the incentive for insincere voting compared to our current system. Under the current system, a member can hide behind a shifted majority to achieve an outcome without owning the full reasoning. Under the Stable Majority rule, members know that their vote on a finding is dispositive. If they vote "yes" on a finding, they are committed to granting the variance if their colleagues do the same. This encourages transparency and forces members to deliberate until they find a genuine consensus on the facts, rather than trading votes.

  **Recommendation Regarding the Current Applicant**
  Regarding the variance granted last week: I recommend the Board take no action to revoke the permit.

  Although the voting procedure was ambiguous, the Chair's ruling was an official act of the Board. The applicant has relied on this ruling to their detriment by pulling a permit and likely incurring costs. In administrative law, this creates a "vested right" or "equitable estoppel." If the town attempts to revoke the permit now based on a procedural ambiguity that was not the applicant's fault, we would likely lose in court and expose the town to liability.

  We should treat this case as a legacy of the old, ambiguous rule. We should clarify the rule now to prevent future confusion, but we should honor the permit to protect the town from litigation.

  **Next Steps**
  1.  **Draft Amendment:** I propose we draft language requiring a single majority coalition to support all findings and the final application for a variance to pass.
  2.  **Training:** Before the next hearing cycle, we should hold a brief workshop to ensure all members understand that voting "yes" on a finding is a commitment to grant the variance if a majority agrees on all findings.
  3.  **Minutes:** We should ensure our minutes clearly record which members supported which findings, so any "shifted majority" is visible in the public record.

  **Conclusion**
  We cannot eliminate all mathematical quirks from group decision-making, but we can eliminate ambiguity. By requiring a stable majority for all findings, we ensure that when we grant a variance, a true majority of the Board agrees that the law allows it. This protects the integrity of the Board, ensures fairness to applicants, and minimizes our legal risk.

  I look forward to discussing this at the meeting in three weeks.
