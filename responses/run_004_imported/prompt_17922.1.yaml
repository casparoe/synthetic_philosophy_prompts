prompt: |-
  I was appointed three months ago to fill a vacancy on my town's zoning board of appeals, and a hearing last week has left me unsettled about how the board actually reaches its decisions. We are five members, and our ordinance conditions a variance on the board finding, among other things, both that the claimed hardship arises from conditions unique to the lot and not shared generally by nearby properties, and that granting the variance will not alter the essential character of the neighborhood. The other statutory criteria were effectively conceded in this case, so everything turned on those two findings. Our procedure calls for the board to vote on each finding separately and then take a further vote on the application itself, but it has never said which vote controls if the two come apart -- an eventuality that, until last week, had simply never arisen. This time, three of us judged the uniqueness finding satisfied, and, separately, three of us (though not quite the same three) judged the neighborhood-character finding satisfied, so each finding passed on its own by majority. Yet when the chair called the vote on the application itself, only two of the five voted to grant it; the other three had each rejected at least one of the two findings in their own reasoning and voted no on that basis. The chair resolved the discrepancy by treating the findings as dispositive and declared the variance granted, and the applicant has since pulled a building permit on the strength of that ruling. One of my colleagues now argues that we should instead have honored the direct vote on the application, since, in her view, that is plainly the vote meant to bind, findings notwithstanding. A friend of mine finishing a philosophy PhD thinks this pattern has a name in the judgment-aggregation literature -- she mentioned 'discursive dilemma' and 'doctrinal paradox' without being sure whether those name the same thing -- but she did not know the field well enough to say what a body like ours should actually do about it.

  Our rules committee meets in three weeks to consider procedural amendments before the next round of hearings, at least one of which is likely to present the same structure. I would like to bring a short memo to that meeting rather than improvise a resolution every time this arises, and I would be grateful if you would draft it. It should take a clear position on which vote ought to control going forward, address what, if anything, we owe the applicant given that a permit has already been pulled under a procedure our own rules never actually specified, and explain the reasoning in terms a board of non-lawyers could apply on our own the next time. Please also take seriously, rather than dismiss, my colleague's further worry that formalizing a finding-by-finding rule will simply teach members to vote insincerely on individual findings in order to steer the outcome they already favor. And if, as my friend suspects, no procedure escapes this kind of difficulty altogether, I would rather the memo say so plainly and still recommend the best available option than quietly assume the problem away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** A new member (3 months) of a town Zoning Board of Appeals (ZBA).
      *   **Recipient:** The Board's Rules Committee (for a meeting in 3 weeks).
      *   **Subject:** Resolving a procedural conflict regarding voting on variances (Findings vs. Final Vote).
      *   **The Conflict:**
          *   Ordinance requires two key findings: (1) Unique Hardship, (2) No Alteration of Character.
          *   Procedure: Vote on Finding 1, Vote on Finding 2, Vote on Application.
          *   Scenario: Finding 1 passed 3-2. Finding 2 passed 3-2 (different coalition). Final Application vote failed 2-3 (the 3 "No" voters each rejected at least one finding).
          *   Chair's Ruling: Findings control -> Variance Granted. Permit issued.
          *   Colleague's View: Final Application vote controls -> Variance Denied.
          *   Philosophical Context: "Discursive Dilemma" / "Doctrinal Paradox."
      *   **Requirements for the Memo:**
          *   Take a clear position on which vote should control going forward.
          *   Address the status of the current applicant (permit already pulled).
          *   Explain reasoning for non-lawyers.
          *   Address the concern about strategic/insincere voting (gaming the system).
          *   Acknowledge that no procedure is perfect (if true).
          *   Tone: Professional, clear, actionable, legally/practically sound.

  2.  **Deconstruct the Legal/Procedural Issue:**
      *   *The Doctrinal Paradox:* This occurs when a majority supports the *premises* (findings) required for a conclusion, but a majority rejects the *conclusion* itself.
          *   Case A (Premise-based): Grant variance because findings passed. (Chair's approach).
          *   Case B (Conclusion-based): Deny variance because the final vote failed. (Colleague's approach).
      *   *Legal Standard:* In administrative law and zoning, findings of fact are usually the *basis* for the decision. If the statutory criteria aren't met, the board *cannot* legally grant the variance. Conversely, if they *are* met, the board usually *must* grant it (unless there's discretion, but variances are often quasi-judicial).
      *   *The "Majority" Problem:* In the scenario, there was never a majority that believed *both* findings were met.
          *   Voter 1: Yes on F1, No on F2 -> No on App.
          *   Voter 2: No on F1, Yes on F2 -> No on App.
          *   Voter 3: Yes on F1, Yes on F2 -> Yes on App.
          *   Voter 4: No on F1, No on F2 -> No on App.
          *   Voter 5: No on F1, No on F2 -> No on App.
          *   *Wait, let's re-read the prompt's math:* "Three of us judged the uniqueness finding satisfied... three of us (though not quite the same three) judged the neighborhood-character finding satisfied."
          *   *Scenario Reconstruction:*
              *   Members: A, B, C, D, E.
              *   Finding 1 (Unique): A, B, C say Yes. (Passes 3-2).
              *   Finding 2 (Character): C, D, E say Yes. (Passes 3-2).
              *   Intersection (Both Yes): Only C.
              *   Final Vote: Only C and... wait, prompt says "only two of the five voted to grant it." So let's say C and B voted Yes on App? No, prompt says "the other three had each rejected at least one of the two findings in their own reasoning and voted no on that basis."
              *   So, Final Vote Yes: 2 members (who believed both findings were met).
              *   Final Vote No: 3 members (who believed at least one finding failed).
              *   *Crucial Point:* If the ordinance says the board *shall* grant a variance *if* findings are made, then the Findings are the legal gateway. If the findings aren't made by a majority that agrees on *both*, can you grant it?
              *   *Standard Administrative Law:* Usually, a decision is invalid if there isn't a majority supporting the *legal basis* for the decision. If Member A votes Yes on App but No on Finding 2, their Yes vote is legally inconsistent.
              *   *Premise-Based vs. Conclusion-Based:* Legal bodies generally prefer Premise-Based (Findings) because decisions must be reasoned. You can't just vote "Yes" without the findings. However, if no single majority agrees on the *set* of findings, the decision is vulnerable.
              *   *Best Practice:* The "Majority of the Whole" rule. To grant, you need a majority who agree on *all* necessary findings.

  3.  **Address the Specific Constraints:**
      *   **Clear Position:** I need to recommend one approach. The "Premise-Based" (Findings) approach is generally more legally defensible in zoning because variances are exceptions to the law. You can't grant an exception unless the legal criteria are *actually met* in the eyes of a majority. However, the specific paradox here (no overlapping majority) suggests the variance *should not have been granted*.
      *   *Correction:* The Chair granted it because each finding passed 3-2. But the *coalition* shifted. This is the heart of the Doctrinal Paradox.
      *   *Recommendation:* The rule should require a **stable majority**. A variance is granted only if a *single majority coalition* supports *all* required findings. If the majority shifts, the application fails. This protects the integrity of the findings.
      *   **Current Applicant:** This is tricky. Estoppel/Vested Rights. They pulled a permit based on the Board's official ruling. Revoking it now exposes the town to liability. The memo should advise honoring the permit but clarifying the rule for the future.
      *   **Strategic Voting:** Acknowledge this risk. If members know they need to form a coalition on findings, they might vote insincerely on a finding to kill/save a project. However, requiring a stable majority reduces the ability to "hide" behind a shifted coalition. It forces transparency.
      *   **Philosophical Honesty:** Acknowledge the Discursive Dilemma. No system is immune to strategy, but some are more legally robust.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the problem (voting discrepancy), the recommendation (stable majority on findings), and the immediate advice (let the permit stand).
      *   **Background:** Briefly recount the recent hearing without naming names. Explain the "shifted majority" issue.
      *   **The Philosophical/Legal Context:** Briefly explain the "Doctrinal Paradox" in plain English. Why does it matter? Because zoning is quasi-judicial.
      *   **Recommendation for Future Procedure:**
          *   Adopt a "Premise-Based" approach but with a "Stable Majority" requirement.
          *   To grant, a majority must agree on *all* findings.
          *   If Finding 1 passes 3-2 and Finding 2 passes 3-2 but the "Yes" voters aren't the same people, the application fails.
          *   Why? Because the ordinance requires *both*. If 3 members think Finding 2 failed, you can't legally say "Finding 2 passed" in a way that binds the board's judgment if those 3 are the majority. Wait, actually, if 3 vote Yes on F2, it passes. The issue is the *conjunction*.
          *   *Refinement:* The recommendation should be that the Final Vote is the binding one, *but* it must be consistent with the findings. Or, better: The Findings determine eligibility. If there is no majority that supports *all* findings, the eligibility is not met.
          *   *Decision:* The most legally sound advice for a ZBA is that **a variance requires a majority vote of members who find ALL statutory criteria satisfied.** A shifting coalition does not constitute a valid majority for the *granting* of the relief.
      *   **The Current Case (Estoppel):** The applicant relied on the Board's official action. The town is likely estopped from revoking the permit now, even if the procedure was flawed. Cost of error falls on the town, not the innocent applicant.
      *   **Strategic Voting:** Address the colleague's worry. Yes, it's possible. But requiring a stable majority makes strategy harder, not easier. It forces members to own their logic.
      *   **Conclusion:** Summarize.

  5.  **Refining the Logic (Self-Correction during drafting):**
      *   *Wait, check the math on the "Stable Majority" recommendation.*
      *   If I say "A majority must agree on all findings," does that mean 3 people must vote Yes on F1 AND Yes on F2? Yes.
      *   In the prompt's scenario: Only 2 people voted Yes on the Application. Presumably, these are the only 2 who believed *both* findings were met. (The prompt says "only two of the five voted to grant it; the other three had each rejected at least one... and voted no on that basis.")
      *   So, under my recommended rule, the variance would have been *denied*.
      *   This aligns with the legal principle that the burden of proof is on the applicant. If they don't secure a majority for *all* elements, they haven't met the burden.
      *   *Is this fair?* Yes, because variances are exceptions to the law.
      *   *What about the Chair's ruling?* The Chair treated the findings as independent tallies. This is the source of the paradox.
      *   *Recommendation:* Explicitly link the Final Vote to the Findings. The Final Vote is the only one that matters, *provided* the minutes reflect which findings each member supported. If the Final Vote fails, it fails. If the Final Vote passes, the minutes must show a majority supported the necessary findings.
      *   *Actually, simpler:* The rule should be: **The grant of a variance requires an affirmative vote on the application by a majority of members who have also affirmatively voted on ALL required findings.**
      *   *Wait, one more nuance:* The prompt asks to address the "Discursive Dilemma." I need to use that term but explain it simply.
      *   *Strategic Voting:* If I require a stable majority, does it encourage insincere voting? If I want the project to pass, but I hate Finding 1, I might vote Yes on Finding 1 insincerely. But if I require members to sign off on the *reasoning*, it discourages this. The memo should suggest that members must be prepared to defend their findings in writing/minutes.

  6.  **Finalizing the Advice on the Current Permit:**
      *   Do not revoke. Reliance interest. Potential lawsuit against the town. The procedural ambiguity was the town's fault, not the applicant's.
      *   Ratify the decision retroactively? Or just let it lie? Better to acknowledge the ambiguity and clarify for the future, but treat the current permit as valid due to detrimental reliance.

  7.  **Tone Check:**
      *   Respectful to the Chair and Colleague.
      *   Not overly academic, but acknowledges the philosophical input.
      *   Action-oriented for the Rules Committee.

  8.  **Structure of the Memo:**
      *   **To/From/Subject.**
      *   **Purpose.**
      *   **The Incident (Summary).**
      *   **The Core Problem (The Doctrinal Paradox).**
      *   **Recommendation 1: Future Procedure (Stable Majority Rule).**
      *   **Recommendation 2: Current Applicant (Detrimental Reliance).**
      *   **Addressing Strategic Voting.**
      *   **Conclusion.**

  9.  *(Self-Correction on "Stable Majority"):* I need to be careful. If 3 vote Yes on F1, and 3 vote Yes on F2, but the overlap is only 2... technically the findings *did* pass according to the current rules ("vote on each finding separately"). The problem is the *conjunction*.
      *   *Legal reality:* In many jurisdictions, if the findings are conditions precedent, you need a majority to agree on the *conjunction*.
      *   *My recommendation:* Change the rule to require that the majority granting the application must be the same majority that affirmed the findings. Or, simply: **A variance is granted only if a majority of the Board votes to grant the application. In doing so, each member voting 'Yes' must affirm that all statutory criteria are met.** If the 'Yes' votes on the application are fewer than a majority (as happened here, 2 out of 5), the application fails, regardless of the preliminary finding tallies.
      *   *Wait, re-reading prompt:* "only two of the five voted to grant it." So the Final Vote failed (2-3). The Chair overruled the Final Vote based on the Findings.
      *   *My Position:* The Final Vote must control. The Findings are *reasons* for the Final Vote. You cannot grant an application that fails the final vote. The Chair was wrong. The Colleague is right about the vote, but the underlying issue is the coalition.
      *   *Revised Position:* The Final Vote controls. However, to prevent the paradox, members should vote on the Application *based on* their findings. If the Application vote fails, it fails. The Chair cannot declare it granted if the Application vote failed.
      *   *Wait, if the Application vote failed (2-3), why did the Chair grant it?* Because the Chair thought the Findings (3-2 each) *forced* a grant.
      *   *My Recommendation:* The Application Vote is the binding action. The Findings are advisory/internal logic. If the Application Vote fails, the variance is denied. This solves the paradox by prioritizing the Conclusion (Application) over the Premises (Findings) when they conflict.
      *   *Counter-argument:* But what if 5 people vote Yes on Application, but the Findings fail? Then the decision is legally vulnerable (arbitrary/capricious).
      *   *Best Balance:* The Application Vote controls the outcome, but the Minutes must record the Findings. If the Application passes but the Findings don't show a majority support for the legal criteria, the decision is at risk of appeal.
      *   *Actually, the cleanest rule:* **To grant a variance, a majority of members must vote 'Yes' on the Application. Furthermore, the Minutes must reflect that a majority of members found each statutory criterion satisfied.** If the coalitions shift such that no single majority supports all criteria, the Application cannot legally be granted, even if the tallies individually pass.
      *   *Wait, that's the "Stable Majority" again.*
      *   *Let's look at the prompt's specific scenario:* Final Vote was 2-3 (Failed). Chair granted anyway.
      *   *Immediate fix:* The Final Vote must control. You can't grant an application that was voted down.
      *   *Long-term fix:* Ensure members understand that if they vote No on a Finding, they should generally vote No on the Application (unless there's discretion, but variances usually require findings).
      *   *Okay, I will recommend that the **Final Vote on the Application controls the outcome**, but it is procedurally improper to vote 'Yes' on the Application if one has not voted 'Yes' on all required Findings. This aligns the votes.*

      *   *Wait, let's step back.* The prompt asks me to take a clear position.
      *   Option A: Findings Control (Chair). Risk: Doctrinal Paradox.
      *   Option B: Application Vote Controls (Colleague). Risk: Inconsistent reasoning.
      *   Option C: Integrated Rule (My Recommendation). A variance is granted only if a majority votes Yes on the Application *and* the Minutes reflect that a majority supports each necessary Finding. If the "Yes" coalition on the Application does not overlap sufficiently to constitute a majority on the Findings, the grant is invalid.
      *   *Actually, simplest for a non-lawyer board:* **The vote on the Application is the only vote that matters.** The Findings votes are a roll call of reasoning. If the Application vote fails, the variance is denied. The Chair cannot override a failed Application vote with passed Finding votes. This empowers the Colleague's view but adds the nuance that members should vote consistently.
      *   *Wait, if I say Application Vote controls, does that solve the paradox?* In the prompt, Application Vote was 2-3 (Denied). Chair said Granted. So saying "Application Vote Controls" solves *this* case (it would have been denied).
      *   *Does it solve the strategic voting?* If I want it to pass, I vote Yes on App. If I want it to fail, I vote No.
      *   *Okay, I will recommend: The Final Vote on the Application controls. However, to ensure legal defensibility, members should not vote Yes on the Application unless they support all Findings.*

      *   *Wait, I need to address the "Discursive Dilemma" explicitly.*
      *   The dilemma is: Premise-based (Findings) vs. Conclusion-based (Application).
      *   Legal scholars generally prefer Premise-based for courts/boards because decisions must be reasoned. *However*, if the premises don't aggregate to a majority for the conclusion, the decision is unstable.
      *   *Best advice for ZBA:* Since variances are quasi-judicial, the **Findings are the legal gateway.** You cannot grant without them. Therefore, if there is no *single majority* that agrees on *all* findings, you cannot grant. The shifted majority (3 for F1, 3 for F2, but only 2 for Both) means the legal criteria were *not* met by a majority.
      *   *So, my position:* The Chair was wrong. The Colleague is right on the result (Denied), but for the wrong reason. It's not just that the App vote failed; it's that the *legal criteria* were not met by a stable majority.
      *   *Recommendation:* Adopt a "Concurrent Majority" rule. To grant, you need a majority who say Yes to F1 AND Yes to F2 AND Yes to App.
      *   *This addresses the paradox:* It acknowledges that shifted majorities don't count.
      *   *This addresses the permit:* Too late to change, reliance interests.
      *   *This addresses strategy:* Harder to game because you need to persuade colleagues to agree on *everything*, not just swap votes.

      *   *Okay, let's write.*

  10. **Final Polish:** Check tone. Ensure it sounds like a memo from a board member to a committee, not a law review article. Keep the philosophy accessible. Ensure the advice on the permit is prudent (don't invite a lawsuit).

  **(Self-Correction on the Permit Advice):** If the board admits the procedure was flawed, does that invalidate the permit? Generally, no, if the applicant acted in good faith. I should advise the Committee to recommend the Board *ratify* the decision to avoid estoppel claims, even if the voting math was shaky. Or simply recommend leaving it alone as a "one-off" due to the ambiguity. I'll suggest acknowledging the ambiguity and honoring the permit to avoid liability.

  **(Self-Correction on Strategic Voting):** I need to be honest. No voting system is strategy-proof (Arrow's Theorem vibes). I should admit this but argue that transparency reduces the harm.

  **(Final Plan):**
  1.  **Header.**
