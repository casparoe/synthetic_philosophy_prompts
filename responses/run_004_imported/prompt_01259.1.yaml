answer: |-
  You are not missing a step. In fact, you have put your finger on the exact fracture point in Tolstoy's argument. Your intuition is correct: the premise that *"if it could've been said in words the artist would've just used words"* is doing far too much heavy lifting, and yes, it proves too much.

  Tolstoy's argument in *What Is Art?* is passionate and rhetorically dazzling, but logically, it relies on a rigid binary that doesn't hold up to scrutiny. Here is why your skepticism is well-founded, and where Tolstoy's reasoning gets shaky.

  ### 1. The False Dichotomy of "Feeling" vs. "Understanding"
  Tolstoy defines art strictly as the **transmission of feeling** (his famous "infection" theory). For him, if you feel it, you get it. If you don't feel it, you don't.

  The flaw here is that human engagement with art isn't just about immediate emotional infection; it's also about **recognition** and **attention**.
  *   **Recognition:** I might look at a Goya painting and feel "disturbed." That is the infection. But a critic might explain the historical context of the Peninsular War, which doesn't *create* the feeling, but deepens the *object* of the feeling. I move from "this is scary" to "this is a specific indictment of fascist violence." The feeling is sharper, not replaced.
  *   **Attention:** Criticism often functions like a tour guide pointing out a detail you walked past. "Notice how the light falls on the hand." That isn't explaining the feeling in words; it's directing your perception so the art can infect you *more* thoroughly. Tolstoy assumes the viewer is either perfectly open or perfectly closed, ignoring that most of us are somewhere in between, needing our attention tuned.

  ### 2. The "Joke and Poem" Counter-Example
  Your point about jokes and poems is the strongest logical rebuttal.
  *   **Jokes:** If you explain the *punchline*, you kill the joke. But if you explain the *context* (e.g., "This references a scandal from 1920s Paris"), the joke often becomes funnier because the incongruity lands harder. Criticism is usually explaining the context, not translating the punchline.
  *   **Poetry:** If Tolstoy were right, poetry would be impossible to discuss. Yet, poets themselves write essays about their poems. Why? Because the poem operates on multiple levels: sonic, rhythmic, symbolic, and intellectual. A critic might point out a rhyme scheme that creates a sense of entrapment. That isn't replacing the poem with words; it's illuminating the *mechanism* of the feeling.

  Tolstoy conflates **translation** (replacing the art with a summary) with **elucidation** (shedding light on the art). Criticism is the latter; Tolstoy attacks the former.

  ### 3. The "Ineffability" Trap
  The claim that *"Had it been possible to explain in words... the artist would have expressed himself in words"* assumes that art and language are mutually exclusive containers.
  *   **Art is cognitive, not just emotional.** Conceptual art, political art, and religious art (which Tolstoy claimed to champion) often rely on ideas that *do* intersect with language.
  *   **Artists use words.** Artists write titles, manifestos, and letters. They give interviews. They know words can't *replace* the work, but they also know words can *frame* the work. If Tolstoy's logic held, artists would never title their works beyond "Untitled #1," because a title is a verbal cue that influences interpretation.

  ### 4. Tolstoy's Agenda (The Hidden Premise)
  To be fair to Tolstoy (or at least, to understand him), you have to look at *why* he makes this argument. *What Is Art?* is not a disinterested philosophical inquiry; it is a polemic.
  *   Tolstoy was arguing against "elite" art that required education to understand. He wanted art to be universally accessible to the peasantry.
  *   For his argument to work, he *needs* criticism to be worthless. If criticism is valuable, then "educated" people have an advantage in experiencing art, which violates his moral framework of universal brotherhood.
  *   So, he constructs a definition of art (immediate emotional infection) that makes criticism logically impossible. It's a motivated reasoning loop. He defines art in a way that excludes the need for critics because he hates the critics of his day.

  ### 5. Where Your Friend Stands
  Your friend's slogan—"If you have to explain it, it didn't work"—is a useful heuristic for **immediacy**, but a terrible metric for **longevity**.
  *   **Pop Art/Entertainment:** Often aims for immediate infection. If a blockbuster movie needs a 20-minute explanation to be enjoyable, it failed as entertainment.
  *   **High Art/Complex Art:** Often aims for sustained engagement. A complex novel or painting might "work" initially by intriguing you, but require "explanation" (context, analysis) to unlock its deeper layers.

  Tolstoy supports your friend's view, but only by flattening the landscape of art. He ignores that some art is designed to be a sprint (immediate feeling) and some is designed to be a marathon (unfolding meaning).

  ### The Verdict
  You aren't missing a step; you've spotted the overreach. Tolstoy's argument collapses because it treats art as a magical transmission of pure emotion that exists in a vacuum.

  In reality, art is a conversation. It happens between an artist, an object, a viewer, and a **context**. Criticism is the voice that articulates the context. It doesn't replace the infection; it ensures the host is receptive to it.

  So, you can tell your friend: Tolstoy is right that criticism cannot *substitute* for experience, but he is wrong that it adds *nothing* to it. Explaining a poem doesn't kill the poem; it gives you better glasses with which to read it.
