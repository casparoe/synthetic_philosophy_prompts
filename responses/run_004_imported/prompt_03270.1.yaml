          *   ND: But the correlation has to be incredibly specific to match $\cos^2(\theta)$. That's fine-tuning.
      *   **Round 3: The Scientific Method Objection (Crucial).**
          *   ND: If settings correlate with hidden variables, you can't run experiments. (Drug trial analogy).
          *   SD: This is the strongest point for ND. SD needs a nuanced reply. It's not that *all* correlations exist, just specific ones for quantum systems. We need a model that predicts *when* independence fails.
      *   **Round 4: Nonlocality's Cost.**
          *   SD: Nonlocality violates the spirit of relativity. Preferred frames.
