      *   **Nonlocality Defender (ND):** Let's call him *Tim* (nod to Maudlin). He needs to emphasize the cost to scientific practice, the "fine-tuning" problem, and the intuitive plausibility of nonlocality vs. the absurdity of cosmic correlations.

  3.  **Key Arguments to Cover:**
