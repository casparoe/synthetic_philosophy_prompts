answer: |-
  This is not a weird question at all. It is, in fact, one of the most profound questions in historiography, epistemology, and the ethics of storytelling. You have stumbled upon the tension between **archival silence** and **oral testimony**, a conflict that defines much of modern history-writing.

  The short answer is: **No, every claim does not need independent backup to count as "known," and yes, there is a principled framework for accepting oral testimony as valid historical evidence.**

  Here is a breakdown of why you are entitled to trust your great-aunt, the philosophical underpinnings of that trust, and how to handle it as a novelist.

  ### 1. The Myth of the Objective Archive
  You hit on a crucial insight: *"even the archives I'd check it against are themselves just some clerk's word from way back."*

  Historians used to treat written records (census data, workhouse logs, birth certificates) as "facts" and oral stories as "memories" (implying one is hard and one is soft). We now understand that a workhouse log is just a narrative written by a tired, possibly prejudiced clerk who might have misspelled a name, guessed an age, or omitted a person to save paper.

  If you require independent corroboration for every claim, **almost all history becomes impossible.** Most human beings throughout history did not leave paper trails. If we only "know" what is written in official records, we only know the history of the state, not the history of people. Relying on your great-aunt is not "lazy"; it is an act of **historical recovery.**

  ### 2. The Epistemology of Testimony
  In philosophy, there is a concept called **Testimonial Justification**. It asks: *When am I rational to believe what someone tells me?*

  The default position of most epistemologists (like Tyler Burge or Miranda Fricker) is that we are entitled to accept testimony as true **unless we have a specific reason to doubt it.** This is called the *Principle of Credulity*.

  *   **The Burden of Proof:** The burden isn't on you to prove your great-aunt is telling the truth; the burden is on the skeptic to prove she is lying or mistaken.
  *   **Testimonial Injustice:** Philosopher Miranda Fricker coined this term to describe when we unfairly discount someone's word due to prejudice (e.g., assuming an elderly woman's memory is faulty, or that poor ancestors wouldn't have agency). Dismissing your great-aunt's story because it lacks a government stamp could be viewed as a form of testimonial injustice against the marginalized people in your family history.

  ### 3. Criteria for "Principled Trust"
  While you don't need independent proof, you shouldn't accept the story blindly. You can apply historical criticism to oral history just as you would to a document. Ask these three questions:

  **A. Is it Contextually Plausible?**
  Does the story fit the known historical reality?
  *   Was there a famine?
  *   Were workhouses a threat at that time and place?
  *   Is 40 miles a possible distance to walk? (Yes, refugees often walked much further).
  *   Was there snow? (Check old weather records/almanacs for that winter).
  If the *setting* is accurate, the *action* is likely grounded in reality, even if the specific mileage is rounded up.

  **B. What is the Cost of the Lie?**
  Why would she tell this story?
  *   Stories about avoiding the workhouse during a famine are rarely boastful; they are stories of trauma and survival.
  *   People do not typically fabricate painful, harrowing family legends about starvation and exposure unless something like it happened. The emotional weight of the story usually correlates with the weight of the event.

  **C. Internal Consistency**
  Did she tell it the same way more than once? (You mentioned one interview, but did the details hold together during that interview?)
  *   Oral history often changes in the *details* (the color of the shawl, the exact number of miles) but remains rigid in the *core* (we walked, it was winter, we were fleeing the workhouse).

  ### 4. The Novelist's Contract
  You are writing a **novel**, not a doctoral thesis. This gives you a different kind of license, but also a different kind of responsibility.

  *   **Forensic Truth vs. Narrative Truth:** A historian seeks forensic truth (exactly what happened). A novelist seeks narrative truth (what it *felt* like, and what the event *means*). Your great-aunt's story provides the narrative truth of your family. Even if the grandmother only walked 30 miles, the *experience* of the family is that she walked 40. That belief shaped your family's identity for a century.
  *   **The "As If" Contract:** In historical fiction, readers understand that dialogue is reconstructed and timelines are compressed. If you base the scene on your great-aunt's testimony, you are honoring the primary source available to you.

  ### 5. How to Handle It Ethically
  If you are still nagged by the lack of proof, you can handle it transparently without undermining the story.

  *   **The Author's Note:** This is the standard solution. You can write: *"The scene regarding the walk to [Location] is based on oral testimony from my great-aunt, [Name]. While no written records exist to confirm the specific distance or weather conditions, this story has been the cornerstone of my family's history for four generations."*
      *   This protects you from accusations of fabrication.
      *   It honors your great-aunt.
      *   It invites the reader into the mystery of memory.
  *   **Frame the Uncertainty:** Within the novel, you don't have to present it as omniscient fact. You can narrate it through the lens of memory. *"Years later, the story would be told as forty miles. Perhaps it was less. Perhaps it was more. But in the telling, it was always forty, and the snow was always knee-deep."* This acknowledges the mythologizing of memory while keeping the event real.

  ### Summary
  You are not being lazy. You are engaging in **oral historiography.**

  The archives are full of lies told by powerful people to protect the state. Your great-aunt's story is a truth told by a vulnerable person to protect her family's dignity. In the absence of contradictory evidence, **you are epistemologically entitled to take her word.**

  Trust the aunt. Write the scene. Acknowledge the source. That is as "true" as you are ever going to get.
