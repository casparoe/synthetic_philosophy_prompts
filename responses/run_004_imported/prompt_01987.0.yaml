prompt: |-
  so i've been going down an AI safety rabbit hole on lesswrong and keep running into this thing called the "Löbian obstacle." from what i can tell, because of Löb's theorem a formal reasoner basically cant ever prove "if my future self proves X, then X is actually true" for arbitary X, unless it can already prove X directly -- so it can never fully verify ahead of time that a smarter/updated version of itself will still be safe. i brought this up at my school's philosophy club and everyone just gave me a blank stare lol. can you break down the most important implications of this for whether AI that safely rewrites its own code (or even builds a successor AI) is even possible in principle? like does this basically doom the whole idea of provably safe recursive self-improvement, or are there ways around it that still actually count as solving the problem?
