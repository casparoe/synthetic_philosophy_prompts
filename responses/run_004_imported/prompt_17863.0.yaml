  my friend priya is getting married in a few weeks and asked me to give a speech. she's been part of our old ssc/lw meetup crowd since 2015, and her whole personal ethos for years has been "pay the driver" -- as in parfit's hitchhiker, the guy dying of thirst who only gets picked up if the driver predicts he'll pay once he's safe in town, even though by then he's got zero selfish reason left to. she calls it rational irrationality: being "irrationally" loyal on purpose is exactly what makes you trustworthy in the first place. the grooms side has never heard of any of this in their life.

  write me a ~4 minute wedding speech that uses the hitchhiker case as the actual backbone of the toast, not just a cute reference, to say something true about why her promises mean something -- without turning into a decision theory lecture that loses half the room.
