answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of knowing Priya since 2015.

  We come from a crowd that loves big ideas. But Priya? Priya distilled the biggest idea of all into a four-word motto she's lived by for nearly a decade: *"Pay the driver."*

  Now, half of you are nodding, and the other half are wondering if this is about Uber tips. It's not. It's actually a story about trust.

  There's a famous thought experiment about a traveler dying of thirst in a desert. A driver comes along and says, "I'll take you to town, but only if you promise to pay me once we get there."

  Here's the catch: Once the traveler is safe in town, with water in their belly and money in their pocket, they have zero logical reason to pay. The driver is gone. They're safe. Keeping the money is the "smart" move.

  But the driver knows this. So the driver only picks up people who are the *kind of person* who pays even when they don't have to.

  Priya calls this "rational irrationality." It sounds like a contradiction, but it's the secret to her character. It means being "irrationally" loyal on purpose. It means pre-committing to your promises so deeply that you don't calculate the cost when things get hard.

  I've watched Priya live this since 2015. I've seen her show up for friends when it was inconvenient. I've seen her keep confidences when it would have been easier to gossip. I've seen her follow through on commitments when no one was watching and no one would have blamed her for quitting.

  She doesn't do these things because she's calculated the ROI. She does them because she is a person who *pays the driver.*

  And that is why she is going to be an incredible wife.

  [Groom's Name], marriage is going to be full of desert crossings. There will be days when you are tired, or stressed, or when the "selfish" thing to do is to check out emotionally. There will be moments where the logical calculation says, "I don't have to be kind right now. No one will know."

  Priya will be kind anyway. She will pay.

  But the beauty of this deal is that it goes both ways. She is looking for a partner who understands that trust isn't built on what you can get away with. It's built on who you are when you don't have to be good.

  Priya, you have spent years proving you are the traveler who pays. And [Groom's Name], you have proven you are the driver who recognizes value.

  So, if everyone could please raise a glass.

  To Priya and [Groom's Name]. May you always know that you are safe in the town you build together. May you never have to calculate the cost of loyalty. And may you always, always pay the driver.

  To the happy couple!
