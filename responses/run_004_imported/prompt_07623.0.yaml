prompt: |-
  Ok so I had this whole argument with my friend last night that somehow wandered way further afield than where it started. We got into the "do neural nets actually have representations" debate — like that Anthropic superposition stuff, where a single neuron fires for some random grab-bag of things (French text + legal jargon + commas, whatever) and you have to decompose it into "features" that are just directions in activation space before you get anything monosemantic out of it. My friends take was that there's no principled fact about which decomposition is the "true" one, its all just whichever basis happens to be useful to us. I said that sounded a lot like Quine's indeterminacy of translation with extra linear algebra, so I ended up explaining gavagai and ontological relativity badly over beers. Now I'm curious what you actually think: if Quine had lived to see mechanistic interpretability, would he really back my friend's "no fact of the matter" reading, or is there something in his own views that should make him resist stretching that kind of indeterminacy to cover neural nets specifically?
