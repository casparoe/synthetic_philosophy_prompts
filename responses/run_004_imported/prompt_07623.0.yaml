  1.  **Analyze the User's Query:**
      *   **Context:** The user had a debate with a friend about neural network representations (specifically polysemanticity vs. monosemanticity, superposition, and feature decomposition).
      *   **Friend's Position:** There is no principled fact about which decomposition is "true"; it's all relative to utility (instrumentalism/anti-realism about features).
