answer: |-
  **Setting:** *A sunlit cloister garden, outside of time. The air smells of parchment and lavender. Thomas Aquinas, heavy-set and deliberate, sits on a stone bench. John of Salisbury, leaner and more animated, paces before him.*

  **Thomas:** Master John, it is an honor to converse with you. Your *Policraticus* was a beacon for us in Paris. You were among the first to treat the body of the republic as a living thing, with the prince as the head and the church as the soul.

  **John:** And I am humbled, Brother Thomas, to speak with the Angel of the Schools. Your synthesis of faith and reason has done more to order the Christian mind than my humble musings ever did. But I suspect we have not gathered to trade compliments. The shadow of the tyrant hangs over our discussion, does it not?

  **Thomas:** It does. Specifically, the question of the sword. In your eighth book, you speak boldly of tyrannicide. You suggest that to kill a tyrant is not merely lawful, but "equitable and just." You even cite Ehud and Jael as models.

  **John:** I do. For what is a tyrant, Thomas? He is not a true prince. The prince rules by law, for the public good. The tyrant rules by caprice, for private greed. He is a public enemy. If a wolf enters the fold, does the shepherd wait for a committee to authorize him to strike?

  **Thomas:** A wolf is a beast. A ruler, even a bad one, holds an office ordained by God. We must distinguish carefully. Let us take the first case: A man who seizes the throne by force or fraud. He has no legitimate title. He is a usurper.

  **John:** Precisely. This is the *tyrannus ex defectu tituli*—the tyrant by defect of title. Such a man has no bond of fidelity with the people. He is a bandit with a crown. If a private citizen finds the opportunity to slay him, I see no sin in it. Indeed, he serves God by removing an obstacle to justice.

  **Thomas:** Here, I largely agree, but with a caution regarding the *act* itself. Because this usurper has no claim, he is not truly a "ruler." He is an aggressor. However, I worry about the transition. If any private man decides to strike, he risks plunging the realm into civil war. The usurper may have allies. His death may bring a worse vengeance.

  **John:** You fear the consequence more than the crime?

  **Thomas:** I fear the disorder. But let us move to the harder case. The second case: A ruler who inherits the throne lawfully. He is anointed. He has the title. But over time, he turns to cruelty. He plunders the church, oppresses the poor, and rules by fear. He is a *tyrannus ex parte exercitii*—a tyrant by exercise of power. Here, Master John, our paths diverge. You imply that even here, if the tyranny is egregious, a private hand may strike.

  **John:** If he violates the law of God, he forfeits the protection of the law of man. He breaks the pact. If the prince becomes a tyrant, he ceases to be a prince. Why should the people suffer endlessly because a man was born to a crown rather than stealing it? Is God's law subordinate to hereditary right?

  **Thomas:** No, God's law is supreme. But consider the order of authority. Who is to judge when the prince has crossed the line from strictness into tyranny? If you grant this power to every private individual, you make every discontented subject a judge. One man's tyrant is another man's strong king.

  **John:** And if the public authorities—the nobles, the magistrates—are cowed? What if the tyrant has bought them or terrified them into silence? Must the body politic rot while the members wait for a courage that never comes? I cite Brutus and Cassius. They struck down Caesar not as private men, but as defenders of the Republic.

  **Thomas:** And look what followed! The assassination of Caesar did not restore liberty; it brought Augustus and a heavier yoke. This is my primary objection in *De Regno*. To kill a tyrant privately is to invite sedition. It undermines the very principle of authority. If the people see that the king can be stabbed in the street, they will cease to fear the law and only fear the dagger.

  **John:** So you would have them suffer?

  **Thomas:** I would have them pray, and I would have them look to public authority. If the king was elected by the nobles or the people, those same electors have the right to depose him. They represent the public authority. They can judge him. But a private subject? No. A private subject has no jurisdiction over the head of the body. To strike the head is to attack the body itself.

  **John:** You place great faith in these "electors." But what if the tyranny is universal? What if the tyrant has silenced the church and cowed the nobles? In such a extremity, does not the law of self-defense apply to the whole people? And if the whole people cannot act, may not one man act as the instrument of divine wrath? You speak of order, Thomas, but is there order in a state where justice is dead?

  **Thomas:** There is a distinction between killing a man and killing a king. When a private man kills a tyrant, he commits regicide, regardless of the tyrant's sins. This scandalizes the faithful. It suggests that the end justifies the means. I argue that we must trust in Divine Providence. God raises up tyrants to punish the sins of the people. To remove the scourge by sinning—by murder—is to compound the evil.

  **John:** That is a heavy burden to place on the innocent victims of the tyrant! You speak of the "sin" of the assassin, but what of the sin of the bystander who allows the slaughter of his neighbors? In the *Policraticus*, I wrote that tyranny is not only a public crime but a sacrilege. It attacks the image of God in the community. To stand idle is to be complicit.

  **Thomas:** I do not say stand idle. I say act through due process. If there is truly no superior authority to judge the king—as there is with an emperor—then we must appeal to God. But we cannot usurp His judgment prematurely. Furthermore, consider the practical result. If we legitimize tyrannicide, do we not encourage ambitious men to *call* good kings tyrants merely to seize power for themselves?

  **John:** *Pauses, stroking his chin.* That is a sharp point. I concede that rash judgment is a danger. A man may mistake severity for tyranny. But your solution, Thomas, relies on mechanisms that often do not exist. In my time, the law was often what the king said it was. If the king *is* the law, and the king is corrupt, your "public authority" is a fiction.

  **Thomas:** Then the remedy is not the dagger, but the withdrawal of obedience. If a king commands against God, he must not be obeyed. But he need not be killed. There is a difference between resistance and execution.

  **John:** Passive resistance is a luxury for the philosopher. For the peasant whose grain is seized, or the priest whose throat is cut, it offers little comfort. But let me press you on your first case. The usurper. You agreed he may be resisted. But if a private man kills him, is it not still regicide in the eyes of the world?

  **Thomas:** No. Because he never held the office. He is an occupier. To kill him is an act of war, not an act of sedition.

  **John:** And yet, once he sits on the throne, wears the crown, and holds the scepter, does he not acquire a certain *de facto* authority? If he keeps the peace, even by force, is there not a duty to obey him, as Paul says regarding the powers that be?

  **Thomas:** *Leans forward.* A crucial distinction. If the usurper stabilizes the realm and rules for the common good, he may acquire legitimacy through time and consent. But if he rules purely for plunder, he remains an enemy. Yet, even then, I maintain that the act of removal should ideally come from those with public standing, not a shadow in the corridor.

  **John:** We are circling the same well, Thomas. You fear the chaos of the remedy more than the disease. I fear the disease more than the remedy. You trust in the structure of authority to correct itself. I trust in the zeal of the virtuous individual when the structure fails.

  **Thomas:** And I fear that "zeal" is often a mask for pride. The assassin believes he is a savior. But who anointed him?

  **John:** And I fear that "order" is often a mask for cowardice. The bystander believes he is prudent. But who anointed the tyrant?

  **Thomas:** *Sighs.* We cannot resolve this fully, I think. But perhaps we can agree on this: Tyranny is the worst of evils in the political order. It corrupts the common good.

  **John:** On that, we are one. And we agree that a ruler who rules against God is no true ruler.

  **Thomas:** Agreed. We differ on the human instrument of his removal. You would allow the hand of the private citizen when necessity demands. I would restrain that hand, lest it tear the fabric of society, and place the sword only in the hand of public judgment or Divine intervention.

  **John:** Then let us pray that princes remember they are men, and that God is the true King. For if they forget, your caution may be too slow, and my boldness too bloody.

  **Thomas:** Amen, Master John. Amen.
