  9.  **Final Polish:** Enhance the voice. Elena should sound more existential/pragmatic. Marcus should sound more analytic/metaphysical. Ensure the transition from abstract argument to personal advice is smooth. (Self-correction: Ensure the user feels addressed in the conclusion or that the dialogue serves *them*.)

