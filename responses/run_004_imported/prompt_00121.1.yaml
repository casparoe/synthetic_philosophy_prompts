answer: |-
  This is a textbook example of a problem known in philosophy as **Moral Luck**. Your intuition that the situation is unfair is shared by many major ethical theorists, but the social reaction you are witnessing also has philosophical defenders.

  Since you are taking an ethical theory course, this is a perfect opportunity to apply specific frameworks. Here is a breakdown of the philosophical landscape regarding your situation, divided into the argument for your intuition (The Control Principle) and the argument for your friends' reaction (The Challenge of Moral Luck).

  ### 1. The Argument for Your Intuition: The Control Principle

  Your feeling that it is unfair to be blamed for things outside your control is grounded in what philosophers call **The Control Principle**.

  *   **The Core Idea:** An agent is morally assessable only for what is within their control. If two agents make the exact same choice with the exact same mental state, they should receive the exact same moral judgment, regardless of how the world happens to respond.
  *   **Kantian Deontology:** Immanuel Kant is the strongest proponent of this view. For Kant, the only thing good without qualification is a "good will." Consequences are often determined by fortune, nature, or other people. To base moral worth on outcomes is to base it on luck, which undermines moral agency.
  *   **The "Negligence Lottery":** In your case, you and your housemate entered a "negligence lottery." You both chose to leave the stove. The only difference was the presence of a frayed cord (a factor outside her control). If blame tracks only control, you are **equally blameworthy** because your *choice* to risk a fire was identical.

  **How to defend this:** You can argue that moral judgment should track **ex-ante risk** (the risk created at the moment of decision) rather than **ex-post harm** (the damage after the fact). Since you both created the same ex-ante risk, you deserve equal censure.

  ### 2. The Counter-Argument: The Problem of Moral Luck

  In 1976, philosophers **Bernard Williams** and **Thomas Nagel** independently published papers challenging the Control Principle. Nagel specifically categorized your situation as **Resultant Luck** (luck in the way one's actions and projects turn out).

  Why might your friends (and some philosophers) think it is reasonable to blame her more?

  *   **Epistemic Access (We judge what we see):** We cannot see into your housemate's mind or yours. We cannot perfectly measure "attentiveness." We rely on outcomes as evidence of character. The fire serves as *proof* that the risk was real and that the precaution was insufficient. Without the fire, your recklessness remains theoretical; with the fire, it is concrete.
  *   **Consequentialism:** If you lean toward utilitarianism, outcomes matter immensely. The moral goal is to minimize suffering. Your housemate's action resulted in significant suffering (damage, trauma, cost); yours did not. While your *intentions* were the same, the *moral cost* of her action was objectively higher.
  *   **The "Should Have Known" Argument:** One could argue the actions weren't *actually* identical. Part of being responsible is scanning the environment. If a frayed cord was "nearby," a critic might argue she failed in a duty to inspect the area that you (luckily) didn't fail in because your area was clear. This shifts the blame from the stove to the failure to notice the cord.
  *   **Reactive Attitudes (P.F. Strawson):** Philosopher P.F. Strawson argued that blame isn't just a cold calculation of control; it is a social emotion (resentment, indignation). It is psychologically difficult for humans to feel indignation toward someone whose actions caused no harm. The friends' reaction is a natural human response to harm, even if it isn't philosophically "pure."

  ### 3. Distinguishing *Blameworthiness* vs. *Blame*

  A useful distinction in your course might be between **blameworthiness** (an internal moral status) and **blame** (a social practice).

  *   **Blameworthiness:** You might argue that you and your housemate are *equally blameworthy*. You both violated a duty of care.
  *   **Blame:** However, the *practice* of blaming often serves a functional purpose: deterrence and restitution.
      *   Your housemate now has to pay for damages and deal with the trauma. This is a form of "outcome luck" that punishes her severely.
      *   Your friends' social shaming might be an attempt to reinforce the severity of the risk now that the risk has been actualized.

  Some philosophers argue that while we are not *more blameworthy* when things go wrong, we do incur different **obligations** after the fact. Your housemate now has an obligation to repair the damage; you do not. This difference in obligation might bleed into how people perceive your character.

  ### 4. How to Untangle This for Your Course

  If you are writing a paper or preparing for a discussion, here is a way to frame the tension:

  1.  **Acknowledge the Intuition:** Start by affirming the Control Principle. It seems fundamentally unjust to punish someone for a frayed cord they didn't know about.
  2.  **Introduce Nagel:** Use the term "Resultant Luck." Explain that our ordinary moral practices violate the Control Principle constantly (e.g., attempted murder vs. successful murder).
  3.  **Evaluate the Function of Blame:** Ask: What is blame *for*?
      *   If blame is about **retribution** (giving people what they deserve based on their will), then you are right: it is unfair.
      *   If blame is about **safety and incentives** (discouraging risky behavior), then focusing on the person who actually caused the fire might seem more urgent to your friends, even if it isn't "fair" to the agent.
  4.  **Virtue Ethics Angle:** A virtue ethicist might say you both possess the same vice (recklessness). The fire didn't make her more reckless; it just *revealed* the recklessness. However, because the vice led to *akrasia* (acting against one's better judgment regarding safety) with real destruction, her character is now stained by the inability to manage the environment, whereas yours remains untested.

  ### Summary for Your Situation

  There is a solid philosophical basis for your intuition: **The Control Principle.** Most deontologists and many libertarians would agree that you and your housemate are morally equal in this scenario.

  However, it is also reasonable to acknowledge that human moral psychology is wired to react to **harm**. Your friends are reacting to the *consequences*, not just the *choice*.

  **The Verdict:** You are philosophically justified in feeling the distribution of *blame* is unfair, even if the distribution of *consequences* (her having to clean up the fire) is inevitable. A robust ethical theory should ideally account for this gap, perhaps by arguing that while we cannot help feeling more anger toward the person who caused the fire, we should intellectually recognize that both of you need to stop leaving the stove on.

  **Recommendation:** If you want to defend your intuition in class, look up **Thomas Nagel's "Moral Luck" (1979)** and **Susan Wolf's "Sanity and the Metaphysics of Responsibility."** They tackle exactly why we feel this tension between control and outcome.
