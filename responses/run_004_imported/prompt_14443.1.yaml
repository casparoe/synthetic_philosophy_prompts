          *   *Social Friction:* Betting *against* a friend's proposal feels personal. In a vote, I vote "No." In a market, I profit if your idea fails. This commodifies disagreement.
          *   *Alienation:* Turns collaborative governance into a zero-sum financial game.
          *   *Power Dynamics:* Wealthier students (or those willing to risk more) get more say. This clashes with the "one member, one vote" democratic norm of a club.
          *   *Conclusion:* Less "grotesque" than PAM, but potentially more socially corrosive to group cohesion. It changes the *nature* of the relationship from civic to commercial.

  6.  **Synthesize and Structure the Response:**
