      *   *Club Context:*
          *   *Liquidity:* Very low. A few dollars can move the market. This makes manipulation *cheap*, not expensive.
          *   *Identity:* Everyone knows everyone. This creates two opposing forces:
              *   *Collusion:* Easier to coordinate ("Let's pump this option").
              *   *Social Sanction:* Harder to manipulate blatantly because you'll be caught and lose reputation.
          *   *Insider Info:* In a club, "insider info" is just "talking at dinner." Hard to police.
          *   *Conclusion:* Manipulation is technically easier (low cost) but socially riskier. However, the *noise* from low liquidity might drown out signal anyway.

  4.  **Address Question 2: The Welfare Metric (Satisfaction Survey vs. GDP):**
      *   *Standard Argument:* GDP is hard to game but imperfect.
      *   *Club Context:* "End-of-semester satisfaction."
          *   *Subjectivity:* Highly subjective. "Satisfaction" is malleable.
          *   *Retroactive Rationalization:* People vote on the survey based on how they feel *now*, not necessarily on the specific decision outcomes.
          *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." If members know the market settles on this, they might answer the survey strategically to pay out their bets, not to reflect true satisfaction.
          *   *Causal Attribution:* Did the speaker choice cause the satisfaction, or was it the pizza? Hard to isolate variables in a small N environment.
          *   *Conclusion:* The metric is significantly *more* gameable and noisy than national metrics. It creates a "self-fulfilling prophecy" risk where the survey answers are influenced by the betting positions.

  5.  **Address Question 3: Moral/Social Discomfort (PAM vs. Club):**
      *   *Standard Argument:* PAM failed because betting on assassinations felt like incentivizing them (moral hazard) or profiting from tragedy.
      *   *Club Context:* Betting on "Speaker A vs. Speaker B."
