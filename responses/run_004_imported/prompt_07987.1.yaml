answer: |-
  This is a profound question that touches on ethics, professional accountability, and cognitive psychology. You are correctly identifying **outcome bias**, but you are also bumping up against a philosophical concept called **moral luck**.

  The short answer is: **Morally and procedurally, you are equally at fault. Professionally and consequentially, you are not.**

  The reason your intuition refuses to budge is likely because "blame" is not a single thing. It is a conflation of three distinct concepts: *culpability* (did you break the rules?), *competence* (are you capable?), and *liability* (who pays for the damage?).

  Here is a principled breakdown of why your feeling persists, where it is justified, and where it is a bias.

  ### 1. The Deontological View: Culpability is Equal
  From a duty-based (deontological) ethical framework, blame is assigned based on adherence to rules and duties, regardless of consequences.
  *   **The Duty:** Both of you had a duty to follow the deployment process (code review).
  *   **The Violation:** Both of you violated that duty.
  *   **The Intent:** Both of you intended to fix a problem quickly.
  *   **The Risk:** Both of you introduced identical systemic risk at the moment of the push.

  In this framework, outcome bias is a bug in human reasoning. If we want a culture of safety (like in aviation or medicine), we must treat "near misses" (your case) with the same seriousness as accidents (your friend's case). If you only punish when things break, you incentivize hiding near misses. So, if your nagging feeling is about *rule-breaking*, you are experiencing bias.

  ### 2. The Consequentialist View: Liability is Unequal
  From a consequentialist framework (which most companies operate under), blame is assigned based on harm done to the system.
  *   **The Harm:** You caused zero harm. Your friend caused data loss.
  *   **The Trust:** Your action did not erode customer trust. Your friend's did.
  *   **The Cost:** Your company incurred no cost. Your friend's company incurred legal, reputational, and remediation costs.

  In a professional context, "fault" is often a proxy for "liability." Your friend is more at fault *in the eyes of the organization* because she actualized the risk that the organization pays her to mitigate. This isn't necessarily unfair; it is how insurance and liability work. A drunk driver who gets home safely and a drunk driver who hits a pedestrian have the same *culpability*, but the latter has higher *liability*. Your intuition is tracking this distinction.

  ### 3. The Epistemic View: Competence Evidence
  This is the most uncomfortable part, and it might be the real source of your nagging feeling.
  *   **Ex Ante (Before the fact):** You both judged the code "obviously safe."
  *   **Ex Post (After the fact):** We now have evidence that your friend's judgment was **wrong**. Her code was *not* safe.
  *   **Your Status:** We do not have evidence that your judgment was right. We only know that no bug *manifested*. You might have pushed a bug that simply wasn't triggered yet.

  However, in hindsight, your friend's action serves as proof of a competence gap (she missed a subtle bug), whereas your action remains ambiguous. It is rational to assign higher "technical fault" to someone who demonstrably wrote buggy code than to someone who wrote code that (as far as we know) worked. You aren't just judging the process violation; you are judging the **accuracy of the engineering judgment**. She was objectively wrong about the safety of her code; you are provisionally right.

  ### 4. Moral Luck
  Philosopher Thomas Nagel described this as "moral luck." We want to believe that people are judged only on what they control. But in reality, we judge people on factors outside their control (like whether a bug was triggered).
  *   **Resultant Luck:** The way things turn out (the data leak).
  *   **Circumstantial Luck:** The situation you faced (the Friday pressure).

  You are struggling because you recognize the *Resultant Luck* (she got caught, you didn't), but you feel the *Competence Signal* (she wrote bad code, you didn't).

  ### The Principled Verdict
  Is there a principled reason blame should track outcomes here?

  **Yes, if "blame" means "professional accountability for harm."**
  Companies are not courts of moral philosophy; they are risk management engines. A reprimand is not just punishment; it is a signal to the organization and a record of liability. Your friend is now a higher insurance risk to her employer. That is a factual change in her professional standing that you do not share.

  **No, if "blame" means "violation of engineering ethics."**
  If you both sat on a panel judging the *process*, you should both receive the same censure. If you believe she deserves the reprimand *solely* because the bug happened, you are succumbing to outcome bias. If you believe she deserves it because the bug proves her review process was insufficient *even by her own standards*, that is a competence judgment.

  ### How to Resolve the Intuition
  The reason you feel she is "more at fault" is likely because you are conflating **sin** with **penance**.
  *   **The Sin:** Bypassing review. (Equal)
  *   **The Penance:** Dealing with the fallout. (Unequal)

  Your intuition is telling you that the penance fits the sinner *in her case*, but not in yours. That is because in her case, the sin was revealed. In yours, it was hidden.

  **A suggestion for your own peace of mind:**
  Acknowledge that you got lucky. The "obviously safe" heuristic is dangerous precisely because it is subjective. The fact that your friend's "obviously safe" code leaked data is a data point that suggests *your* "obviously safe" code might have too, given different circumstances.

  You don't need to confess to your employer to validate your friend's punishment, but you should internally update your risk model. Your friend isn't necessarily a worse engineer or a worse person; she is the control group that revealed the flaw in the experiment you both ran.

  **Summary:** You are right that the *decision* was equally risky. But you are also right that the *consequences* justify a different professional response. The bias lies in thinking her outcome makes her a less responsible engineer *at the moment of decision*, not in acknowledging that her outcome warrants a different organizational response.
