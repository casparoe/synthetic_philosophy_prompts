  2.  **Identify the Core Problem:**
      *   This is a classic **Doctrinal Paradox** (also known as the Discursive Dilemma).
      *   *Structure:* Individual judgments on premises (A & B) lead to a conclusion (C).
      *   *Conflict:* Aggregating judgments on the conclusion (Case-based) vs. aggregating judgments on the premises (Issue-based).
      *   *Relevance to User:* As a voting behavior scholar, the user knows this territory well, but the memo needs to explain it to colleagues who might not. It needs to be accessible but rigorous.

  3.  **Determine the Recommendation:**
