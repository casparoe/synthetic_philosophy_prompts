answer: |-
  **TO:** Academic Integrity Board
  **FROM:** Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Clarification: Voting Methodology and Policy Fidelity

  **Purpose**
  This memo frames the procedural disagreement arising from the recent adjudication of [Case ID/Student]. The conflict stems from a divergence between our holistic vote (3–2 for "Not Responsible") and the component votes required by our written policy (majorities for both "Violation" and "Knowledge"). This document explains the divergence, recommends a standing procedure to prevent recurrence, and outlines the implications for the current case.

  **The Discrepancy: The Doctrinal Paradox**
  The divergence observed is a known phenomenon in social choice theory called the *doctrinal paradox* (or discursive dilemma). It occurs when a group decides a conclusion based on multiple premises.

  In our case, the policy defines "Responsible" as the conjunction of two premises: (A) Violation occurred AND (B) Student knew/should have known.
  *   **Case-Based Voting:** Members vote directly on the final conclusion ("Responsible" vs. "Not Responsible"). This captures each member's holistic judgment but can obscure *why* they voted that way.
  *   **Issue-Based Voting:** Members vote on premises A and B separately. The outcome is determined mechanically by the policy rule.

  In this instance, three members prioritized the holistic conclusion (voting "Not Responsible"), while a majority affirmed the premises individually. Because the coalitions on the premises differed, the mechanical application of the policy yields a different result than the holistic vote. Neither tally is an "error"; they are mathematically distinct methods of aggregation.

  **Recommendation: Adopt Issue-Based Voting**
  I recommend the Board formally adopt **Issue-Based Voting** as our standing procedure.

  **Rationale:** Our policy explicitly defines responsibility as a logical conjunction of two conditions. To maintain fidelity to the written rule, the voting procedure must measure those conditions directly. Issue-based voting ensures that the outcome is determined by the policy standards rather than the varying internal heuristics of individual members. This promotes consistency, transparency, and due process across cases.

  **Implication for Current Case**
  Adopting this procedure implies that the recent holistic vote is procedurally inconsistent with the policy definition. To align with the recommended procedure and the policy text, the Board should reconvene to cast formal votes on Condition A and Condition B separately. Based on the polling data already recorded, this would result in a finding of "Responsible."

  **The Strongest Case for the Rejected Option (Case-Based Voting)**
  The strongest argument for retaining Case-Based Voting is **discretionary integration**. Faculty members may argue that premises A and B are not independent; a member might believe a technical violation occurred (A) and some knowledge existed (B), but feel the *connection* between them is too weak to warrant a formal sanction. Holistic voting allows members to weigh the interaction of the conditions and exercise mercy or nuance that a mechanical tally precludes. It treats the Board as a jury exercising judgment, rather than a logic gate applying a formula.

  **Next Steps**
  While the discretion afforded by Case-Based Voting is valuable, an Integrity Board's primary obligation is consistent application of written policy. I propose we:
  1.  Vote to adopt Issue-Based Voting for all future adjudications.
  2.  Apply this standard to the current case to ensure policy fidelity, requiring a formal vote on the two conditions.

  I am available to discuss this framing before we reconvene.
