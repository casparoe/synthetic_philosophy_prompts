answer: |-
  The progress bar on the screen was not a threat; it was a promise. It moved at a steady, rhythmic pace, estimating completion in twelve minutes. In the world before the Consensus, a bar like that would have been a joke, stretching into centuries. But that was Cryptomania, a fairy tale mathematicians told to comfort themselves.

  Elias watched the numbers count down. He didn't try to stop it. There was no point. In Pessiland, you cannot build a wall that cannot be climbed; you can only build a wall that requires the climber to bring a ladder. And everyone owns a ladder.

  "Twelve minutes," Mara said from the doorway. She wasn't angry. Anger required a violation of expectations, and they both knew the rules of physics in this universe. "That's how long it takes to undo a year of your obfuscation?"

  "Thirteen, if the network lags," Elias said. He kept his hands flat on the table. "The function isn't one-way, Mara. We know that. It's just... sticky."

  "Sticky," she repeated. She walked into the room, the light from the monitor catching the tired lines around her eyes. "You used a Grade-4 Concealment protocol on your correspondence. That's illegal for private citizens. You know the Inversion Tax applies."

  "I know."

  "So you knew I could find it. You knew *anyone* could find it."

  "I hoped you wouldn't want to."

  That was the tragedy of their world. In the old stories, the ones from the era of Heuristica, people believed that if you made a problem hard enough, it stayed hard. They thought they could hide behind mathematics. But the Proof had settled it: Average-case hardness existed, yes. You couldn't solve everything easily. Effort was real. Struggle was real. But *asymmetry* was dead. There was no trapdoor that only one person held the key to. If you could lock a box in an hour, a determined adversary could pick it in a day. If you could hide a message in a minute, a persistent analyst could recover it in ten.

  Privacy was not a state of being; it was a budget decision. To keep a secret, you had to outspend the curiosity of the world. And against a spouse, against a lover, the budget was infinite.

  Mara pulled up a chair and sat beside him. She watched the progress bar hit 60%. "What is it, Elias? An affair? A debt? A dissent?"

  "Does it matter? The content is irrelevant. The act of hiding is the crime."

  "In a transparent society, yes."

  "It wasn't about crime," Elias said, his voice tight. "It was about... interiority. I wanted a thought that was mine. Just one. I wanted to write something down and know that it wouldn't be processed, analyzed, or judged until I chose to show it."

  Mara looked at him, and for the first time, he saw the grief there. Not the anger of betrayal, but the exhaustion of Pessiland. "You can't have that, Eli. We don't live in Minicrypt. There are no secrets. There is only the time it takes to dig."

  "I know."

  "Then why?"

  "Because the digging takes *work*," he snapped. "That's the only freedom we have left! Hardness is real. If I make it hard enough, you have to *choose* to hurt me to find the truth. I wanted the barrier to be you. I wanted your love to be the only thing stronger than the inversion algorithm."

  The progress bar hit 90%. The fan on the server rack whirred louder, a physical manifestation of the computational effort required to peel back the layers. It wasn't instant magic. It was labor. The universe demanded energy to reveal what had been concealed. That was the only mercy Pessiland offered: the truth cost something to uncover.

  "You're asking me to carry the weight of your security," Mara said softly. "You're saying, 'I won't protect this with math, I'll protect it with your restraint.' That's not privacy, Elias. That's a hostage situation."

  "I didn't know how else to be human."

  The screen flashed green. *Inversion Complete.*

  The file opened. It wasn't a blueprint for a bomb, or a ledger of stolen credits. It was a journal. Entries dating back six months. Thoughts about his father's decline, about his fear of aging, about the moments he felt inadequate in their partnership. Raw, unpolished, vulnerable things.

  Mara read the first few lines. She didn't scroll further.

  "You wrote that you feel like you're disappearing," she said.

  "I am," Elias whispered. "In a world where everything I think can be inverted, I feel like I'm made of glass."

  Mara closed the file. She didn't delete it. Deleting it would just reset the clock; the backup shards were already in the cloud, recoverable with the same polynomial effort. Nothing was ever truly gone, only buried under the cost of retrieval.

  She reached out and took his hand. Her grip was firm, grounding.

  "In Cryptomania," she said, reciting the old lecture from their university days, "security relies on the assumption that certain problems are hard to solve. In Pessiland, we know that's false. We know that given enough time and resources, any disguise fails."

  "So what do we do?"

  "We stop trying to hide," she said. "And we stop trying to look."

  She stood up and walked to the server rack. She didn't unplug it. She didn't smash the drive. Instead, she opened the system settings and adjusted the priority queue. She lowered the priority of the inversion daemon. She made it so that uncovering Elias's secrets would still be possible, but it would take longer. It would cost more electricity. It would be an inconvenience.

  It wasn't security. It was a speed bump. But in a world without walls, a speed bump was the only boundary available.

  "I'm not going to read the rest," Mara said, turning back to him. "Not because I can't. But because I won't."

  "That's not enough," Elias said, though he leaned into her touch. "Eventually, you might want to. Or someone else will. The hardness is average-case, Mara. Someone might get lucky. Someone might find a heuristic that cuts the time down to seconds."

  "Then they will know," she said. "And we will deal with it. That is the deal, Elias. We live in the bleakest of the five worlds. We cannot hide. We can only endure the exposure."

  She kissed him, and it felt like a contract.

  In their world, mastery was real. You could still be a great artist, a great engineer, a great lover. But you could not be a secret keeper. Achievement was public property. Love was not a shield; it was a mutual agreement to stand naked in the light and trust the other person not to point out the scars.

  Elias looked at the screen, the green light pulsing softly. The secret was out. The hardness remained—the hardness of living with the truth, the hardness of forgiveness, the hardness of continuing when you knew you were permeable.

  "Twelve minutes," Elias said.

  "Yes," Mara replied. "But we have the rest of the night. Let's not spend it inverting."

  She turned off the monitor. The room went dark, save for the streetlights filtering through the glass walls of their apartment. There were no curtains. Curtains were an illusion, and they were tired of illusions. They sat together in the glow of the city, visible to everyone, hidden from no one, holding on to the only thing in Pessiland that couldn't be computed: the choice to stay.
