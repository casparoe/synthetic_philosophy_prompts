prompt: |-
  so I'm a logic PhD student but I've been sitting in on a metaphysics reading group this semester and we just got through Lewis's *On the Plurality of Worlds*. Got kind of stuck on the cardinality objection to genuine modal realism (Forrest and Armstrong, if I'm remembering the names right) and was hoping you could help me get an actual intuition for it, not just the formal statement. The rough idea: Lewis's principle of recombination seems to force there to be, for every cardinal number, a possible world with at least that many non-overlapping things in it. But there's no set of all the cardinals (thats basically just Cantor's paradox), so the worlds themselves can't form a set either -- they'd have to be a proper class -- wich apparently causes real trouble for how Lewis wants to quantify over "all the worlds" when he states truth conditions for modal claims. I can follow the bare set theory fine, that's kind of my home turf, but I don't have a gut feel for why this is supposed to be a deep problem for the metaphysics rather than just a technical glitch Lewis can patch up on the side. Can you talk me through why it's supposed to actually bite, and whether his fix (restricting recombination so it stops short of demanding worlds of every size) is a real cost for the theory or basically free? Feels like it should rhyme with the "absolute generality" debates in phil of logic but maybe I'm just pattern-matching.
