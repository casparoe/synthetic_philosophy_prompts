answer: |-
  Since you're a logic PhD, I can skip the CantorSchöderBernstein hand-holding. You know the math: if you have a Principle of Recombination that allows you to duplicate and rearrange parts of worlds freely, you can generate a world whose cardinality exceeds the sum of the cardinalities of all worlds. If worlds are sets (or have sets as domains), the collection of all worlds cannot be a set. It must be a proper class.

  The question is: **Why is this a metaphysical catastrophe for Lewis, rather than a mere annoyance for his model theory?**

  Here is the intuition for why it bites, followed by an assessment of the cost of his fix.

  ### 1. The Bite: Stability and the Completed Totality

  The deep problem isn't that Lewis can't write down a model structure $\langle W, R, D \rangle$ where $W$ is a proper class (you can do class semantics in NBG or MK). The problem is that it undermines the **reductive stability** of his modal analysis.

  Lewis wants to analyze modality in terms of the plurality of worlds:
  $$ \Diamond P \iff \exists w (P \text{ at } w) $$
  $$ \Box P \iff \forall w (P \text{ at } w) $$

  For this analysis to be reductive and explanatory, the RHS must be **determinate**. The truth value of modal claims must be fixed by the ontology.

  If the plurality of worlds is a proper class, it is arguably an **indefinitely extensible totality**. In the context of the Burali-Forti or Cantor paradoxes, proper classes often signal that the domain is not "finished." If the plurality of worlds is indefinitely extensible, then the domain of quantification for $\forall w$ is unstable.

  **The Intuition:** Imagine you assert $\Box P$. On Lewis's view, you are saying $P$ holds at every concrete world. But if the collection of worlds is a proper class generated by an open-ended principle (Recombination), it suggests that for any plurality of worlds you specify, there could be "more" worlds generated by applying Recombination to that very plurality.

  If the domain of worlds can expand, then a claim that was necessarily true (true at all *existing* worlds) could become contingently false (false at some *newly generated* world). This makes modality **temporal** or **contextual** relative to the growth of the ontology. Lewis is a modal realist precisely to avoid modal primitivism; he wants modality to be grounded in the static, concrete existence of the pluriverse. If the pluriverse itself is subject to an open-ended logical generation that outstrips its own bounds, the "necessity" he defines loses its absolute character.

  So, the bite is this: **If the worlds form a proper class, the "Necessary" becomes indeterminate.** It threatens to turn Modal Realism into a form of modal potentialism, which Lewis explicitly rejects.

  ### 2. The Forrest-Armstrong Specifics

  You recalled the names correctly. The specific argument (Forrest & Armstrong, 1984) leverages the **Principle of Recombination**: roughly, that anything can coexist with anything, provided they occupy distinct spatiotemporal positions.

  They argue:
  1.  Assume the worlds form a set $W$.
  2.  Let $\kappa$ be the cardinality of the sum of all individuals in all worlds in $W$.
  3.  By Recombination, we can take $\kappa^+$ distinct individuals (duplicates of existing ones) and arrange them in a single spatiotemporal system.
  4.  This forms a possible world $w^*$ with cardinality $\kappa^+$.
  5.  But $w^*$ cannot be in $W$ (since the sum of individuals in $W$ was only $\kappa$).
  6.  Contradiction.

  Lewis accepts the contradiction and denies (1). The worlds do not form a set.

  ### 3. Lewis's Fix and Its Cost

  Lewis's solution (in the postscript to *OPW* and subsequent replies) is to **restrict the Principle of Recombination**. He admits there is a bound on the size of possible worlds. There is some inaccessible cardinal (or similar bound) such that no world exceeds it.

  **Is this cost free?** No. It is metaphysically expensive for three reasons:

  **A. Violation of Humean Supervenience / No Necessary Connections**
  Lewis's metaphysics is deeply Humean. Distinct existences should be independent. There should be no *necessary* constraints on what can coexist, other than logical contradiction and spatiotemporal location.
  By imposing a cardinality bound, Lewis introduces a **necessary constraint on existence** that looks brute. Why *that* cardinal? Why can't there be a world with $\aleph_{\omega}$ electrons if there can be one with $\aleph_0$?
  To the intuition that drives Recombination ("patch things together however you like"), a size limit looks like an arbitrary metaphysical law. It concedes that there are necessary connections between distinct existences (namely, that the existence of too many distinct existences is impossible).

  **B. The "Missing Worlds" Problem**
  If there is a bound on world size, there are "combinations" that are logically coherent but metaphysically impossible.
  This creates a gap between **logical possibility** and **metaphysical possibility**. Lewis usually wants these to coincide (or at least, he wants his worlds to capture all genuine metaphysical possibilities).
  If a logician can consistently describe a world of size $\kappa_{bound} + 1$, but Lewis says "That world does not exist," Lewis has to explain why our modal intuitions about that case are wrong. He has to say, "You think it's possible, but you're mistaken; the pluriverse just isn't big enough." That weakens the theory's ability to track pre-theoretic modal intuition.

  **C. The Ad Hoc Nature**
  From a theoretical virtue standpoint, it looks like a patch. The Principle of Recombination was motivated by the idea that the pluriverse is rich enough to exhaust all possibilities. Restricting it to avoid a set-theoretic paradox looks like tailoring the metaphysics to fit the mathematics, rather than the other way around. It suggests the ontology is held hostage by ZFC.

  ### 4. Connection to Absolute Generality

  Your pattern-matching is spot on. This rhymes perfectly with the **Absolute Generality** debates (Williamson, Rayo, Uzquiano, etc.).

  The core question in that debate is: *Can we quantify over absolutely everything?*
  *   **The Restrictivist:** No. Any domain of quantification can be extended (e.g., by adding a new set, or in this case, a new world). "Everything" is context-sensitive.
  *   **The Absolutist:** Yes. There is a fixed domain of all objects.

  Lewis needs to be an **Absolutist about Worlds** to make his modal analysis work. He needs $\forall w$ to range over a fixed, completed totality. If he is forced into Restrictivism (because the worlds form a proper class and are indefinitely extensible), his analysis of $\Box$ becomes context-sensitive.
  *   "Necessarily $P$" would mean "True at all worlds *in this context/domain*."
  *   But in a different context (a larger domain of worlds), $P$ might be false.

  This is fatal for Lewis because he wants modal truths to be **eternal and absolute**. If the cardinality objection forces him into a restrictivist semantics for quantification over worlds, he loses the absolute nature of modality.

  ### Summary

  The cardinality objection isn't just a technical glitch because it threatens the **determinacy** of modal truth.

  1.  **The Bite:** If worlds form a proper class, the plurality is likely indefinitely extensible. If it is extensible, the domain of $\forall w$ is not fixed. If the domain is not fixed, $\Box P$ has no stable truth value. This collapses Modal Realism into Modal Potentialism.
  2.  **The Fix:** Lewis restricts Recombination to ensure the worlds form a set (or at least a bounded collection).
  3.  **The Cost:** It introduces brute, necessary constraints on cardinality (violating Humean independence) and creates a gap between logical consistency and metaphysical possibility. It forces Lewis to tell modal intuitions to "shut up" regarding large cardinalities.

  It is a significant cost because it requires Lewis to abandon the very "liberal" spirit of Recombination that made the theory attractive in the first place, solely to save the set-theoretic coherence of the quantification. It shows that his ontology is constrained not by metaphysical insight, but by the limitations of ZFC—a hard pill for a realist to swallow.
