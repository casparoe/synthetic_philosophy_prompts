          3.  Identify any missing moves/arguments.
          4.  Provide a bottom-line verdict for the response paper (Defensible reading vs. Motivated reasoning).
      *   **Tone:** Academic, nuanced, peer-to-peer (acknowledging the PhD level), but accessible. Avoid taking sides too rigidly; focus on the strength of the *arguments*.

