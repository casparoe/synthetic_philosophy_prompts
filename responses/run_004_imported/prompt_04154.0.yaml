      *   **Move 2 (Colin):** Textualism/Original Public Meaning (sort of). Framers' private shame vs. public text. Text doesn't say "slave." Courts applied it one way, but that's the "Government," not the "Constitution."
          *   *Analysis:* Strong theoretical distinction (law vs. practice). Weakness: Ignores that legal meaning *is* often determined by application and contemporary understanding. The "Government/Constitution" split is a bit rhetorical.
      *   **Move 3 (Nadia):** Selective Interpretation/Inconsistency. Douglass uses Preamble (purpose) when helpful, ignores contemporary understanding of specific clauses when not. Cherry-picking tools.
          *   *Analysis:* This is the strongest critique of Douglass's *method*. It attacks internal consistency.
      *   **Move 4 (Colin):** Hierarchy of Sources. Ratified text (Preamble) > Unratified private notes (Madison). Public purpose vs. private intent.
          *   *Analysis:* Solid legal theory point. Madison's notes weren't public until later. The Preamble *is* part of the text.
