      *   *Move 3:* Nadia lands a heavy blow here. This is the "instrumentalism" critique. If Douglass uses purpose for the Preamble but rejects purpose for the Fugitive Slave Clause, is he consistent? Colin needs to answer this.
      *   *Move 4:* Colin recovers. He distinguishes between *enacted* purpose (Preamble) and *unenacted* intent (Notes). This is a standard legal move (Scalia would nod). It defends against the "cherry-picking" charge.
      *   *Move 5:* Nadia delivers the knockout punch regarding *meaning*. Meaning is socially constructed. If 99% of readers (including the author previously) read it as pro-slavery, can it objectively be anti-slavery? This challenges the "reasonable reader" standard Colin relies on.

  4.  **Address Specific Questions:**
      *   *Colin's Consistency (Move 3):* Is he consistent? He relies on a hierarchy of textual authority. Preamble = Text. Convention Notes = Extrinsic Evidence. So yes, internally consistent *if* you accept that hierarchy. But does Douglass apply that hierarchy consistently?
      *   *Nadia's Move 5:* Is it just a headcount? No, it's "Original Public Meaning." It argues that meaning is fixed by contemporary understanding, not modern rediscovery.

  5.  **Identify Missing Moves:**
      *   *The "Higher Law" Argument:* Douglass isn't just doing legal exegesis; he's invoking natural law.
