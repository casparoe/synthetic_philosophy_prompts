answer: |-
  This is a crisp, well-structured distillation of a complex debate. You have managed to capture the dialectical tension between Bratman and Gilbert without getting bogged down in the minutiae of their respective conditions for shared intention. As an interlocutor for a metaphysics workshop, I find the argument compelling, but I have specific feedback on your three questions that might help you fortify the section against potential pushback.

  ### 1. Representation of Bratman's Interdependence Move
  **Verdict: Fair, but requires a slight terminological nuance.**

  You have not constructed a straw man. You correctly identify that Bratman's later work (particularly *Shared Agency*, 2014) attempts to accommodate normative consequences without abandoning reductivism. Your characterization of his move as delivering a complaint about "impaired self-governance" rather than a "debt owed" is the standard and strongest Gilbertian critique.

  However, to bulletproof this against a Bratman defender, consider this nuance: Bratman does explicitly use the language of "obligation" (e.g., "mutual obligations of shared intention"). He argues that these obligations arise from the *norms of planning agency* (consistency, stability, means-end coherence) once those plans are interlocked and common knowledge.

  **Suggestion:** You might strengthen the paragraph by acknowledging that Bratman *calls* them obligations, but insisting that the *ground* of those obligations remains within the sphere of individual rationality. Your current phrasing ("complaint about impaired self-governance") does this well, but you could make it sharper: *"Bratman may label these 'obligations,' but their normative force is derived from the requirements of individual diachronic stability, not from an interpersonal bond."* This pre-empts the reply that you are ignoring his explicit talk of obligation.

  ### 2. The Wardrobe Case
  **Verdict: Effective, but carries a specific risk.**

  The wardrobe case is Gilbert's paradigmatic example, so using it signals fidelity to the literature. It effectively illustrates the *cost* of abandonment and the *interdependence* of the action.

  **The Risk:** The wardrobe case involves physical risk and potential property damage. A reductionist could argue that the standing to rebuke arises not from the *shared intention* itself, but from the **harm principle** or tort-like norms. If I let go, I might injure you or break the wardrobe. The obligation to not let go could be modeled as a standard moral obligation not to harm, which *is* reducible to individualistic moral norms.

  **Suggestion:** To isolate the *metaphysics of shared agency* from general morality, consider a "low-stakes" example where no harm occurs, yet the normative standing remains.
  *   **The Duet:** If we are singing a duet and I stop singing mid-phrase without warning, I haven't harmed you physically, nor damaged property. Yet, you still have the standing to rebuke me ("You can't just stop!"), and I cannot unilaterally end the duet.
  *   **Walking Together:** If we are walking together to the station and I veer off without a word, I violate our shared intention, even if you suffer no setback interest.

  Using a case like this sharpens the contrast: it shows that the "debt" is internal to the joint activity, not external (based on harm). If you stick with the wardrobe, add a clause specifying that the mover who lets go ensures the wardrobe is safely rested before abandoning the task, yet the partner still feels wronged. This isolates the *abandonment of the jointness* from the *risk of harm*.

  ### 3. Principled Limit vs. Contingent Shortfall
  **Verdict: This is the strongest part of your argument, but it needs to distinguish Intention from Promise.**

  You argue that this is a principled limit on *any* individual-attitude-based account (including Searle). This is philosophically sound. If the ontology is restricted to states individuated by the individual subject (even if the *content* is "we-J"), the *normative binding* between subjects remains mysterious. As you note, Searle's "we-intentions" are still in the head of the individual; I can change my we-intention unilaterally just as I can change an I-intention.

  **The Potential Counter-Argument:** A resourceful reductionist (like Bratman) might concede that shared *intention* alone doesn't generate the obligation, but argue that shared intention plus **communication** does. They might say: "Once I tell you I intend that we J, and you rely on that, I have created a promise-like obligation via standard individualistic norms of reliance."

  **How to Secure Your Conclusion:** To ensure your argument earns the conclusion that this is a *principled limit on individual-attitude accounts*, you need to close the "reliance" loophole. You hint at this with the phrase "smuggling in the non-reductive result." Make this explicit.
  *   Argue that for the reliance to generate a *directed* obligation (owed *to you*), the reliance must be **invited and guaranteed** in a way that individual intentions cannot guarantee.
  *   Individual intentions are inherently revocable by the agent. To make them irrevocable without the other's consent requires a change in *status* (from individual to plural), not just a change in *content* or *interdependence*.

  If you make this step explicit, you successfully argue that no amount of interlocking individual states can generate the *joint* authority required to release the other from the undertaking. That authority implies a subject ("the us") that holds the rights, which individualism cannot locate.

  ### Overall Verdict: Does the argument earn its conclusion?

  **Yes.** The logic flows validly:
  1.  Shared agency involves specific normative features (directed obligation, standing to rebuke, joint authority to rescind).
  2.  Individualistic accounts (Bratman, Searle) ground these features in individual states (even if interdependent).
  3.  Individual states can only generate requirements of rationality or self-governance, or obligations derived from harm/reliance.
  4.  Therefore, individualistic accounts cannot ground the specific normative features of shared agency without smuggling in a non-reductive premise.

  **Final Polish:**
  To make this publication-ready for a workshop:
  1.  **Clarify the "Smuggling" Charge:** Explicitly state that treating "entitlement to rely" as a brute fact within a reductive framework begs the question against Gilbert.
  2.  **Refine the Example:** Either modify the wardrobe case to remove the harm element or switch to a Duet/Walking case to ensure the normativity is purely agential.
  3.  **Tighten the Searle Extension:** Briefly mention that Searle's collective intentionality is still *individually possessed*, so it falls prey to the same "unilateral revocability" problem.

  This is a solid piece of theoretical groundwork. It correctly identifies the "Normativity Gap" as the metaphysical fault line between the two camps. With the minor adjustments above, it will be robust enough to withstand workshop scrutiny.
