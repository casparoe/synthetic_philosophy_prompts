answer: |-
  This is an excellent question that cuts to the heart of Augustine's deontological ethics. You are right to sense that the move from "lying" to "adultery" is not merely rhetorical flourish, but nor is it a simple syllogism. It is a *reductio ad absurdum* designed to test the consistency of a consequentialist principle.

  Here is a reconstruction of the argument's missing premises, an analysis of the role of Romans 6:13, and an assessment of its efficacy against the specific objection regarding "blasphemy."

  ### 1. Logical Reconstruction of the Argument

  To see the missing step, we must formalize the principle Augustine attributes to Consentius (and the Priscillianist-sympathizing Catholics).

  *   **Premise 1 (The Opponent's Principle):** An act that is typically forbidden ($A$) is permissible if performed with the intention of achieving a specific greater good ($G$), specifically the exposure of heresy.
  *   **Premise 2 (The Classification):** Lying about one's faith to heretics is an act typically forbidden ($A_1$).
  *   **Premise 3 (The Parity of Reasoning):** If the *sole* justification for permitting $A_1$ is the attainment of $G$, then $G$ must be a sufficient justification to permit *any* act typically forbidden ($A_n$), provided $A_n$ is effective in attaining $G$.
  *   **Premise 4 (The Analogy/Intuition Pump):** Adultery is an act typically forbidden ($A_2$). In the hypothetical scenario, committing adultery would be effective in attaining $G$ (exposing heretics).
  *   **Premise 5 (The Moral Intuition):** It is impermissible to commit adultery to attain $G$. (Consentius would agree here).
  *   **Conclusion:** Therefore, it is impermissible to lie to attain $G$.

  **The Missing Step:** The crucial premise you are looking for is **Premise 3**. Augustine is arguing that if you ground the exception in the *consequence* (catching heretics) rather than the *nature of the act*, you detach the moral permission from the specific act-type. Once the moral weight rests entirely on the outcome, the specific nature of the means becomes irrelevant, provided the means are effective.

  Augustine entitles himself to treat them as parallel not because lying and adultery are ontologically identical, but because the **justificatory structure** proposed by his opponents renders them identical. If the end justifies the means, the "means" are fungible.

  ### 2. The Role of Romans 6:13 and the "Members" Argument

  You ask if Augustine is tacitly relying on the claim that no bodily or verbal member may be pressed into an intrinsically forbidden act. **Yes, but with a specific nuance.**

  In *Contra Mendacium*, Augustine is developing a theology of the "instruments of righteousness." For Augustine, the body (including the tongue) is not the private property of the agent to be used for utility; it is a temple of the Holy Spirit.
  *   **The Covert Premise:** Sin is not defined primarily by the damage done to a neighbor (the modern liberal view), but by the disorder introduced into the soul and the offense against God's order.
  *   **The Interchangeability:** The tongue and the genitals are both *membra* (members). If one argues that the tongue can be sinfully used for a righteous end, one must logically argue that the genitals can be as well.

  **Does the analogy do independent work?**
  It does more than restate the conclusion; it functions as a **heuristic device**.
  1.  **Bypassing Intellectualization:** Consentius and his cohort had likely intellectualized lying. They viewed it as a "tactical necessity." By shifting the locus to adultery, Augustine moves the discussion from the intellect to the *conscience*. In Late Antiquity, sexual purity was a more visceral, less negotiable absolute for Christians than verbal precision.
  2.  **Testing the Absolute:** It forces the opponent to admit that there *are* some acts (adultery) that cannot be justified by good consequences. Once they admit *one* absolute prohibition that holds even against the good of the Church (exposing heretics), they lose the principle that "the good of the Church overrides moral norms." Augustine then asks: *Why is the tongue different from the loins?*

  So, the analogy is not a proof in itself, but a **consistency check** on the opponent's moral framework.

  ### 3. Assessment Against the "Blasphemy" Objection

  You raise a potent objection: *What if the interlocutor denies that deceiving a heretic counts as "blasphemy"?*

  If the opponent argues, "This is not blasphemy; it is merely strategic ambiguity or concealment," Augustine's specific label in this passage ("mouth committing fornication in blasphemy") loses some grip. However, the argument can survive this objection if we reconstruct Augustine's definition of lying.

  **Augustine's Definition:** For Augustine, a lie (*mendacium*) is not just a false statement; it is a false statement *with the intention to deceive* (*fallendi voluntate*). When the question concerns faith, to deny the truth is to deny God. Therefore, to lie about faith is necessarily to blaspheme, regardless of the intent.

  **If the Opponent Denies This:**
  If the opponent says, "I am not blaspheming; I am merely hiding my allegiance," Augustine would argue:
  1.  **The Object of the Act:** The moral object of the act is "asserting falsehood about God." The intention (to catch heretics) is circumstantial. You cannot change the moral species of the act (blasphemy) by adding a good intention.
  2.  **The Analogy Holds Regardless:** Even if we strip the word "blasphemy" and simply call it "Lying," the analogy with Adultery remains potent.
      *   *Opponent:* "It's not adultery; it's strategic intercourse for the good of the Church."
      *   *Augustine:* "The physical act is intrinsically disordered regardless of the intent."
      *   *Opponent:* "It's not lying; it's strategic speech for the good of the Church."
      *   *Augustine:* "The verbal act is intrinsically disordered regardless of the intent."

  **Where the Argument Might Fail:**
  The argument succeeds only if the interlocutor accepts **Deontological Constraints**.
  *   If the interlocutor is a pure Act Utilitarian, they will simply bite the bullet and say, "Yes, if sleeping with the heretic truly saved the Church and caused no net harm, it would be permissible." Augustine's argument cannot refute a pure utilitarian; it is designed to refute a *Christian* utilitarian who wants to maintain some absolute norms while carving out exceptions for "emergency" situations.
  *   The argument relies on the interlocutor sharing the intuition that adultery is *malum in se* (evil in itself). If they view adultery as *malum prohibitum* (evil because prohibited, but overrideable), the parity of reasoning collapses.

  ### 4. Summary for Seminar Discussion

  For your seminar, I suggest framing the missing step as the **Principle of Moral Consistency regarding Intrinsic Evil.**

  1.  **The Gap:** The gap is the assumption that moral norms regarding the *use of the self* (one's body and speech) are categorical, not hypothetical.
  2.  **The Function:** The adultery analogy is not an equation of the *gravity* of the sins (Augustine likely views blasphemy as graver than adultery), but an equation of the **logic of exception**.
  3.  **The Verdict:** The argument succeeds against Consentius because Consentius *already agrees* that adultery is impermissible regardless of consequences. Augustine traps him in his own deontology. It fails against a modern consequentialist who does not share the intuition about adultery.
  4.  **The "Blasphemy" Nuance:** If a student objects that "lying about heresy isn't blasphemy," press them on Augustine's definition of truth. For Augustine, Truth is a Person (Christ). To speak against the Truth to protect the Truth is a contradiction in terms, akin to committing adultery to protect marriage. The analogy holds because both acts destroy the very virtue they claim to protect (Truth/Chastity) in the agent himself.

  Augustine's point is ultimately anthropological: You cannot cultivate a virtue (protecting the Church) by practicing a vice (lying/adultery), because the act forms the soul of the agent. To make the tongue an instrument of falsehood is to damage the soul, regardless of the external outcome. The adultery analogy makes this spiritual damage visceral.
