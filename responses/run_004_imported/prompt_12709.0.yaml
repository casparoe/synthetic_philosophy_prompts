answer: |-
  **MEMORANDUM**

  **TO:** Saving Wildcat Project Steering Committee
  **FROM:** External Advisory Panel
  **DATE:** 15 October 2023
  **SUBJECT:** Recommendation Regarding Founder Cohort Scoring Thresholds

  **Executive Summary**
  The Advisory Panel has reviewed the scoring data for the proposed spring breeding cohort. We note a statistical clustering of four founder candidates near the current eligibility threshold, where minor variations in scoring separate inclusion from exclusion. To balance genetic viability with program integrity, the Panel recommends **suspending the binary cutoff for this cohort in favor of a "Provisional Founder" classification.** This allows the borderline individuals to enter the breeding pool under strict monitoring, while initiating a scheduled review of the threshold methodology by Q4 2024.

  **The Challenge of Binary Thresholds**
  The current protocol treats the wildcat-domestic hybridization spectrum as a binary state (eligible/ineligible). However, biological reality and measurement error create a "zone of uncertainty" around any numerical cutoff. When candidate scores cluster tightly within this margin of error, enforcing a hard line creates a false precision. 

  We must address the concern that adjusting eligibility undermines the program's integrity. We argue the opposite: **rigid adherence to a threshold in the face of statistical noise is more damaging to scientific credibility than acknowledging uncertainty.** If the program excludes genetically vital animals based on negligible score differences, we risk prioritizing administrative convenience over biological reality. Integrity is maintained not by refusing to adapt, but by transparently defining *how* and *when* adaptations occur.

  **Genetic Imperative**
  The risk of inbreeding depression in a small founder population is immediate and irreversible. The loss of allelic richness from excluding two high-value candidates outweighs the marginal risk of increased domestic admixture, provided that offspring are rigorously screened. In a captive breeding context, we have the luxury of time and testing that release decisions do not afford. We can afford to breed "provisional" cats and cull offspring that show regression; we cannot recover lost genetic diversity once it is excluded from the pool.

  **Recommendation & Protocol**
  1.  **Adopt a Tiered Classification:** Replace the binary "In/Out" with three classes: *Confirmed Wildcat*, *Provisional Founder*, and *Excluded*. The four clustered candidates are designated *Provisional Founders*.
  2.  **Conditional Breeding:** *Provisional Founders* may breed, but all offspring must undergo genomic sequencing at 6 months. Only offspring meeting the stricter *Confirmed* criteria will be eligible for future release or outcrossing.
  3.  **Methodology Review:** The Genetics Subcommittee is tasked with presenting a revised threshold model (potentially probabilistic rather than absolute) by October 2024 to prevent recurrence.

  **Timeframe**
  This recommendation is effective immediately for the upcoming spring pairing. The *Provisional* status applies only to the current founder intake; future cohorts will operate under the revised methodology scheduled for review next autumn.

  **Conclusion**
  This approach safeguards the genetic future of the population without compromising the public definition of a wildcat. It acknowledges that conservation is a management discipline, not just a classification exercise. By treating the threshold as a tool rather than a law, we protect both the cats and the program's long-term legitimacy.

  **Signed,**
  **External Advisory Panel**
