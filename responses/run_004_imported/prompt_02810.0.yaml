      *   **Conflict:** User paid the full amount promised. Postdoc argued for paying less (only a tip) based on pragmatic/selfish reasoning (no enforcement, no future interaction).
      *   **Question:** Was the postdoc actually smart, or is there a flaw in that reasoning? Why does the user feel paying was right, even if they can't articulate it philosophically?
