      *   **Garrison's Rebuttal (The Union):** The moral cost of participating in a government that enforces slavery. Disunion as a moral witness.
      *   **Douglass's Closing (The Stakes):** Abandoning the enslaved to fight for purity. The need to wield the weapon, not break it.

