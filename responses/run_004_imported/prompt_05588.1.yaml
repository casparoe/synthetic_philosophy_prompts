answer: |-
  **Rochester, New York. November 1851.**

  The office of *The North Star* was cold, the stove barely holding back the draft. William Lloyd Garrison stood by the window, holding a copy of the Constitution as one might hold a dead bird. Frederick Douglass sat behind his desk, his hands clasped tight, knuckles white.

  "You ask me to swear an oath to support this instrument," Garrison said, not turning from the glass. "You ask me to tell the man in chains that the very document which sanctions his hunting is a charter of liberty."

  "I ask you to read what is written, William, not what was whispered in Philadelphia," Douglass replied. "The word 'slave' is not in it. The word 'slavery' is not in it. It speaks of 'persons.' It speaks of 'service.' If the law presumes every man is free unless proven otherwise, then the Constitution, rightly administered, is a sword for the bondman, not a shield for the master."

  Garrison turned, his eyes blazing behind his spectacles. "Euphemism does not absolve sin. If I strike a man and call it 'correction,' the blood is still on my hand. Look at the third article. 'No person held to service or labor in one state... escaping into another, shall be discharged from said service.' It is a net for catching men. And the first article? Three-fifths of a man. They counted him as a fraction to bolster the slave power's representation in Congress. How is that anti-slavery?"

  "It is a penalty on the slave states," Douglass countered, leaning forward. "By counting him as less than a whole, they reduced the total representation. But more importantly, you conflate the *intent* of the framers with the *text* of the law. The framers were compromised men. But the text they left us? It contains no guarantee of property in man. Natural law presumes liberty. The Constitution must be read in the light of that natural law, not the dark corners of the framers' compromises."

  "The courts do not read natural law, Frederick. They read power," Garrison snapped. "And the power of this Union is the power of the slaveholder. The Fugitive Slave Act is not an aberration; it is the fruit of the tree. If you remain in the Union, you are complicit. You vote for men who will enforce the capture of your own brothers. I say, 'No Union with Slaveholders.' Let the North sever the tie. Let us wash our hands of the blood."

  "And leave the South to its fate?" Douglass stood, his height filling the room. "If we dissolve the Union, the slave states become a separate nation. No longer bound by any pretense of liberty. They will entrench slavery forever, with no Northern voice to argue against it in Congress, no Northern courts to hear habeas corpus. You would sacrifice the slave to save your own conscience."

  "I would not have my conscience be a graveyard," Garrison said, his voice dropping, hard as iron. "Complicity is a slow poison. You say the text is clean. I say the structure is rotten. To vote within this system is to acknowledge its legitimacy. It tells the slave, 'Wait. Wait for the ballot. Wait for the court.' While the whip falls today."

  "The whip falls because the law allows it!" Douglass slammed his hand on the desk. "I do not tell him to wait. I tell him the law is on his side if we have the courage to claim it. You burn the Constitution because it is a covenant with death. I say we seize it. We turn the three-fifths clause against them. We demand the rights of citizens. We use the mail, the courts, the Congress. To abandon the political ground is to surrender the field to the enemy."

  Garrison walked to the desk and laid the Constitution down. "You speak of political ground. I speak of moral ground. There is no middle path. You cannot serve two masters. Either the Constitution is a pro-slavery compact, as its enforcement proves, or it is a lie. If it is a lie, why swear to it? If it is a compact, how can you call it holy?"

  Douglass picked up the document. He did not look at the pages, but at Garrison. "It is not holy, William. It is a tool. A hammer can build a house or break a skull. You would smash the hammer because the master holds it. I intend to pry the handle from his grip and build a house for the free."

  "And if the handle breaks?" Garrison asked quietly. "If the wood is rotten through?"

  "Then we will know," Douglass said, opening the book. "But we cannot know until we strike. I will not tell the slave that America has no place for him. I will tell him that America belongs to him, if he can claim it. And I will need every voice, even yours, to make that claim heard."

  Garrison adjusted his coat, the fire in his eyes dimming to a somber resolve. "I cannot vote. I cannot swear. But I will not silence you, Frederick. God knows, I pray you are right. For if you are wrong, the Union is not just a political error. It is a sin."

  "And if you are wrong," Douglass replied, closing the book with a heavy thud, "then disunion is not a witness. It is an abandonment."
