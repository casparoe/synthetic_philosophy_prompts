answer: |-
  This is a fascinating counterfactual intersection of mid-century analytic naturalism and contemporary metaethics. To speculate on how Quine would respond to Sharon Street, we must first recognize that Street's "Darwinian Dilemma" is designed primarily as a trap for the *moral realist*—specifically, the robust realist who posits mind-independent normative truths.

  Quine, however, was not a moral realist. In "On the Nature of Moral Values," he explicitly withholds ontological commitment from moral properties. Therefore, Quine would not encounter Street's essay as a problem to be solved, but rather as a sophisticated naturalistic vindication of a position he already held. He would likely view the dilemma not as a skeptical threat to be neutralized (as Street does for her own constructivist view), but as a descriptive confirmation of the genealogy of moral sentiment.

  Here is the reasoning Quine would likely employ, structured around his core doctrines of indispensability, naturalized epistemology, and the distinction between cognitive and non-cognitive discourse.

  ### 1. The Indispensability Filter: Why Math Survives and Ethics Does not
  The core of Quine's ontology is the indispensability argument: we are committed to the existence of those entities that are indispensable posits of our best scientific theories. Mathematics earns its keep because we cannot formulate physics without quantifying over sets and numbers.

  Quine would argue that Street's dilemma highlights exactly *why* moral properties fail the indispensability test.
  *   **Scientific Formulation:** We can formulate our best theories of human biology, psychology, and sociology without positing "objective moral values" as causal agents. We need genes, neural pathways, and environmental pressures. We do not need "The Good" to explain why a mother protects her child; evolutionary theory suffices.
  *   **The Verdict:** Quine would see Street's "Adaptive Link Account" not as a challenge to justification, but as the correct *scientific explanation* of moral discourse. For Quine, if a posit (like a moral fact) is not needed to explain the phenomena (including the phenomenon of people *making* moral claims), it is ontologically superfluous.
  *   **Rejection of Companions-in-Guilt:** Quine would firmly reject any attempt to pair moral values with mathematical objects. Math is indispensable to the *structure* of natural science; moral values are not. Therefore, the epistemological worries that plague moral realism (highlighted by Street) do not infect mathematics. The "guilt" is not shared.

  ### 2. Naturalized Epistemology and the Lack of Checkpoints
  Quine's naturalized epistemology treats knowledge as a web of belief that faces the "tribunal of experience." A key criterion for a sentence having cognitive content (being truth-apt) is its connection to sensory stimulation and its role in predicting future experience.

  In "On the Nature of Moral Values," Quine argues that moral discourse lacks the "intersubjective checkpoints" of science. In science, if two observers disagree, there is a procedure (experimentation, observation) to settle the dispute. In ethics, disputes often end in a clash of sentiments or a failure of nurture.

  *   **Response to Street:** Quine would argue that Street's dilemma arises because realists try to treat ethics *as if* it were science (i.e., as if it were tracking independent facts). Street shows that this tracking is implausible given evolution.
  *   **Quine's Move:** Quine would go further. He would argue that the lack of a "tracking" relationship isn't just an evolutionary accident; it's a category mistake. Moral sentences do not function to track facts; they function to coordinate behavior and express sentiment.
  *   **Dissolving the Dilemma:** Street asks, "How can we justify our values if they are evolved?" Quine would reply, "Justification in the scientific sense doesn't apply here." For Quine, the "justification" of a moral norm is pragmatic: does it foster social cohesion? Does it minimize suffering? These are empirical questions (sociological/psychological), not normative discoveries. He would likely view Street's attempt to save normativity through constructivism as still too beholden to the idea that there is a "correct" answer to be found, whereas Quine sees ethics as a matter of *engineering* social life, not discovering its laws.

  ### 3. Non-Cognitivism vs. Error Theory
  Would Quine be an error theorist (moral statements are truth-apt but false) or a non-cognitivist (moral statements are not truth-apt)?

  *   **Deflationary Truth:** Quine is a deflationist about truth ("true" is just a device for disquotation). However, disquotation applies to sentences that have cognitive content.
  *   **The Status of Moral Sentences:** In "On the Nature of Moral Values," Quine suggests that moral sentences have a "categorical" tone but lack the cognitive backing of scientific sentences. He writes that moral principles are "in principle" open to revision based on their efficacy in promoting human welfare, but they are not "discovered."
  *   **The Likely Position:** Quine would likely lean toward a sophisticated **non-cognitivism** or **pragmatic instrumentalism**. He would not say moral statements are *false* (Error Theory), because that grants them a propositional status they don't earn. Instead, he would say they are expressions of sentiment that have been grammatically disguised as facts.
  *   **Reasoning:** If Street shows that our moral dispositions are shaped by survival rather than truth-tracking, Quine would say this confirms that the *function* of moral language is not to state truths. To call them "false" is to misunderstand their utility. They are tools, not maps.

  ### 4. The "Neurath's Boat" and the Normative Remainder
  Quine famously used the metaphor of Neurath's Boat: we rebuild our ship of knowledge while at sea, using only the planks we have. We cannot step outside our web of belief to justify it from a God's-eye view.

  *   **Critique of Street's Constructivism:** Street argues for a constructivist view where values are constructed by valuing creatures. Quine might find this still too "first-philosophical." He would prefer to naturalize ethics completely.
  *   **Quine's Alternative:** He would treat ethics as a branch of **behavioral psychology and social planning**. The question is not "What is Right?" but "What habits of action lead to a stable society?"
  *   **Handling the "Ought":** Quine acknowledges that we cannot simply eliminate moral language; it is part of our social fabric. But he would insist on keeping it distinct from the "is" of science. He would accept Street's evolutionary explanation as the *descriptive* account of why we have the "oughts" we have, while denying that those "oughts" refer to any ontological category beyond human sentiment and social utility.

  ### 5. Summary of Quine's Reasoning
  If Quine were to write a response to Street, the argument would likely proceed as follows:

  1.  **Acceptance of Naturalism:** I agree with Street that evolutionary biology provides the only legitimate causal account of how our evaluative dispositions arose.
  2.  **Rejection of the Realist Presupposition:** The "Dilemma" only bites if one assumes moral predicates refer to mind-independent properties. My ontology, governed by the indispensability criterion, commits me to no such properties. Therefore, the "Tracking Account" was never a live option for me, and the "Adaptive Link" is not a skeptic's worry, but the whole story.
  3.  **Semantic Deflation:** Moral sentences lack the intersubjective checkpoints required for cognitive significance in the scientific sense. They are not false (Error Theory); they are non-assertoric expressions of sentiment and social policy (Non-Cognitivism/Pragmatism).
  4.  **No Companions-in-Guilt:** Mathematical posits are saved by their indispensable role in physics. Moral posits play no such role. The epistemological security of mathematics does not extend to ethics.
  5.  **Conclusion:** Street is right to debunk realism, but she need not (and should not) try to save a "normative truth" via constructivism. We should instead treat ethics as a technology of social living, subject to empirical revision based on human welfare, but devoid of ontological weight.

  ### Final Verdict on the Reasoning
  Quine would not sign on to Street's conclusion simply because she is an antirealist; he would sign on because her argument provides the **evolutionary mechanism** that supports his **semantic and ontological skepticism**.

  He would view Street's dilemma as a *reductio ad absurdum* of the realist's attempt to scientize ethics. For Quine, the move is not to solve the dilemma (by finding a new way to justify values), but to **dissolve** it by reclassifying moral discourse. He would argue that once we see ethics through the lens of naturalized epistemology, the demand for "justification" in the face of evolutionary contingency disappears, because ethics was never in the business of offering knowledge claims to begin with. It is in the business of nurturing sentiments that allow the scientific community (and society at large) to function.

  Thus, Quine's response would be distinctive: not a new metaethical theory to compete with constructivism, but a quietist dismissal of the metaphysical anxiety Street addresses, grounded in a strict separation between the cognitive (science/ontology) and the non-cognitive (ethics/sentiment).
