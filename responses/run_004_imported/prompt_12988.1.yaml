prompt: |-
  I've been working through Quine's essay "On the Nature of Moral Values" (reprinted in Theories and Things), where he treats ethical predicates with noticeable suspicion. He is willing to grant mathematical posits a place in his ontology on the grounds that our best scientific theories cannot be formulated without them, yet he does not think moral predicates earn their keep in the same way, and he seems doubtful that moral discourse enjoys the kind of intersubjective checkpoints that let disputes in the sciences actually get settled. Suppose Quine had lived long enough to encounter Sharon Street's 2006 "Darwinian Dilemma" for moral realists, which argues that our evaluative dispositions were shaped by selective pressures bearing no obvious relation to any independent moral facts -- leaving realists stuck choosing between positing an implausible tracking coincidence or conceding that those dispositions are unreliable. Given his naturalized epistemology, his holism, and his selective, indispensability-based approach to ontological commitment, how do you think Quine would actually have responded to Street? Would he simply have signed on to her antirealist conclusion, or does his broader framework point toward some more distinctive move -- an error theory, a companions-in-guilt strategy, or treating moral discourse as not really fact-stating in the first place? I am less interested in your bottom-line verdict than in the reasoning you think he would actually have given to reach it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Subject:** W.V.O. Quine's potential response to Sharon Street's "Darwinian Dilemma" (2006).
      *   **Context:** Quine's essay "On the Nature of Moral Values" (in *Theories and Things*), his naturalized epistemology, holism, and indispensability argument for ontology.
      *   **Key Question:** Would Quine accept Street's antirealist conclusion, or would he make a distinctive move (error theory, companions-in-guilt, non-cognitivism, etc.)?
      *   **Constraint:** Focus on the *reasoning* process, not just the bottom-line verdict.
      *   **Tone:** Philosophical, analytical, respectful of Quine's specific idiosyncrasies.

  2.  **Deconstruct Quine's Position on Ethics (based on "On the Nature of Moral Values" and general Quinean doctrine):**
      *   *Ontology:* Quine is an ontological naturalist. To exist is to be the value of a bound variable in our best scientific theory.
      *   *Indispensability:* Mathematical objects are saved because they are indispensable to natural science. Moral objects/properties are *not* indispensable to natural science.
      *   *Epistemology:* Naturalized epistemology. Knowledge is a web of belief facing the tribunal of experience. Science is the paradigm.
      *   *Ethics:* Quine views ethics as fundamentally different from science. It lacks "intersubjective checkpoints." It is more about nurturing sentiments than discovering truth. He leans towards a non-cognitivist or pragmatic view of ethics, though he doesn't use the exact label "emotivist" without qualification. He sees moral statements as having a "categorical" tone but lacking the cognitive content of scientific statements.
      *   *Truth:* He is a deflationist about truth (disquotational). But for a sentence to be true, it must have cognitive content. If moral sentences aren't fact-stating, truth doesn't apply in the robust sense.

  3.  **Deconstruct Sharon Street's "Darwinian Dilemma":**
      *   *Premise:* Evolutionary forces shaped our evaluative judgments.
      *   *Dilemma:*
          1.  *Tracking Account:* Evolution tracked independent moral truths. (Street argues this is implausible/unscientific).
          2.  *Adaptive Link Account:* Evolution shaped judgments for survival, regardless of truth. (This undermines the justification for believing those judgments track independent truths).
      *   *Conclusion:* Moral Realism (specifically robust, mind-independent realism) is untenable. We should be constructivists or antirealists.

  4.  **Synthesize: Quine meets Street:**
      *   *Agreement:* Quine would agree with Street's premise that evolution shapes our dispositions. He is a thoroughgoing naturalist. He would also agree that positing "independent moral facts" that evolution miraculously tracks is scientifically dubious (violates the causal theory of knowledge implicit in naturalism).
      *   *Disagreement/Nuance:* Street targets *Moral Realists*. Quine *isn't* a Moral Realist to begin with. So, the dilemma is somewhat moot for him. He doesn't need to solve the dilemma because he doesn't accept the ontology that creates the dilemma.
      *   *The "Companions-in-Guilt" Angle:* Could Quine argue that *mathematics* faces a similar dilemma? (Benacerraf-style). Quine defends math via indispensability to *physics*. Moral values are not indispensable to physics. So, the "guilt" isn't shared. Math is saved; ethics is not.
      *   *The "Error Theory" Angle:* Would he say moral statements are false? Quine tends to think they aren't even in the business of being true or false in the scientific sense. They are expressions of sentiment or social glue. This leans closer to non-cognitivism or a pragmatic instrumentalism.
      *   *The "Naturalized Ethics" Angle:* Quine might suggest we treat ethics as a branch of psychology/sociology. We study *why* people value things, not *what* they ought to value in a Platonic sense.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Quine would just say "I told you so." He already rejected moral properties. Street just gives him a new evolutionary argument for what he already believed based on logical/semantic grounds.
      *   *Refinement:* It's more interesting than that. Street's dilemma is epistemological (how do we *know*?). Quine's rejection is often ontological (what *exists*?) and semantic (what do words *do*?). Quine would appreciate the naturalistic framing of Street's argument but would likely find her constructive solution (constructivism) still too "normative" in a way he distrusts.
      *   *Key Quinean Move:* The distinction between *internal* and *external* questions, or rather, the distinction between *science* (description) and *ethics* (prescription/nurture).
      *   *Specific Quinean Text:* In "On the Nature of Moral Values," Quine explicitly compares ethics to science and finds it wanting regarding objective checkpoints. He says moral principles are "in principle" nurture-able but not discoverable like laws of nature.
      *   *Response to Street:* Quine would likely view Street's dilemma as a *reductio* of the realist's pretension to scientific status. He wouldn't need an error theory (which grants cognitivism but denies truth) as much as a *deflationary non-cognitivism*. Moral sentences aren't false; they are non-assertoric.
      *   *Wait, does Quine grant truth to ethics?* In "On the Nature of Moral Values," he says, "I do not see how... we can make sense of an objective right and wrong." He suggests moral sentences are "observation sentences" of a sort, but tied to sentiment. He leans towards treating them as lacking the cognitive content required for the truth predicate to apply in the scientific sense.
      *   *The Indispensability Check:* This is crucial. Math is saved because physics needs it. Ethics is not needed for physics. Therefore, the evolutionary debunking argument doesn't threaten the core of Quine's ontology (physics + logic + math). It only threatens a "folk ontology" of values. Quine is happy to discard folk ontologies.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the fascinating counterfactual. State the thesis: Quine would welcome Street's naturalism but reject the idea that the dilemma poses a *problem* for his own view, because he never granted the ontology Street attacks. He would likely adopt a stance distinct from Street's constructivism, leaning toward a naturalized non-cognitivism or pragmatic instrumentalism.
      *   **Point 1: The Indispensability Filter.** Explain why Math survives but Ethics doesn't. Street's dilemma hits realists; Quine isn't one. The evolutionary story confirms Quine's suspicion that ethics is about survival/social cohesion, not fact-tracking.
      *   **Point 2: Epistemology and Checkpoints.** Quine's criterion for objectivity is intersubjective verification (scientific method). Ethics lacks this. Street's argument reinforces this lack. Quine would see the "adaptive link" not as a skeptic's worry to be solved (as Street does for constructivists) but as a description of what ethics *is*.
      *   **Point 3: Non-Cognitivism vs. Error Theory.** Quine is a deflationist about truth. If moral sentences don't play a role in the web of scientific belief, do they have truth values? Quine likely sees them as imperative or expressive. He wouldn't call them "false" (Error Theory) but rather "not fact-stating" (Non-cognitivism/Pragmatism).
      *   **Point 4: The Normative Remainder.** How does Quine handle the *use* of ethics? He acknowledges its social utility. He would treat ethics as a technology of social engineering, not a domain of inquiry. Street's constructivism might look too much like "realism lite" to him.
      *   **Conclusion:** Quine would view Street's dilemma as a vindication of his own separation of science and ethics. He wouldn't need to solve the dilemma; he would dissolve it by denying the presuppositions that create it.

  7.  **Refining the Reasoning (Self-Correction during drafting):**
      *   *Caution:* Don't make Quine sound like a simple emotivist (Ayer). Quine is more nuanced. He acknowledges the "categorical" feel of ethics.
      *   *Caution:* Don't make Street sound like a realist. She is an antirealist/constructivist. Quine might find her constructivism still too committed to "reasons" in a way that transcends naturalistic explanation.
      *   *Key Insight:* Quine's naturalism is *scientific* naturalism. Street's is *evolutionary* naturalism. They align, but Quine is stricter about what counts as "knowledge."
      *   *Specific Quinean phrase:* "Neurath's Boat." We rebuild ethics from within, using scientific tools, not philosophical ones.
      *   *Final Polish:* Ensure the distinction between "ontological commitment" and "discursive practice" is clear. Quine commits to what is indispensable. Ethics is not. Therefore, no commitment. Street asks "Given we have these beliefs, how are they justified?" Quine asks "Do we need these beliefs for our theory of the world?"

  8.  **Final Review against Prompt:**
