answer: |-
  **The Lock**

  The coffee was too hot, but Joren wrapped his hands around the mug anyway. He needed the burn. It was the first real heat he'd felt in six hours, since the mining rig's life support had coughed its last and the cold of the void started seeping through his suit.

  Now he was safe. He was sitting in the mess hall of the *Salvator*, a heavy rescue corvette. The hum of the engine was a lullaby. Outside the thick quartz glass, the stars were indifferent. Inside, Captain Voss was waiting.

  Voss wasn't looking at him. He was polishing a wrench, methodical, rhythmic. On the table between them lay a slate. On the slate was the transfer protocol for the Helios Claim—the mining rights Joren had been stranded to protect. Rights worth enough to buy a moon.

  "Half," Voss said, not looking up. "Like we agreed."

  Joren's thumb brushed the edge of the slate. He could feel the haptic feedback, waiting for his biometric confirmation. Once he signed, forty percent of his life's work would vanish into Voss's account. Forever.

  Here was the thing the textbooks never quite captured: the air was different now. Out on the rig, dangling in the dark with his oxygen ticking down, the promise to pay had felt like a lifeline. It was the price of admission. But the airlock was sealed now. The *Salvator* was docked at Station Nine. Security was a keypad away. Voss was just a contractor. He had no leverage. He couldn't throw Joren back out there.

  Legally, the contract was void. It was signed under duress in unregulated space. If Joren stood up right now, walked to the security office, and reported a coercive salvage, he'd keep the whole claim. Voss would get a standard rescue fee, peanuts compared to the Helios share.

  Joren's heart hammered against his ribs. It was the rational move. It was the *only* move. You don't pay the ransom after the hostage is released.

  He looked at Voss. The captain finally set the wrench down. He looked tired, but his eyes were sharp. They hadn't scanned Joren's face when they met on the rig. They had scanned the space around him.

  The Profiler.

  That was the catch. Voss hadn't taken Joren's word. He hadn't even taken a digital signature. Before he'd cracked the airlock, Voss had run the Causal Profiler. It didn't measure intent; intent was cheap. You could intend to pay while your brain screamed *lie*. The Profiler measured disposition. It looked at the architecture of your choices, the weight of your history, the shape of your selfishness. It predicted what you *would* do, not what you *said* you would do.

  Joren remembered the red light bathing the airlock chamber. He remembered the silence while the machine chewed on his soul.

  *If you were the kind of person who would stiff me,* Voss had said then, voice flat over the comms, *the light would be green. And you would have died.*

  The light had been amber. The lock opened.

  So here Joren sat. Safe. Warm. Free.

  His thumb hovered over the 'Confirm' glyph.

  *Why pay?* the voice in his head whispered. *The transaction is complete. He saved you. You're alive. What happens now is a new game. In this new game, defection dominates. Keep the credits.*

  It made perfect sense. It was clean. It was logical.

  But then the other thought arrived, cold and heavy as the void outside.

  *If you don't pay... then the Profiler was wrong.*

  If Joren walked away with the whole claim, he proved that he was, in fact, the kind of person who reneges on salvation. He proves that he is a defector.

  But if he is a defector, the Profiler should have seen it. The light should have been green. The airlock should have stayed sealed. He should be a corpse floating beside the rig.

  He wasn't a corpse. He was here. Therefore, the Profiler was right. Therefore, he is not a defector.

  So why did it feel like he was holding a gun to his own head?

  He looked at Voss. The captain met his gaze. There was no threat there. No anger. Just a quiet, terrifying certainty. Voss knew the math. Voss knew that if Joren was the man who got saved, Joren was the man who pays.

  But Joren felt the sweat on his palm. He felt the urge to crush the slate, to run, to keep it all. He felt the freedom of the man who has already won.

  *If I don't pay,* Joren thought, *I become the man who dies. But I didn't die. So I must pay. But I don't want to.*

  The logic looped in on itself, a snake eating its own tail. The past prediction constrained the future choice, but the future choice could rewrite the past truth.

  Voss stopped polishing the wrench. He pushed the mug of coffee closer to Joren.

  "Drink," Voss said softly. "It's getting cold."

  Joren looked down at the slate. The screen was dimming, waiting for input. He could feel the weight of the decision not as a moral burden, but as a physical one, like gravity had shifted inside the room. If he pressed 'Confirm', he lost half his fortune. If he pressed 'Cancel', he lost... what? Himself? The consistency of his own existence?

  His thumb trembled. The cursor hovered over the glyph.

  The engine hummed. The coffee steamed. The stars waited.

  Joren pressed.
