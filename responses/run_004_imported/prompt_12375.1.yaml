      *   **Goal:** Honor the rarity/greatness of his actions *without* making it sound like "no big deal" (respecting his humility but acknowledging truth) and *without* shaming those who lived ordinary lives (avoiding moral superiority).

  2.  **Determine the Tone:**
      *   Warm, grounded, honest, gentle.
      *   Avoid hagiography (making him a saint) but avoid minimizing his impact.
      *   Focus on *readiness* and *presence* rather than heroism.
      *   Acknowledge the Aunt (partners in this).

  3.  **Drafting - Section by Section:**

