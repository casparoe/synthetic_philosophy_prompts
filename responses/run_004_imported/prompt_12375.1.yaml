answer: |-
  Good morning. Thank you all for being here to remember my uncle.

  For those who didn't know him well, you might look around this room and see a quiet man. A man who liked his coffee black, his lawn mowed, and his weekends predictable. And in many ways, he was exactly that. But for twenty years, the predictability of his life was intentionally punctured by the unexpected.

  For two decades, my uncle and my aunt kept their home in a state of permanent readiness. They were the emergency placement for medically fragile newborns. When the hospitals had nowhere to send a baby who needed medicine, monitoring, and holding hands at three in the morning, the phone rang here.

  Sometimes, they had an hour to prepare. Sometimes, the baby stayed for a night; sometimes for months. These were children the world had deemed too difficult, too fragile, or too temporary to love. My uncle and aunt loved them anyway. They did this unpaid. They did this while working full-time jobs. They did this while raising their own family.

  If you ever thanked him for it, you know what he would say. He had a standard reply, delivered with zero irony: "Anyone in my position would have done the same."

  He said it to deflect praise. He said it because he was deeply uncomfortable with the idea of being special. But today, I think we need to gently disagree with him. Not to contradict his memory, but to honor the truth of his character.

  The truth is, not everyone would have done the same. Most of us, if offered the chance to sleep through the night, would sleep. Most of us, if asked to open our hearts to a child we might have to give up in forty-eight hours, would hesitate. We would worry about the pain of attachment. We would worry about the disruption.

  My uncle didn't worry about that. He worried about the baby.

  He understood something that many of us spend our lives trying to learn: that a life well-lived isn't measured by the monuments we build, or the careers we climb, or the legacy we leave in stone. It is measured by who we make space for.

  I know there are people in this room who feel they haven't done enough. I know there are family members here who look at his life and wonder if their own contributions measure up. I want to speak to that for a moment.

  My uncle would be the first to tell you that you do not need to foster babies to be a good person. He didn't do this to set a bar that the rest of us couldn't reach. He did it because that was where he was needed.

  His greatness wasn't in the *act* itself, but in the *availability*. He kept his door unlocked. He kept his heart open. He showed up.

  We honor him not by trying to replicate his specific path. We honor him by asking ourselves: Where is my place of readiness? Who needs me to show up? It might be a neighbor. It might be a sibling. It might be a stranger. The scale doesn't matter. The willingness does. If we can live with that kind of openness, in our own ordinary ways, then we are walking in his footsteps.

  And then, there are the two young adults sitting here today.

  You know better than anyone what his hands felt like. You know the sound of his voice in the middle of the night. You know that you are here, breathing and living and growing, because he and my aunt decided that you were worth the exhaustion.

  I know you might feel a debt to him. I know you might feel that you owe him your success, or your gratitude, or your lives. I am here to tell you, on behalf of this family, that you owe him nothing.

  You are not his project. You were his family.

  The greatest compliment you can pay him is not to succeed in spite of your start, but to live fully because of the love you were shown. You are his legacy. Not because you survived, but because you are here. Seeing you grown, seeing you whole, is the only reward he ever wanted.

  He was seventy-eight years old. He lived a life that was quiet, but loud with love. He insisted he was just an ordinary man who did what anyone would do.

  We know better. But we will respect his wish. We will not build him a statue. We will not make him a saint. Instead, we will do the one thing he valued most.

  We will keep our doors open. We will show up. And when the next person in need walks into our lives, we will try, in our own small ways, to do what he did.

  Rest now, Uncle. The night light is on. We'll take it from here.
