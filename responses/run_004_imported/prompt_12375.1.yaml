      *   **The Work (The "What"):** Describe what they did without getting too clinical. Focus on the urgency and the fragility. The "middle of the night" aspect.
      *   **The Uncle's Philosophy (The "How"):** Address his standard line ("Anyone would do this"). Validate his humility but gently correct the record. It *wasn't* common. Why? Because it requires a specific kind of openness.
      *   **Addressing the "Ordinary" Life (The Nieces/Nephews):** This is crucial. How to frame his life so it doesn't shame others? Frame his gift as *availability*, not necessarily grand gestures. Everyone can be available in their own way. His life wasn't about *glory*, it was about *showing up*.
      *   **Addressing the Young Adults (The Babies):** Acknowledge their presence and their bond. They are the living legacy. They don't owe him; they *are* the gift.
      *   **Closing:** A final send-off. Bring it back to love and memory.

  4.  **Navigating the Tension (Humility vs. Truth):**
      *   *Challenge:* He said "Anyone would do this."
      *   *Solution:* "He believed that because his heart was wired that way. But we know the truth. It takes a specific kind of courage to keep your front door unlocked for tragedy and hope in equal measure."
