answer: |-
  You are not overthinking this, and your intuition is pointing toward a very real, well-documented ethical distinction. You are grappling with a classic problem in political philosophy and ethics that scholars like Ronald Dworkin, G.A. Cohen, and Amartya Sen have debated for decades.

  Your brother is making an argument based on **Equality of Welfare** (everyone should end up equally happy). Your intuition is arguing for **Equality of Resources/Capabilities** (everyone should have what they need to function, but not necessarily to indulge).

  Here is the breakdown of why your brother's logic feels wrong, why your sister's situation is fundamentally different, and how you can articulate this without attacking your brother's character.

  ### 1. Brute Luck vs. Cultivated Preferences
  The strongest philosophical distinction here is the source of the "need."

  *   **Your Sister (Brute Luck):** Her situation is the result of "brute luck"—an unchosen, random event (the car crash). She did not choose to need a wheelchair or physio. Her need is **involuntary** and **objective**. Without that money, her health, safety, and basic ability to navigate the world are compromised.
  *   **Your Brother (Expensive Tastes):** His situation is what philosophers call "expensive tastes." Even if he feels genuine distress when flying economy, those preferences are generally viewed as **subjective** and **cultivated**. While he may not feel like he chose them consciously, they are preferences regarding *quality of life*, not *functionality*.

  **The Ethical Problem:** If a family (or society) agrees to subsidize expensive tastes, it creates a perverse incentive. It penalizes the sibling with modest tastes (you) who can find happiness in a budget holiday, and rewards the sibling who demands luxury. Fairness usually dictates that we should not be punished for having humble preferences nor rewarded for extravagant ones.

  ### 2. Needs vs. Wants (The Threshold Argument)
  There is a difference between a **threshold need** and a **preference satisfaction**.

  *   **Sister:** Her funding is about reaching a **baseline of functioning**. The money buys her access to the world that others have for free (stairs, walking, etc.). It is restorative.
  *   **Brother:** His funding is about **enhancement**. He can fly economy and arrive at the destination safely; he just won't enjoy it as much. He is asking for extra resources not to reach a baseline of functioning, but to reach a baseline of *pleasure*.

  In inheritance ethics, "fairness" usually prioritizes ensuring all heirs have a secure foundation. It rarely extends to ensuring all heirs have an equal capacity for luxury.

  ### 3. The "Responsibility" Factor
  Fairness often involves an assessment of responsibility.

  *   **Sister:** She bears no responsibility for her costs.
  *   **Brother:** While he isn't "faking" his feelings, adults are generally expected to manage their expectations to match their means. If your brother earns a high income, he can fund his own luxury travel. If he earns an average income, the expectation is that he adapts his lifestyle. Asking your parents to bridge the gap between his income and his lifestyle expectations shifts the burden of his preferences onto the rest of the family.

  ### 4. How to Explain This Without Sounding Judgmental
  You mentioned you struggle to explain this without calling your brother shallow. The trick is to move the conversation away from *his feelings* and toward *the purpose of the money*.

  **Don't say:** "Your needs aren't real because they're just about luxury."
  **Do say:** "There is a difference between money that buys **access** and money that buys **comfort**."

  **Try this framework:**
  > "I've been thinking about the fairness principle. I agree that we should adjust the split to account for unequal challenges. But I think we need to distinguish between **unavoidable costs of living** and **costs of lifestyle.**
  >
  > Sister's extra costs are unavoidable; she pays them just to exist in the world safely. Brother's costs are lifestyle-based; he pays them to enjoy the world more comfortably. If we treat those two things the same, we're essentially saying that medical necessity is equal to luxury preference. I think fairness means covering the necessities first, and then splitting the rest equally, regardless of how much joy each of us gets from it."

  ### 5. Who is Right?
  Ethically, **you are right.**

  Your brother's argument relies on the idea that the goal of the inheritance is to equalize *happiness*. But the goal of an inheritance (and most social safety nets) is usually to equalize *opportunity* or *security*.

  If your parents give him extra money, they are effectively taxing your modest lifestyle to subsidize his expensive one. That is the opposite of fairness.

  ### A Note on Your Partner's View
  Your partner says the family is overthinking a "basic money split." In a practical sense, they might be right—ultimately, it is your parents' money, and they can distribute it however they wish. However, these conversations often linger and cause resentment long after the money is spent.

  Clarifying the principle now protects your relationship with your siblings later. If your brother gets a larger share based on "needs," and you later see him on a luxury vacation while you struggled to pay a bill, you will resent it. Establishing the distinction between *medical necessity* and *lifestyle preference* now prevents that future conflict.

  ### Summary
  Your brother is conflating **distress** with **disadvantage**. He is distressed by economy seats; your sister is disadvantaged by a lack of accessibility.

  *   **Sister:** Needs money to remove a barrier.
  *   **Brother:** Wants money to remove a preference mismatch.

  You can validate his feelings ("I believe you are genuinely unhappy in economy class") while rejecting his claim ("...but that is a preference we shouldn't subsidize over medical needs"). That allows you to stand your ground without calling him shallow.
