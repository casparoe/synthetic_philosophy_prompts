      *   *Interpretive Issue 2 (Cord vs. Fire):* "Loosening the cord" = release from the bondage of life/form. "Fire and Faggots" = Continuity of energy/process vs. impermanence of specific form. They are complementary. One is about release, one is about transformation.
      *   *Interpretive Issue 3 (Survival vs. Non-Survival):* This is the big one. "The fire is transmitted." Does the *individual* persist? No. The *process* persists. It's like a flame moving to a new log. The specific flame on *this* log goes out. The *fire* continues. This is generally read as naturalistic transformation, not personal immortality.
      *   *Interpretive Issue 4 (Legge's "God"):* Legge translates *Di* (帝) as "God." In *Zhuangzi*, *Di* usually refers to a cosmic ruler or Heaven, not the Christian monotheistic God. This adds a theistic layer that isn't necessarily there. Legge also uses Victorian English ("faggots," "condole," "Master").

