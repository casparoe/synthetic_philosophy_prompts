      "Dretske's informational teleosemantics",
      "Papineau's success-based teleosemantics"
    ],
    "C": [
      "Fodor's asymmetric-dependence theory"
    ],
    "D": [
      "Cummins's ahistorical, causal-role notion of function"
    ]
  }
  ```

  Millikan's biosemantics anchors content to historical selection conditions where only the true referent was present, rendering novel false positives as malfunctions, albeit at the cost of denying content to Swampman.
  Neander's teleosemantics locates content in the specific proximate triggers selected for in evolutionary history, effectively excluding accidental correlations like BBs from the content specification.
  Dretske's informational teleosemantics fixes content during a privileged learning period where information covaries, though the theory faces challenges in non-arbitrarily defining the period's boundaries against disjunctive intrusions.
  Papineau's success-based teleosemantics determines content by the conditions required for consumer success, but risks vagueness when defining what counts as success without circular reliance on content.
  Fodor's asymmetric-dependence theory attempts to solve disjunction via asymmetric causal laws, but often covertly relies on intentional descriptions to establish the required asymmetry between law-like and parasitic correlations.
  Cummins's ahistorical, causal-role notion of function defines function as causal contribution, thereby lacking the normative resources to distinguish misrepresentation from mere functional variation.
