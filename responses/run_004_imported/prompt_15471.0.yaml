prompt: |-
  So I'm on my high school's honor council (the student board that hears academic integrity cases) and we've got a case splitting the group in half. A girl reported a guy for using his phone during a chem quiz, but it turns out she copied a lab report last year and never got caught, so now he's arguing she has no right to even bring the case since she's a hypocrite. Half the council thinks that's irrelevant to whether the phone thing actually happened, the other half thinks its a real problem and maybe we shouldn't hear the case at all. I need to bring a one-page memo to our meeting Thursday that actually recommends something (hear it normally, dismiss it, whatever) with real reasons, and it can't just say "two wrongs don't make a right" and stop there bc that dodges the hard part of the hypocrisy argument -- can you draft it for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** High school Honor Council (student board hearing academic integrity cases).
      *   **The Case:** Girl reported Guy for phone use during a Chem quiz. Guy claims Girl copied a lab report last year (uncaught). Guy argues she has no standing/right to report due to hypocrisy ("unclean hands").
      *   **The Conflict:** Council is split 50/50. One side says hypocrisy is irrelevant to the facts; the other says it undermines the process/integrity of the council.
      *   **The Task:** Draft a one-page memo for the Thursday meeting.
      *   **Requirements:** Must make a specific recommendation (hear, dismiss, etc.), provide real reasons, avoid clichés like "two wrongs don't make a right" without substance, and address the core hypocrisy argument.

  2.  **Determine the Best Recommendation:**
      *   *Option A: Dismiss the case.* This sets a dangerous precedent. It means any accuser can be disqualified by digging up past uncharged misconduct. It paralyzes the honor system.
      *   *Option B: Hear the case normally.* This is the standard legal/ethical approach. The violation (phone use) is an objective fact. The accuser's history doesn't change the evidence. However, it ignores the *perception* of fairness.
      *   *Option C: Hear the case, but address the hypocrisy concern procedurally.* This is the nuanced approach. Acknowledge the tension but prioritize the integrity of the *system* over the purity of the *individual*.
      *   *Decision:* The strongest position for an Honor Council is to uphold the system's integrity. Dismissing based on the accuser's past misconduct creates a "tu quoque" loophole that destroys accountability. The recommendation should be to **hear the case on its merits**, but perhaps with a note on how to handle the "credibility" aspect if it comes up during the hearing.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening/Recommendation:** State the bottom line immediately. (Recommend proceeding with the hearing).
      *   **Core Argument (The "Why"):**
          *   Need to address the "Hypocrisy/Standing" argument directly.
          *   *Point 1: Objective Violation.* The phone use is the issue, not the reporter's character.
          *   *Point 2: Systemic Stability.* If we dismiss based on accuser history, we incentivize digging up dirt on reporters rather than defending against charges. It chills reporting.
          *   *Point 3: Distinction between "Standing" and "Credibility."* Her past doesn't remove her standing to report, but it *might* affect credibility if she testifies. However, phone evidence is usually objective (did he have the phone or not?).
      *   **Addressing the "Hard Part":** Why isn't this just "two wrongs"? Because the Honor Council represents the *community*, not just the individual reporter. The school has an interest in stopping cheating, regardless of who reports it.
      *   **Procedural Safeguard:** How do we make the dissenting half feel heard? Acknowledge that the accused can bring up her past *only* if it directly impacts evidence (e.g., if she's the only witness), but generally, keep the focus on the phone.
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Refining the Tone:**
      *   Needs to be professional, persuasive, and peer-appropriate (high school honor council, but serious).
      *   Avoid legalese but use logical structure.
      *   Keep it tight (one page).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Council. We should hear the case.
      *   Reason 1: He cheated. That's the facts.
      *   Reason 2: If we stop because she cheated before, no one will report ever. People will just threaten to expose reporters.
      *   Reason 3: We represent the school, not her.
      *   So, let's vote to hear it.

      *Critique 1:* Too simple. Doesn't address the "hypocrisy argument" deeply enough as requested. Needs more weight on *why* hypocrisy doesn't invalidate the process.

  6.  **Drafting - Iteration 2 (Adding Depth):**
      *   Focus on the purpose of the Honor Council. It's about community standards.
      *   The "Unclean Hands" doctrine. In law, it sometimes applies, but in school discipline, the institution's interest prevails.
      *   Distinguish between *initiating* a case and *proving* a case. She initiated it. The evidence proves it.
      *   Address the split: Acknowledge the fairness concern but explain why dismissing is worse.

  7.  **Finalizing the Content (incorporating into the final output):**
      *   *Subject:* Recommendation re: Case # [X] (Phone Use vs. Accuser History).
      *   *Recommendation:* Proceed with hearing.
      *   *Argument:*
          1.  **Institutional vs. Personal:** The Council enforces school policy, not personal morality. The violation exists independently of the reporter.
          2.  **The "Chilling Effect":** Dismissing creates a weapon against reporters.
          3.  **Relevance of Evidence:** Past plagiarism $\neq$ current phone use. They are distinct acts.
          4.  **Mitigation:** If her credibility is key, cross-examine her. But don't dismiss outright.

  8.  **Review against Constraints:**
      *   One page? (Keep word count around 400-500).
      *   Specific recommendation? (Yes, Proceed).
      *   Avoids "two wrongs" cliché? (Yes, focuses on systemic integrity).
      *   Addresses hypocrisy? (Yes, reframes it as institutional interest).

  9.  **Final Polish:** Check formatting and clarity. (Self-correction: Ensure I don't give legal advice, but frame it as policy logic). *Wait, one nuance:* The prompt says she "never got caught." This is hearsay unless he has proof. The memo should mention that unadjudicated allegations shouldn't stop current adjudication.

      *Revised Plan:* Add a point about unadjudicated allegations. We can't punish her now for something unproven from last year, so we shouldn't let it block this case.

  10. **Final Draft Construction** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Procedural Objection in Case #24-09 (Chemistry Quiz)

  **Recommendation**
  I recommend the Council **proceed with the hearing** regarding the alleged phone use, ruling that the accuser's prior unadjudicated misconduct does not disqualify the case. We should address the "hypocrisy" argument as a matter of witness credibility, not procedural standing.

  **Reasoning**
  The split in our group centers on whether the accuser's integrity is a prerequisite for enforcing community standards. While the concern about fairness is valid, dismissing the case sets a precedent that endangers the Honor System's functionality for three reasons:

  **1. Institutional Interest vs. Personal Standing**
  The Honor Council does not act on behalf of the individual reporter; we act on behalf of the school community. Academic integrity is an institutional value, not a transaction between students. If a violation occurred (phone use), it damages the grading curve and the value of our diplomas regardless of who reports it. Allowing the accused to veto a hearing based on the accuser's history shifts the focus from *their* violation to the *reporter's* character, effectively putting the accuser on trial instead of the accused.

  **2. The "Chilling Effect" on Reporting**
  If we establish that a reporter's past mistakes invalidate their reports, we create a dangerous loophole. Any student facing a charge could avoid accountability by digging up uncharged past errors of the accuser. This incentivizes retaliation and discourages students from reporting violations for fear that their own past will be scrutinized. To maintain a culture where students feel safe upholding standards, we must separate the *act* of reporting from the *perfection* of the reporter.

  **3. Distinction Between Standing and Credibility**
  The defense argues the accuser lacks "standing." However, her prior conduct is relevant only to her *credibility* as a witness, not her eligibility to file a report. Furthermore, the allegation against her (lab report copying) is unadjudicated. We cannot halt a current, evidence-based investigation based on hearsay regarding a past, unproven violation. If her testimony is required to prove the phone usage, the defense may question her credibility. If physical evidence (e.g., teacher confiscation, video) exists, her history is irrelevant to the facts.

  **Conclusion**
  Dismissing this case validates the argument that integrity is optional if others are also imperfect. To preserve the system, we must hear the evidence on the phone usage. We can acknowledge the tension by ensuring the accused has a chance to address witness credibility during the hearing, but we cannot dismiss the charge solely based on the reporter's history.

  **Action Item:** Vote to proceed with the hearing; rule prior unadjudicated misconduct inadmissible for procedural dismissal.
