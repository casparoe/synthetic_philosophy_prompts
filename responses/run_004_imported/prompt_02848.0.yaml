      *   *Apta* definition: Someone who has direct knowledge (*yathartha-jnana*) of the object and the desire to communicate it truthfully (*avanchita-iccha*).
      *   The Four Conditions of a Sentence (*akanksha, yogyata, asatti, tatparya-jnana*) are necessary for *understanding* the meaning, but the *validity* of the knowledge depends on the source being an *apta*.
      *   Navya-Nyaya (Gangesha) refines this logic to be extremely precise about causal conditions (*karanas*).

  3.  **Evaluate the AI Chatbot against Nyaya Criteria:**
      *   **Does an AI have *Jnana* (Knowledge)?** No. It has weights, parameters, and statistical probabilities. It does not have *anubhava* (experience) or *prama* (valid cognition) of the world. It simulates knowledge.
      *   **Does an AI have *Iccha* (Desire/Intent)?** No. It has no *tatparya* (intent to communicate) in the metaphysical sense. It has an objective function (minimize loss), not a communicative intent.
      *   **Does an AI qualify as an *Apta*?** Since it lacks *jnana* and *iccha*, it cannot be an *apta*.
      *   **Conclusion on *Shabda*:** Therefore, AI output *cannot* be *shabda pramana*.

  4.  **Evaluate the Alternative: *Anumana* (Inference):**
