      *   *Reclassification:* Trusting an AI is not receiving testimony; it is a risky *anumana* (inference) based on past performance, or more accurately, a form of *uhya* (speculative reasoning) that lacks the guarantee of *prama* (valid knowledge).
      *   *Nuance:* The four sentence conditions (*akanksha*, etc.) might be met syntactically, but the *pramanya* (validity) fails at the source.

