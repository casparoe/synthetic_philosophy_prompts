      *   **Constraint:** "Don't give me 'on the one hand, on the other hand,' I need something with a spine." The user wants a definitive, argued reconstruction, not a wishy-washy survey.
      *   **Tone:** Intellectual, rigorous, engaging, respectful of the tradition but applied to a modern context.

  2.  **Deconstruct the Nyaya Position on *Shabda Pramana*:**
