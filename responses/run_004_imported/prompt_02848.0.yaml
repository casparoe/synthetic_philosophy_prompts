      *   When a user reads an AI response, they are observing a sign (*linga* or *hetu*). The sign is the text generated.
      *   The inference would be: "The AI generated this text. The AI is trained on reliable data (usually). Therefore, this text is likely true."
      *   This fits the *pararthanumana* (inference for others) or *svarthanumana* (inference for oneself) structure better.
      *   However, there's a catch. Inference requires a *vyapti* (invariable concomitance). Is there an invariable link between "AI generated text" and "Truth"? No. Hallucinations break the *vyapti*.
