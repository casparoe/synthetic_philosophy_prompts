      {"rank": 1, "justification": "...", "why": "..."},
      {"rank": 2, "justification": "...", "why": "..."},
      {"rank": 3, "justification": "...", "why": "..."},
      {"rank": 4, "justification": "...", "why": "..."}
    ]
  }
  ```

  with all four filled in. Thanks!
