answer: |-
  The check you received for your wine-stained drafts highlights a tension that Nelson Goodman tried to resolve with surgical precision, but which literary experience keeps tearing open. You sold the *history* of the work (the autographic artifact), but you earn royalties on the *notation* of the work (the allographic text). Goodman's *Languages of Art* insists that for literature, only the notation matters. A perfect copy of *Moby Dick* is *Moby Dick*, regardless of whether it was printed by Melville's publisher or generated by a monkey with a keyboard, provided the spelling matches.

  However, the visceral disgust we feel toward the Hitler Diaries or Macpherson's "Ossian" suggests that Goodman's clean division is too sterile for the messy reality of reading. To decide who wins this argument, we must first steelman Goodman's position, then subject it to the stress test of the literary hoax.

  Goodman's defense rests on the definition of a "work." For Goodman, a painting is autographic because there is no notation system sufficient to determine its identity; the history of its production is the only way to distinguish the real from the fake. Even if a forgery is perceptually indistinguishable from the original, Goodman argues it is aesthetically inferior. Why? Because the knowledge that it is a forgery alters our perception, and furthermore, the existence of forgery threatens the very category of the art form. We train ourselves to look for the "tells," and the anxiety of authenticity becomes part of the aesthetic experience.

  For texts, however, Goodman argues we have a notation system: spelling and punctuation. If the characters match, the work is identical. Therefore, a "forgery" of a text is logically impossible in the same sense as a painting. If I hand-write *The Great Gatsby* and claim I found it in Fitzgerald's attic, I haven't forged the *work* (which exists independently of the manuscript); I have lied about the *provenance* of a specific instance. Goodman would argue that the scandal of the Hitler Diaries is a moral or historical scandal, not an aesthetic one. The text remains what it is. If the prose is stirring, it is stirring. If we feel cheated, that is a psychological reaction to being lied to, not an aesthetic diminution of the words on the page. Goodman's system protects the text from the biography of its maker.

  The counter-argument, fueled by the wreckage of literary hoaxes, is that literature is not merely a pattern of characters but an act of communication. When we read, we are not just decoding notation; we are listening to a voice. The aesthetic power of a text is often inextricably bound to the perceived context of its utterance. A poem about the trenches of World War I carries a specific weight if we believe it was written by a soldier in 1917. If we discover it was written by a pacifist in 1930, the text has not changed, but its *meaning* has. It is no longer a testimony; it is a ventriloquism.

  This is where Goodman's framework fractures. He treats the text as a static object, but literature is a pragmatic event. The "Ossian" poems were not rejected because the spelling was wrong; they were rejected because the *claim* of the text was false. The text asserts, implicitly, "I am a voice from the ancient Scottish past." When that assertion is revealed as a lie, the text fails on its own terms. The history of production is not an external label attached to the book; it is a constitutive element of the text's semantic content. To say the aesthetic value remains intact after a hoax is revealed is to claim that context is irrelevant to meaning. That is demonstrably false. A joke told by a comedian is funny; the same words spoken by a defendant in a murder trial are chilling. The words are allographic; the meaning is autographic.

  So, who wins? **Goodman loses.**

  His distinction holds up for preservation and cataloging, but it fails as a theory of aesthetic value. Goodman is right that a typo changes the work, but he is wrong that authorship does not. The scandal of the literary hoax proves that we do not read texts in a vacuum; we read them as traces of human action. When the action is fake, the trace is worthless. The "aura" that Walter Benjamin spoke of isn't just mystical mumbo-jumbo; it is the recognition of the text as a specific human gesture. If the gesture is feigned, the aesthetic contract is broken. Goodman wants to separate the art from the artist to protect the object; the hoaxes prove that the art *is* the relationship between the object and the artist. We treat these scandals as aesthetic losses because, in literature, truth-claims are part of the machinery of beauty. A lie cannot sustain the same aesthetic weight as a testimony, even if the syntax is identical.

  This brings us to the ghost in the machine: AI. An AI trained to churn out a "new" Hemingway novel is not a Vermeer case; it is the ultimate Ossian case. It is not copying an existing specific work (which would be a copyright violation akin to a print forgery); it is generating new notation that mimics the stylistic profile of a dead author. It is a fake voice, not a fake copy. Under Goodman's strict allographic rules, if the spelling is correct, it's a genuine instance of "a text." But under the verdict reached above, it is aesthetically hollow. It lacks the history of production that gives the style its weight. A Hemingway sentence is powerful because we believe a man named Hemingway lived a life that forced him to write that way. An AI writing that way is just a parrot mimicking the scar tissue. It is a forgery of a persona, and like the Hitler Diaries, once the provenance is known, the aesthetic experience collapses. The words remain, but the literature is dead.
