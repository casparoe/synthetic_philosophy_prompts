answer: |-
  **Elena:** Let's stick to the apartments. You prefer A to B, B to C, and C to A. I offer you C for A minus a fee. By your own current lights, C is better than A. You take it. Then I offer B for C minus a fee. B is better than C. You take it. Now you're back at A, minus two fees, and strictly worse off than when we started. How is this not irrational?

  **Marcus:** It's irrational only if you assume rationality is purely synchronic—maximizing at each isolated node. But agency unfolds over time. A resolute agent adopts a policy *ex ante*, say, "Stay at A," and adheres to it even when the local trade looks advantageous. They don't take the first step onto the pump.

  **Elena:** But *why* don't they take the step? At the moment of choice, they prefer C to A. If they refuse, they are deliberately choosing what they deem inferior. You're either saying they have hidden transitive preferences over plans—which means their outcome preferences were never the real story—or you're glorifying stubbornness. If "resoluteness" means ignoring your current best judgment to avoid a hypothetical future loop, you're just replacing one utility function with another that happens to be coherent.

  **Marcus:** That's the "smuggling" objection, but it misses the point of diachronic rationality. The agent isn't valuing "sticking to plans" as a separate good. They recognize that satisfying local preferences sequentially leads to global failure. Rationality isn't about maximizing at every node; it's about selecting a trajectory and maintaining it. The preference cycle exists over outcomes, yes, but the *choice* is constrained by the recognition that node-by-node maximization is self-defeating. We aren't smuggling in transitivity; we're rejecting the separability assumption that each choice is independent.

  **Elena:** Fine, suppose they know the cycle in advance. They pre-commit. But here is the sharper knife: What if I don't present the cycle as a known loop? What if I show up at their door unexpectedly and offer the trade? They can't pre-commit to a specific tree they don't see. If they evaluate the trade on its merits *now*, they take it and get pumped. If they refuse, they are refusing a strict improvement based on... what? A vague suspicion? If resolute choice requires foreknowledge of the pump to work, it doesn't prove intransitive agents are coherent; it proves they are vulnerable to surprise.

  **Marcus:** That conflates epistemic limitations with structural rationality. Of course an agent needs to recognize the structure to avoid it. But a resolute agent doesn't need to know *your* specific pump; they adopt a standing policy regarding trades. For example: "I never pay fees to swap equivalents." If their preferences are truly cyclic, they should recognize that swaps don't improve their state fundamentally.

  **Elena:** But by their own lights, the swap *does* improve their state! That's the definition of the cycle. A is worse than C to them *right now*. If they adopt a policy of "no swaps," they are overriding their actual preferences with a heuristic. You've conceded the point: to avoid the pump, they must act *as if* they have transitive preferences, even if they don't. The money-pump argument doesn't say you'll lose money today; it says your preference structure *forces* you to lose money unless you pretend to have a different structure. Resolute choice is just that pretense.

  **Marcus:** It's not pretense; it's self-governance. Consider a smoker who prefers smoking now to quitting, but prefers quitting to smoking forever. If they smoke now because "locally it's better," they fail. We don't say the quitter has "smuggled in" a different preference; we say they are rationally binding their future selves. The apartment agent is similar. They recognize that satisfying the cycle is destructive. When you say they are "overriding actual preferences," you assume the local preference is the only real one. I say the plan-based preference is equally real.

  **Elena:** The smoker example relies on time-inconsistency between present and future selves. Here, the inconsistency is between A, B, and C at the same time. If I surprise you with the trade, you have no time to invoke the plan. You face a binary choice: A or C-minus-fee. You prefer C-minus-fee. If you choose A, you are violating your preference ordering. You can call it "resolute," I call it "refusing free money." If your decision theory tells you to leave money on the table because you're afraid of a loop you can't even see, your theory is too brittle to guide action in an uncertain world.

  **Marcus:** And if your theory tells me I *must* take the money even though it guarantees I'll end up poorer than I started, your theory is too myopic to guide survival. The resolute agent survives the surprise by having a robust disposition: "I do not trade without net gain." Since the cycle offers no net gain over a loop, the disposition holds. You claim this violates preferences. I claim it respects the agent's interest over time. If that looks like intransitivity to you, it's only because you insist on evaluating rationality at a single instant rather than across a life.

  **Elena:** Then we disagree on the locus of rationality. I say if you won't take the trade now, you didn't really prefer it.

  **Marcus:** And I say if taking the trade ruins you later, you weren't really rational.
