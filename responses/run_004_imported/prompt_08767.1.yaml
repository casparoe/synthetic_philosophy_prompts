prompt: |-
  For my grounding & fundamentality seminar we've moved into the "historical ancestors of ground" unit, and the prof assigned this chunk of Aristotle's Metaphysics (Book Delta, ch. 11, the old Ross translation) right alongside Schaffer's monism paper, basically implying priority-talk is way older than Fine et al make it sound. I'm stuck on the actual logic of it though:

  "Some things then are called prior and posterior in this sense, others (4) in respect of nature and substance, i.e. those which can be without other things, while the others cannot be without them—a distinction which Plato used. (If we consider the various senses of 'being', firstly the subject is prior, so that substance is prior; secondly, according as potency or complete reality is taken into account, different things are prior, for some things are prior in respect of potency, others in respect of complete reality, e.g. in potency the half line is prior to the whole line, and the part to the whole, and the matter to the concrete substance, but in complete reality these are posterior; for it is only when the whole has been dissolved that they will exist in complete reality.) In a sense, therefore, all things that are called prior and posterior are so called with reference to this fourth sense; for some things can exist without others in respect of generation, e.g. the whole without the parts, and others in respect of dissolution, e.g. the part without the whole."

  Here's my problem: his test for "prior in nature/substance" is whatever "can be without other things" while the rest can't — and by that test the parts should win, a pile of bricks can be without a house. But then two sentences later he says the part is only prior "in potency," while in "complete reality" the whole outranks it. So is that a second, different sense of priority hes smuggled in, or is he claiming his one "can exist without" test just gives different verdicts depending on whether you're looking at potency or actuality? Basically I can't tell if he already noticed the exact problem Schaffer and the priority-monists are still fighting about (whole vs. parts as fundamental), or if he's just equivocating between two tests without realizing it. Can you help me actually reconstruct the argument here, sentence by sentence if you have to?
