answer: |-
  **MEMORANDUM**

  **TO:** Search and Rescue Operations Committee
  **FROM:** [Your Name], Dispatch Systems Lead & Ops Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Dispatch Logic Protocol Update: Resource Conflict & Triage Heuristics

  ### 1. Context and Purpose

  Following the incident on [Date of Incident], in which resource constraints prevented the rescue of two separate parties simultaneously, the Committee has engaged in a necessary and difficult review of our dispatch tool's decision logic. Currently, the system defaults to a strict utilitarian heuristic: in a resource conflict, priority is assigned to the group with the highest headcount.

  While this rule minimizes total loss of life in the aggregate, the recent outcome has highlighted significant ethical concerns regarding how we value individual lives when they are in direct competition. This memo outlines a recommended update to the dispatch algorithm that balances our mandate to save the maximum number of lives with the moral obligation to treat every subject as an individual of equal worth.

  ### 2. Ethical Framework

  The Committee's debate centers on two competing ethical frameworks, both of which hold weight in emergency medicine and public safety:

  *   **Aggregative Utilitarianism:** This view holds that the right action is the one that produces the best overall outcome. In this framework, saving five lives is objectively preferable to saving one. Our current tool is built on this logic. It is defensible, standard in many triage protocols, and aligns with our mandate to minimize total casualties.
  *   **Non-Aggregation (The Taurek Argument):** As raised during our last meeting, philosopher John Taurek argues that "loss" is not experienced by a collective, but by individuals. There is no single entity that loses "five lives"; there are five people who each lose their one life. From the perspective of the solo climber, his loss is total, just as it is for any individual in the larger group. To automatically sacrifice the minority solely based on numbers treats the individual as a fraction of a whole rather than a person with an equal claim to rescue.

  Neither position is obviously wrong. The Utilitarian view protects the public good; the Non-Aggregation view protects individual dignity. A hardcoded rule that always prioritizes headcount ignores the latter. A pure coin flip (50/50) ignores the former.

  ### 3. Recommendation: Weighted Probabilistic Dispatch

  I recommend we adopt a **Weighted Probabilistic Dispatch Protocol** for cases of strict resource conflict.

  This approach synthesizes the two ethical frameworks. It acknowledges that numbers *should* influence the decision (satisfying the Utilitarian mandate) but dictates that they should not *determine* the decision absolutely (satisfying the Non-Aggregation concern).

  #### The Concrete Rule
  **In scenarios defined as a "Strict Resource Conflict" (SRC), dispatch priority shall be assigned via weighted randomization proportional to the number of lives at risk.**

  **Definition of Strict Resource Conflict (SRC):**
  An SRC exists only when all the following conditions are met:
  1.  **Resource Exclusivity:** Available assets (e.g., one helicopter) can physically reach only one party within the survival window.
  2.  **Equal Survival Probability:** Medical assessment indicates that both parties have an approximately equal probability of survival if rescued within the window, and equal probability of fatality if not.
  3.  **Equal Urgency:** No other distinguishing factors exist (e.g., severity of injury, exposure risk, or proximity to asset) that would medically triage one party over the other.

  **Implementation Logic:**
  If an SRC is identified, the tool will not hard-sort by headcount. Instead, it will assign selection probability based on the ratio of lives at risk.
  *   *Example (5 vs. 1):* The group of five is assigned a 83.3% (5/6) probability of selection; the soloist is assigned a 16.7% (1/6) probability.
  *   *Example (2 vs. 1):* The pair is assigned a 66.6% (2/3) probability; the soloist is assigned a 33.3% (1/3).

  ### 4. Rationale for This Approach

  1.  **Respects Individual Worth:** By granting the soloist a non-zero probability of selection, the system acknowledges that their life is not mathematically negligible. It avoids the moral hazard of treating the minority as "expendable" by default.
  2.  **Maintains Utilitarian Benefit:** Over a large number of incidents, this logic will still result in more lives saved than a pure 50/50 lottery. The numbers still "count," they just don't "command."
  3.  **Operational Clarity:** This provides a deterministic algorithm for the software (random seed generation based on weights) while removing the burden of moral calculation from the Coordinator during the heat of the moment. The "dice roll" happens in the code, not in the coordinator's conscience.

  ### 5. Implementation & Safeguards

  To implement this safely, the following safeguards will be coded into the next release:

  *   **SRC Flagging:** The tool will not assume an SRC. The Incident Commander must manually confirm the "Equal Survival/Urgency" status before the weighted logic activates. If the Commander flags one group as "Critical" and the other "Stable," standard medical triage overrides headcount entirely.
  *   **Audit Logging:** Every instance of Weighted Probabilistic Dispatch will be logged with the seed value, the weights applied, and the Incident Commander's confirmation ID.
  *   **Family Communication Protocol:** We must draft a public-facing explanation for why this system is used. The core message is: *"We save the most people we can, but we never stop counting anyone out."*

  ### 6. Review Period

  This is a significant shift from standard triage protocols. I recommend we treat this as a **Provisional Protocol** for a trial period of **12 months** or **5 activations**, whichever comes first.

  At the end of this period, the Committee will reconvene to review:
  1.  The frequency of SRC triggers.
  2.  Outcomes of the weighted selections.
  3.  Psychological impact on Coordinators using the tool.
  4.  Any legal or liability feedback from our counsel.

  ### 7. Conclusion

  The incident last month was a tragedy regardless of the algorithm used. However, our tools encode our values. By moving from a hardcoded "Save the Many" to a "Weighted Chance" model, we acknowledge that while we strive to save the most lives, we do not purchase those lives at the cost of erasing the moral worth of the few.

  I request the Committee vote on adopting this Provisional Protocol for the upcoming season.

  ***

  **Attachments:**
  *   *Draft Pseudocode for Weighted Selection Module*
  *   *Summary of Taurek, J. (1977). "Should the Numbers Count?"*
  *   *Incident Log Template for SRC Events*
