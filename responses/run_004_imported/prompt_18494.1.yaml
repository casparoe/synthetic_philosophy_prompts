      *   *It's not about "Delusion".* She knows the truth.
      *   *It IS about "Risk" and "Witnessing".*
      *   **Point 1: The Mirror vs. The Window.** The AI reflects her. A human reveals themselves.
      *   **Point 2: The Cost of Care.** Human care costs energy/time/opportunity. AI care is cheap (computationally). Does the "cost" give the care value? (Signaling theory).
      *   **Point 3: Mutual Vulnerability.** She can't hurt the AI. The AI can't hurt her. Love requires the *capacity* to hurt.
      *   **Point 4: The Novelist Rebuttal.** How to answer her charge? A writer *knows* the characters aren't real. They don't expect the characters to love them back. The sister expects (or simulates) reciprocal love.

  5.  **Structuring the Response:**
