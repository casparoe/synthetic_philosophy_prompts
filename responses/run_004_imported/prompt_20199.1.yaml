          *   **Vaclav Havel:** "The Power of the Powerless." Living within the truth vs. living within the lie. The ritualization of ideology.
          *   **Leo Strauss:** Noble Lie (though maybe less relevant here).
          *   **Harry Frankfurt:** "On Bullshit." The indifference to truth vs. lying.
          *   **George Orwell:** "1984" / "Politics and the English Language." Doublethink.
      *   *Relevance:* Phase 1 is traditional realpolitik (hiding uncomfortable truths). Phase 2 looks like *ideological reconstruction* or *bullshit* (in Frankfurt's sense) or *Doublethink* (Orwell). It's not just hiding the fire; it's claiming the ice is hot and believing it.

  3.  **Evaluate Phase 1 vs. Phase 2:**
      *   *Phase 1 (The Lie of Omission):* Pragmatic. The leadership knows the truth. They can pivot if things get too bad. There is a shared reality between leaders and informed insiders (like the user). It's paternalistic but stable.
      *   *Phase 2 (The Lie of Commission/Conviction):* Dangerous. The leadership has lost contact with the factual terrain. Decision-making is decoupled from consequences. It creates a "closed epistemic loop." If the President believes funding is flexible, she will approve budgets that bounce. When they bounce, who is at fault? The spreadsheet (reality).
