      *   *Self-Preservation:* Admitting decline is admitting failure. Believing growth is psychologically easier.
      *   *Propaganda Function:* As Arendt notes, propaganda isn't always for the *outside*; it's for the *inside* to ensure loyalty. If everyone repeats the mantra, dissent becomes treason, not correction.

  5.  **Formulate Advice/Response Strategy:**
      *   *Standard Advice:* "Just tell the truth."
