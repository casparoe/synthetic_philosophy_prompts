          1.  Don't just present data; present *consequences*. (If we spend X, Y happens).
          2.  Document everything (protect yourself).
          3.  Build coalitions (are others puzzled?).
          4.  Reframe the intervention: Not "You are lying," but "How do we align our goals with these constraints?"

  6.  **Drafting the Response (Iterative refinement):**
