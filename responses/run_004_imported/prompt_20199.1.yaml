          *   *Phase 2 (This Semester):* Reconstruction/Delusion. The President claims the false narrative is true, seems sincere, gets puzzled when confronted with data, and plans are now being made based on the false narrative.
      *   **Core Question:** Is Phase 2 fundamentally different from Phase 1? Is a leader who believes their own lies more worrying than one who knowingly manages information? How should the council respond given this shift?

  2.  **Connect to Political Philosophy (The User's Lens):**
      *   The user explicitly mentions "twentieth-century debates about truth, propaganda, and public life." I need to leverage this.
      *   *Key Thinkers/Concepts:*
