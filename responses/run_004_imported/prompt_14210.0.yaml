answer: |-
  The rain in Sector 7 didn't wash things clean; it just made the grime slicker. Elias stood by the window of the safehouse, watching the neon bleed across the wet pavement below. On the table behind him, the comms unit blinked a steady, rhythmic red. It wasn't a threat, exactly. It was a confirmation.

  *Subject located. Retrieval imminent.*

  The Bureau's Actuary was not a man, but a algorithmic enforcement protocol housed in a drone swarm. It was infallible. Not because it was omnipresent, but because it was a perfect simulator of human deliberation. It didn't chase; it waited. It calculated where Elias would be tomorrow based on who Elias was today. If the Actuary said Elias would be in the Spire, the drones would be in the Spire. If it said the Flats, they would be in the Flats.

  Elias had two options. He could flee to the Spire, high above the smog, or descend into the labyrinthine Flats. He could not stay here.

  He packed a bag. Toothbrush, charger, credits. He zipped it shut. Then he stopped.

  "If I decide to go to the Spire," Elias murmured to the empty room, "then the Actuary has already simulated this decision. It knows I'm coming."

  The logic was cold, hard, and causal. His decision was the input; the Actuary's position was the output. They were locked in a correlation so tight it felt like causation. If he committed to the Spire, he made it true that the Actuary was waiting there. Survival required being where the Actuary was *not*. Therefore, committing to the Spire made death certain.

  He unzipped the bag. He threw the clothes on the bed.

  "Okay. The Flats, then."

  He began to repack, slower this time. But as his hand hovered over the zipper, the same logic inverted. If he committed to the Flats, the Actuary had simulated that commitment. The drones would be waiting in the labyrinth. Choosing the Flats made the Flats fatal.

  He sat on the edge of the bed, head in his hands. He was oscillating. He could feel the cycle spinning in his chest, a tachyon heartbeat speeding up. Every time his mind settled on a destination, that very settlement became the evidence that the destination was compromised. He couldn't find a stable point. There was no place he could choose to go where he wouldn't immediately wish he had chosen the other.

  A memory surfaced, unbidden. Sarah, before she was taken. They had argued over this very protocol in a university cafe, steam rising from their mugs. She had been an evidentialist, calm where he was frantic.

  "It's just news, Elias," she had said, stirring her tea. "If you go to the Spire, it's bad news. If you go to the Flats, it's bad news. But you have to go somewhere. The news is already written. Why torture yourself trying to edit the headline?"

  For Sarah, the choice was merely about receiving the best information. If both choices delivered the same news—*Death*—then she was indifferent. She would have picked the Spire because she liked the view, accepting the correlation as fixed. She wouldn't have tried to *cause* a different outcome through her choice, because she knew her choice didn't causally influence the Actuary's past prediction. She would have just walked out the door.

  But Elias was a causal thinker. He needed his action to *do* something. He needed to find the lever that moved the world. And every time he grabbed a lever, he found it was connected to the trap.

  He stood up again. Spire. No. Flats. No. Spire.

  He began to pace. The room was small. Three steps one way, three steps back. Like a pendulum. He realized with a jolt of horror that this pacing was the simulation. The Actuary wasn't just watching him; it *was* him, running a step ahead. If he paced forever, the drones would hover forever, waiting for him to commit. He was holding his own execution in suspense by refusing to finalize the variable.

  He looked at the bag on the bed. It was an object of pure potentiality. Until he picked it up, it was neither Spire-bound nor Flats-bound. But he had to pick it up. He had to move.

  "If I choose," he whispered, "I die. If I don't choose, I starve."

  There had to be a third state. A state where the input was decoupled from the simulation. The Actuary simulated *Elias*. It simulated his reasons, his fears, his preferences. It predicted based on his psychology. To beat it, he had to stop being a psychological agent and become a physical event.

  He needed a cause that had no reason.

  Elias went to the kitchen drawer. He rummaged past the utensils until his fingers found cold metal. A credit chip. Heavy, balanced. Two sides. Heads, Tails. Spire, Flats.

  He held it up to the light. The Actuary could predict Elias choosing the Spire. It could predict Elias choosing the Flats. Could it predict the outcome of a flip? It could predict the physics of the coin, certainly. But it could not predict which side Elias would *assign* to which destination without Elias knowing first. And Elias couldn't know until the coin landed.

  If he let the coin decide, his decision was no longer a product of his deliberation. It was a product of chance. The Actuary's simulation of Elias's reasoning would hit a wall of noise. The drones would have to split their forces, or guess. And if they guessed, they might be wrong.

  The oscillation in his chest slowed. The frantic need to find the *right* causal lever faded, replaced by the humility of surrender. He wasn't choosing anymore. He was sampling.

  He walked back to the center of the room. The rain hammered against the glass. The red light on the comms unit pulsed, waiting for the final variable to lock in.

  "Sarah," he said to the air. "You were right about the news. But you were wrong about the edit."

  He didn't look at the coin as he flipped it. He watched the arc, the blur of silver spinning in the dim light. For a second, it was neither Spire nor Flats. It was just gravity and angular momentum. It was the only thing in the room that wasn't him.

  It landed on the back of his hand. He covered it with his left palm.

  The silence stretched. The Actuary was waiting. The simulation was waiting. Elias took a breath, feeling the weight of the metal against his skin, warm now from his touch. He didn't feel fear anymore. He felt like a physicist who had finally accounted for the observer effect. The only way to measure the system without changing it was to introduce a random variable.

  He lifted his hand.
