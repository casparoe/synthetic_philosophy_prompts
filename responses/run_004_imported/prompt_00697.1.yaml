answer: |-
  **Title:** The Presumption of Continuity: Adjudicating the Reflection Principle

  **The Verdict**
  You and Mara have stumbled onto one of the most persistent stalemates in formal epistemology. Mara is right that the unrestricted Reflection Principle is false, and she is right that Van Fraassen's restriction creates a dependency on prior notions of rationality. However, she is wrong to conclude that this dependency renders the principle "empty" or "dead."

  The verdict is this: **A substantive version of the Reflection Principle survives, but only if we stop treating it as a mechanical rule for belief revision and start treating it as a constitutive norm of diachronic agency.** Reflection does not tell you *how* to calculate your future credences (Mara wins there); rather, it dictates the *default stance* you must take toward your future self (You win there). It survives not as a tool for generating probabilities, but as a shield against epistemic alienation.

  **The Conflict: Dutch Books vs. Drunk Drivers**
  To see why this distinction matters, we have to look at what each of you was fighting for. Van Fraassen's original motivation was diachronic coherence. He argued that if your current credence in $A$ differs from what you expect your future credence in $A$ to be, you are vulnerable to a diachronic Dutch Book. You can be pumped for money today and tomorrow based on the inconsistency between your current and anticipated future states. Reflection ($C_t(A | C_{t'}(A) = r) = r$) was proposed as the immunity shot.

  Mara's attack, leveraging David Christensen's famous "drunk-driving" case, is devastating against the *unrestricted* principle. If you know you will be drunk at $t'$, you know your future credence in "I will crash" will be irrationally low (say, 0.000001). Reflection would command you to adopt that credence now. That is absurd. You should not defer to a future self you know will be compromised.

  Van Fraassen's reply, which you defended, is to restrict the principle: Reflection only applies when you anticipate your future self is updating rationally and gaining information. If you expect to be drunk, hypnotized, or seduced by Sirens, the condition $C_{t'}(A) = r$ falls outside the scope of the principle.

  **Mara's "Emptiness" Charge**
  Mara's counter-punch is the "emptiness" objection. She argues that if Reflection only applies when you *already* know your future self is rational, then Reflection isn't doing any work. To know you will be rational, you presumably need to know you will follow a rational updating rule (like Conditionalization). If you already know you'll follow Conditionalization, you don't need Reflection to tell you what your credences should be; the probability calculus does that.

  In this view, Reflection becomes a tautology: "If you know you will update rationally, you should defer to your rational update." Mara claims this makes Reflection useless as a normative guide. It requires you to solve the problem of rational updating *before* you can apply it.

  **Why Mara is Half-Right (But Ultimately Wrong)**
  Mara is correct that Reflection cannot be the *foundation* of rational updating. You cannot derive Conditionalization solely from Reflection without smuggling in assumptions about what counts as "learning." If Reflection requires you to identify "legitimate" future credences in advance, it cannot be the sole criterion for legitimacy.

  However, Mara is wrong to call this "empty." A rule is not empty just because it has preconditions. Traffic laws don't apply if you're driving an ambulance in an emergency, but that doesn't make traffic laws empty; it just means they are default norms.

  Reflection functions as a **burden-shifting default**. It establishes a presumption of epistemic continuity. The principle asserts that *absent a specific defeater*, you must treat your future self as an epistemic peer to your current self. This is substantive work. It forbids you from arbitrarily discounting your future opinions simply because they are *future* opinions. Without Reflection, I could say, "I know I will learn evidence $E$ tomorrow, and I know I will update on $E$, but I still think my future self will be wrong just because time has passed." Reflection blocks this form of temporal arrogance.

  **The Survival of the Principle: Constitutive Norms**
  The way to save Reflection from Mara's charge is to reclassify it. It is not an *algorithm* for belief revision; it is a *constitutive norm* of being a single agent over time.

  To be a rational agent is to view your future self not as a stranger, but as a continuation of your own cognitive agency. When you plan, promise, or reason, you presuppose that your future beliefs will be connected to your current ones by rational bonds. Reflection codifies this presupposition.

  1.  **It Defines "Self-Distrust":** Reflection gives us a precise definition of when self-distrust is permissible. You are only permitted to violate Reflection if you can identify a specific causal mechanism (alcohol, hypnosis, fatigue) that severs the rational link between $t$ and $t'$. This prevents vague anxiety about the future from paralyzing current belief.
  2.  **It Prevents Epistemic Alienation:** If you reject Reflection entirely, you risk viewing your future self as a black box. You might think, "I don't know what I'll believe then, and I have no reason to think it'll be aligned with what I know now." This leads to a fragmentation of the self. Reflection demands that you view your future mind as transparent to your current mind, *unless* there is noise in the channel.
  3.  **It Is Not Circular, It Is Recursive:** Mara calls the dependency circular. It is better described as recursive. Rationality involves a package of norms: Conditionalization, Reflection, Calibration, etc. They support each other. You don't need to solve Conditionalization *before* applying Reflection; you apply them jointly to constrain your doxastic state. The fact that Reflection relies on a notion of "rational updating" doesn't make it empty; it makes it part of a coherentist web of epistemic norms.

  **The Qualified Survival**
  So, does a real, non-circular version survive? **Yes, but with a qualification.**

  The Reflection Principle survives as a **norm of integrity**, not a **norm of infallibility**.
  *   **What is dead:** The idea that Reflection is a standalone Dutch Book argument that forces you to defer to *any* future credence. The Christensen cases killed that.
  *   **What is dead:** The idea that Reflection can tell you *which* future changes are rational without outside input. Mara is right that you need an independent account of what counts as "learning" vs. "corruption."
  *   **What survives:** The normative requirement that you must presume your future self's competence. The burden of proof lies on the *distrust*. If you cannot point to a defeater (like the booze in Christensen's case), you are rationally required to defer.

  **Conclusion**
  You and Mara should call a truce, but you get the final word. Mara correctly identified that Reflection cannot be the *sole* engine of diachronic rationality; it needs a theory of information and rationality to tell it when to engage. But you are right that this doesn't kill the principle.

  Reflection survives because it answers a question that Conditionalization cannot: *Why should I care about my future beliefs at all?* Conditionalization tells you how to move from $A$ to $B$. Reflection tells you that $B$ is still *yours*. It is the principle that binds your temporal slices into a single agent. As long as we view rationality as something that persists through time, Reflection remains a necessary constraint on how we relate to our future minds. It is not empty; it is the glue of diachronic identity.
