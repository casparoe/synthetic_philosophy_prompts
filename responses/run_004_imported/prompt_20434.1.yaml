answer: |-
  Friends, family, colleagues, and neighbors.

  We are here to honor [Aunt's Name]. And because she was a woman who valued clarity above comfort, I need to begin with a request she made before she died.

  She asked that we not speak of her today as a "kind" woman. She asked that we not call her "generous." She knew those words are usually meant as compliments, but she felt they softened the reality of who she was and what she believed. To call her generous implies she gave more than was required, that she went above and beyond the call of duty. She did not believe there was an "above and beyond." She believed there was only what was needed, and what was not.

  For forty years, she worked as a nurse. Many of you in this room worked beside her. You know that for her, nursing was not just a job; it was an acknowledgment of a fundamental fact: that suffering exists, and when we have the capacity to relieve it, we must.

  She lived her personal life by that same measure. She calculated her expenses, kept what was necessary to continue her work and sustain her health, and gave the rest away. She did not do this to be praised. She did not do this to feel good about herself. She did it because, in her view, to do otherwise would have been to ignore a simple equation. She often told me that she hadn't done anything special; she had simply refused to look away from the math.

  I know that for many of us, hearing this creates a quiet tension. We live differently. We save for our children's education, we take vacations, we keep a buffer for our own security. We operate under the assumption that we are allowed to prioritize our own lives, our own families, and our own small circles of care.

  [Aunt's Name] knew that. She did not judge you for it. And she would not want me to judge you for it today.

  Grief is not the time to settle accounts with ourselves. But part of honoring her is honoring the truth of her life, even when that truth is demanding. She lived with a rigorous integrity that is rare. She stripped away the ego from the act of helping. She didn't want your gratitude; she wanted the work to be done.

  There is a comfort in thinking of her as a saint, because saints are exceptions. Saints are people we admire from a distance so that we don't have to follow them. But she wasn't a saint. She was a woman who made a choice to live without the usual exemptions we grant ourselves.

  So, how do we carry this? We do not carry it as a burden of guilt. Guilt helps no one, least of all the dead. We carry it as a measure of what is possible.

  When you leave here today, you do not need to empty your bank accounts. You do not need to abandon your own plans. But perhaps, in the quiet moments of your week, when you encounter a need that you could meet at some cost to yourself, you might pause. You might remember her. You might remember that there was someone who looked at that cost and decided it didn't matter as much as the need.

  She loved us. I know she would say that "love" is just another word for "acting in the best interest of others," but I also know that I felt cared for by her. I know my cousins did. I know her patients did. She showed us that love isn't always a warm feeling; sometimes, it is a cold, hard discipline. Sometimes, it is simply doing what is required, even when it is difficult. Even when no one is watching. Even when you could easily choose otherwise.

  She asked us not to soften her story. So I will not. She was not a kind woman in the way the world usually means it. She was something more challenging. She was a just woman. She was a clear woman. She was a woman who saw the world as it is, and gave it everything she had.

  We will miss her. We will miss her honesty. And we will miss the quiet, uncompromising example she left in her wake.

  Rest well, [Aunt's Name]. The work is done.
