      *   *Respectful:* Honoring her specific request is paramount.
      *   *Inclusive:* Avoiding moral superiority. The audience shouldn't feel like "sinners" compared to her "saintliness."
      *   *Grounded:* Focus on her actions and her reasoning, not abstract philosophy jargon.

  3.  **Key Themes to Address:**
      *   Her profession (nursing).
      *   Her financial choices (giving away earnings).
      *   Her motivation (duty/requirement, not generosity/kindness).
      *   The impact on others (without framing it as a rebuke).
      *   The legacy (what do we do with this example?).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the gathering and the specific instruction she left. This sets the stage immediately. It validates her wish while preparing the audience for something different than a standard eulogy.
      *   **Her Life/Work:** Mention her nursing. This is common ground. Everyone respects nurses. Connect her work to her philosophy without using the word "utilitarianism." Frame it as "seeing need and meeting it."
      *   **The Hard Truth (Her Philosophy):** Address the money and the "requirement." This is the tricky part. How to say "she didn't think she was being nice, she thought she was being correct" without sounding cold? Use her own framing: clarity, duty, removing the ego from the act.
      *   **Addressing the Audience (The "Indictment" Risk):** This is crucial. I need to bridge the gap between her extreme standard and the audience's normal lives. The key is *gratitude* and *reflection*, not *guilt*. Frame her life as a challenge or a compass, not a gavel. Acknowledge that her path was hers, and we are here to honor *her*, not to judge ourselves.
