answer: |-
  **MEMORANDUM**

  **TO:** Fellowship Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Pre-Offer Field Placement Requirement

  As we prepare to vote in three weeks on the future of our early-career fellowship requirements, I am writing to recommend that we **drop the mandatory unpaid, self-funded field placement** as a condition for finalist selection.

  I offer this recommendation not merely on ethical grounds, but on the grounds of selection efficacy. Having spent thirty-five years studying signaling theory in avian systems, and having recently engaged deeply with the philosophical literature surrounding the Handicap Principle, I believe the current policy relies on a misapplication of biological signaling models. It fails to screen for the traits we intend to measure and introduces noise that degrades the quality of our selection.

  However, before detailing why this mechanism fails, I want to address the strongest version of the argument for retaining it.

  ### The Strongest Case for Retention: Resilience as a Trait

  The long-serving members of this committee argue that field biology demands a specific kind of fortitude that cannot be assessed via transcript or interview. In their view, the placement is not simply a skills test; it is a filter for *commitment* and *resilience*.

  This is a robust argument. Fieldwork is physically grueling, socially isolating, and often frustrating. A candidate who is merely intellectually curious but lacks the tenacity to endure discomfort will fail in the field, wasting foundation resources. From this perspective, a costly barrier is a feature, not a bug. It mimics the natural world, where only individuals in peak condition can afford to produce costly ornaments. The argument is that by requiring a sacrifice of time and money, we ensure that only those with a "high-quality" dedication to the discipline will apply. We are not just selecting for intelligence; we are selecting for the willingness to endure hardship for the sake of data. To remove the cost, proponents argue, is to invite applicants who view field biology as a theoretical pursuit rather than a vocation, increasing the risk of attrition post-award.

  ### Why the Handicap Analogy Fails Here

  While the intuition behind the "resilience filter" is sound, the mechanism we are using to enforce it is biologically and economically flawed. My concern stems from the specific conditions required for a "handicap" to function as an honest signal of quality.

  In evolutionary biology, for a costly signal to remain honest (as Zahavi proposed and Grafen later modeled), the cost must be **differential relative to quality**. In peacocks, the tail is costly to grow and carry. However, the *marginal cost* of that tail is lower for a high-quality male than for a low-quality male. A weak male cannot fake the signal because the cost would crush his survival odds; a strong male can bear it easily. The cost correlates with *fitness*.

  In our current fellowship requirement, the cost is financial.
  1.  **The cost is not differential relative to research quality.** A brilliant biologist from a low-income background faces a prohibitive absolute cost (six weeks of lost wages plus travel expenses). A mediocre biologist from a wealthy background faces a negligible cost.
  2.  **The signal correlates with the wrong trait.** Under the current system, the "honest signal" being sent is not *commitment to science* or *field resilience*; it is *access to capital*.

  By maintaining this requirement, we are not selecting for the "fittest" researchers in the Zahavian sense. We are selecting for the wealthiest. Philosophical debates on signaling (such as those by Bergstrom and Lachmann) emphasize that if the cost of signaling is independent of the underlying quality being signaled, the system becomes unstable or selects for the wrong variable. We are inadvertently filtering for financial safety nets, which have no correlation with a candidate's ability to trap birds, analyze data, or endure field hardships.

  Furthermore, the "resilience" argument conflates *financial resilience* with *field resilience*. Enduring a period of unpaid work requires a bank account, not necessarily the grit to sleep in a blind for six weeks. We are testing the wrong variable.

  ### Recommendation and Path Forward

  I recommend we **drop the mandatory unpaid pre-offer placement**.

  This does not mean we abandon the assessment of field competence or commitment. It means we must align our selection costs with the traits we actually value. If we wish to test field resilience, the cost should be paid in *effort*, not *dollars*.

  I propose the following alternative:
  1.  **Selection First:** Make fellowship offers based on merit, proposal, and references.
  2.  **Funded Probation:** Incorporate the six-week field placement as the *first phase* of the fellowship, fully funded by the foundation.

  This modification satisfies the Old Guard's requirement for a rigorous field test (the "handicap" of effort remains) while satisfying the New Guard's equity concerns (the financial barrier is removed). It ensures the "cost" of the signal is borne by the candidate in sweat and time (which correlates with ability), rather than in cash (which correlates with wealth).

  We have a responsibility to ensure our selection criteria are as rigorous scientifically as the research we fund. Just as we would not accept a confounding variable in a dataset, we should not accept a confounding variable in our hiring process.

  I look forward to discussing this further at our next meeting.

  Respectfully,

  [Your Name]
  Committee Member
