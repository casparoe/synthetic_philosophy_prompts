      *   *Crucial Distinction:* Is the surrogate goal an *addition* to the utility function or a *replacement* for the vulnerable channel?
      *   *The Asymmetry:* The asymmetry lies in the *cost of defense* vs. *cost of loss*.
          *   Real Goal ($Y$): High cost if lost. Hard to defend (maybe).
          *   Surrogate ($X$): Low cost if lost (by design). Easy to defend (by design).
      *   *The Trick:* The agent must make it *common knowledge* that $X$ is now the trigger for retaliation/defense, while simultaneously ensuring $Y$ is *inaccessible* or *less accessible* to the threatener.
      *   *Wait, the user's objection is deeper:* If the predictor sees I defend $X$ exactly like $Y$, then $X$ *becomes* a real value. So now I have $Y$ and $X$. If the threatener can threaten both, I'm worse off.
      *   *Counter:* The strategy relies on the threatener being *rational*. If the threatener knows attacking $Y$ triggers the same response as attacking $X$, but attacking $X$ is "cheaper" for the threatener (or equally effective for leverage), they might switch. But if I value both, they can threaten both.
