answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two philosophers of science, Elena (Antirealist) and Marcus (Structural Realist), are clearing away empty espresso cups. They have just attended a colloquium on scientific change.*

  **Elena:** You looked satisfied during the Q&A, Marcus. But surely you saw the hole in the speaker's defense of realism. It's the same old story. Laudan's list hasn't gotten shorter. Phlogiston, caloric, the humoral theory of medicine. Success is a terrible proxy for truth.

  **Marcus:** Laudan's Pessimistic Meta-Induction is the starting point, Elena, not the finish line. It forces us to refine *what* we are realists about. That's why Worrall's structural realism is the only viable path. We don't need to believe in the *nature* of the entities. We just need to believe in the structure of the relations.

  **Elena:** Ah, the Fresnel escape clause. The classic move. Fresnel's elastic ether was wrong, but his equations for reflection and refraction were right. Maxwell came along, tossed the ether, kept the math. Therefore, we should be realists about the math.

  **Marcus:** Precisely. It's the best argument against the PMI. History isn't just a graveyard of false ontologies. It's a preservation society for mathematical structure. When Fresnel derived the laws of polarization using transverse vibrations in a solid ether, he got the structure of the optical phenomena correct. When Maxwell derived the electromagnetic theory of light, he didn't invent new optics; he recovered Fresnel's results from a deeper set of field equations. The structure was conserved across the revolution.

  **Elena:** "Conserved" is doing a lot of heavy lifting there. Let's look at the case closely, not just the slogan. You say the structure was preserved. But structure is relations between *relata*. Fresnel's equations described the displacement of a mechanical medium. The variables stood for physical displacements of ether particles.

  **Marcus:** Sure, the ontology of the relata changed. But the functional dependencies remained.

  **Elena:** That's my point. If the relata change from "mechanical displacement of a solid" to "oscillating electric and magnetic field vectors," in what sense is it the *same* structure? It's like saying the structure of a family tree is preserved when you replace the people with corporate shareholders. The graph looks the same, but the relations—kinship versus ownership—are fundamentally different. If you strip away the physical interpretation of the variables, you aren't left with "structure" in a realist sense. You're left with a formal calculus.

  **Marcus:** But that formal calculus constrains the world. That's the realist bite. It's not just an instrument for prediction. The reason Fresnel's equations worked wasn't magic. It was because the world actually behaves *as if* those structural relations hold. Maxwell showed us *why* they hold—because light is electromagnetic—but he didn't negate the structural claim Fresnel made about how light interacts with matter at boundaries.

  **Elena:** Did he though? Let's get technical. Fresnel's theory relied on specific boundary conditions regarding the elasticity and density of the ether. He had to make ad hoc assumptions about how the ether behaved at the interface of two media to get the reflection coefficients to match experiment. Maxwell didn't preserve those assumptions. He derived the boundary conditions from the continuity of the electromagnetic field.

  **Marcus:** He preserved the *output* structure. The Fresnel equations emerge as a limiting case of Maxwell's theory.

  **Elena:** "Limiting case" is the realist's safety net. But if the derivation requires changing the physical meaning of every term in the equation, you haven't preserved the structure; you've mapped a new theory onto the old phenomenology. Worrall wants to say we should believe the structure is *true*. But if the structure is defined purely mathematically, devoid of the ontological commitments that gave the variables meaning, what truth-value does it have? A differential equation isn't true or false on its own. It's true or false of *something*. If the "something" (the ether) doesn't exist, in what sense is the structure "real"?

  **Marcus:** This is the "structure without relata" objection, and I think it conflates epistemology with ontology. We don't know the intrinsic nature of the relata. Maybe we never will. But we do know that there is a causal structure out there that mirrors our mathematics. The success of Fresnel wasn't just that he saved the phenomena; it's that he latched onto a constraint nature imposes on light. Maxwell confirmed that constraint. The realism is in the constraint, not the stuff being constrained.

  **Elena:** But that sounds suspiciously like a sophisticated instrumentalism. If I say, "I believe the equations work, but I make no claim about what the variables represent, other than that they track observable regularities," am I a realist? Laudan would say no. You've retreated to a position where "truth" just means "empirically adequate mathematical mapping."

  **Marcus:** No, because I'm claiming the structure exists independently of our observations. The electromagnetic field has a structure even when no one is measuring reflection coefficients. Fresnel latched onto that independent structure, even though he misidentified the substrate.

  **Elena:** Here is the weak point, Marcus. How do you distinguish "preserved structure" from "retrofitted correspondence"? Maxwell knew Fresnel's optics worked. He built his theory to accommodate it. Of course the structure matches; he engineered it to. That doesn't prove the structure was "out there" waiting in Fresnel's theory. It proves Maxwell was a good theorist.

  **Marcus:** That's too cynical. Maxwell didn't just fit the curve. He unified optics with electricity and magnetism. The fact that Fresnel's specific structural claims about polarization emerged from a completely different domain (electrodynamics) is the miracle. If structural realism were just retrofitting, we wouldn't see independent structural constraints popping up across different domains. The fact that the wave equation structure survives the ontological shift suggests the structure is more robust than the ontology.

  **Elena:** Robust, yes. Real? Maybe. But consider the cost. To save realism, you have to thin out the concept of "truth" so much that it loses its explanatory power. You say we should believe in the structure. But if I ask, "Why does light reflect at this angle?" and you say, "Because the structural relations dictate it," you haven't answered the question. You've just pointed to the math. Fresnel *did* answer the question: "Because the ether vibrates this way." It was a false answer, but it was an explanation. Your structural realism gives up on explanation in favor of... what? Isomorphic mapping?

  **Marcus:** It gives up on *mechanistic* explanation of the ultimate substrate, yes. But it retains structural explanation. We explain phenomena by showing how they fit into the causal network described by the equations. We don't need to know what the nodes *are* to know how they are connected. In the Fresnel case, the connection between angle of incidence and polarization was real. The ether was the false picture of the node.

  **Elena:** But the "connection" itself depended on the nature of the nodes! Fresnel derived his equations *from* the assumption of an elastic solid. If you remove the elastic solid, the derivation collapses. Maxwell had to provide a *new* derivation. So the structure wasn't "preserved" in the theory; it was preserved in the *phenomena*, and then re-derived.

  **Marcus:** It was preserved in the theoretical commitment to the form of the wave equation.

  **Elena:** That's a very thin commitment. Every wave theory since has used a wave equation. Does that mean the "wave equation" is the ultimate truth of the universe? Or is it just the only mathematical tool we have for modeling periodic propagation? If the latter, then the preservation of structure tells us about *us*, not about the world. It tells us that human mathematicians keep finding the same tools useful. That's Kantianism, Marcus, not realism.

  **Marcus:** It's not Kantian if the structure constrains our predictions in ways we didn't anticipate. Fresnel predicted the bright spot in the shadow of a circular obstacle—the Poisson spot. That wasn't just fitting existing data. That was the structure dictating a new phenomenon. And that structural prediction held up when the ontology was swapped. That suggests the structure is tracking something mind-independent.

  **Elena:** I grant the prediction. But the PMI applies to the *interpretation* of that prediction. Fresnel thought the spot proved the wave nature of the ether. We think it proves the wave nature of the field. If the "wave nature" itself is just another ontology that might be discarded—say, by a future quantum gravity theory that discretizes spacetime—then your "structure" is just as perishable as the ether. You're betting that the math won't change, but history suggests even the math gets reinterpreted.

  **Marcus:** If spacetime is discretized, the wave equation will emerge as a limiting case there, too. The structure doesn't vanish; it gets embedded. That's the point of structural continuity. It's not that the equations are sacred, but that the structural relationships they capture are stable across theory change.

  **Elena:** "Stable" is not "True." And "Embedded" is not "Real." You've built a fortress, Marcus, but you've locked yourself inside with only the maps, no territory. If you can't tell me what the structure is *of*, other than "the world," you haven't escaped instrumentalism. You've just given it a grander name.

  **Marcus:** And if you throw out the structure because you can't see the relata, you're left with no reason to think science progresses at all. You're left with Laudan's graveyard. I'd rather believe the map is tracing a real terrain, even if I can't describe the soil.

  **Elena:** Then we're at the impasse. You see a terrain traced by the map. I see a map that works well enough until we need a new one. And Fresnel's map worked very well, until it didn't. The question isn't whether the math survived. It's whether "structure" without "stuff" is enough to call it truth.

  **Marcus:** I think history says yes.

  **Elena:** And I think history says: wait for the next revolution.

  *They sit in silence for a moment, the noise of the coffee shop filling the gap between the map and the territory.*
