      *   **Realist Response (SR):** Acknowledge PMI but pivot to Worrall. The Fresnel case is the shield. The math survived the ontology.
      *   **Antirealist Pushback (AR):** This is the core. Challenge the definition of "structure." If you strip away the ether, what are the variables *about*?
      *   **Realist Defense (SR):** The structure captures the causal dependencies, even if the relata change. The equations constrain the world.
      *   **Antirealist Deep Dive (AR):** Attack the continuity. Did Maxwell actually keep Fresnel's structure? Or did he reinterpret it so heavily that calling it "the same structure" is a stretch? Mention the transverse vs. longitudinal wave issue or the nature of the field.
      *   **Realist Nuance (SR):** Admit it's not perfect identity, but a limiting case correspondence. That's enough for "approximate truth" of structure.
      *   **Antirealist Knockout Attempt (AR):** The "No Miracles" argument flip. If structure is all there is, isn't that just sophisticated instrumentalism? Why call it realism?
      *   **Closing:** Leave it unresolved but sharpened. The tension remains between "structure without nature" being meaningful realism or disguised antirealism.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Is the AR just repeating PMI? *Correction:* Make sure AR focuses on the *interpretation* of the Fresnel equations. Ask about the physical meaning of the variables.
      *   *Check:* Is the SR too vague? *Correction:* Have SR specify *what* was preserved (the boundary conditions, the wave equations).
      *   *Check:* Is it too technical? *Correction:* Keep the math conceptual (equations, variables) rather than writing out integrals, but ensure the philosophy of math is clear.
