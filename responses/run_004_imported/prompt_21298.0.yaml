      *   *For the Novel:* The son could be genuinely torn (believing the justice part) but using the prudence argument to convince his father (who is more calculating). Or the son could be adopting Mill's logic that reform *saves* capitalism from itself.
      *   *Key Insight:* Mill isn't saying "trick them." He's saying "accommodate them enough to prove socialism isn't needed *yet*."

