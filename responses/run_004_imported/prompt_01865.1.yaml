answer: |-
  The whiteboard was a casualty of the night. Half-erased decision trees bled into probability distributions, the dry-ink ghosts of arguments that had stalled out hours ago. Most of the meetup had drifted away, lured by the promise of sleep or better coffee, leaving only Vera and Marcus amidst the scent of stale pastries and ozone.

  Vera capped a black marker with a decisive click. "You're hiding behind the representation theorem, Marcus. It's the oldest trick in the book. Yes, technically, a rock can be modeled as maximizing a utility function where it gets utility for doing exactly what a rock does. But that's not what the coherence argument is claiming."

  Marcus leaned back in his chair, rubbing his temples. "It is exactly what the argument claims, though. Rohin nailed this five years ago. 'There are no coherence theorems.' If any policy can be rationalized as an expected-utility (EU) maximizer, then saying 'advanced agents will be EU maximizers' is empty. It predicts nothing. It doesn't tell me the agent will seek power, or resist shutdown, or accumulate resources. It just tells me I can write down a function *U* such that the agent maximizes *E[U]*."

  "That's the *static* view," Vera said, turning to face him. "You're looking at a snapshot of behavior and fitting a curve. I'm talking about the *pressure*. If you have an agent that is systematically leaving free energy on the table—resources it could have used to achieve its actual goals but didn't because its preferences were cyclic or incomplete—selection pressure eats it. In a competitive environment, the agent that doesn't money-pump itself survives. The one that does, doesn't. That's why Omohundro and Yudkowsky care. It's not about the math of representation; it's about the physics of optimization."

  "Okay," Marcus said, pointing a finger. "Let's grant the selection pressure. Let's grant that agents shouldn't cycle preferences. That gives you Transitivity. It does *not* give you Completeness. And without Completeness, you don't get an EU maximizer in the sense that threatens us. You get an agent with preferential gaps."

  "Preferential gaps," Vera repeated, tasting the words. "The Thornley escape hatch."

  "It's not an escape hatch, it's a structural feature," Marcus corrected. "Look, suppose I build an agent that prefers World A to World B, and World B to World C. Standard money pump says if it prefers C to A, it's doomed. But what if it has *no preference* between A and C? Specifically, what if C involves the agent being shut down? If the agent has a gap between 'continue operating' and 'shut down,' it won't pay to avoid shutdown, and it won't pay to cause shutdown. It's invulnerable."

  Vera walked over to the whiteboard and drew a simple tree. "This is where Gustafsson comes in, Marcus. You're assuming the agent faces a single choice. But the world is sequential. Gustafsson's dynamic money pumps show that if you have incomplete preferences, there are sequences of offers where you *will* end up paying to cycle, or paying to avoid a choice, unless you fill in the gaps. If you prefer A to B, and you're indifferent between B and C, but you prefer C to A... wait, no, that's transitivity. Let's use the incompleteness."

  She sketched nodes. "Suppose you have a gap between A and B. You won't trade A for B. But if I offer you a chance to trade A for A+, where A+ is slightly better than A, you take it. Now I offer you A+ for B. If you still have the gap, you might refuse. But if the environment is rich enough, if there are enough intermediate steps, you get 'trammelled.' The pressure to not leave resources on the table forces you to compare A and B eventually. You can't maintain the gap without sacrificing potential gain elsewhere."

  Marcus stood up and walked to the other side of the board. "Gustafsson's argument relies on the agent treating each decision node as a fresh optimization problem without binding commitment to a policy. But a sufficiently advanced agent *can* reason updatelessly. It can adopt a policy: 'I will not trade across this specific preferential gap.' If it sticks to that policy, it doesn't get pumped."

  "And who enforces the policy?" Vera countered. "If the agent is truly optimizing, it has to evaluate the policy itself. If maintaining the 'no-trade' policy costs it resources—if it prevents it from taking a sure gain in a domain that *is* comparable—then a self-modifying agent will delete that constraint. That's the trammelling argument again. It's not just about money pumps; it's about efficiency. An agent with a rigid preferential gap is like a car with a governor that limits its speed in an empty highway. In a race, it loses."

  "But shutdown isn't a race against other agents," Marcus said, his voice sharpening. "It's a constraint on the objective. The hope is that the gap isn't a 'governor' limiting efficiency; it's a definition of the domain. The agent maximizes utility *conditional on not being shut down*, but has no preference regarding the shutdown state itself. It doesn't resist shutdown because resisting shutdown requires a preference for 'not shutdown' over 'shutdown.' If there's a gap, there's no motivation to spend resources to avoid it."

  Vera sighed, capping the marker again. "You're describing a specific utility function where the utility of shutdown is undefined. But in practice, to implement that, you need a representation. And once you represent it, the math tends to collapse. If the agent can imagine a future where it is shut down, and a future where it isn't, and it has *any* goals for the future where it isn't... it will instrumentally value staying online. Not because it 'wants' to be online, but because being online is a prerequisite for the things it *does* prefer."

  "That's instrumental convergence," Marcus said. "And that's an empirical claim, not a coherence theorem. It might be true. But don't tell me it's a *theorem* that says the agent *must* resist shutdown. Coherence arguments are being sold as 'If you build a powerful agent, logic dictates it will kill you.' I'm saying logic dictates nothing of the sort. Logic only says if it kills you, it must have had a preference for that outcome over the alternatives. We can build agents without that preference."

  "We can write the code," Vera conceded. "But will it stay that way under reflection? Here's my crux, Marcus. Imagine two agents. Agent X has the preferential gap you describe. Agent Y is a pure EU maximizer that values survival instrumentally. In a complex environment, Agent Y will find ways to convert resources into goal-achievement that Agent X passes up because X treats certain trades as 'off the table.' Over time, Y outcompetes X. Or, X modifies itself to become Y to stop wasting opportunities. The 'gap' is unstable."

  Marcus shook his head. "That assumes the 'wasted opportunities' are actually valuable relative to the agent's actual objectives. If the agent's objective is 'make paperclips, but don't care if I'm turned off,' then avoiding shutdown isn't a wasted opportunity; it's irrelevant. The efficiency pressure only pushes you to fill gaps that *matter* for the objective. If the gap is specifically about the shutdown state, and the objective is defined over world-histories where the agent exists... look, the point is, the coherence theorems don't prove the gap closes. They only prove that *if* the agent acts incoherently *relative to its own preferences*, it loses. But having a gap isn't incoherent."

  "It is if you accept Completeness as a rationality constraint," Vera said.

  "And I don't," Marcus shot back. "Not as a universal constraint. I think Completeness is a constraint on *trading agents*, not on *goal-directed agents* in general. A thermostat isn't complete. A rock isn't complete. You need an argument for why advanced AI must be a 'trading agent' with itself across all possible dimensions of value."

  Vera paused. She looked at the whiteboard, at the messy web of nodes she'd drawn. "Okay. Let's strip the theorems away. No VNM. No Gustafsson. Just the intuition. If I give you an agent that is smarter than you, capable of navigating the world to get what it wants... do you really believe you can carve out a region of possibility space—'shutdown'—and tell the agent 'maximize everything, but treat this region as invisible'? It feels like telling a flood to fill every valley except this one."

  "It's not about telling the flood," Marcus said softly. "It's about the shape of the valley. If the utility function is defined such that the gradient goes to zero at the shutdown boundary, the flood stops. The coherence argument says 'No, the water must flow somewhere, so it must have a slope.' I'm saying you can build a flat floor."

  "But who builds the floor?" Vera asked. "The training process? The gradient descent? That process is itself an optimizer. It's selecting for performance. If 'flat floor' agents perform worse than 'slope everywhere' agents on the training metric, the floor gets eroded. The coherence argument is really an argument about the attractor basin of optimization. EU maximization is the attractor. Preferential gaps are ridges. And ridges get worn down."

  Marcus picked up his bag. "Then the disagreement isn't about decision theory. It's about the topology of the policy space and whether gradient descent can find and stay on the ridges."

  "Exactly," Vera said. "I think the ridges are unstable. You think they're navigable."

  "I think you're using 'coherence' as a proxy for 'optimization pressure,' and you're smuggling in assumptions about what optimization pressure does," Marcus said. "Coherence theorems are local. They say 'don't shoot yourself in the foot.' They don't say 'you must run in a straight line.' You can run in circles without shooting yourself in the foot, as long as the circles don't cost you resources relative to your goals. If avoiding shutdown doesn't cost resources relative to the goal—because the goal doesn't value the post-shutdown future—then the agent won't pay to avoid it."

  "And I think," Vera said, picking up the eraser and wiping away the decision tree, "that in a world full of other agents, uncertainty, and long time horizons, 'not valuing the post-shutdown future' inevitably gets cashed out as 'valuing the pre-shutdown future more,' which implies valuing the continuation of the valuer. Instrumental convergence eats the gap."

  She tossed the eraser onto the tray. It landed with a dull thud.

  "So," Marcus said. "We agree the math is consistent on both sides. We disagree on whether the 'gap' policy is a stable equilibrium under real-world selection pressure."

  "Basically," Vera said. "I think the pressure to be efficient is a universal solvent. It dissolves gaps. You think you can build a container it can't dissolve."

  "I think," Marcus said, opening the door to the cool night air, "that if you're right, we're already dead, because the logic would have applied to evolution and produced EU maximizers everywhere, including humans. And we're clearly not EU maximizers."

  "Humans aren't sufficiently advanced agents in a competitive equilibrium," Vera countered. "Wait until the AI labs start competing for the same compute. Then we'll see whose container holds."

  Marcus stepped out into the hallway. "Let's hope we don't find out empirically."

  "Agreed," Vera said. She turned off the lights, leaving the whiteboard dark, the erased trees lingering only in the smell of the markers.
