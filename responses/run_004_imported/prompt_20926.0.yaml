      *   **Key Theme:** Frank Ramsey's philosophy (from the biography *Sheer Excess of Powers*). Specifically, the idea that the observer (the human) is central/big, and the universe/stars are small because *we* are the ones perceiving them. Rejection of the "we are just tiny specks" comfort.
      *   **Audience:** Old workmates and the user's Nan (grandmother). Most won't know Ramsey.
      *   **Constraint:** Must comfort people without using the "insignificant speck" trope the father hated. It needs to be accessible but true to his specific wish.
      *   **Tone:** Respectful, personal, philosophical but grounded, comforting.

  2.  **Deconstruct the Ramsey Philosophy for a General Audience:**
      *   *The Core Idea:* Subjective idealism/anthropocentrism in a poetic sense. The universe has no meaning without a mind to perceive it. Therefore, the human mind is the vessel of meaning.
      *   *The "Speck" Argument:* "You are small, the universe is big, so your problems don't matter." (Dad hated this).
      *   *The "Ramsey" Argument:* "You are the one looking. Without you, the stars are just cold gas. Your love, your work, your memories are the biggest things that exist because they are the only things that *mean* anything."
      *   *Translation:* Instead of "don't worry, you're small," say "worry matters, love matters, because *you* are the measure of things."

  3.  **Determine the Structure of the Eulogy:**
      *   **Opening:** Acknowledge the loss, welcome everyone (Nan, workmates).
      *   **The Hook:** Introduce the father's character (stubborn, thoughtful, specific).
      *   **The Story:** Mention the book (*Sheer Excess of Powers*) and the hospice incident. This explains *why* the eulogy might sound different.
      *   **The Philosophy (Simplified):** Explain the "stars are small" idea without getting bogged down in academic jargon. Focus on *human scale*.
      *   **Application to Dad:** How did he live this? (Work, family, Nan).
      *   **Comfort for the Audience:** How does this help them grieve? (Their grief proves his size. Their memories keep him big).
      *   **Closing:** A final farewell that reinforces the theme.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Keep it warm. "Thank you for coming." Acknowledge Nan specifically.
