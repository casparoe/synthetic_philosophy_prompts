answer: |-
  Here is a draft for the eulogy. It is written to be spoken aloud, with pauses and pacing in mind. It keeps the philosophy accessible for the workmates and Nan, focusing on the emotional weight of the idea rather than the academic side.

  ***

  **Eulogy for [Dad's Name]**

  Thank you all for being here. Especially Nan, for sitting right at the front where you belong. And thank you to Dad's colleagues and friends. I know many of you worked alongside him for decades, and seeing you here fills this room with the kind of noise and life he would have appreciated.

  When we lose someone, people immediately try to make the loss feel smaller. It's a kindness. They say things like, "Well, we're all just tiny specks in a vast universe," or "In the grand scheme of things, this is just nature taking its course." They try to comfort us by making us feel small, so the hole he left behind feels manageable.

  But if there is one thing I know about my father, it's that he hated that speech.

  A few years ago, Dad read a biography about a mathematician and philosopher named Frank Ramsey. Ramsey died young, but he left behind a radical idea about how we fit into this world. Dad got fixated on it. He carried it with him right up until the end.

  A few weeks before he passed, a hospice chaplain came to visit. The chaplain meant well. He told Dad to take comfort in the fact that we are all just small parts of a big, beautiful cosmos. Dad actually got annoyed. After the chaplain left, he told me that was exactly backwards. He said, "The universe is just cold rock and gas until a human being looks at it. I am the one doing the looking. Therefore, the stars aren't bigger than me. I'm bigger than them."

  He made me promise that no one would tell his friends and family that he was insignificant. He didn't want to be comforted by the idea that he didn't matter. He wanted to be remembered for the fact that he *did*.

  So, I'm not going to tell you that he's a tiny speck returning to the dust. Because he wasn't.

  To the universe, maybe we are small. But the universe doesn't know us. It doesn't love us. It doesn't remember us. *We* do that for each other.

  The Ramsey idea—the one Dad held onto—is that the human scale is the only scale that actually counts. A star is massive, but it's distant and cold. A hand holding yours in a hospital bed is small, but it's warm, and it's real. A career built over thirty years isn't a blip in time; it's a mountain of work that people stand on every day. A marriage that lasts until death isn't a statistic; it's the entire world for the people inside it.

  Dad lived his life on the human scale. He knew that "big" isn't about size or distance. "Big" is about impact.

  To his workmates here: You know how big he was. You know the problems he solved, the standards he set, the way he showed up. That didn't disappear. The work remains because the effort was real.

  To Nan: You knew him longer than anyone. You built a life together. That shared history is a universe all its own, and it is far more important than any galaxy spinning in the dark.

  And for those of us grieving: Do not let anyone tell you to minimize your pain. Do not let anyone tell you that your grief is small because life goes on. The reason this hurts so much is not because we are small, but because *he* was large. The weight of this loss is the proof of his significance.

  He refused to feel small next to the stars. He believed that the light in this room right now—the memories we share, the love we feel, the sadness that brings us together—that is the only light that matters. The stars are just background. We are the foreground.

  So, if you want to honor him, don't look up at the sky and think of how vast it is. Look around this room. Look at the people he touched. Look at the work he left behind. Look at Nan.

  That is the size of him. And on that scale, he is immense.

  Thank you, Dad, for teaching us that we are the ones who give the world its meaning. We will keep doing that for you.
