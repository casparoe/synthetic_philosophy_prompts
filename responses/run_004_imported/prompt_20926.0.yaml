      *   *Explaining the Idea:* How to say "I am bigger than the universe" without sounding arrogant? Focus on *meaning*. The universe is silent; we are the voice. The stars are distant; the hand holding yours is real.
      *   *Connecting to Workmates:* They knew him in his daily life. To them, he wasn't a speck. He was a mentor, a colleague, a problem solver. That impact is "big."
      *   *Connecting to Nan:* She knew him longest. The shared history is the "universe" they built together.
      *   *The Comfort:* Usually, we say "time heals" or "he's in a better place." Here, the comfort is: "His absence feels huge because he *was* huge. Don't minimize your grief."
      *   *Closing:* A send-off that invites them to look at the world differently.

  5.  **Refining the Tone:**
