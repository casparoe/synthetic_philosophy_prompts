prompt: |-
  I'm a PhD student in philosophy, and I've been asked to give the toast at my sister's wedding next month. She and her fiancé are both decision theorists who half-jokingly trace their whole relationship back to Frank Ramsey. I want the toast to use the actual argument of Ramsey's 'Epilogue,' not just his biography: his refusal to let the smallness of a human life, set against the size and age of the universe, diminish the seriousness of human love and commitment. The catch is that his argument relocates value away from size and duration altogether, so I can't lean on the standard wedding-speech promise that their love will 'last forever' or 'outlast the stars,' since that would smuggle the very standard Ramsey rejected back in. About a third of the guests will catch exactly what I'm doing; the rest just want a good toast. Could you write me roughly five minutes of remarks that pull this off?
