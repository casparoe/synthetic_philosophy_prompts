answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the sibling, and I'm also a philosophy student. Which means I have a professional obligation to overthink happy occasions. But luckily, the bride and groom have given me a perfect excuse to do exactly that.

  As many of you know, [Sister] and [Fiancé] are decision theorists. They met in a seminar room, not a bar. They half-jokingly trace their entire courtship back to Frank Ramsey. Now, for the two-thirds of the room who aren't currently wondering if Ramsey was a Bayesian, Frank Ramsey was a brilliant Cambridge philosopher who died tragically young, in 1930. He was twenty-six.

  And that brings me to the heart of what I want to say.

  Usually, at a wedding, the speaker talks about time. We talk about the past, how the couple met. We talk about the future, promising that their love will "last forever," or "stand the test of time," or "burn brighter than the stars." It's a lovely sentiment. But if I said that tonight, [Sister] and [Fiancé] would roll their eyes. And philosophically, they'd be right to do so.

  Because promising that your love will "outlast the stars" actually admits a defeat. It suggests that for love to matter, it has to be *big*. It has to be long. It implies that the value of a human life is measured against the size of the universe. And if we measure ourselves against the cosmos, we lose. We are tiny. We are brief. The stars will burn long after we are dust.

  But Frank Ramsey, in his final piece of writing, his "Epilogue," argued that this is a category error. He argued that we feel insignificant only because we are trying to measure human value with a cosmic ruler. We think that because the universe is vast in space and time, and we are small in space and time, we must be less *good* than the universe.

  Ramsey said: No. Goodness is not a physical quantity. It doesn't have mass. It doesn't have duration. A moment of kindness is not "less good" because it only lasts a minute. A human life is not "less meaningful" because it is shorter than the life of a galaxy. Value is intrinsic. It is located right here, in the specific choices we make, not in how long those choices echo into the void.

  So, [Sister] and [Fiancé], I am not going to promise you that your marriage will last forever. I cannot promise you that. None of us know how much time we get. Ramsey didn't get much.

  Instead, I want to propose something more radical, and something more Ramseyian. I want to toast the *seriousness* of your commitment, precisely *because* it is small.

  In a universe of blind physical forces, you two have chosen to create a pocket of meaning. You have chosen to bind your lives together. Ramsey argued that the "particular good" is good in itself. It doesn't need to contribute to a grand cosmic plan to be valuable. The love you offer each other tonight is not a down payment on eternity. It is a complete good, right now.

  The fact that the universe is indifferent to us does not diminish the seriousness of our care for one another. In fact, it heightens it. Because there is no cosmic script guaranteeing this works, the work you put into it is what generates the value.

  So, my wish for you is not that your love outlasts the stars. My wish is that you never feel the need to compare your love to the stars in the first place.

  May you find value in the Tuesday nights, not just the anniversaries. May you find significance in the quiet conversations, not because they build toward some grand legacy, but because they are true. May you understand that your commitment is not made smaller by the vastness of the world, but is made sacred by its locality.

  Ramsey wrote that we must find our goodness in the "particular." You have found it in each other. That is enough. It is enough for a life. It is enough for a marriage.

  So, if everyone could please raise a glass.

  To [Sister] and [Fiancé]. May your lives be good, not because they are long, but because they are yours.

  To the bride and groom.
