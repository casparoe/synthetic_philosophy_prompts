          *   Explain James's "Pragmatism." Focus on the *individual* and *psychological satisfaction*. Truth is a process.
          *   Highlight the conflict: Peirce wanted to secure science; James wanted to make room for faith.
      *   *Section 2: The "Ugly Name" Incident.*
