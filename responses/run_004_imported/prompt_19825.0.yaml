      *   *Is "Post-Truth" directly linked?* It's a genealogical link often cited by critics (e.g., Lee McIntyre), but philosophers defend Pragmatism against this. Need to present both sides.

  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "truth is what works for *me*" (James-ish but exaggerated) and "truth is what works for *science in the long run*" (Peirce) is sharp. (This is the most important distinction).

