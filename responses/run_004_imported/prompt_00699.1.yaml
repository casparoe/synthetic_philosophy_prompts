      *   **Eternalism (Ontology of Time):** Past, present, and future all exist equally. Time is like a dimension of space. (Opposite: Presentism).
      *   **Perdurantism (Theory of Persistence):** Objects persist through time by having temporal parts. You are a "spacetime worm." At any instant, only a part of you exists. (Opposite: Endurantism).
      *   **Endurantism:** Objects persist by being wholly present at each moment they exist.
      *   **Presentism:** Only the present exists.

  3.  **Address the Ambiguity ("Four-Dimensionalism"):**
