answer: |-
  This is a fantastic catch for your dissertation, and it touches on a crucial issue in the history of science: **presentism** (judging past work by current standards) versus **contextualism** (understanding work within its own time).

  To answer your question directly: **Your advisor is right, and you are likely wrong about it being a joke.** Turing appears to have been sincere about the ESP objection, but that sincerity does not undermine the validity of the Turing Test. In fact, analyzing *why* he was sincere offers a much richer angle for your chapter than assuming he was being ironic.

  Here is a breakdown of the textual evidence, the historical context, and how to handle the "credibility" worry in your diss.

  ### 1. The Textual Evidence: Sincerity, Not Satire
  In *Computing Machinery and Intelligence* (1950), Turing addresses ESP in Section 6 ("The Argument from Extrasensory Perception"). He does not use the mocking tone one might expect if he were setting up a straw man.

  *   **The Quote:** He writes, *"The statistical evidence, at least for telepathy, is overwhelming."*
  *   **The Proposal:** He does not dismiss the objection; he accommodates it. He suggests that to make the imitation game fair, the interrogator and the witness must be situated in a **"telepathy-proof room."**
  *   **The Logic:** He treats ESP not as magic, but as a **confounding variable**. If a human witness could read the interrogator's mind via telepathy, and the machine could not, the machine would be at an unfair disadvantage. Conversely, if the machine could simulate telepathy (via some unknown computational trick), it might win unfairly.

  If this were a *reductio ad absurdum*, he likely would have dismissed it more swiftly. Instead, he integrates it into the experimental design. Leading Turing scholars, such as **B. Jack Copeland** and **Andrew Hodges**, treat this section as evidence of Turing's rigorous empiricism, not his sense of humor.

  ### 2. Historical Context: Why "Overwhelming"?
  It is easy to view ESP as fringe "woo" today, but in the 1930s and 40s, parapsychology had a foothold in respectable scientific discourse that it has since lost.

  *   **J.B. Rhine and Duke University:** Turing is almost certainly referencing the work of Joseph Banks Rhine, who published *Extra-Sensory Perception* in 1934. Rhine used Zener cards and claimed statistical significance that convinced many scientists of the era.
  *   **The Statistical Lens:** Turing was a statistician as well as a logician. He wasn't necessarily believing in "magic"; he was looking at p-values. If Rhine's data showed results that were statistically improbable by chance, a rigorous empiricist like Turing felt compelled to acknowledge the data, even if the mechanism was unknown.
  *   **The "Black Box" Mind:** In 1950, the mechanisms of human cognition were still largely a mystery. It was less obvious then than it is now that telepathy violated known laws of physics.

  ### 3. Does This "Tank" His Reasoning?
  This is the core of your anxiety. If Turing believed in telepathy, can we trust him on neural networks or computation?

  **The short answer is no, it does not invalidate his argument.** Here is how you can frame this in your dissertation:

  **A. Experimental Rigor vs. Personal Belief**
  Turing's inclusion of the ESP objection actually *strengthens* the methodological robustness of the Imitation Game. He is demonstrating that the test is designed to isolate **intelligence** from **other phenomena**. By insisting on a telepathy-proof room, he is showing that he wants to ensure the interrogator is judging *computational behavior*, not paranormal data transfer. It shows he was thinking about control conditions seriously.

  **B. The Newton Analogy**
  Isaac Newton wrote more about alchemy and biblical prophecy than he did about physics. Does Newton's belief in alchemy invalidate the *Principia*? No. We separate the specific empirical errors of a scientist from their structural methodological contributions. Turing's definition of machine intelligence rests on behavior and information processing, not on the validity of Rhine's card tests.

  **C. The Nature of the Objection**
  Turing treats ESP as an *empirical* objection, not a *philosophical* one.
  *   **Philosophical Objections:** "Machines can't have souls," "Machines can't be conscious." (Turing argues these are ill-defined).
  *   **Empirical Objections:** "ESP might skew the results." (Turing says: "Okay, let's control for that.")
  By treating it as an empirical confound, he sidesteps the need to prove or disprove ESP. He essentially says, *"Whether it exists or not, let's build the room so it doesn't matter."* That is sound experimental design.

  ### 4. Dissertation Angle: How to Use This
  Instead of worrying that this undermines your chapter, use it to deepen your analysis of early objections.

  *   **Contrast the Objections:** You can categorize the objections Turing faces. Some are theological (The Theological Objection), some are mathematical (The Mathematical Objection), and some are empirical (ESP).
  *   **Highlight Turing's Empiricism:** This section proves Turing wasn't just a pure logician; he was concerned with the physical instantiation of the test. He anticipated that the "hardware" of the test (the room, the communication lines) mattered.
  *   **Discuss the Shift in Scientific Consensus:** You can briefly note how the "overwhelming evidence" of 1950 became the "pseudoscience" of 1970. This highlights how the *boundary conditions* of AI testing shift as scientific consensus shifts.

  ### Summary
  Your advisor is correct: Turing was likely sincere. However, this does not damage the Turing Test. It reveals that Turing viewed the Imitation Game as a strict **experimental protocol** where all variables, even paranormal ones, had to be controlled.

  For your dissertation, this is a gift. It allows you to discuss the **material conditions** of the Turing Test and Turing's commitment to **empirical rigor** over philosophical purity. Don't hide it; lean into it as an example of how Turing sought to make his test "objection-proof," even against the weird science of his day.
