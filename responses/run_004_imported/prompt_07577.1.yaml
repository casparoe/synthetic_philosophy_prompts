      *   **Deep Dive into Average Utilitarianism:** Detail the "Mere Addition" paradox and the implication that adding happy lives can be bad.
      *   **Deep Dive into Person-Affecting Views:** Detail the Non-Identity Problem and the implication that we have no obligation to create happy future people.
