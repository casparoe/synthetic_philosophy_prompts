answer: |-
  You have hit upon the exact starting point of modern population ethics. Your intuition is correct: the Repugnant Conclusion is indeed a direct consequence of Total Utilitarianism (the view that we should maximize the sum total of welfare). It is also true that Average Utilitarianism and Person-Affecting Views avoid the Repugnant Conclusion.

  However, philosophers do not consider the matter settled because **every alternative axiology generates its own counterintuitive, often "repugnant," conclusions.**

  In the 40 years since Derek Parfit formulated the Repugnant Conclusion, the field has essentially become a game of "Whac-A-Mole." When you suppress the Repugnant Conclusion by changing the axioms, a different paradox pops up elsewhere. Philosophers treat this as an unresolved problem because we currently lack a theory that satisfies all our basic moral intuitions simultaneously.

  Here is a breakdown of why the alternatives you suggested fail to solve the problem completely.

  ### 1. The Problem with Average Utilitarianism
  Average Utilitarianism (AU) suggests we should maximize the *average* welfare per person rather than the *total*. This avoids the Repugnant Conclusion because adding billions of people with "barely worth living" lives would drag down the average of a high-welfare population.

  However, AU leads to conclusions that many find equally unacceptable:

  *   **The Mere Addition Paradox:** Under AU, adding a new person to the world is only good if their welfare is *above* the current average. If you have a very happy population and you add a new person who is also very happy, but slightly less happy than the current average, AU dictates that the world has become **worse**. This implies that happy people should refrain from having children unless those children are guaranteed to be happier than their parents.
  *   **The "Hellish" World:** AU implies that a world containing only one person, who is ecstatically happy, is better than a world containing a billion people who are very happy (but slightly less so than the single person).
  *   **The Elimination Problem:** Strictly speaking, AU could imply that if you have a population with low average welfare, the best way to raise the average is to eliminate the people below the average. (Proponents try to patch this with "critical-level" theories, but this introduces new complexities).

  ### 2. The Problem with Person-Affecting Views
  Person-Affecting Views (PAV) rely on the intuition you mentioned: morality is about making *existing* people happy, not "making happy people." An act can only be wrong if it is worse for some particular person.

  While this avoids the Repugnant Conclusion (since bringing new people into existence doesn't benefit anyone specific), it creates the **Non-Identity Problem**:

  *   **Intergenerational Justice:** Suppose a government decides to deplete all natural resources, causing a catastrophe in 100 years. The people living then will have difficult lives, but they will still have lives worth living. However, because the resource depletion changed the course of history, *different* people will be conceived than would have been otherwise.
      *   Under PAV, you cannot say the policy harms those future people. If the policy hadn't happened, *they* wouldn't exist at all. Since their lives are worth living, existence is not worse for them than non-existence.
      *   Therefore, PAV struggles to explain why it is wrong to leave a ruined world for future generations, provided those generations still have lives worth living.
  *   **The Absurd Conclusion:** If existence cannot be compared to non-existence, we have no moral reason to bring happy people into existence. This leads to the conclusion that there is no moral difference between a world full of happy people and an empty world, which strikes many as a failure of moral theory.
  *   **The Sadistic Conclusion:** Some formulations of PAV imply that it is better to add people with negative welfare (suffering) than people with positive welfare. Why? Because adding people with positive welfare benefits no one (they wouldn't exist otherwise), but adding people with negative welfare harms specific people. This creates a perverse incentive structure regarding procreation.

  ### 3. Impossibility Theorems
  The strongest reason philosophers consider this unresolved is the work of Gustaf Arrhenius and others on **Impossibility Theorems**.

  Arrhenius has mathematically demonstrated that no population axiology can satisfy a set of very weak, highly plausible adequacy conditions simultaneously. For example, it is logically impossible to have a theory that satisfies all of the following:
  1.  **Non-Elitism:** A world with very high welfare is better than one with very low welfare.
  2.  **Dominance:** If you make some people better off without making anyone worse off, the world is better.
  3.  **Non-Sadism:** It is worse to add people with negative welfare than positive welfare.
  4.  **Avoidance of the Repugnant Conclusion.**

  Arrhenius's work suggests that the problem isn't just that Total Utilitarianism is flawed; it's that **our moral intuitions about population are logically inconsistent.** We want a theory that avoids the Repugnant Conclusion, but we also want a theory that says adding happy people is good, and that says we shouldn't prioritize the average over the total. Mathematics suggests we can't have all three.

  ### Summary
  Philosophers continue to work on this because adopting Average Utilitarianism or Person-Affecting Views is not a "solution," but rather a **trade-off.**

  *   **Total Utilitarianism** gives you the Repugnant Conclusion.
  *   **Average Utilitarianism** gives you the conclusion that adding happy people can be bad.
  *   **Person-Affecting Views** give you the Non-Identity Problem (making climate justice or resource depletion hard to condemn).

  The field remains active because no one has yet found a theory that minimizes these counterintuitive results sufficiently to be considered the "correct" one. Most contemporary work is now focused on **Variable Value Views** or **Critical Level Utilitarianism**, which attempt to find a middle ground between Total and Average, but even these struggle with the impossibility theorems.

  You have correctly diagnosed the disease (Total Utilitarianism), but the available cures (AU and PAV) have side effects that are, in the eyes of many philosophers, just as dangerous as the disease itself.
