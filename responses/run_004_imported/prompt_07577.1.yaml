      *   *Crucial Missing Piece:* The user assumes these alternatives are problem-free. They are not. This is the heart of the answer. Philosophers *have* tried these, and they lead to other counterintuitive or unacceptable conclusions (the "Mere Addition Paradox," "Sadistic Conclusion," "Non-Identity Problem," etc.).

  3.  **Brainstorming Counter-Arguments to the Alternatives:**

      *   **Average Utilitarianism (AU):**
          *   *Problem 1: The "Mere Addition" problem.* Adding happy people below the average lowers the average, making the world worse. This implies it's bad to have happy children if they aren't *happy enough*.
          *   *Problem 2: The "Hellish World" problem.* A world with one extremely happy person is better than a world with billions of very happy people (if the billions drag the average down slightly).
          *   *Problem 3: Killing for the Average.* If you have a population with low welfare, killing them raises the average. (Though AU proponents try to patch this, it's a persistent worry).

      *   **Person-Affecting Views (PAV):**
          *   *Problem 1: The Non-Identity Problem.* If an action changes *who* comes into existence, PAV struggles to say it's wrong if the resulting people have lives worth living. (e.g., Depleting resources for future generations).
          *   *Problem 2: The Very Repugnant Conclusion / Sadistic Conclusion.* It might be better to create miserable people than to create happy people, because creating happy people doesn't benefit anyone specific (they wouldn't exist otherwise), but creating miserable people harms specific people. Wait, that's not quite right.
          *   *Refinement on PAV:* The "Absurd Conclusion." If we can't compare existence vs. non-existence, we can't say it's better to create a happy person. This leads to the conclusion that we have no reason to bring happy people into existence.
          *   *Refinement on PAV:* The "Sadistic Conclusion." It might be better to add people with negative welfare than people with positive welfare (because adding positive welfare people doesn't help anyone *specific*, but adding negative welfare people hurts someone *specific*... actually, usually it's framed as: PAV implies we should prioritize existing people over future happy people, leading to counterintuitive prioritization).
          *   *Better PAV problem:* The "Non-Identity Problem" is the big one. It makes intergenerational justice hard to ground.

      *   **Impossibility Theorems:**
          *   Gustaf Arrhenius's work. He proved that *no* theory satisfies a set of very weak, plausible adequacy conditions. This is the "nuclear option" argument. It shows the problem isn't just TU; it's structural.

