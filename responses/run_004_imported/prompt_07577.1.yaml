      *(Refining the AU critique)*: The classic example is the "dictatorship of the existing." If I'm very happy, adding a slightly less happy (but still very happy) person makes me worse off on average. So AU says don't have kids unless they are geniuses/super-happy. That sounds elitist and counterintuitive.

      *(Refining the Impossibility Theorem)*: Mention that Arrhenius showed that *any* theory satisfying some basic conditions leads to contradictions. This proves the user's intuition (that we can just swap axioms) is logically impossible if we want to keep other basic intuitions.

