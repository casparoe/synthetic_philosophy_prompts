      *   **Task 2 (The Objection):** Provide the strongest possible counter-argument against this claim.
      *   **Task 3 (The Verdict):** Offer a reasoned judgment on whether the "DNA is a code" claim survives the objection.
      *   **Tone:** Analytical, philosophical but accessible, rigorous, avoiding hand-waving.

