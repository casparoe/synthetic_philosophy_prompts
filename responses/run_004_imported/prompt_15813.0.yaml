answer: |-
  This is a sophisticated question that cuts to the heart of the foundations of quantum mechanics. You have grasped the standard Many-Worlds Interpretation (MWI) argument correctly: if you remove the collapse postulate, the Schrödinger equation is strictly local, and since no information is transmitted faster than light (no-communication theorem), the "spooky action" seems to vanish.

  However, your friend with the PhD was not blowing smoke off when they said "it's more complicated than that." The persistence of quantum nonlocality as an open question among experts who are familiar with MWI is **not** primarily due to academic inertia or conservatism. It is due to genuine, unresolved technical and conceptual difficulties regarding how to define "locality" within the ontology of Many-Worlds.

  There are three specific technical gaps in the "MWI dissolves nonlocality" argument that keep physicists debating.

  ### 1. Configuration Space vs. 3D Space (The Ontology Problem)
  The core of your intuition is that the Schrödinger equation is a local differential equation. This is true. However, the wavefunction $\Psi$ does not live in 3-dimensional physical space; it lives in **configuration space** (a $3N$-dimensional space for $N$ particles).

  *   **The MWI Claim:** The dynamics are local *in configuration space*. Therefore, the theory is local.
  *   **The Objection:** Physical locality usually means "influences propagate through 3D space (or 4D spacetime) at finite speed." If the fundamental object of reality is a field on a high-dimensional configuration space, then what we perceive as "two particles separated by a mile" are actually just two coordinates in a single, monolithic object.
  *   **The Gap:** Critics (such as Tim Maudlin and Alyssa Ney) argue that if the fundamental reality is a wave in configuration space, the theory is **ontologically non-local** with respect to the 3D space we inhabit. The "locality" of the Schrödinger equation is mathematically local in the abstract space, but it does not map cleanly to local beables in physical spacetime. MWI saves dynamical locality only by sacrificing spatial locality in the ontology. Whether this counts as "dissolving" nonlocality or just "hiding" it in higher dimensions is a matter of active philosophical dispute, not settled fact.

  ### 2. Relativistic Covariance and Preferred Foliation
  Bell's theorem is deeply tied to Special Relativity. For a theory to be truly local, it should ideally be Lorentz invariant (i.e., not depend on a specific reference frame or definition of simultaneity).

  *   **The MWI Claim:** Since there is no collapse, there is no need for a instantaneous update across space, so relativity is safe.
  *   **The Objection:** To make sense of "worlds" or "branches" splitting, MWI generally requires a definition of when the split happens. In a relativistic setting, defining a global "branching structure" is notoriously difficult. If the branching depends on a specific slicing of spacetime (a preferred foliation), then the theory implicitly reintroduces a preferred frame of reference.
  *   **The Gap:** While the underlying quantum field theory equations are Lorentz invariant, the *interpretation* of those equations into distinct "worlds" often requires a decoherence basis that is frame-dependent. If the "worlds" themselves are not Lorentz invariant objects, then the claim that MWI restores a clean, local realist picture of spacetime is compromised. This is a technical hurdle in relativistic QFT that has not been fully smoothed over.

  ### 3. The "Local Causality" Condition
  Bell's theorem rules out theories that satisfy **Local Causality**. This condition roughly states that events in one region should not depend on variables in a spacelike separated region, given a complete specification of the past light cone.

  *   **The MWI Claim:** MWI satisfies Local Causality because the wavefunction evolves locally. The correlation between Alice and Bob is established at the source (the entangled pair creation), not at the measurement.
  *   **The Objection:** In MWI, when Alice measures her particle, she splits into versions. When Bob measures his, he splits. For the statistics to match quantum predictions (violating Bell inequalities), Alice's "splitting" must correlate with Bob's "splitting" in a specific way.
  *   **The Gap:** Critics argue that for the branches to align correctly to reproduce the Bell correlations without communication, the *structure of the branching* must encode the non-local correlation. David Deutsch and David Wallace argue this information flows locally through the wavefunction. However, opponents argue that this requires the "local" state of Alice to implicitly contain information about Bob's setting in a way that violates the spirit of Bell's Local Causality, even if it doesn't allow signaling.
      *   Put simply: In a single-world theory, nonlocality is in the *dynamics* (collapse). In MWI, nonlocality is shifted into the *kinematics* (the structure of the global wavefunction). Whether shifting nonlocality from dynamics to kinematics counts as "solving" it is a philosophical judgment, not a mathematical proof.

  ### Why the Consensus hasn't Shifted
  You mentioned the suspicion that the mainstream hasn't caught up with an argument sitting on a rationalist blog since 2008. It is worth noting two things:

  1.  **The Arguments are Older:** The argument that MWI restores locality was championed vigorously by David Deutsch in the 1980s and 90s, and more recently by David Wallace. It is not new to the LessWrong sequence; rather, Yudkowsky's sequence is a popularization of these existing academic arguments.
  2.  **The Counter-Arguments are Also Strong:** The physics community *has* engaged with these arguments. Papers by Brown & Timpson (2006), Valentini, and Maudlin directly address the claim that MWI is local. They conclude that while MWI removes *signal* nonlocality, it retains *ontological* nonlocality.

  ### Summary
  The "dissolution" of nonlocality in MWI is real in the sense that it removes **superluminal signaling** and **dynamical collapse**. However, it does not remove **Bell nonlocality** in the sense of satisfying Bell's condition of Local Causality without trade-offs.

  To accept the MWI dissolution, you must accept that:
  1.  Locality in 3N-dimensional configuration space is sufficient for physical locality.
  2.  The branching structure can be defined without violating relativistic covariance.
  3.  Shifting nonlocality from the dynamics to the global state counts as a resolution.

  Many physicists accept these trade-offs; many do not. The debate persists not because physicists are stubborn, but because MWI solves the problem of nonlocality by changing the definition of what exists (ontology), and there is no consensus on whether that is a fair trade. Your friend was right: it is technically more complicated, and the "gap" is in the mapping between the high-dimensional wavefunction and our experience of 3D spacetime.
