      *   **The Problem:** The user is stuck on the logical "joint" in the last third of the fragment.
          *   Pascal sets up a design problem: Make justice strong OR make force just.
          *   Pascal argues only the second happened.
          *   Reason given: Force is undisputed/recognized; Justice is open to dispute.
          *   User's Objection: Why does this asymmetry *force* the outcome? Couldn't undisputed justice work?
