      *   *Peirce's Move:* He's not defining truth *linguistically*; he's defining it *metaphysically* or *operationally*. He's trying to explain what "reality" means in terms of human experience.
      *   *Key Distinction:* Inquiry is defined by the *irritation of doubt*. It's a psychological/biological state moving toward belief. Truth is the *stable state* of belief that resists further doubt.
      *   *Response Strategy:* Acknowledge the worry (it's a classic objection). Explain that Peirce sees inquiry as a natural phenomenon (resolving doubt), not a pre-loaded truth-seeking missile. The "external permanency" drives the convergence, not the definition.

  3.  **Deconstruct Question 2: "Fated" and Convergence.**
      *   *The Worry:* Is it deterministic? Is it just a counterfactual? Can we rig the group?
      *   *Peirce's Move:* "Fated" implies an external constraint. It's not that humans *must* agree, but that the *object* forces agreement.
      *   *Counterfactual:* Yes, it is largely counterfactual (ideal limit).
      *   *Gerrymandering:* Peirce specifies the *method* of science (testing against experience). You can't just pick "investigators" who agree; they must submit to external reality. The "fate" comes from the *object*, not the *subjects*.
