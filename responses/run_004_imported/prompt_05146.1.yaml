answer: |-
  This is an impressive set of questions for a lunchtime reading group. You have hit on the three classic objections to Peirce's early pragmatism (circularity, idealization, and realism) and correctly identified the fault line between Peirce and James that led to the schism in the pragmatist movement.

  Since your group consists of engineers, I will try to frame the answers using analogies of measurement, systems, and limits, which often map well onto Peirce's scientific mindset.

  Here is a breakdown of the mechanics of Peirce's claim and the Peirce-James split.

  ### 1. The Circularity Objection
  **Your worry:** Doesn't "inquiry" already presuppose a goal (truth), so defining truth as the goal of inquiry is circular?

  **The Peircean Response:** Peirce would argue this is only circular if you define inquiry as "the search for truth." But in his earlier paper, *"The Fixation of Belief"* (1877), he defines inquiry more mechanically: **inquiry is the struggle to move from the irritation of doubt to the settlement of belief.**

  Think of it like a control system seeking equilibrium. The system doesn't need to know the "true" state of the world to seek equilibrium; it just reacts to error signals (doubt).
  *   **The Non-Circular Move:** Peirce is not defining truth linguistically; he is offering a metaphysical account of what "reality" corresponds to in human experience. He argues that if you follow the method of science (testing against experience), you find that beliefs converge.
  *   **The Anchor:** The circle is broken by the **"external permanency."** Peirce argues that something *outside* our minds forces the convergence. If truth were just "what we agree on," it would be circular. But because it is "what we are *fated* to agree on *because reality forces us*," the definition relies on the constraint of the object, not just the psychology of the investigators.

  ### 2. "Fated" and the Counterfactual
  **Your worry:** Is "fated" deterministic? Is it just a counterfactual? Can we gerrymander the "investigators" to guarantee agreement?

  **The Peircean Response:**
  *   **Determinism vs. Statistical Convergence:** Peirce was actually a indeterminist (he believed in "tychism," or absolute chance). He doesn't mean every single investigator is deterministically programmed to agree. He means that in the **long run**, the noise cancels out, and the signal (reality) remains. It is a statistical limit, like the Law of Large Numbers.
  *   **The Counterfactual:** You are right that this is a counterfactual claim. Peirce is defining truth as a **limit of a function**. Just because we never reach the limit (infinity) doesn't mean the limit doesn't exist.
  *   **Preventing Gerrymandering:** This is where the **Method of Science** is crucial. Peirce distinguishes the method of science from the methods of tenacity, authority, or *a priori* reasoning.
      *   If you gerrymander the investigators (e.g., "only flat-earthers count"), the convergence will fail when they interact with the broader world (e.g., trying to navigate ships).
      *   For Peirce, a valid "investigator" is one who submits their hypotheses to the tribunal of external experience. Reality acts as a veto power. You cannot define the community of investigators in a way that insulates them from the "external permanency," because if you do, their beliefs won't be *stable* (they will be surprised by experience), and thus they haven't actually reached the "final opinion."

  ### 3. The Pebbles on the Beach (Uninvestigated Facts)
  **Your worry:** Does a fact exist if no one ever investigates it?

  **The Peircean Response:** This is the hardest pill to swallow, and it reveals Peirce as a **Scholastic Realist**.
  *   **The "Would-Be":** Peirce argues that reality consists of "would-bes" (dispositional properties). A diamond is hard even if no one scratches it, because *if* someone were to try, it *would* resist.
  *   **Applying to Truth:** Similarly, the number of pebbles is true not because someone counted them, but because *if* an investigation were undertaken under ideal conditions, the community *would* converge on that number.
  *   **The Commitment:** Yes, Peirce is committed to saying that truth is a property of the *potential* investigation, not necessarily an *actual* one. However, he avoids saying "there is no truth" about the pebbles. He says the truth is the **destiny** of the opinion about the pebbles. The truth exists as a real possibility grounded in the object, waiting to be actualized by inquiry.
  *   **Engineer Analogy:** Think of a voltage in a circuit that is currently unmeasured. The voltage is "real" not because a multimeter is touching it, but because *if* a high-impedance meter were connected, it *would* read $X$. The truth is the reading the ideal meter *would* give.

  ### 4. Peirce vs. James (and the birth of "Pragmaticism")
  **Your worry:** Is James's view individualistic/psychological vs. Peirce's communal/scientific? Is this why Peirce renamed his view?

  **The Verdict:** **Yes, exactly.** Your secondary sources are correct.

  *   **William James:** In *Pragmatism* (1907), James focuses on the "cash value" of an idea for the **individual**. A belief is true if it "works" for you, if it helps you navigate life, if it provides psychological comfort or moral strength. For James, religious belief can be "true" if it brings vitality to the believer, even if it isn't scientifically verifiable.
  *   **Charles Peirce:** Peirce was horrified by this. He thought it made truth subjective and mushy. For Peirce, a belief "working" for an individual (making them happy) is irrelevant. A belief is true only if it aligns with the **independent reality** that the **community** of investigators would eventually confirm.
  *   **The Split:** Peirce felt James had turned pragmatism into a tool for justifying whatever people *wanted* to be true, rather than a method for finding out what *is* true.
  *   **Pragmaticism:** In 1905, Peirce published a paper titled *"What Pragmatism Is."* He wrote:
      > "So then, the writer, finding his bantling 'pragmatism' so promoted, feels that it is time to kiss his child good-by and relinquish it to its higher destiny; while to serve the precise purpose of expressing the original definition, he begs to announce the birth of the word 'pragmaticism,' which is ugly enough to be safe from kidnappers."
      He literally renamed his philosophy "Pragmaticism" (which he called "ugly enough to be safe") to distinguish his hard-nosed, scientific realism from James's softer, individualistic utilitarianism.

  ### Summary for the Group
  If you are discussing this at lunch, here is the cheat sheet:

  1.  **Circularity:** Inquiry isn't "truth-seeking"; it's "doubt-resolving." Reality forces the convergence, breaking the circle.
  2.  **Fated:** It's a statistical limit (Law of Large Numbers), not magic. Reality vetoes gerrymandered groups because their beliefs won't survive contact with experience.
  3.  **Pebbles:** Truth is dispositional. It's about what *would* be found, not just what *is* found. (Like voltage in an unmeasured circuit).
  4.  **James vs. Peirce:** James = "True if it works for me." Peirce = "True if we are all forced to agree by reality." Peirce changed the name to "Pragmaticism" to escape James's interpretation.

  Peirce is notoriously difficult, but your group has identified the exact pressure points where his theory is strongest and where it is most vulnerable. Enjoy the rest of Menand; he does an excellent job contextualizing why these men cared so much about these definitions (the shadow of the Civil War and the rise of modern science).
