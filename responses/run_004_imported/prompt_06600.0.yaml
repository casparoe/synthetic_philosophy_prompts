      *   Focus on *risk* and *scale*. T&S cares about user safety and false positives/negatives.
      *   *Self-Correction during drafting:* I need to make sure I don't just explain the philosophy but explicitly state *how it changes the model*. For example, instead of saying "Pragmatics says context matters," say "Pragmatics requires a larger context window and potentially user metadata."

  6.  **Drafting the Content (Iterative refinement):**
      *   *Quotation:* If you believe the word is inherently toxic (Semantic), you redact. If you believe the *use* is toxic (Pragmatic), you allow discussion. *Implication:* Do you build a "redaction layer" or a "context classifier"?
      *   *Reclamation:* Semantic says "ban it all." Pragmatic says "allow in-group." *Implication:* Do you have identity signals? If not, pragmatic is dangerous (bad actors pretend to be in-group).
      *   *Negation:* Semantic says "presence = risk." Pragmatic says "intent = risk." *Implication:* Need NLI models, not just regex.

  7.  **Final Review against Constraints:**
      *   Did I cover quotation, reclamation, negation? Yes.
