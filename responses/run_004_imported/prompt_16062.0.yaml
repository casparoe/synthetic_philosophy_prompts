          *   *Does it stop the regress?* It stops it by denying the premise that a relation is needed. But it introduces a mystery: What *is* this "unsaturatedness"? Is it magical glue?
          *   *Verdict:* It stops the *logical* regress by changing the rules, but it leaves a *metaphysical* mystery. It relocates the problem from "infinite relations" to "what is this weird unsaturated nature?"

