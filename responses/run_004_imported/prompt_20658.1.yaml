      *   **The User's Critique:** This seems contradictory. If the unobserved beauty has *all* (or most) of the value, then adding a mind to appreciate it shouldn't add *that* much more value. But Moore claims the conscious appreciation is the *greatest* good. This looks like "having it both ways."
