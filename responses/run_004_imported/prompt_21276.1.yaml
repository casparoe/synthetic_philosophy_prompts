answer: |-
  It is a genuine pleasure to correspond with someone who has actually spent thirty-five years looking down a microscope at the things philosophers argue about over coffee. Please tell your daughter that falling down a philosophy rabbit hole at retirement isn't a mid-life crisis; it's an intellectual victory lap. And you are quite right to feel a bit humbled. Most of us in the sciences use "function" as a piece of theoretical shorthand without realizing it carries a metaphysical load. When you wrote a paper stating "the function of the chloride cells is ion regulation," you were implicitly making a claim about history, not just chemistry.

  You have correctly identified the two heavyweights in the ring: the **Selected Effects (SE)** account (Wright, Millikan, Neander) and the **Causal Role (CR)** account (Cummins).

  To give you the depth you asked for, we need to move past the slogans. The SE account is *etiological*: it claims functions are defined by the *history of selection* that maintained the trait in the population. The function of $X$ is $Z$ if $X$ exists now *because* ancestors of $X$ did $Z$ and were selected for doing $Z$. It is backward-looking.

  The CR account is *systemic*: it claims functions are defined by the *current causal contribution* a trait makes to the capacity of a containing system. The function of $X$ is $Z$ if $X$ contributes to the capacity of the organism to survive/reproduce by doing $Z$. It is forward-looking (or rather, present-looking).

  Let's put these through the wringer with your two cases.

  ### Case 1: The New Mutant
  Imagine a fish in your lab develops a novel gill mutation. It hasn't reproduced yet, so there is no selection history. However, this new structure immediately allows the fish to extract oxygen more efficiently in hypoxic water.

  **The Causal Role (Cummins) Verdict:**
  For the CR theorist, this is a slam dunk. The trait exists. It is currently making a causal contribution to the organism's capacity to survive in hypoxia. Therefore, it has a function. The CR account is ahistorical; it doesn't care how the trait got there, only what it is doing *now* within the system. This aligns well with the physiologist's intuition: if it works, it functions.

  **The Selected Effects (Neander/Millikan) Verdict:**
  For the SE theorist, this is a bullet they have to bite. Strictly speaking, **the trait has no function yet.** It has a *disposition* to function, or it is *potentially* functional, but it cannot have a proper biological function until it has been selected for. Why? Because on the SE view, "function" is an explanatory term. To say "the gill is *for* oxygen uptake" is to explain *why the gill is here*. If the gill is here due to a random mutation that hasn't been screened by selection, its presence is not explained by its utility. It is just a lucky accident.

  **Analysis:**
  The CR account feels more intuitive here, but it opens a dangerous door. If *any* beneficial causal contribution counts as a function, then the function of the mutant's liver might be "to vibrate at a frequency that scares off predators," if it happens to do that once. The CR account struggles to distinguish between a trait's *function* and its *mere beneficial effects* without appealing to the very history it tries to ignore.

  The SE account feels rigid, but it preserves the link between function and adaptation. It forces us to admit that until selection acts, we don't know if this trait is a functional adaptation or a spandrel (a byproduct). However, SE proponents often soften this by noting that truly *de novo* traits are vanishingly rare. Usually, a "new" trait is a modification of an old one. The new gill filament is made of cells that *do* have a selection history. So, the SE account can often salvage the situation by tracing the history of the constituent parts, even if the specific configuration is new.

  ### Case 2: The Arrhythmic Heart
  Now consider a human heart in ventricular fibrillation. It is quivering, not pumping.

  **The Causal Role (Cummins) Verdict:**
  This is the CR account's nightmare. If function is defined by *current* causal contribution, then the fibrillating heart's function is *not* to pump blood, because it isn't pumping blood. Its current causal contribution is to quiver uselessly and perhaps kill the organism.
  To save the intuition that the heart *should* pump blood, the CR theorist must appeal to a "reference class." They must say, "The function is what hearts *typically* do." But this smuggles in a norm. Where does that norm come from? If it's statistical (what most hearts do), then a rare genetic variant that pumps differently but healthily would be "malfunctioning." If it's based on "healthy" hearts, we are defining health circularly (health is functioning well; functioning well is what healthy hearts do). Cummins tries to solve this by analyzing capacities hierarchically, but he struggles to ground the *normativity*—the "ought"—without referencing history.

  **The Selected Effects (Neander/Millikan) Verdict:**
  The SE account handles this effortlessly. The function of the heart is to pump blood because that is what ancestral hearts did that caused them to be selected. The fact that *this* heart is failing to do so is irrelevant to the assignment of function. It allows for a clear distinction between **function** (what it is supposed to do based on history) and **performance** (what it is actually doing now). Malfunction is simply the failure to perform the selected effect. This captures the biological reality of disease and pathology perfectly.

  ### The Verdict

  You asked me to commit, so I will not hedge. **The Selected Effects (SE) account is the superior theory of biological function.**

  Here is the defense, specifically tailored to your background as a physiologist.

  **1. Biology is inherently normative.**
  As a physiologist, you didn't just describe what kidneys *did*; you implicitly understood what they were *supposed to do*. When you studied a diseased kidney, you didn't say "its function is now to filter poorly." You said "it is failing to perform its function." The CR account is descriptive; it describes causal powers. But biology is not just physics; it is full of norms (health, disease, adaptation, maladaptation). The SE account is the only one that grounds this normativity non-arbitrarily. It anchors the "ought" in the "was." The heart *ought* to pump because if it hadn't pumped in the past, you wouldn't have a heart to study now.

  **2. Distinguishing Function from Effect.**
  In your work on amphibian kidneys, you knew that the kidney produces urine, but it also produces heat (as a byproduct of metabolism) and makes a sound when fluid moves through it. Why is "excretion" the function and "heat production" merely an effect? Both are causal contributions. The CR account has a hard time drawing this line without arbitrary system boundaries. The SE account draws it cleanly: the kidney exists *because* it excreted waste in ancestors. It does not exist *because* it produced heat. The history filters the relevant effects from the noise.

  **3. Addressing the Weaknesses (The New Mutant).**
  I acknowledge the SE account's struggle with the "New Mutant." It seems counterintuitive to say a beneficial trait has no function. However, I argue this is a feature, not a bug. It forces scientific rigor. Just because a trait is beneficial *now* doesn't mean it is an adaptation. It might be a lucky accident that will disappear in the next generation. By withholding the label "function" until selection has acted, the SE account protects us from "just-so stories" where we assume every beneficial trait was designed by selection.
  Furthermore, as I noted earlier, truly *de novo* traits are rare. Most "new" traits are modifications of old functional machinery. The SE account can trace the function of the underlying machinery even if the specific configuration is novel.

  **A Note on Your Career**
  Does this mean your thirty-five years of physiology were philosophically misguided? Absolutely not. In practice, physiologists operate using a **Causal Role** methodology. You analyze the system to see what capacities the parts contribute. That is valid and essential science.
  However, when you step back and ask, "What does it *mean* for this organ to be a functional part of a living system?" the **Selected Effects** account provides the metaphysical grounding. You were using CR to *identify* mechanisms, but SE explains *why those mechanisms constitute biological functions* rather than just chemical reactions.

  **Conclusion**
  The Causal Role account is an excellent tool for *analyzing* systems, but the Selected Effects account is the correct theory for *defining* biological function. It alone captures the evolutionary history that makes biology distinct from mechanics, and it alone provides a robust account of malfunction that doesn't collapse into statistics.

  Welcome to the rabbit hole. It only gets deeper from here.
