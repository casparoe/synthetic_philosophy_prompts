answer: |-
  You have hit on exactly the right nerve. Newman's Objection (1928) is the "ghost in the machine" of structural realism. It is the reason why almost every paper on the subject has to spend the first three pages doing defensive calisthenics.

  You are right to be wary of the model-theoretic explanations. They tend to hide the simplicity of the trick behind a wall of symbols. Here is the gut-level version of why "knowing only the structure" is suspiciously cheap, why it matters, and whether the Ontic Structural Realists (OSR) actually get away with it.

  ### 1. The Structural Realist Hope
  To see why Newman's objection hurts, we have to see what Structural Realism is trying to save.
  *   **The Pessimistic Meta-Induction:** History shows that our best theories (Newton, Fresnel, etc.) posited entities (ether, phlogiston) that turned out not to exist. So, probably, our current entities (electrons, quarks) don't exist either.
  *   **The Structuralist Rescue:** But wait! The *equations* from the old theories often survived into the new ones. Fresnel's math about light waves worked even when we stopped believing in the "luminiferous ether."
  *   **The Claim:** Therefore, science doesn't tell us the *nature* of the things (what an electron *is*), but it does tell us the *structure* of the relationships between them (how they behave/mathematically interact).

  This is **Epistemic Structural Realism (ESR)**. We know the structure; the nature is unknowable.

  ### 2. Newman's Gut-Punch
  Max Newman, a mathematician and philosopher, read Bertrand Russell (who held a similar view) and basically said: "If you strip away the nature of the objects and keep only the structure, you haven't said anything meaningful."

  Here is the plain English version of his argument, using a **Connect-the-Dots** analogy.

  Imagine the world is a sheet of paper with a bunch of dots on it.
  *   The **dots** are the objects (electrons, fields, whatever).
  *   The **lines** you draw between them are the **structure** (relations, equations).

  The Structural Realist says: "I can't tell you what the dots *are*. I can't even tell you if the dots are 'really' there. But I can tell you the pattern of lines connecting them."

  **Newman's Trick:**
  If you refuse to tell me anything about the *nature* of the dots (e.g., "this dot is heavy," "this dot is charged"), and you only tell me about the *pattern of lines*, then **I can draw that pattern on almost any collection of dots.**

  If I have enough dots, I can draw *any* pattern I want.
  *   Want the world to have the structure of a "group"? I can define a relation between the dots that makes them a group.
  *   Want the world to have the structure of "Maxwell's Equations"? I can define relations between the dots that satisfy those equations.

  **The Triviality:**
  As long as the world has *enough* objects (the right cardinality), you can impose *any* structure on it you like.
  Therefore, saying "The world has Structure X" doesn't actually describe the world. It just says, **"The world contains at least $N$ objects."**

  If Structural Realism is true, then the claim "Electrons interact via electromagnetic fields" is logically equivalent to "There are enough things in the universe to support a pattern that looks like electromagnetic interaction."

  That is why it's "cheap." It turns physics into a counting exercise. It loses all the informative content of science. Science is supposed to tell us *which* relations hold, not just that *some* relations holding a specific pattern *could* be defined.

  ### 3. Why This is a Disaster
  If Newman is right, Structural Realism fails at its own job.
  1.  **It's not informative:** Knowing the "structure" should constrain what the world is like. Newman shows it doesn't. It allows almost any world to fit the description.
  2.  **It doesn't explain success:** Structural realists want to say science is successful because it latches onto real structure. But if *any* collection of objects can be made to fit that structure, then latching onto it isn't an achievement. It's a mathematical tautology.

  ### 4. Can Ontic Structural Realism (OSR) Escape?
  This is where it gets spicy. In the 1990s and 2000s, philosophers like James Ladyman and Don Ross developed **Ontic Structural Realism**.

  *   **ESR (Epistemic):** There are objects, but we only *know* the structure. (Newman crushes this, because he assumes there are objects we are ignoring the nature of).
  *   **OSR (Ontic):** There are **no objects**. There is only structure. The "dots" don't exist; there are only the "lines." Reality is a web of relations without nodes.

  **The OSR Escape Attempt:**
  OSR proponents argue Newman's objection assumes there is a "domain of objects" over which relations are defined. Newman's math requires a set of "things" to shuffle around.
  If OSR says, "There are no things, only structure," then Newman's objection supposedly loses its grip. You can't say "I can rearrange the objects" if there are no objects to rearrange. The structure is fundamental; it doesn't supervene on a hidden pile of stuff.

  **Does it work?**
  Philosophers are still fighting over this, but here is the scorecard:

  **The "Yes, they escape" argument:**
  Newman's objection relies on a distinction between "relations" and "relata" (the things being related). If you eliminate the relata entirely, the logical proof Newman uses (which relies on set theory and domains of objects) technically doesn't apply. OSR changes the metaphysical rules of the game.

  **The "No, they inherit the problem" argument:**
  Critics argue OSR is incoherent.
  1.  **The "Relations need Relata" problem:** You can't have a relation without things to relate. "To the left of" requires two things. If there are no things, what is doing the relating? OSR tries to say "pure structure," but critics say this is just word salad.
  2.  **The Newman Problem returns:** Even if you say "there are no objects," you still have to explain what makes *this* structure the real one, rather than *that* structure. If all you have is a mathematical structure, how do you distinguish "the world is this structure" from "the world is a mathematical model that looks like this structure"?
      *   If the world *is* just a mathematical structure, you run into the problem that mathematical structures are abstract and exist everywhere/nowhere.
      *   To make it "real," you usually need to anchor it to something concrete. Once you anchor it, Newman asks: "What are you anchoring it to?" If you say "stuff," you're back to ESR (and Newman wins). If you say "nothing," you're an idealist.

  ### The Bottom Line
  Newman's Objection shows that **structure without nature is empty.**

  *   **For the Epistemic Structural Realist:** It's a fatal wound. You can't say "we only know structure" because "only structure" turns out to mean "almost nothing."
  *   **For the Ontic Structural Realist:** It's a challenge to their coherence. They try to escape by denying the existence of "objects," but then they struggle to explain what "structure" means if it isn't a structure *of* something.

  Most working scientists ignore this puzzle because they are busy doing science. But for philosophers of science, Newman's Objection is the price of admission. You cannot be a structural realist without having an answer to Newman. The most common answer nowadays is a modified OSR that admits we need *some* non-structural "glue" to make the structure real, but that just moves the line back toward traditional realism.

  So, your instinct was correct: the claim is "cheap" because without constraints on the *nature* of the relata, the constraints on the *relations* become mathematically trivial. It's the philosophical equivalent of selling someone a map but refusing to tell them what territory it's a map of—and then realizing that with enough dots, you can draw that map on any territory whatsoever.
