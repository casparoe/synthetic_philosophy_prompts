answer: |-
  Hi everyone. For those of you who don't know me, I'm [Your Name], Ray's niece/nephew. And apparently, I'm the one who drew the short straw to hold the microphone. I think I was voted into this role because I'm the only one who doesn't have to be back on shift in six hours, so please, try to look attentive.

  We are standing in a hospital cafeteria, there is sheet cake involved, and Ray is still wearing scrubs that have seen a twelve-hour shift. So, I promise to keep this real. I know the standard protocol for a surgeon's retirement. Usually, this is the part where someone stands up and recites the highlight reel. You know the script: "Thirty-three years. Hundreds of lives saved. A perfect record. A god in a white coat."

  But here's the thing. If I gave that speech, Ray would spend the whole drive home listing the three cases from 1998 where the outcome had nothing to do with his skill and everything to do with physics.

  Ray has a rule about honesty. A few Thanksgivings ago, we got stuck at the kids' table—well, I was at the kids' table, he was at the head of the table, but the conversation carried—and he started talking about a truck driver. I won't bore you with the philosophy, but the gist was this: Sometimes bad things happen to careful people. Sometimes good things happen to reckless people. And Ray believes that if you judge a surgeon by the scoreboard alone, you aren't judging the surgeon. You're judging the luck of the draw on a Tuesday night.

  He told me he doesn't want to be honored for the outcomes he couldn't control. He wants to be honored for the work he *did* control.

  And honestly? That distinction is why we're all here.

  To the colleagues in the room: You know this better than anyone. You know that trauma isn't a video game. You can't just press reset. You know the nights where the odds were mathematically zero, and the only reason a family got to say goodbye, or a patient got to walk again, was because Ray's hands didn't shake when everyone else's did. Not because he was magic. But because he was *there*. He made the call. He did the work.

  To the family: I know you want to hear that Uncle Ray was a superhero. He was. But not because he never lost a patient. He was a hero because he carried the weight of the ones he couldn't save, and he still showed up the next morning to try again. That's not a statistic. That's character.

  Ray, you spent thirty-three years drawing the line between what was luck and what was yours. You took responsibility for the part that was yours—the judgment, the steady hands, the long nights—and you had the humility to let go of the rest. That is a rare thing. Most people spend their lives trying to take credit for the luck. You spent yours making sure the luck didn't matter as much as it should have.

  So, I'm not going to toast the scoreboard. I'm not going to toast the stats.

  I'm going to toast the effort. I'm toasting the thirty-three years of showing up when the phone rang. I'm toasting the calm in the chaos. And I'm toasting the fact that for the first time in three decades, the only thing you have to trauma-manage is a golf game or a grandkid who falls off a bike.

  Ray, may your retirement be full of good luck. You've earned the right to enjoy the parts of life you actually get to control.

  To Ray.
