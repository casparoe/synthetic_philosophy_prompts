prompt: |-
  A friend of mine, Daniel, is celebrating twenty years sober next month, and he's asked me to say a few words at the party. Shortly before he asked, another friend and I got into a long argument neither of us won. She maintained that what Daniel overcame was weakness of will in the strict philosophical sense: he judged, correctly and continuously, that drinking was worse for him, and simply failed, again and again, to act on that judgment. I argued that hyperbolic discounting describes it more accurately, and more kindly: there was never a real contradiction in him, only a present self and a future self with mismatched discount curves, so what sobriety changed was which self got to decide, not how much willpower he had. She replied that my account quietly excuses every relapse as 'rational, for whichever self was having it,' and can't explain why Daniel, sober, describes his drinking as a betrayal of what he actually wanted, rather than another person's reasonable choice. I had no good reply. Some guests are in recovery and talk about will and surrender every day; others have never considered any of this. Please write the toast. It should run about five minutes, stay warm, and genuinely honor what Daniel did, and work for both halves of the room without quietly settling our argument by treating either picture of him as simply the true one.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Daniel's 20-year sobriety anniversary party.
      *   **Task:** Write a toast (speech) to be given by a friend.
      *   **Duration:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).
      *   **Tone:** Warm, honoring, genuine.
      *   **Audience:** Mixed. Some are in recovery (familiar with concepts of will, surrender, higher powers), others are not (laypeople).
      *   **Constraint/Challenge:** The user had a philosophical argument with another friend about the nature of addiction (Weakness of Will/Akrasia vs. Hyperbolic Discounting/Temporal Selves). The friend argued the "Weakness of Will" model fits the subjective experience of betrayal better. The user argued the "Hyperbolic Discounting" model is kinder/more accurate. The toast *must not* resolve this argument in favor of one side. It needs to honor Daniel's achievement without reducing him to a philosophical case study, while acknowledging the complexity of his journey in a way that resonates with both groups.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Side A (Weakness of Will/Akrasia):* Daniel knew drinking was bad but did it anyway. Sobriety requires strengthening the will or surrendering it. Relapse is a failure of alignment. *Recovery speak:* "Willpower," "Surrender," "Integrity."
      *   *Side B (Hyperbolic Discounting):* Daniel's "present self" valued the drink more than the "future self" valued health. Sobriety is changing the conditions so the future self wins. Relapse isn't moral failure, just a shift in valuation. *Scientific/Psych speak:* "Impulse control," "Time inconsistency," "Compassion."
      *   *The Synthesis for the Toast:* The toast shouldn't use jargon like "akrasia" or "hyperbolic discounting." Instead, it should capture the *truth* in both: The struggle felt real and moral (Side A), but the solution often involves changing the landscape of choice, not just gritting teeth (Side B). It needs to validate the pain of the "betrayal" feeling without shaming the past self.

  3.  **Determine the Core Message:**
      *   Twenty years is a massive milestone.
      *   The journey wasn't linear.
      *   The "why" matters less than the "who" (Daniel now).
      *   Acknowledge the struggle without diagnosing it.
      *   Bridge the gap: For those in recovery, acknowledge the spiritual/willpower aspect. For those not, acknowledge the psychological/human aspect.
      *   Focus on *connection* and *presence*.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the milestone. Set a warm tone.
      *   **The Middle (The Struggle):** Address the hard years. This is where the philosophical tension lives. Don't use the terms, but describe the experience.
          *   *Idea:* Talk about the conflict between knowing and doing. Talk about the different "versions" of ourselves.
          *   *Integration:* Acknowledge that for Daniel, it felt like a battle (validating Side A/Recovery crowd) but also a matter of finding a new way to live (validating Side B/Science crowd).
          *   *Key phrase:* "The gap between what we want for our future and what we reach for in the moment."
      *   **The Turning Point:** How he got here. Not just "willpower," but support, change, surrender, tools.
      *   **The Result:** Who Daniel is today. Reliable, present, kind.
      *   **Closing:** The toast itself.

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Remove any hint of "philosophical debate." Keep it emotional and experiential.
      *   *Critique:* Does it alienate the recovery crowd?
      *   *Fix:* Ensure words like "surrender," "honesty," and "choice" are used respectfully.
      *   *Critique:* Does it alienate the lay crowd?
      *   *Fix:* Ensure it doesn't sound like a 12-step meeting. Keep it universal.
      *   *Critique:* Does it solve the user's argument?
      *   *Fix:* No. It must leave the mystery intact. The point is that Daniel *lived* the answer, he didn't just theorize it.

  6.  **Drafting - Specific Lines:**
      *   *Instead of:* "Hyperbolic discounting suggests..."
      *   *Try:* "We all know the tug-of-war between the person we want to be next year and the person we are right now."
      *   *Instead of:* "Weakness of will..."
      *   *Try:* "The heavy feeling of knowing what is right and finding yourself doing something else."
      *   *Addressing the 'Betrayal':* Acknowledge that Daniel feels his past actions as a betrayal. Validate that feeling without condemning the past Daniel as "weak." He was trapped; now he is free.

  7.  **Timing Check:**
      *   Average speaking pace is ~130 words per minute.
      *   5 minutes = ~650 words.
      *   I need to make sure it's not too short. I'll aim for around 700-750 words to allow for pauses and laughter.

  8.  **Final Polish:**
      *   Check the ending. Make it a clear cue for raising glasses.
      *   Ensure Daniel's name is central.
      *   Make sure the "argument" is sublimated into "mystery" or "complexity of the human heart."

  **(Self-Correction Note):** I need to be careful not to sound like I'm taking Side B (the user's side) under the guise of kindness. The prompt says the friend (Side A) had a point about the feeling of betrayal. I need to honor that feeling. The toast should suggest that *both* descriptions capture a piece of the truth, but the *life* is what matters.

  9.  **Final Review against constraints:**
      *   5 mins? Yes.
      *   Warm? Yes.
      *   Honors Daniel? Yes.
      *   Works for recovery & non-recovery? Yes.
      *   Doesn't settle the argument? Yes, by transcending it.

