answer: |-
  You have put your finger on the single most famous crux in the history of logic. The tension you identify in *De Interpretatione* Chapter 9 is not a result of your misreading; it is the central interpretive problem that has divided commentators from Alexander of Aphrodisias in the second century to A.N. Prior and Jan Łukasiewicz in the twentieth.

  The short answer is: **Aristotle is not contradicting himself, but the Edghill translation (while respectable for its time) obscures the specific technical distinction Aristotle is drawing.**

  To resolve the apparent contradiction and see how Aristotle blocks fatalism without abandoning the logic of the present and past, we need to unpack three specific distinctions:
  1.  **Translation:** The meaning of *hōrismenōs* (Edghill's "actually").
  2.  **Logic:** The difference between the Law of Excluded Middle and the Principle of Bivalence.
  3.  **Modality:** The difference between the necessity of the disjunction and the necessity of the disjuncts.

  Here is a breakdown of what is going on in that stretch of the argument.

  ### 1. The Translation Issue: "Actually" vs. "Definitely"

  The confusion in the passage you quoted stems largely from how the Greek adverb *hōrismenōs* is rendered. Edghill translates it as "actually" ("cannot be either actually true or actually false"). This suggests an ontological status (is it *real* truth?).

  However, in this context, *hōrismenōs* is better translated as **"definitely," "determinately,"** or **"specifically."**

  When Aristotle says, "One of the two propositions in such instances must be true and the other false," he is affirming the **Law of Excluded Middle (LEM)**. For any proposition $p$, either $p$ or not-$p$ holds. The disjunction ($p \lor \neg p$) is necessary.

  When he subsequently says, "it is not necessary that of an affirmation and a denial one should be true and the other false," he is **not** denying LEM. He is denying that the truth value is *fixed* or *determinate* at the present moment.

  A more precise paraphrase of the problematic sentence would be:
  > "It is not necessary that one [disjunct] be **definitely** true and the other **definitely** false."

  If we read it this way, the contradiction vanishes. Aristotle is claiming:
  1.  It is true that (Battle will happen OR Battle will not happen). [LEM holds]
  2.  It is **not** yet true that (Battle will happen) **definitely**. [Bivalence is qualified]
  3.  It is **not** yet true that (Battle will not happen) **definitely**.

  ### 2. Bivalence vs. Excluded Middle

  To save contingency, Aristotle effectively drives a wedge between two principles that classical logic usually treats as identical:

  *   **The Law of Excluded Middle (LEM):** For any $p$, ($p \lor \neg p$) is necessary.
  *   **The Principle of Bivalence:** For any $p$, $p$ is either True or False (and we can assign a value now).

  Aristotle accepts LEM for future contingents. It is necessary that *either* there will be a sea battle *or* there will not. To deny this would be to say reality is indeterminate in a way that violates logic.

  However, he restricts **Bivalence** for future contingents. He argues that while the *disjunction* is true, neither *disjunct* possesses a **definite** truth value *yet*.

  This is the "genuine, coherent distinction" you suspected. For Aristotle, truth is a correspondence with reality.
  *   **Present/Past:** The reality exists (or has existed). Therefore, the proposition corresponds definitely. It is determinately true or determinately false.
  *   **Future Contingent:** The reality does not yet exist. The causes are currently capable of producing either outcome. Therefore, the proposition cannot correspond *definitely* to one state of affairs over the other. It is "indefinitely" true or false.

  ### 3. Blocking the Fatalist Argument

  The fatalist argument Aristotle sets up earlier in the chapter relies on this inference:
  1.  If it is **true now** that there will be a sea battle...
  2.  Then it **cannot fail** to happen.
  3.  Therefore, it happens **by necessity**.

  Aristotle accepts (1) only if "true" means "definitely true." His solution is to say that for future contingents, a proposition can be true in an **indefinite** sense without implying necessity.

  *   **Fatalist:** "If 'There will be a battle' is true, then it is necessary."
  *   **Aristotle:** "If 'There will be a battle' is *definitely* true, then it is necessary. But for contingent futures, the proposition is not *definitely* true yet, even though one of the pair (battle/no battle) must be true."

  By inserting the qualifier "definitely" (*hōrismenōs*), he blocks the move from Truth to Necessity. He preserves the idea that the future is open (contingent) without saying that logic breaks down (the disjunction still holds).

  ### 4. Does this contradict his stance on Present/Past?

  You asked if this position succeeds "without quietly abandoning bivalence for ordinary statements about the present and the past."

  The text explicitly safeguards this. Look at the beginning of Chapter 9 (18a28):
  > "With regard to that which **is** or which **has taken place**, propositions, whether positive or negative, must be true or false."

  Aristotle draws a sharp ontological line between the **actualized** (present/past) and the **potential** (future contingent).
  *   For the actualized, causes have been exhausted; the outcome is fixed. Truth is definite. Bivalence applies fully.
  *   For the potential, causes are still in play. Truth is indefinite. Bivalence applies only to the disjunction, not the individual disjuncts.

  So, he is not contradicting himself; he is applying a semantic rule that tracks ontological status. The logic changes because the *nature of the reality* the logic describes has changed.

  ### 5. Summary of the Resolution

  To answer your specific questions directly:

  **1. Is Aristotle contradicting himself?**
  No. The apparent contradiction arises because he uses "true and false" in two slightly different senses.
  *   Sense A (Logical): One side of the contradiction *must* obtain (LEM).
  *   Sense B (Semantic/Ontological): One side is *determinately* the case *now* (Definite Truth).
  He affirms Sense A for futures, but denies Sense B for futures.

  **2. What distinction is doing the work?**
  The distinction between the **necessity of the disjunction** ("It is necessary that either $p$ or not-$p$") and the **necessity of the disjuncts** ("It is necessary that $p$" or "It is necessary that not-$p$").
  It is also the distinction between **truth** and **definite truth**.

  **3. Does it block the fatalist conclusion?**
  Yes. Fatalism requires that if a statement is true *now*, the event is *necessary*. Aristotle argues that for future contingents, a statement can be true (in the sense that it corresponds to what will happen) without being *definitely* true (in the sense that it is fixed by present causes). Therefore, truth does not imply necessity.

  **4. Does it abandon bivalence for present/past?**
  No. Aristotle is explicit that for things that "are or have taken place," propositions "must be true or false" without qualification. The restriction applies *only* to singular statements about future contingents ("not always existent or not always nonexistent").

  ### A Note on the Edghill Translation
  For your reading group, you might find it illuminating to compare Edghill with **J.L. Ackrill (1963)** or **C. Whitaker (1996)**.
  Where Edghill writes: *"it is not necessary that of an affirmation and a denial one should be true and the other false."*
  Ackrill translates: *"it is not necessary that one should be true and the other false."* (Context makes clear he means *definitely*).
  Whitaker emphasizes the modal status: *"it is not necessary that one be true and the other false."*

  The Greek at 19a37 is *ouk anankē... alēthē ē pseudē einai*. The force is on the *anankē* (necessity). Aristotle is saying: "It is not **necessary** that one be true and the other false **in the definite sense**."

  ### Conclusion for the Group
  You can confidently report to your group that Aristotle is maintaining a coherent, albeit nuanced, position. He is a **realist about the Law of Excluded Middle** (reality is determinate enough that $p \lor \neg p$ always holds) but an **anti-realist about Future Truth Values** (reality is not yet determinate enough to make $p$ *definitely* true).

  This allows him to say: "It is true that either there will be a battle or there won't. But it is not yet true *that there will be a battle*." This preserves human agency and contingency without collapsing into logical incoherence. The "contradiction" is merely the friction generated by trying to force a two-valued logic onto a three-valued ontology (Past/Present, Future-Necessary, Future-Contingent).
