      *   *Aristotle's Response:* He wants to save contingency (things *can* go either way).
      *   *The Crux:* How to maintain the Law of Excluded Middle (LEM) without accepting Logical Determinism/Fatalism.
      *   *The "Contradiction":* The user quotes Edghill: "One of the two propositions... must be true and the other false" vs. "it is not necessary that of an affirmation and a denial one should be true and the other false."
      *   *Resolution Strategy:* Most scholars argue Aristotle distinguishes between:
          1.  The truth of the *disjunction* ($p \lor \neg p$) is necessary.
          2.  The truth of the *individual disjuncts* ($p$ or $\neg p$) is not *definitely* or *determinately* true yet.
          3.  Alternatively, he restricts Bivalence (every proposition is either true or false) for future contingents, while keeping Excluded Middle (either $p$ or not-$p$).

  3.  **Evaluate the Edghill Translation:**
      *   Edghill's "actually true or actually false" is a key phrase. In Greek, this relates to *hōrismenōs* (definitely/determinately).
      *   Edghill's "it is not necessary that of an affirmation and a denial one should be true and the other false" is the tricky bit. In Greek (19a37-39), Aristotle says it is not necessary that *one be true and the other false* in the *same way* as present/past things.
      *   *Correction/Nuance:* Aristotle isn't denying that one is true and one false *simpliciter* (which would violate LEM), but denying that they are *determinately* true/false *now*. Or, he is denying that the *necessity* applies to the truth-values themselves.

  4.  **Formulate the Interpretative Options:**
