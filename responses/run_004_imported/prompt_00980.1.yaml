      *   *Correction/Nuance:* Actually, James in *Pluralistic Universe* is exploring a view closer to panpsychism (the "each-form" vs. "all-form"). But in this specific passage, he is critiquing the *mechanical combination* of minds. He is arguing that consciousness comes in wholes.
