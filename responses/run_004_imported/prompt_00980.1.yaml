      *   **The "Twenty-Seventh Fact":** This is the crucial metaphor. If you have 26 letters, you don't have 26 little minds adding up to one big mind. You have 26 possible simple states, and then a *distinct*, complex state that arises under different physiological conditions.
      *   **The "Knowing" Relation:** James distinguishes between the *constitution* of the mental state and the *object* of the mental state.
