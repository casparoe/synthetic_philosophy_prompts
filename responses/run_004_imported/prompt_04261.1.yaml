      *   **Friend's Position:** Reductionism about self $\neq$ elimination of persons/moral responsibility. Buddhist philosophers don't see a contradiction.
      *   **User's Request:** A sharper answer than "Buddhists don't treat it as a contradiction." Is there a principled difference between *anatta* and practical nihilism? Or was the user begging the question?

  2.  **Deconstruct the Philosophical Problem:**
