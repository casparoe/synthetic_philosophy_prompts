      *   Key Buddhist concepts involved: *Anatta* (no-self), *Karma* (action/consequence), *Samsara* (rebirth), *Pratityasamutpada* (Dependent Origination), *Vijnana* (Consciousness), *Alaya-vijnana* (Storehouse Consciousness - Yogacara), *Pudgala* (Person - Pudgalavada).

