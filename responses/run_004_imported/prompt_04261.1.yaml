answer: |-
  This is one of the oldest, most sophisticated, and most persistent objections in the history of Buddhist philosophy. You are not merely splitting hairs on a post-retreat drive; you are replicating a debate that has occupied Buddhist metaphysicians from the *Kathavatthu* (c. 3rd century BCE) to the *Madhyamakavatara* (c. 7th century CE) and into contemporary philosophy of mind.

  Your intuition is sharp: if there is no metaphysical hook to hang identity on, the transmission of karmic debt looks incoherent. However, your friend is also pointing toward something real: the Buddhist tradition insists that *anatta* (no-self) and *karma* (causal moral efficacy) are not only compatible but mutually reinforcing.

  To give you the "sharper answer" you requested, we need to dissect where your argument holds water, where it might be begging the question, and what specific metaphysical machinery Buddhism uses to bridge the gap without smuggling in a soul.

  ### 1. The Category Error: Retribution vs. Causality
  Your argument hinges on the phrase: *"nothing left to explain why the person who acted should be the one who is, in any meaningful sense, rewarded or punished later."*

  This is the first point of friction. You are framing karma through a lens of **retributive justice**. Retributive justice requires a moral agent who *deserves* punishment or reward based on their enduring identity. If the "self" is an illusion, retribution makes no sense.

  However, orthodox Buddhism frames karma not as judicial punishment, but as **natural causality**. It is agricultural or medical, not legal.
  *   **The Analogy:** If I plant a seed, a tree grows. If I eat poison, I get sick.
  *   **The Question:** Does the seed need a "soul" for the tree to grow? Does the person who swallowed the poison need to be metaphysically identical to the person who vomits for the sickness to occur?

  The Buddhist claim is that karma is a law of psycho-physical causality, not a system of cosmic justice. The "fruit" (*vipaka*) is not a reward/punishment administered to a self; it is the inevitable ripening of a causal seed planted in the stream of consciousness. By framing it as "reward/punishment," you may be importing a theistic or substantialist assumption about what karma is *for*.

  ### 2. Identity vs. Continuity (The Parfit Connection)
  You mentioned Derek Parfit, and this is the strongest philosophical ground for your friend's position. In *Reasons and Persons*, Parfit argues that personal identity is not a "deep further fact" but consists in **psychological connectedness and continuity**.

  *   **Your View (Substance View):** For Person B to suffer for Person A's action, Person A and Person B must be *numerically identical* (the same substance).
  *   **The Buddhist/Parfit View (Relation View):** Person A and Person B do not need to be identical; they only need to be causally continuous.

  The classic Buddhist analogy is the **flame**. If you light Candle B from Candle A, is the flame on B the *same* flame as on A? No. Is it a *different* flame? Also no, in the sense that B depends entirely on A. There is a causal continuum without a transference of substance.

  If you accept Parfit's reductionism, you avoid "Annihilationism." Annihilationism (*ucchedavada*) in the Buddhist context doesn't just mean "no self." It means "no self **and** no causal continuity after death."
  *   **Nihilism:** No self, no karma, no consequence.
  *   **Middle Way:** No self, **but** causal continuity remains.

  The principled difference between *anatta* and nihilism is the affirmation of **Dependent Origination** (*pratītyasamutpāda*). Nihilism denies the chain of causation. Buddhism denies the *substance* in the chain, but affirms the *links*.

  ### 3. The Two Truths Doctrine
  This is likely where your friend ran out of words. The distinction between **Conventional Truth** (*samvrti-satya*) and **Ultimate Truth** (*paramartha-satya*) is the metaphysical workhorse that saves karma from incoherence.

  *   **Ultimately:** There is no person. There are only aggregates (*skandhas*) arising and passing. There is no "one" to reap karma.
  *   **Conventionally:** There is a person. There is suffering. There is moral responsibility.

  The charge of nihilism arises if you collapse the Ultimate into the Conventional (saying "nothing matters because there is no self"). The charge of Eternalism arises if you collapse the Conventional into the Ultimate (saying "there must be a self because karma is real").

  The Buddhist answer is: **Karma operates on the conventional level, while Anatta describes the ultimate level.**
  When the Buddha said, "I was the king Mahasammata in a past life," he was speaking conventionally. When he said, "There is no doer, only the deed," he was speaking ultimately.

  Is this a cheat? Critics (like the Nyaya school in India) said yes. Buddhists say no: it is the only way to account for the fact that we experience suffering (conventional) without binding ourselves to that suffering through identification (ultimate).

  ### 4. Where You Might Be Begging the Question
  You asked if you were begging the important questions. In a technical sense, **yes**.

  You are assuming that **moral responsibility requires a metaphysical substrate.** You are arguing: *"If there is no X (self), then Y (responsibility) cannot exist."*
  Buddhism argues: *"Y (responsibility/suffering) exists. Therefore, our understanding of X (self) must be wrong."*

  Your argument presupposes that the only thing that *could* ground responsibility is a permanent self. Buddhism challenges that presupposition. It argues that responsibility is grounded in **causal efficacy**, not identity. If my mental state at T1 causes your suffering at T2, I am karmically responsible, regardless of whether "I" exist at T2.

  However, your intuition is not worthless. You have identified the **soteriological tension**. If there is no self, *who* is liberated? If there is no one to suffer, *why* bother ending suffering?
  The Buddhist answer is pragmatic: Suffering is experienced *as if* there is a self. The illusion of self is what generates the craving that fuels the karmic engine. Seeing through the illusion stops the engine. You don't need a real self to feel pain; you only need the *appearance* of a self.

  ### 5. Historical Nuance: Did They Cheat?
  You suspected that karma might be "smuggling back in exactly the kind of enduring self." Historically, you are partially right. Different Buddhist schools felt this tension differently and proposed different solutions:

  1.  **Theravada:** Uses the *bhavanga* (life-continuum) to link moments of consciousness. It's not a self, but it functions as a carrier.
  2.  **Yogacara:** Proposed the *alaya-vijnana* (storehouse consciousness). This stores karmic seeds and carries them across death. Critics (like Madhyamakas) accused them of secretly positing a *atman* (soul).
  3.  **Pudgalavada:** The "Personalists." They explicitly said the "person" is neither identical to nor different from the aggregates. They were declared heretics by other Buddhists precisely because they sounded too much like they were positing a self to solve the karma problem.
  4.  **Madhyamaka:** (Nagarjuna) Doubled down. They argued that *because* things are empty of self-nature, causality is possible. If things had fixed selves, they couldn't interact or change. Emptiness *enables* karma; it doesn't destroy it.

  ### Verdict on the Argument
  **You were right to feel the tension.** It is the central metaphysical problem of Buddhism. If the teacher's "shadow" analogy implied a fixed entity casting the shadow, that was a pedagogical simplification that borders on heresy.

  **However, your friend was right about the conclusion.** *Anatta* does not logically entail nihilism, provided you accept:
  1.  **Causal Continuity** replaces **Numerical Identity**.
  2.  **Conventional Reality** is sufficient for **Moral Responsibility**.
  3.  **Karma** is causal ripening, not **Retributive Justice**.

  You were begging the question by assuming that responsibility requires a "deep further fact" of identity. Buddhism (and Parfit) argues that once you drop that requirement, ethics becomes *more* coherent, not less, because you stop acting to protect a fictional "self" and start acting to alleviate the actual suffering present in the causal stream.

  **The Sharper Answer:** The difference between *anatta* and nihilism is the affirmation of **causal continuity without ontological commitment**. Nihilism says the stream stops or doesn't matter. *Anatta* says the stream flows, causes effects, and suffers, but there is no "water" in the river, only the flowing. The suffering is real; the sufferer is not. That is the Middle Way.
