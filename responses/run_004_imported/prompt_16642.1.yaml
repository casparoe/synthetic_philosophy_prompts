answer: |-
  Here is a constructed example designed to support your position: that the indeterminacy problem is structural to selected-effects theories, not merely a artifact of simple reflexes.

  ### The Example: The Capuchin "Spectral-Reflectance" Detector

  **The Organism and Trait:**
  Consider a lineage of Capuchin monkeys (*Cebus capuchinus*) possessing a sophisticated visual-cognitive module used for foraging. This module does not operate as a simple reflex (like the frog's tongue); it involves complex object permanence, depth perception, and memory integration to guide the monkey through the canopy to a food source.

  **The Selection History:**
  For one million years, this lineage relied exclusively on a specific species of fig, *Ficus ancestral* (Property **F**), which was highly nutritious and digestible. *Ficus ancestral* possessed a unique spectral-reflectance profile (Property **P**)—a specific way of reflecting UV and visible light—that was caused by the unique chemical composition of its skin.

  Crucially, throughout this entire selection history, Property **F** (Nutritious Fig) and Property **P** (Spectral Profile) were **perfectly co-extensive**.
  1.  Every object with Profile **P** was a *Ficus ancestral* (**F**).
  2.  Every *Ficus ancestral* (**F**) had Profile **P**.
  3.  No other object in the environment (leaves, bark, other fruits, stones) possessed Profile **P**.

  The visual module was selected because it allowed monkeys to identify **P** from a distance, navigate to it, and consume **F**. Monkeys with this module out-reproduced those without it because they successfully ingested **F**.

  **The Divergence:**
  In the present day, an invasive plant species, *Toxicus mimicus*, evolves (or is introduced). It produces fruit that is indigestible and poisonous, but due to convergent evolution, its skin possesses the exact same spectral-reflectance profile **P**.

  A monkey encounters a *Toxicus* fruit. Its visual module fires, generating a perceptual state that guides it to eat the fruit. The monkey gets sick.

  **The Indeterminacy:**
  The teleosemanticist must now specify the content of that perceptual state.
  *   **Hypothesis 1:** The content is **"There is a Nutritious Fig (F)."** On this view, the monkey has *misrepresented* the toxic fruit. The mechanism failed.
  *   **Hypothesis 2:** The content is **"There is an Object with Spectral Profile P."** On this view, the monkey has *correctly represented* the fruit. The mechanism worked perfectly; the environment simply changed such that P no longer guarantees F.

  **Why Selection History Cannot Decide:**
  Your friend argues that richer selection pressures resolve this. However, in this case, the selection pressure was "ingest nutritious food," but the *selection criterion for the trait* was "track Profile P."
  Throughout the entire history where the trait was being shaped, tracking **P** *was* ingesting **F**. There is no historical fact that privileges **F** over **P**. The genes were selected because they tracked **P**, and tracking **P** resulted in **F**. To say the content is **F** rather than **P** is to assert that the *ultimate benefit* (nutrition) trumps the *proximate mechanism* (spectral detection) in determining content. But selected-effects theory defines content by the conditions under which the trait was selected, and the trait was selected for detecting **P** (which happened to be **F**). Both descriptions fit the historical data equally well.

  ### Why "Normal Conditions" Does Not Settle It

  Millikan attempts to solve this by appealing to **Normal Conditions**. She argues that the content of a representation is determined by the conditions that obtained during the evolutionary past when the trait successfully performed its function (its "Normal" functioning).

  1.  **The Identity Problem:** In the Normal Conditions of this monkey's evolutionary past, **P** and **F** were identical. Whenever the mechanism worked normally, it detected **P** *and* it found **F**. Therefore, the "conditions required for success" in the historical record include *both* "Presence of P" and "Presence of F." The history does not contain a single instance where the monkey detected **P** but failed to find **F**. Consequently, the historical record provides no leverage to pry **P** and **F** apart. To choose **F** as the content requires importing information *outside* the selection history (i.e., our modern knowledge that nutrition is "what really matters").

  2.  **The Chain of Consumers:** Millikan suggests content is fixed by the needs of the "consumer" of the representation (the downstream systems that use the visual data). But this pushes the problem back rather than solving it.
      *   The immediate consumer of the visual state is the **motor system** (guiding the hand). The motor system only requires coordinates of **P** to function. It doesn't "know" about nutrition.
      *   The downstream consumer is the **digestive system**. It requires **F**.
      *   Teleosemantics lacks a principled rule for *which* consumer fixes the content. If the visual state's content is fixed by the motor system, the content is **P** (veridical representation). If fixed by the digestive system, the content is **F** (misrepresentation). Since the theory allows for chains of consumers, it cannot non-arbitrarily stop the chain at the digestive system to declare the content "Fig" rather than "Spectral Profile."

  **Conclusion:**
  Even with a sophisticated cognitive trait involving complex visual processing and memory, if two properties are co-extensive during the selection period, the selected-effects history underdetermines the content. Appealing to Normal Conditions fails because, in those conditions, the two properties are indistinguishable. This suggests the problem is indeed structural, as you argued, and not merely a quirk of crude reflexes.
