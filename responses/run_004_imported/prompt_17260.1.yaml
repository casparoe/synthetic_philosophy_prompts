answer: |-
  Good morning.

  For thirty years, my aunt stood at the threshold. In the intensive care unit, in the chaotic minutes of a code, and in the quiet solemnity of a committee room, she was the one tasked with knowing exactly when a person had left their body behind. She was a guardian of that boundary. She treated the definition of death not as a technicality, but as a sacred trust. To her, calling a time of death was the last act of care she could offer a patient, and the first act of honesty she owed a family.

  She was a woman who believed that clarity was a form of kindness. She did not believe in softening the truth to make it easier to swallow, because she believed the people she spoke to deserved the strength of the truth. She spent fifteen years on her hospital's brain-death determination committee. She knew the biology better than anyone in this room. But she also knew the philosophy. She understood that medicine is not just about what is happening in the cells, but about what we owe each other as human beings.

  Ten days ago, she suffered a massive stroke. The damage was catastrophic. Her physicians, her colleagues, and her friends agreed on the medical reality: she would not recover. She would not wake.

  In keeping with wishes she had held for years, life support was withdrawn. And in keeping with the life she had lived, she became an organ donor.

  Now, for those of us who are not doctors, the mechanics of donation can seem like a mystery. But for my aunt, there was no mystery, only responsibility. She knew the difference between the different paths to donation better than anyone. She spent her career applying the neurological criteria to others. But for herself, she passed via the circulatory route.

  I know, and her colleagues in the front rows know, that she had strong, nuanced views on the ethics of that distinction. She knew that the line between life and death is not always a bright white line drawn by biology alone. Sometimes, it is a line drawn by human decision. She understood better than anyone that declaring death is sometimes less about what the body *cannot* do, and more about what we *will not* ask it to do.

  She knew that "irreversible" and "permanent" are not the same word, even if they lead to the same quiet room. She spent her career worrying that we might treat them as synonyms. But in the end, she accepted that distinction not as a flaw in the system, but as a testament to the weight of the choice. She chose not to be resuscitated. She chose to let her heart stop permanently. And in doing so, she validated the very standard she spent her life scrutinizing.

  I tell you this not to complicate your grief, but to honor her integrity. Some people might worry that because she thought so hard about the rules, she might have been uncertain about her own end. I am here to tell you she was not. Her scrutiny was not doubt. It was respect. She respected the threshold so much that she refused to cross it carelessly.

  For her family, who only need to know that she was at peace: She was. There is no question that she was gone. The decision to withdraw support was not a cause of her death; it was an acknowledgment that her life's work was finished. She did not die to give life to others; she died, and because of who she was, she found a way to give life even after she was gone.

  To her colleagues: She died exactly as she lived. She held herself to the standard she applied to the world. She knew the ethical cost of the work, she paid it willingly, and she left the system better than she found it. She knew that the "Dead Donor Rule" relies on trust, and she spent thirty years earning that trust, ending with her own body.

  To her friends and family: She loved you. She loved the quiet moments, the loud laughs, the Sunday dinners. The doctor was who she did; the aunt was who she *was*. And the woman who sat with us, who held our hands, who worried about whether we were eating enough vegetables—that woman is the one we say goodbye to today.

  There is a comfort in knowing that she arranged this herself. There is a comfort in knowing that she did not want her body to outlast her spirit. She wanted her final act to be one of utility and grace.

  She spent thirty years telling other families that it was okay to let go. That love does not require machinery. That death is not a defeat when the battle is over. Ten days ago, she took her own advice. She let go. And in that letting go, she gave us a final lesson in the honesty she cherished.

  We can say goodbye without wondering if she was ready. She was ready. We can say goodbye without wondering if she was truly gone. She was. And we can say goodbye knowing that the same fierce intelligence that protected so many patients in the ICU protected her own dignity at the end.

  She guarded the threshold for us for three decades. Today, we walk her to the other side of it. We do so with the same clarity she demanded, the same honesty she practiced, and with the absolute certainty that she is at rest.

  Thank you.
