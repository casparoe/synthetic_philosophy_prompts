prompt: |-
  My aunt, a critical-care physician who spent almost three decades running codes and calling times of death, and who sat for the last fifteen years of her career on her hospital's brain-death determination committee, died ten days ago after a massive stroke from which her physicians agreed she would never meaningfully recover. In keeping with wishes she had held for years, life support was withdrawn and she became an organ donor herself — but by the circulatory route rather than the neurological one she had spent her career applying to other people's relatives, since her brainstem reflexes never fully disappeared and she did not meet whole-brain criteria. I am delivering her eulogy this coming weekend, and there is one specific difficulty I do not think I can simply write around: she was known among colleagues for being quite open that she found the short waiting period used to declare circulatory death harder to defend on strictly biological grounds than the neurological criterion she used on everyone else — not because she thought it an unreasonable basis for practice, but because what actually licenses it is that resuscitation will not be attempted, not that it could no longer succeed, and she considered it a small but real intellectual dishonesty to treat "permanent" and "irreversible" as though they meant the same thing.

  The funeral will seat a couple dozen transplant physicians and organ-procurement colleagues who knew exactly where she stood on this, among a much larger group of relatives and old friends who have never heard of the dead donor rule and are not there for a lesson in it. I do not want the eulogy to quietly imply, for the sake of everyone's comfort, that there was nothing here she ever thought hard about; that would be false to her, and visibly so to the people in the first two rows. But I also do not want it to raise the distinction only to leave everyone else wondering, at the one moment they most need not to wonder it, whether she was really gone when they said goodbye, or whether the donation she had arranged so deliberately for herself was in some sense premature. Could you write the eulogy? It should run five to seven minutes and needs to function, without any hedge visible to the family, as complete and honest comfort, while still being something her colleagues would recognize as true to exactly what she thought.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's aunt, a critical-care physician (30 years), ran codes, called times of death, served on the brain-death determination committee (15 years).
      *   **Cause of Death:** Massive stroke, life support withdrawn, became an organ donor via *circulatory* route (DCD - Donation after Circulatory Death), not neurological (DBD - Donation after Brain Death).
      *   **The Conflict/Complexity:** She was intellectually honest about the distinction between "permanent" (won't restart on its own/won't be restarted) and "irreversible" (can't be restarted) in circulatory death determination. She felt the short waiting period for DCD was harder to defend biologically than brain death criteria, acknowledging it relies on the *decision* not to resuscitate rather than the *inability* to resuscitate. She saw a "small but real intellectual dishonesty" in conflating the two.
      *   **Audience:** Mixed. A few dozen transplant/procurement colleagues (who know her stance) + a larger group of family/friends (who don't know the medical ethics).
      *   **Goal:** Write a 5-7 minute eulogy.
      *   **Constraints:**
          *   Must be honest to her intellectual rigor (colleagues must recognize her views).
          *   Must provide complete comfort to family (no doubt about whether she was "really gone" or if donation was "premature").
          *   Cannot be a lecture on the Dead Donor Rule.
          *   Cannot hedge or lie about her thoughtful nature.
          *   Must resolve the tension between her ethical scrutiny and the peace of her passing.

  2.  **Deconstruct the Ethical Tension:**
      *   *The Issue:* In Brain Death (DBD), the brain is dead. In Circulatory Death (DCD), the heart stops, we wait 2-5 minutes, and declare death. Technically, the heart *could* be restarted (auto-resuscitation is rare but possible, or CPR *could* work if attempted), but we don't try because the patient/family chose to withdraw care. So death is defined by *permanence* (cessation of function that will not be reversed) rather than *irreversibility* (cessation of function that cannot be reversed).
      *   *Her Stance:* She knew this distinction. She didn't think it made the practice *wrong*, just that it required intellectual honesty about *why* it's permissible (the decision not to treat).
      *   *The Risk:* If I mention this too plainly, family might think, "Wait, could she have come back? Did we kill her for organs?" If I ignore it, colleagues will think, "She's rolling in her grave; you're simplifying her legacy."
      *   *The Solution:* Frame her scrutiny not as doubt about the *validity* of her death, but as a testament to her *integrity* and her respect for the gravity of the threshold between life and death. Her donation wasn't an act of carelessness; it was an act of precise, deliberate trust in the system she helped steward, even while questioning its edges. She chose the path that allowed life to continue, fully accepting the philosophical weight of that choice.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge her role as a healer and a guardian of thresholds. Establish her character (rigorous, honest, compassionate).
      *   **The Medical Life:** Mention her career (codes, brain death committee). Validate her expertise.
      *   **The End of Life:** Describe the stroke and the decision. Connect her personal end to her professional life.
      *   **The Ethical Core (The Tricky Part):** Address her intellectual honesty without using jargon like "permanent vs. irreversible." Focus on her respect for the *definition* of death. She didn't take the line lightly. She knew the weight of the pen.
      *   **The Donation:** Frame it as her final act of consistency. She held others to a high standard, and she held herself to the same one.
      *   **Comfort/Closure:** Reassure the family that she was at peace, that the decision was hers, and that she is truly gone. The "honesty" was about respect for life, not doubt about her passing.
      *   **Conclusion:** A farewell that honors both the doctor and the aunt.

  4.  **Refining the "Ethical Core" (Crucial Step):**
      *   *How to say it:* Instead of saying "She knew circulatory death is biologically fuzzier than brain death," say "She understood better than anyone that the line between life and death is not just a biological switch, but a human promise."
      *   *Addressing the "Permanent vs. Irreversible" nuance:* "She knew that declaring death is sometimes less about what the body *cannot* do, and more about what we *will not* ask it to do." This captures the essence (decision not to resuscitate) without triggering panic.
      *   *For the Colleagues:* They will hear "what we will not ask it to do" and nod. That's the DCD criteria (withdrawal of support).
      *   *For the Family:* They will hear "we didn't force her body to fight anymore." That's comfort.
      *   *Addressing the "Dishonesty":* Frame it as her striving for *truth*. "She refused to simplify the hard things."

  5.  **Drafting - Tone and Timing:**
      *   Tone: Dignified, warm, intellectually respectful, soothing.
      *   Length: 5-7 minutes is roughly 750-1000 words spoken at a moderate pace.
      *   Key Phrase to include (implicitly or explicitly): The integrity of the threshold.

  6.  **Review against Constraints:**
      *   *Family Comfort:* Does it suggest she wasn't dead? No, it emphasizes she chose not to be kept there.
      *   *Colleague Truth:* Does it acknowledge the DCD nuance? Yes, by highlighting the "decision" aspect of circulatory death.
      *   *No Lecture:* Keep the language metaphorical/philosophical, not clinical.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't imply she died *for* the organs. She died *and then* donated. The sequence matters ethically.
      *   *Correction:* Ensure the "intellectual dishonesty" point is transformed into "intellectual humility." She didn't call it a lie; she called it a complexity she accepted.
      *   *Emphasis:* Focus on her *agency*. She chose this. That resolves the "premature" fear.

  8.  **Final Word Count Check:** Aiming for ~900 words.

  *(Self-Correction Note during drafting the specific paragraph on ethics)*: I need to be very careful not to say "She knew the waiting period was short." Instead, focus on "She knew the definition relied on a promise."
  *Drafting thought:* "She spent her career guarding the boundary. She knew that boundary was drawn by human hands as much as biology." -> This signals colleagues she gets the social construction of death criteria, but tells family it was a careful human decision.

  Let's write.

  *(Post-Draft Review)*: Does this meet the "permanent vs irreversible" nuance?
