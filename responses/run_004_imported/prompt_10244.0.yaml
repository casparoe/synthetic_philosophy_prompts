  **MEMORANDUM**

  **TO:** The Board of Directors, [Name] Regional Writers' Guild
  **FROM:** The Jury Committee, [Name] Debut Novel Prize
  **DATE:** [Date]
  **SUBJECT:** Finalist Eligibility Determination & Policy Recommendation Regarding Generative AI

  ### 1. Executive Decision
  After reviewing the disclosure made by Finalist [Author Name] regarding the use of generative AI tools during the drafting process, the Jury has voted to **retain the entry on the shortlist** for the current prize cycle.

  However, this decision is accompanied by an immediate recommendation for policy clarification for all future cycles. Additionally, the Jury recommends that the Guild issue a public statement acknowledging the specific nature of this entry's creation to ensure transparency for the other finalists, the press, and the readership.

  ### 2. Context & Rule Interpretation
  The current prize rules state that submissions must be "the entrant's own original creative work." They do not explicitly prohibit the use of software assistance, drafting tools, or collaborative technologies.

  Finalist [Author Name] voluntarily disclosed that approximately one-third of the manuscript's chapters were initially drafted using a generative AI engine fed with her original outlines and character notes. She further stated that every AI-generated passage underwent "heavy rewriting" before being integrated into the final manuscript.

  ### 3. Deliberation & Competing Principles
  The Jury's deliberation was rigorous and evenly divided. We recognize that this decision sets a precedent, and we wish to explicitly record the strength of the opposing argument to ensure the Guild understands the gravity of the situation.

  **The Argument for Disqualification (The "Combinational" Standard)**
  A significant portion of the Jury argued that the entry should be removed from consideration. The core of this argument rests on the definition of *writing* as a combinational art. In this view, the primary creative act of a novelist is not merely the architectural design of plot and character, but the specific, sentence-by-sentence selection of language that creates voice, rhythm, and subtext.
  *   **The Precedent Risk:** By accepting this entry, we risk signaling that the "prose" itself is secondary to the "story," potentially devaluing the craft of sentence-level construction that this prize exists to reward.
  *   **The Tool vs. Author Distinction:** While writers have always used tools (from dictation to editors), those tools do not generate combinatorial prose based on probability. An editor suggests; an AI generates. If the initial texture of the prose is machine-derived, even if rewritten, the "original creative work" is arguably hybrid rather than singular.
  *   **Fairness to Peers:** The other two finalists operated under the traditional assumption that the drafting process was wholly human. Allowing a method that accelerates the "blank page" phase could be seen as providing an unfair competitive advantage in a contest designed to measure individual craft.

  **The Argument for Retention (The "Architectural & Revision" Standard)**
  The Jury ultimately leaned toward retention based on the following principles:
  *   **Rule Ambiguity & Good Faith:** The entrant acted in good faith by disclosing the methodology unprompted. Disqualifying an entry based on an interpretation of rules that were not explicit at the time of submission constitutes an *ex post facto* penalty. The entrant followed the rules as they were written.
  *   **Authorship as Revision:** Literary history is filled with collaborative and assisted drafting. In this specific case, the entrant provided the core intellectual property (outline, characters, themes) and retained final authority over every sentence through heavy rewriting. If the final text reflects her voice and choices, the "original creative work" resides in the curation and refinement, not just the initial keystroke.
  *   **The Purpose of the Prize:** This prize aims to support debut *authors*, not just debut *drafters*. If the final manuscript stands on its own merits as a cohesive, human-resonant work, penalizing the process risks policing methodology over outcome.

  ### 4. Resolution
  The Jury determined that while the concerns regarding "combinational creativity" are valid and vital, they cannot be enforced retroactively without damaging the Guild's reputation for fairness. Therefore, [Author Name] will remain a finalist.

  However, to address the concerns of the "Disqualification" faction and maintain integrity:
  1.  **Transparency:** The Guild will append a brief note to this author's bio in all prize materials stating: *"This work utilized generative AI tools in the drafting phase, in accordance with current prize guidelines."* This ensures the other finalists are not disadvantaged by a lack of disclosure.
  2.  **Judging Criteria:** Jurors for this final round have been instructed to evaluate the manuscript solely on the quality of the final text, ensuring that any "AI artifacts" (if present) are judged as writing flaws rather than ethical ones.

  ### 5. Future Policy Recommendation
  The Jury strongly urges the Board to update the prize rules immediately for the next cycle. We recommend the following language:

  > *"Submissions must be the result of human authorship. The use of generative AI tools to draft, expand, or write prose is not permitted. Authors may use AI for brainstorming or editing assistance provided the final text is wholly written by the author. Entrants must disclose any use of AI tools during the submission process."*

  ### 6. Conclusion
  This decision was not made lightly. We acknowledge that the landscape of writing is shifting, and this prize must evolve to protect the value of human craft while remaining fair to those who entered under the old rules. By retaining the finalist with full disclosure, we honor our current rules while drawing a clear line for the future.

  **Signed,**
  The Jury Committee
  [Name] Regional Writers' Guild

  ***

  ### Notes for the User (The Juror)
  *   **Why this draft?** I chose the "Retain with Disclosure" option. It is the most legally defensible position (avoiding *ex post facto* punishment) but still validates the concerns of the half of the jury who want her out.
  *   **The "Opposing Side" Engagement:** Section 3 explicitly details the "Combinational Standard." This ensures that if you vote to keep her, the jurors who wanted to pull her feel their argument was heard and recorded, not ignored.
  *   **Flexibility:** If your jury votes to **remove** her on Tuesday, you can flip Section 1 and 4. You would argue that "Original Creative Work" *inherently* implies human drafting, and that the "heavy rewrite" does not negate the fact that the foundational prose was machine-generated.
  *   **The "Middle Ground":** The disclosure note is key. It protects the other two finalists (who didn't use AI) from feeling like the process was rigged, which prevents them from withdrawing or bad-mouthing the prize.
