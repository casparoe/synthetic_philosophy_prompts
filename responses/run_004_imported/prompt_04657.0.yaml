answer: |-
  This is a fantastic question. You have grasped the standard interpretations better than many undergraduate philosophy students, and your intuition that there is a shift in the *kind* of argument being made in that final section is exactly right.

  To answer your core question directly: **Yes, the final move is doing new argumentative work.** It is not merely a restatement of the "seeking a horse" (extensional) argument; it is a shift from pragmatics to ontology.

  However, whether the argument "holds up" depends entirely on whether you accept Gongsun Long's underlying metaphysical assumptions about language and reality. Your friend's reaction ("wordplay dressed up as logic") is the standard realist critique, but modern sinologists and philosophers of language tend to view it as a rigorous, if counter-intuitive, exploration of semantics.

  Here is a breakdown of the mechanics of that final passage, the distinction it relies on, and where the "sleight of hand" (if there is one) actually lies.

  ### 1. The Shift: From Extension to Intension

  You correctly identified the earlier argument as extensional: *If I ask for a horse, a yellow horse satisfies the request. If I ask for a white horse, a yellow horse does not. Therefore, the requirements are different.*

  The final passage you are stuck on shifts to **intension** (the internal content of a concept) and **ontology** (the nature of existence).

  The key phrase you cited, *bái zhě bù dìng suǒ bái* (白者不定所白), translates roughly to: **"Whiteness does not determine what is white."**

  *   **Whiteness on its own (*Bái*):** This is treated as a free-floating universal. It is the abstract property of "white." It is not committed to any specific object. It could adhere to a stone, a feather, or a horse. In Gongsun Long's metaphysics, this "White" exists as an independent conceptual entity (a *zhǐ*, often translated as "index" or "universal").
  *   **Whiteness fixed (*Bái mǎ*):** When you say "White Horse," you have taken that free-floating universal "White" and pinned it to the universal "Horse."

  **The New Logical Move:**
  Gongsun Long is arguing that **a compound concept is not identical to one of its constituents.**
  *   Let $A$ = Horse
  *   Let $B$ = White
  *   Let $AB$ = White Horse

  The earlier argument showed that the *extension* of $A$ is wider than $AB$.
  The final argument claims that the *identity* of $AB$ is distinct from $A$ because $B$ has altered the state of $A$. By adding "White," you have created a new, specific entity that excludes what $A$ alone includes.

  ### 2. Is there a genuine distinction here?

  You asked: *Is there a genuine distinction between "whiteness on its own" and "whiteness as pinned to some particular thing"?*

  In modern philosophy, we might call this the distinction between a **property** and a **trope**, or a **universal** and a **particular**. Gongsun Long is effectively arguing for a form of **Platonic Realism** regarding attributes. He believes "White" exists as a distinct logical entity prior to it being attached to a horse.

  *   **If you accept this:** Then "White Horse" is a fusion of two independent entities. A fusion is not the same as one of the parts. (Just as "Ice" is not identical to "Water" in terms of concept, even if chemically similar, or "Red Light" is a specific subset of "Light" with different properties).
  *   **If you reject this (Aristotelian view):** You would argue that "whiteness" does not exist on its own. It only exists *in* things. Therefore, separating "White" from "Horse" is an artificial linguistic trick.

  Gongsun Long forces you to accept the former to follow his logic. He is treating words as having ontological weight. The Name (*Míng*) dictates the Reality (*Shí*). If the Name changes, the Reality it points to changes.

  ### 3. The "Is Not" (*Fēi* 非) Sleight of Hand

  This is the crux of your second question: *Is he trading on a hidden shift in what "is not" means?*

  The character *fēi* (非) is a negator. In Classical Chinese, it functions somewhat like "is not," but it is flexible. It can mean:
  1.  **Non-identity:** $A \neq B$ (The concept "White Horse" is not identical to the concept "Horse".)
  2.  **Non-membership:** $A \notin B$ (A white horse is not a member of the class of horses.)

  **The Verdict:**
  Gongsun Long is arguing for **(1)** but hoping you will feel the paradox of **(2)**.

  *   **Logically (1):** He is correct. The *concept* "White Horse" is not identical to the *concept* "Horse." One is simple; the other is complex. One excludes color; the other demands it. As concepts, they are distinct.
  *   **Empirically (2):** He is incorrect (or being provocative). A physical white horse *is* a member of the class of horses.

  The "sleight of hand" is that he treats the **Name** ("White Horse") as if it were the **Object**. He is not saying "This physical animal over here is not a horse." He is saying "The term 'White Horse' is not equivalent to the term 'Horse'."

  Because Classical Chinese often omits the distinction between the word and the thing it refers to, Gongsun Long exploits this ambiguity. He is doing philosophy of language, but phrasing it as metaphysics.

  ### 4. Does the argument hold up on its own terms?

  If we grant Gongsun Long his premises (that Names have independent ontological status and that adding a modifier creates a new, distinct Name), **the argument is valid.**

  Here is the reconstructed logic of that final passage:

  1.  **Premise 1:** "White" (the universal) is uncommitted (it does not specify an object).
  2.  **Premise 2:** "Horse" (the universal) is uncommitted (it does not specify a color).
  3.  **Premise 3:** "White Horse" is a compound where "White" is committed to "Horse."
  4.  **Premise 4:** An uncommitted concept (Horse) allows for yellow/black. A committed concept (White Horse) excludes yellow/black.
  5.  **Premise 5:** Two concepts that have different exclusion criteria cannot be identical.
  6.  **Conclusion:** Therefore, the concept "White Horse" is not the concept "Horse" (*Bái mǎ fēi mǎ*).

  **Where it breaks down (The Critique):**
  The argument breaks down if you insist that language is merely a tool for categorizing physical objects rather than a system of independent logical entities.
  *   **The "Red Car" Counter:** If I say "A red car is not a car," you would say I'm being silly. But if I say "The *category* 'Red Car' is not identical to the *category* 'Car'," you would agree. Gongsun Long is making the second claim but phrasing it like the first.

  ### 5. Why does this matter? (The Purpose)

  If this were just a parlor trick, it wouldn't have survived 2,000 years. The School of Names (*Míngjiā*) was concerned with the **Rectification of Names** (*Zhèngmíng*).

  In the Warring States period, political chaos was often blamed on linguistic confusion. Lords claimed titles they didn't deserve; laws were enforced using vague terms. Gongsun Long's point is likely **prescriptive**:

  *   We must be precise.
  *   If you promise me a "horse," giving me a "white horse" is technically fulfilling the promise, but the concepts are distinct.
  *   If we treat compound terms as identical to their root terms, we lose the ability to make precise distinctions in law and ethics.

  By arguing "White Horse is Not Horse," he is forcing his audience to acknowledge that **specificity changes identity.** In a legal contract, the difference between "horse" and "white horse" might matter (e.g., for ritual sacrifice where only white animals are pure). If you conflate the two, you violate the ritual.

  ### Summary for your understanding

  1.  **Is it new work?** Yes. It moves from "what objects fit the label" to "how concepts are constructed."
  2.  **Is the distinction genuine?** Yes, it distinguishes between an abstract universal ("White") and a qualified compound ("White Horse"). It treats the compound as a new logical entity.
  3.  **Is it sleight of hand?** It relies on the ambiguity between "concept identity" (True: The terms are different) and "class membership" (False: The object is not a horse). Gongsun Long conflates the two to make a point about precision.
  4.  **Does it hold up?** It holds up as a piece of semantic logic (the intension of 'white horse' $\neq$ the intension of 'horse'), but fails as a statement of physical reality (a white horse $\in$ horses).

  You are right to sense that it isn't just nonsense. It is a rigorous, if provocative, assertion that **language structures reality.** When you add a modifier, you aren't just describing the same thing more closely; you are creating a new logical category that is distinct from the original.

  If you want to read more on this specific logical mechanic, look for analyses of Gongsun Long by **A.C. Graham** (specifically *Later Mohist Logic, Ethics and Science*, which contextualizes the School of Names) or **Chad Hansen** (*A Daoist Theory of Chinese Thought*), who argues that Chinese nouns function more like "mass terms" (like "water" or "clay") than count nouns, which changes how we interpret "White Horse." Hansen's view explains why Gongsun Long feels "White" and "Horse" can be mixed like substances to create a new substance ("White-Horse-Stuff") that is distinct from "Horse-Stuff."
