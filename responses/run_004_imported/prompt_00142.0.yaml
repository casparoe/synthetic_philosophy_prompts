answer: |-
  This is a classic negotiation scenario involving **BATNAs** (Best Alternative to a Negotiated Agreement) and the division of **cooperative surplus**.

  To determine who is more reasonable, we need to break down the numbers and the underlying principles of each argument.

  ### 1. The Numbers Breakdown

  *   **The Deal:** $80,000 (Competitor's offer for the *combined* business).
  *   **The Fallback (BATNA):** If you don't agree on how to split the $80k, the deal dies.
      *   You keep your inventory: **$10,000**
      *   She keeps her inventory: **$4,000**
      *   **Total Fallback Value:** **$14,000**
  *   **The Surplus:** The value created *only* by agreeing to the competitor's deal.
      *   $80,000 (Deal) - $14,000 (Fallback) = **$66,000 Surplus**

  ### 2. Evaluating Your Partner's Approach
  **Her Proposal:** Split the surplus ($66,000) equally, after securing individual fallbacks.
  *   **Her Math:**
      *   You get: $10,000 (fallback) + $33,000 (half surplus) = **$43,000**
      *   She gets: $4,000 (fallback) + $33,000 (half surplus) = **$37,000**
  *   **The Logic:** This is based on the **Nash Bargaining Solution**, a standard game theory concept. It argues that since the $80,000 offer is only possible because *both* of you agree to sell jointly, the *extra* value generated by that cooperation ($66,000) should be shared equally.
  *   **Verdict:** This is the **more legally and negotiation-standard approach.** It acknowledges that without her agreement, you cannot access the $80,000; you are stuck with $10,000. She holds veto power over the deal, giving her leverage equal to yours regarding the *surplus*.

  ### 3. Evaluating Your Approach
  **Your Proposal:** Split based on hypothetical individual sale values ($50k vs. $20k).
  *   **Your Math:**
      *   Total hypothetical value: $70,000.
      *   Your share ratio: 50/70 (approx 71%).
      *   Her share ratio: 20/70 (approx 29%).
      *   Applied to $80,000: You get **~$57,140**, She gets **~$22,860**.
  *   **The Logic:** You are arguing based on **contribution or market potential**. You believe your portion of the business (contacts, inventory quality) drives more value.
  *   **The Flaw:** There is a critical inconsistency in your numbers.
      *   Your *Fallback* (what you actually own alone) is **$10,000**.
      *   Your *Hypothetical* (what you claim you could sell) is **$50,000**.
      *   **The Discrepancy:** To get $50,000, you would likely need to sell the *entire* combined business (including her inventory and customer list) on your own. You cannot unilaterally sell her share of the assets. Therefore, using the $50,000 figure to claim a larger share of the *joint* pot is effectively claiming value from *her* assets because you think you can sell them better than she can. That is leverage, not ownership equity.

  ### 4. Who is More Reasonable?
  **Your partner's approach is more reasonable** in the context of a joint ownership wind-down, unless you have a prior operating agreement that states otherwise.

  Here is why:
  1.  **Veto Power:** She can block the $80,000 deal. If she does, you lose $30,000 compared to your proposal ($43k vs $57k). Her cost of disagreement is low; yours is high.
  2.  **Joint Value:** The competitor is paying $80,000 for the *combination*. If your parts were truly worth $50k and $20k separately ($70k total), the competitor wouldn't be paying a $10k premium for synergy. The premium exists because the assets are intertwined.
  3.  **Risk:** Your proposal risks deadlock. If she feels shortchanged, she may refuse to sign, and you both drop to the $14,000 fallback. You would lose $33,000 from your partner's proposal just to gamble on an extra $14,000.

  ### 5. Is There a Better Way?
  While her baseline is stronger, there is a middle ground if your contributions to the business were historically unequal.

  **Option A: The "Equity" Check**
  How is the business legally owned?
  *   **50/50 Ownership:** Her proposal is the standard. Pushing for more could be seen as aggressive and damage your reputation or lead to legal stalemate.
  *   **Unequal Ownership (e.g., 70/30):** If you legally own 70% of the company based on capital contribution or past profit share, you should split the **$80,000** (not just the surplus) according to that percentage.
      *   *Example (70/30 split):* You get $56,000, She gets $24,000. This is very close to your proposal but based on legal equity rather than hypothetical sale value.

  **Option B: Weighted Surplus Split**
  If you don't have a formal equity split but you *did* generate 70% of the revenue historically, you can argue for a weighted split of the **surplus only**.
  *   Fallbacks secured: You $10k, Her $4k.
  *   Surplus ($66k) split 70/30 based on historical contribution.
  *   You get: $10k + $46.2k = **$56,200**
  *   She gets: $4k + $19.8k = **$23,800**
  *   *Why this works:* It acknowledges her veto power (she gets the full surplus split baseline) but rewards your higher contribution (you get more of the gain).

  ### Recommendation
  1.  **Accept that her baseline is strong.** Do not threaten to walk away; your BATNA ($10k) is much worse than hers ($4k) in relative terms, but she holds the key to the $80k.
  2.  **Audit Historical Contributions.** If you brought 80% of the customers or capital, present that data. Propose **Option B** (Weighted Surplus).
  3.  **If contributions were roughly equal:** Take her offer ($43k/$37k). The risk of losing the deal over $14,000 is not worth it. Securing $43,000 is a 330% return on your $10,000 fallback.
  4.  **Get it in writing.** Once agreed, ensure the competitor pays into an escrow account that distributes funds immediately according to the split, so one partner doesn't hold the funds hostage.

  **Summary:** Your partner is using a standard, defensible negotiation framework. You are using a hypothetical framework that relies on assets you don't solely control. Unless you have proof of unequal equity ownership, her approach is the safer and more "reasonable" path to closing the deal.
