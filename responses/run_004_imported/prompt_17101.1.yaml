prompt: |-
  hey so I'm a CS PhD student working on multi-agent epistemic planning, and a philosopher friend dragged me into her formal epistemology reading group last week where we hit the logical omniscience problem for possible-worlds models of knowledge -- standard semantics has agents knowing every tautology and everything that logically follows from what they know, which is obviously nuts for any bounded reasoner. two of the classic fixes on the table were Hintikka/Rantala-style impossible worlds semantics and Fagin & Halperns awareness logic. can you compare the two: what each one actually does to block the omniscience results, and what it costs you to get there (i.e. what nice feature of the original semantics you have to give up). then give me an actual verdict -- which one is the better solution, the one that really diagnoses why real agents aren't logically omniscient, versus one thats just a patch that relocates the omniscience somewhere less visible. no 'it depends' cop outs, and bonus points for saying which one you'd actually want to build a resource-bounded reasoner on top of.
