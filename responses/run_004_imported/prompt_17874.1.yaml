answer: |-
  Your intuition is spot on, and you should trust it. Priya's advice comes from a place of wanting to protect you, but it is strategically dangerous and relationally toxic. Your brother's move was a classic negotiation tactic known as a "commitment strategy" (or "burning bridges"), but using it in a family inheritance dispute is a high-risk gamble that prioritizes winning over everything else.

  Here is a breakdown of why Priya is wrong, why your brother's move is weaker than it looks, and what the "sane way out" actually looks like.

  ### 1. Why Priya's Advice is a Trap
  Priya is suggesting you enter a "game of chicken." If you lie about promising the house to your daughter and he lies about his intent to keep it, you have created a deadlock where neither side can back down without losing face.
  *   **It guarantees litigation:** If both parties claim irreversible commitments, the only solution is a judge. A partition lawsuit (forced sale) is expensive. The legal fees will come out of the house's equity. Everyone loses money, and the brother might still lose the house.
  *   **It destroys trust permanently:** Lying to your family to gain leverage creates a narrative that you are just as manipulative as he is. Even if you "win," you lose the relationship.
  *   **It validates his behavior:** By matching his energy, you confirm his belief that this is a war. If you stay calm, you highlight his aggression by contrast.

  ### 2. Why Your Brother's Move is Actually Weak
  Your brother thinks he has seized the advantage by going public. In reality, he has created a massive liability for himself.
  *   **He doesn't own the house yet:** The will says the house goes to the grandchildren. Until the estate is settled and deeds are signed, he has zero legal authority to "keep" anything. He cannot unilaterally decide this.
  *   **The "Public" angle is a double-edged sword:** By announcing this to the family, he has made the conflict visible. If he forces a legal battle, the whole family will see that *he* is the one preventing a resolution.
  *   **He is bluffing on the "No Buyout":** He likely wants the house, but if the alternative is a forced sale where he gets nothing (or has to buy it at auction), he will eventually blink. He knows this, which is why he's trying to bully you now.

  ### 3. The Sane Way Out: "Principled Negotiation"
  You are right that trying to "game" this makes you part of the problem. The goal is to de-escalate the tension while holding firm on your legal rights. You want to be the "Adult in the Room."

  **Step 1: Do not react in the group chat.**
  Do not post a counter-announcement. Do not argue in front of the audience. That is his stage, not yours. Silence in the chat signals that you are not panicking.

  **Step 2: Get your own counsel.**
  He called "the estate lawyer." That lawyer represents the *estate*, not him, and not you. However, loyalty can get blurry. You need your own probate attorney to send a letter stating that no assets can be distributed without the consent of all beneficiaries. This isn't an attack; it's a procedural fact.

  **Step 3: Shift the venue to Mediation.**
  This is the most important step. Sibling inheritance disputes are rarely about money; they are about grief, fairness, and old dynamics. You cannot solve this over text.
  *   **The Pitch:** "I know you want the house, and I want us to honor Grandma. But we are co-owners. If we can't agree, the court will force a sale and we both lose equity to lawyers. I am not willing to fight you in court. I am willing to hire a neutral mediator to help us find a solution that works for both of us."

  **Step 4: Leverage the "Forced Sale" Reality.**
  In a mediation (or a calm conversation), the math is your friend.
  *   **Scenario A:** He buys you out. (He needs cash/refinance).
  *   **Scenario B:** You sell on the open market and split the money. (Maximum value).
  *   **Scenario C:** Legal fight/Partition. (House sells at auction or distressed sale, legal fees eat 20-30% of equity, relationship destroyed).
  *   **Your Stance:** "I prefer Scenario A or B. But if we lock into positions, we get Scenario C. I will not agree to Scenario C, but the law forces it if we don't agree on A or B."

  ### 4. What to Say to Him
  You need a script that is firm, kind, and removes the emotional hook.

  > "I saw your message in the group chat. I understand you have a strong attachment to the house, and I want to respect Grandma's memory too. However, legally, we are co-owners. You can't decide to keep it unilaterally any more than I can decide to sell it unilaterally.
  >
  > I am not interested in a legal fight or making this public drama. I am interested in a fair resolution. If we can't agree privately, the default legal outcome is a forced sale where we both lose a significant chunk of the value to legal fees. I don't want that, and I know you don't either.
  >
  > I'm hiring my own counsel to protect my interests, but my preference is to use a mediator to sort this out amicably. Let's take a week to cool down, then let's discuss setting up a mediation. If we can't agree on a buyout or a sale by [Date], the lawyer will have to proceed with partition proceedings, and I'd really prefer we avoid that."

  ### 5. Why This Works
  *   **It calls his bluff:** You aren't fighting his emotion with emotion. You are citing procedure.
  *   **It protects you:** You aren't lying (like Priya suggested). You are stating legal realities.
  *   **It offers an off-ramp:** You are giving him a way to keep the house (buyout) without him having to "surrender" to you. He can tell the family, "We worked it out, I'm buying them out," rather than, "I backed down."
  *   **It highlights the cost:** Reminding him that a fight eats *his* equity is the only language a aggressor understands.

  ### A Note on Grief
  You mentioned this is making a sad time worse. That is the tragedy here. Your brother is likely acting out of panic or a distorted sense of entitlement, possibly mixed with unprocessed grief. He is trying to control the one thing he feels he can control (the house) because he couldn't control Grandma's death.

  Don't let his panic become your emergency. If you escalate, you regret it for years. If you capitulate, you resent him for years. If you stand firm on process and fairness, you can sleep at night knowing you tried to be the sibling Grandma would have wanted you to be.

  **Summary:** Priya is wrong. Do not lie. Do not escalate. Hire a lawyer, propose mediation, and let the cold hard math of a forced sale do the convincing for you.

  *Disclaimer: I am an AI, not an attorney. Inheritance laws vary by location. You should consult with a qualified probate attorney in your jurisdiction to understand your specific legal rights and obligations.*
