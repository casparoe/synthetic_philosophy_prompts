  **Move 1:** Devon captures the etiological account's superior handling of normative malfunction, but his claim is uncharitable to Cummins, who allows for malfunction relative to a specific analytical capacity even if it lacks historical normativity.

  **Move 2:** Nora's novel-mutation case is a standard and potent objection that highlights the problematic temporal lag inherent in strict etiological accounts regarding new traits.

  **Move 3:** Devon maintains theoretical consistency, but since his plank analogy lacks heritability, Nora's intuition that the trait has immediate function survives his reply.

  **Move 4:** Nora's pluralist diagnosis is pragmatic, but it is vulnerable because it assumes biologists do not treat historical status as constitutive of function attributions.

  **Move 5:** Devon correctly shows that distinguishing adaptations from byproducts changes function attribution, proving the dispute is substantive rather than a case of talking past one another.

  **Closing Assessment:**
  Both students miss the possibility that "function" is polysemous, referring to distinct but compatible concepts (proper function vs. system capacity) rather than competing definitions of a single thing. Furthermore, they overlook contemporary hybrid approaches, such as the Organizational Account, which attempt to ground normativity in the current self-maintaining structure of the organism without requiring a reconstructible selection history.
