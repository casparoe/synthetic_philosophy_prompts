      *   *Section 1: Why Hume thought they were equivalent.* Explain the "Copy Principle." No impression of power -> power is just the feeling of expectation. Therefore, Object-Relation = Mind-Relation.
      *   *Section 2: Why they pull apart (The Fork).*
