          *   *Synthesis:* It's not a contradiction but a shift in *method*. In the *Republic*, guardians are already selected/perfected. In the *Laws*, it's about a real city with imperfect humans. Wine acts as a diagnostic tool.
      *   **The "Training" Aspect:** It's not that the drunken state *is* virtuous. It's that resisting the *urge* to be shameless while drunk (or observing one's failure) builds the habit. Actually, the text suggests it's more about *testing* character than *building* it from scratch, though habituation is involved. It lowers inhibitions to reveal the true self.

