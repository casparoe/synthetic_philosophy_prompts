prompt: |-
  Quick philosophical detour from my grading pile: I've got a final paper that's sitting right on the border between a B+ and an A-, and instead of just picking one i'm spiraling into the metaphysics of grading itself. Epistemicists like Williamson say there's a genuine sharp fact about which grade is correct, I just can't know it, since vague terms don't satisfy the margin-for-error conditions on knowledge. Supervaluationists say there's no sharp fact at all, just supertruth relative to whichever admissible way you fix the cutoffs, and borderline verdicts are neither true nor false. Can you lay out the most important implications of taking one view over the other for how I should actually handle cases like this, including what (if anything) I owe a student who comes to appeal thier grade? Don't give me the general SEP-level primer on vagueness, just the part that actually bites on a practical call like this one.
