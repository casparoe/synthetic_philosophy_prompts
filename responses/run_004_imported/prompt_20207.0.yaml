answer: |-
  This is the perfect use case for metaphysics: saving your sanity during finals week. Since you know the terrain, let's skip the definitions and go straight to the normative pressure each view puts on you as the grader.

  ### 1. The Epistemicist Approach (Williamson)
  **The Metaphysical Commitment:** There is a fact of the matter. This paper *is* an A- (or a B+), regardless of your rubric. Your uncertainty is purely ignorance.

  **The Practical Bite:**
  *   **Decision Procedure:** You should stop trying to "find" the boundary. Williamson argues the boundary is unknowable precisely because it shifts with usage. If you agonize over the borderline case, you are wasting time trying to access a fact that is metaphysically present but epistemically inaccessible.
  *   **Action:** Pick the grade that aligns with the *preponderance* of evidence, acknowledge you might be wrong (because you are fallible), and move on. The "right" grade exists, but you aren't God; you are a noisy measuring instrument.
  *   **The Appeal:** If a student appeals, they are claiming **objective error**. They are saying, "You failed to detect the fact."
  *   **What You Owe Them:** You owe them a re-evaluation of the *evidence*. If they show you a specific element of the paper you missed (a hidden premise, a citation you overlooked), you must change the grade because you were epistemically deficient. However, if they just argue "I feel like this is an A-," you can reject it. The fact doesn't change based on their feelings.
  *   **The Risk:** This view sets you up for impostor syndrome. It implies there is a "True Grade" you failed to access. It makes grading a truth-tracking exercise rather than a evaluative one.

  ### 2. The Supervaluationist Approach
  **The Metaphysical Commitment:** There is no fact of the matter until a precisification is selected. "A- work" is vague. It becomes true/false only relative to a specific cutoff scheme (an admissible precisification).

  **The Practical Bite:**
  *   **Decision Procedure:** You are not discovering the grade; you are **legislating** it. Your job is to select an admissible precisification (a cutoff) and apply it consistently. The "truth" of the grade is created by your decision, constrained by the rubric.
  *   **Action:** Stop looking at the single paper in isolation. Look at the *stack*. Where does this paper sit relative to the cluster of clear B+s and clear A-s? Your job is to draw a line that makes the set of grades coherent. If you give this paper an A-, you must ensure every paper relevantly similar also gets an A-.
  *   **The Appeal:** If a student appeals, they are claiming **arbitrariness or inconsistency**. They are saying, "Your precisification is inadmissible" or "You applied different cutoffs to similar papers."
  *   **What You Owe Them:** You owe them **consistency and notice**. You do not owe them "accuracy" in the epistemic sense, because there was no pre-existing accuracy to be had. You owe them a demonstration that your cutoff falls within the range of "admissible" interpretations of the rubric and that you applied it uniformly. If they show you a paper from a peer that was worse but got a higher grade, they win—not because you missed a fact, but because you violated the supervaluationist constraint of admissibility/consistency.
  *   **The Risk:** This increases your administrative burden. You have to defend the *system* of grading, not just the *content* of the paper.

  ### The Verdict for Your Pile

  **Adopt Supervaluationism for Policy, Epistemicism for Communication.**

  1.  **For Your Sanity (Supervaluationism):** Accept that there is no "True Grade" haunting this paper. The grade is a function of your rubric + your judgment. This liberates you from the anxiety of "getting it wrong." You aren't missing a fact; you are finalizing a definition. Make a call based on consistency with the rest of the stack and lock it in.
  2.  **For The Student (Epistemicism):** When you return the paper, treat the grade as factual. "This is an A-." If you communicate "This is vague and I just picked one," you undermine the credential value of the grade.
  3.  **For The Appeal:**
      *   If they argue **content** ("You didn't count this paragraph"), treat it Epistemically. Did you miss evidence? If so, correct it.
      *   If they argue **borderline status** ("I know it's close, but I need an A-"), treat it Supervaluationally. Explain that the cutoff was drawn based on the distribution of the class and the rubric standards, and that moving them would require moving others (consistency).

  **Immediate Advice:**
  Look at the paper again. Is it *better* than the papers you firmly gave B+s? If yes, give the A-. You are exercising your prerogative to precisify the concept "A-" to include this case. Once you click "submit," the supertruth becomes truth. Stop spiraling; the metaphysics won't change the GPA, but finishing the pile will.
