      *   **Task:** Explain the *practical implications* of adopting Epistemicism vs. Supervaluationism for *this specific grading decision* and *grade appeals*.
      *   **Constraint:** Do *not* give a general SEP-level primer on vagueness. Focus on what "bites" on the practical call.
      *   **Tone:** Philosophical but pragmatic, acknowledging the stress of grading ("spiraling," "grading pile").

