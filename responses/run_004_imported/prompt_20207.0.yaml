      *   **Epistemicism (Williamson):**
          *   *Metaphysics:* There *is* a fact of the matter. The paper *is* either an A- or a B+. The boundary is sharp but unknowable.
          *   *Ethics/Practice:* My uncertainty is ignorance, not indeterminacy. I am trying to discover a pre-existing truth.
          *   *Appeal:* If the student appeals, they are claiming I got the *fact* wrong.

      *   **Supervaluationism:**
          *   *Metaphysics:* There is *no* fact of the matter until a precisification is chosen. The paper is neither truly A- nor truly B+ relative to the vague concept "A- work." It becomes true/false only relative to a specific cutoff policy.
          *   *Ethics/Practice:* My decision *creates* the fact (within limits). I am exercising discretion, not discovering truth.
          *   *Appeal:* If the student appeals, they are challenging the *precisification* (the cutoff rule), not a pre-existing fact.

  3.  **Brainstorm Practical Implications (The "Bite"):**

      *   *Decision Making:*
          *   Epistemicism: Agonize more? Or realize agonizing is futile because you can't know? Actually, Williamson says you can't know, so you should just pick based on best evidence and accept error.
          *   Supervaluationism: Acknowledge discretion. You are setting the cutoff. Consistency matters more than "accuracy."

      *   *Grade Appeals:*
          *   Epistemicism: The student can claim objective error. "You missed the fact." You have to defend your epistemic access.
          *   Supervaluationism: The student can claim arbitrariness or inconsistency. "Your precisification is unfair." You defend the policy/rubric, not the "truth."

      *   *Psychological Burden:*
          *   Epistemicism: High anxiety (there's a right answer I'm missing).
          *   Supervaluationism: High responsibility (I am making the law here).

      *   *Institutional Reality:*
