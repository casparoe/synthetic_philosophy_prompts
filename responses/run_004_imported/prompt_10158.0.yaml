      *   *SPR (Society for Psychical Research):* Founded 1882. Sidgwick was a founding member and first president. Aimed to investigate mesmerism, spiritualism, telepathy scientifically.
      *   *The "Standard View":* Sidgwick joined SPR to find evidence of afterlife/moral order to solve the Dualism.
      *   *The "User's Critique":* Empirical proof of survival $\neq$ Moral necessity. It just makes egoism and utilitarianism happen to align *de facto*, not *de jure*.
      *   *Creery Sisters:* Five sisters tested for thought-transference. Initially successful, later accused of signaling (cheating). Damaged SPR credibility.
      *   *Census of Hallucinations:* Large-scale survey to see how common hallucinations were (to argue against pathology/insanity).
      *   *Trinity Fellowship:* Sidgwick resigned because he couldn't sign the 39 Articles (Anglican doctrine). Shows his commitment to intellectual honesty.

