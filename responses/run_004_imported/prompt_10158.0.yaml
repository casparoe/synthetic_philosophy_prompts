answer: |-
  Here is a draft of 10 interview questions designed to move past the biographical trivia and dig into the philosophical and methodological tensions you're interested in. I've ordered them to build a narrative arc: starting with Sidgwick's intellectual character, moving through the motivation and philosophy of the SPR, examining the specific methods and failures, and ending on the implications for his legacy.

  The "Host Reaction/Follow-up" notes are written to sound like live conversational pivots, depending on how the guest leans.

  ### 1. The Integrity Parallel
  **Question:** I want to start with the Trinity fellowship resignation. Sidgwick gives up his position because he can't honestly subscribe to the Articles of Faith, yet years later he pours immense energy into the SPR, which many contemporaries viewed as pseudoscience. How do we reconcile that fierce commitment to intellectual honesty in religion with his willingness to entertain claims that seemed, to people like Darwin or Huxley, scientifically disreputable?

  *   **Host Reaction/Follow-up:** *If they say it's consistent integrity:* "So you're saying for Sidgwick, 'evidence' meant something broader than the materialist consensus of his day? But doesn't that risk making 'honesty' a matter of what you *want* to be true?"
  *   **Host Reaction/Follow-up:** *If they say it's a contradiction:* "Is it fair to call it a blind spot, or is it more that he felt the scientific establishment was being just as dogmatic as the Church?"

  ### 2. The Standard Motivation Story
  **Question:** The standard biographical line is that Sidgwick joined the SPR to solve the 'Dualism of Practical Reason'—he needed proof of an afterlife to ensure duty and self-interest align. Your book complicates this. Was the SPR project actually driven by that specific philosophical problem, or was it more of a general desire to expand the boundaries of empirical inquiry?

  *   **Host Reaction/Follow-up:** *If they stick to the Dualism explanation:* "Okay, but if that's the engine, doesn't it make the SPR work instrumental? Like he's using science to bail out his ethics?"
  *   **Host Reaction/Follow-up:** *If they emphasize general inquiry:* "Then why psychical research specifically? Why not just more ethics or politics? There has to be a hunger for something the *Methods* couldn't provide."

  ### 3. The Empirical vs. Rational Gap
  **Question:** This is a worry I sit with constantly: even if the SPR *had* found airtight evidence for survival after death, that only shows egoism and utilitarianism coincide in *this* universe. It doesn't reconcile them as a matter of rational principle. It just makes morality a good investment strategy. Did Sidgwick ever acknowledge that empirical proof wouldn't actually solve the philosophical dualism he was worried about?

  *   **Host Reaction/Follow-up:** *If they say he didn't see the gap:* "That's startling for a logician of his caliber. Do we have to conclude he was emotionally invested enough to miss a category error?"
  *   **Host Reaction/Follow-up:** *If they say he did see it:* "Then what was the point? If he knew evidence wasn't a rational reconciliation, was he just looking for psychological comfort rather than a philosophical solution?"

  ### 4. Symptom or Solution?
  **Question:** Following on that: is it possible the psychical research project isn't an attempt to *resolve* the Dualism of Practical Reason, but rather a *symptom* of it? Like, the tension in his ethics was so unbearable that he had to posit a hidden reality where the tension disappears?

  *   **Host Reaction/Follow-up:** *If they agree:* "Does reading it as a symptom undermine the authority of the *Methods of Ethics*? Or does it humanize the system?"
  *   **Host Reaction/Follow-up:** *If they disagree:* "What protects the SPR work from being read as wish-fulfillment? What makes it a philosophical project rather than a coping mechanism?"

  ### 5. The Census of Hallucinations (Goal)
  **Question:** Let's talk methodology. The Census of Hallucinations was massive for its time. But what was it actually supposed to establish? Was it trying to prove telepathy exists, or just prove that seeing things isn't always a sign of insanity?

  *   **Host Reaction/Follow-up:** *If they say it was about insanity:* "So it was defensive? Clearing the ground so spiritualist claims wouldn't be immediately dismissed as pathology?"
  *   **Host Reaction/Follow-up:** *If they say it was about telepathy:* "But a census just counts occurrences. How does frequency translate to mechanism? Doesn't that leave the 'how' completely open?"

  ### 6. The Census (Feasibility)
  **Question:** And could a survey like that even in principle do the job he wanted? If I report a hallucination, I'm giving you subjective data about a subjective experience. Can you really build an objective case for psychical phenomena on the back of self-reporting?

  *   **Host Reaction/Follow-up:** *If they defend the Census:* "Is that a strength or a weakness? It democratizes the data, but doesn't it also democratize the error?"
  *   **Host Reaction/Follow-up:** *If they critique the Census:* "Did Sidgwick know that? Was he aware he was using a blunt instrument for a delicate philosophical problem?"

  ### 7. The Creery Sisters Investigation
  **Question:** I want to zoom in on the Creery sisters. The SPR initially touted them as strong evidence for thought-transference, but later there were accusations of signaling—cheating. How did Sidgwick handle that specific investigation when the cracks started showing?

  *   **Host Reaction/Follow-up:** *If they say he was rigorous:* "Did he publish the doubts as loudly as he published the successes? Or was the initial enthusiasm hard to walk back?"
  *   **Host Reaction/Follow-up:** *If they say he was defensive:* "Does that suggest he needed them to be real? That the philosophical stakes were making him a less critical investigator?"

  ### 8. Credibility and Aftermath
  **Question:** What did the Creery signaling business do to his credibility as an investigator? Did his peers in philosophy or science treat him differently after that, or was the damage contained within the SPR?

  *   **Host Reaction/Follow-up:** *If they say it damaged him:* "And yet he remained President of the SPR. Does that tell us he valued the inquiry more than his personal reputation?"
  *   **Host Reaction/Follow-up:** *If they say it didn't matter:* "Is that because nobody took psychical research seriously anyway? Or because his philosophical standing was bulletproof?"

  ### 9. The "Footnote" Problem
  **Question:** You've written a whole book on this, which argues against the idea that this is just a funny footnote. But why should we care today? If we strip away the Victorian interest in spiritualism, is there anything in Sidgwick's SPR work that actually contributes to modern ethics or epistemology?

  *   **Host Reaction/Follow-up:** *If they say yes (Epistemology):* "So it's about how we handle fringe claims? That feels very relevant now with misinformation."
  *   **Host Reaction/Follow-up:** *If they say yes (Ethics):* "So the lesson is that ethics can't stand alone without a metaphysics? That's a pretty dark conclusion for a utilitarian."

  ### 10. Final Verdict
  **Question:** Last one. If we look at the totality of it—the resignation from Trinity, the *Methods*, the SPR, the Creery scandal—do we see a unified thinker trying to expand the scope of reason, or do we see a fractured man trying to hold two incompatible worldviews together?

  *   **Host Reaction/Follow-up:** *If they say Unified:* "That's a generous reading. I'll have to sit with that."
  *   **Host Reaction/Follow-up:** *If they say Fractured:* "Maybe that fracture is exactly what makes him the most modern of the Victorians. Thank you so much for coming on."
