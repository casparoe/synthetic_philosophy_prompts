      *   **Opening Salvo:** Elena (AAI) starts with the moral intuition. If you get hurt, you should have a say. Marcus (ASC) counters with the definition of political community.
      *   **Round 1: The Core Argument:**
          *   Elena: It's about basic rights and interests. Pollution harms health.
