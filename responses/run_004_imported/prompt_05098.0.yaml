answer: |-
  **London, 1668. A private room at Gresham College.**

  **HOBBES:** You treat numbers as if they were stones, John. Pile enough of them up and you think they make a truth. But tell me: what *is* this 'indivisible' of yours? Is it matter? If it has magnitude, it is divisible. If it has none, it is nothing. You build your cathedrals out of ghosts.

  **WALLIS:** And you, Mr. Hobbes, would have us refuse to enter the cathedral until we have weighed every brick in the hand of God. I do not claim to know the ontological weight of an infinitesimal. I claim only that when I sum them, the area of the parabola is correct. The proof is in the measure, not the metaphysics.

  **HOBBES:** *(Striking the table)* The measure is accident! The cause is substance! To know a line is to know how it is begotten. A point moves; there is your line. A line moves; there is your plane. If you cannot describe the motion that generates the magnitude, you do not know geometry. You know only a cipher's riddle. You calculate like a merchant, not a philosopher.

  **WALLIS:** I calculate like a man who wishes to navigate the seas. You insist that the sailor must understand the essence of water before he may trust the compass. I say: if the compass points North, and the ship arrives, the method is sound. Your 'motion' is a crutch you lean on because you fear the abstract. When I write $\frac{1}{\infty}$, I do not need to see it move. I need only to see that the series converges.

  **HOBBES:** Converges to what? A limit you cannot name? You invite the infinite into your study and pretend it is a tame dog. It is a wolf! It will eat your logic. You say you can square the circle by these series? I say you have merely approximated it and dressed the error in new algebraic clothes. I have shown you, forty times, where your reasoning breaks.

  **WALLIS:** And forty times the Royal Society has shown you where *yours* assumes a conclusion it has not proved. You accuse me of mysticism, Thomas, but look at your own 'motion.' Is this motion physical? Is it imaginary? If it is physical, why does it obey perfect laws no physical body ever follows? If it is imaginary, then you are the one trafficking in ghosts. You demand matter, but you reason with shadows.

  **HOBBES:** I demand consistency! Science is the knowledge of consequences. There is no consequence without cause. Your method gives you the *that*, but never the *why*. You are a gatherer of facts, a butterfly pinning man. I am building a system that explains man, the state, and the universe from the ground up. You cannot build a universe on 'as if.'

  **WALLIS:** And I am telling you the universe does not care if your system is pretty. It cares if the prediction holds. The new philosophy is not about constructing the world from first principles in a dark room. It is about observation, experiment, and calculation. You are fighting the last war. You want to deduce the world like a syllogism. We are learning to read it like a text.

  **HOBBES:** A text written by whom? If you do not know the pen, how can you trust the word? You separate the math from the world. That is the road back to the Scholastics. To separate quantity from body is to make quantity a spirit. I will not have it.

  **WALLIS:** Then you will have to stand alone, sir. For the math moves on. It does not wait for permission to be material. I do not need to know what an infinite series *is* to know what it *does*.

  **HOBBES:** And I tell you, a truth without a cause is no truth at all. It is a lucky guess. And luck is not science.

  **WALLIS:** *(Gathering his papers)* We shall see which method serves the King's navy better.

  **HOBBES:** *(Turning to the window)* We shall see which method survives when the luck runs out.

  *(Wallis bows, stiffly, and exits. Hobbes remains, tracing a line on the dusty sill with a trembling finger, watching the path of the light.)*
