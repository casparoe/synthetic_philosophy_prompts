  6.  **Drafting - Attempt 2 (Focusing on Voice):**
      *   Hobbes should sound like a man who believes he has seen the machinery of God and found it simple.
      *   Wallis should sound like a man who has a new telescope and doesn't care how the lens is ground, as long as he can see the moon.

  7.  **Writing the Scene (incorporating sensory details):**
      *   Setting: Gresham College or similar. Ink, paper, candlelight.
      *   Action: Gesturing, tapping papers.

      *(Self-Correction during drafting)*: Make sure Hobbes doesn't sound *too* crazy. His point about motion is actually a precursor to constructivism. Make sure Wallis doesn't sound like a modern mathematician; he still believes he's doing geometry, just a new kind.

      *Focus on the "Talking Past Each Other":* Hobbes asks "What is it?" Wallis answers "What does it do?"

  8.  **Final Polish:** Check the rhythm. Ensure the historical context (Restoration) bleeds through (references to the King, the new science, the Civil War shadows perhaps, though maybe keep it strictly to math to save space). Let's stick to the math/philosophy to keep it tight.

