answer: |-
  This is a fantastic question. You have stumbled onto a genuine intersection of computer science, ethics, and cognitive science that is currently very active, though it doesn't have a single "settled" name like the Trolley Problem does.

  You are asking about the **computational limits of moral agency**.

  Here is how philosophy (and specifically ethical theory) carves up the problem you've described, along with the specific terminology you can use to dig deeper.

  ### 1. Epistemic Limits vs. Computational Limits
  You asked if "the math is too slow" is treated differently from "you can't know the consequences."

  **Historically:** They were often lumped together under **Epistemic Limitations**. Traditional utilitarianism (like Bentham or Mill) didn't distinguish between "I don't have the data" and "I have the data but can't process it." Both were just reasons why a human couldn't achieve "Ideal Utilitarianism."

  **Modern View:** In the last 40–50 years, this distinction has become crucial, largely due to economics and AI.
  *   **Epistemic Uncertainty:** I don't know if the bridge is out.
  *   **Computational Intractability:** I know where everyone is and exactly how long rescue takes, but I cannot solve the optimization problem in the 5 minutes I have before the flood rises.

  This distinction is the core of **Bounded Rationality**, a concept introduced by Herbert Simon (a polymath who won both the Turing Award and the Nobel Prize in Economics). Simon argued that humans (and systems) are *intendedly* rational but *limitedly* so. Because we cannot maximize utility due to computational costs (time/energy), we **"satisfice"** (a portmanteau of satisfy and suffice). We look for a solution that is "good enough" rather than optimal.

  In your disaster scenario, a modern consequentialist would argue that the moral obligation is not to find the *global maximum* (which is computationally forbidden), but to find the *local maximum feasible within the time bound*.

  ### 2. "Ought Implies Can" and Computation
  You are correct that "Ought Implies Can" is Kantian (from *Critique of Practical Reason*), but it is widely used across ethics.

  Does "Can" include "Can compute"? **Yes.**
  Most contemporary ethicists agree that moral obligations cannot exceed the cognitive or computational capacities of the agent. If the optimal solution requires $O(2^n)$ time and you have linear time, you *cannot* do it. Therefore, you are not morally obligated to do it.

  However, this leads to a sub-debate known as **Objective vs. Subjective Obligations**:
  *   **Objective Obligation:** What you *should* do given the actual state of the world (The God's-eye view optimal Knapsack solution).
  *   **Subjective Obligation:** What you should do given your evidence and processing limits (The best heuristic you can run in 5 minutes).

  If "Ought Implies Can" holds, then your **Subjective Obligation** is your actual moral duty. You are not blameworthy for failing to solve an NP-hard problem in polynomial time. You *are* blameworthy if you fail to use a decent approximation algorithm (like a greedy heuristic) that runs fast.

  ### 3. Is there a specific name for this debate?
  There isn't one single phrase, but if you want to read more, these are the search terms that will lead you to this exact rabbit hole:

  **A. Tractable Utilitarianism**
  Some philosophers argue that for Utilitarianism to be a practical guide, the "calculation of utility" must be computationally tractable (solvable in P-time). If the theory demands NP-hard calculations, the theory itself is flawed because it violates "Ought Implies Can." This is sometimes called the **Computational Objection to Utilitarianism**.

  **B. Algorithmic Ethics / Machine Ethics**
  Since you are a coder, this might interest you most. As we build autonomous systems (drones, medical triage AI), we are forcing computers to make these Knapsack decisions. The field of **Machine Ethics** deals explicitly with how to encode moral heuristics when optimal calculation is impossible. They often use **Approximation Algorithms** as moral proxies.

  **C. Triage Protocols (Non-Ideal Theory)**
  In medical ethics, this is solved by **Triage**. Triage is essentially a pre-computed heuristic for the Knapsack problem. Instead of calculating the optimal set of survivors for *this specific* disaster (which is NP-hard), we apply a general rule (e.g., "save those who can survive with minimal intervention first").
  Philosophically, this falls under **Non-Ideal Theory**. Ideal theory asks "What is justice/perfection?" Non-ideal theory asks "What do we do given constraints, corruption, and limited computation?"

  ### 4. A Small CS Nuance (Just for accuracy)
  You mentioned 30 people. Just so you know for your arguments with friends: $N=30$ is actually solvable by modern computers very quickly (via Branch and Bound or Meet-in-the-middle), even for Knapsack. $2^{30}$ is roughly 1 billion operations; a modern CPU can brute-force that in seconds.

  However, your philosophical point holds if:
  1.  **$N$ is larger:** (e.g., 100+ people).
  2.  **The constraints are tighter:** (e.g., you have 2 seconds, not 2 hours).
  3.  **The problem is harder:** Real disaster relief is often a **Vehicle Routing Problem with Time Windows (VRPTW)** or a **Dynamic Knapsack Problem**, which are often harder than standard 0/1 Knapsack.

  So, while $N=30$ is technically tractable today, the *class* of problem is intractable as it scales, and the *time window* in a disaster creates a hard cutoff that makes even tractable problems impossible if the constant factor is too high. Your intuition is correct.

  ### Summary of the Philosophical Consensus
  1.  **Distinct Problem:** Yes, computational limits are increasingly treated as distinct from simple lack of information (Bounded Rationality).
  2.  **Ought Implies Can:** Yes, this applies to computational capacity. You cannot be obligated to solve an NP-hard problem in P-time.
  3.  **The Solution:** The moral duty shifts from **Maximizing** (finding the true optimum) to **Satisficing** (finding a solution that is robustly good enough using a fast heuristic).

  If you want to blow your friends' minds, tell them you're arguing about **the computational complexity of moral obligation under non-ideal theory.** That should keep the argument going for another two weeks.
