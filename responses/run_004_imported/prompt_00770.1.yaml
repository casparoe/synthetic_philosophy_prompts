      *Revised Plan:*
      1. Confirm: No further physical facts exist.
      2. Explain: This is a dispute about *levels of abstraction*.
      3. Philosophical context: Identity conditions for artifacts vs. natural kinds.
      4. Pragmatic resolution: Align the language with the audience and goal.
