  9.  **Self-Correction during drafting:** I initially thought about suggesting they just compromise. But the user wants a *principled* way to work out who is right. I need to explain that "who is right" is the wrong question. The principled approach is to determine the *purpose of the discourse*. I should emphasize that in software, identity is usually defined by the API/Contract, not the implementation. This gives the Lead more weight technically, but validates the User's feeling about the code.

