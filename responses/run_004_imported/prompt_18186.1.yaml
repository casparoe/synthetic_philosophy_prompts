          *   *Verdict:* Marcus is logically incorrect here. He is conflating "actual cause" with "sufficient cause."

      *   *Move 3: Nina's Rebuttal.*
          *   Claim: Memory graphs show $M$ didn't tip over. $C$ ate the headroom. $M$ alone = fine.
          *   Claim: She signed off on "A not B", not "A alone".
          *   *Analysis:* This aligns with the technical evidence (memory graphs). It aligns with the logical structure of the document (elimination).
          *   *Verdict:* Nina is technically and logically stronger here.

      *   *Move 4: Marcus's Counter (Reneging/Scapegoat).*
