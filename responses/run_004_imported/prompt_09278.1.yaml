prompt: |-
  Random question but it's been bugging me while I outline a book with a character loosly based on George Eliot. She ditched Christianity in her twenties, translated Strauss and then Feuerbach, and basically shacked up with the guy (Lewes) who was the big popularizer of Comte in England -- but from what I've read she actually kept her distance from the organized "Religion of Humanity" that English positivists like Frederic Harrison were trying to build, the church-without-a-god thing with its own calendar and rites. So: if she got dropped into today's world and someone explained the effective altruism movement to her -- earn-to-give, quantify the good you do, take the sentiment out of the equation -- would she recognize it as her own humanism finally being done properly, or would she have the same allergic reaction she had to Comte's crowd, and for basically the same reasons? Actually commit to an answer and walk me through why, using how her ethics actually worked in the novels, not just the biography.
