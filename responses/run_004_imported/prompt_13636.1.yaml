      *   *Section 4 (Standard Responses):* Confirm this is known territory. Cite similar arguments (David Lewis, etc.). This helps normalize their thinking—they aren't crazy, they're doing philosophy.
      *   *Conclusion/Caveat:* Gently address the medical reality. QI is a metaphysical speculation, not a medical diagnosis. The survival was likely biological luck, not quantum branching. This is crucial to prevent further obsession.

  5.  **Refining the Tone:**
      *   Avoid: "Don't worry," "You're safe," "That's crazy."
