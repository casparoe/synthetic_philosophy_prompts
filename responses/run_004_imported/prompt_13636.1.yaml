      *   Connecting SCA to QI is a trauma response. The brain is trying to narrative-shape a random, terrifying event.
      *   *Constraint:* The user asked for reasoning checks, not therapy. However, ignoring the context would be irresponsible. I need to validate the reasoning *while* gently contextualizing the medical event without dismissing their intellectual effort. I must not validate QI as the *actual* explanation for their survival, but treat it as the philosophical object of study.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the gravity of the situation. Validate the intellectual rigor. State clearly: "Your reasoning is sound, here is the breakdown."
      *   *Section 1 (Physics):* Confirm they have the gist right. Clarify that QI is a *consequence* some draw from MWI, not a proven fact. Mention the Born Rule controversy (Deutsch-Wallace is decision-theoretic, not ontological proof).
