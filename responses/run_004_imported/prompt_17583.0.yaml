      *(Final thought on the "Losing Side"):* If the recommendation is to allow it (with rules), the Working Statisticians are the ones who wanted to keep the ban. I must explicitly state: "The concern that a Bayes Factor invites a more polite form of p-hacking is not baseless." That validates them. Then explain why the new rules mitigate it.

