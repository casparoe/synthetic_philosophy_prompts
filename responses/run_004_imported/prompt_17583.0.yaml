answer: |-
  **MEMORANDUM**

  **TO:** Methodological Standards Committee, Full Board
  **FROM:** [Your Name], Subcommittee on Preclinical Standards
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Optional Stopping and Bayesian Reporting

  **1. Recommendation**

  The Subcommittee recommends that the Board **adopt the proposed exception** allowing optional stopping during data collection, contingent upon the reporting of Bayes Factors (BF), **but only under a qualified framework of preregistration.**

  Specifically, grantees wishing to utilize this exception must preregister not only their statistical model and priors but also the **specific stopping rule** (e.g., "Stop when BF₁₀ > 10 or N reaches 50") before data collection begins. Unregistered optional stopping remains prohibited.

  **2. Context and Conflict**

  As you know, our current policy mandates fixed sample sizes and prohibits data examination to safeguard against the inflation of false positives—a standard response to the reproducibility crisis. The subcommittee's proposal seeks to relax this for researchers reporting Bayes Factors, arguing that the Likelihood Principle renders stopping rules irrelevant to the strength of evidence.

  This has generated a substantive disagreement within the committee.
  *   **The Theoretical Argument:** Proponents argue that because the Bayes Factor conditions only on the observed data and the model, the intention of the researcher (to stop or continue) is irrelevant to the evidential meaning of the result. To penalize stopping is to misunderstand the nature of Bayesian evidence.
  *   **The Pragmatic Argument:** Opponents argue that allowing researchers to monitor data invites "sampling to a foregone conclusion." They contend that a motivated researcher can wait for noise to align with signal, and that relabeling this process as "Bayesian monitoring" merely dignifies data-dredging.

  **3. Analysis of the Disagreement**

  In drafting this recommendation, the Subcommittee has attempted to avoid a superficial compromise. We believe the tension here is not merely technical but philosophical, reflecting the enduring divide between error statistics (Neyman-Pearson/Fisher) and evidential statistics (Bayes/Likelihood). To move forward, we must acknowledge where each side is correct and where each side's framework is insufficient for our specific purpose as a funding body.

  **To the proponents of the exception:** You are theoretically correct regarding the *interpretation* of the data. As Royall and others have established, if we view the Bayes Factor purely as a measure of how the data shift belief from prior to posterior, the stopping rule is indeed irrelevant. The likelihood function is what it is, regardless of when collection ceased. To claim otherwise is to confuse the evidence with the decision procedure.

  **However, to the working statisticians who oppose the exception:** Your concerns are not dismissed by the Likelihood Principle, because our mandate extends beyond the interpretation of a single dataset to the **warranting of decisions across a portfolio of grants.**

  While the *evidence* in a specific experiment may be independent of the stopping rule, the **frequency of misleading evidence** is not. If a researcher is permitted to monitor data without a predefined boundary, they effectively grant themselves infinite opportunities to wait for a fluctuation that favors their hypothesis. Even within a Bayesian framework, if the prior is not rigorously fixed, or if the stopping boundary is implicit ("I'll stop when it looks good"), the long-run rate of false claims can become unacceptably high.

  The statisticians' fear is that "optional stopping" will become "optional reporting." A researcher might monitor the BF, find it unfavorable at N=50, decide to "check the reagent inventory," and resume until N=80 yields a favorable BF. If the stopping rule itself is not fixed, the Bayes Factor loses its calibration. The Likelihood Principle protects the coherence of belief, but it does not protect us from the researcher's ability to manipulate the *process* of belief formation.

  **4. The Qualified Framework**

  We can satisfy the theoretical integrity of the Bayesian approach while respecting the pragmatic safeguards of the frequentist critique by shifting the constraint from the *sample size* to the *stopping rule*.

  We recommend adopting the exception subject to the following three conditions:

  1.  **Preregistration of the Stopping Rule:** Researchers must declare the specific algorithm for stopping (e.g., "Sequential analysis stopping at BF > 10 or BF < 0.1, max N = 100"). This prevents the "patience" loophole. It acknowledges that while the *evidence* doesn't depend on the rule, the *validity of the claim* depends on the researcher committing to the rule in advance.
  2.  **Preregistration of Priors:** To prevent "prior hacking" (tuning the prior to make the BF easier to achieve), the prior distribution must be justified and registered before data collection.
  3.  **Transparency of Trajectory:** Grantees must report the trajectory of the Bayes Factor over time (e.g., a plot of BF vs. N) in the final report. This allows reviewers to see if the data hovered near the threshold for an extended period, which would indicate the "patience" problem the statisticians identified.

  **5. Conclusion**

  This recommendation accepts the subcommittee's premise that Bayes Factors are a valid metric for evidence that permits flexible design. However, it accepts the working statisticians' premise that flexibility without accountability is a recipe for bias.

  By preregistering the stopping rule, we acknowledge the Likelihood Principle's insight—that the rule doesn't change the data's meaning—while simultaneously upholding the Error Statistician's requirement that the *procedure* must be severe enough to detect error. We allow the researcher the ethical and economic flexibility to stop early, but we remove their ability to decide *retrospectively* that the evidence was sufficient.

  We believe this qualified adoption modernizes our standards without sacrificing the rigor required to restore trust in preclinical research.

  **Recommendation:** Vote to adopt the exception contingent on the preregistration of stopping rules and priors.
