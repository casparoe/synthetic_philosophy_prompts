      If I say "Hal, you're right about uncertainty, but we have to do something," that's waving it off.
      If I say "Hal, your objection highlights that all philanthropy relies on moral axioms. Our charter's axiom is 'evidence-backed.' AMF fits that axiom best. Scholarships fit it less. Your objection applies to both, so it doesn't differentiate them, but it does challenge the charter itself. Since we can't rewrite the charter today, we follow the current text." -> This is stronger.

      *Okay, let's finalize the recommendation.* I'll recommend 100% AMF. It's the most defensible position based on the text provided.

