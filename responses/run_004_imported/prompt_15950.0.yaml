prompt: |-
  I host a science-and-ideas podcast, and next week's guest is a philosopher who defends the hardcore Epicurean line that death genuinely isn't bad for the person who dies, not even a little. I dont want the episode to just be her restating "where death is, I am not" and moving on. Draft me 8-9 interview questions that push on the real pressure points -- at least one on the deprivation-account comeback (death can harm you without you ever being around to feel it, Nagel's point), one on the timing puzzle of exactly when death's badness is supposed to occur, if it occurs at all, and one on Lucretius' symmetry argument about pre-natal vs posthumous nonexistence, pushing on whether that symmetry really holds up. Give each a follow-up keyed to whatever shes likely to say, and close with one question on whether Bernard Williams' tedium-of-immortality point quietly helps her case or actually undercuts it.
