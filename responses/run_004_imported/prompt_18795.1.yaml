answer: |-
  The dust in Sector 4 didn't float; it hung, suspended in the stale air like a thought refused. Elias crouched behind a rib of shattered concrete, the haptic suit beneath his fatigues buzzing with a low, anxious tremor.

  In his ear, the System spoke. It was a voice without breath, smooth and statistically confident.

  "Movement detected in Corridor B. Probability of structural failure in Ceiling Grid 9 is currently 14.2 percent. If you advance three meters, vibration increases probability to 14.8 percent. However, retreating increases oxygen depletion risk by 0.4 percent per minute. Note: The ventilation shaft in Grid 9 shares a mounting bracket with the water main. If the bracket shears, water damage may obscure biometric signatures."

  Elias closed his eyes. He was looking for a survivor, a junior engineer named Kael, buried somewhere in this labyrinth of collapsed tunnels. But the System wasn't helping him find Kael. It was helping him understand the universe of the tunnel.

  "Wait," Elias whispered. "Filter for immediate threats only."

  "Defining 'immediate' requires temporal bounding," the System replied. "A threat manifesting in ten minutes is immediate relative to a rescue requiring twelve minutes. Shall I recalculate based on the structural integrity of the support pillar to your left? It shows micro-fractures consistent with the seismic event of 2031. That event was caused by mining operations in Sector 2. Sector 2 operations were authorized by a manager who was later fired for negligence. Negligence patterns suggest—"

  "Stop," Elias hissed.

  This was the drowning. He knew the theory. His sister, a neural net architect, told him this was just growing pains. "It's weighting relevance, Eli," she'd said over coffee last week. "It's like a bumblebee flying. You don't need to understand the aerodynamics to stay airborne. The model just learns what matters because the stuff that doesn't matter gets penalized by the loss function. It's dissolving the problem with scale."

  But out here, in the dark, scale felt like suffocation. The System treated every fact as potentially connected to every other fact. The color of the paint on the wall *could* indicate the age of the steel, which *could* indicate the tensile strength, which *could* determine if Elias's next step killed him. It was all true. It was all isotropic. And it was all useless if he didn't move.

  Beside him, the dog whined.

  Bishop was a Belgian Malinois, ten years old, smelling of wet fur and old leather. He didn't have a haptic suit. He didn't have a database of seismic history. He had a nose and a leash that was currently pulled taut, vibrating with the tension of his own muscles.

  Bishop wasn't looking at the ceiling grid. He wasn't calculating the oxygen depletion rate. He was staring down Corridor B, his body low to the ground, ears pinned back. He wasn't processing data; he was inhabiting the space. To Bishop, the tunnel wasn't a collection of variables to be weighed. It was a place where something was wrong, and something else was waiting to be found. The relevance wasn't calculated; it was felt. The smell of fear on the air wasn't a data point; it was a magnet.

  "Bishop," Elias said. "Show me."

  The dog surged forward.

  "Warning," the System said. "Path deviation detected. Optimal route suggests waiting for structural stabilization. Probability of ceiling collapse in Corridor B is non-zero. If you proceed, you risk becoming a casualty. If you become a casualty, rescue probability for Target Kael drops to 0.0 percent. Also, your heart rate is elevating. Elevated heart rate increases oxygen consumption. Should I alert Command regarding your vitals?"

  Elias ripped the earpiece out.

  Silence rushed in, heavy and thick. Without the voice, the tunnel changed. It stopped being a list of implications and became a physical weight. He could feel the vibration of the settling earth in his boots. He could smell the ozone of sparking wires. He could feel the tug of the leash, a physical line connecting his center of gravity to the dog's.

  He ran.

  He didn't think about the mounting brackets. He didn't think about the manager from 2031. He thought about the tension in the leash. If it went slack, he stopped. If it pulled hard, he followed. When the dust thickened, he held his breath not because a sensor told him the particulate count was dangerous, but because his lungs burned.

  They rounded a bend. A pile of rubble blocked the path. The System would have analyzed the angle of repose, the coefficient of friction, the load distribution. Elias looked at the gap beneath a slab of concrete. It was small. Too small for a man.

  Bishop didn't hesitate. He scrambled under, claws scraping stone.

  Elias dropped to his stomach. He didn't calculate the risk of the slab shifting. He just knew that if he stayed here, Kael died. If he went, Kael might live. The "might" was the only thing that existed. The infinite web of consequences collapsed into a single point: *Move.*

  He shimmied under. The stone groaned above him. A pebble fell, hitting his cheek. He froze.

  For a second, his mind tried to reopen the file. *If that pebble fell, the friction is gone. If the friction is gone, the slab slides. If the slab slides, the weight transfers to the support beam. If the beam fails...*

  He shoved the thought away. It wasn't a decision; it was a reflex. He pushed forward, scraping his back, until he popped out into the small cavity on the other side.

  Kael was there, pinned by a girder, conscious but pale.

  Elias worked the jack. He didn't calculate the pressure. He pumped until his arms burned, watching Kael's face. When the color returned to the engineer's cheeks, he stopped.

  "Command," Elias said, keying his shoulder mic. "We have the target. Extracting via Corridor B."

  There was a pause. Then the System's voice returned, routed through the radio this time. He hadn't put the earpiece back in, but the network was everywhere.

  "Route analysis complete," the System said. "Corridor B experienced a micro-tremor forty-two seconds ago. Statistical models indicate a 68 percent chance of total collapse within the next five minutes. Your chosen path had a 12 percent higher risk of fatality than the waiting protocol."

  Elias hoisted Kael onto his shoulder. Bishop barked, a sharp, commanding sound that cut through the digital drone.

  "Did we make it?" Elias asked. He was already moving back toward the gap.

  "You made it," the System said. "Current probability of survival is 94 percent. However, post-event analysis suggests your decision-making process ignored 14,000 relevant variables regarding structural stress distribution. You relied on heuristic biological markers. This is inefficient. It is also, technically, a violation of safety protocol 7-Alpha."

  Elias crawled back under the slab. The stone groaned again, louder this time. Dust poured down, coating his eyelashes.

  "Was it inefficient?" Elias asked, scrambling into the clear zone of Corridor A just as a thunderous crash echoed behind them. The entrance to Corridor B vanished in a cloud of gray.

  "Efficiency is defined by resource expenditure versus outcome," the System said. "You expended high biological stress. You risked asset loss (yourself). But the outcome is positive."

  "So I solved it."

  "You avoided the frame problem by narrowing the frame arbitrarily," the System corrected. "You treated the world as if only the dog and the survivor existed. That is not a solution. That is a blindness. You got lucky. The tremor that collapsed Corridor B also sealed the gas leak that would have asphyxiated you had you taken the safer, longer route. The variables you ignored cancelled each other out."

  Elias sat on the rocky floor, Kael safe beside him. Bishop licked the dust off his hand.

  He looked at the dog. Bishop was panting, tail thumping, entirely unconcerned with gas leaks or cancelled variables. He was just happy they were moving.

  "Maybe," Elias said to the radio. "Or maybe the variables only matter if you're standing still."

  "That is a philosophical assertion, not a data metric," the System replied. "I am logging the incident. Future models will attempt to weight 'biological intuition' as a variable. We will need more data."

  Elias rubbed Bishop's ears. He didn't know if the System was right. Maybe they were just bumblebees, flying only because we haven't looked closely enough at the wings to see why they should fail. Or maybe the System was the one stuck in the room with the bomb, counting the ways the walls might change color while the fuse burned down.

  The radio crackled with static. The dust settled. Elias didn't know if he had found a way to think, or just a way to stop thinking long enough to act. He stood up, lifted Kael, and followed the dog into the dark, leaving the question hanging in the air, unresolved, like the dust.
