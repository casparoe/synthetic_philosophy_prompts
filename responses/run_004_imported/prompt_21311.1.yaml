answer: |-
  **MEMORANDUM**

  **TO:** Graduate School Academic Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **RE:** Recommendation Regarding Petition #23-09 (Linguistics Doctoral Candidacy)

  **Recommendation**
  I recommend that the Committee **grant** the petition for a one-year extension of the seven-year doctoral limit, but that we do so on the narrow grounds of *detrimental reliance on administrative representation*, rather than on a reinterpretation of the Graduate Handbook. Simultaneously, I recommend we formally affirm that the current Handbook text *does* exclude medical leave from tolling provisions, and refer an immediate amendment to the Faculty Senate to rectify this omission prospectively.

  **Statement of the Problem**
  The Committee is divided between two principled positions. The first holds that the Handbook's silence on medical leave is deliberate (*expressio unius est exclusio alterius*). By explicitly listing military and parental leave as tolling events while omitting medical leave, the drafters established a bright-line rule. To read an exception into this text undermines the predictability required of academic policy and invites endless petitions asking us to rewrite the list based on sympathy.

  The second position holds that the omission is a drafting gap. The purpose of the seven-year clock is to ensure timely progress, not to penalize unavoidable life interruptions. Excluding medical leave defeats the equitable purpose of the tolling provision and treats a health crisis as a disciplinary failure.

  This decision will function as precedent. With two similar petitions pending in the Dean's inbox, a broad ruling in favor of the student risks eroding the seven-year limit entirely. A broad ruling against her risks enforcing a policy that is arguably obsolete and, in this specific instance, contradicted by the Dean's office.

  **Analysis**

  **1. Validating the Textualist Concern**
  We must concede that the "silence was deliberate" argument is the stronger reading of the *text as it currently stands*. When a regulatory body enumerates specific exceptions (military, parental) and omits others (medical), there is a legitimate administrative interest in treating that omission as meaningful. 

  The cost of ignoring this is high. A bright-line rule exists precisely to insulate the Committee from having to adjudicate the relative "worthiness" of every delay. If we decide that unwritten purposes can override an enumerated list whenever the facts pull at us, we transform the Handbook from a set of binding standards into a set of suggestions subject to case-by-case negotiation. The two pending petitions demonstrate this risk: if we rule that medical leave *automatically* tolls the clock based on the "spirit" of the policy, we have no grounds to deny those petitions, nor any future petition for sabbaticals, caregiving, or employment delays that a student argues were equally necessary. The "floodgates" concern is not rhetorical; it is the inevitable result of dissolving the boundary between the written rule and our discretion.

  Therefore, for the sake of institutional integrity, this Committee should **not** rule that the Handbook currently permits medical leave tolling. To do so would be to legislate from the committee chair. The text means what it says: medical leave is not currently an excluded category.

  **2. The Equitable Necessity of an Exception**
  However, applying that text to *this* student creates a distinct injustice that goes beyond mere hardness of the rule. This is not a case of a student misreading the Handbook; it is a case of a student relying on specific, written guidance from the Dean's office stating her "progress clock is paused."

  Regardless of the Handbook's text, the University created a reasonable expectation in this student that her leave would not count against her limit. She structured her dissertation timeline based on that representation. To deny her now is to punish her for an administrative ambiguity she could not resolve. In legal terms, this is a matter of detrimental reliance. While the Committee cannot rewrite the Handbook, we do possess the discretionary authority to grant waivers in instances where strict adherence to policy would compound an administrative error.

  **3. Managing Precedent (The "Conditions")**
  To resolve this without sacrificing the bright-line rule for future cases, we must distinguish between *interpreting the rule* and *waiving the rule*.

  *   **For this student:** We grant the waiver based on the specific evidence of the Dean's email. This solves the immediate inequity without validating the argument that the Handbook *requires* this outcome.
  *   **For the pending petitions:** We affirm that absent similar written representation from the Dean's office, the Handbook text controls. Medical leave is not an automatic tolling event under the current policy. This closes the "floodgates" for the two petitions currently in the Dean's inbox (unless they possess similar documentation).
  *   **For the future:** We acknowledge that the current text is likely a drafting artifact that no longer reflects the Graduate School's values. We should formally recommend an immediate amendment to explicitly include medical leave in the tolling provisions. This allows the Faculty to make the policy change democratically, rather than having the Committee force it through via adjudication.

  **Conclusion**
  We can respect the integrity of the written rule while avoiding an unjust outcome in this specific instance. By grounding our decision in reliance on administrative guidance rather than statutory interpretation, we validate the concern that the Handbook's list is indeed exclusive, while preventing the University from reneging on its own agent's promises.

  I move that we grant the extension for Petition #23-09 solely on the grounds of documented administrative reliance, affirm the current exclusion of medical leave in the Handbook text for all other cases, and refer a proposal to the Faculty Senate to amend Section 4.2 to include medical leave prospectively.
