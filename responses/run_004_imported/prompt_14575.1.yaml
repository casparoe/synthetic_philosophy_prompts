answer: |-
  Thank you all for being here.

  Looking out at this room, I see two distinct worlds. On one side, there are the people who knew my mother as Mom: the one who burned the toast on Sundays, who worried about whether we wore coats in the winter, who loved bad mystery novels and loud music. On the other side, there are the people who knew her as the Coordinator: the one who took the call at 3:00 AM, who walked into the ICU when the air was thickest, who asked the question that no one ever wants to answer.

  For thirty-four years, my mother lived in the threshold between those two worlds. And if there is one thing I have learned about her, it is that she never tried to pretend the threshold wasn't there.

  Most eulogies try to offer comfort by simplifying the person who died. We talk about them in absolutes. We say they were certain, or steadfast, or that they found peace. But to do that for my mother would be a betrayal. She spent her career gently declining to offer other people's families the comfort of a simplified truth. She believed that precision, even when it was difficult, was a form of respect. So, I am not going to tell you that she found easy answers. I am going to tell you that she asked hard questions, and she loved people enough to let the questions stand.

  To her friends and family here: My mother's job was to help save lives through organ donation. She was good at it. She was compassionate, tireless, and she helped countless families find meaning in their worst moments. That is the headline.

  But to her colleagues here—the nurses, the surgeons, the procurement staff who spent years arguing this exact material with her over stale coffee—you know the subtext. You know that she was, in her own words, the "office heretic."

  She came to believe that the lines we draw around death are not always as biological as we pretend they are. She read the literature. She saw the case reports of bodies that continued to heal long after the diagnosis. She saw the pregnant women maintained on support months after being declared brain dead. And she watched the circulatory-death cases in the operating room.

  She used to come home and talk about this at the kitchen table. She wasn't cynical; she was rigorous. She insisted that calling a heart's stopping "irreversible" was usually just a polite word for "we have collectively decided not to try." She thought the difference between a cessation being permanent because everyone present has agreed not to reverse it, and a cessation being irreversible in principle, was one of the few places where staying precise with a grieving family was itself an act of respect rather than cruelty.

  I know that for half of this room, that sounds like abstract philosophy. But for the people in the scrubs in the back row, you know exactly which five-minute window she was talking about. You know the eye roll she saved for the word "irreversible." She wasn't mocking the work; she was honoring the weight of it. She believed that if we are going to make a decision that profound, we owe it to the dead, and the living, to admit that it is a decision, not just a discovery.

  She spent decades being gently mocked by colleagues who thought she was overthinking a settled question. But she never stopped thinking it. Because to her, the "settled question" was a person. A father, a daughter, a spouse. And you don't honor a person with slogans. You honor them with the truth, however messy it is.

  There is a temptation, when someone works in death, to assume they become hardened. That they stop feeling the weight of it. But my mother carried every single case. I know this because I saw what happened when she came home. I saw the silence. I saw the way she would wash her hands for a long time, scrubbing away the hospital, trying to get back to us.

  She taught me that integrity isn't about sticking to a rulebook. It's about refusing to let the rulebook replace your conscience. She taught me that you can be part of a system and still question its edges. In fact, she believed that was the only way to keep the system human.

  Now, she is the one who has died. And I find myself in the position of many of the families she sat with. I am looking for the line. I am looking for the moment where she went from being here, to being gone.

  I could tell you exactly when her heart stopped. I could tell you the time the doctor pronounced her. But if I did that, I would be ignoring the lesson she spent thirty-four years teaching. Because the moment she died isn't just a timestamp on a chart. It is not just a biological event.

  The moment she died is being felt right now, in this room. It is in the silence of the nurses who lost a teammate who understood the burden they carry. It is in the grief of the friends who lost a listener who never offered platitudes. It is in the empty seat at my kitchen table.

  She spent her life arguing that death is not a single switch that flips in the brain or the heart. She argued that it is a process, a transition, a threshold that we cross together. And if she was right, then she isn't entirely gone yet. As long as we are here, acknowledging the complexity of her life, acknowledging the difficulty of her work, and acknowledging the love she had for all of us, she is still in the room.

  To her medical family: Thank you for arguing with her. Thank you for listening to her, even when you thought she was overthinking it. She respected you because you did the work she found so morally complex. She knew that you were the ones holding the line, and she knew how heavy that line was.

  To my family and friends: Thank you for loving her outside of the hospital walls. Thank you for reminding her that there was a world where "irreversible" just meant a broken vase, and "donation" meant giving to charity, not giving organs. She needed that world. We all do.

  My mother did not believe in easy certainties. She believed in honest questions. So I will not end by saying I know where she is, or that I know exactly what happens next. She would probably roll her eyes at me if I claimed to know that.

  But I do know this: She was precise. She was kind. She was brave enough to sit in the gray areas when everyone else wanted black and white. And she loved us enough to tell us the truth, even when the truth was complicated.

  If we want to honor her, we shouldn't try to simplify her memory. We should do what she did. We should be precise with our love. We should be honest about our grief. And when we encounter the hard questions in our own lives, the ones where the rulebook doesn't quite fit the human being in front of us, we should have the courage to pause, to think, and to choose respect over certainty.

  Thank you, Mom, for teaching us how to ask the hard questions. And thank you all for being here to answer them with us.
