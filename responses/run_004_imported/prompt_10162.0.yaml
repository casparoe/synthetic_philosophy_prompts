      *   *Missing from Nadia:* She leans too hard on "complete concepts" without addressing the *moral* necessity of God's choice. She doesn't address whether the "best" is about moral goodness or metaphysical perfection (plenitude). She also glosses over the "unfalsifiable" charge too easily.
      *   *Shared Blind Spot:* The nature of "Evil." For Leibniz, evil is a privation, not a positive substance. The earthquake isn't "added"; it's a consequence of finite matter following laws. Both treat the earthquake as a discrete "thing" to be removed.
