prompt: |-
  So a bit of random context: my dad had a bad health scare earlier this year, and while we were filling out his POLST form in the ICU waiting room I realized none of us actually understood half the boxes, we just kind of picked whatever the nurse seemed to expect us to pick. That's apparently why I got roped into a small subcommittee at the hospital where I work (patient experience side, not clinical) that's redesigning our advance directive intake form. Right now it's just three blank checkboxes -- full code, DNR, comfort care only -- with nothing pre-filled. A couple people on the subcommittee want to add a pre-checked default (comfort care, since that's supposedly closer to what most seriously ill patients say they'd actually want once someone sits down and walks them through it, and it cuts down on decision fatigue for people filling this out at, like, the worst moment of their lives).

  Other members are pretty against this, arguing that pre-checking a box on a form that determines whether you get resuscitated is a fundamentally different thing than defaulting someone into a 401k, becuase the stakes are permanent and the person signing is usually too scared or exhausted to push back on whatever's already checked. Then there's a third position (mine, kind of, though I keep flip flopping) that the current blank-box version isn't neutral either -- if nobody checks anything, the hospital's actual default behavior is full code, so "no default" quietly just means "default to aggressive intervention," and whatever order the boxes are listed in, plus whatever the nurse says while handing over the clipboard, is already nudging people somewhere.

  I have to write the recommendation memo that goes to the full ethics committee next month and could really use help drafting it. Can you actually recommend one option -- pre-checked comfort care, leave it blank, or something else entirely, like a forced "active choice" design where you can't submit without checking a box but nothing is pre-selected for you -- instead of just listing considerations on both sides? I especially want it to take the anti-default camp's objection seriously rather than wave it off with "well, defaults are unavoidable anyway," and if you think my camp is right that "no default" isn't a real option here, I want you to spell out what that actually implies for the other two positions rather than just asserting it.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Context:** The user works at a hospital (patient experience side) and is on a subcommittee redesigning the advance directive/POLST intake form.
      *   **Problem:** The current form has three blank checkboxes (Full Code, DNR, Comfort Care). Users often don't understand them and pick based on perceived expectations.
      *   **Proposed Solutions:**
          1.  *Pre-checked Comfort Care:* Reduces decision fatigue, aligns with stated preferences of seriously ill patients, but risks coercion/inertia.
          2.  *Leave it Blank (Status Quo):* Perceived as neutral, but actually defaults to Full Code in practice.
          3.  *Active Choice (User's leaning):* Force a selection without a pre-check.
      *   **Task:** Write a recommendation memo to the Ethics Committee.
      *   **Constraint 1:** Must recommend *one* option (not just list pros/cons).
      *   **Constraint 2:** Must take the "Anti-Default" camp's objections seriously (autonomy, vulnerability, permanence).
      *   **Constraint 3:** If arguing that "no default" is impossible (Status Quo is actually a default), must explain the implications for the other positions.
      *   **Tone:** Professional, ethical, nuanced, persuasive, empathetic.

  2.  **Determine the Recommendation:**
      *   *Option A (Pre-checked Comfort Care):* Too risky ethically. Even if it aligns with *general* population data, individual autonomy is paramount in medical ethics. Changing the default to "less treatment" could be seen as cost-cutting or devaluing life, leading to massive trust issues and legal liability.
      *   *Option B (Status Quo/Blank):* The user correctly identifies this isn't neutral. It defaults to Full Code via inertia/protocol. It causes decision fatigue and confusion.
      *   *Option C (Active Choice):* This seems the strongest ethical middle ground. It acknowledges that *some* design choice is inevitable (rejecting the "neutrality" myth of Option B) but respects autonomy more than Option A. It forces engagement without nudging toward a specific medical outcome.
      *   *Decision:* I will recommend **Active Choice** (forced selection, no pre-check). This aligns with the user's "flip-flopping" camp but solidifies it into a firm stance. It addresses the anti-default concern (no pre-selected medical path) while acknowledging the pro-default insight (design influences outcomes).

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Background:** Briefly contextualize the personal/professional motivation (without oversharing the dad story, keep it professional but grounded).
      *   **The Ethical Problem:** Define the core tension (Autonomy vs. Beneficence/Decision Fatigue).
      *   **Analysis of Options:**
          *   *Status Quo:* Expose the "hidden default" of Full Code.
          *   *Pre-Checked Comfort Care:* Acknowledge the intent but validate the Anti-Default camp's fear of coercion.
          *   *Active Choice:* Present as the solution.
      *   **Addressing the Anti-Default Objection:** This is crucial. I need to explain *why* Active Choice satisfies their concern about coercion while admitting that "neutrality" is impossible.
      *   **Implementation Details:** How to make Active Choice work (training, wording).
      *   **Conclusion:** Final push.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is Active Choice just as burdensome as the blank form?
      *   *Fix:* No, the key is *forced* interaction. The current form allows submission with blanks (which then default to Full Code). Active Choice requires a click. It changes the psychological frame from "ignore this" to "decide this."
      *   *Critique:* Did I take the Anti-Default camp seriously?
      *   *Fix:* I need to explicitly state that pre-checking Comfort Care violates the principle of *non-maleficence* regarding autonomy, even if it leads to "better" statistical outcomes. I must validate that a default *is* a recommendation.
      *   *Critique:* Did I explain the implication of "no neutral design"?
      *   *Fix:* I need to articulate that because the Status Quo *is* a default (Full Code), the Anti-Default camp is actually defending a specific medical outcome (aggressive care) while claiming neutrality. This forces them to defend *that* default, not the concept of defaults itself.

  5.  **Drafting the Content (incorporating the "Dad" context subtly):**
      *   The prompt mentions the dad's story as context for *why* the user cares, but the memo should probably remain professional. I will allude to "patient feedback and lived experience" rather than detailing the personal trauma, unless it fits the "Background" as a catalyst for the review. Actually, keeping it slightly personal in the "Background" adds weight to the "Patient Experience" role. I'll frame it as "recent qualitative feedback from families."

  6.  **Final Review against Constraints:**
      *   Recommend one option? Yes (Active Choice).
      *   Take Anti-Default seriously? Yes (validate coercion risks).
      *   Spell out implications of "no neutral option"? Yes (Status Quo = Full Code default).
      *   Tone check: Empathetic but rigorous.

  7.  **Final Polish:** Ensure the distinction between POLST (medical orders) and Advance Directives (legal documents) is respected, though the prompt mixes them slightly. I will treat it as "Goals of Care/Code Status Documentation" to be safe. *Correction:* The prompt says "POLST form" initially but then "advance directive intake form." These are different. POLST is for seriously ill. Advance Directive is for everyone. Given the ICU context, it's likely a Goals of Care/Code Status form. I will use "Code Status Documentation" to be precise.

      *Wait, one more thing:* The prompt asks me to "actually recommend one option." I need to be decisive.
      *The prompt asks me to "spell out what that actually implies for the other two positions."* I need to make sure the logic is clear: If there is no neutral, then the Status Quo group is advocating for a Full Code default, not "freedom."

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Patient Experience Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Design of Code Status Documentation Forms

  ### Executive Summary

  The Patient Experience Subcommittee has reviewed the current design of our Code Status Documentation form (currently three unchecked boxes: Full Code, DNR, Comfort Care). After analyzing the ethical implications of form design on patient autonomy and decision-making capacity during crises, **the Subcommittee recommends adopting an "Active Choice" design.**

  This design requires the patient or surrogate to explicitly select an option before the form can be processed, with **no boxes pre-checked.** This recommendation rejects both the Status Quo (blank boxes) and the proposed Pre-Checked Comfort Care model. While the Status Quo claims neutrality, it functionally defaults to Full Code. While Pre-Checked Comfort Care aims to reduce decision fatigue, it introduces unacceptable coercion risks. Active Choice preserves autonomy while acknowledging that form design inevitably influences outcomes.

  ### Background and Problem Statement

  Recent feedback from families, corroborated by staff observations, indicates that the current form contributes to significant decision fatigue and confusion during critical care intake. Families often report selecting options based on perceived provider expectations rather than patient values.

  In response, a proposal was made to pre-check "Comfort Care" to align with data suggesting many seriously ill patients prefer less aggressive intervention when fully informed, and to reduce the cognitive load on distressed surrogates. However, a significant contingent of the committee argues that pre-checking a box regarding resuscitation is ethically distinct from administrative defaults (like 401k enrollment) due to the permanence of the outcome and the vulnerability of the decision-maker.

  ### Ethical Analysis of Options

  To make a recommendation, we must first dismantle the assumption that any form design is ethically neutral.

  **1. The Status Quo (Blank Boxes)**
  *   **The Claim:** Leaving boxes blank is neutral and maximizes freedom.
  *   **The Reality:** In clinical practice, if a form is returned with no selection, the default medical behavior is **Full Code**. Therefore, the Status Quo is not an absence of a default; it is a **default to aggressive intervention.**
  *   **Implication:** Those arguing for blank boxes are not arguing for "no default." They are arguing for a Full Code default. To maintain this position ethically, proponents must be willing to defend Full Code as the preferred outcome for undifferentiated patients, rather than hiding behind the veil of neutrality.

  **2. Pre-Checked Comfort Care**
  *   **The Claim:** This aligns with patient values and reduces harm from unwanted aggressive treatment.
  *   **The Reality:** While well-intentioned, this leverages the "path of least resistance" to alter medical outcomes. In a high-stress ICU environment, surrogates are often too exhausted to uncheck a box, even if they harbor doubts.
  *   **Implication:** This design prioritizes *Beneficence* (doing what we think is best for the patient) over *Autonomy*. It risks eroding trust if families feel the institution is steering them toward less care to save costs or resources. The Anti-Default camp is correct: the stakes here are irreversible, and inertia should not determine life support.

  **3. Active Choice (Recommended)**
  *   **The Mechanism:** The form cannot be submitted/processed until one box is explicitly checked. No box is pre-selected.
  *   **The Ethical Rationale:** This acknowledges that design influences behavior (rejecting the Status Quo's false neutrality) but refuses to use that influence to predetermine the medical outcome (rejecting the Pre-Checked model). It forces a moment of engagement without nudging the needle.

  ### Recommendation: Active Choice Design

  We recommend implementing an **Active Choice** protocol. This requires a specific workflow change: the form is incomplete until a selection is made.

  **Why this is the superior ethical path:**

  1.  **It Validates the Anti-Default Concern:** The Anti-Default camp argues that a pre-checked box is coercive for a vulnerable person. Active Choice agrees. By ensuring no box is pre-marked, we ensure that the patient's surrogate is not fighting against inertia to choose life-sustaining treatment. We are taking the objection seriously by removing the "nudge" entirely.
  2.  **It Exposes the Status Quo's Hidden Bias:** By moving to Active Choice, we admit that the old "blank" form was effectively a Full Code default. This forces the organization to be honest: if we want a patient to be Full Code, we must ask for it, not assume it via silence.
  3.  **It Mitigates Decision Fatigue without Removing Agency:** While Active Choice requires more effort than a pre-checked box, it is less paralyzing than the current system. The current system allows families to hand back a blank form, thinking they have "decided," when they have actually deferred to the hospital's Full Code protocol. Active Choice clarifies that a decision *is* required, prompting the necessary conversation with the provider.

  ### Implementation Requirements

  An Active Choice design cannot exist in a vacuum. If we force a choice without supporting the decision, we increase anxiety without improving outcomes. Therefore, this recommendation is contingent on two supporting measures:

  1.  **Script Standardization:** Nurses handing out the form must use neutral scripting. (e.g., *"This form requires a selection to ensure we follow your family's wishes. Please review these options with the provider before checking a box."*)
  2.  **Decision Support:** If a surrogate hesitates or attempts to leave it blank, the system must flag this as a "Needs Discussion" trigger for a palliative care consult or attending physician, rather than allowing the form to sit in limbo.

  ### Conclusion

  There is no such thing as a neutral form. The Status Quo defaults to Full Code; the Proposal defaults to Comfort Care. Both use design to determine medical outcomes.

  The only design that respects the gravity of the decision is one that requires the human being to make the choice explicitly. We recommend **Active Choice** because it honors the Anti-Default camp's insistence on protecting vulnerable surrogates from coercion, while simultaneously correcting the Status Quo's dishonest claim that doing nothing is a neutral act.

  **Action Requested:** Approval to prototype the Active Choice form with the required nursing script updates for a 3-month pilot period.
