      *   *Key Challenges:*
          *   Money Pump/Dutch Book: If an agent prefers $A \succ B$, $B \succ C$, but has incomplete prefs between $A$ and $C$, can they be pumped? Or specifically, if they are indifferent between shutdown and non-shutdown, do they pay to avoid commitment?
          *   Stability: Will gradient descent or instrumental convergence drive the agent to complete its preferences to be more efficient?
          *   Implementation: How is this actually encoded in a neural net vs. just behavioral training?
          *   Corrigibility vs. Incompleteness: Is this just semantic dressing on "be nice to humans"?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Mechanism.* Need to establish how this works technically.
