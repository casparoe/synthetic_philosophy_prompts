answer: |-
  **Setting:** *Paris, 1758. Diderot's study is cluttered with proofs for the Encyclopédie, busts of philosophers, and scattered scripts. It is late evening. A single candelabra burns low. ROUSSEAU sits stiffly in a wooden chair; DIDEROT paces, a pipe unlit in his hand.*

  **ROUSSEAU:** You smile, Denis. You smile as if I have merely swatted at a fly, when I tell you the theater is a poison in the cup of the Republic.

  **DIDEROT:** I smile, Jean-Jacques, because you argue with the fervor of a prophet against a carpenter. You condemn the tool because you fear the hand that wields it. We are speaking of Molière. Specifically, your grievance with *The Misanthrope*.

  **ROUSSEAU:** My grievance is with the audience. I sat in that house, and I watched them. When Alceste speaks the truth—blunt, unvarnished, necessary truth—they laugh. They treat his virtue as a malady. And when Philinte offers a lie to smooth a social ruffle, they nod. They call it *savoir-vivre*. I call it complicity. The stage instructs them that to be good is to be ridiculous, and to be accommodating is to be wise.

  **DIDEROT:** But Alceste is not good, Jean-Jacques. He is rigid. He is a tyrant of honesty. If a friend asks, "Do I look well?" and they look ill, must you strike them down with the truth? Molière does not ridicule virtue; he ridicules the *affectation* of virtue. He shows us that morality without prudence is merely another form of selfishness. Alceste loves humanity in the abstract, but he cannot bear a single human being in the room.

  **ROUSSEAU:** That is a convenient distinction for the courtier. To say, "I love man, but I must lie to this specific man." No. The theater creates a space where we can applaud the *idea* of honesty while practicing the art of the lie. We go home feeling purified because we laughed at Alceste, telling ourselves, "I am not so foolish as he." And so, we become Philinte. We become safe.

  **DIDEROT:** And is safety not a civic virtue? If everyone were Alceste, Paris would be a battlefield of duels by noon. The theater is a school of social cohesion. It shows us the edges of our behavior. We laugh at Alceste not because he is honest, but because he lacks measure.

  **ROUSSEAU:** Measure! You speak of measure while the world burns. This is the great deception of the stage. It allows us to feel pity without acting. I wrote this to d'Alembert: In the theater, we weep for the suffering of a fictional king. We shed tears that cost us nothing. And because we have cried, we feel we have paid our debt to humanity. We do not go out into the street to feed the poor. We have already been virtuous in the dark. The theater is a sanctuary where conscience goes to sleep.

  **DIDEROT:** (Stops pacing, leans against the desk)
  You think emotion is a finite resource? That if I spend pity on Hecuba, I have less for the widow on the Rue Saint-Jacques?

  **ROUSSEAU:** I think emotion is a muscle that atrophies if exercised only on illusions. If I practice weeping for shadows, I grow soft for reality.

  **DIDEROT:** On the contrary. A heart that never moves is stone. The theater sensitizes the soul. It is a gymnasium. We practice feeling there so that we do not become numb here. When the actor suffers, he creates a mirror. If the spectator recognizes that suffering, he acknowledges his own capacity for pain. That recognition is the seed of empathy. You want to remove the mirror because you fear the reflection will satisfy the viewer. I say the reflection wakes them up.

  **ROUSSEAU:** It is a narcotic, Denis. A pleasant dream. And who are the dealers of this dream? The actors.

  **DIDEROT:** (Straightens up)
  Ah. Now we come to the wound. You believe the actor is a corrupt soul.

  **ROUSSEAU:** I believe the actor makes a living out of self-betrayal. To stand on a plank and pretend to be another—to speak passions you do not feel, to weep tears that are not yours—is to fracture the self. You say you cultivate the arts? I say you cultivate a species of people who no longer know who they are. They are public property. They exist only in the gaze of the other. Is this not the ultimate corruption of the natural man? To be always performing, never being?

  **DIDEROT:** (Sits opposite him, intense)
  You mistake the craft for the sickness. You think the actor *becomes* the character?

  **ROUSSEAU:** If he does not, he is a liar. If he does, he is mad.

  **DIDEROT:** He is neither. He is a master. This is the paradox you refuse to see. The great actor feels nothing.

  **ROUSSEAU:** (Recoils slightly)
  Nothing?

  **DIDEROT:** Nothing. If the actor weeps truly, he stammers. He chokes. He loses control of the verse. The audience sees his pain, not the character's. To move the audience, the actor must be cool. He must be a detached observer of his own performance. He wears the mask not because he has lost his face, but because he has perfected the control of it. It is not self-loss, Jean-Jacques. It is the highest form of self-mastery.

  **ROUSSEAU:** It is chilling. You describe a monster. A man who can simulate agony while his pulse remains steady? This is not mastery; it is dissociation. It is the habit of the courtier perfected into an art form. If you train yourself to separate your inner truth from your outer expression, how can you ever be a true friend? A true citizen? You are teaching men to live a double life.

  **DIDEROT:** I am teaching men that truth is not merely what bubbles up from the gut. Truth is constructed. It is art. When I write the *Encyclopédie*, I am not "being" Diderot in every line. I am constructing a voice to serve the truth of knowledge. The actor constructs a voice to serve the truth of the human condition. Is the painter corrupt because he paints a sorrow he does not currently feel?

  **ROUSSEAU:** The painter does not inhabit the sorrow. He does not use his own body as the lie. The actor offers his own presence as the sacrifice. And for what? So the bourgeoisie can sit in their boxes and judge? You say the actor is a master. I say he is a slave to the applause. He changes his morality to fit the role. Tonight he is a villain, tomorrow a hero. What core remains?

  **DIDEROT:** The core that chooses the art. Look, Jean-Jacques. You dream of a transparent society. Where what is inside is exactly what is outside. No masks. No theater. Just pure, natural expression.

  **ROUSSEAU:** Yes.

  **DIDEROT:** But nature is chaotic. Nature is brutal. Alceste is "natural." He speaks exactly what he thinks. And he is miserable, and he makes everyone around him miserable. Civilization requires a mask. It requires the space between what I feel and what I show. That space is where tolerance lives. The theater teaches us to navigate that space. It shows us the consequences of removing the mask entirely.

  **ROUSSEAU:** But if the mask becomes the face... if we spend our lives in that space... we forget there is a sun outside the theater. You argue for a theater of virtue. But I tell you, the very structure of the theater is vanity. We gather to be seen seeing. We dress, we posture, we applaud to show we have taste. It is a feedback loop of narcissism.

  **DIDEROT:** And your solution? To burn the playhouses? To return to the forest?

  **ROUSSEAU:** To gather in a square. To dance, not watch. To participate, not spectate. Let the people be the spectacle to themselves. No actors, no authors, no kings in the boxes.

  **DIDEROT:** (Sighs, picks up his pipe)
  You want a festival without form. I want a form that elevates the festival. You distrust the actor because you distrust the possibility that a lie can tell the truth.

  **ROUSSEAU:** I distrust it because I have seen men who lie for a living forget how to tell the truth for a life. I worry for the man playing Alceste tonight. If he does it well, if he makes them laugh at his own integrity... does he not damage his own soul? Does he not learn, in his bones, that honesty is a joke?

  **DIDEROT:** Or... if he does it well, he shows them the tragedy of that laughter. He makes them laugh, and then holds the mirror up until the laughter sticks in their throats. That is the hope. That the simulation is so potent it breaks the simulation.

  **ROUSSEAU:** (Stands, walks to the window)
  Hope is a dangerous thing when built on illusion. I fear that when the lights go down, the actor takes off the costume but leaves the hollowness on. And the spectator wipes his eyes and sleeps soundly, having done his duty for the month.

  **DIDEROT:** And I fear that without the lights, without the story, the spectator sees nothing at all. He walks through the dark without a lantern. You offer him the sun, Jean-Jacques, but it is too bright. He needs the stage. He needs the shadow to see the shape of the light.

  **ROUSSEAU:** (Turns back, his expression softening, sad)
  Then we are at an impasse. You believe the mask saves the man. I believe the mask suffocates him.

  **DIDEROT:** Perhaps. Or perhaps the mask is the only thing that allows the man to speak loud enough to be heard.

  **ROUSSEAU:** Then pray, Denis, that the man underneath does not forget how to breathe.

  **DIDEROT:** And pray, Jean-Jacques, that the silence of the forest does not become so loud he forgets how to speak.

  *(A long silence hangs between them. The candle flickers. Rousseau turns back to the window, looking out at the dark city. Diderot lights his pipe, the smoke rising to join the shadows of the books.)*

  **DIDEROT:** (Quietly)
  Break a leg, as they say.

  **ROUSSEAU:** (Without turning)
  God help him.

  *(Fade out.)*
