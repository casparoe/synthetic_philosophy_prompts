      *   *Standard Conditionalization:* $P_{new}(H) = P_{old}(H|E)$. If I learn $E$ then $F$, $P(H|E \land F)$ is the same regardless of order.
      *   *Jeffrey Conditionalization:* $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   *The Problem:* If I do a Jeffrey update on partition $\mathcal{E}$ (shifting probs to $p_1, p_2...$) and then on partition $\mathcal{F}$ (shifting probs to $q_1, q_2...$), the result depends on the order.
      *   *Why?* The second update uses the *intermediate* conditional probabilities $P_{mid}(H|F_j)$, not the original $P_{old}(H|F_j)$. The first update changes the conditional probabilities relevant to the second partition unless the partitions are independent. This is tied to the *Rigidity Condition* (probabilities of hypotheses conditional on the partition elements stay fixed *during that specific update*).
      *   *The "Same Evidence" Ambiguity:* What does it mean to apply the "same" uncertain evidence in a different order? Does it mean fixing the final marginal probabilities of the partitions? Or does it mean fixing the *impact* relative to the prior?

  3.  **Drafting - Section by Section:**

