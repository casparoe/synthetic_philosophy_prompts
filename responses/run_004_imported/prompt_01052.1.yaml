  2.  **Deconstruct the Arguments:**
      *   **Synchronic Dutch Book (SDA):**
          *   Premise: Agent has credences $P$ at time $t_1$.
          *   Mechanism: Bookie offers bets based on $P$.
          *   Flaw: If $P$ violates axioms (e.g., $P(A) + P(\neg A) < 1$), Bookie constructs a portfolio guaranteeing loss.
          *   Force: Internal inconsistency at a single time. No external information needed about *how* the agent will change.
      *   **Diachronic Dutch Book (DDA):**
          *   Premise: Agent has credences $P_1$ at $t_1$, plans to update to $P_2$ at $t_2$ upon learning $E$.
          *   Mechanism: Bookie offers bet at $t_1$ (based on $P_1$) and bet at $t_2$ (based on $P_2$).
          *   Flaw: If $P_2(H) \neq P_1(H|E)$, Bookie constructs a sequence guaranteeing loss.
