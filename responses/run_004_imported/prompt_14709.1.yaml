      *   *Epistemic Claim:* Markets are better at aggregating information/beliefs than voters or legislators.
      *   *Assumption:* Prices reflect all available information (Efficient Market Hypothesis).

  4.  **Evaluate Argument 1: Independence and the Jury Theorem:**
