      *   *Condorcet's View:* He knew simple majority rule on preferences leads to instability. He preferred methods that found the "most probable" true ordering (Kemeny-Young logic pre-figured).
      *   *Crucial Point:* Condorcet believed in an objective *truth* about the public good, not just subjective preference aggregation. Futarchy treats values as subjective preferences to be aggregated.
      *   *Verdict:* Condorcet would argue that if the "values vote" is subject to cycling or manipulation, the market is optimizing for a moving target or an incoherent function.

  6.  **Synthesize the Stance:**
