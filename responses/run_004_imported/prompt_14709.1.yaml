prompt: |-
  Random thing I've been chewing on for my social epistemology seminar: Condorcet spent his whole career trying to mathematize collective decision-making -- the jury theorem, the whole "social mathematics" project -- so he feels like the right guy to drag into a debate about Robin Hanson's futarchy (vote on values, bet on beliefs, then let prediction markets pick whichever policy traders think will do best on the agreed-on metric). Would Condorcet's own jury theorem make him suspicious of swapping independent voters for traders, given how badly speculative markets violate the independence assumption the theorem needs? And does his paradox about cycling majorities cause trouble for the idea that a legislature can just vote on a single welfare metric up front, before any of the cycling problems he found with ordinary preference aggregation even get a chance to show up? I definately don't want "he'd have mixed feelings" as the answer -- tell me which way he'd actually come down, and don't be afraid to get into the math.
