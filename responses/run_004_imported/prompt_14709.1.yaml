answer: |-
  Condorcet would **reject** Futarchy. He would view it not as an advancement of social mathematics, but as a fundamental category error that corrupts the epistemic conditions required for legitimate collective decision-making.

  He would not have "mixed feelings." He would argue that Hanson's mechanism violates the necessary conditions for truth-tracking established in his *Essai sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix* (1785). Specifically, he would attack Futarchy on two mathematical fronts: the destruction of voter independence in prediction markets and the logical incoherence of the "vote on values" stage.

  Here is the breakdown of why Condorcet would kill the proposal.

  ### 1. The Destruction of Independence (The Jury Theorem Argument)

  Condorcet's Jury Theorem (CJT) is not just a claim that "more people are smarter." It is a specific probabilistic claim about the convergence of majority rule toward truth.

  Let $n$ be the number of voters, and $p$ be the probability that any single voter chooses the correct option (competence). If votes are independent and $p > 0.5$, the probability that the majority chooses correctly approaches 1 as $n \to \infty$.

  $$ P(\text{Majority Correct}) = \sum_{k=\lfloor n/2 \rfloor + 1}^{n} \binom{n}{k} p^k (1-p)^{n-k} $$

  Condorcet was acutely aware that this theorem relies on the **independence assumption**. In his political writings, he railed against "corporate spirits," factions, and influence, precisely because they introduce correlation between votes. If voters copy each other or are influenced by a common signal, the effective $n$ shrinks, and the convergence to truth fails.

  **Why Futarchy Fails This Test:**
  Prediction markets are engines of correlation, not independence.
  1.  **Common Signals:** Traders do not arrive at prices via independent reasoning processes; they react to the same price signals, news feeds, and order books. This creates a "common noise" component in their error terms.
  2.  **Herding:** In financial markets, rational behavior often involves mimicking others (information cascades). If a "whale" moves the market, others follow.
  3.  **Mathematical Consequence:** If we model voter error with a correlation coefficient $\rho > 0$, the variance of the aggregate vote does not scale down as $1/n$. It scales down much slower, or not at all.

  Condorcet would argue that swapping voters for traders replaces a body of citizens (who, if educated, can approach independent judgment) with a body of speculators (who are structurally incentivized to correlate their bets to minimize risk). For Condorcet, a market price is not a "truth"; it is a consensus of incentives, often distorted by liquidity constraints and manipulation. He would view the market as a violation of the independence condition required for his theorem to hold, rendering the "bet on beliefs" stage epistemically bankrupt.

  ### 2. The Instability of the Welfare Metric (The Paradox Argument)

  Futarchy attempts to sidestep Arrow's Impossibility Theorem and Condorcet's Paradox by bifurcating the problem:
  1.  **Politics:** Vote on a utility function $U$ (Values).
  2.  **Market:** Maximize $E[U]$ (Beliefs).

  Condorcet would identify this as a sleight of hand. The "vote on values" is still a voting problem, and it is subject to the very paradoxes he discovered.

  **The Math of Cycling:**
  Condorcet showed that if you have three voters and three options (or dimensions of a welfare metric), majority rule can produce intransitive social preferences ($A > B$, $B > C$, $C > A$).

  In Futarchy, the legislature must agree on a single metric (e.g., "Maximize GDP" vs. "Maximize GHI" vs. "Maximize Equality"). If the legislators have different weightings for these values, majority voting on the metric itself will cycle.
  *   Legislator 1 prefers GDP > Equality > GHI
  *   Legislator 2 prefers Equality > GHI > GDP
  *   Legislator 3 prefers GHI > GDP > Equality

  There is no stable "Values" vote. The metric will change depending on the order of voting. Condorcet knew that without a specific voting method designed to find the "most probable" ordering (like his own method or Borda's), simple majority rule on values yields no coherent will to maximize.

  **The "Single Metric" Fallacy:**
  Condorcet believed in an objective *general will* grounded in natural right and reason, not a subjective utility function constructed by aggregation. He would argue that reducing the public good to a single scalar metric $U$ is a mathematical reductionism that destroys the nuance required for justice. If the metric is incoherent (due to cycling) or reductionist (due to aggregation), the prediction market is simply optimizing for a nonsense variable. As the saying goes: *Garbage In, Garbage Out*. Condorcet would say Futarchy builds a high-precision engine (the market) and fuels it with incoherent preferences (the vote).

  ### 3. Epistemic Truth vs. Market Price

  Finally, Condorcet would reject the philosophical underpinning of Futarchy.

  *   **Condorcet's Goal:** **Truth.** He viewed voting as an epistemic process to discover the correct decision that aligns with reason and justice. Competence ($p$) is derived from education and reason.
  *   **Hanson's Goal:** **Efficiency.** Futarchy views decision-making as an optimization problem. Competence is derived from financial incentives (skin in the game).

  Condorcet was an Enlightenment rationalist. He believed that through education and the proper application of probability, humans could discern the right path. He would view the idea that "truth is what the highest bidder says it is" as a moral and mathematical abdication.

  In his *Sketch for a Historical Picture of the Progress of the Human Mind*, Condorcet argues for the indefinite perfectibility of man through reason. Futarchy assumes humans are too irrational to vote on policies but rational enough to bet on them. Condorcet would find this inconsistent. If traders are rational enough to price policies correctly, voters (the same people) are rational enough to vote on them, provided the independence condition is met. If voters are too irrational to vote on policies, traders are too irrational (and corruptible) to bet on them.

  ### The Verdict

  Condorcet would condemn Futarchy.

  He would argue that **prediction markets violate the independence assumption** of his Jury Theorem, ensuring that the "beliefs" aggregated are correlated errors rather than independent signals. He would further argue that the **"vote on values" is subject to cycling majorities**, meaning the welfare function the market optimizes is mathematically unstable.

  He would propose instead a system of **epistemic democracy**: educated voters, secret ballots (to ensure independence), and perhaps a voting method that minimizes the probability of error (like his own ranked method), aiming to discover the objective public good rather than gambling on a subjective metric.

  **Final Answer:** Condorcet would vote **No**. He would classify Futarchy as a corruption of social mathematics that substitutes the *probability of truth* for the *price of speculation*.
