answer: |-
  Here is a rigorous defense of the resolute-choice position, structured for a grad seminar context. It is designed to directly address your colleague's "patching irrationalities" objection and to distinguish the mechanics of resolution from sophisticated choice in time-inconsistent cases.

  ***

  ### Title: Agency Over Atomism: A Defense of Resolute Choice Against the Money Pump

  **Thesis:** The money-pump argument against cyclic preferences relies on a tacit, controversial assumption: **Myopic Choice**. It assumes that rationality requires maximizing utility at every individual choice node in isolation. If we reject Myopic Choice in favor of **Resolute Choice** (following McClennen), we see that an agent can hold cyclic preferences without being pragmatically exploitable. Consequently, transitivity is not a necessary condition of practical rationality, but merely a condition of *myopic* agency.

  Here is the argument laid out in four steps.

  #### 1. The Money Pump Presupposes Myopic Choice
  The standard money-pump argument proceeds as follows:
  1.  Agent has cyclic preferences: $A \succ B$, $B \succ C$, $C \succ A$.
  2.  Agent starts with $C$.
  3.  Bookie offers trade $C \to A$ for fee $\epsilon$. Agent accepts (since $A \succ C$).
  4.  Bookie offers trade $A \to B$ for fee $\epsilon$. Agent accepts (since $B \succ A$).
  5.  Bookie offers trade $B \to C$ for fee $\epsilon$. Agent accepts (since $C \succ B$).
  6.  Agent is back at $C$, minus $3\epsilon$. Repeat until bankruptcy.

  The conclusion drawn is that cyclic preferences are irrational because they lead to sure loss.

  **The Flaw:** This conclusion only follows if we assume the agent evaluates each trade **myopically**. That is, at step 5, the agent considers only the choice between "Keep $B$" and "Get $C$ minus $\epsilon$." Because $C \succ B$, they trade.

  The money pump does not prove that cyclic preferences are irrational *simpliciter*; it proves that **Cyclic Preferences + Myopic Choice = Exploitation.** To save the rationality of cyclic preferences, we need only show that Myopic Choice is not the only rational mode of agency.

  #### 2. Resolute Choice as Plan-Based Agency
  Edward McClennen's *Rationality and Dynamic Choice* proposes **Resolute Choice**. On this view, the unit of rational assessment is not the *node*, but the *plan*.

  *   **Sophisticated Choice:** The agent anticipates future choices and selects a current strategy based on what they know they *will* choose later. (This fails in money pumps because the sophisticated agent knows they will accept the final trade, so they shouldn't have started the sequence. But if they don't start, they never get the potential gains of the cycle if it were costless. It leads to paralysis or suboptimal outcomes.)
  *   **Resolute Choice:** The agent selects an optimal plan at the outset and **commits** to executing it at future nodes, even if, at that future node, a local deviation appears preferable.

  **The Resolute Defense:**
  At $t_0$, the resolute agent considers the available *trajectories*:
  1.  **Stay:** End with $C$.
  2.  **Pump:** End with $C - n\epsilon$.
  3.  **Resolute Cycle:** Trade $C \to A$, Trade $A \to B$, **Refuse** $B \to C$. End with $B - 2\epsilon$.

  If the agent prefers $B$ to $C$ (which they do, since $B \succ C$), then trajectory 3 is preferable to trajectory 1, and obviously preferable to trajectory 2. The rational plan is to adopt Trajectory 3.

  When the agent arrives at the final node ($t_3$), holding $B$ and offered $C - \epsilon$, they do not ask, "Do I prefer $C$ or $B$?" They ask, "Do I prefer to **complete the plan** or **deviate**?"
  *   **Option Keep:** Complete Plan $\to$ Outcome $B - 2\epsilon$.
  *   **Option Trade:** Deviate from Plan $\to$ Outcome $C - 3\epsilon$ (and potentially enter the pump loop).

  Since the agent at $t_0$ determined that $B - 2\epsilon$ is the optimal outcome among feasible plans, the agent at $t_3$ chooses "Keep." They are not exploited.

  #### 3. Addressing the "Preference Change" Objection
  Your colleague's objection is the strongest counter-argument: *"If the agent prefers $C$ to $B$ ex hypothesi, but chooses $B$ at $t_3$, they are acting against their preference. Either they are irrational (akratic), or their preference has changed (conceding the cyclicality wasn't real)."*

  This objection relies on an **Atomistic Theory of Preference**. It assumes preferences are binary relations over goods ($A, B, C$) that remain context-invariant across time and choice structures. Resolute choice rejects this.

  **Argument Against Preference Change:**
  Declining the trade at $t_3$ does not require the preference $C \succ B$ to vanish or reverse. It requires recognizing that the **object of choice** at $t_3$ is not simply the good $C$ vs. the good $B$.

  In a dynamic choice context, the objects of choice are **actions embedded in a history**.
  *   At $t_3$, Option 1 is: *Possess $C$ as a result of deviating from a rational plan.*
  *   At $t_3$, Option 2 is: *Possess $B$ as a result of executing a rational plan.*

  The agent can maintain $C \succ B$ regarding the intrinsic goods, while simultaneously holding $Option_2 \succ Option_1$ regarding the available actions. Why? Because the agent values **Rational Agency** (or Plan-Compliance) as a constituent of the outcome.

  This is not a "change" in preference; it is a **contextualization** of preference. Just as I might prefer tea to coffee in the morning but coffee to tea in the evening without being inconsistent (because the context 'time of day' is part of the description of the good), the resolute agent prefers $C$ to $B$ *ceteris paribus*, but prefers "Being a Resolute Agent with $B$" to "Being a Myopic Agent with $C$."

  **Why this isn't a "Cheat":**
  Your colleague claims this patches one irrationality (cyclic preferences) with another (acting against current preference). This is only true if you define rationality as **Node-Local Maximization**. But that definition is question-begging in this context.

  If we define practical rationality instrumentally—as the effective pursuit of one's ends over time—then the agent who sticks to the plan is *more* rational than the one who maximizes locally and gets pumped. The "violation" of the local preference is not akrasia; it is the **enforcement of a higher-order constraint** (the plan) that the agent has reflectively endorsed. It is no more irrational than a dieter refusing a cake they currently crave: they haven't ceased to prefer the taste of the cake; they are prioritizing a global goal over a local impulse.

  #### 4. Distinction from Hyperbolic Discounting (Sophistication vs. Resolution)
  It is crucial to distinguish this from the standard treatment of time-inconsistency (e.g., hyperbolic discounting), as the mechanics differ significantly.

  *   **Hyperbolic Discounting (Time Inconsistency):**
      *   **Structure:** $Self_{t1}$ prefers Abstinence > Use. $Self_{t2}$ prefers Use > Abstinence.
      *   **Problem:** Genuine conflict between temporal selves.
      *   **Solution (Sophistication/Binding):** $Self_{t1}$ binds $Self_{t2}$ because $Self_{t1}$ knows $Self_{t2}$ is "corrupt." This treats the future self as a hostile agent to be constrained.
      *   **Metaphysics:** Fragmented agency.

  *   **Resolute Choice (Cyclic Preferences):**
      *   **Structure:** $Self_{t1}$ and $Self_{t2}$ share the same preference ordering ($A \succ B \succ C \succ A$). There is no *diachronic* conflict of taste.
      *   **Problem:** Conflict between *Local Evaluation* and *Global Evaluation*.
      *   **Solution (Resolution):** $Self_{t2}$ complies not because they are bound by $Self_{t1}$, but because $Self_{t2}$ **identifies** with the plan adopted by $Self_{t1}$.
      *   **Metaphysics:** Unified agency.

  In the hyperbolic case, if the bind is removed, the future self *defects*. In the resolute case, the agent *constitutes* themselves as a temporally extended entity. The rationality of resolution lies in the **continuity of agency**. To say the resolute chooser is irrational is to say that maintaining diachronic unity is irrational. But without diachronic unity, no long-term projects are possible. Therefore, the capacity for resolution is a *precondition* of rational agency, not a patch for incoherence.

  #### 5. Conclusion: Transitivity is Not Required
  If the resolute chooser avoids the money pump, they suffer no pragmatic deficit. The standard Dutch Book/Money Pump arguments for rationality constraints rely on the principle: **If a preference structure makes you susceptible to sure loss, it is irrational.**

  The resolute chooser demonstrates that:
  1.  Cyclic preferences do not *necessarily* lead to sure loss.
  2.  They only lead to sure loss when combined with Myopic Choice.
  3.  Myopic Choice is not a requirement of rationality (Resolute Choice is a viable, arguably superior alternative for temporally extended agents).

  Therefore, **Transitivity is not a requirement of practical rationality.** It is merely a requirement of *myopic* practical rationality. If we accept that agents can legitimately choose resolutely—prioritizing the success of a global plan over local preference satisfaction—then cyclic preferences are rationally permissible. They may be inconvenient, requiring more cognitive effort to manage via plans, but they are not formal defects of reason.

  ***

  ### Seminar Discussion Points (for your preparation)
  *   **The "Why not just change preferences?" objection:** If resoluteness is costly (requires willpower), why not just have transitive preferences? *Response:* Because the world may present genuinely cyclic values (e.g., aesthetic trade-offs where no linear ordering captures the value). Rationality is about navigating the world, not simplifying it.
  *   **The definition of Preference:** Be prepared to defend the claim that "Preference for Plan-Compliance" doesn't just trivialize the argument by making all preferences transitive over "plans." The claim is that the *intrinsic* goods are cyclic, but the *choice function* is sensitive to history.
  *   **McClennen vs. Gauthier:** You might mention Gauthier's *constrained maximization* as a parallel in moral theory, though McClennen is the specific decision-theoretic anchor here.

  This framework should give your students enough meat to chew on without conceding the standard dogma that transitivity is the bedrock of rationality.
