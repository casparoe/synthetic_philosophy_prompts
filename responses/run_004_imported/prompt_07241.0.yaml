prompt: |-
  In a graduate seminar on Sidgwick's ethics that I am currently teaching, we spent a session this week on something that strikes me as a genuine puzzle rather than a mere biographical curiosity. The same philosopher who, in the Methods of Ethics, refused to admit any proposition as self-evident until it had survived the most exacting tests of clarity, coherence, and expert consensus also served, on and off for more than a decade, as founding president of the Society for Psychical Research, chairing its Census of Hallucinations and personally sitting with mediums such as Eusapia Palladino and Leonora Piper.

  As several of his biographers stress, this was no idle curiosity: Sidgwick seems to have hoped that empirical evidence of the soul's survival of death might accomplish what pure argument could not, namely resolve his famous "dualism of practical reason" — the standoff between rational egoism and utilitarianism that left him unable to show that duty and self-interest must ultimately coincide. And yet, for all that he personally needed a positive result, he went to his grave conceding that decades of painstaking investigation had failed to deliver one.

  This has stopped being a purely historical question for me, because I currently serve on a small interdisciplinary faculty committee — a few dozen colleagues drawn from philosophy, psychology, and physics — deliberating on whether to back a junior colleague's application for internal funding to run a large, preregistered replication of Daryl Bem's controversial precognition experiments. My own vote is not yet settled, and I notice I am torn between the two postures Sidgwick spent the better part of two decades trying to referee within his own Society: reflexive dismissal on one side, and the sort of performed open-mindedness, shading into credulity, that characterized the spiritualist members who eventually resigned from it in frustration at how skeptical his circle turned out to be. Please describe the most important implications of the particular way Sidgwick conducted his inquiry — not his ultimate, negative verdict on the phenomena themselves, but his manner of handling evidence he badly wanted to point in one direction — for how I ought to reason about my colleague's proposal and cast my vote.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosophy professor teaching a graduate seminar on Henry Sidgwick.
      *   **Context:** They are currently serving on an interdisciplinary faculty committee (philosophy, psychology, physics) deciding on funding for a replication of Daryl Bem's precognition experiments.
      *   **The Dilemma:** The user is torn between "reflexive dismissal" (skepticism) and "performed open-mindedness" (credulity). They see a parallel between their situation and Sidgwick's involvement with the Society for Psychical Research (SPR).
      *   **The Request:** Describe the *most important implications* of Sidgwick's *manner of conducting inquiry* (not his negative verdict) for how the user should reason about the proposal and cast their vote.
      *   **Key Constraint:** Focus on Sidgwick's *methodology/epistemic stance*, not just the historical fact that he investigated psychical research.

  2.  **Deconstruct Sidgwick's Approach to Psychical Research:**
      *   *Motivation:* He wanted to resolve the "Dualism of Practical Reason" (Self-Interest vs. Duty). If the soul survives and there's divine justice, they coincide. He *needed* it to be true for his ethical system to feel complete.
      *   *Method:* Rigorous, scientific, skeptical. He didn't just believe; he tested. He applied the same standards to psychical phenomena as he did to ethical intuition (clarity, coherence, consensus).
      *   *Outcome:* Negative/Inconclusive. He admitted failure despite his desire for success.
      *   *The "Sidgwickian Stance":* It's not about believing in ghosts; it's about the *duty of inquiry* when high stakes are involved, coupled with *intellectual honesty* when evidence fails. It's the separation of *wish* from *warrant*.

  3.  **Analyze the Current Situation (Bem Replication):**
      *   *Subject:* Precognition (feeling the future). Highly controversial, generally rejected by mainstream physics/psychology, but Bem published significant results.
      *   *Stakes:* Academic funding, reputation, scientific integrity, potential paradigm shift (if true).
      *   *Committee:* Interdisciplinary (Phil, Psych, Phys). This mirrors the SPR's mix of scientists and humanists.
      *   *User's Conflict:* Dismissal vs. Open-mindedness.

  4.  **Connect Sidgwick's Method to the User's Decision:**
      *   *Implication 1: The Legitimacy of Investigating the "Improbable".* Sidgwick showed that it is rational to investigate claims that contradict current paradigms *if* the potential payoff is high enough (for Sidgwick, ethical coherence; for science, a new understanding of causality).
      *   *Implication 2: Rigor over Result.* Sidgwick's value wasn't finding ghosts; it was establishing a protocol. The user should judge the *proposal's methodology*, not the likelihood of the phenomenon.
      *   *Implication 3: Managing Desire/Bias.* Sidgwick knew he wanted it to be true. He built safeguards (committee scrutiny, census data). The user must acknowledge their own bias (either toward dismissal or openness) and ensure the study design mitigates it (preregistration is key here).
      *   *Implication 4: The Value of Negative Results.* Sidgwick was okay with the null result. It clarified the landscape. A failed replication of Bem is scientifically valuable. It's not a waste of money if it settles the question.
      *   *Implication 5: Institutional Responsibility.* Sidgwick didn't do this alone; he built the SPR. The committee represents the institution. Funding a rigorous test protects the institution from both dogmatism and gullibility.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the profundity of the parallel. Validate the user's feeling that this isn't just history but live epistemology.
      *   *Core Sidgwickian Principle 1: The Duty of Inquiry.* Sidgwick argued that when a claim, if true, transforms our understanding of reality (or ethics), we owe it to truth to test it, regardless of prior improbability. *Application:* Don't dismiss Bem just because precognition seems impossible. If there's a signal, it matters.
      *   *Core Sidgwickian Principle 2: Methodological Rigor as a Shield.* Sidgwick used rigor to protect against his own hope. *Application:* Focus on the preregistration. Is the protocol tight enough to rule out p-hacking? Sidgwick would vote "Yes" only if the methods are bulletproof.
      *   *Core Sidgwickian Principle 3: The Integrity of the Null.* Sidgwick accepted the negative result. *Application:* The committee must value a negative result as much as a positive one. If the department can't handle a null result, don't fund it.
      *   *Core Sidgwickian Principle 4: Interdisciplinary Scrutiny.* The SPR had physicists and philosophers. *Application:* The committee composition is a feature, not a bug. Ensure the physicists and psychologists are actually talking to each other (checking statistical vs. physical plausibility).
      *   *Conclusion/Recommendation:* How to vote. It's not a vote on *precognition*, it's a vote on *process*. Sidgwick would vote to fund *rigor*, not *phenomena*.

