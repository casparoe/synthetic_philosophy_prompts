      *   **The Setup:** An eccentric billionaire offers you $1 million if, at midnight tonight, you *intend* to drink a harmless but painful toxin tomorrow afternoon.
      *   **The Catch:** The money is deposited *before* you have to drink the toxin. You don't actually have to drink it to get the money; you just have to *intend* to drink it at midnight.
      *   **The Problem:** Once you have the money (tomorrow morning), do you have any reason to drink the toxin? No. It causes pain and provides no further benefit. Therefore, a rational agent knows they won't drink it.
      *   **The Philosophical Question:** Can a rational agent *intend* to do something they know they won't do?

