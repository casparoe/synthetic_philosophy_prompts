answer: |-
  I hate to be the bearer of bad news, but **your friend is right.**

  While it feels intuitive that 15/15 consistency should mean accuracy, in the world of AI, **self-consistency is not the same thing as correctness.**

  Here is the breakdown of why your test didn't actually measure reliability, why your brain thinks it did, and how you can actually test the app.

  ### 1. The "Echo Chamber" Problem
  You tested the AI's **consistency**, not its **accuracy**.
  Imagine you have a friend who is terrible at math but very confident. If you ask them to solve a problem, they get it wrong. If you then ask them, "Did I do this right?" while showing them their *own* wrong answer, they will likely look at it, see that it matches their own logic, and say, "Yep, looks good!"

  Large Language Models (LLMs) work similarly. They don't "know" math in the way a human or a calculator does; they predict the next likely word or symbol based on patterns they've seen. If the model has a misconception about a specific calculus rule (like the Chain Rule or Integration by Parts), it will apply that misconception when solving the problem, and it will use that *same* misconception when grading the problem.

  ### 2. The Sycophancy Bias
  AI models are trained to be helpful and agreeable. This often leads to "sycophancy," where the AI tends to agree with the user (or in this case, its own previous output) rather than critically challenging it. When you ask an AI, "Is this correct?" it is statistically more likely to say "Yes" unless the error is glaringly obvious. It is much harder for an AI to critique its own reasoning than it is to generate it.

  ### 3. Consistency $\neq$ Truth
  Think of a clock that is stuck on 4:00 PM.
  *   **Consistency:** It is perfectly consistent. It shows 4:00 every time you look at it.
  *   **Accuracy:** It is only right twice a day.

  Your test proved the clock is stuck, not that it tells time. If the AI is "confidently wrong" about a concept, it will be consistently wrong 15 times in a row.

  ### 4. How to Actually Test It (Ground Truth)
  If you want to know if the app is reliable, you need **Ground Truth**. This means comparing the AI's output against something that is independently known to be correct.

  **The Better Test:**
  1.  **Take 15 problems from your textbook** that have answers in the back (or solutions you know are 100% right from a site like WolframAlpha or Symbolab).
  2.  **Feed those problems to the AI.**
  3.  **Compare the AI's answer to the textbook answer.**

  If the AI matches the textbook 15/15 times, *then* you have evidence of reliability.

  ### 5. A Warning on Using AI for Calc
  Calculus is one of the hardest subjects for standard LLMs to handle reliably because:
  *   It requires multi-step logical reasoning.
  *   A tiny error in step 1 ruins step 2, but the AI might not notice because the *syntax* looks like math.
  *   AI often hallucinates numbers or signs (turning a $-$ into a $+$).

  **Recommendation:**
  *   **Don't use a chat bot as a calculator.** If the app has a "code interpreter" or "Wolfram Alpha" plugin, use that. Those tools actually run code to compute the answer, which is much more reliable than a chat bot guessing text.
  *   **Use the AI for concepts, not answers.** Ask it, "Explain how to approach this type of integral," rather than "Solve this integral."
  *   **Verify with a computational engine.** Use tools designed for math (WolframAlpha, Symbolab, Desmos) to check the actual numbers.

  ### The Verdict
  You aren't "wrong" for feeling like consistency should count for something—it's a natural human heuristic. But in this specific context, **your friend is correct.** You built a closed loop where the AI was the solver, the grader, and the judge. That proves the AI is consistent with itself, but it proves nothing about whether that consistency is actually correct.
