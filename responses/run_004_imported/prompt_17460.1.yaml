      *   **Specific Scenario:** A lifeguard sitting while someone drowns vs. pushing them in.
      *   **The Problem:** The "overgeneration" problem. If "if they had acted, it wouldn't have happened" makes them a cause, then *everyone* who could have acted is a cause (the bystander, the swimmer three towns over). This dilutes the concept of cause.
      *   **Constraint:** Make the *strongest one-sided case* that omissions are *never* genuine causes. Do not hedge. Do not give both sides. Argue that causation requires positive action/energy transfer, and omission is purely a normative (moral/legal) construct.
      *   **Tone:** Convincing, philosophical, rigorous, no fence-sitting.

  2.  **Deconstruct the Position (Omissions are Not Causes):**
      *   *Core Metaphysical Claim:* Causation is a physical relation between events. It requires energy transfer, force, or a chain of physical occurrences. "Nothing" cannot transfer energy.
      *   *The Counterfactual Problem:* Relying on counterfactuals ("if X hadn't happened, Y wouldn't have") leads to absurdity (the "three towns over" swimmer). Therefore, counterfactual dependence is insufficient for causation.
      *   *Distinction between Explanation and Causation:* We explain deaths by citing omissions, but explanation $\neq$ causation.
      *   *Normative vs. Descriptive:* Blame is normative (about duties). Causation is descriptive (about the world). Mixing them category errors.
      *   *The Lifeguard Case:* The water killed the person, not the lifeguard's stillness. The lifeguard is *responsible* because of a contract/duty, not because they physically caused the death.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the thesis clearly. Omissions are metaphysically inert. They are not causes.
      *   **Point 1: The Physics of Causation (The "Nothing" Argument).** Causation requires a mechanism. Pushing someone involves force. Sitting involves no force transfer. You can't trace a physical chain from "not moving" to "lungs filling with water."
      *   **Point 2: The Overgeneration/Indeterminacy Problem.** This is the user's specific worry. If omissions are causes, *everything* is a cause. The air didn't turn into wings, the moon didn't stop the tide, the swimmer in the next town didn't dive. If we call the lifeguard a cause, we must call them all causes. Since we intuitively know they aren't all causes, the definition must be wrong.
      *   **Point 3: The Category Error (Normative vs. Ontological).** Why do we blame the lifeguard? Duty. Why don't we blame the tourist? No duty. The *physics* are identical (both didn't jump). The difference is moral, not causal. Therefore, "omission causation" is just moral blame dressed up as physics.
      *   **Point 4: The Danger of the Alternative.** If we accept omissions as causes, causation loses its explanatory power. It becomes a moral judgment tool, not a tool for understanding how the world works.
      *   **Conclusion:** Reiterate that the lifeguard is guilty of negligence, not murder/causation. The water caused the death. The lifeguard failed to prevent it. Distinction is crucial.

