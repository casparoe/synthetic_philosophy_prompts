answer: |-
  Here is the strongest possible case for the position that omissions are never genuine causes, and that treating them as such is a category error that destroys the concept of causation.

  **The Thesis: Causation Requires Positive Existence**

  To claim that an omission is a cause is to claim that "nothing" can produce "something." This is metaphysically impossible. Causation is a physical relation between events in the world. For Event A to cause Event B, there must be a transfer of energy, force, or information from A to B. When a murderer pushes a victim into a pool, their muscles contract, force is applied to the victim's body, momentum is transferred, and the victim enters the water. There is a continuous, traceable physical chain from the brain of the killer to the lungs of the victim.

  When a lifeguard sits still while a victim drowns, there is no such chain. There is no energy transfer from the lifeguard to the victim. There is no force exerted. The lifeguard is physically inert regarding the victim. To say the lifeguard "caused" the death is to say that the *absence* of an action functioned as a physical force. But an absence is not a thing; it is the lack of a thing. You cannot build a physical model of the universe that includes "not-swimming" as a variable that exerts pressure on reality. The water caused the death. Gravity caused the sinking. Hypoxia caused the cessation of brain function. The lifeguard's stillness is merely the background context in which those physical causes operated, not a cause itself.

  **The Overgeneration Problem Proves the Concept is Broken**

  You identified the fatal flaw in the opposing view: the problem of indeterminacy. If we define causation counterfactually (i.e., "X is a cause if, had X occurred, Y would not have happened"), then causation explodes into meaninglessness.

  In the drowning scenario, the counterfactual condition is met by the lifeguard. But it is *also* met by the sunbather reading a book ten feet away. It is *also* met by the Olympic swimmer vacationing three towns over. It is *also* met by the manufacturer who didn't build a floating drone, or the government official who didn't allocate more budget for rescue helicopters.

  If omissions are causes, then the death was caused by the lifeguard, the sunbather, the swimmer, the manufacturer, and the politician equally. Their physical relationship to the death is identical: they all failed to intervene. If you argue the lifeguard is more of a cause because they were *closer*, you are no longer talking about physics; you are talking about *expectation*. If you argue the lifeguard is more of a cause because they were *paid*, you are talking about *contracts*.

  The fact that we have to import moral or legal criteria to distinguish the lifeguard from the swimmer three towns over proves that "causation" isn't doing the work. The physical reality is the same for both. Therefore, the distinction cannot be causal. If you accept omissions as causes, you must accept that every death is caused by billions of people who didn't prevent it. Since that renders the word "cause" useless for describing reality, the definition must be rejected.

  **The Category Error: Confusing Norms with Nature**

  The reason we feel the lifeguard "caused" the death is that we are conflating *ontological causation* (how the world works) with *normative responsibility* (how we judge people).

  We blame the lifeguard not because they physically killed the victim, but because they violated a duty. We do not blame the swimmer three towns over because they had no duty. Notice that the *duty* is the variable that changes, not the *physics*. Since the physics remain constant (both parties failed to act), the difference in judgment is entirely moral, not causal.

  When we say the lifeguard "caused" the death, we are using shorthand for "The lifeguard is the one we have decided to hold responsible for the death." This is a linguistic sleight of hand. It smuggles a moral judgment into a descriptive statement. We do this because it is socially useful. It allows us to punish negligence. But social utility does not change metaphysics. Just because it is useful to treat the lifeguard as a cause in a court of law does not mean they were a cause in the river.

  **The Danger of Accepting Omissions as Causes**

  If we accept omissions as genuine causes, we lose the ability to distinguish between killing and letting die, which is a distinction reality enforces even if morality sometimes blurs it.

  If I push you off a cliff, I introduce a new force into the system that alters your trajectory. If I watch you fall off a cliff, I allow existing forces (gravity) to take their course. These are fundamentally different descriptions of reality. If we label them both "causation," we lose the vocabulary to describe the difference between active intervention and passive observation.

  Furthermore, if omissions are causes, then every living thing is constantly causing millions of events. By not flying to Africa right now, you are causing a child to starve. By not inventing a cure for cancer today, you are causing cancer deaths. If you accept omissions as causes, you are not just a person living your life; you are a mass-murderer of everyone you failed to save. Since this conclusion is absurd, the premise—that omissions are causes—must be false.

  **Conclusion**

  The lifeguard did not cause the death. The water caused the death. The lifeguard is *culpable* for the death, but culpability is not causality. Culpability is a moral status assigned to agents who fail to meet obligations. Causality is a physical relation between events.

  The "problem" you encountered in your elective exists only because philosophers try to stretch the word "cause" to do the work of the word "blame." Once you snap that tether and admit that omissions are metaphysically inert, the paradox vanishes. The lifeguard and the swimmer three towns over are physically identical in relation to the victim: neither caused the death. The only difference is that society has decided to punish one and not the other. That is a feature of our legal system, not a feature of the universe. Omissions are never causes; they are only opportunities for blame.
