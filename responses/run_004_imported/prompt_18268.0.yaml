answer: |-
  Here are ten interview questions designed to probe the philosophical underpinnings of accuracy-first epistemology without getting bogged down in the technical proofs. Each includes a follow-up tailored to the standard defenses an accuracy-first proponent typically offers.

  ### 1. The "Legitimate" Measure
  You often defend the choice of scoring rules by noting that any "legitimate" measure—one that is continuous, truth-directed, and strictly proper—yields the same dominance results. But doesn't the definition of "legitimate" do all the heavy lifting here? If I propose a scoring rule that rewards boldness over caution, you'd exclude it as "improper." Isn't that exclusion just a way of smuggling probabilism in through the back door by defining away any measure that wouldn't produce your desired conclusion?

  *   **Follow-up:** *If she insists that strict propriety is mathematically necessary for the representation theorem:* "But why must rationality obey that specific theorem? If the math requires a constraint that rules out risk-averse belief states, does that suggest the math is the master rather than the servant of our epistemic intuitions?"

  ### 2. Epistemic Risk-Neutrality
  In decision theory, it is perfectly rational to be risk-averse; I might prefer a guaranteed modest gain over a gamble with a higher expected value. Yet the Brier score and similar measures seem to assume epistemic risk-neutrality by fiat—they treat the distance to the truth as linear. Why is risk-aversion rational when betting money, but irrational when betting on the truth?

  *   **Follow-up:** *If she argues that risk is a pragmatic concern, not an epistemic one:* "But if my cognitive survival depends on avoiding catastrophic error rather than maximizing average accuracy, isn't that 'pragmatic' need actually shaping what counts as a rational belief? Why is the epistemic norm insulated from the cost of being wrong?"

  ### 3. Immodesty and Disagreement
  A key result of this framework is "immodesty": a coherent credence function must rate itself as uniquely better than any alternative. If two rational agents, Alice and Bob, have different evidence and arrive at different credences, immodesty dictates that Alice must think Bob is less accurate than he could be, and vice versa. Does this turn rational disagreement into a standoff where learning from peers becomes impossible, since admitting their view has merit would violate my own coherence?

  *   **Follow-up:** *If she suggests that immodesty ensures stability and prevents self-sabotage:* "Stability is valuable, but science progresses through instability—through recognizing that a rival's framework might actually be more accurate. Does accuracy-first epistemology lack the resources to explain why a rational agent should ever tentatively adopt a rival's credence function?"

  ### 4. The Value of Trivial Truths
  Accuracy-first epistemology posits that the sole fundamental epistemic good is accuracy. But this seems to imply that believing a trillion trivial truths (like the number of grains of sand on a beach) is epistemically better than holding a few profound, explanatory falsehoods. Does your framework force us to accept that the "perfect" epistemic agent is one who hoards trivialities rather than one who understands the world?

  *   **Follow-up:** *If she argues that we can weight propositions by value:* "Once you introduce weights based on importance or explanatory power, aren't you moving away from pure 'accuracy' and toward a pragmatic or utility-based account of belief? At what point does 'weighted accuracy' just become 'usefulness' by another name?"

  ### 5. Logical Omniscience
  The accuracy-dominance arguments for probabilism typically assume logical omniscience—that agents know all the logical consequences of their beliefs. Real scientists and thinkers are not logically omniscient. If the norm of rationality is derived from a model that assumes impossible cognitive powers, does the resulting norm lose its grip on actual human reasoning?

  *   **Follow-up:** *If she replies that it is an idealization, like frictionless planes in physics:* "Frictionless models predict motion well enough to build bridges. Does the probabilistic idealization actually predict how humans *should* reason, or does it simply describe a state of being that is cognitively inaccessible, rendering the norm 'ought implies can' violated?"

  ### 6. Verisimilitude vs. Binary Accuracy
  The Brier score measures the distance between a credence and the truth value (0 or 1). But in science, some false theories are "closer" to the truth than others (verisimilitude). Newtonian physics is false, but more accurate than Aristotelian physics. Does a framework focused on minimizing inaccuracy scores capture this nuance, or does it treat all falsehoods as equally bad once the truth value is fixed?

  *   **Follow-up:** *If she claims that partitioning the possibility space handles this:* "But the choice of partition seems arbitrary. If I partition the space finely enough around Newtonian physics, I can game the score. Doesn't the reliance on a pre-selected partition mean the 'accuracy' is relative to our description, not the world itself?"

  ### 7. Pragmatic Encroachment
  There is a growing view called "pragmatic encroachment," which suggests that whether you know something (or are rational in believing it) depends on the stakes. If the cost of being wrong is death, you need more evidence than if the cost is minor embarrassment. Accuracy-first epistemology seems to reject this, holding that evidential support is invariant to stakes. Why should the threshold for rational belief ignore the consequences of error?

  *   **Follow-up:** *If she maintains that stakes affect action, not belief:* "But if I act on a belief that is 'epistemically rational' but 'pragmatically reckless,' and I suffer for it, doesn't that feedback loop suggest that rationality is a unified concept? Why carve off the epistemic piece if it can't survive contact with the pragmatic world?"

  ### 8. Diachronic Rigidity
  You derive Conditionalization as the rule for updating beliefs to minimize expected inaccuracy. But this assumes the agent doesn't forget and that their evidence is certain. In real science, data is retracted, and memories fade. If the accuracy argument breaks down when evidence is uncertain or lost, is Conditionalization a universal norm, or just a rule for idealized, non-forgetting agents?

  *   **Follow-up:** *If she concedes it applies to ideal agents but offers extensions for real ones:* "Do those extensions preserve the core 'accuracy-first' justification, or do they require importing external norms to patch the holes? If we need external norms to make it work for humans, is accuracy still the *foundation*?"

  ### 9. The Source of Normativity
  Let's step back from the math. Even if I grant that probabilistic credences minimize expected inaccuracy, why *should* I care? You've shown me that this is the most efficient way to hit a target, but you haven't told me why I'm playing the game. What is the source of the normative force that tells me I *ought* to minimize inaccuracy?

  *   **Follow-up:** *If she argues that accuracy is the constitutive aim of belief:* "Chess has a constitutive aim (checkmate), but I can play casually without trying to win. Can I not hold beliefs casually, or for comfort, without violating rationality? What makes the 'aim of truth' mandatory rather than optional?"

  ### 10. Scientific Practice
  Finally, look at working scientists. They don't calculate Brier scores; they use p-values, confidence intervals, and model selection criteria like AIC. If accuracy-first epistemology is the true foundation of scientific rationality, why does the practice of science look so different? Is your project descriptive of how science *should* work, or is it a philosophical reconstruction that science itself doesn't recognize?

  *   **Follow-up:** *If she says philosophy provides the justification for scientific tools:* "If the justification is that these tools approximate accuracy-minimization, can you point to a specific case where following the accuracy-first norm would have led a scientist to a different conclusion than standard statistical practice? If not, is the theory underdetermined by the practice?"
