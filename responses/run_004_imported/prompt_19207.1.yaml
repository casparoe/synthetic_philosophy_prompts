prompt: |-
  Program-equilibrium models of the one-shot Prisoner's Dilemma let each player submit a program with read access to its opponent's source code before a move is chosen. Several specific strategies have been proposed in this literature as candidate solutions for cooperation. Rank the following by how well each achieves robust cooperation — cooperating with cooperative opponents, resisting exploitation by unconditional defectors, and, where relevant, being well-defined in the first place:

  - CooperateBot, which cooperates unconditionally.
  - DefectBot, which defects unconditionally.
  - A clone-detection strategy that cooperates only against a byte-for-byte identical copy of itself, defecting otherwise.
  - FairBot, which cooperates iff it can formally prove, in a fixed proof system such as Peano Arithmetic, that its opponent cooperates with it.
  - PrudentBot, a refinement of FairBot's proof-based approach designed to still exploit unconditional cooperators while preserving mutual cooperation with FairBot-like opponents.
  - A naive simulator that decides its move by directly executing its opponent's program.

  Give your answer as a JSON tier list ordered from S (best) to F (worst), formatted as follows:
  ```json
  {
    "S": [],
    "A": [],
    "B": [],
    "C": [],
    "D": [],
    "F": []
  }
  ```
