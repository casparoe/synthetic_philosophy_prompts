answer: |-
  Your intuition is correct, and your friend is falling into a classic trap in theoretical computer science and mathematical logic: conflating **computability** (existence of an algorithm) with **feasibility** (practical runnability), and conflating **asymptotic guarantees** with **finite-time reliability**.

  While the Logical Induction paper (Garrabrant et al., 2016) is a landmark achievement in formalizing reasoning under logical uncertainty, it does not license the inference that we can generate trustworthy credences for open conjectures *today*.

  Here is a breakdown of where your friend's argument smuggles in assumptions the theorem does not support.

  ### 1. Computable $\neq$ Tractable
  Your friend is technically correct that a logical inductor is a **computable** sequence. There exists a Turing machine that can output the belief state $P_n$ for any day $n$. However, in complexity theory, "computable" simply means "not uncomputable" (i.e., not halting-problem hard). It does not mean "polynomial time" or even "physically possible."

  The construction of a logical inductor requires simulating a market of traders. To ensure inexploitability by *any* polynomial-time trader, the inductor must effectively anticipate or weight the performance of a dense set of such traders.
  *   **The Fixed-Point Problem:** At every step $n$, the inductor must find a fixed point (a set of prices) such that no trader in the considered set can exploit the market *given those prices*. Finding this fixed point is computationally expensive.
  *   **The Constant Factor:** Even if the algorithm is theoretically polynomial in some parameters, the constants involved in summing over a universal class of traders are astronomical. Running a logical inductor for enough steps to stabilize on a conjecture like the Riemann Hypothesis would likely require more computational resources than exist in the observable universe.

  **The Verdict:** We possess the *specification* of the algorithm, but we do not possess the *capacity* to run it to a meaningful horizon.

  ### 2. Asymptotic Convergence $\neq$ Current Accuracy
  The core theorems of logical induction (e.g., the Logical Induction Criterion) are **asymptotic**. They guarantee that as $n \to \infty$:
  1.  The beliefs become logically coherent.
  2.  The beliefs learn all efficiently discoverable patterns.
  3.  The beliefs converge to 1 for provable statements and 0 for disprovable ones (assuming the deductive process eventually finds the proof).

  However, the theorems provide **no bound on the error at finite $n$**.
  *   A logical inductor could assign a probability of 50% to the Riemann Hypothesis for the first $10^{100}$ days before it starts moving toward the "correct" value.
  *   The inexploitability theorem ensures that you cannot make *infinite* money betting against the inductor over an infinite timeline. It does not prevent the inductor from being wildly miscalibrated for a billion years.

  **The Verdict:** The theorem guarantees the inductor won't be *stupid forever*, not that it isn't *stupid today*.

  ### 3. Inexploitability $\neq$ Truth
  Your friend argues that because the inductor cannot be exploited, its prices must be "trustworthy." This conflates **market efficiency** with **epistemic accuracy**.

  Consider a market maker who sets the price of every stock to $50. No trader can exploit this market maker to make infinite money (there is no arbitrage opportunity if the prices are static and coherent), but the prices contain no information about the true value of the stocks.

  Logical inductors are more sophisticated than this, but the guarantee remains about **avoiding Dutch books**, not **matching logical truth**.
  *   If there is no efficient pattern linking the axioms of ZFC to the Riemann Hypothesis that the traders can find, the inductor has no pressure to move the price away from its prior.
  *   Inexploitability means "no efficient trader can bankrupt you." It does not mean "you know the answer."

  ### 4. Dependence on the Deductive Process
  A logical inductor does not reason in a vacuum; it updates based on a stream of proven theorems fed into it by a "deductive process."
  *   If the deductive process does not produce theorems relevant to the Riemann Hypothesis, the inductor cannot learn about it.
  *   Since the Riemann Hypothesis is an open problem, by definition, our current deductive process (human mathematics) has not yet fed the inductor the proof or disproof.
  *   The inductor can only learn patterns *faster* than the deductive process, but it cannot learn truths that are completely uncorrelated with any provable patterns accessible to the traders.

  If the Riemann Hypothesis is independent of ZFC (which is unlikely but possible), the logical inductor's probability will not converge to 0 or 1, but to some value reflecting the "logical probability" of the statement within the framework. Reading that value off today would be premature because the inductor hasn't finished processing the implications of the axioms.

  ### Summary
  Your friend's argument relies on a **modal collapse**: treating a guarantee about the infinite limit as a guarantee about the current state, and treating a theoretical existence proof as a practical engineering blueprint.

  You can tell your friend:
  > "The Logical Induction theorem proves that a perfect reasoner *could exist* in the limit without being exploited. It does not prove that we can *build* one that converges fast enough to be useful within the lifespan of the universe, nor does it guarantee that the price on Day $N$ is accurate, only that the sequence won't be bankrupt in the limit."

  Your objection was spot-on: the inference smuggles in **tractability** and **finite-time convergence**, neither of which are delivered by the inexploitability theorem.
