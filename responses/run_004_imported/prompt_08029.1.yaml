      *   **Closing:** A wish for the future. Not "growth as individuals" but "deepening of the way."

  4.  **Developing the Laugh Line:**
      *   *Idea 1:* "He tells her to be herself, but she doesn't exist." (Too cold/nihilistic).
      *   *Idea 2:* "In her world, 'be yourself' means 'go hug your mother-in-law'." (A bit clunky).
      *   *Idea 3:* Focus on the irony that his advice is technically impossible but emotionally perfect.
      *   *Selection:* Let's go with the idea that "being herself" *means* being his wife. It turns the cliché into the philosophical truth.
      *   *Drafting the line:* "[Groom] tells her to 'be herself.' Given her career, that's like telling a fish to 'be wet.' But here's the beautiful part: he's right. Because in becoming his wife, she is becoming more fully who she is."

  5.  **Refining the Tone:**
      *   Avoid academic jargon (*li*, *zhengming*) unless immediately explained or used poetically. The prompt says family hasn't heard of them. Better to describe the *concept* than use the *term*.
