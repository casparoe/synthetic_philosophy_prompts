answer: |-
  Good evening. For those who don't know me, I'm [Name]. I write about science and ideas, and I've had the privilege of knowing [Bride] for years. In fact, a few years ago, I wrote a profile about her work for a magazine.

  Writing that piece was a unique experience. Usually, when you interview someone for a wedding toast, you ask about their childhood, their hobbies, or how they met their partner. When I interviewed [Bride] for the magazine, we spent an hour debating whether the "self" actually exists.

  For the philosophers in the room, you know the school of thought [Bride] has dedicated her career to: Confucian role ethics. For the rest of the family, the elevator pitch is this: Most of us grow up thinking we are like billiard balls—solid, separate individuals who roll around and occasionally bump into each other to make friends or get married. [Bride]'s work argues that we aren't billiard balls at all. We are the collisions. We are the space between the balls. We are not people who *have* relationships; we *are* our relationships. You are a daughter, a sister, a friend, a colleague. Strip those away, and there is no "you" left underneath.

  Now, this creates a specific challenge for me standing here today. The standard advice in a wedding toast is to urge the couple to "never lose who you are as individuals." I literally cannot say that. It would be professionally irresponsible. It would be like telling a fish to "never forget to be dry."

  And this brings me to [Groom].

  [Groom], you are a wonderful man. You are kind, you are steady, and you make [Bride] happier than I have ever seen her. But you have also, on more than one occasion, lovingly told her that you just want her to "be herself."

  [Bride] finds this quietly hilarious. Given that her entire bibliography is built to dismantle the idea of a free-standing self, telling her to "be herself" is, technically, a metaphysical paradox. It's like telling a wave to "be water."

  But, I am going to side with [Groom] on this. Not because the philosophy is wrong, but because his intuition is deeper than the theory. Because in the view [Bride] studies, "being yourself" doesn't mean retreating into your own head to find some hidden core. It means fully inhabiting the roles you choose.

  So, [Bride], when he tells you to be yourself, he is actually saying: "Be the wife you are becoming. Be the partner this relationship requires." He is asking you to pour yourself into the vessel of this marriage until the vessel and the water are indistinguishable.

  And that brings me to the most important implication of [Bride]'s work for today. If we are our relationships, then marriage is not just a union of two people. It is a restructuring of reality for everyone in this room.

  To the parents and families here: In the Western view, you are gaining a son-in-law or a daughter-in-law as an addition to the family. In the view [Bride] champions, you are becoming constitutive of who they are. [Groom], you are not just marrying [Bride]; you are weaving yourself into the history of her family, and she into yours. The way you treat her parents, the way you honor their traditions, the way you show up for the cousins and the aunts—that isn't just "being nice." That is the literal material from which your new selves will be built.

  There is a concept in her field called *zhengming*, or the "rectification of names." It means that when you take on a title—Husband, Wife, Son, Daughter—you commit to living up to the weight of that word. It means the rituals matter. It means the Sunday phone calls matter. It means showing up for the hard dinners and the quiet Tuesdays, because those moments are not just things you *do*; they are who you *are*.

  So, I will not wish you a lifetime of "finding yourselves." You don't need to find anything. You are already here, in the eyes of the people looking at you right now.

  Instead, my wish for you is that your roles be rich. May you find profound meaning in the mundane rituals of your shared life. May you honor the families that made you by building a new home that welcomes them. And may you look at each other fifty years from now and realize that you cannot remember where one of you ends and the other begins.

  To [Bride] and [Groom].
