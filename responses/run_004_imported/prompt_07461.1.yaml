answer: |-
  **Setting:** *A university coffee shop, shortly after the graduate modal metaphysics seminar has let out. **Alex** (Transworld Identity theorist, Kripke/Plantinga leanings) and **Blake** (Counterpart Theorist, Lewisian realist) are lingering over cold brews.*

  **Alex:** I have to say, I still feel like Lewis just bulldozes the Humphrey objection rather than answering it. When Kripke says Humphrey doesn't care that some *other* guy in a distant universe won the election, he's pointing out a failure of *aboutness*. If I say "I could have won," I am making a claim about *me*. If your theory says I'm making a claim about a distinct concrete particular who merely resembles me, you've changed the subject.

  **Blake:** But that's the point, isn't it? You're assuming that the only way to make a claim about *you* in a modal context is to drag *you*—numerically identical you—into that context. Lewis isn't changing the subject; he's analyzing the logical form of the subject. When we say "Humphrey might have won," we aren't asserting a relation between Humphrey and a world; we're asserting that there exists a counterpart of Humphrey in a world who wins. The sentence is about Humphrey, but its truth conditions are cashed out via counterparts.

  **Alex:** Truth conditions aren't enough. There's a difference between truth conditions and truth *makers*. If the truth maker for "Humphrey might have won" is some other bloke, Fred, winning in World W2, then Humphrey's modal properties don't supervene on Humphrey. They supervene on Fred. That makes modality extrinsic to the individual. It means whether *I* could have been a philosopher depends on whether someone sufficiently like me exists elsewhere. That's absurd. If I were the only thing in existence, I'd still have modal properties.

  **Blake:** Not if you're a Lewisian. If you were the only thing in existence, there would be no other worlds, so you wouldn't have modal properties in that sense. But look, flip the script. Let's talk about Accidental Intrinsics. This is where your view hits the wall. You say I am numerically identical across worlds. So, in W1, I have five fingers. In W2, I have six. If *I* am literally in W1 and *I* am literally in W2, then *I* have five fingers and *I* have six fingers. That's a contradiction. You can't be bent and straight, five-fingered and six-fingered.

  **Alex:** That's the old "problem of temporary intrinsics" just dressed up in modal clothes. Plantinga and Kripke have answers. I don't instantiate "having five fingers" simpliciter. I instantiate "having five fingers-at-W1" and "having six fingers-at-W2." Properties are indexed to worlds. Or, to use the essence view: I have the property essentially of *being human*, but only accidentally *having five fingers*. There's no contradiction because the properties are had relative to a world.

  **Blake:** But that turns intrinsic properties into relations! "Bent" isn't a relation. If I say "This wire is bent," I'm not saying "This wire is bent-relative-to-something." I'm saying it has a shape. By making shape a relation to a world, you lose the intrinsic nature of shape. Lewis's point is that our pre-theoretic understanding of properties like shape, mass, and finger-count is that they are non-relational. Your theory saves transworld identity only by sacrificing the intrinsic nature of properties. My theory saves the intrinsic nature of properties by sacrificing transworld identity. Why is your trade-off better?

  **Alex:** Because preserving the intuition of *who* we are talking about is more fundamental than preserving a specific analysis of property instantiation. If I lose *me*, I've lost the anchor of the whole discussion. But let's press you on the mechanics of your alternative. The counterpart relation. It's based on similarity, right?

  **Blake:** Roughly, yes. Similarity in important respects, weighted by context.

  **Alex:** And similarity isn't transitive. A is similar to B, B is similar to C, but A might not be similar to C. And it's not one-to-one. I might have two equally good counterparts in another world. If Counterpart Theory is supposed to replace identity, it fails the logic of identity. Identity is necessary, transitive, and symmetric. If I have two counterparts, Hubert and Dubert, in W2, and Hubert wins while Dubert loses, did *I* win?

  **Blake:** Yes, in the sense that there is a counterpart of you who wins. And yes, there is a counterpart of you who loses. So it is true that you might win, and true that you might lose.

  **Alex:** But what if Hubert and Dubert are in the *same* world, and they interact? Say Hubert punches Dubert. Does that mean *I* punch *myself*?

  **Blake:** No. Because the counterpart relation is not identity. It doesn't obey Leibniz's Law. We don't say "You punch yourself." We say "A counterpart of you punches a counterpart of you." The logic of modal discourse is preserved, even if the ontology is different. The intransitivity is actually a feature, Alex. It explains modal sorites puzzles. How many cells can I lose and still be me? On your view, there must be a sharp cutoff for strict identity. On my view, it's vague because similarity is vague.

  **Alex:** Vagueness in the world is one thing; vagueness in *existence* is another. If it's vague whether I exist in a world, then it's vague whether propositions about me are true. But deeper than that: if the counterpart relation isn't transitive, you open the door to me being possibly something I essentially am not. Suppose I have a counterpart in W2 who is very much like me. That counterpart has a counterpart in W3 who is less like him, and so on, until W100 where the individual is a donkey. By your transitivity failure, the W100 donkey isn't my counterpart. But if we just step down the chain... surely *I* could have been a donkey?

  **Blake:** No, because "could have been" is cashed out by *direct* counterpart relations from the actual world. The donkey in W100 is not a counterpart of *you*. He's a counterpart of a counterpart. Modal logic S4 fails for counterparts, and Lewis is fine with that. It matches our intuitions. You don't think you could have been a donkey. You think you could have been a slightly different human. The chain stops where similarity stops.

  **Alex:** But that relies on context to fix the "similarity" metric. That makes de re modality radically context-dependent. If I say "Humphrey might have won," the truth value depends on how the conversational context weights "winning" vs. "being named Humphrey" vs. "being human." It makes modal claims unstable. On my view, with haecceities or individual essences, the truth is fixed. I have an essence that picks me out across worlds regardless of qualitative similarity. I could be a brain in a vat, qualitatively totally different, but still *me* because I instantiate my haecceity.

  **Blake:** Ah, the occult "thismess." Haecceities. You're positing a primitive, unanalyzable property that does nothing except bear the label "Alex." How do you know it? How do I identify it? It's a metaphysical peg to hang your intuition on. It explains nothing. It just says "I am me because I am me."

  **Alex:** It explains the *aboutness* that you can't capture! It explains why Humphrey cares. Humphrey cares because the possibility involves *his* haecceity being instantiated with the property of winning. It's not about qualitative resemblance. If we swap my essence with Napoleon's, *I* would be Napoleon. You can't make sense of that swap on Lewisian realism because worlds are causally isolated and individuals are world-bound. I can't "go" to another world.

  **Blake:** And I say that's a category mistake. Individuals don't "go" anywhere. When you imagine being Napoleon, you aren't literally projecting your substance into the past. You're imagining a world where a counterpart of you—who is qualitatively very different, perhaps, but plays the role you're focusing on—is Napoleon. But notice what you did there. To make your haecceity view work, you had to appeal to a "swap." But if you swap all qualitative properties, what's left? Just a bare particular.

  **Alex:** Not bare. It's the *origin*. Kripke's origin essentialism. I come from this sperm and egg. That's part of my essence. That grounds my identity across worlds without reducing me to a bundle of qualities.

  **Blake:** But why is *that* essential? Because it feels like it? Lewis offers a systematic ontology where modality is reduced to quantification over concrete worlds. You offer a system where modality is primitive and grounded in mysterious essences. My system is parsimonious regarding *kinds* of modality (it's all just quantification), even if it's extravagant regarding *worlds*. Your system is parsimonious regarding worlds (only one), but extravagant regarding *properties* (haecceities, world-indexed properties).

  **Alex:** Parsimony isn't just about counting entities; it's about preserving the phenomena. The phenomenon is that *I* am the subject of my modal properties. If I say "I might have been taller," I am not saying "Someone like me is taller." I am saying *I* am taller. Your theory requires me to believe that "I" refers to me here, but in the scope of the modal operator, "I" refers to someone else. That's a semantic schizophrenia.

  **Blake:** It's not schizophrenia; it's indexicality. "Actual" is indexical. To me, this world is actual. To my counterpart, his world is actual. When we evaluate "I might have been taller," we are looking at the set of worlds accessible from here. The "I" in the modal context picks out the individual in that world who stands in the counterpart relation to the speaker here. It's consistent.

  **Alex:** But it breaks the link between the subject and the fate. Let's go back to Humphrey. If Humphrey loses here, but his counterpart wins there, Humphrey still *lost*. He doesn't get the consolation prize of "Well, a guy like me won." If I am essentially identical across worlds, then in the world where I win, *I win*. That is a genuine success for me, even if I don't experience it here. It grounds the significance of modal claims.

  **Blake:** Significance is psychological. Truth is logical. You're conflating the two. You want transworld identity because it makes you feel like your possibilities are *yours*. But logically, you can't have incompatible intrinsics. I'm willing to give up the "feeling" of strict identity to save the logic of properties. You're willing to make properties relational and posit magical essences to save the "feeling" of identity.

  **Alex:** It's not just a feeling. It's the condition of moral responsibility and personal concern. If the guy in the other world isn't *me*, why should I care about his choices? If determinism is true in my world, but indeterminism is true in another, and my counterpart makes a different choice... on your view, *I* didn't make a different choice. He did. So I'm not responsible for the alternative.

  **Blake:** And on your view, if *you* literally exist in that other world and make a different choice, then *you* are a different person in a deep sense, because you have different causal histories and properties. You're trying to have it both ways: numerically one, but qualitatively different. I say the qualitative difference *constitutes* the numerical difference across worlds.

  **Alex:** So we're at the stalemate. You prioritize the coherence of property instantiation and systematic reduction. I prioritize the coherence of the subject and the intuition of de re modality.

  **Blake:** Basically. I think your "coherence of the subject" is an illusion generated by language. I think my "systematic reduction" is the only way to make sense of modal logic without primitive modality.

  **Alex:** And I think your "reduction" eliminates the very thing we're trying to explain. You've explained modality away, not explained it. You've given me truth conditions for modal sentences, but you haven't told me what makes *me* the subject of those sentences.

  **Blake:** And you've told me *who* is the subject, but you haven't told me how that subject can exist in two places with two shapes without violating the law of non-contradiction.

  **Alex:** *[Sighs]* Indexical properties.

  **Blake:** Relational shapes.

  **Alex:** Haecceities.

  **Blake:** Counterparts.

  **Blake:** *[Checks watch]* We're not going to solve this today.

  **Alex:** No. But at least we agree Humphrey lost.

  **Blake:** In this world, he did. In some other world, a guy who looks like him is smiling. And that's the best we get.

  **Alex:** It's not enough. But it's the only game in town besides yours.

  **Blake:** Cheers to that.
