answer: |-
  "Don't touch it, Elena."

  Elena's hand hovered over the trigger mechanism. The Geiger counter hummed, a quiet metronome counting down to a quantum event that would either release the poison or click harmlessly. "Relax, Marcus. We agree on the ontology. The wavefunction doesn't collapse. I don't die. Not from where I'm standing."

  "You don't die in *some* branches," Marcus snapped, stepping between her and the console. "But the Born rule isn't just a suggestion. The measure of the branches where you expire is ninety percent. If you treat branch weight as probability for decision theory—which Deutsch and Wallace argue you must—then you should act exactly as if you have a ninety percent chance of death. You're ignoring the measure."

  "Decision theory governs bets," Elena said, her voice steady. "It tells me how to wager on outcomes I'll observe. But here, there is only one outcome I *can* observe. In the branches where the poison releases, there is no Elena to observe anything. There is no experience of death. There is just cessation. So, conditional on there being a future experience at all, it is an experience of survival. My first-person anticipation isn't weighted by amplitude; it's weighted by existence."

  "That's a selection effect, not a prediction," Marcus countered. "Just because you can't observe your own death doesn't mean it isn't happening to you. Think about Sleeping Beauty. When she wakes up, she knows she's in an observing branch, but that doesn't tell her the coin was biased heads. You're conflating *post-hoc* certainty with *ex-ante* rationality. Before you pull that trigger, you should dread the high-weight branches."

  "Why?" Elena challenged. "Dread is for things I experience. If I pull this, the 'me' in the high-weight branches ceases. The 'me' in the low-weight branch continues. Since psychological continuity is what matters, I survive. It's not magic; it's indexical."

  "It's solipsism," Marcus shot back. "You're saying the multiverse could be filled with corpses of you, but because the living ones are the only ones talking, the corpses don't count. But they're you! If I care about my future selves, I should care about the measure of them. If I know that ninety percent of my successors will suffer a sudden termination, I should be terrified, even if the surviving ten percent feel lucky."

  Elena paused, her finger resting on the plastic cover. "This is where Parfit helps. If personal identity is just psychological continuity, then branching is fission. If I split into two, and one dies, do I fear death? Parfit says fission isn't death, but it's not standard survival either. But look at it from the inside. The branch where I die is a dead end. It's not a future me suffering; it's a null set. Why should I care about the measure of null sets?"

  "Because the null set includes the moment of termination!" Marcus insisted. "The fission happens *before* the death. For a split second, there are two Elenas. One is about to die. You are currently identical to her. If you wouldn't step in front of a bus in a single-world scenario because there's a ninety percent chance you die, why is this different? The only difference is that in one world, a corpse remains. In many worlds, many corpses remain. Does the existence of a living copy comfort the dying one? No. So why should it comfort you?"

  "Because I am not the dying one," Elena said softly. "I am the continuum of consciousness. The dying copy is a divergent path that terminates. I don't anticipate becoming her any more than I anticipate becoming a rock. The weight of the branch doesn't change the fact that my stream of consciousness only flows where there is a brain to support it."

  "That's begging the question," Marcus said, rubbing his temples. "You're assuming subjective probability tracks continuity rather than measure. But if you accept Everett, you have to accept that 'you' are the whole wavefunction sector. If most of that sector is dead, you are mostly dead. To act as if you're immortal is to deny the reality of the branches where you aren't."

  "I'm not denying them," Elena said, her hand tightening on the trigger. "I'm acknowledging that they contain no observers. From the inside, the Born rule disappears in suicide scenarios. It's not that I'm unlikely to die; it's that 'I' cannot be there to verify the death. So rationally, I should expect to see the click."

  "And if you're wrong?" Marcus asked, his voice dropping. "If subjective anticipation *does* track measure, then you're walking into a buzzsaw. You're betting your life on a specific interpretation of self-locating belief that half the department rejects."

  "And if I'm right," Elena said, meeting his eyes, "then you're watching me prove that death is a local phenomenon, not a global one. You're afraid because you're looking from the outside. You'll see branches where I die. I won't."

  "I'll see branches where you die," Marcus said, stepping back but not yielding. "And I'll know that those Elenas were just as real as the one who smiles afterward. That's not immortality, Elena. That's slaughter with a survivorship bias."

  "Then watch," she said. "And tell me which view feels real when the counter clicks."

  She lifted the cover. Marcus held his breath. The hum of the machine seemed to grow louder, filling the space between the branches neither of them could fully occupy.
