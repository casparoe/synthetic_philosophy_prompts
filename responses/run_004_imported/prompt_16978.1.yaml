answer: |-
  "It's the glue, Marcus. That's all it ever comes down to." Elena stirred her coffee, the spoon clinking against the ceramic. They were alone in the department lounge, the hum of the seminar next door fading into the background. "You present a fact: *a* instantiates *F*. You give me the particular, the universal, and the instantiation. But you haven't given me the *unity*. You've given me a list."

  Marcus leaned back, arms crossed. "This is Bradley's Regress, Elena. We know the script. If instantiation is a relation, it needs a further relation to tie it to *a* and *F*, and so on *ad infinitum*. But the contemporary consensus is that the regress is benign. It doesn't prevent the fact from existing; it just describes the ontological structure."

  "Benign?" Elena set the spoon down. "How can an infinite deferral of unity be benign? If the first step requires a second to connect the terms, and the second requires a third, the connection is never actually achieved. It's like promising to pay a debt by writing a check on an account that only exists if the check clears. You're saying the fact exists, but on your ontology, the conditions for its existence are never met. They're perpetually postponed."

  "You're assuming instantiation is a standard external relation," Marcus countered. "It's not. Following Frege, we can say properties are unsaturated. They have a gap. When an object fills that gap, no further glue is needed. The 'fit' is internal to the category of the universal. The regress stops because the demand for a further relation is a category mistake."

  Elena shook her head slowly. "Unsaturatedness. It's a powerful metaphor, Marcus, but is it metaphysics or just grammar? You're saying the universal *needs* an object. But why? If they are distinct ontological constituents, what compels them to combine? To say a property is 'gappy' is just to say 'it needs glue' without explaining how the glue sticks. You've relabeled the mystery. You've taken the problem of unity and hidden it inside the definition of a universal. That's not a solution; it's a verbal stopgap."

  "So what's your alternative?" Marcus asked, leaning forward. "Deny the constituents? If *a* and *F* aren't distinct, then everything is one. You're back with the Absolute. But tell me, why is an infinite regress here fatal when it's harmless elsewhere? Consider the truth regress. If *p* is true, then '*p* is true' is true. That goes on forever. We don't say reality collapses because of that. We accept it as an ontological free lunch. Why is the regress of relations any different?"

  "Because truth is propositional," Elena said sharply. "It's a semantic ascent. The regress of instantiation is ontological. It concerns the very existence of the complex. If the unity of the fact is never achieved, the fact doesn't exist. If the fact doesn't exist, there is no world, only a soup of unrelated terms. Your 'free lunch' is a meal that is never served."

  "But my ontology saves the phenomena," Marcus insisted. "We have distinct objects, distinct properties, and distinct truths. Your monism swallows them all. If the Absolute is the only reality, how do you account for the apparent distinction between you and me? Is it an illusion? If so, is the illusion itself real? If it is, you have a distinction between the Absolute and the illusion. If it isn't, then nothing we are saying matters."

  Elena sighed, looking out the window. "The distinction is phenomenal, not ultimate. Look, Marcus, I'm not saying the pluralistic world is an illusion in the sense that it doesn't appear. I'm saying it's incoherent as a fundamental description. You want distinct relata standing in external relations. I'm telling you that 'externality' is the problem. If *a* is truly independent of *R*, then *R* cannot affect *a*. If *R* affects *a*, then *a* is not independent. You can't have it both ways. You can't have independent atoms and genuine connection."

  "We don't need independent atoms in the strong sense," Marcus said. "We need distinct truthmakers. I can grant that *a* is modified by *F* without saying they are numerically identical. The regress argument assumes that for two things to be one, they must lose their twoness. But a fact is a 'one over many.' It's a single entity with constituent structure. The regress only arises if you treat the constituent structure as itself a set of further entities requiring combination. But structure isn't an entity; it's a mode of being."

  "And there it is," Elena said, pointing a finger. "'Mode of being.' Another magic phrase. You're positing a primitive unity to explain unity. You're saying, 'It just is unified.' But that's exactly what Bradley denied. He argued that if you can analyze it into constituents, you've destroyed the unity. If you can't analyze it, you can't speak of it. By invoking 'structure' as a primitive, you're asking us to accept a brute fact that contradicts the logic of relations you use everywhere else."

  "Maybe logic has limits," Marcus conceded. "But your Absolute has its own intelligibility problem. If reality is one undivided whole, how do we speak of it? To say 'The Absolute is real' is to predicate reality of the Absolute. That's a subject-predicate structure. That's a relation. You're using the very pluralistic logic you claim is incoherent to argue against it. You're sawing off the branch you're sitting on."

  "I'm using language pragmatically," Elena replied. "Language is designed for the phenomenal world, for navigation. It cuts reality into pieces because we need to act. But metaphysics isn't navigation; it's about what is ultimately coherent. If the price of coherence is admitting that our subject-predicate grammar doesn't map onto ultimate reality, I'll pay it. I'd rather admit language fails than accept an ontology where connection is impossible."

  "So we're at an impasse," Marcus said, picking up his notebook. "I accept a primitive unity of facts to save the distinctness of the world. You accept the inexpressibility of the ultimate to save the coherence of connection."

  "We're at an impasse because you think the regress is a technical glitch to be managed," Elena said, standing up. "And I think it's a symptom of a deeper disease in the ontology of plurality. You think I'm mystifying the world. I think you're fetishizing the parts."

  "And neither of us has a proof," Marcus smiled faintly. "Just intuitions about glue."

  "Exactly," Elena said. "And until someone explains how the glue sticks without more glue, I'm sticking with the Absolute."

  "Then I'll stick with the facts," Marcus replied. "Even if they're sticky."
