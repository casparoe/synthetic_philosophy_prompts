answer: |-
  "The problem isn't the math, Elias. It's your insistence that the driver has a self at the intersection." Mara swirled her whiskey, ice clinking against the glass. "Aumann's right. You optimize ex-ante. You commit to continuing with probability two-thirds. Done. The rest is metaphysical noise."

  Elias leaned forward, elbows on the sticky table. "Noise? It's the only thing that feels real. When the car slows down at the exit, the driver *is* there. He has to make a choice. If you ignore the belief state at the node, you're pretending the agent doesn't exist in the moment. Piccione and Rubinstein proved that if you demand action-optimality—where the choice makes sense *given* what he believes at the wheel—you get a different probability."

  "You get a paradox because you're forcing time-consistency on a guy who can't remember," Mara countered. "He can't update. If he changes his strategy at the first exit, he'll do the same at the second because he won't know he's at the second. So why bother calculating the conditional probability? It's planning-optimal or nothing. The ex-ante perspective swallows the interim one."

  "But that assumes the planning self owns the action self completely. It doesn't." Elias tapped his pen against a napkin. "Look, if I'm at the exit, I have to assign some probability $\alpha$ to being at the first one versus the second. That belief isn't arbitrary. It's constrained by my strategy. If I plan to continue with probability $q$, then consistency demands $\alpha = 1/(1+q)$. You can't just wave that away. If the action isn't optimal given *that* belief, the plan unravels. The driver wakes up, looks at the sign, and thinks, 'Wait, this doesn't maximize my payoff given where I think I am.'"

  "The driver doesn't think," Mara said sharply. "The driver is a mechanism executing a program. You're anthropomorphizing the node. AHP showed that once you treat the decision as a single choice of strategy rather than a sequence of beliefs, the contradiction vanishes. There's no paradox, just a constraint. You choose $q$ to maximize the total expected payoff from the start. What happens at the intersection is irrelevant because he can't deviate meaningfully."

  "Irrelevant to whom?" Elias asked. "To the planner? Sure. But the planner isn't the one driving. The guy at the wheel experiences the uncertainty. He feels the déjà vu. If your theory says his subjective probability doesn't matter, you're saying his experience is irrelevant to the rationality of the act. That's not decision theory, that's behaviorism."

  Mara sighed, taking a sip. "I'm saying rationality is about winning, not feeling consistent. If you stick to the planning-optimal path, you get the four payoff. If you try to reconcile your beliefs at the exit, you might talk yourself into exiting too early because you overestimate the likelihood of being at the first one. You're letting the confusion dictate the strategy."

  "And you're letting the strategy deny the confusion," Elias said. "But the confusion is the problem. If I can't tell if I've lived this afternoon before, telling me to 'optimize from the start' doesn't help. I'm already here. I'm at the exit. What do I believe?"

  Mara set her glass down. "You believe what keeps you on the road. Even if you don't know why."

  "Or," Elias murmured, looking into his own drink, "you believe you've already missed it."
