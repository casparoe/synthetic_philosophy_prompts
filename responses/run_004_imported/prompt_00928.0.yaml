answer: |-
  My editor called me into her office, holding my manuscript like it was a contaminated specimen.

  "Page 10," she said. "You swear the Battle of Hastings was 1066. You stand by this?"
  "Absolutely."
  "Page 45. You swear Napoleon lost at Waterloo. You stand by this?"
  "Firmly."
  "You do this for three hundred pages. Every fact verified. Every sentence you claim is true."
  "That's the standard."
  "Then why," she said, tapping the preface, "does this paragraph say, *'Despite my best efforts, some errors have undoubtedly slipped through'*?"

  "It's the Preface Paradox," I said. "It's rational to believe every individual claim based on the evidence, but also rational to believe the conjunction of all claims is false based on human fallibility."

  "It's contradictory," she said. "You can't believe the book is perfect and imperfect."

  "Watch me."

  I took a red pen, opened to page 142, and deleted a comma.

  "There," I said. "Now the preface is factually correct."

  "You intentionally typoed your own novel?"

  "No. I just ensured my humility wasn't the lie. Now I can honestly believe every sentence is true... except the one I broke to prove I'm humble."

  She stared at me. "So what do you put in the acknowledgments?"

  "Easy," I said. "I'd like to thank the missing comma on page 142. It's the only proposition in this book I know for a fact is false."
