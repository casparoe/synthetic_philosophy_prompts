          *   *Priority Cosmopsychist (PC):* Defends "top-down" cosmopsychism, argues decomposition is easier than composition.
      *   **Key Constraint:** They must press each other on weak points, not talk past one another. The PC *must* give a principled reason (not just intuition) for why decomposition is less mysterious than combination.
      *   **Tone:** Intellectual, rigorous, respectful, suitable for someone with a physics background (precision, structural analogies).

  2.  **Character Conceptions:**
      *   *Constitutive Micropsychist (CMP):* Let's call her "Elena." She needs to argue that emergence isn't magic, that phenomenal bonding is a natural relation, and that the unity of experience is a structural fact that can be built. She should challenge the PC on the coherence of "partial perspectives" within a whole.
      *   *Priority Cosmopsychist (PC):* Let's call him "Marcus." He needs to argue that the universe is the primary subject. His key task is the "principled reason" for decomposition being easier. He should lean on holism, quantum non-separability, or the nature of subjectivity itself (that subjects aren't additive).

  3.  **Drafting - Section by Section:**

