answer: |-
  This is a fantastic set of questions, and you are absolutely right to feel that the aphoristic style of *The Querist* obscures the ontological commitment Berkeley is making. It is easy to read these as mere policy suggestions (e.g., "we should use bank notes because we are short on specie"), but given your background in the *Principles* and *Three Dialogues*, your instinct to look for the metaphysical underpinning is correct. Your advisor is spot on: you cannot fully separate Berkeley's "active principles" metaphysics from his political economy.

  Here is a breakdown of how to read Query 37 (and its surrounding cluster), addressing the strength of the claim and the metaphysical continuity.

  ### 1. The Strength of Query 37: Functionalism vs. Pragmatism

  You ask whether Q37 is a strong nominalist/chartalist claim (material is *strictly* irrelevant) or a weaker pragmatic one (material matters for durability, etc.).

  **Verdict:** It is the stronger claim, but with a crucial epistemological caveat.

  Berkeley is attacking the Mercantilist confusion of the *sign* with the *thing signified*. In Mercantilist thought, gold/silver possess intrinsic value; accumulating them *is* increasing wealth. Berkeley is arguing that wealth is **power over labor** (Q37: "power to command the industry of others").

  *   **Ontological Claim:** Money is a "ticket or token." In Berkeley's metaphysics, a token is a sign. Signs do not need to resemble what they signify, nor do they need to share the same substance. (Think of his theory of language in *Alciphron*: words are signs that prompt action/expectation, not necessarily ideas).
  *   **The Material:** When he asks "whether it be of great consequence what materials the tickets are made of," he expects the answer "No." The value does not inhere in the substrate. If the substrate is gold, it is not because gold is magical, but because gold has historically been a reliable sign.
  *   **The Caveat (The "Will"):** Look back at Q33: *"Whether it be not the opinion or will of the people... that truly enricheth a nation?"*
      The material *does* matter, but only instrumentally, insofar as it sustains the **public opinion/will**. If the material is so fragile it disintegrates, or so common it loses scarcity, the "opinion" collapses, and the sign ceases to function. But this is a practical constraint on the *efficacy* of the sign, not a constituent of its *value*.

  So, for your econ reading group: Berkeley is arguing that money is a **social technology of credit**, not a commodity. He is effectively arguing that the "real" economy is the flow of labor/industry, and money is merely the accounting system. This is remarkably close to modern Chartalism (money as a creature of the state/social agreement) and Keynesianism (money as a link between present and future activity), though grounded in 18th-century moral philosophy.

  ### 2. Query 36 and the Metaphysical Analogy

  You asked if you are projecting metaphysics onto Q36 ("Provided the wheels move, whether it is not the same thing... be this done by the force of wind, or water, or animals?").

  **Verdict:** You are not projecting. This is deliberate philosophical work.

  In the *Principles*, Berkeley argues that matter is inert; only spirits (minds) are active causes. In *The Querist*, he applies this to economics.
  *   **The Machine:** The Economy.
  *   **The Effect:** Industry/Wealth (Motion).
  *   **The Force:** The Medium of Exchange (Gold, Paper, Credit).

  Berkeley's point is that the *cause* of the wealth is the Industry (the human will/activity), not the medium. The medium is just the transmission mechanism. Just as a mill doesn't care if the axle is turned by a horse or a stream, the economy doesn't care if the transaction is settled in guineas or bank notes, *provided the transaction occurs*.

  This echoes his theory of **arbitrary signification**. In the *Principles*, the connection between fire and heat is not necessary (intrinsic) but established by the Author of Nature. In *The Querist*, the connection between a piece of paper and a bushel of wheat is not necessary (intrinsic) but established by the "opinion or will of the people" (Q33).

  The analogy in Q36 is there to strip the "sacred" status away from gold. If you think gold is wealth, you are like someone thinking the *water* is the mill's work, rather than the turning of the wheel.

  ### 3. Contextualizing for Your Reading Group

  Since you are running this with econ history folks, it might help to frame Berkeley's intervention in *The Querist* against the specific Irish context of the 1730s-50s:

  1.  **Wood's Halfpence:** There was a massive controversy about copper coinage in Ireland. Berkeley was deeply involved. He saw that obsession with the *metal* of the coin was paralyzing trade.
  2.  **Absence of Specie:** Ireland was chronically short of gold/silver. The Mercantilist conclusion would be "Ireland is poor." Berkeley's conclusion (Q34, Q39) is "Ireland can be rich if we mobilize industry via credit, independent of specie."
  3.  **The National Bank:** Berkeley was a proponent of a national bank for Ireland. *The Querist* is essentially the philosophical prospectus for that bank. He is arguing that the bank notes *are* money (Q35) because they successfully command industry.

  ### 4. Synthesis: The "Whole Picture" of Nature

  Your advisor's point is vital. In the *Principles*, Berkeley wants to save science from atheism by making laws of nature into a "divine language." God speaks to us through sensory signs.
  In *The Querist*, he wants to save the Irish economy from poverty by making money into a "civil language." The state/bank speaks to the citizens through monetary signs.

  *   **Metaphysics:** Ideas are signs of God's will; we act on them.
  *   **Economics:** Money is a sign of Labor's power; we act on it.

  In both cases, fixating on the "material substrate" (Matter / Gold) is an idolatry that obscures the active principle (God/Spirit / Human Industry).

  **Recommendation for your reading:**
  Read Q37 as a **strong functionalist definition of money**. The material is irrelevant to the *definition* of money, though relevant to the *stability* of the system. The "ticket" is a linguistic entity, not a physical one.

  If you want to press the metaphysical link further for your own dissertation work, look at **Query 53** (in some editions): *"Whether the creating of wants be not the likeliest way to produce industry in a people?"* This ties back to the *Principles* notion that our desires and the satisfaction thereof are the mechanism by which we navigate the sign-system of the world.

  You aren't reading too much into it. *The Querist* is Berkeley doing applied semiotics.
