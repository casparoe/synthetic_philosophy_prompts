      *   *Allographic:* The notation matters. A perfect performance of a score is the work. A printed copy of *Moby Dick* is *Moby Dick*. (Music, Literature).
      *   *The NFT Twist:* NFTs attempt to make digital art (inherently allographic/copyable) behave like autographic art by attaching a unique token to the history of ownership.
      *   *The Skeptic's Counter:* The token proves ownership of the *receipt*, not the *art*. The art remains allographic.
      *   *The Defender's Counter:* In the digital age, the "receipt" *is* the provenance, and provenance *constitutes* the authenticity in a post-scarcity environment.

  3.  **Drafting - Section by Section:**

