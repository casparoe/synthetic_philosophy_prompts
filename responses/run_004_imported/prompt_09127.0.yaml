answer: |-
  The oil in the lamp had sunk low, casting the grinding lenses on the table into long, distorted shadows. Outside, the canal water lapped against the pilings, a rhythmic counterpoint to the silence that had settled between them.

  "The *Leviathan* is clear on this," the physician said, tapping the spine of the bound manuscript lying between them. His fingers were stained with ink and the faint yellow of turpentine. "To escape the state of nature, where every man is enemy to every man, we must surrender our right. All of it. To a Sovereign. A single will."

  "And I tell you, Pieter, that is a fiction," Spinoza replied. He sat with his hands folded, his eyes dark and weary. "You cannot surrender what you cannot cease to be. A man retains his power to act, even under a king. If the Sovereign commands a man to kill himself, does he not retain the right to refuse? Power is the limit of right. No contract can erase that."

  "Contracts are not about erasing power," the physician countered, leaning forward. "They are about binding it. Look at the Binnenhof, Baruch. Look at what happened in August. Was that not the multitude reclaiming its power? They tore the Grand Pensionary apart. They ate his liver. If that is the 'natural right' you defend, then God save us from nature. Hobbes saw it plainly: divide the sovereignty, and you divide the sword. If the States argue with the Prince, and the people argue with both, you do not have a commonwealth. You have a battlefield with walls."

  "I do not defend the mob," Spinoza said, his voice quiet but sharp. "What happened to Johan and Cornelis was a crime born of fear and superstition, fanned by men who profit from chaos. But do not mistake the disease for the cure. You say a single Sovereign prevents war. I say it merely hides the war inside the breast of the ruler. One man is subject to passions, to illness, to flatterers. If his mind falters, the state falters. If he is corrupt, the whole body rots."

  "Better one man should rot than the whole city burn," the physician snapped. "In a monarchy, the subject knows his place. He knows where the command comes from. In your 'democracy'—this pooling of right where the citizen remains part of the collective—you invite the very confusion that brought the French to our gates. The people are not philosophers, Baruch. They are beasts. When you tell them they hold a piece of the sovereignty, they do not hear 'responsibility.' They hear 'license.' They heard it when they hung Johan from the gallows."

  Spinoza reached for his wine, his hand trembling slightly before he steadied it. "The multitude is indeed volatile. I grant you this. But consider the geometry of it. In a monarchy, the state's reason is the reason of one man. It is a narrow point. It is easily broken, or easily turned against the people. In a democracy, the sovereignty is the sum of many minds. It is true, the mob is irrational. But it is harder to make a thousand men agree on an absurdity than to persuade one king. A large body is slower to move, yes, but it is also harder to corrupt. To bribe a court is simple. To bribe a nation is impossible."

  "The de Witts thought as you do," the physician said softly. "They thought reason would govern the regents, and the regents would govern the people. Now they are meat on the cobblestones. You speak of stability. I speak of survival. Hobbes teaches that we submit to the Sovereign not because he is good, but because he is necessary. Without that absolute surrender, we are back in the dark, cutting each other's throats over scripture or trade or pride. The summer proved that the people cannot hold the sword. They will only cut themselves."

  "And if the Sovereign turns the sword on the mind?" Spinoza asked. "You speak of survival as if it were merely the beating of a heart. But a man who cannot speak, who cannot think, who must beg permission to use his reason... is he alive? Or is he a puppet? The purpose of the state is not to dominate. It is to free men from fear so that they may live by the guidance of reason. If your Sovereign demands I silence my philosophy to keep the peace, he is not keeping peace. He is enforcing slavery. And a state of slaves is inherently unstable, for they obey only while they fear. The moment fear fades, they revolt."

  "Fear is a better guarantor than hope," the physician said, standing up and walking to the window. He looked out into the dark street. "You want a regime built on the freedom to think. I want a regime where I can walk to the market without seeing a body hanging from a post. You say the transfer of right is never complete. I say that is precisely the problem. The people believe they still hold the right. They believe they are the Sovereign. And so they act as judges and executioners in the street, because they recognize no higher power."

  "They act as executioners because they were taught by their rulers that reason is treason," Spinoza said. "Because the preachers told them the French invasion was God's punishment for the 'True Freedom.' You blame the multitude for the violence of the few who manipulated them. I tell you, Pieter, a democracy is the most natural regime precisely because it acknowledges the truth you try to legislate away: that no man can truly give up his power. In a democracy, we admit that the Sovereign *is* the multitude. We channel that power through laws, not through the whim of a Prince. It is difficult. It is dangerous. But it is the only way to build a state that does not rest on a lie."

  The physician turned from the window. The candlelight caught the deep lines around his mouth. "It is a beautiful geometry, Baruch. Truly. But geometry does not bleed. The House of Orange holds the sword now. The States have bowed. The mob has gone home, sated with blood and victory. Your 'natural regime' is a ghost. And I fear that if you try to summon it again, the ghosts of the de Witts will not be the only ones rising."

  Spinoza looked down at his hands, the calluses from the lens-grinding white in the dim light. "Perhaps. But if we accept that men are beasts, and that they must be ruled by a master to keep from eating one another... then we make them beasts. I will not concede that reason has no power in public life. Even if the cost is high."

  "The cost is paid in other people's blood," the physician said. He picked up his hat. "Sleep well, Baruch. Pray that the Prince sleeps well too. For if he wakes in a temper, there is no multitude to check him. Only the grave."

  "And if he wakes in a temper," Spinoza replied, not looking up, "then the grave will be the only place left for us all. There is no safety in chains, Pieter. Only silence."

  The physician paused at the door, his hand on the latch. "We shall see which breaks first. The iron, or the flesh."

  He stepped out into the night, closing the door against the damp air. Spinoza sat alone in the silence, listening to the water slap against the wood, waiting for the dawn that would bring another day of the *Rampjaar*.
