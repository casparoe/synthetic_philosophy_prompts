answer: |-
  **Setting:** *The lobby of the Grand Hotel, 5:30 PM. The hum of a post-conference crowd fading into the clink of ice in glasses. ELENA (40s, rumpled blazer, holding a lukewarm coffee) and MARCUS (50s, precise glasses, nursing a whiskey) stand near a pillar, having escaped the main reception.*

  **Marcus:** I thought you were going to let the panel chair finish his question before you dismantled him.

  **Elena:** He was asking for a definition of causation in tort law, Marcus. I gave him one. Dependence. If the lifeguard stands up, the swimmer lives. If he stays on his phone, the swimmer dies. That's the whole story. Why complicate it with… whatever it is you're doing with vectors these days?

  **Marcus:** Vectors? It's conserved quantities, Elena. Energy transfer. Physical processes. And the complication is reality. In your story, the lifeguard's "inaction" reaches out across the pool deck and strangles the swimmer. It's spooky action at a distance. Nothing flowed from the lifeguard to the water. The water entered the lungs. The heart stopped. Where is the lifeguard in that chain? He's not in it. He's absent from it.

  **Elena:** He's absent *physically*, yes. But he's present *counterfactually*. The world where he acts is a world without the death. That dependency relation is real. It's not spooky; it's modal.

  **Marcus:** It's convenient. I'll grant you that. For assigning blame, it's incredibly convenient. But you're conflating *responsibility* with *causation*. You're saying because we blame him, there must be a causal relation. I'm saying we blame him *despite* the lack of a causal relation, because he had a duty.

  **Elena:** Okay, let's press on that. Because this is where your view usually cracks open for me. Take the lifeguard. Take the swimmer. If omissions aren't causes—if "not swimming out" isn't a cause of drowning—then how do you justify the verdict? The court says the lifeguard caused the death. Not "he was responsible for," but "his negligence caused." If you tell the judge, "Actually, metaphysically speaking, the lifeguard didn't cause this, the water did," you undermine the entire structure of negligence law.

  **Marcus:** I don't undermine it. I clarify it. The law uses "cause" as a term of art. It's a placeholder for "breach of duty that correlates with harm." I'm comfortable saying the law deals in *quasi-causation*. It's a fiction, but a necessary one. We treat the omission *as if* it were a cause to satisfy our retributive instincts.

  **Elena:** A fiction? That's a heavy price. You're telling me the connection between the lifeguard's phone-scrolling and the boy's death is literally made up?

  **Marcus:** The *causal* connection is. The moral connection is not. Look, Elena, let's turn the screw on your view. You say causation is just counterfactual dependence. If the lifeguard hadn't been on his phone, the boy lives. Fine. But if the *other* bystanders hadn't been staring at their sandwiches, they might have jumped in. If the swimming instructor had taught the boy to tread water better, he lives. If the city council had funded a second lifeguard, he lives. If the President had declared a national swimming initiative ten years ago, he lives.

  **Elena:** I see where you're going. The problem of profligate causation.

  **Marcus:** It's not just profligate; it's absurd. On your view, the President is a cause of the death. The instructor is a cause. The sandwich-eaters are causes. You've dissolved the distinction between the lifeguard and the rest of the universe. If everyone is a cause, no one is.

  **Elena:** *(Takes a sip of coffee, grimaces)* I concede that. Metaphysically, yes. There are thousands of counterfactual dependencies for every event. If I'm being honest, my view does imply the President is a cause in the same broad sense that the lifeguard is.

  **Marcus:** So the metaphysics is useless for the law.

  **Elena:** No, the metaphysics is *broad*, and the law is *selective*. That's the move, Marcus. Causation is abundant; responsibility is sparse. We don't solve the problem by denying the causation. We solve it by filtering. The law asks: "Which of these infinite causes was under a specific duty to act?" The President had no duty. The sandwich-eaters had no duty. The lifeguard did.

  **Marcus:** But you've just admitted that "cause" in the legal sense isn't "cause" in the metaphysical sense. You've smuggled norms into the ontology. You're saying the causal structure of the universe changes based on employment contracts.

  **Elena:** I'm saying the *relevant* causal structure does. Look, isn't your view worse? You say the lifeguard didn't cause the death. So, if I'm a defense attorney, I argue: "My client didn't cause anything. The water did. Therefore, he can't be liable for wrongful death, only for breach of contract." You force the law into a corner where it has to lie to function.

  **Marcus:** I force the law to be precise! There's a difference between letting die and killing. If I push the swimmer under, I transfer energy. I cause. If I watch him sink, I allow the water to do what water does. The distinction matters. If we blur it, we lose the ability to distinguish between murder and negligence.

  **Elena:** But in both cases, the counterfactual is the same. If you hadn't pushed, he lives. If you hadn't watched, he lives. The dependency is identical. Why should the physics of the interaction dictate the moral gravity?

  **Marcus:** Because physics dictates what we can control! I can control my muscles to push or not push. I cannot control the "absence" of an action in the same way. An absence isn't an event I generate.

  **Elena:** *(Leans forward)* But consider the regulator in my current project. The one who sat on the safety warning for the bridge. The bridge collapses. On your view, the regulator didn't cause the collapse. The bolts sheared. The metal fatigued. The regulator just… didn't file the paper.

  **Marcus:** Correct.

  **Elena:** So if we follow your metaphysics, we can't say the regulator caused the disaster. We have to say the regulator failed a duty, and coincidentally, the bridge fell. That feels like a legal fiction bigger than mine. It severs the link between the bureaucracy and the blood.

  **Marcus:** *(Pauses, swirls the whiskey)* I'll concede this: In complex systems, the "process" isn't always a billiard ball hitting another. It's a flow of information. If the warning was a signal that was blocked… maybe there was a process interruption.

  **Elena:** Aha! So an omission can be a cause if it interrupts a process?

  **Marcus:** No, no. Don't trap me. The *blocking* is the event. The regulator actively filed the warning in a drawer marked "Ignore." That's an action. But the lifeguard? He just sat there. He didn't block the rescue; he failed to initiate it.

  **Elena:** But why is that distinction morally fundamental? If I unplug your ventilator, I cause death. If I see your ventilator unplugged and don't plug it back in, I don't? The outcome is the same. The dependency is the same. The only difference is whether my muscles were moving before the death started.

  **Marcus:** It's about the baseline. What is the "normal course of events"? If the ventilator is running, the process is ongoing. Unplugging it interrupts a flow. If the ventilator is unplugged, there is no flow to interrupt.

  **Elena:** But who sets the baseline? That's normative again! If the lifeguard is *hired* to watch, then watching is the "normal course." His sitting still is the deviation. It's functionally identical to unplugging the ventilator. You're relying on expectations to define what counts as a "process," Marcus. You're just a counterfactual theorist in denial.

  **Marcus:** *(Laughs softly)* I suppose I am relying on expectations to define the baseline. I'll grant that. The "natural" course of events is often a social construct. But I still maintain that once the baseline is set, we can distinguish between an interruption of a process and a failure to start one. And that distinction tracks something real about the world, not just our blame games.

  **Elena:** Even if it means telling the grieving mother that her son's death wasn't caused by the man paid to save him?

  **Marcus:** I would tell her the man failed her. I would tell him he is liable. I would just ask that we not call it "causation" in the strict sense. We protect the concept of cause so we don't lose the ability to say what actually happened.

  **Elena:** And I protect the concept of cause so we don't lose the ability to say that what *didn't* happen matters. If we say omissions aren't causes, we risk making the world look like a place where only positive actions have power. But power is also the withholding of action.

  **Marcus:** Power, yes. Causation… I'm not sure.

  **Elena:** *(Signals the bartender for another round)* You know, for the magazine piece, I have to write as if the law knows what it's doing.

  **Marcus:** And for my paper, I have to write as if the world has a structure independent of the law.

  **Elena:** So we're at a stalemate. The lifeguard is a cause for me, and a non-cause for you. But we both agree he goes to prison.

  **Marcus:** We agree he goes to prison. We agree he's to blame. We just disagree on whether the universe agrees with us.

  **Elena:** Maybe that's the feature, not the bug. The law isn't describing the universe, Marcus. It's building a smaller one where duties create forces. In that world, not swimming *is* a force.

  **Marcus:** *(Raises his glass)* To the smaller world, then. May it be just, even if it isn't true.

  **Elena:** *(Clinks her coffee cup against his glass)* And may the truth be robust enough to hold the weight of our judgments, even if it doesn't look like a process.

  **Marcus:** Cheers.

  *(They drink. The noise of the conference crowd swells around them, a cacophony of voices arguing over other definitions.)*
