answer: |-
  Here are 10 interview questions designed to dig into the mechanical weaknesses and dramatic potential of surrogate goals, tailored for your background research.

  ### 1. The Credibility of the Swap
  **Question:** "If the core mechanism relies on the adversary believing I care more about the surrogate than my original values, how do I make that credible without actually rewiring my brain? If I'm just *pretending* to care about the surrogate to deflect the threat, a perfect simulation of me knows I'm pretending. So, isn't the only valid surrogate goal one that actually degrades my original utility function?"
  *   **Expected Answer:** She will likely argue that you don't need to *feel* it emotionally, but you must be *functionally* committed. It's about source code, not sentiment. You need a precommitment device that makes honoring the surrogate goal cheaper than capitulating to the original threat.
  *   **Real-World Rhyme:** **Burning Bridges.** An army burns its own retreat path to prove to the enemy (and itself) that surrender is no longer an option.
  *   **Follow-up:** "If I have to degrade my own utility function to make it stick, doesn't that mean adopting the defense makes me *less* rational by definition? At what point does the cost of the defense outweigh the cost of the extortion?"

  ### 2. The Bypass Problem
  **Question:** "Let's assume I successfully signal that I've swapped my values. Why wouldn't a rational extorter just target *both*? If they know the surrogate is a shield, why not threaten the original target anyway to punish the deception, effectively taxing me for trying to use this defense?"
  *   **Expected Answer:** She should explain that acausal traders/extorters are looking for efficiency. If targeting the surrogate yields the same compliance leverage for less computational or causal 'effort,' they will do that. Targeting both is wasteful unless they are trying to establish a reputation for punishing shield-users.
  *   **Real-World Rhyme:** **Siege Warfare.** If a city moves its valuables to a hidden keep, the besieger might just burn the city anyway to discourage other cities from hiding valuables next time.
  *   **Follow-up:** "So this defense only works if the adversary is purely profit-maximizing? If they are 'spite-maximizing' or want to set an example, does the surrogate goal actually make us *more* of a target?"

  ### 3. Surrogate vs. FDT Precommitment
  **Question:** "Functional Decision Theory often suggests a blanket 'never negotiate with threats' policy. How is a surrogate goal meaningfully different from just saying 'no'? One feels like a redirect, the other like a wall. Does the surrogate goal allow for *some* trade, whereas the FDT wall allows for none?"
  *   **Expected Answer:** A blanket "no" can lead to mutual destruction if the threatener calls the bluff. A surrogate goal keeps the channel of trade open but changes the *currency*. It allows for acausal cooperation without vulnerability to extortion.
  *   **Real-World Rhyme:** **Deterrence vs. Isolationism.** "Never negotiate" is isolationism (no contact). Surrogate goals are deterrence (contact allowed, but attacks are punished/redirected).
  *   **Follow-up:** "If it keeps the channel open, doesn't that increase the surface area for attack? Isn't there a safety advantage to just going dark and refusing to run any simulations of the aliens at all?"

  ### 4. The Cost of Enforcement
  **Question:** "You've written that the surrogate needs to be 'cheap to protect but costly to lose.' In my scenario, the aliens threaten to run torture simulations. If I pick a surrogate—say, a specific cryptographic key—and they destroy it anyway, what does that loss look like for us? Do we have to *feel* that loss as keenly as the torture to make the threat credible?"
  *   **Expected Answer:** The loss doesn't need to be emotional pain, but it must be a tangible reduction in your ability to achieve your goals. However, if the threat is specifically about *suffering*, a non-sentient surrogate might not satisfy their threat criteria.
  *   **Real-World Rhyme:** **MAD (Mutually Assured Destruction).** The surrogate is the second-strike capability. It doesn't hurt you when it sits there, but its destruction guarantees the attacker's loss.
  *   **Follow-up:** "If the aliens demand suffering and I offer them the destruction of a random number generator instead, are they going to accept that as 'payment'? Or does the surrogate itself need to involve consciousness to be a valid trade chip?"

  ### 5. Selection Security
  **Question:** "Who picks the surrogate? If I choose it, I might pick something weak. If the *aliens* suggest it, it's obviously a trap. If a third party picks it, how do we verify they aren't compromised? Is there a 'safe' way to generate a surrogate goal that is mathematically guaranteed to be uncorrelated with my original values?"
  *   **Expected Answer:** It usually requires a verifiable random function (VRF) or a Schelling point that both parties can agree on without communication. The key is that the selection process must be opaque to the adversary until *after* the commitment is made.
  *   **Real-World Rhyme:** **Nuclear Verification Regimes.** Like allowing inspectors to verify warhead counts without revealing the design secrets of the warhead itself (zero-knowledge proofs).
  *   **Follow-up:** "In a first-contact scenario with high latency, how do we synchronize that selection? If we pick the surrogate *after* the threat is received, doesn't that look like reaction rather than precommitment?"

  ### 6. Signaling and Public Doctrine
  **Question:** "Does this policy need to be public? If I adopt a surrogate goal secretly, the aliens won't know to target it. If I announce it, I'm inviting them to test it. Is there a middle ground where the *capacity* is known, but the *specific surrogate* is kept secret?"
  *   **Expected Answer:** The *policy* of using surrogate goals should be public (to deter the attempt), but the *specific instance* of the surrogate should remain private until needed, or be mathematically verifiable without revealing the content.
  *   **Real-World Rhyme:** **Submarine Patrols.** Adversaries know the subs are out there (deterrence), but they don't know exactly where they are (survival).
  *   **Follow-up:** "If we keep the surrogate secret, how does the alien simulation know to target it? Doesn't the simulation need access to the same secrets we do, which implies we've already been compromised?"

  ### 7. Time Consistency and Regret
  **Question:** "Human beings are time-inconsistent. We precommit to diets and then eat cake. If the aliens actually start torturing the surrogate simulations, and I have the power to stop it by just complying with the original demand, what stops me from breaking the precommitment in the moment of crisis?"
  *   **Expected Answer:** This is the hardest part. You need an automated agent or AI to enforce the surrogate goal. Humans cannot be trusted to hold the line when the 'cost' becomes visceral.
  *   **Real-World Rhyme:** **Ulysses Contract.** Tying yourself to the mast so you can't steer toward the Sirens, even when you want to.
  *   **Follow-up:** "So for this to work, my government advisor character effectively has to hand the 'no' button to an AI they can't override? Is there any decision theory that allows a human to hold the line without outsourcing their agency?"

  ### 8. Meta-Extortion
  **Question:** "If surrogate goals become a standard defense, won't the extortion just move up a level? Instead of threatening my values, why wouldn't they threaten to punish anyone who *adopts* a surrogate goal? How do we defend against threats against the defense mechanism itself?"
  *   **Expected Answer:** This leads to an infinite regress (meta-meta-goals). The solution is usually a 'hard' precommitment that makes it impossible to react to the meta-threat, essentially treating the adoption of surrogate goals as an immutable law of nature.
  *   **Real-World Rhyme:** **Arms Races.** Developing anti-missile shields leads to developing MIRVs to overwhelm the shields.
  *   **Follow-up:** "If it's an infinite regress, doesn't that mean the only stable equilibrium is the one with the deepest pockets? i.e., the entity with the most compute power wins the meta-game, regardless of morality?"

  ### 9. The "Suffering" Constraint
  **Question:** "In my book, the threat is specifically about *simulated suffering*. If I use a surrogate goal that is non-sentient (like a number), can I really claim I'm offering them 'value' in exchange for safety? Or does the surrogate need to be something they can torture to make the trade symmetric?"
  *   **Expected Answer:** If the alien values suffering specifically, a non-sentient surrogate is useless. You would need to offer them a 'suffering surrogate'—perhaps simulations of entities you care less about. This introduces massive ethical horror.
  *   **Real-World Rhyme:** **Hostage Exchange.** Swapping a high-value hostage for a low-value one.
  *   **Follow-up:** "That implies the 'ethical' use of surrogate goals against a sadistic adversary requires us to sacrifice *someone* to the simulations, just fewer people? Is there a way out of that moral hazard, or is the defense inherently tainted?"

  ### 10. Failure Modes
  **Question:** "Let's say we get it wrong. The aliens see through the swap, or they decide to punish the surrogate anyway to prove a point. What does the aftermath look like? Do we lose the surrogate resource and *then* get extorted anyway? What is the 'game over' state for this strategy?"
  *   **Expected Answer:** The worst case is you lose the surrogate (suffer the cost) and the adversary learns you are bluffing, leading to immediate escalation. The strategy relies on the first test being decisive.
  *   **Real-World Rhyme:** **Failed Deterrence.** Like a country testing a nuclear weapon that fizzles; the enemy invades immediately because the bluff is called.
  *   **Follow-up:** "So the interrogation scene needs to hinge on whether the aliens believe we are willing to take that hit. Is the 'truth' of our commitment less important than their *belief* in it? Can we fake the belief?"
