prompt: |-
  I teach a seminar on moral uncertainty and effective altruism, and honestly its kind of my fault my younger brother Theo ended up this deep into EA -- I wouldn't shut up about it at family dinners for a decade. He's marrying his partner Ada next month and I got roped into giving the toast. The two of them argue constantly about cause prioritization (he thinks animal welfare is the priority, she thinks that's basically a rounding error next to global health and x-risk) and they've never once resolved it by argument -- instead they've basically run the relationship on moral trade: he went vegan and gives to animal charities because it matters to her and costs him little, she gives alot of her salary to global health for the same reason in reverse. Our EA friends in the crowd will clock the 'moral trade' bit immediately; everyone else is just family who'll hear 'trade' and picture a business deal. Write me something like 4-5 minutes that uses this to say something true about building a life with someone whose values you don't fully share, without it coming out sounding like a lecture on cause prioritization or like their marriage is a transaction instead of a partnership.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Older sibling of the groom (Theo).
      *   **Context:** Wedding toast for Theo and Ada.
      *   **Audience:** Mix of EA (Effective Altruism) friends/family and non-EA family/friends.
      *   **Key Dynamic:** Theo and Ada constantly argue about cause prioritization (Animal Welfare vs. Global Health/X-Risk).
      *   **Resolution Mechanism:** "Moral Trade" (Theo goes vegan for Ada, Ada donates to global health for Theo).
      *   **Goal:** Acknowledge the EA context without alienating non-EA guests. Avoid sounding like a lecture on cause prioritization. Avoid making the marriage sound transactional. Highlight the deeper truth about building a life with different values.
      *   **Tone:** Warm, humorous, sincere, insightful.
      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Challenge:**
      *   *The "EA Jargon" Trap:* Terms like "cause prioritization," "moral trade," "x-risk," and "rounding error" will confuse half the room and make the other half feel like they're at a conference, not a wedding.
      *   *The "Transaction" Trap:* Describing their relationship as a trade could sound cold ("I'll do this if you do that"). Needs to be reframed as *compromise*, *respect*, and *shared commitment to doing good*, even if the *how* differs.
      *   *The "Lecture" Trap:* The speaker admits to lecturing at family dinners. The toast must *not* be a lecture. It needs to be a story.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the speaker's history (the "lecturing brother"). Set a light, self-deprecating tone. Introduce Theo and Ada.
      *   **The Conflict (The "EA" bit):** Describe their disagreements without using heavy jargon. Frame it as "how to make the world better." Mention the specific causes (animals vs. people/future) but keep it relatable.
      *   **The Resolution (The "Trade" bit):** This is the tricky part. Explain the "trade" not as a business deal but as an act of love. *Key insight:* It's not about the utility calculus; it's about valuing the other person's conscience.
      *   **The Universal Lesson:** Translate the EA concept into general relationship advice. What does this mean for the non-EA guests? It's about supporting each other's passions even when you don't fully get them.
      *   **Closing:** A wish for their future. A toast.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi, I'm the brother. I talked too much about EA. Theo got infected. He met Ada. They fight about charities. He likes cows, she likes humans. They made a deal. He eats tofu, she gives money. Some people call this moral trade. But I call it love. It shows they care more about each other than being right. So raise a glass.

      *Critique 1:* Too dry. Sounds a bit transactional. Needs more warmth and better translation of the EA concepts for the normies.

  5.  **Drafting - Iteration 2 (Adding Flesh & Tone):**
      Start with the family dinners. I wouldn't shut up. Theo listened too well. Then he met Ada. They agree on the goal: make the world better. They disagree on the method. It's like planning a trip but arguing on the route. But here's the magic. They don't force the other to change. Theo went vegan for her. She donates to his causes for him. In my seminar, we call this moral trade. But today, let's call it compromise. It's about saying "your values matter to me."

      *Critique 2:* Better. But need to ensure the "moral trade" term doesn't sound cold to the non-EA crowd. Need to emphasize the *sacrifice* and the *support*.

  6.  **Refining the "Moral Trade" Concept:**
      Instead of saying "they run the relationship on moral trade," say "economists might call this trade, but I call it listening." Or, "It looks like a transaction on paper, but in practice, it's the opposite."
      *Idea:* Focus on the *cost*. It costs Theo something to be vegan. It costs Ada money to donate. They absorb the cost for the other person. That's love.

  7.  **Finalizing the Speech Structure (incorporating the constraints):**
      *   *Intro:* Confession about the dinners.
      *   *Middle:* The disagreement (Animals vs. Humans/Future). The solution (The "Deal").
      *   *Pivot:* Reframing the "Deal" for the non-EA crowd. It's not business; it's respect.
      *   *Conclusion:* Wish for the future. Toast.

  8.  **Writing the Content (incorporating word count and timing):**
      *   *Self-Correction during writing:* Make sure not to use "x-risk" or "rounding error." Use "future generations" or "big picture." Make sure the veganism point lands as a lifestyle change, not just a diet.
      *   *Tone Check:* Is it too academic? Keep sentences punchier. Add a joke about the food at the wedding (is it vegan?).

  9.  **Final Polish:** Check the timing. 4-5 minutes is roughly 600-750 words. Ensure the transition from "EA jargon" to "universal truth" is smooth. (The resulting draft in the main response follows this structure.)

  10. **Post-Draft Review:** Does it meet the "no lecture" constraint? Yes, by framing the lecture as the *problem* the speaker caused, and the marriage as the *solution* to that kind of thinking. Does it avoid the "transactional" feel? Yes, by emphasizing that the "trade" is actually an expression of care.

  *(Self-Correction Note: Make sure to explicitly mention that the speaker teaches the seminar, as per the prompt, but use it to humble themselves.)*

  11. **Final Word Count Check:** Aiming for ~700 words.

