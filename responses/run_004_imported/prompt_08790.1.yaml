answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. And I need to start with a confession.

  For about a decade, I wouldn't shut up at family dinners. I teach a seminar on moral philosophy, and I spent years explaining to anyone trapped within earshot how to calculate the maximum amount of good you can do with your life. I talked about metrics, and outcomes, and prioritization.

  Honestly, it's kind of my fault Theo is this deep into this world. I wouldn't shut up, and he was listening. But then he met Ada. And while I taught Theo how to analyze values, Ada taught him something much more important: how to live with someone who analyzes them differently.

  If you know Theo and Ada, you know they are deeply committed to making the world better. But if you've ever sat at a table with them, you also know they argue. Constantly.

  Theo believes the most urgent thing we can do is spare animals from suffering. Ada believes the most urgent thing is to protect human lives and secure the future of humanity. In my academic circles, we call this a "cause prioritization conflict." In normal people terms, it means they never agree on where the money should go.

  For a long time, I waited for one of them to win the argument. I waited for Theo to convince Ada that animal welfare is the priority, or for Ada to convince Theo that it's a rounding error compared to global health.

  But they never resolved it. Because they realized something I forgot to mention in all those lectures: In a marriage, being right is less important than being together.

  So, they stopped trying to convert each other and started supporting each other.

  Theo went vegan. Now, for those who know Theo, you know he loves a good steak. That change wasn't easy. He did it because it matters to Ada. And Ada, in turn, directs a significant part of her giving to the causes Theo cares about, even though her own calculus tells her to spend it elsewhere. She does it because it matters to him.

  Now, some of my EA friends in the back are nodding right now. They recognize this. In theory, we call this "moral trade." It sounds technical. It sounds like a business deal. "I'll scratch your back if you scratch my cause area."

  But to the rest of the family, who might hear "trade" and think of a transaction, I want to be clear about what this actually is.

  A transaction is when you exchange value because you want something. What Theo and Ada are doing is exchanging *sacrifice* because they value *each other*.

  It is easy to support a partner when you agree with them. It is easy to say "I love you" when their vision of the future looks exactly like yours. But it is a profound act of love to look at your partner, disagree with their fundamental calculus, and say, "Your conscience matters to me more than my own correctness."

  They aren't running a business. They are building a life where neither of them has to walk alone. Theo doesn't have to carry the weight of the animals by himself. Ada doesn't have to carry the weight of the future by herself. They share the load, even when the packages are different sizes.

  I spent years lecturing about how to optimize the world. But watching them, I've learned that optimizing a relationship isn't about finding the single best path. It's about walking two paths side-by-side, and occasionally carrying the other person's bag when it gets heavy.

  Theo, Ada: You have already proven that you can navigate disagreement without resentment. You have proven that love is not about finding a mirror image of yourself, but about making space for a different kind of good.

  My wish for you is that your home is always a place where you don't have to justify your heart to one another. May you continue to compromise not out of duty, but out of curiosity. May you always find that the world is big enough for both your causes. And may you never, ever try to calculate the utility of this wedding cake—just eat it.

  Please raise your glasses.

  To Theo and Ada. To the trade-offs that bind us, and the love that makes them worth it.
