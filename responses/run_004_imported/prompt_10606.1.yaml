      *   **Context:** The user served as a judge for a debut novel prize.
      *   **The Conflict:** A disagreement with a co-judge.
          *   *Co-judge's view (Anti-Realism/Institutionalism):* The prize *makes* the book the best. There is no independent fact of the matter. Merit is constituted by the verdict/judgment.
          *   *User's view (Realism/Objectivism):* There is genuine excellence "already present in the prose." The judges are *tracking* something real, not creating it.
