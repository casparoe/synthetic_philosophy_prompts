answer: |-
  Good evening, everyone. For those who don't know me, I'm the bride's brother. I also co-own a hardware store with my best friend. After twelve years of deciding which saw blades to stock and when to open on holidays, I started wondering why a decision we make "as the store" feels different than two decisions we just happen to agree on personally.

  That curiosity led me to read about what philosophers call "joint commitment." Specifically, the work of Margaret Gilbert. Now, don't worry—this isn't a lecture. But Gilbert argues that when two people truly commit together, they become a single "we." And that "we" comes with specific rules.

  The first rule is that the commitment holds even on the days the feeling behind it doesn't. In my store, there are mornings I don't feel like opening the shutters. But I do it, because I'm not acting for myself; I'm acting for *us*.

  The second rule is the one that matters most for a marriage. Gilbert says that once you jointly commit, you give each other the standing to hold the other accountable. You aren't just disappointed if your partner drifts away; you have the *right* to call them back. You are authorized to say, "Hey, this isn't what we decided."

  And here is the part the philosophers in the room will appreciate, though everyone else should hear it just as clearly: a joint commitment does not allow for **unilateral rescission.**

  To the rest of my family, that just means you cannot quit on your own. You cannot decide the marriage is over without your partner's agreement. The bond persists until you both agree to dissolve it. It is a lock that requires two keys to open.

  [Sister's Name] and [Fiancé's Name], my wish for you isn't that you always feel the rush of tonight. Feelings are weather; they change. My wish is that you build the structure Gilbert describes. A structure where you are bound together not just by affection, but by a shared authority over each other's lives. A structure where, when one of you is tired or lost, the other has the full right to step in and say, "I've got us. We keep going."

  That security is what allows love to actually grow. Because you know the other person isn't there just because they feel like it today, but because they *cannot* leave the "we" behind.

  So, if everyone could please raise a glass.

  To the bride and groom: May your "we" be stronger than any "I." May you always have the standing to call each other home. And may there never be any question of unilateral rescission.

  To [Sister] and [Fiancé]!
