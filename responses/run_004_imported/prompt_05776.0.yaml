answer: |-
  Your partner is absolutely right, and it is impressive that you're grappling with this level of metaphysical machinery mid-draft. This is the "dispositional analysis" problem that kept philosophers busy from the 1970s through the 90s (mostly David Lewis, C.B. Martin, and Sungho Choi).

  The reason you can't get a gut handle on the difference is that, in ordinary language, "something stopping it from working" sounds the same whether it's a fink or a mask. But in the logic of dispositions, the **location of the interference** changes everything.

  Here is the structural difference, the reason Lewis's patch works on one but not the other, and how to write it for Reyes.

  ### 1. The Setup: The "Causal Basis"
  To understand the fix, you have to understand what Lewis was trying to save.
  *   **Simple View:** A glass is fragile if: *If struck, it breaks.*
  *   **The Problem:** Sometimes the "If/Then" is wrong, even if the glass is definitely fragile.
  *   **Lewis's Patch:** A glass is fragile if it has an **intrinsic physical structure (the Basis)** such that: *If struck **AND that structure remains intact**, it breaks.*

  Think of the **Causal Basis** as the **Engine**.
  Think of the **Manifestation** as the **Car Moving**.
  Think of the **Stimulus** as **Turning the Key**.

  ### 2. The Fink: The Vanishing Engine
  A "fink" is an interference that targets the **Basis** itself. It makes the intrinsic property vanish (or appear) exactly when the stimulus happens.

  *   **The Scenario:** You have a car with a working engine (Basis). You turn the key (Stimulus). But there is a gremlin (the Fink) wired to the ignition. The millisecond you turn the key, the gremlin rips the engine out of the car.
  *   **The Result:** You turn the key, the engine is gone, the car does not move.
  *   **The False Conclusion:** "If turned, it moves" is false. So, by the Simple View, the car *wasn't* disposed to move. But that's wrong! It had a working engine.
  *   **Why Lewis Fixes It:** Lewis adds the clause: *"If turned **AND the engine stays put**."*
      *   By forcing us to imagine the engine staying put, we effectively tell the gremlin to sit down and shut up. We isolate the car's intrinsic nature from the external interference.
      *   If the engine stays, the car moves. The analysis is saved. The car *is* disposed to move.

  **For Your Novel (The "Fake-Out"):**
  You want a scene where Reyes *acts* brave, but isn't. This is a **Reverse Fink** (a finkish lack of disposition).
  *   **The Logic:** Reyes lacks the "engine" of courage. But the moment the danger hits (Stimulus), something external temporarily installs an engine (adrenaline, ignorance, a specific training trigger) that vanishes the second the action is done.
  *   **How to Write It:** The action must feel **discontinuous**.
      *   *Scene:* Reyes pulls a victim from a crevasse during a quake. It looks heroic.
      *   *The Finkish Tell:* In the aftermath, the "engine" is gone. She isn't just shaken; she is baffled by her own action. She doesn't feel brave; she feels like she was piloted. If you put her in the same situation five minutes later, she freezes. The "courage" was a temporary gadget hooked up to her ignition, not part of the car.
      *   *Key Phrase for your head:* **The trait was borrowed, not owned.**

  ### 3. The Mask: The Blocked Transmission
  A "mask" is an interference that leaves the **Basis** alone but blocks the **pathway** to the result.

  *   **The Scenario:** You have a car with a working engine (Basis). You turn the key (Stimulus). The engine runs perfectly. *However*, the parking brake is jammed on, or the transmission is disconnected (the Mask).
  *   **The Result:** You turn the key, the engine runs, but the car does not move.
  *   **The False Conclusion:** "If turned, it moves" is false. So, by the Simple View, the car *wasn't* disposed to move.
  *   **Why Lewis Fails It:** Lewis says: *"If turned **AND the engine stays put**."*
      *   In the mask case, the engine *does* stay put! The mask doesn't touch the engine.
      *   So we run the test: Engine is there. Key is turned. **But the brake is still on.** The car *still* doesn't move.
      *   Lewis's conditional is *still false*. His patch requires the basis to remain, but it doesn't require the *path* to be clear. It cannot distinguish between "no engine" and "engine with locked brakes."

  **For Your Novel (The "Freeze"):**
  You want the flashback where Reyes freezes, but you want the reader to suspect she *is* brave (Masked Disposition).
  *   **The Logic:** Reyes has the "engine" of courage (the neural basis). The danger hits (Stimulus). But something external (hypoxia, a specific sound frequency, a drug, a traumatic trigger) locks the transmission.
  *   **How to Write It:** The action must feel **friction-heavy**.
      *   *Scene:* The storm rescue. Reyes freezes.
      *   *The Masked Tell:* Do not write her as feeling *fear*. Fear implies the courage is gone. Write her as feeling the *command to move* but being physically unable to execute it. Her mind is screaming "Go," her muscles are ready, but the signal doesn't land.
      *   *Key Phrase for your head:* **The will was present, the output was jammed.**

  ### 4. Summary of the Mechanical Difference

  | Feature | **Fink (The Fake-Out)** | **Mask (The Smothering)** |
  | :--- | :--- | :--- |
  | **Target** | Attacks the **Basis** (The Engine). | Attacks the **Process** (The Transmission). |
  | **Timing** | Changes the object's nature *during* the stimulus. | Interferes with the result *after* the basis activates. |
  | **Lewis's Patch** | **Works.** By holding the Basis fixed, you remove the Fink. | **Fails.** Holding the Basis fixed doesn't remove the Blocker. |
  | **Reyes Scene** | She acts brave, but the "bravery" vanishes instantly after. | She acts cowardly, but her internal will was brave. |
  | **Reader Clue** | **Discontinuity:** "Why did I do that?" | **Friction:** "I couldn't make my body move." |

  ### 5. Why This Matters for Your Draft
  Understanding this distinction lets you control the reader's hindsight.

  If you write the **Freeze Scene** as a **Mask**:
  *   Don't have her think, *"I was too scared to move."* (That removes the basis).
  *   Have her think, *"I knew exactly what to grab, I willed my hand to reach, but the cold had severed the wire."*
  *   **Philosophical Payoff:** The courage was intrinsic (hers), the failure was extrinsic (the storm/physiology). She is still brave, just masked.

  If you write the **Heroic Scene** as a **Fink**:
  *   Don't have her feel a surge of noble duty.
  *   Have her act on a kind of autopilot that she doesn't recognize as herself. Later, show that she is terrified of returning to that spot.
  *   **Philosophical Payoff:** The action was real, but the disposition was not. She isn't brave; she was temporarily "wired" to look brave.

  Your partner is right: Lewis fixes the Fink by demanding the *intrinsic* property stay constant. But he can't fix the Mask because the Mask is *extrinsic*—it's not part of the object, so holding the object constant doesn't make the Mask go away.

  Use that. Make the Freeze about **external jamming** (Mask), and make the False Bravery about **temporary internal substitution** (Fink). That is the structural heart of the distinction.
