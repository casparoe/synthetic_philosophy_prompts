  2.  **Initial Brainstorming & Key Insights:**
      *   *Why does evidence stop accumulating?* Because people stop using their private signals. Once the public history is strong enough, the rational move is to ignore your own eyes/ears and follow the crowd. If you ignore your private signal, your action reveals *nothing* about that signal to the next person.
      *   *The "Fragility":* Since actions after the cascade starts reveal no new private information, the public belief doesn't actually update based on the *number* of people. It stays stuck at the belief level when the cascade started. Therefore, a new *actual* signal (public info) carries more weight than the silent actions of the herd.
