answer: |-
  This is one of the most satisfying "aha!" moments in game theory because the intuition you're fighting—that 300 people should mean more than 3—is actually correct in almost every other context. It fails here specifically because of **how** rational agents process information when they can't see each other's minds.

  The gears-level mechanism hinges on a single distinction: **The difference between an Action and a Signal.**

  Here is the step-by-step breakdown of why the evidence stops accumulating, why the agents aren't irrational, and why the result is so brittle.

  ### 1. The Setup (The Rules of the Game)
  To see the gears, we need to look at the wiring.
  *   **The Truth:** There is a hidden state of the world, either **Good** or **Bad**.
  *   **The Signal:** Each person gets a private hint (a "signal") about the truth. It's noisy. Say it's correct 55% of the time.
  *   **The Goal:** Each person wants to choose the option that matches the Truth. They are rational Bayesians.
  *   **The Constraint:** You can see the **Actions** (Adopt/Reject) of everyone before you, but you cannot see their **Signals** (what they privately heard/saw).

  ### 2. The Mechanism: Where the Information Dies
  Let's watch the first few people arrive.

  **Person 1:**
  *   Sees no history.
  *   Looks at private signal. Signal says "Good."
  *   **Action:** Adopts.
  *   *Informational Content:* High. We know Person 1 saw "Good."

  **Person 2:**
  *   Sees Person 1 Adopted.
  *   Looks at private signal. Signal says "Good."
  *   **Action:** Adopts.
  *   *Informational Content:* High. We know Person 2 saw "Good."

  **Person 3 (The Tipping Point):**
  *   Sees History: (Adopt, Adopt).
  *   Looks at private signal. Signal says **"Bad."**
  *   **The Calculation:** Person 3 thinks: "Person 1 and 2 likely saw 'Good' signals. That's two votes for Good. I only have one vote for Bad. Even though my signal says Bad, the weight of the public history outweighs my private information. The rational move is to Adopt."
  *   **Action:** Adopts.
  *   *Informational Content:* **ZERO.**

  **Here is the gear that grinds:**
  Person 4 arrives. They see (Adopt, Adopt, Adopt).
  Person 4 is also a rational Bayesian. They reason: "Person 1 and 2 acted on their signals. But Person 3? Person 3 would have Adopted *even if* their signal was Bad. Therefore, Person 3's action tells me **nothing** about what signal Person 3 received."

  Person 4 effectively ignores Person 3. To Person 4, the informational state is identical to Person 3's situation. Person 4 will also ignore their own private signal if it contradicts the crowd.

  **The Cascade is Locked.**
  From Person 3 onward, **Actions are decoupled from Signals.**
  *   People are still making choices.
  *   But those choices are no longer *transmitting* data.
  *   They are just echoing the data from Persons 1 and 2.

  ### 3. Why 300 People $\neq$ 300 Signals
  Your intuition says: "300 people choosing A is strong evidence."
  The model says: "300 people choosing A is evidence equivalent to the first 2 people choosing A."

  Why? Because evidence accumulation requires **independent draws**.
  *   Persons 1 and 2 provided independent draws.
  *   Persons 3 through 300 did **not** provide independent draws. They provided *dependent* outputs based on the first two draws.

  Once the cascade starts, the public belief **freezes**. It does not continue to update toward 100% certainty. It stays stuck at the probability level required to make Person 3 ignore their signal (e.g., maybe 60% confidence).

  The crowd isn't marching toward certainty; they are marching in place.

  ### 4. Why This Isn't Irrationality
  This is the part that feels like a "mistake," but it's actually optimal behavior for the individual.

  If you are Person 300, and you see 299 people Adopt, and your private signal says Reject:
  *   **Option A (Follow Crowd):** You have a >50% chance of being right (based on the frozen public belief).
  *   **Option B (Follow Signal):** You have a <50% chance of being right (because you are betting your single noisy signal against the accumulated weight of the first few people).

  A rational Bayesian maximizes their own probability of being correct. You *must* ignore your signal. If you followed your signal, you would be acting irrationally regarding your own payoff.

  **The Tragedy:** The "mistake" is not cognitive; it is structural. It is an **informational externality**.
  *   Person 3 cares about being right.
  *   Person 3 does *not* care about informing Person 4.
  *   By conforming, Person 3 maximizes their own utility but destroys information for everyone downstream.
  *   Since no one is paid to "reveal truth" and only paid to "be right," everyone hides their private info once the crowd gets thick enough.

  ### 5. Why It Is So Fragile
  Now we get to your specific question about fragility.

  If the public belief freezes at, say, 60% confidence after Person 3, it stays at 60% confidence after Person 300.
  *   The crowd looks massive.
  *   But the *justification* for the crowd is still just the signals of Person 1 and 2.

  **The "One Piece of Public Info" Scenario:**
  Imagine a news report comes out (Public Info) that is slightly more reliable than a private signal.
  *   The Crowd's Weight: Equivalent to ~2 private signals (frozen).
  *   The News Report Weight: Equivalent to ~3 private signals.

  Because the cascade stopped accumulating weight, the 300 people do not crush the new information. The new information is heavier than the *actual evidence* supporting the cascade. The scale flips instantly.

  It feels like the 300 people were "worth nothing." In a sense, they were. They were 298 mirrors reflecting the first 2 people. If you smash the first 2 mirrors (or add weight to the other side of the scale), the reflection vanishes.

  ### Summary of the Gears
  1.  **Rational Ignoring:** Once public history is strong enough, rational agents *must* ignore private signals to maximize accuracy.
  2.  **Signal Decoupling:** When agents ignore signals, their actions stop revealing information.
  3.  **Frozen Belief:** Public belief stops updating. It caps out at a finite level (e.g., 60%), it does not go to 100%.
  4.  **Fragility:** Because the belief is capped (not infinite), any new *public* information that exceeds that cap will shatter the cascade, regardless of how many people are standing in it.

  The cascade isn't a wall of brick (300 independent signals); it's a house of cards built on 2 bricks, with 298 people standing behind it pretending to hold it up. When the wind blows (public info), the 298 people step aside instantly because they were never actually holding the weight.
