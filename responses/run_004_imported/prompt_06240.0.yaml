answer: |-
  This is an exceptionally sharp reconstruction of a debate that sits right at the boundary of decision theory and moral philosophy. You have correctly identified the structural tension between **dynamic consistency** (avoiding the pump) and **preference completeness** (having a fact of the matter about value).

  Here is my assessment of the disanalogy, the precision of your distinctions, and whether your friend can successfully block the money pump without surrendering the core intuition of incompleteness.

  ### 1. Precision Check: Naive, Sophisticated, and Resolute
  Your recollection is largely accurate, but there is a crucial nuance regarding Hammond that affects the argument.

  *   **Naive:** The agent believes their future self will act according to their current preferences. They get pumped because they fail to anticipate their own future deviations.
  *   **Sophisticated (Hammond/Strotz):** The agent uses backward induction. They anticipate what their future self *will* do (maximize locally) and restrict their current choices to avoid nodes that lead to bad outcomes. **Crucially:** Hammond generally argues that sophisticated choice, combined with consequentialism, *entails* standard rationality axioms (including transitivity and often completeness). Hammond is often cited by those who think incompleteness is irrational, not by those trying to save it.
  *   **Resolute (McClennen):** The agent commits to a plan at the root and follows it at subsequent nodes, *even if* local maximization would suggest deviating. This requires a theory of agency where plans have normative force independent of local preference maximization.

  **Correction:** Your friend is arguing for **Resolute Choice (McClennen)**, not Sophisticated Choice. A sophisticated agent facing incompleteness might find the decision tree underdetermined (if the future choice is not mandated by preference, the present choice cannot rely on it). Only a *resolute* agent can bind themselves to a path where preferences are silent.

  ### 2. Does the Disanalogy Hold Up?
  **Yes, your disanalogy is robust.** You have put your finger on the exact friction point in the literature.

  *   **In the Intransitivity Case:** At the crucial node, there is a **conflict**. The local preference says "Switch," but the plan says "Stay." Resoluteness functions as a **suppressor**. It overrides a specific, existing motivational force. The rationality of the plan is vindicated because it prevents a sure loss that the local preference would cause.
  *   **In the Incompleteness Case:** At the crucial node, there is a **gap**. The local preference says nothing (neither "Switch" nor "Stay" is mandated; both are permissible). Resoluteness functions as a **specifier**. It does not override a preference; it selects one permissible option and treats it as mandatory for the sake of the plan.

  **Why this matters:** In the intransitive case, the agent knows *why* they are deviating from the plan (because they locally prefer the alternative). In the incomplete case, the agent has no local reason to deviate, but also no local reason to stay. The "stickiness" of the plan must do all the work.

  ### 3. Is It "Smuggling Completeness"?
  This is the core of your objection: *If the plan determines the choice where preferences do not, haven't we just completed the preferences?*

  There are two ways to answer this, one favoring you and one favoring your friend.

  #### The Argument for You (The "Shmecompleteness" Charge)
  If rationality requires that every choice be grounded in a comparative judgment of betterness, then your friend is indeed smuggling. If she chooses City over Country solely because "that was the plan," she is effectively treating City as *better than* Country in the context of the decision tree.
  *   **The Vulnerability:** If the policy is "Always stick with the status quo unless strictly better," she has introduced a **Status Quo Bias**. This completes her preferences (Status Quo $\succ$ Incomparable Alternative), but it changes her evaluative landscape. She is no longer saying they are incomparable; she is saying the one she holds is better.
  *   **The Arbitrariness Worry:** If the policy is "Stick with the initial random pick," then the diachronic rationality rests on a synchronic arbitrariness. You argue this fails to be rational "by her own lights" because her lights (her values) declare the options equal in rank (or rather, unranked).

  #### The Argument for Your Friend (The "Will-Based Reasons" Defense)
  Your friend can block the pump without smuggling completeness if she adopts a theory of **constitutive agency**, most notably associated with **Ruth Chang** (on hard choices) and **Edward McClennen**.
  *   **Preference vs. Choice:** One can maintain that the *evaluative standing* of the jobs remains incomplete (neither is better) while the *choice function* is completed by the agent's will.
  *   **Normative Force of Plans:** McClennen argues that rationality is not merely about satisfying preferences at a time-slice; it is about being a unified agent over time. A plan creates a **reason** to act that did not exist prior to the plan.
  *   **Not Smuggling, but Creating:** When she resolves to choose City, she is not discovering a fact that City is better. She is *making* it the case that she chooses City. This does not complete her *preferences* (she still acknowledges that, evaluatively, neither dominates); it completes her *commitments*.
  *   **Blocking the Pump:** The money pump works by exploiting the permission to switch. If the agent adopts the norm "I do not switch between incomparable options without a strict improvement," she is not saying City $>$ Country. She is saying "My commitment to non-switching $>$ The small monetary gain from switching." This is a complete preference regarding *policies*, even if preferences regarding *jobs* remain incomplete.

  ### 4. Assessment: Who Wins?
  You are right that the **mechanism** of rescue is different. In the intransitive case, resoluteness is a shield against one's own preferences. In the incomplete case, resoluteness is a scaffold where preferences are absent.

  However, your objection that this is "arbitrary" or "smuggling" only holds if you assume **Humean Instrumentalism**: the view that reason is solely the slave of the passions (preferences), and no choice can be rational without a prior preference grounding it.

  If your friend accepts a **Kantian or Volitional view of agency** (closer to McClennen and Chang), she wins. On this view:
  1.  Incompleteness is real (there is no fact of the matter about which job is better).
  2.  Rationality requires diachronic consistency (don't get pumped).
  3.  Therefore, the will is licensed to create a tie-breaking commitment where value is silent.

  **The Verdict:**
  The disanalogy holds, but it does not defeat your friend's position unless you can prove that reasons must *always* precede choice.
  *   **If you are right:** Incomplete preferences are diachronically unstable. A rational agent *must* have complete preferences (or at least a complete choice function grounded in complete preferences) to avoid exploitation. Incompleteness is a luxury a rational agent cannot afford.
  *   **If she is right:** Rational agency includes the power to create reasons through commitment. The "arbitrariness" is not a bug but a feature of freedom in the face of incomparability. She avoids the pump not by finding a preference, but by exercising a capacity for resolute choice that is itself rational.

  ### Recommendation for the Argument
  To press your advantage, ask her this:
  > "If the only reason to stick with the City job is the plan itself, and the plan was adopted solely to avoid a money pump, haven't you just reduced your career choice to a game of not losing pennies? Does the 'reason' generated by the plan have enough normative weight to actually justify turning down the Country job if, in the moment, you feel a pull toward it, even if that pull isn't a 'preference'?"

  To defend herself, she must argue that **diachronic rationality (avoiding exploitation) is a higher-order value** that legitimately trumps the indeterminacy of synchronic preference. If she accepts that, she keeps incompleteness and blocks the pump. If she denies that, she must admit that incompleteness makes her vulnerable to exploitation.

  **Summary:** You correctly identified that resoluteness works differently in the two cases (suppression vs. specification). However, this difference does not necessarily make the incomplete case irrational; it just requires a richer theory of agency (McClennen/Chang) than the standard preference-based model. The "smuggling" charge fails if one distinguishes between *evaluative incompleteness* and *volitional completeness*.
