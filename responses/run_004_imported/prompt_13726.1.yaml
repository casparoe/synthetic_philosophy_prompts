prompt: |-
  Okay so this has been rattling around in my head for like two months now, ever since I brought it up with some friends at dinner and we all just argued in circles with no real conclusion. Here's the situation: my cousin basically took care of our elderly uncle single-handedly for the last five years of his life, while her two siblings barely visited, and when he passed away his will left her a noticeably bigger cut than them (he was pretty explicit it was because of the caretaking). After the funeral she started feeling guilty and wasnt sure if she should just quietly split everything evenly with her siblings anyway to "be fair," or leave it exactly how the will said. She asked me what I thought and I had genuinely no idea, so I just called my friend Jill, who is hands-down the most thoughtful and level-headed person I know about this kind of family/fairness stuff, and told my cousin I'd go with whatever Jill said. Jill said keep it as is, no obligation to split it, so that's what I passed along.

  What's been bugging me is something my boyfriend said afterward. He said there's nothing weird about fully outsourcing something like "which contractor should I hire" to someone whose judgment you trust, since that's basically a factual question and your just borrowing their expertise to land on the right answer. But he said it feels different to hand over an actual moral call, like the inheritance thing, completely to Jill, even though I trust her at least as much here, maybe more, and even though she's probably right more often than I am on family/fairness stuff. And now that I think about it, I didn't even ask Jill WHY keeping the money was fine, I just wanted her verdict so I could relay it. I tried telling him maybe morality's just supposed to be more "yours" than a repair decision is, but that doesn't really hold up either, since I hand off plenty of other personal, values-y calls to people I trust without a second thought. I'm not really trying to relitigate whether Jill's answer about the inheritance was actually correct, I have no way to check that anyway - what I want to know is whether there's an actual meaningful difference between trusting someone's call on a factual thing like a contractor versus a moral thing like this, or if my boyfriend's just being weirdly philosophical about something totally normal. Does it matter at all that I only wanted her answer and never asked for her reasoning?
reasoning: |-
