answer: |-
  You have hit on exactly the right tension. In fact, you've spotted the single most debated fault line in Tolstoy's *What is Art?* Many scholars argue that Tolstoy *does* contradict himself here, or at least pivots so sharply that the system wobbles.

  However, for the purpose of your response paper, you don't need to declare him a failure. You can argue that he is employing a **two-tiered evaluation system**, where "excellence" is indeed doing two different jobs, but he intends them to work hierarchically rather than contradictorily.

  Here is how you can untangle the two chapters to make sense of his argument.

  ### 1. The Distinction: "Genuine" vs. "Good"
  The key to resolving the tension lies in the specific qualifier Tolstoy uses in Chapter 15: **"...the better is the art, *as art*..."**

  *   **Chapter 15 (The Formal Test):** Here, Tolstoy is defining what makes something **Genuine Art** versus **Counterfeit Art**.
      *   *Criterion:* Infectiousness (Sincerity, Clarity, Individuality).
      *   *Question:* Did the feeling successfully transmit from artist to viewer?
      *   *Verdict:* If yes, it is *Art*. If the infection is strong, it is *excellent as a vehicle of transmission*.
      *   *Analogy:* Think of this like testing a microphone. Is the sound clear? Is it loud? Does it reach the back of the room? If yes, it is an "excellent microphone."

  *   **Chapter 16 (The Moral Test):** Here, Tolstoy is defining what makes something **Good Art** versus **Bad Art**.
      *   *Criterion:* The quality of the feeling (based on the "religious perception of the age").
      *   *Question:* Is the feeling being transmitted conducive to human unity and brotherhood?
      *   *Verdict:* If the feeling is exclusive (patriotism) or base (lust), it is *Bad Art*, even if the "microphone" worked perfectly.
      *   *Analogy:* Now that we know the microphone works, what is the speaker saying? If they are using the excellent microphone to spread hate speech, Tolstoy argues the *act* is "bad," even if the audio quality is perfect.

  So, to answer your specific question: **Yes, "excellence/goodness" is doing two separate jobs.** In Ch. 15, it measures **technical efficacy**. In Ch. 16, it measures **moral utility**.

  ### 2. Why the Shift? (The "Virus" Analogy)
  You might ask: *Why bother with Chapter 15 if Chapter 16 overrides it?*

  Tolstoy needs Chapter 15 to clear the field of "counterfeit" art (stuff that tries to be art but fails to transmit feeling, like bad imitations or purely decorative craft). But he needs Chapter 16 because he views art as a **tool for human progress**, not just a neutral medium.

  For Tolstoy, high infectiousness without moral goodness is actually *more dangerous* than weak art.
  *   A boring patriotic poem does little harm.
  *   A highly infectious patriotic anthem (strong Ch. 15 infection) that promotes war (failed Ch. 16 moral test) is a **social virus**.

  Tolstoy admits in Ch. 16 that art *can* transmit bad feelings effectively. But he argues that in the modern Christian age (as he interprets it), art *ought* to transmit feelings of universal brotherhood. Therefore, a work that is highly infectious but morally "bad" is still "art," but it is **harmful art**.

  ### 3. How to Frame This in Your Paper
  If you write that "Tolstoy contradicts himself," you might get pushback from a professor who wants you to dig deeper into his moral framework. Instead, try framing it as a **hierarchy of value**.

  **A potential thesis angle:**
  > "While Tolstoy initially posits infectiousness as the 'sole measure' of artistic excellence in Chapter 15, he does not intend this as a final moral judgment. Rather, he establishes a two-stage evaluation: infectiousness determines whether a work is *genuine* art, while the 'religious perception' determines whether that art is *beneficial* to humanity. The apparent contradiction arises because Tolstoy ultimately subordinates aesthetic success to ethical utility."

  **Key points to hit:**
  1.  **Acknowledge the bracket:** Point out that in Ch. 15, Tolstoy explicitly says "speaking now apart from its subject-matter." He admits he is temporarily ignoring content to define the *mechanism* of art.
  2.  **The Re-integration:** In Ch. 16, he brings subject matter back in. He argues that you cannot ultimately separate the "feeling" from the "value of the feeling."
  3.  **The Teleological Goal:** Remind the reader that Tolstoy isn't writing *Art for Art's Sake*. He is writing *Art for Life's Sake*. For Tolstoy, if art doesn't make us better brothers/sisters to one another, its "excellence" in transmission is irrelevant or even nefarious.

  ### 4. One Caveat (For extra credit)
  If you want to show you've really grappled with the text, you can note that Tolstoy *tries* to blur this line later. He sometimes suggests that "bad" feelings (like lust or patriotism) actually **cannot** be truly infectious in the long run because they are based on falsehoods/division, whereas "good" feelings (unity) have a deeper, more universal resonance.

  He wants to have it both ways:
  1.  Infection is the measure of art.
  2.  Only moral art is truly good.
  3.  *(Implicitly)* Truly moral art is the *most* infectious because it aligns with truth.

  You can point out that this third point is where his argument gets shakiest (since history shows plenty of highly infectious "bad" art), but it shows he is trying to make the two chapters cohere into one system, not just two separate lists.

  ### Summary
  You aren't missing anything; the term "excellence" *does* shift.
  *   **Ch 15:** Excellence = **Transmission Power.**
  *   **Ch 16:** Goodness = **Moral Direction.**

  Tolstoy's final verdict is that Transmission Power matters only if the Moral Direction is correct. A car with a powerful engine (Ch. 15) is "excellent" mechanically, but if it's driving off a cliff (Ch. 16), it's not "good" for the driver. Tolstoy cares about where the car is going.
