answer: |-
  This dialogue is a fictionalized retelling of the famous 1958 *Harvard Law Review* debate between H.L.A. Hart (legal positivism) and Lon Fuller (natural law theory), centered on the *Grudge Informer Case*. Here is an adjudication of their exchange, move by move.

  **Move (1)**
  **Nora** stakes out the Natural Law position: extreme injustice negates legal validity.
  **Assessment:** Nora wins on moral intuition but loses on technical definition. Her claim is emotionally resonant and aligns with the actual court ruling, but analytically it conflates what law *is* with what law *ought to be*. By defining "law" to exclude wicked rules, she risks making it impossible to criticize a law as "wicked law"—it just becomes "not law."
  **Edge:** **Nora** (for capturing the moral stakes), but it is a fragile victory.

  **Move (2)**
  **Sam** articulates the Positivist critique: law is a matter of social fact (enactment, application), not moral merit. He advocates for "honest retroactivity."
  **Assessment:** Sam takes the lead here. He identifies the danger in Nora's reasoning: if we redefine law to fit our morals, we lose the vocabulary to say "this is law, but it is too evil to obey." His proposal (a retroactive statute) achieves the moral outcome (punishing the woman) without corrupting the definition of law.
  **Edge:** **Sam**. This is the stronger analytical point.

  **Move (3)**
  **Nora** shifts ground from "wicked content" to "systemic legitimacy." She argues that form without moral authority is a fiction.
  **Assessment:** Nora recovers ground. This is Fuller's argument about the "internal morality of law." She suggests law isn't just paperwork; it's a system meant to guide human conduct. A terror regime fails this function. This challenges Sam's "ordinary marks" criterion.
  **Edge:** **Nora**. She successfully complicates Sam's formalism.

  **Move (4)**
  **Sam** raises the "Slippery Slope" or Rule of Law argument. If judges can void statutes based on moral repugnance, legal certainty collapses.
  **Assessment:** Sam regains the advantage. In a post-war democracy trying to establish stability, allowing judges to invalidate past statutes based on subjective moral tests is dangerous. It invites the very arbitrariness they fought against. His point about predictability ("everyone in 1944 knew...") is factually debatable, but the principle is sound.
  **Edge:** **Sam**. Practical governance favors his view.

  **Move (5)**
  **Nora** attacks Sam's factual premise. She argues the Nazi system lacked predictability *even by positivist standards* (secret directives, terror).
  **Assessment:** This is Nora's strongest move. She argues that the Nazi regime failed Sam's *own* test for a legal system. If law requires general, public rules applied consistently, the Third Reich often didn't meet that bar. Therefore, calling it "law" is empirically wrong, not just morally wrong.
  **Edge:** **Nora**. She turns Sam's criteria against him.

  **Move (6)**
  **Sam** concedes the moral horror but insists on *institutional competence*. He argues that changing the rules of validity is a legislative job, not a judicial one.
  **Assessment:** Sam closes strong. Even if the old system was broken, the new court's legitimacy depends on not acting like a legislature. Passing a retroactive statute forces the new democracy to take public responsibility for the exception, rather than hiding behind a judicial fiction that the old law "never existed." This preserves the separation of powers.
  **Edge:** **Sam**. This is the most prudent path for a rebuilding state.

  ### What Both Are Missing

  1.  **The Radbruch Formula:** Both are dancing around Gustav Radbruch's post-war legal theory, which attempted to split the difference: positive law applies unless the conflict between statute and justice reaches an "intolerable level." Neither character names this compromise.
  2.  **The Specific Legal Mechanism:** In the actual case, the court didn't just say "Nazi law wasn't law." They ruled that the woman had violated the Prussian Penal Code of 1871 (which was still technically in force) by *misusing* the Nazi statute for private ends. The nuance of "misuse of legal process" is absent from their debate.
  3.  **Transitional Justice:** They treat this as a binary philosophical puzzle. They miss the sociological function of the trial: it was a ritual to cleanse the state. Sometimes, legal fictions (Nora's path) are socially necessary to bridge the gap between regimes, even if they are analytically messy (Sam's complaint).

  ### Verdict

  Sam has the better of the argument. While Nora's moral intuition is correct (the woman deserved punishment), Sam correctly identifies that achieving justice through legal fiction damages the long-term integrity of the legal system. His solution—admitting the act was legal under the old regime but punishing it via honest, retroactive legislation—preserves the distinction between law and morality. This distinction is vital; it allows a society to say, "This was law, it was evil, and we are changing it," rather than confusing the definition of law itself. His final point on institutional roles (Move 6) is the deciding factor: courts interpret, legislatures make rules.

  \answer{Sam}
