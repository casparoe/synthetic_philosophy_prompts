      *   *Susanna Siegel's "Rich Content" View:* Perception isn't just colors and shapes; it includes kind-properties (seeing something *as* a pine tree) and affordances (seeing something *as* climbable). Crucially, she argues for "epistemic charge" – perception can be influenced by prior states in a way that makes it seem immediate.
      *   *Prediction Processing (Predictive Coding):* This is the modern neuroscience/philosophy bridge. The brain is a prediction machine. Top-down predictions *literally* construct the perceptual experience to minimize error. This is the strongest scientific backing for the user's intuition.

