answer: |-
  **Alex:** Let's begin with the core of Galen's Basic Argument, because I think your father's strategy in *Freedom and Resentment* inadvertently concedes the metaphysical battle while trying to win the pragmatic war. The argument is simple, but it's a vice. To be truly morally responsible for an action, you must be responsible for the mental state—the character, the motives, the values—from which that action flows. But to be responsible for *that* mental state, you must have chosen it, via a prior act of will. And to be responsible for *that* act, you must have been responsible for the mental state that produced *it*.

  **Jordan:** The regress. Yes, we know the shape of it. Nothing can be *causa sui*. No one is the ultimate cause of themselves.

  **Alex:** Exactly. And notice, this isn't the old compatibilist tug-of-war over determinism. Galen's point is sharper. Even if indeterminism is true, even if there are random gaps in the causal chain, it doesn't help. If a choice pops up undetermined, it's just a matter of luck. You can't be responsible for a random event any more than a determined one. So, Ultimate Responsibility (UR) is impossible. Now, here is where I press your father's view. P.F. Strawson argues we are justified in holding people responsible because reactive attitudes like resentment are natural and non-optional. But he also admits there are exemptions. We adopt the "objective attitude" toward the compulsive, the psychotic, the very young. Why? Because their conduct flows from conditions they did not choose.

  **Jordan:** Because their capacity for ordinary interpersonal relationships is locally impaired.

  **Alex:** But that's my point. If the principled reason for the exemption is "they didn't choose the condition that produced the action," then *everyone* qualifies for the exemption. No one chooses their initial character. No one chooses their genetic makeup or their early environment. If we withdraw resentment from the psychotic because they are victims of unchosen causes, consistency demands we withdraw it from everyone. Your father stops the slide arbitrarily. He saves the practice, but he sacrifices the principle.

  **Jordan:** I need to stop you there, because I think you're mischaracterizing the concession my father is making. You're treating the exemption for the psychotic as a metaphysical judgment about causation. It isn't. It's a judgment about *relationship*.

  **Alex:** How is it not metaphysical? You're saying they aren't appropriate targets of resentment.

  **Jordan:** I'm saying they aren't *participants* in the same way. But look, let me make a concession right out of the gate. I grant you this: If "responsibility" requires the kind of Ultimate Responsibility you just described—the ability to be *causa sui*, to stand outside the causal order and author one's own nature—then no one is responsible. Galen is right. UR is impossible. Human beings are not prime movers unmoved.

  **Alex:** Thank you. That's significant.

  **Jordan:** But it doesn't settle the dispute. And here is why: The demand for UR is a demand that our moral practices be grounded in something outside of human life. My father's point is that the reactive attitudes *constitute* moral life. They aren't a theory we adopt because we've proven we have metaphysical freedom. They are the framework within which we live. To ask for a justification of them from outside that framework is like asking for a justification of language using no words. You're asking us to validate our humanity from a standpoint that isn't human.

  **Alex:** But that sounds like a surrender to irrationality. You're saying, "We can't justify it, we just do it." If I understand you, you're arguing that the psychological inevitability of resentment justifies its use.

  **Jordan:** Not inevitability alone. It's that these attitudes are the medium of mutual recognition. When I resent you, I'm not making a metaphysical claim about your uncaused cause. I'm expressing a demand for good will. I'm saying, "You owed me more."

  **Alex:** But return to the generalization problem. You admit we suspend these attitudes when someone is compelled by an unchosen condition. The psychotic is compelled by neurochemistry they didn't choose. The normal agent is compelled by heredity and environment they didn't choose. The only difference is degree, not kind. If the *principle* of the exemption is "lack of ultimate control," then the objective attitude should be universal. If you say, "No, the principle is 'participation in interpersonal relationships'," I have to ask: Can someone truly participate if they are not ultimately responsible for their participation? If their "good will" is just the product of a lucky upbringing, is my gratitude to them any more rational than my gratitude to a well-programmed robot?

  **Jordan:** That's a powerful image, the robot. But consider this: You are asking me to treat the difference between a psychotic break and a standard moral failure as merely a difference in degree of causal determination. But phenomenologically, it's a difference in kind. When you insult me intentionally, I feel a specific sting. When a person in a delirium insults me, I feel pity or fear, but not that sting. My father isn't telling you to suppress that difference. He's telling you that the sting *is* the reality of responsibility.

  **Alex:** The sting is real, I agree. But is it *justified*? This is where I have to make my own concession. I admit that we cannot, as a matter of psychological fact, simply turn off the reactive attitudes. Even Galen admits he still feels anger when someone cuts him off in traffic. We are biologically wired for this. So, I concede that your father is right that the practice is inescapable for human beings as they are currently constituted.

  **Jordan:** So the practice survives.

  **Alex:** Not necessarily. Psychological inescapability is not normative justification. Just because we *must* breathe doesn't mean breathing is morally right. Just because we *must* feel resentment doesn't mean the person resented *deserves* it. Your father's strategy is to say, "This is our form of life, so it justifies itself." But that leaves the injustice intact. If UR is impossible, then treating people as if they are ultimately responsible is treating them under a false description. It's a necessary fiction. But if we know it's a fiction—as your son's argument proves we should—doesn't that knowledge corrode the practice? If I know you couldn't have done otherwise in the ultimate sense, can I truly hold you to account?

  **Jordan:** You're assuming that "holding to account" requires the "ultimate sense." That's the pivot point. You say that without UR, the reactive attitudes are based on a falsehood. I say they aren't based on a theory at all. They are based on the fact that we care about how others treat us. Look at the generalization move again. You say if we excuse the psychotic for unchosen causes, we must excuse everyone. But we don't excuse the psychotic because of a theory of causation. We excuse them because the *relationship* is broken. We can't demand good will from someone who lacks the capacity for it.

  **Alex:** But everyone lacks the capacity for *ultimate* good will. No one can choose their capacity.

  **Jordan:** But they have the capacity for *ordinary* good will. That's the threshold. The distinction isn't between "caused" and "uncaused." It's between "capable of reciprocal engagement" and "incapable." The regress argument asks us to look at the history of the capacity. My father asks us to look at the presence of the capacity *now*. If you have the normal human equipment for understanding and responding to moral demands, you are in the game. The fact that you didn't choose your equipment is irrelevant to whether you can use it.

  **Alex:** Irrelevant to using it, yes. But relevant to whether you get *credit* or *blame* for how you use it. If I am dealt a hand of cards I didn't choose, I can play it well or poorly. But if I play it well because my "lucky upbringing" gave me a good poker face, do I deserve the pot? Your view says yes, because we are playing the game. My view says the game itself is rigged if the players didn't choose to sit at the table.

  **Jordan:** But no one chose to sit at the table. That's the human condition. If we stop playing because we didn't choose to be here, we lose everything that makes life valuable. Love, gratitude, indignation—these require the belief that the other person *could have done otherwise* in a practical sense.

  **Alex:** A practical sense that excludes the ultimate sense.

  **Jordan:** Precisely. And here is where I push back on your concession. You admitted we can't stop feeling these attitudes. But you said that doesn't make them justified. I say that for creatures like us, "justification" runs out at the bedrock of our nature. If you demand a justification for our form of life from outside our form of life, you will never get it. But that doesn't mean the life is unjust. It means the demand is incoherent.

  **Alex:** It feels incoherent only if we assume our form of life is the measure of all truth. But Galen's argument claims to be a logical truth, not a psychological one. The regress holds regardless of how we feel. So we are left with a tragedy. We have a logical proof that responsibility is impossible, and a psychological proof that we must act as if it is possible.

  **Jordan:** I wouldn't call it a tragedy. I'd call it a correction. Your son corrects the metaphysicians who think we are little gods. My father corrects the skeptics who think that not being little gods means we are nothing. We are human. We hold each other responsible not because we are *causa sui*, but because we are *socii*.

  **Alex:** And if being *socii* requires a illusion of being *causa sui*?

  **Jordan:** It's not an illusion. It's a different description. You describe the agent as a link in a causal chain stretching back to the Big Bang. I describe the agent as a partner in a conversation stretching across the room. Both are true. But only one allows us to live.

  **Alex:** Then we agree on the facts, but disagree on which truth matters. You prioritize the truth of human engagement. I prioritize the truth of metaphysical coherence.

  **Jordan:** And I'd say metaphysical coherence that renders human life unintelligible is a poor kind of coherence.

  **Alex:** And I'd say a human life built on a metaphysical impossibility is a fragile kind of life. But perhaps that fragility is all we have.

  **Jordan:** Then let's be grateful for it. Even if we didn't choose to be.

  **Alex:** [Smiles wryly] Even if we didn't choose to be.
