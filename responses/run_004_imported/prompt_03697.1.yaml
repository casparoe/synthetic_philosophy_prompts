      *   **Concession 2 (Alex):** Admit that we *cannot* practically stop feeling resentment. It's psychologically ingrained. *But* argue that psychological inevitability doesn't equal rational justification.
      *   **Closing:** Summarize the impasse. Metaphysical coherence vs. Human viability.

