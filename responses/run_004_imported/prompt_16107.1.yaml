answer: |-
  Based on a close reading of *Truth and Probability*, Frank Ramsey would not attempt to "solve" the problem of old evidence in the manner of Garber, Jeffrey, or later Bayesians. Instead, he would **dissolve** the problem by rejecting the normative premise that generates it. Ramsey's specific brand of psychologism treats the probability calculus as a logic of *consistency* for existing beliefs, not a logic of *discovery* or *confirmation* for changing beliefs. Consequently, he would argue that the "problem" arises only when one conflates the static requirements of coherence with the dynamic, psychological processes of belief formation—a conflation Ramsey explicitly warns against in his closing remarks on induction.

  To defend this reading, we must reconstruct Ramsey's distinction between the "logic of consistency" and the "logic of truth," examine his treatment of logical omniscience, and show why these commitments lead to a dissolution of the puzzle rather than a formal resolution.

  ### 1. The Two Logics: Consistency vs. Reasonableness

  The cornerstone of Ramsey's essay is the distinction between the laws of probability and the rules for forming beliefs. Ramsey derives the probability axioms (additivity, etc.) from the requirement that an agent's betting quotients be coherent (i.e., immune to a Dutch Book). However, he is explicit that coherence is a necessary but not sufficient condition for rationality.

  Ramsey writes:
  > "The laws of probability, so far as they have been enunciated, are therefore merely necessary conditions of consistency... They do not tell us what beliefs we ought to have, but only what beliefs we can have without contradicting ourselves."

  Later, in the section on induction, he notes:
  > "It is also evident that... [probability] does not cover the whole field of reasonable belief... We are convinced [of induction] by a process which is not strictly logical."

  For Ramsey, the probability calculus is a static check on a *system* of beliefs at a time $t$. It ensures that if you believe $A$ to degree $x$ and $B$ to degree $y$, you aren't vulnerable to a sure loss. It is *not* a dynamic rule telling you how to move from $t_1$ to $t_2$ when new information (or new realizations) occur.

  The "Problem of Old Evidence" assumes that the Bayesian calculus *ought* to provide a normative account of confirmation (i.e., how $H$ gains credibility from $E$). If the calculus yields $P(H|E) = P(H)$ when $P(E)=1$, the Bayesian is embarrassed because scientific practice suggests confirmation *did* occur. Ramsey would respond that this embarrassment is misplaced. If an agent's psychology is such that $P(E)=1$, then *for that agent*, $E$ cannot function as a lever to raise $P(H)$ via conditionalization. If the agent later comes to hold $H$ more strongly, that is a change in their "habits of belief," which falls under the domain of *reasonableness*, not the *calculus of consistency*.

  ### 2. Logical Omniscience and the Nature of Probability

  The engine of the old evidence problem is the assumption that $P(E)=1$ is a fixed, objective constraint on the agent. Garber's solution relaxes this by suggesting agents aren't logically omniscient; they learn the entailment relation $H \vdash E$. While Ramsey would agree that humans are not logically omniscient, he would disagree on *why* this matters and how it should be formalized.

  Ramsey grounds probability in human limitation. He observes that if we were logically omniscient, probability would vanish:
  > "Obviously the laws of logic are the limiting case of the laws of probability... but we are not concerned with this."

  For Ramsey, probability exists *because* we are ignorant of logical consequences. A tautology has probability 1, but only if we *recognize* it as a tautology. If an agent assigns $P(E)=1$, this is a report on their psychological disposition to act, not a report on the logical status of $E$.

  Therefore, when Einstein realized General Relativity ($H$) entailed the perihelion precession ($E$), he did not merely update on $E$ (which was already 1). He underwent a psychological shift where the *connection* between $H$ and $E$ became live for him. Ramsey would argue that this shift is not a violation of the probability calculus, nor does it require the calculus to be patched (as Garber does by adding sentences about entailment to the object language). Rather, it is a change in the *domain* of the agent's consistent beliefs.

  Ramsey's psychologism implies that the "probability" is always relative to the agent's *current* state of knowledge and logical awareness. If the agent was previously unaware of the entailment, their previous probability space did not include the relation $H \to E$ as a live constraint. Discovering the entailment is not "learning old evidence"; it is learning a new logical fact that reorganizes the entire system of habits. Since Ramsey treats beliefs as "dispositions to act," discovering that $H$ implies $E$ changes the disposition to bet on $H$. This is a causal/psychological fact, not a logical paradox.

  ### 3. Why Ramsey Would Reject the Garber-Style "Solution"

  Garber's approach attempts to save the Bayesian calculus as a complete logic of confirmation by expanding the formalism to allow agents to conditionalize on the fact that "$H$ entails $E$." Ramsey would likely view this as a category error.

  Ramsey's project in *Truth and Probability* is to ground probability in *actual* human behavior, not idealized rational agents. He writes:
  > "We find therefore that a precise definition of degree of belief in terms of betting is possible... [but] it is also evident that... [this] does not cover the whole field of reasonable belief."

  If Ramsey were presented with the old evidence problem, he would diagnose it as an attempt to force the "logic of consistency" to do the work of the "logic of truth." The intuition that "Mercury's perihelion *should* confirm General Relativity" is a judgment about the *reasonableness* of Einstein's belief revision, not a requirement of the probability calculus.

  For Ramsey, the calculus says: "If you believe $E$ with certainty, and you believe $H$ implies $E$, you must believe $H$ at least as strongly as the implication allows to remain consistent." It does *not* say: "You must have assigned a lower probability to $E$ historically to allow for confirmation." The historical fact that $E$ was known is irrelevant to the *current* consistency of the system.

  Ramsey would argue that the "problem" only exists if we reify the probability calculus as a normative theory of scientific discovery. But Ramsey explicitly limits the scope of his theory:
  > "The theory of probability... is a logic of consistent belief, not a logic of true belief."

  To ask "How does old evidence confirm?" is to ask a question about *true belief* (or reasonable belief formation). Ramsey's answer is that the calculus doesn't answer that. The confirmation happens because the human mind, upon seeing the entailment, forms a new habit of expecting $H$ to be true. This is a matter of psychology and induction, which Ramsey admits lies outside the strict probability calculus.

  ### 4. Conclusion: Dissolution via Psychologism

  Ramsey would not anticipate the Garber-style resolution because he would not see a problem to solve. The Garber solution accepts the premise that the Bayesian formalism *must* account for the confirmation intuition and tweaks the formalism to do so. Ramsey's commitment is to the idea that the formalism *only* accounts for consistency.

  If an agent's degrees of belief shift upon learning a logical entailment, Ramsey views this as a change in the agent's psychological state that must *then* be made consistent. The "old evidence" is not a logical barrier; it is a psychological fact about the agent's prior habits. The fact that scientific practice treats this as confirmation is a fact about the *utility* of those habits (their success in predicting future experiences), which Ramsey discusses in his pragmatist conclusion.

  Therefore, Ramsey's view dissolves the problem of old evidence by **denying the normative authority of the textbook Bayesian story** that generates the puzzle. He would argue that the textbook story mistakenly treats the probability calculus as a complete logic of confirmation. By strictly separating the "logic of consistency" (where $P(E)=1$ implies no update) from the "logic of reasonableness" (where learning entailments justifies belief shifts), Ramsey renders the "problem" a confusion of categories. The confirmation of General Relativity by Mercury's orbit is a triumph of *reasonable habit formation*, not a puzzle for the *calculus of coherence*. Ramsey's unease about logical omniscience is not a prelude to fixing the calculus (Garber), but a reminder that the calculus is silent on the dynamics of discovery.
