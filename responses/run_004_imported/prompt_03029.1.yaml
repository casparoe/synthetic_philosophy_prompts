          *   *The Risk:* The "Psychologism" trap. Frege hated psychologism. Attributing his logical requirements to a psychological "temperament" or "horror" might violate Frege's own anti-psychologism. However, we are talking about Frege *the man*, not just the abstract system.
          *   *The Philosophical Work:* Does this thesis *do* anything? Does it explain the politics better? Or does it explain the logic better? Or does it just make for a good story?
