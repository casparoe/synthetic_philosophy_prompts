answer: |-
  This is a fantastic real-world application of the material you're teaching, and your intuition about the "credit problem" is spot on. It cuts right to the heart of why R.'s move, while philosophically evocative, often fails in the court of moral relationships.

  You are dealing with a collision between **metaphysical identity** (what makes a person the same over time) and **moral identity** (what makes a person accountable for actions over time). R. is trying to use a metaphysical claim to solve a moral problem. Your mom is rightly pointing out that moral problems require moral solutions, not metaphysical loopholes.

  Here is a breakdown of how much weight R.'s move can actually bear, using the frameworks you're teaching.

  ### 1. The Lockean Trap
  R.'s claim ("I was a different person") sounds Lockean. Locke distinguishes between the *Man* (the biological organism) and the *Person* (the forensic unit of consciousness and memory). For Locke, personal identity consists in psychological continuity, specifically memory.

  R. is arguing that the psychological connection between Sober R. and Addict R. is so severed that they are different *Persons*, even if they are the same *Man*.

  **The Problem:** Locke explicitly ties this theory of identity to **responsibility**. In *Essay Concerning Human Understanding*, Locke argues that you are responsible for any action you can appropriate to yourself via consciousness/memory.
  *   **Does R. remember?** Presumably, yes. He knows he gambled, drank, and left. He isn't claiming amnesia; he's claiming *alienation*.
  *   **The Forensic Implication:** If R. remembers the actions, Locke would say he is the same Person. By saying "that wasn't me," he is trying to have it both ways: he wants the Lockean discontinuity to absolve him of blame, but he relies on the Lockean continuity of memory to tell the story of his redemption. You can't disown the sin while owning the testimony of the sin.

  ### 2. The Parfitian Reduction (and the Credit Paradox)
  This is where your insight shines. Derek Parfit, in *Reasons and Persons*, argues that identity isn't what matters; *Relation R* (psychological connectedness and continuity) matters. He would agree with R. that the connectedness between Addict R. and Sober R. might be weak.

  However, Parfit is a reductionist. He argues that if identity is just a matter of degree, then **responsibility is also a matter of degree.**
  *   **The Blame:** If Sober R. is only 40% psychologically connected to Addict R., perhaps he deserves only 40% of the blame. He doesn't get to claim 0%.
  *   **The Credit:** As you noted, this cuts both ways. If the connection is too weak to sustain blame, it is too weak to sustain credit. If Addict R. ruined the family, and Sober R. is a "different person," then Sober R. didn't *fix* anything. He just showed up to a house someone else burned down and started gardening.

  For R. to claim credit for his recovery ("I worked hard," "I stayed sober"), he must claim identity with the addict who had the urge to drink. Redemption *requires* numerical identity. You can only be redeemed for *your* sins. If they weren't your sins, you don't need redemption; you just need a fresh start. R. wants the fresh start without the redemption arc.

  ### 3. The Buddhist Nuance (Anatta vs. Karma)
  Since you're teaching Buddhist material, this is a rich angle. The doctrine of *anatta* (no-self) might superficially sound like it supports R. ("There is no permanent self, so the 'self' that drank is gone").

  However, Buddhist ethics are grounded in **Karma** (cause and effect) and **Dependent Origination**.
  *   **Continuity of Causality:** Even if there is no substantial self, there is a causal stream. The suffering your mom feels is a direct result of causes set in motion by the aggregates that constituted R. in the 90s.
  *   **Invalidating Suffering:** For R. to say "that wasn't me" is to deny the causal link. In a Buddhist framework, this is a form of delusion. It ignores the interdependence of his past actions and her present pain.
  *   **The Path:** A Buddhist perspective would likely validate R.'s *change* (impermanence is real), but would demand he acknowledge the karmic debt without clinging to a static notion of "I am a bad person" *or* "I am a new person." He needs to own the causality without reifying the self. R. is trying to sever the karmic chain verbally rather than addressing the suffering it caused.

  ### 4. The Strawsonian Objection (Your Mom's Position)
  P.F. Strawson, in "Freedom and Resentment," argues that moral responsibility isn't about metaphysical facts; it's about **reactive attitudes** (resentment, gratitude, anger, forgiveness) within a community.
  *   Your mom's anger is a demand for regard. She is saying, "What you did mattered to me, and it matters that *you* did it."
  *   When R. says "I was a different person," he is effectively opting out of the participant stance. He is treating his relationship with his sister as an objective problem to be solved rather than a interpersonal relationship to be repaired.
  *   Mom is refusing to let him opt out. She is insisting that the "Man" (the biological brother) is the proper target of her reactive attitudes, regardless of his psychological shifts. In the social contract of a family, the biological/social continuity trumps the psychological discontinuity.

  ### The Verdict for the Classroom (and the Family)
  R.'s move is **philosophically serious but morally insufficient.**

  It is serious because it highlights that we *do* change. We are not static substances. Parfit and the Buddhists are right that the "self" is less solid than we think.

  However, it is insufficient because **moral repair requires narrative identity.** To reconcile, R. needs to tell a story where *he* did the bad thing, *he* regretted it, and *he* worked to change.
  *   **R.'s Story:** "Bad Guy (not me) hurt you. Good Guy (me) is here now. Forgive me." -> *This asks your mom to forgive a debt she doesn't think he owes.*
  *   **The Redemption Story:** "I hurt you. I am the same person who hurt you, but I have changed my character. I own the hurt, and I am asking for forgiveness." -> *This validates her pain and claims the effort of recovery.*

  **Conclusion:**
  R. is using a metaphysical truth (people change) to bypass a moral obligation (accountability). Your mom is right to be furious, not just because she's hurt, but because his argument undermines the very virtue he's trying to showcase. If he truly is a "different person," his sobriety isn't an achievement; it's just a circumstance. If his sobriety is an achievement, he is the same person who earned it—and the same person who owes the debt.

  You can tell your students: **Identity is flexible in metaphysics, but it must be rigid enough in ethics to hold the weight of a promise or an apology.** R. wants the flexibility without the weight.
