      *   *Metaphysical Commitment:* Empiricism/Skepticism. Agnostic about what causation *is* in the objects themselves (realism vs. anti-realism debate among scholars, but generally epistemic humility).
      *   *Conclusion:* Causation is a habit of the mind (custom/association). We *feel* the determination, we don't see it in the world.
      *   *Motivation:* Epistemological (limits of human understanding, combating dogmatism).

