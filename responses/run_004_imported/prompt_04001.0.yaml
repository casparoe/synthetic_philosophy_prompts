      *   *Application to Hume:* Would Rushd critique Hume?
          *   Yes, on the destruction of scientific knowledge. If causation is just mental habit, physics is psychology.
          *   Yes, on the nature of things. Rushd argues natures are real; Hume suspends judgment on natures.
          *   *Nuance:* Rushd accepts God as First Cause, Hume doesn't really talk about God in the *Enquiry*. But the core critique (denying real powers undermines the intelligibility of the world) applies to both.

