prompt: |-
  I recently began my third year as a PhD student in social psychology, and I have just been put in charge of drafting statistical guidelines for my department's newly formed "research reform" committee - a task I inherited after our director grew alarmed following a spate of articles on the replication crisis. While gathering background material for this, I went back through my advisor's old lab notebooks from roughly a decade ago and discovered that the standard procedure at the time was to run a significance test every week or so during data collection and stop as soon as p dropped below .05, sometimes extending a study by dozens of participants if an early look came back null. Nobody thought twice about this at the time, but a few of the papers built on that practice are ones I am currently trying to extend for my own dissertation, so my interest in how worried to be is more than academic.

  My advisor's proposed fix, which she wants the committee to adopt as binding policy for all future confirmatory studies in the department, is to require Bayesian analysis using Bayes factors instead of p-values, on the grounds that Bayesian updating obeys the likelihood principle and is therefore mathematically indifferent to when or why the experimenter decided to stop collecting data - unlike significance tests, which are demonstrably distorted by this kind of "peeking." That argument is appealing, but in reading further I have run into discussions of the Jeffreys-Lindley paradox, in which a result that looks decisively significant under classical testing can correspond to Bayesian evidence that actually favors the null, depending on the prior assigned to the alternative hypothesis - which makes me suspect that simply swapping frameworks is not the clean fix my advisor thinks it is. Before I put language in front of the committee that will bind how the whole lab analyzes data for years to come, could you lay out the most important implications of the likelihood principle and the Lindley paradox for this specific proposal - that is, whether requiring Bayes factors really would have protected our old studies from the stopping-rule problem, and how much weight a policy like this can actually bear compared with complementary reforms such as preregistration?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in social psychology.
      *   **Task:** Drafting statistical guidelines for a department "research reform" committee.
      *   **Situation:** Inherited the task after the director panicked about the replication crisis. Discovered old lab notebooks showing widespread optional stopping (p-hacking via sequential testing) by their advisor and others.
      *   **Conflict:** The advisor wants to mandate Bayesian analysis (Bayes Factors) as the *primary* fix, claiming it solves the optional stopping problem due to the Likelihood Principle. The student is skeptical due to the Jeffreys-Lindley Paradox and wants to know if this is a "clean fix" or if other reforms (preregistration) are needed.
      *   **Stakes:** High. The policy will bind the department for years. The student's dissertation relies on extending papers generated by the old (questionable) methods.
      *   **Tone:** Needs to be professional, nuanced, academically rigorous, but accessible. It needs to validate the student's skepticism without undermining the advisor completely, while steering towards best practices.

  2.  **Deconstruct the Core Statistical Issues:**
      *   **Optional Stopping (Peeking):** In NHST (Null Hypothesis Significance Testing), checking $p$-values repeatedly inflates Type I error rates. The sampling distribution depends on the stopping rule.
      *   **Likelihood Principle (LP):** States that all evidence in data regarding parameters is contained in the likelihood function. If two experiments yield proportional likelihoods, they should yield the same inference. Bayesian inference obeys the LP; frequentist inference (generally) does not.
      *   **Bayesian Optional Stopping:** Bayes Factors (BF) are *mathematically* robust to optional stopping *if* the prior is fixed and proper. You can update the BF as data comes in without inflating false positive rates *in the Bayesian sense* (calibration of posterior odds).
      *   **Jeffreys-Lindley Paradox:** With large sample sizes and diffuse (flat) priors on the alternative, a significant $p$-value (e.g., $p < .05$) can coexist with a Bayes Factor strongly favoring the Null ($H_0$). This happens because the alternative hypothesis becomes "diluted" over a wide parameter space.
      *   **The Advisor's Claim:** "Bayesian updating... is therefore mathematically indifferent to when or why the experimenter decided to stop." -> *Mostly true, but with caveats regarding calibration and priors.*
      *   **The Student's Worry:** "Simply swapping frameworks is not the clean fix." -> *Correct.*

  3.  **Evaluate the Proposal (Mandating Bayes Factors):**
      *   *Pros:* Solves the specific mathematical issue of optional stopping *within the Bayesian framework*. Encourages thinking about effect sizes and evidence rather than binary decisions.
      *   *Cons:* Doesn't solve $p$-hacking if researchers switch priors or metrics until they get what they want ("Bayesian hacking"). The Lindley Paradox means results might contradict intuition or past literature. Requires more statistical literacy to set priors correctly.
      *   *Crucial Point:* Bayesian robustness to optional stopping assumes the *model* (including priors) is fixed. If you change the prior based on interim looks, you break the coherence.

  4.  **Evaluate Complementary Reforms (Preregistration):**
      *   Preregistration locks down the analysis plan, hypotheses, and stopping rules *before* data collection.
      *   It addresses the "researcher degrees of freedom" problem regardless of statistical framework.
      *   It distinguishes confirmatory from exploratory research.
      *   It is currently the gold standard in reform movements (e.g., Center for Open Science).

  5.  **Address the Specific Situation (Old Lab Notebooks):**
      *   The student is worried about their dissertation extending old work.
      *   Acknowledge the sensitivity. Don't accuse the advisor of misconduct (it was standard practice then), but acknowledge the epistemic uncertainty.
      *   Advise on how to handle the legacy literature (replication, robustness checks).

  6.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the student's position. It's a mature insight to question a "silver bullet" solution. Acknowledge the delicacy of the advisor relationship.
      *   **The Likelihood Principle & Optional Stopping:** Explain *why* the advisor is partially right. Bayes Factors *are* robust to optional stopping *under specific conditions*. Explain the mechanism (likelihood ratios don't care about the sampling plan).
      *   **The Catch (Jeffreys-Lindley Paradox):** Explain the paradox clearly. Large $N$ + diffuse prior = BF favors Null even if $p$ is significant. This means swapping to BF might actually make the old findings look *worse* or contradictory, not just "fixed."
      *   **The "Bayesian Hacking" Risk:** If you allow optional stopping with BFs, researchers might still manipulate priors or stop when BF > 3 (or 10) selectively. The math holds, but human behavior doesn't always follow the axioms.
      *   **Preregistration vs. Bayesian Mandate:** Argue that they are not mutually exclusive. Preregistration is the *procedural* fix; Bayesian analysis is the *inferential* fix. You need both. Preregistration defines the "confirmatory" nature.
      *   **Recommendations for the Committee:**
          1.  Don't ban $p$-values entirely (yet), but de-emphasize binary thresholds.
          2.  Mandate Preregistration for confirmatory work (crucial).
          3.  If using BFs, require justification of priors (default vs. informed).
          4.  Address the "Old Data": Suggest robustness checks or direct replications for the dissertation, rather than assuming the old effects are solid.
      *   **Political/Diplomatic Advice:** How to present this to the advisor. Frame it as "strengthening the policy" rather than "correcting the advisor."

  7.  **Refining the Content (Self-Correction/Nuance Check):**
      *   *Correction:* I need to be careful not to say BFs are *immune* to bias. They are immune to *stopping rule bias* regarding Type I error calibration, but not immune to *selection bias* if the researcher chooses which analysis to report.
      *   *Nuance:* The Lindley Paradox isn't just a "gotcha"; it highlights that $p < .05$ is often weaker evidence than people think. This supports reform, but complicates the transition.
      *   *Tone Check:* Ensure I don't sound like I'm encouraging the student to snitch on the advisor. Focus on future policy and the student's own dissertation integrity.
      *   *Specific Question:* "Whether requiring Bayes factors really would have protected our old studies." Answer: It would have protected the *statistical validity* of the inference *at the time*, but it wouldn't fix the fact that the effect sizes might be inflated (publication bias/winner's curse).

  8.  **Final Polish:** Organize with clear headings. Use bold text for emphasis. Ensure the distinction between *mathematical coherence* and *scientific practice* is clear. (Proceed to generate output based on these thoughts.)

  9.  *(Post-Drafting Review)*: Does this answer the prompt? Yes. Does it address the Likelihood Principle? Yes. The Lindley Paradox? Yes. The policy implications? Yes. The dissertation worry? Yes.

      *One critical addition:* I need to mention that while BFs are robust to optional stopping, *calibration* can still be an issue if the stopping rule is data-dependent in a way that exploits prior sensitivity. But generally, the consensus is BFs are robust to optional stopping. I must emphasize that *Preregistration* is the stronger guard against HARKing (Hypothesizing After Results are Known), which BFs alone don't stop.

      *Also:* The "Old Lab Notebooks" issue. The student is extending this work. I need to advise them to treat the old effect sizes with skepticism (shrinkage) regardless of the new policy.

      *Final Plan:*
      1. Validate the insight.
      2. Explain the Advisor's point (LP & Stopping).
      3. Explain the Student's counterpoint (Lindley Paradox & Prior Sensitivity).
      4. Discuss the "Human Element" (Bayesian Hacking).
      5. Synthesize into Policy Recommendations (Prereg + BF + Transparency).
      6. Advice on the Dissertation (Replication/Robustness).
      7. Diplomatic framing.cw
answer: |-
  This is a remarkably sophisticated dilemma for a third-year PhD student to navigate. You are correctly identifying that statistical frameworks are not "plug-and-play" solutions to cultural problems in science. Your advisor is technically correct about the Likelihood Principle, but you are also correct that the Jeffreys-Lindley paradox and researcher behavior complicate the picture significantly.

  Mandating Bayes Factors (BFs) without addressing the broader ecosystem of research practices (like preregistration) risks swapping one set of problems for another. Below is a breakdown of the statistical implications and policy recommendations you can use to draft your guidelines, framed in a way that respects your advisor's expertise while incorporating necessary safeguards.

  ### 1. The Likelihood Principle and Optional Stopping
  Your advisor's argument rests on the **Likelihood Principle (LP)**. The LP states that the evidence provided by data about a parameter depends only on the likelihood function of the observed data, not on the sampling plan or stopping rule.

  *   **The Advisor's Point:** In Null Hypothesis Significance Testing (NHST), the $p$-value depends on the sampling distribution, which changes if you intend to peek. If you peek, you inflate the Type I error rate (false positives). In Bayesian inference, the Bayes Factor is a ratio of likelihoods. Mathematically, you can update a BF after every participant without invalidating the inference, provided the model (including priors) remains fixed.
  *   **The Implication:** If your department had used BFs a decade ago, the *statistical validity* of the inferences drawn from those notebooks would not have been compromised by the weekly peeking. The "evidence" would have accumulated coherently.
  *   **The Caveat:** This assumes the researcher does not change the *prior* based on the interim looks. If a researcher peeks, sees the BF is weak, and then switches from a "default prior" to a "narrower prior" to boost the BF, they have violated the coherence of the Bayesian update.

  ### 2. The Jeffreys-Lindley Paradox
  This is the crux of your skepticism, and it is well-founded. The paradox arises when comparing a point-null hypothesis ($H_0: \delta = 0$) against a composite alternative ($H_1: \delta \neq 0$) with a diffuse prior.

  *   **The Mechanism:** As sample size ($N$) increases, a $p$-value can become arbitrarily small (e.g., $p < .001$), suggesting strong evidence against the null. However, if the prior on the alternative is too diffuse (spread too wide over unlikely effect sizes), the Bayes Factor can strongly favor the *null*. This is because the data are "surprising" under the null, but even *more* "surprising" under the vast majority of the parameter space defined by the alternative.
  *   **Implication for Policy:** Simply swapping to BFs does not guarantee that old findings will be validated. In fact, applying BFs to large-$N$ studies with diffuse priors might retroactively invalidate many "significant" findings from the past decade (including your advisor's).
  *   **Implication for Your Dissertation:** If you are extending old work, be aware that the original effect sizes are likely inflated (due to the optional stopping + publication filter). A Bayesian re-analysis might yield evidence for the null even if the original $p$ was $< .05$. You should plan for robustness checks or internal replications rather than treating the old parameters as ground truth.

  ### 3. "Bayesian Hacking" and Researcher Degrees of Freedom
  While BFs are mathematically robust to optional stopping, they are not immune to human behavior. This is often called **"Bayesian Hacking."**

  *   **The Risk:** If a policy allows optional stopping with BFs but does not require preregistration, a researcher can collect data until $BF_{10} > 3$, stop, and publish. While this maintains Bayesian coherence, it creates a selection bias in the literature. The published BFs will overestimate the evidence because studies that hovered near $BF = 1$ were kept running until they crossed the threshold, or were filed away.
  *   **Calibration:** Recent simulation work suggests that while BFs control error rates better than $p$-values under optional stopping, they are not perfectly calibrated if the stopping rule is data-dependent and the threshold is rigid.
  *   **Policy Takeaway:** A policy that permits optional stopping *must* be paired with transparency. If a lab allows sequential analysis, they must report the stopping rule and the trajectory of the BF, not just the final number.

  ### 4. Preregistration vs. Bayesian Mandates
  Your intuition that swapping frameworks is not a "clean fix" is correct because the replication crisis is not solely a statistical problem; it is a *procedural* one.

  *   **Preregistration:** This locks down the hypothesis, analysis plan, and stopping rule *before* data collection. It distinguishes **confirmatory** research (testing a specific prediction) from **exploratory** research (looking for patterns).
  *   **The Synergy:**
      *   **NHST + Preregistration:** Controls Type I error by fixing the sampling plan.
      *   **Bayes + Preregistration:** Allows flexible data collection (efficient use of resources) while ensuring the priors and models weren't tweaked to achieve a desired BF.
      *   **Bayes + Optional Stopping (No Prereg):** Risks inflating the rate of "false discoveries" in the literature due to selection bias, even if the math for individual studies holds.

  ### 5. Recommendations for the Committee Guidelines
  To draft a policy that is robust, defensible, and diplomatically viable, consider proposing a "Multi-Layered Reform" rather than a single statistical mandate.

  **A. Distinguish Confirmatory vs. Exploratory**
  *   **Policy:** All **confirmatory** studies (those intended to test a specific hypothesis for publication as a primary claim) must be preregistered.
  *   **Rationale:** This addresses the "HARKing" (Hypothesizing After Results are Known) problem, which BFs alone do not solve.

  **B. Bayesian Analysis as Primary, Not Exclusive**
  *   **Policy:** For confirmatory studies, Bayes Factors should be reported alongside effect sizes and confidence/credible intervals. $p$-values may be reported for compatibility with meta-analyses but should not be the sole decision criterion.
  *   **Rationale:** This acknowledges the Lindley Paradox. Reporting both allows the field to see where the frameworks diverge (which is informative regarding prior sensitivity).

  **C. Prior Justification**
  *   **Policy:** If Bayes Factors are used, the choice of prior (especially on the alternative hypothesis) must be justified. Default priors (e.g., Cauchy(0, 0.707)) are acceptable but should be accompanied by a robustness check (e.g., showing how the BF changes with wider/narrower priors).
  *   **Rationale:** This mitigates the Jeffreys-Lindley Paradox. It forces researchers to acknowledge that their evidence depends on what they consider a plausible effect size.

  **D. Sequential Analysis Transparency**
  *   **Policy:** If sequential analysis (optional stopping) is employed using BFs, the stopping rule and the trajectory of the evidence must be reported (e.g., a "BF trajectory plot").
  *   **Rationale:** This leverages the Likelihood Principle's flexibility while maintaining transparency to prevent selection bias.

  ### 6. Advice for Your Dissertation
  Regarding the old lab notebooks and your dissertation:
  1.  **Do not assume the old effects are stable.** The optional stopping practice likely inflated the effect sizes (the "winner's curse").
  2.  **Conduct a "Registered Replication" of the key finding.** Since you are extending this work, treat the original finding as a pilot. Preregister your extension study with a sample size determined by a power analysis (or sequential BF design) *independent* of the old stopping rule.
  3.  **Frame it carefully.** In your dissertation, you can note that "historical data collection practices in the lab followed the norms of the time, which did not account for sequential testing biases in NHST. Therefore, the current study employs preregistration and Bayesian sequential analysis to ensure robust inference." This validates the reform without explicitly accusing your advisor of misconduct.

  ### 7. Diplomatic Framing for Your Advisor
  When presenting this to your advisor/committee, frame the addition of preregistration not as a correction to her Bayesian proposal, but as a **necessary condition to maximize the utility of Bayesian methods.**

  *   **Argument:** "Bayesian methods allow us to be more efficient with data collection (via optional stopping), but to ensure the community accepts these BFs as robust evidence, we need to show that our priors and models weren't influenced by interim looks. Preregistration provides that guarantee, making the Bayesian argument even stronger."

  ### Summary
  Your advisor is right that BFs solve the *mathematical* problem of optional stopping. You are right that they do not solve the *sociological* problem of researcher flexibility. The Jeffreys-Lindley paradox warns us that BFs can be conservative to the point of contradicting significant $p$-values if priors are not chosen carefully.

  **The Verdict:** A policy mandating Bayes Factors **without** preregistration is insufficient. A policy mandating **Preregistration + Bayes Factors + Prior Robustness Checks** is the current gold standard for reform. This approach protects the department from future replication failures without invalidating the past, while giving you a solid methodological foundation for your dissertation.
