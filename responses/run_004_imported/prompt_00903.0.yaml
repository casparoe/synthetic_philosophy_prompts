answer: |-
  This is one of the great ironies in the history of philosophy, and it is a fantastic catch for an AP Euro student. You have stumbled onto the tension between Hobbes the **system-builder** and Hobbes the **stubborn human**.

  To answer your question: Hobbes's relationship with geometry is fundamentally different from Spinoza's or Descartes', and the Wallis feud actually reveals something profound (and dark) about Hobbes's philosophy rather than just making him look silly.

  Here is the breakdown of why Hobbes is unique among the "geometric" philosophers, and how his mathematical humiliation fits weirdly well with his political theory.

  ### 1. Hobbes vs. The Rationalists: Discovery vs. Construction

  When textbooks say Hobbes (and Spinoza, Descartes, etc.) wanted philosophy to be "like geometry," they usually gloss over a massive metaphysical difference.

  **The Broad Rationalist View (Descartes, Spinoza, Leibniz):**
  For most Rationalists, geometry is certain because it reflects the **divine structure of reality**. God is a geometer; the universe is written in the language of mathematics. When we do geometry, we are *discovering* truths that exist independently of us. We are aligning our minds with the objective order of the cosmos.
  *   **Spinoza:** When he writes *Ethics* "in geometrical order," he is claiming that human emotions and God are part of the same necessary, deterministic chain as triangles and circles.

  **Hobbes's Specific View (Materialism & Nominalism):**
  Hobbes is a materialist. He doesn't believe in abstract forms or a divine mathematical realm. For Hobbes, geometry is certain **only because we invented it.**
  *   **The *Verum Factum* Principle:** Hobbes anticipates the idea that "we can only truly know what we have made." God made nature, so only God has "scientific" knowledge of nature. Humans can only have opinions about physics/biology.
  *   **Human Construction:** But humans *made* geometry. We defined the point, the line, and the circle. Therefore, we can have absolute certainty about geometry.
  *   **The Political Extension:** This is the crucial AP Euro link. Humans also make the **State** (the Leviathan). The State is an "artificial man." Because we construct the Commonwealth through contract, we can have "scientific" certainty about politics, just like geometry. We cannot have that certainty about nature (God's domain), but we can have it about politics (our domain).

  **The Difference:**
  *   **Spinoza:** Geometry proves the truth of the Universe.
  *   **Hobbes:** Geometry proves the truth of Human Construction (including the State).

  ### 2. The Wallis Feud: Hubris or Consistency?

  Thomas Hobbes spent roughly 25 years (from age 60 until he died at 91) publishing claims that he had squared the circle. John Wallis, the Savilian Professor of Geometry at Oxford, publicly dismantled every single attempt. Hobbes never conceded. He once wrote, "I have done it," even after Wallis showed the math was impossible.

  Does this undercut his philosophy? **Practically, yes. Philosophically, no.** In fact, it reinforces his darkest insights.

  #### A. Nominalism and the War of Words
  Hobbes was a **nominalist**. He believed that universal truths don't exist; only names (words) exist. "Truth" is simply the correct ordering of names in a proposition.
  *   **The Conflict:** For Wallis, math was about objective reality. For Hobbes, math was about **definitions**. Hobbes likely believed that if *he* defined the terms of the problem one way, and Wallis defined them another, they weren't even arguing about the same thing.
  *   **The Consistency:** In *Leviathan*, Hobbes argues that disputes over definitions lead to civil war. The solution is not "debate until we find the truth," but rather **an Authority decides the definition.** Hobbes viewed himself as the Sovereign of his own philosophy. For him to concede to Wallis would be to submit to an external authority, which violates his own concept of autonomy.

  #### B. Geometry as Physical Construction vs. Symbolic Algebra
  This is a technical but important point. Wallis was part of the new wave of mathematicians using **algebra and symbols**. Hobbes hated this. He believed geometry had to be about **physical construction** (drawing lines, moving bodies).
  *   Hobbes thought Wallis was playing "symbol games" without understanding the physical reality of space.
  *   **Consistency:** This matches Hobbes's materialism. He didn't believe in invisible forces or abstract numbers. He believed in matter in motion. He refused to accept a mathematical proof that didn't correspond to a physical construction he could visualize. He wasn't just being stubborn; he was being consistent with his materialist metaphysics, even if it made him bad at math.

  #### C. The Fear of Chaos
  Hobbes's entire philosophy is driven by a terror of uncertainty. The "State of Nature" is a war of all against all because there is no common power to enforce truth.
  *   **Admitting Error = Chaos:** If Hobbes admits he is wrong about the circle, he introduces uncertainty into his system. If his geometry is wrong, his physics (*De Corpore*) is wrong. If his physics is wrong, his politics (*Leviathan*) loses its scientific foundation.
  *   **The Sovereign Stance:** In Hobbes's political theory, the Sovereign cannot be unjust, because the Sovereign *defines* justice. Similarly, in his philosophical system, Hobbes acts as the Sovereign. To admit error is to invite the "civil war" of disputation. His stubbornness was a psychological manifestation of his political theory: **Certainty is more important than correctness because certainty prevents conflict.**

  ### 3. Summary for AP Euro Context

  If you need to synthesize this for class or an essay, here is the takeaway:

  1.  **Scientific Revolution Context:** Hobbes represents a specific strand of the Scientific Revolution. Unlike the Royal Society (Wallis, Boyle), which valued **empirical consensus and peer review**, Hobbes valued **deductive certainty from first principles**. He wanted politics to be a closed system, like math, not an open debate.
  2.  **Absolutism:** The Wallis feud mirrors Hobbes's political absolutism. Just as the King should not have to justify his laws to the Parliament (which leads to chaos), Hobbes believed he should not have to justify his definitions to the mathematical community.
  3.  **The Irony:** Hobbes championed reason to escape the violence of passion, but his refusal to accept mathematical proof was driven by the **passion of pride** and the **fear of being wrong**.

  **Verdict:** The Wallis humiliation makes Hobbes look like a crank to historians of mathematics, but it makes him look like a **consistent authoritarian** to historians of philosophy. He applied his political solution (Sovereign Authority) to epistemology (Knowledge). He decided that *he* was the Sovereign of Truth in his own system, and no amount of evidence from Wallis could overthrow him.

  It's a perfect example of how a philosopher's personal psychology can become embedded in their system. Hobbes wanted a world without dispute, so he built a philosophy that refused to admit it was disputed.
