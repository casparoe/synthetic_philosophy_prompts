      *   *The Vampire Collapse:* Mill would dismiss the vampire case as metaphysically null. No experience = no data = no judgment. It's a category error for a utilitarian.
      *   *The Parenthood Distinction:* Mill would argue parenthood is an "experiment in living" with existing data.
