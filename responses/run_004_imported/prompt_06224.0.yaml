answer: |-
  This is a genuinely sharp philosophical catch. You've hit on a tension that L.A. Paul herself acknowledges (she discusses Mill in the book), but your specific framing of the "Competent Judge" problem regarding vampires vs. parents cuts right to the bone of where classical empiricism and modern decision theory diverge.

  If we could resurrect John Stuart Mill, give him a copy of *Transformative Experience*, and sit him down for a chat, here is how I think the conversation would go, based on his commitments to empiricism, uniformity of human nature, and social utility.

  ### 1. Mill's Reaction: Vindication on Epistemology, Resistance on Rationality

  Mill would likely nod vigorously at Paul's **epistemic** point. As a radical empiricist, Mill agrees that knowledge comes from experience. His entire argument for "higher pleasures" rests on the premise that you cannot know the quality of a pleasure without experiencing it. He would agree that you cannot run a standard cost-benefit analysis on an experience you cannot conceive.

  However, Mill would push back hard on Paul's conclusion that **rationality breaks down**.

  For Paul, if you can't assign a subjective utility value to an outcome, you can't make a rational choice based on expected utility. For Mill, rationality isn't just about *your* internal calculation; it's about **inductive reasoning based on available evidence**.

  Mill would argue: "Just because *I* haven't been a parent (or a vampire) doesn't mean *no one* has. If there is a consensus among competent judges, that constitutes empirical data."

  Mill treats the verdict of competent judges not as a mystical oracle, but as **scientific testimony**. If 90% of people who have experienced both A and B say A is preferable, a rational agent who has only experienced B should choose A, *even if they can't imagine what A is like*. They are deferring to the data.

  So, Mill would say Paul is right that *imagining* the outcome is impossible, but wrong that *calculating* the value is impossible. You calculate it using the testimony of others as a proxy for your own future experience.

  ### 2. The Vampire vs. The Parent: Where Mill's System Collapses

  This is where your specific question about the "Competent Judge" fix is most potent.

  **The Parenthood Case:**
  Mill's system works reasonably well here. There are millions of "competent judges" (parents). We can aggregate their testimony. We can observe the effects of parenthood on human character and happiness. Mill would argue that because human nature is sufficiently uniform, the testimony of other parents is valid evidence for *your* decision. If the "competent judges" of humanity generally report that the joys of parenthood outweigh the costs (once the initial shock wears off), then it is rational to choose parenthood based on that inductive evidence.

  **The Vampire Case:**
  Mill's system crashes immediately. Why? Because **vampires don't exist.**
  Mill is an empiricist. He has no use for metaphysical thought experiments that lack empirical referents. If there are no vampires, there are no competent judges. If there are no competent judges, there is no data. If there is no data, there is no rational basis for decision-making *at all*—not even Paul's "revelation" value.

  Mill would likely dismiss the vampire example as a **category error**. It's like asking a utilitarian to calculate the moral weight of a wizard's spell. Since the premise violates the laws of nature (as understood by Mill), it falls outside the scope of moral science.

  ### 3. Is the Vampire a Red Herring?

  Here is the critical philosophical pivot. You asked: *If it collapses for vampires but works for parents, is the vampire example a red herring, or does it undermine the parenthood case too?*

  **Mill's Answer:** It is a red herring.
  Mill believes in the **Uniformity of Human Nature**. He thinks that what makes a "higher pleasure" higher is that it appeals to faculties common to all humans (intellect, imagination, moral sentiment). Therefore, if one competent judge prefers the life of the intellect, another human can trust that verdict because they share the same basic machinery. The parenthood case is valid because it involves real humans sharing a nature. The vampire case is invalid because it posits a being with a *different* nature (different senses, different values). For Mill, the vampire example proves nothing about human decision-making because vampires aren't human.

  **Paul's Counter (and why it might undermine Mill):**
  Paul would argue the vampire isn't about blood-drinking; it's about the **structure of value change**.
  Her point is that becoming a parent *also* changes your "nature" enough that the "pre-parent you" and "post-parent you" are effectively different agents with different utilities.
  If Mill relies on the testimony of *other* parents, Paul asks: "Why does *their* transformation authorize *my* choice?" Their values shifted in *their* way. Your values might shift differently.

  If Paul is right that transformative experiences create a **discontinuity of self**, then Mill's "Competent Judge" solution is actually a sleight of hand. It smuggles in an assumption that *their* experience maps onto *yours*.
  *   If the vampire example shows that radical value change makes rational choice impossible...
  *   And parenthood involves radical value change...
  *   Then the fact that vampires are fake doesn't save parenthood from the logical problem.

  **The Verdict:**
  The vampire example is a **reductio ad absurdum** designed to isolate the logic of transformation from the noise of everyday life.
  *   **If you side with Mill:** The vampire is a red herring. Empirical data (other parents) bridges the epistemic gap. Human nature is stable enough that testimony works.
  *   **If you side with Paul:** The vampire is the "control group." It shows that when value change is total, rationality fails. Since parenthood *also* changes values (just less totally than vampirism), the same logical problem applies, just to a lesser degree. The "Competent Judge" fix fails because the Judge is no longer *you*.

  ### 4. How Mill's "Experiments in Living" Saves Him (Sort of)

  There is one place where Mill actually anticipates Paul and has a better answer than just "defer to judges." It's in *On Liberty*.

  Mill argues for **"experiments in living."** He explicitly says we need people to try new things to discover new truths about human happiness.
  Mill might say to Paul: "You are worried about how to decide *before* the leap. I am telling you that the *act of leaping* is the utility."

  For Mill, the "higher pleasure" isn't just the outcome (being a parent); it's the **development of the faculties** required to make the choice and live the life.
  *   **Paul's Solution:** Choose "revelation" (value the new experience regardless of content).
  *   **Mill's Solution:** Choose "individuality" (value the development of your human capacities).

  Mill would argue that even if you can't know what it's like to be a parent, you *can* know that exercising your capacity for deep attachment, responsibility, and nurture is a "higher" use of human faculties than remaining unattached. You don't need to know the specific qualia of the future; you just need to know that expanding your human capacities is generally utility-maximizing.

  ### Summary: The Resurrection Verdict

  If you walked Mill through this:

  1.  **On Epistemology:** He agrees. You can't know the feeling without the experience.
  2.  **On Rationality:** He disagrees. Testimony from competent judges *is* rational data.
  3.  **On Vampires:** He dismisses them as empirically null. No judges, no data, no decision.
  4.  **On Parenthood:** He insists the "Competent Judge" works because human nature is uniform.
  5.  **The Weak Point:** Paul exposes that Mill's "Uniformity of Human Nature" is an assumption, not a fact. If transformation changes your nature enough (as Paul argues), then *other* people's testimony becomes less relevant to *your* choice.

  **Does the vampire example undermine the parenthood case?**
  Only if you accept Paul's premise that value change is **incommensurable**.
  *   **Mill says:** Values can be compared across time and people via competent judges. (Vampire example fails).
  *   **Paul says:** Values before and after transformation are incommensurable. (Vampire example succeeds, and by extension, so does parenthood).

  Mill would likely conclude that the vampire example is a fun fantasy, but the "parenthood case" is settled by the overwhelming empirical consensus of humanity. Paul would conclude that the vampire example reveals a flaw in the logic of *all* transformative choices, regardless of whether the transformation is magical or biological.

  Ultimately, Mill is building a **social science of ethics** (relying on aggregates and uniformity), while Paul is analyzing **individual decision theory** (relying on subjective authorization). They are talking past each other slightly, but your intuition is correct: Mill's "competent judges" is the 19th-century ancestor of Paul's "revelation," but Mill trusts the collective past, while Paul trusts the individual future.
