answer: |-
  Here are three options ranging from "classic objection" to "technical mess" to "departmental relatability." All of them are designed to fail if you don't know the difference between strict identity and the counterpart relation.

  ### Option 1: The Humphrey Objection (Classic)
  *This one leans on the famous objection that Lewis's view severs the emotional/practical connection we have to our modal properties. It highlights that counterparts are distinct individuals.*

  **Humphrey:** "David, could I have won the election?"
  **Lewis:** "Strictly, no. You are worldbound. But in W₁₉, a counterpart of you won."
  **Humphrey:** "What if I have two counterparts in W₁₉? One won, one lost?"
  **Lewis:** "Then possibly you won, and possibly you lost."
  **Humphrey:** "So my modal profile depends on a headcount of doppelgangers?"
  **Lewis:** "It depends on the similarity weighting."
  **Humphrey:** "I'm voting Kripke."

  ### Option 2: The Multiple Counterparts Problem (Technical)
  *This one targets the specific technical messiness of Lewis's view where one actual individual can have multiple counterparts in a single world with divergent properties, making de re modality indeterminate.*

  **Wife:** "In another possible world, could you have been faithful?"
  **Lewisian:** "Sure. In W₄₂, a counterpart of me is faithful."
  **Wife:** "But in W₄₂, you have another counterpart who's cheating."
  **Lewisian:** "Well, with multiple counterparts, de re modality is indeterminate."
  **Wife:** "I don't care about indeterminacy. I care about identity."
  **Lewisian:** "There is no cross-world identity."
  **Wife:** "There won't be any marriage either."

  ### Option 3: The "Worldbound" Breakup (Short & Punchy)
  *This one works best if you want something shorter that fits in the corner of the board. It contrasts Kripke's romantic modal optimism with Lewis's concrete isolationism.*

  **Kripkean Ex:** "In another life, we're still together."
  **Lewisian Ex:** "No, in another life, *counterparts* of us are together. We are worldbound and broken up."
  **Kripkean Ex:** "That's the coldest thing I've ever heard."
  **Lewisian Ex:** "No, the coldest thing is the vast modal realism separating us."

  ***

  **Why these land:**
  *   **No Generic Worlds:** None of these work if you just swap "possible worlds" for "parallel universes" in a sci-fi sense. They require the specific metaphysical machinery (worldboundedness, similarity relations, haecceities/identity).
  *   **The Humphrey Nod:** Option 1 explicitly names Humphrey, which is the immediate shibboleth for "I have read *On the Plurality of Worlds*."
  *   **The Indeterminacy:** Option 2 references the specific headache of having *two* counterparts in one world, which is a deeper cut than just "counterparts exist."
  *   **The Rivalry:** All three position Kripke and Lewis as opposing teams, which mirrors the actual seminar dynamic.

  **My recommendation:** Go with **Option 1**. It's the most recognizable "inside joke" for modal metaphysicians, and the punchline ("I'm voting Kripke") ties the Humphrey Objection back to the actual election Humphrey lost.
