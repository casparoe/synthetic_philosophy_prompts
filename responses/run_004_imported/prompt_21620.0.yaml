      *   *The Argument:* She has new, specific reasons not captured by the historical data (Inside View).
      *   *The Hanson/Yudkowsky Angle:* Hanson generally argues for deference to consensus/aggregates unless you have a specific reason to think you're better. Yudkowsky often argues for the possibility of rare, high-insight individuals seeing what the aggregate misses. Here, the "aggregate" is actually her own past performance (personal calibration), not necessarily the committee's consensus.
