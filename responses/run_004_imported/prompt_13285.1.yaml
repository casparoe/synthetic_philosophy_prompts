          *   Identity: Who is being punished?
          *   Educational context: Schools act *in loco parentis* and have rehabilitative goals distinct from the state's penal system.
      *   *Legal/Philosophical Concepts:*
          *   Fungibility (money vs. time/body).
          *   Specific vs. General Deterrence.
          *   Moral Agency/Responsibility.
          *   *In loco parentis* (school's role).
          *   Substitutability in law (vicarious liability vs. personal liability).

  3.  **Deconstructing the Dean's Argument:**
      *   *Dean's View:* Utilitarian/Consequentialist. The room needs to be occupied for 6 hours. The disruption is neutralized. The cost to the school is the same (supervision).
      *   *Flaw:* Ignores the *subject* of the punishment. Punishment is usually agent-specific.

  4.  **Deconstructing the User's Intuition:**
      *   *Intuition:* Punishment should attach to the *wrongdoer*.
