answer: |-
  This is an excellent question. In fact, you have identified the single most common and immediate objection to dialetheism. If you walk into a seminar on this topic, you are essentially asking the question that defines the entire debate.

  The short answer is: **Dialetheists reject the Principle of Explosion.**

  The longer answer requires unpacking *why* they are allowed to do that, how their logic works, and why this doesn't collapse into absurdity. Here is the breakdown of why dialetheism is taken seriously despite your very valid concern.

  ### 1. You are applying Classical Logic to a Non-Classical System
  Your objection relies on the **Principle of Explosion** ( *ex falso quodlibet*), which states that from a contradiction ($A \land \neg A$), any proposition ($B$) follows.
  $$ (A \land \neg A) \to B $$

  In **Classical Logic**, this principle is valid. Therefore, in Classical Logic, if you admit even one true contradiction, you become a **Trivialist** (someone who believes everything is true). If everything is true, then "the moon is made of cheese" is true, logic collapses, and the position is indeed self-defeating.

  However, Graham Priest and other dialetheists do not use Classical Logic. They use **Paraconsistent Logic**.

  ### 2. Paraconsistency: Blocking the Explosion
  A logic is **paraconsistent** if it rejects the Principle of Explosion. In these systems, the fact that a contradiction is true does *not* infect the rest of the system.

  Priest's specific system is called **LP (Logic of Paradox)**. Here is the rough sketch of how it avoids your "moon made of cheese" problem:

  *   **Classical Logic:** A sentence is either True or False. If premises are True, the conclusion must be True.
  *   **LP:** A sentence can be **True only**, **False only**, or **Both True and False**.
  *   **Validity:** An argument is valid if the truth is *preserved*. That is, if the premises are "at least true" (which includes "Both"), the conclusion must be "at least true."

  **Why Explosion fails in LP:**
  Imagine $A$ is "Both True and False."
  1.  Premise 1: $A$ (Value: Both)
  2.  Premise 2: $\neg A$ (Value: Both)
  3.  Conclusion: $B$ ("The moon is made of cheese")

  If we assign $B$ the value **False only**, the inference fails. Why? Because the premises have the value "Both" (which counts as "designated" or "truth-like"), but the conclusion has the value "False" (which is not designated). Therefore, truth was *not* preserved. The argument is invalid.

  By invalidating Explosion, Priest can assert that the Liar Sentence is a true contradiction without being forced to accept that the moon is made of cheese.

  ### 3. Dialetheism $\neq$ Trivialism
  This is the most crucial distinction.
  *   **Trivialism:** The view that *all* sentences are true. (This is indefensible).
  *   **Dialetheism:** The view that *some* sentences are both true and false.

  Dialetheists are very careful to distinguish between contradictions that arise from semantic paradoxes (like the Liar) or specific metaphysical boundaries, and ordinary empirical claims.

  Priest would say: "The Liar Sentence is a true contradiction. The statement 'The moon is made of cheese' is simply false." Because Explosion is blocked, the truth of the Liar does not leak out to the moon.

  ### 4. Why is this worth debating? (The Philosophical Payoff)
  If dialetheism just seems like "cheating" to avoid paradoxes, why do serious logicians study it? There are three main reasons:

  **A. It solves semantic paradoxes naturally**
  Classical logic has a hard time with the Liar Sentence ("This sentence is false").
  *   If it's true, it's false.
  *   If it's false, it's true.
  Classical solutions usually involve complex hierarchies of language (Tarski) or denying that the sentence is meaningful. Priest argues these are *ad hoc* fixes. Dialetheism accepts the derivation: The sentence is true, and it is false. It treats the paradox as data rather than a disease to be cured.

  **B. Inconsistent Information is Common**
  In computer science, law, and database management, we often deal with inconsistent information that we don't want to crash the system.
  *   *Example:* A legal database says Person X is a minor (under 18). Another entry says Person X signed a contract (which requires being an adult).
  *   A classical system crashes (Explosion).
  *   A paraconsistent system flags the contradiction but allows the database to keep functioning and answering other queries. Dialetheism provides the logical underpinning for reasoning with inconsistent information.

  **C. Metaphysical Boundaries**
  Priest argues that contradictions exist at "boundary states."
  *   *Example:* Walking through a doorway. At the exact instant you are crossing the threshold, are you in the room or out of the room? Priest argues you are arguably both.
  *   *Example:* Change. At the instant a light switches from off to on, is it on or off?
  Dialetheism offers a model for handling these transitional states without resorting to vague "neither/nor" solutions.

  ### 5. The Cost: What do they give up?
  You might ask: "If they can just reject Explosion, can't they reject anything?"
  There is a cost. To save Dialetheism from Trivialism, you usually have to sacrifice **Disjunctive Syllogism**.

  Disjunctive Syllogism is the rule:
  1.  $A \lor B$
  2.  $\neg A$
  3.  Therefore, $B$

  In Paraconsistent Logic, if $A$ is "Both True and False," then $\neg A$ is also "Both." If $A$ is true (even partially), $A \lor B$ is true. But $B$ could still be False. So, the inference doesn't hold universally.
  Priest argues this is a small price to pay for avoiding Trivialism and solving the Liar Paradox. Critics argue that Disjunctive Syllogism is too fundamental to give up. **This is where the actual debate lies.**

  ### Summary
  Your intuition is correct for **Classical Logic**: In classical logic, dialetheism *would* be self-defeating.

  But Dialetheists propose a **Paraconsistent Logic** where:
  1.  Contradictions do not explode.
  2.  Dialetheism is distinct from Trivialism.
  3.  We can accept true contradictions in specific cases (paradoxes/boundaries) without accepting that the moon is made of cheese.

  It is treated as a serious position not because it is obviously true, but because it offers a robust, formal way to handle paradoxes and inconsistency that classical logic struggles with, without collapsing into absurdity. The debate is now about whether the cost (losing Explosion/Disjunctive Syllogism) is worth the benefit (solving the Liar).

  **Recommended Reading:** If you haven't read it yet, look at Priest's *In Contradiction*, specifically the chapters where he defines LP and addresses the "Explosion" objection directly. It will clarify the formal semantics for you.
