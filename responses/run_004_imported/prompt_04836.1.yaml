answer: |-
  **Title:** The Moral Fiction and the Legal Necessity: Reconciling Revisionism and Traditionalism in the Moral Equality of Combatants

  **Introduction**

  The ethics of war are haunted by a fundamental tension between the logic of individual morality and the realities of collective violence. At the heart of this tension lies the doctrine of the Moral Equality of Combatants (MEC). Traditional Just War Theory, most prominently articulated by Michael Walzer, posits that *jus in bello* (justice in war) is independent of *jus ad bellum* (justice of war). Under this view, soldiers fighting for an unjust cause possess the same moral standing and legal rights as those fighting for a just cause, provided they adhere to the rules of engagement. They are moral equals. In contrast, the revisionist account championed by Jeff McMahan argues that morality is continuous. If a war is unjust, the combatants fighting it are essentially engaged in a form of aggravated assault; they possess no right to kill their opponents, even if they follow the rules of war, because they pose an unjustified threat.

  This essay evaluates the conflict between McMahan's revisionist individualism and Walzer's traditionalist conventionalism. McMahan's argument is philosophically superior in establishing individual moral responsibility, successfully dismantling the coherence of the Traditionalist view. However, Walzer's defense of combatant equality rests on pragmatic necessities regarding epistemic limitation and the preservation of humanitarian constraints. Consequently, this essay argues for a bifurcated verdict: while McMahan is correct that the MEC is a *moral fiction*, Walzer is correct that it is a *legal necessity*. To minimize human suffering, international law must retain Walzer's symmetrical framework for combatants on the ground, but it must integrate McMahan's asymmetrical morality into the accountability structures for political leadership and retrospective judgment. To adopt McMahan's view as the primary regulatory standard for soldiers would be to risk the total collapse of *jus in bello*; to adopt Walzer's view as a moral truth is to indulge in dangerous hypocrisy.

  **The Revisionist Challenge: McMahan's Logic of Self-Defense**

  Jeff McMahan's critique of the Traditionalist view begins by stripping away the institutional veil of the state and analyzing war through the lens of individual morality. He argues that the rights of combatants cannot be derived from their membership in a military organization but must stem from the same principles that govern interpersonal violence in domestic life. The central analogy is that of self-defense. In a domestic context, if an aggressor attempts to kill an innocent victim, the victim has a right to kill the aggressor in self-defense. The aggressor, however, has no right to kill the victim, even if the victim fights back effectively. The aggressor's liability to be killed stems from their moral responsibility for an unjust threat.

  McMahan applies this logic to war. Combatants fighting a just war are analogous to the innocent victim; they are defending themselves or others against an unjust threat. Combatants fighting an unjust war are analogous to the aggressor; they are the source of the unjust threat. Therefore, McMahan argues, *jus in bello* cannot be independent of *jus ad bellum*. If a soldier fights for an unjust cause, their acts of killing are morally wrongful, regardless of whether they discriminate between combatants and civilians or observe proportionality. They are not moral equals to their opponents.

  Crucially, McMahan distinguishes between *justification* and *excuse*. He acknowledges that many unjust combatants may not be fully culpable for their actions due to epistemic limitations. Soldiers are often subject to propaganda, limited information, and coercive pressure from their own state. Thus, while an unjust combatant is not *justified* in killing (their action remains objectively wrong), they may be *excused* from blame if they reasonably believed their cause was just. This nuance allows McMahan to maintain moral rigor without demanding impossible omniscience from individual soldiers. However, the core conclusion remains: the Traditionalist claim that soldiers on both sides have an equal right to kill is a logical fallacy. One side is defending rights; the other is violating them.

  **The Traditionalist Defense: Walzer's War Convention**

  Michael Walzer's defense of the Moral Equality of Combatants is not based on the claim that McMahan's moral logic is incorrect, but rather that it is inapplicable to the unique institution of war. In *Just and Unjust Wars*, Walzer argues that war is a collective enterprise where the "separation of *jus ad bellum* and *jus in bello*" is a vital convention. This separation serves two primary functions: protecting soldiers from the burden of political judgment and preserving the constraints of *jus in bello*.

  First, Walzer emphasizes the epistemic position of the soldier. Determining the justice of a war (*jus ad bellum*) is a complex political judgment involving historical context, international law, and intelligence data. It is the responsibility of political leaders, not the individual infantryman. To demand that soldiers assess the justice of their cause before fighting is to demand they act as judges in their own case, a position fraught with bias and uncertainty. If soldiers were required to determine the justice of their cause to determine their right to fight, many would be paralyzed by doubt, or conversely, convinced of their own righteousness regardless of evidence.

  Second, and more critically, Walzer argues that abandoning combatant equality undermines the laws of war. The Geneva Conventions rely on reciprocity. If the "unjust" side is told they have no moral standing and no right to fight, they have no incentive to follow the rules of engagement. Why should an "unjust" combatant treat prisoners humanely or avoid civilian targets if they are already deemed moral criminals simply for participating? Walzer contends that granting equal status to all combatants encourages compliance with *jus in bello* rules. By treating the enemy as a legitimate combatant rather than a criminal, we create a reciprocal expectation of restraint. To adopt McMahan's view is to risk turning every war into a total war where the "unjust" side fights without restraint because they have nothing to lose morally.

  **Evaluating the Moral Cost of Traditionalism**

  While Walzer's pragmatic concerns are significant, McMahan's critique exposes a profound moral cost in the Traditionalist framework. By granting moral equality to unjust combatants, Walzer creates what revisionists call a "moral lacuna." The Traditionalist view effectively absolves individuals of responsibility for participating in aggressive war, provided they do not commit war crimes. This leads to the counterintuitive conclusion that a soldier who kills ten enemy combatants in an unjust war is morally equivalent to a soldier who kills ten enemy combatants in a just war, assuming both follow the rules.

  This abstraction is dangerous. It facilitates the machinery of aggression by allowing soldiers to view themselves as mere instruments of the state, devoid of moral agency. History is replete with examples of soldiers claiming they were "just following orders" or "just fighting the enemy" while participating in manifestly unjust conflicts. McMahan's revisionism restores moral agency to the individual. It insists that participating in an unjust war is a serious moral wrong, even if the soldier is excused due to ignorance. This shift is essential for the development of a global moral consciousness that discourages aggressive war at the grassroots level. If soldiers understand that their participation in an unjust war makes them morally liable to be killed and morally culpable for killing, the political cost of launching aggressive wars may rise.

  However, accepting McMahan's moral critique does not automatically validate his framework as a guide for action. The fact that unjust combatants are morally wrong does not necessarily mean the laws of war should treat them as criminals *during* the conflict. Here, the Traditionalist's practical defense gains traction. The moral truth of asymmetry does not translate well into the regulatory reality of symmetrical law.

  **Evaluating the Practical Risk of Revisionism**

  If McMahan's revisionism were adopted as the standard for international law, the consequences could be catastrophic for humanitarian protection. The primary risk is the erosion of *jus in bello* compliance. As Walzer suggests, the laws of war function as a convention between enemies who do not trust each other. This convention relies on the mutual recognition of status. If one side declares the other "unjust" and therefore devoid of combatant rights, the declared "unjust" side is likely to reject the constraints of war entirely.

  Furthermore, the epistemic problem remains unresolved in a legal context. Who determines which side is unjust? In the heat of battle, both sides invariably believe their cause is just. If the right to humane treatment depends on the objective justice of one's cause, then every soldier has an incentive to claim their opponent is the unjust aggressor to justify treating them harshly. This leads to a "race to the bottom" where humanitarian protections are contingent on political claims rather than universal rights.

  Additionally, McMahan's distinction between justification and excuse is difficult to codify in law. A legal system requires clear bright lines. Telling a soldier, "You are not justified in shooting, but you are excused," is a philosophical nuance that offers little guidance in the chaos of combat. Law operates on general rules to ensure predictability. Walzer's rule—"all uniformed combatants are legitimate targets and have the right to fight"—is clear, symmetrical, and enforceable. McMahan's rule—"only just combatants have the right to fight"—is ambiguous and contingent on facts that are often disputed until long after the war ends. Therefore, while McMahan is right about the *morality*, his framework is ill-suited for the *regulation* of ongoing conflict.

  **Verdict: A Dual-Track Approach to War and Morality**

  The conflict between Walzer and McMahan is not a zero-sum game where one must be wholly accepted and the other wholly rejected. Instead, the verdict must distinguish between the *ethics of judgment* and the *law of conduct*.

  McMahan is correct that the Moral Equality of Combatants is a moral fiction. There is no metaphysical magic in a uniform that renders an unjust aggressor equal to a just defender. To pretend otherwise is to obscure the reality of violence and diminish individual responsibility. Therefore, in the sphere of moral education, historical judgment, and political accountability, McMahan's revisionism must prevail. We must teach that fighting for an unjust cause is a moral wrong, even if excusable. We must hold political leaders accountable for placing soldiers in the position of being unjust aggressors. This aligns with the Nuremberg Principles, which established that "following orders" is not a defense for crimes against peace. McMahan's philosophy provides the theoretical underpinning for holding leaders responsible for *jus ad bellum* violations while acknowledging the excusable ignorance of the rank and file.

  However, Walzer is correct that the Moral Equality of Combatants is a legal necessity. In the sphere of international humanitarian law (IHL) and the immediate conduct of war, the Traditionalist framework must be retained. The primary goal of IHL is the minimization of suffering, not the administration of perfect moral justice. To achieve this, the law must treat combatants symmetrically. Unjust combatants must be granted prisoner-of-war status and protection from summary execution. They must be encouraged to follow *jus in bello* rules by guaranteeing them reciprocal treatment. To strip them of this status based on the justice of their cause would incentivize atrocities and undermine the fragile conventions that protect civilians and prisoners.

  Therefore, the definitive verdict is this: We must adopt Walzer's rules but abandon Walzer's justification for them. We should maintain the legal convention of combatant equality not because it is morally true (it is not, as McMahan proves), but because it is practically indispensable for humanitarian protection. We must acknowledge the "lie" of combatant equality as a tragic necessity. By admitting that unjust combatants are morally liable but legally protected, we preserve the humanitarian benefits of Walzer's convention without succumbing to the moral confusion he warns against.

  This approach avoids the trap of saying "both sides have a point" by assigning hierarchy and domain. McMahan's revisionism holds the higher ground on *truth*: it accurately describes the moral reality of killing in war. Walzer's traditionalism holds the higher ground on *utility*: it accurately describes the regulatory requirements to limit bloodshed. In a perfect world, McMahan's morality would govern. In our imperfect world, Walzer's laws must regulate, informed by McMahan's truth.

  **Conclusion**

  The dispute over the Moral Equality of Combatants reveals the tragic gap between what is morally right and what is practically possible in the regulation of violence. Jeff McMahan successfully demonstrates that the Traditionalist view is morally incoherent; soldiers fighting for an unjust cause do not possess an equal right to kill. However, Michael Walzer correctly identifies that enforcing this moral truth through international law would likely result in greater suffering by eroding the incentives for compliance with the laws of war.

  The resolution lies in recognizing that law and morality serve different functions. Morality seeks truth and accountability; law seeks order and harm reduction. Consequently, we must defend Walzer's framework as the binding standard for the laws of war to ensure that *jus in bello* constraints remain robust and reciprocal. Simultaneously, we must embrace McMahan's revisionism as the standard for moral education and post-conflict accountability, ensuring that we do not mistake legal immunity for moral innocence. By maintaining this distinction, we can preserve the humanitarian protections of the War Convention without losing sight of the moral reality that not all wars, and not all killers, are equal.
