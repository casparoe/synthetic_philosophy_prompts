answer: |-
  This is a fascinating philosophical collision. You are asking how an 18th-century empiricist, who dismantled the rationalist foundations of causality and induction, would respond to a late-20th-century argument that attempts to derive a substantive empirical conclusion (human extinction) from a purely formal probabilistic premise (birth rank).

  If we reconstruct Hume's epistemological commitments—specifically his distinction between *relations of ideas* and *matters of fact*, his skepticism regarding "chance," and his insistence on causal mechanisms for predictions—it is highly probable that **Hume would reject the Doomsday Argument (DA) as a paradigmatic example of sophistry and illusion.** He would likely view it as an attempt to derive a matter of fact from abstract reasoning without the necessary empirical footing.

  Here is a reconstruction of how Hume's specific commitments would bear on the Doomsday Argument.

  ### 1. Matters of Fact vs. Relations of Ideas
  Hume's first fork is crucial here. He divides human reasoning into two categories:
  *   **Relations of Ideas:** Truths discoverable by thought alone (math, logic), which are certain but tell us nothing about the world.
  *   **Matters of Fact:** Truths about the world (existence, events), which are uncertain and rely on experience.

  The Doomsday Argument claims to be a probabilistic inference about a *matter of fact* (when humanity will end). However, its engine is the Self-Sampling Assumption (SSA), which functions like a logical or mathematical constraint on observer reference classes.

  Hume would argue that the DA attempts to bridge this gap illegitimately. It tries to use a formal principle (SSA/Bayesian updating) to generate knowledge about the physical future without new empirical input. For Hume, no amount of abstract reasoning about "birth ranks" can reveal a matter of fact about the duration of the species. To claim otherwise is to treat the existence of future humans as a *relation of ideas*, which it is not. As he writes in the *Enquiry*, "Nothing is ever really present with us but our own perceptions... Beyond the senses or consciousness, we can never prove the existence of body or of soul." To make claims about the totality of future souls based on current position is to reason beyond the bounds of possible experience.

  ### 2. The Critique of "Chance" and the Lack of Causal Mechanism
  This is perhaps Hume's strongest objection. In *A Treatise of Human Nature*, Hume argues that "chance" is not a real thing in the world; it is merely a reflection of our ignorance of causes.
  > *"Though there be no such thing as Chance in the world; our ignorance of the real cause of any event has the same influence on the understanding..."*

  The Doomsday Argument relies on treating your birth as a "random draw" from an urn of all humans. Hume would ask: **What is the causal mechanism that ensures this randomness?**

  In standard probability (like drawing balls from an urn), we know the causal setup (mixing the balls, blind selection). In the DA, there is no causal mechanism generating your birth rank. You are not "sampled" into existence; you arise from specific biological and historical causes. To treat temporal position as a lottery ticket is to reify "chance" where there is only causal ignorance.

  Furthermore, Hume insists that all reasoning concerning matters of fact is founded on the relation of **Cause and Effect**. To predict the future (extinction), we must observe constant conjunctions of causes leading to that effect (e.g., resource depletion + population growth $\rightarrow$ collapse). The DA explicitly claims to bypass causal knowledge. It says, "Regardless of *why* we might go extinct, statistics say we will." For Hume, a prediction without a causal mechanism is not probability; it is superstition. He would view the DA as a mathematical dressing on a metaphysical guess.

  ### 3. The Self-Sampling Assumption as Unjustified Induction
  You rightly point out Hume's suspicion of the "uniformity of nature." The SSA assumes that your position is *typical*—that you are not in the first 5% or the last 5% of all humans. This is a uniformity assumption: *The distribution of observers is uniform enough that my sample is representative.*

  Hume's Problem of Induction states that we cannot justify the assumption that the future resembles the past by reason alone; we do it out of **custom and habit**.
  *   **Custom:** We expect the sun to rise because we have seen it rise many times.
  *   **DA Context:** Have we observed many civilizations rise and fall? Have we observed our own position in many different civilizations? No. We have $n=1$.

  There is no "custom" or "habit" that licenses the inference "I am a typical observer." We have no experience of being sampled from the set of all humans. Therefore, the SSA is an inductive leap without any inductive history to support it. Hume would diagnose the SSA as a hidden premise that smuggles in a substantive claim about the universe (that it is structured such that observers are randomly distributed) without any impression to justify it.

  ### 4. Probable Reasoning and the "Balance of Experiments"
  Hume does have a theory of probability, but it is frequentist and psychological, not Bayesian in the modern subjective sense. For Hume, probability arises from a "balance of experiments." If 9 out of 10 ships return to port, I assign a probability of 0.9 to the next ship returning.

  The Doomsday Argument does not rely on a balance of experiments. It relies on a single data point (your birth rank) and a prior distribution over total population sizes.
  *   **Hume's Objection:** You cannot establish a probability ratio from a single instance. To say "It is 95% likely humanity ends within X years" implies a frequency of outcomes we have never observed.
  *   Hume would argue that without a history of observing the lifespans of multiple intelligent species, the "probability" generated by the DA is fictitious. It measures the consistency of the math, not the likelihood of the event.

  ### 5. The Bundle Theory of Self
  There is a deeper, metaphysical objection Hume might raise regarding the "I" in the argument. Hume is a bundle theorist; he denies the existence of a substantial, enduring self.
  > *"When I enter most intimately into what I call myself, I always stumble on some particular perception or other... I never can catch myself at any time without a perception, and never can observe any thing but the perception."*

  The Doomsday Argument requires a stable, indexical "I" that can be located within a trans-temporal set of observers. If the self is merely a bundle of perceptions tied to a specific time and place, the notion of "sampling" that self from a set including future, non-existent perceptions becomes category-confused. How can I be a random sample of a set that includes entities that do not yet exist and may never exist? For Hume, the "I" is not a token that can be placed in an urn; it is a fleeting succession of impressions.

  ### Conclusion: Hume's Verdict
  Hume would likely classify the Doomsday Argument as **abstruse reasoning** that violates the empirical constraints of human understanding.

  1.  **It violates the limits of induction:** It assumes uniformity (SSA) where no custom or habit exists to support it.
  2.  **It ignores causality:** It attempts to predict a matter of fact (extinction) without identifying a cause.
  3.  **It reifies chance:** It treats ignorance of causal conditions as a statistical distribution.
  4.  **It oversteps epistemic bounds:** It claims knowledge of the total set of future humans, which is beyond any possible impression.

  In the final paragraph of the *Enquiry*, Hume famously suggests that if we take up a volume of divinity or school metaphysics, we should ask: *Does it contain any abstract reasoning concerning quantity or number?* (No.) *Does it contain any experimental reasoning concerning matter of fact and existence?* (No.) *Commit it then to the flames.*

  The Doomsday Argument contains abstract reasoning concerning number (Bayesian math), but it applies it to matter of fact (extinction) without experimental reasoning (causal evidence). Hume would likely say the DA is the worst of both worlds: it has the emptiness of sophistry with the pretension of science. He would not accept the core inference, viewing the Self-Sampling Assumption not as a rational principle, but as a psychological projection of our desire for order onto a universe that offers no such guarantee.
