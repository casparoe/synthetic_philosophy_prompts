      *   *Core Humean Objection 4: Chance.* Hume's view on chance as subjective ignorance.
      *   *Nuance/Counter-point:* Hume accepts probabilistic reasoning based on past frequencies. If we had data on many civilizations, maybe? But we don't. We have $n=1$.
      *   *Conclusion:* Hume would reject it. It's metaphysical speculation disguised as math.

