          *   *Puzzle:* Malebranche is solving the "how does mind move body?" and "how do we know universals?" problems within a Christian/Cartesian framework. Al-Ghazali is solving the "how to preserve Quranic miracles against Greek necessity" problem.
      *   **Connection:** Both are *Theological Occasionalists*. They share the conclusion (God is the only cause) but arrive via different routes (Ash'arite atomism vs. Cartesian rationalism).

  4.  **Drafting the Response (Iterative Process):**

