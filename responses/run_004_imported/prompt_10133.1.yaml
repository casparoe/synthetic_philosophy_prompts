      *   *Weaknesses:* Can feel coercive. If a reason doesn't motivate, in what sense is it a reason *for me*? It risks ignoring the agent's autonomy.
      *   *Nuance:* Is "future regret" a valid external reason? Or is it a prediction about future internal states?

  4.  **Evaluate Theo's Position (Internalism):**
