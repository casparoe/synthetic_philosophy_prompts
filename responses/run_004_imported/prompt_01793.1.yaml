          *   *Is it fair?* Yes, it's a standard and respected interpretation that Goodman radicalizes Hume. Goodman accepts Hume's skepticism about rational justification but says "Custom" isn't enough because custom could be "grue-ish." We need to explain why some customs (green) are valid and others (grue) aren't.
      *   *Nuance:* Hume thinks similarity is given by nature/perception. Goodman thinks similarity is constructed by language/practice. So Goodman *does* undercut Hume's naive reliance on similarity, but he builds *on* Hume's skepticism.

