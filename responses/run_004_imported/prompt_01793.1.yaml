      *   *Verdict on User's Readings:* The user's *second* reading is much closer to the mark. Hume is saying reasoning *cannot* justify the difference in confidence. The "eggs" example supports this: All eggs look similar (reason says they should taste similar based on appearance alone), but we don't trust the first one. We trust the 100th. Why? Not because of the *look* (similarity), but because of the *repetition* (custom).
