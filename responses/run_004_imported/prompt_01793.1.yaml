          *   Verdict on Connection: It is a fair and philosophically significant connection. Goodman is often seen as updating Hume for the 20th century. Hume says "Reason can't justify induction." Goodman says "Even Habit/Custom needs rules, because not all habits are equal."
          *   Caveat: Hume might reply that "grue" isn't a natural similarity we perceive, whereas "green" is. Goodman would reply that perception is theory-laden.
      *   **Conclusion:** Wrap up by praising the user's close reading. This is exactly how philosophy is done.

  5.  **Review and Refine:**
