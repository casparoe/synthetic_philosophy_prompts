answer: |-
  This is a classic and deeply fertile stalemate in modal metaphysics. You and your friend have effectively reconstructed the central dialectic between the Kripkean (Transworld Identity) and Lewisian (Counterpart Theory) camps. Your friend holds the line on semantic intuition (*de re* modality must be about *the object*), while you hold the line on metaphysical coherence (identity cannot be grounded in vague properties without paradox).

  To reach a verdict, we must analyze whether the Transworld Identity (TWI) theorist's appeal to **individual essences** successfully rescues the view from Chisholm's Paradox, or whether, as you suspect, it merely conceals the arbitrariness that Counterpart Theory (CT) acknowledges openly.

  ### 1. The Transworld Identity Appeal: Preserving "Aboutness"
  Your friend's reliance on Kripke's Humphrey objection is the strongest point for TWI. The intuition is powerful: when I say, "I might have been a doctor," I am not talking about a distinct individual in a distant universe who resembles me; I am talking about *me*.

  TWI preserves the logic of identity. If $x$ in world $w_1$ is identical to $y$ in world $w_2$, then whatever is true of $y$ is true of $x$ (by Leibniz's Law). This makes modal predication straightforward: $P$ is possibly true of $x$ iff there is a world $w$ where $x$ exists and has $P$. There is no need for a "counterpart relation" that mimics identity without being identity.

  **The Cost:** To maintain this strict identity across worlds, TWI must answer the **Principle of Individuation**: In virtue of what is the object in $w_2$ the *same* object as the one in $w_1$?

  ### 2. The Chisholm Challenge and the Essence Defense
  Your invocation of Chisholm's Paradox strikes at the heart of this individuation problem. If we individuate objects by their qualitative properties (e.g., origin, matter, shape), we face a Sorites-style problem. By incrementally swapping the properties of Adam and Noah across a chain of possible worlds, we can reach a world where the entity with Adam's original properties is numerically identical to Noah, and vice versa.

  If identity is transworld, this implies that identity is contingent on qualitative properties, which violates the necessity of identity. To block this, the TWI theorist must posit **Individual Essences** (often called *haecceities*).

  **The Nature of Individual Essences:**
  To avoid Chisholm's Paradox, these essences cannot be qualitative (since qualities can be swapped). They must be non-qualitative primitives: a "thisness" that makes Adam *Adam* regardless of his properties.

  **Your Critique:** You argue these essences are *ad hoc* and do the same work as similarity "under a grander name."
  *   **Is this fair?** It is partially fair, but requires nuance. Individual essences do not function like similarity. Similarity is gradable, contextual, and symmetric. Essences are binary, absolute, and asymmetric (in terms of grounding).
  *   **The Real Problem:** The issue isn't that they are "similarity in disguise," but that they are **epistemically inaccessible metaphysical posits.** If Adam's essence is not his properties, origin, or matter, we have no way of knowing or specifying what it is other than "that which makes Adam Adam."
  *   **Principled Account?** Does this give a *more principled* account of individuation? **No.** It gives a *logically* consistent account (identity remains transitive), but it is **metaphysically unexplanatory.** It solves the paradox by stipulation rather than explanation. It says, "Adam is Adam across worlds because he has Adam-ness," which is true by definition but illuminates nothing about the structure of modality.

  ### 3. Counterpart Theory: Honesty about Arbitrariness
  Lewis's Counterpart Theory accepts your friend's loss (Humphrey isn't *strictly* identical to his counterpart) to avoid your friend's metaphysical cost (haecceities).

  In CT, "Humphrey might have won" is true iff a *counterpart* of Humphrey wins in another world. The counterpart relation is based on **similarity in relevant respects**.
  *   **Handling Chisholm:** CT dissolves Chisholm's Paradox. In the world where properties are swapped, the entity with Adam's original properties is Adam's counterpart, and the entity with Noah's is Noah's counterpart. There is no "swapping of identity" because identity is world-bound. We simply have different counterpart relations.
  *   **The "Arbitrariness":** You noted that CT relies on similarity, which seems arbitrary. Lewis embraces this. Modal claims are context-dependent. When we ask, "Could Napoleon have won at Waterloo?" the context selects counterparts based on military strategy and historical position. If we ask, "Could Napoleon have been a potato?" the context shifts to biological or absurdity constraints.

  **Comparison on Individuation:**
  *   **TWI (with Essences):** Claims individuation is absolute and context-independent, but grounds it in an unknowable primitive.
  *   **CT:** Claims individuation (counterpart selection) is context-dependent, but grounds it in intelligible relations (similarity).

  CT is more honest. It admits that *de re* modality is sensitive to how we describe and conceptualize the object. TWI claims modality is "in the object" via haecceities, but since we can never access haecceities apart from properties, this claim is metaphysically idle.

  ### 4. The Verdict: Why Counterpart Theory Fares Better
  While your friend's intuition about "aboutness" is semantically appealing, your metaphysical critique of essences is decisive. Here is the defense for why Counterpart Theory is the superior account overall:

  **1. Explanatory Power vs. Stipulation**
  The TWI theorist posits individual essences solely to save the phenomenon of transworld identity from paradox. This is theoretically costly. It multiplies primitives without increasing explanatory power. We cannot use haecceities to predict anything or explain any other metaphysical relation.
  CT, conversely, grounds modal truth in the **similarity relation**, which is already required for other philosophical tasks (reference, memory, personal identity over time). CT unifies modal individuation with general cognitive practices of classification.

  **2. Handling Vagueness**
  Modal discourse is inherently vague. There is no sharp line between a world where I exist and a world where I don't (e.g., conception timing).
  *   **TWI:** Must posit a sharp boundary grounded in an essence. Either the essence is present or it isn't. This leads to "modal precisification" that contradicts our intuition of vagueness.
  *   **CT:** Accommodates vagueness naturally. The counterpart relation can be a matter of degree. In borderline cases, it is indeterminate whether there is a counterpart, which matches the indeterminacy of the modal claim.

  **3. The Humphrey Objection Mitigated**
  Lewis's response to Kripke is stronger than often credited. Lewis argues that counterparts *do* make the statement about Humphrey, because the counterpart relation is grounded in Humphrey's own properties. The counterpart is not just "some other guy"; he is the guy who *represents* Humphrey in virtue of Humphrey's own nature. While it isn't strict identity, it preserves the *truth conditions* of our modal talk without requiring metaphysical magic.

  **4. The "Ad Hoc" Charge Confirmed**
  You asked if essences simply relocate arbitrariness under a grander name. The verdict is **yes**.
  By retreating to non-qualitative essences, the TWI theorist avoids the arbitrariness of *property selection* (Chisholm's Paradox) only by embracing the arbitrariness of *primitive posits*. They trade an epistemic problem (which properties matter?) for an ontological one (what are haecceities?). CT keeps the problem epistemic/contextual, which is where it belongs. Modal claims are about how we project actual objects into other possibilities; that projection is inherently a matter of similarity and interest, not metaphysical necessity.

  ### Conclusion
  Your friend wins on **semantic intuition**: TWI feels more like what we *mean* when we speak.
  You win on **metaphysical coherence**: CT provides a workable model of how modal truth is grounded without invoking mysterious primitives.

  In philosophy, a theory that admits its limitations (CT's context-dependence) is generally preferable to one that hides them behind unanalyzable primitives (TWI's haecceities). Individual essences do not provide a more principled account of individuation; they provide a **dogmatic** one. They assert a boundary where CT explains a gradient.

  Therefore, **Counterpart Theory fares better overall.** It sacrifices the letter of strict identity to save the spirit of modal reasoning, whereas Transworld Identity sacrifices metaphysical intelligibility to save the letter of identity. Your argument that essences are an *ad hoc* barrier against Chisholm's Paradox is correct: they stop the paradox by fiat, whereas CT dissolves the paradox by rethinking the nature of cross-world relations.
