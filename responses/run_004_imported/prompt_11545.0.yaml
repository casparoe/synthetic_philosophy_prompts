answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Father's Name]'s son/daughter.

  We are gathered to mourn a man who is gone, but also to celebrate a man who was very much present. Even while he was here, [Father's Name] was always trying to be somewhere else—somewhat better.

  Two weeks ago, while sorting through his desk, I found a stack of notebooks. Forty years' worth. They were all the same: simple grids, ruled with red ink. At the top of each page were thirteen words: Temperance, Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice, Moderation, Cleanliness, Tranquility, Chastity, and Humility.

  For the last four decades, my father lived his life by a system designed by Benjamin Franklin. Every night, before he went to sleep, he reviewed his day. If he had fallen short of one of those virtues, he put a black mark in the box.

  I know that for some of you, hearing that might sound rigid. It might sound like a man who was hard on himself. But as I turned those pages, looking at forty years of his handwriting, I didn't see judgment. I saw a conversation. I saw a man who cared enough about his character to check in with it every single night.

  Franklin admitted that he never achieved perfection. He wrote that he was "never without some spot of imperfection." My father knew this, too. In fact, if you look at the notebooks, one row is far more marked up than the others. The row for "Order."

  My father's desk was often cluttered. His garage was a maze of projects half-finished. He knew he wasn't orderly. But he kept tracking it. Why? Because the point wasn't to be perfect. The point was to pay attention.

  He was also fully aware of the irony of tracking "Humility" on a scorecard. He loved that contradiction. He often told us the story of the man who wanted his axe ground perfectly smooth. The smith agreed, but only if the man would turn the wheel. It was hard work. The axe was still speckled. The man decided he liked the speckled axe better than the labor of polishing it.

  My father used to laugh and say, "I'm keeping the speckled axe."

  He knew he wasn't going to grind away every flaw. But he also knew that if he stopped turning the wheel, he'd rust.

  I was tempted, when I found these books, to hide the pages with the black marks. I thought a eulogy should be about victories. But to hide the marks would be to falsify the thing I admired most about him. It would pretend he arrived, when the truth is, he loved the journey.

  Benjamin Franklin concluded that the *trying* mattered more than the *arriving*. That the effort to be better made a man happier and more useful than actually being perfect. My father proved that true.

  Those black marks in his notebooks? They aren't failures. They are evidence that he showed up. They are proof that he wrestled with his temper, that he checked his pride, that he tried to be kind when he was tired, and honest when it was difficult. A clean chart would have meant he wasn't challenging himself. A chart full of marks means he was engaging with life.

  To his coworkers: You knew him as the man who showed up, who did the work, who owned his mistakes. Now you know why. He was practicing.
  To his family: You knew him as the man who hugged us, who worried about us, who wanted us to be good people. Now you know why. He was practicing.

  He didn't leave us a legacy of sainthood. He left us something better. He left us permission to be imperfect, as long as we are intentional. He taught us that we don't have to be a polished axe to be useful. We just have to be willing to turn the wheel.

  Dad, you kept your chart. You kept your marks. And you kept your heart open. We will miss you terribly. But I promise you, we will keep turning the wheel.

  Rest well. The chart is closed.
