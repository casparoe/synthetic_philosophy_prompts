      *   **Committee Split:** 50/50. One side: Informal assurances can't bind institutions (slippery slope). Other side: Detrimental reliance, specific intent, moral obligation survives personnel changes.
      *   **Committee Charter:** Allows "equitable relief where no formal entitlement exists."
