answer: |-
  **MEMORANDUM**

  **TO:** Graduate Appeals & Fairness Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Funding Appeal of [Jess] (4th Year)

  **Executive Summary**
  This memo addresses the appeal of [Jess], a 4th-year doctoral student whose funding is at risk following the loss of a departmental training grant. The core conflict is between the signed funding agreement (which limits liability) and verbal/written assurances made by the former Department Chair regarding a five-year funding guarantee.

  **Recommendation:** The Committee should grant **equitable relief in the form of guaranteed funding support through Year 5.** This does not necessarily require reinstating the specific fellowship mechanism originally implied, but it does require the Department to bridge the gap via TA lines or discretionary funds.

  **Timeline:** Notification to student by [Date, 3 days from meeting]; Funding mechanism finalized by end of current semester; Support effective Fall [Next Year].

  ***

  **1. Factual Background**
  *   **Recruitment:** Two years ago, the former Chair recruited [Jess] via email and phone.
  *   **Assurance:** Chair provided a "personal guarantee" of 5-year funding and specific advisor alignment. Chair explicitly noted this could not be in the official letter due to policy.
  *   **Reliance:** [Jess] declined a competing offer with a written 5-year guarantee, resigned from stable employment, and relocated.
  *   **Current Status:** [Jess] is entering Year 4. The training grant underpinning departmental budgets has failed. The current Chair cites the signed offer letter ("contingent on funds") as the sole binding document.
  *   **Charter Authority:** The Committee is authorized to grant "equitable relief where no formal entitlement exists."

  ***

  **2. The Case Against Granting Relief (Administrative & Precedential Risks)**
  *To ensure a robust decision, the following arguments against [Jess]'s appeal must be weighed seriously:*

  *   **Authority & Agency:** A Department Chair acts as an agent of the University. If an agent makes promises that contravene established HR and Graduate School policy (i.e., bypassing written offer letters), the institution is generally not liable for those ultra vires acts. Validating informal assurances undermines the centralized budgeting process.
  *   **The Integration Clause:** The signed offer letter contains standard boilerplate stating funding is contingent on availability. In contract theory, this is an integration clause; it presumes the written document supersedes prior negotiations or oral assurances. To ignore this is to invite litigation risk and administrative chaos.
  *   **Fiscal Reality:** The training grant funds are gone. Ordering the Department to fund [Jess] may require cutting funding from other students, reducing faculty research support, or dipping into reserves not earmarked for student aid. The Committee cannot mandate money that does not exist without creating collateral damage.
  *   **Precedent:** If the Committee rules that emails and phone calls can override official offer letters, every future funding dispute becomes a factual inquiry into "what was said in the hallway." This creates an unmanageable administrative burden and encourages recruits to distrust official documents in favor of informal side-deals.

  ***

  **3. The Case for Granting Equitable Relief**
  *Despite the administrative risks, the specific circumstances here satisfy the charter's threshold for equitable relief:*

  *   **Detrimental Reliance:** This is not a case of a student mishearing a casual comment. [Jess] incurred significant, foreseeable costs (quitting a job, turning down a written guarantee elsewhere) based on specific representations from a high-ranking official. The Department benefitted from her enrollment based on this reliance.
  *   **Institutional Continuity:** The Department is a continuous entity, not merely the sum of its current staff. Obligations incurred by the leadership of the Department do not vanish when personnel change. To rule otherwise is to suggest the Department has no memory or moral agency beyond the current Chair's tenure.
  *   **Reputational Harm:** Denying this appeal signals to current and prospective students that the Department's recruitment assurances are valueless. The long-term cost to recruitment (especially in a competitive market) may exceed the short-term cost of funding [Jess].
  *   **Charter Intent:** The "equitable relief" clause exists precisely for the gap between *strict legal entitlement* and *fairness*. If we only uphold written contracts, we are a court, not a fairness committee. This case is the textbook scenario for this clause's use.

  ***

  **4. Proposed Resolution & Implementation**
  We recommend the Committee find that while [Jess] has no *contractual* entitlement, she has a *moral and equitable* claim that the Department must honor.

  *   **Commitment:** The Department guarantees funding support for Years 4 and 5.
  *   **Mechanism:** To address fiscal constraints, this need not be the original fellowship. It can be a package of TA-ships, research assistantships, and discretionary bridge funds. The *value* must match the original 5-year guarantee.
  *   **Advisor:** The Department must make best efforts to honor the advisor alignment, though this is secondary to funding.
  *   **Precedent Limit:** This ruling should be explicitly framed as relying on the *documented evidence* of the promise (the emails exist) and the *severity* of the reliance (career change + relocation). This prevents it from becoming a precedent for offhand verbal comments without paper trails.

  **Action Required:** Vote to recommend the Department accept financial responsibility for [Jess]'s completion through Year 5.
