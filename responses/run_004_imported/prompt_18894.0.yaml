      *   Make sure the "personal guarantee" vs. "official letter" tension is addressed.
      *   *Self-Correction on Recommendation:* If I recommend full funding, the committee might reject it as impossible. If I recommend partial, it might seem like I'm compromising too much. Let's recommend **Funding for the Remainder of the Program (Years 4-5)**. This honors the 5-year promise without necessarily promising a *fellowship* specifically, allowing TA work. This is the "equitable" middle ground.

  8.  **Drafting the Content:** (Mental outline of the text)
      *   Subject: Appeal of [Jess] - Funding Continuity.
      *   Rec: Grant Equitable Relief (Fund Years 4-5).
      *   Case Against: Authority limits, Integration Clause, Fiscal Reality, Precedent Risk.
      *   Case For: Detrimental Reliance, Charter Mandate, Reputation, Moral Continuity.
      *   Plan: TA + Dept Funds.

  9.  **Final Review:** Does this help the user? Yes, it gives them a structured argument they can adapt, specifically respecting their request to not strawman the opposition. It acknowledges the philosophical weight (promises) without getting bogged down in jargon.

  *(Self-Correction during drafting)*: I should avoid explicitly mentioning the user's dissertation topic in the memo, obviously, but the reasoning should reflect that rigor. I will keep the memo strictly professional.

  *(One more check)*: The prompt asks for a "short memo." I should keep it under 2 pages equivalent.

