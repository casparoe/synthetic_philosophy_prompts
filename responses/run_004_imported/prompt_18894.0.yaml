          *   *Equitable Relief:* The charter specifically exists for this gap between "legal" and "fair."
          *   *Institutional Reputation:* Reneging looks bad for recruitment.
          *   *Philosophical angle (subtle):* Promissory obligation isn't erased by personnel changes.
      *   **Recommendation & Timeline:**
          *   Fund Years 4 & 5.
          *   Mechanism: Mix of TA and Fellowship (to ease budget).
          *   Deadline: Decision by end of semester, funding secured by next academic year.
      *   **Tone Check:** Needs to be professional, not overly academic, but rigorous.

  4.  **Refining the "Against" Argument (Crucial Step):**
      *   The user specifically said: "I want the case against Jess argued for real, not as a strawman."
