answer: |-
  ```json
  {
    "1": "That it enfeebles the body",
    "2": "That it withdraws us from active life",
    "3": "That it is not far from death",
    "4": "That it robs us of physical pleasures"
  }
  ```

  **1. That it enfeebles the body**
  This holds up best because modern exercise science validates Cicero's core claim: decline is often lifestyle-dependent, not purely age-dependent. Warren can argue that strength is maintained through use, which resonates with a gym-literate 26-year-old. The weak spot is genetics and chronic illness, but Nadia can't easily deny that discipline mitigates decay.

  **2. That it withdraws us from active life**
  Cicero argues elders shift from doing to guiding, which still works conceptually (mentorship, advisory roles). However, this is shakier today due to structural ageism; unlike Rome's gerontocratic Senate, modern workplaces often discard older workers. Nadia could counter that "wisdom" doesn't guarantee anyone listens anymore, but the principle of intellectual contribution remains valid.

  **3. That it is not far from death**
  The "ripe fruit" metaphor (death is natural completion) has poetic resonance, but Cicero leans heavily on the immortality of the soul to remove the sting. For a secular millennial/Gen Z skeptic, the metaphysics fail completely. She can accept mortality without accepting his comfort, making this a philosophical stalemate rather than a win for Warren.

  **4. That it robs us of physical pleasures**
  This is the load-bearing wall Nadia should smash. Cicero argues deprivation is actually a *virtue* (freedom from lust's chains), which reads to a modern audience as classic sour grapes. It frames sensory joy as a vice rather than a human good. Nadia's opening line should target this rationalization directly: "You don't get to call it 'liberation' just because you lost the capacity for desire."
