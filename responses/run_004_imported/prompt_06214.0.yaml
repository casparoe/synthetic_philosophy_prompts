    "1": "<name of the complaint being rebutted>",
    "2": "...",
    "3": "...",
    "4": "..."
  }
  ```

  from strongest rebuttal to weakest, then follow it with a short paragraph under each rank explaining specifically what still holds up and what doesn't -- ideally something concrete enough that I can turn the weakest one into Nadia's opening line.
