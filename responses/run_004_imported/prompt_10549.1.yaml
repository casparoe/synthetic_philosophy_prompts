answer: |-
  You are absolutely right to be frustrated. The standard "Bank Case" (Keith DeRose's example) is notorious for this. In the Bank Case, when the stakes go up for the subject (the check is huge), the conversational context *also* tends to shift (they start talking about whether the bank might have changed hours). This conflates the variables, making it look like the theories are just offering different explanations for the same verdict, rather than predicting *different* verdicts.

  To see the daylight, we need a scenario where the **Subject's Stakes** and the **Attributor's Conversational Standards** move in opposite directions.

  Here is one scenario designed to force **Contextualism** and **Pragmatic Encroachment** to disagree on the truth value of the claim "S knows that P."

  ### The Scenario: The Nurse and the Breakroom Chat

  **The Subject (S):** Sarah, a night-shift nurse.
  **The Proposition (P):** "Vial A contains Insulin."
  **The Evidence:** Sarah checked the label on the vial against the patient's chart. It matches. She did this once, quickly.
  **The Subject's Stakes (High):** The patient is an infant with a severe allergy to the alternative medication. If Sarah is wrong, the baby dies. For Sarah, the practical threshold for acting on this belief is extremely high (she arguably should double-check with a pharmacist).
  **The Attributor (A):** Dave, a hospital administrator.
  **The Attributor's Context (Low):** Dave is in the breakroom, casually chatting with a friend about staffing. He is not thinking about malpractice, death, or error possibilities. He is unaware of the specific severity of this specific patient's allergy.
  **The Claim:** Dave says, *"Don't worry about Sarah. She **knows** that Vial A contains Insulin."*

  ***

  ### The Verdicts

  Here is where the theories split.

  #### 1. Pragmatic Encroachment says: FALSE
  **Why?** Encroachment argues that knowledge depends on the **Subject's** practical situation.
  *   Because the stakes for Sarah are life-and-death, the "epistemic bar" for her to count as *knowing* is raised.
  *   Merely glancing at a label once is sufficient evidence for a low-stakes situation (like grabbing a soda from the fridge), but it is *insufficient* evidence for a high-stakes situation (injecting an infant).
  *   Since Sarah's evidence doesn't meet the threshold required by her high stakes, she does not know.
  *   **Verdict:** Dave's claim is **False**.

  #### 2. Epistemic Contextualism says: TRUE
  **Why?** Contextualism argues that knowledge depends on the **Attributor's** conversational context.
  *   Dave is in a low-standards context. He is chatting casually. He has not raised any "error possibilities" (e.g., he hasn't said, "But what if the label was printed wrong?").
  *   In a low-standards conversation, the word "knows" requires less evidence. It just means "has a solid, unchallenged belief."
  *   Sarah has checked the chart. In the context of Dave's casual breakroom chat, that counts as knowing. The fact that Sarah *herself* is stressed about the stakes doesn't change the meaning of the word "knows" in Dave's mouth.
  *   **Verdict:** Dave's claim is **True**.

  ***

  ### Why this creates "Daylight"

  In the standard Bank Case, both theories usually agree that "He doesn't know" when stakes are high, they just disagree on *why*. In the Nurse Scenario, they disagree on the **truth value itself**.

  *   **For the Encroachment Theorist:** Dave is speaking falsely. He thinks Sarah is in a secure epistemic position, but she isn't, because her practical environment demands more evidence than she has. It doesn't matter that Dave is casual; the world is dangerous for Sarah.
  *   **For the Contextualist:** Dave is speaking truly. In his conversational context, the standards are low. Sarah meets those standards. The fact that Sarah is sweating over the stakes is irrelevant to the semantic truth of Dave's sentence. (If Dave were in a malpractice review meeting, the standards would rise, and his sentence would become false, but that's about *Dave's* context, not Sarah's stakes).

  ### The Reverse Case (Just to complete the picture)

  If you want to see the disagreement flip the other way, just invert the variables:

  *   **Subject:** A tourist checking a train schedule. **Stakes: Low** (If he misses it, he waits an hour).
  *   **Attributor:** A skeptical philosopher. **Context: High** (Asking, "But do you *know* the schedule isn't a hallucination?").
  *   **Encroachment:** **TRUE.** (Tourist's stakes are low, so checking the app is enough to know).
  *   **Contextualism:** **FALSE.** (Philosopher's context raised the standards to "infallibility," which the tourist can't meet).

  ### Summary Table

  | Feature | **Pragmatic Encroachment** | **Epistemic Contextualism** |
  | :--- | :--- | :--- |
  | **What drives "Knows"?** | The **Subject's** Stakes (Action) | The **Attributor's** Context (Conversation) |
  | **In the Nurse Scenario** | Subject has **High** Stakes | Attributor has **Low** Standards |
  | **Epistemic Bar** | Raised (Needs more evidence) | Lowered (Needs less evidence) |
  | **Does Sarah Know?** | **No** (Evidence insufficient for stakes) | **Yes** (Evidence sufficient for conversation) |
  | **Is Dave's Claim True?** | **False** | **True** |

  This separates the "psychological pressure on the subject" from the "semantic standards of the speaker," which is exactly where the two theories stop overlapping and start fighting.
