      *   **Middle:** A series of escalating "narrow escapes." Each one needs to be physically plausible but statistically unlikely. Show the divergence between what he knows *should* happen (death) and what *does* happen (survival).
      *   **Climax:** A realization of the implication. If he *cannot* experience his own cessation, what is the value of risk? What is the value of life?
      *   **Ending:** The "uncomfortable end." He doesn't become a daredevil. He becomes detached, or perhaps burdened. A shift in agency.

  4.  **Drafting - Scene by Scene:**

