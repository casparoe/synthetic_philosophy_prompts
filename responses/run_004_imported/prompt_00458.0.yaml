      *   *Scene 3: The Medical Event.* Something internal. A heart arrhythmia or aneurysm.
          *   *Detail:* He collapses, but resuscitation works perfectly against odds.
          *   *Thought:* The "inside" view vs. the "outside" view. His friends see a lucky man; he sees a continuous thread.

      *   *Scene 4: The Philosophical Turn.* He meets someone? Or just monologue? Let's have him talk to a younger colleague or read the philosophy he ignored. Let's go with reading Parfit/David Lewis in a quiet moment.
          *   *Key Insight:* It's not that he *won't* die. It's that he won't *experience* dying. The branches where he dies exist, but he isn't in them.

