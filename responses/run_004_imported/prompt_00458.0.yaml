answer: |-
  The cyclotron hummed, a B-flat held for forty years. Elias knew the sound better than his own heartbeat. He knew the smell of ozone, the specific chill of the shielding room, the way the air tasted of ionized nitrogen before a breach.

  He was not a theorist. He did not deal in strings or branes. He dealt in cross-sections, decay rates, and the brutal arithmetic of collision. When you fire particles at a target, most pass through. Some scatter. A rare few interact. Elias had spent a lifetime counting the rare few.

  The first event was mundane. A high-pressure hydraulic line in the cooling array ruptured. A jet of supercritical fluid, capable of shearing steel, screamed across the control room. It took the head off the man standing to Elias's left. It missed Elias by the width of a shoulder, severing only the strap of his badge holder.

  In the debrief, the safety board called it a statistical outlier. A one-in-ten-million alignment of pressure variance and human positioning. Elias signed the forms. He went home. He slept.

  From the outside, from the view of the safety board, Elias was a lucky man. A survivor.
  From the inside, from the view of Elias, the event was different. He did not feel lucky. Luck implies a selection from a set of possibilities where some are chosen and others discarded. But Elias remembered the jet. He remembered the scream. He remembered the expectation of impact. And then he remembered the continuation of the timeline.

  He began to read. He dug out the dog-eared copies of Parfit and Lewis he had ignored during his doctorate. He read about the Many-Worlds Interpretation, not as a computational tool, but as an ontology. If the wave function never collapses, then every physically possible outcome occurs.

  The anthropic principle is trivial: you cannot observe a universe in which you do not exist. But applied to the self across time, it curdles. If consciousness is a process dependent on a specific physical substrate, and that substrate is destroyed in Branch A but preserved in Branch B, the "I" in Branch A terminates. The "I" in Branch B continues. There is no darkness. There is no gap. There is only the seamless flow of the survivor.

  Six months later, the arrhythmia.

  Elias was in the shower. His heart fluttered, fibrillated, and stopped. By all rights, the narrative should have ended on the tile floor. The probability of spontaneous resuscitation without intervention was negligible.

  But the sinus node fired. A chaotic, improbable spark in the wet dark. He woke up on the floor, water running cold over him, three hours later.

  He went to a cardiologist. The tests were clean. "You're a ghost," the doctor said, smiling, meaning *you're lucky*.

  Elias knew he wasn't lucky. Luck is a property of the ensemble. Elias was no longer experiencing the ensemble. He was experiencing the conditional. *Given that I am observing, I must be in a branch where I survive.*

  The third event was the car. A tanker on the I-95 lost traction on black ice. It jackknifed, crushing the sedan in the lane next to Elias's. The debris field should have engulfed him. A shard of chrome, traveling at eighty miles per hour, should have taken his throat.

  It passed through the open window, missing the jugular by a millimeter, embedding itself in the headrest.

  Elias pulled over. He sat in the idling car, shaking. Not from fear. Fear is a response to a threat of termination. Elias was beginning to suspect termination was no longer a variable in his equation.

  He stopped driving. He stopped going to the lab. He sat in his study, surrounded by the papers of dead philosophers, and did the math.

  In a standard probabilistic view, the likelihood of surviving three such independent, high-mortality events is effectively zero. $P \approx 10^{-15}$. If you met a man who claimed this, you would assume he was lying or mad.

  But in the Everettian view, the measure of the branches where Elias dies is vast. The measure of the branches where he survives is vanishingly small. But *he* is not distributed across the measure. He is localized in the experience.

  The asymmetry was absolute. To his friends, he was a man living on borrowed time, a statistical miracle walking. To himself, he was a constant. The world was the variable.

  He met with Sarah, his former post-doc, in a café. She looked tired. She spoke of the lab, of the new grant, of the memorial plaque for the man killed in the hydraulic breach.

  "You look good, Elias," she said. "Better than I expected."

  "I am well," he said.

  "You should be dead," she said, bluntly. It wasn't cruelty; it was physics. "The safety report... the odds were impossible."

  "The odds are for the observer, Sarah. Not the observed."

  She stirred her coffee. "You've been reading that multiverse stuff? The quantum suicide nonsense?"

  "Not suicide. Persistence."

  "It's solipsism with extra steps."

  "Is it?" Elias leaned forward. "Imagine a particle detector. If it clicks, it triggers a bomb. If it doesn't, it rings a bell. From the outside, the detector clicks 50% of the time. From the inside... if the detector is conscious... it only ever hears the bell."

  Sarah looked at him with pity. "You think you're special."

  "I think I'm conditioned."

  He left the café. As he walked down the street, a brick fell from a scaffolding three stories up. It struck the pavement where his foot had been a second before. He didn't flinch. He hadn't felt the tension of the fall. He had simply stepped, and the brick had fallen where he was not.

  This was the uncomfortable truth Parfit had hinted at, though he never dared apply it to the physics. Identity is not a pearl; it is a thread. And Elias's thread was being pulled through a needle eye that was getting narrower.

  He realized what this meant for his agency.

  If he could not die, then risk was meaningless. But pain was not. He could still break. He could still burn. He could still suffer. The branches where he survived were not necessarily the branches where he was whole. There were branches where he lived as a quadriplegic, hooked to machines, conscious for decades.

  Was he sliding toward those?

  The measure of his existence was shrinking. To survive increasingly improbable events, he had to occupy branches of decreasing amplitude. These were the "thin" worlds. Worlds where the physics was slightly off, where the luck was slightly too curated.

  He looked at the people around him. The pedestrians. The drivers. To survive a car crash often requires the other driver to die. To survive a pandemic requires the virus to mutate away from you but not from your neighbor.

  His persistence was parasitic.

  Every time the universe pruned the branches where Elias died, it often kept the branches where the world around him suffered to allow his survival. He was a sinkhole of probability. For him to continue, the measure of the world around him had to distort.

  He went home and packed a bag. He didn't know where he was going. The destination didn't matter; the trajectory did.

  If he stayed in the city, the probability of a catastrophic event would rise. The universe would throw harder and harder anomalies at him to test the boundary of his continuity. A gas main explosion. A rogue asteroid. A new pathogen.

  He had to minimize the surface area of interaction.

  But there was a deeper horror. If he continued, if he truly could not experience the cessation of consciousness, then he would not just survive the year. He would survive the century. He would survive the heat death of the universe, provided there was *any* branch, no matter how thin, where a fluctuation allowed his consciousness to persist.

  He was condemning himself to the end of time.

  Elias stood in his kitchen. He picked up a knife. He looked at the blade. He thought about the crude version of the experiment. The gun to the head. He could test it. He could prove it.

  But he didn't need to. The hydraulic line, the heart, the brick. The data was significant. $p < 0.001$.

  He put the knife down.

  Testing it would be an act of violence against the world, not himself. To force the universe to branch around his survival was to demand that reality contort itself to keep him watching.

  He realized then what he had to do. He could not kill himself; the branches where he succeeded would simply be the ones he didn't experience. He would wake up in the branch where the gun jammed, or the pill was vomited, or the rope broke.

  The only way to stop the sequence was to remove the observer.

  Not by death. By sleep. By suspension.

  He called the university. He told them he was taking indefinite sabbatical. He told Sarah he was going offline.

  "I'm not coming back," he said.

  "Elias, you need help."

  "I need to reduce my cross-section," he said. "I'm scattering too much."

  He drove to a remote cabin he owned in the northern tier, where the roads were few and the population density was low. He stocked food. He secured the structure.

  He sat in the chair by the window. He watched the snow fall. Each flake was a branching event. A trillion crystalline decisions.

  He understood now that the philosophical bite wasn't about the fear of death. It was about the loss of shared reality. He was drifting away from the human ensemble. He was becoming a singleton. The people he loved would die in the branches where he lived, because their mortality was the anchor of the high-measure worlds. He was floating off into the low-measure tails, where he was the only constant.

  He picked up a pen and a notebook. He began to write. Not a diary of events, but a log of probability.

  *Day 1: No accidents. The stove did not leak. The floor did not collapse.*
  *Day 14: A tree fell. It missed the roof. The probability of the wind vector required was $10^{-4}$.*
  *Day 40: I feel old. But I do not feel weaker.*

  That was the key. His body was not healing; it was simply persisting in branches where it did not fail. He was not becoming immortal in flesh; he was becoming immortal in narrative.

  He looked out at the frozen lake. He thought about the scattering experiments. When you fire a beam, you expect a distribution. A bell curve. Most particles stop. Some go far.

  He was the particle that never stopped. He was the one that kept going through the lead shield, through the concrete, through the earth.

  And he realized, with a cold clarity that settled deeper than the winter snow, that he could not stay here. Even here, the universe would find a way to keep him observing. A bear. A fire. A stroke that missed the vital center.

  To truly stop, he had to ensure that *no* branch allowed observation. He had to destroy the substrate in *all* branches.

  But he couldn't. He could only act in one.

  So he sat. He accepted the burden. He would live. He would watch the world thin out around him. He would be the witness to the end of things, not because he was chosen, but because he was the residue.

  Elias closed the notebook. He turned off the lamp. He sat in the dark, listening to the wind, waiting for the next branch, knowing that when he opened his eyes, the sun would rise, and he would still be there.

  It was not a gift. It was a conservation law. Consciousness could not be destroyed, only displaced. And he was the displacement.

  He closed his eyes. He did not pray for sleep. He knew he would find it. And he knew, with the certainty of a cross-section of one, that he would also find the morning.
