prompt: |-
  G.E.M. Anscombe objected vehemently to Oxford's decision to honor President Truman, arguing that his ordering of atomic bombings on Hiroshima and Nagasaki amounted to murder. Yet accounts of her position contain an apparent paradox: she herself conceded that the bombing likely shortened the war and saved lives on balance. If the utilitarian calculation favored Truman's action, how can Anscombe simultaneously maintain that it was murder? What principle allows her to reject the very consequentialist framework that would seem to vindicate the bombing, whilst refusing to embrace wholesale pacifism?
reasoning: |-
  Here's a thinking process that leads to the explanation of Anscombe's position:

  1.  **Deconstruct the Prompt:**
      *   **Subject:** G.E.M. Anscombe (Elizabeth Anscombe).
      *   **Event:** Oxford University awarding an honorary degree to Harry Truman (1956).
      *   **Anscombe's Action:** Vehement objection/protest.
      *   **Her Claim:** Truman's ordering of atomic bombings was *murder*.
      *   **The Paradox:** She conceded the bombing likely shortened the war and saved lives overall (utilitarian calculation).
      *   **The Question:** How can she call it murder if it saved lives? What principle allows her to reject consequentialism without being a pacifist?

  2.  **Identify the Core Philosophical Conflict:**
      *   The prompt highlights the clash between *Consequentialism/Utilitarianism* (ends justify means, net lives saved) and *Deontology/Absolutism* (certain actions are intrinsically wrong regardless of consequences).
      *   Anscombe is a key figure in modern virtue ethics and natural law theory, heavily influenced by Aquinas and Wittgenstein.
      *   Key text: Her pamphlet "Mr. Truman's Degree" (1956).

  3.  **Analyze Anscombe's Ethical Framework:**
      *   **Rejection of Consequentialism:** Anscombe famously argued against the idea that the morality of an action is determined solely by its outcome. In her view, certain actions are *intrinsically evil* (malum in se).
      *   **The Principle of Non-Combatant Immunity:** A central tenet of Just War Theory (which Anscombe adhered to). Deliberately targeting innocent civilians is forbidden.
      *   **Intention vs. Foreseeability:** This is crucial. Anscombe distinguishes between *intending* an evil and *foreseeing* an evil as a side effect (Doctrine of Double Effect).
      *   **Murder Definition:** For Anscombe, "murder" isn't just "killing." It is the *intentional killing of the innocent*.

  4.  **Resolve the "Paradox":**
      *   *Premise 1:* The bombing saved lives (consequentialist view).
      *   *Premise 2:* The bombing involved intentionally killing civilians (Anscombe's view).
      *   *Anscombe's Resolution:* Premise 1 is irrelevant to the moral classification of the act. If the act involves the intentional killing of the innocent, it is murder. No amount of good consequences can justify an intrinsically evil act.
      *   *Analogy:* You cannot kill one innocent person to harvest organs to save five others, even if the math works out.

  5.  **Address the "Pacifism" Aspect:**
      *   The prompt asks how she avoids wholesale pacifism.
      *   Anscombe was *not* a pacifist. She believed in Just War.
      *   *Distinction:* Killing combatants in a just war is permissible. Killing non-combatants (civilians) is not.
      *   Therefore, one can support war (non-pacifism) while condemning specific acts within war (like area bombing of cities) as murder.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the historical event (1956 Oxford protest) and identify the core philosophical tension (Consequentialism vs. Deontology/Natural Law).
      *   *Core Principle 1: Intrinsic Evil.* Explain that for Anscombe, some acts are wrong by their very nature, regardless of outcome. "Murder" is a specific category of action, not just a description of result.
      *   *Core Principle 2: Intentionality.* Discuss the Doctrine of Double Effect. Truman *intended* to destroy cities and kill civilians to force surrender. This makes the civilians the means to the end, which is forbidden.
      *   *Addressing the Utilitarian Calculation:* Explicitly state that Anscombe rejects the premise that "saving lives" justifies "murder." She would argue that justice cannot be traded for utility.
      *   *Addressing Pacifism:* Explain Just War Theory. Distinguish between *jus ad bellum* (right to go to war) and *jus in bello* (right conduct in war). She objected to the conduct, not the war itself.
      *   *Conclusion:* Summarize her legacy (revival of natural law, critique of consequentialism).

  7.  **Refining the Nuance (Self-Correction/Check):**
      *   *Did she actually concede it saved lives?* The prompt says "accounts of her position contain an apparent paradox: she herself conceded..." I need to be careful here. In "Mr. Truman's Degree," she argues that even *if* it saved lives, it doesn't matter. She doesn't necessarily need to concede the utilitarian point is *true*, but she grants it *for the sake of argument* to show it's irrelevant. I should clarify that distinction. She treats the utilitarian argument as morally irrelevant, not necessarily factually wrong (though she might dispute the facts, her philosophical point stands regardless).
      *   *Terminology:* Ensure I use terms like "Natural Law," "Consequentialism," "Doctrine of Double Effect," and "Just War Theory."
      *   *Tone:* Keep it analytical and philosophical.

  8.  **Final Polish:** (Reviewing against the prompt's specific questions).
      *   *How can she maintain it was murder?* Because murder is defined by intention and object, not consequence.
      *   *What principle allows rejection of consequentialism?* Natural Law/Absolutism regarding intrinsic evils.
      *   *How does she avoid pacifism?* By distinguishing combatants from non-combatants (Just War Theory).

  9.  **Final Output Generation:** (This matches the structure of the provided good response.)
answer: |-
  G.E.M. Anscombe's protest against Oxford's 1956 decision to award Harry Truman an honorary degree is a landmark moment in modern moral philosophy. The apparent paradox you identify—condemning an act as murder while conceding it may have produced a net saving of lives—dissolves once one understands that Anscombe was operating within a **Natural Law** framework that fundamentally rejects **Consequentialism**.

  Anscombe's position relies on three interconnected philosophical principles: the concept of intrinsic evil, the moral significance of intention, and the distinctions within Just War Theory.

  ### 1. The Rejection of Consequentialism
  The core of Anscombe's argument is that the morality of an action is not determined by its consequences. In her pamphlet *Mr. Truman's Degree*, she argues that Utilitarianism (the idea that the right action is the one that maximizes overall good) is a corrupt ethical system.

  For Anscombe, certain actions are **intrinsically evil** (*malum in se*). This means they are forbidden regardless of the good outcomes they might produce. She draws a parallel to a courtroom scenario: if a man kills an innocent witness to prevent a riot that would kill hundreds, he is still guilty of murder. The "math" of lives saved does not change the moral classification of the act.

  Therefore, when Anscombe concedes (hypothetically or otherwise) that the bombing saved lives, she is not offering a counter-argument to be weighed; she is declaring that the calculation is **morally irrelevant**. To justify murder by pointing to good consequences is, in her view, to abolish the concept of justice entirely.

  ### 2. Intention and the Doctrine of Double Effect
  Anscombe's definition of "murder" is specific. It is not merely "killing human beings"; it is the **intentional killing of the innocent.**

  This relies on the **Doctrine of Double Effect**, a principle derived from Thomas Aquinas. This doctrine distinguishes between:
  *   **Intended effects:** What the agent chooses to bring about as a means or an end.
  *   **Foreseen side effects:** Negative consequences that happen as a result of the action but are not chosen.

  Anscombe argued that the atomic bombings were not cases of "collateral damage" (foreseen but unintended civilian deaths during an attack on a military target). Instead, the destruction of the cities and the terrorizing/killing of the civilian population *was the means* by which the surrender was forced. Because the death of civilians was part of the plan (the intention) to achieve victory, the act constituted the direct killing of the innocent. Thus, it fit her definition of murder.

  ### 3. Avoiding Pacifism via Just War Theory
  The prompt asks how Anscombe rejects consequentialism without embracing wholesale pacifism. The bridge between these two positions is **Just War Theory** (*Jus in Bello*).

  Anscombe was not a pacifist; she believed that killing could be morally permissible under specific conditions.
  *   **Permissible Killing:** In a just war, killing enemy combatants is permissible because combatants have forfeited their right to immunity by engaging in lethal aggression.
  *   **Impermissible Killing:** Deliberately targeting non-combatants (civilians) is never permissible, regardless of the strategic necessity.

  By maintaining this distinction, Anscombe can condemn Truman's specific order as murder without condemning the Second World War itself or the use of force in general. She objected to the *method* of warfare (area bombing of civilians), not the *fact* of warfare.

  ### Summary
  Anscombe resolves the paradox by denying the premise that moral rightness is a function of net lives saved. Her position rests on the **absolutist prohibition against intentionally killing the innocent.**

  *   **Why it is murder:** Because the civilians were intentionally targeted as a means to an end.
  *   **Why consequentialism is rejected:** Because justice prohibits trading the innocent for the greater good.
  *   **Why she is not a pacifist:** Because killing combatants in a just cause remains permissible.

  In essence, Anscombe argued that there are moral "side-constraints" that cannot be violated, even to prevent a catastrophe. To honor Truman for an act of murder, even one that ended a war, was to signal that the university believed the ends justify the means—a proposition she found philosophically incoherent and morally dangerous.
