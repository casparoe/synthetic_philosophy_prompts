prompt: |-
  I'm taking a seminar this term on the epistemology of testimony, and this week we moved from Hume's reductionist account of testimonial evidence to Thomas Reid's anti-reductionist reply in An Inquiry into the Human Mind on the Principles of Common Sense (1764), Chapter VI, Section 24 ("Of the analogy between perception, and the credit we give to human testimony"). This is the passage where Reid introduces what he calls the principles of veracity and credulity, and it's the one our professor keeps citing as the founding text of anti-reductionism about testimony, but a couple of us in my study group got stuck on what exactly the argument is supposed to establish. Here's the passage (I've quietly modernized the long "s" from the original printing and fixed a couple of obvious scanning errors in the copy I found, but otherwise left the wording and punctuation untouched):

  "The wise and beneficent Author of Nature, who intended that we should be social creatures, and that we should receive the greatest and most important part of our knowledge by the information of others, hath, for these purposes, implanted in our natures two principles that tally with each other.

  The first of these principles is, a propensity to speak truth, and to use the signs of language so as to convey our real sentiments. This principle has a powerful operation, even in the greatest liars; for where they lie once, they speak truth a hundred times. Truth is always uppermost, and is the natural issue of the mind. It requires no art or training, no inducement or temptation, but only that we yield to a natural impulse. Lying, on the contrary, is doing violence to our nature, and is never practised, even by the worst men, without some temptation.

  […]

  Another original principle implanted in us by the Supreme Being, is a disposition to confide in the veracity of others, and to believe what they tell us. This is the counter-part to the former; and as that may be called the principle of veracity, we shall, for want of a more proper name, call this the principle of credulity. It is unlimited in children, until they meet with instances of deceit and falsehood: and it retains a very considerable degree of strength through life.

  If nature had left the mind of the speaker in equilibrio, without any inclination to the side of truth more than to that of falsehood; children would lie as often as they speak truth, until reason was so far ripened as to suggest the imprudence of lying, or conscience, as to suggest its immorality. And if nature had left the mind of the hearer in equilibrio, without any inclination to the side of belief more than to that of disbelief, we should take no man's word until we had positive evidence that he spoke truth. His testimony would, in this case, have no more authority than his dreams; which may be true or false, but no man is disposed to believe them, on this account, that they were dreamed. It is evident, that, in the matter of testimony, the balance of human judgment is by nature inclined to the side of belief; and turns to that side of itself, when there is nothing put into the opposite scale."

  What I can't work out is whether Reid is entitled to move from the developmental point to the epistemological one. The equilibrio thought experiment seems designed to show, at most, that children start out trusting testimony before they could possibly have gathered any inductive track record of speakers' reliability, and that this instinct is what gets the whole practice of language and instruction off the ground. But the reductionist he's supposedly answering isn't really making a claim about how children happen to acquire trust in testimony; Hume's claim is about what justifies an adult's reliance on it, and a Humean could presumably just concede the entire developmental story and then say that in mature agents the original instinct has since been vindicated by, and effectively absorbed into, ordinary induction from experience. One of my classmates thinks this worry is misplaced because for Reid an "original principle of the constitution" is supposed to keep its justificatory role even once we are adults capable of induction, in the same way our original perceptual principles do, but that seems like a claim that needs its own defense rather than one that follows from anything in this particular passage. Could you help me reconstruct the strongest version of Reid's argument here, and tell me whether there is a genuine gap between the genetic claim and the justificatory claim, or whether I'm missing a resource, in this passage or elsewhere in his epistemology of common sense, that's meant to close it?
