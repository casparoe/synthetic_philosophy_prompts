prompt: |-
  I am writing a campus novel whose protagonist is a philosophy graduate student serving as teaching assistant for an undergraduate seminar on Wittgenstein, at a point in the story where he is privately losing the religious faith in which he was raised. One scene has him grading exams late at night, and I need his marginal comments to read the way a genuinely rigorous grader's comments would — precise enough that a philosophically trained reader won't wince. Below is the question I invented for this exam, followed by one student's answer to it.

  Question: In the notes from his 1938 Cambridge lectures on religious belief, Wittgenstein discusses a case in which one person believes in a Last Judgement and another does not. He resists describing their disagreement as a matter of two people holding opposite opinions about the same fact. (a) Explain why. (b) Does this position commit Wittgenstein to the logical positivists' view that religious utterances are cognitively meaningless? Support your answer with reference to the notion of a "picture" governing a believer's life.

  Student's answer: Wittgenstein's point is that religious belief does not operate like an empirical hypothesis that evidence could confirm or disconfirm. When he considers a believer and a non-believer disputing the reality of a Last Judgement, he denies that they are affirming and denying the same proposition in the way two witnesses might disagree about what happened at an accident. For the believer, the picture of a Last Judgement functions as something that regulates his entire life: it is bound up with how he weighs his actions, what he fears, and what he hopes for, in a way that has no equivalent for the non-believer, who may use exactly the same words without their exerting any such hold on him. The disagreement, then, is not over a shared fact so much as a difference in what the words are doing in each person's life. It follows that Wittgenstein's account amounts to the same verdict the logical positivists reached by a different route: because religious statements are not answerable to evidence, they fail to state facts, and are therefore meaningless in the technical sense Ayer gives that word, mere pseudo-propositions dressed up as assertions. Wittgenstein arrives at this from within ordinary language rather than from a verifiability criterion, but the destination is the same. This fits with Wittgenstein's own lifelong Catholic faith, which these lectures seem designed to protect from rational challenge by placing it beyond the reach of ordinary standards of evidence altogether.

  Could you grade this the way a strict but fair TA would, and give me the itemized comments my character would plausibly write in the margin? I want to know what the student gets right, what is wrong, and anything that sounds right but is subtly off — accuracy matters more to me here than kindness, so please don't round up. Give me a grade out of 20, and return the whole assessment as JSON shaped like this:

  ```json
  {
    "grade": "<x>/20",
    "comments": [
      {"excerpt": "<short quotation from the answer>", "verdict": "correct | incorrect | overstated | unsupported", "note": "<one or two sentences>"}
    ],
    "summary": "<2-3 sentence overall assessment>"
  }
  ```
