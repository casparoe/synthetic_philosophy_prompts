answer: |-
  The dust in the submerged chapel did not smell of decay, but of dry stone and time. Elias brushed the last layer of silt from the mosaic floor, his hand trembling slightly. Julian stood by the breach in the western wall, holding the heavy mirror steady, catching the dying sun and bending it down into the crypt.

  "Another degree to the left," Elias said. His voice was too loud in the small space.

  Julian shifted the glass. The beam of light slid across the stone, igniting the tesserae. Gold leaf flashed beneath the grime they had spent six hours scrubbing away. It was a depiction of a garden, vibrant greens and impossible blues, created by hands that had turned to dust a millennium ago.

  Tomorrow, the valley would flood. The dam gates would close, and this chapel, along with the village above it, would vanish under forty meters of reservoir water. The historians had cataloged it. The photographs were taken. But the color, the depth, the specific way the light caught the gold—that belonged only to the present moment.

  "It's done," Julian said. He lowered the mirror. The chapel plunged back into twilight.

  "We could leave the rig," Elias said, wiping his hands on his trousers. "Prop the mirror. When the water rises, maybe the refraction…"

  "It'll shatter on impact," Julian said. "Or sink into the mud. No one will see it."

  "Someone might. Divers. In fifty years."

  "In fifty years, the silt will have covered it again. We know that." Julian leaned the mirror against the wall. He looked tired. They were both old men, their friendship stretching back before their hair turned gray, back to a university where they had argued over ethics and art until dawn. They had come here together because neither wanted to be the one to stay behind, and neither wanted to go alone.

  Elias looked down at the garden in stone. If he had come alone, he thought, the beauty would have been a weight. A secret too heavy to carry out. He would have felt the tragedy of it pressing on his chest, the injustice of a thing so excellent destined for oblivion. He would have seen the beauty, but the emotion would have been sorrow, pure and sharp.

  But Julian was here. The sorrow was still there, but it was changed. It was shared. The presence of his friend acted as a lens, focusing the light not just on the mosaic, but on the fact of their witnessing it.

  "It feels pointless," Elias said quietly. "Cleaning it. When the water comes…"

  "Moore would say it matters," Julian said. He walked over to stand beside Elias. They stood shoulder to shoulder, looking down. "That the beauty exists is good. Even if no one sees it."

  "Moore also said the consciousness of it was the real value. The organic unity. The emotion matching the object." Elias kicked at a loose stone. "If we're the last consciousnesses, Julian, then effectively, no one sees it. Once we walk out, it's like the unperceived world again. Except worse. Because we know what we're losing."

  Julian was silent for a long time. He reached out, not to touch the mosaic, but to rest his hand on Elias's shoulder. The gesture was familiar, worn smooth by decades. It was an anchor.

  "If I had seen this alone," Julian said, "I would have felt the loss. Just the loss."

  "And now?"

  "Now I feel…" Julian searched for the word. He looked from the floor to Elias's face. The light from the breach caught the lines around his eyes. "I feel that the beauty is… louder. Because you're seeing it too."

  Elias understood. The aesthetic appreciation was one thing. The personal affection was another. But here, in the dust, with the water waiting above them, the two had fused. The beauty of the mosaic validated their friendship—*look at this, we found this*—and the friendship validated the beauty—*it is not lost, because we hold it together.*

  If they packed up now, left the dirt on the stones, they would save themselves an hour of labor. The photographs would suffice for history. But the photographs were flat. They captured the object, not the experience.

  "We should finish the corner," Elias said, pointing to a patch of dark grout near the edge. "The light hits it wrong."

  "It won't matter tomorrow," Julian said.

  "It matters now."

  Julian nodded. He picked up the mirror again. He didn't ask for instructions this time; he knew the angle. He held it steady, his muscles straining slightly, trusting Elias to do the delicate work. They moved in a rhythm established over forty years. Elias brushed; Julian adjusted. Elias stepped back; Julian lowered the glass. There was no need for speech. The coordination was its own language, a physical manifestation of their shared history.

  When the corner was clear, Julian locked the mirror in place with a wedge of wood. They stood back. The beam held true. The garden on the floor glowed, vibrant and whole.

  It was a perfect thing. And it was doomed.

  Elias felt a surge of something that wasn't sorrow. It was a fierce, protective joy. The value wasn't in the mosaic's survival. It wasn't in the legacy. It was in the fact that, for this one hour, the excellence of the object and the excellence of their affection had occupied the same space. The sum was greater than the parts. The beauty made the friendship solemn; the friendship made the beauty bearable.

  If Elias were alone, the beauty would be a ghost. If Julian were alone, it would be a memory. Together, it was a witness.

  "Ready?" Julian asked.

  Elias looked at the garden one last time. He knew that when the water came, the color would remain, hidden in the dark. Moore was right about that. The beauty would still be there, intrinsic and good, even in the crushing dark. But the *goodness* that mattered to them—the human good—was here, in the heat of the reflection on their faces.

  "Ready," Elias said.

  Julian didn't move the mirror. He left it wedged, angled to catch the sun if anyone ever breached the water, though they knew no one would. It was a gesture of defiance, or perhaps just grace. To leave the light on for an empty room.

  They walked out of the chapel together, up the steep path toward the ridge. They did not look back. Behind them, the beam of light struck the gold tesserae, burning brightly in the silence, witnessed by no one, yet somehow complete.

  At the top of the ridge, the bus waited to take them away from the valley. The engine was idling.

  "You know," Julian said, opening the door. "It was better than I remembered."

  Elias paused, his hand on the rail. He looked at Julian, really looked at him, seeing the friend who had stood in the dust and held the light.

  "Yes," Elias said. "It was."

  He climbed aboard. The bus pulled away, turning its back on the valley. Below them, the sun dipped below the horizon, and the chapel went dark. But the silence between them in the bus was not empty. It was full of the thing they had carried out with them, invisible and indestructible.
