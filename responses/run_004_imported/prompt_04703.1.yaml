answer: |-
  # The Case for Lexical Thresholds: Why We Must Reject Non-Elitism

  Gustaf Arrhenius's impossibility theorems are the population ethicist's equivalent of Gödel's incompleteness results: a rigorous demonstration that within a sufficiently rich system, consistency comes at the price of completeness. For decades, the debate centered on Total Utilitarianism and the Repugnant Conclusion (RC). Parfit showed that Total Utilitarianism implies that a world of vast billions living lives barely worth living is better than a world of billions living lives of exquisite quality. Critics assumed this was a *reductio ad absurdum* specific to aggregationist views. Arrhenius's decades of work shattered that comfort. His theorems demonstrate that any welfarist axiology satisfying a set of seemingly minimal adequacy conditions—including Average Utilitarianism, Critical-Level views, and even many Person-Affecting views—runs into a contradiction.

  You asked for a side, not a survey. Here it is: The only coherent resolution to Arrhenius's impossibility results is to reject the condition of **Non-Elitism** (specifically, the continuity assumptions underpinning it) and adopt a **Lexical Threshold View**. We must accept that there are levels of welfare that are lexically superior to others, such that no quantity of lives below the threshold can outweigh a sufficient quantity of lives above it. While this view violates the intuition that "everything has a price," it preserves the structural integrity of moral reasoning (Dominance and Non-Sadism) and avoids the substantive horrors of the Repugnant and Sadistic Conclusions.

  ### The Impossibility Landscape

  To understand why Lexicalism is the necessary choice, we must look at what Arrhenius forces us to sacrifice. His Sixth Impossibility Theorem (and related results in *An Impossibility Theorem for Welfarist Axiologies*) essentially proves that no population axiology can simultaneously satisfy the following conditions:

  1.  **Egalitarian Dominance:** If population A is perfectly equal and population B is unequal, but everyone in B is worse off than everyone in A (and population sizes are equal), then A is at least as good as B.
  2.  **General Non-Extreme Priority (Non-Elitism):** For any loss in welfare, there is some number of people gaining a smaller amount of welfare that compensates for it. (This is the formal engine of the Repugnant Conclusion).
  3.  **Non-Sadism:** It is not better to add lives with negative welfare than to add lives with positive welfare.
  4.  **Transitivity and Completeness.**

  Most theories fail by trying to keep Non-Elitism. Total Utilitarianism keeps Non-Elitism and Dominance but yields the Repugnant Conclusion. Critical-Level Utilitarianism avoids the Repugnant Conclusion by setting a threshold for value, but in doing so, it violates Non-Sadism, leading to the **Sadistic Conclusion**: it can be better to add lives with negative welfare than to add lives with positive welfare (provided the positive lives are below the critical level). Person-Affecting views often avoid these by violating Transitivity or Dominance, rendering the theory unable to rank outcomes in a way that guides action.

  The strategic choice, then, is to identify which condition is the "weakest link." I argue that **Non-Elitism** is that link.

  ### Why Non-Elitism Must Go

  Non-Elitism is the formal requirement that welfare is continuous and fully trade-off-able. It asserts that for any degradation in the quality of life, there is a quantity of such lives that makes the degraded world better than a high-quality world. This is the mathematical heartbeat of the Repugnant Conclusion.

  Defenders of Total Utilitarianism often argue that we should "bite the bullet" on the RC because conditions like Egalitarian Dominance are logically stronger than our intuitions about quality. They argue that rejecting Dominance leads to incoherence: how can a world where everyone is worse off be *better*? This is a strong point. If we sacrifice Dominance to save Non-Elitism (as some Average views do), we lose the ability to say that making everyone worse off is bad. That is a fatal flaw for a moral theory.

  Similarly, sacrificing Non-Sadism (as Critical-Level views do) is untenable. The Sadistic Conclusion implies that there are scenarios where creating suffering people is morally preferable to creating happy people (simply because the happy people aren't happy *enough* to cross the critical threshold). This violates the fundamental directional nature of welfare: positive is good, negative is bad. A theory that tells us suffering can be preferable to happiness, even in edge cases, has lost its connection to the concept of "welfare" entirely.

  This leaves Non-Elitism. Why should we keep it? The intuition behind Non-Elitism is that value is homogeneous—that a life of "muzak and potatoes" is just a smaller unit of the same substance as a life of "symphonies and love." But this conflates *quantity of welfare* with *quality of life*.

  A Lexical Threshold View posits that there is a discontinuity in value. Once a life reaches a certain threshold of richness, autonomy, and deep satisfaction, it enters a different category of value that cannot be summed against lives below that threshold. This is not mysticism; it is a recognition of the phenomenological difference between mere existence and flourishing. If we accept this, we block the "Mere Addition Paradox" slide from A to Z. You cannot trade a single life of lexical value for a billion lives of sub-lexical value, no matter how large the billion.

  ### Addressing the "Arbitrariness" Objection

  The standard objection to Lexicalism is the "arbitrariness" charge: Where do you draw the line? Is it at welfare level 100? 100.001? If the line is arbitrary, the theory is unstable.

  This objection mistakes the nature of lexical thresholds. We do not need to specify the exact hedonic tonnage that constitutes the threshold. We can define it qualitatively. Parfit, in his later work, suggested that certain "higher goods" (autonomy, deep relationships, creative achievement) are lexically superior to mere pleasure. A life devoid of these goods, no matter how pleasant, is of a different *kind* than a life that possesses them.

  Arrhenius's theorems assume a welfarist framework where welfare is a single scalar quantity. A Lexical View challenges the scalar assumption. It argues that the "welfare" in a life of deep achievement is not just *more* of the "welfare" in a life of passive contentment; it is *different*. By rejecting the scalar continuity assumption, we reject the premise that allows the impossibility theorem to grind. We are not drawing an arbitrary line on a continuum; we are recognizing distinct categories of human experience.

  Furthermore, the charge of arbitrariness cuts both ways. Total Utilitarianism draws an arbitrary line at *zero*. It implies that a life at +0.0001 is worth creating, and that enough of these lives outweigh a world of masters. Is that not also an arbitrary commitment to aggregation? The Lexicalist simply draws the line higher, at the point where life becomes distinctly *human* in the full sense, rather than merely sentient.

  ### The Cost: The "Lexical Repugnant Conclusion"

  Adopting Lexicalism does not come without costs. It implies what we might call the "Heroic Conclusion" or "Lexical Repugnant Conclusion": One life of lexical value is better than *any* number of lives below the threshold. Does this mean we should let a billion people starve to save one artist?

  No, and here is why. First, lexical views can be formulated as **Lexical Prioritarianism**. We still care about the number of lives above the threshold. A world with a million lexical lives is better than a world with one. The lexicality only applies to trade-offs *across* the threshold, not within it.

  Second, the "monstrous" implications usually arise from thought experiments that isolate variables unrealistically. In the real world, saving the artist rarely requires *letting* the billion starve; it requires resource allocation where marginal utility still applies below the threshold. But even if we face the hard case: if the choice is truly between the extinction of a high-culture civilization (lexical lives) and the continuation of a vast population of drugged, contented slaves (sub-lexical lives), the Lexicalist says: save the civilization.

  Is this monstrous? I argue it is not. It is the recognition that the *point* of population ethics is not to maximize the sum of neural firings, but to foster conditions for valuable existence. If a theory tells us that a universe of cockroaches experiencing mild pleasure is better than a universe of one human being writing the *Divine Comedy*, that theory has lost the plot. Total Utilitarianism tells us the cockroaches win if there are enough of them. Lexicalism tells us the human wins.

  ### Why This Beats the Alternatives

  Let's weigh the bullets we are asked to bite:

  1.  **Total Utilitarianism:** Bites the Repugnant Conclusion. Implies we should prioritize quantity over quality to the point where the distinctively human is erased by the merely sentient. It violates our deepest intuitions about the *purpose* of morality.
  2.  **Critical-Level Utilitarianism:** Bites the Sadistic Conclusion. Implies that adding suffering can be better than adding happiness. This undermines the very definition of welfare as a guide for action.
  3.  **Person-Affecting Views:** Often violate Transitivity or Dominance. This makes the theory action-guiding only in a patchy, incoherent way. If A > B and B > C but C > A, how do we choose?
  4.  **Lexicalism:** Bites Non-Elitism. Implies that some goods are incomparable with others.

  The violation of Non-Elitism is the least damaging. It restricts the scope of aggregation, but it does not invert moral valences (like Sadism) nor does it demand we prefer misery to bliss (like RC, in the limit). It acknowledges a limitation in our ability to trade off values, which aligns with our experience of moral dilemmas. We often feel that certain rights or goods *should not* be traded, regardless of the utility gain. Lexicalism formalizes this intuition.

  ### Conclusion

  Arrhenius's impossibility theorems prove that we cannot have it all. We cannot have a complete, transitive, welfarist ordering that satisfies Dominance, Non-Sadism, and Non-Elitism. We must break the chain.

  Breaking Dominance makes morality incoherent. Breaking Non-Sadism makes morality perverse. Breaking Transitivity makes decision-making impossible. That leaves Non-Elitism. We must accept that the universe of value is not a smooth, continuous surface where everything trades off against everything else. There are cliffs. There are thresholds.

  By adopting a Lexical Threshold View, we accept that a world of flourishing lives is not just *more* good than a world of barely worth living lives; it is *better* in a way that resists summation. This saves us from the Repugnant Conclusion without forcing us into the Sadistic Conclusion. It is the only view that respects the qualitative distinction between surviving and living. Arrhenius showed us that consistency requires a sacrifice. We should sacrifice the idea that everything has a price, rather than sacrificing the idea that some lives are worth more than others.
