  (a) Goff's phenomenal bonding posits a primitive relation to ground macro-subjects, but it fails to explain the nature of this relation, effectively shifting the mystery from combination to the metaphysics of bonding. Consequently, this proposal relocates the problem rather than solving it, as the opacity of the bonding relation mirrors the opacity of the original combination issue.

  (b) Priority cosmopsychism avoids upward combination by asserting the cosmic subject is fundamental, yet it inevitably encounters the structurally identical "decombination problem" of explaining how individual subjects arise. Thus, it relocates the explanatory burden rather than dissolving it, trading the mystery of composition for the mystery of decomposition.

  (c) Coleman's panqualityism denies the existence of micro-subjects entirely, which removes the need to combine them but explicitly abandons the commitment to universal subjecthood central to traditional panpsychism. This counts as a retreat from the view's core ontology, preserving qualitative realism at the expense of the subject-based framework that motivated the position.

  (d) Seager's combinatorial infusion suggests micro-states are superseded by a fused macro-state, but it offers no mechanism for how distinct experiences merge without remainder. This lack of mechanistic explanation means the proposal relocates the mystery to the nature of infusion rather than providing a positive account of combination.

  (e) Identity panpsychism claims macro-experience is identical to micro-patterns, denying composition, but this comes at the cost of rendering non-identical micro-experience causally otiose. Because it sacrifices the causal efficacy of parts of the micro-level to avoid combination, it functions as a retreat from the explanatory completeness panpsychism seeks.

  (f) Non-constitutive panpsychism accepts that macro-experience brute emerges from micro-experience, directly surrendering the rejection of brute emergence that distinguishes constitutive panpsychism from physicalism. This is a clear retreat from the primary motivation for adopting panpsychism, as it admits the very explanatory gap the view was designed to close.

