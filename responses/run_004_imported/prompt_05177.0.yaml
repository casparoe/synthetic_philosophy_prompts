  **MEMORANDUM**

  **TO:** AI Safety Theory Fellowship Board
  **FROM:** Philosophy Department Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Cycle 4 Fellowship Finalists (Shutdown Problem)

  **1. Purpose and Criterion**

  We are deadlocked between two proposals addressing the same critical failure mode: the shutdown problem. Both Finalist A and Finalist B aim to ensure an agent does not resist deactivation. Our charter mandates that we fund the project that "most advances the theoretical foundations of corrigibility."

  Interpreting this phrase is the crux of our deadlock. If "foundations" means "rigorous extension of existing formalisms," Finalist A is the stronger candidate. If "foundations" means "examining the structural assumptions of the formalisms themselves," Finalist B is the stronger candidate.

  After reviewing the files and the external commentary, I recommend we award the fellowship to **Finalist B**.

  **2. Assessment of Finalist A (Utility Indifference)**

  Finalist A proposes to patch the standard Expected Utility Maximizer (EUM) framework. The goal is to construct a utility function that renders the agent indifferent to the shutdown button's state, even after self-modification.

  This is a rigorous, well-defined project. It operates within a language our board speaks fluently. However, we must take the external referee's concern seriously: this is not a new puzzle. The instability of utility indifference under self-modification was flagged in early corrigibility literature (e.g., MIRI 2015) as a major open block. Funding A means funding another attempt to square a circle that has resisted squaring for nearly a decade.

  While Finalist A's work would be valuable *engineering theory*—telling us exactly how and why current patches fail—it risks being incremental. It assumes the EUM framework is the correct vessel for corrigible agency and seeks to repair the vessel. If the vessel itself is the source of the leak, no amount of patching will advance the *foundations* of safety; it will only map the contours of the failure.

  **3. Assessment of Finalist B (Incomplete Preferences)**

  Finalist B proposes that we stop trying to force the agent to rank shutdown vs. non-shutdown. By modeling the agent's preferences as genuinely incomplete between these trajectories, governed by a dominance principle rather than a total ordering, the agent theoretically lacks the incentive to manipulate the button state.

  This is a paradigm-challenging proposal. It does not patch the utility function; it questions the requirement that a safe agent must have a complete utility function at all.

  **4. Addressing the Primary Objection (Coherence and "Shippability")**

  I am aware that two board members have characterized Finalist B's approach as "decision-theoretic sleight of hand," noting that "you can't ship a system built on an agent that refuses to rank its own options." This is the strongest objection to my recommendation, and it must be addressed directly.

  The objection rests on a category error regarding the purpose of this fellowship. We are not funding a product prototype; we are funding *theoretical foundations*. The question "Can an agent with incomplete preferences act coherently without being money-pumped or freezing?" is not a sleight of hand; it is an open question in decision theory and philosophy of action.

  If Finalist B succeeds, they demonstrate that corrigibility is not a constraint to be added to agency, but a structural feature of a specific *kind* of agency. If they fail—if they prove that incomplete preferences inevitably collapse into complete ones under reflection—that is also a foundational result. It would tell us that EUM is inescapable for reflective agents, forcing us to abandon the incomplete preferences path with certainty.

  To dismiss B because the agent "won't ship" is to judge a mapmaking expedition by the cargo capacity of the vehicles. We need to know if the territory exists before we build the road.

  **5. Why Not Finalist A?**

  To Finalist A and their supporters: This recommendation is not a judgment on the rigor of your proposal. Your formalism is precise, and the problem of self-modification stability is genuine. However, the charter asks us to maximize *advancement*.

  Continuing to pour resources into utility indifference without a breakthrough on the self-modification loophole risks diminishing returns. We already know the indifference condition is fragile. Proving it is fragile *again*, or finding a slightly more robust patch that still relies on the same vulnerable architecture, does not advance the foundation as much as testing whether the foundation can be laid elsewhere. We can afford to let the engineering-adjacent work wait until we are more certain that the standard EUM architecture is the only viable path.

  **6. Conclusion**

  The shutdown problem persists because standard agents view shutdown as a threat to their utility maximization. Finalist A tries to convince the agent it isn't a threat. Finalist B tries to build an agent for whom the threat comparison never arises.

  Given our mandate to advance *theoretical foundations*, we should prioritize the investigation that challenges the root incentive structure over the one that attempts to stabilize it within a potentially flawed paradigm. I urge the board to fund Finalist B, with the explicit understanding that the deliverable is a proof of concept regarding the coherence of incomplete preferences in reflective agents, not a shippable alignment module.

  **Recommendation:** Award Fellowship to Finalist B.
