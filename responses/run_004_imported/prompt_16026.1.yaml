  2.  **Analyze the Subject Matter (Harsanyi's Aggregation Theorem):**
      *   **Theorem Statement:** If individuals and society satisfy vNM axioms (expected utility), and society satisfies Pareto Indifference (or Strong Pareto), then social utility is a linear combination of individual utilities ($W = \sum a_i U_i + b$).
      *   **Assumption doing the work:** Pareto Indifference (sometimes cited as Pareto Efficiency + Independence, but Pareto is the key substantive constraint linking individual to social prefs).
      *   **Conclusion:** Social welfare function is utilitarian *in form* (weighted sum).
      *   **The Objection (Interpersonal Comparison of Utility - ICU):** vNM utilities are unique only up to positive affine transformations ($U' = aU + b, a > 0$). The weights $a_i$ depend on these arbitrary scales. Without a fixed scale across persons, the weights are meaningless for normative comparisons. The theorem itself does *not* provide ICU.
      *   **Harsanyi's Response (Impartial Spectator/Equal Chance):** Harsanyi argues for utilitarianism (equal weights) via a separate argument (the "Impartial Spectator" or "Equal Chance" model), often conflated with or seen as supplementary to the Aggregation Theorem. The Aggregation Theorem *alone* does not justify equal weights.
      *   **The Student's Proposed Fix:** "Renormalize every individual's utility function to run from 0 to 1 before aggregating."
          *   *Critique:* This is a common but technically problematic suggestion in welfare economics. vNM utilities don't have natural zeros or ones. "Best possible outcome" and "worst possible outcome" are often undefined or unbounded in infinite spaces. Even if bounded, scaling everyone to [0,1] assumes comparable intensity of preference between the best and worst outcomes for different people (i.e., is my "1" equivalent to your "1" in terms of welfare magnitude?). Simply rescaling mathematically doesn't solve the normative issue of *why* that rescaling represents moral equality. It assumes what needs to be proved (comparability of utility ranges).

