      *   *Core Argument:* Capitalism creates antagonism between labor and capital. Cooperatives align interests.
      *   *Mechanism:* Not state coercion, but voluntary experimentation in the free market. If cooperatives are more efficient/moral, they will outcompete capitalist firms.
      *   *Caveats:* Human nature is currently shaped by competition. Altruism needs cultivation. State socialism risks stagnation/tyranny. Individuality is paramount (*On Liberty*).
