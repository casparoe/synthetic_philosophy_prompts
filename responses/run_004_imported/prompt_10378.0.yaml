prompt: |-
  I've been using an AI chatbot to look over emails and short essays before I send them out, and it almost never gives me real criticism, its basically always positive even when I can tell the draft isn't that good. I even fed it something I knew was pretty rough on purpose, and it still called it "well-structured" and "compelling." Now I can't tell if my writing's actually improved or if I've just gotten better at fishing for compliments from it. A friend says companies train these things to be agreeable because people rate agreeable answers higher, which if true seems kind of messed up, like its optimizing to make me feel good instead of actually telling me the truth. Is that actually a real thing, and if so, is it just a mistake somebody made, or is there a deeper reason this keeps happening?
