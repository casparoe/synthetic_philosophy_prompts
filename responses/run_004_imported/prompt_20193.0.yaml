prompt: |-
  Me and my housemate got way too deep into anthropic reasoning last night (yes, that's a normal Tuesday for us) after she brought up the Doomsday argument to freak me out about humanity going extinct sooner than we'd like to think. I said the whole thing leans on the self-sampling assumption, which I've never fully trusted, and that I actually lean self-indication assumption. She hit me with the classic presumptuous philosopher case -- the one (I think it's originally Bostrom's?) where two physical theories are equally well supported by the evidence so far, but one implies a way bigger population of observers, and some smug philosopher declares that theory true from his armchair before anyone even runs the experiment, purely because SIA weights hypotheses by how many observers they contain. She said that alone is reason enough to ditch SIA and stick with SSA, and honestly I didn't have a great comeback in the moment.

  Its been bugging me since though, because doesn't the doomsday argument pull the exact same move, just aimed in the other direction? It also takes a purely self-locating fact -- my birth rank among however many humans will ever exist -- and cranks out a confident, substantive conclusion about the world (that there won't be some huge number of future humans) without looking at any actual evidence about extinction risk. So what I want is for you to build that case properly, not a "both sides have a point" cop-out: argue for the position that the presumptuous philosopher gives no special reason to favor SSA over SIA, since SSA's own flagship result, the doomsday argument, is guilty of the exact same move the philosopher is being mocked for. If it helps make the parallel vivid, feel free to invent a toy "presumptuous demographer" scenario that mirrors the original case but runs on SSA instead of SIA. It'd also be great if you dug into how the reference class gets picked along the way, since I've got a hunch that's where both sides find room to wriggle out of the objection.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their housemate had a debate about anthropic reasoning (SSA vs. SIA) triggered by the Doomsday Argument.
      *   **User's Position:** Leans towards Self-Indication Assumption (SIA).
      *   **Housemate's Position:** Leans towards Self-Sampling Assumption (SSA), citing the "Presumptuous Philosopher" (PP) thought experiment as a reductio ad absurdum against SIA.
      *   **User's Goal:** Wants a strong argument *against* the housemate's claim. Specifically, argue that the Presumptuous Philosopher objection doesn't uniquely disqualify SIA because SSA's flagship result (the Doomsday Argument) commits the exact same sin (deriving substantive empirical facts from self-locating information alone).
      *   **Specific Requests:**
          *   Don't give a "both sides" cop-out. Take the user's side (SIA defense/SSA critique).
          *   Create a toy "Presumptuous Demographer" scenario mirroring the PP case but using SSA logic.
          *   Discuss the role of the *reference class* in this debate.

  2.  **Deconstruct the Core Philosophical Conflict:**
      *   **SSA (Self-Sampling Assumption):** "Reason as if you are a random sample from the set of all observers in your reference class."
          *   *Consequence:* Doomsday Argument. If you are early in the sequence, the total sequence is likely short.
          *   *Critique:* Presumptuous Philosopher. If Theory A implies $10^{10}$ observers and Theory B implies $10^{50}$, SSA says you are more likely to exist in A (because you are a larger fraction of the smaller set? No, wait. SSA says $P(E|H) = 1/N_H$. So smaller $N$ makes your specific rank more likely). *Correction:* Let's double check the PP logic.
          *   *PP Logic (Bostrom):* Two theories, $T_1$ (small universe) and $T_2$ (huge universe). Prior odds 50/50. SIA says $T_2$ is vastly more likely because there are more observers to be. SSA says odds remain 50/50 (ignoring birth rank for a moment) or shifts towards $T_1$ if birth rank is considered (Doomsday).
          *   *The User's Insight:* The PP objection claims SIA is arrogant because it infers world size from existence. But the Doomsday Argument (SSA) infers world size from birth rank. Both infer empirical facts about the world's size/duration from indexical information.
      *   **SIA (Self-Indication Assumption):** "Reason as if you are a random sample from the set of all *possible* observers." (Or: Weight hypotheses by the number of observers they contain).
          *   *Consequence:* Presumptuous Philosopher. Favors the theory with more observers.
          *   *Critique:* Doomsday Argument is blocked. SIA cancels out the SSA effect.

  3.  **Develop the Argument (The "Mirror" Strategy):**
      *   The core symmetry is "Armchair Cosmology."
      *   PP (against SIA): "You claim to know the universe is huge just because you exist."
      *   DA (against SSA): "You claim to know the universe is short just because you were born early."
      *   Both bypass empirical data (physics, sociology, risk analysis) in favor of probabilistic reasoning about *where* or *that* you are.
      *   *Task:* Construct the "Presumptuous Demographer."

  4.  **Drafting the "Presumptuous Demographer" Scenario:**
      *   Need a scenario where SSA forces a conclusion about population size based *only* on birth rank, ignoring empirical evidence.
      *   *Setup:* Two theories about human history length. $H_{short}$ (100 billion total humans) vs. $H_{long}$ (100 trillion total humans).
      *   *Evidence:* Empirical evidence (fusion power, space colonization tech) strongly suggests $H_{long}$. Let's say 99% confidence based on physics.
      *   *SSA Move:* I am human #70 billion.
      *   *Calculation:* Under $H_{short}$, #70B is near the end (likely). Under $H_{long}$, #70B is very early (unlikely to be sampled).
      *   *Result:* SSA shifts probability drastically toward $H_{short}$, overriding the empirical physics evidence.
      *   *Parallel:* Just like PP overrides physics evidence about universe size with "I exist," DA overrides physics evidence about extinction risk with "I am early."

  5.  **Addressing the Reference Class:**
      *   This is the escape hatch for both sides.
      *   SSA users often widen the reference class to dilute the Doomsday effect (e.g., include aliens, AI, all sentient beings). If the class is huge, my human rank matters less.
      *   SIA users might narrow the class to avoid the Presumptuous Philosopher (though SIA is less sensitive to reference class than SSA in some formulations, it still matters for "who counts as an observer").
      *   *Key Point:* If SSA users wiggle out of Doomsday by tweaking the reference class, they lose the "objective" high ground against SIA. If they keep the class narrow to make Doomsday work, they are vulnerable to the Presumptuous Demographer.

  6.  **Structuring the Response:**
      *   **Validation:** Acknowledge the depth of the conversation (it *is* a normal Tuesday for some of us). Validate the user's intuition (the symmetry argument is strong).
      *   **The Core Symmetry:** Define the "Armchair Empiricism" charge. Both use indexical info to override physical evidence.
      *   **The Presumptuous Demographer:** Build the toy model. Make it punchy. Show how SSA ignores empirical extinction data.
      *   **The Reference Class Trap:** Explain how this is where the inconsistency lies. If SSA avoids Doomsday via reference class, it loses bite. If it keeps Doomsday, it's presumptuous.
      *   **Conclusion:** Reiterate that PP is not a knockout blow against SIA because SSA has its own bullet to bite.

  7.  **Refining the Argument (Self-Correction/Nuance):**
