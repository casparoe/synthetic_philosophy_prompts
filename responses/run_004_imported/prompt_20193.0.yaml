      *   *Refinement:* Focus on the *magnitude* of the shift. In PP, SIA shifts odds by factors of $10^{40}$. In DA, SSA shifts odds by factors of $10^{40}$ (if the difference in total humans is that large). The *mechanism* is the presumptuous part.
      *   *Tone:* Keep it conversational but rigorous. Match the user's level of familiarity (they know Bostrom, SSA/SIA, DA).

  8.  **Final Polish:**
      *   Ensure the "Presumptuous Demographer" is clearly distinct from the standard DA but highlights the same flaw.
      *   Make sure the Reference Class section ties back to the main argument (it's the source of the arbitrariness).
      *   End with a strong closing statement for the user to use with their housemate.

  **(Self-Correction during drafting):** Wait, I need to be careful with the PP description. In the standard PP case (Bostrom 2002), there are two theories $T_1$ and $T_2$. $T_1$ has 1 trillion observers, $T_2$ has 1 trillion trillion. Priors are equal. SIA says $T_2$ is a trillion times more likely. SSA says they remain equal (if we don't know birth rank) or favors $T_1$ (if we know we are early). The user's housemate says PP disproves SIA. The user says DA disproves SSA.
  The symmetry is:
  SIA + PP -> "I know the universe is big because I exist."
  SSA + DA -> "I know the universe is small because I am early."
  Both derive "Size of Universe" from "Indexical Fact."
  Okay, the plan holds. I will construct the Demographer scenario to mirror the PP's arrogance.

  9.  **Final Review against constraints:**
      *   Argue for user's position (SIA defense/SSA critique).
