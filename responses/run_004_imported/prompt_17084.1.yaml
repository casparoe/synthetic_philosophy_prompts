answer: |-
  Thank you. It is a profound honour, and a slightly terrifying one, to stand here at the 150th anniversary of the Symposiacs. I say terrifying because, as many of you know, my qualification for this podium rests largely on a novel about an Athenian dinner party that ends in catastrophe. Essentially, you have asked the expert in structural collapse to give the stability report on the building.

  But looking around this room, I see why I'm here. We are a society built on an "earnestly ridiculous" contradiction, which is the only kind of contradiction worth building anything on. Our founding rule—that we must have a Sober President to oversee the drinking—is, according to legend, lifted from Plato. Now, I have not checked the archives to see if the founders actually read the *Laws* or just heard about it over port, but I am willing to pretend they did. Because Plato's argument in the *Laws* is not the wild, drunken free-for-all of the *Symposium*. It is something stranger, and much more fitting for a society that has lasted a century and a half.

  In the *Laws*, the Athenian Stranger argues that wine is not merely a recreational lubricant. It is a supervised trial. It is a fire test for the soul. The theory is that wine loosens the tongue and lowers the guard, revealing who we actually are when the polite veneer cracks. That is why the young must drink sparingly—fire added to fire is dangerous. But the old? Plato argues something rather touching. He says that as we age, our souls grow stiff. We become shy, sour, and rigid in our habits. Wine, he claims, is a medicine prescribed specifically for the elderly to soften that stiffness, to make the soul pliable enough to learn, and to laugh, again.

  Looking at the spread of this room, I see Plato's grading system in action. To the current students: you are the fire. You are here to learn self-command, not to lose it. The Sober President watches over you not to spoil your fun, but to ensure you pass the test. To the alumni in the middle years: you are in the proving grounds. The wine reveals whether your character has hardened into virtue or merely into habit.

  And to the Fellows and the older members here tonight: you are the recipients of the medicine. If you feel a glass of wine making you feel slightly more reckless, slightly more tender, or slightly more willing to forgive the foolishness of the young, do not feel guilty. You are following a dialectic prescription. You are treating the stiffness of the soul.

  I confess, as an undergraduate member of this society, I was a poor subject for this experiment. My own contributions to the Symposiacs were largely limited to enthusiastic attendance and a demonstrable lack of Platonic self-command. I failed the test, repeatedly. But perhaps that is why I am a novelist today. I learned that the most interesting stories happen in the gap between the wine and the law, between the impulse and the Sober President's gavel.

  For 150 years, this society has survived because it understood that balance. A dinner without wine is a seminar; a dinner without law is a riot. But a dinner with both? That is a civilization. We gather to test our character, to soften our edges, and to ensure that while the wine may flow, the friendship remains the anchor.

  So, I ask you to raise your glasses. I leave the actual calling of the toast to our Sober President, whose clarity of mind we trust to judge the success of our evening. But I will suggest the sentiment.

  To the founders who read Plato, whether accurately or not; to the Sober President who keeps us honest; and to the medicine that softens us, so that we may remain, for one night at least, beautifully, dangerously, and collectively young.

  To the Symposiacs.
