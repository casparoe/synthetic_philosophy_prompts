      *   *Selection Bias:* Excludes non-drinkers, recovering addicts, religious abstainers, parents with childcare duties, etc. This damages DEI (Diversity, Equity, and Inclusion).
      *   *Power Imbalance:* Can a junior employee truly say "no" to a founder's drinking ritual? Even with a "sober captain," the pressure is implicit.
      *   *False Positive/Negative:* A lightweight drinker might be a great crisis manager. A high-functioning alcoholic might look "steady" while drunk but be unreliable.
      *   *Liability:* Sexual harassment, accidents, HR complaints.
      *   *Psychological Safety:* Amy Edmondson's work. Does this *increase* safety or make people feel they must perform sobriety/drinking ability to belong?

  6.  **Synthesize for the Journalist:**
      *   *Tone:* Objective, analytical, nuanced, but firm on the risks.
      *   *Structure:*
          1.  Acknowledge the underlying intuition (vulnerability/bonding).
          2.  Debunk the specific mechanism (alcohol $\neq$ crisis management).
          3.  Highlight the organizational psychology risks (psychological safety, inclusion).
