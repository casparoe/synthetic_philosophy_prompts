      *   **Tone:** Analytical, persuasive, essay-style.
      *   **Key Explanations to Cover:**
          1.  Deep Conceptual View (Knobe's original claim: morality is constitutive).
          2.  Performance Error/Blame View (anger/bias distorts judgment).
          3.  Pragmatic View (conversational implicature).
          4.  Non-Moral Asymmetry View (cost/benefit or normative deviation).

  2.  **Initial Assessment & Stance Selection:**
      *   *The Deep Conceptual View:* Strong initially, but faces challenges with non-moral variants. If it happens with "etiquette" or "arbitrary norms," is it really *moral*?
