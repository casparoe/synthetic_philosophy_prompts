answer: |-
  # The Glitch That Isn't: Why the Knobe Effect Reveals the Architecture of Agency

  The vignette is now famous enough to be a philosophical staple. A chairman is told a new program will increase profits but harm the environment. He says, "I don't care at all about harming the environment. I just want to make as much profit as possible." The program goes ahead, and the environment is harmed. When asked, the vast majority of people say the chairman *intentionally* harmed the environment.

  Flip the script: The program helps the environment. The chairman says, "I don't care at all about helping the environment. I just want to make profit." The environment is helped. Now, the vast majority say he did *not* *intentionally* help the environment.

  This is the Knobe Effect. The mental states of the chairman are identical in both cases (belief that the side effect will occur, desire for profit, indifference to the side effect). The only variable is the moral valence of the outcome. For two decades, this finding has fractured experimental philosophy. One camp argues this reveals a deep truth: moral judgment is baked into the very concept of intentional action. The other camp argues this is a performance error—a bias where anger or blame corrupts a otherwise neutral cognitive process.

  After weighing the competing explanations against the accumulated data, the verdict is clear: **The Knobe Effect is not a performance error, a pragmatic slip, or a bias to be discounted. It is a feature of our cognitive architecture.** The evidence dictates that normative evaluation is constitutive of how human beings attribute agency. To call it a "bias" is to cling to an armchair definition of intentionality that does not exist in the human mind.

  ### The Case for the "Bug"

  To understand why the "Deep Structure" view wins, we must first steelman the opposition. The skeptics, often traditional philosophers or cognitive scientists committed to a modular view of the mind, argue that the Knobe Effect is a distortion.

  The **Performance Error Hypothesis** suggests that people have a standard, neutral definition of intentional action (roughly: did the agent believe it would happen and desire it?). However, when the outcome is bad, the emotional heat of blame bleeds into the judgment. We are so eager to condemn the chairman that we retroactively assign him intentionality he doesn't technically possess. On this view, the Knobe Effect is a bug in the system, akin to a visual illusion. If we could cool down our emotions, the effect would vanish.

  A softer version is the **Pragmatic Hypothesis**. This argues that people *know* the chairman didn't intentionally harm the environment in the strict sense, but they say "yes" because it is conversationally useful. Saying "he intentionally harmed it" is a shorthand for "he is blameworthy." It's a lie we tell to communicate moral status, not a genuine report on mental states.

  Both of these views share a crucial assumption: that there is a "pure" concept of intentional action existing prior to moral judgment, and that the Knobe Effect represents a corruption of that purity.

  ### Why the "Bug" Theory Collapses

  If the Knobe Effect were merely a performance error driven by emotion or blame, we would expect it to behave like other biases. It should correlate with emotional arousal. It should disappear when cognitive resources are taxed (since bias often relies on heuristic, fast thinking). It should be absent in populations that haven't fully developed complex moral reasoning.

  The data rejects all three predictions.

  First, consider **cognitive load**. If the effect were a bias resulting from emotional interference, giving people time to reflect or taxing their working memory should alter the results. Studies manipulating cognitive load have shown that the Knobe Effect persists even when participants are under pressure. In some variations, the effect remains robust even when participants are explicitly instructed to ignore moral considerations. If this were a "slip," careful thinking should correct it. It does not.

  Second, consider **developmental psychology**. If the effect relies on complex conversational pragmatics or sophisticated moral blame, young children should not exhibit it. Yet, studies show that children as young as four years old display the asymmetry. They attribute intentionality to bad side effects but not good ones, despite lacking the adult capacity for nuanced conversational implicature. This suggests the mechanism is foundational to how we learn to understand agency, not a learned social trick.

  Third, and most damning for the "Moral Bias" view, is the **Non-Moral Asymmetry**. The Knobe Effect is not limited to morality. If you replace "harming the environment" with "violating a company convention" or "deviating from a statistical norm," the effect persists. For example, if a chairman implements a policy that violates a trivial administrative rule to make a profit, people are more likely to say he *intentionally* violated the rule than if the policy adhered to the rule as a side effect.

  This proves that the driver is not specifically *moral* blame, but **normative deviation**. However, this does not save the Performance Error view; it destroys it. It shows that the mind does not separate "what happened" from "what should have happened." The calculation of intentionality is inherently tied to the calculation of norms.

  ### The Verdict: Normative Competence

  If it is not a bug, it must be a feature. The only explanation that survives the empirical gauntlet is the **Deep Structure (or Normative Competence) View**. This position argues that when we ask, "Did he do it intentionally?", we are not asking a purely descriptive question about causal chains and mental states. We are asking a question about the agent's relationship to the normative order.

  Joshua Knobe's original insight was correct, though it required refinement. It is not that morality "biases" the judgment; it is that the concept of *intentional action* is a moralized (or more broadly, normative) concept. To be an agent is to be a subject of norms. When an outcome is bad (or norm-violating), it stands out against the background of how things *ought* to be. The agent's indifference to that violation signals a specific stance toward the norm—a willingness to override it—which our cognitive architecture interprets as intentionality. When the outcome is good (or norm-conforming), it blends into the background of expected behavior. Indifference to a good outcome does not signal a stance worth marking with the label "intentional."

  This explains why the effect is immune to cognitive load and present in children. It is not a post-hoc rationalization; it is the primary processing mode. Neuroimaging studies support this, showing that judgments of intentional action in the "harm" condition activate brain regions associated with social cognition and emotion processing more than the "help" condition. The brain is not correcting a neutral judgment with emotion; the brain is using emotional/normative circuitry to *make* the judgment.

  ### The Implications

  Accepting this verdict forces us to abandon a cherished philosophical intuition: the idea that we can separate "facts" from "values" in the realm of human action. Traditional philosophy has long sought a value-neutral definition of agency, a clean mechanical description of what it means to act. The Knobe Effect proves this is a fantasy.

  If we classify the Knobe Effect as a bias, we are essentially saying that the average person is bad at philosophy. We imply that there is a "correct" way to judge intentionality (the traditional belief-desire model) and that the folk are failing to meet it. But this gets the science backward. Philosophy is supposed to analyze concepts as they are used, not as we wish they were used. If the universal human usage of "intentional" includes normative evaluation, then the normative evaluation is part of the concept.

  To call it a performance error is to privilege a theoretical construct over psychological reality. It is akin to arguing that because color perception depends on the human visual system, color isn't "really" a property of the world. If the human mind cannot conceive of intentional action without referencing norms, then intentional action *is* normative.

  ### Conclusion

  The Knobe Effect is not a glitch in human reasoning. It is a window into the machinery of social cognition. The evidence from child development, cognitive load, and non-moral variants converges on a single conclusion: our attribution of agency is inextricably linked to our evaluation of norms.

  We must reject the Performance Error and Pragmatic hypotheses. They attempt to save a "pure" concept of intentionality that does not exist in the wild. The verdict is that moral and normative judgment is constitutive of the concept of intentional action. This does not mean we are irrational; it means that for human beings, agency is not a mechanical process. It is a moral landscape. To act is to navigate norms, and to judge an action is to judge that navigation. The Knobe Effect doesn't mess with your head because it breaks your logic; it messes with your head because it reveals that your logic was never value-neutral to begin with.
