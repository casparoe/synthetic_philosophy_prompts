answer: |-
  Good evening. For those who don't know me, I'm the friend who got voted "the one who has to say something that isn't just cheers." Apparently, having an Econ PhD means I'm qualified to talk about money, even though Priya is the one who actually made some.

  There's a reason I'm standing here, and it's not just because I know how to read a balance sheet. Two years ago, Priya and I read John Maynard Keynes's essay *Economic Possibilities for our Grandchildren*. It was written in 1930. Keynes made a wild bet: he said that within a hundred years—meaning, roughly right now—technology and capital would solve the "economic problem." Scarcity would be beaten. We'd work fifteen hours a week.

  Everyone in finance knows the joke: Keynes was wrong about the fifteen hours. We all work more. But Keynes wasn't actually writing about hours. He was writing about what happens *after* the money is solved. He warned that we humans have been trained for generations to strive, not to enjoy. He worried that when the grind stops, we wouldn't know how to live wisely, agreeably, and well.

  Priya, you've done the impossible. You closed the spreadsheet. You solved the economic problem at thirty-three. But Keynes had a second thought, years later in *My Early Beliefs*. He looked back on his youth and admitted that thinking life was just about "good states of mind"—love, beauty, leisure—was naive. He realized civilization is a thin crust over something much darker, and that meaning is precarious.

  I bring this up not to rain on the parade, but to honor the magnitude of what you're doing. The traders in this room know the grind. Priya's mom and college friends know her heart. But all of us know that walking away from the structure of work is terrifying. The money question is solved. The living question is just opening.

  Keynes wasn't sure humanity was ready for freedom. But looking around this room, I think he missed one variable. He thought we'd have to face the future alone. But you're not alone. You've got the people who loved you before the quant fund, and the people who respected you during it.

  So, this isn't a toast to retirement. It's a toast to the next problem. The hard one. The one about how to live.

  To Priya. May you find the work in the leisure, and the meaning in the quiet. Cheers.
