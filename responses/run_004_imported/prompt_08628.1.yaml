      *   **Proposed Thesis:** Using Ames and Rosemont's "role ethics" interpretation, uprightness is constituted by role fidelity, not impartial honesty. Therefore, concealing the brother's fault isn't a lapse in honesty but an enactment of uprightness within that role.
      *   **Worry/Objection:** Is this unfalsifiable? (Liu Qingping's critique). Does it just justify nepotism?
      *   **Counter-Example/Refinement:** *Mencius* 7A35 (Shun and his murdering father). Shun lets the law take its course (Gao Yao arrests the father) but abdicates to flee with him. This balances public justice and private loyalty by exiting the conflicting role.
      *   **Task:** Critique the argument as if it were a full draft on three specific points:
          1.  Accuracy regarding Ames and Rosemont.
          2.  Efficacy of the *Mencius* case (is it cherry-picking?).
