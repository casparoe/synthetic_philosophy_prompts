  2.  **Deconstruct Point 1: Ames and Rosemont's Role Ethics:**
      *   *Core Concept:* Ames and Rosemont argue against importing Western "virtue ethics" or "deontology" onto Confucianism. They emphasize *role* as the primary ontological unit. We *are* our roles (son, father, ruler, subject).
      *   *Uprightness ($Zhi$):* In *Analects* 13.18, Confucius redefines $zhi$. It's not abstract truth-telling; it's authenticity within the relationship.
      *   *Accuracy Check:* The user's summary ("uprightness is not a role-independent virtue... partly constituted by how well each party is living up to what that particular relation calls for") is actually quite strong. It captures the anti-universalist stance of Ames/Rosemont.
      *   *Nuance:* Ames and Rosemont often emphasize that roles are *creative* and *interpretive*, not just rigid scripts. It's not just "blind loyalty." It's about sustaining the relationship in a way that contributes to the community's harmony. However, in the specific context of 13.18, they do defend the "concealment" as preserving the relational fabric.
      *   *Verdict:* The representation is accurate enough for a seminar blog, provided the user acknowledges that "role fidelity" isn't just "doing whatever the family wants" but maintaining the *integrity of the relationship* as a social good.

  3.  **Deconstruct Point 2: The *Mencius* Case (7A35):**
      *   *The Story:* Shun's father kills a man. Minister Gao Yao arrests him. Shun abandons the throne like a discarded shoe and carries his father on his back to live by the sea.
      *   *User's Interpretation:* Preserves impartial justice (arrest happens) and role loyalty (Shun saves/flees with father) by exiting the conflicting role (abdication).
