answer: |-
  Your friend is textually correct, but her conclusion that a Kantian framework *must* remain silent on factory farming is too hasty.

  She has accurately summarized the "Orthodox Interpretation" of Kant: for Kant, animals are not "persons" (rational agents), so they cannot be "ends in themselves." Therefore, we have no *direct* duties to them. Our duties regarding animals are "indirect duties to humanity." As Kant writes in the *Lectures on Ethics*, if a man shoots his dog, he violates a duty to himself because it damages his own capacity for sympathy, which he owes to other humans.

  However, being a "Kantian" does not mean being a "Kant scholar" who never deviates from the 18th-century text. It means adopting a methodology of reasoning about duty, universality, and respect. There are three robust ways a modern Kantian can object to factory farming without abandoning the core of the system.

  Here is how you can close that gap.

  ### 1. Strengthen the "Indirect Duty" Argument
  Your friend dismisses the indirect duty as "merely prudential." This is a misunderstanding of Kantian ethics. For Kant, an indirect duty is still a **moral duty**, not just a suggestion for well-being.

  *   **The Argument:** Kant argued that cruelty to animals dulls our sympathy. However, Kant was thinking of a farmer beating a horse or a nobleman hunting for sport. He could not have conceived of **industrialized** violence.
  *   **The Update:** Factory farming is not just "cruelty"; it is the systemic transformation of sentient life into "raw material." Participating in this system requires a profound, institutionalized dissociation from the reality of suffering.
  *   **The Kantian Objection:** To sustain factory farming, society must cultivate a specific kind of moral blindness. It requires us to treat the *concept* of living beings as *mere things* on a mass scale. This structurally undermines the moral disposition required to respect humanity. If the "Indirect Duty" is to preserve our moral sensitivity, then factory farming is a catastrophic violation of that duty, far worse than the occasional act of cruelty Kant warned against.
  *   **Result:** Even accepting your friend's premise, factory farming is morally impermissible because it corrupts the moral agent (us) on a societal level.

  ### 2. The Neo-Kantian Move: Christine Korsgaard
  The most powerful reply comes from contemporary Kantian philosopher Christine Korsgaard, specifically in her book *Fellow Creatures*. She argues that you can remain faithful to Kant's *logic* while rejecting his *anthropocentrism*.

  *   **The Problem:** Kant says only rational beings have "good" because only they can choose their ends.
  *   **Korsgaard's Fix:** She argues that rationality isn't what makes us matter; **sentience** is. As rational beings, we recognize that our own pain is bad *for us*. We don't avoid pain because we are rational; we avoid it because we are animal beings who suffer.
  *   **The Universalization:** If I claim my suffering matters because *I feel it*, I cannot consistently claim your suffering doesn't matter because *you feel it*. To make an exception for myself is a violation of the Categorical Imperative (universalizability).
  *   **The "End in Itself":** Korsgaard argues that animals are "ends in themselves" because they have a "good of their own." They strive to survive and avoid pain. To treat them as mere raw material is to treat their natural ends as nothing, which violates the spirit of the Formula of Humanity.
  *   **Result:** This grants **direct duties** to animals within a Kantian framework. It grounds the duty not in *their* rationality, but in *our* rationality requiring us to respect the sentience we share with them.

  ### 3. Expanding the "Kingdom of Ends"
  Some Kantians (like Allen Wood) argue that Kant's definition of "rational nature" is too narrow.

  *   **Teleology:** Kant acknowledges that animals have natural purposes (teleology). They are not clocks; they are organisms that seek their own preservation.
  *   **Respect for Life:** While they may not be moral *agents* (capable of duty), they are moral *patients* (capable of being wronged). A consistent Kantian system should respect the autonomy of a being's nature. Factory farming completely subverts the natural ends of a chicken or pig (movement, social bonding, foraging) to serve human ends.
  *   **Result:** Even if animals aren't members of the "Kingdom of Ends" in the legislative sense, they are subjects within it who deserve protection from being treated as *mere* means.

  ### How to Reply to Your Friend
  You can summarize your position like this:

  > "You're right that Kant himself didn't grant animals direct moral status. But a 'Kantian framework' is about how we reason, not just what Kant wrote in 1797.
  >
  > First, even on Kant's own 'indirect duty' view, factory farming is uniquely destructive to human morality because it institutionalizes the treatment of life as matter.
  >
  > Second, modern Kantians like Korsgaard have shown that the logic of the Categorical Imperative actually *demands* we extend moral consideration to sentient beings. If I value my own capacity to suffer and flourish, consistency requires I value that same capacity in others, regardless of their ability to do calculus or philosophy.
  >
  > So, a Kantian doesn't have to hope factory farming doesn't 'coarsen' us; they can argue it violates the requirement to treat living beings with a good of their own as more than mere tools."

  ### The Bottom Line
  Your friend has identified a tension in Kant's *historical* views, but not a fatal flaw in *Kantian* ethics. The core of Kantianism is **consistency** and **respect for ends**. Factory farming is difficult to reconcile with either.

  If you find Kantian ethics compelling, you are not bound to Kant's 18th-century blind spots. You are bound to the rigor of his method. And applied rigorously, that method leads many modern Kantians to the conclusion that factory farming is a profound moral failure.
