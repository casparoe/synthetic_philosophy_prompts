answer: |-
  **Owen:** "I've been reading Pereboom. He argues that if Malcolm's decision to leave was the inevitable result of his history—his brain, his trauma, the way we were raised—then he doesn't deserve blame. Not really. So when I feel this anger, I have to ask: am I feeling something *fitting*, or just something I'm programmed to feel? Because if it's just programming, it's no different than flinching when a ball comes at my head."

  **Ruth:** "But you aren't flinching from a ball, Owen. You're reacting to a brother. Strawson would say that resentment isn't a verdict you deliver from a courtroom in the sky; it's the cost of entry for caring about someone. To drop the resentment because of 'causal history' is to treat Malcolm like an object to be managed, not a person you have a stake in."

  **Owen:** "That's the move I can't swallow. You're conflating 'I can't help feeling this' with 'I am right to feel this.' Just because the participant stance is natural to humans doesn't make it *true*. If the universe is deterministic, then my 'stake' in him is just another causal link. Why should I honor a link that causes me pain based on a metaphysical error?"

  **Ruth:** "Because the alternative isn't truth, Owen. It's isolation. If you retreat to the 'objective attitude'—viewing him as a patient case study of trauma—you might be metaphysically consistent, but you cease to be his brother. The warrant for the resentment doesn't come from free will; it comes from the demand you place on him to regard you as mattering."

  **Owen:** "But if he *couldn't* regard me otherwise, if his disregard was written in the stars the day he was born, then my demand is a joke. I'm shouting at a recording. I want to let it go, Ruth, I do. But I don't want to let it go by pretending his actions meant something they couldn't have meant. Is there no integrity in admitting we're just machines grinding against each other?"

  **Ruth:** "There's integrity in it, yes. But there's also a kind of cowardice. It's safe to view him as a machine. Machines don't reject you; they just malfunction. If he's determined, you're safe from the possibility that he simply chose not to need you. Are you sure you want that safety?"

  **Owen:** "I don't want safety. I want to know if my grief is honest. If I keep this resentment, I'm keeping alive the idea that he could have stayed. If I let it go, I'm admitting he never really had a choice. One of those is a lie. I just don't know which one kills me slower."

  **Ruth:** "You're asking if the feeling is warranted, but I think you're afraid that if it isn't warranted by 'free will,' it isn't warranted at all. But what if the warrant is simply that you are here, and he is not, and the space between you hurts? That pain doesn't require metaphysics to be real. It only requires that you value the connection."

  **Owen:** "But valuing the connection is exactly what was determined! My love, his neglect, this conversation tomorrow—it's all just the unfolding of a state vector from the Big Bang. If I accept that, then my resentment is just noise. And I'm tired of listening to noise and calling it music."

  **Ruth:** "Then stop calling it music. Call it grief. But don't pretend that viewing him as determined makes you any less determined to be angry. You're still in the chain, Owen. The only choice you have is whether you stand in the chain as a brother or as a judge. And judges don't get to hug the accused."

  **Owen:** "That's the trouble. I don't know if I *can* hug him. Not because of philosophy, but because thirty years is a long time to practice being a judge. If I drop the gavel, do I even know who I am anymore? Maybe the resentment is the only thing holding me together."

  **Ruth:** "Then hold it. But don't dress it up as philosophical clarity. Call it what it is: a shield. There's no shame in needing a shield before a funeral. But don't mistake the shield for the truth about him."

  **Owen:** "So you're saying I can keep the resentment, but I have to admit it might be useless? That it doesn't actually track anything real about Malcolm?"

  **Ruth:** "I'm saying it tracks something real about *you*. And tomorrow, when you see him, you'll have to decide if what's real about you is more important than what might be possible between the two of you. Philosophy won't answer that."

  **Owen:** "I wish it would. It would be easier if the answer was in the books. Then I wouldn't have to look at his face and guess."

  **Ruth:** "If the answer was in the books, you wouldn't need to look at his face at all. And I think, somewhere under all this reading, you're terrified that you do."
