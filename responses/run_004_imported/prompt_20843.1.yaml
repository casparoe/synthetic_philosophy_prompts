      *   **Parfit's Contribution:** Parfit admits the psychological point but argues the normative point fails. He introduces the "Wide Scope" principle: We ought to want that fewer people suffer.
      *   **Does it collapse?** If you accept *total utilitarianism* (the EA/LW default), Taurek collapses into bias/error. If you accept *deontology* or *contractualism* (Scanlon), Taurek's core survives as a feature, not a bug.
      *   **Modern EA Engagement:** Note that EAs *do* engage with this (e.g., Michael Huemer, or discussions on "diminishing marginal value" vs. "lexical thresholds"). But standard EA rejects Taurek.

