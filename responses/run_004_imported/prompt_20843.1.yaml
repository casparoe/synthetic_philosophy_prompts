      *   *Standard View (Utilitarian/Aggregationist):* Save the five. 5 lives > 1 life.
      *   *Taurek's View:* The numbers don't count in the way aggregationists think. There is no "super-losing" of 5 lives. There are only 5 individuals each losing *their* life. David loses *his* life. From David's perspective, his loss is 100%. From each of the five's perspectives, their loss is 100%.
      *   *Key Claim:* "Losses" aren't additive across persons. There is no common currency of "utility" or "life units" that sums up.
      *   *Proposal:* Flip a coin. Give each individual an equal chance of being saved. (5/6 chance for the group of 5, 1/6 for David, but individually everyone has a 50/50 chance if you view it as "Save Group A vs. Save Person B" with a coin flip, though Taurek actually argues for giving each *individual* an equal chance, which implies a lottery where the five don't automatically win). *Correction:* Taurek argues for giving each *individual* an equal chance. So, flip a coin to decide between David and the Group? No, he argues we should toss a coin to decide *who* gets the drug, meaning each of the 6 individuals has a 1/6 chance. Or, more commonly interpreted, flip a coin to decide between saving the one or the five, giving the one a 50% chance. *Refinement:* Taurek suggests we have no obligation to save the greater number. We *may* save the greater number, but we aren't *obligated*. He often leans toward a coin toss between the *parties* (50/50 between David and the Group), which gives the individuals in the group less individual probability than David. But the core philosophical point is the rejection of aggregation.

