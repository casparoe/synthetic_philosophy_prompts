      *   *The Correction:* "Shut up and multiply." Value = (Value per unit) × (Number of units). If one life is worth $X, 5 lives are worth $5X.
      *   *The Conflict:* Taurek says you can't multiply across persons. Yudkowsky says you must.

  4.  **Evaluate the Intersection (Taurek vs. Scope Insensitivity):**
      *   *Is Taurek just scope insensitive?* Superficially, yes. He denies that 5 deaths are "worse" than 1 death in a way that mandates action.
      *   *Is there more?* Yes. Taurek's argument is metaphysical/normative, not psychological.
          *   *Metaphysical:* There is no "social utility monster." Suffering/Loss is essentially private.
          *   *Normative:* Respect for persons requires treating them as equals, not as vessels for utility. Aggregation treats the five as a blob that outweighs the one, potentially violating the separateness of persons (a Rawlsian/Nozickian point too).
      *   *Parfit's Rebuttal:* Parfit argues that even if losses aren't "shared," we still have reasons to prevent more losses. He distinguishes between "Wide Scope" and "Narrow Scope" principles. He tries to show that Taurek's view leads to absurdities (e.g., in large numbers).

