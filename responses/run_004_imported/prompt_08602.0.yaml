  2.  **Deconstruct the Philosophical Issues:**
      *   **Logical Omniscience:** The assumption that if you believe $P$ and $P \implies Q$, you *must* believe $Q$. This is a known fallacy/idealization in epistemology. Humans aren't logically omniscient.
