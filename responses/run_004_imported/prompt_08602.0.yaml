answer: |-
  You have hit on one of the classic problems in epistemology (the study of knowledge and belief). Your intuition is correct: **There is something off about holding people to literally every logical consequence of their stated views.**

  You are not a hypocrite, and you do not "secretly believe" the gross conclusion. Here is the breakdown of why your friends' tactic is philosophically flawed, what is actually happening in your brain, and how to handle it.

  ### 1. The Fallacy of Logical Omniscience
  In formal logic, there is a principle often assumed in idealized systems called **Logical Omniscience**. It states that if an agent believes $P$, and $P$ logically implies $Q$, then the agent *must* believe $Q$.

  **Humans are not logically omniscient.**
  We are "bounded rationalists." Our brains have limited processing power, limited information, and limited time. We hold beliefs in clusters, not as a unified, perfectly consistent database. Discovering an implication requires cognitive work.

  If you believe "All fruits have seeds" and "Tomatoes are fruits," you logically commit yourself to "Tomatoes have seeds." But if you never learned botany, you might genuinely think tomatoes are seedless vegetables. When someone points out the logic, you don't say, "I secretly knew tomatoes had seeds all along." You say, "I didn't know that implication followed. Now I do."

  Accusing you of hypocrisy for not instantly knowing every derivative truth of your belief system is like accusing you of hypocrisy for not knowing the answer to a math problem you haven't solved yet.

  ### 2. *Reductio ad Absurdum* Works Both Ways
  Your friends are using a form of argument called *Modus Ponens*:
  1.  If $P$ and $R$ are true, then $Q$ must be true.
  2.  You believe $P$ and $R$.
  3.  Therefore, you must believe $Q$.

  However, in philosophy, when a logical deduction leads to a conclusion that is obviously false or morally repugnant ("gross"), we often use **_Reductio ad Absurdum_** (reduction to absurdity). This flips the script:
  1.  If $P$ and $R$ are true, then $Q$ must be true.
  2.  $Q$ is clearly false/unacceptable.
  3.  Therefore, **either $P$ or $R$ (or both) must be false.**

  When your friends say, "You must accept this gross conclusion," they are assuming your premises ($P$ and $R$) are immutable. But the discovery of a "gross" implication is actually valuable data! It tells you that your current web of beliefs is inconsistent.

  The rational response isn't to "bite the bullet" and accept the gross thing. The rational response is to say: **"Since I reject that conclusion, I need to refine which of my premises led me there."**

  ### 3. Implicit vs. Explicit Belief
  To answer your specific question: *Does that mean I secretly believed it the whole time?*

  There is a distinction between **dispositional belief** and **occurrent belief**.
  *   **Occurrent:** What you are actively thinking right now.
  *   **Dispositional:** What you *would* assent to if asked.

  In a weak sense, yes, the belief was "dispositionally" there because it was mathematically contained in your other beliefs. But in the moral and social sense that matters for accusations of hypocrisy? **No.**

  Hypocrisy requires a disconnect between what you *know* to be right and how you act. If you were unaware of the implication, you lacked the knowledge required to be a hypocrite. You were simply **mistaken** about the scope of your own views. Correcting a mistake is not hypocrisy; it's learning.

  ### 4. What is this tactic called?
  You mentioned the **Motte-and-Bailey**, but you're right that it's not quite that. A Motte-and-Bailey is when someone retreats to a defensible position when attacked but acts like they hold the controversial one.

  This tactic is closer to **"The Fallacy of Closure"** or simply **"Logical Bullying."**
  It relies on the social pressure of consistency to force you into a corner. It treats belief as a static contract rather than a dynamic process of **Reflective Equilibrium** (a term coined by John Rawls).

  Reflective Equilibrium is the process of going back and forth between your specific intuitions (e.g., "This conclusion is gross") and your general principles (e.g., "I believe X and Y"), adjusting both until they fit together without contradiction. Your friends are demanding you freeze the process at the moment of contradiction and accept the worst outcome.

  ### 5. How to respond
  Next time this happens, don't get defensive. Own the logic but reject the pressure. Try a response like this:

  > "You're right, logically that does follow from what I just said. But since I find that conclusion unacceptable, it means my formulation of my premises was too broad. I need to tweak my view so it doesn't lead there. Thanks for catching the inconsistency, but I'm not biting the bullet; I'm fixing the premise."

  This does three things:
  1.  **Validates their logic:** You don't look anti-logic.
  2.  **Rejects the conclusion:** You don't endorse the "gross" claim.
  3.  **Reframes the narrative:** You aren't a hypocrite hiding a secret belief; you are a thoughtful person refining your philosophy in real-time.

  ### Summary
  Your friends are treating you like a computer program that outputted a bug, insisting that the bug is a "feature" you secretly wanted. You are actually a developer who just found a bug and is now patching the code. That's not hypocrisy; that's intellectual honesty.
