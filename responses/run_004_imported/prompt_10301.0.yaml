          3.  Constraint: Avoid the cop-out answer of "people aren't perfectly rational." The user wants the *actual mechanics*.

  2.  **Part 1: Unpacking the Mechanism (The "Why"):**

      *   *Concept:* Common Knowledge of Rationality + Common Priors.
      *   *The Logic Chain:*
          1.  I want to buy a share of "Candidate X wins."
          2.  You are willing to sell it to me at the current price.
          3.  Why are you selling? You must think the price is too high (i.e., X is less likely to win than the market says).
          4.  Why do you think that? You must have private information suggesting X will lose.
          5.  If I know you are rational, I must respect your private information.
          6.  I update my belief: X is less likely to win.
          7.  The price I was willing to pay drops.
          8.  Iterate: You realize I'm no longer buying, which tells *you* something about *my* info, and so on.
          9.  Result: Convergence to a price where neither wants to trade.
      *   *Key Insight:* Trade is a zero-sum game (in terms of information advantage). If we have the same priors, any expected profit for me is an expected loss for you. If you know I'm rational, you know I won't take a bet I expect to lose. So if I'm taking the bet, you must be the "sucker." If you know you're not a sucker, you shouldn't trade.
      *   *Analogy:* The "Winner's Curse" in auctions. If you win the auction, it's likely because everyone else bid lower. Why did they bid lower? They valued it less. Should you still be happy you won?

  3.  **Part 2: Squaring with Reality (The "Resolution"):**

      *   *Constraint Check:* The user explicitly said *don't* just say "people are irrational." While true, it's not the *theoretical* resolution economists use.
      *   *Resolution 1: Heterogeneous Priors.* The theorem assumes *common priors*. If I start believing X has a 60% chance and you start with 40%, we can trade even with common knowledge of rationality. This is the "Agree to Disagree" loophole. (Note: Many economists find this unsatisfying as a foundational assumption, but it's the most direct mathematical fix).
      *   *Resolution 2: Liquidity/Noise Traders.* This is the big one in market microstructure. The theorem assumes *only* informed traders. Real markets have people who *need* to trade for reasons other than information (hedging, portfolio rebalancing, cash needs, gambling utility). These are "noise traders" or "liquidity providers." Informed traders can hide behind them.
          *   *Mechanism:* Market makers exist to profit from the spread, not necessarily directional bets. They absorb order flow.
      *   *Resolution 3: Risk Preferences.* The theorem often assumes risk neutrality. If I am risk-averse and you are risk-seeking (or have different exposure to the underlying risk), we trade to share risk, not just information.
      *   *Resolution 4: Costly Information Acquisition.* If information is costly to get, prices can't be fully revealing immediately, or no one would bother getting the info (Grossman-Stiglitz Paradox). This is a cousin of the No-Trade theorem.
      *   *Prediction Market Specifics:* People trade for "fun" (subsidized liquidity), expressiveness, or hedging real-world exposure (e.g., a campaign worker betting on their candidate to hedge job loss).

