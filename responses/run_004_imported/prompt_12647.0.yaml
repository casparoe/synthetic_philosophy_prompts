          *   *Evaluation:* This is the classic Carter/Leslie formulation. It's logically valid *if* you accept SSA and the reference class. It *is* Bayesian evidence, but "weak" might be an understatement depending on priors. It ignores specific empirical data (which is fine for the abstract argument).
          *   *Verdict:* Basically right about the logic of SSA, but relies on controversial premises.

      *   **Move 2 (Marcus - SIA/Correction):**
