      *(Self-Correction during drafting)*: Make sure to clarify that SSA and SIA are competing *principles*, not just arguments. Renata defends SSA; Marcus defends SIA. They are talking slightly past each other because they are advocating for different foundational axioms of anthropic reasoning.

      *(Refining Move 5)*: Renata says "Some reference class is always needed." This is true. But she says "Observers in roughly your epistemic position" is a defensible default. This is contentious. In DA, if you define the class too narrowly (e.g., "people born in 1990"), the argument vanishes. If too broadly (all sentient beings), it changes. The "epistemic position" defense is the standard way out, but it's not universally accepted as "defensible" without caveats. I should note that.

  6.  **Final Polish:** Check against the prompt requirements.
