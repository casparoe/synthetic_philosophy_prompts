answer: |-
  Welcome to the club. It is a genuine delight to correspond with someone who actually knows the Lettvin, Maturana, McCulloch, and Pitts (1959) paper from the lab bench rather than just the footnote. That "bug detector" (or more accurately, the "convexity detector") is the *Drosophila* of philosophy of mind; if you want to test a theory of content, you throw a frog at it.

  You have identified the exact fault lines where the rubber meets the road. Since you're used to data fitting and physiological mechanisms, I'll skip the hand-waving and give you the structural differences.

  ### 1. Millikan vs. Dretske: The Consumer vs. The Producer

  You are right that they look similar on the surface: both use history to fix content and both want to say the frog represents *Fly* and not *Dark Speck*. But the machinery is different.

  **Ruth Millikan (Consumer Semantics):**
  Millikan's account is strictly **etiological** and **consumer-oriented**.
  *   **The Mechanism:** For Millikan, the content of a representation is determined by the *consumer* of that representation (the downstream mechanism, e.g., the snapping motor program), not the producer (the retina).
  *   **The Logic:** The snapping mechanism has a "Proper Function." That function is defined by what it did in the **selection history of the species** that allowed the genes to replicate. The snapping mechanism was selected *because* it caught flies. Therefore, the input state that triggers it has the content "Fly."
  *   **The History:** It must be phylogenetic. The history of the *individual* frog matters less than the history of the lineage.

  **Fred Dretske (Producer/Indicator Semantics):**
  Dretske's account (specifically in *Explaining Behavior*, 1988) is **recruitment-based** and **producer-oriented**.
  *   **The Mechanism:** Dretske focuses on the *producer* of the signal (the retinal ganglion cell). A state has content if it carries information about a condition, and the system was *recruited* to use that state *because* it carried that information.
  *   **The Logic:** Content is fixed during a learning period (ontogenetic) or evolutionary period where the connection is forged. The neuron means "Fly" because it was recruited to indicate flies. If it later fires for a BB, it is misrepresenting, because the BB connection was not the basis of the recruitment.
  *   **The History:** Dretske is more open to **ontogenetic history** (learning) fixing content, whereas Millikan requires the learning mechanism itself to be grounded in phylogenetic history.

  **The Parting Ways:**
  If you took a frog and surgically rewired its retina so that its "bug detectors" responded to *red squares* instead of dark blobs, and then trained it to snap at red squares:
  *   **Dretske** might say the content has shifted to "Red Square" (via individual recruitment/learning).
  *   **Millikan** would likely say the content is still "Fly" (or "Food"), and the frog is now systematically deluded, because the *consumer's* proper function is still defined by the ancestral environment where red squares didn't exist.

  ### 2. The Swampman Test

  Davidson's Swampman is a molecule-for-molecule duplicate of a human (or frog) that pops into existence via a quantum fluctuation, with no causal history.

  **Does it sink them?**
  Yes, but they react differently.

  **Millikan:**
  She bites the bullet. Hard. For Millikan, without a selection history, there is no Proper Function. Without Proper Function, there is no normativity (no distinction between functioning correctly and malfunctioning). Without normativity, there is no representation.
  *   **Verdict:** Swampman has no thoughts, no beliefs, and no representations. It behaves *as if* it sees a fly, but it doesn't.
  *   **Wriggle Room:** None. She accepts this. She argues our intuition that Swampman thinks is just a mistake.

  **Dretske:**
  This is where your intuition about "recruitment" matters.
  *   **Teleological Dretske (*Explaining Behavior*):** He aligns with Millikan. If there was no recruitment period (no learning, no evolution), there is no content. Swampman is a zombie.
  *   **Informational Dretske (*Knowledge and the Flow of Information*, 1981):** Here is the potential wriggle room. In his earlier work, Dretske defined meaning via **nomic covariance** (information). If structure A correlates with condition B according to the laws of nature, A carries the information that B.
  *   **Verdict:** A strict Informational Semanticist could argue Swampman *does* have content immediately, because its physical structure supports the informational relationship *now*, regardless of history. However, once Dretske moved to "Teleosemantics" (to solve the disjunction problem you mentioned below), he largely abandoned the ahistorical view for mental content.

  **Summary:** If we are talking strict Teleosemantics, **both sink Swampman**. Millikan is just more famous for admitting it cheerfully.

  ### 3. The Disjunction Problem (Fly vs. Fly-or-BB)

  This is your strongest point, and as a scientist, your intuition is spot on. If you run a regression on the frog's firing data, the best fit is indeed `Fire = f(Dark, Small, Moving, OR BB)`.

  **The Problem:**
  Pure causal theories say: State S means X if S is caused by X. But if S is caused by Flies *and* BBs, then S means (Fly v BB). If the frog snaps at a BB, it's not an error; it's doing exactly what (Fly v BB) predicts. But we want to say the frog made a *mistake*.

  **The Teleosemantic Solution:**
  Both Millikan and Dretske solve this by introducing **Normativity via History**.
  *   **Millikan:** The content is fixed by what the mechanism was selected for in the **Environment of Evolutionary Adaptedness (EEA)**. In the EEA, there were no BBs. There were only flies. Therefore, the mechanism was designed for flies. When it fires for a BB, it is *malfunctioning* relative to its design specs. The content is "Fly," and the BB snap is an error.
  *   **Dretske:** The content is fixed by what the state indicated during the **Recruitment Period**. If the neuron was recruited when only flies were present, it means "Fly." Later BBs are "noise" or abnormal conditions.

  **Is it a "Good" Answer?**
  Here is the honest philosophical consensus: **It depends on whether you buy the normative leap.**

  As a physiologist, you know the cell doesn't "know" about the EEA. It just has ion channels and thresholds. Teleosemantics asks you to accept that *meaning* is not a property of the current physical state, but a property of the *lineage* of that state.
  *   **Pros:** It successfully distinguishes between "correlation" and "representation." It allows for error (misrepresentation).
  *   **Cons:** It makes content extrinsic and historical. Two physically identical frogs (one natural, one Swampman) have different mental states. Many scientists find this unsatisfying because it makes content unobservable in principle.

  **Your Disjunctive Hypothesis:**
  You asked why the content isn't "small-dark-moving-thing-or-BB."
  *   **Teleosemantic Reply:** Because "BB" was not a condition that contributed to the reproductive success of the frog's ancestors. Selection cannot select for BB-detection. Therefore, "BB" cannot be part of the Proper Function.
  *   **Scientific Critique:** You might counter that selection selects for *survival*, and if snapping at BBs doesn't kill the frog, the mechanism isn't being pruned. The "Disjunction Problem" remains the hardest nut for teleosemantics to crack. Some critics (like Fodor) argued that if the frog can't tell the difference, the history doesn't change the fact that the *current* causal power is disjunctive.

  ### The Bottom Line

  You have stumbled into a field that essentially tries to derive "ought" (what the frog *should* snap at) from "is" (what the frog's ancestors *did* snap at).

  *   **Millikan** says: "The frog represents Fly because its ancestors ate Flies."
  *   **Dretske** says: "The frog represents Fly because its system was built/recruited to track Flies."
  *   **You (The Physiologist)** say: "The frog represents 'Trigger Threshold Met'."

  Teleosemantics is an attempt to bridge your view and the philosopher's view. It works beautifully if you accept that history constitutes function. It falls apart if you think function must be reducible to current physical dispositions.

  Since you are reading everything you can get your hands on, I recommend looking at **Karen Neander**. She defends the Millikan line vigorously and addresses the "Swampman" and "Disjunction" issues with a lot of biological rigor that might appeal to your background. She argues that without the history, you literally cannot make sense of biological dysfunction—and without dysfunction, you can't have misrepresentation.

  Enjoy the hash-out. It's rare to find someone who can cite Lettvin *and* Millikan in the same breath.
