  2.  **Deconstruct Kripke's Objections (The "Skeptic's" Challenge):**
      *   *Context:* Kripke presents a skeptic who argues there is no fact about what I meant by "+" in the past that determines my future use.
      *   *The Dispositionalist Solution:* I meant plus because I am disposed to answer "125" to "68+57".
      *   *Objection 1: Finitude.* I haven't computed all numbers. (User knows this).
      *   *Objection 2: Idealization.* Okay, let's say I *would* have answered correctly if I had infinite capacity.
      *   *Kripke's Real Knockout Punches against Idealization:*
          1.  **The Normativity Objection:** Dispositions describe what I *do* (or would do), not what I *ought* to do. If I'm disposed to make a mistake, dispositionalism says that mistake *is* the meaning. Idealization tries to fix this by saying "no errors," but how do you define "error" without already presupposing the meaning? (Circularity).
          2.  **The Simplicity/Complexity Objection:** Why is "plus" the simple function and "quus" the complex one? A disposition to compute quus is just as valid a physical description.
          3.  **The "Quus" Disposition:** Maybe I am disposed to compute quus, but my brain malfunctions before 57. Idealization says "fix the malfunction." But what counts as a malfunction? If I say "125," is that a malfunction of my "quus" disposition or the correct functioning of my "plus" disposition? You need an independent standard of correctness to decide which disposition is the "ideal" one.
