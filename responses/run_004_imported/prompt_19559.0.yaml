      *   *Counter to Circularity:* We can define "error" functionally (e.g., coherence with other beliefs, successful prediction) without presupposing "plus."
      *   *Counter to Quus:* "Plus" is computationally simpler (Occam's Razor). The disposition to follow the simpler algorithm is the baseline.
      *   *Modern Cognitivism:* Connectionism, computational theory of mind. We *do* have algorithms. The algorithm *is* the meaning.

  4.  **Structure the Response:**
