answer: |-
  **The Space Between Notes**

  The dressing room smelled of lemon oil and old wood. Elias sat on the velvet bench, his violin resting on his knee like a sleeping bird.

  Last night, standing in this same room after a rehearsal that had felt hollow and frantic, he had made a vow. He had sworn to God, to the mirror, to the silence: *No more Paganini.* Not tonight. Not ever again. He would play the Bach Chaconne. It was slow. It was honest. It required breath, not just velocity.

  He had fallen asleep feeling solid. He had felt like a man who had built a wall around himself.

  Now, under the harsh vanity lights, Elias looked at his hands. They were the same hands. But the man who made the vow was the Elias of yesterday, and that man was dead. He was a memory. This Elias, the one breathing the stale air of the dressing room, had not made any vow. The promise was just a ghost. It had no muscles. It could not hold his bow arm down.

  The stage manager knocked softly. "Five minutes, Elias."

  Elias stood up. A sudden vertigo hit him, a nausea that had nothing to do with his stomach. He realized, with terrifying clarity, that he was not *bound* to the Bach. Nothing in the universe compelled him. The vow was weightless. He could walk out there and shred the Paganini Caprice. He could burn the house down. He was radically, horrifyingly free.

  This was the anguish. It wasn't that he *wanted* to play the Paganini; it was that he *could*. The past Elias offered no protection to the present Elias. He was hanging over an abyss, and the only thing keeping him from falling was a choice he had to make anew, from nothing, in this exact second.

  His heart hammered against his ribs. The freedom was too heavy to carry. It felt like standing on a cliff edge where the ground might turn to mist.

  He needed the ground to be solid again. He needed to be a thing, not a choice.

  Elias closed his eyes and took a deep breath. He felt his posture shift. His shoulders rolled back. His chin lifted. He stopped being Elias-the-choosing-consciousness and slipped into a costume.

  *What am I?* he asked himself.

  *You are a Virtuoso,* the answer came. It felt smooth, like polished stone.

  *Virtuosos play Paganini. That is what they are. It is their nature. If I play the Bach, I am denying my essence. I am not a man choosing a song; I am a machine designed for speed. The audience expects it. The promoter expects it. My fingers expect it.*

  He picked up the violin. It no longer felt like a choice; it felt like a function. He was no longer a free agent trembling in the light; he was an Object. A Violinist. The label wrapped around him like a straitjacket, but it was warm. It took the weight of the decision away. If he was simply *a Virtuoso*, then he had no choice. And if he had no choice, he couldn't be responsible for the hollowness he felt last night.

  The stage manager opened the door. "You're on."

  Elias walked into the wings. The anguish was gone, replaced by a cold, comfortable certainty. He wasn't deciding to play the fast piece. He was just fulfilling his definition.

  He stepped into the spotlight. The applause hit him like a wave. He lifted the bow, safe in his lie, and prepared to play exactly who everyone told him he was.
