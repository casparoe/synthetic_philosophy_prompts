answer: |-
  Here are eight questions designed for a graduate colloquium Q&A with a contemporary Strawsonian. They are structured to move from foundational metaphysical concerns to specific applications, ending with the requested closing question. Each includes the question, the anticipated reply (to help you gauge the room), and a targeted follow-up.

  ### 1. The Justification vs. Explanation Objection
  **Question:** A persistent criticism of *Freedom and Resentment* is that Strawson's claim—that the participant stance is too deeply woven into human life to be abandoned—functions more as a psychological explanation of why we *cannot* stop holding people responsible, rather than a normative justification of why we *ought* to. Does your refinement of the view maintain that the inescapability of the practice *constitutes* its justification, or do you concede that Strawson leaves the skeptic's demand for an external validation unanswered?

  *(Anticipated Reply: She will likely argue that the demand for an "external" justification is unintelligible because the standards of justification are internal to the practice of interpersonal relationships.)*

  **Follow-up:** If the standards of justification are entirely internal to the practice, does this render the Strawsonian view immune to criticism, or does it simply mean that any critique must come from within the participant stance itself? If the latter, isn't the skeptic effectively barred from the conversation by fiat?

  ### 2. Manipulation and Historical Conditions
  **Question:** In response to Pereboom-style manipulation cases, where an agent satisfies all current-time-slice conditions for responsibility but was covertly engineered to act as they did, many Strawsonians feel compelled to add a historical condition to exempt the agent. However, if our reactive attitudes are naturally triggered by the agent's current quality of will, doesn't introducing a non-reactive, historical condition to block responsibility abandon the naturalistic spirit of Strawson's original proposal?

  *(Anticipated Reply: She will likely argue that learning about the manipulation history naturally alters our reactive attitudes; thus, the historical condition is still grounded in the dynamics of the participant stance.)*

  **Follow-up:** But isn't there a gap between the *initial* natural reaction (resentment) and the *theoretical* withdrawal of that reaction once history is known? If we have to reason our way out of the attitude using historical facts, aren't we relying on a theoretical commitment to determinism or causation that Strawson explicitly wanted to bypass?

  ### 3. The Expansion of the Objective Attitude
  **Question:** Strawson grants that the objective attitude is locally appropriate toward children or the severely mentally ill, where the demands of interpersonal reciprocity cannot be met. Given this, what principled barrier prevents the objective attitude from spreading case-by-case into a global replacement for the participant stance, particularly if we come to view all behavior as the product of causal chains similar to those affecting the mentally ill?

  *(Anticipated Reply: She will likely argue that the objective attitude is parasitic on the participant stance; we can only view some people objectively because we view others as participants, and a global shift is psychologically impossible for beings like us.)*

  **Follow-up:** If the barrier is merely psychological impossibility, does that mean a being with greater cognitive capacity—one that could sustain a global objective stance without psychological collapse—would be *correct* to do so? Or is there a normative reason why even such a being ought to maintain the participant stance?

  ### 4. Structural Injustice and Dyadic Attitudes
  **Question:** Strawson's account is fundamentally dyadic, focusing on the interpersonal dynamics between specific agents. How does a refined Strawsonian account handle cases of structural injustice, where harmful outcomes arise from diffuse systems rather than the ill will of a specific individual? Can reactive attitudes like resentment find a proper target in a system, or does the view force us to mislocate blame onto individual actors within the structure?

  *(Anticipated Reply: She will likely argue that we hold individuals responsible for their participation in or failure to resist structures, based on the quality of will shown toward those harmed by the structure.)*

  **Follow-up:** Does focusing on the individual's quality of will risk obscuring the systemic nature of the harm? If the system produces harm regardless of individual will, is the Strawsonian focus on interpersonal attitudes sufficient to capture the moral reality of structural oppression?

  ### 5. Self-Resentment and Guilt
  **Question:** While Strawson focuses on interpersonal reactive attitudes, moral experience also includes intrapersonal attitudes like guilt and self-resentment. If the participant stance is constitutive of *interpersonal* relationships, how do you account for the authority of guilt when one wrongs oneself or when there is no external victim to harbor resentment? Is self-blame merely a projection of imagined social attitudes?

  *(Anticipated Reply: She will likely argue that we internalize the interpersonal stance; guilt is the recognition that we have damaged our standing in the moral community, even if no specific individual is currently resentful.)*

  **Follow-up:** If guilt is dependent on the imagined attitudes of the community, does this imply that a moral pioneer who acts against corrupt community standards should not feel guilt, even if they believe they have violated an objective moral demand?

  ### 6. Neuroscience and the "Quality of Will"
  **Question:** Contemporary neuroscience increasingly identifies biological correlates for behaviors we traditionally associate with character, such as impulsivity or aggression. At what point does a biological explanation shift from being a description of an agent's "quality of will" to an exempting condition akin to psychosis? Does the Strawsonian framework have the resources to draw this line without deferring to the very metaphysical free will debates it seeks to sidestep?

  *(Anticipated Reply: She will likely argue that the line is drawn by whether the condition precludes the possibility of meaningful interpersonal engagement, not by the mere presence of a biological cause.)*

  **Follow-up:** But if meaningful engagement is a matter of degree, doesn't this suggest that responsibility is also a matter of degree? If so, how do we reconcile this with our binary practices of praise and blame, which often treat responsibility as all-or-nothing?

  ### 7. Resultant Moral Luck
  **Question:** Consider two negligent drivers who exhibit the exact same lack of care, but one hits a pedestrian and the other does not. Our reactive attitudes toward them differ significantly. A Strawsonian might say this is appropriate because the harm alters the interpersonal relationship. But does this concede too much to moral luck? If responsibility is grounded in quality of will, why should the *outcome*, which is often outside the agent's control, dictate the intensity of the reactive attitude?

  *(Anticipated Reply: She will likely argue that reactive attitudes are responses to the total situation, including harm done, because the harm changes the demands of the relationship, not just the assessment of the will.)*

  **Follow-up:** If the demands of the relationship change based on outcomes, does this mean that moral responsibility is not about the agent's autonomy, but rather about the management of social relationships? If so, is "responsibility" still the right word for what we are tracking?

  ### 8. Closing: The Possibility of Global Unjustifiability
  **Question:** To close, I'd like to ask about the limits of the framework itself. You have defended the participant stance against various skeptical challenges. But what *kind* of consideration—as opposed to a particular exempting fact about a single agent—could in principle show that the whole participant framework, rather than just one of its applications, is unjustified? Is there any conceivable discovery, metaphysical or empirical, that would require us to abandon the practice entirely?

  *(Anticipated Reply: She will likely argue that nothing short of ceasing to be human—losing the capacity for interpersonal relationships—could justify abandoning the framework, making it a transcendental condition of our moral life.)*

  **Follow-up:** If the framework is a transcendental condition of our moral life, does that mean the question of its "justice" is category mistake? Or does it imply that we are tragically committed to a practice that might, in a broader cosmic sense, be fundamentally unfair?
