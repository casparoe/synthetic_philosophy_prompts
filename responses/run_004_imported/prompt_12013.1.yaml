answer: |-
  This is a really classic ethical dilemma that pits **formal responsibility** against **social expectation**. Both you and your friend are picking up on real truths, but you're looking at them through different lenses.

  Here is the breakdown of why your friend is logically right, why your gut feeling is socially right, and why the anger is actually misdirected at everyone involved.

  ### 1. Why your friend is right (The Logic of Duty)
  Your friend is looking at this through the lens of **official obligation**. By this metric, singling out Jess is objectively unfair.

  *   **No Official Role:** Jess is a student. She has no contract with the school. She is not a teacher or an administrator. Her "job" is to worry about her own permission slip, not the grade's.
  *   **The Real Authority:** The teachers and the front office *are* paid to ensure the trip happens. They have the contact info, the authority to chase down parents, and the ability to extend deadlines. If anyone "failed" at their job, it was the administration for letting 8 kids slip through without an official follow-up.
  *   **Personal Agency:** The 8 kids who missed the deadline are actually more responsible than Jess. They are the ones who didn't turn in the form. Jess just sends a text; she doesn't sign the slips for them.
  *   **The "Collective Punishment" Flaw:** The rule that "8 kids ruin it for 150" is the actual villain here. That policy creates a pressure cooker where students feel entitled to blame each other for systemic failures.

  If you judge this like a court case, your friend wins. Jess is not guilty.

  ### 2. Why you feel differently (The Logic of Social Contracts)
  You feel like there is a difference between Jess and a random student, and you are right. There is a difference between **omission** (never doing something) and **cessation** (stopping something people rely on).

  *   **Established Precedent:** By doing this for two years, Jess created a **social norm**. In sociology, this is an "informal institution." Even if it wasn't written down, the grade operated under the assumption that *Jess sends the text.*
  *   **Reliance:** Because she did it before, people got lazy. Some kids likely thought, "I don't need to worry yet, Jess will remind us." When she stopped without notice, she pulled away a safety net that people had subconsciously leaned on.
  *   **The "Good Samaritan" Trap:** When someone voluntarily does a good deed repeatedly, it often morphs into an expectation. When they stop, it feels like a loss, whereas if they never started, it would just be neutral.

  So, the "difference" you are sensing is **reliance.** Jess isn't responsible for the trip, but she *is* responsible for breaking a pattern she established without communicating that she was stopping.

  ### 3. The Psychology of the Blame (Why everyone is mad at Jess)
  If the teachers failed, and the 8 kids failed, why is everyone subtweeting Jess?

  *   **Visibility:** Jess's contribution was public (the group chat). The teachers' lack of follow-up was private (office emails/calls). It is easier to be mad at what you can see.
  *   **Peer vs. Authority:** It is scary and difficult for 10th graders to get mad at their teachers or the administration. It is very easy to get mad at a peer. Jess is a "safe target."
  *   **Cognitive Dissonance:** The 142 kids who *did* turn their slips in feel powerless. They lost something they wanted. To cope with that loss, they need a cause. "Jess didn't text" is a simpler cause than "Our school has a punitive administrative policy and 8 of our classmates were irresponsible."

  ### The Verdict
  **Your friend is right about the *fault*, but you are right about the *dynamic*.**

  Singling Jess out as the *sole* reason the trip was cancelled is illogical and unfair. She is not the trip coordinator. However, she does occupy a unique middle ground:
  1.  **The 8 kids** are most responsible (they didn't turn in forms).
  2.  **The School** is second most responsible (bad policy, no official reminders).
  3.  **Jess** bears a tiny sliver of *social* responsibility for establishing a reliance she couldn't maintain this year due to family issues.
  4.  **The Grade** is responsible for relying on a peer instead of the school.

  **The Conclusion:**
  The anger at Jess is **misplaced scapegoating.**
  While it is true that her reminder likely would have saved the trip (statistically, based on past years), she is a child dealing with family stuff, not a staff member. The fact that the grade's organization relied entirely on one volunteer student's text message is a failure of the grade and the teachers, not Jess.

  You can tell your friend: "You're right that it's not her *job*, and the teachers should have stepped in. But the reason it feels different is because she created an expectation and then broke the pattern without telling anyone. Still, blaming her for the whole cancellation is letting the actual decision-makers off the hook."
