  Harry Frankfurt walks into an unemployment office with his client, Black (the counterfactual intervener).

  **Clerk:** "State your occupation."
  **Black:** "Counterfactual Intervener."
  **Clerk:** "And why are you claiming benefits? Were you laid off?"
  **Black:** "No. I was on standby to ensure Jones stole the wallet. But he showed no *prior sign* of hesitating, so I remained causally inert."
  **Clerk:** "So... you did nothing?"
  **Black:** "Precisely. But because I was there, he literally *could not have done otherwise*."
  **Clerk:** "So you're claiming you're responsible for his lack of freedom, even though you didn't lift a finger?"
  **Black:** "Exactly. It's the Frankfurt Model. I eliminate alternate possibilities without expending energy."
  **Clerk:** "Look, pal. If you didn't push the button, you didn't work. Go home."
  **Black:** "I can't! If I leave, he regains the ability to do otherwise, and the whole argument collapses!"
  **Clerk:** "Fine. Then you can wait in the lobby. But don't expect a check."
  **Black:** "Why not?"
  **Clerk:** "Because around here, we don't pay for 'Flickers'."

  *(Black sighs, sits in the waiting room, and ensures the Clerk could not have filed his paperwork differently, while taking no credit for the filing.)*
