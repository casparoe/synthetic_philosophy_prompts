      *   Key constraint: Truth shouldn't add *content*. If I accept PA, adding "is true" shouldn't let me prove new facts about *numbers*. It should just be a shorthand.
      *   *Conservativeness Requirement:* A theory $S + T$ is a conservative extension of $S$ if every sentence in the language of $S$ provable in $S + T$ is already provable in $S$. For deflationists, truth must be conservative over the base theory.

  3.  **Part 2: The Conservativeness Argument (The Threat):**
      *   *Setup:* Base theory = Peano Arithmetic (PA). Add Truth predicate $T$. Add T-schema (or uniform T-introduction/elimination). Crucially, extend the Induction Schema to include formulas with $T$.
      *   *Result:* This system (often called $PA(S)$ or $UTB$ + full induction) proves $Con(PA)$.
