  **Move 1 (Elena): +2.** Elena accurately describes the core mechanism of the Bikhchandani, Hirshleifer, and Welch (1992) information cascade model. In the standard binary signal framework, once the public history (two 'no' decisions) outweighs the weight of a single private signal, ignoring the private signal is indeed the Bayes-optimal strategy for an expected-value maximizer. She correctly identifies the tension between individual rationality and social inefficiency (the "tragedy").

