      *   **Conversational Implicature:** Arises when a speaker says something that appears to violate a maxim (or exploits it), but the hearer assumes the Cooperative Principle (CP) holds, and infers a hidden meaning to restore coherence.
      *   **The Cooperative Principle (CP):** "Make your conversational contribution such as is required, at the stage at which it occurs, by the accepted purpose or direction of the talk exchange."
      *   **Maxims:** Quantity, Quality, Relation, Manner.
      *   **Silence/Omission:** Grice does discuss silence, but usually in the context of a turn-taking system where silence *is* a move (e.g., refusing to answer a question in court vs. in casual chat).
      *   **Natural vs. Non-Natural Meaning:** "Those spots mean measles" (natural) vs. "He raised his hand to mean stop" (non-natural).

