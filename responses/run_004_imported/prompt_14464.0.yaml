answer: |-
  You should probably buy Priya a drink, because she's right—but you're also right to be suspicious of the "he just wanted to believe in God" caricature. The connection between *The Methods of Ethics* and the Society for Psychical Research (SPR) isn't just biographical trivia; it's structural. Sidgwick didn't hunt ghosts because he was spooky; he hunted them because his ethical system had a hole in it that only empirical evidence of the afterlife could plug.

  Here is the actual architecture of the argument, stripped of the "Victorian anxiety" fluff, so you can go back to Priya with the technical ammunition she's looking for.

  ### 1. The Dualism of Practical Reason (The Hole in the System)
  To understand why he needed ghosts, you have to understand the specific failure at the end of *The Methods of Ethics* (1874).

  Sidgwick's goal was to show that morality is **rational**. He isn't asking "what makes us happy?" he's asking "what does Reason command?" He identifies two supreme rational principles:
  1.  **Rational Egoism:** Reason dictates I ought to maximize my own happiness. (This is self-evident to the individual agent).
  2.  **Rational Utilitarianism (Benevolence):** Reason dictates I ought to maximize the general happiness. (This is self-evident to the impartial spectator).

  In most cases, these overlap. But in extreme cases (martyrdom, sacrificing your career for a stranger, etc.), they diverge. If I sacrifice my life for the greater good, I am being **rationally moral** (Utilitarianism) but **rationally irrational** (Egoism), because I have destroyed the very subject (me) whose happiness I am supposed to maximize.

  Sidgwick calls this the **Dualism of Practical Reason**. It means that Practical Reason is at war with itself. If there is no way to harmonize these two demands, then the universe is fundamentally irrational. Morality becomes a "noble delusion" because it is not *ultimately* rational to be moral if it destroys your own good without compensation.

  ### 2. Why Agnosticism Wasn't an Option
  You asked: *Why not just stay agnostic and live with the tension?*

  For Sidgwick, living with the tension was philosophically catastrophic. He was a systematizer in the mold of Kant, but without Kant's escape hatch. Kant resolved this by saying we must *postulate* God and Immortality as conditions of practical reason (faith). Sidgwick, however, was a rigorous empiricist. He refused to accept a moral truth that relied on a "leap of faith." He wanted **knowledge**.

  If he remained agnostic, he had to admit that **ethics is not fully rational.** That undermines the entire project of *The Methods*. He couldn't just "pick one axiom" (like Egoism) because Utilitarianism was equally self-evident to reason. To deny one was to deny reason itself.

  So, the only way to save the rationality of ethics was to prove empirically that **the two interests (self and general) are ultimately harmonized.**

  ### 3. The Bridge to Psychical Research
  This is where the ghosts come in. It's not about "spooky powers"; it's about **time and governance.**

  To resolve the Dualism, you need two metaphysical facts:
  1.  **Survival of Death:** If consciousness ends at death, then any sacrifice of self-interest is a permanent loss. Egoism wins. If consciousness survives, then a sacrifice in *this* life can be compensated in the *next*. The timeline for maximizing self-interest extends to infinity, allowing it to align with the general good.
  2.  **Moral Governance:** Survival alone isn't enough (a hell or a chaotic afterlife doesn't help). You need evidence that the universe is governed by a benevolent power that ensures virtue is rewarded and vice punished.

  Sidgwick looked at traditional Christianity and saw it crumbling under biblical criticism and Darwinism. He couldn't rely on scripture. He needed **scientific evidence** of survival and moral governance.

  Psychical Research (telepathy, mediums, apparitions) was, in the 1880s, the cutting edge of empirical inquiry into consciousness. If telepathy were proven, it suggests mind can operate independent of the brain. If mediums could convey verifiable information from the dead, that is empirical data for survival.

  Therefore, the SPR wasn't a hobby. It was an **epistemological rescue mission.** He was trying to gather the empirical premises required to make his ethical conclusion valid.

  ### 4. What Would Have Counted as Proof?
  Sidgwick wasn't looking for "vibes." He was looking for data that would satisfy the Royal Society.
  *   **For Survival:** Veridical hallucinations or mediumistic communications containing information the medium could not possibly have known by normal means (the "cross-correspondences" later on).
  *   **For Moral Order:** Evidence that the state of the deceased was correlated with their moral character in life (e.g., communications suggesting moral progress or retribution post-mortem).

  If he could establish these as scientific facts, he could rewrite the conclusion of *The Methods*: "Reason commands Egoism and Reason commands Utilitarianism, and since we have empirical proof of an afterlife governed morally, these two commands do not actually conflict in the long run."

  ### 5. Was He a Sucker? (The Skepticism Point)
  This is the nuance Priya probably wants you to grasp. Sidgwick was not a credulous spiritualist. He was arguably the biggest skeptic in the room.

  He co-founded the SPR specifically to **debunk** fraud. He spent decades testing mediums, exposing tricks, and applying rigorous standards of evidence. He famously said, *"I do not say that there is a God... I say that I do not know."* He approached psychical research with the same dry, utilitarian calculus he applied to ethics.

  He knew it was a long shot. In a letter to his student Arthur Balfour, he admitted that if the evidence for survival failed, he would have to regard the "moral order" as a hope rather than a knowledge. But he couldn't stop looking, because the alternative was admitting that the universe is morally incoherent.

  ### The Summary for Your Debate
  So, when you talk to Priya again, here's the synthesis:

  1.  **It's not religious nostalgia:** It's a logical necessity derived from the **Dualism of Practical Reason**.
  2.  **It's not a hobby:** It's an attempt to find **empirical premises** for a metaphysical conclusion required by his ethics.
  3.  **The specific link:** Without evidence of **post-mortem survival**, Rational Egoism defeats Rational Utilitarianism, making morality ultimately irrational.
  4.  **His stance:** He wasn't a believer; he was a desperate empiricist who needed data to save the coherence of reason itself.

  Sidgwick died in 1900 still troubled. He never found the proof he needed. The "ghosts" didn't save the system. But the hunt for them wasn't a weird footnote; it was the final, tragic chapter of his attempt to make ethics scientific.

  Priya wins on the "it's not a footnote" point, but you win on the "it was kind of a desperate, possibly doomed gamble" point. Ideally, you both win because you're TAing Sidgwick, which means you're both already suffering enough to bond over it.
