      *   **Middle 2 (Metaphysics):** Discuss "Hard and White" (Jian Bai Lun). Separation of attributes (universals).
      *   **Climax (Mohist Counter):** Alex brings in the Later Mohists to show even contemporaries hated this logic. Jordan counters with the purpose of the debate (rectifying names vs. practical utility).
      *   **Resolution:** No clear winner (it's philosophy), but mutual understanding of *why* the disagreement exists (Set Theory vs. Mereology/Mass Nouns).

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I explain Hansen's view clearly? *Adjustment:* Make sure Jordan explains that "horse" isn't a set of individuals but a scattered substance.
      *   *Check:* Is Alex too straw-manned? *Adjustment:* Give Alex the Later Mohist "Pervasion" argument. It's a strong historical counter-point.
