answer: |-
  1. **The "Patch" Question**
  Critics have noted that the original formulation of the Free Energy Principle focused on minimizing surprise, which logically leads to the "dark room" scenario where an organism seeks zero sensory input. Your solution is to minimize *expected* free energy, which values information gain. Was this shift a mathematical inevitability that was simply overlooked in the early work, or was the concept of expected free energy introduced specifically to accommodate exploratory behaviors that the original principle couldn't explain?

  *   **Follow-up (if she argues it was mathematically inevitable):** If it was entailed by the original math from the start, why did it take nearly a decade of criticism regarding the dark room problem before expected free energy became central to the literature? Does that lag suggest the theory was being retrofitted to fit biological reality rather than predicting it?

  2. **The "Boundary" Question**
  You use the Markov blanket to statistically individuate an organism from its environment, separating internal states from external states via sensory and active channels. Skeptics argue this is merely a formal relabeling of the biological boundary we already assume exists. Does the Markov blanket actually generate new predictions about where an organism begins and ends, or does it simply provide a complex vocabulary for a distinction biologists made long ago?

  *   **Follow-up (if she argues it explains self-organization in nested systems):** If blankets can be nested—cells within organs within organisms—doesn't that create ambiguity about causal responsibility? If a behavior minimizes free energy at the cellular level but violates it at the organismic level, which blanket determines the "action"?

  3. **The "Universal" Question**
  A framework that claims to unify perception, homeostasis, action, and the origin of life risks becoming a "theory of everything" that explains all possible outcomes, which renders it unfalsifiable. How do you ensure the Free Energy Principle remains a scientific hypothesis rather than a metaphysical postulate where any observed behavior is simply reinterpreted as free energy minimization after the fact?

  *   **Follow-up (if she compares it to Natural Selection):** Natural selection is often accused of being tautological, yet it has the fossil record and genetic drift as empirical constraints. What is the equivalent empirical "fossil record" for the Free Energy Principle that exists independently of the model itself?

  4. **The "Law vs. Adaptation" Question**
  Is the Free Energy Principle a law of nature that life *must* obey, similar to thermodynamics, or is it a description of how evolved systems *happen* to operate? If it's a law, non-living systems should obey it; if it's an adaptation, it should be possible for a living thing to exist that doesn't minimize free energy. Which is it?

  5. **The "Scale" Question**
  You apply this framework across scales, from synaptic weights to human decision-making. At what point does the computational cost of maintaining the model exceed the energy savings gained by minimizing free energy? Is there a granularity where the principle breaks down because the system is too simple to hold a "prior"?

  6. **The "Agency" Question**
  Active inference suggests that movement is simply the brain fulfilling its own predictions by changing the world to match them. How does this differ substantively from classical control theory, other than a change in vocabulary? Does Active inference offer a control mechanism that engineers couldn't build using standard error-minimization techniques?

  7. **The "Experience" Question**
  Your book argues that cognition and life are expressions of the same principle. Does this framework dissolve the "hard problem" of consciousness by suggesting subjective experience is just the process of free energy minimization, or does it leave the qualitative feel of experience entirely unaddressed?

  8. **The "Killer" Question**
  To close, I'd like to move from the philosophical to the empirical. Please specify one concrete observation in neuroscience or biology—a specific neural firing pattern, a specific behavioral anomaly, or a specific biological structure—that, if discovered tomorrow, would force you to abandon the Free Energy Principle entirely.
