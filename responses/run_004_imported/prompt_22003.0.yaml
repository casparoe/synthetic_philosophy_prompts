      *   Solution: You must change your own payoff structure or identity. You must become the *kind of parent* for whom breaking a promise is more painful than cancelling a trip. Or, you use a precommitment device (e.g., telling the dad, booking non-refundable tickets).
      *   In parenting, "sincerity" comes from valuing long-term authority over short-term harmony.

