  10. **Final Polish:** Check pacing. Ensure the ending lands the thematic weight without being preachy. (The ending should suggest that even if it *is* just chemistry, treating it as code is a necessary heuristic, or vice versa). Let's go with: The distinction saves them, but the truth remains unknowable.

  *(Self-Correction)*: Wait, if I make the organism actually "understand," that implies consciousness or high-level cognition, which is biologically dubious. I need to be careful. The "reading" must be mechanistic but dependent on the *context* of the translation machinery, which acts as the "interpreter." The "code" exists in the relationship between the tRNA and the Ribosome, not the DNA alone. Elias needs to target the *interpreter* (the ribosome/translational machinery) to change the *meaning* of the DNA.

  *Revised Plan:*
  *   Organism: Recoded *E. coli* (Church style). All UAG stop codons replaced with UAA. UAG is now free to code for a synthetic amino acid (SAA).
  *   Failure: The UAG is being read as "Stop" again by wild-type contaminants or mutation, OR the SAA is being ignored.
  *   Let's go with: The UAG codon was assigned to a toxin. If the SAA is missing, the toxin is made.
  *   Crisis: The SAA is missing, but the toxin *isn't* killing them. They are thriving.
  *   Mara: "Chemical bypass. They found a metabolic workaround." (Sarkar view).
  *   Elias: "No. The ribosome has changed its decoding rule. The symbol 'UAG' no longer signifies 'Toxin' in this context. It signifies 'Continue'." (Maynard Smith/Semantic view).
  *   Solution: Elias introduces a new tRNA that forces the old meaning back. He re-establishes the "language."

  Let's write.

  *(Final check on constraints)*: 1-2 pages. Characters and stakes. No lecture.

