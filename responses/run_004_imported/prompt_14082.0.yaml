  So in my philosophy of science seminar we've been going through Popper on verisimilitude and its honestly messing with my head a bit. I get the basic motivation: he wants to say that even though every scientific theory we've ever had is (probably) strictly false, some false theories are still closer to the truth than others, so science can "progress" toward truth without ever actually landing on a true theory. I also basically get his official definition -- roughly, theory B has more verisimilitude than theory A when B's truth content (the true stuff it logically implies) is at least as big as A's, and B's falsity content (the false stuff it implies) is no bigger than A's, with at least one of those a strict improvement. But then our prof mentioned almost in passing that theres this famous result from Tichý and Miller in the 70s showing that this definition basically can never rank two false theories against each other -- like the whole point of it collapses for exactly the case Popper cared about most -- and moved on before anyone could ask a follow up question. Nobody in section actually seemed to get why thats true, they just nodded along.

  Can you help me actually see this instead of just being told its a known problem? Make up a small toy scenario -- please not the standard weather-forecast/temperature example, I've literally seen that one in three different lecture slides now -- with a handful of simple facts about it, and then construct two rival false theories about that scenario where one obviously seems intuitively closer to the truth than the other. Then walk through the actual truth-content/falsity-content bookkeeping for both theories and show me concretely where Popper's definition either fails to rank them the way intuition says it should, or refuses to rank them at all. I want to understand the actual mechanics of the breakdown, not just accept secondhand that it happens.
