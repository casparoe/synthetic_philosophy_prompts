  6.  **Final Polish:** Ensure the voice sounds like a co-host (knowledgeable, engaged, slightly provocative). (Proceed to generate output).

  *(Self-Correction on "Guess the Answer"):* I need to be careful not to strawman the guest. Her position is sophisticated. Her answers should reflect that sophistication, even if the follow-up challenges them.

  *(Self-Correction on Follow-ups):* The follow-ups need to be "don't let her off easy." They should point out tensions or implications she might want to avoid.

  Let's assemble the questions.

  *   Q1: Testimonial/Hermeneutical boundary.
  *   Q2: Structural vs. Willful (Fricker's "nobody's fault").
  *   Q3: The "True Gap" case (no subcultural concept).
  *   Q4: Remedies (Virtue vs. Structural change).
