answer: |-
  You have encountered not a failure of your design skills, but a fundamental limit of social choice theory. The deeper reason you are looking for is formalized in the **Gibbard-Satterthwaite Theorem**.

  As a political science PhD student, you are likely familiar with Arrow's Impossibility Theorem. While Arrow deals with the impossibility of aggregating preferences into a coherent social *ordering* while satisfying certain fairness criteria, Gibbard (1973) and Satterthwaite (1975) independently proved a result specifically regarding **strategy-proofness** in voting mechanisms.

  ### The Theorem
  The Gibbard-Satterthwaite theorem states that for any deterministic voting system that selects a single winner from three or more candidates, if the system allows voters to express any possible ordering of preferences (unrestricted domain) and is not a dictatorship (i.e., the outcome is not determined by a single voter regardless of others), **there will always be some scenario in which a voter can benefit by misrepresenting their true preferences.**

  In simpler terms: If you have more than two options and you want a system that isn't controlled by one person, you cannot mathematically guarantee that honesty is the best policy for every voter in every situation.

  ### Why Your Redesigns Failed
  You noted that you tried point-based systems (like the **Borda Count**, which you used) and elimination rounds (similar to **Instant Runoff Voting** or the **Hare System**).

  1.  **Borda Count:** This is notoriously susceptible to strategic voting. As your colleague demonstrated, the optimal strategy often involves "burying" a strong rival by ranking them last, even if they are not your last choice, to boost the relative score of your preferred candidate.
  2.  **Elimination/IRV:** While often marketed as resistant to strategy, these systems are also manipulable under Gibbard-Satterthwaite. A common strategy here is the "push-over," where a voter ranks a weak candidate higher to ensure a strong rival is eliminated in an earlier round, or conversely, ranking a strong rival lower to ensure they don't make it to the final round against your favorite.

  Your intuition was correct: you were not failing to find the "right" method; you were bumping against a mathematical ceiling.

  ### Is There Any Way Out?
  While the theorem establishes a theoretical impossibility, there are nuances relevant to your committee's practical situation:

  **1. Restricting the Domain of Preferences**
  Gibbard-Satterthwaite assumes an *unrestricted domain* (voters can have any ranking). If preferences are **single-peaked** (meaning voters can be arranged on a spectrum, and everyone prefers candidates closer to their ideal point), then a Condorcet method (selecting the candidate who beats all others in pairwise comparisons) can be strategy-proof.
  *   *Application:* This rarely applies to keynote speakers. Preferences for speakers are usually multidimensional (subfield, methodology, prestige, likability), making single-peakedness unlikely.

  **2. Computational Complexity**
  While a system may be *theoretically* manipulable, it might be *computationally* difficult to manipulate. For some systems (like certain forms of Single Transferable Vote), calculating the optimal strategic vote requires knowing how others will vote and solving complex algorithms.
  *   *Application:* In a small committee where members know each other's preferences well, this barrier is low. Your colleague could easily calculate that ranking her second choice first would block her least favorite.

  **3. Cardinal vs. Ordinal Voting**
  Gibbard-Satterthwaite specifically applies to **ordinal** ranking systems (ranking Candidate A > B > C). **Cardinal** systems (e.g., Score Voting, where you rate candidates 0–5) technically fall outside the specific constraints of the theorem because they elicit intensity of preference, not just order.
  *   *Caveat:* However, Gibbard's broader 1973 work on deterministic social choice functions suggests that strategy remains an issue. In Score Voting, the dominant strategy often devolves into "min-maxing" (giving your favorite a 5 and everyone else a 0), which effectively collapses the system back into plurality voting. However, many practitioners argue this yields better welfare outcomes than Borda or IRV.

  **4. Randomization**
  The only way to strictly satisfy strategy-proofness with three or more candidates is to introduce randomness (e.g., Random Dictatorship, where one voter is chosen at random to decide). This is obviously unacceptable for selecting a keynote speaker.

  ### Practical Advice for Your Committee
  Since you cannot eliminate strategic voting, the goal shifts from **prevention** to **management**.

  1.  **Accept the Limit:** Acknowledge to the committee that all systems have trade-offs. The Borda Count is actually quite good at finding a "consensus" candidate (high average rank), even if it invites strategy. IRV is better at finding a "majoritarian" candidate but can eliminate consensus choices early.
  2.  **Secret Ballots:** Ensure that rankings are confidential. Strategic voting is riskier if you cannot be sure how others are voting.
  3.  **Deliberation:** Since the committee is small, consider using the vote as a straw poll followed by discussion. If the vote reveals a paradox or clear strategic blockage, the committee can discuss the *reasons* for the rankings. Often, the "strategic" voter has a substantive concern (e.g., "Candidate X is brilliant but toxic to graduate students") that should be weighed alongside pure preference.
  4.  **Consider Score Voting:** If you want to move away from ranking, a simple 1–5 score system often feels more intuitive to voters and reduces the incentive to rank a 2nd choice above a 1st choice, though it invites "bullet voting."

  ### Summary
  You have not failed to find the right counting method. You have rediscovered one of the central results of social choice theory. **No ranking-based procedure over more than two options can be made immune to this kind of maneuvering.** The presence of strategic voting is not a bug of your specific design; it is a feature of collective decision-making in a multi-candidate environment.

  **Reference:**
  *   Gibbard, A. (1973). "Manipulation of Voting Schemes: A General Result". *Econometrica*.
  *   Satterthwaite, M. A. (1975). "Strategy-proofness and Arrow's Conditions: Existence and Correspondence Theorems for Voting Procedures and Social Welfare Functions". *Journal of Economic Theory*.
