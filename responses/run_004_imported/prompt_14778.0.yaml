      *   **Scenario:** A committee selected a keynote speaker from four finalists. They used a point-based ranking system (Borda Count). One member admitted to strategic voting (ranking a 2nd choice 1st to block a worst choice). The user tried to design alternative systems (including elimination rounds) but found they all seemed vulnerable to strategic manipulation.
      *   **Question:** Is this a failure of design (haven't found the right method) or a deeper theoretical impossibility?

