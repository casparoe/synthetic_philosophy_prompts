      *   **Connect to the Specific Case:**
          *   The user used a Borda Count (point-based ranking). Borda is known to be highly susceptible to strategic voting (burying strong rivals).
          *   The user tried elimination rounds (like Instant Runoff Voting/Hare system). These are also manipulable (though sometimes differently, e.g., "push-over" strategy).
