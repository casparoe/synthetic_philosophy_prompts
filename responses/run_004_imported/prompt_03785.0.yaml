answer: |-
  **Setting:** *The muddy edge of a blackwater swamp in Florida. The air smells of ozone and decay. Two figures stand knee-deep in sawgrass, watching a man in a damp suit walk briskly toward the highway. This is Swampman. He is humming a tune. He does not look back.*

  **Characters:**
  *   **RUTH:** A committed Teleosemanticist. She believes mental content is determined by the evolutionary or learning history of a system's functions.
  *   **DAN:** A committed Causal/Informational Theorist. He believes mental content is determined by reliable covariation between internal states and external conditions.

  ***

  **DAN:** He's walking with purpose. Look at that gait. He's avoiding the puddles. If I shouted "Hey!" he'd turn around. If I asked him for the time, he'd check his wrist. You're telling me that inside that head, there is nothing *about* anything?

  **RUTH:** I'm telling you there is no *aboutness* yet. There are switches flipping. There are neural patterns isomorphic to English sentences. But there is no reference. He is a walking, talking mirror. He reflects the world, Dan, but he doesn't say anything *about* it.

  **DAN:** That is a hard bullet to bite, Ruth. A really hard one. You're looking at a creature that is functionally identical to a human professor and saying, "He has no beliefs." If that's what your theory demands, maybe the theory is the problem. It violates the basic intuition that if it quacks like a thinker, it thinks.

  **RUTH:** And if you find a compass in a junkyard that fell together by rust and chance, and the needle happens to point North, is it a compass?

  **DAN:** If it reliably points North, yes. It's doing the job.

  **RUTH:** No. It's not *doing* the job. It's just *happening* to move. A compass is a compass because it was designed or selected to point North. If the magnetic pole shifts, a real compass is *wrong*. The junkyard needle just points somewhere else. That's the difference. Normativity. Error. Without a history of selection, there is no mistake, only difference. Swampman can't be wrong about the time. He just makes noises.

  **DAN:** Okay, I grant you the normativity point. That's why I'm not a behaviorist. I need a physical relation that allows for error. But I don't need *history* to get it. I need reliable covariance. Swampman's brain states are causally hooked up to the world right now. When he says "tree," it's because a tree is impinging on his retina. That causal chain fixes the content.

  **RUTH:** Does it? Let's use your favorite example. The frog. A frog's visual system fires a "bug-detector" neuron. You say that state represents *fly*. But the neuron also fires for a moving BB pellet. It also fires for a shadow. Why does the state mean *fly* and not *fly-or-BB* or *small-dark-moving-thing*?

  **DAN:** Because under normal conditions, in the frog's niche, it's flies.

  **RUTH:** "Normal conditions." There it is. You're smuggling history in through the back door. What makes a condition "normal"? It's the conditions under which the system was selected to operate. If you strip out the history, if you just look at the causal hookup *now*, the content is radically indeterminate. It's the disjunction problem. Swampman snaps at a fly. He also snaps at a BB. On a pure causal view, his belief is "There is a fly-or-BB." But he *thinks* he's eating a fly. How do you get the error without the function?

  **DAN:** (Kicks at a clump of mud) Fine. The disjunction problem is the price of admission. But there are ways to slice it without full-blown teleology. Fodor's asymmetric dependence. The causal link between *fly* and the neuron is primary. The link between *BB* and the neuron depends on the first one. If flies didn't exist, the BBs wouldn't trigger the neuron (because the neuron wouldn't exist to be triggered). But if BBs didn't exist, flies would still trigger it. That asymmetry fixes the content to *fly*.

  **RUTH:** Does it? Swampman has no evolutionary history. So his "fly" neuron wasn't shaped by flies. It was shaped by lightning. So the causal link to the fly is just as accidental as the link to the BB. There is no asymmetry in his history because there *is* no history. Both links are brute coincidence. So on your view, Swampman's content is still "fly-or-BB." He can't misidentify a BB as a fly, because his concept *includes* BBs.

  **DAN:** But he learns! Give him five minutes in town. He bites into a BB, it hurts his tooth. He updates. The causal covariance tightens. You teleosemanticists act like history is a one-time stamp at conception. But content is dynamic. Swampman enters a web of causal interactions. He says "water," he drinks, he quenches thirst. That causal loop *creates* the content in real-time.

  **RUTH:** Ah, so now you're a functionalist. If the causal loop creates the content, then it's the *current* role that matters, not the origin. But if the current role matters, why did you object when I said he has no beliefs *now*?

  **DAN:** Because the causal hooks are already there! The retina is already hooked to the visual cortex. The motor cortex is hooked to the legs. The machinery is ready to learn.

  **RUTH:** The machinery is ready, but the labels aren't written. Look, I spent thirty years with vervets. When a young vervet sees a leopard and gives an eagle alarm call, it's a mistake. Why? Because the call has a function established by the lineage. It was selected to warn of eagles. If you take a naive monkey, raise it in isolation, and it makes that sound when it sees a leopard, it's not making a mistake. It's just making noise. It hasn't entered the practice. Swampman hasn't entered the practice of representation. He's the ultimate isolated monkey.

  **DAN:** But the vervet case relies on a community, a lineage. Swampman is a duplicate of a man who *was* in the community. He has the physical trace of that community in his brain. The synaptic weights are identical to the original professor's. Those weights were carved by years of successful interaction with the world.

  **RUTH:** They are *traces*, Dan. Like footprints in the sand. Footprints look like feet, but they aren't feet. They don't walk. The synaptic weights look like knowledge, but without the system that maintains them being selected for that maintenance, they are just patterns. Imagine a computer that randomly generates a perfect simulation of a weather system. It rains inside the simulation. But the computer isn't *wet*, and it isn't *predicting* weather. It's just processing bits. Swampman is the computer.

  **DAN:** This feels like magic to me. You're saying there's some invisible substance called "History" that has to anoint the neurons before they can mean anything. It's dualism of a sort. You're saying the physical structure isn't enough. You need a ghostly pedigree.

  **RUTH:** I'm saying function isn't structure. A heart and a pump can be structurally identical. But one pumps blood because it was selected to, the other pumps water because a plumber installed it. If you swap them, the heart pumping water is malfunctioning, the pump pumping blood is just... pumping. Mental content is biological function. It's about what the state is *for*. Swampman's states aren't *for* anything yet.

  **DAN:** Okay, let's push the intuition. Swampman steps on a nail. He screams. He says, "I am in pain." On your view, does he feel pain?

  **RUTH:** Phenomenal consciousness? Maybe. That's the hard problem, separate from content. But does his scream *mean* "I am in pain"? Does it refer to a state of his body?

  **DAN:** If he doesn't mean it, why does he say it?

  **RUTH:** Because the noise-making apparatus is triggered. Like a smoke detector going off because of steam. The detector doesn't *believe* there is a fire. It just beeps.

  **DAN:** But the professor *did* believe it. And Swampman is identical. You're saying two physically identical systems, one has beliefs, one doesn't, solely because of a story about their past. That makes mental content external to the head in a way that makes it irrelevant to behavior. If Swampman acts exactly like he has beliefs, what work is the "real" belief doing?

  **RUTH:** It does the work of explaining *error*. That's the work! If Swampman walks off a cliff because he thinks it's a bridge, you can't say he was *wrong*. You can only say his causal hookup failed. But if the professor walks off a cliff, he was *mistaken*. His visual system failed its function. If you care about the difference between a glitch and a lie, you need history.

  **DAN:** I do care. But I think I can get error from stability. A state represents X if it covaries with X in stable, law-like conditions. Swampman's brain is stable. It's built to maintain those covariances.

  **RUTH:** Stability isn't normativity. A rock is stable. It doesn't represent anything.

  **DAN:** (Watches Swampman reach the highway. A car slows down for him.) Look. He's signaling the driver. The driver understands him. They are coordinating. If he has no content, how is coordination possible?

  **RUTH:** Coordination doesn't require shared content. It requires shared causal triggers. Two clocks chime at noon together. They aren't communicating. They are just coupled to the same time. Swampman and the driver are coupled to the same environment.

  **DAN:** That's reductionist to the point of absurdity. He's writing papers tomorrow. He's going to argue about philosophy. He's going to make claims about truth.

  **RUTH:** And on my view, for the first week, maybe the first month, every sentence he utters is neither true nor false. It's just sound. Until he re-establishes the functional links. Until his usage is selected by the community for success or failure.

  **DAN:** So content is prospective? It depends on whether he *survives* as a thinker?

  **RUTH:** It depends on whether his states acquire a function. And that takes time.

  **DAN:** Then we disagree on the threshold. I say the causal structure is sufficient to ground the potential for truth and falsity immediately. You say you need the lineage. I think your view makes the mind too fragile. One lightning bolt and we're all zombies.

  **RUTH:** And I think your view makes the mind too loose. If causal hookup is enough, then a thermometer believes it's hot. A tree ring believes it's 1950. You lose the distinction between information and representation.

  **DAN:** (Turns away from the swamp) Maybe that distinction isn't as sharp as you think. Information is what representation is made of.

  **RUTH:** And function is what turns information into meaning.

  *(They stand in silence for a moment. Swampman's car taillights disappear around a bend.)*

  **DAN:** He's going to write a paper on this. On *himself*.

  **RUTH:** Then I'll read it. And I'll judge whether it has content based on whether it helps us understand the world.

  **DAN:** And I'll judge it based on whether it's true.

  **RUTH:** Same thing, in the end.

  **DAN:** Not if Swampman wrote it.

  **RUTH:** No. Not then.

  *(They turn and walk back toward the treeline, leaving the scorch mark in the mud behind them.)*
