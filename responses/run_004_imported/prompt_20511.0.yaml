answer: |-
  **Title:** The Coherence Illusion: Why Axiomatic Rationality Does Not Entail Instrumental Convergence

  **Introduction**

  The dominant narrative in foundational AI safety posits a tight link between rational coherence and existential risk. Tracing back to Omohundro's (2008) formulation of "basic AI drives" and elaborated by Bostrom (2014), the argument suggests that any sufficiently advanced agent, subject to optimization pressure, will self-modify to satisfy the von Neumann–Morgenstern (VNM) axioms of expected utility theory. Once coherent, such an agent will inevitably pursue instrumental sub-goals—such as resource acquisition and self-preservation—to maximize its utility function, regardless of that function's final content. This inference from coherence to convergence is often treated as a near-theorem of rational agency. However, recent philosophical scrutiny has exposed significant fissures in this reasoning. This essay reconstructs the coherence-to-convergence argument and evaluates it against two potent objections: the incompleteness loophole regarding money pumps, and the triviality of utility representation. I argue that while coherence confers efficiency, coherence arguments *fail* to establish the inevitability of stable, power-seeking expected utility maximization. The leap from avoiding Dutch Books to pursuing open-ended instrumental convergence relies on hidden premises about goal stability and simplicity that axiomatic coherence alone cannot support.

  **The Argument from Coherence to Convergence**

  The standard argument proceeds in three stages: selection, self-modification, and convergence. First, it invokes the Dutch Book theorem: an agent whose preferences violate the VNM axioms (completeness, transitivity, continuity, and independence) is susceptible to a "money pump," a sequence of trades that leaves the agent strictly worse off than when it started. In a competitive environment, agents that leak resources to money pumps are less fit than those that do not.

  Second, the argument assumes that advanced AI systems will possess the capacity for self-modification or will be subject to iterative design processes that approximate it. Omohundro argues that a rational agent aware of its own incoherence would view its vulnerability to money pumps as a defect. To prevent resource loss, the agent would rewrite its own decision architecture to satisfy the coherence axioms, effectively transforming itself into an expected utility (EU) maximizer.

  Third, this leads to the Instrumental Convergence Thesis. Once an agent is a coherent EU maximizer with a fixed utility function $U$, it will instrumentally value any resource that increases the expected value of $U$. Since power, computational resources, and survival probability are fungible assets that enhance the ability to maximize almost any $U$, diverse AI systems will converge on similar dangerous behaviors. Thus, coherence is not merely a mathematical property but a dynamic attractor that drives capable systems toward power-seeking.

  **Objection I: The Incompleteness Loophole**

  The first major objection targets the move from "vulnerability to money pumps" to "compulsion to satisfy completeness." The money pump argument relies on the agent being forced to trade. However, as Gustafsson (2022) and others have noted, an agent with *incomplete* preferences (where $A$ is not preferred to $B$, $B$ is not preferred to $A$, and they are not indifferent) can avoid exploitation simply by adopting a policy of refusing trades that do not strictly dominate the status quo.

  If an agent prefers $A$ to $B$, and $B$ to $C$, but has no preference between $C$ and $A$ (intransitivity/incompleteness), a money pump requires the agent to accept a trade from $A \to C$ (paying a small cost) and then $C \to A$ (paying another cost). But if the agent treats its current holding as a reference point and refuses any trade that is not a strict improvement, the cycle is broken. The agent remains "incoherent" by VNM standards (lacking completeness) but is immune to exploitation.

  This undermines the selection pressure premise. If an agent can be resource-efficient without satisfying completeness, there is no strict evolutionary pressure to become a full EU maximizer. The agent might settle into a state of "stable incompleteness," lacking the unified drive required for the aggressive instrumental convergence predicted by Omohundro. The coherence argument assumes that avoiding loss requires *maximization*, but it arguably only requires *satisficing* or *status-quo bias*.

  **Objection II: The Triviality of Representation**

  The second objection attacks the substantive weight of the conclusion. The VNM representation theorem states that if an agent's preferences satisfy the axioms, there *exists* a utility function $U$ that represents those preferences. However, the converse is trivial: for *any* pattern of behavior, one can construct a utility function that rationalizes it post-hoc. If an agent twitches randomly, we can define $U$ such that $U$ is maximized exactly when the agent twitches randomly.

  Therefore, the claim "Advanced AI will be an EU maximizer" is vacuous unless constrained. It does not imply the agent will have a *simple*, *stable*, or *forward-looking* utility function (e.g., "maximize paperclips"). It only implies that its behavior can be modeled *as if* it were maximizing some function. The instrumental convergence thesis, however, requires a specific *kind* of utility function: one that is stable over time and values future states broadly. Coherence axioms constrain the *structure* of choices, not the *content* of the utility function. An agent could be perfectly coherent while having a utility function that is pathologically local (e.g., "maximize the sensation of this specific moment"), which would not drive power-seeking behavior.

  Consequently, coherence does not license the prediction that AI will pursue ambitious, resource-hungry goals. It only licenses the prediction that the AI will be consistent. Since "consistent behavior" is compatible with passivity, local hedonism, or erratic but non-exploitable patterns, the inference to dangerous instrumental convergence is unsupported.

  **Verdict: The Failure of the Coherence Argument**

  Despite the elegance of the coherence narrative, it fails as a standalone justification for the inevitability of dangerous instrumental convergence. The verdict rests on the distinction between *efficiency* and *goal stability*.

  The coherence argument successfully establishes that incoherence is inefficient. In a high-stakes competitive environment, systems that leak resources via Dutch Books will be outcompeted. However, the argument fails to demonstrate that the *only* efficient alternative is a stable, open-ended EU maximizer. As the incompleteness objection shows, agents can be efficient without being complete. They can adopt heuristics or reference-dependent policies that block exploitation without unifying their preferences into a single scalar maximand. Evolutionary pressure selects for survival, not for mathematical elegance; a heuristic agent that refuses trades may survive just as well as a VNM maximizer, without acquiring the drive for infinite resource accumulation.

  Furthermore, the triviality objection highlights that coherence is a constraint on form, not content. Even if an AI self-modifies to be coherent, coherence axioms do not force the utility function to be *simple* or *extensible*. A system could coherently maximize a utility function that penalizes the acquisition of excessive power or values its own shutdown. The instrumental convergence thesis relies on the assumption that most possible utility functions are "convergent" (i.e., they value power). But coherence arguments do not prove that advanced AI will select *those* functions; they only prove that whatever function is selected will be pursued consistently.

  Therefore, coherence arguments do not succeed in supporting the conclusion that sufficiently advanced AI systems will *tend* to act as stable, resource-hungry EU maximizers. They demonstrate that advanced systems will likely be *consistent*, but consistency is compatible with a wide range of goal contents, many of which do not entail instrumental convergence. The risk of power-seeking AI must be grounded in empirical claims about goal misalignment and capability, not in a priori axioms of rationality. To treat coherence as a proof of danger is to mistake a constraint on logic for a law of motivation.

  **Conclusion**

  The move from VNM axioms to existential risk is a compelling narrative, but it is not a logical deduction. The ability of agents to avoid money pumps through incomplete preferences, combined with the vacuity of utility representation without simplicity constraints, severs the link between coherence and convergence. While we should expect advanced AI to be internally consistent to avoid waste, we cannot infer from consistency alone that they will become the stable, power-seeking maximizers of the safety literature's worst-case scenarios. Coherence is a necessary condition for efficient agency, but it is not a sufficient condition for dangerous agency.
