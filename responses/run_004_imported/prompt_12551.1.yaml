answer: |-
  Thank you, President [Name], faculty, families, and most importantly, the Class of 2024.

  It is a profound honor to stand here. For thirty-four years, my world was defined by the lab: by beam lines, detectors, and the quiet hum of cooling systems. I spent that career chasing particles that exist for fractions of a second, looking for order in the chaos of collisions. It is only in retirement, largely at the prompting of a former graduate student of mine—who I see sitting over there, and who now teaches philosophy herself—that I have started reading philosophy with any real seriousness.

  She told me I should think about what comes after the data. So, I did. And I want to share with you a specific intellectual journey that has reshaped how I view not just physics, but my own life. I offer it to you as you step out of this department and into a world that is far less controlled than a vacuum chamber.

  When I was a young physicist, roughly your age, I held a comforting thought. It was a sentiment shared by many in our field. We knew that classical Newtonian physics painted a picture of a clockwork universe—a world where, if you knew the position and speed of every particle, you could predict the future perfectly. That felt suffocating. It felt like it left no room for *us*.

  But then came Quantum Mechanics. We learned that at the fundamental level, nature is not fixed. There is indeterminacy. There is probability. And so, like many of you might, I took comfort in the idea that this quantum openness left just enough room in nature for libertarian free will. I thought: *Since the world is not determined all the way down, there must be space left over for me to be a genuinely undetermined author of my own choices.* I thought quantum mechanics had saved me from being a robot.

  A year ago, I decided to test that hope. I read Robert Kane's careful attempts to rescue libertarian freedom using exactly this kind of indeterminacy. Then, I read the skeptical replies from Alfred Mele and Peter van Inwagen. And I have to tell you: that comforting hope did not survive contact with the arguments.

  The problem is this: Introducing sheer randomness at the moment of decision does not hand you control. In fact, it arguably hands you less. If my choice is truly undetermined by my past, my character, or my reasons, then it isn't a choice I made. It is a roll of the dice.

  To put it in terms we all understand: If my decision to accept this invitation to speak was truly undetermined, it wasn't an exercise of agency. It was a decay event that happened to occur inside my skull rather than in one of my old detectors. And if that's the case, please don't applaud. You don't applaud a Geiger counter for clicking.

  That realization was, for a time, a little raw. It felt like the "quantum rescue" had failed. If randomness isn't freedom, and determinism isn't freedom, are we just stuck?

  This is where my retirement reading genuinely cheered me. I turned to the compatibilists: Hume, Frankfurt, Strawson, and Daniel Dennett. I discovered that they never thought determinism was the threat to freedom that I had always assumed it was.

  They argue that we have been asking the wrong question. We keep asking, "Could I have done otherwise in the exact same universe?" But that's a question for a particle tracker, not a human being. The compatibilists suggest we ask instead: "Did I act according to my own reasons? Was I coerced? Did my choices flow from who I am?"

  Freedom isn't about breaking the laws of physics. It isn't about being an uncaused cause. It is about being the kind of complex, reasoning system that can evaluate options and act on them without a gun to your head. Determinism doesn't make you a puppet; it makes you *you*. Your desires, your training, your ethics—those are the causes that matter. When you act on them, you are free, even if the universe is lawful.

  Why does this matter for you, as you leave this department?

  You are going into fields where uncertainty is often terrifying. You will model climates, design algorithms, or probe the limits of matter. There will be moments where you wish for a magic escape hatch, a quantum loophole that lets you off the hook for a difficult decision or a failed experiment.

  My advice is this: Do not look for the loophole. Do not hope that the universe is fuzzy enough to excuse you from responsibility. You do not need randomness to be free. You have something better. You have the capacity to deliberate. You have the ability to let your better judgment guide your actions.

  The "quantum rescue" is unnecessary because you are not a Geiger counter. You are not clicking randomly in the dark. You are physicists. You are trained to look for causes, to trace lines of evidence, to understand why things happen. Apply that same rigor to your own lives. Own your choices not because they are uncaused, but because the causes are *yours*.

  I want to thank my former student, the philosopher in the audience, for pushing me to read these texts. She helped me see that I didn't need the universe to be indeterminate to be the author of my life. I just needed to pick up the pen.

  Class of 2024, the universe is vast, and it is lawful. But within that lawfulness, there is room for reason, for responsibility, and for a freedom that is robust enough to build a life upon. Go out and use it.

  Congratulations.
