answer: |-
  First, take a deep breath: you have absolutely nothing to be embarrassed about. What you experienced is not a failure of your committee's intelligence or your chairmanship. You have independently rediscovered the foundational crises of **Social Choice Theory**, the branch of political science and economics that studies collective decision-making.

  The phenomena you encountered have names, they have been rigorously proven, and they carry Nobel Prizes attached to them. You are asking whether there is a principled way to avoid this instability. The short, mathematically proven answer is: **No, not if you stick to ranked voting.**

  Here is the formal vocabulary for what happened to you, followed by an explanation of why it is structural, and finally some practical advice for next year.

  ### 1. The Vocabulary of Your Dilemma

  **The Plurality Failure (D winning)**
  When D won with only three first-place votes despite being ranked last by a majority, you witnessed the failure of **Plurality Rule** to satisfy the **Condorcet Criterion**. A "Condorcet Winner" is a candidate who would beat every other candidate in a head-to-head matchup. D was a "Condorcet Loser" (lost every head-to-head). Plurality voting is notorious for electing Condorcet Losers when the vote is split among similar alternatives (A, B, and C).

  **The Cycle (A > B > C > A)**
  When you moved to head-to-head comparisons and found that A beat B, B beat C, but C beat A, you encountered the **Condorcet Paradox** (or the Paradox of Voting). This demonstrates that collective preferences derived from majority rule are not necessarily **transitive**, even if every individual voter's preferences are transitive. When this happens, there is no Condorcet Winner. This is not a glitch; it is a mathematical possibility inherent in majority rule with three or more options.

  **The Flip (Removing D changes A vs. B)**
  When you used the points system (known as the **Borda Count**) and found that removing the "irrelevant" alternative D changed the relative ranking of A and B, you observed a violation of **Independence of Irrelevant Alternatives (IIA)**. IIA is the principle that the social preference between two options should depend *only* on the individual preferences between those two options, not on the presence or absence of a third option.

  ### 2. The Structural Problem: Arrow's Impossibility Theorem

  You suspected that "something structural is going on... something about the task itself rather than a fixable defect in whichever counting method." You are exactly right.

  In 1951, economist Kenneth Arrow published *Social Choice and Individual Values*, in which he proved **Arrow's Impossibility Theorem**. Arrow asked: Is there a ranked voting system that can aggregate individual preferences into a collective ranking while satisfying a few basic conditions of fairness?

  He defined "fairness" using four conditions that seem minimal and reasonable:
  1.  **Unrestricted Domain:** The system must work for any possible set of individual preferences (no banning certain rankings).
  2.  **Non-Dictatorship:** No single voter's preferences should automatically determine the outcome.
  3.  **Pareto Efficiency:** If every voter prefers X to Y, the group ranking must prefer X to Y.
  4.  **Independence of Irrelevant Alternatives (IIA):** The group's ranking of X vs. Y should not change if Z is added or removed.

  **Arrow proved that no ranked voting system can satisfy all four conditions simultaneously.**

  This is the answer to your question. The instability you faced is unavoidable in any ordinal (ranking-based) system.
  *   If you want to avoid cycles (Condorcet methods), you must sacrifice IIA (as you saw with the Borda Count).
  *   If you want to satisfy IIA, you effectively need a dictatorship (one person decides).
  *   If you use Plurality, you risk electing a Condorcet Loser.

  There is no "true" will of the committee waiting to be discovered by the right formula. In cases like the one you described (the Condorcet Paradox), the collective will literally does not exist in a coherent, transitive form. The "winner" is always, to some degree, an artifact of the procedure used to select them.

  ### 3. Is There Any Way Out?

  While Arrow's theorem rules out a *perfect* ranked system, political scientists and economists have developed a few workarounds that change the nature of the input or the process.

  **A. Switch from Ordinal to Cardinal Voting**
  Arrow's theorem applies specifically to **ordinal** preferences (rankings: 1st, 2nd, 3rd). It does not apply to **cardinal** preferences (ratings: "I support A at 8/10, B at 7/10").
  *   **Approval Voting:** Committee members vote for *all* candidates they find acceptable. The candidate with the most approval wins. This often elects consensus candidates and avoids the "spoiler effect" of candidates like D.
  *   **Score/Range Voting:** Members give each candidate a score (e.g., 0 to 5). The scores are summed.
  *   *Why this helps:* These methods capture *intensity* of preference. In your case, the Borda Count tried to approximate this with points, but because the points were tied to the *number of candidates*, removing D changed the scale. In Score Voting, the scale is fixed (0–5) regardless of how many candidates run, which mitigates the IIA violation you observed.

  **B. Deliberation Over Aggregation**
  You are in a Political Science department, so this is the most theoretically robust advice for a small committee (n=9). Voting is a method for aggregating preferences when deliberation fails or is impossible (e.g., national elections).
  *   In a committee of nine, the goal should not be to *count* preferences but to *form* a consensus.
  *   When the vote resulted in a cycle, that was a signal that the committee was not in agreement. The "Chair's Tie-break" felt illegitimate because it masked the disagreement rather than resolving it.
  *   **Procedure for next year:** Adopt a rule that if no candidate achieves a supermajority (e.g., 6 out of 9 votes) or if a cycle occurs, the committee must discuss *why* the preferences are split. Often, voters will adjust their rankings after hearing arguments, breaking the cycle naturally. If not, the decision to flip a coin or let the chair decide should be an explicit, acknowledged fallback, not a hidden procedural outcome.

  **C. Accept the Borda Count (with caveats)**
  Despite its violation of IIA, the Borda Count (your points system) is often preferred for awards and prizes. Why? Because it rewards **consensus** over **polarization**.
  *   In your scenario, D had passionate support (3 first-place votes) but was hated by the majority. Plurality rewarded the polarization.
  *   Borda rewarded the candidates who were everyone's second choice.
  *   The IIA violation (the ranking flipping when D is removed) is theoretically ugly, but in practical terms, if D is truly non-viable, removing them and re-tallying is a standard "run-off" procedure. You can codify this: *"We will use Borda Count. If a candidate is clearly non-viable (e.g., Condorcet Loser), they are eliminated, and ballots are retallied as if they never existed."* This makes the IIA violation a feature of the process, not a bug.

  ### Summary Recommendation

  You cannot design a process that is immune to these paradoxes. Arrow proved that such a process is mathematically impossible. However, you can design a process that is **transparent about its trade-offs.**

  For a departmental prize, I recommend the following protocol for next year:

  1.  **Use the Borda Count (Points System).** For service prizes, you generally want the candidate who is broadly respected, not the one with a polarized base. Borda is best at finding the "consensus candidate."
  2.  **Codify the "Irrelevant Alternative" Rule.** Explicitly state in the bylaws: *"If a candidate is eliminated (e.g., by unanimous consent or Condorcet loss), ballots will be retallied excluding that candidate."* This legitimizes the re-counting process you found troubling.
  3.  **Prioritize Deliberation.** If the Borda Count results are extremely close, or if a Condorcet cycle emerges, the default should not be a Chair tie-break, but a mandated 15-minute discussion followed by a revote.
  4.  **Consider Approval Voting.** If you want to avoid the mathematical headaches of rankings entirely, ask members: "Which candidates are acceptable winners?" Award the prize to the candidate with the most approvals. It is simple, hard to game in small committees, and satisfies the intuition that a winner should be broadly acceptable.

  You haven't failed at procedure; you've succeeded at identifying the limits of procedure. That is a very Political Science thing to do.
