      *   *Reason 3:* Different Priors (people fundamentally disagree on models).
      *   *Conclusion:* Markets aggregate information *because* there are noise traders subsidizing the informed traders. The theorem isn't a bug; it's a boundary condition. It tells us *when* markets fail (pure speculation among hyper-rational agents) vs. *when* they work (mix of informed and liquidity/noise traders).

