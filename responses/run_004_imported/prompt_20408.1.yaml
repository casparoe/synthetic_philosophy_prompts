  5.  **The Verdict:** Randomization is the only reflective equilibrium.

  *Key Insight to highlight:* The problem isn't that CDT is wrong about causality; it's that CDT assumes the *act* is the primitive. In prediction problems, the *policy* or *propensity* is the primitive.

