answer: |-
  **The Sum That Isn't There: Why the Pasadena Paradox Breaks Expected Value**

  You are right to be unsettled, and your friend is wrong to wave it off. While her intuition reflects standard statistical practice, it conflates *calculational convenience* with *normative justification*. The Pasadena paradox is not merely a mathematical curiosity to be fenced off; it is a flare gun fired from the boundary of decision theory, illuminating a genuine, structural defect in the standard formulation of expected value (EV) as a universal norm of rationality.

  To understand why the "Restriction View" (your friend's position) fails to save the theory, we must first acknowledge why the "Defect View" is so disturbing. In the St. Petersburg paradox, the expected value is infinite. That is strange, but it is a *definite* strangeness. We can say, "The EV is infinity," and then argue about whether rational agents care about infinity. In the Pasadena game, the expected value is not infinite; it is *indeterminate*. Depending on how you sum the series, the value of the game is $\ln 2$, or $0$, or $1,000,000$, or undefined.

  The Restriction View argues that this indeterminacy is an illusion created by treating the gamble as a mere bag of numbers. Proponents argue that the game has a canonical structure: the coin is tossed in time. Toss 1 happens before Toss 2. Therefore, the summation order $n=1, 2, 3...$ is not arbitrary; it is dictated by the causal and temporal architecture of the scenario. By this logic, the Riemann rearrangement theorem is irrelevant because rearranging the terms corresponds to describing a *different game*—one where you check the fifth toss before the first. If we accept that the "natural order" is privileged, the expected value is robustly $\ln 2$, and expected value theory remains intact, provided we add a footnote that EV requires a convergent series summed in causal order.

  This defense sounds pragmatic, but it crumbles under philosophical scrutiny. It commits a category error between the *realization* of a gamble and the *evaluation* of a gamble.

  When a rational agent decides whether to pay a fee to play the Pasadena game, they are making an *ex-ante* choice. They are evaluating the prospect as a whole, prior to any coin tosses. At the moment of choice, the entire probability distribution exists as a static object of evaluation. There is no temporal sequence at the moment of decision; there is only the agent and the description of the gamble. To insist that the summation must follow the temporal order of the tosses is to smuggle a temporal preference into the definition of value itself. It asserts that the *order in which outcomes might occur* matters to the *value of the opportunity*, even if the agent receives the payoff only after the game concludes.

  If the payoff is handed over in a lump sum after the game ends, why should the calculation of its current worth depend on the sequence of coin flips that generated it? If I offer you a contract that pays you $\$100$ if a die rolls 6, and $\$0$ otherwise, the value of that contract does not change if I roll the die in my hand for five minutes before revealing the result. Yet, the Restriction View insists that for the Pasadena game, the "rolling time" dictates the value. This implies that Expected Value is not actually measuring the value of the *outcome distribution*, but rather the value of the *process*. If EV theory is supposed to guide choices based on outcomes, this is a failure of the theory.

  Furthermore, the Restriction View relies on an *ad hoc* modification of decision theory. Standard decision theory defines Expected Value as the sum of probability-weighted utilities. It does not specify an order of summation because, in standard measure theory, the integral is defined to be order-independent (via absolute convergence). By saying, "We must sum in causal order," your friend is effectively proposing a *new* decision rule, not defending the old one. She is admitting that the standard definition of EV is insufficient for this case and requires a patch. If the theory requires a patch to handle a logically possible (even if physically impossible) gamble, then the original theory was defective in its generality.

  The Defect View argues that this indeterminacy reveals that Expected Value is not a fundamental normative principle, but a heuristic that works only under specific conditions (specifically, absolute convergence). When those conditions are not met, "rationality" as defined by EV simply has no answer. This is not a bug to be fixed; it is a feature of the mathematical landscape that the theory failed to map.

  The implications extend further than infinite games. The Pasadena paradox shows that EV reasoning relies on the linearity of expectation—the idea that the value of a whole is the sum of the values of its parts. The paradox demonstrates that for certain distributions, the "whole" does not have a stable sum. If we accept the Defect View, we are forced to acknowledge that there are coherent preferences and gambles that EV theory cannot rank. This suggests that a complete decision theory must rely on something more robust than simple summation, perhaps comparing distributions directly (stochastic dominance) or utilizing non-Archimedean utilities, rather than trying to force every gamble into a single real number.

  Your friend's insistence that the value is "obviously $\ln 2$" is a testament to how deeply we are conditioned to trust the "natural numbers" ($1, 2, 3...$) as the only valid ordering. But mathematics teaches us that this trust is unwarranted for conditionally convergent series. To build a normative theory of rationality on a foundation that shifts depending on how you count the stones is to build on sand.

  **Verdict**

  The **Defect View** is closer to the truth.

  The Restriction View attempts to save Expected Value theory by imposing an external constraint (causal ordering) that is not inherent to the definition of expectation itself. In doing so, it concedes that the standard mathematical definition of EV is inadequate for the task, requiring a philosophical override to function. It treats the symptom (the lack of a unique sum) without curing the disease (the reliance on linear aggregation for value).

  The Pasadena paradox proves that Expected Value is not a universal norm. It is a local tool that functions correctly only when the probability distribution is "well-behaved" (absolutely convergent). When faced with a distribution like Pasadena's, EV theory does not yield a difficult answer; it yields *no* answer. To claim otherwise is to prioritize mathematical comfort over logical consistency. The paradox exposes that rational choice cannot always be reduced to maximizing a single number derived from linear summation. We must accept that Expected Value theory is incomplete, and that in the realm of the infinite (and perhaps even in complex finite approximations of it), rationality is more subtle than the sum of its parts.
