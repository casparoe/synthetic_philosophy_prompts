  Could you help me build that intuition? Specifically, I would like you to: (1) explain, geometrically and in your own words rather than by restating the formal definitions, what IIA and individual monotonicity each really demand of a bargaining solution as the feasible set is perturbed, and why satisfying one tends to put pressure on the other; (2) construct your own minimal example of two feasible bargaining sets, one contained in the other, for which the Nash and KS solutions respond differently to the expansion, and walk through why that happens; and (3) tell me which of the two axioms you find more normatively compelling as a requirement on a fair bargaining outcome, defending your answer with reference to a concrete situation — a wage negotiation or the division of a merger surplus, say — in which the two solutions would actually recommend different splits. I would much rather have your own worked-through reasoning than a summary of what is "standard" in the literature.
