  2.  **Deconstruct Hume's Two Definitions:**
      *   *Definition 1 (Regularity):* $C$ is followed by $E$, and all objects similar to $C$ are followed by objects similar to $E$. This is observational, actualist, and general. It's about patterns in the world.
      *   *Definition 2 (Counterfactual):* If $C$ had not occurred, $E$ would not have existed. This is modal, hypothetical, and singular. It's about dependence between specific events.
      *   *The Gap:* Regularity doesn't imply necessity (just correlation). Counterfactuals imply necessity/dependence but rely on unobserved possible worlds. Hume treats them as synonymous because he thinks our *idea* of necessity comes from the feeling of expectation generated by the regularity. But logically, they diverge.

  3.  **Address the Counterfactual Theory (David Lewis):**
      *   Lewis takes Hume's 2nd definition seriously. Causation = Counterfactual Dependence.
      *   *The Problem:* It's too simple. $C$ causes $E$ isn't always just "If no $C$, then no $E$."
      *   *Case 1: Preemption (Early/Late).*
          *   *Scenario:* Assassin A shoots Victim. Assassin B was ready to shoot if A didn't. A shoots, V dies.
          *   *Counterfactual Test:* If A hadn't shot, would V have died? Yes (because B would have).
          *   *Result:* V's death does *not* counterfactually depend on A's shot. But A *did* cause the death.
          *   *Lewis's Fix:* Causal chains. A's shot caused the bullet's flight, which caused the death. The chain holds even if the direct dependence fails. (Note: Late preemption breaks chains too, requiring "quasi-dependence," but keep it simple for the essay context).
      *   *Case 2: Backtracking Counterfactuals.*
          *   *Scenario:* Barometer falls ($B$), Storm comes ($S$). Common cause: Pressure drop ($P$).
          *   *Counterfactual:* If $B$ had not fallen, would $S$ have occurred?
          *   *Naive View:* If $B$ didn't fall, maybe $P$ didn't drop, so no $S$. This makes $B$ cause $S$.
          *   *Problem:* We need to hold the past fixed. We evaluate counterfactuals by making a "miracle" at the time of the antecedent, not rewriting history. Lewis introduces similarity of possible worlds to block backtracking.

  4.  **Address the Interventionist Theory (James Woodward):**
      *   Why move beyond Lewis? Lewis's possible worlds semantics is metaphysically heavy and still struggles with complex cases (overdetermination, preemption).
      *   *Core Idea:* Causation is about *manipulability*. $C$ causes $E$ if an *intervention* on $C$ changes $E$.
      *   *The "Intervention" Variable ($I$):* It's not just "If $C$ hadn't happened." It's "If we *made* $C$ not happen (exogenously)."
