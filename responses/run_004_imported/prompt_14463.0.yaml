prompt: |-
  So I'm on the board of a small nonprofit that helps people coming out of prison find jobs. We're about to sign a new funding deal that pays us based on hitting a 60% job-placement-within-90-days rate, checked monthly. Problem is, our case managers already quietly avoid the hardest clients (no stable housing, long sentences, spotty work history) because they tank the numbers, and this contract's gonna make that worse. We've also been testing an AI tool that ranks clients for job coaching, and its already nudging coaches toward the 'easy' cases too, presumably cause that's what scored good in training. Feels like the human and the AI version of the exact same problem (I think this is what people mean by Goodhart's law, but I'm self taught on this stuff so correct me if I'm off). I gotta bring something real to the board meeting Thursday, not just 'let's be aware of it.' Can you write the actual memo I'd bring to that meeting -- something that actually recommends whether we sign as is, renegotiate, or walk away, says what to do about the AI tool, and puts a timeframe on it -- and doesn't just wave away the argument that a hard number might genuinely beat the vibes-based way we judge ourselves now.
