answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Nonprofit Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** URGENT: Risk Assessment of Proposed Performance-Based Funding Contract

  ### Executive Summary

  We are currently evaluating a funding contract that ties revenue to a 60% job-placement rate within 90 days of release, measured monthly. While financial stability is critical, **I recommend we do not sign this contract as written.**

  Current internal data and staff behavior indicate that this specific metric incentivizes "creaming"—prioritizing the most employable clients while excluding those with the highest needs (housing instability, long-term incarceration). This aligns with **Goodhart's Law**: when a measure becomes a target, it ceases to be a good measure. If we optimize for this number, we will mathematically optimize against our mission.

  I propose we authorize the Executive Director to **renegotiate the terms** to include risk-adjusted metrics and place an immediate **moratorium on the AI prioritization tool** until it is audited.

  ### The Core Conflict: Accountability vs. Mission Drift

  We must acknowledge the counter-argument: **Metrics are necessary.** Our previous "vibes-based" assessment of success lacked rigor and made us vulnerable to donor skepticism. We *need* objective data to prove efficacy.

  However, the proposed metric is a **lagging indicator of activity, not a leading indicator of impact.**
  *   **The Risk:** A 90-day placement target encourages short-term fixes (e.g., gig work, unstable jobs) rather than career pathways.
  *   **The Human Factor:** Case managers are already informally triaging clients to protect our stats. Formalizing this with financial penalties will institutionalize the exclusion of the very population we were founded to serve.
  *   **The AI Factor:** Our pilot AI tool is replicating this bias. It was trained on historical placement data, which inherently favors clients with fewer barriers. Using it to prioritize caseloads will automate redlining against high-need clients.

  If we sign as is, we risk achieving 60% placement by serving the 40% who need us least, while our reputation for serving the "hardest to place" erodes.

  ### Recommendations

  I move the Board adopt the following three-point plan:

  **1. Renegotiate the Funding Structure (Priority: High)**
  We should not walk away from the capital, but we cannot accept the current terms. We must propose a **Tiered Success Model** to the funder:
  *   **Risk Adjustment:** Clients with high-barrier factors (e.g., no housing, sentences >5 years) count for 1.5x toward the placement quota.
  *   **Retention Metric:** Shift 50% of the performance bonus to **6-month job retention** rather than 90-day placement. This aligns funding with long-term stability, not just quick hires.
  *   **Reporting Cadence:** Move from monthly to quarterly reviews. Monthly fluctuations in this population are volatile and encourage panic-driven decision-making.

  **2. Pause and Audit the AI Tool (Priority: Critical)**
  *   **Immediate Action:** Suspend the use of the AI tool for client prioritization/triage effective immediately.
  *   **Audit:** Commission a rapid audit (30 days) to test the algorithm for adverse impact against high-need demographics.
  *   **Policy:** Implement a "Human-in-the-Loop" policy. The AI may suggest resources, but it cannot determine caseload priority or eligibility for services.

  **3. Internal Safeguards**
  *   Establish a "Mission Integrity" committee (1 Board Member + 1 Senior Staff) to review client intake data quarterly. If the average "barrier score" of our active caseload drops significantly, it indicates we are creaming, and we must adjust operations regardless of funding targets.

  ### Proposed Timeline

  *   **By Thursday's Meeting (Oct 26):** Board votes to authorize renegotiation based on the Tiered Success Model above.
  *   **By Nov 1:** Executive Director submits counter-proposal to funder.
  *   **By Nov 15:** AI tool paused; manual triage protocols reinstated.
  *   **By Dec 15:** AI Audit complete. Decision made on whether to reconfigure or retire the tool.
  *   **By Jan 1:** Final decision on contract signature. If renegotiation fails, we initiate a contingency fundraising plan to bridge the gap.

  ### Conclusion

  We are not choosing between "money" and "mission." We are choosing between "short-term revenue that corrupts our model" and "sustainable revenue that validates it."

  If we sign this contract as written, we will succeed at the metric and fail at the mission. I urge the Board to support the renegotiation strategy outlined above.

  **Action Required:** Vote to authorize the Executive Director to renegotiate contract terms per Section 1 of this memo.
