      *   *The Crucial Distinction:* Explain the difference between *form* and *substance*. Just because it looks like a proof doesn't make it one.
      *   *Point 1: The Axioms.* In geometry, axioms are definitions (a point has no part). In Hobbes, axioms are empirical claims (humans are selfish/competitive). These can be wrong. Anthropology/psychology disagrees with Hobbes.
      *   *Point 2: The Logic.* Even if premises are accepted, does the conclusion follow? Many argue the leap to *absolute* sovereignty is too far. Maybe a limited government works?
      *   *Point 3: The "Is-Ought" Problem.* Geometry deals with what *is*. Politics deals with what *ought* to be. You can't prove moral obligations with math.
      *   *Point 4: Historical Reception.* Why don't people treat it as certain? Because it's philosophy/political science, not math. It's been debated for 400 years. If it were a proof, the debate would be over.
      *   *Conclusion:* Hobbes's genius was the *attempt* at scientific rigor, not the achievement of mathematical certainty.

