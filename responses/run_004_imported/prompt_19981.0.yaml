  Been going down a Thomas Hobbes rabbit hole lately and read that he barely even looked at geometry until he was like 40, when he stumbled on Euclid's Elements, saw one of the proofs, said something like "that's impossible," then traced it backwards proof by proof until he was convinced — and after that he basically decided political philosophy should work the exact same way. So from what I can tell, that's why Leviathan is laid out like a geometry proof: you start from a couple of self evident axioms about human nature and then deduce step by step, same as proving the Pythagorean theorem, that people have to hand over their power to one absolute sovereign. Doesn't that mean his whole case for absolute sovereignty is basically as objective and certain as a math theorem, and not just his personal opinion about politics? Feels like people should treat Leviathan with a lot more certainty then they do if thats really how it works.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Claim:** The user believes Thomas Hobbes's *Leviathan* is structured like a geometric proof (axioms $\rightarrow$ deductions $\rightarrow$ conclusion) because Hobbes discovered Euclid late in life and was inspired by its certainty.
      *   **Inference:** Therefore, Hobbes's argument for absolute sovereignty should be treated as objectively certain (like a math theorem), not just an opinion.
      *   **Question/Challenge:** Why don't people treat *Leviathan* with more certainty if it's supposedly a geometric proof?
      *   **Underlying Assumption:** The user assumes that *because* Hobbes *intended* it to be geometric/deductive, it *succeeds* in achieving mathematical certainty.

  2.  **Fact-Check the Historical Anecdote:**
      *   *Did Hobbes discover Euclid at 40?* Yes, roughly. John Aubrey's biography mentions Hobbes was 40 when he found Euclid's *Elements* in a gentleman's library. He was intrigued by a proposition (Pythagorean theorem), checked the references back to the axioms, and was convinced.
      *   *Did he try to apply this method to politics?* Yes. Hobbes was heavily influenced by the scientific revolution (Galileo, etc.) and wanted to make politics a "science" based on first principles.

  3.  **Evaluate the "Geometric Method" in *Leviathan*:**
      *   *Structure:* Does *Leviathan* look like Euclid? Sort of. It has definitions, laws of nature, and conclusions.
      *   *Axioms:* Are the starting points self-evident truths (like $A=A$)? No. They are empirical generalizations about human psychology (e.g., "humans are driven by appetite and aversion," "life is a race for power").
      *   *Deduction:* Are the steps logically airtight? They are logical, but they rely on the truth of the premises.
      *   *Conclusion:* Is the conclusion (Absolute Sovereignty) inevitable? Only if you accept the premises and the specific logical path.

  4.  **Identify the Flaw in the User's Reasoning:**
      *   **Form vs. Content:** Hobbes *mimicked* the form of geometry, but he didn't replicate the *certainty* of geometry.
      *   **Axiomatic Difference:** Geometric axioms are definitions within a closed system. Hobbes's "axioms" are claims about the real world (human nature). These are contestable.
      *   **Validity vs. Soundness:** An argument can be valid (logic holds) but unsound (premises are false). Critics argue Hobbes's premises are flawed.
      *   **Normative vs. Descriptive:** Geometry describes abstract relationships. Politics prescribes how people *ought* to live. You can't easily derive an "ought" from an "is" (Hume's Guillotine, though later than Hobbes).

  5.  **Drafting the Response (Iterative Process):**

