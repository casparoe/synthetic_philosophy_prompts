      *   **Roland Puccetti ("The Man in Two Brains", 1973/1981):** Argues that the hemispheres are distinct centers of consciousness *always*. The corpus callosum just synchronizes them. Callosotomy reveals the pre-existing duality. There are two persons in one body normally.

  3.  **Evaluate Against Clinical/Behavioral Reality (The "Real World" Test):**
