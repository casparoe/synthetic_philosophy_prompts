prompt: |-
  My father died two weeks ago after thirty years teaching the children's class at our Jain temple, where anekantavada -- the idea that reality has many sides, and that no claim about it is simply true without specifying which angle it's true from -- was the thing he talked about most, at the temple and at our kitchen table. He could not stand it when people flattened this into "so nothing is really true, it's just your point of view, who's to judge": he would say that move was itself a flat, one-sided claim dressed up as open-mindedness, and "it depends" was, for him, the start of an argument, never the end of one. I am giving his eulogy at the temple hall next week, to a room that will be half people from his classes, who will notice immediately if I soften the philosophy into that kind of relativism, and half coworkers and in-laws who are hearing the word anekantavada for the first time this week. He was also stubborn, and slower to admit fault in himself than in anyone else, and I do not think he would want that quietly smoothed over just because it is a eulogy -- please write it so that it is honest about him in the many-sided way he actually practiced, comforting to people for whom all of this is brand new, and faithful enough that the people who sat in his classes will not wince.
reasoning: |-
  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's father.
      *   **Context:** Died two weeks ago. Taught children's class at a Jain temple for 30 years.
      *   **Core Philosophy:** *Anekantavada* (many-sidedness of reality, truth depends on perspective/angle).
      *   **Father's Stance on Philosophy:** Hated when it was flattened into relativism ("nothing is true," "just your point of view"). Believed "it depends" starts an argument, doesn't end it.
      *   **Father's Character:** Stubborn, slower to admit fault in himself than others. Didn't want this smoothed over in a eulogy.
      *   **Audience:**
          *   Group A: Temple class students (know the philosophy well, will detect dilution/relativism).
          *   Group B: Coworkers and in-laws (new to the term/concept, need comfort/clarity).
      *   **Goal:** Honest (many-sided), comforting (to newcomers), faithful (to the philosophy and the man).

  2.  **Deconstruct *Anekantavada* for the Eulogy:**
      *   *Misconception:* It means "anything goes" or "truth doesn't exist."
      *   *Reality:* It means truth is complex. To find it, we must look from multiple angles. It requires rigor, not laziness.
      *   *Application to the Father:* He lived this. He was stubborn (one side), but also teaching (another side). He held firm to his views (one angle) while teaching others to hold multiple views (another angle). The contradiction *is* the point.

  3.  **Determine the Tone:**
      *   Respectful but not hagiographic (don't make him a saint if he wasn't).
      *   Intellectual but accessible (explain the philosophy without jargon overload).
      *   Warm but firm (like the father).
      *   Grieving but clear-eyed.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the setting, and the diversity of the room. Introduce the father's role.
      *   **The Core Concept (*Anekantavada*):** Define it simply for the newcomers, but precisely for the students. Address the "relativism" trap immediately. Use the father's own words/sentiments ("it depends is the start of an argument").
      *   **The Man vs. The Teacher:** Connect the philosophy to his character. This is the tricky part. How to address his stubbornness without insulting him? Frame it as part of the "many sides." He wasn't a perfect exemplar of the philosophy; he was a *practitioner* of it, which includes struggle.
      *   **Specific Anecdote/Imagery:** The kitchen table vs. the temple. The 30 years of teaching.
      *   **Addressing the Grief:** How do we mourn a man of many sides? We don't try to summarize him in one sentence.
      *   **Closing:** A call to action for the audience. How to honor him? By continuing the inquiry, not by flattening his memory.

  5.  **Refining the "Stubbornness" Aspect:**
      *   *Challenge:* The prompt says he was "slower to admit fault in himself than in anyone else."
      *   *Risk:* Saying this outright might sound like a dig in a eulogy.
      *   *Solution:* Frame it as the friction necessary for truth. A diamond cuts glass. His stubbornness was the weight that anchored his teachings. If he yielded too easily, the lesson would have been weightless. Acknowledge it as a flaw that made him human, which fits *Anekantavada* (no one is wholly one thing).

  6.  **Refining the Philosophy for the Two Audiences:**
      *   *For the Students:* Use the term *Anekantavada*. Mention the "blind men and the elephant" analogy (classic Jain metaphor) but perhaps twist it to show the *work* involved.
      *   *For the Newcomers:* Explain that it's not about "no truth," but about "hard truth." It's about listening to understand, not just to reply.

  7.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Dad taught here 30 years.
      *   He loved *Anekantavada*. It means many sides.
      *   Some think it means nothing matters. Dad hated that.
      *   He was stubborn. He didn't always admit when he was wrong.
      *   But that's okay. He was complex.
      *   We miss him. Let's keep learning.

      *Critique 1:* Too simple. Lacks the emotional weight and the philosophical precision required. Needs to capture the "it depends is the start of an argument" line.

  8.  **Drafting - Iteration 2 (Adding Depth):**
      *   Welcome the coworkers and family who are new to this.
      *   Explain *Anekantavada* not as "maybe," but as "look closer."
      *   Talk about the kitchen table debates.
      *   Address his stubbornness. He held his ground. That was his side.
      *   To the students: I know he wasn't perfect.
      *   To the family: He loved you deeply, even if he argued.
      *   Conclusion: Honor him by looking at the whole picture.

  9.  **Final Polish (incorporating specific phrases from prompt):**
      *   Ensure "it depends was the start of an argument, never the end" is included.
      *   Ensure the distinction between relativism and rigorous perspective-taking is clear.
      *   Make sure the stubbornness is framed as an honest part of the mosaic, not a secret shame.

  10. **Writing the Eulogy (incorporating the above):**
      *   *Salutation:* Acknowledge the mixed room.
      *   *The Philosophy:* Define it early. Use the "flat claim" warning.
      *   *The Man:* 30 years. Kitchen table.
      *   *The Flaw:* The stubbornness. Frame it as the friction of truth.
      *   *The Comfort:* For those who didn't know the philosophy, offer the human equivalent (knowing someone fully).
      *   *The Send-off:* Continue the work.

  11. **Review against Constraints:**
      *   *Honest about him?* Yes, includes stubbornness.
      *   *Comforting to newcomers?* Yes, explains the philosophy in human terms.
      *   *Faithful to students?* Yes, avoids relativism, uses correct terminology and nuance.
      *   *Tone?* Dignified, grieving, intellectually honest.

