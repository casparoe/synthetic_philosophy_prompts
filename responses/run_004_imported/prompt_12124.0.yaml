answer: |-
  **Setting:** *A university coffee shop, late afternoon. The remains of a seminar hang in the air. ALEX (Expressivist, quasi-realist leaning) and JORDAN (Moral Realist/Cognitivist) are still at the table. The whiteboard in the seminar room behind them is still covered in truth-tables.*

  **Jordan:** I'm glad the professor let us drop the *Modus Ponens* drill. Honestly, if I hear "If lying is wrong, then getting your brother to lie is wrong" one more time, I'm going to lie about my own existence.

  **Alex:** *(Laughs)* Right? We've beaten the Frege-Geach conditional problem into the ground. It's the classic, but it's almost too clean. The logic works if you treat the attitudes as premises. The real mess is elsewhere.

  **Jordan:** Exactly. I was reading that paper on the Negation Problem. Dreier, maybe? Or Schroeder? The point is, you guys can maybe fudge the conditional by talking about consistency of commitments. But negation? That's where the ontology bleeds through.

  **Alex:** Okay, let's hear it. But remember, I'm not a simple emotivist. I'm not saying "Wrong" just means "Boo!" and then going home. I'm a quasi-realist. I'm trying to earn the right to talk *as if* there are moral truths without positing weird moral properties.

  **Jordan:** I know, I know. Blackburn, Gibbard, the whole "normative governance" package. But here's the nail in the coffin for negation. Take the sentence: "Lying is not wrong."

  **Alex:** Sure. Permissibility claim.

  **Jordan:** Okay. For you, "Lying is wrong" expresses a specific normative attitude. Let's call it a "plan to blame" or a "disapproval commitment." So, what does "Lying is *not* wrong" express?

  **Alex:** It expresses the rejection of that commitment. It's saying I rule out blaming for lying.

  **Jordan:** See, that's too quick. "Ruling out blaming" sounds like a positive stance. But if I just *lack* the commitment to blame, that's indifference. If I ask you, "Is it wrong to chew with your mouth open?" and you say, "I have no stance on that," you aren't saying "It is *not wrong*." You're saying, "I haven't thought about it."

  **Alex:** I grant the distinction between *absence of judgment* and *judgment of absence*. But expressivism can handle that. Gibbard handles it with planning. To judge lying wrong is to plan to blame liars. To judge lying *not* wrong is to plan *not* to blame liars. It's a constraint on my future planning.

  **Jordan:** But "planning not to blame" is still psychologically distinct from "judging it permissible." Look, if I say "Lying is not wrong," I'm making a claim that holds regardless of my plans. But more importantly, look at the logic of negation. In standard logic, $\neg P$ is true if and only if $P$ is false. It's exhaustive.

  **Alex:** We mimic that logic.

  **Jordan:** Do you? If "Wrong" = Boo, then "Not Wrong" = Not-Boo. But "Not-Boo" covers two massive, distinct psychological states: (1) I actively think it's fine (permissibility), and (2) I don't care at all (indifference). Your semantics collapses the distinction between *permission* and *apathy*.

  **Alex:** *(Leans forward)* Hold on. We don't define the meaning by the raw psychology alone. We define it by the *role* the judgment plays in deliberation. When I say "Lying is not wrong," I'm not reporting my apathy. I'm licensing action. I'm saying, "You can do this without normative sanction." That's a functional role. The "Not-Boo" isn't just silence; it's an active *withholding* of the sanction.

  **Jordan:** Withholding is still passive! Think about the Law of Excluded Middle. "Either lying is wrong or lying is not wrong." That's a necessary truth. It has to be one or the other.

  **Alex:** Agreed.

  **Jordan:** But translate that into your expressivist language. "Either I have a plan to blame for lying, or I have a plan not to blame for lying." That's not a necessary truth! I could have *no plan at all* regarding lying. I could be morally confused. I could be asleep. The tautology of moral logic turns into a contingent psychological fact about Alex's planning states.

  **Alex:** This is where the quasi-realism kicks in, Jordan. I'm not *analyzing* the moral sentence into a psychological report. That's the error theory trap. I'm saying that when we engage in moral discourse, we are *constituting* a logic of attitudes. When I accept "Either P or not-P," I'm not describing my mind; I'm committing myself to a system where there is no gap between prohibition and permission. I'm *making* it the case that there's no middle ground by adopting the normative framework.

  **Jordan:** That sounds like magic. You're saying we just *decide* that our attitudes obey classical logic, even though the underlying mental states clearly don't?

  **Alex:** I'm saying the mental states aren't the meaning. The meaning is the inferential role. If I say "Lying is not wrong," I am committing myself to the incompatibility of blaming someone for lying. Negation, for me, marks *inconsistency*. "Not Wrong" means "Any state of mind that blames lying is inconsistent with my current normative framework."

  **Jordan:** Okay, but now you have a different problem. The "Negation Problem" isn't just about indifference. It's about the scope of the negation. Distinguish these two:
  1. "It is not the case that lying is wrong." (Sentence negation)
  2. "Lying is not-wrong." (Predicate negation)

  In realism, these are equivalent. But for you? If "Wrong" is an attitude, sentence negation is "I don't have the attitude." Predicate negation is "I have the *opposite* attitude."

  **Alex:** I can distinguish them. Predicate negation ("not-wrong") is the acceptance of permissibility. Sentence negation ("It is not the case that...") is the rejection of the claim that it's wrong.

  **Jordan:** But what *is* the acceptance of permissibility, if not a positive attitude? If "Wrong" is Boo, is "Not-Wrong" Hooray?

  **Alex:** No!

  **Jordan:** Why not? Because if it's not Hooray, and it's not Boo, what is it? You said earlier it's "planning not to blame." But if I plan not to blame theft, am I saying theft is *permissible*? Or am I saying I'm a pacifist who never blames anything?

  **Alex:** It's context-dependent. In a normative framework, to rule out blaming is to rule out the prohibition. It's a second-order commitment.

  **Jordan:** *(Taps pen on table)* Here's the killer, Alex. Double negation. "It is not the case that lying is not wrong." In classical logic, that equals "Lying is wrong."

  **Alex:** Sure.

  **Jordan:** Translate it. "It is not the case that (I plan not to blame)." So, "I do not plan not to blame." Does that equal "I plan to blame"?

  **Alex:** In a consistent normative system, yes.

  **Jordan:** But psychologically? "I do not plan not to blame" could just mean "I haven't decided whether to blame." It leaves the door open for indifference again! Double negation elimination works for truth-bearers because truth and falsity are exhaustive. But for attitudes? "Not (Not Boo)" does not necessarily equal "Boo." It could equal "Meh."

  **Alex:** *(Pauses, takes a sip of cold coffee)* You're pressing the gap between the *logic we use* and the *psychology we have*. I admit that. If I treat moral language as purely descriptive of my psychology, I lose the logic. That's why I insist: moral language isn't descriptive. It's practical. When I use double negation, I'm not doing math on my feelings. I'm tightening the screws of my commitment. To accept "Not (Not Wrong)" *just is* to reaffirm the commitment to "Wrong."

  **Jordan:** But *why*? What forces that equivalence? If I'm a realist, the equivalence is forced by the way the world is. Lying either has the property of wrongness or it doesn't. There's no metaphysical room for "Meh." If you remove the property, you remove the anchor. You're left with a spinning wheel of attitudes that you're *hoping* will mimic the structure of truth without the substance.

  **Alex:** But isn't that what we do? We construct norms. The "anchor" isn't a spooky property; it's the requirement of coherence in our lives. If I say "Lying isn't not wrong" but refuse to blame liars, *I'm the one being inconsistent*, not the world. The negation problem assumes there has to be a *thing* that the negation operates on. I'm saying the negation operates on the *commitment*.

  **Jordan:** And that's where I think you're still hiding the ball. Because when I say "Lying is not wrong," I feel like I'm discovering something, not just tightening my commitments. I feel like I'm ruling out a possibility in the world, not just in my plan. If your theory can't explain why "Not Wrong" feels like a positive discovery rather than just "I'm okay with this," then you haven't captured the meaning. You've captured the *use*, maybe, but not the *content*.

  **Alex:** Maybe. But if I posit a "moral property" to save the content, I lose the explanation of why morality motivates us. I'd rather struggle with negation and keep the motivation than solve negation and turn morality into a branch of botany.

  **Jordan:** *(Smiles)* Fair. But don't think you've solved it. The Negation Problem isn't just about logic; it's about the phenomenology of permission. Until you can explain how "Not-Boo" feels different from "Meh" without smuggling in a truth-condition, you're still in the red.

  **Alex:** Then I'll keep working on the budget. But I'm not bankrupt yet.

  **Jordan:** No. But you're definitely overdrawn.

  *(They both laugh and start gathering their bags.)*
