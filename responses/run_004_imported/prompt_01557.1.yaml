prompt: |-
  so this is gonna sound random but in my intro to philosophy elective we did a unit on the history of logic and obviously Frege came up a ton (my teacher basically called him the inventor of modern symbolic logic), and afterward i fell down a wikipedia hole and found something that's been bugging me since. turns out in 1924, like a year before he died, Frege kept this private diary that got left out of his collected papers on purpose and wasn't even translated into english until 1996. its not about logic at all, its just full of hardcore right wing stuff, wanting jews stripped of political rights and kicked out of germany, hating catholics and the french, into fascist strongman politics instead of parliamentary democracy. Michael Dummett, who's basically THE Frege guy, said he was "deeply shocked" reading it bc he'd always thought of Frege as this perfectly rational, almost robot-like thinker.

  and then i found this detail that's kind of messing with my head: Frege's big philosophical thing (the reason he fought so hard against what he called "psychologism") was that logic and what he called "Thoughts" have to be totally objective, existing independent of anyone's mind, in what he literally called a "third realm" - and in german the actual phrase he used was "drittes Reich." like the same words that later became the name for Nazi Germany, even tho that's apparently just a coincidence of language since he wrote it in 1918 before that phrase got politically loaded. still, knowing what we now know about his diary, its a genuinely spooky coincidence. i brought this up with my friend after class and we couldn't agree on whether it actually MEANS anything - like is it just a coincidence/totally seperate from his actual philosophy (seperate the art from the artist type thing), or does the fact that this guy was so obsessed with purging "subjective bias" from logic while being extremely biased in his actual political views tell us something real, either about him specifically or about that whole objectivity project more generally.

  could you write me a dialogue between two Frege scholars who are equally good at arguing, hashing this out - one who thinks the diary is basically irrelevant to assessing his logic/philosophy of language (formal arguments don't care about the psychology of the person who came up with them, that's kind of the whole point) and one who thinks it does actually matter, for reasons besides just "he was a bad guy so ignore him." i don't want either one to be a pushover, they should each respond to the specific thing the other just said instead of just taking turns giving speeches. doesn't need to be crazy long, i just want an actual back and forth.
