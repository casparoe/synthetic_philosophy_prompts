answer: |-
  This is a precise and well-framed question. You have correctly identified the pivot point in the literature: the move from "money has diminishing marginal utility" to "utility itself must be bounded."

  As a software engineer, you can think of this as a race condition between two functions: the probability decay function $P(n)$ and the utility growth function $U(n)$. Bernoulli showed that for a specific payoff schedule (money), a specific $U$ (log) wins the race. Menger showed that for any $U$ that doesn't have a hard cap (unbounded), an adversary can construct a payoff schedule that wins the race.

  Here is the technical walkthrough of the Menger argument and an assessment of the boundedness objection.

  ---

  ### Part 1: Why Unboundedness Regenerates the Paradox

  To understand why unboundedness is the critical failure mode, we must formalize the "Generalized St. Petersburg Game."

  #### 1. The Setup
  Let a lottery $L$ be defined by a sequence of outcomes $x_1, x_2, \dots$ occurring with probabilities $p_1, p_2, \dots$, where $\sum p_i = 1$.
  In the classic St. Petersburg game:
  *   $p_n = \frac{1}{2^n}$
  *   Prize in money $m_n = 2^n$
  *   Expected Money: $E[M] = \sum_{n=1}^{\infty} \frac{1}{2^n} 2^n = \sum 1 = \infty$.

  #### 2. Bernoulli's Resolution (and its limitation)
  Bernoulli posits a utility function $U: \mathbb{R} \to \mathbb{R}$ that is concave (e.g., $U(m) = \ln(m)$).
  The Expected Utility (EU) is:
  $$ EU = \sum_{n=1}^{\infty} p_n U(m_n) = \sum_{n=1}^{\infty} \frac{1}{2^n} \ln(2^n) = \ln(2) \sum_{n=1}^{\infty} \frac{n}{2^n} $$
  This series converges (to $2\ln(2)$). The paradox appears resolved **for this specific payoff schedule**.

  #### 3. Menger's Counter-Argument (1934)
  Menger observed that Bernoulli's solution relies on the payoff schedule being fixed in *money*. But if we are defining rationality in terms of *utility*, we should be able to define a gamble directly in terms of utility units, or equivalently, tailor the monetary prize to the agent's specific utility function.

  **The Definition of Unboundedness:**
  A utility function $U$ is unbounded above if for every real number $K$, there exists some outcome $x$ such that $U(x) > K$.
  $$ \forall K \in \mathbb{R}, \exists x : U(x) > K $$

  **The Construction:**
  Menger argues that if $U$ is unbounded, we can construct a "Super St. Petersburg" lottery $L'$ that diverges in expected utility, regardless of how concave $U$ is.

  1.  We keep the probabilities fixed at $p_n = \frac{1}{2^n}$.
  2.  We need to select prizes $w_n$ (wealth levels) such that the expected utility diverges.
  3.  We require the sum to diverge: $\sum_{n=1}^{\infty} \frac{1}{2^n} U(w_n) = \infty$.
  4.  To guarantee this, it suffices to ensure each term in the sum is $\ge 1$.
      $$ \frac{1}{2^n} U(w_n) \ge 1 \implies U(w_n) \ge 2^n $$
  5.  **The Crucial Step:** Because $U$ is **unbounded**, for any target value $T$, there exists a wealth $w$ that yields at least that utility. Therefore, for each $n$, there *exists* a prize $w_n$ such that $U(w_n) \ge 2^n$.
      *   If $U(m) = \ln(m)$, we set $w_n = e^{2^n}$.
      *   If $U(m) = \sqrt{m}$, we set $w_n = (2^n)^2 = 4^n$.
      *   If $U(m) = \ln(\ln(m))$, we set $w_n = e^{e^{2^n}}$.

  **The Result:**
  For *any* unbounded $U$, we can define a prize schedule $W = \{w_1, w_2, \dots\}$ such that:
  $$ EU(L') = \sum_{n=1}^{\infty} \frac{1}{2^n} U(w_n) \ge \sum_{n=1}^{\infty} \frac{1}{2^n} 2^n = \sum_{n=1}^{\infty} 1 = \infty $$

  **Conclusion on Question (1):**
  Diminishing returns (concavity) only slow down the growth of utility; they do not cap it. Unboundedness means the "range" of the function is infinite. Because the probabilities decay exponentially ($1/2^n$), you only need the utility to grow exponentially ($2^n$) to break the sum. Since an unbounded function has no ceiling, you can always find an input $w_n$ large enough to produce the required utility output.

  Therefore, within Expected Utility Theory (EUT), the **only** way to guarantee that *no* St. Petersburg-style game yields infinite expectation is to insist that $U$ is bounded above.

  ---

  ### Part 2: The Boundedness Requirement and the "Ceiling" Objection

  If we accept Menger's critique, we must adopt **Bounded Utility**: there exists some finite $M$ such that $U(x) \le M$ for all possible outcomes $x$.

  This resolves the math: if $U(w_n) \le M$, then $EU \le \sum p_n M = M$. The expectation is always finite.

  However, this leads to your second question: Does this just relocate the weirdness?

  #### 1. The Objection: The "Bliss Ceiling"
  The objection is often framed intuitively: If utility is bounded, there is some maximum value $M$. This implies that there is some outcome (or sequence of outcomes) that is "good enough" that adding more good things adds negligible utility.

  **The "Years in Heaven" Pump:**
  *   Let $U(1 \text{ year of bliss}) = 1$.
  *   If $U$ is unbounded, $U(1,000,000 \text{ years})$ should be much larger than $U(1 \text{ year})$.
  *   If $U$ is bounded by $M=10$, then $U(1 \text{ year})$ might be $9.9$, and $U(1,000,000 \text{ years})$ might be $9.9999$.
  *   This implies a rational agent should be almost indifferent between 1 year of bliss and 1 million years of bliss, provided both are "high enough" on the scale. This violates strong intuitions about aggregation of value.

  #### 2. The Defense: Why Boundedness Might Be Necessary
  Proponents of bounded utility (e.g., Arrow, Savage, Nover & Hájek) offer several technical and philosophical defenses.

  **A. The Archimedean/Continuity Axiom (VNM)**
  You mentioned the von Neumann–Morgenstern (VNM) axioms. Standard VNM theory applies to *finite* lotteries and does not strictly require bounded utility. However, to extend VNM to *infinite* lotteries (which is required to even discuss the St. Petersburg paradox formally), one must add a continuity axiom.
  *   **The Axiom:** If $A \prec B \prec C$, there exists a probability $p$ such that you are indifferent between $B$ and a lottery $[p A, (1-p) C]$.
  *   **The Implication:** If utility were unbounded, one could construct a sequence of outcomes where no probability $p$ is small enough to make the risk acceptable. (i.e., No matter how small the probability of hell, if the reward in heaven is infinite utility, the EU is infinite).
  *   To satisfy the Archimedean property for *all* conceivable lotteries, utility must be bounded. If you accept the VNM framework as the definition of rationality, boundedness falls out as a theorem for infinite domains.

  **B. Utility is Not "Value"**
  A common category error is treating utility as a measure of "moral worth" or "objective value."
  *   **Engineering View:** Utility is a representation of *preference ordering*. $U(A) > U(B)$ simply means "I prefer A to B."
  *   **Boundedness Interpretation:** Bounded utility doesn't mean "happiness stops increasing." It means "preference intensity saturates."
  *   There is a limit to how much you can prefer one thing over another. If you are offered a choice between "1 million years of bliss" and "1 billion years of bliss," you might prefer the latter, but your willingness to pay (or risk) to upgrade might approach a limit.
  *   If your preferences are truly unbounded, you are vulnerable to a "money pump" or a "dominance" argument where you trade away certain goods for infinitesimal chances at infinite goods.

  **C. The "No Best World" Argument**
  The objection assumes there is a specific outcome $X$ where $U(X) = M$. That is not required. Boundedness requires a **supremum**, not a maximum.
  *   $U(x) < M$ for all $x$.
  *   You can always have a better outcome (more years of bliss), but the *difference* in utility between $x$ and $x + \delta$ approaches zero as $x \to \infty$.
  *   This models **diminishing marginal utility of the good itself**, not just the money buying it. The 1,000,000th year of bliss is worth less to you than the 1st year, perhaps because you cannot experience them all simultaneously.

  #### 3. Assessment: Is it a Relocation or a Resolution?
  It is arguably a **relocation**, but one that forces a clarification of terms.

  *   **If you view Utility as Objective Value:** Boundedness is implausible. It seems rational to believe that a world with more happy people is strictly better than one with fewer, without limit. If you hold this view, you must reject Expected Utility Theory (EUT) as the complete account of rationality. (This leads to alternatives like Risk-Weighted EUT or rejecting the linearity of probability).
  *   **If you view Utility as Decision Weight:** Boundedness is coherent. It asserts that human decision-making cannot process infinite distinctions. There is a point where "better" is indistinguishable from "best" for the purpose of action.

  **The "Relocation" Verdict:**
  The weirdness moves from "Infinite Money" (St. Petersburg) to "Infinite Value" (The Ceiling).
  *   **Unbounded Utility:** Allows infinite value, but breaks the math of decision theory (no optimal choice exists in St. Petersburg games).
  *   **Bounded Utility:** Saves the math, but implies that sufficiently large goods become fungible (1 billion years $\approx$ 1 million years).

  Most modern decision theorists (e.g., Alan Hájek) concede that boundedness is the only way to save EUT, but acknowledge it is a substantive constraint on value theory, not just a mathematical trick. It asserts that **no sequence of goods can sum to infinite importance.**

  ### Summary for Reconstruction

  1.  **Menger's Logic:**
      *   Input: Probability $p_n = 2^{-n}$.
      *   Condition: $U$ is unbounded ($\forall K, \exists w, U(w) > K$).
      *   Construction: Choose $w_n$ such that $U(w_n) \ge 2^n$.
      *   Result: $E[U] = \sum 2^{-n} U(w_n) \ge \sum 1 = \infty$.
      *   Takeaway: Concavity is insufficient; only a hard cap (boundedness) prevents the adversary from scaling the prize to match the probability decay.

  2.  **The Boundedness Trade-off:**
      *   **Pro:** Preserves the coherence of Expected Utility Theory; satisfies the Archimedean axiom for infinite lotteries; prevents "infinite dominance" paradoxes.
      *   **Con:** Implies a saturation point on value (the "Bliss Ceiling"); suggests that adding more good outcomes eventually yields negligible preference difference.
      *   **Resolution:** Accept that Utility $\neq$ Objective Moral Value. Utility is a measure of *choice behavior*, and rational choice behavior appears to require boundedness to avoid paralysis in the face of infinite expectations.

  If you want to dig deeper into the "Relocation" objection specifically, look into the work of **Alan Hájek** (e.g., "The St. Petersburg Paradox" in SEP or his papers on bounded utility) and **Frank Arntzenius**. They articulate the "no best world" objection very clearly. But for the purpose of the Menger argument, the technical takeaway is: **Unboundedness allows the payoff to outpace the probability; Boundedness forbids it by definition.**
