prompt: |-
  My cousin's getting married in a few weeks and I somehow ended up on toast duty (long story, I'm closer to her than her actual siblings). Here's the complication: she and her fiancé met in the same modal metaphysics PhD program, and for basically their entire relationship they've had this running bit where one of them says something sappy like "there's no possible world where I don't end up with you," and the other one very deliberately ruins the moment. She's a died-in-the-wool Lewisian — counterpart theory, no object exists in more than one world, "you" in some other world is really just a counterpart who resembles you along whatever dimensions happen to be contextually relevant, so strictly speaking there's no metaphysical "you" out there for her to be reunited with. Her fiancé is Team Kripke — transworld identity, you don't need a similarity metric to know it's really you in another world, you just stipulate it, which is basically the whole point behind Kripke's objection to Lewis (something about how the actual Hubert Humphrey couldn't care less whether some Humphrey-resembling guy wins an election in a different world, because that guy isn't him). I've absorbed enough of this from years of holiday dinners to follow the argument, but I'm not a philosopher myself, so I don't fully trust myself to get the details right without help.

  What I want is a toast, maybe three or four minutes, that's actually structured around this disagreement instead of just name-dropping it once as a joke — and that ends up being a genuinely sincere, romantic thing to say about these two specific people rather than either (a) a straight, uncomplicated "you'll be together in every possible world" line, which is exactly the sentence they'd each independently object to for their own technical reasons, or (b) a dry seminar on the metaphysics of modality that leaves the room cold. It also has to actually work as a toast for my aunt, the flower girl's parents, and everyone else who has never heard the word "counterpart" used this way in their life. Can you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for the speaker's cousin.
      *   **Relationship:** Speaker is closer to the bride than her siblings.
      *   **Key Dynamic:** The couple met in a modal metaphysics PhD program. They have a running joke/argument about "possible worlds."
      *   **Philosophical Stances:**
          *   Bride: David Lewis (Counterpart Theory). No transworld identity. "You" in another world is just a similar counterpart, not *you*.
          *   Groom: Saul Kripke (Transworld Identity). Rigid designators. It *is* you in another world, stipulated by origin/identity, not similarity.
      *   **The Trap:** Avoid saying "You'll be together in every possible world" (too sappy/technically wrong for both) and avoid a dry philosophy lecture (boring for guests).
      *   **Goal:** A 3-4 minute toast that uses this disagreement as the *structure*, resolves it romantically, and is accessible to non-philosophers (Aunt, flower girl's parents, etc.).
      *   **Tone:** Sincere, romantic, witty, warm, inclusive.

  2.  **Deconstruct the Philosophy for a General Audience:**
      *   *Lewis (Bride):* Reality is a multiverse. Other worlds are real places. But *I* am only here. The "me" over there is a stranger who looks like me. Love is local to *this* world.
      *   *Kripke (Groom):* We can talk about *you* doing something else. It's still *you*. Identity travels across possibilities. Love is necessary/transworld.
      *   *The Conflict:* Is love bound by the specific physical instance (Lewis) or is it an essential truth about the persons involved (Kripke)?
      *   *The Synthesis:* We don't need to solve the metaphysics. We just need to acknowledge that *here*, in *this* world (the Actual World), they chose each other. That choice makes the metaphysics irrelevant or, better yet, complementary.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the role, the relationship, and the "elephant in the room" (their academic background). Keep it light.
          *   *Idea:* Mention the "long story" of why I'm giving the toast. Introduce the philosophy bit gently.
      *   **The Setup (The Disagreement):** Explain their dynamic without jargon.
          *   *Idea:* One says "Fate," the other says "Technicality." One says "Everywhere," the other says "Right Here."
          *   *Translation:* Lewis = "You are unique to this moment." Kripke = "You are essentially you."
      *   **The Pivot (The Problem with the Standard Toast):** Address the prompt's constraint. Why "Together in every world" fails.
          *   *Idea:* If I say that, Bride thinks "No, counterparts!" Groom thinks "Well, yes, but..." It ruins the joke.
      *   **The Resolution (The Romantic Turn):** How to make this sincere.
          *   *Idea:* It doesn't matter what happens in other worlds. What matters is *this* world. The "Actual World" (as Lewis calls it) is the only one where we can raise a glass.
          *   *Deeper Idea:* Kripke says identity is fixed. Lewis says worlds are isolated. Maybe the toast is about how they bridge that gap. They created a shared world.
      *   **The Climax/Toast:** Bring it home to the guests.
          *   *Idea:* To the Actual World. To the choice they made.

  4.  **Refining the Philosophy (Self-Correction):**
      *   *Check:* Did I get Lewis right? Yes, spatiotemporal isolation. Counterparts based on similarity.
      *   *Check:* Did I get Kripke right? Yes, rigid designators, transworld identity via origin/essence.
      *   *Check:* Is it accessible? Need to avoid words like "rigid designator" or "spatiotemporal continuity" unless immediately explained. Use metaphors.
      *   *Metaphor:* "The multiverse vs. The soul." Or "The map vs. The traveler." Let's go with "The Infinite vs. The Specific."

  5.  **Drafting the Content (Iterative Process):**

      *   *Opening:* Hi, I'm [Name]. I'm the cousin. Yes, I know about the PhDs.
      *   *Middle:* They argue about love using logic. Bride: "In another world, we aren't us." Groom: "Yes we are."
      *   *The Twist:* Actually, they agree on the most important part. In *this* world, they found each other.
      *   *Lewis angle:* This moment is precious because it's unique to this world.
      *   *Kripke angle:* This bond is essential to who they are.
      *   *Closing:* Raise a glass to the Actual World.

  6.  **Polishing for Tone:**
      *   Make sure it doesn't sound like I'm mocking them. It needs to be affectionate teasing.
      *   Ensure the non-philosophers feel included. "For those of you who didn't spend your dates debating..."
      *   Keep the timing right. 3-4 minutes is roughly 450-600 words spoken at a moderate pace.

  7.  **Final Review against Constraints:**
      *   Structured around the disagreement? Yes.
      *   Sincere/Romantic? Yes.
      *   Avoids the "Every possible world" cliché? Yes.
      *   Accessible? Yes, defined terms simply.
      *   Lewis/Kripke accuracy? Seems solid enough for a toast.

  8.  **Final Polish:** (Writing the actual text with attention to rhythm and pauses.) *Self-correction during drafting: Make sure to explicitly mention the "Actual World" indexicality, that's a key Lewis point that works well for weddings (being present).*

  **(Post-Drafting Thought):** I need to make sure I don't get bogged down in the "Humphrey" objection explicitly, but capture the *spirit* of it (that resemblance isn't enough). I'll focus on the emotional weight of "You" vs "Someone like you."

