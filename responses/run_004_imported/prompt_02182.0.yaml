          *   *Different Priors:* As mentioned, if annotators have different beliefs about what the model will do (not really applicable in RLHF static comparison) or different contexts, the theorem struggles.
          *   *The "Ex Ante" vs. "Ex Post" Problem:* Harsanyi is often criticized for ignoring fairness/equity concerns that aren't captured in vNM utilities (e.g., preference for equality itself).
