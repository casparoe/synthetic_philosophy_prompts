      *   *Conclusion:* Encourage posting but with caveats. It's a provocative piece, not a proof.

  8.  **Refining the "Noise vs. Values" point:** This is critical. In RLHF, we usually assume there is a $R^*$ and annotators observe $R^* + \epsilon$. Harsanyi assumes $U_1, U_2, \dots$ exist and are distinct. If the goal of RLHF is to find $R^*$, Harsanyi is the wrong tool (that's statistical estimation). If the goal of RLHF is to aggregate *divergent* human values (e.g., different cultures), then Harsanyi applies, but then the "noise" model of Bradley-Terry is suspect. I need to make sure the user sees this distinction.

  9.  **Refining the "Linearity" point:** The draft says "aggregation is linear... since the fitting objective is essentially additive." In Bradley-Terry, the log-likelihood is additive. $\log L = \sum \log \sigma(r_i - r_j)$. This implies we are summing evidence. If annotator groups are distinct, we are summing $\sum_{k \in Group1} + \sum_{m \in Group2}$. This is a weighted sum where weights are sample counts. Harsanyi's weights are *normative*, not *sample size*. This is a key confusion to highlight.

