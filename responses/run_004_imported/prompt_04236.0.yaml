answer: |-
  You are definitely not overreading this. In fact, you have put your finger on one of the most significant debates in modern Newton scholarship.

  Your friend is reading the "public face" of Newton—the Royal Society President, the cautious natural philosopher who claims to derive everything from phenomena. You are reading the "private Newton"—the devout, heterodox theologian who spent more time writing about prophecy and church history than he did about physics.

  Historians of Newton's theology (like Richard Westfall, Stephen Snobelen, and Rob Iliffe) largely agree with your assessment: **this passage is not neutral natural theology; it is coded anti-Trinitarian metaphysics.**

  Here is why your intuition about "dominion" vs. "essence" is spot on, and why that linguistic argument is doing heavy doctrinal lifting.

  ### 1. Dominion vs. Essence (The Arian Code)
  The core of the Trinitarian orthodoxy of Newton's day (and ours) is that God is defined by **essence** (*ousia*). The Father, Son, and Holy Spirit are one God because they share the same divine substance. Being God is an ontological state, not a job description.

  Newton rejects this. By defining God through **dominion** (*Dominium*), he shifts the definition from *what God is* to *what God does* (specifically, rules).
  *   **The Implication:** If Godhood is defined by authority rather than substance, authority can be delegated.
  *   **The Doctrinal Work:** This allows Newton to maintain that Jesus Christ is divine (he has dominion given to him by the Father) without him being *co-equal* or *co-eternal* with the Father. The Father has "Supreme Dominion" (underived); the Son has "Derived Dominion."
  *   **Your Point on Degrees:** You are exactly right. When Newton writes, *"a true, supreme, or imaginary dominion makes a true, supreme, or imaginary God,"* he is creating ontological space for a hierarchy of divine beings. In Trinitarianism, there are no "degrees" of Godhood; you either share the substance or you don't. In Newton's subordinationist view, the Father is the "Supreme God," and the Son is a "true God" (because he has true dominion), but not the Supreme one.

  ### 2. The Linguistic Argument ("My God" vs. "My Eternal")
  You asked why bother with the word-usage argument if the point was purely empirical. The answer is that Newton is attacking Scholastic metaphysics.

  The standard philosophical definition of God in the 17th century (influenced by Aquinas and Descartes) was *Ens Necessarium* (Necessary Being) or *Ens Perfectissimum* (Most Perfect Being). These are absolute attributes.
  *   **Newton's Move:** He argues that "God" (*Deus*) is a **relative term**, like "King" or "Master." You cannot be a king without subjects; you cannot be God without servants.
  *   **Why?** If God is defined by "Eternity" or "Infinity," the Son can share those attributes with the Father (as Trinitarians claim). But if God is defined by "Lordship," there can only be one Supreme Lord.
  *   **The "My God" Proof:** By pointing out that we say "My God" but not "My Eternal," he is arguing that scripture and language treat God as a person in a relationship of authority, not an abstract metaphysical principle. This undermines the philosophical theology used to defend the Trinity and replaces it with a biblical, voluntarist theology where God is defined by His will and power over creation.

  ### 3. "Hypotheses Non Fingo" vs. Theological Agenda
  Your friend argues this is consistent with his "no hypotheses" stance. This is the trickiest part.
  *   **In Physics:** Newton refused to hypothesize the *cause* of gravity (action at a distance) because he couldn't deduce it from phenomena.
  *   **In Theology:** Newton believed the "frame of the system" (the solar system, the stability of orbits) *was* the phenomenon that proved God's dominion.
  *   **The Catch:** The *interpretation* of that phenomenon relies on his specific definition of God. He isn't inducing the concept of "Dominion" from the planets; he is bringing the concept of "Dominion" to the planets to explain them.

  He is effectively saying: *"The universe looks like a kingdom. Therefore, the ruler must be a King (Lord), not just a Soul or a Substance."* This isn't pure induction; it's a theological filter. He is ruling out Pantheism ("soul of the world") and Trinitarianism (shared essence) by definition before he even starts the physics.

  ### 4. Why the Secrecy?
  If this is so clearly anti-Trinitarian, why didn't he just say it?
  *   **Legal Risk:** In early 18th-century England, denying the Trinity was heresy punishable by law (you could lose your job, your position at Cambridge, and your social standing).
  *   **The Boyle Lectures:** The *General Scholium* was added in 1713, partly in response to the Boyle Lectures, which were designed to combat atheism but also to police orthodoxy.
  *   **Coding:** Newton was a master of "esoteric" writing. He believed the true ancient theology (the *prisca sapientia*) had been corrupted by the Church. He wrote in a way that the "wise" (who knew the scriptures as he did) would understand, while the orthodox could read it as generic monotheism.

  ### Verdict
  You win the argument, but your friend isn't entirely wrong about the *spirit*. Newton did believe he was being scientific. He believed that the corruption of theology (like the Trinity) was a result of bad metaphysics (Greek philosophy contaminating Scripture). He thought that by defining God strictly through "Dominion" and "Will" (observable in the design of the universe), he was cleansing theology of "hypotheses" just as he cleansed physics.

  However, your reading is the deeper one: **Grounding deity in dominion is not a neutral empirical move; it is a specific theological weapon.** It dismantles the Trinity by making Godhood a function of authority rather than being, allowing Newton to worship the Father as the only Supreme God while respecting the Son as a divine vice-regent.

  You aren't overreading; you're reading the text the way Newton intended the "initiated" to read it.
