prompt: |-
  So I'm a novelist, but I got roped into doing an onstage interview at a little books-and-ideas festival next month -- they're pairing novelists with philosophers for a strand called 'Character,' and my guest has spent her career defending virtue ethics against the situationist critique (the Milgram/Asch/Darley-and-Batson stuff that supposedly proves stable character traits are basically a myth). I really dont want this to turn into her just restating 'virtue is an acquired disposition' while I nod along in front of a room of writers. Can you draft me 8-10 questions that actually press on this? I want at least one built around the Good Samaritan seminary study specifically (too perfect not to use on that crowd), one on whether retreating to 'local' traits just quietly concedes the situationists point, and one on whether Aristotle's phronimos was ever meant to describe most people or was always meant as a rare ideal. For each, give me a likely follow-up depending on which way she dodges.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **User:** Novelist attending a books-and-ideas festival.
      *   **Context:** Onstage interview, strand called 'Character.'
      *   **Guest:** Philosopher specializing in virtue ethics, specifically defending it against the situationist critique (Milgram, Asch, Darley & Batson).
      *   **Goal:** Avoid a dry restatement of "virtue is an acquired disposition." Wants pressing, engaging questions suitable for a writerly audience.
      *   **Requirements:** 8-10 questions.
      *   **Specific Inclusions:**
          *   One on the Good Samaritan seminary study (Darley & Batson).
          *   One on "local traits" vs. conceding to situationism.
          *   One on Aristotle's *phronimos* (rare ideal vs. common potential).
      *   **Format:** Each question needs a likely follow-up based on how she might dodge.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Virtue Ethics (Aristotelian):* Character consists of stable, global traits (honesty, courage) that predict behavior across situations.
      *   *Situationism (Doris, Harman, etc.):* Empirical psychology shows behavior is driven more by situational factors than internal traits. People aren't consistently honest or courageous.
      *   *The Guest's Position:* Defending virtue ethics against this. Likely strategies:
          *   Traits exist but are rare (the *phronimos*).
          *   Traits are "local" not "global."
          *   Traits are sensitive to situations (not blind robots).
          *   The experiments don't measure *real* virtue, just habits.

  3.  **Brainstorming Angles for a Novelist:**
      *   Novelists care about *character development*, *consistency*, *surprise*, and *motivation*.
      *   If situationism is true, are novels lying? Do we write "global traits" that don't exist?
      *   If virtue ethics is true, why do we love characters who break type?
      *   How does this affect moral responsibility in fiction?
      *   The tension between *being* good and *doing* good.

  4.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Good Samaritan Study.*
          *   *Context:* Seminary students told to give a talk. Some told they're late, some not. Those in a hurry stepped over a slumped man.
          *   *Draft:* What about the seminary study? They were religious but didn't stop.
          *   *Refinement:* Make it sharper. They were literally on their way to talk about the Good Samaritan.
          *   *Follow-up:* If she says "they weren't virtuous yet," ask when virtue kicks in.

      *   *Requirement 2: Local Traits.*
          *   *Context:* Situationists say global traits don't exist. Virtue ethicists sometimes retreat to "honesty-at-work" vs "honesty-at-home."
          *   *Draft:* Isn't saying traits are local just giving up?
          *   *Refinement:* Frame it as a fragmentation of the self. Does this kill the idea of a unified character?
          *   *Follow-up:* If she says "unity is overrated," ask about moral integrity.

      *   *Requirement 3: The Phronimos.*
          *   *Context:* Aristotle's person of practical wisdom.
          *   *Draft:* Was Aristotle talking about normal people?
          *   *Refinement:* Is the *phronimos* a realistic goal or a saint? If it's rare, is virtue ethics useless for the masses?
          *   *Follow-up:* If she says "it's a goal," ask about the 99% who fail.

      *   *Additional Questions (Aiming for 8-10 total):*
          *   *Fiction's Lie:* Do novels reinforce a false psychology?
          *   *Surprise:* If character is stable, is plot twist betrayal unrealistic?
          *   *Development:* How long does it take? (Novels cover years, experiments cover minutes).
          *   *Self-Knowledge:* Can we know our own traits? (Unreliable narrators).
          *   *Luck:* Moral luck. If situation is king, is virtue just luck?
          *   *The "Bad" Guy:* Do villains have virtues? (Situationist view of banality of evil).
          *   *Reader Judgment:* How should we judge characters if situations control them?

  5.  **Refining and Polishing:**
      *   Ensure the tone is respectful but probing (it's an interview, not a debate, but needs teeth).
      *   Make sure the "Novelist" perspective shines through.
      *   Check the follow-ups: They need to prevent her from slipping into jargon.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* hostile. The goal is a good conversation, not a takedown. The follow-ups should invite deeper nuance, not just trap her.
      *   *Check:* Did I hit the specific 3 required topics? Yes.
      *   *Check:* Are there 8-10 questions? I need to count.
      *   *Check:* Are the follow-ups specific?

  6.  **Final Review against constraints:**
      *   8-10 questions.
      *   Specific topics included.
      *   Follow-ups included.
      *   Tone appropriate for a festival stage.

      *Let's flesh out the specific wording.*
      *   Q1 (Good Samaritan): Focus on the irony.
      *   Q2 (Local Traits): Focus on fragmentation.
      *   Q3 (Phronimos): Focus on accessibility.
      *   Q4 (Fiction's Psychology): Do we lie to readers?
      *   Q5 (Moral Luck): If I'm not put in a crisis, am I virtuous?
      *   Q6 (Time Scale): Experiments are minutes, novels are lifetimes.
      *   Q7 (Unreliable Narrator): Self-knowledge of traits.
      *   Q8 (The Villain): Situationism and evil.
      *   Q9 (Reader Empathy): Judging characters.
      *   Q10 (Hope): Why does this matter?

      *Wait, I need to make sure the follow-ups are distinct.*
      *   Okay, I will structure the output clearly with the Question and then "If she pivots to X, ask Y."

  7.  **Final Polish:** Ensure the distinction between "global" and "local" traits is clear in the prompt for the user. Ensure the Milgram/Asch references are accurate enough for the context. (The prompt mentions them, I should focus on the implications).

      *Let's write it.*
      *   *Intro:* Acknowledge the user's position.
      *   *The Questions:* Numbered 1-10.
      *   *Outro:* Brief advice on delivery.

      *(Self-Correction on Q2)*: Make sure the "conceding the point" angle is clear. If traits are hyper-specific, they aren't "character" in the literary sense.
      *(Self-Correction on Q3)*: Make sure the "elite vs. everyone" tension is clear.

      *Okay, ready to generate.*
answer: |-
  This is a fantastic setup. The tension between the novelist's need for coherent character and the situationist's claim that coherence is an illusion is rich ground. Your guest is likely going to try to "save" virtue ethics by refining definitions (e.g., "traits are sensitive to context," or "virtue is a long-term project"). Your job is to keep pulling the thread back to the *human experience* of character, which is what your audience cares about.

  Here are 10 questions designed to prevent a lecture, including your three specific requirements.

  ### 1. The Good Samaritan (Darley & Batson)
  "In the famous seminary study, students on their way to give a talk about the Good Samaritan stepped over a slumped man in an alleyway simply because they were told they were running late. It's the ultimate irony: the *idea* of virtue was active in their minds, but the *situation* overrode it. If a person can be primed with the concept of compassion and still fail to act compassionately five minutes later, isn't that evidence that 'character' is just a story we tell ourselves after the fact?"

  *   **If she says:** "They didn't possess the *true* virtue yet; it takes years to acquire."
      *   **Follow-up:** "So virtue is essentially an expert skill, like playing the violin? Then for the 99% of us who aren't virtuosos, is 'character' just a placebo?"
  *   **If she says:** "The situation mattered, but a virtuous person would have prioritized differently."
      *   **Follow-up:** "But the study suggests the prioritization was dictated by the hurry, not the person. If the situation dictates the priority, where is the 'agent' in the action?"

  ### 2. The "Local Traits" Retreat
  "Philosophers defending virtue ethics sometimes respond to situationism by saying traits aren't 'global' (honest everywhere) but 'local' (honest-at-work, honest-with-spouse). But as a novelist, if I write a character who is brave in war but a coward at home, I'm not writing a person with a modified trait; I'm writing a fragmented self. Doesn't retreating to 'local traits' quietly concede the situationist point that there is no unified 'character' to speak of?"

  *   **If she says:** "Unity is a modern myth; Aristotle knew we are complex."
      *   **Follow-up:** "If we aren't unified, how do we hold people morally responsible? Do we punish the 'work-self' for the crimes of the 'home-self'?"
  *   **If she says:** "Local traits are still stable dispositions."
      *   **Follow-up:** "Stable within a very narrow context, though. If the context shifts slightly, does the trait vanish? At what point does 'local' become so specific it's no longer a trait, just a reflex?"

  ### 3. The *Phronimos* (Aristotle's Ideal)
  "Aristotle's *phronimos*—the person of practical wisdom—is the benchmark for virtue. But looking at the empirical data, consistent moral excellence seems incredibly rare. Was Aristotle describing a realistic potential for human beings, or was he describing a moral saint? If the *phronimos* is an outlier, is virtue ethics a theory for how to live, or just a biography of the few who got it right?"

  *   **If she says:** "It's a regulative ideal; we aim for it."
      *   **Follow-up:** "Aim is one thing, but if the data says most of us structurally can't hit it, is it ethical to build a moral system on an outlier?"
  *   **If she says:** "Most people are more virtuous than the experiments suggest."
      *   **Follow-up:** "Then why do the experiments predict behavior better than personality tests do? Are we overestimating ourselves because we're the narrators of our own lives?"

  ### 4. The Novelist's Lie
  "As novelists, we are trained to write consistent characters. If a character acts 'out of character,' we need a plot reason for it. But if situationism is right, 'acting out of character' is actually the norm, and consistency is the lie. Am I, in trying to write coherent people, reinforcing a false psychology to my readers?"

  *   **If she says:** "Fiction isn't psychology; it's about meaning."
      *   **Follow-up:** "But it shapes how we understand real people. If we train readers to expect consistency, do we make them less empathetic when real humans behave unpredictably?"
  *   **If she says:** "Good writers show the tension between trait and situation."
      *   **Follow-up:** "So the 'character' isn't the person, but the *struggle* between the person and the context? Is that where virtue actually lives?"

  ### 5. Moral Luck and Opportunity
  "Situationism suggests that often, being 'good' is just a matter of not being tested. I might be 'honest' simply because no one has offered me a million dollars to lie yet. If virtue requires passing tests, and life distributes tests randomly, isn't virtue just a form of moral luck? How can it be an ethical duty to be virtuous if the opportunity is a lottery?"

  *   **If she says:** "Virtue is about intention, not just outcome."
      *   **Follow-up:** "But the situationists argue intention is fragile. If I intend to be brave but the situation panics me, did I have the virtue?"
  *   **If she says:** "We create opportunities for virtue."
      *   **Follow-up:** "Can we? Or do we just curate situations where we know we won't fail? Is avoiding temptation the same as having virtue?"

  ### 6. Time Scales (Minutes vs. Lifetimes)
  "Psychology experiments happen in minutes. Novels happen over years. A situationist might say, 'See, the subject lied when pressured.' But a virtue ethicist might say, 'That's a snapshot, not the whole life.' Is the disagreement simply about the time scale? Can you fail a situationist test but still pass the Aristotelian life?"

  *   **If she says:** "Yes, virtue is a lifelong narrative."
      *   **Follow-up:** "Then is virtue empirically unfalsifiable? If I can explain away every failure as a 'blip' in a long narrative, am I protecting the theory from evidence?"
  *   **If she says:** "No, stable traits should show up in snapshots."
      *   **Follow-up:** "Then why doesn't the data show them? Are we measuring the wrong things?"

  ### 7. Self-Knowledge and the Unreliable Narrator
  "One of the situationist findings is that we are terrible at predicting our own behavior. We think we'd help, but we don't. If we lack self-knowledge about our own character, how can we cultivate virtue? Can you train for a trait you don't know you lack?"

  *   **If she says:** "We need friends/mentors to mirror us."
      *   **Follow-up:** "But they are subject to the same situational pressures. Is blind leading the blind, or is community the only buffer against the situation?"
  *   **If she says:** "Reflection helps us learn from failures."
      *   **Follow-up:** "Or does reflection just help us write better excuses? How do we distinguish moral growth from better rationalization?"

  ### 8. The Banality of Evil vs. The Banality of Good
  "Milgram showed ordinary people administering shocks. But aren't there also studies where ordinary people help strangers in crises? If situationism makes us all potential torturers, does it also make us all potential saints? Is 'character' just which situational triggers we happen to encounter?"

  *   **If she says:** "Yes, we are all capable of both."
      *   **Follow-up:** "Then 'character' isn't a noun, it's a verb. It's not what we *have*, it's what we *do* in the moment. Does that destroy the idea of a moral identity?"
  *   **If she says:** "Virtue makes you resistant to the negative triggers."
      *   **Follow-up:** "Resistant, or immune? The data suggests no one is immune. Is 'resistance' just a slower collapse?"

  ### 9. Judging Literary Characters
  "If I bring this back to my audience: When we judge a literary character, we usually judge their heart. If situationism is true, should we stop judging the 'heart' and start judging the 'context'? Should we be less impressed by the hero who saves the day if the situation made it easy, and less harsh on the villain if the situation was coercive?"

  *   **If she says:** "We should judge the effort to manage the situation."
      *   **Follow-up:** "But isn't managing your situation a privilege? Some people are born in situations that are unmanageable. Is virtue an elitist concept?"
  *   **If she says:** "We judge the action, not the person."
      *   **Follow-up:** "But fiction asks us to love or hate the *person*. If we separate the two, does the story lose its emotional stakes?"

  ### 10. The "So What?" (Closing)
  "Finally, if the situationists are partially right—that context is king—what is the practical use of virtue ethics for a writer or a reader? If I can't trust my own character to hold up under pressure, why bother trying to build it? Why not just focus on engineering better situations?"

  *   **If she says:** "Because we *are* the situation for others."
      *   **Follow-up:** "So my virtue is just environmental design for other people? That's a humble, but lonely, definition of goodness."
  *   **If she says:** "Because it gives us a language to aspire."
      *   **Follow-up:** "Even if the aspiration is statistically unlikely? Is hope enough of a reason to believe in character?"

  ### Advice for the Stage
  *   **The "Nod" Trap:** If she starts defining terms (e.g., "Well, first we must define *hexis*..."), interrupt gently with, "Let me stop you there, because for a writer, that definition feels like..."
  *   **Use the Audience:** If she gets too abstract, pivot with, "How does this land for the writers in the room who are trying to build people out of ink?"
  *   **Validate Before Pressing:** She is the expert. Acknowledge her defense ("I know you argue that...") before hitting her with the counter ("...but doesn't the data suggest..."). This keeps it collaborative rather than combative.
