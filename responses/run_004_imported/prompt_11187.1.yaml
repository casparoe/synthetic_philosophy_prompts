answer: |-
  # The Time of Money: Ergodicity, Utility, and the Kelly Verdict

  The debate over the Kelly criterion is not merely a technical dispute about portfolio sizing; it is a collision between two fundamentally different ways of viewing reality. On one side stands the edifice of neoclassical economics, represented by Paul Samuelson, which treats decision-making as a choice among subjective preferences in a landscape of parallel possibilities. On the other stands the physics of survival, championed by Ed Thorp and revitalized by Ole Peters, which treats decision-making as a trajectory through time in a world where ruin is permanent.

  To understand whether maximizing the expected logarithm of wealth ($E[\log W]$) is "THE rational way" to bet, we must strip away the financial jargon and examine the ontology of the bet itself. Is wealth a number to be optimized across a cloud of possible worlds, or is it a fuel tank that must last a specific journey?

  ### The Samuelson Objection: The Fallacy of the Long Run

  Paul Samuelson's attack on the Kelly criterion was scathing because it targeted the philosophical core of the argument, not just the math. In standard expected-utility theory (von Neumann-Morgenstern), rationality is defined as consistency with a set of axioms. If an agent prefers $A$ to $B$, and $B$ to $C$, they must prefer $A$ to $C$. Within this framework, utility functions are subjective. An agent might prefer to maximize expected wealth ($E[W]$), expected square root of wealth ($E[\sqrt{W}]$), or expected log wealth ($E[\log W]$). None is inherently more "rational" than the other; they simply reflect different risk tolerances.

  Samuelson's 1979 paper, *Why We Should Not Make Mean Log of Wealth Big Though Years to Act Are Long*, dismantled the Kelly proponents' favorite justification: the "long-run dominance" argument. Kelly advocates argue that as the number of bets ($N$) approaches infinity, the strategy maximizing geometric growth will almost surely outperform any other strategy. Samuelson pointed out the obvious: **$N$ never reaches infinity.**

  For Samuelson, the "long run" is a misleading abstraction. We do not live in the limit; we live in a sequence of finite periods. If an investor has a CRRA (Constant Relative Risk Aversion) utility function with a coefficient different from 1, maximizing log wealth is mathematically suboptimal for their specific goals. By forcing log utility, Kelly imposes a specific risk preference (risk aversion coefficient of 1) on everyone. Samuelson mocked this as a "fallacy of large numbers." Just because a strategy wins in the limit doesn't mean it helps a mortal with a finite horizon and specific consumption needs. To Samuelson, calling Kelly "rational" was like saying it is rational to eat only kale because it maximizes lifespan; it ignores the utility of the cake you didn't eat.

  ### The Ergodicity Defense: Physics Over Preference

  Decades later, Ole Peters and the ergodicity economics movement reframed the debate entirely. They argued that Samuelson's critique relies on a hidden, flawed assumption: that the "expected value" calculated in economics (the ensemble average) is relevant to an individual living through time (the time average).

  Consider a simple multiplicative bet: flip a coin. Heads, wealth increases by 50%; tails, wealth decreases by 40%.
  *   **Ensemble Average:** If 100 people take this bet once, the average wealth increases. The expected value is positive.
  *   **Time Average:** If one person takes this bet 100 times, the volatility drag compounds. $(1.5 \times 0.6) = 0.9$. You lose 10% of your wealth every two flips on average. You go to zero.

  Standard economics looks at the ensemble average and says the bet is good. Ergodicity economics looks at the time average and says the bet is ruinous. In non-ergodic systems (where the time average does not equal the ensemble average), maximizing the ensemble expected value is physically dangerous.

  Peters' crucial insight is that maximizing the time-average growth rate of wealth *mathematically equates* to maximizing the expected logarithm of wealth. This flips the script on Samuelson. In the Kelly framework, $\log$ utility is a *preference*. In the ergodicity framework, $\log$ utility is a *consequence* of the dynamics. You don't choose to maximize $E[\log W]$ because you love logarithms; you choose it because it is the only function that aligns your personal trajectory with the growth rate of the system.

  From this view, Samuelson's "subjective utility" is a luxury of ergodic systems (where ruin isn't possible). In the real world of multiplicative finance, ruin is an absorbing barrier. Once you hit zero, you stop playing. The ergodicity argument posits that growth-rate maximization isn't one utility function among many; it is the objective requirement for remaining an agent in the game.

  ### The Verdict: A Conditional Absolution

  So, who is right? The verdict requires separating the *mechanics of wealth* from the *psychology of the agent*.

  **Samuelson is wrong about the math, but right about the life.**
  Samuelson's critique fails on the theoretical grounds of dynamics. He treats the ensemble average as a valid proxy for individual experience. Peters has demonstrated that in multiplicative, non-ergodic environments, the ensemble average is a fiction for the individual. If your goal is to maximize the wealth you actually hold at the end of a long sequence, the Kelly criterion is not a "preference"; it is the mathematical solution to the optimization problem of time-averaged growth. Samuelson's claim that Kelly is "just one utility function" collapses when you recognize that the system itself imposes a logarithmic penalty on volatility via compounding. To ignore Kelly in a repeated multiplicative game is to ignore the physics of compounding.

  **However, Peters is wrong about the objective.**
  The ergodicity defense assumes the agent's only goal is to maximize the size of the pot at the end of time. But humans are not immortal capital accumulation machines. We consume. We suffer from drawdowns. We have liabilities. Samuelson's insistence on subjective utility captures the reality that wealth is a means to consumption and well-being, not an end in itself. If maximizing geometric growth requires enduring a 90% drawdown that causes you a heart attack or forces you to liquidate at the bottom to pay for surgery, then the "objectively correct" growth strategy is subjectively disastrous.

  **The Synthesis:**
  The Kelly criterion is **uniquely rational** if and only if the following three conditions are met:
  1.  **Multiplicative Dynamics:** The returns compound on the current capital (reinvestment), rather than being additive.
  2.  **No External Cash Flows:** The agent cannot infuse new capital to rescue the portfolio, nor do they need to withdraw capital for consumption during the betting horizon.
  3.  **Survival is the Primary Utility:** The agent values future participation in the game above all else (i.e., the utility of ruin is negative infinity).

  Outside these conditions, Kelly collapses from a "physical law" back into "one utility function among many."

  **The Final Ruling:**
  The ergodicity reframing successfully elevates the Kelly criterion from a heuristic trick to the **instrumentally rational baseline for solvency.** Samuelson was correct that you do not *have* to maximize growth, but he was incorrect to imply that deviating from Kelly is costless. Deviating from Kelly (by overbetting) sacrifices long-term survival for short-term variance; deviating from Kelly (by underbetting) sacrifices growth for safety.

  Therefore, the honest verdict is this: **Maximizing expected log wealth is the only rational strategy for the *capital*, but not necessarily for the *human*.**

  If you view your portfolio as a separate entity designed to persist indefinitely, Kelly is objectively correct. Peters wins this round: the time-average growth rate is a physical property of the market, not a preference. However, because humans are not portfolios—they have finite horizons, consumption needs, and psychological pain thresholds—they are rationally permitted to bet *less* than Kelly (Fractional Kelly). They are never rationally permitted to bet *more*.

  Samuelson thought Kelly was a claim about utility. Thorp and Peters showed it is a claim about survival. You can choose to value survival less than comfort, but you cannot choose to change the math that dictates what survival requires. In that specific, crucial sense, the physicists have won the argument: Logarithmic growth is the price of admission to the long run. Whether you choose to pay it is up to you, but do not mistake your refusal for a refutation of the bill.
