  6.  **Final Polish of the Content:**
      *   *Self-Correction on Part (b):* Some textbooks loosely refer to Independence in the context of SEU, but strictly speaking, Ellsberg violates the Sure Thing Principle (Savage P2). vNM Independence is about mixing lotteries ($pA + (1-p)C \succ pB + (1-p)C$). Ellsberg is about states of the world. The classmate's answer says "independence axiom of von Neumann-Morgenstern". This is definitely technically incorrect. I will mark this down.
