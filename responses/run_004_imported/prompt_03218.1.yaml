answer: |-
  This is exactly the right question to be asking. You have identified the precise pressure point where teleosemantics either earns its keep or collapses into a historically-gilded version of the causal theory. The intuition that the indeterminacy gets "pushed onto the consumer side" is a standard and serious objection (often associated with critics like Fodor, Godfrey-Smith, and Price), but to see if it sticks, we need to look at the specific mechanics of Millikan's **Producer/Consumer** distinction and how **Normal Conditions** are derived from selection history.

  Here is the walkthrough of the mechanics, followed by the critical assessment you asked for.

  ### 1. The Mechanics: How the "Consumer" Move Blocks the Disjunction

  In causal/informational theories, content is determined by the **Producer** (the detector). If the detector fires for flies, BBs, and shadows, the content is the disjunction `Fly v BB v Shadow`. Teleosemantics shifts the locus of content determination to the **Consumer** (the system that uses the signal).

  Here is the step-by-step mechanical resolution of the frog case:

  **A. The Division of Labor**
  *   **Producer System:** The frog's visual retina/optic tectum. Its job is to produce a neural signal ($N$) when specific distal conditions obtain.
  *   **Consumer System:** The frog's tongue-snapping motor apparatus. Its job is to use $N$ to initiate a snap.

  **B. Defining "Normal Function" (Etiological)**
  Millikan defines the function of the Consumer System not by what it *does*, but by what it was *selected to do*.
  *   *Question:* What did the snapping mechanism do in the past that allowed it to be selected?
  *   *Answer:* It caught **flies** (specifically, nutritious, moving insects). It did *not* catch BB pellets, because BB pellets did not exist in the frog's evolutionary environment (Environment of Evolutionary Adaptedness, or EEA).

  **C. The "Normal Conditions" Constraint**
  This is the crux. A representation $N$ has the content $C$ if $C$ is the state of affairs that must obtain for the Consumer System to perform its **Normal Function** under **Normal Conditions**.
  *   **Normal Conditions** are not "statistical averages." They are the conditions that prevailed during the selection history of the trait.
  *   In the selection history, whenever $N$ was produced, a **Fly** was present.
  *   In the selection history, whenever the Consumer snapped in response to $N$, it ingested **Nutrition**.

  **D. Resolving the Disjunction (Fly vs. Speck vs. Food)**
  You asked: Why "Fly" and not "Small Dark Speck" or "Nutritious Thing"?

  1.  **Against "Small Dark Speck":**
      If the content were "Small Dark Speck," the Consumer's function would be satisfied by snapping at a BB. But snapping at a BB does *not* fulfill the Consumer's Normal Function (ingesting nutrition/survival). The Consumer system was selected *because* it secured nutrition, not because it moved muscle fibers. Therefore, a BB is a **false** representation. The content cannot be "Speck" because "Speck" does not guarantee the satisfaction of the Consumer's Normal Function under Normal Conditions.

  2.  **Against "Nutritious Thing" (The Distality Problem):**
      This is the harder version of your worry. Why isn't the content "Nutritious Thing"? After all, that's the ultimate fitness payoff.
      Millikan's answer relies on the **mapping rule**. The Consumer system doesn't just need *any* nutrition; it needs to coordinate with the Producer system. The Producer system was selected to correlate with *Flies*.
      *   If the content were "Nutritious Thing," the Producer would be required to track *all* nutritious things (worms, bits of meat, etc.). But the Producer *doesn't* do that; it only tracks fly-like motion.
      *   Therefore, the specific correspondence rule established by selection is between the Neural Signal and the **Fly**. The Consumer expects a Fly. If a Worm appears, the frog might eat it, but strictly speaking, on Millikan's view, the representation might be *false* (or at least, the system is operating outside its specific Normal Conditions) because the Producer was not selected to track worms.
      *   *Correction/Nuance:* Millikan allows for some generality, but the content is fixed by the **specific correlation** that explained the survival. If the survival depended on distinguishing flies from non-flies (even if imperfectly), the content is "Fly." If the survival depended merely on "ingesting protein" and the frog ate anything moving, the content would be broader. The granularity of the content is fixed by the **discriminative capacity** of the Producer that was relevant to the Consumer's success in the EEA.

  **E. The BB Pellet Verdict**
  When the frog snaps at a BB:
  *   The Producer is functioning (it's doing what it was selected to do: fire at fly-like stimuli).
  *   The Consumer is functioning (it's doing what it was selected to do: snap at $N$).
  *   **But:** The condition required for the Consumer's success (a Fly/Nutritious Insect) is absent.
  *   **Result:** The representation is **False**.
  *   **Why this solves indeterminacy:** Causal theories cannot call the BB case "false" because the BB *caused* the signal. Teleosemantics calls it "false" because the BB violates the **Normal Conditions** required for the Consumer's historical success.

  ---

  ### 2. The Honest Take: Resolution or Can-Kicking?

  You asked for my honest take on whether this pins down determinate content or kicks the can. The consensus in contemporary philosophy of mind is mixed, but leans toward: **It solves the logical problem of falsehood, but inherits a descriptive indeterminacy regarding the selection history.**

  Here is the breakdown of why your suspicion is well-founded.

  **1. The Success: Breaking the Causal Lock**
  Millikan *does* solve the specific problem that plagued Fodor's asymmetric dependence and Dretske's informational semantics. She successfully naturalizes **misrepresentation**.
  *   In causal theories, if $X$ causes $M$, $M$ represents $X$. If BBs cause $M$, $M$ represents BBs. Falsehood is impossible.
  *   In teleosemantics, BBs can cause $M$, but $M$ represents Flies. Falsehood is possible.
  *   **Verdict:** On the specific metric of "allowing for error without collapsing content," the move works. It successfully shifts the burden from "what caused this?" to "what is this supposed to do?"

  **2. The Failure: The Indeterminacy of "Selected Effect"**
  Your worry that the indeterminacy is pushed to the consumer side is correct, but it's deeper: it's pushed to the **description of the selection history**.
  *   **The Problem:** Selection history is a physical fact, but *describing* that fact requires a level of abstraction.
  *   **Example:** Did the ancestor frog survive because it caught **Flies**? Or because it ingested **Protein**? Or because it expended **Calories** efficiently? Or because it snapped at **3mm moving objects**?
  *   All of these descriptions are *true* of the history. The frog caught flies (which were protein) by snapping at 3mm objects.
  *   **The Can-Kicking:** Millikan says content is determined by the "Normal Function." But the Normal Function is only determinate if the *description of the selected effect* is determinate. If evolutionary biology cannot tell us whether the trait was selected for "Fly-Catching" vs. "Protein-Ingesting" vs. "Motion-Snapping," then teleosemantics cannot tell us whether the content is `Fly`, `Food`, or `Moving Speck`.
  *   **Critique:** Many argue that natural selection does not carve the world at the joints of our semantic categories. Selection acts on phenotypes, not contents. To say the function is "Fly-Catching" imports the very semantic indeterminacy we were trying to solve.

  **3. The "Consumer Opacity" Objection**
  You noted the worry that the problem is pushed to the consumer. Here is the specific mechanical failure point:
  *   The Consumer system (the motor) receives signal $N$. It snaps.
  *   Mechanically, the motor does not "know" if it caught a fly or a BB. It just fires.
  *   Millikan says the content is fixed by what the Consumer *needs* to be true to succeed.
  *   **Objection:** If the motor fires identically for Flies and BBs, in what physical sense is it "designed" for Flies specifically, other than by the historical stipulation that only Flies were present?
  *   If we discovered that ancestral frogs *did* eat BB-like mineral pellets that were nutritious, the content would instantly shift to "Speck." This suggests the content isn't fixed by the *current* system's mechanics, but entirely by an external historical narrative. This makes content **extrinsic** to the current cognitive architecture in a way that feels unintuitive to many (the "Swampman" intuition, though that's a separate argument).

  **4. Neander's Refinement (Success Semantics)**
  Karen Neander tried to tighten this by arguing that the content is the condition that would make the action **successful**.
  *   If the content is `Fly`, success = eating a fly.
  *   If the content is `Speck`, success = hitting a speck.
  *   Since hitting a BB is *not* biologically successful (no nutrition), the content must be `Fly` (or `Food`).
  *   **Counter:** But what if the frog *could* digest BBs? Then `Speck` becomes a viable content. This shows the content is contingent on physiological facts about digestion, not just the representation. This leads to the worry that teleosemantics makes content depend on facts (digestion) that the cognitive system doesn't access.

  ### Summary Assessment

  **Does it solve the disjunction problem?**
  *   **Logically:** Yes. It provides a formal mechanism (Normal Conditions/Consumer Function) to distinguish between $X$ (the content) and $Y$ (the error-causer), even if $X$ and $Y$ cause the same signal.
  *   **Metaphysically:** Debatable. It relies on the assumption that there is a single, determinate fact of the matter about "what a trait was selected for." If evolutionary functions are themselves indeterminate or description-relative (as some philosophers of biology argue), then teleosemantic content inherits that indeterminacy.

  **Is it just kicking the can?**
  It's not *just* kicking the can, because it moves the can from a place where it was impossible to move (causal covariance) to a place where it *might* be movable (etiological function).
  *   **The Shift:** It moves the problem from "How do we distinguish cause from correlation?" to "How do we individuate biological functions?"
  *   **The Verdict:** Most working naturalists accept this trade. They believe biology *can* individuate functions (e.g., the heart is for pumping, not making noise). If you accept that biological functions are objective, Millikan's move works. If you think biological functions are observer-relative descriptions, then teleosemantics fails to naturalize content—it just reduces content to biological description, which is equally indeterminate.

  **Seminar Advice:**
  If you want to press this in seminar, ask about the **"Grain Problem"** (or Distality Problem). Ask: *"Millikan fixes content via the conditions required for the Consumer's Normal Function. But the Consumer's survival depends on a chain: Fly -> Retina -> Signal -> Snap -> Digestion. Why does the content stop at 'Fly' and not 'Retinal Stimulation' (too proximal) or 'Caloric Intake' (too distal)? What mechanism in the theory selects the 'Fly' level of granularity specifically, other than our intuitive stipulation?"*

  That question forces them to admit whether the theory relies on biological facts alone or requires semantic intuition to bootstrap the biology.
