prompt: |-
  So I'm auditing a phil of mind seminar this semester and we just spent two weeks on teleosemantics (Millikan, Neander, Papineau) as a way of naturalizing mental content, and I think I've got the basic pitch down -- a frog's snapping response represents "fly" because eating flies is what that mechanism was selected for, back in the evolutionary day. What I'm stuck on is how this is actually supposed to solve the disjunction/indeterminacy problem that plagues causal and informational theories of content. Like, why is the selected-for content "fly" rather than "small dark moving speck" or even "nutritious ingestible thing," given that all of those properties were equally present (and equally responsible for the trait's fitness payoff) throughout the relevant selection history -- frogs snap at BB pellets too, after all, so it's not like the mechanism is even tracking flies-as-such.

  Everyone in seminar kept citing Millikan as having basically solved this with her notion of "Normal explanations" and consumer-based content, but when I went back to the reading I honestly couldn't tell if the indeterminacy actually gets resolved there or just gets relabeled and pushed onto the consumer side of the system instead of the detector side. Can you walk me through how the standard teleosemantic move is supposed to work here (something about which "level" of function is the relevant Normal explanation?), and then give me your honest take on whether it actually pins down a determinate content or just kicks the can down the road. Not looking for the wikipedia-level summary of what teleosemantics is btw, more the actual mechanics of how the normal-conditions move is meant to block the disjunction in a case like this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Auditing a Philosophy of Mind seminar.
      *   **Topic:** Teleosemantics (Millikan, Neander, Papineau) as a naturalization of mental content.
      *   **Current Understanding:** Grasps the basic pitch (selected-for function determines content, e.g., frog snap = fly).
      *   **The Problem:** The Disjunction/Indeterminacy Problem (Why "fly" and not "small dark moving speck" or "nutritious thing"? Frogs snap at BBs, so it's not tracking flies *per se*).
      *   **Specific Confusion:** How Millikan's "Normal Conditions" and "Consumer Systems" actually solve this. Does it resolve it or just push the problem to the consumer side?
      *   **Desired Output:** A walkthrough of the *mechanics* of the teleosemantic solution (specifically regarding Normal explanations/levels of function) and an honest critical assessment of whether it succeeds or just kicks the can.
      *   **Constraint:** No Wikipedia-level summaries. Needs depth and specific mechanics.

  2.  **Deconstruct the Teleosemantic Solution (The "Mechanics"):**
      *   *The Core Issue:* Causal/Informational theories say $M$ represents $X$ if $M$ is caused by $X$. But $M$ is caused by $X$, $Y$, and $Z$ (flies, BBs, shadows). So does $M$ represent $X \lor Y \lor Z$?
      *   *The Teleosemantic Shift:* Content isn't determined by *what causes the signal* (producer), but by *what the signal is supposed to do for the system* (consumer).
      *   *Millikan's Move:*
          1.  **Producer System:** The mechanism that creates the representation (e.g., the frog's visual detector).
          2.  **Consumer System:** The mechanism that uses the representation (e.g., the frog's tongue-snapping motor).
          3.  **Normal Function:** What the consumer system was selected to *do* when it receives the signal.
          4.  **Normal Conditions:** The conditions under which the consumer system successfully performs its function.
      *   *Applying to the Frog:*
          *   Signal: Neural firing $N$.
          *   Producer Function: To produce $N$ when flies are present (roughly).
          *   Consumer Function: To snap tongue to catch food.
          *   *Crucial Step:* Under what conditions does the consumer succeed? It succeeds when there is *nutritious food*. It fails when there is a BB.
          *   *Wait, that's the problem:* If the function is "catch food," then the content is "food." If the function is "snap at speck," the content is "speck." How do we fix the *level*?
          *   *Millikan's Specific Answer:* The content is determined by the *correspondence rule* required for the consumer to perform its *Normal Function*. The Normal Function of the consumer is to catch *flies* (historically). The consumer system was selected because ancestors caught flies. Therefore, the signal must correspond to *flies* for the system to work as designed.
          5.  **The "Mapping" Rule:** The content is the state of affairs that *maps* onto the consumer's successful operation *under Normal Conditions*. Normal Conditions include the presence of flies, not BBs. BBs are *abnormal* conditions.
          *   *Refinement:* It's not just "what makes it work." It's "what historically made the *selection* work." The selection history fixes the *Normal Conditions*. In Normal Conditions, the speck *is* a fly. In abnormal conditions, it's a BB. The content is fixed by the Normal Conditions, not the actual conditions.

  3.  **Address the "Kicking the Can" Critique:**
      *   *The Worry:* Doesn't defining "Normal Conditions" just reintroduce the indeterminacy? Why is the Normal Condition "fly present" and not "nutritious particle present"?
      *   *The Selection History Constraint:* The selection history is specific. Ancestors didn't eat BBs. They ate flies. The fitness payoff came from flies.
      *   *The "Level" Problem:* This is the hardest part. Why isn't the function "ingest protein"? (Too broad). Why isn't it "snap at 3mm dark object"? (Too narrow).
      *   *Millikan's Defense:* The function is defined by the *specific correlation* that explained the survival. If the survival depended on distinguishing flies from non-flies (even if imperfectly), then the content is fly.
      *   *Critique (Fodor, Godfrey-Smith, etc.):*
          *   **The Swampman/History Objection:** (Not relevant here, focus on indeterminacy).
          *   **The Distality Problem:** Why stop at the fly? Why not "insect"? Why not "protein"?
          *   **The Consumer Reliance:** If the consumer just needs *something* to snap at to keep the motor calibrated, maybe the content *is* "snap target."
          *   **Verdict:** It's a sophisticated move, but many argue it relies on a level of description of the "selected effect" that is itself indeterminate.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the suspicion (it's a classic debate).
      *   *Section 1: The Mechanics (Producer/Consumer/Normal Conditions).*
          *   Explain the shift from Producer (causal) to Consumer (use).
          *   Define "Normal Explanation." It's not statistical normality; it's historical/etiological.
          *   Walk through the Frog case specifically.
          *   *Key Distinction:* The content is what the consumer *needs* to be true to perform its function *under Normal Conditions*.
          *   *The BB Pellet:* This is a malfunction or abnormal condition. The representation is *false* when a BB is present because the Normal Condition (fly) is absent.
      *   *Section 2: Solving the Disjunction (The "Level" Issue).*
          *   Address "Small Dark Speck" vs. "Fly" vs. "Food."
          *   Millikan's argument: The selection history privileges the specific correlation. The consumer system was designed to interface with *flies*.
          *   The "Mapping" requirement: The internal map must correspond to the territory *as it was when the map was selected*.
      *   *Section 3: The Honest Assessment (Does it work?).*
          *   *Strengths:* Breaks the causal covariance lock. Allows for falsehood (misrepresentation).
          *   *Weaknesses (The "Can Kicking"):*
              1.  **Indeterminacy of Function:** How do we describe the selected effect? (Protein vs. Fly). This is the "Description Problem."
              2.  **Consumer Opacity:** Does the consumer *know* the difference? If the motor fires the same for BBs, in what sense is the consumer "designed" for flies specifically, other than by historical stipulation?
              3.  **Neander's Refinement:** Mention Neander's "Success Semantics" tweak (content is what *would* make the action successful).
          *   *Conclusion:* It solves the *logical* problem of falsehood (unlike causal theories), but arguably inherits an *ontological/descriptive* indeterminacy regarding the selection history itself.

  5.  **Refining the Tone:**
      *   Keep it seminar-appropriate (technical but clear).
      *   Avoid oversimplifying Millikan (she's dense).
      *   Ensure the distinction between "Producer" and "Consumer" is sharp, as that's the pivot point.
      *   Make sure to address the "BB pellet" case explicitly.

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain *why* "fly" is preferred over "food"?
      *   *Correction:* Need to emphasize that the *consumer's* mechanism is tuned to the *fly* properties in the historical environment. If the consumer could eat anything, content might be "food." But if the consumer *only* digests flies (hypothetically), content is "fly." Actually, Millikan argues the content is determined by the *specific correspondence* required. If the snapping mechanism fails on BBs (no nutrition), then "food" is closer. But if the visual mechanism is tuned to fly-movement, "fly" is closer.
      *   *Wait, nuance:* Millikan actually argues the content is often *very* specific to the historical correlation. But the "Distality Problem" (Price 1998, etc.) suggests teleosemantics struggles to pick the *right* distal object. I need to mention this.
      *   *Refinement on "Normal Conditions":* It's not just "conditions where it works." It's "conditions that obtained during selection." This is crucial. BBs didn't exist during selection. So they are *abnormal*.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Honest Take" is balanced. (Proceed to generate output based on these thoughts).

  *(Self-Correction during final review of the plan)*: I need to be careful not to conflate Millikan and Neander too much. Millikan is the "Consumer + Normal Conditions" view. Neander is more "Success Semantics." The prompt asks specifically about Millikan's "Normal explanations" move. I will focus primarily on Millikan but acknowledge Neander where it clarifies the mechanics.

  Key point to hit hard: The content is determined by the *conditions required for the consumer to perform its Normal function*, where "Normal function" is defined by *history*. The BB case is a case of *falsehood* precisely because the conditions are *abnormal* relative to the history.

