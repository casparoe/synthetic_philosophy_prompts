      *   **Task:** Find strategies surviving IESDS.

  3.  **Evaluate the Student's Answer:**

      *   **Round 1 (Player 2):**
          *   Student claims Z is strictly dominated by X (and Y).
          *   Check P2 payoffs for Z vs X:
              *   Row A: Z=0, X=2 (2 > 0)
              *   Row B: Z=0, X=2 (2 > 0)
              *   Row C: Z=0, X=2 (2 > 0)
          *   Check P2 payoffs for Z vs Y:
              *   Row A: Z=0, Y=2 (2 > 0)
              *   Row B: Z=0, Y=2 (2 > 0)
              *   Row C: Z=0, Y=2 (2 > 0)
          *   *Verdict:* Correct. Z is strictly dominated by X (and Y). Eliminate Z.
          *   *Reduced Game:*
              *   A: (3, 2), (0, 2)
              *   B: (0, 2), (3, 2)
              *   C: (1, 2), (1, 2)

      *   **Round 2 (Player 1):**
          *   Student checks if C is dominated by A or B (pure strategies).
          *   Student claims: "Since no pure strategy dominates C, C survives."
          *   Student claims: "Mixed strategies are what matter for equilibrium refinements... not for a basic dominance comparison like this one, so we don't need to check any mixes here."
          *   *Critical Error:* In IESDS, a strategy can be strictly dominated by a *mixed* strategy even if it is not dominated by any *pure* strategy. This is a standard definition in almost all intermediate/intro game theory courses (e.g., Osborne, Gibbons).
          *   *Check Mixed Strategy for P1:*
              *   Consider a mix of A and B with probability $p$ on A and $(1-p)$ on B.
              *   Payoff against X: $3p + 0(1-p) = 3p$
              *   Payoff against Y: $0p + 3(1-p) = 3 - 3p$
              *   We need this mix to strictly dominate C.
              *   C pays 1 against X and 1 against Y.
              *   Need $3p > 1$ AND $3 - 3p > 1$.
              *   $p > 1/3$ AND $3p < 2 \Rightarrow p < 2/3$.
              *   So, any mix where $1/3 < p < 2/3$ (e.g., $p=0.5$) yields expected payoff 1.5 against X and 1.5 against Y.
              *   Since 1.5 > 1, **C is strictly dominated by a mixed strategy of A and B.**
          *   *Verdict:* C should be eliminated. The student's theoretical justification for ignoring mixed strategies is incorrect in the context of IESDS.

      *   **Round 3 (Player 2):**
          *   Student claims X and Y survive because they give equal payoffs (2) against A, B, C.
