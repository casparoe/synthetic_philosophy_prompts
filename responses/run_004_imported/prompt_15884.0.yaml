answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Two philosophers, ELIAS and SARAH, are grading papers. Elias has been staring at the same page for ten minutes.*

  **Elias:** I'm going to ask you something, and I need you to promise not to give me the "intro to ethics" spiel. I'm having a crisis of confidence about a donation I'm making, and it's stemming from the literature, not my wallet.

  **Sarah:** *(Puts down her red pen)* You know I can't resist a good crisis. Is this about the bonus?

  **Elias:** It is. I decided to go full Effective Altruism on it. But then I went down the rabbit hole on cause prioritization and hit the Cluelessness Objection. Specifically the Lenman version. Now I'm sitting here thinking that buying bednets might inadvertently cause a geopolitical instability in 2080 that kills more people than the malaria ever would. If consequentialism requires me to maximize the good, and I am fundamentally clueless about the long-term causal chains, isn't the rational action to do nothing? Or at least, stop pretending I can calculate "expected value"?

  **Sarah:** Okay, I see where you're stuck. You're worried that the "ripple effects" of any action are so vast and unpredictable that they swamp the foreseeable, near-term consequences.

  **Elias:** Exactly. Lenman's point is that causal chains extend indefinitely. If I save a child today, that child has children, who have children. The population composition of the world changes. The "non-identity" style problems kick in. Since the long-term future is where the vast majority of value presumably lies, and I have zero epistemic access to it, my expected value calculation is essentially noise.

  **Sarah:** This is the classic "Simple Cluelessness" worry. But you're skipping the standard defense, which comes straight from Hilary Greaves. You know the distinction she draws between Simple and Complex Cluelessness?

  **Elias:** I do, but I'm not convinced it saves us. Remind me how you guys think it washes out.

  **Sarah:** So, Simple Cluelessness is when you have two options, A and B, and you know A produces a specific good outcome *x*, but you have no idea what the *further* consequences are. The argument is that these unknown further consequences are likely to be symmetrically distributed around zero. For every causal chain where saving that child leads to a tyrant, there's a roughly equiprobable chain where it leads to a saint. In expectation, they cancel out. So you just maximize based on the *known* effects—the immediate malaria prevention.

  **Elias:** But that assumes symmetry, Sarah. Why should I believe the universe is morally symmetric? Lenman's whole point is that there's no justification for assuming the unknown effects average to zero. It's not a random walk; it's a complex system. If I change the demographic trajectory of a region, that's a structural change, not a coin flip.

  **Sarah:** That's a fair pushback on the *metaphysical* assumption, but practically, if you deny the washing-out effect, you paralyze all decision-making. Not just donating. Breathing, walking, sleeping—all have unknown long-term ripples. If Cluelessness is fatal to consequentialism, then consequentialism is false, or at least unusable. But most of us think it's an epistemic problem, not an ontological one. We act on *subjective* expected utility. Given my evidence, do I have reason to think the ripple is negative? If not, the "washing out" heuristic is the best tool I have.

  **Elias:** Okay, let's grant you Simple Cluelessness for the sake of argument. Let's say the random noise cancels out. That doesn't touch the harder problem: *Complex Cluelessness*. Greaves admits this exists. This is where I have specific reasons to think the long-term effects might be bad, competing with reasons to think they're good, and I can't assign probabilities.

  **Sarah:** Right. So, give me an example in the donation context.

  **Elias:** Economic growth. I donate to a charity that boosts local economic growth in a developing nation. Near term: welfare goes up, great. Long term? Maybe that growth accelerates climate change. Maybe it empowers a regime that becomes aggressive. Maybe it speeds up AI development in a way that's unsafe. I have *evidence* pointing to good, and *evidence* pointing to bad. They don't "wash out" because they aren't random; they are structurally opposed. How do I calculate EV there?

  **Sarah:** You're right that Complex Cluelessness is nastier. But here's where the "fatal" claim falls apart. Just because I can't calculate the *exact* EV doesn't mean I can't rank options. It's about robustness. If I'm choosing between buying a luxury yacht and funding bednets, the uncertainty of the long-term ripples doesn't bridge that gap. The near-term good of the bednets is so massive and tractable that it would take a astronomically low probability of long-term disaster to outweigh it.

  **Elias:** Ah, but that only works if you're comparing bednets to yachts. What if I'm comparing bednets to existential risk reduction? That's where my head is spinning. If the long-term future is vast—as the long-termists argue—then the "washing out" of the bednet ripples might be small compared to the *systemic* impact of, say, AI safety research. But with AI safety, I am *deeply* clueless. I don't know if my donation helps or hinders. With bednets, I know I save lives now, but I'm clueless about the 22nd century.

  **Sarah:** Okay, now we're at the real tension. Near-term welfare vs. Long-termism. Look, if you accept the long-termist premise that the future is vast, then yes, cluelessness about the future is the dominant variable. But that doesn't mean we throw up our hands. It means we look for interventions that are *robustly* good across a wide range of future scenarios.

  **Elias:** Meaning?

  **Sarah:** Meaning, reducing the risk of human extinction is valuable in almost every plausible future trajectory. Whether the future is utopian or just "okay," it only exists if we don't go extinct. So, even under Complex Cluelessness, extinction risk reduction has a high "floor." Whereas with the bednets, you're right—there is a non-zero chance that saving those specific lives leads to a worse trajectory. But the probability of that being *catastrophically* bad enough to outweigh the certain near-term suffering is low.

  **Elias:** But how do you know that probability is low? That's the Lenman worry again. You're assigning probabilities to things you literally cannot model. It feels like you're just pasting a number on your ignorance to make the math work.

  **Sarah:** It's not ignorance; it's Bayesian reasoning with wide credences. I'm not saying "I know the probability is 1%." I'm saying "My credence distribution is wide, but it doesn't mass heavily on 'bednets cause apocalypse'." If you require certainty, you aren't doing consequentialism, you're doing some kind of deontology of safety. Consequentialism asks you to do the *best you can with the evidence available*.

  **Elias:** I guess my worry is that "best you can" becomes a motte-and-bailey. The "bailey" is "we are maximizing the good," but the "motte" is "we are guessing reasonably." If the cluelessness objection holds, we have to admit we are mostly guessing about the *most important* part of the equation (the long term). Doesn't that demand a humility that undermines the confidence EA often projects? Like, maybe we should just focus on reducing suffering *now*, where we aren't clueless?

  **Sarah:** That's the "Humble EA" argument. And I think there's merit to it. But consider this: Cluelessness cuts both ways. You say we should focus on near-term suffering because we know it's real. But if the long-term future is 10^50 lives, and we are even 0.0000001% effective at helping them, that outweighs the near term. Being "clueless" doesn't mean the value isn't there. It just means the variance is high. If you avoid high-variance options solely because of cluelessness, you might be missing the only shots that actually matter.

  **Elias:** So you're saying risk-neutrality is required?

  **Sarah:** I'm saying that if you care about the good *simpliciter*, you can't let the fear of unknown side-effects paralyze you into only acting where the causal chain is short. That's basically a bias toward the visible. The Cluelessness Objection is a reminder to check your models, not a command to stop acting.

  **Elias:** Okay, let's try to synthesize. You're arguing that Simple Cluelessness washes out in expectation, so we ignore the infinite ripple. Complex Cluelessness requires us to look for robustness—actions that are good across many possible futures.

  **Sarah:** Exactly. And for your bonus? If you're worried about the "bednets cause tyranny" ripple, that's Simple Cluelessness. Let it wash out. The certain prevention of malaria death is the anchor. If you're worried about "economic growth causes AI risk," that's Complex Cluelessness. Then you have to weigh the tractability. Do you have a comparative advantage in assessing AI risk? If not, maybe the bednets are still the play, not because the long term doesn't matter, but because your epistemic access to the near-term good is higher.

  **Elias:** So the solution isn't solving the metaphysics of causation, it's acknowledging my own epistemic limitations as part of the calculation?

  **Sarah:** Precisely. Greaves and MacAskill aren't saying "the future is predictable." They're saying "given that the future is unpredictable, how do we maximize *subjective* expected value?" You aren't responsible for the consequences you couldn't reasonably foresee. You're responsible for acting on the best map you have.

  **Elias:** *(Takes a sip of cold coffee)* It still feels like walking on ice that might be thin. But I suppose standing still is also a choice with unpredictable consequences.

  **Sarah:** Exactly. Inaction has ripples too. You keep the money, you spend it on consumption, that drives demand, which drives production, which... same cluelessness problem. You don't get to opt out of the causal web.

  **Elias:** Alright. Simple cluelessness washes out. Complex cluelessness demands robustness. And I shouldn't let the fear of the unknown long-term invalidate the known short-term, unless I have a specific reason to think the long-term leverage is higher *and* tractable.

  **Sarah:** That's a solid heuristic. Don't let the perfect be the enemy of the good, especially when the "perfect" is unknowable. Just make sure the "good" is actually good.

  **Elias:** *(Laughs)* Well, that's the whole job, isn't it? Thanks, Sarah. I think I can sleep tonight.

  **Sarah:** Just don't dream about butterfly effects.

  **Elias:** Too late.
