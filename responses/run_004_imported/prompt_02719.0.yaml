answer: |-
  This is a fantastic rabbit hole to fall down, and honestly, your writing group is fighting over one of the most contentious boundaries in cognitive science. But if you want the hardline Fodorean, Modularity-of-Mind argument—the one that says Mara is *not* literally seeing her ex's face change, but rather experiencing a high-fidelity cognitive projection—I can make that case for you. And I think I can convince you that this version of the story is actually more devastating than the magical realism version.

  Here is the argument for **Informational Encapsulation**.

  ### The Core Claim: The Wall Between Seeing and Thinking

  Jerry Fodor's central thesis in *The Modularity of Mind* is that the perceptual systems are "modules." A module is a specialized machine that is **informationally encapsulated**. This means it does its job without access to what the rest of the brain knows, believes, or fears.

  Think of the visual system as a dumb, high-speed graphics card. It processes edges, contrasts, motion, and depth cues based on fixed, hardwired algorithms. It does not have a phone line to the "CEO" (your beliefs, emotions, memories). By the time your belief ("My ex is cold now") gets into the system, the image has already been rendered.

  If cognitive penetration were real, your beliefs would rewrite the raw data. If encapsulation is real, your beliefs only rewrite the *report* you give about the data.

  To argue Mara's experience is *not* perceptual change, we have to show that every example of "seeing differently" is actually one of three things:
  1.  **Attention:** Scanning different parts of the same image.
  2.  **Response Criterion:** Changing the threshold for saying "I see X."
  3.  **Post-Perceptual Judgment:** Interpreting the same image differently.

  ### Dismantling the Classic Examples

  Let's take the two biggest battering rams used by the "penetration" camp and smash them against the modular wall.

  #### 1. The Steep Hill (Proffitt's Embodied Perception)
  **The Claim:** In famous studies by Dennis Proffitt, participants wearing heavy backpacks estimated hills as steeper than those without backpacks. Later studies suggested tired people or depressed people see distances as further and hills as steeper. The penetration crowd says: *Your bodily state literally alters your visual experience of slant.*

  **The Modular Rebuttal:** This is a category error between **optical slant** and **affordance estimation**.
  If you ask a participant to match the hill's angle with a handheld disk (a direct visual match), the effect largely disappears. The effect only shows up when you ask them to *verbally estimate* degrees or use a haptic measure (like tilting a board with their hand).
  Why? Because the visual module is reporting the optical geometry accurately (the light hitting the retina hasn't changed). The *central system*, however, is calculating "effort required to climb." When the subject says, "That hill looks steeper," they are not reporting a change in retinal processing; they are reporting a change in **motor planning**.
  **Applied to Mara:** When Mara looks at her ex, her visual module is processing the geometry of his nose and the reflectance of his skin accurately. Her brain is simultaneously calculating the "social cost" of interacting with him. She confuses the feeling of *social effort* (he is cold, hard to approach) with *visual data* (his face is sharp). She isn't seeing a colder face; she is seeing a normal face and feeling a heavy backpack.

  #### 2. The Weapon Identification Task (Payne's Bias)
  **The Claim:** In rapid-fire tasks, participants are more likely to misidentify a tool (like a wrench) as a gun if they are primed with a Black face. The penetration crowd says: *Racist stereotypes literally alter low-level visual processing of the object.*

  **The Modular Rebuttal:** This is a shift in **Response Criterion** (Signal Detection Theory), not perceptual content.
  Imagine you are a security guard. If you are told "There is a high threat level," you don't actually see better. You become more willing to pull the trigger on ambiguous shapes. You lower your threshold for saying "Gun."
  In the lab, this looks like faster reaction times and more false positives. But if you measure visual acuity (can they resolve the fine details of the wrench?), it hasn't changed. The pixels are the same. The *decision rule* has changed. The brain is saying, "Given the context, it is safer to mistake a wrench for a gun than a gun for a wrench."
  **Applied to Mara:** Mara is primed with "Breakup/Threat." Her brain lowers the threshold for categorizing ambiguous facial micro-expressions as "hostile." A neutral eyebrow slackening is categorized as a "frown." The visual input is ambiguous; the *classification* is biased. She isn't seeing a frown; she is seeing a neutral face and tagging it "Danger."

  ### The Trump Card: The Persistence of Illusion

  Now, let's deal with the objection you raised: **Isn't this unfalsifiable?** If every time someone claims they "saw" something different, the modularist says "No, that was just attention/judgment," isn't that a "get out of jail free" card?

  No. Because we have a definitive test case where beliefs *should* penetrate if they could, but they *don't*. **Visual Illusions.**

  Take the **Müller-Lyer illusion**. Two lines are equal length; one has arrows pointing in, one has arrows pointing out. The line with arrows pointing out looks longer.
  *   **The Knowledge:** You can measure the lines. You can know with 100% certainty they are equal. You can believe it, swear on it, and build your house on it.
  *   **The Experience:** They *still look different lengths.*

  If cognition could penetrate perception, **knowing the truth should make the illusion vanish.** If your belief ("These lines are equal") could talk to your visual system, it would say, "Fix the rendering." It doesn't. The visual module is encapsulated. It is deaf to the central system's knowledge.

  This proves the wall exists. If the wall exists for line length, it exists for faces. If Mara *knows* her ex hasn't had plastic surgery, but his face still looks different, a strict modularist says: **She is experiencing a cognitive emotion that she is misattributing to vision.**

  The "unfalsifiability" charge fails because the modularist makes a risky prediction: *No matter how strong the belief, early-stage visual processing (V1/V2 cortex activity regarding basic features) will remain stable.* If fMRI studies showed that believing a line was longer actually changed the activation map in V1 corresponding to length, modularity would be dead. (Current evidence suggests top-down influence happens in higher-order areas, not early visual cortex).

  ### Why This Makes Your Book Better

  Here is why you should let this argument convince you to rewrite Mara's experience as **projection** rather than **perceptual alteration**.

  **1. It makes Mara an Unreliable Narrator, not a Magic Realist.**
  If her ex's face *actually* changes physically in her perception, that borders on sci-fi or supernatural. It externalizes the conflict. It says, "The world changed."
  If her face *looks* the same but Mara *interprets* it as colder, that internalizes the conflict. It says, "I changed." That is the stuff of tragedy. It forces Mara to confront that the "coldness" isn't in his cheekbones; it's in her grief.

  **2. It aligns with the Phenomenology of Heartbreak.**
  Think about your own experience of betrayal or loss. Does the person actually look different? Or do you stare at their familiar face and feel like you're looking at a stranger? That feeling of *uncanny valley*—where the data is familiar but the *meaning* is alien—is exactly what encapsulation predicts. The visual module says "This is John." The central system says "This is a Threat." The friction between those two signals creates the sensation that the face itself has warped.

  **3. It gives you a specific mechanism for tension.**
  You can write scenes where Mara catches herself.
  *   *She sees him smile.*
  *   *Her visual system registers the upturn of the lips (Encapsulated Input).*
  *   *Her cognitive system instantly labels it a "smirk" (Post-Perceptual Judgment).*
  *   *She feels a jolt of pain and convinces herself the smile looked predatory.*

  This allows you to write the *feeling* of cognitive penetration without violating the science. You can describe the experience *as if* his face changed, because that is how it feels to her, while leaving the reader the breadcrumb trail that it is actually her own cognitive architecture fracturing under stress.

  ### The Verdict

  The Modularity position holds because it respects the architectural limits of the brain. The visual system is too fast and too specialized to wait for the slow, messy central system to tell it what to see.

  Mara isn't seeing a different face. She is seeing the same face with a different **cost function**.

  If you write it this way, you aren't writing a metaphor dressed as neuroscience. You are writing a precise account of how human beings suffer: we cannot stop seeing the truth, but we cannot stop believing the lie. The lines on the page are equal, Mara, but they will never *look* equal to you again.

  That's a better book.
