  ### **Quick Advice for Section**
  If the prof brings up the Locke comparison, don't panic. Just clarify: *"I meant that there's a structural similarity in the right of deposition, but I understand Aquinas grounds authority in God whereas Locke grounds it in consent."* That shows you know the difference and you'll look sharp. Good luck!
