answer: |-
  The lecture hall had emptied, leaving only the scent of chalk dust and stale coffee. Outside, the campus walkways were dimming under a twilight sky, but inside, the lights were still harsh. Arthur, a metaphysician with a penchant for physics, leaned against a desk. Simone, a philosopher of physics who had just given the colloquium, was packing her laptop into a bag.

  **Simone:** You stayed. I assumed the Rietdijk–Putnam argument would drive you out the door. It usually clears the room of the A-theorists.

  **Arthur:** It's the Andromeda version that haunts me. Penrose's staging of it. Two people pass on the street, and because of their relative velocity, one thinks the Andromedan fleet has already launched, and the other thinks the debate is still ongoing. If reality is frame-invariant, we have a contradiction. If reality isn't frame-invariant, we have solipsism.

  **Simone:** Or, you have the Block Universe. The launch event exists. Its relation to your street-corner meeting is just a matter of coordinates. There is no contradiction because there is no unique "now" slicing through the block. The tension you feel is just the friction of trying to drag a 3D intuition through 4D geometry.

  **Arthur:** I know that's the standard eternalist move, Simone. But it assumes that the geometry *is* the ontology. It assumes that because Special Relativity treats all inertial frames as physically equivalent, they must be ontologically equivalent. That's the leap I can't make.

  **Simone:** It's not a leap; it's a methodological constraint. If the physics tells us there is no experiment to distinguish one simultaneity slice from another, why posit that one is "real" and the others are "illusory"?

  **Arthur:** Because truth isn't always measurable. That's my reply. I'm willing to pay the price for a Neo-Lorentzian interpretation.

  **Simone:** *(Pauses, hand hovering over her bag)* Ah. The privileged frame. The undetectable ether. I should have guessed. You're willing to say there *is* a fact of the matter about whether the Andromedan fleet has launched, independent of the observer, but that the laws of physics conspire to hide that fact from us?

  **Arthur:** Not "conspire." That implies agency. I'm saying the dynamical effects of motion through the privileged frame—length contraction, time dilation—are real physical processes that mask the absolute simultaneity. Lorentz had the right ontology; Einstein just gave us a more efficient calculus. The "plane of simultaneity" for the pedestrian walking toward Andromeda *really* includes the fleet launch. The one walking away *really* does not. One of them is matching the universal "Now." The other is out of sync.

  **Simone:** So, you save Presentism by positing a metaphysical structure that is, by your own admission, empirically inaccessible. Arthur, do you hear how expensive that is? You're doubling the ontology. You have the Minkowski metric, which works perfectly for prediction, and then you have this shadowy, preferred foliation layered on top of it that does no work.

  **Arthur:** It does work. It grounds truth values.

  **Simone:** Truth values for what? Propositions about spacelike separated events?

  **Arthur:** Yes. Take the proposition *P*: "The Andromedan council has voted to invade." In the Block, *P* is just a coordinate. It's tenselessly true. But for me, for the Presentist, *P* must be either true or false *now*. If I accept the Relativity of Simultaneity as ontological, *P* is true for the walker moving East and false for the walker moving West. That violates the Law of Non-Contradiction for a single moment of reality.

  **Simone:** It only violates it if you insist that "now" is a global relation. That's the assumption I'm challenging. But let's stick to your Neo-Lorentzian fix. You're arguing that there is a "True" frame. Let's call it Frame Z. In Frame Z, *P* has a definite truth value. But here is the cost: Frame Z is causally disconnected from our ability to identify it. If I accelerate, my rods contract and my clocks slow in exactly the right way to make me *think* I'm in a different frame, even if I'm actually at rest in Frame Z.

  **Arthur:** Exactly.

  **Simone:** So, what distinguishes Frame Z from any other frame? Not physics. Not observation. It's purely a metaphysical label. You're essentially saying God has a watch, and we don't.

  **Arthur:** I'm saying that measurability is not the criterion for existence. Electrons were unobservable for a long time. The wavefunction is arguably unobservable in its entirety. We posit them because they explain the phenomena.

  **Simone:** But the wavefunction makes a difference to the statistics of what we *do* observe. The privileged frame makes no difference to anything. It is a solution in search of a problem, where the "problem" is just our psychological discomfort with the Block. You're violating Occam's Razor on a cosmic scale. You're adding absolute simultaneity as a surplus structure.

  **Arthur:** Is it surplus? Or is it the foundation? Look, Simone, you eternalists are comfortable saying the future is "already there." That the Andromedan decision was made a million years ago in cosmic time, and it's just waiting for the light to reach us. But that renders deliberation meaningless. If the decision is already real in the block, in what sense is it contingent?

  **Simone:** Contingency is a feature of the laws, not the ontology. The laws are deterministic—or probabilistic, if you prefer QM—but the events are all equally real. Your Neo-Lorentzian view doesn't save contingency. In your Frame Z, the future is just as fixed as in the Block. You've just drawn a moving line across the block and called everything behind it "real." The future events in Frame Z still exist in the manifold; you're just denying their reality by fiat.

  **Arthur:** I'm not denying their existence in the manifold; I'm denying their *actuality*. There's a distinction. The manifold contains all possibilities or all times, but only one slice is *actualized*. The privileged frame tells us which slice is actualized.

  **Simone:** But how does the actualization propagate? If the "Now" is Frame Z, does the actualization jump? If I accelerate, do I suddenly shift into a different "actual" slice? In the Andromeda paradox, a mere change in walking speed shifts the "real" Andromeda by days. Are you telling me that by turning my head, I change which distant events are actual?

  **Arthur:** No. That's the beauty of the Neo-Lorentzian view. Your walking speed changes your *measurement* of simultaneity, but it doesn't change the *fact* of simultaneity. The Frame Z "Now" is absolute. Your wristwatch and your intuition are just misled by your motion through the frame. You *think* the Andromedan reality shifted, but you're just miscalibrating your "now" because you're moving.

  **Simone:** So the "Andromeda Paradox" isn't a paradox for you?

  **Arthur:** It's a paradox only if you assume Einstein's interpretation is ontologically complete. If you assume Lorentz's, it's just an optical illusion caused by our inability to detect our absolute velocity.

  **Simone:** But Arthur, think about the cost again. In Einstein's SR, the symmetry of the frames is fundamental. It tells us something deep about the nature of space and time—that they are woven together. In your view, that symmetry is a facade. It's a conspiracy of nature to hide the absolute rest frame. Why would the universe be built that way?

  **Arthur:** Why would the universe be built as a Block where my experience of "passing time" is a persistent illusion? That's a high cost too. You're asking me to accept that my conscious experience of the flow of time is fundamentally misleading.

  **Simone:** I'm asking you to accept that "flow" is a perspectival effect, like the horizon moving as you walk. The horizon isn't real, but your experience of it is explained by your position. Similarly, "now" is a perspectival effect explained by your worldline. You don't need a privileged frame to explain the horizon; you don't need one for "now."

  **Arthur:** But the horizon doesn't determine truth values. Whether Andromeda has invaded is a fact. If it's frame-dependent, truth is frame-dependent. I cannot accept that. I would rather posit an undetectable frame than accept that truth is relative to velocity.

  **Simone:** Truth isn't relative. The proposition "Event E is spacelike separated from Event O" is invariant. That's the truth. You want to add "...and E is *really* past O" as an extra predicate. But that predicate has no truth-conditions we can access. It floats free of the physics.

  **Arthur:** It has truth conditions! It corresponds to the privileged foliation.

  **Simone:** Which is defined by... what?

  **Arthur:** By the metaphysical requirement that reality be determinate.

  **Simone:** *(Sighs, finally picking up her bag)* That's circular, Arthur. You posit the frame to save determinacy, and you justify the frame by the need for determinacy. Meanwhile, the physics—the actual causal structure of the universe—tells us that spacelike separated events cannot influence each other. If your "privileged now" connects events that cannot causally interact, you're binding reality together with a relation that has no physical mechanism.

  **Arthur:** Causality isn't the only glue. Logical consistency is glue. If I can say "It is now 2024 on Earth" and "In Andromeda, it is 2024," there must be a fact of the matter about what is happening in Andromeda *when* I say that. Even if I can't know it yet.

  **Simone:** There *is* a fact. In the Block, the event exists. You just refuse to call it "real" until your light cone hits it. But your "until" requires a universal clock. And the universe has refused to give us one. Every experiment, from Michelson-Morley to modern particle accelerators, screams that there is no universal clock. You're hearing the scream and saying, "Yes, but the clock is silent."

  **Arthur:** I'm saying the clock is the metric of becoming, not the metric of measurement. Look, I know the cost. I know it looks like I'm adding epicycles. But the cost of the Block is the death of agency. If the Andromedan decision is already real, then it couldn't have been otherwise.

  **Simone:** And if your Frame Z fixes the "real" present, does it fix the future of that present?

  **Arthur:** ...Not necessarily. The future can be open even if the present is absolute.

  **Simone:** But in SR, the "present" of a distant event is in the causal future of some observers and the causal past of others, depending on the frame. If you fix one Frame Z as the "Real Present," you are essentially saying that for some observers, the "Real Present" includes events that are in their absolute future. You're allowing reality to outpace causality.

  **Arthur:** I am. Reality is broader than causality.

  **Simone:** Then reality is magical.

  **Arthur:** Then reality is metaphysical.

  *(They stand in silence for a moment. The cleaning crew is starting to vacuum the rows of seats.)*

  **Simone:** You know, Penrose didn't intend the Andromeda paradox to kill Presentism. He intended it to show how counter-intuitive SR is.

  **Arthur:** And I'm telling you that the counter-intuitiveness is a signal. When physics and metaphysics clash this hard, one has to give. I choose to keep the metaphysics of a dynamic time and let the physics be an effective theory of measurement.

  **Simone:** And I choose to keep the physics as a description of reality and let the metaphysics adapt. I think your "privileged frame" is a ghost. But... *(She hesitates)* ...I admit, it's a ghost that keeps the lights on for your notion of truth.

  **Arthur:** And your Block keeps the geometry clean but leaves the room cold.

  **Simone:** *(Smiles faintly)* Coffee? I think we've earned a break from saving the universe.

  **Arthur:** Only if we can agree that the coffee exists in the present.

  **Simone:** I'll concede that. For now.

  *(They walk toward the door, the question of Andromeda hanging unresolved in the space between them, as real as the floor beneath their feet, or as illusory as the shadow on the wall.)*
