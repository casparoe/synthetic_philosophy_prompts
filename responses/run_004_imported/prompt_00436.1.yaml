answer: |-
  This is a fantastic question for lecture notes, and you've hit on one of the most enduring debates in the philosophy of mind and neuroscience. It's not that ethicists and legal scholars are being squeamish; rather, the conclusion that split-brain patients are "two people" is far less settled than pop-science summaries of Sperry's work often suggest.

  Here is a breakdown of why the field hasn't adopted the "two persons" model, divided into the neuroscience, the phenomenology, and the philosophical/legal implications.

  ### 1. The Neuroscience: Functional Dissociation $\neq$ Two Minds
  The premise that Sperry proved the hemispheres are "fully separate consciousnesses" is a common oversimplification of the data.

  *   **Experimental vs. Ecological Context:** In the lab, when visual input is strictly lateralized (flashed to one visual field for a fraction of a second so the eyes can't move), the hemispheres can respond independently. However, in daily life, split-brain patients behave as a unified agent. They walk, talk, eat, and socialize without appearing to have two distinct wills fighting for control.
  *   **Subcortical Integration:** The corpus callosum is the main highway, but it isn't the *only* connection. Subcortical structures (like the brainstem and thalamus) often remain intact. These structures allow for the integration of arousal, emotion, and motor coordination, maintaining a baseline of unity.
  *   **Compensatory Strategies:** Patients quickly learn to use eye movements to share information between fields or use verbal cues to integrate data. The brain is plastic; it finds workarounds that preserve the sense of a single self.

  ### 2. The Phenomenology: What the Patients Say
  If there were truly two distinct people, we would expect the patients to report a duality of experience. They generally do not.

  *   **Unified Self-Report:** Post-surgery, patients overwhelmingly report feeling like the same single person they were before. They do not report having an "inner roommate."
  *   **Conflict is Rare:** While "intermanual conflict" (one hand buttoning a shirt while the other unbuttons it) does happen, it is usually temporary and often described by the patient as a quirky malfunction of their *own* body, not the action of a *different person*.
  *   **Elizabeth Schechtman's Work:** Philosopher and cognitive scientist Elizabeth Schechtman (in her book *Self-Consciousness and 'Split' Brains*) argues extensively that while the *systems* of processing are divided, the **self-consciousness** remains unified. She suggests the hemispheres are more like specialized departments of one company rather than two competing CEOs.

  ### 3. The Philosophical & Legal Hurdles
  Even if we granted that there are two streams of consciousness, jumping to "two legal persons" creates intractable problems that aren't just squeamishness—they are categorical errors.

  *   **Biological vs. Psychological Personhood:** The law defines personhood based on the biological human organism, not the count of conscious streams. If we defined personhood by consciousness, we'd have to address dissociative identity disorder, sleep, anesthesia, and fetal development in radically different ways.
  *   **Moral Responsibility:** If the left hemisphere commits a crime but the right hemisphere is "innocent," who goes to jail? You cannot incarcerate a hemisphere. Punishment and rehabilitation require a unified agent that persists over time. Since the patient's memory and personality traits are largely shared (via subcortical routes and verbalization), holding the *organism* responsible is the only functional option.
  *   **Rights and Consent:** If the hemispheres disagree on medical consent, does the doctor need 51% of the brain to agree? This reduces human rights to a voting system within a skull, which undermines the concept of bodily autonomy.

  ### 4. Why the "Two People" Theory Persists
  The idea is seductive because it offers a neat solution to the mind-body problem: *Consciousness is localizable.* If you cut the brain, you cut the self.

  However, most contemporary neurophilosophers (like Thomas Nagel and Derek Parfit, who debated this extensively) lean toward the view that **personhood is a higher-order construct.** It emerges from the whole system. When you damage the integration system, you impair the *expression* of the person, but you don't necessarily duplicate the person.

  ### Summary for Your Lecture
  You can frame it for your students like this:
  1.  **Sperry showed functional independence,** not necessarily ontological duality.
  2.  **Unity is preserved** in naturalistic settings and subjective experience.
  3.  **Ethicists haven't ignored it;** they have analyzed it and largely rejected the "two persons" model because it doesn't align with the patient's lived reality or functional legal frameworks.

  It's not that the field is ignoring a weird conclusion; it's that the evidence for the "two people" conclusion is much weaker than the evidence for "one person with a communication bottleneck." It's a perfect example of why we must distinguish between **neural modularity** and **personal identity.**
