      *   **Claim 4 (Grudge Informer - Hart):** "Hart, meanwhile, backs the court's actual move of ruling that the Nazi statute was too wicked to ever count as law..." -> *INCORRECT.* This is **Fuller's** position (or at least the position of the German courts influenced by natural law reasoning). Hart argued the Nazi statute *was* law (however immoral), so the woman had a legal defense. To punish her, the state must admit it is using retroactive law.
