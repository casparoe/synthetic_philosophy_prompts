prompt: |-
  ok so my philosophy teacher's out this week and had us trade practice essays to peer-grade before the actual in-class essay on this topic next week. i got my friend's answer on the Hart vs Fuller debate and i'm not gonna lie, im not super confident on this stuff myself so i dont wanna just eyeball her grade and get it wrong.

  the question was: "Explain the core disagreement between Hart and Fuller over the relationship between law and morality, and use the 'grudge informer' problem to show how their two views lead to different conclusions about the Nazi-era statutes."

  here's what she wrote: "Hart is a legal positivist, so for him law and morality are two separate things - a rule can be completely valid as law even if its morally terrible, thats basically the separation thesis. Fuller pushes back on this and says law has its own built-in 'inner' morality, so a rule that's unjust enough or that tramples on people's basic rights doesn't actually count as law at all, since it fails the substantive moral standard that makes something count as law in the first place. This is where the grudge informer case comes in: a woman reports her husband to the Nazi authorities for badmouthing Hitler while he's home on leave, he gets punished for it, and after the war she's prosecuted for unlawfully depriving him of his liberty, defending herself on the grounds that turning him in was completely legal at the time. Fuller's fix is that postwar Germany should pass a new law openly punishing her retroactively, since at least thats honest about overriding the normal rule against retroactive punishment for a good reason. Hart, meanwhile, backs the court's actual move of ruling that the Nazi statute was too wicked to ever count as law, so she never had a real legal defense to begin with. Either way, both end up fine with punishing her, they just get there through completely different theories of what law even is."

  can you grade this out of 20 and break it into comments for each chunk (the Hart/positivism bit, the fuller bit, and the grudge informer bit) plus an overall total? a json with a score and a short comment per chunk would be perfect so i actually have specifics to hand back instead of just a number.
