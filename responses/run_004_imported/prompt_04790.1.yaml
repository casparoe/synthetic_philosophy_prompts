answer: |-
  You have done a very solid job digging into the literature, and your skepticism is well-placed. ECL (Evidential Cooperation in Large Worlds) is one of the most speculative corners of effective altruism and decision theory.

  However, your housemate is right: **ECL is not hostage specifically to the Many-Worlds Interpretation (MWI) of quantum mechanics.** While MWI is a convenient way to get the "Large World" premise, it is not the only way, and arguably not even the primary way proponents justify the framework.

  Here is the breakdown of why your MWI objection doesn't kill the argument, where the "Large World" actually comes from in these models, and whether you should bring this up at an EA meetup.

  ### 1. "Large World" $\neq$ "Many Worlds"
  Your main friction point is equating "Large World" with "Quantum Branches." In the context of ECL and acausal trade literature (Oesterheld, Bostrom, Yudkowsky, etc.), a "Large World" generally refers to a universe (or multiverse) that is **spatially or computationally vast enough to contain many agents similar to you.**

  There are three main physical/metaphysical mechanisms used to justify this, only one of which is MWI:

  *   **Eternal Inflation / Infinite Space (Standard Cosmology):** This is the most common non-MWI justification. If the universe is spatially infinite (which is consistent with current data on cosmic curvature and inflation theory), then there are infinitely many Hubble volumes. In an infinite universe with finite ways to arrange matter, exact duplicates of you (and agents with highly correlated decision algorithms) must exist simply due to combinatorics. This relies on standard cosmological models, not specifically on the interpretation of quantum mechanics.
  *   **The Simulation Hypothesis:** If we are in a simulation, the "base reality" could be running many instances of our universe or many instances of agents like us for computational or experimental reasons. This creates a "Large World" of correlated agents without needing MWI or infinite space.
  *   **MWI (Quantum Branching):** As you noted, if MWI is true, there are many branches of the wavefunction where slightly different versions of you exist.

  **The Point:** Proponents of ECL usually argue that you should assign *some* non-zero credence to at least one of these scenarios. Since the potential "gains from trade" in an infinite/simulated/multiverse scenario are astronomically high, even a small credence (e.g., 1% chance the universe is infinite) can dominate the expected value calculation. They aren't betting 100% on MWI; they are betting on "Large World Hypotheses" generally.

  ### 2. The Core is Decision Theory, Not Physics
  The deeper engine of ECL isn't the physics of the world, but the **decision theory** used to navigate it.

  ECL relies on **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)** rather than Causal Decision Theory (CDT).
  *   **CDT** says: "I can't causally influence that alien 10 billion lightyears away (or in another branch), so I should ignore them."
  *   **FDT/UDT** says: "My decision is the output of an algorithm. If that alien is running a similar algorithm (or simulating me), their decision will correlate with mine. By choosing to cooperate, I 'logically cause' them to cooperate."

  The physics (MWI vs. Infinite Space) only determines the *stakes* (how many copies exist). The *logic* of cooperation holds regardless of the physics, provided there is **logical correlation**.
  *   If the universe is small (one copy of you), ECL suggests you should still cooperate with *possible* agents in other logical worlds (modal realism), though this is even more speculative.
  *   If the universe is large (many copies), the leverage is higher.

  So, the argument isn't "MWI is true, therefore ECL." It is "If you use FDT, and there is *any* significant probability of a Large World (via Inflation, MWI, or Simulation), then ECL dominates."

  ### 3. The Real Weak Points (Better than the MWI Objection)
  If you want to critique ECL at a meetup, the MWI angle is actually a bit of a straw man that proponents can easily dodge (as your housemate did). There are stronger objections you should be aware of:

  *   **The Correlation Problem:** How similar do the other agents need to be for the correlation to hold? If you cooperate, does that actually mean the alien in Andromeda (or the other branch) cooperates? Or do you just have different values? If the correlation is weak (e.g., 0.0001), the gains-from-trade math falls apart.
  *   **The "Cluelessness" Objection:** In a Large World, your actions might have unintended consequences you can't model. Trying to optimize for acausal trade might lead to bizarre behavior that undermines your causal impact on the local world (which we know matters).
  *   **Pascal's Mugging:** ECL is vulnerable to the same critique as Pascal's Mugging. If you allow tiny probabilities of infinite stakes to dominate your decision making, you become vulnerable to any hypothesis that posits infinite stakes. Why prioritize ECL over "acausal torture by demons" if both posit infinite stakes with tiny probabilities?
  *   **Double Counting:** If everyone is doing ECL, are we just moving value around in a closed loop without creating actual value? (Proponents have answers to this, but it's a common critique).

  ### 4. Should You Cite This at an EA Meetup?
  **Proceed with caution.**

  *   **The Vibe Check:** Most mainstream EAs focus on *causal* impact (bednets, AI policy, biosecurity). ECL is considered "highly speculative longtermism." Bringing it up as a *primary* reason for intervention weighting might make you seem disconnected from practical cause prioritization.
  *   **How to Frame It:** Instead of saying, "We should do X because of ECL," frame it as:
      > "I've been looking into ECL. It seems like if there's a non-zero chance we're in a Large World (via inflation or simulations), FDT suggests we should cooperate with correlated agents. However, it seems risky to base strategy on this given the uncertainty in decision theory and the correlation strength. I'm curious how others weigh these speculative acausal impacts against causal longtermism."

  *   **Don't Bet the Farm:** Your intuition that it's risky to bet the framework on contested physics is partially right, not because MWI is the only way, but because *all* Large World hypotheses (Infinite Space, Simulation, MWI) are empirically difficult to verify. Basing moral strategy on unverifyable metaphysics is a hard sell in EA.

  ### Summary
  Your housemate was correct. The "Large World" premise is robust to the falsification of MWI because **infinite cosmological space** and **simulation hypotheses** provide alternative mechanisms for the necessary agent multiplication.

  The argument doesn't stand or fall on Quantum Interpretations. It stands or falls on:
  1.  Whether you accept Functional/Updateless Decision Theory over Causal Decision Theory.
  2.  Whether you assign enough credence to *any* Large World hypothesis to let it dominate expected value.
  3.  Whether you think the correlation between your algorithm and distant/simulated agents is strong enough to generate actual gains-from-trade.

  If you bring this up at a meetup, focus on the **decision theory** and the **credence assignment**, rather than the quantum mechanics. That's where the actual philosophical action is.
