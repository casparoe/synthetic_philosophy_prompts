      *   **Logical Correlation:** ECL is often framed within Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). These theories posit that your decision is an output of an algorithm. If that algorithm is instantiated elsewhere (in a computer, in another brain), your decision correlates with theirs. This doesn't require MWI, just computational functionalism.

