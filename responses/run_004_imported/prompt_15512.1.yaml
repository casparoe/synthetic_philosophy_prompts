answer: |-
  Your hesitation is not unearned skepticism; it is epistemic maturity born of having witnessed a paradigm shift from the inside. You have a vantage point that most philosophers of science only dream of: you saw the moment when the "fringe" became the "foundation."

  The analogy you draw between the Plate Tectonics revolution and the current state of Cosmology is profound. To answer your question: yes, there are principled ways to distinguish what is likely to survive a theory change and what is likely to be discarded. However, applying them requires disentangling *phenomenology* (what happens) from *ontology* (what exists) and *dynamics* (why it happens).

  Here is a framework for calibrating your trust, drawing on the history you lived through and the philosophy you are now reading.

  ### 1. Kinematics vs. Dynamics (The Wegener Lesson)
  The most critical lesson from the continental drift debate is the distinction between kinematics and dynamics.
  *   **Kinematics (The Geometry):** The fit of the continents, the distribution of fossils, the paleoclimatic data. This was the "what."
  *   **Dynamics (The Engine):** The tidal and rotational forces Wegener proposed. This was the "why."

  **What survived:** The kinematics. The continents *do* move. The geometry of the plates is a robust fact that survived the revolution.
  **What died:** The dynamics. Wegener's mechanism was physically impossible given the viscosity of the mantle (as Jeffreys correctly noted).

  **Application to Cosmology:**
  When cosmologists speak of Dark Matter and Dark Energy, are they describing kinematics or dynamics?
  *   **The Robust Part (Kinematics):** Galaxies rotate faster than visible mass allows; the universe's expansion is accelerating; the Cosmic Microwave Background (CMB) has specific anisotropies. These are the "coastline fits" of cosmology. They are observational regularities. It is highly probable these phenomena will survive any future overhaul. The universe *does* behave as if there is extra gravity and extra expansion.
  *   **The Volatile Part (Dynamics/Ontology):** The claim that these effects are caused by *substances* (particles for Dark Matter, a scalar field or cosmological constant for Dark Energy). This is the "tidal force" equivalent. It is a specific ontological commitment to save the current dynamical framework (General Relativity).

  **Calibration:** Trust the anomaly, not necessarily the explanation. The 95% figure is a measure of our *ignorance* within the current model, not necessarily a census of the universe's inventory.

  ### 2. Structural Realism vs. Entity Realism
  In philosophy of science, your intuition aligns closely with **Structural Realism** (championed by John Worrall). This view suggests that when theories change, the *mathematical structure* often survives, even if the *nature of the entities* changes.

  *   **Historical Precedent:** In the 19th century, Fresnel developed equations for light waves propagating through the "luminiferous ether." Later, Maxwell and Einstein discarded the ether. However, Fresnel's *equations* survived. The structure of the relationships remained valid; the ontological "stuff" (the ether) was discarded.
  *   **The Geophysical Parallel:** Consider the concept of "isostasy." The idea that the crust floats on the mantle survived. The specific understanding of the mantle's rheology changed from a rigid solid to a viscous fluid over geological time. The mathematical relationship (buoyancy equilibrium) held; the material description changed.

  **Application to Cosmology:**
  The Friedmann equations (which govern expansion) and the laws of gravity are the "structure." Dark Matter and Dark Energy are currently the "ether"—the stuff we posit to make the structure fit the observation.
  *   **Principled Trust:** You can trust that the *mathematical relationships* describing the expansion and gravitational clustering are approximately correct (just as Fresnel's equations were).
  *   **Principled Skepticism:** You should remain agnostic about whether "Dark Matter" is a particle. It might be a modification of the gravitational structure itself (like MOND, though currently less successful overall), or a new field we don't yet understand.

  ### 3. Independence of Evidence
  One reason Plate Tectonics became "unquestioned" was the convergence of independent lines of evidence: paleomagnetism, seafloor age dating, earthquake distribution, and GPS. These were methodologically distinct.

  **Application to Cosmology:**
  Dark Matter has strong claims to this kind of convergence. It explains:
  1.  Galaxy rotation curves.
  2.  Gravitational lensing.
  3.  CMB power spectra.
  4.  Large-scale structure formation.

  This makes the *phenomenon* of "missing gravity" much more robust than Wegener's fossil matches alone. However, Dark Energy is less robust; it relies heavily on Type Ia supernovae and the CMB, interpreted through General Relativity.

  **Calibration:** The more independent the observational lines, the more likely the *effect* is real. The more reliant the evidence is on a single theoretical framework (General Relativity), the more likely the *interpretation* is vulnerable. Since Dark Matter/Energy are inextricably linked to GR, if GR requires modification at cosmic scales, the "95%" could vanish into a change of laws rather than a census of stuff.

  ### 4. The "Placeholder" Problem
  In your field, "mantle convection" was a placeholder for decades before the mechanism of heat transfer and rheology was understood. It was a functional description, not a detailed mechanical one.

  Dark Matter and Dark Energy are currently **phenomenological placeholders**.
  *   "Dark Matter" effectively means "Gravity behaves this way on galactic scales."
  *   "Dark Energy" effectively means "Expansion accelerates this way."

  Cosmologists often speak of them as *substances* (fluids, particles) because that is how they enter the equations (the Stress-Energy Tensor). But history suggests that when we fill in the details of a placeholder, the nature of the filler often surprises us.

  ### A Principled Stance
  To answer your specific question on how to calibrate trust:

  1.  **Trust the Data, Not the Inventory:** The observational anomalies (rotation curves, acceleration) are likely as real as the fit of the Atlantic coastlines. They are not going away.
  2.  **Distrust the Ontology:** The claim that these anomalies constitute "substance" making up 95% of the universe is akin to Wegener's tidal forces. It is the best current mechanism, but it is physically unverified.
  3.  **Watch for the "Jeffreys Moment":** Harold Jeffreys was right that Wegener's mechanism violated physics. Today, there are "Jeffreys moments" in cosmology: the Hubble Tension (different methods yielding different expansion rates) and the Core-Cusp problem (Dark Matter simulations not matching galaxy centers). These are the viscosity arguments of our time. They suggest the current mechanism is incomplete.
  4.  **Adopt "Agnostic Realism":** Believe that the universe has structure that causes these effects. Do not believe that we have correctly identified the nature of that structure.

  ### Conclusion
  Your hesitation is not a failure of nerve; it is a correct application of historical induction. In the transition from Continental Drift to Plate Tectonics, the **geometry** was vindicated, but the **physics** was replaced.

  In Cosmology, the **geometry** (the metric expansion, the gravitational lensing) is likely vindicated. The **physics** (the claim that this is due to invisible particles and vacuum energy) is the candidate for replacement.

  You can trust that the 95% represents a real gap in our understanding, but you are wise to doubt that it represents a literal inventory of cosmic ingredients. As a geophysicist, you know that the map is not the territory. In cosmology, the stress-energy tensor is the map. We should not be surprised if the territory turns out to be made of something other than what the map legend says.
