answer: |-
  The candle gutted in the draft, casting long, shivering shadows against the stone of the scriptorium. Elias rubbed his eyes, the grit of sleeplessness scratching like sand. Across the table, Kaelen sharpened a dagger. The sound was rhythmic, aggressive: *shhhk, shhhk, shhhk.*

  "Stop," Elias said.

  "It needs an edge," Kaelen replied, not looking up. "For the throat."

  "It needs a warrant."

  Kaelen stopped. He looked up, his face a map of old scars and new anger. "A warrant? From whom? The King?"

  "From the Estates. From the High Council. From the public authority." Elias tapped the open book before him. It was a copy of the *Summa*, the pages worn from frantic thumbing. "Aquinas is clear, Kaelen. If the ruler holds power by right, even if he rules badly, the sword belongs to the public. Not to you. Not to me."

  "Alaric holds power by blood," Kaelen spat. "He taxes the grain until the peasants eat bark. He hangs priests who preach mercy. He is a tyrant. The Angelic Doctor says a tyrant disrupts the common good. He is the seditious one, not us."

  Elias leaned forward. "There is the distinction. You are conflating the *exercise* of power with the *title* to power. Is he a tyrant by defect? A usurper who seized the crown by force? Or is he a tyrant by exercise? A legitimate king who has turned wicked?"

  "What difference does it make? The people starve either way."

  "It makes the difference between justice and murder," Elias said, his voice dropping. "If he is a usurper, he has no bond with the people. The bond is void. A private man may strike him down, for he is no true king. But if he is the true heir, anointed and crowned, the bond holds. To kill him is regicide. It sets a precedent that any private grievance justifies the dagger. It invites chaos. It is sedition."

  Kaelen stood, pacing the small room. "He murdered his brother. The older brother. Everyone knows it."

  "Everyone *suspects* it," Elias corrected. "Suspicion is not proof. If he murdered the heir, he is a usurper. He is a private citizen wearing a crown. You may kill him. But if the brother died of the sweating sickness, as the physicians swore, then Alaric is the legitimate King. And if he is the legitimate King, you cannot touch him. You must wait for the Council to convene. They must declare him deposed. Only then does the sword become public."

  "The Council is bought," Kaelen said. "Half of them hold Alaric's debts. The other half fear his guards. If we wait for the Council, the harvest dies. The winter kills the weak. How many souls is your distinction worth, Elias?"

  "It is worth the soul of the kingdom," Elias said. "If you kill a legitimate king, you tear the fabric of law. You say that might makes right. Alaric rules by might; if you kill him by might, you prove him right. You must kill him by law."

  Kaelen sheathed the dagger. The click was final. "I have proof."

  Elias froze. "What?"

  "The physician. The one who signed the death warrant for the brother. He's in the city. Hiding. He told me Alaric paid him to poison the wine." Kaelen's eyes were hard. "He is a usurper, Elias. The distinction is settled. He has no title."

  Elias felt a cold wash of relief, followed immediately by dread. "Where is this physician?"

  "Safe. For now."

  "Bring him to the Council," Elias said, standing. "If you present this testimony, the Council must act. They cannot ignore sworn testimony of regicide. If they confirm he is a usurper, then his authority is null. Then, and only then, can action be taken. Even then, it should be the Guard who arrests him, not your knife in the dark."

  "The Council will sit on it," Kaelen said. "They will debate while the guards find the physician. They will find him dead in an alley. Alaric will smile and pour more wine."

  "Then we lose," Elias said. "But we do not become him."

  "We are already losing," Kaelen said. He moved to the door. "I am not waiting for the Council to sell us out. If he is a usurper, I have the authority. I am a citizen of Ostra. He is an enemy of Ostra."

  "Kaelen, no. The *Summa* warns against this. Even against a tyrant, if the removal causes greater turmoil, it is to be borne. But more than that—if you act as a private hand against a man the Church has anointed, you invite excommunication. You invite civil war. The loyalists will not see a liberator; they will see a murderer."

  "Let them come," Kaelen said, and stepped out into the night.

  Elias stood alone in the scriptorium. The silence was heavy. He looked down at the text. *Sedition is a mortal sin... unless it is against a tyrant who rules for private gain.* But the commentary was subtle. *Private gain* was clear. But *Public Authority* was the shield. Without the shield, the resistance becomes the crime.

  He grabbed his cloak. He had to find the Dean of the Council. He had to force the session before Kaelen reached the palace.

  ***

  The bells did not ring for morning prayer. They rang in a chaotic, clattering peal that meant fire or invasion.

  Elias ran through the streets of the lower city. Smoke curled over the rooftops, not the black of burning timber, but the grey of torches. He reached the palace square and stopped.

  The gates were open. The body of King Alaric lay on the steps. There was no crown on his head. There was a dagger in his chest.

  Kaelen stood over him, hands raised. He was not alone. A dozen of his men stood with him, swords drawn. But across the square, the Royal Guard was forming up. And behind them, the citizens of the upper city were gathering, not cheering, but whispering.

  Elias pushed through the crowd. "Kaelen!"

  Kaelen turned. His face was pale, but his eyes were bright. "It is done. The usurper is dead."

  A captain of the Guard stepped forward, his spear leveled. "Seize them. They have killed the Lord's Anointed."

  "He was no King!" Kaelen shouted to the crowd. "He poisoned his brother! He stole the throne!"

  "Where is the proof?" the Captain yelled back. "Where is the trial?"

  "I am the proof!" Kaelen drew his sword.

  "Stop!" Elias screamed, reaching the front of the group. He grabbed Kaelen's arm. "Where is the physician?"

  "Dead," Kaelen said. "Found in the river this morning."

  Elias felt the blood drain from his face. "You killed him?"

  "No. Alaric's men. I told you they would."

  "Then you have no witness," Elias hissed. "You have no testimony. You have no Council decree."

  "I have justice."

  "You have murder," Elias said. "He was crowned, Kaelen. The Church anointed him. Without proof, he is the Legitimate King. And you are a private citizen."

  "The people know," Kaelen gestured to the crowd.

  The crowd was silent. A woman clutched her child. A merchant looked at the body, then at the Guard, then at Kaelen. He did not cheer. He looked afraid.

  "Seize them," the Captain ordered.

  The Guard surged forward. Kaelen's men fought, but they were outnumbered. It was not a battle; it was a slaughter. Kaelen fought well, but a spear took him in the thigh, then another in the side. He fell to his knees beside the man he had killed.

  Elias dropped beside him. "Fool," he whispered. "You treated a legitimate king like a usurper."

  "The distinction..." Kaelen coughed, blood on his lips. "It doesn't matter... he's dead."

  "It matters," Elias said, looking up at the Captain. "It matters to the winter. It matters to the harvest."

  The Captain looked down at them. "You hear that? They admit it. They admit they killed the King without authority."

  "I admit nothing," Elias said, standing. He turned to the crowd, his voice ringing off the stone walls. "This man was a tyrant! But he was the *legal* tyrant. By killing him without the Council, you have not ended tyranny. You have ended Law."

  He pointed at the Captain. "You will call this justice. You will hang them. And then you will raise the King's son. And he will know that any man with a knife can claim 'tyranny' to justify murder. He will build walls. He will trust no one. He will tax you for guards. He will become the tyrant Kaelen feared, because Kaelen gave him the reason."

  The Captain signaled. Two guards grabbed Elias. "Take the scholar too. He was the mind behind it."

  "I was the voice against it!" Elias struggled. "Ask him! Ask Kaelen!"

  Kaelen was dead. His eyes stared at the grey sky, unseeing.

  ***

  Six months later.

  Elias sat in a cell that smelled of damp straw. He was not executed. The new King, Alaric's son, was clever. He knew a martyr made a loud ghost. A prisoner made a quiet lesson.

  The door opened. A young priest entered, carrying a tray of bread. He was new, not from the palace.

  "Father Thomas," Elias said. "You are the confessor?"

  "I am," the priest said. He set the tray down. "The King offers you a pardon. If you sign."

  He placed a parchment on the floor. It was a confession. *I, Elias, did conspire to sedition, claiming the late King was a usurper without proof, inciting private violence against public authority.*

  "If I sign?" Elias asked.

  "You go to a monastery. Silence. Prayer."

  "And if I do not?"

  " The square. The axe."

  Elias looked at the paper. He thought of Kaelen's dagger. He thought of the *Summa*. *The tyrant is guilty of sedition.* But *the private killer is guilty of murder.*

  Kaelen had been right about the man, but wrong about the office. He had treated the Crown as a piece of metal rather than a covenant. By breaking the covenant to save the people, he had broken the shield that protected the people from the next man with a knife.

  "The King," Elias said softly. "The son. Is he like the father?"

  The priest hesitated. "He has doubled the grain tax. To pay for the Guard. To prevent... further sedition."

  Elias closed his eyes. The cost.

  "He is building a fortress," Elias said. "Because he knows his father died by a private hand. He will not die the same way. He will kill us all before he lets a knife near him."

  "Sign, Elias," the priest urged. "You cannot save them now."

  "I cannot save anyone," Elias said. "That was the point."

  He picked up the quill. He looked at the line where he was to confess to sedition.

  Aquinas wrote that the tyrant sows discord. But the private assassin waters it.

  "I did not commit sedition," Elias said. "Sedition is opposition to the common good. I sought the common good. But I failed to secure the Public Authority."

  "Sign," the priest said, trembling. "Or the axe."

  Elias dipped the quill. He wrote: *I acted without Public Authority.*

  He did not write *I was wrong.*

  He handed the paper back. "Tell the King I accept the monastery. But tell him this: He lives by the sword Kaelen drew. He will die by it. The distinction is gone now. There is only the knife."

  The priest took the paper and left quickly, as if the cell were burning.

  Elias sat back against the stone. He could hear the city beyond the walls. It was quiet. Too quiet. The silence of a people waiting for the next boot to fall, knowing now that the law was just a piece of paper, and the only truth was the steel.

  He had gotten the distinction right. And it had cost him everything. And it had saved nothing.

  Because in the end, men like Kaelen do not read the *Summa*. They read the blood. And men like Alaric do not read the *Summa* either. They read the fear.

  Elias closed his eyes and prayed for the usurper who never was, and the king who should have been, and the law that died in the space between them.
