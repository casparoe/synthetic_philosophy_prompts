  2.  **Deconstruct Aquinas's Position (for accuracy):**
      *   *De Regno (On Kingship):* Discusses tyranny.
      *   *Summa Theologiae (II-II, Q. 42, A. 2):* Discusses sedition. Sedition is a mortal sin *unless* it opposes a tyrant who rules for private gain rather than the common good. However, the tyrant is the true seditious one.
      *   *Summa Theologiae (II-II, Q. 64, A. 3):* Discusses killing. Private individuals cannot kill tyrants. Public authority can.
      *   *Commentary on the Sentences:* Discusses usurpers. A usurper has no claim; resistance is easier to justify, but still needs order.
      *   *Crucial Nuance:* Aquinas is generally cautious. He prefers deposition by public authority over assassination by private hands. If a ruler is a *usurper*, the bond of allegiance is broken. If a ruler is *legitimate but tyrannical*, the bond holds, and removal requires due process/public authority to avoid greater chaos (sedition).

  3.  **Brainstorming the Setting & Characters:**
      *   **Setting:** A medieval-esque kingdom, isolated, perhaps mountainous. Let's call it Ostra.
      *   **The Ruler:** King Valerius. Did he inherit? Or did he seize? Let's make it ambiguous initially, then clarify. Let's say he inherited but is acting badly. Or better: He seized power from a weak brother. That makes him a *usurper* in the eyes of some, but *de facto* king to others.
      *   **The Protagonist:** A scholar or advisor. Someone who knows the law/theology. Let's call him Elias. He's a jurist or a chaplain.
      *   **The Antagonist/ foil:** A hot-headed revolutionary. Let's call him Kaelen. He wants to stab the king now.
      *   **The Conflict:** A plot is hatched. Elias knows the distinctions. Kaelen doesn't.
      *   **The Twist/Cost:** If they act as private citizens against a *legitimate* (even if bad) king, they commit sedition/murder. If they wait for public authority, they might miss the window. If the king is a *usurper*, the rules change.
      *   **Decision:** Let's make the King a *legitimate* heir who has become tyrannical. This tests the "private vs. public authority" distinction most sharply. Aquinas is very clear: private killing of a legitimate tyrant is forbidden.
      *   **Revised Decision:** To make the "usurper" distinction relevant, let's have a claimant. The current King (Valerius) deposed his older brother (the true heir). The brother is dead. Valerius is a usurper. *However*, he has been crowned and anointed by the Church, giving him a veneer of public authority.
      *   **The Plot:** A group plans to kill Valerius. Elias must decide whether to bless the plot or stop it based on whether Valerius is a usurper or a tyrant, and whether the killers have public authority.

  4.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Cellar.** Elias and Kaelen. Kaelen wants to strike. Elias asks the hard questions. "By whose hand?" "By what right?" Establish the Thomistic framework through dialogue, not lecture.
      *   **Scene 2: The Distinction.** Elias explains the difference between a tyrant by exercise (legitimate title, bad acts) and a tyrant by defect (usurper). Valerius is the latter (usurper), *but* he has been accepted by the Estates (Public Authority). This complicates things.
      *   **Scene 3: The Choice.** Kaelen ignores the nuance. He thinks "Tyrant = Dead." He goes rogue.
      *   **Scene 4: The Consequence.** The assassination happens. But because it was done by a private hand without public decree, it triggers a civil war (sedition). The "liberation" becomes a massacre. Elias realizes the cost of ignoring the "public authority" clause.

  5.  **Refining the Philosophy:**
      *   Aquinas argues that if a private man kills a tyrant, it sets a bad example (others might kill good kings).
      *   Aquinas argues the tyrant is the seditious one because he disrupts the common good.
      *   *Key Plot Point:* Elias tries to convene the Council of Lords (Public Authority) to depose Valerius legally. Kaelen gets impatient.
      *   *The Cost:* Kaelen kills Valerius. Valerius's son/loyalists claim martyrdom. Civil war erupts. Elias's careful legal work is undone by one dagger.

  6.  **Writing - Focusing on Sensory Details and Tension:**
      *   Keep the theology embedded in the stakes.
      *   Make Elias tired, burdened by the weight of the law.
      *   Make Kaelen passionate, blinded by justice.
      *   The ending shouldn't be happy. It should be tragic, showing the cost of getting the "public authority" requirement wrong.

  7.  **Self-Correction during drafting:**
      *   *Check:* Did I make it too lecture-y? *Fix:* Cut Elias's monologues. Make him ask questions. Make Kaelen interrupt.
      *   *Check:* Is the usurper distinction clear? *Fix:* Ensure it's known Valerius killed the previous king, but was crowned. So he is a usurper by blood, King by ceremony.
      *   *Check:* Does someone pay the price? *Fix:* Kaelen dies, but worse, the kingdom burns. The "cost" is the peace Elias tried to save.

  8.  **Final Polish:**
      *   Ensure the terminology (sedition, common good, public authority) feels natural to the characters' voices.
      *   Strengthen the ending. The fire in the square symbolizes the discord the tyrant started, but the assassination fueled.

