      *Policy:* AI-assisted drafting of prose/voice is ineligible. AI for brainstorming/polishing must be disclosed.

      *Wait, I need to make sure I don't sound like a lawyer.* Keep it literary.

      *Revised Plan:*
      1.  State decision (Decline).
      2.  Validate the writer's honesty (crucial for reputation).
      3.  Address the editorial split: The definition of "authorship" in fiction hinges on *voice*.
      4.  New Policy: Clear distinction between *assistive* and *generative*.

      *Let's go.*

      *(Final thought before drafting)*: Make sure to explicitly mention that Camp 1 isn't "wrong" about technology, but "wrong" about where the line of authorship lies for *this magazine*.

      *(Wait, looking at the prompt again)*: "be fair to whichever camp turns out wrong."
      If I reject, Camp 1 is wrong. I should say: "While the 'tool' perspective is valid for editing, it doesn't hold for voice generation."
      If I accept, Camp 2 & 3 are wrong.
      *Actually, the most sustainable path for a literary magazine is to Reject.* I will proceed with that. It's the standard ethical stance for 95% of lit mags right now.

      *Wait, is there a middle ground?* "Accept with conditions"? No, that's messy. How do you police it later?
