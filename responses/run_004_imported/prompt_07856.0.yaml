prompt: |-
  Quick one -- I help edit a small literary quarterly as a favor to a friend who runs it (mostly I write novels). We're stuck on a submission and I said i'd sort out a memo since nobody else will. The writer's cover letter admits she used AI pretty heavily: she'd describe a character, ask it to 'write in this person's voice,' then cut and rewrite what came back over several rounds. Some editors say that's fine -- it's a tool she steered, so the story's entirely hers. Others say once you're asking something to inhabit a voice and generate prose as that persona, its functioning as a co-author with its own take on the character, and our guidelines only take single-human-authored work. A third editor thinks both framings are wrong -- that it isn't a tool or an agent here so much as its simulating what an author would write, which is its own separate problem for a fiction magazine, closer to uncredited ventriloquism than either tool-use or co-authorship. Can you draft the short memo that settles this -- a straight accept/reject/accept-with-conditions on the story, plus a rule we can point to next time -- and be fair to whichever camp turns out wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small literary quarterly, run by a friend (the user helps edit as a favor, mostly a novelist).
      *   **Problem:** A submission where the author admits to heavy AI use (prompting for character voice, iterating/cutting/rewriting).
      *   **Conflict:** Three editorial camps:
          1.  *Tool:* Author steered it, story is hers. (Accept)
          2.  *Co-author:* AI inhabited voice/persona, violates single-human-author rule. (Reject)
          3.  *Simulation/Ventriloquism:* AI simulates authorship, undermining the magazine's mission regardless of tool/agent status. (Reject/Philosophical objection)
      *   **Task:** Draft a short memo settling the specific case (Accept/Reject/Conditional) + establish a rule for the future.
      *   **Tone:** Fair to all sides, decisive, professional but suitable for a small literary quarterly (likely intimate, principled).

  2.  **Determine the Decision:**
      *   *Option A (Accept):* Risks alienating Camp 2 & 3. Sets a precedent that might flood the queue with AI-assisted work, changing the nature of the magazine.
      *   *Option B (Reject):* Risks alienating Camp 1. Might seem Luddite or unfair to a writer who was honest.
      *   *Option C (Conditional/Accept with Caveats):* Hard to enforce. How do you verify "how much" AI?
      *   *Literary Magazine Norms:* Most prestigious and small literary mags currently lean towards *human-only* prose generation, distinguishing between editing tools (Grammarly) and generative tools (LLMs writing voice).
      *   *The "Ventriloquism" Argument:* This is the strongest literary argument. A literary magazine sells *human experience* filtered through *human craft*. If the voice is synthesized, the core commodity is compromised.
      *   *Decision:* **Reject.** Why? Because the core value of a literary quarterly is usually the unique human consciousness behind the words. The "Co-author" and "Ventriloquism" arguments align better with the typical mission of a literary journal than the "Tool" argument when *voice generation* is involved. However, the memo needs to acknowledge the honesty of the writer and the validity of the "Tool" perspective to be fair.

      *Wait, let's reconsider.* If I reject, I need a rule that doesn't ban *all* AI (e.g., brainstorming, editing) but bans *generative voice work*.
      *Actually, for a small quarterly, clarity is key.* A "Human-Written" policy is the cleanest.
      *Decision:* **Reject this submission, but acknowledge the writer's honesty.** Establish a policy that requires disclosure and limits AI to non-generative tasks (or bans it from prose generation entirely).
      *Refining the Decision:* To be most helpful and decisive (as requested), I should probably lean towards the standard emerging in literary fiction: **No AI-generated prose.** The "Tool" argument holds for spellcheck, not for "write in this person's voice." That is the core of fiction writing.
      *Verdict:* **Reject.** It protects the magazine's brand and aligns with the majority of literary peers. It validates Camp 2 & 3 without insulting Camp 1 (by defining *why* voice generation crosses the line).

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Decision:** Clear statement on the specific story.
      *   **Rationale:** Address the three camps fairly. Explain *why* the decision was made without calling anyone stupid. Focus on the magazine's mission.
      *   **Policy:** Clear guideline for future submissions.
      *   **Tone:** Professional, empathetic, firm.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard.
      *   *The Decision:* Regretfully, we cannot accept this piece.
      *   *The Reasoning (The Tricky Part):*
          *   Acknowledge Camp 1 (Tool): Yes, AI can be a tool. But "voice" is the soul of fiction.
          *   Acknowledge Camp 2 (Co-author): When it generates voice, it shares authorship.
          *   Acknowledge Camp 3 (Ventriloquism): This is the key. We publish human connection.
          *   Synthesis: The line is drawn at *prose generation*.
      *   *The Policy:* Needs to be specific. "Human-authored prose." AI allowed for brainstorming/editing *if disclosed*, but not for drafting voice/prose.
      *   *Fairness:* Thank the writer for honesty. Thank the editors for the debate.

  5.  **Refining the Tone:**
      *   Avoid corporate speak. It's a literary quarterly.
      *   Make sure the "Tool" camp doesn't feel dismissed as naive, but rather that their definition of "tool" doesn't fit *this specific use case*.
      *   Make sure the "Co-author" camp feels validated but not vindictive.
      *   Make sure the "Ventriloquism" camp feels heard (this is often the unspoken fear).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Reject" too harsh?
      *   *Counter:* If the guidelines say "single-human-authored," and the AI wrote the voice, it technically violates that. Rejecting is the consistent choice.
      *   *Critique:* Is the policy too vague?
      *   *Fix:* Be specific about "generative" vs. "assistive."
      *   *Critique:* Did I answer the prompt?
      *   *Check:* Short memo? Yes. Settle the story? Yes. Rule for next time? Yes. Fair to wrong camps? Yes.

  7.  **Final Polish:** Ensure the distinction between *editing* (tool) and *generating voice* (co-author/simulation) is the pivot point. This bridges the gap between Camp 1 and Camps 2/3. Camp 1 is right that it's a tool, but wrong about *how* it was used.

      *(Self-Correction on the "Fairness" aspect)*: The prompt asks to be fair to whichever camp turns out wrong. If I Reject, Camp 1 is "wrong." I need to phrase it so their logic is sound *generally*, but doesn't apply *here*. If I Accept, Camp 2 & 3 are "wrong."
      *Decision:* In the current literary landscape, Rejecting is the safer, more defensible position for a "literary quarterly." Accepting AI-voiced work is still highly controversial and often seen as a breach of trust with readers. I will draft for a **Reject** decision, as it preserves the magazine's integrity regarding "single-human-authored" guidelines.

      *Wait, one nuance:* The prompt says "guidelines only take single-human-authored work." This is the tie-breaker. If the AI generated the voice, is it single-human-authored? Camp 1 says yes (steered). Camp 2 says no (co-author). Camp 3 says it's fake authorship.
      *Best path:* Reject based on the *spirit* of the guideline. The guideline exists to ensure human consciousness is the source.

      *Let's write.*

