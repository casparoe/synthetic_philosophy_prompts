          *   Choice 2: (C) 11% \$1M, 89% \$0 vs. (D) 10% \$5M, 90% \$0. (Most pick D).
      *   *The Violation:* Expected Utility Theory (EUT) + Independence Axiom says if you prefer A over B, you must prefer C over D. The common 89% outcome should be "cancelled out."
      *   *The Psychology:* The "Certainty Effect." People overweight certainty.
      *   *Normative Status:* Is EUT/Independence *true* (normative) or just a model (descriptive)?

  3.  **Analyze the Specific Decision (Annuity vs. Lump Sum):**
      *   *Annuity:* Guaranteed income for life (Certainty).
      *   *Lump Sum:* Investable asset (Risk/Uncertainty + Control).
      *   *Actuarially Equivalent:* On paper, the Expected Value (EV) is the same.
      *   *The Parallel:* The user sees the "pull toward certainty" in the annuity similar to the \$1M sure thing in Allais.

  4.  **Evaluate the "Error vs. Feature" Question:**
      *   *View 1: It's an Error (Normative EUT).* If you want to maximize long-term wealth/utility and avoid dynamic inconsistency, you should follow Independence. Behavioral biases lead to suboptimal outcomes (e.g., paying too much for certainty).
      *   *View 2: It's a Feature (Non-EUT Normative).* Maybe Independence *isn't* the right standard for one-off, life-altering decisions. Regret theory, rank-dependent utility, or need-based thresholds might be more appropriate.
