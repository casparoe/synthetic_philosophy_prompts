      *   *Underdetermination of Theory by Evidence (UTE):* Standard philosophy of science. Multiple theories fit the data. We choose based on virtues (simplicity, etc.), but truth is not guaranteed. However, there *is* a fact of the matter (one theory is true, even if we don't know which).
      *   *Indeterminacy of Translation (IT):* Radical translation. No fact of the matter. Not just epistemic (we can't know), but ontological (there is nothing to know).
      *   *Key Distinction:* Epistemic vs. Ontological.
      *   *Key Argument:* The "Gavagai" example (rabbit vs. rabbit stage vs. undetached rabbit part).
      *   *Key Claim:* Behaviorism/Physicalism about meaning. If meaning isn't in the head or the world, but only in behavior, and behavior underdetermines meaning *in principle*, then there is no fact of the matter.

  3.  **Drafting the Comparison (Mental Outline):**
      *   **Introduction:** Acknowledge the friend's intuition (they look similar) but validate the user's suspicion (Quine insisted they were different).
      *   **Define Underdetermination (UTE):** Scientific theories. Data $D$ supports Theory $T_1$ and $T_2$. $T_1$ and $T_2$ are incompatible. *Crucial:* One is true, one is false. We just can't tell. Fact of the matter exists.
      *   **Define Indeterminacy (IT):** Translation manuals. Data $D$ (behavior) supports Manual $M_1$ and $M_2$. $M_1$ and $M_2$ are incompatible. *Crucial:* Neither is true or false. No fact of the matter.
      *   **The "Extra Strangeness":** Why is IT stronger?
          *   UTE = Epistemic limitation.
          *   IT = Ontological absence.
      *   **The Independent Claim:** What drives IT beyond UTE?
