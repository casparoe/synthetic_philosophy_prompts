answer: |-
  This is a classic and profound dispute in the philosophy of language. You should feel vindicated: **Quine explicitly agreed with you, not your friend.**

  While the structural similarity between the two theses is striking, Quine insisted that the Indeterminacy of Translation (IT) is a stronger, "stranger," and fundamentally different thesis than the Underdetermination of Theory by Evidence (UTE). Your friend has identified a strong analogy, but they have missed the metaphysical punchline Quine intended.

  Here is a careful comparison of the two ideas, the specific claim that separates them, and an assessment of whether that claim holds water.

  ---

  ### 1. Underdetermination of Theory by Evidence (UTE)
  **The Thesis:** For any finite body of empirical evidence, there are always multiple, logically incompatible scientific theories that can account for that evidence equally well.

  **The Status of Truth:** Crucially, under UTE, **there is a fact of the matter.** Even if Theory A and Theory B both fit all possible data, standard scientific realism holds that one of them is *true* and the other is *false* (or that they are merely notational variants of the same truth). Our inability to distinguish them is an **epistemic limitation** (a limitation of knowledge), not an ontological one (a limitation of reality).

  **Example:** Imagine two theories of particle physics that predict exactly the same experimental outcomes but posit different underlying mechanisms. A realist says, "One of these mechanisms is actually how the universe works, even if we can never run an experiment to prove which one."

  ### 2. Indeterminacy of Translation (IT)
  **The Thesis:** In the scenario of "radical translation" (translating a completely unknown language with no prior dictionaries), there are multiple, logically incompatible translation manuals that are compatible with all possible behavioral evidence (speech dispositions).

  **The Status of Truth:** Here is the divergence. Quine argues that with IT, **there is no fact of the matter.** It is not that we cannot *know* which manual is correct; it is that there *is* no correct one. Meaning is not a hidden entity waiting to be discovered. If two manuals account for all behavioral dispositions equally well, neither is "true" and neither is "false." They are simply different ways of mapping one language onto another.

  **Example (Gavagai):** A native says "Gavagai" when a rabbit runs by.
  *   **Manual 1** translates "Gavagai" as "Rabbit."
  *   **Manual 2** translates "Gavagai" as "Undetached rabbit part."
  *   **Manual 3** translates "Gavagai" as "Temporal stage of a rabbit."

  Behaviorally, these are identical (whenever there is a rabbit, there is a rabbit part and a rabbit stage). Quine argues that unlike the physics example, there is no "meaning fact" in the native's head or in the world that makes Manual 1 the *true* translation. Meaning is exhausted by behavior; if behavior doesn't distinguish them, nothing does.

  ### 3. The Crucial Divergence: Epistemic vs. Ontological
  Your friend argues that IT is just a "special case" of UTE. Quine's counter-argument is that UTE is **epistemic**, while IT is **ontological**.

  *   **UTE:** "We can't tell which theory is true." (Truth exists beyond evidence).
  *   **IT:** "There is no truth to be told." (Truth is *constituted* by evidence).

  Quine summarized this distinction in his 1970 paper, *On the Reasons for the Indeterminacy of Translation*:
  > "Underdetermination leaves the truth value of the theory undetermined... Indeterminacy of translation... denies that there is any such truth value to be left undetermined."

  If your friend is right, then there is a "True Meaning" of *gavagai* that we just can't access. If Quine is right, the question "But what does he *really* mean?" is a meaningless question, like asking "Is the number 7 green?"

  ### 4. The Independent Claim: What Makes IT "Stranger"?
  For IT to be stronger than UTE, it must rest on a premise that UTE does not require. That premise is **Quine's Behaviorism regarding Meaning.**

  To get from "evidence underdetermines theory" to "there is no fact of the matter," you need to claim that **meaning is nothing over and above behavioral dispositions.**

  1.  **Rejection of the "Museum Myth":** Quine rejects the idea that meanings are mental objects (ideas, concepts, Fregean senses) stored in the mind. If meanings were mental objects, then presumably the native has a specific mental object associated with *gavagai*. Even if we can't see it, it would exist, making IT just UTE.
  2.  **Physicalism/Naturalism:** Quine insists that if there is a fact of the matter about meaning, it must be physical. The only physical facts available are the native's sensory stimulations and speech dispositions.
  3.  **The Conclusion:** Since the physical facts (behavior) underdetermine the translation, and there are no *non-physical* facts (mental meanings) to appeal to, there are simply no further facts.

  **So, the "extra strangeness" comes from the claim that semantics has no ontology.** Physics describes the world, so there is a world to be right or wrong about. Translation describes the mapping of words to the world, but Quine argues this mapping is not fixed by the physical facts.

  ### 5. Is the Claim Defensible?
  This is where the debate stands today. Quine's argument is valid (if you accept his premises, the conclusion follows), but his premises are highly controversial.

  **Arguments Against Quine (Your Friend's Camp):**
  *   **Chomsky's Mentalism:** Noam Chomsky argued that Quine's behaviorism is scientifically obsolete. Cognitive science suggests the brain contains rich, innate structures and representations. If the native's brain contains a specific syntactic/semantic structure corresponding to "rabbit" rather than "rabbit part," then there *is* a physical fact of the matter, accessible via neuroscience if not behavior. This reduces IT back to UTE.
  *   **Intuition:** Most people have a strong intuition that when they mean "rabbit," they do not mean "rabbit stage." Quine asks us to abandon this intuition as a philosophical illusion.
  *   **Kripke's Wittgenstein:** Saul Kripke offered a skeptical paradox similar to Quine's but argued that Quine's "behaviorist solution" was too thin. Kripke suggested meaning is grounded in social norms, not just individual dispositions, which changes the landscape but still challenges Quine's specific behaviorism.

  **Arguments For Quine (Your Camp):**
  *   **Externalism:** Quine is a forefather of semantic externalism (later developed by Putnam and Burge). If meaning isn't "in the head," where is it? If it's in the causal relation to the world, Quine's "gavagai" argument shows that causal relations are also indeterminate between objects and parts.
  *   **Naturalism:** If you are a strict naturalist (believing only in what physics posits), it is hard to locate "meanings" as entities. If you can't find the "meaning fact" in the brain or the world, Quine's conclusion that there is no fact is a honest admission of that void.
  *   **The Proxy Function:** Quine showed mathematically (using proxy functions) that you can systematically permute the ontology of a theory without changing its empirical predictions. This suggests the indeterminacy is structural and logical, not just a lack of data.

  ### Verdict
  You win the exegesis, but the metaphysics is still up for grabs.

  1.  **Exegetically:** You are correct. Quine did not view Indeterminacy as a special case of Underdetermination. He viewed Underdetermination as a problem of **knowledge** and Indeterminacy as a problem of **substance**.
  2.  **Philosophically:** Your friend's position is actually the more popular one in contemporary cognitive science and philosophy of mind. Most philosophers today reject Quine's strict behaviorism. They argue that if we include facts about internal neural states (not just external behavior) as part of the "evidence," the indeterminacy shrinks or vanishes, turning IT back into UTE.

  **How to resolve the argument:**
  Tell your friend: "Quine agrees with you that the *structure* of the argument is the same. But he insists the *metaphysical consequence* is different. Underdetermination says 'We can't know the truth.' Indeterminacy says 'There is no truth.' The difference rests entirely on whether you believe 'meanings' are real entities (like neurons or concepts) or just useful fictions derived from behavior. If meanings are real, I'm wrong and you're right. If meanings are just behavioral dispositions, Quine is right."

  This shifts the debate from Quine interpretation (where you are right) to the philosophy of mind (where the battle is still being fought).
