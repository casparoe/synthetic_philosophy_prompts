      *   **User's Position:** IT is a stronger/stranger thesis than UTE, but they couldn't articulate *why*.
      *   **Task:** Compare UTE and IT carefully. Determine if IT is just a special case of UTE or if it rests on a further, independent claim. If the latter, identify that claim and assess its defensibility.

  2.  **Initial Knowledge Retrieval & Structuring:**
