          *   *Korsgaard (Kantian/Constitutive):* Reasons stem from our identity as reflective agents. If you value your humanity (or specific practical identities like "brother"), you have reasons regardless of contingent desires.
          *   *Michael Smith (Rationalist Internalism):* Idealizes the agent. If your *rational counterpart* (fully informed, coherent) would want you to $\phi$, you have a reason to $\phi$, even if current-you doesn't care.

  3.  **Apply to Scenario (a): Was the user's claim true/meaningful?**
