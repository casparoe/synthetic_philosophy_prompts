answer: |-
  To distinguish these two metaphysical failures in a psychologically realistic way, we must look at the **basis** of the disposition (the internal state constituting the courage) and the **manifestation** (the brave act).

  Let us establish your character: **Elara**, a veteran hostage negotiator. Her long-established courage is defined as *the disposition to enter a lethal danger zone when doing so offers the only chance of saving a life.*

  The triggering condition ($C$) is the moment the gunman threatens to execute a hostage unless Elara enters the room unarmed.
  The manifestation ($M$) is Elara opening the door and stepping through.

  Here is how that disposition fails in two metaphysically distinct ways.

  ### 1. Masked Courage: The "Circuit Breaker" Failure

  In this scenario, Elara's courage is **real and present** at the moment of the test, but an independent interfering factor prevents the action from manifesting. The disposition exists, but its expression is blocked.

  **The Scene:**
  The gunman screams the ultimatum. Elara feels the familiar surge of adrenaline and resolve. Her valuation of the hostage's life over her own safety is intact; her willingness to die is active. She forms the intention to move. However, exactly as she reaches for the door handle, she experiences a sudden, violent **dissociative freeze**.

  **The Metaphysical Distinction:**
  For this to be a *mask* and not cowardice, the freeze must not be caused by fear of the gunman. It must be an independent mechanism that intercepts the signal between her volition and her action.
  *   **The Basis Remains:** If you were to pause time at the moment of her failure and probe her psyche, you would find the courage fully intact. She *would* have gone in if not for the interference.
  *   **The Interfering Factor:** Let's say Elara has a latent, unrelated neurological condition triggered by specific high-frequency sounds (perhaps the gunman's voice hits a specific pitch). This sound triggers a "circuit breaker" in her motor cortex.
  *   **The Counterfactual Test:** If the gunman had shouted the same threat in a whisper (removing the mask but keeping the danger), Elara *would* have entered. The courage was sufficient; the channel was blocked.

  **Why it isn't Cowardice:**
  Cowardice implies the disposition to flee or the absence of the disposition to advance. Here, the disposition to advance is present, but the *manifestation* is suppressed by an extrinsic or unrelated intrinsic factor. Psychologically, Elara experiences this as a terrifying imprisonment within her own body; she is screaming internally to move, but the "wire" is cut. The courage didn't desert her; it was muted.

  ### 2. Finkish Courage: The "Sugar Glass" Failure

  In this scenario, the triggering condition itself **causes the disposition to vanish** before the action can occur. The courage is real *until* the moment it is tested, but the test itself destroys the psychological state that constitutes the courage.

  **The Scene:**
  The gunman screams the ultimatum. For years, Elara's courage has been robust in training and in previous standoffs. However, her courage is structurally dependent on a sense of **professional detachment**. She is brave only so long as she perceives herself as the "controller" of the scenario—the expert managing the variable.
  The moment the gunman demands she enter *unarmed*, the nature of the threat shifts from "manageable risk" to "total vulnerability." This specific shift (the trigger) instantly shatters her sense of detachment. She does not freeze; rather, her internal state fundamentally changes. The "Elara" who is capable of bravery ceases to exist in that instant, replaced by a version of herself that is purely self-preserving.

  **The Metaphysical Distinction:**
  For this to be *finkish* and not merely masked, the stimulus must alter the intrinsic properties of the subject.
  *   **The Basis Vanishes:** If you were to pause time at the moment of failure, you would find the courage is *gone*. It is not blocked; it has been deleted. The stimulus (the demand for vulnerability) caused the loss of the disposition (the willingness to act).
  *   **The Feedback Loop:** Unlike the mask, there is no competing force stopping her. There is simply no longer any "her" there to do the brave thing. The condition required for her courage (detachment) is incompatible with the condition required for the test (vulnerability).
  *   **The Counterfactual Test:** If the gunman had whispered the threat (removing the "mask" of sound), Elara *still would not* have entered. Why? Because the *content* of the threat (unarmed entry) was the finkish stimulus that dissolved her courage. Even with no interference, the disposition would not have manifested because the disposition no longer exists at the critical moment $t$.

  **Why it isn't Cowardice:**
  This is the harder distinction to sell, as it looks like cowardice from the outside. To avoid the cliché of "hidden cowardice," you must emphasize that her previous courage was not a lie. It was a **fragile real property**.
  Think of a piece of sugar glass. It is genuinely hard (fragile disposition) until it touches moisture (the trigger), at which point it instantly dissolves. It doesn't turn out it was "always liquid"; the contact with the trigger changed its state. Elara's courage was genuine, but it was *finkishly sensitive* to the specific nature of the test. She didn't choose to be a coward; the situation altered the psychological chemistry that made bravery possible.

  ### Summary for the Novel

  *   **In the Masked failure:** Elara tries to open the door, but her hand won't obey. She feels the courage burning in her chest, but she is a passenger in a frozen body. The tragedy is **impotence**.
  *   **In the Finkish failure:** Elara reaches for the door, and in the moment her hand touches the handle, the *reason* to open it evaporates. The resolve doesn't get blocked; it dissipates like smoke in a wind. She steps back not because she is stopped, but because the person who would have stepped forward is no longer there. The tragedy is **dissolution**.
