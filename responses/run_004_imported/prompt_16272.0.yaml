answer: |-
  **Title:** The Integrity of Action: Anscombe, Truman, and the Limits of Consequentialism

  Elizabeth Anscombe's 1956 protest against Oxford's awarding of an honorary degree to Harry Truman is not merely a historical footnote; it is a philosophical grenade tossed into the comfortable machinery of Just War theory. Her pamphlet, *Mr. Truman's Degree*, strips away the euphemisms of statecraft to level a charge that remains as incendiary today as it was seventy years ago: that the atomic bombings of Hiroshima and Nagasaki constituted murder. Anscombe's argument rests on a deontological bedrock—the claim that certain actions are intrinsically forbidden regardless of their consequences—specifically targeting the intentional killing of the innocent. While her absolutism invites charges of moral rigidity and her reliance on the distinction between intention and foresight is often derided as semantic manipulation, a rigorous examination suggests that Anscombe's verdict is not only theoretically coherent but historically robust. The charge of murder against Truman is sustainable, not merely because absolutism is the correct meta-ethical framework, but because even the most charitable consequentialist or "supreme emergency" readings of the event fail to exonerate the decision.

  To understand the force of Anscombe's accusation, one must grasp her specific deployment of the Doctrine of Double Effect (DDE). The DDE permits actions that have both good and bad effects provided the bad effect is not intended as an end or a means. Anscombe argues that the atomic bombings fail this test catastrophically. In standard strategic bombing, one might argue that the destruction of a munitions factory is the intended means, and the death of nearby civilians is a foreseen but unintended side effect. At Hiroshima and Nagasaki, however, there was no distinct military target whose destruction would logically compel surrender independent of the civilian carnage. The mechanism of coercion was the terror and devastation inflicted upon the population itself. The deaths were not a byproduct of the strategy; they were the strategy. For Anscombe, to choose the death of innocents as the lever to move the enemy's will is to intend their death. If the killing is intended, and the victims are non-combatants, the act is murder. No calculus of lives saved in a hypothetical invasion of the Japanese mainland can sanitize an intrinsically evil act.

  The most common philosophical objection to this line of reasoning attacks the stability of the intention/foresight distinction. Critics argue that the distinction is vulnerable to "redescription." A defender of Truman might argue that he did not intend "the death of civilians" but rather "the breaking of the Japanese will to resist." On this reading, death is merely the reliable indicator that the will is being broken, not the intention itself. If this redescription holds, the DDE might be satisfied, and the moral culpability diluted. However, this objection collapses under scrutiny. One cannot separate the breaking of the will from the killing of the people in this context. The terror required to force surrender was generated precisely by the spectacle of mass death. To say "I intend to break their will by killing them, but I do not intend the killing" is a contradiction in terms. Anscombe anticipates this maneuver; she insists that if the causal pathway to the good end runs *through* the bad effect, the bad effect is intended. Since the surrender was to be extracted *via* the devastation of the civilian centers, the devastation was the means. The redescription objection attempts to hide the moral reality of the act behind a veil of psychological abstraction, but Anscombe's focus on the structure of the action itself exposes the deceit.

  A more potent objection concerns the stakes. Anscombe's absolutism forbids the intentional killing of the innocent even if doing so would save a greater number of innocents. To many students, and indeed to many moral philosophers, this seems untenable. If Truman could have saved a million lives by killing 100,000, does morality really demand he refrain? This is the threshold deontologist's challenge: surely absolute prohibitions must crumble when the stakes climb arbitrarily high. To concede this point is to admit that Anscombe's framework risks moral monstrosity in the face of catastrophe. However, to reject Anscombe here is to open a door that cannot be closed. Once we admit that innocent life is a negotiable currency in a utilitarian calculus, the protection of non-combatants becomes contingent on the subjective assessments of commanders. The strength of Anscombe's position is that it places a firewall around the innocent that no amount of political expediency can breach. While the discomfort of her absolutism is real, it is a necessary discomfort. It forces the moral agent to recognize that they are not the masters of the universe, licensed to do evil that good may come. If we cannot sustain the prohibition against murdering innocents at high stakes, we cannot sustain it at all.

  Nevertheless, one need not be a full-blooded Anscombian absolutist to uphold her verdict on Truman. This brings us to the objection rooted in Michael Walzer's concept of "supreme emergency." Walzer, unlike Anscombe, allows for the suspension of war conventions when a community faces an imminent threat of enslavement or annihilation. Even if one rejects Anscombe's absolutism, one might argue that Truman faced a supreme emergency that licensed the bombing. Yet, this argument falters on historical grounds. By August 1945, Japan's defeat was scarcely in doubt. The naval blockade was strangling the island, the Soviet Union was poised to enter the Pacific theater, and conventional bombing had already devastated Japanese cities. The "invasion of the mainland" scenario, often cited as the alternative necessitating the bomb, was not the only path to victory, nor was it inevitable. If the emergency was not "supreme" in the sense of being the *only* alternative to national destruction, then the Walzerian exception does not apply. Consequently, even a non-absolutist framework that permits the violation of non-combatant immunity in extremis finds no purchase here. The bombings were not a tragic necessity forced by impending doom; they were a choice among other viable, albeit slower, options.

  Therefore, the convergence of Anscombe's theoretical rigor and the historical record leads to a singular conclusion. The attempt to redescribe the intention fails because the killing was the mechanism of coercion. The appeal to high stakes fails because absolutism cannot be breached without destroying the concept of non-combatant immunity entirely. And the appeal to "supreme emergency" fails because the historical necessity was illusory. Anscombe's charge is not merely the outcry of a rigid conscience; it is a precise moral diagnosis. To argue that Truman was justified is to argue that the ends of state security can transmute the murder of innocents into a virtue. Anscombe refuses this alchemy.

  The verdict, then, is clear: Anscombe's charge of murder is sustainable. It holds up under the pressure of redescription, it withstands the utilitarian appeal to consequences, and it is bolstered by the historical lack of necessity. This conclusion is unsettling, as it should be. It implies that a head of state can commit a moral atrocity while acting within the perceived interests of his nation. But to deny this is to subordinate morality to power. Anscombe's pamphlet remains a vital pedagogical tool precisely because it denies us the comfort of a clean conscience in the face of "necessary" evils. Truman may have ended a war, but on Anscombe's accounting, he did so with bloodied hands that no honorary degree could wash clean. In a world eager to justify the unjustifiable through the calculus of outcomes, her refusal to count the bodies is the only moral stance that respects the humanity of the dead.
