answer: |-
  Here are two options that rely on specific arguments from *Marriage and Morals* rather than generic biographical jabs. They reframe his behavior through the lens of his philosophy to show that, internally at least, his logic was consistent even if his life was messy.

  **Option 1: The "Jealousy is a Learned Habit" Angle**
  This one works best if you want to lean into his psychological arguments about possessiveness.

  > "Tell Priya she's misinterpreting the data. Russell argued jealousy is a social construct, not biology. So his personal life wasn't hypocrisy; it was aggressive exposure therapy. He wasn't cheating; he was trying to prove you can unlearn the bourgeois concept of ownership if you test the boundaries enough."

  **Option 2: The "Marriage is for Children, Not Sex" Angle**
  This one targets his structural definition of what marriage is actually *for*.

  > "Russell's whole thesis was that marriage is a child-rearing partnership, not a sexual monopoly. So pointing at his affairs to debunk him is like criticizing an architect for sleeping in a different room than the blueprint. He wasn't breaking the structure; he just didn't think the 'sexual exclusivity' wall was load-bearing."

  **Why these work:**
  *   **Option 1** requires knowing his specific claim that jealousy is *trained* into us (and can be untrained), rather than being a natural instinct.
  *   **Option 2** requires knowing his distinction between the "companionate" purpose of marriage (raising citizens) versus the romantic/sexual purpose.

  Either of these should signal to Priya that you aren't just defending the man, you're defending the nuance of the text.
