answer: |-
  This is a profound observation, and you have put your finger on the central tension in Hobbes's entire project. It is rare for a reader to connect the methodological claim in Chapter 4 (about geometry and definitions) to the political claim in *Leviathan* (about the artificial nature of the Commonwealth), and rarer still to test that claim against lived experience in governance.

  Your co-op's experience is not a failure of your specific group; it is a vindication of the limits of Hobbes's rationalism. To answer your question: Hobbes's argument implies that self-construction *should* grant certainty, but his own life story (the squaring of the circle) and the reality of your co-op suggest that this confidence is often a dangerous illusion.

  Here is an analysis of the implications of Hobbes's argument for your situation, and why his geometric blind spot should indeed make you more skeptical of the analogy.

  ### 1. The Hobbesian Promise: *Verum Factum*
  Hobbes is operating on a principle later named by Vico: *verum et factum convertuntur* ("the true and the made are convertible"). The logic is elegant:
  *   **Natural Philosophy (Physics):** God made the world. We observe the effects (motion, gravity) but cannot know the ultimate causes with certainty because we did not build the machine.
  *   **Geometry:** We define the points and lines. We construct the figures. Therefore, we know the causes perfectly. If I draw a circle, I know exactly what properties it must have because I defined it.
  *   **Civil Philosophy:** The Commonwealth is not natural; it is artificial. We construct it via covenant. Therefore, like geometry, we should be able to deduce its properties with certainty.

  **The Implication for your Co-op:**
  You assumed that because you wrote the rules, you possessed a "God's eye view" of how they would function. You expected that because you were the *authors*, you would also be the ultimate *interpreters* without dispute. Hobbes would say that if you defined your terms as precisely as a geometer defines a triangle, disputes would be impossible.

  ### 2. Where the Analogy Breaks: The Medium of Construction
  The reason your rulebook generated unexpected disputes is that Hobbes underestimated the medium in which a commonwealth is constructed.
  *   **Geometry** is constructed in the imagination using silent, perfect definitions. A "line" has no width. A "point" has no dimension.
  *   **The Commonwealth** is constructed using **language** and **human passion**.

  Ironically, in that very same Chapter 4 of *Leviathan*, Hobbes spends pages lamenting the instability of language. He calls metaphors "ignes fatui" (foolish fires) and notes that words are liable to ambiguity. Yet, he proceeds to build his political science on top of this wobbly foundation.

  **Implication:** You cannot expect geometric certainty from rules written in natural language. When you wrote "reasonable noise levels" or "fair contribution," you were not drawing lines; you were invoking concepts that change shape depending on who is looking at them. The "construction" of the rule is not finished when you write it; it is reconstructed every time a resident reads it.

  ### 3. The Irony of the Squared Circle
  Your mention of Hobbes's feud with John Wallis is crucial. Hobbes believed he had squared the circle (constructing a square with the same area as a given circle using only a finite number of steps with compass and straightedge). It was mathematically impossible (proven later in 1882), and Wallis showed him why repeatedly. Hobbes never conceded.

  **Why this matters for your co-op:**
  Hobbes's stubbornness reveals a psychological trap inherent in his philosophy. Because he believed geometry was a realm of *self-made certainty*, he could not conceive that he might be wrong. If *I* made the definitions, and *I* followed the logic, the conclusion *must* be true. If the experts say otherwise, they are the ones in error.

  **The Skeptical Lesson:**
  The fact that Hobbes failed in the one domain he claimed was infallible suggests that **self-construction does not guarantee self-knowledge.**
  *   You may think you built a triangle, but you actually built a slightly curved shape.
  *   You may think you wrote a clear rule, but you actually wrote a contradiction.

  If Hobbes could be blind to error in geometry, you are certainly liable to be blind to error in your rulebook. The feeling of "we made this, so we know how it works" is a cognitive bias, not an epistemological guarantee. It creates a dogmatism that prevents you from seeing the "bugs" in your own code.

  ### 4. Predictive Certainty vs. Adaptive Governance
  So, how much predictive certainty are you entitled to expect? Hobbes's argument, tempered by his failure and your experience, suggests the answer is: **Very little.**

  Here are three specific implications for your governing committee:

  **A. Expect "Unintended Geometries"**
  In geometry, if you draw three lines, you get a triangle. In governance, if you write three rules, you get a system of incentives, loopholes, and interpretations you didn't design.
  *   *Hobbesian view:* The Sovereign interprets the law.
  *   *Co-op reality:* The residents interpret the law.
  *   *Advice:* Stop trying to write rules that anticipate every scenario (the "demonstrative" approach). Instead, write rules that establish a *process* for resolving scenarios you couldn't anticipate. Shift from "legislating outcomes" to "designing dispute resolution."

  **B. The Construction is Never Finished**
  Hobbes viewed the Covenant as a singular, foundational moment. Once the Commonwealth is born, the structure is set. Your experience shows that a co-op is more like a garden than a geometric figure. It grows, weeds appear, the soil changes.
  *   *Advice:* Abandon the idea that the rulebook is a finished "construction." Treat it as a living document. The certainty Hobbes sought is static; the certainty you need is dynamic (i.e., confidence in your ability to *fix* the rules, not that the rules are perfect).

  **C. Beware the Hubris of the Designer**
  Hobbes's refusal to listen to Wallis is the ultimate warning. When designers believe their system is logically airtight because they designed it, they become tyrannical when reality pushes back. They blame the users (the residents) for not understanding the "perfect" system, rather than blaming the system for not fitting the users.
  *   *Advice:* When a dispute arises, assume the *rule* is ambiguous, not that the *resident* is irrational. Hobbes thought geometry was certain; Wallis knew math was hard. Be like Wallis. Trust the external feedback (the disputes) over your internal confidence (the design).

  ### Conclusion
  You asked whether Hobbes's blind spot in geometry should make us more skeptical of the analogy. **Yes, emphatically.**

  Hobbes argued that because we make the commonwealth, we can know it like we know geometry. But his life proved that even in geometry, we cannot trust our own constructions without external verification. If he could not square the circle, you cannot "square the co-op."

  The lesson for your committee is to abandon the search for **demonstrative certainty**. You are not geometers drawing lines on a blank page; you are gardeners working with living soil. The rules you write are not axioms; they are hypotheses. When they generate disputes, that is not a failure of the residents to understand your design; it is data showing that the design does not match the reality.

  Hobbes wanted a politics without surprise. Your experience confirms that a politics without surprise is impossible. The goal of your rulebook should not be to prevent disputes through perfect logic, but to manage them through fair process. That is the only "certainty" available to us.
