      *   *Nuance:* Make sure Marcus doesn't just say "logic doesn't apply." He needs to explain *how* it works without truth conditions (e.g., coherence of degrees of belief).
      *   *Nuance:* Make sure Elena doesn't just say "context shifts." She needs to emphasize that this is a feature of language, not a bug.

  6.  **Writing the Dialogue (Iterative Process):**
