prompt: |-
  I'm on my hospital's ethics committee, and this week's case hits closer to home than I'd like, since my own mom was just diagnosed with early Alzheimers this spring. Our patient wrote a directive eight years ago, while fully competent, refusing a feeding tube or antibiotics once she no longer recognized her own kids -- comfort care only. She's there now: doesn't know her son, can't hold a conversation, but she still hums along to her old records and eats happily off a spoon most days, and she's just come down with aspiration pneumonia. Half the family wants the directive honored as written; the other half says the woman who signed it and the woman in the bed now are different enough, psychologically, that it shouldn't just automatically bind her -- that this person, who actually exists and seems content, would choose differently. Our policy says a directive controls "absent clear and convincing evidence the patient would decide otherwise now," language clearly written for patients who can still talk, not this. Could you draft the short opinion I'll circulate before we meet Thursday: a concrete recommendation on the pneumonia and the bigger feeding-tube decision behind it, with a timeframe, that actually engages the "she's not that person anymore" argument instead of just citing the directive's legal weight?
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Context:** Personal connection (mother recently diagnosed with early Alzheimer's), making the case emotionally resonant but requiring professional objectivity.
      *   **Case:** Patient with advanced dementia (doesn't recognize kids, can't converse, but enjoys music/food). Has an advance directive (AD) from 8 years ago (competent at time) refusing feeding tubes/antibiotics once she doesn't recognize her kids. Currently has aspiration pneumonia.
      *   **Conflict:** Half family wants to honor AD (comfort care only). Half family argues "discontinuity of self" (the person now is different/content, wouldn't choose the same).
      *   **Policy:** AD controls *unless* "clear and convincing evidence the patient would decide otherwise now." Policy acknowledges difficulty with non-verbal patients.
      *   **Task:** Draft a short opinion for circulation before the Thursday meeting.
      *   **Requirements:** Concrete recommendation on pneumonia (antibiotics) and feeding tube decision, include a timeframe, and *specifically engage* the "she's not that person anymore" argument (not just legalistic citation).

  2.  **Determine the Ethical Framework:**
      *   **Autonomy (Precedent):** The Advance Directive represents precedent autonomy. The patient, when competent, made a specific decision based on specific triggers ("no longer recognized her own kids").
      *   **Beneficence/Non-maleficence:** Treating pneumonia relieves suffering (dyspnea, fever) but may prolong a state the patient deemed unacceptable. Feeding tubes in advanced dementia generally do not improve survival or quality of life and can cause harm (restraints, infection).
      *   **The "Discontinuity of Self" Argument:** This is the core philosophical challenge. Does the "demented self" override the "competent self"? Most bioethics leans towards honoring the competent self's values *unless* there is evidence of current suffering or a change in values *while competent*. The "happy dementia patient" argument is common but ethically tricky.
      *   **Policy Interpretation:** "Clear and convincing evidence" usually means statements made *while competent* indicating a change of mind, not the current state of the incapacitated patient.

  3.  **Drafting Strategy - Tone and Structure:**
      *   **Tone:** Professional, empathetic, nuanced, decisive but collaborative. Acknowledge the difficulty (especially given the personal note, though maybe keep the personal note out of the formal draft to maintain objectivity, or acknowledge the weight of the issue generally). *Decision: Keep it professional. The prompt asks for the opinion to circulate, not a personal diary entry. However, the empathy should shine through.*
      *   **Structure:**
          1.  Case Summary (brief).
          2.  Ethical Analysis (addressing the "two selves" argument).
          3.  Policy Application.
          4.  Recommendation (Antibiotics, Feeding Tube, Timeframe).
          5.  Process for Family Consensus.

  4.  **Addressing the "Two Selves" Argument:**
      *   This is the critical part. I need to explain *why* the directive holds weight despite the patient's current apparent contentment.
      *   *Key point:* The directive wasn't just about "misery"; it was about *identity* ("once she no longer recognized her own kids"). That trigger has been met.
      *   *Key point:* Current contentment (humming, eating) does not equal "competent revision of values." We cannot infer a change of will from a condition that prevents forming a will.
      *   *Key point:* Treating the "current self" against the "past self's" explicit instructions violates the autonomy of the person who planned for this.

  5.  **Formulating the Recommendation:**
      *   **Pneumonia:** This is acute. Comfort care is an option, but antibiotics can be palliative (reduce dyspnea). However, the AD says "no antibiotics." Recommendation: Honor AD. Focus on symptom management (oxygen, morphine for air hunger) rather than curative intent.
      *   **Feeding Tube:** AD refuses it. Evidence shows tubes don't help in advanced dementia. Recommendation: Do not place. Continue hand feeding (which she enjoys) as comfort care.
      *   **Timeframe:** Need to decide soon given pneumonia. 24-48 hours for family discussion, then implement.
      *   **Policy:** The "clear and convincing evidence" threshold is not met by the family's observation of her humming. That is not evidence of a *change of mind*, but evidence of *current state*.

  6.  **Refining the Draft (Self-Correction during drafting):**
      *   *Critique:* Is it too cold?
      *   *Fix:* Add language acknowledging the family's love and the difficulty of watching her enjoy small pleasures while denying life-prolonging treatment.
      *   *Critique:* Is the "Two Selves" argument addressed deeply enough?
      *   *Fix:* Dedicate a specific paragraph to the philosophical tension. Use the concept of "Ulysses Contract" or "Precedent Autonomy."
      *   *Critique:* Is the recommendation concrete?
      *   *Fix:* Explicitly state: No antibiotics, No PEG tube, Hand feeding continues, Palliative sedation if needed.

  7.  **Final Polish:**
      *   Ensure it sounds like an Ethics Committee Chair or Member writing to colleagues.
