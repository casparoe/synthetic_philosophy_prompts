  *(Self-Correction Note)*: I need to be careful with Pereboom's specific terminology. He talks about "friendship and love" being compatible with hard incompatibilism, but "resentment" specifically is the target. He replaces it with "moral protest" which is a communicative act aimed at moral formation, not retribution. I need to make sure David articulates that distinction clearly. Sarah needs to push on whether that communicative act *is* a reactive attitude or a disguised objective one.

