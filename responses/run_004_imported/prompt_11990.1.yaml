answer: |-
  My appendix tried to argue against its own removal. "I'm a safe house for beneficial bacteria!" it pleaded. "I contribute to the system! I have a function!"

  I held up a hand. "Hold on. Cummins says yes, but Wright says unless you were *selected* for that, you're just a spandrel."

  The appendix panicked. "So I'm doing the work, but I don't have the job?"

  "Exactly," I said. "You're like an intern who invented a profitable product line but wasn't hired to do it. We're not firing an employee; we're just realizing you were never on the payroll."

  The appendix sighed. "So I'm not vestigial. I'm just unpaid."

  "Worse," I said. "You're a causal contribution with no etiological tenure."
