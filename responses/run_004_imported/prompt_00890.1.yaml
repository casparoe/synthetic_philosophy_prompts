answer: |-
  You are not imagining it, and it isn't just sloppy conflation—but the distinction is subtle enough that even good histories of analytic philosophy sometimes blur it.

  Here is the breakdown of the moving parts so you can write about this without getting tangled.

  ### 1. Two Regresses, One Structure
  You have correctly identified two distinct deployments of the argument. They share a logical structure (the need for a "tie" to connect the tie), but they have different targets and stakes.

  *   **Bradley's Regress (Ontological):** In *Appearance and Reality*, Bradley is arguing against **pluralism**. His target is the reality of relations. If $A$ is related to $B$ by $R$, $R$ must be related to $A$ (by $R_1$) and to $B$ (by $R_2$). This launches an infinite regress. Bradley's conclusion: Relations are contradictory appearances; only the Absolute (a relationless whole) is real.
  *   **Russell's Problem (Logical/Semantic):** In *Principles of Mathematics* and later, Russell is arguing for **pluralism** (specifically, the reality of external relations). His target is the **unity of the proposition**. If a proposition is just a list of terms ($Socrates$, $Wisdom$, $Exemplification$), what makes it a *proposition* (something true or false) rather than a mere list? If the relation is just another term, the unity vanishes.

  **The Connection:** It is not conflation; it is combat. Russell recognized that if he could not solve the "Unity of the Proposition" problem, Bradley wins. If relations are just inert terms sitting next to each other, they don't *relate*, and Bradley's ontological conclusion follows. Russell's entire early project was essentially: "How do we make relations real without triggering Bradley's regress?"

  So, when you see them treated as the same problem, it's because Russell treated the *logical* problem of propositional unity as the key to defeating Bradley's *metaphysical* regress.

  ### 2. Frege's "Unsaturated" Move
  Frege's distinction between **Object** (saturated) and **Concept** (unsaturated) is an attempt to block the regress by category mistake.

  *   **The Move:** Frege argues that the regress arises only if you treat the predicate/concept as an object. If concepts are essentially "unsaturated" (they contain a gap that the object fills), then you don't need a further relation to glue them together. The "glue" is internal to the nature of the concept.
  *   **Does it escape?** Technically, yes. It stops the regress by denying the premise that the relation is a separate entity requiring connection.
  *   **The Catch:** Many critics (including Wittgenstein and later Dummett) argue this merely **relocates** the mystery. Calling a concept "unsaturated" is a metaphor for "does the job of unifying." It explains *that* it unifies, but not *how*. It posits a magical logical glue without explaining its mechanism. However, for Frege, this wasn't a bug; it was a feature. The "how" is a psychological question; the "that" is a logical one.

  ### 3. Russell's Multiple Relation Theory of Judgment (MRTJ)
  This is where Russell arguably runs face-first into the wall.

  Around 1910, Russell became worried that objective propositions (as entities existing in a "third realm") were too Platonic and too vulnerable to the unity problem. He shifted to the **Multiple Relation Theory**: Judgment is not a relation between a mind and a *proposition*, but a relation between a mind and the *constituents* of a fact ($J(subject, a, R, b)$).

  *   **The Goal:** To make the *act of judging* supply the unity, rather than the proposition having it inherently.
  *   **Wittgenstein's Torpedo:** In 1913, Wittgenstein pointed out that MRTJ cannot distinguish between a meaningful judgment and nonsense. If I judge "this table penholders the book," my mind is related to the terms just as it is in a true judgment. Nothing in the theory prevents me from combining terms that *cannot* logically combine.
  *   **The Link to Bradley:** Wittgenstein's objection is essentially a resurrection of the regress problem. By removing the objective proposition (the "unity"), Russell removed the constraint that guarantees the terms *can* unite. He tried to solve the unity problem by making it subjective, but unity requires **logical form**. You can't just shove terms together; they must fit a form.

  Russell eventually conceded this point. It led him (in *Introduction to Mathematical Philosophy*) to admit that "logical forms" must be acknowledged as objects of acquaintance, which was a significant retreat.

  ### Summary for your piece
  If you need a tight synopsis:

  1.  **Bradley** used the regress to destroy relations (Metaphysical Nihilism about relations).
  2.  **Russell** used the threat of the regress to motivate the need for a specific logical form that ensures propositional unity (Realism about relations).
  3.  **Frege** tried to block it via categorial distinction (Unsaturatedness), which stops the regress but leaves the nature of "fitting" mysterious.
  4.  **MRTJ** was Russell's attempt to dissolve the problem by removing objective propositions, but it failed because it couldn't account for **logical form** (Wittgenstein's objection), which is essentially the requirement that the regress must be stopped *somewhere* objective, not just in the mind.

  The "conflation" you see is historically justified because Russell believed solving the logical problem (Unity) was the only way to win the metaphysical war (against Bradley). They are distinct problems, but in early analytic philosophy, they were two fronts on the same battlefield.
