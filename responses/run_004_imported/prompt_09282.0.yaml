answer: |-
  This is a fantastic philosophical puzzle, and honestly, you've stumbled onto one of the central debates in modern ethics. You aren't just arguing about chickens; you're arguing about **meta-ethics** (how we decide what counts as moral) and **moral status** (who or what deserves protection).

  Your gut reaction is spot on: Priya is switching moral frameworks mid-argument. She is using **Utilitarianism** for the chickens (maximize total good, minimize total bad) and **Deontology** (rights-based ethics) for the humans (certain actions are inherently wrong, regardless of the outcome).

  Is this incoherent? Not necessarily. But it *is* incomplete unless she can define the threshold where one framework stops and the other begins. Here is a breakdown of the coherent arguments for her position, the coherent arguments against it, and where the actual fault line lies.

  ### The Case for Priya (Why the distinction might be coherent)

  There are established philosophical reasons to treat humans and animals differently, even if we care about animal suffering.

  **1. Moral Agency and the Social Contract**
  Humans are moral agents; chickens are not. We can reason, consent, negotiate, and understand the concept of rights. Because humans can participate in a "social contract" (I won't hurt you if you don't hurt me), we owe each other duties that we don't owe to beings who can't reciprocate.
  *   **The Argument:** You can't sacrifice a human worker because that violates their autonomy and consent. A chicken cannot consent, so its welfare is weighed purely on suffering vs. benefit.
  *   **The Coherence:** This isn't arbitrary; it's based on the capacity for rational agency.

  **2. The "Ends vs. Means" Principle**
  Immanuel Kant argued that humans must always be treated as *ends in themselves*, never merely as *means to an end*.
  *   **The Argument:** Using a human as a tool to generate economic welfare (even for the poor) treats them as a thing, not a person. Animals, in this view, may not have the same "personhood" status, so using them for food is utilizing a resource, whereas using a human is slavery.
  *   **The Coherence:** This draws a hard line at "personhood" rather than "sentience."

  **3. The Slippery Slope of Human Utilitarianism**
  History is littered with atrocities justified by "the greater good."
  *   **The Argument:** If we allow the "aggregate math" framework for humans, we open the door to eugenics, forced labor, or sacrificing minorities for the majority's benefit. We have a pragmatic, survival-based reason to adopt a strict "never sacrifice humans" rule, whereas applying utilitarianism to animals doesn't carry the same existential risk to human society.
  *   **The Coherence:** This is a rule-utilitarian argument. Even if sacrificing one worker *mathematically* helps more people, adopting a *rule* that allows it would cause more harm in the long run.

  ### The Case for You (Why the distinction might be bias)

  Your challenge is the classic "Argument from Marginal Cases," and it is the strongest logical counter to Priya's position.

  **1. The Argument from Marginal Cases**
  If the criterion for protection is "autonomy" or "rationality," what about humans who lack those traits?
  *   **The Challenge:** A severely cognitively disabled infant or a person in a permanent vegetative state may have less cognitive capacity, less self-awareness, and less ability to "consent" than an adult pig or chicken.
  *   **The Inconsistency:** If Priya says we can't sacrifice the human worker because of "rights," would she say we *can* farm the severely disabled infant because they lack autonomy? If she says no, then autonomy isn't the real criteria—**species membership** is. That is the definition of speciesism.

  **2. Sentience as the Only Metric**
  Philosophers like Peter Singer argue that the capacity to suffer is the only relevant characteristic for moral consideration.
  *   **The Challenge:** If suffering is bad, it is bad regardless of the species experiencing it. A chicken's fear and pain are biologically similar to a human's.
  *   **The Inconsistency:** To say "human pain counts more than chicken pain" requires proof of a morally relevant difference. If the difference is just "because they are human," that is a tribal bias, not an ethical principle.

  **3. Inconsistent Application of Rights**
  We actually *do* sacrifice humans for economic gain sometimes, just indirectly.
  *   **The Challenge:** We allow workplaces with known safety risks (mining, construction) because banning them would hurt the economy. We allow poverty to persist when we could redistribute wealth more aggressively.
  *   **The Inconsistency:** Priya's "absolute" protection of humans is already compromised in the real world. Why draw the absolute line at the factory floor but not at the policy level?

  ### The Verdict: Is she being inconsistent?

  She is **methodologically inconsistent**, but she might be **morally consistent** depending on how she fills in the blanks.

  *   **She is wrong if:** She believes the *only* reason humans matter more is because they are humans. That is bias masquerading as ethics.
  *   **She is right if:** She can articulate a specific threshold (like "moral agency" or "personhood") and is willing to defend how that applies to marginal human cases (e.g., "We protect disabled humans because they belong to a community of moral agents, even if they can't participate fully").

  **The "Line" Problem**
  You hit the nail on the head: *"without ever really explaining why that isn't just a conveniently placed line."*
  Most people draw the line at "Human." But evolution doesn't respect that line. There is no biological switch where "suffering doesn't count" suddenly flips on.

  However, ethics isn't just biology; it's sociology. We have a **special obligation to our own kind** because we rely on mutual trust to function. If we start treating humans like chickens, human society collapses. If we treat chickens like humans, human society just becomes vegetarian. The stakes of the error are asymmetrical.

  ### How to move the conversation forward

  If you want to press Priya without it becoming a fight, don't ask "Why are humans better?" Ask her to define the **threshold**.

  Try asking this:
  > "I get that humans have rights. But is that because we are *human*, or because we have *capabilities*? If it's capabilities, what about a human who lacks those capabilities? Do they lose protection? If they don't, then isn't the protection actually based on species, not ethics?"

  **Summary:**
  You aren't crazy for feeling this is inconsistent. It is a very common moral intuition to hold both views (Utilitarianism for animals, Rights for humans), but holding them simultaneously requires a robust defense of **why** humans get rights and animals don't. If her only answer is "because they're people," she's relying on intuition, not argument. If her answer is "because of autonomy and social reciprocity," she has a coherent (though debatable) philosophical framework.

  You're essentially asking her to choose between **Peter Singer** (all suffering counts equally) and **Immanuel Kant** (humans are ends in themselves). Most people live in the messy middle, but the argument only gets resolved by admitting *why* we live there.
