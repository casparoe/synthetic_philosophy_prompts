answer: |-
  This is a profound and painful dilemma, one that sits at the intersection of psychology, ethics, and the philosophy of action. You are right to feel that your brother's inference is "too quick," even if his conclusion (that the visits are stressful) is factually correct.

  To answer your question directly: **Your brother is defensible regarding boundaries, but you are defensible regarding interpretation.**

  His reading treats your mother as a rational agent whose preferences are fully revealed by her actions. Your reading treats her as a complex human whose actions may be symptoms of internal conflict rather than clear statements of desire. Both contain truth, but they operate on different levels.

  Here is a breakdown of why this tension exists, why your hesitation is warranted, and a framework for weighing words against behavior when they diverge.

  ### 1. The Brother's Logic: "Revealed Preference"
  Your brother is applying a principle often used in economics and behavioral psychology: *revealed preference*. The theory suggests that if a person says they want $X$, but consistently chooses $Y$, they actually want $Y$.

  *   **The Strength:** This is a protective heuristic. It prevents you from being gaslit by words that don't match reality. If you only listen to her words, you walk into a trap repeatedly. Your brother's approach prioritizes the *evidence of experience* over the *promise of intent*. It protects your mental health and acknowledges the reality of the dynamic.
  *   **The Weakness:** It assumes your mother is acting from a place of unified conscious will. It assumes that because the visit causes tension, the *cause* of the tension is the presence of her children. It ignores the possibility that the tension is a reaction *to* the presence, but not a rejection *of* the presence.

  ### 2. The User's Intuition: The Ambivalence Hypothesis
  Your hesitation stems from an intuitive understanding of **ambivalence**. Human beings are rarely of one mind. It is entirely possible for your mother to hold two contradictory truths simultaneously:
  1.  "I am lonely and I crave my children's presence." (True)
  2.  "When my children are here, I feel anxious, criticized, and out of control." (True)

  If your brother's view is that she wants *less contact*, your view might be that she wants *connection without disruption*.

  The pattern you describe (tension upon arrival, criticism, relief upon departure) is classic **approach-avoidance conflict**. She desires the intimacy (approach), but the reality of intimacy requires vulnerability, flexibility, and a loss of control over her environment (avoidance). When you arrive, she loses her solitary routine. She may not know how to bridge the gap between "lonely solitary mother" and "engaged host," so she defaults to criticism—a way to exert control over the environment she feels is being invaded.

  Her behavior shows she lacks the **capacity** to handle the contact she **desires**. Your brother interprets the lack of capacity as a lack of desire. That is why his inference feels "too quick." It solves the logistical problem but misses the human tragedy.

  ### 3. General Framework: Weighing Words vs. Behavior
  You asked how one should generally weigh what a person says against what they do. When the two pull apart, consider these four distinctions:

  **A. Intent vs. Impact**
  *   **Words** usually reveal *intent* ("I want to be close").
  *   **Behavior** usually reveals *impact* ("Being close causes stress").
  *   *Rule:* Validate the intent, but manage the impact. Do not discard the words as lies; they tell you what the person values. Do not ignore the behavior; it tells you what the person is capable of.

  **B. Conscious Want vs. Unconscious Need**
  *   People often say what they think they *should* want (connection, family) while acting out what they *actually* need in the moment (safety, routine, control).
  *   *Rule:* If behavior contradicts words, assume the person is struggling with an internal conflict, not necessarily lying to you.

  **C. The "What" vs. The "How"**
  *   Often, the contradiction isn't about the *goal* (visits) but the *method* (how the visits are conducted).
  *   *Rule:* If words say "come" and behavior says "go," the answer may not be "stay away," but "come differently." (e.g., shorter visits, public places, structured activities).

  **D. Protection vs. Connection**
  *   **Behavior** is the metric for *protection*. (If it hurts, step back).
  *   **Words** are the metric for *connection*. (If they say they love you, believe they love you, even if they are bad at showing it).
  *   *Rule:* Use behavior to set your boundaries, but use words to maintain your compassion.

  ### 4. A Proposed Path Forward
  Your brother's solution (visit less) solves the stress but confirms the loneliness. Your mother's solution (visit more) solves the loneliness but creates the stress. The defensible middle path requires changing the **structure** of the interaction, not just the frequency.

  1.  **Believe Both:** Accept that she is lonely *and* that she finds visits difficult. Do not force yourself to choose one truth.
  2.  **Calibrate to Capacity, Not Just Desire:** If she can only handle two hours of company before becoming critical, plan a two-hour visit. Leave while things are still good. This honors her words (you visited) while respecting her behavior (you left before the tension peaked).
  3.  **Change the Medium:** If face-to-face visits in her home trigger her need for control/criticism, try meeting in a neutral space (a restaurant, a park) where the activity buffers the interaction.
  4.  **Name the Pattern (Gently):** Sometimes, bringing the puzzle into the light helps. "Mom, we love seeing you, but we notice things get tense after an hour. Let's try doing lunch instead of dinner so we can leave while we're all still happy."

  ### Summary
  Your brother is right that you cannot sustainably visit under the current conditions. Behavior must dictate boundaries. However, you are right that concluding she *wants* less contact is a reductionist reading of a complex emotional state.

  She likely wants the *idea* of you more than she can tolerate the *reality* of you. That is a limitation in her, not a rejection of you. You can protect yourself from the behavior (by limiting or structuring visits) without discarding the truth of her words (that she loves you and misses you).

  The most defensible position is to hold the tension: **Honor her loneliness without sacrificing your peace.**
