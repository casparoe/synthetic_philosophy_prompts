answer: |-
  Good evening. For those who don't know me, I'm the Best Man. Dan actually reviewed this speech before I wrote it. He told me the optimal length is three minutes—anything longer has negative expected value for the guests' attention spans. So, I'm sticking to his bankroll management.

  For the non-poker players in the room, like my grandma: Dan is a professional gambler. But not the reckless kind. Dan lives by something called the Kelly Criterion. It's a formula that tells you exactly what fraction of your money to bet so you *never* go broke. To Dan, life is about avoiding "risk of ruin." He doesn't do "all-in." He hedges. He diversifies. I'm pretty sure he calculated the risk-reward ratio before deciding to fall in love.

  Then there's Alex.

  Alex is the opposite. If Alex sees a bet with positive Expected Value—meaning, on average, it pays off—she takes it. Full stop. She doesn't care about variance. She cares about upside. When they were choosing a wedding venue, Dan wanted a place with a refundable deposit and low volatility. Alex wanted the castle with the open bar and the fire hazard.

  Watching them navigate this has been fascinating. Dan tries to size his emotions like a poker hand. Alex just shoves the chips forward.

  And when they disagree? Dan insists on using the Nash Bargaining Solution. For Grandma, that's a fancy mathematical way of compromising where you maximize the geometric mean of everyone's happiness. Basically, Dan uses calculus to decide whose parents they visit for Christmas. He thinks he's gaming the system. I think he just found a way to say "let's meet in the middle" that makes him feel smart.

  But here's the truth. Dan spends his life playing a solitary game. It's him against the deck. Him against the variance. His whole philosophy is about self-preservation. Protecting the bankroll. Surviving the downswing.

  But you can't protect yourself in a marriage. You can't hedge against your partner.

  Dan, you've spent your career making sure you never go bust. But Alex isn't a risk to be managed. She's the reason you finally decided the upside was worth the volatility. And Alex, you've taught him that sometimes, you don't calculate the odds. Sometimes, you just trust the player across the table.

  They say luck is for amateurs. But looking at you two, I think you've just stacked the deck.

  So, if everyone could raise a glass.

  To Dan and Alex. Because marriage is the moment his one-guy-against-variance philosophy turns into a two-player game.

  To the couple!
