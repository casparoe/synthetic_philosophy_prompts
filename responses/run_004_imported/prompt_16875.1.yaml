answer: |-
  Here are ten interview questions designed for your mock podcast script. They are structured to move from the three mandatory pressure points to broader theoretical commitments, ensuring the interviewee must engage with the technical machinery of etiological teleosemantics rather than relying on generalities.

  **1. The Disjunction Problem**
  "Let's start with a classic challenge regarding indeterminacy. Consider the frog's visual mechanism that triggers a snap. Historically, flies and small, dark, moving specks were co-extensive in the frog's environment. Since natural selection selects for correlations that enhance survival, and both properties correlated equally well with nutrition, what fact about the selection history determines that the mechanism represents *flies* specifically, rather than the disjunction *fly-or-dark-speck*? If the history underdetermines the content, how does the theory avoid the same indeterminacy problems plaguing causal theories?"

  **2. Follow-up: Normal Conditions**
  "The standard teleosemantic reply here is to appeal to 'Normal conditions'—the specific conditions under which the mechanism performed its function during the selection period. But doesn't this just relocate the indeterminacy? To specify the Normal conditions, we have to describe the environment. What prevents us from describing that environment as one containing 'dark specks' rather than 'flies'? Is there a non-circular way to individuate Normal conditions that doesn't already presuppose the very content you're trying to explain?"

  **3. The Swampman Case**
  "I'd like to pivot to the issue of historical necessity. Imagine 'Swampman,' a molecule-for-molecule duplicate of a human that forms by chance in a swamp, with no evolutionary or causal history. On your view, proper functions require a selection history. Are you committed to saying that Swampman has no beliefs, desires, or mental content whatsoever, despite being behaviorally and physically identical to us? Is this a bullet you are willing to bite?"

  **4. Follow-up: Cognitive Science Implications**
  "If you do deny content to Swampman, consider the implications for cognitive science. If we were studying Swampman in a lab, his neural states would correlate with the environment and predict his behavior exactly as a normal human's would. If two physical duplicates can differ in mental content purely in virtue of their causal histories, does this render content explanatorily irrelevant to psychology? Why should a cognitive scientist care about the history if the current physical structure does all the causal work?"

  **5. Explanatory Idleness**
  "This leads to the charge of explanatory idleness. When I reach for a glass of water, my behavior is caused by my current neural states and their functional role. The selection history that supposedly fixed the content of my 'water' belief is in the past. How can a past historical fact causally influence my present behavior? If the history doesn't enter into the causal chain of the action, in what sense is it doing any explanatory heavy lifting?"

  **6. Follow-up: Concrete Case**
  "Could you give us a concrete case where citing the historical proper function explains a behavior better than citing the current causal or functional role? I'm looking for a scenario where knowing the selection history changes our prediction or explanation of the organism's current action, compared to a scenario where we only know the organism's current internal structure and environment."

  **7. Derived Proper Functions and Learning**
  "Moving beyond innate mechanisms: much of human mental content involves concepts acquired through learning within a single lifetime, not phylogenetic selection. You posit 'derived' proper functions to handle this. But for a learned association to have a derived function, it must serve a biologically proper function. How do you prevent a regress here? At what point does a novel, learned cognitive map hook onto a biological proper function without simply stipulating that 'successful learning' is the function?"

  **8. Abstract Concepts**
  "A related worry concerns abstract concepts like 'prime number,' 'justice,' or 'zero.' These properties do not have direct survival value, and no mechanism was selected specifically to track them. How does an etiological theory account for content that seems to float free of the adaptive problems faced by our ancestors? Are we forced to say that when I think about prime numbers, I am misrepresenting something else that *was* selected for, like small collections of objects?"

  **9. The Consumer Theory of Content**
  "One distinctive feature of your view is that content is often fixed by the *consumer* of a signal, not just the producer. For instance, a bee dance's content depends on how other bees use it. Why is the asymmetry tilted toward the consumer? If the producer mechanism has a history of indicating nectar, why isn't that sufficient for content? What specific work does the consumer's consumption rule do in fixing the truth conditions?"

  **10. Normativity and Naturalism**
  "Finally, teleosemantics is often praised for naturalizing normativity; a representation can be 'false' if the system malfunctions relative to its proper function. But 'proper function' implies what a system *ought* to do. How do you derive this normativity from purely descriptive facts about past selection without committing the naturalistic fallacy? If a mutation occurs that changes a trait's function, is the previous function still normative for the organism, or does the 'ought' shift instantly with the genetics?"
