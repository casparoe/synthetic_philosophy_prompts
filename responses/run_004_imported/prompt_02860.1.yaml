prompt: |-
  Okay so I need someone to adjudicate an argument I had with my friend Priya last night (she's doing a masters in behavioral ecology) about the handicap principle, because we went in circles for like an hour and neither of us walked away happy. We started from the classic examples -- peacock tails, gazelles stotting right in front of a cheetah instead of just running -- and she was explaining Zahavi's idea that these signals are honest precisely because they're real handicaps, genuinely costly to survival, since thats supposedly the only reason a low-quality male couldn't just fake it too.

  My pushback was: if being a "true" handicap (i.e. actually hurting your odds of survival) is what makes the signal trustworthy, doesn't that mean natural selection should constantly favor any variant that pulls off the same flashy tail or the same stotting display with less actual risk? And if that keeps happening generation after generation, then either the trait stops being a real handicap anymore (so by her own logic it should stop being honest), or the cheaper fakers eventually catch up to the honest signalers and the whole thing becomes meaningless noise. Priya said it has something to do with the cost being "differential" across individuals of different quality rather than about the absolute size of the handicap, and that this is somehow stable against invasion by cheats, but she admitted she was fuzzy on the actual mechanics past that point, and neither of us could reconstruct it well enough to settle things.

  So can you actually clear this up for me? Does a handicap signal have to be a real, absolute cost to survival the way Priya first described it, and either way, what's actually stopping cheaper-to-fake variants from evolving and eroding the whole system over time the way I was describing? I've got a feeling one of us is running together two different things but I can't tell which.
