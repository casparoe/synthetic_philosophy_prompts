answer: |-
  This is a fantastic argument, and honestly, you both hit on the exact tension that kept evolutionary biologists arguing for decades after Amotz Zahavi first proposed the Handicap Principle in 1975.

  Here is the adjudication: **You are both partially right, but you are also both slightly wrong on the mechanics.**

  Priya is right about the *outcome* (cost ensures honesty), but your intuition about *selection pressure* (why wouldn't evolution minimize the cost?) is the sharper evolutionary critique. The resolution lies in a specific concept Priya hinted at but couldn't articulate: **Condition-Dependent Marginal Cost.**

  Here is the breakdown of why the system doesn't collapse, why "cheaper" variants don't take over, and who actually wins the argument.

  ### 1. The Misconception: "Absolute Cost" vs. "Net Fitness"
  Priya's initial explanation tripped over a common semantic trap. She said the signal is a "real handicap, genuinely costly to survival."

  If a trait *purely* reduced survival without offering a compensating benefit, natural selection would delete it immediately. A peacock with a tail so heavy he gets eaten before mating leaves no offspring. Therefore, the trait cannot be a net negative on fitness.

  **The Correction:** The signal is costly, but the *benefit* (mating success) outweighs the cost for high-quality individuals. The "handicap" isn't that the trait kills you; it's that the trait is **expensive to maintain.**

  ### 2. Your Objection: "Why not evolve a cheaper tail?"
  Your argument was: *If the cost is what makes it honest, selection should favor a guy who gets the same sexy tail for less energy/risk. Eventually, the tail becomes cheap, honesty collapses, and the signal becomes noise.*

  This is logically sound **IF** the cost of the signal is independent of the individual's quality. But in the Handicap Principle, the cost is **intrinsically linked to quality.**

  This is where Priya's mention of "differential cost" was the key, even if she couldn't explain it.

  **The Mechanism: Condition Dependence**
  Think of the peacock's tail not as an accessory he buys, but as a physical manifestation of his immune system and foraging ability.
  *   **High-Quality Male:** Has great genes, finds food easily, has a robust immune system. Producing a big tail costs him 10% of his energy budget. He can afford it.
  *   **Low-Quality Male:** Has parasites, struggles to find food, weak immune system. Producing that *same* big tail costs him 90% of his energy budget. He literally starves or dies of disease if he tries.

  **Why "Cheaper Variants" Don't Invade:**
  You asked why a mutation doesn't arise that makes a "cheap" tail.
  1.  **Physiological Link:** The pigments and structural proteins required for the tail are often the same resources needed for immune function. You can't just "mutate" a cheaper tail without compromising the physiology that makes you high-quality in the first place.
  2.  **The Signal Breaks:** If a mutation *did* allow a low-quality male to grow a big tail for cheap, he would indeed invade the population. **But then the tail stops being a signal of quality.** Females would stop selecting for tails because the tail no longer correlates with good genes. The selection pressure shifts, and the trait loses its value.

  So, the system is stable not because the cost is absolute, but because the **marginal cost** of the signal is higher for low-quality individuals than for high-quality ones.

  ### 3. The Gazelle Example (Stotting)
  This is the perfect example to settle the "survival cost" debate.
  *   **Priya's view:** The gazelle is wasting energy and showing off, risking death.
  *   **Your view:** That's stupid, just run.

  **The Synthesis:** Stotting is an **index signal** of escape ability.
  When a gazelle sees a cheetah, it has private information: *I know how fast I am.* The cheetah does not.
  *   If the gazelle is slow and runs, the cheetah chases (50% chance of capture).
  *   If the gazelle is slow and stots, the cheetah chases (100% chance of capture).
  *   If the gazelle is fast and runs, the cheetah chases (0% chance of capture).
  *   If the gazelle is fast and stots, the cheetah **does not chase** because it infers, "This guy is so confident he can jump around; I'll waste my energy hunting the one that's just running."

  The "cost" of stotting is only affordable if you are genuinely fast. If you are slow, stotting is suicide. Therefore, only fast gazelles stot. The signal remains honest because the penalty for lying is immediate death.

  ### 4. The Verdict

  **Priya wins on the Biology:**
  She is correct that the Handicap Principle relies on costs to ensure honesty. Without a cost that scales with quality, low-quality individuals *would* cheat, and the signal would become meaningless (this is known as "signal erosion"). Her instinct about "differential cost" is the mathematically correct explanation (formalized by Alan Grafen in 1990).

  **You win on the Evolutionary Logic:**
  Your pushback was essentially the critique that nearly destroyed Zahavi's theory in the 1980s. You correctly identified that natural selection abhors waste. If the cost were just a "tax" that could be avoided, evolution would avoid it. You forced the conversation to the crucial nuance: the cost cannot be separable from the quality of the organism.

  ### The Final Settlement
  Tell Priya this:
  > "You were right that costs ensure honesty, but I was right that selection minimizes waste. The solution is that the cost isn't a 'fee' you pay; it's a physiological constraint. The signal is honest because the cost is **marginal and condition-dependent**. A low-quality male *physically cannot* pay the cost without dying, so he can't fake it. A 'cheaper' variant can't evolve because if it's cheap for low-quality males, females stop listening, and the trait loses its value."

  **Who buys the next drink?**
  Split it. Priya knows the literature, but you spotted the logical hole in the "absolute cost" argument that trips up most undergrads. That's good intuition.
