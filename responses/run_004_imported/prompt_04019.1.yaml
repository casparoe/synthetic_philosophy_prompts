answer: |-
  Two epistemologists, Kyburg and Makinson, are standing at a racetrack.

  Kyburg refuses to place a bet. "For any given horse," he says, "the probability of it losing is 99.9%. But I know one must win. If I believe of each horse that it will lose, I hold an inconsistent set. To avoid irrationality, I must withhold belief on every single outcome."

  Makinson shakes his head and hands the bookie a slip betting against every horse. "You're being too timid," he says. "I believe Horse 1 will lose. I believe Horse 2 will lose. All of them. But, in the spirit of my own preface, I also believe that at least one of these beliefs is false."

  Kyburg stares at him. "You're treating a lottery like a library."

  "It's the same logical structure," Makinson insists. "Individually justified beliefs that are jointly inconsistent."

  "No," Kyburg replies, watching the gates open. "In your Preface Paradox, the individual beliefs are warranted by **evidence**. Here, they're warranted only by **odds**. You can claim rational inconsistency when you're admitting **human fallibility**, but not when you're admitting **arithmetic certainty**."

  Makinson watches his slip burn. "So the difference is..."

  "In the book, you're humble about your **competence**," Kyburg says. "At the track, you're just wrong about the **math**."
