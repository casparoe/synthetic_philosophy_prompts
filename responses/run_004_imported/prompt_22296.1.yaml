  **Move 1 (Naomi): 2**
  Naomi accurately maps the queue onto Lewis's core criteria. She identifies the **coordination equilibrium** (order is better than chaos), the role of **precedent** (past regularity creates future expectation), and crucially, the **arbitrariness condition** (other systems like lotteries could work). This is a textbook application of Lewis's definition from *Convention*.

  **Move 2 (Felix): 1**
  Felix correctly identifies a phenomenological gap: the reaction to queue-jumping feels moral (outrage/unfairness) rather than merely prudential (confusion/coordination failure). However, he slightly overreaches by implying this disproves the convention status. Lewis acknowledges conventions generate normative expectations; Felix is right that the *intensity* suggests something more, but wrong to imply it negates the conventional structure entirely.

  **Move 3 (Naomi): 2**
  Naomi rightly defends the Lewisian position that **common knowledge** and reliance create normative force without needing external morality. In Lewis's framework, if I plan based on your expected conformity, your violation harms my interests, generating a "right" to expect conformity. She correctly frames the anger as a reaction to frustrated reliance, which is consistent with Lewis's account of how conventions acquire an "ought."

  **Move 4 (Felix): 2**
  This is Felix's strongest move. The escalator analogy isolates **coordination** from **fairness**. By arguing that queueing allocates a scarce good based on time invested, he challenges the **arbitrariness condition**: if FCFS is chosen *because* it is fair (and a free-for-all is unfair), is it truly arbitrary? He pressures the definition by suggesting the norm is sustained by moral desert, not just salience, which Lewis's theory struggles to accommodate.

  **Move 5 (Naomi): 2**
  Naomi successfully scopes the theory. She concedes the moral difference but argues it is an **independent norm annexing the convention**, not part of the convention's definition. This aligns with Lewis's explicit distinction between conventional obligations and moral obligations. She preserves Lewis's definition by admitting it explains the coordination mechanism, not the subsequent moralization.

  ***

  **Final Verdict**

  First-come-first-served queueing **does satisfy Lewis's definition of a convention**. It is a regularity sustained by common knowledge and preference for coordination, where alternative regularities (like a lottery) were possible.

  The moral charge surrounding queue-jumping does **not expose a gap in Lewis's account**, but rather marks the boundary of its scope. Lewis explicitly intended his theory to explain social coordination, not moral ontology. As Naomi concludes, the "outrage" Felix observes is the result of an independent moral norm (fairness/desert) attaching itself to a conventional structure. Lewis explains why we queue; he never claimed to explain why we feel it is *unjust* to break the queue, only that we expect others not to. The exchange reveals not a failure of the theory, but the complex layering of morality atop convention.
