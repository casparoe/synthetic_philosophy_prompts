answer: |-
  This is a fantastic rabbit hole. You've stumbled onto one of the most fascinating tensions in late-19th-century philosophy, and your intuition is correct: this isn't just a quirky hobby. It's structurally integral to his thought.

  Since you're coming from an engineering/rationalist background, I'll frame this in terms of system architecture, signal processing, and error handling, because that maps surprisingly well onto Sidgwick's actual reasoning.

  Here is the breakdown of how Sidgwick would likely analyze the modern replication crisis, and why his psychical research was actually a debugging attempt on his ethical operating system.

  ### 1. Sidgwick vs. Bem: The Signal-to-Noise Problem

  If you showed Sidgwick Daryl Bem's 2011 "Feeling the Future" paper, he would **not** view it as vindication of psychical phenomena. He would view it as vindication of his critique of standard scientific methodology when applied to low-probability events.

  **The Methodological Mismatch**
  Sidgwick's work with the Society for Psychical Research (SPR) was defined by an obsession with eliminating "normal" explanations before accepting "anomalous" ones. In engineering terms, he was obsessed with minimizing false positives (Type I errors) because he understood the prior probability of the signal (telepathy/precognition) was vanishingly small.

  Bem's paper used standard frequentist statistics ($p < 0.05$). In most psychological research, this threshold is accepted because the priors are assumed to be reasonable (e.g., "priming might affect reaction time"). But for precognition, the prior is effectively zero within a materialist framework.

  Sidgwick would argue that Bem's result demonstrates exactly what he feared: **standard significance testing is a leaky filter.**

  *   **The Humean Maxim:** Sidgwick was a disciple of the Humean idea that "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavors to establish."
  *   **The Application:** A $p$-value of 0.01 means there's a 1% chance the data happened by random noise. But if the hypothesis (precognition) has a prior probability of 0.000001% given our current understanding of physics, a 1% error rate is not strong enough evidence to update the model.
  *   **The Conclusion:** Sidgwick would likely say Bem's paper proves that psychology lacks the error-correction protocols necessary for high-stakes claims. He wouldn't say "Psi is fake"; he would say "Your significance threshold is too high for this class of problem."

  **The Replication Crisis as Validation**
  You mentioned the replication crisis. Sidgwick would see the failure to replicate Bem's results not as a failure of psychical research, but as a failure of the *controls*.

  In the 1880s, Sidgwick spent years debunking the medium Henry Slade. He didn't do this because he hated spiritualism; he did it because he needed **clean data**. He famously said that if even one instance of telepathy were proven, it would revolutionize science. But he refused to count "maybe" instances.

  If he saw the Hyman-vs-Honorton debate (1980s), he would side with Hyman's critique of the loopholes (sensory leakage, file drawer effects). Sidgwick anticipated the "file drawer problem" (publication bias) by insisting the SPR publish negative results alongside positive ones. He would view the modern crisis as the inevitable output of a system that optimizes for publishable $p$-values rather than robust signal detection.

  **Verdict:** He would conclude that Bem's result is damning evidence that ordinary significance testing is too weak a filter. He would argue that psychical research (and psychology) needs a Bayesian approach (even if he didn't have the math) where the burden of proof scales with the improbability of the claim.

  ### 2. The Ethical Connection: Debugging the "Dualism of Practical Reason"

  Now, to your second question: Is this connected to *The Methods of Ethics*, or was it a hobby?

  It is **not a hobby.** It is a desperate attempt to resolve a critical bug in his ethical framework.

  **The Bug: Dualism of Practical Reason**
  In *The Methods of Ethics*, Sidgwick identifies a crash condition in rational morality.
  1.  **Rational Egoism:** Reason tells me to maximize my own happiness.
  2.  **Utilitarianism:** Reason tells me to maximize the general happiness (the "point of view of the universe").

  Usually, these align. But sometimes they don't. Sometimes, doing the moral thing (Utilitarianism) guarantees a net loss for you (Egoism). If the universe is purely material and death is the end, then the rational agent *should* be selfish whenever they can get away with it, because sacrificing self-interest for others is literally irrational in a closed system.

  Sidgwick found this unacceptable. He believed morality must be rational. For morality to be fully rational, there must be a mechanism that ensures Duty and Self-Interest ultimately converge.

  **The Patch: Cosmic Justice**
  The only way to resolve the Dualism is if the universe is "morally rigged." There must be:
  1.  Survival after death (so sacrifices in this life can be compensated later).
  2.  A moral governor (God or cosmic law) who enforces the alignment of virtue and happiness.

  **Psychical Research as Empirical Testing**
  This is where the SPR comes in. Sidgwick couldn't just *assume* God or an afterlife existed; that would be dogmatism, which he hated. He needed empirical evidence.
  *   If telepathy is real, materialism is false.
  *   If survival after death is real, the "long run" where Duty and Self-Interest align is possible.

  He wasn't doing psychical research to *prove* utilitarianism. He was doing it to see if the **physical premises required for utilitarianism to be rational** were true. He was trying to empirically verify the existence of the "moral order of the universe."

  **The Tragedy**
  The tragedy of Sidgwick's life is that he never found the evidence he needed. He remained an agnostic. He wrote in his diary that he found "no proof of immortality." This left him with the "Dualism" unresolved. He lived with the knowledge that, rationally, he couldn't prove why he shouldn't be selfish, yet he felt compelled to be moral anyway. He called this a "fundamental contradiction" in human reason.

  ### 3. Where I Am Unsure (and You Should Be Too)

  I need to be careful not to over-interpret. Here are the areas of genuine uncertainty:

  **1. Would he have embraced Bayesian Statistics?**
  I am inferring that Sidgwick would align with Bayesian reasoning (priors matter) because it matches his qualitative logic. However, Sidgwick was a product of the 19th century. He might have insisted on *deterministic* proof rather than probabilistic updates. He wanted a "fact," not a likelihood ratio. It is possible he would have rejected *all* statistical parapsychology (Rhine, Bem) as inherently insufficient, regardless of the math, because statistics deal in probabilities and he wanted certainty about the laws of nature.

  **2. The Depth of His Belief**
  Scholars debate how much he *wanted* it to be true versus how much he *needed* it to be true.
  *   **Bart Schultz** (Sidgwick's leading biographer) argues Sidgwick was deeply emotionally invested in finding evidence of survival, partly due to his own repressed homosexuality and the social isolation it caused (the afterlife offered a place where he could be fully known/loved).
  *   **Other scholars** argue he was colder, viewing it purely as a philosophical necessity.
  I lean toward Schultz, but we can't know for sure. Sidgwick was famously secretive about his personal doubts (he even kept his ethical doubts hidden from his students).

  **3. Would he have abandoned the project?**
  Given the modern consensus that parapsychology has produced no robust, replicable evidence after 140 years, would Sidgwick have quit?
  *   **Optimistic view:** He would have concluded the "moral order" hypothesis is falsified and accepted that reason is fundamentally broken (nihilism).
  *   **Pessimistic view:** He might have argued, as some modern proponents do, that the "observer effect" or "psi-missing" prevents lab replication, and that the evidence is still anecdotal but cumulative.
  Given his rigor, I suspect he would have eventually concluded the evidence was insufficient, which would have been devastating for his ethical system.

  ### Summary for Your Lunch Argument

  If you go back to your coworkers, here is the engineered summary:

  1.  **On Bem/Psychology:** Sidgwick would not be surprised by the replication crisis. He would argue that Bem's paper proves standard scientific controls are insufficient for low-prior claims. He would view the $p < 0.05$ standard as a system vulnerability that allows noise to masquerade as signal. He wouldn't say "Psi is fake," he'd say "Your error handling is broken."
  2.  **On Ethics:** The psychical research was not a hobby. It was an empirical search for the "runtime environment" required to make his ethical code run without crashing. He needed an afterlife to resolve the conflict between Self-Interest and Duty. When he failed to find evidence of the afterlife, he was left with a "fundamental contradiction" in reason that he never solved.

  Sidgwick is essentially a rationalist who realized that if Rationality requires Materialism, then Morality might be irrational. He spent 20 years trying to find a bug in Materialism so he could save Morality. He didn't find the bug, but he wrote the documentation on how to look for it.
