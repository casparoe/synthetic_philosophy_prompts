      *   *Transitivity Money Pump:* If $A \succ B \succ C \succ A$, you can trade $A \to C$ (pay $\epsilon$), $C \to B$ (pay $\epsilon$), $B \to A$ (pay $\epsilon$). You end up with $A$ minus $3\epsilon$. This is robust.
      *   *Completeness Money Pump:* If $A$ and $B$ are incomparable ($A \parallel B$), the standard argument assumes the agent will trade $A \to B$ for free (or small cost) and then $B \to A$ for free (or small cost).
      *   *The Weakness:* The pump relies on the assumption that incomparability implies *indifference* regarding trades. If $A \parallel B$, it doesn't mean "I don't care." It means "I have no comparative judgment." If the agent has a policy like "Stay put unless strictly better," the pump fails.

