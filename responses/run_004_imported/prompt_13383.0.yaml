      *   *Wittgenstein:* The user's reading of the 1938 Lectures (LC) aligns with the "non-cognitivist" or "expressivist" reading (though Wittgenstein isn't strictly a non-cognitivist). The focus on the *grammar* of the belief (how it functions in the life of the believer) rather than its truth-conditions in an empirical sense is central to LC. The distinction between "hypothesis" and "picture" or "regulative principle" is key.
