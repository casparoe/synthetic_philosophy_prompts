  So Gödel and Cohen between them showed the continuum hypothesis is independent of ZFC, and apparently even throwing in large cardinal axioms doesn't pin it down either. Doesn't that basically make CH like Euclid's parallel postulate -- there's no fact of the matter, you just get different but equally legitimate set theories depending which way you go? I dont really get why people like Woodin are still chasing new axioms trying to 'determine' whether CH is true, instead of just accepting its a free choice, kind of like picking Euclidean vs hyperbolic geometry. Am I missing something, or is CH basically not a real open question anymore?
