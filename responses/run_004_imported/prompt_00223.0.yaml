answer: |-
  You have hit on a fundamental insight that often gets glossed over in introductory treatments: **structurally, the synchronic and diachronic Dutch Book arguments (DBAs) are indeed isomorphic.** Both rely on the same theorem: if your degrees of belief violate a specific norm (probability axioms or conditionalization), there exists a set of bets you would accept that guarantees a net loss.

  However, your observation that the diachronic version is treated as "weaker" or more contestable is correct. The asymmetry in reception doesn't stem from the *logic* of the proof, but from the **metaphysical and epistemic premises** required to make the diachronic proof work.

  Here are the four primary reasons decision theorists treat the diachronic DBA with more skepticism than the synchronic one.

  ### 1. The Bookie's Epistemic State (The "Knowledge of Evidence" Problem)
  This is the most technical and damaging objection to the diachronic DBA.

  *   **Synchronic:** To Dutch book you on probabilism, the bookie only needs to know your *current* betting quotients. They look at your current $P(A)$ and $P(\neg A)$, see they don't sum to 1, and offer the bets immediately.
  *   **Diachronic:** To Dutch book you on conditionalization, the bookie needs to know not only your current priors but also **what evidence you will receive** and **how you will update on it**.

  For the bookie to construct the guaranteed loss, they generally need to know in advance which proposition $E$ will become certain at $t_2$. If the bookie doesn't know what $E$ is, they cannot set up the contingent bet at $t_1$ that exploits your update at $t_2$.

  This implies the bookie has foreknowledge of your future evidence. Many theorists (e.g., Skyrms, Lewis) argue this gives the bookie an unfair informational advantage that isn't present in the synchronic case. If the bookie knows your future evidence, they might be able to Dutch book you even if you *do* conditionalize, simply because they know more about the world than you do. This muddies the water between "irrational updating" and "asymmetric information."

  ### 2. Agency and Intertemporal Identity
  The synchronic DBA targets a single agent at a single time. The diachronic DBA targets an agent *across* time. This introduces a problem of **self-interest**.

  *   **Synchronic:** If I lose money at $t_1$, *I* lose money. The loss is undeniably mine.
  *   **Diachronic:** If I accept a bet at $t_1$ that loses money at $t_2$, is that a loss for *me*?

  Philosophers like **David Lewis** and **Brian Skyrms** have noted that for the diachronic DBA to work, the agent at $t_1$ must care about the financial welfare of the agent at $t_2$ exactly as much as their own. If the agent at $t_1$ discounts the future, or if they view their future self as a distinct entity (a la Derek Parfit), a guaranteed loss for the "team" over time might not look like a rational constraint on the $t_1$ self.

  In the synchronic case, there is no temporal discounting. In the diachronic case, unless we assume the agent has a unified, temporally neutral utility function over money, the "guaranteed loss" isn't necessarily a pragmatic defect for the agent *at the time of decision*.

  ### 3. Conditionality of the Loss
  In a synchronic Dutch Book, the loss is **categorical**. Regardless of how the world turns out, the net sum of the bets is negative.

  In a standard diachronic Dutch Book, the loss is often **conditional on the evidence arriving**.
  *   The bookie offers a bet at $t_1$ that is called off if evidence $E$ does not occur.
  *   The loss is guaranteed only in the set of worlds where $E$ is learned.

  Critics argue this weakens the "sure loss" claim. If the evidence $E$ is not certain to occur, the agent isn't facing a *strictly* guaranteed loss in all possible worlds, but only in a subset. While sophisticated versions of the argument (like Teller's) try to patch this, it remains a point of friction. The synchronic argument holds across the entire sample space; the diachronic argument often holds only across the partition of evidence cells.

  ### 4. Policy vs. Strategy (The Commitment Objection)
  This distinction, highlighted by **Patrick Maher** and others, questions what exactly is being Dutch booked.

  *   **Strategy:** A specific plan of action for specific evidence.
  *   **Policy:** A general rule for updating (e.g., "I will always conditionalize").

  The diachronic DBA works best if the agent has pre-committed to a **strategy** at $t_1$. If I decide at $t_1$ exactly what I will bet at $t_2$, I can be booked. However, most proponents of conditionalization view it as a **policy** constraint on rational belief revision, not a binding contract made in the past.

  If I am not bound by my $t_1$ self's betting commitments at $t_2$, I can simply refuse the second bet when the time comes if I realize it leads to a loss. The synchronic DBA doesn't allow this "opt-out" because all bets are offered simultaneously. The diachronic DBA assumes the agent is *committed* to accepting bets at $t_2$ based on their $t_1$ planning. If rationality allows me to change my mind at $t_2$ based on new information (even if that change violates my $t_1$ plan), the Dutch Book fails.

  ### Summary: Why the Asymmetry?
  You are right that the **logical core** is the same (Incoherence $\rightarrow$ Vulnerability). However, the **pragmatic bridge** is much shakier in the diachronic case.

  | Feature | Synchronic DBA (Probabilism) | Diachronic DBA (Conditionalization) |
  | :--- | :--- | :--- |
  | **Bookie Knowledge** | Needs current beliefs only. | Needs current beliefs + **future evidence**. |
  | **Loss Scope** | Guaranteed in **all** worlds. | Guaranteed in worlds where **E is learned**. |
  | **Agency** | Single self (no discounting). | Multiple temporal selves (discounting/identity issues). |
  | **Commitment** | Bets accepted simultaneously. | Requires binding **pre-commitment** to future bets. |

  **The Consensus View:**
  Most contemporary decision theorists (e.g., **David Christensen**, **Alan Hájek**) conclude that while the synchronic DBA provides a strong pragmatic vindication of the probability axioms, the diachronic DBA is better understood as establishing a **consistency constraint on planning** rather than a fundamental norm of rationality.

  It shows that if you want to plan your betting strategy in advance to avoid sure losses, you should conditionalize. But it doesn't necessarily prove that an agent who updates differently is *epistemically* irrational in the same way an agent who violates the probability axioms is. The diachronic argument proves you are vulnerable *if* you bind your future self; the synchronic argument proves you are vulnerable *simpliciter*.

  So, your sanity check is accurate: the logic is identical, but the assumptions required to apply that logic over time are where the diachronic argument loses its force.
