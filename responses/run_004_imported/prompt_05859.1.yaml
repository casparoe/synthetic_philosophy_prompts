answer: |-
  **MEMORANDUM**

  **TO:** Methods-Reform Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for New Statistical Policy & Submission Standards

  **Decision**

  After reviewing the competing proposals, I recommend we **mandate a transition to Bayesian Estimation with Mandatory Preregistration and Prior Sensitivity Analysis.** We will explicitly **prohibit Null-Hypothesis Significance Testing (NHST)** and binary significance thresholds (e.g., p < .05 or p < .005) for main claims.

  This is not a compromise. We are not allowing authors to choose between "old" and "new" standards. We are adopting a single framework that quantifies evidence rather than rejecting nulls, but we are coupling it with constraints that address the specific vulnerabilities of that framework.

  **Rationale**

  **1. Why we must abandon NHST (Addressing Group A)**
  The proposal to retain frequentism but tighten the threshold to *p* < .005 is insufficient. Lowering the alpha level reduces false positives but drastically increases false negatives without commensurate increases in sample size, which our field cannot universally sustain. More critically, it retains the binary "significant/non-significant" dichotomy that drives publication bias and p-hacking. A smaller p-value does not fix the misinterpretation of what a p-value *is*. We cannot reform a system by simply tightening the screws on a broken engine.

  **2. Why Bayesian Estimation (Addressing Group B)**
  Bayesian methods allow us to quantify evidence *for* the null hypothesis, which is essential for a cumulative science facing a replication crisis. Credible intervals provide a more intuitive interpretation of uncertainty than confidence intervals. Shifting to Bayes aligns our journal with the theoretical needs of modern psychological science.

  **3. Addressing the Strongest Objection (The Skeptic's Point)**
  One committee member has rightly argued that Bayesian updating is theoretically immune to optional stopping, implying preregistration is unnecessary for Bayesians. They argue preregistration is a "patch for a disease Bayesians don't catch."

  **This is theoretically correct but practically dangerous.** While Bayesian updating is immune to *stopping rules*, it is highly sensitive to *model specification and prior selection*. In practice, "prior hacking" is the Bayesian equivalent of p-hacking. An author can test multiple priors until one yields a Bayes Factor that supports their hypothesis. If we allow Bayesian analysis without preregistration, we are not eliminating researcher degrees of freedom; we are simply moving them from the data collection phase to the modeling phase.

  Therefore, **preregistration is not optional for Bayesians.** It is the only mechanism we have to lock down prior selection and model structure before data inspection.

  **The Policy**

  Effective [Date, e.g., January 1, 2025], all empirical submissions must adhere to the following:

  1.  **No Binary Significance:** Manuscripts must not use terms like "statistically significant," "non-significant," or asterisks denoting threshold crossings. Claims must be based on the magnitude of effect sizes and the weight of evidence (e.g., Bayes Factors).
  2.  **Mandatory Preregistration:** All studies must be preregistered (e.g., OSF, AsPredicted). For Bayesian analyses, the **prior distributions must be specified in the preregistration**. Deviations require explicit justification in a "Deviations from Preregistration" section.
  3.  **Sensitivity Analysis:** All Bayesian analyses must include a sensitivity analysis demonstrating how the posterior estimates change under different reasonable prior specifications (e.g., wide vs. narrow, informative vs. non-informative). If the conclusion flips based on reasonable prior choices, the evidence must be reported as inconclusive.
  4.  **Transition Period:** For the next 12 months, we will offer workshops and manuscript consultation for authors unfamiliar with Bayesian workflows. During this period, frequentist estimation (CIs without testing) will be temporarily accepted, but NHST will be rejected immediately.

  **Implementation Risks**

  The primary risk is author pushback regarding the learning curve of Bayesian methods. However, retaining the status quo risks publishing another decade of non-replicable findings. By mandating sensitivity analysis, we protect against the subjectivity of priors. By mandating preregistration, we protect against the "garden of forking paths" regardless of the statistical framework.

  This policy accepts the Bayesian revolution but rejects the notion that Bayes is magic. It treats prior selection as a critical methodological choice that requires the same transparency as data collection.

  I request we vote on this framework by Thursday to meet the Friday deadline.

  [Your Name]
  Methods-Reform Committee
