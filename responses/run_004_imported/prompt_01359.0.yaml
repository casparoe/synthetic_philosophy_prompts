  Hey, quick question for a piece I'm working on about religious justifications for killing dictators. From what I can tell, Aquinas's argument boils down to this: an unjust law isn't really a law, and a ruler forfeits his legitimacy the second he starts governing for himself instead of the common good -- so killing him isn't just permitted, its praiseworthy, he even says so pretty explicitly in one spot. Given that, why didn't medieval Europe see a lot more assassinations of unpopular kings once this kind of Thomistic reasoning got around? Feels like the Church was sitting on a pretty radical license for regicide and barely used it.
