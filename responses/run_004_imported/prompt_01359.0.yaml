answer: |-
  This is a fascinating historical and theological puzzle, but there is a significant complication in the premise that helps explain the discrepancy you're noticing.

  While your summary captures the *vibe* of Thomistic political thought, it slightly overstates Aquinas's endorsement of private assassination. If you dig into the specific texts and the institutional context, the reason medieval Europe didn't see a wave of Thomistic regicide becomes clear.

  Here are the four main factors that prevented Aquinas's thought from becoming a "license to kill."

  ### 1. The "Praiseworthy" Quote is Often Misattributed
  You mentioned Aquinas says killing a tyrant is "praiseworthy." This is a common conflation. The medieval thinker who most explicitly endorsed tyrannicide was **John of Salisbury**, writing in the *Policraticus* (1159), well before Aquinas. Salisbury argued that killing a tyrant was not just lawful but "right and just."

  Aquinas is much more cautious. In his early *Commentary on the Sentences*, he does suggest that if there is no superior to appeal to, removing a tyrant can be praiseworthy. However, in his mature works (like *De Regno* and the *Summa Theologiae*), he pulls back significantly.
  *   **In *De Regno*:** He argues that if a king is elected by the people, the people can depose him. But he immediately adds a warning: often, overthrowing a tyrant leads to civil war, which is a greater evil than the tyranny itself.
  *   **In the *Summa* (II-II, Q. 42):** He classifies sedition as a mortal sin. He distinguishes between a "tyrant" and a legitimate authority. Even if a ruler is unjust, private individuals taking up arms is usually classified as sedition, which disrupts the common good.

  So, the Church wasn't ignoring a clear command from Aquinas; they were following his mature conclusion that **private assassination is usually sinful sedition.**

  ### 2. Public Authority vs. Private Initiative
  This is the single biggest theological brake on regicide. For Aquinas and the medieval Church, legitimacy flows from office and order, not just moral performance.

  Aquinas argues that if a tyrant is to be removed, it must be done by **public authority**, not private whim.
  *   If the king was appointed by a superior (like an Emperor or the Pope), that superior must depose him.
  *   If the king was elected by the community, the community (through its representatives/nobles) must depose him.

  A lone assassin acts on private authority. In Thomistic logic, a private individual killing a ruler undermines the very concept of ordered authority. If anyone can decide a law is "unjust" and execute the legislator, you return to the state of nature/anarchy, which is worse than suffering a bad king. Therefore, the Church could condemn an assassin even if the king was unpopular, because the *method* was illicit.

  ### 3. Institutional Self-Preservation
  The medieval Church was a pillar of the established order. The coronation rites (anointing) sacralized the monarch. While the Pope claimed the right to depose kings (as seen in the Investiture Controversy or the excommunication of Emperor Henry IV), this was a top-down power reserved for the Vicar of Christ, not a bottom-up right for the peasantry or nobility.

  If the Church broadly promoted the idea that "unjust rulers may be killed," they risked:
  *   **Destabilizing their own allies:** Monarchs were the military arm of Christendom.
  *   **Opening the door to heresy:** Many groups deemed heretical (like the Hussites later on) used similar logic to justify violence against Church authorities they deemed corrupt.
  *   **Undermining Divine Providence:** A common medieval theological stance was that bad rulers were sent by God to punish the people for their sins. Killing the ruler might be resisting God's punishment. Suffering the tyrant was often framed as a spiritual test.

  ### 4. The Definition of "Tyrant" was a Legal Trap
  Even if the theory existed, the application was legally perilous. Who decides when a king has forfeited legitimacy?
  *   If a king raises taxes to fight a war the nobles dislike, is he governing for the "common good" or "himself"?
  *   If the Pope and the King disagree, is the King a tyrant resisting the Church, or is the Pope overreaching?

  Because there was no neutral arbiter, accusing a king of tyranny was effectively an act of war. The Church generally preferred excommunication and interdict (spiritual weapons) over endorsing physical assassination. Excommunication released subjects from their oaths of fealty (a political death), which was often enough to cause a rebellion without the Church having blood on its hands.

  ### Summary
  The reason you don't see a spike in Thomistic regicide is that **Aquinas didn't actually give a green light for assassination.** He gave a yellow light for **deposition by public authority**, with a heavy warning that the cure might be worse than the disease.

  The Church held onto the power to depose kings (via excommunication and releasing oaths of fealty) but withheld the justification for private murder. This allowed them to check royal power without encouraging the anarchy of random political violence. When regicide did happen (like Richard II or various Merovingians), it was usually justified by feudal politics, not Thomistic theology, and the killers were often still excommunicated afterward.

  **For your piece:** The tension isn't that the Church ignored Aquinas; it's that Aquinas is often read as more radical than he actually was. The "radical license" existed more in the imagination of later revolutionaries (like the Jesuit controversialists of the 16th century or the French Revolutionaries) than in the actual practice of the High Middle Ages.
