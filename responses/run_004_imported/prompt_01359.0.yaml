  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Premise:**
      *   **Claim:** Aquinas argues that unjust law isn't law, rulers forfeit legitimacy when governing for self-interest, and therefore killing a tyrant is permitted/praiseworthy.
