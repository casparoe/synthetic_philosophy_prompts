      *   However, the holistic vote exists.
      *   Best practice in publishing (and many deliberative bodies): The holistic vote is the actual decision; the criteria are diagnostic. Why? Because acquisition is a risk assessment, not just a quality check. A book can be well-written (criteria met) but not fit the list, market, or budget (holistic no).
