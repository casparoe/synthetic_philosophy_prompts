      *(Final check on Mangled Worlds)*: Hanson's theory suggests that below a certain amplitude, worlds don't decohere properly and get overwritten by high-amplitude worlds. So, if she pushes her amplitude too low, she might not just be "rare," she might be "erased" by the noise of the larger branches. This is the perfect source of tension.

