answer: |-
  The cooling fans in the server rack hummed, a steady B-flat that Elara had come to associate with the continuity of her own consciousness. On the desk sat the apparatus: a modified Geiger counter linked to a solenoid, which was in turn linked to a vial of fast-acting neurotoxin. A photon hit a beam splitter. Reflected, the circuit closed, the solenoid fired, the vial shattered. Transmitted, nothing happened.

  Fifty percent.

  Elara sat in the chair, her hand hovering over the enter key. She had read the forums, the Sequences, the papers. She knew the standard rationalist party line: *Don't be stupid. Quantum immortality isn't a get-out-of-jail-free card. It's a selection bias.*

  But selection bias was still a law of physics. If the Many-Worlds Interpretation held, and if subjective experience followed the causal chain of a living brain, then there was no timeline in which Elara experienced being dead. There was only the timeline where the photon transmitted.

  She pressed enter.

  *Click.*

  The solenoid twitched. The vial remained intact.

  Elara exhaled, a sharp burst of air. In half the branches of the wavefunction, a version of her was currently slumping forward, poison flooding her synapses. In this branch, she was simply richer. She had bet a significant sum on the outcome before sitting down. The transfer notification blinked on her secondary monitor.

  "Subjective continuity confirmed," she whispered. Her voice sounded normal. The room felt solid.

  This was the tenth trial. $2^{-10}$. Roughly one in a thousand. In the vast majority of the multiverse, Elara was dead. But *this* Elara, the one doing the thinking, was necessarily in the one-in-a-thousand slice where the coin came up heads ten times in a row.

  She stood up and stretched. Her muscles felt heavy, real. But as she looked at the server rack, a cold calculation began to itch at the back of her mind.

  The pop-sci version of Quantum Immortality said, *You can't die.* It treated survival as a binary state. You are either an observer or you aren't. But quantum mechanics didn't deal in binaries; it dealt in amplitudes. It dealt in measure.

  Every time she survived a 50/50 split, the Born-rule weight of her branch was halved. She wasn't just surviving; she was thinning.

  She walked to the whiteboard on the wall. It was covered in integrals and a jagged graph descending toward zero.

  "Measure is probability," she muttered. "But probability of what?"

  If she continued this, if she pushed the odds to one in a billion, one in a googol, she would still *feel* like she was here. She would still collect her winnings. But the *weight* of this world relative to the others would be negligible.

  She sat back down. She adjusted the parameters. The next trial wouldn't be 50/50. She would adjust the beam splitter's opacity. One chance in a hundred.

  "Measure doesn't affect subjective experience," she recited, trying to summon the old conviction. "I am the observer. I am here."

  *Click.*

  Safe.

  She won again. The bank account notification chimed. But as the sound faded, the hum of the cooling fans seemed to dip, just for a microsecond. A glitch? Or a trick of the ear?

  Elara frowned. She pulled up a simulation on her tablet. It modeled decoherence rates in low-amplitude branches. Most physicists ignored the measure problem because it didn't change the predictions for experiments conducted in high-measure worlds. But Elara was no longer in a high-measure world. She was diving into the tail ends of the distribution.

  She thought of Robin Hanson's papers. *Mangled Worlds.*

  The theory suggested that decoherence wasn't perfectly clean. When a branch's amplitude dropped below a certain threshold, it couldn't maintain independence. The larger, higher-measure branches would interfere. They would "mangle" the small ones. The information wouldn't just be unlikely; it would be overwritten. Corrupted.

  If she made her branch too thin, would she die? Or would something worse happen? Would she become a ghost in the machine, a consciousness sustained on a substrate that was no longer fully decohered from the noise of the dead Elaras?

  She looked at the toxin vial. It looked less like a threat and more like a filter.

  "One more," she said. "One in ten thousand."

  She adjusted the opacity. Her hand trembled, just once. This wasn't fear of death. Death was the exit she couldn't take. This was fear of *dilution*.

  She pressed the key.

  The solenoid fired.

  *Silence.*

  The vial held.

  Elara waited for the rush of relief, the adrenaline spike of the survivor. It didn't come. She felt... distant. The hum of the fans was gone. No, not gone. It was there, but it sounded like it was coming from underwater.

  She looked at the bank notification. The numbers were there, but they seemed to shimmer, the pixels bleeding into the surrounding black.

  "Measure loss," she whispered.

  She stood up, but her balance was off. She gripped the desk. The wood felt smooth, too smooth, like a texture map that hadn't fully rendered.

  She was alive. She knew she was alive. She could think, she could reason. But the causal connection between her thoughts and the universe felt tenuous.

  She walked to the whiteboard. The graph she had drawn earlier seemed to vibrate. If Hanson was right, there was a cutoff. A floor. Below that amplitude, a branch couldn't support a stable observer. The interference from the high-measure worlds—where she was dead, where the room was empty, where the police were breaking down the door—would bleed in.

  She was currently in a branch with weight $2^{-24}$. Roughly one in sixteen million.

  "Am I mangled?" she asked the room.

  There was no answer. The air felt stale, recycled too many times.

  She returned to the chair. The logic demanded she stop. If she continued, she risked hitting the mangled threshold. If she hit it, she might not cease to exist—existence was a stubborn thing in MWI—but her experience might cease to be coherent. She might loop. She might fade into static.

  But the other side of the logic whispered: *You are still here. The cutoff is theoretical. You are the empirical data.*

  If she survived a one-in-a-billion chance, she would prove that consciousness could anchor itself in even the thinnest sliver of reality. She would be the ultimate survivor. The singularity of self.

  She looked at the controls. She could set the odds to one in a trillion.

  Her finger hovered over the keyboard.

  If she did this, and she survived, the measure of her branch would be so low that future interactions with the environment might not decohere cleanly. Tomorrow, when she woke up, would the sun rise? Or would the photon from the sun fail to resolve because the branch weight was too low to enforce the laws of thermodynamics consistently?

  She imagined waking up in a world where the light was gray, where the people were faceless blurs because the computational load of rendering them was too high for the amplitude of her reality.

  "Survival is not enough," she said.

  But what was the alternative? To stop was to admit that measure mattered. To admit that she was already half-dead, half-gone. To stop was to accept that the Elara who started this experiment was gone, replaced by this thinner echo.

  She adjusted the dial. One in a hundred billion.

  The room seemed to hold its breath. The silence wasn't quiet; it was an absence of sound waves, a vacuum.

  Elara looked at her hand. It looked translucent. She could see the outline of the desk through her palm. She blinked, and it solidified. A trick of the light. A trick of the mind.

  "I am the observer," she said. Her voice had no echo.

  She placed her finger on the enter key.

  If Hanson was right, this was the edge. The precipice where the math of the wavefunction met the biology of the brain. If she pressed it, she would either step into a miracle, or she would step into the mangling. She would survive, yes. She would always survive. But she might survive as a broken thing, a consciousness trapped in a branch that was rapidly losing the ability to hold together.

  Or, perhaps, the measure didn't matter at all. Perhaps the subjective experience was invariant, and the thinning was just a number on a page, a ghost story told by physicists who were afraid of the dark.

  The cooling fans were silent now. The only light came from the monitor, casting a pale blue glow on her face. The pixels on the screen were distinct, sharp squares.

  Elara pressed the key.

  The solenoid clicked.

  The screen flickered. For a moment, the text on the monitor scrambled into white noise, then resolved.

  *TRANSFER COMPLETE.*

  Elara sat in the chair. She was alive. She waited for the feeling of the room to return, for the hum of the fans, for the weight of her body in the seat.

  She looked down at her hands. They were still there.

  She looked at the door. She wondered, with a sudden, cold clarity, if the door still opened to the hallway, or if it opened only to the concept of a hallway.

  She took a breath. The air entered her lungs. It felt thin.

  Elara reached for the keyboard to log the result. Her finger touched the plastic. She wasn't sure if she felt the key press, or if she just remembered what a key press felt like.

  She began to type, but the letters on the screen lagged behind her thoughts, appearing one by one, as if the universe was struggling to keep up with the data rate of her survival.

  *Trial,* she typed. *Successful.*

  She paused. The cursor blinked. It blinked slowly, irregularly.

  Elara stared at the blinking cursor. It was the only thing in the room that seemed to have a rhythm. She waited to see if it would blink again.

  It did.

  She waited for the next one.
