      *   **Protagonist:** Someone convinced QI is correct, using a QS device to take reckless gambles.
      *   **Conflict:** Her confidence is complicated by the realization that while *she* survives subjectively, her "measure" (probability weight) shrinks, potentially leading to oblivion via mangled worlds or simply becoming statistically negligible.
      *   **Style:** Show, don't tell (philosophical content through action/internal monologue). No lecture-like dialogue.
      *   **Ending:** Genuinely open/ambiguous. Does she survive in a meaningful sense?

  2.  **Character & Setting:**
      *   *Name:* Elara.
      *   *Setting:* A sterile, controlled environment. A lab or a bunker. Let's make it personal—a modified home setup. High stakes, intimate.
      *   *The Device:* Needs to be lethal but quantum-random. A gun is the classic Tegmark example, but let's make it more clinical. A vial of poison released by a photon passing through a beam splitter.
      *   *Motivation:* Why is she doing this? Not just thrill-seeking. Maybe she needs to prove something, or she's optimizing for a specific outcome that requires high risk. Let's go with optimization: she wants to win the lottery or solve a problem where survival is the only constraint. Actually, the prompt suggests "increasingly reckless gambles." Let's make it about *winning* something big that requires surviving the odds. A high-stakes gamble where death is the failure state.

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Setup.** Establish the device and her calmness. She's done this before. The "pop-sci" view is her baseline: "I can't die."
