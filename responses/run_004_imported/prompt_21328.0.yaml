      *   Actually, let's keep it simpler. She's testing the limits. She's trying to reach a "Golden Branch."
      *   *Correction:* The prompt says "force increasingly reckless gambles." Let's have her betting on herself. She's trying to win a lottery, but the mechanism of winning is tied to the QS device. No, that's too complex.
      *   *Better:* She is simply testing the theory. She starts with small risks, then moves to life-threatening ones, believing she is immortal. Then the doubt creeps in regarding *measure*.
      *   *The Twist:* The doubt isn't about dying *now*, but about the *quality* of the future.

  7.  **Incorporating "Mangled Worlds":**
      *   Hanson's idea: Small worlds get "mangled" by larger worlds during decoherence. They don't support stable observers.
      *   Elara needs to worry that as her branch's amplitude shrinks, it might get mangled. She might not die, but she might cease to be a coherent observer.

  8.  **Drafting the Story (Mental Outline):**
