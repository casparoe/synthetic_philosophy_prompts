      *   **Section 2: Addressing Hart's "Danger" Charge.** Hart fears judicial discretion (judges voiding laws they hate). Counter: Distinguish between "bad policy" and "failure of legality." The Nazi statutes weren't just immoral; they undermined the very possibility of a legal order. Fuller's threshold is high, not whimsical.
      *   **Section 3: The Future-Oriented Certainty Argument.** What message does each solution send to future citizens?
