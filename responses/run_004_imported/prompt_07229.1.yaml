      *   **Fuller (Natural Law/Procedural):** Law has an "internal morality." Extreme iniquity (like the Nazi statutes used here) fails the test of law. Therefore, the statute was *not* law. The wife did not act under valid law. Punishing her is *not* retroactive because there was no valid law to begin with. It's applying the *true* law that existed all along.
      *   **The Classmate's Point:** Hart worries about certainty. But admitting retroactivity (Hart) is a direct violation of certainty/non-retroactivity. Denying validity (Fuller) preserves non-retroactivity *formally*.

  3.  **Brainstorming the Argument (The "Fuller Defense"):**
      *   *Premise 1:* The core Rule of Law value at stake is non-retroactivity (people should know the legal consequences of their actions beforehand).
      *   *Premise 2:* Hart explicitly advocates for a retroactive statute. This is an *admitted* violation of non-retroactivity.
      *   *Premise 3:* Fuller advocates for a declaration that the prior statute was void *ab initio*. This is *not* retroactive in form; it's a declaratory judgment about the status of the prior norm.
      *   *Counter-argument to Hart's "Danger" Charge:* Hart says Fuller makes law uncertain because judges might invalidate laws they dislike. Response: The Nazi case is an *extreme* case (limit case). Fuller isn't saying *any* bad law is void, but laws that fail the internal morality of law (e.g., secret laws, impossible compliance, or in this case, statutes that undermine the very system of legality).
      *   *The "Certainty" Paradox:* Hart claims to protect certainty by keeping the definition of law separate from morality. But in the grudge informer case, his solution *creates* uncertainty for the future: "If a regime collapses, we might pass retroactive laws to punish you for following the old regime's rules." Fuller's solution says: "If you follow rules that aren't really law (because they violate fundamental legality), you aren't protected."
      *   *Institutional Integrity:* Hart's approach forces the legal system to lie (say "this was law" then "we are changing the past"). Fuller's approach maintains the integrity of the legal system's continuity.

