      *   **Section 4: The Integrity of the Legal System.** Hart's approach creates a "legal black hole" or a rupture. Fuller's approach maintains continuity of the *concept* of law, even if it rejects specific enactments.
      *   **Conclusion:** Summarize. Hart is right that morality is subjective, but wrong that Fuller's approach is more uncertain. In the specific context of regime transition, Fuller offers a more stable bridge.

