      *   *Realism Aspect:* He believes there are "real objects" (Nature hides them, but they exist). He believes the relations between them are *real* ("preserve their reality"). This isn't just useful fiction; it's truth about the structure of the world.
      *   *Anti-Realist/Instrumentalist Aspect:* We cannot know the *intrinsic nature* of the entities (is it ether? is it fields?). The "images" are conventional.
      *   *Synthesis:* It's a limited realism. We know *that* things exist and *how* they relate, but not *what* they are in themselves. This avoids the PMI because the PMI attacks the truth of specific ontological claims (ether exists), but Poincaré says the truth lies in the mathematical structure/relations, which *do* persist (Fresnel's equations work within Maxwell's theory).
