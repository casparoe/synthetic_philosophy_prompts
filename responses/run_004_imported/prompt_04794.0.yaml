      *   **Tension:** Modern textualists usually resolve ambiguity via linguistic/legal conventions, *not* moral preference (liberty vs. bondage).
      *   **Question:** Would Douglass recognize his method in Gorsuch's *Bostock* opinion, or does his "liberty-favoring canon" conflict with consistent textualism?

