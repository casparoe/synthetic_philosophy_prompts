answer: |-
  This is a remarkably sharp comparison. You have identified a genuine kinship between Douglass's 1860 rhetorical strategy and modern textualist methodology, but you have also pinpointed the exact fault line where they diverge.

  To answer your question directly: **Douglass would likely recognize a kindred spirit in Gorsuch's rejection of "secret intentions," but a consistent modern textualist would almost certainly have to reject Douglass's "liberty-favoring canon" as an impermissible substantive rule of construction.**

  Here is the breakdown of why that alignment exists, and where the fracture occurs.

  ### 1. The Convergence: Rejection of "Secret Intent"
  The strongest link between Douglass and Gorsuch is their shared hostility toward relying on the subjective expectations of the drafters.

  *   **Douglass vs. The Garrisonians:** William Lloyd Garrison argued the Constitution was a "covenant with death" because the *framers* intended to protect slavery. Douglass countered that the framers' private intentions were irrelevant; only the text they ratified mattered. Since the text avoided the words "slave" or "slavery," referring instead to "persons" or "other persons," the document could not be read as sanctioning property in man.
  *   **Gorsuch vs. The *Bostock* Dissent:** In *Bostock*, the dissenters argued that the 1964 Congress did not *expect* or *intend* for "sex" to cover sexual orientation or gender identity. Gorsuch replied that the legislative intent is irrelevant; the law's terms carry their ordinary meaning, and if the logical application of those terms covers LGBTQ+ employees, that is the law.

  In this specific sense, Douglass is a proto-textualist (or perhaps a proto-original-public-meaning originalist). He insists that the law is an objective public text, not a vessel for the hidden psychological states of its authors. Douglass would absolutely recognize himself in Gorsuch's insistence that "the limits of the drafters' imagination supply no reason to ignore the law's demands."

  ### 2. The Divergence: Resolving Ambiguity
  This is where your intuition is correct. The methodologies part ways on how to handle gaps, silence, or ambiguity in the text.

  **Douglass's Canon of Liberty**
  Douglass argues that because slavery is a deprivation of natural rights, the federal government possesses no power to enact or support it unless that power is *explicitly* granted in the text. Where the text is silent or ambiguous, the presumption must be for liberty. This is a **substantive canon**. It imports a moral and political value (liberty) to resolve textual uncertainty.

  **Modern Textualism's Approach**
  Modern textualists (following Scalia and Gorsuch) generally reject substantive canons that rely on judicial assessments of "better" or "worse" outcomes.
  *   **Linguistic Conventions:** When text is ambiguous, a textualist looks to grammar, structure, context, and established legal definitions at the time of enactment.
  *   **The "Rule of Lenity":** Textualists do accept one "liberty-favoring" canon: the rule of lenity in criminal law (ambiguity favors the defendant). However, they treat this as a specific, historically rooted doctrine regarding criminal punishment, not a broad constitutional principle applicable to civil rights or structural powers.
  *   **Policy Neutrality:** Gorsuch in *Bostock* went to great lengths to argue that his decision was not based on the moral desirability of protecting LGBTQ+ workers, but on the "logical inevitability" of the text. He claimed there *was* no ambiguity to resolve via a canon; the text compelled the result.

  A consistent textualist would argue that Douglass's method invites judges to legislate. If a judge resolves ambiguity by asking "which reading creates more liberty?", they are no longer interpreting the text; they are imposing their own moral hierarchy upon it. To a Scalia/Gorsuch textualist, if the text allows for slavery (however odious), the judge cannot read it out based on a presumption of liberty; only the political process can amend it.

  ### 3. The Role of Purpose (The Preamble)
  Douglass leans heavily on the Preamble ("secure the Blessings of Liberty") to inform his reading of the operative clauses. He treats the Preamble as an operative statement of purpose that guides interpretation.

  Modern textualists are typically skeptical of using abstract purposes to override specific text or resolve ambiguity. Scalia, for instance, famously criticized the use of "spirit of the law" arguments. While they acknowledge the Preamble, they rarely allow it to do the heavy lifting of interpretation that Douglass requires. For Douglass, the *purpose* of liberty helps define the *meaning* of the words. For Gorsuch, the *meaning* of the words dictates the outcome, regardless of whether it aligns with a broad abstract purpose.

  ### 4. Would Douglass Recognize Himself in *Bostock*?
  **Yes, in part.** Douglass would applaud the refusal to be bound by the "dead hand" of the 1864 Congress's expectations. He would appreciate the focus on the ordinary meaning of "because of sex."

  **No, in the mechanism.** Douglass admitted that the Constitution contained compromises and silences that required a normative choice to interpret. He was openly advocating for a **moral reading of the Constitution**. Gorsuch, conversely, presents *Bostock* as a mechanical, almost mathematical derivation from the text that leaves no room for moral choice.

  Douglass's method is closer to Ronald Dworkin's "law as integrity" (interpreting law in its best moral light) than to Scalia's "law as text." Douglass uses textualism as a *tool* to achieve a moral end (abolition), whereas modern textualists view textualism as a *constraint* to prevent judges from pursuing moral ends.

  ### Conclusion
  Your assessment is astute. Douglass's "liberty-favoring canon" is something a consistent textualist would have to reject because it substitutes a moral presumption for a linguistic one.

  *   **Douglass:** "The text is silent/ambiguous; therefore, we must choose the reading that aligns with the fundamental purpose of Liberty."
  *   **Gorsuch/Textualist:** "The text means X based on ordinary usage. If X leads to a result the framers didn't expect, or even a result we find morally complex, that is irrelevant. We do not add a 'liberty presumption' to the code."

  Douglass was engaging in a form of **strategic textualism**. He adopted the tools of strict construction to disarm the pro-slavery argument, but he undergirded those tools with a natural-law presumption that modern positivist textualists explicitly disavow. He would see Gorsuch as an ally in the fight against "intent-ism," but Gorsuch would view Douglass's canon of liberty as a violation of the judicial role.
