answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Senate (Full Body)
  **FROM:** Allocations Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Mechanism for the Graduate Life Innovation Grant ($40,000)

  ### 1. Purpose and Context

  The Allocations Subcommittee is currently deadlocked regarding the allocation of this spring's $40,000 Graduate Life Innovation Grant. Two proposals have reached the final shortlist: (1) a subsidized on-campus childcare co-op, and (2) an expanded mental-health telehealth stipend. Both proposals are meritorious, and subcommittee deliberation has not yielded a consensus.

  A motion has been brought to the Subcommittee to resolve this deadlock not via traditional voting, but via a **decision market** (a mechanism akin to Robin Hanson's "futarchy"). Under this proposal, the Senate would define a welfare metric based on existing wellbeing survey data, and two conditional markets would be opened denominated in bookstore-credit tokens. The proposal with the higher market price after two weeks would receive the funding.

  This memo analyzes the epistemic and institutional viability of that proposal and provides a recommendation for the Full Senate's vote next Tuesday.

  ### 2. Analysis of the Proposed Mechanism

  The proposal seeks to leverage **information aggregation**. In social epistemology, the core argument for markets (following Hayek and Hanson) is that they aggregate dispersed, tacit knowledge held by the 900-strong graduate student body more effectively than a nine-person committee can through deliberation. If the market functions correctly, the price represents the collective expectation of how much each proposal will improve the defined welfare metric.

  However, for a prediction or decision market to function as a truth-tracking mechanism rather than a popularity contest, specific microstructural conditions must be met. We have evaluated the proposal against three critical constraints:

  **A. Incentive Compatibility (The Token Problem)**
  The proposal uses bookstore-credit tokens due to university gambling policies. While this complies with administrative rules, it introduces significant friction.
  *   *Liquidity & Fungibility:* Bookstore credit is not fungible cash. It cannot be easily converted to utility for students who do not purchase books, reducing the pool of willing traders.
  *   *Shorting:* A robust market requires the ability to bet *against* a false claim. It is mechanically difficult to "short" a proposal using non-fungible store credit. Without the ability to take negative positions, the market price may reflect only optimistic enthusiasm rather than a calibrated probability of success. This creates a systematic bias toward the proposal with the more vocal supporters, rather than the more effective one.

  **B. Market Thickness and Social Entanglement**
  Our population is approximately 900 students. In market design, this is considered "thin."
  *   *Manipulation Risk:* In a thin market, a coordinated coalition (e.g., a specific department or student group) could potentially move the price disproportionately to their actual belief, effectively "buying" the outcome through organization rather than information.
  *   *Signaling:* Because our community is socially entangled, trading is not anonymous in practice. Students may trade to signal loyalty to a cohort or advisor rather than to reveal true beliefs about the welfare metric. This reintroduces the exact social pressure dynamics that markets are supposed to bypass.

  **C. Metric Resolution and Lag**
  The proposal suggests resolving the market on a composite wellbeing metric. However, the Senate's wellbeing survey is annual.
  *   *Prediction vs. Realization:* The market cannot resolve on *actual* survey data in two weeks. It must resolve on a *prediction* of next year's survey data. This requires the Senate to commit to a specific formula now (e.g., "If Childcare wins, we bet on the 'Work-Life Balance' sub-score increasing by 5%").
  *   *Noise:* Annual survey data is noisy. Attributing a change in a global metric to a single $40,000 intervention is statistically fraught. If the metric fails to move due to external factors (e.g., a pandemic, housing crisis), the market resolves "incorrectly" despite the grant's success, punishing accurate traders and damaging the mechanism's credibility for future use.

  ### 3. Steelmanning the Opposition

  We must take seriously the argument that a flawed market is worse than a deliberative vote.
  *   **The Legitimacy Deficit:** If the market decides, and the "losing" proposal was clearly superior in hindsight, the Senate loses legitimacy. A vote carries democratic legitimacy; a market carries technocratic legitimacy. If the market is thin and manipulable, it possesses neither.
  *   **The "Elegant Solution" Critique:** Skeptics argue we are solving a problem we do not have. A 5-4 vote is a valid democratic outcome. Introducing a complex financial mechanism risks alienating students who view the Senate as a representative body, not a hedge fund. If the market is perceived as a gimmick, participation will be low, validating the "thin market" critique and rendering the epistemic benefit null.

  Conversely, we acknowledge the Pro-Market argument: A vote by nine senators is epistemically blind to the specific needs of the 900 students. If the market *could* work, it would be a profound innovation in student governance, aligning funding with actual student welfare rather than senatorial preference.

  ### 4. Recommendation

  **Recommendation: Run a Modified Pilot (Conditional Binding Market with Participation Threshold).**

  We recommend adopting the decision market mechanism, but with a critical modification to mitigate the "thin market" and "manipulation" risks. The market should be **binding only if a minimum participation threshold is met.**

  *   **The Mechanism:** Two conditional markets will open as proposed (denominated in bookstore credit).
  *   **The Safeguard:** We establish a **Liquidity Quorum**. For the market result to be binding, at least **5% of the graduate student body (45 unique traders)** must execute at least one trade, and total trading volume must exceed a set token threshold (e.g., 5,000 credits).
  *   **The Fallback:** If the Quorum is not met after two weeks, the market is declared non-binding, and the allocation reverts to a standard majority vote by the Full Senate.

  **Rationale:**
  This approach respects the epistemic ambition of the proposal while acknowledging the institutional risk.
  1.  **Epistemic Validity:** If 45+ students trade, we have reasonable evidence that the price reflects dispersed information rather than a small coalition's manipulation. We can trust the signal.
  2.  **Institutional Safety:** If participation is low, the market has failed to aggregate information. Reverting to a vote prevents a low-liquidity price from accidentally determining a $40,000 allocation.
  3.  **Future Proofing:** This pilot generates data on student willingness to engage with governance markets, informing whether a larger-scale futarchy is viable for the Senate in future years.

  ### 5. Timeline and Next Steps

