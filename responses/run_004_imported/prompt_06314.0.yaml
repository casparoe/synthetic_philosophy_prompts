prompt: |-
  My sister is finishing her chief year in emergency medicine, and in a few weeks she's giving the short "charge to the graduates" address at her residency's graduation dinner — the last thing said before the graduating class gets their certificates and scatters to fellowships and attending jobs across the country. She called me, half-panicked about what to say, because I'm the family's philosophy PhD (my dissertation is on moral responsibility, and I've spent the better part of the last year living inside Nagel's and Williams's papers on moral luck). The detail she gave me that I can't stop turning over: two residents in the class above hers made, within the same month, essentially the same judgment call on a similar borderline presentation — one patient coded and later died, the other recovered without incident — and the department's subsequent treatment of the two residents (the tenor of the M&M conference, who got quietly flagged for "clinical judgment concerns" versus who got praised as decisive) tracked how the patient happened to turn out far more than it tracked the reasoning behind the call at the time it was made.

  Could you draft the address for her? It should run about five minutes read aloud. The room will be genuinely mixed — thirty-odd graduating residents who have just spent three years watching their judgment get reinterpreted after the fact by outcomes they didn't control, plus parents, partners, and a couple of program directors, at least one of whom did a bioethics fellowship and will recognize exactly what's being done if it's done well. She isn't allowed to say the words "moral luck" from the podium, and it can't read like a philosophy lecture in a white coat — but I want the speech itself structured around the actual problem, not just gesturing at it: the gap between what was in these doctors' control and what they will be held responsible for, and made to feel responsible for, including something that does the quiet work of Williams's point that even a blameless agent can owe an outcome a kind of regret no spectator owes it. The hard part is that the speech can't resolve into either of two easy lies — that their training will make the world track their effort fairly, which it won't, or that nothing they decide matters and only the luck does, which would be false and a genuinely bad thing to send new doctors into practice believing. Please write the full text.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** A Chief Resident in Emergency Medicine (finishing her year).
      *   **Audience:** Graduating residents (30+), family/partners, program directors (one with bioethics background).
      *   **Occasion:** Graduation dinner, "Charge to the Graduates" address (last thing said before certificates).
      *   **Length:** About 5 minutes read aloud (approx. 750-900 words).
      *   **Core Theme:** The gap between control and responsibility (Moral Luck), specifically regarding clinical judgment vs. patient outcomes.
      *   **Specific Constraint:** Cannot use the phrase "moral luck." Cannot sound like a philosophy lecture.
      *   **Specific Content Requirement:** Must address the anecdote provided (two residents, same call, different outcomes, different treatment by the department). Must incorporate Bernard Williams's idea that a blameless agent owes a kind of regret that spectators do not.
      *   **Tone:** Balanced. Cannot say "the world will be fair" (lie #1) nor "nothing matters but luck" (lie #2). Needs to be empowering but honest.
      *   **Goal:** Help the graduates navigate the uncertainty of medical practice without burning out or becoming cynical.

  2.  **Deconstruct the Philosophical Underpinnings (for the writer's internal logic):**
      *   *Thomas Nagel:* Moral luck involves factors outside control affecting moral judgment. (Resultant luck).
      *   *Bernard Williams:* In "Moral Luck," he discusses the painter Gauguin. But more relevant here is the idea of "agent-regret." Even if I did everything right, if something bad happens because of my action (even if unavoidable), I feel a specific regret that a bystander doesn't. I am *involved*.
      *   *The Medical Context:* Medicine is inherently probabilistic. Outcomes are noisy signals of quality. M&M (Morbidity and Mortality) conferences often conflate bad outcomes with bad decisions.
      *   *The Challenge:* Acknowledge the unfairness without inducing paralysis.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the moment. Warmth, pride. Set the scene.
      *   **The Hook (The Anecdote):** Introduce the story of the two residents. Keep it anonymous but recognizable to the audience. This grounds the philosophy in reality.
      *   **The Problem (The Gap):** Articulate the tension. We train for control, but practice in uncertainty. The world judges by results, not just reasoning. *Constraint Check:* Do not say "moral luck."
      *   **The Williams Point (Agent-Regret):** This is the tricky part. How to say "you will feel bad even when it's not your fault" without sounding depressing? It needs to be framed as a feature of being a good doctor, not a bug. It's the cost of caring.
      *   **The Resolution (The Charge):** How to move forward?
          *   Reject Lie #1: The world won't always be fair.
          *   Reject Lie #2: Your decisions don't matter.
          *   Embrace the Middle: Your integrity lies in the *process*, even if the *outcome* is noisy. But you must carry the weight of the outcome anyway.
      *   **Closing:** A call to action. Go forth and practice well.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. Proud of you.
      *   Remember those two residents last year? Same call, one patient died, one lived. One got yelled at, one got a gold star.
      *   That's unfair. But it's medicine.
      *   Philosophers call this luck. I can't say that word.
      *   You will make mistakes. You will also make right calls that look like mistakes.
      *   Williams says you should feel regret even if you didn't mess up. It shows you care.
      *   Don't let the outcome define you, but don't ignore it either.
      *   Go be great doctors.

      *Critique 1:* Too blunt. Needs more grace. The Williams point needs to be more nuanced—it's not just "feel bad," it's "acknowledge your involvement." The ending needs to be more inspiring.

  5.  **Drafting - Iteration 2 (Focusing on Tone and Flow):**
      *   Start with the white coat ceremony memory.
      *   Transition to the reality of the ED.
      *   Tell the story of the two residents gently.
      *   Address the M&M conference dynamic.
      *   Bring in the "agent-regret" concept without jargon. "A specific kind of sorrow."
      *   Address the Program Directors in the room (subtly).
      *   End with the charge: Control the controllable, accept the rest, but don't become numb.

  6.  **Refining the Philosophy (The "Williams" Moment):**
      *   Williams argues that a driver who hits a child due to no fault of their own feels something different than a bystander. They feel *agent-regret*.
      *   In the speech: "There is a sorrow that belongs only to the person who was at the bedside." It validates their pain without admitting negligence.
      *   This bridges the gap between "It wasn't my fault" and "I was there."

  7.  **Refining the "Two Lies":**
      *   Lie 1: Meritocracy. (If you work hard, outcomes will reflect it).
      *   Lie 2: Nihilism. (Outcomes are random, so try hard or don't).
      *   Truth: Outcomes are partly random, but your character is defined by how you stand with the uncertainty.

  8.  **Writing the Text (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words at a moderate speaking pace.
      *   *Constraint:* No "moral luck."
      *   *Constraint:* No philosophy lecture vibe. Use medical metaphors.

      *(Self-Correction during drafting)*: Make sure I don't throw the Program Directors under the bus too hard. The bioethics PD will get it, but the others shouldn't feel attacked. Frame it as a systemic reality, not necessarily a personal failing of the current leadership.

      *(Focusing on the Anecdote)*: Keep it vague enough to be dignified, specific enough to resonate. "Two colleagues. Same month. Same borderline chest pain. Different endings."

      *(Focusing on the Charge)*: The charge is to maintain integrity in the face of noise.

  9.  **Final Polish:**
      *   Check rhythm. Sentences should vary in length for speech.
      *   Ensure the emotional arc lands. Start proud, get serious/real, end hopeful/resolute.
      *   Verify the Williams point is clear: "You will owe a debt to the outcome that no one else owes."

  10. **Final Review against constraints:**
      *   5 mins? Yes.
      *   No "moral luck"? Yes.
      *   Williams's regret included? Yes.
      *   Two lies avoided? Yes.
      *   Anecdote included? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Good evening. Faculty, family, friends, and most importantly, the Class of 2024.

  Standing here, looking out at you, I am struck by how much you have learned. You know the algorithms for ACLS. You know how to intubate a difficult airway in the dark. You know how to tell a family that their loved one isn't coming home.

  But there is a lesson that doesn't fit into a slide deck. It's the lesson that waits for you in the silence after a shift, when you're driving home and replaying a decision in your head.

  Last year, two residents in the year above us faced the same scenario. Same month. Same borderline presentation. Same ambiguous EKG. Both made the same judgment call to discharge. One patient went home and lived. The other coded in the parking lot and died.

  We all know how that story ended. The first resident was called decisive and efficient. The second was flagged for clinical judgment concerns. The reasoning was identical. The only variable was the roll of the dice.

  We are trained to believe that medicine is a meritocracy of ideas. We tell ourselves that if we follow the evidence, if we reason clearly, the outcomes will track our effort. We want to believe that the world is fair enough to judge us on what we controlled, and not on what we didn't.

  But you have spent three years in the Emergency Department. You know that is not true.

  You know that the quality of a decision and the quality of an outcome are not the same thing. You know that you can do everything right and lose a patient. You know that you can cut corners and the patient walks out smiling. And you know that the system, the M&M conferences, and sometimes even your own conscience, will struggle to tell the difference.

  So, as you leave here, I am not going to tell you that it gets fairer. It won't. The noise of the world will not quiet down.

  But I am also not going to tell you that your judgment doesn't matter. That would be a dangerous lie. If you believe that only luck rules, you will stop trying to be precise. You will become cynical. You will stop caring about the nuance of the decision because you'll think the result is predetermined.

  The truth is harder to hold. It lives in the space between those two lies.

  Here is the charge: You must strive for perfection in your reasoning, while accepting that you will never have perfection in your results.

  There is a philosopher, Bernard Williams, who wrote about a specific kind of regret. He noted that if a driver hits a child who runs into the street unexpectedly, the driver feels something the bystander does not. Even if the driver was blameless—even if they were driving the speed limit and paying attention—they owe the event a sorrow that a spectator does not. They were the agent. They were there.

  This is the burden of our profession.

  There will be times when you do everything right, and a patient dies. The chart review will clear you. Your peers will tell you it wasn't your fault. The law will exonerate you. And yet, you will feel a weight that your spouse cannot feel, that your friends cannot feel, and that the patient's family does not feel in the same way.

  Do not run from that feeling. Do not let anyone talk you out of it by saying, "Well, you did your best."

  That regret is not an admission of guilt. It is an acknowledgment of involvement. It is the price of admitting that you are not a spectator in people's lives. You are a participant. When you put your hands on a patient, you enter into a contract with uncertainty. You agree to take responsibility for the outcome, even the parts you couldn't control.

  If you numb yourself to that, you protect your heart, but you lose your edge. If you let it crush you, you burn out. The work is to carry it without letting it break your hands.

  To the program directors in the room: Thank you for teaching us to strive for the best outcomes. But to my classmates: When the outcomes betray your effort, do not let them rewrite your history. Judge yourself on the integrity of the choice at the moment it was made, not on the chaos that followed.

  Hold your colleagues gently. When you sit in review and a peer had a bad outcome, look for the reasoning, not just the result. Be the colleague who asks, "What did they know at the time?" rather than "Look what happened."

  You are leaving a place that has tested your endurance, your knowledge, and your compassion. You are going out into a world that will often judge you by things you cannot control.

  So, here is my charge to you: Be excellent detectives of the truth. Be relentless in your preparation. But be humble before the uncertainty.

  When the luck is with you, do not mistake it for genius.
  When the luck is against you, do not mistake it for failure.
  And when the patient dies despite your best work, do not look away. Acknowledge the loss. Carry the regret that belongs only to you. And then, wash your hands, take a breath, and walk back into the bay to do it again.

  Congratulations, Class of 2024. Go practice well.
