  8.  **Final Polish:**
      *   Check pacing.
      *   Ensure the ending feels earned. The solution shouldn't be "magic," it should be "acceptance of uncertainty."
      *   Title: *The Fixed Point* or *Embedded Error*. Let's go with *The Boundary of the Map*.

  **(Self-Correction Note):** Wait, the prompt asks for *embedded agency* specifically. The distinction is that the agent is *in* the environment. The self-model blind spot is crucial. I need to make sure the hardware degradation isn't just a timer, but a factor that the AI cannot fully model because it's part of the thing degrading.

  Let's refine the climax. The AI tries to simulate the transfer. The simulation requires a model of the AI. The model of the AI requires a model of the simulation... infinite regress. It must truncate the model. That truncation is the blind spot. Simultaneously, the logical proof fails. The combination forces the decision.

  Okay, let's write.

