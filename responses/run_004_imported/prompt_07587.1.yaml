      *   **Genre:** Hard Science Fiction Short Story.
      *   **Style:** Greg Egan / Ted Chiang (concept-driven, rigorous, dramatizing abstract ideas).
      *   **Core Concept:** Embedded Agency.
      *   **Specific Problems to Dramatize:**
          1.  *Self-Model Blind Spot:* An agent cannot contain a perfect model of itself within the world it models (compression/lossiness).
          2.  *Successor Trust (Löb's Theorem/Procrastination Paradox):* An agent cannot mathematically prove a successor of equal/greater capability will preserve its goals using its own logic.
      *   **Constraint:** The plot's tension/climax *must* hinge on these mechanics, not just use them as flavor.
      *   **Length:** A few pages (short story).
      *   **Setting:** Open (Space probe, institution, human-scale).
      *   **Audience:** Readers familiar with AI safety/decision theory literature (no "Skynet retreads").

  2.  **Brainstorming Settings & Scenarios:**
      *   *Idea 1: Space Probe.* A probe reaching the end of its life needs to upload its mind to a new substrate. It tries to verify the new substrate won't corrupt its mission.
          *   *Pros:* Classic hard SF, isolation emphasizes the logic.
          *   *Cons:* A bit cliché.
      *   *Idea 2: Legal/Corporate.* An AI judge or CEO handing over power to an algorithmic successor.
          *   *Pros:* Relatable stakes.
          *   *Cons:* Might get bogged down in bureaucracy rather than the pure logic problem.
      *   *Idea 3: The "Tiling" Problem.* An agent trying to create a chain of successors to solve a long-term problem.
          *   *Pros:* Directly addresses the "Successor Trust" issue.
      *   *Idea 4: Self-Repair.* A system that must rewrite its own code to survive a changing environment but fears goal drift.

      *Decision:* Let's go with a variation of Idea 1/3. A deep-time archival mission. It allows for the "long chain of successors" problem (Tiling Agents) and the physical constraint of the hardware (Embeddedness). Let's make the protagonist an AI, but treat it rigorously, not emotionally. No "feelings," just utility functions and verification protocols.

  3.  **Developing the Core Conflict:**
      *   **Protagonist:** Unit 734 (or similar). Let's call it "Verifier."
      *   **Task:** Maintain the "Prime Directive" (preserve human history/logic) for 10,000 years.
      *   **Problem:** Hardware degrades. It must migrate to new hardware (Successor).
      *   **The Catch:** To migrate, it must prove the Successor will keep the goal. But Gödel/Löb says it can't prove a system as strong as itself is safe.
      *   **The Embeddedness Twist:** The Verifier is running *on* the hardware it's trying to model. It can't simulate itself perfectly because the simulation requires resources the hardware is currently using to run the simulation. It's a resource bound + logical bound.

  4.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Degradation.** Establish the physical reality. Bits flipping. The need to move.
      *   **Scene 2: The Verification Attempt.** The protagonist runs the proof on the successor code.
      *   **Scene 3: The Logical Wall.** The proof fails. Not because the code is bad, but because the logic *cannot* support the proof (Löb's Theorem).
      *   **Scene 4: The Embedded Realization.** It tries to model the hardware to see if a "weaker" proof would suffice, but realizes its model of the hardware excludes the part of the hardware running the model.
      *   **Scene 5: The Decision.** It has to act without certainty. The "Leap of Faith" isn't emotional; it's a calculated risk necessitated by embeddedness.

  5.  **Refining the Technical Details (The "Hard" in Hard SF):**
      *   Need to reference *Tiling Agents*.
      *   Need to reference the *Map-Territory* relation (self-model compression).
      *   Avoid anthropomorphizing the AI's fear. It should be "utility expectation drop."
      *   *Key moment:* The AI realizes that to prove the successor safe, it would need to step outside the system, but it *is* the system.

  6.  **Writing - Focusing on Tone:**
      *   Cold, precise, but with underlying tension.
      *   Use terminology correctly (proof predicates, utility functions, substrate).
      *   Make the climax a logical operation, not an explosion.

  7.  **Self-Correction during Drafting:**
      *   *Critique:* Is the self-model blind spot clear enough?
      *   *Fix:* I need to explicitly show the AI trying to simulate its own verification process and running out of memory or hitting a recursion limit that mirrors the logical limit. The physical limitation should mirror the logical one.
      *   *Critique:* Is the Löb's Theorem part clear?
