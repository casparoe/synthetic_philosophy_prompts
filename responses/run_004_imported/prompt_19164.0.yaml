answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. For those who *do* know me, you're probably wondering which one of us is actually speaking right now.

  It's a running joke in our family that my brother and I are interchangeable. We've had teachers mix up our grades, employers mix up our resumes, and yes, even girlfriends mix up our dates. For most of our lives, we were living proof of a philosophical problem.

  A few years ago, I fell down a rabbit hole reading about a thought experiment by a philosopher named Max Black. He asked us to imagine a universe containing nothing but two iron spheres. They are perfectly identical. Same size, same temperature, same composition. Qualitatively, they are indistinguishable. Yet, Black argued, they are still *two* things. They occupy different spaces.

  For a long time, that felt like the story of me and [Groom]. Genetically, we are those spheres. So, I have to be honest with you all: I cannot stand up here and tell you the groom is "one of a kind." I am standing right here to disprove that. Qualitatively, I am his duplicate.

  But Max Black missed something crucial about spheres, and about brothers. He imagined them in an empty universe. But [Groom] doesn't live in an empty universe. He lives in this one. And specifically, he lives in [Bride]'s universe.

  [Bride], you are the coordinate system that distinguishes him.

  When you met us, you didn't see two identical spheres. You saw *him*. Not because his DNA is unique—because it isn't. But because the space he occupies in your life is a space I cannot enter. The way he loves you, the specific history you share, the private jokes, the quiet mornings, the way he looks at you across a room… those are properties I do not share.

  Leibniz said that if two things share all the same properties, they are the same thing. But you have given him properties that are his alone. You have made him distinct. Not by changing who he is, but by loving him in a way that no one else ever has, or will.

  So, while I may be his identical twin, I am not his duplicate in this room. Because the man standing next to you is the only version of him that gets to be your husband. And that makes him singular enough for me.

  Please raise your glasses. To [Groom] and [Bride]. May you always occupy the same space, and may you never be mistaken for anyone else.

  To the happy couple.
