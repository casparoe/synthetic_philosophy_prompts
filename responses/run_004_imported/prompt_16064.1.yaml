answer: |-
  The water in the basin was turning grey. Henry Sidgwick scrubbed his hands with the rough brown soap, but the scent of the séance room clung to him—a cloying mixture of stale lavender, ozone, and the metallic tang of fear. He dried his hands on the towel, staring at his reflection in the mirror above the washstand. The gaslight flickered, casting a trembling shadow behind his own eyes.

  He looked like a man who had just balanced a ledger and found the columns did not match.

  In the study next door, the manuscript of *The Methods of Ethics* lay open on the desk. It was a book built on granite, a cathedral of logic designed to house the moral life of mankind. But Henry knew where the cracks were. He knew them better than anyone. He had spent twenty years tracing the fissure he called the "dualism of practical reason." It was a simple, terrifying equation: Reason demands you be virtuous, but Reason also demands you seek your own happiness. In this life, they do not always align. Sometimes, duty is ruinous. Sometimes, the good man starves while the rogue feasts.

  If the universe ends at the grave, morality is a biological error. A beautiful lie.

  Henry walked into the study. The air was colder here. On the desk, beside his own manuscript, lay the notes from tonight's session. Mrs. G. The medium. A woman with trembling hands and eyes that looked too old for her face.

  He sat down and picked up his fountain pen. The nib hovered over the paper.

  *Phenomenon 4:* Rapping sounds. *Source:* Indeterminate. *Probability of Fraud:* High. *Probability of Anomaly:* Non-zero.

  He stared at the words. *Non-zero.* That was the only thing that kept him breathing.

  If the dead persist, the ledger balances. If consciousness survives the body, then the sacrifices made in the dark are recorded. The universe keeps accounts. Suffering becomes an investment; duty becomes a long-term strategy for happiness. But if the silence after death is absolute, then Henry's entire life's work was merely a sophisticated way of telling people to be nice while the ship sank.

  He closed his eyes and saw the table again. The wood grain. The hands of the other sitters resting lightly on the rim. He had felt the tilt. He had felt the vibration. But had he felt it, or had he *willed* it?

  That was the torture. It wasn't that he was gullible. It was that he was a logician forced to gamble. He needed the ghost to be real not because he missed the dead—he was a man of reserved affection—but because he needed the *mechanism*. He needed a cosmic enforcer. Without it, Utilitarianism was just a suggestion box in a burning building.

  A draft shifted the papers on his desk. Henry didn't move to weigh them down.

  "Show me," he whispered. The word hung in the room, pathetic and small.

  He wasn't asking for a loved one. He wasn't asking for comfort. He was asking for data. He needed one empirical fact that proved the moral arc of the universe actually curved toward justice. If he could prove the spirit existed, he could prove that the sacrifice of self-interest was rational. He could close the book. He could sleep.

  But the room remained empty. The silence was not peaceful; it was aggressive. It was the silence of a courtroom where the judge has left the bench.

  He looked at his notes again. Mrs. G. had spoken in a voice that wasn't hers. She had mentioned a name. *Arthur.* Henry's brother. Dead twenty years.

  *Coincidence,* his mind supplied. *Cold reading. You mentioned the name in the preliminary interview. You wrote it in the log.*

  *Did I?*

  He flipped back through the leather-bound journal. His handwriting was precise, cramped. There it was. *Subject's brother, Arthur, deceased 1866.* He had written it down. He had handed the data to the medium before the lights went out. She had simply fed it back to him.

  It was a trick. A parlor trick.

  Henry dropped the pen. It rolled across the desk and fell to the floor with a clatter that sounded like a gunshot.

  He should feel relief. He was a man of science. A fraud exposed was a victory for truth. But he felt nothing but a hollowing out of his chest, a physical sensation of collapsing. If Mrs. G. was a fraud, then the door was closed. If the door was closed, the dualism remained.

  If the dualism remained, then why?

  Why had he given away his money? Why had he worked himself to the bone for the education of women, for the reform of the university, for the betterment of a species that might not even deserve it? He had lived as if the investment would pay out. He had structured his soul around a dividend that might never come.

  He stood up and walked to the window. London was a smear of fog and gaslight outside. Somewhere out there, a man was sleeping soundly after cheating his partner. Somewhere, a woman was dying in poverty after caring for a sick parent. The math didn't work. The universe was indifferent.

  Henry placed his hand against the cold glass. He thought of the other members of the Society for Psychical Research. Myers, with his frantic mysticism; Gurney, with his desperate hypotheses. They thought they were hunting ghosts. They weren't. They were auditors. They were trying to find the signature on the cosmic contract that guaranteed virtue was not a suicide pact.

  He turned back to the desk. He had to write. He had to document the failure. That was his duty. To be honest, even if honesty was useless.

  He picked up the pen. He dipped it in the ink.

  *Conclusion:* The evidence remains inconclusive. The probability of survival is not established.

  His hand shook. The ink blot spread, a dark stain on the white page. It looked like a wound.

  He could lie. He could write that the rapping was genuine. He could tip the scales. If he, Henry Sidgwick, the great rationalist, endorsed the supernatural, others would believe. Morality would be bolstered by faith. He could save the system by faking the proof.

  It would be the ultimate utilitarian act. A lie to maximize happiness. To give people the comfort of the afterlife so they would behave well.

  He stared at the blot.

  But if he lied, he admitted that the truth wasn't enough. He admitted that virtue required a threat to sustain it. If he faked the ghost, he proved that the moral law had no power on its own.

  He was trapped in the circle. To prove morality, he needed truth. To find truth, he needed evidence. The evidence was missing. So morality had no foundation. So he should lie to support it. But lying destroys the foundation.

  The gaslight hissed. The flame dipped low, then flared.

  Henry sat in the wavering light. He was a man standing on a bridge he knew was broken, refusing to step back, refusing to jump. He thought of the cold hands of the medium. He thought of the warm hand of his wife, Eleanor, sleeping in the next room. She believed more easily than he did. She found comfort in the ambiguity. She could live with the mystery.

  Henry could not. He needed the equation to balance. *Virtue = Happiness.* It had to be an identity, not a hope.

  He looked at the manuscript of *The Methods*. It was dry. It was safe. It acknowledged the dualism and offered no solution. It was an honest map of a broken world.

  He looked at the séance notes. They were messy. They were desperate. They were a reach into the dark for a hand that might not be there.

  He realized then that he would go back. Next week. Next month. He would sit in the dark with more frauds, more hysterics, more trembling tables. He would scrub the scent of lavender and ozone from his skin until his hands were raw. He would do this until the day he died.

  Not because he believed. But because he couldn't afford not to.

  If he stopped looking, he admitted the silence was permanent. If he admitted the silence was permanent, he had to admit that his life's work was a tragedy.

  So he would keep looking. He would keep the wound open. Because as long as the wound bled, there was a chance it was a vein connecting him to something else. As long as he was searching, the universe hadn't quite finished its sentence.

  Henry dipped the pen again. He drew a line through the word *inconclusive*. He wrote *ongoing*.

  It wasn't a solution. It wasn't a discovery. It was just a reprieve.

  He blew out the candle. The darkness rushed in, heavy and absolute. He sat in the blackness, listening to the house settle, listening to the wind, listening for a rap on the wood that never came, terrified that if it did, he would finally have to calculate the cost.
