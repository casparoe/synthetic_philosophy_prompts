      *   *Decision:* I will write the toast with specific *categories* of concrete impact (e.g., "the time she stayed late," "the paper she fixed") but phrase them so the speaker can either use a generic truth or swap in a specific name. Actually, to meet the "constructive" requirement of the advisor, the toast *itself* must model constructive proof. I will include specific *types* of interactions that are universally true for her students, but I will explicitly tell the user in the notes to insert one specific proper noun/story to seal the deal.
      *   *Refinement:* To make it truly "constructive," I need to point to *me* (the speaker) as the witness. "I am here because..." is a constructive proof of her impact.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mixed crowd. Break the ice about the math.
