answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I had the privilege of being [Advisor's Name]'s student, and eventually, her advisee. For those of you who *do* know me… I promise to keep this under five minutes, because she taught me that efficiency is the courtesy of kings.

  Now, looking around this room, I see a bit of a divide. On my left, we have family and old friends who know [Advisor's Name] as a person who loves [gardening/wine/travel]. On my right, we have logicians and set theorists who know her as the person who proved [Specific Theorem/Paper].

  For the family: Don't worry. I'm not going to talk about math.
  For the logicians: Don't worry. I'm not going to talk about *feelings*.
  I'm going to talk about the place where [Advisor's Name] lives: the equivalence between the two.

  There is a famous joke in our field that [Advisor's Name] has opened her graduate course with for thirty-five years. She tells the class that the Axiom of Choice is "obviously true." The Well-Ordering Theorem is "obviously false." And Zorn's Lemma is completely incomprehensible. The punchline, of course, is that all three are logically equivalent. If you believe one, you must believe the others. She spends the rest of the semester proving that our intuitions are wrong.

  I realized recently that this joke is actually the story of her career. And since she explicitly warned me that anyone who talks about her "legacy living on in all of us" without a concrete witness is just making a "non-constructive existence claim," I am going to be very careful to construct the proof right here.

  **First, the Axiom of Choice.**
  To a set theorist, this says you can make a selection from infinite sets. To everyone else, it means making choices.
  It was "obviously true" that [Advisor's Name] cared about us. It wasn't a theorem we had to prove. It was an axiom. You walked into her office, and you knew you were chosen. Not because we were the smartest, but because she chose to invest in us.
  *(Optional: Insert 1 sentence specific example here, e.g., "She chose to read my draft the weekend her own book was due.")*
  That part was easy. That part felt natural.

  **Second, the Well-Ordering Theorem.**
  Mathematically, this says you can line up every single element in a set in a specific sequence. Intuitively? That feels impossible.
  When I started my dissertation, my life was not well-ordered. It was chaotic. My ideas were messy. The timeline was impossible. By all intuition, it should have been "obviously false" that this could ever be organized into a coherent career.
  But [Advisor's Name] has a unique ability to take the chaotic set of a young academic's life and well-order it. She found the sequence. She found the first step, and the next, and the next.
  *(Optional: Insert 1 sentence specific example, e.g., "She turned my rambling three-hour rant into a two-page research plan.")*
  To us, it felt like magic. To her, it was just Tuesday.

  **Third, Zorn's Lemma.**
  This is the one nobody understands. It's the heavy machinery that proves the equivalence. It's the work you don't see.
  For thirty-five years, we saw the results: the published papers, the tenured students, the awards. That was the Axiom. But we didn't see the Zorn's Lemma. We didn't see the late nights reviewing grant proposals for colleagues who wouldn't know her name. We didn't see the quiet advocacy in committee rooms when the door was closed. We didn't see the patience required to explain the same concept for the thousandth time without a hint of frustration.
  That work was incomprehensible to us, because we were too busy benefiting from it.

  And here is the equivalence proof she spent her life teaching us.
  Her brilliance, her mentorship, and her hidden labor are not three different things. They are logically equivalent. They are all the same thing: **Devotion.**

  So, [Advisor's Name], you told me not to make non-constructive claims. You said, "Show me the witness."
  Well, look around.
  I am a witness.
  *(Gesture to other former students in the room)*
  Sarah is a witness. David is a witness.
  The papers on your shelf are witnesses.
  The department you built is a witness.

  We are not an abstract "legacy." We are a constructive set. We are here, tonight, because you chose us, you ordered our chaos, and you did the hard work behind the scenes to make sure we could stand here.

  For the family in the room: She loved you best. Just ask her.
  For the students in the room: She believed in us first. Just look at us.

  [Advisor's Name], you have proven that intuition can be misleading, but rigor reveals the truth. And the rigorous truth is that we are incredibly lucky to have been in your orbit.

  Please raise your glasses.
  To the Axiom of your kindness, which was always true.
  To the Well-Ordering of our lives, which you made possible.
  And to the Equivalence of it all, which we will spend the rest of our careers trying to live up to.

  Happy Retirement.
