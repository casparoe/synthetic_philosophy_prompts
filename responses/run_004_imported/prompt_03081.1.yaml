  2.  **Identify the Core Philosophical Concept:**
      *   This is a classic problem in philosophy of science and Bayesian epistemology known as **The Problem of Old Evidence** (posed famously by Clark Glymour in 1980).
      *   *The Formal Issue:* In standard Bayesian conditionalization, evidence $E$ confirms hypothesis $H$ if $P(H|E) > P(H)$. By Bayes' Theorem, this happens if $P(E|H) > P(E)$. If $E$ is already known with certainty, $P(E) = 1$. Since probabilities can't exceed 1, $P(E|H)$ must also be 1. Therefore, $P(H|E) = P(H)$. The evidence provides no boost.

  3.  **Address the "Science is Cheating" Worry:**
