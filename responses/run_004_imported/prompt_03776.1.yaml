answer: |-
  To get a gut-level grasp of the difference between Epistemic Contextualism (EC) and Pragmatic Encroachment (PE), you have to stop looking at the Bank Case as a puzzle about *Hannah* and start viewing it as a puzzle about the *sentence* "Hannah knows the bank is open."

  The reason they look identical in the standard literature is that in the standard Bank Case, the **Attributor** (the person saying "Hannah knows") and the **Subject** (Hannah) are usually assumed to share the same context. When the views diverge, it is because we separate the Attributor's situation from the Subject's situation.

  Here is the breakdown of the mechanisms, a case where they fight, and the cost of buying into each.

  ### 1. The Mechanism: Where is the Semantic Action?

  The fundamental divide is about what determines the **truth conditions** of a knowledge attribution. A truth condition is the state of the world that must obtain for a sentence to be true.

  **Epistemic Contextualism: The Action is in the Speaker's Mouth**
  For the Contextualist, the word "knows" is indexical, much like "here," "now," or "tall."
  *   **Mechanism:** The semantic content of "knows" shifts depending on the **Attributor's** context. When a speaker utters "S knows that p," the standards for knowledge are set by the speaker's conversational context (specifically, how salient error possibilities are to the *speaker*).
  *   **The Subject's Role:** Hannah's practical situation is irrelevant to the *truth* of the sentence "Hannah knows." Only her evidence and the truth of the belief matter relative to the *speaker's* standards.
  *   **Prediction:** If I am in a low-stakes conversation, "Hannah knows" is easy to make true. If a skeptic raises the stakes in my conversation, "Hannah knows" becomes false, even if Hannah is sitting at home completely relaxed. The change happens in *my* conversation, not in Hannah's head.

  **Pragmatic Encroachment (SSI): The Action is in the Subject's Stakes**
  For the Pragmatic Encroacher, the word "knows" has a fixed, invariant meaning (standard invariantism). However, whether a subject *satisfies* that meaning depends on more than just evidence and truth.
  *   **Mechanism:** The truth conditions of "S knows that p" include facts about **S's (the Subject's)** practical environment. Knowledge is a relation between a subject, a proposition, and a practical situation. High stakes raise the epistemic bar required to stand in that relation.
  *   **The Attributor's Role:** My context as the speaker is irrelevant to the *truth* of the sentence. I can be a skeptic, or I can be careless; neither changes whether Hannah actually knows.
  *   **Prediction:** If Hannah is in a high-stakes situation, "Hannah knows" is false, regardless of who says it or what their stakes are. If Hannah is low-stakes, it is true, even if I am a skeptic talking about her.

  **Summary for Prediction:** To predict the verdict, ask: **Whose stakes drive the truth value?**
  *   If the **Speaker's** stakes drive it $\rightarrow$ Contextualism.
  *   If the **Subject's** stakes drive it $\rightarrow$ Pragmatic Encroachment.

  ---

  ### 2. The Divergence Case: Crossed Stakes

  To see these theories pull apart, we need a **Crossed-Stakes Case**, where the Attributor and the Subject have mismatched practical interests.

  **The Setup:**
  *   **Subject (Hannah):** Hannah has a check for \$10. She needs to deposit it, but if she misses the Saturday deposit, nothing bad happens. She is indifferent. She has standard evidence (was there two weeks ago, bank usually open).
  *   **Attributor (Sarah):** Sarah is speaking about Hannah. However, Sarah's own life depends on Hannah's check clearing. If Hannah's check bounces, Sarah will be unable to pay her rent and will be evicted. Sarah is aware of Hannah's evidence and Hannah's indifference.

  **The Question:** Is Sarah's utterance **"Hannah knows the bank is open"** true or false?

  **The Contextualist Verdict: FALSE**
  *   **Reasoning:** The truth conditions are set by Sarah's (the Attributor's) context. Because Sarah faces eviction, the stakes in her conversational context are extremely high. The salience of error (the bank being closed) is high for *her*. Therefore, the semantic standard for "knows" in her mouth is raised to a level Hannah's evidence cannot meet.
  *   **Result:** Sarah cannot truthfully say Hannah knows, even though Hannah is relaxed. The "knowledge" disappears because the *speaker* is stressed.

  **The Pragmatic Encroachment Verdict: TRUE**
  *   **Reasoning:** The truth conditions are set by Hannah's (the Subject's) context. Hannah faces no disaster if she is wrong. Her practical environment is low-stakes. Therefore, the epistemic bar for her to possess knowledge is low. Her standard evidence clears that bar. Sarah's desperation is irrelevant to Hannah's epistemic status.
  *   **Result:** Sarah can truthfully say Hannah knows. Sarah's stakes might make it *imprudent* for Sarah to rely on Hannah, but it doesn't change the fact that Hannah knows.

  *(Note: You can reverse this. If Hannah is high-stakes but the Attributor is a low-stakes philosopher writing a paper, Contextualism says "Hannah knows" is True [in that context], while PE says it is False [because Hannah's stakes are high].)*

  ---

  ### 3. The Strongest Objections (The Cost of Admission)

  Both views save the intuition that stakes matter, but they pay a heavy theoretical price to do so.

  **The Cost of Contextualism: Semantic Blindness**
  The most damaging objection to Contextualism (championed by Timothy Williamson and John Hawthorne) is that it implies ordinary speakers are systematically confused about their own language.
  *   **The Charge:** If "knows" is context-sensitive like "tall," we should be able to detect the shift. If I say "I know" (low standards) and a Skeptic says "You don't know" (high standards), Contextualism says we are both speaking truly. We are talking past each other (like one person saying "It's raining" in London and another saying "It's not raining" in Tokyo).
  *   **The Problem:** But that's not how it *feels*. It feels like a genuine disagreement. We argue as if we are contradicting each other. Contextualism requires us to believe that speakers are "semantically blind"—they systematically fail to recognize that the meaning of "knows" is shifting beneath their feet. This makes the theory linguistically implausible; it posits a hidden complexity in our language that no speaker actually recognizes or uses consciously.

  **The Cost of Pragmatic Encroachment: The Purity of the Epistemic**
  The most damaging objection to PE is that it violates the traditional conception of knowledge as a purely cognitive, truth-related state.
  *   **The Charge:** Knowledge is supposed to be about how well your mind hooks onto the world (evidence, reliability, truth). Practical stakes are about what you *want* or what you *need* (conative states). PE claims that your *desires* or *financial needs* can change whether you have knowledge.
  *   **The Problem:** This seems to commit a category error. How can the size of my bank balance affect the justification for my belief about the bank's hours? If evidence is defined as that which makes a belief likely to be true, practical stakes shouldn't touch it. By allowing practical factors to determine epistemic status, PE blurs the line between **theoretical rationality** (believing what is true) and **practical rationality** (acting in your interest). Critics argue PE doesn't show that stakes change *knowledge*; it shows that stakes change whether it is *appropriate to act* on knowledge. PE risks dissolving epistemology into decision theory.

  ### Summary for Adjudication

  If you are trying to decide between them in a novel case, use this heuristic:

  1.  **Is the intuition driven by the speaker's anxiety or the subject's risk?**
      *   If you feel the sentence "S knows" becomes false because *you* (the evaluator) are suddenly worried about error $\rightarrow$ lean **Contextualism**.
      *   If you feel the sentence becomes false because *S* would suffer terribly if wrong $\rightarrow$ lean **Pragmatic Encroachment**.

  2.  **Which cost can you tolerate?**
      *   Can you accept that ordinary people are confused about the meaning of "knows" (Contextualism)?
      *   Can you accept that your practical interests partly constitute your epistemic status (Pragmatic Encroachment)?

  In the graduate seminar, the debate usually stalls because Contextualists bite the "Semantic Blindness" bullet to save the purity of knowledge, while Pragmatic Encroachers bite the "Purity" bullet to save the intuition that speakers aren't semantically blind.
