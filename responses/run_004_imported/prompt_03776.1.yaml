  2.  **Deconstruct the Two Views (Mental Sandbox):**
      *   *Contextualism:* The word "knows" is context-sensitive (like "tall" or "flat"). The standards for truth change depending on who is *speaking* (the attributor). If I say "Hannah knows," the truth conditions depend on *my* context (my stakes, my salience of error). Hannah's situation doesn't change the proposition expressed by "Hannah knows."
      *   *Pragmatic Encroachment (SSI):* The word "knows" is invariant (standard semantics). However, whether the subject *satisfies* those conditions depends on their practical situation (stakes, interests). Knowledge is a relation between subject, proposition, and practical environment. The attributor's context doesn't change the truth conditions; the subject's stakes do.

