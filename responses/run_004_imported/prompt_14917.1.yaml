answer: |-
  **Excerpt from the Working Draft: *A Private Rejoinder to G.E.M. Anscombe***

  **I. The Structure of the Act**
  Anscombe is correct to dismiss the utilitarian calculus. To argue that the ends justified the means is to surrender the very ground of moral law. If murder is intrinsically evil, no quantity of future lives saved can transmute it into good. Therefore, my defense cannot rest on the cessation of hostilities. It must rest on the *nature of the act itself*.

  Under the Doctrine of Double Effect (DDE), an act causing death is permissible if:
  1.  The act itself is morally neutral or good (a legitimate act of war).
  2.  The bad effect (civilian death) is not intended, neither as an end nor as a means.
  3.  The good effect (destruction of war-making capacity) is not produced *by* the bad effect.
  4.  There is a proportionate reason for permitting the bad effect.

  **II. The Military Object**
  Hiroshima was not merely a city; it was the headquarters of the Second General Army and the Chugoku Regional Army, commanding the defense of southern Japan. It was a logistical node. Nagasaki was a port of embarkation and the site of the Mitsubishi-Urakami Ordnance Works, producing torpedoes and munitions.

  In a just war, the destruction of command structures and industrial arteries is a legitimate good. The atomic bomb, in this framing, is simply a delivery system of high efficiency. The *object* of the intention was the neutralization of these specific military and industrial functions. The vaporization of the civilian population, while foreseen with certainty, was not the *aim*. The aim was the silencing of the guns and the severing of the chain of command. The civilians died *because* they were near the guns, not *so that* the guns would fall silent. Their deaths were a side effect, not the mechanism of victory.

  **III. Proportionality**
  Anscombe might argue proportionality fails—that the destruction was too vast. But proportionality in the DDE is not a body count; it is a weighing of values. The value at stake was the termination of a total war of aggression, a conflict defined by the absolute subordination of morality to state power. To destroy the capacity for such aggression is a good of the highest order. If the military objective is supreme, the collateral damage, however horrific, may be proportionate to the end of restoring a moral order where such calculations are no longer necessary.

  ***

  **Internal Critique: The Target Committee Complication**

  *The physicist pauses, pen hovering over the paper. He turns the page of his reference file: the minutes of the Target Committee, May 10 and July 24, 1945.*

  The argument above holds only if the civilian death is truly incidental. But the historical record contaminates the intention.

  The Committee did not select Hiroshima and Nagasaki solely for their military utility. Kyoto, a cultural center with less immediate military value, was initially preferred. Why? Because the target needed to be "intellectually sophisticated" enough to appreciate the significance of the weapon. The minutes state the objective was to make a "profound impression on Japanese leadership."

  Here lies the fracture in the Double Effect defense.

  If the "profound impression" is achieved through the destruction of military capacity, the DDE holds. The leadership sees their army is gone. But the minutes suggest the impression was to be achieved through the *spectacle* of the destruction itself. The cities were kept "clean" of conventional bombing specifically to ensure the full effect of the atomic bomb could be measured and *witnessed*.

  This implies the civilian destruction was not merely a side effect; it was part of the *message*.

  If I bomb a factory and workers die, they die as collateral. If I bomb a city *to show* that I can bomb a city, using the scale of civilian death as the metric of my power to coerce the Emperor, then the civilian suffering becomes the *means* of coercion.

  Anscombe writes: *"For men to choose to kill the innocent as a means to their ends is always murder."*

  Did we choose to kill the innocent as a means?
  If the "psychological impact" relied on the horror of the civilian toll to break the will of the leadership, then yes. The terror of the populace was the lever moved to shift the mind of the Emperor. The civilians were not just bystanders caught in the blast; they were the audience for whom the blast was staged.

  **IV. Conclusion on Viability**

  The Double Effect defense collapses under the weight of the "psychological criteria."

  To satisfy the DDE, the good effect (military neutralization) must not be produced *by* the bad effect (civilian death). Yet, the Target Committee's logic suggests the surrender was to be hastened not merely by the loss of troops, but by the *shock* of the civilian catastrophe. The "profound impression" was the terror of total urban erasure.

  Therefore, the civilian death was not merely foreseen; it was instrumentalized. It was woven into the strategic intent. We did not just accept their deaths as a cost; we required their deaths as a demonstration.

  Anscombe is right. The intention was impure. In seeking to make the destruction "sufficiently spectacular," the boundary between military objective and civilian massacre was dissolved by design, not merely by yield. The Doctrine of Double Effect requires a clean line between means and side effects. At Hiroshima, the side effect *was* the means.

  *The physicist puts down the pen. He does not send the letter.*
