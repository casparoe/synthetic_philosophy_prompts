      *   *All-Affected Interests (Goodin):* People affected by decisions should have a say. Marisol is affected by U.S. laws but has no vote. The toast should acknowledge her stake in the family/community without demanding she validate the state's boundary.
      *   *All-Subjected Principle (Abizadeh/Miller):* Those subject to coercion (laws) have a claim to justification/belonging. This aligns with Danny's "laws fall on" comment. The toast should validate Danny's feeling of relief (now he has a vote) while affirming that Marisol's subjection to laws doesn't diminish her standing in the *family*.
