answer: |-
  Good evening, everyone. For those who don't know, I'm the one in the family who writes for a living, which is a polite way of saying I'm the only one who gets nervous when asked to speak off the cuff. So, please, if I stumble, just assume it's a stylistic choice.

  We are here to honor Danny. And if you know Danny, you know he doesn't do anything halfway. For eleven years, he has navigated the paperwork, the waiting, the fees, and the interviews. He has earned this weekend. I've heard him joke that next week is the day he "finally counts." That on Monday, he stops being a permanent guest in this country and becomes someone whose voice officially matters.

  Danny, I want to start by telling you: You are right.

  That relief you feel? It is real. The line the government draws is a real line. It changes what you can do, where you can go, and how you stand before the law. It is a heavy thing to carry for eleven years, and it is a joyful thing to set down. We honor that. We honor the work it took to cross that threshold.

  But because I'm the writer, I've been thinking about the word "counts." And I've realized that in this room, we are actually keeping two different ledgers.

  There is the ledger of the state. That one is strict. It has borders, and rules, and stamps. It decides who gets to vote and who gets to stay. That ledger is important, and next week, Danny's name gets written into it in permanent ink.

  But then there is the ledger of this family. This ledger doesn't care about borders. It doesn't care about statutes. It operates on a different math. In this ledger, you don't count because you have a ballot; you count because you are here. You count because you show up. You count because when things are hard, you are the person we call, and when things are good, you are the person we want at the table.

  I look around this room, and I see people whose roots in this soil run deeper than any document can measure. I see people who have lived under the same laws, faced the same worries, and contributed the same love to this family, regardless of what the first ledger says. We know that belonging isn't something a stamp in a passport grants or denies. We know that the people sitting closest to us are the ones who define where the boundary of "us" actually lies.

  So, Danny, next week you become a citizen of the United States. That is a triumph. But I want to remind you that you've been a citizen of this family since the day we met. And in this democracy, the one that matters most when the lights go down and the dishes need washing, you've always had full voting rights.

  We are so proud of the status you've earned from the government. But we are even more grateful for the status you've earned from us.

  So if everyone could please raise a glass.

  To Danny: May your new passport open doors. But know that you never needed a key to walk through ours.

  To family.

  ***

  ### Annotator's Key (For Your Eyes Only)

  *   **"Two Different Ledgers":** This distinguishes the *state's boundary* (the demos) from the *moral community's boundary* (the family). It validates the state's authority without granting it moral supremacy over the family's definition of belonging.
  *   **"Danny, I want to start by telling you: You are right":** This avoids correcting him from the podium (respecting his agency and relief). It acknowledges the *all-subjected* reality—he *was* subject to laws without a vote, and that change is material.
  *   **"I see people whose roots in this soil run deeper than any document can measure":** This is the Marisol move. It acknowledges her presence and her stake in the community (Goodin's all-affected interests) without explicitly stating her legal status or making her a political prop. It affirms her belonging is antecedent to the state's recognition.
  *   **"In this democracy, the one that matters most...":** This subtly reclaims the word "democracy" for the interpersonal sphere, suggesting that the family's boundary is more legitimate because it is based on participation and affection rather than coercion.
  *   **"You never needed a key to walk through ours":** The closing line reinforces that the family boundary is porous and inclusive, contrasting with the state's exclusive boundary, without diminishing the value of the state's recognition for Danny.
