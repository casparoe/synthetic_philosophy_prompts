  8.  **Writing the Dialogue:** (Proceeding to generate the text based on these thoughts.)
      *   *Note:* I need to make sure Sato doesn't just say "IIT is right." She needs to explain *why* the functionalist criterion is the wrong tool. She might argue that the feedforward twin requires an external clock/observer to sequence the layers, thus lacking intrinsic unity.

  9.  **Final Review against constraints:**
