answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being in Professor [Professor's Last Name]'s seminar on Ancient Economic Thought this term. As many of you know, this isn't just any seminar. It is the very last course she will ever teach.

  When we found out the topic was Aristotle's *Politics*, specifically his views on wealth, we thought it was a brilliant piece of programming. There is something poetically fitting about spending her final weeks in the classroom dissecting the ethics of value, while surrounded by people whose lives have been defined by creating it.

  For the family and colleagues who didn't spend the last twelve weeks knee-deep in Greek manuscripts, I need to explain one specific concept to set up my main point. Aristotle argues that lending money at interest is the most unnatural way to acquire wealth. His reasoning hinges on a linguistic quirk. The Greek word for interest is *tokos*. But *tokos* also literally means "offspring."

  Aristotle's point was that money is sterile. It is a tool of exchange, like a shoe. A shoe doesn't make baby shoes. So, money shouldn't make baby money. To charge interest is to force money to do something biologically impossible. It is to make the sterile breed.

  Now, looking around this room, I see a significant number of her former students who went into finance. I see portfolio managers, investment bankers, and venture capitalists. And I have to say, for the last thirty years, you have all dedicated your careers to proving Aristotle wrong. You have found very creative ways to make the sterile reproduce.

  I asked the Professor about this tension earlier this week. I asked, "How do you feel knowing that a room full of your former students is currently making a living doing the one thing you taught them was unnatural?"

  She smiled and said, "I never taught them not to make money. I taught them to ask what money is *for*."

  And that brings me to the joke I promised myself I'd tell tonight. It's a joke about breeding.

  Aristotle claimed that interest is unnatural because money cannot have offspring. But looking at the success of the finance professionals here, clearly, money *can* breed. However, if we're being truly Aristotelian, we have to ask: what kind of offspring is it? Financial offspring are invisible. They are numbers on a screen. They are abstract.

  But there is something else in this room that *has* multiplied. There is something else that has grown, compounded, and produced generation after generation of offspring for nearly forty years.

  The Professor taught us that *tokos* means offspring. And while the finance folks here may have mastered the art of financial *tokos*, the rest of us know that she mastered the art of human *tokos*.

  Money is sterile. It doesn't actually have children. But teachers do.

  Every time a student walks out of her classroom and asks a better question, that is an offspring. Every time a former student treats an employee with dignity because they remembered a lecture on ethics from 1998, that is an offspring. Every time someone in this room chooses integrity over profit because they heard her voice in their head, that is an offspring.

  So, here is the truth of the matter. Aristotle said making money breed is unnatural. But Professor [Last Name] proved that making *minds* breed is the most natural thing in the world.

  To the finance folks: You may have compounded the capital. But to the Professor: You compounded the character. And character is the only currency that doesn't depreciate.

  Professor, you told us in week one that retirement is the moment when your labor stops producing value for others and starts producing leisure for yourself. But we know that's not true. You can retire from the university, but you cannot retire from being the matriarch of this intellectual family. The *tokos* is already out in the world. We are already here. We are already working. And we are already yours.

  So, I'd like to invite everyone to raise a glass.

  To Professor [Last Name]. May your retirement be rich in the only wealth that matters: time, health, and the knowledge that while money may be sterile, your legacy is incredibly, beautifully fertile.

  To the Professor!
