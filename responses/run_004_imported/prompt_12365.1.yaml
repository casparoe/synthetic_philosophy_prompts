      *Final Polish on the Joke:* "For the finance folks here: you've spent twenty years proving Aristotle wrong. For the rest of us: she taught us that the only thing that should truly multiply is human potential."

      *Wait, I can make it tighter.* "She taught us that money breeding is unnatural. But looking at the success of her former students in finance, it's clear they treated that not as a moral prohibition, but as a dare." (Laugh). "But the joke is on Aristotle. Because money is sterile. It doesn't actually have offspring. The only thing in this room that has truly multiplied, the only true *tokos*, is the community of students she has raised."

      That works. It acknowledges the finance success without condemning it, corrects Aristotle, and elevates the professor.

