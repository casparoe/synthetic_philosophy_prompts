prompt: |-
  Random TA request, not sure who else to ask about this. I'm TAing a "Scientific Revolution" survey course, and every semester one discussion section does this role-play bit where a student sits up front in character as some historical figure and the rest of the class gets about ten minutes to interview them. This year's Kepler group has all the planetary-laws stuff memorized cold, but the professor pulled me aside and said last year's Kepler questions were basically just "so how'd you figure out the orbits are ellipses" and completely dodged the fact that the guy cast nativities for pay his whole life and defended a version of astrology he thought was scientifically respectable. She asked me to write this year's questions myself so the kid playing him actually has to grapple with that part instead of getting to shrug it off as "well, everyone beleived in astrology back then."

  Could you draft 8-10 interview questions for whoever's playing Kepler? I want at least one question on the apparent tension between him rejecting zodiac signs, houses, and most standard nativity technique as baseless superstition while still casting horoscopes for patrons (Wallenstein, etc.) and insisting part of the practice is sound; one on the actual replacement mechanism he proposes around the Harmonices Mundi material -- that the earth, and the newborn's soul, has some built-in geometrical faculty that reacts specifically to the angles ("aspects") planets make -- and whether that's really less occult than the influences he's supposedly gotten rid of; one on why he seems to trust aspect-based weather forecasting more than individual nativities, which feels backwards if it's meant to be the same underlying mechanism; and one built around that "wise mother, foolish daughter" line he's supposed to have used about astronomy and astrology, asking whether that's a real epistemic defense or just an admission he kept at it for the money. For each of those, throw in a quick follow-up tuned to whatever dodge "Kepler" would reach for first, so he can't just deliver the tidy version and sit down. Maybe end on a question about what, by his own standards, would've counted as evidence that the aspect theory was wrong -- I have a feeling that's the one the standard answers dodge hardest.
