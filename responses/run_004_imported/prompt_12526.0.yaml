answer: |-
  Here are 10 interview questions designed for the Kepler role-play. The first five address the specific thematic gaps your professor identified, complete with "dodge-blocking" follow-ups. The remaining five round out the interview to ensure the student still has to demonstrate their knowledge of the astronomical work, but within the context of his broader natural philosophy.

  ### Part 1: The Astrology/Astronomy Tension (Required Topics)

  **1. The Patronage Paradox**
  "In your treatise *De Fundamentis Astrologiae Certioris*, you aggressively dismantle most traditional astrology—rejecting the zodiac signs, the houses, and the standard rules of nativity as baseless superstition. Yet, you continued to cast detailed horoscopes for patrons like General Wallenstein throughout your life. How do you reconcile publishing a critique of the very service you sell to your employers?"
  *   **Follow-up (If they say "I needed the money"):** "Financial necessity explains *why* you did it, but not *how* you justify it intellectually. If you know the majority of the chart is superstition, are you defrauding Wallenstein? Or are you claiming that your 'reformed' astrology is accurate enough to warrant payment despite the errors? Which is it?"

  **2. The Mechanism of Influence (*Harmonices Mundi*)**
  "You argue that planets do not send physical 'rays' or occult virtues to Earth, but rather that the Earth (and the human soul) possesses an innate geometrical faculty that 'perceives' the angles planets make with one another. Is this really a physical explanation, or have you just replaced one kind of magic with another?"
  *   **Follow-up (If they say "It's mathematics, not magic"):** "But mathematics is abstract. How does a newborn baby's soul, or the soul of the Earth, physically 'see' a geometric angle in the sky without eyes or instruments? If the mechanism requires a soul to perceive geometry, isn't that just as metaphysical as the occult rays you rejected?"

  **3. Weather vs. Human Fate**
  "You seem to place much higher confidence in aspect-based weather forecasting than you do in individual nativities (predicting human fate). If the mechanism is the same—planetary angles acting on a soul—why is the weather more compliant than the human subject?"
  *   **Follow-up (If they say "Humans have free will"):** "If free will can override the geometrical influence on the human soul, does that mean the physical mechanism is weak? And if the mechanism is weak enough to be overridden by will, on what grounds do you claim it is strong enough to reliably predict storms? Why doesn't the 'Earth Soul' have free will too?"

  **4. The Wise Mother and Foolish Daughter**
  "You famously described Astronomy as the 'wise mother' and Astrology as the 'foolish daughter,' arguing that the mother must support the daughter. Is this a genuine epistemic claim that astronomy validates astrology, or is it a rhetorical shield to protect your income source?"
  *   **Follow-up (If they say "They are naturally linked"):** "If the daughter is truly foolish, why keep her alive? In your view, does the 'mother' (observation/math) actually provide evidence for the 'daughter' (predictions), or does the mother simply earn the money so the daughter doesn't starve? Be honest: is the link scientific or economic?"

  **5. Falsifiability and Evidence**
  "By your own standards of observation and geometry, what specific evidence would have counted as proof that your theory of aspects was *wrong*? If a prediction failed, how would you distinguish between a flawed theory and a flawed calculation?"
  *   **Follow-up (If they say "The data supports me"):** "Let's posit a specific case: If you calculated a perfect grand trine aspect and it rained instead of being dry, would that falsify the theory? Or would you blame the observer? At what point does the theory become immune to error, and does that immunity make it unscientific?"

  ### Part 2: Context and Astronomy (Rounding out the interview)

  **6. Relationship with Tycho Brahe**
  "You inherited Tycho Brahe's observational data, which was far more precise than anything available before. Did Tycho share your views on the physical causes of planetary motion, or was his commitment to geocentrism tied to a different understanding of physics?"

  **7. Evolution from *Mysterium Cosmographicum***
  "In your early work *Mysterium Cosmographicum*, you derived planetary distances from the five Platonic solids. Later, with the *Rudolphine Tables*, you moved to elliptical orbits. Did you view your earlier work as 'wrong,' or was it a necessary spiritual step toward the physical truth?"

  **8. The Role of Theology**
  "You frequently describe your astronomical work as 'thinking God's thoughts after Him.' To what extent is your rejection of Aristotelian physics driven by empirical data versus a theological desire to clean up the 'temple' of creation?"

  **9. The Calendar Controversy**
  "You were involved in disputes over calendar reform, which relied on accurate planetary prediction. Did the practical success of the calendar serve as public proof of your new astronomy, or did the public conflate the calendar's utility with the older, Ptolemaic system?"

  **10. Defining 'Science' in the 17th Century**
  "Looking at your career as a whole, from the *Mysterium* to the *Harmonices*: Do you believe you are creating a new discipline called 'science,' or are you perfecting the ancient tradition of Natural Philosophy? Where do you draw the line between a mathematician and a natural philosopher?"

  ### TA Note for Implementation
  *   **The "Dodge" Instruction:** Make sure the student playing Kepler knows beforehand that "Everyone believed in astrology back then" is a forbidden answer. Give them this list in advance so they can prepare the *historical* Kepler's actual arguments (e.g., distinguishing between "physical aspects" and "imaginary signs"), rather than modern apologia.
  *   **Pacing:** If the discussion drags on Q1–Q5 (which it might, given the complexity), feel free to merge Q6 and Q7 or skip Q9. The goal is to get through the "Falsifiability" question (Q5) before the period ends, as that is the professor's primary learning objective.
