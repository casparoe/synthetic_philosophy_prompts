      *   *Introduction:* Set the scene. Acknowledge the strangeness of Section 9 to modern eyes but validate Turing's seriousness. State the thesis: The gap is real (inconsistency between Rhine's data and the shielding), but it is inconsequential to the core philosophical project of the IG because the "room" functions as a methodological stipulation, not a physical claim.
