      *   *Nagel's Critique:* Nagel argues that even the *effort* to be good is influenced by temperament. A person naturally inclined to duty finds it easier to have a "good will" than a person naturally inclined to selfishness. Kant acknowledges the "natural temperament" can facilitate duty but says it has no *moral worth* unless done *from* duty. But the *capacity* to act from duty? Kant assumes it's universal. Nagel questions if that capacity is evenly distributed or luck-dependent.
