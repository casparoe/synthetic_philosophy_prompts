answer: |-
  To apply Simone Weil's *On the Abolition of All Political Parties* to the modern American primary system is to subject a specific mechanical reform to a metaphysical indictment. Weil was not critiquing the inefficiency or corruption of parties; she was critiquing their ontology. For Weil, a political party is not merely an association of citizens; it is a "machine for generating collective passion." Its essential function is to exert pressure on the minds of its members, replacing the search for truth with the maintenance of group cohesion.

  If we place the contemporary American primary system—particularly within the context of gerrymandered, safe districts—before Weil, we must ask whether she would view it as a mitigation of her fears or their consummation. The standard defense of the primary is that it democratizes the party, breaking the grip of elites and allowing the membership to determine its direction. However, reconstructing Weil's reasoning suggests she would view this defense as a dangerous illusion. She would likely argue that the primary system does not lessen the totalitarian logic of the party; rather, it refines it. It creates a mechanism where collective passion is not just imposed from above, but manufactured from below, resulting in a purer distillation of the very evil she sought to abolish.

  ### The Ontology of the Party

  To understand Weil's judgment, one must first grasp her definition of the party. Writing from London in 1943, observing the collapse of the French Third Republic and the rise of totalitarian regimes, Weil concluded that the distinction between democratic and totalitarian parties was superficial. She argued that the structure of *any* party contains a "totalitarian seed."

  The mechanism is psychological pressure. Weil posits that human beings have a limited capacity for "attention"—the spiritual and intellectual effort required to discern truth. The party demands that this attention be redirected toward the party's own survival and growth. When a member thinks, they are not asked, "Is this true?" but "Is this good for the party?" Over time, the mind loses the ability to distinguish between the two. The party becomes a collective idol, demanding the surrender of private judgment.

  Weil's remedy was radical: the complete abolition of parties. She envisioned a parliament where representatives were not delegates of factions but individuals sworn to pursue the public good according to their own conscience, liable to be recalled if they proved they were serving a particular interest rather than the nation.

  ### The Defense of Primaries: Internal Democracy

  The strongest argument against Weil's abolitionism, and the specific defense of the primary system, rests on the concept of internal democracy. In the era of the "smoke-filled room," party nominees were selected by bosses who were accountable to no one but their own patronage networks. The primary system ostensibly shattered this oligarchy. It opened the gates, allowing any registered voter to participate in the selection of the candidate.

  Proponents argue that this makes the party more responsive to the people. If the party is a vehicle for political action, surely it is better if the drivers are chosen by the passengers rather than a select few owners. In this view, the primary transforms the party from an instrument of elite coercion into an instrument of popular will. It decentralizes power. It suggests that the "collective passion" Weil feared is actually just "democratic engagement."

  ### Weil's Rebuttal: The Pressure of the Base

  Weil would dismantle this defense by arguing that it misunderstands the nature of the pressure exerted by a party. For Weil, pressure does not need to come from a boss to be coercive; it only needs to come from a collective.

  In a closed primary system within a safe district, the "general election" is indeed a formality. The real contest is the primary. This means the candidate must appeal not to the median voter of the district (who might be moderate, disengaged, or independent), but to the median voter of the *party* (who is, by definition, engaged, identified, and motivated).

  Weil would argue that this intensifies the pressure on private judgment. In a general election, a candidate might be pressured to compromise to appeal to a broad coalition. In a safe-seat primary, the pressure is to demonstrate purity. To win, a candidate must signal unwavering loyalty to the party's specific passions and grievances. This is not the "public good"; it is the particular interest of a faction masquerading as the whole.

  Weil writes that "a party is a machine for generating collective passion." The primary system is the perfect engineering upgrade for this machine. It filters out the moderate, the hesitant, and the reasonable, leaving only those whose commitment to the party label is strong enough to vote in a low-turnout, high-stakes internal contest. The result is a representative who is not answerable to the nation, nor even to the district, but to the most intense slice of partisan passion.

  Weil would likely contend that the "internal democracy" of the primary is a mirage. It does not free the mind; it implicates the voter in the coercion. When a voter participates in a primary, they are not exercising independent judgment about the common good; they are participating in a ritual of tribal selection. They are choosing which champion will carry their faction's banner. This validates the party structure itself. It makes the citizen a cog in the machine rather than an observer of truth. For Weil, the fact that the cog gets to vote on which way the gear turns does not stop the gear from grinding down individual conscience.

  ### The Self-Perpetuating Organism

  Weil's most prescient insight concerns the purpose of the party. She argues that because a party is a collective body, its primary instinct is self-preservation and growth. "Unlimited self-perpetuation becomes its only real purpose."

  The modern primary system confirms this diagnosis with frightening precision. In safe districts, the party's survival is guaranteed *if* it maintains its ideological purity. Therefore, the logic of the primary incentivizes representatives to focus on issues that mobilize the base (cultural signifiers, partisan grievances) rather than issues that solve problems (which often require compromise and boring technocracy).

  If a representative attempts to exercise the "reasoned judgment" Weil advocates—perhaps voting against the party line because they believe it serves the national interest—they are punished in the next primary. The party machine, activated by the primary voters, crushes the dissent. This proves Weil's point that the party cannot tolerate independent thought. The primary system does not mitigate this; it provides the procedural mechanism for the purge. It makes the enforcement of orthodoxy democratic, which makes it more legitimate and thus more crushing.

  Weil would see the gerrymandered safe seat as the ultimate triumph of the party over the state. In such a district, the party *is* the state. There is no check on its power. The "totalitarian logic in embryo" has grown to full term. The representative is not a trustee of the public good but a delegate of the faction. The primary system ensures that only those willing to submit to the faction's passion can attain power.

  ### A Different and Lesser Problem?

  Could Weil be persuaded that this is a "lesser problem" than the Third Republic parties she attacked? The Third Republic was characterized by unstable coalitions and backroom deals. One might argue that the American primary system is more transparent.

  Weil would reject this. Transparency of coercion is not freedom. The Third Republic's parties were often weak and fractious; they sometimes failed to fully impose their will. The modern primary system, fueled by media ecosystems and data-driven mobilization, creates a much more efficient machine for manufacturing passion. The pressure on the mind is more constant and more pervasive.

  Furthermore, Weil might argue that the primary system creates a specific spiritual harm: the illusion of participation. In the Third Republic, the voter might have known they were choosing between elites. In the primary system, the voter believes they are the source of the party's will. This makes the surrender of judgment more complete. The voter thinks, "I chose this candidate," when in reality, the structure of the primary ensured that only candidates who fit the party's mold could survive the selection. The voter has been manipulated into believing they are the manipulator.

  ### The Verdict

  Simone Weil would read the contemporary American primary system not as a reform, but as a validation of her darkest fears. She would see it as a system where the "totalitarian logic" of the party has been perfected. By moving the decisive election into the primary, the system isolates the citizen from the "general will" and immerses them in the "collective passion" of the faction.

  The defense that primaries make parties internally democratic would strike her as irrelevant. For Weil, democracy within a party is like democracy within a cult; it does not change the fact that the organization is dedicated to a particular truth that excludes all others. The primary system simply ensures that the cult is run by its most zealous members.

  Her conclusion would remain blunt: the problem is not *how* the party selects its candidates, but *that* it selects them at all. As long as the structure exists to manufacture collective passion and impose it on private judgment, the method of selection is a detail. The primary system, by making the party the sole gatekeeper of power in safe districts, removes the last barrier between the partisan machine and the machinery of state. It is not a lesser evil; it is the fear fully realized, disguised as participation. The remedy, as she proposed in 1943, remains the only logical conclusion consistent with her premises: the abolition of the parties themselves, and the return of the representative to the solitary, terrifying responsibility of their own conscience.
