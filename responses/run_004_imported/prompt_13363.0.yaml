prompt: |-
  Weird question but I could use an outside take. For years I've told my writers group I'll never quit my copywriting job to finish my novel because I'm "just not a risk taker" -- that's simply who I am, always been that way. My sister says that's nonsense: there's no such thing as a "cautious person" seperate from the actual choices you make day to day, I just use the label so I don't have to admit I'm scared. Part of me thinks she's right, but part of me thinks she's oversimplifying -- surely some people really are more wired for caution than others? Who's actually right here?
