answer: |-
  This is a classic pivot point in the philosophy of biology, and how you resolve it will significantly shape the argumentative arc of your dissertation chapter. The tension you identify—between the historical fidelity of the etiological account and the current utility captured by the causal-role account—is precisely where the most productive recent literature resides.

  Below is a comparative analysis structured to help you draft your chapter, focusing on the exaptation case (feathers), the principled nature of the "recent history" restriction, and the arbitrariness worry for causal roles.

  ### 1. The Etiological Account (SE) and the Exaptation Challenge

  **The Standard View (Wright/Neander):**
  The Selected Effects (SE) account defines the function of a trait as the effect for which it was naturally selected. As you know, Larry Wright's original formulation was vulnerable to the "origin" objection: if function is fixed at the moment of origin, exapted traits retain their ancestral function forever.

  However, Karen Neander's refinement (1991) is crucial here. Neander defines the proper function of a trait as the effect that explains the *current* prevalence of the trait in the population via a history of selection. Crucially, this is not merely about the *origin* of the trait type, but about why the trait is *maintained*.

  **The Feather Case:**
  *   **Scenario:** Feathers originate for thermoregulation; later, selection shifts, and they are maintained for flight.
  *   **SE Verdict:** If the trait is *currently maintained* by selection for flight, then flight is the proper function. The thermoregulation effect becomes a mere "beneficial consequence" or a secondary function, but not *the* proper function explaining the trait's persistence.
  *   **The Problem:** The difficulty arises in transitional populations or when selection pressures fluctuate. If we strictly look at the *origin*, we get the wrong answer (thermoregulation). If we look at *cumulative* history, we get a disjunction (thermoregulation OR flight). Biologists want to say "flight" once the co-option is complete.

  **Godfrey-Smith's "Modern History" Move:**
  Peter Godfrey-Smith (1994) argues that we should restrict the relevant selective history to a "recent" window (the "modern history" view). He worries that if we look too far back, we include selective regimes that no longer apply to the organism's current environment.

  *   **Is this ad hoc?**
      *   *The Charge:* It looks like a patch designed solely to save the intuition that feathers are for flying.
      *   *The Defense:* It is principled if we view selection as a *contemporary causal force*. Selection is not a historical event like a birth; it is an ongoing sieve. If the mesh of the sieve changes (from heat retention to aerodynamics), the reason the bead (the trait) remains in the bucket changes. Therefore, restricting the history to the period where the *current* selective regime was operative is not arbitrary; it is required to identify the *current* cause of the trait's prevalence.
      *   *Verdict on Ad Hocness:* It is not ad hoc, provided the SE theorist commits to the claim that functions explain *current* presence, not just historical genesis. However, it does introduce a "cutoff" problem (how recent is recent?) which remains a vulnerability.

  ### 2. The Causal-Role Account (CR) and the Liberalism Worry

  **The Cummins View:**
  Robert Cummins (1975) analyzes function as a causal contribution of a component to a capacity of the containing system. Functions are relative to an *explanatory analysis*.

  **The Feather Case:**
  *   **Scenario:** Feathers contribute to flight, thermoregulation, waterproofing, and display.
  *   **CR Verdict:** Feathers have *all* these functions. There is no single "proper" function.
  *   **The Advantage:** CR handles exaptation effortlessly. It doesn't care about history; it cares about current causal topology. If feathers lift the bird, they function for flight.

  **The Liberalism/Arbitrariness Objection:**
  The standard critique is that CR is too liberal. If *any* causal contribution is a function, then the heart's function includes making a thumping sound, as that contributes to the capacity of "making noise in the chest."
  *   **Cummins's Reply:** Functions are relative to the *capacity we wish to explain*. If we are explaining locomotion, flight is the function. If we are explaining homeostasis, thermoregulation is the function.
  *   **The Exaptation Worry:** You asked if CR dodges the difficulty by reintroducing arbitrariness. **Yes, but it is a specific kind of arbitrariness.** It is *explanatory interest-relativity*.
      *   In the exaptation case, CR cannot tell us which function is *biologically primary*. It treats flight and thermoregulation as ontologically equal functions, distinguished only by the researcher's focus.
      *   For a philosopher of biology, this is often unsatisfactory. Biology often posits a fact of the matter about what a trait is *for* (normativity), independent of our explanatory interests. A feather broken such that it prevents flight is malfunctioning *even if* the bird is warm. CR struggles to capture this normativity without importing etiological notions.

  ### 3. Comparative Verdict for Your Dissertation

  Here is a considered verdict you can adapt for your chapter, arguing that a refined Etiological Account handles exaptation more successfully for the specific purposes of *biological* function, though it requires careful framing to avoid the ad hoc charge.

  #### A. Why SE (Refined) Wins on Exaptation
  The SE account is superior for capturing the **normative** dimension of biological function, which is central to the concept of malfunction.
  1.  **Normativity:** In the feather case, if a feather fails to insulate but allows flight, the bird survives. If it fails to allow flight but insulates (in a migratory species), the bird may die. The SE account captures why flight is the *critical* function: it is the effect currently driving the fitness differential. CR treats both effects as equal capacities.
  2.  **The "Ad Hoc" Defense:** You should argue that Godfrey-Smith's restriction is **principled, not ad hoc**, provided one adopts a "current maintenance" view of selection (à la Neander) rather than an "origin" view. Selection is a feedback loop. If the feedback loop changes input (environmental pressure), the output (trait maintenance) is explained by the new loop, not the old one. The "recent history" constraint simply acknowledges that causal efficacy of selection decays over time if the regime changes.
      *   *Drafting Tip:* Frame this not as "changing the theory to fit the feathers," but as "clarifying the metaphysics of selection." Selection is a contemporary cause, not a historical relic.

  #### B. Where CR Retains Value
  You should concede that CR handles **multiplicity** better.
  1.  **Pluralism:** Biologists often speak of "secondary functions." SE struggles to accommodate these without calling them "mere beneficial effects." CR allows us to say feathers function for display *and* flight without hierarchy.
  2.  **Physiology vs. Evolution:** If your dissertation distinguishes between *evolutionary function* (proper function) and *physiological function* (role function), CR is the correct account for the latter. In physiology, we often don't care about history; we care about how the system works *now*.

  #### C. The Synthesis Recommendation
  For a dissertation chapter on *rival theories*, the strongest position is often a **hierarchical pluralism** or a **dominant etiological view**.

  **Proposed Argument:**
  The Etiological Account (specifically Neander's version with Godfrey-Smith's temporal sensitivity) provides the necessary conditions for *proper* biological function because it alone grounds the distinction between function and accidental benefit.
  *   **Regarding Exaptation:** The SE account does not fail here; it only fails if one conflates "origin" with "maintenance." Once we clarify that function tracks the *current* selective regime, the feather case is resolved without ad hocery. The "recent history" constraint is justified because selection is a continuous process; when the process shifts target, the function shifts.
  *   **Regarding CR:** The Causal-Role account is not wrong, but it is analyzing a different concept (systemic capacity vs. adaptive purpose). It avoids the exaptation problem only by lowering the stakes: it grants "function" status to everything, thereby losing the ability to distinguish the *adaptive* function (flight) from the *incidental* or *ancestral* function (thermoregulation) in cases where they come apart in fitness value.

  ### 4. Key Citations & Moves for the Chapter

  *   **Neander (1991):** Use her to show that SE is about *current maintenance*, not just origin. This blunts the initial exaptation objection.
  *   **Godfrey-Smith (1994):** Use him to address the "time slice" problem. Argue that his "modern history" condition is a necessary specification of how selection works as a causal mechanism, not a patch.
  *   **Buller (1998) or Amundson & Lauder (1994):** Cite these as the primary critics who argue SE is too restrictive regarding exaptation. You can then rebut them by showing they rely on an outdated "origin" version of SE.
  *   **Preston (2002):** She offers a "plan-based" view that tries to bridge the gap. Worth mentioning as a middle ground, but critique it for lacking the naturalistic grounding of SE.
  *   **The "Arbitrariness" Rebuttal:** When discussing CR, emphasize that "explanatory interest" is too subjective for robust biological ontology. Biology posits functions that exist independent of the observer (e.g., a trait's function in a fossil species). CR cannot handle fossil functions easily; SE can.

  ### Summary Verdict for the Draft
  The Etiological Account handles exaptation more successfully **if and only if** it is formulated as a theory of *current maintenance* rather than *historical origin*. The move to restrict selective history to the "recent" past (Godfrey-Smith) is principled because it aligns with the metaphysics of natural selection as an ongoing causal sieve. The Causal-Role account avoids the exaptation problem only by trivializing the concept of function, rendering it unable to distinguish between adaptive significance and mere causal utility. Therefore, for a dissertation focused on *biological* function (implying adaptation and normativity), the refined Etiological Account is the superior framework.
