answer: |-
  Shalom. Thank you all for being here.

  For those who don't know me, I'm Ruth's grandchild. I work in software now, far away from the bolts of velvet and linen she spent a lifetime selling. But growing up, I spent a lot of time in the back room of her shop, and even more time at her kitchen table.

  If you knew my grandmother, you knew she was a woman of precise measurements. She could tell the difference between wool and acrylic by touch, in the dark. She believed in things you could hold. But she also believed in the spaces between things.

  For the last twenty years of her life, Ruth came to a specific realization about God. She didn't read about it in a book first; she worked it out right here, at this table, while drinking tea. She asked a question that many of us have asked in the dark: If God is loving, why is He so hard to find? Why do sincere people struggle to feel His presence?

  In the world of philosophy, that has a name. But for Ruth, it wasn't an academic puzzle. It was her devotional life.

  Some people use that question to walk away from faith. Ruth used it to walk deeper in. She found comfort in the old idea of *hester panim*—the hiding of the face. And later, she found truth in the concept of *tzimtzum*—the idea that God had to withdraw, to contract, to make room for the world to exist.

  She didn't see this as a problem to be solved. She saw it as the fabric of reality. She believed that if God were fully visible, there would be no room for us. No room for our choices, our growth, or our love. The hiddenness wasn't an oversight; it was the space where we get to live.

  I mention this because, while sorting through her apartment this week, I found a note tucked inside one of her books. It was written in her hand, and it was an instruction for me, for today.

  She wrote: *Do not say I have gotten my answer. Do not say I am finally seeing God's face.*

  She told me that saying so would erase the one thing she actually spent her life doing: staying faithful without the answer.

  I know that for many of us here, especially those who loved her most, the natural comfort is to imagine she is now at peace, that the questions are over, that she is in the light. I know her sister and her friends want that comfort. I want it too.

  But to say she "has the answer now" would be to dishonor the courage it took for her to live without it. Ruth's faith wasn't a certainty; it was a practice. It was the act of showing up, of lighting the candles, of arguing with the text, and of loving her neighbors, even when the silence felt heavy.

  To her cousins and grandchildren who might not know these terms: You don't need to understand the theology to understand the woman. You just need to know that she was brave. She was brave enough to admit when things were unclear, and brave enough to keep loving anyway.

  And to her friends from the discussion group, the three of you sitting in the front: I hope I have represented her honestly. She didn't despair. She wasn't lost. She was exactly where she chose to be: standing in the space God made for her, holding her ground, faithful in the question.

  In my line of work, we look for bugs. We look for errors in the code that need fixing. Ruth taught me that some things aren't bugs. The silence, the distance, the hiddenness—these aren't errors to be debugged. They are the negative space that makes the picture possible.

  She was a tailor of the soul. She knew that a garment needs room to breathe. She knew that faith needs room to grow. And she knew that the most honest thing we can offer the dead is not a false resolution, but a truthful memory.

  So I will not tell you that she has found what she was looking for. I will tell you that she looked well. I will tell you that she kept her place at the table. And I will tell you that the space she left behind is not empty; it is filled with the work she did, the fabrics she touched, and the questions she taught us were safe to ask.

  May we have the courage to live in the questions, as she did.
  May her memory be a blessing to all of us who are left to weave the next part of the pattern.
  *Zichrona livracha.* May her memory be for a blessing.
