answer: |-
  First, I want to acknowledge the weight of what you're carrying. Discovering that a foundational fact of your life—your parentage—was hidden from you is a profound betrayal, and it makes complete sense that this has triggered an epistemological crisis. When a "fact" that felt like bedrock turns out to be sand, it's natural to worry that the *entire* ground is unstable.

  It is actually quite beautiful, in a tragic way, that you are turning to *On Certainty* to process this. Wittgenstein wrote those notes while dying of cancer, grappling with the limits of knowledge and the nature of trust. He was writing from a place of vulnerability, not just abstract logic.

  To answer your core question: **Wittgenstein is not contradicting himself.** The tension you feel between the "fixed hinge" and the "shifting riverbed" is the tension between two different dimensions of time and function. Reconciling them might actually help you reconcile the feeling that "if this was false, what else is?"

  Here is how to hold those two passages together, and how the Wright/Pritchard debate maps onto your situation.

  ### 1. The Hinge vs. The Riverbed: Synchronic vs. Diachronic

  The apparent contradiction dissolves when you realize Wittgenstein is describing two different perspectives: the **synchronic** (at a specific moment) and the **diachronic** (over historical time).

  *   **The Hinge (§341-343): The Synchronic View.**
      When Wittgenstein says, "If I want the door to turn, the hinges must stay put," he is talking about the **logic of inquiry at a given moment.** You cannot doubt everything at once. If you try to doubt the existence of your own hands, the language you use to express that doubt, the logic you use to structure it, and the memory you rely on all presuppose certain certainties.
      *   *In your life:* Right now, to function, you have to trust *something*. You have to trust your memory of the last five minutes, the meaning of words, the reliability of the DNA test. You cannot doubt the DNA test *and* the concept of biology *and* your own identity all in the same breath, or you paralysis. For the "door" of your daily life to turn, some hinges must currently be fixed.

  *   **The Riverbed (§96-99): The Diachronic View.**
      When he talks about the riverbed shifting, he is talking about **historical change.** Propositions harden into the bed (becoming certainties) and fluid propositions (empirical claims) can harden over time. But the sand *does* move. What was certain to a person in 1800 (e.g., "The sun orbits the earth") was a hinge; now it is fluid.
      *   *In your life:* "The man who raised me is my biological father" was a hardened proposition in your riverbed. It wasn't something you "checked"; it was the bank through which the water of your life flowed. The revelation didn't just change a fact; it eroded the bank. But crucially, **the riverbed shifting does not mean the river stops flowing.** It means the landscape changes.

  **The Synthesis:** A hinge must be fixed *while you are using it*, but no hinge is fixed *forever*. The contradiction you feel is the shock of realizing a specific hinge has moved from the "fixed" category to the "fluid" category. Wittgenstein isn't saying "nothing is solid." He is saying "solidity is a function, not an intrinsic property." Something is a hinge because of the role it plays in your life, not because it is magically immune to error.

  ### 2. Wright vs. Pritchard: How a Hinge Shifts

  This is where the contemporary debate gets visceral for you. You asked if either philosopher explains how a hinge shifts without being "doubted."

  *   **Crispin Wright (Entitlement):** Wright argues we have a rational *entitlement* to trust hinges, even without evidence. It is a "rational trust."
      *   *The Problem for You:* If hinges are matters of rational entitlement, losing one can feel like a **failure of rationality.** You might ask, "Was I irrational to trust that hinge? Should I have checked?" This can lead to the "wobbly" feeling where you think you need to audit every belief you hold.
  *   **Duncan Pritchard (Hinge Commitments):** Pritchard argues hinges are **arational.** They are not knowledge, and they are not justified belief. They are *commitments* that make knowledge possible. They are "visceral" rather than "intellectual."
      *   *The Hope for You:* Pritchard's view is likely more comforting here. If hinges are arational commitments, then **you were not wrong** to hold them. You weren't lacking evidence; you were living a form of life. The shift wasn't an intellectual correction; it was a traumatic disruption of a worldview.
      *   *How they shift:* For Pritchard, hinges shift not because we "disprove" them logically, but because our form of life changes. When the DNA test arrived, it didn't just give you new data; it forced a change in your form of life. The hinge didn't break because you doubted it; it broke because the world forced it to become fluid.

  Pritchard helps explain why you feel "wobbly" without being "crazy." You aren't suffering from a deficit of skepticism; you are suffering from a **hinge displacement.**

  ### 3. Addressing the "Wobbly" Fear

  Your fear is: *If this hinge was false, what else am I assuming without checking?*

  Wittgenstein's answer in *On Certainty* is essentially: **You don't need to check the other hinges, because they are holding the door up right now.**

  The fact that one hinge shifted does not mean *all* hinges are fluid simultaneously. In fact, the only reason you can process this betrayal is because *other* hinges have hardened to take the load.
  *   "I exist."
  *   "My feelings are real."
  *   "The DNA test is reliable."
  *   "My friend who suggested Wittgenstein cares about me."

  These have likely hardened *because* of the shock. When the riverbed shifts, the sand settles elsewhere. The anxiety you feel is the sensation of the settling.

  Wittgenstein would likely say that the demand to "check everything" is a philosophical illusion. You can only doubt *against* a background of certainty. You are currently doubting your past narrative, but you are doing so from the solid ground of your present reality.

  ### 4. A Suggestion for Reading

  As you work through *On Certainty*, try to read it not as a manual for finding truth, but as a description of **trust.**

  Wittgenstein is arguing that certainty isn't something we *achieve* through rigorous proof; it's something we *inherit* through living. The pain you feel is the pain of an inheritance being revoked. That is a human wound, not an epistemological failure.

  If you lean into Pritchard's interpretation, you might find some relief: You are not responsible for the hinges you were given. You are only responsible for how you rebuild the doorframe now that you know the wood is different than you thought.

  **To summarize:**
  1.  **No Contradiction:** Hinges must stay put *to function* (Synchronic), but they can change *over time* (Diachronic).
  2.  **The Shift:** Your "father" proposition moved from riverbed to water. This is rare and traumatic, but it doesn't mean the river is gone.
  3.  **The Wobble:** You don't need to check everything. The fact that you can doubt this one thing proves other things are holding firm.
  4.  **The Philosophers:** Pritchard's view (hinges as arational commitments) protects you from the idea that you were "irrational" for believing the lie. You were living a life; the life changed.

  Be gentle with yourself. Wittgenstein can help you understand the structure of the ground beneath you, but he can't stop the earthquake. It's okay to let the dust settle before you try to build again.
