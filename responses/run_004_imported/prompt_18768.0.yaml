answer: |-
  **Setting:** *An insulated observation chamber. The walls are white, featureless, and humming. A digital thermostat on the wall reads 50°F. ELENA sits on a metal stool, wearing a light sweater. MARCUS stands by the control panel, holding a clipboard.*

  **Marcus:** (Checking his watch) Time zero. Temperature: fifty degrees. Elena, standard opening question: Do you feel cold?

  **Elena:** (Rubbing her arms) Definitely.

  **Marcus:** And do you *know* that you feel cold?

  **Elena:** Marcus, we've been over this. It's a phenomenal state. The feeling is present to consciousness. If I feel it, I'm in a position to know I feel it. That's luminosity.

  **Marcus:** And if you know you feel cold, you know that you know?

  **Elena:** The KK principle holds for phenomenal states. If the experience is there, the access is guaranteed. I'm not inferring it from my shivering. I'm just aware of it.

  **Marcus:** (Turns a dial. The hum deepens slightly.) Let's let the room breathe. The heater is on a slow ramp. I'm going to ask you every three minutes if you can tell that you've *stopped* feeling cold.

  **Elena:** You mean, when I become warm?

  **Marcus:** No. I mean the exact moment the condition "feeling cold" ceases to obtain.

  **Elena:** That assumes there's a sharp boundary. "Feeling cold" is vague.

  **Marcus:** (Smiles) Vagueness is the point. Three minutes.

  *(Silence. The hum of the ventilation shifts pitch. Elena pulls her sweater tighter. Marcus watches the thermostat. It creeps to 58°F.)*

  **Marcus:** Three minutes. Can you tell you've stopped feeling cold?

  **Elena:** No. I still feel cold.

  **Marcus:** Do you know you feel cold?

  **Elena:** Yes.

  **Marcus:** Okay. Now, imagine the next three-minute interval. The temperature rises by a fraction of a degree. Phenomenally, Elena, will you be able to distinguish minute $t$ from minute $t+1$?

  **Elena:** Probably not. It's a gradual shift.

  **Marcus:** So, at $t$, you know you feel cold. At $t+1$, the experience is indistinguishable from $t$. If you can't tell the difference, your basis for claiming knowledge at $t+1$ is the same as at $t$.

  **Elena:** So?

  **Marcus:** So, if you know at $t$, and you can't tell $t$ from $t+1$, then you should know at $t+1$. If you don't know at $t+1$, then your claim at $t$ wasn't safe. It was lucky.

  **Elena:** I'm not guessing, Marcus. I'm attending to my experience.

  **Marcus:** But your experience is a analog signal in a digital world. If you claim to know you feel cold at $t$, but at $t+1$—which feels exactly the same—you are actually warm, then you didn't know at $t$. You just happened to be right. Knowledge requires a margin for error. You need to be right not just in this case, but in all nearby cases where you form the belief the same way.

  **Elena:** (Shifting on the stool) You're conflating the *content* of the experience with the *accuracy* of the judgment. The feeling is luminous. The judgment "I am cold" might be vague, but the feeling itself? I can't be wrong about how it feels to be me right now.

  **Marcus:** (The thermostat hits 68°F.) Six minutes. Can you tell you've stopped feeling cold?

  **Elena:** (Pauses, uncrossing her legs.) It's... less biting. But I'd still say I feel cold.

  **Marcus:** Do you know that?

  **Elena:** I know I'm experiencing what I call "cold."

  **Marcus:** There it is. "What I call cold." If the condition is just "experiencing what I call cold," then it's luminous by definition, but it's trivial. But if the condition is "feeling cold" as a factual state of your physiology interacting with the environment, then you're vulnerable to the margin-for-error principle.

  **Elena:** Why? Because I might be wrong about the label?

  **Marcus:** Because if you claim to *know* the state obtains, you must be able to rule out nearby possibilities where it doesn't. But the heating is gradual. There is a sequence of cases, $t_1$ to $t_n$. At $t_1$ you are freezing. At $t_n$ you are sweltering. For any adjacent pair, you can't tell them apart.

  **Elena:** I know the Sorites paradox, Marcus.

  **Marcus:** It's not just a paradox of language. It's a constraint on knowledge. If you know at $t_i$, you must know at $t_{i+1}$. Why? Because if you didn't know at $t_{i+1}$, then at $t_i$ you were in a position where, for all you could tell, you might have been at $t_{i+1}$. If you can't discriminate the change, you can't know the state holds at the boundary.

  **Elena:** (Wiping her forehead) So you're saying I never know I feel cold?

  **Marcus:** I'm saying you don't know it *luminously*. You don't know it simply by being in the state. At some point near the boundary, you will feel cold, but you won't know you feel cold. Because if you *knew* it, the knowledge would push you into the next minute, and the next, until you're claiming to know you're cold while you're sweating.

  **Elena:** That implies there's a moment where my experience is cold, but my mind is blind to it. That's Cartesian theater nonsense. The experience *is* the awareness.

  **Marcus:** The experience is a state. Knowledge is a normative status. You can be in the state without having the status. (He checks the thermostat. 78°F.) Nine minutes. Can you tell you've stopped feeling cold?

  **Elena:** (Fanning herself with her hand.) I feel... neutral. Maybe cool?

  **Marcus:** So you don't know you feel cold anymore?

  **Elena:** I know I *did* feel cold. The transition is muddy.

  **Marcus:** Exactly. When did it stop?

  **Elena:** I don't know.

  **Marcus:** But if luminosity were true, and KK held, you should have known the moment it ceased. You should have been able to track the boundary of your own mind.

  **Elena:** (Stands up, pacing.) Look, I grant that I can't pinpoint the boundary. But that's a limitation of *conceptual precision*, not introspection. The feeling was luminous while it lasted. It's just that "cold" is a vague predicate.

  **Marcus:** But you claimed to *know* you were cold earlier. If you knew, you satisfied the safety condition. That means in all nearby worlds where you think you're cold, you *are* cold. But because the change is gradual, there are nearby worlds—nearby minutes—where you think you're cold, but you're actually warm.

  **Elena:** So I retreat. I only claim to know I feel cold when I'm *very* cold. Well inside the margin.

  **Marcus:** Then luminosity fails.

  **Elena:** How?

  **Marcus:** Because luminosity says: If you are in the state, you are in a position to know it. If you have to wait until you are *very* cold to know it, then there are cases where you are in the state (mildly cold) but not in a position to know it. The state does not guarantee the knowledge.

  **Elena:** (Stops pacing. She looks at the thermostat: 85°F.) It's hot in here.

  **Marcus:** Ten minutes. Can you tell you've stopped feeling cold?

  **Elena:** Yes. I'm hot.

  **Marcus:** Did you know the exact moment you stopped feeling cold?

  **Elena:** No.

  **Marcus:** So, there was a time $\alpha$ where you felt cold. And a time $\beta$ shortly after where you did not. But at $\alpha$, you didn't know it was the last moment of cold.

  **Elena:** I didn't know the *classification* was ending.

  **Marcus:** You didn't know the *state* was ending. And if you didn't know the state was ending, you couldn't have known the state was obtaining with the certainty required for KK. If you knew you knew you were cold at $\alpha$, you would have known that any indistinguishable moment was also cold. But indistinguishable moments led you to heat.

  **Elena:** (Sits back down, loosening her collar.) So the mind isn't a glass house.

  **Marcus:** No. It's more like a dimmer switch in a foggy room. You know the light is on when it's bright. You know it's off when it's dark. But in the twilight, the light might be on, and you won't know it.

  **Elena:** That's unsettling. If I can't trust my access to my own feelings in real time...

  **Marcus:** Then interoception isn't a foundation for knowledge. It's just another sensory system. Noisy. Fallible. Subject to margins of error.

  **Elena:** (Looks at her hands.) So when I write about this... I can't say "we feel, therefore we know we feel."

  **Marcus:** You can say: "We feel. But whether we know we feel depends on how far we are from the edge."

  **Elena:** And the edge is invisible until we cross it.

  **Marcus:** Precisely.

  *(Marcus turns off the heater. The hum dies down. Elena takes a deep breath, looking less certain of her own breathing than she did ten minutes ago.)*
