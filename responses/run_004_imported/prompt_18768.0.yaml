  *(Self-Correction during final polish)*: Make sure Elena doesn't concede too early. She should hold the line on Luminosity until the physical evidence becomes undeniable, then pivot to what that means for knowledge. Actually, for the Williamson argument to work, she has to concede that there was a point where she felt cold but didn't *know* the status had changed, or that she claimed to know she felt cold when she was actually on the border. Let's have her defend the idea that "feeling cold" is vague, but the *experience* is luminous. Marcus will counter that vague experiences don't yield knowledge.

