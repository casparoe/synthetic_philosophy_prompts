answer: |-
  This is the crux of the *White Horse Dialogue*, and it is entirely appropriate that your students (and you) find it slippery. The opening argument relies on a categorical distinction (shape vs. color), but this final exchange shifts the ground to **determinacy** and **extension**. The Sophist is no longer arguing that color and shape are different categories; he is arguing that *specification* alters identity.

  Here is a reconstruction of the logical anatomy, an analysis of the *li* (separating) vs. *ding* (fixing) dynamic, and an evaluation of how the Realist (Fung) and Mereological (Hansen) readings handle the text.

  ### 1. Logical Anatomy of the Sophist's Closing Move

  The Sophist's argument in this final paragraph can be parsed into four steps, moving from metaphysics/semantics to extension, and finally to identity.

  1.  **The Indeterminacy Premise:** "White" (白) in isolation is indeterminate (不定 *bu ding*). It is a property not yet assigned to a substrate.
  2.  **The Fixing Premise:** "White horse" (白馬) involves "fixing" (定 *ding*) the white to a specific bearer. "Fixed white" is ontologically or semantically distinct from "White" (in isolation).
  3.  **The Extensional/Functional Premise:**
      *   Term A ("Horse"): Makes no selection/rejection (無去取) regarding color. Extension = {White, Brown, Black...}.
      *   Term B ("White Horse"): Makes selection/rejection (有去取) regarding color. Extension = {White}.
  4.  **The Identity Premise:** If $X$ allows set $S_1$ and $Y$ allows set $S_2$, and $S_1 \neq S_2$, then $X \neq Y$. (A function that filters is not identical to a function that does not).
  5.  **Conclusion:** "White horse is not a horse."

  **The Pivot:** The critical move is Step 2. The Sophist claims that once "white" is *fixed* onto "horse," the resulting compound is not just "Horse + White," but a new entity where the "white" itself has changed status (from indeterminate to determinate). This allows him to argue that the compound cannot be reduced to the simple term "Horse," because "Horse" implies the *absence* of color-fixing.

  ### 2. "Separating" (離 *Li*) vs. "Fixing" (定 *Ding*)

  You asked whether these terms do the same work. They are **inverse operations** serving opposite rhetorical masters in this exchange.

  *   **The Objector's *Li* (Separating):** The Objector uses *li* as a method of **abstraction** to save common sense. He argues: "We can say 'there is a horse' *if and only if* we mentally separate the color from the shape." For the Objector, *li* is a heuristic that reveals the underlying reality (there is a horse there).
  *   **The Sophist's *Ding* (Fixing):** The Sophist uses *ding* to block that abstraction. He argues: "In the actual name 'White Horse,' the white is *fixed*. You are not allowed to separate it." For the Sophist, *ding* describes the actual semantic condition of the compound name.

  **Do they do the same work?**
  Structurally, yes: both describe the relationship between a property and a bearer.
  Functionally, no: The Objector uses *li* to argue for **inclusion** (White Horse $\subset$ Horse), while the Sophist uses *ding* to argue for **exclusion** (White Horse $\cap$ Horse = $\emptyset$, or at least White Horse $\neq$ Horse).

  The Sophist's masterstroke is accepting the Objector's logic but reversing the condition. The Objector says: "Identity holds *if* separated." The Sophist replies: "But in this name, it is *fixed*. Therefore, identity fails."

  ### 3. Interpretive Frameworks: Fung vs. Hansen

  Here is how the two major readings reconstruct this passage.

  #### A. Fung Yu-lan: Platonic Realism
  *   **The Metaphysics:** "Horse" names the Universal *Horseness*. "White" names the Universal *Whiteness*. "White Horse" names a Compound Universal.
  *   **Reading the Passage:**
      *   *Indeterminate White:* The Form of White, existing independently.
      *   *Fixed White:* The Form of White as it enters into a compound with the Form of Horse. Fung suggests that for Gongsun, the Compound Universal is a distinct entity from the Simple Universal.
      *   *Selection (Qu Qu):* The Universal *Horse* encompasses all particulars participating in Horseness. The Universal *White Horse* encompasses only those participating in both Whiteness and Horseness.
  *   **Does it license the conclusion?**
      *   **Yes, ontologically.** If "Horse" is Entity A and "White Horse" is Entity B, and A $\neq$ B, then "White Horse is not Horse" is literally true in the realm of Forms.
      *   **Weakness:** It requires attributing a heavy, arguably anachronistic Platonic metaphysics to Gongsun. It also struggles to explain why the "selection" argument (brown/black horses) matters for Universals (since Universals don't typically "select" particulars in this mereological way).

  #### B. Chad Hansen: Mereological / Mass Noun Nominalism
  *   **The Metaphysics:** Terms refer to "stuff" or kinds, not abstract universals or individual objects. "Horse" is the sum of all horse-stuff. "White" is white-stuff.
  *   **Reading the Passage:**
      *   *Indeterminate White:* White-stuff not yet allocated to a specific kind of thing.
      *   *Fixed White:* White-stuff allocated to horse-stuff.
      *   *Selection (Qu Qu):* This is the strength of Hansen's reading. "Horse" refers to the whole mass of horse-stuff (including brown, black, white). "White Horse" refers to a *part* of that mass (only the white stuff).
      *   *The Logic:* A part is not identical to the whole. The sum of white-horse-stuff $\neq$ the sum of horse-stuff.
  *   **Does it license the conclusion?**
      *   **Yes, mereologically.** The kind *White Horse* is not identical to the kind *Horse*.
      *   **Weakness:** It forces us to read *fei* (非) as "is not identical to" rather than "is not a member of." In common sense, "A white horse is a horse" means membership (this object belongs to that class). Hansen argues Gongsun is talking about kind-identity. This makes the conclusion logically valid but pragmatically misleading (equivocation on "is").

  ### 4. Which Reading Licenses the Strong Conclusion?

  You asked which reading licenses "A white horse is not a horse" (ontological exclusion) versus "The terms are non-synonymous" (semantic distinction).

  **The Hard Truth:** Neither reading licenses the strong ontological claim ("This animal before you is not a horse") without relying on an equivocation that Gongsun likely intended but which is logically fallacious by modern standards.

  However, **Hansen's reading** provides the more robust *logical* anatomy for this specific passage, while **Fung's reading** provides the more robust *metaphysical* justification for the shock value.

  1.  **The "Selection" Argument Favors Hansen:** The Sophist's emphasis on *qu qu* (selecting/rejecting colors) is extensional. It talks about which animals "answer to" (應 *ying*) the name. This fits Hansen's mass-noun/kind logic better than Fung's Realism. Universals don't typically "reject" brown particulars; extensions do.
  2.  **The "Fixing" Argument Favors Fung:** The idea that "fixed white is not white" suggests a transformation of the property itself, which smells of Realism (the instantiated property is different from the abstract property).
  3.  **The Verdict on the Conclusion:**
      *   If you follow **Fung**, the conclusion is: "The Compound Universal is not the Simple Universal." This is true, but it doesn't explain why a white horse can't be called a horse in daily life.
      *   If you follow **Hansen**, the conclusion is: "The Kind *White Horse* is not identical to the Kind *Horse*." This is true (Set A $\neq$ Set B).
      *   **The Sophist's Trick:** The Sophist relies on the ambiguity of the copula *fei* (非).
          *   Sense 1 (Identity): "White Horse" $\neq$ "Horse" (True on both readings).
          *   Sense 2 (Predication/Member): $x \in WH \rightarrow x \notin H$ (False on both readings).
      *   The Sophist proves Sense 1 to convince you of Sense 2.

  ### Recommendation for the Seminar

  For a graduate seminar, I suggest framing the final exchange not as a successful proof of ontology, but as a **pragmatic theory of naming**.

  The Sophist is arguing that **names are tools for distinction, not just labels for reality.**
  *   The Objector thinks names track objects (There is an object; it is a horse; therefore call it a horse).
  *   The Sophist thinks names track *intentions* (If I ask for a "horse," I accept any color. If I ask for a "white horse," I reject other colors. Therefore, the *name* "white horse" performs a different function than the *name* "horse").

  **On "Fixing" and "Separating":**
  Conclude that *ding* (fixing) is the act of **naming**, while *li* (separating) is the act of **analyzing**.
  *   The Objector says: "If we analyze the name, we see a horse."
  *   The Sophist says: "But we don't analyze names when we use them; we fix them to specific distinctions. Since the name 'White Horse' fixes a distinction that 'Horse' leaves open, they are not the same name, and in the context of the School of Names, different names imply different realities."

  **Final Answer to Your Question:**
  Hansen's mereological reading makes better sense of the "selection/exclusion" (去取) logic in the second half of the passage. Fung's Realist reading makes better sense of the "indeterminate/fixed" (不定/定) metaphysics in the first half.

  However, **neither reading licenses the strong conclusion** ("A white horse is not a horse" in the sense of membership) without equivocation. Both readings only license the weak conclusion ("The concept/kind 'White Horse' is not identical to the concept/kind 'Horse'"). The Sophist's genius—and his sophistry—lies in presenting the weak conclusion (non-identity of intensions/kinds) as if it entailed the strong conclusion (exclusion of extension).

  If you want to challenge your students: Ask them if the School of Names is interested in **truth** (correspondence to reality) or **consistency** (coherence of naming conventions). This passage suggests Gongsun prioritizes the consistency of naming conventions over common-sense ontology. "White horse is not a horse" is a rule for keeping language precise, not a description of the barnyard.
