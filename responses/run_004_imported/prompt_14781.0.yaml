  8.  *(Self-Correction on Grading Scale)*: The prompt asks for "out of 10 for each part plus a total, or a letter grade". I will provide 10 per part (30 total) and a percentage/letter equivalent for clarity.

  9.  *(Final Polish)*: Ensure the explanation of *why* stronger logic is bad (the parent can't prove the successor's axioms) is clear. This is the crux of the MIRI research.

