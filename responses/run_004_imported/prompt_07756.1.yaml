          *   *Analysis:* True that all systems need a goal function. However, voting aggregates preferences directly, whereas futarchy requires a *specific quantitative metric* upfront. Voting hides tradeoffs too, but futarchy's requirement for a *single numeric metric* is stricter than typical legislative bargaining. Still, the point that *some* metric is needed is valid.
