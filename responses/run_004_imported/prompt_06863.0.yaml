answer: |-
  The pamphlet was glossy, warm from the printer. Dr. Vance slid it across the desk, his pen hovering over the checkbox marked *Discontinuous Self-State (DSS)*.

  "It explains the gaps," Vance said, not looking up. "You don't lose time, Elias. You just… fail to inherit the previous version of yourself. You wake up and the memories are there, but the emotional continuity is severed. Like changing costumes without a dressing room."

  Elias traced the diagram on the page: a circle broken into uneven segments. "So I'm not crazy."

  "It's a recognized classification. Category 4-Alpha. We see it often in high-volume data workers. The brain partitions to handle the load."

  Elias took the pamphlet. It felt like a key. For years he'd felt like a stranger in his own skin, but now he had a name for the stranger. *Discontinuous.*

  ***

  The support group met in the basement of the outpatient wing, under lights that hummed like dying insects. There were six of them. Sarah, who had been diagnosed two years prior, sat at the head of the circle. She wore a lanyard with different colored badges, swapping them out every twenty minutes.

  "Check your segments," Sarah said softly. "Where did you wake up today?"

  "Segment Three," said a man in the corner. "I felt… angry. But I don't know why."

  "That's classic drift," Sarah nodded. "Did you log the trigger?"

  "No."

  "You have to log the trigger," she said, not unkindly. "Otherwise Vance won't know it's a drift and not just a mood. He needs the data to adjust the treatment protocol."

  Elias sat quietly. In the first week, he had described his condition as a feeling of numbness, a hollowing out. But listening to Sarah, he realized numbness was too vague. Sarah described *sharp* edges. She described the physical sensation of her handwriting changing mid-sentence. She described forgetting how to use her own keys, not because she lost them, but because the lock felt unfamiliar to her fingers.

  The next week, Elias tried it.

  "I woke up in Segment Two," Elias said. "But my hands… they felt like they belonged to someone taller. I dropped my coffee because the grip strength was wrong."

  Sarah leaned forward, eyes bright. "Did you document the proprioceptive mismatch?"

  "Yes."

  "Good," she said. "That's a strong marker. Vance likes the somatic stuff. It helps him justify the coding."

  By month three, the group had developed a lexicon. They didn't just suffer discontinuity; they curated it. They learned that describing specific sensory fractures earned nods of validation. A simple mood swing was dismissed; a sudden inability to recognize the taste of salt was celebrated. They were hunting for symptoms the way mushroom hunters hunt for morels, scanning the forest floor of their daily lives for the specific shape of the disorder.

  Elias found himself pausing mid-action, waiting for the feeling of disconnect to arrive. He would stare at his hand until it looked foreign. He would speak until his voice sounded like a recording. He was farming his own fragmentation.

  ***

  Dr. Vance sat behind the glass partition, watching the group through the one-way mirror. He had a fresh copy of the *Diagnostic Criteria for DSS* open on his tablet. The original 4-Alpha checklist was sparse: *1. Reported memory gaps. 2. Emotional dissonance. 3. Sense of unreality.*

  He watched Elias stand up. Elias was acting out a shift for the newcomers. He dropped his pen, stared at it, and then switched his posture, slumping slightly, changing the cadence of his breathing.

  "I'm in Segment Four now," Elias announced to the room. "The lighting feels too loud."

  The newcomers scribbled in their notebooks. *Lighting feels too loud.*

  Vance tapped his stylus against the screen. Six months ago, "sensory synesthesia regarding light" wasn't on the list. Neither was "volitional posture shifting." But over the last quarter, eighty percent of his DSS patients were reporting these exact symptoms.

  It was strange. When he first published the paper on DSS, the symptoms were internal, invisible. Now, they were performative. External.

  He watched Sarah correct a new patient. "No, don't say you felt sad. Say you felt *displaced*. Sadness is universal. Displacement is clinical."

  Vance sighed and opened the editing mode on the document. If the patients were changing, the category had to hold them. If he didn't update the criteria, insurance would deny the claims. If the claims were denied, the group would dissolve. And if the group dissolved, the patients would lose the vocabulary that kept them stable.

  He highlighted *Criterion 3*.

  *Original: Sense of unreality.*
  *Revision: Sense of unreality, specifically regarding proprioception or environmental sensory input (e.g., light, sound).*

  He paused. Then he added a sub-note.

  *Note: Patient may exhibit conscious behavioral modulation to align with segment identity.*

  It was a quiet admission. The diagnosis was no longer just describing what was happening to them; it was describing what they were doing to fit the diagnosis.

  ***

  Two weeks later, Elias sat in Vance's office. The pamphlet was different now. The circle diagram had more segments, finer lines.

  "I've been reviewing your logs," Vance said, tapping his keyboard. "The proprioceptive mismatches are very consistent."

  "I've been working on them," Elias said. "Sarah says consistency is key for the coding."

  "It is," Vance said. He looked at Elias, really looked at him, for the first time in months. He wondered if Elias had always slumped when he said he was in Segment Four, or if he had learned that slumping was what Segment Four looked like. It didn't matter. The symptom was real because the treatment addressed it.

  "I'm updating your file to 4-Beta," Vance said. "It accounts for the somatic adjustments."

  "Does that mean I'm getting worse?"

  "No," Vance said, clicking the mouse. The cursor blinked on the new line item, solidifying the change. "It means we understand the shape of it better now."

  Elias nodded, relieved. He stood up to leave, but paused at the door. He consciously adjusted his shoulders, dropping them slightly, changing his gait before stepping into the hallway. He walked out looking exactly like a patient with 4-Beta DSS.

  Vance watched him go, then printed the new checklist. He placed it in the folder for the next intake. The next patient would read it. They would learn what to look for. They would find it. And next year, Vance would update the criteria again.

  He closed the folder. The loop was tight enough now to hold.
