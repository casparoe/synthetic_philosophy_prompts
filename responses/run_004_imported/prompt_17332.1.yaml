          *   *Naive Substantivalism:* Fails on determinism (Hole Argument).
          *   *Sophisticated Substantivalism:* Accepts spacetime as a physical entity (explains gravitational waves, vacuum solutions) but treats points structurally (avoids Hole Argument).

      *   **Defending the Verdict:**
          *   Why not just call it relationism about the metric field? Because the metric field *is* a physical field with energy and momentum. It acts on matter. It makes sense to call it "substance" in a modern sense.
          *   The "terminological" dodge: It's not just words. It's about what carries the energy, what curves, what exists in the absence of matter.
          *   Final stance: Sophisticated Substantivalism.

  4.  **Refining and Polishing:**
