      *   **The Classical Debate:**
          *   *Newton:* The Bucket. Water climbs the sides not because of relative motion to the bucket, but relative to "Absolute Space." Inertial forces imply a reference frame.
          *   *Leibniz:* The Shift. Move the universe 5 feet right. No observable difference. PSR says God wouldn't do this. Therefore, absolute space is a fiction. Space is an order of coexistences.
          *   *Critique:* Newton explains inertia better. Leibniz explains *why* we shouldn't posit unobservables.

      *   **Mach's Principle:**
          *   Mach critiques Newton. Inertia isn't absolute; it's resistance relative to the "fixed stars" (distant mass).
          *   Influence on Einstein. But does GR fully incorporate Mach? No. Vacuum solutions (Minkowski, Schwarzschild) exist where spacetime has structure without matter. This is a blow to strict relationism.

      *   **General Relativity and the Hole Argument:**
          *   Explain the Hole Argument (Earman & Norton). Manifold substantivalism + Diffeomorphism invariance = Indeterminism. If points are "things," moving the metric field around them creates a distinct physical state that is empirically indistinguishable.
          *   This looks like a win for Relationism (Spacetime is just the metric field relations).
