prompt: |-
  I'm the service chair of Interact, my high school's Rotary-affiliated community service club, and I have to write the decision memo our executive board votes on this Tuesday. Two months ago we ran 'Miles for Maya,' a fundraiser for a freshman with leukemia after her family's insurance denied the recommended treatment; local businesses pledged to match every donation made 'for Maya,' and we ended up raising $18,400, well beyond our original $6,000 goal. Before we hand the family a check, one member circulated Peter Singer's drowning-child argument alongside GiveWell's cost-effectiveness numbers, arguing that neither distance nor a familiar face makes one life worth more than another, so we're obligated to redirect at least the windfall above our goal to a charity like the Against Malaria Foundation, where the same money would save several times as many lives. Other members think redirecting money that businesses matched specifically for Maya would be a betrayal, whatever the math says. Please draft the memo I'll bring to the board: it should reach a clear, concrete recommendation with a timeline for talking to the family and our donors, and it should take whichever side it doesn't land on seriously rather than dismiss it as naive number-crunching or mere sentimentality.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Service Chair of Interact (High School Rotary-affiliated club).
      *   **Task:** Write a decision memo for the Executive Board to vote on.
      *   **Context:** Fundraiser "Miles for Maya" raised $18,400 (Goal: $6,000). Beneficiary: Freshman with leukemia (insurance denied treatment). Donors/Businesses matched donations *specifically* "for Maya."
      *   **Conflict:** One member argues (via Peter Singer/GiveWell) to redirect the surplus ($12,400) to a more cost-effective charity (e.g., Against Malaria Foundation) to save more lives. Others argue this betrays donor intent and the specific promise made to the family/community.
      *   **Requirements:**
          *   Clear, concrete recommendation.
          *   Timeline for communication (family and donors).
          *   Tone: Respectful to both sides (utilitarian ethics vs. relational/donor-intent ethics), not dismissive.
          *   Audience: High School Executive Board (needs to be professional but accessible).

  2.  **Determine the Recommendation:**
      *   *Option A (Redirect Surplus):* Ethically strong from a utilitarian view, but practically risky. Donors gave "for Maya." Businesses matched "for Maya." Redirecting could look like fraud or breach of trust. It could damage the club's reputation for future fundraisers.
      *   *Option B (Give All to Maya):* Ethically strong from a deontological/relational view (keep promises). Honors donor intent. Supports the local community. However, ignores the opportunity cost regarding global suffering.
      *   *Option C (Hybrid/Compromise):* Give the original goal to Maya, redirect surplus? Still risks donor intent issues.
      *   *Decision:* The most sustainable and ethically defensible position for a *high school club* relying on *local trust* is to honor the specific intent of the fundraiser. The "Singer" argument is philosophically valid but practically dangerous in this context (potential legal/ethical issues regarding solicitation). However, the memo must acknowledge the moral weight of the counter-argument.
      *   *Refinement:* I need to make sure I don't just say "No." I need to incorporate the *spirit* of the efficiency argument into the recommendation without violating donor trust.
      *   *Final Decision:* Recommend disbursing the full amount to Maya's family. *However*, acknowledge the ethical concern by proposing a future initiative focused on cost-effective giving or education. This validates the member's concern without breaking trust now.
      *   *Wait, looking closer at the prompt:* "take whichever side it doesn't land on seriously." If I recommend giving it all to Maya, I must treat the Singer argument seriously. If I recommend splitting it, I must treat the donor intent seriously.
      *   *Legal/Practical Reality Check:* In the US, soliciting funds for a specific individual and then using them for something else can be considered fraud or misrepresentation, even with good intentions. This is a strong argument for the "Give to Maya" side.
      *   *Decision:* Recommend giving the full $18,400 to the family. This is the safest and most trustworthy path. I will address the efficiency argument by suggesting a separate future initiative.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Purpose:** State clearly what needs to be decided.
      *   **Background:** Summarize the fundraiser, the goal, the result, and the specific conditions (matching "for Maya").
      *   **The Ethical Dilemma:**
          *   *Viewpoint 1 (Relational/Contractual):* Donor intent, trust, local impact, promise made.
          *   *Viewpoint 2 (Utilitarian/Effective Altruism):* Singer's argument, maximizing good, cost-effectiveness (AMF vs. Leukemia treatment).
      *   **Analysis/Risk Assessment:**
          *   Legal/Reputational risk of redirecting funds.
          *   Impact on future fundraising if trust is broken.
          *   Moral weight of the counter-argument.
      *   **Recommendation:** Clear action item.
      *   **Implementation Plan:** Timeline for notifying family, donors, and the club.
      *   **Future Consideration:** How to honor the "Effective Altruism" concern in the future (e.g., a separate global health drive).

  4.  **Tone Check:**
      *   Needs to be professional but appropriate for high school leaders.
      *   Avoid calling the Singer argument "naive." Call it "philosophically rigorous" or "compelling."
      *   Avoid calling the donor intent argument "mere sentimentality." Call it "foundational to community trust" or "fiduciary responsibility."

  5.  **Refining the Recommendation (Self-Correction):**
      *   Is there a middle ground? What if we ask the donors? Too slow.
      *   What if we give the surplus to AMF *with* the family's permission? No, the money was given *by donors* for the family. The family doesn't own the donor intent.
      *   Okay, sticking with "Full Disbursement to Family." It's the only one that doesn't risk legal/ethical backlash regarding solicitation.
      *   *Crucial nuance:* I need to make sure the memo explicitly validates the member who raised the Singer point. Their point isn't wrong morally, it's just incompatible with the specific constraints of *this* fundraiser.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be specific. "Decision Memo: Disbursement of 'Miles for Maya' Proceeds."
      *   *Background:* Keep it factual. $6k goal, $18.4k raised. Matching grants tied to Maya.
      *   *Arguments:*
          *   *Pro-Redirect:* Maximize lives saved. Distance doesn't matter.
          *   *Pro-Family:* Donor intent. Trust. Specific solicitation.
      *   *Recommendation:* Disburse 100% to family.
      *   *Mitigation:* Launch an "Effective Giving" campaign later to address the surplus concern.
      *   *Timeline:* Vote Tuesday -> Contact Family Wednesday -> Public Announcement Friday.

  7.  **Final Review against Constraints:**
      *   Clear recommendation? Yes.
      *   Timeline included? Yes.
      *   Both sides treated seriously? Yes (using terms like "moral imperative" for both).
      *   Role appropriate? Yes (Service Chair to Exec Board).

  8.  **Final Polish:** Check for clarity, flow, and empathy. Ensure the distinction between "charity" (general) and "beneficiary" (specific) is clear, as that's the legal/ethical crux. (Self-correction: Ensure I mention that Interact is Rotary-affiliated, so Rotary standards of ethics apply).

  *(Self-Correction during drafting)*: I should be careful not to give legal advice, but frame it as "risk management." Also, ensure the timeline is realistic for a high school schedule.

