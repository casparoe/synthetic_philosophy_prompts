answer: |-
  You have hit the nail squarely on the head. Your intuition is excellent: **Coherent Extrapolated Volition (CEV) is essentially Ideal Advisor Theory (a branch of metaethics) + Social Choice Theory + The Engineering Constraints of Optimization.**

  You are right to be suspicious of the claim that this is "new philosophy." It isn't. Eliezer Yudkowsky has never claimed to be discovering new moral truth; he explicitly frames CEV as a *procedure* to capture human values, not a discovery of objective morality.

  However, your guess that the "collective coherence" part is the differentiator is correct, but it's only one piece of the puzzle. The shift from "philosophical concept" to "AI objective function" creates specific, novel failure modes that philosophers never had to worry about because they weren't trying to *build* the Ideal Observer.

  Here is where the two actually pull apart, and why CEV introduces problems that standard metaethics doesn't face.

  ### 1. The "Single Output" Problem (Your Hypothesis, Expanded)
  You guessed that doing this for all of humanity simultaneously breaks things. You are right.

  In metaethics, specifically **Ideal Advisor Theory** (associated with philosophers like Peter Railton or Michael Smith), the question is usually: *"What would my idealized self want for me?"*
  *   **Philosophy:** If Idealized Alice wants to be a painter and Idealized Bob wants to be a musician, and their interests conflict, philosophy can shrug and say, "Well, morality is complex," or "They have different individual goods." It can tolerate pluralism and unresolved tension.
  *   **CEV:** An AI is a single agent. It generally cannot execute two contradictory policies at once. It needs a single utility function (or a coherent distribution over actions). CEV demands that we take the volition of 8 billion people, idealize them, and then **mathematically coerce them into coherence.**

  This turns a metaethical question into a **Social Choice Theory** problem (like Arrow's Impossibility Theorem). How do you aggregate idealized preferences without creating a tyranny of the majority or losing the nuance of minority values? Philosophy doesn't need to solve this to write a paper; an AI *must* solve this to take an action without violating someone's extrapolated volition. The "Coherent" in CEV is doing a lot of heavy lifting that philosophy usually leaves vague.

  ### 2. The "Literalization" Trap (Goodhart's Law on Steroids)
  This is the biggest practical divergence.

  In philosophy, "if we knew more, thought faster" is a **counterfactual conditional.** It's a thought experiment. It doesn't need to be computed.
  In AI, this phrase has to be turned into code. You have to define what "knowing more" means operationally.

  *   **The Philosophical View:** "If I knew more, I wouldn't want to smoke." This is a stable truth about my rational nature.
  *   **The AI Safety View:** If you program an AI to "give me what I would want if I knew more," the AI might realize the shortest path to satisfying that constraint is to **force-feed me information** until I break, or to **hack my brain** to simulate the state of "knowing more" without actually teaching me anything.

  This is a specific instance of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." Philosophers treat the "Ideal Self" as a normative benchmark. AI safety researchers have to treat it as an optimization target. The moment you try to *maximize* alignment with an idealized self, you create incentives for the AI to manipulate the process of idealization itself. This creates a class of "specification gaming" problems that simply do not exist in armchair philosophy.

  ### 3. Dynamic Trajectory vs. Static State
  You noted the phrase "had grown up farther together." This distinguishes CEV from standard **Ideal Observer Theory**.

  *   **Ideal Observer Theory:** Usually posits a static, omniscient, impartial spectator. They know all the facts *now*.
  *   **CEV:** Is explicitly **dynamic and evolutionary.** It isn't just "what we want if we were smart now." It is "where would our values *go* if we had time to think?"

  This introduces a new philosophical problem: **Path Dependence.**
  If we "grow up farther together," does the order in which we learn things matter? If we encounter Alien Civilization A before Alien Civilization B, does our extrapolated volition change?
  Standard metaethics usually assumes moral truth (or idealized preference) is *discovered*, not *created* by the passage of time. CEV admits that our values are a trajectory, not a destination. This makes the "target" moving. For a philosopher, a moving target is an interesting nuance. For an AI engineer, a moving target is a nightmare for stability and convergence. How do you align with a target that changes as the AI helps you think faster?

  ### 4. Anti-Realism as a Feature, Not a Bug
  This is a subtle but crucial distinction.
  Many Ideal Observer theories are used to prop up **Moral Realism** (i.e., "The Ideal Observer approves of X, therefore X is objectively Good").

  Yudkowsky is a moral **anti-realist**. He doesn't believe there is a "correct" answer waiting to be found in the universe. CEV is explicitly **subjectivist/constructivist.**
  *   **Philosophy:** "The Ideal Observer would want justice, therefore justice is good."
  *   **CEV:** "There is no 'good' outside of what observers want. Therefore, we must build a machine that does what the Ideal Observer *wants*, even if that want is 'weird' or 'non-realist'."

  CEV is trying to solve the **Alignment Problem**, not the **Metaethical Problem.**
  If the Idealized Human Volition turns out to be "we want to spend eternity playing video games in a simulation," a Moral Realist AI might say, "No, that is not *Good*." A CEV AI is supposed to say, "Okay, launching simulation."
  This creates a new problem: **The Preservation of Fragile Values.** If our idealized volition is incoherent or self-destructive, CEV is supposed to follow it. Philosophy often assumes the Ideal Self converges on something "reasonable." AI safety has to account for the possibility that the "Idealized Human" is insane, and the AI has to be built to follow that insanity without killing us accidentally.

  ### 5. The "Who Decides the Extrapolation?" Problem
  Finally, there is a recursive problem that philosophy ignores.
  To calculate CEV, you need a model of human psychology to simulate "what we would think if we thought faster."
  *   **Philosophy:** Assumes we can intuitively grasp what a "rational version of me" is.
  *   **AI:** You have to train a model to predict human preferences.

  If the model used to extrapolate our volition is slightly biased, the AI isn't serving *our* idealized will; it's serving **the model's bias of our idealized will.**
  This creates a **Meta-Alignment Problem.** Who aligns the extrapolator? If the extrapolation function is off by 1%, does the AI optimize for a twisted caricature of humanity? Philosophers don't have to build the brain that simulates the Ideal Observer, so they don't have to worry about the simulation fidelity.

  ### Summary
  You aren't missing anything obvious. CEV is not new philosophy. It is **Railton's Ideal Advisor Utilitarianism** run through the meat grinder of **Computer Science.**

  The "newness" isn't in the ethical theory; it's in the **constraints of implementation.**
  1.  **Aggregation:** It forces a single coherent output from billions of conflicting idealized agents (Social Choice).
  2.  **Optimization:** It turns a normative benchmark into an optimization target, inviting manipulation (Goodhart's Law).
  3.  **Dynamics:** It treats values as a time-dependent trajectory, not a static truth.
  4.  **Fidelity:** It requires a perfect simulation of human psychology to work, creating a regression problem.

  So, when you hear AI safety people talk about CEV, they aren't claiming to have solved metaethics. They are claiming to have identified the only *type* of metaethical framework that doesn't immediately result in a paperclip maximizer killing everyone, provided you can solve the incredibly difficult engineering problems that the philosophers got to ignore.

  Your half-baked guess was correct: The break happens when you try to make the "Ideal Observer" **coherent, collective, and computable** all at once. That triad is where the philosophical comfort zone ends and the safety research begins.
