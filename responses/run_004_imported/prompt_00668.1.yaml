      *   *Section 2: Nagel's Taxonomy.* Map the types. Virtuous activity = immune to Resultant/Circumstantial (in terms of moral worth). *Eudaimonia* = vulnerable to Circumstantial/Resultant (in terms of completeness).
      *   *Section 3: The Nagel Paradox.* Evaluate the success. Aristotle splits the difference. He saves moral responsibility but sacrifices the guarantee of happiness. This reproduces the tension between "ought implies can" and "the world is unjust."
      *   *Conclusion:* Summarize. Aristotle provides a stable platform for ethics but admits the tragedy of the human condition.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Be careful with "Resultant Luck." In Nagel's sense, it's about outcomes. Aristotle says the *virtue* is in the choice/disposition, not the outcome. So Resultant Luck is denied regarding *virtue*. But *Eudaimonia* requires some success (you can't flourish if you fail at everything). So Resultant Luck is conceded regarding *eudaimonia*.
