          *   Marcus argues this applies to *all* science (gravity, physics). It doesn't make NS metaphysical.
          *   Elena counters: Physics has independent laws. NS *is* the law, and it's defined by the result.
      *   **Round 4: The Hardest Push (The "What if?" scenario).**
