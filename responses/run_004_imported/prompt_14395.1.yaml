          *   If I say "My prior is higher because I'm more optimistic," I need evidence that my optimism is truth-tracking.
          *   If I can't provide that, I'm claiming special status without evidence.
          *   Therefore, rational agents should treat the *existence* of a disagreement as evidence to update toward the mean.
      *   **Part 4: Synthesizing for the Bar Debate (Practical Application):**
          *   When is "agree to disagree" okay? (When you suspect irrationality/bad faith).
          *   When is it not? (When you respect the other's rationality).
