answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm the friend Priya calls when she needs a thesaurus, a proofreader, or someone to explain why a comma changes the meaning of a sentence from "Let's eat, Grandma" to "Let's eat Grandma." So, naturally, when she asked me to give this toast, I treated it like a term paper. I researched. I outlined. And I realized I couldn't talk about Priya without talking about Benjamin Franklin.

  Now, for Priya's aunt and the rest of the family who might not know: Priya has a thing. Since freshman year of college, she has tracked her life using Benjamin Franklin's "13 Virtues."

  For the uninitiated, Franklin decided he wanted to achieve moral perfection. So, he made a list. Temperance. Silence. Order. Resolution. Frugality. Industry. Sincerity. Justice. Moderation. Cleanliness. Tranquility. Chastity. And finally, Humility.

  Priya has a little grid. Every day, she checks in. If she loses her temper? Black mark. If she's sincere? Clean slate. She carries this around. She lives this. Although, she will be the first to tell you that Virtue #3, "Order," is a lost cause. If you've ever seen the inside of her purse or her desktop icons, you know that "Order" is less of a virtue and more of a hopeful suggestion.

  But here is the thing about Priya that I love, and why this Franklin project actually matters for today.

  When Franklin finished his first twelve virtues, a friend told him, essentially, "Ben, you're great at everything, but you're kind of a know-it-all. You're proud." So, Franklin tacked "Humility" onto the end of the list as number thirteen.

  But here's the kicker. At the end of his life, Franklin wrote in his autobiography that he never actually achieved humility. He said he could manage the *appearance* of it. He could look humble. But he admitted that if he ever actually conquered his pride completely, he'd probably be proud of that, too.

  It's a paradox. It's human. And it is so Priya.

  There is a risk, when you talk about someone who tracks their virtues, that it sounds like they think they're better than everyone else. But anyone who knows Priya knows the chart isn't a scoreboard of her wins. It's a log of her black marks. It's a record of where she slipped.

  Priya doesn't keep that chart because she thinks she's perfect. She keeps it because she knows she isn't. She knows that "Order" is going to fail. She knows that "Tranquility" is going to go out the window when the flight is delayed or the Wi-Fi goes down.

  And that is exactly why she is going to be such an incredible wife.

  Because she understands that marriage isn't about achieving moral perfection. It's not about having a clean grid. It's about having the humility to admit when you've made a black mark, and the grace to let your partner do the same.

  [Partner's Name], you are marrying a woman who has spent fifteen years studying how to be better. But the reason she's ready for this isn't because she's finished the assignment. It's because she knows the assignment never ends. She knows that love requires the appearance of humility, and sometimes the reality of it, too. Especially when you're arguing about whose turn it is to do the dishes—which, given her track record with "Order," will probably be yours.

  Priya, you've memorized Franklin's project. You know the list. But looking at you two, I think you've already mastered the one thing Franklin couldn't quite figure out. You've found someone who doesn't care about the black marks. Someone who loves the grid, the chaos, and the attempt.

  So, if we could all raise a glass.

  To Priya and [Partner's Name]. May your life together be full of Industry and Resolution. May your home have enough Cleanliness to be healthy, but not enough to be stressful. And may you both have the Humility to admit when you're wrong, and the Sincerity to laugh about it when you're right.

  To the happy couple.
