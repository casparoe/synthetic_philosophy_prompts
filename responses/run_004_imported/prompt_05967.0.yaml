      *   *Markovits:* Need to flag the lack of evaluation. The prompt asks "whether" it improves. The student says "is supposed to fix this." Needs an argument. Also, does CRT actually capture Arpaly's intuition? (Markovits requires the agent to believe it's right *because* it's right. Huck often thinks it's wrong. So does CRT actually save Huck? This is a deep objection the student missed).

