answer: |-
  You have spotted exactly what makes Aquinas so difficult to pin down and why the "Aquinas endorsed tyrannicide" soundbite is mostly a later invention. You are absolutely right: in the *Summa*, he isn't issuing a permission slip; he is performing a piece of moral taxonomy that shifts the burden of guilt.

  Here is the unpacking of that logical move, how it reconciles with *De Regimine Principum*, and why the "assassination" narrative persists despite the text.

  ### 1. The Logical Move in *Summa Theologiae* (II-II, Q.42, Art. 2)

  Your intuition is correct: Aquinas is redefining the terms of the debate to make the "hard question" (Is resistance a sin?) evaporate.

  **The Definition of Sedition:**
  For Aquinas, sedition is a special sin against Charity. Specifically, it is opposition to the **unity** of the multitude and the **common good**. To be guilty of sedition, you must be attacking the political order that sustains the community.

  **The Semantic Flip:**
  Aquinas argues that a tyrannical regime, by definition, seeks the *private good* of the ruler rather than the *common good*. Therefore, the tyrant is already in a state of rebellion against the purpose of government. The tyrant has broken the unity of the multitude first.
  *   **The Move:** If the tyrant has already destroyed the "common good" (the object that sedition attacks), then resisting the tyrant cannot technically be "sedition." You cannot be seditious against a power that is itself seditious against the common good.

  **The Prudential Caveat:**
  This is where your quote gets crucial: *"unless indeed the tyrant's rule be disturbed so inordinately..."*
  Aquinas introduces a **proportionality test**. Even if resisting a tyrant isn't *sedition*, it can still be sinful if it violates *prudence*. If the resistance causes more disorder, civil war, or suffering than the tyranny itself, the resistance becomes illicit.
  *   **The Result:** He doesn't say "Killing a tyrant is good." He says, "Resisting a tyrant is not the sin of sedition, provided you don't make things worse." This is a massive distinction. It moves the act from the category of *Intrinsic Evil* to the category of *Contingent Action subject to Prudential Judgment*.

  ### 2. Reconciling with *De Regimine Principum*

  *De Regimine Principum* (On Kingship) is indeed more cautious, and for a long time, scholars thought this contradicted the *Summa*. However, if you look at the *audience* and the *question*, they form a coherent doctrine based on **Public Authority**.

  **The Distinction: Private vs. Public**
  In *De Regimine* (Book I, Chapter 6), Aquinas addresses the *method* of removal. He explicitly warns against private citizens taking it upon themselves to kill a tyrant.
  *   **The Reason:** If private assassination becomes normalized, it destabilizes all authority. People will start killing leaders they merely *dislike*, claiming they are tyrants. It creates a precedent of violence that endangers good kings too.
  *   **The Solution:** The removal of a tyrant must be an act of **public authority**.
      *   If the king was elected by the people, the people (or their representatives) can depose him.
      *   If the king is appointed by a superior (like an Emperor or the Pope), that superior must depose him.

  **The Coherence:**
  There is no contradiction, only a division of labor between Moral Theology (*Summa*) and Political Science (*De Regimine*).
  *   **In the *Summa*:** He is answering a confessor's question: "Is a man who resists a tyrant automatically damned for sedition?" Answer: **No.** The moral label of "sedition" does not stick.
  *   **In *De Regimine*:** He is answering a statesman's question: "How do we practically remove a tyrant without causing anarchy?" Answer: **Not by private assassination.** Use public procedure.

  The coherent doctrine is this: **Tyranny forfeits legitimacy, but resistance requires legitimate authority.** You cannot fight illegitimate power with illegitimate power (private violence); you must fight it with legitimate power (public deposition).

  ### 3. Why the "Assassination" Narrative Persists

  If Aquinas is this cautious, why does everyone say he endorsed tyrannicide?

  1.  **The John of Salisbury Hangover:** John of Salisbury's *Policraticus* (1159) explicitly endorsed killing tyrants. Later medieval and early modern writers often conflated Salisbury's explicit endorsement with Aquinas's nuanced "not sedition" argument.
  2.  **The Monarchomachs:** In the 16th century, Protestant resistance theorists (like Knox and the authors of the *Vindiciae contra Tyrannos*) needed Catholic cover for resisting Catholic monarchs. They stretched Aquinas's "not sedition" argument into a positive right of resistance, ignoring his cautions about private authority in *De Regimine*.
  3.  **The "Sedition" Loophole:** By saying the tyrant is the seditious one, Aquinas effectively de-criminalizes the *intent* of resistance. Later readers took "It is not a sin" to mean "It is a virtue," which Aquinas never quite says. He treats it more as a regrettable necessity.

  ### 4. Is He Hedging?

  It looks like hedging, but it's actually **casuistry**. Aquinas is trying to navigate between two dangerous extremes prevalent in the 13th century:
  1.  **Absolute Passive Obedience:** The idea that all power is from God (Romans 13), so even a Nero must be obeyed. Aquinas rejects this by defining tyranny as a perversion of power, not a valid authority.
  2.  **Anarchic Vigilantism:** The idea that any individual can judge and execute the ruler. Aquinas rejects this to preserve social order.

  He is threading a needle. He wants to preserve the **right of the community to survive** (hence, tyranny isn't legitimate) without empowering **individuals to become judges in their own cause** (hence, no private assassination).

  ### Summary for Your Piece
  The narrative that "Aquinas said it's fine to kill tyrants" is a simplification of a much more sophisticated legal-moral argument.
  *   **The *Summa* move:** He redefines sedition so that resisting a tyrant isn't inherently sinful, but subjects it to a strict proportionality test (do no more harm than the tyranny).
  *   **The *De Regimine* constraint:** He restricts the *agent* of resistance. It is not the right of the private citizen, but the right of the public body (the *universitas*).
  *   **The Doctrine:** Tyranny is a public crime that requires a public remedy. Private violence is forbidden not because the tyrant has rights, but because the social order cannot survive if private violence is legitimized.

  Aquinas isn't giving you a green light for assassination; he's giving you a framework for **constitutional deposition** while warning you that the cure must not be worse than the disease.
