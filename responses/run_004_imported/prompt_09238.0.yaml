answer: |-
  For those of you who don't know me, I'm [Your Name]. For most of my life, Miriam wasn't just my aunt. She was a second mother. She was the one who checked if I'd eaten, who asked what I was reading, and who showed up when showing up was hard.

  Ten days ago, the world got smaller.

  Many of you in this room knew Miriam as a colleague, a mentor, or a model of a certain kind of commitment. You saw the budgets she balanced, the campaigns she led, the calculations she made to ensure that every dollar did the most good it possibly could. You know the scale of the good she did. You know the lives that are still here because she was there.

  But some of us in this room knew her as family. And we know that a life lived on that scale casts a long shadow.

  When I was nineteen, I gave Miriam a copy of Peter Singer's *Practical Ethics*. I was proud of myself for reading it; I thought I was giving her a gift. I didn't realize I was handing her a map for the rest of her life. She read the argument about the drowning child, and she decided she wouldn't walk past the pond. She set a cap on her spending. She gave away the rest. She went where the need was hottest, often when the need at home was also high.

  She didn't do this because she was immune to love. She did it because she loved the world in a way that terrified and inspired us.

  Miriam was a student of moral philosophy. She read the objections. She knew the argument that a life like hers corrodes personal integrity. She knew the worry that she was trying to be a "moral saint." She would have hated me using those words today. She left specific instructions: do not call her a saint. Do not call her a martyr. She was a woman who made choices, and she owned them.

  She also knew those choices had a price. She paid it, and so did we.

  There are people in this room who loved her who did not have her when they needed her most. I know her son sits with the memory of an empty seat at his wedding. I know that absence still aches. Miriam never pretended that choice was free. She never pretended it didn't cost her something, or cost him something. She didn't ask for forgiveness for it, and I will not offer apologies on her behalf today. To apologize would be to suggest she should have done otherwise, and she believed, to her core, that she could not have. But to ignore the cost would be to lie about the woman she was.

  She was not a machine calculating QALYs in a vacuum. She was a human being who loved her son, and who loved me, and who sometimes had to choose between the people she could hold and the people she could only help from a distance.

  There is a tension here. It is the tension Miriam lived inside of for thirty years. It is the tension between the love that stays home and the love that goes out to save strangers. Some of you believe that tension was resolved by the good she did. Some of you believe it was never resolved at all.

  Miriam didn't settle it. And I don't think I should, or can, settle it for her today.

  What I can tell you is this: When she was home, she was present. When she held you, she wasn't calculating. She had a theory that loving your family without calculation was itself a moral duty, because it made you better at everything else. I can tell you that when she hugged me, I never felt like a variable in an equation. I felt like her nephew.

  We are left now with the silence she left behind. For the public health community, that silence is a loss of capacity, of leadership, of a fierce intellect. For her family, that silence is a loss of a mother, a sister, an aunt. Both are true. Both are heavy.

  I don't have a lesson to offer you. I don't have a conclusion about whether the trade-offs were worth it. I only have the memory of a woman who tried to live by a light that was sometimes too bright for the rest of us to look at directly.

  She loved us. She loved the work. She knew the cost of both. And now, she is gone.

  Thank you.
