      *   **Goal:** A 5-minute eulogy (approx. 750-850 words). Warm, not academic. Acknowledge the cost to loved ones *and* the good she did, without resolving the tension. No hagiography, no lecture.
      *   **Speaker's Voice:** Nephew/Niece, took one ethics course, feels out of depth, wants honesty.

  2.  **Determine the Tone and Structure:**
      *   **Tone:** Intimate, honest, steady, loving, unflinching but gentle. Avoid jargon (QALYs, utilitarianism) where possible, or use them sparingly to ground it in *her* voice.
      *   **Structure:**
          1.  **Opening:** Acknowledge the loss and the relationship (second mother).
          2.  **The Spark:** The Singer book moment (connects speaker and aunt).
          3.  **The Life Lived:** How she operationalized her beliefs (fixed income, outbreaks).
          4.  **The Cost:** Address the elephant in the room (the son, the wedding, the absence) without apologizing or judging.
          5.  **The Philosophy (Light Touch):** Mention she thought about these hard things (Wolf/Williams/Railton) but focus on the *feeling* of being loved by her.
          6.  **Closing:** Bring it back to the present grief and the enduring impact.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the "second mother" aspect. It establishes intimacy. Acknowledge the suddenness.
      *   *The Philosophy/Origin:* Mention the book. It's a poignant detail that the speaker gave it to her. It shows their bond was intellectual *and* emotional. But keep it human. She didn't just read it; she *changed*.
      *   *The Lifestyle:* Describe the fixed income and the work. Make it concrete. Vaccination campaigns, hot zones.
