      *   **Philosophical Engagement:** Read Susan Wolf (Moral Saints), Bernard Williams (Integrity objection), Peter Railton (sophisticated consequentialism/loving without calculation).
      *   **The Conflict/Tension:** Her life caused pain at home. Missed her son's wedding due to an outbreak deployment. She acknowledged this cost but didn't apologize for the choice.
      *   **Instructions:** Do *not* call her a saint or martyr. Do *not* apologize for her choices (specifically the wedding).
