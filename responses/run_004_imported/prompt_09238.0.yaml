      *   *The Audience Split:* I need to speak to both the family and the colleagues. To the colleagues: She was real, not a symbol. To the family: She loved you, even when she wasn't there.
      *   *The "Saint" Prohibition:* Explicitly avoid the S-word. Frame her as a human being who made hard choices.
      *   *The Railton Angle:* She loved without calculation *because* it was better. But did she succeed? The prompt says she "never fully settled" the tension. So, acknowledge that she struggled too. She wasn't a robot.
      *   *Closing:* Return to the speaker's grief. The world is dimmer. The work continues, but the person is gone.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I use the word "utilitarian"? Maybe too academic. Let's describe the *behavior* instead. "She believed that if you could save a life, you should."
      *   *Check:* Did I apologize for the wedding? No. I need to say she missed it, it hurt, and she knew it hurt.
      *   *Check:* Is it warm? Use sensory details. Her voice, her presence.
      *   *Check:* Length. 5 minutes is roughly 750 words at a moderate pace.
      *   *Check:* The "QALY" detail. It's specific and characterizing. Keep it, but frame it as her way of thinking, not a lecture.
      *   *Check:* The instruction about not settling the tension. The ending shouldn't say "It was worth it" or "It wasn't worth it." It should say "It was her life, and we miss her."

  5.  **Drafting the Content (Mental or Scratchpad):**
