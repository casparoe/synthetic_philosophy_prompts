          *   *The Trap:* If Theory A is false, it entails the statement "A is false." It also entails "A is false OR X is true."
          *   *Actually, the simplest explanation of the Tichý result:*
              *   Let $T$ be the whole truth.
              *   Let $A$ be a false theory.
              *   Popper defines Truth Content as $A \cap T$ (statements in A that are true).
              *   Falsity Content is $A - T$ (statements in A that are false).
              *   Tichý showed: If $A$ and $B$ are both false, and $A$ has more truth content than $B$, it *necessarily* follows that $A$ also has more falsity content than $B$ in a way that cancels out or reverses the advantage.
              *   *Wait, that's too technical.*
