          *   *Why?* Because Theory 2 is "stronger" or more specific in its wrongness, it generates different sets of disjunctions.
          *   *Actually, the specific result is:* If A is closer to truth than B, then A's truth content > B's truth content AND A's falsity content < B's falsity content.
          *   Tichý proved: If A and B are false, you cannot have (Truth(A) > Truth(B) AND Falsity(A) < Falsity(B)).
          *   If A has more truth content, it *must* have more falsity content too.
          *   So the net score ($Vs = T - F$) never favors the intuitively better theory.

      *   **Drafting the "Why" (The Lockstep Problem):**
          *   Imagine Truth Content and Falsity Content are tied together by a string.
          *   To get more Truth Content (by making a theory stronger/more specific), you inevitably risk more Falsity Content.
