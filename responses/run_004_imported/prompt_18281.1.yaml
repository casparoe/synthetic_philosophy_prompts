              *   Tichý/Miller showed that for any false theory, the amount of "truth content" it generates is inextricably linked to its "falsity content."
              *   *Specifically:* If Theory A is closer to the truth than Theory B (intuitively), Popper's math often says B is closer, or they are incomparable.
              *   *The "Killer" Insight:* If Theory A is false, you can always construct a true statement that A implies but B doesn't, AND a false statement A implies but B doesn't. The measures move in lockstep.

      *   **Refining the Intuitive Explanation (The Weather Example is best):**
