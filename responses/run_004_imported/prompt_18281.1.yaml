answer: |-
  This is a fantastic question. You have hit on one of the most famous technical disasters in 20th-century philosophy of science. It is also a perfect example of how formal logic can sometimes produce results that wildly contradict our intuition.

  You are correct: Popper wanted to save the idea of scientific progress. If we can never prove a theory is *True* (capital T), he argued, we should at least be able to say a new theory is *Closer to the Truth* than the old one. He called this **verisimilitude** (truth-likeness).

  His definition was elegant but, as you noted, shattered by Pavel Tichý and David Miller in 1974. Here is the intuitive walkthrough of why it broke, without the heavy symbolic logic.

  ### 1. Popper's "Bag of Statements" Idea

  To understand the failure, we first have to understand Popper's definition.

  Popper viewed a scientific theory not as a single sentence, but as a massive **bag of logical consequences**.
  *   If your theory is "All swans are white," that implies "This swan is white," "That swan is white," "If it's a swan, it's not black," etc.
  *   Popper assumed that for any theory, we can divide this bag into two smaller bags:
      1.  **Truth Content:** All the statements in the bag that happen to be true.
      2.  **Falsity Content:** All the statements in the bag that happen to be false.

  **Popper's Formula:**
  $$ \text{Verisimilitude} = \text{Size of Truth Bag} - \text{Size of Falsity Bag} $$

  **The Intuition:**
  A theory is "closer to the truth" if it captures more true facts and fewer false facts. If Theory A has more truth content and less falsity content than Theory B, then A is more verisimilar.

  This sounds perfectly reasonable. So, where did the logic trap him?

  ### 2. The Trap: How Logical Consequences Work

  The problem lies in how logic generates consequences, specifically when a theory is **false**.

  In formal logic, you can combine statements using "OR" (disjunction). This creates a loophole.
  *   Statement: "It is raining." (False, it's sunny).
  *   Statement: "2 + 2 = 4." (True).
  *   Combined: "It is raining **OR** 2 + 2 = 4."

  In logic, if *one part* of an "OR" statement is true, the *whole statement* is true. So, even though my theory ("It is raining") is false, it logically implies a true statement ("It is raining OR 2+2=4").

  **The Consequence:**
  Even a completely false theory generates an infinite number of true statements just by being combined with random truths via "OR."

  Popper knew this. He thought his definition could handle it by weighing the falsity content against the truth content. He assumed that a "better" false theory (one closer to the truth) would generate *more* true consequences and *fewer* false consequences than a "worse" false theory.

  ### 3. The Tichý-Miller "Kill Shot"

  Tichý and Miller looked closely at the relationship between the Truth Bag and the Falsity Bag for **false theories**. They discovered a devastating lockstep relationship.

  Here is the core insight, simplified:

  **If Theory A is false, you cannot increase its Truth Content without also increasing its Falsity Content.**

  Imagine you have two false theories, Theory A (the "good" false theory) and Theory B (the "bad" false theory).
  *   Intuitively, A is closer to the truth.
  *   For Popper's math to work, A must have **more** True Consequences than B.
  *   AND A must have **fewer** False Consequences than B.

  Tichý and Miller proved that for false theories, **these two conditions are mutually exclusive.**

  If Theory A has more True Consequences than Theory B, the logic dictates that Theory A *must also* have more False Consequences than Theory B. The two bags grow and shrink together.

  #### The Weather Example (Tichý's Famous Illustration)
  To make this concrete, Tichý used a weather example. Imagine the actual weather is **Hot, Rainy, and Windy**.

  *   **Theory 1:** It is Hot, Rainy, and **Not** Windy.
      *   *Intuition:* This is very close to the truth. It got 2 out of 3 facts right.
  *   **Theory 2:** It is **Not** Hot, **Not** Rainy, and **Not** Windy.
      *   *Intuition:* This is terrible. It got 0 out of 3 facts right.

  According to Popper's goal, Theory 1 should have higher verisimilitude.

  However, when you calculate the logical consequences (all the "OR" statements, all the combinations):
  *   Because Theory 1 is more specific about what *is* happening (Hot, Rainy), it generates a specific set of true consequences.
  *   Because Theory 2 is claiming everything is the *opposite*, it generates a different set.

  Tichý showed mathematically that under Popper's definition, **Theory 1 cannot be shown to be closer to the truth than Theory 2.** In fact, depending on how you count the sets, the "worse" theory (Theory 2) can sometimes mathematically come out ahead, or they are simply incomparable.

  ### 4. Why does this happen? (The Core Insight)

  The core insight behind the Tichý-Miller argument is that **logical content is not independent of truth value.**

  When you make a theory stronger (more specific), you increase its content.
  *   If the theory is **True**, increasing strength adds only to the **Truth Bag**. (Great!)
  *   If the theory is **False**, increasing strength adds to **BOTH** the Truth Bag and the Falsity Bag simultaneously.

  Because Popper defined verisimilitude as a subtraction ($Truth - Falsity$), and because Tichý showed that for false theories these two values move in lockstep, the result is always a wash. You can never get a "net positive" score for one false theory over another.

  **The Analogy:**
  Imagine you are paid \$10 for every true statement your theory implies, and fined \$10 for every false statement it implies.
  *   If your theory is True, you just keep earning money.
  *   If your theory is False, Tichý proved that for every extra \$10 you earn (true consequences), you automatically incur a \$10 fine (false consequences).
  *   **Result:** Your net balance never improves. You can never say one bankrupt theory is "richer" than another.

  ### 5. The Aftermath

  When this was published in 1974, it was a shock. Popper himself admitted the definition was flawed.

  Does this destroy Popper's philosophy? Not necessarily. Most philosophers view it as a technical failure of *measurement*, not a failure of the *concept*. We still intuitively believe that Newton's physics is closer to the truth than Aristotle's, even if both are technically "false" in light of Einstein.

  Philosophers of science (like Ilkka Niiniluoto) spent the next few decades fixing the definition. They moved away from Popper's "Content" approach (counting statements) to a **"Similarity" approach** (measuring the distance between the theory and reality in "possible worlds").

  **Summary:**
  Popper's definition collapsed because he treated Truth Content and Falsity Content as independent variables that could be weighed against each other. Tichý and Miller proved that for any false theory, they are dependent variables tied together by the rules of logic. You cannot gain one without gaining the other, making it impossible to calculate a "progress score" for false theories using Popper's formula.
