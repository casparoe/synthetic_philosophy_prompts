          *   Wait, Tichý's example is usually about logical consequences, not just atomic facts. I need to explain that a theory implies *infinite* statements.
          *   *Better approach:* Focus on the relationship between Truth Content and Falsity Content when a theory is *false*.
          *   *Key Insight:* If a theory is false, it implies *everything* that is true? No, that's explosion from contradiction. A false theory doesn't necessarily imply everything.
          *   *Correction:* In Popper's logic, if Theory A is false, it has some false consequences. But it also has true consequences.
          *   *The Tichý/Miller trick:* They showed that if Theory A is false and Theory B is false, you can't order them.
          *   *Simplification:* Let's look at the "Weather" example used by Tichý.
          *   Reality: Hot, Rainy, Windy.
          *   Theory 1: Hot, Rainy, Stationary (Not Windy).
          *   Theory 2: Cold, Rainy, Windy.
          *   Intuitively, Theory 1 is closer (2/3 right vs 2/3 right? No, let's make one clearly better).
          *   Let's stick to the logical structure rather than specific atomic facts to avoid confusion about "counting facts."
