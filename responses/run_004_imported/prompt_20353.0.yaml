answer: |-
  Good morning, everyone. Welcome to our sixth annual Spring Workshop. It is genuinely thrilling to see faces from six different schools filling this room.

  We have a tradition to start things off. In a moment, you will be paired with a stranger. You will play a single round of a game. You will never see this person again. You cannot talk to them. You cannot punish them later if they let you down. The rules are simple: if you both cooperate, you both get a moderate reward. If one defects while the other cooperates, the defector gets everything, and the cooperator gets nothing. If you both defect, you both get very little.

  By the standard textbook logic of game theory, the answer is obvious. You should defect. Your choice cannot causally change what the other person does. They have already decided, or they will decide independently. So, to protect yourself and maximize your gain, you take the points and run.

  But this is an Effective Altruism club. And we are here because we suspect that "standard logic" sometimes misses the bigger picture.

  For those of you who have been in the club for a while, you know where I'm going. For those who haven't: we are going to try something different. We are going to ask you to consider cooperating.

  Why? Because of an idea called Evidential Cooperation in Large Worlds.

  Here is the intuition. We don't believe your choice magically reaches across the table to control their hand. That's not how physics works. But, we do believe that your choice is *evidence* of what they will do. Why? Because you are both human. You are both students who chose to spend a Saturday morning thinking about how to do good. You are both reasoning through the same problem, with similar brains, in similar contexts.

  If the universe is vast—perhaps infinite—then there are countless agents out there, causally disconnected from us, who reason exactly the way you do. If you decide that "cooperation is the rational choice," then it is highly probable that other agents who reason like you will come to the same conclusion. Your decision doesn't *cause* theirs, but it is correlated with theirs. By cooperating, you aren't just getting points in this room; you are aligning yourself with a pattern of cooperation that might echo across a much larger world.

  Now, I need to be honest with you. This is not settled science. If you ask a mainstream decision theorist, many will tell you this reasoning is flawed. They will say correlation is not causation, and that you should only care about what you can directly influence. They are smart people, and they have arguments.

  So, when you sit down for this game, I am not asking you to follow a proven law of the universe. I am asking you to take a philosophical wager.

  We are betting that the world is interconnected in ways that standard game theory ignores. We are betting that reasoning is a shared resource, not a private weapon. And even if the "Large World" theory turns out to be false, there is value in practicing it here. There is value in looking at a stranger, knowing you can never be held accountable to them, and choosing to trust them anyway.

  Some of you will defect. That is rational under many frameworks, and you won't be shamed for it. This is an experiment, not a test of character.

  But for those of you who feel that pull—the idea that we can do better than the default, that our reasoning connects us even when our hands cannot—this is your chance to act on it.

  So, find your partner. Look at the rules. And ask yourself: In a universe of mirrors, what do I want my reflection to show?

  Let's play.
