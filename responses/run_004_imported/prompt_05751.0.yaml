answer: |-
  It is a pleasure to speak with someone who sees the measure-theoretic skeleton beneath the philosophical flesh. You have correctly identified the fault line in social choice theory that opens up once you relax the "Common Priors" assumption. The names you recall are spot on: Hylland and Zeckhauser (1979) established the impossibility result, and Philippe Mongin (particularly in his 1995 and 2016 work) did the heavy lifting on diagnosing *why* it fails—specifically distinguishing between "spurious" and "genuine" unanimity.

  You asked for the mechanics of how *Ex Ante* Pareto can force a social choice that looks indefensible *Ex Post*, and what that implies for Harsanyi. Let's walk through the math, then the philosophy.

  ### The Mechanics: A Bare-Bones Example

  The core tension arises because *Ex Ante* preferences are linear in probabilities, while *Ex Post* rankings are state-specific. When priors diverge, agents can agree on a gamble *Ex Ante* purely because they disagree on the likelihood of the states, not because the gamble creates value.

  Let's construct a scenario with two agents ($A, B$), two states of the world ($S_1, S_2$), and two acts ($L_{safe}, L_{bet}$).

  **1. The Setup**
  *   **Outcomes:** We measure utility in monetary terms for simplicity (risk neutrality).
  *   **Act $L_{safe}$:** A status quo option. Both agents receive **$0** regardless of the state.
  *   **Act $L_{bet}$:** A speculative bet.
      *   In $S_1$: Agent $A$ gets **+$10**, Agent $B$ gets **-$5**.
      *   In $S_2$: Agent $A$ gets **-$5**, Agent $B$ gets **+$10**.

  **2. The Beliefs (Heterogeneous Priors)**
  Here is where the physics of the problem lives. The agents have different measures over the sigma-algebra of states.
  *   **Agent $A$'s Prior:** $P_A(S_1) = 0.8$, $P_A(S_2) = 0.2$.
  *   **Agent $B$'s Prior:** $P_B(S_1) = 0.2$, $P_B(S_2) = 0.8$.

  **3. Ex Ante Evaluation (The Harsanyi Input)**
  We calculate the Expected Utility (EU) for each agent based on their own subjective probability measure.

  *   **Agent $A$:**
      $$E_A[L_{safe}] = 0$$
      $$E_A[L_{bet}] = 0.8(10) + 0.2(-5) = 8 - 1 = 7$$
      $\Rightarrow A$ strictly prefers $L_{bet}$.

  *   **Agent $B$:**
      $$E_B[L_{safe}] = 0$$
      $$E_B[L_{bet}] = 0.2(-5) + 0.8(10) = -1 + 8 = 7$$
      $\Rightarrow B$ strictly prefers $L_{bet}$.

  **The *Ex Ante* Pareto Condition:** Since both agents strictly prefer $L_{bet}$ to $L_{safe}$ based on their own light, a social planner respecting *Ex Ante* Pareto **must** rank $L_{bet} \succ_{soc} L_{safe}$. Harsanyi's theorem would aggregate these utilities into a social welfare function that chooses the bet.

  **4. Ex Post Evaluation (The Reality Check)**
  Now, uncertainty resolves. We look at the rankings *state-by-state*.

  *   **Case 1: State $S_1$ obtains.**
      *   Payoffs: $A$ gets $10$, $B$ gets $-5$.
      *   Comparison to Safe ($0, 0$): $A$ is better off, but **$B$ is worse off**.
      *   Does $L_{bet}$ Pareto dominate $L_{safe}$? **No.**

  *   **Case 2: State $S_2$ obtains.**
      *   Payoffs: $A$ gets $-5$, $B$ gets $10$.
      *   Comparison to Safe ($0, 0$): $B$ is better off, but **$A$ is worse off**.
      *   Does $L_{bet}$ Pareto dominate $L_{safe}$? **No.**

  **The Conflict:**
  The *Ex Ante* unanimity was entirely generated by the divergence in $P_A$ and $P_B$.
  *   $A$ wants the bet because she thinks $S_1$ is likely.
  *   $B$ wants the bet because he thinks $S_2$ is likely.
  *   **In reality (Ex Post), there is no state of the world where *both* agents are better off taking the bet.** In every possible realization of the universe, one person is a "loser" relative to the safe option.

  If you adopt an *Ex Post* Pareto principle (which says society should only prefer $X$ to $Y$ if $X$ is better for everyone in every state, or at least not worse for anyone), you are forced to reject $L_{bet}$. Thus, **Ex Ante Pareto and Ex Post Pareto are incompatible under heterogeneous priors.**

  ### Addressing the "Everyone Worse Off" Intuition
  You mentioned a scenario where "every single person... would say left them worse off." In the zero-sum example above, one person wins ex-post. To get *everyone* worse off ex-post while still agreeing ex-ante, you need a **negative-sum bet** (a "house take").

  Modify $L_{bet}$ slightly:
  *   $S_1$: $A$ gets $+8$, $B$ gets $-8$.
  *   $S_2$: $A$ gets $-8$, $B$ gets $+8$.
  *   (Keep priors at 0.8/0.2).

  *Ex Ante:*
  $A$: $0.8(8) + 0.2(-8) = 4.8 > 0$.
  $B$: $0.2(-8) + 0.8(8) = 4.8 > 0$.
  Both agree to take the bet.

  *Ex Post:*
  In $S_1$, $B$ loses 8 (worse than 0). In $S_2$, $A$ loses 8 (worse than 0).
  Still, only one loses. To make *both* lose ex-post, the payoffs must be negative in all states relative to safe. But if payoffs are negative in all states, Expected Utility will be negative for *any* probability distribution. So, strictly speaking, you cannot have rational VNM agents agree *Ex Ante* to a gamble that leaves *everyone* worse off in *every* state compared to a safe option, provided they agree on the utility of the outcomes.

  **However**, the normative disaster remains: The social planner is forced to endorse a gamble that **guarantees a loser** in every state, based solely on the agents' disagreement about facts. The "unanimity" is what Mongin calls **spurious**.

  ### Implications for Harsanyi and Utilitarianism

  This creates a significant hole in the standard "Harsanyi implies Utilitarianism" narrative. Here is how the field generally parses the damage:

  **1. The Common Priors Requirement**
  Harsanyi's theorem is mathematically valid regardless of priors. However, its *normative* force (the idea that we *ought* to maximize the sum of utilities) relies on the **Pareto Principle** being morally binding.
  Most theorists (Mongin, Gilboa, Samet) now argue that the Pareto principle is only normatively binding when beliefs are shared (or at least not in conflict). If $A$ and $B$ disagree about the probability of rain, and that disagreement drives their preference for carrying umbrellas, a benevolent social planner shouldn't necessarily respect that preference if the planner knows they are just betting against each other.
  *   **Conclusion:** Harsanyi's utilitarianism holds, but only for agents with **Common Priors**. If priors differ, you cannot simply sum their expected utilities.

  **2. The "Ex Post" Rescue**
  One way to rescue the framework is to shift the domain of the Social Welfare Function (SWF).
  *   **Ex Ante SWF:** $W = \sum w_i E_i[U_i]$. (Fails with heterogeneous priors).
  *   **Ex Post SWF:** $W = \sum w_i U_i(outcome)$, calculated state-by-state.
  If you define social welfare as the weighted sum of utilities *in each state*, you avoid validating speculative bets. In the example above, in $S_1$, the social welfare of the bet is $10w_A - 5w_B$. If weights are equal, $W=2.5$. Safe is 0. So Utilitarianism might still take the bet!
  *   *Wait, check that:* If $w_A = w_B = 1$, $W_{bet}(S_1) = 5$. $W_{safe} = 0$. The Utilitarian planner *still* takes the bet ex-post because the winner gains more than the loser loses.
  *   To stop the bet, you need **Ex Post Pareto**, not just Utilitarianism. Ex Post Pareto says: "If someone loses and no one gains (relative to safe), don't do it." In my first example ($+10/-5$), Ex Post Pareto rejects the bet because $B$ loses in $S_1$.
  *   So, shifting to an **Ex Post Pareto** constraint saves us from spurious unanimity, but it clashes with Harsanyi's *Ex Ante* formulation.

  **3. Mongin's "Restricted Pareto"**
  Mongin suggests we should only apply the Pareto principle when preferences are driven by **values**, not **beliefs**.
  *   If $A$ and $B$ both prefer $X$ to $Y$ because they both value health, respect that.
  *   If $A$ and $B$ both prefer $X$ to $Y$ solely because $A$ thinks $X$ causes health and $B$ thinks $Y$ causes disease (and they disagree on the causal model), do **not** respect that unanimity.
  This requires the social planner to disentangle utilities from probabilities—a non-trivial identification problem, but conceptually sound.

  ### Summary for a Physicist

  Think of it like a coordinate transformation problem.
  *   **Harsanyi's Theorem** assumes all observers are in the same reference frame (Common Priors) but have different calibration scales (Utilities). It gives you a transformation law to map individual scales to a social scale.
  *   **The Hylland-Zeckhauser/Mongin result** shows that if observers are in *different* reference frames (Heterogeneous Priors), you cannot simply sum their readings. If you do, you validate artifacts of the coordinate mismatch (speculative bets) rather than physical reality (welfare).

  **Does this kill Utilitarianism?**
  No, but it restricts its domain. It suggests that a coherent Utilitarian calculus requires a "Veil of Ignorance" that homogenizes beliefs (as Harsanyi originally intended with his own "impersonal" probabilities) or requires the social planner to impose a single probability measure (a "scientific" prior) over the states of the world, aggregating only the *utility functions*, not the expectations.

  If you aggregate expectations with different priors, you aren't doing welfare economics; you're running a prediction market. And as we know, prediction markets can clear efficiently even when the outcome is socially suboptimal.

  ### References for your shelf
  Since you enjoy the formal backbone:
  1.  **Hylland, A., & Zeckhauser, R. (1979).** "The Impossibility of Bayesian Group Decision Making with Separate Aggregation of Beliefs and Values." *Econometrica*. (The impossibility proof).
  2.  **Mongin, P. (1995).** "Consistent Bayesian Aggregation." *Journal of Economic Theory*. (The diagnosis of spurious unanimity).
  3.  **Gilboa, I., Samet, D., & Schmeidler, D. (2004).** "Utilitarian Aggregation of Beliefs and Tastes." *Journal of Political Economy*. (Discusses the "No Betting" condition).

  It is a fascinating corner of the literature because it forces us to admit that "respecting preferences" is incoherent unless we also specify "respecting beliefs," and respecting conflicting beliefs is often irrational for a collective agent.
