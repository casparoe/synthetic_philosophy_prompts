answer: |-
  Your uncle is half-right, but he is significantly oversimplifying a very complex corner of Catholic moral theology. If you go into the next argument knowing the actual texts, you'll see that Aquinas does **not** teach that killing a tyrant is simply "the virtuous thing to do" for any conscientious Catholic.

  In fact, Aquinas is quite cautious about it. While he condemns tyranny fiercely, he places heavy restrictions on who is allowed to remove a tyrant and how.

  Here is the breakdown of the real argument, the texts involved, and where your uncle is misreading the tradition.

  ### 1. What Aquinas Actually Wrote
  Your uncle is likely thinking of two specific texts: *De Regno* (On Kingship) and the *Summa Theologiae*.

  **In *De Regno* (Book I, Chapter 6):**
  Aquinas asks what should be done about a tyrant. He argues that it is not sedition to depose a tyrant, because the tyrant is the one disrupting the unity of the community. However, he immediately puts the brakes on assassination.
  *   **The "Greater Evil" Argument:** Aquinas warns that killing a tyrant often leads to worse tyranny. The new ruler, fearing the same fate, may become even more suspicious and cruel.
  *   **The Method:** He suggests that if there is a "public authority" (like a higher emperor or an elected body) that has the right to appoint the king, *they* should be the ones to depose him.
  *   **Private Individuals:** He explicitly argues against private individuals taking it upon themselves to kill the ruler. He writes that this is dangerous for the multitude because it sets a precedent where any disgruntled citizen might kill a leader they dislike.

  **In the *Summa Theologiae* (II-II, Q. 42, A. 2):**
  Aquinas discusses sedition. He states that opposing a tyrannical government is not sedition *unless* the resistance causes greater harm to the community than the tyranny itself.
  *   **Key Quote:** He notes that sometimes "the tyranny becomes worse" if the tyrant is killed. Therefore, he suggests that ultimately, the people should pray to God to soften the tyrant's heart (citing Proverbs 21:1), rather than taking violent action themselves.

  **In his *Commentary on the Sentences*:**
  Aquinas addresses the specific question of whether it is lawful to kill a tyrant. He references the Old Testament story of Ehud killing King Eglon. However, he distinguishes this by noting that Ehud acted as a deliverer raised up by God, not merely as a private citizen acting on his own judgment.

  **The Verdict on Aquinas:**
  Aquinas believes tyranny is a sin and a great evil. However, he **does not** grant a license to private citizens to assassinate rulers. He prefers removal by public authority or divine intervention. To say Aquinas thinks assassination is "the virtuous thing to do" is to ignore his warnings about chaos and the greater good.

  ### 2. The "Settled Teaching" Claim
  Your uncle claimed this is "settled Catholic teaching." It isn't. This was one of the most heated debates in Scholastic theology for centuries *after* Aquinas.

  *   **The Conciliarists & Jesuits:** In the 16th and 17th centuries, theologians like Juan de Mariana (a Jesuit) argued more strongly for tyrannicide. Mariana famously argued that a tyrant who seizes power without right could be killed by a private citizen.
  *   **The Backlash:** This view got the Jesuits in serious trouble. After the assassination of Henry IV of France (by a man influenced by these theories), the French Parliament and many Catholic monarchs condemned the idea of tyrannicide. The Church never dogmatically defined it as "virtuous" to kill a tyrant; in fact, many Popes condemned the proposition that it is lawful to kill tyrants.
  *   **Modern Catechism:** The current *Catechism of the Catholic Church* (CCC 2243) is very strict. It states that armed resistance is permissible only under very specific conditions (grave violations of rights, last resort, no better solution, etc.). However, it generally condemns assassination and terrorism. It emphasizes that "one may not do evil so that good may result from it."

  ### 3. Applying this to *Valkyrie* (Stauffenberg)
  This is where the movie adds a layer your uncle might be missing. The July 20 plotters were not "private citizens" in the modern sense; they were high-ranking officers within the state apparatus.

  *   **Public Authority Argument:** Some Catholic moral theologians who have analyzed *Valkyrie* argue that Stauffenberg and his co-conspirators could be seen as acting as a "public authority" trying to restore the legitimate rule of law against a usurper who had subverted the constitution.
  *   **The Counter-Argument:** Even so, the act of assassination remains morally fraught in Catholic teaching. Many Catholic ethicists argue that while resisting Hitler was mandatory, *assassination* specifically is hard to justify under traditional Just War Theory and Catholic moral theology, which generally forbids targeting specific individuals for execution without trial.

  ### 4. How to Push Back (The "Cheat Sheet")
  Next time your uncle brings this up, you don't need to be a theologian. You just need to point out the nuances he skipped. Here are three points you can make:

  1.  **"Aquinas distinguishes between Public Authority and Private Citizens."**
      *   *Argument:* "Uncle, Aquinas explicitly says in *De Regno* that private individuals shouldn't kill tyrants because it leads to chaos. He says it has to be done by public authority. Stauffenberg was military, but was he 'public authority' in Aquinas's sense? Aquinas is much more cautious than you're making him sound."
  2.  **"The 'Greater Evil' Principle."**
      *   *Argument:* "Aquinas warns that killing a tyrant often results in a worse tyrant. He says you have to weigh the consequences. It's not automatically virtuous; it's only permissible if it doesn't cause greater harm to the common good. That's a high bar, not a blank check."
  3.  **"It's Not 'Settled Teaching'."**
      *   *Argument:* "If this was settled, the Jesuits wouldn't have been condemned for teaching it in the 1600s, and the modern Catechism wouldn't be so restrictive on armed resistance. The Church has historically been very wary of legitimizing political assassination."

  ### Summary
  Your uncle is right that Catholic theology does not demand absolute pacifism in the face of evil, and that tyranny is a grave sin. But he is wrong that Aquinas "settled" the matter in favor of assassination.

  Aquinas's position is: **Tyranny is intolerable, but removing it must be done carefully, preferably by public authority, and never if it will cause greater harm to the community.**

  You can tell him you read up on *De Regno* and the *Summa*, and that while you agree resisting Hitler was right, claiming Aquinas gives a theological green light for assassination is a simplification that ignores the Angelic Doctor's warnings about sedition and social order.
