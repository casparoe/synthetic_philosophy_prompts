prompt: |-
  I'm a student member of my high school's Honor Council, which can discipline "conduct that violates the moral standards of the school community" even when no other rule has been broken. A case has come to us: several seniors, all eighteen, have been playing poker for real money among themselves off campus. Nobody is in debt or was pressured, no one outside the group is affected, and our handbook's gambling rule, which covers on-campus conduct only, doesn't reach it. Parents and teachers still want them punished, arguing that a school depends on shared standards, and that quietly tolerating this, even though it harms no one in particular, erodes something the community needs. Other Council members say we should only discipline conduct that harms an identifiable person, since "some people are offended" would justify punishing almost any unpopular private choice. The Council is evenly split. Please draft the memo I'll bring to our vote: it should recommend how we should rule, sketch a workable test for similar future cases, and take the "shared standards" side's strongest version seriously rather than dismiss it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Student member of a High School Honor Council.
      *   **Task:** Draft a memo for the Council's vote.
      *   **Case:** Seniors (18+) playing poker for money off-campus. No debt, no pressure, no outside victims. Handbook gambling rule doesn't apply (off-campus).
      *   **Conflict:** Evenly split Council.
          *   *Side A (Shared Standards):* School depends on moral cohesion; tolerating this erodes community values, even without specific harm. Parents/teachers support this.
          *   *Side B (Harm Principle):* Only discipline conduct harming an identifiable person. "Offense" isn't enough; otherwise, any private choice could be punished.
      *   **Requirements:**
          *   Recommend a ruling.
          *   Sketch a workable test for future cases.
          *   Take the "Shared Standards" side seriously (steelman their argument, don't dismiss it).

  2.  **Determine the Stance/Recommendation:**
      *   *Option 1: Punish.* Aligns with parents/teachers and "Shared Standards." Risk: Overreach, privacy concerns, setting a precedent for policing private adult behavior of students.
      *   *Option 2: Don't Punish.* Aligns with "Harm Principle" and legal handbook limits. Risk: Alienating administration/parents, appearing to disregard school values.
      *   *Option 3: Nuanced Middle Ground.* Acknowledge the tension. Usually, in honor council contexts, the *purpose* of the council is key. Is it punitive or educational? Is it an arm of administration or a peer body?
      *   *Decision:* The most robust ethical position for a *student* Honor Council, especially involving legal adults off-campus, is to **not punish**, but to articulate *why* in a way that respects the "Shared Standards" argument. Punishing legal, consensual, off-campus activity sets a dangerous precedent for student autonomy and creates a slippery slope (what about drinking? vaping? political views?). However, simply saying "no harm, no foul" ignores the legitimate concern about community culture.
      *   *Refined Decision:* Recommend **no disciplinary sanction**, but issue a **statement of values** or refer to administration for a broader policy discussion. Actually, the prompt asks *how we should rule* on the case. I need to pick a side for the ruling.
      *   *Stronger Argument:* If I rule "No Violation," I need to show that upholding the *integrity of the Honor Code itself* requires limiting its scope. If the Code becomes too broad, it loses legitimacy. This actually serves the "Shared Standards" goal better in the long run.
      *   *Wait, let's look closer:* The prompt asks to take the "Shared Standards" side seriously. If I rule against them, I must show why their concern is valid but misapplied here. If I rule *for* them, I must show why this specific case meets the bar without opening the floodgates.
      *   *Best Path for a Student Leader:* A student Honor Council policing legal, off-campus adult behavior is generally fraught with liability and legitimacy issues. The "Harm Principle" is safer and more defensible. However, to satisfy the prompt's requirement to "take the shared standards side seriously," I need to acknowledge that schools *are* moral communities, not just contract zones.
      *   *Final Decision:* Recommend **No Sanction**. Why? Because the Honor Council's legitimacy depends on clear boundaries. However, acknowledge that the behavior *might* conflict with aspirational values, just not *enforceable* standards. This distinguishes between "virtue" and "discipline."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on the poker case) and the core tension (Community Standards vs. Individual Liberty/Scope).
      *   **The Case Summary:** Briefly recap the facts (Seniors, 18+, off-campus, consensual, no handbook violation).
      *   **Addressing the "Shared Standards" Argument (Steelmanning):** This is crucial. I need to explain *why* the parents/teachers/Council members are worried. It's not just about gambling; it's about the school as a *moral ecosystem*. If the school condones X, does it weaken the stance against Y? Acknowledge that trust and reputation matter.
      *   **The Counter-Argument (Legitimacy & Scope):** Why punishing this is dangerous. The "Slippery Slope." The difference between *aspirational* values and *enforceable* rules. The risk of arbitrary enforcement.
      *   **The Recommendation:** No sanction. But with a caveat/explanation.
      *   **The Proposed Test (The "Workable Test"):** This needs to be a framework for future "moral standard" cases. It needs to balance the two sides.
          *   *Criteria:* Nexus to school mission? Identifiable harm? Reasonable expectation of privacy?
      *   **Conclusion:** Final appeal to unity.

  4.  **Refining the Tone:**
      *   Must be respectful, thoughtful, and mature.
      *   Avoid legalistic jargon where possible, but show legal/ethical reasoning.
      *   Ensure the "Shared Standards" side feels heard, not patronized.

  5.  **Developing the "Workable Test":**
      *   I need a test that allows for *some* off-campus discipline (e.g., hate speech, cheating that affects school standing) but excludes this poker case.
      *   *Test Idea:* The "Substantial Nexus & Harm" Test.
      *   1. Does it directly impact the school's educational mission or safety?
      *   2. Is there a victim or systemic harm (beyond offense)?
      *   3. Is the conduct fundamentally incompatible with membership in this specific community (e.g. cheating vs. gambling)?

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I dismiss the parents' view?
      *   *Fix:* Make sure to explicitly state that their concern about "erosion of culture" is valid, but argue that *disciplinary overreach* erodes culture faster.
      *   *Critique:* Is the test too vague?
      *   *Fix:* Make the test specific. Use terms like "Direct Nexus" and "Non-Consensual Impact."
      *   *Critique:* Is the recommendation clear?
      *   *Fix:* Start the recommendation section clearly.

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   Recommend how to rule? Yes (No Sanction).
      *   Sketch a workable test? Yes (The Nexus & Harm Test).
      *   Take "Shared Standards" seriously? Yes (Dedicated section).

  8.  *(Self-Correction on the "No Sanction" choice)*: Is there a world where "Sanction" is the better essay? If I argue for a sanction, I have to define the limit. "Gambling is uniquely corrosive." But the prompt says they are 18 and it's legal off-campus. It's harder to defend punishing legal adult behavior without sounding authoritarian. The "No Sanction" route allows for a more nuanced discussion of the *limits* of moral authority, which fits an Honor Council's educational role better. I will stick with "No Sanction."

  9.  *(Wait, one more consideration)*: The prompt says the Handbook rule covers *on-campus only*. The Council disciplines "conduct that violates moral standards... even when no other rule has been broken." This is the "General Moral Clause." The tension is specifically about the scope of *that* clause. Okay, my analysis holds. The existence of the clause invites the "Shared Standards" argument. My job is to define its limits.

  10. **Finalizing the Test:** Let's call it the "Community Nexus Test."
      *   1. Substantial Connection to School Function.
      *   2. Absence of Consent/Privacy Expectation.
      *   3. Prevention of Tangible Harm.

      *Actually, let's refine that.* To be fair to the "Shared Standards" side, the test shouldn't *just* be "Harm." It should allow for "Institutional Integrity."
      *   Revised Test:
          1.  **Institutional Nexus:** Does this directly reflect on the school's core academic or safety mission?
          2.  **Non-Consensual Impact:** Does it affect non-participants?
          3.  **Foreseeable Risk:** Does it create a high risk of future harm to the community?

      *Okay, let's write.*

  **(Self-Correction during drafting the memo):** I need to make sure I don't sound like a lawyer representing a client, but a student leader addressing peers. The tone should be collaborative but decisive.

  **(Final check on "Shared Standards"):** I need to make sure I don't just say "They are wrong." I need to say "They are right about the goal, but wrong about the method." The goal (community cohesion) is good. The method (punishing private legal acts) is the problem.

