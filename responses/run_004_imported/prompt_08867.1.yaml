answer: |-
  This is a fantastic objection, and you are right to take it seriously. Your student has effectively put their finger on one of the most significant limitations—and frequent misinterpretations—of Lewis's framework. It is a worry that has spawned a substantial literature in feminist philosophy and social ontology (think Ann Cudd, Edna Ullmann-Margalit, and Robert Sugden).

  The short answer is: **The student is right that Lewis's definition provides no *internal* moral resources to critique a convention, but wrong to think that labeling something a "convention" shields it from *external* moral critique, or that Lewis's model precludes rational evolution.**

  Here is a breakdown of where the student's reasoning holds, where it overreaches, and how you can unpack this for the seminar without having to abandon Lewis.

  ### 1. Clarifying "Arbitrariness"
  The student's first move is to equate **arbitrariness** with **normative indifference**. This is the crux of the misunderstanding.

  For Lewis, a regularity $R$ is arbitrary only in a very specific, technical sense: there exists an alternative regularity $R'$ that could have solved the *coordination problem* $S$ almost as well as $R$.
  *   **What it means:** If we drive on the left, we coordinate. If we drive on the right, we also coordinate. Relative to the goal of *not crashing*, the choice is arbitrary.
  *   **What it doesn't mean:** It does not mean $R$ and $R'$ are identical in all consequences. Driving on the right might result in fewer pedestrian deaths due to sun glare patterns in a specific geography.

  **The Reply to the Student:**
  Lewis's arbitrariness condition is relative to the *coordination interest*, not relative to *all human values*. We can call gendered housework a "convention" in the Lewisian sense (people do it because they expect others to do it), but that doesn't mean the alternative arrangement is equal in terms of *welfare*, *justice*, or *happiness*. Lewis's theory explains the **stability** of the norm, not its **merit**. Calling it a convention explains *why it persists*, not *why it ought to persist*.

  ### 2. Coordination vs. Distribution (The Crucial Distinction)
  This is the most philosophically potent point you can make in class. Lewis's model is built on **coordination problems**, where agents have a common interest in coordinating (e.g., both want to meet, both want to avoid crashing).

  However, many oppressive social norms (like gendered housework) are not pure coordination problems; they are **distributional problems** or **bargaining problems** (often modeled as Battle of the Sexes or even Prisoner's Dilemmas).
  *   In a pure Lewisian convention, everyone prefers $R$ to non-coordination, and $R'$ to non-coordination.
  *   In gendered housework, it is often the case that one group (say, men) prefers the current equilibrium ($R$), while the other group (women) would prefer a different equilibrium ($R'$), even if both prefer *some* arrangement to chaos.

  **The Reply to the Student:**
  If a norm relies on one group subordinating their preferences to maintain the equilibrium, it stretches Lewis's definition. Lewis assumes a rough symmetry of interest in coordinating. If the "convention" benefits Group A at the expense of Group B, it isn't just a coordination equilibrium; it's a power equilibrium.
  *   **Point for class:** Lewis's theory is best at explaining *how* norms stick, not necessarily *which* norms stick when power is unequal. The student is right to feel uneasy applying Lewis to oppression, but the fault lies in applying a coordination model to a conflict model, not in Lewis's definition itself.

  ### 3. Normative Neutrality (Is vs. Ought)
  You mentioned you gave a hand-wavy "is/ought" response. You were actually on the right track! Lewis is doing **social ontology**, not **normative ethics**.

  *   **Analogy:** If a legal positivist says "This is a valid law because it was passed by the legislature," they are not saying "This is a just law." They are defining the conditions of *legality*, not *justice*.
  *   **Application:** Similarly, Lewis defines the conditions of *conventionality*. To say "This is a convention" is to say "This is a self-perpetuating expectation system." It leaves entirely open the question: "Is this a *good* convention?"

  **The Reply to the Student:**
  Labeling something a convention does not shield it from critique; it simply identifies the *mechanism* of its enforcement. In fact, identifying it as a convention (rather than, say, a biological necessity or a divine command) **opens** it to critique. If it's just a convention, we *can* change it. If it were "natural," we couldn't. So, paradoxically, the Lewisian analysis empowers critique by revealing the norm's contingency.

  ### 4. Rational Evolution and "Bad" Equilibria
  The student's second worry: *Does Lewis's picture predict stagnation? Can we move from a bad convention to a better one?*

  Lewis acknowledges that conventions can change. He discusses **precedent** and **salience**.
  *   **Pareto Improvements:** If there is an alternative convention $R'$ that *everyone* prefers to $R$ (a Pareto improvement), Lewis's model suggests agents can rationally coordinate on switching, provided they can communicate or find a new salient focal point.
  *   **The Transition Problem:** The difficulty isn't that the theory forbids change; it's that moving between equilibria often requires a temporary period of non-coordination (a "valley" in the payoff landscape). If I stop doing housework but you haven't started, we both lose utility in the short term.
  *   **Common Knowledge:** Change requires shifting common knowledge. If it becomes common knowledge that everyone *prefers* $R'$, the old convention loses its grip.

  **The Reply to the Student:**
  Lewis's account does not predict that whatever equilibrium we are in is "as good as it gets." It predicts that whatever equilibrium we are in is **stable** given current preferences and expectations. If preferences change (e.g., women enter the workforce and value leisure time more highly, or men value equality more highly), the payoff matrix changes, and the old convention may cease to be an equilibrium. Rational evolution is possible, but it requires a shift in preferences or a salient signal to coordinate the transition.

  ### Suggested Seminar Strategy
  Here is a way to structure the response for next week:

  1.  **Validate:** Start by telling the class the student's objection is excellent and connects to major debates in social philosophy.
  2.  **Define the Scope:** Remind them that Lewis is defining a *type of social reason*, not a *moral justification*. "Conventionality" $\neq$ "Justifiability."
  3.  **The Contingency Argument:** Argue that calling something a convention actually *helps* critique. If gendered norms are conventions, they are contingent. If they are contingent, they can be changed. The "arbitrariness" clause proves they don't have to be this way.
  4.  **The Power Critique:** Introduce the distinction between **Coordination** (Lewis) and **Bargaining/Distribution** (Ullmann-Margalit/Sugden). Ask the class: *Is the division of housework really a case where everyone just wants to match each other? Or does someone prefer one match over the other?* This shows the limits of Lewis's model without rejecting it.
  5.  **Dynamics:** Explain that conventions evolve when preferences change or when new salient signals emerge. The "stagnation" worry is real (network effects make change hard), but not impossible.

  ### Recommended Reading for the Student
  If you want to give the student something to chew on, point them toward:
  *   **Edna Ullmann-Margalit, *The Emergence of Norms* (1977):** Specifically her distinction between coordinating norms and summing norms.
  *   **Ann Cudd, *Analyzing Oppression* (2006):** She uses game theory to explain how oppressive norms function as conventions that are hard to escape, directly addressing the student's worry.
  *   **Robert Sugden, *The Economics of Rights, Co-operation and Welfare* (1986):** Extends Lewis to cases where interests conflict.

  **Summary for your prep:**
  The student is conflating **coordination-equivalence** with **value-equivalence**. Lewis says $R$ and $R'$ are equivalent *for the purpose of solving the coordination problem*. He does not say they are equivalent for the purpose of human flourishing. You can accept Lewis's definition of convention while simultaneously arguing that some conventions are unjust, oppressive, and ought to be replaced. In fact, Lewis's theory gives you the tools to explain *why* unjust conventions are so stubborn (because they are equilibria), which is the first step to dismantling them.
