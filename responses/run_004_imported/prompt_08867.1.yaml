prompt: |-
  I'm teaching Lewis's Convention again this term in my social philosophy seminar, and last week we got through all the coordination-problem stuff — common knowledge, the clause that says a regularity only counts as a convention if some other regularity would've worked just as well and could've gotten established instead. One of my sharper students cornered me after class with a worry that I fumbled in the moment and haven't been able to shake since, so I want to run it by you before I have to face her again next week.

  Her point was basically: if what makes something a convention, on Lewis's account, is exactly that its arbitrary in that sense — any of several equilibria would've done, we just happened to land on this one — then conventions are interchangeable by definition, and if they're interchangeable there's no standpoint left from which to say one is better or more justified than another. So take something like the expectation that women do most of the unpaid housework, or the old dress-code norms around gender — if that's a Lewis-style convention, kept in place by everyone expecting everyone else to keep conforming, doesn't calling it "a convention" in his technical sense actually shield it from being criticized as unjust, since by hypothesis some other arrangement would've worked equally well and his theory gives us no grounds to prefer one over the other? And she had a follow-up that I definately didn't handle well either: if conventions really are that arbitrary, is there any room in Lewis's picture for a population to rationally evolve away from a bad convention toward a better one, or does his account just predict that whatever equilibrium we're sitting in is as good as it gets? I said something hand-wavy about is and ought and moved on, but I'd like to actually get this right before the next session — can you help me sort out where, if anywhere, her reasoning goes wrong, and what the arbitrariness condition does and doesn't commit Lewis to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a philosophy professor teaching David Lewis's *Convention* in a social philosophy seminar.
      *   **The Problem:** A sharp student raised a critical objection regarding the normative implications of Lewis's definition of convention, specifically concerning the "arbitrariness" condition.
      *   **The Student's Objection (Two Parts):**
          1.  *Normative Shielding:* If conventions are arbitrary (alternative equilibria exist), doesn't labeling something a "convention" (like gendered housework) shield it from moral criticism? If Lewis's theory says "either works," does it imply "neither is better"?
          2.  *Dynamic Stagnation:* If conventions are arbitrary equilibria, is there room in Lewis's picture for rational evolution away from a "bad" convention to a "better" one? Or does the theory predict stagnation (whatever equilibrium we're in is stable)?
      *   **The User's Goal:** Wants to understand where the student's reasoning might go wrong (or where it's right but needs nuance), specifically regarding what the arbitrariness condition commits Lewis to, before the next class.
      *   **Tone:** Professional, academic, collegial, insightful. Needs to respect the student's insight while clarifying Lewis's actual position.

  2.  **Deconstruct the Student's Objection:**
      *   *Premise 1:* Lewisian conventions are arbitrary (alternative regularities could have solved the coordination problem).
      *   *Premise 2:* Therefore, conventions are interchangeable *in terms of coordination value*.
      *   *Conclusion 1:* Therefore, we cannot judge one convention as morally better than another *within Lewis's framework*. (The "Normative Shielding" worry).
      *   *Conclusion 2:* Therefore, populations cannot rationally move from a bad convention to a good one. (The "Dynamic Stagnation" worry).

  3.  **Evaluate Lewis's Actual Theory (*Convention: A Philosophical Study*, 1969):**
      *   *What is Arbitrariness?* It means there is at least one other possible regularity $R'$ that could have solved the *coordination problem* $S$ almost as well as $R$. It does *not* mean $R$ and $R'$ are identical in all respects, only in respect to solving $S$.
      *   *What is a Coordination Problem?* It's a situation where agents have common interests in coordinating. (Later, Lewis and others acknowledged conflict of interest cases, but strict Lewisian convention is about coordination).
      *   *Normativity:* Lewis is primarily doing descriptive metaphysics/social ontology, not normative ethics. He defines what a convention *is*, not whether it is *good*.
      *   *Welfare/Payoffs:* The payoffs in the coordination game represent the agents' preferences. If agents prefer $R'$ over $R$ (holding coordination constant), the game matrix changes.
      *   *Evolution/Change:* Lewis discusses how conventions change (shifts in expectations, salience, precedent).

  4.  **Address the "Normative Shielding" Objection:**
      *   *The Category Mistake:* The student is conflating *coordination efficiency* with *moral justice*. Lewis's "arbitrariness" is relative to the *coordination problem*, not relative to *all possible values*.
      *   *Example:* Driving on the left vs. right. Arbitrary regarding coordination. But if driving on the right causes more pedestrian deaths due to sun glare, it's not morally arbitrary, even if it's a convention.
      *   *Gendered Housework:* Is this a pure coordination problem? Likely not. It involves distribution of burdens/benefits. If women prefer equality and men prefer inequality, it's a *bargaining* problem (Ullmann-Margalit/Sugden), not a pure Lewisian coordination problem.
      *   *Lewis's Silence:* Lewis doesn't say conventions are immune to moral critique. He just says their *status as conventions* doesn't depend on their moral merit. Calling it a convention explains *why it persists*, not *why it ought to persist*.

  5.  **Address the "Dynamic Stagnation" Objection:**
      *   *Can conventions change?* Yes. Lewis acknowledges precedent can be overturned by new salience or changes in preferences.
      *   *Rational Evolution:* If everyone prefers $R'$ to $R$ (Pareto improvement), they can coordinate on switching. The problem is the transition cost (the "valley" between equilibria).
      *   *Common Knowledge:* If it becomes common knowledge that everyone prefers $R'$, the old convention loses its grip.
      *   *Limit:* If the convention benefits Group A at the expense of Group B, Group A won't agree to switch. This highlights that many "oppressive conventions" aren't pure Lewisian conventions but involve conflict of interest.

  6.  **Synthesize the Response Strategy:**
      *   **Validate the Student:** Acknowledge this is a classic and excellent objection (connects to feminist critiques, e.g., Ann Cudd, Ullmann-Margalit).
      *   **Clarify "Arbitrariness":** Distinguish between "arbitrary relative to coordination" vs. "arbitrary relative to welfare/justice."
      *   **Distinguish Coordination vs. Distribution:** This is the crucial philosophical move. Gendered norms often involve conflict, not just coordination. Lewis's model fits pure coordination best.
      *   **Normative Neutrality:** Lewis's theory is descriptive. It explains stability, not justification.
      *   **Mechanisms of Change:** Explain how Lewis allows for convention change (shifts in preferences, salience, precedent).
      *   **Suggested Reading:** Mention Ullmann-Margalit (*The Emergence of Norms*), Sugden (*The Economics of Rights, Co-operation and Welfare*), or Ann Cudd (*Analyzing Oppression*) for the student.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Opening:* Empathize with the professor. It's a tough spot. The student is right to press, but maybe drawing the wrong conclusion.
      *   *Point 1: The Scope of Arbitrariness.* Lewis means "arbitrary relative to the coordination interest." He doesn't mean "all consequences are equal."
      *   *Point 2: Coordination vs. Distribution.* The housework example is likely a mixed-motive game, not a pure coordination game. Lewis's definition technically excludes norms sustained by power/coercion where one side loses out.
      *   *Point 3: Normative Status.* Defining X doesn't justify X. "This is a law" $\neq$ "This is a just law." Same for conventions.
      *   *Point 4: Change.* Lewis allows for change if preferences shift or if a new signal becomes salient. But acknowledge the friction (network effects).
      *   *Closing:* Give the professor concrete talking points for the seminar.

  8.  **Refining the Tone:**
      *   Ensure I don't sound like I'm lecturing the professor. Use phrases like "You might remind the class," "One way to parse this," "Lewis's text suggests."
      *   Make sure to distinguish between Lewis's 1969 text and later developments (like game-theoretic social norms). Stick mostly to Lewis but acknowledge where the theory is often extended.

  9.  **Self-Correction/Nuance Check:**
      *   *Did Lewis talk about justice?* Not really in *Convention*. He was focused on meaning and social regularities.
      *   *Is the student wrong?* Not entirely. The student correctly identifies that Lewis's *definition* doesn't provide moral resources. The mistake is thinking Lewis *claimed* it did, or that the definition precludes external moral judgment.
      *   *The "Bad Equilibrium" problem:* Lewis acknowledges Pareto-inferior equilibria (e.g., Prisoner's Dilemma outcomes, though that's not coordination). In coordination, usually, equilibria are roughly equal *on coordination dimensions*, but might differ on distribution.
      *   *Key Distinction:* The arbitrariness condition is $R$ vs $R'$ solving problem $S$. It is not $R$ vs $R'$ regarding *all human values*.

  10. **Final Polish:** Organize into clear sections: Validation, The Arbitrariness Clause, Coordination vs. Distribution, Normative Neutrality, and Dynamics of Change. (Proceed to generate output based on this structure).

  *(Self-Correction during drafting)*: I should be careful not to say Lewis is *wrong* about gendered norms. Rather, Lewis's framework might be the *wrong tool* for analyzing gendered norms if they involve coercion or unequal power. This is a crucial distinction. The student is applying a coordination model to a potential exploitation model.

  *(Final Plan)*:
  1. Validate the student (it's a great objection).
  2. Clarify "Arbitrariness" (relative to coordination, not value).
  3. Distinguish Coordination vs. Distribution (the housework example likely isn't a pure Lewisian convention).
  4. Address Normativity (Descriptive vs. Prescriptive).
  5. Address Dynamics (How conventions change).
  6. Suggest further reading (Ullmann-Margalit, Cudd).
  7. Provide a "Lesson Plan" summary.

