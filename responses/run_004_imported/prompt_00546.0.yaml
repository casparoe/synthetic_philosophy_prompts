      *   *Tool 3: Regret Minimization & Identity.* Which version of themselves do they want to be? Not just "what is right," but "who am I?"
      *   *Tool 4: The "Oscillation" as Data.* Why does it flip? Is it stress? Is it exposure to news? Is it financial pressure? Identifying triggers helps clarify core values.

