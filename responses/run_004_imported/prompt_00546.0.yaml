prompt: |-
  So I've got a job offer that's been messing with my head for weeks. It's a really well-paid data science role at a defense contractor, basically building targeting software for drones. Part of me thinks: look, someone's gonna build this stuff whether I'm involved or not, and if I take the job maybe I can push for more accurate targeting that kills fewer civilians than if some less careful engineer does it instead - so net-net it's probably better if I'm the one in the seat. But another part of me feels like there's just something wrong with helping build a system whose whole purpose is to kill people, full stop, regardless of how the math on outcomes shakes out - like some lines shouldn't be crossed even if crossing them leads to marginally better consequences. The annoying part is I genuinely don't know which way of thinking about this I actually buy. Some days the outcomes-focused reasoning feels obviously right and the other view feels like squeamishness dressed up as principle. Other days it flips completely and the outcomes reasoning feels like a rationalization. I brought this up with a couple friends over drinks and they just said "go with your gut," which isn't super helpful since my gut keeps changing its mind depending on the day. My partner thinks I'm way overanalyzing what should be a simple decision, but it feels to me like the fact that I can't settle on which framework is correct is itself important information for how I should decide, not just a personal quirk I need to get over. How should I actually go about making this call given that I can't resolve which ethical theory is the right one to be using?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **The Dilemma:** A high-paying data science job at a defense contractor building drone targeting software.
      *   **The Conflict:** Consequentialism (utilitarianism) vs. Deontology (duty-based ethics).
          *   *Side A (Consequentialist):* "Someone will do it anyway; I can make it safer/more precise; net fewer civilian deaths."
          *   *Side B (Deontological):* "Building killing machines is inherently wrong; some lines shouldn't be crossed regardless of outcomes."
      *   **The Struggle:** The user oscillates between these views. Sometimes one feels right, sometimes the other. They feel the *inability to decide* is significant data, not just indecisiveness.
      *   **External Input:** Friends said "go with your gut" (unhelpful because the gut fluctuates). Partner says "stop overanalyzing" (dismisses the moral weight).
      *   **The Core Question:** How to make a decision when you can't resolve which ethical framework is correct?

  2.  **Validate the User's Experience:**
      *   Acknowledge the gravity of the decision. It's not a trivial career move; it's a moral identity question.
      *   Validate the partner's and friends' advice as well-meaning but insufficient for *this specific type* of problem.
      *   Affirm the user's insight: The *oscillation* itself is meaningful. It suggests a value conflict, not just uncertainty.

  3.  **Deconstruct the Ethical Frameworks (without taking sides):**
      *   *Consequentialist Argument:* The "Lesser Evil" or "Inside Job" argument. It relies on assumptions (Will I actually have influence? Will my version actually be safer? Is the net outcome calculable?).
      *   *Deontological Argument:* The "Complicity" argument. It relies on boundaries (Is my agency mine to surrender? Does participation legitimize the act?).
      *   *Key Insight:* The user is stuck because both frameworks have merit, and neither is definitively "true" in a vacuum. The decision isn't about finding the *True Ethics*, but about finding the *Livable Ethics* for *them*.

  4.  **Develop a Decision-Making Strategy for Moral Uncertainty:**
      *   Since we can't solve meta-ethics today, we need practical tools to navigate the uncertainty.
      *   *Tool 1: Interrogate the Consequentialist Assumptions.* The "I can make it better" argument often fails in practice. Why? Bureaucracy, clearance levels, mission creep. Ask the user to test the *feasibility* of their moral leverage.
