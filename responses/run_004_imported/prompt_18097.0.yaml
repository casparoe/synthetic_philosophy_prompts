      *   *What about Mikhail?* Mikhail explicitly tries to avoid moral realism. He says it's descriptive. Quine might respect the descriptive aim but question the "grammar" analogy. Grammar implies rules/rules-following. Quine has problems with "rules" too (Kripke's Wittgenstein angle, though Quine is different).
      *   *Key Distinction:* Quine separates *ethics* (normative) from *moral psychology* (descriptive). UMG is moral psychology. Quine would say: "Fine, study the psychology. But don't call it 'moral values' in the normative sense, and don't think it saves ethics from being non-cognitive."

