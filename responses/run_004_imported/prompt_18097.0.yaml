      *   **Core Question:** How would Quine react to the Universal Moral Grammar (UMG) research program? Would he attack it like he attacked Chomsky's linguistic nativism, or does the moral version dodge his objections?
      *   **Underlying Tensions:** Empiricism vs. Nativism, Objectivity in Science vs. Ethics, Sensory Periphery vs. Intuitive Judgments.

  2.  **Deconstruct Quine's Positions:**
      *   **Epistemology (Naturalized):** Knowledge comes from sensory stimulation hitting our "periphery." There is no first philosophy; science is the measure of what exists.
      *   **Ethics ("On the Nature of Moral Values"):** Moral statements lack cognitive content in the scientific sense. They don't predict sensory stimuli. They are expressions of sentiment or social conditioning. They cannot be "objective" in the way physics is because there's no empirical check.
      *   **Language (vs. Chomsky):** Quine was a behaviorist/empiricist about language learning (*Word and Object*). He rejected rich innate structures (LAD/UG). He favored general-purpose learning mechanisms (conditioning, induction, analogy). He thought positing innate ideas was an unnecessary multiplication of entities (Occam's Razor) unless empirically forced.

  3.  **Deconstruct Universal Moral Grammar (UMG):**
      *   **Proponents:** Marc Hauser, John Mikhail (influenced by Rawls' "moral sense" and Chomsky's linguistics).
      *   **Core Claim:** Humans have an innate, unconscious computational system for morality (like language). It generates intuitive judgments about right/wrong based on structural principles (e.g., doctrine of double effect).
      *   **Methodology:** Trolley problems, cross-cultural studies, developmental psychology.
      *   **Goal:** To explain the *structure* of moral judgment, not necessarily to prove moral *realism* (though it often flirts with it).

  4.  **Synthesize: Quine vs. UMG:**
      *   **Point of Conflict 1: Nativism.** Quine hated innate ideas. UMG is *built* on innate ideas. Quine would definitely push back on the "innate" claim, just as he did with Chomsky. He'd ask for behavioral evidence that can't be explained by general learning.
      *   **Point of Conflict 2: Objectivity/Truth.** Quine thinks moral claims aren't truth-apt in the scientific sense. UMG tries to treat moral judgments like grammaticality judgments. But for Quine, grammaticality is about linguistic competence (which he was skeptical of as an innate module), whereas morality is about *values*. Even if we have an innate *mechanism* for producing judgments, that doesn't make the *values* objective.
      *   **Point of Conflict 3: The "Sensory Periphery".** For Quine, science checks against the world. UMG checks against *intuitions*. Quine would argue intuitions are just more neural stimulations, not evidence of moral facts.
      *   **Potential Nuance:** Quine was a *naturalist*. If neuroscience *proved* a specific moral module exists, Quine might accept the *causal* story (we are wired this way) but still deny the *normative* authority (this wiring doesn't make it *right*).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's a great connection between Quine's metaethics and his philosophy of mind/language.
      *   *The Chomsky Parallel:* Start here because it's the strongest link. Quine's critique of UG was about poverty of the stimulus and Occam's Razor. He'd apply the same to UMG. "Do we *need* innate moral principles to explain behavior, or can conditioning/socialization do it?"
      *   *The Ethical Dimension:* This is where UMG tries to dodge. UMG says "We aren't saying morality is *true*, just that we process it like language." Quine would say: "If it's not truth-apt, why posit a grammar?" He distinguishes between *descriptive* psychology and *normative* ethics. UMG blurs this. Quine would sharpen it.
      *   *The "Sensory Periphery" Issue:* In "On the Nature of Moral Values," Quine says ethics lacks empirical checkpoints. UMG uses intuitions as data. Quine would call intuitions just "irritations of our sensory surfaces" caused by culture/biology, not evidence of moral reality.
      *   *Naturalism:* Quine might accept UMG as a *scientific hypothesis* about brain structure (naturalized ethics), but he would reject it as a foundation for *moral objectivity*. It explains why we *think* things are wrong, not why they *are* wrong.
      *   *Conclusion:* He wouldn't be impressed. He'd see it as a category mistake or an unnecessary posit.

  6.  **Refining the Argument (Self-Correction/Nuance):**
