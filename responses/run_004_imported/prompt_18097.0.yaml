answer: |-
  This is a fantastic question. You have correctly identified the two pressure points in Quine's system that would bear down on the Universal Moral Grammar (UMG) program: his **empiricist skepticism of innate structures** (from the Chomsky debate) and his **non-cognitivist/naturalist view of ethics** (from *On the Nature of Moral Values*).

  If Quine were alive to review the work of Hauser, Mikhail, and the UMG program, he would almost certainly tear into it. In fact, he might find the moral-grammar hypothesis even *more* suspect than Chomsky's linguistic nativism.

  Here is how Quine would likely dismantle the UMG program, structured around the two lines of argument you identified.

  ### 1. The Nativism Objection: "Poverty of the Stimulus" for Morality?
  Quine's primary beef with Chomsky was methodological and ontological. Quine was a committed empiricist who believed in **Occam's Razor**: do not multiply entities beyond necessity. He argued that Chomsky's claim—that children could not learn language from sensory input alone and therefore must have a rich, innate Language Acquisition Device (LAD)—was premature. Quine favored "general-purpose conditioning." He thought we could explain language learning through behavioral reinforcement, analogy, and induction without positing a specialized, innate syntactic module.

  Quine would apply this exact same razor to UMG.

  *   **The Challenge:** Hauser and Mikhail argue that the speed and uniformity of moral judgments (e.g., in Trolley Problems) imply an innate "moral organ." Quine would ask: **Is the stimulus really that poor?**
  *   **Quine's Counter:** Quine would argue that moral intuitions are the result of massive, subtle social conditioning starting from infancy. We are rewarded for sharing, punished for hitting, and acculturated into norms long before we can articulate them. To Quine, positing an innate "moral syntax" is a "myth of a mental faculty" similar to the "myth of the museum" he criticized in *Word and Object*.
  *   **The Verdict:** He would view UMG as an unnecessary posit. Why invent a specialized moral module when general-purpose learning mechanisms (association, empathy conditioning, social reinforcement) can explain the data? He would accuse UMG proponents of doing "armchair psychology" rather than sticking to observable behavioral conditioning.

  ### 2. The Metaethical Objection: No "Sensory Periphery" for Morality
  This is where your reference to *On the Nature of Moral Values* becomes crucial. In that essay, Quine argues that scientific statements are objective because they are tethered to the **sensory periphery**. If I say "There is a rabbit," I can check my sensory stimuli. If I say "Stealing is wrong," there is no sensory stimulation that confirms or falsifies that claim. Therefore, moral statements lack the cognitive content of scientific statements; they are expressions of sentiment or social policy.

  UMG tries to bypass this by saying: *"We aren't claiming moral realism. We are just claiming humans process moral judgments like grammatical sentences."* They treat moral intuitions as data points, similar to linguistic grammaticality judgments.

  Quine would not let them off the hook that easily.

  *   **The Category Mistake:** For Quine, linguistic grammaticality is about **communication** and **structure**, which are observable behaviors. Moral "grammaticality" is about **value**. Even if you prove we have an innate mechanism that spits out "The trolley switch is permissible," Quine would ask: **What is the causal link to the world?**
  *   **Intuitions are not Evidence:** In science, observations check theories. In UMG, "intuitions" check moral principles. But for Quine, an intuition is just another neural irritation. It has no more normative authority than a craving for sugar. To build a "grammar" out of intuitions is to build a castle on a cloud. It explains why we *feel* something is wrong, but it doesn't explain why it *is* wrong.
  *   **The Objectivity Trap:** Quine would argue that UMG smuggles objectivity in through the back door. By calling it a "grammar," Hauser and Mikhail imply a structural correctness (like a sentence being ungrammatical). But for Quine, moral "correctness" is just social conformity. A "moral grammar" is just a codification of local tribal taboos, not a universal logic.

  ### 3. The Naturalist Concession (Where Quine Might Pause)
  There is one area where Quine might offer a grudging nod, and that is his **Naturalized Epistemology**. Quine believed philosophy should be continuous with science. If neuroscience actually found a specific brain module that lit up during deontological judgments, Quine (the naturalist) would have to accept the *existence* of that mechanism.

  However, he would strictly compartmentalize it:
  1.  **As Psychology:** It is a valid scientific hypothesis about human neural wiring.
  2.  **As Ethics:** It is irrelevant to the truth of moral claims.

  He would say: "Fine, you have found a causal mechanism for why humans *say* pushing the fat man is wrong. But you have not shown that pushing the fat man *is* wrong. You have naturalized the *feeling* of morality, but you have not naturalized *moral value*."

  ### 4. Why UMG Might Be Worse Than Chomsky to Quine
  Paradoxically, Quine might be harder on UMG than he was on Chomsky.
  *   **Language** has a clear evolutionary function (communication) and observable output (speech).
  *   **Morality**, for Quine, is fundamentally about **sentiment** and **social cohesion**.

  Quine might argue that language *needs* structure to function, but morality *needs* flexibility to adapt to social changes. Positing a rigid "moral syntax" freezes moral progress. If our "moral grammar" says slavery is permissible (as it did for many cultures historically), UMG treats that as a valid output of the system. Quine, who viewed ethics as a tool for social betterment, would find the idea of an innate, unchangeable moral syntax politically and philosophically dangerous.

  ### Summary of Quine's Likely Critique
  If Quine were in your seminar, his critique would look like this:

  1.  **Ontological Extravagance:** You are positing innate structures without ruling out general-purpose conditioning (The Chomsky Objection).
  2.  **Lack of Empirical Check:** Your "data" (intuitions) are not tethered to the sensory periphery, so they cannot support objective claims (The *Nature of Moral Values* Objection).
  3.  **Confusion of Is and Ought:** You are describing a psychological mechanism (is) but calling it a grammar of value (ought).
  4.  **Verdict:** UMG is a fascinating piece of **descriptive psychology**, but it is a failure as **metaethics**. It does not save morality from being non-cognitive, nor does it prove the existence of innate moral truths.

  He would likely conclude that the UMG program is a sophisticated attempt to legitimize moral intuitions as "scientific data," but that it ultimately fails to bridge the gap between **neural wiring** and **moral validity**. For Quine, knowing *why* we judge doesn't tell us *how* we should judge.
