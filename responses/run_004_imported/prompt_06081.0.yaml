prompt: |-
  I sit on the student conduct board at my university, which adjudicates academic-integrity cases referred by faculty and staff; I joined this year, and the matter below is the first contested hearing I've had to help resolve. A graduate teaching assistant has filed a complaint against an undergraduate, alleging that several paragraphs of her term paper were copied nearly verbatim from an online study guide, and the copying itself is not seriously disputed. Partway through the hearing, the student's faculty advisor disclosed, and the TA confirmed under questioning, that the TA himself was found responsible for a very similar plagiarism violation as an undergraduate at another institution eight years ago. That finding was fully adjudicated and, per the other institution's policy, expunged from his record after he completed a semester of probation; he did not volunteer this history when he took on the TA role, though nothing in our policies required him to. The board is now split roughly in half: some members think this history disqualifies him from bringing the complaint at all, or at least so compromises the proceeding that the case should be dismissed or any sanction sharply reduced, while others think the student's guilt is a separate question from the TA's past, and that giving the past any weight would effectively let students escape sanction whenever their accuser turns out to be imperfect, expunged record or not. Our bylaws state who may file a complaint but say nothing about whether a complainant's own disciplinary history bears on how a complaint should be handled.

  Please draft the written decision I will circulate to the full board before we reconvene next week, and eventually to both parties. It should reach a concrete disposition of the plagiarism case itself, including any sanction or lack thereof; a concrete disposition of what, if anything, follows from the TA's history and non-disclosure, and on what timeline; and reasoning specific enough that a skeptical board member could follow it point by point and push back on any step. In particular, take seriously the strongest version of the view that the TA's history is relevant to how this case should proceed -- not the strawman that his past makes him a liar -- even if your recommendation ultimately gives that view little or no weight.
reasoning: |-
  Here's a thinking process that leads to the suggested decision draft:

  1.  **Analyze the Request:**
      *   **Role:** Student Conduct Board Member (new member).
      *   **Task:** Draft a written decision to circulate to the full board (before reconvening) and eventually to both parties (TA and Undergraduate).
      *   **Case:** Undergraduate accused of plagiarism by Graduate TA. Plagiarism is largely undisputed.
      *   **Complication:** TA has a past plagiarism violation (expunged) from another institution as an undergrad, revealed during the hearing. TA didn't volunteer this info (not required by policy).
      *   **Board Split:** Half think TA's history disqualifies him/compromises the case (dismiss/reduce sanction). Half think student's guilt is separate (sanction based on evidence).
      *   **Bylaws:** Silent on whether complainant's disciplinary history matters.
      *   **Requirements:**
          *   Concrete disposition of the plagiarism case (guilt/sanction).
          *   Concrete disposition of the TA's history/non-disclosure (action/timeline).
          *   Reasoning specific enough for skeptical board members to follow and critique.
          *   Take the "TA history is relevant" argument seriously (steelman it), even if ultimately giving it little weight.
          *   Tone: Formal, judicial, fair, reasoned.

  2.  **Determine the Stance/Outcome:**
      *   *Plagiarism Case:* The prompt states the copying is "not seriously disputed." Academic integrity policies usually focus on the act, not the accuser. Dismissing a valid violation because the accuser sinned before sets a dangerous precedent ("tu quoque" fallacy). *Decision: Responsible.*
      *   *Sanction:* Needs to be proportional. Since it's a first offense for the undergrad (presumably, though not stated, usually assumed unless noted), standard sanctions apply. Mitigation based on TA's history? Minimal to none, as the act is the focus.
      *   *TA's History:* He wasn't required to disclose. Expunged means it's treated as if it didn't happen for most purposes. However, the *appearance* of bias or hypocrisy is real. Does it disqualify him? No, unless policy says so. Does it warrant action? Maybe a review of TA training or ethics, but not punishment for non-disclosure. *Decision: No sanction for TA, but acknowledge the tension.*
      *   *Reasoning:* Must address the "Clean Hands" doctrine argument (that one coming to equity must come with clean hands) and explain why it doesn't apply here (administrative/educational vs. legal/equitable).

  3.  **Structure of the Decision:**
      *   **Header:** Standard formal memo format.
      *   **Introduction:** Context, role of the document.
      *   **Findings of Fact:** What happened (Plagiarism, TA's history).
      *   **Analysis I: The Undergraduate's Responsibility:** Address the plagiarism charge directly. Address the "Tu Quoque" argument seriously.
      *   **Analysis II: The TA's Status and Disclosure:** Address the non-disclosure and the expunged record.
      *   **Disposition/Ruling:** Specific sanctions and actions.
      *   **Conclusion:** Final thoughts on integrity.

  4.  **Drafting - Section by Section:**

      *   *Header:* To: Conduct Board; From: [My Name]; Date; Re: Case #...
      *   *Intro:* State purpose (draft decision for review).
      *   *Facts:* Keep it neutral. Undergraduate copied. TA accused. TA has past record (expunged).
      *   *Analysis I (The Core Conflict):*
          *   *Argument for Dismissal/Mitigation:* The "Clean Hands" doctrine. If the enforcer is a violator, the moral authority is undermined. It looks like hypocrisy. It might chill reporting if TAs fear their own pasts being dug up. It creates a power imbalance where the TA holds moral leverage they don't deserve.
          *   *Counter-Argument:* Academic integrity is objective. The truth of the plagiarism doesn't change based on who points it out. Expungement policies exist to allow rehabilitation; using the past against the TA undermines that, but using the TA's past to free the student undermines the integrity system. The standard is "preponderance of evidence" regarding the *student's* act.
          *   *Resolution:* The student's act is the subject of the hearing. The TA is a witness/complainant, not the judge. The Board is the judge. Therefore, the TA's character is less relevant than the evidence.
      *   *Analysis II (TA's Disclosure):*
          *   Policy didn't require it. Expungement implies privacy. Punishing non-disclosure would penalize reliance on policy. However, the *perception* issue is real.
          *   *Action:* No sanction for TA. But recommend a policy review regarding TA disclosures (future-looking).
      *   *Disposition:*
          *   Student: Responsible. Sanction (e.g., F on paper, educational module).
          *   TA: No action.
          *   Board: Policy review recommendation.

  5.  **Refining the Tone and Argument (Self-Correction):**
      *   *Critique:* Is this too harsh on the student?
      *   *Fix:* Ensure the sanction is educational, not just punitive. Acknowledge the awkwardness.
      *   *Critique:* Did I steelman the "TA history matters" argument enough?
      *   *Fix:* Dedicate a specific subsection to "The Argument for Procedural Dismissal or Mitigation." Acknowledge that in *some* contexts (e.g., witness credibility in criminal law), prior dishonesty matters. Here, the TA isn't the sole evidence (Turnitin, side-by-side comparison), so credibility is less pivotal.
      *   *Critique:* Is the distinction between the Board's role and the TA's role clear?
      *   *Fix:* Emphasize that the Board adjudicates, the TA reports. The Board's independence cures the TA's potential bias.

  6.  **Final Polish:**
      *   Check constraints: "Concrete disposition," "Timeline," "Reasoning specific enough."
      *   Ensure the "expunged" nature is respected. We can't treat it as a current violation for the TA.
      *   Make sure it sounds like a draft for colleagues, not just a final verdict (inviting feedback).

  7.  **Final Review against Prompt:**
      *   Draft written decision? Yes.
      *   Circulate to full board/both parties? Yes (tone should be appropriate for both).
      *   Concrete disposition of plagiarism? Yes (Responsible).
      *   Concrete disposition of TA history? Yes (No sanction, policy review).
      *   Reasoning specific/step-by-step? Yes.
      *   Steelman the opposing view? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to make this sound *too* much like a final verdict if it's circulating to the board *before* reconvening. It should be a "Proposed Findings and Recommendations" memo that serves as the basis for the final vote, but written with the authority of a final decision so it can be adapted. Actually, the prompt asks for the "written decision I will circulate... before we reconvene... and eventually to both parties." This implies it's a draft of the *final* decision, intended to guide the board's discussion. I will frame it as a "Draft Decision Memorandum."

  *Wait, one nuance:* The prompt says "eventually to both parties." This means the language must be formal enough for the students but also address the board's internal debate. I will structure it as a formal Board Opinion that is currently in draft form for board review.

  *Key Legal/Policy Concept:* The "Clean Hands" doctrine. I need to explicitly mention why it applies or doesn't. In administrative law, it usually doesn't apply to statutory duties. Reporting academic misconduct is often a duty.

  *Sanction:* Since the student copied "nearly verbatim," a failing grade on the assignment is standard. Maybe a course failure if the university is strict, but let's stick to assignment failure + educational sanction for a first offense.

  *TA Action:* Since the record is expunged and disclosure wasn't required, no sanction. But the *appearance* of conflict is an institutional risk. Recommend a review of TA hiring/onboarding guidelines.

  *Timeline:* Decision effective immediately upon board vote. Policy review within 30 days.

