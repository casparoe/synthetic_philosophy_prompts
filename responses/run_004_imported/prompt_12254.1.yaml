      *   **(3) Walt's Counter:** "Firing Squad Analogy."
          *   *Analysis:* Classic Leslie analogy. Distinguishes between "necessary condition for observation" and "evidence for a specific hypothesis."
          *   *Verdict:* Walt wins this exchange. The WAP blocks *surprise* but doesn't block *inference*. The firing squad survivor *should* infer something fishy.
      *   **(4) Fran's Counter:** "Inverse Gambler's Fallacy (IGF)."
          *   *Analysis:* Ian Hacking's objection. Inferring many trials from one lucky outcome.
