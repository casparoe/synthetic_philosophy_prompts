  ### The Scenario: The Nihilist Clockmaker

  Elias Thorne is a master horologist commissioned to build the timing mechanism for the backup generator of a rural hospital. This generator is the last line of defense for patients on life support during power outages. If the timing mechanism fails, the generator will not engage, and patients will die.

  Elias is a thoroughgoing moral nihilist. He believes that concepts like "moral duty," "obligation," and "the sanctity of life" are linguistic fictions with no grounding in reality. However, Elias possesses a fanatical devotion to *Horological Integrity*. He believes that a clock is a promise made to Time itself, and that any mechanism prone to failure is an abomination, a lie told in metal and gears. To Elias, precision is the only virtue; reliability is the only law.

  The contract for the hospital generator allows for a cheaper, standard-grade component that has a 99% success rate. Most engineers would accept this. Elias, however, is disgusted by the 1% risk of failure. It offends his sense of Horological Integrity. He secretly absorbs the cost to install a military-grade component with a near-perfect reliability record, ensuring the patients' safety. He does this not because he cares about the patients (whom he views as abstract biological units) nor because he thinks he has a moral duty to save them (since he denies morality exists). He does it solely because a 99% reliable clock is an ugly, dishonest thing.

  ### The Verdicts

  **1. The Kantian Verdict: No Moral Worth**
  For the Kantian, Elias's action lacks moral worth entirely. While the action is *in accordance with duty* (it saves lives, which is what morality would require), it is not performed *from duty*. Kant argues that moral worth arises only when the moral law itself is the sufficient motive for the will. Elias is motivated by a non-moral inclination: his obsession with aesthetic and functional perfection in clockmaking.

  Furthermore, Elias explicitly rejects the authority of the moral law. He does not recognize the patients' right to life as a binding constraint on his actions. For Kant, acting from a contingent passion (even a noble-sounding one like "Integrity") is heteronomous, not autonomous. Because Elias's will is determined by his love of clocks rather than his reverence for the moral law, his action possesses legality but no morality. He is, in Kant's eyes, no better than the shopkeeper who charges fair prices only to maintain a good reputation.

  **2. The Arpaly ("De Re") Verdict: Moral Worth Confirmed**
  On Arpaly's view, Elias's action possesses significant moral worth. Arpaly argues that moral worth is a matter of being responsive to the *right-making features* of an action—the facts that actually make the action morally correct. In this case, the right-making feature is the preservation of human life and the prevention of catastrophic harm.

  Elias is exquisitely sensitive to this feature. He recognizes the risk of death (mechanical failure) and acts to eliminate it. The fact that he conceptualizes this requirement under the description "Horological Integrity" rather than "Moral Duty" is irrelevant to the *de re* (of the thing) nature of his responsiveness. He is tracking the moral truth (that these lives should be saved) even if he lacks the *de dicto* (of the description) moral vocabulary to acknowledge it. Like Huck Finn, who helps Jim while believing he is sinning, Elias saves lives while believing morality is a fiction. In both cases, the agent's actions align with the moral good through a deep responsiveness to the relevant facts, warranting moral credit.

  ### Evaluation: Defending the "De Re" View

  I find Arpaly's "de re" account more defensible than the strict Kantian view, primarily because it avoids the problem of **moral fetishism**.

  The Kantian view risks conflating moral worth with moral self-awareness. It suggests that what matters most is not the good itself, but the agent's internal recognition of the *concept* of the good. This leads to the counterintuitive conclusion that a cold, calculated agent who forces themselves to do the right thing solely because "it is the rule" is morally superior to a compassionate agent (or a precision-obsessed one) who achieves the same good through a different motivational structure. This creates a alienated picture of morality, where the value of the action is severed from the value of the outcome and the agent's actual sensitivity to the world.

  Arpaly's view, by contrast, anchors moral worth in the agent's relationship to moral reality. If morality is about responding to reasons (such as the suffering of others or the value of life), then an agent who responds to those reasons—even if they label them "aesthetic," "prudential," or "professional"—is functioning as a moral agent ought to function. Elias's obsession with reliability makes him a reliable protector of human life. To deny him moral worth because he doesn't speak the language of "duty" is to privilege moral taxonomy over moral substance.

  Furthermore, the "de re" view better accommodates moral growth and diversity. Many people arrive at moral truths through non-moral pathways (e.g., a soldier learning the value of peace through the horror of war, or a clockmaker learning the value of life through the necessity of reliability). The Kantian view must dismiss these agents as lacking moral worth until they undergo a conversion to duty-based reasoning. Arpaly's view allows us to credit them for their alignment with the good, acknowledging that moral worth is found in the quality of one's responsiveness to the world, not merely in the purity of one's internal moral categorization.
