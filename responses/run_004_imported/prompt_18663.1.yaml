prompt: |-
  A friend of mine is extremely confident in her ability to size up new acquaintances within minutes of meeting them, and she has recently started acting on that confidence in a fairly consequential way, using her snap judgments to decide which people to bring on as partners in a small business she is starting. When I asked how she knows her instincts can be trusted, she explained that she has been informally tracking this for years: the people she pegged early on as dependable have, in the great majority of cases, gone on to prove dependable, while the ones she distrusted have gone on to reveal themselves as flaky or dishonest, and this track record is what convinces her that her snap judgments are sound. The complication is that when I pressed her on how she decided, after the fact, whether someone had "proven" dependable or not, it turned out that this determination was almost always just her own later impression of the person, rather than anything checked against an independent record, such as a background check, a mutual acquaintance's account, or some hard outcome that did not simply come down to her own read of the situation.

  Something about this reasoning nags at me, even though each step she describes sounds sensible taken on its own, and I have had trouble pinning down exactly what, if anything, is wrong with the overall argument. I am not looking for generic advice about learning to trust one's gut; I would like to know whether there is a genuine flaw in the structure of how she is arguing for her own reliability here, and if so, what that flaw is.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Scenario:** A friend believes she has excellent intuition about people (specifically regarding dependability/honesty) based on snap judgments. She uses this to select business partners.
      *   **Evidence:** She claims a track record: people she liked early on turned out dependable; people she disliked turned out flaky/dishonest.
      *   **The Catch:** Her assessment of whether someone *actually* turned out that way is based *only* on her own later impressions, not independent verification (background checks, hard outcomes, third-party accounts).
      *   **User's Goal:** Identify if there is a structural flaw in the friend's reasoning/argument for her own reliability. The user isn't asking for generic advice but a specific logical/epistemological critique.

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise 1:* I make initial judgments about people (Input).
      *   *Premise 2:* I later observe whether those people were actually dependable or not (Output/Verification).
      *   *Observation:* Input matches Output most of the time.
      *   *Conclusion:* My initial judgments are accurate/reliable.

  3.  **Identify the Core Logical Flaw:**
      *   The Verification (Premise 2) is not independent of the Input (Premise 1).
      *   She is using the *same measurement tool* (her impression/judgment) to validate *itself*.
      *   This is circular reasoning. Specifically, it's a form of **Confirmation Bias** fueled by **Self-Fulfilling Prophecy** and **Lack of Independent Verification**.
      *   In scientific terms, there is no "Ground Truth." She is calibrating a ruler by measuring itself.

  4.  **Brainstorm Specific Cognitive Biases/Logical Fallacies:**
      *   *Circular Reasoning (Begging the Question):* "I'm right because I say I'm right."
      *   *Confirmation Bias:* Remembering hits, forgetting misses.
      *   *Self-Fulfilling Prophecy:* If she treats someone as dependable, they act dependable. If she treats them as flaky, she distances herself, or they react negatively.
      *   *Hindsight Bias:* Reinterpreting early signals to match later outcomes (or vice versa).
      *   *Selection Bias:* She only tracks people she keeps in her orbit.
      *   *Fundamental Attribution Error:* Attributing behavior to character rather than situation (though less central here).

  5.  **Develop the Argument Structure for the Response:**
      *   **Validate the User:** Acknowledge that their "nagging" feeling is correct. There *is* a major flaw.
      *   **Name the Flaw:** Identify it clearly (Circular Reasoning / Lack of Independent Verification).
      *   **Explain the Mechanism:** How does this actually play out psychologically?
          *   *The Feedback Loop:* Her initial judgment influences her behavior, which influences the outcome.
          *   *Interpretation:* She interprets ambiguous behavior through the lens of her initial judgment.
      *   **Provide Concrete Examples:** Illustrate how a "dependable" label might be self-fulfilling vs. how a "flaky" label might be self-sabotaging.
      *   **Discuss the Business Risk:** Why is this dangerous specifically for *business partners*? (High stakes, need for objective metrics).
      *   **Suggest a Test (Optional but helpful):** How could she *actually* test this? (Blind trials, objective metrics).

  6.  **Refine the Analysis (Self-Correction/Nuance):**
      *   *Is intuition always wrong?* No. Intuition is often pattern recognition. The problem isn't the intuition itself; it's the *validation method*.
      *   *Make sure not to sound condescending.* The friend isn't necessarily stupid; this is a common human cognitive trap.
      *   *Focus on the "Tracking" aspect.* The user specifically mentioned she "informally tracked this." The flaw is in the data collection methodology.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Key Concept:* **Epistemic Circularity.** She is the sole source of both the hypothesis and the data.
      *   *Key Concept:* **Observer Effect.** Her observation changes the reality.
      *   *Key Concept:* **Confirmation Bias.** She likely forgets the times she was wrong because they didn't fit the narrative.
      *   *Analogy:* A weather forecaster who says "I predicted rain" and then defines "rain" as "any time I felt like it was wet."

  8.  **Final Polish:**
      *   Structure with clear headings.
      *   Ensure the tone is analytical and supportive of the user's skepticism.
      *   Highlight the specific danger in the *business context* (consequential decisions).

  9.  **Final Review against constraints:**
      *   Did I answer the specific question? Yes (Is there a flaw? What is it?).
