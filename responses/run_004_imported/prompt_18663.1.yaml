  **(Self-Correction during drafting):** I need to make sure I distinguish between "she is wrong" and "her *proof* is invalid." She might actually be good at reading people. But her *argument* that she is good, based on this tracking, is logically unsound. I must emphasize that distinction. The validity of the claim is unknown; the validity of the *evidence* is nil.

