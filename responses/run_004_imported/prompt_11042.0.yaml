answer: |-
  **MEMORANDUM**

  **TO:** Justice [Name]
  **FROM:** [Your Name], Law Clerk
  **DATE:** October 26, 2023
  **RE:** *Doe v. Genecare Clinic* – Wrongful Life Claim and the Benatar Asymmetry Argument

  **QUESTION PRESENTED**

  Whether this Court should recognize a common-law cause of action for "wrongful life," wherein a child born with severe genetic impairments seeks damages for being born rather than not existing, specifically where the plaintiff relies on the philosophical "asymmetry argument" to establish cognizable harm despite the impossibility of comparing existence to non-existence.

  **BRIEF ANSWER**

  I recommend we **affirm the lower court's dismissal** and decline to recognize the tort of wrongful life.

  While the plaintiff's invocation of David Benatar's asymmetry argument is philosophically coherent, it is ill-suited for adoption as a legal standard for tort liability. Adopting this theory would require the Court to establish a baseline of non-existence as a preferable legal state, contradicting the fundamental legal presumption that life is a benefit. Furthermore, recognizing this claim raises profound public policy concerns regarding the valuation of disabled lives and intrudes upon areas better suited for legislative resolution. The parents retain a viable claim for "wrongful birth" to recover economic damages, rendering judicial innovation on behalf of the child unnecessary.

  **FACTUAL BACKGROUND**

  Plaintiff, a minor child represented by a guardian ad litem, was born with [Severe Degenerative Genetic Disorder]. The condition is painful, progressive, and significantly limits life expectancy and cognitive function. Plaintiff alleges that Defendant, a prenatal clinician, negligently failed to detect the disorder during standard screening. Had the disorder been identified, Plaintiff's parents state they would have terminated the pregnancy.

  Plaintiff does not sue for the costs of her care (which are sought by the parents in a companion "wrongful birth" action). Instead, she sues for general damages alleging that her very existence constitutes a legally cognizable injury. The trial court dismissed the claim, citing the majority rule that damages cannot be calculated because there is no baseline for non-existence.

  **LEGAL BACKGROUND**

  **1. Wrongful Birth vs. Wrongful Life**
  Most jurisdictions, including ours, recognize "wrongful birth." This allows parents to recover the extraordinary costs of raising a disabled child when a clinician's negligence deprives them of the choice to terminate. However, "wrongful life" claims brought on behalf of the child are almost universally rejected. See, e.g., *Procanik v. Cillo*, 97 N.J. 339 (1984); *Turpin v. Sortini*, 31 Cal. 3d 220 (1982) (allowing only special damages, rejecting general damages for being born).

  **2. The Traditional Bar: The Baseline Problem**
  The traditional rationale for rejecting wrongful life claims is the impossibility of calculating damages. Tort law requires comparing the plaintiff's injured state to the state they would have occupied but for the negligence. In wrongful life, the alternative to impaired existence is non-existence. Courts have consistently held that they cannot weigh an impaired life against never having been born, as non-existence offers no subject to experience the "benefit" of not being born.

  **3. The Plaintiff's Argument: Benatar's Asymmetry**
  Plaintiff's brief attempts to solve the baseline problem using David Benatar's "asymmetry argument" from *Better Never to Have Been* (2006). The argument posits:
  *   (A) The presence of pain is bad for the sufferer.
  *   (B) The absence of pleasure is not bad for someone who never exists (because there is no one to be deprived).
  *   Therefore, coming into existence with severe suffering is a net harm, even without a coherent comparison class, because the "loss" of non-existence is not a loss to anyone.

  Plaintiff argues this philosophical framework provides the logical bridge courts have found missing, allowing us to declare existence a harm without needing to imagine a happy non-existent person.

  **ANALYSIS**

  **I. Adopting the Benatar Theory Would Commit the Court to a Radical Metaphysical Stance**

  To rule for the Plaintiff, we must accept that non-existence is a preferable legal baseline to impaired existence. While Benatar's logic is internally consistent within antinatalist philosophy, adopting it as law carries significant consequences:

  *   **Presumption of Life:** Our legal system is predicated on the presumption that life is a benefit. Statutes regarding inheritance, wrongful death, and criminal law all assume existence is preferable to non-existence. Accepting the asymmetry argument for tort purposes would create a fractured jurisprudence where life is a benefit in one context and a harm in another.
  *   **Judicial Competence:** Tort law is designed to remedy injuries between existing persons. It is not designed to adjudicate the metaphysical value of existence itself. By adopting Benatar's asymmetry, the Court would effectively be endorsing a specific philosophical school of thought regarding the ethics of procreation. This exceeds the institutional competence of the judiciary.
  *   **The "Comparison" Remains:** Even with Benatar's asymmetry, the legal calculation of damages requires a comparison. If the injury is "being born," the damages must reflect the difference between "being born" and "not being born." Benatar explains *why* it is a harm, but he does not provide a metric for *how much* harm. A jury would still be asked to quantify the value of non-existence, which remains an impossible task.

  **II. Public Policy Concerns Outweigh Theoretical Coherence**

  Even if the harm is philosophically cognizable, public policy reasons strongly counsel against recognizing this tort.

  *   **Devaluation of Disabled Lives:** Recognizing that a child can claim damages for being born disabled implies that their life is a legal injury. This risks stigmatizing individuals with disabilities as "damaged goods." It suggests that some lives are not worth living, a determination courts are ill-equipped to make and which contradicts the ethos of the Americans with Disabilities Act and state civil rights laws.
  *   **Slippery Slope:** If severe genetic disorders justify a wrongful life claim, where is the line drawn? Would chronic but manageable conditions qualify? Would severe poverty or emotional trauma suffice? Adopting the asymmetry argument removes the "severity" limitation, as Benatar's argument applies to *any* existence containing pain, potentially opening the door to litigation by any child born into less-than-ideal circumstances.
  *   **Legislative Prerogative:** These issues touch on abortion, disability rights, and medical liability caps. Such complex policy balancing is better suited for the legislature. Indeed, many states have statutorily barred wrongful life claims explicitly. By creating this cause of action, we would bypass the democratic process.

  **III. Adequate Remedies Exist Without Recognizing Wrongful Life**

  The primary equitable concern is ensuring the child's medical needs are met. This is already addressed through the parents' "wrongful birth" claim.
  *   In a wrongful birth action, the parents can recover the extraordinary medical and educational costs associated with the disability.
  *   These funds are typically managed for the child's benefit.
  *   Recognizing a separate wrongful life claim creates a risk of double recovery or conflicting interests between the parents (who chose to keep the child after birth) and the child (who claims they should not exist).

  **IV. Counterarguments and Why They Fail**

  *   **Argument:** *Denying the claim leaves the child without recourse for their own suffering.*
      *   **Response:** Tort law does not provide a remedy for every harm. The harm alleged is ontological, not physical. The physical pain is compensated via the parents' claim for medical expenses. The existential grievance is not legally cognizable.
  *   **Argument:** *Other jurisdictions (e.g., California in Turpin) allow special damages for wrongful life.*
      *   **Response:** Those jurisdictions explicitly rejected general damages for "being born." They limited recovery to out-of-pocket expenses to avoid the metaphysical trap. Since the parents here are already suing for those expenses, a separate claim by the child is redundant.
  *   **Argument:** *Benatar's asymmetry solves the logical paradox.*
      *   **Response:** It solves the *logical* paradox but not the *legal* one. Law requires a plaintiff who has suffered a cognizable injury relative to a legal duty. A clinician owes a duty to the parents to provide accurate information for *their* decision-making. The duty to the fetus is derivative.

  **RECOMMENDATION**

  I recommend we **affirm the dismissal** of the child's claim.

  **Proposed Holding Theory:**
  The Court should hold that while the philosophical arguments regarding the asymmetry of pain and non-existence are intellectually notable, they do not translate into a cognizable legal injury. The law presumes life is a benefit. To declare otherwise would require the Court to weigh existence against non-existence, a calculation that remains legally impossible regardless of philosophical framing. The proper avenue for compensation is the parents' wrongful birth claim, which covers the economic burden without requiring the Court to adjudicate the value of the child's life.

  **Drafting Notes for the Opinion:**
  1.  **Acknowledge the Argument:** Give the Plaintiff's counsel credit for the novelty of the Benatar argument. It distinguishes this memo from standard boilerplate rejections.
  2.  **Distinguish Philosophy from Law:** Emphasize that while philosophy explores what *is* good or bad, law regulates duties between *existing* persons.
  3.  **Protect the Disability Community:** Include language emphasizing that recognizing this claim could have a chilling effect on the societal valuation of disabled persons.
  4.  **Leave the Door Open for Legislature:** Note that if the state wishes to compensate children in this position beyond parental recovery, it is a legislative policy choice, not a judicial one.

  **Next Steps:**
  If you agree with this recommendation, I will draft a proposed opinion affirming the lower court, incorporating the analysis above. I will also prepare a brief summary of the "Wrongful Birth" companion case to ensure the two opinions are consistent regarding damage awards.

  Respectfully submitted,

  [Your Name]
  Law Clerk
