answer: |-
  What you experienced is unsettling, but I can reassure you immediately: **your committee did not make an arithmetic error, and the process was not rigged.**

  You have encountered a well-documented phenomenon in social choice theory known as a violation of the **Independence of Irrelevant Alternatives (IIA)**. While that sounds technical, the concept is straightforward: in certain voting systems, the relative ranking of two candidates (X and Y) can flip simply because a third, losing candidate (Z) enters or exits the race, even if no voter changes their mind about X versus Y.

  Here is an explanation of why this happened, why it is a known flaw in the system you used, and how you might handle it both now and in the future.

  ### 1. Why did the result flip?
  The system you used is a variation of the **Borda Count**. In this system, points are awarded based on relative position. This means a candidate's score depends not just on how many people like them, but on how they are positioned relative to *everyone else* on the ballot.

  In your specific case, Candidate Z acted as a "decoy" or "anchor" that suppressed Candidate Y's score more than Candidate X's score.

  **Here is a hypothetical example that matches your exact scenario:**
  Imagine your 5 committee members voted like this:
  *   **3 Members:** Preferred Y > X > Z
  *   **2 Members:** Preferred X > Z > Y

  **With all three candidates (Points: 1st=2, 2nd=1, 3rd=0):**
  *   **Candidate X:** Gets 1 point from the 3 Y-voters + 2 points from the 2 X-voters = **7 points**
  *   **Candidate Y:** Gets 2 points from the 3 Y-voters + 0 points from the 2 X-voters = **6 points**
  *   **Candidate Z:** Gets 0 points from the 3 Y-voters + 1 point from the 2 X-voters = **2 points**
  *   **Result:** **X wins** (7 to 6).

  **Now, remove Candidate Z (Points: 1st=1, 2nd=0):**
  *   **3 Members:** Still prefer Y > X
  *   **2 Members:** Still prefer X > Y (Their ballot was X>Z>Y, so without Z, it is just X>Y)
  *   **Result:** **Y wins** (3 votes to 2).

  In the three-way race, X won because the 2 members who preferred X managed to rank Z second, denying Y those points. When Z left, that "buffer" disappeared, and the raw majority preference (3 people prefer Y over X) was revealed.

  ### 2. Is this inevitable?
  You asked if this is the sort of thing *any* method is bound to run into. The answer is nuanced.

  **Arrow's Impossibility Theorem:**
  In 1951, economist Kenneth Arrow proved mathematically that no ranked voting system can satisfy a specific set of "fairness" criteria (including IIA) in all cases. Essentially, **every voting system has flaws.** However, some systems are more prone to specific flaws than others.

  **The Borda Count Flaw:**
  The system you used is particularly susceptible to this specific reversal. It is known to be vulnerable to "cloning" (adding similar candidates) and "withdrawal" (candidates leaving). Because the points depend on the *number* of candidates, the math changes fundamentally when the field shrinks.

  **Better Alternatives:**
  While no system is perfect, some would have avoided this specific confusion:
  *   **Pairwise Comparison (Condorcet Method):** Instead of assigning points, you compare every candidate head-to-head. (Does the committee prefer X over Y? Y over Z? X over Z?) In the example above, this method would have shown immediately that Y beats X (3-2), regardless of Z's presence.
  *   **Approval Voting:** Committee members simply vote "Yes" or "No" for each candidate. The candidate with the most "Yes" votes wins. This avoids ranking paradoxes entirely.
  *   **Simple Majority (for two finalists):** If you are down to two candidates, a simple up-or-down majority vote is generally considered the most robust method.

  ### 3. What should you do now?
  This is the most practical part of my advice. You have two conflicting results. Which one is "real"?

  **You should treat the second result (Y winning) as the valid one.**

  Here is why: Now that Z has withdrawn, you effectively have a two-person race. In a two-person race, the most democratic standard is **majority rule**. The second calculation revealed that a majority of your committee (3 out of 5) actually prefers Y over X. The first calculation (where X won) was an artifact of the scoring system interacting with a candidate who is no longer available.

  If you hire X, you are hiring the candidate whom the majority of your committee ranks *lower* than the alternative. That is a difficult position to defend if the committee later fractures.

  **Recommendation for the Committee Chair:**
  1.  **Acknowledge the anomaly:** Explain to the committee that this is a known mathematical quirk of the scoring system (IIA violation), not an error or manipulation.
  2.  **Validate the second result:** Since Z is gone, the comparison is now binary. The second tally reflects the true majority will of the committee regarding X vs. Y.
  3.  **Move forward with Y:** Unless there are other non-voting reasons to prefer X, the second result is the more robust mandate.

  ### 4. What should you do next time?
  For a small committee hiring a single executive, ranked point systems are often more complex than they need to be. For your next search, consider:

  *   **Consensus Building:** Discuss the candidates openly after private ranking to see if preferences can converge before voting.
  *   **Approval Voting:** Ask members to mark all candidates they find "acceptable." Hire the one with the most approvals.
  *   **Condorcet Method:** If you must rank, compare candidates pairwise. It takes slightly more effort to count but prevents the "spoiler" effect you just experienced.

  **Summary:** You haven't been duped, and you haven't made a mistake. You've simply run into a limit of the mathematical tool you chose. Trust the head-to-head result (Y), and consider a different voting method for the future.
