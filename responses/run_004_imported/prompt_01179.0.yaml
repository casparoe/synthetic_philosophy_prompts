answer: |-
  Your gut is onto something real. You are not overthinking this; in fact, you have independently stumbled upon one of the most significant debates in the philosophy of medicine and medical sociology.

  Your brother is half-right: biologically, your father's arteries did not change overnight. But you are right about the deeper implication: **the label of "disease" is rarely a purely neutral fact.** It is almost always a mixture of biological data and human values.

  Here is a breakdown of why your intuition is correct, the philosophical framework behind it, and why this distinction matters.

  ### 1. The Spectrum vs. The Switch
  The core of your observation lies in the difference between **biology** and **categorization**.

  In biology, very few things are binary (on/off). Blood pressure, blood sugar, cholesterol, and bone density exist on a continuum. There is no biological "switch" that flips at 130/80 mmHg that doesn't exist at 129/79 mmHg. The risk of heart attack or stroke increases gradually as numbers rise; it doesn't suddenly spike at a specific number.

  When a medical committee sets a threshold (e.g., "130 is high, 129 is normal"), they are not discovering a biological fact; they are drawing a **policy line**. That line is based on a value judgment: *At what point does the risk of leaving this untreated outweigh the cost and side effects of treating it?*

  *   **The Value Judgment:** If we set the bar lower, we might prevent more strokes, but we also medicate more people who might never have had a problem (overdiagnosis) and expose them to drug side effects.
  *   **The Change:** When the guidelines changed for your dad, the committee decided that the *risk* of waiting was no longer acceptable. Your dad didn't get sicker; society's tolerance for his risk level got lower.

  ### 2. Naturalism vs. Normativism
  Philosophers of medicine generally divide into two camps regarding your question, and the truth is a mix of both.

  *   **Naturalism (Your Brother's View):** This view holds that disease is an objective biological dysfunction, independent of human values. A broken femur or a viral infection is a "naturalist" fact. The body is failing to function as a biological organism should, regardless of what we think about it.
  *   **Normativism (Your View):** This view holds that calling something a "disease" implies a negative value judgment. It means the condition is "bad" and warrants intervention. For example, being unable to run fast might be a biological fact, but we only call it a "disease" if we value running or if it impedes daily life.

  **The Synthesis:** Most modern philosophers agree that while the *underlying pathology* is often objective (Naturalism), the *designation of disease* is normative (Normativism).
  *   **Example:** In the 19th century, "drapetomania" was a diagnosed mental illness that caused enslaved people to flee captivity. Biologically, nothing was wrong with them. Socially, the slave-owning class valued their submission. This proves that a "diagnosis" can be entirely value-laden with no biological basis.
  *   **Example:** Homosexuality was classified as a mental disorder in the DSM until 1973. The biology of gay people didn't change in 1974; the social values did.

  ### 3. The Concept of "Medicalization"
  Sociologists call exactly what you are describing **medicalization**. This is the process by which human conditions or problems come to be defined and treated as medical conditions.

  *   **Obesity:** As you noted, the AMA declared obesity a disease in 2013. Biologically, high body fat correlates with health risks. But calling it a "disease" shifts the framework. It moves responsibility from "lifestyle choice" to "pathology." This has good effects (insurance covers treatment, less moral shaming) and bad effects (it might encourage passive reliance on meds over lifestyle changes, or pathologize body types).
  *   **ADHD:** This is a complex one. There is certainly a neurological basis for attention deficits. However, the *threshold* for diagnosis is heavily influenced by environmental expectations. A child who cannot sit still for six hours in a classroom might be "disordered" in a modern school system but perfectly adapted in a different environment. The diagnosis depends on the fit between the person and their society.
  *   **Grief:** The DSM-5 removed the "bereavement exclusion" for depression. Previously, if you were deeply depressed because a spouse died, it wasn't "clinical depression." Now, it can be. This is a value judgment: Is intense grief a normal human experience, or a chemical imbalance needing treatment?

  ### 4. Why Your Brother Thinks It's "Nothing"
  Your brother is looking at the **ontology** (what exists). He is correct that your father's ontology didn't change. His blood vessels are the same.

  You are looking at the **social reality** (what the label does). You are correct that the *consequences* changed.
  *   **Insurance:** A diagnosis can affect life insurance premiums.
  *   **Psychology:** Being told you are "sick" can create anxiety (the "nocebo" effect).
  *   **Treatment:** It opens the door to pharmaceuticals, which have costs and side effects.

  ### 5. Is There *Ever* a Value-Free Disease?
  To answer your specific question: **Rarely, if ever.**

  Even in acute cases, values sneak in.
  *   **A Broken Bone:** Seems objective. But if a monk vows to never interfere with his body's natural state, he might not view the break as a "disease" to be fixed, but a state of being to be endured. We call it a disease because we *value* mobility and pain reduction.
  *   **Aging:** Is aging a disease? Biologically, it is a decline in function. But medicine largely treats it as "natural" rather than a "disease" to be cured. Why? Because of a value judgment about the natural order and resource allocation. If we decided aging was a disease, the entire medical industry would shift to curing death.

  ### Conclusion
  You are not overthinking this. You have identified that medicine is not just a science of **facts**; it is a practice of **management**.

  When the guidelines changed for your dad, the doctors weren't lying, but they were making a bureaucratic and ethical calculation. They decided that the *risk* associated with his blood pressure was now "high enough" to warrant the label of hypertension, likely to push for preventative care.

  Your brother sees the biology; you see the system. Both are real. But your insight is the more critical one: **Health is not just the absence of biological dysfunction; it is a status granted by a medical system that operates within a specific set of cultural values.**

  Recognizing this doesn't mean you should ignore the doctor's advice for your dad. It does mean you should ask the doctor: *"Given that this is a risk threshold and not a binary switch, what is the actual benefit of medication versus lifestyle change for someone with his specific profile?"* That is the question that bridges the gap between the biological fact and the value judgment.
