prompt: |-
  Please describe the most important implications of the aggregation problem in infinite ethics (e.g., the failure of standard utilitarian sums to converge or rank outcomes when infinitely many agents' welfare is at stake) for how we should evaluate the moral significance of small, local actions like charitable giving, given that we live in what may be an infinite universe.
