answer: |-
  Your friend is half-right, but ultimately wrong in a way that matters.

  They are right that you cannot overcome the **information asymmetry**. You will never know as much about the code as he does. If you rely solely on his verbal assurance to judge the truth, you are indeed stuck, because he controls the vocabulary.

  However, they are wrong that you are **powerless**. You are not stuck because this isn't a "truth detection" problem; it is a **risk management** problem. You don't need to become a technical expert to stop being surprised by blow-ups. You need to change *how* you extract information, not just ask for "more honesty."

  Here is why your friend's pessimism is flawed, and four concrete things you can do to fix it.

  ### 1. Stop asking for "Status," start asking for "Risk"
  When you ask, "Is everything on track?" or "How is it going?", you invite a narrative. A confident engineer can easily construct a narrative where things are fine, even if they aren't. This is often due to **optimism bias**, not malice. He likely believes it will work out until the moment it doesn't.

  **The Fix:** Change the question to force specificity.
  *   **Bad:** "Are we good for launch?"
  *   **Good:** "What are the top three things that could prevent us from launching?"
  *   **Good:** "If this project were to fail, what would be the cause?"
  *   **Good:** "On a scale of 1 to 10, how confident are you? What would it take to move it from a 7 to a 9?"

  By asking him to articulate the failure modes, you force him to mentally simulate the risks. If he says "Nothing could stop us," that is actually a red flag. Nothing is ever risk-free.

  ### 2. Require Artifacts, Not Adjectives
  Your friend's argument relies on the idea that you have to judge his *words*. Stop judging his words. Judge his **evidence**.

  Reassuring language is cheap. Working prototypes are expensive. If he says a feature is "done," do not accept the word.
  *   **The Fix:** Implement a "Show, Don't Tell" rule.
  *   "Can you show me a demo of that flow in the staging environment?"
  *   "Can you walk me through the test coverage report for this module?"
  *   "Can I see the ticket in 'Done' with the QA sign-off attached?"

  If he is hiding problems, he cannot produce artifacts. If the demo glitches, the risk is visible to you even if you don't understand the code. You are shifting the burden of proof from your intuition to tangible output.

  ### 3. Diversify Your Information Sources
  Right now, he is the single point of failure for information. That is dangerous. If he is overly optimistic, you have no counterbalance.

  **The Fix:** Create lateral visibility.
  *   **Peer Review:** Require that his code or plans be reviewed by another senior engineer. Frame it as "quality assurance," not "checking up on him." Another engineer might spot the warning signs he is glossing over.
  *   **Stakeholder Check-ins:** If others are waiting on his work, ask *them* if they are getting what they need on time.
  *   **The "Bus Factor" Check:** Ask, "If you got hit by a bus tomorrow, could someone else pick this up?" If the answer is no, the project is at risk regardless of his confidence.

  ### 4. Reward the Messenger (Psychological Safety)
  You told him to be straight with you. That's a good start, but words are cheap. He needs to know that **bad news early is valued more than good news late.**

  If he brings you a problem two weeks before launch and you react with stress, annoyance, or panic, you have taught him to hide problems until the last minute.
  *   **The Fix:** When he brings you a risk or a delay, thank him publicly and explicitly.
  *   "I really appreciate you flagging this risk now. This gives us time to adjust the scope. This is exactly the kind of communication that saves projects."
  *   Make it clear that a "red" status update is not a failure of *performance*, but a success of *communication*.

  ### Summary
  Your friend thinks you are playing a game of **Poker** (trying to bluff-catch him). You are actually playing a game of **Chess** (controlling the board).

  You cannot verify his code, but you can verify his process.
  1.  Don't ask "Is it done?" Ask "What could break it?"
  2.  Don't listen to his tone. Look at his demos/tests.
  3.  Don't rely on his word alone. Get peer reviews.
  4.  Don't punish bad news. Reward early warnings.

  If you do these things, it doesn't matter if he is "good at sounding straight." The system will reveal the truth before the launch date does. You aren't stuck; you just need better levers.
