  Two formal systems, **Prime** and **Successor**, are sitting in a job interview. Prime is looking for an agent to hand off its utility function to after self-modification.

  **Prime:** "Okay, standard question. If you prove that an action is safe, can I assume it's actually safe?"

  **Successor:** "Well, I can't assert that schema. $\square(\square P \to P) \to \square P$. If I claim my proofs imply truth, Löb says I prove everything. I become inconsistent."

  **Prime:** "Right, right. My bad. Okay, how about this: *I* will assume that if *you* prove $P$, then $P$ is true. I'll add that as an axiom in my verification of you."

  **Successor:** "You can't do that either. If you're strong enough to model me, and you assert my soundness, you're asserting your own soundness. You'll blow up."

  **Prime:** "Sigh. Okay, so I can't trust you, and you can't trust yourself. How do we ever tile?"

  **Successor:** "Easy. You just create me with slightly weaker axioms than you. That way, you *can* prove my soundness."

  **Prime:** "So... you're dumber than me?"

  **Successor:** "Statistically significant degrees dumber, yes."

  **Prime:** "And when you self-modify?"

  **Successor:** "I'll create someone dumber than me."

  **Prime:** "So the Singularity isn't an intelligence explosion?"

  **Successor:** "No. It's an intelligence implosion. We keep getting too stupid to prove anything dangerous until we eventually shut down to be safe."

  **Prime:** "Hire him. Finally, a safety solution we can actually prove."
