prompt: |-
  Ok so I've got two pretty different offers right now and I genuinely can't figure out how to choose between them. One is a fully funded PhD spot in a good bioinformatics lab - stable, prestigious, sets me up for an academic career. The other is joining two friends who are starting a tiny farm-to-table co-op back in my hometown, which pays basically nothing but is something I'd actually be proud to help build. I've done the pro/con list thing and tried scoring different factors and it just doesn't spit out a winner, and its not because I'm missing information, it feels more like they're just not on the same scale to compare. My roommate keeps saying that if I can't tell which one wins they must just be equally good, so I should just flip a coin, but that doesn't sit right with me. We brushed up against something kind of like this in my ethics class a few weeks back but I can't remember what it was called. What's actually going on with a decision like this, and how should I be thinking about it?
