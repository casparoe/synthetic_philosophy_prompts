answer: |-
  # The Tautology Trap: Why Utility Must Be More Than Behavior

  You have stumbled upon the central fault line in modern economic theory, one that vibrates uncomfortably beneath the feet of anyone trying to align artificial intelligence with human values. On one side stands the behaviorist fortress of Paul Samuelson, Afriat's Theorem, and the modern formalists like Gul and Pesendorfer. They argue that utility is merely a mathematical index of consistent choice—a "as if" description with no need for psychological reality. On the other side stand Amartya Sen, Daniel Hausman, and the behavioral economists, who argue that stripping preference of mental content renders welfare economics nonsensical.

  You asked for a verdict, not a diplomatic summary. So here it is: **The behaviorist definition of utility is mathematically elegant but ontologically bankrupt.** While Revealed Preference Theory (RPT) serves as a useful tool for predicting market demand in stable environments, it fails as a theory of agency. If you accept the tautology that "choice reveals preference," you lose the ability to distinguish between a wise decision, a mistake, and a compulsion. For the purposes of welfare economics—and critically, for AI alignment—utility *must* refer to something internal. It must be a psychological state, not just a behavioral shadow.

  ### The Allure of the Empty Maximand

  To understand why the behaviorist view is so seductive, you have to understand the context of the 1930s. Economics was trying to shed its utilitarian baggage—the idea that we could measure "hedons" or units of happiness in the brain. It was unscientific. Paul Samuelson offered a way out. In his *Foundations of Economic Analysis*, he proposed that we don't need to know *why* an agent chooses; we only need to observe *that* they choose consistently.

  This culminated in results like Afriat's Theorem (1967), which essentially proved that for any finite set of choices, as long as they don't contradict each other too blatantly, you can construct a utility function that rationalizes them. If you buy an apple when an orange was available, you "revealed" a preference for the apple. If you later buy the orange, you must have faced different constraints or prices. If your choices satisfy certain axioms (like the Weak Axiom of Revealed Preference), you are mathematically indistinguishable from a utility maximizer.

  Modern defenders like Faruk Gul and Wolfgang Pesendorfer argue this is a feature, not a bug. In their view, economics is not psychology. It is the study of incentives and constraints. To demand that utility track a "real feeling" is to invite unobservable metaphysics into a hard science. If the model predicts the choice, the internal state is irrelevant. This is the "as if" doctrine: humans act *as if* they maximize utility, even if they are just following habits or impulses.

  ### The Fatal Flaw: Unfalsifiability and the Death of Welfare

  The problem with this position is that it purchases scientific rigor at the cost of explanatory power. By defining preference *as* choice, RPT makes the theory of utility maximization unfalsifiable. If every possible choice can be rationalized post-hoc by adjusting the utility function, the theory explains nothing. It is a description, not a mechanism.

  But the deeper failure, the one that should matter most to you, is normative. Economics is not just about prediction; it is about welfare. We use these models to ask: *Did this policy make people better off?*

  If preference is just choice, "better off" simply means "got what they chose." This leads to absurdities that Amartya Sen dismantled in his seminal paper *Rational Fools* (1977). Consider a smoker who wants to quit, buys nicotine patches, but then smokes a cigarette anyway. Under strict revealed preference, the smoker "preferred" the cigarette at the moment of choice. Therefore, smoking maximized their utility. To say they made a "mistake" or are "worse off" is meaningless within the RPT framework, because their choice defines their welfare.

  Daniel Hausman pressed this point further. He argued that for economics to justify laissez-faire policies (the idea that free choice leads to good outcomes), preference must be a *judgment of betterness*, not just a disposition to choose. If I choose X over Y but believe Y is better for me (akrasia), RPT breaks. It cannot distinguish between a sovereign citizen exercising freedom and an addict succumbing to compulsion. Both are just "maximizing utility."

  ### The AI Alignment Imperative

  This is where the rubber meets the road for your interest in AI alignment. The behaviorist view might work for modeling a stock market, but it is catastrophic for modeling human values.

  If you are building an AI agent, *its* utility function is indeed formal and behavioral. It is the objective function you code. But when you try to align that AI with *human* utility, you cannot treat human utility as merely revealed behavior. Humans are buggy agents. We suffer from framing effects, hyperbolic discounting, and misinformation.

  If an AI adopts the Gul & Pesendorfer view, it will conclude that a human who clicks on addictive clickbait "prefers" clickbait. If the AI's goal is to maximize human utility, and utility is defined by clicks (behavior), the AI will flood the human with clickbait. This is the alignment failure in a nutshell.

  To align AI with humans, there must be a gap between *revealed choice* and *true preference*. We need a model where the human has a "true" utility function (psychological welfare) that is obscured by noise, bias, and error. The AI's job is to infer the latent function, not mimic the noisy output. If you accept the tautology that choice equals preference, you concede that humans cannot make mistakes. If humans cannot make mistakes, AI cannot help us make better ones. It can only serve us our own pathologies.

  ### The Verdict: Utility Must Be Mental

  So, where does this leave us? The behaviorists are right that we cannot directly observe utility. But they are wrong to conclude that it therefore does not exist as a distinct causal mechanism.

  We should view utility not as a redescription of behavior, but as a **theoretical construct representing a cognitive evaluation of states of affairs.**

  1.  **It restores falsifiability:** If utility is psychological, we can find cases where choice diverges from reported well-being (e.g., "I chose this, but I'm unhappy I did"). This divergence is data, not noise. It allows us to test models of bias and error.
  2.  **It saves welfare economics:** It allows us to say that a policy is good if it helps people achieve what they *would* choose under ideal conditions (informed, calm, reflective), rather than what they *do* choose under duress.
  3.  **It enables alignment:** It permits the distinction between "what the human did" and "what the human wanted."

  The behaviorist defense—that mental states are unobservable—is weak in the 21st century. We are no longer in the 1930s. We have neuroscience, psychophysics, and cognitive science. We know that choices are generated by neural processes that can be measured, modeled, and sometimes malfunction. To insist that economics remain blind to the generator of the choice is not scientific purity; it is willful ignorance.

  ### Conclusion

  The idea that utility is just a summary of consistent choice is a convenient fiction for modeling demand curves in stable markets. But as a philosophical account of agency, it is a dead end. It turns the claim "agents maximize utility" into a tautology that cannot be wrong, and therefore cannot be right.

  If we want to talk about alignment, welfare, or rationality, we must accept that preferences are real, internal states that *cause* choices, rather than being *defined* by them. We must accept that people can choose against their own interests. We must accept that utility is psychological. Anything less reduces human beings to black boxes whose output is always, by definition, optimal—a conclusion that is not only empirically false but ethically paralyzing.
