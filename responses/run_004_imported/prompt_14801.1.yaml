  The next day, she skips the latte and deposits the money. I turn to the economist and say, "So today she prefers saving?"

  "Exactly," he says. "Her choice reveals she prefers saving."

  "But yesterday you said she preferred coffee! She can't prefer opposite things on consecutive days. Your theory just explained two flat-out contradictions."

  The economist smiles. "Revealed Preference doesn't predict what you'll do. It just confirms what you did."

  "So it's never wrong?"

  "Never. It's the only science that predicts the past with 100% accuracy."
