  Ok so I've been down a bit of a YouTube rabbit hole about behavioral econ lately, and I keep running into this idea called "revealed preference" - the basic claim is that you shouldn't trust what people SAY they want, the only real evidence of your preferences is what you actually choose, because the choice basically just IS the preference by definition. This came up because me and my sister were arguing about whether she "really" wants to save money, since she says that constantly but also buys a $6 coffee every single morning, and appartently to an economist that just means she "revealed" that she prefers the coffee, end of story, no contradiction allowed. It also seems to imply that "utility" doesn't even mean happiness or satisfaction the way I always assumed, it just means whatever you happened to pick, which is its own separate thing bugging me but maybe a question for another day.

  The part thats really messing with my head though is that this theory seems like it can never actually be wrong, no matter what happens. If she buys the coffee, that "reveals" she wanted the coffee. But if she stopped tomorrow and started saving instead, that would just "reveal" that she'd actually preferred saving all along, and that the coffee thing was some kind of temporary blip. Either way the theory wins after the fact, which feels like a trick somehow, but I can't quite explain why that's an actual problem instead of me just not getting econ.

  So could you write me a short joke about this? Not just some generic "ha economists are out of touch" joke, I want the punchline to actually turn on the fact that revealed preference theory can explain away literally any choice after it happens, even two choices that flat out contradict each other, so the theory never really risks being proven false. Bonus points if it somehow also plays on the gap between what people SAY they prefer (like my sister insisting she's "trying" to save) versus what their choices supposedly reveal, since honestly that gap is the part that's really bugging me.
