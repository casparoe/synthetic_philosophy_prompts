answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. I'm currently a junior in high school, which means my knowledge of the world comes from two sources: TikTok, and the drafts of my sister's dissertation that she leaves on the kitchen floor.

  So, while most of you know my sister as a bride, I know her as a philosopher. Specifically, she studies value. She spends her days asking: *What makes something good?* Her work focuses on "Fitting-Attitude" accounts, which roughly say that calling something "good" just means there are reasons to value it.

  But there's a catch. She writes about the "Wrong Kind of Reasons" problem. The classic example in her field involves a demon who threatens to torture you unless you admire a saucer of mud. Now, you have a *reason* to admire the mud—to save your skin—but the mud isn't actually *admirable*. That threat is the "wrong kind" of reason. The "right kind" of reason has to come from the object itself—its actual merits.

  Naturally, I had to apply this framework to today. We had to be sure. **Marcus, for the record: we checked the basement, there are no demons, and you are definitely not a saucer of mud.**

  *(Pause for laughter)*

  But seriously, that distinction is the backbone of this marriage. If my sister loved Marcus for the "wrong kind" of reasons—pressure, obligation, or pragmatic threats—then that love wouldn't be "fitting." It wouldn't be real value.

  But watching them together for six years, I've seen that her reasons are the "right kind." They aren't external threats; they are internal merits. They are found in Marcus's kindness, his patience, and the way he looks at her when she starts talking about metaethics at the dinner table. He provides the reasons that make her admiration *fit* the object.

  In a world full of wrong kinds of reasons, you two have found the right ones. So, if everyone could please raise a glass.

  To the bride and groom: May your reasons always be the right kind, and may your attitudes always be fitting. To Marcus and my sister!
