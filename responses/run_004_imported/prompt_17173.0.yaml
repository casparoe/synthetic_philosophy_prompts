answer: |-
  **Topic 1: The Excuse/Exemption Boundary in Hard Cases**

  **Question 1:**
  P.F. Strawson distinguishes between excuses, which modify responsibility within the participant stance, and exemptions, which remove us from that stance entirely via the objective attitude. But in cases of severe childhood deprivation or chronic addiction, this binary seems to fracture. If I resent an addict for relapsing, am I failing to see they are exempt (compelled), or am I unfairly refusing an excuse (diminished capacity)? If your view relies on the stability of our interpersonal practices, how do you advise us to draw that line when the practices themselves are conflicted about whether these agents are "one of us" or "broken"?

  **Follow-up 1:**
  *(Keyed to her likely answer: She will likely argue that the distinction is pragmatic and depends on whether modifying the relationship is possible.)*
  If you say the distinction is purely pragmatic based on whether we can sustain a relationship, doesn't that risk making responsibility contingent on social utility rather than moral status? If we decide it's "more useful" to treat a deprived child as exempt to manage them clinically, have we not effectively exiled them from the moral community, regardless of whether that was metaphysically justified?

  ***

  **Topic 2: Susan Wolf's Asymmetry Worry**

  **Question 2:**
  Susan Wolf has argued that our intuitions about determinism are asymmetrical: we are quick to excuse bad conduct if it flows from a determined character ("he couldn't help being cruel"), but we hesitate to withhold credit for good conduct ("she's truly generous"). As a Strawsonian, you treat resentment and gratitude as symmetrical reactive attitudes. Do you think Wolf has identified a genuine flaw in our moral psychology that your view must correct, or is this asymmetry itself a bias we ought to resist to maintain integrity in our relationships?

  **Follow-up 2:**
  *(Keyed to her likely answer: She will likely defend symmetry, arguing that genuine love requires seeing both good and bad as grounded in the person's quality of will.)*
  If we accept your defense of symmetry, does that force us to diminish our admiration for moral saints? If we say the saint's goodness is just a fact about their constitution, similar to a villain's badness, do we lose the normative force of "ought"—the sense that we *should* emulate them—because their virtue becomes just another determined fact about the world?

  ***

  **Topic 3: The Naturalistic Fallacy Charge**

  **Question 3:**
  Derk Pereboom and Galen Strawson have pressed a powerful objection: even if we grant that reactive attitudes are inescapable features of human psychology, inferring that they are *justified* seems to commit a naturalistic fallacy. You might say we *can't* give up resentment, but your friend from the argument would say that tells us nothing about whether we *should*. How does your naturalism move from the descriptive claim that these practices are entrenched to the normative claim that they are authoritative?

  **Follow-up 3:**
  *(Keyed to her likely answer: She will likely argue that justification is internal to the practice, not external, and that seeking an "external" validation is unintelligible.)*
  If justification is entirely internal to our existing practices, does your view lack the resources to condemn a practice that is stable, inescapable, but deeply cruel? If a community finds it psychologically inescapable to resent certain groups, does your framework force you to say their resentment is "warranted" simply because it is a fixed part of their interpersonal life?

  ***

  **Topic 4: Normative Critique and Social Justice**

  **Question 4:**
  Building on that last point: if moral responsibility is constituted by our actual reactive practices, how do we account for the intuition that a community can be *wrong* about who deserves resentment? Historically, societies have resentfully punished people more harshly due to race, poverty, or disability. If responsibility is grounded in what we *do* rather than a metaphysical fact about free will, what standard allows you to say those communities were mistaken rather than just operating with a different set of reactive attitudes?

  **Follow-up 4:**
  *(Keyed to her likely answer: She will likely appeal to "idealized" conditions or a broader conception of human flourishing to filter out biased practices.)*
  If you appeal to "idealized conditions" or "human flourishing" to filter out racist or ableist resentment, aren't you smuggling in a non-naturalist standard? At what point does appealing to an idealized version of our practices stop being Strawsonian naturalism and start looking like the very kind of external, metaphysical justification you sought to avoid in "Freedom and Resentment"?
