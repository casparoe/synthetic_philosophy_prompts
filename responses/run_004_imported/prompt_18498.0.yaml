answer: |-
  This is a classic metaphysical standoff, and you have correctly identified the central tension. Your friend is relying on **common sense ontology** (the world looks like it has medium-sized objects), while you are invoking **formal ontology** (the logical constraints on what existence can be).

  The Argument from Vagueness (championed by David Lewis and Theodore Sider, and accepted in spirit by van Inwagen) is indeed the heavy artillery used to blast apart moderate answers. To explain why it is fatal to moderatism in a way that distinguishes it from ordinary vagueness (like "baldness"), we need to look at the difference between **vagueness in description** and **vagueness in existence.**

  Here is the intuitive breakdown of why the argument works, and how it applies to van Inwagen's own view.

  ### 1. The Core Distinction: Properties vs. Existence

  Your friend's objection is the most common one: *"We accept vague words like 'bald' or 'tall.' Why can't 'object' be vague?"*

  The Argument from Vagueness replies: **"Bald" is vague, but "a man" is not.**

  When we argue about whether a man is bald, we are not arguing about whether the *man* exists. We agree there is a human being standing there. We are merely disagreeing about how to apply a label ("bald") to his properties. The vagueness is in our language or concepts, not in the world.

  However, the Special Composition Question (SCQ) isn't about properties. It is about **counting.** It is about how many things exist in a room.

  *   **Scenario:** Imagine you have two metal halves of a bicycle frame.
  *   **Moderate View:** If I bolt them loosely, they don't compose a bike. If I torque them to spec, they do.
  *   **The Problem:** There is a gradual spectrum between "loose" and "torqued." At some precise micro-second of tightening, the moderate view says an object *pops into existence.*

  If the moderate view is true, then **existence itself** is vague. It would be indeterminate whether there are two things (the halves) or three things (the halves + the bike).

  Lewis's point is that **numbers are not vague.** It cannot be indeterminate whether there are 2 or 3 objects in a room, any more than it can be indeterminate whether 2 + 2 = 4. If composition is vague, then the number of objects in the universe is vague. But the number of objects is a precise fact. Therefore, composition cannot be vague.

  ### 2. Why This Kills Moderate Answers

  This is why the argument specifically targets your friend's position.

  *   **Universalism (Always):** For any parts, there is a whole. (No vagueness: the answer is always "yes".)
  *   **Nihilism (Never):** For any parts, there is no whole (except simples). (No vagueness: the answer is always "no".)
  *   **Moderatism (Sometimes):** For some parts, there is a whole.

  The problem for Moderatism is that any physical criterion your friend proposes (fastening, bonding, causal integration) admits of degrees.
  *   How tight must the bolt be?
  *   How much glue is enough?
  *   How strong must the causal link be?

  Because these physical criteria are continuous, they create **borderline cases of existence.** If you accept Moderatism, you must accept that there are situations where it is neither true nor false that an object exists. The Argument from Vagueness says this is metaphysically impossible. You can't have "half an object" come into existence.

  So, to answer your friend: Ordinary vagueness ("bald") is tolerable because it doesn't change the *inventory of the universe.* Vagueness in composition *does* change the inventory. Since the inventory of the universe must be precise, composition must be precise. Since moderate criteria are imprecise, moderate criteria are false.

  ### 3. Does Van Inwagen Escape the Trap?

  This is the fascinating second part of your query. Peter van Inwagen accepts the Argument from Vagueness. That is actually *why* he rejects moderate views like "fastening" or "bonding." He agrees that existence cannot be vague.

  However, he proposes his own moderate-ish answer: **Composition occurs if and only if the activity of the parts constitutes a life.** (i.e., Only living organisms are composite objects; bicycles do not exist, only simples arranged bicycle-wise exist).

  Does this escape the Argument from Vagueness?

  **The Vulnerability:**
  Critics (like Lewis and Sider) argue **no.** The boundary between "life" and "non-life" is arguably just as vague as the boundary between "bolted" and "unbolted."
  *   Consider viruses: Are they alive?
  *   Consider the origin of life: In the primordial soup, there was a gradual chemical evolution from non-living molecules to self-replicating cells. Was there a specific nanosecond where "life" began?
  *   Consider death: When exactly does an organism cease to exist?

  If "life" is vague, then van Inwagen's criterion makes *existence* vague again. If it is indeterminate whether a collection of particles constitutes a life, then it is indeterminate whether an organism exists. This recreates the very problem he tried to solve.

  **Van Inwagen's Defense:**
  Van Inwagen is aware of this. His defense generally takes two forms:
  1.  **Epistemicism:** He suggests that there *is* a sharp boundary to life, even if we cannot know it. Just as there is a precise number of grains that make a heap (even if we can't count it), there was a precise moment life began. The vagueness is in our knowledge, not in the world.
  2.  **Natural Joints:** He argues that "life" is a fundamental natural kind, whereas "bolted bicycle" is an arbitrary human classification. He hopes that the structure of reality makes life precise in a way that mechanical fastening is not.

  **The Verdict:**
  Most contemporary metaphysicians think van Inwagen does **not** fully escape the problem. The evolutionary origin of life suggests a genuine ontological fuzziness, not just a lack of human knowledge. If evolution is gradual, then the existence of the first organism is vague. If the existence of an organism is vague, van Inwagen's view falls prey to the Argument from Vagueness just like the bicycle view.

  ### Summary for Your Friend

  To settle your evening argument, you might put it this way:

  1.  **Agree on Vagueness:** Admit that words like "bald" are vague.
  2.  **Draw the Line:** Explain that "bald" describes an *existing* thing, whereas the SCQ asks *if* a thing exists.
  3.  **The Counting Test:** Ask your friend: "In this room, is the number of objects 50, 51, or indeterminate?" If they say "indeterminate" because of the bicycle, press them on how reality can be indeterminate about its own inventory.
  4.  **The Moderate Trap:** Explain that any rule they make for the bicycle (bolts, glue) will have a grey area. If existence follows that rule, existence has a grey area.
  5.  **Van Inwagen's Struggle:** Acknowledge that even the pro who invented the modern debate (van Inwagen) probably can't fully escape this using "life" as a criterion, because life itself evolved gradually.

  The hard truth of the Argument from Vagueness is that it forces a choice: Either **everything** exists (Universalism), **almost nothing** exists (Nihilism), or we must accept that **existence itself can be vague** (which most philosophers find unintelligible). Your friend wants to keep the bicycle without accepting Universalism or Nihilism, but the Argument from Vagueness suggests that position is logically unstable.
