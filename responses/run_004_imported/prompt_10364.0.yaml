answer: |-
  1. **The Quest for Certainty**
  Your new book argues that Hobbes's obsession with geometric certainty isn't just a quirk, but the engine driving his entire philosophical system. For a general audience that might view Hobbes primarily as a political thinker, why is it crucial to understand him first as a man obsessed with the *method* of science rather than just its conclusions?

  2. **Maker's Knowledge and *Scientia***
  Hobbes draws a sharp line between geometry and natural philosophy. He argues we can have genuine *scientia* (demonstrative knowledge) of geometry because we construct the figures ourselves, whereas we can only hypothesize about nature because God created it. How does this "maker's knowledge" criterion fundamentally reshape what Hobbes thinks truth actually is?
  *   **Follow-up:** Historians often note that this makes geometric truth a matter of "consequences of names" rather than correspondence to reality. If that's the case, does Hobbes's certainty come at the cost of making geometry tautological—true by definition, but telling us nothing about the world?

  3. **The Experimental Challenge**
  Hobbes's deductive vision put him on a collision course with the Royal Society, particularly Robert Boyle, who championed experimentalism and probabilistic knowledge. In reconstructing this debate, do you see Hobbes as an anti-science reactionary, or was he offering a coherent, alternative vision of what "science" should be that we have since lost?

  4. **The Circle-Squaring Paradox**
  There is a glaring tension in Hobbes's biography: he insists that geometry offers certainty because we construct the objects, yet he spent decades defending a quadrature of the circle that mathematicians like John Wallis proved was impossible. How does Hobbes reconcile his epistemological claim—that we cannot be mistaken about what we construct—with the empirical reality that he *was* mistaken?
  *   **Follow-up:** You've suggested that Hobbes believed Wallis was corrupting the language of mathematics rather than correcting his math. Does this imply that, for Hobbes, maintaining the authority of his method was ultimately more important than mathematical accuracy?

  5. **The Role of Language**
  A major theme in your reconstruction is the role of language in Hobbes's system. He seems to believe that if we can just fix definitions and reason correctly from them, error becomes impossible. To what extent do you think Hobbes's failures in geometry stemmed from a misunderstanding of how mathematical language relates to physical space?

  6. **Constructing the Commonwealth**
  Hobbes applies his geometric method to politics in *Leviathan*, arguing that civil philosophy is demonstrable because, like geometric figures, we "make" the commonwealth through covenant. How much weight can this analogy really bear? Is the creation of a state truly analogous to drawing a triangle in a way that guarantees political certainty?
  *   **Follow-up:** If political certainty relies on the sovereign enforcing these definitions, does Hobbes's system inadvertently admit that political "truth" is not discovered, but coerced? In other words, is the demonstration only valid as long as the sword backs it up?

  7. **The Psychology of Error**
  Beyond the technical disputes, your book touches on the sheer stubbornness Hobbes displayed in his later years. Do you interpret his refusal to concede to Wallis as a philosophical necessity for him, or do you see it as a psychological unraveling—a fear that if geometry failed him, the entire *Leviathan* would collapse?

  8. **Legacy of the Deductive Ideal**
  We tend to view the history of science as a march toward experimentalism, yet Hobbes's dream of a deductive, certain science echoes in later rationalists and even in modern economics or game theory. Do you see Hobbes as a dead end in the history of science, or does his insistence on certainty still haunt how we think about knowledge today?

  9. **The Human Element**
  In researching this book, did you find any evidence that Hobbes himself ever privately doubted his geometric claims, or does the correspondence suggest he remained genuinely convinced of his own certainty until the very end?

  10. **Relevance to Modern Uncertainty**
  We live in an era often defined by epistemic uncertainty and disputed facts. Is there anything in Hobbes's failed project to secure absolute certainty that offers a cautionary tale—or perhaps a strange comfort—to a modern audience struggling with the limits of what we can know?
