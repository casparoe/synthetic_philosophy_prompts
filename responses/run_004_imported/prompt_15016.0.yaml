answer: |-
  **MEMORANDUM**

  **TO:** Internal Conduct Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation re: Incident Report #2023-14 (Lt. [Name] / Pfc. [Name])

  **Purpose**
  This memo outlines my recommendation for resolving the conduct complaint regarding Lt. [Name]'s interaction with Pfc. [Name] on [Date]. Our committee is currently divided between treating this as a medical exemption, a disciplinary failure, or a policy gap. After reviewing the medical evidence, witness statements, and our conduct bylaws, I recommend we adopt a hybrid approach: **Accountable Rehabilitation.**

  **Analysis of the Disagreement**
  We are split because we are answering two different questions.
  *   **Camp 1** asks: *Was he in control at that moment?* The medical evidence suggests the answer is "no." Severe sleep apnea compromises the brain's regulatory functions. If we accept the doctor's assessment, Lt. [Name] was physiologically incapable of the self-regulation we expect. In philosophical terms, he may be **exempt** from blame for the specific outburst because his capacity for choice was temporarily disabled.
  *   **Camp 2** asks: *Is he responsible for being in that state?* The answer here is "yes." The symptoms were present for over a year. Whether due to personal denial or our department's "toughen-up" culture, he allowed himself to remain a risk. He is a fit target for blame regarding the **negligence** that led to the medical crisis.
  *   **Camp 3** asks: *What do we owe the victim?* Regardless of the Lt.'s physiology, Pfc. [Name] suffered public humiliation and is considering resigning. Our policy cannot ignore this harm.

  Treating this purely as medical (Camp 1) invalidates the victim's experience and sets a dangerous precedent. Treating it purely as discipline (Camp 2) ignores the physiological reality and discourages members from seeking health help. We must address both the *capacity* issue and the *culpability* issue.

  **Recommendation**
  I propose we utilize both the "Fitness for Duty" and "Discipline" tracks simultaneously, bridging the policy gap.

  **1. For Lt. [Name]:**
  *   **Immediate Administrative Leave:** Place Lt. [Name] on immediate administrative leave (Fitness for Duty track) pending successful treatment. This is not a punishment; it is a safety requirement. He cannot return until a sleep specialist certifies he is compliant with therapy (e.g., CPAP) for a minimum of 30 days.
  *   **Formal Written Reprimand:** Upon return to duty, issue a Formal Written Reprimand (Discipline track). Crucially, this reprimand is **not for the outburst itself**, but for *Failure to Maintain Fitness for Duty*. He is being sanctioned for ignoring visible symptoms over a 12-month period, which endangered the team and the public.
  *   **Rationale:** This accepts Camp 1's view that the outburst was a symptom, while validating Camp 2's view that he is responsible for managing his health.

  **2. For Pfc. [Name]:**
  *   **Restorative Meeting:** Once Lt. [Name] is cleared for return, a mediated meeting must occur. Lt. [Name] must apologize specifically for the impact of his actions, without using the diagnosis as an excuse.
  *   **Retention Assurance:** The Chief and Recruitment Officer must interview Pfc. [Name] immediately to assure him that the department takes his safety seriously. We should offer him a temporary mentor other than Lt. [Name] to rebuild confidence.

  **3. For the Department:**
  *   **Policy Amendment:** I recommend we draft an amendment to the Conduct Policy creating a "Medical-Conduct Overlap" protocol. We cannot rely on ad-hoc decisions for future cases where health impacts behavior.
  *   **Culture Review:** We must formally address the "unspoken rule" against reporting fatigue. Safety requires members feel safe reporting impairment.

  **Proposed Timeline**
  *   **Oct 31 (Next Tuesday):** Committee vote on this recommendation.
  *   **Nov 1:** Notification to Lt. [Name] and Pfc. [Name]. Lt. [Name] begins administrative leave.
  *   **Nov 1 – Dec 1:** Lt. [Name] undergoes treatment. Monthly compliance report submitted to Committee Chair.
  *   **Dec 5:** If compliant, Lt. [Name] receives Fitness for Duty clearance. Formal Reprimand issued.
  *   **Dec 7:** Mediated restorative meeting between Lt. and Pfc.
  *   **Jan 15:** Committee submits Policy Amendment draft to Chief.

  **Conclusion**
  This path is harder than simply punishing or simply excusing. It requires us to hold two truths at once: Lt. [Name] is a valued member who suffered a medical crisis, *and* he failed his team by ignoring it. Pfc. [Name] deserves protection regardless of the Lt.'s health. By separating the *medical incapacity* from the *administrative negligence*, we protect the member's health, the probationary member's dignity, and the department's standards.

  I look forward to discussing this on Tuesday.
