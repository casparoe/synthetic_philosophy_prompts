      *   *Critique:* Did I use the philosophy book insight?
      *   *Fix:* Explicitly mention the difference between "couldn't help it in the moment" (exemption) and "responsible for being in that state" (culpable negligence).

  6.  **Final Polish:** Check the timeline. Ensure it fits "before next Tuesday." (Memo is circulating *before* Tuesday, so timeline starts after the vote).

