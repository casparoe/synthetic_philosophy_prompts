  3.  **Analyze Correlated Equilibrium (Aumann):**
      *   *Premise:* Players receive signals from a common source (correlation device).
      *   *Mechanism:* Probabilistic correlation. "If the coin says Heads, I play $C$; if Tails, I play $D$." I know you got the same signal (or a correlated one).
      *   *Assumption:* Rationality given the signal. No incentive to deviate *given* the recommendation.
      *   *Outcome in PD:* Can support cooperation *if* the correlation device recommends it with high enough probability and punishes deviation (but in one-shot PD without enforcement, standard CE usually collapses to Nash unless the signal structure is specific). Wait, need to be careful here. In a standard one-shot PD, can a CE sustain $(C,C)$?
