      *   *Correction:* Aumann's CE allows for correlations that Nash doesn't, but it still respects individual rationality (incentive compatibility). In a one-shot PD, $D$ is strictly dominant. Therefore, *no* correlated equilibrium can sustain pure cooperation $(C,C)$ in a standard one-shot PD without modifying the payoff structure or adding enforcement.
