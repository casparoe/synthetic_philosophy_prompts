answer: |-
  Here are ten interview questions designed for a fifteen-minute window. They are structured to move quickly past summaries and into the philosophical tensions you identified. The three required topics include a primary question and a specific follow-up keyed to the professor's likely response.

  **1. Textual Development**
  "Most introductions treat Aquinas's position as a monolith, but you've written about the development of his thought. In his earlier *Commentary on the Sentences*, he seems more permissive regarding tyrannicide than in the later *De Regimine Principum*. Is this shift a sign that he matured into a more conservative political thinker, or was he simply responding to the specific political instabilities of his later period?"

  **2. The Usurper vs. The Legitimate Tyrant (Required Topic)**
  "Aquinas draws a sharp distinction between a *tyrannus ex defectu tituli*—a usurper with no right to rule—and a *tyrannus ex parte exercitii*, a legitimate king who rules badly. He argues forcible resistance is far easier to justify against the usurper. Is this distinction based on the idea that the usurper is essentially a foreign enemy, whereas the legitimate king holds an ontological office that cannot be voided by his personal sins?"

  **3. Follow-up to Question 2 (The Corporate Body Problem)**
  *(Ask this if she argues that the 'community' can depose a legitimate tyrant corporately.)*
  "You mention the community acting corporately. But Aquinas insists private individuals cannot act alone. In a scenario where a tyrant has dissolved the representative bodies or made assembly impossible, does Aquinas's framework leave the population with *any* licit recourse, or does his theory effectively protect the tyrant by demanding a mechanism he has already destroyed?"

  **4. Public Authority: Principle or Prudence? (Required Topic)**
  "In *De Regimine*, Aquinas argues that removing a tyrant must be reserved to public authority to prevent ambitious men from assassinating decent rulers under the pretext of tyranny. Is this restriction a principled conclusion derived from his natural-law premises about order, or is it merely a prudential override—a pragmatic fear of chaos that trumps the natural right to self-defense?"

  **5. Follow-up to Question 4 (The Judgment Problem)**
  *(Ask this if she suggests a 'higher public authority' can always intervene.)*
  "If the restriction is prudential, it implies the rule could be bent in extreme cases. But Aquinas often points to a 'higher authority' (like an Emperor or Pope) to depose a king. If the tyrant is the highest human authority available—with no superior to appeal to—does Aquinas's system force the subjects to simply endure the tyranny as the lesser of two evils?"

  **6. Tyranny as Divine Scourge (Required Topic)**
  "There is a passage in *De Regimine* where Aquinas frames tyranny as a scourge God permits for the sins of the people, suggesting the remedy is prayer and repentance rather than resistance. Does this theological framing fundamentally undercut his political arguments for resistance, implying that suffering under a tyrant is a spiritual duty?"

  **7. Follow-up to Question 7 (The "No Appeal" Scenario)**
  *(Ask this if she argues that spiritual remedies complement political ones.)*
  "If the remedy is primarily spiritual repentance, what happens when the tyranny is not just oppressive but destructive of the common good to the point of survival? Does Aquinas prioritize the spiritual health of the community over its physical survival, and if so, how does that sit with his natural law emphasis on self-preservation?"

  **8. Sedition and the Common Good**
  "In the *Summa Theologiae*, Aquinas condemns sedition as a mortal sin because it opposes the unity of the multitude. How does he distinguish 'sedition' from 'legitimate resistance'? Is the difference purely procedural (who authorizes it), or is there a substantive difference in the *end goal* that allows one to be virtuous and the other sinful?"

  **9. Reception and Mariana (Required Closing Topic)**
  "Moving to the early modern period, Jesuit writers like Juan de Mariana defended tyrannicide more permissively, leading to scandal after the assassination of Henry IV in 1610. When Mariana cites Aquinas, is he faithfully extending Aquinas's principles to a new context, or is he exploiting the ambiguities in Aquinas's work to justify a doctrine Aquinas himself would have rejected?"

  **10. Historical Legacy**
  "Finally, for my documentary: if we strip away the later mythologizing, does Aquinas ultimately belong in the tradition of the 'right to resist,' or is he more accurately a theorist of order who merely left a small, heavily guarded door open for extreme cases that he hoped would never happen?"
