answer: |-
  Here are 10 interview questions designed for your podcast assignment. They are structured to move from linguistic methodology to specific philosophical objections, ending with the falsifiability constraint you requested.

  The five mandatory topics (Classifiers, *Fei*, Hard/White, Hui Shi, Falsifiability) are marked with **[M]** and include the predicted follow-ups you asked for.

  ### 1. The Linguistic Landscape Since Hansen
  Chad Hansen's original mass-noun hypothesis was published in 1983. In the forty years since, computational linguistics and corpus studies of Classical Chinese have advanced significantly. Rather than re-summarize Hansen's original argument, could you pinpoint one specific piece of syntactic or philological evidence available *now* that wasn't available to Hansen, which your book leverages to shore up the mereological reading?

  ### 2. The Classifier Objection **[M]**
  The most persistent grammatical objection to the mass-noun hypothesis comes from Christoph Harbsmeier, who argues that Classical Chinese *does* possess a system of measure words and classifiers, which implies count-noun syntax. If Chinese speakers could count "three horses" using classifiers, doesn't that undermine the idea that *ma* (horse) functions purely like "water" or "sand"? How do you reconcile the existence of classifiers with a strict mereological semantics?

  *   **Predicted Answer:** She will likely argue that classifiers in early Chinese are optional, pragmatic, or later developments that don't govern the core semantics of the bare noun in the Warring States period.
  *   **Follow-up:** If she argues they are optional or pragmatic: "Even if optional, their presence in early texts like the *Zuo Zhuan* suggests the conceptual machinery for individuation existed. Are you arguing Gongsun Long is deliberately ignoring a functioning grammatical feature to make his point, or that those early classifiers aren't truly individuating in the way Harbsmeier claims?"

  ### 3. The Equivocation Charge on *Fei* **[M]**
  Critics following Fung Yu-lan often argue that the "White Horse is not Horse" argument only works if *fei* ("is not") slides equivocal between "is not identical to" and "is not a member of." Your reading suggests *fei* consistently marks non-identity of mereological sums. But if the semantics are consistent, why does the dialogue feel like a paradox to readers? Is the "puzzle" purely a result of modern translators forcing set-theory onto mass terms?

  *   **Predicted Answer:** She will likely say the paradox is an artifact of translation and that for a Classical speaker, the distinction between the compound stuff (white-horse) and the simple stuff (horse) is straightforwardly non-identical.
  *   **Follow-up:** If she says it's a translation artifact: "Then what is Gongsun Long's rhetorical goal? If it's a straightforward semantic point to a native speaker, why does he need a dialogue form that mimics a sophistical refutation? Is he training students to resist the 'common sense' conflation of compound and simple masses?"

  ### 4. Extending to "Hard and White" **[M]**
  Your book focuses heavily on the *White Horse Dialogue*, but Gongsun Long's *Hard and White Dialogue* seems to make a different move about the separability of qualities (hardness, whiteness) from the object (stone). Can the mass-noun/mereological framework handle this? Are "hardness" and "whiteness" treated as independent mass substances that overlap with "stone," or does this dialogue require a different ontology entirely?

  *   **Predicted Answer:** She will likely argue consistency: "Hardness" and "Whiteness" are also mass terms (sensory stuff) that do not necessarily overlap in the same spatial location, hence they are "separated."
  *   **Follow-up:** If she argues they are sensory mass substances: "Does this commit Gongsun Long to a kind of phenomenalism where 'hardness' exists even when nothing is being touched? How does your linguistic reading account for the ontological commitment to unmanifested qualities?"

  ### 5. Gongsun Long vs. Hui Shi **[M]**
  Both Gongsun Long and Hui Shi are categorized under the "School of Names," yet their projects seem inverted: Gongsun insists on separating "white" from "horse," while Hui Shi's ten theses insist on the unity of differences (e.g., "Heaven and Earth are one"). If your linguistic reading is correct, do these two thinkers share the same underlying semantic assumptions about Classical Chinese nouns and simply draw opposite ethical conclusions, or does Hui Shi require a different linguistic analysis?

  *   **Predicted Answer:** She will likely argue they share the same linguistic premises (fluid boundaries of names) but Gongsun uses it to fix reference while Hui Shi uses it to dissolve boundaries.
  *   **Follow-up:** If she says they share premises but differ in goal: "Why then were they historically grouped together by critics like Xunzi? If their conclusions are opposites, does the 'School of Names' label reflect a shared method you've uncovered, or is it just a historiographical convenience that your linguistics actually complicates?"

  ### 6. The Mohist Canon Rebuttal
  The later Mohist Canons explicitly critique Gongsun Long's arguments, often using logical definitions that look surprisingly set-theoretic. If the mass-noun reading is the natural semantic baseline for the period, how do you explain the Mohists' ability to articulate a critique that seems to rely on distinction between "this" and "that" in a way that anticipates the class-inclusion model? Are the Mohists the exception that proves the rule?

  ### 7. Rectification of Names (*Zhengming*)
  If Classical Chinese nouns are mass terms referring to stuff rather than count terms referring to discrete entities or social titles, how does this shift our understanding of the Confucian project of *Zhengming* (Rectification of Names)? Does "rectifying names" become less about aligning titles with duties and more about properly dividing or portioning out social "stuff" or roles?

  ### 8. Translation and Pedagogy
  For the purpose of this podcast and for students encountering these texts for the first time: how do you translate *ma* in your head when reading Gongsun Long? Do you mentally substitute "horse-stuff," or do you keep "horse" and rely on the commentary to carry the mereological weight? How do we teach this without making the text sound alien to English speakers?

  ### 9. Metaphysical Implications
  If Hansen and your revised reading are correct, it suggests Classical Chinese metaphysics lacks a robust concept of individuation at the linguistic level. Does this mean early Chinese philosophers simply *couldn't* formulate problems of personal identity or discrete object persistence in the way Greeks did, or are they solving those problems using a mereological vocabulary we are misidentifying as logic puzzles?

  ### 10. Falsifiability and Evidence **[M]**
  Finally, I want to ask about the limits of the hypothesis. Much of the defense of the mass-noun reading involves explaining away counter-evidence as later interpolations or pragmatic exceptions. What specific piece of linguistic evidence—a syntactic construction, a textual usage, or an archaeological find—would actually count *against* your reading? I'm not asking what proves Gongsun Long isn't a sophist, but what would prove the mass-noun semantic hypothesis itself is wrong.

  *   **Predicted Answer:** She might cite a specific pre-Qin syntactic structure where a noun *must* take a numeral without a classifier to be grammatical, which would force a count-noun reading.
  *   **Follow-up:** If she cites a specific syntactic constraint: "Given the high rate of textual corruption and variant characters in Warring States manuscripts, how do we distinguish between a genuine syntactic counter-example and a corrupted text that just *looks* like a counter-example? Is the theory robust enough to survive the messiness of the received text?"
