      *   *Tweaking Q10:* This needs to be the killer. If she says "substrate doesn't matter," I need to ask about *causal leverage*. If the substrate determines *how* we fix it, then the unification is descriptively interesting but prescriptively useless. Let's frame it around *reversibility* or *intervention*.

