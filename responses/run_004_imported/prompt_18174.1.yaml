answer: |-
  Here are 9 interview questions designed for your living room podcast. They are conversational but philosophically sharp, aimed at pinning down the Constitution View without letting your guest hide behind "primitiveness."

  Each question includes a anticipated "dodge" and a specific follow-up to keep the pressure on.

  ### 1. The Grounding Problem (The Core Attack)
  **Question:** "Let's start with the hard case. You say the statue and the lump share every single micro-physical particle, arranged in exactly the same way, at the same location. Yet, the lump could survive being squashed, and the statue couldn't. If the physical base is identical, what *in the world* makes that modal difference true? Is there a truthmaker here, or are we just saying the universe has brute modal facts that float free of the physical stuff?"

  *   **Likely Dodge:** She'll say the difference is grounded in the *sortal concepts* (what kind of thing it is), not the matter.
  *   **Follow-Up:** "Okay, but sortals are our concepts. Are you saying the physical object itself changes its modal profile just because we categorize it differently? If the sortal is mind-independent, where does it live? If it's mind-dependent, then the statue's survival conditions depend on *us*, which seems to make the ontology subjective."

  ### 2. Derivative vs. Non-Derivative Properties
  **Question:** "You use this distinction where the lump has the property 'being made of clay' non-derivatively, but the statue has it only *derivatively*. Conversely, the statue is an 'artwork' non-derivatively, and the lump only derivatively. When the statue sits on my shelf, is that derivative property of 'being made of clay' doing any real work? Or is it just a way of speaking to save us from saying the statue *is* the clay?"

  *   **Likely Dodge:** She'll insist derivative properties are real, just possessed in virtue of the constituting object.
  *   **Follow-Up:** "If they are real, then the statue *really* is made of clay. If it *really* is made of clay, why can't it survive being squashed? It feels like 'derivative' is a label you paste on a property when you want it to count for existence but not for survival conditions. Can you give me an example of a derivative property that has causal power distinct from the non-derivative one?"

  ### 3. Causal Overdetermination
  **Question:** "Let's talk about causation. If the statue falls and shatters my window, presumably the lump of clay shatters it too, since they are in the same place at the same time. Do I have two distinct causes for one broken window? Are we committed to systematic causal overdetermination for every single action a material object takes?"

  *   **Likely Dodge:** She'll argue they don't compete; they cause it 'together' or as a unified whole, so it's not overdetermination.
  *   **Follow-Up:** "But if they are distinct objects, as you insist, then we have two distinct causal chains converging on one effect. If I remove the statue (conceptually), the lump still breaks the window. If I remove the lump, the statue ceases to exist. Isn't 'unified causation' just a polite way of saying we have one cause with two names? And if so, why do we need two objects?"

  ### 4. The Person/Body Analogy
  **Question:** "I want to run this same apparatus on us. You argue a Person is constituted by a Human Body, but not identical to it. Just like the statue and the lump. So, my body has a brain state that realizes pain. Do I feel the pain non-derivatively, and my body feels it only derivatively? Or does my body feel it non-derivatively, and I 'borrow' that feeling?"

  *   **Likely Dodge:** She will likely pivot to the "First-Person Perspective" (FPP), claiming only the Person has an FPP, which distinguishes them from the body.
  *   **Follow-Up:** "But the body has the nervous system that physically processes the nociception. If the body is a fully functioning human animal, isn't it a thinker? If the animal is thinking my thoughts and I am thinking my thoughts, and we are distinct, aren't there two thinkers in my chair? How does the FPP magically silence the animal's thinking?"

  ### 5. Challenging the "Primitive" Defense
  **Question:** "I know your go-to move here is to say the constitution relation is primitive. It's not reducible to identity or parthood; it just *is*. But in philosophy, we usually accept primitives to stop an infinite regress, not to stop an explanation at the first hurdle. What explanatory work is this primitive doing other than insulating the view from the Grounding Problem?"

  *   **Likely Dodge:** She'll compare it to other accepted primitives, like identity or instantiation.
  *   **Follow-Up:** "Identity is a logical requirement; instantiation is about universals. But constitution is a relation between two concrete, spatially coincident objects. If I ask a physicist how two things can be in the same place at the same time without being identical, they'll say 'impossible.' You're asking us to accept a metaphysical primitive that contradicts our best physical intuition. Isn't the cost of this primitive higher than just accepting identity?"

  ### 6. Leibniz's Law and Counting
  **Question:** "Leibniz's Law says if $x$ and $y$ have all the same properties, they are identical. You say they have different modal properties, so they are distinct. But if I count the objects in this room, and I count the lumps and the statues, am I double-counting? If I have 10 lumps and 10 statues, do I have 20 objects or 10?"

  *   **Likely Dodge:** She'll say we have 10 objects that fall under 20 sortals.
  *   **Follow-Up:** "But if I burn the room down, do 20 things cease to exist? If only 10 things burn, then the statue and the lump share their physical destruction. If they share their physical destruction, their coming-to-be, and their spatial location, in what sense are they numerically distinct? Is 'numerical distinctness' doing anything here other than preserving a logical technicality?"

  ### 7. The Temporal Boundary Problem
  **Question:** "Let's look at the moment the sculptor finishes the statue. At time $T1$, there is just a lump. At $T2$, there is a lump and a statue. What physically changed in that interval? If the particles didn't change, and the location didn't change, did a new object literally pop into existence ex nihilo? How does the universe know to create a second object just because an intention was fulfilled?"

  *   **Likely Dodge:** She'll say the *conditions* for constitution were met (the intention + the clay).
  *   **Follow-Up:** "But meeting a condition isn't a physical change. If I intend for this coffee mug to be a 'paperweight,' have I constituted a new object? If not, why does the sculptor's intention trigger the creation of a new entity while my intention doesn't? Where is the line between 'constituting a new object' and 'just describing an old one differently'?"

  ### 8. Ockham's Razor and Ontological Clutter
  **Question:** "We're multiplying entities beyond necessity here. For every material object, you posit a second, coincident object that shares its matter, location, and causal powers. What is the theoretical payoff? What problem does the Constitution View solve that the Identity View (Statue = Lump) doesn't, other than saving our pre-theoretical intuition that statues are special?"

  *   **Likely Dodge:** She'll argue the Identity View leads to absurdity (e.g., the lump surviving squashing means the statue survives squashing).
  *   **Follow-Up:** "But the Identity Theorist just says 'The statue is the lump, so if the lump survives squashing, the statue survives squashing—we just change our definition of statue.' That's one conceptual shift. Your view requires an ontological explosion. Why is it better to double the furniture of the universe than to adjust our definitions of 'statue'?"

  ### 9. The "Thinking Animal" Argument (Final Pressure)
  **Question:** "Returning to persons, because I think this is where the stakes are highest. If I am constituted by my body, and my body is a human animal, and human animals are capable of thought (as biology suggests), then my body is thinking. I am thinking. We are distinct. So there are two things thinking my thoughts. Why isn't this a reductio ad absurdum? How do I know *I* am the thinker and not the body that constitutes me?"

  *   **Likely Dodge:** She'll say the body doesn't think *non-derivatively*; only the person thinks.
  *   **Follow-Up:** "But the body has the brain. The brain is the physical substrate of thought. If the person thinks *in virtue of* the body thinking, then the body is the primary thinker. If the body *doesn't* think at all, then you're saying a fully functional human animal with a working brain doesn't think. That seems biologically false. Which horn of the dilemma do you take: two thinkers, or a non-thinking animal?"
