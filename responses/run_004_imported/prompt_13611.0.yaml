      *   **Perceptual Knowledge/Recognition (Knowing *What* it is like):** The user saw the actual bird. There's a qualitative difference between a mental image constructed from words and the sensory experience of the real object.
      *   **The "Gettier" Problem (sort of):** Is this justified true belief? Yes. Is it knowledge? Most would say yes.
      *   **The Friend's Claim:** The friend claims the visual encounter added *no* epistemic value. This is the weak point.
