answer: |-
  This is a sophisticated dispute that cuts to the heart of "anthropic reasoning"—how we use the fact of our own existence as data. Theo and Mara have inadvertently recreated a debate that has occupied philosophers of cosmology and probability (like Nick Bostrom, Ken Olum, and Radford Neal) for the last thirty years.

  Neither of them is obviously "wrong," but they are each highlighting different vulnerabilities in the logic. Here is a breakdown of who has the better of it at each step, followed by an assessment of whether there is a principled way out.

  ### Move 1: Theo's Doomsday Argument
  **The Claim:** Since I am roughly the 100-billionth human, and I should regard myself as a random sample from all humans who will ever live, it is unlikely that the total number of humans will be vastly larger than 100 billion. Therefore, humanity is likely to end sooner rather than later.
  **The Principle:** This relies on the **Self-Sampling Assumption (SSA)**. SSA says: *Reason as if you are a random observer drawn from the set of all actual observers in your reference class.*

  **Who wins?** **Theo (technically), Mara (intuitively).**
  Theo is logically consistent *if* you accept SSA. In Bayesian terms, your birth rank is indeed "indexical evidence." If there were going to be 100 trillion humans, it would be incredibly improbable for you to be among the first 0.1%. The fact that you are early updates the probability against the "100 trillion" hypothesis.
  However, Mara's intuition is shared by most people: it feels like magic to derive the fate of civilization from a birth certificate. The weakness in Theo's move isn't the math; it's the reference class. Why "all humans"? Why not "all humans who know about the Doomsday Argument"? Changing the reference class changes the result, which suggests the argument is fragile.

  ### Move 2: Mara's "Armchair" Objection
  **The Claim:** You can't derive facts about the physical world (asteroids, wars) purely from arithmetic about your birth rank without empirical data.
  **The Principle:** This is an objection to **non-empirical updating**.

  **Who wins?** **Mara (rhetorically), Theo (formally).**
  Mara is voicing a common-sense objection: evidence about the world should come from the world. However, in modern epistemology, "I exist at time *t*" *is* a fact about the world. Theo is correct that Bayesian reasoning allows us to update probabilities based on any evidence we possess, including facts about our own position.
  That said, Mara is right to be suspicious. If this reasoning were robust, we could prove all sorts of things from our armchairs. Theo has the formal advantage, but Mara has the "smell test" advantage. In philosophy, when a formal argument violates strong intuitions without empirical payoff, the burden of proof is on the formalist.

  ### Move 3: Theo's Boltzmann Brain Analogy
  **The Claim:** Physicists use this same reasoning to reject cosmological models that predict "Boltzmann Brains" (randomly fluctuated conscious entities). If a model predicts most observers are Boltzmann Brains, and I am clearly not one, that model is disfavored.
  **The Principle:** **Typicality.** We assume we are typical observers under a given theory. If a theory makes us atypical, the theory is likely false.

  **Who wins?** **Theo.**
  This is Theo's strongest move. The Boltzmann Brain problem is a genuine crisis in modern cosmology, and the proposed solution *is* structurally identical to the Doomsday Argument. Physicists argue that if a cosmological model implies that 99% of observers are delusional fluctuations, and we observe ourselves to be stable, evolved beings, we have evidence against that model.
  Theo is correct that Mara cannot simply dismiss the *form* of the argument as illegitimate, because it is currently being used to constrain theories of the multiverse. If the move is valid for cosmology, it is hard to claim it is invalid for demographics without explaining the relevant difference.

  ### Move 4: Mara's SIA and Presumptuous Philosopher Reply
  **The Claim:** The Boltzmann Brain argument actually favors theories with *more* observers like you (Self-Indication), while Doomsday requires sampling from *actual* observers (Self-Sampling). If you use the rule that saves you from Doomsday, you become a "Presumptuous Philosopher" who can count observers to determine the size of the universe without looking.
  **The Principle:** This highlights the conflict between **SSA** (Self-Sampling Assumption) and **SIA** (Self-Indication Assumption).
  *   **SSA:** I am a random sample from existing observers. (Leads to Doomsday).
  *   **SIA:** I should favor hypotheses that contain more observers. (Avoids Doomsday, but leads to Presumptuous Philosopher).

  **Who wins?** **Mara.**
  This is the checkmate. Mara has identified the central dilemma of anthropic reasoning.
  *   If Theo sticks with **SSA** (to make Doomsday work), he must accept that we can reject cosmological theories that predict too many observers (like Boltzmann Brains). This is generally accepted.
  *   However, if Theo tries to use **SIA** to *escape* the Doomsday conclusion (by saying "There are likely more humans in the future, so I'm more likely to exist if the future is large"), he opens the door to the **Presumptuous Philosopher**.
      *   *The Thought Experiment:* Two theories of physics. Theory A says the universe has 1 trillion observers. Theory B says it has 1 trillion trillion. They are otherwise equal. A philosopher using SIA says Theory B is a trillion times more likely *without doing any experiments*, simply because it has more people. This is widely regarded as absurd.

  Mara is correct that Theo cannot have it both ways. He cannot use the reasoning that creates the Doomsday Argument (SSA) while simultaneously relying on the reasoning that solves the Boltzmann Brain problem if that reasoning implies SIA. There is a trade-off: **SSA gives you Doomsday; SIA gives you Presumptuousness.**

  ### The Core Question: Is there a principled way to decide?

  You asked whether there is a principled way to decide when facts about your position carry weight, or if Theo and Mara are just cherry-picking rules to avoid conclusions they dislike.

  **The uncomfortable truth is: There is currently no consensus.**
  This is known as the **Anthropic Trilemma**. You generally have to choose one of three unpalatable options:
  1.  **Accept SSA:** You accept the Doomsday Argument (humanity likely ends soon).
  2.  **Accept SIA:** You accept the Presumptuous Philosopher (you can count observers to do physics).
  3.  **Reject Anthropics:** You claim that "I am observer X" carries no evidential weight at all (which makes it hard to solve the Boltzmann Brain problem).

  **Are they cherry-picking?**
  To some extent, **yes.** This is a known risk in this field called "motivated reasoning in anthropic principles."
  *   Theo wants to take the Doomsday Argument seriously, so he leans on SSA.
  *   Mara wants to avoid the Doomsday conclusion, so she points out that SSA leads to other weirdness, implicitly hoping for SIA (or a rejection of the reasoning), even though SIA has its own absurdities.

  However, it is not *mere* cherry-picking. It is an attempt at **Reflective Equilibrium**. We have a set of intuitions (Doomsday feels wrong; Presumptuous Philosopher feels wrong; Boltzmann Brains feel wrong). We are trying to find a set of rules that minimizes the number of intuitions we have to violate.
  *   Theo is willing to violate the intuition that "you can't predict the future from birth rank" to save the intuition that "we aren't Boltzmann Brains."
  *   Mara is willing to risk the Boltzmann Brain problem to save the intuition that "Doomsday is absurd."

  ### How to settle it for yourself

  If you want to adjudicate this in your group, suggest the following framework:

  1.  **Acknowledge the Trade-off:** Admit that Mara is right about the tension. You cannot consistently hold that the Doomsday Argument is fallacious *and* that the Boltzmann Brain argument is sound without a very nuanced distinction between the two cases.
  2.  **The Reference Class Solution:** The most popular "middle ground" among philosophers today is to argue that the **Reference Class** matters.
      *   For the Doomsday Argument, the class "all humans who will ever live" is too broad. We should restrict the class to "humans with access to this specific information" or "humans in this specific technological epoch." If you restrict the class, the Doomsday conclusion vanishes.
      *   For Boltzmann Brains, the class "all observers" is appropriate because the physical state (stable vs. fluctuating) is the relevant variable.
  3.  **Full Non-Indexical Conditioning (FNC):** Mention that some philosophers (like Radford Neal) propose a method where you condition on *all* your evidence, including your memories and physical state, rather than just "I am an observer." This tends to dissolve the Doomsday Argument while keeping the Boltzmann Brain rejection intact, though it is mathematically complex.

  **Verdict:**
  Mara has the better of the argument overall because she successfully exposed the inconsistency in Theo's position (the SSA/SIA trade-off). Theo's analogy to Boltzmann Brains was strong, but Mara's counter-move (The Presumptuous Philosopher) is the standard rebuttal in the literature for a reason: it shows that the "easy way out" of the Doomsday Argument leads to an even bigger absurdity.

  Theo is not "wrong" to use SSA, but he must accept the Doomsday conclusion if he does. Mara is right that he cannot invoke anthropic reasoning only when it suits him. The principled way forward is to admit that **indexical facts do carry evidential weight, but we do not yet agree on the correct rule for weighing them.** Until that rule is settled, skepticism toward the Doomsday Argument is the more prudent position, simply because the cost of being wrong about Doomsday (panic) is lower than the cost of being wrong about Presumptuousness (abandoning empirical science).
