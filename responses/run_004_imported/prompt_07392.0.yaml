answer: |-
  Thank you all for being here. For those who don't know me, I was one of Ruth's students, twenty years ago. But like many of you, over the last two decades, I came to know her as something closer to a second mother.

  If you knew Ruth, you know she would hate this. She would hate the idea of us standing around speaking in the past tense, as if her work were finished. And she would definitely hate it if I tried to comfort you by saying that "everything happens for a reason," or that democracy is destined to survive because it always has. Ruth never let anyone call her an optimist. She corrected us, gently but firmly: she was a *meliorist*.

  It's a word she picked up from the pragmatist philosophers, people like John Dewey. Optimism says things will get better on their own. Pessimism says they're doomed. Meliorism says things *can* get better, but only through specific, fallible effort. There is no guarantee from history that we will succeed, and no license to assume we won't. It is a demanding philosophy. It offers no rest.

  I thought a lot about this distinction this week. Actually, I was arguing about it. A friend and I spent two hours debating whether the idea of democracy as a shared experiment is still possible, or if we've become too tribal to listen to one another. She thinks the idea is naive. I told her that the fact we could argue for two hours, revise our positions, and still part as friends was proof that it isn't.

  But I couldn't finish the argument, because I got the call that Ruth was gone. And standing here, I realize that Ruth wouldn't care who won that debate. She would care about whether we keep having it.

  To her family and neighbors: I know that sometimes, at dinner, this felt exhausting. You wanted to talk about the weather, or the football game, and Ruth would turn the conversation toward the news, toward the school board, toward the consequences of a policy on a neighborhood down the street. She didn't do this because she enjoyed fighting. She did it because she believed that democracy isn't a building we go to, or a set of institutions we defend like a museum exhibit. It is a habit. It is the muscle we build when we test our ideas against each other.

  To her former students, the journalists and political scientists in the room: you know that she never gave us answers. She gave us methods. She taught us that being wrong is not a moral failure, provided you are willing to revise your hypothesis when the evidence changes. She taught us that certainty is the enemy of progress.

  It is tempting, today, to look at the world and feel that the experiment has failed. It is tempting to mourn a golden age that never really existed. Ruth would tell you that nostalgia is a trap. The world was never fixed; it was always broken, and always being repaired by people who refused to sit down.

  So, how do we honor her? We don't honor her by promising that things will be okay. They might not be. We honor her by refusing to assume they won't be. We honor her by keeping the dinner table arguments going, but keeping them honest. We honor her by treating our neighbors not as enemies to be defeated, but as collaborators in a problem we have to solve together.

  She was not a dreamer. She was a worker. She believed that the world is clay, and it is in our hands. It might dry out. It might crack. But if we keep working it, together, it can take a better shape.

  Ruth, you taught us that the work is the point. We'll take it from here. No promises. Just the work.

  Thank you.
