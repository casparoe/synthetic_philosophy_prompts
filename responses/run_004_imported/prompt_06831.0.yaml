prompt: |-
  My great-uncle Gerrit died three weeks ago at eighty-six, and because I'm "the writer in the family" I've somehow ended up on the hook for the eulogy, which is a problem, because Gerrit spent almost fifty years forging paintings -- mostly minor Dutch Golden Age stuff -- and was good enough that at least one museum still has a piece of his hanging under a real painter's name and has no idea. I've been quietly mining his life for a novel for a couple of years now (my writing group has heard way more about him than they signed up for), so I know his views better than I'd like to. He left a note, found by my aunt, saying he didn't want whoever spoke to apologize for him or treat his life's work like a string of victimless pranks. He was proud of it right to the end, and his standing line was that a forgery good enough to fool the experts had achieved everything the original achieved, and that "authenticity" was basically a story the market tells about provenance and money, not something you can actually see or feel in the paint itself. He genuinely believed that -- it wasn't just a con man's excuse.

  The trouble is the room. Half of it is family and old neighbors who just want to hear that he loved us and cry a normal amount. The other half includes people he actually fooled, among them a retired auction-house specialist and the conservator who spent two years proving that one of his "Cuyps" was fake before anybody believed her, and they will absolutely be listening for whether I let him off the hook. I don't want to lie for him up there, and I don't want to turn a funeral into a seminar on weather he was an artist or just a very patient liar, but I can't just ignore the note either. Could you write the eulogy for me? Five to seven minutes spoken, it has to actually comfort the ordinary half of the room, and it can't dodge the real question his whole life poses -- what, if anything, is lost when a copy is good enough that no one, including the eye, can tell -- by pretending that's an easy question, or by refusing to answer it at all.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A nephew/niece (the "writer in the family").
      *   **Subject:** Great-uncle Gerrit, died at 86.
      *   **The Twist:** Gerrit was an art forger (50 years), good enough that a museum still displays his work as real.
      *   **Gerrit's Philosophy:** Proud of his work. Believed a perfect forgery achieves everything the original does. "Authenticity" is a market story, not visual reality.
      *   **The Constraint (The Note):** No apologies. No treating his life as victimless pranks. He was proud.
      *   **The Audience:** Split 50/50.
          *   Group A: Family/Neighbors (want comfort, love, normalcy).
          *   Group B: The "Fooled" (Auction specialist, Conservator, etc. - watching to see if he's let off the hook).
      *   **The Goal:** 5-7 minutes spoken (approx. 750-1000 words). Comfort Group A without lying to Group B. Address the philosophical question (What is lost in a perfect copy?) without turning it into a lecture or a defense.
      *   **Tone:** Respectful, honest, nuanced, warm but unflinching.

  2.  **Determine the Core Theme:**
      *   The tension between *truth* and *beauty/perception*.
      *   Gerrit's life asks: Does the origin matter if the experience is identical?
      *   The eulogy needs to validate the family's love (which is real, regardless of his secrets) while acknowledging the experts' scrutiny (which is valid, regardless of his skill).
      *   *Key Insight:* Gerrit loved the *painting* more than the *fame*. He loved the *craft*. The family loved the *man*, not the legend.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the task. Establish the relationship. "The writer in the family." Set a warm tone for the family/neighbors.
      *   **Addressing the "Elephant in the Room":** Don't hide the forgery. It's known by half the room. Acknowledge it early but frame it through Gerrit's eyes (craftsmanship, devotion).
      *   **Gerrit's Philosophy (The Note):** Incorporate his view on authenticity without endorsing it as moral law. He believed in the power of the object itself.
      *   **Addressing the Experts:** Acknowledge their skill. Validating their work validates Gerrit's. It was a duel of mastery. No apologies, but no denial of the disruption he caused.
      *   **Addressing the Family:** How does this affect the love they shared? It doesn't change the memories. The "authenticity" of his love for them is not in question.
      *   **The Philosophical Question:** What is lost? Maybe trust. Maybe history. But what remains? Beauty. Skill. Devotion.
      *   **Closing:** Bring it back to the present moment. The grief is real. The memory is real.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too defensive?
      *   *Fix:* Ensure I acknowledge the conservator's work. She was right. He was fake. But his *skill* was real.
      *   *Critique:* Is it too cold/academic for the family?
      *   *Fix:* Use sensory details. The smell of turpentine, the light in his studio, the way he listened.
      *   *Critique:* Does it follow the note?
      *   *Fix:* Make sure I don't say "I'm sorry he did this." Instead, say "He asked me not to apologize."

  5.  **Drafting - Specific Phrasing:**
      *   *Opening:* "Standing here..."
      *   *The Work:* "He didn't steal money; he stole attention." (Maybe too glib). Let's focus on "He loved the Old Masters enough to become them."
      *   *The Experts:* "To those who caught him... you were the worthy adversary."
      *   *The Family:* "To us, he was just Uncle Gerrit."
      *   *The Philosophy:* "Authenticity is a story." Quote him.
      *   *The Conclusion:* "The grief you feel is not a forgery."

  6.  **Timing Check:**
      *   Average speaking pace is ~130-150 words per minute.
      *   5 minutes = 650-750 words.
      *   7 minutes = 900-1050 words.
      *   Target: ~900 words.

  7.  **Final Polish:**
      *   Check the rhythm. Eulogies need pauses.
      *   Ensure the transition between the "criminal" aspect and the "beloved uncle" aspect is smooth.
      *   Make sure the ending lands emotionally.

  **(Self-Correction during drafting):** I initially thought about making a joke about the paintings. *No.* The prompt says he was proud and didn't want it treated as pranks. Keep it solemn. The humor should be dry, if any. Focus on the *devotion* to the craft.

  Let's write.

  *Structure:*
  1. Intro: The writer role, the difficulty.
  2. The Man: Studio memories, the smell of paint.
  3. The Secret: Acknowledging the forgery without shame but without denial.
  4. The Experts: Acknowledging their truth vs. his truth.
  5. The Family: The authenticity of relationship.
  6. Conclusion: What remains.

  *Key phrase to include:* "Authenticity was basically a story the market tells."
  *Key constraint:* No apologies.

  *Drafting thought:* I need to make sure the conservator feels respected. If I glorify Gerrit too much, they will be angry. If I condemn him, I violate his note. The middle path: Respect the *skill*, acknowledge the *deception*, honor the *man*.

  *Final check on word count:* Aiming for roughly 900 words.

