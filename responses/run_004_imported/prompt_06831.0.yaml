answer: |-
  Thank you for being here. For those of you who don't know me, I'm [Name]. Gerrit was my great-uncle. In the family lore, I am designated "the writer," which is a polite way of saying I ask too many questions and remember the answers. That is why I am standing here today. It is also, perhaps, why Gerrit and I understood each other. We both spent our lives looking closely at things other people glanced at.

  Gerrit died three weeks ago. He was eighty-six. For fifty of those years, he woke up before dawn, made coffee, and went into his studio to mix paints. He loved the smell of linseed oil and turpentine more than any cologne. He loved the silence of a canvas more than the noise of a party. If you knew him as a neighbor, you knew he was quiet, precise, and incredibly kind. If you knew him as family, you knew he was stubborn, brilliant, and that his love was a steady, warm thing.

  But we are not here to tell simple stories. Gerrit wouldn't have wanted that. And half of you in this room know that Gerrit's life was not simple.

  Gerrit was a forger. He spent five decades painting in the styles of the Dutch Golden Age. He was good enough that his work hangs in museums today. He was good enough that some of you in this room spent years proving him wrong.

  He left a note before he died. He asked that I not apologize for him. He asked that I not treat his life's work as a string of victimless pranks. He was proud of his hands. He was proud of his eye. So, I will not apologize. I will not stand here and say, "He was a good man despite this." I am here to say that this was part of the man, and to ignore it would be to paint over the canvas.

  Gerrit believed something that makes most people uncomfortable. He believed that if a painting moves you, if it stops your breath, if it makes you feel the weight of light on a landscape or the texture of a collar, then it has done its job. He told me once, "Authenticity is basically a story the market tells about provenance and money. It is not something you can see in the paint."

  To the family and friends here: I know this is heavy. I know you might worry that if his art was a lie, then maybe the man was too. Maybe the love was a forgery.

  I am here to tell you that it wasn't. The way he listened to you when you were hurting was not a technique. The way he helped shovel snow from your driveway was not a performance. A forgery requires a desire to deceive for gain. But with us, he gained nothing but our company. He gave without an audience. The authenticity of a human being isn't found in their resume or their signature; it is found in their presence. And Gerrit was present. He was here. And the grief you feel right now is not a copy. It is real.

  To the experts, the conservators, and the specialists here: I see you. I know what you did. I know the science you applied. I know the years you spent under magnification proving that the craquelure was wrong, that the pigments were anachronistic. You were right. He was not Cuyp. He was not Pot. He was Gerrit.

  He respected you. In fact, he needed you. He often said that a forgery without an expert to catch it is just a practice exercise. You were his worthy adversaries. He didn't view your scrutiny as an attack; he viewed it as the necessary friction that proves the steel. He knew that history requires truth, even if he spent his life bending it. He understood that by forcing you to look closer, to develop better tools, to question more deeply, he was actually serving the art he loved. He forced the world to pay attention.

  So, what is lost when a copy is good enough that no one can tell?

  Something is lost. Trust is lost. History is lost. The specific connection between the hand of the master and the moment of creation is broken. We cannot pretend otherwise. When we look at a Gerrit pretending to be a Cuyp, we lose the truth of the 17th century.

  But something remains. The beauty remains. The discipline remains. The thousands of hours of devotion required to understand how light hits a glass of wine, or how a storm cloud builds over a dune—that devotion is real. Gerrit loved the Old Masters so much he was willing to erase himself to let them speak. That is a kind of worship. It is a complicated, messy, ethically fraught worship, but it was worship nonetheless.

  We are gathered here to mourn a man who lived in the gray areas. He understood that the world wants things to be black and white: real or fake, good or bad, saint or sinner. But paint is mixed. Life is mixed.

  To the family: You can keep your memories. They are not tainted.
  To the experts: You can keep your truth. It is not diminished.
  And to Gerrit: You kept your pride.

  He asked me to end by saying this: The paint dries. The canvas stays. The story changes.

  We are left with the canvas. We are left with each other. And we are left with the truth that while Gerrit may have painted lies, he lived a life that was entirely, unapologetically his own.

  Thank you.
