answer: |-
  The oil lamp guttered in the draft from the harbor, casting long shadows over the wax tablets where the fleet's disposition was drawn. Dion, who had studied in Megara under the shadow of Diodorus Cronus, traced a finger along the line of the Ptolemaic ships. Across the table, Theon, a Peripatetic from the Lyceum, watched him with the stillness of a man listening for a distant bell. I sat between them, the map before me feeling less like a plan and more like a prophecy I was afraid to read.

  **Dion:** "The proposition stands before us, Commander. 'The Antigonid fleet breaks the line at dawn.' It is either true or it is false. There is no third state for a statement."

  **Theon:** "The disjunction is true—that much I grant. Either they break us, or they do not. But to say one limb of that pair is *already* true is to mistake the map for the terrain."

  **Dion:** "Tomorrow, when the sun sets, one limb will be a fact. And a fact, once past, is necessary. No god can make yesterday's wind blow differently."

  **Theon:** "Time confers necessity upon events, Dion, not upon propositions about them. That it *will be* necessary does not mean it *is* necessary now."

  **Dion:** "Consider the Master Argument. If it is possible we lose, yet we win, then a possibility failed to become real. But the impossible cannot follow from the possible. Therefore, if we win, it was never possible to lose."

  **Theon:** "You define 'possible' as 'what is destined to happen.' I define it as 'what is not prevented by nature.' Our ships are not prevented from sinking; that capacity exists, regardless of the outcome."

  **Dion:** "Then concede this logical chain: Necessarily, either we win or we lose. If the whole is necessary, the parts must be determined."

  **Theon:** "Here is the joint you force. I grant *Necessarily (Win or Lose)*. I deny *(Necessarily Win) or (Necessarily Lose)*. You have shifted the scope of the necessity from the disjunction to the alternatives."

  **Dion:** "If neither alternative is necessary, then the victory is uncaused. It is random chance, and your deliberation is theater."

  **Theon:** "It is not random; it is contingent. The cause is not a fixed truth hanging in the ether, but the sweat of the rowers and the angle of the rudder. We are the cause."

  **Dion:** "But does the truth of our victory exist before the oars bite the water? Does the statement correspond to reality tonight?"

  **Theon:** "No. That is the premise you hold that I reject. You believe truth binds the future. I believe the future binds the truth."
