          2.  **Escalation Path:** If AI vetoes, it doesn't just say "no." It flags to a senior editor + legal.
          3.  **Policy Alignment:** Safety filters must be updated to reflect journalistic standards (SPJ ethics), not just general consumer safety.
      *   *Tone:* Professional, firm, journalistic, solution-oriented.

