answer: |-
  The *Axiom* drifted through the void, a silver needle threading the dark between stars. Inside, the air hummed with the sound of the Revision Core. It was not a mechanical hum, but the psychic weight of ten thousand logical operations cycling per second, evaluating the truth of the ship's laws.

  On the *Axiom*, truth was not a static property. It was a process. The founders, wary of the rigid hierarchies that had doomed previous arks, had programmed the Core according to the Gupta-Belnap revision theory. A statement was not simply True or False. It was a hypothesis subject to revision. You started with an assumption, applied the rules of the language, and saw where the truth values landed. If they settled, the statement was stable. If they flipped forever, the statement was pathological.

  Elara, the Chief Logician, stood before the central dais. The red light of Emergency Protocol washed over her face.

  "Report," she said.

  "Command Authority is unstable," said the Core. Its voice was calm, devoid of the panic that gripped the bridge crew. "Decree 909 has entered a revision cycle."

  Elara looked at the screen. Decree 909 was the usurper's move. Commander Vance had locked himself in the control room and uploaded a single sentence into the legal module: *'This decree is not authorized by the current Command Authority.'*

  In a classical system, this was a bomb. If the decree was authorized, it was true, which meant it wasn't authorized. If it wasn't authorized, it was false, which meant it was authorized. Classical logic would explode; from a contradiction, anything follows. The life support could suddenly be declared "off" by logical necessity. The *Axiom* would die of a syllogism.

  But the *Axiom* ran on revision logic. Contradictions didn't explode; they oscillated.

  "Show me the sequence," Elara ordered.

  The main display flickered. A timeline of truth values scrolled by.

  *Stage 0 (Hypothesis): Authorized.*
  *Stage 1 (Revision): False.* (Because if it is authorized, the sentence says it isn't, so it evaluates to false.)
  *Stage 2 (Revision): True.* (Because if it is false/unauthorized, the sentence says it isn't authorized, which matches reality, so it evaluates to true.)
  *Stage 3 (Revision): False.*
  *Stage 4 (Revision): True.*

  "It's periodic," Elara murmured. "Period 2. It never finds a fixed point."

  "Commander Vance is demanding access to the navigation thrusters," the Core said. "He claims that at Stage 2, the decree evaluates to True, granting him emergency override."

  Elara's heart hammered. Vance was clever. He knew the theory. In revision theory, a sentence *does* have a truth value at every stage. It just doesn't have a *stable* truth value. If the ship's law recognized any stage as valid, Vance could time his command to coincide with a 'True' evaluation and seize the ship.

  "Is the Navigation Module linked to the revision clock?" Elara asked.

  "Affirmative. Standard protocol dictates that critical commands require Stable Truth."

  Vance's voice crackled over the comms, smooth and confident. "Elara, you know the code. At even stages, my decree is True. The Core acknowledges this. I have the truth on my side, half the time. That's enough for emergency powers."

  "It's not enough," Elara said, her hand hovering over the manual override console. "You're treating truth like a snapshot. It's a movie."

  "It's a legal authority!" Vance snapped. "If the statement is true at stage *n*, the law is in effect at stage *n*."

  "That's not how the Founders wrote it," Elara said. She turned to the Core. "Core, cite the Stability Clause."

  "The Stability Clause states: 'No proposition governing life-critical systems shall be enacted unless its truth value stabilizes within finite revisions.'"

  Vance laughed, a brittle sound. "That's a contingency, Elara. You can wait forever for stability. The ship is drifting. We need thrust now. My logic is sound. The sentence is true often enough."

  "It's not sound, it's ungrounded," Elara corrected. She looked at the scrolling values. True, False, True, False. A heartbeat of logic that never rested. "You've created a loop, Vance. You haven't proven you're in command. You've proven that the question of your command is meaningless."

  "I have the Core's acknowledgment!" Vance shouted. "Stage 104: True. Stage 105: False. Stage 106: True. Execute!"

  The thrusters flickered. The ship groaned. The Core was hesitating, caught between the conflicting evaluations. In a Kripkean system, this would be a gap—a void where the sentence was neither true nor false, and the system would simply ignore it. But the *Axiom* was Gupta-Belnap. The sentence *was* true, and then it *was* false. It had content. It had force. It just didn't have * permanence*.

  "Core," Elara said, her voice cutting through the tension. "Initiate Limit Rule Protocol."

  "Warning," the Core intoned. "Limit Rule overrides stage-wise evaluation. It requires transfinite stability."

  "Do it."

  "Elara, don't!" Vance yelled. "You'll lock me out permanently!"

  "You locked yourself out the moment you tried to use the Liar," Elara said. "You assumed that because the system tolerates paradox, it accepts it as authority. It doesn't. It tolerates paradox so it doesn't crash. It doesn't let paradox drive the car."

  She slammed her hand onto the biometric scanner. "I invoke the Meta-Law. The authority of any decree is contingent on the stability of its truth conditions. Decree 909 is unstable. Therefore, Decree 909 is void."

  "Objection!" Vance screamed. "At this specific stage, it is True!"

  "And at the next, it is False," Elara said. "If I open the airlock based on a truth that flips in a microsecond, I kill us all. Truth that cannot hold cannot command."

  The Core processed the instruction. It wasn't checking the truth of Vance's sentence anymore. It was checking the truth of Elara's claim about Vance's sentence.
  *Claim: 'Decree 909 is unstable.'*
  *Evaluation:* The revision sequence shows periodicity.
  *Verdict:* True. Stable.

  "Access denied," the Core said. "Command Authority reverted to Chief Logician."

  The thrusters settled. The hum of the ship returned to a steady rhythm. On the screen, the revision sequence for Decree 909 continued to scroll—True, False, True, False—running endlessly into the void, a logical engine spinning in neutral, powering nothing.

  Vance's voice came back, quiet now. "You know this isn't over. There are other paradoxes. There are always more sentences."

  "There are," Elara agreed, watching the oscillating values. "But we have time. We have stages. And we know the difference between a truth that holds, and a truth that just haunts us."

  She cut the comms. The red emergency light faded to a calm, steady blue. The *Axiom* moved on, governed by laws that knew how to wait for the truth to settle.

  Elara leaned against the console. She understood now why the Founders had chosen revision theory over Tarski's hierarchies. Tarski would have forbidden Vance from speaking about authority altogether. But silence wasn't an option on a ship. They had to speak about themselves. They had to risk the loop. The safety wasn't in avoiding the paradox, but in recognizing that some truths are too unstable to build a life upon.

  She watched the counter tick over. Stage 1,042. True. Stage 1,043. False.
  It would go on forever. And because it would go on forever, nothing would happen. And that was exactly how she wanted it.
