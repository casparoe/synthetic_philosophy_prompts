answer: |-
  This is an exceptionally sharp reading of the *Enquiry*. You have put your finger on one of the most famous and contentious cruxes in Hume scholarship. The tension you perceive between Section VII, Part I (where power seems "concealed" but perhaps present) and Part II (where the idea of power is declared meaningless) is the battleground upon which the "Old Hume" vs. "New Hume" debate is fought.

  Here is an analysis of how to reconcile those passages, the state of the scholarly dispute, and what it means for your train journey argument about Lewis and Armstrong.

  ### 1. Resolving the Textual Tension: Old Hume vs. New Hume

  Your intuition that the first passage sounds like "Skeptical Realism" (powers exist but are hidden) and the second sounds like "Projectivism/Eliminativism" (powers are fictions) is shared by many professional Hume scholars.

  **The "Old Hume" (Standard) Reading**
  Traditionally, scholars like Norman Kemp Smith, Barry Stroud, and Jonathan Bennett read Hume as an ontological eliminativist regarding causal powers. On this reading, there is no tension because Passage 1 is not an ontological claim but a phenomenological report.
  *   **Resolution:** When Hume says the power is "concealed," he does not mean "there is a power hidden behind a curtain." He means "we look for an impression of power in the object and find nothing." The phrase "actuates the whole machine" is a concession to the *vulgar* way of speaking or a description of the *appearance* of causation, not a commitment to its reality.
  *   **Passage 2** is the philosophical conclusion: Since we have no impression, we have no idea. If we have no idea, the term "power" refers to nothing. Therefore, causation *just is* constant conjunction plus a psychological habit.
  *   **Verdict:** On this reading, Hume is your ally. He is a proto-Lewisian.

  **The "New Hume" (Skeptical Realist) Reading**
  Starting in the 1980s (championed by Galen Strawson, Peter Kail, and others), a revisionist school argued that Hume was a *skeptical realist*.
  *   **Resolution:** They take Passage 1 literally. Hume believes there *are* real causal powers in nature ("actuates the whole machine"). However, his epistemology (the Copy Principle) dictates that we can form no *idea* of them because we lack the sensory impression.
  *   **Passage 2** is therefore an epistemic and semantic point, not an ontological one. When Hume says the words are "without any meaning," he means they have no *cognitive content for us*. We cannot reason about them, define them, or know them. But their lack of intelligibility does not entail their non-existence.
  *   **Verdict:** On this reading, Hume is closer to your friend. He agrees with Armstrong that there is a "something more" than regularity, but he disagrees that philosophy can tell us what it is.

  **The "Middle Way" (Semantic Focus)**
  Many contemporary scholars (e.g., Don Garrett, Helen Beebee) suggest the dispute is partly verbal. Hume's primary project in the *Enquiry* is not to map the furniture of the universe, but to map the *limits of human understanding*.
  *   **Reconciliation:** Hume is arguing that for the purposes of *science and philosophy*, we must treat causation as regularity. Whether there is a "secret sauce" of necessitation in the world is a question we must remain agnostic about. Passage 1 admits the agnosticism (we don't see the glue); Passage 2 enforces the methodological rule (therefore, stop pretending you know what the glue is).
  *   **Scholarly Consensus:** There is no consensus. The "New Hume" reading gained massive traction but has faced significant pushback recently. It remains a "live interpretive dispute," as you suspected.

  ### 2. Does This Matter for the Lewis vs. Armstrong Debate?

  This is the crucial pivot. Does the historical truth about Hume settle the metaphysical truth about laws?

  **The Distinction: Epistemology vs. Metaphysics**
  Hume's project was primarily epistemological and psychological. He asked: *How do we come to believe in causation?*
  Lewis's project is metaphysical. He asks: *What makes a law statement true?*

  *   **Lewis (Humean Supervenience):** Lewis makes a positive ontological claim: There is *nothing but* the spatiotemporal distribution of local qualities (the Humean Mosaic). Laws are not hidden powers; they are summaries. Lewis is more dogmatic than Hume. He doesn't just say "we can't know the powers"; he says "there are no powers."
  *   **Armstrong (Anti-Humean):** Armstrong argues that regularities need truthmakers. A mere summary of events cannot explain *why* the events happen or support counterfactuals. We need a relation of necessitation ($N(F, G)$).

  **If the "New Hume" is Correct:**
  If Hume was a skeptical realist, then **Lewis is not a faithful Humean.** Lewis denies the existence of the very powers Hume thought might exist (but be unknowable). In this scenario, the label "Humean Supervenience" is historically ironic. Lewis took Hume's *epistemic humility* and turned it into an *ontological denial*.
  *   *Impact on Debate:* It weakens the historical pedigree of the Humean view but does not invalidate Lewis's argument. Lewis can still argue that positing hidden necessitation is bad metaphysics (violating parsimony, etc.) even if Hume himself wouldn't have gone that far.

  **If the "Old Hume" is Correct:**
  If Hume was an eliminativist, then Lewis is a faithful descendant, though he formalizes Hume's insights using possible worlds semantics and decision theory, which Hume lacked.
  *   *Impact on Debate:* It strengthens the historical branding, but again, the metaphysical work is done by Lewis, not Hume.

  **The "Ancestry" Question**
  Can modern Humeans claim Hume in good conscience?
  *   **Yes, in spirit:** Hume definitely argued that we have no *evidence* for necessitation and that our idea of it arises from internal sentiment. This is the core intuition behind Humean Supervenience: modal features of the world do not supervene on anything other than the non-modal distribution of matters of fact.
  *   **No, in letter:** As you noticed, Hume is often more careful (or ambiguous) than Lewis. Lewis explicitly rejects the idea that there could be "hidden" necessary connections. Hume leaves the door slightly ajar (especially in Passage 1).

  ### 3. Advice for Your Debate

  You can tell your friend that you are both partially right about Hume, but that the modern debate has moved beyond him.

  1.  **On the Text:** Acknowledge that Passage 1 allows for a "Skeptical Realist" reading (your friend's point), but Passage 2 enforces the "Regularity" methodology (your point). The standard scholarly line is that Hume's *method* requires us to ignore hidden powers, even if their existence isn't strictly disproven.
  2.  **On the Metaphysics:** Point out that David Lewis knew Hume was ambiguous. Lewis adopted the label "Humean" to signal a commitment to **Supervenience**: the idea that there are no distinct modal facts over and above the pattern of local events.
      *   If you are defending Lewis, you are defending the claim that **ontological parsimony** outweighs the intuitive desire for "robust" laws. You argue that Armstrong's "necessitation" is a mystery (just as Hume argued in Passage 2) and that we shouldn't populate our ontology with mysteries just to satisfy an intuition about explanation.
      *   If your friend is defending Armstrong, they are arguing that **explanation requires truthmakers**. A summary (Lewis) cannot explain the instances; only a governing relation (Armstrong) can.

  **Conclusion:**
  The tension you found is genuine and reflects a 40-year scholarly war. However, for the purpose of your debate about laws of nature: **Hume's personal ontology matters less than the argumentative structure he inaugurated.**

  The "Humean" side of the modern debate claims Hume as an ancestor not because they are sure he was an eliminativist, but because he established the burden of proof: *If you claim there is necessary connection, show me the impression.* Lewis accepts that challenge and says, "Since there is no impression, we should build our metaphysics without it." Armstrong replies, "The impression is missing, but the metaphysical need remains."

  You can claim Hume in good conscience as the *instigator* of the debate, even if he might have been too much of a skeptic to fully endorse Lewis's dogmatic metaphysics. Your friend is right that Hume leaves room for realism, but you are right that Hume's *system* functions perfectly well without it.

  **Recommendation:** Cite the "Old Hume vs. New Hume" debate to show you've done your homework, but then pivot to the fact that Lewis explicitly argues we should prefer a metaphysics that doesn't rely on unintelligible "secret powers," regardless of whether Hume thought they existed. That keeps the argument in the realm of metaphysics, where it belongs, rather than getting stuck in exegesis.
