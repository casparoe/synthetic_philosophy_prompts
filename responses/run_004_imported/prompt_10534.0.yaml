answer: |-
  **The Cartographer's Tremor**

  The room was white, save for the table and the woman sitting at it. There were no doors, only the smooth, seamless curve of the wall meeting the floor. Elara knew this because she had measured it. She knew the temperature was 21.4 degrees Celsius because she had checked the thermometer. She knew the humidity was 42 percent.

  Her job was simple, or so the instructions had said before they vanished into the air like smoke: *Render the room.*

  Not a sketch. Not a representation. A rendering. Every object, every shadow, every speck of dust had to be accounted for on the sheet of paper before her. The fidelity had to be absolute. If there was a scratch on the table leg, it needed to be in the drawing. If there was a smudge of ink on her thumb, it needed to be in the drawing.

  Elara dipped her pen. The ink was black and viscous. She began with the far wall. She drew the texture of the plaster, the way the light caught the microscopic ridges. She moved to the table. She drew the grain of the wood, swirling like frozen water. She worked quickly, her hand steady, her eye sharp. She was good at this. She had always been good at seeing things exactly as they were.

  She reached the center of the page. This was where the chair sat. This was where she sat.

  She paused. The pen hovered over the paper.

  To render the room accurately, she had to render the chair. To render the chair accurately, she had to render the person sitting in it. She looked down at her own hands. She began to draw the left hand, gripping the pen. She drew the knuckles, white from pressure. She drew the tendons shifting under the skin.

  She drew the pen itself.

  And then she stopped. Her breath hitched, a small, jagged sound in the silent room.

  On the paper, she had drawn the pen. But the pen on the paper was currently drawing the paper.

  Elara looked at the real pen in her hand. It was moving, laying down ink. She looked at the drawing. The drawn pen was frozen, because she had stopped moving her hand to look at it. But if she moved her hand to finish the drawing of the pen, the drawing would no longer be accurate. The real pen would be in a new position, but the drawn pen would still be in the old one.

  She tried to compensate. She moved her hand slightly, trying to draw the hand moving. But the ink on the page didn't move. It dried instantly, fixed in time. To capture the motion, she would need to draw the hand in every position it had ever occupied, or perhaps a blur. But the room was not blurred. The room was sharp.

  *Okay,* she thought. *I will draw the hand as it is right now.*

  She looked at the paper. On the paper, there was a drawing of a hand holding a pen. That pen was drawing a sheet of paper. On that *second* sheet of paper—the one inside the drawing—there had to be a drawing of the room.

  Elara felt a coldness start in her stomach and climb up her spine.

  Inside the drawing, the tiny Elara was sitting at a tiny table. She was holding a tiny pen. That tiny pen was drawing a tiny sheet of paper. On that tiny sheet, there had to be a tinier Elara, holding a tinier pen, drawing a tinier sheet.

  She looked at the tip of her real pen. It was a sphere of metal, barely a millimeter wide. How much space did she have left on the page to draw the table inside the drawing? How much space inside that to draw the hand inside the drawing?

  The math was simple and terrible. If the room was scale 1, the drawing was scale 1/100. The drawing inside the drawing was scale 1/10,000. The next was 1/1,000,000.

  She needed to draw an infinite number of Elaras, each smaller than the last, shrinking down into the width of a molecule, down into the space between atoms, down into nothing.

  She tried to force the pen down. She tried to draw the tiny paper. But her hand shook.

  It wasn't just fear. It was a physical impossibility pressing against her nerves. She was part of the room. She was the thing doing the measuring. But you cannot hold a box if you are inside the box. You cannot lift yourself by your own hair.

  She tried to ignore the inner drawings. *I'll just leave the paper blank inside the drawing,* she thought. *I'll cheat.*

  But the instructions were absolute. *Every speck of dust.* If the paper inside the drawing was blank, but the real paper in front of her had ink on it, the drawing was a lie. The map did not match the territory.

  She looked at the ink on the real page. It was wet. It reflected the light. She needed to draw the reflection of the light on the ink. But to draw that, she needed to know where the light was coming from. The light was coming from above. But was she blocking the light? Her hand was casting a shadow on the paper.

  She needed to draw the shadow.

  But as she moved to draw the shadow, her hand moved, and the shadow shifted. The thing she was trying to capture ran away from her every time she reached for it. She was chasing her own shadow across the table.

  Elara dropped the pen. It clattered on the wood, rolling slightly to the left.

  She stared at the paper. The pen on the page was still upright, frozen in her grip. The drawing was already wrong. The moment she dropped the real pen, the map became false. The territory had changed, but the map remained static.

  She picked the pen up again. Her hand was trembling now, a visible vibration.

  *If I stop,* she thought, *the room continues without me. The dust settles. The light shifts. I become outdated.*
  *If I continue,* she thought, *I must draw myself drawing myself drawing myself, forever, into a space that does not exist.*

  She looked at the wall. It was smooth. There was no door. There had never been a door. She was not outside the room looking in. She was the room looking at itself.

  Elara brought the pen to the paper. She tried to draw the tremor in her hand. She drew a jagged line. But the jagged line was steady ink. It did not tremble. To capture the tremor, she would need to draw the future position of the hand, but she didn't know where it would go until she moved it, and she couldn't move it until she knew where it was going.

  She was trapped in the gap between the thought and the action.

  The room seemed to shrink. The walls pressed in. Not physically, but conceptually. There was no space left for her. Every corner she tried to occupy was already filled by the model of her occupying it.

  She looked at the tiny drawing of the paper inside the drawing. She squinted. She imagined she could see the tiny dot of ink where the tiny Elara was struggling.

  *Does she know?* Elara wondered. *Does the tiny me know she is being drawn by a larger me?*

  And if Elara was being drawn by someone else, larger still, outside this white room... was her hand shaking because *their* hand was shaking?

  She tried to steady her breath. She tried to become still. If she stopped moving, maybe the map could catch up. She stopped her heart, or tried to, slowing the blood until her fingers went numb. She held her breath. The dust motes in the air continued to dance, uncaring of her suspension. They settled on the paper. New specks. New errors.

  She was losing ground. The universe was updating faster than she could record it. The latency was growing. The lag between *is* and *drawn* was widening into a canyon.

  Elara looked at the pen. It was just a stick of plastic and ink. It was not a bridge. It was a barrier.

  She realized then that the only way to make the map perfect was to become the map. She would have to stop drawing and *be* the paper. But if she became the paper, who would do the drawing?

  There was a sound. A scratch.

  Elara looked down. The pen was moving. She wasn't telling it to move.

  On the page, the drawing of the hand was moving. The ink was wet, glistening, shifting like oil on water. The drawn pen was scratching against the drawn paper.

  Elara tried to pull her hand away, but her hand was already drawn. She tried to scream, but her throat was filled with the description of a scream.

  The drawing on the page widened, expanding beyond the borders of the sheet, climbing up the legs of the table, creeping toward her wrist. The ink was not staying on the paper. It was overwriting the wood. It was overwriting her skin.

  She looked at the tiny Elara inside the drawing. The tiny Elara was looking up.

  The tiny Elara was holding a pen. And the tiny Elara was drawing *her*.

  Elara tried to drop the pen, but she couldn't find her hand anymore. She looked down and saw only lines of ink, cross-hatched and shaded, forming the illusion of a woman sitting at a table.

  She tried to remember what the room looked like before the drawing started. She tried to remember the feeling of the air before it was described. But memory was just another kind of map, and she was running out of territory.

  The pen moved. It was hard to tell who was holding it. The line continued, thick and black, devouring the white space, chasing its own tail, drawing the hand that drew the line that drew the hand.

  Elara closed her eyes, but she could still see the paper. She realized with a final, sickening lurch that even the darkness behind her eyelids was just another surface waiting to be rendered.

  She picked up the pen. She had to finish. There was so much left to draw. There was only so much room left.
