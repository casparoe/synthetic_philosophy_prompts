          *   *Robots:* A robot trained to pick up cups fails if the tablecloth changes pattern. It didn't learn the *invariants* (frame axioms equivalent).

  7.  **Final Polish:** Ensure the distinction between the "Engineering Frame Problem" (solved) and the "Philosophical Frame Problem" (unsolved) is crystal clear. This is the core insight the TA needs. Emphasize that Dennett's R2D1 isn't just about logic loops; it's about the impossibility of pre-computing relevance.

