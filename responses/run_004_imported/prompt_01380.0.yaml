prompt: |-
  Okay so last night I got into a whole thing with my friend Dev over beers about the hole argument (we're both taking a phil of physics seminar this term) and I've been chewing on it all day, mostly because we actually agreed on the first part! We both bought that naive manifold substantivalism is toast: once you see you can build a diffeomorphism thats the identity everywhere outside some "hole" region H but does something wild to the metric inside it, and Leibniz equivalence tells you (M,g) and (M,g*) are just two descriptions of the same solution, a substantivalist who thinks bare points carry their identity with them across models is stuck with this bizarre indeterminism that even full knowledge of the entire universe outside H couldn't fix. Fine, we agreed, ditch that view. But then we got into "sophisticated" substantivalism — give up haecceitism about points so the two models count as depicting the same possibility — and that's where it got heated. Dev's whole position is that once you're an anti-haecceitist substantivalist like that, you've secretly become a relationalist wearing a substantivalist costume, since there's no remaining fact a relationalist can't also help themselves to. I don't buy it, but by like 1am I honestly couldn't say what was left of my view that wasn't just words, which is bugging me.

  So: could you write me a dialogue between a sophisticated (anti-haecceitist) substantivalist and a relationalist about spacetime, set right after they've both worked through the Earman-Norton hole argument and agreed naive substantivalism is dead? I want the actual content to be them trying to figure out, move by move, whether what remains between them is a substantive metaphysical disagreement or a merely verbal one dressed up in different notation — getting into specifics like whether counterpart-theoretic readings of the diffeomorphism actually buy the substantivalist anything, and whether the relationalist can account for spatial structure without anything to play the role of relata. Please make them evenly matched (no strawmanning either side) and have them genuinely respond to each other's specific moves rather than just restating their starting positions past one another.
