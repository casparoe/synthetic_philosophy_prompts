      *   *Emphasis:* Strengthen the distinction between "Pragmatic" (Dutch Book/Utility) and "Alethic" (Truth/Accuracy). The fear is that pluralism forces us back to Pragmatism. I need to show it forces us to *Value Pluralism* within the Alethic domain, not Pragmatism.

  7.  **Final Output Generation** (Proceed to write the essay based on these thoughts).
answer: |-
  **Title:** The Floor, The Ceiling, and The Metric: Defending Alethic Pluralism in Accuracy-First Epistemology

  **Introduction**

  The trajectory of the accuracy program in formal epistemology is a study in refinement. When Jim Joyce launched the project in 1998, the promise was bold: ground the norms of rational credence purely in the epistemic goal of accuracy, bypassing the pragmatic entanglements of Dutch Book arguments. The core mechanism was accuracy-dominance: if your credences violate the probability axioms, there is always an alternative set of credences that is closer to the truth in every possible world.

  However, as you noted in your seminar, the devil lies in the measure of "closeness." Joyce's original axioms for legitimacy were critiqued by Patrick Maher as question-begging, designed to yield probabilism rather than flowing from independent epistemic principles. The field subsequently pivoted to the requirement of *strict propriety*, crystallized in the work of Predd et al. (2009). This move secured the mathematical machinery: any incoherent credence function is dominated by a coherent one under any strictly proper scoring rule.

  But this victory comes with a cost. While Probabilism emerges invariant across all strictly proper rules, the further normative ambitions of the accuracy program do not. The Brier score permits extreme credences (0 or 1); the Log score forbids them via infinite penalty. Some rules support Conditionalization as the unique updating strategy; others do not. This "residual pluralism" raises a threatening question: If accuracy cannot uniquely determine the full suite of Bayesian norms, does the project collapse back into pragmatism? Or is the choice of scoring rule itself a pragmatic intrusion?

  I argue for the latter option: **Residual pluralism does not undermine the accuracy program's claim to be a purely alethic foundation for Probabilism.** The fact that different strictly proper rules yield different secondary norms is not a bug that forces us back to pragmatism; it is a feature reflecting genuine, underdetermined alethic values. The accuracy program successfully establishes a non-pragmatic *floor* for rationality (Probabilism), even if it requires supplementary premises to build a specific *ceiling* (full Bayesianism). To demand more is to misunderstand the scope of purely alethic justification.

  **The Invariance of the Floor**

  To evaluate the threat of pluralism, we must first acknowledge the magnitude of the invariant result. The Dutch Book argument justifies Probabilism by linking incoherence to guaranteed practical loss. Critics have long argued that this conflates epistemic rationality with prudential rationality; why should a logic of belief be beholden to a logic of betting?

  The accuracy-dominance argument severs this link. It shows that incoherence is *epistemically* suboptimal, regardless of the agent's desires or betting dispositions. Crucially, this result holds for *every* strictly proper scoring rule. Whether you measure inaccuracy via Brier (squared error), Log (logarithmic), or Spherical rules, the geometry of coherence remains the same. The set of coherent credences is the convex hull of the truth values, and any point outside this hull has a projection inside it that is strictly closer to the truth.

  This invariance is the "hard win" of the accuracy program. It secures the claim that Probabilism is a requirement of epistemic rationality *as such*, not merely a constraint on agents who happen to care about avoiding Dutch Books. If the only goal of the accuracy program were to vindicate the probability axioms without pragmatic contamination, the project would already be a success. The pluralism arises only when we ask the program to do more work.

  **The Nature of the Pluralism**

  The worry is that if Brier and Log rules disagree on the permissibility of extreme credences (Cromwell's Rule), then accuracy alone cannot tell us whether it is irrational to be certain. If the theory cannot settle this, isn't the choice between Brier and Log arbitrary? And if it is arbitrary, isn't the selection of a rule driven by pragmatic considerations (e.g., "I choose Log because it works better for scientific modeling")?

  This objection conflates *underdetermination* with *pragmatism*. That multiple scoring rules are strictly proper means that there are multiple ways to quantify the distance between a credence and the truth, all of which respect the fundamental constraint that you should expect your own credence to be the most accurate.

  The difference between Brier and Log is not a difference between "alethic" and "pragmatic." It is a difference between two competing conceptions of *epistemic risk*. The Log score embodies the view that being maximally wrong when certain is infinitely worse than being slightly wrong when uncertain. The Brier score embodies a more forgiving view, where error scales linearly with confidence. Both are measuring truth-distance; they simply weight the severity of error differently.

  To say this pluralism undermines the alethic nature of the project is like saying that utilitarianism collapses because there is debate over how to discount future welfare. The core commitment—that welfare is what matters—remains non-pragmatic, even if the specific calculus is underdetermined. Similarly, the core commitment of accuracy-first epistemology is that truth is what matters. The choice of scoring rule is a choice about *how* truth matters, not a choice to prioritize utility over truth.

  **The Objection: The Threat of Arbitrariness**

  The most potent objection to this defense is the **Argument from Arbitrariness**. It runs as follows:

  1.  If accuracy-first epistemology is to provide a unique normative foundation, it must uniquely identify the correct norms.
  2.  Different scoring rules yield different norms (e.g., regarding extremity or updating).
  3.  Accuracy considerations alone do not identify a unique scoring rule.
  4.  Therefore, the choice of scoring rule is arbitrary.
  5.  If the foundational metric is arbitrary, the resulting norms lack genuine normative force.
  6.  Consequently, we must rely on pragmatic considerations to select the rule, restoring the pragmatism the program sought to escape.

  This is the fear that haunts the seminar room: that we have merely traded the "betting" of Dutch Books for the "arbitrary metrics" of scoring rules, leaving us without a true justification for why we should be Bayesians in the full sense.

  **The Rebuttal: Alethic Value Pluralism**

  The rebuttal requires rejecting premise 1. There is no reason to think that purely alethic considerations must yield a *unique* codification of rationality to be valid. The demand for uniqueness assumes a monistic conception of epistemic value that the accuracy program itself undermines.

  Strict propriety defines a *family* of measures that all respect the alethic goal of calibration and resolution. That this family is not a singleton suggests that "accuracy" is not a monolithic scalar but a structural constraint on how we value truth. When we adopt the Brier score, we are adopting a specific alethic value system: one that penalizes error quadratically. When we adopt the Log score, we adopt a different alethic value system: one that prioritizes the avoidance of catastrophic error.

  Neither of these choices is pragmatic. A pragmatic choice would be: "I will use the Log score because it maximizes my expected utility in a betting market." An alethic choice is: "I will use the Log score because I believe that being certain of a falsehood is the worst possible epistemic sin." The latter is a value judgment about truth, not utility.

  Therefore, the accuracy program succeeds in its foundational claim: it demonstrates that Probabilism is required by *any* reasonable conception of truth-directedness. It fails only if we insist it must also dictate *which* reasonable conception of truth-directedness is the One True Way. But that is a demand external to the project.

  If we accept this, the "residual pluralism" is not a failure of the foundation; it is a clarification of its scope. Accuracy-first epistemology provides the *necessary* conditions for epistemic rationality (coherence), but it leaves open *sufficient* conditions that depend on further alethic value judgments (e.g., how much to fear extreme error). This leaves the foundation purely alethic. We do not need to smuggle in pragmatics to choose a rule; we simply acknowledge that there are multiple coherent ways to care about the truth.

  **Conclusion**

  The accuracy-dominance argument, refined by Predd and colleagues, achieves something the Dutch Book argument never could: it shows that incoherence is an epistemic failure, not just a practical vulnerability. The fact that strictly proper scoring rules diverge on secondary norms like Cromwell's Rule or Conditionalization does not invalidate this achievement.

  We should not view the plurality of scoring rules as a crack in the foundation that lets pragmatism flood back in. Rather, we should view it as evidence that the "epistemic utility" of truth is rich enough to support multiple legitimate metrics. As long as the metric is strictly proper, the normativity flows from the truth, not the agent's desires.

  The verdict is clear: Accuracy-first epistemology retains its claim to be a purely alethic foundation for Probabilism. It grounds the floor of rationality without pragmatic contamination. That it does not also build the ceiling without additional premises is not a defect of the foundation, but a limit of the materials. We can accept a pluralism of alethic values without surrendering the core insight that rationality is, at its heart, about getting the world right.
