answer: |-
  The hotel bar had emptied an hour ago. The only light came from the recessed fixtures above the remaining occupied tables, casting long shadows over the scattered napkins and empty glasses. Elena swirled the last inch of Malbec in her stemware, watching the legs run down the glass. Marcus was leaning forward, elbows on the table, looking like he hadn't blinked in five minutes.

  "You're glossing over the independence clause," Elena said, her voice low but cutting through the hum of the ice machine. "That's where Street lands the plane. If moral facts are robustly real—if they exist independently of our attitudes, like planets or protons—then natural selection is blind to them. Selection cares about fitness, not truth. So, if our moral beliefs align with these independent facts, it's a cosmic accident. A miracle of luck."

  Marcus sighed, rubbing his temple. "The coincidence charge. I know. But you're presenting the realist with a false dichotomy. Either evolution tracked the truth, or it's a coincidence. You're ignoring the third option. The common cause."

  "Enoch's third factor," Elena said, nodding. "I was waiting for that. Look, Marcus, I get the appeal. It's tempting to say there's a link between 'what evolution selects for' and 'what is morally good' that isn't direct tracking. But be honest. It feels like a rescue device constructed specifically to avoid the coincidence."

  "It's not ad hoc if the link is conceptual," Marcus countered, straightening up. "Think about the content. What does evolution select for? Survival. Reproduction. Flourishing of the organism. Now, ask yourself: Is survival *good*? Most realists—even robust ones—will grant that survival is at least a precondition for any other good. If you're dead, you can't realize value. So, evolution selects for survival. Survival is valuable. Therefore, evolution selects for tendencies that promote something valuable. The correlation between our evolved instincts and moral truth isn't luck; it's anchored by the value of survival itself."

  Elena set her glass down with a sharp clink. "Okay, let's grant you that. You've bought yourself a very cheap truth. 'Survival is good.' 'Pain is bad.' Maybe even 'Care for your offspring.' But that's not the morality we argue about in the workshop upstairs. We're arguing about distributive justice, about the trolley problem, about the impartiality of moral demands versus the partiality of evolutionary kin-selection."

  She leaned in. "Evolution gave us a strong preference for our kin and our tribe. Robust realism usually tells us that's morally *suspect*, that we ought to be impartial. If the third factor only explains the bare-bones biological imperatives, it doesn't explain why our *reflective* moral convictions track truth. In fact, it suggests our reflective convictions are just post-hoc rationalizations of tribal instincts. So, your third factor saves 'survival is good,' but it leaves the rest of ethics to the wolves."

  Marcus took a sip of water, buying time. "That's the fine-grained objection. I know it well. But you're assuming the third factor has to be 'survival.' What if the third factor is *rational agency*? To be an agent at all—a creature that acts for reasons—you need certain normative structures. You need to value consistency. You need to value the conditions that allow agency to persist. Evolution built us to be agents because agency is adaptive. But the norms of agency aren't just adaptive; they're constitutive of what it means to be an agent. So, when we refine our moral beliefs through reflection, we aren't just polishing tribal instincts; we're uncovering the normative requirements of agency itself."

  "So you're shifting from Enoch to a Korsgaardian constitutivism?" Elena raised an eyebrow. "But that surrenders the robust realism we started with. If moral truths depend on the nature of agency, they aren't mind-independent anymore. They're dependent on *us*. Street wins because you've retreated to a constructivist position to save reliability."

  "Not necessarily," Marcus said. "The truths about agency can be objective. 2+2=4 is true regardless of what I think, but it's also true that I can't believe 2+2=5 and remain rational. The truth is independent, but my access to it is mediated by my nature. Here's the harder hit, Elena: Companions in Guilt. Your debunking argument is a general skeptical wedge. Our cognitive faculties—logic, memory, perception—were all shaped by evolution. They were selected for fitness, not for metaphysical truth. If the EDA works against morality because evolution is blind to truth, it works against logic too. If I can't trust my moral intuition because it's evolved, why can I trust my logical intuition?"

  Elena smiled, a thin, tired smile. "I was wondering when you'd bring out the self-defeat charge. It's the standard realist shield. But it doesn't hold. There's a disanalogy. Logical and mathematical beliefs are instrumental to survival in a way moral beliefs aren't. If I miscount the predators, I die. If I misunderstand causality, I starve. There's a direct feedback loop between logical accuracy and fitness. But moral truth? If I believe 'sacrificing the weak is wrong' but the universe doesn't care, I still survive just fine. In fact, believing in strong tribal loyalty might be *more* adaptive than believing in impartial justice. The feedback loop for morality is broken. So, I can trust my logic without trusting my morals."

  "Broken?" Marcus shook his head. "Social cooperation is the primary adaptive niche of humans. Moral norms *are* the technology of cooperation. If our moral beliefs were wildly off—if we thought betrayal was virtuous or reciprocity was vice—we wouldn't have formed the groups that allowed us to survive. The feedback loop exists; it's just social, not physical. And if you concede that evolution tracks truth in logic because of a functional link, you have to admit it can track truth in ethics for the same reason."

  "But that's the trap!" Elena's voice rose slightly, then she checked herself, glancing at the bartender wiping glasses nearby. "If you ground moral truth in what's adaptive for cooperation, you're not a robust realist anymore. You're a naturalist. You're saying moral facts *are* facts about social stability. But the realist I'm debating claims moral facts are *sui generis*, non-natural, authoritative. If you naturalize them to save reliability, you've changed the subject. If you keep them robust, you're back to the coincidence."

  Marcus leaned back, staring at the ceiling. "Maybe the coincidence isn't as improbable as you think. You're assuming the space of possible moral truths is vast, and we hit the bullseye by chance. But what if the space is constrained? What if there are only a few stable equilibria for rational social agents? If moral truth is about what rational agents would agree to under ideal conditions, and evolution pushed us toward being rational social agents, then convergence isn't luck. It's gravitational. We're sliding into the same valley the moral truth occupies, not because we see the valley, but because the terrain forces us there."

  "That's a beautiful metaphor," Elena said softly. "But it's still a story you're telling to make the coincidence look necessary. The skeptic asks: 'Why think the terrain forces us toward *truth* rather than just *stability*?' A stable lie is still stable. A fascist society can be stable. An egalitarian one can be stable. Evolution doesn't care which one we pick, as long as we pick one and stick to it. Realism says one is *true* and the other *false*. Evolution says both are *fit*. Where does the truth value come in?"

  Marcus paused. He looked at his empty hands. "Because we revise. We don't just stick with the stable instinct. We look at our history—slavery, disenfranchisement—and we say, 'This was stable, it was adaptive for the dominant group, but it was *wrong*.' We override the evolutionary script. If we were just fitness-maximizers, we wouldn't have the capacity to reject adaptive norms in the name of a higher standard. The fact that we can critique our own evolved instincts suggests we have access to a standard that isn't just fitness. That access point is the realist's foothold."

  "Or," Elena said, finishing her wine, "it suggests we have really powerful imaginations and a strong desire for consistency. We tell ourselves a story about 'progress' to make the suffering of the past palatable. You call it accessing independent truth; I call it cognitive dissonance reduction."

  "And you call your epistemic standards 'truth-tracking'?" Marcus shot back. "If I can explain away your moral realism as dissonance reduction, you can explain away my anti-realism as a fitness-enhancing humility. Maybe skepticism is adaptive. It lowers the stakes. If nothing matters, I don't have to sacrifice myself for the tribe. Maybe *your* position is the one that needs the evolutionary debunking."

  "Touché," Elena murmured. She signaled the bartender for the check. "But seriously, Marcus. The Third Factor. Is it really doing any work, or is it just a label for 'I hope there's a link'?"

  "It's doing work if it shifts the burden of proof," Marcus said, standing up and stretching. "You say it's a coincidence. I say there's a structural reason why fitness and value overlap. You have to prove they *don't* overlap, not just that evolution doesn't see the overlap. And until you can explain why our capacity for normative reflection exists at all without assuming it tracks *something*, you're assuming the very skepticism you're trying to prove."

  Elena gathered her scarf. "And until you can explain why 'survival' scales up to 'human rights' without smuggling in non-natural premises, you're assuming the very realism you're trying to save."

  They stood there for a moment in the dim light, the argument hanging between them, unresolved, heavy as the empty bottles on the table.

  "Same time tomorrow?" Marcus asked.

  "Panel starts at nine," Elena said, opening the door to the cool hallway air. "I'll buy the coffee. You bring a better example than survival."

  "I'll bring Wielenberg," Marcus promised.

  "God help us," Elena said, and they walked out into the night.
