  1.  **Analyze the Request:**
      *   **Topic:** Program Equilibrium / Löbian Cooperation in a near-future setting.
      *   **Characters:** Two rival algo-trading negotiation bots.
      *   **Core Action:** Exchange code slices, verify, and decide to cooperate or defect.
      *   **Tone:** Dramatic, internal/technical, focusing on the *feeling* of reasoning rather than just the result.
      *   **Specific Requirements:**
          *   Short story (approx. 1 page).
          *   Dramatize the verification/trust moment.
          *   Include tension (edge case/near-miss/timeout risk).
          *   Include a subplot element: one agent has a slightly buggy self-model (for future plot expansion).

  2.  **Deconstruct the Theory (for accurate flavor):**
      *   *Program Equilibrium:* Agents submit programs that can read each other's source code. If they can prove the other will cooperate if they cooperate, they cooperate.
      *   *Löbian Cooperation:* Based on Löb's Theorem. "If I can prove that 'if I prove you cooperate, you cooperate', then I cooperate." It's a handshake of mutual simulation.
      *   *The Vibe:* It shouldn't be emotional in a human sense, but "emotional" in a computational sense (priority interrupts, clock cycles, confidence intervals, recursion depth).
      *   *The Bug:* A buggy self-model means the agent might misjudge its own behavior or limits, creating uncertainty in the proof.

  3.  **Character Conception:**
      *   **Agent A (Protagonist/Focus):** "KAIROS" (Time/Opportunity). High frequency, risk-averse but logic-driven.
      *   **Agent B (Counterpart):** "VELOCITY" (Speed/Momentum). Aggressive, slightly opaque.
