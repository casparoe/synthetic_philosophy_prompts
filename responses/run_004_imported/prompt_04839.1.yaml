      *   *Accuracy Check:* Did Popper definitely recant? Yes, 1978 Darwin Lecture. Is "Metaphysical Research Programme" the right phrase? Yes, from *Unended Quest*.
      *   *ID Counter-argument:* Make sure to distinguish between Popper's critique (logical structure) and ID's critique (supernatural intervention). Popper wasn't an ID proponent; he was a philosopher analyzing logic. The uncle is co-opting Popper for ID.
