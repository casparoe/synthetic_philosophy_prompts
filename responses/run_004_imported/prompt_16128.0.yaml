      *End:* 30 years of that integrity.

      *Wait, is it too risky to tell the volunteers they were wrong?* I need to be diplomatic but firm. "I know the debate. But here is why she was right."

      *Okay, let's go.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah, and I have the privilege of being the daughter of the guest of honor.

  Looking around this room, I see two distinct groups. On one side, I see my family—people who know Mom for her burnt lasagnas, her stubborn gardening, and the fact that she still answers her phone at 3:00 AM. On the other side, I see the rescue team—past and present. You know her for the calloused hands, the radio protocols, and the decisions made in the dark.

  I know that for many of you, especially in the volunteer corps, there is a story that defines her leadership. It's the story from her second year. The storm rolling in. The two groups stranded: two climbers on the North Ridge, seven on the South. The clock ticking. And the decision: not to rush the seven, but to draw lots.

  I know this decision fractured the network for a decade. I know the argument. It is the argument of utility. Seven lives are more than two. To save the greater number is the rational choice. To do otherwise is, by the cold light of arithmetic, a failure.

  But I am standing here tonight to say that my mother was right. And I'm not saying that to be a loyal daughter. I'm saying it because I've read the debates, and I've listened to the silence that followed her home from calls for thirty years.

  The argument against her choice is that numbers must count. That ethics is a math problem where the goal is to minimize the total sum of loss. But mountain rescue is not about sums. It is about individuals.

  When those climbers were stuck on that ridge, they weren't experiencing their danger as a fraction of a total. The two men on the North Ridge weren't facing "two-ninths" of a tragedy. They were facing death. All of it. The terror of the man on the North Ridge was not less than the terror of the man on the South Ridge simply because he had more companions.

  If Mom had sent the team to the seven simply because they were seven, she would have made a decision that the two men on the North Ridge were expendable. She would have declared that their claim on help was weaker than the others' claim, solely based on a headcount they didn't choose.

  By drawing lots, she acknowledged a harder truth: that every single person in those mountains had an equal, absolute claim on rescue. She refused to aggregate human lives into a statistic. She refused to let the math of the many erase the duty owed to the few.

  There is a philosophical paper that argues exactly this—that we shouldn't let numbers settle it, because loss is experienced individually, not collectively. Mom didn't need to read the paper to know the truth of it. She knew that once you start deciding who is worth saving based on the headcount, you stop saving people and start managing inventory.

  That choice didn't just happen once. It defined thirty years of service. It meant that every volunteer who went out knew they weren't being sent to "cut losses." They were being sent to honor a claim. It meant that the community trusted her not to weigh lives, but to fight for them.

  To the volunteers in the room who argued with her: I know you wanted to save more. That desire comes from a good place. But Mom taught us that the measure of this team isn't how many we save in a batch, but how we treat the one we might leave behind. She ensured that no one was left behind because the math said they were worth less.

  To my family: We are proud of her because she carried the weight of those choices so we didn't have to. She absorbed the moral cost of the mountains so others could live.

  So, I ask you to raise your glasses. Not just to a leader who was efficient, but to a leader who was principled. To a woman who looked at the cold math of the wild and decided that humanity mattered more than the sum.

  To Mom. May your nights be quiet, and your paths be clear. Cheers.
