prompt: |-
  My mother is retiring this spring after thirty years leading our county's volunteer mountain rescue team, and I've been asked to give the toast at her retirement dinner. The story everyone still tells is from her second year on the job: a storm was going to close the only safe route down within the hour, her team could reach only one of two stranded groups in time, two climbers on one ridge and seven on another, and with nothing else to go on she had the team draw lots rather than simply send help to the seven. It split the volunteer network for years; she has never said much about it beyond that the numbers weren't the kind of thing that should settle it on their own. Reading on my own since then, I found out there's a real philosophical debate behind what she did: Taurek's paper "Should the Numbers Count?" argues against simply saving the greater number, while Parfit's direct reply, "Innumerate Ethics," argues the numbers should settle it after all. Half the room that night will be rescue volunteers who still argue about that call; the other half is family who just want to raise a glass to her. Write the five-minute toast: it has to actually take a side on whether she got that call right, using the real argument rather than a vague line about every life counting equally, and it still has to work as a toast, not a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for the speaker's mother.
      *   **Honoree:** Mother, retiring after 30 years leading a county volunteer mountain rescue team.
      *   **Key Story:** Second year on the job. Storm incoming. Two stranded groups (2 climbers vs. 7 climbers). Only time to save one. She made the team draw lots instead of saving the seven.
      *   **Conflict:** This decision split the volunteer network for years.
      *   **Philosophical Context:** John Taurek ("Should the Numbers Count?") vs. Derek Parfit ("Innumerate Ethics"). Taurek argues numbers shouldn't automatically decide (loss is experienced individually); Parfit argues numbers *should* decide (minimize total loss).
      *   **Audience:** 50% rescue volunteers (who still argue about the call), 50% family (who just want to celebrate).
      *   **Constraint 1:** Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Constraint 2:** Must take a side on whether she was right (using the philosophical argument, not just "all lives matter").
      *   **Constraint 3:** Must work as a toast (warm, celebratory, personal), not a lecture.

  2.  **Determine the Stance:**
      *   *Option A: She was wrong (Parfit).* Saving 7 is better than 2. This risks alienating the mother and the family, and potentially offending the volunteers who respect her leadership. It makes for a eulogy of her reputation, not a celebration.
      *   *Option B: She was right (Taurek).* This aligns with the prompt's hint ("the numbers weren't the kind of thing that should settle it on their own"). It validates her difficult choice. It's more poignant for a toast. It frames her leadership as deeply humanistic rather than utilitarian.
      *   *Decision:* I will argue she was right, using a Taurek-adjacent argument but translated into emotional/rescue terms. The core argument: Rescue isn't about math; it's about the individual claim each person has on help. To reduce it to math is to abandon the duty to the individual.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the dual nature of the room (rescuers + family). Set the tone (warm, respectful).
      *   **The Elephant in the Room:** Acknowledge the "Lottery Story." It's the legend. Don't dodge it.
      *   **The Philosophical Pivot (Subtle):** Introduce the dilemma without naming dropping Taurek/Parfit explicitly (too academic for a toast). Instead, frame it as "The Math vs. The Mission."
      *   **The Argument:** Why did she choose lots? Because every life is a universe. Saving the many shouldn't mean sacrificing the few by default. The "claim" of the two was just as loud as the "claim" of the seven.
      *   **The Resolution:** How this defined her 30 years. It wasn't about efficiency; it was about dignity.
      *   **The Toast:** Bring it back to the present. Raise a glass.

      *   *Self-Correction on Philosophy:* The prompt asks to use the *real argument*. I should probably reference the concept clearly enough that the philosophers in the room (or the volunteers who know the debate) recognize it, but keep it accessible for the family. I can mention the "numbers count" debate without citing "Taurek v. Parfit" directly, or I can weave the logic in. Let's try to weave the logic in primarily, maybe a subtle nod to the debate for the initiates. Actually, the prompt says "using the real argument." I should make sure the *logic* of Taurek is clear: the loss is experienced individually, so aggregating them is a category error.

      *   *Refining the Argument for a Toast:* If I say "She was right because Taurek said so," it's a lecture. If I say "She knew that to the two men on the ridge, their lives weren't 2/9ths of a problem, they were everything," that's the Taurek argument in human language. I need to make sure I take a side firmly. "She made the only choice that honored the work."

  4.  **Drafting - Tone Check:**
      *   Needs to be respectful but firm.
      *   Needs to bridge the gap between the arguing volunteers and the proud family.
      *   Needs to end on a high note.

  5.  **Writing - Step-by-Step:**

      *   *Intro:* Good evening. 30 years.
      *   *The Story:* We all know the storm story. Year two. 2 vs 7. The lottery.
      *   *The Conflict:* I know this split the team. I know the math says 7 > 2.
      *   *The Argument (The Core):* But rescue isn't accounting. If we save the many because they are many, we treat the few as expendable. In the mountains, you don't leave people behind because the math is inconvenient. By drawing lots, she acknowledged that *each* person has an equal claim to rescue. The tragedy of the two isn't less than the tragedy of the seven; it's just different.
      *   *The Legacy:* For 30 years, she didn't lead by spreadsheet. She led by principle.
      *   *Conclusion:* To Mom.

  6.  **Review against Constraints:**
      *   *5 Minutes?* Word count looks good (aiming for ~800 words).
      *   *Take a side?* Yes, arguing she was right based on individual moral claim (Taurek).
      *   *Not a lecture?* Keep the jargon low, focus on the emotional weight of the philosophy.
      *   *Toast format?* Yes, starts with address, ends with "Cheers."

  7.  **Polishing:**
      *   Make sure the transition from philosophy to emotion is smooth.
      *   Ensure the volunteers feel seen (acknowledge the difficulty) but gently corrected.
      *   Ensure the family feels proud (this shows her integrity).
      *   *Crucial tweak:* The prompt says "using the real argument." I need to be careful not to dilute it *too* much. I should explicitly mention that aggregating lives is the problem. I will phrase it as "The math of the mountain."

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm saying the 7 didn't matter. The argument is that the 2 mattered *just as much per person*. The decision mechanism (lots) equalized the probability of rescue rather than guaranteeing the loss of the minority.

      *Final Plan:*
      1. Welcome & Context.
