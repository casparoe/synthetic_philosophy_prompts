      5. The Toast.

  8.  **Final Word Count Check:** A 5-minute speech is roughly 750 words at 150 wpm. I will aim for that range.

      *(Wait, one more check on the prompt)*: "using the real argument rather than a vague line about every life counting equally."
      Okay, so I can't just say "all lives are equal." I have to explain *why* the numbers shouldn't dictate. Taurek's point is about the *separateness of persons*. The loss is experienced by individuals, not a collective. I need to articulate that. "No one experiences a fraction of a death." That's the hook.

      Let's write.

      *Drafting thought:* Start with the tension. Acknowledge the split.
