      *   Bayes:
          $$P(B \mid \text{Survey Today}) = \frac{1 \cdot 0.5}{1 \cdot 0.5 + (1/14) \cdot 0.5} = \frac{1}{1 + 1/14} = \frac{14}{15}.$$
