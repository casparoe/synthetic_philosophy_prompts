      *   *Section 2: Harsanyi's Missing Step.* Explain that Harsanyi needs the "Veil of Ignorance" to set the weights/scales. That's an ethical axiom, not math.
      *   *Section 3: Preference vs. Well-being.* VNM tracks desires, not happiness.
      *   *Section 4: Risk Attitudes.* High risk aversion looks like high utility intensity. Should we count that more?
      *   *Section 5: Sen's Critique.* Bring in the authoritative philosophical counterweight.
      *   *Conclusion:* The problem is transformed, not dissolved.

  7.  **Final Polish:** Ensure tone is respectful but firm on the technical limitations. Avoid jargon where possible, or explain it (e.g., "positive affine transformation"). Make sure to explicitly answer the final question ("Is it still a live problem?").

      *(Self-Correction during drafting)*: I need to be careful not to say Harsanyi was "wrong." His theorem is mathematically valid. The issue is the *interpretation* that it solves ICU without additional normative premises. The theorem says: If Social Welfare satisfies VNM and Pareto, THEN it is a sum. But to make that sum *moral*, you need to fix the scales. VNM doesn't fix the scales across persons.

  8.  **Final Review against User Query:** The user asks if decision theory has "quietly solved it." The answer is "No, but it clarified the structure of the problem."

      *Key takeaway to emphasize:* VNM gives cardinal utility *within* a head, not *between* heads.

      *(Wait, one more nuance)*: Some modern variations (like "variance normalization") attempt to solve the scaling problem using only preference data. I should mention that these exist but are controversial/normative themselves. (e.g., Normalizing min-max to 0-1). But even that assumes the *range* of preference satisfaction is the right metric, which is a normative claim.

