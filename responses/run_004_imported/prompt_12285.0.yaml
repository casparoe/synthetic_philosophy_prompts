answer: |-
  Here are nine interview questions designed to move from foundational definitions to the specific mechanical weaknesses of her argument, with a specific focus on dismantling the "deliberation as sample size" defense.

  **1. The Ontological Premise: Truth vs. Preference**
  "The Condorcet Jury Theorem is mathematically elegant, but it relies on a specific ontology: there must be a binary, objective 'correct' answer for the jury to find. In a referendum on tax rates or foreign policy, are we actually tracking an independent truth, or are we aggregating conflicting preferences? If I vote for lower taxes because I'm rich, and you vote for higher taxes because you're poor, neither of us is 'wrong' in a factual sense. If the input is preference rather than truth-tracking, doesn't the theorem's convergence guarantee collapse?"

  *   **Follow-up:** If she argues that policies have *instrumental* outcomes we can judge as right or wrong (e.g., "this tax rate grows the economy"), ask: "Given the lag time and noise in economic data, by the time we know which vote was 'correct,' the electorate has already voted on five new issues. Doesn't that feedback loop become too noisy to sustain the competence threshold?"

  **2. The Competence Threshold: Jellybeans vs. Geopolitics**
  "You need the average voter competence ($p$) to be strictly greater than 0.5 for the theorem to work in your favor. In a jar-of-jellybeans experiment, we can measure that easily. But on a complex question like 'Should we intervene in this foreign conflict?', how do you empirically establish that the median voter clears the 50% bar? Without a ground truth available *at the time of voting*, aren't you just assuming the competence you need to prove?"

  *   **Follow-up:** If she suggests we use proxy measures (like education levels or political knowledge quizzes), ask: "There's literature suggesting high-scorers on political knowledge quizzes are just more polarized, not more accurate. If your metric for competence correlates with partisan entrenchment, might you actually be selecting for systematic bias rather than signal?"

  **3. The Reverse Gear: Systematic Bias**
  "You've acknowledged that if competence dips below 50%, the theorem runs in reverse: adding more voters guarantees the *wrong* answer. In the age of algorithmic newsfeeds and coordinated disinformation, isn't the risk less about random noise and more about systematic, correlated error? If a large chunk of the electorate is fed the same false premise, doesn't the math dictate that democracy becomes a machine for producing certainty in falsehoods?"

  *   **Follow-up:** If she says "voters are resilient" or "markets for information correct this," ask: "Condorcet assumes errors are independent. If the error source is centralized—like a viral misinformation campaign—that independence is broken. Do you have a mathematical bound for how much correlation the system can tolerate before the expert panel becomes the safer bet?"

  **4. The Independence Assumption: Common Shocks**
  "Let's talk about the independence assumption, which is the engine of the theorem. If voters are truly independent, their errors cancel out. But in modern democracies, voters are subject to 'common shocks'—the same debate performances, the same inflation reports, the same scandals. If 10 million people change their vote based on the same TV clip, that's not 10 million independent data points; that's one data point multiplied. How does your model account for the covariance of voter error?"

  *   **Follow-up:** If she argues that people interpret the same news differently, ask: "They might interpret it differently, but if they all update their priors in the *same direction* based on that news, the independence is still compromised. Are you conflating 'idiosyncratic interpretation' with 'statistical independence'?"

  **5. The "Bigger Sample" Defense (Round 1)**
  "In your book, you have a specific defense for this: you argue that deliberation and shared information give voters 'a bigger, better sample to draw the same independent judgment from.' But statistically, if I draw 1,000 balls from an urn, and you draw 1,000 balls from that *same* urn, we haven't increased the sample size of the *population*; we've just measured the same container twice. If we are all drawing from the same media ecosystem, aren't we just measuring the bias of the ecosystem with high precision?"

  *   **Follow-up:** If she insists that deliberation mixes the information so thoroughly that it becomes new data, ask: "Doesn't that require the deliberation to be perfectly balanced? If the 'sample' we are sharing is skewed toward one viewpoint, deliberation might just reinforce the skew rather than dilute it. Where is the mechanism that guarantees the shared sample isn't biased?"

  **6. The "Bigger Sample" Defense (Round 2)**
  "Let's press that 'bigger sample' line further. Imagine 100 surveyors measuring a field. If they all use the same warped tape measure because they bought them at the same store, averaging their results doesn't fix the warp; it just gives you a very precise wrong number. If the 'shared information' voters rely on contains a structural error—say, a misunderstood economic theory shared by all pundits—doesn't deliberation just ensure everyone uses the same warped tape measure?"

  *   **Follow-up:** If she argues that *some* voters will notice the warp, ask: "But Condorcet relies on the *average* competence. If the warped tape measure is the dominant heuristic, the average drops. Are you essentially arguing that democracy works only when the media ecosystem is already epistemically healthy? If so, isn't that a circular argument?"

  **7. Diversity Trumps Ability vs. Condorcet**
  "Pop-science writing often smushes your argument together with Scott Page's 'Diversity Trumps Ability' theorem. But they are mathematically distinct. Page argues that cognitive diversity (different heuristics) solves problems better than high ability. Condorcet argues that average ability plus numbers beats experts. If your voters are independent but homogenous in their thinking, Condorcet works but Page doesn't. If they are diverse but low-competence, Page might work but Condorcet fails. Which engine is actually driving your conclusion?"

  *   **Follow-up:** If she says "we need both," ask: "In your model, which variable is doing the heavy lifting? If I have to choose between a small, cognitively diverse panel (Page) or a massive, homogenous crowd (Condorcet), which one does your math prioritize? Because policy implications differ wildly depending on the answer."

  **8. The Expert Comparison**
  "Your pitch is that majority rule is epistemically *better* than a panel of experts. But experts usually have a much higher individual $p$ (competence), even if their $n$ (number) is low. For the crowd to beat the experts, the crowd's independence must be near-perfect. Given what we know about social conformity and party discipline, is there any realistic scenario where a mass electorate is *more* independent than a panel of ten scientists who are incentivized to disagree with each other for tenure?"

  *   **Follow-up:** If she says "experts have groupthink too," ask: "That might be true, but is the *degree* of correlation higher in a discipline with peer review or in a mass public with algorithmic feeds? If you can't quantify that comparison, can you really claim the crowd is epistemically superior?"

  **9. Institutional Implications**
  "Finally, if the Condorcet conditions are this fragile—requiring independence, competence above 50%, and truth-tracking questions—shouldn't we design institutions that *force* those conditions rather than assuming mass elections meet them? For example, sortition (random selection) might guarantee independence better than campaigns. If you truly believe the math, why stick with mass electoral democracy, which seems structurally designed to correlate votes, rather than a system that optimizes for Condorcet's variables?"

  *   **Follow-up:** If she says "legitimacy requires voting," ask: "So you're admitting the epistemic argument is secondary to the normative argument? If the epistemic benefit relies on conditions our current system violates, are we essentially running a simulation of democracy that looks like it should work on paper but fails in the lab?"
