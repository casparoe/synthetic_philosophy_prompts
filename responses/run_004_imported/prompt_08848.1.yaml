      *   **Core Question:** How can mutual cooperation be a Nash Equilibrium in Program Equilibrium (PE) when an unconditional defector (DefectBot) seems to strictly dominate cooperative programs?
      *   **Underlying Confusion:** The user sees a contradiction between the standard PD logic (Defect dominates Cooperate) and the PE claim (Cooperate-Cooperate is NE). They suspect the theorists are "quietly excluding the unconditional defector."
      *   **Key Concept:** Program Equilibrium (Tennenholtz, 2004), specifically in the context of the Prisoner's Dilemma.

  2.  **Deconstruct the Problem:**
      *   **Standard PD:** Actions are $C$ or $D$. Payoff matrix: $T > R > P > S$. $D$ strictly dominates $C$. $(D, D)$ is the unique NE.
