      *   **The User's Argument:** If I submit `DefectBot` (always outputs $D$), I get $T$ against a cooperator and $P$ against a defector. If I submit `CooperateBot`, I get $S$ against a defector and $R$ against a cooperator. Since $T > R$ and $P > S$, `DefectBot` seems to always do better or equal. Therefore, how is $(CooperateProgram, CooperateProgram)$ stable?
      *   **The Flaw in the User's Argument:** The user is assuming the opponent's program is fixed *independent* of my program. But in Program Equilibrium, the opponent's program *reads* my program. If I switch from `FairBot` to `DefectBot`, the opponent's program might change its output from $C$ to $D$ *in response* to reading my new code.
      *   **The Crucial Mechanism:** Conditional cooperation based on source code inspection. The most famous example is `FairBot` (or variants like `PrudentBot`, `Masquerade`, etc., often discussed in the context of Fairness/Cooperation in logic-based games, e.g., by Critch, Benja Fallenstein, Eliezer Yudkowsky, or the original Tennenholtz paper).
