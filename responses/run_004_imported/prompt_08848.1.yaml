answer: |-
  Your skepticism is well-founded. In the standard formulation of the Prisoner's Dilemma, the logic you describe is ironclad: defection strictly dominates cooperation, and any equilibrium involving cooperation must be unstable against invasion by an unconditional defector.

  However, the shift to **Program Equilibrium** (introduced by Moshe Tennenholtz in 2004 and expanded upon by others in the field of logical decision theory) changes the topology of the strategy space. Your intuition is failing you not because the math is wrong, but because the dominance argument you are applying holds for *actions*, but not necessarily for *programs* that map opponent source code to actions.

  Here is the resolution to the paradox, broken down by the mechanism that prevents the "trivial defector" from dominating.

  ### 1. The Meta-Game Shift
  In the standard Prisoner's Dilemma, your strategy is a choice between $C$ and $D$. The opponent's choice is independent of yours at the moment of decision.
  In the Program Game, your strategy is a function $P: \text{SourceCode} \to \{C, D\}$.

  Crucially, when you consider deviating from a cooperative program to a defection program, you cannot hold the opponent's action fixed. The opponent's program *reads* your source code. If you change your code, the opponent's output may change.

  ### 2. The Counter-Strategy: `FairBot`
  To see how mutual cooperation becomes a Nash Equilibrium, we must define a specific program that supports it. The canonical example is often called `FairBot` (or variants like `PrudentBot`).

  `FairBot` operates roughly as follows:
  > "Search for a proof that my opponent will cooperate with me. If found, Cooperate. Otherwise, Defect."

  (To avoid infinite recursion, this is formalized using bounded proof lengths or modal logic, but the intuition suffices for now.)

  Now, let us test your "trivial defector" argument against an opponent playing `FairBot`.

  **Scenario A: Mutual Cooperation**
  *   **You:** Submit `FairBot`.
  *   **Opponent:** Submits `FairBot`.
  *   **Interaction:** Each program inspects the other. Each finds a proof that the other will cooperate (via a Löbian fixed-point argument). Both output $C$.
  *   **Payoff:** $R$ (Reward).

  **Scenario B: You Deviate to `DefectBot`**
  *   **You:** Submit `DefectBot` (a program that ignores input and outputs $D$).
  *   **Opponent:** Submits `FairBot`.
  *   **Interaction:** `FairBot` inspects `DefectBot`. It searches for a proof that `DefectBot` will cooperate. It finds none (in fact, it finds a proof of defection). `FairBot` outputs $D$. `DefectBot` outputs $D$.
  *   **Payoff:** $P$ (Punishment).

  **The Nash Calculation:**
  For `(FairBot, FairBot)` to be a Nash Equilibrium, you must not be able to improve your payoff by unilaterally switching strategies.
  *   Payoff staying with `FairBot`: $R$
  *   Payoff switching to `DefectBot`: $P$

  Since $R > P$ in the Prisoner's Dilemma, **switching to the unconditional defector reduces your payoff.** Therefore, `DefectBot` is *not* a best response to `FairBot`. Consequently, `(FairBot, FairBot)` satisfies the definition of a Nash Equilibrium.

  ### 3. Why Dominance Fails in Program Space
  Your objection relies on the principle that "Defection strictly dominates Cooperation." This is true in the **action space** ($C$ vs $D$), but false in the **program space**.

  In the action space, dominance assumes that for any action $A_{opp}$ the opponent takes, $D$ yields a higher payoff than $C$.
  In the program space, the opponent's action is a function $f(P_{you})$.
  *   If $P_{you} = \text{CooperateBot}$, $f(P_{you})$ might be $D$ (if the opponent is a defector).
  *   If $P_{you} = \text{FairBot}$, $f(P_{you})$ might be $C$ (if the opponent is also `FairBot`).

  The "trivial defector" does not get the Temptation payoff ($T$) against `FairBot`; it gets the Punishment payoff ($P$). The conditional cooperator effectively erects a boundary condition: "I will only cooperate if the causal structure of your decision ensures my cooperation." The unconditional defector fails this boundary condition.

  ### 4. Is the Unconditional Defector Excluded?
  You asked if theorists quietly exclude the unconditional defector. They do not. `DefectBot` is a valid program in the strategy space.
  *   `(DefectBot, DefectBot)` **is also a Nash Equilibrium.** (If the opponent always defects, your best response is to defect).
  *   However, `(FairBot, FairBot)` is *another* Nash Equilibrium.

  The existence of the cooperative equilibrium does not require banning the defector; it requires that the cooperative strategy be **retaliatory**. `FairBot` is not a pacifist; it is a conditional cooperator that punishes unprovokable defection. In game-theoretic terms, it makes cooperation incentive-compatible by linking the opponent's payoff to the structural properties of your code.

  ### 5. Technical Caveats (For the Physicist)
  As a physicist, you might spot the potential for singularities or non-termination.
  1.  **Halting Problem:** If programs can simulate each other perfectly, `(FairBot, FairBot)` leads to infinite recursion. To resolve this, Tennenholtz's original formulation used **bounded memory** (programs are finite automata). Later work (e.g., by Critch, Yudkowsky, et al.) used **Gödelian provability** within a formal system (like Peano Arithmetic), where `FairBot` cooperates if it finds a *proof* of cooperation within a certain length. This ensures the computation halts.
  2.  **Robustness:** While `(FairBot, FairBot)` is a Nash Equilibrium, it is not necessarily *evolutionarily* stable in all populations, nor is it robust to noise (if source code is read with errors). But as a static Nash Equilibrium in a noiseless environment, it holds.
  3.  **Multiplicity:** The game does not *solve* the Prisoner's Dilemma in the sense of eliminating the bad equilibrium. It creates a coordination problem between the good equilibrium (`FairBot`, `FairBot`) and the bad one (`DefectBot`, `DefectBot`).

  ### Summary
  Your intuition that "defection dominates" applies to the **output** of the programs, not the **source code** itself. By submitting a program that conditions its output on the opponent's source code, you change the payoff matrix of the meta-game.

  The unconditional defector is not excluded; it is simply rendered suboptimal against a population of programs that verify mutual cooperation before committing. The "trick" is not in excluding the defector, but in recognizing that in the program game, **your choice of code causally influences the opponent's output**, allowing you to enforce a correlation that is impossible in the standard one-shot game.

  It is not an artifact; it is a genuine equilibrium arising from the expanded information structure (access to source code). It is, however, highly sensitive to the specific computational rules governing how that code is inspected.
