answer: |-
  You are absolutely right to be suspicious of that passage. Your intuition is spot-on: Tolstoy's argument there is rhetorically powerful but logically fragile. It relies on a specific definition of art that excludes a huge amount of what art *does*, and consequently, what criticism *does*.

  You asked if you're missing a step or if the reasoning is shaky. The reasoning is indeed shaky, specifically because it relies on a **false dichotomy between "feeling" and "knowing."**

  Here is a breakdown of where Tolstoy's argument leaks, and why your joke/poem analogy hits the nail on the head.

  ### 1. The "Translation" Fallacy
  Tolstoy's heavy-lifting sentence is: *"Had it been possible to explain in words what he wished to convey, the artist would have expressed himself in words."*

  This assumes that the only function of criticism is **translation**. It assumes the critic is trying to say, "The artist meant X, here is X in prose." If that were true, Tolstoy would be right. If a painting could be fully replaced by a sentence, the painting would be redundant.

  But criticism rarely claims to *replace* the experience. Good criticism acts more like a **guide** or a **lens**.
  *   **Context:** A modern viewer looking at a Renaissance altarpiece might feel nothing because they don't recognize the saints or the symbolism. The art fails to "infect" them not because it's bad art, but because the cultural code is lost. A critic restores the code so the infection can happen.
  *   **Technique:** A critic might point out *how* a filmmaker used sound to create unease. This doesn't replace the feeling; it heightens your sensitivity to it for future viewings.
  *   **Unconscious Content:** Artists often embed things they aren't fully aware of. A critic can point out, "You notice how this character mirrors the author's childhood trauma?" The artist didn't consciously encode that message to be "translated," but the critic reveals a layer that deepens the infection.

  ### 2. The Joke and Poem Counter-Examples
  Your instinct about jokes and poems is excellent, but there is a nuance worth separating.

  *   **Jokes:** Actually, Tolstoy is partially right about jokes. If you have to explain *why* a joke is funny, the joke has failed. The "infection" (laughter) didn't happen. However, you can explain the *context* of a joke (e.g., "This was satirizing Victorian politics") without killing the humor, and that explanation adds value to understanding the artifact.
  *   **Poems:** This is where Tolstoy really falls apart. Poems *are* words. If his logic held, we should never analyze poetry, because the poem is already in words. But we know that reading a paraphrase of a poem is not the same as reading the poem, yet reading *analysis* of the poem can make the second reading of the poem more potent. Criticism here isn't replacing the words; it's tuning the instrument (the reader) to hear the words better.

  ### 3. "Infection" is not always Immediate
  Tolstoy's theory is the **"Infection Theory"** of art. He believes art's sole purpose is the immediate transmission of feeling.

  The problem is that complex art often requires **acclimatization**.
  *   Stravinsky's *Rite of Spring* caused a riot at its premiere. By Tolstoy's metric, it failed to "infect" the audience with the intended feeling (it infected them with anger/confusion instead).
  *   Today, it is considered a masterpiece.
  *   Did the art change? No. The *audience's ability to receive it* changed, largely due to decades of criticism, analysis, and historical positioning.

  If we accept Tolstoy's view, we have to say *The Rite of Spring* was bad art in 1913 and good art in 2023. Most people would argue the criticism *educated* the audience to be able to receive the infection.

  ### 4. Tolstoy's Agenda (The Missing Step)
  You aren't missing a logical step, but you might be missing a **motivational** one. Tolstoy wasn't writing *What Is Art?* as a disinterested aesthetician. He was writing it as a moral crusader.

  By the time he wrote this, Tolstoy had undergone a religious conversion. He hated the art of his time (including his own earlier works like *War and Peace*) because he felt it was elitist, obscure, and served only the upper classes.
  *   He wanted art to be simple, universal, and morally clear (like a folk song or a religious parable).
  *   **Critics represented the elite gatekeepers** who used complex language to justify "bad" (elitist) art.

  So, when he says "Critics explain! What do they explain?", he is really saying: *"Critics use obfuscation to prop up art that doesn't speak to the common human soul."* He is attacking the **pretension** of criticism, not necessarily the utility of discourse.

  ### The Verdict for Your Debate
  Your friend's stance ("If you have to explain it, it didn't work") is a great rule of thumb for **immediate visceral impact**. If a movie needs a 10-minute post-credits explanation to make sense of the plot, it's probably a bad movie.

  But Tolstoy's extension of that ("Therefore criticism is worthless") fails because:
  1.  **Art ages:** Criticism keeps old art alive by translating cultural context.
  2.  **Art is complex:** Criticism helps us hold multiple conflicting feelings at once (ambiguity), which is often the point of great art.
  3.  **Taste is learned:** Criticism teaches us *how* to look, expanding the range of things that can "infect" us.

  Tolstoy's argument is shakier than it looks because it treats art as a **magic bullet** (it either hits or it misses) rather than a **conversation** (which can be deepened by dialogue). You can tell your friend that Tolstoy is right that art *should* move us, but wrong that talking about that movement diminishes it. Often, talking about it is the only way to keep the feeling alive after the lights come up.
