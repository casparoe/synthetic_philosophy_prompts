      *   **Conclusion:** The friend's stance ("if you have to explain it, it didn't work") is a good rule of thumb for *immediate impact*, but a bad rule for *enduring value*. Tolstoy is right about the *goal* (infection) but wrong about the *process* (criticism helps infection for complex works).

  6.  **Refine the Tone:**
