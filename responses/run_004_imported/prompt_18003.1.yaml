answer: |-
  The act theorist, following Soames and Hanks, claims to dissolve Bradley's Regress by changing the ontology of the proposition. She argues that a proposition is not a static complex of objects and properties requiring a "glue" relation to bind them; rather, it is a *type of cognitive act*. To entertain the proposition *that Obama is tall* is not to stare at a list of constituents, but to *perform* the act of predicating tallness of Obama. Because actions are intrinsically unified events—you do not need a further relation to bind the kicking to the ball in "kicking a ball"—the act of predication carries its own unity. The regress stops because the "predicating" is not a component added to the subject and property; it is the mode of entertaining them. The unity is given by the performance itself, not by an external connector.

  Marta's relocation objection presses on the internal structure of that performance. She grants that an act is not an inert list, but insists that an act of judgment is not atomic. To judge *that Obama is tall*, the thinker must execute distinct sub-acts: referring to Obama and predicating tallness. If these are distinct functional phases, what binds *them* into a single act of judgment rather than two disjointed mental hiccups? If the act theorist says the "act" binds them, she is treating the act as a further entity over and above the sub-acts, which restarts the regress. If she says the sub-acts are inherently unified, she owes an explanation of why *this* reference and *this* predication form a unity while my simultaneous itch and thought about Obama do not. The regress has not vanished; it has merely relocated from the abstract realm of propositions to the psychological realm of action-components.

  The act theorist's strongest reply is to appeal to the **unity of the agent**. She argues that the sub-acts do not need a further unifier because they are performed by a single, unified mind. The "I" that refers to Obama is the same "I" that predicates tallness, and this numerical identity of the agent provides the necessary cohesion. An act is unified because the agent is unified; we do not need a glue between mental motions any more than we need a glue between the steps of a single walk. However, Marta identifies the vulnerability here: this conflates *psychological* unity with *logical* unity. A single agent can host disjointed, contradictory, or fragmented thoughts without them forming a single proposition. To explain why *this* specific reference and *this* predication constitute a truth-evaluable whole, the theorist must appeal to a rule or norm governing the act. But if that rule is mental, it is just another item needing unification; if it is abstract, she has returned to the Platonism she sought to escape. The act theorist saves the unity of the proposition only by sacrificing the normativity that makes it a proposition in the first place.
