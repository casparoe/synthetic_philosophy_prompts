  ok this is gonna sound random but my philosophy elective has been on this whole Kant kick and its living in my head rent free. so from what i got, Kant thinks you literally cant wrong an animal directly since theyre not rational, but doing something cruel to one (like his example about not shooting an old dog/horse once it cant work anymore) is still wrong because of what it does to YOUR character, not because of the animal's pain. ok so heres my actual question - i read that scientists are seriously looking into gene-editing pigs and chickens so they literally cant feel pain, basically so factory farming becomes "cruelty free" since theres no suffering happening anymore. if Kant's whole reason for caring was about protecting human decency and not animal suffering in the first place, would he honestly be fine with that (since theres no cruelty left to be "affected" by), or is there some other part of his reasoning that would still make him say somethings wrong with it? i dont want the surface level "kant cares about animals" answer btw, i want you to actually work through his logic on this one bc my teacher will 100% clock a shallow answer.
