answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee, University Art Museum
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Reclassification of Object #89.42 (Formerly "Circle of Gerrit Dou")

  **1. Context and Scientific Findings**
  As the committee is aware, recent pigment analysis conducted by Conservation for the [Name of Grant] project identified zinc white in the ground layer of the small oak-panel genre scene (Accession #89.42). Since zinc white was not available as an artist's pigment until the early 19th century, this object cannot be a 17th-century work from the circle of Gerrit Dou. It is, technically, a skilled 19th-century pastiche.

  The committee is currently divided between two positions:
  1.  **Relabel and Retain (Status Quo Display):** Maintain the object's position in the teaching galleries with a corrected date/attribution. The argument here is that the visible paint surface remains unchanged, and thus its utility for teaching glazing techniques remains intact.
  2.  **Deaccession:** Remove the object from the collection. The argument here is that the object's primary value was its status as a historical witness to 17th-century practice, a status now proven false.

  **2. Philosophical and Pedagogical Assessment**
  As the graduate representative with a focus on aesthetics, I am asked to weigh in on the implications of this reattribution. I want to address the "Relabel and Retain" argument specifically, as it relies on a specific philosophical claim: that because the *perceptual* qualities of the object have not changed, its *aesthetic* and *pedagogical* value remains constant.

  This view (often associated with formalist aesthetics) holds that aesthetic properties reside solely in the visual array. If the glazing looks the same, the lesson is the same. While intuitively appealing, this position is insufficient for a *university* museum context for two reasons:

  *   **The Goodman Criterion:** In *Languages of Art*, Nelson Goodman argues that knowing the history of production alters the aesthetic experience of a work. Even if the eye cannot distinguish the brushwork, the knowledge that the hand is 19th-century rather than 17th-century changes the categories under which we view the work. We are no longer looking at "17th-century light"; we are looking at "19th-century memory of 17th-century light." To treat them as identical is to ignore a constitutive property of the work.
  *   **Pedagogical Integrity:** In a teaching gallery, the label is part of the object's "notation." If students are instructed to study "Dou's glazing" on a surface prepared with 19th-century industrial pigments, they are not learning 17th-century technique; they are learning a hybrid. Continuing to use the object as a proxy for Dou without radical recontextualization risks teaching art history as a matter of visual mimicry rather than material history.

  Therefore, while the "nothing perceptible changed" argument correctly identifies that the object is still visually beautiful and technically proficient, it incorrectly assumes that visual proficiency is the only metric of value in this collection.

  **3. Recommendation**
  I recommend the committee **vote to Retain and Reclassify**, but with a mandatory condition of **Radical Recontextualization**.

  We should not deaccession the object. A skilled 19th-century pastiche of Gerrit Dou is itself a historically significant artifact; it speaks to the 19th-century revival of Dutch Golden Age painting and the market demand for Dou's aesthetic. However, we cannot accept the "change nothing else" provision. The object must move from being a *primary source* (a window into the 1600s) to a *secondary source* (a window into 19th-century reception and technique).

  **4. Implementation Timeline**

  *   **Immediate (Before Thursday Meeting):** Committee vote to officially change attribution to "Unknown Artist, 19th Century, after Gerrit Dou."
  *   **Short-Term (2 Weeks):** Conservation and Curatorial to draft new wall text. The text must explicitly state *why* the attribution changed (mentioning the zinc white finding). This turns the forgery/pastiche detection into part of the teaching narrative itself—a case study in connoisseurship and science.
  *   **Medium-Term (Next Semester):** Collaborate with Studio Art and Art History faculty.
      *   *Studio:* Shift the assignment from "Copy Dou's Glazing" to "Compare 17th vs. 19th Century Grounds." The object becomes a comparative tool rather than a definitive model.
      *   *Art History:* Integrate the object into modules on 19th-century collecting habits or the history of restoration/forgery.
  *   **Long-Term (1 Year):** Re-evaluate visitor/student engagement with the new label. If the object fails to engage audiences under its new identity, revisit deaccessioning at that time.

  **5. Conclusion**
  Keeping the object while acknowledging its true nature respects both the physical labor of the unknown 19th-century painter and the intellectual integrity of the university. It accepts Goodman's insight that *knowledge changes vision*. By admitting the object is a pastiche, we do not lose its value; we simply trade a false historical value for a true art-historical one.

  I look forward to discussing this proposal on Thursday.
