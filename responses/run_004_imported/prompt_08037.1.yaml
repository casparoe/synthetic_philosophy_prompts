      *   *The User's Interpretation:* The user suggests Moore values beauty *without* observers. Moore actually thinks the *experience* of beauty is the highest good, but the *existence* of beauty has some value. The user's coral reef question hinges on this distinction. The user's friendship vs. disease cure question hinges on the hierarchy of goods.

