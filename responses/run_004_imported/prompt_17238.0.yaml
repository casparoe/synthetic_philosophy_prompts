answer: |-
  This is a sophisticated objection that cuts to the heart of the revisionist project. Your students are right to be suspicious: whenever a theorist posits a gap between "true morality" and "practical rules," there is a risk of insulating the theory from refutation by fiat. If McMahan can simply say, "Yes, deep morality implies pacifism, but ignore that," he risks making revisionism vacuous.

  However, the strongest defense of McMahan's move is that it is not an *ad hoc* retreat, but a principled application of **non-ideal theory** and **institutional morality**. The distinction between deep morality and the law of war is not a way to hide the implications of revisionism, but a way to manage the tragic constraints of the international system without surrendering the moral truth about liability.

  Here is the case for why this distinction is principled, independently motivated, and successfully manages Lazar's dilemma.

  ### 1. Independent Motivation: Epistemic and Institutional Constraints
  The charge that this distinction is a "dodge" assumes that moral theory should always map 1:1 onto action-guiding rules. But in domains characterized by radical uncertainty and high stakes, morality often demands we follow heuristics that diverge from first-order principles.

  McMahan's appeal to convention is independently motivated by two factors that exist regardless of Lazar's dilemma:
  *   **Epistemic Fog:** In domestic self-defense, a victim often knows the aggressor's intent. In war, a soldier rarely knows if the enemy combatant facing them is fighting for an unjust cause, is coerced, or is acting on false intelligence. A moral theory that requires soldiers to adjudicate the *jus ad bellum* status of their enemy in real-time imposes an impossible epistemic burden.
  *   **Coordination and Escalation:** The Law of War (LOW) functions as a coordination game. If one side adopts "deep morality" (killing only those strictly liable) and the other adopts "traditional rules" (killing all combatants), the first side will likely lose, and the norms of restraint will collapse. To maintain a regime that minimizes suffering overall, morality may require agents to follow sub-optimal rules in specific instances to sustain a beneficial convention.

  Therefore, the distinction isn't invented *to solve* the Responsibility Dilemma; it is a pre-existing feature of how we apply moral principles to institutions under non-ideal conditions. McMahan is importing a standard distinction from political philosophy (ideal vs. non-ideal theory) into the ethics of war.

  ### 2. Addressing the Horns: Relocation vs. Defusion
  To answer your specific prompt, we must be precise about what the distinction does to each horn of Lazar's dilemma. It does not treat them symmetrically.

  **The Contingent Pacifism Horn: Relocated and Managed**
  Lazar argues that if we set the liability threshold high enough to protect civilians, we protect most combatants too, implying we shouldn't fight most wars.
  *   **The Move:** McMahan's distinction **relocates** this horn rather than eliminating it. He concedes that at the level of *deep morality*, contingent pacifism is likely true: most individual killings in most wars are morally wrongful because the victims are not liable.
  *   **Why this isn't a defeat:** The students argue this abandons the project. But the revisionist project's primary aim is to correct the *moral accounting* of war, not necessarily to make war easier to fight. By accepting contingent pacifism at the deep level, McMahan preserves the moral truth that unjust combatants are not mere "targets."
  *   **Absorption:** The distinction **absorbs the practical paralysis** of this horn. While deep morality says "do not kill," the convention says "you may follow the rules of engagement." This allows the just side to fight effectively without denying the moral tragedy that they are killing people who are, strictly speaking, not liable. It transforms the verdict from "This war is impermissible" to "This war is morally tragic, but regulated by necessary conventions."

  **The Near-Total War Horn: Defused**
  Lazar argues that if we lower the threshold to kill combatants, we implicate civilians (taxpayers, workers).
  *   **The Move:** Here, the distinction **defuses** the horn. Even if deep morality suggested that certain civilians were sufficiently responsible to be liable (a claim McMahan often contests on grounds of directness, but let's grant Lazar the point for argument's sake), the *Law of War* establishes a bright-line convention of non-combatant immunity.
  *   **Why this works:** The convention creates a **moral shield** that is independent of individual liability. Civilians are protected not because they are innocent (deep morality), but because targeting them undermines the convention that protects everyone (including soldiers) from total war.
  *   **Result:** The slippery slope is halted. We do not need to measure the exact causal contribution of a munitions worker vs. a conscript. The convention draws a line at "uniformed combatant." This prevents the "near-total war" outcome in practice, even if the theoretical liability questions remain messy.

  ### 3. Countering the "Abandonment" Charge
  Your students argue that switching to convention "abandons the revisionist project." This is the crux of the seminar debate. The strongest counter-argument is that revisionism remains vital in three ways that the convention layer cannot replace:

  1.  **Jus ad Bellum Accountability:** Revisionism still fundamentally alters how we judge the *initiation* of war. Walzer's MEC insulated leaders by suggesting that once war starts, everyone is equal. McMahan's deep morality maintains that leaders and unjust states bear the primary burden of guilt. The convention layer applies to the *soldier*, not the *state*.
  2.  **Asymmetric Obligations:** Even within the convention, revisionism argues that the unjust side has stronger moral reasons to surrender or refrain from fighting than the just side. The legal symmetry does not imply moral symmetry.
  3.  **Long-Term Reform:** By keeping "deep morality" distinct, McMahan keeps open the possibility of reforming the laws of war. If we conflated law and morality (as Walzer tends to do), the current laws would be the moral ceiling. By distinguishing them, McMahan allows us to say, "The law permits this, but we should strive to change the law to better track liability."

  ### 4. Conclusion: A Tragic Realism, Not a Dodge
  The distinction is principled because it acknowledges that war is a **collective, institutional activity** occurring in **non-ideal conditions**. To demand that the rules of war track individual liability perfectly is to demand that war cease to be war and become a global police action—which it is not.

  McMahan is not saying, "Ignore the dilemma." He is saying, "The dilemma reveals that war is morally tragic."
  *   **Contingent Pacifism** is accepted as a deep moral truth (we are killing people who shouldn't be killed), but managed by convention to prevent worse outcomes (tyranny winning).
  *   **Near-Total War** is blocked by convention, which overrides potential liability claims to preserve a barrier against barbarism.

  This does not vindicate Walzer's *moral* equality of combatants; it vindicates a *legal* equality of combatants for pragmatic reasons. That is a vindication of revisionism, not a retreat. It preserves the core revisionist insight—that killing in war requires justification—while acknowledging that in the fog of war, the best available justification is often adherence to a convention that minimizes overall suffering, even if it permits some wrongful killings.

  **Summary for your seminar:**
  *   **Is it ad hoc?** No, it relies on standard distinctions in non-ideal theory and institutional ethics.
  *   **Contingent Pacifism Horn:** **Relocated.** Accepted at the deep level (acknowledging the tragedy), but overridden at the conventional level to allow effective defense.
  *   **Near-Total War Horn:** **Defused.** The convention creates a bright line that protects civilians regardless of deep liability calculations.
  *   **Abandonment Charge:** False. Revisionism still governs *ad bellum* judgment, asymmetric duties, and long-term legal reform. The convention is a pragmatic overlay, not a theoretical surrender.
