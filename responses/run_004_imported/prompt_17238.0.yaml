prompt: |-
  I'm teaching a graduate seminar on the ethics of war this term, and we've just spent two sessions on Jeff McMahan's revisionist attack on Walzer's moral equality of combatants (MEC) thesis, followed by Seth Lazar's 2010 Philosophy & Public Affairs review essay, in which he presses what he calls the "responsibility dilemma" against McMahan's liability-based account of who may permissibly be killed in war. The dilemma, briefly, is this: set the degree of responsibility required for liability to lethal defense low enough to capture ordinary unjust combatants — who typically fight under some mix of propaganda, coercion, and limited information — and the same standard seems to implicate large numbers of civilians as well, since the causal and voluntary contribution of willing taxpayers, munitions workers, and propagandists to the unjust war effort is not obviously smaller than that of a coerced conscript. This is what Lazar calls the "near-total war" horn. Set the threshold high enough to shield those civilians, however, and most actual unjust combatants turn out to clear it too, so that even the just side may not permissibly kill them: this is the "contingent pacifism" horn, which threatens to collapse McMahan's revisionist project into pacifism about most real-world wars.

  McMahan's preferred way out is to distinguish the deep morality of war from the law of war and the norms of battlefield convention: he can concede that few actual wars meet the standards set by the deep morality of killing, while still mounting a separate, practically oriented argument — appealing to combatants' epistemic limitations, the risks of self-serving abuse, and the value of a bright-line convention that keeps incentives for restraint intact on both sides — for retaining something like the traditional, symmetric rules of engagement in law and in a soldier's own practical reasoning. In seminar, two of my students dismissed this move as a face-saving dodge: once the underlying theory of individual responsibility yields verdicts nobody wants to live with, they argued, quietly switching to a different, convention-based argument for practical purposes just abandons the revisionist project rather than vindicating it. I'd like to see the strongest version of the opposing case. Please argue for the position that McMahan's distinction between the deep morality and the law of war is a principled, independently motivated way of absorbing the dilemma's "contingent pacifism" horn, rather than an ad hoc retreat — and be explicit about which horn (or horns) of the dilemma the distinction actually defuses, and which, if any, it merely relocates rather than resolves.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on ethics of war.
      *   **Topic:** Jeff McMahan's revisionist just war theory vs. Michael Walzer's Moral Equality of Combatants (MEC). Specifically, Seth Lazar's "Responsibility Dilemma" (2010).
      *   **The Dilemma:**
          *   *Horn 1 (Near-Total War):* Low responsibility threshold for liability $\rightarrow$ Unjust combatants are liable, *but* so are many civilians (taxpayers, workers), leading to excessive civilian targeting.
          *   *Horn 2 (Contingent Pacifism):* High responsibility threshold for liability $\rightarrow$ Civilians are safe, *but* most unjust combatants (coerced, ignorant) are also safe, making most wars impermissible to fight (contingent pacifism).
      *   **McMahan's Response:** Distinguish *Deep Morality* (individual liability) from *Law/Convention* (practical norms).
      *   **Student Objection:** This is a "face-saving dodge" / ad hoc retreat that abandons revisionism.
      *   **Task:** Argue *for* McMahan's position (that the distinction is principled and independently motivated, not ad hoc). Be explicit about which horn(s) are defused vs. relocated.

  2.  **Deconstruct the Core Philosophical Move:**
      *   McMahan isn't saying "Deep Morality is wrong." He's saying "Deep Morality governs *liability*, but Law/Convention governs *permissions* under non-ideal conditions."
      *   To defend this against the "ad hoc" charge, I need to show that the gap between ideal theory and non-ideal practice is a standard feature of moral/political philosophy, not a special plea for war.
      *   I need to show that the *function* of the Law of War (LOW) is different from the *function* of Deep Morality.
      *   I need to address the specific horns.

  3.  **Address the "Ad Hoc" Charge:**
      *   Why is it *not* a dodge? Because epistemic limitations and coordination problems are real constraints on moral action.
      *   Analogy: Self-defense in domestic society vs. war. In domestic society, we have police/courts (conventions). In war, we don't. But even in domestic society, we have rules of evidence that might let a guilty person go to prevent wrongful convictions (a conventional rule overriding deep moral guilt).
      *   Independent Motivation: The argument for convention relies on *consequentialist* or *rule-consequentialist* grounds (minimizing overall death, preventing escalation) which are distinct from the *deontological/liability* grounds of deep morality. They operate in different registers.

  4.  **Analyze the Horns in Light of the Distinction:**
      *   *Contingent Pacifism Horn:* This is the main target. Deep morality says "Don't kill these combatants." Law says "You may."
          *   Does the distinction *resolve* this? No, it *relocates* it. It admits deep morality implies pacifism but argues the *law* shouldn't.
          *   *Wait, the prompt asks to argue it "absorbs" the horn.* I need to frame this carefully. It absorbs the *practical force* of the horn. It prevents contingent pacifism from becoming a *practical* doctrine while maintaining theoretical integrity. It transforms "You cannot fight" into "Ideally you shouldn't, but practically you must follow rules that allow fighting to prevent worse outcomes."
      *   *Near-Total War Horn:* Does the distinction help here?
          *   Deep morality might implicate civilians. The Law of War (Non-Combatant Immunity) forbids targeting them.
          *   Here, the distinction *protects* civilians despite what deep morality might suggest about their causal contribution. It creates a *shield* based on convention rather than innocence.
          *   So it defuses the *practical implication* of the Near-Total War horn (we don't actually bomb taxpayers), even if the theoretical liability remains.

  5.  **Drafting the Argument - Structure:**
      *   **Introduction:** Acknowledge the students' skepticism (it *looks* like a dodge) but state the thesis: The distinction is a robust application of non-ideal theory and institutional morality, not a retreat.
      *   **Point 1: Independent Motivation (The Nature of Conventions):** Explain why we need conventions in war (epistemic fog, coordination, escalation). This isn't invented *for* this problem; it's inherent to the domain of war.
      *   **Point 2: Addressing Contingent Pacifism (The Relocation/Absorption):** Argue that admitting contingent pacifism at the deep level is a *feature*, not a bug. It preserves the moral truth while the convention handles the practical necessity. It transforms the horn from a *reductio* into a *tragic dilemma* managed by institutions.
      *   **Point 3: Addressing Near-Total War (The Defusion):** Show how the convention creates a bright line that protects civilians *regardless* of their deep liability. This prevents the slippery slope.
      *   **Point 4: Countering the "Abandonment" Charge:** Explain why this isn't abandoning revisionism. Revisionism still does the work of critiquing *jus ad bellum* and holding leaders accountable. It changes the *micro-permissions* but keeps the *macro-critique*.
      *   **Conclusion:** Summarize. The distinction is a bridge between ideal theory and non-ideal practice.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* I must be careful not to say the distinction *solves* the metaphysical problem of liability. It doesn't. It solves the *action-guiding* problem.
      *   *Key Terminology:* Use "Ideal vs. Non-Ideal Theory," "Epistemic Constraints," "Coordination Problems," "Rule-Consequentialism."
      *   *Specific focus:* The prompt asks to be explicit about which horn is defused vs. relocated.
          *   *Contingent Pacifism:* Relocated from "action is impermissible" to "ideal theory forbids, convention permits." It absorbs the *paralyzing* effect.
          *   *Near-Total War:* Defused. The convention blocks the inference from "civilian contribution" to "civilian targetability."
      *   *Strengthening the "Principled" claim:* Reference the distinction between *individual ethics* and *institutional ethics*. Soldiers are agents of an institution. The institution needs rules that are knowable and enforceable.

  7.  **Final Polish:** Ensure the tone is appropriate for a graduate seminar context (rigorous, engaging with the literature, respectful of the students' critique but firm in the counter-argument). (Self-correction: Make sure to mention Lazar explicitly and acknowledge the strength of his critique before pivoting to the defense).

  8.  **Final Review against constraints:**
      *   Argue *for* McMahan's distinction.
      *   Claim it is principled/independently motivated.
      *   Explicitly state which horn is defused vs. relocated.
      *   Address the "abandonment" charge.

  *(Self-Correction during drafting)*: I need to make sure I don't just repeat McMahan. I need to construct the *strongest version* of the case, perhaps drawing on later developments or sympathetic interpreters (like Emerton or Handfield, or general non-ideal theory literature) to bolster the "principled" aspect. The core argument is that *morality demands we sometimes follow sub-optimal rules to achieve optimal outcomes in non-ideal conditions.*

  Let's organize the response.
  1. Intro: Validate students, state thesis.
  2. The Independent Motivation (Epistemic & Institutional).
  3. Handling Contingent Pacifism (Relocation as Management).
  4. Handling Near-Total War (Defusion via Bright Lines).
  5. Why it's not Abandonment (Revisionism's remaining work).
  6. Conclusion.

  *Wait, one nuance on the horns:*
