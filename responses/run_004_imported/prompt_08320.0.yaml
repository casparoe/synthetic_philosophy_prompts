answer: |-
  This is one of the most famous and frustrating passages in the history of philosophy. You are not alone in finding Ross's translation dense; Aristotle is compressing a massive amount of logical theory into a few paragraphs.

  The core issue is that Aristotle is trying to prove the **Principle of Non-Contradiction (PNC)**: *The same attribute cannot at the same time belong and not belong to the same subject in the same respect.*

  Here is the breakdown of the argument structure, answers to your specific textual confusions, and where Graham Priest (the modern father of dialetheism) attacks it.

  ---

  ### Part 1: The Setup (Why no "Positive" Proof?)

  To understand the "negative demonstration," you have to understand why a "positive demonstration" is impossible.

  In Aristotle's logic, a demonstration (proof) proceeds from premises that are **more certain** than the conclusion. But the PNC is the *most* certain principle of all. There is nothing more certain to use as a premise.
  *   **Positive Proof:** "Premise A + Premise B $\rightarrow$ Therefore, PNC."
  *   **The Problem:** If you use Premise A, your opponent will ask, "Is Premise A subject to the PNC?" If you say "Yes," you are assuming the PNC to prove the PNC. That is **begging the question** (*petitio principii*).

  So, Aristotle shifts tactics. He won't prove the PNC is *true*; he will prove that **denying the PNC is impossible.**

  ### Part 2: Step-by-Step Walkthrough of the Elenchus

  Aristotle's method is *elenctic* (refutational). Here is the logical flow:

  1.  **The Condition:** The opponent must say something (signify something). If they say nothing, they are like a "vegetable," and argument is impossible.
  2.  **The Concession:** By speaking, the opponent signifies something definite (e.g., the word "man" signifies "two-footed animal").
  3.  **The Trap:** To signify "man" means to pick out *what it is to be a man*. It means "man" has a specific essence.
  4.  **The Contradiction:** If the opponent denies the PNC, they claim "man" can be "not-man." But if "man" has a definite signification (Step 2), it *is* that signification and *is not* the opposite.
  5.  **The Conclusion:** The very act of signifying something definite presupposes the PNC. Therefore, the opponent cannot deny the PNC without undermining their own ability to speak.

  ### Part 3: Untangling Your Three Confusions

  #### 1. Why does "Negative Demonstration" dodge the begging-the-question charge?
  In a **positive demonstration**, *Aristotle* provides the premises. If he uses the PNC as a premise, he begs the question.

  In a **negative demonstration (elenchus)**, the *opponent* provides the premise.
  *   Aristotle does not say: "PNC is true, therefore you are wrong."
  *   Aristotle says: "You said X. Does X signify something? You admit it does. Does signification require determinacy? You admit it does. Does determinacy require PNC? Yes. Therefore, **you** are committed to PNC."

  Aristotle isn't asserting the PNC as a truth claim he holds; he is asserting it as a **commitment the opponent has already made** by opening their mouth. The "question-begging" is avoided because the premise ("I am signifying something") comes from the opponent, not the prover.

  #### 2. What work is "signifying something" doing?
  This is the "low bar" that becomes a trap.
  *   **Why it's a low bar:** It doesn't require the opponent to agree to "Truth," "Reality," or "Logic." It only requires them to agree that their words *mean something*. Even a skeptic must admit that when they say "PNC is false," the word "false" means something different than "true."
  *   **Why it sinks them:** Signification implies **determinacy**. If I say "man," I mean *this* and not *that*. If the word "man" signified everything (both man and not-man, both horse and not-horse), it would signify nothing. It would be noise.
  *   **The Trap:** To deny the PNC is to say "A can be not-A." But to *say* that, you must use the term "A" with a fixed meaning. If "A" has a fixed meaning, then in the context of that meaning, "A is not not-A." So, the *content* of your speech denies the PNC, but the *act* of your speech presupposes it.

  #### 3. Why is the listener "responsible for the proof"?
  This is a brilliant rhetorical move by Aristotle.
  *   Usually, the burden of proof is on the person making the claim.
  *   Aristotle says: "I am not making a claim. I am just holding up a mirror."
  *   The "proof" is generated by the collision of the opponent's own commitments. The opponent asserts "~PNC." The opponent also asserts "My words mean something." These two assertions are incompatible.
  *   Because the incompatibility arises from the *opponent's* assertions, the opponent is the one "proving" the PNC (by proving their own position absurd). Aristotle is just the midwife delivering the contradiction.

  ---

  ### Part 4: Where Priest (and Dialetheists) Push Back

  Graham Priest spends a lot of time on this in *In Contradiction* and *Doubt Truth to be a Liar*. He respects the argument but thinks it fails. Here is where a dialetheist attacks:

  #### 1. The Pragmatic vs. Ontological Distinction
  Priest argues that Aristotle successfully proves that the PNC is a **presupposition of discourse**, but not that it is a **truth about reality**.
  *   **Aristotle:** You can't argue without PNC, therefore PNC is true.
  *   **Priest:** You can't argue without PNC, therefore argumentation *presupposes* PNC. But reality might be inconsistent even if our language has to pretend it isn't to function.
  *   *Analogy:* You can't play Chess without assuming the King can't move into check. That doesn't mean the physical universe forbids a King-shaped piece from moving to a threatened square; it just means *Chess* forbids it. Priest argues PNC is a rule of the "game" of classical logic, not necessarily a law of being.

  #### 2. The Theory of Signification (Semantics)
  Aristotle assumes that for a word to signify, it must signify *exclusively* (A cannot be not-A).
  *   **Priest's Counter:** Paraconsistent logic allows for **truth-value gluts**. A statement can be True and False. Priest argues we can construct a semantics where signification does *not* require exclusivity.
  *   If I say "This sentence is false," I am signifying something. But the signification leads to a contradiction. Priest argues we *can* signify contradictory things without becoming "vegetables." We do it with the Liar Paradox all the time. Aristotle assumes signification *must* be consistent; Priest denies this.

  #### 3. The "Vegetable" Charge
  Aristotle says if you don't signify something definite, you are a vegetable.
  *   **Priest's Counter:** A dialetheist *does* signify something definite. When Priest says "There are true contradictions," he means something specific. He isn't babbling. The fact that his claim entails a contradiction doesn't mean he fails to signify; it just means the world (or logic) is contradictory. Aristotle conflates "signifying something" with "signifying something consistent."

  #### 4. The "Listener Responsible" Move
  Priest would argue this is a sleight of hand.
  *   Just because the opponent is committed to PNC *pragmatically* (to speak), it doesn't mean they are committed to it *theoretically*.
  *   A dialetheist can say: "I accept that to communicate with you, I must use language that behaves *as if* the PNC holds. But I maintain that ontologically, the PNC fails."
  *   Aristotle tries to move from "You must act as if PNC is true to argue" to "PNC is true." Priest blocks that inference.

  ### Summary for your Seminar
  If you need to summarize this in class:

  1.  **Aristotle's Move:** Shifts from direct proof (impossible) to elenctic refutation (pragmatic self-defeat).
  2.  **The Mechanism:** Signification requires determinacy; determinacy requires PNC. Therefore, speaking requires PNC.
  3.  **The "Responsibility":** The opponent generates the contradiction by holding two incompatible commitments (denying PNC + using meaningful language).
  4.  **Priest's Rebuttal:** Aristotle proves PNC is a norm of *communication*, not a law of *truth*. We can signify contradictory things (like the Liar), so the "vegetable" charge is false. The elenchus shows dialetheism is *unassertable* in classical terms, but not that it is *false*.

  This should give you enough grip to navigate the seminar discussion! Good luck.
