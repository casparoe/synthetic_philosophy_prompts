  5.  **Drafting the Content (Mental or Scratchpad):**

      *   *Key distinction:* Structural equations define *potential* causation (the model). Actual causation requires selecting a path. HP selects paths via contingencies. Trumping shows multiple paths are available unless we block one. Blocking one requires "normality."
      *   *Counterfactual theorist:* Lewis uses a system of weights for similarity. We can weight "laws/protocol" heavily.
      *   *SEM theorist:* Uses "normality" of variable values.
      *   *Equivalence:* Weighting laws vs. Weighting variable defaults. Both are external to the bare logic of dependence.

  6.  **Final Polish:** Ensure the flow is logical.
      *   Intro: Setup & Thesis.
      *   Body 1: The HP Failure (Sergeant comes out as cause).
      *   Body 2: The Normality Solution & The Stipulation Charge.
