answer: |-
  Jonathan Schaffer's case of trumping preemption presents a distinctive challenge to theories of causation. In the scenario, a Major and a Sergeant simultaneously order a Corporal to advance. Military protocol dictates that the Corporal obeys the higher-ranking officer. Thus, the Corporal advances because of the Major's order, even though he would have advanced on the Sergeant's order alone had the Major remained silent. For the simple counterfactual theorist, this is a disaster: the effect (the advance) does not counterfactually depend on the putative cause (the Major's order), because if the Major had not ordered, the Sergeant's order would still have secured the advance.

  Interventionists employing Structural Equation Models (SEM) initially appear to hold a decisive advantage. They can encode the military protocol directly into the structural equation governing the Corporal's behavior (e.g., $C = M$), seemingly bypassing the need for step-wise counterfactual dependence. However, under the standard Halpern–Pearl (HP) definition of *actual* causation, this advantage evaporates. The HP definition identifies causes by testing for counterfactual dependence under specific contingencies. In the trumping case, these contingencies allow the Sergeant's order to qualify as a cause alongside the Major's. To rescue the intuition that only the Major is the cause, the interventionist must import an independent ranking of "normal" contingencies. I argue that this move demonstrates that SEM enjoys no principled advantage over the counterfactual theory. The requisite normality ranking is no less stipulative than the similarity weighting a counterfactual theorist could posit by fiat. Furthermore, while all theories face hard cases, the reliance on normality undermines SEM's specific claim to objectivity and structural sufficiency, leaving it on equal footing with the theory it sought to supersede.

  To see why the standard SEM approach fails to distinguish the Major from the Sergeant, we must look at the mechanics of the Halpern–Pearl definition. In a standard HP model, we define variables for the Major ($M$), Sergeant ($S$), and Corporal ($C$). The structural equation reflects the trumping relation: if $M=1$ (order), $C=1$; if $M=0$, $C=S$. In the actual world, $M=1, S=1, C=1$. According to HP, $X=x$ is a cause of $Y=y$ if there exists a contingency (a setting of other variables) such that $Y$ counterfactually depends on $X$.

  For the Major ($M$), we find a contingency easily: set $S=0$. In this contingency, if $M=1$, $C=1$, but if $M=0$, $C=0$. Dependence is established; $M$ is a cause. However, the same logic applies to the Sergeant ($S$). We test for $S$'s causal status by finding a contingency where $C$ depends on $S$. We simply set $M=0$. In this contingency, the structural equation dictates $C=S$. Thus, if $S=1$, $C=1$, and if $S=0$, $C=0$. Dependence is established. Consequently, the standard HP definition classifies the Sergeant's order as an actual cause of the advance. This violates the core intuition of trumping preemption, where the backup cause is preempted and rendered causally inert. The structural equation successfully modeled the *law-like* connection, but the definition of *actual* causation failed to filter out the preempted candidate.

  To fix this, proponents of SEM, such as Halpern and Hitchcock, have introduced a "normality" condition. They argue that not all contingencies are created equal; we should only consider contingencies that are "sufficiently normal." In the military context, it is abnormal to imagine the Major staying silent ($M=0$) when he actually ordered ($M=1$). By ranking the contingency $M=0$ as less normal than the actual world, the interventionist blocks the path that would have made the Sergeant a cause. However, this solution reveals that the structural equations alone were insufficient. The machinery of interventionism required an external, normative ranking of variable settings to yield the correct verdict.

  This is where the claim to principled advantage collapses. The counterfactual theorist, facing the original Schaffer case, can respond in a structurally isomorphic manner. David Lewis's counterfactual theory relies on a similarity ordering of possible worlds. While standard similarity metrics prioritize matching particular facts, Lewis allows that we can weight the preservation of laws or specific constraints more heavily. A counterfactual theorist can simply stipulate that in evaluating the Major's causation, we must hold the "protocol" fixed as a quasi-law, or weight worlds where the protocol is violated as distant. Just as the interventionist imports a "normality ranking" to exclude the $M=0$ contingency, the counterfactual theorist imports a "similarity weighting" to exclude worlds where the protocol fails. Both moves are external to the bare logic of dependence. Both require a stipulation about which background conditions are fixed or privileged. If the interventionist charges the counterfactual theorist with *ad hoc* fiat regarding similarity, the counterfactual theorist can return the charge regarding normality. The resources required to solve the problem are functionally identical.

  One might object that this criticism is unfair because every theory of causation requires further resources to handle hard cases. Late preemption, switching, and double prevention all force refinements on both counterfactual and interventionist accounts. If the counterfactual theory needs similarity weightings and SEM needs normality rankings, isn't this just a tie? Why treat this as a specific failure of interventionism's advantage?

  This objection fails because it conflates general theoretical difficulty with the specific promise of the structural-equations approach. The primary selling point of SEM over plain counterfactual theory was not merely that it could solve puzzles, but that it could solve them *more objectively* by locating causation in the structural dependencies of the system rather than in vague similarity metrics between worlds. Interventionism marketed itself as clarifying the "black box" of counterfactuals by making the dependencies explicit in the equations.

  Trumping preemption exposes that the "black box" was merely moved, not opened. The structural equation $C=M$ encodes the potential for the Major to determine the outcome, but it does not encode the *actualization* of that potential to the exclusion of the Sergeant without help. To get from the model to the verdict, the interventionist must appeal to "normality." But normality is context-sensitive and often normative (what *should* the Major have done?), whereas structural equations are purportedly descriptive. By relying on normality, SEM surrenders its claim to a purely structural, objective analysis. It becomes just as dependent on external, stipulative rankings as the counterfactual theory.

  Therefore, the disadvantage is not that SEM *cannot* solve the case, but that it cannot solve it using the *principled resources* that distinguished it from its rival. The counterfactual theorist posits a priority of laws/worlds by fiat; the interventionist posits a priority of variable settings by fiat. If the interventionist argues that their fiat is more rigorous, the counterfactual theorist can note that "normality" is often harder to formalize than "similarity." Consequently, the structural-equations approach enjoys no principled advantage. It solves trumping only by adopting the very kind of external weighting mechanism it was designed to replace.

  In conclusion, Schaffer's trumping preemption case demonstrates that encoding priority into structural equations is insufficient for defining actual causation. The Halpern–Pearl definition, without modification, incorrectly identifies the preempted Sergeant as a cause. Correcting this requires a normality ranking to restrict admissible contingencies. This requirement places the interventionist in the same position as the counterfactual theorist: both must appeal to an independent, stipulative ordering to distinguish genuine causes from preempted backups. While all causal theories face complex cases, the interventionist's reliance on normality undermines their specific claim to structural superiority. The "win" for interventionism is illusory; it is purchased at the cost of the very objectivity that constituted its advantage.
