      *   **Audience:** Mixed. Half are "party lifers" (expecting rah-rah), half are family (don't care about politics, will tune out if it gets too technical/philosophical).
      *   **Goal:** A warm, honest toast that acknowledges the complexity (without being a lecture), honors the dad (without lying about the party), and keeps the mood appropriate for a retirement dinner.

  2.  **Deconstruct the Tension:**
