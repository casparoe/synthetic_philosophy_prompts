      *   *Nuance:* The phrase "He who obeys them because they are just, obeys a justice which is imaginary." This is crucial. It's not that law is *evil*, it's that its claim to *intrinsic* justice is false. Its justice is *institutional*.
      *   *The "Wisest Legislators":* Pascal often uses "wisest of the world" to mean "wisest without God." Their wisdom is ultimately folly compared to Divine Wisdom, but it's the best reason can do.

  7.  **Final Polish:**
