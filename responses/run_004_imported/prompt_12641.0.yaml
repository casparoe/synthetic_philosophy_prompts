answer: |-
  My roommate is halfway through a psych masters and won't stop talking about self-deception, so last week I caught her reorganizing her spice rack at 2 AM instead of writing her thesis.

  I said, "You're avoiding your thesis."

  She didn't look up from the cumin. "I'm avoiding my thesis," she said, "but I don't believe it."

  "You know that's Moore's Paradox, right? You sound unhinged."

  "It's only unhinged in the first-person present," she said, labeling a jar. "Say it about me: 'She's avoiding her thesis but she doesn't believe it.' That's just a diagnosis."

  "Okay. 'She's avoiding her thesis but she doesn't believe it.'"

  "See? Boring. Now say it about past-me: 'She was avoiding her thesis but she didn't believe it.' That's growth. That's insight."

  "So what's present-you?"

  "Present-me is a logical error. And logical errors don't have deadlines."

  I tried to corner her. "Try the commissive version then. 'I'm avoiding it and I believe I'm not.'"

  "No, that's commitment," she said, moving to the paprika. "I'm keeping it omissive. That way, when I finally finish tomorrow, I can say 'I was avoiding it but I didn't believe it,' and it'll be true."

  "So you're waiting to become past tense?"

  "Exactly," she said. "Once I'm past tense, I'll believe anything."
