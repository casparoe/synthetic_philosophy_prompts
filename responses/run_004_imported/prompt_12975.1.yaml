answer: |-
  This is a classic dispute, and honestly, the fact that you and your friend are stuck suggests you're both latching onto genuine tensions in the text rather than missing the point. The standard textbook summary usually flattens *De Interpretatione* IX into a binary: either Aristotle is a three-valued logician *avant la lettre* (rejecting bivalence) or he is a compatibilist preserving bivalence but denying necessity.

  Your friend is right that the **modal scope distinction** is present and essential. Your intuition is right that the **semantic language** ("actually true," "determinately") resists being reduced *only* to a modal point.

  Here is how to work through the specific textual friction you're facing, without resorting to the usual "Aristotle invented truth-value gaps" slogan.

  ### 1. The Friend's Win: The Modal Scope Distinction is Necessary
  Your friend is correct that Aristotle explicitly deploys the distinction between the necessity of the consequence and the necessity of the consequent. Look at the end of your passage:

  > "It is necessary that there either will or will not be a sea-battle tomorrow, but it is not necessary that there should be one tomorrow..."

  This is the *divided* vs. *composite* sense (to use the later scholastic terms your friend cited).
  *   **Composite:** $\square(p \lor \neg p)$ — Necessarily, (battle or no battle). **Aristotle accepts this.**
  *   **Divided:** $(\square p) \lor (\square \neg p)$ — (Necessarily battle) or (Necessarily no battle). **Aristotle rejects this.**

  If your friend stopped there, they would be ignoring half the text. But they are right that this distinction does a lot of heavy lifting. It allows Aristotle to affirm the Law of Excluded Middle (LEM) for the *contradiction* as a whole ("one of the two propositions... must be true") while denying that the truth of either side is *fixed by nature*.

  ### 2. Your Win: "Determinately" is not just "Necessarily"
  However, your pushback is the stronger philosophical reading of the specific phrasing in the middle of the passage. If Aristotle only cared about modal scope, he could have said: *"It is true now that there will be a battle, but it is not necessarily true."*

  He does not say that. He says:
  > "...we cannot say **determinately** [horismenōs] that this one or that one is false... it cannot **yet** be said to be **actually** [ēdē] true or **actually** false."

  The word *horismenōs* (determinately/definitely) is the pivot. If the proposition "There will be a sea battle" were *true* right now (even contingently true), why could we not say *determinately* that it is true?

  This suggests that for Aristotle, truth is a correspondence relation to **actualized states of affairs**.
  *   For past and present statements, the state of affairs is actualized. The correspondence is fixed. The truth is *determinate*.
  *   For future contingents, the state of affairs is *potential*, not actual. There is nothing "out there" yet to make the statement correspond.

  Therefore, the statement isn't just "contingently true"; it lacks the ontological grounding to be called "actually true" *at this moment*. This supports your view: Aristotle is making a semantic claim about the present status of the proposition, not just a modal claim about its inevitability. The truth value is not merely hidden from us (epistemic); it is unsettled in reality (ontological).

  ### 3. Reconciling the Two: The "Disjunction vs. Disjunct" Move
  So, how do we resolve the tension where Aristotle says "One... must be true" (Friend's point) but also "Neither is actually true" (Your point)?

  The solution lies in distinguishing the truth of the **contradiction** from the truth of the **disjuncts**.
  *   **The Contradiction:** "Either there will be a battle or there will not." This is *always* true. It corresponds to the metaphysical fact that reality is exhaustive (something must happen).
  *   **The Disjuncts:** "There will be a battle." This proposition does not *yet* correspond to a fact.

  Aristotle is effectively arguing that **Bivalence applies to the pair, but not yet to the individual members.**
  Your friend wants to say Bivalence applies to the members (one is T, one is F, we just don't know which).
  You want to say Bivalence does not apply to the members (neither is T or F yet).

  Aristotle's text supports you here *if* we read "must be true" as "must *eventually turn out to be* true." The phrase "cannot **yet** [ōpō] be said" implies a temporal qualification on truth itself. For Aristotle, truth seems to have a temporal index. A statement about the future becomes true only when the potentiality is actualized.

  ### 4. The Fatalism and Diodorus Connection
  This is where your question about the Diodorean Master Argument becomes decisive.

  The Fatalist argument (which Diodorus later sharpened) runs like this:
  1.  If "There will be a battle" is true now, then it cannot fail to happen.
  2.  If it cannot fail to happen, it is necessary.
  3.  Therefore, if it is true now, it is necessary.

  To block this, you have two options:
  *   **Option A (Friend's Compatibilism):** Accept (1) is false. A proposition can be true now without being necessary. (This requires a robust theory of contingent truth that Aristotle doesn't seem to fully articulate here).
  *   **Option B (Your Indeterminacy):** Accept (1) is true, but deny the antecedent. "There will be a battle" is **not true now**.

  Aristotle's language ("it cannot yet be said to be actually true") strongly suggests **Option B**. He seems to believe that if you grant the proposition is *true now* (even contingently), you have already conceded too much to the Fatalist. You have reified the future into a fixed fact.

  By denying that the proposition is *actually* true now, he blocks the inference to necessity at the source. He isn't just saying "It's not necessary"; he's saying "It's not true *yet*." This is why the scope distinction alone (Friend's view) isn't enough. The scope distinction explains why the *event* isn't necessary, but the truth-value gap explains why the *proposition* doesn't trigger fatalism.

  ### 5. Verdict on the Argument
  You can tell your friend this:

  1.  **They are right** that Aristotle uses the modal scope distinction to prevent the collapse of contingency into necessity. That is the logical engine of the chapter.
  2.  **However, you are right** that Aristotle does not think that distinction alone saves the phenomenon of contingency. If the statement were *true* now, deliberation would be futile (a key worry for Aristotle).
  3.  **The Synthesis:** Aristotle is committed to a view where **Excluded Middle holds for contradictions, but Bivalence fails for individual future contingents *at the present moment*.**

  The phrase "cannot say determinately" is not innocuous. It is Aristotle's way of saying that truth requires actuality. Since the future battle is not actual, the statement is not true. It is not "false" that it will happen, nor "true" that it will happen. It is **indefinite**.

  So, the text commits him to denying bivalence *in advance of the fact*. He preserves the *principle* of bivalence (everything is either true or false) by adding a temporal clause: everything is either true or false *when the event has occurred*. Until then, the disjunction is true, but the disjuncts are indeterminate.

  Your friend is reading Aristotle through a modern modal logic lens (where truth is timeless). You are reading him through his own metaphysical lens (where truth tracks actuality). On the text provided, your reading captures the "actually" and "yet" qualifiers that the modal-only reading has to explain away. Aristotle isn't just solving a logic puzzle; he's trying to save the reality of chance and choice, and he thinks that requires the future to be semantically open, not just modally contingent.
