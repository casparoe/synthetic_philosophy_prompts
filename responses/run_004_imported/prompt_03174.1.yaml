      *   **The Core Question:** Is there a real, defensible principle behind the idea that small harms cannot be aggregated to outweigh a severe harm (lexical priority/incommensurability), or is it just an emotional cop-out?
      *   **Goal:** Understand the philosophical/ethical disagreement, not necessarily get a verdict on fire drills.

  2.  **Identify the Ethical Frameworks:**
