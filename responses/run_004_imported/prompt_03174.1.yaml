answer: |-
  This is a sophisticated ethical question that cuts to the heart of moral philosophy and public policy. You have stumbled upon a classic debate between **aggregative consequentialism** (your position) and **lexical priority** or **deontology** (the assistant principal's position).

  To answer your core question directly: **Yes, there is a real, defensible philosophical principle behind the assistant principal's claim.** It is not merely a comforting instinct or a refusal to do math. However, your friend is also correct that society routinely violates this principle in other contexts.

  Here is a breakdown of the actual disagreement, the principles involved, and where the tension lies.

  ### 1. Your Argument: Aggregation and Expected Utility
  Your position relies on **Expected Utility Theory**. In this framework, all outcomes (time, money, safety, health) are converted into a common currency of "utility" (value).
  *   **The Logic:** Risk is calculated as $Probability \times Impact$. If the probability of a fire is near zero, the "expected harm" is low.
  *   **The Trade-off:** You are comparing the *certain* loss of utility (650,000 minutes of learning/time) against the *probabilistic* loss of utility (risk of injury).
  *   **The Friend's Point:** Your friend is right that modern governance relies on this. Economists and policymakers use a metric called the **Value of a Statistical Life (VSL)**. When the Department of Transportation sets speed limits or designs guardrails, they implicitly decide that saving a life is worth \$X million, but not \$infinity. If a safety measure costs more than the VSL of the people it saves, it often isn't implemented.

  From this viewpoint, the assistant principal is committing a category error by refusing to convert "minutes" and "safety" into a comparable metric.

  ### 2. The Assistant Principal's Argument: Lexical Priority
  The assistant principal is arguing from a framework often called **Lexical Priority** or **Threshold Deontology**.
  *   **Incommensurability:** This principle holds that certain values (like human life, bodily integrity, or basic rights) are *incommensurable* with others (like time, convenience, or money). They exist on different scales. You cannot add up enough "minutes" to equal one "life," just as you cannot add up enough "apples" to equal one "orchestra."
  *   **The Separateness of Persons:** Philosophers like John Rawls and Robert Nozick argued that utilitarianism fails because it treats society as a single entity. It assumes it's okay to impose a heavy cost on *one* person (the student who might die in a fire) to provide small benefits to *many* (everyone else saving time). The AP's view is that the school has a specific **duty of care** to each individual student that cannot be overridden by the aggregate convenience of the student body.
  *   **The "Shocking Conclusion":** If you accept the student's logic fully, you must accept that if the annoyance were high enough (e.g., 10 billion minutes saved), it would be acceptable to reduce drills to zero, even if it meant a 1% chance of a mass casualty event. Most people find this morally repugnant. The AP is drawing a bright line: **Safety thresholds are not subject to democratic or statistical negotiation.**

  ### 3. Is the AP Being Inconsistent?
  Your friend argues that society accepts these trade-offs elsewhere (speed limits, etc.). This is true, but there are two defenses for the AP's inconsistency:

  **A. The Context of *Parens Patriae***
  Schools operate under a legal and ethical doctrine called *parens patriae* (state as parent). When you drive on a highway, you are a consenting adult accepting risk. When you are in school, you are a minor under the custody of the state. The threshold for "acceptable risk" is much lower for children in custody than for adults in public spaces. The AP might argue that while *society* trades safety for speed, *this school* cannot trade student safety for instructional time.

  **B. Diminishing Returns vs. Zero Risk**
  The AP's statement ("no quantity... can ever add up") is a philosophical absolute, but in practice, she likely means "no quantity of *minor inconvenience*."
  *   If the drill took 2 hours every day, even the AP would likely agree to cut back.
  *   Her point is that 10 minutes falls below the **threshold** where trade-offs become permissible. She is arguing that minor inconvenience is *lexically inferior* to safety. It doesn't matter how much of it you have; it still ranks lower on the moral hierarchy.

  ### 4. Where the Math Might Actually Support the AP
  There is a statistical counter-argument to your proposal that isn't about ethics, but about **system reliability**.
  *   **Muscle Memory:** Fire drills are not just about knowing the route; they are about automating the response under stress. Reducing frequency from 9 times to 2 times might degrade the "muscle memory" of the staff and students.
  *   **The "Black Swan" Problem:** In statistics, rare events with high impact are notoriously difficult to model. Just because a fire hasn't happened in 30 years doesn't mean the probability is zero; it might mean the conditions haven't aligned *yet*.
  *   **Compliance:** If the school signals that safety protocols are negotiable based on convenience, compliance with *other* safety protocols (lab safety, hallway monitoring) might erode.

  ### 5. The Verdict on the Disagreement
  You asked if the AP's principle is defensible or just a comforting instinct.

  **It is defensible.** It is a standard position in human rights ethics. We do not allow voting to decide if one innocent person should be executed to calm an angry mob, even if the "utility" of calming the mob (preventing a riot, saving time, reducing stress) outweighs the loss of one life. The AP views safety as a **right**, not a **commodity**.

  **However,** your friend is also right that this principle is rarely applied consistently. If we truly believed no amount of convenience outweighed a risk of death, we would ban cars, swimming pools, and contact sports.

  **The Synthesis:**
  The disagreement isn't about the math; it's about the **domain**.
  *   **In Public Policy (Friend's view):** We treat safety as a commodity to be optimized. We accept deaths to keep the economy moving.
  *   **In Institutional Duty (AP's view):** We treat safety as a non-negotiable obligation. A school's primary mandate is the welfare of the child, not the efficiency of the schedule.

  **Conclusion:**
  The assistant principal is not necessarily "copping out." She is invoking a **deontological constraint**: *Do not increase the risk of death for convenience.* This is a robust ethical stance. However, your proposal highlights that **absolute** adherence to this stance is impossible (we can't have zero risk).

  The productive middle ground isn't to ask "Is the time worth the risk?" (which the AP rejects), but to ask: **"Is the *marginal safety benefit* of the 9th drill negligible compared to the 2nd?"**
  If you can prove statistically that 2 drills provide 95% of the safety benefit of 9 drills, you aren't asking her to trade safety for time; you are asking her to eliminate **waste**. That frames the argument in a way that respects her ethical principle while utilizing your statistical evidence.
