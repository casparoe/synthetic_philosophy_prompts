      *   *Nuance:* The AP isn't saying risk should be *zero* (which is impossible), but that the *threshold* for accepting risk to life shouldn't be determined by minor inconveniences.

  4.  **Deconstruct the Student's/Friend's Position (The "Risk Trade-off" Argument):**
