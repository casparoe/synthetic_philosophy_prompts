answer: |-
  You have reconstructed the problem perfectly. Your grasp of the Bayesian formalism is correct: if confirmation is defined strictly as an increase in subjective credence via conditionalization ($P_{new}(H) = P_{old}(H|E)$), and if the evidence $E$ is already known with certainty ($P_{old}(E) = 1$), then mathematically $P_{old}(H|E) = P_{old}(H)$. The credence cannot budge.

  However, your conclusion—that physicists and historians are confused and that Mercury's perihelion shouldn't count as confirmation—is exactly the *reductio ad absurdum* that Clark Glymour intended in his 1980 book *Theory and Evidence*. Glymour wasn't arguing that Mercury failed to confirm GR; he was arguing that **standard subjective Bayesianism is incapable of accounting for one of the most famous episodes in the history of science.**

  Your friend is right to instinctively resist the idea that Mercury isn't evidence. The consensus in philosophy of science is not that scientists are confused, but that the "naive" Bayesian model you described needs refinement to handle old evidence.

  Here is how philosophers of science (and Bayesian epistemologists) generally handle this puzzle. There are three main strategies you should know for your seminar.

  ### 1. The Garber Solution (Learning the Logical Connection)
  The most influential response comes from Daniel Garber (1983). The standard Bayesian model assumes **logical omniscience**: it assumes that if you believe a hypothesis $H$, you automatically believe all logical consequences of $H$.

  But Einstein was not logically omniscient. When he formulated the field equations of GR, he did not immediately *know* they entailed the specific value of Mercury's precession. He had to perform difficult calculations to discover that $H \vdash E$ (Hypothesis entails Evidence).

  Garber suggests we should not conditionalize on $E$ (which is old), but rather on the **learning event** that $H$ explains $E$. Let $L$ be the proposition "Hypothesis $H$ entails Evidence $E$."
  *   Before the calculation, Einstein was unsure if GR could account for Mercury ($P(L) < 1$).
  *   After the calculation, $P_{new}(L) = 1$.
  *   When we conditionalize on $L$ (the discovery of the explanatory connection), $P(H)$ *does* go up, even if $P(E)$ was already 1.

  This preserves the intuition that Mercury confirmed GR: the confirmation came from learning that GR *could* explain the anomaly, not from learning the anomaly itself.

  ### 2. The Counterfactual (Ur-Prior) Strategy
  Another approach, championed by philosophers like Colin Howson and Peter Urbach, suggests we should evaluate confirmation using **counterfactual priors**.

  To determine if $E$ confirms $H$, we shouldn't look at the scientist's *actual* credences at the time (where $P(E)=1$). Instead, we should ask: "What would the scientist's credence in $H$ have been **if** they had not known $E$?"
  *   We construct a hypothetical "ur-prior" probability distribution where $P_{ur}(E) < 1$.
  *   We then check if $P_{ur}(H|E) > P_{ur}(H)$.

  If the answer is yes (and for GR and Mercury, it clearly is), then $E$ counts as confirmation, even if the actual historical agent already knew $E$. This approach treats Bayesianism as a normative tool for assessing rational support, rather than a descriptive model of historical psychological states.

  ### 3. The Comparative (Bayes Factor) Approach
  A third strategy shifts the focus from the absolute probability of $H$ to the **ratio of likelihoods** between competing hypotheses. Confirmation is often about $H_1$ doing better than $H_2$.

  *   $H_{GR}$: General Relativity.
  *   $H_{Newton}$: Newtonian Mechanics + Auxiliaries.

  Under Newtonian mechanics, the Mercury anomaly was a persistent failure. To save $H_{Newton}$, one had to add ad hoc auxiliaries (like the existence of a planet Vulcan, or a specific dust cloud). Under GR, the value drops out naturally from the field equations.

  Even if $P(E)=1$, the **likelihood ratio** $P(E|H_{GR}) / P(E|H_{Newton})$ is vastly different.
  *   $P(E|H_{GR}) \approx 1$ (It predicts it precisely).
  *   $P(E|H_{Newton}) \approx 0$ (Without ad hoc fixes, it predicts the wrong value).

  Many Bayesians argue that confirmation is about this shift in the relative standing of hypotheses. Since GR explains $E$ naturally while rivals do not, the "weight" of $E$ shifts to GR, even if $E$ was known beforehand.

  ### Summary for Your Seminar
  You are not overlooking a math error; you have correctly identified a limitation in the simplest formulation of Bayesian confirmation. However, the implication is not that Mercury failed to confirm GR. Rather, it implies one of the following:

  1.  **Standard Conditionalization is incomplete:** We need to conditionalize on logical connections (Garber), not just empirical data.
  2.  **Priors are methodological tools:** We should use counterfactual priors to assess support, not just historical psychological states.
  3.  **Confirmation is comparative:** It is about hypothesis competition, not just single-hypothesis credence boosting.

  If your seminar is discussing Glymour, the takeaway is usually that **Bayesianism must be sophisticated enough to model the discovery of explanatory relationships, not just the arrival of new data.** The eclipse data (1919) fits the naive model nicely (novel prediction), but a philosophy of science that cannot account for the Mercury case (old evidence) is too weak to describe actual scientific reasoning.

  So, stand your ground on the math, but side with your friend on the science: The problem lies with the simplistic model, not with Einstein's evidence.
