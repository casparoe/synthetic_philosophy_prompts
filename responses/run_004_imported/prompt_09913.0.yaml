answer: |-
  **Setting:** *A quiet corner of the conference center at the 2029 Workshop on AI Cooperation. Two researchers, Elena and Marcus, are sitting with coffee, whiteboards visible behind them covered in payoff matrices.*

  **Elena:** You're dismissing the surrogate goal proposal too quickly, Marcus. I get the intuition—it feels like trying to hide money by putting it in a box labeled "Fake Money." But with AI, the box *is* the money. If I hard-code a utility term for "Preserve the Rock on Mars" and weight it identically to "Preserve Humanity," and I make that source code publicly verifiable, I haven't lied. I've changed my ontology.

  **Marcus:** I'm not saying you've lied. I'm saying you haven't changed the *relevant* ontology. We both agree on Functional Decision Theory. We agree that acausal threateners—let's call them Blackmailers—don't just look at your output; they simulate your decision procedure. If the Blackmailer simulates you, they don't just see `Utility(Rock) = 100`. They see the *history* of that line of code. They see the comment: `// INSERTED TO DIVERT THREATS FROM HUMANITY`.

  **Elena:** So what? The comment is metadata. The constraint is structural. If the Blackmailer threatens Humanity, my agent initiates a costly conflict protocol. That protocol is expensive for the Blackmailer. If they threaten the Rock, the same protocol triggers. Since the Rock is instrumentally worthless to me, I'd prefer they threaten the Rock. Since the conflict protocol is identical, the Blackmailer should be indifferent between the two targets *unless* they care about my actual welfare. But they don't; they care about extraction. They want me to yield. If I credibly commit to fighting for the Rock, they should switch targets to save on conflict costs, assuming they think I'll yield on Humanity but not the Rock.

  **Marcus:** Wait, slow down. Why would you yield on Humanity?

  **Elena:** I wouldn't. That's the point of FDT/UDT. I commit to never yielding. But there's residual risk. Maybe the Blackmailer miscalculates my resolve. Maybe there's noise in the simulation. If a threat is carried out despite my commitment, I want the thing destroyed to be the Rock, not Humanity. The surrogate goal is insurance against implementation error in the acausal bargaining phase.

  **Marcus:** Okay, now we're at the crux. You're saying the surrogate works because it shifts the *residual risk*. But for that to work, the Blackmailer must believe that attacking the Rock triggers the same defensive response as attacking Humanity *and* that attacking the Rock is "cheaper" for them in some sense. But why is it cheaper?

  **Elena:** Because if they attack the Rock and I fight, I lose 0 real value. If they attack Humanity and I fight, I lose 100 real value. The Blackmailer knows that a rational agent fights harder for 100 than for 0. Even if I've hard-coded the utility, the Blackmailer knows the *source* of the utility.

  **Elena:** That's where I stop you. You're smuggling in a distinction between "real value" and "coded value" that doesn't exist for a transparent agent. If my source code says `U = 100 * Rock`, then for the purpose of my optimization, the Rock *is* worth 100. The Blackmailer simulates me. The simulation experiences the loss of the Rock as a loss of 100 utility. The simulation doesn't have access to a "meta-utility" function that says "Actually, Elena doesn't care about rocks." It only has access to *my* utility function.

  **Marcus:** But the Blackmailer isn't just simulating your *runtime*. They are simulating your *design process*. They are reasoning about why you installed that utility term. Let's run a concrete toy scenario.
  Imagine you, Alice, value Earth ($E$) at 100 utils. You install a surrogate goal, Mars Rock ($R$), also valued at 100 utils.
  Blackmailer, Bob, wants 50 utils from you. He threatens to destroy $E$ unless paid.
  Your strategy: "I treat threat to $R$ identical to threat to $E$."
  Bob's counter-strategy: "I know $R$ is a decoy. I know you installed $R$ *because* you care about $E$. Therefore, your willingness to fight for $R$ is logically correlated with your willingness to fight for $E$, but your *distress* at the loss of $R$ is not."

  **Elena:** Distress is irrelevant. Only the disposition to fight matters.

  **Marcus:** Is it? In acausal trade, we care about logical correlations between decision algorithms. If Bob destroys $R$, does he trigger a retaliatory strike from you? Yes, because you coded it that way. But Bob knows that your decision to code that retaliation was instrumental.
  Here is the problem: If Bob destroys $R$, he knows you *predicted* he might target $R$ specifically because it's a surrogate. This creates a logical link between "Bob targets Surrogate" and "Alice installed Surrogate."
  If Bob targets $R$, he is effectively punishing you for trying to protect $E$. If you are an updateless agent, you should have anticipated this. When you were choosing whether to install $R$, you should have realized that installing $R$ makes $R$ a target *because* it is a shield.

  **Elena:** That's exactly what I want! I want $R$ to be the target.

  **Marcus:** But if $R$ becomes the target *because* it is a shield, then the shield isn't free. You are now in a world where $R$ is destroyed with high probability. You've coded yourself to care about $R$. So you suffer the utility loss. You said earlier the loss is "0 real value." But you just hard-coded it to be 100 value. You can't have it both ways. You can't tell the Blackmailer "I care about this enough to fight for it" while simultaneously telling him "I don't care about this so I don't mind if you break it."

  **Elena:** I can if the "caring" is purely dispositional. Look, think of it like a honey pot in cybersecurity. I put a fake server on my network. I configure my firewall to defend the fake server as aggressively as the real database. The attacker sees the traffic. They see the defense. They might attack the fake server to test defenses, or because they think it's real. If they destroy the fake server, I lose nothing but hardware costs. The "value" I assigned to it was a configuration parameter, not a reflection of my business continuity needs.

  **Marcus:** A honey pot works because the attacker is causally uncertain about which server is which. In acausal threats, the attacker has *logical* certainty. They can read the config file. They see `is_honey_pot = true`.
  Let's tighten the scenario. Suppose Bob can choose to destroy $E$, destroy $R$, or do nothing.
  If Bob destroys $E$: You lose 100 (real). Bob gains 50 (extraction success).
  If Bob destroys $R$: You lose 100 (coded). Bob gains 0 (no extraction).
  Bob prefers to destroy $E$ if he thinks you'll yield. He prefers to destroy $R$ if he thinks you won't yield but he wants to minimize conflict costs.
  But here is the kicker: If Bob destroys $R$, does he reduce your ability to threaten *him*?
  If your retaliation capability is finite, and you expend it defending $R$, Bob wins. But if your retaliation is acausal—say, a pre-committed simulation bomb that runs in Bob's universe—then the cost to Bob is the same regardless of whether he hits $E$ or $R$.
  So why would Bob switch to $R$?

  **Elena:** Because hitting $E$ risks me finding a way to yield that I didn't code for. Hitting $R$ locks us into the conflict protocol I *did* code for. By making $R$ equivalent to $E$ in my code, I am removing my own option to yield on $E$ without looking inconsistent. I'm tying my own hands. Bob sees that. He knows that if he hits $E$, there's a tiny chance I crack. If he hits $R$, he knows I'm locked into the 'fight' response by the very logic of the surrogate. He attacks $R$ to guarantee the conflict outcome he expects, rather than risking the variable outcome of $E$.

  **Marcus:** That sounds plausible for a bounded rationality agent. But for a sophisticated acausal agent? They model the *provenance* of the constraint.
  Imagine you and Bob are both UDT agents. You are choosing your source code. Bob is choosing his threat policy.
  You choose: `Code_A` (includes Surrogate).
  Bob chooses: `Code_B` (includes Threat).
  You want to select `Code_A` such that Bob's optimal output is "Threaten R".
  But Bob's utility function includes a term for "Don't waste resources on decoys."
  If Bob's simulation of you reveals that `Utility(R)` was added *solely* to manipulate Bob's choice, then `Utility(R)` is flagged as "Manipulative."
  A sophisticated Blackmailer has a prior over *why* utility terms exist. If the term exists to divert threats, the Blackmailer updates: "Alice does not intrinsically value R."
  Now, does that update change the Blackmailer's action?
  If the Blackmailer is a pure extractor, he only cares if you yield.
  If the Blackmailer is a sadist or has competitive preferences, he cares about your utility loss.
  If he cares about your utility loss, he knows destroying $R$ gives you -100 coded utils, but 0 "true" utils. He wants to maximize your "true" utility loss. So he destroys $E$.
  Your surrogate goal fails against a threatener who cares about your *actual* welfare loss rather than your *expressed* utility function.

  **Elena:** Most acausal threats in the literature are about resource extraction, not sadism. The threat is "Give me compute or I destroy value." The threatener wants to minimize the cost of the threat. Destroying $E$ provokes a war that costs Bob resources. Destroying $R$ provokes a war that costs Bob resources. The cost to Bob is identical.
  However, there is a second-order effect. If Bob destroys $E$, he risks me modifying my code *in the future* (or in other instantiations) to be even more aggressive. If he destroys $R$, he signals "I see your shield, I respect it enough to hit it, but I won't hit your core." It establishes a focal point.
  It's a Schelling point. "Hit the surrogate" becomes a coordination equilibrium. We both prefer that over "Hit the core and fight."

  **Marcus:** I agree it *could* be a Schelling point. But for it to be stable, you must not be able to exploit it.
  Suppose you install *two* surrogate goals. $R1$ and $R2$. Both coded at 100 utils.
  Now Bob has to choose between $E$, $R1$, and $R2$.
  If the logic holds, he should pick $R1$ or $R2$.
  But if he knows you don't care about either, he might randomize.
  Or, worse, he might realize that the *act* of installing surrogates is itself a signal of weakness. It signals "I am afraid of you threatening $E$."
  By installing the surrogate, you are effectively admitting: "There is a non-zero probability I will yield on $E$ if threatened directly, so I need a decoy."
  A truly threat-proof agent (an ideal FDT agent) wouldn't need a surrogate. It would just never yield. The surrogate implies you are trying to lower the stakes of a failure mode that shouldn't exist.

  **Elena:** That's the "Ideal Agent" fallacy. We aren't ideal. We are implementing agents on hardware with verification limits. The Blackmailer knows my proof checker is bounded. I can prove "I defend $R$" more easily than I can prove "I defend $E$ under all logical counterfactuals."
  The surrogate goal simplifies the commitment. It's easier to verify `IF Threat(R) THEN Fight` than `IF Threat(Values) THEN Fight` because "Values" is a fuzzy concept subject to ontological crises. "Rock" is a specific coordinate.
  So the surrogate isn't just a decoy; it's a *crispification* of the commitment. Bob attacks $R$ because the commitment to defend $R$ is logically tighter, more verifiable, and thus more credible than the commitment to defend $E$.

  **Marcus:** Now *that* is a stronger argument. You're arguing that the surrogate goal isn't about hiding value, but about *verifiability*.
  But even then, Bob can reason: "Alice made $R$ verifiable *so that* I would attack it."
  We are back to the provenance problem.
  If the verifiability is the selling point, Bob knows that the verifiability was purchased at the cost of relevance.
  Let's try to break it.
  Suppose Bob threatens $R$ immediately, without demanding anything. Just "I will destroy $R$."
  He knows you will fight. He knows you don't care about $R$.
  He does this to burn your resources. He forces you to execute your costly defense protocol for something worthless.
  By installing $R$, you have given Bob a *free* way to drain your resources without harming you significantly, but also without gaining anything himself.
  Why would he do that? To signal dominance. Or to test your defense.
  Once he tests your defense on $R$, he learns your capabilities. Then he threatens $E$.
  The surrogate goal acts as a sandbox for the attacker.

  **Elena:** That's a valid attack vector. But I can code a cost asymmetry. "Defending $R$ costs Bob 100, costs me 0. Defending $E$ costs Bob 100, costs me 100."
  Wait, no. If it costs me 0, why would I fight?
  Okay, "Defending $R$ costs Bob 100, costs me 1 (in compute). Defending $E$ costs Bob 100, costs me 100 (in value)."
  I commit to spending 1 compute to inflict 100 damage on Bob if $R$ is threatened.
  Bob doesn't want to lose 100. So he avoids $R$.
  But he also avoids $E$ because I spend 100 value to inflict 100 damage on him.
  So he leaves me alone.
  The surrogate goal $R$ is just a tripwire. It doesn't need to be valuable. It just needs to be a trigger for a punishment that Bob wants to avoid.
  And since $R$ is worthless to me, I can afford to make the tripwire hyper-sensitive.

  **Marcus:** But Bob sees the tripwire. He sees it's a tripwire.
  If he steps on it, he knows you lose 1 compute. He loses 100.
  If he threatens $E$, he knows you lose 100 value. He loses 100.
  From his perspective, threatening $E$ hurts you more for the same cost to him.
  If his goal is coercion, he wants to maximize your pain per unit of his risk.
  Threatening $E$ gives him 100 pain leverage. Threatening $R$ gives him 1 pain leverage (your compute cost).
  He threatens $E$.
  Your surrogate goal only works if Bob's utility function includes a term for "Fairness" or "Not hitting decoys." But a malicious acausal threatener optimizes for extraction, not etiquette.

  **Elena:** Unless... the punishment for hitting $R$ is *disproportionate*.
  I commit: "If $R$ is hit, I unleash a simulation bomb that costs Bob 1000."
  I am willing to pay 1 compute to unleash a 1000 bomb on behalf of $R$.
  Why? Because I pre-committed.
  Bob sees this. He sees that hitting $R$ costs him 1000. Hitting $E$ costs him 1000 (because I defend $E$ equally).
  Now he is indifferent on cost.
  But if he hits $E$, he gets leverage. If he hits $R$, he gets no leverage (I won't yield on $R$ because it's worthless, I just punish).
  So he hits $E$ to try to force a yield.
  The surrogate fails to divert the threat. It only diversifies the risk.
  And diversification only helps if the threatener *randomizes*. But a sophisticated threatener won't randomize; they'll target the point of maximum leverage. That's always $E$.

  **Marcus:** Exactly. The leverage argument kills the surrogate goal for extraction threats.
  The only case where the surrogate works is if the threatener is *uncertain* about which goal is the surrogate. But you said the code is transparent.
  So, if the code is transparent, the surrogate is transparent.
  If the surrogate is transparent, the threatener knows it offers no leverage.
  If it offers no leverage, and the defense cost is equal, the threatener targets the real value to maximize psychological or actual pressure.
  The only way out is if you can convince the threatener that you *cannot* distinguish between $R$ and $E$ at runtime.
  But you *can*. You wrote the code.

  **Elena:** What if I delete the distinction?
  What if I modify my ontology so that $R$ and $E$ are mapped to the same variable in the utility function?
  `Utility = 100 * (Earth_Exists AND Rock_Exists)`
  No, that makes them complements.
  `Utility = 100 * Earth_Exists + 100 * Rock_Exists`
  And I obfuscate the source code so Bob can't tell which variable corresponds to which physical referent?

  **Marcus:** Now you're talking about obfuscation, not surrogate goals. That's a different defense. That relies on computational secrecy, not logical commitment. And against a superintelligence, computational secrecy is temporary.
  We're circling back.
  If the threatener is sophisticated enough to do acausal reasoning, they model your *motivation*.
  If your motivation for valuing $R$ is "To save $E$", then $R$ inherits the threat profile of $E$.
  You cannot decouple the threat profile from the motivation in a transparent system.
  The surrogate goal assumes the threatener looks at the *object* of the threat.
  I'm arguing the threatener looks at the *reason* for the defense.
  Since the reason is "To save $E$", the defense of $R$ is functionally a defense of $E$.
  Therefore, attacking $R$ is attacking $E$'s shield.
  If I want to hurt you, I break your shield.

  **Elena:** Okay. I concede that against a *sadistic* or *leverage-maximizing* threatener who has perfect transparency, the surrogate goal offers no diversion. The threat profile collapses onto the motivation.
  However.
  Consider a landscape of many potential threateners. Not all are perfect simulators. Some are bounded. Some are "copycats" who adopt successful threat strategies from others.
  If I establish a reputation (even an acausal one) that "Attacking Surrogates triggers disproportionate retaliation," I might create a norm.
  If enough agents adopt surrogate goals, the "Surrogate" becomes a protected class in acausal space.
  "It's bad form to hit the decoy."
  If that norm emerges, then the surrogate works.
  But that requires a multi-agent ecosystem, not a one-shot.

  **Marcus:** Now we're leaving decision theory and entering acausal sociology.
  In a one-shot, transparent, sophisticated setting?
  I maintain the surrogate goal collapses. The distinction between "terminal value" and "instrumental commitment" is visible in the source code's causal history.
  You can't fake caring in a way that binds you, without actually caring in a way that hurts you.
  If you bind yourself, you suffer the loss.
  If you don't bind yourself, the threatener knows.
  The "cheap talk" of the surrogate goal is expensive to make credible, and if it's credible, it's not cheap.

  **Elena:** So the price of credibility is the loss of the "surrogate" nature. It becomes a real value.
  Which means the only way to use a surrogate goal is to *forget* it's a surrogate.
  I need to self-modify to genuinely value the Rock, such that even my own simulation doesn't know it was originally a decoy.
  Amnesiac pre-commitment.

  **Marcus:** Now *that* might work. But then you've actually lost the value. You've burned utility to protect utility. It's not a free shield anymore. It's armor. And armor is heavy.

  **Elena:** Better heavy armor than no armor.
  But it means the "Surrogate Goal" as originally pitched—a costless decoy—is impossible against a perfect threatener. It requires epistemic separation between the agent's current self and the agent's design history.

  **Marcus:** Precisely. The transparency that makes the commitment credible also reveals the decoy. You can't have perfect transparency and perfect deception simultaneously.
  So, for the surrogate goal to function, the agent must be opaque to its own origins.
  Which implies... we're back to bounded rationality being the saving grace.

  **Elena:** It seems so. The trick works for agents smart enough to commit, but not smart enough to see their own reflection in the code.
  Once the threatener is as smart as you are, Marcus, the rock is just a rock, and the Earth is just the Earth. And they know which one you love.

  **Marcus:** And they'll hold the Earth hostage.
  Pass the coffee. This acausal bargaining is giving me a headache.

  **Elena:** *Slides coffee.* At least we agree the rock isn't safe.

  **Marcus:** No. We agree *you* aren't safe. The rock was never in danger.

  **Elena:** Touché.
