  2.  **Determine the Recommendation:**
      *   *Option 1: Run it as a breakthrough.* (Too risky. Violates scientific standards, invites backlash if it fails, harms credibility.)
      *   *Option 2: Hold it entirely.* (Misses news value. Rivals are running it. If it *is* real, we look slow. Doesn't serve the public interest of knowing what's happening.)
      *   *Option 3: Run it framed carefully.* (Best balance. Acknowledges the testimony but contextualizes the epistemic limits. Aligns with responsible science journalism.)
      *   *Decision:* Recommend running the story, but strictly framed as *preliminary, unverified, and high-risk*, while explicitly detailing the lack of controls. This honors the "Reid" side (testimony has value) but satisfies the "Hume" side (we must explain *why* this testimony isn't yet knowledge/fact).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
