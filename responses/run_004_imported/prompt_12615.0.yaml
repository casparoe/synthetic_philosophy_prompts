          *   *Side B (Hume-ish):* Testimony alone is insufficient without independent verification/reduction to experience (needs controls/verification).
      *   **Requirements:**
          *   Recommend one specific course of action (Run, Hold, or Run Framed).
          *   Include a concrete timetable for revisiting.
          *   Take the rejected side's position seriously (no strawmanning).
