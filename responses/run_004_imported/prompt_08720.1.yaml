          *   SE says: Function is whatever it was selected *for*. Was it selected for refraction (crystallin function) or metabolism (LDH function)?
      *   **User's Argument:** SE struggles here because it's a "recent recruit." How much selection for transparency is needed before it counts as a function vs. a by-product (spandrel/exaptation)?

  3.  **Evaluate Question 1: Accuracy of Philosophical Accounts:**
