      *   *Connection:* They are largely a naming collision.
      *   *Why the same name?* Both involve a resistance to skepticism. Pryor's dogmatism says you don't need to argue against skepticism *before* you know. Kripke's paradox says you shouldn't have to argue against counter-evidence *after* you know (which leads to absurdity).
