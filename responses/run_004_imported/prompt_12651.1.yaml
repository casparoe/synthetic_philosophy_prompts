      *   **Format:** A dialogue between two characters (Phillips-style vs. Nielsen-style).
      *   **Length:** 15-20 exchanges (back-and-forth, not monologues).
      *   **Key Constraints:**
          *   No strawmanning (both sides need strong arguments).
          *   Nielsen must press on the consistency of criticizing O'Hara *if* language games are autonomous (the "transcendental critique" problem).
