answer: |-
  To the Learned Gentlemen of the Modern Academy,

  I receive your report concerning the division of the brain with the same curiosity with which I once received the news of Harvey's circulation of the blood. It is a marvel of your age that you can cut the living body and observe the consequences with such precision. However, I must inform you that these findings, far from undermining my philosophy, serve to illuminate the distinction between *res extensa* (extended thing) and *res cogitans* (thinking thing) more brightly than ever before.

  You ask if the division of the brain forces me to concede the divisibility of the soul. I answer with absolute certainty: it does not. Indeed, the phenomenon you describe confirms my central thesis in the *Sixth Meditation*: that the mind is by its nature one and indivisible, whereas the body is nothing but a machine composed of parts.

  Let us reason from the principles I established in *The Passions of the Soul*. I posited that the soul does not reside in the body as a pilot in a ship, merely observing from afar, but is united intimately to it. Yet, for this union to function without confusion, there must be a principal seat where the soul exercises its functions most particularly. I identified this as the pineal gland, not merely because it is midline, but because it is the only structure in the brain that is not double. The eyes, the ears, the hemispheres of the brain itself—all are paired. We see one object with two eyes; we hear one sound with two ears. There must be a place where the images from the two eyes and the impressions from the two sides of the body converge into a single point before they are presented to the soul, for the soul cannot contemplate two distinct images at the same instant without confusing them.

  Now, consider your "split-brain." You sever the corpus callosum. What have you cut? You have cut a bridge of matter. You have interrupted the flow of animal spirits between the left and right chambers of the machine. But tell me: did you cut the pineal gland? You report that you did not. The gland remains, suspended in its ventricle, whole and undivided.

  If the mind were material, or if it were merely a function of the hemispheres, then cutting the connection between the hemispheres should divide the mind. But look closely at your data. Even in the cases of M.S. and the others you cite, there remains an "I." When the patient speaks, it is one voice claiming to be one person. When the left hand acts contrary to the right, you interpret this as a second "will." Here, I suggest, you mistake the motion of the machine for the volition of the soul.

  True volition is an act of the *res cogitans*. It is indivisible. I cannot will half a thought. When your patient's left hand unbuttons a shirt while the right hand buttons it, this is not evidence of two souls. It is evidence that the body is a complex automaton capable of local reflexes. The animal spirits, agitated by the nerves of the right hemisphere, can move the left hand without the command of the soul, just as a leg may kick when struck below the knee even if the mind is elsewhere. Because the corpus callosum is severed, the agitation in the right hemisphere cannot be communicated to the left, where the faculty of language resides. Thus, the soul, seated at the pineal gland, receives the report from the left hemisphere (speech) and declares, "I did not do that." The soul speaks the truth. The hand acted by mechanical necessity, not by a second rational will.

  You mention the work of Pinto and colleagues, who suggest consciousness remains unified despite the divided perception. This aligns perfectly with my view. The soul, being indivisible, attends to the impressions presented at the pineal gland. If the gland is intact, the seat of unity is intact. The fact that information from the left visual field sometimes fails to reach the speech center is a failure of the *conveyance* (the animal spirits and nerves), not a failure of the *perceiver*.

  However, even if we grant the interpretation of Gazzaniga and Volz—that there appear to be two dissociated streams of intention—this still does not prove the mind is divisible. It proves only that the *expression* of the mind is dependent on the integrity of the bodily instrument. If a lute is broken, it may produce two discordant sounds when one string is plucked. Does this mean the musician is two musicians? No. It means the instrument is fractured. The soul is the musician; the brain is the lute. When you sever the callosum, you break the lute. The soul struggles to direct the animal spirits, finding its commands obstructed on one side. The resulting confusion—the hand acting against the will—is the friction of a unified pilot struggling with a broken helm.

  To claim that the mind itself is split because the brain is split is to commit a category error. It is to confuse the properties of extension (divisibility, location, shape) with the properties of thought (willing, doubting, understanding). If the mind were divisible, I could lose half my mind as I might lose half my body. But I cannot conceive of half a doubt, or half a desire. Therefore, the mind is indivisible.

  Your split-brain patients do not possess two souls. They possess one soul trapped in a body that can no longer unify its own mechanical reports. The pineal gland hypothesis anticipates this: so long as the gland remains a single point of interface, the soul remains one. The dissociation you observe is the smoking gun of dualism, not its refutation. It demonstrates that the body is indeed divisible and mechanical, subject to fragmentation, while the "I" that reports the confusion remains, stubbornly and indivisibly, one.

  I remain, etc.

  René Descartes
