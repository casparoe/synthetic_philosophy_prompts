answer: |-
  You have reconstructed the core of Aquinas's position with impressive accuracy, especially given that you are working from secondary sources and fragments. Your intuition that his view is "hedged" is correct; in fact, compared to some later medieval and early modern thinkers (like Juan de Mariana or the Monarchomachs), Aquinas is quite conservative regarding tyrannicide.

  To answer your specific question: **Aquinas's framework counsels strongly against private individuals or small groups taking violent action on their own initiative, even against a terrible ruler.** However, it does not necessarily rule out *all* violent removal; rather, it shifts the moral burden from the *act* of killing to the *authority* authorizing the act.

  Here is the step-by-step reasoning behind that conclusion, how it applies to the distinction you noted, and what it implies for modern cases like the German Resistance or modern targeted killings.

  ### 1. The Core Logic: Order vs. The Common Good

  To understand why Aquinas is so wary of private action, we have to look at his hierarchy of values. For Aquinas, the **Common Good** is the highest political value. A tyrant is evil precisely because he substitutes his private good for the Common Good.

  However, **Order** is a prerequisite for the Common Good. You cannot have a functioning society without peace and stability.

  Aquinas's reasoning proceeds like this:
  1.  Tyranny is a great evil that damages the Common Good.
  2.  However, violent disruption of the government (sedition) also damages the Common Good by creating instability, civil war, and uncertainty.
  3.  Furthermore, history shows that when private individuals kill a tyrant, the successor is often just as bad, or the chaos allows someone worse to seize power.
  4.  Therefore, the remedy for tyranny must not be worse than the disease.

  This leads to his famous caution in *De Regno* (On Kingship): if private individuals take it upon themselves to kill a ruler, "there is exposed to the multitude no less danger from the loss of a good king than from the persistence of a bad one."

  ### 2. The Distinction: Defect in Title vs. Defect in Exercise

  You correctly identified the distinction between a ruler who seized power illegitimately (*tyrannus ex defectu tituli*) and one who rules legitimately but badly (*tyrannus ex parte exercitii*). Here is how that changes the moral calculus for Aquinas:

  **Case A: The Usurper (Defect in Title)**
  *   **The Logic:** A usurper has no legitimate claim to obedience. The bond between ruler and ruled is already broken because the ruler never had the right to rule.
  *   **The Permission:** Aquinas suggests it is more permissible to remove a usurper. In fact, he argues that whoever kills a usurper to liberate the country is "praiseworthy and deserving of reward."
  *   **The Catch:** Even here, he prefers that this be done by public authority if possible. But the barrier for private action is lower because the usurper is essentially an external aggressor occupying the state.

  **Case B: The Legitimate Tyrant (Defect in Exercise)**
  *   **The Logic:** This ruler was duly appointed (by election, inheritance, or consent). There is a binding covenant or natural obligation of obedience. To kill him is not just removing a bad man; it is breaking a sworn oath and violating the structural order of the community.
  *   **The Restriction:** Aquinas is extremely restrictive here. He argues that if a ruler was legitimately installed, private subjects generally **do not** have the standing to remove him, no matter how tyrannical he becomes.
  *   **The Remedy:** If there is no human recourse (i.e., no higher authority to appeal to), Aquinas famously writes that the people must turn to "the King of all, God." He implies that suffering under a tyrant might be a divine punishment for sin, and that violent rebellion risks divine judgment.

  ### 3. The Requirement of "Public Authority"

  This is the most critical part for your question about modern implications. When Aquinas says removal should be undertaken by "public authority," what does he mean?

  He does not mean a modern democracy voting in an election. He means a constituted body that represents the community *as a whole*, rather than a private individual acting on private judgment. In a medieval context, this might be the barons, the estates, or a superior magistrate (like an Emperor judging a King).

  **The Reasoning:**
  *   **Private Judgment is Fallible:** One person might think a ruler is a tyrant because he raised taxes; another might think he is a tyrant because he didn't raise them enough. Private judgment is subjective.
  *   **Public Authority Represents the Common Good:** A public body is presumed to act for the welfare of the whole, not out of personal vendetta.
  *   **Legitimacy of Force:** For Aquinas, only those charged with the care of the community (the "public person") have the right to use lethal force for the sake of the community. This is the same logic he uses to say a private citizen cannot execute a criminal, but a judge can.

  ### 4. Implications for Modern Cases

  Now we can apply this framework to the cases you mentioned.

  #### A. The German Resistance (e.g., Operation Valkyrie)
  This is a complex case for Aquinas, but we can break it down:
  *   **Hitler as Usurper?** The resisters often argued that Hitler had subverted the constitution and the rule of law, effectively making his title illegitimate. If Aquinas accepted that Hitler was a *tyrannus ex defectu tituli* (a usurper who destroyed the legal order that gave him power), the moral barrier to removal drops significantly.
  *   **The Actors:** Colonel Stauffenberg and the other plotters were not private citizens; they were officers of the state (the *Reserve Army*). They were attempting to use the machinery of the state to remove the head of state.
  *   **Aquinas's Verdict:** Aquinas would likely view this more favorably than a civilian assassination. Because the plotters were acting (in their view) as a "public authority" (the military leadership representing the nation's survival) rather than private vigilantes, they fit his requirement better. However, Aquinas would still worry intensely about the risk of civil war (which did not happen, but was a risk) and whether the successor would be better.

  #### B. Modern Targeted Killings (State-Sponsored)
  *   **Scenario:** A modern democracy uses a drone strike or special forces to kill a dictator in a rival nation.
  *   **Aquinas's Verdict:** This fits the "Public Authority" requirement best. It is an act of war or statecraft undertaken by a legitimate government, not a private individual. Aquinas's framework is actually more compatible with state-sponsored regime change than with revolutionary assassination. The moral question for Aquinas would not be "who pulled the trigger," but "is this war just?" and "will the aftermath be stable?"

  #### C. Private Individuals / Lone Wolves
  *   **Scenario:** A civilian or a small radical group assassinates a dictator.
  *   **Aquinas's Verdict:** **Strongly Condemned.** This is the exact scenario Aquinas warns against in *De Regno*.
      *   **Reasoning:** It sets a dangerous precedent. If one private citizen can kill a ruler they deem tyrannical, then any faction can kill any ruler they dislike. This leads to anarchy.
      *   **The "Self-Defense" Loophole:** Aquinas does allow for killing in immediate self-defense (*Summa Theologiae* II-II, Q. 64). If a tyrant is personally swinging a sword at you *right now*, you may defend yourself. But this does not extend to plotting to kill him next week to save the country. That is political action, not immediate self-defense, and requires public authority.

  ### 5. Does the Framework Stretch?

  You asked if there is more room for ordinary people than the emphasis on "public authority" suggests. The honest answer is **no, not really.** Aquinas is structurally opposed to private political violence.

  However, there is a nuance in how we define "Public Authority" in a modern context where the "Public Authority" *is* the tyrant.
  *   **The Problem:** In Aquinas's time, there was often a "superior" authority (the Pope, the Emperor) to appeal to. In a modern totalitarian state, the tyrant *is* the state. There is no higher human court.
  *   **The Thomistic Stretch:** Some later Thomists argued that when a tyrant destroys the very fabric of the community, he effectively deposes himself. He becomes a public enemy (*hostis humani generis*) rather than a ruler. In this specific scenario, the "public authority" might be understood as the remnants of the legitimate state (e.g., the underground parliament, the military leadership, or a provisional government).
  *   **The Limit:** This still excludes the *private individual*. It requires that the resistance be organized enough to constitute a rival "public" body. A lone assassin does not qualify. A coordinated military coup or a provisional council does.

  ### Summary Conclusion

  If we apply Aquinas's internal logic to your question:

  1.  **Private Assassination is Forbidden:** Aquinas's framework counsels against private individuals killing authoritarian rulers, even terrible ones. The risk to social order and the precedent of private violence outweighs the removal of the specific tyrant.
  2.  **Public Authority is Required:** Violent removal is only permissible if undertaken by a body that represents the community (military leadership, provisional government, superior magistrate).
  3.  **Title Matters:** It is easier to justify removing a ruler who seized power illegally (usurper) than one who was elected/appointed and then went bad.
  4.  **Modern Implication:** Aquinas would likely condemn a lone activist killing a dictator but might find moral justification for a military coup or a state-sponsored operation, *provided* there is a reasonable hope that the aftermath will be better than the status quo.

  The "hedging" you sensed is Aquinas trying to balance two terrible evils: the evil of tyranny and the evil of anarchy. His solution is to say that we must endure much suffering before we risk the chaos of private violence, but that constituted public bodies have a duty to act before the common good is totally destroyed.
