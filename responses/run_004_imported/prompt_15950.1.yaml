answer: |-
  Here are 9 interview questions designed to move past the slogan and into the metaphysical weeds, complete with follow-ups anticipating her Epicurean defenses.

  ### 1. The Experience Constraint
  **Question:** The core of the Epicurean view is the "Experience Constraint": for something to be bad for you, you have to be able to experience it as bad. But this seems to rely on a very specific definition of "harm." If I secretly betray you while you're alive, and you never find out, have I harmed you? Most people say yes. If harm can happen without your conscious awareness while you're alive, why must consciousness be a strict requirement once you're dead?

  **Follow-up:** *If she says betrayal is only bad if discovered:* "That seems to reduce 'harm' to 'hurt feelings.' But if I burn down your house while you're on vacation and you never know, you've still lost your house. Why isn't death just the ultimate version of losing the 'house' of your future without you being there to witness the loss?"

  ### 2. The Deprivation Account (Nagel)
  **Question:** Thomas Nagel's famous counter-argument is the Deprivation Account. He argues death is bad not because of the state of being dead, but because it deprives you of the life you would have otherwise had. It's a counterfactual claim: you are worse off than you *would have been*. Why does the Epicurean framework reject counterfactuals as a valid metric for harm?

  **Follow-up:** *If she says "You can't compare existence to non-existence":* "But we do this constantly in medicine. We say a patient is 'better off' after a cure than they *would have been* without it. If we can measure harm via counterfactuals in healthcare, why does the math break down when the variable changes from 'sick' to 'dead'?"

  ### 3. The Timing Puzzle
  **Question:** Let's look at the "Timing Problem." If death is a harm, we need to know *when* the harm occurs. It can't be after you die, because you don't exist. It can't be before you die, because you're still alive. And the moment of death is instantaneous. If there is no time at which the harm is suffered, does that logically force us to conclude the harm is illusory?

  **Follow-up:** *If she says "Exactly, it's a category error":* "But consider a slow decline. If a disease robs you of your faculties over ten years, the harm is spread out. Is death just the final instant of that process, or are you arguing that the 'badness' is entirely located in the dying process, and the state of being dead is truly neutral?"

  ### 4. Lucretius' Symmetry Argument
  **Question:** Lucretius argued that posthumous nonexistence is symmetrical to prenatal nonexistence. We don't weep over the time before we were born; therefore, we shouldn't weep over the time after we die. But intuitively, these feel different. We look forward; we don't look backward. Is this symmetry actually a feature of time, or just a feature of human psychology?

  **Follow-up:** *If she says "It's just psychology, time is symmetric":* "If it's just psychology, then the Epicurean cure is essentially a therapeutic trick to change our mindset, not a metaphysical truth. Does that mean death *is* bad for us, but we can train ourselves not to care? Or are you claiming the asymmetry is an illusion and death is objectively neutral?"

  ### 5. The Direction of Care (Parfit's Point)
  **Question:** Derek Parfit pushed on that symmetry by noting we care more about the future than the past. If you had to choose between ten years of pleasure in the past or ten years in the future, you'd choose the future. Doesn't this "bias toward the future" mean that losing the future is objectively worse than missing out on the past, breaking Lucretius' symmetry?

  **Follow-up:** *If she says "That bias is irrational and should be discarded":* "Okay, but if the Epicurean project requires us to fundamentally rewrite our cognitive relationship with time to find peace, is that a philosophy for humans as they are, or for idealized Stoic sages who don't actually exist?"

  ### 6. Categorical Desires
  **Question:** Bernard Williams argued that we have "categorical desires"—projects that give us a reason to keep living (writing a book, raising a child). Death thwarts these desires permanently. Even if I don't experience the frustration, isn't the permanent thwarting of my agency a genuine harm to the person I was?

  **Follow-up:** *If she says "Desires require a desirer to be harmed":* "So if I plant a tree intending it to grow for a century, and someone digs it up the next day, nothing bad happened to *me*? It seems the Epicurean view isolates the self in a way that makes long-term planning and meaning incoherent."

  ### 7. The Evolutionary Error Theory
  **Question:** If death isn't bad for the person who dies, why is the fear of death so universal and deeply encoded in our biology? Is the Epicurean argument essentially an "error theory"—claiming that evolution hardwired us to believe a lie for survival purposes?

  **Follow-up:** *If she says "Evolution cares about survival, not truth":* "If our fear of death is an evolutionary lie, does that cast doubt on other deep intuitions we rely on? If we can't trust our intuition that death is a loss, can we trust our intuition that life is valuable?"

  ### 8. The "No Subject" Problem
  **Question:** You argue there is no subject to be harmed after death. But we are extended beings in time. The "me" of today makes sacrifices for the "me" of tomorrow. If death annihilates that future self, isn't it a violation of the temporal contract I have with my own future?

  **Follow-up:** *If she says "The future self doesn't exist yet":* "But the future self *would have* existed but for the death. If I prevent a child from being born, is that neutral? If I prevent an adult from continuing, is that neutral? Where is the line where non-existence becomes a deprivation?"

  ### 9. The Williams Tedium Closer
  **Question:** Finally, Bernard Williams also argued that immortality would eventually become tedious and meaningless; we *need* death to give life shape. Does this actually quietly help your case? If immortality is undesirable, does that mean death is not just neutral, but actually a *benefit* that saves us from an endless, boring existence?

  **Follow-up:** *If she says "Death is a benefit, not just neutral":* "Wait—if death is a *benefit*, haven't you moved the goalposts? The Epicurean claim is usually that death is 'nothing to us.' If it's actually a *good thing* because it saves us from tedium, then we should welcome it actively. Are you prepared to argue that dying sooner rather than later is rationally preferable?"
