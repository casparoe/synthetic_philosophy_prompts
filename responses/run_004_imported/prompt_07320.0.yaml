answer: |-
  Welcome, everyone. It is a privilege to welcome this new cohort to the panel. Looking around the room, I see a remarkable breadth of expertise—from social psychology and neuroscience to, I know, a significant number of you specializing in judgment and decision-making.

  That mix is intentional, and it brings me to the first item of business. You have all received the protocol packet, and you have all seen the rule that tends to raise eyebrows: *Reviewers must submit their private written scores before any group discussion begins.*

  I know what some of you are thinking. In an era of streamlined workflows, this looks like bureaucratic redundancy. Why not discuss the merits first and score afterward? Why the paperwork before the conversation?

  For those of you outside the JDM field, this might seem like a safeguard against social pressure—a way to prevent loud voices from dominating quiet ones. But that is not the primary reason. We do not assume you are easily swayed, nor do we suggest you are lazy. We assume you are rational, careful, and highly competent. Precisely because you are rational, we need this rule.

  For our colleagues in JDM, you will recognize the shadow cast by Bikhchandani, Hirshleifer, and Welch. For everyone else, let me briefly outline the mechanism they described regarding informational cascades.

  In any group decision, each of you arrives with a "private signal"—your independent assessment of a grant's quality based on your expertise. When we discuss *before* scoring, we convert those private signals into public actions sequentially. The first few speakers reveal their judgments. The subsequent reviewers then face a Bayesian update problem. They must weigh their own private signal against the public information revealed by the early speakers.

  The theory shows that even for perfectly rational agents, there is a tipping point where the weight of the public actions outweighs the private signal. At that moment, it becomes rational for me to ignore my own expertise and follow the emerging consensus, even if my private information contradicts it. I am not conforming to be liked; I am conforming because I rationally infer that the earlier speakers must know something I do not.

  Once that happens, an informational cascade begins. My private signal is never revealed to the group because my action mirrors the crowd. The next person sees even more public agreement and follows suit. The group converges rapidly on a judgment that may be objectively wrong, simply because the early signals were noisy, yet the later, corrective private information was suppressed by the structure of the interaction.

  In short, if we talk first, we risk losing the very data we convened to aggregate. We risk funding a project not because it is the best, but because it triggered a cascade early in the conversation.

  The requirement to score privately *before* discussion breaks this sequence. It forces all private signals to be recorded simultaneously, ensuring that every piece of independent information is locked in before any public actions can trigger a cascade. It preserves the diversity of our judgment so that when we *do* discuss, we are debating our actual differences, not navigating a consensus that formed artificially.

  This rule is not about managing personalities; it is about managing information flow. It ensures that our collective decision reflects the sum of our expertise, not just the order in which we speak.

  So, when you sit down to review your first packet, please honor the protocol. Submit your scores before you speak. It is the simplest way to ensure that our foundation funds the best science, rather than the most persuasive early argument.

  Thank you, and welcome to the work.
