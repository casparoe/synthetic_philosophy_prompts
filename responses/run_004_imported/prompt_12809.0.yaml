answer: |-
  This is one of the most frustrating conceptual hurdles in social choice theory, so first off: you are not missing something obvious. The jump from the "doctrinal paradox" (the baby case) to the List-Pettit Impossibility Theorem is steep because it requires shifting from thinking about *one specific voting profile* to thinking about the *structure of the voting rule itself* across all possible worlds.

  Here is the gut-level intuition for why **Systematicity** is the axe that chops off the possibility of a democratic, consistent collective mind, and how Premise/Conclusion procedures dodge the blade.

  ### 1. Deconstructing "Systematicity"
  You mentioned Systematicity feels like a black box. It helps to crack it open. Systematicity is actually two distinct requirements bundled together:

  1.  **Independence (Proposition-wise):** The collective judgment on proposition $A$ depends *only* on the individual judgments on $A$. You cannot look at how people voted on $B$ or $C$ to decide $A$.
  2.  **Neutrality (Proposition-blindness):** The aggregation function used for $A$ must be the *same function* used for $B$ and $C$. If you use a majority rule for "Valid Contract," you must use a majority rule for "Breach" and for "Liable." You can't say, "Premises need a majority, but conclusions need a 2/3 supermajority."

  **The Intuition:** Systematicity demands that the aggregation rule be **flat** and **modular**. It treats the agenda like a bag of marbles. It doesn't care that some marbles are logically connected to others; it just applies the same stamping machine to every marble independently.

  ### 2. The Clash: Flat Rules vs. Hierarchical Logic
  Here is the "click" moment.

  **The Logical Structure is Hierarchical:**
  In your Kornhauser/Sager example, the logic is asymmetric.
  *   $p$ (Contract) and $q$ (Breach) are the *inputs*.
  *   $r$ (Liable) is the *output* ($p \land q \to r$).
  *   Logically, $r$ is "harder" to be true than $p$ or $q$ individually. To be liable, you need *both* premises.

  **The Systematicity Rule is Flat:**
  Systematicity forbids the voting rule from acknowledging this hierarchy. It forces you to treat $p$, $q$, and $r$ as peers. It says, "Whatever threshold of votes makes $p$ true must be the same threshold that makes $r$ true."

  **The Conflict:**
  Imagine you use Majority Rule (which satisfies Systematicity).
  *   It is logically possible to have a majority for $p$.
  *   It is logically possible to have a majority for $q$.
  *   But the *intersection* of those two majorities (the people who voted Yes on both) might be a **minority**.

  If you follow the logic (Premise-Based), $r$ is True (because $p$ and $q$ are collectively True).
  If you follow Systematicity (Vote on $r$ directly using the same Majority Rule), $r$ is False (because the direct majority on $r$ is No).

  **Why does this force a Dictator?**
  To avoid this contradiction *while keeping Systematicity*, you need to ensure that the "Winning Coalition" for $p$ and the "Winning Coalition" for $q$ always overlap enough to form a "Winning Coalition" for $r$.

  But remember: Systematicity requires the **same** winning coalition structure for every proposition.
  *   If 51% can pass $p$, 51% must be able to pass $r$.
  *   But logic requires that passing $r$ is strictly *harder* than passing $p$ (since $r$ requires $p$ AND $q$).

  You cannot satisfy "Same Threshold" (Systematicity) and "Logical Constraint" (Consistency) simultaneously across all possible voting profiles (Universal Domain), **unless** the "Winning Coalition" is just **one person**.

  Why? Because a single individual is internally consistent. If *Alice* decides everything (Dictatorship):
  *   Alice votes Yes on $p$.
  *   Alice votes Yes on $q$.
  *   Alice *must* vote Yes on $r$ (because she is rational).
  *   The collective outcome matches Alice's outcome.
  *   Systematicity is satisfied (Alice's vote is the rule for all propositions).
  *   Consistency is satisfied (Alice is consistent).

  A dictatorship works because it collapses the "collective" into a single mind, removing the possibility of the "majority fragmentation" that causes the paradox. Any rule that tries to aggregate *multiple* minds while treating all propositions with the exact same voting threshold will eventually hit a profile where the majorities fragment and logic breaks.

  ### 3. Premise-Based vs. Conclusion-Based: Breaking the Axiom
  This is the key for your term paper. Since the theorem says you can't have (Universal Domain + Consistency + Systematicity), real-world procedures survive by **sacrificing Systematicity**. They admit that "One Size Does Not Fit All."

  **Premise-Based Procedure (PBP)**
  *   **How it works:** We vote on $p$ and $q$. We derive $r$ logically.
  *   **Which axiom does it break?** It breaks **Independence** (the first half of Systematicity).
  *   **Why?** The collective judgment on $r$ is *not* determined by the individual votes on $r$. It is determined by the votes on $p$ and $q$. The rule "looks outside" proposition $r$ to decide $r$.
  *   **The Trade-off:** We save Consistency and Anonymity, but we admit that conclusions are structurally different from premises. We treat them differently.

  **Conclusion-Based Procedure (CBP)**
  *   **How it works:** We vote on $r$ (Liability). We ignore $p$ and $q$ (or treat them as non-binding reasoning).
  *   **Which axiom does it break?** It breaks **Completeness** (on the agenda) or **Independence**.
  *   **Why?** Usually, CBP implies we don't make a collective judgment on the premises at all. If the agenda requires a judgment on $p$, $q$, and $r$, CBP fails to deliver on $p$ and $q$. If we force it to, we usually end up violating Independence again (judgment on $p$ might be adjusted to match $r$).
  *   **The Trade-off:** We prioritize the final decision (the disposition) over the logical coherence of the reasoning.

  ### 4. Summary for Your Paper
  When you write this up, you can frame it like this:

  1.  **The Problem:** The List-Pettit theorem isn't just saying "voting is hard." It is saying that **logical consequence is incompatible with procedural equality.**
  2.  **The Culprit:** **Systematicity** is the assumption that the *procedure* for deciding truth should be blind to the *logical role* a proposition plays. It demands we treat premises and conclusions as procedurally identical.
  3.  **The Result:** Because premises and conclusions are *not* logically identical (conclusions depend on premises), forcing procedural identity onto them creates contradictions. The only way to force them to fit is to let one person decide everything (Dictatorship), ensuring internal consistency by fiat.
  4.  **The Solution:** Legal doctrines (like PBP) are rational not because they solve the math, but because they **reject Systematicity.** They explicitly acknowledge that premises deserve a vote, while conclusions deserve a derivation. They break the "neutrality" of the voting rule to save the "rationality" of the court.

  **One final tip for the seminar:** If you want to sound like you really get it, mention that Systematicity essentially forbids the group from having a "division of cognitive labor." It forces every proposition to stand or fall on its own popular support, ignoring the structural support provided by other propositions. PBP restores that structural support by letting premises carry the weight for the conclusion.

  Good luck with the paper! This is a great topic.
