      *   Disagree sharply? Yes.
      *   Confront strongest examples? Yes (Monetary policy vs. Reward Hacking).
      *   Address Manheim/Garrabrant? Yes.
      *   Address the "regime change" vs "fixed objective" distinction? Yes.

