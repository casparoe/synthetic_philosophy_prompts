answer: |-
  **Setting:** *Paris, 1758. The study of Denis Diderot. It is late evening. Candles burn low. Jean-Jacques Rousseau stands by the window, looking out at the dark street. Diderot sits at his desk, surrounded by papers and proofs.*

  **Rousseau:** You look at me as if I were asking you to burn your library, Denis. I am only asking you to acknowledge that the building across the way is a temple to idleness.

  **Diderot:** I look at you, Jean-Jacques, as one looks at a physician who prescribes fasting to a man who needs nourishment. You call it idleness; I call it the school of morals. You propose to close the theater. I propose to fix it.

  **Rousseau:** You cannot fix a rot by painting the wood. My objection is not to the plays you write—though your *Bastard* has its merits—but to the very arrangement of the room. Consider the geometry of it. On one side, a few individuals illuminated, pretending to be others. In the dark, hundreds of citizens, sitting in silence, watching. What is taught here? Passivity. We are taught that life is something to be watched, not lived.

  **Diderot:** Passivity? When a mother sees her own struggle mirrored in a bourgeois drama, when she weeps for a daughter on stage she could not save in life, you call that passivity? That is an awakening. The theater softens the heart. It makes us susceptible to pity. And is pity not the root of virtue?

  **Rousseau:** Pity in the theater is a dangerous counterfeit. It is a pity that costs us nothing. I weep for the tragic hero because I am not required to lift a finger to help him. In fact, the more I weep, the more satisfied I am with my own soul. I have paid my ticket; I have shed my tear; my duty is done. Then I step out into the street and pass a beggar without a glance. Why? Because I have already discharged my charity in the dark. The theater does not train virtue; it inoculates us against it.

  **Diderot:** That is a cynical reading of the human heart. You assume the tear is an end point. I say it is a beginning. Habit is everything, Jean-Jacques. If a man sits for two hours every week and trains his sensibility to recoil at injustice and mourn suffering, does that not make him less likely to commit injustice? You speak of the "General Will," of the civic bond. How do you forge that bond if not through shared sentiment? The theater is the only place where the rich and the poor sit in the same dark and feel the same grief.

  **Rousseau:** They do not feel the *same* grief. That is the illusion. The rich man cries for the king who loses his crown; the poor man cries for the lover who loses his mistress. They are alone together, Denis. They do not speak. They do not act. In Geneva, we have festivals. We plant a stake in the ground, we gather in the open air, and *we* are the spectacle. There is no stage. There are no actors. We dance, we sing, we look upon one another. In that moment, there is no gap between the observer and the observed. We are the authors of our own joy. That is civic virtue. Your theater creates a chasm between the active genius on stage and the passive dullard in the box.

  **Diderot:** And what of the genius? You dismiss the actor as a mere charlatan. But consider the craft. To stand before a thousand souls and channel a passion without being consumed by it? That is not insincerity, Jean-Jacques. That is mastery.

  **Rousseau:** It is the art of deception! To make a profession of pretending, to sell one's person for public appraisal... it habituates a man to value appearance over being. If the actor is the model, then the citizen learns that to be virtuous is merely to *appear* virtuous.

  **Diderot:** No, no! You misunderstand the mechanism. Think of the actor. If he truly feels the rage, the grief, the love he portrays, he will stammer, he will weep uncontrollably, he will break the illusion. To move the audience, he must remain cool. He must possess a judgment that is untouched by the fever he mimics. This "Paradox," as I call it, is the highest discipline. The actor shows us that we can master our passions. He models self-control. Is that not what you want for your citizens? A man who feels deeply but acts according to reason?

  **Rousseau:** You argue that the actor's self-control teaches the spectator self-control. But the spectator is not acting. He is surrendering. He is letting the actor feel *for* him. You say the actor remains cool; I say the spectator becomes lukewarm. He expends his moral energy on a fiction. You speak of disciplining passion, but the theater exists to inflame it! If the content is upright, as you claim, the form contradicts it. The form says: "Sit still. Let us do this for you."

  **Diderot:** And your festival says: "Run about. Sing loudly. Be children." It is charming, Jean-Jacques, but it is not education. The world is complex. We need to see moral dilemmas played out with nuance. We need to see the consequences of vice and the rewards of virtue in a concentrated form that life rarely offers. The stage is a laboratory of the human condition. You want to return us to the transparency of the village square. But we live in Paris. We live in a society of strangers. How do we learn to sympathize with strangers if not through art?

  **Rousseau:** We learn by doing, not by watching. If you want strangers to know one another, do not put a wall between them. Remove the wall. Remove the seats. Let them see each other's faces in the daylight. You say the theater creates sympathy. I say it creates a substitute for it. It is a narcotic. It allows a corrupt society to feel virtuous without changing its laws. You want to reform the drama? I tell you, even if Molière himself returned and wrote only sermons, the effect would be the same. The moment you pay a man to pretend, and a man to watch, you have severed the civic bond.

  **Diderot:** You are an absolutist of authenticity. You believe that unless an emotion is spontaneous and direct, it is false. But civilization *is* artifice. Law is artifice. Language is artifice. We use these tools to refine our nature. The theater is a tool. Yes, it can be abused. Yes, there are frivolous comedies that mock morality. But a serious drama, a *drame bourgeois*, which depicts the duties of fathers, the sacrifices of friends... this reinforces the social contract. It reminds the father of his duty more effectively than a village dance ever could.

  **Rousseau:** It reminds him of his duty so that he may nod in the dark and neglect it in the light. You trust too much in the power of representation. You think a picture of bread can feed a man. I tell you, the hunger remains. The citizen who watches a play on justice goes home to an unjust world and sleeps soundly, because he has seen justice done on stage. He has had his catharsis. He is purged of the need to act.

  **Diderot:** And the citizen who never sees justice represented, who never has his imagination stretched to encompass the suffering of others... he becomes a brute. You fear the theater makes us passive. I fear your festivals make us simple. You want a city of transparent souls, all singing the same song. I want a city of thinking minds, challenged by complexity. The actor's cool head, the poet's structured verse—these are not barriers to truth. They are the lenses through which we focus the scattered light of human experience.

  **Rousseau:** Then we are at an impasse. You believe the lens clarifies. I believe it distorts. You believe the actor's discipline is a lesson in self-mastery. I see it as a lesson in alienation.

  **Diderot:** Perhaps. But tell me, Jean-Jacques. When you wrote *Julie*, did you not hope your readers would weep? Did you not hope that their tears would make them better?

  **Rousseau:** *Julie* is a book. It is read in solitude, or shared between friends. It invites reflection. It does not demand a ticket. It does not gather us in the dark to be sold a performance. I write to awaken the conscience. The theater anesthetizes it.

  **Diderot:** Then I shall continue to write for the stage, and you shall continue to write for the conscience. And perhaps, between the two of us, the citizen will both feel and act.

  **Rousseau:** *(Turning back to the window)* I fear, Denis, that if he feels on your stage, he will forget to act in my city.

  **Diderot:** *(Picking up his quill)* And if he acts in your city without feeling, he will be a tyrant. Good night, Jean-Jacques.

  **Rousseau:** Good night, Denis.

  *(Rousseau exits into the night. Diderot dips his pen in the ink, hesitates, then begins to write.)*
