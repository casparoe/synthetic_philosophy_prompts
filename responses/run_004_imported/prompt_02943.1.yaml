      *   **The Implication (Bounded Utility):** To truly kill the paradox, utility must be *bounded* (have a ceiling), not just diminishing. But bounded utility has its own counter-intuitive results (e.g., preferring a guaranteed tiny amount over a tiny chance at eternity).
