          *   **Nuance:** There are objections to the Aggregation Theorem specifically (e.g., Diamond's critique of ex-ante vs. ex-post equity, or Sen's critique that vNM utility is not ethically meaningful for interpersonal comparison). Rawls is more an objection to the *justification* of utilitarianism via the veil (Impartial Observer), which the student conflated with Aggregation. I need to penalize the conflation but acknowledge the Rawls point is the standard "Harsanyi vs. Rawls" debate point, even if applied slightly loosely to the specific theorem named.

