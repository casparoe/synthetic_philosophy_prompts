answer: |-
  **The Architecture of Collective Reason: Resolving the Discursive Dilemma**

  In the landscape of social choice theory, few problems are as unsettling to the concept of institutional integrity as the discursive dilemma. Known in legal theory as the doctrinal paradox, it was brought to light by Lewis Kornhauser and Lawrence Sager to illustrate a fracture in the logic of multi-member courts. The setup is deceptively simple. Consider a three-judge panel adjudicating a breach-of-contract case. Liability ($R$) is determined by two necessary premises: the existence of a valid contract ($P$) and the occurrence of a breach ($Q$). Logically, $R$ if and only if $P$ and $Q$.

  Now, imagine the votes are distributed as follows: Judge 1 finds both $P$ and $Q$ true (Vote: Liable). Judge 2 finds $P$ true but $Q$ false (Vote: Not Liable). Judge 3 finds $P$ false but $Q$ true (Vote: Not Liable). If the court votes on the conclusion directly (Conclusion-Based Procedure, or CBP), the majority votes "Not Liable." However, if the court votes on the premises separately (Premise-Based Procedure, or PBP), the majority finds $P$ true and $Q$ true, mechanically deriving a verdict of "Liable." The same three rational individuals, applying the same law to the same facts, produce contradictory collective outcomes depending solely on the voting procedure.

  This is not merely a logical curiosity; it is a crisis of legitimacy. It forces a choice between two competing visions of what a court is. Is it a democratic aggregation of individual wills, or is it a singular corporate agent capable of reasoning? To answer which procedure a rational collective decision-maker should prefer, we must weigh the virtues of democratic responsiveness against the necessities of collective rationality.

  **The Case for the Conclusion-Based Procedure**

  The strongest argument for the Conclusion-Based Procedure (CBP) rests on the sovereignty of the individual judge and the holistic nature of legal judgment. In this view, the primary function of a judicial panel is to resolve disputes, not to issue advisory opinions on legal predicates. CBP respects the right of each judge to deliver a verdict based on their own "all-things-considered" judgment.

  Legal reasoning is rarely as atomic as the logic table suggests. A judge might concede that a contract technically existed ($P$) and that technical breach occurred ($Q$), yet still feel that liability is unjust due to equitable considerations, minor damages, or ambiguous conduct that doesn't quite meet the spirit of the law. In the scenario above, Judge 2 and Judge 3 might both believe that while one prong is met, the case as a whole does not warrant liability. CBP honors this judicial discretion. It allows judges to weigh the premises differently in their own minds without being forced to commit to a binary finding on $P$ or $Q$ that might misrepresent their nuanced view.

  Furthermore, CBP is more democratically responsive to the composition of the court. If the mandate of the judges is to decide the case before them, the outcome that reflects the majority view on the *disposition* is the one that best represents the will of the tribunal. PBP risks imposing a verdict that a majority of the judges explicitly oppose. In our scenario, two out of three judges believe the defendant should not be liable. To rule them "Liable" via PBP is to override the explicit judgment of the majority on the ultimate question. For a body composed of independent appointees, CBP preserves individual accountability; each judge owns their vote on the verdict, rather than hiding behind a mechanical derivation from premises they might have voted differently on if isolated.

  **The Case for the Premise-Based Procedure**

  The argument for the Premise-Based Procedure (PBP) is an argument for the court as a coherent, rational agent. If a court is to function as more than a pile of individuals—if it is to speak with one voice—it must satisfy the constraints of logic that bind any rational mind.

  The primary virtue of PBP is collective consistency. A rational agent cannot believe $P$, believe $Q$, believe that $P$ and $Q$ imply $R$, and yet conclude Not-$R$. CBP allows the collective to hold inconsistent beliefs over time. If this court sets a precedent that $P$ and $Q$ were established, but the defendant is not liable, it creates confusion for lower courts and future litigants. PBP forces the court to align its reasons with its results. It ensures that the *ratio decidendi* (the reason for the decision) matches the outcome.

  Moreover, PBP is essential for the production of public reason. Courts do not just settle disputes; they clarify the law. By voting on premises, the court publicly commits to specific legal standards. This constrains judicial arbitrariness. Under CBP, a judge can vote for a verdict based on hidden or contradictory reasoning. Under PBP, judges must agree on the specific legal building blocks. This fosters integrity. It prevents a situation where a coalition forms to achieve a desired outcome without agreeing on *why* that outcome is justified. As political philosopher Philip Pettit argues, if a group wants to be a "group agent," it must prioritize the rationality of the group over the unaggregated preferences of the members. PBP is the institutional mechanism that allows the group to maintain rationality across time and issues, ensuring that the court's body of law is a cohesive system rather than a patchwork of contradictory outcomes.

  **The Verdict**

  Faced with the choice between respecting the immediate outcome preferences of the majority (CBP) and ensuring the logical integrity of the institution (PBP), a rational collective decision-maker aiming to act as a coherent agent must choose the **Premise-Based Procedure.**

  The rejection of CBP here is not a dismissal of judicial discretion, but a recognition of the specific telos of a court. A court is not a legislature. A legislature is designed to aggregate competing interests and wills; compromise and "logrolling" are features, not bugs. A court, however, is an institution of public reason. Its authority derives from its claim to correctness and consistency, not merely from the count of heads.

  If a court adopts CBP, it surrenders its status as a unitary agent. It becomes a black box where inputs (arguments) go in and outputs (verdicts) come out, with no guarantee that the internal logic holds. This creates a "discursive instability" that erodes the rule of law. If a court rules "Not Liable" while simultaneously establishing via majority vote that the contract was valid and breached, it issues a performative contradiction. It tells the public that the law was broken, but there is no remedy. This damages the guidance function of the law.

  The prompt asks what a committee should use if it wants to act like "one coherent agent." This constraint is decisive. Individual rationality does not guarantee collective rationality; in fact, as the discursive dilemma proves, aggregating individually rational judgments via CBP can produce collective irrationality. To achieve collective rationality, the group must discipline its decision-making process. It must prioritize the consistency of its belief set over the direct aggregation of its bottom-line preferences.

  Therefore, the Premise-Based Procedure is the only choice compatible with the goal of coherent group agency. It requires judges to sacrifice their preferred outcome in service of the court's logical integrity. Judge 2 and Judge 3 must accept a "Liable" verdict not because they personally believe it is the right result, but because they accept the authority of the collective reasoning process they constitute. This is the burden of institutional office. By binding themselves to the logic of the premises, the court preserves its ability to speak as one mind, ensuring that its jurisprudence remains a stable, intelligible, and rational system rather than a mere tally of individual whims. To choose otherwise is to admit that the court is not a judge, but a voting bloc.
