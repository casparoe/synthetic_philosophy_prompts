answer: |-
  Good evening, everyone. For those who don't know me, I'm the Best Man. Which, given the groom, basically means I'm the guy responsible for ensuring the variance doesn't swallow us whole tonight.

  [Brief pause for laughter]

  We all know Dan is a professional poker player. But what you might not know is that Dan doesn't just play poker. Dan *is* poker. He has turned the Kelly Criterion into a personality trait.

  For the non-players here—hello, Grandma—the Kelly Criterion is a formula that tells you how much to bet so you grow your money without ever going broke. For Dan, this means he never goes "all-in." Not at the table, and not in life. 

  I once watched him spend forty-five minutes deciding whether to order the spicy wings because the "risk of ruin" on his digestive system outweighed the flavor utility. He sizes every decision based on his bankroll. He treats crossing the street like a satellite tournament qualifier.

  Then there's Alex.

  Alex is the opposite. Alex operates on pure Expected Value. If the EV is positive, she takes the bet. Full stop. She doesn't care about bankroll management; she cares about upside. If Dan is the guy folding pocket Aces because the pot odds aren't right, Alex is the one shoving her entire stack in with a pair of fours because she has a "good feeling."

  Naturally, this creates friction. 

  Dan told me they were arguing about where to live last month. Alex wanted the city; Dan wanted the suburbs. It was a classic clash: Alex saw the upside, Dan saw the risk of ruin. So, how did they resolve it? 

  Dan insisted they settle it using the "Nash Bargaining Solution" based on the geometric mean of their utility functions.

  [Look at Dan]
  Dan, nobody knows what that means. Not even you. You just pulled it up on WolframAlpha to win the argument.

  [Turn back to audience]
  But here's the thing. As maddening as it is, it works. Because Dan's caution keeps them from going bust, and Alex's boldness keeps them from folding on life. He manages the risk; she captures the reward.

  But there is a fundamental shift happening today. Up until now, Dan has played life as a solitary grind against the house. He's been obsessed with survival, with hedging, with managing the variance of one.

  But marriage changes the math. It changes the table dynamics. You can't Kelly Criterion your way through a partnership, and you can't Nash Bargain your way out of doing the dishes.

  So, Dan, my advice is this: Put away the formulas. Stop calculating the pot odds of love. Because marriage is the moment his one-guy-against-variance philosophy turns into a two-player game. And for the first time in your life, you're not playing against the deck. You're playing *with* your hand.

  To Dan and Alex. May your EV always be positive, and may you never go broke.

  [Raise glass]
