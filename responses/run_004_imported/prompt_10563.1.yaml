answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Ray's nephew.

  If you knew my uncle, you probably knew him behind the counter of the hardware store. You know the sound of the bell on the door. You know the smell of galvanized steel and sawdust. And if you were looking for a specific washer, or advice on how to fix a leaky faucet, you knew that asking Ray was a bit of a gamble.

  If he thought you were trying to cut a corner, or if he thought you were asking a question you could have answered yourself with five minutes of attention, he could be sharp. He could be loud. There were days the bell on the door rang, and you hoped he was in the back room.

  It would be easy, today, to smooth those edges over. It would be kind, in a way, to say, "Well, he was from a different time," or "He had a hard life," or "That was just his way." I know some of us are tempted to offer those explanations. They feel gentle. They feel like forgiveness.

  But Ray would have hated that. In fact, he told us, specifically, that if we stood here and made excuses for him, he'd find a way to be annoyed about it from wherever he ended up.

  Ray wasn't a bookish man, except for one thing. When he was fifty, he took a philosophy class and latched onto an idea that he held onto for the rest of his life. He didn't use the big academic words, but the idea was this: There are two ways to treat a person.

  One way is to treat them like a problem to be managed. You explain away their behavior. You say, "Oh, don't mind him, he's tired." You talk around them instead of to them. It's safe. It's polite. But Ray believed it was actually a form of contempt. It means you've stopped expecting anything real from them.

  The other way—the hard way—is to treat someone like a full, responsible human being. You get mad at them when they hurt you, because you believe they matter enough to have done better. You forgive them, really forgive them, only after you've acknowledged the wrong. You look them in the eye.

  Ray chose the hard way. He believed that being argued with, being held accountable, and being spoken to directly was the highest compliment you could pay someone. It meant you were still in relationship with them.

  I think about the time he and my grandfather stopped speaking for two years. It was a real falling-out. For a long time, the family tried to smooth it over. "Let it go," they said. "It's not worth the trouble." Ray wouldn't let it go. He wouldn't accept a polite distance. He wanted a reconciliation that meant something. When they finally made up, it wasn't because they forgot what happened. It was because they settled it. Ray was prouder of that fight, and that resolution, than almost anything else in his life.

  He carried that into the store, too. He didn't just sell you a hammer; he expected you to use it right. If you came in frustrated, he didn't coddle you. He engaged with you. He treated your project as if it mattered, which meant he treated *you* as if you mattered.

  And he carried it to the very end. When his memory started to slip, when his temper got shorter, the thing that upset him most wasn't the confusion. It was when people started talking *about* him in the room. "He's not himself," they'd whisper. Ray would catch it. He'd look at my mother and say, "I'm right here. Talk to me."

  He was right. It is tempting, now that he's gone, to shift into that softer gear. To manage his memory. To handle him. But I think the most loving thing we can do for Ray today is to refuse to manage him.

  We aren't here to excuse Ray. We're here to reckon with him.

  Yes, he was stubborn. Yes, he could be difficult. But he was also fiercely loyal, deeply generous, and he loved us enough to demand that we be real with him. He didn't want our pity. He wanted our honesty.

  So, I'm not going to tell you that he was perfect. I'm not going to tell you that his temper didn't sting sometimes. I'm going to tell you that when Ray got angry, it was because he cared. When he forgave, it was because he meant it. And when he loved you, he didn't treat you like a customer, or a case, or a project. He treated you like a person.

  Ray taught us that the cost of real connection is the risk of conflict. He taught us that explaining someone away is the opposite of love. And he taught us that even at the end, even when it's hard, you look the person in the eye and you speak the truth.

  So, Uncle Ray: We aren't going to make allowances for you today. We aren't going to say you were anything other than who you were. You were a good man. You were a hard man. You were our man. And we are going to miss you, exactly as you are.

  Rest well. We'll take it from here.
