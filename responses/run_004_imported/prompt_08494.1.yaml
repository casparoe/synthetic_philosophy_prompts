  2.  **Deconstruct Question 1: The Tautology Objection:**
      *   *Core Argument:* "Survival of the fittest" sounds like "Those who survive are those who survive."
      *   *Logical Form:* If "fitness" is *defined* solely by reproductive success (survival), then the statement "The fittest survive" is analytically true (true by definition) rather than synthetically true (true by observation).
      *   *Popper's Concern:* If it's a tautology, it's not falsifiable. If it's not falsifiable, it's not empirical science (in Popper's demarcation criterion). It becomes a metaphysical framework.
      *   *Nuance:* Popper wasn't saying evolution is *false*, just that the *mechanism* as stated lacked empirical content without further specification.

  3.  **Deconstruct Question 2: The Difficulty of Independent Fitness:**
      *   *The Problem:* To avoid tautology, fitness must be defined *before* selection happens (a priori), based on traits, not just the outcome.
      *   *Why it's hard:*
          *   Context dependence: A trait fit in Environment A might be unfit in Environment B.
          *   Complexity: Fitness is often a result of many interacting traits (epistasis, pleiotropy).
          *   Chance: Drift plays a role. A fit individual might die by bad luck.
          *   Measurement: We often infer fitness *from* survival, creating the circularity.
      *   *Physicist Analogy:* It's like defining "force" solely by "acceleration" without $F=ma$ allowing independent measurement of mass and acceleration. (Though this analogy has limits).

  4.  **Deconstruct Question 3: Popper's Recantation:**
