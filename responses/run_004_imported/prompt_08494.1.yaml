      *   *Key Realization:* Natural selection is testable if we specify the *traits* and the *environmental pressures*. We can predict which traits *should* be selected. If they aren't, the theory is challenged.
      *   *Quote:* He admitted he had "changed his mind about the testability and logical status of the theory of natural selection."

  5.  **Deconstruct Question 4: Biologists' Responses:**
