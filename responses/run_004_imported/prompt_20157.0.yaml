          *   *Ella's Defense:* It has no *proper* function yet because selection hasn't acted on it over generations. It's just a lucky accident.
          *   *Carl's Counter:* That seems arbitrary. If it saves the life, it functions. Why wait for history?
      *   **Synthesis/Conclusion:** Acknowledge that both capture something important. Maybe a pluralistic view is needed.

  4.  **Refining the Arguments (Self-Correction during drafting):**
