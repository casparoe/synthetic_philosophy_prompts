          *   *Carl's Attack:* If it doesn't pump well, it lacks the causal role. So, does it lose its function? That seems wrong.
          *   *Ella's Defense:* It *has* a function (to pump) because that's why hearts exist, even if this specific one fails. Function is normative.
          *   *Carl's Counter:* But if I'm studying *this* patient, knowing what it *should* do doesn't help me understand what it *is* doing.
      *   **Case 2: The Vestigial Tailbone (Coccyx):**
