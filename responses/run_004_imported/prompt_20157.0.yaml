          *   *Ella's Attack:* It has an etiological function (balance in ancestors), but no current causal role. So is it functionless now?
          *   *Carl's Defense:* If it anchors muscles now, it has a causal role. If it does nothing, it has no function. Calling it "vestigial" just means "old function lost."
          *   *Ella's Counter:* But we distinguish between "broken" and "vestigial." Vestigial implies a history of function without current utility.
      *   **Case 3: The Freak Organ (Chance Assembly):**
