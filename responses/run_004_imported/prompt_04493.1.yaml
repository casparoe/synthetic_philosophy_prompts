answer: |-
  This is a sophisticated and philosophically rich line of inquiry. You have clearly done your homework on both the *Methods of Ethics* and the biographical context. You are asking three specific questions: Is the reading fair? Is there a defense against it? Is it original enough?

  Here is an assessment of your proposed thesis from the perspective of Sidgwick scholarship.

  ### 1. Is this a fair reading of Sidgwick?

  **Yes, but with a crucial caveat regarding domains.**

  You are correct that there is a palpable tension between Sidgwick the rigorous epistemologist and Sidgwick the psychical researcher. Scholars often refer to this as the conflict between Sidgwick's "scientific conscience" and his "religious needs."

  However, to make this a *fair* reading, you must be careful not to conflate two different types of justification in Sidgwick's system:
  *   **In *The Methods of Ethics* (Book III):** The criteria for "self-evident" intuitions (clarity, consistency, consensus of experts) apply to **moral axioms**. Sidgwick is arguing that for a moral principle to be foundational, it must be agreed upon by competent philosophers.
  *   **In Psychical Research:** Sidgwick was not claiming telepathy or the afterlife were *self-evident moral truths*. He was treating them as **empirical hypotheses**.

  **The Fairness Check:** Your argument holds water if you frame it not as a logical contradiction within the *Methods*, but as a tension in Sidgwick's broader **philosophical temperament**. Sidgwick viewed philosophy as a science. He demanded rigorous evidence for ethics. The critique is: *Why did the man who demanded such high evidentiary bars for ethical intuitions lower those bars (or ignore the "disagreement" criterion) when investigating mediums?*

  If you argue that Sidgwick's commitment to the SPR violated the *spirit* of his own epistemological caution—even if not the strict letter of Book III—you are on solid ground.

  ### 2. Is there an obvious defense or dissolution of the tension?

  A strong defender of Sidgwick (or Sidgwick himself, in his letters) would offer three main counter-arguments. You should anticipate these in your paper:

  **A. The Distinction Between Belief and Hope**
  Sidgwick was careful never to claim he *knew* an afterlife existed. He maintained an agnostic stance. In a famous letter to his student and successor, E.E. Constance Jones, he admitted that he could not find theoretical proof for the moral government of the universe, but he said he found it necessary to *hope* for it to maintain his moral sanity.
  *   *The Defense:* He wasn't violating epistemic norms by *believing* against evidence; he was sustaining a *hope* against uncertainty. The SPR was an attempt to turn that hope into knowledge, but until it did, he claimed only that the evidence was "not negligible," not that it was conclusive.

  **B. The Definition of "Competent Inquirers"**
  Recall the criterion you cited: disagreement among *careful, competent* people lowers confidence.
  *   *The Defense:* Sidgwick often argued that the skepticism of the scientific community was not based on a careful examination of the evidence, but on a priori materialism. He might argue that the "competent inquirers" who had *actually* sat with the mediums (like himself, Myers, and Gurney) were in agreement that *something* anomalous was happening, even if they disagreed on the explanation. Therefore, the "consensus" criterion wasn't triggered because the skeptics hadn't done the homework.

  **C. The Stakes of the "Dualism"**
  This is the strongest defense. Sidgwick believed that if Egoism and Utilitarianism cannot be reconciled (via an afterlife where virtue is rewarded), then morality is fundamentally irrational.
  *   *The Defense:* When the stakes are the rationality of morality itself, one is justified in pursuing a line of inquiry much longer than usual. The "tension" you see is actually a feature, not a bug: it shows how desperate the human rational condition is. He kept searching not because he was being irrational, but because the cost of giving up was the collapse of the "Cosmos of Duty."

  ### 3. Is this original enough for a term paper?

  **Here is the honest truth:** The connection between Sidgwick's ethics and his psychical research is one of the most well-trodden paths in Sidgwick scholarship.

  *   **The Standard View:** It is standard curriculum that Sidgwick joined the SPR to solve the "Dualism of Practical Reason."
  *   **The Biography:** Bart Schultz's definitive biography, *Henry Sidgwick: Eye of the Universe* (2004), deals with this extensively. He discusses Sidgwick's epistemological struggles and his "secret" search for proof.
  *   **The Risk:** If you simply argue "Sidgwick was inconsistent because he wanted to believe in God," a knowledgeable grader will feel you are repeating Schultz or standard lecture notes.

  **How to Make It Original:**
  Your specific focus on the **Book III epistemological criteria (consensus of experts)** is the winning angle. Most discussions focus on the *ethical* motivation (Dualism). Fewer undergraduate papers drill down into the *epistemological mechanics* of how he justified belief in telepathy vs. how he justified belief in utilitarianism.

  To make this paper stand out:
  1.  **Don't claim no one has noticed the tension.** Acknowledge Schultz or the standard biographical view in your introduction.
  2.  **Focus on the Mechanism:** Your thesis shouldn't just be "he was inconsistent." It should be: "While scholars note Sidgwick's motivation for psychical research, less attention has been paid to how his SPR methodology seemingly violated the specific *consensus expertorum* criterion he established for philosophical certainty in *Methods* Book III."
  3.  **Nuance the Conclusion:** Instead of concluding "Sidgwick was a hypocrite," conclude that this tension reveals Sidgwick's view that **rationality has limits**. He may have been demonstrating that reason *requires* a leap of faith (or at least a prolonged search for evidence) when the alternative is moral nihilism. This makes him more tragic and complex, rather than just "wrong."

  ### Summary Advice

  *   **Go for it.** It is a viable, philosophically sound topic.
  *   **Read Bart Schultz.** You need to know what the "boss" of Sidgwick studies has said so you can position your argument relative to his. (Look specifically for his discussions on Sidgwick's "esoteric" views and his letters).
  *   **Check Sidgwick's Essay "The Ethics of Conformity and Subscription."** This might give you more text on how he views the ethics of belief and dissent, which could bolster your epistemological argument.
  *   **Refine the "Contradiction."** Avoid calling it a "performative contradiction" unless you are very precise. It is better described as a "methodological tension" or an "epistemic asymmetry."

  This is a strong plan for a term paper. It shows you are engaging with the text's internal logic, not just the biography. Good luck.
