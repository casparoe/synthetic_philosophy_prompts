      *   *Pivot:* The user's argument is stronger if framed as a tension in his *general rationality* rather than a strict logical contradiction within *Methods*. Sidgwick viewed philosophy as rigorous science. If he applies rigorous standards to ethics, why lower them for SPR?
      *   *Key Scholar:* Mention Bart Schultz (*Henry Sidgwick: Eye of the Universe*). He covers this extensively. The student needs to know this exists so they don't think they've discovered something no one knows, but they can still argue their specific point.
