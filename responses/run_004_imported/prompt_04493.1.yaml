prompt: |-
  I'm taking a small philosophy elective at my school this term, and for our unit on Victorian ethics we've spent the last couple of weeks working through parts of Sidgwick's Methods of Ethics, including the famous concluding chapter where he admits that egoism and utilitarianism can't be fully reconciled by reason alone, so that what he calls the "Cosmos of Duty" threatens to collapse into a "Chaos" unless some further premise, like a moral government of the universe, turns out to be true. In a short biographical sketch our teacher handed out for the same unit, I learned that Sidgwick spent nearly two decades as a leading figure of the Society for Psychical Research, helping found it and serving as its president more than once, personally testing mediums and reported cases of telepathy. This apparently wasn't an embarrassing hobby unrelated to his real philosophy: he more or less admitted that he had been drawn to Kant's move of simply postulating an afterlife to guarantee that virtue and happiness ultimately coincide, but that he wanted actual empirical evidence for that postulate instead of just assuming it, and psychical research was where he went looking for it.

  For my term paper I want to push this connection a step further than "he did psychical research because of his ethics," which I gather is already a fairly standard thing to say about him, and I'd like your feedback before I commit to the idea. Elsewhere in the Methods, in the part he calls "Philosophical Intuitionism," Sidgwick lays out conditions a belief has to meet before it counts as genuinely self-evident, and one of them is roughly that persistent, unresolved disagreement among careful, competent people about a proposition is itself a reason to lower your confidence in it, not to dig in further. My argument is that his own psychical research should have tripped this wire quite early, since the investigations were dogged for years by exactly that kind of disagreement: outright fraud exposed in some cases, continuing skepticism from scientists outside the Society, and shifting, uncertain verdicts even within his own research circle from case to case, and yet he kept at the search for the rest of his life anyway. So my claim is that there's a real tension, maybe even something like a performative contradiction, between the careful epistemologist who wrote that chapter and the man who spent decades chasing mediums. Could you tell me: whether this is a fair reading of Sidgwick or something I'm forcing onto him; whether there's an obvious way he, or a good defender of his, could dissolve the tension that I'm not seeing; and, honestly, whether this angle is original enough to carry a full essay, rather than being a fairly obvious point that anyone who has read a decent biographical summary of him would already have made.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a student taking a philosophy elective on Victorian ethics, specifically focusing on Henry Sidgwick's *The Methods of Ethics*.
      *   **Key Knowledge:** They know about Sidgwick's "Dualism of Practical Reason" (Egoism vs. Utilitarianism), the need for a "moral government of the universe" to resolve it, and his deep involvement in the Society for Psychical Research (SPR) as a search for empirical evidence of that moral order (afterlife/rewards).
      *   **Proposed Thesis:** There is a tension/performative contradiction between Sidgwick's epistemological criteria for "self-evident" intuition (specifically regarding persistent disagreement among experts lowering confidence) and his lifelong commitment to psychical research despite persistent disagreement, fraud, and skepticism.
      *   **Questions:**
          1.  Is this a fair reading of Sidgwick, or is it forced?
          2.  Is there an obvious defense/dissolution of the tension I'm missing?
          3.  Is this original enough for a term paper, or is it obvious/overdone?

  2.  **Evaluate the Fairness of the Reading (Question 1):**
      *   *Sidgwick's Epistemology:* In *Methods* Book III, Sidgwick outlines criteria for self-evident axioms (clarity, precision, consistency, *consensus expertorum*). The "consensus of experts" (or lack of persistent disagreement among competent inquirers) is indeed a key criterion.
      *   *Sidgwick's Psychical Research:* He was a founding member of the SPR (1882), president, and investigated mediums (e.g., Eusapia Palladino). He remained hopeful but cautious until the end.
      *   *The Tension:* On the surface, yes, there is a tension. If expert opinion is divided on telepathy/afterlife, shouldn't Sidgwick lower his confidence according to his own epistemic rules?
      *   *Nuance:* Sidgwick distinguished between *ethical* intuitions (which need to be self-evident) and *empirical* claims (like the existence of God or afterlife). The "consensus" criterion applies primarily to philosophical intuitions in *Methods*. However, Sidgwick applied a rigorous empirical standard to SPR. He wasn't claiming telepathy was "self-evident"; he was claiming it was an empirical hypothesis.
      *   *Verdict:* It's a fair reading *if* framed carefully. It's not a direct logical contradiction (ethics vs. empirical science), but it reveals a psychological or methodological tension in his pursuit of certainty.

  3.  **Identify Potential Defenses/Dissolutions (Question 2):**
      *   *Distinction between Domains:* The "consensus of experts" criterion in *Methods* is for *moral axioms* (intuitionism), not empirical scientific claims. Psychical research was treated as science (inductive evidence), not intuition.
      *   *The Nature of the Evidence:* Sidgwick often argued that the evidence *was* accumulating, even if slowly. He might argue the disagreement was due to prejudice or lack of exposure, not genuine equipose among competent inquirers who *really* looked.
      *   *Desperation/Necessity:* Sidgwick famously said the "Dualism of Practical Reason" drove him to this. If reason demands a solution to avoid moral chaos, one is justified in holding onto a hope longer than strict empiricism might allow, provided one doesn't claim certainty. He remained agnostic, not dogmatic.
      *   *The "Fundamental Impulse":* Sidgwick admitted a non-rational impulse drove him. He might concede the tension but argue it's a human necessity given the stakes (the collapse of morality).

