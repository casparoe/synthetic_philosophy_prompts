      *   *The Problem of Waste in Nature (Geologist angle!):* As a geologist, the user knows nature is *full* of waste. Extinction, entropy, failed stars, unused minerals. Why assume humans are exempt from this universal trend of waste?
      *   *Category Error:* Science describes *how* things happen. Metaphysics/Religion tries to describe *why*. Using scientific success to prove metaphysical purpose is a category mistake.
