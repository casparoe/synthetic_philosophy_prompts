  2.  **Deconstruct the Statements Logically:**

      *   **Statement A:** "If Callum didn't do it, someone else did."
          *   *Context:* Early investigation. Facts are being gathered.
          *   *Logical Form:* $ \neg C \rightarrow \exists x (x \neq C \land x \text{ did it}) $.
          *   *Meaning:* The crime *happened*. Someone *must* be responsible. If it wasn't Callum, the responsibility lies elsewhere. This is a statement of *fact* regarding the event that occurred. It acknowledges the *reality* of the crime.
          *   *Modality:* Indicative conditional (dealing with facts/reality).

      *   **Statement B:** "If Callum hadn't done it, no one would have."
          *   *Context:* Late investigation. Rosalind knows Callum had the *unique* opportunity and motive.
          *   *Logical Form:* $ \neg C \rightarrow \neg \exists x (x \text{ would have done it}) $.
          *   *Meaning:* This is about *capability/necessity* in a counterfactual scenario. It implies Callum was the *only* person capable/willing to commit the crime. If you remove Callum from the equation, the crime *would not have occurred*.
          *   *Modality:* Subjunctive/Counterfactual conditional (dealing with possibilities/causality).

  3.  **Identify the Logical Distinction:**
      *   Statement A is about **culpability** (Who is responsible for *this* event?).
      *   Statement B is about **necessity/contingency** (Was this event *inevitable* given the actors involved?).
      *   The tense shift is crucial: "didn't do" (Indicative) vs. "hadn't done" (Subjunctive/Counterfactual).
