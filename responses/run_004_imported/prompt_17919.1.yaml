answer: |-
  Your gut is right. Your writing group is reacting to the surface-level syntax, but they are missing the **modal logic** shift happening between the two sentences.

  You are not contradicting yourself; you are moving from an **indicative conditional** (dealing with facts about a past event) to a **counterfactual conditional** (dealing with causal necessity and capability).

  Here is the breakdown of the mechanics, the logical proof, and the specific terminology you can use to defend this to an editor.

  ### 1. The Grammatical Mechanic: Indicative vs. Subjunctive
  The contradiction your group sees relies on treating both sentences as if they exist in the same "logical mood." They do not.

  *   **Statement A:** "If Callum **didn't** do it, someone else **did**."
      *   **Mood:** Indicative.
      *   **Function:** This addresses **Culpability**.
      *   **Premise:** The crime *definitely happened*. The tea *was* spiked.
      *   **Logic:** Since the event is a fixed fact of reality, the variable is only *who* is responsible. It establishes a closed set: {Callum, Others}. One of these must be true.
  *   **Statement B:** "If Callum **hadn't** done it, no one **would have**."
      *   **Mood:** Subjunctive (Counterfactual).
      *   **Function:** This addresses **Capability/Necessity**.
      *   **Premise:** We are now simulating a hypothetical world where Callum is removed from the equation.
      *   **Logic:** In this hypothetical scenario, the crime *does not occur*. This proves that Callum was not just *a* culprit, but a **necessary condition** for the crime.

  **The Defense:** You can tell your editor: *"The first line establishes that the crime occurred and someone must be liable. The second line establishes that Callum was the only agent with the capacity to execute it. One is about liability; the other is about capability."*

  ### 2. The Logical Mechanic: Fixed Event vs. Variable Outcome
  To visualize why these don't contradict, look at what is being held "constant" in each statement.

  **In Statement A (Early Investigation):**
  *   **Constant:** The Poisoned Tea. (It exists).
  *   **Variable:** The Perpetrator.
  *   **Equation:** If $\neg$Callum $\rightarrow$ Other Person.
  *   **Meaning:** "I know the tea was poisoned. I don't know who did it yet, but it wasn't magic. It was a person."

  **In Statement B (Late Investigation):**
  *   **Constant:** The Guest List/Circumstances. (The opportunities available).
  *   **Variable:** The Poisoned Tea. (Whether it happens at all).
  *   **Equation:** If $\neg$Callum $\rightarrow$ $\neg$Poisoned Tea.
  *   **Meaning:** "I now know the specific constraints of the room. Callum was the only one with access/motive. If you take him away, the tea remains safe."

  **The Contradiction Check:**
  Your group thinks Statement B means "No one else *did* it." But Statement B actually means "No one else *could have* made the tea poisoned."
  *   Statement A says: "Someone poisoned the tea."
  *   Statement B says: "Only Callum had the power to poison the tea."
  *   **Conclusion:** Callum poisoned the tea.
  *   **Contradiction?** None. They converge on the same truth.

  ### 3. The "Necessary Condition" Argument
  This is your strongest logical shield. In logic and philosophy, Statement B identifies Callum as a **Necessary Condition** for the event.

  *   **Statement A** treats the crime as a **Given**.
  *   **Statement B** treats Callum as the **Cause**.

  If you say, "If the spark hadn't happened, the fire wouldn't have started," you are not contradicting the earlier statement, "If this spark didn't start it, another spark did."
  *   The first acknowledges the fire exists.
  *   The second acknowledges the specific volatility of the situation (only this spark was hot enough).

  In your novel, Rosalind is realizing that the circumstances were so specific (access to the urn, timing, lack of witnesses) that Callum wasn't just *a* suspect; he was the *only* possible vector.

  ### 4. How to Defend This to an Editor
  If an editor flags this, do not say "It's a vibe." Use these terms:

  1.  **"It's a shift from Epistemic to Ontological."**
      *   Early on, Rosalind is speaking *epistemically* (based on what is known: a crime happened).
      *   Later, she is speaking *ontologically* (based on the nature of reality: only Callum had the means).
  2.  **"It distinguishes Identity from Opportunity."**
      *   Line 1 narrows the **Identity** of the criminal (It's either Callum or X).
      *   Line 2 narrows the **Opportunity** set (It could only be Callum).
  3.  **"It creates a Logical Funnel."**
      *   Explain that this is intentional character progression. Rosalind starts with the broad truth (someone did it) and ends with the specific truth (only he *could* have). Changing the second line weakens the deduction.

  ### 5. A Small Tweak for Clarity (Optional)
  While your logic is sound, readers (like your writing group) often skim logic and read for rhythm. If you want to bulletproof it without changing the meaning, you can add a single beat of context to the second line to emphasize the *capability* aspect.

  **Current:**
  > "If Callum hadn't done it, no one would have."

  **Tweaked:**
  > "Given the access required? If Callum hadn't done it, no one *could* have."

  Or:
  > "If Callum hadn't done it, the tea would still be safe."

  **Why this helps:** It shifts the focus from the *people* ("no one") to the *outcome* ("tea safe" / "could have"). However, if you prefer the punchiness of your original line, stick with the logic above. Your original line is stylistically stronger; the logic holds up.

  ### Summary
  Your writing group is reading both lines as claims about **who is in the room**.
  *   Line 1: "Callum or Someone."
  *   Line 2: "Callum or No One."
  *   *Their view:* These are different sets, therefore a contradiction.

  **The Reality:**
  *   Line 1 is about **Responsibility** for a past act.
  *   Line 2 is about **Capacity** for a hypothetical act.

  You are correct. Keep the lines. They show Rosalind's deduction evolving from "Who is guilty?" to "Who was capable?" which is a much more satisfying arc for a detective.
