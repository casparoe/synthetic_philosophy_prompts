answer: |-
  The broker's fee was two thousand dollars. Julian stared at the number on the screen, then at the photo of the bedroom. It faced east. In the picture, a rectangle of pure, unfiltered morning light cut across the hardwood floor.

  Julian looked down at his current surroundings. His own bedroom faced a brick wall. It was noon, and he had the lamp on. He was a graphic designer; he needed the sun. He needed it like a plant needed water.

  "It's an upgrade," he said aloud to the empty room.

  He signed the lease. He wrote the check for the fee, the moving van, the security deposit difference. His savings account dipped, a sharp little notch in the graph of his future. But two days later, he woke up at 6:00 AM. The sun was on his chest. He made coffee in a golden kitchen. He felt, objectively, richer.

  Three months passed. The sun remained beautiful, but the street below did not. It was a main artery. At 7:00 AM, the buses hissed. At 2:00 AM, the sirens wailed. Julian bought noise-canceling headphones, then earplugs, then a white noise machine. He stopped sleeping through the night. He began to dread the evening return, the key in the lock, the anticipation of the roar.

  He opened his laptop. He found a listing in the hills.

  It faced a park. It was on the top floor. It was silent. The photos showed a bedroom bathed in shadow, cool and still.

  "It's an upgrade," Julian said. He was tired. Sleep was worth more than sun. Sleep was the foundation of everything.

  He signed the lease. He wrote the check. Another two thousand dollars, plus the cost of packing the boxes he had unpacked ninety days ago. His savings account dipped again. The notch deepened. But the first night in the hills, he slept ten hours. He woke up without an alarm. He drank his coffee in a silence so profound he could hear the refrigerator hum. He felt, objectively, healthier.

  Six months passed. The silence remained perfect, but the commute began to eat him. The job was downtown. The hills were forty minutes away by train, then a twenty-minute bus ride, then a walk. He spent two hours a day in transit. He missed dinners. He missed the gym. He missed the spontaneous evenings that make a city livable. His life had become a schedule of departures and arrivals.

  He opened his laptop. He found a listing in the city center.

  It was a walk to the office. It was efficient. The photos showed a compact living room, functional and bright with artificial light. The bedroom faced an alley.

  "It's an upgrade," Julian said. He was lonely. Time was worth more than silence. Time was the only non-renewable resource.

  He signed the lease. He wrote the check. Another two thousand dollars. The moving van came back. His savings account dipped a third time. The graph was trending down, a steady staircase into the red. But the first week in the city center, he walked to work in ten minutes. He came home early. He met friends for drinks without calculating the last train. He felt, objectively, more alive.

  A year had passed since the east-facing room.

  Julian sat in his new desk chair. The alley outside was dark, even at midday. He turned on the lamp. The light was flat and yellow. He looked at the brick wall opposite his window. It was the same brick wall as the first apartment, or one exactly like it. He knew the texture of the mortar.

  He opened his banking app. The number was lower than it had been a year ago, despite no other major changes in his life. He had paid six thousand dollars in friction to rotate his life three hundred and sixty degrees.

  He sat in the quiet efficiency of the city center. He had his time back. But as the afternoon wore on, the yellow light began to grate on his eyes. He felt the creative stagnation creeping in, the grayness of the brick seeping into his designs. He remembered the rectangle of morning light on the hardwood. He remembered how it felt to wake up golden.

  His phone buzzed. A notification from the housing app. *New Listing: Sun-Drenched East-Facing Studio. Available Immediately.*

  Julian looked at the notification. He looked at his bank balance. He knew, with a sudden, cold clarity, that if he clicked the link, he would see the same floorboards, the same street, the same fee. He knew the sequence. He knew the sum of the parts was a loss.

  He looked at the lamp. It flickered. The room felt small. The brick wall felt like a cage.

  He knew he should close the app. He knew that a rational agent, seeing the loop, would endure the gray light to break the cycle. He knew that stopping now was the only way to make the past six thousand dollars mean something other than waste.

  But the light was so bad. And the sun was so good.

  Julian's thumb hovered over the screen. The logic of the present moment was heavy, solid, and undeniable. The logic of the year was abstract, a ghost in the ledger.

  He tapped the notification.
