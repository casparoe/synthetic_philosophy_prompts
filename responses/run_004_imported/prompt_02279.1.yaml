      *   **The Toll:** Moving fees, broker fees, security deposits lost.

  5.  **Drafting - Scene by Scene:**
      *   **Scene 1:** Elias in Apartment C. It's dark. He sees listing A. The light is irresistible. He pays the fee to move.
