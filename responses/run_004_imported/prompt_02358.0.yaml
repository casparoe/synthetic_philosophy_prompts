      *   **Key Fact:** Turing, a brilliant/logical thinker, accepted ESP (telepathy) evidence as "overwhelming" and "decisive," despite it being outside his core expertise (computing/mathematics). Later research showed this evidence was flawed/fraudulent (e.g., S.G. Soal).
      *   **Task:** Lay out the most important implications of this episode for how much *epistemic weight* to give a careful thinker's confident verdict on surprising phenomena outside their expertise.
      *   **Format:** Rank implications by importance. Close with a concrete heuristic.

