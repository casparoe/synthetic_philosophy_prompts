      *   *Context:* Philosophical paper on AI, but touched on parapsychology.
      *   *Outcome:* He was wrong. The science of ESP at the time was flawed/fraudulent.
      *   *Why?* Cognitive bias, cultural context (ESP was somewhat trendy in certain intellectual circles mid-20th century), reliance on statistical claims without methodological scrutiny (his expertise was theoretical, not experimental parapsychology).

  3.  **Brainstorm Implications (Epistemic Weight):**
