answer: |-
  Based on the episode of Turing's endorsement of ESP, here are the implications for how much epistemic weight you should assign to a careful thinker's verdict on surprising phenomena outside their core expertise, ranked by importance.

  ### 1. Expertise is Non-Transferable, Even for Geniuses
  The most critical implication is that high-level competence in one domain (logic, computation, mathematics) provides no immunity against error in a distinct domain (experimental psychology, parapsychology). Turing's ability to reason rigorously about algorithms did not equip him to evaluate the methodological integrity of card-guessing experiments.
  *   **Epistemic Weight:** Drastically reduce the weight given to the thinker's *status*. A "careful thinker" is only careful within the methodological constraints they have mastered. Outside those constraints, their cognitive reliability reverts to the baseline of an educated layperson.

  ### 2. Theoretical Literacy $\neq$ Methodological Literacy
  Turing accepted the "statistical evidence" as overwhelming. This highlights a specific blind spot: understanding the *mathematics* of probability is not the same as understanding the *sociology* of data collection. A theorist can verify a p-value without recognizing that the data generation process was compromised by fraud (Soal) or poor controls.
  *   **Epistemic Weight:** Be skeptical of verdicts based on "statistics" or "data" if the thinker lacks specific training in experimental design and fraud detection within that field. Theoretical confidence often masks methodological naivety.

  ### 3. The "Halo Effect" Distorts Bayesian Updating
  We are prone to updating our beliefs based on *who* holds them. Because Turing was right about AI, we feel he *should* be right about ESP. This episode demonstrates that the "Halo Effect" is a cognitive bug, not a feature. The probability of Turing being correct about ESP was independent of his correctness about computing.
  *   **Epistemic Weight:** Actively decouple the thinker's reputation from the claim. When evaluating the claim, pretend the verdict came from an anonymous source. If the evidence doesn't stand without the name attached, the epistemic weight should be near zero.

  ### 4. Confidence is a Measure of Coherence, Not Truth
  Turing was "confident" and called the evidence "decisive." This confidence likely stemmed from the internal coherence of the statistical reports he reviewed, not from an external verification of reality. In unfamiliar domains, even careful thinkers cannot accurately calibrate their confidence levels because they lack the feedback loops necessary to know what they don't know.
  *   **Epistemic Weight:** Discount the thinker's expressed confidence level. In out-of-domain judgments, confidence signals conviction, not accuracy.

  ### 5. Intellectual Zeitgeists Capture Even the Best
  Turing was operating within a specific cultural moment where parapsychology had a veneer of scientific respectability. This implies that "careful thinkers" are not isolated from the prevailing biases of their era. If the broader scientific community has not yet reached a robust consensus (or is in the process of correcting a fraud), an individual thinker is likely to inherit the community's error.
  *   **Epistemic Weight:** Prioritize the *long-term consensus* of the specific domain over the *immediate verdict* of an outsider, no matter how brilliant.

  ***

  ### Concrete Heuristic

  **The Domain-Boundary Rule:**
  > "When a reliable expert makes a confident claim about a surprising phenomenon **outside their specific methodological domain**, treat their verdict as **layperson opinion**, regardless of their intellect or reputation. Accept the claim only if the evidence holds up to scrutiny *without* referencing the thinker's endorsement."
