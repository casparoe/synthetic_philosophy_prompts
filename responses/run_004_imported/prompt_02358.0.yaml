      *   *Consensus matters more than individual brilliance:* Even geniuses can be swept up in zeitgeists.
      *   *Extraordinary claims require extraordinary evidence (and scrutiny):* Turing accepted the statistical claim without questioning the methodology.
      *   *Confidence $\neq$ Accuracy:* A careful thinker can be confidently wrong.
      *   *The "Halo Effect":* We trust Turing on computers, so we might trust him on ESP. We shouldn't.
      *   *Replication/Long-term view:* Science self-corrects, but it takes time. Immediate verdicts are risky.
      *   *Methodological literacy:* Understanding stats isn't the same as understanding experimental controls (blinding, etc.).

  4.  **Select and Rank Implications:**
      *   *Criterion:* Which implications most directly address the user's question about *epistemic weight* regarding *surprising phenomena* outside *core expertise*?
      *   *Rank 1 (Most Important):* Domain Specificity of Expertise. Intelligence doesn't transfer perfectly. Turing's logic skills didn't protect him from bad experimental data.
      *   *Rank 2:* The Danger of the "Halo Effect" / Authority Bias. We overweight the opinion of a genius even outside their lane.
      *   *Rank 3:* Methodological Naivety vs. Theoretical Brilliance. Understanding the *math* of statistics isn't the same as understanding the *practice* of data collection (fraud, bias).
      *   *Rank 4:* The Fallibility of Consensus/Zeitgeist. Even careful thinkers are products of their time.
      *   *Rank 5:* Confidence as a Poor Signal. Internal confidence doesn't correlate with external truth in unfamiliar domains.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Implication 1:* Expertise is siloed. Turing is the ultimate example. If he can be wrong about ESP, anyone can be wrong outside their lane. *Weight:* Drastically reduce weight.
      *   *Implication 2:* Statistical literacy $\neq$ Experimental literacy. Turing looked at the numbers ("overwhelming statistics") but missed the process ( Soal's fraud). *Weight:* Be skeptical of "statistical" arguments in soft sciences if you aren't a methodologist.
      *   *Implication 3:* The "Genius Halo." We treat Turing's opinion on ESP as more valuable than a random person's because he's Turing. This episode proves that's a fallacy. *Weight:* Ignore the status of the thinker when evaluating the claim outside their domain.
      *   *Implication 4:* Extraordinary claims need more than just "statistical significance." They need robustness against fraud. *Weight:* Demand methodological rigor over p-values.

  6.  **Developing the Heuristic:**
