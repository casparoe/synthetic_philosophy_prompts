answer: |-
  **The Diachronic Defense: Why Money Pumps Condemn Naivety, Not Cyclical Preferences**

  The money-pump argument is one of the most famous tools in the normative toolbox of decision theory. It purports to demonstrate that having cyclical preferences—preferring A to B, B to C, and C to A—is irrational. The mechanism is intuitive: if an agent holds such preferences, a cunning bookie can trade the agent A for B (for a small fee), then B for C (for a fee), then C back to A (for a fee). The agent ends up with exactly what they started with but less money. Since losing money for no gain is a paradigm of irrationality, the argument concludes that cyclical preferences must be irrational, and thus, transitivity is a requirement of rational choice.

  However, this argument relies on a hidden assumption about the nature of agency: that the agent is "naive." A naive agent makes choices myopically at each node of a decision tree, ignoring past choices and future consequences. Edward McClennen's concept of "resolute choice," alongside R.H. Strotz's "sophisticated choice," dismantles this assumption. These models show that an agent can retain cyclical preferences yet avoid exploitation by managing their choices over time. Consequently, the money-pump argument fails to establish transitivity as a fundamental synchronic constraint on rationality. Instead, it reveals that the true requirement of rationality is diachronic consistency. The money pump does not condemn cyclical preferences; it condemns naive agency.

  To understand why the pump fails, we must first isolate its mechanics. The standard money pump assumes a specific model of sequential choice. At time $t_1$, the agent prefers B to A and pays $\epsilon$ to switch. At $t_2$, they prefer C to B and pay $\epsilon$ to switch. At $t_3$, they prefer A to C and pay $\epsilon$ to switch. The irrationality seems evident because the agent violates the principle of dominance: they end up in state A-minus-money, which is strictly worse than state A.

  The flaw lies in the assumption that the agent *must* make the trade at $t_3$ simply because they prefer A to C at that moment. This assumes the agent is unable to treat a sequence of actions as a single object of choice. McClennen's resolute chooser rejects this atomized view. A resolute agent formulates a plan at the outset—for example, "Acquire B, then stop"—and adheres to that plan even when their local, pairwise preferences at a later node suggest a deviation. When the bookie offers to trade C back to A at $t_3$, the resolute agent refuses. They acknowledge that, in a vacuum, they prefer A to C. However, they also prefer the outcome of the plan (ending with C) to the outcome of the deviation (ending with A minus total fees). By resolving to stick to the plan, they block the pump without altering their underlying pairwise ranking of A and C.

  Critics often dismiss resolute choice as "cheating." They argue that if an agent refuses the final trade, they effectively reveal a preference for "Keep C" over "Get A minus $\epsilon$." If this revealed preference holds, the critic claims, the agent's preferences were transitive all along, just misdescribed. This objection, however, conflates *underlying tastes* with *choice dispositions*. The money-pump argument is intended to test the rationality of the underlying tastes (the pairwise comparisons). If I genuinely enjoy A more than C, but I refuse the trade to avoid the pump, my underlying taste remains cyclical. My *action* is constrained by a higher-order commitment to diachronic consistency. To say this restores transitivity is to redefine preferences solely by observed choices in complex sequences, which renders the money-pump argument tautological. It would essentially say: "If you don't get pumped, you aren't cyclical." But McClennen's point is precisely that you *can* be cyclical and *not* get pumped, provided you are resolute.

  Furthermore, resolute choice is distinct from mere pre-commitment. A Ulysses strategy involves binding one's future self physically or institutionally (e.g., tying oneself to the mast). Resolute choice is an internal capacity of rational agency to treat a prior intention as a reason for action that overrides a current local preference. If rationality is defined as the effective pursuit of one's ends, the resolute agent is more rational than the naive one, even if both share the same cyclical tastes. The naive agent undermines their own welfare through myopia; the resolute agent secures the best available outcome permitted by their preferences. If the resolute agent is rational, then cyclical preferences cannot be inherently irrational, for they have been successfully managed.

  One might counter that resolute choice is too demanding, requiring a cognitive discipline that most humans lack. While empirically true, this misses the normative point of the money-pump argument. Decision theory is not psychology; it prescribes how agents *ought* to reason, not how they *do*. If resolute choice is a coherent mode of agency, it is available to the idealized rational agent posited by the money-pump argument. If the idealized agent can use resoluteness to avoid the pump, then the pump fails to prove that transitivity is a necessary condition for ideal rationality. It only proves that transitivity is a *sufficient* condition for naive agents to avoid exploitation. For a resolute agent, transitivity is dispensable.

  The deeper lesson here concerns the locus of rationality. The money-pump argument attempts to locate irrationality in the static structure of preferences at a single moment (synchronic rationality). It claims that a "snapshot" of your mind containing a cycle is defective. McClennen's objection shifts the locus to the temporal extension of agency (diachronic rationality). A set of preferences is not irrational in isolation; it becomes problematic only when coupled with a mode of choice that allows self-undermining behavior.

  Consider the alternative: "Sophisticated" choice. A sophisticated agent (in Strotz's sense) uses backward induction. They foresee that if they acquire B, they will later trade it for C, and then for A (losing money). Anticipating this loss, they refuse to trade A for B in the first place. They avoid the pump, but they do so by never entering the cycle. This is less optimal than resolute choice (which allows entering the cycle but stopping at the peak), but it still avoids exploitation. Both sophistication and resoluteness demonstrate that the vulnerability to the money pump is a function of the *decision procedure*, not the *preference ordering*.

  Therefore, the verdict must be that the money-pump argument does not establish transitivity as a requirement of rationality. It establishes that *naive sequential choice* is irrational. If an agent possesses the capacity for resolute choice, they can hold cyclical preferences without being susceptible to exploitation. The normativity of transitivity is derivative: we value transitive preferences because they make diachronic consistency easy for naive agents. But if an agent can achieve diachronic consistency through resoluteness, the structural constraint of transitivity is no longer necessary.

  This conclusion reshapes our understanding of rational agency. It suggests that rationality is not merely about having a coherent ordering of desires at a moment, but about the capacity to integrate those desires over time. A rational agent is not one who never feels conflicting urges (cyclical preferences), but one who can govern those urges through a coherent narrative of choice. The money pump successfully identifies a vulnerability in human decision-making, but it misdiagnoses the cause. The disease is not the cycle; the disease is the naivety that allows the cycle to spin. Rationality requires not transitive preferences, but a resolute will.
