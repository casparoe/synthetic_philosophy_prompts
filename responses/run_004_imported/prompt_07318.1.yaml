prompt: |-
  A friend of mine, Daniel, is celebrating twenty years sober next month, and he's asked me to say a few words at the party. Shortly before he asked, another friend and I got into a long argument neither of us won. She maintained that what Daniel overcame was weakness of will in the strict philosophical sense: he judged, correctly and continuously, that drinking was worse for him, and simply failed, again and again, to act on that judgment. I argued that hyperbolic discounting describes it more accurately, and more kindly: there was never a real contradiction in him, only a present self and a future self with mismatched discount curves, so what sobriety changed was which self got to decide, not how much willpower he had. She replied that my account quietly excuses every relapse as 'rational, for whichever self was having it,' and can't explain why Daniel, sober, describes his drinking as a betrayal of what he actually wanted, rather than another person's reasonable choice. I had no good reply. Some guests are in recovery and talk about will and surrender every day; others have never considered any of this. Please write the toast. It should run about five minutes, stay warm, and genuinely honor what Daniel did, and work for both halves of the room without quietly settling our argument by treating either picture of him as simply the true one.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** 20-year sobriety anniversary party for a friend named Daniel.
      *   **Speaker:** A friend of Daniel's.
      *   **Context/Conflict:** The speaker recently had a philosophical argument with another friend about the nature of addiction/willpower.
          *   *Friend's View:* Weakness of will (Akrasia). Daniel knew drinking was bad but couldn't stop. Sobriety = stronger will.
          *   *Speaker's View:* Hyperbolic Discounting (Time Inconsistency). Present self vs. Future self. Sobriety = changing which self decides.
          *   *Friend's Counter:* Speaker's view excuses relapse as "rational" and doesn't account for Daniel's feeling of *betrayal* (that drinking wasn't what he *really* wanted).
          *   *Speaker's Dilemma:* Had no good reply then, needs to speak now.
      *   **Audience:** Mixed. Some in recovery (familiar with "will and surrender"), some not (laypeople).
      *   **Constraints:**
          *   Length: About 5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   Tone: Warm, honoring Daniel.
          *   Crucial Requirement: Do *not* settle the argument definitively. Do not treat either philosophical picture as the single "truth." Acknowledge the complexity without getting bogged down in jargon. Honor the experience of recovery without alienating the laypeople.

  2.  **Deconstruct the Philosophical Conflict for the Toast:**
      *   *Weakness of Will:* Focuses on the struggle, the moral weight, the "I know better but I do it anyway" pain. This resonates with the language of "powerlessness" and "surrender" in recovery circles.
      *   *Hyperbolic Discounting:* Focuses on the time dimension, the conflict between now and later. This resonates with the concept of "One Day at a Time."
      *   *The Synthesis:* Both models try to explain the *suffering* and the *solution*. The toast shouldn't be a lecture on philosophy. It should be about Daniel's *life*. The philosophy is just a lens to appreciate the magnitude of his achievement.
      *   *Addressing the "Betrayal":* The friend argued that Daniel feels drinking was a betrayal. This needs to be honored. It means there *was* a true desire that was being overridden.
      *   *Addressing the "Rationality":* The speaker argued that the drinking self had reasons. This needs to be acknowledged without excusing the behavior. The pain was real, even if the logic was flawed by time.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the milestone (20 years is huge), express love for Daniel. Set a warm tone.
      *   **The Middle (The Core):** This is where I need to weave in the philosophical tension without naming it explicitly as "Akrasia vs. Hyperbolic Discounting."
          *   Acknowledge the mystery of addiction.
          *   Touch on the "Will" aspect: The sheer effort, the discipline.
          *   Touch on the "Time/Self" aspect: The negotiation between who we are now and who we want to be.
          *   Address the "Betrayal": Acknowledge that Daniel feels he lost himself, and now has found himself.
          *   *Crucial Move:* Validate both perspectives as partial truths that serve a purpose. The "Will" view honors the struggle. The "Time" view honors the compassion needed for recovery.
      *   **The Resolution:** Bring it back to Daniel. It doesn't matter *why* it worked, it matters *that* it worked. The result is the life we see today.
      *   **Closing:** A toast to Daniel.

  4.  **Refining the Tone:**
      *   Avoid academic jargon (no "hyperbolic discounting," "akrasia," "discount curves"). Use plain English metaphors.
      *   Ensure the recovery crowd hears "surrender" and "honesty."
