      *   **Dialetheism:** A metaphysical/semantic thesis. There exist sentences $A$ such that $A$ and $\neg A$ are both *true*.
      *   **The Principle of Explosion (EFQ):** $A, \neg A \vdash B$. Classical logic accepts this. Paraconsistent logic rejects it.

