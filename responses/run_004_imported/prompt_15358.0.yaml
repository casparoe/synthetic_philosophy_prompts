answer: |-
  Your unease is not only real; it is philosophically profound. You have stumbled upon one of the oldest and most difficult problems in ethics and metaphysics, often called the **Problem of Moral Luck** or the **Basic Argument against Free Will.**

  Your friend's attempt to comfort you relies on a common intuition: that if our actions aren't *determined* by the past, they must be *free*. However, most philosophers who study this specific niche agree that her argument—that neural randomness saves moral credit—does not hold up.

  Here is why your friend is likely wrong, why your intuition is robust, and how you might navigate this realization without losing your drive.

  ### 1. Why Randomness Does Not Equal Credit
  Your friend's argument is that because the brain has indeterministic elements (quantum noise, random neural firing), your choices are not fully scripted by your genetics and upbringing. Therefore, she argues, *you* are the author.

  The flaw here is that **randomness is not agency.**

  Imagine you are deciding whether to work hard or slack off.
  *   **Scenario A (Determinism):** Your genetics and upbringing cause you to work hard.
  *   **Scenario B (Randomness):** A random neural fluctuation causes you to work hard.

  In Scenario A, you feel you don't deserve credit because your parents/genes did the work. In Scenario B, why do you deserve credit? If a choice is the result of a random roll of the dice in your synapses, that is not *you* choosing; that is *chance* choosing.

  To deserve ultimate credit, you need to be the **source** of the action. But if the action comes from prior causes (upbringing) or random noise (neural firing), neither of those makes *you* the ultimate source. As the philosopher Galen Strawson has argued, to be truly responsible for your choices, you would have to be responsible for the character that made those choices—and to be responsible for that character, you would have to have chosen the principles by which you formed it, ad infinitum. Since you didn't choose your starting point, you can't claim ultimate authorship.

  Your friend tried to solve the problem of *determinism* with *indeterminism*, but neither grants the kind of "self-creation" required for the kind of credit you are questioning.

  ### 2. Your Unease is About "Constitutive Luck"
  Your intuition that your discipline is "downstream" of your starting point is what philosophers call **constitutive luck**. This is the luck of who you are—your temperament, your capacity for focus, your baseline anxiety or drive.

  You are correct that your later efforts to become *more* disciplined were only possible because you possessed a baseline level of discipline to begin with. A person without that genetic or environmental head-start could not have "chosen" to bootstrap themselves in the same way.

  Your unease is pointing at a real metaphysical limit: **You cannot take credit for the tools you used to build your success, because you did not build the tools.**

  ### 3. So, Is the Praise "Unearned"?
  This is where we must shift from metaphysics to pragmatics. If we accept your intuition (that ultimate moral desert is impossible), does that mean praise is meaningless? Not necessarily. It just changes *what the praise is for.*

  There are two ways to view praise:
  1.  **Retributive/Desert-Based:** "You deserve this reward because you are the cosmic origin point of this good action." (This is what you are doubting, and rightly so.)
  2.  **Consequentialist/Functional:** "We praise you to reinforce this behavior in you and signal to others that this behavior is valuable."

  Even if your discipline is the result of luck, it is still *your* discipline in a practical sense. It is located in your body and mind. When your friends praise you, they are not necessarily making a metaphysical claim about your soul's independence from causality. They are acknowledging that **you are the vessel through which this value entered the world.**

  ### 4. How to Live With This Realization
  Realizing that you are not the "uncaused cause" of your success can feel like it drains the meaning from your hard work. It can lead to a sense of impostor syndrome on an existential level. However, many who grapple with this find a different, perhaps more sustainable, emotional stance.

  **Shift from Pride to Stewardship**
  Pride says, "I created this." Stewardship says, "I was given these traits, and I chose to cultivate them rather than waste them."
  You still made choices. Even if the *capacity* to choose well was lucky, the *exercise* of that capacity was real. You could have squandered your advantages. Many people with great discipline and privilege do. Recognizing the luck involved doesn't negate the effort; it just contextualizes it. It invites gratitude rather than arrogance.

  **Accept "Compatibilist" Freedom**
  Many philosophers (Compatibilists) argue that we should redefine "free will." We don't need to be free from *causation* to be free; we only need to be free from *coercion*.
  *   Were you forced to work at gunpoint? No.
  *   Did you act according to your own desires and character? Yes.
  *   Therefore, in the only sense that matters for human society, you are free and responsible.

  Your friend tried to give you **Libertarian Free Will** (magic independence from physics), which doesn't exist. But you can keep **Compatibilist Free Will** (acting according to your own internal states), which is enough to justify social praise and self-respect.

  ### Summary
  Your friend is incorrect that randomness settles the matter; randomness removes determination but does not grant authorship. Your unease is pointing at something real: the impossibility of being the ultimate origin of oneself.

  However, this does not render your life or work meaningless. It simply suggests that **credit** is not a metaphysical substance you earn, but a social tool we use to encourage valuable behavior. You can accept the praise not as a judgment on your soul's independence, but as an acknowledgment that the world is better because you showed up and used the hand you were dealt.

  You are not the source of the river, but you are the one who built the mill. That still counts.
