answer: |-
  President, faculty, families, and the Class of 2024:

  Thank you. It is a strange honor to return to a place that assigned you John Dewey's *The Public and Its Problems* as freshman reading. Most colleges give you a water bottle and a syllabus. This one gave you a philosophical problem.

  I am a novelist. My job is to make things up. But for the last twenty years, my books have returned again and again to the same setting: small, self-governing communities. A town meeting in Vermont; a housing co-op in Brooklyn; a tenant association fighting a buyout. I write these scenes because I am trying to understand how people decide to live together when they don't have to.

  The Dean asked me to speak today because she assumes that, since I write about democracy, I understand how it works. But writing about a town meeting in a quiet room is different from standing here, looking out at four hundred faces, knowing that the world outside this quadrangle is noisy, fractured, and deeply uncertain.

  I want to talk to you about that uncertainty. Specifically, I want to talk about the argument hidden inside the book you read your first year.

  When Dewey wrote *The Public and Its Problems* in 1927, he was answering a very smart, very pessimistic critic. That critic argued that the modern world had become too complex for ordinary people to understand. How can a farmer understand international trade tariffs? How can a teacher understand nuclear physics? The critic said: You can't. The problems are too indirect, too technical. So, honesty requires us to stop pretending the "public" can govern itself. We should leave the decisions to the experts, the insiders, the professionals.

  It is a seductive argument. You feel it every time you read a headline about a crisis you don't understand. You feel it when you think, *I am just one person; what can I possibly know?*

  Dewey's response was not to call that critic a cynic. He agreed with the diagnosis. He admitted that the public of his day was confused. He said the public had become "eclipsed." But he disagreed on the cause. He didn't think citizens were inherently incompetent. He thought the *conditions* for being a citizen had broken.

  Industrialization, urbanization, and mass media had severed the link between our actions and their consequences. We were doing things whose effects we couldn't see, and we were talking to people whose lives we couldn't imagine. When communication breaks, the public goes blind.

  So, Dewey's remedy wasn't "trust the experts." It was "fix the communication." He argued that democracy is not just a system of government. It is a method of learning. It is a form of social inquiry.

  This is the part I want you to take with you. Not the slogan that "democracy is a way of life," but the mechanical reality of what that means. Dewey believed that human knowledge doesn't come from finding eternal truths. It comes from encountering an unsettled, indeterminate situation, forming a hypothesis, acting on it, observing the consequence, and adjusting. He called this "warranted assertibility." It is a clunky phrase, but it means: *We act on what we know works for now, knowing we might be wrong later.*

  You are graduating into an indeterminate situation. You do not know where you will live, what you will earn, or whether the institutions you are entering will survive the decade. The temptation will be to seek certainty. To find a dogma, a career path, or an ideology that promises you a map where there is none.

  I am asking you to resist that temptation. I am asking you to treat your own lives as instances of Dewey's experimental method.

  When you move to a new city, do not just look for a job; look for the consequences of your presence there. Who is affected by where you rent? What happens when you speak to your neighbors? Form a hypothesis: *If we organize this block, we can lower the rent.* Test it. If it fails, do not retreat into cynicism. Treat the failure as data. Adjust the hypothesis.

  This is harder than it sounds. Dewey believed this inquiry required face-to-face community. He believed you needed to see the eyes of the people you were deciding for. He believed that without shared symbols and local association, the public remains a phantom.

  I have to be honest with you: I do not know if those conditions still exist.

  I write about town meetings, but I know that today, our "public squares" are algorithms designed to maximize outrage, not inquiry. I know that "community" is often a marketing term for a gated development. Dewey thought the Great Depression was a crisis of capitalism; we are living through a crisis of attention. It is harder to locate your public now than it was in 1927.

  If I stood here and told you that "the tools are in your hands" and "you can fix anything," I would be lying. I am not confident that the old forms of association will save us. I don't know if the town meeting can survive the smartphone.

  But I am confident in the method.

  The method is this: When you encounter a problem, do not outsource the thinking. Do not wait for an expert to tell you what is good. Gather your people. Define the problem together. Propose a solution. Test it. Accept that your certainty will always be provisional.

  This applies to your civic life, but it also applies to your private one. When you are in a relationship, do not seek a final certainty that you are "right." Seek a warranted assertibility that you are *listening*. When you are in a workplace, do not accept that "this is just how it's done." Ask what the consequence of the work is, and who bears it.

  Dewey's quarrel with the pessimists was ultimately a quarrel about hope. But it was not a blind hope. It was the hope of the scientist in the lab. It is the hope that says: *The situation is confused, but it is not hopeless, provided we are willing to do the work of inquiry.*

  You are leaving a college that calls itself a "laboratory in democracy." That is not just a motto. It is a warning. Laboratories are messy. Experiments fail. Glass breaks.

  Do not go out there looking for a world that is already solved. Do not look for a public that is already waiting for you. You have to build the conditions where a public can happen. You have to build the rooms where people can speak without being shouted down. You have to build the networks where consequences are visible.

  It will be exhausting. You will not always succeed. You will often feel like the critic was right, that the problems are too big and you are too small.

  But remember that the public is not a thing you find. It is something you make, every time you choose to inquire together rather than retreat alone.

  Go forth and be uncertain. Go forth and test your hypotheses. And when you find a piece of ground where people can speak to one another honestly, hold onto it. That is the only laboratory we have.

  Thank you.
