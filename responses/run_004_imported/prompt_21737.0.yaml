prompt: |-
  So for my APUSH podcast project I'm "interviewing" Frederick Douglass, and I want the questions to actually dig into his big constitutional flip-flop instead of just generic bio stuff. In the 1840s he was with Garrison calling the Constitution basically "a covenant with death" bc of stuff like the fugitive slave clause, but by his 1860 Glasgow speech he's arguing the exact same document is secretly anti-slavery once you go by the actual text instead of what the framers obviously meant. Can you write me like 8 interview questions that press him on that switch -- like why the plain wording should beat pretty clear original intent on things like the three-fifths and fugitive slave clauses, whether his new "liberty document" reading is just as cherry picked as the pro-slavery reading he used to hold, and what he'd say to Garrison basically calling him a sellout -- and for each one throw in a quick follow up based on what he probably would of said back?
