          *   *Refinement:* Challenge his new reading. How is counting slaves as 3/5 not admitting they are property?
          *   *Follow-up:* Douglass's counter that it was a penalty on slave states, not a recognition of property.

      *   *Question 4: Fugitive Slave Clause.* The hardest hurdle.
          *   *Draft:* Doesn't the Constitution say return escaped slaves?
          *   *Refinement:* The clause says "persons held to service." How do you get around that?
          *   *Follow-up:* Douglass's argument that "persons" implies people, not chattel, and federal enforcement is limited.

      *   *Question 5: Cherry-Picking Accusation.* Addressing bias.
          *   *Draft:* Aren't you just picking the good parts like the pro-slavery guys picked the bad parts?
          *   *Refinement:* Is this "legal gymnastics" just to suit your goal?
          *   *Follow-up:* Douglass's stance that the *purpose* of government is liberty, so interpreting it that way isn't cherry-picking, it's correct.

      *   *Question 6: Garrison & Sellout.* The personal/political rift.
          *   *Draft:* Garrison says you sold out. What do you say?
          *   *Refinement:* Garrison calls you a hypocrite for voting/using politics now.
