      *   **Requirement:** Each question needs a follow-up based on what Douglass likely would have said back (historical accuracy/context).

  2.  **Historical Context Check (Douglass's Evolution):**
      *   *Phase 1 (1840s):* Influenced by William Lloyd Garrison. Viewed the Constitution as pro-slavery because it protected slavery where it existed (3/5 clause, fugitive slave clause, importation clause). "Covenant with Death and Agreement with Hell."
      *   *Phase 2 (1850s onwards, crystallized in 1860 Glasgow speech):* Influenced by Gerrit Smith and Lysander Spooner. Argued the Constitution *never* explicitly mentions "slavery" or "slave." It uses euphemisms ("persons held to service"). Therefore, the text itself is neutral or anti-slavery, and the *intent* of the framers shouldn't bind the present if the text allows for liberty. Slavery is a state institution, not federal.
      *   *Key Tension:* Textualism vs. Originalism. Political pragmatism vs. Moral purity.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Catalyst.* Need to start with the change itself.
          *   *Draft:* Why did you change your mind about the Constitution?
          *   *Refinement:* Make it sharper. Focus on the specific moment or reasoning.
          *   *Follow-up:* Connect it to his study of law/Smith.

      *   *Question 2: Text vs. Intent.* This is the core legal argument.
          *   *Draft:* Why do you care more about words than what the founders meant?
          *   *Refinement:* Contrast "plain wording" with "clear original intent."
          *   *Follow-up:* Douglass's argument that the text is the law, not the secret thoughts of the writers.

      *   *Question 3: The Three-Fifths Clause.* Specific evidence.
