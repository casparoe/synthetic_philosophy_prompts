  10. (Final Polish): Ensure the distinction between $P(\text{Coin}=T)$ and $P(\text{I am in a } T \text{ world})$ is clear. Actually, SIA argues $P(\text{Coin}=T | \text{I exist})$ *is* the high number. SSA argues it stays 0.5. I need to be precise there.

      *   *Correction:* SSA says $P(T | \text{I exist}) = 0.5$ because "I exist" is guaranteed in both worlds (at least one instance exists). Wait.
