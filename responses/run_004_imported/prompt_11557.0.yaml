      *Refining the Ockhamist "Thin Red Line":* Lysander must admit we can't *identify* the line epistemically, but ontologically it exists.

  7.  **Final Polish:** Check the pacing. Ensure Nicias isn't just a prop but represents the human stake. Check that the "Sea Battle" example is central.

      *(Final check on constraints)*:
      - Dialogue? Yes.
