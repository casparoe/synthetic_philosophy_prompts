answer: |-
  It is completely understandable why a scientifically trained mind would view Sidgwick's involvement with the Society for Psychical Research (SPR) as a regrettable lapse into superstition. For a long time, that was the standard view: the great rationalist lost his grip in old age.

  However, if you are writing a summary or trying to fully understand his philosophical project, **you should not leave it out.** Contemporary scholarship has moved decisively away from viewing this as a separate "lapse" and instead sees it as **philosophically continuous** with his work in *The Methods of Ethics*.

  Here is why serious scholars keep bringing the two up together, framed in a way that might resonate with your background in chemistry.

  ### 1. The "Dualism of Practical Reason" was an Emergency
  You noted that his reasoning "fizzles out at the end into this unresolved worry." In Sidgwick scholarship, this is known as the **Dualism of Practical Reason**. Sidgwick rigorously demonstrated that:
  *   **Rational Egoism** (maximizing my own happiness) is self-evidently rational.
  *   **Utilitarianism** (maximizing universal happiness) is also self-evidently rational.
  *   **The Problem:** These two often conflict. If I can gain a great deal by acting unfairly, and I can get away with it, Egoism says "do it," while Duty says "don't."

  Sidgwick found this unacceptable. He believed that for morality to be truly rational, there must be a harmony between duty and self-interest. Historically, religion solved this: God ensures that virtue is rewarded in the afterlife. But Sidgwick, a man of the 19th-century scientific enlightenment, could not simply dogmatically assert religious doctrine. He needed **evidence**.

  ### 2. Psychical Research as "Empirical Theology"
  This is where the chemist in you might appreciate Sidgwick's motivation, even if you reject his data. Sidgwick did not turn to spiritualism because he was "soft-headed"; he turned to it because he was **rigorously evidentialist**.

  He hoped that the SPR could provide empirical, scientific proof of survival after death and divine moral governance. If he could prove via séance data (analogous to lab data) that the soul survives and that justice is meted out in the long run, then the Dualism of Practical Reason would be resolved. Self-interest and Duty would align because the "self" extends beyond death.

  He wasn't looking for magic; he was looking for **data points** that would allow him to complete his ethical axioms. He treated psychical research as a legitimate branch of inquiry, subjecting mediums to the same scrutiny he applied to ethical intuitions. Unfortunately, as we know, the data was flawed, but the *methodological intent* was consistent with his philosophy.

  ### 3. The Scholarly Consensus
  The definitive modern biography, *Henry Sidgwick: Eye of the Universe* by Bart Schultz (2004), argues persuasively that Sidgwick's psychical research was not a decline but a desperate, sustained attempt to solve the central problem of his ethics.

  Scholars now argue that ignoring the SPR work creates a distorted picture of Sidgwick. It makes him look like a cool, detached logician, when in reality he was a man deeply troubled by the implications of his own logic. He was willing to risk his scientific reputation to find a solution to the moral crisis he had identified.

  ### 4. How to Handle It in Your Summary
  You don't need to validate his conclusions about mediums to acknowledge the connection. Here is a suggested approach for your summary:

  *   **Don't dismiss it as senility:** Acknowledge that for Sidgwick, this was a serious epistemological project, not a hobby.
  *   **Frame it as a solution to the Dualism:** Explain that his interest in the afterlife was driven by the need to reconcile Duty and Self-Interest.
  *   **Maintain the distinction:** You can note that while his *ethical arguments* in *The Methods* stand on their own logical merits, his *motivation* to find a theological grounding for them led him into psychical research.

  ### The Verdict
  If you treat the SPR work as a separate "lapse," you miss the profound anxiety driving Sidgwick's later thought. He wasn't abandoning reason; he was trying to extend the scientific method into the metaphysical realm to save morality from irrationality.

  As a retired chemist, you might view it this way: Sidgwick hypothesized that "Moral Law requires Cosmic Justice." He spent 20 years running experiments (séances) to test the hypothesis. The experiments failed, but the experimental design was driven by his theoretical framework. To understand the theory, you have to understand why he thought those experiments were necessary.
