prompt: |-
  I'm a retired chemist who's gotten into philosophy lately, and I've been slowly working through Sidgwick's Methods of Ethics -- I love how careful and almost axiomatic his reasoning is, though it fizzles out at the end into this unresolved worry about whether duty and self-interest always line up. Anyway, it threw me to separately learn that the same guy spent something like the last two decades of his life investigating mediums and seances for the Society for Psychical Research -- seems like the poor man just went a bit soft-headed and superstitious in old age. Since that episode was obviously a personal lapse, seperate from the real philosophy, am I right to just leave it out of any summary of his ethics, or is there some reason serious people keep bringing the two up together?
