  8.  *(Final thought on the "Proof" terminology)*: In Section X, Hume writes: "there is here a direct and full proof, from the nature of the fact, against the existence of any miracle." This is the flashpoint. The clergyman must seize on "full proof." Hume must clarify that "full proof" in matters of fact means "unopposed experience," not "logical necessity."

