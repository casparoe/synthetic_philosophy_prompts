      *   *Section 1: The Nature of Mathematical Truth (Mental vs. Syntactic).* Discuss Brouwer's view that math is a mental construction. Proof assistants require externalization. Quote/paraphrase his view on language as an unreliable instrument.
      *   *Section 2: The Problem of Choice Sequences.* This is crucial. Explain lawless sequences. Explain how DTT (Calculus of Constructions, etc.) is based on recursive functions. Show the mismatch. This is stronger than just "no LEM."
      *   *Section 3: Logic as Tool vs. Logic as Foundation.* Heyting's axiomatization was already too much for Brouwer. Curry-Howard makes logic *constitutive* of math. This inverts Brouwer's hierarchy.
      *   *Section 4: The Mechanization of Validity.* Brouwer trusted the mathematician's intuition. Proof assistants trust the kernel. This shifts authority from the mind to the machine/system.
      *   *Conclusion:* Summarize. While HoTT/DTT captures the *structure* of constructive reasoning, it violates the *ontology* of intuitionism.

  7.  **Refining the Argument (Self-Correction during drafting):**
