      *   *Points of Divergence:*
          *   Formalism: Proof assistants are the *ultimate* formalism. Every step must be encoded. Brouwer hated this.
          *   Choice Sequences: Can DTT capture lawless choice sequences? Generally, no. DTT is based on recursive functions/rules. Lawless sequences defy fixed rules.
          *   Language: In DTT, the code *is* the math. For Brouwer, the code is just a shadow of the mental construction.
          *   Trust: In DTT, we trust the kernel. For Brouwer, we trust the individual mathematician's intuition.

  5.  **Formulate the Argument:**
      *   *Thesis:* Brouwer would likely view modern proof assistants as the ultimate triumph of Formalism (which he despised), disguised in intuitionistic clothing. He would see it as a "formalist takeover."
      *   *Supporting Point 1: The Primacy of Language/Syntax.* Proof assistants require math to be linguistic/syntactic to be checked. Brouwer believed math is languageless.
      *   *Supporting Point 2: Choice Sequences vs. Computable Functions.* DTT relies on computable functions (algorithms). Brouwer's continuum relies on free choice sequences (potentially lawless). This is a fundamental incompatibility.
      *   *Supporting Point 3: Logic as Foundation.* Curry-Howard makes logic/type theory the *foundation*. Brouwer believed logic is a *byproduct* of math. Putting the cart before the horse.
      *   *Nuance/Concession:* He might appreciate the constructive aspect (no LEM, explicit witnesses), but he would reject the *mechanization* of validity.

