          *   *Fact Check:* Mill's *Principles* was published in 1848. Was he "openly hostile"? In early editions, he was critical but not necessarily "openly hostile" in the sense of rejecting it outright forever. He distinguished between the laws of production and distribution. He was critical of early socialism (Owen, Fourier) but open to discussion. However, calling private property "basically permanent" in the *first* edition is slightly off. He was already open to the idea that it might not be the final form, though he defended it cautiously. But the bigger issue is the "openly hostile" characterization. He was sympathetic to the *ends* (alleviating poverty) but critical of the *means*.
