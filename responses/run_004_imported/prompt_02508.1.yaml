answer: |-
  # The Weight of Nothing: Why Inaction Can Break an Engine

  The family group chat argument you're stuck in is actually a centuries-old philosophical deadlock, dressed up in automotive tragedy. On one side, you have the intuition that causes must be *things that happen*—forces, impacts, explosions. On the other, you have the intuition that failing to prevent a disaster is morally and practically indistinguishable from causing it.

  Your brother's engine didn't seize because "nothing" pushed it. It seized because heat expanded metal until friction welded the pistons. Physically, that is undeniable. But if your brother had poured in coolant, the heat would have dissipated, and the engine would be running today. So, did the absence of coolant cause the death of the engine?

  To answer this, we have to wade into the metaphysics of "causation by omission." There are two main camps: those who think omissions are genuine causes, and those who think calling them "causes" is just a sloppy way of assigning blame. Let's look at the best version of each argument, solve the puzzle of why your brother is to blame but a random stranger isn't, and then I'll tell you who is actually right.

  ### The Case Against: Causation Requires a Process

  The strongest argument against omissions being "real" causes comes from a view called **Process Theory**. This theory argues that for $A$ to cause $B$, there must be a continuous physical process connecting them. Usually, this involves the transfer of energy or momentum.

  Think of a billiard ball hitting another. The first ball transfers kinetic energy to the second. That is a physical mechanism. Now, look at your brother's car. Where is the energy transfer in "not topping up the coolant"? There isn't one. "Not topping up" is not an event; it is the absence of an event. It is a null set.

  Proponents of this view argue that the engine didn't die because of the *lack* of water; it died because of the *presence* of heat. The heat was the active agent. The coolant was merely a background condition that, had it been present, would have stopped the heat. To say the omission caused the crash is to confuse a cause with a condition.

  This view aligns with hard physics. In the equations of motion, there is no variable for "what the driver forgot to do." There are only variables for mass, velocity, friction, and temperature. If you want to know what physically destroyed the engine, you look at the thermodynamics, not the driver's memory. From this perspective, saying the omission caused the seizure is a metaphor. It's shorthand for "The brother is responsible because he failed to interrupt the physical chain of events that did cause it." It treats causation as a moral spotlight rather than a physical fact.

  ### The Case For: The World Runs on Counterfactuals

  The strongest argument *for* omissions being genuine causes comes from **Counterfactual Theory**. This theory, famously championed by philosopher David Lewis, suggests that causation isn't about energy transfer; it's about dependence. $A$ causes $B$ if, had $A$ not occurred, $B$ would not have occurred.

  Apply this to the car.
  *Fact:* Brother did not top up coolant. Engine seized.
  *Counterfactual:* If Brother *had* topped up coolant, Engine *would not* have seized.

  Because the outcome depends on the action (or inaction), the inaction is a cause. This matches how we navigate the world. If you ask a mechanic, "Why did this seize?" and they say, "Thermal expansion," they are being technically correct but unhelpful. If they say, "Because nobody put coolant in it," they have identified the cause that matters for fixing the problem in the future.

  Furthermore, the "Process Theory" falls apart in modern physics and medicine. In medicine, we say a vitamin deficiency causes scurvy. But a deficiency is an absence. There is no "particle of non-vitamin C" attacking the body. The lack of the vitamin is the direct cause of the collapse. If we deny omissions are causes, we have to say scurvy has no cause, which is absurd.

  Similarly, consider the lifeguard. If the lifeguard sits on the chair and the swimmer drowns, the physical cause of death is water in the lungs. But if we say the lifeguard's inaction wasn't a *cause* of death, we sever the link between agency and outcome. We intuitively understand that the lifeguard's presence creates a specific causal structure where their inaction becomes a lethal force.

  ### The Selection Problem: Why Not Everyone is Guilty

  This brings us to the puzzle that kept you up at night: The Selection Problem. If causation is just about counterfactuals ("If they had acted, it wouldn't have happened"), then *everyone* is a cause.

  If I, sitting in my house right now, had teleported to your brother's car and poured in coolant, the engine wouldn't have seized. If the President had ordered a coolant airlift, the engine wouldn't have seized. If a random pedestrian in Tokyo had wished for the engine to survive, well, maybe that wouldn't have worked, but you see the point. If "not doing X" is a cause, then the entire universe's failure to save the engine is a cause. This dilutes the word "cause" until it means nothing.

  So, how do we separate your brother's omission from the random stranger's omission? Both technically satisfy the "if they acted, it would be fine" test.

  The solution lies in **Normative Expectations**.

  Causation in human contexts is not just about physics; it is about what is *normal* or *expected* in a given system. We distinguish between a "cause" and a "mere condition" based on duties and norms.
  *   **The Brother:** He owns the car. There is a social and functional norm that car owners maintain their vehicles. His omission violates an expectation.
  *   **The Random Stranger:** There is no expectation that a stranger maintains your car. Their omission is a "background condition," not a cause.
  *   **The Lifeguard:** They are employed and trained to save people. Their omission violates a specific professional norm.
  *   **The Nurse:** They have a fiduciary duty to the patient.

  When we say an omission caused an event, we are implicitly referencing a model of how the world *should* work. The engine seizing is a deviation from the norm (engines should run). The brother's inaction is a deviation from the norm (owners should maintain). When two deviations align, we identify a causal link. The stranger's inaction is not a deviation; it is the status quo. Therefore, it is not selected as "the cause."

  This doesn't make the causation "fake." It makes causation **context-sensitive**. Just as "tall" is a real property but depends on a comparison class (tall for a jockey vs. tall for a basketball player), "cause" is a real relation that depends on a normative context.

  ### The Verdict: What Is Actually Going On

  So, here is the commitment you asked for. I believe the "Process Theorists" (who say omissions aren't real causes) are clinging to an outdated, Newtonian view of causation that doesn't fit human reality.

  **Omissions are genuine causes.**

  Here is why. The argument that "nothing happens" during an omission relies on the idea that only positive physical events are real. But absences are real features of the world. A hole in a donut is a real geometric feature, even if it's made of "no donut." Silence is a real acoustic feature, even if it's "no sound."

  More importantly, causation is not a brute physical force like gravity; it is an **explanatory relationship**. When we ask "What caused this?", we are asking "What makes sense of this outcome?"

  If you deny that omissions are causes, you break our ability to explain almost everything in biology, engineering, and sociology.
  *   Why did the plant die? (Lack of water).
  *   Why did the bridge collapse? (Lack of maintenance).
  *   Why did the economy crash? (Lack of regulation).

  In every single one of these cases, the "cause" is an absence. If you insist these aren't real causes, you are forced to say these events are uncaused mysteries, or you have to hunt down some obscure positive physical event (like "molecular friction") that explains nothing about how to prevent it next time.

  Therefore, your brother's inaction **did** cause the engine to die. It was not merely a reason to blame him; it was the structural gap in reality that allowed the heat to destroy the metal.

  However, the "Selection Problem" proves that causation is not *only* physical. It is also normative. The reason the random stranger didn't cause the engine death isn't because physics distinguishes between them; it's because **causation itself includes expectations.**

  To say "X caused Y" is to say "X was the abnormal factor that led to Y." Since the brother's neglect was abnormal (violating the norm of ownership) and the stranger's neglect was normal (no duty to act), the brother's omission is the cause, and the stranger's is not.

  **The Bottom Line:**
  Your family chat is arguing over whether causation is a physical push or an explanatory story. It is both. The engine died due to physical heat (the mechanism), but it died *because* your brother didn't add coolant (the cause). To deny the omission is the cause is to pretend that human agency and maintenance don't play a role in the physical world. They do.

  Tell your brother he broke the engine. Not because he pushed a button that said "explode," but because he removed the one thing standing between the car and entropy. In a universe trending toward disorder, failing to maintain order is the most potent cause of all.
