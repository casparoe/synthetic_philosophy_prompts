  **What Both Are Missing: The Decision-Theoretic Framework**

  While Nadia wins the exchange on technical grounds, both are missing a deeper clarification regarding **what utility function credence is supposed to maximize**.

  The disagreement isn't actually about probability theory; it's about **decision theory in self-locating contexts**.
  *   **Theo** implicitly assumes **Centered Utility**: Beauty should maximize expected utility for her current conscious moment (awakening). If she does this, she *must* bet at 1/3 odds, regardless of what she calls her "credence."
  *   **Nadia** implicitly assumes **Global Utility**: Beauty should maximize expected utility for the whole person across the entire experiment. If she does this, she *must* bet at 1/2 odds.

  The "missing piece" is that **credence does not map to betting odds without a specified scoring rule.** In standard epistemology, we assume a bet is paid once per proposition. In Sleeping Beauty, the "bet" is ambiguous: is it a bet on the coin (paid once) or a bet on the experience (paid per awakening)?

  Both are treating "Credence" as a singular thing that *should* dictate betting odds directly. The more sophisticated view (often found in the "Halfer/Thirder reconciliation" literature) is that Beauty's credence might be 1/2 (about the coin), but her **decision weight** is 1/3 (about the awakening) because the tails-world has double the decision-nodes. They are arguing past each other because Theo is talking about *decision weights* while calling it credence, and Nadia is talking about *objective chance* while calling it credence. Neither explicitly separates the *degree of belief* from the *stakes of the decision*.
