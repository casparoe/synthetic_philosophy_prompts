answer: |-
  First, take a deep breath. You are not unhinged. You are a philosophy PhD student who has encountered a genuine normative puzzle in the wild, and your brain is doing exactly what it was trained to do: look for the underlying structure of the interaction.

  The department lunch was half-right: It is just dinner. But they were half-wrong: There *is* a principled distinction between the two cases you outlined, and your intuition that something specific went wrong in the *manner* of the cancellation is philosophically defensible.

  Here is the outside perspective you asked for, broken down by the philosophical machinery at play, followed by the reality check you probably need.

  ### 1. The Philosophical Case: Joint Commitment Theory
  You hit the nail on the head with your distinction between (a) changing one's own plans and (b) dissolving a joint arrangement. The philosopher you want to read (or revisit) here is **Margaret Gilbert**, specifically her work on **Joint Commitment** (*On Social Facts*, 1989).

  Gilbert argues that when two people form a joint commitment (like "we will cook together every Sunday"), they become a "plural subject." This creates a specific normative landscape:
  *   **Individual Intention:** "I intend to cook." (I can change this whenever I want).
  *   **Joint Commitment:** "We intend to cook." (This creates obligations *to each other*).

  According to Gilbert, you cannot unilaterally withdraw from a joint commitment without violating the normativity of the agreement. You can *break* it, but you can't *end* it on your own authority. To properly end a joint commitment, you generally need the concurrence of the other party, or at least a process of negotiation that acknowledges the jointness.

  **Your grievance:** When your housemate texted, "I don't think I want to keep doing Sunday dinners... you don't have to either," she performed two speech acts:
  1.  **Withdrawal:** "I am opting out." (Permissible, though it breaks the commitment).
  2.  **Dissolution:** "The Sunday Dinner entity is now closed." (Not her sole authority to decide).

  By saying "you don't have to either," she assumed the authority to speak for the Plural Subject. She treated the "We" as if it were an extension of her "I." Your annoyance stems from the fact that she treated a *joint* asset (the tradition) as her *private* property to dispose of. That is a violation of your agency within the partnership.

  ### 2. The Speech Act Problem
  From a Philosophy of Language perspective (Austin/Searle), her text had an **illocutionary force** that she lacked the **felicity conditions** to enact.

  *   **Constative:** "I am not coming to dinner." (True/False).
  *   **Performative:** "I am ending our Sunday dinner arrangement." (Valid/Invalid).

  For a performative to be valid, the speaker usually needs the appropriate authority. A judge can sentence a criminal; a criminal cannot sentence the judge. In a casual friendship, authority is shared. By declaring the arrangement over *for you* ("you don't have to either"), she attempted to exercise unilateral authority over a shared domain.

  You felt wronged because she tried to fire you from a job you both owned.

  ### 3. The Pragmatic Counterweight (The "Grad Student Brain" Check)
  So, philosophically, you are right. There is a category error in her text. However, here is where you need to apply the "proportion" filter you mentioned.

  **A. The Cost of Enforcement**
  In high-stakes joint commitments (marriage, business partnerships, co-authoring a paper), we insist on the Gilbertian standard of mutual concurrence for dissolution. In low-stakes commitments (casual dinner, gym buddies), the social cost of demanding mutual concurrence often outweighs the benefit.
  If you insist on the philosophical principle, you risk turning a casual friendship into a bureaucratic negotiation. Sometimes, allowing the other person the "grace of unilateral exit" is the price of maintaining a low-pressure dynamic.

  **B. Charitable Interpretation**
  Is it possible she wasn't making a metaphysical claim about the nature of your agreement, but rather trying to be nice?
  *   **Uncharitable reading:** "I am ending this for both of us."
  *   **Charitable reading:** "I am opting out, and I want to make sure you don't feel obligated to keep cooking alone just because I quit."

  "You don't have to either" is often shorthand for "I release you from the obligation I know you might feel toward *me*," not "I forbid you from cooking on Sundays." She may have been trying to alleviate your guilt, not strip your agency.

  **C. The Medium**
  She did this over text, an hour before dinner. This suggests avoidance, not a calculated power grab. She likely felt guilty about bailing and wanted to rip the band-aid off quickly. The clumsiness of the message is likely social anxiety, not a philosophical assertion of sovereignty.

  ### 4. Why It Actually Hurts
  You aren't angry about the dinner. You are angry because the *manner* of the cancellation signaled a devaluation of the "We."

  *   **The Signal:** Unilateral dissolution implies the arrangement mattered more to you than to her. If it was truly a "We" thing, the end of it should be a "We" conversation.
  *   **The Fear:** It suggests that for her, the commitment was conditional on her immediate whim, whereas for you, it was a standing obligation. That asymmetry is painful. It makes you feel like you were investing in a relationship that she viewed as a convenience.

  ### The Verdict
  **Is there a principled distinction?**
  **Yes.** Withdrawing participation is an individual right; dissolving a joint commitment is a collective action. She conflated the two.

  **Does this justify feeling wronged?**
  **Yes.** You were denied a voice in the end of a shared project. That is a minor but real relational slight.

  **Should you treat it as a major breach?**
  **No.** This is the "occupational hazard" part. You have correctly identified the normative violation, but you must weigh it against the context of casual cohabitation.

  **Recommendation:**
  Don't argue the philosophy with her. She isn't operating in Gilbertian space; she's operating in "I'm tired and feel guilty" space. If you bring up the "unilateral dissolution of joint commitment" angle, you will confirm her suspicion that this arrangement was too much pressure.

  Instead, if you value the housemate relationship, accept the dissolution but clarify the agency.
  *   *"Hey, I was bummed about Sunday dinner stopping, mostly because I enjoyed our time. I get that you need to do your own thing, but just for clarity, I might still cook on Sundays for myself sometimes. No pressure to join, but I didn't want the tradition to die completely on my end."*

  This reclaims your agency (you decide what you do) without demanding a negotiation over the ended partnership. It acknowledges the distinction you care about without making it a conflict.

  You haven't lost your mind. You've just spotted a glitch in the social matrix. Now you have to decide if fixing the glitch is worth crashing the simulation. In this case, it's probably not.
