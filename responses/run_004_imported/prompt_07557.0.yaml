      *   Concrete objections? Yes (Skepticism, Dogmatism, Nature of Doubt).
      *   Verdict on verbal/substantive? Yes (Included in the conclusion).

  **(Self-Correction Note):** Make sure Marcus doesn't just say "it's behavior." Moyal-Sharrock argues they are *propositional in form* but *functional as rules*. I need to be precise there. She calls them "propositional hinges" sometimes but denies they function as propositions. Actually, her stronger view is they are non-propositional. I will stick to the "enacted/rule" interpretation for clarity.

  Let's write.

  *   **Characters:**
