answer: |-
  This is a sharp diagnosis of the central tension in Risk-Weighted Expected Utility (REU) theory. You are correct that the dynamic inconsistency of REU is not a bug that can be easily patched, but a feature of violating the Independence Axiom. Buchak's response is indeed to restrict the domain of rational evaluation to global plans, effectively advocating for **resolute choice**.

  Below is a fully worked numerical example demonstrating this dynamic inconsistency, followed by an assessment of Buchak's defensive maneuver.

  ### The Sequential Choice Problem

  **Parameters:**
  *   **Utility Function:** $u(x) = x$ (linear, to isolate the risk function's effect).
  *   **Risk Function:** $r(p) = p^2$ (strictly convex, representing global risk-avoidance).
  *   **REU Formula:** For outcomes $x_1 < x_2 < \dots < x_n$,
      $$REU = u(x_1) + \sum_{i=2}^n [u(x_i) - u(x_{i-1})] \cdot r(P(X \ge x_i))$$

  **The Decision Tree:**
  *   **Node 1 (Decision):** Choose **Stop** or **Continue**.
      *   **Stop:** Receive **\$14** for sure.
      *   **Continue:** Proceed to a Chance Node.
  *   **Chance Node:**
      *   50% Probability: Receive **\$25** (Branch Y).
      *   50% Probability: Proceed to **Node 2**.
  *   **Node 2 (Decision):** Choose **Sure** or **Risk**.
      *   **Sure:** Receive **\$10** for sure.
      *   **Risk:** 50% Chance of **\$30**, 50% Chance of **\$0**.

  ---

  ### Part 1: Local Evaluation (At Node 2)

  Suppose the agent has chosen **Continue** and the chance node has directed them to **Node 2**. The agent now evaluates the remaining sub-gamble in isolation. The prior 50% chance of \$25 is sunk/irrelevant for the local calculation; only the outcomes available *from this point forward* matter.

  **Option A: Sure**
  *   Outcome: \$10 with probability 1.
  *   $REU_{local}(\text{Sure}) = 10$.

  **Option B: Risk**
  *   Outcomes: \$0 (50%), \$30 (50%).
  *   Ordered: $x_1 = 0, x_2 = 30$.
  *   $P(X \ge 0) = 1$.
  *   $P(X \ge 30) = 0.5$.
  *   Calculation:
      $$REU_{local}(\text{Risk}) = u(0) + [u(30) - u(0)] \cdot r(0.5)$$
      $$REU_{local}(\text{Risk}) = 0 + 30 \cdot (0.5)^2 = 30 \cdot 0.25 = 7.5$$

  **Local Preference:**
  $$10 > 7.5 \implies \textbf{Sure} \succ \textbf{Risk}$$
  *At Node 2, the REU maximizer prefers the Sure thing.*

  ---

  ### Part 2: Global Evaluation (At Node 1)

  Now we step back to Node 1. The agent evaluates the entire tree as a single global gamble. The agent must compare three distinct strategies:
  1.  **Stop**
  2.  **Continue + Plan Sure**
  3.  **Continue + Plan Risk**

  **Strategy 1: Stop**
  *   Outcome: \$14 with probability 1.
  *   $REU_{global}(\text{Stop}) = 14$.

  **Strategy 2: Continue + Plan Sure**
  *   Outcomes:
      *   \$25 (50% from Chance Node Branch Y).
      *   \$10 (50% from Node 2 Sure).
  *   Ordered: $x_1 = 10, x_2 = 25$.
  *   $P(X \ge 10) = 1$.
  *   $P(X \ge 25) = 0.5$.
  *   Calculation:
      $$REU_{global}(\text{Cont+Sure}) = 10 + [25 - 10] \cdot r(0.5)$$
      $$REU_{global}(\text{Cont+Sure}) = 10 + 15 \cdot 0.25 = 10 + 3.75 = 13.75$$

  **Strategy 3: Continue + Plan Risk**
  *   Outcomes:
      *   \$30 (25% total: 50% Chance $\times$ 50% Risk Win).
      *   \$25 (50% total: 50% Chance Branch Y).
      *   \$0 (25% total: 50% Chance $\times$ 50% Risk Loss).
  *   Ordered: $x_1 = 0, x_2 = 25, x_3 = 30$.
  *   Decumulative Probabilities:
      *   $P(X \ge 0) = 1$.
      *   $P(X \ge 25) = 0.5 (\text{for } 25) + 0.25 (\text{for } 30) = 0.75$.
      *   $P(X \ge 30) = 0.25$.
  *   Calculation:
      $$REU_{global}(\text{Cont+Risk}) = u(0) + [u(25) - u(0)] \cdot r(0.75) + [u(30) - u(25)] \cdot r(0.25)$$
      $$REU_{global}(\text{Cont+Risk}) = 0 + 25 \cdot (0.75)^2 + 5 \cdot (0.25)^2$$
      $$REU_{global}(\text{Cont+Risk}) = 25 \cdot 0.5625 + 5 \cdot 0.0625$$
      $$REU_{global}(\text{Cont+Risk}) = 14.0625 + 0.3125 = 14.375$$

  **Global Preference:**
  Comparing the three strategies:
  *   Stop: 14.00
  *   Continue + Sure: 13.75
  *   **Continue + Risk: 14.375**

  $$14.375 > 14.00 > 13.75 \implies \textbf{Continue + Risk} \succ \textbf{Stop} \succ \textbf{Continue + Sure}$$

  *At Node 1, the REU maximizer's optimal plan is to Continue and choose Risk at Node 2.*

  ---

  ### The Conflict and the Sacrificed Condition

  We have established a direct contradiction between the ex-ante plan and the ex-post action:
  1.  **Ex-Ante (Node 1):** The rational plan is to choose **Risk** at Node 2.
  2.  **Ex-Post (Node 2):** The rational action is to choose **Sure**.

  This violates **Dynamic Consistency**. Specifically, it violates the principle of **Consequentialism** (or **Separability**), which holds that the rational choice at a decision node should depend only on the future consequences available from that node, not on how the node was reached or what was planned previously.

  In standard Expected Utility Theory (EUT), the Independence Axiom guarantees that preferences over sub-gambles remain stable regardless of the surrounding context. REU violates Independence by design (to accommodate Allais preferences), and this numerical example shows that violating Independence inevitably leads to dynamic inconsistency in sequential settings. The "weight" assigned to the \$30 outcome changes from $r(0.5)=0.25$ locally to $r(0.25)=0.0625$ globally, but the presence of the intermediate \$25 outcome in the global view shifts the decumulative probability of the \$25 outcome itself, altering the marginal weight of the \$30 outcome in a way that reverses the preference.

  ### Assessment of Buchak's "Global Gamble" Restriction

  You asked whether Buchak's restriction of REU to one-off global gambles is a principled solution or merely a relocation of the problem.

  **It is a principled relocation.**

  Buchak does not deny the inconsistency. Instead, she argues that **Dynamic Consistency is not a requirement of rationality** for agents with global risk attitudes. Her argument rests on the claim that risk attitude is a distinct normative primitive. If an agent's fundamental preference is to evaluate gambles *globally* (weighing the risk of the entire portfolio), then updating locally is actually the irrational act, because it ignores the global risk structure that defines the agent's values.

  To make this work, Buchak endorses **Resolute Choice**. The agent must commit to the ex-ante optimal plan (Continue + Risk) and force themselves to execute it at Node 2, even though their local REU calculation at that moment recommends Sure.

  **The Cost of this Move:**
  1.  **Volitional Burden:** It shifts the burden of rationality from *coherence of preferences* to *strength of will*. A rational REU agent must be able to act against their current local preferences. This makes rationality psychologically more demanding than in EUT.
  2.  **Loss of Consequentialism:** It abandons the idea that rational choices should be justifiable solely by their consequences from the current moment forward. The justification for choosing Risk at Node 2 relies on the history of the choice (that it was part of a global plan), not the local outcomes.
  3.  **Vulnerability to Exploitation:** While Buchak argues resolute agents cannot be money-pumped, they are vulnerable to "threats" that exploit their commitment. If an adversary knows the agent is resolute, they can structure offers that lock the agent into a globally optimal plan that is locally painful, knowing the agent won't deviate.

  **Conclusion:**
  Buchak's move is **principled** in the sense that it is internally consistent with her definition of rationality (faithfulness to one's global risk attitude). However, it **relocates the problem** from the mathematical structure of the theory to the psychology of the agent. It saves REU from incoherence only by requiring agents to ignore their own local evaluations. For a theorist who views rationality as primarily about internal coherence of preference (the LessWrong/VNM orthodoxy), this is a high price to pay. For a theorist who views rationality as fidelity to a broader set of values (including risk attitudes), it is a necessary feature.

  The example above demonstrates that you cannot have it both ways: you cannot have REU's explanation of the Allais paradox *and* the dynamic consistency of Expected Utility. Buchak chooses the former; the orthodoxy chooses the latter.
