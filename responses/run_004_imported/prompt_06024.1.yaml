answer: |-
  **Setting:** *A noisy coffee shop near the convention center. Two philosophers, ELENA and MARCUS, are finishing up a conference panel on Moral Responsibility.*

  **MARCUS:** So, you're sticking with it. The hypocrite loses the *right* to speak.

  **ELENA:** Not the right to speak, Marcus. The standing to blame. There's a difference. I can say, "Don't steal," while picking your pocket. The proposition is true. But the *act* of blaming you? That's infelicitous. It's misfired.

  **MARCUS:** It's *tu quoque* with a thesaurus. Look, if I'm a serial liar and I catch you lying, my saying "You lied" is factually accurate. Why does my moral resume matter to the truth of your violation?

  **ELENA:** Because blame isn't a verdict from a judge; it's a demand from a peer. It's relational. When I blame you, I'm implicitly saying, "We both subscribe to this norm, and you've breached our agreement." If I'm actively breaching it too, I'm not speaking as a peer. I'm speaking as a superior. And you didn't grant me that authority.

  **MARCUS:** But that intuition—"Who are *you* to talk?"—that's just defensive deflection. It's a weaponized distraction. If we accept your view, we empower the worst actors. Imagine a corrupt regime. Everyone is taking bribes. Official A catches Official B taking a bribe. On your view, A has no standing to blame B. So B gets off scot-free morally, just because A is also rotten.

  **ELENA:** I don't think B gets off scot-free. The act is still wrong. The *blame* is just blocked. And honestly? Maybe that's a feature, not a bug. If A blames B while doing the same thing, it's not moral accountability. It's power play. It's purging a rival. Denying standing stops morality from being used as a cudgel by the corrupt.

  **MARCUS:** But it creates a silence zone. If standing requires clean hands, and we're all morally messy, then blame evaporates. We lose the primary tool we have for social regulation.

  **ELENA:** Standing doesn't require clean hands. It requires *commitment*. If I steal but I acknowledge I'm wrong, I retain standing. Hypocrisy is when I blame you *while denying my own fault*. It's the pretense of superiority that kills the standing, not the sin itself.

  **MARCUS:** Okay, I'll grant that distinction. But let's look at the victim. I'm the one you lied to. I'm angry. I want to blame you. But I've lied to you before, last year. On your view, do I lose the standing to hold you accountable for *this* lie because of *that* lie?

  **ELENA:** Potentially, yes. If the lies are relevantly similar.

  **MARCUS:** That's where the intuition breaks for me. It feels like I'm being disarmed. You're telling the victim of a wrong that their moral outrage is illegitimate because they aren't a saint. That validates the wrongdoer's deflection. "Oh, you're mad I cheated? Well, you sped last week." It turns morality into a ledger where only the surplus holders get to speak.

  **ELENA:** I'm not saying you can't be angry. I'm saying the *communicative act* of blame won't land. It won't do the work. When you blame me, you want me to feel the force of the norm. If I know you disregard that norm, I don't feel the norm's force. I just feel your aggression. The hypocrisy severs the connection between the blame and the value.

  **MARCUS:** See, I think you're conflating *effectiveness* with *legitimacy*. Sure, a hypocrite is annoying. Sure, their blame is less likely to be heard. But that's a pragmatic failure, not a moral one.
  Here's the move you're missing: The "Who are you to talk?" intuition isn't about standing. It's about *sincerity*. When I say "You shouldn't do that," I'm expressing a commitment. If I'm hypocritical, I'm lying about my commitment. So the target feels manipulated. But the *blame* itself? The claim that "You did wrong"? That remains apt.

  **ELENA:** But blame *is* the expression of commitment. It's not just a claim about the past; it's a demand for the future. If I don't intend to follow that demand myself, I'm not actually issuing it. I'm performing it. It's theater.

  **MARCUS:** Let's push the corrupt group worry again. A gang of thieves. Thief One steals from Thief Two. Thief Two blames Thief One. You say Thief Two lacks standing because they're both thieves. But Thief Two is appealing to a norm *within the gang*. "We don't steal from *each other*."

  **ELENA:** Then they aren't hypocrites regarding *that* norm. If the norm is "No stealing from outsiders," and they both steal from outsiders, they have standing to blame each other for stealing from outsiders. Hypocrisy is norm-specific.

  **MARCUS:** Okay, broaden it. Universal norms. Human rights. A country with a horrific rights record condemns another country for the same record. You'd say they lack standing.

  **ELENA:** I would.

  **MARCUS:** And that lets the second country ignore the criticism entirely. They can say, "Your condemnation is null." It insulates them from external pressure. In the real world, where saints are rare, your view protects the guilty by silencing the imperfect accuser.

  **ELENA:** It doesn't silence them. It forces them to change the *mode* of address. Instead of "How dare you," it becomes "We need to stop doing this." It shifts from accusation to collective responsibility. That's harder, but it's more honest. The "standing" view forces the blamer to implicate themselves. It stops moral grandstanding.

  **MARCUS:** But sometimes we *need* grandstanding. Sometimes we need a spotlight, even if the light is held by a shaky hand. If I see you assaulting someone, I'm going to blame you. Even if I assaulted someone last year. To say I lack the standing... it feels like I'm being told my intervention is morally equivalent to the assault.

  **ELENA:** No. The assault is the wrong. Your blame is... let's call it *compromised*. It's tainted. The target can rightly say, "Fix your own house before you police mine." And if you can't say, "You're right, I'm working on it," then you have no business demanding they change.

  **MARCUS:** So it comes down to acknowledgment.

  **ELENA:** It comes down to equality. Blame presupposes we are in this together. Hypocrisy says, "I am above this." That's why it forfeits standing.

  **MARCUS:** I think you're putting too much weight on the relationship and not enough on the wrong. The victim deserves to name the harm, regardless of their own history. To deny that is to make morality too exclusive.

  **ELENA:** And to allow it is to make morality too weaponized.

  **MARCUS:** *(Sips cold coffee)* So we're stuck. You want to protect the integrity of the moral conversation. I want to make sure the wrong gets named, even if the messenger is messy.

  **ELENA:** Basically. You think hypocrisy makes the message annoying. I think it makes the message void.

  **MARCUS:** I think the internet proves you wrong. People scream past each other's hypocrisy every day, and the blame still sticks.

  **ELENA:** The internet proves we've forgotten how to listen. Just because the arrow hits the target doesn't mean it was shot from a valid position.

  **MARCUS:** Or it means "valid position" is a myth we tell ourselves to feel better about ignoring our enemies.

  **ELENA:** *(Smiles)* Maybe. But until you can explain why "look who's talking" feels like a knockout punch in every dinner argument in America, I'm keeping the standing.

  **MARCUS:** And until you can explain how a room full of sinners holds anyone accountable without strangling in their own silence, I'm keeping the truth of the blame.

  **ELENA:** Coffee?

  **MARCUS:** Yeah. I'll pay.

  **ELENA:** Don't worry, I won't blame you if you forget your wallet. I lost that right years ago.

  **MARCUS:** Ha. Very funny.
