          *   *Assessment:* This is accurate. Fuller argued in "Positivism and Fidelity to Law" that the Nazi system was so devoid of the inner morality of law (specifically regarding secret statutes and arbitrary enforcement) that it wasn't a legal system. Therefore, the informer can be punished under pre-existing principles without needing retroactive legislation.
