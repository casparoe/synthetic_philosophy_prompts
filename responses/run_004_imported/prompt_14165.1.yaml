  ### Tips for handing this back:
  If your classmate pushes back, your strongest argument is on **Part 4**. You can point out that Hart explicitly calls his minimum content a "natural necessity" based on human biology and survival (we don't kill because we are vulnerable), whereas Fuller calls his inner morality a "morality of aspiration" regarding the *craft* of law-making. If they were the same, Hart wouldn't have written *The Concept of Law* to argue against Fuller!
