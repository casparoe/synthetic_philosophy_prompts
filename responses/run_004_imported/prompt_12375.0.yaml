answer: |-
  Good morning. Thank you all for being here to remember my uncle.

  Seventy-eight years is a good run. It's enough time to make mistakes, to correct them, to build a life, and to leave a mark. But when we talk about the mark my uncle left, it is hard to know exactly where to look for it. He didn't build a skyscraper. He didn't write a book. He didn't seek a spotlight. In fact, if he were here right now, listening to me talk about him, he would be shifting in his seat, looking for the exit, waiting for me to stop making a fuss.

  For more than twenty years, my uncle and my aunt answered a phone that rang at all hours. Usually late, usually urgent. They were the emergency placement for medically fragile newborns. These were babies the system had no soft place for, children who needed immediate, specialized care, often within the hour. My uncle and aunt would say yes. They would wake up, drive to the hospital, and bring these tiny, struggling lives into their home. Sometimes the babies stayed for years. Sometimes, they stayed for a night or two, until a longer-term solution was found.

  It was unpaid. It was exhausting. It was emotionally demanding in a way most of us can hardly imagine.

  And whenever anyone thanked him, whenever anyone called him a hero or a saint, my uncle had a standing rule. He would look you in the eye, sincerely, and say: "Anyone in my position would have done the same."

  We are here to honor him, and part of honoring him is telling the truth. So, I need to say this gently, but I need to say it: That wasn't true.

  Not everyone would have done the same. Most people, in his position, would have found a reason to say no. Most people would have said they were too old, or too tired, or that it was too hard, or that it wasn't their responsibility. What my uncle did was genuinely rare. It was exceptional. And by insisting it was ordinary, he wasn't lying to us; he was revealing something about himself. He believed that love shouldn't be transactional. He believed that care shouldn't come with a price tag or a applause track. He wanted the focus to remain on the children, not on the hands that held them.

  To the two young men and women sitting here today, who were once those newborns: I see you. I know you feel a debt to him. I know you look at him and see the reason you are breathing. But I need you to hear this, because he would want me to say it: You do not owe him.

  He didn't keep a ledger. He didn't invest in you expecting a return. He held you when the world was loud and scary because he believed you were worth holding. The greatest tribute you can pay him is not to spend your lives trying to repay a debt, but to live the lives he protected. Be well. Be happy. Be kind. That is the only receipt he ever wanted.

  And to my siblings, and to my cousins, and to the rest of the family who are sitting here thinking, "I haven't done enough. I haven't saved lives. I've just lived my ordinary life."

  Please, do not measure your worth against his specific calling. That is not what he would want. My uncle didn't think he was special. He just thought he was available. He believed that when there was a need in front of you, you met it.

  For him, the need was a fragile baby in the middle of the night. For you, the need might be a friend going through a divorce. It might be a neighbor who needs a ride to the doctor. It might be showing up for your own children, day after day, even when you are tired.

  He didn't ask us to be foster parents. He asked us, by example, to be people who don't look away when things are difficult. He taught us that "ordinary" love isn't ordinary at all if it's consistent. If it's willing to be interrupted. If it says "I am here" when it would be easier to say "I am busy."

  We cannot replicate his work. We cannot fill the specific hole he left in this community. But we can replicate his posture toward the world. We can be the people who pick up the phone. We can be the people who open the door.

  He is gone now. The phone in that house will not ring for him again. The nights will be quiet. But the noise he made—the quiet, steady noise of compassion—that is still echoing. It is echoing in the lungs of the children he breathed for. It is echoing in this room, in all of us who loved him, and who are trying, in our own ways, to be a little more like him.

  He said anyone would have done the same. We know better. But because he did it, we know it's possible. And that makes all the difference.

  Rest now, Uncle. We'll take it from here.
