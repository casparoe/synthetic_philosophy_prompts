      *   *The Solution:* Frame his actions not as "heroism" (which implies a pedestal) but as "availability" and "love in action." Focus on the *choice* to be available, which is something everyone can aspire to in their own way, rather than the specific act which few could do. Acknowledge the debt the grown babies feel, but reframe it as a gift he was happy to give, not a burden they carry.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, set the scene. Mention the Aunt (partners in this).
