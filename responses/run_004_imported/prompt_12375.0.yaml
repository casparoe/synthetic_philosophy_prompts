      *   *Check:* Did I shame the family? *Correction:* Explicitly state that we don't need to save newborns to honor him. We just need to be present.
      *   *Check:* Did I respect his humility? *Correction:* Acknowledge that he would be uncomfortable with this speech, and that's okay. We love him enough to tell the truth even if he'd disagree.

  5.  **Key Phrases/Concepts to Include:**
