answer: |-
  **MEMORANDUM**

  **TO:** Genomics Ethics Advisory Committee
  **FROM:** Patient Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Opt-Out Policy for Untreatable Secondary Findings

  **Recommendation**
  I recommend the Committee **retain the current opt-out provision** for secondary findings related to serious, untreatable conditions (e.g., Huntington's disease, early-onset Alzheimer's). We should not mandate disclosure of these specific findings.

  **Implementation Timeline**
  *   **November – December 2023:** Revise consent form language to clarify the distinction between "actionable" and "non-actionable" secondary findings.
  *   **January 2024:** Update genetic counseling scripts to ensure patients understand the implications of opting out without steering them toward a specific choice.
  *   **March 2024:** Full rollout of updated consent forms for all Whole Genome Sequencing (WGS) protocols.

  **Rationale: Engaging Good's Theorem**
  The proposal to eliminate the opt-out relies on I.J. Good's 1967 theorem, which posits that for a rational agent, cost-free information always has non-negative expected utility. The argument is that since the sequencing is already performed, the data is "free," and a rational patient can simply ignore it if they choose. Therefore, withholding it is paternalistic.

  While mathematically sound within decision theory, this argument fails to map onto the clinical and ethical reality of genomic medicine for three specific reasons:

  1.  **Violation of the "Cost-Free" Axiom:** Good's Theorem assumes the *acquisition and processing* of information carries no cost. In genomics, this is false. Receiving a diagnosis for an untreatable neurodegenerative condition carries significant psychological, social, and economic costs (e.g., life insurance discrimination, which GINA does not cover; family strain; anticipatory grief). These are direct costs incurred solely by the *possession* of the information, not by any action taken thereafter.
  2.  **Utility of Belief vs. Utility of Outcome:** The theorem assumes utility is derived only from *outcomes* (states of the world we act upon). However, human utility is also derived from *belief states*. Many patients derive positive utility from uncertainty (hope) and negative utility from certainty regarding untreatable decline. If the knowledge itself degrades quality of life without offering a mitigating action, the net utility of the information is negative. A "rational" agent maximizing their well-being would pay to avoid this information; thus, forcing it upon them reduces their welfare.
  3.  **Autonomy as Negative Liberty:** Autonomy is not merely the capacity to make decisions (positive liberty); it is also the right to define the boundaries of one's own knowledge (negative liberty). The "Right Not to Know" is enshrined in the UNESCO Universal Declaration on the Human Genome and Human Rights. Mandating disclosure treats the patient as a vessel for data rather than a moral agent entitled to curate their own narrative.

  **Conclusion**
  Dr. [Physician's Name]'s application of Good's Theorem is logically valid only if we redefine patients as purely instrumental decision-makers devoid of psychological response to knowledge. Since our duty of care encompasses the patient's psychological and social well-being, the premises of the theorem do not hold. Retaining the opt-out respects the patient's right to weigh the "cost" of knowledge against its "benefit," which is the very definition of informed consent.

  **Next Steps**
  I request we schedule a working session in November to finalize the updated consent language.
