      *   *Thesis:* Nietzsche is wrong about Eliot because he assumes her "Duty" is a theological leftover. In reality, Eliot reconstructs duty on a *sociological and psychological* basis (interdependence/sympathy) derived from Feuerbach, making it self-sustaining without theology.

