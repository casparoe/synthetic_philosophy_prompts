answer: |-
  Short answer: **He is rationalizing.**

  While there is a technical difference between a meeting start time and a project deadline, his argument is a classic deflection tactic used to preserve authority while avoiding accountability.

  Here is the breakdown of why his distinction doesn't actually let him off the hook, and why this is damaging to the team.

  ### 1. The "Grain of Truth" (His Argument)
  To play devil's advocate for a moment, your manager is relying on a difference in **consequence**.
  *   **Deliverables:** Often have hard dependencies. If you are late, a client might be angry, a deployment might fail, or another team member is blocked from working. The cost is tangible.
  *   **Meetings:** If a meeting starts 15 minutes late, the meeting usually still happens. The work doesn't stop. The cost is annoyance and wasted time, but rarely catastrophic.

  In his mind, he is categorizing "operational failure" (the deadline) vs. "etiquette lapse" (the meeting). He believes the former warrants a lecture and the latter warrants a shrug.

  ### 2. The "Big Lie" (Why He's Wrong)
  The issue isn't the *category* of the lateness; it's the **principle of respect** and **leadership credibility**.

  *   **Chronic vs. One-off:** You mentioned he is late *almost every week*. Your teammate was late *for the first time ever*. By lecturing her on "respecting the team's time," he is ignoring the fact that he chronically disrespects the team's time by making them wait in a virtual lobby or conference room every single week.
  *   **Culture Flows Down:** A manager sets the cultural norm. If the leader treats time as flexible for themselves but rigid for others, it creates a caste system. It signals: *"My time is more valuable than yours."*
  *   **The Hypocrisy Tax:** When a leader holds themselves to a lower standard than their reports, they lose "moral authority." The next time he pushes for a hard deadline, the team will resent it because they know he doesn't adhere to similar constraints regarding their time.

  ### 3. Is he rationalizing?
  **Yes.** This is a text-book example of **cognitive dissonance**.
  He likely sees himself as a "busy, important person" whose time is stretched thin (justifying his lateness), while viewing your teammate's lateness as a "lack of discipline" or "priority issue."

  By drawing a hard line between "meeting time" and "deadline time," he creates a logical loophole that allows him to be late without feeling like a hypocrite. It protects his ego, but it erodes trust.

  ### 4. Why this is dangerous for the team
  *   **Resentment:** Your teammate was right to call it out (even if privately). When people feel rules are applied unevenly, engagement drops.
  *   **Normalization of Lateness:** If the boss is late, eventually the team will start being late to his meetings, or late on deadlines, reasoning that "time isn't that strict here."
  *   **Psychological Safety:** If a high-performer (first time late ever) gets lectured while the manager breaks rules daily, people will stop taking risks or admitting mistakes.

  ### What can you do?
  You probably can't fix his behavior directly, but you can protect your own sanity and professional standing:

  1.  **Don't Wait:** If the meeting is scheduled for 10:00, join at 10:00. If he isn't there, use the time to check email, slack, or decompress. Do not sit there staring at a blank screen feeling disrespected. Reclaim that time.
  2.  **Protect Your Deadlines:** Continue to be meticulous about your own deliverables. Do not let his behavior give you an excuse to slip, because he will likely still hold you to the "hard deadline" standard.
  3.  **The "Start Without Him" Strategy:** If the team is bold, you can agree that if he isn't there in 5 minutes, the team starts discussing agenda items informally. When he arrives, you say, "We didn't want to waste the hour, so we started catching up on X." This subtly signals that the team's time is valuable.
  4.  **Feedback Channels:** If your company does 360-degree reviews or anonymous engagement surveys, this is exactly the kind of constructive feedback that belongs there. *"Leadership should model the time-management standards expected of the team."*

  **Verdict:** He isn't off the hook. He's using a technicality to excuse a behavioral flaw. It's bad management, and your teammate's frustration is completely valid.
