prompt: |-
  Random work thing that's been bugging me. My manager is late to almost every meeting he runs, like 10-15 min, every week, and everyone just shrugs it off at this point. Last week he pulled a teammate aside because she turned in a deliverable 20 min past the deadline (first time that's ever happened with her) and lectured her about respecting the team's time. She said he's got some nerve given how late he always runs things, and he shot back that missing a meeting start time isnt really the same category of thing as missing an actual deadline. Does that distinction actually let him off the hook, or is he just rationalizing so he doesnt have to hold himself to the standard he's holding her to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Situation:** The user's manager is consistently late (10-15 mins) to meetings he runs. A teammate was recently lectured for being 20 mins late on a deliverable (first offense). The teammate called out the hypocrisy. The manager claimed meeting start times $\neq$ project deadlines.
      *   **Question:** Is the manager's distinction valid (does it let him off the hook), or is he rationalizing/double-standarding?
      *   **Underlying Emotion:** Frustration, sense of injustice, seeking validation/perspective on workplace norms and leadership accountability.

  2.  **Evaluate the Manager's Argument (The "Distinction"):**
      *   *Manager's Claim:* Missing a meeting start time isn't the same category as missing a deliverable deadline.
      *   *Validity:* Technically, there *are* differences.
          *   **Impact:** A late deliverable can block downstream work, miss client windows, or incur financial penalties. A late meeting start wastes time but usually doesn't stop production entirely.
          *   **Flexibility:** Meetings can often start late without ruining the outcome. Deadlines are often hard stops.
          *   **Communication:** It's easier to apologize for a late meeting than a late project.
      *   *Counter-Validity:* However, consistency and respect matter. Chronic lateness signals a lack of respect for the team's time. Leadership sets the culture. If the leader doesn't value time, why should the team?
      *   *Conclusion on Argument:* It's a *partial* truth used to deflect a *valid* criticism. It's a logical fallacy (Two Wrongs Make a Right / Tu Quoque), but the core point about hypocrisy stands.

  3.  **Assess the Leadership/Management Aspect:**
      *   **Lead by Example:** Good managers model the behavior they expect.
      *   **Psychological Safety:** Calling out a first-time offense harshly while committing a chronic offense creates resentment and fear.
      *   **Credibility:** The manager is losing moral authority.
      *   **The "Nerve" Comment:** The teammate was right to feel frustrated, though saying it *to* the manager might be risky depending on the culture.

  4.  **Formulate the Response:**
      *   **Validate the User:** Acknowledge that this is frustrating and common. Confirm that the manager's behavior is problematic.
      *   **Analyze the Distinction:** Break down where the manager is technically right (impact severity) vs. where he is wrong (cultural impact/respect).
