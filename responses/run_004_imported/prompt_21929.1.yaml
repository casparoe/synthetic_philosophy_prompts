answer: |-
  **The Mast and the Crew: Why Constitutional Precommitment Fails the People**

  The image is seductive in its simplicity. In Homer's *Odyssey*, Ulysses knows he will be unable to resist the Sirens' song. To ensure the ship survives, he orders his crew to tie him to the mast and plug their own ears. He binds his future, irrational self to preserve his past, rational will. For constitutional theorists like Jon Elster and Stephen Holmes, this is the foundational myth of the constitution. A polity, anticipating future passions, factions, or tyrannies, binds itself with entrenched rights and amendment hurdles. The constitution is the mast; the amendment procedure is the knot; the citizens are both Ulysses and the crew.

  But as you have identified, there is a fatal flaw in scaling this metaphor from the individual to the collective. Ulysses is one continuous consciousness. A "people" is a rolling wave of generations. The generation that drafts a constitution is not the generation that lives under it a century later. When the Founders bind the Future, they are not tying their own hands; they are tying the hands of strangers. This discontinuity creates what we might call the Precommitment Dilemma: if a constitutional constraint is truly binding (like the "eternity clause" in the German Basic Law), it looks like democratic suicide, foreclosing the right of a future majority to govern itself. If it is easily amendable (a simple supermajority), it is merely a speed bump, easily smashed through by the very passions it was meant to restrain.

  This essay argues that the Ulysses analogy, while evocative, ultimately breaks down as a justification for substantive constitutional entrenchment. However, it can be salvaged if—and only if—we radically narrow its scope. Constitutional precommitment is legitimate not when it locks in specific policy outcomes or moral truths, but when it protects the *constitutive conditions* of democratic agency itself. The mast is justified only to keep the ship afloat, not to dictate its destination.

  To see why the standard analogy fails, we must confront the metaphysical problem of the "people." In individual precommitment, the cost of binding is borne by the same agent who reaps the benefit. I tie myself up; I am frustrated; I survive. In constitutional precommitment, the cost and benefit are separated by time and biology. The "Founders" reap the psychological benefit of imposing their will; the "Successors" bear the cost of reduced sovereignty.

  Jon Elster, who initially championed the Ulysses model, eventually recognized this fracture. In *Ulysses Unbound*, he retreated from his earlier optimism, acknowledging that constitutions are often less about rational precommitment and more about bargaining outcomes among elites who want to insure themselves against future losses. But the problem goes deeper than bargaining. It is about epistemic arrogance. As Jeremy Waldron has forcefully argued, precommitment reasoning assumes we can identify which "self" is the sober one. We assume the Constitutional Moment (T1) is rational and the Future Politics (T2) is prone to passion. But history offers no guarantee of this. The T1 founders might be driven by revolutionary fervor, exclusionary prejudices, or specific economic interests that look irrational to T2. To privilege T1's judgment over T2's is to assert that the dead know better than the living. In a democracy, that is an untenable claim. If the current majority, fully informed and deliberating, wishes to repeal a right or change a structure, the precommitment argument offers no democratic reason why they should be stopped, other than the say-so of ancestors.

  This is where the Precommitment Dilemma bites hardest. Consider Article 79(3) of the German Basic Law, which places human dignity and the democratic-federal order beyond the reach of any amendment, even a unanimous one. This is the strongest real-world analogue to Ulysses being lashed to the mast. It is an attempt to make the binding irrevocable. But if a future German generation, facing an existential crisis, democratically decided to alter the federal structure, Article 79(3) would not be an act of self-binding; it would be an act of intergenerational coercion. It treats the constitution not as a tool of the people, but as a master over them.

  However, to discard the Ulysses analogy entirely is to lose something vital. This is Stephen Holmes's crucial intervention. Holmes argues that constraints are not merely restrictive; they are *enabling*. A game of soccer is not "less free" because players cannot pick up the ball with their hands; the rule makes the game possible. Similarly, Holmes suggests that constitutional rights do not frustrate democracy; they make it possible by ensuring that the democratic process does not eat itself.

  Holmes is right, but his argument requires a sharper distinction than he sometimes provides. The enabling nature of constraints holds true only for *procedural* or *constitutive* rules, not *substantive* ones. If I bind you to a contract that says "you must listen to my arguments before you vote," I have enhanced your agency. If I bind you to a contract that says "you must vote for Party X," I have destroyed it.

  This distinction offers a way out of the dilemma. The Ulysses analogy is coherent only when applied to the preservation of the *capacity for choice*, rather than the *content of choice*. A future generation cannot legitimately choose to abolish democracy, because in doing so, it destroys the very mechanism by which future generations could choose anything at all. This is not a restriction on the people's will; it is a protection of the people's existence as a political agent.

  This reframing addresses Waldron's disagreement objection. Waldron is correct that we cannot assume T1 knows better than T2 regarding *policy* (tax rates, healthcare, foreign alliances). There is no "correct" answer to these questions that T1 can discover and lock in. But regarding the *conditions of agency*, there is a logical priority. You cannot have a democratic vote on whether to end democracy without performing a performative contradiction. Therefore, entrenching the basic structures of democracy (free speech, voting rights, rule of law) is not an act of T1 dominating T2. It is T1 handing T2 the keys to the ship, with the instruction: "You may steer anywhere, but you may not burn the hull."

  The German "human dignity" clause fits here, but only if interpreted narrowly. If "human dignity" means "no torture" or "no slavery," it is a substantive policy preference that T2 might theoretically debate (however abhorrently). But if "human dignity" is interpreted as the ontological status required to be a participant in the legal order—the recognition that citizens are ends in themselves, not tools of the state—then it is a constitutive rule. Without it, there are no citizens, only subjects. Precommitting to that is not binding the future self's preferences; it is ensuring the future self exists.

  Conversely, substantive entrenchments fail the test. When the U.S. Constitution originally protected the institution of slavery, or when constitutions lock in specific economic arrangements (as in 19th-century Latin American constitutions), they are not acting as Ulysses. They are acting as a colonial power occupying the future. They assume T1's moral calculus is final. This violates the democratic principle that the legitimacy of law rests on the consent of the governed. Since T2 did not consent to T1's specific moral views, T1 has no right to enforce them against T2's will, provided T2's decision-making process remains democratic.

  Therefore, the verdict on constitutional precommitment must be bifurcated. The Ulysses analogy is a category error when used to justify locking in substantive outcomes. The "dead hand" of the past has no democratic right to govern the policy choices of the living, no matter how wise the dead believed themselves to be. Supermajority requirements for ordinary amendments are defensible not as precommitments against passion, but as cooling-off mechanisms that ensure broad consensus for structural change. They are speed bumps, yes, but in a complex system, speed bumps prevent catastrophic crashes without preventing travel.

  However, "eternity clauses" that protect the democratic process itself are not only defensible but necessary. They are not shackles on the people's will, but the hull of the ship. A Ulysses who ties himself to the mast to avoid steering the ship into the rocks is rational. A Ulysses who ties his successor to the mast to prevent them from steering to a different port is a tyrant.

  We must abandon the hope that constitutions can solve our moral disagreements for us. They cannot. The T1 generation cannot save T2 from its own mistakes on matters of policy. But T1 can, and must, ensure that T2 survives to make those mistakes and correct them. The legitimate constitution is not a straitjacket designed to force the future to be good; it is a life-support system designed to ensure the future remains free. In this limited, procedural sense, the mast holds. In every other sense, we must let the dead bury their dead, and let the living steer the ship.
