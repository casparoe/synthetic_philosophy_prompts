      *   *The Horror/Vertigo:* The function exists *here* (outside), but not *there* (inside). The "uncountable" is countable.
      *   *The Twist/Deepening:* If $M$ is countable from here, is *here* countable from somewhere else? The regress.
      *   *Conclusion:* She returns to her work, but changed. The absolute is gone.

