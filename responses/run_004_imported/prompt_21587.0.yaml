prompt: |-
  Since retiring from a career in vertebrate paleontology, I have taken up philosophy, and I now sit on my local natural history museum's collections committee. Our most popular exhibit, a mounted sauropod skeleton assembled in the 1930s from the bones of at least three individuals plus several sculpted replacement parts, has always been cataloged and labeled as a single specimen; our curator wants to keep it that way, citing standard practice for legacy mounts. A donor will fund its overdue restoration only on that condition, while two board members instead want the composite origin disclosed on the label, or the mount recataloged as an assemblage rather than a specimen. Reading van Inwagen lately, it struck me that we are really litigating a live instance of the special composition question -- under what conditions do several things compose a further thing -- and that neither unrestricted composition nor his own restriction to living organisms settles it, since on his view the bones compose nothing at all once the animal is dead, whether from one individual or several. Please draft the memo I will circulate before the board votes on the donor's offer: recommend a specific cataloging and labeling policy, give reasons the curator and the two board members would each have to take seriously, and include a candid statement of the strongest objection to whatever you recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired vertebrate paleontologist, now philosopher, sits on a local natural history museum's collections committee.
      *   **Context:** A popular sauropod mount (1930s, composite of 3+ individuals + sculpted parts) is currently cataloged/labeled as a single specimen.
      *   **Conflict:**
          *   Curator: Wants to keep it as a "single specimen" (standard legacy practice, condition for donor funding).
          *   Two Board Members: Want disclosure of composite origin or recataloging as an "assemblage."
          *   Donor: Will fund restoration *only* if it remains cataloged as a single specimen.
      *   **Philosophical Angle:** User sees this as an instance of the Special Composition Question (SCQ). References Peter van Inwagen (who denies composition for non-living things).
      *   **Task:** Draft a memo to circulate before the board votes.
      *   **Requirements:**
          1.  Recommend a specific cataloging and labeling policy.
          2.  Give reasons the Curator and the Board Members would each have to take seriously.
          3.  Include a candid statement of the strongest objection to the recommendation.
      *   **Tone:** Professional, philosophical but accessible, persuasive, balanced, acknowledging the user's dual expertise (paleo + philosophy).

  2.  **Determine the Recommendation:**
      *   *Option A (Curator/Donor):* Keep as "Single Specimen." Pros: Funding secured, historical integrity of the mount as an artifact. Cons: Scientifically inaccurate, misleading to the public.
      *   *Option B (Board Members):* Recatalog as "Assemblage" + Disclose. Pros: Scientifically accurate, transparent. Cons: Loses funding, potentially diminishes the "iconic" status of the mount.
      *   *Option C (Hybrid/Philosophical Middle Ground):* Acknowledge the mount as a *historical artifact* that represents a *biological concept*.
      *   *Decision:* The most robust solution respects the scientific truth (addressing the Board) while securing the funding and acknowledging the mount's cultural status (addressing the Curator/Donor). The recommendation should be: **Catalog the physical assembly as a single *museum object* (for logistical/funding purposes) but label it explicitly as a *composite reconstruction* representing the species, not a single biological individual.** This splits the difference between "specimen" (biological) and "assemblage" (loose parts). It treats the mount as a *functional whole* without making false biological claims.

  3.  **Address the Philosophical Angle (van Inwagen/SCQ):**
      *   The prompt specifically mentions van Inwagen. I need to weave this in without making the memo *too* academic. It should show the user's unique perspective but remain practical.
      *   Van Inwagen's view: Composition only happens in living organisms. So, a dead skeleton (even from one individual) doesn't strictly "compose" an object in his metaphysics. A composite skeleton definitely doesn't.
      *   Application: We shouldn't pretend the bones *are* the animal. We should admit the mount is a *representation*.
      *   Strategy: Use the SCQ to highlight that "specimen" implies biological unity which doesn't exist. "Assemblage" implies a lack of unity which undermines the exhibit's value. We need a pragmatic category: "Composite Mount."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the stakes (funding vs. integrity) and the user's unique background (paleo + philosophy).
      *   **The Philosophical Context (Brief):** Mention the SCQ lightly to frame the dispute not just as semantics, but about what kind of "thing" the mount is.
      *   **Recommendation:** Define the policy clearly. (Catalog as a single *accession* for management, Label as a *composite* for education).
      *   **Addressing the Curator (and Donor):** Why this works for them. (Secures funding, maintains the mount's status as a unified exhibit, respects legacy practice without lying).
      *   **Addressing the Board Members:** Why this works for them. (Scientific transparency, educational value, avoids misleading the public).
      *   **The Strongest Objection:** Be candid. (The donor might walk away if "composite" is too prominent, or the "single specimen" cataloging creates future data integrity issues).
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to sound like a colleague speaking to colleagues.
      *   Respectful of the Curator's authority but firm on scientific ethics.
      *   Philosophical insights should illuminate the practical problem, not obscure it.
      *   *Self-Correction during drafting:* I initially thought about suggesting we reject the donor's condition. But the prompt asks for a recommendation to circulate *before* the vote on the *offer*. If I recommend rejecting the offer, the mount doesn't get restored. I need a solution that allows the vote to pass while mitigating the ethical cost. The "Dual-Track" approach (Admin vs. Public) is best.

  6.  **Incorporating van Inwagen:**
      *   Don't get bogged down in metaphysics. Use it to show why "Single Specimen" is metaphysically false regardless of the number of individuals (since the animal is dead). This actually helps the Board Members but also undermines the Curator's "legacy" argument if taken too literally.
      *   Better angle: Van Inwagen shows that *biological* composition is special. Since that's gone, we are dealing with *artifactual* composition. The mount is a sculpture made of bone. This validates the Board's desire for truth while validating the Curator's desire to treat it as a single object (an artifact).

  7.  **Final Polish:**
      *   Check constraints: Specific policy? Yes. Reasons for Curator? Yes. Reasons for Board? Yes. Strongest Objection? Yes.
      *   Ensure the distinction between *cataloging* (internal database) and *labeling* (public facing) is clear. This is the key to the compromise.

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommend specific policy? Yes (Hybrid).
      *   Reasons for Curator? Yes (Funding + Legacy).
      *   Reasons for Board? Yes (Accuracy + Trust).
      *   Strongest Objection? Yes (Donor risk/Data integrity).
      *   Philosophical integration? Yes (SCQ/van Inwagen reference).

  *(Self-Correction on the van Inwagen point)*: The prompt says van Inwagen's view doesn't settle it because on his view bones compose nothing once dead. I should acknowledge this irony. If van Inwagen is right, *no* skeleton is a "specimen" in the compositional sense. This levels the playing field. The distinction isn't "one vs. many" but "biological vs. artifactual." I will use this to argue for the "Artifact" classification.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee and Board of Directors
  **FROM:** [Your Name], Collections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Sauropod Mount Restoration and Cataloging Status

  As we prepare to vote on the donor's offer to fund the restoration of our 1930s sauropod mount, I write to propose a compromise policy regarding its cataloging and public labeling. Given my background in both vertebrate paleontology and, more recently, philosophy, I believe this dispute offers a rare opportunity to align our administrative needs with scientific integrity.

  **The Philosophical Context**
  In reviewing this conflict, I have been struck by how closely it mirrors a classic metaphysical debate known as the Special Composition Question: *Under what conditions do several things compose a further thing?* Our Curator argues the mount composes a single specimen (unity); our dissenting Board members argue it remains a collection of parts (multiplicity).

  Interestingly, the metaphysics of Peter van Inwagen suggests that neither side is strictly correct regarding the *biology*. On his view, composition only occurs within living organisms. Once the animal died, the bones ceased to compose a biological entity, regardless of whether they came from one individual or three. Therefore, labeling the mount a "single specimen" is biologically false even if the bones were from one animal. However, treating it merely as an "assemblage" ignores the functional unity the 1930s builders created. The mount is neither a biological organism nor a loose pile of bones; it is a **scientific artifact**.

  **Recommendation**
  I recommend we adopt a **Dual-Track Cataloging and Labeling Policy**:

  1.  **Internal Cataloging:** For the purposes of the donor agreement, insurance, and collection management, we will accession the mount as a **single object (Accession #X)**. This satisfies the requirement to treat the assembly as a unified entity for funding and logistics.
  2.  **Public Labeling:** The exhibit label will explicitly state: *"Composite Reconstruction. This mount combines fossil material from at least three individuals with sculpted elements to represent [Species Name]."* We will retire the term "Specimen" in public-facing text in favor of "Mount" or "Reconstruction."

  **Rationale for the Curator and Donor**
  This approach respects the Curator's concern for legacy practice and the donor's condition. By accessioning the mount as a single object internally, we acknowledge the mount's historical status as a cohesive exhibit piece. It allows us to accept the restoration funds without bureaucratic friction. Furthermore, treating the mount as a singular *artifact* preserves its iconic status. We are not dismantling the legacy of the 1930s preparation; we are preserving it as a historical document of how paleontology was practiced in that era. The donor's condition is met in the ledger, ensuring the restoration proceeds.

  **Rationale for the Board Members**
  This approach addresses the Board's concern for transparency and scientific accuracy. Modern paleontology has moved away from the "monolith" model of museum mounts. By explicitly disclosing the composite nature of the skeleton on the label, we maintain public trust and turn the exhibit into an educational tool about the scientific process. We avoid misleading visitors into believing they are looking at a single dead animal. This aligns with current best practices in natural history museums, which prioritize data integrity over the aesthetic of completeness.

  **The Strongest Objection**
  I must be candid about the risk. The strongest objection to this recommendation is that it may be viewed as a breach of the donor's *intent*, if not the literal condition. While the donor specified the *cataloging* status, they likely intend for the mount to retain the aura of a "real" single animal to maximize its appeal. Explicitly labeling it a "Composite Reconstruction" could be perceived by the donor as diminishing the value of their contribution, potentially jeopardizing future support. Additionally, some colleagues argue that internal cataloging as a "single object" creates long-term data integrity issues, potentially confusing future researchers who rely on our database to track individual bone provenance.

  **Conclusion**
  We cannot change the metaphysics of the bones, but we can control the semantics of the museum. By distinguishing between the mount as a *managed object* and the mount as a *biological claim*, we can secure the funding we need without sacrificing the scientific honesty we owe our visitors. I urge the Board to accept this dual-track policy and approve the restoration offer.

  Respectfully,

  [Your Name]
  Collections Committee
