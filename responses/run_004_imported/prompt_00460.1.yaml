      *   **Round 2: Empirical Adequacy vs. Truth.**
          *   Sarah: Van Fraassen's view. Accept the theory, don't believe the ontology.
          *   Elias: That feels like surrender. The "No Miracles" argument. Spectroscopy works *too* well to be just a tool.
      *   **Round 3: The Specific Case (Bohm vs. Copenhagen).**
          *   Elias: Bohm gives me particles. Real things.
