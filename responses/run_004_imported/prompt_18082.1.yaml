answer: |-
  This is a fantastic question. It is rare to see the fink/mask distinction applied to narratology, but it fits surprisingly well. You have grasped the basic shape of the problem correctly: both finks and masks drive a wedge between the *simple conditional analysis* (SCA) of dispositions ("$x$ is disposed to $M$ if $S$" $\approx$ "If $x$ were $S$, $x$ would $M$") and our intuitive understanding of what a disposition *is*.

  However, they drive that wedge in fundamentally different places. Understanding why Lewis's Reformed Conditional Analysis (RCA) plugs one hole but leaves the other open reveals something crucial about the metaphysics of properties—and, as it turns out, about character construction.

  ### 1. The Metaphysical Distinction: Intrinsic vs. Extrinsic

  The reason finks and masks are treated as distinct problems is that they attack the relationship between the **intrinsic basis** of a disposition and the **extrinsic conditions** of its manifestation differently.

  **Finks (Martin): The Instability of the Basis**
  A finkish case involves a change to the *intrinsic property* of the object itself at the moment of stimulation.
  *   **The Setup:** A wire is live (has the intrinsic basis $B$ to shock).
  *   **The Stimulus:** You touch it ($S$).
  *   **The Fink:** A device detects the touch and instantly renders the wire dead (removes $B$).
  *   **The Result:** You don't get shocked ($\neg M$).
  *   **The Problem for SCA:** The SCA says "If touched, it would shock." This is false. But the wire *was* live. The disposition existed, but vanished *because* of the stimulus.
  *   **Key Feature:** The causal basis ($B$) is **transient** dependent on $S$.

  **Masks (Johnston): The Interference with the Pathway**
  A masking case involves an *extrinsic* factor that blocks the manifestation while the intrinsic basis remains intact.
  *   **The Setup:** A poison is lethal (has the intrinsic basis $B$ to kill).
  *   **The Stimulus:** You ingest it ($S$).
  *   **The Mask:** You also ingest an antidote (extrinsic interferer).
  *   **The Result:** You don't die ($\neg M$).
  *   **The Problem for SCA:** The SCA says "If ingested, it would kill." This is false. But the poison *is* still lethal. Its chemical structure ($B$) hasn't changed.
  *   **Key Feature:** The causal basis ($B$) is **stable**, but the causal pathway to $M$ is blocked externally.

  ### 2. Why Lewis's RCA Fixes Finks but Fails Masks

  David Lewis's Reformed Conditional Analysis (1997) attempts to save dispositionalism by anchoring the disposition to an **intrinsic causal basis** that must persist.

  **The RCA Formula:**
  $x$ is disposed to $M$ when $S$ iff $x$ has some intrinsic property $B$ such that, if $x$ were $S$ and $x$ were to **retain $B$** for long enough to cause $M$, then $S$ and $B$ would jointly cause $M$.

  **Why it kills the Fink:**
  Lewis adds the clause: *"and retain $B$."*
  In the electro-fink case, if you touch the wire ($S$), the device makes it lose $B$. So, when we evaluate the conditional, we are asked to consider a world where you touch the wire *and* it keeps its conductivity. In that specific counterfactual world (where the fink mechanism fails or is absent), the wire *does* shock you.
  *   **Result:** RCA correctly identifies the wire as live. It forces us to hold the intrinsic nature of the object fixed, ignoring the finkish removal of that nature.

  **Why it dies to the Mask:**
  In the masking case, the poison *does* retain its intrinsic toxicity ($B$). The antidote doesn't change the poison's chemistry; it just neutralizes the effect in the body.
  So, when we evaluate the RCA conditional: "If ingested ($S$) and retains toxicity ($B$)..."
  *   **Antecedent:** True. (It is ingested, and it stays toxic).
  *   **Consequent:** False. (It does not kill, because of the antidote).
  *   **Result:** The conditional fails. RCA concludes the poison is *not* disposed to kill. But intuitively, it *is* lethal; it's just currently masked.
  *   **The Failure:** Lewis's fix relies on holding the *intrinsic* basis fixed. Masks work via *extrinsic* interferers. Since RCA doesn't stipulate "and no extrinsic interferers are present," it cannot distinguish between a non-lethal substance and a lethal substance that is currently antidoted.

  **The Philosophical Takeaway:**
  This distinction tells us that dispositions are **intrinsic properties** that rely on **extrinsic openness** to manifest.
  *   **Finks** teach us that a disposition requires the *stability* of the intrinsic basis across the moment of stimulation.
  *   **Masks** teach us that the *manifestation* of a disposition is not sufficient proof of the disposition's absence, because the environment can block the output without changing the input.

  ### 3. Application to Marguerite: Basis vs. Manifestation

  This is where your research rabbit hole pays off for your novel. The fink/mask distinction gives you a precise vocabulary for the difference between "cheating" and "earned."

  **The Cheat: The Dead-Wire Fink**
  If Marguerite is *not* courageous, but circumstances make her *look* courageous (or simply spare her the need to be), you are risking a "Dead-Wire Fink" scenario.
  *   **The Trap:** You assert she has the disposition (Courage), but she lacks the intrinsic basis (the psychological/neural/volitional structure).
  *   **The Reader's Reaction:** When the climax comes and she finally acts bravely, it feels unearned because the reader suspects the "wire was dead" until the plot device (the fink) turned it on. This is *deus ex machina* character development.

  **The Earned Reveal: The Masked Live Wire**
  To make it earned, Marguerite must be a **Masked Live Wire**. She must possess the intrinsic basis ($B$) of courage throughout the book, even if the manifestation ($M$) is prevented by circumstance (the Mask).
  *   **The Solution:** You cannot wait for the manifestation to prove the disposition. You must show the **Basis**.

  In metaphysics, we argue that dispositions are real properties, not just summaries of past behavior. In fiction, character is real psychology, not just a summary of past actions. To prove Marguerite is courageous without a battlefield, you must show the *causal basis* of courage engaging, even if the *final manifestation* is masked.

  **Practical Narrative Strategies based on RCA:**

  1.  **Show the Retention of $B$ (The Internal Cost):**
      Courage isn't the absence of fear; it's the volitional override of fear. If Marguerite never feels fear because she's never in danger, she isn't courageous; she's untested.
      *   *Write the Mask:* Put her in low-stakes situations that trigger her fear response. Show her regulating it. Show her *preparing* to act bravely.
      *   *The Mask:* Just as she commits to the brave act, let circumstance intervene (the guard walks away, the friend intervenes, the threat dissolves).
      *   *Why this works:* The reader sees the *intrinsic basis* (the willingness to act despite fear) engage and persist. The *manifestation* (the actual fight) is masked by luck. This proves the wire is live, even if it doesn't shock.

  2.  **Make the Luck Visible (Identify the Antidote):**
      In masking cases, the antidote is extrinsic. If you hide the luck, the reader assumes the lack of action implies a lack of courage.
      *   You must explicitly signal to the reader: "She *would* have acted, but X happened."
      *   If the reader perceives the "antidote" (the convenient circumstance), they will intuitively understand that the "poison" (her courage) is still potent. They will wait for the antidote to wear off.

  3.  **Avoid the Finkish Switch:**
      Do not let her character change *at the moment* of the climax. If she is timid for 200 pages and then suddenly brave in chapter 25 because "she found it inside herself," that is a finkish change of intrinsic basis.
      *   Instead, the climax should simply be the first time the **Mask** is removed. The basis must be shown to be continuous from Page 1 to Page 300.

  ### Summary
  The fink/mask distinction matters because it separates **what a thing is** (intrinsic basis) from **what happens to a thing** (extrinsic manifestation).

  *   **Finks** change what the thing *is* when tested.
  *   **Masks** change what *happens* when tested.

  For Marguerite to be courageous without having acted courageously, she must be a **masked disposition**. You must provide evidence of the intrinsic basis (her internal relationship with fear and duty) while explicitly marking the external circumstances (the masks) that have prevented the manifestation. If you do that, the reveal isn't a trick; it's simply the removal of the antidote. The poison was lethal all along.
