answer: |-
  Here is the position: **Blockage-style Frankfurt cases (à la Mele, Robb, and Pereboom) succeed where Frankfurt's original formulation failed.** They effectively escape the Widerker-Kane Dilemma and demonstrate that the Principle of Alternative Possibilities (PAP) is false. The core of my argument is that these cases successfully decouple *inevitability* from *causal determination*, isolating moral responsibility to the actual sequence of events (sourcehood) rather than the availability of alternative sequences (leeway).

  ### The Failure of the Dilemma Defense Against Blockage Cases

  The Widerker-Kane Dilemma is devastating for *original* Frankfurt cases because it exploits the reliance on a "prior sign." It forces the Frankfurt-defender to admit that the sign either determines the choice (begging the question against libertarians) or fails to guarantee the choice (leaving alternative possibilities intact).

  Blockage cases dissolve this dilemma by removing the epistemic element entirely. There is no sign, no prediction, and no waiting. Instead, there is a causal architecture established *prior* to the decision that renders the alternative outcome physically impossible without causally determining the actual outcome.

  Consider Pereboom's "Tax Evasion" case or Mele and Robb's "Indeterministic Blockage." In these scenarios, a mechanism is in place that will *causally necessitate* the agent to choose $X$ if they show any sign of choosing $Y$. However, if the agent chooses $X$ on their own, the mechanism remains idle. Crucially, in the "no-sign" versions, the mechanism doesn't wait for a sign; it simply blocks the neural pathways required for $Y$ while leaving the pathways for $X$ open and indeterministic.

  This escapes the Dilemma's horns:
  1.  **It avoids Horn 1 (Determinism):** The actual sequence leading to $X$ is not determined by the blocker. The blocker only targets the *alternative* pathway. The actual choice can arise from an indeterministic process within the agent. The inevitability of the outcome is secured by the *absence* of a viable alternative path, not by the *presence* of a determining cause for the actual path.
  2.  **It avoids Horn 2 (AP Remains):** Because the alternative pathway is physically blocked (e.g., a neural switch is fused), there is no possible world accessible to the agent where they choose $Y$. The alternative possibility is not just unlikely; it is causally precluded.

  By pruning the "garden of forking paths" so that only one path remains walkable, without pushing the agent down that path, blockage cases create a scenario where the agent *could not have done otherwise*, yet intuitively retains the kind of control requisite for moral responsibility. If we accept the intuition that Jones is responsible in the blockage case (because he acted on his own reasons without coercion in the actual sequence), then PAP is demonstrably false. Responsibility tracks **sourcehood**, not **leeway**.

  ### The Strongest Objection: The "Determinism in Disguise" Charge

  The most formidable objection to this view is not the Flicker of Freedom defense (which argues some tiny AP remains), but rather a metaphysical challenge I call the **"Determinism in Disguise"** objection. This is essentially Horn 1 of the Dilemma re-emerging in a new form.

  The objection runs as follows: If the blockage mechanism makes it *inevitable* prior to the decision that Jones will $\phi$, then the truth of "Jones will $\phi$" is fixed by factors outside Jones's control. For the incompatibilist, inevitability grounded in prior physical facts *just is* determinism, regardless of whether the causal chain runs through the agent's deliberation. If the past and the laws of nature (including the blockage mechanism) entail that Jones $\phi$s, then Jones lacks "ultimate responsibility." The blockage mechanism, by guaranteeing the outcome, becomes a causally sufficient condition for the outcome's inevitability, even if it isn't the direct cause of the action. Therefore, the case presupposes a deterministic universe, and libertarians are right to reject it as question-begging.

  In short: **You cannot have inevitability without determinism.** If the outcome is fixed beforehand, the agent is not the ultimate source.

  ### Rebuttal: Preemption is Not Determination

  This objection conflates the **fixity of the outcome** with the **determination of the process**. The blockage strategy relies on a specific causal structure known as *causal preemption*, and distinguishing these two concepts is key to saving the case.

  In a standard deterministic world, the prior state of the universe + laws of nature *produce* the action. The action is determined because its causes necessitate it. In a blockage case, the prior state (the blockage) *constrains the options* but does not *produce* the action.

  Imagine a hallway with two doors, A and B. A brick wall is built blocking Door B. The agent walks through Door A.
  *   **The Objection says:** Because the wall was there beforehand, the agent's path was determined.
  *   **The Response:** The wall determined that Door B was unavailable, but it did not determine that the agent would walk through Door A. The agent could have stood still. The agent could have turned back. The blockage removes the *ability to do otherwise*, but it does not supply the *energy or cause* for the actual action.

  In the Mele-Robb neural model, Process P1 (the agent's indeterministic deliberation) and Process P2 (the deterministic blocker) are set up. P2 is ready to cause the decision if P1 falters. But P1 succeeds on its own. The objection claims P2's presence determines the outcome. But this is false. P2 is causally inert in the actual sequence. The actual sequence is driven entirely by P1, which is stipulated to be indeterministic.

  The incompatibilist insists that "could have done otherwise" is required for responsibility. But the blockage case forces a choice of intuitions:
  1.  Is Jones responsible? (Yes, he acted on his own reasons, uncoerced).
  2.  Could Jones have done otherwise? (No, the neural pathway was blocked).

  If you hold (1), you must reject PAP. The "Determinism in Disguise" objection tries to undermine (1) by insisting that inevitability kills responsibility. But this simply asserts incompatibilism rather than arguing for it. It assumes that *any* form of inevitability undermines control. The blockage case is designed specifically to test this assumption. It shows that an agent can be the **sole source** of an action even if they are not the **sole possessor** of alternative possibilities.

  The blockage mechanism ensures the action *will* happen, but it does not ensure *how* it happens (i.e., via the agent's free choice vs. direct intervention). Since the agent is the one who actualizes the choice via the indeterministic process, the sourcehood is preserved. The inevitability is external to the will (a constraint on options), whereas determination is internal to the will (a constraint on causation). By blocking the option without determining the choice, blockage cases successfully refute PAP without begging the question against the libertarian.

  ### Conclusion

  The Widerker-Kane Dilemma successfully killed the original Frankfurt cases because they relied on infallible predictors. However, blockage cases bypass the need for prediction entirely. They construct a scenario where alternative possibilities are causally extinguished while the actual sequence remains free and indeterministic. The strongest objection—that this inevitability amounts to determinism—fails because it confuses the necessity of the *outcome* with the determination of the *cause*. As long as the actual sequence flows from the agent's own indeterministic deliberation, the agent is the source. Blockage cases prove that while alternative possibilities might be nice to have, they are not the foundation of moral responsibility. PAP is false.
