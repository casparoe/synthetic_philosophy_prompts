          3.  Is the concept of "utility" circular/useless if it just means "whatever people do"?

  2.  **Deconstruct the Economic Concept (Revealed Preference):**
      *   *Origin:* Paul Samuelson (1938).
      *   *Standard Definition:* If a consumer chooses bundle A when bundle B is affordable, they have revealed a preference for A over B.
      *   *Purpose:* To make economics empirical/observable. We can't see inside heads, only actions.
      *   *The Friend's Interpretation:* Strong/Strict Revealed Preference. Choice = Utility. End of story.
