  Okay so I just lost a two-hour argument with my friend, who's doing a logic PhD, about Skolem's paradox, and I can't find the hole in his reasoning even tho it feels off. His point was that the downward Löwenheim-Skolem theorem gives ZFC a countable model, and that this exact model still proves some set inside it -- the reals, or the powerset of omega -- is uncountable, which he says shows Cantor's uncountability proof was never tracking a mind-independent fact, its purely relative to whichever model you happen to be looking at. So if theres no model-independent fact about the reals outnumbering the naturals, just different bookkeeping depending which model you're in, what's actually left of the claim that there are 'objectively' different sizes of infinity -- is that something set theorists should just stop asserting as flatly true? I don't want the quick 'well it's not really a paradox' answer, I want the actual mechanics of why (or whether) his argument holds up.
