answer: |-
  You have hit on the single most vulnerable flank of the Condorcet Jury Theorem (CJT), and yet it is the one most often glossed over in popular political science. The standard reading treats the theorem as a magic spell: *cast "more voters," summon "truth."*

  But if you take the math literally, the theorem is not an argument for universal suffrage. It is an argument for **competence thresholds.** In fact, a rigorous application of the theorem suggests that expanding the electorate is not just unnecessary, but mathematically dangerous.

  Here is the argument for why the Condorcet Jury Theorem, honestly applied, supports narrowing the franchise to a small, high-competence panel.

  ### 1. The Theorem is Conditional, Not Categorical
  The most important feature of CJT is that it is a conditional proof. It does not state: *"Majority vote yields truth."*
  It states: *"**IF** individual competence ($p$) > 0.5, **THEN** majority vote yields truth as $n$ increases."*

  The theorem places the entire burden of success on the variable $p$ (individual competence). The variable $n$ (group size) is merely an amplifier.
  *   If $p = 0.51$, the signal is weak. You need a massive $n$ to amplify it to certainty.
  *   If $p = 0.90$, the signal is strong. You need a tiny $n$ to achieve the same certainty.

  If your goal is to maximize the probability of a correct decision (the stated goal of the theorem), you get exponentially more "bang for your buck" by increasing $p$ than by increasing $n$. Increasing $p$ from 0.51 to 0.60 does more for the group's accuracy than increasing $n$ from 1,000 to 1,000,000.

  Therefore, the logical imperative of CJT is not "get more voters." It is "get better voters." Since it is statistically easier to find 100 people with $p=0.9$ than 100,000 people with $p=0.51$, the theorem favors a small, screened panel over a mass electorate.

  ### 2. The Risk of "Competence Dilution"
  In a universal suffrage model, you are averaging the competence of the entire population. In almost any complex domain (economics, foreign policy, constitutional law), the distribution of knowledge is not normal; it is skewed. A significant portion of the population will have $p < 0.5$ (they are systematically misinformed or guessing).

  Every time you add a voter with $p < 0.5$ to the pool, you drag the average $p$ of the group down.
  *   **Scenario A (Elite Panel):** You select 500 experts. You can verify their track records. You ensure average $p = 0.85$.
  *   **Scenario B (Mass Democracy):** You include 500 experts plus 500,000 random citizens. Even if the random citizens average $p = 0.52$, the sheer weight of their numbers dominates the vote. The group's effective $p$ becomes 0.52.

  According to the convergence rates of CJT, the 500 experts ($p=0.85$) will reach 99.9% certainty almost instantly. The mass electorate ($p=0.52$) requires a colossal $n$ to reach that same confidence level, and it remains perilously close to the 0.5 "tipping point."

  By widening the vote, you are not adding signal; you are adding noise. CJT dictates that noise dilutes the probability of correctness unless the signal is already dominant.

  ### 3. The Inverse Condorcet Catastrophe
  This is the strongest mathematical argument for restriction. The theorem has a dark twin: **If $p < 0.5$, then as $n \to \infty$, the probability of a correct majority vote $\to 0$.**

  If the electorate is systematically biased (if the "common sense" of the crowd is actually wrong more than 50% of the time), then adding more voters does not fix the problem—it guarantees failure. It makes the wrong answer *more* certain, not less.

  In a mass democracy, you cannot know for sure if the average $p$ is 0.51 or 0.49. It is an unknowable variable that fluctuates with mood, media, and culture. If it dips to 0.49, universal suffrage becomes a machine for producing incorrect outcomes with high confidence.

  However, in a small, selected panel, $p$ is auditable. You can test potential voters. You can require qualifications. You can ensure $p$ stays safely above 0.5. A small panel minimizes the risk of accidentally triggering the "Inverse Condorcet" effect. The theorem implies that **certainty of competence is more valuable than volume of votes.**

  ### 4. Diminishing Returns on $n$
  Let's look at the marginal utility of adding voters.
  *   With $p = 0.6$, a jury of just **13 people** gives you an 80% chance of a correct majority.
  *   To get to 99% certainty with $p = 0.6$, you need roughly **300 people**.
  *   To get to 99% certainty with $p = 0.51$, you need roughly **45,000 people**.

  If you have a mechanism to select voters with $p = 0.7$ or $0.8$ (through education, testing, or professional experience), the number of voters required to achieve near-perfect accuracy drops into the dozens or hundreds.

  Adding voters beyond that point yields vanishingly small improvements in accuracy but introduces massive logistical costs and risks (such as the aforementioned competence dilution). From a purely utilitarian perspective based on CJT, once you have enough competent voters to secure the outcome, adding more voters is irrational. It increases cost and risk without materially increasing the probability of truth.

  ### 5. Independence is Easier to Maintain in Small Groups
  You asked to take the theorem at face value, which includes the assumption of **independent voting**. This is often cited as a reason democracy *fails* (herd mentality), but it is also a reason why small panels are mathematically superior.

  Statistical independence is much harder to maintain in a population of millions. Millions of people consume the same media, hear the same slogans, and react to the same emotional triggers. Their votes become correlated. When votes are correlated, the "effective $n$" shrinks. A million voters moving in lockstep mathematically behave like a single voter.

  In a small panel of selected experts, you can structurally enforce independence. You can isolate them, require reasoned written justifications, and select for diverse methodologies. If CJT requires independence to function, then a small, managed body is the only environment where the theorem's assumptions can actually be met. A mass electorate is structurally incapable of satisfying the independence clause, rendering the theorem inapplicable to them.

  ### Conclusion: The Theorem is an Argument for Epistocracy
  The Condorcet Jury Theorem is often wielded as a shield for democracy, but mathematically, it is a sword for meritocracy.

  It teaches us that the **quality of the voter ($p$) is the exponent, and the quantity of voters ($n$) is the base.** In any exponential function, small changes to the exponent dwarf massive changes to the base.

  If we truly care about the outcome promised by Condorcet—maximizing the likelihood of the correct decision—the logical conclusion is not "let everyone vote." It is:
  1.  Determine the minimum $p$ required for safety (e.g., 0.75).
  2.  Select only those who meet that threshold.
  3.  Stop adding voters once the probability of correctness plateaus.

  To ignore the $p$ variable and focus only on the $n$ variable is to misunderstand the theorem entirely. Taken at face value, Condorcet argues that a thousand wise men are superior to a million guessers, and that if you cannot guarantee the wisdom, you should not trust the million.
