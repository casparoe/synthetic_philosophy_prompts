answer: |-
  **Setting:** *The gallery of the Blackwood Head Lighthouse. It is night, three days after the verdict. The wind is howling outside the thick glass, but the great Fresnel lens is rotating, casting a sweeping beam across the dark water. Two figures stand near the railing, coats pulled tight against the draft.*

  **Characters:**
  *   **ELENA VANCE:** Testified for the Prosecution. Defends causation by omission.
  *   **JULIAN THORNE:** Testified for the Defense. Defends the process theory of causation.

  ***

  **THORNE:** You realize the beam is mocking us, don't you? Every sweep says, "I am here. I am working." It makes the absence of the light three nights ago feel like a physical weight.

  **VANCE:** That's the point, Julian. The absence *was* a weight. It pressed the *Marigold* onto the rocks.

  **THORNE:** "Pressed." Poetic. Metaphysically bankrupt. Nothing pressed anything. The wind pressed the ship. The rocks tore the hull. The keeper? He did nothing. Literally. You asked the jury to convict a man for a non-event.

  **VANCE:** I asked them to convict him for failing to act when the world relied on him to.

  **THORNE:** Reliance isn't causation. If I rely on the sun to rise and it doesn't, did I cause the darkness? No. The earth's rotation caused the night. If the keeper didn't light the lamp, he didn't generate the wreck. He just… wasn't there to stop it. There's a difference between killing and letting die.

  **VANCE:** Is there? In a functional system, failure to maintain the function *is* the breakdown. Look at this lens. If I smash it, I cause the light to fail. If I simply unplug it, I also cause the light to fail. The result is identical. The counterfactual holds: If I hadn't unplugged it, the light would be on.

  **THORNE:** Ah, the counterfactual crutch. "If he had lit it, they would live." Fine. But apply that universally and you break reality. It's the Queen of England problem, Elena. You know the paper. A houseplant dies of thirst. By your counterfactual logic, the Queen of England caused its death. If she had flown here and watered it, it would live. Why isn't she in the dock?

  **VANCE:** I didn't dodge this on the stand, and I won't dodge it now. The Queen isn't a cause because she isn't part of the plant's survival system. There is no normative expectation, no functional assignment.

  **THORNE:** "Normative expectation." There it is. You're smuggling ethics into metaphysics. You're saying causation depends on *jobs*. That's not physics, that's HR.

  **VANCE:** Causation in human contexts *isn't* pure physics! We aren't talking about billiard balls; we're talking about negligence. Causation is selective. We pick out the cause from the background conditions based on what was abnormal. The wind blowing? Background. The rocks existing? Background. The light going dark? That was the variable. The Keeper was the control mechanism for that variable.

  **THORNE:** So it's about salience. What we *notice*.

  **VANCE:** It's about intervention. The Keeper was the designated intervenor. The Queen has no capacity to intervene in every dying plant. The Keeper had the capacity, the proximity, and the duty. The omission is a cause because it represents a break in a specific, expected causal chain that he was hired to sustain.

  **THORNE:** But that's my point! You've admitted it. He was *hired* to sustain it. That's a contract. A moral duty. If you ground his causality in his duty, then you admit that without the duty, there is no cause. Which means the causation isn't in the event—it's in the rulebook.

  **VANCE:** And? The rulebook defines the reality of the lighthouse.

  **THORNE:** No. The rulebook defines his *guilt*, not the *physics*. And that's where you endanger the law. If you convince people that "nothing" can be a "something," you blur the line between action and inertia. If I walk past a drowning child, I am morally monstrous. But did I *cause* the drowning? The water caused the drowning. I just failed to prevent it.

  **VANCE:** And if I push the child in, I cause it. But if I hold the child under, I also cause it. At a certain point, Julian, holding under and not pulling up look exactly the same.

  **THORNE:** They don't. One adds energy to the system; the other withholds it.

  **VANCE:** Tell that to the families on the *Marigold*. They aren't comforted by the energy transfer analysis.

  **THORNE:** They shouldn't be. But neither should they be lied to about metaphysics. Here is the truth you're afraid of: You can hold the Keeper fully responsible without lying and saying his inaction *caused* the crash.

  **VANCE:** How?

  **THORNE:** Because the law punishes the breach of duty, not just the creation of harm. If the statute says "The Keeper must light the lamp," and he doesn't, he violated the statute. The wreck is the *consequence* that determines the severity of the penalty, not the proof of causation. He is liable for the risk he created, not the physical force he exerted.

  **VANCE:** That's a legal fiction.

  **THORNE:** It's an honest distinction! It preserves the integrity of "cause." If you say omissions are causes, then everyone causes everything they fail to prevent. The Queen causes the plant's death. You cause the starvation in countries you don't donate to. Causation becomes infinite, and therefore meaningless.

  **VANCE:** It doesn't become infinite if we stick to the "system" argument. I am not responsible for the starvation because I am not integrated into that supply chain. The Keeper *was* integrated. He was a cog. When a cog stops turning, the machine breaks. We say the cog broke the machine.

  **THORNE:** We say that colloquially. Metaphysically, the machine stopped because momentum ceased. The cog just failed to add more.

  **VANCE:** You're clinging to a Newtonian view in a human court. You want to acquit him of causation to save your metaphysics, but you'll still hang him on morality.

  **THORNE:** I'll hang him on responsibility. There's a difference. Causation is about what happened. Responsibility is about what should have happened. You're trying to make "what should have happened" rewrite "what happened."

  **VANCE:** Because in a court of law, "what happened" includes the social contract. If I promise to catch you when you fall, and I don't, I broke your fall by not being there. My absence is the active factor in your injury.

  **THORNE:** (Turns to look at the rotating beam) The beam cuts through the dark. It doesn't fight the dark. It just occupies the space. When it's gone, the dark doesn't attack the ships. The ships just hit the rocks because they can't see. The Keeper didn't make them blind. He just didn't make them sighted.

  **VANCE:** He was the eyes, Julian. When the eyes close, the body walks off the cliff. Do we say the cliff killed the body? Or the eyes?

  **THORNE:** We say the body fell. And we punish the eyes for closing. But let's not pretend the closing pushed the body.

  **VANCE:** (Leans against the railing, watching the sweep) You know, if you win on the metaphysics, you lose the deterrent. If omissions aren't causes, people start thinking inaction is neutral.

  **THORNE:** And if you win, you create a world where we are all guilty of every tragedy we didn't stop. I'd rather the Keeper be a villain who failed his duty than a god whose absence killed men.

  **VANCE:** (Quietly) He's not a god. He's just a man who went to sleep.

  **THORNE:** Exactly. A man. Men act. Men also rest. The tragedy is that sometimes, resting looks like killing. But we shouldn't confuse the two, even if the verdict is the same.

  **VANCE:** The verdict isn't the same. "Caused the wreck" carries a different weight than "Failed to prevent it." One implies he drove the ship onto the rocks. The other implies he let the rocks take it.

  **THORNE:** And yet, the dead are just as dead.

  **VANCE:** (Turns back to him) Then maybe the metaphysics doesn't matter.

  **THORNE:** It matters. Because if "nothing" can kill, then "nothing" can save. And if we think saving is just doing nothing, we stop building lighthouses. We just hope someone doesn't forget to turn them on.

  **VANCE:** (Watches the light sweep over the black water) Well. He didn't forget. He just slept.

  **THORNE:** Same difference, in the dark.

  *(They stand in silence as the beam rotates, illuminating the empty sea, then plunging them back into shadow.)*
