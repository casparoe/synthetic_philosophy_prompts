answer: |-
  This is a classic formulation of the **Problem of Temporary Intrinsics**, famously championed by David Lewis. Since you're a physicist, you're likely instinctively sympathetic to the "block universe" picture (spacetime as a 4D manifold), which aligns neatly with Rina's perdurantism. However, Owen is defending the common-sense view (endurantism) using standard metaphysical defenses.

  Here is the move-by-move breakdown, followed by an analysis of whether Owen's closing move actually saves his position.

  ### The Exchange: Move by Move

  #### Move 1: Rina's Opening (The Contradiction)
  *   **Argument:** If Object $O$ is wholly present at $t_1$ and $t_2$, and $O$ is Bent at $t_1$ and Straight at $t_2$, then $O$ has incompatible intrinsic properties. This violates the Law of Non-Contradiction ($P$ and $\neg P$).
  *   **Verdict:** **Rina wins this round.**
  *   **Why:** Logically, this is watertight *if* you assume properties are monadic (non-relational) and time is a parameter of existence. This is Lewis's strongest argument against endurantism. For a naive endurantist, this is a checkmate. Owen must modify the logic or the ontology to survive.

  #### Move 2: Owen's Reply (Relationalism / Adverbialism)
  *   **Argument:** Deny that "Bent" is a monadic property. Assert that "Bent" is actually a relation: $Bent(x, t)$. Owen is not Bent and Straight; he is *Bent-at-$t_1$* and *Straight-at-$t_2$*. These are compatible relations.
  *   **Verdict:** **Owen survives, but at a cost.**
  *   **Why:** This dissolves the logical contradiction formally. However, it changes the semantic content of physical properties. In physics, we usually treat the state of a system at a time as intrinsic to the system at that time. Owen is suggesting that shape is not a property of the object, but a relationship between the object and a time.

  #### Move 3: Rina's Counter (The Intrinsic Objection)
  *   **Argument:** Shape is a paradigm case of an **intrinsic** property. It depends on how the object is, not how it relates to something else. By making shape a relation to time, Owen saves logic but kills the metaphysics. It implies nothing is ever actually bent *simpliciter*; everything is only bent relative to a coordinate.
  *   **Verdict:** **Rina wins this round.**
  *   **Why:** This is the philosophical heavy lifting. Most metaphysicians agree that intrinsic properties (mass, charge, shape) shouldn't be analyzed as relations to external entities (like times) if we can avoid it. Owen's move makes *all* change merely Cambridge change (change in relational facts rather than intrinsic facts). It feels like cheating the spirit of the problem.

  #### Move 4: Owen's Closing (The *Tu Quoque*)
  *   **Argument:** "You do it too." For the perdurantist, the 4D worm ($O_{4D}$) is not bent. Only the temporal part ($O_{t1}$) is bent. So $O_{4D}$ only counts as bent in a derivative sense. Therefore, Rina is also relativizing properties (to parts instead of times).
  *   **Verdict:** **Draw / Complex.**
  *   **Why:** This is the crux of your question. Owen is arguing that both views deny the 4D-whole (or 3D-whole) the intrinsic property directly. But is "relative to a part" the same cost as "relative to a time"?

  ---

  ### The Deep Dive: Does Owen's Closing Move Neutralize Rina?

  Owen's move is clever, but most metaphysicians (including Lewis) argue there is a **critical disanalogy** between "relative to a time" and "relative to a part." Owen does not fully neutralize Rina's argument, though he does expose a cost on her side.

  Here is why the disanalogy matters, specifically for someone with your background.

  #### 1. The Locus of Instantiation
  *   **Owen's View (Relational Endurantism):** There is **no entity** in the ontology that is *Bent simpliciter*. The object is bent-at-$t_1$. The property is fundamentally relational. The "intrinsicness" of shape is lost globally.
  *   **Rina's View (Perdurantism):** There **is an entity** that is *Bent simpliciter*: the temporal part ($O_{t1}$). The temporal part is a concrete particular existing in spacetime. It has the property intrinsically. The 4D worm inherits the property derivatively, yes, but the property exists *somewhere* in the ontology as a genuine intrinsic feature.
  *   **The Win:** Rina preserves the category of "Intrinsic Property" by locating it in the temporal part. Owen eliminates the category entirely by making everything time-relative.

  #### 2. The Physics Analogy (Field Theory)
  Since you're a physicist, think of this in terms of field values.
  *   **Perdurantism (Rina):** The field $\phi(x, t)$ has a value at every spacetime point. The "object" is the worldtube. The value at a specific point is intrinsic to that point/region. This maps perfectly onto Minkowski spacetime.
  *   **Relational Endurantism (Owen):** The object is a 3D entity that sweeps through time. To say $\phi$ has a value, you must always specify the time relation.
  *   **The Disanalogy:** In General Relativity, we treat spacetime points (or regions) as having metric properties intrinsically. Rina's view treats temporal parts like spacetime regions: they have properties intrinsically. Owen's view treats the 3D object as a trans-temporal entity that only acquires properties via a relation to a time slice.
  *   **Verdict:** Rina's view is much more compatible with Relativity. Owen's view often smuggles in a preferred foliation (a "universal now") to make sense of "wholly present," which is physically suspect.

  #### 3. Composition vs. Relation
  *   **Rina:** The relation between the Whole and the Part is **composition**. The whole is *made of* the parts. If the parts are bent, the whole is bent in virtue of its composition. This is a mereological relation (part-to-whole).
  *   **Owen:** The relation between the Object and the Time is **external**. Time is not a *part* of Owen. Time is a container or a coordinate.
  *   **The Disanalogy:** Most philosophers agree that having a property in virtue of your parts is less costly than having a property in virtue of your relation to an external container (Time). If I am heavy because my atoms are heavy, that makes sense. If I am heavy because I am related to "Tuesday," that is weird. Rina says "I am bent because my temporal part is bent." Owen says "I am bent because I am related to $t_1$." Rina's explanation is internal; Owen's is external.

  ### Final Ruling

  **Who won the bar bet?**
  Technically, **Rina** has the stronger philosophical position, primarily because of Move 3 and the failure of Owen's Move 4 to fully bridge the gap.

  1.  **Move 1:** Rina establishes a logical burden.
  2.  **Move 2 & 3:** Owen solves the logic but breaks the metaphysics of properties. Rina correctly identifies that this is too high a price (losing intrinsics).
  3.  **Move 4:** Owen tries to say Rina pays a similar price. He is wrong. Rina pays a price in *ontology* (committing to temporal parts), but she keeps *properties* intrinsic. Owen keeps *ontology* simple (no parts), but he makes *properties* relational.

  **The Physicist's Take:**
  As a physicist, you should probably side with Rina, but for a different reason than she gave.
  Perdurantism is essentially the **B-Theory of Time** (Block Universe), which is the natural metaphysical reading of Special Relativity. Endurantism usually requires **A-Theory** (Presentism or Growing Block), which requires a privileged reference frame to define "wholly present."

  Owen's closing move fails because in the Block Universe, temporal parts are just as real as spatial parts. If you accept that your left hand is a part of you and has intrinsic properties, you should accept that your "t1-slice" is a part of you and has intrinsic properties. Owen's refusal to accept temporal parts forces him to relativize properties to time coordinates, which is metaphysically costlier than accepting the parts.

  **Summary:** Owen's move is a good defensive parry, but it doesn't neutralize the thrust. Rina preserves intrinsic properties by locating them in parts; Owen saves the object by dissolving the properties. Preserving properties is generally the better metaphysical bargain.
