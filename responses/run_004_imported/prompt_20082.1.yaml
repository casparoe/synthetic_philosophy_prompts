prompt: |-
  Okay, this is going to sound niche but bear with me. I sit on the curriculum committee that oversees our business school's required "Ethics and Professional Character" course, and this Thursday we have to vote on whether to keep it, substantially revise it, or scrap it in favor of the "behavioral ethics" course our compliance-and-ethics office has been lobbying for over the last two years (think Bazerman-and-Tenbrunsel "Blind Spots" style stuff - decision checklists, situational/environmental design, basically zero talk of character or virtue). The trigger is that our external program reviewers report landed last week, and it leans hard on the situationist critique: it cites the Milgram obedience studies, the seminary-student "Good Samaritan" experiment, even that old Hartshorne and May honesty study where kids were scrupulously honest in one setting and cheated freely in another, all to argue that the course is built on a folk-psychological premise - that people have stable character traits which predict behavior across situations - that decades of social psychology has more or less demolished. Their recommendation is basically: nice virtue-based curriculum, shame if it doesn't survive contact with the literature.

  Funny enough, I had almost this exact fight two nights ago with a friend who's finishing her PhD in social psych. I tried defending the course by saying something like "but virtue for Aristotle already involves practical wisdom, which is sensitive to the particulars of a situation, so it's not like the theory predicts people act identically regardless of context," and she said that's just a post-hoc move that makes the theory unfalsifiable - keep adding "unless the situation calls for something else" and no amount of data could ever count against it. Neither of us budged, and now I have to write something more careful than what I improvised over a second glass of wine.

  Could you draft the actual memo I'd bring to committee? I want one clear recommendation - keep, revise, or replace the course - argued for on the merits, not a "both sides have a point" shrug. But whichever way it comes out, I want the loosing side taken seriously: if the recommendation is to keep or revise, it has to engage honestly with the situationist evidence instead of hand-waving it away; if it's to replace the course, it can't just strawman virtue ethics as assuming people act identically no matter the setting. And if there's an actual philosophical answer to my friend's "unfalsifiable" charge - something sturdier than what I came up with at the bar - please work it in, because that's exactly the kind of thing that would actually land with this committee.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Business School Curriculum Committee.
      *   **Task:** Draft a memo recommending a decision on the "Ethics and Professional Character" course (Keep, Revise, or Replace).
      *   **Context:** External reviewers recommend scrapping/revising based on the *situationist critique* (Milgram, Good Samaritan, Hartshorne & May) which attacks the idea of stable character traits. The Compliance & Ethics office wants a "Behavioral Ethics" course (Bazerman/Tenbrunsel style, checklists, nudges, no virtue talk).
      *   **Constraint 1:** Must make a *clear recommendation* (no fence-sitting).
      *   **Constraint 2:** Must engage honestly with the losing side (no strawmanning virtue ethics, no hand-waving situationism).
      *   **Constraint 3:** Must address the specific philosophical objection raised by the friend (that virtue ethics is unfalsifiable if it just appeals to "practical wisdom" in every situation).
      *   **Tone:** Professional, academic, persuasive, nuanced but decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Replace with Behavioral Ethics.* Pros: Aligns with current psych literature, practical, compliance-friendly. Cons: Loses the normative/aspirational dimension, reduces ethics to risk management, ignores the development of moral agency.
      *   *Option B: Keep as is.* Pros: Maintains tradition, focuses on character. Cons: Ignores valid empirical critique, vulnerable to accreditation criticism.
      *   *Option C: Substantially Revise (Integration).* Pros: Acknowledges situationist data *without* abandoning character formation. Uses behavioral ethics as a tool *for* virtue. Addresses the "unfalsifiable" charge by redefining virtue as a dynamic capacity rather than a static trait.
      *   *Decision:* **Substantially Revise.** This is the most intellectually honest and pedagogically robust path. It allows me to address the friend's objection directly (virtue isn't a static trait, it's a skill of navigating situations) while accepting the empirical reality of situational power. It avoids the "shrug" by arguing for a *synthesis* rather than a compromise.

  3.  **Address the "Unfalsifiable" Charge (The Philosophical Core):**
      *   *The Friend's Point:* If virtue ethics says "a virtuous person acts rightly unless the situation is too hard," then it explains everything and predicts nothing.
      *   *The Counter-Argument:* Virtue (Aristotelian *phronesis*) is not a *description* of past behavior (trait psychology) but a *prescription* for cultivation. It's not claiming "most people *are* consistent," but "people *can become* more consistent through habituation and situational awareness."
      *   *Key Distinction:* Situationism attacks *global consistency* (do people act the same everywhere?). Virtue ethics claims *local stability* developed through practice (can we train people to recognize and resist situational pressures?).
      *   *Integration:* Behavioral ethics provides the "situational awareness" module; Virtue ethics provides the "motivational engine." You need both. Nudges work better if you want to be good.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Revise, don't scrap).
      *   **The Situationist Challenge:** Acknowledge the external reviewers' points. Validate Milgram, etc. Don't dismiss them. Admit that "character as a fixed trait" is empirically weak.
      *   **The Case for Revision (The Core Argument):**
          *   Why not just replace? Behavioral ethics is descriptive (how we *do* decide), but business school needs normative (how we *should* decide).
          *   Addressing the "Unfalsifiable" charge: Reframe virtue not as a static predictor but as a *competency*. Analogy: Athletic talent. Just because athletes choke under pressure doesn't mean training is useless. It means training must include pressure simulation.
          *   The Synthesis: Use behavioral ethics to *support* virtue. Teach the biases (blind spots) so students can overcome them to act virtuously.
      *   **Curriculum Implications:** What does the revised course look like? (e.g., Module 1: Situational Pressures, Module 2: Cognitive Biases, Module 3: Habituation/Resilience).
      *   **Conclusion:** Reiterate the value proposition.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but use precise philosophical/psychological terms where needed (e.g., *phronesis*, global vs. local traits).
      *   Ensure the Compliance office feels heard (their tools are useful) but not crowned kings (their framework is insufficient).
      *   Ensure the Philosophy faculty feel heard (their core mission remains) but challenged (their empirical assumptions need updating).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the friend's specific objection? *Adjustment:* Make sure to explicitly label the "unfalsifiability" point and offer the "competency/skill" rebuttal.
      *   *Check:* Is the recommendation clear? *Adjustment:* Bold the recommendation in the summary.
      *   *Check:* Is it too long? *Adjustment:* Keep it tight, around 1000-1500 words. Committee members skim.
      *   *Check:* Did I strawman behavioral ethics? *Adjustment:* Acknowledge its strength in predicting error, but note its weakness in motivating moral ambition.

  7.  **Final Polish:** Check for flow and persuasive impact. (The resulting memo follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Curriculum Committee, School of Business
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding "Ethics and Professional Character" Course Structure

  **Executive Summary**

  This memo recommends that the committee vote to **substantially revise** the required "Ethics and Professional Character" course rather than retaining it in its current form or replacing it entirely with the proposed "Behavioral Ethics" module.

  While the external reviewers' situationist critique is empirically sound and must be acknowledged, replacing virtue-based education with a purely compliance-and-cognition model surrenders the normative ambition of our mission. The optimal path is a synthesis: we must retain the goal of character formation but update our pedagogical methods to account for situational power. We should teach behavioral ethics not as a replacement for virtue, but as the necessary technical toolkit for practicing virtue in a complex environment.

  **The Situationist Challenge**

  We must begin by conceding the strength of the external reviewers' position. The situationist critique—drawing on Milgram, the Good Samaritan study, and Hartshorne & May—successfully demonstrates that "global" character traits (the idea that an honest person is honest in all contexts) do not exist in the robust way folk psychology assumes. If our current syllabus implies that possessing a "virtuous character" inoculates a student against situational pressure, it is empirically false.

  My colleague in social psychology raised a further philosophical objection during a recent discussion: that defending virtue ethics by appealing to "practical wisdom" (*phronesis*) renders the theory unfalsifiable. If we claim a virtuous person acts rightly, but explain away failures by saying "the situation overwhelmed them" or "they lacked practical wisdom in that instance," we have created a theory that predicts nothing. It becomes a tautology: virtue is what works, and whatever works was virtue.

  This objection is serious. If we cannot answer it, the reviewers are correct: the course is built on sand.

  **The Case for Revision: Virtue as Competency, Not Trait**

  The solution is not to abandon virtue, but to reframe it. The situationist critique attacks virtue ethics only if we view it as *Trait Psychology* (a static description of who someone *is*). However, the Aristotelian tradition views virtue as *Skill Acquisition* (a dynamic description of what someone can *do*).

  To answer the "unfalsifiable" charge: Virtue is not a prediction of consistent behavior across all situations; it is a capacity for *consistent improvement* across situations. Consider an analogy to athletic training. A situationist might observe that even professional basketball players miss free throws under high pressure, and therefore conclude "shooting skill does not exist." That is obviously false. The skill exists, but it is fragile and context-dependent. Training does not guarantee success, but it statistically increases the probability of success under pressure.

  Similarly, professional character is not a shield that makes situational forces irrelevant. It is a cultivated resilience that makes those forces *less* determinative. The course should not promise that virtuous students will never cheat; it should promise that virtuous students are better equipped to recognize the situational pressures leading to cheating and resist them.

  **Why Replacement is Insufficient**

  The Compliance and Ethics office's proposed "Behavioral Ethics" course (based on Bazerman and Tenbrunsel) is excellent at describing *how* we fail. It identifies blind spots, cognitive biases, and environmental nudges. It is, however, fundamentally descriptive and risk-averse. It teaches students how to avoid ethical *errors*, but it does not teach them how to pursue ethical *excellence*.

  If we replace the course entirely, we risk reducing ethics to risk management. We teach students to use checklists to avoid liability, but we do not give them a positive vision of the professional they ought to become. Behavioral ethics explains why a good person might do bad things; it does not provide the motivational engine to strive to be a good person in the first place. We need the "why" (virtue/aspiration) alongside the "how" (behavioral mechanics).

  **Proposed Curriculum Structure**

  I propose a revised course that integrates the situationist data *into* the virtue framework. The course would be structured in three modules:

  1.  **The Situational Reality:** Explicitly teach the situationist literature. Acknowledge that character is fragile. Teach the Milgram and Good Samaritan data not as reasons to give up on character, but as maps of the minefield.
  2.  **The Behavioral Toolkit:** Incorporate the Compliance office's requested content. Teach decision checklists, pre-commitment strategies, and environmental design. Frame these not as "compliance rules" but as "cognitive prosthetics" that support moral agency.
  3.  **Habituation and Resilience:** Return to virtue ethics, but defined as the practice of using those tools to build stability. Focus on *moral attention* (noticing the ethical issue before the bias takes over) and *moral courage* (the specific skill of acting against social pressure).

  **Addressing the Philosophical Objection**

  This structure directly answers the "unfalsifiable" objection. We are not claiming that a student who passes this course will possess a fixed trait of honesty. We are claiming they will possess a heightened *sensitivity* to ethical friction and a larger *repertoire* of responses.

  This is falsifiable. We can measure whether students in the revised course are better at identifying situational pressures in case studies than those in a pure compliance course. We can measure whether they report higher confidence in intervening when they witness misconduct. If the training does not improve their ability to navigate situations, the course has failed. But if it does, then "character" is vindicated—not as a magic bullet, but as a trainable competency.

  **Recommendation**

  Vote to **revise** the course.

  1.  **Acknowledge the Reviewers:** Formally accept the situationist critique as a constraint on course design. We will no longer teach character as a static trait.
  2.  **Integrate Behavioral Ethics:** Mandate that the new syllabus includes the cognitive bias and decision-design modules lobbied for by the Compliance office.
  3.  **Retain the Normative Core:** Maintain "Professional Character" in the course title and learning objectives. We are in the business of forming leaders, not just managing risk.

  By revising rather than replacing, we demonstrate intellectual humility regarding the empirical literature while maintaining moral ambition regarding our students. We accept that situations drive behavior, but we insist that education can change how our students inhabit those situations.

  I look forward to discussing this framework at Thursday's session.
