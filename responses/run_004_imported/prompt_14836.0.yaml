      *   *Move 3:* Devi invokes the distinction between contingent modes of presentation (water) and direct phenomenal reference (pain). This is the standard dualist/response to Kripke. Kripke himself admitted this is the hard part for physicalists. *Verdict:* Very strong. This is the crux of the debate.
      *   *Move 4:* Callum invokes the "Phenomenal Concept Strategy" (PCS). He argues that the *nature of the concept* doesn't dictate the *nature of the property*. He accuses her of begging the question. *Verdict:* This is a sophisticated physicalist move. Whether it "lands" is the million-dollar question in philosophy of mind.

