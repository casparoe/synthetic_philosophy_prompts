      *   **Move 3 (Devi):** The Phenomenal Concept Strategy (Anti-Kripkean).
          *   *Claim:* Water is picked out descriptively (contingent properties). Pain is picked out directly (phenomenally). There is no "mode of presentation" gap for pain. Therefore, the Water analogy fails.
      *   **Move 4 (Callum):** The Phenomenal Concept Strategy (Physicalist version).
          *   *Claim:* Even if concepts feel direct, they could be "recognitional concepts" latching onto physical states without revealing the identity. The *feeling* of directness doesn't prove dualism. Devi is assuming what she needs to prove (that the concept's nature reflects the ontology).

  3.  **Evaluate Each Move (Philosophical Scorekeeping):**

      *   *Move 1:* Devi states the classic Argument from Conceivability. It's a strong opening move in this debate. *Verdict:* Standard, solid setup.
