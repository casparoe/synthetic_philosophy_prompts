  5.  **Identify Hidden Assumptions (The "Quietly Taking for Granted" part):**
      *   **Devi:** Assumes that our introspective access is infallible or at least ontologically revealing. Assumes that if physicalism were true, we *should* be able to conceive of the identity (or at least, the lack of conceivability implies falsehood). She assumes the "Explanatory Gap" is an "Ontological Gap."
