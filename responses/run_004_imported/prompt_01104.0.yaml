answer: |-
  You have hit on one of the most genuine and sophisticated insights available to someone moving from the "rationalist blogosphere" into academic philosophy of science. The standard rationalist narrative (Frequentism = bad, Bayesianism = good) is largely a pragmatic, engineering-focused heuristic. It treats probability as a tool for reasoning under uncertainty.

  However, when you shift the question from *"How should I update my beliefs?"* to *"What is the metaphysical ground of physical chance?"*, the Bayesian answer becomes unsatisfying (it reduces physics to psychology), and the Frequentist answer becomes incoherent (single-case probabilities).

  You are correct that **Propensity Theory** is the standard "live option" in contemporary metaphysics for objective chance. Philosophers like Karl Popper (who introduced it), D.H. Mellor, David Lewis, and Antony Eagle have all engaged with it seriously.

  However, it has not "settled the debate" for three main reasons: (1) a devastating technical objection regarding the probability calculus (Humphreys' Paradox), (2) the charge of metaphysical circularity, and (3) the realization that Propensity and Bayesianism are often answering *different* questions, making them complementary rather than rivalrous.

  Here is the breakdown of why Propensity Theory hasn't knocked out the other contenders.

  ### 1. The Technical Problem: Humphreys' Paradox
  You asked if there is a "technical problem with treating propensities as garden-variety probabilities." **Yes, there is.** This is the single biggest hurdle.

  Standard probability theory (Kolmogorov axioms) is time-symmetric and allows for conditional inversion via Bayes' Theorem. If $P(A|B)$ is defined, then $P(B|A)$ is mathematically defined (provided $P(A) > 0$).

  Propensities, however, are inherently **causal and asymmetric**. A propensity is a disposition of a physical setup to produce an outcome.
  *   It makes sense to say: "The propensity of this radioactive atom to decay given its current state is 0.5." (Cause $\to$ Effect)
  *   It does *not* make sense to say: "The propensity of this atom to have been in state X given that it decayed." (Effect $\to$ Cause)

  The latter isn't a physical disposition; it's an epistemic inference. But if propensities are supposed to *be* probabilities (obeying Kolmogorov axioms), they must support that inversion. Paul Humphreys (1985) argued that you cannot map propensities directly onto the standard probability calculus without breaking the calculus or stripping propensities of their causal meaning.

  To save Propensity Theory, you have to either:
  1.  Modify the probability calculus (very costly).
  2.  Argue that propensities ground probabilities but aren't identical to them (which complicates the "garden-variety" claim).
  3.  Accept that inverse probabilities are not propensities, but something else (which fragments the theory).

  ### 2. The Metaphysical Problem: The "Dormitive Virtue"
  You argue that propensities ground the numbers in the physical setup. Critics argue this is explanatory circularity.

  Molière famously mocked a doctor who explained that opium induces sleep because of its "dormitive virtue." It sounds like an explanation, but it's just naming the phenomenon ("sleep-inducing power") and pretending it's a cause.

  Critics of propensity theory argue:
  *   **Q:** "Why does this atom decay with probability 0.5?"
  *   **A:** "Because it has a propensity of 0.5 to decay."
  *   **Q:** "What is the propensity?"
  *   **A:** "The physical property that makes it decay with probability 0.5."

  Unless you can **reduce** propensities to something else (e.g., the wave function in quantum mechanics, or specific structural features of the chance setup), they risk being occult properties. Frequentism was hated because it was "metaphysically thin," but Propensity is sometimes hated for being "metaphysically bloated." It posits a new kind of universal property (dispositional chance) that exists only to satisfy our intuition that single-case probabilities are real.

  ### 3. The Reference Class Problem Returns (as the "Chance Setup" Problem)
  You noted that Propensity Theory solves the reference class problem because it attaches to the single case. However, a propensity is always a property of a **specific chance setup**.

  Consider a coin toss.
  *   Is the propensity determined by the coin?
  *   The coin + the thumb flick?
  *   The coin + the flick + the air pressure?
  *   The coin + the flick + the air pressure + the gravitational field?

  To define the propensity, you must specify the *conditions* of the setup. If you specify them too narrowly (this exact flick at this exact nanosecond), the propensity becomes 1 or 0 (determinism). If you specify them too broadly (a "coin toss"), you are back to a reference class.

  Finding the "right" level of abstraction for the chance setup turns out to be isomorphic to the reference class problem. You still need a principled way to decide which physical features are relevant to the propensity and which are noise.

  ### 4. Why the Debate Persists: Pluralism vs. Monism
  The reason the debate hasn't "settled" is that the philosophical consensus has shifted from **Monism** (There is One True Interpretation of Probability) to **Pluralism** (Probability is a cluster concept serving different roles).

  *   **Frequentism** is largely dead in metaphysics but alive in **statistics**. It provides the link between theory and data (convergence theorems).
  *   **Bayesianism (Subjectivism)** is the winner in **epistemology and decision theory**. It tells agents how to reason.
  *   **Propensity Theory** is the leading candidate for **metaphysics of science**, but it is distinct from the above.

  The modern synthesis is best represented by **David Lewis's Principal Principle**. Lewis argued that we should have *both* objective chances (propensities) and subjective credences (Bayesianism). The Principal Principle is a bridge rule: *Your subjective credence in an event should match the known objective propensity of that event.*

  So, the debate isn't "Propensity vs. Bayesian." It's "How do Propensity and Bayesianism interact?"

  ### 5. Why Rationalists Miss This
  The "rationalist" community (LessWrong, Slate Star Codex, etc.) is heavily influenced by E.T. Jaynes and decision theory. Their goal is **optimization of belief and action**.
  *   For an agent making bets, propensities are useless unless they can be translated into credences.
  *   Since you can't measure a propensity directly (you measure frequencies to infer propensities), a pragmatic agent treats everything as a state of knowledge.
  *   Therefore, in a *pragmatic* framework, Subjective Bayesianism "wins" because it's the only one that tells you what to *do*.

  Philosophy of science, however, cares about **truth-makers**. It wants to know what makes the statement "This atom has a 50% chance of decaying" true *even if no one is there to bet on it*. For that question, Subjectivism fails, and Propensity is the only game in town, despite its flaws.

  ### Summary
  Propensity theory hasn't settled the debate because:
  1.  **Humphreys' Paradox:** It struggles to fit the asymmetry of causation into the symmetry of the probability calculus.
  2.  **Circularity:** It risks defining chance in terms of chance without a reduction base.
  3.  **Setup Specification:** It inherits a version of the reference class problem regarding the definition of the "chance setup."

  It is not merely path dependence. It is the recognition that Propensity Theory solves the *metaphysical* problem of single-case objectivity at the cost of creating new *technical* and *epistemological* problems. The current "settled" view among experts is actually closer to your intuition than the rationalist blogs: **Propensity for the world (Chance), Bayesianism for the mind (Credence), Frequentism for the data (Statistics).** They are tools for different jobs, not rivals for the same throne.
