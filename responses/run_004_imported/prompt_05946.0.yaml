      *   *Point 2: Physical Causality.* Kepler introduced forces. Where did the idea of a solar force come from? From the idea that the Sun is the spiritual/physical heart of the system (neo-Platonism/Hermeticism). Astrology and Physics shared the concept of "aspects" (geometric angles) which transmitted influence.
      *   *Point 3: Reformed Astrology.* He wasn't just faking it. *Tertius Interveniens* argues for a naturalistic astrology (weather, psychology) vs. fatalistic astrology. This aligns with his search for natural causes in astronomy.
      *   *Point 4: Koestler's Shadow.* Gently point out that Koestler's *The Sleepwalkers* is now considered historically problematic. It portrays Kepler as a somnambulist stumbling on truth. Modern scholarship (Westman, Field, Gingerich, Martens) sees him as rigorous and coherent.
      *   *Conclusion:* The "two ledger" theory simplifies the biography but falsifies the epistemology. You can't understand *how* he got the laws without understanding *why* he looked for them.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm on the historiography.
