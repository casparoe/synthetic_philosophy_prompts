      *   *Is it true that the metaphysics was just "packaging"?* **No.** This is the critical flaw. Kepler didn't discover ellipses *despite* his metaphysics; he discovered them *because* of his search for physical causes rooted in that metaphysics.
      *   *Is Koestler reliable?* Koestler's *The Sleepwalkers* is famous for its "sleepwalker" metaphor (scientists stumbling on truth while asleep/deluded about why). Modern historians largely reject this. They see Kepler as a deliberate, coherent thinker, not a lucky stumblebum.

  3.  **Identify Key Historical/Philosophical Points to Address:**
      *   **The Unity of Knowledge:** For Kepler, physics, astronomy, theology, and astrology were not separate silos. They were all part of understanding God's creation.
      *   **Physical Causality:** Kepler revolutionized astronomy by asking *why* planets move, not just *how*. His answer (anima motrix/solar force) was rooted in the same metaphysical framework as his astrology (aspects, harmonies).
      *   **The Role of *Harmonices Mundi*:** The Third Law didn't come from data crunching alone; it came from the search for musical harmonies in planetary speeds. The metaphysics *drove* the data analysis.
      *   **Reformed Astrology:** Kepler didn't just "sell out." He actively tried to reform astrology based on physical rays (light/force), distinguishing it from superstition. This reform is linked to his optics and physics.
      *   **Whiggish History:** The user's view is a classic example of looking back and separating the "good stuff" (modern physics) from the "bad stuff" (astrology). Historians try to understand Kepler as *Kepler understood himself*.

  4.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by acknowledging that the "mercenary sideline" view is intuitive for modern readers. It makes sense *now*. Koestler popularized this.
      *   *The Pivot:* However, explain that historians reject this for substantive reasons, not just antiquarianism.
