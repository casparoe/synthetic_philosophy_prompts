      *   **Core Assumption:** They view Kepler's metaphysical/mystical works (*Mysterium Cosmographicum*, *Harmonices Mundi*) as "charming packaging" to make modern physics palatable to a pre-modern audience, not as integral to the discovery process.
      *   **The Question:** Why do historians of science insist on linking Kepler's astrology/metaphysics to his astronomy? Is it just antiquarian thoroughness, or is there a substantive reason regarding his actual reasoning that the "compartmentalized story" misses?
      *   **Underlying Misconception:** The user's view reflects a Whiggish interpretation of history (judging past science by modern standards) and relies heavily on Koestler's specific (and often criticized) narrative. It assumes a modern distinction between "science" and "pseudoscience" that didn't exist for Kepler.

  2.  **Evaluate the "Compartmentalized Story":**
      *   *Is it true that Kepler needed money?* Yes. He was Imperial Mathematician; casting horoscopes was part of the job.
