answer: |-
  Your roommate was right that you were "gesturing at something real but mangling it," but she was unhelpful in explaining *what* that something was. Your cousin is using a philosophical sledgehammer (radical skepticism) to smash a specific empirical claim, and because you don't have a philosophy degree, you felt like you got knocked down.

  Here is the good news: **No, your positions are not epistemologically equivalent.**

  Your cousin is claiming that because you cannot have *absolute, God's-eye certainty*, all beliefs are equally arbitrary. That is false. In epistemology (the study of knowledge), we distinguish between **certainty** (which is rare) and **justification** (which is how we live our lives).

  Here is the framework you need to understand the difference, why your ground is firmer than his, and how to explain it without just saying "trust NASA."

  ### 1. Inference to the Best Explanation (Abductive Reasoning)
  You are both using a type of logic called *abduction*. You look at a set of data and ask, "Which story best explains all of this?"

  *   **Your Story (The Landing):** To believe the landing happened, you have to accept that physics works as described, that film technology in the 60s was capable of certain things, that thousands of engineers told the truth, and that the Soviets (who had every incentive to expose a lie) confirmed the telemetry.
  *   **His Story (The Hoax):** To believe it was faked, he has to accept that physics works *except* when NASA is involved, that film technology was capable of faking it (but somehow we lost the tech?), that thousands of engineers kept a secret for 50 years without a deathbed confession, **AND** that the Soviets were either incompetent at tracking spacecraft or complicit in the lie.

  **The Difference:** Your belief requires fewer assumptions and contradicts fewer established facts. His belief requires a massive, ad-hoc overlay of new assumptions to explain why the old facts look the way they do.
  **The Argument:** "We aren't choosing between 'Certainty' and 'Doubt.' We are choosing between 'Explanation A' which fits with gravity, geology, and international politics, and 'Explanation B' which requires us to believe gravity and international politics suddenly stopped working for three days in 1969."

  ### 2. The "Web of Belief" (Coherentism)
  Philosopher W.V.O. Quine described knowledge as a web. Some beliefs are at the edge (e.g., "It is raining outside"), and some are near the center (e.g., "2+2=4" or "Objects fall when dropped").

  *   **Your Position:** The moon landing is connected to the center of the web. It is held in place by orbital mechanics, lunar geology (the rocks match the moon's composition, which we know from other missions), and radio telemetry tracked by independent observatories in Australia and Europe. If the moon landing was fake, you have to cut the strands connecting it to geology, physics, and Cold War history. The whole web shakes.
  *   **His Position:** The hoax theory is a "floating belief." It is not connected to the web; it *replaces* the web. To accept it, you have to sever the connections to physics and history and replace them with a single new strand: "Global Deception."

  **The Difference:** Your belief is **coherent** with the rest of how you understand reality. His belief is **isolated** and requires you to suspend your understanding of reality specifically for this one event.
  **The Argument:** "If I'm wrong, it's a mistake in history. If you're right, then physics, geology, and international relations are all fundamentally broken. I'm betting on the world making sense, not on the world being a stage play."

  ### 3. Falsifiability and the "Self-Sealing" Trap
  This is the most critical philosophical distinction.
  *   **Science (Your side):** Is *falsifiable*. If we found moon rocks that matched Earth granite, or if Soviet records showed they tracked the ship vanishing, the theory would die. The system is built to allow itself to be proven wrong.
  *   **Conspiracy (His side):** Is *self-sealing*. Any evidence against the hoax (e.g., "Here are the Soviet tracking logs") is absorbed as *more proof* of the hoax ("The Soviets were in on it!").

  **The Difference:** Your position admits the possibility of being wrong. His position defines itself by the impossibility of being proven wrong. A claim that cannot be tested is not a knowledge claim; it is a faith claim.
  **The Argument:** "What evidence would change your mind? If you say 'nothing,' then you aren't doing research, you're preaching. I can show you evidence that would change my mind. Can you?"

  ### 4. The "Cost of the Lie" (Bayesian Probability)
  In Bayesian terms, you weigh the *prior probability* of a hypothesis.
  *   **Prior Probability of Human Error/Truth:** High. Humans are bad at keeping secrets. Thousands of people worked on Apollo.
  *   **Prior Probability of Global Conspiracy:** Extremely Low. It requires perfect competence from thousands of people across multiple enemy nations for 50 years.

  Your cousin argues that "Governments lie." This is true. But there is a massive difference between **lying about a policy** (which requires a few press secretaries) and **faking a physical reality** (which requires thousands of technicians).
  **The Argument:** "Governments lie about crimes all the time. But lying about a crime involves hiding a body. Lying about the moon involves *building* a body that acts exactly like a moon, visible to our enemies, for years. Which is actually harder?"

  ### How to Talk to Him Next Time
  Do not bring more footage. He has already rejected the *source* of the footage. You need to talk about the *structure of his belief*.

  1.  **Acknowledge the Philosophical Point:** Start by disarming him. "You know, I thought about what you said. You're right. I didn't see it. I can't prove it with 100% certainty. Philosophically, we are both taking a leap of faith."
  2.  **Pivot to Pragmatism:** "But we take different *kinds* of leaps. My leap connects to everything else I know about how engines work, how rocks work, and how enemies behave. Your leap requires me to believe that *only this one thing* works differently than everything else in the universe."
  3.  **Ask About the Mechanism:** "I'm willing to entertain the idea. But help me understand the mechanism. How did NASA fake the radiation belts? How did they fake the laser reflectors left on the surface that observatories still bounce signals off today? I don't need you to prove it was real, I need you to explain how the fake was physically possible without breaking the laws of physics."
  4.  **The "Roommate" Move:** If he goes back to "You just trust your institutions," say this: "I don't trust the institutions. I trust the **friction**. If the Soviets, the Chinese, the Europeans, and independent astronomers all disagree on politics but agree on the telemetry, that's not an institution. That's friction. A conspiracy creates friction. The lack of friction is what convinces me."

  ### Summary
  Your cousin is hiding behind **Radical Skepticism**. It's a comfortable place to hide because it's unfalsifiable. But it's also useless. If you apply his standard ("I can't trust anything I didn't personally witness") to his own life, he couldn't trust that his food isn't poisoned, that his car brakes work, or that his bank account balance is real. He doesn't live that way. He only applies that skepticism to the one narrative he wants to reject.

  You are standing on **Inference to the Best Explanation**. It isn't perfect certainty, but it is the only way humans navigate reality. You aren't trusting "institutions"; you are trusting **consilience**—the fact that evidence from physics, geology, politics, and engineering all point to the same spot. He is trusting a story that requires all those fields to be wrong simultaneously.

  That is the defensible difference. You're betting on a coherent universe. He's betting on a magic trick.
