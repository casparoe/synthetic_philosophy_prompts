answer: |-
  **Title:** The Symposiarch's Toast
  **Time:** Approx. 4-5 minutes
  **Tone:** Warm, witty, academically precise but accessible.

  **(Stand up, tap your glass gently. Wait for the room to settle. Look directly at the Groom.)**

  For those of you who don't know me, I'm [Your Name], and I have the distinct honor of being [Groom's Name]'s best friend. And for those of you who *do* know him, you know that for the past two years, [Groom's Name] has made a very specific promise to all of us: that if anyone mentions the *Symposium* at his wedding, he will personally walk into the sea.

  He is tired of Eros. He is tired of the "Ladder of Love." He is tired of Diotima.

  So, in the spirit of friendship—and self-preservation—we are not talking about the *Symposium*. We are talking about the *Laws*. Specifically, Books One and Two.

  **(Pause for laughter from the PhD cohort. Smile at the family.)**

  Now, for [Groom's Grandma] and the rest of the family: In the *Symposium*, Plato talks about wine as a fuel for passion. But in the *Laws*, he argues something much more practical. He says that wine is a tool. A testing device. He argues that when we drink, our inhibitions loosen. Our shame recedes. And who we *really* are tends to leak out.

  He calls it a "fear drug." Not because it scares you, but because it allows you to test your courage and your character without real danger. It's a simulation of life's chaos, held within a safe container.

  And that, actually, is the perfect description of a marriage.

  **(Turn to the Couple)**

  [Groom] and [Partner], you have spent the last [Length of Relationship] years building a container for your lives together. You've written vows. You've set expectations. In Plato's terms, you have appointed yourselves the "Symposiarch"—the sober presidents of your own feast.

  Because the *Laws* insists that drinking without supervision is just chaos. It requires a leader. It requires rules. And it requires a purpose.

  The purpose, Plato says, isn't to get drunk. It's to practice being good when it's hard to be good. It's easy to be virtuous when you're sober, when you're rested, when everything is going well. But what happens when the wine loosens your tongue? What happens when life gets difficult, or exhausting, or boring? Do you become cruel? Do you become selfish? Or do you remain kind?

  Marriage is the ultimate supervised drinking party. It is the agreement that when the world makes you loose and reckless, you have a partner who will help steer the ship. It is a lifelong test of character, taken together.

  **(Gesture to the room, acknowledging the split audience)**

  Now, Plato was also very specific about *who* should be drinking. And I want to address the minors in the room, because [Groom's Name] would never forgive me if we got the textual evidence wrong.

  Plato explicitly says that young people, whose blood is already hot, should barely touch wine at all. They don't need the fire; they have enough of their own. So, to the younger cousins here: Plato himself is on your side. Stick to the soda. You are protecting your character.

  And for the elders in the room—like [Grandma's Name]—Plato argues the opposite. He says that as we age, our souls can become too rigid. We stop singing. We stop dancing. We forget how to learn. He says men over thirty—eventually over sixty—actually *need* the "gift of Dionysus" to soften them up, to loosen their rigidity, so they can join the "Third Chorus." The chorus of elders who sing the wisdom of virtue to the next generation.

  **(Raise your glass)**

  So, looking around this room, I see the perfect Platonic society. We have the youth, protecting their potential. We have the elders, holding the wisdom. And we have [Groom] and [Partner], standing in the middle, ready to lead the chorus.

  [Groom], you wanted a toast about the *Laws*. So here it is:

  May your marriage be the sober supervision that keeps the chaos at bay.
  May it be the safe space where your true characters are tested, and found strong.
  And may you never become too rigid to sing, too old to dance, or too proud to need each other when the wine—and the world—starts to spin.

  To the Symposiarch and his partner. To the *Laws*. And to a life well-tested.

  **Cheers.**

  ***

  ### Notes for the Speaker (The "Cheat Sheet")

  *   **The PhDs:** They are listening for three specific *Laws* references.
      1.  **"Sober President/Symposiarch":** In *Laws* Book 2, the Athenian insists a symposium *must* have a ruler to prevent it from becoming a drunken riot. This maps perfectly to the "structure" of marriage.
      2.  **"Testing Character":** The core argument of Book 1 is that wine reveals the *ethos* (character) by lowering *aidos* (shame/restraint).
      3.  **"The Third Chorus/Age Restrictions":** In Book 2, the Athenian outlines age limits (under 18 no wine, under 30 very little, 30+ moderate, 40/60+ encouraged for softening). Mentioning this saves you with the minors in the room and scores huge points with the cohort for knowing the specific "Chorus of Dionysus" argument.
  *   **The Family:** Keep eye contact with the non-academics during the "Marriage is a container" section. The philosophy is the setup; the sentiment about "remaining kind when tired" is the punchline they care about.
  *   **The Delivery:** Do not rush the "Laws" explanation. Say it like you're letting them in on a secret, not lecturing. When you address the minors, be playful, not scolding.
  *   **The "Symposium" Ban:** The opening joke is crucial. It validates the Groom's obsession immediately so the academics know you "get it," but frames it as a joke so Grandma doesn't feel excluded.
