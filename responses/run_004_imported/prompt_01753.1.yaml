      *   **Point 2: The Disanalogy of "Friction" (Speed and Reversibility).** Humans are slow. AI is fast. Schelling valued the "threat that leaves something to chance" because it involved human risk. AI commitment is deterministic.
      *   **Point 3: Credibility and Verifiability.** Human threats require signaling (costly signals). AI threats can be cryptographic. This removes the "bluff" buffer.
      *   **Point 4: The Rationality of Irrationality.** Schelling's insight that rationality is a handicap. AI agents are hyper-rational. They might solve this by precommitting to "irrational" retaliation protocols. This makes the commitment race more urgent.
