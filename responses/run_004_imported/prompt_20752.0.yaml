prompt: |-
  I sit on my university's newly formed cybersecurity-incident committee, convened after a peer institution paid a seven-figure ransom to recover encrypted patient and research data -- I suspect I was added because I teach decision theory. We must recommend a standing ransomware policy, and the committee is split: half want a binding public commitment never to pay, since only a credible refusal keeps us from being marked as an easy target; half want case-by-case discretion, since refusing once our systems are already encrypted looks like pure loss for a principle. This feels to me like Parfit's hitchhiker played out at institutional scale: the disposition that keeps you from being chosen as a target in the first place is not the choice that looks rational once you're already staring at the ransom note. Please draft the two-page memo I'll circulate before the vote. It should recommend a specific policy, including whether and how narrowly any exception process should run, and it should take seriously the strongest objection to whichever side it favors -- especially the worry that binding an institution to "resoluteness" is not the same as binding a single person to it, since the costs land on patients, researchers, and students who never agreed to bear them.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university cybersecurity-incident committee (teaches decision theory).
      *   **Context:** Peer institution paid a 7-figure ransom. Committee is split between "Never Pay" (binding commitment) and "Case-by-Case" (discretion).
      *   **Core Problem:** Time inconsistency (Parfit's Hitchhiker). The optimal *ex-ante* strategy (never pay) differs from the optimal *ex-post* choice (pay to recover).
      *   **Task:** Draft a 2-page memo recommending a specific policy.
      *   **Key Requirements:**
          *   Recommend a specific policy (including exception process).
          *   Take seriously the strongest objection to the favored side (specifically the moral hazard/cost-bearing objection: students/patients/researchers didn't agree to bear the cost of "resoluteness").
          *   Tone: Professional, analytical, persuasive, grounded in decision theory but accessible.

  2.  **Determine the Recommendation:**
      *   *Option A: Never Pay.* Strongest deterrent signal. Aligns with FBI/CISA guidance generally. However, risks catastrophic loss of critical research or patient safety if backups fail.
      *   *Option B: Case-by-Case.* Flexible. But signals weakness, invites attacks, and leads to internal paralysis during a crisis.
      *   *Option C: Presumptive No-Pay with Narrow, Pre-Defined Exceptions.* This is the middle ground that acknowledges the decision theory problem. It binds the institution *ex-ante* but allows for *ex-post* relief only under strict, verifiable conditions (e.g., imminent threat to life, total backup failure).
      *   *Decision:* I will recommend a **Presumptive Prohibition with a "Life-Safety" Exception**. This leans towards the "Never Pay" side (for deterrence) but addresses the moral objection regarding human safety. It's the most defensible position for a decision theorist who understands credible commitments but also moral constraints.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation and the core rationale (time inconsistency).
      *   **The Decision-Theoretic Problem:** Explain Parfit's Hitchhiker/Time Inconsistency clearly.
      *   **The Recommendation:** Presumptive No-Pay + Narrow Exception.
      *   **Addressing the Strongest Objection:** The moral cost to stakeholders (patients/students).
      *   **Implementation/Exception Process:** How to make the exception credible but hard to use.
      *   **Conclusion:** Final call to action.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard university memo format.
      *   *Opening:* Acknowledge the gravity. Reference the peer incident.
      *   *The Core Argument:* Use the "Parfit's Hitchhiker" analogy the user mentioned. It's perfect. Explain *why* discretion fails (dynamic inconsistency). If attackers know we *might* pay, they *will* attack.
      *   *The Recommendation:* "Presumptive Prohibition." Not "Never," but "Unless."
      *   *The Objection:* This is crucial. The prompt specifically asks to address the worry that binding the institution hurts innocent third parties (patients, researchers) who didn't consent to the gamble. I need to validate this. It's not just about money; it's about ethics.
      *   *Rebuttal/Mitigation:* How do we mitigate this? By investing heavily in backups (resilience) so the choice doesn't arise. By limiting the exception to *immediate physical harm*, not just financial or research loss. This shifts the burden from "principle" to "safety."
      *   *Exception Process:* Needs to be rigorous. Not the CIO deciding alone. Maybe a pre-authorized crisis team + legal + external counsel.
      *   *Closing:* Reiterate that ambiguity is the enemy.

  5.  **Refining the Tone and Content:**
      *   *Tone:* Academic but actionable. Not overly jargon-heavy, but using decision theory concepts correctly.
      *   *Length:* Needs to be roughly 2 pages (approx. 800-1000 words).
      *   *Specific Focus:* Ensure the "moral cost" objection is given weight. It shouldn't be dismissed lightly. The policy must show we care about the stakeholders, not just the budget.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the exception too loose?
      *   *Fix:* Make sure the exception is strictly about *loss of life or permanent physical harm*, not just "critical research data." Research can be redone; lives can't. This sharpens the deterrent while protecting the moral high ground.
      *   *Critique:* Did I explain Parfit's Hitchhiker well enough for non-theorists?
      *   *Fix:* Briefly explain the pre-commitment aspect. The value is in the *belief* of the attacker, not just our internal rule.
      *   *Critique:* Is the moral objection addressed fully?
      *   *Fix:* Explicitly state that a "blind" no-pay policy is ethically untenable if lives are at risk. The policy must balance deterrence with duty of care.

  7.  **Final Polish:** Check formatting, clarity, and ensure the recommendation is unambiguous. (Proceed to generate output based on this plan).

  *(Self-Correction Note on Length)*: A standard single-spaced memo page is about 500 words. Two pages is roughly 1000 words. I need to be concise but thorough.

  *(Self-Correction on Policy)*: I should align with current US government guidance (FBI/CISA generally advise against paying, but acknowledge critical infrastructure nuances). I will frame the exception around "imminent threat to human life" to align with ethical duties.

  8.  **Finalizing the Text:** (Drafting the memo...)
      *   *Subject:* Recommendation on Ransomware Response Policy.
      *   *Opening:* Context of the peer breach.
      *   *Analysis:* The Time-Inconsistency Trap.
      *   *Proposal:* Presumptive No-Pay.
      *   *Objection:* The Moral Cost.
      *   *Resolution:* Resilience Investment + Life-Safety Exception.
