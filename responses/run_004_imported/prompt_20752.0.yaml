answer: |-
  **MEMORANDUM**

  **TO:** Cybersecurity Incident Response Committee
  **FROM:** [Your Name], Faculty Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Standing Ransomware Payment Policy

  **Executive Summary**
  Following the recent seven-figure ransom payment by our peer institution, this committee must establish a standing policy to guide future responses. The committee is currently divided between a binding "Never Pay" commitment and a "Case-by-Case" discretion model. As a scholar of decision theory, I recommend we adopt a **Presumptive Prohibition on Payments**, coupled with a **narrow, pre-authorized exception process** strictly limited to scenarios involving imminent threat to human life or safety.

  This recommendation seeks to resolve the "time inconsistency" problem inherent in ransomware negotiations while addressing the ethical obligation we bear to patients, researchers, and students who did not consent to bear the costs of our strategic posture.

  **The Decision-Theoretic Problem: Parfit's Hitchhiker at Scale**
  The core tension before us is a classic problem of dynamic inconsistency, often illustrated by "Parfit's Hitchhiker." In that thought experiment, a driver will only rescue a stranded passenger if the passenger credibly commits to paying upon reaching town. However, once safely in town, the passenger's rational incentive is to renege. Knowing this, the driver never picks them up.

  In our context, the "driver" is the threat actor. They select targets based on the expected payout.
  *   **Ex-Ante (Before an attack):** Our optimal strategy is to convince attackers we will never pay. This lowers the probability of being targeted.
  *   **Ex-Post (After encryption):** Once systems are locked and operations halted, the rational incentive shifts. The cost of payment appears lower than the cost of permanent data loss or operational shutdown.

  If we adopt a "Case-by-Case" policy, we signal *ex-ante* that payment is possible. Rational attackers will discount our public denials and target us accordingly. By the time we are *ex-post*, we are already in the worst-case scenario. To maintain deterrence, our *ex-post* choice must be constrained by our *ex-ante* commitment. Ambiguity is our adversary; credibility is our defense.

  **Recommendation: Presumptive Prohibition with Life-Safety Exception**
  I propose the university adopt a standing policy stating: **"The university will not negotiate with or pay ransomware threat actors."**

  However, a blind commitment is ethically hazardous. This leads to the strongest objection against the "Never Pay" position.

  **Addressing the Strongest Objection: The Moral Cost of Resoluteness**
  The primary argument for discretion is moral, not financial. A binding commitment to "resoluteness" treats the university as a monolithic agent, but the costs of that resolve are borne by third parties who never agreed to the gamble.
  *   **Patients:** If clinical systems are locked, delays in care can cause physical harm.
  *   **Researchers:** Years of irreplaceable data can vanish, setting back scientific progress.
  *   **Students:** Academic records and financial aid systems can freeze, derailing careers.

  Critics argue that prioritizing a abstract principle of "deterrence" over concrete harm to vulnerable stakeholders is ethically indefensible. If we bind ourselves to never pay, we are effectively wagering with other people's safety to protect the institution's budget and reputation.

  **Resolution: Resilience and Narrow Exceptions**
  We can resolve this tension without sacrificing credibility. We must acknowledge that while *financial* ransom should never be paid, the *duty of care* supersedes the *duty of deterrence* when physical safety is at stake.

  Therefore, the policy must include an exception process, but it must be narrow enough to maintain credible deterrence against financial extortion.

  1.  **The Exception Threshold:** Payment may only be considered if there is a verified, imminent threat to human life or physical safety (e.g., locked ICU systems, emergency dispatch failure) that cannot be mitigated by failover systems. Loss of research data, financial loss, or reputational damage do **not** qualify.
  2.  **The Decision Authority:** The decision to invoke this exception cannot rest with the CIO or General Counsel alone during the crisis, as they are compromised by the immediate pressure. Authority rests with a pre-designated "Crisis Cabinet" (President, General Counsel, Chief Medical Officer, and Board Chair) requiring a unanimous vote.
  3.  **The "Resilience Dividend":** To mitigate the moral risk, this policy must be paired with an immediate, binding investment in offline, immutable backups. If our backups are robust, the *ex-post* choice to pay disappears because recovery is viable. We cannot claim a "No Pay" policy is ethical if we refuse to fund the infrastructure that makes that policy viable.

  **Implementation and Process**
  To operationalize this:
  *   **Public Posture:** We publicly state we do not pay ransoms. We do not publicize the exception clause details, preserving ambiguity for attackers while maintaining ethical cover for the Board.
  *   **Legal Compliance:** Any exception invocation requires immediate coordination with law enforcement (FBI/CISA) and OFAC compliance checks to ensure we are not sanctioning a prohibited entity.
  *   **Post-Incident Review:** Any invocation of the exception triggers an automatic external audit to determine why resilience measures failed.

  **Conclusion**
  A "Case-by-Case" policy invites attacks by signaling weakness. A rigid "Never Pay" policy risks unethical outcomes for our most vulnerable stakeholders. A **Presumptive Prohibition with a Life-Safety Exception** balances the need for credible commitment with our moral duty of care.

  By adopting this, we tell attackers that our data is not for sale, while assuring our community that their safety is not a bargaining chip. I move that we adopt this framework as the basis for our standing policy.
