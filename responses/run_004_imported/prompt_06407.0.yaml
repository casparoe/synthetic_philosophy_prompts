answer: |-
  **MEMORANDUM**

  **TO:** The Faculty Senate
  **FROM:** The Rules Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Voting Procedures for Elections and Referenda

  **Background**
  Last spring's Chair election demonstrated a specific pathology of plurality voting: the winner was ranked last by a majority of Senators, succeeding only because opposition votes fractured among three candidates. This outcome has prompted the Committee to review our voting rules. We have considered proposals for Ranked-Choice Voting (RCV), Approval Voting, and the status quo. We have also considered the theoretical limits of voting systems.

  **The Theoretical Constraint: Gibbard–Satterthwaite**
  One Committee member, drawing on social choice theory, correctly noted the Gibbard–Satterthwaite theorem. This theorem proves that no voting system with three or more options can be entirely immune to strategic manipulation; in some scenarios, a voter may benefit by misrepresenting their preferences.

  We take this objection seriously. It would be dishonest to claim that any reform guarantees sincere voting or perfect outcomes. However, the theorem establishes an *impossibility*, not an *equivalence*. While all systems are manipulable *in theory*, they differ vastly in *practice*. Some systems require voters to possess precise knowledge of others' ballots to manipulate successfully; others make such strategy high-risk. Our goal is not to achieve a strategy-proof utopia (which is mathematically impossible), but to adopt rules where sincerity is the *safest* strategy and where the cost of manipulation is high.

  **Recommendation 1: Personnel Elections (Chair, Officers)**
  **Recommendation:** Adopt **Ranked-Choice Voting (Instant Runoff)**.

  **Rationale:** The failure of plurality voting lies in the "spoiler effect," where similar candidates split the vote, allowing a broadly unpopular candidate to win. RCV mitigates this by allowing Senators to rank candidates. If no candidate receives a majority of first-place votes, the last-place candidate is eliminated and their votes redistribute.

  While RCV is not immune to strategy, it removes the incentive for "lesser-of-two-evils" voting. Senators can rank their genuine favorite first without wasting their vote. This directly addresses last spring's failure: under RCV, a candidate ranked last by a majority would almost certainly be eliminated in early rounds. We rejected Approval Voting for elections because, in small bodies like the Senate, it often devolves into "bullet voting" (approving only one's top choice), effectively replicating plurality pathologies.

  **Recommendation 2: Policy Referenda (e.g., Budget Increases)**
  **Recommendation:** Adopt **Pairwise Majority Voting** for single-dimensional issues.

  **Rationale:** As noted by the Committee, the pending budget referendum (0%, 3%, 6%) is single-dimensional. When options can be ordered along a spectrum and voter preferences are "single-peaked" (i.e., a Senator prefers 3% to either 0% or 6%, rather than preferring both extremes to the middle), the Median Voter Theorem applies.

  In this specific context, pairwise majority voting (comparing options head-to-head to find the Condorcet winner) is robust. It identifies the option that commands majority support against any alternative. Unlike multi-candidate elections, where preferences are complex, single-dimensional policy votes are less susceptible to the cycling instabilities described by Arrow's Theorem.

  **Conclusion**
  Reform is not a panacea. The Gibbard–Satterthwaite theorem reminds us that voting is an aggregation of human will, not a mechanical calculation of truth. Strategic behavior will always remain possible. However, moving from Plurality to Ranked-Choice for elections, and utilizing Pairwise Majority for single-dimensional referenda, significantly raises the barrier to manipulation. These systems do not guarantee that every Senator will get their first choice, but they do guarantee that the winners will not be the candidates the majority explicitly rejected.

  We recommend the Senate adopt these procedures to ensure our outcomes reflect consensus rather than vote-splitting artifacts.
