answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Independence Axiom in Grantmaking Decisions

  ### 1. Purpose

  At our recent strategic retreat, the facilitator highlighted a pattern in our voting behavior consistent with the Allais Paradox: we collectively preferred certainty in high-probability scenarios but preferred higher expected value (EV) in low-probability scenarios. This violates the **Independence Axiom** of standard Expected Utility Theory (EUT).

  Following this, a proposal was raised to adopt a standing rule binding all future grant comparisons to the Independence Axiom to ensure rational consistency. This memo evaluates that proposal. **I recommend against adopting a rigid binding rule.** Instead, I propose we adopt a formalized **Risk-Weighted Decision Framework** that allows for deviation from strict EV maximization provided the risk parameters are explicit and stable.

  ### 2. Context: The Allais Paradox and Our Choices

  To recap the retreat exercise, we faced two paired choices:

  *   **Choice 1:** (A) 100% chance to save 1,000 lives **vs.** (B) 89% chance to save 1,000, 10% chance to save 5,000, 1% chance to save 0.
      *   *Board Preference:* Most chose **(A)** (Certainty).
  *   **Choice 2:** (C) 11% chance to save 1,000 **vs.** (D) 10% chance to save 5,000.
      *   *Board Preference:* Most chose **(D)** (Higher EV).

  Under standard EUT, choosing (A) implies you value the extra 1% certainty of saving 1,000 lives more than the expected gain of the gamble. Choosing (D) implies the opposite. Mathematically, these preferences contradict one another. If we hold both, we are theoretically vulnerable to a "money pump" (a series of trades that leaves us worse off with no gain), suggesting our decision-making process is incoherent.

  ### 3. The Case for Binding the Independence Axiom

  Proponents of the standing rule argue that as an Effective Altruism (EA) foundation, our primary fiduciary duty is to maximize expected good. There are three compelling arguments for binding ourselves to the Independence Axiom (and thus standard EUT):

  **A. Protection Against Exploitability and Incoherence**
  The strongest argument for the Independence Axiom is dynamic consistency. If our preferences change based on how options are "packaged" (e.g., grouping probabilities differently), we become vulnerable to Dutch booking. A competitor or grantee could theoretically structure proposals that exploit our inconsistency, extracting resources from us without generating additional impact. A binding rule acts as an immune system against manipulation and internal inconsistency.

  **B. The Long-Termist Imperative**
  EA philosophy generally posits that we should act as if we are part of a large portfolio of decisions over time. While any single grant is a "one-off," the foundation's lifespan involves hundreds of grants. Over the long run, the Law of Large Numbers dictates that maximizing Expected Value (EV) in every individual decision maximizes total lives saved. Deviating from EV to pursue certainty creates a "certainty tax" that compounds over time, potentially costing thousands of lives in forgone impact.

  **C. Impartiality and Justifiability**
  Standard EUT provides a neutral, mathematical language for justifying decisions to donors and stakeholders. It asserts that a life saved with 10% probability is worth exactly 10% of a life saved with 100% probability. Introducing subjective risk weights risks introducing bias. If we begin to value "certain" lives over "probabilistic" lives, we may systematically underfund high-risk, high-reward biosecurity research—the very work that might prevent existential catastrophes.

  ### 4. The Case for Flexibility (Risk-Weighted Expected Utility)

  While the arguments for EUT are theoretically robust, they rely on assumptions that do not hold for a small foundation operating in high-stakes domains. I recommend we reject the binding rule in favor of a framework based on **Risk-Weighted Expected Utility (REU)**, such as that proposed by Lara Buchak.

  **A. The "Small Portfolio" Reality**
  The EUT argument relies on the ability to average out risk over many trials. However, we are a *small* foundation. We do not have the capital to absorb a string of failures in pursuit of long-term EV. If we take a series of 10% chance bets and they all fail, we do not get to play again; our endowment is depleted, and our impact drops to zero. For a small actor, "ruin" is a real constraint. Prioritizing certainty in Choice 1 is not irrational risk aversion; it is capital preservation.

  **B. Non-Repeatable High-Stakes Bets**
  In biosecurity, some decisions are truly non-repeatable. If we fund a containment protocol that has a 90% chance of success but fails, the consequence may be catastrophic in a way that cannot be offset by future grants. Buchak's REU theory demonstrates that an agent can rationally prioritize the *structure* of risk (e.g., avoiding the worst-case scenario) independently of the utility of the outcome. This is not a cognitive bias; it is a distinct ethical stance on the distribution of risk.

  **C. Avoiding the "Incoherence" Trap**
  Critics argue that violating Independence leads to incoherence. However, REU theory provides a consistent axiomatic system that relaxes Independence without lapsing into money-pump vulnerability, provided the decision-maker is "resolute." By formally adopting a risk-function (e.g., "we weight worst-case scenarios 20% higher than linear probability suggests"), we remain consistent *within that framework*. We are not being inconsistent; we are simply using a different, valid mathematical model for decision-making under uncertainty.

  **D. Board Functionality**
  Finally, a binding EUT rule may lead to paralysis or alienation. If board members feel compelled to vote for counter-intuitive gambles that jeopardize the foundation's solvency, engagement will suffer. Allowing for explicit risk weighting acknowledges the human reality of stewardship while maintaining rigor.

  ### 5. Recommendation

  I recommend that the Board **vote against the proposal to bind grantmaking to the Independence Axiom.**

  Strict adherence to EUT is appropriate for a global, aggregated movement, but it is suboptimal for a specific, small institution facing ruin constraints. However, to address the valid concerns regarding consistency and exploitability, I propose the following alternative policy:

  **Adopt a "Risk-Adjusted Expected Value" Policy:**
  1.  **Default Presumption:** All grants should be evaluated primarily on Expected Value.
  2.  **Explicit Risk Weighting:** When the Board prefers a lower-EV option due to certainty or risk mitigation (as in Allais Choice 1), the grant proposal must include a **Risk Justification Statement**. This statement must define the specific risk parameter being valued (e.g., "avoidance of zero-impact year").
  3.  **Stability Requirement:** Once a risk-weighting function is adopted for a fiscal year, it must be applied consistently across all grants to prevent dynamic inconsistency (money pumps).

  ### 6. Next Steps

  If the Board agrees with this direction, I suggest we task the Grants Committee with drafting a "Risk Justification" template for the next quarter. This allows us to capture the value of certainty without surrendering our commitment to rational, impactful philanthropy.

  I look forward to discussing this at our next meeting.
