prompt: |-
  I'm on the board of a small foundation, run along effective-altruist lines, that funds global-health and biosecurity work. At a recent retreat, our facilitator posed two paired grant choices: (1) a program certain to save 1,000 lives versus one with an 89% chance of saving 1,000, a 10% chance of saving 5,000, and a 1% chance of saving none; (2) an 11% chance of saving 1,000, otherwise nothing, versus a 10% chance of saving 5,000, otherwise nothing. Almost everyone took the certain option in (1) and the higher-expected-value gamble in (2) -- the classic Allais paradox, since no expected-utility function over lives saved can rationalize both choices at once. Some board members now want a standing rule that all grant comparisons respect the independence axiom, since tolerating the inconsistency leaves us exploitable across repackaged versions of the same choice; others reply that it's not obviously irrational for a funder making rare, high-stakes, non-repeatable bets to weight certainty heavily, citing decision theories like Buchak's risk-weighted expected utility that relax independence without lapsing into incoherence. Draft the memo I'll circulate to the board recommending whether we should bind our grantmaking to the independence axiom, giving a fair hearing to whichever side you don't recommend.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Context:** Board member of a small Effective Altruism (EA) foundation (global health & biosecurity).
      *   **Situation:** A retreat revealed the Allais Paradox in grant choices (certainty vs. high EV gamble).
      *   **Conflict:** Some want a standing rule enforcing the Independence Axiom (standard Expected Utility Theory - EUT). Others argue for risk-weighted approaches (e.g., Buchak's Risk-Weighted Expected Utility - REU) given the high-stakes, non-repeatable nature of the funding.
      *   **Task:** Draft a memo to the board recommending whether to bind grantmaking to the independence axiom.
      *   **Requirement:** Give a fair hearing to the side *not* recommended.

  2.  **Determine the Recommendation:**
      *   *Option A: Enforce Independence Axiom (EUT).*
          *   Pros: Consistency, avoids money pumps/Dutch books, aligns with long-termist EA orthodoxy (maximize expected value), easier to justify to donors/stakeholders mathematically.
          *   Cons: Ignores risk aversion regarding catastrophic failure (especially in biosecurity), might feel counterintuitive for "one-shot" decisions, could lead to overly risky portfolios in small foundations.
      *   *Option B: Allow Relaxation (REU/Risk-Weighted).*
          *   Pros: Reflects intuitive risk aversion, protects against ruin in small portfolios, acknowledges the non-repeatable nature of specific grants.
          *   Cons: Vulnerable to dynamic inconsistency (potentially), harder to formalize, might lead to suboptimal long-term impact if applied too broadly.
      *   *Decision:* For an *Effective Altruism* foundation, the core tenet is usually maximizing expected good. However, the "small foundation" and "biosecurity" aspects add nuance. Biosecurity often involves tail risks. But the Allais paradox specifically highlights *inconsistency*.
      *   *Strategic Choice:* Recommending *against* a strict binding rule (Option B) is likely more pragmatic and philosophically defensible for a small board making high-stakes decisions, *but* recommending *for* the Independence Axiom (Option A) is more aligned with strict EA rationality.
      *   *Wait, let's look at the "exploitable" argument.* The prompt mentions tolerating inconsistency leaves them exploitable. This is a strong argument for EUT. However, Buchak's REU is specifically designed to avoid incoherence while relaxing independence.
      *   *Better Angle:* The strongest EA position is usually maximizing Expected Value (EV). However, for a *small* foundation, survival and risk management matter. If they go bust, they save zero lives.
      *   *Actually, the most balanced and sophisticated EA take:* Strict adherence to EUT is the theoretical ideal for *global* welfare, but operational constraints matter. However, the prompt asks to recommend *whether to bind*. Binding creates rigidity.
      *   *My Recommendation:* I will recommend *against* a rigid standing rule enforcing the independence axiom, favoring a flexible approach that acknowledges risk weights (REU) while guarding against dynamic inconsistency. Why? Because the "small foundation" context makes the "non-repeatable bet" argument salient. If you lose the capital on a 10% chance, you can't fund anything else. EUT assumes you can average out over infinite trials. A small foundation cannot.
      *   *Counter-argument (to be treated fairly):* The EUT/Independence argument (avoiding Dutch books, maximizing long-term impact, alignment with EA orthodoxy).

      *Refining the Recommendation:* Actually, looking at EA literature (e.g., GiveWell, OpenPhil), they generally lean heavily on EV. But the Allais Paradox is about *consistency*. If you violate independence, you are vulnerable to money pumps *unless* you have a specific alternative theory (like Buchak's). The prompt mentions Buchak.
      *Let's pivot:* I will recommend *adopting the Independence Axiom as a default presumption but not an absolute binding rule*. No, the prompt asks "whether we should bind". Binary choice is better for a memo recommendation.
      *Let's go with: Do NOT bind to the Independence Axiom.*
      *Reasoning:* The foundation is small. Ruin is real. Risk aversion is rational for non-repeatable high-stakes decisions. Buchak's framework provides the theoretical cover.
      *Fair Hearing:* I must robustly defend the EUT/Independence side (Dutch books, long-termism, impartiality).

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the issue (Allais Paradox retreat finding), the proposal (bind to independence axiom), and the recommendation (Reject the binding rule; adopt a nuanced risk framework).
      *   **Background:** Briefly explain the retreat choices and the paradox.
      *   **The Case for Binding (The "Independence" Side):** This needs to be the "fair hearing" for the side I'm *not* recommending.
          *   Rationality & Consistency: Avoiding money pumps/Dutch books.
          *   Long-termism: Over many grants, EV maximizes lives saved.
          *   Impartiality: Every life counts equally; risk preferences shouldn't distort this.
          *   Donor Trust: EUT is the standard language of EA.
      *   **The Case for Flexibility (The "Risk-Weighted" Side):** This is my recommendation.
          *   Small Portfolio Reality: We can't rely on the law of large numbers. Ruin = 0 impact.
          *   Biosecurity Context: Some risks are existential or catastrophic; certainty has premium value.
          *   Buchak's REU: It's not "irrational," it's a different axiomatic system that accounts for risk attitude as a separate parameter from utility.
          *   Operational Pragmatism: Board members need to sleep at night; rigid EV maximization can lead to burnout or paralysis on "sure thing" opportunities.
      *   **Recommendation:** Do not adopt a standing rule binding us to the independence axiom. Instead, adopt a "Risk-Adjusted Expected Value" framework.
      *   **Implementation:** How to apply this without being exploitable? (e.g., explicit risk parameters, periodic review).
      *   **Conclusion:** Final wrap-up.

  4.  **Tone and Style:**
      *   Professional, analytical, respectful of EA jargon (EV, long-termism, independence axiom, Dutch book).
