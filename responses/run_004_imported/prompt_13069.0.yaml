  *Let's finalize the recommendation:* Recommend against a *standing rule* binding us to the axiom, but recommend a *policy* that requires explicit documentation when deviating from EV maximization to ensure we aren't just being inconsistent ad-hoc. This captures the spirit of Buchak (risk function is stable) without the rigidity of EUT.

