prompt: |-
  I'm on my regional amateur athletics association's competition integrity panel -- basically the volunteer group that sorts out weird rules disputes at adult club track meets. Here's the case that's landed on us: a club's 4x400m relay team set a new meet record, but about ten days later one of the four runners' post-meet drug test came back positive for a banned stimulant. The other three were tested too and came back clean, and they're adamant they had no idea. Our rulebook has exactly one sentence that bears on this: a team's time "constitutes a single joint performance for record and results purposes." Half the panel thinks that sentence just settles it -- one performance, one violation found anywhere inside it, the whole thing is void, done. The other half thinks that sentence is just a scoring convention (so we're not stuck recording four separate times) being stretched to answer a totally different question about who's fault this is, and that voiding the other three legs, or worse, sanctioning those guys personally, just punishes people for a teammate's secret cheating they had zero part in. It doesn't help that a relay isn't really four people running back to back -- the handoffs are timed and paced against each other and drilled together for months -- so it's not crazy to call the whole thing one performance rather than four.

  I need to write the panel's short ruling memo before next week's meeting: does the record stand, get voided outright, get voided with some kind of asterisk, whatever -- and, separately, whether the three clean runners face any personal consequence beyond the result itself changing. I want the memo to actually work through what makes a relay result "joint" in whatever way bears on this question, instead of just picking a side and repeating the rulebook sentence louder. My co-panelist thinks this is obviously just a fairness-to-the-innocent-bystander issue and there's nothing deeper to it, but I've got a feeling it's more tangled than that.
reasoning: |-
  Here's a thinking process that leads to the suggested ruling memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a regional amateur athletics association's competition integrity panel (volunteer group).
      *   **Task:** Write a short ruling memo for the next meeting.
      *   **Case:** A 4x400m relay team set a meet record. One runner tested positive for a banned stimulant 10 days later. The other three tested clean and claim ignorance.
      *   **Rule:** One sentence: "a team's time 'constitutes a single joint performance for record and results purposes.'"
      *   **Conflict:** Half the panel thinks the rule means automatic disqualification (DQ) of the whole team/record. The other half thinks it's just a scoring convention and punishing the clean runners is unfair.
      *   **Goal:** The memo needs to *analyze* what makes a relay result "joint" in this context, not just pick a side based on the literal text. It needs to address:
          1.  Does the record stand, get voided, or get asterisked?
          2.  Do the three clean runners face personal consequences?
      *   **Tone:** Professional, analytical, balanced, decisive (it's a ruling memo), but acknowledging the complexity (as requested by the user).
      *   **User's Insight:** The user feels it's more tangled than just "fairness to bystanders" because a relay *is* interdependent (handoffs, pacing), not just four individual runs summed up.

  2.  **Deconstruct the Core Issue:**
      *   **The Rule:** "Single joint performance."
      *   **Interpretation A (Strict Liability/Unitary):** The team is one entity. If one part is poisoned, the whole entity is tainted. The record is invalid because the *performance* that generated it was illicit.
      *   **Interpretation B (Individual Liability/Severable):** The rule is for *recording* times, not for *adjudicating* faults. Punishing innocents violates principles of natural justice.
      *   **The "Joint" Nature of a Relay:** It's not just $T_1 + T_2 + T_3 + T_4$. It's about the baton exchange, the morale, the pacing strategy. If Runner 2 is doped, did that help Runner 3's incoming speed? Did it change the psychological dynamic?
      *   **Precedents (Real World):** In IAAF/World Athletics rules, if one relay member is disqualified for doping, the whole team is usually disqualified from that race. However, individual sanctions usually apply only to the offender. Records are stripped.
      *   **Amateur/Regional Context:** The stakes are lower (meet record vs. Olympic gold), but the principles of fairness and integrity matter. The rulebook is sparse (only one sentence), requiring interpretation.

  3.  **Drafting Strategy - The Memo Structure:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Decision:** State the conclusion clearly up front (standard for legal/admin memos).
      *   **Facts:** Briefly summarize the case.
      *   **Analysis of the Rule ("Joint Performance"):** This is the crux. I need to define *why* it's joint.
          *   *Interdependence:* The baton pass. The dopant might have affected the team dynamic, even if not physically passed on.
          *   *Integrity of the Record:* A record represents a clean benchmark. A tainted performance cannot stand as a benchmark, regardless of individual guilt.
          *   *Distinction between Result and Sanction:* The *result* (the time/record) belongs to the team. The *sanction* (suspension/fine) belongs to the individual.
      *   **Ruling:**
          1.  Record: Voided (cannot stand as a valid meet record).
          2.  Clean Runners: No personal sanction (suspension/ban), but the result is lost.
      *   **Recommendation for Rulebook:** Suggest clarifying the rule for the future.

  4.  **Refining the Argument (Addressing the User's "Tangled" Feeling):**
      *   The user wants to avoid just repeating the rule. I need to explain *why* a relay is a single performance in the context of doping.
      *   *Argument:* A relay record isn't the sum of four splits; it's the product of five interactions (3 handoffs + 4 runs). If one component is artificially enhanced, the *interaction* is compromised. Therefore, the "performance" is invalid.
      *   *Counter-argument (Fairness):* It feels unfair to the clean runners.
      *   *Resolution:* Distinguish between *collective result* and *individual culpability*. They lose the medal/record (collective), but they don't lose their eligibility/reputation (individual). This balances integrity with fairness.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Needs to sound like a volunteer panelist writing to colleagues. Not overly legalese, but authoritative.
      *   *Key Phrase:* "Integrity of the Competition" vs. "Individual Culpability."
      *   *The "Asterisk" Idea:* Generally, sports bodies don't use asterisks for doping. They vacate. I should recommend vacating to maintain the standard that records must be clean.
      *   *The Clean Runners:* They shouldn't be suspended. That's disproportionate.

  6.  **Final Polish:**
      *   Make sure the distinction between the *status of the record* and the *status of the athletes* is sharp.
      *   Ensure the analysis of "joint performance" goes beyond the text of the rule into the nature of the sport.
      *   Check against the prompt: "Does the record stand... separately, whether the three clean runners face any personal consequence."

  7.  **Self-Correction during drafting:** I initially thought about suggesting an asterisk. But in athletics, a record is either valid or it isn't. An asterisk implies "it happened but doesn't count," which is effectively voiding it. Better to be clear: The record is vacated. The time remains on the sheet but is marked as disqualified.
      *   *Wait, one nuance:* In some jurisdictions, if the doped runner ran the first leg, does it affect the last leg as much? In a 4x400, yes, because of team morale and pacing. But strictly speaking, the rule says "single joint performance." I should stick to that interpretation.
      *   *Focus:* The prompt asks me to write the memo *for* the meeting, essentially proposing the ruling. It needs to persuade the other half of the panel.

  8.  **Finalizing the Memo Structure:**
      *   **Subject:** Ruling on [Club Name] 4x400m Relay Record & Doping Violation.
      *   **Decision:** Record Vacated; Clean Athletes Sanction-Free.
      *   **Reasoning:**
          1.  Nature of "Joint Performance" (Interdependence).
          2.  Integrity of Records (Benchmarking).
          3.  Proportionality of Sanctions (Culpability).

  9.  (Self-Correction on Tone): The user said "I want the memo to actually work through what makes a relay result 'joint'." I need to make sure that section is robust. I will emphasize the *synergy* of the relay.

  10. **Final Review against constraints:** Short ruling memo. Addresses record status. Addresses clean runner consequences. Analyzes "joint performance."

  *(Self-Correction)*: I should ensure I don't sound like I'm making up new rules, but interpreting the existing one. The existing rule is the anchor.

