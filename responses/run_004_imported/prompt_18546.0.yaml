answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The remains of espresso cups sit between two philosophers, ELARA (Hartian) and JULIAN (Devlinian). They have just left a seminar where the *Brown* case was dissected.*

  **Julian:** You looked dissatisfied when the seminar leader suggested *Brown* was an easy win for the liberal.

  **Elara:** Because it isn't. If we are being honest, *Brown* is the stress test that cracks the Harm Principle. But that doesn't mean we hand the gavel to Devlin. The House of Lords convicted those men because their acts were "degrading." That is moralism, pure and simple.

  **Julian:** Is it? Or is it a recognition that society has an interest in the sanctity of bodily integrity that transcends individual consent? Look, Elara, we always teach Hart–Devlin through Wolfenden. Homosexuality is the ghost at every feast. But *Brown* removes the distraction of sexual orientation. This is about violence. Devlin's argument isn't about sin; it's about cohesion.

  **Elara:** It's always about sin with Devlin, even when he dresses it up as sociology. His "disintegration thesis" is that if you loosen the bond of shared morality, society falls apart. But where is the evidence? He offers none. It's an empirical claim—that tolerating private immorality leads to social collapse—supported by nothing but assertion. In *Brown*, we have five men in a private dungeon. No public disturbance. No victims crying out to the police. How does *that* loosen the bond?

  **Julian:** You're treating morality like a set of optional bylaws. For Devlin, shared morality is the cement. It's not just that people *happen* to agree; it's that the society *exists* only insofar as they agree on certain fundamental norms. Think of the analogy Devlin uses, the one everyone skips over: Treason.

  **Elara:** The treason analogy is a category error.

  **Julian:** Is it? In treason, the state punishes an act even if no specific individual is physically harmed, because the act attacks the existence of the state itself. Devlin argues that a society is a community of ideas, not just a collection of bodies. If you allow people to treat human bodies as commodities for pain and degradation, you aren't just harming the participant; you are attacking the idea of the person that holds the community together. The victim in *Brown* isn't just the man with the brand; it's the shared understanding that bodies are not for breaking.

  **Elara:** That is definitional sleight of hand. You're defining "society" as "a group of people who agree that S&M is wrong." If they stop agreeing, you say the society has disintegrated. But by that metric, any shift in positive morality counts as disintegration. We stopped burning witches. Society didn't collapse; it improved. Devlin's thesis is unfalsifiable. If society changes, it's disintegration. If it stays the same, it's stability.

  **Julian:** No, that's the caricature. Devlin knows societies evolve. The question is the *rate* and the *method*. He isn't saying every moral shift is fatal. He's saying the law is entitled to protect the *fundamental* morality from being eroded by private acts that normalize the unacceptable. And how do we know what's fundamental? We use his test. The "man on the Clapham Omnibus." Does the act provoke feelings of "intolerance, indignation, and disgust"?

  **Elara:** And there it is. The tyranny of the squeamish. "Disgust" is a terrible metric for criminal liability. Historically, interracial marriage provoked disgust. So did women voting. If the law codifies the visceral reaction of the majority, you lose the minority's right to liberty entirely. In *Brown*, the disgust was largely homophobia masquerading as concern for public health.

  **Julian:** Devlin anticipates that. He distinguishes between mere dislike and deep, societal revulsion. He says the law shouldn't protect mere squeamishness. But when the revulsion is rooted in a judgment that an act is inherently degrading to human dignity, that's not just a taste preference. It's a boundary marker. In *Brown*, the Law Lords weren't just saying "Ew." They were saying that consent cannot legitimize the infliction of injury for pleasure. If you remove that barrier, where does it stop?

  **Elara:** It stops at the Harm Principle. Which brings me to my real worry, and it's not about Devlin. It's about us. If I'm a Hartian, *Brown* is awkward.

  **Julian:** Finally, some honesty.

  **Elara:** Hear me out. The Harm Principle allows for paternalism in limited cases. We mandate seatbelts. We ban certain drugs. We say, "You cannot consent to certain risks because the state has an interest in your capacity as a citizen." But if I accept that the state can stop me from harming *myself* for my own good, why can't it stop me from letting someone else harm me for my good? If the injury is the same, why does the presence of a second party make it a liberty interest?

  **Julian:** Exactly. If you admit paternalism is legitimate, you've conceded that the individual is not the absolute sovereign of their own flesh. Once you concede that, Devlin wins. Because then the question isn't "Is there harm?" It's "Who decides what harm is permissible?" And if the majority decides that ritualized violence is impermissible harm, regardless of consent, you are enforcing a moral judgment about the value of the body.

  **Elara:** Not necessarily. I can distinguish *Brown* from seatbelts on the grounds of public goods. Seatbelts reduce public healthcare costs; they protect the tax base. *Brown* was private. But I grant you this: The Hartian line gets thin when the harm is permanent. If the men in *Brown* had blinded each other, consent would definitely be void. So there is a threshold.

  **Julian:** But who sets the threshold? You? The judge? Or the moral consensus of the community? If you say the judge sets it based on "reason," you're smuggling in morality. Why is blinding someone for pleasure wrong but blinding someone for surgery right? The difference isn't physical harm. It's the *purpose*. And judging the purpose is judging the morality.

  **Elara:** It's not morality in the Devlinian sense. It's about the social institution of consent. Consent is a mechanism we use to facilitate cooperation and autonomy. But consent loses its moral force if it's used to destroy the very capacity for autonomy. If I sell myself into slavery, the contract is void. Not because the majority is disgusted, but because autonomy cannot be used to extinguish autonomy. In *Brown*, the harm was significant enough that it arguably compromised their future agency.

  **Julian:** But they didn't think so. They testified they felt empowered. You're imposing an external valuation of their good over their internal valuation. That's paternalism. And if you're going to be a paternalist, why not a moralist? If the state can say, "You are wrong about what is good for your body," why can't it say, "You are wrong about what is good for your soul," or "good for your society"?

  **Elara:** Because the latter is unbounded. "Good for the soul" is infinite. "Good for the body" has medical limits. But let's go back to your disintegration thesis. Even if I grant you that shared morality is the cement, criminalizing private acts is a clumsy trowel. Did *Brown* actually threaten the fabric of British society? There was no outcry before the police raided the house. The "disgust" was manufactured *after* the prosecution began. Devlin says the law follows the morality, but here the law was used to *create* the moral panic.

  **Julian:** That's a risk, I admit. Devlin acknowledges the law should be slow to act. But the absence of public outcry doesn't mean the absence of a threat. Treason often happens in secret. You don't wait for the revolution to start before you ban the plotting. If the norm shifts—if it becomes acceptable to inflict pain for pleasure—the change happens in the private sphere first. By the time the public sees the disintegration, it's too late to use the law to shore it up.

  **Elara:** But that assumes the norm *is* a threat. This is the empirical gap again. You assume that moral pluralism leads to chaos. I assume it leads to tolerance. In *Brown*, the "chaos" was a few men with wax and knives. The "stability" you want to preserve is a specific, rather rigid view of sexual propriety.

  **Julian:** It's not sexual propriety. It's the non-instrumentalization of persons. Kant would agree with Devlin here. If you use a person as a mere means to sexual gratification through pain, you violate their dignity.

  **Elara:** Kant also said lying is always wrong. We don't criminalize lying. Dignity is a moral concept, Julian. If you criminalize violations of dignity where no non-consenting victim exists, you are legally enforcing morality. You are saying the state owns the concept of dignity.

  **Julian:** The state owns the monopoly on violence. That's the Weberian definition. In *Brown*, the men were privatizing violence. They were acting as judge and executioner of pain in a closed circle. The state has an interest in being the sole arbiter of legitimate violence.

  **Elara:** Boxing.

  **Julian:** Excuse me?

  **Elara:** Boxing. Prize fighting. Men beat each other unconscious for money and public entertainment. It is legal. The harm in *Brown* was less than the harm in a heavy-weight title fight. The only difference is that boxing is "sport" and *Brown* was "sex." That is a moral distinction, not a harm-based one. If your argument is about the monopoly on violence, why is the boxing ring exempt?

  **Julian:** Because boxing is regulated. It has referees. It has medical oversight. It serves a public purpose—entertainment, athletic excellence.

  **Elara:** And *Brown* served a private purpose—intimacy, trust, gratification. Why is the public purpose more valuable than the private one?

  **Julian:** Because the public purpose is subject to public scrutiny. The private one is not. Devlin's point is that the law cannot police the dark. It can only set the boundary. If the boundary allows private torture, the public understanding of violence shifts.

  **Elara:** We are going in circles. You keep returning to the "shift" in understanding as a catastrophe. I keep asking for proof that the catastrophe is real.

  **Julian:** And you keep assuming that liberty is the default value. Devlin assumes order is the default value. Liberty is a luxury a society affords itself when it feels secure. If the moral bond is thin, liberty must be restricted to thicken it.

  **Elara:** But if you restrict liberty to thicken the bond, you risk breaking the bond by alienating the minorities. *Brown* didn't strengthen society's respect for bodily integrity. It drove the practice underground and stigmatized a subculture. It created resentment, not cohesion.

  **Julian:** Perhaps. Or perhaps it reaffirmed a line that needed holding. We won't know for fifty years. That's the tragedy of jurisprudence, Elara. We have to decide now, without knowing the empirical outcome of the disintegration thesis.

  **Elara:** Then I'd rather err on the side of liberty. If Devlin is wrong, we've imprisoned innocent men for victimless acts. If Hart is wrong, we've allowed some private degradation that might, maybe, weaken a social norm. The asymmetry of harm favors the liberal.

  **Julian:** Unless the social norm is the precondition for rights themselves. If the society disintegrates, you get no rights at all.

  **Elara:** A society that criminalizes private consensual sex is already disintegrated, Julian. It just doesn't know it yet.

  **Julian:** *[Sips his cold coffee]* And a society that cannot distinguish between a boxing match and a dungeon has lost its moral compass.

  **Elara:** So we're agreed?

  **Julian:** We're agreed that *Brown* breaks the tools we brought to fix it.

  **Elara:** Cheers to that.
