      *   **Topic:** Hart-Devlin exchange (Legal Moralism vs. Liberalism), applied to *R v Brown* (1993) (consensual sadomasochism) rather than the usual Wolfenden/homosexuality context.
      *   **Characters:** Two contemporary legal philosophers (one Hartian, one Devlinian).
      *   **Goal:** A dialogue where they try to talk each other out of their views.
      *   **Specific Requirements:**
          *   Devlinian must make the *best* case for Devlin: Disintegration thesis, "intolerance/indignation/disgust" test, analogy to treason (society as victim).
          *   Hartian must press objections: Disintegration is untested empirically or definitional sleight of hand; must also address the weak point of the Harm Principle (paternalism vs. consensual harm in *Brown*).
          *   Substantive comebacks, no easy wins, no silence/concession, unresolved ending is fine/preferred.
      *   **Tone:** Academic but conversational, rigorous, respectful but adversarial.

  2.  **Character Conception:**
      *   **The Hartian:** Let's call her *Elena*. She needs to be sharp on the empirical burden of proof and the consistency of liberalism. She needs to grapple with the *Brown* specifics (bodily harm vs. consent).
      *   **The Devlinian:** Let's call him *Marcus*. He needs to avoid caricature (the "bigot" version of Devlin) and focus on the structural/sociological argument about shared morality as the glue of society. He needs to wield the "treason" analogy effectively.

  3.  **Key Arguments to Deploy:**
      *   **Devlin/Marcus:**
          *   Society isn't just a collection of individuals; it's a community of ideas.
          *   Immorality threatens the bond just as treason threatens the state.
          *   The "Man on the Clapham Omnibus" test (intolerance, indignation, disgust) is the metric for what counts as fundamental.
          *   *Brown* isn't just private; it normalizes violence, eroding the sanctity of bodily integrity.
      *   **Hart/Elena:**
          *   Disintegration is an empirical claim without evidence. People disagree morally all the time without society collapsing.
          *   "Disgust" is too volatile a standard for criminal law (risk of tyranny of the majority).
          *   The Harm Principle needs to explain why *Brown* is punishable. If consent validates surgery or sports, why not S&M?
          *   Paternalism is a slippery slope; if the state protects us from ourselves here, where does it stop?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A coffee shop or office after a seminar. Establish the *Brown* context immediately.
      *   **Round 1: The Devlinian Opening.** Marcus frames *Brown* not as privacy but as social cohesion. Uses the treason analogy.
      *   **Round 2: The Hartian Rebuttal.** Elena attacks the empirical basis of disintegration. Questions the "disgust" metric.
      *   **Round 3: The Devlinian Counter.** Marcus argues that morality *is* the structure, not just an add-on. Distinguishes "mere squeamishness" from deep moral revulsion.
      *   **Round 4: The Hartian Weak Point (Paternalism/Consent).** Elena turns the table. If Harm Principle allows some paternalism (seatbelts), why is consensual harm in *Brown* different? She needs to defend the distinction without collapsing into moralism.
      *   **Round 5: The Devlinian Press.** Marcus pounces on the inconsistency. If harm is the metric, consent should negate it. If consent doesn't negate it, it's because the act is *wrong*, not just harmful.
      *   **Round 6: Closing Stalemate.** Both acknowledge the difficulty. No resolution, but deepened understanding of the impasse.

  5.  **Refining the Arguments (Self-Correction during drafting):**
