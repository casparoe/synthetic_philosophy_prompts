answer: |-
  This is a fantastic observation, and you are right to trust your gut: "social pressure" is too blunt an instrument for this. You have stumbled onto a genuine ethical tension that philosophers and sociologists wrestle with, specifically regarding the boundaries of duty.

  Since you're on deadline, I'll give you the precise terminology and the framework without the academic fluff. There are three concepts that, when layered together, explain exactly what you are seeing.

  ### 1. The Core Term: Supererogation
  The philosophical term for the stranger's act is **supererogatory**.
  *   **Definition:** An act that is good to do, but not wrong to omit. It is "above and beyond the call of duty."
  *   **Application:** The stranger is a textbook case. She did a moral good, but no one can claim she *owed* it to the recipient. That is why calling her a "saint" feels correct to the audience but annoying to her; it places her outside the normal economy of human obligation.

  ### 2. The Mechanism: The "Easy Rescue" Threshold
  This is the specific framework for the "gap" you identified. In ethics (particularly utilitarianism, think Peter Singer), there is a principle often called the **"Easy Rescue"** or **"Low-Cost Altruism"** principle.
  *   **The Principle:** If you can prevent something very bad (death) at a very low cost to yourself (minor surgery, few weeks recovery), the act stops being supererogatory and starts sliding toward **obligatory**.
  *   **The Shift:** This is where your stranger unintentionally weaponized the sister's situation. By demonstrating that the cost is low ("back at desk job in under a month," "math seemed obvious"), the stranger empirically lowered the barrier for everyone else.
  *   **The Result:** The sister can no longer claim the cost is "too high" because the stranger proved it isn't. When the cost drops, the act moves from *Supererogatory* (heroic) to *Expected* (duty). The family isn't angry she isn't a saint; they are angry she isn't doing what is now perceived as a "low-cost rescue."

  ### 3. The Context: Associative Duties
  Why does this apply to the sister and not the stranger? This is covered by **Associative Duties** (or Special Obligations).
  *   **The Concept:** We generally accept that we owe more to those with whom we have significant relationships (family, friends) than we do to strangers.
  *   **The Conflict:** Usually, **Bodily Integrity** trumps Associative Duties. (i.e., "I love my brother, but you can't have my organ.") However, when the "Easy Rescue" principle is activated (because the stranger showed it's easy), the Associative Duty weighs heavier. The family thinks: *"You don't even have to sacrifice much (Easy Rescue), and he's your brother (Associative Duty). Why won't you do it?"*

  ### How to Frame This in the Piece
  You don't need to use the jargon, but you can use the logic to sharpen your prose. You are describing the **collapse of the supererogatory.**

  Here is a way to articulate it in the narrative:

  > "The stranger had reset the moral baseline. By treating the surgery as a simple equation—a month of recovery for a life—she had inadvertently turned a miracle into a metric. For the sister on the waitlist, the stranger's ease became a measuring stick. What was once an impossible request of the body had been reclassified as a manageable inconvenience. And in the economy of family, a manageable inconvenience looks less like a sacrifice and more like a choice."

  ### The "Sharper Thing" You Were Looking For
  If you need a single phrase to anchor this section of the story, try **"The Normalization of Sacrifice."**

  When a supererogatory act is performed by a stranger, it highlights the *virtue* of the donor. But when that same act is witnessed by a family member, it highlights the *feasibility* of the act. It removes the excuse of "I can't." It leaves only "I won't."

  That is the source of the "thick unspoken cloud." It isn't just guilt; it's the removal of a valid defense. The sister isn't being judged for failing to be a hero; she's being judged for failing to solve a problem that has now been proven to have a solution.

  **Summary for your editor notes:**
  You are exploring how **supererogatory acts** (optional good deeds) can shift into **moral expectations** when the **perceived cost** is lowered by a third party, specifically within the context of **associative duties** (family bonds). The stranger made the donation look "cheap," which made the sister's refusal look "expensive."

  This is the heart of the story. Don't cut it.
