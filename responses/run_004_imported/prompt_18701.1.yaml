answer: |-
  The room was a cube of matte white, seamless and soundproofed. The only break in the geometry was the console embedded in the wall at eye level. It had a single haptic interface and a small digital display counting down from ten minutes.

  Elias sat on the stool provided, hands resting on his knees. He knew the rules. He had read the packet three times. He knew that somewhere, in a room identical to this one, another person was sitting on an identical stool. They would never see each other. They would never speak.

  The packet had been specific about the counterpart. *Subject B is psychometrically identical to you. Subject B has received the same information packet. Subject B possesses the same cognitive training.*

  They weren't just similar. They were mirrors.

  The console hummed. Two buttons glowed softly. The left was green, labeled *ALIGN*. The right was red, labeled *OPTIMIZE*.

  The payoff structure was simple, printed on the card still clutched in Elias's left hand.
  *Both ALIGN: Both released.*
  *Both OPTIMIZE: Both detained.*
  *One OPTIMIZE, One ALIGN: Optimizer released with bonus. Aligner detained indefinitely.*

  It was a trap designed to reward betrayal. If Elias acted purely in his own immediate self-interest, the math was brutal. Whatever the other person did, Elias was better off pressing *OPTIMIZE*. If the other person aligned, Elias got the bonus by optimizing. If the other person optimized, Elias avoided indefinite detention by optimizing too. Defection dominated.

  But the packet hadn't just described the payoff. It had described the mind across the wall.

  Elias closed his eyes. He could feel the texture of the cardstock against his thumb. He could hear the faint, high-pitched whine of the ventilation system. He assumed the other room had the same whine. He assumed the other Elias was feeling the same cardstock.

  If I were him, what would I do?

  The question wasn't about empathy. Elias didn't care about the other man. He didn't know him. There was no bond, no shared history, no promise of future interaction. This was a one-off. A single shot in the dark.

  But if Elias was rational, and the other man was rational, and they were both working from the same data... then they were effectively the same algorithm running on different hardware.

  Elias opened his eyes. The countdown read 08:14.

  If I press *OPTIMIZE*, it is because I have calculated that it is the rational choice. But if it is the rational choice, then he will calculate the same thing. He is me, in the ways that matter. He is running the same software. If I find the logic compelling, he finds the logic compelling.

  Therefore, if I press *OPTIMIZE*, he presses *OPTIMIZE*. The result is mutual detention.

  If I press *ALIGN*, it is because I have calculated that symmetry demands it. If that is the rational choice, then he will calculate the same thing. He will press *ALIGN*. The result is mutual release.

  The choice wasn't between cooperating and betraying. The choice was between a world where both of them reasoned toward release, and a world where both of them reasoned toward detention. His finger didn't reach across the room to press the other man's button. But his logic did.

  A sweat bead trickled down Elias's temple. The logic felt clean, crystalline. It felt like truth.

  But then, a jagged thought cut through the symmetry.

  *What if I'm wrong?*

  What if the other man isn't as rational as the packet claims? What if he's scared? Fear isn't rational, but it is human. If he's scared, he'll press *OPTIMIZE* to protect himself. If he presses *OPTIMIZE*, and I press *ALIGN*, I lose everything. I stay in the box forever.

  My thought process doesn't control his hand. Muscles contract based on local signals. My neurons firing here don't send electricity to his brain. There is no cable connecting us. There is only the assumption of similarity.

  Is an assumption enough to gamble freedom on?

  Elias stood up and paced the three steps available to him. The white walls seemed to press in. He looked at the green button. It looked passive, waiting. The red button looked aggressive, hungry.

  If I defect, I guarantee I don't get the worst outcome. I secure my floor. If I cooperate, I'm vulnerable. I'm hoping that my reasoning powers are a causal force in a universe that doesn't care about logic.

  He stopped pacing. He looked at his reflection in the glossy surface of the console. He looked tired.

  *Suppose I am the control subject,* he thought. *Suppose the experiment isn't about the payoff. Suppose it's about whether I believe the link exists.*

  If he believed the link was real, he had to press *ALIGN*. To press *OPTIMIZE* was to admit that the link was broken. But if the link was broken, then the premise of the experiment—that they were identical reasoners—was a lie. If the premise was a lie, then no logical deduction based on it could be trusted.

  To defect was to invalidate the very reasoning used to justify the defection.

  It was a loop. A snake eating its own tail.

  03:00.

  The silence of the room was heavy. He imagined the other Elias sitting in the same silence. Was he pacing? Was he sweating? Or was he sitting perfectly still, having already resolved the equation?

  If he has already resolved it, then I am behind. If I am behind, am I still identical?

  The doubt was a physical weight in his chest. It whispered that this was just mysticism dressed up as math. It whispered that he was trying to magic the other man's hand into moving by willing his own to move. It was superstition. It was praying to a god made of game theory.

  And yet.

  If everyone thought that way, if everyone decided that logical correlation was just superstition, then everyone would defect. And everyone would lose. The only way to win was to believe in the magic.

  Was that wisdom? Or was it just a convenient story to tell himself so he didn't have to live with the guilt of betrayal? If he pressed *OPTIMIZE*, he condemned the other man. If he pressed *ALIGN*, he saved them both, or he doomed them both together.

  There was a strange comfort in the shared doom.

  01:00.

  Elias sat back down. He placed his right hand on the console. The material was cool.

  He looked at the green button. He thought about the other room. He thought about the invisible thread of logic stretching through the wall, tethering his mind to the stranger's. It felt fragile. It felt like it might snap under the weight of a single selfish impulse.

  But if he snapped it, did it ever exist?

  If he was truly the rational agent the packet claimed, he couldn't snap it. To snap it was to be irrational. To be irrational was to fail the condition of the experiment.

  He had to be rational to win. To be rational was to cooperate.

  00:30.

  His finger hovered. The air in the room felt thin. He wondered if he was making a mistake. He wondered if, in the other room, the other Elias was pressing red right now, smiling, knowing he had outsmarted the symmetry by embracing the causal reality that buttons are separate.

  If that was the smarter move, then Elias was about to become a fool. A noble fool, but a fool nonetheless. He was betting on a correlation that physics didn't support. He was betting on a ghost in the machine.

  00:10.

  He closed his eyes. He couldn't watch the button go down.

  *Let the logic hold,* he thought. *Let the mirror reflect.*

  00:05.

  He pressed.

  The sound was a soft click, swallowed instantly by the white room. The display went black. The hum of the ventilation stopped.

  Elias sat in the sudden, absolute silence. He waited for the door to hiss open. He waited for the alarm to scream. He waited for nothing at all.

  He kept his eyes closed, trying to feel the outcome in his bones, trying to sense if the other hand had moved in time with his. But there was only the quiet, and the beating of his own heart, and no way to know if he had solved the puzzle or just fallen for the trick.
