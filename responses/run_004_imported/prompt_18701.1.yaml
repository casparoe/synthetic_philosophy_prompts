prompt: |-
  I'm putting together a collection of short fiction where each story is built around one idea from decision theory, and for the next one I want to tackle superrationality -- Hofstadter's old idea that two sufficiently identical reasoners facing a one-shot prisoners dilemma, with no communication and no history together, should each cooperate anyway, because the symmetry of the situation means whatever's rational for one of them is automatically rational for the other. I don't want the story to fall back on 'they learned to trust each other' -- no repeated rounds, no messages passed, no prior relationship for the character to lean on, so the logic itself has to be doing all the work. Could be two strangers, two copies of the same person, two AI instances spun off the same weights, whatever vehicle earns the idea best. And don't let it resolve too cleanly -- plenty of decision theorists think the whole move is just a rationalization, since your choice can't actually cause a stranger's choice to change, so I'd like the ending to leave open whether the character reasoned their way to something true or just talked themselves into it. Something like 1000-1500 words, and no lecturing the reader about game theory in the middle of it -- it should all live in the scene.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Superrationality (Hofstadter's concept).
      *   **Context:** A collection of short fiction based on decision theory ideas.
      *   **Core Constraint:** No repeated rounds, no communication, no prior relationship/trust. The logic itself must drive the action.
      *   **Characters/Setting:** Could be strangers, copies, AI instances, etc. Needs to earn the idea.
      *   **Tone/Ending:** Ambiguous. Don't resolve cleanly. Leave open whether the reasoning was valid or self-deception.
      *   **Length:** 1000-1500 words.
      *   **Style:** Show, don't tell. No lecturing on game theory.

  2.  **Deconstruct Superrationality:**
      *   The core idea: If I am rational, and you are rational, and we know we are both rational and facing the same problem, we will both arrive at the same conclusion. Therefore, my choice *correlates* with yours, not because I cause it, but because we are running the same "algorithm." If I cooperate, you likely cooperate. If I defect, you likely defect. Therefore, cooperation yields a better payoff than mutual defection, even in a one-shot Prisoner's Dilemma.
      *   The Counter-argument: Causal Decision Theory (CDT). My button press doesn't physically change yours. I should defect to maximize my gain regardless of what you do.
      *   The Tension: Logical correlation vs. Causal isolation.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: Two AI instances.* Classic, but maybe too sterile. Hard to make emotional stakes feel real without risking anthropomorphizing too much.
      *   *Idea 2: Two clones.* Similar to AI, but biological.
      *   *Idea 3: Two strangers in a room.* A bit generic.
      *   *Idea 4: A single person facing a mirror image simulation.*
      *   *Idea 5: Two experts who know each other's work but never met.*

      *Decision:* Let's go with two AI instances or highly optimized human agents. Actually, let's make it slightly more ambiguous. Two "arbiters" or "negotiators" who are trained identically. Or better yet, two instances of the same debugging tool sent into a system.
      *Refinement:* Let's try two copies of the same consciousness. Not necessarily clones, but perhaps uploaded minds running on separate servers for a specific task. This emphasizes the "identical reasoner" aspect.
      *Alternative:* Two strangers who know they are both graduates of the same hyper-rationalist program.
      *Best Fit:* Two instances of an algorithmic agent. It removes the "trust" variable entirely. It's pure logic. But to make it fiction, it needs sensory detail. Let's make them human-ish but heavily augmented or conditioned. Or better: Two people in separate rooms, knowing they are *identical* in relevant ways.
      *Let's try:* Two candidates for a job? No.
      *Let's try:* Two prisoners, but not in the criminal sense. Captured by an alien entity? A bit sci-fi cliché.
      *Let's try:* A simulation test. Two instances of the same code.
      *Wait, the prompt says:* "Could be two strangers, two copies of the same person, two AI instances..."
      *Selection:* Let's go with two instances of the same AI model, instantiated for a specific resource allocation task. It allows for internal monologue that feels computational yet narrative.
      *Actually, humanizing it might be better for the "talked themselves into it" ambiguity.* Let's make them two humans who know they are psychometrically identical. Or better, two humans who know they are running the same "decision protocol."
      *Let's settle on:* Two agents, separated, identical training, identical information packets. They know they are mirrors.

  4.  **Drafting - Scene Setting:**
      *   White room. Button. Red/Green.
      *   Character name: Elias. The other is... also Elias? Or just "The Other."
      *   Stakes: Something abstract but vital. Survival? Freedom? Credit? Let's make it freedom/release.
      *   The Mechanism: If both press Green (Cooperate), both get released. If one presses Red (Defect), defector gets rich/free, cooperator gets punished. If both Red, both punished.
      *   The Twist: They know they are "matched pairs."

  5.  **Drafting - The Internal Conflict:**
      *   Elias needs to reason through it without explaining it to the reader.
      *   He needs to feel the pull of defection (self-preservation).
      *   He needs to feel the pull of superrationality (mirror logic).
      *   The ending must be him pressing the button, but the outcome unknown or ambiguous.

  6.  **Writing - Step-by-Step:**
      *   *Opening:* Establish the isolation. The room. The interface.
      *   *The Knowledge:* Establish that he knows the other person is like him. Not just "another guy," but "the same guy."
      *   *The Reasoning:* Show the thought process. The temptation to defect. The counter-thought about symmetry.
      *   *The Climax:* The finger hovering.
      *   *The Ending:* The press. The wait. No confirmation.

  7.  **Refining the Logic (Show, Don't Tell):**
      *   Instead of saying "Superrationality," show him thinking: "If I find the answer, he finds the answer. We are the same machine."
      *   Instead of saying "Prisoner's Dilemma," describe the payoff matrix implicitly.
      *   Focus on the physical sensation of the choice.

  8.  **Addressing the Ambiguity:**
      *   Does he cooperate? If he cooperates, does he feel noble or foolish?
      *   If he defects, does he feel smart or lonely?
      *   Let's have him choose Cooperate based on the logic, but end with a doubt. A flicker of "What if I'm wrong?"
      *   Actually, the prompt asks to leave open whether the character reasoned their way to something true or talked themselves into it.
      *   So, he chooses Cooperate. But the narrative voice should question the validity of the link.

  9.  **Word Count Check:**
      *   Need to expand on the internal monologue to hit 1000-1500.
      *   Describe the room, the light, the dust.
      *   Describe the history of the training (vaguely).

  10. **Revision Plan:**
      *   Ensure no game theory jargon slips in.
      *   Make sure the "identical" nature is clear without being sci-fi exposition dumps.
      *   Strengthen the ending ambiguity.

  *(Self-Correction during drafting)*: Avoid making them AI. It's more poignant if they are human beings who have been conditioned or selected to be identical reasoners. It raises the stakes of "free will." Let's make them "Analysts."

