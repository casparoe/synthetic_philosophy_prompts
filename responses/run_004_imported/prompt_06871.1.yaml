      *   *Lewis's Base:* Lewis requires the base to be intrinsic. If the mask is internal, it's part of the base. So Lewis would say the disposition "to defect" is *not* present; rather, the disposition "to defect-when-unwatched" is present. This complicates things. I need to address this nuance. The "disposition" needs to be specified carefully.
