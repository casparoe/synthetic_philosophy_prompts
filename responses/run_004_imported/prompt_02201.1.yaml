answer: |-
  This is a fantastic debate to have gotten into, and honestly, the fact that you couldn't pin down the distinction at midnight is forgivable: the literature here is notoriously dense, and Gauthier and McClennen are often lumped together as "non-classical decision theorists who reject separability."

  Your friend is **extensionally** right but **intensionally** wrong. In the specific case of Parfit's Hitchhiker, Constrained Maximization (CM) and Resolute Choice (RC) yield the same action (pay the driver). However, they are solving fundamentally different problems, relying on different metaphysics of agency, and they **do** diverge in nearby cases (specifically Kavka's Toxin and cases involving opacity).

  Here is the breakdown of why they are distinct, where they split, and how they map onto Parfit.

  ### 1. The Locus of Evaluation: Dispositions vs. Plans

  The core difference lies in *what* is being evaluated as rational.

  **Gauthier's Constrained Maximization (CM)** is a theory about **dispositions (character traits)**.
  *   **The Claim:** It is rational to *be* a certain kind of person (a Constrained Maximizer), even if it is not always rational for that person to perform the utility-maximizing *act* in every isolated instance.
  *   **The Mechanism:** CM relies on **translucency**. You get picked up in the Hitchhiker case not because you "chose" to pay at $t_2$ (in town), but because at $t_1$ (in the desert), you possessed a disposition that the driver detected. The rationality is located in the possession of the disposition, which is selected because having it yields higher expected utility over a lifetime of interactions.
  *   **The "Why":** You pay because you are a CM, and CMs pay other CMs (or those who rely on them). If you were a Straightforward Maximizer (SM), you wouldn't have been picked up.

  **McClennen's Resolute Choice (RC)** is a theory about **plans (dynamic consistency)**.
  *   **The Claim:** It is rational to adopt a plan at $t_1$ and rationally required to stick to it at $t_2$, even if at $t_2$ the plan no longer maximizes expected utility relative to the available options *at that moment*.
  *   **The Mechanism:** RC rejects the **separability assumption** of standard decision theory (the idea that each decision node is independent). It argues that an agent extends over time. To violate your prior plan is to suffer a dynamic inconsistency, which is itself a failure of rationality.
  *   **The "Why":** You pay because you *planned* to pay. To defect now is to be "akratic" or dynamically inconsistent. The rationality is located in the fidelity to the prior intention.

  **Summary:** Gauthier says, "It's rational to be the *type* of person who pays." McClennen says, "It's rational to *follow the plan* you made to pay."

  ### 2. The Divergence: Where They Recommend Different Actions

  If they were the same "fix," they would never diverge. But they do. The clearest divergence is **Kavka's Toxin Puzzle**, which you mentioned.

  **The Setup:** A billionaire offers you \$1M if you *intend* at midnight to drink a harmless but painful toxin tomorrow. You get the money if you have the intention. You do not need to actually drink it to get the money; you just need to form the intention.

  *   **Gauthier (CM):** Gauthier explicitly argues that CM **cannot** solve the Toxin Puzzle. Why? Because CM is about dispositions to *act* in cooperative scenarios where others detect your disposition. In Toxin, the benefit (money) comes from the *intention*, not the *act*. There is no partner detecting your disposition to act; there is just a payout for a mental state. Gauthier argues you cannot rationally dispose yourself to perform a act (drinking) that has no utility for you once the money is secured. A CM would fail to form the intention, get no money, and not drink.
  *   **McClennen (RC):** McClennen argues RC **does** solve the Toxin Puzzle. At $t_1$ (midnight), the optimal plan is "Intend to drink, then drink." If you are resolute, you stick to the plan at $t_2$ (tomorrow) and actually drink the toxin, because deviating from the plan renders the initial intention irrational (and thus you wouldn't have gotten the money). RC binds the future self to the past plan regardless of the lack of external detection.

  **Another Divergence: The Opaque Hitchhiker**
  Imagine a variant where the driver is *not* a perfect lie detector. She can't read your dispositions. She just has to trust your word.
  *   **Gauthier (CM):** If your disposition is opaque (undetectable), being a CM provides no strategic advantage in this specific interaction. You are effectively anonymous. A Gauthierian might argue that without translucency, the disposition doesn't trigger the cooperative benefit, so you might defect (or rather, the theory doesn't compel you to pay in the same way).
  *   **McClennen (RC):** Observability doesn't matter. You made a plan to pay. You are bound by your own prior rationality. You pay even if the driver couldn't have checked.

  ### 3. Parfit's "Rational Irrationality"

  Parfit's point in *Reasons and Persons* is that Self-Interest Theory (SIT) is "self-defeating." It tells us to do things that make us worse off. We need a theory where it is rational to be "irrational" by SIT standards (e.g., keeping a promise when breaking it would benefit you).

  **Which fits better?**
  **McClennen's Resolute Choice is a closer fit to Parfit's vision.**

  *   **Parfit's Worry:** Parfit was concerned with the "division of the self" over time. He wanted a theory that respects the claims of our past and future selves.
  *   **Gauthier's Limit:** Gauthier is still a contractarian consequentialist. He justifies the disposition *instrumentally*. You are a CM *because* it pays off. If being a CM stopped paying off (e.g., in a world of perfect predators who exploit CMs), Gauthier's theory suggests you should abandon the disposition. It's still ultimately grounded in maximization.
  *   **McClennen's Strength:** RC modifies the structure of rationality itself, not just the instrumental calculus. It says rationality *inherently* involves temporal consistency. This aligns better with Parfit's reductionist view of persons, where rationality is about the coherence of the person over time, not just the maximization of outcomes. Parfit explicitly discusses McClennen favorably in this context, whereas he is more critical of Gauthier's contractarian derivation.

  ### 4. Why Your Friend Thought They Were the Same (and Why the Literature Cares)

  Your friend isn't crazy. They are identifying the **functional equivalence** in the Hitchhiker case.
  *   Both theories reject **Sophisticated Choice**. (Sophisticated Choice says: "I know I won't pay later, so I won't even try to get in the car." Both CM and RC say: "Get in the car and pay.")
  *   Both theories require a **pre-commitment mechanism**. (CM uses disposition formation; RC uses plan adoption.)
  *   Both theories look like "binding yourself" from the outside.

  **Why the literature treats them separately:**
  1.  **Metaphysics:** Gauthier is doing Moral Philosophy (Hobbesian contractarianism). McClennen is doing Decision Theory (fixing von Neumann-Morgenstern axioms).
  2.  **The "Black Box" of Agency:** Gauthier treats the disposition as a black box that outputs actions. He doesn't care *how* you force yourself to pay, just that you are the type who does. McClennen opens the black box and argues that the *process* of choice at $t_2$ must reference the plan at $t_1$.
  3.  **Vulnerability:** CM is vulnerable to "free rider" problems if translucency fails. RC is vulnerable to "perversity" (what if I make a stupid plan? RC says I must stick to it).

  ### The Verdict

  You win the distinction, but your friend wins the "street level" outcome.

  *   **In the Hitchhiker case:** They are functionally identical. Both tell you to pay.
  *   **In the Toxin case:** They diverge. RC says drink; CM says don't bother intending.
  *   **In the Philosophy:** CM is "Rationality as Optimal Disposition Selection." RC is "Rationality as Dynamic Consistency."

  If you want to settle the bet: Ask your friend, **"If the driver was blind and couldn't detect my disposition, but I still promised to pay, does Gauthier say I'm bound to pay?"**
  *   If they say **Yes**, they don't understand Gauthier (who relies on translucency).
  *   If they say **No**, then ask, **"Does McClennen say I'm bound to pay?"**
  *   If they say **Yes** (which McClennen does), then the theories are distinct.

  Parfit would likely side with McClennen. He wanted a theory that saves rationality from self-defeat by changing how we view the self over time, not just by optimizing which "mask" we wear in the desert. Gauthier is still wearing a mask; McClennen is trying to heal the split between the selves.
