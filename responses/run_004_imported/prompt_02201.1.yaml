prompt: |-
  So a couple nights ago a friend and I got into a two-hour arguement (derailed our entire movie night, whoops) about Parfit's hitchhiker -- the case where you're dying of thirst in the desert and a driver will only give you a ride if she's confident you'll actually pay her once you're safe in town, and she's basically a perfect lie detector so bluffing won't work. We agreed fast that you should pay once you get to town, since otherwise you never get picked up to begin with, but then we spent way too long arguing about *why* that's supposed to be the rational thing to do, which somehow turned into a fight about whether two different "fixes" from decision theory are actually the same fix wearing different clothes.

  My friend kept insisting that Gauthier's "constrained maximization" and this "resolute choice" thing from McClennen (I'd first run into it through Kavka's toxin puzzle, not the hitchhiker) are basically the same move: pick a good policy ahead of time and stick to it even once sticking to it stops looking good in the moment. I felt like that was flattening a real distinction but couldn't actually say what the distinction was, and it was midnight so we just agreed to disagree, badly.

  Can you settle this properly? I don't want the "here's what the hitchhiker problem is" explainer -- I basically know the setup already. What I want is a real breakdown of how constrained maximization and resolute choice differ as answers to why paying is rational: like, are they even evaluating the same kind of thing (dispositions vs. plans vs. something else), is there some variant of the hitchhiker or a nearby case where they'd actually recommend different actions, and does either of them do a better job than the other of cashing out what Parfit himself meant by "rational irrationality"? And if it turns out my friend is basically right that it's a distinction without a difference, I want to know that too, and why people in the literature bother treating them as separate positions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Decision Theory, specifically Parfit's Hitchhiker case.
      *   **Core Dispute:** Are David Gauthier's "Constrained Maximization" (CM) and Edward McClennen's "Resolute Choice" (RC) essentially the same strategy ("pick a policy and stick to it"), or are they distinct?
      *   **User's Knowledge Level:** High. They know the Hitchhiker setup, they know the basic CM/RC labels, they know Kavka's Toxin Puzzle, and they know Parfit's "rational irrationality" concept. They don't need a 101 explainer.
      *   **Specific Questions to Answer:**
          1.  Do they evaluate the same kind of thing (dispositions vs. plans)?
          2.  Is there a case where they diverge (recommend different actions)?
          3.  Which better captures Parfit's "rational irrationality"?
          4.  If they *are* similar, why does the literature treat them separately?

  2.  **Deconstruct the Two Theories:**

      *   **Constrained Maximization (Gauthier):**
          *   *Core Idea:* Rationality is about the *disposition* you possess, not just the act you perform. A Constrained Maximizer (CM) is disposed to cooperate with other CMs (or those who can detect the disposition) but defect against Straightforward Maximizers (SM).
          *   *Mechanism:* It's a disposition-based account. You are rational if you have the utility-maximizing disposition. Once you have the disposition, you act according to it.
          *   *Key Feature:* Transparency/Translucency. It relies heavily on the other party being able to detect your disposition *before* the interaction (like the driver detecting the disposition to pay).
          *   *Relation to Time:* It solves the time-inconsistency problem by shifting the locus of evaluation from the *act* to the *disposition* held prior to the interaction.

      *   **Resolute Choice (McClennen):**
          *   *Core Idea:* Rationality is about dynamic consistency over time. An agent makes a plan at $t_1$ and is rationally required to stick to it at $t_2$, even if at $t_2$ the plan no longer looks optimal according to standard expected utility.
          *   *Mechanism:* It's a plan-based account. It rejects the "separability" assumption of standard decision theory (that each decision node is independent).
          *   *Key Feature:* Internal commitment. It doesn't necessarily rely on external detection of a disposition. It relies on the agent's own ability to bind their future self.
          *   *Relation to Time:* It solves the time-inconsistency problem by denying that preferences at $t_2$ should override the plan made at $t_1$ if the plan was optimal overall.

  3.  **Compare and Contrast (The "Meat" of the answer):**

      *   *Locus of Evaluation:* CM = Disposition/Character trait. RC = Plan/Strategy over time.
      *   *Dependence on Others:* CM *needs* the other party to detect the disposition (crucial for Hitchhiker). RC is more about internal consistency (crucial for Toxin/Intertemporal choice).
      *   *The "Why":* CM says "It's rational to *be* this kind of person." RC says "It's rational to *follow* this plan."

  4.  **Identify Divergence Cases:**
      *   *Hitchhiker:* Both say "Pay." But for different reasons. CM: Because you have the disposition the driver detected. RC: Because you planned to pay and must remain dynamically consistent.
      *   *Toxin Puzzle (Kavka):*
          *   CM: Can you have a disposition to intend to drink? Gauthier is skeptical here because there's no *other* agent detecting the disposition to trigger the benefit, or rather, the benefit comes *before* the cost without a second interaction. Actually, Gauthier struggles with Toxin because the disposition doesn't lead to the act in a way that maximizes utility *in that specific instance* without a reciprocal partner.
          *   RC: McClennen thinks RC solves Toxin. You plan to drink, you get the money, you stick to the plan and drink.
          *   *Wait, check this:* Gauthier actually argues CM *doesn't* solve Toxin because the disposition must be "triggered" by the expectation of benefit from *others* recognizing it. In Toxin, the billionaire just checks your intention.
          *   *Better Divergence Case:* A case where you are opaque/unobservable.
          *   *Scenario:* You make a plan to help a friend tomorrow. Tonight, you commit. Tomorrow, helping is costly. No one is watching tomorrow.
          *   CM: If no one can detect your disposition tomorrow, are you bound? Gauthier focuses on *translucency*. If you are opaque, CM might collapse into SM.
          *   RC: You are bound by your prior plan regardless of observability.
      *   *Newcomb's Problem:* Both generally cooperate/one-box, but the justification differs.

  5.  **Address Parfit's "Rational Irrationality":**
      *   Parfit's point in *Reasons and Persons* is that sometimes being rational (in the standard self-interest sense) leads to worse outcomes, so we need a theory where it's rational to be "irrational" (i.e., keep promises when it hurts).
      *   CM fits well: It redefines rationality to include dispositions.
      *   RC fits well: It redefines rationality to include dynamic consistency.
      *   *Nuance:* Parfit was actually closer to RC (or at least critical of Gauthier's contractarianism). Parfit emphasized that we need to care about our future selves and past commitments in a way that SM doesn't allow. RC is a more direct formalization of "binding oneself." CM is more about "signaling a type."

  6.  **Address the "Distinction Without a Difference" Claim:**
      *   Why does the friend think they are the same? Because both reject *Sophisticated Choice* (anticipating future defection and thus defecting now) and both reject *Straightforward Maximization* at the moment of action. They both endorse "naive" looking behavior (doing the thing that costs you now) but justify it via a prior state.
      *   Why are they different? Metaphysics of agency. CM is Humean/Contractarian (dispositions as tools for social cooperation). RC is Kantian/Internalist (autonomy over time).
      *   Literature distinction: Gauthier is doing moral philosophy/game theory (Morals by Agreement). McClennen is doing decision theory/economics (Rationality and Dynamic Choice).

  7.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, acknowledging the depth of the user's knowledge. No baby steps.
      *   *Structure:*
          1.  Validate the debate (it's a classic, deep cut).
          2.  Core Distinction: Disposition (CM) vs. Plan (RC).
          3.  The Mechanism of "Stick-to-it-iveness": External detection vs. Internal binding.
          4.  Divergence Case: The "Opaque Hitchhiker" or "Toxin" variations.
          5.  Parfit's "Rational Irrationality": Which fits better?
          6.  Verdict on the Friend's Claim: Why it looks true but is false.

  8.  **Refining the Divergence Case (Self-Correction):**
      *   I need to be careful with Toxin. Gauthier explicitly says CM *doesn't* solve Toxin because the disposition to form an intention isn't useful if the act itself is costly and provides no further benefit to the disposition-holder. McClennen says RC *does* solve Toxin. This is a hard divergence.
      *   *Wait, does CM solve Hitchhiker?* Yes, because the driver detects the disposition.
      *   *Does RC solve Hitchhiker?* Yes, because you plan to pay.
      *   *So where do they split?*
          *   Case 1: **Unobservable Disposition.** If the driver *couldn't* detect the disposition, but you still made a plan. CM says defect (no benefit to having the disposition if undetected). RC says pay (bound by plan).
          *   Case 2: **Toxin.** CM says don't drink (disposition doesn't help if act is purely costly). RC says drink (bound by plan).
      *   *Correction on Toxin/CM:* Gauthier argues that in Toxin, you cannot rationally form the intention because the intention doesn't cause the benefit in the right way. The benefit comes from the *intention*, not the *disposition to act*. CM is about dispositions to *act*. RC is about intentions/plans. This is a subtle but crucial technical difference.

  9.  **Final Polish:** Ensure the distinction between "disposition to act" (Gauthier) and "plan to act" (McClennen) is clear. Emphasize that Gauthier is still largely consequentialist about dispositions, whereas McClennen modifies the structure of rational choice itself.

  10. **Check against User Constraints:**
      *   No Hitchhiker 101. (Check)
      *   Breakdown of differences. (Check)
      *   Evaluation targets (dispositions vs plans). (Check)
      *   Divergence case. (Check)
      *   Parfit connection. (Check)
      *   Verdict on friend's claim. (Check)

  11. **Final Review of the "Friend is Right" angle:** Is there a sense in which they are the same? Yes, functionally in the Hitchhiker case. They are extensionally equivalent *in that specific scenario*. But intensionally distinct. I should make sure to grant the friend partial credit to be fair.

