  Okay, I'm about a third of the way into a hard-SF novel where the antagonist — a disgraced physicist — claims to have built a machine that can settle the halting problem for any program you feed it, and I really want the tech in the book to feel like it's resting on genuine (if fringe) physics and math rather than pure technobabble. This whole thing started because a physicist friend of mine got really annoyed at a dinner party when someone conflated "extremely fast computer" with "computer that actually breaks the Church-Turing thesis," and now I can't stop turning it over: which of the hypercomputation ideas people have actually proposed are "serious," in the sense of resting on genuinely exotic-but-not-crazy physics or math, and which ones are basically just ordinary computation with a costume on, or outright cheating?

  So here's what I want from you: rank the following six devices by how seriously each one would, if it actually worked exactly as described, threaten or refute the Church-Turing thesis in its "physical" sense — i.e. could it really compute a function that no Turing machine can compute, as opposed to just being unusually fast or parallel. The six: (1) a receiver stationed near a Malament–Hogarth spacetime that gets the completed output of an infinitely long computation after only a finite proper time; (2) a "Zeno" or accelerating Turing machine that halves the duration of each step forever, so that infinitely many steps finish in finite total time; (3) an "infinite time Turing machine" that's allowed to keep running through transfinite ordinal stages; (4) an analog recurrent neural net whose weights are exact, arbitrary-precision real numbers; (5) a computer that exploits a closed timelike curve so its answer becomes available to it before the computation "starts"; and (6) a garden-variety quantum computer, scaled up as far as you like. Give me your answer as a tier list, from S ("if realizable, this would be a genuine and physically-motivated refutation of Church-Turing") down to F ("doesn't actually challenge Church-Turing at all — more of a category error"), formatted like this:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "F": [...]
  }
  ```

  Then, for whichever device(s) you put in S and whichever you put in F, give me like three sentences each on why. Mostly I want my villain's machine (loosely modeled on #1, with some artistic license) to be the kind of thing that would make a real physicist grudgingly admit "okay, that's at least not stupid," rather then something that gets the book laughed out of a hard-sf reading group.
