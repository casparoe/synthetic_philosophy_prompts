answer: |-
  Good evening, everyone. For those who don't know me, I'm the older sibling. Which means I've spent most of my life watching [Sister's Name] figure out exactly who she is and what she wants. And watching her find Danny has been the best part of that show.

  Now, anyone who knows these two knows their origin story is a little… specific. They didn't meet at a bar, or on an app, or through friends. They met in an Intro to Philosophy of Time class. And according to the version of the story they tell at every party, they didn't exchange numbers on the first day; they exchanged objections.

  Specifically, they argued about Aristotle's Sea Battle. For the rest of the family: this is a famous puzzle about whether statements about the future are already true or false. Basically, if it's true *today* that there will be a sea battle *tomorrow*, is the future fixed? Is everything inevitable?

  [Sister] and Danny have been debating that ever since. Which presented me with a massive problem when writing this toast.

  Traditionally, this is the part where I say something like, "They were always meant to be together," or "It was written in the stars." But I realized that if I said that, Danny would spend the entire reception gently explaining to me how that violates the principle of bivalence regarding future contingents. And [Sister] would agree with him, just to be difficult.

  So, I went down a rabbit hole. I started reading about the Sea Battle again. I looked at the fatalists, the open futurists, the "Thin Red Line" theorists… and I realized I was trying to solve a logic puzzle when I should have been talking about love.

  Because here is the truth, and I mean this with total certainty: I am not standing here to tell you that their future was fixed in advance. I'm standing here to tell you that *they* are the ones who fix it.

  The philosophy nerds in the room—hello, I see you—will appreciate this: I have carefully avoided assigning a determinate truth value to any future contingents regarding this marriage. I am not claiming their happiness is inevitable. I am claiming it is *chosen*.

  And that is so much more romantic. If the future was already written, their vows wouldn't matter. But because the future is open, every single day they wake up and decide to be on the same team, they are literally making the statement "We will be happy" come true. They aren't discovering a destiny; they are building one.

  [Sister], Danny: I know you love a good argument. I know you love picking apart the logic of how things work. But my wish for you isn't that you never fight. My wish is that you never stop choosing each other as the answer.

  Let the future be unwritten. Let the truth value of tomorrow remain undefined until you get there. Because knowing you two, whatever you decide to make true together is going to be far better than anything fate could have scripted.

  So, if everyone could please raise a glass.

  To [Sister] and Danny. May your premises be sound, may your conclusions be joyful, and may you always find the truth in each other.

  To the happy couple!
