  3.  **Deconstruct the Limitations (The Pro-Logic/Verbal Argument):**
      *   *The Logical Constants:* How do you draw "not"? A red cross? That's a convention, not a picture. How do you draw "if"? How do you draw "all" vs. "some" (beyond simple counting)?
      *   *Discreteness vs. Continuity:* Pictures tend to be iconic (resembling the thing). Logic is symbolic (arbitrary relation).
      *   *Negation:* You can't picture the absence of something without picturing the context where it *should* be, which requires prior linguistic framing.
      *   *Conditionals:* "If it rains, the ground gets wet." You can draw rain and wet ground, but the *causal link* or the *hypothetical nature* is invisible.
      *   *Generality:* A picture of a worker is *a* worker. To make it "all workers" requires a quantifier (word/symbol).

