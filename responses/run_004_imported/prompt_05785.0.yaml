  9.  **Writing the Essay.** (Proceeding to generate output based on these thoughts).

      *   *Key phrase to include:* "The boundary between the iconic and the symbolic."
      *   *Key concept:* "Existential commitment" (pictures always show something existing).
      *   *Key distinction:* Showing vs. Saying.

  10. **Review against constraints:**
      *   Essay format? Yes.
      *   Neurath's reasons? Yes.
      *   Counter-reasons? Yes.
      *   Definitive verdict? Yes.
      *   No fence-sitting? Yes.

