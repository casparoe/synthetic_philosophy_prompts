      *   **Section 4: The Verdict.** Address the prompt's demand for a decision. Is it execution or principle? It's principle. To make pictures do logic, you must encode them, which destroys their "picture-ness" (direct resemblance).
      *   **Conclusion:** Reconcile Neurath's legacy. He wasn't wrong; he was just honest. ISOTYPE is a "helping language" precisely because it knows its limits.

