      *   **Lipton's Distinction:** "Likeliest" = most probable to be true. "Loveliest" = most explanatory (understanding, unification, mechanism). Lipton argues we infer the *loveliest* because it's likely to be the *likeliest*.
      *   **How does Lipton answer Bad Lot?** It's tricky. Lipton suggests that the criteria for "loveliness" (mechanism, unification) are truth-conducive guides, not just pragmatic virtues. If a hypothesis is truly "lovely" in the right way, it's less likely to be part of a "bad lot" because it connects to background theory.
      *   **Realist Reply 1 (Lipton-style):** Explanatory virtues track truth. We don't just pick from a random list; we generate hypotheses based on background theories that have already proven truth-conducive. The "lot" isn't random; it's filtered.
      *   **Realist Reply 2 (No Miracles / Success of Generation):** The process of hypothesis generation isn't arbitrary. If we consistently find hypotheses that work *and* explain, the probability that *all* of them are false while saving phenomena is low. Or, focus on the *contrastive* nature of IBE (Why this rather than that?).
