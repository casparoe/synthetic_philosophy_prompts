answer: |-
  It is a pleasure to correspond with someone who has not only grappled with the dense architecture of Sidgwick's *Methods of Ethics* but has also taken the trouble to examine the laboratory notebooks, so to speak, of his life. Your observation is astute: the connection between Sidgwick's ethical dualism and his presidency of the Society for Psychical Research (SPR) is not merely biographical trivia; it is the structural steel holding up his philosophical edifice.

  As a retired experimentalist, I have spent decades watching colleagues fall in love with their hypotheses. It is the great seduction of our trade. We want the signal to be real. We want the anomaly to hold. The standard critique of Sidgwick is that he succumbed to this seduction—that his psychical research was a case study in motivated reasoning, a desperate attempt by a Victorian rationalist to find empirical cover for the religious comforts he intellectually outgrew.

  I argue the opposite. Precisely because the stakes were so high for him personally and philosophically, his refusal to cook the books when the data turned sour demonstrates a methodological integrity that makes the SPR's early work a respectable, if ultimately inconclusive, scientific enterprise. Sidgwick did not abandon skepticism for hope; he subjected hope to the rigors of skepticism.

  To understand why this is rational, we must first appreciate the magnitude of the "dualism of practical reason." As you know, Sidgwick concluded *The Methods of Ethics* with a problem that haunted him until his death. He found that Rational Egoism (pursuing one's own good) and Universal Hedonism (pursuing the general good) are both self-evident principles of reason. Yet, they often conflict. In a purely materialist universe, where death is the end, it is not always rational to be moral if morality requires significant self-sacrifice. Reason becomes divided against itself.

  For Sidgwick, the only way to reconcile this dualism—to prove that it is *always* rational to be moral—was to demonstrate that the moral order of the universe is enforced by a power that survives death. He needed evidence of a "moral government of the world." He did not need this as a comfort; he needed it as a logical necessity to save ethics from incoherence.

  Enter psychical research. If telepathy or survival of death could be empirically verified, it would imply a non-material reality, potentially underwriting the moral order required to resolve the dualism. Thus, Sidgwick entered the laboratory with a profound, existential desire for a positive result. In a modern grant proposal, this would be flagged as a massive conflict of interest.

  However, the mark of a true scientist is not the absence of bias—we all have biases—but the implementation of controls to mitigate them. This is where the case of the Creery sisters becomes the pivot point of your argument.

  In 1882, the SPR investigated the Creery family, who claimed telepathic abilities in card guessing. The initial data were startlingly good, far exceeding chance expectations. For Sidgwick, this was the Holy Grail. Validated telepathy would suggest a mechanism of mind independent of the brain, a crack in the materialist door through which the possibility of survival could slip. His colleague, the physicist William Barrett, was ready to declare victory. Barrett represents the archetype of the believer-scientist, one whose enthusiasm threatens to overrun the controls.

  But then, the noise entered the signal. It was discovered that the girls had developed a system of coughs and signals to communicate the cards. The mechanism was mundane, not psychical.

  Here is the critical moment: Sidgwick scrapped the data.

  He did not try to salvage a subset of the trials. He did not argue that some telepathy might have occurred alongside the fraud. He excluded the results from the evidential record. He prioritized the integrity of the method over the convenience of the result. If this were mere motivated reasoning, Sidgwick would have found a way to keep the Creery data in the "positive" column. Instead, he treated the hypothesis as falsified in that instance.

  This willingness to discard "convenient evidence" distinguishes Sidgwick's program from the spiritualist séances of the day, which were often protected by ad hoc hypotheses against falsification. Sidgwick approached psychical research with what we might now call a "pre-registered" mindset. He defined what would count as evidence *before* the experiment, and he adhered to those definitions even when they cut against his philosophical needs.

  Furthermore, we must judge the enterprise by the standards of its time, not ours. In the late 19th century, the boundaries of physics and psychology were fluid. Electricity, magnetism, and the nervous system were still being mapped. To ask whether mind could interact with mind at a distance was not, then, as category-error-laden as it is today. It was an empirical question. The SPR's innovation was to insist that such questions be answered via controlled experimentation and statistical analysis rather than anecdote. Sidgwick's "Census of Hallucinations," for instance, was a massive data-collection effort that, regardless of its conclusions on ghosts, pioneered methods in survey methodology and the psychology of perception.

  Critics argue that a rational agent should have assigned a prior probability to survival so low that no amount of anecdotal evidence could shift it. But Sidgwick was not arguing for spiritualism; he was arguing for the *possibility* of the anomalous. He operated on the principle that if an event occurs, our theory of nature must change to accommodate it, not the other way around. This is the bedrock of experimental physics. When the Michelson-Morley experiment returned a null result for the ether, physics didn't ignore it; it rebuilt itself. Sidgwick was prepared to do the same for psychology and ethics if the data held. The tragedy, from his perspective, was that the data *never* held up to the required standard.

  Therefore, we should not view Sidgwick's psychical research as a shameful appendix to his philosophy, a lapse in judgment by an otherwise brilliant mind. It was a consistent extension of his empiricism. He had a philosophical hypothesis (the moral order requires survival) and he sought an empirical test (psychical phenomena). When the tests failed—as with the Creery sisters, and countless other mediums he investigated—he accepted the failure.

  That he continued the search for decades speaks not to delusion, but to a grim determination. He was like a physicist continuing to look for proton decay long after the initial detectors came up empty, because the Grand Unified Theory requires it. He hoped to find the particle that would save ethics, but he refused to fake the detector readout.

  In the end, Sidgwick died without the evidence he sought. The dualism of practical reason remains unresolved. But the methodological legacy of his inquiry remains sound. He demonstrated that one can pursue a deeply personal, philosophically motivated question without compromising the rigorous exclusion of error. In a field often dominated by charlatans and true believers, Sidgwick's hard-nosed exclusion of the Creery data stands as a testament to scientific virtue. It was a rational gamble, played by the rules, even though the house ultimately won.
