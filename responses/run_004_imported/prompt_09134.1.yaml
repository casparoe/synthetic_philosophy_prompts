  can you write me a dialogue (like 15ish exchanges) between a Bratman-type philosopher and a Gilbert-type philosopher hashing this out, using the "walking together" case specifically, especially the part where one person just stops without a word? make sure neither one is a strawman, they should actually be responding to each others points instead of just restating their own view — and I want it to get at whether Bratman's reductive story can explain the "you can't just walk off like that" feeling, or whether Gilbert's right that you need the extra "joint commitment" thing that isn't reducible to individual intentions. you don't need to look anything up, just go off whatever you already know about their views.
