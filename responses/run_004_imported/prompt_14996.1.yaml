  2.  **Deconstruct the User's Argument:**
      *   *Core Claim:* The mathematical structure (Rydberg formula, quantum numbers, energy levels) persists across theory changes (Bohr -> QM), even though the ontology (orbits -> wavefunctions) changes radically.
      *   *Comparison:* Analogous to Worrall's Fresnel/Maxwell case (equations stay, ether goes), but arguably stronger because the "medium" (orbiting particle) disappears more completely than the ether did.
      *   *Worry 1:* Is this just the Correspondence Principle (Bohr/Post) dressed up?
