      *   **Topic:** Structural Realism (SR), specifically comparing Worrall's Epistemic Structural Realism (ESR) and Ladyman/Ross's Ontic Structural Realism (OSR), using the Hydrogen spectrum (Balmer/Rydberg -> Bohr -> Sommerfeld -> Schrödinger/Dirac) as the case study instead of the standard Fresnel/Maxwell case.
      *   **Specific Questions:**
          1.  Accuracy of representation of Worrall and Newman's objection.
