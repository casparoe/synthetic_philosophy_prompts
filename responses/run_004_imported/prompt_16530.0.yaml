      *   *Connection to Arrow:* Arrow's Impossibility Theorem deals with social welfare functions (ranking all candidates) and focuses on Independence of Irrelevant Alternatives (IIA) + Pareto + Non-dictatorship. G-S deals with social choice functions (picking one winner) and focuses on Strategy-proofness. They are deeply related (often called "cousins" or "Arrow in different clothes").
