answer: |-
  **Eulogy for Grandmother**

  Good morning. Thank you all for being here to honor my grandmother.

  We gather to mourn a loss, but as many of you know, saying goodbye to her was not a single moment. It was a span of days. And in this room, there are different memories of when she actually left us.

  Some of us hold onto Tuesday. On that day, the doctors told us that her mind, her spirit, the very essence of who she was, had slipped away. She could no longer breathe for herself, she could no longer know us, and she could no longer feel pain. For those who hold Tuesday, her death was the departure of the person we knew. The body remained, but the grandmother who told us stories, who worried about us, and who loved us was already gone.

  Others of us hold onto Friday. For those who hold Friday, death was not just the silence of the mind, but the stopping of the heart. As long as her chest rose and fell, as long as her hand was warm to the touch, she was still physically here. To let go before the heart stopped felt like giving up on her while she was still fighting. For those who hold Friday, her death was the final quieting of her body.

  I know there has been pain in that difference. I know it is hard to look at the same week and see two different endings. But standing here today, I do not think we need to solve that puzzle to honor her.

  Medicine tries to define death with precision. It looks for lines and criteria and tests. But love is not precise. Love is messy. Love clings to warmth. Love recognizes when the light has gone out. Both of those instincts—the instinct to let go when the mind is gone, and the instinct to hold on as long as the heart beats—are acts of devotion.

  My uncle is right: she was gone in spirit on Tuesday.
  My mother is right: she was present in body until Friday.

  We do not need to agree on the hour to agree on the love. The fact that we struggle with this, the fact that it tears at us, is only because she mattered so much to every single one of us. If she were less loved, the timing wouldn't hurt this much.

  So, let Tuesday be the day we mourn the loss of her voice. Let Friday be the day we mourn the silence of her heart. Both days are sacred. Both days are true.

  But ultimately, the date on a certificate does not hold her. She is not confined to a Tuesday or a Friday. She is in the recipes we cook, in the values she taught us, and in the way we treat one another when we are grieving. She is in this room, not in the machinery that kept her breathing, but in the breath we take together right now.

  We can lay down the argument about when she died, and pick up the certainty of how she lived. She lived fully. She loved deeply. And she remains with us, beyond biology, beyond time, in every memory we share.

  Rest in peace, Grandma. You are free now, from definitions, from machines, and from pain. You are just you. And we are still yours.

  Thank you.
