      *   Make sure to mention that this proves "Majority Rules" is indeed ill-defined for connected propositions.

  8.  *(Self-Correction during drafting)*: I should make sure to distinguish between *preferences* and *judgments*. Arrow is about preferences. This is about *judgment aggregation*. That's a key distinction to validate the user's intuition that it's not quite Arrow.

