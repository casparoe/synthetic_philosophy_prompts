answer: |-
  You are right to be suspicious of the deacon's summary. It is a classic case of a complex theological position being flattened into a soundbite, to the point where it misrepresents the mature thought of the author. Your intuition that there are distinct scenarios at play—and that the *Summa* text is more cautious than the *Sentences* commentary—is correct.

  Here is a breakdown of the specific tensions you identified, followed by a more accurate summary you can use.

  ### 1. The "Hedge": Prudence or Justice?
  You asked whether the proviso (that resistance must not cause *more* harm than the tyranny) is merely practical caution or built into justice itself. For Aquinas, it is the latter.

  Aquinas's political philosophy is teleological: the purpose of government is the **Common Good**. A tyrant violates justice by substituting the *private good* of the ruler for the *common good*. However, resistance is also judged by whether it serves the Common Good. If "disturbing" the government leads to civil war, anarchy, or a worse tyranny, the act ceases to serve the Common Good. Therefore, it is not simply that the act is "wise" or "unwise"; rather, an act of resistance that destroys the community it intends to save becomes intrinsically disordered. It fails the definition of justice because it no longer aims rightly at the end of political life.

  ### 2. "Disturbing" vs. "Killing"
  In *Summa Theologiae* IIa–IIae, q. 42, a. 2, Aquinas is specifically defining **sedition**. Sedition is a sin against the unity and peace of the multitude. His point here is that because a tyrant has *already* broken the unity of the common good, opposing him is not technically "sedition."

  However, "disturbing" (*perturbare*) in this context generally refers to factional strife, public unrest, or deposition. It does not explicitly authorize **tyrannicide** (the assassination of the ruler by a private individual). The *Summa* passage is about the *multitude* and the moral status of discord, not a license for individual violence.

  ### 3. The *Sentences* vs. The *Summa* (and *De Regno*)
  You have correctly identified two distinct streams in Aquinas's work:

  *   **The *Commentary on the Sentences* (Early Work):** Here, Aquinas addresses the specific question of whether killing a tyrant is meritorious. He argues that if a ruler seized power by force (*tyrannus ex defectu tituli*) and there is no higher authority to judge him, a private individual may kill him to free the people. This is likely the source of the deacon's claim that the killer "deserves praise."
  *   **The *Summa* and *De Regno* (Mature Work):** In his later writings, Aquinas becomes more cautious regarding private violence. In *De Regno* (On Kingship), he argues that while it is permissible to depose a tyrant, it should ideally be done by **public authority**, not private presumption. He worries that private assassination often leads to greater evils (martyrdom of the tyrant, retaliation, or a worse successor).

  The deacon conflated the early, narrower permission for tyrannicide (against a *usurper* with no judge) with the broader discussion of resisting an *unjust government* in the *Summa*, while omitting the crucial proportionality clause and the preference for public authority.

  ### A More Accurate Summary
  If you wish to offer a correction or simply clarify the matter for yourself, a more accurate one- or two-sentence summary of Aquinas's mature view would be:

  > "While Aquinas earlier suggested that killing a usurping tyrant might be praiseworthy if no higher authority exists, his mature teaching emphasizes that resisting tyranny is only just if it is undertaken by public authority and is likely to produce less harm to the common good than the tyranny itself."

  ### A Note on Your RCIA Journey
  It is encouraging that you are engaging the tradition with this level of rigor. Catholic intellectual tradition often welcomes this kind of scrutiny; the faith seeks understanding (*fides quaerens intellectum*), and Aquinas himself spent his life wrestling with objections and distinctions. The fact that your deacon oversimplified a difficult point doesn't reflect on the tradition itself, but rather on the difficulty of teaching dense scholastic theology in a parish hall setting.

  You are asking the right questions. Keep tracking down the sources.
