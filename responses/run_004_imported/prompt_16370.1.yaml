answer: |-
  **SCENE:** *Mission Control, High Desert. The room is a dim cavern of glowing consoles and the low hum of cooling fans. A large countdown clock reads T-MINUS 00:07:00. DR. ELENA VANCE, late sixties, wears a worn leather jacket over her flight suit. She holds a tablet like a shield. JULIAN THORNE, early forties, stands in her path near the primary uplink station. He holds a printed manuscript, dog-eared and annotated.*

  **THORNE:** Dr. Vance. You need to scrub the launch.

  **VANCE:** (Without looking up from the tablet) Security? How did he get past the checkpoint? Julian, was it? The philosophy consultant.

  **THORNE:** Consultant is generous. I'm here to save the consortium about four hundred million dollars. And to save you from a category error.

  **VANCE:** (Finally looks at him) The satellite measures spatial curvature to a precision of $10^{-5}$. It distinguishes between a closed geometry (Model A) and a flat/open inflationary geometry (Model B). That is not a category error. That is trigonometry.

  **THORNE:** It is trigonometry applied to a question already settled by the fact that you are standing here holding that tablet. Look, I've read your papers on the Higgs coupling. You're a Bayesian at heart. You update credences based on evidence.

  **VANCE:** I update based on *data*.

  **THORNE:** Your existence is data. Consider the two models. Model A: Finite universe, recollapses, total observers $N \approx 10^{20}$. Model B: Eternal inflation, total observers $N \approx 10^{100}$ or infinite. Prior to this conversation, let's grant you equal priors. 50/50.

  **VANCE:** Standard indifference. Go on.

  **THORNE:** Now, condition on the evidence: *I exist.* Under Model A, the probability of *you* specifically existing is proportional to $1/N_A$. Under Model B, it is proportional to $1/N_B$. Wait, no—that's the Sampling Assumption. I'm talking about the Self-Indication Assumption. SIA says: Given that you exist, you should favor hypotheses that predict more observers. Why? Because you are more likely to find yourself existing in a world where there are more "slots" for observers to occupy.

  **VANCE:** The Presumptuous Philosopher. I read Bostrom.

  **THORNE:** Then you know the math. If $N_B$ is a trillion times larger than $N_A$, the likelihood ratio favors Model B by a factor of a trillion. Your posterior probability for Model B is effectively one. The satellite isn't just redundant; it's a waste of resources that could feed the hungry. You already know the answer. You are living in the big universe.

  **VANCE:** (Taps the tablet screen) T-MINUS 05:00. Julian, this is the "presumptuous" objection for a reason. It implies I can determine the topology of spacetime without looking out the window. If I apply your logic, I can prove the universe is infinite simply by noting that infinite universes contain more people like me.

  **THORNE:** And why is that impossible? If you woke up in a hotel, and you were told one wing had ten rooms and the other had ten thousand, and you found yourself in a room, where would you bet you were?

  **VANCE:** In the wing where the rooms are booked. But that's because I have prior knowledge of hotel occupancy rates. In cosmology, I have no prior knowledge of "observer occupancy rates." You are treating "observers" as lottery tickets drawn from a bag. But I am not a random draw. I am a causal consequence of physical laws.

  **THORNE:** Exactly! And which physical laws? The ones that produce more consequences should be weighted higher. This isn't armchair magic; it's Bayes' Theorem applied to indexical information. If you reject SIA, you must retreat to the Self-Sampling Assumption (SSA). You must say you are a random sample from the reference class of observers.

  **VANCE:** I might.

  **THORNE:** Then you accept the Doomsday Argument.

  **VANCE:** (Sighs) Here we go.

  **THORNE:** If you are a random sample from all humans who will ever live, and you find yourself among the first 100 billion, it is statistically unlikely that there will be trillions more after you. SSA forces you to predict human extinction sooner rather than later. It penalizes large futures. Do you want to bet the future of the species on a probability puzzle that says we're likely to die out because we were born too early?

  **VANCE:** I would rather bite the Doomsday bullet than bite the Presumptuous bullet. At least Doomsday leaves room for empirical disconfirmation. If we colonize the galaxy, SSA updates. But your SIA says the measurement *cannot* update you. If the satellite comes back and says "Closed Universe, Model A," what do you do?

  **THORNE:** Then I update. But the prior is so heavily weighted toward B that I would need overwhelmingly strong evidence to move to A.

  **VANCE:** But the evidence *is* the curvature measurement! You're saying my existence as an observer is stronger evidence than a photon's path through spacetime? That inverts the scientific method. It makes the map larger than the territory.

  **THORNE:** It makes the observer part of the territory. Look, the reason you hesitate is the Reference Class problem. You're thinking: "What counts as an observer? Chimpanzees? AI? Boltzmann Brains?"

  **VANCE:** Precisely. If Model B predicts infinite observers, but most of them are Boltzmann Brains—random fluctuations with false memories of reading this manuscript—then SIA forces me to conclude *I* am a Boltzmann Brain. Because there are infinitely more of them than evolved observers.

  **THORNE:** (Shifts weight) That is the measure problem, yes. But we can regulate the measure. We can restrict the reference class to "observers with coherent histories."

  **VANCE:** Who decides? You? If you tweak the reference class to exclude Boltzmann Brains, you're rigging the prior to get the answer you want. If you don't, SIA destroys empirical science because we can never trust our memories in an infinite universe.

  **THORNE:** And if you stick with SSA to avoid that, you get the Adam and Eve paradox.

  **VANCE:** Remind me.

  **THORNE:** Under SSA, if Adam and Eve are the only two humans, the probability of a deer dying at their cave entrance is vanishingly small *unless* they intend to hunt it. Why? Because if they don't hunt it, they won't reproduce, the reference class stays small, and their probability of being the first two observers remains high. But if they do hunt, humanity expands, and they become a tiny fraction of the total. SSA implies their intentions causally influence the deer's heart failure. It creates spurious psychic powers.

  **VANCE:** That's a reductio of SSA, I grant you. But it doesn't validate SIA. It just means both frameworks are broken tools for cosmology.

  **THORNE:** Or it means you're uncomfortable with the implications of probability when the sample space is *everything*. You want to treat your existence as a fixed background condition. "I am here, now calculate the physics." But you can't separate the observer from the observed in this context. The fact that there is someone to ask the question is evidence about the kind of universe that allows askers.

  **VANCE:** T-MINUS 03:00. Julian, listen. When I ran collider experiments, we didn't worry about whether the Higgs boson was "surprised" to be observed. We counted events. If I see a track in the bubble chamber, I infer a particle. I don't infer a particle *and* a million invisible universes where the track didn't happen, just to balance the books.

  **THORNE:** That's because in the collider, the number of trials is fixed by the machine. In cosmology, the number of trials *is* the theory. Model A says few trials. Model B says many. If you ignore the number of trials, you're ignoring the likelihood function.

  **VANCE:** I am not ignoring it. I am saying the likelihood of *my specific data* (curvature measurement) is independent of the number of other observers. The photon doesn't care how many minds are watching it.

  **THORNE:** But *you* care. Because if Model B is true, there are a trillion copies of you seeing that photon. If Model A is true, there are only a few. When you ask "What is the probability I see this?", you have to count the "yous."

  **VANCE:** (Voice hardens) There is only one me.

  **THORNE:** Is there? In Model B, there are doppelgängers. Identical cognitive states. If you accept physicalism, you are that cognitive state.

  **VANCE:** Then we are at the bottom of the well. You define "I" as a pattern that can be instantiated multiple times across the multiverse. I define "I" as this specific biological instance at this spacetime coordinate.

  **THORNE:** If you define "I" indexically as *this* instance, you can't do cosmology. You can't reason about the whole if you lock yourself into the part.

  **VANCE:** And if you define "I" as a pattern, you lose the ability to be surprised by anything. You've already calculated the answer based on headcount. You've made the satellite launch an act of theater.

  **THORNE:** It is theater. But it's expensive theater.

  **VANCE:** (Turns to the console) T-MINUS 02:00. Systems green. Let me ask you this. You say SIA favors Model B. Suppose the satellite launches. Suppose it measures positive curvature. Model A is confirmed. What then? Do you say the satellite is wrong?

  **THORNE:** I would say the evidence was strong enough to overcome the SIA prior. But the prior stands. Next time, before building a billion-dollar satellite, check the observer count.

  **VANCE:** But that's the thing. You say "check the observer count." How? We can't count observers in the unobservable universe. We can only infer them from... physics. From curvature. From models. You are using the conclusion of the physical inference to set the prior for the physical inference. It's circular.

  **THORNE:** It's not circular, it's recursive. You use physics to estimate $N$, then use $N$ to update the physics.

  **VANCE:** And if the recursion diverges? If Model B implies infinite observers, your probability for B becomes 1.0 instantly. No data can ever move you. You have rendered yourself dogmatic. A scientist who cannot be falsified is not a scientist.

  **THORNE:** And a scientist who ignores the selection effects of her own existence is not a rational agent. You are willing to accept the Doomsday Argument—that we are likely near the end of history—just to avoid being "presumptuous" about the universe's size. Which is more arrogant? Assuming the universe is big because it allows more of us? Or assuming we are special because we are early?

  **VANCE:** (Pauses, looks at the countdown) I don't accept Doomsday. I reject the premise that I am a random sample from the set of all humans. I am a causal product of my parents, who were products of theirs. The "reference class" is a fiction. There is no urn from which souls are drawn.

  **THORNE:** Then what licenses your inferences? Why do you expect the sun to rise tomorrow?

  **VANCE:** Because of thermodynamics and orbital mechanics.

  **THORNE:** And why do you expect those laws to hold? Because they have held in the past. But "the past" is just the data available to observers. If the laws were different, maybe there would be no observers to check. You are using anthropic reasoning right now to trust your physics. You just want to hide it.

  **VANCE:** I use the Principle of Mediocrity to assume I'm not in a special *place*. You use it to assume I'm not in a special *universe*. There is a difference. One is about location within a system; the other is about the system itself.

  **THORNE:** Is there? If the multiverse is real, "which universe" is just a location question.

  **VANCE:** T-MINUS 01:00. Final check. Julian, I can't stop the launch. Even if I believed you, the consortium wouldn't. They need the data.

  **THORNE:** Then you are proceeding on faith.

  **VANCE:** No. On method. Science requires that the world can tell us we are wrong. Your SIA makes it nearly impossible for the world to tell us Model B is wrong. If the data comes back A, you'll say "Well, the prior was strong, but okay." But in your heart, you'll always think the data is the fluke. That corrodes the enterprise.

  **THORNE:** And if you ignore SIA, you will spend centuries building satellites to answer questions your own existence has already solved. You are the one corroding the enterprise by refusing to update on all available evidence.

  **VANCE:** (Turns to the microphone) Control to Launch. T-MINUS 30 seconds. Guidance internal power.

  **THORNE:** (Quietly) You know, if Model B is true, there is a version of you in a nearby branch of the wavefunction who listens to me.

  **VANCE:** (Into mic) Ignition sequence start. (To Thorne) And in this branch, I trust the photon.

  **THORNE:** (Watching the screens light up) We'll see whose priors survive the data.

  **VANCE:** We'll see if the data survives your priors.

  *The room vibrates as the engines ignite on the pad miles away. The telemetry screens flare with green streams. Thorne watches the numbers, calculating likelihoods. Vance watches the trajectory, trusting the arc. Neither blinks.*

  **FADE OUT.**
