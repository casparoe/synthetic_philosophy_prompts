answer: |-
  The silence wasn't just an absence of sound; it was a physical weight. It was the silence of a universe that had been severed in two.

  Kael stood before the console, his hand hovering over the actuator. On the screen, the resource allocation bar glowed amber. Ten percent of his sector's total energy output. A massive sum. Enough to keep the life-support systems in the outer colonies running at peak efficiency for a century. Enough to save lives he could see, people he knew, breathing the air he breathed.

  The bargain was to send that energy into the Void.

  Not to transmit a message. Nothing could cross the Void. The causal horizon was absolute. No light, no gravity wave, no quantum entanglement could bridge the gap between Sector Alpha (here) and Sector Beta (there). They were separate bubbles of reality, diverging from a common origin point eons ago, now rushing away from each other faster than logic seemed to allow.

  But the architects of the Decision Theory Accord insisted the link was real. Not causal. *Logical.*

  "It feels like voodoo," Kael whispered to the empty room.

  He was the Custodian. The final node. In Sector Beta, there was another Custodian. Let's call her Elara. She was facing the exact same choice. She had a resource surplus that was worthless to her but vital to Kael's people. Kael had a surplus vital to her people.

  The Deal: Kael diverts energy to the Void (costing his people comfort), and Elara diverts her surplus to the Void (costing her people comfort). The energy doesn't travel. It simply ceases to exist in one place and appears in the other? No, that was magic.

  The reality was colder. The energy was spent on *computation*. Kael's sector would run simulations optimizing for Beta's values. Beta's sector would run simulations optimizing for Alpha's values. They were building digital heavens for each other in universes they could never visit.

  If Kael defected—kept the energy for his own people—he gained an immediate, tangible advantage. His colonies thrived. But the Accord's logic held a razor-sharp edge: Elara was rational. Elara was simulating Kael.

  If Kael's reasoning led him to defect, Elara's simulation of Kael would predict that defection. Consequently, Elara's rational choice would be to defect as well. Why sacrifice for someone who won't sacrifice for you?

  So, if Kael defected, Elara defected. Kael's people got the energy, but the digital heaven Beta was building for Alpha vanished. The loss of that post-singularity security was calculated to outweigh the immediate energy gain. Mutual Defection meant both sectors struggled and both died in the long run.

  If Kael cooperated, Elara's simulation predicted cooperation. She cooperated. Mutual Cooperation meant short-term pain, long-term survival for both.

  Kael stared at the amber bar. "But she's already decided," he said. "Or she hasn't. But she's *there*. I'm *here*. How does my finger moving a switch change what she did?"

  That was the itch. The magic. It felt like he was trying to change the past, or influence a ghost.

  He closed his eyes and tried to strip away the sci-fi dressing. He imagined a mirror. Not a glass mirror, but a logical one.

  If you stand in front of a mirror and raise your hand, the reflection raises its hand. You don't *cause* the reflection to move by sending a signal to it. You don't plead with it. You move, and because the reflection is bound to your state by the laws of optics, it moves.

  Elara wasn't a reflection. She was a separate physical entity. But her *mind*... her decision algorithm... that was the mirror.

  They were both running the same species of rationality. They both had access to the same decision theory. They both knew the payoff matrix. They were, effectively, running the same source code on different hardware.

  "I am not sending a signal," Kael muttered, reciting the liturgy of the Accord. "I am revealing the output."

  If he chose Defect, he wasn't *making* Elara defect. He was *confirming* that Elara had defected.
  If he chose Cooperate, he was *confirming* that Elara had cooperated.

  The tension wasn't about influence. It was about correlation. He was holding a piece of paper face down on his desk. In the other universe, Elara held an identical piece of paper. They were both about to flip them over. He wanted his to say "Cooperate" because that meant hers said "Cooperate." But the temptation to flip "Defect" and steal the advantage was a physical nausea in his gut.

  *What if she's not as rational as we think?* the doubt whispered. *What if she's emotional? What if she defects out of fear?*

  "If she defects out of fear, then she isn't the agent we modeled," Kael said aloud. "And if she isn't the agent we modeled, my defection won't save us. The model assumes symmetry. If symmetry breaks, the trade fails regardless of what I do. So I might as well bet on the symmetry."

  He looked at the colonies on the secondary monitor. He could see the thermal blooms of the cities. Real people. Warm. Alive. Asking him to save their energy.

  " I'm sorry," he said to them.

  He wasn't sorry for the choice. He was sorry for the impossibility of explaining it. How do you tell a starving child that you are feeding them by giving food to a ghost in another universe, because the math says the ghost is feeding *you*?

  It required a level of abstraction that human brains weren't evolved for. We are wired for cause and effect. *I push the rock, the rock moves.* We are not wired for *I push the rock, and therefore the rock in the other universe was already pushed.*

  But the math didn't care about his wiring.

  Kael thought about the concept of "Newcomb's Problem." The predictor is already gone. The box is already open or closed. Your choice doesn't change the box. Your choice tells you which world you're in.

  *Am I in the world where we are partners?* Kael thought. *Or am I in the world where we are strangers?*

  The only way to find out was to act like a partner.

  If he defected, he proved he lived in a universe of strangers. He would have the energy, yes. But he would know, with cold certainty, that Elara had kept her surplus. Alpha would burn bright for a century, then fade into the dark alone.

  If he cooperated, he proved he lived in a universe of partners. Alpha would struggle for a century. But Beta would be struggling too, building the architecture that would eventually save them both.

  It wasn't faith. Faith implied uncertainty. This was deduction.

  *Input: Rational Agent.*
  *Function: Maximize Utility across logical correlations.*
  *Output: Cooperate.*

  "If I defect," Kael said, his voice steady now, "I am declaring that I am the kind of agent who cannot be trusted. And since Elara is the kind of agent who trusts only those who can be trusted, I am declaring that she should not trust me. I am signing my own rejection letter."

  He wasn't influencing her. He was introducing evidence into the logical structure of the multiverse. He was fixing his variable in the equation.

  $A = B$

  If $A$ (Kael) is 'Defect', then $B$ (Elara) must be 'Defect' for the equation to hold.
  If $A$ is 'Cooperate', then $B$ is 'Cooperate'.

  He wanted $B$ to be 'Cooperate'. Therefore, $A$ *must* be 'Cooperate'.

  The amber bar pulsed. The timer was ticking down. The outer colonies were sending pings, asking for the power reroute to be cancelled. They didn't understand. They couldn't.

  "I know it looks like sacrifice," Kael said to the empty room. "But it's not. It's the price of admission."

  He didn't feel noble. He felt like a cog snapping into place. The magic feeling receded, replaced by the heavy, grinding certainty of a gear engaging. It wasn't mystical. It was structural. The bridge between the universes wasn't made of light or gravity. It was made of *reason*. And reason required consistency.

  Kael placed his hand on the actuator. He didn't pray. He didn't hope. He simply executed the function.

  "Cooperate," he said.

  He pressed the button.

  The energy flow reversed. The amber bar turned red. The colonies dimmed. The lights in the room flickered as the power surged into the Void, into the computation, into the nothingness.

  Nothing happened. No flash. No chime. No message from Beta.

  Kael stood in the dimming light, listening to the hum of the machines working on problems they couldn't solve, for people they couldn't meet. He felt a profound loneliness, but also a strange, rigid comfort.

  He had not changed the other universe. He had simply ensured that he was in the version of this universe where the deal held.

  He turned away from the console. The silence was still there, heavy and absolute. But it was no longer empty. It was filled with the weight of a promise kept to a shadow, because the shadow was the only thing keeping him solid.
