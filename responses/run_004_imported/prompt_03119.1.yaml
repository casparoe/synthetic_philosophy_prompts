      *   *Calculation:* Based on mortality tables (Buffon), a generation is ~19 years.
      *   *Implication:* Laws and constitutions should expire after ~19 years. Debts should not bind future generations.
      *   *Rationale:* Preventing tyranny of the past over the future. Allowing for progress and adaptation.
      *   *Madison's Counter:* Stability, predictability, and the benefit of accumulated wisdom/infrastructure. If laws expired constantly, chaos would ensue.

  3.  **Deconstruct the DAO Context:**
