      *   *Point 2: The Saying/Showing Distinction in ISOTYPE.*
          *   *Pros:* A chart shows data, but does it show *why* this chart represents this data? The legend/key acts as a bridge.
          *   *Cons:* Neurath would hate the idea that the mapping relation is "unsayable." For Neurath, the convention *must* be stated (in the key/legend). The "physicalist" stance demands that the coordination between sign and object be part of the physical system of science.
          *   *Verdict:* This is the weak point of the user's argument. Neurath's physicalism is incompatible with the *Tractatus* mysticism of the "unsayable."

