answer: |-
  This is a sophisticated and attractive hypothesis, and it is understandable why your reading group didn't immediately push back: on a structural level, the isomorphism between the *Tractatus* and ISOTYPE is striking. However, as you suspect, committing to this in a dissertation chapter requires navigating significant historical and philosophical minefields. If you frame this as a direct lineage (Neurath *applying* Wittgenstein), you risk a historical anachronism that examiners familiar with Vienna Circle scholarship will spot immediately. If you frame it as a structural homology (a shared epistemic virtue manifested differently), you have a much stronger, more nuanced argument.

  Here is a pressure test of your claim, broken down into the historical genealogy, the philosophical compatibility, and the specific problem of "saying/showing."

  ### 1. The Genealogical Problem: Did Neurath intend this?

  The biggest hurdle to your claim is Neurath's own attitude toward Wittgenstein. While Wittgenstein is often retroactively cast as the "spiritual godfather" of the Vienna Circle, the actual members (especially Neurath and Carnap) spent a great deal of energy trying to *distance* the Circle's public scientific worldview from Wittgenstein's mysticism.

  *   **The "Mystic" Label:** Neurath famously characterized the *Tractatus* as a mix of logic and mysticism. In the *Protocol Sentence Debate*, Neurath's physicalism was explicitly directed *against* the idea that there are private experiences or logical forms that lie outside the scope of physicalist language.
  *   **Sources of ISOTYPE:** Neurath's inspirations for the Vienna Method were typically cited as Enlightenment pedagogy, Marxian social theory, and the practical needs of housing and economic planning in "Red Vienna." He was concerned with *democratizing* knowledge, not solving the problem of logical representation.
  *   **The Risk:** If you argue ISOTYPE is a "realization" of the *Tractatus*, you imply an intellectual debt Neurath would likely have denied. He viewed the *Tractatus* picture theory as part of the "metaphysical" residue he was trying to cleanse from science.

  **Recommendation:** Do not argue that Neurath was *cashing out* Wittgenstein. Instead, argue that ISOTYPE and the *Tractatus* share a **structuralist epistemic virtue** common to the era: the belief that valid representation requires structural isomorphism (mapping relations to relations) rather than mere resemblance. This allows you to keep the philosophical comparison without making a untenable historical claim about influence.

  ### 2. The Philosophical Problem: Logical Form vs. Pedagogical Convention

  Your insight about the "unit-icon" (repeating symbols rather than resizing) is excellent. In ISOTYPE, 10 units represent 10x the quantity of 1 unit. This preserves the additive structure of the arithmetic in the visual syntax. This *does* mirror the *Tractatus* idea that a proposition must share the logical multiplicity of the fact.

  However, the *motivation* differs:
  *   **Wittgenstein:** The sharing of logical form is a transcendental condition of meaning. It is not a choice; language *cannot* work otherwise.
  *   **Neurath:** The unit principle is a **convention** chosen for psychological and pedagogical efficacy. Neurath knew humans are bad at estimating area (scaling a man icon to 2x height makes him look 4x bigger). He chose repetition to avoid cognitive distortion.

  **The Tension:** For Wittgenstein, the picturing relation is fixed by logic. For Neurath, it is fixed by social agreement and utility. This is the core of Neurath's "conventionalism."

  ### 3. The Saying/Showing Distinction: The Critical Weak Point

  This is where your argument is most vulnerable, and where Neurath's response would be most aggressive.

  In the *Tractatus*, the picturing relation (how language hooks onto the world) cannot be said; it shows itself. To try to say it is to step outside the limits of language into nonsense.

  **Neurath's Physicalist Response:**
  Neurath would reject the idea that the depicting relation is "unsayable." For Neurath:
  1.  **Everything is Physical:** Statements about charts, symbols, and their relation to data are themselves physical statements within the "Unified Science" encyclopedia.
  2.  **The Legend is the "Saying":** In ISOTYPE, the relation between the icon and the quantity is explicitly *stated* in the legend or key (e.g., "One man = 1,000 workers"). Neurath would argue that the coordination between sign and object is not a mystical showing, but a **physicalist coordination** that can and must be linguistically codified.
  3.  **Anti-Foundationalism:** Neurath's famous "boat" metaphor (we rebuild our ship at sea) implies there is no transcendental vantage point from which the "showing" happens. The relation between the ISOTYPE chart and the world is just another set of statements within the encyclopedia, subject to revision.

  **If you press the Saying/Showing analogy:**
  If you argue that ISOTYPE *inherits* the saying/showing problem, you must acknowledge that Neurath would view this as a defect to be engineered away, not a transcendental limit.
  *   *Tractatus:* The limit is in the nature of logic.
  *   *ISOTYPE:* The limit is in the design, solvable by adding a caption or key.

  ### 4. How to Salvage and Sharpen the Chapter

  You have a genuine insight here regarding **visual isomorphism**, but you need to pivot the argument to survive a defense.

  **A. Reframe the Connection:**
  Instead of "Neurath realizing Wittgenstein," try: **"Competing Visual Epistemologies."**
  Use the *Tractatus* as a foil. Wittgenstein offers a *logical* picture theory that ultimately silences the subject (ethics, value, the self). Neurath offers a *sociological* picture theory designed to empower the subject (the worker, the citizen) with actionable data. Both rely on isomorphism, but Wittgenstein's leads to silence, while Neurath's leads to social action.

  **B. Address the Saying/Showing Problem via "The Key":**
  You can keep the saying/showing point if you argue that Neurath **secularizes** it.
  *   *Claim:* ISOTYPE confronts the saying/showing problem but resolves it through **conventionalism**.
  *   *Argument:* Where Wittgenstein sees a transcendental limit (the relation can only be shown), Neurath sees a technical problem (the relation must be standardized). The ISOTYPE "Key" is the mechanism by which Neurath forces the "showing" to become "saying." He refuses to let the representation remain mystical. The legend *says* what the picture *shows*.

  **C. Consult Specific Secondary Literature:**
  To ensure you aren't missing a standard objection, check these angles:
  *   **Elisabeth Nemeth:** She writes extensively on Neurath's relationship to the rest of the Circle and his specific brand of empiricism.
  *   **Michael Otte / Christopher Burke:** Look for scholarship specifically on the design philosophy of ISOTYPE.
  *   **Peter Galison:** *Image and Logic* is essential for the tension between visual and logical representation in this period, though it focuses more on physics.
  *   **Nancy Cartwright, Jordi Cat, et al., *Otto Neurath: Philosophy between Science and Politics*:** This will help you nail the physicalist objection to the "unsayable."

  ### Summary Verdict

  **Are you right to draw the connection tightly?**
  No, not as a genealogical or intentional link. Neurath was too hostile to Wittgenstein's mysticism for that to hold water historically.

  **Is the structural analogy valid?**
  Yes, regarding the requirement of isomorphism (structure-mapping). This is your strongest philosophical ground.

  **How would Neurath respond to the Saying/Showing problem?**
  He would reject the premise. He would argue that the coordination between picture and fact is a matter of physicalist convention (the Key/Legend) and is entirely "sayable" within the Unified Science encyclopedia.

  **Strategic Advice:**
  Write the chapter around the **tension**. "While ISOTYPE appears to instantiate the Tractarian picture theory through its isomorphic design, Neurath fundamentally subverts Wittgenstein's conclusion. Where Wittgenstein finds a limit of the unsayable, Neurath finds a site for pedagogical intervention." This turns your potential weakness into a sophisticated argument about the divergence of Logical Empiricism.

  Your reading group's silence likely means the analogy *looks* plausible on the surface (which it does), not that it withstands deep scrutiny. By anticipating the physicalist objection to the "unsayable," you will demonstrate the doctoral-level command of the material that examiners look for.
