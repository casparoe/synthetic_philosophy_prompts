      *   **The Impossibility Theorem:** Chouldechova (2017) and Kleinberg et al. (2016) showed that if base rates differ ($P(Y=1|A) \neq P(Y=1|B)$), you cannot simultaneously satisfy Calibration and Error Rate Parity (Equal FPR/FNR) unless the model is perfect or base rates are equal.
      *   **Legal Context (Fair Lending):** US laws (ECOA, FHA) generally prohibit *disparate treatment* (using protected class explicitly) but also prohibit *disparate impact* (neutral policy with discriminatory outcome) unless justified by business necessity.

