  2.  **Deconstruct the Technical Fairness Concepts:**
      *   **Calibration:** $P(Y=1 | \hat{Y}=p, G=A) = P(Y=1 | \hat{Y}=p, G=B)$. If the model says 10% risk, 10% default in both groups.
      *   **Base Rate:** $P(Y=1 | G=A)$ vs $P(Y=1 | G=B)$. (Prevalence of default).
