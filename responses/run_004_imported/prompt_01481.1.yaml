answer: |-
  This is a wonderful question, and given your background in statistical mechanics, you are uniquely positioned to see the fault line here. Your colleague is mathematically correct in a narrow sense, but you are philosophically correct in a broader one. The distinction isn't in the resulting betting fraction (the *what*), but in the justification for that fraction (the *why*).

  To sort this out, we need to disentangle three layers: the mathematical equivalence, the normative divergence (preferences vs. dynamics), and the Samuelson critique.

  ### 1. The Mathematical Equivalence (Your Colleague's Point)

  Your colleague is right that the optimization problems often yield identical first-order conditions.

  In **Expected Utility Theory (EUT)**, an agent maximizes the expectation of a utility function $U(W)$. If we posit $U(W) = \ln(W)$, the agent maximizes:
  $$ \mathbb{E}[\ln(W_{t+1})] $$
  For a simple multiplicative gamble $W_{t+1} = W_t \cdot (1 + f \cdot x)$, this leads directly to the Kelly criterion.

  In **Ergodicity Economics (Peters)**, the agent maximizes the time-average growth rate. For a multiplicative process, the time-average growth rate $g$ is defined as:
  $$ g = \lim_{T \to \infty} \frac{1}{T} \ln\left(\frac{W_T}{W_0}\right) $$
  By the Law of Large Numbers, for i.i.d. returns, this converges to the ensemble expectation of the log-return:
  $$ g = \mathbb{E}[\ln(W_{t+1}/W_t)] $$
  Maximizing $g$ yields the exact same betting fraction as maximizing $\mathbb{E}[\ln(W)]$.

  So, mathematically, if you assume log-utility in EUT, you get the same result as assuming multiplicative dynamics + time-average optimization in Ergodicity Economics. Your colleague sees this isomorphism and concludes it's "standard EUT dressed up."

  ### 2. The Normative Divergence (Your Intuition)

  This is where your statistical mechanics background gives you the edge. The difference is analogous to the distinction between the **Gibbs ensemble** approach and the **Boltzmann trajectory** approach in thermodynamics.

  **In EUT (The Ensemble View):**
  The logarithm is a *psychological postulate*. It represents a specific attitude toward risk (constant relative risk aversion of 1). Why log? Because the agent *happens* to have those preferences. If the agent prefers $U(W) = -1/W$ (CRRA with $\gamma=2$), they should not bet Kelly. The "risk aversion" is a parameter of the agent's mind, external to the market dynamics. The expectation operator $\mathbb{E}[\cdot]$ sums over parallel possible worlds (ensembles) that the agent will never simultaneously experience.

  **In Ergodicity Economics (The Time-Average View):**
  The logarithm is a *dynamical derivation*. It falls out of the physics of the wealth process, not the psychology of the agent.
  *   If wealth evolves additively ($W_{t+1} = W_t + x$), the process is ergodic. The time average equals the ensemble average ($\mathbb{E}[\Delta W]$). You should maximize expected wealth change (risk neutral).
  *   If wealth evolves multiplicatively ($W_{t+1} = W_t \cdot x$), the process is non-ergodic. The ensemble average ($\mathbb{E}[W]$) diverges from the time average ($\exp(\mathbb{E}[\ln W])$).
  *   Peters argues that because an agent lives through *time*, not across *parallel worlds*, the only objective quantity they can optimize is the time-average growth rate.

  **The Crucial Distinction:**
  In EUT, choosing Log-Utility is a **subjective choice**.
  In Ergodicity, choosing Log-Growth is an **objective necessity** (given multiplicative dynamics).

  Peters is arguing that "risk aversion" isn't a preference; it's a recognition of the non-ergodicity of multiplicative dynamics. A physicist wouldn't say a gas molecule has a "preference" to maximize entropy; they would say the dynamics drive it there. Peters treats economic agents more like physical systems traversing a phase space.

  So, to answer your first question: **Yes, it is a genuinely distinct normative principle.** EUT asks, "What do you prefer?" Ergodicity asks, "What dynamics are you subject to?"

  ### 3. Samuelson's 1979 Critique

  Paul Samuelson's paper *"Why We Should Not Make Mean Log of Wealth Big Though Years to Act Are Long"* is the canonical attack on Kelly. His argument was twofold:

  1.  **The Fallacy of Large Numbers:** Just because you repeat a gamble many times doesn't mean the Law of Large Numbers saves you from ruin or bad outcomes in *utility* terms. If your utility function is not log, maximizing geometric mean wealth (Kelly) is suboptimal, even in the long run.
  2.  **No Universal Imperative:** There is no logical reason why an agent *must* maximize geometric growth. An agent might care about consumption, bequests, or survival thresholds that don't align with asymptotic growth.

  **Does Peters escape Samuelson?**

  He sidesteps the first charge but remains vulnerable to the second.

  *   **Sidestepping Charge 1:** Samuelson assumed the goal was Expected Utility. He said, "If you want to max EU, don't use Kelly unless $U=\ln$." Peters replies, "I am not maximizing EU. I am maximizing time-average growth." By changing the objective function from an ensemble average of utility to a time average of wealth, Peters renders Samuelson's mathematical objection irrelevant. In the ergodic framework, the "long run" *does* matter because the time average is defined as the limit $T \to \infty$.
  *   **Vulnerability to Charge 2:** Samuelson's deeper philosophical point remains: **Why must you maximize time-average growth?**
      *   **Finite Horizons:** Ergodicity requires $T \to \infty$. If you are retiring in 10 years, the asymptotic growth rate is less relevant than the distribution of wealth at $T=10$. The "time average" is a property of the process, but the agent might care about the *state* at a specific time.
      *   **Path Dependence & Ruin:** While Peters incorporates ruin (growth rate goes to $-\infty$ if wealth hits 0), real agents have "soft" ruin levels (poverty lines, margin calls).
      *   **Consumption:** Wealth is usually a means to consumption. If you optimize growth but never consume, you die rich. A proper decision theory needs to integrate consumption flows, which complicates the simple multiplicative dynamic.

  Samuelson was attacking the idea that Kelly is a *universal* moral imperative for all investors. Peters restricts Kelly to a *specific class of dynamic problems* (multiplicative, reinvested wealth). In that sense, Peters is actually *more* aligned with Samuelson's demand for rigor: Kelly is only valid when the dynamics demand it.

  ### 4. Geometric Rationality: Principle or Costume?

  You asked if "geometric rationality" escapes the charge of being illegitimately stretched.

  **The Verdict:**
  Peters' framework is not just "costume," but it is not a complete replacement for decision theory either. It is a **correction to the application of probability in economics.**

  Standard economics often treats expectation values ($\mathbb{E}[W]$) as if they are observable quantities. As you know from stat mech, $\mathbb{E}[W]$ is only observable if the system is ergodic. For multiplicative wealth, it is not. Therefore, using $\mathbb{E}[W]$ as a decision criterion is physically meaningless for a single agent.

  **Where Geometric Rationality Holds:**
  *   Repeated reinvestment scenarios.
  *   Evolutionary contexts (populations that don't maximize geometric growth go extinct).
  *   Situations where the "ensemble" is not accessible (you can't bet in 1,000 parallel universes).

  **Where Samuelson Still Wins:**
  *   **One-off bets:** If you only bet once, the time-average limit doesn't exist. You must rely on preferences (EUT).
  *   **Additive bets:** If you bet a fixed dollar amount (not fraction), dynamics are additive, ergodicity holds, and you should maximize expected value (risk neutral), not Kelly.
  *   **Non-wealth goals:** If utility depends on relative status, health, or other non-multiplicative goods, the log-wealth derivation fails.

  ### Summary for Your Debate

  You can tell your colleague this:

  1.  **Mathematically:** He is right. Log-utility EUT and Time-Average Ergodicity yield the same betting fraction for i.i.d. multiplicative gambles.
  2.  **Conceptually:** You are right. EUT treats log as a *preference* (subjective); Ergodicity treats log as a *dynamic property* (objective). This is the difference between Gibbs and Boltzmann.
  3.  **Regarding Samuelson:** Peters solves the "non-ergodicity" problem that Samuelson highlighted but ignored. However, Samuelson is still correct that this does not constitute a *universal* decision theory. It is a theory of *capital growth dynamics*, not a theory of *human choice* in all contexts.

  Peters hasn't disproven Expected Utility Theory; he has carved out a specific domain (non-ergodic multiplicative processes) where Expected Utility Theory was being misapplied by confusing ensemble averages with time averages. In that domain, "geometric rationality" is not a costume; it's the correct physics. Outside that domain, Samuelson's warning still applies.

  Given your history in stat mech, you likely appreciate that the "Ergodic Hypothesis" is a powerful tool, but one that fails near phase transitions or in glassy systems. Economics is full of glassy systems. Peters fixes the ergodic assumption; Samuelson reminds us that not all problems are ergodic. Both are needed.
