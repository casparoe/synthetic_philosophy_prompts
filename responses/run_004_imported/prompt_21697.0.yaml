answer: |-
  Your friend is right: you are collapsing a crucial distinction. While both Ian Hacking and Thomas Szasz are critical of standard psychiatric classification, they arrive at their conclusions from opposite philosophical directions, and they mean very different things by the "reality" of mental disorders.

  Your argument rests on the idea that **instability implies non-existence.** You reason that if a diagnostic category shifts due to human interaction (looping), it cannot be tracking an objective, independent fact. Therefore, the diagnosis is a "myth."

  Hacking would agree with the premise (looping effects make human kinds unstable) but reject the conclusion (therefore they are myths/unreal). Szasz would agree with the conclusion (mental illness is a myth) but for entirely different reasons that Hacking explicitly rejected.

  Here is the breakdown of why Hacking's looping effects do not vindicate Szasz's "myth" thesis.

  ### 1. Szasz: The Argument from Ontology
  Thomas Szasz's claim in *The Myth of Mental Illness* is ontological and biomedical. His argument is roughly this:
  *   **Premise 1:** To be a literal "illness," a condition must involve a physical pathology (a lesion, cellular dysfunction, or biological deviation).
  *   **Premise 2:** "Mental illnesses" are deviations in thought, behavior, or emotion, not physical pathology.
  *   **Conclusion:** Therefore, "mental illness" is a category mistake. It is a metaphor used to control "problems in living."

  For Szasz, the diagnosis is a **fiction** masking a moral or social conflict. If you remove the label, the "disease" disappears because it never existed; only the behavior remains.

  ### 2. Hacking: The Argument from Interaction
  Ian Hacking's concept of "looping effects" (and his broader theory of "dynamic nominalism") is about the **mechanics of classification**, not the denial of suffering. His argument is roughly this:
  *   **Premise 1:** Human kinds (classifications of people) are "interactive." People know how they are classified and change themselves in response to that classification.
  *   **Premise 2:** This feedback loop causes the classification and the classified people to co-evolve over time.
  *   **Conclusion:** Therefore, human kinds are historically unstable and cannot be studied like "indifferent kinds" (like quarks or tigers).

  For Hacking, the diagnosis is a **tool that shapes reality.** If you remove the label, the *experience* of the person might change, but the suffering does not necessarily vanish. The label participates in creating the *kind of person* who suffers, but it does not prove the suffering is fake.

  ### 3. The Crucial Divergence
  The error in your argument is equating **social construction** with **fabrication**.

  **Szasz thinks psychiatric categories are lies.** He believes they are used to incarcerate or medicate people who are simply deviating from social norms. He wants to abolish the categories because they refer to nothing real.

  **Hacking thinks psychiatric categories are engines of reality.** He argues that by naming a condition (e.g., "multiple personality disorder" or "PTSD"), we create a space in which people can experience themselves in new ways. This doesn't mean the pain is fake. It means the *form* the pain takes is influenced by the available vocabulary.

  Hacking explicitly distanced himself from the "everything is constructed, therefore nothing is real" crowd. He argued that looping effects demonstrate a specific kind of **causal power**. If a diagnosis loops back and changes a patient's behavior, the diagnosis has real causal efficacy. A "myth" in Szasz's sense is supposed to be powerless truth; a "looping kind" in Hacking's sense is a powerful truth-maker.

  ### 4. Applying this to Complex PTSD (C-PTSD)
  Let's look at your cousin's diagnosis through both lenses.

  **The Szaszian View:**
  C-PTSD is a myth. Your cousin experienced difficult life events ("problems in living"). By labeling it C-PTSD, psychiatry medicalizes a normal human reaction to abnormal circumstances. The symptoms are real, but the *disease* is not. The label is a tool of social control or pharmaceutical marketing.

  **The Hackingian View:**
  C-PTSD is an interactive kind. Before this category existed (or before it became popular), your cousin might have understood their suffering as "damage," "weakness," or "grief." Now that the category exists, your cousin can understand their suffering as "C-PTSD."
  *   **The Loop:** This new self-understanding changes how they behave (seeking specific therapies, joining support groups, narrating their past differently).
  *   **The Clinician:** Clinicians observe these new behaviors and refine the criteria for C-PTSD to match the patients they are seeing.
  *   **The Reality:** Does this make the trauma fake? No. Does it make the symptoms imaginary? No. It means the *classification* is a moving target because it is entangled with human self-consciousness.

  ### 5. Why Objectivity Survives (Sort of)
  You argued that because the target moves, it isn't objective. Hacking would say you are using the wrong definition of objectivity for the human sciences.

  *   **Natural Science Objectivity:** Static, independent of observation (an electron doesn't care if you call it an electron).
  *   **Human Science Objectivity:** Dynamic, acknowledges the interaction between the observer, the label, and the observed.

  Hacking's point is not that we should stop using diagnoses because they loop. His point is that we must recognize that **diagnoses make up people.** When we diagnose your cousin, we are not just describing a static object; we are offering them a new way to be a person.

  ### Conclusion
  Your friend was correct. You have used Hacking's description of *how* psychiatric categories function (they loop and shift) to support Szasz's conclusion about *what* they are (myths/fictions).

  *   **Szasz:** Mental illness is a myth because it lacks biological essence.
  *   **Hacking:** Mental illness categories are real because they have interactive effects, even if they lack biological essence.

  Hacking actually criticized the "myth" narrative because it dismisses the very real ways in which classifications shape human suffering and identity. To say C-PTSD is a "myth" is to tell your cousin their medical framework is a lie. To say C-PTSD involves "looping effects" is to acknowledge that their diagnosis is part of a dynamic historical process that validates their experience while remaining open to change.

  You can accept Hacking's looping effects without accepting Szasz's abolitionism. In fact, Hacking's view suggests we should be *more* careful with diagnoses, not because they are fake, but because they are powerful enough to change the people they describe.
