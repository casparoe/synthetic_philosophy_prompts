prompt: |-
  So I somehow ended up on the little committee that decides what our union's dental plan covers (definitely not a dentist, they just needed a warm body off the floor), and right now we're fighting about wisdom teeth before the new plan year locks in next month. Currently the plan automatically pays to pull everybody's wisdom teeth in their twenties, because our consulting dentist says they're basically leftover teeth from back when human jaws were bigger and we don't need them anymore. But my cousin's came in perfectly straight and she's been chewing on hers fine for fifteen years, and it feels off to yank out a tooth thats actually doing its job just because its "evolutionarily pointless" - those feel like two different questions to me and I can't quite explain why. Can you draft the memo I need to bring to the committee? It has to actually recommend something (keep automatic removal, switch to case-by-case review, or some other option), and it needs to take our dentist's reasoning seriously instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Union committee member (non-dentist, layperson representative).
      *   **Audience:** Union committee members, likely including the consulting dentist and union leadership.
      *   **Topic:** Wisdom teeth coverage policy (automatic removal in 20s vs. case-by-case).
      *   **Conflict:** Current policy is automatic removal based on evolutionary theory (vestigial organs). User's counter-example: Cousin has healthy, functional wisdom teeth.
      *   **Goal:** Draft a memo recommending a policy change (or refinement) that takes the dentist's reasoning seriously but addresses the ethical/financial/practical concerns of unnecessary surgery.
      *   **Constraint:** Must make a specific recommendation (Keep, Change, or Other).
      *   **Tone:** Professional, persuasive, balanced, respectful of expertise but firm on member welfare/fiscal responsibility.

  2.  **Deconstruct the Arguments:**
      *   **Dentist's Argument (Status Quo):** Wisdom teeth are vestigial. Jaws are smaller now. High risk of impaction/infection later. Prophylactic removal in 20s is easier/cheaper than emergency removal in 40s.
      *   **User's Argument (Challenge):** Evolutionary "pointlessness" $\neq$ Clinical "harmfulness." If a tooth is functional and healthy, removing it is invasive surgery with risks (nerve damage, infection, cost, recovery time). One size fits all is wasteful/harmful.
      *   **Union Perspective:** Cost control (premiums vs. payouts), member satisfaction, health outcomes, minimizing lost work time (recovery).

  3.  **Determine the Recommendation:**
      *   *Option A (Keep Automatic):* Ignores the user's valid point about functional teeth. Risks unnecessary surgery.
      *   *Option B (No Coverage):* Too extreme, ignores the real risk of impaction.
      *   *Option C (Case-by-Case/Criteria-Based):* The sweet spot. Acknowledges the dentist's risk assessment but requires evidence of pathology or high risk before authorizing surgery. This aligns with modern dental guidelines (AAOMS, etc., actually support removal *if* there is disease or high risk, not universally).
      *   *Decision:* Recommend shifting from "Automatic Removal" to "Medically Necessary Removal based on Diagnostic Criteria."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the deadline.
      *   **Current Policy & Rationale:** Summarize the dentist's view respectfully. Use terms like "prophylactic," "vestigial," "impaction risk." This shows I listened.
      *   **The Concern:** Introduce the counter-argument without attacking the dentist personally. Focus on "clinical necessity" vs. "evolutionary theory." Mention risks of surgery (nerve damage, cost, time off work).
      *   **Evidence/Standards:** Briefly mention that dental associations often recommend against *routine* removal without pathology. This backs up the user's intuition with external authority.
      *   **Recommendation:** Propose the "Case-by-Case" model with specific criteria (impaction, decay, cysts, orthodontic need).
      *   **Benefits:** Why is this better for the union? (Cost savings on unnecessary surgeries, better health outcomes, less lost work time).
      *   **Closing:** Call to action (vote/discuss).

  5.  **Refining the Tone:**
      *   *Avoid:* "The dentist is wrong."
      *   *Use:* "While the evolutionary context is valid, clinical application requires individual assessment."
      *   *Avoid:* "My cousin says..." (Too anecdotal for a formal memo).
      *   *Use:* "Clinical evidence suggests a subset of members retain functional third molars..." (Generalizes the anecdote into a principle).
      *   *Key Distinction:* Differentiate between *potential* risk and *actual* pathology.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "evolutionarily pointless" point?
