answer: |-
  **Setting:** *The hotel bar at the Society for Decision Theory annual conference. It's 11:30 PM. The ice in Elias's glass has mostly melted. Sarah is nursing a gin and tonic, looking tired but alert.*

  **Elias:** You presented on dynamic inconsistency today. I almost came in to ask the question, but I saw the slide deck. You're still running the McClennen defense?

  **Sarah:** Someone has to. The money pump argument is a threat, Elias, not a proof. It shows what happens if you *let* yourself be pumped, not that your preferences are inherently broken.

  **Elias:** If your preferences are cyclic, you *will* be pumped unless you bolt on a commitment device. That's the point. You're admitting the preferences are incoherent, then patching the leak with willpower. It's like saying a square circle is fine as long as you promise not to measure the corners.

  **Sarah:** It's not a patch, it's a different unit of analysis. You're assessing rationality synchronically—at a single node. I'm assessing it diachronically, across the plan. If I adopt a resolute strategy, I never actually make the choice that triggers the loss. The pump never turns.

  **Elias:** But at the moment of choice, say node *t2*, your local preference says trade. Your resolute choice says don't. So you're acting against your current preference. You've severed the link between preference and choice. If preference doesn't guide choice, what work is it doing? It's just decorative.

  **Sarah:** It's doing the work of inputting values into a deliberation that spans time. You're assuming the Separability Principle—that what I should do now depends only on the subtree ahead of me. I'm saying the rationality of the choice depends on how I got there. The plan constrains the node.

  **Elias:** That's just magical thinking. The past is sunk. You're at the bar, you have the drink, you want the money. If you prefer the money to the drink *now*, keeping the drink is irrational, regardless of what Past-Sarah wrote in her diary this morning. You're asking Future-Sarah to suffer for Past-Sarah's axioms.

  **Sarah:** And you're asking agents to be amnesiacs. If I can't bind my future self to a plan that my past self judged optimal, I'm not an agent, I'm a sequence of temporal slices. You're protecting the coherence of the slice at the expense of the coherence of the life.

  **Elias:** I'm protecting the definition of rationality. If you can violate transitivity and call it "resolute," you've emptied the word of meaning. You're basically saying it's rational to have inconsistent preferences so long as you're stubborn enough to ignore them when it counts.

  **Sarah:** I'm saying it's rational to recognize that preferences aren't static commands. They're evaluations. Sometimes the evaluation changes, but the commitment shouldn't. You always did confuse consistency with rigidity.

  **Elias:** *Laughs, sharp and dry.* There it is. The personal corollary. I was rigid? I was just trying to ensure our preferences aligned. You were the one who thought you could resolute-choice your way out of a compatibility problem. "Stick to the plan, Sarah, even if the data says the utility function has shifted."

  **Sarah:** The data said you were unhappy. The plan said we were building something. I chose the plan. You chose to maximize your immediate utility and called it "honesty."

  **Elias:** Because it *was* honest! If I preferred leaving to staying, staying would have been a lie. A money pump of emotions. You'd have paid cost after cost trying to arbitrage a relationship that was already in negative expected value.

  **Sarah:** Or maybe relationships aren't one-shot games with separable nodes. Maybe the rationality is in the refusal to trade down, even when the local incentive is there. That's not a bug, Elias. That's fidelity.

  **Elias:** Fidelity is a virtue, not a decision procedure. You can't derive an 'ought' from a vow if the vow contradicts your current valuation. That's not fidelity, that's sunk cost fallacy dressed up in normative clothing.

  **Sarah:** And you can't derive a life from a series of optimal snapshots. You get a pile of locally rational decisions and a globally incoherent mess. I'd rather be resolute than separable. I'd rather keep the drink I ordered than trade it back for the coins in your pocket.

  **Elias:** *Signals the bartender for the check.* The problem is, Sarah, at the end of the night, you still have the drink, and I have the money. And we're both walking home alone.

  **Sarah:** *Smiles, barely.* Then I guess we've both proven our theorems. Round two?

  **Elias:** *Pauses, hand on his wallet.* ...Sure. But I'm paying. I prefer it that way.

  **Sarah:** I know. That's why I let you.
