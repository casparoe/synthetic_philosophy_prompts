answer: |-
  Good evening. For those who don't know me, I've had the privilege of marching in the same troop lines as Marcus since sixth grade. We've shared a lot of tents, a lot of rainy hikes, and a lot of patrol meetings. But when Marcus's mom asked me to speak tonight, she didn't tell me to talk about knots or merit badges. She told me to talk about a binder.

  Specifically, the inside cover of Marcus's scout binder. For the last three years, taped right next to his rank card, has been a hand-drawn grid. Thirteen rows, seven columns. It was Marcus's attempt at Benjamin Franklin's project of moral perfection.

  Now, I know our Scoutmaster has read the *Autobiography*, so I have to be careful here. Franklin listed thirteen virtues—Temperance, Silence, Order, and so on. He tried to master one per week. And Franklin was brutally honest about the result: he never succeeded. He wrote that he could never get the better of his habit of procrastination, specifically regarding the virtue of "Order." He admitted he was always late, always disorganized, and ultimately, he failed his own test.

  Marcus, I think you'll agree, knows this feeling well. We have all loved Marcus for years, but we have also all waited for Marcus. That chart in the binder was a running, half-joking campaign against his own chronic lateness. It was his "Order."

  If this were a generic inspirational speech, I would tell you that Marcus fixed the chart. I would tell you that by the end, every box was checked, every virtue mastered, and that he arrived at Eagle Scout as a finished product of moral perfection.

  But that would be a lie. And it would betray the very lesson Franklin actually left us.

  Franklin concluded that a perfect life isn't possible. He realized that the pursuit of perfection is useful not because you achieve it, but because the *attempt* makes you better than you were before. He wrote, "I was, upon the whole, a happier and a better man than I should have been if I had never attempted it."

  That is what I am celebrating tonight. Not a clean sheet. But the courage to keep the chart.

  In a world that encourages us to curate our highlights and hide our faults, Marcus taped his faults to the inside of his binder. He looked at "Order" every week. He saw the checkmarks where he was late, and he saw the empty spots where he was on time. He didn't pretend the struggle didn't exist. He just kept showing up to fight it.

  That is what the Eagle rank actually signifies. It isn't a certificate of arrival. It is a recognition of direction. It says that this young man understands that character is not a static thing you possess, but a muscle you work. He knows he isn't perfect. He knows he might still be five minutes late to his own wedding someday. But he also knows that he is responsible for trying to be on time.

  Marcus, you haven't finished the project. Franklin didn't either. But you have proven you are willing to do the work. And for a friend who has stood in the line next to you for six years, watching you carry that chart, watching you own your flaws, and watching you grow not in spite of them but through them... that is worth more than a perfect score.

  Congratulations, Eagle Scout. The chart is full, but the work is just beginning.
