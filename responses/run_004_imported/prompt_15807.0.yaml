answer: |-
  You are in excellent company with this intuition. In fact, you have independently reconstructed the core of the famous **Rawls-Harsanyi debate**, which has been the battleground for social choice theorists and political philosophers since the early 1970s.

  To answer your specific question: **No, Rawls was not being "sloppy" with his decision theory.** He was fully aware of the Bayesian move (the Principle of Insufficient Reason) that Harsanyi championed. Rawls explicitly rejected it, not because he couldn't do the math, but because he rejected the *premises* required to make that math applicable to the Original Position.

  Since you are in poli econ, I'll skip the intro to the Veil of Ignorance (VoI) and cut straight to the decision-theoretic and meta-ethical friction points. The disagreement boils down to three main issues: the nature of the uncertainty, the stakes involved, and the purpose of the choice situation.

  ### 1. Risk vs. Radical Uncertainty (The Probability Argument)
  Harsanyi's derivation of Average Utilitarianism relies on the **Principle of Insufficient Reason** (Laplace's principle). If you have no information about which position you will occupy, you assign an equal probability ($1/N$) to each position and maximize expected utility.

  Rawls rejects this assignment of probabilities as arbitrary. He draws a Knightian distinction between **risk** (known probabilities) and **uncertainty** (unknown probabilities).
  *   **Harsanyi:** Treats the VoI as a situation of risk. Since there is no evidence to favor one position over another, symmetry dictates equal probabilities.
  *   **Rawls:** Treats the VoI as a situation of radical uncertainty. There is no objective basis for *any* probability assignment. To assign $1/N$ is to pretend we have knowledge (a distribution) that we explicitly do not have. In the absence of a basis for probabilities, Rawls argues it is rational to disregard them entirely, which opens the door for non-probabilistic decision rules like Maximin.

  ### 2. The Stakes and Risk Aversion (The Maximin Argument)
  In standard decision theory, Maximin is considered overly conservative and often irrational (e.g., refusing to cross a bridge because there is a 0.00001% chance it collapses, even if the payoff is high).

  However, Rawls argues that Maximin becomes rational under three specific conditions (which he argues obtain in the Original Position):
  1.  **Ignorance of Probabilities:** (As above).
  2.  **Conception of the Good:** The parties care little for what they might gain above the minimum guarantee.
  3.  **Unacceptable Alternatives:** The rejected alternatives involve outcomes that are intolerable.

  Rawls argues that the "positions" in the VoI aren't just income brackets; they represent **basic liberties, opportunities, and the social bases of self-respect**.
  *   If you choose Utilitarianism, there is a non-zero probability (however small) that you end up in a position where your basic liberties are sacrificed for the greater aggregate good (e.g., slavery, religious persecution).
  *   For Rawls, this outcome is **lexically prior** to economic gain. You cannot trade off basic liberty for expected income.
  *   Therefore, the risk aversion isn't a psychological quirk; it's a structural requirement of protecting the "fundamental interests" of moral persons.

  ### 3. The Device of Representation vs. A Gambling Scenario
  This is perhaps the deepest philosophical divergence.
  *   **Harsanyi** views the VoI as a genuine choice situation under uncertainty. If we were actually behind the veil, what would we choose? He thinks the answer is objectively Utilitarianism.
  *   **Rawls** (especially in later clarifications, but implied in *TJ*) views the VoI as a **device of representation**. It is a thought experiment designed to model fairness, not to simulate a literal gamble.

  The goal of the Original Position is not to find the outcome of a rational bet, but to model **pure procedural justice**. The constraints on the parties (including the rejection of probabilistic reasoning) are there to ensure that the resulting principles express **reciprocity** rather than **aggregation**.

  Rawls argues that Harsanyi's Utilitarianism fails to take seriously the **separateness of persons**. By summing utilities across persons (via the $1/N$ probability trick), Harsanyi treats society as a single super-individual maximizing its own utility over time. Rawls finds this meta-ethically unacceptable. The Maximin rule ensures that social cooperation is viewed as a fair system of cooperation over time, where everyone benefits (the Difference Principle), rather than a system where some are sacrificed for the net gain of others.

  ### 4. Strains of Commitment
  Rawls introduces a criterion that Harsanyi ignores: the **strains of commitment**.
  *   The parties must consider whether they can actually *live with* the principles they choose if they end up at the bottom.
  *   Rawls argues that a person born into the bottom quintile of a Utilitarian society (where their suffering is outweighed by the happiness of the majority) cannot reasonably accept that social contract. They would feel alienated from a society that views their rights as tradable.
  *   In a Difference Principle society, the worst-off know that any inequality exists *only* because it improves their position. This ensures stability and willing compliance.

  ### Summary of the Disagreement
  You aren't wrong that from a standard **Bayesian Rational Choice** perspective, Harsanyi wins. If you accept the axioms of expected utility theory and the Principle of Insufficient Reason, Rawls' Maximin looks like an error.

  However, Rawls is playing a different game. He is arguing that:
  1.  **Probabilities are unknowable** (rejecting Laplace).
  2.  **The stakes involve lexical priorities** (liberty > income), making standard EU maximization inappropriate.
  3.  **The goal is stability/reciprocity**, not just efficiency.

  ### Recommended Reading for Your Wheelhouse
  Since you are doing a PhD in Poli Econ, you might enjoy digging into the technical formalizations of this debate:
  *   **Harsanyi, J. C. (1975).** "Can the Maximin Principle Serve as a Basis for Morality? A Critique of John Rawls's Theory." *American Political Science Review*. (Harsanyi's direct attack on Rawls' decision theory).
  *   **Rawls, J. (1974).** "Reply to Lyons and Teitelman." (Where he clarifies the decision-theoretic constraints).
  *   **Sen, A. (1970).** *Collective Choice and Social Welfare*. (Sen bridges the gap, showing how informational constraints change the outcome).
  *   **Weymark, J. A. (1991).** "A Reconsideration of the Harsanyi-Rawls Debate." (A great social choice theoretic overview).
  *   **Moehler, M. (2018).** *Minimal Morality*. (Uses game theory to argue for a Rawlsian outcome without relying on thick moral assumptions).

  **Verdict:** Rawls wasn't sloppy; he was **deontological**. He rigged the decision theory (intentionally) to ensure the output respected the inviolability of the individual, whereas Harsanyi kept the decision theory "pure" and accepted the consequentialist output. Whether you think Rawls was *right* to rig it depends on whether you think the VoI is a tool for discovering rational self-interest (Harsanyi) or modeling fairness (Rawls).
