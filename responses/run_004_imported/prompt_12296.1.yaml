      *   *Is the distinction real?* Yes. This is a standard and crucial distinction in the longtermist/EA literature (e.g., Oesterheld, Conitzer, MacAskill).
      *   *ECL (Evidential Cooperation in Large Worlds):* Based on acausal decision theory (EDT/CDT+correlations). Key mechanism: My decision is *evidence* of what similar agents do. Key condition: Large world (many similar agents). Key motivation: Gain influence for my values by sacrificing some resources for others' values (acausal trade).
