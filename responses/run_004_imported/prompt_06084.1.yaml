answer: |-
  Based on Frank Ramsey's philosophical writings, his economic modeling, and his intellectual lineage within the Cambridge Apostles, it is highly probable that he would have sided unequivocally with **Nicholas Stern** on the discount rate, and that he would have been **sympathetic to the logical extension toward prioritizing existential risk**, provided the probabilities were rigorously defined.

  However, Ramsey's unique combination of Moorean ethics and pioneering work in probability theory suggests he would not have accepted the prioritization of existential risk blindly. He would have demanded a level of epistemic rigor regarding "existential threats" that might have tempered the more speculative elements of modern long-termism.

  Here is an analysis of where Ramsey would likely land, drawing on his ethical commitments and his relationships with G.E. Moore and J.M. Keynes.

  ### 1. The Stern-Nordhaus Dispute: A Clear Victory for Stern
  On the specific question of the pure rate of time preference, Ramsey's position is already explicitly stated in his 1928 paper, *A Mathematical Theory of Saving*. His famous dismissal of discounting future utility as "ethically indefensible" is not merely a throwaway line; it is the axiomatic foundation of his model.

  **The Moorean Influence:**
  Ramsey was a devoted follower of G.E. Moore's *Principia Ethica*. Moorean ethics posits that "good" is an objective, non-natural property. For a utilitarian like Ramsey, the moral goal is to maximize the sum of these good states of affairs. Crucially, Moorean value is **time-neutral**. A unit of happiness or knowledge in 2100 possesses the same intrinsic value as a unit in 1928. To discount it simply because it occurs later is to introduce a bias that has no basis in the nature of "the good."

  **The Rejection of Market Rates (Nordhaus):**
  William Nordhaus's argument relies on observed market interest rates to determine the discount rate. To Ramsey, this would represent a category error. Market rates reflect current scarcity, liquidity preferences, and, crucially, the very "weakness of imagination" Ramsey criticized. Using market rates to determine intergenerational ethics would be, for Ramsey, deriving an *ought* from an *is*—allowing current myopia to dictate moral obligation. He would view Nordhaus's approach as descriptive economics mistakenly applied to normative ethics.

  **The Keynesian Tension:**
  It is worth noting that Ramsey's commitment to the future was actually *stronger* than that of his mentor, J.M. Keynes. In *The Economic Consequences of the Peace* and other works, Keynes was often focused on stabilizing the immediate post-war order (famously noting, "In the long run we are all dead"). Ramsey's 1928 model implied savings rates that Keynes considered implausibly high. Ramsey was willing to impose significant costs on the present generation to ensure the future reached a "bliss" state of utility. This suggests Ramsey was already more "Stern-like" than Stern himself, as Stern's policy recommendations were often moderated by political feasibility in ways Ramsey's pure math was not.

  ### 2. Would He Push Further Toward Existential Risk Prioritization?
  The modern argument for prioritizing existential risk (such as from advanced AI) rests on a specific mathematical implication of Ramsey's framework: **If the discount rate is zero and the future is potentially infinite, the expected value of the future dominates all present concerns.**

  **The Logic of the Infinite Horizon:**
  Ramsey's model integrates utility over an infinite time horizon. If there is a non-zero probability that humanity goes extinct, the loss is not just the current generation, but the sum of all potential future utility. In Ramsey's calculus, preventing extinction becomes the dominant variable. Therefore, on purely structural grounds, Ramsey's ethics align closely with modern "long-termism" (the view that positively influencing the long-term future is a key moral priority).

  He would likely agree that the "chance that there might be no one around" (which he allowed as a valid reason for discounting) is the single most important variable in the equation. If an activity today increases that probability (e.g., unaligned AI or runaway climate change), it is ethically catastrophic, regardless of the immediate economic benefits.

  **Where Ramsey Might Resist (The Epistemic Caveat):**
  However, Ramsey would not have accepted the prioritization of existential risk without rigorous scrutiny. This is where his work on **probability and truth** (*Truth and Probability*, 1926) becomes critical.

  Ramsey was a founder of the subjective theory of probability (Bayesianism). He argued that degrees of belief must be coherent and actionable. He would likely resist the extension toward existential risk prioritization if the probabilities involved were speculative or incoherent.
  *   **Speculation vs. Calculation:** While Stern's climate models are based on physical data, some arguments regarding AI existential risk rely on speculative chains of logic. Ramsey, the logician, would demand that the probability of extinction be derived from coherent bets, not vague fears. If the probability of AI doom cannot be quantified with reasonable coherence, Ramsey might argue we cannot plug it into the utility integral.
  *   **Marginal Utility of Consumption:** Ramsey's model also accounts for the diminishing marginal utility of consumption. He would recognize that a dollar today for a person in extreme poverty generates more utility than a dollar for a person in a wealthy future. He might resist *ignoring* near-term suffering entirely. His logic would likely be: *Prevent extinction first, but do not impoverish the present to the point where current utility collapses, unless the extinction risk is imminent and certain.*

  ### 3. The "Ideal" Utilitarian Constraint
  Finally, Ramsey's tie to Moore suggests a nuance that modern economic discussions sometimes miss. Moore was an "Ideal Utilitarian," believing that certain states (friendship, aesthetic appreciation, knowledge) were good in themselves, not just pleasure.

  Ramsey might resist a version of existential risk prioritization that focuses solely on the *number* of future lives (total utilitarianism) without regard for their *quality*. If mitigating an existential risk required creating a dystopian surveillance state to ensure safety, Ramsey (channeling Moore) might argue that the "good" being preserved is no longer worth preserving. He would care about the *value* of the future, not just its *duration*.

  ### Conclusion
  Frank Ramsey would have been a **stern Sternite**. He would have rejected Nordhaus's market-based discounting as ethically bankrupt, viewing it as a capitulation to human myopia.

  Regarding the extension to existential risk, Ramsey would likely have **supported the priority of preventing human extinction**, as his mathematical framework dictates that the loss of an infinite future outweighs finite present costs. However, he would have resisted **speculative** versions of this argument. He would have demanded that existential risks be treated with the same logical rigor as his probability theory, ensuring that the "probabilities" of doom were not merely expressions of anxiety but coherent degrees of belief.

  In short, Ramsey would likely be viewed today as a philosophical grandfather of the long-termist movement, but one who would constantly check its enthusiasm with the cold water of logical and probabilistic rigor. He would not resist the extension of his logic to the far future; he would insist that the math be done correctly.
