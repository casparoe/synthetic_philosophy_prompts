answer: |-
  You are absolutely getting the shape of it right. In fact, for someone who got the "101 version" in class, you have a surprisingly accurate map of the contemporary debate. The names you dropped (McGrath, Beebee, Sartorio) are the exact heavy hitters on this specific issue.

  The reason this is a genuine **dilemma** rather than a puzzle with a missing piece is that every solution forces you to sacrifice something fundamental about how we understand either **metaphysics** (what exists/how the world works) or **ethics** (how we assign blame).

  Here is the breakdown of why the "Too Many Causes" problem breaks the standard machinery, and why the fixes are controversial.

  ### 1. The Explosion Problem (Why Counterfactuals Fail)
  You nailed the core issue. The standard **Counterfactual Theory of Causation** (associated with David Lewis) says: *Event C causes Event E if, had C not occurred, E would not have occurred.*

  *   **Case:** Bystander doesn't jump ($C$) $\rightarrow$ Victim drowns ($E$).
  *   **Counterfactual:** If Bystander *had* jumped, Victim *wouldn't* have drowned.
  *   **Result:** Bystander's omission caused the death.

  **The Glitch:** As you noted, this logic applies to the Queen of England, a person on Mars, or a rock.
  *   If the Queen *had* jumped (and magically arrived in time), the victim wouldn't have drowned.
  *   Therefore, the Queen's omission is also a cause.

  If we accept this, causation becomes **ubiquitous**. Every death is caused by the non-actions of billions of people. This renders the concept of "cause" useless for explanation. If everything is a cause, nothing is *the* cause.

  ### 2. Horn One: The Eliminativists (Helen Beebee)
  **The Move:** Bite the bullet. Say omissions are **not** causes.
  **The Metaphysics:** Beebee argues that causation requires a physical connection or a "process" (like energy transfer). "Nothing" cannot transfer energy. An absence is not an event; it is the *lack* of an event. Therefore, the bystander did not *cause* the death. The water caused the death; the bystander merely *allowed* it to happen.

  **The Cost:** This creates a massive rift between **Causation** and **Responsibility**.
  *   In law and ethics, we usually think: *You are responsible for the harm you caused.*
  *   If Beebee is right, the bystander is responsible for the death *without having caused it*.
  *   **Why this is hard:** It requires rewriting our moral vocabulary. We have to say, "You didn't kill her, but you are still just as guilty as if you did." While philosophically defensible, it clashes with almost all legal and common-sense frameworks.

  ### 3. Horn Two: The Inclusionists (Sartorio & Others)
  **The Move:** Keep omissions as causes, but fix the theory so the Queen isn't included.
  **The Metaphysics:** Carolina Sartorio and others argue that causation by absence is real, but the causal relation is **extrinsic**. This means whether $C$ causes $E$ depends on facts *outside* the immediate sequence of events.

  **The Patch:** They try to add constraints to the counterfactual theory. For example, a cause must be part of the "actual sequence" or the agent must have had the **capacity** to act.
  *   **Bystander:** Had capacity, was nearby. $\rightarrow$ Cause.
  *   **Queen:** Lacked capacity (too far away). $\rightarrow$ Not a Cause.

  **The "Smuggling" Problem:** This is where your question about moral assumptions hits home.
  To distinguish the Bystander from the Queen metaphysically, you have to point to a physical difference (distance, capacity). But consider a **Paralyzed Bystander**.
  *   If the bystander was paralyzed, they lacked the *capacity* to save the victim.
  *   Under a capacity-based patch, the paralyzed bystander is now metaphysically identical to the Queen. Neither caused the death.
  *   **But intuitively:** We still feel the paralyzed bystander is different from the Queen. Maybe they could have called 911?

  If you refine the theory to say, "The cause is the person who *should* have acted," you have successfully solved the "Too Many Causes" problem, but you have **smuggled normativity into metaphysics.**
  *   **Metaphysics** is supposed to be descriptive (what *is*).
  *   **Ethics** is normative (what *ought* to be).
  *   If the only reason the Bystander is a "cause" and the Queen is not is because the Bystander had a *duty* to act, then causation is no longer a physical fact about the world; it is a moral judgment disguised as physics.

  ### 4. Sarah McGrath's Contribution (The Dilemma Framing)
  Sarah McGrath's work is crucial here because she argues that our **intuitions** about omission causation are actually driven by our **normative expectations**.

  She suggests that when we say "The bystander caused the death," we aren't making a pure metaphysical claim. We are making a claim that is already loaded with moral expectation.
  *   **The Dilemma:**
      1.  If we insist causation must be purely physical/descriptive (no smuggling), we must accept the Queen is a cause (Absurdity) OR that the Bystander isn't a cause (Beebee's view).
      2.  If we insist the Bystander is the cause (to match our moral intuitions), we must admit that "causation" is partially determined by moral norms.

  McGrath argues that many philosophers try to hide this by creating complex metaphysical patches (like Sartorio) that *look* descriptive but are secretly relying on normative distinctions to do the work.

  ### 5. Why There Is No Simple Fix
  You asked what specifically breaks when people try to patch it. Here is the technical breakdown:

  1.  **If you use "Proximity" (Space/Time):** You run into the **Continuous Sorites**. Is someone 100 yards away a cause? 101 yards? At what exact inch does causation turn off? Metaphysics usually hates vague boundaries.
  2.  **If you use "Capacity":** You run into the **Paralyzed Bystander** problem. Does a lack of physical ability remove causal status? If so, causation depends on ability, not just outcome.
  3.  **If you use "Expectation/Normality":** You make causation **interest-relative**. This means causation isn't a fact about the universe; it's a fact about what *we care about*. Many realists hate this because it makes science subjective.

  ### Summary for Ethics Bowl
  You are right to treat this as a dilemma.
  *   **Team Beebee:** "Causation is physical. Omissions aren't physical. Therefore, no causation. Responsibility must be grounded in *duty*, not *causation*."
  *   **Team Sartorio/Inclusionists:** "Causation tracks responsibility. Omissions are causes. We must refine metaphysics to exclude the Queen, even if it makes causation extrinsic."
  *   **Team McGrath:** "Stop pretending this is just metaphysics. Our judgment of 'cause' here is already a moral judgment. Don't try to hide the normativity."

  **The Trap to Avoid:**
  Don't let your opponents say, "Obviously the bystander caused it, it's common sense."
  **Your Counter:** "Common sense works for pushing someone in the water. It breaks for *not* jumping in. If you say 'not jumping' is a cause, you must explain why the Queen's 'not jumping' isn't. If your only answer is 'The Queen wasn't supposed to jump,' you've admitted that **causation depends on moral duty**, which means you can't use causation to *prove* the moral duty without arguing in a circle."

  You've got the right instinct. This isn't a bug; it's a feature of the problem. Good luck with the Bowl.
