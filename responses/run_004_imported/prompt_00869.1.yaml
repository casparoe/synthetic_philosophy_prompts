answer: |-
  I completely understand the fatigue. The heart and the spandrels are the "Hello World" of philosophy of biology; they get the job done, but after the fifth year, they feel like you're reading from a script written in 1975.

  Here are two concrete, biologically plausible examples that avoid the classic tropes. One is molecular, one is physiological. Both create a sharp divergence between the Etiological (Selected Effects) and Causal-Role (Systemic) accounts without relying on vestigial organs or "useless noises."

  ### 1. The "Moonlighting" Enzyme (GAPDH)
  **The Trait:** The enzyme *Glyceraldehyde 3-phosphate dehydrogenase* (GAPDH).

  **The Biology:**
  GAPDH is a "housekeeping" enzyme found in almost all organisms. Its canonical job is to catalyze a specific step in glycolysis (breaking down glucose for energy). This is clearly what it was selected for over billions of years.
  However, biologists have discovered that GAPDH also "moonlights." In certain cellular contexts, it moves into the nucleus and acts as a transcription factor, regulating the expression of genes involved in DNA repair and cell death (apoptosis).

  **The Disagreement:**
  *   **Etiological (SE) Account:** The *proper function* of GAPDH is glycolysis. That is the effect for which it was historically selected. The transcription regulation is a "side effect" or a "spandrel" at the molecular level. Unless there is specific evidence that natural selection acted on GAPDH *specifically* to regulate transcription (distinct from its metabolic role), the SE theorist must say the transcription role is **not a function**. It is merely something the protein *does*.
  *   **Causal-Role (CR) Account:** The cell is a system with the capacity to survive and repair DNA. GAPDH contributes to this capacity by regulating transcription. Therefore, transcription regulation **is a function** of GAPDH. The CR theorist doesn't care about the history; they care that the trait currently contributes to the system's organizational capacity.

  **Why it works pedagogically:**
  It moves the debate from organs (hearts) to molecules, which feels fresher. It also highlights that CR theories allow for *multiple* functions (glycolysis AND transcription), whereas SE theories tend to be monistic about the "proper" function unless a new selection history is proven.

  ### 2. The Photic Sneeze Reflex (ACHOO Syndrome)
  **The Trait:** Sneezing when exposed to bright light (affecting ~18-35% of humans).

  **The Biology:**
  This is caused by neural crosstalk: the trigeminal nerve (which senses nasal irritation) and the optic nerve (which senses light) run close together. In some people, a sudden flood of visual signals "leaks" into the trigeminal pathway, triggering a sneeze.
  Crucially, a sneeze *itself* is a useful mechanism: it clears irritants from the nasal passage.

  **The Disagreement:**
  *   **Etiological (SE) Account:** The sneeze reflex was selected for clearing nasal irritants (dust, pathogens). The *light trigger* is a wiring error (a mutation or developmental accident) that was not selected for. Therefore, the light-sneeze is a **malfunction**. It has no proper function because the specific causal pathway (light $\rightarrow$ sneeze) has no evolutionary history of selection.
  *   **Causal-Role (CR) Account:** When the person sneezes at the sun, what happens? The nasal passage is cleared. The trait (the light-sneeze reflex) contributes to the capacity of the respiratory system to maintain hygiene. Therefore, it **has a function**. The fact that the trigger is "accidental" doesn't matter; the contribution to the system's capacity is real and beneficial.

  **Why it works pedagogically:**
  This is better than the "heart making noise" example because the noise of the heart is useless. The photic sneeze *does something useful* (clears the nose), it just does it for the wrong reason.
  *   **SE:** "It's a bug, not a feature." (History matters)
  *   **CR:** "It's a feature, because it works." (Current utility matters)

  ### How to deploy these in class
  1.  **Start with GAPDH** to show that this isn't just about "broken" traits (like the sneeze), but even about successful, complex molecular interactions. It shows CR is more *permissive* about what counts as a function.
  2.  **Move to the Photic Sneeze** to show the "Accidental Utility" problem. Ask your students: *"If I sneeze at the sun and it clears my nose, did my body do something functional?"*
      *   The SE student says: "No, your nervous system glitched."
      *   The CR student says: "Yes, your respiratory system was maintained."

  These examples avoid the "vestigial" trap (appendix/tailbone) where the trait is usually useless now. In both examples above, the trait *does* something useful currently, which forces the disagreement to be purely about the definition of function (History vs. Current Contribution), rather than an empirical dispute about whether the trait is useful.
