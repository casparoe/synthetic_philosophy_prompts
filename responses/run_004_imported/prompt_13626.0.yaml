      *   *Critique:* Okasha is a deflationist/pluralist, but Sober/Wilson are realists. Make sure I don't conflate Okasha's view with the "strongest deflationary case." Okasha actually argues for pluralism (both are valid), whereas the user wants the argument for "no fact of the matter." I need to push past Okasha's pluralism to eliminativism/deflationism.

  6.  **Final Polish:** Check terminology (Price Equation, Contextual Analysis, Supervenience). Ensure the distinction between *supervenience* (group traits depend on individuals) and *reduction* (group selection is just individual selection) is clear. The argument is that because group traits supervene on individual traits, and fitness is assigned to individuals, the "group level" is a heuristic, not a causal engine.

  7.  **Final Output Structure:**
      *   Introduction: Validate the user's intuition.
      *   Section 1: The Argument from Formal Equivalence (The Physics Parallel).
      *   Section 2: Dismantling the Averaging Fallacy (Causality vs. Description).
      *   Section 3: The Contextual Analysis Defense (Kerr & Godfrey-Smith).
      *   Section 4: The Arbitrariness of Group Boundaries.
      *   Conclusion: The Verdict.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't just say "Sober is wrong." I need to explain *why* their definition of causality is the weak link. Their definition relies on counterfactuals that are equally satisfiable by the individualist model. I will emphasize that the "averaging fallacy" assumes that causal power is additive, whereas in structured populations, it's interactive. If it's interactive, the partition is arbitrary.

