answer: |-
  Here is a joke drafted specifically for a mereology lecture. It relies on the specific ontological commitments of each position, so it should land well with students who have done the reading.

  ***

  A Universalist, a Nihilist, and Peter Van Inwagen walk into a furniture store.

  The Universalist immediately points to a display and says, "I'll take that table, that trout-turkey I have in my trunk, and the scattered object composed of both."

  The Nihilist sighs and says, "You're wasting your money. There is no table. There are only particles arranged tablewise."

  They both turn to Van Inwagen. "What about you, Peter? What exists in this room?"

  Van Inwagen squints at the wooden table leg, smiles, and says, "Well, the table doesn't exist. And the trout-turkey certainly doesn't. But I am filing the paperwork to adopt the termites."

  "The termites?"

  "Yes," he says. "Because their activity constitutes a life."
