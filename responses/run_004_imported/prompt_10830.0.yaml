answer: |-
  You are absolutely not overreading this. In fact, you have put your finger on the single most debated fault line in *On Certainty* scholarship. If you walk into that seminar and frame this tension explicitly, you won't embarrass yourself; you'll likely steer the discussion to the most productive place it can go.

  The tension you're sensing is the difference between a **logical/functional description** of hinges (341) and an **anthropological/pragmatic grounding** of them (358–359).

  Here is how to unpack this for your students, the scholarly landscape surrounding it, and which reading I think holds the most water.

  ### 1. The Textual Tension: Grammar vs. Bedrock

  **In 341**, Wittgenstein is still speaking the language of the epistemologist he is trying to dismantle. He uses the word "propositions" (*Sätze*) because hinges *look* like empirical propositions grammatically ("I have two hands," "The world exists"). At this stage, he is describing their **role**: they are the unmoved movers that allow the language-game of doubting and justifying to function. If you treat them as standard propositions here, you get the "Propositional Reading": hinges are beliefs we hold with maximal certainty.

  **In 358–359**, he realizes that calling them "propositions" is misleading because it suggests they belong to the same category as the things they support. By shifting to "form of life" and "something animal," he is moving from logic to **praxis**. He is saying: *This isn't a mental state of conviction; it's a way of behaving.* When he says it lies "beyond being justified or unjustified," he means it is the riverbed through which the water of justification flows, not a stone in the water.

  **The Resolution:** The tension is intentional. Wittgenstein is showing us that while hinges *wear the clothes* of propositions (341), they *do the work* of instincts or rules (358–9). He calls 358 "badly expressed" not because the thought is wrong, but because language forces him to use propositional syntax to describe something that precedes syntax.

  ### 2. The Scholarly Fault Line

  You asked if people have to pick a side. Yes, they do. Broadly, there are two camps:

  **A. The Propositional/Epistemic Reading (e.g., Crispin Wright, Michael Williams)**
  *   **View:** Hinges are propositions that warrant a special epistemic status (e.g., "entitlement" or "contextual validity"). They are still part of the space of reasons, just at the boundary.
  *   **Pros:** Keeps epistemology intact. We can still talk about knowledge and justification, we just need to tweak the rules.
  *   **Cons:** Risks turning Wittgenstein into a foundationalist, which he explicitly argues against elsewhere. It struggles to account for the "animal" remark.

  **B. The Non-Propositional/Enactivist Reading (e.g., Danielle Moyal-Sharrock, Avrum Stroll)**
  *   **View:** Hinges are not propositions at all. They are "hinge commitments" or ways of acting. They are *knowing-how*, not *knowing-that*. They are grammatical rules disguised as empirical claims.
  *   **Pros:** Fits perfectly with 358–9 and the later *Philosophical Investigations*. It explains why trying to justify a hinge is nonsense (you don't justify a reflex).
  *   **Cons:** Makes it hard to explain why Wittgenstein keeps calling them "propositions" in the text.

  ### 3. Which Reading is More Defensible?

  If you want to take the more radical, textually robust Wittgensteinian line, **the Non-Propositional (Enactivist) reading is stronger.**

  Here is why:
  1.  **Consistency with PI:** Wittgenstein's entire later philosophy moves away from mental states and toward public practice. Reading hinges as "animal" certainties aligns with "meaning as use."
  2.  **The "Beyond Justification" Claim:** If hinges were propositions, they would, in principle, be truth-apt. If they are truth-apt, they can be false. If they can be false, they can be doubted. But Wittgenstein insists doubting them destroys the language game itself. Therefore, they function more like rules of grammar than empirical claims.
  3.  **The "Animal" Remark:** This is the clincher. A proposition is not animal. A reflex is. When I reach for a door handle, I don't affirm the proposition "doors open." I act. That action is the hinge.

  **However,** the most nuanced position (and perhaps the best for a seminar) is that Wittgenstein is **dissolving the distinction**. He isn't saying "They are propositions" (Side A) or "They are not propositions" (Side B). He is saying: *Look at how we use these sentences. In this context, they function as rules. In another, they might function as empirical claims.* The category "proposition" is being stretched until it breaks.

  ### 4. Seminar Strategy: How to Frame This Tomorrow

  Don't lecture the resolution. Use the tension to generate heat. Here is a proposed flow:

  1.  **Start with 341:** Ask the students, "If hinges are propositions, why can't we doubt them? Is it psychological or logical?"
  2.  **Introduce 358–9:** "Seventeen remarks later, W calls this 'animal' and 'beyond justification.' Does this contradict 341?"
  3.  **The Pivot Question:** "Is Wittgenstein offering us a new *theory* of knowledge (where hinges are special propositions), or is he trying to show us that 'knowledge' isn't the right word for this bedrock at all?"
  4.  **The "Badly Expressed" Comment:** Ask them why he critiques himself in 358. Is he apologizing for the philosophy, or apologizing for the limitations of language? (The latter is the winning ticket).

  **My advice:** Lean into the "Non-Propositional" reading as the more philosophically interesting one, but acknowledge that the text oscillates. Tell your students: *"Wittgenstein uses the word 'proposition' in 341 because that's the tool the skeptic hands him. By 359, he's broken the tool and is using his hands."*

  You're going to be fine. This is the exact kind of close textual friction that makes for a great seminar. Good luck.
