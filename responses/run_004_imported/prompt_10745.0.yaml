      *   *Textual Evidence:* *Kitāb al-Shifāʾ* (The Book of Healing) vs. *Kitāb al-Ishārāt wa-l-Tanbīhāt* (Remarks and Admonitions). The term *tanbīh* (admonition/reminder) is crucial for Thorne.
      *   *The "Third Man" / Circularity Objection:* If you already know you are immaterial to make the leap, the argument is circular. If you don't, does the leap hold?
