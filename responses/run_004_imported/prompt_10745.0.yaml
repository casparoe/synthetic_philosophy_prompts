          *   Thorne: Absence of evidence (body) isn't evidence of absence (immateriality). It just shows awareness is *independent* of sensation, not necessarily substance.
      *   **Round 2: Textual Context (*Tanbīh*):**
          *   Thorne: The title *Tanbīhāt* means "Remarks/Reminders." It assumes prior knowledge.
