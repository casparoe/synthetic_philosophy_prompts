prompt: |-
  I sit on the board of a small foundation that funds work in AI safety and biosecurity -- the kind of longtermist, x-risk-adjacent giving that grew out of the same effective altruism and rationalist online communities I've been reading for well over a decade. We're outgrowing our old process, in which a single program officer decided every grant, and the board has split into two camps over what should replace it.

  One camp wants to move straight to nine-person review panels in which each reviewer scores every proposal independently, with no discussion beforehand, and the majority recommendation is binding. They're explicitly invoking the Condorcet Jury Theorem: if each reviewer is even a little better than a coin flip at judging whether a given proposal will pay off, a large enough independent panel should converge on the right call with near certainty, and unweighted majority vote should suffice to get us there. The other camp, led by our one board member with formal training in social choice theory, thinks this borrows the theorem's conclusion while quietly dropping its premises. Our reviewer pool is drawn almost entirely from the same small rationalist- and EA-adjacent intellectual world, so their errors seem more likely to be correlated than independent; competence plausibly varies a great deal by sub-area (several of our strongest policy reviewers would have no real basis for judging a biosecurity hardware proposal, and might do worse than chance there rather than merely add noise); and it isn't obvious that unweighted majority vote among nine generalists beats a smaller panel of demonstrably better-calibrated reviewers whose votes are weighted accordingly. She wants to keep panels small -- three or five people -- with structured deliberation built in.

  I've been asked to write the one-to-two page memo the full board will vote on at next month's meeting, and I'd like your help drafting it. Please give me a concrete recommendation covering panel size, whether reviewers should vote independently or deliberate first, and whether votes should be weighted rather than counted equally, together with reasoning a skeptical board member could actually follow. I want the memo to engage seriously with the ways our situation might violate the theorem's assumptions rather than just citing its headline result, but I still want it to land on an actionable procedure -- including a pilot period and review date if that's the honest way to hedge our uncertainty -- rather than simply restating both camps' positions back to them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation board (AI safety, biosecurity, longtermist/x-risk, EA/rationalist adjacent).
      *   **Problem:** Outgrowing single program officer model. Board split on new process.
      *   **Camp 1 (Condorcet Camp):** 9-person panels, independent scoring, no discussion, majority vote binding. Relies on Condorcet Jury Theorem (CJT).
      *   **Camp 2 (Social Choice Camp):** Small panels (3-5), structured deliberation, weighted votes/expertise. Argues CJT assumptions (independence, competence > 0.5) are violated due to correlated errors and varying expertise.
      *   **Task:** Write a 1-2 page memo for the board vote.
      *   **Requirements:** Concrete recommendation (panel size, deliberation vs. independence, weighting), reasoning accessible to skeptics, engage with CJT assumptions, actionable procedure (pilot/review).
      *   **Tone:** Professional, analytical, decisive but humble, aligned with the community's intellectual style (EA/rationalist).

  2.  **Deconstruct the Arguments:**
      *   *Condorcet Jury Theorem (CJT):* States that if voters are independent and each has probability $p > 0.5$ of being correct, the probability of a correct majority decision approaches 1 as $n \to \infty$.
      *   *Camp 1's Flaw:* Assumes independence and uniform $p > 0.5$. In a tight-knit community (EA/rationalist), errors *are* correlated (shared biases, shared information sources). In specialized fields (biohardware vs. AI policy), $p$ might be $< 0.5$ for generalists.
      *   *Camp 2's Strength:* Recognizes correlation and heterogeneity of competence. Deliberation can reduce correlation by sharing unique information (though it risks groupthink). Weighting helps leverage high-$p$ voters.
      *   *Camp 2's Weakness:* Deliberation can be dominated by loud voices or status. Small $n$ means higher variance. Weighting is hard to calibrate objectively.

  3.  **Formulate a Recommendation:**
      *   *Panel Size:* 9 is too big for high-quality deliberation, but 3 might be too noisy. A middle ground or a tiered approach? Actually, for *specialized* grants, expertise matters more than numbers. Let's lean towards Camp 2's smaller panels but ensure diversity of expertise. Let's say 5 people.
      *   *Deliberation vs. Independence:* Pure independence ignores the benefit of information aggregation. Pure deliberation risks groupthink. *Hybrid:* Independent pre-scoring followed by structured deliberation focused on discrepancies, then final vote. This mitigates anchoring while allowing information sharing.
      *   *Weighting:* Hard to implement formally without causing status anxiety. Better to select panelists based on expertise for the specific grant type. "Expertise-weighted selection" rather than "vote-weighting."
      *   *Pilot:* Essential. We don't know the true $p$ or correlation coefficient.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **The Core Disagreement (CJT Analysis):** Acknowledge Camp 1's intuition but validate Camp 2's mathematical critique. Explain *why* independence fails (shared epistemic community) and *why* competence varies (specialization).
      *   **The Proposal (The "Hybrid" Model):**
          *   Panel Size: 5 (odd number, manageable).
          *   Process: Independent initial score -> Discussion of variance -> Final vote.
          *   Composition: Expertise-matched, not just generalists.
      *   **Implementation/Pilot:** 12-month pilot, review metrics (inter-rater reliability, grantee outcomes).
      *   **Conclusion:** Call to action.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is 5 people enough?
      *   *Fix:* Emphasize that 5 *experts* beat 9 *generalists* if the generalists are correlated.
      *   *Critique:* How to handle weighting without being rude?
      *   *Fix:* Don't weight votes mathematically. Weight the *selection* of the panel. If it's a bio grant, 3 of the 5 should be bio experts.
      *   *Tone Check:* Ensure it doesn't sound like I'm dismissing the CJT entirely. It's a useful baseline, just not applicable here in its raw form. Use terms like "epistemic correlation" and "competence heterogeneity."
      *   *Length:* Keep it tight. 1-2 pages.

  6.  **Final Polish:**
      *   Make sure the "Social Choice" board member feels heard (validation of assumptions).
      *   Make sure the "Condorcet" board member feels heard (validation of the goal: truth-tracking).
      *   Ensure the procedure is concrete (e.g., "two-round voting").

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (5-person, hybrid vote, expertise-based selection).
      *   Reasoning for skeptics? Yes (CJT assumption breakdown).
      *   Actionable/Pilot? Yes (1-year pilot).
      *   Tone? Appropriate for EA/rationalist board.

  *(Self-Correction on Weighting)*: I initially thought about suggesting weighted votes. But in practice, explicit vote weighting is politically difficult in volunteer boards. It's better to weight the *panel composition*. I will recommend expertise-based panel selection instead of mathematical vote weighting, as it achieves the same goal (increasing average $p$) without the friction.

  *(Self-Correction on Deliberation)*: Pure deliberation can lead to conformity. Pure independence leads to correlated errors. The "Delphi method" style (independent, then share, then independent again) is the gold standard here. I will recommend that.

  8.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Grant Review Process Reform

  **Executive Summary**
  We must replace our single-officer grant model with a process that balances epistemic rigor with operational feasibility. After reviewing the competing proposals, I recommend we adopt a **five-person hybrid panel** model. Reviewers will submit independent initial scores, engage in structured deliberation focused on score variance, and then cast final independent votes. Panel composition will be weighted toward domain expertise rather than weighting individual votes. I propose we adopt this as a **12-month pilot**, with a mandatory review scheduled for Q4 2024.

  **The Condorcet Jury Theorem: Applicability and Limits**
  The proposal for nine-person independent panels relies on the Condorcet Jury Theorem (CJT). The CJT proves that if voters are independent and individually competent (probability of correctness $p > 0.5$), majority rule converges on the correct decision as panel size increases.

  However, as noted by members with social choice expertise, our context likely violates CJT's two critical premises:

  1.  **Independence:** Our reviewer pool is drawn from a tight-knit intellectual community. We share information sources, theoretical frameworks, and biases. When errors are correlated (e.g., a shared over-optimism about a specific AI alignment approach), adding more voters does not cancel out noise; it amplifies systemic bias. A panel of nine correlated voters may be less reliable than a smaller, more diverse group.
  2.  **Uniform Competence:** CJT assumes $p > 0.5$ for all voters. In practice, competence is heterogeneous. A reviewer highly competent in AI governance may have $p < 0.5$ on biosecurity hardware (worse than chance due to overconfidence). Unweighted majority voting dilutes the signal of true experts with the noise of generalists.

  Therefore, simply scaling the panel size to nine without addressing correlation or expertise will not guarantee the "near certainty" the CJT promises.

  **Recommendation: The Hybrid Expert Panel**
  To maximize truth-tracking while mitigating groupthink and correlation, I propose the following procedure:

  **1. Panel Size and Composition (N=5)**
  We should convene five-person panels. This is large enough to avoid individual idiosyncrasies but small enough to facilitate high-bandwidth discussion. Crucially, panel composition must be **domain-matched**. For a biosecurity grant, at least three reviewers must have technical biosecurity expertise. This ensures the average competence ($p$) remains high, addressing the heterogeneity problem without the friction of mathematically weighting votes.

  **2. Process: Independent-Deliberate-Independent**
  We should reject the binary choice between "pure independence" and "pure deliberation."
  *   **Step 1 (Independent):** Reviewers submit initial scores and brief rationales independently. This preserves the statistical benefit of independent sampling and prevents anchoring.
  *   **Step 2 (Structured Deliberation):** The panel meets to discuss *disagreements*. If scores range from 1 to 5, the discussion focuses on why the 1 and the 5 differ. This allows reviewers to share private information, reducing correlated errors caused by information asymmetry.
  *   **Step 3 (Final Vote):** Reviewers submit a final independent vote. This prevents social pressure from dictating the outcome while allowing the deliberation to update their priors.

  **3. Voting Rule**
  Final decisions will be made by simple majority. Given the domain-matching of panelists, we can assume $p > 0.5$ for the majority of the panel, making majority rule robust without needing complex weighting schemes.

  **Implementation Plan and Pilot**
  Process design is an empirical question. We cannot know our true error correlation or competence levels without data.
  *   **Pilot Period:** Implement this process for all grants awarded in the next 12 months.
  *   **Metrics:** We will track inter-rater reliability (before and after deliberation) and conduct retrospective reviews of granted projects at 12 and 24 months.
  *   **Review Date:** At the Q4 2024 board meeting, we will vote to continue, modify, or abandon the hybrid model based on these metrics.

  **Conclusion**
  The goal of the Condorcet camp—robust, democratic truth-tracking—is correct, but the mechanism proposed ignores the sociological reality of our ecosystem. The goal of the social choice camp—accounting for bias and expertise—is also correct, but small panels without independent input risk groupthink. This hybrid recommendation synthesizes both insights: it leverages expertise to raise competence, uses initial independence to measure correlation, and uses deliberation to resolve it.

  I move that we adopt this hybrid pilot procedure effective immediately.
