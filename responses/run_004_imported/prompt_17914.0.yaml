  5.  **Drafting the Explanation - Step-by-Step:**

      *   **Validation:** Acknowledge this is a common sticking point. It *does* feel like wordplay until the modal metaphysics clicks.
      *   **The Core Mechanism:** "Can" = Compossibility.
      *   **The Equivocation:** Show explicitly that "Tim can" and "Tim can't" are not $P$ and $\neg P$. They are $C(F_1, P)$ and $C(F_2, \neg P)$.
      *   **The Roommate's Pushback:** Address the "Gun/Skill/Will" point directly. Those are the *narrow* facts. Lewis agrees Tim *can* relative to those. The roommate is ignoring the *broad* facts (GF's death).
      *   **Why it's not Stipulation:** This is the hard part. Why is Lewis allowed to include GF's death in the relevant facts?
          *   Because GF's death is a *hard fact* about the world. It's not a law of nature preventing it; it's a brute fact.
          *   Analogy: You can't change the past. GF's death is in the past (external time).
      *   **The "Why" (Intuition):** The feeling of paradox comes from thinking abilities transcend facts. Lewis says abilities are always constrained by facts. Time travel just makes the constraining facts weirdly distributed in time.
      *   **Toy Example:** Let's use the "Prophecy" or "Fixed Outcome" example. It isolates the modality from the causation.
