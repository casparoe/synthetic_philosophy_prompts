      *   **The Problem:** The roommate's objection ("If he has the gun, skill, and will, why *couldn't* he?") hits a nerve. The standard "he just can't" response feels like stipulation/magic.
      *   **The Goal:** Explain the *mechanics* of Lewis's move on "can." Specifically, why it's not a contradiction to say Tim both can and cannot kill Grandfather. Focus on the context-sensitivity of "can" (which facts are held fixed). Use a toy example if helpful. Avoid mere jargon recitation.
      *   **Tone:** Professional but accessible (peer-to-peer), acknowledging the depth of the confusion without being condescending.

  2.  **Deconstruct Lewis's Argument:**
      *   **Core Claim:** "Can" is context-sensitive (equivocal). It means "compossible with [set of facts X]."
      *   **The Contradiction:** It *seems* like a contradiction to say "Tim can kill GF" AND "Tim cannot kill GF."
      *   **Lewis's Resolution:** It's not a contradiction because the sense of "can" shifts.
          *   Sense 1 (Narrow): Compossible with facts about Tim's gun, aim, intent, immediate surroundings. -> Tim *can* kill GF.
          *   Sense 2 (Broad): Compossible with facts about Tim's gun, aim, intent, immediate surroundings, *plus* the fact that GF died in 1993 of old age. -> Tim *cannot* kill GF.
      *   **The Crucial Move:** There is no single, absolute "Can." There is only "Can relative to facts F."
      *   **The Intuition:** We usually pick the relevant facts based on conversational context. In time travel cases, the context is tricky because future facts (GF's death) are fixed relative to the traveler's origin.

  3.  **Address the Roommate's Objection:**
      *   Roommate: "He has the gun, skill, will." (She is fixing the *local* facts).
      *   Lewis: "Yes, relative to *those* facts, he can."
      *   Roommate: "So why doesn't he?"
      *   Lewis: "Because there are *other* facts (GF's actual death) that are also true. Relative to *those* facts, he can't."
