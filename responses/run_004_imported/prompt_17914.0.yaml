      *   *Best Selection for Mechanics:* The "Safe Combination" or "Locked Room" analogy, but modified to include a *fact* that prevents success despite ability.
      *   *Actually, let's use Lewis's own strategy:* Compare it to standard compatibilism about free will, since the user mentioned it. But the user wants to understand *why* it's the right carve-up, not just that it's analogous.
      *   *Let's try a concrete scenario:* "The Unlucky Sniper."
          *   Sniper has skill, gun, clear shot.
          *   Fact: The target survives.
          *   Did the sniper *can* kill the target?
