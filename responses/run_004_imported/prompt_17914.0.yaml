answer: |-
  This is not a dumb question at all. In fact, hitting this wall is practically a rite of passage for anyone working through Lewis. You have the vocabulary down, but the *modal mechanics* feel like a shell game. Your roommate's objection is the exact right one: it exposes the intuition that "can" tracks *intrinsic capacity* (gun, skill, will), whereas Lewis is insisting "can" tracks *extrinsic compossibility* (consistency with the whole block universe).

  The reason it feels like stipulation is that we usually treat "can" as tracking **causal powers** (what the agent is capable of producing), while Lewis treats it as tracking **logical consistency with a selected set of facts**.

  Here is the walkthrough of the mechanics, why it isn't a contradiction, and how to answer your roommate without jargon.

  ### 1. The Semantics of "Can" (Compossibility)

  Lewis's core move is to deny that "can" is a binary, monadic property of an agent (i.e., `Can(Tim, Kill)`). Instead, he argues "can" is a relation between an event and a **set of fixed facts**.

  To say "Tim can kill Grandfather" is shorthand for:
  > "There is a possible world consistent with **Set of Facts A** in which Tim kills Grandfather."

  To say "Tim cannot kill Grandfather" is shorthand for:
  > "There is NO possible world consistent with **Set of Facts B** in which Tim kills Grandfather."

  If Set A $\neq$ Set B, there is no contradiction. $P$ can be compossible with $A$ and incompossible with $B$ without violating the Law of Non-Contradiction.

  **The Toy Example:**
  Imagine a master safecracker standing in front of a safe.
  *   **Set A (Local Facts):** She has her tools, she knows the combination, her hands aren't shaking, the lock isn't rusted.
      *   *Verdict:* Relative to Set A, she **can** open the safe.
  *   **Set B (Local + Global Facts):** She has her tools, she knows the combination... **and the safe is currently filled with solid concrete.**
      *   *Verdict:* Relative to Set B, she **cannot** open the safe.

  If you ask, "Can she open the safe?" and I answer "Yes," I am implicitly fixing Set A. If I answer "No," I am implicitly fixing Set B. Neither of us is lying. We are just selecting different parameters for the modal evaluation.

  ### 2. Why Time Travel Feels Different (The Stipulation Worry)

  In the safecracker case, it's obvious why we might switch sets. If you ask "Is she skilled enough?", we use Set A. If you ask "Will the safe open?", we use Set B.

  In the Time Travel case, the intuition bomb goes off because **both sets of facts seem equally 'real' and 'present' to Tim.**

  *   **The Roommate's Intuition:** She is focusing on Tim's *intrinsic causal powers*. At the moment of pulling the trigger, nothing *intrinsic* to Tim or the gun stops him. The causal chain from "finger squeeze" to "bullet flight" is unbroken. Therefore, he *can*.
  *   **Lewis's Counter:** Lewis agrees Tim has the intrinsic capacity. But "can" isn't just about intrinsic capacity; it's about **opportunity**. And opportunity is determined by the total state of the world.

  The reason it feels like stipulation is that you feel Lewis is cheating by smuggling the *outcome* (Grandfather's survival) into the *conditions* for the ability.

  **Why it's not cheating:**
  Lewis is a B-Theorist (Block Universe). For Lewis, the fact that "Grandfather died in 1993 of old age" is just as hard, fixed, and real as the fact that "The gun is loaded."
  *   The gun being loaded is a fact at $t_{1920}$.
  *   Grandfather dying in 1993 is a fact at $t_{1993}$.

  In a Block Universe, $t_{1993}$ facts are just as ontologically robust as $t_{1920}$ facts. When we evaluate what Tim "can" do at $t_{1920}$, we are asking what is compossible with the **entire block**, not just the time-slice at $t_{1920}$.

  If you hold fixed *only* the local slice (1920), sure, he can kill him. But that's a trivial sense of "can." It's the sense of "can" we use in counterfactuals where we ignore known outcomes. But in the actual world, the outcome *is* known (Grandfather lived). To say Tim "can" kill him in the all-things-considered sense is to say the actual world is inconsistent with itself.

  ### 3. Answering the Roommate (The "Why" Mechanism)

  Your roommate asked: *"Ok but why couldn't he, if he's got the gun and a clear shot and the will to do it?"*

  Here is how you translate Lewis's move into non-jargon terms for her:

  **You:** "You're right that he has the *skill* and the *gun*. In one sense of 'can,' he definitely can. If we look *only* at Tim and the gun, nothing stops him."

  **Roommate:** "So he does it?"

  **You:** "No, because 'can' also means 'is there a way for the world to be?' And the world *is* a certain way. Grandfather didn't die in 1920. He died in 1993. That is a fact, just like the fact that the gun is loaded."

  **Roommate:** "But that's in the future!"

  **You:** "In Tim's personal time, yes. But in the universe's time, it's already settled. Think of it like a movie reel. You are looking at the frame where Tim pulls the trigger. You're saying 'The projector has enough bulb power to show this frame.' That's true. But I'm looking at the *whole reel*. The reel already has a frame where Grandfather dies in 1993. If Tim kills him in 1920, the reel rips. The projector might work, but the movie can't play."

  **The Crucial Distinction:**
  You need to convince her that there are two questions being asked simultaneously:
  1.  **The Capacity Question:** Does Tim have the local physical machinery to kill GF? (Answer: Yes).
  2.  **The Compossibility Question:** Is a world where Tim kills GF consistent with the actual history of the universe? (Answer: No).

  Lewis's point is that when we ask "Can he time travel and kill his grandfather?", we are asking Question 2, not Question 1. The paradox arises because we think Question 1 settles Question 2. Lewis says it doesn't.

  ### 4. Why This Isn't Just Verbal Trickery

  The worry is that Lewis is just redefining "can" to save the phenomenon. Why is this the *right* carve-up?

  It works because it preserves the **principle of non-contradiction** without denying the **reality of the past**.

  If you insist Tim *really* can kill Grandfather (in the all-things-considered sense), you must admit one of two things:
  1.  **The Past Can Change:** Grandfather dies in 1920 in one branch, and 1993 in another. (Lewis rejects this; he thinks there is one timeline).
  2.  **Contradictions are Real:** Grandfather is both dead and alive. (Lewis rejects this).

  Lewis's move allows us to keep a single, consistent timeline while acknowledging that time travelers have local agency. The "cost" is accepting that "can" is context-sensitive. But Lewis argues "can" is *always* context-sensitive, even in normal life.

  **Normal Life Example:**
  "I can run a 4-minute mile."
  *   **Context 1 (Training):** True. (Fixed facts: My legs, heart, training regimen).
  *   **Context 2 (Reality):** False. (Fixed facts: My legs, heart, training regimen, **+ I am currently sitting in a chair**).

  We don't feel paradoxed in normal life because the "sitting in a chair" fact is obvious. In time travel, the constraining fact ("Grandfather died in 1993") is temporally distant from the action, so we forget to include it in the set of fixed facts. Lewis forces us to include it.

  ### 5. Summary for the Seminar

  If you need to articulate this in seminar, the key is to emphasize that Lewis is making a claim about **modal semantics**, not physics.

  1.  **Equivocation:** The paradox relies on an equivocation of "can."
  2.  **Fact-Relativity:** Ability claims are always relative to a set of fixed facts.
  3.  **The Block:** In a Block Universe, future facts (external time) are just as fixed as past facts.
  4.  **Resolution:** Tim *can* (relative to local facts) but *cannot* (relative to global facts). Since there is no contradiction in $P$ being compossible with $F_1$ and incompossible with $F_2$, the paradox dissolves.

  The reason it feels unsatisfying is that we want "can" to mean "has the causal power to initiate." Lewis is telling us that in metaphysics, "can" means "is consistent with the total state of affairs." Once you accept the Block Universe, Lewis's definition of "can" is the only one that doesn't explode into contradiction.

  **The "Aha" Moment:**
  The paradox isn't that Tim is prevented by a force field or a law of nature. He is prevented by **logic**. Not abstract logic, but the logic of concrete facts. Grandfather's survival is a fact. Tim's success is incompatible with that fact. Therefore, Tim's success is impossible. The gun doesn't jam; the universe doesn't conspire. The *proposition* "Tim kills Grandfather" is simply false in the actual world, just as "2+2=5" is false. Tim having a gun doesn't make "2+2=5" true, and it doesn't make "Tim kills Grandfather" true.
