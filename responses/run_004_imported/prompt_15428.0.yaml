          *   Examples.

      *   *Wait, I want to make sure I don't just ban "caused".* The Reporter wants to use it. If the study says "This specific record would not have occurred without warming," then "caused" is logically valid for the *record*, not the *heat*.
      *   Okay, I'll propose: **"Causality applies to the anomaly, not the phenomenon."**

