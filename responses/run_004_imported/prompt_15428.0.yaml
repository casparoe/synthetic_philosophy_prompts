prompt: |-
  I'm on my outlet's editorial standards committee, and we can't agree on how to word climate-attribution stories. The study on our desk concludes that a recent heat wave was made roughly five times more likely and about two degrees Celsius hotter by human-caused warming, using climate models that rerun the same event with and without the added greenhouse gases. Our climate reporter wants the headline to say plainly that 'climate change caused this heat wave,' since the event's specific intensity and duration were themselves products of the extra heat and moisture in the system. Two copy editors refuse to run 'caused' at all, since a cause is something without which the event wouldn't have happened -- and the study implies a heat wave could still have occurred without the extra warming, just a milder one. Draft the short memo I'll circulate to the committee: a wording rule for this and future attribution stories, concrete enough for the style guide, that takes both objections seriously rather than splitting the difference.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an outlet's editorial standards committee.
      *   **Task:** Draft a short memo to the committee proposing a wording rule for climate-attribution stories.
      *   **Context:** There's a disagreement on how to word a specific study (heat wave made 5x more likely, 2°C hotter by human-caused warming).
      *   **Conflict:**
          *   *Climate Reporter:* Wants "climate change caused this heat wave" (argues intensity/duration are products of extra heat/moisture).
          *   *Copy Editors:* Reject "caused" (argues cause implies necessity; event could still happen without warming, just milder).
      *   **Constraint:** The rule must be concrete enough for the style guide, take *both* objections seriously, and *not* simply split the difference (i.e., don't just say "sometimes use caused, sometimes don't"). It needs a principled synthesis.

  2.  **Deconstruct the Scientific & Linguistic Nuance:**
      *   *The Science:* Attribution science rarely deals in binary "cause/no cause" for specific weather events. Weather happens naturally. Climate change loads the dice (probability) and weights the cubes (intensity).
      *   *The Reporter's Point:* In common parlance, if I add poison to your drink and you die faster, I caused your death, even if you were going to die eventually. The *specific* event (this heat wave, as experienced) is qualitatively different because of the warming.
      *   *The Copy Editors' Point:* In strict logic/legalistic terms, "cause" implies *sine qua non* (without this, it wouldn't happen). Since a heat wave could occur naturally, "caused" is technically imprecise and opens the outlet to criticism from skeptics.
      *   *The Synthesis:* We need language that acknowledges the *modification* of the event without overstating the *origin* of the event, while still conveying the gravity of the human influence. The key is distinguishing between the *type* of event (heat wave) and the *specific characteristics* of *this* event (record-breaking intensity/duration).

  3.  **Brainstorming Wording Options:**
      *   *Option A (Reporter):* "Climate change caused this heat wave." (Too absolute for CE).
      *   *Option B (CE):* "Climate change influenced this heat wave." (Too weak, undermines the science).
      *   *Option C (Split):* "Climate change contributed to..." (Vague).
      *   *Option D (Synthesis):* Focus on "made possible," "drove," "fueled," or specific attribution of *severity*.
      *   *Best Approach:* Acknowledge that while the *phenomenon* isn't new, the *magnitude* is attributable. Use verbs that imply amplification rather than origination. However, the prompt asks to take the Reporter's point seriously too. The Reporter argues the *event as experienced* is a product of warming. So, we can say climate change caused the *record-breaking nature* or the *severity*, even if not the baseline weather pattern.

      *   *Refining the Rule:* Instead of banning "caused," define *what* was caused.
      *   *Draft Idea:* "Use 'caused' only when referring to the added severity or likelihood, not the baseline event."
      *   *Better Idea:* "Attribute the *extremeness*, not the *existence*."
      *   *Best Idea (Style Guide Format):* Create a standard phrasing that captures the "loading the dice" analogy without being clunky.
      *   *Key Phrase:* "Human-caused warming made this heat wave significantly more likely and more severe."
      *   *Addressing "Caused":* Can we allow "caused" if qualified? "Climate change caused the *added intensity*..."
      *   *Decision:* The memo should propose a standard that avoids the binary trap. The rule should be: **Attribute the alteration, not the occurrence.**

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the debate. Validate both sides (Reporter's urgency/accuracy on impact; CE's precision on logic).
      *   **The Principle:** Explain the scientific consensus (probabilistic, not binary).
      *   **The Rule:** Concrete instruction for headlines and copy.
      *   **Rationale:** Why this solves the problem (satisfies CE's logic, satisfies Reporter's urgency).
      *   **Examples:** Show, don't just tell.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Needs to sound like a standards editor (precise, clear).
      *   Must avoid "splitting the difference" (e.g., "use 'contributed'"). It needs to be strong but accurate.
      *   *Self-Correction on "Splitting the Difference":* If I just say "don't use caused," I side with CE. If I say "use caused," I side with Reporter. I need a third path. The third path is: "Use 'caused' only when the object of the verb is the *severity* or *likelihood*, not the *event* itself." OR, "Avoid 'caused the heat wave'; use 'drove the severity'."
      *   *Wait, looking closer at the prompt:* "Takes both objections seriously rather than splitting the difference."
      *   *Reporter's Objection:* "Milder" heat waves aren't the same story. The *record-breaking* aspect is the story.
      *   *CE's Objection:* "Cause" implies necessity.
      *   *Solution:* We accept the Reporter's premise that *this specific event* (as defined by its impacts/thresholds) is a new creature, but we accept the CE's premise that we must be linguistically precise.
      *   *Proposed Rule:* **"Attribute the extremity, not the phenomenon."**
      *   *Wording:* "Climate change made this heat wave X times more likely and Y degrees hotter."
      *   *Can we use 'caused'?* Yes, if the object is the *severity*. "Climate change caused the record-breaking temperatures."

      *   *Let's try to find a stronger verb than 'contributed' but more precise than 'caused'.* "Fueled," "Intensified," "Drove."
      *   *Actually, the best solution is to define the 'Event'.* If the event is defined as "Temperatures exceeding 45°C," and that wouldn't have happened without warming, then warming *did* cause the event.
      *   *Memo Strategy:* Propose a rule that defines the "event" in attribution stories as the *threshold exceeded*, not the general weather pattern. This allows "caused" (satisfying Reporter) but relies on the specific study data (satisfying CE).

      *   *Revised Strategy:*
          1.  Acknowledge the tension.
          2.  State the scientific reality (probabilistic).
          3.  Set the rule: **Headlines and leads must specify *how* climate change altered the event (likelihood/severity), rather than claiming it originated the weather pattern.**
          4.  Allow "caused" *only* when referring to the specific added severity or likelihood, not the baseline phenomenon.
          5.  Provide examples.

  6.  **Final Polish:** Check against constraints. Short memo? Yes. Concrete rule? Yes. Takes both sides seriously? Yes (acknowledges the logic of causation while respecting the reporter's need for impact).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm banning "caused" entirely, which would side with the CEs. I need to show how "caused" can be used *correctly*.
      *   *Wrong:* "Climate change caused the heat wave." (Implies no heat wave would exist otherwise).
      *   *Right:* "Climate change caused the heat wave's record intensity." (Implies the intensity wouldn't exist otherwise).
      *   *Wait, does that split the difference?* No, it refines the definition of causation. It accepts the CE's logical constraint (necessity) but applies it to the *severity* (which the Reporter argues is the real story).
      *   *Actually, looking at the prompt again:* "Two copy editors refuse to run 'caused' at all." "Reporter wants... 'caused'."
      *   *My job:* Draft a rule that resolves this.
      *   *Decision:* The rule should prioritize precision over brevity in this specific scientific context. The "third way" is to mandate **attribution of the anomaly, not the baseline.**

      *   *Let's write it.*

      *   **Subject:** Editorial Standard: Wording for Climate-Attribution Stories
      *   **Opening:** We need consistency.
      *   **The Conflict:** Reporter (impact) vs. CE (logic).
      *   **The Resolution:** Both are right about different things. Weather is natural; *extremes* are amplified.
      *   **The Rule:** Do not state climate change "caused" a weather *phenomenon* (e.g., heat wave, storm). State that it "caused" or "drove" the *increased likelihood* or *severity*.
      *   **Why:** This satisfies the CE (logic of necessity applied to severity) and Reporter (gravity of human impact).

  7.  **Final Review of the Memo:**
      *   Is it short? Yes.
      *   Is it concrete? Yes (gives specific phrasing).
      *   Does it avoid splitting the difference? Yes, it creates a new standard of precision rather than compromising on strength.

      *(Wait, one more thought)*: The prompt says "takes both objections seriously rather than splitting the difference."
      *   Splitting the difference = "Let's use 'contributed'." (Weakens Reporter, satisfies CE).
      *   Taking both seriously = Acknowledge the Reporter is right that the *event as experienced* is new, but the CE is right that *causality* requires precision.
      *   So the rule is: **Define the event by its thresholds.** If the study says the *specific intensity* wouldn't have happened without warming, we can say warming caused *that intensity*.
      *   Okay, I will frame the rule around **Specific Attribution of Severity/Likelihood.**

