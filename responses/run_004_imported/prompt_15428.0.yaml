answer: |-
  **TO:** Editorial Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposed Style Guideline: Wording for Climate-Attribution Stories

  **Context**
  Following our debate regarding the recent heat wave coverage, we need a consistent standard for climate-attribution stories. The disagreement centers on the verb "caused." Our climate desk argues that "caused" accurately reflects the decisive human fingerprint on the event's impacts. Our copy desk argues that "caused" is logically incorrect if the weather phenomenon could occur naturally, even if less severely.

  **The Principle**
  Both positions are scientifically defensible but linguistically imprecise when applied broadly. Attribution science does not deal in binary origins (did the heat wave exist?), but in probabilistic alteration (how was the heat wave changed?). To take both objections seriously, we must distinguish between the *phenomenon* (a heat wave) and the *anomaly* (the record-breaking intensity and likelihood).

  **The Rule**
  Effective immediately, headlines and leads in attribution stories must **attribute the alteration, not the occurrence.**

  1.  **Do not** state that climate change "caused" a general weather phenomenon (e.g., "Climate change caused the heat wave"). This validates the copy desk's concern regarding logical necessity.
  2.  **Do** state that climate change "caused," "drove," or "fueled" the specific *severity*, *likelihood*, or *duration* confirmed by the study (e.g., "Climate change caused the heat wave's record intensity"). This validates the reporter's concern regarding the gravity of human impact.
  3.  **Preferred Phrasing:** When possible, lead with the study's specific metrics.
      *   *Instead of:* "Climate change caused the heat wave."
      *   *Use:* "Human warming made the heat wave five times more likely and 2°C hotter."
      *   *Or:* "Climate change drove the extreme severity of the heat wave."

  **Rationale**
  This standard avoids the logical trap of claiming a natural phenomenon would not exist without warming, while refusing to dilute the science to vague terms like "influenced." It acknowledges that while weather is natural, *this specific event as experienced by the public* is a product of human activity.

  **Action**
  Please review this proposed addition to the Style Guide. If there are no objections by Friday, this will be adopted as our standing standard for all future attribution coverage.
