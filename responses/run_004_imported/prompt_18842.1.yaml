answer: |-
  This is a brilliant connection. You have identified the exact friction point where ancient Chinese logic grinds against modern scientific taxonomy. The parallel is striking: Gongsun Long (c. 320–250 BCE) of the School of Names (*Ming Jia*) famously argued that "A white horse is not a horse" (*Baima fei ma*), while the IAU in 2006 argued that "A dwarf planet is not a planet."

  On the surface, it looks like the IAU accidentally became Mohist logicians. But if we plop Gongsun Long into the 2006 General Assembly in Prague, he wouldn't simply cheer for the demotion. He would likely dismantle the IAU's reasoning not on astronomical grounds, but on the grounds of *Zheng Ming* (the Rectification of Names).

  Here is how Gongsun Long would likely analyze the Pluto saga, using the logic of the *Baima Lun* (White Horse Dialogue), and what that tells us about whether his "sophistry" is actually profound.

  ### 1. The Logic of the White Horse
  To understand his verdict on Pluto, we have to be precise about what Gongsun Long actually meant. He wasn't denying biology. He wasn't saying a white horse is a cow.

  His argument rests on the distinction between **Form** (*xing*) and **Name** (*ming*).
  *   "Horse" names the **shape/form**.
  *   "White" names the **color**.
  *   "White Horse" names **shape + color**.

  His core syllogism is: If you ask for a "horse," a yellow or black one will do. If you ask for a "white horse," a yellow or black one will not. Therefore, the *reference* of "white horse" is not identical to the *reference* of "horse." The compound concept is distinct from the simple concept.

  ### 2. Gongsun Long vs. The IAU Definition
  The IAU's 2006 definition created three criteria for a "Planet":
  1.  Orbits the Sun.
  2.  Hydrostatic equilibrium (is round).
  3.  **Cleared the neighborhood.**

  Pluto fails #3. The IAU created a new category, "Dwarf Planet," which satisfies #1 and #2 but fails #3. Then they issued the decree: *A dwarf planet is not a planet.*

  **Gongsun Long's Critique:**
  He would likely nod approvingly at the distinction but recoil at the naming. Here is how his argument would unfold:

  **A. Agreement on Distinction (The "Not" is Valid)**
  Gongsun Long would agree with the IAU that "Dwarf Planet" $\neq$ "Planet." Just as "White Horse" (Shape + Color) is a specific request different from "Horse" (Shape only), "Dwarf Planet" (Round + Orbit + *Uncleared*) is a specific actuality different from "Planet" (Round + Orbit + *Cleared*).
  If a scientist asks for a "Planet" (implying a dominant body), handing them Pluto (a dominated body) fails the request. In this specific logical sense, *Dwarf Planet fei Planet* ("A dwarf planet is not a planet") holds water. The *Shi* (actuality) of the two categories is functionally different.

  **B. The Failure of Rectification (The "Dwarf" Trap)**
  Here is where he would turn on the IAU. Gongsun Long's philosophy was ultimately about governance and order. Confusion in language leads to confusion in the state.
  *   **The Linguistic Contract:** In common usage (and astronomical precedent like "Dwarf Star"), the modifier "Dwarf" specifies a *type* of the root noun. A Dwarf Star *is* a Star. The name implies inclusion ($A \subset B$).
  *   **The IAU Contradiction:** The IAU used the name "Planet" within the compound "Dwarf Planet," but asserted exclusion ($A \cap B = \emptyset$).

  Gongsun Long would argue: **"If the *Shi* (actuality) of the Dwarf Planet is such that it is not a Planet, then the *Ming* (name) must not contain 'Planet'."**

  By calling it a "Dwarf Planet" but insisting it is "not a planet," the IAU is violating the Rectification of Names. They are using a name that implies one relationship (inclusion) to describe an actuality that possesses another relationship (exclusion).

  He would likely say: *"You have correctly identified that the 'White Horse' (Dwarf Planet) is not the 'Horse' (Planet). But having realized this, you insist on painting the horse white and calling it a 'Horse.' If it is not to be accepted as a Horse when one asks for Horses, do not label it 'Horse.' Call it a 'Plutoid' or a 'Sub-Orb.' To keep the character 'Planet' in the name is to invite the confusion you claim to be resolving."*

  ### 3. Is This Sophistry or Insight?
  This is the crux of your question. Does Gongsun Long's logic expose the IAU's move as a trick, or does it validate the "sophistry" as real philosophy?

  **It exposes the IAU's move as linguistic legislation, not scientific discovery.**
  The anger you receive in your emails isn't really about ice and rock; it's about *Ming*. The public understands "Dwarf X" as a subset of "X." The IAU tried to change the *Ming* without changing the common language. Gongsun Long would point out that the IAU wasn't discovering a truth about Pluto; they were enforcing a linguistic boundary.

  **It validates the School of Names' core insight:**
  Gongsun Long is often dismissed as a sophist playing word games. But the Pluto saga proves his point: **Categories are not found in nature; they are imposed by language.**
  *   Nature gave us Pluto.
  *   We gave it the name "Planet."
  *   We found more objects like Pluto.
  *   We had to choose: Do we expand the *Ming* "Planet" to fit the new *Shi* (keep Pluto as a planet, add Eris, etc.)? Or do we shrink the *Ming* to exclude the new *Shi* (demote Pluto)?

  The IAU chose to shrink the *Ming*. Gongsun Long would argue that because they chose to shrink the definition of "Planet," they were logically obligated to remove "Planet" from the name of the excluded objects. By failing to do so, they created a "White Horse is not a Horse" paradox that serves no governance purpose other than to annoy the populace.

  ### The Verdict
  If Gongsun Long were in Prague in 2006, he would likely argue:

  > "The IAU is correct that the *actuality* of a Dwarf Planet differs from a Planet. In this, they follow the logic of the White Horse. However, they are foolish in their *naming*. If a Dwarf Planet is not a Planet, the word 'Planet' is a false descriptor. You have created a name that confuses the people rather than rectifying the reality. You should have named it what it *is*, not what it *is not*."

  **Does this make the sophistry real?**
  Yes. It moves the debate from "What is Pluto?" (science) to "What is the function of the word 'Planet'?" (philosophy).
  Gongsun Long's "sophistry" reveals that the IAU's decision was an act of **semantic power**. They didn't just classify; they legislated usage. The fact that people are still angry 18 years later proves the School of Names right: when *Ming* (names) do not align with *Shi* (reality/usage), social order (or in this case, scientific consensus) breaks down.

  The IAU tried to pull a Gongsun Long ("A Dwarf Planet is not a Planet"), but they forgot the second half of the lesson: If you make that argument, you must be precise enough to rename the horse. By keeping "Planet" in the name, they failed the very test of logic they invoked.
