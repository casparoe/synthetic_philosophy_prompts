prompt: |-
  I'm about a third of the way into a novel where the big twist is that the "present day" the reader's been following is actually just one of an enormous number of near-identical simulated instances of the same city, being run in parallel by some future civilization for research purposes. My protagonist is a physicist who got quietly demoted after being too weird at conferences, and I've got a scene where she has to explain to her skeptical colleague why the sheer fact that they exist at all should shift their credence about how many simulated copies there probably are. Trying to get that scene right, I went down a rabbit hole on anthropic reasoning -- specifically the self-sampling assumption vs the self-indication assumption -- and Bostrom's presumptuous philosopher case, and honestly the more of it I read the less I feel like I actually have a gut sense of it rather then just being able to repeat the jargon back.

  Like, I get that SSA has you reason as though your a random draw from some reference class of actually existing observers, and SIA piles an extra update on top of that in favor of theories which imply more observers exist in the first place, purely because there were "more slots" for you to have ended up in. What I can't quite feel in my bones is why that particular difference is what makes the presumptuous philosopher look so embarrassing specifically under SIA -- just marching up to physicists and telling them not to bother running their experiment -- while SSA dodges that one, and then why people don't just treat SSA's own price for dodging it (the doomsday argument, plus the whole mess of picking a reference class) as equally embarrassing in its own way. Could you walk me through the actual mechanics using a concrete case (something in the coin-toss/number-of-rooms style thought experiments is fine) so I can see exactly where the two views part ways, rather than the one-paragraph "SSA vs SIA" gist I could paraphrase off a stray blog post?
