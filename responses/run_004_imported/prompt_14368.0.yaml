  A novice monk approaches St. Augustine in his study, looking deeply troubled.

  "Father," the monk says, "Roman soldiers are hunting a Christian brother. If they come here asking for him, can I tell them he fled to Egypt?"

  Augustine doesn't look up from his scroll. "No. That is a lie. To speak falsehood with the intent to deceive is always a sin, even to save a life."

  "But if I don't, he dies!"

  "Then you must tell the truth, or remain silent."

  "But Father," the monk presses, "what if I tell them he fled to Egypt... on the back of a giant locust?"

  Augustine pauses, tapping his chin. "Ah. Now *that* is permissible."

  "Because it's unlikely?"

  "Because it is a jest," Augustine corrects. "A lie requires the *will to deceive*. But if the statement is so absurd that no reasonable man would believe it, there is no will to deceive. There is only the will to amuse."

  "But what if the soldiers believe me?" the monk asks. "What if they actually go look for him in Egypt on a locust?"

  Augustine smiles thinly. "Then you have not lied. You have told a joke to an audience without wit."

  "So my conscience is clear?"

  "Entirely," Augustine says. "For a lie is a falsehood told to be believed. A joke is a falsehood told to be recognized. If they believe your joke, the deception is not in your utterance, but in their understanding."

  The monk nods slowly. "So I save my soul, even if I don't save my friend."

  "You save your soul," Augustine says. "Whether you save your friend is up to God. Whether the soldiers are fools is up to them."

  **Punchline:** "Just remember: If they arrest you for it, you're a martyr. If they laugh, you're a comedian. But if they believe you... you're not a liar, you're just performing miracles of stupidity."
