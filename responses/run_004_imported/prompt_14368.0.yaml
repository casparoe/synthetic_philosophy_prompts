      *   The "Hard Case": Hiding fugitives from persecutors. Augustine says you can't lie, but you can remain silent or redirect, but you cannot assert a falsehood.
      *   The "Joke Exception": If everyone knows you're kidding, it's not a lie because no one is being led into error.

