answer: |-
  # The Whetstone and the Beast: Why the *Laws* Completes the *Republic* on Drunkenness

  The apparent contradiction between Plato's *Republic* and *Laws* regarding alcohol is one of the most persistent chestnuts in Platonic scholarship. In the *Republic*, Socrates paints the drunkard as the prototype of the tyrannical soul, a man whose rational guard is asleep while the "beastly and savage part" gorges on wine and madness (573b-c). In the *Laws*, the Athenian Stranger seemingly reverses field, prescribing regulated drinking parties as essential civic institutions for testing character and even mandating drunkenness for men over forty as a "medicine" for the soul.

  Standard academic diplomacy suggests we chalk this up to the *Republic* being an ideal city in speech and the *Laws* being a pragmatic colony in fact. This is a cop-out. It assumes Plato's moral psychology shifted in his old age from repression to management. I argue the opposite: The *Laws* does not undercut the *Republic*; it operationalizes it. The *Republic* identifies the pathology of the untamed appetite, but it fails to provide a technology for training the non-rational soul to *love* the rational order rather than merely obey it. The *Laws* fills this gap. The drinking parties of the *Laws* are not a license for hedonism, but a form of moral vaccination. By introducing the *Symposiarch* (the sober master of the drink) and age-graded restrictions, Plato transforms wine from a tyrant-maker into a tool of *sophrosyne*. The *Laws* is consistent with the *Republic*, provided we understand that the *Republic* warns against the *anarchy* of drink, while the *Laws* prescribes the *constitutional monarchy* of drink.

  To see this, we must first grant the *Republic* its due. Socrates' condemnation in Book IX is absolute: drunkenness dissolves the internal hierarchy of the soul. When the rational part sleeps, the appetitive part wakes up and seizes the citadel. This is the definition of injustice in the individual: civil war. If the *Laws* encouraged young men to drink without restriction, it would indeed be a betrayal of the *Republic*. But the *Laws* does no such thing. The critical variable missing from the *Republic*'s critique is the *Symposiarch*.

  In *Laws* Book I, the Athenian Stranger insists that no drinking party can be virtuous without a sober ruler. This is not merely a logistical detail; it is the psychological linchpin of the entire argument. The *Symposiarch* represents the externalized presence of *Logos* (Reason) and *Nomos* (Law). In the *Republic*, the tyrannical man is one who has no internal king; his appetites rule. In the *Laws* drinking party, the participant voluntarily submits to an external king while under the influence of a substance that mimics tyranny. This creates a controlled simulation of psychic civil war. The drinker's appetites are agitated (the "beast" is poked), but they are not allowed to rule, because the *Symposiarch* holds the leash.

  This distinction resolves the tension between "testing" and "building" character. Critics often ask: does the wine test reveal character that is already there, or does it build it? In the *Laws*, the answer is both, through the mechanism of habituation. Plato explicitly critiques the Spartans in Book I for only training courage (endurance of pain/fear) while neglecting *sophrosyne* (endurance of pleasure/desire). You cannot learn to resist pleasure by avoiding it; that produces not virtue, but insensibility or naive ignorance. True *sophrosyne* requires the rational part of the soul to maintain command *while* the appetites are screaming.

  The drinking party is a "fear-drill of pleasure." Just as a soldier learns courage by facing danger under the command of a general, the citizen learns temperance by facing intoxication under the command of a *Symposiarch*. If the *Republic* says "do not let the beast out," the *Laws* says "take the beast for a walk on a strong leash so it learns who holds it." This is not a contradiction; it is a pedagogical advancement. The *Republic* assumes the rational part can starve the appetites into submission. The *Laws* recognizes that for virtue to be stable, the appetites must be habituated to submission even when aroused. The wine provides the arousal; the law provides the submission.

  This consistency extends to the controversial "medicine" for the elderly in Book II. Here, Plato argues that men over forty should be encouraged to drink to the point of drunkenness in the choruses of Dionysus. Superficially, this looks like the *Republic*'s tyrannical soul sanctioned by the state. However, the purpose here is not the training of the drinker's self-control, but the preservation of the city's educational continuity.

  Plato diagnoses old age as a hardening of the soul. The elderly become too ashamed, too rigid, and too fearful to sing and dance in front of the young. This is catastrophic for the *Laws'* educational model, which relies on choral performance to instill rhythm and harmony in the youth. If the elders refuse to perform because of "shame" (a form of fear), the chain of cultural transmission breaks. Wine acts as a pharmacological intervention against this rigidity. It loosens the soul, reducing the shame that prevents the elders from modeling virtue for the next generation.

  Crucially, this exception proves the rule of the *Republic*. The *Republic* condemns drunkenness because it makes the soul unfit for ruling. The men over forty in the *Laws* are no longer the primary rulers or the primary trainees; they are the educators. Their temporary "madness" serves a rational end: the education of the young. Furthermore, this drunkenness is contained within the chorus, a highly structured, ritualized environment. It is not the solitary, lawless binge of the tyrant; it is a communal, liturgical act. The "tyranny" of the wine is harnessed to serve the "monarchy" of the Law.

  Does this quietly undercut the *Republic*'s picture of appetite as something reason must rule rather than bargain with? No. It deepens it. In the *Republic*, the relationship between Reason and Appetite is often depicted as a master-slave dynamic. The *Laws* suggests that for the city to endure, this relationship must evolve into a partnership where the non-rational elements are not just suppressed, but *aligned*. Wine is the tool that reveals misalignment. If a man cannot remain obedient to the *Symposiarch* while drunk, he is revealed as unfit for office (a test). If he obeys, his obedience is strengthened through the friction of temptation (a training).

  The verdict, therefore, is that the *Laws* is a consistent, mature extension of the *Republic*'s psychology, not a retraction. The *Republic* describes the *telos* of the soul: a harmony where reason rules and appetite does not revolt. The *Laws* describes the *techne* required to achieve that telos in flawed human material. Socrates in the *Republic* is right that a drunk man *is* tyrannical if left to his own devices. The Athenian Stranger in the *Laws* adds the crucial caveat: *unless* that drunkenness is encased in law, overseen by reason, and directed toward the good of the whole.

  To claim these dialogues contradict is to mistake the warning against poison for a contradiction of the prescription for medicine. Both agree that unregulated wine kills the soul. The *Laws* simply discovers that regulated wine, administered by the sovereign hand of Law, can cure it. The beast is still dangerous, but Plato eventually realized that a philosopher-king does not just kill the beast; he trains it.
