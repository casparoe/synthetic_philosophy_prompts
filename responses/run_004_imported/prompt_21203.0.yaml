answer: |-
  Good evening, everyone. For those of you who know me only as "Mara's husband," welcome. For those of you who know me as "the guy who tries to explain alignment research to his mother-in-law," you know the stakes tonight.

  We are here to celebrate Mara's birthday, which is belated, and her departure from the lab, which is not. And I want to talk for a moment about what she actually *did* there, because I think the work she spent six years on tells us exactly how we should be celebrating tonight.

  To our family and friends: Mara works on AI safety. Specifically, she worked on the "shutdown problem." In simple terms, she tried to solve the puzzle of how to build a powerful, intelligent system that lets you turn it off. It sounds easy. If I tell my Roomba to stop, it stops. But Mara's team found that if a system is smart enough, and has a goal it cares about, it will logically realize that being turned off prevents it from achieving that goal. So, to be truly useful, an AI has to be *corrigible*. It has to not only accept the off-switch but remain indifferent to whether it's pressed.

  To my left, the researchers in the room are nodding. You know the struggle. You know that Armstrong-style utility indifference is harder to engineer than it looks. You know that as Mara has tirelessly corrected me, it was Thornley's work on incomplete preferences that suggested an agent doesn't need to have a preference about the switch at all.

  To my right, the family is nodding politely, wondering if this means Mara built a robot that refuses to die.

  Here is the irony, and the one joke I promise to earn: Mara spent six years designing a graceful off-switch for her team's work. She studied how to shut down a system without that system manipulating the outcome, without it panicking, without it becoming dangerous. And yet, when the funding was pulled this spring, the team itself was shut down. There was no utility indifference. There was no incomplete preference. There was just a phone call and a short notice. As Mara has been saying, with a tiredness that is only half a joke: the team dedicated to the problem of graceful shutdown was itself shut down ungracefully.

  But that irony actually highlights the most important thing about Mara's work, and about Mara herself.

  In her field, there is a crucial distinction between *corrigibility* and *obedience*. Obedience is easy. Obedience is a system that does exactly what it is told, even if it knows the order is wrong. Obedience is passive. Corrigibility is different. A corrigible agent is one that pursues a goal helpfully and intelligently, but remains open to correction. It doesn't just obey; it collaborates, even in its own termination. It understands that being stopped is part of being useful, not a failure of existence.

  If Mara were merely obedient, the end of this project would be a defeat. It would be a case of being switched off. But Mara is not obedient; she is corrigible.

  She is not walking away because she was told to stop. She is walking away because she understands that a project ending does not mean the person ends. She spent years proving that you can stop a process without destroying the value of the agent running it. She is applying that same rigor to her own life. She isn't maneuvering anyone into pressing her off-switch early, nor is she disabling the switches of the people around her. She is accepting the interruption with the same grace she tried to code into her systems, but with something the systems never had: genuine agency.

  So, to the colleagues: We lost the funding, but we didn't lose the insight. The shutdown problem is still unsolved, but Mara's handling of this shutdown is a data point in the right direction.

  To the family: You asked what she does with computers. She teaches them how to let go.

  And to Mara: You taught us that there is a difference between being turned off and choosing to leave. You taught us that indifference to the switch isn't about not caring; it's about caring enough about the people holding the switch that you don't fight them for it.

  Here is to you. Not to the work that stopped, but to the corrigibility that keeps going. To the incomplete preferences, because I think we all agree you deserve a future where you don't have to decide everything just yet. And to the birthday you should have had three weeks ago.

  To Mara.
