      *   *Key Argument for Alice:* The knowledge is about the *disposition*. Even if the disposition wasn't triggered at Node 1 (for some reason we don't model), the disposition remains for Node 3.
      *   *Key Argument for Bob:* The disposition is revealed by action. Action at Node 1 contradicts the disposition. You can't have it both ways.

