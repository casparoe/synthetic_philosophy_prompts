answer: |-
  To reconstruct Henry Sidgwick's reaction to Daryl Bem's 2011 paper *"Feeling the Future"* and the ensuing controversy, we must hold two competing aspects of his intellectual character in tension. On one hand, there is Sidgwick the desperate moralist, who sought empirical leverage to resolve the "dualism of practical reason." On the other, there is Sidgwick the scrupulous investigator, whose commitment to truth was so severe it cost him his religious standing and whose patience with evidence was so exacting it often alienated his colleagues in the Society for Psychical Research (SPR).

  If we place Sidgwick in a seminar room in 2012, listening to the presentation of Bem's nine experiments showing precognitive priming, followed by the critiques regarding p-values, Bayesian priors, and replication failures, his reaction would likely follow a distinct trajectory: **initial philosophical exhilaration, followed by methodological dismantling, and concluding with a sorrowful but firm rejection.**

  Here is a reconstruction of that judgment, separated into the philosophical stakes and the scientific evaluation.

  ### 1. The Philosophical Stakes: A Tempting Vindication
  Sidgwick would not approach Bem's paper with the dismissive cynicism of a hardline materialist. To the contrary, he would recognize the claim immediately as potentially solving the problem that haunted him from *The Methods of Ethics* to his deathbed.

  Sidgwick's "dualism of practical reason" arose from the conflict between Rational Egoism (it is rational to pursue one's own happiness) and Universal Hedonism/Utilitarianism (it is rational to pursue the general good). In a purely materialist universe, where death is the end and virtue often leads to personal sacrifice without reward, these two rational dictates can contradict. Sidgwick hoped that empirical evidence of a moral order—specifically, personal survival and post-mortem retribution—would harmonize them. If the soul survives and the universe is structured such that duty and interest coincide in the long run, ethics becomes fully rational.

  Bem's claim—that future events influence present cognition—attacks the causal closure of the physical world. If time is not strictly linear and consciousness can interact with future random events, the materialist framework is cracked. For Sidgwick, this is not merely a parlor trick; it is an ontological opening. He would view Bem's publication in the *Journal of Personality and Social Psychology* (JPSP) with profound interest. The fact that this was not a fringe journal but a mainstream outlet would signal to him that the "scientific priesthood" was finally taking the anomaly seriously, something he had fought for throughout the 1880s and 90s.

  In this initial phase, Sidgwick would feel a surge of hope. He would see Bem not as a fraud, but as a kindred spirit attempting to use the tools of science to map the boundaries of the mind. He would likely argue against immediate dismissal, reminding the critics (as he did in the SPR) that "the settled convictions of the educated world" have been wrong before.

  ### 2. The Methodological Inquisition: The Ghost of the Creery Sisters
  However, Sidgwick's hope would be short-lived. Once the initial excitement faded, the "Sidgwickian scrutiny" would engage. This is where the reconstruction becomes critical. Sidgwick was not a believer who looked for proof; he was a judge who looked for flaws. His involvement in the "Creery sisters" case is the precise analog for the Bem controversy.

  In the 1880s, the SPR investigated the Creery sisters, who could seemingly guess cards at rates far above chance. Sidgwick initially championed the results as the "most crucial evidence" the Society had found. But when it was discovered the girls were using a code of signals, Sidgwick did not rationalize. He accepted the fraud immediately and used it to tighten the Society's protocols. He famously noted that the value of the SPR was not in proving spiritualism, but in applying rigorous scientific methods to these claims, even if the result was negative.

  Applied to Bem, Sidgwick would turn his attention to the *procedure* rather than the *implication*.
  *   **Experimenter Degrees of Freedom:** Sidgwick would be alarmed by the flexibility in Bem's design (stopping rules, selection of measures). He would recognize this as a version of the "subtle cues" problem that plagued early telepathy experiments. He would ask: *Could the experimenter's expectation have influenced the data collection?*
  *   **The File Drawer Problem:** Sidgwick understood the bias of testimony. He knew that people report hits and forget misses. He would intuitively grasp the concept of publication bias—that Bem's 9 successful experiments might be the survivors of 20 failed ones. He would demand a registry of all attempts, not just the successes.
  *   **Replication:** This is the decisive factor. Sidgwick valued cumulative evidence over singular "striking" results. When the failed replications began to appear (the large-scale preregistered studies that found null effects), Sidgwick would view this as conclusive. For him, a phenomenon that cannot be reliably reproduced under controlled conditions is indistinguishable from noise.

  ### 3. The Bayesian Intuition: Antecedent Improbability
  One of the most sophisticated critiques of Bem came from Bayesian statisticians (such as Wagenmakers et al.), who argued that because precognition is so implausible given our current understanding of physics, the prior probability should be so low that a p-value of .05 is insufficient to overturn it.

  Sidgwick would grasp this logic immediately, even without the modern terminology. In his *On the Evidence of Miracles*, and throughout his psychical writings, he grappled with Hume's argument against miracles. Sidgwick's position was nuanced: he believed testimony *could* overcome antecedent improbability, but the strength of the testimony must be proportional to the strangeness of the claim.

  He would argue that Bem's statistical evidence was "too thin" for the weight of the claim. A p-value of .05 implies a 1 in 20 chance of error. For a claim that suggests retrocausality, Sidgwick would argue the margin of error must be vanishingly small—perhaps 1 in a million—because the cost of being wrong (accepting a false law of nature) is higher than the cost of being skeptical. He would side with the critics who argued that "ordinary significance testing was far too generous." He would likely write that to accept Bem's data as proof of precognition is to commit the fallacy of neglecting alternative hypotheses (e.g., p-hacking, undisclosed flexibility) which are far more probable than time-reversed causality.

  ### 4. Separation of Science and Philosophy
  This brings us to the crux of your question: Would his judgment about the quality of the science come apart from his sense of what the result would have meant?

  **Yes, absolutely.** In fact, Sidgwick's integrity rests on this separation.

  Sidgwick resigned his fellowship at Trinity College in 1869 because he could no longer sign the Thirty-Nine Articles. He chose financial insecurity and professional risk over intellectual dishonesty. This establishes a pattern: **Sidgwick prioritizes the integrity of the inquiry over the comfort of the conclusion.**

  If Bem's results were genuine, they would solve the Dualism of Practical Reason. But if Bem's results are flawed, accepting them would be a lie. Sidgwick would argue that accepting bad evidence for psychical phenomena is actually *harmful* to the philosophical cause he cared about. It gives ammunition to materialists to dismiss all such inquiries as superstition.

  He would likely articulate a position similar to this:
  > *"I desire the truth of these phenomena more than any man, for the sake of the ethical implications they carry. But to affirm them on insufficient evidence is to betray the very rationality we seek to defend. If morality is to be grounded in truth, we cannot build it on statistical artifacts."*

  He would view the "Replication Crisis" not as a scandal that discredits psychology, but as a necessary purification. He would see the shift toward preregistration and open data as the maturation of the field into the kind of rigorous discipline the SPR had always aspired to be. He would commend the critics not for being closed-minded, but for being *scrupulous*.

  ### 5. The Final Verdict: Agnostic Hope
  In the end, Sidgwick's reaction to the Bem episode would be one of **tragic consistency**.

  He would not treat Bem's paper as a vindication. He would treat it as a "false dawn." He would acknowledge that Bem succeeded where the SPR often failed: he brought the question into the mainstream and forced a methodological reckoning. But regarding the specific claim of precognition, Sidgwick would conclude that the evidence failed to meet the burden of proof.

  However, unlike a hardline skeptic, Sidgwick would not claim this *disproves* survival or psychical phenomena. He would maintain his "agnostic hope." He would argue that the failure of Bem's specific protocols does not close the door on the possibility of consciousness transcending time, it merely closes the door on *that specific key*.

  The Dualism of Practical Reason would remain unresolved. Sidgwick would return to his position at the end of his life: that we must act *as if* the moral order exists, even if empirical science cannot yet confirm it. He would likely find a grim satisfaction in the Bem controversy, noting that the "habit of mind" he tried to instill in the SPR—relentless self-criticism, suspicion of one's own desires, and the willingness to discard one's own "successes"—had finally taken root in mainstream psychology, even if it meant killing the very result he might have wished to save.

  **Summary of Sidgwick's Hypothetical Stance:**
  1.  **Philosophical Interest:** High. The claim addresses the ontological gaps in his ethical system.
  2.  **Methodological Judgment:** Devastating. The statistical standards are insufficient for the claim's magnitude; replication failures are decisive.
  3.  **Ethical Stance:** Truth-telling overrides wish-fulfillment. Bad science harms the philosophical cause.
  4.  **Final Conclusion:** The evidence is rejected, but the inquiry remains valid. The Dualism remains unresolved, to be managed by faith or practical postulates, not empirical proof.

  Sidgwick would emerge from the Bem controversy not as a vindicated prophet, but as the patron saint of the Replication Crisis: the man who warned, a century prior, that if you do not hunt for the flaw in your own positive results, the world will eventually find it for you.
