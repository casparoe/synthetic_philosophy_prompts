answer: |-
  Your intuition is correct: **there is no perfectly fair way to do this.** You haven't failed to find the right formula; you have run headfirst into a fundamental mathematical limit known as **Arrow's Impossibility Theorem**.

  What your neighborhood association is experiencing isn't a result of manipulation or bad math. It is a structural feature of collective decision-making. Here is what is happening, why it's happening, and how you can actually move forward.

  ### 1. The Fundamental Problem: Arrow's Impossibility Theorem
  In 1950, economist Kenneth Arrow proved a theorem that shook the foundations of social science. He asked a simple question: *Is there a voting system that can convert individual ranked preferences into a community-wide ranking while satisfying a few basic conditions of fairness?*

  He defined "fairness" using three reasonable criteria:
  1.  **Unanimity:** If every single person prefers Option A over Option B, the group ranking should reflect that.
  2.  **No Dictator:** The outcome shouldn't just be determined by one person's preferences regardless of everyone else.
  3.  **Independence of Irrelevant Alternatives (IIA):** If Option A wins over Option B, removing a losing Option C (like the Solar Panels) should not change the result between A and B.

  **Arrow proved that no ranked voting system can satisfy all three of these conditions simultaneously.**

  Your experience with the Solar Panels is a textbook violation of the third criterion (IIA). When you removed the Solar Panels, the point values shifted. Even though no one changed their mind about the Playground vs. the Garden, the *mathematical weight* of their preferences changed because the "scale" of the voting system changed. In point-based systems (like the Borda Count you used first), the presence of a "spoiler" candidate changes the value of every other rank.

  ### 2. Why the Methods Disagreed
  You used two different methods, and they measure different things:

  *   **The Point System (Borda Count):** This method tries to maximize **overall satisfaction**. It rewards broad consensus. The Playground likely won here because it was everyone's "safe" second choice, even if it wasn't many people's fiery first choice.
  *   **The Pairwise System (Condorcet Method):** This method looks for a **head-to-head champion**. The Garden won here because, in one-on-one matchups, it beat the other options more often. This rewards intense preference.

  Neither is objectively "more fair." One prioritizes harmony (Borda), and the other prioritizes majority rule in direct contests (Condorcet). Because they measure different definitions of "winning," they will often produce different winners in a polarized group.

  ### 3. The Strategic Accusations
  You mentioned people are accusing each other of favoring counting methods that help their project. Arrow's theorem implies another related problem (the **Gibbard-Satterthwaite Theorem**), which states that **all voting systems are susceptible to strategic voting.**

  If people know the Borda Count is being used, they might insincerely rank a strong competitor last to lower its score. If they know Pairwise is being used, they might try to create a "cycle" of preferences. Because no system is perfectly neutral, choosing the system *is* a political act. The accusations flying around your association are mathematically justified: **choosing the method is just as important as casting the vote.**

  ### 4. How to Actually Solve This
  Since mathematics tells us a perfect neutral system doesn't exist, you cannot solve this by finding a better calculator. You have to solve it through process and transparency.

  **Step 1: Agree on the Rules Before Voting**
  The biggest mistake associations make is voting first and arguing about the count later. You must decide on the voting method *before* anyone sees the proposals.
  *   *If you value consensus:* Use the Point System (Borda).
  *   *If you value majority rule:* Use Pairwise (Condorcet) or Plurality.
  *   *If you want to avoid the "Spoiler Effect":* Use Ranked Choice Voting (Instant Runoff), though note that this *also* violates IIA, just in a different way.

  **Step 2: Acknowledge the Trade-off**
  Hold a meeting specifically to discuss *how* you will decide. Say explicitly: "We know that different counting methods produce different winners. We need to agree on what kind of winner we want."
  *   Do we want the project that angers the fewest people? (Borda)
  *   Do we want the project that the most people feel strongly about? (Condorcet)

  **Step 3: Use Voting to Narrow, Not to Decide**
  Voting is often a blunt instrument for community building. Consider using the vote to narrow the four options down to the top two, and then hold a facilitated discussion or a simple majority runoff between those two. This reduces the mathematical complexity and forces the community to reconcile the differences between the final contenders.

  ### Summary
  Your assumption that there must be a "genuinely neutral way" is the thing that is wrong. **Neutrality in voting is mathematically impossible.**

  The friction you are feeling isn't a bug in your association; it's a feature of democracy. The solution isn't to search for a perfect algorithm, but to have an honest conversation about what "fairness" means to your specific neighborhood. Once you agree on what kind of fairness you value most, the math will stop fighting you.
