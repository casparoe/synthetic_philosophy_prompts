answer: |-
  The position is this: **Omissions are never genuine causes.** To claim that "not doing something" causes an event is a category error that conflates metaphysics with morality. It is a linguistic shortcut that collapses under the slightest logical pressure. If you want to preserve the integrity of the word "cause," you must excise omissions from the definition entirely.

  Here is the unvarnished argument for why causation requires positive action, and why the lifeguard example proves that we are talking about duty, not physics.

  ### 1. Causation Requires Existence
  At its core, causation is a physical relation between events. For $A$ to cause $B$, there must be a transfer of energy, a change in state, or a physical mechanism linking the two. When a murderer pushes a victim into the water, there is a clear kinetic chain: muscle contraction $\rightarrow$ force applied $\rightarrow$ body displaced $\rightarrow$ lungs filled.

  When a lifeguard sits on a chair, there is **nothing**. There is no energy transfer. There is no physical intervention. There is only the absence of an intervention. Nothingness cannot exert force. Nothingness cannot alter the trajectory of physical events. To say that "nothing" caused "something" is to treat non-existence as if it were a type of existence. It is metaphysically incoherent. The water drowned the victim. Gravity drowned the victim. The lifeguard's inaction was merely the background context in which the water did its work.

  ### 2. The Problem of Profligate Omissions
  You identified the fatal flaw in the opposing view: the problem of profligate omissions. This is the reductio ad absurdum that should kill the theory instantly.

  If we accept the counterfactual definition of causation (i.e., "$X$ caused $Y$ because if $X$ hadn't happened, $Y$ wouldn't have"), then we are forced to admit that **everything that did not happen** is a cause of **everything that did happen**.

  *   Did the lifeguard cause the death by not swimming? Yes, under the omission view.
  *   Did the bystander on the beach cause the death by not swimming? Yes.
  *   Did the professional swimmer three towns away cause the death by not teleporting to the beach? Yes.
  *   Did you, sitting in your classroom, cause the death by not flying there to perform CPR? Yes.

  If omissions are causes, then every single event in the universe has an infinite number of causes. Every non-event is a cause of every event. This renders the concept of "causation" useless. If everything is a cause, nothing is a cause. We cannot distinguish between the relevant and the irrelevant because the logic treats the lifeguard's inaction and your inaction as metaphysically identical. The only reason we stop at the lifeguard is not because of *causation*, but because of *expectation*.

  ### 3. Counterfactual Dependence is Not Causation
  The defense for omission causation usually rests on counterfactuals: "If the lifeguard had acted, the person would live." This is true, but it proves nothing about causation. It proves **dependence**.

  The victim's survival *depended* on the lifeguard, but the lifeguard's sitting did not *produce* the death. Consider a plant that dies because you didn't water it. Did your "not watering" kill the plant? No. The heat, the evaporation, and the biological processes of the plant killed the plant. Your absence was a condition of the death, not the cause.

  We confuse dependence with causation because our brains are wired to look for agents. When an expected intervention fails to occur, our brain flags it as significant. But significance is not causality. The sun not exploding today is a necessary condition for you reading this text, but the sun's non-explosion is not the *cause* of you reading this text.

  ### 4. The Normative Shift: Blame vs. Cause
  So why do we blame the lifeguard? Because ethics is not physics.

  When we say the lifeguard "caused" the death, we are speaking loosely. What we actually mean is that the lifeguard is **responsible** for the death. Responsibility is a normative concept, grounded in contracts, roles, duties, and social expectations.
  *   The lifeguard signed a contract.
  *   The lifeguard accepted a role.
  *   The lifeguard breached a duty.

  The bystander did not. The swimmer three towns over did not. You did not.

  The distinction between the lifeguard and the bystander is not metaphysical; it is moral. If you treat omissions as causes, you try to solve a moral problem with a metaphysical tool. That is why the logic breaks. You are trying to find a physical difference between the lifeguard's sitting and the bystander's standing. There isn't one. Both are physically just "people not swimming." The difference exists entirely in the realm of human agreement and obligation.

  ### 5. Conclusion: Save the Concept of Cause
  We must stop being sloppy with language. If we allow omissions to count as causes, we destroy the utility of causal reasoning in science, law, and history. We open the door to infinite regress where every non-event is a culprit.

  The cleanest, most rigorous conclusion is this: **Omissions are not causes.** They are conditions for responsibility. The lifeguard is guilty of negligence, not homicide by causation. The water caused the death. The lifeguard allowed it to happen.

  "Allowing" is not "Causing."
  "Negligence" is not "Force."
  "Duty" is not "Physics."

  By separating causation (what physically happened) from responsibility (who we hold accountable), we solve the rabbit hole. The lifeguard matters more than the bystander not because they caused the death, but because they betrayed a trust. Keep causation for the physical world, and keep blame for the moral world. Never the twain shall meet.
