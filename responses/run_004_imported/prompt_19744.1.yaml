      *   Novel example? Yes (*Bifurca* moth).
      *   Detailed? Yes.
      *   Why fixes fail? Yes (Normal conditions, Proper function, Consumer mapping).
      *   Tone? Respectful/Expert.

      *(Final thought)*: I should explicitly mention why this isn't just the frog/BB pellet case. In the frog case, BBs are *not* food. Here, both options *are* "food/mates". It's a disjunction of *goods*, not a good vs. a bad/non-good. This makes the "error" condition impossible to define.

