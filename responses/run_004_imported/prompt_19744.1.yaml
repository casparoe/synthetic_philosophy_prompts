  2.  **Deconstruct the Disjunction Problem in Teleosemantics:**
      *   *Core Issue:* Selection history is coarse-grained. Mechanisms are selected for outcomes (survival/reproduction), not truth conditions.
      *   *Standard Reply:* "Normal Conditions" (Millikan). The content is what the mechanism was supposed to detect *under the conditions in which it was selected*. If $Y$ wasn't present during selection, the content is $X$.
