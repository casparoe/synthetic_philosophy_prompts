  6.  **Developing the "Rule-Sensitivity" Argument:**
      *   The prompt specifically asks to focus on *rule-sensitivity*.
      *   Argument: If the outcome of the Vase depends entirely on *which* ball I pick, then the "number of balls" isn't a property of the supertask itself, but of my arbitrary choice. Similarly, the Lamp's state isn't a property of the switching, but of an arbitrary choice.
      *   Therefore, the "determinate" answer of the Vase (0) is only determinate relative to a stipulation. Without that stipulation, it's just as indeterminate as the Lamp.
      *   Most people treat the "remove lowest number" rule as "default." Why? That's the weak point.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Compare Thomson & Ross-Littlewood? Yes.
