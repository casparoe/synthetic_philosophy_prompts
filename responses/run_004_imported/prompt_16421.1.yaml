      *   *Section 1: The Illusion of the "Solution".* Explain why people think the Vase is solved (set theory). Show that this relies on tracking individual identities.
      *   *Section 2: The Parallel to Thomson.* Thomson's Lamp asks "On or Off?" Vase asks "How many?" Benacerraf says "The rules don't say." The Vase solution says "The rules *do* say, if you specify the label." But specifying the label is an *extra* rule, just like specifying the final state of the lamp would be.
      *   *Section 3: Metaphysical Commitments.* To get the "empty vase," you must assume balls retain identity through infinite steps. To get the "lamp off," you must assume a limit state exists. Both are assumptions not forced by logic.
      *   *Section 4: The Verdict.* Both show that supertasks are not just physically impossible but *conceptually incomplete*. You cannot describe a physical supertask purely mathematically without leaving gaps.
      *   *Conclusion:* Reiterate that the "unease" is the same. The Vase isn't solved; it's just more detailed in its underdetermination.

  5.  **Refining for the Audience (High School Philosophy Club):**
      *   Avoid overly dense set-theoretic notation.
