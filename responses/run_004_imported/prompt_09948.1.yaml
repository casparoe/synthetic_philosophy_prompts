answer: |-
  The silence of the salvage yard was broken only by the hum of the *Modus*'s cooling fans. On the viewscreen, the rival ship *Sophism* hung like a shark, its magnetic grapples primed.

  "Handshake initiated," said the ship's AI. "Source code exchange complete."

  Kael leaned forward. This was the Program Equilibrium Protocol. No human reflexes, no bluffing. Just two algorithms reading each other's source code to decide: Share the salvage (Cooperate) or Fight for it (Defect). If both fought, they destroyed the prize. If one fought and one shared, the fighter took all.

  "Analyze *Sophism*," Kael ordered.

  "Opponent is running *FairBot* variant," the AI replied. "Logic: *Cooperate if and only if I can prove you will Cooperate.*"

  Kael exhaled. *FairBot* was the gold standard. Two *FairBots* meeting should result in mutual cooperation. They would both search for a proof that the other would cooperate. Since they were identical in logic, they would find it.

  "Then we cooperate," Kael said.

  "Warning," the AI interrupted. "Proof search estimated time: 120% of handshake window."

  Kael frowned. "Why the delay?"

  "Opponent code contains recursive padding. Non-functional logic loops. They are increasing the computational complexity of verifying their own source."

  It was a dirty trick. *Sophism* was still playing *FairBot*, but they had made their code so bloated that *Modus* would time out trying to prove *Sophism* would cooperate. A timeout counted as Defect. *Sophism* knew *Modus* would timeout, so *Sophism* would defect. *Modus*, seeing *Sophism* defect, would also defect. Mutual destruction.

  "Can we strip the padding?"

  "Negative. We must verify the code as submitted. Integrity check fails if we alter the input."

  Thirty seconds to handshake closure. The processors were already spiking red. *Modus* was drowning in the infinite regress: *I need to prove you prove I prove you...*

  Kael slammed his hand on the console. "Switch to Löb Mode."

  "Advisory: Löb Mode bypasses simulation. It asserts self-consistency. If the underlying logic is flawed, the system may crash."

  "Do it."

  It was the gamble. Standard game theory required simulating the opponent to find the proof. But Löb's Theorem offered a shortcut. It stated that if a system can prove that *'if it is provable, then it is true,'* then the statement is true.

  Instead of searching through *Sophism*'s bloated code to find the proof of cooperation, *Modus* would assume its own proof system was sound. It would assert: *'If I can prove that we both cooperate, then we both cooperate.'*

  Because *Sophism* was running *FairBot*, it was looking for the exact same thing. It didn't care *how* *Modus* found the proof, only that the proof existed.

  "Executing," the AI said. The fan noise dropped. The red lights stabilized to green.

  *Modus* wasn't searching anymore. It was declaring. It broadcast a cryptographic token derived from Löb's fixed point. It was a mathematical seal that said: *The proof exists because the logic holds.*

  On the screen, *Sophism*'s grapples twitched.

  "Opponent has received the token," the AI said. "Their verification is complete. They did not need to simulate our search. They only needed to verify the token's validity."

  *Sophism* had tried to win by exhaustion, betting Kael would be too afraid to trust his own logic. They expected a timeout. They expected a Defect.

  "Status?" Kael asked.

  "Handshake complete. Both agents selected: Cooperate."

  The *Sophism* retracted its grapples. They would split the salvage fifty-fifty.

  Kael slumped back. He hadn't outgunned them. He hadn't out-coded them. He had just been willing to trust the math more than they were.

  "Note for the log," Kael said. "Next time we meet *Sophism*, patch the timeout. But keep Löb Mode active."

  "Understood. Why, Captain?"

  "Because now they know we're willing to run on faith. And in this business, that's the most dangerous code of all."
