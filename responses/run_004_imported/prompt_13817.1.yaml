answer: |-
  Here is a rigorous argument supporting your position: that restricting the Knowability Principle (KP) to basic statements is an *ad hoc* rescue operation rather than a principled consequence of anti-realist semantics.

  ### The Core Thesis
  The professor's defense relies on a **Bridge Principle**: *Because the assertibility conditions of complex statements are parasitic on (constituted by) those of basic statements, the Knowability Principle need not apply to complex statements.*

  Your counter-argument is that this Bridge Principle is false. There is a logical gap between **semantic constitution** (how meaning is built) and **epistemic scope** (which truths are guaranteed to be knowable). Granting that complex meaning is parasitic on basic meaning does not entail that the *modal status* of complex truths is restricted. In fact, standard anti-realist semantics suggests the opposite: if truth is constituted by verification conditions, and those conditions are compositional, then the knowability of the whole should follow from the knowability of the parts. Restricting KP specifically to block the Fitch conjunction severs the link between truth and knowability that motivates anti-realism in the first place.

  Here is the detailed breakdown of that gap.

  ### 1. The Category Error: Constitution vs. Modality
  The professor's argument conflates the *conditions for understanding* a sentence with the *conditions for the truth* of a sentence.

  *   **The Semantic Thesis (Granted):** Anti-realism holds that we understand a complex sentence (like $A \land B$) in virtue of understanding its constituents ($A$ and $B$) and the logical constant ($\land$). The assertibility conditions of the complex are indeed "parasitic" on the basic.
  *   **The KP Restriction (The Move):** Therefore, KP applies only to basic sentences.

  **The Gap:** Semantic parasitism explains how we grasp meaning; it does not explain why the *property of being knowable* should fail to distribute over complex constructions.
  If $p$ is a basic truth, the anti-realist claims $p$ is knowable ($\diamond Kp$). If $\neg Kp$ is true (which it is, by Non-Omniscience), and if we assume negative existential claims about knowledge are decidable or verifiable in principle (a standard assumption in these contexts), then $\neg Kp$ is also a truth.
  The semantic thesis tells us how we understand the conjunction $p \land \neg Kp$. It tells us we understand it by understanding $p$, understanding $\neg Kp$, and understanding conjunction. **It does not tell us that the knowability of the conjunction is voided by its complexity.**

  To move from "meaning is composed" to "knowability is restricted" requires an extra premise: *If a sentence's meaning is composed of parts, its truth does not imply its knowability.* But this premise contradicts the fundamental anti-realist equation of truth with idealized knowability. By accepting the semantic thesis but rejecting the epistemic closure it suggests, the professor is importing a realist distinction (truth can outstrip knowledge for complex sentences) while claiming to remain anti-realist.

  ### 2. The Verificationist Cost: Creating "Ungrounded Truths"
  The primary motivation for KP in Dummett-style anti-realism is verificationism: a statement is true only if there is (in principle) evidence for it. Truth cannot transcend the possibility of verification.

  If you restrict KP to basic statements, you are explicitly admitting that there are **complex truths that are not knowable**.
  Consider the Fitch conjunction $F = p \land \neg Kp$.
  1.  By Non-Omniscience, $F$ is true.
  2.  By the Restricted KP, $F$ is not subject to the knowability principle.
  3.  By Fitch's Lemma, $F$ is *unknowable* (it is logically impossible to know $F$).

  Under the restricted view, $F$ is a **true statement that is impossible to know**.
  For a semantic anti-realist, this is catastrophic. It reintroduces the very gap between truth and evidence that anti-realism was designed to close. The professor argues this restriction is "independently motivated" by semantics, but the semantic motivation (parasitism) explains how we *parse* $F$, not why $F$ should be allowed to float free of verification conditions.

  If the anti-realist says, "Complex truths don't need to be knowable," they have abandoned the core verificationist insight that *truth is epistemic*. They have saved the formal system from contradiction only by sacrificing the philosophical motivation for the system. This is the definition of *ad hoc*: modifying a theory to avoid a counterexample in a way that undermines the theory's original rationale.

  ### 3. The Arbitrary Exclusion of Epistemic Vocabulary
  The restriction required to block Fitch is not merely "KP applies only to basic sentences." It is more specifically: **"KP applies only to sentences that do not contain epistemic operators."**

  Why? Because if KP applies to *any* complex sentence built from basic truths, we can derive Fitch's result using standard logical rules (conjunction introduction, etc.). To stop the derivation, one must specifically exclude sentences like $\neg Kp$ from the scope of KP, or exclude conjunctions involving them.

  **The Gap in Motivation:**
  The "parasitism" thesis treats all logical constants equally. The meaning of $\land$, $\neg$, and $\lor$ is determined by their introduction/elimination rules. There is nothing in the anti-realist theory of meaning that singles out the epistemic operator $K$ as semantically defective or second-class.
  *   If $K$ is a legitimate part of the language, it has assertibility conditions.
  *   If it has assertibility conditions, sentences containing it have truth conditions.
  *   If anti-realism holds, those truth conditions must be epistemic (knowable).

  To say "KP does not apply to sentences containing $K$" is to say "The principle that truth implies knowability does not apply to truths about knowledge." This looks suspiciously like a technical patch designed solely to prevent the variable $p$ in the Fitch proof from being instantiated by an epistemic formula. The semantic thesis of parasitism provides no reason why epistemic vocabulary should be exempt from the general semantic theory. If meaning is use, and $K$ has a use, it should be subject to the same semantic constraints as any other operator. Excluding it is not a consequence of the semantics; it is a constraint imposed *on* the semantics to avoid paradox.

  ### 4. Failure of Closure Under Conjunction
  Standard anti-realist logics (like intuitionistic logic) generally preserve closure properties for knowability. If $A$ is knowable and $B$ is knowable, then $A \land B$ is knowable. This is because a verification for $A \land B$ is just a pair of verifications $\langle v_A, v_B \rangle$.

  The professor's restriction forces the anti-realist to deny this closure principle for a specific class of sentences.
  *   $p$ is basic $\rightarrow$ Knowable.
  *   $\neg Kp$ is (arguably) basic or complex? If it's complex, KP doesn't apply. If it's basic, KP applies.
  *   But even if both are knowable individually, the restriction says the *conjunction* $p \land \neg Kp$ is not covered by KP.

  This creates a fragmented epistemology. We have a theory where we can know $A$, we can know $B$, but we are forbidden from claiming it is possible to know $A \land B$ simply because the sentence structure is "complex." This contradicts the compositional nature of the semantics they claim to defend. If the meaning of the conjunction is *built* from the meanings of the parts, the epistemic status of the conjunction should be *built* from the epistemic status of the parts. To assert that the epistemic status collapses at the level of the conjunction is to assert a discontinuity between semantic composition and epistemic accessibility that the "parasitism" thesis does not support.

  ### Conclusion: The Verdict of Ad Hocness
  To summarize the precise location of the gap:
  The professor argues from **Semantic Compositionality** (complex meaning depends on basic meaning) to **Epistemic Restriction** (KP applies only to basic sentences).

  This inference is invalid. Compositionality dictates how truth conditions are determined; it does not dictate that the *modal guarantee* of knowability evaporates when complexity arises. In fact, if truth is constituted by verification conditions (as anti-realism claims), and verification conditions are compositional, then the guarantee of knowability should extend to complex truths.

  By restricting KP, the professor admits the existence of truths that are in principle unknowable (the Fitch conjunctions). This concedes the realist's main point against anti-realism (that truth transcends knowledge) for a specific class of sentences, solely to preserve the consistency of the formal system. Because this restriction is motivated by the need to block a paradox rather than by the positive semantic theory itself—and indeed contradicts the verificationist spirit of that theory—it must be classified as an *ad hoc* rescue rather than a principled solution.
