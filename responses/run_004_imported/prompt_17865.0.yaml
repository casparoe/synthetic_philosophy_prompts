answer: |-
  This is a fantastic observation, and you are absolutely right to flag it as one of the great ironies in the history of ideas. It is genuinely one of history's most spectacular intellectual own-goals.

  However, the reason this doesn't disqualify *Leviathan* in political science classrooms comes down to three main factors: the distinction between **methodological metaphor** vs. **mathematical practice**, the **chronology** of his madness, and the **autonomy of his political insights**.

  Here is the sanity check you're looking for.

  ### 1. "Geometrical Method" $\neq$ "Doing Geometry"
  When Hobbes says he is doing philosophy "geometrically," he isn't promising to solve for $x$ or calculate the area of a polygon. He is talking about **epistemic certainty**.

  Hobbes was obsessed with the fact that geometry was the only field where people didn't argue. If you define a triangle correctly, the sum of its angles *must* be 180 degrees. There is no room for rhetorical flourish or theological dispute. Hobbes wanted to import that **deductive structure** into politics:
  1.  Define human nature (premises).
  2.  Apply logic (deduction).
  3.  Arrive at the necessity of the Sovereign (conclusion).

  His failure to square the circle proves he was bad at **mathematics**. It does not necessarily prove he was bad at **logic**. You can construct a logically valid deductive argument about politics even if you can't calculate $\pi$. The "geometrical method" in *Leviathan* is really a **resolutivist** method (breaking concepts down to their simplest parts and building them back up), not a mathematical one.

  ### 2. The Chronology of the Hubris
  *Leviathan* was published in **1651**.
  The really nasty public feud with John Wallis (the Oxford mathematician) kicked into high gear in the **1650s and 1660s**, continuing until Hobbes's death in 1679.

  When Hobbes wrote *Leviathan*, he was riding high on the confidence of his "Euclid moment" (legend has it he stumbled upon Euclid's *Elements* in his 40s and was blown away by the certainty of it). At the time of writing, he genuinely believed he had mastered the method. The humiliating public dismantling of his mathematical competence by Wallis happened *after* the book was already out in the world and gaining traction.

  By the time Wallis was publicly proving Hobbes was a math dunce, *Leviathan* had already done its work. The political theory had detached from the author's personal credibility as a mathematician.

  ### 3. The Theory Stands on Psychology, Not Math
  Even if Hobbes's "geometrical" pretensions are shaky, *Leviathan* survives because its premises are **psychological**, not mathematical.

  When modern professors teach *Leviathan*, they rarely say, "This is true because it is geometric." They say, "This is compelling because it offers a realistic model of human behavior under stress."
  *   **The Math:** Hobbes claims $A + B = C$ with geometric necessity.
  *   **The Reality:** Hobbes claims "Fear of death + Desire for comfort = Social Contract."

  The second claim is an empirical or psychological assertion. It can be debated on its own merits (is man really that selfish? is the state of nature really that brutal?) without needing to check Hobbes's math homework. If the political insight resonates, the fact that the author couldn't square a circle becomes a biographical footnote rather than a philosophical refutation.

  ### 4. It *Did* Damage His Reputation (At the Time)
  To your point about why it's not a "headline": It actually *was* a headline in the 17th century.
  Hobbes was widely mocked by the Royal Society crowd. John Aubrey, his biographer, noted that while Hobbes was respected, his mathematical delusions made him a figure of pity and ridicule in his later years. The Royal Society (which Wallis was part of) essentially treated him as a crank.

  So, your intuition is historically correct: **His contemporaries *did* use his math failures to discredit his general intellect.**

  But history is a filter. We don't teach Hobbes because he was a good mathematician (he wasn't) or even because his "method" was perfectly consistent (it wasn't). We teach him because he invented **liberal individualism** and the modern concept of **state sovereignty**. He articulated the problem of political order in a way that still frames our debates today.

  ### The Verdict
  You have spotted a genuine hypocrisy/irony. Hobbes demanded a standard of certainty for politics that he couldn't even meet in the very science (geometry) he used as his model.

  But it doesn't discredit *Leviathan* for the same reason that Einstein's failed Unified Field Theory doesn't discredit General Relativity. You judge the work on whether its specific claims hold water, not on whether the author was infallible in every adjacent field.

  **For your piece:** The angle shouldn't be "Hobbes was a fraud because he couldn't do math." The angle is: **"Hobbes sought the certainty of math to escape the chaos of civil war, but his own obsession with that certainty led him into a chaotic, decades-long delusion."**

  That is a much richer tragedy: The man who wanted to cure political madness with reason ended his life consumed by a mathematical madness of his own.
