      *   *Timing:* *Leviathan* (1651) vs. The Squaring Controversy (peaked 1650s-1670s). The mathematical failures happened largely *after* or concurrently with the later reception of *Leviathan*, but the core philosophical method was established earlier.
      *   *Nature of the "Geometry":* Hobbes's political geometry is about human nature and logic, not spatial magnitudes. Being bad at the latter doesn't automatically invalidate the former, though it damages his credibility as a "scientific" thinker.

