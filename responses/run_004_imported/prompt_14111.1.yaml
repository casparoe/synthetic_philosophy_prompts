answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name]. I'm the best man, which is a title that usually implies you're the most responsible person in the room. But in this case, it just means I've known [Groom] the longest.

  We met years ago on an internet forum. Most friendships start over shared interests—music, sports, maybe a favorite movie. Ours started because we got into a heated argument about something called "counterfactual mugging."

  For the ninety percent of you currently checking your phones to see if that's a new crypto scam: don't worry about it. It's a thought experiment in decision theory. It asks a simple question: When you make a promise, are you making it for who you are right now, or for who you'll be when things get difficult?

  That argument turned into a friendship, and for years, [Groom] and I have been obsessed with how we make choices. We talk a lot about "updateless decision theory." It sounds incredibly dry. It sounds like math. But the more I've watched [Groom] and [Bride] together, the more I've realized it's actually the most romantic thing I can imagine.

  Here's the basic idea. In life, we usually make decisions by "updating." We get new information, and we change our minds. If it starts raining, you update your plan and take an umbrella. If a job pays better, you update your resume. We are constantly re-evaluating the deal based on the current cost and benefit.

  But you cannot run a marriage on updating.

  If you treat a relationship as a series of daily bets, re-evaluated every morning based on how you feel, how tired you are, or how annoying your partner is being... the math eventually stops working. Life hands you hard information. Illness, stress, loss, boredom. If you "update" on that data, if you re-calculate the utility of staying versus leaving in the middle of a crisis, the logical answer might be to cut your losses.

  That is why a wedding vow isn't a prediction. It's a policy.

  [Groom], you and I have spent a lot of late nights talking about this. We know that your future self is going to be different than your present self. There will be days when your future self is tired, or scared, or frustrated. And that future self might look for a loophole. That future self might say, "Well, given this new information, maybe the optimal move is to walk away."

  Updateless decision theory says: No. You don't get to update.

  A wedding vow is a pre-commitment device. It is you, today, at your clearest and most hopeful, binding your future self to a course of action when your future self might lack the courage to stick to it. It is choosing a policy of "Us" before you know what the problems will be, and refusing to change that policy even when the problems arrive.

  It's not stubbornness. It's loyalty across time.

  [Bride], watching the two of you, I see this in action. I see [Groom] making choices not because they are easy in the moment, but because they align with the policy he set when he decided to love you. He isn't betting on you every day. He's already bought in. He has removed the option to defect.

  And I know you do the same for him. That is the only reason this works. It's two people agreeing to stop calculating, and start committing.

  So, for the rationalists in the room: Here's to maximizing expected utility across a lifetime horizon.

  And for everyone else: Here's to a love that doesn't change just because the weather does. Here's to the promise that you made when you were happy, kept for the days when you might not be.

  [Groom], you've found the optimal strategy. [Bride], thank you for being the reason he never has to update.

  Please raise your glasses. To the happy couple.
