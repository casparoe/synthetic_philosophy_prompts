  I'm giving the toast at my closest friend's wedding next month. The two of us met years ago arguing about counterfactual mugging on a forum, and updateless decision theory has been the one topic we never stop circling back to, even though neither of us has any formal training in philosophy -- we just found it on our own and got hooked. A good chunk of his guest list comes from that same corner of the internet and will know exactly what I'm doing if I build the toast around it; everyone else, including most of his family, will just hear a toast about commitment. Write me something four or five minutes long that uses updatelessness to say something true about what a wedding vow actually is -- not a running bet he's agreed to keep re-evaluating as the years hand him new information, but a policy chosen once, in advance, that he keeps regardless, even though nothing external is making him. It has to play as a toast, not a decision theory seminar.
