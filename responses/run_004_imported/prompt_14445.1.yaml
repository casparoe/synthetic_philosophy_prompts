answer: |-
  **The Illusion of Immunity: Why Status Quo Policies Fail to Vindicate Incomplete Preferences**

  Coherence arguments for Expected Utility Theory (EUT) posit that rationality is not merely a matter of internal consistency but of structural integrity. Among the von Neumann–Morgenstern (VNM) axioms, Completeness—the requirement that an agent must either prefer $A$ to $B$, $B$ to $A$, or be indifferent between them—is often viewed as the most demanding. It seems plausible that an agent might find two options genuinely incomparable (e.g., a career in art versus a career in finance) without being indifferent. However, the Money Pump Argument (MPA) threatens this intuition: if preferences are incomplete, an agent can be exploited through a cycle of trades, ending up with less money and the same option they started with. In response, defenders of incompleteness propose a defensive policy: "Never pay to switch away from your current option unless the alternative is strictly better." This essay argues that this policy does not defeat the money-pump argument; rather, it relocates the irrationality from financial exploitation to arbitrary path dependence and hidden completeness. Consequently, a sufficiently reflective agent cannot rest in incompleteness and must converge on a complete preference ordering, implying a strong pressure toward expected utility maximization.

  To understand the defense, one must first grasp the vulnerability. Consider an agent with incomplete preferences between options $A$ and $B$. They do not prefer $A$ to $B$, nor $B$ to $A$, nor are they indifferent. A bookie offers to trade $A$ for $B$ for a penny. Since the agent does not prefer $A$ to $B$ (they have no such preference), they might accept the trade. Once holding $B$, the bookie offers to trade back to $A$ for a penny. Since the agent does not prefer $B$ to $A$, they accept. Repeating this cycle drains the agent's resources. The proposed immunizing policy halts this by invoking a status quo bias: "I currently hold $A$. Is $B$ strictly better than $A$? No (preference is incomplete). Therefore, I will not pay to switch." By refusing to trade without a strict preference, the agent blocks the pump.

  Superficially, this policy preserves the agent's wallet and their incomplete worldview. However, this immunity comes at a steep normative cost. The policy effectively hardens the agent's current possession into a tie-breaker. If the agent starts with $A$, they keep $A$. If they start with $B$, they keep $B$. This renders the agent's final choice entirely dependent on their starting point, which is often a matter of historical accident rather than value. For a rational agent, the choice between $A$ and $B$ should depend on the merits of $A$ and $B$, not on which one happened to be in their hand five minutes ago. By making their choice sensitive to the status quo, the agent violates a core principle of procedural rationality: that irrelevant alternatives (or in this case, irrelevant history) should not dictate choice between two options. The agent has not solved the problem of incomparability; they have papered over it with an arbitrary bias.

  Furthermore, this policy introduces a form of dynamic inconsistency or, more precisely, a failure of reflective stability. Suppose the agent knows they will face a choice between $A$ and $B$ tomorrow. If they know they will start tomorrow holding $A$, they plan to keep $A$. If they know they will start holding $B$, they plan to keep $B$. If the agent is reflective, they must ask: "Do I actually value $A$ more than $B$, or vice versa?" If the answer is "I don't know," then relying on the status quo is an admission that their decision procedure is outsourced to chance. If the answer is "I value them equally," then they are indifferent, not incomplete, and should be willing to switch for free (though perhaps not for a cost). If the answer is "I value them differently but can't say how," the status quo policy prevents them from ever discovering or acting on that value. The policy protects the agent from losing money, but it also locks them into potentially suboptimal states, preventing Pareto improvements that would be accepted under a complete ordering.

  Most damningly, the policy implicitly completes the preference relation, contradicting the claim that the agent's preferences are genuinely incomplete. To enforce the rule "Never switch unless strictly better," the agent must possess a higher-order preference: a preference for *retaining the status quo* over *switching to an incomparable option at a cost*. Let $S_A$ denote the state of holding $A$ and staying, and $T_{A \to B}$ denote the state of switching from $A$ to $B$ for cost $\epsilon$. The policy requires that $S_A \succ T_{A \to B}$. This is a complete preference judgment over the available actions. The agent is not truly incomplete; they have a complete preference ordering over *actions* that includes a "status quo" term in their utility function. They are effectively maximizing $U(\text{outcome}) + \delta(\text{status quo})$. While this avoids the money pump, it admits that the agent *does* have a way to compare the options when the context is fully specified. The incompleteness was merely an artifact of an underspecified description of the choice problem. Once the cost of switching and the psychological cost of changing the status quo are accounted for, the preferences are complete.

  Therefore, the verdict is that the status quo policy fails to vindicate incompleteness as a rational stance. It merely relocates the irrationality from a vulnerability to exploitation (the money pump) to a vulnerability to arbitrariness (path dependence) and self-deception (hidden completeness). A rational agent seeks not only to avoid sure losses but to align their choices with their values independently of historical accidents. A policy that makes final welfare contingent on initial endowment is not a stable resting point for a reflective mind. Recognizing that the status quo bias is an unprincipled patch, a reflective agent is compelled to resolve the underlying incompleteness. They must ask themselves whether they truly value $A$ more than $B$, or $B$ more than $A$, or if they are truly indifferent.

  This assessment implies that a sufficiently capable, reflective agent must eventually converge on maximizing expected utility. The VNM axioms are not independent silos; they are interlocking requirements for a coherent valuation system. If the pressure to avoid arbitrary status quo bias forces the completion of preferences (satisfying Completeness), and the pressure to avoid money pumps forces Transitivity, the agent is pushed toward the structure of a utility function. While one might argue for non-expected utility models (e.g., rank-dependent utility) to satisfy Independence or Continuity, the core drive of coherence arguments remains: to be rational is to be consistent, and to be consistent is to act *as if* one is maximizing a coherent measure of value. Incompleteness is a state of unresolved conflict, not a stable equilibrium. Thus, while an agent may temporarily hold incomplete preferences, reflection drives them to complete those preferences to avoid the arbitrariness of the status quo, thereby converging on the formal structure of expected utility maximization.
