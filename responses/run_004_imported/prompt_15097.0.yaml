  If your lecture notes emphasized that the relational objection *does* successfully save PII (some intro courses simplify it that way), you might want to give them back the 2 points on part (b). But on part (a), the confusion between PII and the Indiscernibility of Identicals is pretty standard "deductible offense" in metaphysics. Hope this helps you clear that stack!
