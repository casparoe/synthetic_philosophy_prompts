  # The Stain of Valence: Why the Knobe Effect is a Heuristic, Not a Concept

  The Joshua Knobe "Side-Effect Effect" is the fruit fly of experimental philosophy: ubiquitous,繁殖rapidly, and subjected to endless dissection. We all know the CEO case. When the CEO harms the environment to boost profits, 82% of people say he *intentionally* harmed it. When he helps the environment to boost profits, only 23% say he *intentionally* helped it. The asymmetry is robust. But as you noted, the real story isn't the CEO; it's the contagion.

  Once researchers started looking, they found this moral valence asymmetry leaking into everywhere. It determines whether we say an agent *caused* an outcome (the office pen case), whether they *knew* a consequence would occur versus merely *believed* it, whether a person is *happy*, and even whether an action expresses their *true self*. The pattern is undeniable: bad outcomes get traced back to agents more aggressively than good ones.

  The philosophical stakes turn on what this pattern means. Joshua Knobe's "Competence" view (or the "Deep View") argues that moral evaluation is constitutive of these concepts. To possess the concept of *intentionality* or *causation* just is to apply it in a way sensitive to moral norms. The alternative, the "Performance Error" or "Heuristic" view, argues that the concepts themselves are neutral, but our cognitive application of them is contaminated by a quick-and-dirty blame-validation mechanism.

  Given the sheer breadth of this generalization, one might think it bolsters Knobe's claim: if morality infects *everything*, maybe morality is the substrate of everything. I argue the opposite. The fact that moral valence distorts such structurally disparate concepts as *causation*, *knowledge*, and *happiness* is not evidence that these concepts are inherently normative. It is evidence that they are being overridden by a domain-general affective heuristic. The generalization of the Knobe Effect is better read as a debunking result: it reveals a pervasive cognitive bias, not a conceptual truth.

  ### The Case for Competence

  To understand why the Heuristic view is superior, we must first grant the Competence view its strongest footing. Knobe argues that if the asymmetry were merely a performance error (a bug in the system), it should behave like other biases. It should vanish under low cognitive load, or when subjects are prompted to be careful. Yet, the effect persists even when people are given time to reflect. Furthermore, the effect isn't random; it tracks specific normative distinctions (e.g., whether the side effect is a violation of a norm) rather than just raw "goodness" or "badness."

  Knobe's contention is that folk psychology is not a scientific theory designed to describe the world neutrally; it is a tool for social coordination. We don't track mental states to build a physics of the mind; we track them to praise and blame. Therefore, the concept of *intentional action* literally contains a slot for moral judgment. If you remove the moral valence, you aren't left with a "pure" concept of intentionality; you're left with nothing the folk actually use.

  This view is elegant because it takes the data at face value. It says: people judge this way because this is what the concept *is*.

  ### The Generalization Problem

  However, the Competence view hits a wall when we look at the *diversity* of the concepts infected by the effect. The Heuristic view predicts that a single mechanism (e.g., "Blame Validation") will stain any judgment associated with an agent. The Competence view predicts that each concept has its own normative structure.

  Consider the office pen case. An unauthorized person takes pens and the supply runs out; an authorized person takes pens and the supply runs out. People say the unauthorized person *caused* the shortage, but the authorized person did not. For the Competence view to hold here, it must claim that the folk concept of *causation* is inherently normative. This is a hard pill to swallow. Causation is typically understood as a relation between events in the world, independent of rules. To say that the *physics* of the shortage changes based on the bureaucratic status of the pen-taker implies that our metaphysical concepts are moral concepts.

  It gets worse. The effect extends to *happiness*. In studies where a person is morally wicked but reports high subjective well-being, people are reluctant to call them "happy." For the Competence view, this implies that *happiness* is a moral concept, not a psychological state. Then there is the *true self*. People tend to attribute good actions to the "true self" and bad actions to external influences or corruption.

  If we accept the Competence reading, we are forced into a radical conceptual inflation. We must accept that *causation*, *knowledge*, *happiness*, and *selfhood* are all, at their core, moral concepts. But these concepts serve vastly different functional roles. *Causation* helps us predict physical outcomes. *Knowledge* helps us track information reliability. *Happiness* tracks subjective welfare. *True Self* tracks identity continuity.

  For all of these to be *constitutively* moral, they would all need to share a unified normative logic. But they don't. The normative stakes of causation (responsibility assignment) are different from the normative stakes of happiness (evaluative well-being). If the Competence view were true, we should see the moral distortion morphing to fit the specific normative structure of each concept. Instead, we see a uniform stamp: **Bad Agent = High Attribution.**

  ### The Heuristic Explanation

  The Heuristic view explains this uniformity effortlessly. It posits that we possess neutral concepts of causation, knowledge, and happiness, but we access them through a cognitive system prioritized for social regulation. When we encounter a moral violator, a "Blame Validation" mechanism activates. Its goal is not truth-tracking in the scientific sense, but accountability-tracking.

  This mechanism works top-down. Once the system flags an agent as "Blameworthy," it biases the search for evidence to support that blame. Did he cause it? *Search for yes.* Did he know it? *Search for yes.* Is he truly happy? *Search for no (because bad people don't deserve happiness).*

  This explains the generalization without inflating the concepts themselves. It acknowledges that while my *concept* of causation is counterfactual (if he hadn't taken the pen, the shortage wouldn't have happened), my *application* of that concept is gated by a pragmatic filter: "Is it useful to hold this person causally responsible?"

  The Heuristic view is also more parsimonious regarding cognitive architecture. It requires only one mechanism (affective valuation/blame assignment) to explain distortions across five different domains. The Competence view requires five separate claims about the normative nature of five distinct concepts. When a single key opens five different locks, it is more likely that the locks are all jammed by the same piece of gum (the heuristic) than that all five locks were designed to be opened by that specific key (constitutive normativity).

  ### The Verdict

  Here is the commitment: **The generalization of the Knobe Effect is a debunking result.** It demonstrates that moral valence is a contaminant, not a constituent.

  The decisive reason for this verdict lies in the distinction between *competence* and *utility*. The Competence view conflates how we *use* a concept with what the concept *means*. We undoubtedly *use* concepts of causation and knowledge to assign blame. That does not mean the concepts *are* blame.

  If we accept Knobe's Deep View, we lose the ability to distinguish between factual error and moral disagreement. If a juror says, "The defendant caused the death," and they mean "The defendant is blameworthy for the death," we cannot correct them if they are factually wrong about the causal chain, because their claim is ultimately a moral one. The Heuristic view preserves the vital distinction between the *is* and the *ought*. It allows us to say, "You feel he caused it because he is a bad man, but physically, the cause was the faulty wiring."

  The fact that this bias extends to "happiness" and "true self" seals the deal. These are internal states. A dictator can genuinely feel joy. A corrupt politician can genuinely believe their actions express their identity. To say the folk concept of happiness *excludes* the wicked is to say the folk are operating with a false theory of psychology. It is far more charitable—and scientifically useful—to say the folk are applying a moral filter to a descriptive state.

  The Knobe Effect generalizes not because morality is the DNA of folk psychology, but because morality is the operating system's priority. When resources are scarce and social stakes are high, the brain sacrifices descriptive accuracy for normative clarity. It stains the neutral concepts with valence to ensure that blame lands where it belongs. This is a feature of our cognitive *performance*, a highly adaptive heuristic for social life. But it is not a feature of our conceptual *competence*. The concepts themselves remain descriptive; they are just rarely allowed to speak without a moral chaperone.

  We should not revise our philosophy of action to match the bias. We should identify the bias so we can correct for it. The Knobe Effect doesn't show that our concepts are moral; it shows that we are.
