answer: |-
  Welcome to the rabbit hole. It is a fascinating place, and your intuition is spot on: the pop-science summary of Bell's Theorem is often sloppy, and you have stumbled upon one of the most significant technical and philosophical disputes in the foundations of physics.

  You are asking about the logical structure of the argument, specifically the relationship between the EPR paper (1935) and Bell's Theorem (1964). The short answer is: **Tim Maudlin is logically correct.** The claim that one can save locality simply by "dropping realism" is, in his view (and the view of many philosophers of physics), a confusion of the logical steps.

  Since you come from a biology background, you are used to distinguishing between observation (phenotype) and underlying mechanism (genotype). That is a perfect mindset for this. Let's walk through the logic chain to see why Maudlin argues that "Realism" isn't an independent dial you can turn down.

  ### 1. The Pop-Science Narrative (The "Two Dial" View)
  The standard story goes like this:
  1.  Bell's Theorem proves that **Local Realism** is false.
  2.  "Local Realism" is a conjunction of two assumptions: **Locality** (no faster-than-light influence) and **Realism** (particles have definite properties before measurement).
  3.  Therefore, you can save Locality if you are willing to sacrifice Realism (the Copenhagen interpretation). Or, you can save Realism if you sacrifice Locality (Bohmian mechanics).

  This suggests "Realism" is an independent assumption we bring to the table. Maudlin argues this is wrong. He argues that **Realism is a *consequence* of Locality**, given the empirical facts of quantum entanglement.

  ### 2. Step One: The EPR Argument (1935)
  To understand Maudlin's point, we have to look at what Einstein, Podolsky, and Rosen (EPR) actually did. They didn't start by assuming "Realism." They started by assuming **Locality** and observing **Perfect Correlations**.

  Imagine an entangled pair of electrons sent to Alice and Bob. They are spacelike separated (no light signal can pass between them during the measurement).
  *   **The Fact:** Quantum Mechanics predicts (and experiment confirms) that if Alice and Bob measure spin along the *same* axis, their results will be perfectly anti-correlated. If Alice gets Up, Bob *must* get Down. 100% of the time.
  *   **The Locality Assumption:** Alice's measurement cannot physically disturb Bob's particle because they are too far apart for light to travel between them.
  *   **The Inference:** If Alice measures Up, she knows with certainty that Bob will measure Down. Since her measurement didn't *cause* Bob's particle to be Down (due to Locality), Bob's particle must have *already been* disposed to yield Down before Alice measured anything.

  EPR called this an "Element of Reality." In modern terms, we call this a **Hidden Variable**.

  **Crucial Point:** EPR did not *assume* hidden variables. They **derived** them from Locality + Perfect Correlations.
  *   *Logic:* If Locality is True + Perfect Correlations are True $\rightarrow$ Hidden Variables (Realism) must be True.

  ### 3. Step Two: Bell's Theorem (1964)
  Bell came along 30 years later. He asked: "Okay, let's grant EPR's conclusion. Let's assume these Hidden Variables exist."

  He then looked at measurements where Alice and Bob choose *different* axes (not just the same one). He calculated the statistical limits of any theory that relies on pre-existing local hidden variables. This produced **Bell's Inequality**.

  *   **The Result:** Quantum Mechanics predicts violations of this inequality. Experiments confirm these violations.
  *   **The Logic:** Hidden Variables + Locality $\rightarrow$ Bell Inequality Holds.
  *   **The Reality:** Bell Inequality Fails.
  *   **The Conclusion:** You cannot have both Hidden Variables and Locality.

  ### 4. Maudlin's Critique: The "Dodge"
  Now we combine Step 1 and Step 2. This is where the pop-science narrative falls apart.

  **The Pop-Science View:**
  Bell proved $\neg$(Locality $\land$ Realism). So I can choose $\neg$Realism and keep Locality.

  **Maudlin's View:**
  Wait a minute. Look at Step 1 (EPR).
  If you keep **Locality**, EPR forces **Realism** upon you (via perfect correlations).
  So, you cannot logically keep Locality and drop Realism.
  *   If you drop Realism, you are implicitly admitting that Alice's measurement *does* determine Bob's outcome (otherwise, how do you explain the perfect correlation without pre-existing values?).
  *   But if Alice's measurement determines Bob's outcome across a spacelike separation, that is **Non-Locality**.

  Therefore, Maudlin argues the logic chain is actually:
  1.  **QM Predictions** (Perfect Correlations) are True.
  2.  Assume **Locality**.
  3.  (Via EPR) $\rightarrow$ **Hidden Variables** must exist.
  4.  (Via Bell) $\rightarrow$ **Hidden Variables + Locality** contradicts QM predictions (at other angles).
  5.  **Contradiction.**

  Since the QM predictions are empirically verified, the assumption that started the chain (**Locality**) must be the one that is false.

  Maudlin's contention is that "Realism" is not an independent assumption. It is a *deduction* from Locality. Therefore, you cannot "give up realism to save locality." If you give up realism (pre-existing values), you are admitting that the measurement outcome at A creates the reality at B instantaneously. That *is* non-locality.

  ### 5. Why do people still say "Local Realism"?
  If Maudlin is right, why does the "Two Dial" view persist? There are two main reasons, one sociological and one technical.

  **1. The Copenhagen "Out":**
  Proponents of standard Copenhagen QM reject the EPR inference rule (the "Criterion of Reality"). They say: *"It is meaningless to talk about the spin of Bob's particle before Bob measures it. The property does not exist until the measurement context is established."*
  They argue this isn't non-local "action at a distance," but rather a holistic description of the system. However, Maudlin (and others like David Albert and Wayne Myrvold) counter that if the physical state of Bob's particle changes depending on what Alice chooses to measure (even if no signal is sent), that satisfies the definition of a non-local influence, regardless of whether you call it "collapsing a wavefunction" or "updating information."

  **2. Ambiguity of "Realism":**
  In philosophy, "Realism" is a messy term. Sometimes it means "macroscopic objects exist." Sometimes it means "counterfactual definiteness" (unmeasured properties have values). Pop-science writers often conflate these. When they say "drop realism," they usually mean "drop counterfactual definiteness." But as Maudlin points out, dropping counterfactual definiteness in an entangled system *just is* accepting non-locality.

  ### 6. The Verdict for a Retired Biologist
  You asked if giving up realism genuinely saves locality, or if it's a dodge.

  Based on the rigorous logical analysis provided by Maudlin, Norsen, and others in the foundations community: **It is a dodge.**

  Here is the cleanest way to state the theorem, stripping away the word "Realism" entirely:
  1.  **Assumption:** The world is Local (what happens here doesn't instantly affect things over there).
  2.  **Observation:** Entangled particles show perfect correlations.
  3.  **Inference:** To explain perfect correlations without instantaneous influence, the particles must carry identical instructions (Hidden Variables).
  4.  **Test:** If particles carry identical instructions, they must obey Bell's Inequality.
  5.  **Result:** They violate Bell's Inequality.
  6.  **Conclusion:** The particles do *not* carry identical instructions.
  7.  **Final Deduction:** Since they don't carry instructions, but still show perfect correlations, the measurement on one *must* influence the other. **Nature is Non-Local.**

  **Summary:**
  You are right to be suspicious. The "Local Realism" phrasing allows people to think they can keep a relativistic, local universe by adopting an anti-realist philosophy (like QBism or Copenhagen). Maudlin's argument shows that this is inconsistent. If you want to maintain that there is no faster-than-light influence, you are forced into a hidden-variable theory (like Bohmian mechanics), which Bell forbids. If you accept Bell's result, you must accept that nature allows for some form of non-local connection.

  As a biologist, you might appreciate this analogy: It's as if someone claimed they could explain the synchronization of two heart cells by saying "they don't have internal pacemakers (no realism)," while simultaneously insisting "there is no electrical signal between them (locality)." If they sync perfectly without a signal, something non-local is happening, regardless of whether you think the "beat" existed before it happened.

  Maudlin's book *Quantum Non-Locality and Relativity* is the gold standard for this argument. If you are enjoying the deep dive, it is well worth your time.
