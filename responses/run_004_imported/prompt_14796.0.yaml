      *   *Point 3: Empirical Disconfirmation.* Kepler claims tradition ignores failed predictions. But his own theory relies on the same data (weather, historical events) which is notoriously noisy. He interprets failures as "other configurations interfering," just like traditional astrologers did.
      *   *The Sympathetic Reply:* The Constructibility Criterion. It's not arbitrary; it's based on Euclidean necessity. It limits the aspects objectively.
