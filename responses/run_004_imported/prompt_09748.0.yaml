      *   *Miller-Tichý Theorem:* Yes, in 1974, David Miller and Pavel Tichý independently demonstrated that Popper's quantitative definition of verisimilitude fails. Specifically, under Popper's definition, if Theory A and Theory B are both false, A cannot be said to be closer to the truth than B. (Actually, the technical result is slightly more nuanced: for false theories, truth content and falsity content correlate in such a way that the difference doesn't yield the intended ordering).
