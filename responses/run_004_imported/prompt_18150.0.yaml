      *   **Kelly Criterion:** Optimal bet sizing to maximize logarithmic utility (geometric growth rate).
      *   **Utility Theory:** Linear utility (money) vs. Log utility (growth rate). For a repeated bet, log utility is the rational choice to avoid ruin.
      *   **Gambler's Ruin:** Going "all-in" on a negative geometric drift guarantees eventual ruin.

  4.  **Drafting the Response (Iterative Process):**

