answer: |-
  You are absolutely right to be bugged, and your simulation is telling the truth. Your son-in-law is committing a classic error that sits right at the intersection of probability theory, statistical physics, and economics.

  As a physicist, you will appreciate the core issue immediately: **He is confusing the ensemble average with the time average.** He is assuming the system is ergodic, but it is not.

  Here is the breakdown of why his reasoning is mathematically flawed, why your simulation is correct, and the specific concepts you can use to explain it to him.

  ### 1. The Math: Arithmetic vs. Geometric Mean
  Your son-in-law is calculating the **arithmetic mean** of the return multiplier per trade:
  $$E[M] = 0.5(1.5) + 0.5(0.6) = 1.05$$
  He assumes that wealth grows linearly with this expectation. If you had 1,000 different people making *one* trade each, the average wealth of the group would indeed grow by 5%.

  However, trading is a **multiplicative process**. You are reinvesting your capital. Over $N$ trades, your wealth $W_N$ is:
  $$W_N = W_0 \cdot M_1 \cdot M_2 \cdot ... \cdot M_N$$
  To find the typical growth rate of a single trajectory over time, you need the **geometric mean**, not the arithmetic mean. The geometric mean $G$ is:
  $$G = \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.9487$$
  This is the killer. While the *average* outcome across many parallel universes (the ensemble) is positive, the *typical* outcome for a single person through time is a loss of roughly 5.1% per trade.

  After 100 trades, the "typical" trader (the median path) ends up with:
  $$W_{100} \approx W_0 \cdot (0.9487)^{100} \approx W_0 \cdot 0.005$$
  They lose 99.5% of their money. Your simulation confirmed this. The massive ensemble average ($130\times$) is driven entirely by an exponentially small fraction of paths that get incredibly lucky strings of wins. Those paths pull the mean up, but they are not accessible to a single trader in a single lifetime.

  ### 2. The Physics: Ergodicity Breaking
  In statistical mechanics, a system is **ergodic** if the time average of a single system's property equals the ensemble average of many systems at one instant.
  *   **Ensemble Average:** What happens to 1,000 clones of your son-in-law simultaneously. (Result: They get rich on average).
  *   **Time Average:** What happens to one person trading sequentially over time. (Result: They go broke).

  Because wealth cannot be shared between the "clones" (the lucky winners don't bail out the losers), the system is **non-ergodic**. Your son-in-law is applying ensemble statistics to a time-dependent trajectory. This is a category error. In physics terms, he is assuming the phase space is explored uniformly, but the multiplicative nature of the dynamics creates a "absorbing state" near zero that traps the trajectory.

  This specific argument has been championed recently by physicist Ole Peters at the London Mathematical Laboratory, who frames it exactly as you experienced: **Ergodicity Economics.**

  ### 3. Volatility Drag (Variance Drain)
  There is a second way to see this, which might appeal to your intuition about noise. Even if the arithmetic expected return were higher, volatility kills compounded returns.

  The relationship between arithmetic return ($\mu_a$), geometric return ($\mu_g$), and variance ($\sigma^2$) for small returns is approximately:
  $$\mu_g \approx \mu_a - \frac{\sigma^2}{2}$$
  In his case, the variance is huge. The "drag" caused by the volatility ($\frac{\sigma^2}{2}$) is larger than the arithmetic edge. By going "all-in," he is maximizing variance, which maximizes the drag, turning a positive arithmetic expectation into a negative geometric reality.

  ### 4. The Rational Solution: The Kelly Criterion
  If he wants to be truly rational (maximizing the long-term growth rate of his wealth), he should not go all-in. He should use the **Kelly Criterion**, which maximizes the expected value of the logarithm of wealth (which is equivalent to maximizing the geometric mean).

  Let $f$ be the fraction of his bankroll he bets. We want to maximize the expected log growth:
  $$E[\ln(G)] = 0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$$
  Taking the derivative with respect to $f$ and setting it to zero yields the optimal fraction $f^*$:
  $$f^* = 0.25$$
  He should be betting **25%** of his stake per trade, not 100%.
  *   At $f=1.0$ (All-in): Geometric return is $\sqrt{0.9} < 1$ (Ruin).
  *   At $f=0.25$ (Kelly): Geometric return is $> 1$ (Growth).

  ### 5. The Philosophical "Rationality" Trap
  His claim that he is being "rational" relies on a specific definition of utility.
  *   **Linear Utility:** If he cares only about the *average dollar value* across all possible realities, he is right. But this is only useful if he can access the wealth of his parallel selves (which he can't).
  *   **Log Utility:** If he cares about the wealth he actually experiences in *this* reality over time, linear utility is irrational.

  Furthermore, there is the issue of **ruin**. In the real world, "losing 99%" is functionally identical to zero. You cannot trade if you have no capital. An all-in strategy on a negative geometric drift guarantees eventual ruin with probability 1 as $N \to \infty$. A rational agent who wishes to continue trading must avoid strategies with a negative geometric drift.

  ### Summary for Dinner Conversation
  You can tell him:
  1.  **You're mixing up averages:** You are using the ensemble average (many people, one trade) for a time-series problem (one person, many trades). The system isn't ergodic.
  2.  **Compounding is geometric:** A 50% gain followed by a 40% loss leaves you down 10% ($1.5 \times 0.6 = 0.9$). Since you'll see roughly equal numbers of each, you decay by 10% every two trades.
  3.  **Kelly Criterion:** Math proves you maximize growth by betting 25%, not 100%. Going all-in is mathematically guaranteed to wipe you out in the long run, regardless of the positive expected value per trade.

  Your intuition was spot on. The "bug" you felt was the sound of ergodicity breaking.
