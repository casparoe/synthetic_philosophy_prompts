      *   **The Son-in-Law (SIL):** Crypto trader. Uses a specific heuristic: "50% chance to gain 50%, 50% chance to lose 40%." Calculates arithmetic expected value (EV) per trade as $1.05$. Concludes that going "all-in" every time is rational because EV > 1.
      *   **The Simulation:** 1000 paths, 100 trades.
          *   *Ensemble Average:* ~130x starting stake (matches $1.05^{100} \approx 131.5$).
          *   *Individual Outcomes:* >50% lose >99% of money.
          *   *Distribution:* Highly skewed (a few huge winners prop up the mean).
      *   **The Conflict:** SIL says EV is king. User suspects ruin risk or a flaw in the reasoning.
      *   **The Core Concept:** This is a classic problem of **Ergodicity Breaking** and the difference between **Ensemble Average** vs. **Time Average**. It's also a textbook case for the **Kelly Criterion**.

  2.  **Deconstruct the Math:**
      *   Trade Multiplier: $M$.
      *   $P(M=1.5) = 0.5$
      *   $P(M=0.6) = 0.5$
      *   Arithmetic Mean (per trade): $E[M] = 0.5(1.5) + 0.5(0.6) = 0.75 + 0.3 = 1.05$.
      *   After $N$ trades, Ensemble Expectation: $E[W_N] = W_0 \cdot (E[M])^N = W_0 \cdot 1.05^{100} \approx 131.5 W_0$.
      *   *However*, wealth compounds multiplicatively.
