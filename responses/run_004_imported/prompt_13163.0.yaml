answer: |-
  You win the argument. Or, at least, you win the nuance.

  Your friend is right that Hobbes was objectively wrong about the math (squaring the circle is impossible, as was proven definitively later, and Wallis was correct that Hobbes's specific calculations were garbage). Your friend is also right that Hobbes had a massive ego.

  However, your intuition from that early modern philosophy class is spot on: reducing the feud to simple vanity misses the philosophical engine driving the car. Hobbes wasn't just stubborn; he was operating under a fundamentally different epistemology of what mathematics *is*. To Hobbes, Wallis wasn't just correcting a calculation error; he was practicing a kind of "empty" science that Hobbes believed was philosophically incoherent.

  Here is the breakdown of Hobbes's distinctive conception of geometry, how it ties into *Leviathan*, and why it made him immovable against Wallis.

  ### 1. Static Axioms vs. Kinematic Generation
  The core disagreement lies in the ontology of geometric objects.

  **The Standard View (Wallis/Euclid):**
  In the standard Euclidean tradition (which Wallis defended and expanded with emerging algebraic techniques), geometric objects are defined by their properties. A circle is the set of all points equidistant from a center. A proof is a logical deduction from axioms. The truth of the proposition relies on the validity of the logical chain. The objects are essentially static; it doesn't matter *how* a circle comes to exist, only that it conforms to the definition.

  **Hobbes's View (Materialist/Kinematic):**
  Hobbes was a thoroughgoing materialist. For him, "substance" is always "body." There are no abstract forms floating in a Platonic heaven. Therefore, a geometric figure cannot just be a static definition; it must be conceivable as a body in motion.
  *   **Generation:** For Hobbes, you cannot understand a line unless you conceive of a point *moving*. You cannot understand a circle unless you conceive of a line rotating around a fixed point.
  *   **Causality:** Hobbes believed that to have *scientia* (scientific knowledge) of a thing, you must know its **cause**. In geometry, the "cause" of a figure's properties is the motion that generated it.
  *   **The Proof:** A valid demonstration, for Hobbes, must show the *generation* of the magnitude. If you derive a conclusion from axioms without showing the causal motion that necessitates it, you aren't doing philosophy/science; you're just playing a language game.

  So, when Wallis showed Hobbes an algebraic refutation, Hobbes likely saw it as symbolic manipulation without causal grounding. When Hobbes offered his "proof," he believed he was showing the *physical necessity* of the construction, whereas Wallis saw arithmetic errors.

  ### 2. The Connection to Civil Philosophy (*Leviathan*)
  You suspected this wasn't a coincidence, and you are correct. Hobbes's entire philosophical system is built on the method of *Resolutio-Compositio* (resolution and composition), which he explicitly models on geometry.

  *   **The Method:** To understand a complex thing (like a State), you must resolve it into its first principles (human nature, motion, passion) and then compose it back up to see how the complex thing is generated.
  *   **The State as Artifact:** Just as a circle is generated by the motion of a compass, the Commonwealth is generated by the "motion" of human covenants. It is an artificial body created by human design.
  *   **Certainty:** Hobbes was obsessed with certainty. He lived through the English Civil War, which he viewed as a disease caused by confused definitions and bad reasoning. He believed that if political philosophy could be as certain as geometry, civil war could be prevented.

  **The Stakes:**
  If Hobbes admitted that his geometry was flawed, he wasn't just admitting he was bad at math. He was admitting that his **method** for deriving certainty was broken. If he couldn't generate certainty in the simple world of figures (where the causes are under our control), how could he claim to generate certainty in the complex world of politics?

  For Hobbes, the geometry *had* to work, because it was the foundational brick of his entire system for saving England from chaos. Admitting Wallis was right threatened to collapse the epistemological foundation of *Leviathan*.

  ### 3. Ego vs. Principle: Settling the Bet
  So, is your friend right that it was just vanity, or are you right that it was philosophy? The historical consensus (from scholars like Noel Malcolm, Tom Sorell, and others who have dug into the Hobbes-Wallis papers) is that it is a feedback loop of both.

  **Why your friend is partially right:**
  Hobbes was notoriously thin-skinned. He viewed Wallis not just as a critic, but as an enemy. Wallis was a Presbyterian and had Parliamentarian sympathies; Hobbes was a Royalist atheist (in the eyes of his critics). The feud was partly a proxy war between Oxford (Wallis's base) and the Court (Hobbes's hope). Hobbes's refusal to acknowledge even trivial arithmetic errors does suggest a psychological inability to concede defeat.

  **Why you are right (The "Philosophical Stubbornness"):**
  Hobbes genuinely believed that the mathematical community had lost the plot. He thought the rise of symbolic algebra (which Wallis championed) was a retreat from true understanding into mysticism and "witchcraft" (Hobbes actually used terms like this regarding university math).
  *   Hobbes thought he was defending **Materialism** against **Mysticism**.
  *   He believed that unless you could trace a magnitude back to a bodily motion, you were dealing with "insignificant speech."

  He didn't back down because, in his mind, Wallis was proving theorems about nothing, while Hobbes was proving theorems about *bodies in motion*. Even if Hobbes's arithmetic was wrong, his *philosophical critique* of Wallis's method was consistent with his life's work.

  ### The Verdict
  Tell your friend this: **Hobbes was mathematically incompetent, but philosophically consistent.**

  If it were just ego, he might have eventually quieted down to save face. The fact that he kept publishing for *twenty-five years* suggests he genuinely believed he was fighting for the correct definition of Science itself. He couldn't accept Wallis's refutation because accepting it would require accepting a version of mathematics (abstract, axiomatic, symbolic) that was incompatible with his materialism.

  You win the nuance prize. Hobbes wasn't just a vain old man shouting about circles; he was a vain old man shouting about circles because he thought the circles held up the sky of his political theory.
