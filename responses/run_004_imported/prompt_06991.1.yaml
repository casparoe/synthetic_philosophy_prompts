      *   *Analogy:* Use an analogy. "I know I locked the door." If someone says "I saw it open," do you ignore them? No, you check. Why? Because your "knowledge" is based on memory, which is fallible.
      *   *The "Motte and Bailey" of Knowledge:* She's using the strong definition of knowledge to block inquiry, but operating on the weak definition of belief.

  7.  **Final Polish:**
