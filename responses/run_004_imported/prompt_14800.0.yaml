answer: |-
  **MEMORANDUM**

  **TO:** Research Methods and Data Integrity Committee
  **FROM:** [Your Name], Faculty Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of Proposal Regarding Optional Stopping and Bayes Factors in Graduate Theses

  ### Executive Summary

  This memo evaluates the proposal submitted by Dr. [Name] and Dr. [Name] to permit graduate students to utilize optional stopping designs in thesis research, provided they report Bayes Factors (BF) with preregistered priors rather than frequentist p-values. The proposal aims to reduce recruitment costs and increase efficiency.

  While the theoretical argument for optional stopping under Bayesian frameworks is mathematically coherent, adopting this policy without strict safeguards poses significant risks to departmental data integrity, particularly given our recent history with replication failures. This memo outlines the statistical nuances of the disagreement, assesses the practical risks, and recommends **conditional approval** contingent on rigorous calibration and transparency requirements.

  ### 1. The Core Statistical Disagreement

  To vote responsibly, we must distinguish between the *theoretical interpretation* of evidence and the *operational behavior* of statistical metrics.

  **The Frequentist Concern (The Status Quo)**
  Under the Null Hypothesis Significance Testing (NHST) framework, the p-value is calculated based on the sampling distribution of the test statistic. This distribution depends heavily on the "stopping rule" (i.e., when data collection ends). If a researcher peeks at data and stops only when $p < .05$, they inflate the Type I error rate (false positives). The math assumes a fixed sample size; violating this assumption renders the p-value meaningless. Our current policy prevents this to protect against the "p-hacking" that contributed to the replication crisis.

  **The Bayesian Argument (The Proposal)**
  The proposing faculty rely on the **Likelihood Principle**. This principle states that all evidence contained in the data regarding the hypotheses is represented by the likelihood function. Crucially, the Likelihood Principle asserts that the stopping rule is irrelevant to the *evidential meaning* of the data.
  *   **The Claim:** A Bayes Factor compares the likelihood of the data under the alternative hypothesis ($H_1$) versus the null ($H_0$). Because this ratio depends only on the data collected, not on the intent of the collector or when they decided to stop, one can theoretically collect data until the BF reaches a desired threshold (e.g., $BF_{10} > 10$) without biasing the evidence.
  *   **The Appeal:** This allows for efficient data collection. If an effect is strong, you stop early (saving money). If it is weak, you collect more or stop for futility.

  **The Asymmetry**
  My initial resistance mirrored the committee's concern: that this is simply "p-hacking with extra steps." However, the Bayesian argument is not mathematically wrong *in theory*. The asymmetry lies in what the metrics measure:
  *   **P-values** measure the probability of the data (or more extreme) assuming $H_0$ is true, *conditioned on the sampling plan*.
  *   **Bayes Factors** measure the relative predictive performance of two models, *conditioned only on the observed data*.

  Therefore, under strict Bayesian philosophy, optional stopping does not invalidate the BF interpretation.

  ### 2. Risk Assessment: Why Theory $\neq$ Policy

  While the proposing faculty are correct that the *interpretation* of the BF remains coherent under optional stopping, there are three practical reasons why adopting this as departmental policy for graduate students is risky.

  **A. Calibration and False Discovery Rates**
  While the Likelihood Principle holds, the *calibration* of Bayes Factors under optional stopping is not immune to bias. Simulation studies (e.g., Rouder, 2014; Hendriksen et al., 2022) show that while BFs are more robust to optional stopping than p-values, they are not immune. If a researcher stops exclusively when evidence favors $H_1$, the rate of "misleading evidence" can still exceed nominal expectations, depending on the prior specification. In a department recovering from replication issues, we cannot assume "more robust than p-values" equals "safe."

  **B. The "BF-Hacking" Risk**
  The proposal cites cost-saving as a primary motivator. This creates a conflict of interest. If a student is incentivized to stop early to save money or time, they may unconsciously or consciously manipulate the analysis to reach a threshold.
  *   Unlike p-values, where the alpha is fixed at .05, BFs depend on the **prior distribution**.
  *   A student could theoretically test multiple priors until the BF crosses the threshold, or set a stopping threshold that is too lenient (e.g., $BF > 3$ instead of $BF > 10$).
  *   Without extreme vigilance, optional stopping + flexible priors = a new avenue for researcher degrees of freedom.

  **C. Training and Dichotomization**
  Graduate students are still learning to interpret statistics. There is a documented tendency to treat Bayes Factors as "Bayesian p-values" (i.e., treating $BF > 3$ as a binary "significance" threshold). Combining this dichotomous thinking with optional stopping encourages students to view data collection as a hunt for a threshold rather than an estimation of effect sizes, which undermines the very benefit Bayesian statistics are meant to provide.

  ### 3. Recommendation

  I recommend that the committee **APPROVE the proposal with strict conditions.**

  Banning the method outright ignores valid methodological advances and penalizes students who wish to use efficient designs. However, approving it without guardrails ignores our duty to ensure replicability. We must treat optional stopping not as a "free pass," but as a complex design feature that requires validation.

  **Proposed Conditions for Approval:**

  1.  **Preregistration of Stopping Rules:** Students must preregister not only their priors and hypotheses but the **exact stopping rule**. (e.g., "Collect data in batches of 20. Stop if $BF_{10} > 10$ or $BF_{01} > 10$. Max N = 200."). Post-hoc justification for stopping will not be accepted.
  2.  **Prior Sensitivity Analysis:** To prevent "prior hacking," students must demonstrate that their conclusion holds across a range of reasonable prior specifications (e.g., wide vs. narrow priors). If the BF crosses the threshold only under a specific, optimistic prior, the evidence is insufficient.
  3.  **Calibration Simulation:** As part of the thesis proposal, the student must submit a simulation (R/Python code) showing the operating characteristics of their specific design. They must demonstrate via simulation that under the null hypothesis, their specific optional stopping rule does not generate misleading evidence at a rate higher than the department deems acceptable.
  4.  **Emphasis on Estimation:** Theses utilizing this method must prioritize posterior distribution estimation and credible intervals over binary BF thresholds. The BF should be used for monitoring, not as the sole metric of success.

  ### Conclusion

  The argument my colleague made over dinner—and the one in this proposal—is theoretically sound regarding the Likelihood Principle. However, policy must account for human behavior and training limitations, not just mathematical ideals. By allowing optional stopping only when accompanied by transparency, simulation, and sensitivity analysis, we can embrace methodological innovation without reopening the door to the questionable practices that harmed our field's credibility.

  I move we adopt the proposal contingent on the four safeguards listed above.
