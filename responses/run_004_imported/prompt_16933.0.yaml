prompt: |-
  I'm taking a seminar this term called "Political Obligation and Civil Disobedience," and after a few weeks on Rawls's account of when civil disobedience can be justified, we've moved back to the more basic question of whether ordinary citizens have any general obligation to obey the law at all. This week's readings were A. John Simmons's survey and rejection of the standard justifications for political obligation—consent, gratitude, fair play, and natural duty—together with Robert Paul Wolff's In Defense of Anarchism. Simmons works through each theory in turn and argues, I thought fairly persuasively, that none of them succeeds in grounding a general duty to obey the law even for citizens of a reasonably just, democratic state; Wolff reaches a similar anarchist conclusion by a different route, from an argument about moral autonomy.

  My study group got stuck on something afterward that I now have to write a short response paper on, and I haven't been able to resolve it on my own. If the best attempts to justify a general obligation to obey the law really do all fail, it seems to follow that "philosophical anarchism" is correct, and that in turn seems to mean no citizen of any actual state is ever genuinely bound to obey its laws. So shouldn't we conclude that a person is morally free to break any law she judges sufficiently unwise or inconvenient for herself, given that, by Simmons's and Wolff's own arguments, she was never under a real obligation to follow it in the first place? A couple of people in the group objected that this is a much stronger claim than the "philosophical anarchism" that Simmons and Wolff actually defend, but no one could quite explain why the inference should fail once their premises are granted. Could you help me work out where, if anywhere, this reasoning goes wrong, and what someone like Simmons would actually say about how a citizen is entitled to act, given his own conclusions about the state's authority?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a student in a political philosophy seminar ("Political Obligation and Civil Disobedience").
      *   **Current Topic:** They've moved from Rawls (civil disobedience) to the foundation of political obligation (Simmons & Wolff).
      *   **The Problem:** The study group is stuck on an inference.
          *   *Premise 1:* Simmons and Wolff argue that standard justifications for political obligation fail (no general duty to obey the law).
          *   *Premise 2:* Therefore, "philosophical anarchism" is correct (states lack legitimate authority over subjects).
          *   *Inference:* Therefore, citizens are morally free to break *any* law they judge unwise or inconvenient.
          *   *Confusion:* Some group members think this inference is too strong, but can't explain why. The user needs to know where the reasoning goes wrong and what Simmons/Wolff would actually say about action-guidance.
      *   **Task:** Explain the gap in the reasoning (the distinction between *obligation* and *prudence/morality*) and articulate the philosophical anarchist's position on how to act.

  2.  **Deconstruct the Logical Gap:**
      *   The core confusion is equating "no *political* obligation to obey the law *qua* law" with "no *moral* reasons to obey the law."
      *   *Political Obligation:* A duty to obey *because it is the law* (issued by a legitimate authority).
      *   *Moral/Prudential Reasons:* Reasons to obey based on the content of the law (e.g., don't murder because it's wrong, not just because it's illegal) or consequences (e.g., don't speed because you might crash or get a ticket).
      *   *The Inference Error:* Just because the *source* of the command (the State) doesn't generate a binding duty, it doesn't mean the *content* of the command lacks moral weight.
      *   *Analogy:* A friend tells me not to drink and drive. They have no authority over me. I have no obligation to obey *them*. But I still have a moral/prudential reason not to drink and drive.

  3.  **Address Simmons's Specific Position (Philosophical Anarchism):**
      *   Simmons distinguishes between *political obligation* (binding duty to the state) and *moral reasons* to comply.
      *   He argues for "particularity": Obligations must be tied to specific relationships. Since most haven't consented, no general obligation exists.
      *   However, he is not a *revolutionary* anarchist. He doesn't say "burn it all down." He says we treat laws as *advisory* or weigh them alongside other moral reasons.
      *   Key concept: The law provides *content-independent reasons* only if legitimate. If illegitimate, the law is just a coercive threat + potentially good advice.

  4.  **Address Wolff's Specific Position (Autonomy):**
      *   Wolff's argument is Kantian. Moral autonomy requires acting on reasons one accepts for oneself.
      *   Submitting to authority *per se* violates autonomy.
      *   However, an autonomous agent can still *choose* to do what the law says if their own reasoning aligns with it.
      *   The difference is *why* they do it. Not "because the State said so," but "because it is right."

  5.  **Drafting the Response - Structure:**
      *   **Acknowledge and Validate:** Confirm that this is a classic and very sharp question in the literature. It shows they are engaging deeply.
      *   **Identify the Core Mistake:** The conflation of "obligation to obey the law *as law*" vs. "reasons to do what the law requires."
      *   **Explain the Distinction:**
          *   *Political Obligation:* Content-independent, source-based.
          *   *Moral/Prudential Reasons:* Content-dependent, consequence-based.
      *   **Simmons's View:** Explain "Philosophical Anarchism" vs. "Revolutionary Anarchism." The state is illegitimate, but not necessarily evil. Laws often overlap with morality.
      *   **Wolff's View:** Autonomy doesn't mean doing whatever you want; it means acting on your own judgment. Sometimes your judgment aligns with the law.
      *   **The "Inconvenient/Unwise" Test:** Address the specific claim about breaking laws deemed "unwise." Even without obligation, prudence (jail) and morality (harm) still apply.
      *   **Conclusion:** Summarize the takeaway for the response paper.

  6.  **Refining the Content (Self-Correction/Nuance):**
      *   *Caution:* Don't get too bogged down in the specific theories of consent vs. fair play. Focus on the *implication* of their failure.
      *   *Clarification:* Make sure to distinguish between *justified* disobedience and *permissible* disobedience. Philosophical anarchism makes disobedience *permissible* (not a violation of duty to the state), but not necessarily *morally optimal*.
      *   *Tone:* Academic but accessible. Use the terminology they know (Simmons, Wolff, Political Obligation).
      *   *Key Phrase:* "Content-independent reasons." This is crucial for distinguishing legal authority from moral advice.

  7.  **Final Polish:** Check against the prompt.
      *   Did I explain where the reasoning goes wrong? Yes (the gap between authority and reasons).
      *   Did I say what Simmons would say? Yes (weighing moral reasons).
      *   Did I address the "unwise/inconvenient" point? Yes (prudential constraints).

  8.  *(Mental Check)*: Is there a risk of oversimplifying Simmons? Simmons does argue that the lack of obligation means the state is illegitimate. But he emphasizes that this doesn't mean we should ignore the law. It just means we obey for *other* reasons. I need to make sure I don't imply the law has *no* force. It has coercive force, just not *moral authority*.

  9.  *(Mental Check)*: Wolff. Wolff is more radical regarding autonomy. He suggests a consensus democracy might reconcile authority and autonomy, but in the meantime, the anarchist must judge every case. I should mention the "case-by-case" judgment.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is an excellent question, and it cuts right to the heart of what "philosophical anarchism" actually entails. It is a very common confusion for students encountering Simmons and Wolff for the first time, so your study group is in good company. The inference you described—that no political obligation equals a moral free-for-all—is precisely the objection most critics level against philosophical anarchism, but it relies on a category mistake regarding the nature of obligations and reasons.

  Here is a breakdown of where the reasoning goes wrong and how you can frame this for your response paper.

  ### 1. The Core Distinction: Obligation *vs.* Reasons
  The logical gap in your group's inference lies in conflating **political obligation** with **moral or prudential reasons for action.**

  *   **Political Obligation:** This is a specific kind of duty. It is a *content-independent* reason to obey. It means you should do $X$ simply because the State commanded $X$, regardless of whether $X$ is good, bad, wise, or unwise. If political obligation exists, the fact that a rule is "the law" creates a moral bond to follow it.
  *   **Moral/Prudential Reasons:** These are *content-dependent*. You should do $X$ because $X$ prevents harm, promotes welfare, or avoids punishment.

  **Where the inference fails:**
  Simmons and Wolff argue that the State lacks **authority**. They deny that the mere fact "this is the law" generates a moral duty. However, they do *not* deny that the *content* of the law often aligns with independent moral duties or prudential necessities.

  **The Analogy:**
  Imagine a random person on the street yells at you, "Don't punch that stranger!"
  *   **Authority:** That person has no authority over you. You have no *obligation* to obey them simply because they spoke.
  *   **Reasons:** However, you still have a massive *moral reason* not to punch the stranger (it hurts them, it's wrong) and a *prudential reason* (you might get arrested).

  If you conclude, "Since that person has no authority over me, I am morally free to punch the stranger," you have confused the lack of *authority* with the lack of *moral constraints*. Simmons and Wolff argue the State is like the stranger on the street: it lacks legitimate authority, but its commands often overlap with what morality or prudence requires anyway.

  ### 2. What Simmons Actually Argues
  A. John Simmons is careful to distinguish **Philosophical Anarchism** from **Revolutionary Anarchism**.

  *   **Revolutionary Anarchism:** The state is illegitimate and therefore must be abolished; citizens should actively resist or ignore it.
  *   **Philosophical Anarchism (Simmons's view):** The state is illegitimate (it lacks authority over us), but it may still be useful, necessary, or largely benign.

  Simmons argues that while we have no *general* duty to obey the law *qua* law, we still have particular moral duties that often coincide with the law.
  *   **Natural Duties:** We have a duty not to harm others. The law says "do not murder." We should obey this law, not because it is the law, but because we have a natural duty not to murder.
  *   **Fair Play (Local, not General):** While Simmons rejects *general* fair play obligations to the state, he acknowledges we might have obligations to specific cooperative schemes (like a local community or specific public goods) that the law protects.
  *   **Prudence:** The state has coercive power. Even if it has no moral right to rule, it has the power to imprison. It is rarely "morally free" to break a law if doing so brings about disproportionate harm to oneself or one's dependents.

  **For your paper:** You can argue that Simmons would say a citizen is not "morally free" to break a law just because it is "unwise." They must weigh the *moral reasons for complying* (harm prevention, fairness to neighbors) against the *moral reasons for disobeying*. The removal of political obligation just removes one weight from the scale (the "because it is the law" weight); it does not remove the whole scale.

  ### 3. What Wolff Actually Argues
  Robert Paul Wolff's argument in *In Defense of Anarchism* is based on **moral autonomy**.

  *   **The Argument:** To be morally responsible, an agent must act on reasons they have validated for themselves. To submit to authority is to surrender judgment, which violates autonomy.
  *   **The Implication:** This does not mean the autonomous agent does whatever they feel like. It means they must *judge* every action.
  *   **Alignment:** An autonomous agent might look at a traffic law and conclude, "Obeying this promotes safety and order, which I value." They obey the law, but they do so *autonomously*, not *heteronomously* (not because the State told them to).

  **For your paper:** Wolff would reject the idea that a person is free to break a law because it is "inconvenient." Inconvenience is rarely a sufficient moral reason to override the social coordination that laws provide. The anarchist must still engage in moral reasoning. If the moral reasoning suggests obeying the speed limit is the right thing to do (to avoid killing a pedestrian), the anarchist obeys. The difference is purely in the *justification*, not necessarily the *action*.

  ### 4. How to Frame the Response Paper
  Here is a suggested structure for resolving the study group's impasse in your paper:

  1.  **State the Confusion:** Acknowledge that the inference (No Obligation $\rightarrow$ Permission to break laws for convenience) seems logical on the surface but fails to distinguish between *legitimacy* and *justification*.
  2.  **Define the Gap:** Explain the difference between a **content-independent reason** (authority) and **content-dependent reasons** (morality/prudence). The failure of the former does not eliminate the latter.
  3.  **Apply to Simmons:** Explain that for Simmons, the citizen becomes a "moral judge" of the law rather than a "subject." They must ask, "Is there a moral reason to do this?" rather than "Am I obligated to do this?" Often, the answer is still "yes," but for different reasons (e.g., natural duty not to harm).
  4.  **Apply to Wolff:** Explain that for Wolff, autonomy requires taking responsibility for the consequences of breaking laws. Breaking a law merely because it is "inconvenient" would likely fail the test of responsible moral judgment, even if it doesn't violate a duty to the state.
  5.  **Conclusion:** The conclusion of philosophical anarchism is not that "anything goes," but that **the burden of justification shifts.** In a statist view, the law is presumed binding unless there is a strong reason to break it. In the anarchist view, the law is just one factor among many; it has no presumptive moral weight, but it often carries significant prudential and moral weight due to its content and consequences.

  ### Summary Sentence for Your Paper
  You might summarize the resolution like this:
  > "Simmons and Wolff do not argue that citizens are free from moral constraints, but rather that they are free from *political* authority; consequently, while a citizen may disobey a law without violating a duty to the state, they remain bound by independent moral duties and prudential reasons that often make obedience the rational and ethical choice."

  This distinction allows you to accept Simmons's and Wolff's premises without accepting the radical (and implausible) conclusion that citizens can break laws whenever they find them inconvenient.
