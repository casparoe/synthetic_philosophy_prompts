prompt: |-
  I'm a retired marine biologist (spent something like 35 years elbow-deep in cnidarians and other squishy invertebrates), and for the past year or so I've been teaching myself philosophy for fun, mostly analytic metaphysics. Right now I'm slowly working through Peter van Inwagen's book on material beings and his "special composition question" -- basically, under what conditions do a bunch of smaller objects add up to make one bigger object. I've more or less got my head around the standard menu of answers (nihilism, universalism, van Inwagen's own answer that composition only happens when the parts are caught up in a "life," Markosian's "brutal composition," and so on), but every single example in the secondary lit I've read is the exact same handful of tired cases: a statue and the lump of clay its made of, a chair, the ship of Theseus, and I have some vague memory of a scattered object stitched together from half a trout and half a turkey meant to embarrass the universalists (though I might be misremembering that one). I mentioned all this to my niece, who's finishing a philosophy PhD, and she just laughed and admitted the field basically recycles the same five examples forever.

  So here's what I'm hoping you can do for me: come up with a genuinely fresh example, ideally drawn from biology rather than furniture and artifacts, that really brings out what's conceptually at stake in the special composition question. Things like a siphonophore (a Portuguese man o' war is actually a colony of specialized zooids, not one single animal, which always struck me as a metaphysical can of worms), a slime mold in its aggregation phase, a lichen, or an ant colony all seem like promising raw material, since in each case it's genuinely unclear whether your looking at one organism or a bunch of organisms fused into a "super-individual." Feel free to go with something else entirely if you've got a better idea. Whatever example you land on, please walk through how at least three of the standard answers to the SCQ would actually rule on it, and pin down exactly where and why they part ways -- that's the part I can never find spelled out clearly anywhere.
