      *   **Analyze the Teammate's Logic:** Acknowledge where it makes sense (efficiency) but highlight where it fails (risk, process integrity).
      *   **The Real Purpose of Code Review:** Explain *why* companies ask for 2 approvals (it's not just bug hunting).
      *   **Risks of the Current Behavior:** List specific downsides (Bus factor, blind spots, accountability).
