      *   **The "First Mover" Bias:** The first reviewer sets the tone. If they miss something, the second is unlikely to find it if they aren't looking deeply.
      *   **Security & Risk:** Critical changes need independent verification, not just confirmation.
      *   **Culture:** It encourages superficial reviewing. "LGTM" culture.

  4.  **Structure the Response:**
