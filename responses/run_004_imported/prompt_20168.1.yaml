answer: |-
  **1. The Naive Paradox**
  "Let's start with the anomaly that started it all. In a standard Bayesian framework, if I know evidence *E* is true with certainty—so *P(E) = 1*—then learning that theory *T* predicts *E* shouldn't change my belief in *T*. The math says the posterior equals the prior. So, when Einstein showed General Relativity accounted for Mercury's 43 arc-seconds, why wasn't that just a post-hoc curve-fit that should leave our confidence in General Relativity exactly where it started?"

  *   **Follow-up:** "Does this imply that standard Bayesian confirmation theory is fundamentally incapable of modeling historical science, where the data almost always precedes the theory?"

  **2. The Mechanism of Update**
  "Your solution is to say we aren't updating on the data itself, but on the connection. Can you spell out the exact proposition the scientist is conditioning on? Is it simply the claim that 'General Relativity entails the Mercury data'?"

  *   **Follow-up:** "If that's the evidence, does that mean the same physical data confirms two different theories differently, depending entirely on how hard the math is to derive?"

  **3. The Logical Omniscience Press**
  "Here's the hard press on that move. In classical logic, an entailment is either true or false. How can a rational agent assign a probability like 0.8 to a claim about what a theory logically entails without just admitting they are ignorant? Doesn't treating logic as uncertain quietly reintroduce the very logical omniscience you're trying to avoid, just one step removed?"

  *   **Follow-up:** "So are you arguing we need a non-standard probability calculus to handle logical uncertainty, or just that we apply standard Bayes to our own cognitive limitations?"

  **4. The Biographical Timing Objection**
  "This seems to make confirmation strangely biographical. If Einstein had derived the Mercury result in 1910, General Relativity would be more confirmed than if he'd derived it in 1920. Do you really want to defend the view that the epistemic support a theory enjoys depends on the contingent timing of when a human brain noticed a mathematical relation?"

  *   **Follow-up:** "Doesn't that make scientific progress dependent on the psychology of discovery rather than the objective structure of the world?"

  **5. Rival Counterfactual Accounts**
  "Other philosophers suggest we handle old evidence by constructing a counterfactual: what would our credence be if we *hadn't* known about Mercury yet? Why is your diagnosis of logical omniscience superior to this counterfactual approach?"

  *   **Follow-up:** "Is the counterfactual approach just too speculative to be useful, whereas your approach tracks what actually happened in the lab?"

  **6. Normative vs. Descriptive**
  "Is your account descriptive or normative? Are you saying this is how scientists *do* reason, or how a rational agent *ought* to reason even if they aren't omniscient?"

  *   **Follow-up:** "If it's normative, does that mean an idealized agent with infinite computing power would find General Relativity *less* confirmed by Mercury than Einstein was?"

  **7. Automation and AI**
  "In an era of automated theorem proving, if an AI verifies an entailment instantly, does the 'old evidence' problem vanish for the AI but remain for the human user?"

  *   **Follow-up:** "Does this suggest that confirmation is always relative to the cognitive architecture of the agent doing the confirming?"

  **8. Changing Your Mind**
  "Finally, what finding or argument, if any, would convince you that the logical-omniscience diagnosis is not the right explanation? Is there a case of old evidence confirming a theory where the entailment was known immediately?"

  *   **Follow-up:** "Are you worried that if the problem can be solved without relaxing omniscience, your whole framework becomes unnecessary?"
