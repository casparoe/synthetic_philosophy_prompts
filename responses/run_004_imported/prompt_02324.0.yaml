answer: |-
  **From the private journal of Mary Ann Evans Cross, 1889**

  > Mr. Nietzsche's polemic arrives with the sharp clatter of a hammer, yet it strikes a glass house of his own construction. He charges me with spending a moral capital I no longer possess, as though the tender regard for the suffering of my neighbour were a coin minted solely in the vaults of the Church. He supposes that because I have ceased to kneel before a celestial Sovereign, the bonds of duty that tie me to the living breathing souls around me must loosen and drift. But this is to mistake the shadow for the substance. 
  >
  > I did not find my morality in the dogmas of the theologians, but in the pulse of human fellowship itself. As I wrote long ago, translating Feuerbach, the divine is but the projected essence of the human; our love for God was, in truth, our love for our own highest nature made visible. To discard the phantom is not to discard the reality. The "capital" Mr. Nietzsche speaks of is not the inheritance of a creed, but the slow accumulation of human sympathy, earned through generations of shared sorrow and labour. It is the knowledge that my own joy is woven into the joy of others, and that no act falls solitary in this web. If I cling to piety, it is not the piety of the altar, but the piety of the hearth and the marketplace—the sacredness of consequences. To say I cannot hold these truths without a threat of hell is to say a man cannot walk without a crutch simply because he has thrown away the superstition that the ground is holy only because a priest blessed it. The ground bears us because it is earth, and we are of it.

  ***

  **Analysis**

  This passage draws directly on Eliot's translation of Ludwig Feuerbach's *The Essence of Christianity* (1854), which argued that theology is actually anthropology—that religious predicates belong to human nature, not a supernatural being. By framing morality as "human sympathy" and "the web" of social connection, the passage reflects the ethical core of her novels (particularly *Middlemarch* and *Adam Bede*), where duty arises from interdependence rather than divine command. It also echoes her essay "Evangelical Teaching: Dr. Cumming" (1855), in which she distinguishes between moral sentiment and religious dogma, arguing that the former is natural and intrinsic to social existence. Against Nietzsche's claim that she is illegitimately spending Christian capital, Eliot's reconstructed response asserts that the capital was never Christian to begin with; it is human, and Christianity was merely one historical vessel for a morality that survives the death of its theological container.
