answer: |-
  **Prague, Winter 1611.**

  **The study of Johannes Kepler. The room is cluttered with globes, stacked folios, and geometric models of polyhedra. A fire crackles, fighting the Bohemian cold. Johannes Kepler sits hunched over a chart, a compass in one hand, a cup of watered wine in the other. Across from him sits Master Cyprian, an astrologer of the old school, dressed in sober black, his fingers stained with ink.**

  **Cyprian holds a copy of Kepler's *Tertius Interveniens* as if it were a dead rat.**

  **CYPRIAN**
  You ask for patience, Johannes, but you offer us a castration. You say the *Tertius* is a mediation between the theologians who ban our art and the charlatans who sell it. I say it is a surrender. You tell the Emperor that the twelve signs are fables. That the Houses are arbitrary slices of air. That the rulerships of Mars and Venus are poet's nonsense.

  **KEPLER**
  (Without looking up from his chart)
  I tell the truth, Cyprian. The stars do not know they are in Aries. The constellation is a patchwork of distant fires; the sign is a human invention to track the sun's warmth. To say a man is violent because Mars *rules* him is to attribute agency to a red dot that has none.

  **CYPRIAN**
  And yet! You keep the aspects. You keep the conjunctions, the sextiles, the squares. You claim these geometric rays shoot down from the heavens, strike the Earth, and stir the weather, the humors, the very soul of man. So, the stars cannot be *gods*, but they are *archers*? They cannot wear crowns, but they can throw spears?

  **KEPLER**
  (Finally looks up, eyes tired but bright)
  It is not the star that throws. It is the angle. When two planets align, they form a configuration of rays. This configuration is a geometric archetype. It exists in the mind of God. And the Earth, Cyprian... the Earth is not dead clay. It is a living creature. It has a soul, an *Anima Mundi*. When the geometry of the heavens shifts, the Soul of the Earth feels it. As you feel a discord in music.

  **CYPRIAN**
  (Leans forward)
  There it is. The swap. You strip my zodiac of its mythology, only to dress the geometry in mysticism. You call my tradition "superstition" because I say Saturn brings melancholy by nature of his coldness. But you say Saturn brings melancholy because the Earth Soul "hears" a minor sixth? How is that physics? That is poetry dressed in a compass!

  **KEPLER**
  Because geometry is the language of Creation! Before the world was made, geometry was. It is co-eternal with God. The zodiac signs are merely markers on a road. The aspects *are* the road. If I draw a line from the Sun to the Earth, and another from Mars to the Earth, the angle between them is a physical reality. It is measurable. It is objective. The sign of Leo is a story. The square of 90 degrees is a truth.

  **CYPRIAN**
  Is it? Tell me, Johannes. If I stand in a field during a square of Mars and Saturn, what hits me? A ray? A wind? A heat?

  **KEPLER**
  A *species*. An immaterial form, like light.

  **CYPRIAN**
  And if I stand in the same field, but the planets are in different signs, say, Saturn in Cancer instead of Capricorn? By your logic, the angle is the same. The geometry is identical. So the effect should be identical.

  **KEPLER**
  Broadly, yes. The weather will turn harsh. The humors will agitate.

  **CYPRIAN**
  But my books, the books of Albumasar, of Ptolemy, of the Arabs who watched the sky for a thousand years while your Germans were painting themselves blue—they tell me Saturn in Cancer is exalted, fertile! Saturn in Capricorn is dry, destructive! The *quality* changes. And in my practice, Johannes, in thirty years of casting nativities, I have seen it hold. When Saturn sat in the Water signs, the floods came. When in Earth, the grain withered. You discard this nuance. You flatten the sky into a protractor.

  **KEPLER**
  You confuse the container with the content. The signs mark the seasons. The Sun in Aries means Spring. That is physical. But to say Mars *rules* Aries? That is a chain of command invented by men. I do not deny the seasons. I deny the mythology of rulership.

  **CYPRIAN**
  You deny the track record! You scoff at the "vulgar astrologers" who get things wrong. But you, with your harmonies and your polyhedra, how many almanacs have you published? You calculate the aspects, you predict a frost, and we get rain. You are no more accurate than the man who reads the entrails of a pig, yet you claim a higher priesthood because you use triangles.

  **KEPLER**
  (Slams his hand on the table)
  I never claimed infallibility! The Earth Soul is sluggish. It is burdened by matter. Sometimes it feels the aspect and reacts; sometimes it sleeps through the thunder. And yes, I am fallible. But I would rather be wrong for the right reasons than right for the wrong ones! If a blind man guesses the hour, is he a clockmaker?

  **CYPRIAN**
  If the blind man tells me when to sow and when to reap, I do not care if he sees the sun! That is the insult. You look down on us. You take our bread—casting horoscopes for the Court, making calendars for the peasants—but you spit in the recipe. You tell the Duke, "I must calculate your fate," but you whisper, "The tools I use are mostly trash, but the angles are holy." If the Houses are arbitrary, why do you cast them for Wallenstein?

  **KEPLER**
  (Stiffens)
  Because men demand a narrative. They cannot understand the raw geometry. They need the story. I give them the story so I may buy bread and continue my work on the Rudolphine Tables. It is a concession to human weakness.

  **CYPRIAN**
  A concession? It is hypocrisy. You say the Earth Soul feels the geometry. How? Does it have ears? Does it have eyes?

  **KEPLER**
  It has a faculty of perception, just as you do. When you see a beautiful building, you do not measure the bricks. You feel the proportion. The Earth feels the proportion of the heavens.

  **CYPRIAN**
  I am a man. I have a soul. I can feel harmony. The Earth is rock and water. To say the dirt listens to music is a metaphor, Johannes. A pretty one. But you treat it as a mechanism. You say my signs are "imaginary" because they are not physically etched in the sky. But your "Harmony of the Spheres" is inaudible! It is unheard music, felt by a dirt-ball, to cause rain. Which of us is the mystic?

  **KEPLER**
  (Softly)
  We are both mystics, Cyprian. I do not pretend to be a mechanist like a clockmaker. I believe God made the world intelligible. He wrote it in the language of triangles and circles. When you use the Chaldean rulerships, you are reading a layer of dust over the text. I am trying to scrape it away to read the words.

  **CYPRIAN**
  And if the dust is part of the text? If the "mythology" is merely how the ancients encoded physical observations we no longer understand? You cut away the signs because they lack a geometric *cause*. But what if they are *correlative*? The universe is a web, Johannes. Pull one thread, the whole vibrates. You want to sever the threads that do not fit your geometry.

  **KEPLER**
  Then the web is chaos. If there is no geometric necessity, then it is magic. Pure will. If Saturn affects grain not because of its position relative to the Sun and Earth, but because "Saturn is Saturn," then we are in the dark. I seek the light of cause.

  **CYPRIAN**
  You seek the light, but you blind yourself to the shadow. You say the aspects are physical rays. Very well. A ray travels in a line. But an aspect is an angle *at the Earth*. That means the Earth is the vertex. The Earth is the active participant.

  **KEPLER**
  Yes! The Earth looks up and perceives!

  **CYPRIAN**
  Then why does the Earth not perceive the stars? Why only the planets? The fixed stars are far brighter. By your geometry, a fixed star should cast a stronger ray. Yet you ignore them in your aspects. You pick and choose which lights the Earth Soul "hears." It seems your geometry is as selective as my mythology.

  **KEPLER**
  (Pauses. He takes a sip of wine, staring into the fire.)
  The fixed stars... they are the background. They are the walls of the temple. The planets are the priests moving within. The Earth responds to motion, to change.

  **CYPRIAN**
  "Motion." Now we are closer. So it is not the angle, but the movement?

  **KEPLER**
  It is the configuration of moving bodies.

  **CYPRIAN**
  (Smiles thinly)
  You shift the ground. First it was the angle. Now it is the motion. You are building a new astrology, Johannes. Do not pretend you are destroying the old one. You are merely replacing the Pope with a Geometer. The dogma remains. The authority remains. "Trust me, I know the secret language."

  **KEPLER**
  The difference, Master Cyprian, is that anyone can learn geometry. It is universal. If I am wrong, a student in Vienna can prove it with a compass. If you are wrong about the rulership of Mars, I must argue with tradition, with ghosts, with the authority of the ancients. I open the door to verification. You lock it with history.

  **CYPRIAN**
  (Stands, buttoning his coat)
  Verification. A fine word. When your new geometry predicts a harvest that fails, and the peasants starve, tell them about verification. Tell them the Earth Soul was "sluggish." I will be in the tavern with the old charts, telling them Saturn was in the wrong house, and next year we will adjust. I offer them a system that bends. You offer them a system that breaks.

  **KEPLER**
  I offer them truth. Even if it breaks.

  **CYPRIAN**
  Truth does not fill bellies, Johannes. And it does not comfort a father who has lost a son to fever. The signs... they give a story. They tell him *why*. "It was the will of the stars." Your geometry tells him, "It was a triangle." Which mercy is greater?

  **KEPLER**
  (Quietly)
  I do not know. But I cannot preach what I do not believe.

  **CYPRIAN**
  Then you will be a poor astrologer. But perhaps a good astronomer. Keep your angles. Leave me my signs. We both serve the same Emperor, and he needs rain for his crops and omens for his wars. He does not care if the arrow comes from a bow or a geometric theorem, so long as it hits the target.

  **KEPLER**
  Then we shall see whose target is truer.

  **CYPRIAN**
  (At the door)
  One thing, Johannes. In your *Tertius*. You say the Earth Soul perceives the aspects. Does it perceive them in Latin? Or German?

  **KEPLER**
  (A faint smile touches his lips)
  It perceives them in the language of Harmony.

  **CYPRIAN**
  Then pray it does not find our argument discordant. Good night, Imperial Mathematician.

  **KEPLER**
  Good night, Master Cyprian.

  **Cyprian exits. The door latches. Kepler is alone. He looks down at his chart, traces the line of a trine with his finger, then looks up at the ceiling, as if listening to the silence of the spheres.**

  **KEPLER**
  (To himself)
  Discordant... or merely a dissonance waiting for resolution?

  **He blows out the candle.**
