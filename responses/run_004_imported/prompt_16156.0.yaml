answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's brother.

  Looking around this room, I realize we have a unique challenge tonight. About half of you are family, who just want to know why the open bar is taking so long. The other half are [Bride]'s and [Groom]'s colleagues from Economics and Computer Science, who are currently mentally peer-reviewing this speech for theoretical accuracy.

  So, I'm going to walk a tightrope. Because if you know this couple, you know their love story has a specific intellectual architecture. They bonded over a shared obsession with the Nobel laureate Herbert Simon. Now, Simon is a rare unicorn: he's a founding father of both Artificial Intelligence and Behavioral Economics. And the concept that brought them together is the one I want to talk about: *Satisficing.*

  Now, for the family: In standard economic theory, humans are supposed to be "maximizers." We're supposed to scan every possible option in the universe to find the single absolute best one. In dating, that's the myth of the "perfect soulmate." You keep searching, forever, terrified that someone better is just around the corner.

  But Simon argued that's impossible. We have "bounded rationality." We don't have infinite time, infinite information, or infinite emotional bandwidth. So, instead of maximizing, we *satisfice*.

  And I need to be very clear about what that means, because there is a dangerous misconception that satisficing means "settling." It does not.

  Satisficing requires two things. First, you set an **aspiration level**. You decide what truly matters—kindness, intellect, curiosity, the ability to laugh at your own bugs. You set the bar high. Second, once you find someone who clears that bar, you stop searching.

  [Bride] and [Groom] didn't find each other because they lowered their standards. They found each other because they knew exactly what their standards were. They recognized that the cost of continuing the search—emotionally, temporally, spiritually—outweighed the marginal gain of looking for a hypothetical "better" option.

  For the economists in the room: They recognized that the local optimum they found together dominates any theoretical global maximum they could have searched for in isolation.

  For the rest of us: They looked at each other and realized, "I don't need to keep looking. I'm home."

  There is something profoundly romantic about that decision. In a world that tells us to keep swiping, keep optimizing, and keep wondering "what if," choosing to stop the search is the ultimate act of commitment. It is saying, "My aspiration level is not just met; it is exceeded. The search is over."

  [Groom], you're a CS PhD. You know that an algorithm that never terminates is a broken algorithm.
  [Bride], you're an Econ PhD. You know that utility isn't found in the search, it's found in the consumption of the good.

  Together, you've built a life that doesn't try to be perfect. It tries to be real. It acknowledges our human limits, but it sets a bar for love that is incredibly high. And then, you had the wisdom to stop looking when you found it.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your aspiration levels remain high, may your search costs remain zero, and may you spend the rest of your lives proving that "good enough" was actually the best thing that ever happened to either of you.

  To the happy couple!
