      *   *Result:* $W = \sum a_i u_i + b$.
      *   *The Problem (IPC):* vNM utilities are unique only up to positive affine transformations ($u'_i = \alpha_i u_i + \beta_i$, where $\alpha_i > 0$).
      *   *The Math:* If I rescale person $i$'s utility by a huge factor $\alpha_i$, the weight $a_i$ in the social function must shrink by $1/\alpha_i$ to keep $W$ invariant.
      *   *The Implication:* The weights $a_i$ are not intrinsic moral weights. They are artifacts of the arbitrary scaling of individual utility functions. Without an external standard to fix the zero and unit for each $u_i$ *relative to each other*, the sum $\sum a_i u_i$ is meaningless as a measure of total welfare. It's just a mathematical representation of a preference ordering, not a cardinal measure of "goodness."
      *   *Sen's Objection:* The theorem proves the *form* is linear, but it doesn't prove the *substance* of utilitarianism (maximizing sum of comparable welfare) because the inputs ($u_i$) lack a common metric. It's "formal utilitarianism" without "measurement utilitarianism."

