answer: |-
  You are entirely correct to distinguish these two results. The conflation of Harsanyi's 1955 Aggregation Theorem and his 1953 Impartial Observer Theorem is a pervasive error in popular rationalist discourse. The former is a representation theorem about preference consistency; the latter is a normative argument about moral perspective.

  Below is a technical walkthrough of why the 1955 theorem fails to secure interpersonal comparability (IPC) and how the 1953 theorem attempts to construct it via the equiprobability device and the "Identification Postulate."

  ---

  ### 1. The 1955 Social Aggregation Theorem: The Scaling Indeterminacy

  The 1955 theorem operates within the standard von Neumann–Morgenstern (vNM) framework. It asks: If individuals and society both have preferences over lotteries that satisfy the vNM axioms, and society respects the Pareto principle, what form must the social welfare function take?

  #### The Setup
  *   Let $X$ be a set of outcomes. Let $\mathcal{L}$ be the set of simple lotteries over $X$.
  *   There are $N$ individuals. Individual $i$'s preferences $\succeq_i$ over $\mathcal{L}$ satisfy vNM axioms, represented by a utility function $u_i: \mathcal{L} \to \mathbb{R}$.
  *   Social preferences $\succeq_S$ over $\mathcal{L}$ satisfy vNM axioms, represented by a social welfare function $W: \mathcal{L} \to \mathbb{R}$.
  *   **Pareto Indifference:** For any $L, L' \in \mathcal{L}$, if $u_i(L) = u_i(L')$ for all $i$, then $W(L) = W(L')$.

  #### The Result
  Harsanyi proves that $W$ must be an affine transformation of a weighted sum of individual utilities:
  $$ W(L) = \sum_{i=1}^N a_i u_i(L) + b $$
  where $a_i \geq 0$ and $b$ is a constant. This looks like classical utilitarianism.

  #### The Sen-Style Objection: Joint Indeterminacy of Weights and Scales
  The fatal technical flaw regarding utilitarianism lies in the **uniqueness conditions** of vNM utility.

  A vNM utility function $u_i$ is unique only up to a **positive affine transformation**. That is, if $u_i$ represents $\succeq_i$, then $u'_i = \alpha_i u_i + \beta_i$ (where $\alpha_i > 0$) also represents $\succeq_i$. Crucially, $\alpha_i$ and $\beta_i$ can be chosen **independently for each individual**. There is no axiom in the 1955 setup that links the scale of person 1's utility to the scale of person 2's utility.

  Now, consider the social function $W$. For $W$ to represent the *same* social preference ordering $\succeq_S$, it too is unique only up to a positive affine transformation ($W' = \gamma W + \delta$).

  If we rescale individual $i$'s utility by a factor $\alpha_i$, we must adjust the weight $a_i$ to maintain the equality of the social ordering. Specifically, if we replace $u_i$ with $u'_i = \alpha_i u_i$, we must replace $a_i$ with $a'_i = a_i / \alpha_i$ to keep the product $a_i u_i$ constant.

  **The Implication:**
  The magnitude of the weight $a_i$ is entirely dependent on the arbitrary scaling of $u_i$.
  1.  If I measure your utility in "millihedons" instead of "hedons" ($\alpha_i = 0.001$), your weight $a_i$ in the social function must increase by a factor of 1000 to preserve the social ordering.
  2.  Conversely, if I arbitrarily assign you a huge weight $a_i$, I can compensate by shrinking the scale of your utility function $u_i$ without violating any axioms.

  **Conclusion on 1955:** The theorem proves the social ordering is *linear* in the individual utility representations, but it does not fix the **zero points** ($\beta_i$) or the **units** ($\alpha_i$) across persons. Without a fixed, common unit of measurement, the sum $\sum a_i u_i$ is mathematically well-defined but ethically meaningless. It is "formal utilitarianism" without a metric. The weights $a_i$ are not moral weights; they are normalization constants required to make the independent scales sum to a social index.

  ---

  ### 2. The 1953 Impartial Observer Theorem: Constructing Comparability

  The 1953 theorem attempts to solve the scaling problem by changing the domain of evaluation. It does not aggregate existing individual preferences; it constructs a single preference relation that *simulates* being everyone.

  #### The Setup: Extended Alternatives
  Harsanyi expands the domain of outcomes. An alternative is no longer just $x \in X$, but a pair $(i, x)$, representing "being individual $i$ in social state $x$."
  *   Let the Impartial Observer (IO) have preferences $\succeq_{IO}$ over lotteries of these extended alternatives.
  *   The IO satisfies vNM axioms, represented by a single utility function $V(i, x)$.

  Because $V$ is a **single** vNM function for the IO, the values $V(i, x)$ and $V(j, y)$ are automatically cardinally comparable. They are measured in the same "IO utils." This bypasses the 1955 problem of independent scales by fiat: there is only one scale.

  #### The Role of Equiprobability
  The IO evaluates a social state $x$ by imagining a lottery where they have an equal probability ($1/N$) of becoming any person $i$ in that state.
  The expected utility for the IO for state $x$ is:
  $$ E[U_{IO} | x] = \sum_{i=1}^N \frac{1}{N} V(i, x) $$
  Here, the **equiprobability device** performs a specific technical function: it fixes the weights $a_i$ in the aggregation formula to be exactly equal ($1/N$). In the 1955 theorem, the $a_i$ were indeterminate. Here, they are derived from the objective probability of identity assignment in the thought experiment.

  #### The Identification Postulate (The Crucial Link)
  To get from $V(i, x)$ to standard utilitarianism ($\sum u_i(x)$), Harsanyi invokes the **Identification Postulate**. He argues that when the IO imagines being person $i$, they adopt person $i$'s preferences and subjective characteristics. Therefore:
  $$ V(i, x) \cong u_i(x) $$
  (More precisely, $V(i, \cdot)$ is a positive affine transformation of $u_i(\cdot)$ *with a common scale across all $i$*).

  #### How It Succeeds (Internally) Where 1955 Failed
  1.  **Common Metric:** In 1955, $u_1$ and $u_2$ were independent functions. In 1953, $V(1, x)$ and $V(2, x)$ are values of the *same* function $V$. Comparability is built into the domain definition.
  2.  **Fixed Weights:** In 1955, weights $a_i$ were free parameters constrained only by Pareto. In 1953, the weights are fixed at $1/N$ by the equiprobability axiom applied to the IO's risk preferences.
  3.  **Result:** The IO maximizes $\sum \frac{1}{N} u_i(x)$. This is average utilitarianism with a fixed, common cardinal scale.

  ---

  ### 3. Technical Critique: Does the 1953 Theorem Actually Work?

  While the 1953 theorem *structurally* solves the indeterminacy of the 1955 theorem, it does so by shifting the burden of proof to the **Identification Postulate**.

  **The Sen/Weymark Objection:**
  Critics argue that the Identification Postulate smuggles in interpersonal comparability rather than deriving it.
  *   For $V(i, x)$ to be comparable to $V(j, x)$, the IO must be able to say, "The satisfaction I get from being $i$ in $x$ is exactly twice the satisfaction I get from being $j$ in $x$."
  *   But if the IO truly *becomes* $i$, they have $i$'s utility function. If they truly *becomes* $j$, they have $j$'s utility function.
  *   How does the IO compare the utility of "having $i$'s utility function" vs "having $j$'s utility function"? This requires a **meta-utility** function that can compare different utility functions.
  *   Harsanyi assumes the IO has a single, stable vNM scale that persists across these identity shifts. Sen argues this is an assumption of interpersonal comparability disguised as a psychological claim about the observer.

  **Summary of the Distinction:**
  *   **1955 Theorem:** Proves that *if* you have comparable utilities, social welfare must be linear. But it provides no mechanism to make utilities comparable. The weights are artifacts of scaling.
  *   **1953 Theorem:** Constructs a single utility scale ($V$) over identity-outcome pairs. The equiprobability device fixes the weights to equality. It secures IPC by asserting that all individual utilities can be mapped onto the Observer's single cardinal scale.

  In short: The 1955 theorem gives you the **equation** of utilitarianism without the **units**. The 1953 theorem attempts to define the **units** by positing a single observer who experiences all lives, using equiprobability to ensure each life counts for exactly one unit of weight in that observer's expectation. Whether one accepts the 1953 solution depends entirely on whether one accepts the coherence of the Identification Postulate.
