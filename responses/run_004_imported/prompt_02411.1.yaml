      *   *The "Expert Deference" point:* Owen mentions expert deference. This references the "New Principle" or Gaifman's Expert Principle. If the chance is undefined, we defer to the expert (the model). This is a strong fallback for Owen.

  10. **Final Polish:** Ensure the distinction between *metaphysical chance* and *epistemic probability* is clear. Make sure the verdict on "who wins" is nuanced (Leah wins philosophy, Owen wins meteorology, both lose pragmatics).

