  The stack of bills sat between them, swollen to $320. It was Elias's turn. Pass, and it grows to $480. Take, and he gets $280, leaving Sofia with $40.

  "Take it," Elias said, hand hovering over the pile.

  "Don't be obtuse," Sofia replied, leaning back. "We're on node four. If you were going to defect, you would have done it at node one. The fact that you passed tells me you're playing for the cooperative equilibrium."

  Elias shook his head. "That's empirical thinking. We're doing epistemic theory. Common Knowledge of Rationality (CKR) implies backward induction. I know you're rational. You know I'm rational. Therefore, you know that at the final node, I will take. Knowing that, you would have taken at the penultimate node. Knowing that, I take now."

  "But we *didn't* take at node one," Sofia pressed. "That's the data. Your model assumes CKR holds at every node, even unreached ones. But we *are* at an unreached node. By Aumann's own logic, this state of the world should have probability zero. Since we're here, CKR is falsified. I need to update my beliefs."

  "You can't update on a logical impossibility," Elias countered. "CKR isn't a hypothesis subject to testing; it's the framework of reasoning. If I know you are rational, you *cannot* deviate. To ask 'what if I deviated' is to ask me to reason from a contradiction. In standard epistemic logic, anything follows from a contradiction, but in decision theory, we treat the counterfactual as vacuous. I don't revise my belief that you're rational because rationality dictates you wouldn't have put us here unless the backward induction logic held."

  "That's the incoherence Binmore pointed out," Sofia said, tapping the table. "You're stripping rationality of its dynamic component. Rationality includes belief revision. If I see you pass when backward induction says 'take,' I must infer something about your type. Maybe you're altruistic. Maybe you doubt my rationality. If I doubt your rationality, *I* should pass to exploit your 'irrational' cooperation. So passing becomes rational for me, which makes passing rational for you. Your backward induction collapses."

  Elias sighed. "You're conflating knowledge with belief. Aumann's proof relies on knowledge. Knowledge is factive. If I know you're rational, you are rational. If you pass, it wasn't a deviation from rationality; it was the only rational move consistent with my knowledge of your final move. You're trying to introduce a theory of belief revision into a model of knowledge. Once you allow belief revision on 'impossible' events, you're no longer doing backward induction; you're doing forward induction."

  "Exactly!" Sofia leaned forward. "And forward induction suggests cooperation. Because in the real world, agents signal through moves. Your pass signals 'I expect you to pass later.' If I ignore that signal because of some axiomatic commitment to backward induction, I'm not being rational; I'm being dogmatic. Stalnaker showed that if you assume players maintain a belief in rationality even off-path, but allow for different counterfactuals, you get cooperation. Why is your counterfactual—the one that assumes I'll defect at the end—more valid than mine?"

  "Because mine is derived from the structure of the game itself, not psychological speculation," Elias said. "The structure says the game ends. Your argument requires me to believe you'll pass at the end, but there's no structural incentive for me to pass at the end. I just take the money. You know I'll take. So you take before. So I take now."

  "But if you take now, you leave $200 on the table," Sofia said. "Is it rational to leave money on the table because of a logical tautology?"

  "It's rational to avoid being exploited by inconsistent reasoning."

  Elias grabbed the pile. He counted out $280, slid $40 to Sofia.

  "You just proved my point," Sofia said, pocketing the forty. "You sacrificed surplus to maintain logical consistency. That's not rationality. That's ideology."

  "It's equilibrium," Elias said, standing up. "See you at the seminar."
