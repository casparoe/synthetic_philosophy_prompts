answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two philosophy PhD students, ELENA and DAVID, are clearing away empty mugs. Elena leans back, tapping a pen against her notebook. David is scrolling through a PDF on his tablet.*

  **Elena:** I'm still stuck on what Professor Hare said about the "Moral Equality of Combatants" (MEC). It feels counterintuitive, right? Like, if Country A invades Country B for no reason, how can Country A's soldiers have the *same* moral right to kill as Country B's defenders?

  **David:** Exactly. That's the Revisionist critique in a nutshell. Think about ordinary morality. If a mugger attacks me in an alley, I have a right to defend myself. But the mugger doesn't acquire a right to kill me just because I'm fighting back. If I shoot him in self-defense, I'm justified. If he shoots me, he's committing murder. Why should war be different?

  **Elena:** Because war isn't a mugging, David. It's a collective political act. The Walzerian view—the Traditionalist view—is that soldiers are instruments of the state. Once you put on the uniform, you become a "dangerous citizen," sure, but you aren't personally responsible for the *jus ad bellum*, the justice of the cause. That lies with the leaders.

  **David:** But that separation seems artificial. *Jus ad bellum* and *jus in bello* can't be hermetically sealed. If the cause is unjust, then the threats you pose in pursuing that cause are unjust. If I'm an unjust combatant, I'm essentially an aggressor. How do I have a right to kill someone who is justly defending their home? It implies the defender is doing something morally symmetrical to me, when they aren't.

  **Elena:** Okay, but look at the alternative. If we adopt your Revisionist view, we're telling every soldier on the unjust side that they are morally liable to be killed, essentially criminals. But here's the pragmatic kicker: If soldiers believe they are murderers simply for fighting, they have no incentive to follow the rules of war. Why would an "unjust murderer" bother distinguishing between combatants and civilians? Why would they surrender? MEC gives them a professional code. It says, "You can fight honorably, provided you follow the rules, regardless of the political dispute."

  **David:** I see the pragmatic appeal, Elena, I do. But you're conflating *moral liability* with *legal status*. I'm talking about deep morality. In deep morality, the unjust combatant *is* liable. Now, you might argue we should keep MEC as a legal convention for the reasons you just said, but we shouldn't pretend it's morally true. To say the aggressor has an *equal right* to kill is to distort the moral reality of self-defense.

  **Elena:** But is it a distortion, or is it a recognition of the epistemic position soldiers are in? This is the epistemic argument. Most soldiers don't have access to the intelligence reports, the diplomatic cables, or the historical context. They are told by their government that they are defending the nation. If a German conscript in 1940 is told he's securing Europe against chaos, how can we hold him to the same standard of moral judgment as a philosopher in an office?

  **David:** That's a strong point, but uncertainty doesn't grant a license to kill. If I'm unsure whether the person in the alley is a mugger or an undercover cop, I don't get to shoot first and ask questions later. Uncertainty usually requires caution, not symmetrical permission. If a soldier is unsure about the justice of the war, the default should be restraint, not an assumption of equal rights.

  **Elena:** That works for individuals, but armies run on discipline. If you tell soldiers, "You must individually assess the justice of the war before firing," you undermine military cohesion. Plus, you create a asymmetry of risk. The unjust side might hesitate, but the just side won't. That might sound good to us, but it could prolong conflicts or lead to the total defeat of the hesitant side, which might be worse for stability. MEC creates a level playing field that encourages reciprocal adherence to humanitarian laws.

  **David:** I'm willing to concede that MEC might be a useful *legal fiction*. Maybe international law *should* treat combatants equally to encourage surrender and limit atrocities. That's a rule-consequentialist argument. But as a matter of *individual morality*, it fails. If we teach soldiers that they are morally equal regardless of the cause, we make it too easy for leaders to start unjust wars. They know their soldiers won't feel the moral weight of aggression.

  **Elena:** So you think abandoning MEC would deter unjust wars?

  **David:** Potentially. If soldiers knew that fighting an unjust war made them morally liable to defensive killing—essentially making them legitimate targets in a way that isn't reciprocal—they might be more reluctant to fight. It shifts the burden back onto the individual.

  **Elena:** That feels like punishing the foot soldier for the General's crime. Look, I agree that the *leaders* on the unjust side bear the primary responsibility. But soldiers are coerced. Conscription, economic pressure, social conditioning... they aren't fully voluntary agents in the way a mugger is. Walzer argues that because they are coerced into the "common danger" of war, they lose their right not to be killed, but they gain the right to kill. It's a mutual loss of rights.

  **David:** But coercion doesn't justify killing innocents. If a mugger holds a gun to my head and tells me to shoot a bystander, I'm still not justified in shooting the bystander, even if I'm coerced. The unjust combatant is posing a threat to people who haven't forfeited their right to life. The just combatant is posing a threat to people who *have* forfeited their rights by participating in unjust aggression. The moral statuses are fundamentally different.

  **Elena:** I think where we diverge is on the function of the theory. You want Just War Theory to be a mirror of individual morality. I see it as a framework for regulating interstate violence. If we say the unjust soldier is a murderer, we dehumanize them. And historically, dehumanizing the enemy is what leads to atrocities. MEC forces us to see the enemy soldier as a moral agent like us, bound by the same rules, rather than a criminal to be exterminated.

  **David:** I worry that MEC dehumanizes the *victims* of aggression. It tells the person being invaded, "The person trying to conquer you has the same moral standing as you." It dilutes the concept of justice. But... I will grant you the legal point. Perhaps we need a two-tiered system. In the court of deep morality, Revisionism holds: unjust combatants lack the right to kill. But in the International Criminal Court and the Geneva Conventions, we keep MEC.

  **Elena:** Why?

  **David:** Because of the epistemic problem you raised. If we make *jus in bello* violations dependent on *jus ad bellum* status in a legal setting, every trial becomes a trial of the war itself. It becomes politically impossible to adjudicate. "I didn't commit a war crime because my side was just." It opens a Pandora's Box. So, legally, we treat them as equals to keep the process manageable.

  **Elena:** Exactly. It's a convention. Like driving on the right side of the road. Is it morally inherent that we drive on the right? No. But we need a convention to avoid crashes. MEC is the convention that prevents war from devolving into total slaughter where only the "righteous" survive.

  **David:** I can accept that as a pragmatic compromise. But we must be careful not to let the legal convention wash away the moral truth. We can't let soldiers off the hook entirely. They still have a duty to investigate the justice of their cause. If the injustice is manifest—like a blatant war of conquest—they can't hide behind MEC. They become morally liable, even if the law treats them symmetrically.

  **Elena:** I can live with that. A "Manifest Injustice" exception. If the war is obviously aggressive, the soldier bears some moral responsibility. But for the gray areas? The complex geopolitical disputes where even experts disagree?

  **David:** In the gray areas, the epistemic uncertainty protects them from moral condemnation. But it doesn't grant them a *right* to kill. It just means they aren't fully culpable for being mistaken.

  **Elena:** So, for you, MEC is legally useful but morally false.

  **David:** And for you, MEC is morally necessary for the regulation of war.

  **Elena:** I'd say morally necessary *for the purpose of limiting war's horrors*. If the goal of Just War Theory is to reduce suffering, MEC does the heavy lifting. If the goal is moral purity, you win.

  **David:** *Laughs.* I suppose the tragedy is that war is a place where moral purity is impossible. But if we stop talking about the truth of liability, we risk normalizing aggression.

  **Elena:** And if we stop talking about the equality of soldiers, we risk normalizing atrocity.

  **David:** Cheers to that.

  **Elena:** *Clinks her mug against his tablet.* Cheers.
