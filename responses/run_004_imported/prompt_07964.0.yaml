          2.  **Risk Tolerance/Utility:** Investing isn't just about probability of success; it's about the *cost* of failure vs. the *benefit* of success.
          3.  **Weighting of Variables:** The report has many data points. You might weight "market saturation" heavily; she might weight "founder passion" heavily. Both are rational, but different.
