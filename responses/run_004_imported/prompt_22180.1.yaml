answer: |-
  **The Margin**

  The desk lamp hummed, a low electric insect sound that Arthur had stopped hearing twenty years ago. It was November, 1994. Outside, the Chicago wind was rattling the single-pane windows of the apartment, but inside, the air was still. It smelled of old paper, pencil shavings, and the cold dregs of coffee in a chipped mug.

  On the desk lay the ledger. It wasn't a diary; there were no feelings in it, no weather reports, no notes about the neighbors. Just columns. Date. Track. Race. Odds. Stake. Result. Bankroll.

  Arthur adjusted his glasses. The radio on the shelf was crackling with the feed from Aqueduct. The 7th race was ten minutes away.

  He had done the work already. That was the thing people never understood. They thought the work was picking the horse. Anyone could pick a horse. You could throw a dart at a program and pick a horse. The work was the number. The work was the quiet, unglamorous arithmetic of survival.

  He looked at the horse: Number 5, *Iron County*. The morning line odds were 4-to-1. But Arthur's models, the ones he'd refined since the eighties, said the true odds should be 2-to-1. The track was wrong. The public was sleeping on *Iron County*'s form. This was what the professionals called an "edge." It was a mispricing in the market.

  In a casino, you play against the house, and the house always wins eventually. But here, against the public, against the other bettors who bet with their guts or their hunches, you could win. But only if you didn't die first.

  Arthur picked up his pencil. He looked at his current bankroll total written at the bottom of the previous page. It was a comfortable number. Enough to supplement the pension. Enough to help the kids if the roof leaked or the car died. It was not "get rich" money. It was "stay free" money.

  The math whispered to him. With an edge this clear, the formula suggested a bet. But how much?

  If Arthur were a character in a movie, this would be the moment he mortgaged the house. This was the scene where the gambler feels the heat in his blood, the certainty of the win, and he pushes all the chips into the center of the table. In the movies, the music swells, the horse wins, and the hero walks away rich.

  But Arthur knew the math of the movies was a lie. The movies played by the rules of *average*. In the average of a million parallel universes, betting everything on a 70% chance to win makes you a millionaire. In seven hundred thousand of those universes, you are rich.

  But Arthur didn't live in seven hundred thousand universes. He didn't get to average them out. He lived in this one. He had to wake up in this kitchen tomorrow. He had to walk down these hallways for the next thirty years. In the one universe where the 30% loss hit, he wasn't just down money. He was out. Game over. No more bets. No more compounding. No more tomorrow.

  The pencil hovered over the paper.

  The temptation wasn't greed, not exactly. It was the seduction of efficiency. It felt wasteful to bet small when you knew you were right. It felt like leaving money on the table. It felt like being a coward.

  He could hear the voice of his buddy Sal from the old days. *"Artie, you got a lock? Hit it. You only live once."*

  *No,* Arthur thought. *I live every day. That's the difference.*

  If he bet too much, volatility became the enemy. A string of bad luck—which was statistically guaranteed to happen eventually—would wipe him out before the law of averages could save him. To maximize the growth of the bankroll over a lifetime, he had to bet less than his gut told him. He had to leave a margin. Not just for error, but for existence.

  He looked at the number the formula gave him. It was small. Painfully small compared to the pot he could win. It was a fraction of what the "expected value" suggested he should risk. It was the difference between driving a car at the maximum speed the engine could handle, and driving at the speed where you could still stop if a child ran into the road.

  He wrote the number down.

  $140.

  He could win $560. It was a good night's wage. It wasn't a fortune. It was a brick in the wall.

  He picked up the phone and dialed the OTB line. He placed the bet. He hung up. He didn't sweat. He didn't pace. He simply turned the page in the ledger and prepared the pen for the next race.

  On the radio, the horses broke from the gate. The caller's voice sped up, a rhythmic chant of hooves and names. *...into the stretch, Iron County on the rail...*

  Arthur didn't stand up. He didn't clench his fist. He watched the pencil in his hand.

  *...Iron County takes the lead! By a length! It's over!*

  The horse won. Arthur added the winnings to the total. He updated the bankroll. He calculated tomorrow's unit size based on the new total. It went up by a few dollars. Compounding.

  He leaned back in the chair and rubbed his eyes. He thought about his daughter, asleep in the next room. She thought he was just an accountant who liked the races. She thought he was cautious, maybe a little timid. She didn't know that caution was the most aggressive thing he did.

  He understood something that the men at the track, the ones screaming and tearing up their tickets, didn't. They were trying to win the race. Arthur was trying to win the life.

  They were playing a game of chance. He was playing a game of time.

  He closed the ledger. He walked to the bookshelf and ran a finger over the spine of a battered book, *Fortune's Formula*, held together with scotch tape. He smiled. He wasn't trying to be a hero. He was trying to be a survivor. He was trying to make sure that when he was gone, the numbers in the book would still be there, steady and growing, a quiet testament to the fact that he had stayed in the game.

  He turned off the lamp. The room went dark, but the math remained. The long line of the ledger stretched out into the future, a thin, unbroken thread through the chaos of the world. He hadn't bet on the horse. He had bet on the morning. He had bet on being there to see it.

  ***

  *For Dad, who taught us that the smartest bet is always the one that lets you stay at the table.*
