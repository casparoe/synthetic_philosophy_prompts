      *   Because they are symmetric, A reasons: "If I can prove B cooperates, I cooperate."
      *   Actually, the proof relies on the fact that if A proves "B cooperates," then B *does* cooperate (because B searches for a proof that A cooperates).
      *   The key insight is that the statement "We both cooperate" is a fixed point.
      *   *Correction on User's Text:* The user wrote: "Löb's theorem forces a system to be able to prove that its own consistency is unprovable." This is definitely Gödel's Second Incompleteness Theorem, not Löb's. Löb's is often summarized as "If you can prove that 'if it's provable then it's true', then it's provable." I need to gently correct this without making the user feel stupid.
