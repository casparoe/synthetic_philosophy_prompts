answer: |-
  This is an excellent question that cuts to the heart of Hobbes's ambition to turn politics into a science. You have identified the central tension in Hobbes's epistemology: the conflict between his **constructivist criterion for certainty** (we know what we make) and the **empirical nature of his anthropological premises** (passions, fear, equality).

  For a graduate seminar, it is helpful to frame this not just as a logical error, but as a deliberate methodological gambit that relies on a specific conception of "cause" and "definition." Here is a reconstruction of how Hobbes intends the argument to work, followed by an evaluation of whether it withstands your objection about equivocation.

  ### 1. Reconstruction: How Hobbes Secures Demonstrability

  To understand how Hobbes keeps civil philosophy on the "demonstrable" side, we must look at his specific definition of *scientia* (science) and how it relates to the **Resolutive-Compositive Method**.

  **A. Science as Knowledge of Causes via Construction**
  For Hobbes, to "know" something scientifically is to know its cause. In natural philosophy (physics), we see the effect (e.g., light, heat) but cannot be certain of the cause because we did not generate it. We can only propose hypotheses ("it *may* be this").
  In geometry, we define the figure and generate it. The cause of the triangle's properties is the geometer's act of construction. Therefore, the consequences are necessary.

  **B. The Commonwealth as an "Artificial Man"**
  Hobbes's crucial move in the passage you cited is the claim: *"we make the commonwealth ourselves."*
  He is not claiming we create human beings ex nihilo (which would be God's work). He is claiming we create the **Person of the State**.
  *   **Geometry:** We construct lines and figures out of space/matter.
  *   **Civil Philosophy:** We construct a Sovereign and Subjects out of men and covenants.

  **C. Handling the Empirical Premises (The User's Objection)**
  You note that premises about passions and equality look empirical. Hobbes anticipates this. He treats these not as contingent generalizations (like "most swans are white") but as **universal principles of motion**.
  *   In *De Corpore*, Hobbes argues that psychology is a sub-branch of physics.
  *   However, in the context of Civil Philosophy, he treats passions (fear of death, desire for power) as **axiomatic inputs**.
  *   **The Argument:** Even if our knowledge of *why* we have passions is hypothetical (physics), the fact that we *do* have them is introspectively certain. More importantly, the *demonstration* of civil philosophy does not rest on the *origin* of the passions, but on the **logical implications of the Covenant**.
  *   If Men A, B, and C (driven by passion X) agree to authorize Sovereign S, then **by definition**, S's actions are their actions. This logical relation is the "construction." The passions are merely the *material cause*; the Covenant is the *formal/efficient cause* of the Commonwealth. Since we perform the Covenant, we know the cause of the Commonwealth's authority.

  **D. The Distinction in "Making"**
  Hobbes relies on a distinction between:
  1.  **Natural Generation:** (Physics) We observe it; we don't control the causal chain.
  2.  **Artificial Institution:** (Politics) We stipulate the rules of authorization.
  When Hobbes says "we make the commonwealth," he means we institute the **rules of attribution**. We decide that the Sovereign's will counts as *our* will. This is a normative construction, analogous to defining a geometric figure.

  ### 2. Evaluation: Does the Argument Succeed?

  Your suspicion of equivocation is well-founded. Most modern scholars (e.g., Skinner, Sorell, Martinich) agree that Hobbes is walking a tightrope here. Here is an assessment of where the argument holds and where it slips.

  **A. Where it Succeeds (The Juridical Logic)**
  Hobbes's argument succeeds if we limit the scope of "Civil Philosophy" to the **logic of sovereignty**.
  *   If you accept the definition of "Authorization" (I own whatever he does), then the conclusions about the Sovereign's absolute power follow demonstratively.
  *   In this narrow sense, Hobbes is right: We *do* make the authority relations. They are not discovered in nature; they are stipulated in the covenant. The "science" here is akin to logic or jurisprudence, not sociology.
  *   **Seminar Point:** Hobbes is trying to establish *de jure* authority, not *de facto* stability. The demonstration proves why the Sovereign *has the right* to rule, not necessarily that the state will survive.

  **B. Where it Fails (The Anthropological Gap)**
  The argument fails if "Civil Philosophy" is meant to explain the **stability and function of actual states**.
  *   **The Equivocation:** In geometry, the constructor creates the *properties* of the object. In politics, the constructor (the people) creates the *relation*, but relies on pre-existing objects (humans) with independent causal powers (passions) that the constructor did not make and cannot fully control.
  *   **The Empirical Leak:** If the "material" (human nature) behaves differently than Hobbes's axioms suggest (e.g., if men value honor more than safety, or if they are naturally altruistic), the "construction" collapses. In geometry, a triangle cannot decide to have four sides. In politics, subjects can decide to break the covenant.
  *   **Hypothetical Necessity:** Consequently, civil philosophy becomes conditional: *"If* men are as I describe, *and if* they covenant, *then* the Sovereign has absolute right." This looks suspiciously like the hypothetical reasoning Hobbes condemns in physics ("the causes *may* be").

  **C. The "Introspection" Defense**
  Hobbes might reply that introspection provides the same certainty as construction. In *Leviathan* (Intro), he says "Read thyself." He claims we know the passions not by observing others (induction) but by examining our own minds (intuition).
  *   **Critique:** This is the weakest link. Introspection is notoriously unreliable as a foundation for universal science. By treating introspective generalizations as axiomatic, Hobbes smuggles empirical content into a demonstrative framework.

  ### 3. Seminar Discussion Strategy

  For your seminar, I suggest framing the discussion around the **Normative vs. Descriptive** tension.

  **Key Question for the Group:**
  Is Hobbes claiming that Civil Philosophy is a **predictive science** (like physics aims to be) or a **normative logic** (like geometry/law)?

  *   **If Predictive:** He fails. The "construction" of the state depends on empirical variables (human behavior) he does not control. The equivocation on "making" is fatal.
  *   **If Normative/Logical:** He succeeds. He is demonstrating the *implications* of a specific moral concept (Authorization). The "making" is the act of committing to a definition of political obligation.

  **The "Equivocation" Verdict:**
  You are correct that there is an equivocation on "making."
  *   **Geometry:** Making = Creating the essence and existence of the object.
  *   **Politics:** Making = Arranging pre-existing objects into a new relational structure.
  Hobbes tries to bridge this by arguing that the *essence* of the Commonwealth is purely relational (the Union of Wills). Since we create the relation, we know the essence. However, because the *relata* (the men) are natural bodies with uncertain causal powers, the certainty of the whole system is compromised.

  **Conclusion for the Seminar:**
  Hobbes's passage is a manifesto for **political rationalism**. He wants to rescue politics from the uncertainty of history and prudence. While the epistemic criterion works for the *legal logic* of the covenant, it cannot fully insulate civil philosophy from the uncertainties of natural philosophy because the "material" of politics (human beings) remains part of the natural world, subject to the very causal opacity Hobbes attributes to physics. The argument succeeds as a claim about **legitimacy**, but fails as a claim about **certainty**.

  ### Suggested Secondary Literature for Context
  If your students need further reading on this specific tension:
  *   **Tom Sorell, *Hobbes*:** Excellent on the relationship between Hobbes's physics and politics.
  *   **Quentin Skinner, *Reason and Rhetoric in the Philosophy of Hobbes*:** Discusses the shift from humanist rhetoric to scientific demonstration.
  *   **Noel Malcolm, *Aspects of Hobbes*:** Specifically the essays on Hobbes's philosophy of science and the *De Corpore* connection.
  *   **A.P. Martinich, *The Two Gods of Leviathan*:** Discusses the religious and logical structures, though less focused on the math/physics distinction.

  This reconstruction should give your seminar a robust framework to analyze whether Hobbes's "civil science" is a genuine demonstration or a rhetorical sleight of hand.
