      *   *Schellenberg:* Make sure to explicitly link back to the "non-resistant nonbelief" premise. Schellenberg says: If God loves, He ensures belief is possible without resistance. Pascal says: God ensures belief is *difficult* to filter the resistant.

  6.  **Drafting the Response:** (Mental or scratchpad)
