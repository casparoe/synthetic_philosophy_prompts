      *   *Part 3:* Schellenberg assumes a relationship-focused God. Pascal assumes a holiness-focused God.
      *   *Tone:* Academic, supportive, analytical.

  7.  **Final Polish:** Check for clarity, flow, and ensure both of the user's specific questions are answered directly. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is an excellent pair of questions. You have identified the two precise pressure points where Pascal's Augustinian/Jansenist theology clashes with Schellenberg's analytic, relationship-focused theism. Your professor is right to pair them: Pascal offers a "soul-making" or "moral-filter" theodicy of hiddenness that directly challenges Schellenberg's premise that a perfectly loving God would eliminate non-resistant nonbelief.

  Here is a breakdown of the two tensions you identified, along with a textual defense of how to read Pascal in this context.

  ### 1. Obduracy vs. Sincerity: Punishment or Calibration?

  Your first worry is whether there is a tension between explaining hiddenness as **merited punishment** ("men render themselves so unworthy... it is right that God should refuse") and explaining it as a **real-time calibration** to present sincerity ("willing to appear openly to those who seek Him with all their heart").

  **The Resolution:** In Pascal's theological framework (heavily influenced by Augustine and the Jansenists), these are not competing explanations but rather two descriptions of the same spiritual state.

  *   **Obduracy as Disposition:** For Pascal, "obduracy" (*endurcissement*) is not merely a legal verdict based on past sins; it is a present orientation of the will. It is the state of loving oneself more than God. When Pascal says men render themselves "unworthy," he is describing a heart that is currently turned inward (pride/concupiscence).
  *   **Seeking as the Cure:** The command to seek "with all their heart" is not a work that earns revelation; it is the *condition* of humility required to receive it. God hides to cure the obduracy. If God were manifestly divine (as Schellenberg suggests He should be), the proud would believe out of coercion or self-interest, not out of love.
  *   **No Tension:** Therefore, there is no contradiction between "punishment for obduracy" and "calibration to sincerity." The "punishment" *is* the hiddenness, which is maintained until the "obduracy" turns into "seeking." The hiddenness is the tool God uses to distinguish the proud (who give up or rationalize) from the humble (who seek).

  **Implication for Schellenberg:** Schellenberg assumes a perfectly loving God prioritizes *relationship availability*. Pascal assumes a Holy God prioritizes *moral transformation*. For Pascal, a God who made Himself unmistakably obvious to the obdurate would be enabling their idolatry (loving the gift/blessing rather than the Giver). Thus, the "non-resistant nonbeliever" in Schellenberg's sense might be, in Pascal's eyes, someone who is "resistant" in a deeper, volitional sense—they are not seeking "with all their heart" because their heart is divided by attachment to the world.

  ### 2. Evidential vs. Motivational: What kind of "Visibility"?

  Your second question is crucial: When Pascal says signs are "visible to those who seek Him, and not to those who seek Him not," is he talking about the **availability of evidence** or the **capacity to perceive it**?

  **The Textual Verdict:** The **Motivational/Epistemic** reading is significantly more defensible textually and philosophically within the *Pensées*.

  *   **The Corruption of Reason:** Throughout the *Pensées*, Pascal argues that human reason is corrupted by the Fall ("The heart has its reasons which reason knows nothing of"). He does not typically argue that God physically removes evidence from the retina of the wicked. Rather, he argues that sin clouds the intellect.
  *   **"Disposition" and "Desire":** In the fragment you cited, Pascal uses psychological language: "desire to see," "contrary disposition." This suggests the variable is in the subject, not the object. The "light" and "obscurity" are not changing; the *receptivity* to them is.
  *   **The Nature of "Signs":** For Pascal, the primary "signs" of God are Scripture (prophecy) and the human condition (wretchedness/greatness). These texts and facts exist publicly. A philosopher (the "seeker not") can read the prophecies and see only coincidence; a humble Christian (the "seeker") reads the same text and sees divine orchestration. The evidence is publicly available, but its *significance* is spiritually discerned.

  **Why the Evidential Reading Fails:** If Pascal meant that God literally hides evidence from non-seekers (e.g., miracles only happen when a believer is watching), it would undermine his apologetic project. Pascal spends hundreds of pages trying to present evidence (prophecy, historical arguments) to skeptics. He assumes the evidence is *there*, but that the skeptic lacks the moral humility to weigh it correctly.

  ### Synthesis: How Pascal Replies to Schellenberg

  If we accept the **Motivational Reading** and the **Unified Obduracy/Sincerity View**, Pascal's reply to Schellenberg becomes clear:

  1.  **Redefining "Non-Resistant":** Schellenberg defines non-resistant nonbelief as a lack of propositional belief despite no active opposition to God. Pascal would argue this is psychologically impossible. If one truly desired God ("sought with all their heart"), the "signs" (however ambiguous) would be sufficient to generate belief. Therefore, any nonbelief is, by definition, evidence of a "contrary disposition" (resistance).
  2.  **The Purpose of Ambiguity:** Schellenberg argues hiddenness defeats the purpose of a loving relationship. Pascal argues hiddenness *protects* the purpose of the relationship. If God were obvious, belief would be compelled, and love would be impossible. God remains hidden enough to allow the will to choose Him freely, but revealed enough to allow the will to find Him.
  3.  **The Epistemic Gap:** Schellenberg treats belief as an intellectual state resulting from sufficient evidence. Pascal treats belief as a moral state resulting from a purified will. For Pascal, you cannot have the belief without the moral transformation.

  ### Summary for Your Seminar

  *   **On Tension:** There is no contradiction between obduracy and seeking. Obduracy is the disease; seeking is the symptom of the cure beginning. Hiddenness is the treatment.
  *   **On Visibility:** Pascal is making a **motivational/epistemic claim**. The evidence is objective, but the *noetic effects of sin* prevent the non-seeker from recognizing it as evidence.
  *   **On Schellenberg:** Pascal undermines Schellenberg's first premise (that a perfectly loving God would ensure belief is possible for anyone capable of relationship). Pascal argues a perfectly *Holy* God would ensure belief is possible only for those capable of *humility*.

  If you want to press this in seminar, you might ask: *Does Pascal's view make the evidence for God circular?* (i.e., "You must believe to see the evidence, but you need evidence to believe"). Pascal accepts this circle but argues it is broken by Grace, not by philosophical argument—a move Schellenberg would likely reject as shifting the goalposts from epistemology to theology.
