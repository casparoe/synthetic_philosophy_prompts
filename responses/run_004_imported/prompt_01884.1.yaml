          *   Verdict: No real tension, just a complex anthropology.
      *   **Section 2: Evidential vs. Motivational (The Epistemic Mechanism).**
          *   Analyze "visible to those who seek."
          *   Bring in Pascal's concept of the "Heart" (*le cœur*) and the corruption of reason by concupiscence.
          *   Argue for the Motivational/Epistemic reading. The "signs" (prophecies, nature) exist objectively, but require a purified will to interpret.
          *   Verdict: Motivational reading is textually superior.
      *   **Section 3: Implications for Schellenberg.**
