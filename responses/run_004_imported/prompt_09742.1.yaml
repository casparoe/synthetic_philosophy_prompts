      *   **Why do proponents think it works?** It relies on *logical correlation* or *subjunctive dependence*, not causal influence.
      *   **Key Decision Theories:** Timeless Decision Theory (TDT), Updateless Decision Theory (UDT). These differ from Causal Decision Theory (CDT).
      *   **The Mechanism:** If Agent A and Agent B are sufficiently similar (or can simulate each other perfectly), their decisions are logically linked. If A decides to cooperate, it implies (logically) that B will also decide to cooperate, because B is running a similar algorithm. Therefore, A cooperates *to cause* B to cooperate, not via a signal, but via logical necessity.
      *   **The "Enforcement" Objection:** In standard game theory (Prisoner's Dilemma), defection is dominant because the other player's move is fixed before you choose. In acausal trade, the moves are *not* independent; they are correlated by the shared logic.

  3.  **Address the "Enforcement" Specifics:**
      *   The user thinks enforcement requires *feedback* (checking if the other defected and punishing).
      *   In acausal trade, "punishment" isn't reactive. It's pre-committed logic.
