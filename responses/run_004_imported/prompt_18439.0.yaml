answer: |-
  This is one of the sharpest questions you can ask about *On Certainty*. You have put your finger on the central fault line in contemporary Wittgenstein scholarship. The tension you feel—between hinges as *outside* justification (riverbed) and hinges as *foundations for* justification (certainty)—is exactly what drives the split between the "Non-Propositional" reading (Moyal-Sharrock) and the "Propositional/Entitlement" reading (Wright).

  Here is the breakdown of what is driving the disagreement, why it isn't merely verbal, and whether it actually solves skepticism.

  ### 1. The Core Disagreement: What *Kind* of Thing is a Hinge?

  The disagreement stems from how strictly one reads Wittgenstein's claim that hinges are **"exempt from doubt."**

  **The Non-Propositional Reading (Moyal-Sharrock)**
  *   **The Argument:** If a proposition is known, it must be capable of being doubted and verified. Wittgenstein says hinges cannot be doubted. Therefore, hinges cannot be knowledge claims. In fact, they aren't really "beliefs" or "propositions" at all.
  *   **The Mechanism:** They are **grammatical rules** disguised as empirical statements. When I say "I have two hands," I am not describing my body; I am exhibiting the framework within which description happens.
  *   **The Status:** This is a practical, "animal" certainty. It is embodied know-how. It is arational (not irrational, but prior to rationality).
  *   **Why the Riverbed Metaphor Fits:** The riverbed doesn't flow with the water; it directs the water. It is static while the water moves.

  **The Propositional/Entitlement Reading (Crispin Wright)**
  *   **The Argument:** Hinges *look* like propositions ("The earth exists," "I have hands"). They function in our reasoning as premises. If we treat them as non-propositional, we lose the ability to explain how they support our other beliefs logically.
  *   **The Mechanism:** They are propositions that are **truth-apt** (they can be true or false), but we lack the evidence to prove them. However, we have a rational **entitlement** to accept them because without them, our cognitive projects would fail.
  *   **The Status:** This is a specific *epistemic* status. It is a "warrant without evidence."
  *   **Why the Certainty Metaphor Fits:** We are certain of them, and that certainty is rational, not just psychological.

  ### 2. Why This Is Not Just a Verbal Dispute

  It is tempting to say, "Call it a belief or call it a habit, the result is the same: we don't doubt it." But philosophically, the consequences are radically different.

  **A. Truth-Aptness and Error**
  *   **Wright:** If hinges are propositions, **they can be false.** It is possible (however unlikely) that the world began five minutes ago. Wright's theory must account for the possibility that our entitlement is misplaced. This keeps the door open to skepticism slightly ajar.
  *   **Moyal-Sharrock:** If hinges are rules of grammar/action, **they cannot be false.** You can't say the rules of chess are "false." You can only say we aren't playing chess anymore. If "The earth exists" is a rule, doubting it isn't making an error; it's opting out of the language game.

  **B. The Structure of Rationality**
  *   **Wright:** Preserves the traditional structure of epistemology. We still need to justify why we hold these beliefs. He is trying to *fix* epistemology by adding a new category (Entitlement).
  *   **Moyal-Sharrock:** Suggests traditional epistemology is the problem. By trying to categorize hinges as "knowledge" or "belief," we are making a category mistake. She is trying to *dissolve* the traditional problem.

  **C. The Role of the Skeptic**
  *   **Wright:** The skeptic is asking a legitimate question ("Why believe the world exists?") that requires a legitimate answer ("Because you are entitled to.").
  *   **Moyal-Sharrock:** The skeptic is speaking nonsense. To ask "Why believe the world exists?" utilizes the very framework (language/logic) that presupposes the world exists. The skeptic is sawing off the branch they are sitting on.

  ### 3. Does It Matter? (The Skepticism Payoff)

  This is the most important part for your seminar. Does one reading actually defeat the skeptic while the other fails?

  **Wright's Entitlement: The "Systematic" Defense**
  *   **Pros:** It plays nicely with mainstream analytic epistemology. It allows us to keep using logic and truth-values normally. It acknowledges that we don't have proof but argues we are still rational.
  *   **Cons:** It risks being question-begging. The skeptic asks, "Why are you entitled?" Wright says, "Because you need to be to reason." The skeptic replies, "That's pragmatic, not epistemic." Many argue Wright transforms epistemology into pragmatism without admitting it. It **relabels** the problem more than it solves it. It grants the skeptic that we lack evidence, then tries to argue evidence isn't always needed.

  **Moyal-Sharrock's Enactivism: The "Therapeutic" Defense**
  *   **Pros:** It is arguably more faithful to Wittgenstein's later philosophy. It doesn't try to beat the skeptic at their own game; it changes the game. If hinges are actions, the skeptic's demand for "justification" is misplaced. You don't justify walking; you walk. This **dissolves** the problem.
  *   **Cons:** It is radical. It implies that the foundation of our knowledge is not rational justification but biological/cultural habit. Some find this unsatisfying because it feels like giving up on the search for "Truth." It can look like fideism (belief without reason).

  ### Summary for Your Seminar

  If you want to frame this in class, here is the distinction:

  1.  **Wright** treats *On Certainty* as a work of **Epistemology**. He thinks Wittgenstein is offering a new theory of warrant (Entitlement) to save knowledge from skepticism.
  2.  **Moyal-Sharrock** treats *On Certainty* as a work of **Meta-Epistemology**. She thinks Wittgenstein is showing that the traditional quest for "justified true belief" hits a bedrock that isn't knowledge at all, but action.

  **Which one answers the skeptic?**
  *   If you want an **answer**, go with **Wright**. He gives the skeptic a reasoned reply within the system.
  *   If you want a **dissolution**, go with **Moyal-Sharrock**. She argues the skeptic's question is unintelligible because it tries to doubt the conditions of intelligibility.

  Most Wittgensteinians lean toward Moyal-Sharrock (the therapeutic reading) because Wright's "Entitlement" looks suspiciously like the kind of foundationalism Wittgenstein spent his career critiquing. However, Wright's reading is more useful if you are trying to build a positive epistemic system rather than deconstruct one.

  **The "Gotcha" Question:**
  If you want to provoke discussion, ask this: *"If Wright is right and hinges are propositions that can be false, doesn't that mean our entire system of knowledge is built on assumptions we admit we can't verify? And if Moyal-Sharrock is right and hinges aren't propositions, doesn't that mean the foundation of our knowledge isn't rational at all, but merely biological?"*

  Both readings force us to accept that certainty is not the same as knowledge, which is Wittgenstein's ultimate point.
