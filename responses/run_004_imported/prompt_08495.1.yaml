          *   If only OI is violated, correlations exist, but they can't be used to send a message because outcomes are random (uncontrollable).
      *   *Peaceful Coexistence:* QM violates OI but respects PI. Hence, nonlocal correlations exist, but no superluminal signaling. Relativity is safe *operationally*.

