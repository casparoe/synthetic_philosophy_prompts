          *   R3: Universality. This is the strongest point.
      *   *Talking Past Each Other:* Methodology vs. Metaphysics.
      *   *Rita's Closing Point:* It's an escalation, not a restatement. (Historical coincidence $\rightarrow$ Structural universality).
