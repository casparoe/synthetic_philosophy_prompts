  Quick one for you -- I'm working on a piece about how AI systems (or countries running automated systems) might negotiate high-stakes stuff with each other, and I fell down a rabbit hole on this game theory idea called 'program equilibrium': the notion that if two agents can read each others actual source code before playing something like a one-shot prisoner's dilemma, they can sometimes lock in mutual cooperation without a referee, repeated play, or any outside enforcement. Every draft I write ends up sounding like a textbook footnote, so could you write me a short story (700-900 words) that actually dramatizes this? I don't just want "they read each other's code and learn to trust each other" -- I want it to wrestle with the weird self-referential trap you hit once each side is reasoning about what the other will do about what it will do about what it will do, and show how (or whether) they actually climb out of that loop instead of stalling forever.
