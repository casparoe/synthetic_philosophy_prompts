answer: |-
  **Setting:** *The curb outside the general store. The driver's truck is idling, waiting for the transaction to clear before she pulls away. The engine ticks as it cools. The Hitchhiker (H) stands with her hand in her pocket, fingers wrapped around the envelope of cash. The Friend (F) stands close, voice low and urgent.*

  **F:** Put the envelope away. You're in town. You're alive. The transaction is over.

  **H:** The transaction isn't over until I hand this over. She's waiting.

  **F:** She's waiting for a ghost. Look at the causal structure, please. Back in the desert, your intention caused the ride. That chain is complete. Right here, right now, your action has zero causal leverage on whether the truck stopped. The past is fixed. If you hand over that money, you are strictly poorer, with no causal benefit to show for it.

  **H:** It's not about leverage on the past. It's about leverage on *me*. If I keep this money, I'm acting on a policy that says "defect when the pressure is off."

  **F:** You're acting on a policy that says "maximize utility given current options." That's what rationality *is*. You're treating your past intention like a contract signed by a stranger. You aren't a stranger. You're you, and your situation has changed. In the desert, paying was rational because it caused the ride. Here, paying is irrational because it causes nothing but loss. Why should a rational agent bind herself to a strategy that demands she burn money for no return?

  **H:** Because if I burn the money now, I prove that I'm not the kind of agent who gets picked up in the desert.

  **F:** But you *did* get picked up! That's the data point. You're standing on pavement, not baking in sand. The CDT agent wins here. The CDT agent says, "I will form the intention to pay," gets the ride, and then says, "The intention served its purpose, now I keep the cash." You're alive. That's the win condition. Why are you trying to throw away the prize?

  **H:** Because I didn't get the ride because I *formed* an intention. I got the ride because I *am* the type who follows through. The detector didn't scan my transient mental state; it scanned my disposition. If I defect now, I'm asserting that my disposition is mutable in a way that makes me unpredictable. But if I'm unpredictable, the detector wouldn't have trusted me.

  **F:** This is the mysticism I'm talking about. You're suggesting backward causation. You're saying that your action *now* reaches back through time to toggle the detector's light *then*. It doesn't. The light is already on. The ride is already done. You're trying to maximize the output of a decision algorithm that has already finished running. You can't edit the source code after the compile.

  **H:** I'm not editing the code. I'm executing it. The algorithm isn't "Get to town." The algorithm is "Be a reliable agent." If I stop executing halfway through because the local causal incentives shift, I'm not running the algorithm anymore. I'm running "Be a reliable agent *unless it costs money*." And everyone knows that algorithm. Including drivers with lie detectors.

  **F:** Everyone knows that *CDT* agents defect in this scenario. It's common knowledge. And yet, if a driver knows you're a CDT agent, she knows you'll lie in the desert. So she won't pick you up. So CDT agents die in the desert. I grant you that. But you aren't in the desert. You're in the branch of the multiverse where the driver made a mistake, or where your prior commitment was strong enough to fool the detector *then*. You can't change the fact that you're here. So take the free ride.

  **H:** It wasn't a mistake. The detector is infallible. That means, back in the desert, I *sincerely intended* to pay. If I don't pay now, it means my sincere intention was unstable. It means my "sincerity" is just a cheap signal I flash when I need help. If I walk away with this money, I'm confirming that my intentions are worthless. I'm making myself a liar.

  **F:** You're making yourself a survivor. Look, Parfit called it "rational irrationality," right? He admitted it! He said it's rational to be disposed to pay, but irrational to actually pay. He conceded the point! CDT says you should *wish* you were the type who pays, but you should *act* as the type who keeps the cash. There's no contradiction there. It's just the cost of living in a world where the past is dead.

  **H:** Parfit thought that was a reductio ad absurdum of CDT, not a feature. If a theory of rationality tells me I should wish I were a different kind of agent, the theory is broken. Rationality shouldn't be self-undermining. If I know I'm going to think like you in this moment, I know I won't get the ride. So thinking like you *now* ensures I wouldn't have gotten the ride *then*.

  **F:** No, thinking like me *now* ensures you keep the thousand dollars *now*. You're conflating the decision to *be* a type with the decision to *act* as a type. You can't choose your type anymore. You are what you are. You're a person standing in town with a thousand dollars. The only choice you have is whether to keep it. Why punish yourself for being lucky enough to be the version of you that got picked up?

  **H:** Because I'm not lucky. I'm correlated. Think of it like two calculators. If I have a calculator here, and one in the desert, and they both run the same math, they'll show the same number. Not because one causes the other, but because they share the same logical structure. My decision here is logically linked to the prediction there. If I output "Keep," the logical fact is that I am an agent who outputs "Keep." If I am that agent, the prediction would have been "Keep." If the prediction was "Keep," I'm in the desert.

  **F:** But you're *not* in the desert! That's the empirical fact that crushes your logical subjunctive. You are observing evidence that you are not in the desert. You have to condition on that. Once you condition on being in town, the correlation is screened off. The prediction is already resolved. You're trying to maintain a logical correlation that the physical world has already severed.

  **H:** The physical world hasn't severed it; you're just ignoring the logical layer. If I decide to keep the money, I am asserting that the logical link between my decision and the prediction is broken. But if it's broken, the detector is fallible. If the detector is fallible, I shouldn't have trusted the ride. I'm undermining the very evidence that allows me to stand here safely.

  **F:** You're undermining a counterfactual. You're sacrificing actual dollars to protect a hypothetical consistency. You say you're a "reliable agent." Great. Reliable agents die of thirst if they meet drivers who know they're CDT. But you met a driver who thought you were FDT. You got the benefit of the doubt. Don't return the favor. Take the exploit.

  **H:** It's not an exploit if it costs me my integrity as an agent. If I take the money, I'm a time-inconsistent optimizer. I'm a money pump waiting to happen. Next time, I'll need a contract, a lawyer, enforcement costs. By paying now, I buy the ability to travel without contracts in the future. I'm investing in my reputation as a binding agent.

  **F:** With who? The driver? You'll never see her again. With me? I already know you're arguing against your own self-interest. With the universe? The universe doesn't care about your reputation. You're paying a premium for a brand no one is watching.

  **H:** I'm watching. And the next driver will watch. I don't know which world I'm in until I make the choice. If I choose to keep the money, I'm choosing to live in a world where promises are cheap. I'd rather live in a world where my word is a causal force, even if it costs me today.

  **F:** Your word *was* a causal force. It got you the ride. Now it's just noise. You're worshipping the ghost of a cause that has already effected. Look, I'm not saying you're immoral. Maybe you *should* pay. But don't call it *rational*. Call it charity. Call it honor. But don't pretend it's the output of a decision theory that maximizes expected utility. It doesn't. It maximizes "feeling consistent."

  **H:** And I'm saying consistency *is* utility. If I can't trust my future self to execute the plans of my past self, I can't plan at all. I'm paralyzed. Paying this isn't about the driver. It's about proving to myself that my decisions aren't just reflexes to immediate stimuli. I am not a puppet of the local causal graph.

  **F:** Then you're a puppet of a logical ghost. And you're paying a thousand dollars for the strings.

  **H:** *(Tightening grip on the envelope)* Better than selling them for a thousand dollars.

  **F:** *(Shaking head, stepping back)* Then you're not rational. You're just stubborn.

  **H:** Then you're not winning. You're just stranded.

  *The truck engine revs. The driver looks in the rearview mirror, waiting. The envelope stays in the Hitchhiker's hand, trembling slightly, neither extended nor returned to the pocket.*
