  I'm currently taking a seminar on the mathematical foundations of AI safety, where we just covered Löb's theorem and the Löbian obstacle it poses for self-trusting agents. Please describe the most important implications of this obstacle for the tiling agents problem — whether a self-modifying AI could ever build and fully trust a successor that reasons by exactly its own proof standards — and for the broader prospects of any purely formal solution to self-trust.
