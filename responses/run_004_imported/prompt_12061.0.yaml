answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two coffee cups sit untouched. ELENA (Kantian-leaning) and MARCUS (Reasons-responsiveness) are reviewing draft abstracts.*

  **ELENA:** Look, we agree on the verdict. Huck Finn is morally creditable for helping Jim. That's the data point. The disagreement is whether Huck is a counterexample to the Motive of Duty thesis or the key to unlocking it. I maintain that moral worth is fundamentally about the agent's relation to the moral law. Huck thinks he's violating it. That's a problem.

  **MARCUS:** It's only a problem if you think the agent's *theory* of the moral law matters more than their responsiveness to moral reality. On the Coincident Reasons view—Markovits's formulation—Huck is the paradigm. He is moved by the very facts that make the act right: Jim's suffering, Jim's humanity, their shared history. The fact that Huck labels these facts "sinful" is a cognitive error, a false overlay. It doesn't negate the fact that he is tracking value.

  **ELENA:** But it negates the *moral* character of the tracking. If I help you because I value your humanity, I treat you as an end. If Huck helps Jim while believing Jim is property who deserves escape only as a favor to a friend, he isn't respecting Jim's moral status. He's acting on inclination. You're conflating *right action* with *worthy action*.

  **MARCUS:** I'm not conflating them; I'm decoupling worth from moral self-conception. Consider the alternative. If worth requires thinking "I ought to do this because morality says so," you invite the fetishism objection. You make the agent care more about morality than about the people morality is supposed to protect. Huck cares about Jim. The "Duty-Bot" cares about the Law. Who is better?

  **ELENA:** Let's pressure-test that. I want to construct a case where your view grants worth to someone who intuitively lacks it. Call him **"The Capricious Humanist."**

  **MARCUS:** Go on.

  **ELENA:** Imagine an agent, Sarah. She sees a child drowning. She is moved to save the child solely by the vivid perception of the child's distress—the very right-making features. She jumps in. However, Sarah holds a coherent, explicit normative belief that suffering is morally irrelevant. She thinks, "This child's pain gives me no reason to act, but I have a psychological quirk where I can't stand crying." She saves the child *despite* her normative judgment, not because of it. She tracks the right reasons, Marcus. But she denies they *are* reasons. Does Sarah have moral worth?

  **MARCUS:** That's a sharp case. On a strict reading, Markovits might say yes, provided the motivating reasons coincide with the normative reasons. But...

  **ELENA:** But intuitively, Sarah is morally alienated from her own good deed. She's like a compass that points North while insisting North doesn't exist. Her action is fragile; if her "psychological quirk" changed, she'd let the child drown. She lacks *moral understanding*. If moral worth is about excellence of agency, Sarah fails. She's lucky, not good. Your view seems to reduce worth to a kind of normative luck—happening to be caused by the right facts while holding the wrong beliefs.

  **MARCUS:** I concede that "normative luck" is a vulnerability. If the agent is actively hostile to the reasons, the connection is too tenuous. But let me turn the screw on your Motive of Duty view. I have a case designed to make your "Duty" look like moral blindness.

  **ELENA:** I'm ready.

  **MARCUS:** Consider **"The Conscientious Deferent."** This agent helps Jim escape. But he doesn't help because he cares about Jim. He finds Jim annoying. He doesn't help because he thinks freedom is valuable. He thinks Jim is better off enslaved. He helps *only* because he believes a Divine Command requires it, and he is terrified of sin. He explicitly believes Jim's humanity is irrelevant. He acts *from* the thought that it is required by morality (or God), but he is completely insensitive to the value of the person he is helping. He treats Jim as a mere site for his own moral purity. Elena, on your view, this agent has high moral worth. He is moved by Duty.

  **ELENA:** He is moved by *a* duty. But if his conception of duty is that detached from human value...

  **MARCUS:** That's the point. The Kantian formula requires acting from the representation of the law. It doesn't strictly require empathy. If you grant him worth, you admit that moral worth is compatible with a complete lack of regard for the patient's good, provided the agent regards the *Rule* highly enough. That makes moral worth narcissistic. It's about the agent's purity, not the world's improvement. Huck, who cares about Jim, is better than the Deferent, who cares about his own soul. If your theory says the Deferent is morally superior to Huck, your theory is broken.

  **ELENA:** (Pauses, stirring cold coffee) You've hit the nerve. The "Conscientious Deferent" is the dark shadow of the Motive of Duty view. If I insist that the *thought* of duty is the sole source of worth, I risk valuing moral fetishism over moral substance.

  **MARCUS:** And if I insist that *tracking right features* is sufficient, I risk valencing Sarah the Capricious Humanist, who treats moral reasons as non-existent.

  **ELENA:** So, where do we meet? I need to save the intuition that Huck is worthy without abandoning the idea that morality demands a specific stance. Perhaps I must revise what "Motive of Duty" means. It cannot be a conscious occurrent thought: "I am doing my duty." That's too intellectualized.

  **MARCUS:** Agreed. If it's too intellectual, Huck fails, but so does most of humanity.

  **ELENA:** Instead, maybe the Motive of Duty is a **disposition to recognize authoritative claims**. Huck fails the explicit test, but he passes the dispositional one. When push came to shove, his disposition to respond to Jim's need overrode his mistaken theory. But I have to concede something to you: The content of the duty must be grounded in the value of the patient. I can't defend the Deferent. The "Duty" must be a duty *to Jim*, not just a duty to *Obey*.

  **MARCUS:** That's a significant revision. You're moving from a "Formal Duty" view to a "Material Duty" view. The motive must be duty, but the duty must be constituted by the right-making features.

  **ELENA:** Precisely. I concede that the *object* of the motive matters. But I still maintain that there must be a normative endorsement. Huck implicitly endorses Jim's claim on him, even if he explicitly denies it. What about you? Can you handle Sarah the Capricious Humanist?

  **MARCUS:** (Sighs) No. If Sarah explicitly denies that the child's suffering gives her a reason to act, she is normatively incoherent. To have moral worth, the agent's responsiveness to the reasons must be non-accidental. If they deny the reasons exist, their responsiveness *is* accidental relative to their rational architecture.

  **ELENA:** So you need a stability condition?

  **MARCUS:** Yes. I have to concede that acting on the right-making features isn't enough if the agent is **normatively alienated** from those features. Markovits talks about the "non-accidental" connection. I need to tighten that. It's not enough that the facts cause the action. The agent must, at some level, take those facts to be *worth responding to*. Huck does this implicitly—he risks hell for Jim. That's a valuation. Sarah the Capricious Humanist does not—she treats it as a twitch.

  **ELENA:** So we are converging on a Hybrid View? Moral worth requires: (1) Being moved by the right-making features (your condition), AND (2) A non-accidental alignment between those features and the agent's normative outlook, such that the agent treats the features as authoritative (my condition, softened).

  **MARCUS:** It looks like it. Huck satisfies both. He is moved by Jim's humanity (1), and his willingness to go to hell shows he treats Jim's need as authoritative, overriding his explicit moral theory (2). The Deferent fails (1)—he isn't moved by Jim's humanity. Sarah fails (2)—she doesn't treat the suffering as authoritative.

  **ELENA:** This saves the Motive of Duty intuition without requiring moral self-righteousness. The "Motive" isn't the thought "This is duty." It's the **volitional priority** of the moral reasons over competing inclinations. Huck gives Jim's need priority over his social conditioning. That *is* a form of dutifulness, even if he doesn't name it.

  **MARCUS:** And this saves the Reasons view from the "Luck" objection. It's not luck if the agent's volition aligns with the reasons, even if their propositional beliefs are wrong. We've essentially redefined "Duty" to mean "Responsiveness to Normative Authority" rather than "Obedience to a Code."

  **ELENA:** Which means Huck wasn't acting against conscience, strictly speaking. He was acting against *socially inculcated error* in favor of a deeper, dispositional conscience.

  **MARCUS:** I can live with that. But I warn you, Elena: if you broaden "Duty" to mean "Responding to Value," you're basically admitting I was right all along.

  **ELENA:** (Smiles) And if you add a "Normative Endorsement" condition to your Reasons view, you're admitting that the agent's relation to the Moral Law matters after all.

  **MARCUS:** Touché. So, for the dissertation chapter?

  **ELENA:** We agree Huck has worth. We agree it stems from his responsiveness to Jim's humanity *as a claim*. We disagree on whether calling that claim "Duty" is necessary or just helpful shorthand.

  **MARCUS:** I think we can live with that disagreement. It's verbal, not substantive.

  **ELENA:** Substantive enough to keep us employed, I hope. Shall we draft?

  **MARCUS:** Let's. But I'm keeping the "Conscientious Deferent" example. It's too good to lose.

  **ELENA:** Keep it. I'll use it to show why Duty must be grounded in Value. We'll cite each other.

  **MARCUS:** Deal.
