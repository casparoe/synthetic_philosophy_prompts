answer: |-
  Good morning. Thank you for being here.

  For those of you who know me, you know I spend my days working with wood. I restore antique furniture. My job is to look at a chair or a table that has stood for a hundred years and figure out how it holds weight. I look for the joinery. I look for the stress points. I look for where the structure has been asked to do too much, or where it has been disguised with varnish to hide a crack.

  My mother spent her life doing something very similar, though the material she worked with was not oak or mahogany, but the human mind. She taught philosophy for forty years. And while most of you knew her as a mother, a friend, and a member of this community, a few people in this room know that she spent those forty years circling a single, difficult problem. She worried about whether our thoughts actually *do* anything.

  It sounds like a strange worry. We all feel like our thoughts move us. I decide to lift a cup, and my hand lifts. But my mother was a rigorous thinker. She knew that the physical world is a closed system. Every physical movement has a physical cause. If you trace the motion of my hand back, you find muscles, nerves, neurons, and atoms. You don't find a "thought."

  So, the question she asked at our kitchen table, over homework and over dinner, was this: If the physical brain is already doing all the work of moving the body, is there any room left for the mind to actually cause anything? Or are our thoughts just shadows riding along on the surface of the brain, pretending to steer the ship?

  She never lied to us about the difficulty of this. She was a woman who valued truth over comfort. For a long time, this kept her up at night. She wanted to believe that her love for us, her plans for us, and her decisions about us were real causes. She wanted to believe that she made a difference.

  Eventually, she found a peace with this. It wasn't a simple peace, and I want to be careful to describe it exactly as she held it, because she would not want me to tidy it up now.

  She concluded that the things we *do*—the decisions we make, the plans we form, the commitments we keep—are real. They are functional. They are defined by the work they perform. When she decided to drive us to school, or stayed up to help with a paper, or chose to listen when we were hurting, that was not a ghost moving a machine. That was a physical system realizing a purpose. Her intentions were physically realized in her brain, and through her brain, in her actions.

  So, to my cousins, to her book club, to my children: I need you to know that she did not think her love was a hallucination. She believed her love was a cause. The choices she made to care for us were not epiphenomenal shadows. They were the joinery of our lives. They held weight. When she comforted you, that comfort was a physical event caused by her commitment to you. When she taught you, that teaching was a causal chain initiated by her desire for you to learn. She was convinced that her agency was real, and because her agency was real, the good she did in this world is solid. It is structurally sound.

  But there was a second part to her view, and this is where I must speak for the colleagues and students who knew her work. She drew a line.

  She was willing to say that her *decisions* to love us had causal power. She was not willing to claim that the *feeling* of loving us—the raw, qualitative ache of it, the way the light looked to her, the sheer sensation of grief or joy—was itself pushing the atoms. She refused to functionalize the soul of the experience. She believed that what it *felt like* to be her, to be conscious, was a profound reality, but she would not claim that the feeling itself was the lever that moved the physical world. The lever was the physical realization of her intent. The feeling was the light by which she saw the lever.

  She left that door open. She never closed the book on the mystery of consciousness itself. She accepted that the *work* of love is physical and causal, even if the *quality* of love remains a mystery that doesn't fit neatly into the chain of cause and effect. She would not lie and say the feeling drove the car. She said the driver drove the car, and the feeling was what it was like to be the driver.

  I think about this often when I am restoring a piece. There is the structure, which must hold the weight. And there is the finish, the patina, the way the wood catches the light. The structure does the work. The finish is the experience of it. My mother taught me that the structure of her love was sound. It held us up. She did not need to claim the finish was doing the lifting to know that the chair was sturdy.

  So, how do we mourn her?

  We mourn her by acknowledging the work she did. Not just the published papers, though those matter to the scholars here. But the causal work. The times she changed her mind because of an argument. The times she changed a life because of a choice.

  To the philosophers here: She remained a non-reductive physicalist to the end. She did not succumb to dualism. She did not retreat into mysticism. She held the line that mental properties are not identical to brain states, yet she maintained that intentional states are causally efficacious via local reduction. She did not solve the hard problem of consciousness, and she would be the first to tell you she didn't.

  But to the rest of us: She loved us. And because she believed that love was a matter of action, of decision, and of physical commitment, that love is woven into the fabric of our history. It caused us to be who we are.

  I have spent my life learning how to fix things that are broken. My mother spent her life asking if we were broken to begin with. Her answer was honest. She said we are physical beings, bound by the laws of nature. But she also said that within those laws, there is room for choice. There is room for responsibility. There is room for a mind to matter.

  She is gone now. The physical system that was her has ceased its function. But the effects she caused remain. I am here. You are here. The kindness she initiated is still propagating through this room, through this town, through the work of her students.

  She would not want us to pretend that the feeling of missing her is moving the universe. But she would want us to know that the decision to honor her, the choice to remember her, and the commitment to live as she taught us to live—honestly, rigorously, and with care—those are real causes. Those will move the future.

  The structure holds. The work was done. And it was enough.

  Thank you.
