  2.  **Identify the Core Philosophical Problem:**
      *   This is a classic problem in decision theory and epistemology.
      *   It relates to **Knightian Uncertainty** (risk vs. uncertainty).
      *   It relates to the **Principle of Indifference** (should I assign 1/6 to each face?).
      *   It relates to **Imprecise Probabilities** (representing belief as a set of functions rather than a single number).
      *   It specifically echoes the **Two-Urn Problem** (Ellsberg Paradox) or similar cases of ambiguity aversion.

  3.  **Evaluate the Roommate's Argument (The "Orthodox" Bayesian View):**
      *   *Premise:* You must have a precise credence for everything.
      *   *Application:* By the Principle of Indifference, since you have no evidence favoring any specific bias, you should treat the die as fair (P(6) = 1/6).
      *   *Decision:* If the bet pays out at fair odds (e.g., bet \$1 to win \$5), then P(6) = 1/6 makes it a fair bet. If the odds are better than fair, take it. If the roommate implies "one bet is favorable," she assumes the payout structure favors the house or the user based on the *actual* bias.
      *   *Critique:* This assumes the user *can* form a precise credence of 1/6. But the user feels they *don't know*. Orthodox Bayesianism says "treat unknown symmetry as equality."

