      *   *Decision:* If I have imprecise credences, maximizing expected utility is harder. If the lower bound of P(6) makes Bet A look bad, and the upper bound of P(6) (lower bound of Not-6) makes Bet B look bad (depending on stakes), I might reject both.
      *   *Key Concept:* **Ambiguity Aversion** (Ellsberg Paradox). People prefer known probabilities over unknown ones, even if the math suggests they shouldn't.

