      *   **Move 4 (Declan):** Counters James. James restricts argument to options *undecidable in principle*, not just undecided in one's head. Market signal (160 queries, 0 offers) is clear evidence, not a mystery. Marisol is overriding evidence.
      *   **Move 5 (Noor):** Invokes James's self-fulfilling prophecy (climber/likability). Belief affects the outcome (submission energy/pitch). She is an input, not just a roulette player.

  3.  **Analyze Move 1 (Noor - James: Living, Forced, Momentous):**
