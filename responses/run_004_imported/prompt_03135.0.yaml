answer: |-
  This is one of the most famous objections to David Lewis's modal realism, known as the **"Humphrey Objection,"** originally raised by Saul Kripke.

  To answer your question directly: **No, it does not follow that ordinary modal claims are not true of Humphrey, at least not according to Lewis himself.** Lewis explicitly denies this conclusion. He argues that while Humphrey does not literally exist in other worlds, claims about what Humphrey *could have* done are indeed true of Humphrey, in virtue of what his counterparts do.

  Here is a detailed breakdown of how Lewis defends his theory against this specific charge.

  ### 1. The Distinction Between Truth Conditions and Subject Matter
  Lewis distinguishes between what makes a statement true (its truth conditions) and what the statement is about (its subject matter).

  *   **The Objection:** You are suggesting that because the *truth-maker* is a distinct individual (the counterpart), the *subject* of the claim shifts to that distinct individual.
  *   **Lewis's Reply:** Lewis argues that the statement "Humphrey could have won" is semantically about Humphrey. The counterpart is merely the metaphysical mechanism that grounds the truth of the statement. The counterpart is selected *because* of its relation to Humphrey (its similarity, causal history, etc.). Therefore, the truth of the counterpart's victory counts as a truth about Humphrey's possibilities.

  For Lewis, analyzing "Humphrey could have won" as "A counterpart of Humphrey wins" is not changing the subject; it is providing the **analysis** of what *de re* modality (modality about things) consists of. To ask for more than this is to ask for something unintelligible.

  ### 2. "What Better Could You Want?"
  Lewis's primary rhetorical defense is to ask what alternative the objector proposes. He argues that the rival view—**Transworld Identity** (the idea that Humphrey himself exists in multiple worlds)—faces severe philosophical problems that Counterpart Theory avoids.

  *   **The Problem of Accidental Intrinsics:** If Humphrey exists in two worlds, and has 5 fingers in one and 6 in the other, does he have 5 or 6 fingers? Transworld identity struggles to explain how one object can have incompatible properties. Lewis's world-bound individuals avoid this cleanly.
  *   **Haecceitism:** Transworld identity often relies on "thisness" (haecceities) to track individuals across worlds, which Lewis finds metaphysically suspicious.

  Lewis argues that if Counterpart Theory captures all our intuitive modal judgments (e.g., it is true that Humphrey could have won, false that he could have been a poached egg), then we should accept it even if the metaphysical grounding feels slightly indirect. He famously writes in *On the Plurality of Worlds*:

  > "Humphrey is not in that other world... But his counterpart is, and that is enough to make it true that Humphrey could have won."

  ### 3. The Semantics of *De Re* Modality
  Lewis constructs a formal semantics where modal operators quantify over worlds and counterparts. In his system:

  *   "Possibly, $a$ is $F$" is true iff there is a world $w$ and a counterpart $x$ of $a$ in $w$ such that $x$ is $F$.

  Lewis insists that this logical form preserves the intuition that the claim is about $a$ (Humphrey). The variable $a$ is still the subject of the sentence; the counterpart relation is simply the bridge that allows predicates to apply across the logical space of worlds.

  ### 4. Why the Objection Persists (The Critic's View)
  While Lewis denies that your conclusion follows, many philosophers remain unconvinced by his defense. They argue that Lewis is engaging in a **bait-and-switch**:

  1.  **Ordinary Intuition:** When we say "Humphrey could have won," we intuitively mean that *Humphrey himself*, the very flesh and blood person, might have had a different history.
  2.  **Lewis's Revision:** Lewis tells us that what we *really* mean (or what is *really* true) is that a *similar person* won elsewhere.
  3.  **The Loss:** Critics argue this severs the deep connection between an agent and their possibilities. If Humphrey cares about winning, why should he care that a distinct individual (who is merely similar) wins in another universe? As Kripke put it, Humphrey doesn't care about what someone else does, no matter how much they resemble him.

  ### Summary
  According to **Lewis's own view**, it does **not** follow that modal claims are not true of Humphrey. He maintains that:
  1.  The claims are semantically about Humphrey.
  2.  The existence of a winning counterpart is the correct metaphysical analysis of "Humphrey could have won."
  3.  Demanding that Humphrey himself exist in another world is a demand for an incoherent metaphysics (transworld identity).

  However, Lewis admits this is the "most serious objection" to his theory. He concedes that it feels counterintuitive, but he argues it is a price worth paying for a consistent, paradox-free metaphysics of modality. Whether one accepts his defense usually depends on whether one prioritizes **semantic intuition** (Kripke's side) or **systematic metaphysical consistency** (Lewis's side).
