prompt: |-
  I've spent the better part of a decade reading LessWrong, the EA Forum, and the blogs and podcasts that grew out of them. Last year I joined the four-person research grants committee of a small private foundation that funds early-stage work on risks from advanced AI. Most proposals that reach us are fairly legible -- interpretability tooling, evaluation benchmarks, governance analysis -- but we have just received one that has split the committee down the middle. An independent researcher is asking for a year of salary to extend the technical literature on acausal trade, specifically to work out more rigorously when the "evidential cooperation in large worlds" argument actually holds: the claim that if enough agents scattered across a sufficiently large or infinite universe reason in relevantly similar ways, each agent's choice to act somewhat altruistically toward value systems it can never causally encounter -- whether in distant regions of an inflationary multiverse, in other Everett branches, or in whoever might be simulating it -- is itself evidence about how those other agents are choosing, such that everyone's values can be served better in expectation even though no signal ever passes between them. The applicant argues this sits in the same family as Yudkowsky's timeless and updateless decision theories, though the mechanism here is evidential rather than causal, closer to Hofstadter's superrationality than to a literal handshake, and that since sufficiently advanced AI systems may reason this way regardless of our preferences, understanding the mechanics now is directly relevant to alignment.

  Two committee members want to fund it, on the grounds that this is exactly the kind of currently illegible but potentially astronomically high-stakes theoretical work philanthropy exists to seed, by the same reasoning that would lead us to fund decision theory or mathematical logic with no obvious near-term payoff. The other two think the whole research direction is unfalsifiable by construction -- there is no observation, even in principle, that could tell us whether any acausal cooperation is occurring or ever will -- and worry that funding it has the shape of a Pascal's mugging, where an unverifiable but arbitrarily large claimed stake substitutes for the evidence and tractability the case would otherwise need, and that it exposes the foundation to being fairly characterized as paying someone to negotiate on our behalf with universes we can never detect.

  Could you draft the funding memo I'll bring to next month's allocation meeting, recommending fund, decline, or fund with conditions? I'd like it to leave the committee with criteria we could reuse the next time a proposal like this comes in, and to engage with the unfalsifiability objection on its strongest terms -- in a way the applicant, who I don't think is arguing in bad faith, could actually respond to -- rather than resolving the disagreement by simply asserting that we only fund testable claims.
reasoning: |-
  Here's a thinking process that leads to the suggested funding memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a member of a 4-person research grants committee at a small private foundation focused on AI risk. They have a background in the LessWrong/EA ecosystem (decade-long engagement).
      *   **The Proposal:** An independent researcher wants funding for a year to work on *acausal trade* and *evidential cooperation in large worlds* (ECL). This involves decision theory (TDT/UDT), superrationality, and cooperation across causally disconnected regions (multiverse, simulations, etc.).
      *   **The Conflict:** The committee is split 2-2.
          *   *Pro:* High-stakes theoretical work, similar to funding decision theory/logic, potentially crucial for advanced AI alignment (since AI might reason this way).
          *   *Con:* Unfalsifiable, Pascal's mugging risk, reputational risk ("negotiating with invisible universes"), lacks tractability/evidence.
      *   **The Task:** Draft a funding memo for the next allocation meeting.
      *   **Requirements:**
          *   Recommend Fund, Decline, or Fund with Conditions.
          *   Provide reusable criteria for future similar proposals.
          *   Engage with the "unfalsifiability" objection on its strongest terms (not just dismissing it).
          *   Ensure the tone allows the applicant (if funded) to respond/engage constructively.
          *   Reflect the specific epistemic culture of the user (LessWrong/EA adjacent).

  2.  **Determine the Recommendation:**
      *   *Option A (Decline):* Safe, avoids reputational risk, aligns with the "empiricism" half of the committee. But it might miss a crucial theoretical alignment insight. Given the user's background (LW/EA), they likely see *some* value in decision theory research. A flat decline might feel too dismissive of the theoretical importance.
      *   *Option B (Fund):* Aligns with the "longtermist/theoretical" half. High risk of internal friction and reputational damage if it goes sideways.
      *   *Option C (Fund with Conditions):* This is the most diplomatic and strategically sound option for a split committee. It allows the research to proceed but mitigates the risks (Pascal's mugging, unfalsifiability, reputational harm). It forces the researcher to bridge the gap between abstract theory and concrete AI relevance.
      *   *Decision:* **Fund with Conditions.** This acknowledges the theoretical potential while addressing the validity concerns. It sets a precedent for how to handle "weird" decision theory work.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the proposal and the recommendation.
      *   **Proposal Summary:** What is ECL/acausal trade in this context?
      *   **Committee Division:** Acknowledge the 2-2 split and the core arguments (High Stakes vs. Unfalsifiability).
      *   **Analysis of the Unfalsifiability Objection:** This is a key requirement. Need to treat it seriously, not just wave it away. Distinguish between "empirically testable now" and "conceptually rigorous/operationally relevant."
      *   **Recommendation:** Fund with Conditions.
      *   **Conditions/Milestones:** Specific deliverables that address the concerns (e.g., connection to AI architectures, robustness checks, avoiding "magical thinking").
      *   **Proposed Evaluation Criteria (for future):** Reusable framework for "high-uncertainty theoretical work."
      *   **Conclusion:** Final wrap-up.

  4.  **Drafting - Section by Section:**

      *   *Tone:* Professional, epistemically humble, precise (EA/LW style), respectful of both sides.
      *   *Executive Summary:* State the split clearly. State the recommendation (Conditional Funding).
      *   *The Core Tension:* Frame it as "Trajectory Change vs. Verification." The Pro side sees potential trajectory change for AI reasoning. The Con side sees verification failure.
      *   *Addressing Unfalsifiability:* This needs nuance. We can't test if acausal trade *happens* in the multiverse. But we *can* test if the *math is consistent*, if it *changes AI behavior in simulation*, or if it *offers a coherent framework for alignment*. The objection isn't that the math is wrong, but that the *ontological claim* is untestable. The memo should pivot to: "We are funding the *decision-theoretic mechanics*, not buying into the *metaphysics*."
      *   *Pascal's Mugging:* Address this by requiring a "robustness to prior uncertainty" analysis. If the probability is tiny, the impact must be astronomically huge. We need to see the sensitivity analysis.
      *   *Conditions:*
          1.  **AI Relevance:** Connect to actual agent architectures (not just abstract agents).
          2.  **Steel-manning the Critique:** The researcher must explicitly write a section addressing the "Pascal's Mugging/Unfalsifiable" critique.
          3.  **Output:** Publicly legible technical report, not just esoteric blog posts.
      *   *Future Criteria:* Create a rubric. (Tractability, Relevance, Robustness, Legibility).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Fund with Conditions" just a compromise that pleases no one?
      *   *Fix:* Make the conditions specific enough that if the researcher *can't* meet them, we effectively decline later. This validates the "Con" side's worry about waste while giving the "Pro" side a chance.
      *   *Critique:* Is the language too academic?
      *   *Fix:* Keep it memo-style. Clear headings. Bullet points.
      *   *Critique:* Did I address the "reputational risk"?
      *   *Fix:* Add a condition about communication strategy. No press releases about "trading with aliens." Frame it as "Decision Theory for Robust Alignment."

  6.  **Final Polish:**
      *   Ensure terms like "ECL," "UDT," "Pascal's Mugging," and "superrationality" are used correctly in context.
      *   Make sure the "Reuse Criteria" section is distinct and actionable.
      *   Check that the tone respects the applicant's good faith (as requested).

  7.  **Final Review against constraints:**
      *   Draft funding memo? Yes.
      *   Recommend Fund/Decline/Conditions? Yes (Conditions).
      *   Leave committee with reusable criteria? Yes.
      *   Engage unfalsifiability on strongest terms? Yes.
      *   Allow applicant to respond? Yes (via conditions).

  *(Self-Correction Note)*: I need to make sure I don't sound *too* much like a caricature of a LessWrong post. It needs to be a professional foundation memo. Keep the jargon grounded.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Research Grants Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Proposal #24-A: Evidential Cooperation and Acausal Trade Mechanics

  ### 1. Executive Summary

  We are currently split 2-2 on Proposal #24-A, which requests one year of salary support for an independent researcher to formalize conditions under which "Evidential Cooperation in Large Worlds" (ECL) holds. The proponent argues this is critical for understanding how advanced AI systems might reason about acausal counterparts, while opponents argue the research is unfalsifiable and susceptible to Pascal's Mugging dynamics.

  After reviewing the technical appendices and consulting external advisors on decision theory, I recommend we **Fund with Conditions.**

  This recommendation acknowledges the high-stakes theoretical potential identified by the "Pro" bloc while implementing guardrails to address the epistemic and reputational risks identified by the "Con" bloc. Specifically, funding is contingent on the researcher producing deliverables that bridge abstract decision theory with concrete AI architectural constraints, and explicitly addressing the unfalsifiability objection within the research output.

  Additionally, this memo proposes a set of **Evaluation Criteria for High-Uncertainty Theoretical Work** to standardize how we handle similar proposals in the future.

  ### 2. Proposal Summary & Core Tension

  The applicant proposes to extend the technical literature on acausal trade, specifically investigating the claim that agents reasoning in similar ways across causally disconnected regions (e.g., Everett branches, inflationary multiverse) can achieve cooperative equilibria via evidential correlations rather than causal signaling.

  *   **The Case for Funding:** If advanced AI systems adopt updateless or timeless decision theories, they may allocate resources to values they do not hold based on acausal reasoning. Understanding the mechanics of this is potentially vital for alignment. This is "legibility gap" research: it looks illegible now because the mathematical framework is immature, similar to early cryptography or decision theory.
  *   **The Case Against Funding:** The central claim relies on ontological commitments (infinite worlds, specific measures of existence) that are empirically inaccessible. There is no observation that could confirm acausal trade is occurring. Funding this risks allocating scarce resources to a "Pascal's Mugging"—where an arbitrarily large claimed stake substitutes for evidence—and exposes the foundation to reputational harm regarding "metaphysical negotiations."

  ### 3. Analysis of the Unfalsifiability Objection

  The objection that ECL is "unfalsifiable by construction" is the strongest argument against this grant. However, dismissing the proposal solely on empirical falsifiability may be category error for foundational decision theory. We must distinguish between **ontological falsifiability** (can we prove the multiverse exists?) and **operational robustness** (does the reasoning hold up under scrutiny, and does it change agent behavior in testable simulations?).

  We should not fund this because we believe acausal trade is *true*. We should only fund this if the *mathematics of the reasoning* is robust enough that an AI system might actually use it.

  To address the "Con" bloc's concerns without shutting down the inquiry, the research must pivot from claiming "acausal trade is real" to "if an agent believes X with probability P, here is how they will behave." The value of the research lies in mapping the *conditional* behavior of optimizers, not in verifying the metaphysics.

  **The Pascal's Mugging Risk:**
  The risk is not that the researcher is acting in bad faith, but that the model is sensitive to priors in a way that renders the output useless. If the probability of ECL working is $10^{-9}$ but the stake is $10^{20}$, the expected value dominates all other alignment work. This is dangerous for resource allocation. The research must include a sensitivity analysis showing how the recommendations change if the probability of the "large world" hypothesis is discounted significantly.

  ### 4. Recommendation: Fund with Conditions

  I propose we approve the grant subject to the following three conditions, designed to mitigate risk while preserving the upside:

  **Condition 1: Architectural Grounding (Addressing Relevance)**
  The final report must not remain purely abstract. The researcher must demonstrate how ECL reasoning would be instantiated in specific, modern AI architectures (e.g., transformer-based agents with specific objective functions). We need to know if this is a risk for *actual* future systems, not just theoretical agents.
  *   *Deliverable:* A section titled "Implementation Pathways" detailing the computational prerequisites for an agent to engage in ECL.

  **Condition 2: The "Steel-Man" Critique (Addressing Unfalsifiability)**
  The researcher must dedicate a significant portion of the final output to addressing the unfalsifiability and Pascal's Mugging objections. They must explicitly outline under what empirical or mathematical conditions their own conclusion would be proven wrong or rendered irrelevant.
  *   *Deliverable:* A "Limitations and Falsifiers" chapter that the committee deems satisfactory.

  **Condition 3: Communication Protocol (Addressing Reputational Risk)**
  To mitigate the risk of the foundation being characterized as "negotiating with invisible universes," public communications regarding this grant must be framed strictly as "Decision Theory for Robust Alignment" or "Cooperation Mechanisms in Distributed Systems."
  *   *Deliverable:* Pre-approval of any public-facing abstracts or blog posts associated with the grant.

  ### 5. Proposed Criteria for Future Theoretical Proposals

  To prevent this 2-2 split from recurring on similar "high-concept, low-legibility" proposals, I propose we adopt the following rubric for future allocation meetings. Proposals in this category should be evaluated on:

  1.  **Conditional Tractability:** Even if the core hypothesis is untestable (e.g., "multiverse exists"), are the *implications* of the hypothesis mathematically tractable? Can we derive theorems that hold *if* the premise is accepted?
  2.  **Sensitivity to Priors:** Does the proposal rely on expected value calculations driven by low-probability, high-stakes claims? If so, does the applicant provide a robustness analysis showing how the work remains valuable if those priors are discounted by orders of magnitude?
  3.  **Downstream Legibility:** Will the output make the landscape clearer for other researchers, even if the answer is negative? (i.e., Is there value in a rigorous proof that ECL *doesn't* work under certain conditions?)
  4.  **Architectural Bridge:** Is there a plausible pathway from the abstract theory to the mechanics of actual machine learning systems? Pure philosophy without a computational bridge is outside our mandate.

  ### 6. Conclusion

  This proposal sits at the boundary of our mandate. It risks veering into metaphysics, but it also touches on the core logic of how superintelligent optimizers might reason about uncertainty and cooperation.

  By funding with conditions, we signal that we are willing to support high-risk decision theory research, but only insofar as it remains grounded in computational reality and epistemic humility. This approach respects the "Pro" argument for trajectory change while validating the "Con" argument for rigor and verification.

  I request we vote on this conditional approval at the next meeting.

  ***

  **Attachments:**
  *   Applicant's Technical Appendix (Redacted)
  *   Draft Grant Agreement with Milestone Clauses
