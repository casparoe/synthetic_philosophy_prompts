answer: |-
  **The Arithmetic of Inequity: Resolving the Fairness Trade-off in Algorithmic Risk Assessment**

  The 2016 controversy surrounding the COMPAS recidivism algorithm is often remembered as a scandal about biased code. However, as subsequent analysis by computer scientists and legal scholars has revealed, the conflict between ProPublica and Northpointe (the tool's developer) was not primarily a dispute over bugs or data errors. It was a collision between two mathematically incompatible definitions of fairness. ProPublica demanded error-rate balance, specifically that False Positive Rates (FPR) be equal across racial groups. Northpointe demanded calibration, ensuring that a risk score meant the same thing regardless of race. As the impossibility theorems of Kleinberg, Mullainathan, and Raghavan (2016) and Chouldechova (2017) demonstrated, when two groups have different base rates for the outcome being predicted, it is mathematically impossible to satisfy both definitions simultaneously. This essay argues that because this trade-off is unavoidable, the resolution cannot be statistical; it must be moral. In the context of pretrial detention, where the state deprives individuals of liberty, error-rate balance (specifically False Positive Rate parity) must take precedence over calibration. However, this verdict reverses when the algorithm allocates beneficial resources, such as public health outreach, where the priority shifts to minimizing False Negatives.

  **The Mathematical Bind: Why Base Rates Force a Choice**

  To understand why these fairness metrics conflict, one must look at the relationship between the population being tested and the predictions being made. Imagine two groups, Group A and Group B, being assessed for risk. "Base rate" refers to the actual frequency of the outcome (e.g., reoffending) within each group. Historically, due to complex factors including disparate policing and socioeconomic inequality, observed recidivism base rates have been higher for Black defendants than for white defendants.

  Calibration requires that if the algorithm assigns a risk score of 70% to a set of defendants, roughly 70% of them actually reoffend, regardless of their group. This treats the risk score as a universal probability. Error-rate balance, conversely, looks at the mistakes. It demands that the percentage of *non-reoffenders* who are incorrectly labeled "high risk" (the False Positive Rate) be the same for both groups.

  The conflict arises because the composition of the groups differs. If Group A has a higher base rate of reoffending, it has a smaller pool of "innocent" (non-reoffending) defendants relative to its "guilty" pool compared to Group B. If the algorithm is perfectly calibrated, it identifies risk based on probability. Because Group A has a higher density of risk, a calibrated model will naturally flag a larger portion of Group A as high-risk. While this is statistically accurate, it means that among the people who *do not* reoffend, a higher proportion of Group A members will be caught in that high-risk net than Group B members. In other words, calibration preserves the disparity in base rates, leading to unequal False Positive Rates.

  To equalize the False Positive Rates, the algorithm would have to lower the threshold for labeling Group B members as high-risk, or raise it for Group A. But doing so changes the meaning of the score. A score of 70% would no longer correspond to a 70% chance of reoffending for both groups; it would mean something different depending on race. Thus, unequal base rates act as a wedge: you can have scores that mean the same thing (calibration), or mistakes that are distributed equally (error-rate balance), but you cannot have both.

  **The Normative Case: Liberty and the Priority of Error-Rate Balance**

  Given that we cannot maximize both forms of fairness, we must choose the one that minimizes the gravest moral harm. In the context of pretrial risk assessment, the algorithm informs decisions about detention. The stakes are the deprivation of physical liberty and the presumption of innocence.

  In this punitive setting, the moral priority must be **error-rate balance, specifically False Positive Rate parity.**

  The primary justification for this verdict lies in the asymmetry of harm and the requirements of equal protection. A False Positive in this context represents an individual who would not have reoffended but is detained anyway. This is a direct violation of liberty. If the False Positive Rate is higher for Black defendants than for white defendants, it means that innocent Black defendants are bearing a disproportionate burden of wrongful detention compared to innocent white defendants. This creates a tiered system of justice where the cost of a system error is racially stratified.

  Northpointe's defense of calibration appeals to "accuracy" and "efficiency." A calibrated tool allows a judge to know exactly what probability they are dealing with. However, in a legal system founded on the principle that it is better to let ten guilty persons go free than to punish one innocent person, the efficiency of the prediction is secondary to the protection of the innocent. Prioritizing calibration effectively accepts the existing base rates as immutable facts. If those base rates are themselves the product of historical over-policing or systemic bias, calibration codifies that bias into the future. It ensures that the algorithm is "correctly" reflecting a skewed reality.

  By contrast, prioritizing False Positive Rate parity forces the system to acknowledge that the cost of mistake-making must be shared equally. It demands that the state exercise its power to detain with equal caution across all demographics. While this might reduce the statistical "informativeness" of the score (breaking calibration), it upholds the normative commitment that a citizen's race should not determine the likelihood that the state will erroneously strip them of freedom. Therefore, in the carceral context, the disparate distribution of wrongful punishment is a greater injustice than the loss of statistical calibration.

  **The Context Switch: Beneficial Allocation**

  Does this verdict hold if the algorithm is repurposed for a beneficial program, such as determining eligibility for a public-health outreach service for diabetes prevention? Here, the verdict must change. In a beneficial context, the priority should shift to **False Negative Rate (FNR) parity**, even at the expense of calibration.

  The moral landscape flips because the nature of the error changes. In pretrial detention, the catastrophic error is the False Positive (detaining the safe). In public health outreach, the catastrophic error is the False Negative (failing to reach someone who needs care). If a risk score is used to allocate limited medical resources, a False Negative means a patient is denied preventative care and may suffer deteriorating health.

  If we prioritize calibration in this setting, resources flow strictly to where the probability of disease is highest. If Group A has a higher base rate of diabetes, a calibrated model will direct almost all resources to Group A. While this is medically "efficient," it may leave sick individuals in Group B without care simply because their group's overall prevalence is lower. This violates principles of equity and need.

  In this context, prioritizing False Negative Rate parity ensures that the rate of *missed diagnoses* is equal across groups. It guarantees that if you are sick, your chance of being ignored by the system does not depend on your race. This might require "over-investing" in Group B—offering services to people with lower statistical risk scores to ensure we catch the sick ones. While this breaks calibration (a score of "low risk" in Group B might get the same treatment as "high risk" in Group A), it aligns with the moral imperative of a public health system: to alleviate suffering and ensure access to care. Here, the harm of exclusion outweighs the harm of inefficiency.

  **Conclusion**

  The COMPAS controversy reveals that algorithmic fairness is not a technical setting to be optimized, but a political choice to be debated. The impossibility theorems prove that when base rates differ, mathematics forbids a perfect solution. We are forced to choose which imperfection we can tolerate. In the criminal justice system, where the state wields the power to punish, we must prioritize the equal distribution of error, specifically protecting against the wrongful detention of minority groups through False Positive Rate parity. In beneficial systems like healthcare, we must prioritize the equal distribution of access, protecting against the neglect of minority groups through False Negative Rate parity. In both cases, the verdict is the same in principle but opposite in application: statistical consistency (calibration) must yield whenever it conflicts with the equitable distribution of harm and benefit. To do otherwise is to hide moral choices behind the veil of mathematical neutrality.
