answer: |-
  Here is the breakdown you need for the scene.

  **1. "Duty" and "Interest" are doing two different jobs.**
  Mill is not being redundant. He is building a pincer movement.
  *   **Duty (Justice):** This is the moral argument. It is inherently wrong to keep laws that crush the majority when you have the power to ease them.
  *   **Interest (Prudence):** This is the survival argument. If you don't ease those laws voluntarily, the majority will eventually force the issue, likely violently or destructively.

  Mill is telling the owning class: *You should do this because it's good, but you must do this because it's safe.*

  **2. "In the Right" is about Moral Legitimacy.**
  When Mill says "place themselves in the right," he means **public opinion and historical judgment.**
  He is arguing that if the owners refuse to reform, they hand the socialists a moral weapon. If the owners *do* reform (e.g., profit-sharing), they disarm the radicals. If radicals *still* demand full seizure of the mill after profit-sharing is implemented, the owners can stand before the public and say, "We fixed the injustice; their demand is now greed, not justice."

  It is not about having a "clean conscience" in a private, religious sense. It is about having a defensible position in a political fight.

  **3. How this shapes your character.**
  Your son should not sound purely calculating, nor purely saintly. He should sound like a **pragmatic idealist.**
  *   **If he sounds too calculating:** He's just trying to buy off the workers to stop a strike. (This makes him a conservative in disguise).
  *   **If he sounds too torn:** He's agonizing over sin. (This makes him weak).
  *   **The Millian Sweet Spot:** He genuinely believes profit-sharing is *just*, but he is also sharp enough to see that it is the only way to save the mill from being swallowed by the coming wave of socialism. He isn't resisting change; he is steering it so it doesn't crash.

  **The Verdict for the Dialogue:**
  He shouldn't say, "We must do this so they don't burn the place down."
  He should say, "We must do this because it is just, and because if we don't, we lose the moral ground to keep the place running at all."

  Mill's point is that **self-preservation and morality are now the same thing.** Your son realizes that being a good capitalist now requires acting like a partial socialist. He's not saving the family business *from* the future; he's saving it *for* the future.
