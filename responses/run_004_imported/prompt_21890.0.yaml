answer: |-
  The kitchen light hummed, a low, electric headache of a sound. Imke sat at the table, hands wrapped around a mug she wasn't drinking from. Corvin leaned against the counter, arms crossed. Sella was pacing, the floorboards creaking a rhythmic underscore to the tension.

  "It's not a risk assessment, Corvin," Sella said, stopping to point a finger at him. "It's a life. You don't get to tell her the math doesn't apply just because the variables are weird."

  "The variables aren't weird, they're nonexistent," Corvin said. He didn't look at Sella; he was looking at Imke. "Standard decision theory requires you to weigh the expected utility of the outcomes. To do that, you have to know what the outcome *is*. Imke can't know what it is to be a Crossed. Nobody can."

  "That's just uncertainty," Sella snapped. "I didn't know what it would feel like to lose my parents, but I could still plan for it. I didn't know what it would be like to move to this city, but I could weigh the pros and cons. Life is always lived facing a fog."

  "This isn't fog," Corvin said, pushing off the counter. "Fog implies the landscape is there, you just can't see it yet. The Crossing changes the landscape. It changes the eyes you see it with. It's an epistemic wall. If you choose to Cross, you become someone who literally cannot explain to your current self why it was worth it. The memory of being *you* degrades. So how can current-Imke assign a value to an experience that future-Imke can't even translate back to her?"

  "Testimony," Sella said. "We have hundreds of accounts. They say it's peaceful. They say the pain stops."

  "They say words," Corvin countered. "But they say them like people describing a color to the blind. When a Crossed person says 'peaceful,' they aren't using the same definition of peace you are. Their neural architecture is different. Relying on their testimony isn't reasoning, Sella. It's guessing. It's pretending you have data when you have poetry."

  "So what's your alternative?" Sella threw her hands up. "Because you're telling her not to calculate, but you're not telling her not to decide. If she can't use reason, what's left? Gut feeling? Astrology?"

  "Revelation," Corvin said.

  Sella laughed, a sharp, brittle sound. "Oh, wonderful. So we've moved from philosophy to mysticism. She should just wait for a sign?"

  "No. I mean she has to decide based on whether she wants to *find out*," Corvin said, his voice tightening. "Since she can't value the outcome, she has to value the process of transformation itself. Does she want to remain who she is, even if it kills her? Or does she want to become something new, even if it means the death of the self that chose it? That's the only rational choice left. Not 'will I be happy,' but 'do I want to know what it's like to be someone else?'"

  "That is a leap of faith dressed up in a suit," Sella said, stepping closer to the table, leaning in toward Imke. "You're saying standard reasoning breaks down completely. I'm saying that's cowardice. Just because you can't know the *texture* of the future doesn't mean you can't know the *shape* of it."

  "The shape is a stranger," Corvin said.

  "The shape is survival," Sella shot back. She turned to Imke. "Look, he's right about one thing. The After-Imke won't remember this conversation. She might not even care about the things you care about now. Your art, your grudges, your fear of heights. Maybe she won't have those. But that doesn't mean the decision is irrational. It means the decision is about loyalty."

  "Loyalty to who?" Corvin asked. "To a ghost?"

  "To herself!" Sella slammed her hand on the table. The mug rattled. "Imke, you have values *now*. You value truth. You value continuity. You value not hurting the people who love you. Even if the Crossing wipes your memory, the act of choosing based on *those* values is rational. You aren't deciding for the After-Imke. You're deciding for the Before-Imke. You're asking: 'Can I live with myself if I don't take this chance?' That is a calculable utility."

  Corvin shook his head, a sad, small motion. "That's the trap, Sella. You're treating the After-Imke like a separate person you're doing a favor for. But you aren't. You *are* her. If you Cross, you don't die and get replaced. You change. And if the change is radical enough that you can't understand your own past motivations... then deciding based on your current motivations is a category error. It's like voting in an election for a country that won't exist tomorrow."

  "So she should just close her eyes and point?" Sella demanded.

  "She should acknowledge the limit," Corvin said. "If you try to use logic to bridge a gap that logic can't cross, you're lying to yourself. You're pretending you have control. You don't. The Crossing is an epistemic black hole. The only honest move is to admit you're stepping into the dark. If you step, step because you want to see what's there, not because you think you've solved for X."

  "But 'wanting to see' isn't a reason, it's a whim," Sella said, her voice dropping, quieter but no less intense. "Reason is about using what you have. We have testimony. We have biology. We know the brain survives. We know the pain stops. We know the people who come back don't try to undo it. That's data. Ignoring it because it's not 'perfect' information is intellectual paralysis."

  "It's not paralysis to recognize a tool is broken," Corvin said. "If I ask you to measure the weight of a thought with a scale, and you tell me the scale is useless, are you being paralyzed? Or are you being accurate?"

  "The scale isn't useless," Sella insisted. "You're just demanding it measure something it wasn't built for. It measures probability. The probability of survival is one hundred percent. The probability of psychological change is one hundred percent. The utility of being alive versus being dead is... well, it's the only variable we actually know."

  "Is it?" Corvin looked at Imke again. "Is being alive always better than being dead? For everyone? Even if the 'alive' version of you looks at the 'dead' version and feels nothing but pity? If the Crossing makes you someone who wouldn't choose the Crossing... did you really save a life? Or did you just overwrite a file?"

  Sella went quiet for a moment. She looked at Imke, really looked at her, then back to Corvin.

  "If you overwrite a file," Sella said slowly, "the data is still there, just encoded differently. You're assuming the core self is fragile. I'm assuming it's resilient. And even if it isn't... Imke gets to decide which version of reality she prefers. The one where she fights to stay, or the one where she surrenders to become. That's not a whim, Corvin. That's an ethical stance."

  "An ethical stance requires a consistent moral agent," Corvin said softly. "The Crossing dissolves the agent."

  "Then she decides for the agent she has," Sella said. "Right now. Today. Before the sun goes down."

  "And if today's agent chooses to Cross," Corvin asked, "and tomorrow's agent regrets it but can't remember why?"

  "Then tomorrow's agent deals with it," Sella said. "That's what living is. We make choices our future selves have to clean up. That's not a special problem for the Crossing. That's just being human."

  Corvin sighed, rubbing the back of his neck. "Maybe. Or maybe this is the one time the future self can't clean it up, because the future self won't know there was a mess to begin with."

  He pushed off the counter, walking over to Imke. He rested a hand on her shoulder.

  "I'm not telling you not to go, Imke. I'm telling you not to pretend you can know where you're landing. Don't calculate. Just choose."

  Sella came around the table, standing on Imke's other side.

  "And I'm telling you that choosing without calculating is how people get hurt. You have enough light to see the next step. Use it."

  They both waited. The hum of the light seemed louder now. Imke looked at her hands, then at the mug, then up at the space between them where the truth was supposed to be.
