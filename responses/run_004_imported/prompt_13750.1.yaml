answer: |-
  This is a profound connection to make, and it cuts to the heart of the journalistic ethic. You have correctly identified that the Nyāya position is not a naive "believe everything you hear," but rather a sophisticated claim about the *structure* of communication itself.

  Where the Buddhist epistemologist (like Dharmakīrti) sees testimony as a **hypothesis** ("I infer this person is telling the truth based on past behavior"), the Nyāya philosopher sees testimony as a **transaction** ("Knowledge has been transferred, provided the channel was clear and the source competent").

  For a journalist, this distinction is not merely academic; it changes the workflow of verification. If you treat testimony as inference, you are always looking for *external* proof of the speaker's psychology (are they lying?). If you treat it as a distinct *pramāṇa*, you are looking for *internal* and *contextual* conditions that allow knowledge to flow.

  Here are four specific implications the Nyāya framework offers for your work regarding when a source's word stands alone and when it requires corroboration.

  ### 1. The Single Source is Epistemologically Sufficient (Conditionally)
  In modern reporting, the "two-source rule" is a risk-management policy, not necessarily an epistemological law. The Nyāya view validates the idea that a single testimony *can* constitute knowledge (*pramā*) without independent corroboration, provided the specific conditions of *śabda* are met.

  *   **The Implication:** You do not need to reject a story simply because it rests on one voice. If that voice is an *āpta* (competent/truthful) and the statement meets the structural conditions (see below), the testimony is a valid route to knowledge.
  *   **The Practice:** Instead of asking "Who else can confirm this?" as a first resort, ask "Did the conditions for valid testimony obtain?" If a whistleblower with direct access (competence) gives a detailed, coherent account (grammatical/semantic fitness) with no motive to deceive (non-deceptive), Nyāya suggests you *have* knowledge. Corroboration becomes necessary only if one of these conditions is suspect, not as a blanket requirement.

  ### 2. Shift Verification from "Character" to "Competence" (*Āpta*)
  The Nyāya requirement that the speaker be an *āpta* is often mistranslated as "a good person." In epistemological terms, it means someone who has direct knowledge of the matter and the desire to communicate it accurately.

  *   **The Implication:** Trust is domain-specific, not global. A source might be an *āpta* regarding internal budget meetings but not regarding the scientific data they are citing. The Buddhist reductionist view asks, "Is this person generally reliable?" The Nyāya view asks, "Is this person an *āpta* regarding *this* specific proposition?"
  *   **The Practice:** When evaluating a single source, verify their **proximity to the event** rather than just their general reputation. A liar can be an *āpta* if they are reporting on something they witnessed and have no strategic reason to lie about in that instance. Conversely, a generally honest expert is not an *āpta* if they are speaking outside their lane. Your verification work should focus on establishing *domain competence* rather than moral character.

  ### 3. The "Semantic Fitness" Test (*Yogyatā*)
  Nyāya lists *yogyatā* (semantic fitness or compatibility) as a condition for valid testimony. If a speaker says, "He wet the fire with water," that is fit. If they say, "He wet the fire with kerosene," there is a contradiction in terms that blocks knowledge transfer.

  *   **The Implication:** A story can fail as knowledge not because the source is lying, but because the content is internally incoherent or contradicts established facts known to the hearer. This is your justification for rejecting a source's word without necessarily accusing them of dishonesty.
  *   **The Practice:** Use *yogyatā* as a filter for single-source stories. Does the account contradict physical possibility? Does it contradict public records you already possess? If a source claims a meeting happened at a time you have video evidence they were elsewhere, the *yogyatā* fails. The testimony collapses not because you disproved their intent, but because the proposition itself is incompatible with known reality. This allows you to spike a story based on logical inconsistency rather than requiring a second source to call the first a liar.

  ### 4. The Journalist's Duty to *Tātparya* (Intention)
  Perhaps the most critical condition for Nyāya is *tātparya*—the speaker's intended meaning. Words can be grammatically correct and semantically fit, but if the hearer grasps the wrong intention, knowledge has not occurred.

  *   **The Implication:** Misquoting or decontextualizing a source doesn't just violate ethics; it epistemologically voids the testimony. If you publish a quote that technically matches their words but violates their *tātparya*, you have not published knowledge; you have published noise.
  *   **The Practice:** This argues for a rigorous standard of "right of reply" or context-checking. Before treating a source's word as a standalone *pramāṇa*, you must ensure you have grasped the *tātparya*. This is the philosophical argument for reading quotes back to sources or ensuring you understand the nuance of their position. If you misunderstand the intention, the *pramāṇa* is broken, regardless of the source's honesty.

  ### Summary: The Nyāya Workflow for Trust
  If you adopt the Nyāya stance, your decision matrix for a single-source story changes from **"Can I prove they aren't lying?"** (Inference/Skepticism) to **"Are the conditions for knowledge transfer met?"** (Testimonial Realism).

  1.  **Is the source an *āpta*?** (Do they have direct access and capacity to know?)
  2.  **Is there *ākāṅkṣā*?** (Is the account coherent, or are there gaps that make the sentence incomplete?)
  3.  **Is there *yogyatā*?** (Does the account contradict known facts or logic?)
  4.  **Have I grasped *tātparya*?** (Do I understand what they intend to convey, or am I imposing a narrative?)

  If the answer to all four is yes, Nyāya argues you possess knowledge, and publication is epistemologically sound even without a second source. If any one of these fails, the testimony reverts to mere sound, and corroboration (or rejection) is required. This gives you a philosophical framework to defend single-source reporting when the source is solid, while maintaining rigorous safeguards against hearsay.
