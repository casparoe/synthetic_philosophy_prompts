prompt: |-
  I'm a retired evolutionary biologist (34 years on sexual selection in birds, if it matters) whose spent the last year or so happily reading philosophy now that I don't have grad students to supervise anymore. Recently I got hooked on Sharon Street's "Darwinian Dilemma" paper against moral realism -- her argument that realists owe us an explanation of why natural selection, which pretty clearly shaped our evaluative attitudes because they promoted survival and reproduction rather than because they tracked mind-independent moral truths, would also have made us reliable trackers of those truths. Either there's no link between selection and the independent truths (so our moral beliefs are probably mostly off track), or realists have to posit a wildly convenient coincidence where tracking the truth and being fitness-enhancing just happen to line up. As a biologist this felt very familiar, and, honestly, pretty devastating.

  But then someone in my reading group pointed out the obvious follow-up worry: our logical and arithmetical faculties were surely shaped by selection too (theres a pretty clear fitness payoff for ancestors who could infer and count correctly), yet basically nobody thinks 2+2=4 or modus ponens gets "debunked" this way. So there's got to be some asymmetry that lets math and logic off the hook while morality stays on it. I've run across a few candidate asymmetries in my (admittedly amateur) reading -- that necessary truths make reliability trivially "safe" regardless of the process that produced the belief, that mathematical objects might be "plenitudinous" (every consistent structure exists, so there's nothing external left to fail to track), and that math is indispensable to our best science in a way moral facts aren't. What I'd like is for you to actually mount the hard-nosed case that none of these three moves restores the asymmetry -- argue, as rigorously as you can, for full "companions in guilt": that if Street's dilemma is fatal to robust moral realism, it's equally fatal to mathematical and logical realism, and nobody gets to keep their platonism just because it's about numbers instead of norms. Take each escape route at its strongest rather than swatting down a cartoon version of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired evolutionary biologist (34 years experience, sexual selection in birds). This means they understand natural selection, fitness, adaptation, and the biological grounding of behavior very well. They are not a novice in biology but are an amateur in philosophy (1 year of reading). They appreciate rigor and "hard-nosed" argumentation.
      *   **Topic:** Sharon Street's "Darwinian Dilemma" for moral realism. Specifically, the "Companions in Guilt" objection (why doesn't this debunk math/logic too?).
      *   **Task:** Argue *for* full "Companions in Guilt." That is, argue that Street's dilemma *does* apply to math and logic just as much as morality, and that the standard escape routes (necessary truths, plenitudinarianism, indispensability) fail to restore the asymmetry. The goal is to show that if moral realism falls, mathematical/logical realism falls too.
      *   **Tone:** Rigorous, respectful of expertise, philosophically precise but accessible to someone with a scientific background. No "cartoon versions" of the objections.

  2.  **Deconstruct the Core Argument (Street's Dilemma):**
      *   *Premise 1:* Evolution shaped our evaluative/cognitive faculties for fitness, not truth.
      *   *Premise 2:* Realism posits mind-independent truths.
      *   *Dilemma:* Either (a) Selection tracked truth (implausible coincidence) or (b) Selection didn't track truth (skepticism about our faculties).
      *   *The Challenge:* Why does this kill morality but spare math/logic?

  3.  **Evaluate the Three Escape Routes (and plan the counter-arguments):**

      *   **Escape Route 1: Necessary Truths / Modal Security.**
          *   *Idea:* Math/logic truths are necessary. They couldn't be otherwise. So, even if evolution shaped us, we couldn't have ended up believing $2+2=5$ because that's impossible.
          *   *Counter-argument:* The dilemma isn't about the *truth* of the proposition, but the *reliability of the belief-forming process*. Evolution selects for *behavior*, not belief content directly. An organism could behave *as if* $2+2=4$ while believing $2+2=5$ (if the neural wiring maps "5" to the action of grabbing 4 items). The coincidence is that the neural states causing adaptive behavior *also* correspond to the abstract Platonic truths. The necessity of the truth doesn't explain the alignment of the *psychological state* with that truth.

      *   **Escape Route 2: Plenitudinarianism / Structuralism.**
          *   *Idea:* All consistent mathematical structures exist. We just pick one. There's no "external" fact to miss.
          *   *Counter-argument:* This saves ontology but kills realism in the robust sense Street attacks. If "2+2=4" is true only relative to a chosen structure, it's not mind-independent in the way the realist wants. It becomes a kind of conceptual truth. But Street's target is *robust* realism (mind-independent). If the mathematician retreats to "we just chose Peano Arithmetic," they admit the link between selection and *that specific* structure is coincidental. Why did selection favor Peano over Non-Euclidean arithmetic for counting apples?

      *   **Escape Route 3: Indispensability (Quine-Putnam).**
          *   *Idea:* We need math for science. Science works. Therefore, math is true. Morality isn't needed for physics.
          *   *Counter-argument:* This confuses *utility* with *truth*. Evolution selects for utility (fitness). If math is indispensable for science, and science is indispensable for technology/survival, that just reinforces the evolutionary explanation. It doesn't bridge the gap to *Platonic* truth. It shows math is useful, not that it tracks mind-independent abstract objects. The "miracle" argument (science works, so math must be true) is just the "tracking" horn of the dilemma restated.

  4.  **Synthesize the "Companions in Guilt" Case:**
      *   The core tension is *causal inertness*. Platonic objects (moral or mathematical) don't interact with the physical world. Evolution is a physical process. How does a physical process tune itself to a causally inert realm?
      *   For the biologist: Think of it like sensory perception. Vision tracks light because light causes retinal states. Math/Morality don't cause brain states.
      *   Therefore, the alignment is coincidental in both cases.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's background. Validate their intuition (it *is* devastating). Set the stage: The "Companions in Guilt" strategy is usually defensive, but I will use it offensively to show the rot goes deeper.
      *   *Section 1: The Core Mechanism (Causal Inertness).* Explain why the biological mechanism is the same for both. Evolution selects for *survival-promoting behavior*, not *truth-tracking*.
      *   *Section 2: Tackling Necessary Truths.* Focus on the distinction between the truth of the proposition and the reliability of the believer. Use the "map/territory" analogy. Even if the territory is fixed, why does the map match it?
      *   *Section 3: Tackling Plenitudinarianism.* Show how this concedes the realist point. If we just "picked" the structure, the link to fitness is still coincidental regarding *that* structure's independent validity.
      *   *Section 4: Tackling Indispensability.* Distinguish between instrumental reliability and representational accuracy. Science works (instrumental), but that doesn't prove the ontology (representational).
      *   *Conclusion:* Summarize. If you accept Street on morality, you must be an anti-realist about math/logic too (fictionalism, constructivism, etc.). You can't have your Platonic cake and eat it too.

  6.  **Refining for the User's Expertise:**
      *   Use biological analogies (sensory systems, fitness landscapes).
      *   Avoid overly dense jargon where possible, but don't shy away from precise philosophical terms (e.g., "causal inertness," "doxastic attitudes").
      *   Ensure the tone is collegial (biologist to philosopher/biologist).

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address the "logic" part?
      *   *Correction:* Ensure I mention logical inference (modus ponens) alongside arithmetic. The evolutionary benefit of valid inference is clear, but the link to *logical realism* is the weak point.
      *   *Check:* Is the argument too strong? Am I saying math *isn't* true?
      *   *Correction:* No, I'm arguing that *Realism* (the specific metaphysical view) is undermined. One can be an anti-realist and still use math. Distinguish truth from realist truth.
      *   *Check:* Did I address the "necessary truth" objection strongly enough?
      *   *Correction:* Emphasize that necessity applies to the *object*, not the *belief*. Evolution shapes the belief. The gap remains.

  8.  **Final Polish:** Check flow and clarity. Ensure the "hard-nosed" requirement is met. (The resulting output should match the detailed response provided previously.)
answer: |-
  It is a pleasure to address a colleague who understands the causal machinery of natural selection as intimately as you do. You have correctly identified the fault line in contemporary metaethics. Sharon Street's argument relies on a premise that any evolutionary biologist would sign off on immediately: natural selection is a process that filters for *fitness*, not for *truth*. It filters for organisms that survive and reproduce, regardless of whether their internal representations of the world correspond to mind-independent reality.

  The "Companions in Guilt" objection is typically used by moral realists to save themselves by dragging mathematics down with them. But your request is more radical and, I argue, more philosophically honest: to demonstrate that the escape routes realists propose for mathematics and logic are illusory. If the Darwinian Dilemma kills robust moral realism, it kills robust mathematical and logical realism (Platonism) with equal force.

  Here is the hard-nosed case for why the asymmetry fails, addressing the three specific escape routes you mentioned.

  ### 1. The Core Biological Constraint: Causal Inertness
  Before addressing the specific escapes, we must anchor the argument in the biology you know best. For a belief-forming faculty to be reliably truth-tracking in a realist sense, there must be a causal or explanatory link between the *truth-maker* and the *belief*.

  In visual perception, there is a causal chain: photons reflect off an object, strike the retina, and cause neural states. We can explain the reliability of vision by the causal influence of the object on the observer.

  Street's point, applied to Platonism (whether moral or mathematical), is that the putative truth-makers (moral values, numbers, logical relations) are **causally inert**. They do not exist in space-time; they do not exchange energy; they cannot cause neural firings. Evolution is a physical process acting on physical phenotypes. If the objects of our beliefs cannot causally interact with the physical world, they cannot causally interact with the evolutionary process.

  Therefore, the alignment between our cognitive faculties and these inert truths must be either a miracle (the tracking horn) or a coincidence (the off-track horn). The realist must explain why the fitness landscape happened to align perfectly with the Platonic landscape.

  ### 2. Escape Route One: The "Necessary Truth" Defense
  **The Argument:** Moral truths might be contingent, but mathematical and logical truths are *necessary*. $2+2=4$ is true in all possible worlds. Therefore, even if evolution shaped our beliefs, we couldn't have ended up believing otherwise. The truth is "safe" because it cannot be false.

  **The Counter-Argument:** This conflates the *modal status of the proposition* with the *reliability of the belief-forming process*.

  Street's dilemma is not about whether $2+2=4$ could be false (it couldn't). It is about whether our *belief* that $2+2=4$ is held *because* it is true.

  Imagine an ancestor organism. It needs to distribute resources among offspring to maximize fitness. Let's say the fitness-maximizing behavior corresponds to dividing resources equally (a $1:1$ ratio). Evolution selects for the *behavior* of dividing equally. It does not select for the *propositional attitude* "1 equals 1."

  The organism could possess a neural architecture where the symbol "2" triggers the neural state associated with the quantity 5, provided the downstream motor outputs result in the correct survival-promoting behavior. As long as the internal syntax maps consistently to adaptive behavior, the organism survives. There is no evolutionary pressure to ensure that the internal symbol "2" corresponds to the abstract Platonic entity *Two*.

  The "Necessary Truth" defense fails because necessity applies to the *object*, not the *subject*. Even if the target is immovable (necessary truth), the Darwinian Dilemma asks: Why did the arrow (our cognitive faculty) hit the bullseye? If the arrow was guided by wind currents (selection for fitness) that are independent of the target's location, hitting the bullseye is a cosmic accident. The fact that the bullseye couldn't have moved doesn't explain why the blind archer hit it.

  ### 3. Escape Route Two: Plenitudinarianism / Structuralism
  **The Argument:** Perhaps there isn't one unique realm of numbers. Perhaps all consistent mathematical structures exist (Plenitudinarianism). We simply "chose" Peano Arithmetic because it was useful. Thus, there is no external fact we failed to track; we just selected a useful tool.

  **The Counter-Argument:** This saves the utility of mathematics only by sacrificing the *Realism* Street is attacking.

  Robust Realism (the target of the dilemma) posits that mathematical truths are mind-independent. If the Plenitudinarian says, "All structures exist, we just picked this one," they are admitting that the truth of "$2+2=4$" is relative to our choice of framework. This is a form of constructivism or conventionalism, not Robust Realism.

  If the realist retreats to this position, they concede Street's point: there is no mind-independent fact of the matter that evolution tracked. The link between selection and *this specific structure* is still coincidental. Why did natural selection favor organisms that internalized Peano Arithmetic rather than Non-Standard Analysis?

  If the answer is "because Peano Arithmetic helps us count predators," the realist has shifted grounds. They are now arguing for *instrumental reliability*, not *truth-tracking*. They are saying, "This math works for survival," which is exactly what Street says about morality. If the moral realist says, "Believing in human rights promotes social cohesion and survival," Street replies, "That explains the belief, but not its truth." The mathematical realist who says, "Believing in integers helps us build spears," must accept the same reply: "That explains the belief, but not its correspondence to mind-independent abstract objects."

  ### 4. Escape Route Three: The Indispensability Argument (Quine-Putnam)
  **The Argument:** Mathematics is indispensable to our best scientific theories. Science is empirically successful. Therefore, we ought to believe in the existence of mathematical entities. Morality is not indispensable to physics, so it doesn't get this pass.

  **The Counter-Argument:** This argument confuses *explanatory utility* with *ontological commitment*, and it begs the question against the evolutionary skeptic.

  First, from a biological perspective, the "success of science" is just another fitness-enhancing phenotype. Our ability to model the world mathematically allows us to manipulate it, which increases survival. But this circles back to the first horn of the dilemma: Evolution selected for the *ability to model*, not for the *truth of the ontology*.

  Consider a "fictionalist" view of math. We can use the fiction of numbers to build bridges without believing numbers exist as Platonic objects. The Indispensability Argument claims we *must* believe they exist to explain why the math works. But the evolutionary biologist has a better explanation for why the math works: **We evolved to do math that works.**

  We did not evolve to do math that tracks Platonic heaven; we evolved to do math that tracks *physical regularities*. If the physical world exhibits regularities that are isomorphic to Peano Arithmetic, our brains evolved to latch onto those regularities. The "truth" of the math is grounded in the physical world's structure, not in a separate Platonic realm.

  If the mathematical realist insists that the math works *because* it tracks mind-independent abstract objects, they are positing a "pre-established harmony" between the causal realm (evolution/physics) and the non-causal realm (Platonia). This is the "wild coincidence" Street accuses moral realists of.

  Why is the coincidence less wild for numbers than for values?
  *   **Moral Case:** Evolution selects for "care for offspring." Realist says this tracks "Objective Value of Kin." Coincidence!
  *   **Math Case:** Evolution selects for "track quantities." Realist says this tracks "Objective Number Two." Coincidence!

  In both cases, the physical pressure (fitness) aligns with the non-physical truth (Value/Number). The Indispensability Argument merely asserts that the alignment is too useful to be a coincidence. But Street's point is that *usefulness* is exactly what evolution explains. You don't need Realism to explain utility; you need Realism to explain *truth*. Indispensability proves utility, not truth.

  ### The Conclusion: Full Companions in Guilt
  The asymmetry relies on an intuition that logic and math feel "more objective" than morality. But as a biologist, you know that intuitions about objectivity are themselves adaptations. We feel logic is necessary because organisms that reasoned inconsistently (e.g., believing a predator is present and not present simultaneously) were selected against. The *feeling* of necessity is a fitness heuristic, not a window into Platonia.

  If Street is right that evolution explains our moral faculties without reference to moral truths, the same logic applies to our logical faculties.
  1.  **Causal Isolation:** Neither values nor numbers can cause neural states.
  2.  **Selection for Behavior:** Evolution selected for valid *inference* and accurate *counting* behaviors, not for belief in logical/moral Realism.
  3.  **The Coincidence:** The alignment between the fitness-promoting cognitive structures and the mind-independent truths (if they exist) is unexplained in both cases.

  To accept Street's argument against moral realism while retaining mathematical realism is to engage in special pleading. It requires claiming that evolution is blind to the Good but somehow sighted regarding the True, despite both being causally inert domains.

  The rigorous conclusion is that if you accept the Darwinian Dilemma, you must be an anti-realist (or at least a skeptic) about *all* causally inert domains. You can keep math and logic as indispensable tools, useful fictions, or descriptions of human cognitive structures (naturalized logic). But you cannot keep them as mind-independent Platonic truths without accepting the same "wild coincidence" charge that sinks moral realism.

  The dilemma forces a choice: either abandon Robust Realism across the board (moral, mathematical, logical) or argue that evolution *did* track truth across the board (a teleological view of nature most biologists reject). There is no stable middle ground where morality is debunked but arithmetic remains sacred.
