  Here is a draft argument designed for a graduate seminar context. It isolates the specific theoretical move you wish to challenge and constructs the necessary counter-case to motivate the rival "unfairness" account.

  ***

  ### Title: Beyond Equality: The Unfairness of Confessed Hypocrisy

  **1. The Dominant Account: The Commitment to Equality**
  In the contemporary literature on standing to blame, the dominant strategy for explaining the hypocrisy objection is what we might call the **Equality View**. Proponents of this view (such as R. Jay Wallace or Macalester Bell) argue that blame is a moral address that presupposes a relationship of moral equality between the blamer and the blamee.

  On this account, the hypocrite lacks standing because their behavior implies a denial of this equality. By holding another to a standard they do not apply to themselves, the hypocrite implicitly claims a special exemption from morality's demands. They treat the norm as binding on the blamee but optional for themselves. Consequently, the hypocrite's blame is disqualified because it is internally inconsistent with the presuppositions of moral address: one cannot demand accountability from another while simultaneously denying that one is equally accountable.

  The critical implication of the Equality View is that the defect in hypocrisy is *attitudinal* or *propositional*. It resides in the hypocrite's claim to exceptionalism. Therefore, if a blamer explicitly disavows any special exemption—if they openly admit their own fault and affirm that the norm binds them just as strictly as it binds the blamee—the Equality View suggests their standing should be restored. They have theoretically affirmed moral equality; thus, they should retain the authority to blame.

  **2. The Counter-Case: The Confessed Recidivist**
  To challenge the Equality View, consider the case of **The Confessed Recidivist**.

  > **Case:** Arthur and Beatrice are colleagues and friends. Both have committed to a shared project that requires strict confidentiality regarding sensitive client data. Arthur has a habit of carelessly discussing this data in public spaces. He knows this is wrong. He has been caught doing it multiple times.
  >
  > Beatrice, who is generally more careful, slips up once and discusses a client issue in a semi-public elevator. Arthur discovers this and sharply blames Beatrice. He says:
  >
  > *"Beatrice, what you did was a serious breach of trust. I know I do this too. In fact, I do it far more often than you. I'm not claiming I'm better than you; I'm not claiming I'm exempt from this rule. I know I'm violating it just as much as you are. But despite my own failures, you need to understand that what you did was wrong, and I expect you to stop."*

  Arthur is sincere. He does not believe he is exempt. He explicitly affirms that the norm binds him equally. He admits his own violation is arguably worse. According to the **Equality View**, Arthur should have standing. He has denied no moral equality; he has placed himself beneath Beatrice, if anything.

  However, the intuitive verdict is that Arthur **lacks standing**. Beatrice is justified in dismissing his blame with a response like, *"You are in no position to hold me to this standard."* Arthur's admission of his own guilt does not cleanse his hands; it cements his lack of authority. If the Equality View were correct, Arthur's explicit affirmation of shared subjection to the norm should inoculate him against the charge of hypocrisy. But it does not. The intuition persists that Arthur cannot legitimately enforce a norm he treats as practically optional for himself.

  **3. Why the Equality View Fails**
  The Confessed Recidivist case demonstrates that the loss of standing is not solely about the *denial* of moral equality. Arthur affirms equality, yet loses standing. This suggests that the defect in hypocrisy is not merely a contradiction in the blamer's *claims* (saying "I am exempt" while blaming), but a contradiction in the blamer's *practices*.

  The Equality View focuses on the theoretical status of the agents relative to the law. It asks: *Does the blamer claim to be above the rule?*
  But the Confessed Recidivist shows that standing is also determined by the blamer's practical relationship to the rule. It asks: *Does the blamer treat the rule as genuinely binding in their own conduct?*

  Arthur treats the confidentiality norm as a demand he places on Beatrice, but merely as a regrettable preference for himself. He acknowledges he *ought* to follow it, but his continued, unrepentant violation signals that he does not treat the "ought" as action-guiding. By continuing to violate the norm without effort toward reform, he renders his demand on Beatrice hollow. He is asking her to bear a burden of compliance that he acknowledges is necessary but refuses to shoulder himself.

  **4. Defending the Rival View: The Unfairness of Enforcement**
  This case motivates a rival account, which we might call the **Unfairness View** (championed by philosophers like Kyle Fritz or Daniel Roadevin). On this view, the hypocrite lacks standing not because they deny moral equality, but because their blame constitutes an **unfair enforcement of a standard**.

  Blame is not merely a judgment of wrongness; it is a sanctioning activity. It imposes a burden on the blamee (shame, obligation to apologize, demand for reform). For this imposition to be legitimate, the blamer must participate in a shared practice of accountability.

  In the case of the Confessed Recidivist:
  1.  **The Burden of Compliance:** Norms impose burdens. Beatrice is asked to bear the burden of silence. Arthur refuses to bear this burden.
  2.  **The Burden of Enforcement:** When Arthur blames Beatrice, he imposes a secondary burden (accountability).
  3.  **The Unfairness:** It is unfair to impose the burden of compliance on another while one continues to flout that compliance oneself, *even if one admits it is wrong*.

  The key distinction here is between **theoretical subjection** and **practical subjection**. Arthur is theoretically subjected to the norm (he admits it applies to him). But he is not practically subjected to it (he does not allow it to govern his will).

  The Unfairness View argues that standing requires a "clean hands" condition regarding the *enforcement* of the norm. If I am actively violating a norm, I forfeit the authority to police that norm in others, because my policing amounts to using the other person as a scapegoat or a proxy for my own moral integrity. I am saying, in effect, *"I will not pay the cost of this moral commitment, but I will demand that you pay it."*

  **5. Conclusion**
  The Confessed Recidivist case severs the link between "denying equality" and "losing standing." It shows that one can affirm moral equality in the abstract while lacking the standing to blame in the concrete.

  This supports the conclusion that the ethics of blame is not merely about the logical consistency of our moral claims, but about the fairness of our moral practices. The hypocrite's blame is disqualified not because they claim to be special, but because they make themselves special *in practice* by treating the norm as optional for themselves while mandatory for others. Therefore, the graduate seminar should pivot from analyzing the hypocrite's *beliefs* about equality to analyzing the hypocrite's *conduct* regarding enforcement. Standing is lost not when we deny we are subject to the law, but when we live as though we are not, regardless of what we say.
