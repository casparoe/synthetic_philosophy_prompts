answer: |-
  Here are eight questions drafted for your moderation. They are designed to leverage your background in physiology to ground the philosophical abstractions, pressing the speaker on the specific vulnerabilities of the etiological account.

  **1. The Swampman Intuition**
  "Let's begin with the classic thought experiment. Suppose a lightning strike creates a molecule-for-molecule duplicate of a human—'Swampman'—in a swamp. He has no evolutionary history; no ancestors were selected for his traits. Yet, if you cut his artery, he bleeds, and his heart beats to circulate fluid. On your etiological view, does Swampman's heart have the *function* of pumping blood? If you say no, you contradict the intuition of almost every biologist I know. If you say yes, you seem to abandon the requirement for a selective history."

  *   **Follow-up:** "If you reply that our intuitions are simply wrong and that Swampman's heart has no function, I must ask: In what meaningful sense is his heart distinct from a pump accidentally assembled by waves on a beach? If physiology cannot distinguish them, is 'function' doing any work here at all?"

  **2. The Novel Mutation Problem**
  "Consider a brand-new mutation in a population. It confers an immediate survival advantage, but it has not yet been 'selected' in the historical sense; it hasn't fixed in the population, and it has no ancestral track record. Does this trait have a function the moment it appears? If not, at what precise frequency in the population does it suddenly acquire one? It seems odd to claim a trait is biologically useless until history catches up to it."

  *   **Follow-up:** "If you argue it has a 'causal role' but not a 'proper function' until selection acts, aren't you making 'function' a retrospective label rather than a tool for explaining why the organism survives *now*? Why should physiology wait for history to validate what the mechanism is doing?"

  **3. Vestigial Structures and Current Utility**
  "Take a vestigial structure, like the pelvic bones in a whale. They have a selective history (walking ancestors), but currently, they may do very little, or perhaps they have been co-opted for minor structural support. Your view ties function to the *past* reason for existence. If the current contribution to survival diverges from the historical reason for selection, which one dictates the function? Can a trait have a function that is entirely irrelevant to the organism's current survival?"

  *   **Follow-up:** "If you insist the function remains 'walking' despite the whale never walking, doesn't that sever the link between function and current biological organization? At what point does the historical definition become a mere etymology rather than a description of biological reality?"

  **4. Spandrels and Exaptation (Gould & Lewontin)**
  "Gould and Lewontin argued that many traits are architectural by-products (spandrels) or later co-optations, not direct products of selection for their current use. If a trait arose as a by-product of selection for trait A, but is now essential for trait B, the etiological account says its function is A. But biologists often say the function is B. Why should the historical accident of origin trump the current systemic role that actually keeps the organism alive?"

  *   **Follow-up:** "If you maintain that the function is strictly the historical origin (A), how do you account for the explanatory power biologists get from attributing function B? Are we to ignore the current adaptive value in our functional analyses?"

  **5. Causal-Role Rivals and Malfunction**
  "I'd like you to characterize your rival fairly. A causal-role theorist ties function to what a part currently contributes to a system's capacity. Their weakness is supposedly 'malfunction'—a broken heart isn't pumping, so they might say it has no function. But surely a sophisticated causal-role theorist can appeal to the *type* of capacity the organ is built for, not just its token performance. Why is your historical appeal to 'normativity' superior to a causal account that references the system's current design constraints?"

  *   **Follow-up:** "If you reply that only history provides the 'norm' to judge a malfunction against, isn't that norm simply a statistical average of past performance? If so, why can't a causal account derive that norm from the current population's structural consistency without invoking the past?"

  **6. The Physiologist's Epistemic Access**
  "In my forty years of lab work, I determined function by manipulating mechanisms—clamping a valve, blocking a channel. I rarely had access to the selective history of the species I was studying. If the etiological account is true, does it imply that physiologists have been misidentifying functions all along because we lack fossil records for every trait? Is 'function' in the etiological sense something working biologists can actually know, or is it a metaphysical claim we must take on faith?"

  *   **Follow-up:** "If you say it's a metaphysical claim and not a methodological one, why should biologists care? If the etiological definition doesn't change how we design experiments or interpret data, in what sense is it a theory *of biology* rather than a theory *about* biology?"

  **7. Homology and Divergent Functions**
  "As a comparative physiologist, I study homologous structures across species that have been adapted for different uses—a lung in a fish versus a lung in a mammal. The mechanism is historically continuous, but the selective pressures diverged. Does the etiological account force us to say these homologous organs have entirely different functions simply because the selection pressures split, even if the physiological mechanism remains nearly identical? Does this fracture comparative physiology?"

  *   **Follow-up:** "If you say yes, the functions are different, aren't you prioritizing the *cause of the population's change* over the *causal properties of the organism*? Why should the function of the organ depend on the history of the population rather than the organization of the individual?"

  **8. Falsification and Theoretical Rigidity**
  "Finally, a question on scientific humility. Theories should be vulnerable to evidence. Can you describe a specific biological discovery—a specific trait or evolutionary scenario—that would lead you to abandon the selected-effects view? Or is the theory flexible enough to reinterpret any historical narrative to fit the data, making it unfalsifiable?"

  *   **Follow-up:** "If you cannot conceive of a case that would falsify the view, are we not left with a tautology: 'The function is what was selected,' and 'We know it was selected because it has this function'? How do we break that circle?"
