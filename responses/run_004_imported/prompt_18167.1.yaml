answer: |-
  Here are 10 questions drafted for your Q&A. They are designed to be respectful but rigorous, pushing your colleague to move beyond the general thesis and into the specific mechanical and epistemic tensions of Sidgwick's project. I have included the requested follow-ups to preempt standard deflections.

  ### 1. The Structural Link
  "You've argued convincingly that the SPR work isn't a hobby but a philosophical necessity given the *Methods*. Could you walk us through the specific logical step where evidence of telepathy or survival transitions into a solution for the Dualism of Practical Reason? Is the inference that *any* spiritual reality implies a *moral* government, or is Sidgwick positing a more specific mechanism where virtue is empirically rewarded in the afterlife?"

  *   **Follow-up:** "If she answers that it's about establishing the *possibility* of a moral order rather than the certainty: Does 'possibility' carry enough normative weight to resolve a practical contradiction? Sidgwick seems to need a rational ground for believing duty and interest *will* coincide, not just that they *might*."

  ### 2. The Creery Sisters and Epistemic Standards
  "Sidgwick is famously the philosopher who resigned his Cambridge fellowship because he couldn't honestly affirm the Thirty-Nine Articles. That suggests an exacting standard for evidentiary warrant in matters of belief. Yet, with the Creery sisters, we have years of investigation ending in the discovery of a signaling code and null results. How do you reconcile the Sidgwick who demands logical purity in ethics with the Sidgwick who treats inconclusive or compromised psychical data as a 'live option' rather than a disconfirmation?"

  *   **Follow-up:** "If she invokes 'absence of evidence isn't evidence of absence': Here we aren't talking about a mere absence of data, but the presence of negative data (fraud). At what point does the accumulation of failed experiments shift the burden of proof back, given that he wouldn't tolerate that level of ambiguity in theology?"

  ### 3. The Census of Hallucinations
  "Regarding the Census of Hallucinations: even if the statistical analysis had shown a significant deviation from chance regarding veridical hallucinations, does that actually repair the Dualism? It seems the Census could at best prove a mechanism of information transfer or survival. How does a higher coincidence rate of ghosts translate into the specific cosmic guarantee that *happiness* will be proportioned to *virtue*?"

  *   **Follow-up:** "If she suggests survival implies a moral universe: Couldn't one survive into a morally neutral or even hostile afterlife? How does Sidgwick bridge the gap between 'metaphysical survival' and 'utilitarian harmony' without smuggling in theological assumptions he claims to be testing empirically?"

  ### 4. The Cross-Correspondences
  "I want to press on the cross-correspondences that emerged after Sidgwick's death, where he essentially becomes a data point in his own research program. There is an almost literary neatness to the founder of the SPR becoming a test case for survival via automatic writing. How do we assess the evidentiary value of these correspondences without falling into confirmation bias, and did Sidgwick leave any instructions on how his own 'case' should be weighed against his methodological rules?"

  *   **Follow-up:** "If she argues the evidence is independent of his desires: The interpreters of those scripts were his close colleagues and believers. Given Sidgwick's insistence on impartiality in the *Methods*, how do we account for the social circle of the evidence being identical to the circle of those who *needed* the evidence to be true?"

  ### 5. The Nature of the "Guarantee"
  "In the Concluding Chapter, Sidgwick describes the need for a 'moral government of the universe.' When he turns to the SPR, is he looking for a *deistic* guarantee (a system set up to run justly) or a *theistic* one (an active agent enforcing justice)? The distinction matters because psychical research might prove a system of laws (telepathy) without proving a moral legislator."

  *   **Follow-up:** "If she conflates the two: If the SPR only proves natural laws of the psychic world, doesn't that leave the Egoist with the same problem? Why wouldn't a rational egoist simply exploit psychic laws for self-interest just as they exploit physical laws?"

  ### 6. Methodological Schizophrenia
  "We often teach Sidgwick as the pinnacle of Victorian rationalism. Does engaging seriously with the SPR force us to read the *Methods* differently regarding the role of 'common sense' or 'intuition'? Is there a tension between the utilitarian calculus, which requires public, verifiable data, and psychical research, which often relies on private, subjective testimony?"

  *   **Follow-up:** "If she says he treated them as separate domains: But the SPR work was meant to *save* the ethical domain. If the methods of inquiry are incompatible (public utility vs. private seance), doesn't that undermine the solution he's trying to import back into ethics?"

  ### 7. The "Embarrassment" Narrative
  "You've moved us past the 'embarrassing footnote' narrative. But why do you think that narrative took hold so strongly in the 20th century? Is it just the stigma of parapsychology, or is there a failure in later philosophy to grasp the systematic necessity Sidgwick felt? In other words, did Moore or Broad simply miss the point of why he *had* to do this?"

  *   **Follow-up:** "If she attributes it to general stigma: Is there a risk that by rehabilitating the SPR work, we inadvertently make Sidgwick look *less* rational by modern standards? How do we teach this to students without suggesting his rationality was compromised by his cultural moment?"

  ### 8. Hope vs. Knowledge
  "Sidgwick writes about the 'need to believe' in the Concluding Chapter. Is the SPR work an attempt to convert that 'need to believe' into 'knowledge'? Or is he effectively lowering the epistemic bar for 'knowledge' when the stakes are ethical coherence? I'm asking if this is a search for truth or a search for warrant for a necessary hope."

  *   **Follow-up:** "If she says it's a search for truth: Then why does he persist when the truth-value of the data is so low? If it's a search for warrant for hope, does that admit that the *Methods* ultimately fails on purely rational grounds and requires a pragmatic patch?"

  ### 9. The Dualism Remains?
  "If we accept your reading, does the SPR work actually *solve* the Dualism of Practical Reason, or does it just provide a place to park the problem? Even with SPR evidence, Sidgwick never publicly claimed the Dualism was resolved. Should we read the SPR involvement as an admission that the philosophical argument alone *couldn't* close the system?"

  *   **Follow-up:** "If she says it leaves it 'open': Then what work is the SPR doing? If the ethical system remains unresolved pending further data that never arrives, isn't the practical outcome the same as if he had never joined the SPR?"

  ### 10. Empiricism's Limit
  "Finally, for my students grappling with 19th-century empiricism: Does this episode reveal a limit in Sidgwick's empiricism? He wants to ground ethics in reason and observation, but the 'cosmic guarantee' seems to require something beyond observation. Is the SPR project actually an admission that empiricism cannot fully ground morality without appealing to the non-empirical?"

  *   **Follow-up:** "If she argues he remained an empiricist throughout: Then how do we classify the 'cosmic guarantee'? If it's not empirically verifiable to the standard of the *Methods*, is he not effectively reintroducing the 'dogmatic intuitionism' he critiqued earlier in the book, just under the guise of psychical data?"
