          2.  Include a question on *how* deference blocks future frequency evidence.
          3.  Include a question on the epistemic access of ordinary agents (can they condition on the complete theory?).
          4.  Close with a question comparing Humeanism to Propensity theory (why prefer Humeanism if Propensity avoids undermining?).
          5.  For each question, add a brief follow-up keyed to her likely reply.
      *   **Tone:** Academic, rigorous, probing, but respectful (it's a Q&A).

  2.  **Deconstruct the Speaker's View:**
      *   *Humean Supervenience:* Chances supervene on the total pattern of categorical events (the "Humean Mosaic").
      *   *Undermining Problem:* If chances supervene on the total pattern, then the present chance distribution assigns non-zero probability to future patterns that would make the *present* chance distribution false (i.e., future frequencies that imply different chances).
      *   *Lewis's Solution:* The Principal Principle (PP) needs an "admissibility" clause. We only defer to chance given *admissible* evidence (evidence that doesn't reveal the future).
      *   *Speaker's Solution:* A "New Principle" (NP). Defer unconditionally to the *complete theory of chance* ($T$). $C(A | T \& E) = P(A)$.
      *   *The "Dodge":* When pressed on undermining, she says the evidence $E$ isn't compatible with the true $T$. If $E$ suggests a different frequency, then $T$ wouldn't be the true theory.
      *   *Critique:* This looks like defining "true theory" as "the one that isn't undermined," which is circular or makes the theory ungraspable.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Progressively tighten the noose. Start with clarification, move to technical mechanics, then epistemic access, then circularity, finally comparative metaphysics.

      *   *Question 1 (Setting the Stage):* Focus on the definition of the "complete theory."
