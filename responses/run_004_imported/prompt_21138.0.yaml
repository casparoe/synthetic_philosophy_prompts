answer: |-
  Here are eight questions designed to progressively tighten the pressure on the speaker's defense, moving from clarifications of the view to epistemic implications, and finally to metaphysical alternatives. Each includes a follow-up tailored to the likely Humean/New Principle response.

  **1. The Content of the Complete Theory**
  "To begin, I'd like to clarify the ontology of the 'complete theory of chance' ($T$) in your view. On a Humean picture, $T$ supervenes on the total Humean Mosaic, which includes all past, present, and *future* categorical events. When you instruct us to condition our credences on $T$, are we conditioning on a proposition that implicitly encodes the entire future history of the universe? If so, doesn't $T$ entail the actual future frequencies?"

  *   **Follow-up:** If she agrees that $T$ entails the actual frequencies: "Then if I observe a run of outcomes that deviates significantly from the chance function specified by $T$, haven't I logically proven $T$ false? How can we defer to a theory that our evidence might logically falsify?"

  **2. The Mechanism of Deference**
  "This leads to my second question regarding the mechanics of your solution to undermining. The undermining problem arises because present chances assign non-zero probability to future frequency patterns that would make those present chances false. You propose blocking this by demanding unconditional deference to $T$. Could you state exactly *how* conditioning on $T$ is supposed to block a future frequency from counting as evidence against a present chance assignment? Does the conditional probability function simply cease to update on frequency evidence once $T$ is fixed?"

  *   **Follow-up:** If she says $T$ screens off the evidence: "But if the evidence (the future frequency) is metaphysically incompatible with $T$, then the probability of that evidence given $T$ is zero. How do we avoid the problem of conditioning on propositions with probability zero, or does your view imply we simply cannot conceive of undermining futures?"

  **3. Epistemic Access for Ordinary Agents**
  "Moving to the epistemic implications: The Principal Principle is traditionally meant to guide the credences of finite, temporally situated agents. However, on your view, to apply the norm correctly, an agent must condition on the *complete* theory of chance. Since the complete theory supervenes on the entire history of the world, no ordinary agent can ever be in a position to know $T$. Does this mean your norm is practically useless for actual belief formation, or does it merely relocate the puzzle from 'how to handle undermining' to 'how to estimate a theory we cannot access'?"

  *   **Follow-up:** If she replies that it is an ideal norm for rationality: "If it is purely ideal, how does it solve the *actual* tension agents feel when observed frequencies diverge from posited chances? Does the New Principle offer any guidance on how to update credences in $T$ itself when frequencies look undermining?"

  **4. The 'True Theory' Dodge**
  "I've noticed a pattern in your responses to counterexamples. Whenever a case is raised where frequency evidence seems to unseat a chance hypothesis, your move is to insist that such evidence would not be compatible with the *true* chance theory to begin with. But on a Humean view, the true theory is determined by the pattern of outcomes. If the outcomes look undermining, why isn't the correct conclusion that we have evidence against the current chance hypothesis, rather than evidence that we've misidentified the 'true' theory?"

  *   **Follow-up:** If she insists the Best System Analysis (BSA) selects the theory: "Doesn't this imply that the BSA must weigh simplicity and strength against the specific constraint that the theory cannot be undermined by its own probabilities? Isn't that an ad hoc constraint on theory selection?"

  **5. Circularity and Individuation**
  "This brings me to the issue of circularity. Lewis introduced the 'admissibility' clause to exclude evidence about the future, but critics argued this was poorly defined. You seem to replace 'admissibility' with 'the complete true theory.' But if we individuate the 'true theory' precisely as the one that remains stable in the face of the evidence we actually possess, aren't we making the same move? Is individuating the complete theory this way any less circular than the admissibility clause it replaced, or have we simply shifted the circularity from the evidence clause to the theory clause?"

  *   **Follow-up:** If she denies circularity because the Mosaic fixes $T$: "But we only identify the Mosaic *as a whole* after the fact. To use $T$ now, we are effectively defining the 'true' theory as the one that won't be undermined by the future. Doesn't this make the truth conditions of present chance claims dependent on a future that hasn't happened yet?"

  **6. Temporal Dependence of Present Chances**
  "Following up on that dependency: If the truth of the present chance function depends on the future frequencies (to ensure no undermining occurs), does your view entail that present chance facts are metaphysically dependent on future categorical facts? If so, how do we make sense of chance as a guide for *prediction*? It seems odd to say 'the chance of heads is 50%' if the truth of that statement relies on heads actually occurring 50% of the time in the future."

  *   **Follow-up:** If she accepts the dependence as the cost of Humeanism: "Doesn't this undermine the explanatory role of chance? If the frequencies explain the chances, rather than chances explaining the frequencies, what work is the concept of 'objective chance' actually doing?"

  **7. Updating and Rigidity**
  "Consider the diachronic dimension. If I adopt your New Principle, I treat $T$ as the expert. But scientific practice involves updating our beliefs about what the chance functions *are* based on frequency data. If your view requires us to treat the 'true' $T$ as immune to undermining frequency data, how do you model the rational process of rejecting a chance hypothesis in light of statistical significance? Does your framework allow for the possibility that we are currently wrong about $T$?"

  *   **Follow-up:** If she says we condition on candidate theories $T_i$: "Then the undermining problem re-emerges for each candidate $T_i$. Why does deferring to a *candidate* theory not generate the same problem as deferring to the *true* theory, given that we don't know which one is true?"

  **8. The Propensity Alternative**
  "Finally, I'd like to ask about the metaphysical cost-benefit analysis. A propensity theorist posits chances as physical properties that do not supervene on the pattern of outcomes. Consequently, a propensity account never generates an undermining problem, because future frequencies cannot metaphysically alter present propensities. Given the significant epistemological acrobatics required to save the Humean picture from undermining—redefining admissibility, appealing to complete theories, and accepting future-dependence—why should we prefer your Humean picture at all, rather than accepting non-Humean chances that avoid the problem in the first place?"

  *   **Follow-up:** If she argues for parsimony/ontological economy: "Is ontological parsimony worth the price of making chance epistemologically opaque to the very agents who need to use it? If the propensity theorist can explain why we defer to chance without these complications, haven't they won the explanatory contest?"
