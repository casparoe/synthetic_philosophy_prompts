          *   *Refinement:* Lewis excluded evidence about the future via "admissibility." You exclude it by saying it's not part of the "true theory." Isn't individuating the true theory by its immunity to undermining just as circular as defining admissibility by its immunity to undermining?
          *   *Follow-up:* She will deny circularity, claiming $T$ is fixed by the mosaic. Follow up: But we identify the mosaic *including* the future to fix $T$.

      *   *Question 5 (The "Dodge" Specifics):* Attack the "go-to move."
          *   *Draft:* You keep saying the evidence isn't part of the theory.
