          *   *Refinement:* If I observe a long run of heads, that looks like evidence against a fair coin. You say I should condition on $T$. But if $T$ says it's fair, and I see 1000 heads, why shouldn't I doubt $T$?
          *   *Follow-up:* She will say if $T$ is true, 1000 heads is possible. Follow up: But does it lower the *credence* in $T$?

      *   *Question 3 (Epistemic Access):* Requirement: Ordinary agent/conditioning.
          *   *Draft:* Can humans actually know $T$?
