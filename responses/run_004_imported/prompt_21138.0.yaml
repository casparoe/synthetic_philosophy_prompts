          *   *Follow-up:* She will appeal to the Best System Analysis (BSA). Follow up: Does the BSA weigh simplicity against the specific undermining frequency?

      *   *Question 6 (Temporal Perspective):* Focus on the "now."
          *   *Draft:* What about chances right now?
          *   *Refinement:* Chances are supposed to guide belief *now*. But your $T$ depends on the future. So my present credence depends on facts that don't exist yet. Does this mean present chance facts are metaphysically dependent on the future?
