          *   *Refinement:* Make it about the relationship between the theory and the mosaic. If the theory supervenes on the mosaic, doesn't the mosaic determine the theory?
          *   *Follow-up:* She will likely say $T$ is the best system. Follow up: Does the best system include *all* future facts?

      *   *Question 2 (The Mechanism of Deference):* Requirement: How deference blocks future frequency evidence.
