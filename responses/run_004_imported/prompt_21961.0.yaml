          *   *Evaluation:* This is the "Objective Bayesian" or "Rationalist" stance. Philosophically contentious. Is there a "view from nowhere"?
      *   *Move 4 (Renata):* Attacks the "canonical ignorance" idea. Priors involve modeling choices/dispositions. Uniform priors are ambiguous (Bertrand's Paradox style).
