answer: |-
  The Senior Common Room smelled of stale tobacco, beeswax, and the heavy sweetness of vintage port. Outside, the June evening was fading over the quad, but inside, under the gaslight, the air was thick with unspoken tension. Gerald Fenwick poured the wine, his hand steady despite the friction that had plagued the room since lunch. He looked across the mahogany table at the woman who had turned the University upside down.

  "It is an embarrassment, Elizabeth," Fenwick said, pushing the decanter across the table. "To drag the University into a public debate on American foreign policy twelve years after the fact. We are a seat of learning, not a tribunal."

  Elizabeth Anscombe lit a cigarette, the flare illuminating her sharp, uncompromising features. "Truth is not embarrassed by inconvenience, Gerald. Nor by time. If Truman is a murderer, Convocation should not be shaking his hand."

  "He is being honoured for helping win the war against tyranny," Fenwick countered, leaning back in his leather chair. "You simplify the calculus to the point of breaking. Those cities were nodes in a total war machine. The women in the factories, the children feeding the furnaces—in 1945, a nation mobilised for total war cannot be neatly divided into combatants and innocents. The entire society was the weapon."

  "'Innocent' does not mean morally sinless," Anscombe said, ashing precisely into the tray. "I am not speaking of personal guilt. It means only 'not currently engaged in harming'. They were not soldiers. They were not holding guns. To target them is to target the innocent directly as a means to an end. That is murder, whatever the strategic victory."

  "And if letting them live means prolonging the war?" Fenwick pressed, his voice rising slightly. "Means more dead soldiers, more dead civilians elsewhere? No absolute prohibition survives contact with a war of that kind. The responsibility of leadership is to prevent the greater slaughter. You cannot demand moral purity from men who had to stop a genocide with the tools available."

  "Dispute the intention if you wish," Anscombe said, "but the method was the killing of non-combatants to force a hand. It was not a side-effect; it was the mechanism."

  "It was the only mechanism that worked," Fenwick said, his tone hardening. "Utilitarian necessity overrides abstract prohibition when civilization hangs in the balance. If you break the rule to save the world, the rule was too fragile for the world."

  "It was the demand for Unconditional Surrender that made such methods seem necessary in the first place," Anscombe said, her voice cutting through his warmth. "We closed the door to negotiation, then claimed the bombing was the only key left. That is not necessity; that is a contrived desperation. We made the situation where murder appeared useful."

  "Civilization does not hang on the breaking of moral laws," Anscombe added, before he could interrupt. "It hangs on keeping them, especially when it is difficult. If we say the end justifies the means, we have already lost."

  They sat in silence for a moment, the port untouched between them, the gulf between them unbridgeable. Fenwick swirled the glass, watching the legs of the wine.

  "Where you go wrong is assuming moral rules exist in a vacuum separate from the consequences of obeying them," Fenwick said quietly.

  Anscombe met his gaze, unblinking. "Where you go wrong is believing that a good outcome can ever justify an evil act."
