      The Senior Common Room smelled of stale tobacco and mahogany. Fenwick poured the port, his hand steady despite the tension.
      "It is an embarrassment, Elizabeth," Fenwick said. "To drag the University into a debate on American foreign policy twelve years after the fact."
      Anscombe lit a cigarette, the flare illuminating her sharp features. "Truth is not embarrassed by inconvenience, Gerald. Nor by time."
      "This isn't about truth. It's about honouring a man who helped win the war against tyranny."
      "He is being honoured for murder," Anscombe said flatly. "The deliberate killing of civilian populations as a means to end the war is murder, whatever it achieved."
      Fenwick leaned back. "You simplify the calculus. Those cities were nodes in a total war machine. The women in the factories, the children feeding the furnaces—in 1945, a nation mobilised for total war cannot be neatly divided into combatants and innocents."
      "'Innocent' does not mean morally sinless," Anscombe countered, ashing precisely into the tray. "It means only 'not currently engaged in harming'. They were not soldiers. They were not holding guns. To target them is to target the innocent directly."
      "And if letting them live means prolonging the war? Means more dead soldiers, more dead civilians elsewhere?" Fenwick pressed. "No absolute prohibition survives contact with a war of that kind. The responsibility of leadership is to prevent the greater slaughter."
      "It was the demand for Unconditional Surrender that made such methods seem necessary in the first place," Anscombe said. "We closed the door to negotiation, then claimed the bombing was the only key left. That is not necessity; that is a contrived desperation."
      "It was the only key that worked," Fenwick said, his voice hardening. "You sit here in Oxford and demand moral purity from men who had to stop a genocide with the tools available. Utilitarian necessity overrides abstract prohibition when civilization hangs in the balance."
      "Civilization does not hang on the breaking of moral laws," Anscombe replied. "It hangs on keeping them."
      They sat in silence for a moment, the port untouched between them.
      Fenwick sighed. "Where you go wrong is assuming moral rules exist in a vacuum separate from the consequences of obeying them."
      Anscombe shook her head. "Where you go wrong is believing that a good outcome can ever justify an evil act."

