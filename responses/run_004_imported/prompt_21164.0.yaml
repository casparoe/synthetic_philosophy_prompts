      *   **Round 1: The Charge of Contradiction.**
          *   Nyaya: You say "It is" and "It is not." This violates *abādhita* (non-contradiction).
          *   Jain: *Syāt* isn't "maybe." It's "from this perspective." Relativize predicates (substance, time, place).
          *   Nyaya: If you relativize everything, do you ever speak of the thing *itself*?
      *   **Round 2: The Standpoints (*Naya*).**
