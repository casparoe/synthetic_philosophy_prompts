      *   **Round 3: The Self-Reference Objection.**
          *   Nyaya: Is the claim "All truths are partial" itself partial? If yes, it's not universally true. If no, it contradicts itself.
          *   Jain: It is a *pramāṇa* statement about the structure of finite cognition, not a claim about the object itself. It holds for all *nayas*, including itself, but without invalidating its utility.
          *   Nyaya: Utility isn't Truth.
      *   **Round 4: Omniscience and Reality.**
          *   Jain: Only the *Kevalin* sees the whole. We are finite.
          *   Nyaya: Then your logic is a logic of ignorance, not reality.
          *   Jain: No, it's a logic of *access* to reality.
      *   **Conclusion:** The Meta-Logical Turn.
          *   Do they agree? They agree on the complexity of reality (*vastu*). They disagree on whether logic should map the *object* (Nyaya) or the *cognitive access* (Jain).
          *   End with a nod to the physicist's intuition (Bohr).

  4.  **Refining the Arguments (Self-Correction during drafting):**
