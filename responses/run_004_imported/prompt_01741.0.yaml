answer: |-
  It is a pleasure to address a colleague who approaches philosophy with the rigor of an experimentalist. Your intuition is not only sound; it is historically prestigious. Frank Ramsey himself proposed the test you describe in 1929, and many find it natural to view conditionals as a single cognitive operation of hypothetical supposition.

  However, the divergence you observe between the Adams/Probabilistic camp (indicatives) and the Stalnaker/Lewis/Possible-Worlds camp (counterfactuals) is not merely philosophical turf wars or notational inertia. It arises because, despite their surface similarity, the two constructions behave differently under logical stress tests.

  Here is why philosophers generally resist reducing one to the other, structured around the specific hurdles that prevent a unified semantics.

  ### 1. The "Minimal Pair" Problem
  The most immediate obstacle to your hypothesis that they are the "same inference" is that indicative and counterfactual conditionals can have **different truth values** even when the speaker's epistemic state is identical.

  Consider the classic DeRose example regarding the Kennedy assassination:
  *   **Indicative:** "If Oswald didn't kill Kennedy, someone else did."
  *   **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have."

  In our actual epistemic state (knowing Kennedy was killed), the **indicative** is almost certainly true. We know *someone* killed him; if it wasn't Oswald, the probability mass shifts to another assassin.
  However, the **counterfactual** is likely false. It implies a conspiracy or a structural necessity that another assassin was waiting in the wings. Most historians believe that if Oswald had abstained, Kennedy would have lived (at least in that motorcade).

  If the two conditionals were merely the same inference dressed up differently based on what we know, they should track each other. The fact that they diverge suggests they are tracking different relationships: the indicative tracks **evidential support** (given what we know, what follows?), while the counterfactual tracks **causal or structural dependence** (given a change in history, what follows?).

  ### 2. The Triviality Results (The Mathematical Block)
  You mentioned that one framework ought to reduce to the other. In the 1970s, David Lewis proved a series of "triviality results" that suggest this reduction is mathematically impossible if we want to preserve standard probability theory.

  Your intuition aligns with **Adams' Thesis**: that the probability of a conditional $P(A \to C)$ is equal to the conditional probability $P(C|A)$. This works beautifully for indicatives.
  However, Lewis showed that if you treat the conditional $A \to C$ as a standard proposition that can be true or false, and you require its probability to always equal $P(C|A)$, the only probability functions that satisfy this are **trivial** (they assign probability 0 or 1 to everything).

  In short: You cannot have a logic where conditionals are truth-apt propositions *and* obey the Ramsey/Adams probability rule, unless the world is deterministic and you know everything.
  *   **Consequence:** Philosophers split the labor. **Adams** saved the probability rule by denying indicatives have truth conditions (they have "assertibility" instead). **Lewis/Stalnaker** saved truth conditions by using possible worlds, but abandoned the idea that the probability of the conditional is simply the conditional probability.

  ### 3. Causality vs. Correlation (The Scientist's Distinction)
  As an experimentalist, you know the difference between a control group (causal isolation) and an observational cohort (correlation). This distinction maps surprisingly well onto the indicative/counterfactual split.

  *   **Indicatives are often diagnostic.** "If the assay failed, the culture was contaminated." This relies on correlation and Bayesian updating. It is about what the failure *tells us* about the past.
  *   **Counterfactuals are often causal.** "If the culture had been contaminated, the assay would have failed." This relies on a model of the mechanism. It is about what the contamination *does* to the assay.

  In causal modeling (e.g., Judea Pearl's work, which bridges computer science and philosophy), this is the difference between **conditioning** ($P(Y|X)$) and **intervention** ($P(Y|do(X))$).
  *   The indicative corresponds to conditioning on $X$.
  *   The counterfactual corresponds to intervening on $X$ (setting $X$ to true in a model where it was false) and seeing if $Y$ follows.

  Because $P(Y|X) \neq P(Y|do(X))$ in the presence of confounders, the semantics must differ. The possible-worlds semantics (specifically Lewis's) attempts to model the "intervention" by selecting the closest world where the antecedent is true *without* violating laws of nature, whereas the indicative simply updates the knowledge base.

  ### 4. Temporal and Metaphysical Asymmetry
  There is a subtle asymmetry in how we treat the past.
  *   **Indicatives** allow us to be uncertain about the past. "If Napoleon was at Waterloo, he was tired." We treat the past as a variable in our epistemic state.
  *   **Counterfactuals** usually require us to hold the past fixed up to the point of divergence. "If Napoleon had left Waterloo early..." We assume the history leading up to that moment remains as similar to actuality as possible.

  If you try to use the counterfactual machinery for indicatives, you get the wrong results (because you enforce too much similarity to the actual world). If you use indicative machinery for counterfactuals, you get the wrong results (because you allow "backtracking" that violates causal laws).

  ### Which is More Fundamental?
  To answer your specific question: **Neither is currently taken to be strictly more fundamental, but the trend is shifting.**

  1.  **The Traditional View:** Counterfactuals are metaphysically deeper (about the structure of reality), while indicatives are epistemically shallower (about speech and belief).
  2.  **The Modern Trend (Causal Modeling):** Many philosophers of science and language (like Hannes Leitgeb, James Woodward, and Karen Lewis) are moving toward **causal models** as the fundamental machinery. In this framework, both conditionals are evaluated against a structural equation model.
      *   The **counterfactual** is an intervention on the model.
      *   The **indicative** is a Bayesian update on the model.

  This vindicates your intuition that there is a *single underlying structure* (the model of the world), but it confirms the philosophers' insistence that the *operations* performed on that structure differ.

  ### Why the Persistence?
  The two frameworks persist because they solve different problems.
  *   **Adams/Probabilistic:** Explains why we bet on indicatives the way we do (matching conditional probability).
  *   **Lewis/Possible Worlds:** Explains why counterfactuals have truth values independent of our knowledge (allowing us to be wrong about what *would* have happened).

  If you force the Possible Worlds semantics onto indicatives, you cannot explain why "If Oswald didn't kill Kennedy, someone else did" is assertible while "If Oswald hadn't..." is not. If you force the Probabilistic semantics onto counterfactuals, you cannot explain why we argue about them as if they are true or false regardless of our evidence.

  ### Summary
  Your retirement puzzle touches on the cutting edge of the field. The "Unified Theory" you suspect exists is currently being pursued under the banner of **Causal Semantics**. However, the consensus is that while the *cognitive substrate* (the Ramsey test) may be unified, the *semantic value* differs.

  The indicative asks: **"Given my current information, how strongly does A support C?"**
  The counterfactual asks: **"Given the causal structure of the world, would A produce C?"**

  In your experimental terms: The indicative is the p-value of the correlation in your dataset; the counterfactual is the causal estimate derived from your randomized control trial. They look similar mathematically, but they answer fundamentally different questions about the world.
