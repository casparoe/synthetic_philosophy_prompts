answer: |-
  It is a pleasure to address a colleague with your background. Your confusion is entirely understandable; in fact, it reflects a divergence that has grown over the last forty years between the *pedagogical* presentation of Bell's theorem (common in physics textbooks) and the *foundational* analysis (common in philosophy of physics).

  The short answer is that you are interpreting "Locality" as **Signal Locality** (no superluminal communication) and "Realism" as **Counterfactual Definiteness** (pre-existing values). Under those definitions, your statement is correct: Copenhagen QM is local but non-realist.

  However, philosophers of physics (and John Bell himself in his later work) argue that this dichotomy is a false one. They contend that Quantum Mechanics violates a deeper principle called **Bell Locality** (or Local Causality), regardless of whether you assign definite values to observables prior to measurement.

  Here is a breakdown of what is missing from the standard textbook narrative, structured by the key conceptual shifts.

  ### 1. The Evolution of Bell's Definition of Locality
  In his famous 1964 paper, Bell derived his inequality assuming deterministic hidden variables. This gave rise to the popular narrative: "QM violates the inequality, so it can't have local hidden variables." This allows the Copenhagen interpretation to claim victory by saying, "We never had hidden variables to begin with."

  However, Bell was dissatisfied with this reading. In 1976 and subsequent works, he reformulated the theorem without assuming determinism or hidden variables. He defined **Local Causality** probabilistically.

  **Bell's Local Causality Condition:**
  Let $\lambda$ be a complete specification of events in the past light cone of a measurement region. Let $A$ be the outcome at Alice's detector and $B$ be the outcome at Bob's. Let $a$ and $b$ be the settings. Local causality requires that the probability of Alice's outcome depends only on her setting and the past state $\lambda$, and *not* on Bob's setting or outcome:
  $$ P(A | a, b, B, \lambda) = P(A | a, \lambda) $$

  If QM is a complete theory (as Copenhagen claims), then the wavefunction $\psi$ is the $\lambda$. When you plug the quantum state into this equation, **the equality fails.** The probability of Alice's outcome *does* depend on Bob's outcome (conditional on the settings), even given the wavefunction.

  **The Philosophical Point:** Bell argued that if you claim the wavefunction is a *complete* description of reality (the Copenhagen stance), then the theory is explicitly non-local because the state update (collapse) at one wing instantly changes the probabilities at the other. You cannot save locality simply by denying hidden variables if you maintain that the wavefunction is the whole story.

  ### 2. Parameter Independence vs. Outcome Independence
  To make this precise, Jon Jarrett and Abner Shimony decomposed Bell's Locality condition into two distinct components:

  1.  **Parameter Independence:** The probability of Alice's outcome does not depend on Bob's *setting* ($b$).
      $$ P(A | a, b, \lambda) = P(A | a, \lambda) $$
  2.  **Outcome Independence:** The probability of Alice's outcome does not depend on Bob's *outcome* ($B$).
      $$ P(A | a, b, B, \lambda) = P(A | a, b, \lambda) $$

  **Locality = Parameter Independence + Outcome Independence.**

  *   **Signal Locality** is guaranteed because QM obeys **Parameter Independence**. (You can't use the entanglement to send a message by changing settings).
  *   However, QM violates **Outcome Independence**. Even given the complete state $\psi$, knowing Bob's outcome changes the probability of Alice's outcome.

  **The Philosophical Point:** Most philosophers argue that violating Outcome Independence is a form of non-locality. It implies a holistic connection between spacelike separated events that cannot be screened off by common causes in the past. While this doesn't allow signaling, it violates the spirit of relativistic causality which suggests that spacelike separated events should be independent once their common past is specified.

  ### 3. The Status of the Wavefunction (Ontic vs. Epistemic)
  Your argument relies on the Copenhagen idea that we "decline to assign definite values." This treats the wavefunction as **epistemic** (a catalog of knowledge/probabilities). If the wavefunction is just information, then "collapse" is just a Bayesian update of information, which can happen instantly without physical consequence.

  However, several arguments challenge the purely epistemic view:
  *   **The Pusey-Barrett-Rudolph (PBR) Theorem (2012):** Under plausible assumptions, this theorem suggests that if distinct quantum states correspond to distinct physical realities, the wavefunction must be **ontic** (a real physical state), not merely epistemic.
  *   **Interference Effects:** The wavefunction behaves dynamically like a physical field in many contexts.

  **The Philosophical Point:** If the wavefunction is real (ontic), then collapse is a physical process. If collapse is physical and instantaneous across spacelike separation, the theory is non-local. If the wavefunction is *not* real (purely epistemic), philosophers ask: "What physical mechanism accounts for the perfect correlations?" If there are no hidden variables and no physical wavefunction, the correlation appears as a "brute fact" without a causal mechanism, which violates **Reichenbach's Common Cause Principle**. Many philosophers view the abandonment of this principle as a concession of locality in a broader causal sense.

  ### 4. Non-Separability vs. Action-at-a-Distance
  Finally, many modern philosophers of physics (such as Tim Maudlin or David Albert) argue that the dichotomy "Locality vs. Realism" is itself misleading. They argue that QM forces us to accept **Non-Separability**.

  In classical physics, the state of a composite system is fully determined by the states of its parts and their spatial relations. In QM, an entangled state cannot be reduced to the states of the individual particles. The system is a single object existing in a high-dimensional configuration space, not two objects in 3D space.

  **The Philosophical Point:** If the fundamental ontology is non-separable, then "locality" (interactions between distinct things at distinct places) is not even well-defined in the standard way. While this isn't "action-at-a-distance" in the Newtonian sense, it is a failure of **Local Realism** in the sense that the world is not composed of local beables. Bell famously criticized the idea that QM is local, stating in *Speakable and Unspeakable in Quantum Mechanics*:

  > "It is difficult to account for the fact that the quantum mechanical predictions... are in conflict with the principle of local causality... I am not sure that 'non-locality' is the best word... but I do not see how it can be avoided."

  ### Summary: What You Are Missing
  You are missing the distinction between **Signal Locality** (which QM preserves) and **Ontological Locality** (which QM violates).

  1.  **Textbook View:** Realism = Hidden Variables. Locality = No Signaling. Conclusion: QM is Local (no signaling) but Non-Realist (no hidden variables).
  2.  **Philosophical View:** Realism = The wavefunction describes physical reality. Locality = Bell's Local Causality (screening off by past). Conclusion: QM is Non-Local (violates screening off) and Realist (wavefunction is the reality).

  Philosophers insist QM is non-local because, even without hidden variables, the theory posits correlations between spacelike events that are not mediated by local interactions nor fully explained by their common past. Whether you call this "non-locality," "non-separability," or "holism," it represents a departure from the local worldview of classical field theory that goes deeper than merely "giving up pre-existing values."

  Bell himself sided with the philosophers on this. He believed that the "Copenhagen escape route" (denying realism to save locality) was a misunderstanding of his theorem. He argued that the *predictions* of QM themselves are non-local, regardless of the interpretation.
