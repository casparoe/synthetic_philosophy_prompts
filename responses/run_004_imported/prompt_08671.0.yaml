  1.  **Analyze the User's Problem:**
      *   **Context:** The user is in a seminar on moral responsibility (reading Wallace, Cohen, etc.) and has a background in introductory logic.
      *   **Conflict:** Intro logic says *tu quoque* (appeal to hypocrisy) is a fallacy (irrelevant to the truth of the claim). Moral philosophy (Wallace, etc.) says hypocrisy can undermine the *standing* to blame (the authority to make the claim).
      *   **Goal:** The user wants a clear comparison, not a wishy-washy "both have points" answer. They want to know if these are compatible (different levels) or if one is secretly wrong. They want a concrete application to a cheating scenario.
      *   **Constraint:** "Pick which framework should govern how we read a case like that, and explain what the other one is missing." (This is the tricky part. I need to take a stance while acknowledging the nuance, rather than sitting on the fence.)

  2.  **Deconstruct the Two Frameworks:**
      *   **Informal Logic (*Tu Quoque*):** Focuses on *propositional truth*. Does the fact that $A$ did $X$ make the statement "$B$ did $X$" false? No. Therefore, logically, the criticism holds. The fallacy lies in thinking the *truth value* of the accusation changes.
      *   **Moral Philosophy (Standing to Blame):** Focuses on *normative authority/social function*. Does $A$ have the *right* or *appropriate position* to hold $B$ accountable for $X$? If $A$ is guilty of $X$, their blame might be infelicitous, unfair, or communicatively useless. The focus isn't on whether $B$ did wrong, but on whether the *act of blaming* is legitimate.

  3.  **Evaluate the Conflict:**
      *   Are they contradictory? No. One addresses *truth*, the other addresses *felicity/authority*.
      *   However, the user asked me to *pick* which framework governs the concrete case.
      *   *Decision:* The "Standing to Blame" framework is richer and more accurate for *moral interactions*, while the Logic framework is accurate but *thin* for this context. The Logic framework misses the interpersonal/normative dimension of blame. Blame isn't just stating a fact; it's a speech act with normative force.
      *   *Why pick Standing?* Because in moral life, *who* speaks matters as much as *what* is spoken. A hypocritical blamer often undermines the moral community's norms rather than upholding them. The Logic view treats blame like a weather report (true/false); the Standing view treats it like a verdict or a rebuke (authorized/unauthorized).

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the tension. It's a classic "category error" confusion.
      *   *Distinction:* Clearly separate *Truth of the Claim* (Logic) vs. *Authority to Speak* (Philosophy).
      *   *The "Pick":* I need to argue that for *moral responsibility*, the Standing framework is the primary one, and the Logic framework is secondary/limited. Why? Because blame is not just description; it's a normative practice.
      *   *The Cheating Case:* Apply the chosen framework.
          *   Logic says: Friend is wrong to think the accusation is false. (True, but boring).
          *   Standing says: Friend is right to reject the *blame*, even if they accept the *fault*.
      *   *Critique of the Other:* What does Logic miss? It misses the *function* of blame. It misses that hypocrisy corrupts the moral conversation.
      *   *Critique of Standing (to be fair):* What does Standing miss? It shouldn't be used to deny the *fact* of the wrongdoing.
      *   *Synthesis/Resolution:* The friend's clapback isn't a logical proof that "I didn't cheat." It's a normative rejection of *your right to judge me.*

  5.  **Refining the Stance (Addressing the "Pick One" Constraint):**
      *   The user said: "Pick which framework should govern how we read a case like that."
      *   If I say "They are compatible," I might be violating the spirit of "don't be wishy-washy."
      *   Better approach: Argue that the **Standing to Blame** framework is the *superordinate* framework for moral contexts. The Logic framework is valid *within its domain* (truth conditions), but it is the wrong tool for analyzing *moral address*.
      *   *Thesis:* The *tu quoque* label is correct regarding *truth*, but the Standing thesis is correct regarding *moral practice*. In a seminar on moral responsibility, the Standing thesis governs. The Logic framework is "missing" the interpersonal nature of blame.

  6.  **Developing the Concrete Example:**
      *   Cheater A blames Cheater B.
      *   Logic: B's cheating is still true. A's hypocrisy doesn't change reality.
      *   Standing: A's blame is infelicitous. A lacks the moral authority. B's response ("You too") is a valid challenge to A's authority, not a denial of B's guilt.
      *   *Key Insight:* The friend isn't saying "I didn't do it." They are saying "You aren't the one to say it."

  7.  **Final Polish:**
      *   Ensure Wallace/Cohen references are acknowledged (equal standing, normative authority).
      *   Make sure the distinction between *propositional content* and *speech act* is clear.
      *   Keep the tone academic but accessible (seminar student level).
      *   *Self-Correction on "Pick One":* I must be careful not to say Logic is "wrong." It's right about truth. But for *moral responsibility*, Standing is the governing framework. I will frame it as: The Standing framework captures the *full picture* of moral interaction, whereas Logic captures only a *slice* (truth conditions). Therefore, Standing governs the *moral* case.

  8.  **Final Review against constraints:**
      *   Compare properly? Yes.
      *   Not wishy-washy? Yes, I will prioritize Standing for moral contexts.
      *   Concrete example? Yes (cheating).
      *   Explain what the other misses? Yes (Logic misses the normative force).

      *(Self-Correction during drafting)*: I need to make sure I don't validate the idea that the hypocrite's accusation becomes *false*. That is the core fallacy. I must emphasize that the Standing view agrees the accusation is *true*, but the *blame* is illegitimate. This is the crucial pivot.

