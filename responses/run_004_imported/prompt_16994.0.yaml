answer: |-
  **Setting:** *A dimly lit study at Harvard, circa 1907. C.S. Peirce sits in a leather armchair, surrounded by stacks of logic papers and bottles of ink. William James paces near the window, a cigarette burning in his hand. The air is thick with tobacco smoke and unresolved tension.*

  **Peirce:** You have ruined the word, Will. I tell you, it is ruined. "Pragmatism." It sounds like a political platform. Or a sales technique. I had to coin "Pragmaticism." It is ugly, yes. Awful. But hopefully, that will keep the kidnappers away.

  **James:** (Smiling, exhaling smoke) And yet, Charlie, here you sit, arguing with me about it. If the word is dead, why are you still fighting for its corpse? The fact is, the idea has legs. People *use* it. They feel the weight of it. You wanted a maxim for clarifying ideas; I gave them a philosophy of life.

  **Peirce:** A philosophy of life is precisely what I wished to avoid. I wanted a method for logic, for science. You have turned it into a license for sentiment. You say truth is "what it is good for us to believe." Good for whom? And for how long? If I believe a comforting lie—that my deceased brother is watching over me—it warms me. It steadies my hand. By your metric, is it not true?

  **James:** It is true *in that specific respect*, for that specific moment. But you stop the sentence too soon. I never said truth is merely what comforts. I said it is what *works*. And a belief must work its way through the entire web of experience. That comfort you speak of? It may work in the parlor, but does it work in the laboratory? Does it work when you try to build a bridge? If the belief in your brother's ghost leads you to ignore the structural integrity of the beam, the beam breaks. The belief fails the cash-value test.

  **Peirce:** So you retreat to prediction! You smuggle in my criterion under the guise of "working." If the belief fails when the beam breaks, it is because the beam obeys laws independent of your "web of experience." There is a Secondness there—a brute resistance. You want to have it both ways, Will. You want truth to be made by humans, but you rely on a reality that refuses to be made.

  **James:** I rely on nothing but the flow of experience itself. You posit this "Real" thing out there, this external constraint. But how do you know it? Only because it resists you. And that resistance is *part of your experience*. You say truth is the "final opinion" the community of inquiry would settle on if pushed to the limit. But Charlie, we are not at the limit. We are here, in the muck. To tell a man suffering that truth is only what he *would* believe in a hypothetical future... that is cold. It is truth deferred. It is truth on credit.

  **Peirce:** It is not credit; it is the only thing that distinguishes truth from consensus. If you define truth by what works for the community *now*, you are a mob. If you define it by what works for the *individual*, you are a solipsist. My "final opinion" is not a prediction of what we will think; it is the recognition that inquiry, if persisted in, is fated to converge. Why? Because there is something to converge *upon*. You fear the metaphysics of the Real, but you cannot escape it. Your "cash value" implies a bank. Where is the gold?

  **James:** The gold is in the spending! Truth *happens* to an idea. It becomes true, is made true by events. You treat truth as a static property, a badge an idea wears once it reaches your eschatological finish line. I treat it as a process. A belief is a tool. You ask if I smuggle in correspondence? I say correspondence is just one species of working. To correspond is to be led successfully to the object. But why privilege that? If believing in free will gives me the moral stamina to fight injustice, and that fighting produces tangible social change, in what sense is that belief "false" because it lacks a mechanical cause? It works. It creates the reality it describes.

  **Peirce:** Because it confuses the *goodness* of a belief with the *truth* of a belief. This is the heart of it. You conflate the ethical with the logical. A belief can be beneficial and yet false. If a general convinces his troops they are invincible, they may fight harder and win. The belief worked. It had cash value. But were they invincible? No. If you call that belief "true," you have severed the link between inquiry and the world. You make the universe plastic to our passions.

  **James:** And you make it a frozen statue! You say the truth is out there, waiting for the end of time to be revealed. I say truth is the corridor. You have a thousand doors. Some lead to the library, some to the dining hall. The "truth" of the door is that it opens where you need to go. You worry about the "comforting lie." But consider the opposite: the "harsh truth." If a man believes he is damned, and that belief crushes him into inaction, is that belief "true" simply because it aligns with some dogmatic theology? Or is it false because it leads to a dead end in life? You accuse me of ignoring reality. I accuse you of ignoring the living agent who must navigate it.

  **Peirce:** (Leaning forward, tapping his pipe) But here is the trap you cannot spring. You say the belief in damnation is false because it leads to a dead end. But who judges the end? If I am a martyr, my "dead end" is my triumph. Your criterion collapses into subjective preference unless you admit there is a standard of "working" that is not up to you. That standard is the external world. You need the Real to judge the work. So, you are a pragmatist in name, but in practice, you are relying on my "final opinion"—the opinion that survives the total sum of experience, not just your current psychological need.

  **James:** I admit the constraint. I am no idealist who thinks we dream the world. But the constraint is not a "Real" in your Kantian sense. It is the stream of sensations that pushes back. My point is this: Your "final opinion" is an idol. It is a God-term. You cannot use it. You cannot live by it. When you step off a curb, you do not consult the community of inquiry. You consult your habit, your instinct, your need to cross the street. If that belief gets you across safely, it is true. If you wait for the final consensus on gravity, you will be hit by a carriage.

  **Peirce:** But if the carriage hits you, it hits you regardless of your consensus! That is the point! The resistance is the truth-maker, not the successful crossing. The successful crossing is merely the sign. You focus on the sign and ignore the object. You say "truth is made." I say truth is *found*, though the finding takes eternity. You want to cash the check before the bank opens.

  **James:** And you want to hoard the gold until everyone is dead. Look, Charlie. We agree on one thing. Metaphysics that makes no difference to practice is nonsense. If two men argue about whether a substance is "acid" but agree on every test, every reaction, every taste, they are arguing about nothing. We agree there.

  **Peirce:** We do. That was the original maxim. To clarify ideas, look to their practical consequences.

  **James:** Exactly. So why quarrel over the definition of truth? If my definition leads men to be more open, more experimental, more willing to believe in possibilities that might improve their lot... and your definition leads men to be rigorous, humble, and patient... are we not both serving the inquiry?

  **Peirce:** (Sighs, leaning back) Perhaps. But if your "openness" allows a man to believe the earth is flat because it comforts his theology, and he refuses to look through the telescope because "it works for him"... then you have broken the tool. You have given them a hammer that thinks it is a feather.

  **James:** And if your "rigor" tells a dying man that his hope for reunion is merely a psychological projection because it lacks "convergence," you have given them a feather that cuts like glass.

  **Peirce:** Then we are at an impasse. I will keep my "Pragmaticism." It is ugly, but it is mine. It signifies that truth is public, fallible, and constrained by a reality that does not care for our hopes.

  **James:** And I will keep "Pragmatism." It is human, warm, and signifies that truth is a partnership between the world and the will. The world supplies the facts; we supply the meaning.

  **Peirce:** The world supplies the meaning too, Will. Eventually.

  **James:** (Turning to the window) Eventually is a long time, Charlie. We have to live until then.

  **Peirce:** (Quietly) Yes. We do.

  *(Peirce returns to his papers. James watches the smoke rise, neither man looking at the other, the silence heavy with the weight of a century of arguments to come.)*
