prompt: |-
  so I fell down a rationalist-blog rabbit hole this weekend after someone in a comments section claimed that the whole "your beliefs should pay rent in predictions" thing from lesswrong is basically just jamesian pragmatism with better branding. that sent me back to peirce and james on truth and now im kind of stuck on something. peirce's original line was that truth is whatever opinion inquiry would settle on if you pushed it far enough (the "final opinion"), while james wanted truth to be more like "whatever it's good for us to believe," cashed out in actual experience. apparently peirce got so annoyed at what james (and the popularizers after him) did with "his" idea that he ditched the word "pragmatism" entirely and started calling his own view "pragmaticism," on the theory that an uglier word would be safer from getting stolen again.

  can you write me a dialogue between a peircean and a jamesian actually hashing this out, not the strawman version where peirce just says "truth is correspondence, deferred to some future date" and james says "truth is whatever's useful, full stop"? i want them pressing on each other's real weak points -- like whether peirce's "final opinion" criterion secretly smuggles back in a correspondence theory (since it only makes sense if there's an independent reality that inquiry is converging on), and whether james has any actual comeback to the old objection that his view makes a comforting lie "true" for whoever it comforts. keep both sides equally sharp, don't make it obvious by the end who's supposed to have won.
