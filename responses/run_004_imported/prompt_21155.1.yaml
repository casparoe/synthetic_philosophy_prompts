answer: |-
  Ian Hacking would not be surprised by the mechanism, but he would be alarmed by the ecology.

  If we reconstruct his verdict based on his late work—specifically *Mad Travelers* (on fugue) and *Making Up People*—he would likely argue that TikTok does not break the framework of looping effects, but it does radicalize it to a point of instability that his 20th-century examples never reached. He would view the algorithm not merely as a distribution channel, but as an active, non-human participant in the classification process.

  Here is how he would likely parse it, using his own distinctions:

  ### 1. The Velocity of the Loop
  Hacking's original looping effects were historical and generational. The "homosexual" became a species in the late 19th century; the "multiple personality" surged in the 1980s. The feedback loop between the classified (the patient) and the classifier (the psychiatrist) took years to close.

  On TikTok, the loop is near-synchronous. A user watches a video, recognizes a pattern, performs the pattern, and the algorithm immediately serves content reinforcing that performance. Hacking would argue this is still an **interactive kind**—the classification changes the person—but the *latency* has collapsed.

  He would likely say this doesn't invalidate the theory, but it creates a new ontological category: **the unstable kind.** In the 19th century, a fugue state required a specific cultural niche (legal systems, railway travel, notions of respectability) to sustain itself. TikTok creates artificial niches instantly. Hacking would predict that diagnoses propagated this way are more prone to rapid burnout because they lack the "institutional ballast" (laws, long-term medication protocols, insurance codes) that keeps kinds like autism or schizophrenia in place.

  ### 2. The Authority of the Classifier
  This is where Hacking would dig in hardest. His work focused heavily on the **experts** (doctors, statisticians, criminologists) who created the classifications. There was a bureaucracy involved. "Making up people" was an institutional project.

  On TikTok, the authority is decentralized. The "expert" is the algorithm + the peer community. Hacking would note that this removes the "brakes" on the looping effect. In the 90s MPD (Multiple Personality Disorder) epidemic, therapists inadvertently coached patients into creating alters. TikTok users coach themselves and each other.

  He would likely argue that the algorithm acts as a **hyper-classifier**. It doesn't just observe; it curates reality to fit the classification. If you linger on a video about "inattentive ADHD," the algorithm constructs a world where you are inattentive. Hacking would say this is still "making up people," but the "maker" is no longer a person with ethical accountability; it is a engagement engine. He might call this **algorithmic iatrogenesis**—harm or identity-formation caused by the diagnostic tool itself, scaled infinitely.

  ### 3. Fugue vs. Enduring Kinds
  You asked about the line between a fad (like fugue) and a genuine kind. Hacking was careful not to call suffering "fake." He argued that fugue sufferers *really* fainted or *really* forgot who they were, even if the *category* was transient.

  He would apply this same mercy to the TikTok generation. He would say: **The distress is real; the taxonomy is opportunistic.**

  He would likely distinguish between two tracks on TikTok:
  *   **Track A (Neurodivergence):** Autism and ADHD have deep institutional roots (special education, pharmaceuticals, disability law). Hacking would argue these kinds are "sticky." Even if TikTok accelerates self-ID, the kind won't vanish because the bureaucracy supports it.
  *   **Track B (Systemhood/DID trends):** This looks much more like the 1980s MPD epidemic or 19th-century fugue. It relies heavily on cultural narrative and therapist/peer reinforcement without the same level of biological or institutional anchoring.

  His verdict? He would likely predict that Track B is a **transient mental illness** in the making. Not because the kids are lying, but because the "ecological niche" for being a "system" is currently hyper-visible but historically shallow. Once the algorithm shifts, or the cultural cachet fades, that specific way of being a person may become unintelligible to the next generation.

  ### 4. The Verdict: Intensification, Not Rupture
  Would he say this breaks his framework? **No.**

  Hacking was a pragmatist. He understood that classifications evolve. He would argue that TikTok is simply the **industrialization of the looping effect.**

  However, he would add a crucial caveat. In the past, looping effects allowed for a "slow accommodation." People had time to wrestle with a label. The TikTok loop is so fast it risks becoming a **script.** When the instruction on "how to be autistic" arrives simultaneously with the diagnosis, the space for individual accommodation shrinks.

  He would likely conclude that we are witnessing a shift from **interactive kinds** (where the person interacts with the classification) to **prescriptive kinds** (where the classification dictates the person's behavior before they have fully inhabited it).

  ### Summary of his likely position:
  He would not call it mass malingering. He would call it a **crisis of historical ontology.** The "kinds of people" available to be are being generated faster than our institutions can validate or stabilize them. The algorithm is a mirror that talks back, telling you who you are before you've had a chance to look.

  He'd likely end with a warning similar to his conclusion on fugue: *When the cultural music stops, the suffering remains, but the language to describe it vanishes.* The tragedy isn't that the diagnosis is "wrong," but that the support system might disappear when the trend does, leaving the person with a shape of suffering that no longer has a name.
