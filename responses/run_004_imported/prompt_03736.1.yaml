      *   **Masked Dispositions (The Insulation Case):**
          *   *Concept:* The disposition stays, but an external factor blocks the manifestation.
          *   *Classic Example:* Glass wrapped in bubble wrap. Or a poison with an antidote circulating in the blood.
          *   *User's Analogy:* Insulation. The wire is live (disposed to shock). Touching it (stimulus) happens. But insulation (mask) prevents current flow. No shock (manifestation).
          *   *Refutation of SCA:* SCA says "If struck, it breaks." Masked glass: "If struck, it *doesn't* break." SCA says not fragile. But it *is* fragile. The conditional is false, disposition is real.
          *   *Distinction:* Fink = Disposition goes away. Mask = Disposition stays, manifestation blocked.

      *   **David Lewis's Repair (The "Intrinsic Basis" Move):**
