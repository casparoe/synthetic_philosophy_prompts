          *   Formula: $D \leftrightarrow (S \boxright M)$.
          *   Intuition: To be fragile is to break if struck.
          *   Why it seemed plausible: Ryle, early analytic philosophy.

      *   **Finkish Dispositions (The GFCI Case):**
