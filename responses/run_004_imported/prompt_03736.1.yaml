      *   *Lewis on Masks:* Lewis actually addresses masks in the same paper. He argues masks are extrinsic interference. But intrinsic masks (antidotes in the body) are the real challenge. I need to mention that Lewis's account is generally considered successful against Finks but contested on Masks.

  5.  **Final Polish:** Organize with clear headings. Use logical notation where helpful but explain it. Conclude with a synthesis of the engineering and philosophical perspectives. (Self-Correction: Make sure not to get too bogged down in symbolic logic, keep it conceptual but rigorous).

