      *   Explain the "Divisibility Argument" driving the Nihilism.
      *   Explain why he isn't strictly an Organicist (the locus of unity).
      *   Discuss Consistency (Well-founded phenomena).
      *   Conclude on the nuance.

      *(Self-Correction)*: Wait, some scholars argue Leibniz is an Organicist because he believes in "Corporeal Substances" (monad + organic body). I need to address the "Corporeal Substance" debate. In his middle period, he definitely pushed for Corporeal Substances. In the later Monadology, he emphasizes the Monads more. However, even with Corporeal Substances, the *unity* comes from the form (monad), not the composition of the matter. So it's still not Van Inwagen's Organicism where the *composition itself* creates the object based on life. I will stick with the Nihilist reading regarding *composition*, but acknowledge the Organicist *flavor*.

      *Decision:* I will argue that strictly speaking, regarding the SCQ ("When do xs compose a y?"), Leibniz answers **"Never" (Nihilism)** for true substances, but **"When perceived as one" (Idealism/Phenomenalism)** for bodies. Van Inwagen's Organicism is the closest *spiritual* cousin, but metaphysically distinct. I will highlight this distinction.

      *Wait, one more check:* Van Inwagen's Nihilism: "There are no composite objects." Leibniz: "There are no composite *substances*." But there are composite *phenomena*. Van Inwagen's SCQ is usually about existence simpliciter. If Leibniz says aggregates exist as phenomena, does that count as composition? Van Inwagen might say "arranged table-wise." Leibniz says "aggregate of monads." It's very close. I will lean towards Nihilism as the fundamental commitment.

