  ### Tips for the Call
  When Marcus pushes back (and he will, because the calculus is solid), here is your line of argument:

  1.  **Validate the Math:** Start by agreeing his calculus is perfect. "Marcus, your series summation is 100% correct. $\ln(2)$ is the right sum for that series *in that order*."
  2.  **Introduce the "Order" Problem:** Ask him: "Why are we forced to sum the outcomes in order of toss number ($n=1, 2, 3...$)?" In a real decision, you consider the set of all outcomes. If you sum all the winning outcomes first, you get $+\infty$. If you sum all the losing outcomes first, you get $-\infty$.
  3.  **The "Absolute" Standard:** Explain that in probability theory, we usually require **Absolute Convergence** ($\sum |x_i p_i| < \infty$) for an Expectation to be considered "well-defined." This ensures the value doesn't change if you rearrange the terms. Since this game fails that test, the Expectation is undefined.
  4.  **The Paradox:** Conclude that the "Pasadena Paradox" isn't that the math is hard, it's that the math gives a clean answer ($\ln(2)$) that *looks* like a valid Expectation but isn't robust enough for decision making.

