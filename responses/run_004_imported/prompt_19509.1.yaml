answer: |-
  **MEMORANDUM**

  **TO:** Kidney Transplant Protocol Committee
  **FROM:** [Your Name], Emeritus Professor of Immunology
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Induction Therapy Protocol Selection

  **The Decision at Hand**

  We are asked to choose a default induction protocol based on which option delivers higher graft survival for our patients. On the surface, our data presents a contradiction. The overall (pooled) numbers favor the older Protocol A (88.8% survival) over the newer Protocol B (80.3%). However, when we split the data by induction timing (Early vs. Late), Protocol B performs slightly better in both categories.

  Half of this committee views this as a standard statistical artifact (Simpson's Paradox), arguing we should ignore the overall numbers and trust the subgroups. I am writing to argue the opposite: in this specific clinical context, the overall numbers are the more reliable guide for policy, and stratifying by timing introduces a deeper bias that risks patient safety.

  **Why Timing Is Not a Baseline Trait**

  Standard statistical advice tells us to stratify by "confounders"—pre-existing differences between patients, like age or diabetes status. This advice assumes the variable we are splitting on exists *before* we choose the treatment.

  Timing of induction is not a pre-existing trait. It is a downstream event. As our surgical staff have confirmed, Protocol B requires complex coordination that frequently *causes* delays. Simultaneously, difficult surgeries (which independently risk graft failure) also *cause* delays.

  When we group patients by "Late Start," we are mixing two distinct groups: those on Protocol B who were delayed by the protocol's logistical demands, and those on Protocol A who were delayed because their surgery was medically difficult. By analyzing these groups separately, we inadvertently compare "logistically delayed B patients" against "medically complicated A patients." This distorts the comparison. It effectively hides the cost of Protocol B's complexity.

  **The Case for the Pooled Data**

  The pooled figures (88.8% vs. 80.3%) represent the **Total Effect** of assigning these protocols in our hospital as it currently operates. They answer the question the committee is actually empowered to ask: *"If we make Protocol B the default tomorrow, what will happen to our overall survival rates?"*

  The answer, based on eleven years of data, is that survival rates will likely drop. This is not a statistical error; it is a systems reality. A protocol that is biologically potent but logistically fragile is, in practice, a less potent protocol. To adopt Protocol B as the default based on the subgroup analysis is to assume we can decouple the drug from the delivery system. Our data suggests we cannot.

  **Recommendation**

  I recommend we **adopt Protocol A as the default standard of care** effective next month, but with the following stipulation:

  We should not view Protocol B as discarded. The subgroup data suggests it may have superior biological efficacy when administered without delay. Therefore, I propose we launch a **12-month Quality Improvement Initiative** focused solely on the logistical bottleneck of Protocol B.

  **The Path Forward**

  1.  **Default:** Protocol A remains the standard for all eligible recipients.
  2.  **Pilot:** A limited cohort (n=50) may receive Protocol B under a "fast-track" logistical workflow designed to guarantee Early Start (<24 hours).
  3.  **Review:** In 12 months, we review the graft survival of the fast-track B cohort against the standard A cohort.

  If the fast-track B cohort matches the subgroup promise (96% survival) without the logistical slippage seen in the registry, we revisit the default status. Until we can guarantee the timing, the pooled data must rule. We must treat the logistics of administration as part of the therapy's mechanism, because for our patients, the outcome is the same.

  **Summary**

  Stratifying by timing attempts to ask, *"Which drug is better?"* But our duty is to answer, *"Which protocol saves more grafts?"* The pooled data answers the latter. Let us not trade a known survival advantage for a theoretical one that depends on a delivery system we do not yet possess.
