answer: |-
  This is a sharp observation, and you are right to sense a profound tension there. You've identified the exact fault line between Ramsey's *formal* legacy (the math of decision theory) and his *philosophical* legacy (pragmatism and humanism).

  If you want a non-hedged reconstruction: **Ramsey would be one of longtermism's most devastating internal critics.** He would accept the calculus but reject the ontology. He would tell Bostrom, Ord, and MacAskill that they are using a tool designed for human navigation to worship a cosmic idol, thereby committing a category error that violates the very pragmatic spirit of his probability theory.

  Here is the breakdown of why Ramsey would turn on the movement that relies on his machinery.

  ### 1. The Machinery vs. The Metric
  You are correct that Ramsey (alongside de Finetti) provided the engine: subjective probability and expected utility. Longtermism runs on Expected Utility Theory (EUT). If $P \times V$ (Probability times Value) is high enough, the action is mandatory. Because the future is vast (trillions of lives), even a tiny reduction in existential risk yields an astronomical expected value.

  But Ramsey did not view probability and utility as Platonic substances existing "out there" in the universe waiting to be summed. For Ramsey, probability was a "logic of partial belief," and utility was a measure of **actual human desire and satisfaction**.

  In the "Epilogue," when Ramsey says he draws the world in perspective rather than to scale, he is making a claim about **value attribution**. He is arguing that moral significance is a function of *proximity to consciousness*, not *magnitude in spacetime*.

  Longtermism inverts this. It argues that moral significance is a function of *magnitude in spacetime* (the number of future welfare units), regardless of proximity to current consciousness. Ramsey would argue that this strips "utility" of its only coherent meaning. For Ramsey, you cannot have utility without a subject to experience the satisfaction. To aggregate the "utility" of trillions of non-existent possible people is, for Ramsey, metaphysical nonsense. It treats "value" as a fluid that can be poured into abstract containers, rather than a relation between a mind and its world.

  ### 2. The Superstition of Magnitude
  The core of Ramsey's "threepenny bits" passage is a rejection of what we might call the **Superstition of Magnitude**. This is the idea that physical size, duration, or quantity confers moral weight. Russell fell for this in *A Free Man's Worship* (which is why the universe seemed tragic to him); the longtermists fall for it in *The Precipice* (which is why the future seems obligatory to them).

  Ramsey's defiance is explicit: the vastness of the universe is irrelevant to the good.
  > *"My picture of the world is drawn in perspective, and not like a model to scale; the foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  If you show Ramsey the "astronomical waste" argument, he would not be impressed by the word "astronomical." He would ask: **Waste to whom?**

  If there are no people, there is no one to suffer the "waste." The tragedy of extinction, for Ramsey, is the loss of *actual* human goods (conversation, feeling, thought), not the failure to maximize a variable in a cosmic equation. Longtermism treats the *potential* for value as having nearly the same weight as *actual* value, provided the numbers are big enough. Ramsey's perspective ethics suggests that the "foreground" (actual, living humans) lexically dominates the "background" (abstract future potential).

  ### 3. Pragmatism vs. Idealism
  Ramsey was, at his core, a pragmatist (he translated Wittgenstein's *Tractatus* but moved quickly beyond its rigidness). For a pragmatist, a belief is a rule for action. Probability is a guide for betting in the *actual* world.

  Longtermism often requires acting on probabilities so small and outcomes so distant that they cease to function as pragmatic guides for human action and become instead a form of secular eschatology. Ramsey would likely view this as a corruption of the probability calculus.

  In *Truth and Probability* (1926), Ramsey is concerned with how we navigate uncertainty to satisfy our desires. He is not concerned with optimizing the universe from a God's-eye view. Longtermism attempts to adopt that God's-eye view (the "view from nowhere" scaled up to the "view from everywhere"). Ramsey's "Epilogue" is a rejection of the God's-eye view. He insists on the human eye.

  He would likely argue that by focusing on the "background" (existential risk over centuries), longtermists are neglecting the "foreground" (the actual quality of life now), not because they don't care, but because their math forces them to discount the foreground to zero in comparison to the background. For Ramsey, a math that demands you ignore the foreground is a bad map.

  ### 4. The "Young Man" Objection
  You asked about his age. He died at 26. Is the "Epilogue" just brilliant bravado?

  I would argue the opposite. The "Epilogue" and his late papers represent Ramsey's **maturation**, not his juvenilia.
  *   **1925-1926:** The logicist/mathematical Ramsey (*Foundations of Mathematics*). This is the Ramsey the longtermists claim.
  *   **1928-1929:** The pragmatic/humanist Ramsey (*Epilogue*, *Knowledge*, *Theories*). This is the Ramsey who had absorbed Wittgenstein's critique of his own earlier work and moved toward a philosophy of language and action.

  The "threepenny bits" passage is not the angst of a teenager; it is the resolved stance of a philosopher who realized that formalism cannot swallow life. He was moving away from the cold logic of the *Tractatus* toward the warmth of human practice. To dismiss the "Epilogue" as youthful posturing is to ignore that his intellectual trajectory was moving *away* from the kind of abstract maximization longtermism employs. He was becoming *more* human-centric, not less, right up until his death.

  ### The Verdict
  If Ramsey sat down with MacAskill today, the conversation would go like this:

  **MacAskill:** "We have a duty to the future because the expected value of the trillions of future lives dwarfs the present."
  **Ramsey:** "You are confusing the map with the territory. Your 'expected value' is a calculation, not a moral fact. You are treating 'people' as counters in a game rather than centers of feeling. The stars are small because they do not feel. If you sacrifice the foreground for the background, you have not saved the world; you have merely balanced a ledger."

  Ramsey would argue that longtermism is **Russellian Pessimism in Utilitarian Clothing**. Russell looked at the vast universe and felt small and sad. Longtermists look at the vast universe and feel small but *responsible*. Both make the mistake of thinking the size of the universe dictates the size of the moral duty.

  Ramsey's credo is that **moral duty is determined by the capacity for feeling, which is local.**

  So, to answer your ask directly: Ramsey would view longtermism as a **misapplication of his calculus**. He would say they have taken a tool for managing human uncertainty and turned it into a idolatry of large numbers. He would be an internal critic not because he disagrees with reducing risk, but because he disagrees that *scale* is the reason to do it. We should reduce risk because it hurts *us* and *our children*, not because it violates the optimization of the cosmos.

  For your talk, the punchline is this: **Ramsey gave longtermism its engine, but he would have refused to get in the car.** He knew that when you drive by the stars rather than the road in front of you, you crash.
