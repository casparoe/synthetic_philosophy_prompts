      *   **Format:** Straight dialogue, no framing narration, no tidy moral at the end.
      *   **Length:** 700-1000 words.

  2.  **Character Conception:**
      *   **Lewisian (let's call her "Lena"):** Focuses on similarity of worlds, fragility of events, chains of dependence. Worried about preemption cases breaking simple counterfactual dependence. Willing to tweak the semantics (influence) to save the phenomenon.
      *   **Interventionist (let's call him "Ian"):** Focuses on manipulation, variables, structural equations. Worried about modularity and independent fixability. Worried about when a model is "correct" vs. when it's gerrymandered.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene casually (coffee, workshop). Jump straight into the case.
      *   *The Case:* Establish the Major/Sergeant scenario clearly.
      *   *Lewisian Move:* Lena tries to show dependence. The problem: If the Major hadn't ordered, the Sergeant's order would have caused the advance. So no simple counterfactual dependence of Effect on Major's Cause.
      *   *Lewisian Refinement:* Lena invokes "influence" or stepwise dependence. The manner of the advance might depend on the Major? Or the timing? Schaffer's case is tricky because the effect is identical. Lena might argue about the *process* or rely on the similarity metric where the Major's order being absent is a bigger miracle than the Sergeant's. Actually, Lewis's later "influence" idea is better here: varying the Major's order varies the effect (in terms of authority), varying the Sergeant's doesn't.
      *   *Interventionist Move:* Ian sets up equations. $M$ (Major), $S$ (Sergeant), $A$ (Advance). $A = M$ if $Rank(M) > Rank(S)$.
