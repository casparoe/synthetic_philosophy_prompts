      Let's write.

      *Wait, one check on Lewis's "influence":* Lewis introduced "influence" in "Causation as Influence" (2000) to handle preemption. The idea is that $c$ influences $e$ if there is a range of alterations of $c$ that lead to alterations of $e$. In the trumping case, altering the Major's order alters the soldier's action. Altering the Sergeant's does not. This fits the prompt's requirement.

      *Check on Woodward:* Woodward focuses on $Y$ changing under an intervention on $X$, holding other variables fixed. The issue is specifying the structural equation correctly. If the equation is $A = M$ (ignoring $S$), you've assumed the verdict. If the equation is $A = f(M, S, Rank)$, you need to justify the function.

