      *   Section 2: The 1938 Critique of Ethical Rationalism (The "Glue" Theory).
      *   Section 3: The Collision (Why the "Switch" fails given the "Glue").
      *   Section 4: The "Useful" Vices (Re-evaluating Avarice).
      *   Conclusion.

  8.  (Reviewing against prompt): "Actually build the case rather then just asserting the vibes line up." -> Okay, I need to be rigorous about the logical implications of the 1938 text on the 1930 text. Focus on the *psychology of motivation* and the *role of convention*.

      *Let's flesh out the "Useful Vices" point.* In 1930, avarice is a vice we tolerate. In 1938, Keynes talks about how the Apostles ignored the "general good" and social machinery. If "accumulation" is part of the social machinery (incentive structures, status hierarchies), then 1938 Keynes would see it as structurally necessary, not just a temporary moral failing.

      *Let's flesh out the "Moore" point.* 1930: We will return to Moore's ends. 1938: Moore's ends are real, but you can't get there without the non-Moorean means which become ends in themselves.

      *Okay, ready to write.*
answer: |-
  This is a sharp reading of the Keynesian corpus. You have identified a fault line that often gets smoothed over by treating *Economic Possibilities for our Grandchildren* (1930) as mere "optimism" and *My Early Beliefs* (1938) as mere "biography."

  To build the case that the 1938 Keynes undermines the 1930 Keynes on *internal* grounds, we need to show that the later essay rejects the specific moral psychology required to make the earlier essay's transition possible. The argument rests on three pillars: the nature of human motivation (rational vs. habitual), the function of social conventions (instrumental vs. constitutive), and the definition of the "economic problem" itself.

  Here is the argument for why the chastened 1938 Keynes renders the 1930 prediction psychologically incoherent.

  ### 1. The 1930 Premise: Rationalist Teleology and the "Switch"
  In *Economic Possibilities*, Keynes operates with a distinctly Enlightenment/Rationalist model of human psychology. He posits a dualism between the "economic necessity" (scarcity) and the "art of life" (Moorean ends).

  *   **The Mechanism:** Keynes treats the "love of money" (the purposive man) as a distinct psychological module that is activated by scarcity. He calls it a "disgusting morbidity," but crucially, he treats it as **contingent**. It is a tool we use to solve the economic problem.
  *   **The Prediction:** Once compound interest solves scarcity, the *reason* for the module's existence vanishes. Therefore, the module can be discarded.
  *   **The Assumption:** This assumes human ends are transparent to reason. If we *know* scarcity is over, we will rationally choose to stop accumulating and start contemplating. It assumes a clean break: Scarcity $\rightarrow$ Avarice; Abundance $\rightarrow$ Virtue.

  In 1930, Keynes believes we can simply turn off the "purposive" setting once the material conditions change. He views the "purposive man" as an aberration from the true human state, sustained only by external pressure.

  ### 2. The 1938 Correction: The Necessity of "Useful" Conventions
  In *My Early Beliefs*, the older Keynes critiques the very Moorean rationalism that underpins the 1930 vision. He argues that the Apostles' worship of "states of consciousness" (beauty, love, truth) failed because it ignored the **infrastructure of civilization**.

  *   **The Critique of Moore:** Keynes writes that their earlier philosophy was "shallow" because it ignored the "general good" and the "habits and conventions" that hold society together. He admits they underestimated the power of "instinct" and "unconscious" drives.
  *   **The Role of the "Useful":** Crucially, 1938 Keynes argues that civilization depends on things that are not "true ends" in the Moorean sense but are **constitutive** of social stability. We cannot live solely by contemplating the good; we need intermediate structures, hierarchies, and conventions that often look irrational from the perspective of "true ends."
  *   **Psychological Inertia:** The later Keynes emphasizes that humans are not rational calculators who swap out psychological drives based on material utility. We are creatures of habit. The "purposive" drive isn't just a reaction to scarcity; it is woven into the conventions of status, security, and social ordering.

  ### 3. The Collision: Why the "Switch" Fails
  If we apply the 1938 premises to the 1930 prediction, the 1930 vision collapses. Here is the logical dismantling:

  **A. The "Purposive Man" is a Convention, Not Just a Reaction**
  In 1930, Keynes assumes acquisitiveness is a reaction to the *fear* of scarcity. In 1938, he suggests that social order relies on *conventions* that often outlive their original utility. Even if scarcity is technically solved (abundance is reached), the **convention** of accumulation serves other "useful" social functions: signaling status, maintaining hierarchy, and providing a sense of purpose.
  *   *The 1938 Verdict:* You cannot simply tell the "purposive man" to stop because the material need is gone. The drive to accumulate is likely bound up in the "habits and conventions" that 1938 Keynes says are necessary to keep civilization from falling apart. To remove the drive for accumulation might be to remove the engine of social cohesion itself.

  **B. The Fallacy of Rational Transition**
  The 1930 essay assumes a rational transition: *We will realize we are rich, so we will stop working.*
  The 1938 essay argues that human behavior is not governed by rational realization of "true ends," but by "instinct" and "unconscious" drives.
  *   *The 1938 Verdict:* The 1930 prediction commits the very error the Apostles committed: assuming that once people see the "true good" (leisure, beauty), they will pursue it. 1938 Keynes knows this is false. People pursue conventions. If the convention of the era is "growth," abundance will not stop growth; it will merely shift what growth looks like. The "purposive" instinct is not a temporary disease; it is a permanent feature of the "unconscious" machinery of the social animal.

  **C. The "Economic Problem" is Psychological, Not Material**
  In 1930, Keynes defines the economic problem as "the struggle for subsistence." He thinks this is solvable by technology.
  In 1938, by critiquing the thinness of Moore's ethics, he implies that the "problem" of living is not just subsistence, but finding a place within a social structure.
  *   *The 1938 Verdict:* Even if subsistence is solved, the *psychological* need for purposiveness remains. The 1938 Keynes would argue that the "purposive man" isn't just trying to eat; he is trying to satisfy an instinct for order and security that is independent of the calorie count. Therefore, abundance does not cure the "morbidity" of hoarding, because hoarding was never just about calories. It was about the "useful" convention of security in an uncertain world.

  ### 4. Synthesis: The "Useful Vice"
  The strongest point of tension lies in the moral status of avarice.

  *   **1930:** Avarice is a **vice** we tolerate temporarily. It is a "morbidity."
  *   **1938:** Certain drives that might look like vices from the perspective of "true ends" are actually **virtues of social stability**.

  If the 1938 Keynes is right that we need "convention-bound" behaviors to prevent civilization from collapsing, then the "purposive man" is not a temporary aberration to be cured by abundance. He is a structural necessity. The 1930 Keynes hopes we can return to the Garden of Eden (Moore's states of consciousness) once the snake (scarcity) is removed. The 1938 Keynes realizes we *are* the snake, or at least, that our "fallen" state of convention and instinct is the only state in which civilization functions.

  ### Conclusion
  The 1930 prediction is not just naive about compound interest; it is naive about **moral psychology**. It assumes that human ends are flexible and responsive to material conditions. The 1938 essay explicitly rejects this, arguing that human ends are rigid, bound by habit, and reliant on "useful" intermediaries that rationalism cannot justify.

  Therefore, on the **own premises of the later Keynes**, the 1930 vision is wishful thinking. It assumes we can rationally opt out of the "purposive" drive once it is no longer materially necessary. But the 1938 Keynes teaches us that the drives which build civilization (including the drive to accumulate) become embedded in our conventions and instincts. They do not vanish when the balance sheet balances; they become the new "normal." The "purposive man" was never a temporary patient; he is the host.

  By 1938, Keynes has realized that you cannot have the "art of life" without the "grind of living," and that the grind is not just a means to an end, but the very substance of the social order. To wish away the purposive man is to wish away the conventions that keep the lights on.
