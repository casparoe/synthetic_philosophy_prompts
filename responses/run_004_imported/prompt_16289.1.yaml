answer: |-
  **Setting:** *A timeless courtyard. On one side, stone steps and a gnarled pine; on the other, a whiteboard and a comfortable armchair. Gongsun Long stands in flowing robes, holding a scroll. A Contemporary Philosopher of Language (CPL) sits in the chair, holding a marker.*

  **CPL:** Master Gongsun, I've read your *Bai Ma Lun*. It's a classic, of course. But surely you see why we've spent two thousand years telling you that you're simply confused about the verb "to be." When you say "White horse is not horse," you're treating the "is" of predication as if it were the "is" of identity. Obviously, a white horse *falls under* the concept of horse. It's a subset. To deny that is to deny reality.

  **Gongsun Long:** (Unfurling the scroll slightly) You speak of "verbs" and "concepts" as if they are tools in a carpenter's box. I speak of *Ming* (Names) and *Shi* (Actualities). You say I deny reality? I deny nothing that trots in the stable. I deny only the confusion of Names. Tell me, Philosopher: when you say "Horse," what do you name?

  **CPL:** I name a biological class. Equus ferus caballus. Anything that satisfies the conditions of being a horse.

  **Gongsun Long:** Then you name the shape. "Horse" is that by which we name the form. When you say "White," what do you name?

  **CPL:** A color. A visual property.

  **Gongsun Long:** Precisely. That which names the color is not that which names the form. To name the color is to add a specification to the form. If I ask for "Horse," the form alone suffices. If I ask for "White Horse," I require the form *and* the color. Since the Name "White Horse" requires two designators, and the Name "Horse" requires only one, the Names are not equivalent. If the Names are not equivalent, then *Bai Ma Fei Ma*. White Horse is not Horse.

  **CPL:** (Leans forward, capping the marker) Okay, I see the move. You're arguing from intension. The *meaning* of "White Horse" is more complex than "Horse." But that doesn't mean the object isn't a horse. If I point to a white horse and ask, "Is this a horse?" you would say "Yes." So in the world, they are the same. Your paradox only lives in language.

  **Gongsun Long:** (Smiles faintly) You think the paradox lives only in language? Then let us leave the stable and go to the gate. Suppose a lord commands his guard: "Let no horse pass." May a white horse pass?

  **CPL:** No. A white horse is a horse, so it's barred.

  **Gongsun Long:** Now suppose the lord commands: "Let no *white* horse pass." May a yellow horse pass?

  **CPL:** Yes. Because a yellow horse isn't white.

  **Gongsun Long:** Consider the seeking. If a man seeks a "Horse," a yellow horse or a black horse will satisfy his seeking. If a man seeks a "White Horse," a yellow or black horse will *not* satisfy his seeking. If "White Horse" were truly "Horse"—if the Names were identical—then the seeking would be the same. But the seeking is different. What is satisfied in one case is not satisfied in the other. Therefore, the thing sought is not the same.

  **CPL:** (Pauses, tapping the marker against her chin) You're describing referential opacity. Intensional contexts. "Seeking" creates a context where substitution of co-referential terms fails. Just because I seek a "Morning Star" doesn't mean I'm seeking an "Evening Star," even if they are both Venus.

  **Gongsun Long:** I do not know your Venus. I know that if the response to the command differs, the Name differs. If the Name differs, the *Shi* (Actuality) designated differs. You say I confuse identity and predication. I say you assume that because a white horse *has* horseness, the Name "White Horse" *is* the Name "Horse." But to combine "White" and "Horse" is to create a new Name. A compound Name is not its own component. Is a chariot wheel a chariot?

  **CPL:** No, it's a part.

  **Gongsun Long:** Is "White" a part of "White Horse"?

  **CPL:** In a sense. It's a conjunct. $W(x) \land H(x)$.

  **Gongsun Long:** If I take the "Horse" out of "White Horse," I am left with "White." If I take the "White" out, I am left with "Horse." But "White Horse" is neither "White" alone nor "Horse" alone. It is a distinct actuality of naming. So, when I say *Fei* (Is Not), I do not mean the animal does not exist. I mean the concept "White Horse" is not identical to the concept "Horse."

  **CPL:** (Stands up and walks to the whiteboard) Wait. This is where I need to stop correcting you and start listening. In my tradition, we distinguish two senses of "is."
  1. The "is" of predication: "Fido is a horse." ($Hf$)
  2. The "is" of identity: "The Morning Star is the Evening Star." ($a = b$)

  When I first read you, I thought you were denying #1. I thought you were saying a white horse doesn't fall under the class of horses. That's absurd. But if you are denying #2... if you are saying The Concept 'White Horse' $\neq$ The Concept 'Horse'... then you're right.

  **Gongsun Long:** Of course I am right. The set of things that are "Horse" includes yellow and black. The set of things that are "White Horse" does not. If Set A contains elements that Set B does not, can Set A be Set B?

  **CPL:** No. Extensionally, the set of horses is a superset of the set of white horses. They are not identical sets. $\{x | Hx\} \neq \{x | Hx \land Wx\}$. So, strictly speaking, "White Horse" is not identical to "Horse."

  **Gongsun Long:** Then why have your predecessors called me a sophist? A trickster?

  **CPL:** Because in natural language, "is" is ambiguous. When a normal person says "A white horse is a horse," they mean subsumption. They mean "is a kind of." They don't mean "is identical to." If I say "A Ford Mustang is a car," I don't mean the concept 'Mustang' is the same as the concept 'Car.' I mean it belongs to the category. You, Master Gongsun, are insisting on strict identity. You're saying the *definition* of white horse is not the *definition* of horse.

  **Gongsun Long:** I am insisting that *Ming* must be rectified. If we allow people to say "White Horse is Horse" without qualification, they will think they can send a yellow horse when a white one is demanded. They will think the Name "Horse" covers all specifications. It does not. To say *Fei* is to mark the boundary. It is to say: Do not let the broader Name swallow the specific Name.

  **CPL:** (Sighs, smiling) So, my "dissolution" of your puzzle... distinguishing identity from predication... it doesn't refute you. It actually *validates* you.

  **Gongsun Long:** It provides the brushstrokes I lacked. In my language, *Fei* covers both "is not a member of" and "is not identical to." I was forced to use one character to make a distinction your logic reserves two symbols for. You say I am confused because I use *Fei* where you would use $\notin$ or $\neq$. But I am using *Fei* to prevent the error of thinking $\{H\} = \{H \cap W\}$.

  **CPL:** Exactly. If I translate your claim into my notation, you aren't saying $\forall x (Wx \land Hx \rightarrow \neg Hx)$. That would be crazy. You're saying $\lambda x (Wx \land Hx) \neq \lambda x (Hx)$. The property of being a white horse is not identical to the property of being a horse.

  **Gongsun Long:** Property? Let us say "Designation." The Designation "White Horse" is not the Designation "Horse."

  **CPL:** So we agree. The paradox dissolves not because you were wrong, but because the sentence "White Horse is not Horse" is true under the reading of identity, and false under the reading of subsumption. You were forcing the identity reading to teach a lesson about precision.

  **Gongsun Long:** (Rolls the scroll closed) I was teaching that if you do not distinguish the Names, you cannot govern the Actualities. If the lord asks for a white horse and you bring a yellow one, saying "But a yellow horse is a horse," you have used the truth of the category to violate the truth of the command. My *Fei* protects the command.

  **CPL:** And my distinction protects the logic. But look at what happened. I came in thinking I had a superior tool—this identity/predication split—that would show you were just making a category mistake. But actually, your argument *anticipates* the split. You recognized that "is" does double duty, and you chose the stricter duty to expose the looseness of common speech.

  **Gongsun Long:** Common speech is like water. It takes the shape of the container. Logic is the vessel. If the vessel is cracked—if "Horse" and "White Horse" are treated as one vessel—the water spills. I pointed out the crack. You have simply given the crack a technical name.

  **CPL:** "Referential Opacity." "Intensional Inequality." Yes. Technical names. (She puts the marker down). So, do we disagree?

  **Gongsun Long:** We disagree only on whether the world needs to hear "White Horse is not Horse." You think it confuses the students.

  **CPL:** I think it confuses them until they learn the distinction. Once they learn it, it's a useful lesson in semantics.

  **Gongsun Long:** Then we are in accord. I shock them into seeing the distinction. You teach them the distinction calmly. I use the shock of *Fei*. You use the clarity of symbols.

  **CPL:** It seems my "dissolution" was just a translation. I thought I was solving a problem you created, but I was actually just reconstructing your solution in a different dialect.

  **Gongsun Long:** (Gestures to the pine tree) The tree is the same. You describe its chlorophyll and cellular structure. I describe its shade and its wood. If you say "The tree is not the shade," and I say "The tree is not the shade," are we not saying the same thing?

  **CPL:** We are. Though I'd add: "The tree *has* shade."

  **Gongsun Long:** And I would say: "Horse *has* shape. White Horse *has* shape and color." Since "Shape" $\neq$ "Shape and Color," then "Horse" $\neq$ "White Horse."

  **CPL:** (Laughs) You know, for a guy from the 4th century BC, you're pretty analytic.

  **Gongsun Long:** And for a lady of the future, you finally understand that Names are not merely labels. They are boundaries.

  **CPL:** Boundaries. Yes. I think I'll keep that.

  **Gongsun Long:** Then the dialogue is complete. The White Horse remains not the Horse, and the Philosopher remains not the Logician. Yet here we stand, in the same courtyard.

  **CPL:** Because "Philosopher" and "Logician" are not identical concepts, even if I happen to be both.

  **Gongsun Long:** (Nods) *Fei*.

  **CPL:** *Fei*.
