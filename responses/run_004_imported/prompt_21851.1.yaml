  **CONFIDENTIAL COMMITTEE MEMO**

  **TO:** Grant Applicant (Project Tiling-Alpha)
  **FROM:** AI Safety Fund Grant Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Funding Decision – Conditional Approval

  ### 1. Decision Summary
  **Decision:** Fund with Conditions
  **Amount:** $150,000 (tranche-based)
  **Duration:** 12 Months

  The committee is prepared to fund this project, but not under the current technical assumptions. We believe the empirical investigation of self-modifying architectures is valuable, but we cannot fund a proposal that implicitly claims to bypass established impossibility results in formal logic without a explicit, mathematically sound mechanism for doing so. Funding is contingent on the applicant revising their technical roadmap to explicitly address the Löbian obstacle using one of the known viable frameworks (e.g., Vingean reflection or probabilistic self-trust) rather than relying on naive self-proof.

  ### 2. Proposal Overview
  The applicant proposes to build a "tiling agent": a system capable of rewriting its own decision procedure. The core safety mechanism relies on the agent proving, within its own formal system, that any successor agent preserves a stated safety property (goal stability). The goal is to demonstrate a prototype that can undergo at least one self-modification step without human intervention while maintaining verifiable safety guarantees.

  ### 3. Committee Deliberation
  Our discussion centered on the tension between formal impossibility results and the value of empirical prototyping. We want to ensure the applicant understands exactly where the committee found consensus and where concerns remain.

  #### A. The Logician's Objection (The Löbian Obstacle)
  One committee member raised a fundamental objection based on Löb's Theorem. In standard Peano Arithmetic (and sufficiently strong formal systems), a system cannot prove its own soundness as a blanket schema (i.e., it cannot prove $\forall \phi: (\square \phi \to \phi)$).
  *   **The Constraint:** For Agent $A$ to trust Agent $B$ (where $B$ is a modification of $A$), $A$ must prove that $B$'s actions are safe. If $A$ and $B$ reason using the same logical strength, $A$ effectively needs to trust its own proofs to trust $B$. Löb's theorem implies that adding a reflection principle ("If I prove it, it is true") as an axiom leads to inconsistency.
  *   **The Risk:** A proposal that attempts to implement direct self-proof of safety without addressing this risks building a system that is either inconsistent (can prove anything, including false safety claims) or subject to "infinite descent" (where every successor must be strictly weaker than its predecessor, limiting the system's lifespan).

  #### B. The "Well-Trodden Ground" Perspective
  Two committee members argued that rejecting the proposal on these theoretical grounds would be premature. Their view received a thorough hearing:
  *   **Theory vs. Engineering:** They argued that while the *general* problem of tiling is theoretically constrained, engineering prototypes often reveal practical constraints that pure theory misses. A prototype might find "good enough" approximations that work in bounded domains even if they fail in the general case.
  *   **Existing Workarounds:** They pointed out that the field has already identified viable paths around the strict Löbian block, which this project could explore empirically:
      1.  **Hierarchies:** Using a sequence of successively weaker logical systems for successors (avoiding inconsistency at the cost of finite horizon).
      2.  **Vingean Reflection:** Reasoning about the successor's *behavior* via abstract models rather than simulating its exact proof steps.
      3.  **Probabilistic Self-Trust:** Utilizing frameworks like Logical Induction, where agents assign high probability to their own future rationality without requiring binary proof.
  *   **The Verdict:** They contend that judging a prototype by the standards of a "solved" theoretical problem stifles innovation. The value lies in testing *which* workaround is most implementable in modern ML architectures, not in solving Löb's theorem itself.

  ### 4. Rationale for Conditional Funding
  We land on **Fund with Conditions** because we agree with the majority that empirical work on self-modification is high-priority for AI safety, but we agree with the minority that funding a project that ignores the Löbian constraint is irresponsible.

  We are not funding a attempt to "solve" Löb's theorem. We are funding an attempt to build a tiling agent *that respects* Löb's theorem.

  The applicant's original proposal suggested the agent would prove safety "in its own formal system." This phrasing suggests a naive reflection principle that is mathematically incoherent. However, if the project pivots to implementing one of the known workarounds (specifically Vingean Reflection or Probabilistic Trust), the project becomes technically sound and highly valuable. We want to fund the engineering of the *workaround*, not the denial of the *obstacle*.

  ### 5. Conditions for Funding
  To release the first tranche of funds, the applicant must submit a revised Technical Roadmap addressing the following points. These are not suggestions; they are requirements for the grant to proceed.

  1.  **Explicit Formal Model:** The roadmap must specify the logical framework used for the self-modification check. You must explicitly state how you avoid the Löbian inconsistency.
      *   *Unacceptable:* "The agent will prove its successor is safe using its own axioms."
      *   *Acceptable:* "The agent will use a probabilistic trust metric (Logical Induction) to estimate successor safety," OR "The agent will use Vingean reflection to verify successor *policies* without verifying successor *proofs*."
  2.  **Consistency Audit:** Before the second tranche release, an external logician (approved by the committee) must review the formal specification to confirm that the reflection principle employed does not introduce inconsistency into the base system.
  3.  **Milestone Redefinition:** Success cannot be defined as "unbounded self-modification." Given the finite horizon of hierarchical approaches or the probabilistic nature of induction, success must be defined as "N successful self-modification steps with verified safety properties," where N is determined by the chosen theoretical framework.
  4.  **Literature Engagement:** The revised proposal must cite and engage with the relevant MIRI technical reports (e.g., *Tiling Agents for Self-Modifying AI*, 2013) and subsequent critiques. You must explain why your approach differs from the failed naive attempts documented therein.

  ### 6. Next Steps
  Please submit the revised Technical Roadmap by **November 15**. Upon approval of the roadmap by the committee chair, the first tranche ($50,000) will be released.

  We are excited about the potential of this work. The goal of verifiable self-modification is critical for long-term AI safety. However, the path to that goal must be built on sound mathematical foundations. We believe your team has the engineering capability to execute this, provided the theoretical architecture is corrected to align with established logic.

  Sincerely,

  **The Grant Committee**
  *AI Safety Fund*
