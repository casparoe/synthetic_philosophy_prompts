  The rain tapped against the study window, a rhythmic, hollow sound that matched the ticking of the clock on the mantle. Elias sat at his desk, the wood worn smooth by decades of elbows and papers. On the left side of the blotter lay a cardboard box, open and waiting. On the right, a smaller, velvet-lined case, its lid resting askew.

  He picked up the wool sweater from his lap. It was thick, grey, hand-knitted. He folded it carefully, smoothing the ribs of the cuffs, tucking the collar in so it wouldn't crush. He placed it into the cardboard box. This was for Hana. She was in a city three thousand miles away, where the winter bite was sharp and the power grids failed often. He had seen the photos on his phone earlier—breath pluming in a kitchen, frost on the inside of the glass. The distance was vast, measurable in flight hours and currency exchange rates, but Hana was real. Her cold was happening now.

  Elias reached for the packing tape. He pulled a long strip, the adhesive screaming as it unspooled. He laid it over the cardboard seam, pressing down hard with his thumb, rubbing back and forth until the plastic bonded perfectly to the corrugated surface. He added a second strip, crossing the first. He wanted to be sure. The journey was hard; the handlers would be rough; the roads might be flooded. The sweater had to survive the space between them. He printed the label, licking the adhesive edge before slapping it onto the box. *Air Freight.* He wouldn't skimp on shipping.

  He pushed the cardboard box to the edge of the desk, ready for the morning pickup. Then he turned to the velvet case on his right.

  Inside lay a stack of letters, bound in ribbon, and a deed to a plot of land in the valley. These were for the boy. The boy did not exist yet. Elias's daughter was pregnant, barely eight weeks along, a secret still kept within the family circle. The boy was due in late summer, but these items were not for his infancy. They were for his thirtieth birthday. They were meant to wait fifty years in the attic, safe in the dark, until he was old enough to understand the weight of them.

  Elias picked up the ribbon. It was silk, old stock from his mother's sewing kit. He tied it around the letters, a simple bow. He looked at the velvet case. The clasp was tarnished, the hinge slightly loose. He knew he should oil the hinge. He knew he should wrap the case in acid-free paper before putting it in the tin box upstairs, because attics grew hot in July and damp in November. Paper yellowed. Velvet mothed. Metal rusted.

  He reached for the roll of tape he had used on Hana's package. He held it over the velvet case, then stopped.

  To seal this properly, to ensure it lasted fifty years, he would need to go to the supply closet for the archival tape, the kind that didn't dry out. Or he could take the case upstairs now, in the rain, and secure the tin box with fresh silica gel. It would take twenty minutes. It was late. His back ached.

  The boy was not cold. The boy was not waiting. The boy was a possibility, a ghost in the bloodline. There was no urgency in the air around the velvet case. The silence of the study seemed to press against it, suggesting that time was a vast, forgiving ocean, unlike the jagged mountains between here and Hana's city.

  Elias set the tape down. He closed the velvet lid. The clasp clicked, a thin, brittle sound. He didn't oil the hinge. He didn't wrap it in acid-free paper. He placed the case into the tin box as it was, the metal touching metal, and closed the lid. He would seal the tin box tomorrow. Or next week. The attic would hold it. Time was patient.

  He stood up to turn off the desk lamp. His hand hovered over the switch. On the left, the cardboard box sat ready, armored against the journey, protected by his immediate anxiety for a stranger's warmth. On the right, the tin box sat quiet, vulnerable to the slow decay of decades, sacrificed to his immediate comfort.

  Elias looked from the cardboard to the tin. He imagined Hana opening her package in a month, the tape holding firm. He imagined the boy opening the tin in 2075. He tried to picture the boy's hands, but they were blurry. He could picture Hana's face clearly, shivering in the light of a candle.

  He clicked off the lamp. The room plunged into grey darkness, save for the streetlight bleeding through the rain. In the dark, the difference between the two boxes vanished. They were both just shapes on the desk. But Elias knew, as he walked toward the door, that he would check the weather report for Hana's city in the morning. He would not check the humidity levels in the attic.

  He left the room, leaving the two burdens to the silence. One was traveling through space, guarded by his imagination. The other was traveling through time, left to drift on the weakness of it.
