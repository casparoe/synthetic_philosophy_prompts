answer: |-
  **Title:** The Burden of Translation: Adjudicating the Asymmetry Objection to Rawls's Proviso

  **Introduction**

  In "The Idea of Public Reason Revisited" (IPRR), John Rawls attempts to resolve a tension that plagued the original formulation of *Political Liberalism*: how to accommodate the devout citizen within a framework of public justification that ostensibly brackets their deepest convictions. The solution is the "proviso." Under the "wide view of public political culture," citizens are permitted to introduce their comprehensive doctrines—religious or secular—into public political advocacy at any time, provided that "in due course" they present proper political reasons sufficient to support the same conclusion. This move was designed to soften the "exclusive view" of public reason, making it less hostile to religious participation.

  However, as your seminar has identified, this compromise has generated a persistent and powerful objection, most notably associated with Nicholas Wolterstorff. The charge is that the proviso violates the very criterion of reciprocity that grounds Rawls's conception of reasonableness. The complaint is that the proviso imposes an asymmetrical burden: a citizen whose operative reasons are already broadly secular and liberal is rarely asked to translate or supplement their arguments, while the religious citizen is saddled with extra argumentative work solely because their premises are religious. As your student noted, this looks less like even-handedness and more like a demand that the religious citizen demonstrate they can "reason like everyone else."

  This essay adjudicates this dispute. I will argue that while the Wolterstorff objection correctly identifies a *sociological* asymmetry in the cultural accessibility of public reason, it fails to demonstrate a *normative* violation of reciprocity. The proviso is reciprocal with respect to the **legitimacy of coercion**, even if it is non-reciprocal with respect to the **ease of participation**. Ultimately, Rawls's position prevails on the core normative question of political legitimacy, though it requires acknowledging that public reason is not neutral between comprehensive doctrines in terms of cultural comfort.

  **I. The Asymmetry Objection Reconstructed**

  To evaluate the objection fairly, we must state it in its strongest form, avoiding the caricature that Rawls bans religious speech. Under the wide view, religious speech is permitted. The grievance is not about silencing, but about the *conditions of sufficiency*.

  The objection rests on three claims:

  1.  **The Translation Burden:** The proviso requires religious citizens to perform a hermeneutic task: they must find "political values" within the public culture that align with their religious convictions to justify coercive laws. A Catholic opposing abortion, for example, must not only cite Church teaching but must also articulate a secular rationale regarding human rights or justice that could convince a non-Catholic.
  2.  **The Secular Exemption:** Secular liberals (e.g., Kantians or Utilitarians) appear exempt from this burden. When a secular liberal argues for distributive justice based on "autonomy" or "welfare," these reasons are often accepted as "public" without requiring translation into a distinct "political" vocabulary.
  3.  **The Violation of Reciprocity:** Rawls defines reciprocity as offering terms of cooperation that others can reasonably accept. If the rules of public discourse require one group to bracket their deepest motivations while implicitly accepting another group's motivations as "public-ready," the terms are not equally acceptable. The religious citizen is effectively told: "Your reasons are private until proven public," whereas the secular citizen is told: "Your reasons are public by default."

  Wolterstorff argues that this creates a second-class citizenship. It implies that religious reasoning is inherently suspect or insufficient for political life, while secular comprehensive reasoning is implicitly validated. The asymmetry is not merely about workload; it is about epistemic status. The proviso asks the religious citizen to validate their participation by showing they can play by the secular rules of the game, which undermines the claim that public reason is a neutral meeting ground.

  **II. The Rawlsian Defense: Comprehensive vs. Political**

  Rawls's defense, and the strongest reconstruction of his position, relies on a rigorous distinction between *comprehensive doctrines* and *political values* that applies universally, not just to the religious.

  The core of the Rawlsian reply is that the asymmetry is illusory if the theory is applied correctly. The proviso binds *all* comprehensive doctrines, secular or religious. If a secular citizen argues for a policy solely on the grounds of Kantian autonomy or Millian utility, they are *also* violating public reason. These are comprehensive moral truths, not freestanding political values. Rawls explicitly states that comprehensive liberalism is just as excluded from the basis of public justification as comprehensive religion.

  Therefore, the Rawlsian argues:
  1.  **Universal Binding:** The duty of civility applies to the Kantian just as much as the Catholic. If the Kantian cannot translate "autonomy" into the political conception of "citizens as free and equal persons," they have failed the proviso just as the Catholic has.
  2.  **The Nature of Political Values:** Public reason is not "secular reason." It is a distinct module of values (freedom, equality, fairness) that can be endorsed from multiple comprehensive perspectives. The fact that secular liberals often find this translation easier is a historical contingency, not a theoretical exemption.
  3.  **Legitimacy over Truth:** The goal of public reason is not to determine the moral truth of a policy, but to ensure the *legitimacy* of coercive power. Coercion is legitimate only if justified by reasons the coerced can accept *as citizens*, not as adherents to a specific worldview. Since religious authority is not shareable by non-believers, it cannot ground legitimacy. The same applies to secular metaphysical claims about the nature of the good.

  On this reading, the secular liberal who does not translate is not exempt by rule; they are non-compliant by practice. The religious citizen is not being singled out; they are simply being held to the same standard of public justification that the secularist often evades unnoticed.

  **III. Adjudication: Legitimacy vs. Cultural Ease**

  Does the Rawlsian defense succeed? To adjudicate, we must distinguish between the *principle* of reciprocity and the *practice* of public culture.

  The Wolterstorff objection succeeds in identifying a **genealogical bias**. It is undeniably true that the "political values" of modern liberal democracies (individual rights, autonomy, equality) bear a much stronger family resemblance to secular Enlightenment comprehensive doctrines than to traditional religious doctrines. For a secular liberal, translating their comprehensive views into public reason is often trivial because their comprehensive view *generated* the public values. For a religious citizen, the translation may require significant hermeneutic work to show that their faith is compatible with, say, gender equality or freedom of conscience. In this sense, the burden is substantively heavier for the religious citizen.

  However, the objection fails to prove a violation of **normative reciprocity**. Reciprocity in Rawls's framework is not about equal psychological comfort or equal ease of argumentation; it is about the *terms of coercion*.

  Consider the function of the proviso. It is not designed to ensure that all citizens feel equally at home in public discourse. It is designed to ensure that when the state coerces a citizen, it does so on grounds that do not presuppose the citizen's adherence to a specific comprehensive truth. If I coerce you based on a premise you cannot access (e.g., Biblical authority or Kantian metaphysics), I am treating you as a subject of my truth rather than a partner in cooperation.

  Here is the crux of the adjudication: The secular liberal's comprehensive reasons (e.g., "Maximize utility") are *also* inaccessible to the religious citizen who rejects Utilitarianism. If the secular liberal is allowed to coerce based solely on utility, they violate reciprocity just as much as the religious citizen coercing based on revelation. The fact that secular reasons *feel* more public is a sociological fact about the dominance of secular culture, not a normative justification for abandoning the proviso.

  Therefore, the asymmetry objection conflates two different standards:
  1.  **Symmetry of Burden:** Do both sides have to work equally hard to make their arguments? (No, due to cultural history).
  2.  **Symmetry of Requirement:** Are both sides required to justify coercion using shareable reasons? (Yes, in theory).

  Rawls is committed to the second, not the first. The Wolterstorff objection demands the first as a condition for the second. But demanding equal ease of participation would require abandoning the distinction between comprehensive and political values altogether, which would collapse public reason into a contest of comprehensive truths. If we allow religious reasons to count as sufficient public reasons without translation, we must also allow secular comprehensive reasons to do the same. This leads to a state where coercion is based on non-shareable premises, violating the core liberal commitment to legitimacy.

  **IV. A Qualified Verdict**

  We can now render a verdict. The Wolterstorff objection is **correct descriptively** but **incorrect normatively**.

  It is correct that the proviso imposes a heavier *practical* burden on religious citizens than on secular liberals, because the "public culture" is historically coded in a way that aligns more naturally with secular comprehensive doctrines. In this specific sense, the arrangement is **non-reciprocal regarding the ease of participation**. Religious citizens are indeed asked to "reason like everyone else" in a public sphere where "everyone else" is already speaking a dialect of secularism.

  However, the objection fails to show that this violates the **principle of reciprocity regarding legitimacy**. The proviso remains **reciprocal with respect to the justification of coercion**. Both the religious and the secular citizen are forbidden from relying solely on non-public premises to justify state power. The secular liberal who relies solely on comprehensive Kantianism is just as much in violation of public reason as the religious citizen relying on revelation, even if the former is less likely to be called out for it.

  To side with Wolterstorff would be to prioritize *inclusivity of discourse* over *legitimacy of coercion*. While the alienation religious citizens feel is a genuine political problem (one Rawls addresses through the idea of an overlapping consensus), it does not justify abandoning the requirement that coercive power be justifiable by shareable reasons. If we remove the proviso, we do not level the playing field; we simply allow all comprehensive doctrines to fight for control of the state, which undermines the stability of a pluralistic society.

  **Conclusion**

  The dispute in your seminar hinges on whether public reason is a set of *rules for a game* or a *description of a culture*. As a description of culture, Rawls's public reason is indeed biased toward the secular. But as a set of rules for legitimizing coercion in a pluralistic society, the proviso is the only mechanism that preserves reciprocity.

  The verdict is this: **The proviso is reciprocal regarding the obligations of citizenship, but not regarding the cultural costs of fulfilling them.** The religious citizen's grievance is valid as a claim for cultural recognition, but it fails as a claim against the requirements of political legitimacy. Rawls wins the normative argument because the alternative—allowing coercion based on non-shareable comprehensive premises—abandons the liberal commitment to treating citizens as free and equal. The solution to the asymmetry is not to discard the proviso, but to encourage the "in due course" translation from all citizens, secular and religious alike, ensuring that the public square is not dominated by comprehensive doctrines of any kind.
