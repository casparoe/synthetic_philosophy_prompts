      *   **Observation:** The user notes that prominent IIT theorists (Tononi, Koch) are skeptical about digital simulations/uploading being conscious.
      *   **Question:** Why are Tononi and Koch skeptical if their theory seems to guarantee consciousness for functional emulations?
      *   **Underlying Confusion:** The user is conflating *functional/causal equivalence* (computational simulation) with *intrinsic causal power* (physical cause-effect structure) as defined by IIT.

  2.  **Deconstruct IIT's Core Axioms/Postulates:**
      *   IIT starts from phenomenology (axioms) and derives physical requirements (postulates).
      *   Key Postulate: **Existence**. A system must exist intrinsically. It must have cause-effect power *upon itself*.
      *   Key Postulate: **Integration**. The system must be irreducible.
      *   Key Postulate: **Information**. The system must specify a particular cause-effect repertoire.
      *   *Crucial Distinction:* IIT is *not* functionalism. It is structuralist/physicalist in a specific way. It cares about *how* the causal power is implemented, not just *that* it is simulated.

  3.  **Address the "Simulation vs. Reality" Gap in IIT:**
      *   In standard computational functionalism, a simulation of a rainstorm doesn't get you wet, but a simulation of a mind *does* feel (according to functionalists).
      *   In IIT, a simulation of a system does *not* reproduce the intrinsic cause-effect structure of the original system.
      *   *Example:* A simulation of a black hole on a computer doesn't have gravity. A simulation of a conscious system on a von Neumann architecture doesn't have $\Phi$.
      *   Why? Because the physical substrate of the computer (CPU, RAM) does not have the same causal connectivity as the simulated neurons. The CPU processes bits sequentially; the brain processes patterns in parallel with massive recurrent connectivity.

