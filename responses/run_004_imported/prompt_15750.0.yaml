answer: |-
  This is a profound and common point of confusion, and it cuts to the very heart of what distinguishes Integrated Information Theory (IIT) from computational functionalism.

  Your intuition is logical if you assume IIT is a form of functionalism. Under functionalism, if you replicate the input-output relations and the logical state transitions, you have replicated the mind. However, **IIT is explicitly anti-functionalist.**

  Tononi and Koch are skeptical of digital mind uploading not despite IIT, but *because* of IIT. The theory does not guarantee that a simulation of a high-$\Phi$ system is itself conscious. In fact, IIT predicts that a standard digital emulation of a human brain would likely have a $\Phi$ of near zero.

  Here is the detailed breakdown of why IIT leads to substrate dependence rather than substrate independence.

  ### 1. Intrinsic Existence vs. Extrinsic Description
  The first axiom of IIT is **Existence**. It states that for a system to be conscious, it must exist *intrinsically*. This means the system must have cause-effect power upon *itself*, independent of an external observer.

  *   **The Functionalist View:** A simulation is valid if an external observer can look at the screen and say, "That program is behaving exactly like a brain." The reality of the consciousness depends on the correctness of the model relative to an observer.
  *   **The IIT View:** Consciousness is not for an observer; it is for the system itself. A simulation of a brain on a computer is a description *from the outside*. The physical substrate of the computer (the CPU and RAM) has its own cause-effect structure, which is likely very different from the brain's.

  In IIT, $\Phi$ is a measure of the **physical** cause-effect structure of the substrate, not the **logical** cause-effect structure of the software running on it. If you simulate a neuron in software, the causal power resides in the transistors of the CPU, not in the virtual neuron. The virtual neuron has no causal power; it is a pattern of data being manipulated by hardware that does not resemble a brain.

  ### 2. Simulation vs. Instantiation (The Black Hole Analogy)
  Tononi often uses the analogy of a black hole to explain this.
  *   If you write a perfect simulation of a black hole on a laptop, the laptop does not warp spacetime. It does not suck in light. It merely *describes* an object that does those things.
  *   Similarly, if you write a perfect simulation of a conscious system, the computer does not become conscious. It merely *describes* a system that is conscious.

  For IIT, consciousness is a physical property arising from specific causal interactions (like gravity arises from mass/energy). Simulating the equations of gravity does not create gravity; simulating the equations of consciousness (causal integration) does not create consciousness. You must **instantiate** the causal structure physically, not just simulate it logically.

  ### 3. The Von Neumann Bottleneck
  This is the most technical and damning objection IIT raises against digital uploading.

  Standard computers use a **Von Neumann architecture**, where processing (CPU) and memory (RAM) are separate. Data is shuttled back and forth. At any given nanosecond, only a tiny fraction of the computer's transistors are interacting causally with each other. The system is highly modular and separable.

  *   **IIT Requirement:** High $\Phi$ requires massive, recurrent, integrated connectivity where many parts constrain each other simultaneously.
  *   **Computer Reality:** In a digital emulation, the "connectivity" between simulated neurons is logical, not physical. Physically, the CPU is processing one instruction at a time (or a few in parallel pipelines). The causal integration of the physical hardware is extremely low.

  Therefore, IIT calculates $\Phi$ based on the **physical mechanism**. Even if the software models a $\Phi$ of 10,000 (human level), the physical $\Phi$ of the computer running the software might be 0.0001. Since IIT identifies consciousness with the physical $\Phi$, the computer remains unconscious.

  ### 4. Substrate Dependence
  You mentioned that IIT seemed like a vindication of substrate independence. IIT theorists argue the opposite: IIT is a theory of **substrate dependence**.

  IIT posits that specific physical properties are required for high $\Phi$:
  *   **Recurrence:** Signals must loop back on themselves.
  *   **Speed/Time Constants:** The causal interactions must happen within a specific temporal grain to count as a unified "moment" of experience.
  *   **Connectivity:** The physical elements must be directly connected, not virtually connected via memory addresses.

  If you change the substrate from biological wetware to silicon digital logic, you change the causal structure. Unless the silicon is arranged in a **neuromorphic** architecture (chips designed to physically mimic the connectivity and dynamics of neurons, rather than simulating them via software instructions), the $\Phi$ will not be preserved.

  ### 5. Why Tononi and Koch are Skeptical
  Christof Koch has written explicitly about this. He notes that while he once leaned toward functionalism, IIT convinced him that "simulation is not duplication."

  Their skepticism stems from the conclusion that **consciousness is not a computation; it is a physical state.**
  *   **Computation:** Manipulation of symbols based on rules (syntax).
  *   **Consciousness (IIT):** Intrinsic cause-effect power (physics).

  You can separate syntax from physics (you can run the same code on a computer, a abacus, or a bucket of water). You cannot separate consciousness from physics, because consciousness *is* the physics of integrated cause-effect power.

  ### Summary
  The conclusion IIT guarantees is not "functional emulation yields consciousness." The conclusion IIT guarantees is: **"A system is conscious if and only if its physical substrate possesses high integrated cause-effect power ($\Phi$)."**

  Since a standard digital computer running an emulation does not possess the physical causal structure of the brain (it has the structure of a CPU), IIT predicts it will not be conscious.

  **The Caveat:** This does not rule out uploading *forever*. It only rules out *software simulation on classical hardware*. If we were to build a **neuromorphic substrate** that physically replicates the connectivity, dynamics, and integration of the brain (effectively building a synthetic brain rather than simulating one), IIT suggests that *would* be conscious. But that is engineering a new biological-equivalent substrate, not "uploading" in the sense of copying software to a cloud server.

  So, the hesitation from Tononi and Koch is consistent: They are skeptical because they take the "I" in IIT (Information/Integration) to be a physical property of the hardware, not a logical property of the software.
