      *   If $T \vdash \neg \square \bot$, then $T \vdash \bot$ (Inconsistency).
      *   So a consistent $T$ cannot prove $\square \bot \to \bot$.
      *   Thus, $T$ cannot prove the general reflection principle.

  6.  **Connecting to Tiling Agents:**
