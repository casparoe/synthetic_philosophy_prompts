      *   If $A_1$ uses the same logic as $A_0$, $A_0$ is trying to prove its own soundness.
      *   Löb blocks this.
      *   Result: $A_1$ must be weaker. $A_2$ weaker still. Sequence terminates.

  7.  **Final Review:** Does this directly answer "Why is it treated as a problem instead of a fix?" Yes, because the user thinks the theorem asserts the schema is provable, when it actually asserts the schema is *unprovable* (for consistent systems).

