answer: |-
  **The Equilibrium of the Instant**

  The apparatus sat on the desk, a sealed cube of double-paned glass containing nothing but a sparse suspension of silvered particles in a vacuum. It was a model of a closed system, designed thirty years ago to demonstrate the statistical approach to equilibrium. I had intended to watch the particles settle, to measure the rate at which disorder maximized, to chart the arrow of time by the increase of entropy. But I have not turned it on in decades. It sits now in a state of perfect, static suspension.

  I am writing this to record the final result of the experiment. The result is that nothing happens.

  Or rather, to be precise: there is no *happening*.

  When I look at the cube, I see the particles. When I look away to dip my pen in the inkwell, I cannot swear the particles remain. Berkeley argued that *esse est percipi*—to be is to be perceived. If I am the only perceiver, and I blink, does the universe wink out? In my line of work, we assumed the world persisted. We assumed the gas molecules continued their chaotic dance even when the lab lights were off. But that was an act of faith, a necessary fiction for the calculation of microstates.

  If the object does not endure the gap in my perception, then there is no object. There is only the perception.

  And who is the perceiver? I search for myself in the reflection of the glass. I see a gray beard, a tired eye, a hand trembling slightly with a palsy that was not present when I began this manuscript. Hume was correct: I never catch myself without a perception. I am nothing but a bundle of sensations—the scratch of the nib, the coolness of the air, the visual data of the silver specks. There is no "I" that holds these together. There is only the sight, then the touch, then the thought. There is no thread binding the thought I had a moment ago to the one I am having now.

  If there is no enduring self to perceive, and no enduring object to be perceived, then there is no bridge between *now* and *then*.

  Consider the scientific definition. In thermodynamics, time is a measure of change in state. $dS/dt$. If the state $S$ is not a continuous function, if the system resets with every observation, then $t$ loses its denominator. The particles in the box are not moving from position A to position B. Position A is a complete universe. Position B is another complete universe. They do not touch. To say the particle *moved* is to impose a narrative on two unrelated snapshots. It is like watching a film reel and insisting the characters age between frames. They do not. The frames merely differ.

  I realize, as I write this paragraph, that I have written it before.

  Not this exact sentence, perhaps. But the argument. The structure. The sensation of the pen against the paper. I have a distinct memory, vivid as a scar, of sitting in this same chair, in this same light, drafting this same refutation. It was 1974, or perhaps 1984. The years are labels on jars I cannot open. In that previous draft, I argued that if the self is a fiction, succession is impossible. I argued that the universe is a series of discrete, self-sufficient moments. I reached the same conclusion: that time is a solvent that dissolves its own container.

  I kept both drafts. I found the earlier one this morning, tucked inside a copy of *Other Inquisitions*. The logic is identical. The handwriting is different. How can the logic be identical if the hand that wrote it is not the same hand? If the "I" is a bundle of perceptions, the "I" of 1974 died when the perceptions ceased. The "I" of today is a new bundle, inheriting a stack of paper it claims to remember.

  Memory is not proof of continuity. It is just another perception occurring in the present. I perceive a memory of writing this. That does not mean I wrote it. It means I am currently experiencing the sensation of having written it.

  So, the experiment is concluded. The cube on the desk is not a container of gas; it is a container of instants. The entropy does not increase because there is no duration in which to increase. The arrow of time is not broken; it never existed. There is only the target.

  I have proven, to my own satisfaction, that I am not the man who began this story. I am the man finishing it, and he is not the same. The substance of the world has evaporated under the heat of this scrutiny. The substance of the writer has followed. There is only the writing, floating in a void without before or after.

  The argument is complete. The logic is airtight. I have dismantled the clockwork universe and found there were no gears, only the illusion of motion. I have refuted time.

  And yet.

  As I put down the pen, the ink is wet. It glistens. I wait for it to dry.

  I am waiting.

  The sun is moving across the floorboards. I watch the shadow of the window frame creep toward my shoe. I feel a stiffness in my lower back, an ache that has been building since I sat down. I feel hunger, a hollow gnawing that implies a future in which I will eat, and a past in which I last ate.

  I know, intellectually, that the ache is just a present sensation. I know the shadow's movement is just a series of static positions. I know that without a continuous self, the hunger cannot belong to anyone.

  But I am tired.

  I am helplessly, humiliatingly tired. I want to sleep, and I know that sleep implies a waking. I want to stand up, and I know the motion will take time. I look at the cube, and for a terrifying second, I see the particles blur. I see them move. I see the entropy rise. I see the years pile up on my shoulders like lead weights.

  I have burned the bridge of time with logic, but I am still standing on the bank, shivering in the cold, waiting for the morning. I have proven that the prison does not exist. And yet, I cannot find the door.
