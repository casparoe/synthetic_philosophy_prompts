  so in my decision theory class we've been working through newcomb's problem and superrationality and this week the prof threw evidential cooperation in large worlds (ECL) at us -- the idea that since the universe/multiverse is probably huge, its full of agents pretty similar to us, and by acting well toward their values we get evidence that they're doing the same for ours, even with zero causal contact. can you write me a dialogue between two grad students hashing this out after seminar? one of them thinks ECL gives us a genuine, actionable reason to be more cooperative and value-pluralistic right now, the other thinks its a bridge too far past the newcomb intuition and basically dresses up wishful thinking in decision-theoretic language. i want them to actually engage each others strongest arguments instead of talking past each other -- push on stuff like how much correlation between decision procedures you actually need for this to work, whether "cooperation" means anything when theres no communication and no way to ever check the other side held up its end, and whether the whole framework proves too much (seems like you could justify almost any present sacrifice by just positing the right correlated agents somewhere in the multiverse). dont need you to look anything up, just want a genuinely sharp back and forth where neither one is a pushover.
