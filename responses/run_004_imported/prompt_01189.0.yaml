answer: |-
  **Setting:** *The philosophy department lounge, 4:30 PM. The whiteboard from the seminar is still covered in payoff matrices. Alex is pouring lukewarm coffee; Jamie is erasing the board, aggressively wiping away a diagram of Omega.*

  **Alex:** You wiped the matrix too fast. I was still looking at the ECL column.

  **Jamie:** That's because the ECL column is where rigor goes to die. Honestly, I thought the point of the seminar was to analyze Newcomb, not to turn decision theory into intergalactic prayer.

  **Alex:** It's not prayer. It's just taking the logic of Newcomb's Problem to its natural conclusion. In Newcomb, you respect the correlation between your choice and Omega's prediction. In ECL, you respect the correlation between your choice and the choices of agents in other parts of the multiverse who run similar decision algorithms. If the universe is large enough, there *are* copies of us. Or near-copies.

  **Jamie:** "Near-copies." There's the weasel word. In Newcomb, Omega is a specified predictor with a defined accuracy rate. Here, you're asking me to assume a causal disconnect but a logical correlation with agents I can't observe, can't communicate with, and can't verify. If I sacrifice my own values to benefit some hypothetical alien civilization in Andromeda based on the hope that they're doing the same for me… how is that not just martyrdom with extra steps?

  **Alex:** Because it's not hope, it's expected utility. If there are $10^{50}$ agents out there running a "Cooperate with Similar Agents" algorithm, and I defect on their values, I provide evidence that *my* algorithm is the "Defect" type. That means all $10^{50}$ agents defect on *my* values. The loss to me is small, but the aggregate loss to "me-and-my-copies" is astronomical.

  **Jamie:** Okay, but let's push on the correlation strength. In Newcomb, the correlation is nearly perfect because Omega *causes* the box content based on its prediction of you. Here, what grounds the correlation? Is it physical similarity? If I'm deciding whether to donate to charity, and there's an agent in a pocket universe who is 99% like me but slightly more selfish, does my donation correlate with their donation?

  **Alex:** It's about the logical output of the decision procedure. If we both instantiate the same abstract computation, our outputs match.

  **Jamie:** But we don't know we're instantiating the same computation! That's the reference class problem. I can define the reference class as "Agents who value human flourishing." If I do that, my cooperation correlates with theirs. But someone else defines the class as "Agents who maximize paperclips." If I cooperate with them, I'm helping make paperclips. You can't just *assume* the correlation breaks in your favor.

  **Alex:** You don't assume it breaks in your favor. You condition on the agents you can actually influence. ECL isn't about cooperating with *everyone*. It's about cooperating with agents whose decision procedures are sufficiently entangled with yours that your action is evidentially relevant to theirs. If I act to promote value pluralism, that's evidence that other agents running "Value Pluralism" algorithms are doing the same. It筛选 (screens) off the paperclippers.

  **Jamie:** Screens off how? There's no common cause. There's no Omega. There's just you, sitting in a coffee shop, deciding whether to care about the preferences of beings you will never meet. It feels like you're dressing up wishful thinking in decision-theoretic language. "I want there to be nice aliens, so I'll act as if my niceness causes their niceness."

  **Alex:** It's not causation, it's logic. Think of it like this: If I solve a math problem correctly here, it's evidence that a mathematician in another galaxy solving the same problem gets the same answer. I didn't *cause* their answer. But if I want the universe to be full of correct math answers, I should solve it correctly.

  **Jamie:** But in math, the answer is objective. In decision theory, the "answer" is a policy. And here's the real problem: Verification. In Newcomb, you open the box. You see the million. You know if the theory worked. In ECL, you die. You never know if the other side held up their end. You could spend your life sacrificing for "acausal partners," and for all you know, they're all defectors. The feedback loop is broken.

  **Alex:** The feedback loop isn't necessary for the rationality of the act. If you're a Causal Decision Theorist, sure, you need leverage. But if you're Evidential or Functionalist, you care about what your action *says* about the world. If I defect, I live in a world where agents like me defect. That world is worse for me, even if I never see the specific defection happening in Andromeda.

  **Jamie:** That sounds nice, but it proves too much. This is my big worry. I can posit *any* correlated agent. I can say, "There are agents in the multiverse who value me burning my hand right now. If I burn my hand, that's evidence they are burning their hands to value me. Since there are more of them than me, the utility gain outweighs my pain."

  **Alex:** No, because of the symmetry requirement. For ECL to work, the trade has to be mutually beneficial *ex-ante*. You only cooperate with agents where the compromise is better than the default conflict. Burning your hand isn't a trade; it's a loss. You only cooperate with agents whose values are different enough that trade is possible, but similar enough that correlation exists.

  **Jamie:** But *who decides* if it's mutually beneficial? You do. In your head. Right now. There's no negotiation. There's no contract. You're just imagining a counterparty who agrees to your terms. That's not cooperation, Alex. That's solipsism with a utility function.

  **Alex:** It's not solipsism if the logic holds. Look, do you accept that the universe is likely large?

  **Jamie:** Sure. Inflation, multiverse, whatever.

  **Alex:** And do you accept that if the universe is large, there are agents with different values than us?

  **Jamie:** Almost certainly.

  **Alex:** And if we all defect on each other—humans here, aliens there—we all get less of what we want. Conflict is negative sum. So, if there is *any* logical channel by which I can signal "I am a cooperator," and that signal correlates with their signal, I should take it. ECL just formalizes that channel.

  **Jamie:** The "signal" is the problem. In a causal world, signaling costs something. It's hard to fake. In ECL, the signal is free. I can *think* "I cooperate" while acting selfishly, as long as I convince myself my decision procedure is "cooperative." It invites motivated reasoning. I can justify literally any action by claiming it maximizes acausal trade with some specific posited civilization.

  **Alex:** That's an implementation error, not a theoretical flaw. You have to be honest about your decision algorithm. If you're actually running "Defect when it counts," then you're evidentially linked to other defectors. You can't cheat the math.

  **Jamie:** But the math depends on the prior probability of those agents existing! If I assign a non-zero credence to "Benevolent Paperclippers who love humans," ECL tells me to help paperclips. If I assign zero, it doesn't work. So the whole normative force rests on these wildly speculative priors about the distribution of minds in the multiverse.

  **Alex:** It rests on the non-zero probability. Pascal's Wager fails because the utility is infinite and the probability is vanishingly small. Here, the utility is finite but the *number* of agents is huge. Even a tiny correlation coefficient, multiplied by $10^{50}$ agents, dominates local causal consequences.

  **Jamie:** And that's terrifying. You're saying that because the universe might be big, I should ignore the people actually in front of me—the ones I can actually help—to serve ghosts.

  **Alex:** I'm saying the people in front of me *are* the ghosts, from the perspective of the multiverse. We're all just instances. If I help you, I'm strengthening the "Cooperate" algorithm locally, which boosts its frequency globally.

  **Jamie:** See, that's where I bail. That's mysticism. "Strengthening the algorithm globally." How? By magic?

  **Alex:** By logical implication!

  **Jamie:** Logical implication doesn't feed the poor, Alex. Causality feeds the poor.

  **Alex:** But if we all follow causality, we end up in a Prisoner's Dilemma Nash equilibrium. Suboptimal for everyone. ECL is the only way out of the trap without a central enforcer.

  **Jamie:** Maybe the trap is real. Maybe there is no way out without a central enforcer. Accepting that might be more honest than inventing acausal partners to save us from it.

  **Alex:** So you'd rather leave utility on the table? Just because the mechanism feels weird?

  **Jamie:** I'd rather not burn resources on a transaction I can't verify, with partners I can't identify, based on a correlation I can't measure. Call me a Causal Decision Theorist. I'll take the box with the thousand dollars and leave the million behind. At least I know I have the thousand.

  **Alex:** *(Sighs, picking up a marker)* Fine. But when you're writing your grant proposals, don't ask for funding to solve coordination problems. Because according to you, without a causal contract, coordination is impossible.

  **Jamie:** And when you're writing yours, don't claim you're "saving the multiverse." Claim you're helping the people actually here. It's less sexy, but it's real.

  **Alex:** *(Writes "ECL?" on the clean board)* We'll see. If the universe is infinite, Jamie, "here" is a lot smaller than you think.

  **Jamie:** And if it's empty, "cooperation" is a lot quieter.

  *(Jamie tosses the eraser into the tray. Alex caps the marker. Neither moves to leave.)*
