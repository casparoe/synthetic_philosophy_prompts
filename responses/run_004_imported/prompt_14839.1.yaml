answer: |-
  **Title:** The Branch-Line Case
  **Characters:**
  *   **JULIAN (50s):** Lying in a hospice bed within the facility. Pale, hooked to monitors. His heart was damaged during the scan. He has days, maybe hours.
  *   **SARAH (50s):** Sitting beside him. Sharp-eyed, holding a lukewarm coffee. They did their PhDs together in the 90s.

  **Setting:** A sterile recovery room. A tablet sits on the bedside table, screen dark.

  [SCENE START]

  **SARAH**
  He sent a message.

  **JULIAN**
  (Without opening his eyes)
  I know. Did he mention the garden?

  **SARAH**
  He said the Mars habitat has a hydroponics bay. He said he's already planted the tomatoes. *Your* tomatoes. The ones you've been saving seeds for since 2018.

  **JULIAN**
  (Opens eyes. They are glassy.)
  Then he is me, Sarah. The memories are continuous. The intentions are carried forward. Relation R holds.

  **SARAH**
  Relation R. God, I haven't heard that since seminar. You're quoting Parfit while your heart is failing, Jules.

  **JULIAN**
  It's the only thing that makes the pain manageable.

  **SARAH**
  Does it? Because you look terrified.

  **JULIAN**
  (A long pause. He adjusts the oxygen cannula.)
  I am terrified. Biologically. The animal is afraid of the dark. But the person… the person is trying to understand that the fear is based on a false premise.

  **SARAH**
  The false premise being that you're about to cease to exist.

  **JULIAN**
  The false premise that *identity* is what matters. I am here. He is there. We are psychologically connected. If the scanner hadn't wrecked my heart, there would be two of us. We would both claim to be Julian. If we both claim it, then identity can't be the thing that matters. There can't be two *identical* identities. So it must be the continuity that counts.

  **SARAH**
  (Leans forward, voice hard)
  If the scanner hadn't wrecked your heart, there would be *you*, and there would be a *copy*. And I would be sitting here with you, and I would be video-calling him. And when you died, I would mourn you. And if he died, I would mourn him. Two funerals. Two distinct losses.

  **JULIAN**
  But why? If he has my mind…

  **SARAH**
  Because he doesn't have your *point of view*. That's the hole in Parfit, Jules. It's always been the hole. He talks about psychological connectedness like it's a bridge you can walk across. But it's not a bridge. It's a fax machine. You send the document, and you keep the original. Then you shred the original.

  **JULIAN**
  (Winces, a spasm in his chest)
  The "further fact." Parfit says there is no further fact. There is just the brain and the body. If the pattern continues, I continue.

  **SARAH**
  The pattern continues. *You* don't. Look at me. Who is looking at me right now?

  **JULIAN**
  I am.

  **SARAH**
  You are. The Julian on Earth. The one whose cells are currently starving for oxygen. When that light goes out in your eyes, *your* world ends. Not the world's. *Yours*. The Julian on Mars? He wakes up thinking he's you. He remembers this room. He remembers this coffee. But he won't remember *dying*. He'll remember going to sleep and waking up in a red dust storm. He's not your survival, Julian. He's your heir.

  **JULIAN**
  (Whispering)
  An heir inherits property. He inherits… the self.

  **SARAH**
  He inherits your debts. He inherits your wife's phone number. He inherits the story of your life. But he is not the protagonist. You are the protagonist of a story that is ending. Stop trying to write an epilogue for a character who's just been killed off.

  **JULIAN**
  (He turns his head to the tablet. He taps it. The screen lights up. A video file: *JULIAN_MARS_01*. He doesn't play it.)
  If I accept your view, Sarah… if I accept that I am a further fact, distinct from my psychology… then death is a wall. A black void.

  **SARAH**
  It is.

  **JULIAN**
  I can't climb that wall. Not now. Not when the end is this close. Parfit… he offered a way to dissolve the wall. To say the wall is an illusion.

  **SARAH**
  It's a beautiful illusion. It's comforting. It lets you feel like you're winning against entropy. But it's a story you're telling yourself so you don't scream.

  **JULIAN**
  (His breathing hitches. He grips the sheet.)
  Maybe. But if I tell the story… if I live inside the reductionist view… the fear lessens. I look at him on Mars, and I try to feel… not that he is me, but that *I am him*. Or that the distinction is trivial.

  **SARAH**
  Is it trivial? If he commits a crime, do you go to jail?

  **JULIAN**
  No.

  **SARAH**
  If he falls in love, do you feel the joy?

  **JULIAN**
  No.

  **SARAH**
  Then the connection isn't what matters. The *identity* is what matters. Because the consequences don't transfer. You're bearing the cost of the scan—the death—and he's getting the benefit—the life. That's not survival, Jules. That's sacrifice.

  **JULIAN**
  (Tears leak from the corners of his eyes. He doesn't wipe them.)
  I know. Intellectually, I know your argument is stronger. It aligns with the phenomenology. The "I" that speaks now will not speak again.

  **SARAH**
  Then stop it. Stop pretending you're going to Mars. Let me grieve you. Let you grieve yourself. Don't die pretending you're someone else.

  **JULIAN**
  Because if I admit I'm dying… truly dying… then the last few days are just a waiting room.

  **SARAH**
  They're your last days. They're real. This pain is real. My hand in yours is real. That man on Mars? He's a ghost. He's a memorial statue that talks.

  **JULIAN**
  (He looks at her hand covering his. His grip is weak.)
  But Sarah… if I am just a bundle of experiences… and that bundle is re-tied on Mars… why does the location of the string matter?

  **SARAH**
  Because the knot is here. And you're untying it.

  (Silence. The monitor beeps a slow, irregular rhythm.)

  **JULIAN**
  I wanted to believe him. The version of me who made it. I wanted to feel his relief. That he survived.

  **SARAH**
  He did survive. As a copy.

  **JULIAN**
  Does it matter? If he lives a good life… if he finishes the paper on reductionism… if he loves you…

  **SARAH**
  (Sharp intake of breath)
  Don't.

  **JULIAN**
  If he loves you. Doesn't that salvage something?

  **SARAH**
  It salvages *him*. It doesn't salvage *us*. I am sitting here with a dying man who is trying to argue himself out of his own death because he's too proud to admit he's scared.

  **JULIAN**
  (A faint, ragged smile)
  I am scared, Sarah. I am so scared. Parfit… he wrote it in a study. In Oxford. With tea. He didn't write it while his heart was shutting down.

  **SARAH**
  (Softens. She squeezes his hand.)
  I know.

  **JULIAN**
  I'm trying… I'm trying to view my life as a series of overlapping strands. And the strand here is ending, but the strand there…

  **SARAH**
  The strand there is new. It just looks like the old one.

  **JULIAN**
  (He closes his eyes. His voice is barely audible.)
  Maybe. But when I think of him… looking at the Earth from Mars… I feel a warmth. Is that not evidence?

  **SARAH**
  That's empathy, Jules. You're empathizing with him. Like you would with a son. Or a brother.

  **JULIAN**
  It feels like… self-love.

  **SARAH**
  Then it's a trick. A beautiful, terrible trick.

  **JULIAN**
  (He doesn't open his eyes.)
  I'd rather be tricked than extinguished.

  **SARAH**
  (She watches him for a long moment. She reaches out and turns the tablet face down.)
  You're not extinguished. Not yet. You're right here. And I'm not talking to Mars. I'm talking to you.

  **JULIAN**
  For now.

  **SARAH**
  For now. And while you're here, you're Julian. Not Relation R. Not a psychological continuum. Julian. Who hates tomatoes but grows them anyway because he likes the smell of the vines.

  **JULIAN**
  (A soft chuckle, which turns into a cough.)
  The smell is… good.

  **SARAH**
  Stay here for it. Don't go to Mars yet. Stay here with the smell.

  **JULIAN**
  (Whispering)
  Okay. Okay. I'm here.

  (He settles back. The monitor beeps. Steady, for a moment. Sarah keeps her hand on his. She looks at the face-down tablet, then back to her friend, refusing to let the philosophy win the room, even if the biology is about to.)

  [SCENE END]
