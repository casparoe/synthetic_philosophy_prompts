answer: |-
  **Toast Script**

  **(Stand up, take a breath, and smile at Maya. Keep your hands steady on the glass.)**

  Hi everyone. For those who don't know me, I'm the annoying sixteen-year-old sibling. Maya asked me to speak, which is brave, considering I'm legally required to roll my eyes at her at least three times a day.

  This semester in APUSH, we read Benjamin Franklin's autobiography. For the debate team in the back, yes, I know the excerpt. For everyone else, basically: Franklin was obsessed with self-improvement. He made a chart of thirteen virtues—like Temperance, Order, Industry—and every time he messed up, he put a dot next to it. His goal was a clean chart.

  And I read that, and I immediately thought of Maya.

  Maya, you have color-coded bullet journals. You have habit tracker apps with streaks that would make a monk weep. Mom still has your middle school chore chart laminated in a cabinet. You are basically Benjamin Franklin in a cardigan. You have spent your life trying to polish yourself into something perfect.

  But here's the thing Franklin admits at the end of the book: He never got a clean chart. He says he never mastered Humility. He tried, but he was too proud of how humble he was being. And he tells this story about a smith polishing an axe. The guy wants it perfectly shiny, but the grinding wheel is so much work. Eventually, he decides he likes the axe "speckled." He realizes a perfectly polished axe is useless if you spend all your time polishing it instead of chopping wood.

  I think that's the perfect note for tonight. Not because you should stop striving—Grandma, I know you're watching, and the striving is good. But because marriage isn't about a clean chart.

  Dan, you aren't marrying a laminated chore chart. You're marrying a human being. And Maya, you don't need to track your virtues for him. The point of an axe isn't to be shiny; it's to build something. And the point of a marriage isn't to be perfect; it's to be real.

  Franklin failed at humility. But he still built a life that mattered. Maya, you're going to make mistakes. You're going to have speckles. And that is exactly why we all love you so much.

  So, if everyone could raise a glass. To Maya and Dan: May your life be full of work worth doing, and may you never worry about a few speckles along the way.

  **(Take a sip.)**
