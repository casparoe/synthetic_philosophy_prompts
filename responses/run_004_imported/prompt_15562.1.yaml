answer: |-
  "It wasn't pretend, Tomas."

  "I didn't say pretend. I said quasi. There's a structural difference."

  "There wasn't a difference in my tear ducts."

  "Physiology isn't ontology. You know the Charles case. Charles watches the slime, he screams, his adrenaline spikes. But he doesn't leave the theater. He doesn't call the police. He doesn't believe he's in danger. Therefore, he isn't afraid. He's making believe he's afraid."

  "Charles felt fear. You're just defining fear by what comes after, not what happens during."

  "I'm defining it by what it *is*. Fear is a state that prepares the organism for threat. If you remove the belief in the threat, you remove the function. You're left with the sensation without the substance. Just like you tonight. You cried for a woman who doesn't exist."

  "She exists in the film."

  "She exists as pixels. You know that. So when you felt pity, where was the object of the pity?"

  "In the situation. In the thought of her suffering."

  "Thought theory. Fine. But here's the rub, Mireille. If you really pitied her—if this was genuine ethical distress—you would have reached for your phone. You'd be looking for a way to intervene. But you didn't. You sat there and ate popcorn."

  "Because I know I can't intervene. Belief in efficacy is a prerequisite for action, not for emotion. I can feel helpless pity. That doesn't make the pity fake."

  "Does it? Or does it mean you're conflating pity with sadness? Sadness is passive. Pity is active. Pity implies a subject who suffers and an object who wants to alleviate it. If you remove the possibility of alleviation because you know the suffering is fictional, you've severed the motivational link. You're enjoying the sensation of pity without the cost of pity."

  "That's cynical. I'm not enjoying it."

  " Aren't you? That's why we go to tragedies. We want the tears without the burden. If you really believed she was suffering, you'd be devastated. You'd be ruined. Instead, you're wiped, but you're walking out discussing the cinematography. That's the distance make-believe provides."

  "I'm not devastated because I know it's a representation. But the grief is directed at the human condition the representation reveals. The pity is real because the suffering is possible."

  "Now you've shifted the object. You're not pitying *her*. You're pitying the idea of her. You're pitying yourself, or us. That's narcissism, not pity."

  "It's empathy. It's the capacity to be moved by the imagined plight of another. If I have to believe you're actually bleeding to feel shock, I'm a sociopath. Imagination bridges the gap."

  "Imagination bridges the gap for action, too. If the imagination doesn't bridge the gap to action, then it's not actually connecting you to the other. It's connecting you to a simulation. Look, I'm not saying you're cold. I'm saying the category is different. Quasi-pity allows us to practice empathy safely. But don't call it the real thing if it lacks the real consequences."

  "Consequences don't validate the feeling. The feeling validates the feeling. If I feel pain, I'm in pain. Even if the knife was plastic."

  "If the knife was plastic, you weren't stabbed. You were startled. There's a difference between being startled and being wounded. You were startled into tears. I'm saying let's call it what it is. Aesthetic emotion. Not ethical emotion."

  "Ethics starts in the imagination, Tomas. If I can't feel for the fictional other, I won't feel for the real one when it's inconvenient. This wasn't practice. This was the real thing, just contained."

  "Contained by what? By the knowledge that it's fake. That knowledge is the wall. You hit the wall and stopped. Real pity climbs the wall. Real pity gets you out of the seat."

  "Real pity also knows when it's powerless. You're arguing that emotion is only real if it's useful. That's pragmatism, not phenomenology."

  "I'm arguing that emotion is a tool for navigation. If you aren't navigating, you're sightseeing. And there's nothing wrong with sightseeing. Just don't pretend you're lost."

  "I feel lost."

  "Then you're making believe you're lost. Because you know the way home."
