  # Seminar Handout: The Diaconescu–Goodman–Myhill Theorem
  **Course:** Philosophy of Mathematics (Graduate Seminar)  
  **Topic:** Constructivism, Choice, and the Law of Excluded Middle  
  **Date:** [Insert Date]

  ---

  ## 1. Introduction: The Constructive Intuition regarding Choice

  It is a common initial reaction among students of constructive mathematics to view the **Axiom of Choice (AC)** as benign, or even inherently constructive. The intuition is straightforward: AC asserts that if we have a family of non-empty sets, we can "choose" an element from each. Since constructivism demands that we produce objects to prove existence, a principle guaranteeing the existence of selections sounds like it should be welcome.

  However, in the context of **Intuitionistic Zermelo–Fraenkel set theory (IZF)**, the full Axiom of Choice is devastating to the constructive project. The **Diaconescu–Goodman–Myhill (DGM) Theorem** proves that in IZF, AC entails the **Law of Excluded Middle (LEM)**. Since LEM ($P \lor \neg P$) is the hallmark of classical logic and is rejected by constructivists for undecidable propositions, AC must also be rejected in IZF.

  This handout provides two things:
  1.  A fully explicit, step-by-step derivation of LEM from AC in IZF.
  2.  A philosophical diagnosis of *why* this happens, specifically addressing the role of the Separation Axiom and the status of AC in constructive set theory versus type theory.

  ---

  ## 2. The Proof: Deriving LEM from AC in IZF

  We work within **IZF**. This theory uses intuitionistic logic but includes the standard ZF axioms, including **Unrestricted Separation**.

  ### 2.1 The Setup
  Let $P$ be an arbitrary proposition. In a constructive setting, we do not assume $P \lor \neg P$ holds. We will show that assuming AC forces this disjunction to hold.

  Let $2 = \{0, 1\}$ be the set of natural numbers less than 2. Note that equality on $2$ is decidable constructively: for any $x, y \in 2$, we can prove $x = y \lor x \neq y$.

  Using the **Axiom of Separation**, we define two subsets of $2$ dependent on $P$:
  $$ A = \{ x \in 2 \mid x = 0 \lor P \} $$
  $$ B = \{ x \in 2 \mid x = 1 \lor P \} $$

  **Observation 1: $A$ and $B$ are inhabited.**
  *   To show $A$ is inhabited, we need an element $x \in 2$ such that $x=0 \lor P$. We can choose $x=0$. Since $0=0$ is true, the disjunction $0=0 \lor P$ is true. Thus $0 \in A$.
  *   To show $B$ is inhabited, we need an element $x \in 2$ such that $x=1 \lor P$. We can choose $x=1$. Since $1=1$ is true, the disjunction $1=1 \lor P$ is true. Thus $1 \in B$.

  ### 2.2 Invoking the Axiom of Choice
  Consider the family of sets $\mathcal{F} = \{A, B\}$. This set exists by the Axiom of Pairing.
  Since every member of $\mathcal{F}$ is inhabited, the **Axiom of Choice** asserts the existence of a choice function $f: \mathcal{F} \to \bigcup \mathcal{F}$ such that for every $X \in \mathcal{F}$, $f(X) \in X$.

  Let us define the specific choices made by this function:
  $$ a = f(A) $$
  $$ b = f(B) $$

  By the definition of the choice function:
  1.  $a \in A \implies (a = 0 \lor P)$
  2.  $b \in B \implies (b = 1 \lor P)$

  ### 2.3 The Case Split
  Since $a, b \in 2$, and equality on $2$ is decidable, we have:
  $$ a = b \lor a \neq b $$

  We analyze these two cases to derive $P \lor \neg P$.

  #### Case 1: Assume $a = b$
  If $a = b$, then the element $a$ belongs to both $A$ and $B$ (since $a \in A$ and $b \in B$).
  $$ a \in A \cap B $$
  Unpacking the definitions of $A$ and $B$:
  $$ (a = 0 \lor P) \land (a = 1 \lor P) $$
  Distributing the conjunction over the disjunction:
  $$ (a = 0 \land a = 1) \lor P $$
  Since $0 \neq 1$, the clause $(a = 0 \land a = 1)$ is false ($\bot$). Thus, we are left with:
  $$ \bot \lor P \implies P $$
  **Result:** $a = b \implies P$.

  #### Case 2: Assume $a \neq b$
  To show this case yields $\neg P$, we first establish the contrapositive: $P \implies a = b$.
  *   Assume $P$ is true.
  *   If $P$ is true, then the condition $(x = 0 \lor P)$ is true for all $x \in 2$. Thus $A = \{0, 1\}$.
  *   Similarly, if $P$ is true, $(x = 1 \lor P)$ is true for all $x \in 2$. Thus $B = \{0, 1\}$.
  *   Therefore, if $P$ holds, $A = B$ as sets.
  *   Since $f$ is a function, it is extensional: if the inputs are equal, the outputs must be equal.
  *   $A = B \implies f(A) = f(B) \implies a = b$.

  We have proven $P \implies a = b$. In intuitionistic logic, we can validly infer the contrapositive for negation:
  $$ \neg(a = b) \implies \neg P $$
  Since $a \neq b$ is defined as $\neg(a = b)$:
  **Result:** $a \neq b \implies \neg P$.

  ### 2.4 Conclusion
  We have established:
  1.  $a = b \lor a \neq b$ (Decidability of equality on 2)
  2.  $a = b \implies P$
  3.  $a \neq b \implies \neg P$

  By constructive case analysis (disjunction elimination), we conclude:
  $$ P \lor \neg P $$
  Since $P$ was arbitrary, the Law of Excluded Middle holds. **Q.E.D.**

  ---

  ## 3. Diagnosis: Is it Choice or Separation?

  The proof above is rigorous, but it leaves a philosophical question open: **Where exactly did constructivity fail?** Your colleagues disagree on whether the Axiom of Choice is the culprit, or whether it is the background theory's allowance of **Unrestricted Separation**.

  ### 3.1 The Role of Unrestricted Separation
  In the proof, we defined the sets $A$ and $B$ using the proposition $P$:
  $$ A = \{ x \in 2 \mid x = 0 \lor P \} $$
  In IZF, the **Axiom of Separation** allows us to form a set from *any* formula $\phi(x)$, even if $\phi$ contains undecidable propositions like $P$. This allowed us to "hide" the undecidable status of $P$ inside the definition of the sets $A$ and $B$.

  If we move to a predicative constructive set theory like **CZF (Constructive Zermelo–Fraenkel)**, the Separation axiom is restricted to **bounded formulas** (formulas where all quantifiers are restricted to specific sets). In CZF, we generally cannot form the set $\{ x \in 2 \mid x = 0 \lor P \}$ unless $P$ is already decidable.
  *   If $P$ is decidable, $P \lor \neg P$ is already true, and the DGM argument is trivial.
  *   If $P$ is undecidable, CZF blocks the formation of sets $A$ and $B$.
  *   Consequently, the DGM proof **cannot be run in CZF**.

  This suggests that Unrestricted Separation is the *enabler* that allows AC to trigger the collapse into classical logic.

  ### 3.2 The Role of the Axiom of Choice
  However, blaming Separation alone lets AC off the hook too easily. Why is AC considered "non-constructive" even in contexts where it doesn't imply LEM?

  1.  **Existence without Method:** The BHK (Brouwer–Heyting–Kolmogorov) interpretation requires that a proof of $\exists x \phi(x)$ provides a specific witness $x$ and a proof that $\phi(x)$ holds. The Axiom of Choice asserts the existence of a choice *function* $f$ without providing a rule or method for constructing it. It asserts that the selections *can be made*, not *how* they are made. This violates the constructive demand for explicit computability.
  2.  **Comparison with Type Theory:** In Martin-Löf Type Theory (MLTT), a form of AC is actually a **theorem**. Why doesn't DGM apply there?
      *   In MLTT, the quantifiers $\forall$ and $\exists$ are inherently constructive. $\forall x \in A, \exists y \in B, \phi(x,y)$ *means* there is a function $f: A \to B$ such that $\phi(x, f(x))$.
      *   In Set Theory (IZF/CZF), $\forall x \exists y$ is a logical relation, not a function. AC promotes a relation to a function.
      *   Therefore, AC is "constructive" in Type Theory because the ontology is already functional. In Set Theory, AC imports non-constructive existence into a framework where existence is not inherently functional.

  ### 3.3 Verdict on the Slogan
  > *"The Axiom of Choice is intuitionistically suspect."*

  **Is this fair?**
  **Yes.** Even if DGM requires Unrestricted Separation to derive LEM, AC remains suspect in set theory because it asserts the existence of objects (choice functions) without providing a construction. It creates a gap between "knowing a selection exists" and "being able to specify the selection."

  **Is it misleading?**
  **Somewhat.** It suggests AC is inherently classical. As MLTT shows, choice principles can be compatible with constructive logic if the underlying ontology treats existence as inherently functional. The DGM theorem specifically highlights the incompatibility of **Full AC + Unrestricted Separation + Set-Theoretic Ontology**.

  **Summary for Seminar Discussion:**
  The DGM theorem shows that in IZF, AC is too strong for constructive logic. However, the "explosive" nature of AC depends on the ability to form sets via Unrestricted Separation. In weaker theories like CZF, AC does not necessarily imply LEM, but it is still often rejected or weakened (e.g., to Dependent Choice) because it violates the heuristic that existence implies constructibility.

