prompt: |-
  Years ago, when we were both junior employees who felt stuck in our jobs, I told a colleague, somewhat casually, that if I were ever in a position to hire, I would bring them onto my team. I have since become a director with an opening, and this colleague, who says they turned down another job offer while waiting for mine to come through, has reminded me of what I said back then. They are competent, but clearly a weaker fit than another candidate who applied through the normal process, and choosing them anyway would be unfair to both my team and my employer. Does a promise made so casually, and under such different circumstances, still bind me now, or am I free to hire the stronger candidate? And if I am not entirely free, what, if anything, would I still owe my old colleague?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Promise:** Made years ago, casually, between two junior employees who felt stuck. "If I were ever in a position to hire, I would bring them onto my team."
      *   **Current Status:** The user is now a Director with an opening. The colleague is applying/waiting.
      *   **The Colleague's Claim:** They turned down another offer waiting for this one, citing the past conversation.
      *   **The Reality:** The colleague is competent but a *weaker fit* than another candidate. Hiring them would be unfair to the team and employer.
      *   **The Core Question:** Does the casual promise bind the user? Are they free to hire the stronger candidate? If not entirely free, what is owed?

  2.  **Ethical & Professional Framework:**
      *   **Fiduciary Duty:** As a Director, the user has a primary responsibility to the company, the team, and the stakeholders. Hiring the best candidate is part of this duty.
      *   **Nature of the Promise:** It was conditional ("*If* I were ever in a position..."), casual, and made in a different context (commiserating vs. actual hiring). It lacks the specifics of a contract (salary, role, start date, performance expectations).
      *   **Fairness:** Hiring a less qualified candidate over a better one based on a past casual remark is nepotism/cronyism. It disadvantages the better candidate and hurts team performance.
      *   **Relationship:** There is a personal/professional relationship with the colleague. Burning bridges is undesirable, but enabling underperformance is worse.

  3.  **Evaluate the "Binding" Nature of the Promise:**
      *   *Legally:* Not binding. No consideration, too vague, likely not intended as a legal contract.
      *   *Morally:* Weakly binding. Context matters. The intent was likely support/encouragement, not a guaranteed job offer regardless of merit.
      *   *Professionally:* Not binding. Professional standards dictate hiring based on merit and fit.

  4.  **Address the Colleague's Action (Turning down the other offer):**
      *   Did the user *ask* them to wait? No.
      *   Did the user *promise* a job *now*? No.
      *   The colleague made a unilateral risk based on an interpretation of a past comment. This is on the colleague, not the user.

  5.  **Determine What is Owed:**
      *   *The Job?* No.
      *   *Honesty?* Yes.
      *   *Respect?* Yes.
      *   *Support?* Yes (within reason).
      *   *Transparency?* Yes (to a degree).

  6.  **Drafting the Advice (Iterative Process):**

      *   *Direct Answer:* Start by validating the user's instinct. You are not bound.
      *   *Reasoning:* Break down *why*. (Context change, fiduciary duty, nature of the promise).
      *   *The Colleague's Gamble:* Address the "turned down offer" aspect gently but firmly. That was their choice.
      *   *Action Plan:* How to handle the conversation?
          *   Don't ghost.
          *   Be kind but clear.
          *   Offer help (references, networking).
      *   *Internal Reflection:* Why does the user feel guilty? (Imposter syndrome? Loyalty?)

  7.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Professional ethics must take precedence.
      *   Avoid blaming the colleague, but clarify boundaries.

  8.  **Key Points to Cover:**
      *   **The Promise:** It was aspirational, not contractual. Context has changed.
      *   **Fiduciary Duty:** You work for the company first.
      *   **The "Wait":** The colleague took a risk without a guarantee.
      *   **The Decision:** Hire the best fit.
      *   **The Aftermath:** How to break the news and maintain the relationship.

  9.  **Self-Correction/Nuance Check:**
      *   *Is there any scenario where hiring the friend is okay?* Only if they are equally qualified. But the prompt says "weaker fit." So, no.
      *   *Should I mention the other candidate?* Don't disclose specific details about the other candidate (confidentiality), but focus on "fit" and "needs of the role."
      *   *What if the colleague gets angry?* Acknowledge that risk, but stand firm on professional integrity.

  10. **Final Structure:**
      *   Direct Answer (No, you are not bound).
      *   Ethical/Professional Analysis (Why).
      *   Addressing the Colleague's Sacrifice (Why it's not on you).
      *   What You Do Owe (Respect, honesty, support).
      *   Script/Approach for the conversation.

  11. (Final Polish): Ensure the distinction between "loyalty to a friend" and "loyalty to the organization" is clear. Emphasize that hiring the wrong person actually hurts the friend too (setting them up for failure).

  *(Self-Correction during drafting)*: I should make sure not to sound too cold. The user clearly cares about this person. I need to balance professional duty with human kindness. The advice should be about how to let them down *well*, not just that it's okay to let them down.

  12. **Final Output Generation** (similar to the provided good response).
answer: |-
  You are **not bound** by that promise, and you should hire the stronger candidate.

  While it is natural to feel a tug of loyalty or guilt, your professional and ethical obligations as a Director outweigh a casual conversation from years ago. Here is a breakdown of why you are free to make the best business decision, what you owe your colleague, and how to handle the situation with integrity.

  ### 1. The Nature of the Promise
  A promise is only morally binding if the context in which it was made remains relevant.
  *   **It was aspirational, not contractual:** When two junior employees commiserate about being "stuck," statements like "I'll hire you someday" are expressions of solidarity and mutual support. They are not job offers. They lack specifics regarding role, compensation, timing, or performance expectations.
  *   **The context has shifted:** You are no longer a peer; you are a decision-maker with fiduciary responsibilities. The criteria for hiring have changed from "I want to help my friend" to "I need to build a high-performing team."
  *   **Implicit Conditions:** All professional hiring promises carry an implicit condition: *"...provided you are the right fit for the role at that time."* That condition is not met here.

  ### 2. Your Fiduciary Duty
  As a Director, you have a primary obligation to your employer, your team, and the stakeholders who rely on your department's success.
  *   **Fairness to the Team:** Hiring a weaker candidate forces your existing high-performers to pick up the slack. This breeds resentment and lowers morale.
  *   **Fairness to the Other Candidate:** The candidate who applied through the normal process and is a stronger fit deserves the role based on merit. Denying them the opportunity to advance their career based on a private conversation you had years ago is unethical.
  *   **Fairness to the Colleague:** Paradoxically, hiring your colleague when they are not the right fit sets *them* up for failure. If they struggle in the role, it could damage their reputation and your working relationship permanently.

  ### 3. The Colleague's Decision to Wait
  It is unfortunate that your colleague turned down another offer, but **that risk was theirs to take, not yours to manage.**
  *   Unless you explicitly told them, "Do not take another job; I guarantee you a position here," they made a unilateral gamble based on hope.
  *   You cannot be held hostage by a decision they made without your consultation. Accepting responsibility for their opportunity cost would set a dangerous precedent in your leadership career.

  ### 4. What You Do Owe Them
  While you do not owe them the job, you do owe them **respect, honesty, and support.** Because of your history, a standard rejection email is insufficient.

  *   **Transparency (with boundaries):** You do not need to say, "Someone else was better than you." Instead, frame it around the specific needs of the role. "The direction of this team requires a specific skillset in [X] that we prioritized for this opening."
  *   **Timeliness:** Do not drag this out. If you know the decision is made, tell them immediately so they can re-enter the job market.
  *   **Active Support:** This is where you honor the spirit of your old friendship. Offer to be a reference, review their resume, or introduce them to other hiring managers in your network.
  *   **Kindness:** Acknowledge the difficulty of the situation. You can validate their feelings without validating their claim to the job.

  ### 5. How to Have the Conversation
  Schedule a brief call. Do not do this over email if you have a long history.

  > *"I wanted to speak with you personally regarding the role. I know we spoke years ago about working together, and I have a lot of respect for your skills and our history. However, for this specific position, we've decided to move forward with a candidate whose background is a closer match for the immediate technical needs of the team.*
  >
  > *I know you mentioned you were waiting on this, and I'm truly sorry to hear that you passed on other opportunities hoping for this outcome. I wish I could have made this happen, but I have to make the decision that's best for the business and the team. I want to help you land the right role, though. I'd be happy to [offer a reference/make introductions/review your portfolio]."*

  ### Summary
  You are free to hire the stronger candidate. In fact, you are **obligated** to do so.

  Honoring a casual promise at the expense of your company's interests is not loyalty; it is mismanagement. You can honor your friendship by treating them with dignity during the rejection and helping them move forward, rather than by giving them a job they aren't the best fit for.
