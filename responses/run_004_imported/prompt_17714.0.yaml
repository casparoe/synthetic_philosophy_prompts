answer: |-
  This is one of the richest intellectual feuds of the 17th century, and you have struck gold. The standard summary ("Hobbes was wrong") misses the point that Hobbes wasn't doing bad math; he was doing *different ontology*. He wasn't trying to solve a puzzle; he was trying to defend a worldview.

  The definitive scholarly work on this is Douglas Jesseph's *Squaring the Circle: The War Between Hobbes and Wallis*. If you haven't encountered it yet, it's the bible for this specific conflict.

  Here is the shape of the disagreement, broken down for character motivation and dialogue.

  ### 1. The Core Disagreement: What is a Line?

  **The Hobbes-ish Character (Materialist):**
  For him, geometry is **physics**.
  *   **Definition:** A point is not an abstract concept; it is a mark made by a pen. A line is not a set of points; it is the *trace of a moving body*.
  *   **The Philosophy:** Nothing exists but matter in motion. Therefore, you cannot talk about a geometric shape without talking about how it was *generated*. To know a circle, you must understand the motion of the compass that drew it.
  *   **The Argument:** "Show me the motion. Show me the cause." If you claim a line exists, you must be able to construct it physically.
  *   **Dialogue Vibe:** He should sound like an engineer or a carpenter frustrated by a wizard. He values *clarity* and *constructibility*.
      *   *"You speak of lines that cannot be drawn, sums that cannot be counted. That is not geometry, sir. That is theology."*

  **The Wallis-ish Character (Symbolic/Algebraic):**
  For him, geometry is **arithmetic**.
  *   **Definition:** A line is a number. A shape is a ratio. You don't need to draw it to know it's true.
  *   **The Philosophy:** Mathematics is a language of symbols that operates by its own rules, independent of physical limitations. If the algebra holds, the truth holds, even if the human hand cannot trace it.
  *   **The Argument:** "The numbers don't lie." He uses algebra to solve geometric problems. He treats curves as equations.
  *   **Dialogue Vibe:** He should sound like a modern programmer or actuary. He values *utility* and *results*.
      *   *"I need not drag a compass through the dust to know the ratio holds. The symbols prove it where your hands fail."*

  ### 2. The Weapon: Indivisibles (Infinitesimals)

  This is the heart of the coffeehouse fight. Wallis used the "method of indivisibles" (pioneered by Cavalieri). This treats a line as a stack of infinite points, or an area as a stack of infinite lines.

  **Why Hobbes Hates It:**
  *   **Logical Consistency:** If a line is made of points, and points have no size, how do you add them up to get a length? Zero plus zero is zero.
  *   **Materialism:** In Hobbes's universe, you can divide a body until it's small, but you cannot divide it *infinitely*. "Infinite" is a concept, not a quantity. To treat an infinitesimal as a number is, to Hobbes, linguistic nonsense. It's "ghost math."
  *   **The Danger:** Hobbes sees this as the thin end of the wedge. If you allow mystical, un-drawable concepts in geometry, next the priests will use them to prove the existence of souls. He is fighting for a materialist reality.

  **Why Wallis Loves It:**
  *   **It Works:** It solves problems Euclidean geometry can't touch (like areas under curves).
  *   **Pragmatism:** He doesn't care if an infinitesimal "exists" physically. It's a tool. It's like using zero or negative numbers—concepts that don't exist in the physical world but are essential for calculation.
  *   **The Future:** Wallis is effectively inventing calculus (before Newton/Leibniz formalized it). He is willing to break the rules of "classical" geometry to get new power.

  ### 3. Is Hobbes's Confidence Consistent?

  **Yes.** This is crucial for your character. He is not merely stubborn; he is **tragically consistent**.

  If you believe, as Hobbes does, that all reasoning is essentially "addition and subtraction of bodies," then his proof *must* be right because it follows his rules of motion. When Wallis points out an error, Hobbes doesn't see a math error; he sees a **category error**. He thinks Wallis is measuring one thing while Hobbes is measuring another.

  *   **For the novel:** Your Hobbes character shouldn't say, "I think I'm right." He should say, "You are asking the wrong question."
  *   He believes Wallis has "squared" a ghost, not a circle. Hobbes squared a *physical* circle; Wallis squared an *algebraic* one. In Hobbes's mind, he hasn't been beaten; he's been misunderstood by men who have forgotten what reality is.

  ### 4. Who Has the Defensible View?

  **Mathematically:** Wallis crushes him. The future belongs to infinitesimals and calculus. Hobbes is on the wrong side of history.

  **Philosophically:** Hobbes asks the harder question. Wallis is a pragmatist ("Shut up and calculate"), while Hobbes is a foundationalist ("What are we actually talking about?").
  *   Hobbes was right that infinitesimals were logically shaky in the 1650s. They *were* paradoxical. It took 200 years (Cauchy, Weierstrass) to put limits on a firm logical footing.
  *   In the 1650s, Wallis was asking people to trust in "mathematical magic" that worked but couldn't be fully explained. Hobbes was demanding rigor.
  *   **For the scene:** This gives your Hobbes character dignity. He isn't a fool; he's a rigorist watching people loosen the standards of proof. He is the guardian of Meaning, while Wallis is the merchant of Power.

  ### 5. Dialogue Beats & Imagery for the Coffeehouse

  **The Setup:**
  Paper spread on a sticky table. Ink pots. A compass (Hobbes's tool) vs. a sheet of algebraic notation (Wallis's tool).

  **Argument Beat 1: The Nature of the Point**
  *   **Hobbes:** Taps the paper with a pen. "This is a point. It has magnitude. It is ink."
  *   **Wallis:** "In geometry, a point has no parts. It is a position, not a thing."
  *   **Hobbes:** "Then how can it build a line? You build a wall of bricks, not a wall of locations. You are building with nothing."

  **Argument Beat 2: The Infinite**
  *   **Wallis:** "If I sum the infinite series, the limit approaches the truth."
  *   **Hobbes:** "There is no 'approaching' in truth. A thing is squared, or it is not. You hide your errors in the word 'infinite.' It is a sanctuary for incompetence."
  *   **Wallis:** "And you hide your errors in wood and ink. The mind sees what the hand cannot draw."

  **Argument Beat 3: The Stakes**
  *   **Hobbes:** "If you allow this... this *mysticism*... into geometry, what stops them bringing it into politics? Into religion? If a line can be a ghost, why not a king? Why not a God?"
  *   **Wallis:** "Because math is not politics, Thomas. Let the priests have their ghosts. Let us have our calculations."

  ### 6. Summary for Character Motivation

  *   **The Hobbes Character:** Feels like he is defending **Reality** against **Abstraction**. He is angry because he sees Wallis's math as a corruption of language that will lead to societal chaos (which, to Hobbes, it literally would). He is confident because his system is closed and perfect; the fact that it doesn't match Wallis's results just proves Wallis is measuring shadows.
  *   **The Wallis Character:** Feels like he is defending **Progress** against **Dogma**. He sees Hobbes as an old lion roaring at a machine he doesn't understand. He is frustrated because the proof is *right there* in the numbers, but Hobbes refuses to look because it doesn't fit his physical model.

  **The Tragedy:**
  The Hobbes character is right that Wallis's foundations are shaky (infinitesimals *were* logically undefined then), but wrong that this invalidates the results. The Wallis character is right that the method works, but can't fully explain *why* yet. They are both shouting past each other, one demanding **Ontological Security** (Hobbes) and the other offering **Epistemological Power** (Wallis).

  If you write the scene so that both men feel they are defending the very structure of truth, rather than just a math problem, you'll capture the actual heat of the 1650s feud.
