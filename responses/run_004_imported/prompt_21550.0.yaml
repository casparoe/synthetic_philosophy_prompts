      *   **Round 2: Compensation vs. Retribution**
          *   *Claire:* Distinguishes fines from prison/death. Fines = compensatory (restoring loss), so payer identity doesn't matter. Prison/Death = retributive (guilty must suffer). Atonement is retributive. So the fine analogy fails.
          *   *Ben:* Attacks the compensation story. Fines go to the state, not victims. We also reject substitution for murder (where compensation is impossible). So compensation isn't the reason we allow fine substitution.
          *   *Adjudication:* This is tricky. Claire is making a conceptual distinction (retributive vs. compensatory). Ben is making an empirical/institutional point (who gets the money).
