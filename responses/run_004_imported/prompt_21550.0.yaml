      *(Self-Correction during drafting)*: I need to be careful about David Lewis. The prompt refers to "David Lewis's short paper on penal substitution." This is likely David Lewis (the philosopher, 1941-2001), who wrote "Do We Believe in Penal Substitution?" (Philosophical Papers, Vol 2?). Actually, it's often attributed to him in these circles, but sometimes people confuse him with C.S. Lewis. Given the "thought experiment" description, it sounds like the standard philosophical objection. I will treat the argument as presented in the prompt regardless of the specific bibliographic details, as the logic stands on its own.

      *Wait, one nuance:* Ben's argument about fines being "practically impossible to stop." This is empirically dubious. Courts could demand personal payment. They don't. Why? Because money is fungible. That's the key. Fungibility vs. Non-fungibility of liberty/life. I need to highlight this.

