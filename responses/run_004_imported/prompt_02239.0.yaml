answer: |-
  First off, I am sorry about the band situation. That sucks. And it is not weird at all that you are obsessing over the philosophy of it. When a social expectation is violated in a way that feels deeply *unfair* but isn't technically *illegal*, philosophy is exactly the tool you reach for to figure out why it hurts so much. Your housemate gave you a very accurate summary of one of the biggest debates in contemporary social ontology.

  The core of the disagreement between Michael Bratman and Margaret Gilbert is this: **Is a "we" just a bunch of "I"s working together, or is a "we" a distinct thing that creates its own rules?**

  Here is the breakdown of how each philosopher handles your bassist, the mechanics of their disagreement, and an assessment of which theory holds more water.

  ### 1. Margaret Gilbert: The Plural Subject Theory
  **The Core Idea:** When you and your bandmates agreed to play that gig, you didn't just align your individual intentions. You created a **plural subject**. You formed a "joint commitment."

  **How it handles your situation:**
  For Gilbert, a joint commitment is not just a sum of personal commitments (e.g., "I promise to play" + "You promise to play"). It is a single commitment owned by the group as a unit. Because the commitment belongs to the *group*, no single individual has the authority to dissolve it.

  *   **Did he need permission?** **Yes.** Absolutely. Under Gilbert's view, once a joint commitment is established, it can only be rescinded jointly. Your bassist could not unilaterally decide to stop being part of the "band-for-this-gig." He needed the other three of you to agree to release him from the commitment.
  *   **The Nature of the Wrong:** This explains why you feel *betrayed* rather than just *inconvenienced*. If this were just about logistics, you'd be annoyed about finding a sub. But Gilbert argues he violated a normative bond. He treated a group obligation as if it were a personal preference. By texting "can't do it" without discussion, he acted as if he were the sole owner of his contribution to the band, when in fact, that contribution was jointly owned.
  *   **The Verdict:** He was at fault. Not necessarily morally evil, but he violated the constitutive rules of acting together.

  ### 2. Michael Bratman: The Shared Intention Theory
  **The Core Idea:** Bratman is a reductionist. He thinks we don't need to posit a mysterious "plural subject" or "group mind." Shared intention is just a specific web of **interlocking individual intentions**.

  **How it handles your situation:**
  For Bratman, you have a shared intention to play the gig if:
  1.  You intend that *we* play.
  2.  He intends that *we* play.
  3.  These intentions are common knowledge.
  4.  Your sub-plans mesh (e.g., you plan to practice, he plans to show up).
  5.  You are both responsive to each other's intentions.

  *   **Did he need permission?** **No.** For Bratman, intentions are inherently individual. I cannot literally intend for *you* to do something; I can only intend that *we* do something, which relies on my prediction of your action. If the bassist changes his mind, he is changing his *individual* intention. He doesn't need your "permission" to change his own mind, any more than he needs permission to change his favorite color.
  *   **The Nature of the Wrong:** So, was he in the wrong? Bratman would say yes, but for different reasons. It's not that he broke a "group contract." It's that he violated the **rational norms of planning**.
      *   **Stability:** Shared intentions are supposed to be stable so we can coordinate. Flaking out undermines the stability required for the plan to work.
      *   **Reliance:** You formed your own sub-plans (promoting the show, practicing) based on his intention. By changing his intention without sufficient warning or reason, he made your own planning irrational.
      *   **Responsiveness:** A key part of Bratman's view is that partners must be responsive to each other. A text message with no discussion is a failure of responsiveness.
  *   **The Verdict:** He wasn't "forbidden" from quitting, but he was **irrational and unreliable**. He broke the web of interdependence that makes shared agency possible.

  ### 3. The Mechanics of the Disagreement: Why Bratman thinks Gilbert is "Too Strong"
  This is the crux of your housemate's point. Bratman has a specific set of objections to Gilbert's requirement that you need "permission" to exit a joint action.

  **A. The Rigidity Problem**
  Bratman argues that Gilbert's view makes shared action too much like a legal contract or a marriage.
  *   *Example:* Imagine we intend to go for a walk together. We start walking. Halfway through, I get a blister. Under Gilbert's strict view, I technically cannot stop walking until you agree to release me from our joint commitment to walk. That seems absurd.
  *   *Bratman's Fix:* I can unilaterally change my intention if I have a good reason, provided I communicate it so you can adjust. The obligation is to *coordinate*, not to *obtain permission*. Bratman thinks Gilbert confuses the *normative force* of a commitment (you shouldn't flake) with the *authority structure* (you can't leave).

  **B. The Ontology Problem (Occam's Razor)**
  Bratman argues that Gilbert is positing a "spooky" entity.
  *   If we can explain everything about the band—the planning, the reliance, the anger, the coordination—using only individual psychology (what's in your head and what's in his head), why do we need to invent a "plural subject"?
  *   Bratman thinks the feeling of "betrayal" can be explained by the violation of **reliance**. You relied on him; he knew you relied on him; he let you down. That creates guilt and anger without needing a metaphysical "joint commitment."

  **C. The Asymmetry Problem**
  Bratman points out that in many shared activities, power dynamics aren't equal. If a director and an actor are "jointly committed" to a scene, does the actor have equal veto power to release the director? Gilbert's theory suggests a symmetry of authority that doesn't always exist in real-world collaboration. Bratman's web of intentions allows for asymmetrical reliance.

  ### 4. Which Account is Closer to Right?
  You asked for an assessment of the general theory, not just what makes you feel better. Here is the philosophical weighing of the scales.

  **Where Gilbert Wins: The Phenomenology of Obligation**
  Gilbert is better at explaining *why you feel so angry*. Bratman's theory explains why the bassist was *unhelpful*, but Gilbert explains why he was *disloyal*.
  In close-knit groups (bands, marriages, friendships), the "permission" norm actually *does* seem to exist. If a spouse decides to move cities without discussing it, we don't just say, "Well, they changed their individual intention." We say, "You can't make that decision alone." Gilbert captures the specific normative force of **membership**. If your band feels like a "us" rather than a "me and you and him," Gilbert is describing your reality more accurately.

  **Where Bratman Wins: The Mechanics of Action**
  As a *general theory of joint action*, Bratman is widely considered the stronger account in philosophy of action.
  1.  **Scalability:** Bratman's theory works for loose associations (two people lifting a couch) and tight ones (a band). Gilbert's theory risks making every casual plan sound like a binding treaty.
  2.  **Flexibility:** Bratman correctly identifies that human coordination requires the ability to adapt unilaterally when circumstances change. If Gilbert is right, every time you want to leave a dinner plan, you are technically violating a norm until your friends "release" you. That creates a social world that is too rigid to function.
  3.  **Parsimony:** Bratman doesn't require us to believe in "group minds." He explains the social using the psychological. In science and philosophy, if you can explain a phenomenon without adding new entities, that is usually the preferred theory.

  **The Verdict**
  **Bratman is likely right about the *mechanics*, but Gilbert is right about the *norms*.**

  For a general theory of how humans coordinate action, Bratman's model is more robust. It explains how we actually move, plan, and adjust without getting bogged down in metaphysical contracts. His critique that Gilbert is "too strong" is valid; if we needed permission to exit every joint intention, social life would grind to a halt.

  **However,** in your specific case, Gilbert captures the *moral injury* better. You aren't angry because the logistics broke (Bratman); you're angry because the *bond* broke (Gilbert). In a band that has been together for three years, you have moved past "meshing sub-plans" into "plural subject" territory. You operate as a unit.

  **So, did he need permission?**
  *   **Technically (Bratman):** No. He has autonomy over his own intentions.
  *   **Normatively (Gilbert):** Yes. He was a co-owner of the plan, not just a participant.

  **My take:** Bratman provides the better *map* of human action, but Gilbert provides the better *law* for committed relationships. Your bassist failed the Bratman test (he was unreliable and unresponsive), but he violated the Gilbert contract (he treated a joint obligation as a personal choice). You are justified in feeling betrayed, not because he broke a rule, but because he treated a "we" as an "I."
