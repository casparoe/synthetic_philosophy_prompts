prompt: |-
  Ok so this is going to sound like a weirdly specific thing to be obsessing over, but our band almost fell apart two weeks ago and it's sent me down a philosophy rabbit hole I can't climb back out of. Quick context: four of us have been playing together for about three years, nothing serious, mostly bar shows, but we'd finally landed a real opening slot for a band that actually has a following. Four days out, our bassist texts the group chat "can't do it, sorry" and thats the whole message, no discussion, no warning. There's never been a contract between us or anything like that, we're not that kind of band, so technically he didnt break any rule - but I was way angrier than "inconvenienced," it felt like he'd specifically wronged the rest of us, not just let us down.

  My housemate is doing a philosophy MA and says this is basically the textbook case behind an argument that's apparently been going on for decades between Michael Bratman and Margaret Gilbert over "shared" or "joint" action. From what she explained to me (possibly garbled by the time it got to me): Bratman thinks the whole feeling of commitment can be built entirely out of each person's individual intentions and beliefs about each other - meshing sub-plans, being responsive to each other, everyone backing each other up - no group-level thing required over and above that. Gilbert apparently thinks that's not enough, that doing something together creates an actual "joint commitment" that's its own normative fact, and you can't just quietly back out of it without the others basically releasing you first, otherwise you're at fault no matter what any contract says. She also mentioned Bratman specifically thinks that last bit of Gilbert's view - that you need everyone's permission to back out - is way too strong, though she couldn't remember his actual argument for that.

  Could you walk me through how each of these two views would actually handle my situation, including whether my bassist "needed permission" in any real sense to bail, and then tell me which account you think is closer to right as a general theory of joint action (not just whichever one validates how betrayed I felt)? I'd really like the actual mechanics of the disagreement, including that bit about why Bratman thinks Gilbert's view is too strong, rather than a "philosophers disagree" shrug.
