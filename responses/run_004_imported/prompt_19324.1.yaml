      *   **The Director's Action:** Called out the behavior in a team retro (anonymous but obvious) as "not respecting process," lectured on accountability for 5 minutes.
      *   **The Director's Hypocrisy:** Regularly pushes to `main` without review. Claims exemption due to ultimate accountability/ownership.
      *   **The Friend's Advice:** "Two wrongs don't make a right." You broke the rule, focus on that.
      *   **The User's Dilemma:** Is there a principled distinction between "I broke the rule" and "He shouldn't be the one lecturing me"? Should I bring this up in the upcoming 1:1?

  2.  **Deconstruct the Core Conflict:**
      *   **Surface Level:** Policy violation vs. Policy enforcement.
      *   **Deeper Level:** Psychological Safety, Trust, Leadership Credibility, and Equity of Rules.
      *   **The "Two Wrongs" Argument:** Logically valid (my violation doesn't justify his), but emotionally and culturally incomplete. Leadership behavior sets the tone.
      *   **The "Director's Exemption" Argument:** Is it valid? In some contexts, yes (break-glass access). But using that exemption to lecture others on *their* adherence while exempting oneself creates a "Do as I say, not as I do" dynamic, which erodes trust.

  3.  **Evaluate the "Principled Distinction":**
      *   *Question:* Is there a real difference between "Was breaking the rule wrong?" and "Did he have the right to call it out that way?"
      *   *Answer:* Yes.
          *   **Issue A (Compliance):** Did the user violate the policy? Yes. (Friend is right here).
          *   **Issue B (Leadership/Culture):** How was the violation addressed? Public shaming vs. private coaching. Does the enforcer follow the same standards?
      *   *Why it matters:* If rules apply unequally, they become tools of power rather than safeguards. If enforcement is public/shaming, it reduces psychological safety.

  4.  **Assess the Risks and Benefits of Raising it in the 1:1:**
      *   **Risks:** Defensiveness from the Director, being labeled "difficult" or "making excuses," potential retaliation (subtle), damaging the relationship.
