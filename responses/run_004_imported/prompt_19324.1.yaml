      *   **Distinguish the Issues:** Clearly separate the *act* (merging) from the *response* (the lecture) and the *context* (the director's behavior).
      *   **Analyze the Director's Exemption:** Is it legitimate? "Ultimate accountability" is a common argument for leaders bypassing controls, *but* it shouldn't be used to shame others who don't have that same accountability level.
      *   **Strategy for the 1:1:**
