prompt: |-
  Kind of random context, but I'm taking a gen-ed philosophy elective this semester that's basically just called The Meaning of Life (needed the credit, not gonna lie I ended up actually liking it), and it's put me in this annoying headspace where I keep overanalyzing stuff that used to feel totally obvious. Anyway, here's an actual situation from my life, not a class assignment, that I can't stop chewing on.

  For like a year and a half now I've been restoring this beat up old sailboat with my uncle most weekends. I genuinely love it, I could talk your ear off about sanding fiberglass and re-rigging a mast, no joke. It has nothing to do with my major (pre-med), I'm never gonna sell the boat or race it, it's not resume material, it doesn't even relax me in some productive stress-relief way, I just like doing it while I'm doing it. My roommate has literally every hour of her week scheduled toward some future outcome, and whenever I bring up the boat she does this thing where she asks "ok but what's it FOR though," like there has to be a payoff down the line for it to count as worth my time, and I never have a good answer, which bothers me way more then it should. The thing is, when I flip the question back on her, like ok what's YOUR five-year plan for, and what's THAT for, she eventually just shrugs, because the chain of "its for the sake of this other thing" has to stop somewhere, and I don't think she's ever actually clocked that about her own life.

  So is she basically right and I just haven't found the "real" payoff for the boat thing yet? Or is there something actually wrong with judging an activity by whether it leads somewhere else? I feel like I'm missing the vocabulary to argue this properly and keep just sounding defensive instead.
