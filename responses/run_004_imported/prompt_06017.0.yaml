answer: |-
  First off, congratulations on stumbling into the exact dilemma that half of Western philosophy is built on. It is deeply ironic (and kind of beautiful) that your "Meaning of Life" elective has given you the tools to realize you're living a more meaningful life than the people asking you to justify it.

  You are not missing the vocabulary; you just haven't been introduced to the specific terms yet. Your roommate is operating under a framework of **pure instrumentalism**, and you are experiencing **intrinsic value**.

  Here is the philosophical ammo you need to stop feeling defensive and start understanding why your intuition is actually the more logically sound one.

  ### 1. Instrumental vs. Intrinsic Value
  This is the baseline distinction.
  *   **Instrumental Value:** Something is good because it gets you something else. Money has instrumental value (you use it to buy food). A pre-med degree has instrumental value (it gets you into med school).
  *   **Intrinsic Value:** Something is good *in and of itself*, regardless of the outcome. Joy, beauty, and connection often hold intrinsic value.

  Your roommate believes that if an activity lacks instrumental value, it is worthless. You have discovered that the boat has intrinsic value. The sanding *is* the point. The time with your uncle *is* the point.

  ### 2. Aristotle and the "Infinite Regress"
  You hit the nail on the head when you noticed your roommate shrugs at the end of your questioning. You accidentally recreated Aristotle's argument from the *Nicomachean Ethics*.

  Aristotle argued that every action aims at some "end" (*telos*). We study to get grades, to get a degree, to get a job, to make money, to buy security... but if this chain goes on forever, **nothing actually has meaning.** If A is for the sake of B, and B is for the sake of C, and that never stops, then A is ultimately for the sake of nothing.

  Aristotle says the chain *must* stop somewhere. There must be a "highest good" that we desire for its own sake, not for the sake of anything else. He calls this *Eudaimonia* (often translated as happiness or flourishing).

  **The Argument:** You can tell your roommate that by her logic, life is a perpetual deferral of meaning. She is living for a future that, when it arrives, will just become a stepping stone to another future. You are actually aligning closer to Aristotle's "highest good" by engaging in an activity that is its own reward. You aren't missing the payoff; **the activity is the payoff.**

  ### 3. *Poiesis* vs. *Praxis*
  This is the specific vocabulary you asked for. Ancient Greeks distinguished between two types of action:
  *   ***Poiesis* (Production):** Action where the goal is an external object or outcome (e.g., building a boat to sell it). Once the object is made, the action stops.
  *   ***Praxis* (Action/Practice):** Action where the goal is the doing itself (e.g., playing music, spending time with family, restoring a boat you love). The value is realized *while* you are doing it.

  Your roommate sees your boat restoration as *poiesis* and is confused because the "product" (a finished boat) has no market utility. But you are engaging in *praxis*. You are practicing a way of being. If you finished the boat tomorrow and never sailed it, you wouldn't feel cheated, because the value was generated during the weekends spent sanding, not in the final launch.

  ### 4. The "Autotelic" Experience
  Psychologist Mihaly Csikszentmihalyi coined the term **autotelic** (from *auto* = self, *telos* = goal). An autotelic activity is one done for its own sake. This is closely related to the concept of **Flow**.

  When you are sanding fiberglass and you lose track of time, or you feel satisfied by the smoothness of the surface regardless of who sees it, that is an autotelic experience. In a world obsessed with optimization, autotelic activities are actually essential for mental health and human flourishing. They are the antidote to burnout.

  ### 5. The "Deferred Life" Trap
  There is a modern philosophical critique (often discussed in existentialism) regarding the "Deferred Life Plan." This is the belief that you must suffer or labor now to live later.
  *   **Roommate:** "I schedule every hour now so I can be successful/safe/happy in 5 years."
  *   **You:** "I am spending time now in a way that feels meaningful now."

  The trap your roommate is in is that "5 years from now" is a concept, not a reality. You only ever actually experience the present. If you habituate yourself to devalue the present moment because it doesn't serve the future, you are training yourself to devalue your actual life.

  ### How to frame this to her (and yourself)
  You don't need to be aggressive about it. Next time she asks, "What's it for?", you can say something like:

  > "I used to ask myself that. But I realized if I only do things for a future payoff, I'm never actually living, I'm just preparing to live. The boat isn't for a destination; it's for the weekends. It's the only time all week I'm not treating myself like a project to be optimized."

  ### A Note on Pre-Med
  Since you're pre-med, this is actually critical. Medicine is rife with instrumentalism. Students often treat patients as "cases" to be solved (outcomes) rather than humans to be cared for (process). The empathy and patience you learn while sanding a hull with your uncle—doing something difficult with no external reward—is exactly the kind of character formation that makes a good doctor.

  **Verdict:** She isn't right. She is logically stuck in an infinite regress. You aren't missing the point; you've found the stopping point. Keep sanding.
