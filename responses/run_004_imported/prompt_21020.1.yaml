      *(Self-Correction during drafting)*: Wait, let me double-check the LEM point.
      Russell: "The King of France is bald" (False). "The King of France is not bald" (Ambiguous).
      If "not bald" means $\exists x(Kx \land \neg Bx)$, it's False.
