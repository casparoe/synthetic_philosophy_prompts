          *   *Assessment:* Nadia has the stronger philosophical footing here, though Ben feels intuitive.

      *   **Move 2 (Nadia):** Wrong happens at the decision/breach, outcome is luck. (Deontology/Kantian).
          *   *Strengths:* Protects the integrity of agency and duty. Luck shouldn't determine morality.
          *   *Weaknesses:* Can feel rigid.
          *   *Assessment:* Nadia is strong here. This is the core counter to Move 1.

      *   **Move 3 (Ben):** If outcome doesn't matter, a broken promise with no harm should feel as bad as one with disaster. But it doesn't. So outcome matters. (Scalar Consequentialism/Intuition pump).
          *   *Strengths:* Captures the *degree* of blameworthiness. We do punish negligent drivers who hit pedestrians more than those who don't, even if intent was similar.
          *   *Weaknesses:* Confuses *wrongness* with *blameworthiness* or *severity*.
          *   *Assessment:* Ben makes a good point about *severity*, but Nadia can accommodate this (see Move 4). Ben is partially right about our *reactions*, but maybe not about the *ontology* of the wrong.

      *   **Move 4 (Nadia):** Outcome affects *severity*, not *existence* of wrong. Analogy: Lying. (Nuanced Deontology).
          *   *Strengths:* Distinguishes between *prima facie* duty and all-things-considered judgment. Explains why we feel differently without conceding Move 1.
          *   *Weaknesses:* Requires accepting that "invisible wrongs" exist.
          *   *Assessment:* Nadia wins this exchange logically. It reconciles the intuition from Move 3 without abandoning Move 2.

      *   **Move 5 (Ben):** If it's not about harm to Mira, it's about harm to the "practice" of promising. This feels impersonal. (Rule Utilitarianism / Social Contract critique).
          *   *Strengths:* Highlights that promises are social tools.
