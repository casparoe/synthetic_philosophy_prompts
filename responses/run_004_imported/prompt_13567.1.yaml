      *   **Conclusion:** A one-line verdict on who was closer to right overall.

  2.  **Deconstruct the Moves:**

      *   **Move 1 (Ben):** No harm = no wrong. (Consequentialism/Utilitarianism).
          *   *Strengths:* Intuitive. Morality often tracks harm.
