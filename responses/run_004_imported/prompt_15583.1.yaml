answer: |-
  # The Bloodless Arithmetic of War: Why Anscombe Was Right About Truman

  In May 1956, G.E.M. Anscombe stood before the Convocation of the University of Oxford and did something nearly unthinkable: she attempted to block the awarding of an honorary degree to Harry S. Truman. To the establishment, it was a diplomatic scandal; to the veterans, an insult. But to the history of moral philosophy, it was a declaration of war.

  *Mr. Truman's Degree* is often treated as a historical curiosity, a footnote to the career of the woman who would later coin the term "consequentialism" in *Modern Moral Philosophy* (1958). But this reading domesticates Anscombe. She was not making a historical claim about the Pacific Theater; she was making a metaphysical claim about the nature of action. Her argument did not hinge on whether the bomb saved more lives than it cost. It hinged on the assertion that intentionally killing the innocent as a means to an end is murder, full stop. It is a prohibition that admits no exceptions, no "greater goods," and no supreme emergencies.

  Seventy years later, the dust of the Pacific has settled, but the philosophical grenade Anscombe threw remains live. The question is not whether Truman was a war criminal by the statutes of 1956, but whether Anscombe's absolutism can survive contact with the reality of human suffering. Can we maintain a moral law that forbids us from slaughtering innocents even if doing so might prevent a greater slaughter? Or does the refusal to get one's hands dirty amount to a dereliction of responsibility for the world as it actually is?

  To answer this, we must steelman the opposition. The case against Anscombe is not merely the crude utilitarianism of "the ends justify the means." It is the argument from responsibility, best articulated by voices like Paul Fussell in *Thank God for the Atom Bomb*. Fussell, who faced the prospect of invading Japan as an infantry officer, argued that the atomic bombs ended a grinding, industrial slaughter. The alternative was Operation Downfall, an invasion projected to cost hundreds of thousands of Allied lives and millions of Japanese lives, combatant and civilian alike, given the Japanese government's preparation for a *Ketsu-Go* (national suicide defense).

  From this vantage point, Anscombe's position looks like moral vanity. It prioritizes the purity of the agent's intention over the actual bodies in the morgue. If you refuse to kill 100,000 civilians to save 1,000,000 people from invasion, famine, and Soviet occupation, are you a saint or a monster? The consequentialist argues that morality is about outcomes. To let a greater evil happen when you have the power to stop it is itself a moral failure. The "Supreme Emergency" defense, later codified by Michael Walzer, suggests that when the threat is existential and the danger imminent, the usual rules of war may be suspended. To bind the hands of the righteous against the fanatic is to hand victory to the fanatic.

  Furthermore, the consequentialist charges Anscombe with a category error regarding "intention." Did Truman *intend* to kill civilians, or did he intend to end the war, with civilian death as a foreseen but regrettable side effect? If the latter, Anscombe's Doctrine of Double Effect might actually excuse him. But Anscombe anticipated this. She argued that the nature of the atomic bomb made the distinction untenable. The bomb was not dropped on a military target with collateral damage; the target *was* the city. The destruction of civilian life and morale was the mechanism of victory. To kill them to pressure the government is to use them as means. That is the definition of murder in her framework.

  So we have the standoff. On one side, the Absolutist: There are things we simply must not do, regardless of the cost. To violate this is to lose our humanity and erode the concept of human rights. On the other, the Consequentialist: We are responsible for the world's outcomes. To cling to rules while the world burns is not virtue; it is cowardice.

  Who is right?

  Anscombe is right.

  This is not a comfortable conclusion, and it requires swallowing a hard pill: it is better to accept the risk of a worse outcome than to legitimize the intentional killing of innocents as a tool of statecraft. The consequentialist defense of Truman fails not because consequences don't matter, but because the consequentialist calculus in war is epistemically bankrupt and morally corrosive.

  First, consider the epistemic problem. The defense of Hiroshima rests on a counterfactual: *If we had not dropped the bomb, X would have happened.* Proponents claim X is "millions dead in an invasion." But this is speculation dressed as data. Historical revisionism suggests Japan was already seeking surrender terms via the Soviets, and the Soviet entry into the war was likely the decisive factor, not the bombs. The casualty estimates for Operation Downfall were inflated by the U.S. Army and Navy to justify budget and operational preferences. When a moral argument relies on uncertain predictions of the future to justify a certain atrocity in the present, it is building a house on sand. Anscombe's rule relies on the certainty of the act (killing innocents is wrong), whereas the consequentialist relies on the uncertainty of the consequence (this killing will stop the war). In moral philosophy, certainty of sin outweighs speculation of virtue.

  Second, and more importantly, is the corrosive nature of the "Supreme Emergency" exception. Once you admit that innocent life can be traded for political ends, you have removed the only brake on total war. The logic used to justify Hiroshima is identical to the logic used to justify the firebombing of Tokyo, the bombing of Dresden, and the acceptance of "collateral damage" in modern drone warfare. The threshold for "emergency" inevitably lowers. If killing 100,000 civilians is permissible to save 500,000, is it permissible to kill 1,000 to save 5,000? Is it permissible to torture a terrorist's child to find a bomb?

  Consequentialism in statecraft inevitably becomes a license for atrocity because the state is the sole arbiter of the "greater good." Anscombe understood that the concept of "human rights" is incoherent without absolutist constraints. If a human being can be justly killed because a government calculates it is useful, they do not have rights; they have privileges contingent on their utility. Anscombe's protest was not just about Truman; it was about preserving the idea that there is a limit to what power can do to a person.

  The consequentialist accuses the absolutist of moral vanity—keeping one's hands clean while others bleed. But this misunderstands the nature of the dirt. The "dirty hands" argument suggests that evil is sometimes necessary. Anscombe argues that evil is never necessary; it is only ever chosen. To say "I had no choice but to murder these children" is a lie. There was always a choice: to fight differently, to risk more of one's own soldiers, to accept a prolonged conflict, or even to face defeat. To claim otherwise is to claim that success is the only moral metric.

  If we accept the consequentialist defense of Truman, we must accept that any massacre can be justified if the arithmetic works out. We hand over the moral law to the generals and the pollsters. If we accept Anscombe, we accept that there are lines we do not cross, even if crossing them promises victory. We accept that morality is not a tool for winning, but a constraint on how we fight.

  Anscombe was right because the alternative is a world where "necessity" is the only law. The atomic bombs killed innocents as a means to an end. That is murder. No amount of retrospective arithmetic can cleanse that act, because the moment we allow the arithmetic to override the prohibition, we have abolished the prohibition entirely. We are left with a world where might makes right, provided the might is calculated efficiently. Anscombe's absolutism is the only firewall against that abyss. It costs us victory, perhaps. It costs us safety. But it preserves the only thing that makes victory or safety worth having: the knowledge that we are not murderers.
