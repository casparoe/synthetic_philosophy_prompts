answer: |-
  You have identified a genuine tension in the text, but it is one that Anscombe intends to be there. Your confusion stems from interpreting her claim that honorary degrees are "not a reward of merit" as a claim that they are *morally neutral*. That is not what she is arguing.

  Anscombe is making a sophisticated distinction between **technical merit** (which she says is irrelevant) and **moral standing** (which she says is paramount).

  Here is the breakdown of the logical structure of her position, the philosophical weight of her distinctions, and how the descriptive and normative moves are actually compatible.

  ### 1. The Logical Structure: A Defeasible Presumption
  Anscombe's argument is not "Honorary degrees are amoral, except for Truman." Rather, it is a structure of **defeasible presumption**.

  *   **Premise 1 (Descriptive/Institutional):** An honorary degree is a conferral of *honor* based on *distinction*, not a certification of *skill* or *academic merit*.
  *   **Premise 2 (General Presumption):** Because "distinction" is usually a vague, accumulated social status, it is generally futile and improper to interrogate the moral biography of the recipient. (Hence, "devoid of interest.")
  *   **Premise 3 (The Limit Condition):** However, honor is not morally inert. To honor someone is to enter into a relationship of alignment with them.
  *   **Premise 4 (The Defeater):** This alignment becomes morally toxic (sycophancy) if the person's distinction rests primarily on a specific, publicly known action that is morally heinous.
  *   **Conclusion:** Therefore, while we generally do not scrutinize recipients, we *must* scrutinize a recipient whose "distinction" is inextricably linked to a notorious act.

  Truman is not an "exception that proves the rule" in the sense of a loophole. He is the **test case** that reveals the true nature of the rule. Anscombe is arguing that if you cannot object in this case, then the concept of "honor" has no moral content at all.

  ### 2. "Merit" vs. "Distinction" vs. "Action"
  You asked if the distinction between "a very distinguished person" and "a person known everywhere for an action" carries philosophical weight. **Yes, it is the crux of her argument.**

  *   **Merit:** This implies a technical competency (e.g., a scientist deserves a degree for discovering a vaccine). Anscombe dismisses this because honorary degrees aren't about this.
  *   **Distinguished Person:** This implies a **state of being**. It is passive and diffuse. A person becomes "distinguished" through age, position, or a lifetime of vague contributions. Anscombe argues we usually accept this status as a brute fact. To dig into whether a "distinguished person" committed a crime in private is "improper" (a violation of privacy or social grace).
  *   **Known for an Action:** This implies **moral agency**. When a person is defined by a specific act (e.g., Truman and the atomic bombs), their "distinction" is no longer a vague status; it is a specific moral claim on the world.

  **The Philosophical Weight:**
  Anscombe is arguing that you cannot separate the *person* from the *act* when the act is the sole source of their public fame. If Truman were honored for being a "world leader," one might argue (as her opponents did) that we honor the office, not the man. But Anscombe counters that he is known *for the action*. To honor him is to honor the action. By shifting the focus from the *person* (who might have private sins) to the *action* (which is public history), she makes moral evaluation not only possible but necessary.

  ### 3. Descriptive vs. Normative Compatibility
  You noted a shift between a descriptive claim (what degrees are) and a normative claim (when to object). These are compatible because the description **generates** the norm.

  *   **The Descriptive Claim:** An honorary degree is an act of **homage**.
  *   **The Normative Implication:** One must not pay homage to evil.

  If an honorary degree were merely a administrative certificate (like a receipt), moral evaluation would indeed be "categorically confused." But because Anscombe defines the degree descriptively as a symbolic act of **honor**, she immediately opens the door to normative evaluation. You cannot describe something as "honor" and then claim it is immune to moral judgment.

  Her argument is: *Because* this is an honor (description), it requires moral justification (norm). Usually, the justification is assumed (status). In Truman's case, the justification is blocked by the nature of the act (mass killing).

  ### 4. The Concept of Sycophancy and Complicity
  The deepest layer of Anscombe's argument—and the one that answers your question about "collective moral responsibility"—lies in the word **sycophancy**.

  Sycophancy is not just "being nice to a bad person." It is **flattering power for the sake of advantage.**

  *   **The Institutional Stake:** Anscombe is arguing that Oxford, by granting the degree, is not just observing Truman's distinction; it is *participating* in it.
  *   **The Moral Risk:** If Oxford honors Truman, Oxford appears to be currying favor with the United States (power) while ignoring the moral cost of Truman's actions (justice).
  *   **The Logic:** If the degree is for "distinction," and the distinction is derived from an act of murder (in Anscombe's view), then the University becomes an accomplice in sanitizing that murder.

  This is why she dismisses the "non-notorious criminal" scenario. If a recipient secretly committed a crime, honoring them doesn't make the University complicit in the *public narrative* of that crime. But Truman's "crime" was the defining feature of his presidency. To honor him is to endorse the narrative that dropping the bombs was a "distinguished" achievement.

  ### Summary
  Anscombe is not contradicting herself. She is setting a trap for her opponents.

  1.  She concedes that usually, we don't question honorary degrees (lowering the stakes).
  2.  She defines the degree as "honor" rather than "merit" (establishing the moral stakes).
  3.  She argues that Truman is unique not because he is a criminal, but because his **public distinction is constituted by the criminal act.**

  Therefore, the logical structure is: **Honorary degrees are morally inert regarding the private lives of recipients, but they are morally active regarding the public actions that constitute the recipient's fame.**

  Her position is that the University cannot claim to be honoring "the man" apart from "the deed" when the deed is the only reason the world knows the man. To do so is not just an error of judgment; it is sycophancy—a moral failure of the institution itself.
