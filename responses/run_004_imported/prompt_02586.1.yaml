answer: |-
  This is an exceptionally sharp reading of the metaethical landscape. You have correctly identified that while Quine and Harman are often lumped together as "naturalist skeptics," their arguments operate on different levels of philosophical infrastructure. The rationalist tendency to conflate them (or to view Yudkowsky's synthesis as a novel rediscovery) often obscures the specific mechanical differences between their critiques.

  Here is an analysis of the distance between the two arguments, the tension in Quine's holism, and an evaluation of which poses the greater threat to moral realism.

  ### 1. The Distance Between Quine and Harman

  While both arguments conclude that moral claims lack the epistemic standing of scientific claims, they attack different links in the chain of justification. They are not merely the same point in different vocabularies; a sophisticated realist could theoretically accept one while resisting the other.

  **Quine: The Argument from Confirmation Structure**
  Quine's argument in "On the Nature of Moral Values" is methodological. It concerns the **geometry of justification**.
  *   **Science:** Observation $\rightarrow$ Theory $\rightarrow$ Prediction $\rightarrow$ Independent Nature. The loop is closed by the "independent course of observable nature."
  *   **Ethics:** Observation (Intuition) $\rightarrow$ Theory (Principle) $\rightarrow$ Judgment. The loop is closed only by checking against *other moral judgments*.
  *   **The Claim:** Because moral observations cannot be checked against a non-moral reality (there is no "moral spectrometer"), ethics is trapped in a coherence theory of truth. Science achieves correspondence; ethics achieves only internal consistency.

  **Harman: The Argument from Explanatory Power**
  Harman's argument in *The Nature of Morality* is ontological. It concerns the **necessity of the posit**.
  *   **Science:** To explain the vapor trail, we *must* posit a proton. The proton plays a causal/explanatory role in the observation.
  *   **Ethics:** To explain the judgment "burning the cat is wrong," we do *not* need to posit the fact *that it is wrong*. We only need to posit the observer's psychology and upbringing.
  *   **The Claim:** Moral facts are explanatorily idle. By the standards of Inference to the Best Explanation (IBE), we should not believe in them.

  **Can one accept one and resist the other?**
  Yes. The arguments are separable.

  *   **Scenario A (Accept Quine, Resist Harman):** A **Naturalist Moral Realist** (e.g., Richard Boyd or Nicholas Sturgeon) might argue that moral properties *are* natural properties (e.g., functional roles in human flourishing). They could agree with Quine that ethics is methodologically distinct and relies heavily on coherence within a web of belief. However, they would reject Harman by arguing that moral facts *do* have explanatory power (e.g., "The fact that the regime was unjust explains the revolution"). They accept the coherence methodology but deny the explanatory idleness.
  *   **Scenario B (Accept Harman, Resist Quine):** A **Non-Naturalist Intuitionist** (e.g., Robert Audi or Russ Shafer-Landau) might reject Quine's dichotomy. They could argue that moral truths *do* correspond to mind-independent reality (rejecting the claim that ethics is merely coherentist). However, they might concede Harman's point that moral facts do not *causally* explain our observations. They would argue that moral knowledge is grasped via a non-causal faculty (intuition), so the lack of causal explanation doesn't negate the correspondence truth.

  Therefore, the arguments are distinct. Quine challenges the **truth-tracking mechanism**; Harman challenges the **ontological commitment**.

  ### 2. Quine's Holism and the Tension

  You have put your finger on a genuine and often overlooked tension in Quine's philosophy. This is the "Quinean Dilemma."

  In "Two Dogmas of Empiricism," Quine argues for confirmation holism: our beliefs face the tribunal of experience not individually, but as a "corporate body." There is no sharp line between analytic and synthetic statements, or between science and other parts of the web. Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system.

  **The Tension:**
  If the web is holistic, why is ethics severed from the "correspondence" that science enjoys? If moral beliefs are part of the web, and the web as a whole is judged by its success in predicting sensory stimulation, then moral beliefs contribute to that success. If a moral belief (e.g., "slavery is inefficient") helps organize society in a way that leads to successful predictions about human behavior, it is earning its keep in the web.

  By relegating ethics to a "coherence theory" while granting science a "correspondence theory," Quine seems to be reinstating a reductionist distinction he ostensibly abolished. He is treating science as the "core" that touches the world and ethics as a "peripheral" game of internal consistency.

  **Quine's Defense:**
  Quine would likely defend this by appealing to his specific definition of **observation sentences**. For Quine, the points of contact with reality are sentences on which all speakers agree given the same sensory stimulation.
  *   "There is a red patch" triggers immediate assent based on retina stimulation.
  *   "That act is wrong" does not. It depends on internalized norms, not direct sensory irritation.
  *   Therefore, while the *web* is holistic, the *anchors* are sensory. Science is tethered to the anchors; ethics is tethered only to other parts of the web.

  **The Critique:**
  This defense is weak. It relies on a verificationist intuition that many of Quine's successors (like Putnam) rejected. If the "web" works as a whole to navigate the world, and moral norms are essential for social coordination (which is an observable phenomenon), then moral norms are indirectly tested by experience. Quine's insistence that ethics lacks correspondence looks less like a consequence of his holism and more like a residual emotivism that he never fully shed.

  ### 3. Which Argument is the Stronger Obstacle?

  For a defender of robust, cognitivist moral realism, **Harman's argument poses the more serious and durable obstacle.**

  Here is why:

  **1. The Shift in Metaethical Burden**
  Quine's argument relies on a mid-20th-century verificationist intuition: that "meaningful" or "truth-apt" discourse must be reducible to or testable against sensory stimulation. Contemporary philosophy has largely moved past strict verificationism. A realist can plausibly argue that "correspondence" does not require direct sensory testing (e.g., mathematical truths or theoretical entities in physics). Quine's challenge can be met by expanding the definition of naturalism or correspondence.

  Harman's argument, however, anticipates the "Benacerraf-Field" challenge that dominates contemporary metaethics. It asks: **"What work does this fact do?"**
  *   If you are a **Non-Naturalist**, Harman forces you to explain how we access facts that play no causal role in our knowing them (the reliability challenge).
  *   If you are a **Naturalist**, Harman forces you to identify the specific natural property and demonstrate its explanatory necessity over a purely psychological explanation.

  **2. Explanatory Idleness is Harder to Cure than Methodological Difference**
  It is relatively easy for a realist to say, "Yes, ethics is methodologically different from physics (Quine), but it still tracks truth." Many successful domains (logic, mathematics, perhaps even parts of economics) are more coherentist than correspondence-based in practice, yet we treat them as realist.

  It is much harder to say, "Yes, the moral fact explains nothing about why I believe it (Harman), but it still exists." This invites the charge of epiphenomenalism. If the moral fact plays no role in the causal history of your belief, your belief is not *about* the fact, even if the fact exists. This severs the link between belief and truth required for knowledge.

  **3. The Resilience of the "Best Explanation" Standard**
  Harman's argument utilizes Inference to the Best Explanation (IBE), which is the standard engine of scientific realism. To use the tools of scientific realism to undermine moral realism is a judo move that is difficult to parry. To resist Harman, the moral realist must either:
  *   Argue that moral facts *do* explain observations (Naturalism), which requires heavy metaphysical lifting to avoid the Naturalistic Fallacy.
  *   Argue that IBE is not the only route to ontological commitment (Non-Naturalism), which requires defending a controversial epistemology of intuition.

  Quine's argument, by contrast, can be sidestepped by simply rejecting the Coherence/Correspondence dichotomy as a false dilemma (e.g., by adopting a pragmatic theory of truth where "success in navigating the world" applies to both ethics and science).

  ### Conclusion

  The rationalist forums are partially right that Yudkowsky was reinventing wheels, but they often miss the nuance of *which* wheels. Yudkowsky's metaethics (specifically in *Metaethics for Humans*) leans heavily toward a naturalistic, functionalist view that attempts to dissolve the "explanatory idleness" problem by defining morality as a computation regarding agent preferences. This is an attempt to solve **Harman**, not Quine.

  Quine and Harman are not pressing the same point. Quine argues ethics lacks the right **structure** to touch the world; Harman argues it lacks the **weight** to be part of the world's explanation.

  Quine's position is internally tense with his holism, suggesting his anti-realism about ethics was driven more by sentiment than by his own systematic philosophy. Harman's argument, however, remains the sharper knife. It forces the moral realist to do the hard metaphysical work of explaining how moral facts fit into a naturalistic ontology without being redundant. A realist can live with Quine's methodological skepticism; they cannot easily live with Harman's ontological eviction notice.
