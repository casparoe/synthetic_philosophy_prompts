answer: |-
  You are absolutely right to feel that something is off about her argument. Your intuition is spot-on: she is pulling a philosophical "cheap trick."

  In philosophy, this is a known problem, and while her move is clever in a debate-club sort of way, it is widely considered a failure of ethical reasoning. You aren't missing a deep insight; she is exploiting a loophole that philosophers have spent a long time closing.

  Here is the breakdown of the concepts, the terminology, and why her specific defense doesn't actually hold water.

  ### 1. The Terminology: Maxims and the Categorical Imperative
  The test you used ("What if everybody did that?") comes from Immanuel Kant, an 18th-century German philosopher. He called it the **Categorical Imperative**.

  To run the test, you have to identify your **Maxim**. A maxim is the subjective principle of your action. It's not just *what* you are doing; it's *why* you are doing it, stated as a rule.
  *   **Your interpretation of her maxim:** "I will keep money that I know I am not entitled to if the error benefits me."
  *   **Her interpretation of her maxim:** "I, [Roommate's Name], will keep money from [Gym Name] regarding the [2021 Promo] if I notice a billing error on [Today's Date]."

  Kant says you must act only on maxims that you can will to become a **Universal Law** (i.e., a law that everyone follows).

  ### 2. The Trick: "Gerrymandering the Maxim"
  What your roommate did is a version of what ethicists call **gerrymandering the maxim** (or sometimes the problem of **maxim specificity**).

  By adding enough specific details (names, dates, locations, specific promo codes), she makes the set of people who can follow her rule equal to exactly one: her. If only one person can do it, then "everyone doing it" is logically identical to "her doing it," which obviously won't bankrupt the gym.

  If this were allowed, **ethics would cease to exist.**
  *   A murderer could say: "My rule is to kill only people named John, on Tuesdays, with a red hammer, who are wearing blue shoes."
  *   A thief could say: "My rule is to steal only from stores on 5th Avenue, between 2:00 and 2:15 PM."

  If we universalize *those* specific rules, the world doesn't end. Very few people fit the description. But obviously, murder and theft are still wrong. The problem is that she is including **morally irrelevant details** in her rule.

  ### 3. Why She Is Wrong: Morally Relevant Features
  The reason you can't slice the situation that finely is that ethical reasoning requires us to strip away accidental details and focus on **morally relevant features**.

  When you ask "What if everybody did this?", you are asking about the *type* of action, not the *token* action.
  *   **Irrelevant details:** The date she signed up, the specific branch of the gym, her name, the color of her gym bag.
  *   **Relevant details:** She received a service, she knows the billed price is incorrect, she is withholding payment owed based on a contract she signed.

  The relevant principle is: **"When I notice a billing error in my favor, I will not correct it."**

  If *that* rule were universalized (if everyone who noticed a billing error kept quiet), the gym (and every other business) would have to assume all billing is suspect. They would raise prices for everyone to cover the losses, or implement draconian audits that make membership annoying for everyone. The system degrades.

  Her argument fails because she is treating **circumstantial luck** (being the one person with this specific error) as a **moral justification**.

  ### 4. The "Publicity" Test
  There is another way to crush this argument, also Kant-adjacent. It's the test of **Publicity**.

  Could your roommate publish her rule in the gym's newsletter? Could she stand at the front desk and tell the manager: *"My policy is that if you undercharge me due to a mistake, I will never tell you, and I expect you to respect that as a valid arrangement between us"*?

  Obviously not. If she states her rule publicly, the gym will immediately correct the error and possibly ban her. Her rule *depends* on secrecy to function. A moral law, by definition, must be something that can coexist with everyone knowing it. If the rule only works if others are ignorant of it, it isn't a moral rule; it's a exploitation strategy.

  ### 5. Why It Feels Like a "Cheap Trick"
  You mentioned it felt like she was "gaming a rule instead of actually being in the clear." You are describing the difference between **compliance** and **integrity**.

  *   **Compliance:** Finding the technical loophole where you can't be punished or logically contradicted.
  *   **Integrity:** Acting on principles that sustain the community you are part of.

  She is technically compliant with a *badly formulated* version of the universalization test, but she lacks integrity. She is effectively saying, "I am a special exception." But ethics is precisely the study of why we *aren't* special exceptions.

  ### Summary for Your Next Pizza Night
  You don't need to bring up Kant or "maxim gerrymandering" unless you want to sound fancy. Here is the plain-English counter-argument:

  > "If you define the rule specifically enough to include only yourself, you aren't testing whether the action is right; you're just defining yourself as the only person who matters. If everyone adopted your *actual principle*—which is 'exploit errors if you can get away with it'—trust would break down, prices would go up, and the system would fail. You're hiding behind the details of the error to ignore the principle of the action."

  She isn't cleverer than you; she just realized that if you make the circle small enough, you're the only one inside it. But ethics is about drawing the circle wide enough to include everyone.

  **Verdict:** You were right then, and you're right now. It's a sophistry, not a defense.
