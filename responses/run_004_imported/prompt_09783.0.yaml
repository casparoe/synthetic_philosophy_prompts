      *   *Strategy 2: The Nature of the "Nearby Cases".* For feeling cold, nearby cases are phenomenally identical. For knowing $2+2=4$, what is the "nearby case"? A case where I believe it but it's false? Impossible (necessary truth). A case where I believe it but don't know it? Maybe (Gettier). But is there a *sorites series* of cognitive states leading from knowledge to ignorance?
