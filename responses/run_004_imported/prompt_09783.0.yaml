      *   *Conclusion 1:* No non-trivial condition is luminous.
      *   *Conclusion 2 (The Leap):* Therefore, KK fails generally. Why? Because if KK held, then knowing $p$ would imply knowing that one knows $p$. If "knowing $p$" were luminous, KK would hold. Since nothing is luminous, KK fails.
