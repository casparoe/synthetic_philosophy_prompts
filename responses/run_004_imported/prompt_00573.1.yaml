      *   **The Problem:** Nozick's "Utilitarianism for Animals, Kantianism for Humans." Nozick raises a challenge: If superior aliens treated us utilitarianly because we are less rational, we'd object. So, shouldn't we treat animals utilitarianly only if we accept superior beings treating us that way? If we reject the latter, must we accept the former (Kantian rights for animals)?
      *   **The Task:** Argue *against* the inference that consistency demands Kantian rights for animals. Provide a principled disanalogy between the Human-Alien case and the Human-Animal case that allows for Utilitarianism for animals without accepting Utilitarianism for humans (by aliens).
      *   **Constraint:** Do not just restate the puzzle. Give a real, philosophical argument.

  2.  **Deconstruct Nozick's Argument:**
