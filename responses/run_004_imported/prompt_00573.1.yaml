      *   *Why this works:* It accepts the intuition that aliens treating us utilitarianly is wrong (because we are normative governors) without forcing us to admit animals are normative governors.

  5.  **Drafting the Argument (incorporating Ecologist perspective):**
      *   Acknowledge the user's background. Use terms like "niche," "threshold," "qualitative vs. quantitative."
      *   Focus on the distinction between **Sentience** (capacity to suffer) and **Personhood** (capacity to conceive of a future/self/norms).
