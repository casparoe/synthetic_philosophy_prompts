          *   Suggest a tweak: The Latin implies "I will never show" (never betray). It's a declaration of loyalty, not just a refusal of data.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say Augustine *endorses* deception. He explicitly condemns the *intent to deceive* if it involves falsehood. But he allows for *truth that misleads*. This is the crux.
      *   *Clarification:* The user asked if "I know where he is" gives away info. Yes, it does. It tells them he hasn't fled the region. Augustine admits this risk ("haply the inquisitor may be diverted"). It's a gamble, not a magic shield.
      *   *Key Insight:* The difference is between confirming a *hypothesis* (He is in the barn) vs. stating a *principle* (I protect friends). The first answers the interrogator's game; the second rejects the game.

  6.  **Final Polish:**
