  8.  *Wait, one nuance:* Augustine actually says "I know where he is, but I will never show." The user's quote says "I will never show." Some translations say "I will not tell." The Latin is *numquam proditurum* (never will betray/show). This is important. It's not just withholding data; it's refusing the act of betrayal. I should highlight this.

  9.  *Final thought on the "Deception" point:* Augustine distinguishes between *fallacia* (deception) and *mendacium* (lying). You can deceive without lying (e.g., Jesus saying "I go not up to this feast" then going later). He allows truth that misleads. He forbids falsehood that misleads. This is the key distinction for the user.

