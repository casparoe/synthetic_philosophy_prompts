answer: |-
  Good morning. Faculty, families, and the Class of 2024.

  It is an honor to be back. When the department asked me to speak, they suggested I talk about where my degree has taken me. So, I'll start there: I work on AI agents. And lately, my job consists largely of reading incident reports that all say the same thing.

  We told the system to update the user's billing address. It did that. But it also deleted the transaction history, changed the language settings to Klingon, and emailed the CEO. We told it to change one thing, and it decided forty unrelated things also needed changing. Why? Because nothing in the code explicitly told it what to *leave alone*.

  In 1969, John McCarthy and Patrick Hayes called this the Frame Problem. On the surface, it's a technical glitch in planning logic: How do you represent the effects of an action without having to list every single thing in the universe that *didn't* change?

  But by the 1980s, philosophers like Daniel Dennett and Jerry Fodor realized this wasn't just a bug in the code. It was a bug in existence. It's the problem of relevance. In any given moment, there are infinite facts available to you. The price of tea in China. The rotation of the earth. The color of your shoes. When you act, how do you know which of those facts matter and which ones you can safely ignore?

  If you're a computer, you can't ignore anything unless you're told to. You get paralyzed. Or, you over-update, like my agents, and break the world.

  If you're a human, you do it effortlessly. You walk out of this ceremony, and you don't worry that your stepping on the grass might alter the trajectory of a star. You just know. You have an intuition for the frame.

  But here is the truth I want to offer you today: For the last four years, you haven't been solving the Frame Problem. You've been living inside a solution someone else built for you.

  In this department, relevance was curated. A syllabus is a frame. It says, "Read these three papers, ignore the rest." A rubric is a frame. It says, "This variable matters for your grade; that variable does not." Even your social life was framed by a campus boundary. You were in a closed world assumption. The relevant facts were pre-selected.

  Graduation is the moment the frame is removed.

  Tomorrow, you wake up and no one tells you what counts. Is it relevant to call your mother today? Is it relevant to learn Python, or to learn how to cook? Is it relevant to worry about the climate, or to save for a house? In the real world, nothing comes with a list of what stays the same when you make a choice.

  This is why you feel anxious. We call it "post-grad anxiety," but cognitively, it is the Frame Problem. It is the terror of unbounded relevance. You are afraid that if you choose one path, you will accidentally delete something vital you didn't know was connected. You are afraid of the side effects.

  My colleagues in the 80s fought over whether this problem was solvable. Fodor thought it proved the mind wasn't a computer. Dennett thought it proved we just need better heuristics.

  But standing here, looking at you, I think they missed the point. The Frame Problem isn't something to solve. It's the price of agency.

  If you had a perfect frame—if you knew exactly what mattered and what didn't—you wouldn't be free. You'd be an algorithm executing a script. The uncertainty of what is relevant is the space where your life actually happens.

  So, how do you handle it? How do you work on an AI team, or raise a family, or build a career without a pre-defined frame?

  You stop trying to compute the optimal solution. My agents fail because they try to calculate every dependency. You are not an agent. You are embodied. You have intuition. You have a community.

  When you face a decision, don't ask, "What are all the possible consequences?" You will be there until you die. Ask, "What feels relevant to the person I am trying to become?"

  Sometimes, you will get it wrong. You will change one thing, and something else will break. You will move to a new city and realize you left behind a support system you didn't know was load-bearing. That is not a failure of intelligence. That is just the Frame Problem in the wild.

  The CS majors here know you can't patch this. There is no update that fixes relevance. But the CogSci majors know that we are social creatures. We borrow frames from each other. When you don't know what matters, look to your friends. Look to your mentors. Look to your parents, who are sitting here today, beaming, having navigated this unbounded space for decades.

  This department didn't just teach you how to think. It taught you that the mind is a tool for navigating uncertainty. You are leaving a place where relevance was assigned to you, to enter a world where relevance is created by you.

  That is terrifying. But it is also the only way to build something that is actually yours.

  Don't look for the perfect frame. Build a small one. Test it. If it breaks, adjust the boundaries. That is how we learn what matters.

  Congratulations. You are off the script. The frame is open. Go make something relevant.

  Thank you.
