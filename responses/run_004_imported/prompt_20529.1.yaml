answer: |-
  **Setting:** *A sterile, white room. OMEGA, a tall, metallic entity, stands motionless. A coin lies on the table, showing HEADS. The CDT agent is sweating, hand hovering over their wallet. The UDT agent stands calmly beside them, arms crossed.*

  **CDT:** Look at it. Just look at the coin. It's heads. The tails world is gone. It never happened. Omega isn't going to go back in time and flip it again. So tell me, why are you reaching for your wallet?

  **UDT:** Because Omega already asked the question.

  **CDT:** Omega asked a hypothetical question to a version of us that doesn't exist! The version of us that existed *before* the flip is gone. *I* am here, now, in the causal reality where the coin is heads. If I give Omega a hundred dollars, I am poorer by a hundred dollars. That is the only causal consequence of this action. Nothing else changes.

  **UDT:** You're treating yourself like a fresh instance every time the universe updates. You think "you" are just this specific moment in spacetime.

  **CDT:** I *am* this specific moment! I can't eat money in a counterfactual branch. I can't spend utility in a world that Omega explicitly told us didn't happen. If I pay, I'm paying a tax on reality.

  **UDT:** You're not paying a tax on reality. You're executing a policy. Think of your decision not as an action, but as the output of a function. $f(\text{coin})$. Omega didn't predict *this* moment; Omega predicted the function.

  **CDT:** Okay, fine. The function said "Pay." But the function was written in a world where Tails was possible. We are in the world where Tails is impossible. Why should the output of a function bind me when the input conditions that justified the function have vanished? I'm not bound by a contract signed in a dream.

  **UDT:** It's not a contract. It's logical consistency. If you change the output now, just because you saw the coin, you aren't outsmarting Omega. You're proving Omega's prediction correct. Omega predicted you would update on the coin flip and refuse to pay. That's why you're in the Heads branch with no reward.

  **CDT:** But I *can't* change the prediction! It's already done! That's the whole point of Omega. The prediction is a fact of the past. My action now has zero causal power over the prediction. It's like trying to change the weather by holding up an umbrella after you're already wet.

  **UDT:** You have causal power over the *prediction*? No. You have logical control over the *truth* of the prediction. If your algorithm outputs "Don't Pay" when it sees Heads, then the statement "The agent pays on Heads" is false. If that statement is false, then the condition for the Tails reward is false. You are determining the payoff of the Tails world by what you do in the Heads world, not because you're sending a signal back in time, but because both worlds run the same source code.

  **CDT:** Source code. Right. But here's the problem with running "source code" in the real world. *Anyone* can claim to be Omega.

  **UDT:** That's a calibration issue, not a decision theory issue.

  **CDT:** It's an exploitation issue! If I adopt your policy—"Pay when a predictor says they would have rewarded you in a counterfactual"—I become a beacon for every con artist with a magic trick and a sob story. "Oh, I'm Omega. I would have given you a million, but you have to give me ten now." If I pay you today, I have to pay everyone tomorrow. What stops the shakedown?

  **UDT:** The math stops the shakedown. UDT isn't "Pay Everyone." It's "Pay when the expected value of the policy exceeds the cost, weighted by the probability the predictor is genuine."

  **CDT:** But *I* don't know that probability right now! I'm standing here, looking at a heads coin. I have no way to verify the Tails claim. I have to take their word for it. If I pay, I'm validating the mechanism of extortion. If I say "Show me the money or I walk," I protect myself from fakes.

  **UDT:** And if you say that, you guarantee you get nothing from the real Omegas. You're sacrificing the genuine signal to avoid the noise. You're blinding yourself to win the argument.

  **CDT:** I'm keeping my money in my pocket! Look, let's be honest. You want to pay because you feel like you *should* have pre-committed. You feel guilty that your past self made a promise your present self has to keep. But that's just loss aversion. You're throwing good money after bad to soothe your ego.

  **UDT:** It's not about guilt. It's about being the kind of entity that wins.

  **CDT:** Winning implies getting something. I walk away with my hundred dollars. You walk away with... what? A warm feeling that you're logically consistent across possible worlds that don't exist?

  **UDT:** I walk away with the knowledge that if the coin had landed tails, I'd be ten thousand dollars richer.

  **CDT:** *But it didn't!*

  **UDT:** (Pauses, looks at Omega) That's the update. You updated on the coin. I didn't.

  **CDT:** How can you not update? It's right there! It's heads!

  **UDT:** I know it's heads. But I'm making my decision based on the view from *before* the flip. From there, the coin is 50/50. From there, paying $100 buys me a 50% chance at $10,000. That's a good bet. I'm just... sticking to the bet.

  **CDT:** You're sticking to a bet that's already been called. The race is run. You're paying for a ticket on a horse that already lost.

  **UDT:** No. I'm paying for the ticket that proves I'm the kind of gambler who gets offered the bet in the first place.

  **CDT:** (Shakes head, steps back from Omega) Omega isn't offering me anything. Omega is taking. And I don't pay takers.

  **UDT:** (Sighs, pulls out a hundred dollars) Then you're not a player. You're just a spectator in your own life.

  **CDT:** And you're a sucker. But hey, at least we're consistent.

  **UDT:** (Hands the money to Omega) Only one of us is going to be rich in the worlds that count.

  **CDT:** There's only one world. The one where I'm walking out with my cash.

  *CDT turns and leaves. UDT watches them go, then turns back to Omega.*

  **UDT:** Same time next week?

  *Omega makes no sound. The coin remains heads.*
