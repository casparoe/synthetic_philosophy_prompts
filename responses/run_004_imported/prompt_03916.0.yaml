  4.  **Refining the Voices:**
      *   *Elena:* Precise, structuralist, looking for the architecture beneath the fiction. Uses words like "topology," "privilege," "instantiation."
      *   *Marcus:* Existential, skeptical, focused on the emotional weight and the biographical Borges. Uses words like "instinct," "despair," "mask."
      *   *Tone:* Respectful but combative. No "I think you're wrong," but "Consider the implication of..."

  5.  **Drafting - Specific Beats (Self-Correction during drafting):**
