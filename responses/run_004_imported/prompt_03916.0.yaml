  6.  **Final Polish:** Check the rhythm of the dialogue. Ensure they interrupt or build on each other's sentences occasionally to show active listening. (e.g., "But that's precisely where...")

  *(Self-Correction Note)*: Make sure the coffee setting isn't just window dressing. Use it to ground the conversation in *time* (cooling coffee, passing minutes) to mirror the theme.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
