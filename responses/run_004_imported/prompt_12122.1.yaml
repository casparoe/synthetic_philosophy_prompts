answer: |-
  **1:03 AM. The kitchen is lit only by the open refrigerator and the standby light on the microwave. MARA stands at the counter, fork hovering over a slice of leftover birthday cake. LEO sits at the small table, nursing a glass of water.**

  **MARA:** If I eat this, I'm breaking a promise.

  **LEO:** You're not breaking a promise. You're just updating a variable. The Mara at 8 AM had a discount rate that valued "fitness" higher than "sugar." The Mara at 1 AM has a discount rate where "sugar" is immediate and "fitness" is abstract. It's not betrayal; it's time-inconsistency.

  **MARA:** That's a very clean way to say I'm weak.

  **LEO:** It's not about weakness. It's about geometry. Ainslie and Laibson showed the curve is hyperbolic. It spikes near the present. You aren't acting against your judgment, Mara. Your judgment *is* the curve. At 8 AM, the curve said "no." At 1 AM, the curve says "yes." Who are you to say the 8 AM curve is the "real" you?

  **MARA:** Because the 8 AM me is the one who has to deal with the hangover. The 1 AM me gets the pleasure; the 8 AM me pays the cost. If I privilege the 1 AM self just because it's holding the fork, I'm letting a tyrant rule.

  **LEO:** But that's the folk psychology trap. You're assuming there's a "You" that exists over and above the 8 AM self and the 1 AM self. There isn't. There's just a sequence of temporal slices. The 1 AM slice is the only one that exists *now*. Why should a ghost from the morning get veto power over the flesh and blood in front of the fridge?

  **MARA:** Because agency requires continuity. If I'm just a series of selves passing the buck, then *nobody* is responsible. The 8 AM self says "I'll diet," knowing the 1 AM self will cave. That's not a plan; that's a lie I tell myself. If hyperbolic discounting is true, then "willpower" is just a word for when the curves happen to align.

  **LEO:** Exactly. It dissolves the mystery. Socrates was right, technically. No one knowingly does the worse thing. You just didn't know that your valuation would flip. Now you know. So stop calling it "weakness of will" and call it "dynamic inconsistency." It removes the guilt.

  **MARA:** It removes the guilt by removing the agent. Look, Leo. I am feeling something right now. I am feeling the pull of the cake, and I am *also* feeling the judgment that I shouldn't eat it. Simultaneously. If the 1 AM self's preference is just "EAT," why is there a voice in my head saying "DON'T"?

  **LEO:** That voice is just the echo of the morning curve. It's a somatic marker. It's anxiety about the future, which is just another input in the calculation. Maybe the anxiety weighs less than the sugar.

  **MARA:** But if it's just an input, why does it feel like a command? Why does it feel like *authority*? If my "better judgment" is just the 8 AM discount function shouting over the 1 AM discount function, then there's no such thing as irrationality. There's just competing impulses. The stronger one wins. That's not a moral failure, that's physics.

  **LEO:** Right. So why insist on the moral failure?

  **MARA:** Because if it's just physics, I can't learn from it. If I'm just a bundle of discount curves, I can't *choose* to be better. I can only set up commitment devices. Lock the cake away. But that admits defeat. It says, "I am not a unified agent capable of obeying my own reason."

  **LEO:** Or it says you're a smart system recognizing a bug in your own code. Look, push back on me here. You say you have a "judgment" right now. Where does it come from? Is it magic? Or is it produced by the same brain that's craving sugar?

  **MARA:** It comes from my reasons.

  **LEO:** And where do reasons get their force?

  **MARA:** From their truth. It is *true* that health is better than a sugar crash.

  **LEO:** Truth doesn't move legs. Value moves legs. And value is discounted by time. You're saying the 8 AM valuation is "truer." Why? Because it's more dispassionate?

  **MARA:** Because it's more *inclusive*. The 8 AM self considers the whole day. The 1 AM self only considers the next twenty minutes. If I'm a single person, my interest is my life, not my next bite.

  **LEO:** But that's begging the question. You're defining the "single person" as the one with the long time horizon. But the phenomenology of the 1 AM moment is that the sugar is *more real* than the headache. Hyperbolic discounting explains why the near future looms larger. It explains the *illusion* that you're acting against yourself. You aren't. You're just acting for the 1 AM self.

  **MARA:** So when I feel regret *while* I'm eating it... that's what? A glitch?

  **LEO:** That's the 8 AM self's model running in the background, predicting pain. It's a conflict between two utility functions, not a conflict between "will" and "desire."

  **MARA:** But that's the sleight of hand. You've taken the "will" and turned it into just another desire. The 8 AM desire. But classical akrasia isn't about desire vs. desire. It's about judgment vs. desire. I judge the diet is best, but I desire the cake. If you turn the judgment into just a long-term desire, you've erased the normative gap. You've explained away the "ought."

  **LEO:** Maybe the "ought" is the thing that needs explaining away. Maybe it's just a story we tell to make the conflict feel noble instead of mechanical.

  **MARA:** If it's mechanical, I'm not an agent. I'm a weather system. "Low pressure of guilt met high pressure of frosting, resulting in precipitation."

  **LEO:** (Laughs) Is that so bad? It stops you from hating yourself.

  **MARA:** It stops me from owning myself. If I eat this cake, and it's just "time inconsistency," then I didn't do it. *It* happened to me. But I'm the one holding the fork.

  **LEO:** Are you? Or is the fork being held by the 1 AM entity who values this slice at 10 utils and the gym at 2 utils? The 8 AM entity valued the gym at 10 and the slice at 2. They're different people. You're mourning the 8 AM person like they died.

  **MARA:** But I'm the one who has to wake up as them.

  *(Silence. The fridge hums. Mara lowers the fork slightly, but doesn't put it down.)*

  **MARA:** Here's the problem with your model, Leo. If the 1 AM self is sovereign, then I should eat the cake without flinching. I should be happy. But I'm not. I'm miserable. Why would a sovereign self be miserable doing exactly what it prefers?

  **LEO:** Because you're anticipating the 8 AM self's reaction. You're simulating their regret.

  **MARA:** Exactly. I am simulating *myself*. I can project myself into the future. That capacity to bind the 1 AM and 8 AM selves together—that's the will. The discounting model says I *can't* bind them, that the preference shift is inevitable. But sometimes I don't eat the cake.

  **LEO:** Sure. Sometimes the curve doesn't spike high enough. Or you have a commitment device.

  **MARA:** No. Sometimes I just... stand here. And I feel the pull, and I feel the judgment, and I let the judgment win. Not because the utility changed, but because I recognized the judgment as *mine*. As authoritative. If hyperbolic discounting is the whole story, that moment of recognition is an illusion.

  **LEO:** Or maybe the recognition is just the long-term curve winning a local battle.

  **MARA:** Then why does it feel like *freedom* when the long-term curve wins, and *slavery* when the short-term one does? If they're just two curves, they should feel the same. Just different outcomes.

  **LEO:** (Pauses, taps the table) Because we're narrativizing creatures. We stitch the slices together into a story. When the story makes sense, it feels like freedom. When it's fragmented, it feels like slavery. But that's post-hoc.

  **MARA:** Maybe. Or maybe the story is the thing that makes us agents in the first place. If you dissolve the puzzle by dissolving the self, you solve the problem by killing the patient.

  **LEO:** And if you keep the self, you have to explain how a judgment that has no motivational force—because if it had force, you wouldn't need willpower—can override a desire that *does* have force. How does the "ought" push the "is"?

  **MARA:** I don't know how it pushes. I just know it pulls.

  *(Mara looks at the cake. She looks at Leo.)*

  **MARA:** If I eat this, will you say I proved your point?

  **LEO:** I'll say you proved the discount function is steep.

  **MARA:** And if I don't?

  **LEO:** I'll say the curve flattened.

  **MARA:** See? You've made yourself unfalsifiable. And you've made me irrelevant.

  **LEO:** I've made you forgivable.

  *(Mara stares at the cake for a long moment. She takes a small bite. She closes her eyes. She looks tired.)*

  **MARA:** It tastes like guilt.

  **LEO:** That's just the somatic marker.

  **MARA:** No. It's the price of being a single person who can't keep her own word. Your model doesn't have a line item for that, Leo.

  **LEO:** (Softly) No. It doesn't.

  *(Mara puts the fork down. She leaves the rest of the cake on the plate. She closes the fridge door. The kitchen goes dark, save for the microwave clock.)*

  **MARA:** I'm going to bed. Don't wait up for the 8 AM self. She's going to be angry.

  **LEO:** Tell her I said the curve was predictable.

  **MARA:** (From the hallway) Tell her I said she's still me.

  *(The sound of footsteps fading. Leo sits alone in the dark. He looks at the closed fridge. He doesn't move.)*
