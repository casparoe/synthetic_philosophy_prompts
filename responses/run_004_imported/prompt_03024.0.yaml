      *   **The Clash:** The user thinks "talking to oneself" = "private language." Wittgenstein means "a language logically inaccessible to others." Vygotsky's data shows children using *public* language privately. This actually *supports* Wittgenstein (language needs a public foundation) rather than falsifying him.

