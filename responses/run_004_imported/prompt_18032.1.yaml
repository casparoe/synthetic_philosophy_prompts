          *   Therefore, the "license for curiosity" is valid only for instrumental curiosity.
          *   *Final Verdict:* It is rational to decline information when the utility function includes epistemic states (e.g., peace of mind) as arguments, or when the causal model includes strategic feedback loops. In the narrow confines of Good's assumptions (single agent, consequence-only utility, costless processing), declining information is definitionally irrational. The slogan fails because it conflates the theorem's narrow conditions with broad human rationality.

  6.  **Refining the Argument (Self-Correction during drafting):**
