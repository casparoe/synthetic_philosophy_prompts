answer: |-
  # The Limits of Instrumental Curiosity: A Reassessment of Good's Theorem

  I. J. Good's 1967 theorem on the value of information is a cornerstone of Bayesian decision theory. It provides a formal vindication of Carnap's Total Evidence Requirement, demonstrating that for a Bayesian agent, the expected utility of acting after observing a cost-free, informative signal is never less than the expected utility of acting without it. This result is frequently distilled into a normative slogan: an ideal reasoner should always seek free information. "Look before you leap" is not merely prudent; it is a requirement of rationality.

  However, this slogan often outstrips the theorem's technical premises. As a PhD student in formal epistemology, you have correctly identified that the leap from "information has non-negative expected instrumental value" to "agents should always satisfy curiosity" is fraught with peril. Strategic interdependence, computational costs, and the intrinsic disvalue of knowledge all appear to license a "right not to know."

  This essay will first state Good's theorem with sufficient formal precision to isolate its assumptions. It will then assess whether the three considerations you raised constitute genuine counterexamples or merely boundary conditions. Finally, I will defend a specific verdict: Good's theorem is mathematically unassailable but normatively narrow. A rational agent is justified in declining free evidence if and only if their utility function is *epistemically state-dependent* or their decision context is *strategically interdependent*. In purely instrumental, single-agent contexts with consequence-based utility, declining information remains strictly irrational.

  ### I. The Theorem and Its Assumptions

  To evaluate the scope of Good's result, we must define the decision problem formally. Let $S$ be a set of mutually exclusive and exhaustive states of the world, and $A$ be a set of available actions. The agent possesses a prior probability distribution $P(s)$ over $S$ and a utility function $U(a, s)$ representing the value of taking action $a$ in state $s$.

  The expected utility of acting immediately, without further information, is:
  $$ EU_{now} = \max_{a \in A} \sum_{s \in S} P(s) U(a, s) $$

  Now, consider an experiment (or signal) $E$ with possible outcomes $e \in \{e_1, \dots, e_k\}$. The likelihood of observing $e$ given state $s$ is $P(e|s)$. Upon observing $e$, the agent updates their belief to the posterior $P(s|e)$ via conditionalization and chooses the action $a_e$ that maximizes expected utility relative to that posterior. The expected utility of observing $E$ before acting is:
  $$ EU_{obs} = \sum_{e \in E} P(e) \left[ \max_{a \in A} \sum_{s \in S} P(s|e) U(a, s) \right] $$

  **Good's Theorem:** $EU_{obs} \geq EU_{now}$.

  The proof relies on the convexity of the maximum function. Intuitively, observing $e$ allows the agent to select an action optimized for the posterior $P(s|e)$. Since the optimal action for the prior is merely one of the available options in the posterior set, the agent can always choose to ignore the information and act as they would have originally. Because they are assumed to act *optimally* on the new information, they will do at least that well, and typically better.

  For this inequality to hold as a normative license for curiosity, several critical assumptions must be explicit:
  1.  **Single-Agent Decision Problem:** The probabilities $P(s)$ represent states of nature, not the strategic moves of other rational agents who might react to the agent's information state.
  2.  **Consequence-Based Utility:** $U$ is a function only of the action and the physical state of the world $(a, s)$. It does not depend on the agent's belief state or the fact of having observed $e$.
  3.  **Costless Observation and Processing:** The signal $e$ is free to acquire, and the computational cost of updating $P(s)$ to $P(s|e)$ and maximizing utility is zero.
  4.  **Logical Omniscience (regarding optimization):** The agent is capable of identifying the $\max$ for every possible outcome $e$.

  ### II. Assessing the Counter-Considerations

  With the assumptions laid bare, we can assess the three considerations you raised.

  **1. Strategic Settings**
  In game-theoretic contexts, an agent's information can alter the behavior of opponents. If an opponent knows that I am informed, they may adjust their strategy to my detriment (e.g., in bargaining, knowing my reservation price weakens my position).
  *Assessment:* This consideration falls **outside the scope** of Good's theorem rather than refuting it. Good's theorem is a result of *decision theory* (one agent vs. nature), not *game theory*. In a strategic setting, the "state of the world" includes the opponent's move. If the opponent's move is causally dependent on my information state, the independence assumption required for the standard Bayesian update is violated. The probability $P(s)$ is no longer fixed; it becomes a function of my choice to observe.
  *Verdict:* This does not restrict the theorem's internal logic but restricts its *application*. It confirms that the "license for curiosity" does not extend to strategic environments where information is a strategic variable.

  **2. Computational Costs**
  You note that processing evidence is not costless. Good himself acknowledged this distinction between the *gross* value of information (the theorem) and the *net* value (subtracting costs).
  *Assessment:* This is easily **absorbed** into the framework. If we introduce a cost $c(e)$ for processing signal $e$, the inequality becomes $EU_{obs} - c(e) \geq EU_{now}$. If $c(e)$ is sufficiently high, the agent should decline the information.
  *Verdict:* This does not challenge the theorem but clarifies the premise of "cost-free." If processing costs exist, the information is not truly cost-free. The slogan "free information is always good" is false only because the information wasn't actually free.

  **3. Intrinsic Disvalue of Knowledge ("Right Not to Know")**
  This is the most philosophically potent challenge. In cases like terminal diagnoses or spoilers, the disvalue attaches to the *knowing* itself, not the physical consequences. A patient may prefer to live their remaining days in hopeful ignorance rather than certain despair, even if the medical action (palliative care) remains the same.
  *Assessment:* This violates the **Consequence-Based Utility** assumption. Good's theorem assumes $U(a, s)$. However, in "right not to know" cases, utility is a function of the agent's epistemic state: $U(a, s, \text{belief})$. If the utility of state $s$ (e.g., having cancer) is lower when *known* than when *unknown*, the term $U(a, s)$ in the $EU_{obs}$ calculation is not the same as in the $EU_{now}$ calculation.
  *Verdict:* This is a genuine restriction on the theorem's normative force. If an agent's utility function values "peace of mind" or "hope" as goods, then information which destroys those goods carries a negative utility component not captured by the standard model.

  ### III. A Verdict on Rational Ignorance

  The tension between Good's theorem and the intuition that one might rationally decline information stems from a category error regarding the domain of "rationality." Good's theorem is a theorem of *instrumental rationality*. It proves that information is instrumentally valuable for maximizing expected utility defined over physical consequences. It is not a theorem of *comprehensive rationality*, which accounts for the intrinsic value of mental states or strategic complexity.

  Therefore, I defend the following verdict: **A rational agent is justified in preferring not to know something if and only if their utility function is epistemically state-dependent or their decision problem is strategically interdependent.**

  To defend this, we must distinguish between two types of rationality:

  1.  **Instrumental Rationality (Good's Domain):** Here, the goal is to match actions to world-states to maximize some external payoff. Beliefs are merely tools. In this domain, declining free, costless information is definitionally irrational. If you refuse to look at a map while driving to a destination you want to reach, and looking costs nothing and causes no pain, you are failing to maximize your chances of success. Good's theorem holds absolutely here.
  2.  **Comprehensive Rationality (Human Domain):** Here, the goal is to maximize well-being, which includes epistemic states. "Knowing" is not just a tool; it is a constituent of the outcome.

  The "Right Not to Know" cases (terminal diagnosis, spoilers) are not cases where information lacks *instrumental* value. Often, knowing a diagnosis allows for better estate planning or pain management (instrumental gain). The rationality of declining the information arises because the agent's utility function assigns a heavy negative weight to the *state of knowing*.
  If we formalize this, let $K$ be the proposition "Agent knows $s$." If $U(a, s, K)$ is significantly lower than $U(a, s, \neg K)$, then $EU_{obs}$ drops. Good's theorem does not forbid this; it simply assumes $U$ does not depend on $K$. Once we admit that $K$ is a relevant consequence, the "license for curiosity" evaporates.

  Similarly, in strategic settings, the "state of the world" includes the opponent's beliefs about me. If my knowing $s$ causes the opponent to believe I know $s$, and this alters their action to my detriment, then the "state" in the $EU_{obs}$ branch is effectively different (or less favorable) than in the $EU_{now}$ branch.

  ### Conclusion

  Good's theorem is not wrong, but its popular interpretation as a general mandate for curiosity is overextended. The theorem proves that information is a free option on future actions. Like any option, it has non-negative value *provided the option itself doesn't change the underlying asset price.*

  In strategic settings, exercising the option changes the asset price (opponent behavior). In "right not to know" cases, exercising the option changes the utility of the asset (peace of mind). In computational cost cases, the option has an exercise price.

  Thus, the ideal reasoner should only "always look before leaping" in a world of solitary agents, costless cognition, and consequence-based utility. In the actual world, a rational agent is justified in declining evidence whenever the *state of knowing* is itself a disvalued consequence or when the *act of knowing* triggers adverse strategic reactions. To claim otherwise is to confuse the mathematics of instrumental optimization with the broader ethics of human well-being. Good vindicates the Total Evidence Requirement for Bayesian updating, but he does not vindicate the tyranny of total knowledge.
