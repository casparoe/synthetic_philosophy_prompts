answer: |-
  **Title:** The Map in the Machine: Causal Intervention and the Reality of Neural Representations

  **Introduction**
  For the past two weeks, we have wrestled with the classical conditions for mental representation. Dretske taught us that representation requires a teleological function to indicate, while Ramsey's "Job Description Challenge" demanded that putative representations must do more than correlate with the world; they must be used by the system as maps are used by navigators. This week, the seminar pivoted to the neural network, asking whether these criteria dissolve in the face of high-dimensional vector geometry. The deflationist argues that "representation" is merely a convenient fiction we impose on activation patterns that happen to correlate with inputs. The realist argues that these patterns constitute genuine internal models.

  This essay argues that the deflationist position is untenable in the specific case of Othello-GPT, provided we accept a functionalist criterion for representation. While mere decodability (Kenneth Li's initial nonlinear probes) invites skepticism, the combination of linear abstraction and, crucially, *causal intervention* (Neel Nanda's follow-up) satisfies Ramsey's Job Description Challenge. Realism is earned not when we can *read* the state of the world from the system, but when manipulating that state within the system systematically alters the system's behavior in accordance with the manipulation.

  **The Deflationist Wedge: Decodability vs. Reality**
  The deflationist's strongest weapon is the "control task" objection prevalent in the probing literature. In high-dimensional activation spaces, linear probes can often decode arbitrary or even random labels assigned to inputs. If a probe can find a "representation" of a random number generator in the network's weights, then finding a "representation" of the Othello board seems trivial—it is merely a mathematical artifact of expressivity, not an ontological commitment.

  Under this view, the network does not "believe" there is a piece on square E4; it simply possesses a complex disposition to output moves that correspond to E4 being occupied. To call the activation vector a "representation" is to commit the homunculus fallacy, assuming a little man inside the network reads the vector. For the deflationist, the vector is just a causal intermediary, a wire carrying signal from input to output. It plays no distinct role *as* a representation. If we apply Ramsey's challenge here, the deflationist claims the network fails: the board state is not used *as* a map; it is merely a causal stepping stone indistinguishable from any other latent feature.

  **The Othello-GPT Evidence**
  The Othello-GPT case study dismantles this deflationism in two stages. First, Kenneth Li et al. demonstrated that a nonlinear probe could reconstruct the board state from the model's activations. This alone is weak evidence; a nonlinear probe is powerful enough to find almost anything, lending credence to the deflationist's "expressivity" objection.

  However, Neel Nanda's refinement is philosophically decisive. Nanda showed that a *linear* probe suffices, but only if the board is encoded relative to the player ('mine'/'yours') rather than absolutely ('black'/'white'). This indicates abstraction: the network is not merely memorizing pixel patterns or move sequences; it is computing a perspective-dependent model of the game.

  But the knockout blow is the causal intervention. Nanda did not just observe the activations; he edited them. By adding a vector corresponding to "piece at E4" to the residual stream during inference, he forced the model to behave *as if* there were a piece at E4, even when the input history dictated otherwise. The model's predicted legal moves shifted precisely to accommodate the new board state. It refused to make moves that would be illegal given the new configuration and prioritized moves that capitalized on it.

  **Meeting the Job Description Challenge**
  This intervention directly addresses Ramsey's Job Description Challenge. Ramsey argued that to count as a representation, a state must be used by downstream processes to guide action in a way that respects the structure of what is represented.

  In Othello-GPT, the "downstream process" is the move-selection head. The "structure" is the rules of Othello (legal moves depend on board configuration). When the activation vector is intervened upon, the move-selection head changes its output *consistent with the rules of Othello applied to the new vector*. This proves the vector is not merely an epiphenomenal byproduct of computation. It is a bottleneck. The downstream mechanisms are "reading" the vector to determine legality and strategy.

  The deflationist might retort that this is still just a "causal intermediary." They might argue that we are simply re-describing a causal lever as a "representation." However, this ignores the *isomorphism* required for the intervention to work. If the activation were just a generic causal lever, intervening on it might cause random noise or a generic shift in confidence. Instead, intervening on the "board state" direction causes specific, rule-consistent changes in behavior. The internal structure of the activation space mirrors the external structure of the game board, and the model's policy function relies on that mirroring to function. This satisfies the functional role of a map: it is a structure that the system consults to navigate a problem space.

  **The Verdict: Realism via Causal Isolation**
  So, does this settle the debate? It settles it for functional systems, provided we refine our criterion for realism. The deflationist is correct that decodability alone is insufficient; finding a pattern does not make it a representation. But they are wrong to claim that causal efficacy is compatible with deflationism when that efficacy relies on structural isomorphism.

  Therefore, I defend the following verdict: **Realism about neural representations is earned when causal intervention on a putative representational vehicle produces downstream behavioral changes that respect the structural constraints of the represented content.**

  Mere correlation (Li's initial probe) is the realm of the deflationist; it is a convenient fiction. But causal isolation (Nanda's intervention) is the realm of the realist. When we can break the "map" inside the machine and watch the "navigator" get lost in predictable ways, we have demonstrated that the map is doing genuine work.

  **Conclusion**
  This does not necessarily vindicate Dretskean teleosemantics; Othello-GPT has no evolutionary history or biological goals, so whether it "misrepresents" in a normative sense remains open. However, regarding the ontological status of the board state within the network, the deflationist line cannot hold. The network does not just act *as if* it has a model; it possesses an internal variable that functions as a model, isolated from the input and causally efficacious over the output. In the context of the Job Description Challenge, the network passes. The representation is not a fiction we impose; it is a mechanism we discovered.
