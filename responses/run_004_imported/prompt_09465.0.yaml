answer: |-
  **MEMORANDUM**

  **TO:** Joint Instrumentation Committee
  **FROM:** [Your Name], Emeritus Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Bargaining Protocol for Cryo-EM Allocation

  **Purpose**

  At the Chair's request, I am circulating this recommendation regarding the dispute over the allocation of cryo-EM suite hours following the recent detector upgrade. Our committee is currently divided between maintaining the Nash Bargaining Solution (NBS), as currently codified in our bylaws, and adopting the Kalai–Smorodinsky Solution (KSS).

  After reviewing the subcommittee's data and the theoretical underpinnings of both approaches, **I recommend that the committee adopt the Kalai–Smorodinsky Solution (KSS) as our standing policy.** This approach, which corresponds to the "minimax relative concession" principle in moral philosophy, better aligns with our intuitive understanding of fairness in this specific context. Based on the subcommittee's current utility estimates, applying KSS would result in an allocation split of approximately **60% Structural Biology (SB) / 40% Materials Science (MS)** for the coming cycle. I recommend this policy remain in force for **three years**, after which it should be reviewed alongside the next major capital lifecycle assessment.

  **The Core Dispute: Gains vs. Concessions**

  To decide between these rules, we must understand what each actually measures. Both methods start from the same two data points:
  1.  **The Disagreement Point:** What happens if we fail to agree? (SB uses the off-site national lab; MS uses the slower neighboring instrument.)
  2.  **The Feasible Set:** What is physically possible? (1,600 hours total, with varying scientific value per hour.)

  **The Nash Solution (Current Policy)**
  The Nash rule asks: *How do we maximize the product of our gains above the disagreement point?*
  In plain English, it seeks to maximize the total "surplus value" created by cooperation and splits that surplus equally. It is the standard in economics because it guarantees efficiency. However, it has a known blind spot: it does not guarantee *monotonicity*. This means that if the instrument improves in a way that benefits one department's potential output, the Nash calculation can paradoxically reduce that department's share of hours to "balance" the utility gains. This is precisely what occurred in the subcommittee's simulation: SB's share dropped below the historical 55% despite the upgrade being tailored to their needs.

  **The Kalai–Smorodinsky Solution (Proposed Policy)**
  The Kalai–Smorodinsky rule asks: *How do we equalize our relative concessions from our ideal outcomes?*
  In plain English, it identifies the "Ideal Point" for each department (the maximum hours they could theoretically use if the other party conceded everything). It then scales both requests down proportionally until they fit within the 1,600-hour limit. If SB must give up 20% of their ideal to reach agreement, MS must also give up 20% of theirs. This ensures that the burden of compromise is shared proportionally, rather than the *gain* being shared equally.

  **Rationale for Recommendation**

  I recommend KSS for two reasons. First, it satisfies the principle of resource monotonicity: if the pie grows for you, your slice should not shrink. The Nash failure here undermines the incentive structure for future donations; if departments fear that improving the instrument will penalize their allocation, they will hesitate to justify future upgrades.

  Second, KSS aligns with the contractarian ethical framework of "minimax relative concession." We are not merely dividing a resource; we are agreeing to restrain our claims for the sake of cooperation. Fairness, in this view, is not about equal profit, but about equal sacrifice relative to one's potential. Given that the upgrade has significantly raised SB's "ideal" potential while leaving MS's ceiling largely unchanged, KSS correctly assigns SB a larger share of the hours to equalize the relative sacrifice.

  **The Case for Retaining Nash (and Why We Should Override It)**

  I want to engage seriously with the arguments for retaining the Nash solution, as articulated by my colleagues on the committee. Their position rests on two pillars: **stability** and **verifiability**.

  The strongest argument for Nash is that it relies on the *feasible* set, which is objective, whereas KSS relies on the *ideal* point, which is hypothetical. As my colleagues have rightly noted, pegging allocation to an "ideal point" invites strategic inflation. If Structural Biology can convincingly argue they could utilize 5,000 hours a year (an impossible ideal), the KSS formula grants them a larger share of the actual 1,600 hours, even if that claim is exaggerated. Nash avoids this by focusing only on what is actually achievable. Furthermore, Nash is already in our bylaws. Changing the rule introduces administrative friction and sets a precedent that might encourage renegotiation every time a minor component is swapped.

  These are not trivial concerns. A bargaining rule must be robust against gaming. However, the risk of inflated claims can be mitigated without abandoning KSS. We can define the "Ideal Point" not as hypothetical infinite demand, but as the *maximum verified historical demand* plus a standard growth factor, audited by the committee. This retains the fairness of KSS while grounding the "ideal" in empirical data. Regarding stability: while changing bylaws is burdensome, adhering to a rule that produces counterintuitive results (penalizing an upgrade) erodes trust more deeply than administrative paperwork. A rule that feels unjust will not hold, regardless of what the bylaws say.

  **Implementation and Review**

  Adopting KSS requires us to recalculate the allocation for the coming year. Based on the subcommittee's data regarding the post-upgrade capability frontier:
  *   **Proposed Split:** 60% SB / 40% MS (approx. 960 hours / 640 hours).
  *   **Mechanism:** The "Ideal Point" for each department will be capped at 1,500 hours (total available minus minimum maintenance downtime) to prevent inflation, ensuring the ratio reflects genuine capacity differences rather than claim exaggeration.
  *   **Review Period:** This policy shall stand for three years. This aligns with the typical lifecycle of detector technology. At that time, we will assess whether the "Ideal Point" caps require adjustment or if the balance of power between the departments has shifted sufficiently to warrant a return to Nash or a new framework entirely.

  **Conclusion**

  We are physicists; we know that the right model depends on the boundary conditions. Nash is the correct model for dividing fixed profits in a stable market. But we are managing a shared scientific instrument where capacity and value are dynamic. In this environment, the Kalai–Smorodinsky solution offers a more robust definition of fairness—one that rewards investment and ensures that the burden of compromise is borne equally, rather than the gains.

  I move that we adopt this recommendation for the upcoming allocation cycle.
