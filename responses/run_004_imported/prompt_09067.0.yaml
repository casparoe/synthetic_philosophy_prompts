      *   *The Problem:* By the Riemann Rearrangement Theorem, if a series is conditionally convergent, its terms can be rearranged to sum to *any* real number, or diverge. Since the sample space is countably infinite, there is no natural ordering of outcomes privileged by the probability space itself. Therefore, the expected value is undefined (or rather, arbitrary).
      *   *Contrast with St. Petersburg:* St. Petersburg diverges to $+\infty$. It's "too big." Pasadena is "too messy." It doesn't even have a direction.

