answer: |-
  This is a sharp intuition, and you are right to press your EA friends on it. The standard "St. Petersburg" objection (divergence to infinity) is often dismissed by longtermists via truncation, discounting, or bounded utility functions. But the Pasadena paradox (Nover & Hájek 2004) cuts deeper because it attacks the *coherence* of the expectation operator itself, not just its magnitude.

  Since you are working in formal epistemology, I will skip the basic probability recap and jump straight to the measure-theoretic and decision-theoretic implications for longtermist reasoning.

  ### 1. The Measure-Theoretic Core: Absolute vs. Conditional Convergence

  The fundamental lesson of Pasadena is that **Expectation is not well-defined for conditionally convergent series.**

  In standard Kolmogorov probability theory, the expected value $E[X]$ is defined via the Lebesgue integral. For $E[X]$ to exist and be unique (independent of the ordering of the sample space), $X$ must be **integrable**, which requires absolute convergence:
  $$ \int |X| \, dP < \infty \quad \text{(or equivalently } \sum |p_n x_n| < \infty \text{)} $$
  If $\sum p_n x_n$ converges but $\sum |p_n x_n|$ diverges, the Lebesgue integral is undefined. The Riemann sum (which implies an ordering) yields a value, but that value is an artifact of the enumeration, not a property of the random variable.

  **Implication for Longtermism:**
  Longtermist models typically treat the future as a countably infinite sequence of outcomes (generations, time slices, etc.). When they calculate EV, they implicitly assume absolute convergence or simply sum the series in a "natural" temporal order. Pasadena shows that if the product of probability and utility ($p_n u_n$) decays slowly enough (like $1/n$) and **oscillates in sign**, the EV is mathematically undefined.

  ### 2. The "Sign" Requirement and Axiological Uncertainty

  You might object: *"Longtermists usually assume the future is net positive. If all $u_n > 0$, we can't have conditional convergence."*
  This is correct. A series of positive terms cannot be conditionally convergent; it either converges absolutely or diverges to $+\infty$.

  However, Pasadena becomes devastating when combined with **Axiological Uncertainty**.
  Longtermism is not just about *how many* people exist, but *how good* their lives are. If there is non-zero credence that certain future trajectories are net negative (e.g., suffering risks, totalitarian lock-ins, or simply the anti-natalist possibility that existence is a harm), the utility terms $u_n$ can fluctuate in sign across the possibility space.

  If a longtermist model assigns probabilities to an infinite horizon of futures where the "net value density" oscillates (e.g., centuries of flourishing followed by centuries of suffering, with probabilities decaying over time), they risk constructing a Pasadena gamble.
  *   **The Trap:** If you claim $EV = \ln(2)$ based on a temporal ordering, I can rearrange the outcome space (e.g., grouping by "types of civilizations" rather than "time periods") to make $EV = 1,000,000$ or $EV = -\infty$.
  *   **The Result:** The recommendation to prioritize existential risk reduction becomes sensitive to arbitrary framing of the outcome space. This violates **Description Invariance**, a core rationality constraint.

  ### 3. The Comparative Problem: Relative Expectations

  Even if a longtermist insists that all utilities are positive (avoiding direct Pasadena behavior), they face a generalized version of the problem when **comparing** acts.
  Decision theory requires comparing $EV(A)$ and $EV(B)$. If both diverge to infinity (common in infinite future models), standard EV maximization is silent.
  The natural fix is **Relative Expectation**: compare $\sum p_n (u_{A,n} - u_{B,n})$.

  **Here is where Pasadena hides in plain sight.**
  Even if $u_{A,n}$ and $u_{B,n}$ are always positive, the *difference* series $d_n = p_n (u_{A,n} - u_{B,n})$ can easily be conditionally convergent.
  *   Suppose Act A creates slightly more value in odd centuries, and Act B creates slightly more in even centuries.
  *   Suppose the probability of affecting century $n$ decays as $1/n$.
  *   The series of *differences* becomes an alternating harmonic series.

  **Implication:** You can have two interventions, both of which seem "infinitely good," but the *difference* in their value is undefined. One moment you prove A > B by summing odd terms first; the next you prove B > A by summing even terms first. This renders the core longtermist claim ("Intervention A has higher expected value than B") mathematically incoherent without further constraints.

  ### 4. Violation of Dominance Principles

  The most damning decision-theoretic implication of Pasadena is its conflict with **Dominance**.
  Consider the "Altadena" game (a variant of Pasadena where you add $1 to every payoff).
  *   Pasadena Payoff: $X_n$
  *   Altadena Payoff: $Y_n = X_n + 1$
  *   Clearly, $Y_n > X_n$ for all $n$. Altadena strictly dominates Pasadena.

  However, because the expectation is order-dependent:
  *   $E[X]$ can be rearranged to sum to $K$.
  *   $E[Y]$ involves adding $\sum 1 \cdot p_n$, which diverges.
  *   Depending on how you handle the arithmetic of infinities and conditionally convergent series, you can construct scenarios where the dominance principle fails or where $E[X] > E[Y]$ under specific rearrangements.

  **Implication for Longtermism:**
  Longtermist arguments often rely on dominance-style reasoning (e.g., "Reducing existential risk dominates doing nothing because it preserves all future value"). If the underlying value structure allows for Pasadena-like behavior (due to infinite horizons + axiological uncertainty), **Weak Dominance** is no longer a safe axiom. You could be rationally required to choose an option that is strictly worse in every possible state of the world, simply because of how the EV sum was ordered.

  ### 5. What Replaces Expected Value?

  If Pasadena shows that EV is broken for infinite, sign-fluctuating spaces, what should a formal epistemologist propose to the longtermists?

  **A. Bounded Utility (The Standard Fix)**
  The most robust solution is to deny the premises that allow Pasadena. If utility is bounded ($|u| < M$), and probabilities sum to 1, then $\sum |p_n u_n| < M \sum p_n = M$. Absolute convergence is guaranteed.
  *   *Cost:* This cripples "Pascal's Mugging" style arguments, which longtermists often want to keep (tiny prob $\times$ huge value). You cannot have it both ways. You cannot ban St. Petersburg/Pasadena while keeping the math that allows tiny-prob-high-stakes reasoning to work.

  **B. Stochastic Dominance**
  Move from maximizing expectation to maximizing via **Stochastic Dominance**.
  *   Act A stochastically dominates Act B if $P(A > x) \ge P(B > x)$ for all $x$, with strict inequality for some $x$.
  *   This avoids summing utilities entirely. It relies only on ordinal preferences over outcomes and probability comparisons.
  *   *Limitation:* It provides a partial ordering. Many longtermist interventions will be incomparable under stochastic dominance, reducing the "action-guiding" force of the theory.

  **C. Finite Truncation / Discounting**
  Argue that the "infinite future" is a modeling error. We should only calculate EV over a finite horizon $T$, or apply a pure time discount rate $\delta$.
  *   *Limitation:* This is axiologically controversial (why discount future lives?) and arguably arbitrary (why $T=10,000$ years?). But it restores absolute convergence.

  **D. Relative Expectation with Absolute Convergence Constraints**
  Adopt a decision rule that only compares acts if the difference series converges *absolutely*. If $\sum |p_n (u_{A,n} - u_{B,n})| = \infty$, the agents are rationally required to suspend judgment (or use a tie-breaking rule not based on EV).
  *   *Implication:* This would force longtermists to admit that many comparisons between existential risk interventions are currently **rationally undecidable**.

  ### Summary for Your Seminar/Pub Discussions

  The Pasadena Paradox teaches us that **Expected Value is not a robust property of gambles with infinite outcome spaces unless absolute convergence is guaranteed.**

  For Longtermism, this implies:
  1.  **Fragility:** EV calculations are sensitive to the *partitioning* of the outcome space (violating extensionality).
  2.  **Axiological Risk:** It specifically targets models that allow for net-negative futures (s-risks) over infinite horizons.
  3.  **Comparative Failure:** Even with positive values, comparing two infinite streams can yield Pasadena-like undefined differences.
  4.  **The Trade-off:** You cannot consistently hold that (a) EV maximization is the sole decision rule, (b) outcome spaces can be infinite/uncertain, and (c) utilities can be unbounded or sign-uncertain. Longtermism usually wants all three. Pasadena proves you must drop one.

  If your friends wave it off as a "math curiosity," ask them to write down the measure space for their longtermist model and prove that the utility function is Lebesgue integrable. If they can't (and they likely can't, given the speculative nature of the values), they are making decisions based on undefined quantities.
