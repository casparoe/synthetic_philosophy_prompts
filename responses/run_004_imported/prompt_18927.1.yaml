  8.  **Final Polish:** Check historical dates and accuracy. (Hilbert died 1943. Gödel 1931. Cohen 1963. Zermelo 1908. Fraenkel 1922. Von Neumann 1925. So ZFC was taking shape during Hilbert's life, but not fully settled as *the* standard). *Self-Correction:* Make sure to note that ZFC wasn't the monolithic standard in Hilbert's day that it became later. He might have viewed the independence as a failure of *that specific system*, not math itself.

