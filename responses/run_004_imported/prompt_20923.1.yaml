answer: |-
  **Setting:** *Outside the saloon in Town. The dust of the desert still coats their clothes. CADE is leaning against a hitching post, watching the driver's wagon disappear down the street. FIONA stands next to him, hand extended expectantly.*

  **CADE:** *(Patting his pocket)* Don't look at me like that. The transaction is over.

  **FIONA:** The ride is over. The agreement isn't. You told her you'd pay.

  **CADE:** I told her a lot of things. I told her I was thirsty. I told her I wasn't a bandit. None of those statements change the fact that my money is mine, and her service is rendered. Look, Fiona, I know how this looks. But look at the causal structure. The past is fixed. She already drove. Whether I hand you a hundred bucks or burn it, it has zero causal impact on whether I'm standing here. The arrow of time only points one way.

  **FIONA:** That's the Causal Decision Theory mantra, isn't it? *Only the direct causal consequences matter.* But you're ignoring the logical link. She didn't pick you up because of what you *did* in town. She picked you up because of what you *would* do. And "what you would do" is determined by the same reasoning process you're using right now to keep your wallet shut.

  **CADE:** No, it's determined by my disposition *back then*. I can't change that now. I'm stuck with the fact that I'm the kind of guy who looks like he'll pay. But actually paying? That's a new event. Why should I be held hostage by a version of myself that existed thirty miles ago?

  **FIONA:** Because that version of you *is* you. It's the same algorithm. If you decide "I don't pay" now, you confirm that the algorithm running in your head is "Don't pay." If that's the algorithm, she reads it, and you're dead in the sand. You're alive *only* because she made a prediction about this exact moment. By refusing to pay, you're retroactively making her prediction a lucky guess instead of a accurate reading, but you're also ensuring you won't be alive for the next prediction.

  **CADE:** That's the "Why Ain't Cha Rich" argument, and it's a category error. Look, imagine a demon who hates Causal Decision Theorists. He scans the world. If he finds someone using CDT, he blasts them with lightning. If he finds someone using your fancy Updateless theory, he gives them gold. By your logic, CDT is "irrational" because it gets you zapped. But that's absurd. The world is just unfair. The demon is punishing me for correct reasoning.

  **FIONA:** This isn't a demon punishing you for *using* CDT. It's a predictor punishing you for *outputting* "Don't Pay."

  **CADE:** It's the same thing! The predictor is effectively a demon who punishes agents who recognize that the past is fixed. She's saying, "I will reward you only if you agree to throw money away later for no causal gain." That's extortion. If I pay you, I'm validating a system where I get blackmailed by counterfactuals. I'd rather die in the desert than live in a world where I pay ransoms to ghosts.

  **FIONA:** It's not a ransom, Cade. It's a promise. And it's not about ghosts; it's about trust. You say the world is unfair, but this is the standard structure of almost every cooperative venture in human history. You borrow money expecting to pay it back. The bank gives it to you because they predict you'll pay. Once you have the cash, do you have a causal incentive to pay? No. The money is in your hand. The loan is funded. If everyone followed your logic, the credit market collapses. No one gets loans. Everyone dies in the desert.

  **CADE:** I'm not "everyone." I'm me, in this specific instance. And this isn't a bank. This is a perfect lie detector. In the real world, I can cultivate a reputation. I can hire an enforcer. I can feel guilt. But here? The mechanism is transparent. She knows my source code. If my source code says "Pay," she drives. If it says "Don't," she leaves. I can't rewrite my source code *now* just because it's inconvenient. I have to execute it. And my code says: *Do not take actions with negative expected utility given the current state.* Paying has negative utility. The state is "Safe in Town."

  **FIONA:** But the "current state" includes the fact that you are an agent who exists in a Newcomb-like environment. You're treating the decision as a token event. "Should *I*, *now*, pay?" But rationality isn't about token events. It's about policies. "Should an agent *like me* pay in situations *like this*?" If the answer is no, then agents like you don't get rides.

  **CADE:** So I should sacrifice my actual utility in the actual world to satisfy a hypothetical policy? That's superstition. It's ritual magic. "If I burn this money, the gods of Rationality will be pleased." No. The gods are dead. There's just cause and effect. And causally, burning this money buys me nothing. I'd rather be the guy who keeps his hundred bucks and admits he got lucky that the driver was wrong, than the guy who pays up and admits he's a slave to a decision theory that demands self-harm.

  **FIONA:** You didn't get lucky. She's a perfect predictor. She wasn't wrong. If you don't pay, the only consistent explanation is that she made a mistake, which contradicts the setup. But let's grant your point. Let's say you keep the money. You're rich by a hundred bucks. But you've proven that your decision theory is incapable of securing beneficial contracts.
  You talk about "self-harm." From whose perspective? From the perspective of You-In-Town, yes, paying hurts. But from the perspective of You-In-The-Desert, paying is the only thing that saves your life. Which "You" matters?

  **CADE:** The one that exists! I am the one that exists! The guy in the desert is gone. He's a memory. Why should I, the survivor, suffer for his sake? That's not rationality; that's altruism toward a ghost.

  **FIONA:** It's not altruism. It's identity. You are a temporally extended agent. If you disown the commitments of Past-Cade because they're inconvenient for Present-Cade, you break the chain. You become a series of unconnected moments. And sure, maybe in this one-off case, you win the hundred bucks. But you've admitted that your theory of rationality leaves you dead in the desert in the counterfactual where you need the ride.
  A theory of rationality is supposed to be a guide to action that gets you what you want. If your guide says "Don't pay," and following that guide means you never get the ride in the first place, the guide is broken. It fails by its own lights. It fails *ex-ante*.

  **CADE:** Failing *ex-ante* doesn't mean the *ex-post* reasoning was wrong. Go back to the demon. If the demon says "I will kill anyone who doesn't believe 2+2=5," and I refuse to believe it, and I die... did I reason incorrectly? No. The environment was hostile to truth. Here, the environment is hostile to Causal Decision Theory. It rewards agents who ignore causal dominance. I'd rather be right and broke—or dead—than wrong and rich. I won't let a predictor hold my wallet hostage by threatening to have not saved me.

  **FIONA:** But she's not threatening you. The threat was "I won't save you." That's not a threat; that's a condition of service. It's like a gym membership. You don't say, "I'm already fit, why should I pay the trainer?" You pay because that was the condition of getting fit.
  You keep coming back to this "hostile environment." But this isn't a demon picking on CDT specifically. This is just how prediction works. Any agent that can't bind itself to a course of action loses against a predictor. You're calling it "hostile" because it punishes your specific inability to bind yourself. A Resolute Chooser doesn't see a dilemma here. They just pay. They decided in the desert, and the decision carries through.

  **CADE:** Resolute Choice is just pre-commitment with extra steps. And pre-commitment only works if you can actually enforce it. Can I enforce it now? No. I'm free. I have the money. The only thing stopping me is this abstract idea that I should be "the kind of person" who pays. But I'm not that kind of person. I'm the kind of person who maximizes utility in the current state. And if that means I don't get rides in the future, well, maybe I'll learn to lie better. Maybe I'll hire a bodyguard. I'll adapt causally. I won't adopt a mystical policy that tells me to lose utility for no reason.

  **FIONA:** You say "no reason." The reason is that paying validates the correlation between your choice and her prediction. It's not mystical. It's logical. Your decision *now* is logical evidence of what your decision *would have been* then. They are the same computation.
  You talk about adapting causally. How? You can't change the fact that you are an agent who reasons via causal dominance. Unless you literally lobotomize yourself, you're going to face this choice again. And if you reason the same way, you'll defect again. And predictors will read that. You're painting yourself into a corner where you can only survive in worlds with imperfect predictors. You're limiting your habitat to the mediocre.

  **CADE:** I'm limiting my habitat to the *real*. Where causal arrows point forward. Where the past doesn't change based on my whims. If I have to pretend the past is mutable to get a ride, I'll walk.
  *(Cade pushes off the post, adjusting his dust coat.)*
  Keep the hundred, Fiona. Buy yourself a drink. Tell the driver I said thanks. But tell her I won't be paying. Not because I'm immoral. But because I refuse to worship at the altar of a decision theory that demands I sacrifice reality for consistency.

  **FIONA:** *(Pocketing the money she took from his hand while he was talking)* It's not consistency for its own sake, Cade. It's winning. You think you won because you kept the cash. But you walked out of the desert alive only because she thought you were like me. You're riding on my coattails. You're a free-rider on the disposition of agents who *do* pay. If everyone was Cade, there are no rides. If everyone is Fiona, everyone gets to town.
  You say you refuse to worship. I say you refuse to look at the scoreboard.

  **CADE:** The scoreboard says I'm alive and I have my money.

  **FIONA:** The scoreboard says you're alive *despite* your theory, not *because* of it. And next time, the predictor might not be generous enough to let you prove your point.

  **CADE:** Then next time I'll bring a gun. Causality works on drivers, too.

  **FIONA:** *(Shaking her head)* That's not rationality. That's just war.

  **CADE:** *(Walking away)* Everything is war, Fiona. Even the desert.

  *(Fiona watches him go, then turns to the saloon doors. She hesitates, looking at the money in her hand, then pushes the door open.)*
