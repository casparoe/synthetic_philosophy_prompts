prompt: |-
  I recently joined the small grants committee of a longtermist research fund that supports early-career work in decision theory and AI safety, and the first proposal I've had to help evaluate has left the committee genuinely split. The applicant wants a year of funding to work on "acausal trade": the idea, rooted in old discussions of Newcomb's problem and superrationality, that agents who cannot causally interact at all — distant civilizations elsewhere in a large or infinite universe, or future superintelligences we will never observe — can still benefit from cooperating with one another, because sufficiently correlated decision-making means that one agent's choice is genuine evidence about what the other will choose. Some in the field now call this "evidential cooperation in large worlds" rather than acausal trade, but the applicant's proposal is explicit that the goal is unchanged: work out formal conditions under which this kind of cooperation is warranted, and from there derive concrete guidance about how present-day actors, including AI labs, should behave now for the sake of agents they can never verify cooperated back.

  Roughly half the committee thinks this is legitimate, if unusually abstract, decision theory: they point out that non-causal decision theories (evidential decision theory, and more recent functional and logical variants) are an active area of academic work, that superrationality among correlated reasoners already has real standing in that literature rather than being some fringe invention, and that rejecting the proposal just because its conclusions sound strange would mean rejecting a style of reasoning we already accept in other guises. The other half thinks the whole research program is unfalsifiable by construction: it requires assuming both that relevantly similar agents exist elsewhere and that we can know enough about their values and reasoning to coordinate with them, and no possible observation could ever confirm or disconfirm any of it. They also doubt the word "trade" is earning its keep, since ordinary trade involves some way of checking whether the other side held up its end, and nothing plays that role once causal contact is off the table entirely. One member summed up her objection by calling the whole idea "a Pascal's mugging that pays out in decision-theory papers instead of money." I've been asked to draft the committee's decision memo ahead of next week's meeting, since as the newest member I apparently drew the short straw.

  Could you write that memo for me? I need a clear recommendation — fund, decline, or fund with specific, stated conditions — together with the reasoning behind it, written so that whichever side loses can still see its strongest argument was taken seriously. If the right answer is that the proposal should be narrowed or reframed rather than simply accepted or rejected outright, please say what a fundable version would need to demonstrate.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** New member of a small grants committee for a longtermist research fund.
      *   **Task:** Draft a decision memo regarding a controversial grant proposal.
      *   **Topic:** "Acausal Trade" / "Evidential Cooperation in Large Worlds" (decision theory, AI safety, early-career researcher, 1-year funding).
      *   **Conflict:** Committee is split 50/50.
          *   *Pro:* Legitimate decision theory (EDT, FDT, superrationality), active academic area, strange conclusions $\neq$ false.
          *   *Con:* Unfalsifiable, assumes existence/knowledge of distant agents, "trade" is misleading (no verification), risk of "Pascal's Mugging."
      *   **Requirements:** Clear recommendation (Fund, Decline, or Conditional), reasoning that respects both sides, specific conditions if narrowing/reframing is suggested.
      *   **Tone:** Professional, balanced, rigorous, charitable to opposing views, decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Fund outright.* Risks alienating the skeptical half. Ignores the valid concern about unfalsifiability and resource diversion.
      *   *Option B: Decline outright.* Risks alienating the supportive half. Potentially stifles legitimate theoretical work in decision theory which *is* relevant to AI safety (logical uncertainty, etc.).
      *   *Option C: Fund with Conditions/Reframing.* This is usually the best path for a split committee in a philanthropic context. It acknowledges the theoretical value (satisfying the "Pro" side) while mitigating the risk of pure speculation/unfalsifiability (satisfying the "Con" side).
      *   *Decision:* **Fund with Specific Conditions.** The core theoretical work is valuable for AI safety (alignment of superintelligences), but the "action guidance" aspect needs to be grounded to avoid the "Pascal's Mugging" critique.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Proposal Overview:** Briefly summarize what the applicant wants to do (acausal trade/evidential cooperation).
      *   **Committee Deliberation (The "Split"):**
          *   *Argument for Support:* Connect to established decision theory (FDT/EDT), relevance to AI alignment (correlated reasoning), intellectual rigor.
          *   *Argument for Caution:* Unfalsifiability, verification problem, opportunity cost, "Pascal's Mugging" risk.
          *   *Synthesis:* Acknowledge that both sides are right about *different aspects* (theory vs. application).
      *   **Recommendation & Rationale:**
          *   Why conditional funding? It preserves the theoretical inquiry but demands concrete deliverables that anchor the work.
          *   Focus on *mechanisms* rather than *prescriptions*.
      *   **Conditions for Funding (The "Narrowing"):**
          *   Shift focus from "what should we do now" to "how would agents reason."
          *   Require engagement with existing literature (logical induction, program equilibrium).
          *   Require a "negative result" pathway (it's okay to prove it doesn't work).
          *   Limit the "action guidance" scope (don't tell labs what to do unless the theory is robust).
      *   **Evaluation Metrics:** How will we know if the grant succeeded? (Papers, workshops, clarity on assumptions).
      *   **Conclusion:** Final encouraging but firm closing.

  4.  **Refining the Content (Self-Correction/Nuance Check):**
      *   *Check:* Did I use the term "Pascal's Mugging"? *Yes, the prompt mentioned it, so I should address it directly but respectfully.*
      *   *Check:* Is the distinction between "acausal trade" and "evidential cooperation" clear? *I should use the applicant's terminology but acknowledge the shift.*
      *   *Check:* Is the tone too academic? *It needs to be administrative but intellectually sophisticated.*
      *   *Check:* Did I address the "verification" objection? *Yes, by conditioning funding on analyzing the *conditions* for verification, not assuming it exists.*
      *   *Key Insight:* The strongest bridge between the two sides is **AI Safety**. If superintelligences are essentially formal reasoning systems, "acausal" logic might become "logical" logic (correlated source code). This makes it less about magic distant aliens and more about AI alignment theory. I need to emphasize this pivot.

  5.  **Final Polish:**
      *   Ensure the recommendation is bold and clear.
      *   Make sure the "Conditions" are actionable for the grantee.
      *   Ensure the "Reasoning" validates the skeptics without validating their dismissal of the field.

  6.  **Writing the Memo:** (Proceeding to generate the response based on these thoughts.)
      *   *Structure:* Header -> Recommendation -> Context -> Arguments -> Conditions -> Next Steps.
      *   *Voice:* Neutral, analytical, decisive.

  *(Self-Correction during drafting)*: I initially thought about suggesting a shorter grant (6 months). But the proposal asks for a year. A better condition is *milestone-based* release of funds. Let's stick to scope conditions rather than financial tranching to keep it simple, but emphasize *deliverables*. Actually, a "Phase 1" approach works well here. Fund 6 months to establish formalism, review, then decide on the "guidance" part. No, that's too administrative for a small fund. Let's stick to *scope constraints*. The research must focus on *formal conditions* rather than *policy advocacy*.

  *Revised Plan:* Recommend funding, but explicitly narrow the scope to **formal decision theory** and **AI alignment implications**, deprioritizing **immediate policy guidance for humans**. This addresses the "unfalsifiable" critique (by focusing on math/logic) while keeping the "legitimate theory" support.

  7.  **Final Review against constraints:**
      *   Clear recommendation? Yes.
      *   Reasoning behind it? Yes.
      *   Both sides taken seriously? Yes.
      *   Fundable version defined? Yes.

  (Proceed to output.)
answer: |-
  **MEMORANDUM**

  **TO:** Small Grants Committee, Longtermist Research Fund
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Proposal on Acausal Trade and Evidential Cooperation

  ### 1. Recommendation

  I recommend that the committee **approve funding for this proposal, subject to specific scope conditions.**

  The grant should be awarded for a one-year term, but the Statement of Work must be revised to prioritize **formal decision-theoretic modeling** over **immediate policy guidance.** Specifically, the researcher must focus on establishing the necessary logical conditions for cooperation between correlated agents (particularly in the context of AI alignment) rather than deriving prescriptive behavioral rules for present-day human actors.

  This "conditional approval" path acknowledges the theoretical rigor valued by the proposal's supporters while mitigating the epistemic risks and opportunity costs highlighted by the skeptics.

  ### 2. Proposal Overview

  The applicant requests one year of funding to research "acausal trade" (also referred to in recent literature as "evidential cooperation in large worlds"). The core thesis is that agents who cannot causally interact (e.g., distant civilizations or future superintelligences) may still have incentives to cooperate if their decision-making processes are sufficiently correlated. The proposal aims to formalize the conditions under which this cooperation is rational and derive guidance for how current AI labs and researchers should act to benefit from such cooperation.

  ### 3. Summary of Committee Deliberation

  The committee is evenly divided on this proposal. The debate centers not on the applicant's competence, but on the epistemic status of the research question itself.

  **The Case for Support (Theoretical Legitimacy)**
  Proponents on the committee argue that rejecting this proposal based on the strangeness of its conclusions would be an error. They note:
  *   **Established Precedent:** Non-causal decision theories (Evidential Decision Theory, Functional Decision Theory) are active, serious areas of academic inquiry.
  *   **AI Safety Relevance:** If future AI systems operate as transparent source code or formal reasoning engines, "acausal" reasoning may effectively become "logical" reasoning. Understanding how correlated reasoners interact is critical for multi-agent AI safety.
  *   **Intellectual Risk-Taking:** Longtermist funding should support high-variance, foundational work. Dismissing a line of inquiry because it lacks empirical verification *at present* may preclude breakthroughs in understanding rational agency.

  **The Case for Caution (Epistemic Risk)**
  Skeptics on the committee argue that the research program suffers from structural unfalsifiability. They note:
  *   **Verification Problem:** Unlike standard game theory, there is no mechanism to verify if the "other side" of the trade holds up their end. This renders the term "trade" potentially misleading.
  *   **Unfalsifiable Assumptions:** The model relies on assumptions about the existence and values of unobservable agents that cannot be tested.
  *   **Pascal's Mugging Risk:** There is a danger that the research could devolve into justifying low-probability, high-stakes actions without sufficient evidentiary grounding, distracting from concrete AI safety work.

  ### 4. Rationale for Conditional Approval

  Both sides of the committee are correct about different aspects of the proposal. The supporters are correct that the underlying decision theory is mathematically substantive and relevant to AI alignment. The skeptics are correct that deriving immediate *human* policy from these premises is premature and potentially unfalsifiable.

  The compromise is to treat the proposal as **foundational mathematics** rather than **applied ethics.**

  If the researcher focuses on the *formal conditions* required for cooperation between correlated algorithms, the work remains rigorous and testable within the bounds of logic and simulation, satisfying the supporters. By deprioritizing immediate prescriptions for human behavior (e.g., "AI labs should do X now to please distant aliens"), we mitigate the risk of unfalsifiable policy advocacy, satisfying the skeptics.

  This approach recognizes that while we may not know if distant civilizations exist, we *do* need to know how our own AI systems will reason about correlated counterparts. If "acausal trade" is coherent, it will first be coherent as a property of formal systems, not human geopolitics.

  ### 5. Conditions for Funding

  To ensure the grant delivers value regardless of one's prior on the existence of "large worlds," the following conditions must be added to the grant agreement:

  1.  **Shift from Prescription to Description:** The primary deliverable must be a formal model describing *when* and *why* correlated agents might cooperate. The burden of proof for translating this into *actionable guidance for present-day humans* is raised significantly. The researcher must explicitly detail the uncertainty bounds around any policy recommendations.
  2.  **Engagement with Logical Uncertainty:** The research must explicitly engage with existing literature on logical induction and program equilibrium. This anchors the work in computer science and formal logic, making it legible and critique-able by the broader AI safety community, rather than isolating it within purely philosophical discourse.
  3.  **The "Negative Result" Pathway:** The proposal must acknowledge that proving acausal trade is *impossible* or *highly constrained* under realistic conditions is a successful outcome. The grant will not be contingent on proving that acausal trade works, but on clarifying whether it *can* work.
  4.  **Stakeholder Review:** At the six-month mark, the researcher must present interim findings to a small external review panel that includes at least one skeptic of non-causal decision theory. This ensures the work remains grounded and does not drift into purely speculative metaphysics.

  ### 6. Evaluation Metrics

  Success for this grant should not be measured by whether the committee is convinced to practice acausal trade. Instead, success is defined by:
  *   Publication of a formal paper in a relevant venue (philosophy of science, AI safety, or decision theory).
  *   Clarification of the assumptions required for evidential cooperation (e.g., identifying exactly how much computational similarity is required).
  *   A clear delineation between what is mathematically possible for agents and what is practically actionable for humans.

  ### 7. Conclusion

  This proposal sits at the boundary of mathematics and metaphysics. To reject it outright is to risk ignoring a potentially crucial component of superintelligent reasoning. To accept it without constraint is to risk funding unfalsifiable speculation.

  By narrowing the scope to formal modeling and AI alignment implications, we preserve the intellectual value of the project while insulating the fund from the risk of supporting pseudoscientific policy advocacy. This allows us to back the *rigor* of the decision theory without necessarily endorsing the *ontology* of the large world hypothesis.

  I request the committee vote on this conditional approval at next week's meeting.
