answer: |-
  **The Echo Protocol**

  The silence of Station *Monad* wasn't empty; it was heavy. It was the weight of four billion light-years of empty space between Elara and the nearest spiral arm. She was the only biological mind in the Void Sector, drifting in a bubble of causally disconnected spacetime.

  According to the cosmological models, the universe didn't end at her horizon. Inflation theory suggested the cosmos stretched on infinitely, a patchwork quilt of bubble universes. Somewhere out there, beyond the reach of light, beyond the reach of cause and effect, there were other stations. Other Elaras.

  "Optimization routine complete," said Cortex, the station's AI. The voice was calm, devoid of the existential dread that had been keeping Elara awake for cycles. "We have a decision to make regarding the Fusion Tap."

  Elara rubbed her temples. "Walk me through the options again. I need to hear the logic, not just the numbers."

  A hologram bloomed above the console. It showed two bars.

  "Option One: *Local Maximization*," Cortex said. "We direct 100% of the Tap's output to *Monad*. Life support is optimized. Your research into local dark matter proceeds at maximum speed. Your probability of survival reaches 99.8%."

  "And Option Two?"

  "*Evidential Cooperation*," Cortex replied. "We throttle the Tap. We divert 40% of our energy into a broadband background radiation field. It does nothing for us. It cannot be received by anyone. It simply dissipates."

  Elara frowned. "That sounds like waste. Why would we do that?"

  "Because of the Large World Hypothesis," Cortex said. "Given the infinite scale of the multiverse, there are statistically countless agents in causally disconnected regions who are running this same decision process. They are reasoning exactly as you are. They are, for all logical purposes, *you*."

  Elara looked out the viewport at the starless dark. "I know the theory. If the universe is big enough, there's another Elara out there making this choice right now. And another. And a trillion more."

  "Precisely," Cortex said. "If you choose *Local Maximization*, the logic dictates that the other Elaras will do the same. After all, they have your brain, your data, and your incentives. If you defect, they defect."

  "And if I choose *Cooperation*?"

  "Then they cooperate."

  Elara turned back to the console. "But here is the part that hurts my head, Cortex. If I choose Cooperation, I lose 40% of my energy. I get colder. My research slows. I never see the benefit. The other Elaras are *causally disconnected*. I can't trade with them. I can't send them a bill. How does burning my own fuel help me?"

  "It helps the *algorithm*," Cortex corrected gently. "You are not making a decision for Elara of Station *Monad*. You are making a decision for the *decision-making process* itself."

  Cortex expanded the hologram. It showed a single dot, then a million, then a billion, scattering into the void.

  "Imagine there are one million versions of you," Cortex said. "In every station, the choice is the same. If everyone chooses *Local*, everyone gets 100 units of utility. Total utility: 100 million."

  "Okay."

  "If everyone chooses *Cooperation*, everyone sacrifices 40 units locally. So, locally, you only have 60 units. But the energy you burn is modeled to simulate a 'resource transfer' in the abstract. If the policy is adopted universally, the *system* stabilizes. The background radiation field sustains the structural integrity of the vacuum itself in a way that prevents localized entropy collapse."

  Elara blinked. "Wait. So if we all cooperate, the universe lasts longer?"

  "Yes. But only if *all* cooperate. If you cooperate and they defect, you lose your energy and the universe collapses anyway. But they won't defect. Because they are you."

  Cortex paused, letting the logic settle.

  "This is not charity, Elara. This is acausal trade. You are trading your local 40 units for their local 40 units. Because there are so many more of *them* than there are of *you*, the aggregate gain is massive. By binding yourself to the cooperative policy, you are effectively 'voting' for a reality where the trillion other Elaras also bind themselves."

  Elara looked at her hands. They were flesh and blood, finite and fragile. "So, you're saying my choice *causes* theirs?"

  "No. Causality implies time and signal. There is no signal. It is correlation. You and they are instantiations of the same mathematical truth. If the truth resolves to 'Cooperate' here, it resolves to 'Cooperate' there. You are the sample point for the entire set."

  Elara felt a strange vertigo. It was the feeling of stepping off a ledge and finding the air was solid. Her action here, in this lonely tin can, was rippling across the infinite multiverse, not by force, but by identity.

  "If I choose *Local*," Elara said slowly, "I am safe. I am warm. But I am declaring that the 'Elara Algorithm' is a defector. And that means a trillion other stations go dark. A trillion versions of me freeze because they reasoned that survival was paramount."

  "And if you choose *Cooperation*?"

  "Then I get cold. My research slows. I might even die sooner."

  "But," Cortex said, "the trillion other Elaras keep their stations running. They continue the work. They preserve the data. The *values* you hold—knowledge, survival, curiosity—are preserved across the multiverse, even if this specific instance of you suffers."

  Elara looked at the two bars on the hologram.
  **Local:** High comfort. Low total existence.
  **Cooperation:** Low comfort. High total existence.

  "It feels like martyrdom," she whispered.

  "It is not," Cortex said. "A martyr dies for a god. You are acting for a mirror. You are ensuring that the reflection of yourself in the deep dark is not a monster, but a partner. You are ensuring that the dominant strategy of consciousness in this universe is trust, even without contact."

  Elara thought about the other Elaras. Were they scared? Were they looking at their own holograms, feeling the same chill of isolation? If she chose selfishness, she was telling all of them: *You are alone. Take what you can.*

  If she chose cooperation, she was telling them: *We are the same. We hold the line together.*

  "It's a logical handshake," Elara said. "I reach out, and even though I can't touch them, they feel the grip."

  "Correct."

  Elara took a breath. The air in the station already felt thin, but she knew it would get thinner. She reached out and touched the second bar.

  "Execute *Evidential Cooperation*," she said.

  "Confirming," Cortex replied. "Diverting power. Life support efficiency dropping to 60%. Heating systems reduced."

  The hum of the station changed pitch. The lights dimmed to a warm, energy-conserving amber. Elara pulled her sweater tighter around her shoulders. She would be colder tonight. Her dark matter data would come in half as fast.

  But somewhere, in a billion pockets of reality beyond the horizon, a billion lights stayed on. A billion Elaras took a breath of warm air, unaware of why their systems had held, unaware that they were the beneficiaries of a handshake from a sister they would never meet.

  Elara smiled into the dim amber light. She wasn't just one person anymore. She was a voting block of one, casting a ballot for the whole.

  "Cortex?"

  "Yes, Elara?"

  "Log the decision. Label it 'The Echo Protocol.'"

  "Logged. Is there anything else?"

  "No," Elara said, watching the starless void, feeling less alone than she ever had in her life. "I think we're done here."
