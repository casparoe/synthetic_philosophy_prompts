prompt: |-
  I'm a software engineer at a small fertility-tech startup. Over the past year I've been the one building and maintaining the pipeline that turns a couple's embryo genotyping results into the ranked report their fertility clinic hands them: for each embryo, we currently flag elevated polygenic risk for a handful of serious early-onset conditions. The founders now want to add predicted scores for traits like adult height and a couple of cognitive/educational-attainment proxies, reasoning that prospective parents already ask about this informally, so we might as well be rigorous and transparent about it rather than cede that part of the market to less careful competitors.

  Because I wrote the ranking model, I've been pulled into the small internal group drafting our policy on this ahead of next month's clinical advisory board meeting. In the process I've realized that the debate we keep having -- "does ranking embryos on these traits harm the eventual child?" -- runs straight into what our resident bioethicist calls the nonidentity problem: whichever embryo is transferred and implanted is the only child who will ever exist from this cycle, so no embryo is made worse off by not being chosen, and the child who is eventually born can't coherently claim to have been harmed by the selection method, since a different method would simply have resulted in a different child existing rather than this same child existing in a worse condition. That seems to quietly dissolve the very worry the internal debate has been organized around, which unsettles most of the group more than it reassures them.

  Could you draft the short internal policy memo I've been asked to bring to the advisory board? It should recommend a specific, concrete policy on whether -- and how -- to report non-disease trait predictions in the embryo report, including a realistic timeline for implementing or shelving it, and it needs to actually engage with the nonidentity point rather than quietly drop it: if the standard "we might harm the future child" framing doesn't work the way most of the team assumes, the memo should either locate a different, legitimate basis for restricting or shaping what we report, or explain why, on reflection, there's less at stake here than the team currently believes. I'd also like it to take seriously the strongest objection to whatever it ends up recommending -- a couple of colleagues keep raising the disability-rights worry that routine screening for such traits expresses something troubling about which lives are considered worth bringing into existence, independent of whether any particular future child is harmed by it -- rather than mention that concern only to wave it away.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer at a small fertility-tech startup.
      *   **Task:** Draft a short internal policy memo for the Clinical Advisory Board.
      *   **Context:** The company currently reports polygenic risk scores (PRS) for serious early-onset conditions. Founders want to add non-disease traits (height, cognitive/educational proxies).
      *   **Key Ethical Conflict:** The team is stuck on the "harm to the future child" argument. The user recognizes the *Nonidentity Problem* (Parfit): selecting Embryo A over Embryo B doesn't harm Embryo B (it won't exist), and the resulting child (from A) isn't harmed by being selected (they wouldn't exist otherwise). This realization unsettles the team because it dissolves their primary ethical objection.
      *   **Requirements:**
          1.  Recommend a specific, concrete policy (report or don't report, and how/when).
          2.  Include a realistic timeline.
          3.  *Crucially:* Engage directly with the Nonidentity Problem (don't ignore it). If "harm" doesn't work, find another ethical basis OR explain why the stakes are lower.
          4.  *Crucially:* Take seriously the Disability Rights objection (expressive harm/social message), not just wave it away.
          5.  Tone: Professional, ethical, pragmatic, suitable for a Clinical Advisory Board.

  2.  **Deconstruct the Ethical Landscape:**
      *   *The Nonidentity Problem:* It's true that standard harm-based ethics struggle here. If we select for height, the tall child isn't "harmed" by being selected for height. However, this doesn't mean *anything goes*. It shifts the ethical weight from *individual harm* to *societal impact*, *parental expectations*, and *clinical utility*.
      *   *Disability Rights/Expressive Harm:* Even if no individual is harmed, does selecting for "desirable" traits express a negative judgment on those who lack them? Does it commodify children? This is a strong objection that needs addressing.
      *   *Clinical Utility/Validity:* Polygenic scores for height are okay-ish; for cognitive/educational attainment, they are statistically weak, highly environment-dependent, and ethically fraught. Reporting them as "rankings" implies a precision that doesn't exist.
      *   *Regulatory/Reputational Risk:* Going too far too fast could invite FDA scrutiny or public backlash.

  3.  **Determine the Recommendation:**
      *   *Option A: Report everything.* Too risky. Cognitive scores are scientifically shaky and ethically explosive.
      *   *Option B: Ban everything.* Misses the market opportunity and ignores that parents *will* ask.
      *   *Option C: Hybrid/Phased Approach.* Report physical traits (height) with heavy caveats? Or hold off on cognitive entirely?
      *   *Decision:* The most responsible engineering/ethical stance is to **shelve cognitive/educational proxies** for now due to low predictive validity and high expressive harm risk, but **prepare a framework for non-disease physical traits (like height)** with strict counseling guardrails. This acknowledges the Nonidentity Problem (shifting focus from harm to *meaning* and *utility*) and respects the Disability Rights critique (avoiding eugenic signaling).
      *   *Refinement:* Actually, given the sensitivity, a stronger stance might be better for a *policy memo* to an Advisory Board. Let's recommend **shelving non-disease trait ranking entirely for now**, but establishing a working group to define *if* and *how* they could ever be presented as *information* rather than *ranking*. Why? Because "ranking" implies optimization. The Nonidentity Problem shows we aren't preventing harm, so the justification must be *benefit*. Is there a clinical benefit to knowing predicted height? Debatable. Is there a benefit to predicted IQ? Highly debatable and risky.
      *   *Pivot:* Let's go with a **Moratorium on Ranking, Pilot on Information**. We won't *rank* embryos on non-disease traits (which implies one is "better"), but we might provide raw data *if* clinically validated and accompanied by genetic counseling. Actually, for a startup, "shelving" is safer. Let's recommend **shelving the addition of cognitive/educational proxies indefinitely** and **delaying physical traits (height) pending a specific counseling framework.** This shows caution.
      *   *Wait, the prompt asks to engage the Nonidentity Point.* If harm is off the table, why restrict? Because of *societal harm* and *misalignment of expectations*. The memo needs to articulate that while the *child* isn't harmed, the *practice* can be harmful to society and the parent-child relationship.
      *   *Final Decision:* Recommend **shelving cognitive/educational proxies** (too much expressive harm/low validity) and **limiting physical traits to strict informational reporting (no ranking)** with a 6-month delay for counseling protocol development. This balances the founders' market desire with ethical rigor.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation clearly.
      *   **Context:** Briefly state the proposal (adding traits).
      *   **Ethical Analysis (The Core):**
          *   Address the Nonidentity Problem directly. Acknowledge it invalidates the "harm to child" argument.
          *   Pivot to the correct ethical framework: *Expressive Harm* and *Clinical Utility*.
          *   Address the Disability Rights objection seriously. It's not about harming Child A vs. Child B; it's about what selecting for Trait X says about people with Trait Y.
      *   **Scientific Validity:** Briefly touch on the noise in PRS for cognition.
      *   **Recommendation:** Specific policy (No ranking, maybe info later, no cognition).
      *   **Timeline:** Realistic milestones.
      *   **Conclusion:** Reiterate commitment to responsible innovation.

  5.  **Refining the Tone:**
      *   Needs to sound like an engineer who has thought deeply about ethics, not a philosopher disconnected from product.
      *   Avoid jargon where possible, but use the ethical terms correctly (Nonidentity, Expressive Harm).
      *   Ensure the Disability Rights section feels robust, not tokenistic.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the Nonidentity Problem clearly? *Adjustment:* Keep it brief but precise. "We cannot claim we are preventing harm to the future child..."
      *   *Check:* Did I address the Disability Rights objection? *Adjustment:* Make sure to link it to the "ranking" aspect. Ranking implies "better/worse," which fuels the expressive harm.
      *   *Check:* Is the timeline realistic? *Adjustment:* 6 months for counseling protocol is reasonable for a startup.
      *   *Check:* Is the recommendation concrete? *Adjustment:* "Do not implement cognitive proxies. Pause height ranking. Move to informational only."

  7.  **Final Polish:** Check against the prompt's specific constraints (engage nonidentity, take disability rights seriously, concrete policy/timeline). *Self-correction:* Ensure I don't just say "it's hard." I need to take a stand. The stand should be: The Nonidentity Problem shifts the burden of proof to *benefit*. Since benefit is low/unclear and expressive risk is high, we restrict.

  8.  *(Final thought on the Nonidentity engagement)*: The prompt says the team is *unsettled* that the harm argument dissolves. The memo needs to reassure them that ethics doesn't dissolve with it. It just changes shape. I need to make that explicit.

  9.  *(Final thought on Disability Rights)*: The objection is that screening expresses that some lives are less worth living. I need to acknowledge that even if no *individual* is harmed, the *message* sent to the existing community is the harm.

