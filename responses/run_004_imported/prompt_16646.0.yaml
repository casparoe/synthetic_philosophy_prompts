prompt: |-
  I'm a consultant clinical psychologist leading the autism assessment pathway at my NHS trust, and until this spring "Pathological Demand Avoidance" was a term I mostly associated with continuing-education seminars I hadn't gotten around to attending. Then my sister's son came home from a private assessment with a PDA profile the family had first read about on a parents' forum, and within a couple of months the label had reorganised how everyone in the house talked about him, managed him, and — this is the part that has stayed with me — how he talked about himself. It made the question our trust's Neurodevelopmental Diagnostic Practice Group is about to vote on feel considerably less academic than it would have six months ago.

  The group must decide whether the trust will start formally recognising PDA (some clinicians now prefer "extreme demand avoidance," partly to shed the word "pathological") as a named profile within autism assessment reports, or continue our current unwritten practice of noting demand-avoidant behaviour only in general descriptive terms, without the label, within a standard diagnosis. This is not merely a semantic choice: the wording of a report shapes Education, Health and Care Plan applications, school placement recommendations, and referral to the specific low-demand parenting and teaching approaches some clinicians swear by. One camp on the committee argues that declining to use a term families and, increasingly, autistic adults already use to describe themselves is a form of institutional bad faith. Another camp keeps citing Ian Hacking's account of looping effects — his nineteenth-century fugue patients, the 1980s surge in multiple personality diagnoses — to argue that a trust lending its authority to a contested category is precisely how a classification hardens into the behaviour it claims only to describe, especially once children old enough to read their own notes start doing so.

  Please draft the short written opinion I will circulate before the group meets next month. It should recommend one concrete option — formally recognise the profile, decline to, or recognise it conditionally with a named review date — and it should take both Hacking's worry and the bad-faith objection seriously enough that a proponent of either could see their strongest argument reflected in it.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion piece:

  1.  **Analyze the Request:**
      *   **Role:** Consultant Clinical Psychologist leading the autism assessment pathway at an NHS trust.
      *   **Audience:** The Neurodevelopmental Diagnostic Practice Group (colleagues, clinicians, stakeholders).
      *   **Topic:** Whether to formally recognise "Pathological Demand Avoidance" (PDA) / "Extreme Demand Avoidance" (EDA) as a named profile within autism assessment reports.
      *   **Context:** Personal experience (sister's son) made the issue feel less academic. High stakes (EHCPs, school placements, parenting approaches).
      *   **Key Tensions:**
          *   *Utility/Validation:* Families and autistic adults use the term; not using it feels like institutional bad faith. It unlocks specific support strategies.
          *   *Risk/Looping Effects:* Ian Hacking's argument (classifications create the phenomena they describe). Risk of hardening a contested category, especially if children read their notes.
      *   **Requirements:**
          *   Draft a short written opinion.
          *   Recommend one concrete option (Formal recognition, Decline, or Conditional recognition with review).
          *   Reflect the strongest arguments of both camps (Hacking/looping effects vs. Bad faith/utility).
          *   Tone: Professional, nuanced, clinically grounded, empathetic, decisive.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Formal Recognition):* Risks validating a non-DSM/ICD category prematurely. Might exacerbate looping effects.
      *   *Option 2 (Decline):* Ignores lived experience, alienates families, blocks access to specific support strategies (low demand approaches). Feels like "bad faith."
      *   *Option 3 (Conditional Recognition with Review):* Balances the need to support families *now* with scientific rigour. Acknowledges the utility without cementing the ontology permanently. Allows for data collection.
      *   *Decision:* Option 3 is the most clinically and ethically robust position for a lead psychologist in a public health system. It allows for pragmatism without sacrificing scientific integrity. It addresses Hacking (by treating it as provisional) and the Bad Faith objection (by acknowledging the term's utility).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the shift from academic to personal. Validate the weight of the decision.
      *   **The "Bad Faith" Argument (Validation & Utility):** Acknowledge why families want this. It's not just a label; it's a key to support (EHCPs, teaching styles). Ignoring it dismisses their lived experience.
      *   **The "Hacking" Argument (Looping Effects & Risk):** Acknowledge the danger. Labels shape identity. If we write "PDA," the child becomes "PDA." It might limit potential or create a self-fulfilling prophecy. It's not in the major diagnostic manuals (DSM/ICD).
      *   **The Synthesis/Recommendation:** Propose "Conditional Recognition."
          *   Use the term descriptively but clarify diagnostic status (e.g., "Autism Spectrum Condition with a profile of Extreme Demand Avoidance").
          *   Prefer "Extreme" over "Pathological" (less stigmatizing).
          *   Set a review date (e.g., 2 years).
          *   Commit to monitoring outcomes.
      *   **Closing:** Call for unity in the complexity.

  4.  **Refining the Tone:**
      *   Needs to sound like a senior clinician. Not too bureaucratic, but precise.
      *   Must show empathy for the sister's nephew without making the memo *about* him.
      *   Must show respect for the theoretical concerns (Hacking) without getting bogged down in philosophy jargon.
      *   *Self-Correction during drafting:* I initially thought about suggesting "PDA" but the prompt mentions clinicians prefer "Extreme Demand Avoidance" to shed "Pathological." I should align with that to show nuance.
      *   *Addressing Hacking:* Make sure to explicitly mention that the review date is a safeguard against the "hardening" Hacking warns about.
      *   *Addressing Bad Faith:* Make sure to explicitly state that withholding the term hinders support, which is an ethical issue.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi team. This is hard. My nephew got diagnosed privately. It helped them. But Hacking says labels change people. We need to decide. I say we use it but carefully. Call it EDA. Review in 2 years. This helps families but keeps us safe scientifically.

  6.  **Drafting - Iteration 2 (Adding Professional Weight):**
      *   To: Neurodevelopmental Diagnostic Practice Group.
      *   From: [Name], Lead Psychologist.
      *   Subject: PDA/EDA Profile Recognition.
      *   Start with the personal context. It grounds the theory.
      *   Discuss the "Bad Faith" point: If families know the term and we don't use it, we break trust. Also, schools need the language for EHCPs.
      *   Discuss the "Looping" point: Hacking is right. Labels stick. Kids read notes. We don't want to create a ceiling.
      *   Proposal: Use "Profile of Extreme Demand Avoidance" within ASD diagnosis. Not a standalone diagnosis. Review in 24 months.
      *   End: This is about balancing care and science.

  7.  **Final Polish (checking against constraints):**
      *   *Concrete option?* Yes (Conditional recognition).
      *   *Hacking reflected?* Yes (Looping effects mentioned as risk mitigation).
      *   *Bad Faith reflected?* Yes (Institutional trust and access to care).
      *   *Tone?* Professional, reflective.

  8.  **Final Review against the Prompt's Specific Details:**
      *   Mention the sister's son? Yes, briefly, to establish the "less academic" shift.
      *   Mention EHCPs/Schools? Yes.
      *   Mention "Pathological" vs "Extreme"? Yes.
      *   Mention the review date? Yes.

      *(Self-Correction)*: Ensure I don't sound like I'm making a diagnosis for my nephew in the memo. Keep it professional. Use the experience to illustrate the *impact* of the label, not the validity of his specific case.

      *(Refining the Hacking point)*: Ensure I explain *why* the review date helps with Hacking's concern (it prevents permanent reification).

      *(Refining the Bad Faith point)*: Ensure I explain *why* not using it is bad faith (withholding a key to support).

  9.  **Final Polish of the Text:** (Proceeding to generate output based on these thoughts).
answer: |-
  **TO:** Neurodevelopmental Diagnostic Practice Group
  **FROM:** [Your Name], Consultant Clinical Psychologist, Lead for Autism Assessment Pathway
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation Regarding the Recognition of the PDA/EDA Profile in Assessment Reports

  **Context**
  Until recently, my engagement with the concept of Pathological Demand Avoidance (PDA) was largely theoretical, confined to continuing education backlogs. That changed this spring when a close family member received a private assessment identifying a PDA profile. I witnessed, firsthand, how rapidly that terminology reorganised the family's ecosystem: it altered how they spoke to the child, how the child understood his own difficulties, and crucially, it unlocked specific educational accommodations that had previously been denied.

  This personal experience has underscored that our upcoming vote is not merely a taxonomic exercise. It is a decision that will directly dictate access to resources (EHCPs, school placements) and shape the therapeutic narratives offered to families. We are balancing clinical rigour against immediate utility.

  **The Tension**
  Our debate thus far has highlighted two compelling, seemingly contradictory ethical imperatives.

  1.  **The Imperative of Validation (The "Bad Faith" Argument):**
      Proponents of recognition argue that withholding a term widely used by the autistic community and families constitutes a form of institutional bad faith. When we describe demand-avoidant behaviour only in general terms, we risk rendering invisible the specific constellation of needs that requires a "low-demand" approach. If a label is the key that unlocks appropriate schooling and parenting support, withholding it on the grounds of diagnostic purity may cause tangible harm. Families feel heard when we use their language; they feel dismissed when we do not.

  2.  **The Imperative of Caution (The "Looping Effect" Argument):**
      Conversely, we must heed Ian Hacking's warning regarding "looping effects." Diagnostic categories are not passive descriptions; they are active agents. When a Trust formally codifies a contested category, we risk reifying a transient behavioural pattern into a fixed identity. There is a genuine risk that a child who reads "PDA" in their report may begin to perform the role we have assigned them, limiting their potential for growth. By lending our authority to a profile not currently recognised in the DSM or ICD, we may inadvertently harden the very behaviours we seek to alleviate.

  **Recommendation**
  To navigate between the Scylla of invalidating lived experience and the Charybdis of premature reification, I recommend we adopt a stance of **Conditional Recognition.**

  Specifically, I propose the following protocol:

  1.  **Terminology:** We will utilise the descriptor **"Autism Spectrum Condition with a profile of Extreme Demand Avoidance"** (preferring 'Extreme' over 'Pathological' to reduce stigma and align with evolving clinical consensus). This will appear as a descriptive profile within the standard ASD diagnosis, not as a standalone diagnostic entity.
  2.  **Clinical Utility:** Reports will explicitly link this profile to recommended interventions (e.g., low-arousal approaches, flexible demand management) to ensure EHCP and school utility is maintained.
  3.  **Sunset Clause:** This practice will be adopted provisionally for a period of **24 months**. At that point, the Practice Group will reconvene to review emerging literature, internal outcome data, and service user feedback before making a permanent determination.

  **Rationale**
  This approach acknowledges the "bad faith" objection by validating the language families need to secure support *now*. It treats the term as a functional tool for care rather than a dismissal of their reality.

  Simultaneously, it honours Hacking's concern by refusing to cement the category permanently. The 24-month review date signals to clinicians, families, and—importantly—the young people themselves that our understanding is evolving. It prevents the label from becoming a permanent ceiling, allowing us to monitor whether the "looping effect" is limiting outcomes or facilitating them.

  We cannot wait for perfect scientific consensus before supporting struggling families, but we must not mistake our current best guess for final truth. Conditional recognition allows us to care for the child in front of us without compromising the integrity of the science that will care for future children.

  I look forward to discussing this proposal at our next meeting.

  [Your Name]
  Consultant Clinical Psychologist
