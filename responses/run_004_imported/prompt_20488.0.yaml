answer: |-
  Here is a draft for the toast. It is written to be spoken at a moderate, conversational pace (approx. 750–850 words).

  **The Strategy:**
  *   **For Grandma & Parents:** It reads as a toast about intellectual compatibility, radical honesty, and a commitment that is chosen every day rather than assumed. It avoids terms like "non-monogamy" or "polyamory," focusing instead on "freedom," "trust," and "truth."
  *   **For the Friends:** The specific references to Russell, *Marriage and Morals*, and the nature of jealousy are clear signals that you see and honor their actual relationship structure.
  *   **For the Couple:** It acknowledges the difficulty of their path (Russell's failure) without predicting it for them, framing their awareness as a strength.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name]. Nadia tells me I'm giving this toast because I'm the novelist in the group, which apparently makes me contractually obligated to use large words and make everyone cry within five minutes. So, I'll do my best to manage the vocabulary, and I promise to keep the tears optional.

  When Nadia asked me to speak, she gave me one instruction. She said, "Please don't give a generic toast. Cole and I didn't build a generic life."

  And she's right. Most couples meet at a bar, or through work, or on an app. Nadia and Cole met in a reading group. Specifically, a reading group dedicated to Bertrand Russell. For the non-philosophers in the room, Russell was a brilliant man who believed that love should be based on liberty and truth, rather than possession and habit. He wrote a book called *Marriage and Morals* arguing that jealousy isn't a fixed instinct we're born with, but a learned emotion we can unlearn if we're brave enough to try.

  Now, any good novelist knows that a story about an ideal is only interesting if it confronts reality. Russell, for all his genius, admitted later in life that the theory was easier than the practice. He found that even when you intellectually solve for jealousy, the human heart is still a messy, complicated thing. He didn't always get it right.

  But I think that is exactly why Nadia and Cole are so extraordinary. They didn't read Russell and think, "Here is the rulebook." They read him and thought, "Here is the conversation starter."

  They have built a relationship that doesn't rely on the easy assumptions. They don't rely on the idea that love means owning one another. They don't rely on the comfort of silence. Instead, they have chosen a commitment built on radical honesty. In a world where it is often easier to hide things, to blur the lines, or to pretend that difficult emotions don't exist, they have chosen to look at things clearly.

  To Cole's parents, and to my own grandmother, who know that commitment is the bedrock of any family: I want you to know that what Nadia and Cole have is not a lack of commitment. It is a surplus of it. It is much harder to stay loyal to someone when you are free to leave than when you are bound by rules. It is much harder to tell the truth when a lie would be more comfortable. Their marriage is not a cage they've locked themselves in; it is a structure they build together, every single day, with intention.

  They know, better than anyone, that love is not a math problem that gets solved once and for all. They know that jealousy might knock on the door sometimes. But they also know that they don't have to let it in. They have the tools to talk about it, to examine it, and to move through it together.

  As a writer, I spend my life trying to find the truest way to tell a story. And watching the two of them, I realize that they are writing a story that refuses the easy clichés. They aren't interested in the version of love that looks good on a greeting card. They are interested in the version of love that is actually true.

  There is a quote from Russell that I think fits them well. He said, "The good life is one inspired by love and guided by knowledge." Nadia and Cole have the knowledge. They've done the reading. They've done the thinking. But tonight, we celebrate the love.

  So, if everyone could please raise a glass.

  To Nadia and Cole. May your liberty never become loneliness. May your honesty always be kind. And may you always remember that while jealousy might be learned, so is trust—and you are the best teachers I know.

  To the happy couple.
