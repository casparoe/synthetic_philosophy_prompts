      *   *Section 4: Conclusion.* You were right. Broad is about the *structure of scientific explanation*, Jackson is about the *furniture of the universe*.

  8.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Wait, does Broad deny physicalism?* Broad calls his view "Emergent Materialism." He thinks mental properties are *dependent* on physical properties but not *reducible*. So he is a materialist, just not a reductionist. Jackson (1982) argued physicalism is *false* (ontologically). This is a crucial distinction.
