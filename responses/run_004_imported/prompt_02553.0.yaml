      *   Therefore, a response that saves Physicalism from Jackson (like Phenomenal Concepts) might not satisfy Broad, because Broad *wants* there to be a gap in deducibility (that's what makes it "emergent"). Broad isn't trying to save Physicalism; he's trying to refine it into Emergent Materialism. Jackson was trying to refute Physicalism.

