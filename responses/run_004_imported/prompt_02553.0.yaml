      *   *Scenario:* A "Mathematical Archangel" knows all microscopic physical facts and has infinite reasoning power.
      *   *Example:* Ammonia (Nitrogen + Hydrogen).
      *   *Claim:* The Archangel can deduce chemical properties (solubility, structure) from micro-physics. *However*, he cannot deduce the *smell* (secondary quality) from the micro-physics alone.
      *   *Conclusion:* The connection between physical structure and secondary qualities (like smell) is not logically deducible. It requires a "brute fact" or an "emergent law."
      *   *Metaphysical Stance:* Broad is an *Emergent Materialist*. He believes mental/sensory properties emerge from physical bases but are not reducible to them in a strict logical sense. He accepts the physical base but denies strict reducibility.

  3.  **Deconstruct Jackson's Mary Argument:**
      *   *Source:* Frank Jackson, "Epiphenomenal Qualia" (1982).
      *   *Scenario:* Mary knows all physical facts about color vision but has never seen color (black/white room).
      *   *Claim:* When she sees red, she learns something new ("what it is like").
      *   *Conclusion:* Physicalism is false (because there are facts about human experience that are not physical facts).
      *   *Metaphysical Stance:* Jackson (at the time) used this to argue for *Epiphenomenalism* and against *Physicalism* broadly.

  4.  **Compare the Structures:**
      *   *Similarities:* Both involve an omniscient (regarding physics) agent who lacks sensory experience. Both argue that physical knowledge doesn't yield sensory knowledge.
