      *   *Ability Hypothesis (Lewis/Nemirow):* Mary doesn't learn a fact; she gains an ability.
          *   *Against Jackson:* Plausible.
          *   *Against Broad:* Less effective. Broad isn't talking about "knowing how" vs. "knowing that" primarily; he's talking about the *deducibility of laws*. The Archangel can't predict the smell even with infinite reasoning. An ability doesn't fix the gap in the *law*.
      *   *Phenomenal Concepts Strategy (Loar, Tye, etc.):* Mary learns the same fact under a new mode of presentation.
