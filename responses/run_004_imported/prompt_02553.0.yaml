answer: |-
  First off, take a deep breath. You are absolutely right to feel that something was off about your friend's equation of the two arguments. While they share a family resemblance (omniscient physical knowledge + lack of sensory experience = gap), conflating C.D. Broad's "Mathematical Archangel" with Frank Jackson's "Mary" is a classic case of missing the forest for the trees.

  Your intuition was spot on: Broad is arguing for **Emergent Materialism**, whereas Jackson (in the 1982 paper) was arguing against **Physicalism** tout court. They are diagnosing the same symptom (the explanatory gap) but prescribing very different treatments.

  Here is the breakdown you need to settle this argument (and maybe win the next round).

  ### 1. What is the Archangel Actually Establishing?

  To understand Broad, you have to understand his target. In 1925, the big fight wasn't between Physicalists and Dualists; it was between **Mechanistic Materialists** and **Emergent Materialists**.

  *   **Mechanistic Materialism:** Everything about the macro-world (chemistry, biology, mind) is strictly deducible from the micro-physics. If you know the position and momentum of every particle, you can logically derive everything else.
  *   **Emergent Materialism (Broad's View):** Higher-level properties (like the smell of ammonia, or consciousness) genuinely depend on physical structures, but they are *not* logically deducible from them. They arise via "trans-ordinal laws" that are brute facts of nature.

  **The Archangel's Job:**
  Broad's Archangel isn't there to prove that physicalism is *false*. He is there to prove that **reductionism is false.**

  When Broad says the Archangel "could not possibly know that these changes would be accompanied by the appearance of a smell... unless someone told him so," he is establishing that the connection between physical structure and secondary qualities is **contingent**, not necessary. The Archangel has all the physical data and infinite logic, yet he still hits a wall.

  **Broad's Conclusion:** The universe contains "emergent laws." Physicalism (in the sense of matter being all there is) can be true, but *Mechanistic* Physicalism (the idea that everything is derivable from physics) is false.

  ### 2. Structural Comparison: Mary vs. The Archangel

  Your friend claims they are the same argument. They are structurally similar, but their **modal force** and **ontological conclusions** differ.

  | Feature | Jackson's Mary (1982) | Broad's Archangel (1925) |
  | :--- | :--- | :--- |
  | **The Agent** | Mary (Human, limited memory/processing) | Archangel (Infinite reasoning power) |
  | **The Gap** | Epistemic (She learns something new) | Explanatory/Deductive (He cannot derive the fact) |
  | **The Target** | **Physicalism** (The ontology) | **Mechanism** (The explanatory model) |
  | **The Conclusion** | There are non-physical facts (Qualia exist outside physical facts). | There are brute, emergent laws connecting physical bases to sensory effects. |
  | **Metaphysics** | Leads to Property Dualism / Epiphenomenalism. | Leads to Emergent Materialism. |

  **The Crucial Difference:**
  Jackson uses the gap to say: *"Because Mary learns something new, there must be a fact she didn't know. Since she knew all physical facts, the new fact is non-physical. Therefore, Physicalism is false."*

  Broad uses the gap to say: *"Because the Archangel cannot deduce the smell, the law connecting atoms to smell is not a law of physics. It is an emergent law. Therefore, Mechanism is false, but Matter is still the substrate."*

  Jackson thinks the gap reveals a **new ontological category**. Broad thinks the gap reveals a **limitation in scientific derivation**.

  ### 3. Can Physicalist Responses to Jackson Work on Broad?

  This is where your intuition about "emergence" really matters. Let's test the two most common physicalist defenses against Jackson to see if they work on Broad.

  #### A. The Ability Hypothesis (Lewis/Nemirow)
  *   **The Move:** Mary doesn't learn a new *fact*; she gains a new *ability* (to recognize/remember red).
  *   **Against Jackson:** Plausible. It saves physicalism by reclassifying "knowledge" as "know-how."
  *   **Against Broad:** **This fails.** Broad's Archangel isn't trying to *recognize* ammonia; he is trying to *predict* it. The Archangel has infinite reasoning power; "ability" isn't the issue. The issue is that the *law of nature* connecting the atoms to the smell is not contained in the physics. Telling the Archangel "it's just an ability" doesn't explain why the physical facts don't *necessitate* the sensory outcome. Broad would say, "Exactly! The necessitation is missing. That's why it's emergent."

  #### B. The Phenomenal Concepts Strategy (Loar, Tye, Papineau)
  *   **The Move:** Mary learns the same physical fact, but under a new "phenomenal concept." The gap is conceptual, not ontological.
  *   **Against Jackson:** Very popular among modern physicalists.
  *   **Against Broad:** **This is tricky.** Broad might actually agree with this *description* but disagree with the *implication*.
      *   A modern Physicalist says: "The link between brain state and smell is necessary, but we can only know it a posteriori."
      *   Broad says: "No, the link is contingent. That's why it's emergent."
      *   If you tell Broad, "It's just a different concept," Broad replies: "Why does *this* concept attach to *that* physical state? If it were truly physical, the Archangel should be able to deduce the attachment. Since he can't, the attachment is a brute fact."

  **The Verdict on Responses:**
  Standard physicalist responses try to **close the gap** (by saying it's illusory or conceptual). Broad **wants the gap**. For Broad, the gap is the defining feature of Emergent Materialism. He isn't trying to save Physicalism from the argument; he is using the argument to refine Materialism into a non-reductive form.

  ### 4. Why You Were Right (and How to Tell Your Friend)

  You were right to feel that Broad is up to something different. Here is the summary you can use:

  1.  **Ontology vs. Explanation:** Jackson argues that the existence of qualia proves physical *facts* are incomplete (Ontological claim). Broad argues that the unpredictability of qualia proves physical *laws* are incomplete (Explanatory claim).
  2.  **The Status of the Gap:** For Jackson, the gap is a bug that kills Physicalism. For Broad, the gap is a feature that defines Emergence. Broad accepts the physical world is causally closed; he just denies it is logically transparent.
  3.  **The Archangel's Power:** Mary is limited by her human brain. The Archangel is logically omniscient regarding physics. If the Archangel can't deduce the smell, it's not because of a cognitive limitation (like Mary might have); it's because the deduction is *impossible in principle* without adding a new, emergent law.

  **The "Mic Drop" Point:**
  Tell your friend: *"If Jackson is right, Physicalism is false. If Broad is right, Physicalism is true, but Reductive Mechanism is false. Broad isn't trying to kill Physicalism; he's trying to save Materialism from the impossibility of strict reduction. Mary is a weapon against physicalism; the Archangel is a tool for classifying laws of nature."*

  ### Summary for Your Peace of Mind
  You didn't lose that argument; you just ran out of historical context. Broad is the grandfather of **Non-Reductive Physicalism** (or Emergent Materialism), whereas Jackson (in 1982) was arguing for **Property Dualism**.

  The Archangel argument establishes that **supervenience without reducibility** is possible (the smell depends on the atoms, but isn't deducible from them). Mary's Room argues that **physical omniscience without phenomenal omniscience** is possible.

  They look the same on the surface, but Broad is arguing about the *structure of scientific laws*, while Jackson is arguing about the *furniture of the universe*. You can sleep soundly knowing your intuition was philosophically robust.
