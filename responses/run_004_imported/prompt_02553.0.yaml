          *   **Ontology:** Jackson (1982) concludes non-physical properties exist (dualist leanings). Broad concludes *Emergent Materialism*. For Broad, the smell *is* real and depends on the matter, but the law connecting them is "emergent" (brute), not derivable. Broad isn't necessarily saying physicalism is *false*, but that a specific *version* of it (Mechanistic/Reductive) is false.
          *   **The "New Knowledge":** For Jackson, the new knowledge proves new *facts* exist. For Broad, the inability to deduce proves the *laws of nature* are not all derivable from micro-physics.

