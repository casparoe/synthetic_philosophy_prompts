          *   *Refinement:* The theorem says if $P_1(E)$ and $P_2(E)$ are common knowledge, then $P_1(E) = P_2(E)$. If we just swap numbers, we haven't necessarily established common knowledge of the *final* posteriors, because the act of swapping numbers provides *new evidence* (the fact that the other person holds that credence), which should cause an update.

      *   *Flaw 2: The "Once" Fallacy (Iterative Updating).*
          *   The user thinks stating credences *once* fixes it.
          *   *Reality:* Stating a credence provides new information (evidence about the other person's private signal).
