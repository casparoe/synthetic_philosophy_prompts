answer: |-
  This is an excellent question that cuts to the heart of Aristotle's economic thought. You have spotted a tension that scholars have debated for centuries. It is easy to read those two passages and think Aristotle is contradicting himself or being redundant.

  However, Aristotle is making a sophisticated distinction between the **ontological basis of value** (what value *is*) and the **practical mechanism of measurement** (how we *calculate* value).

  Here is the breakdown of the difference between **Demand (*chreia*)** and **Money (*nomisma*)** in his system, and why he needs both concepts to explain exchange.

  ### 1. Demand: The "Unit in Truth" (Ontological Foundation)
  When Aristotle says demand is the "unit in truth," he is talking about the **source of value**.

  For Aristotle, objects do not have value in isolation. A shoe has no value if no one needs to walk; a house has no value if no one needs shelter. Therefore, the only thing that makes two qualitatively different things (like a house and a shoe) comparable is that they both satisfy a human need.

  *   **Role:** Demand provides the *reason* for exchange. It is the common denominator that exists in reality.
  *   **Nature:** It is natural (*physis*). Human needs are a fact of existence.
  *   **Function:** It establishes the **ratio** of exchange. If a house is worth 500 pairs of shoes, it is ultimately because the community's demand for a house is equivalent to the demand for 500 pairs of shoes.

  **The Problem with Demand:** Demand is abstract, fluid, and subjective. My "need" for a shoe is internal and invisible. I cannot hand you my "need" in exchange for your house. Furthermore, needs fluctuate constantly. If demand is the only standard, exchange would be impossible because we couldn't agree on a specific number.

  ### 2. Money: The "Representative" (Practical Instrument)
  When Aristotle says money is a "representative of demand" and acts as a "measure," he is talking about the **tool of valuation**.

  Because we cannot trade "needs" directly, we invent a convention (*nomos*) to stand in for them. Money is a token that says, "This object represents a certain amount of social demand."

  *   **Role:** Money provides the *method* for exchange. It makes the invisible visible.
  *   **Nature:** It is conventional/legal (*nomos*). As Aristotle notes, it exists by law and can be changed or made useless (e.g., currency reform, demonetization).
  *   **Function:** It establishes the **price**. It allows for commensurability by attaching a number to the good, allowing for deferred exchange (selling now to buy later).

  **The Problem with Money:** Money has no value in itself (Aristotle is discussing coinage here, not commodity money like gold necessarily). It is only valuable because we agree it represents demand. If it stops representing demand, it becomes "useless," as Aristotle says.

  ### 3. Why He Needs Both Concepts
  You asked why he needs both if they seem to do the same thing. The answer is that **demand explains value, while money explains price.**

  If Aristotle only talked about **Demand**:
  He could explain *why* we trade, but he couldn't explain *how* we trade. We cannot build a complex society on barter based on mutual need alone, because needs don't coincide perfectly in time or quantity (the "double coincidence of wants" problem). We need a standard measure to bridge the gap.

  If Aristotle only talked about **Money**:
  He would be suggesting that value is arbitrary. If money is just a convention, why does a house cost more than a shoe? Is it just because the King stamped a higher number on it? No. Aristotle needs Demand to ground Money in reality. Money must track Demand, or the system fails.

  **The Synthesis:**
  *   **Demand** is the **substance** of value.
  *   **Money** is the **measure** of that substance.

  Think of it like **Temperature vs. A Thermometer**.
  *   **Heat energy** is the reality (like Demand). It is what actually exists in the air.
  *   **The thermometer** is the convention (like Money). We agree that "30 degrees" means a certain amount of heat.
  *   You could say, "Heat makes the air warm," and also say, "The thermometer measures the warmth." These aren't contradictions. One is the physical reality; the other is the tool we use to quantify it so we can make decisions (e.g., "It's hot enough to swim").

  ### 4. Resolving the "Commensurability" Passage
  In the second passage you quoted, Aristotle says: *"Money... makes goods commensurate."*

  This seems to contradict the idea that Demand is the unit. But look closely at the context of **Justice**. Aristotle is discussing *Reciprocal Justice*. For justice to occur, there must be equality.

  *   In **truth**, goods are made equal by Demand.
  *   In **practice** (and in the eyes of the law/city), goods are made equal by Money.

  Aristotle is acknowledging that while Demand is the *truth*, Money is the *social reality* that allows the city to function. We cannot litigate a contract based on "how much I needed the shoes." We litigate based on "what the price was." Money makes the abstract need legally and socially enforceable.

  ### Summary
  Aristotle distinguishes them to solve a specific philosophical problem: **How can different things be equal?**

  1.  **Demand** answers: They are equal because they satisfy equal human needs. (The Metaphysical Answer)
  2.  **Money** answers: They are equal because they are assigned the same numerical value by convention. (The Practical Answer)

  He needs **Demand** to prevent value from being arbitrary (money isn't magic). He needs **Money** to prevent exchange from being impossible (needs aren't measurable tokens). Together, they allow the *polis* to hold together through reciprocal exchange.
