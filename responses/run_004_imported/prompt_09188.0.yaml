          *   *Rationale:* Owners have equity at risk. Rules affect property value. Owners pay special assessments for repairs. It's a private corporation (HOA/Condo Assoc), not a government.
          *   *Legal Basis:* Contract law. The lease is a contract between tenant and landlord. The landlord represents the tenant's interests in the HOA.
      *   **Principle 2: Residency/Affected Interests (The User's View).**
          *   *Rationale:* "No taxation without representation." Rules affect daily life, quiet enjoyment, and community culture. Long-term renters have a stake in the *community*, not just the asset.
          *   *Ethical Basis:* Democratic legitimacy. Governance should reflect those governed.
      *   **Principle 3: The "Stakeholder" Hybrid.**
          *   *Rationale:* Distinguish between short-term transients (Airbnb) and long-term residents (renters). Both owners and long-term renters have stakes, but different kinds (financial vs. livability).

  4.  **Evaluate the "Arbitrariness" Question:**
