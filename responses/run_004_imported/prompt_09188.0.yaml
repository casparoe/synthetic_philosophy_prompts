answer: |-
  This is a classic conflict in political philosophy and property law, and you're right to feel that it's not just a petty disagreement. You and your friend are arguing from two different, well-established ethical frameworks. Neither is inherently "wrong," but they prioritize different values.

  To answer your specific question: **No, the line is not arbitrary, but it is a choice.** It is drawn based on specific legal and philosophical principles that can be debated.

  Here is a breakdown of the principled arguments on both sides, why the condo structure exists the way it does, and where the modern consensus is shifting.

  ### 1. The Property Rights Principle (Your Friend's View)
  Your friend is arguing from the standpoint of **contractual and property law**. In this framework, a condo association is not a government; it is essentially a private corporation where the "shares" are the units.

  *   **Financial Risk:** Owners bear the long-term financial risk. If the building deteriorates, or if rules make the building undesirable, the owner loses asset value. Renters can leave at the end of a lease; owners are stuck with the equity.
  *   **The Chain of Representation:** Legally, the system assumes a chain of representation. The renter negotiates with the landlord (owner), and the landlord represents that unit's interest in the HOA/Condo board. If a renter doesn't like the rules, the theory is they should negotiate with the landlord or move.
  *   **Voluntary Association:** By signing a lease, the renter voluntarily agrees to the current governing documents (CC&Rs). The friend's argument is that this is a consensual contract, not an imposition of tyranny.

  **The Weakness:** This principle breaks down when the "owner" is an absentee investor. If an investor wants to maximize profit via Airbnb, and a resident owner wants quiet, they have opposing interests. The renter is aligned with the *resident* owner on quality of life, but has no vote, while the *investor* owner has a vote but doesn't live there.

  ### 2. The Affected Interests Principle (Your View)
  You are arguing from the standpoint of **democratic theory**, specifically the "All-Affected Principle." This is the idea that anyone whose interests are significantly affected by a decision should have a say in making it.

  *   **Governance of Daily Life:** Noise rules, short-term rental limits, and amenity usage govern *human behavior*, not just property value. Since renters are the humans behaving, excluding them creates a "taxation without representation" scenario regarding their quality of life.
  *   **Community Stability:** Long-term renters contribute to community stability just as much as owners. Excluding them can create a two-tiered class system within the building, which can actually degrade the community culture the rules are trying to protect.
  *   **Power Imbalance:** If owners can vote to restrict short-term rentals, they might do so to protect property values. But if owners *are* the short-term landlords, they might vote to allow them, ruining the living environment for renters who have no recourse.

  **The Weakness:** If renters get voting rights, does that infringe on the owner's property rights? If a renter votes for a rule that lowers property values (e.g., allowing pets in a no-pet building) but the owner has to sell the unit later, the owner bears the cost of the renter's vote.

  ### 3. Is the Line Arbitrary?
  The line isn't random, but it is **contingent**. It depends on how the law defines the association.

  Currently, in most jurisdictions, condo law is written to protect **capital** (the asset) rather than **residency** (the home). This is a policy choice. It is not a law of nature.

  We see this line shift in other contexts:
  *   **School Boards:** In some places, only property owners can vote on school bonds. In most places now, all residents (including renters) can vote, because the interest (education) is viewed as a community good, not a property good.
  *   **Rent Control Boards:** Many cities now include tenant representatives on housing boards, acknowledging that tenants have a stake in housing policy.

  So, the line is drawn based on what the legislature decides is more important: the security of the investment or the rights of the resident.

  ### 4. The "Investor" Complication
  Your situation highlights a specific flaw in the "Owners Only" model: **The misalignment of interest.**

  In a building full of owner-occupiers, the "Property Rights" and "Affected Interests" principles overlap. The owner lives there, so they care about both property value *and* quiet enjoyment.

  In your building, those interests are split.
  *   **Absentee Investors:** Care about ROI. May vote *for* Airbnb.
  *   **Resident Owners:** Care about ROI + Quiet. May vote *against* Airbnb.
  *   **Renters:** Care about Quiet. Cannot vote.

  In this scenario, the "Property Rights" principle fails to protect the community because the property owners (investors) are not the ones experiencing the consequences of the rules. This is where your argument is strongest: **When ownership and residency separate, the democratic deficit becomes more apparent.**

  ### 5. Emerging Solutions (The Middle Ground)
  Because this tension is becoming more common as housing markets financialize, there are principled compromises emerging:

  *   **Renter Liaisons:** Some HOAs allow renters to elect a non-voting representative to attend board meetings and voice concerns.
  *   **Proxy Voting:** Some leases require the owner to grant the long-term tenant proxy power on specific lifestyle issues (noise, pets), while the owner retains vote on financial issues (assessments, reserves).
  *   **Legislative Change:** Some states/cities are passing laws that require a percentage of board members to be non-owner residents in buildings with high rental concentrations.

  ### Summary for Your Argument
  You can tell your friend that you aren't arguing against property rights; you are arguing about **which principle applies to which type of rule.**

  *   **Financial Rules (Assessments, Roof Repair):** The **Owner** should vote. They pay the bill.
  *   **Behavioral Rules (Noise, Airbnb, Amenities):** The **Resident** should have a say. They live with the consequence.

  The current system treats all votes the same, which is why it feels unjust. The line isn't arbitrary, but it is increasingly outdated for buildings that function as mixed communities rather than pure investment vehicles. You are advocating for a governance model that matches the reality of how the building is actually used, rather than just how the deed is written.
