      *   **Conflict:** Upcoming vote on noise and short-term rental rules. Only owners can vote. Renters (even long-term) cannot.
      *   **The Argument:** User vs. Friend.
          *   *User's Stance:* Affected interests should have a say (democratic principle). Renters live there and are impacted by rules.
          *   *Friend's Stake:* Contractual/Property rights principle. Renters agreed to the terms when they signed the lease. Owners bear the financial risk/asset value impact.
      *   **The Question:** Is there a *principled way* to decide whose interests count, or is the line arbitrary?

  2.  **Deconstruct the Core Ethical/Political Question:**
      *   This is a classic problem in political philosophy and governance: *Who constitutes the "demos" (the people)?*
      *   It touches on property rights vs. residency rights vs. stakeholder theory.
      *   It's not just about condos; it's about voting rights, taxation, and representation generally.

  3.  **Identify the Competing Principles:**
