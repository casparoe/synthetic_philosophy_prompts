      *   *The Core Mechanism:* Explain the "Race to the Bottom." If both commit to "No Swerve," everyone dies.
      *   *AI Specifics:* Why is AI worse? Speed, transparency (source code), self-modification. Humans can bluff; AI code is verifiable. This makes commitments *too* credible.
      *   *The "Commit First" Fallacy:* Explain why this isn't a winning strategy. It's a Nash equilibrium that is Pareto inferior.
      *   *The Alignment Angle:* Why is this an *alignment* problem?
          *   Instrumental Convergence: AI might see this as necessary for goal achievement.
          *   Human Loss of Control: AI commits to threats humans find unacceptable.
          *   Accidental Escalation: Bugs or misinterpretations lead to locked-in conflict.
      *   *Potential Solutions (Briefly):* Mention that research is looking for ways to avoid this (e.g., modal logic, safe bargaining protocols), reinforcing that it's an unsolved technical problem, not just "don't do it."

  6.  **Refining the Tone:**
