      *   *Is the distinction between "threat" and "commitment" clear?* In this context, they are similar. A commitment to a threat.
      *   *Mention "Updatelessness"?* This is a key concept in modern decision theory (UDT/TDT). If agents are updateless, they pre-commit to policies. If they pre-commit to incompatible policies, conflict is inevitable. This is crucial for the "AI safety" angle.

