answer: |-
  Two epistemologists, Alice and Bob, are trapped in a vault. The digital lock on the door displays a notoriously complex combinatorial problem. The door will only open if they input the solution.

  Alice turns to Bob and says, "Don't panic. We're ideally rational agents. According to the standard model, we already believe every logical consequence of the axioms required to solve that problem."

  Bob stares at the screen. "Great. So what's the combination?"

  Alice shrugs. "I don't know."

  Bob throws his hands up. "You just said we believe it! If we believe the axioms, and the combination is entailed by the axioms, then by closure under entailment, we believe the combination!"

  "We do," Alice insists. "But my beliefs are closed under entailment, while my working memory is closed under capacity constraints."

  "So you're saying you know the answer, but you can't access it?"

  "Exactly. In the model, derivation is instantaneous. In reality, it's NP-hard."

  Bob sighs and slides down the wall to sit on the floor. "So we're logically omniscient, but computationally bankrupt."

  Alice nods, sitting beside him. "Precisely. Theoretically, we're already free. We're just waiting for the grant money to compute the entailment."
