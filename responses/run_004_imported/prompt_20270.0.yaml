answer: |-
  This is a sharp question that cuts to the heart of how different decision theories handle acausal connections. You are right to suspect that the core intuition of Evidential Cooperation in Large Worlds (ECL) transfers to FDT/UDT, but the "Evidential" label is not *purely* a naming artifact. There are structural differences in how the theories justify the cooperation, and while their verdicts converge in the standard ECL setup, they can diverge in edge cases regarding *why* the correlation exists.

  Here is the breakdown of how EDT and FDT/UDT reason through ECL, where they agree, and where the "Evidential" framing actually matters.

  ### 1. The Setup
  Imagine a vast universe containing $N$ agents. You are one of them. You care about your own values, but you know there are agents elsewhere with different values. You have the option to **Cooperate** (respect their values at some cost to yours) or **Defect** (maximize your own values ignoring theirs).
  *   **Causal Link:** None. You cannot affect them physically.
  *   **Correlation:** There is a high probability that other agents are reasoning similarly to you.

  ### 2. How EDT Reasons (The Standard ECL Frame)
  EDT maximizes expected utility conditional on the action: $E[U | \text{Act}]$.

  *   **The Logic:** "If I choose to Cooperate, this is strong *evidence* that I am the type of agent who reasons cooperatively. Since there are many agents similar to me in the large world, my being a cooperative type is evidence that they are also cooperative types. Therefore, $P(\text{Others Cooperate} | \text{I Cooperate})$ is high."
  *   **The Mechanism:** Bayesian updating. Your act updates your credence about the state of the rest of the universe (specifically, the algorithms of other agents).
  *   **The Vulnerability:** EDT is susceptible to **spurious correlations**. If there is a common cause that makes you cooperate and makes them cooperate (e.g., a "cooperation gene" or a specific environmental trigger) but your *decision* doesn't logically determine theirs, EDT still cooperates. It "manages the news." In ECL, this is usually a feature, not a bug, but it relies heavily on how you define the reference class of "similar agents."

  ### 3. How FDT/UDT Reasons
  FDT/UDT maximizes expected utility of the *output of your decision algorithm*: $E[U | \text{Algorithm Output}]$.

  *   **The Logic:** "I am running decision algorithm $D$. Other agents in the large world are running $D$ (or a close approximation $D'$). The output of $D$ is logically linked to the output of $D'$. If I output 'Cooperate', then any agent running my algorithm must also output 'Cooperate' (subjunctive dependence). Therefore, my decision *logically determines* (or heavily constrains) theirs."
  *   **The Mechanism:** Subjunctive dependence / Logical correlation. It's not that your act provides evidence about theirs; it's that your act and their act are logical consequences of the same mathematical truth.
  *   **The Robustness:** FDT ignores spurious correlations that aren't logically mediated. If a "cooperation gene" makes us both cooperate, but my algorithm *would* have defected if the gene weren't there, FDT defects (because the algorithm's output isn't what's driving the correlation). FDT only cooperates if the correlation holds *because* of the reasoning process itself.

  ### 4. Do the Verdicts Diverge?

  In the **standard ECL scenario** (where the correlation arises specifically because agents are reasoning similarly about the same problem), **EDT and FDT converge.** Both will cooperate. The math looks effectively the same:
  *   **EDT:** $P(\text{Other C} | \text{My C}) \approx 1$
  *   **FDT:** $\text{Corr}(\text{My Output}, \text{Other Output}) \approx 1$

  However, they diverge in **edge cases** concerning the *source* of the correlation:

  #### A. The "Spurious Common Cause" Case
  Imagine the correlation between you and the other agents is caused by a third factor (e.g., a cosmic ray burst that induces cooperative feelings) rather than shared reasoning.
  *   **EDT:** Sees the statistical correlation. Conditions on Cooperating. Sees that Others likely Cooperate. **Verdict: Cooperate.**
  *   **FDT:** Analyzes the decision algorithm. Realizes that *if* the algorithm were to output Defect, the cosmic ray wouldn't change that (assuming the ray affects mood, not logic). The logical link is broken. **Verdict: Defect.**
  *   **Significance:** FDT is more conservative. It refuses to "buy" cooperation unless the link is logical. EDT is more optimistic but risks paying for correlations it can't secure.

  #### B. The "Reference Class" Problem
  *   **EDT:** Requires a prior probability distribution over how similar other agents are to you. If you aren't sure if they are "similar enough," EDT gets bogged down in reference class tennis. (e.g., "Am I similar to aliens who think in hex?")
  *   **FDT:** Frames similarity as **logical similarity**. "How close is their source code to mine?" This is still hard to formalize (logical uncertainty is tricky), but it is conceptually cleaner. FDT can theoretically cooperate with agents that are *structurally* similar even if they are superficially different, whereas EDT might miss the correlation if the surface-level evidence is weak.

  #### C. Updatelessness (Pre-commitment)
  *   **EDT:** Is updateful. It reasons from the current state. If you already know you are the type to cooperate, EDT might say "My act is no longer evidence, I've already updated." (Though sophisticated EDT avoids this).
  *   **UDT:** Is explicitly updateless. It chooses a policy *before* observing its specific situation. In ECL, UDT argues you should have pre-committed to a policy of "Cooperate with similar value systems" before you knew which value system you would hold. This avoids the "I'm already here, why should I care?" objection.

  ### 5. So, is "Evidential" just a naming artifact?

  Mostly, **yes**, but with two caveats.

  1.  **Historical/Pedagogical Context:** The ECL literature (Oesterheld, Conitzer, etc.) emerged largely to rehabilitate EDT. Causal Decision Theory (CDT) fails ECL completely (it says $P(\text{Other} | \text{Me}) = P(\text{Other})$). Showing that EDT succeeds was the primary philosophical contribution. Framing it as "Evidential Cooperation" highlights that *evidential* links are sufficient for cooperation, whereas *causal* links are not.
  2.  **The "Managing the News" Intuition:** ECL relies on the idea that by acting, you make it *more likely* (in your epistemic state) that good things happen elsewhere. This is the EDT intuition. FDT reframes this: by acting, you *make it the case* (in the logical space) that good things happen elsewhere.
      *   If you are an FDT agent, you wouldn't call it "Evidential Cooperation." You would call it **"Logical Cooperation in Large Worlds."**
      *   However, since FDT is a superset/generalization that handles the EDT cases correctly (in this context), the *phenomenon* described by ECL applies to FDT agents.

  ### Summary Verdict

  *   **Does the argument carry over?** Yes. An FDT/UDT agent should absolutely engage in ECL-style cooperation. In fact, FDT provides a more robust justification for it.
  *   **Do verdicts diverge?** Only in cases where the correlation is non-logical (spurious common causes). In the intended ECL scenarios (correlation via shared reasoning), they agree.
  *   **Why the name?** It distinguishes the mechanism from Causal Decision Theory. It signals that you don't need causal leverage to cooperate; you only need evidential (or logical) leverage.

  **Recommendation for your reading group:**
  You can safely tell them that ECL is **decision-theory agnostic regarding the verdict**, but **decision-theory specific regarding the justification.**
  *   If you are an **EDT** agent, you cooperate because your act is *news* that others are cooperating.
  *   If you are an **FDT** agent, you cooperate because your act is *logically linked* to others cooperating.

  The "Evidential" in the title is largely because the literature was busy fighting CDT at the time, and EDT was the simplest tool that worked. If Oesterheld were writing today with FDT as the baseline, the paper might well be titled "Subjunctive Cooperation in Large Worlds," but the math of the payoff would look nearly identical.

  **One final nuance:** FDT is actually *better* suited for ECL than EDT because ECL requires defining "similarity." EDT struggles with reference classes (statistical similarity). FDT struggles with logical similarity (code similarity), which is arguably the *correct* metric for acausal trade. So while the verdict is the same, FDT is the more natural home for the argument.
