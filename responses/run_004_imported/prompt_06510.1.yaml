  2.  **Analyze Kelly Criterion (The Baseline):**

      *   *Context:* Repeated, independent, favorable bets with reinvestment.
      *   *Goal:* Maximize long-run growth rate of wealth.
      *   *Math:* Maximizing $E[\log(W)]$ is equivalent to maximizing the geometric mean of wealth growth factors.
      *   *Justification:* Law of Large Numbers (LLN). Over $N \to \infty$, the realized growth converges to the expected log-growth. Bankruptcy is avoided (log goes to $-\infty$ at 0).
      *   *Samuelson's Critique:* Maximizing $E[\log(W)]$ is only optimal if your utility function *is* $\log(W)$. Just because the *median* outcome is better with Kelly doesn't mean the *expected utility* is better for a non-log utility agent. "Almost surely" doesn't matter if the rare disaster has infinite disutility or if you care about arithmetic expectation of utility.

  3.  **Analyze Geometric Rationality (The New Claim):**

      *   *Context:* General decision theory, including one-off choices and interpersonal aggregation (Nash Bargaining).
      *   *Goal:* Maximize geometric expectation of utility (or wealth).
      *   *Math:* $\left(\prod p_i^{u_i}\right)$ or similar formulations. Often linked to Nash Bargaining Solution (maximize product of gains).
      *   *Justification:* Time-averaging vs. Ensemble-averaging (Ergodicity Economics), scale invariance, consistency under independent parallel decisions, or axiomatic approaches to bargaining.
      *   *Key Proponents:* Ole Peters (Ergodicity), LessWrong authors (Scott Garrabrant, etc.).

