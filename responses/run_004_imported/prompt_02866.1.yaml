      *   *Premise 1:* The physical domain is causally closed (every physical event has a sufficient physical cause).
      *   *Premise 2:* Mental states (reasons) are distinct from physical states (neurons).
      *   *Premise 3:* Systematic overdetermination is implausible (the bullet/heart attack analogy).
      *   *Conclusion:* Mental states do not cause physical events.
      *   *Strength:* Logically valid if premises are accepted. Neuroscience supports causal closure.
