answer: |-
  As a novelist, you know that the most believable characters are rarely driven by a single, pure impulse. We trust the hero less when they act solely out of altruism than when they act out of a tangled knot of duty, fear, vanity, and love. Pure motives are the province of fable; mixed motives are the province of realism.

  You are asking if the action counts for less because the interiority doesn't match the exterior performance. From the perspective of the recipient (your mother), the answer is no. Pain managed, dignity preserved, loneliness mitigated—these are consequentialist realities. Your mother's nervous system does not register the genealogy of your kindness. It only registers the kindness.

  However, you are not asking about her nervous system. You are asking about your moral ledger. And here, the novelist in you might be trapping the human in you. You are trying to write a character arc where the motivation must justify the action, but life often operates on a different draft logic.

  Consider the label that is bothering you: "the good one." That phrase is a simplification. It is a narrative shortcut your family is using to make sense of a difficult situation. By accepting it, you feel like an impostor because you know the subtext they are missing. But is the feeling that your actions "count for less" actually guilt? Or is it grief?

  It may be grief for the relationship you didn't have. If you were doing this out of love, the care would be a final communion, a chance to heal the thirty-year rift. By admitting you are doing it for your own legacy, you are admitting that the rift remains unhealed to the end. The "sitting wrong" sensation might not be moral failure; it might be the ache of acknowledging that you will not get to be the loving child, even now. You are only getting to be the responsible one.

  Furthermore, you are discounting the motive of "not wanting to be remembered as the one who wasn't there." You frame this as vanity, but it is also a form of integrity. It is a commitment to a standard of conduct that transcends your immediate feelings. You are teaching your children that duty is not contingent on affection. That is not a small thing. In fact, in a world that prioritizes authenticity above all else, doing the hard thing *without* the emotional reward is perhaps a more robust form of ethics than doing it because it feels good.

  Your brother's lack of trouble is its own narrative, one you cannot write for him. Avoidance is a coping mechanism; your hyper-presence is yours. Neither is inherently "true" and the other "false." But by labeling yourself "the good one" based on his contrast, you set yourself up for a fall. You are performing a role that requires emotional fuel you do not possess.

  So, to your specific question: Does it count for less?

  In the economy of human relationships, motive matters. It changes the texture of the interaction. But in the economy of care, reliability is the only currency that spends. You are providing reliability.

  The discomfort you feel is not necessarily a sign that you are doing something wrong. It is a sign that you are paying attention. A person who was truly manipulative or purely selfish wouldn't lose sleep over the purity of their motives. The fact that you are interrogating this suggests that while you may not be acting out of love for your mother, you are acting out of a respect for the truth of who you want to be for your children.

  If this were a novel, I would tell you that this contradiction is what makes the character compelling. In life, I suggest you allow the contradiction to stand. You don't need to resolve the theme in the final chapter. You just need to turn the page. The care is excellent. You are there. That has to be enough, even if the "why" is messy. Goodness, often, is just showing up when every other part of you wants to stay home.
