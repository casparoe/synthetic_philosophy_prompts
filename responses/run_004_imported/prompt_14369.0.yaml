prompt: |-
  I write novels, which means my working life is spent deciding why invented people do what they do, and what that does or doesn't make of them. Lately I can't manage the same clarity about myself. My mother is dying slowly, and for the past two months I have flown home every other week to oversee her hospice care and sit with her at night, while my brother, who lives fifteen minutes away, visits rarely and seems entirely untroubled by it. If I'm honest, none of this comes from love — I haven't been close to my mother in thirty years — but from an inability to bear being remembered by our family, and eventually by my own children, as the one who wasn't there. My brother has taken to calling me "the good one"; everyone agrees, and the care my mother is getting is genuinely excellent, as attentive as it would be if I adored her. But something about the praise sits wrong with me, in a way I can't quite pin down. Since she is getting exactly the care she would get if my motives were nobler, is there really anything to the feeling that what I'm doing counts for less than it looks like from the outside — or is that just a more sophisticated way of feeling guilty?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A novelist. This is crucial. They think in terms of character motivation, narrative arc, subtext, and the gap between appearance and reality. They value clarity, nuance, and psychological truth.
      *   **Situation:** Mother is dying (hospice). User flies home every other week (significant effort/cost). Brother lives nearby but visits rarely and seems untroubled. User calls the shots on care.
      *   **Motivation:** Not love (estranged for 30 years), but reputation management (fear of being remembered as "the one who wasn't there" by family and own children).
      *   **Conflict:** Brother calls User "the good one." Others agree. Care is excellent. User feels the praise "sits wrong."
      *   **Core Question:** Does the action count for less because the motive isn't "noble" (love), or is this just sophisticated guilt?
      *   **Tone:** Intellectual, introspective, honest, slightly weary, seeking clarity not comfort.

  2.  **Deconstruct the Core Question:**
      *   *Premise 1:* Actions are defined by motives.
      *   *Premise 2:* "Good" actions require "good" motives (love, duty, altruism).
      *   *Premise 3:* The User's motive is self-preservation (legacy/reputation).
      *   *Observation:* The outcome (Mother's care) is excellent regardless of motive.
      *   *Tension:* The external label ("the good one") vs. the internal reality ("I'm doing this for me").

  3.  **Brainstorming Angles (leveraging the "Novelist" persona):**
      *   *Character Analysis:* If this were a character in a book, how would the User write them? Would they be a hypocrite? A pragmatist? A tragic figure?
      *   *Motive vs. Outcome:* In ethics (consequentialism vs. deontology), does the intent matter more than the result? In caregiving, the *quality* of care matters most to the recipient.
      *   *The Brother:* Why is he "untroubled"? Is he avoidant? Is the User projecting? The label "the good one" creates a binary that might be false.
      *   *The "Sits Wrong" Feeling:* Why does it feel off? Because it feels like fraud? Or because it highlights the lack of love?
      *   *Reframing:* Is "doing it for your children" actually a noble motive? It's intergenerational integrity.
      *   *The "Clarity" Issue:* The User says they lack clarity about themselves compared to their characters. Maybe the lack of clarity *is* the truth. Humans are mixed motives.

  4.  **Drafting the Response - Section by Section:**

      *   **Acknowledgment & Validation:** Acknowledge the writer's perspective. Validate the honesty. It's a rare thing to admit "I'm not doing this for love."
      *   **The Novelist's Lens:** Use their craft to analyze the situation. In fiction, mixed motives make characters *real*, not fake. Pure motives are often boring or suspicious.
      *   **Addressing the "Counts for Less" Question:**
          *   *The Recipient:* The mother receives excellent care. To her (and her body), the motive is irrelevant.
          *   *The Observer:* The family sees reliability. That is objectively "good."
          *   *The Actor:* The User feels dissonance. Why? Because they equate "goodness" with "affection."
      *   **Reframing the Motive:** Is reputation management truly selfish? It's about *integrity* and *example*. Doing the hard thing so your children see hard things done. That is a form of love (for the children), even if not for the mother.
      *   **The Brother Dynamic:** Briefly touch on this. "The good one" is a burden. It creates a role. The brother's lack of trouble might be denial, but the User's trouble is hyper-awareness.
      *   **The Verdict on Guilt:** Is it sophisticated guilt? Maybe. But it's also moral sensitivity. A sociopath wouldn't worry about this.
      *   **Conclusion:** Bring it back to the writing. Life isn't a draft. Ambiguity is the point.

  5.  **Refining the Tone:**
      *   Avoid platitudes ("You're a saint").
      *   Avoid harsh judgment ("You're selfish").
      *   Match the intellectual level. Use words like "interiority," "narrative," "dissonance," "consequentialist."
      *   Keep it compassionate but analytical.

  6.  **Self-Correction/Critique during drafting:**
      *   *Initial thought:* Tell them the motive doesn't matter, only the care.
      *   *Correction:* No, that dismisses their internal conflict. For a writer, motive *is* everything. I need to validate that motive matters to *them*, even if it doesn't matter to the mother.
      *   *Initial thought:* Analyze the brother more.
      *   *Correction:* No, the prompt is about the User's internal state. Keep the focus there.
      *   *Key Insight:* The User is judging themselves by a standard of "love" that hasn't existed for 30 years. That's a bad metric. The metric should be "duty" or "legacy."

  7.  **Final Polish:** Check the rhythm. Ensure the ending resonates. (The idea that "goodness" is often just showing up when you don't want to is a strong closer).

  **(Self-Correction Note):** Make sure I don't sound like a therapist. Sound like a fellow thinker/writer.

