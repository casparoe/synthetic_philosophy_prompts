          *   *Miller/Tichý Result:* If $A$ and $B$ are both false, it is *impossible* for $A$ to have more truth content and less falsity content than $B$. Either they are identical in content, or the comparison fails. Specifically, if $A$ has more truth content than $B$, it *must* also have more falsity content.
