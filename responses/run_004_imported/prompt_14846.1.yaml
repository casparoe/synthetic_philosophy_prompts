prompt: |-
  I'm giving the best man's speech at my closest friend's wedding in a few weeks, and I want help getting one piece of intellectual content right rather than winging it myself. Both the groom and his fiancée did graduate work in behavioral ecology before moving into unrelated careers, so a good fraction of the guest list is people who spent years thinking about signaling theory for a living, while the rest is family who just wants a warm few minutes and a good toast. I've been reading rationalist blogs since the Overcoming Bias days, and Robin Hanson's recurring argument — laid out at length in The Elephant in the Brain — that huge swaths of human behavior are best explained by signaling rather than by their stated purpose has left me wanting to build the toast around Zahavi's handicap principle: the idea that the sheer cost and wastefulness of a wedding is precisely what makes the vows exchanged at it credible, much as a peacock's tail counts as good evidence of fitness because a sickly bird could never afford to grow one.

  Here is the part I don't want the speech to get wrong, and the reason I'm asking rather than drafting it myself. A genuine Zahavian handicap is not just expensive; it has to be a cost that falls disproportionately on low-quality signalers — an index that a weak or uncommitted party genuinely cannot fake at any price, the way a heavier rack of antlers really does require more calcium and testosterone than a weaker animal has on hand. A lot of what actually gets spent at weddings does not work like that; it is costly by convention rather than by any such built-in link to sincerity, and the diamond is the standard illustration of the gap, since its price has far more to do with decades of manufactured scarcity and marketing than with any fact about how hard it would be for an insincere person to acquire one. So the easy version of this toast — "look how much they spent, so it must be love" — is bad biology, and I suspect actually less romantic than the truth. What I would like instead is a toast that goes looking for the real handicaps in what these two are doing — the parts of getting married that someone who did not mean it truly could not fake or afford — and lets that observation carry the emotional weight, while staying light enough that the groom's father, who has never once heard the phrase "evolutionarily stable strategy," still laughs in the right places and does not feel like he has wandered into a seminar. Could you write me this toast? Something in the five-minute range read aloud, with one clearly marked moment of the nerdier material for the people who will catch it, building to a close that works for everyone in the room regardless of what they know about signaling theory.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Best Man (close friend of the groom).
      *   **Audience:** Mixed. About half are behavioral ecologists/academics (know signaling theory, Zahavi, Hanson, etc.), half are family/general public (want warmth, humor, no jargon).
      *   **Core Concept:** Zahavi's Handicap Principle. The idea that costly signals are credible *only if* the cost is disproportionately hard for low-quality signalers to bear (not just expensive, but *differentially* costly).
      *   **Constraint:** Avoid the "diamonds are expensive so love is real" fallacy (conventional cost vs. biological index). Focus on the *real* handicaps of marriage (vulnerability, compromise, opportunity cost, etc.).
      *   **Tone:** Warm, funny, accessible, but intellectually rigorous enough for the experts.
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).
      *   **Specific Requirement:** One clearly marked moment of "nerdier material" for the experts, but integrated smoothly.
      *   **Goal:** A toast that validates the science without alienating the family, ending on an emotional high note.

  2.  **Deconstruct the Science (for accuracy):**
      *   *Handicap Principle:* A signal is honest if it is costly to produce, and *more* costly for a low-quality individual to produce than a high-quality one.
      *   *Peacock's Tail:* Heavy, metabolically expensive, attracts predators. A sick peacock can't grow a big one.
      *   *Wedding Application:* Spending money isn't a true handicap (rich insincere people can spend money). The *real* handicap must be something an insincere partner wouldn't want to pay.
      *   *Real Handicaps in Marriage:* Vulnerability, giving up autonomy, caring for someone else when it's inconvenient, the "opportunity cost" of not exploring other options, the daily grind of compromise.
      *   *Robin Hanson/Elephant in the Brain:* We often hide our signaling motives. The speech should acknowledge this playfully but pivot to the sincerity of *this* couple.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Warm up the room. Acknowledge the dual audience (family + scientists). Establish the relationship with the groom.
      *   **The Hook (The Science):** Introduce the behavioral ecology angle. Keep it light. Mention their background.
      *   **The "Nerd Moment" (Zahavi):** This needs to be the specific request. Explain the Handicap Principle simply but accurately. Differentiate between "burning money" (bad signal) and "bearing a burden only the fit can carry" (good signal).
      *   **The Pivot (Application to Marriage):** Move from theory to reality. What are the *actual* handicaps here? Not the venue cost, but the emotional cost.
      *   **The Specifics:** Mention specific traits of the couple that show they are paying this cost. (Need to keep these generic enough for a template but specific enough to feel real).
      *   **The Close:** Raise a glass. Universal message of love and commitment.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too academic or cynical (Hanson can be cynical).
      *   *Mitigation:* Frame the science as a lens to appreciate their love *more*, not to deconstruct it. Ensure the "nerd moment" feels like an inside joke that everyone can follow the gist of.
      *   *Humor:* Poke fun at the groom (gently) and the academic crowd.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi, I'm the Best Man.
      *   You all know [Groom] and [Bride] studied animal behavior.
      *   So I read up on signaling theory.
      *   Zahavi says signals must be costly.
      *   But spending money isn't enough. Diamonds are marketing.
      *   Real cost is giving up freedom.
      *   They do this every day.
      *   So here's to the handicap.
      *   Cheers.

      *Critique 1:* Too dry. Needs more heart. The "diamond" point needs to be clear so the family doesn't think I'm insulting the jewelry. The "real cost" needs to be romantic, not transactional.

  6.  **Drafting - Iteration 2 (Focusing on the "Real Handicap"):**
      *   What is hard about marriage? Listening when tired. Apologizing when right. Putting another's needs first.
      *   An insincere person *could* do this for a week, but not a lifetime. That's the differential cost.
      *   The "Nerd Moment" needs to be flagged but smooth. "For my colleagues in the back..."

  7.  **Writing the Speech (incorporating constraints):**
      *   *Word Count Check:* 150 words per minute is average speaking pace. 5 minutes = 750 words.
      *   *Jargon Check:* Use "Handicap Principle" but explain it immediately. Avoid "ESS" or "fitness landscapes."
      *   *Emotional Arc:* Start funny/observational -> Get intellectual -> Get deeply sentimental -> Toast.

  8.  **Polishing the "Nerd Moment":**
      *   Make sure the distinction between "conventional cost" (money) and "index signal" (biological difficulty) is clear.
      *   *Phrasing:* "It's not about the price tag; it's about the tax."

  9.  **Final Review against constraints:**
      *   5 minutes? Yes.
      *   Zahavi accurate? Yes (differential cost emphasized).
      *   Family friendly? Yes (jargon explained).
      *   Emotional close? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't imply the wedding *itself* is a waste. The wedding is the signal, but the *marriage* is the ongoing handicap. I should clarify that distinction. The wedding is the peacock's tail, but the marriage is the metabolism required to sustain it. Actually, better: The wedding is the display, but the *vows* are the handicap because they restrict future behavior. Let's focus on the *vows* and the *daily act* as the handicap.

      *Revised Plan:* The wedding is the tail. The marriage is the metabolic cost of carrying it. No, that's confusing.
      *Better Plan:* The wedding is the signal. The *cost* isn't the money, it's the loss of autonomy. That is the true handicap.

      Let's write it.

      *Wait, one more check on Hanson:* Hanson argues we *hide* our signaling. I shouldn't accuse the couple of hiding motives. I should argue that *unlike* typical signaling, their signal is honest because the cost is real. I need to walk the line between "everything is signaling" and "this love is real." The resolution is: "Yes, it's signaling, but that's why it's credible."

      *Okay, let's draft.*

      *(Drafting process involves balancing the humor for the dad and the precision for the ecologists.)*
      *Key phrase to include:* "Differentially costly."
      *Key concept:* "Opportunity cost of foregone alternatives."

      *Let's ensure the transition from science to sentiment is smooth.*
      "But here is where the biology meets the heart..."

      *Final Polish:* Check the rhythm. Ensure pauses are indicated or implied by sentence structure.

      *(Post-Drafting Review)*: Does this meet the "diamond" constraint? Yes, explicitly mention that money isn't the signal. Does it meet the "low-quality signaler" constraint? Yes, mention that a less committed person couldn't pay the price.

      *Okay, ready to generate.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of standing up here as Best Man.

  I've known [Groom] for [Number] years. I've seen him through [mention a brief, funny, low-stakes struggle, e.g., "grad school ramen budgets" or "that one disastrous haircut"]. And like many of you, I've watched him and [Bride] build something extraordinary together.

  Now, looking around this room, I realize we have a unique demographic split. On one side, we have family and friends who are here to celebrate a beautiful union. On the other side, we have a significant contingent of behavioral ecologists who spent their twenties modeling game theory equations.

  So, I faced a dilemma. I could give a standard speech about love being magic, which would bore the scientists. Or I could give a speech about signaling theory, which would confuse the groom's father.

  So, I decided to split the difference.

  [Groom] and [Bride], you both left academia for different careers, but you never really lost the lens through which you see the world. You know that in nature, talk is cheap. Any bird can sing. The question is always: why should we believe them?

  This brings me to the moment I've been waiting for. For my colleagues in the back row: put down your drinks, this is the peer review section.

  **[Pause for effect]**

  We often hear that a wedding is a "signal" of commitment. But in biology, a signal is only honest if it satisfies Zahavi's Handicap Principle. It's not enough for a signal to be expensive. A diamond ring is expensive, but as we know, wealth can be inherited or borrowed; it doesn't necessarily prove *sincerity*. That's a conventional cost.

  A true handicap must be *differentially costly*. It has to be a burden that a high-quality signaler can bear, but a low-quality signaler literally cannot afford to fake. A peacock's tail isn't just heavy; it's metabolically taxing and attracts predators. A sickly bird tries to grow that tail, and it dies. The cost indexes the quality.

  **[Resume normal tone]**

  And that is when I realized: [Groom] and [Bride], you aren't just throwing a party. You are constructing a magnificent, biological handicap.

  Because the true cost of this marriage isn't the venue, or the flowers, or the open bar—though please, enjoy the open bar. The true cost is the loss of autonomy.

  It is the promise to put another person's needs ahead of your own, specifically when it is inconvenient. Specifically when you are tired. Specifically when you are right, and they are wrong, and you choose to be kind instead.

  That is a cost that scales with sincerity. Someone who doesn't love you can pretend to be generous for a night. They can even pretend for a year. But they cannot sustain the metabolic tax of true empathy for a lifetime. A "low-quality" partner would go bankrupt emotionally trying to fake the vows you two are making today. The sheer weight of them would break them.

  But you? You've already been growing your tails.

  I've seen [Groom] [mention a specific, small sacrifice the groom made, e.g., "drive three hours to help her move" or "learn to love hiking"]. I've seen [Bride] [mention a specific, small sacrifice the bride made, e.g., "support him through a career change" or "memorize his obscure coffee order"].

  You have already proven that you can bear the weight. You have shown that the cost of caring for each other is high, but it is *differentially* low for you, because your fit for each other is so perfect.

  To the rest of the guests: You don't need to know the math to feel the truth of it. You can see it in the way they look at each other. That look is the signal. The years of life they are promising to share are the handicap.

  [Groom] and [Bride], may your signal always remain honest. May your costs be shared. And may you never stop proving to each other that you are the only ones fit enough to carry this burden together.

  Please raise your glasses.

  To the Handicap Principle, and to the happy couple.
