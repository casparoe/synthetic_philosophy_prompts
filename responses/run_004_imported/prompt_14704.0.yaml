prompt: |-
  My cousin Priya is getting married in a few weeks and asked me to do the toast, and last night my friend Dev and I ended up spending two hours arguing about it instead of actually helping me write anything (thanks, Dev). Here's the wrinkle: her side of the family is pretty devoutly Pentacostal, her dad's basically a lay minister, and her fiancé Sam's family are all committed secular humanists, a couple of the internet-atheist variety. I said I just wanted something warm that didn't step on anyone's toes, and Dev, who's doing a political theory PhD, said that's basically the exact problem Rawls spent decades on. He was quick to point out that technically Rawls restricted all that "public reason" stuff to constitutional essentials and matters of basic justice, argued out by judges and legislators in the "public political forum" -- a wedding toast is just "background culture," so none of it strictly applies. But then he said the fun version of the exercise is to pretend it DOES apply anyway: write something that doesn't quietly smuggle in one side's comprehensive doctrine (Pentecostal Christianity, secular humanism, whatever) as the actual reason the marriage is good, while still being allowed, per "the proviso" from his later stuff, to gesture at religious or secular language as long as its not doing the load-bearing justificatory work.

  I think Dev would be a nightmare as an actual wedding consultant, but now I can't drop it either. Can you write me the real toast -- about 3-4 minutes read out loud, genuinely warm and a little funny, with specific-feeling (invented is fine) details about Priya and Sam -- but built the way Dev described? It should feel, to every single person in that room, like it's actually about their marriage and not a diplomatic non-statement. It can absolutely reference what faith means in her family and what a secular life well-lived means in his, but the actual case the toast makes for "this marriage is good" can't quietly rest on either comprehensive doctrine alone. Please don't give me the bland "love is love, and we should all respect each other's beliefs" toast -- that's precisely the cop-out Dev was mocking in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Task:** Write a wedding toast for the user's cousin, Priya.
      *   **Context:** Priya (Pentecostal family, dad is a lay minister) marrying Sam (Secular Humanist/Internet Atheist family).
      *   **Constraint 1 (The "Dev" Constraint):** Apply John Rawls' idea of "Public Reason" to a wedding toast (which Rawls would say is "background culture," but we're pretending it applies).
      *   **Constraint 2 (The Core Challenge):** The argument for *why this marriage is good* cannot rest solely on Pentecostal doctrine OR Secular Humanist doctrine. It must find an "overlapping consensus" (to use Rawlsian terms) without being bland ("love is love").
      *   **Constraint 3 (Tone):** Warm, funny, specific (invented details okay), 3-4 minutes spoken (approx. 450-600 words).
      *   **Constraint 4 (The Proviso):** Can reference religious or secular language, but it can't be the *load-bearing* justification. It has to be translatable.
      *   **Goal:** Make every guest feel seen, not like they're listening to a diplomatic non-statement.

  2.  **Deconstruct the Philosophical Challenge (Rawls at a Wedding):**
      *   *Problem:* If I say "God blessed this union," Sam's family checks out. If I say "Their rational contract maximizes utility," Priya's dad checks out.
      *   *Solution:* Find values inherent in *both* worldviews that converge on the practice of marriage itself.
      *   *Potential Overlapping Values:* Commitment, service to others, forgiveness, building a home, witness/testimony, reason/logic in decision making, hope for the future, community support.
      *   *The "Load-Bearing" Justification:* The marriage is good because it creates a space where two different ways of seeing the world make each other *better* at being human, grounded in shared action rather than shared metaphysics. It's about the *work* of marriage, which looks similar from both pews and podiums.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the tension lightly (meta-commentary on the "Dev" argument) to disarm the room. Establish the speaker's role.
      *   **The Couple (Specifics):** Need invented details that highlight their differences but show compatibility.
          *   *Priya:* Maybe something about her community service or faith in action. Let's say she organizes food drives or sings in the choir. Let's go with choir/faith in action.
          *   *Sam:* Maybe something about logic, engineering, or skeptical inquiry. Let's make him an architect or data analyst who loves structure. Let's go with Data/Logic but applied to good ends.
          *   *The Intersection:* How they handle conflict or decision making.
      *   **The "Rawlsian" Core (The Justification):** Why is this union good? Not because God said so, and not because it's rationally optimal. But because it represents a *covenant of translation*. They speak different languages but agree on the meaning.
      *   **The "Proviso" in Action:** Use religious language (blessing, grace) and secular language (reason, evidence) but ground them in *observable behavior*.
      *   **Closing:** A call to action for the guests (the "public"). Raise a glass.

      *   *Self-Correction on Tone:* Avoid being too academic. Dev is the PhD, not the speaker. The speech needs to sound like a cousin, not a lecture. The philosophy must be invisible infrastructure, not the facade.

  4.  **Developing the Narrative Arc:**
      *   *Hook:* The difficulty of writing the speech (nod to Dev).
      *   *Observation:* Priya's faith (visible action) + Sam's skepticism (visible care).
      *   *The Pivot:* How they interact. When Priya prays, Sam holds space. When Sam analyzes, Priya listens.
      *   *The Universal Truth:* Marriage isn't about agreeing on *why* the world works, but agreeing on *how to be* in it together.
      *   *The Toast:* To the work, the witness, and the future.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. Dev helped me write this. He said Rawls. Anyway, Priya is religious. Sam is not. But they love each other. Priya prays for people. Sam fixes things for people. Both are good. So their marriage is good. Let's drink.
      *Critique:* Too bland. Violates the "no cop-out" rule. Needs more warmth and specific texture.

  6.  **Drafting - Attempt 2 (Incorporating the "Overlapping Consensus"):**
      Focus on the concept of "Witness." In Pentecostalism, you witness to the truth. In Secular Humanism, you bear witness to evidence/reality. Both require showing up.
      Focus on "Grace" vs. "Forgiveness." Grace is unmerited favor. Forgiveness is a rational choice to release debt. They look the same in practice.
      Let's weave these together.

  7.  **Refining the Voice:**
      *   Needs to sound spoken. Contractions. Pauses.
      *   Needs to honor the Dad (Lay Minister) without preaching.
      *   Needs to honor Sam's family without mocking their atheism.
      *   *Key Phrase:* "The architecture of care." (Bridges Sam's logic and Priya's service).

  8.  **Final Polish (checking constraints):**
      *   *Time:* ~500-600 words.
      *   *Rawls Check:* Does the justification rely *only* on God? No. *Only* on Reason? No. It relies on the *shared practice* of commitment.
      *   *Warmth:* Add a joke about Dev. Add a sweet moment about Priya/Sam.

      *(Self-Correction during drafting)*: Make sure I don't explicitly name-drop Rawls in the speech. That would be insufferable. The *user* knows the constraint, the *audience* should just feel the effect. Wait, the prompt says "Can you write me the real toast... built the way Dev described?" It implies the speech itself shouldn't necessarily be *about* Rawls, but structured by those rules. Actually, mentioning Dev is fine as an intro hook, but the speech itself should stand on its own. I will keep the Rawls theory invisible in the text, visible only in the structure.

      *Wait, one nuance:* The prompt says "write something that doesn't quietly smuggle in one side's comprehensive doctrine... as the actual reason the marriage is good."
      Okay, so the *reason* the marriage is good must be neutral ground.
      Reason: They make each other more accountable/loving/human.
      Language: Can use "blessing" if it means "support," can use "reason" if it means "care."

      *Let's write.*

      *Opening:* Acknowledge the family divide gently.
      *Middle:* Story about how they handle a crisis. Shows faith *and* reason working together.
      *End:* The toast to the "overlap."

      *Specific Details:*
      Priya: Sunday school teacher, vibrant, prays before meals.
      Sam: Checks tire pressure, reads the manual, skeptical but kind.
      Shared: How they treat the waiter, how they handle being wrong.

      *The "Load-Bearing" argument:* The marriage is good because it is a school for humility. Both faith and reason require humility.

      *Let's go.*

  9.  **Final Review against constraints:**
      *   3-4 mins? (approx 500 words).
      *   Warm/Funny? Yes.
      *   No "Love is Love" blandness? Yes.
      *   Rawlsian structure (Overlapping Consensus)? Yes.
      *   Proviso respected (Religious/Secular language used but not exclusive)? Yes.

      *(Final thought)*: Ensure the ending lands emotionally. The "Amen" and the "Hear Hear" moment.

      *Wait, I need to make sure I don't accidentally make it sound like I'm explaining Rawls.* The speech must be a *toast*, not a lecture about the toast. The philosophy is the skeleton, not the skin.

      *Okay, ready to draft.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Priya's cousin.

  I'll be honest: writing this speech was a process. Last night, my friend Dev—a political theory PhD who worries about everything—told me that writing a toast for this specific room is basically impossible. He said Priya's family sees marriage as a covenant before God, and Sam's family sees it as a voluntary association of rational agents. He told me I had to find a reason to celebrate this union that didn't rely on theology *or* ideology alone.

  I told him to hush and have some punch. But he got me thinking. Because looking at Priya and Sam, I don't see a conflict of doctrines. I see a partnership of practices.

  We all know Priya. She's the person who will stop the car to move a spider off the windshield. Her faith isn't just something she says on Sundays; it's a posture of radical openness. She believes in things she can't see: grace, mercy, the idea that people can change.

  And we know Sam. Sam is the person who reads the manual before assembling the IKEA table. His secularism isn't cynicism; it's a commitment to evidence and accountability. He believes in things he can verify: reliability, consistency, the idea that actions have consequences.

  On paper, that sounds like a stalemate. But in practice, it's the engine of their relationship.

  I remember a few months ago, when Priya was stressed about a decision at work. Priya's instinct was to pray for guidance and trust the path. Sam's instinct was to make a pro-and-con list and analyze the risk. In a lesser relationship, one would have won. Instead, they did both. Priya found the courage to take the leap, and Sam made sure the safety net was tied down.

  They don't agree on the metaphysics of *why* the world works. But they agree completely on *how* to be in it.

  They agree that forgiveness is necessary, whether you call it "grace" or "emotional hygiene." They agree that service is mandatory, whether you call it "ministry" or "civic duty." They agree that a promise made is a debt incurred, sacred to the believer and binding to the skeptic.

  That is the miracle standing in front of us. It is easy to build a life with someone who mirrors your own worldview. It is much harder, and much braver, to build a life with someone who challenges you to translate your deepest values into a language they can speak, and to listen when they speak theirs.

  Priya and Sam have built a home where the religious and the secular don't just tolerate each other; they sharpen each other. Priya reminds Sam that not everything that matters can be measured. Sam reminds Priya that faith without works is incomplete.

  So, if I may propose a toast.

  To Priya and Sam. May your life together be a testament to the things we can all agree on: that kindness is a duty, that humility is a strength, and that love is a verb we conjugate every day.

  To the bride and groom. Amen, and hear hear.
