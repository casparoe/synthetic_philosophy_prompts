          *   *Parameter Independence:* Pressing Red on A shouldn't change the *probability* of Cola on B.
          *   *Outcome Independence:* Getting Cola on A shouldn't change the *probability* of Cola on B (given the internal state).
          *   *QM Situation:* The machines are wired together internally (non-separable). If A gets Cola, B *must* get Lemon, but pressing the button on A doesn't *force* B's machine to change its wiring.
      *   *Even Better (Intuitive):* **The Married Couple Survey.**
