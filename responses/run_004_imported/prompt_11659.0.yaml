      *   **Jarrett's Decomposition (1984):**
          1.  **Parameter Independence (PI):** $P(A | a, b, \lambda) = P(A | a, \lambda)$. (Alice's outcome doesn't depend on Bob's *setting*).
          2.  **Outcome Independence (OI):** $P(A | B, a, b, \lambda) = P(A | a, b, \lambda)$. (Alice's outcome doesn't depend on Bob's *outcome*).
      *   **Signaling:** If PI is violated, Alice can change her setting $a$ and affect Bob's statistics instantly. This violates Special Relativity (no superluminal signaling).
      *   **Quantum Mechanics:** QM violates Bell's inequality. It turns out QM violates OI but *obeys* PI (on average). This is why there's no signaling.
      *   **"Nonlocality" vs. "Non-separability":** If OI is violated but PI holds, the systems aren't influencing each other *causally* across space (no signal), but they aren't distinct, separate entities either. They are one holistic system. Hence "non-separable."

  3.  **Develop an Analogy (The Core Challenge):**
