  7.  **Final Review against constraints:** High school math level. No heavy proofs. Focus on intuition. Address IIA vs. Manipulability specifically. Address Dictator specifically.

  *(Self-Correction)*: Wait, I need to be careful about the IIA/Strategy-proof link. Strategy-proofness doesn't *imply* IIA directly in all contexts, but for Social Choice Functions that are onto, Strategy-proofness implies Monotonicity, and Monotonicity + Onto implies Dictatorship (Muller-Satterthwaite). Arrow's theorem uses IIA + Pareto + UD to get Dictatorship. The bridge is that Strategy-Proofness is a very strong condition that forces the mechanism to behave *as if* it satisfies IIA. I will explain it as: "To prevent manipulation, the rule must be so rigid that it effectively ignores 'irrelevant' changes in preferences, which is the spirit of IIA."

