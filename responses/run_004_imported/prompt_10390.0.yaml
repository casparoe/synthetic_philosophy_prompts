          *   If a rule is Monotonic and Surjective, it essentially satisfies IIA.
          *   *Analogy:* IIA says "The system ignores irrelevant info." Strategy-proofness says "You can't trick the system using irrelevant info." If the system *could* be tricked, it means the system *was* listening to that info. Therefore, Strategy-proofness implies a form of IIA.

