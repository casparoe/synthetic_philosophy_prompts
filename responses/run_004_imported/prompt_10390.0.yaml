          *   The mathematical bridge: A strategy-proof social choice function induces a social welfare function that satisfies Arrow's conditions. Conversely, violating Arrow usually opens the door for manipulation.
          *   *Key Insight:* Strategy-proofness is a *stronger* condition than IIA in some contexts, or rather, Strategy-proofness + Surjectivity $\implies$ IIA-like properties.
          *   *Proof Sketch (Muller-Satterthwaite):* This is the rigorous link. Monotonicity is the bridge.

