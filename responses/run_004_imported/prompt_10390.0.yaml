          *   So yes, formally the same entity.

      *   *The "Derivation" aspect:*
          *   It is true that you can prove GST using Arrow (via the Muller-Satterthwaite theorem).
          *   It is also true you can prove Arrow using GST (with some work).
          *   So they are logically equivalent in the context of voting.

  5.  **Final Polish:**
      *   Check for jargon. Explain "Surjectivity" (onto) simply (every candidate *can* win).
      *   Ensure the distinction between Social Choice Function (GST) and Social Welfare Function (Arrow) is clear.
