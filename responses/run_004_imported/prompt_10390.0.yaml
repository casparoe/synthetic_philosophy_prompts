          5.  Explain the Derivation (How one leads to the other).
          6.  Conclusion on the "Depth."

      *   *Refining the IIA/Manipulability link:*
          *   Think about *why* you manipulate. You manipulate because the rule is sensitive to the position of candidate $C$ even when you care about $A$ vs $B$.
