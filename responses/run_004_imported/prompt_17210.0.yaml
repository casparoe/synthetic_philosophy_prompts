answer: |-
  First, I want to acknowledge that your reading of *On Certainty* is remarkably sophisticated. Many students with formal training in epistemology struggle to articulate the tension between the "hinge" and "riverbed" metaphors as clearly as you have. You have identified precisely the fault line that divides contemporary hinge epistemology.

  To answer your core question: **Yes, the two images are compatible, but only if you distinguish between how hinges function *in the moment* versus how they function *over time*.** Furthermore, your intuition about Wright and Pritchard is insightful, but the "action" reading (Pritchard/Moyal-Sharrock) actually has a robust way of explaining the riverbed—it just requires rethinking what it means for a "way of acting" to change.

  Here is a breakdown of how to resolve the tension, evaluate the two camps, and understand whether this is a flaw in Wittgenstein or a feature of the text.

  ### 1. Hinge vs. Riverbed: Synchronic vs. Diachronic
  The apparent contradiction dissolves if we view the metaphors as addressing different dimensions of certainty.

  *   **The Hinge (§341–343) is Synchronic:** It describes the *logical function* of a proposition at a specific moment. For a door to turn (for inquiry/doubt to happen), the hinge must be fixed *now*. If you try to doubt the hinge while using it to turn the door, the mechanism jams. In this sense, a hinge is "fixed" relative to the language game being played.
  *   **The Riverbed (§96–99) is Diachronic:** It describes the *historical evolution* of our world-picture. The riverbed is hard *now*, but over centuries, the water (fluid propositions) can erode the rock, or the rock can shift due to earthquakes (cultural/scientific revolutions).

  **Compatibility:** A proposition can be a fixed hinge *today* (you cannot doubt it and make sense) while being a fluid proposition *in a different historical epoch* (or vice versa). For example, "The earth has existed for more than 100 years" is a hinge for us. For a creationist in a specific theological framework, it might be fluid. For us, it is the bed; for them, it is the water.

  ### 2. Evaluating the Two Camps on the Riverbed
  You suggested that the Entitlement view (Wright) handles the riverbed better because it treats hinges as beliefs that can change status, whereas the Action view (Pritchard) struggles to explain how a non-belief shifts. I would argue the opposite is true, or at least that the Action view captures Wittgenstein's intent more faithfully.

  #### The Entitlement Reading (Crispin Wright)
  Wright tries to save hinges for traditional epistemology. He argues that while we lack *evidence* for hinges, we have a rational *entitlement* to accept them.
  *   **Pros:** It makes hinges intelligible to analytic philosophers. It explains the "shift" easily: if new evidence accumulates against a hinge, we lose our entitlement, and it becomes a fluid proposition subject to verification.
  *   **Cons:** Wittgenstein explicitly warns against treating hinges as items of knowledge or rational belief. In §30–31, he suggests that saying "I know" regarding a hinge is a grammatical mistake. If hinges are rationally entitled beliefs, they remain inside the "space of reasons." But Wittgenstein seems to want to place them *outside* that space, as the foundation *of* that space.
  *   **Verdict on Riverbed:** You are right that this makes the "shifting" mechanism easy to model (it's just a change in rational status). However, it risks turning Wittgenstein into a foundationalist, which he spent his later career arguing against.

  #### The Action/Commitment Reading (Duncan Pritchard & Danièle Moyal-Sharrock)
  This camp argues that hinges are not beliefs at all, but "animal certainties" or ways of acting. We do not *believe* the world exists; we *act* as if it exists.
  *   **Pros:** It respects Wittgenstein's insistence that certainty is shown in action (§7: "I act with *complete* certainty"). It explains why evidence doesn't work on hinges: you don't argue with a reflex; you don't provide evidence for a habit.
  *   **Cons:** As you noted, it seems harder to explain how a "reflex" changes.
  *   **Rebuttal regarding the Riverbed:** Proponents of this view (especially Moyal-Sharrock) argue that **practices change.** A "way of acting" is not a biological instinct like blinking; it is a cultural technique.
      *   *Example:* In the 15th century, "Witches cause illness" functioned as a hinge. It wasn't a hypothesis people tested; it was the background against which illness was interpreted. It was a "way of acting" (burning witches, seeking exorcisms).
      *   *The Shift:* That hinge didn't become fluid because someone produced a better argument (evidence). It became fluid because the *form of life* shifted (the rise of germ theory, secularism). The riverbed shifted because the *community's actions* shifted.
      *   *Verdict:* This actually fits the riverbed metaphor *better* than Wright. The riverbed isn't just a set of propositions; it is a "world-picture" (§162). World-pictures are inherited backgrounds, not rational conclusions. They shift via conversion, education, or cultural drift, not via evidential refutation.

  ### 3. Is it an Unresolved Seam?
  You asked if this is a real, unresolved seam in Wittgenstein's notes. The honest answer is: **Yes, but it is a productive one.**

  *On Certainty* was written in the last 18 months of Wittgenstein's life. He was fighting a war on two fronts:
  1.  **Against G.E. Moore:** Moore claimed "I know I have hands" was a paradigm of knowledge. Wittgenstein says: No, that's a hinge. It's nonsense to say "I know" here.
  2.  **Against the Skeptic:** The skeptic says "You can't prove you have hands." Wittgenstein says: No, doubt requires a ground. You can't doubt everything at once.

  Sometimes, to fight Moore, Wittgenstein emphasizes the **Riverbed/Action** side (certainty is non-epistemic, it's just what we do). Sometimes, to fight the Skeptic, he emphasizes the **Hinge/Structure** side (doubt is logically impossible here).

  Scholars like **Avrum Stroll** (who popularized the riverbed metaphor) argue that Wittgenstein was developing a "dualism" of certainty: there is epistemic justification (for fluid claims) and non-epistemic certainty (for hinges). The tension you feel is Wittgenstein trying to carve out a space that is neither "knowledge" nor "ignorance."

  ### 4. Applying This to Your Family Argument
  This theoretical tension has a direct payoff for the situation that started your journey.

  If you adopt the **Wright/Entitlement** view, you might think: "If I just find the right non-evidential warrant, I can show them they are irrational." This often leads to frustration, because you are still playing the game of "justification."

  If you adopt the **Pritchard/Action** view, informed by the **Riverbed**, you realize:
  1.  **Evidence is irrelevant:** You cannot use fluid propositions (evidence) to move a riverbed proposition (hinge). That is a category error.
  2.  **The Standoff:** You and your family member are not disagreeing about a fact; you are operating with different riverbeds. You are trying to open a door that is hinged on a different frame.
  3.  **The Solution:** You cannot argue someone out of a hinge. Hinges change only through a shift in "form of life." This happens through exposure, narrative, relationship, and time—not debate. The riverbed shifts when the water wears it down over years, not when you hit it with a hammer.

  ### Recommendation
  Since you are reading without secondary guides, I highly recommend looking into **Danièle Moyal-Sharrock**. She is the leading proponent of the "hinge as action" view and has written extensively on reconciling the hinge and riverbed metaphors. Her collection *The Third Wittgenstein* or her work on *On Certainty* specifically addresses your concern about how non-beliefs can harden or fluidify.

  **Summary:** The metaphors are compatible if you see the Hinge as the *function* (fixed now) and the Riverbed as the *history* (shifting over time). The "Action" reading (Pritchard/Moyal-Sharrock) is generally considered closer to Wittgenstein's text than the "Entitlement" reading (Wright), and it explains the riverbed not as a change in rational status, but as a change in cultural practice. The tension you found is not a mistake you made; it is the central dynamic of the book.
