      *   *Sam (Proponent):* Standard Bayesianism fails here (Logical Omniscience). If you know the axioms, you know the theorems. Humans don't. We need a theory of *bounded* rationality. The "money" isn't about possible worlds; it's about computational resource allocation. If a trader can exploit you, your reasoning is inconsistent *given your resources*. The "probability" is a guide for action under computational limits.
