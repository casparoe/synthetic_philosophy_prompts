answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The seminar on Practical Rationality has just adjourned. ELENA (Philosophy) and MARCUS (Economics) are lingering over stale coffee.*

  **Elena:** I have to say, Marcus, your lecture on quasi-hyperbolic discounting was technically impressive. But I remain unconvinced that it dissolves the problem of *akrasia*. You presented it as if the mathematical modeling of time-inconsistency explains away the irrationality of weakness of will. It doesn't. It merely describes the mechanics of the collapse.

  **Marcus:** And I maintain, Elena, that you're looking for a ghost in the machine. If we model the agent as a sequence of temporal selves, each maximizing their own utility function at time *t*, there is no collapse. There is only optimization. The agent at *t1* prefers saving; the agent at *t2* prefers spending. Both are acting rationally relative to their current constraints and discount rates. Where is the irrationality?

  **Elena:** It's in the disconnect between the judgment and the action. Donald Davidson's point was precise: Weakness of will occurs when an agent acts intentionally against their own *occurrent, all-things-considered judgment* about what they have most reason to do. If I judge, right now, that writing this paper is better than browsing the web, and yet I browse the web, I am irrational. My model doesn't care about "temporal selves." It cares about the unity of the agent.

  **Marcus:** But that unity is exactly what the hyperbolic literature challenges. Strotz showed us that dynamic inconsistency is inevitable with non-exponential discounting. Ainslie demonstrated that preference reversal is a structural feature of how we value immediacy. If the "all-things-considered judgment" is just a report of the current utility function, then at *t2*, your judgment *has* changed. You no longer judge that writing is better. You judge that browsing is better. So you aren't acting against your judgment; you're acting in accordance with it.

  **Elena:** That's the sleight of hand. You're conflating *evaluative judgment* with *motivational pull*. Just because the urge to browse becomes overwhelming at *t2* doesn't mean I genuinely judge browsing to be *better*. I might still hold the judgment that writing is best, even as my hand clicks the mouse. That tension is the akrasia. Your model assumes that revealed preference equals normative judgment. I say they can come apart.

  **Marcus:** If they come apart, your model isn't predicting behavior. But let's test this on the case you philosophers love to hate: the commitment device. Consider the sophisticated discounter. I know that at *t2* I will want to browse. So, at *t1*, I pay for a website blocker. I restrict my future freedom. Now, Elena, surely you agree this is rational planning?

  **Elena:** It is rational *planning*, yes. But notice what it admits. Why do I need the blocker? Because I know my future self cannot be trusted to act on its better judgment. The very purchase of the device is an admission that the *t2* action will be a failure of rationality.

  **Marcus:** On the contrary! It proves the *t1* self is rational. By anticipating the preference shift, I maximize my *t1* utility by constraining the *t2* self. The *t2* self, when blocked, is also maximizing utility—they simply choose the next best available option (staring at the wall) rather than the forbidden one. Everyone is optimizing. The system is in equilibrium.

  **Elena:** But the *t2* self *wants* to unblock the site. They are straining against the bars. If they could, they would act against the *t1* plan. For Davidson, the *t1* plan represents the agent's all-things-considered view of the good. If the *t2* self tries to override it solely due to the proximity of the temptation, that is the definition of weakness of will. The commitment device doesn't prove rationality; it proves the agent is at war with themselves.

  **Marcus:** "At war with themselves." That's the metaphor I'm rejecting. There is no single "self" at war. There is a conflict of interest between temporal stages, like a negotiation between two different people. If I lock my money in a safe to prevent my future self from spending it, I'm not saying my future self is *irrational*. I'm saying my future self has different incentives. Laibson's model captures this perfectly without invoking a normative failure.

  **Elena:** But economics is supposed to be about agents, not just aggregates of time-slices. If I am a single agent, then my rationality requires a certain coherence across time. If I allow the mere passage of time to reverse my normative commitments without new evidence, I am being capricious. The hyperbolic model describes *how* the preference changes, but it refuses to ask *if* that change is justified. It treats the shift in discount rate as a brute fact, like gravity. But practical rationality is about resisting gravity.

  **Marcus:** And philosophy often treats the "all-things-considered judgment" as a brute fact, like a divine command. Why should the *t1* judgment bind the *t2* agent? The *t2* agent is experiencing the pleasure of browsing *now*. The *t1* agent was only imagining it. Why is the cold, distant judgment of the past superior to the hot, vivid preference of the present?

  **Elena:** Because the *t1* judgment was made under conditions of cooler deliberation, intended to govern the action. It was the *executive* judgment. If we say that every time a temptation arises, the "all-things-considered judgment" magically updates to match the temptation, then "rationality" becomes tautological. It just means "doing what you feel like doing." That empties the concept of normativity.

  **Marcus:** I'm not saying it's tautological. I'm saying rationality is internal consistency. At *t2*, given the hyperbolic curve, the utility of browsing *is* higher. To choose writing would actually be irrational for the *t2* self, because it would be choosing a lower utility option. You want the *t2* self to be a slave to the *t1* self's utility function. That's not rationality; that's imperialism.

  **Elena:** It's not imperialism; it's autonomy. It's the ability to endorse a principle and stick to it. Look, let's go back to the commitment device. If the *t2* self is truly rational in wanting to browse, why does the *t1* self view that desire as a threat?

  **Marcus:** Because the *t1* self has different weights.

  **Elena:** No. The *t1* self views it as a *failure*. When I buy the blocker, I am not saying, "I am accommodating a different but equally valid preference." I am saying, "I am preventing myself from making a mistake." The phenomenology of using a commitment device is the phenomenology of anticipating one's own irrationality.

  **Marcus:** But that's the "phenomenology" talking. The model shows that the *t1* self is simply protecting its interests against the *t2* self's interests. It's a principal-agent problem within one organism. You're insisting on calling it "irrationality" because you want to preserve the idea of a unified moral agent. I'm calling it "dynamic inconsistency" because I want to predict behavior.

  **Elena:** And therein lies the rub. You've changed the subject. You've taken a phenomenon that feels like a normative failure—acting against what you believe you should do—and re-described it as a mechanical shift in preference parameters. You've explained the *cause* of the akrasia, but you haven't explained it *away*.

  **Marcus:** I've explained it away by showing there's no contradiction to resolve. A contradiction requires two simultaneous claims. "I should X" and "I do Y." But if "I should X" is false at *t2*, there is no contradiction.

  **Elena:** But is "I should X" false at *t2*? That's the question. If I'm a sophisticated discounter, I know at *t2* that I *should* have stuck to the plan. I might even judge at *t2* that the plan was right, even as I succumb to the urge. That's the Davidsonian point: the judgment persists *occurrently* even as the action diverges. Your model assumes the judgment vanishes the moment the discount rate spikes.

  **Marcus:** Does it? Or does the judgment just lose the vote? In my model, "judgment" is just the output of the deliberation process. If the discount rate spikes, the output changes. If you say the output *shouldn't* change, you're introducing an external norm—exponential discounting—and calling anything else "irrational."

  **Elena:** I'm introducing the norm of consistency. If I value my health at *t1*, and I value my health at *t2*, but the proximity of a cigarette makes me act as if I don't value it at *t2*, I am inconsistent. Hyperbolic discounting models the inconsistency; it doesn't justify it.

  **Marcus:** But justification is relative to the utility function. If the utility function includes a bias for immediacy, then satisfying that bias is justified. You want to say the utility function *ought* to be exponential. That's a normative claim, not a descriptive one.

  **Elena:** Precisely. Practical rationality is normative. It tells us how we *ought* to reason. Your discipline describes how we *do* reason. When we meet on the topic of weakness of will, you describe the mechanism of the fall. I point out that it is a fall.

  **Marcus:** So, are we disagreeing about the phenomenon? Or just the label?

  **Elena:** We're disagreeing about whether the phenomenon *is* irrationality. If you define rationality as "maximizing current utility given current parameters," then akrasia doesn't exist. But that definition ignores the agent's capacity to stand back from their current parameters and evaluate them.

  **Marcus:** And if you define rationality as "adhering to prior plans regardless of current motivational shifts," you ignore the reality that preferences *do* shift, and sometimes legitimately. Sometimes the *t2* self knows more about the cost of writing than the *t1* self did.

  **Elena:** But in the standard case of weakness of will, the *t2* self admits the *t1* self was right! That's the regret. If I eat the cake, and I'm happy, that's just a preference change. If I eat the cake, and I feel guilty, that's akrasia. The guilt signals the persistence of the *t1* judgment.

  **Marcus:** Guilt is just the *t1* self's utility function haunting the *t2* self. It's a cost, like a fine. I pay the fine of guilt to enjoy the cake. I've still maximized utility.

  **Elena:** *(Laughs)* You really are incorrigible. You've turned conscience into a price tag.

  **Marcus:** And you've turned preference shifts into moral failures. Look, Elena, perhaps the commitment device is where we meet. We both agree the agent buys the blocker. I say it's to align incentives. You say it's to enforce rationality.

  **Elena:** It's to enforce rationality *because* the incentives are misaligned by irrational impulses.

  **Marcus:** Or, the incentives are misaligned by time.

  **Elena:** But time isn't a reason. The mere passage of time doesn't make the cake better for me.

  **Marcus:** No, but the proximity of consumption changes the neural valuation. It's a biological fact.

  **Elena:** And practical rationality is the practice of not being enslaved by biological facts. If your model says we *are* enslaved, then your model describes a world without practical rationality.

  **Marcus:** Or it describes a world where practical rationality is about managing the enslavement, not denying it. The sophisticated discounter is the rational hero of my story, not the akratic villain of yours.

  **Elena:** He's a hero who admits he's prone to vice.

  **Marcus:** He's a realist who knows his discount rate isn't constant.

  **Elena:** *(Pauses, looking into her coffee)* So, here is where we stand. You argue that the hyperbolic model fully explains the behavior without residue. I argue that the model explains the *causes* of the behavior but leaves out the *normative conflict* that defines the experience of weakness of will.

  **Marcus:** I'd say the normative conflict is just the friction between temporal selves.

  **Elena:** And I say that friction *is* the irrationality. You've described the machinery of the trap. I'm still interested in why it's a trap.

  **Marcus:** Fair enough. You keep the "ought." I'll keep the "is." But don't be surprised if my students stop feeling guilty about procrastination.

  **Elena:** And don't be surprised if mine keep buying website blockers, convinced they're saving their souls, not just optimizing utility.

  **Marcus:** *(Smiles)* As long as they pay for the subscription, I don't care what they think they're doing.

  **Elena:** *(Smiles back)* And as long as they struggle against the urge, I don't care what the discount rate says.

  **Marcus:** Shall we get lunch? I know a place that's excellent, though I admit my discount rate for hunger is currently quite steep.

  **Elena:** Lead on. But if you order dessert, I'm noting it as a data point.

  **Marcus:** Noted. Though I suspect my *t2* self will thank me.
