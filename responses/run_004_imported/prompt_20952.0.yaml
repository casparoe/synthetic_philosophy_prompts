answer: |-
  Here is a constructed argument designed for your dissertation chapter. It adopts a skeptical stance regarding the New Principle (NP), arguing that while it secures formal consistency, it evacuates the Principal Principle (PP) of its normative force.

  ***

  ### The Epistemic Emptiness of the New Principle: A Skeptical Case

  The consensus among Humeans is that Lewis's New Principle (NP) successfully debugs Humean Supervenience (HS). By conditioning credence on the proposition that a specific chance theory $T_w$ is the true theory for world $w$, rather than on the bare chance proposition $\langle Ch(A) = x \rangle$, Lewis avoids the contradiction wherein the chance function assigns positive probability to its own falsification. Formally, the system is saved. However, your advisor's conclusion that the matter is "closed" conflates logical consistency with philosophical adequacy.

  The Principal Principle was never intended merely as a consistency constraint on a probability calculus. It was proposed as a constitutive analysis of the concept of objective chance: to be a chance function *just is* to be a function that commands rational deference. The PP was meant to explain *why* we should align our credences with chances. The argument below contends that the NP preserves the equation of the PP but severs the explanatory link. In doing so, it renders Humean chance epistemically inert for the situated agent. To defend this, I take explicit stands on three critical sub-issues: the normative capacity of theory-relative conditionals, the ad hoc nature of expanded admissibility, and the disanalogy between Humean and non-Humean vulnerabilities.

  #### 1. The Normative Inertness of Theory-Relative Conditionals

  **Stand:** A chance-theory-relative conditional cannot do the same normative work as a simple chance proposition because it renders the principle inaccessible to the temporal agents it is meant to guide.

  The original PP, $Cr(A | \langle Ch(A)=x \rangle \& E) = x$, offered a direct bridge from metaphysics to epistemology. It suggested that once an agent identifies a chance value, rationality *compels* a specific credence. The normative force lay in the immediacy of the inference: knowledge of chance yields a constraint on belief.

  The NP replaces this with $Cr(A | T_w \& E) = Ch_{T_w}(A)$. Here, $T_w$ is the proposition that the Humean best system for world $w$ is the specific theory $T$. On HS, $T$ is determined by the global mosaic, including the future. Therefore, to condition on $T_w$ is to condition on the truth of a specific summary of the *entire* history of the world.

  This shift destroys the action-guiding nature of the principle. For a situated agent at time $t$, the proposition $T_w$ is effectively unknowable. To know $T_w$ is to know which future events will occur, sufficient to certify that the current best system remains the best system. If an agent possesses evidence $E$ sufficient to establish $T_w$, they effectively possess inadmissible information about the future (see Section 2). Consequently, the NP does not tell an agent *how to form beliefs* given their actual epistemic situation; it tells them what their beliefs *would be* if they knew the whole truth of the block universe.

  A normative principle that applies only from a God's-eye view is not a principle of rationality for finite agents; it is a description of omniscience. By retreating to the theory-relative conditional, the Humean saves the chance function from contradiction but concedes that chance cannot serve as a guide for expectation *ex ante*. The PP was supposed to explain why chance is authoritative for belief formation. The NP explains only why chance is consistent with belief formation *given total knowledge*. This is a category error: it transforms a rule for inference into a tautology of hindsight.

  #### 2. Admissibility and the Reverse-Engineering of History

  **Stand:** Treating full historical propositions (including future segments required to fix the best system) as "admissible" is not independently well-motivated; it is a transparently ad hoc maneuver that dissolves the temporal asymmetry essential to objective chance.

  Lewis's original restriction on admissibility was motivated by the intuition that evidence about the future should not be allowed to override chance. If I know the coin will land heads, my credence should be 1, not 0.5, but that is because I have *inadmissible* evidence. The PP was designed to capture the rationality of deferring to chance *in the absence* of such crystal-ball knowledge.

  The NP, however, requires us to treat the proposition $T_w$ as admissible evidence. Since $T_w$ supervenes on the entire history, conditioning on $T_w$ implicitly conditions on the future segment of the history that secures the status of the best system. If a future sequence of outcomes would undermine the current best system, the NP requires us to rule out that future in order to apply the chance function.

  This is reverse-engineering. The class of admissible propositions is expanded not because there is an independent epistemic reason to treat global historical summaries as "accessible" or "safe" evidence, but solely to prevent the chance function from assigning probability to its own falsification. By swallowing the future into the admissible base, the Humean collapses the distinction between *chance* and *frequency*.

  If the "admissible evidence" required to activate the chance function includes the future facts that determine the best system, then Humean chance is no longer a predictor of the future; it is a label for the past-and-future pattern. The temporal asymmetry of chance—that it flows from the fixed past and laws toward the open future—is a cornerstone of its philosophical utility. The NP sacrifices this asymmetry to save the reduction. It implies that we can only legitimately defer to chance if we already know enough about the future to ensure the chance function won't change. This renders the concept of "objective chance" indistinguishable from "conditional frequency given the total block," stripping it of the modal force required to guide agents who lack knowledge of the block.

  #### 3. The Non-Humean Disanalogy: Relocation vs. Avoidance

  **Stand:** Non-Humean, primitivist accounts do not merely relocate the undermining problem; they avoid it structurally, highlighting that undermining is a unique tax levied on reductionism.

  It is tempting to argue that all accounts of chance face epistemic access problems, and thus the Humean is in no worse shape than the primitivist. This is a false equivalence. Primitivist accounts (e.g., sui generis propensities or fundamental probabilistic laws) posit that chances are fixed by the state of the world at $t$ (plus the laws). On these views, the chance function at $t$ does not supervene on the post-$t$ history. Therefore, a future sequence of events cannot "undermine" the truth of the chance attribution at $t$. If a coin has a propensity of 0.5 at $t$, and it lands heads 100% of the time thereafter, the propensity at $t$ was still 0.5; the world simply realized a low-probability history.

  The undermining problem is specific to the Humean commitment that laws and chances are *summaries* of the mosaic. The primitivist pays a different price (ontological queerness, lack of reduction), but they do not pay the price of undermining. Consequently, the primitivist can maintain the original PP without modification. They can assert $Cr(A | \langle Ch(A)=x \rangle \& E) = x$ without fear that $\langle Ch(A)=x \rangle$ entails facts about the future that contradict the chance value.

  By conceding that the NP is necessary, the Humean admits that their ontology cannot support the original PP. The primitivist avoids this concession. Therefore, the problem is not merely relocated; it is a specific vulnerability of the Humean architecture. The NP is a patch that acknowledges this vulnerability by retreating from the claim that chance is a guide *simpliciter* to the claim that chance is a guide *relative to a theory of the whole world*. The primitivist retains the claim that chance is a guide relative to the present state. In the context of explaining rational deference, the primitivist retains the high ground: their chances can guide belief *now*, whereas Humean chances can only guide belief *from the end of time*.

  ### Conclusion: The Cost of Debugging

  The "Big Bad Bug" was not merely a logical inconsistency to be patched; it was a symptom of a deeper tension between Humean metaphysics and the normative role of chance. Lewis's New Principle treats the symptom by altering the formulation of the PP, but it does not cure the disease.

  By shifting to a theory-relative conditional, the NP makes the principle inaccessible to temporal agents. By expanding admissibility to include global historical truths, it dissolves the temporal asymmetry that makes chance useful for prediction. And by contrasting this with non-Humean accounts, we see that this is a unique cost of Humean reductionism, not a general feature of chance.

  The strongest case against your advisor's closure of the matter is this: The Principal Principle was valuable because it told us how to live in an uncertain world. The New Principle tells us how to label a determined one. It secures the consistency of Humean chance by sacrificing its function. If a theory of objective chance cannot explain why an agent at $t$ should defer to it without assuming the agent knows the history of the world after $t$, it has preserved the name of "chance" while abandoning the substance. The NP saves Humean Supervenience from contradiction, but only by rendering its chance function epistemically useless for the very agents it was meant to guide.
