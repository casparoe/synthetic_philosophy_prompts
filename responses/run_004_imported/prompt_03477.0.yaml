answer: |-
  This is a superb question that cuts to the heart of Pascal's political realism. As a PhD student, you are rightly identifying the central aporia in Pascal's political thought: the normative desire for the union of justice and might versus the pragmatic necessity of obscuring the violent origins of authority to maintain civil peace.

  If we apply Pascal's logic rigorously, he would likely judge institutions like the International Criminal Court (ICC) or UN commissions of inquiry not as a progressive step toward binding force to justice, but as a **dangerous instantiation of the very exposure he warns against.** While these bodies intend to unite justice and might, Pascal would argue that by publicly declaring the injustice of the powerful without possessing the coercive power to rectify it, they produce the worst of both worlds: they undermine the "mystical foundation" of authority (order) without actually delivering justice.

  Here is the defense of that position, holding the two strands of his thought together.

  ### 1. The Diagnostic: The Necessity of the "Union"
  You correctly cite Brunschvicg 298 (Lafuma 294), where Pascal diagnoses the human condition: *"Being unable to make what is just strong, we have made what is strong just."*

  For Pascal, this is not merely a description of corruption; it is a structural necessity of the post-lapsarian world. True justice (Christian *caritas* or natural right) is too weak to govern fallen men who are driven by *amour-propre*. Therefore, political stability requires that force be cloaked in the language of justice. The sovereign must be obeyed not because his commands are inherently righteous, but because he holds the sword.

  The ICC attempts to reverse this formula. It asserts "what is just" against "what is strong." Pascal would acknowledge the nobility of the intent but deem it metaphysically futile. In B 298, he notes that justice without might is *"helpless"* (*impuissante*). An ICC ruling against a powerful state that ignores it demonstrates exactly this helplessness. For Pascal, a "justice" that cannot enforce itself is not political justice; it is merely opinion. By highlighting this gap, the ICC does not bridge it; it dramatizes the impotence of justice.

  ### 2. The Prohibition: "Sounding the Source"
  The crux of your tension lies in the fragments regarding secrecy. In B 294 (L 290), Pascal writes: *"We must not sound them [laws] even to their source, otherwise they collapse."*

  This is the "mystical foundation of authority." Law derives its stability from prescription and custom, not from an inquiry into its original legitimacy. When a UN commission of inquiry investigates a head of state for crimes against humanity, it is effectively "sounding the source." It is asking: *By what right do you rule?* and answering: *You have no right; you are a criminal.*

  Pascal argues in B 326 (L 317) that telling people their laws (or leaders) are unjust *"breeds sedition without producing anything juster."* This is the specific risk of the ICC model.
  *   **Sedition:** It delegitimizes the sovereign in the eyes of the populace (or the international community).
  *   **No Remedy:** Because the ICC lacks its own "might" (an executive police force), it cannot replace the delegitimized sovereign with a just alternative.

  For Pascal, this creates a state of nature scenario. If the people believe their leader is unjust (per the ICC) but the leader remains in power (per reality), the bond of obedience is severed, yet the power dynamic remains. This leads to civil war or chaos, which for Pascal is a greater evil than the quiet acceptance of an imperfect sovereign.

  ### 3. The Conduct of the Wise: Secrecy vs. Transparency
  You mention B 336 (L 325), where Pascal suggests the wise should keep the insight of law's arbitrariness secret while outwardly complying. This is a politics of esotericism. The "honnête homme" knows the law is based on custom and force, but he acts as if it is based on natural right to preserve peace.

  International tribunals operate on a principle of radical transparency that Pascal would view as politically naive. They assume that exposing injustice will lead to correction. Pascal assumes that exposing injustice leads to resentment.
  *   **Pascal's View:** The wise judge privately that a war crime is a sin, but they do not establish a public tribunal that claims to strip the sovereign of legitimacy unless they also possess the army to depose him.
  *   **The ICC Model:** It makes the private judgment public and institutional.

  Pascal would argue that this violates the charitable duty to maintain order. In *De l'Esprit Géométrique*, he distinguishes between truths that are useful to know and those that are destructive. The arbitrary origin of law is a truth that is destructive to public peace. Therefore, an institution dedicated to broadcasting that truth is, in Pascalian terms, socially irresponsible.

  ### 4. The Exception: When Might is Already Lost
  Is there any room for Pascal to approve? Perhaps only in a specific edge case. Pascal's prohibition on "sounding the source" applies to *established* authority. If a regime has already lost its "might" (i.e., it is collapsing, or the international consensus has already turned against it such that enforcement is guaranteed), then exposing its injustice is safe because it does not risk sedition—it merely cleans up the ruins.

  However, regarding powerful states that remain stable (e.g., permanent members of the Security Council), Pascal would view investigations into them as reckless. If the ICC indicts a leader of a nuclear power who simply ignores the indictment, the ICC has revealed that "justice" is a sham. This confirms the cynic's view (B 298) that "might is right," thereby hardening the tyranny rather than softening it. It strips the tyrant of the *mask* of justice without stripping him of the *sword*.

  ### Conclusion: A Pascalian Verdict
  Pascal would likely view the ICC as a well-intentioned but dangerous abstraction. It attempts to impose the order of *charity* (true justice) onto the order of *concupiscence* (political reality) without the necessary power to sustain it.

  He would argue that these bodies commit the error of B 326: they teach the people that their masters are unjust. Since the masters remain strong, the people are left with a choice between dangerous rebellion or cynical despair. Neither leads to salvation or peace.

  For Pascal, the only legitimate "international court" would be one backed by a universal monarch with absolute power to enforce rulings—thereby reuniting might and justice. Absent that universal sovereign (which he deems impossible in this life), the prudent course is to maintain the fictions of sovereignty that keep the peace. The ICC, by exposing the fiction without providing the reality, destabilizes the "quietism" of the political order that Pascal believes is the best we can hope for in a fallen world.

  **Recommendation for your dissertation:**
  You might frame this as Pascal anticipating the Weberian "monopoly on violence." For Pascal, legitimacy is a byproduct of the successful monopoly on violence, not a precursor to it. Institutions that claim legitimacy (justice) without the monopoly (might) are not just ineffective; they are actively destructive to the civil peace which is the highest temporal good. This positions Pascal not just as a skeptic, but as a theorist of the *fragility of political fiction*.
