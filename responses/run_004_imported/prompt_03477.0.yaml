          3.  **The Danger of Exposure:** Apply the "sounding the source" warning to international tribunals (B 326). They reveal the gap without closing it.
          4.  **The Priority of Order:** Why peace trumps abstract justice in Pascal's political thought (B 336).
          5.  **Counter-argument/Refinement:** Is there *any* room for approval? Maybe as a symbolic gesture, but ultimately futile/dangerous.
          6.  **Conclusion:** Summarize.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to conflate "law" generally with "international law." Pascal is mostly thinking of domestic sovereignty. However, his logic applies to *any* authority claiming legitimacy.
      *   *Refinement:* The ICC claims a higher justice but lacks the "might." For Pascal, a claim to justice without might is "helpless" (B 298). But worse, it delegitimizes the existing might (sovereign states).
      *   *Key Insight:* The ICC performs the exact act Pascal forbids: it tells the subject (the global citizen) that the sovereign's actions are *not* just, even if the sovereign remains strong. This breaks the necessary fiction.

