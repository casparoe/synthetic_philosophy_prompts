          *   B 85/L 118 (The "River" fragment): Custom creates right.

      *   *Nuance:* Acknowledge the PhD level. Don't just say "Pascal hates it." Explain *why* within his theological/political anthropology. The Fall means we can't have true justice. Trying to enforce it without power is prideful and dangerous.

