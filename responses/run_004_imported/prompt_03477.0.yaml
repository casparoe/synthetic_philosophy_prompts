      *   **Task:** Defend an answer using specific fragments.

  2.  **Deconstruct Pascal's Position (The "Pascalian Paradox"):**
      *   *The Ideal:* Justice without might is helpless; might without justice is tyrannical. We need them together. Since we can't make the just strong, we make the strong just (B 298/L 294).
      *   *The Mechanism:* This "making strong just" relies on *prescription* and *custom*. Law becomes legitimate through time and acceptance, not necessarily through natural right.
      *   *The Danger:* If you reveal that law rests on force/custom rather than natural justice, you undermine obedience. "To sound them even to their source" is dangerous (B 294/L 290).
      *   *The Strategy:* Double truth/levels of understanding. The "honnête homme" or the wise know the truth (law is arbitrary/force-based) but act as if it is just to maintain order. The people believe it is just.
      *   *The Goal:* Peace and order (avoiding the state of nature/civil war) are paramount, even if metaphysical justice is unattainable in politics.

  3.  **Analyze the Modern Institutions (ICC/UN):**
      *   *Function:* They declare what is *just* (legal/moral judgment) regarding powerful actors.
      *   *Limitation:* They often lack *might* (enforcement relies on state cooperation).
      *   *Effect:* They expose the gap between might and justice. They "sound the source" by showing that powerful states act unjustly and are not bound by law.

  4.  **Evaluate the Fit (Pascal vs. ICC):**
      *   *Argument for "Step Toward Binding Force to Justice":* Pascal wants justice and might united. The ICC *tries* to do this. It represents an attempt to create a universal standard.
      *   *Argument for "Destabilizing Exposure":* This is the stronger Pascalian reading. The ICC highlights the *lack* of might. It exposes the usurpation. It tells the people "your leaders are unjust." It risks sedition without guaranteeing a remedy. It undermines the "mystical foundation of authority" (to borrow Montaigne/Pascal terminology).
      *   *Key Pascal Insight:* Order is more important than perfect justice. Exposing the injustice of the sovereign without the power to correct it leads to chaos (war of all against all).

  5.  **Drafting the Argument (Iterative Process):**

      *   *Thesis:* Pascal would likely view the ICC/UN not as a solution, but as a dangerous destabilization. While he desires the union of justice and might, he prioritizes *order* over *truth* in the political realm. Exposing the injustice of the powerful without the force to punish them creates the worst of both worlds: undermined authority without restored justice.

      *   *Key Fragments to Deploy:*
          *   B 298/L 294 ("Justice and Might"): The foundational diagnosis.
          *   B 294/L 290 ("Sounding the source"): The warning against inquiry.
          *   B 326/L 317 ("Sedition"): The consequence of telling people laws are unjust.
