answer: |-
  **The Ledger of Saint-Éloi**

  Elias rubbed the thumb of his left hand against the grain of the paper, a nervous tic he'd developed over thirty years of archival work. The ledger lay open under the magnification lamp, the ink shimmering with a peculiar, oily iridescence. He was looking for the discrepancy in the Saint-Éloi trust, a sum that had vanished in 1924 and reappeared, inexplicably, in 1925.

  His eyes tracked the columns. The arithmetic was elegant, almost too perfect. The carry-overs aligned; the debits matched the credits. At the bottom of the page, the final balance sat in stark black ink: *Zero*.

  Elias felt the familiar warmth of resolution in his chest. The money hadn't been stolen; it had been misfiled, then corrected. The proposition *P* formed in his mind with the solidity of a stone: *The ledger balances.* He reached for his verification stamp.

  "Dr. Vance?"

  The voice belonged to Sarah, the lab technician. She stood in the doorway of the climate-controlled vault, holding a tablet like a shield. She looked pale.

  "I'm in the zone, Sarah. I think I've solved the Saint-Éloi mystery."

  "You need to stop," she said, stepping into the room. "We ran the spectral analysis on the ink you've been examining for the last four hours. It's not standard iron-gall."

  Elias paused, pen hovering. "It looks standard."

  "That's the problem. It's a specific batch from the Lyon printer used during the war. They mixed a proprietary stabilizer into the pigment to prevent fading in damp cellars." Sarah tapped the tablet. "We cross-referenced the chemical composition with your biometric data from your intake form. The stabilizer contains a trace alkaloid that reacts with the enzyme profile of about thirty percent of the population. You're in that group, Elias."

  Elias lowered the pen. "And?"

  "And when exposed to friction—like rubbing the paper to check texture—and focused light, the alkaloid becomes airborne. In your specific genotype, it induces a localized cognitive feedback loop." Sarah swallowed. "It doesn't change what you see. It changes how much you *trust* what you see. It creates high-confidence false positives in pattern recognition. You feel certain because of the chemical, not because of the math."

  Elias looked back at the ledger. The columns still aligned. The *Zero* still stared up at him, bold and undeniable. The visual evidence hadn't changed. The arithmetic logic held up under scrutiny; he could trace the sums in his head, and they worked. *Seven plus three is ten. Carry the one.* The first-order evidence (FOE) was intact. The numbers *did* sum to zero, as far as his eyes and brain could calculate in the moment.

  But now he possessed higher-order evidence (HOE). He knew that his faculty of judgment was chemically compromised. He knew that the feeling of certainty swelling in his chest was likely a symptom of poisoning, not a signal of truth.

  "So you're saying I'm hallucinating the balance?" Elias asked.

  "I'm saying your confidence is uncorrelated with accuracy," Sarah corrected. "For the next six hours, any conclusion you reach about this document will feel undeniable, regardless of whether it's right. You could be looking at a page of random numbers and swear they sum to zero."

  Elias looked at the page. He tried to find an error. He forced his eyes to scan the addition again. *Five plus five is ten.* It looked right. It felt right. The chemical certainty was a warm blanket wrapped around his logic. He knew, intellectually, that the blanket was artificial. He believed that his belief in the zero balance was unsupported by reliable evidence. He believed that believing *P* was irrational.

  And yet, he still believed *P*.

  "I should step away," Elias said. He didn't move.

  "The ventilation system is cycling," Sarah said softly. "But the residue is on the paper, Elias. You've already inhaled it."

  If he walked away now, the audit would remain incomplete. The trust would remain flagged as fraudulent, potentially ruining the reputations of descendants who had done nothing wrong. If he signed off, he might be certifying a lie. But if the ledger *did* actually balance—if he was one of the lucky ones whose chemistry didn't flip the switch, or if the concentration was too low—then walking away would be an act of cowardice, abandoning the truth because of a statistical risk.

  He looked at the *Zero*. It was so clear. How could something so clear be wrong? But he knew that was exactly what the alkaloid wanted him to think.

  "I have to file the report, Sarah."

  "You can't trust your signature."

  "I trust the numbers," Elias said, though the words tasted like ash. He knew that statement was false. He didn't trust the numbers; he trusted the *feeling* of the numbers, and he knew that feeling was compromised. He was holding two contradictory thoughts in equilibrium: *The ledger balances* and *I have no reason to think the ledger balances.*

  He picked up the stamp. His hand didn't shake. The chemical assurance saw to that.

  "If I'm wrong," Elias said, "then I'm a fool who poisoned his own judgment. If I'm right, I'm the only one who could have solved it."

  "Elias, don't."

  He brought the stamp down. The thud was heavy and final. *VERIFIED.*

  He sat back, waiting for the doubt to crush him, but the alkaloid held it at bay. He felt calm. He felt correct. He knew, with the cold, detached part of his mind that remained untouched, that this calm was evidence of nothing. He was a man standing on a cliff edge, convinced the ground was solid because his boots felt warm, knowing full well the warmth came from a fire beneath him that was burning the earth away.

  "Lock the vault, Sarah," he said, closing the ledger. "I'm going home."

  He walked past her, the certainty humming in his blood, carrying the weight of a truth he could neither justify nor abandon.
