      *   **The Brother's Behavior:** Cancels plans last minute, forgets important dates (birthdays), borrows money and doesn't repay without prompting.
      *   **The Brother's Defense:** "You know how my brain works, it's not fair to judge me like everyone else."
      *   **The User's Reaction:** Feels guilty/like a jerk when annoyed. Has adopted a strategy of "lowering expectations" to avoid conflict (planning around flaking, not asking for money, forgiving in advance).
      *   **The User's Feeling:** This strategy reduces fighting but feels dehumanizing (like treating him like a toddler or a pet). It feels like *indifference* or *pity* rather than *forgiveness* or *relationship*.
      *   **The Core Question:** Is the brother right (can't hold this against him)? Or is there a way to be annoyed without being unfair to someone with a neurodevelopmental disorder?

  2.  **Deconstruct the Core Issue:**
      *   **ADHD is real:** It affects executive function, working memory, time blindness, and emotional regulation. The brother isn't *trying* to be hurtful.
      *   **Impact is real:** The user's feelings of hurt, disappointment, and financial loss are valid. Intent doesn't erase impact.
      *   **The "Toddler/Dog" Analogy:** This is key. Treating someone like a child removes their agency. It implies they *can't* learn or grow. This is infantilizing.
      *   **The "Forgiveness in Advance" Strategy:** This is actually *avoidance*. It suppresses the user's needs to keep the peace. It erodes intimacy.
      *   **The Brother's Defense:** "Don't judge me" can become a shield against accountability. Accommodation $\neq$ Exemption from consequences.

  3.  **Formulate the Advice/Response:**
      *   **Validate the User:** Acknowledge that their feelings are normal and valid. It *is* hard to have a relationship with someone with untreated or unmanaged ADHD.
      *   **Address the "Toddler" Feeling:** Explain *why* it feels that way. It's because the current dynamic removes his agency. A healthy adult relationship requires mutual accountability.
      *   **Distinguish between Intent and Impact:** He doesn't mean to hurt you (intent), but you still get hurt (impact). Both can be true.
      *   **Reframe "Judging":** Holding someone accountable isn't judging their character; it's expecting adult behavior.
      *   **Actionable Steps:**
