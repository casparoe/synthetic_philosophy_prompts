      *   **The Money Issue:** This is concrete. Needs a specific approach.
      *   **The Relationship Goal:** Move from "Managing a Patient" to "Relating to a Brother."

  4.  **Drafting the Content (Iterative refinement):**

      *   *Opening:* Validate the exhaustion. It's a common sibling dynamic with ADHD.
      *   *The "Toddler" Analogy:* Hit this hard. You're right, it feels bad because it *is* problematic. It strips him of adulthood.
      *   *The Brother's Argument:* He's half-right, half-wrong. ADHD explains behavior, doesn't excuse impact. "My brain works differently" is true, "Therefore you can't be annoyed" is false.
      *   *Accommodation vs. Enabling:* Lowering expectations to avoid pain is enabling. Setting boundaries is accommodating.
