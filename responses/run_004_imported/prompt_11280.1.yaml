answer: |-
  This is a incredibly common and painful dynamic for siblings of people with ADHD, and your intuition is spot on: **Treating him like a toddler feels bad because, in a way, you are.**

  You have identified the core problem perfectly. By "forgiving in advance" and lowering your expectations to zero, you are removing his **agency**. You are treating his behavior as an inevitable force of nature (like a dog chewing a shoe) rather than the actions of an adult brother who is capable of growth and management.

  To answer your specific question: **No, he is not right.** You *do* get to hold him accountable. You *do* get to be annoyed. Having ADHD explains behavior, but it does not excuse impact.

  Here is a breakdown of why your current strategy is hurting the relationship more than the fighting did, and how to find a middle ground between "angry judge" and "condescending caretaker."

  ### 1. The Difference Between Intent and Impact
  Your brother is conflating *intent* with *impact*.
  *   **Intent:** He does not wake up thinking, "How can I hurt my sibling today?" His ADHD makes him impulsive, forgetful, and time-blind. He isn't malicious.
  *   **Impact:** You feel disregarded, financially out of pocket, and emotionally hurt.

  When he says, "It's not fair to judge me," he is asking you to ignore the impact because his intent wasn't bad. But in a relationship, impact matters more than intent. You can validate his struggle ("I know you didn't mean to forget") while still holding your ground on the hurt ("But it still hurts me that you did").

  ### 2. Why the "Toddler" Analogy is So Accurate (and Dangerous)
  You feel like you're relating to a toddler because you have taken on the role of the **Parent**, and cast him as the **Child**.
  *   **The Parent (You):** Anticipates problems, absorbs the consequences, manages the emotions, and asks for nothing in return to keep the peace.
  *   **The Child (Him):** Makes mistakes, suffers no real consequences, and learns that his limitations are a "get out of jail free" card.

  This dynamic kills intimacy. You cannot be close to someone you are managing. By protecting yourself from disappointment, you are also protecting yourself from connection. You aren't fighting, but you aren't relating as equals anymore.

  ### 3. Accountability vs. Shame
  Your brother likely fears that if he is held accountable, it means he is a *bad person*. This is common for people with ADHD who have been criticized their whole lives. He hears "You forgot my birthday" as "You are selfish and unlovable."

  However, **accountability is not shame.**
  *   **Shame:** "You're so flaky, you never care about me." (Attacks character)
  *   **Accountability:** "When you cancel last minute, I waste money on tickets and feel like I'm not a priority. I need you to stop making plans you aren't sure about." (Addresses action and impact)

  He is responsible for managing his brain. That might mean setting five alarms, putting your birthday in his phone the moment it passes, or writing down the loan agreement. If he isn't doing those things, he is choosing not to manage the symptoms, and that *is* something you can be annoyed about.

  ### 4. How to Be Annoyed Without Being Unfair
  You can be annoyed without being cruel. The goal is to move from **Lowering Expectations** to **Setting Boundaries.**

  **On the Money:**
  Stop waiting for him to bring it up. That is a trap.
  *   *Say:* "I love you, but I need that $200 back by the 1st of next month. I have bills to pay. Can you make that happen?"
  *   If he says "You know how my brain is," you say: "I do know, which is why I'm asking you to set a reminder now so you don't forget. The deadline is still the 1st."
  *   **The Boundary:** If he doesn't pay, you stop lending money. That isn't punishment; it's self-protection.

  **On the Plans:**
  Stop planning around his flaking. Plan for the reality.
  *   *Say:* "I'm not going to buy non-refundable tickets for us anymore. If you want to come, meet me there, but I'm going regardless."
  *   Or: "I'm feeling really disappointed that you canceled again. I know it's the ADHD, but it makes me hesitant to make plans with you because I end up feeling let down."
  *   **The Boundary:** You stop initiating high-stakes plans for a while. Let him come to you.

  **On the Birthdays:**
  *   *Say:* "I know dates slip your mind. But this is the second year in a row. It makes me feel like I don't matter to you. I need you to put my birthday in your phone with a recurring alarm two weeks in advance."
  *   **The Boundary:** If he forgets again, you acknowledge the hurt. You don't have to pretend it's fine. "I'm having a hard time with this because it feels like a pattern."

  ### 5. The Hard Truth
  There is a possibility that your brother is using his diagnosis as an identity rather than a condition to manage. "This is just how my brain works" can become a way to opt-out of the effort required to maintain relationships.

  Real love involves friction. By removing all friction, you have created a smooth, conflict-free surface that you can't actually walk on together.

  **You are allowed to be annoyed.**
  *   You are allowed to say, "I understand you have ADHD, but this behavior is damaging our relationship."
  *   You are allowed to say, "I love you, but I can't be around you when you're being irresponsible with my money."
  *   You are allowed to expect him to try.

  If you start holding boundaries, he might get upset. He might say you're being ableist or unsupportive. That is his reaction to manage, not yours. If you treat him like an adult capable of change, even if it leads to conflict, you are actually showing him more respect than treating him like a dog who chewed your shoe.

  **Summary:**
  Don't forgive in advance. Feel the annoyance. Use it as data to tell you where your boundaries are being crossed. Communicate the boundary clearly. Let him face the natural consequence (e.g., no more loans, less initiation of plans). That is how you build an adult relationship with him, rather than a caretaker one.
