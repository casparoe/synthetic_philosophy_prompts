          *   Source of Yield (Where does the money come from?).
          *   Risk Profile (Volatility, slashing, platform risk).
          *   Regulatory/Insurance (FDIC vs. nothing).
          *   Economic Utility (What value is being created?).
      *   **The "Feels Different" Aspect:** Address the psychological/ethical dimension (speculation vs. productivity).
      *   **Conclusion/Advice:** Summarize and suggest a balanced view.

  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the feeling. It's a smart question.
      *   *The Friend's Perspective (The Similarity):* Define "Passive Income." In all three cases, you provide capital, and you get more back. It's distinct from "Active Income" (labor).
      *   *The User's Intuition (The Differences):* This is the meat of the answer.
