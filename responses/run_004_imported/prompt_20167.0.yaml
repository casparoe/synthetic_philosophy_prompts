prompt: |-
  I've been putting a chunk of my savings into a crypto staking pool - you basically lock your coins up and the balance just grows by itself over time, no effort on my end at all. A friend who's really into this stuff says its no different from earning interest in a savings account or getting dividends off stocks, so I shouldn't overthink it. But honestly it bugs me a little - theres something that feels different between money that grows just from sitting there and the money I actually earn doing my job. Is my friend right that its all basically the same kind of thing, or is there an actual difference between these ways of making money that I just can't put my finger on?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Action:** The user is staking crypto (locking coins to earn rewards).
      *   **Friend's Argument:** It's the same as bank interest or stock dividends (passive income, no effort).
      *   **User's Intuition:** It *feels* different from earned income (salary/wages). Something bugs them.
      *   **Core Question:** Is the friend right (it's all the same), or is there a real difference the user is sensing?

  2.  **Initial Assessment & Fact-Checking:**
      *   *Friend's Point:* Superficially, yes. All three (staking, interest, dividends) are forms of "capital income" or "passive income" where money makes money.
      *   *User's Intuition:* Also valid. There are significant structural, risk, and economic differences between crypto staking, bank interest, and stock dividends.
      *   *Psychological Aspect:* The feeling that "money sitting there" vs. "labor" is different is a classic economic distinction (capital vs. labor), but the user is asking about the *types* of capital income.
      *   *Risk Profile:* Crypto staking is vastly riskier than FDIC-insured savings or blue-chip dividends.
      *   *Underlying Mechanism:* How is the yield generated? (Inflation/Protocol rewards vs. Bank lending profits vs. Corporate profits).
      *   *Regulatory/Tax:* Treated differently by governments.

  3.  **Structure the Response:**
