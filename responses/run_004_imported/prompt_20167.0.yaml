answer: |-
  Your intuition is serving you well here. Your friend is **superficially right**, but you are **fundamentally right**.

  On a mechanical level, your friend is correct: all three (staking, interest, dividends) are forms of **return on capital**. They are distinct from **return on labor** (your salary). In all three cases, you are deploying assets you already own to generate more assets without active hourly work.

  However, the reason it "bugs you" is that the *source* of that growth, the *risk* involved, and the *economic utility* behind them are vastly different. Treating crypto staking as identical to a savings account is a dangerous mental shortcut.

  Here is the breakdown of why your gut feeling is spotting real differences.

  ### 1. Where does the money come from?
  This is the biggest economic difference.

  *   **Savings Account Interest:** The bank takes your money and lends it to someone else (for a mortgage, a business loan, etc.). The borrower pays interest to the bank, and the bank shares a slice of that with you. The yield comes from **real-world economic activity and debt repayment.**
  *   **Stock Dividends:** A company makes a profit from selling goods or services. They decide to share a portion of those profits with shareholders. The yield comes from **corporate productivity and profit.**
  *   **Crypto Staking:** This varies by protocol, but generally, the rewards come from two places: **transaction fees** paid by users of the network, or **newly minted coins** (inflation).
      *   *The Catch:* If the rewards are mostly newly minted coins, you aren't necessarily earning a share of profit; you are being paid in diluted currency. If the price of the coin drops faster than your staking reward, your real purchasing power decreases even though your "balance grew."

  ### 2. The Risk Profile (The "Sleep at Night" Factor)
  Your friend says you shouldn't overthink it, but risk management *is* the thinking you should be doing.

  *   **Savings Account:** In the US, FDIC insured up to $250k. The principal is effectively risk-free. The dollar amount does not go down.
  *   **Stocks:** The share price fluctuates. You can lose principal. However, you own a legal claim on a company's assets and cash flows.
  *   **Crypto Staking:** You face **triple risk**:
      1.  **Market Risk:** The coin price could drop 50% while you earn 10% staking rewards. (Net loss).
      2.  **Protocol Risk:** "Slashing." If the validator node you stake with misbehaves or goes offline, the protocol can confiscate a portion of your staked coins as a penalty.
      3.  **Platform/Smart Contract Risk:** If the staking pool gets hacked, or the code has a bug, or the exchange holding your coins goes bankrupt (like FTX or Celsius), you can lose 100% of your principal. There is no FDIC for crypto.

  ### 3. Liquidity and "Lock-Up"
  You mentioned you "lock your coins up."

  *   **Savings:** Even with a CD (Certificate of Deposit), there is a clear legal framework for early withdrawal (usually just a fee).
  *   **Stocks:** You can sell instantly during market hours.
  *   **Crypto:** Many staking protocols have "unbonding periods." If you decide you want out, you might have to wait 7 to 21 days to get your coins back. If the market crashes during that unbonding period, you are trapped and cannot sell until the timer runs out.

  ### 4. Why it "Bugs You" (The Psychological/Value Aspect)
  You mentioned it feels different from money earned doing your job. That is the distinction between **Labor** and **Capital**.

  *   **Labor Income:** You trade time and skill for money. It feels "earned" because there is a direct causal link between your effort and the reward.
  *   **Capital Income:** You trade risk and ownership for money.

  The reason staking might feel *more* abstract than dividends is that dividends are tied to companies that (usually) make tangible things or provide services. Staking rewards are tied to the security of a digital ledger.
  *   **Your intuition is telling you:** "Is this yield sustainable, or is it just speculation?"
  *   **The Reality:** In crypto, high yields are often a lure to attract liquidity to a risky asset. In the traditional world, low yields are the price you pay for safety.

  ### The Verdict
  Your friend is right that **categorically**, it is passive income. You aren't working for it.

  But you are right that **practically**, it is not the same.
  *   A savings account is **preservation of capital** with a small bonus.
  *   Dividends are **ownership in productivity**.
  *   Crypto staking is **yield seeking in a speculative asset class**.

  **Advice:** Don't let your friend's confidence lower your guard. The fact that it "bugs you" is a healthy sign of risk awareness.
  1.  **Never stake more than you can afford to lose.**
  2.  **Calculate returns in fiat (dollars), not coins.** If you earn 10% APY but the coin drops 20% in value, you lost money.
  3.  **Diversify.** If your friend treats it like a savings account, they are over-concentrated. A savings account is a foundation; crypto staking should be a satellite holding.

  Your intuition is protecting you. Listen to it.
