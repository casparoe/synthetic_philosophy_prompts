answer: |-
  # Handout: The Miller-Tichý Theorem and Popperian Verisimilitude
  **Course:** Graduate Seminar in Philosophy of Science  
  **Topic:** The Collapse of Popper's Qualitative Definition of Truthlikeness  

  ---

  ## 1. Popper's Qualitative Definition
  In *Conjectures and Refutations* (1963), Karl Popper sought to articulate how science progresses toward the truth even if our theories remain strictly false. He proposed a qualitative definition of **verisimilitude** ($Vs$).

  Let $Ct(A)$ be the set of all logical consequences of theory $A$. We divide this into:
  *   **Truth-Content** ($Ct_T(A)$): The subset of $Ct(A)$ consisting of true propositions.
  *   **Falsity-Content** ($Ct_F(A)$): The subset of $Ct(A)$ consisting of false propositions.

  **Definition:** Theory $A$ has greater verisimilitude than theory $B$ ($Vs(A) > Vs(B)$) if and only if:
  1.  $Ct_T(A) \supseteq Ct_T(B)$ **and** $Ct_F(A) \subset Ct_F(B)$;  
      *OR*
  2.  $Ct_T(A) \supset Ct_T(B)$ **and** $Ct_F(A) \subseteq Ct_F(B)$.

  *(In plain English: To be closer to the truth, a theory must have at least as much truth-content and strictly less falsity-content, OR strictly more truth-content and no more falsity-content.)*

  ---

  ## 2. A Concrete Counterexample
  Consider a simple empirical domain regarding the current weather. We define three atomic propositions:
  *   $h$: It is hot.
  *   $r$: It is raining.
  *   $w$: It is windy.

  **The Actual State of Affairs (The Truth):**  
  $h \land r \land w$ (It is hot, rainy, and windy).

  Now, consider two competing theories offered by meteorologists:

  **Theory 1 ($T_1$):** "It is cold and dry."  
  *   Logical Form: $\neg h \land \neg r$  
  *   (Note: $T_1$ is silent regarding the wind; $w$ could be true or false.)

  **Theory 2 ($T_2$):** "It is cold, dry, and windy."  
  *   Logical Form: $\neg h \land \neg r \land w$

  ### Intuitive Judgment
  Virtually everyone would judge **$T_2$ to be closer to the truth than $T_1$**.
  *   Both theories are false (since it is actually hot and rainy).
  *   However, $T_2$ gets the wind condition right, whereas $T_1$ offers no information on the wind.
  *   $T_2$ is logically stronger than $T_1$ and includes an additional truth ($w$) without negating any truth that $T_1$ might have accidentally captured (neither captures $h$ or $r$). $T_2$ is simply more informative and accurate regarding the wind.

  ---

  ## 3. Why Popper's Definition Fails
  Despite the intuitive judgment, Popper's definition cannot rank $T_2$ as superior to $T_1$. In fact, it renders them incomparable regarding verisimilitude.

  **Step 1: Establish Logical Relations**
  $T_2$ entails $T_1$ ($\neg h \land \neg r \land w \vdash \neg h \land \neg r$).  
  Therefore, the content of $T_2$ includes the content of $T_1$:  
  $$Ct(T_1) \subset Ct(T_2)$$

  **Step 2: Analyze Falsity-Content**
  Since $T_1$ is false, it has non-empty falsity-content. Because $T_2$ entails $T_1$, every false consequence of $T_1$ is also a false consequence of $T_2$.  
  Furthermore, $T_2$ itself is a false consequence of $T_2$, but $T_2$ is *not* a consequence of $T_1$ (since $T_1$ is weaker).  
  Therefore:  
  $$Ct_F(T_1) \subset Ct_F(T_2)$$  
  *(The falsity-content of $T_2$ is strictly larger than that of $T_1$.)*

  **Step 3: Analyze Truth-Content**
  $T_2$ entails $w$, and $w$ is true. $T_1$ does not entail $w$.  
  Therefore:  
  $$Ct_T(T_1) \subset Ct_T(T_2)$$  
  *(The truth-content of $T_2$ is strictly larger than that of $T_1$.)*

  **Step 4: Apply Popper's Definition**
  To claim $Vs(T_2) > Vs(T_1)$, Popper requires that as truth-content increases, falsity-content must **not** increase (Condition 2 above).  
  However, we have shown that **both** truth-content and falsity-content increase simultaneously when moving from $T_1$ to $T_2$.

  *   $Ct_T(T_2) \supset Ct_T(T_1)$ (Good)
  *   $Ct_F(T_2) \supset Ct_F(T_1)$ (Bad for Popper's definition)

  Because the falsity-content condition ($Ct_F(T_2) \subseteq Ct_F(T_1)$) is violated, Popper's definition **cannot** vindicate the judgment that $T_2$ is closer to the truth. This is the essence of the **Miller-Tichý Theorem (1974)**: For any two false theories where one entails the other, the stronger theory can never be deemed more verisimilar than the weaker one.

  ---

  ## 4. Assessment of Possible-Worlds 'Likeness' Measures
  In response to this collapse, philosophers such as Tichý (1974), Niiniluoto (1987), and Oddie (1986) proposed quantifying verisimilitude using **possible-worlds semantics**.

  **The Approach:**
  1.  Represent the logical space as a set of possible worlds (e.g., the 8 combinations of $h, r, w$).
  2.  Define a **distance function** $d(w_i, w_j)$ between worlds (e.g., the number of differing atomic propositions).
  3.  Measure the verisimilitude of a theory $T$ by the distance between the actual world ($w_{actual}$) and the worlds allowed by $T$. Common measures include the *minimum distance* or the *average distance* (sum of distances divided by the number of worlds).

  **Application to Our Example:**
  *   **Actual World:** $(h, r, w) = (1, 1, 1)$.
  *   **$T_1$ allows:** $\{(0, 0, 0), (0, 0, 1)\}$. (Cold/Dry/Still OR Cold/Dry/Windy).
      *   Distances from actual: $3$ (differs on $h,r,w$) and $2$ (differs on $h,r$).
      *   Average Distance: $2.5$.
  *   **$T_2$ allows:** $\{(0, 0, 1)\}$. (Cold/Dry/Windy).
      *   Distance from actual: $2$ (differs on $h,r$).
      *   Average Distance: $2.0$.

  **Verdict:**
  Since a lower average distance indicates greater likeness to the truth, the possible-worlds measure correctly ranks **$Vs(T_2) > Vs(T_1)$**. Unlike Popper's content-based account, likeness measures can accommodate the intuition that a false theory can be improved by adding true content, even if the theory remains false overall.

  ---

  ### Selected References
  *   Miller, D. (1974). "Popper's Qualitative Theory of Verisimilitude." *British Journal for the Philosophy of Science*.
  *   Niiniluoto, I. (1987). *Truthlikeness*. Reidel.
  *   Popper, K. R. (1963). *Conjectures and Refutations*. Routledge.
  *   Tichý, P. (1974). "On Popper's Definitions of Verisimilitude." *British Journal for the Philosophy of Science*.
