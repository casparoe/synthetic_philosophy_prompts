      *   *Correction:* The user wants to know if the *inferential move* holds. I need to focus on the validity of the inference "Custom $\rightarrow$ No Normative Force" within Spinozism.

  6.  **Final Polish:** Organize into clear sections. Ensure the distinction between "metaphysical necessity" and "causal necessity of affects" is clear. (Proceed to generate output based on this structure.)

      *   *Key Concept:* *Conatus*. Women have *conatus*. Why doesn't it count? Because their *conatus* is overwhelmed by affects in the political context?
