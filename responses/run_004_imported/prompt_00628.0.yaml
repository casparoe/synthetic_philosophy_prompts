          *   Therefore, saying "it's just custom" doesn't dissolve the lack of right. It explains the *cause* of the lack of power.
      *   **Section 3: Engaging TP Chapter 11 Specifically.**
          *   Look at the text. Spinoza isn't making a metaphysical claim about women's souls. He's making a *political engineering* claim.
          *   His argument: Joint rule leads to jealousy $\rightarrow$ conflict $\rightarrow$ state collapse.
          *   For Spinoza, the goal of the state is *stability* (preservation of the multitude). If including women destabilizes the state (due to actual existing affects), the sovereign *cannot* include them without undermining its own power (and thus its right).
          *   This makes the exclusion a matter of *prudential necessity* given current human affects, not metaphysical essence.
      *   **Section 4: Addressing the "Consistent Spinozist" Counterfactual.**
          *   Could a Spinozist argue for inclusion? Yes, *but* only by showing that including women would *increase* the collective power (*potentia multitudinis*).
          *   The friend's argument ("it's custom") is insufficient. The argument must be: "We can change the custom such that women's inclusion increases power."
          *   Spinoza seems to think the affects (jealousy) are too entrenched to change safely. He might be empirically wrong, but his *logic* holds: Right follows effective Power.
      *   **Section 5: The Limit of the User's Defense (Where it might break).**
