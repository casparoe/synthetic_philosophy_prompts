      *   **The Friend's Objection:** This is an inconsistency. Spinoza usually explains away fixed traits as artifacts of imagination/custom (e.g., in the *Ethics*). A "consistent Spinozist" should apply this debunking to women's subordination and argue for inclusion.
      *   **The User's Counter-Intuition:** The friend's rescue is too quick. It smuggles in a nature/convention distinction Spinoza tries to dissolve. For Spinoza, *right is co-extensive with power* (TP Ch. 2). If custom produces a power differential, that differential *is* natural right, regardless of its origin. Therefore, pointing out it's "custom" doesn't automatically invalidate the exclusion *within Spinoza's framework*.
      *   **Task:** Rigorously articulate the user's case. Engage with TP Chapter 11's structure. Address the strongest form of the friend's objection (including Hasana Sharp's *Ethics* comparison). Determine if the inferential move ("it's custom, not nature" $\rightarrow$ "Spinozist has no reason to endorse it") holds water.
      *   **Goal:** Not necessarily to defend Spinoza's sexism as morally good, but to test the *philosophical consistency* of the friend's critique vs. the user's defense of Spinoza's internal logic.

  2.  **Deconstruct the Philosophical Stakes:**
      *   **Spinoza's Naturalism:** *Potentia* (power) = *Jus* (right). Whatever happens is natural. There is no "dominion within a dominion."
      *   **The Friend's Move:** Relies on a normative gap. "It's just custom" implies "it *ought* not to be." But Spinoza's political science is descriptive/realist first.
      *   **The User's Move:** If women lack power *because* of custom/affects, they lack natural right *in that context*. To argue they *should* have right, one must show they *can* have power. Spinoza argues they *can't* (due to affects).
      *   **Key Tension:** Is Spinoza's claim about women a *normative exclusion* based on a *descriptive claim* about power? Or is it a *descriptive claim* that fails scrutiny?
      *   **Hasana Sharp's Argument:** In *Spinoza and the Politics of Renaturalization*, Sharp argues Spinoza's naturalism *should* lead to egalitarianism because differences are imaginative. But does Spinoza follow his own logic in the TP?

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the depth of the debate. Validate the user's intuition: the friend's critique relies on a normative leap Spinoza's metaphysics complicates.
