      *   *Wait, one nuance:* Spinoza says women are *not* sui juris. Why? Because they are in the power of men (husbands/fathers). This is a claim about *actual* power relations, not just metaphysical capacity. This supports the user's view.

      *   *Refining the Friend's Best Argument:* The friend shouldn't just say "it's custom." The friend should say "Spinoza's own theory of affects suggests these customs *can* be changed to increase power." Spinoza fails to apply his own therapeutic optimism to this specific case.

