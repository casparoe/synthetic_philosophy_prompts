answer: |-
  You have excellent instincts. Your nagging sense that "internal" is not simply a synonym for "self-interested" is correct, and that distinction is the hinge on which the whole debate turns. If you publish the summary you provided, you will likely draw fire from philosophers (both Williams-defenders and critics) for conflating *psychological motivation* with *selfishness*.

  Here is a breakdown of the distinction, where your summary needs calibration, and how this impacts the question of demanding morality and Effective Altruism.

  ### 1. The Internal/External Distinction: Correcting the Record

  Your summary states: *"An internal reason is one you have simply because you already want something... an external reason, by contrast, is supposed to bind you regardless of what you happen to want."*

  This is the common shorthand, but it is technically imprecise in a way that matters for your article.

  **The Subjective Motivational Set (S)**
  Williams argues that for an agent $A$ to have a reason to $\phi$ (act), there must be a "sound deliberative route" from $A$'s **Subjective Motivational Set** (which Williams labels *S*) to $\phi$-ing.

  The crucial correction is this: *S* is not just a bag of selfish desires (hunger, lust, comfort). Williams explicitly states that *S* can include:
  *   Dispositions of evaluation.
  *   Patterns of emotional reaction.
  *   Personal loyalties.
  *   **Moral commitments.**

  If I have a commitment to justice in my *S*, then I have an *internal* reason to fight injustice. That reason is internal because it flows from *my* psychology, but it is not "self-interested" in the narrow sense.

  **The Real Distinction**
  *   **Internal Reason:** A reason statement is true only if the agent could reach the action through rational deliberation starting from their existing *S*. (Note: "Rational deliberation" includes correcting factual errors and thinking through means-ends relationships).
  *   **External Reason:** A reason statement is true even if there is *no* sound deliberative route from the agent's *S* to the action. It claims the reason exists "out there" in the universe, waiting to be apprehended, regardless of the agent's psychology.

  Williams' skepticism is not that we shouldn't help strangers; it is that saying "You have a reason to help strangers even if you care nothing for them and no commitment to morality" is metaphysical nonsense. It posits a "reason" that has no grip on the agent's will.

  ### 2. Does Williams Let the Apathetic Person "Off the Hook"?

  This is the crux of your magazine feature. If a person genuinely has no altruistic elements in their *S* (no empathy, no moral commitment, no desire for social approval), does Williams say they have no reason to donate to malaria nets?

  **Yes, broadly speaking.**
  Williams argues that if there is no link to *S*, the statement "He has a reason to help" is false. However, Williams adds two crucial nuances that prevent this from being a simple "get out of jail free" card for sociopaths.

  **Nuance A: The Sound Deliberative Route**
  We often underestimate what is in a person's *S*. Most people have *some* general dispositions (e.g., "I don't like suffering," or "I want to be a respectable person"). A philosopher like Peter Singer can argue that *if* you accept premise X (which is in your *S*), consistency demands you accept conclusion Y (donating money).
  *   **On Williams' terms:** Singer is not invoking an external reason. He is showing the agent that their *existing* internal commitments logically entail a demanding obligation they haven't realized yet.
  *   **The Limit:** If the agent says, "I truly do not care about suffering, nor about consistency, nor about respectability," Williams admits the internal reason vanishes.

  **Nuance B: Blame vs. Reason**
  Williams distinguishes between *having a reason* and *being blamed*. We can still blame the apathetic person. We can say, "You ought to have cared." But for Williams, this "ought" is not a report of a rational requirement; it is a social tool. We blame them to *modify their S* for the future. We are trying to give them a new internal reason (e.g., fear of sanction, or shame) by applying pressure.

  So, Williams does not say the apathetic person is "good." He says the claim that they are "irrational" is unfounded if their *S* is coherent, however repulsive.

  ### 3. Williams and the "Demandingness" of Morality

  You asked if Williams' internalism amounts to a rejection of demanding, impartial obligations.

  **Yes, but for a specific reason.**
  Williams is famous for the **"Integrity Objection"** against Utilitarianism (the philosophical backbone of Effective Altruism). He argues that demanding impartial morality treats agents as mere channels for the satisfaction of outcomes, disregarding their "ground projects"—the commitments that give their lives meaning (e.g., art, family, specific passions).

  If morality demands you abandon your ground projects to maximize utility, Williams argues this alienates you from your own actions. It attacks your integrity.
  *   **Internalism supports this:** Since reasons must flow from *S*, and *S* contains your ground projects, a moral theory that demands you ignore *S* is asking you to act without reasons (from your perspective).

  Therefore, Williams is indeed a foe of the "more demanding wing" of Effective Altruism, *if* that wing claims there is a rational requirement to maximize good regardless of personal commitment. He would view the demand itself as a misunderstanding of how human agency works.

  ### 4. Can One Accept Williams and Maintain We Owe a Great Deal to Strangers?

  This is the synthesis you need for your readers. Can you be a Williamsian Internalist and still believe in demanding obligations?

  **Option 1: The Singer Strategy (Internalize the Demand)**
  Peter Singer can accept Williams' internalism but argue that almost all normal humans *do* have the relevant elements in their *S*.
  *   *Argument:* "You believe suffering is bad. You believe distance is morally irrelevant. Therefore, you have an internal reason to donate."
  *   *Result:* The obligation is demanding, but it is grounded in the agent's existing psychology. The "error" the apathetic person makes is not ignoring an external law, but failing to deliberate soundly from their own values.
  *   *Williams' Retort:* Williams would say this works for most people, but not all. And for those it doesn't work on, there is no *rational* error, only a lack of shared sentiment.

  **Option 2: The Cultivation Strategy (Williams' View)**
  You can maintain we owe a great deal to strangers, but you must change the *status* of that claim.
  *   Instead of saying: "It is a rational truth that you must help."
  *   You say: "We must cultivate a society where people *want* to help."
  *   On this view, morality is not about discovering external reasons; it is about ethical education, sentiment cultivation, and political structures that align individual *S* sets with collective needs.

  **Option 3: Reject Williams (The Externalist Realist)**
  Many contemporary moral realists (like Derek Parfit or T.M. Scanlon) argue Williams is wrong. They argue there *are* external reasons. They would say the apathetic person *is* making a rational error, akin to a mathematical error, regardless of their desires.
  *   *For your article:* If you want to defend the EA position against Williams, you would need to cite philosophers who argue that rationality itself generates reasons (e.g., "It is irrational to not care about suffering, period").

  ### Summary for Your Feature

  To ensure your philosophy is tight, I recommend these adjustments to your working thesis:

  1.  **Don't equate Internal with Selfish.** Clarify that Williams' "internal reasons" include moral commitments, provided the agent actually holds them. The distinction is about the *source* of the reason (the agent's psychology), not the *content* (self vs. other).
  2.  **The "Off the Hook" nuance.** Williams does not say the apathetic person is *moral*. He says they are not *irrational*. This is a subtle but vital difference. It shifts the critique from "You made a mistake in reasoning" to "You lack the correct sentiments."
  3.  **The EA Conflict.** The conflict isn't just about demandingness; it's about the **source of authority**. EA (following Singer/Utilitarianism) tends to posit reasons that exist independently of the agent's projects (maximize the good). Williams argues reasons must be anchored in the agent's projects.
  4.  **The Verdict.** You *can* consistently accept Williams' skepticism and maintain we owe a lot to strangers, but you must frame that "owe" as a social hope or a cultivation of character, rather than a demand of abstract rationality. If you insist it is a demand of rationality binding on all agents regardless of desire, you are committed to External Reasons, and Williams (and his successors) will argue you are positing a metaphysical fiction.

  **The Pitch:**
  "Williams doesn't let the selfish person off the hook morally; he lets them off the hook *rationally*. For Williams, if you want to demand more of people, you cannot simply point to the stars and cite a duty. You have to reach into their hearts and find something to pull on. If there's nothing there, philosophy cannot create it out of thin air."

  This captures the stakes without misrepresenting the technical machinery.
