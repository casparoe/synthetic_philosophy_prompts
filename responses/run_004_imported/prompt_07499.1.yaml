          *   *Correction 3:* The "Sound Deliberative Route." This allows for expansion. If I want X, and X requires Y, I have a reason to do Y. If I value being a "good person," I might have a reason to help strangers. The constraint is the *starting point* must be in S.

      *   **Q2: Does Williams reject demanding, impartial obligations?**
