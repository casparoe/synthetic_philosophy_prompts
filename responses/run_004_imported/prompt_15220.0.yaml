prompt: |-
  I chair my university's Academic Integrity Board, which can impose sanctions ranging from a warning to expulsion but currently applies one evidentiary standard, 'clear and convincing evidence,' to every case. A subcommittee proposes a sliding scale instead -- easier to prove for a warning, harder for expulsion -- and members disagree about why this would be justified. Some argue that the same evidence can amount to knowledge that a student cheated when only a warning is at stake but not when expulsion is -- echoing pragmatic encroachment; others reply that the facts never change, only the contextually salient standard for 'proven' does -- closer to epistemic contextualism; a third group worries that either way, letting the sanction fix what counts as proven makes guilt depend on our choice of punishment. Please draft the short decision memo I'll bring to the Board: recommend a specific evidentiary policy, say which (if either) of these framings it commits us to, and engage seriously with the strongest objection to your recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the University's Academic Integrity Board (AIB).
      *   **Task:** Draft a short decision memo for the Board.
      *   **Current Policy:** Single evidentiary standard ("clear and convincing evidence") for all sanctions (warning to expulsion).
      *   **Proposal:** A sliding scale (easier to prove for minor sanctions, harder for major sanctions).
      *   **The Debate:**
          *   *View 1 (Pragmatic Encroachment):* The stakes change whether the evidence counts as knowledge/proof.
          *   *View 2 (Epistemic Contextualism):* The facts don't change, but the meaning of "proven" shifts with context.
          *   *View 3 (Objection):* Making guilt depend on punishment is unjust (tailoring truth to consequences).
      *   **Requirements:**
          1.  Recommend a specific evidentiary policy.
          2.  Identify which philosophical framing (if either) the recommendation commits to.
          3.  Engage seriously with the strongest objection.
          4.  Format: Short decision memo.

  2.  **Determine the Recommendation:**
      *   *Option A: Keep Current Policy (Single Standard).* Pros: Consistency, avoids the "guilt depends on punishment" objection. Cons: Might be too harsh for minor infractions (risk of false positives with high stakes) or too lenient for major ones (risk of false negatives).
      *   *Option B: Adopt Sliding Scale.* Pros: Proportionality, aligns with legal standards (preponderance vs. beyond reasonable doubt), reduces risk of catastrophic error (expelling an innocent person). Cons: Philosophical confusion, potential perception of unfairness.
      *   *Decision:* In administrative law and university settings, a sliding scale is often practically superior because the *cost of error* varies. Expelling an innocent student is a much greater harm than issuing a warning to a guilty student. However, the prompt asks me to engage with the *epistemic* arguments provided.
      *   *Refinement:* The most robust administrative approach is usually to keep the *standard of proof* constant but vary the *sanction* based on the strength of evidence, OR to adopt a sliding scale of proof based on the severity of the sanction (like criminal vs. civil law).
      *   *Choosing the Path:* The prompt sets up a debate about *why* a sliding scale might be justified (Encroachment vs. Contextualism) vs. the objection that it's wrong. To make the memo interesting and responsive to the prompt's philosophical setup, I should recommend the **Sliding Scale**. Why? Because it allows me to directly address the philosophical framings provided in the prompt. If I recommend the status quo, I dismiss the subcommittee's work too easily.
      *   *Wait, a better administrative move:* Actually, the strongest *administrative* position often aligns with the "Preponderance of Evidence" for most academic misconduct, reserving "Clear and Convincing" for expulsion. But the prompt says the *current* standard is "Clear and Convincing" for *everything*. Moving to a sliding scale means lowering the bar for warnings.
      *   *Philosophical Alignment:* The "Pragmatic Encroachment" view is generally more defensible in ethics/policy than Contextualism here. It acknowledges that practical stakes affect rational belief/action thresholds.
      *   *Recommendation:* Adopt a sliding scale (Preponderance for warnings/probation; Clear and Convincing for suspension/expulsion).
      *   *Philosophical Commitment:* Pragmatic Encroachment (stakes affect justification).
      *   *Objection:* The "Guilt depends on punishment" objection (View 3).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (decision on evidentiary standards).
      *   **Recommendation:** Clearly state the new policy (Sliding Scale).
      *   **Philosophical Justification:** Address the Encroachment vs. Contextualism debate.
          *   *Analysis:* Contextualism suggests the word "proven" changes meaning. Encroachment suggests the *justification* for belief changes based on stakes.
          *   *Choice:* Pragmatic Encroachment is the better fit. We aren't changing the definition of truth; we are acknowledging that the *risk tolerance* for being wrong changes with the severity of the outcome. It is rational to require more evidence to believe $P$ if acting on $P$ causes great harm.
      *   **Addressing the Objection:** The "Guilt depends on punishment" argument.
          *   *Counter:* We aren't saying the student *is* more or less guilty. We are saying our *confidence threshold for action* must vary. We distinguish between "ontological guilt" (did they do it?) and "administrative certainty" (are we sure enough to act?). This avoids the trap of making truth relative to punishment.
      *   **Conclusion:** Summary of next steps.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is Pragmatic Encroachment the right label? In epistemology, Pragmatic Encroachment says knowledge depends on practical stakes. In law/policy, we usually talk about "Standards of Proof" reflecting "Risk of Error."
      *   *Adjustment:* I need to map the philosophical terms to the policy terms carefully. The prompt asks which framing the policy *commits us to*. If we adopt a sliding scale, we are effectively saying the *justification for asserting guilt* varies by stakes. That is Encroachment. Contextualism would say the word "guilty" means something different in a warning hearing vs. an expulsion hearing. That's linguistically messy. Encroachment is cleaner: The proposition is the same, but the justification required to act on it shifts.
      *   *Objection Handling:* The strongest objection is that this violates the principle that "facts are facts." I need to clarify that the *fact* of cheating is binary, but the *Board's epistemic position* required to intervene is variable.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, decisive, intellectually rigorous (since it's for a Board familiar with these arguments).
      *   *Length:* "Short decision memo" (approx. 500-800 words).
      *   *Key Distinction:* Distinguish between *metaphysical guilt* (did the act occur?) and *procedural certainty* (are we sure enough to punish?).

  6.  **Final Polish:** Check against constraints.
      *   Recommend specific policy? Yes (Sliding scale).
      *   Say which framing? Yes (Pragmatic Encroachment).
      *   Engage strongest objection? Yes (The "guilt depends on punishment" worry).

      *(Self-Correction during drafting)*: I should be careful not to fully endorse "Pragmatic Encroachment" as a universal epistemic theory, but rather as the working logic of the policy. The policy *operates* on encroachment principles.

      *Revised Plan for Objection:* The objection is that this makes *guilt* depend on punishment. The rebuttal is that the policy doesn't change *guilt*, it changes the *threshold for institutional action*. This aligns with the "risk of error" distribution in legal theory (Blackstone's ratio).

  7.  **Final Review of the Prompt's Specific Philosophical Terms:**
      *   *Pragmatic Encroachment:* Same evidence = knowledge in low stakes, not in high stakes.
      *   *Epistemic Contextualism:* Meaning of "known/proven" shifts.
      *   *Objection:* Guilt depends on punishment.
      *   *My Stance:* I will argue the sliding scale is best justified by a *regulated* form of Pragmatic Encroachment, but I must clarify that we are not altering the *fact* of cheating, only the *justification for sanction*.

      *Wait, one nuance:* If I adopt a sliding scale, am I saying the *evidence* amounts to knowledge in one case but not the other? Yes, that is exactly what Encroachment says. Contextualism says the word "knowledge" just means different things. Encroachment is more honest about the tension. I will stick with Encroachment but refine it to avoid the "truth is relative" trap.

      *Actually, looking at administrative law:* Most universities use "Preponderance" for everything (Title IX etc.). But this prompt specifies the current standard is "Clear and Convincing." Moving to a sliding scale means *lowering* it for minor offenses.
      *Policy:* Warnings/Probation = Preponderance of Evidence. Suspension/Expulsion = Clear and Convincing.
      *Justification:* This aligns the risk of error with the severity of harm.

      *Let's write.*

      *(Final thought before writing)*: Ensure the tone is appropriate for a Chair addressing faculty/staff. It needs to be authoritative but respectful of the philosophical disagreement.

      *Structure:*
      1. Header.
      2. Decision.
      3. Philosophical Commitment (Encroachment).
      4. Addressing the Objection (Guilt vs. Action).
      5. Implementation.

      *Wait, I need to make sure I don't get too bogged down in jargon.* Keep it accessible but precise.

      *Objection Refinement:* The objection is "letting the sanction fix what counts as proven makes guilt depend on our choice of punishment."
      *Rebuttal:* We are not defining guilt by punishment. We are defining the *necessary confidence level* to impose punishment. The student either cheated or didn't. But our *right to act* on that belief requires higher confidence when the harm of acting wrongly is higher.

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** Chair, Academic Integrity Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Evidentiary Standards and Sanction Proportionality

  **Decision**
  After reviewing the subcommittee's proposal and the subsequent debate, I am recommending that the Board adopt a **sliding scale of evidentiary standards**. Effective immediately, cases resulting in minor sanctions (warnings, educational probation) will be decided by a *preponderance of the evidence* standard. Cases resulting in severe sanctions (suspension, expulsion, degree revocation) will retain the *clear and convincing evidence* standard.

  **Philosophical Commitment**
  This policy commits the Board to a framework of **Pragmatic Encroachment**, rather than Epistemic Contextualism.

  The Contextualist argument suggests that the word "proven" simply means something different in a warning hearing than in an expulsion hearing. This is linguistically convenient but intellectually dishonest; it obscures the reality that we are dealing with the same factual proposition ("The student cheated").

  Pragmatic Encroachment offers a more robust justification. It acknowledges that the *facts* do not change, but the *justification required to act* on those facts does. Under this view, the same body of evidence may rationally justify a belief sufficient for a warning (low stakes) but fail to justify a belief sufficient for expulsion (high stakes). We are not altering the definition of truth; we are acknowledging that the rational threshold for asserting truth varies based on the practical consequences of being wrong.

  **Addressing the Strongest Objection**
  The most serious objection raised during deliberation is that this approach "makes guilt depend on our choice of punishment." Critics argue that a student is either guilty or innocent, and tying the standard of proof to the sanction implies that a student could be "guilty enough" for a warning but "not guilty enough" for expulsion.

  This objection conflates **ontological guilt** with **procedural certainty**.

  Our policy does not assert that the student's actions change based on the potential sanction. The student either plagiarized or they did not; that reality is binary and independent of our process. What changes is not the *fact* of the misconduct, but the *Board's epistemic right to intervene*.

  When the potential harm of a false positive is minor (a warning), the Board accepts a higher risk of error to maintain efficiency and accountability. When the potential harm of a false positive is catastrophic (expulsion), we must minimize the risk of error, requiring greater certainty. We are not saying the student is "more guilty" in the latter case; we are saying that our *confidence* must be higher before we inflict severe harm. This aligns with the legal principle that it is worse to convict an innocent person of a felony than of a misdemeanor, even if the factual evidence is identical.

  **Implementation**
  The Board will update its procedures to reflect this two-tiered standard. Hearing officers will be trained to distinguish between the *finding of fact* (which remains binary) and the *confidence threshold* required to impose specific sanctions. This ensures our process is both philosophically coherent and ethically proportionate to the stakes involved.
