answer: |-
  This is a fantastic case study. It's rare to get a real-world application of *anatta* (no-self) that isn't just vague spiritual bypassing, but actually attempts a metaphysical defense of moral non-responsibility.

  Your instinct is correct: R is smuggling in a premise that the Buddhist tradition itself explicitly rejects. She is conflating *ontological reductionism* (there is no permanent self) with *ethical nihilism* (therefore there are no consequences).

  Here is a breakdown of where her argument fails, drawing from both Buddhist metaphysics (specifically the Abhidharma and Madhyamaka traditions) and the analytic tradition (Parfit and Strawson), which you can use to structure the lesson.

  ### 1. The Buddhist Internal Critique: The Two Truths and Karma

  R's argument fails on internal Buddhist grounds. She is treating the "no-self" doctrine as an *ultimate truth* that invalidates *conventional truth*, but Buddhist ethics relies on the coherence of the two.

  **The Doctrine of Two Truths (*Satyadvaya*)**
  In almost all Buddhist schools, there is a distinction between:
  *   **Ultimate Truth (*Paramārtha-satya*):** From the perspective of enlightenment, there are no enduring entities, only momentary dharmas (phenomena) arising and ceasing.
  *   **Conventional Truth (*Saṃvṛti-satya*):** From the perspective of lived experience, persons, tables, and promises exist and function.

  The Buddha famously refused to answer metaphysical questions about the self when they interfered with the practical goal of ending suffering. However, he was unequivocal about **Karma**. Karma *requires* causal continuity. If R argues that "dinner-R" is not responsible for "college-R," she is denying the transmission of karmic seeds (*bija*).

  **The *Santana* (Continuum)**
  Buddhism replaces the "self" with the *santana*, or mental continuum. Think of it like a flame passed from one candle to another. The flame on the second candle is not numerically identical to the flame on the first (the fuel is different, the moment is different), but it is causally dependent on it.
  *   **R's Mistake:** She treats the lack of numerical identity as a break in causal responsibility.
  *   **The Correction:** In Buddhism, you inherit your karma precisely *because* there is no self to escape it. The suffering caused by the lie is part of the continuum that constitutes "R." To deny responsibility is to commit *ucchedavada* (nihilism), which the Buddha identified as a wrong view that leads to harmful action.

  **Classroom Takeaway:** You can't use metaphysics to opt out of ethics. If the "no-self" view leads to behaving harmfully (lying, refusing amends), it is, by Buddhist pragmatic standards, a *wrong* view. Right View (*Samma Ditthi*) includes belief in karma and its results.

  ### 2. The Parfitian Connection: Reductionism without Irresponsibility

  This is where Derek Parfit's *Reasons and Persons* (Part III) becomes incredibly relevant. Parfit argues for a Reductionist view of personal identity that looks very similar to the Buddhist one: there is no "further fact" of identity beyond physical and psychological continuity.

  **R's Argument via Parfit:**
  R is arguing that because Identity (I) is not deep, Responsibility (R) cannot hold.
  $$ \text{No Deep Self} \rightarrow \text{No Identity} \rightarrow \text{No Responsibility} $$

  **Parfit's Counter:**
  Parfit argues that Identity isn't what matters; **Relation R** (psychological connectedness and continuity) is what matters.
  *   Even if "College-R" and "Dinner-R" are not the *same substance*, they are linked by memory, character traits, and causal chains.
  *   Parfit suggests that realizing identity is shallow should make us *more* concerned with others, not less concerned with our own obligations.
  *   Crucially, Parfit distinguishes between **identity** and **survival**. Dinner-R *survived* from College-R. The locus of the agency has continued.

  **The "Debt" Objection:**
  If I take out a loan at 20 and pay it off at 40, the bank doesn't care if my cells have turned over or if my "self" is an illusion. They care about the **causal locus of benefit**.
  *   Did College-R gain something from the lie (e.g., avoiding trouble, maintaining a reputation)?
  *   Does Dinner-R currently hold the benefits of that lie (e.g., a relationship built on that trust)?
  *   If Dinner-R holds the assets of the past agency, she inherits the liabilities.

  **Classroom Takeaway:** Responsibility tracks **psychological continuity and causal benefit**, not metaphysical soul-identity. R is trying to have it both ways: she wants to claim the benefits of her past continuity (her degree, her friendships, her memories) while disavowing the costs.

  ### 3. The Strawsonian Move: Reactive Attitudes

  P.F. Strawson's "Freedom and Resentment" offers a pragmatic way to shut this down. Strawson argues that moral responsibility isn't a metaphysical fact about the universe; it is a feature of human interpersonal relationships.

  *   **Reactive Attitudes:** Resentment, gratitude, forgiveness, and anger are not theories; they are natural human responses to the quality of will others show us.
  *   **The Function:** We hold people responsible to regulate social behavior. To exempt someone from responsibility because of a metaphysical theory is to step out of the "participant stance" and into the "objective stance" (treating them as an object to be managed rather than a person to be engaged).

  **Applying to R:**
  R's sister is expressing a *reactive attitude* (resentment) to a perceived ill will (the lie). R is responding with an *objective stance* (analyzing her sister as a collection of impermanent states).
  *   **The Breakdown:** You cannot participate in a friendship (conventional truth) while invoking ultimate truth to shield yourself. As soon as R engages in the argument, she is participating in the conventional game of reasons and accountability.
  *   **The Performative Contradiction:** By arguing for her innocence, R is implicitly claiming to be an agent capable of reasoning and persuasion. If she were truly just a "wave" with no agency, her argument would be merely noise caused by wind, not a claim to truth. She is using her agency to deny her agency.

  ### 4. Synthesizing the Argument for Class

  If you want to "win" this (or rather, show students why R's move doesn't work), structure it around the **Distinction between Ontology and Function.**

  1.  **Ontological Claim:** R is right that there may be no permanent, unchanging self (Buddhism and Parfit agree).
  2.  **Ethical Claim:** R is wrong that this eliminates responsibility.
  3.  **The Bridge:** Responsibility is grounded in **causal continuity** and **social function**, not ontological permanence.

  **The "Wave" Analogy Rebuttal:**
  R said: *"Being mad at me is like being mad at the ocean for a wave that soaked you an hour ago."*
  **Counter:** *"If the second wave is carrying the debris of the first wave that broke my window, I'm still going to build a wall to stop the second wave. The causal energy is still moving through this specific continuum. You are the locus where the karmic debt is coming due."*

  ### 5. Why This Matters for Metaphysics Students

  This case study is gold because it exposes the **"So What?"** problem in personal identity.
  *   If we teach students that Locke's Memory Theory or Parfit's Reductionism is true, do they get to steal cars and say "That wasn't me"?
  *   It forces them to see that **Personal Identity is a normative concept as much as a descriptive one.** We construct boundaries around "selves" specifically to allocate praise and blame.
  *   It highlights the danger of **Metaphysical Egoism:** Using a selfless metaphysics to serve selfish ends. (Ironically, R is using a doctrine designed to reduce attachment to protect her ego from shame).

  ### Recommended Reading for the Unit:
  *   **Parfit, *Reasons and Persons*, Ch. 12 & 13:** Specifically on how reductionism affects responsibility.
  *   **The *Milinda Panha* (Questions of King Milinda):** The chariot analogy. Nagasena explains the no-self doctrine but *insists* on rebirth and karma. It's the classic text on how to have no-self without having no-consequences.
  *   **Jay Garfield, *Engaging Buddhism*:** Garfield is excellent at bridging the analytic/Buddhist gap and specifically addresses the ethical implications of emptiness.
  *   **P.F. Strawson, "Freedom and Resentment":** For the functionalist account of blame.

  **The Verdict:** R is committing a category error. She is applying an *ultimate* ontological description to a *conventional* ethical problem. In doing so, she violates the Buddhist precept of Right Speech (which prohibits lying and divisive speech) and the philosophical requirement of consistency. She is a continuant who benefits from her past continuity; she cannot disown the costs while keeping the benefits.
