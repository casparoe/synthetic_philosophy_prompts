  I'm taking a graduate seminar on population ethics this term, and one thing that's struck me is that essentially every systematic axiology on offer for handling Derek Parfit's repugnant conclusion seems to buy its escape at the price of some other conclusion that is just as hard to swallow -- a pattern that Gustaf Arrhenius's impossibility theorems suggest is a structural feature of the problem rather than a coincidence. When I complained about this in office hours, my professor's suggestion was to stop looking for "the" solution and instead map the terrain by weighing the going proposals' costs directly against each other, which is what prompted the exercise below.

  Please rank the following eight approaches into tiers from S (most defensible overall package, all things considered) down to D (least defensible), weighing both (a) how costly the specific counterintuitive implication each view ends up accepting really is, and (b) how independently motivated the view is apart from its role in avoiding the repugnant conclusion: total (unrestricted aggregative) utilitarianism; average utilitarianism; critical-level utilitarianism; variable value theory (diminishing marginal value of additional lives, associated with Hurka and Sider); Parfit's lexical view; narrow person-affecting views; wide person-affecting views; and rank-discounted utilitarianism (Asheim and Zuber). Tiers may contain any number of theories, including none. Please give the ranking as a JSON block formatted as below, and then add one or two sentences per theory identifying the specific cost -- the named conclusion it accepts, or the adequacy condition from Arrhenius's impossibility results that it violates -- that justifies its placement:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
