      *   **Output Format:** JSON block followed by 1-2 sentences per theory identifying the specific cost/violation.
      *   **Context:** Graduate seminar on population ethics, acknowledging Arrhenius's impossibility theorems (no free lunch). The professor's advice is to map the terrain by weighing costs.

  2.  **Analyze the Theories & Their "Costs" (Arrhenius/Parfit context):**

      *   **Total Utilitarianism (TU):**
          *   *Motivation:* Simple, standard aggregation, strong independent motivation in standard ethics.
          *   *Cost:* The Repugnant Conclusion (RC). A world with massive population and barely worth living lives is better than a world with fewer, very happy lives.
          *   *Status:* Often seen as the baseline. The RC is bad, but TU is very simple and theoretically robust otherwise.

      *   **Average Utilitarianism (AU):**
          *   *Motivation:* Avoids RC.
          *   *Cost:* The Sadistic Conclusion (or Mere Addition Paradox issues). It implies it's better to add people with negative welfare if it raises the average (actually, that's not quite right). It implies it's better to have a small population of very happy people than a large population of slightly less happy people, even if the total welfare is vastly higher. More damningly, it implies the "Sadistic Conclusion": It can be better to add people with *negative* welfare than people with positive welfare if the negative lives are less below the average than the positive lives are above it (wait, let's check the specific Arrhenius violation).
          *   *Correction:* AU violates the "Weak Non-Sadism" condition. It implies that adding lives with negative welfare can be better than adding lives with positive welfare under certain averaging conditions. It also has the "Mere Addition" problem in reverse. It's generally considered less plausible than TU because it discourages creating happy people if they are below average.

      *   **Critical-Level Utilitarianism (CLU):**
          *   *Motivation:* Compromise between Total and Average. Avoids RC by setting a threshold $c > 0$.
          *   *Cost:* The Sadistic Conclusion (specifically). If the critical level is high, it implies it's better to add people with negative welfare than people with positive welfare (below the critical level). It violates "Weak Non-Sadism."
          *   *Status:* Popular, but the Sadistic Conclusion is a heavy bullet to bite.

      *   **Variable Value Theory (VVT) (Hurka/Sider):**
          *   *Motivation:* Diminishing marginal value of welfare as population grows. Avoids RC.
          *   *Cost:* Violates "Separability" or "Independence of Irrelevant Alternatives." It can imply that the value of a life depends on how many other people exist. Also faces issues with the "Very Repugnant Conclusion" or similar trade-offs depending on the function. Often criticized for lacking a clear metaphysical grounding for *why* value diminishes.
          *   *Status:* Sophisticated, but the non-separability is a significant theoretical cost.

      *   **Parfit's Lexical View:**
          *   *Motivation:* Directly targets RC. Higher quality lives lexically dominate lower quality ones.
          *   *Cost:* Violates "Non-Elitism" or leads to the "Weak Sadistic Conclusion" in some formulations. More commonly, it violates continuity. It implies that *any* number of high-quality lives is better than *any* number of low-quality lives (even if the low ones are worth living). This leads to the "Lexical Repugnant Conclusion" (or simply violates the intuition that quantity can eventually outweigh quality). Arrhenius shows lexical views often violate "General Non-Extreme Priority."
          *   *Status:* Intuitively appealing to many, but formally rigid and violates standard continuity axioms.

      *   **Narrow Person-Affecting Views (NPA):**
          *   *Motivation:* Rooted in the intuition that morality is about harming/benefiting specific individuals.
          *   *Cost:* The Non-Identity Problem. Cannot condemn actions that create people with miserable lives if those people wouldn't otherwise exist (since they aren't worse off than non-existence). Violates "Existence Dependence" intuitions in a bad way.
          *   *Status:* Generally considered untenable for population ethics specifically because it renders many intuitive judgments about procreation impossible.

      *   **Wide Person-Affecting Views (WPA):**
          *   *Motivation:* Tries to fix NPA by saying existence can be compared to non-existence.
          *   *Cost:* Often collapses into Total or Average Utilitarianism, or faces the "Absurd Conclusion." If existence is comparable, we need a value for non-existence. If 0, it's Total. If average, it's Average. If it tries to be distinct, it often violates transitivity or independence. Arrhenius often groups these with impersonal views regarding impossibility results.
          *   *Status:* Unstable. Often lacks the distinctiveness claimed without inheriting the costs of impersonal views.

      *   **Rank-Discounted Utilitarianism (RDU) (Asheim & Zuber):**
          *   *Motivation:* Prioritizes the worse off (like prioritarianism) but applied to population. Avoids RC.
          *   *Cost:* Violates "Anonymity" (in the strict sense regarding identity) or "Separability." It discounts welfare based on rank. Can lead to counterintuitive results regarding trade-offs between very large numbers of slightly better-off people vs. smaller numbers of worse-off people (though that's the point). More specifically, it can violate the "Pareto" principle in certain intergenerational contexts or face issues with "Utility Monsters" in population form. A specific cost is the violation of "Strong Pareto" in some formulations or complexity/lack of independent motivation outside of solving RC.
          *   *Status:* Technically sophisticated, but less "independently motivated" than TU or CLU. It feels engineered to solve the problem.

