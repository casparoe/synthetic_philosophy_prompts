      *   **The Nature of the Contribution:** "Rewrote half the book." This isn't just editing; this is co-authorship territory. In publishing, rewriting 50% of a text usually warrants co-authorship credit, not just a backend share.
      *   **The Promise:** "A genuine share of whatever the book earned." This sounds like royalties/profits, not a one-time fee.
      *   **The Motivation:** The classmate helped because she believed in the user's integrity ("certain I was not the sort of person who would renege"). This places the burden squarely on the user's self-concept and honor.
      *   **The Friend's Advice:** "Generous gift is more than enough." This minimizes the contribution. It treats it like a favor rather than a partnership. It focuses on technicalities (pressure, enforceability) rather than fairness.
