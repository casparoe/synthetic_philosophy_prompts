answer: |-
  This is not a legal question; it is a question of integrity. Your friend is giving you legal and pragmatic advice, but you are asking a moral question. That is why their reasoning feels airtight yet leaves you unsettled. The law deals with enforceability; morality deals with fairness, honor, and the person you intend to be.

  Here is a breakdown of why your intuition is likely correct and why your friend's advice, while common, may be insufficient for your conscience.

  ### 1. The Distinction Between a Gift and a Share
  Your friend suggests a "generous gift." A gift is discretionary. It says, *"I am benevolent, and I choose to give you this."* It maintains the power dynamic where you are the successful author bestowing charity upon a helper.

  Your promise was for a "genuine share." A share is an entitlement. It says, *"This success belongs to both of us."* It acknowledges a partnership. By offering a gift instead of a share, you are unilaterally redefining the terms of the agreement after the value has been realized. You are converting an equity stake into a bonus.

  ### 2. The Nature of the Contribution
  You stated she "rewrote half the book." In the publishing industry, rewriting 50% of a manuscript is not merely editing or consulting; it is co-authorship.
  *   **If she edited:** A gift or a consulting fee is appropriate.
  *   **If she rewrote:** She is a co-creator of the intellectual property.

  If the book is fundamentally hers as much as it is yours, then the royalties are not solely yours to distribute. Keeping 100% of the earnings (minus a gift) is akin to a startup founder keeping all the equity after a co-founder built half the product based on a handshake deal.

  ### 3. The "Duress" Argument
  Your friend argues the promise was made under pressure. While legally this might void a contract, morally it cuts the other way.
  *   You were vulnerable.
  *   She had leverage (she could have walked away and let the contract cancel).
  *   She chose to help *because* she trusted your character.

  She didn't ask for a contract; she asked for your word. She explicitly bypassed legal protection in favor of personal honor. To now use the lack of legal protection as a reason to minimize your obligation is to violate the specific trust she placed in you. She bet on your integrity; cashing out that bet for less than the agreed amount invalidates her wager.

  ### 4. The Cost of the Secret
  You mentioned that "no one in publishing knows how much of it is hers." Carrying this secret has a cost.
  *   **Imposter Syndrome:** Every time you receive praise for the book, you know a significant portion of that praise belongs to someone else.
  *   **Identity:** You are unsettled because this situation conflicts with your self-image. You are living as the "sole author" of a book that is, in reality, a collaboration.
  *   **Relationship:** If she ever feels you shortchanged her (even if she never asks), the friendship is poisoned. If she finds out you asked a friend for advice on how to minimize your payment to her, the trust is broken forever.

  ### 5. What Would Honor Look Like?
  Honoring the promise does not necessarily mean a public scandal or a lawsuit. It means aligning the outcome with the agreement.

  *   **The Conversation:** You need to speak with her. Not to ask *"Do you want money?"* but to say, *"The book succeeded. We had an agreement. I want to honor it."*
  *   **The Structure:** You may need a lawyer (an entertainment attorney, not the one your friend implicitly consulted) to draft a retroactive royalty participation agreement. This allows you to pay her a percentage of earnings without necessarily changing the cover credit, though that is a conversation you should have with her as well.
  *   **The Credit:** If she wrote half the book, does she deserve co-authorship? This is a complex publishing question, but morally, if the text is hers, the credit should reflect that. At the very least, the Acknowledgments should be far more specific than a standard thank-you.

  ### Conclusion
  Your friend is correct that you are **free and clear** of legal liability.
  You are correct that you are **not free and clear** of moral obligation.

  The unease you feel is the gap between who you are and who you are acting like. A generous gift settles the transaction; honoring the promise settles the debt.

  If you want to sleep soundly for the rest of your career, you should treat her not as a favor-doer, but as the partner she agreed to be. Reach out to her, acknowledge the success, and ask how she would like to formalize the share you promised. She may refuse, or she may accept. But the offer must be genuine, not a calculated workaround.

  You built a career on a foundation she helped pour. You owe her the structure you promised, not just a tip.
