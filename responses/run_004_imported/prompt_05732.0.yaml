      *   **The Context:** Verbal agreement only (no contract). Made under pressure (3 months before deadline, threat of cancellation). No legal enforceability.
      *   **The Outcome:** The book succeeded beyond expectations. The classmate's contribution is unknown to the public/publisher.
      *   **The Current Dilemma:** A friend says a "generous gift" is enough because the promise was under pressure and unenforceable. The user feels unsettled ("does not sit right").
