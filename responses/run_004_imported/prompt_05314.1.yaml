answer: |-
  The generator outside hummed with a rhythmic, diesel-driven cough, vibrating through the floorboards of the tin-roofed station. Inside, the only light came from the computer monitor, casting a pale blue glow over two mugs of lukewarm coffee and the faces of Elena and Marcus.

  On the screen, the footage looped for the tenth time. A cheetah, low and fluid, cutting through the tall grass. A Thomson's gazelle, spotting the predator, and instead of running, launching itself into the air. Stiff-legged. Arched back. A vertical exclamation point in a sentence of flight.

  "It's the waste," Elena said, tapping the screen just as the gazelle landed. "That's the only thing that makes sense. Look at the time lost. Look at the energy. If you're sick, if you're malnourished, you can't afford to burn calories on vertical leaps when you should be horizontal and gone. It's a burn. It has to be."

  Marcus leaned back in his creaking chair, rubbing his eyes. "It's not about the burn, El. It's about the differential. You're stuck on the absolute cost. Zahavi's original intuition was brilliant, but the math—the Grafen models—they cleaned it up. The signal doesn't need to be a net loss for the signaler. It just needs to cost the low-quality individual *more* than it costs the high-quality individual."

  "But why signal at all if it's not a handicap?" Elena turned to him. "If I'm fit, why tell the cheetah I'm here? Unless I'm saying, 'I am so fit I can afford to show you where I am and still outrun you.' That is a handicap. It's inviting danger to prove you can withstand it."

  "Because it alters the cheetah's payoff matrix," Marcus countered, his voice calm, practiced. "If the gazelle stots, it signals 'I am aware of you' and 'I am high quality.' The cheetah updates its probability of a successful hunt downward. It abandons the chase. The gazelle saves the energy of a full sprint. It's not waste; it's a negotiation. The cost is marginal. A weak gazelle *could* stot, but for him, the risk of capture spikes disproportionately. For the fit one, the risk is manageable. That's the equilibrium. It's not about sacrificing safety; it's about pricing out the liars."

  Elena poured more coffee, the liquid dark and gritty. "Pricing out. You make it sound like a marketplace. But look at the footage, Marcus. He's five meters from the cat. He leaps *twice*. If the goal is just to signal 'I am fit,' why overshoot the equilibrium? Why do they often stot higher and more conspicuously than the minimal energy required to prove they have spring in their legs? If it were just a differential cost game, natural selection should drive the signal down to the cheapest possible honest display. But it doesn't. It stays extravagant. It stays dangerous."

  Marcus paused. He watched the gazelle land again on the loop. "That is... a fair point. The efficiency argument does struggle with the magnitude. If the signal is costly, evolution should minimize that cost while maintaining honesty. Yet, stotting looks like it's maximizing visibility, not minimizing cost."

  "Exactly," Elena said. "Because the cost *is* the message. If it were cheap, it would be noise."

  "But then you have to explain the indices," Marcus said, seizing the opening. "You know I'm right about the mechanism, even if the magnitude is debatable. Think about vocal formants in red deer. The depth of the roar is physically constrained by the size of the larynx. You can't fake a deep roar without a large body. There is no handicap there. No waste. It's an index. It's mechanically honest. If your Handicap Principle were the universal law, indices shouldn't exist. But they're everywhere. Honesty can be enforced by physics, not just by economic drain."

  Elena sighed, leaning her chin on her hand. "Indices are static. They tell you about body size. They don't tell you about current condition, energy reserves, or parasite load. A big stag can be diseased. A big gazelle can be exhausted. Stotting is dynamic. It's a test of *now*."

  "Is it?" Marcus pressed. "Or is it condition-dependent development? Take the peacock. Zahavi's poster child. He said the tail is a handicap because it's heavy and draggy. But recent work suggests the tail isn't that heavy in flight. The honesty might come from the immunocompetence required to grow the feathers in the first place. It's not that the tail drags him down; it's that only a healthy bird can build the tail. That's not a handicap in your sense. That's a certificate of health. The cost is in the production, not the maintenance of the risk."

  Elena looked away from the screen, out into the dark beyond the window. "If you reduce it to production costs, you lose the predator interaction. The peacock's tail isn't just for the peahen. It makes him visible to tigers. The drag *does* matter in a chase. You're trying to sanitize the risk out of the equation because it makes your models cleaner."

  "I'm trying to understand why the system persists without assuming animals are actively trying to die," Marcus said softly. "If the cost is too high, the signal collapses. But here's where I need you, Elena. If I admit that stotting looks inefficient—that it costs more than the minimal equilibrium requires—what drives that excess? If it's not a pure handicap, why not evolve a cheaper signal? A tail flick? A ear twitch?"

  "Because a tail flick can be faked by a dying animal," Elena said. "A ear twitch costs nothing. The cheetah knows that. To stop the pursuit, the signal must be linked to escape capability. The only way to link it tightly enough is to make the signal part of the escape mechanics. You have to show you have explosive power. And to prove it's not a bluff, you have to do it when the risk is highest."

  "So risk is the currency," Marcus mused.

  "Risk is the only currency the cheetah accepts."

  Marcus rubbed his chin. "Okay. I can accept that for pursuit-deterrence signals, the cost must be tied to performance. But I still can't accept that 'waste' is the mechanism of honesty. It's differential sensitivity. And I have to ask you: if the Handicap Principle requires absolute cost, how do you account for the indices? You can't just wave them away. If a howler monkey's hyoid bone determines his roar, and he can't fake it, where is the handicap? There is none. Yet the signal is perfectly honest."

  Elena was quiet for a long moment. The generator coughed outside. "Alright," she said finally. "Not every signal is a handicap. Indices exist. Physics enforces honesty sometimes. I'll grant that. But when the signal is behavioral—when it's a choice to act—physics drops out. Then you're back to economics. And in behavior, waste seems to be the only thing that prevents deception."

  She turned back to the screen. "But I will concede this to you: maybe 'waste' is the wrong word. It implies the organism loses something of value with no return. But if the signal prevents the chase, the energy spent stotting is an investment, not a loss. So, perhaps it's not a handicap in the sense of a burden... but it must be a *barrier*."

  "A barrier?"

  "A barrier to entry," Elena said. "High enough that the weak cannot cross it without fatal consequence. You say it's marginal cost. I say it's a survival threshold. The math might be similar, but the biological reality is life or death."

  Marcus nodded slowly. "And I will concede this: the magnitude problem. The models predict minimal cost. The animals display maximal risk. There is a gap there. Perhaps... perhaps the signal isn't just about honesty. Perhaps the excess is about redundancy. Or perhaps the 'cost' isn't just energy, but the cognitive load of performing under pressure. A weak animal might panic. A fit one executes."

  "So the handicap is stress?"

  "Maybe," Marcus said. "Or maybe the equilibrium isn't as efficient as we think because predators aren't perfect rational agents either. If the cheetah is risk-averse, the gazelle has to over-signal to convince it."

  Elena smiled faintly. "So we agree that the signal is honest, and we agree that cost is involved, but we disagree on whether the cost is a bug or a feature."

  "I think the cost is a constraint," Marcus corrected. "You think it's the purpose."

  "Semantics," Elena said, though she didn't look convinced. "But if you admit that the stotting is more dangerous than your models require, you have to admit that efficiency isn't the only driver. There's something about the *excess* that matters."

  "And if you admit that indices exist without handicaps," Marcus replied, "you have to admit that waste is not a necessary condition for honesty. It's just one path among many."

  Elena reached out and paused the footage. The gazelle hung suspended in mid-air, frozen at the apex of its leap, defying gravity for a fraction of a second before the inevitable fall.

  "One path," Elena murmured. "But it's the path that keeps them alive long enough to argue about it."

  Marcus picked up his coffee. "Until the cheetah gets faster."

  "Until the gazelle gets slower," she corrected.

  They sat in the blue light, the argument unresolved, but the edges of their theories worn down just enough to let a little light through. Outside, the Serengeti night pressed against the walls, full of signals no camera could catch.
