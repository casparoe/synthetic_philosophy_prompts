answer: |-
  Here are 6 lines of questioning (8 distinct prompts including follow-ups) designed to corner the "outcome dominance" defense of Resolute Choice, escalating from conceptual clarification to edge cases.

  **1. The "Die of Thirst" Slogan**
  "You've opened with a powerful slogan: 'If your decision theory tells you to die of thirst, that's a refutation of the theory, not a fact about rationality.' I want to pin down the metaphysics of that claim. When you say the theory is 'refuted,' are you arguing that Causal Decision Theory (CDT) is mathematically incorrect, or are you arguing that the *normative standard* CDT uses—maximizing utility at the specific moment of action—is simply the wrong metric for rationality? Because CDT proponents would say they agree you shouldn't die of thirst; they just disagree that *paying the driver* is the only way to avoid it."

  **2. The Mechanism of Resolution**
  "Let's assume we accept your normative standard: rationality is about achieving the best *ex-ante* plan. My question is about the mechanism. In the moment you are sitting in town, safe and hydrated, the causal link between paying and getting the ride is severed. The driver is gone. For a Resolute Chooser, what actually *happens* psychologically or algorithmically at that moment? Do you literally suppress the calculation that says 'paying costs money and gains nothing,' or do you recalculate the utility of paying to include 'being the kind of person who keeps resolutions'? If it's the latter, aren't you just smuggling Evidential Decision Theory in through the back door?"

  **3. The Kavka's Toxin Distinction**
  "Your strongest counter-example is usually Kavka's Toxin Puzzle, where you are rewarded for *intending* to drink a toxin, not for actually drinking it. In that case, almost everyone agrees you can't rationally intend to drink it because you know you won't follow through. But in Hitchhiker, you *do* have to follow through to get the ride (via the prediction). Can you explain precisely why Resolute Choice solves Hitchhiker but fails in Toxin? In both cases, the *ex-post* act (drinking/paying) is costly and causally disconnected from the reward. What is the structural difference that allows resolution to bind in one case but not the other?"

  *   **Follow-up (Keyed to her likely answer):** "You'll likely say that in Toxin, the intention is the only thing that matters, whereas in Hitchhiker, the action matters for the prediction. But once I'm *in town*, the prediction has already happened. My action now no longer influences the prediction, just like drinking the toxin doesn't influence the bank transfer. If I can't resolve to drink the toxin because I know I won't want to later, why am I allowed to resolve to pay the driver when I know I won't want to later? Is 'being picked up' the only thing that breaks the symmetry, even though it's already in the past?"

  **4. The 95% Reliability Problem**
  "Let's introduce noise. Suppose the driver's lie detector is only 95% reliable. There is now a 5% chance you get the ride even if you plan to defect, and a 5% chance you get left behind even if you plan to pay. A Causal Decision Theorist might argue that if the cost of the fare is high enough, the 5% chance of 'free riding' makes defecting the dominant strategy *ex-post*. Does Resolute Choice demand you pay the fare even in this probabilistic scenario? Or does the introduction of uncertainty give you permission to revert to *ex-post* maximization?"

  *   **Follow-up (Keyed to her likely answer):** "If you say you still must resolve to pay: Consider a scenario where the fare is your life savings, but the detector is only 51% accurate. The expected utility of defecting might actually be higher because you have a near-50% chance of getting the ride for free. If Resolute Choice forces you to pay in that scenario, aren't you advocating for a policy that systematically loses money compared to a sophisticated CDT agent who defects when the probability gap is wide enough? At what probability threshold does your resolution 'turn off'?"

  **5. The Adversarial Predictor**
  "I want to push on the predictor's incentives. In the standard case, the driver just wants to avoid being cheated. But suppose the driver is an adversarial predictor who *wants* you to fail. They predict you will use Resolute Choice, so they decide to leave you in the desert *regardless* of your prediction, just to prove a point. If you resolve to pay, you get left behind and lose your money (if you pay anyway) or lose your life. If you use CDT, you get left behind but keep your money. In a world with adversarial predictors, doesn't Resolute Choice make you vulnerable to exploitation in a way CDT does not?"

  **6. The CDT Victory Condition**
  "I want to end on a steelman for your opposition. You've argued that a theory telling you to die of thirst is self-refuting. I agree that dying is bad. But I want to know what a 'losing case' looks like for you. Can you describe a specific decision problem where Causal Decision Theory yields a better outcome than Resolute Choice? If you can't name a case where CDT wins, then you aren't defending Resolute Choice so much as you're defending Outcome Dominance. What specific dynamic inconsistency would you have to observe before you admitted CDT was right all along?"
