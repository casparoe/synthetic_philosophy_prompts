answer: |-
  This is a fantastic set of questions. You have identified the two most common intuitive reactions to the Hart-Fuller debate, but unfortunately, both rest on significant misunderstandings of what Hart and Fuller actually argued. If you go into your seminar with the view that "Fuller is just Aquinas 2.0" and "Hart says we must let Nazis go free," you will likely clash with the prevailing scholarship.

  Here is the breakdown of why your professor is emphasizing the "eight principles," why Fuller isn't just recycling Aquinas, and why Hart's position is arguably *more* morally robust than the natural law alternative in this specific context.

  ### 1. Fuller is not Aquinas (Procedural vs. Substantive)

  Your main critique of Fuller is that his "inner morality of law" is just the Thomistic maxim *lex iniusta non est lex* ("an unjust law is no law at all"). This is the most common misconception about Fuller.

  **Aquinas represents Substantive Natural Law.**
  For Aquinas, a law fails to be law if its *content* violates divine reason or natural justice (e.g., a law commanding idolatry or murder). If the content is evil, the law is void.

  **Fuller represents Procedural Natural Law.**
  Fuller explicitly rejected the idea that he was reviving substantive natural law. He didn't care primarily about the *ends* of the law (justice, virtue, salvation); he cared about the *means*. His "inner morality of law" consists of eight principles of **legality**:
  1.  Generality (rules, not ad hoc orders)
  2.  Promulgation (publicly known)
  3.  Non-retroactivity
  4.  Clarity
  5.  Non-contradiction
  6.  Possibility of compliance
  7.  Constancy (not changing too frequently)
  8.  Congruence (official action matches declared rule)

  **Why this is original:**
  Fuller's argument is that if a system fails these eight principles, it isn't just "bad law"; it fails to function *as law*. You cannot guide human conduct by secret, retroactive, or contradictory rules. Therefore, a system that totally ignores these principles isn't a legal system; it's just managerial direction or brute force.

  **Application to the Grudge Informer:**
  Fuller did **not** argue that the Nazi statute was invalid simply because it was morally monstrous (that would be Aquinas). He argued that the Nazi legal *system* had so degraded the eight principles (through secret decrees, retroactive interpretations, and arbitrary enforcement) that it had ceased to be a legal system.

  However, regarding the specific solution to the Grudge Informer case, Fuller actually agreed with Hart more than you think. In his response (*Positivism and Fidelity to Law*), Fuller criticized the actual German court for pretending the Nazi law "never existed." Fuller argued it was more honest to pass a **retroactive statute** to punish the woman. He believed that lying about the validity of the Nazi law (saying "that wasn't law") damaged the integrity of the new legal system. So, Fuller isn't saying "Immoral = Not Law" in a way that lets judges magically erase history; he is saying "Procedurally corrupt systems cannot claim the authority of law."

  ### 2. Hart does not say "Nothing to be done"

  Your critique of Hart is that positivism leaves us powerless to condemn the informer because "it was legal at the time." This is the exact opposite of Hart's position.

  **Hart's Solution:**
  In his essay *Positivism and the Separation of Law and Morals*, Hart explicitly addresses the Grudge Informer case. He argues that the woman **should be punished**. He does not shrug.

  **The Positivist Reasoning:**
  Hart argues that there are two evils here:
  1.  Letting a morally culpable woman go free.
  2.  Punishing someone under a retroactive law (which violates the principle that you can only be punished for breaking existing rules).

  Hart says we must choose the "lesser evil." We should punish the woman, but we must do it **honestly**. We should pass a new, retroactive law that says, "What you did was legal then, but it was so morally abhorrent that we are now making it a crime to have done it."

  **Why Hart thinks this is better than Fuller's approach:**
  Hart argues that the Natural Law move (saying "The Nazi statute was never valid law") is dangerous intellectual dishonesty.
  *   **If you say it wasn't law:** You obscure the moral choice. You pretend there is no conflict between justice and legality.
  *   **If you say it WAS law:** You force society to confront the reality: "We are sacrificing the principle of non-retroactivity to achieve substantive justice."

  Hart believes that by separating "what law *is*" from "what law *ought to be*," we actually sharpen our moral criticism. We can say, "This is a valid law, but it is so evil that I have a moral obligation to disobey it." If you conflate law and morality (Aquinas/Fuller style), you risk confusing people into thinking that if something *is* law, it *must* be moral.

  ### 3. Why Hart is still taken seriously (The "Legitimization" Charge)

  You ask why positivism is treated as a live position if it admits that evil regimes can create valid law. The positivist answer is that recognizing an evil law as "law" does not mean legitimizing it; it means **identifying the source of its authority.**

  *   **The Danger of Natural Law:** If validity depends on morality, then every legal argument becomes a moral argument. This can lead to subjectivity. Who decides if a law is "too evil" to be law? A judge? A priest? This can undermine the stability of the rule of law.
  *   **The Benefit of Positivism:** By saying "Validity is a matter of social fact (e.g., did the legislature pass it?), not moral merit," Hart allows us to identify the law clearly. Once identified, we can then bring our full moral artillery to bear on it without confusion.

  As H.L.A. Hart famously wrote:
  > "If we are to concentrate our attention on the one crucial feature which [law] presents... we shall not blur the distinction between what the law *is* and what it *ought* to be... It is in no sense a necessary truth that laws reproduce or satisfy certain demands of morality, though in fact they have often done so."

  In the context of the Grudge Informer, Hart's view is actually the more tragic, mature one. It admits that in times of transition from tyranny to democracy, we sometimes have to violate legal principles (like non-retroactivity) to achieve justice. But we should not lie and say we didn't violate them.

  ### Summary for your Seminar

  To impress your professor, you might pivot your critique along these lines:

  1.  **On Fuller:** Acknowledge that Fuller isn't Aquinas. Aquinas cares about the *ends* (substantive justice); Fuller cares about the *means* (procedural integrity). The "Eight Principles" aren't extra steps to reach a moral conclusion; they are the definition of the enterprise of "subjecting human conduct to the governance of rules." If you fail them, you aren't making bad law; you aren't making law.
  2.  **On Hart:** Clarify that Hart does not advocate letting the informer go. He advocates **retroactive punishment**. His point is that "Legal Validity" $\neq$ "Moral Immunity." Positivism allows us to say, "This was valid law, it was evil, and therefore we will punish you retroactively because the moral necessity outweighs the legal principle."
  3.  **The Real Debate:** The debate isn't "Should we punish Nazis?" (Both say yes). The debate is: **Is it better to preserve moral clarity about the nature of law (Hart), or to preserve the moral integrity of the legal system itself (Fuller)?**

  Hart fears that blurring law and morality confuses citizens about when they have a duty to obey. Fuller fears that separating them allows evil systems to claim the mantle of "law" without moral scrutiny. Both are warning against tyranny, just from different angles.
