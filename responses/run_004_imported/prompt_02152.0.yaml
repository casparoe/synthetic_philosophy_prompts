      *   **Deontology (Duty-based):** Are there absolute duties?
          *   *Duty to Truth:* The author has a duty to report facts accurately.
          *   *Duty to Non-maleficence:* Do no harm.
          *   *Duty to Justice:* The wrongfully convicted person deserves exoneration.
          *   *Conflict:* Duties clash. Kant might argue you can't use the daughter merely as a means to an end (justice reform).
