      *   **The Conflict:** Truth/Justice/Systemic Good vs. Individual Harm/Privacy/Non-maleficence.
      *   **The Colleague's Argument:** Foreseeable harm = responsibility. Vague future good doesn't license certain present harm. (Consequentialist/Deontological mix).
