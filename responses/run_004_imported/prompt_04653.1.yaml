  4.  **Refining the Arguments (Technical Check):**
      *   *NBS Axioms:* Pareto Efficiency, Symmetry, Invariance to Affine Transformations, IIA.
      *   *KSS Axioms:* Pareto Efficiency, Symmetry, Invariance, Individual Monotonicity (replaces IIA).
      *   *The Monotonicity Violation:* In NBS, if the set $S$ expands to $S'$, but the solution moves in a way that hurts one player despite their ideal point staying the same (or improving), that's the issue. Specifically, if the expansion is on the *other* player's side, NBS might shift the tangent point against the first player.
      *   *The Information Argument:* NBS maximizes the product $(u_1 - d_1)(u_2 - d_2)$. This depends on the slope of the frontier everywhere. KSS connects $d$ to $a$ (ideal point) and finds the intersection. It ignores the "bulge" of the frontier between $d$ and $a$.
