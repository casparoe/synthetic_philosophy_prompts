answer: |-
  **Setting:** *A dimly lit coffee shop near campus, 11:00 PM. Empty mugs and scattered printouts of Maschler, Solan, and Zamir cover the table. Alex is leaning back, rubbing their temples. Jordan is leaning forward, pen tapping rhythmically on a notebook.*

  **Alex:** Look, I'm willing to say it plainly. If we have to choose, I keep Independence of Irrelevant Alternatives. I drop Individual Monotonicity. I know it feels counterintuitive that expanding the set can hurt a player, but IIA is the only thing that guarantees the solution behaves like a rational preference ordering. Without it, we aren't modeling rational agents anymore; we're modeling mood swings.

  **Jordan:** And I'm willing to say the opposite. I drop IIA without a second thought. I keep Individual Monotonicity. Because the alternative is accepting a solution where I can be strictly worse off just because *you* got more opportunities. That's not rationality, Alex. That's perverse. If my utopia point stays fixed, and the feasible set grows in your direction, why should my payoff shrink? The Nash solution allows that. To me, that's a dealbreaker.

  **Alex:** It's not a dealbreaker, it's a trade-off. Think about what IIA actually demands. It's contraction consistency. If we agree on a deal in a large set, and then we realize some options were actually impossible—so we shrink the set—but the deal we struck is still available... why would we change our minds? Nash preserves that stability. Kalai-Smorodinsky doesn't. If you remove options that weren't chosen anyway, KS might shift the solution. That feels way more unstable to me than the monotonicity violation.

  **Jordan:** But that's comparing apples to oranges. The monotonicity violation isn't about removing unchosen options. It's about *expansion*. Imagine we're bargaining over a pie. I'm willing to take half. Then you discover you have an outside option that makes the total surplus bigger, but only if you get more. Under Nash, the curvature of the frontier changes, the tangent point shifts, and I might end up with *less* than half, even though my maximum possible claim didn't change. My bargaining power effectively decreased because *you* gained leverage. KS fixes this. It says my payoff should be monotonic in the feasible set. If the set gets better for me, I gain. If it gets better for you, I shouldn't lose.

  **Alex:** I get the intuition, I really do. But here's my problem with KS: it buys that nice monotonicity behavior by throwing away almost all the information in the problem. Nash uses the entire Pareto frontier. It cares about the curvature, the trade-off rates at every point. KS? KS just draws a straight line from the disagreement point to the utopia point. It finds the intersection and says "done." It ignores everything about the shape of the frontier between those two points.

  **Jordan:** Because the shape between the points is often strategic noise. The utopia point captures the relative claims. The disagreement point captures the threat. Why do I need to know the marginal rate of substitution at some point we're never going to visit?

  **Alex:** Because the marginal rate of substitution *is* the bargaining! That curvature tells us how painful concessions are. If the frontier is flat near your ideal point, it means you can gain a lot without costing me much. Nash picks up on that. It says, "Okay, let's move toward the player for whom utility is 'cheaper' to grant." KS ignores that completely. It treats a linear frontier the same as a highly concave one, as long as the ideal points match. That's not fairness; that's blindness.

  **Jordan:** Or maybe it's robustness. You're saying Nash is "sensitive" to the curvature. I'm saying it's *manipulable*. If I know you're using Nash, I can reshape the feasible set—add dummy alternatives, change the technology—just to alter the curvature near the solution point, without changing my actual maximum claim. KS is immune to that. It only cares about the extremes: where we start and what's theoretically possible. That feels like a more honest representation of "bargaining power" than integrating over the slope of the frontier.

  **Alex:** But the extremes are the most vulnerable to exaggeration! The utopia point is rarely achievable. It's a fantasy coordinate. Basing the whole solution on a ray to a point we know we can't reach seems... reckless. Nash maximizes the product of gains. It finds the point of maximal mutual gain relative to the threat point. That has a welfare justification. KS has what? A geometric proportionality?

  **Jordan:** It has a procedural justification. And don't give me that "welfare" talk—we're ordinal here. But think about Raiffa. Twenty years before Kalai and Smorodinsky wrote down the axioms, Raiffa sketched the stepwise concession procedure. You start at the ideal point, you concede proportionally until you hit the frontier. That *derives* the KS solution. It's not just a line drawn on a graph; it's a dynamic process of concession. Doesn't that count for something? That it models how people actually argue? "I want everything, you want everything, let's meet in the middle proportionally."

  **Alex:** Raiffa's procedure is normative, not descriptive. Just because you can tell a story about stepwise concessions doesn't mean the axioms hold up under scrutiny. And honestly, does priority matter? Raiffa didn't axiomatize it. Kalai and Smorodinsky did. But even then, just because a procedure exists doesn't make it the *rational* outcome. I can tell a story for Nash too. Mutually beneficial trade until no more gains exist. The product maximization is the unique point that satisfies symmetry and efficiency without relying on interpersonal comparisons. KS implicitly compares scales by linking them to the utopia point.

  **Jordan:** It doesn't compare scales, it compares *relative* gains. That's the point of Invariance to Affine Transformations, which we both keep. Look, let's go back to the monotonicity. You say IIA is rationality. I say IIA is the problem. In individual choice theory, IIA makes sense. If I prefer an apple to a banana, adding a cherry shouldn't make me pick the banana. But bargaining isn't individual choice. It's strategic interaction. The "alternatives" aren't just options for me; they're leverage for you. If your leverage increases, the "irrelevant" alternatives aren't irrelevant to the power dynamic. Nash treats them as irrelevant. KS acknowledges that if your potential maximum goes up, the balance of power shifts, but it protects me from losing ground if *my* potential stays the same.

  **Alex:** But KS protects you too much. It protects you from the reality of the trade-off. Suppose the frontier expands in my favor, but to exploit that expansion, I have to incur a huge cost in efficiency if we stay at your old payoff. Nash says, "We need to adjust your payoff to keep the product maximal." KS says, "No, just keep the ratio of gains constant." It forces a proportionality that might be inefficient in terms of welfare weights. You're prioritizing a specific notion of fairness over the efficiency of the surplus division.

  **Jordan:** I'm prioritizing a fairness constraint that prevents exploitation. Your "efficiency" argument is just hiding the normative choice. Nash chooses a specific welfare function—the utilitarian product. That's a value judgment. KS chooses a egalitarian proportionality. That's also a value judgment. But KS's value judgment doesn't allow for the paradox where more options make me poorer. I can't accept a solution that violates monotonicity. It violates the basic idea that having more options is never bad.

  **Alex:** Having more options is never bad for the *set*, but it can change the *equilibrium*. Think about it like a market. If supply shifts, prices change. Some people get hurt by a supply shock even if the total wealth increased. Nash treats the bargaining solution like a competitive equilibrium. KS treats it like a fixed rule of division. I want the equilibrium. You want the rule.

  **Jordan:** But we aren't in a market. We're in a room, trying to agree. If I see that the set expanded, and I see my payoff went down, I'm walking away. No amount of "axiomatic consistency" will stop me from feeling cheated. KS ensures that if the pie gets bigger, nobody gets a smaller slice unless their claim on the pie got smaller.

  **Alex:** And I'm saying that if we remove an option we didn't pick, and the solution changes, I feel like the solver is broken. It means the solution wasn't really about the options we cared about; it was about the geometry of the whole set. If the geometry changes slightly, the outcome jumps. That's not robust.

  **Jordan:** We're going in circles. You think IIA is the bedrock of rationality. I think Monotonicity is the bedrock of fairness.

  **Alex:** And you think KS ignores too much information about the frontier.

  **Jordan:** And you think Nash allows for perverse outcomes where opportunity hurts.

  **Alex:** Exactly.

  **Jordan:** *Sighs.* So, for the final exam...

  **Alex:** I'm proving Nash. I can't sign off on a solution that violates contraction consistency.

  **Jordan:** I'm proving Kalai-Smorodinsky. I can't sign off on a solution where I lose utility when the feasible set grows.

  **Alex:** *Picks up pen.* Well. At least we agree on the axioms we're dropping.

  **Jordan:** *Closes notebook.* Yeah. Just not on why the other one is wrong.

  **Alex:** Coffee?

  **Jordan:** Coffee.
