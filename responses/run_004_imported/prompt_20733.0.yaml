  6.  **Final Polish:** Check the pacing. Ensure the Bayesian commitment remains visible (e.g., talking about P(h|e) rather than "justification"). Make sure the ending feels earned, not resolved. (The prompt asks for them to keep poking, not necessarily resolve it).

  *(Self-Correction during final review)*: Wait, I need to make sure Bob actually defends the *assertability* of the lottery claim if the threshold is met, or explains why it *seems* unassertable without conceding the norm. The prompt says Bob wants to "defend a straight credence-threshold norm... even for the lottery case, and actually has to do something with the contrast." Okay, so Bob should argue that *strictly speaking*, asserting "You lost" is epistemically permissible if credence is high, but *pragmatically* rude/misleading. Alice argues it's epistemically impermissible. This is the crux.

  Let's sharpen that distinction. Bob: "It's true, you just shouldn't say it because it implies evidence." Alice: "No, it's that you don't *stand in the right relation* to the truth."

  Okay, ready to write.

  7.  **Final Review against constraints:**
      *   Two committed Bayesians? Yes.
      *   Opposite sides on Assertion Norms? Yes.
      *   Lottery vs. Bike case central? Yes.
      *   Real back and forth? Yes.
      *   No folding? Yes.

