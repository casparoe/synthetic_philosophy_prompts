  2.  **Deconstruct the Philosophical Landscape:**
      *   *Strawson:* Reactive attitudes (resentment, gratitude) are constitutive of interpersonal relationships. Determinism doesn't abolish them. Exemptions (psychosis, childhood) and Excuses (accidents, coercion) exist *within* the practice.
      *   *The Guest's Defense:* Naturalism. We just *do* feel these things. Asking for external justification is a category error.
      *   *The Challenge:* Show that the practice *can* be critiqued from the inside, or that the "naturalness" claim is empirically false, or that the distinction between internal/external is porous.
      *   *Key Critics:*
          *   *Watson:* Distinguishes between attributability (is this action hers?) and accountability (is she liable to sanction?). Strawson might conflate them.
          *   *Wallace:* Responsibility is about fairness and the power to grasp reasons. This looks like a justification Strawson tries to avoid.
          *   *Pereboom:* Hard incompatibilist. We *can* eradicate reactive attitudes (like giving up belief in witches), so they aren't inescapable.
          *   *The Narcoleptic Case:* Is this an excuse (action wasn't voluntary) or an exemption (agent wasn't fully present)? Strawsonians struggle with the "no choice" but "no defect of agency" cases.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Sequence Strategy:* Start concrete (the novel's case), move to structural distinctions (Watson), then to the scope of the objective attitude, then to rival justificatory accounts (Wallace), then to the empirical claim of inescapability (Pereboom), and end on falsifiability.

