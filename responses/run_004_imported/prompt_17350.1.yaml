      *   **Required Content:**
          1.  Excuse/Exemption boundary (using the narcoleptic driver case).
          2.  Gary Watson's attributability/accountability distinction (fittingness vs. naturalness).
          3.  The Objective Attitude (causal history pushing us toward universal objectivity).
          4.  R. Jay Wallace's fairness-based alternative (reasons-responsiveness vs. naturalism).
          5.  Pereboom-style hard-incompatibilist argument (moderating resentment undercuts inescapability).
