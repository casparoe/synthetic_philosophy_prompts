      *   *Question 3 (The Objective Attitude & Causal History):*
          *   *Draft:* If we know causes, do we stop blaming?
          *   *Refinement:* If we treat some objectively (exemptions), why not everyone given determinism?
          *   *Follow-up:* She will say interpersonal life requires participation. Push on the *cost* of that participation.

      *   *Question 4 (Wallace - Fairness/Reasons):*
          *   *Draft:* What about R. Jay Wallace?
          *   *Refinement:* Wallace says responsibility requires the power to grasp reasons. Isn't this the justification Strawson avoids?
          *   *Follow-up:* She will say Wallace is describing the practice, not justifying it externally. Push on whether "fairness" is an external standard.

      *   *Question 5 (Pereboom - Inescapability):*
          *   *Draft:* Can't we stop feeling resentment?
