answer: |-
  Here are nine interview questions designed to navigate the guest's Strawsonian commitments, arranged to progressively constrain the "internal practice" defense, with anticipated follow-ups.

  **1. The Excuse/Exemption Boundary**
  "In my new novel, a driver kills a pedestrian because he falls asleep due to undiagnosed narcolepsy. He didn't choose to sleep, but he isn't psychotic or coerced; he is, in most lights, a normal agent having a medical episode. In Strawson's framework, we usually distinguish between *excuses* (I didn't mean to) and *exemptions* (I am not a full participant in the moral community). Where does the narcoleptic sit? If you say he is exempt, does that not imply that 'moral agency' is fragile enough to be switched off by a chemical imbalance, and if you say he is merely excused, does that not leave the victim's resentment hanging in a void where there is no ill will to resent?"

  *   **Follow-up:** "You'll likely say this is a negotiation *within* the practice. But if the practice itself yields contradictory verdicts on whether the agent was 'present,' doesn't that suggest the practice is tracking a fact about the agent's control, rather than just constituting our relationship to them?"

  **2. The Scope of the Objective Attitude**
  "Strawson argues we can adopt the 'objective attitude' toward those who are exempted—we treat them as objects to be managed rather than partners to be reasoned with. But if we accept that every action has a sufficient causal history, including the narcoleptic's and the vindictive murderer's, what stops the objective attitude from becoming universal? If we exempt the driver because his action was caused by a sleep disorder, why do we not exempt the murderer because his action was caused by a personality disorder shaped by genetics and environment?"

  *   **Follow-up:** "I anticipate you'll say that adopting the objective attitude universally is psychologically impossible for us. But is that a claim about human *capacity*, or is it a claim about human *convenience*? And if it's the latter, haven't we shifted from a descriptive naturalism to a pragmatic justification?"

  **3. Watson's Distinction and "Fittingness"**
  "Gary Watson distinguishes between *attributability* (is this action really yours?) and *accountability* (are you liable to sanction for it?). He suggests Strawson conflates the two. When you say our reactive attitudes are 'natural,' are you describing a psychological inevitability, or are you secretly claiming these attitudes are *fitting* responses to the agent? If it's just description, why do we argue about blame? If it's fittingness, aren't you appealing to a normative standard outside the mere existence of the feeling?"

  *   **Follow-up:** "If you insist the feeling *creates* the norm, how do you account for cases where we collectively agree a reactive attitude was *mistaken*? To say 'we felt resentment but later agreed it was unfitting' seems to require a standard of fittingness that transcends the feeling itself."

  **4. Wallace and the Fairness Condition**
  "R. Jay Wallace argues that responsibility is grounded in fairness: it is unfair to demand things of agents who lack the power to grasp and act on moral reasons. This looks like the justificatory work Strawson wants to avoid. If your naturalism says 'we blame because we are built to blame,' but Wallace says 'we blame because it is fair to blame those with reason-responsive powers,' isn't Wallace offering the very external validation your framework claims is unnecessary? And if his account is more precise, why stick with the naturalism?"

  *   **Follow-up:** "You might argue Wallace is just describing the norms internal to our practice. But if the norm is 'fairness,' and fairness implies a condition of 'could have done otherwise' or 'power to grasp reasons,' aren't you still answerable to whether those conditions actually obtain in the world, regardless of our feelings?"

  **5. Pereboom and the Moderation of Resentment**
  "Derk Pereboom and other hard incompatibilists argue that while reactive attitudes feel inescapable, they are not. We have historically eradicated other deep-seated reactive stances, like belief in witchcraft or divine wrath, through sustained philosophical and cultural practice. If resentment can be moderated or extinguished through cognitive training, doesn't that undercut the premise that these attitudes are constitutive of *any* interpersonal life? Perhaps they are only constitutive of *our current* interpersonal life."

  *   **Follow-up:** "If you concede they *can* be extinguished but argue we *shouldn't* because the cost is too high (loss of intimacy, etc.), aren't you now making a consequentialist argument? You are weighing the benefits of blame against the costs, which is exactly the kind of external justification Strawson sought to bypass."

  **6. Internal Reform and External Standards**
  "You've mentioned that our practices of responsibility are subject to revision. We can decide that blaming children or the severely mentally ill is inappropriate. But to revise a practice, you need a standard to revise it *by*. If all we have is the practice itself, how do we distinguish between a 'reform' and simply a 'change'? If we say blaming the innocent is a 'corruption' of the practice, where does that judgment of corruption come from if not from outside the practice?"

  *   **Follow-up:** "So you are positing a 'reflective equilibrium' within the practice. But if the equilibrium is reached by balancing our intuitions against our theories of causation and agency, aren't those theories doing the justificatory heavy lifting, rather than the natural facts of our emotional life?"

  **7. The Victim's Standpoint**
  "As a novelist, I'm interested in the person on the receiving end. For the sister of the victim, the 'natural' reaction is rage. But if the driver is medically exempt, Strawson suggests she ought to shift to the objective attitude. If she finds she *cannot* do this, is she irrational? Or is the theory failing to capture the reality of grief? If the theory demands she suppress a natural reaction to align with a philosophical category, isn't the theory prescribing a life rather than describing one?"

  *   **Follow-up:** "If you say she is entitled to her resentment despite the exemption, you preserve the naturalism but lose the normative force of the exemption. If you say she must suppress it, you are judging her natural reactions against a philosophical standard. How do you avoid ruling her lived experience as 'incorrect'?"

  **8. The Promising Analogy**
  "You often compare asking for a justification of responsibility to asking for a justification of promising: the question only makes sense from inside the practice. But we can imagine a society without promising that functions perfectly well with binding contracts or social credit. We can conceptually exit the practice of promising to evaluate it. Why is responsibility different? If we can imagine a 'responsibility-free' society that manages safety through quarantine and therapy (like the objective attitude), haven't we successfully stepped outside the practice to evaluate it?"

  *   **Follow-up:** "If you say such a society is unimaginable for *humans*, that is an empirical claim. If empirical psychology or neuroscience showed we could function without reactive attitudes, would your naturalism collapse? Or would you find a new reason why we 'must' keep them?"

  **9. Falsifiability and Evidence**
  "Finally, I want to press on the status of your claim. If Strawsonian naturalism is a description of the human form of life, it should be vulnerable to evidence. What would count as evidence *against* your view? Is there a conceivable discovery in neuroscience, psychology, or even a shift in our moral intuitions, that would force you to say, 'I was wrong, our reactive attitudes are not constitutive, they are theoretical errors we should discard'? Or is the position structured so that any counter-evidence is absorbed as merely another feature of the practice?"

  *   **Follow-up:** "If there is no such evidence—if no empirical finding could overturn the claim because it is a priori true by definition of 'human life'—then are we doing philosophy, or are we doing theology? I ask because my characters need to know if their guilt and grief are facts about the world, or just facts about us."
