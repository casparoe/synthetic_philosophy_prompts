          *   *Cons:* Often accused of being ad hoc. Why *that* restriction? Tennant's is sophisticated but might exclude too much or feel like a technical fix. Dummett's is very restrictive.
          *   *Verdict:* Solid, but often seen as damage control. High B or Low A.

