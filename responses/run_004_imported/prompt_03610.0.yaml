          *   *Pros:* Technically blocks the proof. Nuanced handling of modal contexts.
          *   *Cons:* Very technical. Does it capture the *spirit* of verificationism? Some argue it changes the subject. The "triviality problem" (knowing *that* p is actual might be easy, but knowing *p* in the situation is hard).
