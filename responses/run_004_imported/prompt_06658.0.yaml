answer: |-
  It is a genuine pedagogical rite of passage to hit the "Oswald Wall." The Kennedy assassination example is the *Drosophila* of conditional semantics: it's clean, historically fixed, and intuitively obvious, which is exactly why it's exhausting. Your students are recycling it because it's the only example most textbooks validate.

  Here is a clean, non-political, non-criminal minimal pair for your seminar, followed by the technical breakdown of why it works, and finally an honest assessment of the "Reverse Oswald" challenge.

  ### The Minimal Pair: The Parallel Circuit

  **The Setup:**
  Imagine a simple electrical circuit powering a single light bulb ($L$). The circuit has two switches, $A$ and $B$, wired in **parallel**. This means the light turns on if *at least one* switch is closed (ON). The switches operate independently; flipping one does not mechanically affect the other.

  **The Actual World:**
  *   Switch $A$ is **ON**.
  *   Switch $B$ is **OFF**.
  *   The Light $L$ is **ON**.

  **The Speaker's Epistemic State:**
  The speaker is standing outside the room. They can see through a window that the **Light is ON**, but they **cannot see the switches**. They know the wiring diagram (parallel), but they do not know the specific positions of $A$ and $B$.

  **The Pair:**
  1.  **Indicative:** "If switch $A$ is OFF, then switch $B$ is ON."
  2.  **Subjunctive:** "If switch $A$ had been OFF, then switch $B$ would have been ON."

  **The Verdict:**
  *   The **Indicative** is **True** (and highly assertable).
  *   The **Subjunctive** is **False** (and unassertable).

  ---

  ### The Technical Breakdown

  This example isolates the divergence without relying on historical conspiracy or agency. Here is what is doing the work in the semantics:

  #### 1. The Modal Base (What facts are available?)
  *   **Indicative (Epistemic Modal Base):** The indicative quantifies over worlds compatible with the speaker's *knowledge*.
      *   The speaker knows $L$ is ON.
      *   The speaker knows the law: $L \iff (A \lor B)$.
      *   When we evaluate the antecedent "A is OFF," we update the epistemic state. In all remaining epistemically possible worlds where $A$ is OFF and $L$ is ON, $B$ *must* be ON (by disjunctive syllogism).
      *   Therefore, the indicative is true relative to the speaker's information state.

  *   **Subjunctive (Metaphysical/Circumstantial Modal Base):** The counterfactual quantifies over worlds compatible with the *actual history and laws*, typically holding fixed "independent" facts.
      *   To evaluate "If $A$ had been OFF," we look for the closest possible world where $A$ is OFF.
      *   Crucially, in standard Lewis/Stalnaker semantics, we hold fixed the state of independent variables. Switch $B$'s position is causally independent of Switch $A$'s position.
      *   In the actual world, $B$ is OFF. So, in the closest world where $A$ is OFF, we hold fixed that $B$ is OFF.
      *   In that world ($A$=OFF, $B$=OFF), the consequent "$B$ is ON" is false.
      *   Therefore, the counterfactual is false.

  #### 2. The Ordering Source (What gets held fixed?)
  This is the crux of the lesson for your students.
  *   **Indicatives** prioritize **evidence**. The fact that $L$ is ON is hard evidence. To make the antecedent ($A$ is OFF) true, we must "give up" the assumption that $A$ is ON, but we *keep* the evidence that $L$ is ON. To preserve $L$=ON given $A$=OFF, we are forced to toggle $B$ to ON in our epistemic update.
  *   **Counterfactuals** prioritize **causal independence**. To make the antecedent ($A$ had been OFF) true, we perform a "local miracle" or backtracking on $A$, but we *keep fixed* the state of $B$ because $B$ is not causally downstream of $A$. We do not force $B$ to change just to save the light; we let the light go out if necessary.

  This demonstrates that indicatives are **diagnostic** (inferring causes from effects given evidence), while counterfactuals are **predictive/interventional** (simulating outcomes given a change in inputs).

  ---

  ### The Bonus: The "Reverse Oswald" (Subjunctive True, Indicative False)

  You asked if it is a deep fact that the Indicative is usually True and the Counterfactual False in these divergent pairs.

  **The Short Answer:**
  Yes, it is a deep structural asymmetry. In the literature (see Jonathan Bennett's *A Philosophical Guide to Conditionals*), this is often tied to the **Direction of Time** and the **Nature of Evidence**.
  *   **Indicatives** rely on what is *known*. If you know enough to assert a counterfactual (which requires knowing the causal laws and the actual state of independent variables), you usually have enough evidence to assert the indicative.
  *   **Counterfactuals** rely on *laws*. You can have strong laws (making the Sub true) but misleading evidence (making the Ind false).

  **The "Reverse" Candidate: The Misleading Mechanism**
  To get **Sub True / Ind False**, you need a scenario where the *causal structure* supports the connection, but the *speaker's evidence* defeats it. This relies on treating Indicative truth as relative to assertability/information (Stalnakerian), rather than objective truth.

  *   **Setup:** A technician is troubleshooting a machine. The machine has a safety sensor ($S$) that shuts down the motor ($M$) if temperature ($T$) gets too high. The link is perfect: High $T \rightarrow S \rightarrow$ Motor Off.
  *   **Actual World:** The motor is running. The temperature is normal. The sensor is functional.
  *   **Speaker's Epistemic State:** The technician has been given a (false) report that the sensor is **broken/disconnected**. They do not know the motor is running; they are hypothesizing.
  *   **The Pair:**
      1.  **Indicative:** "If the temperature gets high, the motor stops."
      2.  **Subjunctive:** "If the temperature had gotten high, the motor would have stopped."

  *   **Evaluation:**
      *   **Subjunctive (True):** The sensor is actually functional. In the closest world where $T$ gets high, the sensor works, and the motor stops. The causal law holds.
      *   **Indicative (False/Unassertable):** Given the technician's *evidence* (the report that the sensor is broken), supposing $T$ gets high does *not* lead them to conclude the motor stops. Their epistemic modal base includes "Sensor is broken." Therefore, relative to their information, the indicative is false.

  **Why this is controversial:**
  Many semanticists argue that if the sensor *is* actually functional, the Indicative *is* objectively true, and the technician is simply ignorant of its truth. However, if you teach conditionals as tools for **reasoning under uncertainty** (the Adams/Edgington tradition), the assertability conditions *are* the truth conditions. In that framework, the Reverse Oswald is possible whenever **evidence diverges from reality**.

  **Pedagogical Recommendation:**
  Use the **Parallel Circuit** for the core lesson. It is robust, objective, and doesn't rely on speaker ignorance. Use the **Misleading Mechanism** as a discussion point for advanced students to debate whether conditionals are about the world (metaphysical) or our talk about the world (epistemic). That distinction is usually where the real graduate seminar gold is mined.
