answer: |-
  **Title:** The Wedge Between Chapters: Why Williamson's Anti-Luminosity and Anti-KK Arguments Must Be Decoupled

  **Introduction**

  It is a commonplace in contemporary epistemology to treat Timothy Williamson's *Knowledge and Its Limits* (2000) as presenting a unified front against internalism. Specifically, graduate seminars often run together the argument of Chapter 4 (the anti-luminosity argument, exemplified by the "feeling cold" case) and the argument of Chapter 5 (the margin-for-error argument against the KK principle). The standard reading suggests that Chapter 5 is merely the generalization of Chapter 4: if we cannot know our own mental states due to reliability constraints, *a fortiori* we cannot know that we know external propositions.

  This conflation is a mistake. It obscures the distinct logical structures of the two arguments and leaves Williamson's project vulnerable to objections that apply to one chapter but not the other. This essay argues that the Chapter 4 argument (Anti-Luminosity) and the Chapter 5 argument (Anti-KK) are structurally distinct. Furthermore, by engaging with Brueckner and Fiocco's (2002) "Lincoln" counterexample and Berit Brogaard's (2008) defense of phenomenal luminosity, I will demonstrate that Williamson fails to establish the universal non-luminosity of mental states (Ch. 4), but succeeds in undermining the KK principle for inexact knowledge (Ch. 5). Your department is wrong to blur them: Chapter 4 collapses, but Chapter 5 stands.

  **I. The Structural Distinction: Sorites vs. Safety Iteration**

  To separate the arguments, we must look at their engines. The Chapter 4 argument is a *Sorites-style* argument applied to phenomenal states. Williamson asks us to consider a subject gradually warming up from dawn to noon. He posits a reliability condition: to know one feels cold, one's belief must not be true in the actual case only by luck; it must be true in sufficiently similar cases. Because the change from "feeling cold" to "not feeling cold" is gradual, there must be a borderline case where the subject feels cold but cannot discriminatively tell it from a case where they do not. Thus, luminosity fails. The crux here is the *continuity of the mental state* and the limits of *discriminative ability*.

  The Chapter 5 argument, by contrast, is a *logical* argument applied to the structure of safety conditions on knowledge. It does not rely on a gradual change in a mental state. Instead, it relies on the iteration of margin-for-error principles. If I know a proposition $p$ (e.g., "there are between 100 and 110 trees"), my belief must be safe: in nearby worlds where I believe $p$, $p$ is true. Williamson argues that if KK holds, this safety condition iterates. If I know $p$, I know that I know $p$. But knowing that I know $p$ requires an even wider margin for error than knowing $p$. Iterating this requirement eventually demands infallibility for inexact knowledge, which is impossible.

  The distinction is vital. Chapter 4 argues from the *nature of phenomenal transition* to the failure of self-knowledge. Chapter 5 argues from the *logic of safety* to the failure of higher-order knowledge. One can accept the safety constraints of Chapter 5 without accepting the Sorites reasoning of Chapter 4.

  **II. The Brueckner and Fiocco Objection: The Lincoln Case**

  The conflation of the two chapters becomes dangerous when we consider Brueckner and Fiocco's (2002) critique, which targets the Chapter 4 argument specifically. They utilize a case that Williamson himself discusses but deploys differently: the assassination of Lincoln.

  Consider a subject, S, who believes Lincoln is President. At $t_1$, Lincoln is alive; S knows Lincoln is President. At $t_2$, Lincoln is assassinated. S has not yet received the news; S's evidence and internal state are identical to $t_1$. At $t_2$, S no longer knows Lincoln is President, because knowledge is factive.

  Brueckner and Fiocco use this to attack the reliability premise in Chapter 4. Williamson's anti-luminosity argument assumes that if S knows they feel cold at $t_i$, S must be able to rule out not feeling cold at $t_i$. This requires a discriminative ability that tracks gradual changes. However, the Lincoln case shows that knowledge can be lost *without any change in discriminative ability or internal evidence*. Knowledge is sensitive to the factivity of the content, not just the reliability of the cognitive process.

  If we apply this to the "feeling cold" case, the Sorites reasoning loses its bite. Williamson assumes that because the *feeling* changes gradually, the *knowledge* of the feeling must track that gradient via discrimination. But if knowledge is factive, the loss of knowledge might be sharp, even if the feeling changes gradually. The Lincoln case demonstrates that the boundary of knowledge is determined by the boundary of the fact, not necessarily by the boundary of the subject's discriminatory powers.

  This objection devastates Chapter 4. It shows that the Sorites premise (that there must be a point where one feels cold but cannot know it due to indistinguishability) relies on a specific, contestable model of reliability that ignores factivity. However, notice that this objection does *not* touch Chapter 5. The Anti-KK argument in Chapter 5 does not rely on a gradual change in the world (like warming up or assassinations). It relies on the structural impossibility of satisfying iterated safety conditions for *inexact* knowledge. The Lincoln case supports the idea that knowledge requires safety (Chapter 5), even as it undermines the Sorites application of reliability to mental states (Chapter 4).

  **III. A Second Reply: Phenomenal Luminosity**

  To further drive the wedge between the chapters, consider Berit Brogaard's (2008) defense of phenomenal luminosity. Williamson claims *no* non-trivial condition is luminous. Brogaard argues that phenomenal states (e.g., *seeming* that there is a tree, or *feeling* a sharp pain) are luminous because their phenomenal character is constituted by the subject's awareness of them.

  If Brogaard is right, Chapter 4 is false. There *are* interesting mental states that are luminous. But does this restore KK? No. Even if I am luminous regarding my pain, I do not thereby know that I *know* I am in pain, if "know" entails the externalist safety conditions Williamson outlines in Chapter 5.

  This highlights the independence of the two arguments. One can be an internalist about phenomenal states (accepting luminosity, rejecting Ch. 4) while remaining an externalist about knowledge attribution (accepting safety constraints, accepting Ch. 5). By conflating the two, your department forces a false dilemma: either accept Williamson's entire externalist package or reject it all. The literature allows for a hybrid view: Luminosity holds for the phenomenal, but KK fails for the propositional.

  **IV. The Verdict**

  So, does Williamson succeed? We must issue a split verdict.

  **On Chapter 4 (Anti-Luminosity): Williamson Fails.**
  The argument relies on a Sorites construction that treats mental states as if they were vague predicates like "bald." But as Brueckner and Fiocco show, the factivity of knowledge breaks the Sorites chain. Knowledge can snap off when the fact changes, regardless of discriminative ability. Furthermore, Brogaard's phenomenological analysis suggests that for core mental states, the "gap" Williamson tries to exploit between the state and the awareness of the state does not exist. The "feeling cold" case is not a paradigm of all mental states; it is a borderline case of a dispositional state. Core phenomenal states remain luminous.

  **On Chapter 5 (Anti-KK): Williamson Succeeds.**
  Even if Chapter 4 falls, Chapter 5 remains robust. The argument here is not about whether we can access our minds, but about the logic of *inexact knowledge*. If knowledge requires safety (a margin for error), then iterating that knowledge (KK) requires a wider margin. For empirical propositions (like the number of trees, or even whether one is standing), we simply cannot satisfy the iterated safety conditions without demanding infallibility. The Lincoln case actually *supports* this: it shows knowledge is fragile and fact-dependent. If knowledge is that fragile, the claim that we can always know *that* we know is untenable. The structural proof in Chapter 5 holds regardless of whether "feeling cold" is luminous.

  **Conclusion**

  Your department's tendency to treat Chapters 4 and 5 as the "same move" is a pedagogical and philosophical error. Chapter 4 is a contingent argument about the granularity of mental states and discrimination, which fails against the factivity objections of Brueckner and Fiocco and the phenomenal defenses of Brogaard. Chapter 5 is a necessary argument about the logic of safety and inexact knowledge, which survives those objections.

  Williamson does not succeed in showing that *no* interesting mental state is luminous. Phenomenal states likely remain luminous. However, he *does* succeed in showing that KK fails for empirical knowledge. We should teach these not as a unified assault on internalism, but as two separate claims: one false (universal non-luminosity), and one true (the failure of KK for inexact knowledge). Keeping them separate is the only way to see where Williamson's externalism is truly unavoidable, and where it is merely overstated.

  ***

  **Seminar Pushback Notes (For your preparation):**

  *   **If students say:** "But Williamson says Ch. 5 depends on Ch. 4."
      *   **Response:** He motivates the Margin for Error principle in Ch. 5 using Ch. 4, but the *derivation* of the anti-KK result in Ch. 5 is formal. Even if you reject the "feeling cold" case, if you accept Safety (which the Lincoln case supports), the iteration problem in Ch. 5 arises.
  *   **If students say:** "Brueckner & Fiocco concede knowledge isn't luminous, they just dislike the Sorites."
      *   **Response:** Correct, but that's the point. They reject the *argument* of Ch. 4, not necessarily the conclusion. But combined with Brogaard, we have reason to reject the conclusion of Ch. 4 while keeping Ch. 5.
  *   **If students say:** "Isn't KK just luminosity for knowledge?"
      *   **Response:** No. Luminosity is: If in M, know M. KK is: If know p, know know p. Luminosity is about access to states; KK is about iteration of propositional attitudes. You can have one without the other.
