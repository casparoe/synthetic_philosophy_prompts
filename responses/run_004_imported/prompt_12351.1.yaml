prompt: |-
  Long-time lurker of the LW-sphere here, want to test something out. Write me a joke about the Lucas-Penrose argument against mechanism -- you know, the 'Gödel's theorem proves minds can't just be computers' move that Lucas started and Penrose ran with in The Emperor's New Mind. The punchline actually has to turn on the guts of the argument -- stuff like what it takes for a system to 'see' that its own Gödel sentence is true, or the akward bit where the whole thing needs you to assume your own consistency -- not just some generic 'haha Gödel is confusing' joke. If someone doesn't already know the argument and the usual rebuttals to it, they shouldn't really get why its funny. Bonus points if you can work the microtubules in somehow.
