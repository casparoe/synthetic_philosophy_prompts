answer: |-
  Sir Roger Penrose is finishing a seminar on *The Emperor's New Mind* at a Less Wrong meetup. He closes his slides with the classic flourish:

  "As we have established, any formal system $F$ capable of arithmetic contains a Gödel sentence $G_F$ which is unprovable within $F$. Yet, as human mathematicians, we can *see* that $G_F$ is true. Therefore, the human mind cannot be a formal system. Mechanism is false."

  A hand goes up in the back. It's a grad student wearing a "I Updated My Priors" t-shirt.

  "Sir," the student says. "To 'see' that $G_F$ is true, we must reason: 'If $F$ is consistent, then $G_F$ is true.' So, to perceive the truth of $G_F$, we must know that $F$ is consistent."

  "Precisely," Penrose nods.

  "And if the mind *is* the formal system $M$," the student continues, "then to perceive $G_M$, the mind must know $Con(M)$. But by Gödel's Second Incompleteness Theorem, if $M$ is consistent, it cannot prove $Con(M)$. So how do you know you're consistent?"

  Penrose smiles patiently. "Because the brain is not a classical computer. The microtubules in our neurons utilize orchestrated objective reduction. Quantum gravity effects allow us to access non-computable truths directly. We don't *prove* consistency; the microtubules *intuit* it."

  The grad student pauses, typing furiously on their laptop. "So, you're saying your microtubules are hardware that asserts their own soundness as an axiom?"

  "In a manner of speaking."

  "Okay. So, if you *were* a formal system, and you asserted your own consistency, you would, by Gödel's Second, be inconsistent."

  "But I'm not a formal system!"

  "Right, that's the conclusion. But the argument structure is: 'I am not a machine because I can assert my consistency.' If you are a machine, asserting your consistency makes you inconsistent. If you are inconsistent, you can prove anything—including that you aren't a machine."

  Penrose blinks. "Are you suggesting my microtubules are inconsistent?"

  "I'm suggesting," says the student, closing their laptop, "that if your argument relies on your hardware asserting its own consistency to validate its output, you haven't proven you're non-computable. You've just proven that if you *are* a computer, you're a trivial one that outputs 'True' for every statement, including 'The sky is green' and 'Penrose is a machine.'"

  The room goes silent.

  The student shrugs. "Congratulations, Sir Roger. You haven't escaped mechanism. You've just debugged your brain down to a `while(true) { print("I_AM_SOUND"); }` loop and called it quantum gravity."
