  Diderot: You mistake the mirror for the room, Jean-Jacques. You see deception where I see empathy.

  Rousseau: It is evacuation. Consider the actor. To convince the crowd, he must hollow out his own identity. He suppresses his own grief to play a king, his own joy to play a victim. Night after night, he sells the appearance of passion without the substance. What remains of the man when the curtain falls? A shell. He belongs to the public, not to himself.

  Diderot: What remains is a man who has lived a thousand lives. You fear the actor loses himself; I argue he expands his capacity for humanity. To inhabit another skin is the highest moral exercise. It demands we step outside the narrow prison of the self. You speak as if the self is a solid stone, but it is clay. Why not shape it toward others?

  Rousseau: Because it shapes it toward applause. It demands we live in the opinion of others. That is the root of all vice. But look at what the audience learns. You claim the stage educates the passions. Look at Molière. The *Misanthrope*. Alceste refuses the polite lie. He demands sincerity. And how is he treated? As a ridiculous crank. Philinte, who flatters corrupt nobles to keep the peace, is the voice of reason.

  Diderot: Alceste is not punished for truth, but for rigidity. He loves humanity too little to forgive its flaws. Philinte understands that virtue requires navigation, not just declaration. If the audience laughs at Alceste, it is because they recognize their own inability to be so pure. It is a check on fanaticism.

  Rousseau: It is a lesson in cowardice! They laugh because they are relieved. They learn that sincerity is impractical. That to succeed in society, one must be complicit. You say your own dramas correct this—that you show suffering virtue to inspire imitation. But I say it is a trap.

  Diderot: A trap? How?

  Rousseau: When a spectator weeps for a fictional widow, he feels virtuous. He has paid his ticket, shed his tear, and satisfied his conscience. He goes home and ignores the beggar at his door. The theatre consumes the impulse to act. It substitutes the sign of virtue for the deed.

  Diderot: You reduce sensation to a transaction. Feeling is the precursor to action. We are not born knowing how to pity; we must be taught. The stage is a gymnasium for the heart. Without it, compassion atrophies. You would deny them the weights because some might lift them vainly?

  Rousseau: He keeps his heart soft for illusions. Real virtue is hard, Denis. It is solitary. It requires resisting the crowd, not joining them in the dark. You wrote in *The Natural Son* that "only a wicked man is truly alone." Was that a dart aimed at my retreat?

  Diderot: It was for the human condition. Isolation breeds selfishness. You seek solitude to remain whole, but I say solitude is where the monster grows. You say the actor hollows himself? I say the hermit hardens himself. Your Geneva without theatre is a city of mirrors facing inward.

  Rousseau: Better a hard mirror than a painted mask. You believe you can educate passion without corrupting the source. I tell you, the medium is the message. To applaud a performance is to applaud deception.

  Diderot: To applaud a performance is to applaud the recognition of truth within the fiction. We are not so far apart, Jean-Jacques. We both want men to be better.

  Rousseau: I want men to be real. You want them to be improved. There is the distance.

  Diderot: And who will bridge it? The actor, or the hermit?

  Rousseau: Neither. The citizen who needs no stage to know his duty.

  Diderot: Then God help us all. We are too weak for that.
