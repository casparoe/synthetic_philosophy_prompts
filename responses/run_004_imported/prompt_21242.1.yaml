      *   *Specific Checks:* Ensure the payoff structure is clear (Take = end, Pass = grow). Ensure the distinction between *Normative* (how you should play) and *Descriptive* (how people do play) is clear.

  5.  **Refining the Analysis (Self-Correction during drafting):**
