answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Journal Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Revised Evidential Standards Policy (Vol. 45+)

  **Context**
  Following the replication concerns raised at the recent society meeting, we have spent months debating whether our statistical policy should mandate a Bayesian framework or reinforce frequentist proceduralism. Both camps identify real pathologies in our literature: the misinterpretation of $p$-values as posterior probabilities, the flexibility of analytical paths ("p-hacking"), and the tendency to treat "significance" as a truth claim rather than an index of evidence.

  However, mandating a specific statistical paradigm (Bayesian vs. Frequentist) conflates the *language* of inference with the *quality* of inference. A posterior probability can be just as misleading as a $p$-value if the model structure is unexamined or the priors are convenient. Conversely, a $p$-value is useful if interpreted strictly as an error probability within a well-designed test.

  **Recommendation**
  I propose we reject a ban on null-hypothesis significance testing (NHST) but adopt a policy of **Severe Testing and Transparency**. Our goal should not be to dictate how authors calculate probability, but to dictate how they demonstrate that their claims have been *probed* for error.

  Effective with the next volume, I recommend the following four requirements for all empirical submissions:

  1.  **Analysis Registration or Disclosure:**
      *   Preregistration is encouraged for experimental work.
      *   For observational/field data where preregistration is impractical, authors must submit a "Analysis Disclosure Statement" detailing all variables collected, all data exclusions, and all alternative models tested before arriving at the final result. This addresses the "forking paths" concern regardless of statistical framework.

  2.  **Estimation Over Dichotomization:**
      *   $p$-values may be reported but cannot be the sole basis for inference. All main effects must be accompanied by effect sizes and uncertainty intervals (confidence or credible).
      *   Language claiming a hypothesis is "proven" or "true" based on a threshold (e.g., $p < 0.05$ or $BF > 3$) is prohibited. We publish evidence, not verdicts.

  3.  **Sensitivity and Robustness Checks:**
      *   *To address the Bayesian critique:* Authors using Bayesian methods must demonstrate sensitivity to prior specification.
      *   *To address the Frequentist critique:* Authors using NHST must demonstrate robustness to data cleaning decisions and model assumptions.
      *   If a result disappears when a prior is flattened or a specific outlier handling method is changed, the claim has not passed a severe test and should be framed as exploratory.

  4.  **Power and Precision Statements:**
      *   Authors must explicitly discuss the capacity of their data to detect effects of ecological relevance. A non-significant result in an underpowered study cannot be interpreted as evidence for the null; a significant result in a massive dataset must be contextualized regarding ecological magnitude.

  **Guidance for Reviewers**
  We will update our reviewer guidelines to shift the focus from "Are the statistics technically correct?" to "Is the inference warranted?" Reviewers should be instructed to ask:
  *   *Could this result have arisen easily if the claim were false?*
  *   *Did the authors check if their conclusion depends on arbitrary modeling choices?*

  **Conclusion**
  This approach accepts the Bayesian diagnosis that standard NHST is often misused and ignores background knowledge, but it rejects the prescription that swapping frameworks solves the problem. By focusing on **robustness, transparency, and severity**, we accommodate both camps while raising the bar for what counts as evidence in our journal.

  I move that we form a small working group to draft the specific author guidelines based on these principles by next quarter.
