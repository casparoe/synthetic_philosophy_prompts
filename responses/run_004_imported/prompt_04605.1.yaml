      *(Self-Correction during drafting)*: Make sure to clarify that Intuitionistic logic doesn't solve the contradiction, it solves the *inference to omniscience*. It stops you from concluding "All truths are known," but you still have to accept "There are no unknown truths" (in a double-negation sense). I need to be precise there so the student doesn't get dinged by the professor.

      *(Another Correction)*: Ensure I explain *why* the substitution isn't arbitrary. It's the only proposition that describes the *gap* between truth and knowledge.

