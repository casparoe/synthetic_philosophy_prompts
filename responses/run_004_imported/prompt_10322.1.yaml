          *   Truth: Hot, Rainy, Windy ($h, r, w$).
          *   Theory A: Hot, Rainy, Still ($h, r, \neg w$). (1 error).
          *   Theory B: Cold, Dry, Still ($\neg h, \neg r, \neg w$). (2 errors).
          *   Show why Popper says A is not better than B.
          *   Actually, Miller's proof is easier to explain with just propositions $p, q$. Let's stick to the $p, q$ abstraction but give it concrete labels.
          *   Let's use the "Infection" analogy. If you have a false theory, you have a "virus" (a false consequence). Any new true statement you bring in can be combined with the virus to create a new strain of the virus (a new false consequence).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* the falsity content increases?
      *   *Explanation:* If Theory $T$ is false, it implies some false statement $f$. If we identify a true statement $t$ that $T$ implies, $T$ also implies $t \land f$. Since $f$ is false, $t \land f$ is false. So for every true consequence $t$, there is a corresponding false consequence $t \land f$.
      *   *Wait, is that strictly true?* Only if $t$ is independent. But the Miller/Tichý proof essentially shows that the *set* of false consequences grows faster or equal to the set of true consequences for false theories.
      *   *Better explanation for undergrads:* Focus on the condition for "Betterness." To be better, you need *more* truth and *no more* falsity. The proof shows that if you are false, gaining more truth *necessarily* brings more falsity along for the ride.
      *   *Key mechanism:* $t$ is true, $f$ is false. $t \lor f$ is true. $t \land f$ is false. If a theory implies $t$ and $f$, it implies both. If you compare two false theories, the one with more truth content inevitably drags in enough logical combinations to increase falsity content.
