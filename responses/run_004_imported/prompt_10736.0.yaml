answer: |-
  **Setting:** *The hotel bar of the annual Society for Decision Theory conference. 11:30 PM. The ice in Elias's glass has melted. Sarah is still on her first whiskey.*

  **Elias:** I saw your name on the panel. "Beyond the Dutch Book." I almost didn't come in. I assumed you were finally going to admit that cyclic preferences are just a tax on stupidity.

  **Sarah:** And I assumed you'd be here. I ordered the whiskey because I knew you'd need something stronger than that gin to hear me say that resolute choice isn't a patch. It's a correction.

  **Elias:** It is a patch, Sarah. It's duct tape. If your preferences cycle—A over B, B over C, C over A—you are incoherent. Full stop. Resolute choice doesn't fix the incoherence; it just gives you a mechanism to ignore it. You're not making the preferences rational; you're just bullying your future selves into compliance.

  **Sarah:** I'm not bullying them. I'm recognizing that the "self" at the moment of choice isn't the unit of analysis. The *plan* is. If I adopt a strategy at t1 that prevents me from entering a money pump, and I stick to it at t2 even though my local preferences have shifted, I haven't acted irrationally. I've acted *resolutely*.

  **Elias:** But at t2, you explicitly prefer B to A. You acknowledge that. You look at the options, you say "I want B more," and then you choose A because of a rule you made in the past. That's not rationality; that's akrasia with a fancy name. You're violating the dominance principle at the node of choice.

  **Sarah:** I'm violating dominance only if you think the node is the whole world. But the node is embedded in a temporal sequence. If I defect from the plan at t2 because my local preferences say so, I validate the pump. Rationality isn't about maximizing satisfaction at an instant; it's about not ending up poorer at the end of the day. If I don't get pumped, in what sense am I irrational?

  **Elias:** In the sense that your preferences still don't map to a utility function. You've just hidden the contradiction behind a wall of willpower. You're saying it's rational to have broken preferences so long as you're strong enough to ignore them. That's like saying a car with no engine is fine as long as you push it hard enough.

  **Sarah:** No, I'm saying the engine isn't the preference ordering at a single time-slice. The engine is the capacity to bind oneself across time. You're obsessed with synchronic coherence—making sure every snapshot is perfect. But we live in time, Elias. A movie made of perfect stills can still be a nonsensical story if the frames don't connect. Resolute choice connects the frames.

  **Elias:** A movie made of nonsense frames is still nonsense. If every temporal slice of you is holding a preference that contradicts your action, the whole trajectory is built on a lie. You're smuggling in a new axiom: "Thou shalt not change thy mind." But that's not rationality, that's stubbornness. Why does t1 get to dictate to t2? t2 is the one who actually has to pay the cost.

  **Sarah:** Because t1 is the one who saw the trap. t2 is myopic. If you privilege the local preference at t2, you privilege the part of the agent that is most vulnerable to exploitation. Rationality requires identifying with the planner, not the doer. If I don't identify with my past plan, I'm not an agent anymore; I'm just a series of impulses waiting to be arbitraged.

  **Elias:** And if you force t2 to act against its own judgment, you're splitting the agent. You're creating a tyranny of the past over the present. That's not coherence, that's oppression. You haven't solved the money pump; you've just internalized the pump-maker. You're exploiting yourself to stop me from exploiting you.

  **Sarah:** Better self-exploitation than being a victim of the market. Look, if the axioms of expected utility say I must be pumped, maybe the axioms are the problem. Not the agent.

  **Elias:** The axioms describe what it means to have a goal. If you don't have a consistent goal, you aren't pursuing anything. You're just... persisting.

  **Sarah:** And you're just... calculating.

  *(Elias signals for the check. Sarah doesn't move to split it.)*

  **Elias:** You know, we tried resolute choice once. Remember? We made a plan at t1.

  **Sarah:** We did. And at t2, the local preferences shifted. But I'm not the one who defected, Elias.

  **Elias:** *(Puts cash on the table)* No. You just redefined the game so you couldn't lose.

  **Sarah:** *(Picks up her glass)* And you walked away because the math didn't balance. Some things don't balance until the end of the sequence.

  **Elias:** Some things don't balance at all.

  *(They clink glasses. Neither drinks.)*
