prompt: |-
  My two closest friends from the PhD program are getting married and I'm giving the toast. I'm not even a pragmatism person myself (I do phil of mind) but I've heard this fight enough times I got both positions memorized: she's hardcore Peirce -- truth is whatever the whole community of inquirers would converge on at the end of inquiry, a "we get there together, eventually" kind of view -- and hes hardcore James -- truth is cash-value, whatever actually pays off for you in your actual life right now. Each thinks the others view is a disaster: she says his collapses into "true just means I can get away with believing it," he says hers is a mystical appeal to some infinite community that's never actually going to converge on anything. Half the room is our department and will catch every reference, the other half is family who've never heard of either guy. Write me a ~5 min toast that uses their fight as the actual backbone of the speech and ends with a real, earned reconciliation between the two views -- not just "well really they're both right!" -- and lands as sweet, not as a seminar.
