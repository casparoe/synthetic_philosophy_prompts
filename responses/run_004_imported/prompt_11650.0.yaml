answer: |-
  Good evening. For those who don't know me, I'm a friend from the department. I specialize in Philosophy of Mind, which means I spend a lot of time thinking about how we think. But standing here, watching [Bride] and [Groom] together, I've realized I've been studying the wrong thing. I should have been studying *them*.

  Because for the last five years, I have had a front-row seat to the greatest rivalry in American philosophy.

  On one side, we have [Bride]. She is a hardcore Peircean. She believes truth is what the entire community of inquirers would agree on at the end of time. It's the "Long Game." It's objective, it's communal, and it requires patience.

  On the other side, we have [Groom]. He is a hardcore Jamesian. He believes truth is "cash value." It's what works *right now*. It's practical, it's immediate, and it requires action.

  I have heard this fight enough times to have it memorized. [Bride], you've told him that his view collapses into moral laziness—that "true" just means "whatever I can get away with believing." And [Groom], you've told her that her view is a mystical appeal to an infinite community that is never actually going to show up.

  To the philosophers in the room: You know the stakes. To the family: Essentially, she thinks he's too focused on today, and he thinks she's too focused on a distant tomorrow.

  By all academic accounts, this relationship should be a disaster. One is waiting for the end of inquiry; the other is cashing the check before the ink is dry.

  But then I watched them plan this wedding. And I realized something that neither Peirce nor James ever quite figured out on their own.

  I watched [Groom] solve problems. The caterer cancelled, the rain was coming, the music was wrong. He didn't wait for the ideal solution. He found what worked. He made it pay off *in the moment*. That is the gift of James. He brings the warmth, the immediacy, the joy of *now*. He ensures that the truth of their love has cash value every single morning when they wake up. A marriage cannot survive on a promise of what might be true in thirty years. It needs to be true *today*.

  But then I watched [Bride] hold the vision. When the stress got high, she didn't just patch the hole; she reminded everyone *why* they were there. She anchored them to the long arc. That is the gift of Peirce. She brings the horizon. She ensures that the "community of inquirers" isn't the whole world, but it is the two of them, converging on a life built together. She reminds him that some things are worth believing in, even when they don't pay off immediately.

  Here is the reconciliation. It isn't that they compromised. It's that they discovered that marriage is the only place where these two definitions of truth actually become the same thing.

  [Bride], for you: In a marriage, the "community of inquirers" doesn't have to be the whole world. It's just the two of you. If you keep inquiring together, if you keep listening, the truth you converge on *is* the life you build. The end of inquiry isn't death; it's the legacy you leave.

  [Groom], for you: In a marriage, "cash value" isn't about what you can get away with. It's about what you can give. The "expedient" thing to do is the thing that makes *her* life work. When you serve the relationship, your truth pays dividends for both of you.

  Peirce gives you the vow. James gives you the Tuesday night dinner.
  Peirce gives you the direction. James gives you the fuel.
  One without the other is cold or fleeting. But together? Together, they make a promise that feels good to keep.

  So, to the philosophers in the room: They have solved Pragmatism.
  And to the family: They have just fallen in love.

  Let's raise a glass.

  To [Bride] and [Groom]. May your "cash value" be high every morning, and may your "final consensus" be a long, happy life together.

  To the happy couple!
