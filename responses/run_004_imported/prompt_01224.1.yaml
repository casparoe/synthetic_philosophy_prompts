answer: |-
  Your intuition is excellent, and your philosopher friend was right (even if the wine made him inarticulate). It is incredibly common to conflate these two because, in the famous "Bank Cases" (originally crafted by Keith DeRose), they produce the exact same verdict: **Low Stakes = Knowledge; High Stakes = No Knowledge.**

  However, they disagree violently on *why* that verdict is reached. If you are writing a feature on how pressure warps thinking, this distinction is actually gold for you. It boils down to this: **Does pressure warp the *language* we use to describe knowledge, or does it warp the *state* of knowledge itself?**

  Here is the breakdown of the distinction, where they diverge, and how you can use it in your piece.

  ### 1. The Core Disagreement: Semantics vs. Metaphysics

  The fundamental split is between **Epistemic Contextualism** (a theory about language) and **Pragmatic Encroachment** (a theory about the nature of knowledge).

  **Epistemic Contextualism (The Linguistic View)**
  *   **The Claim:** The word "knows" is indexical, like "tall," "here," or "enemy." Its meaning shifts depending on the **conversational context of the speaker.**
  *   **The Mechanism:** In a low-stakes conversation, the standard for applying the word "knows" is low. In a high-stakes conversation, the standard for applying the word "knows" is high.
  *   **The Implication:** The couple in the Bank Case might have the exact same mental state and evidence in both scenarios. They don't change. The *world* doesn't change. Only the *threshold for using the label* changes based on who is talking and what they care about.
  *   **Analogy:** If you say a jockey is "tall" at a horse track, you might be right. If you say an NBA player is "tall" at a basketball game, you might be wrong. The person didn't shrink; the context for the word "tall" shifted. Contextualists say "knows" works the same way.

  **Pragmatic Encroachment (The Metaphysical View)**
  *   **The Claim:** The meaning of "knows" is stable. However, whether you actually *possess* knowledge depends on your **practical environment (the stakes).**
  *   **The Mechanism:** Practical factors (like needing to make a mortgage payment) "encroach" on the epistemic realm. High stakes can actually degrade your justification or your status as a knower.
  *   **The Implication:** The couple in the Bank Case *actually change* when the stakes rise. In the low-stakes scenario, they possess knowledge. In the high-stakes scenario, they literally do not possess knowledge, even if their evidence is identical.
  *   **Analogy:** Think of a pilot being "fit to fly." If they are flying a paper airplane, a slight head cold doesn't matter. If they are flying a 747, that same head cold makes them objectively "unfit." The pilot's physiology is the same, but the stakes determine their status. Encroachers say knowledge works like "fit to fly."

  ### 2. Where They Diverge (The "Tell")

  Since they agree on the Bank Case, you need to know where they disagree so you don't flatten them in your article. Philosophers separate them using cases where the **Speaker's Context** and the **Subject's Stakes** come apart.

  **Scenario: The Ignorant Subject**
  Imagine a husband and wife are driving past the bank. They have a mortgage due, so the stakes are objectively sky-high (Encroachment territory). However, they have forgotten about the mortgage. They think it's no big deal (Low Stakes in their heads). A third party (you) knows about the mortgage.

  *   **The Contextualist says:** It depends on *your* conversation. If you are chatting casually with a friend about the couple, you can truthfully say, "They know the bank is open." Why? Because *your* conversational context is low-stakes. The word "knows" is being used loosely.
  *   **The Encroachment Theorist says:** You cannot truthfully say they know. Because the *subject's* stakes are high (the mortgage exists whether they remember it or not), they do not possess knowledge. The practical reality encroaches on their mental state regardless of what anyone is saying.

  **Scenario: Retraction**
  The husband says on Friday morning (low stakes), "I know the bank is open." Then, on Friday afternoon, the mortgage crisis hits (high stakes).

  *   **The Contextualist says:** He doesn't need to retract his morning statement. He spoke truly *relative to the morning context*.
  *   **The Encroachment Theorist says:** He effectively spoke falsely, or at least, his claim is now undermined. The rise in stakes reveals that he didn't know it then, because knowledge requires the ability to act, and he couldn't safely act then given the hidden stakes. (Note: Encroachment views on retroactivity vary, but they generally treat the knowledge status as more fragile than Contextualists do).

  ### 3. Why This Matters for Your Feature

  You mentioned your theme is "how stakes and pressure warp the way we think." This philosophical distinction gives you two very different narratives for that theme.

  **Narrative A (Contextualism): Pressure warps our *standards*.**
  If Contextualism is right, pressure makes us linguistic snobs. It makes us demand more certainty before we allow someone to use the word "know." This is a story about **communication and social expectations.** Under pressure, we stop trusting each other's assertions. We demand guarantees. The "warping" is in our social fabric and language games.

  **Narrative B (Encroachment): Pressure warps our *minds*.**
  If Pragmatic Encroachment is right, pressure literally alters the epistemic status of our beliefs. This is a much darker, more psychological story. It suggests that **anxiety and consequence degrade cognition.** It implies that you cannot separate "what you know" from "what you have to lose." Under this view, a terrified surgeon literally *knows less* about the procedure than a calm one, even if they read the same textbooks. The pressure penetrates the mind itself.

  ### Summary for your notes:

  | Feature | Epistemic Contextualism | Pragmatic Encroachment |
  | :--- | :--- | :--- |
  | **What shifts?** | The meaning of the word "knows." | The status of the believer's knowledge. |
  | **Whose context matters?** | The **Speaker/Attributor** (who is talking). | The **Subject** (the person acting). |
  | **Category** | Semantics / Linguistics. | Epistemology / Metaphysics. |
  | **Vibe** | "We are being picky with words because the risk is high." | "The risk is so high it broke their justification." |

  **The Verdict:**
  Your friend was right. They are rival theories. Contextualists hate Encroachment because they want to keep practical stakes out of the definition of knowledge (keeping epistemology "pure"). Encroachers hate Contextualism because they think it makes knowledge too easy to talk away linguistically without addressing the real-world risk.

  For your article, the Encroachment angle is likely more resonant for a general audience interested in psychology and pressure. It validates the feeling that **when the stakes go up, our grip on reality actually loosens.** Contextualism is a bit drier—it suggests we just get pickier about our vocabulary.

  If you want to be precise: Use **Contextualism** when discussing how we *talk* about certainty under pressure. Use **Pragmatic Encroachment** when discussing how pressure *affects* our actual certainty and decision-making capacity.
