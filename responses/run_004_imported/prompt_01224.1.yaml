      *   *Ignorance of Stakes:* What if the subject doesn't know the stakes are high? (Encroachment usually says knowledge is lost anyway; Contextualism focuses on the attributor's context).
      *   *Semantic vs. Metaphysical:* This is the big one. Contextualism is linguistics/semantics. Encroachment is epistemology/metaphysics.

