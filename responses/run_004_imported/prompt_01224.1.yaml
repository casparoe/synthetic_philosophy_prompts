      *   *Pragmatic Encroachment:* The *state* of knowledge itself changes depending on the practical stakes of the *subject*. It's a metaphysical/epistemic claim. Knowledge depends on action/practical reasoning.
      *   *Key Distinction:* Who/what is shifting? The standard for the word (Contextualism) vs. the nature of the mental state (Encroachment). Where does the variation come from? The conversational context (Contextualism) vs. the subject's practical situation (Encroachment).

