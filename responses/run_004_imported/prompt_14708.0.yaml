      *   **The Conflict:** A labmate had a high confidence (0.95) in a result that failed. She ranked last. She argues this is unfair because one confident miss outweighs several cautious hits.
      *   **Proposed Alternative:** Brier Score? No, she wants a "correct side of 50%" rule (Classification Accuracy / Directional Accuracy). Credit if $p > 0.5$ and event happens, or $p < 0.5$ and event doesn't.
      *   **User's Intuition:** Something is wrong with the proposed fix, but they can't articulate it. They want to know if they are right to resist and what is at stake.

  2.  **Evaluate the Scoring Rules:**
