          *   *Properties:* Proper scoring rule (incentivizes truth-telling). Penalizes overconfidence severely. Distinguishes between 51% confidence and 99% confidence.
          *   *Pros:* Encourages calibration and resolution. Rewards nuanced probability assessment.
          *   *Cons:* Can feel harsh on single outliers (unbounded loss as $p \to 0$ or $1$).
      *   **"Correct Side of 50%" (Proposed):**
          *   *Properties:* Improper scoring rule (in the context of probability elicitation). It treats 0.51 and 0.99 as identical.
          *   *Pros:* Simple, intuitive, robust to extreme outliers.
          *   *Cons:* Destroys incentive to distinguish likelihood. Encourages hedging around 0.51 or 0.99 without genuine differentiation. Loses information about *uncertainty*.

  3.  **Identify the Core Theoretical Concepts:**
      *   **Proper Scoring Rules:** The log score is *strictly proper*. This means the expected score is maximized (or loss minimized) only when the forecaster reports their true belief.
      *   **Calibration vs. Resolution:**
          *   *Calibration:* When you say 70%, it happens 70% of the time.
          *   *Resolution:* Making predictions that differ from the base rate (being decisive).
