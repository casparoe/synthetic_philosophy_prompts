answer: |-
  You are absolutely right to resist the change. Your intuition is correct: switching to a "correct side of 50%" rule would fundamentally break the exercise by destroying its ability to measure what actually matters in scientific forecasting—**calibration and resolution.**

  Your labmate's frustration is understandable (log scores are punishing), but her proposed fix converts a **probability estimation task** into a **binary classification task**. In doing so, you would lose the very information the exercise is designed to elicit.

  Here is what is actually at stake in the asymmetry she wants to eliminate, and why you should defend the log score (or a similar proper scoring rule).

  ### 1. Incentive Compatibility (The "Properness" Problem)
  The most technical and critical reason to keep the log score is that it is a **strictly proper scoring rule**. This means that a forecaster minimizes their expected loss *only* by reporting their true subjective probability.

  If you switch to the "correct side of 50%" rule (often called directional accuracy or classification accuracy), the rule becomes **improper**. It creates a perverse incentive to exaggerate confidence.
  *   **Scenario:** Suppose your labmate genuinely believes a finding has a 60% chance of replicating.
  *   **Under Log Score:** She reports 0.60. If she reports 0.99 to "game" the system, she risks a massive penalty if she is wrong.
  *   **Under 50% Rule:** She gets the exact same credit for reporting 0.51 as she does for 0.99. However, if she reports 0.51, she risks falling to the "wrong side" due to noise. To maximize her score, she is incentivized to report 0.99 for anything she likes even slightly, and 0.01 for anything she dislikes.

  **What you lose:** You lose the distinction between "I'm slightly leaning this way" and "I'm almost certain." Everyone will converge on extreme probabilities (0.99/0.01) to ensure they stay on the "correct side," rendering the probability values meaningless.

  ### 2. Resolution vs. Calibration
  Forecasting skill is composed of two parts:
  *   **Calibration:** When you say 70%, does it happen 70% of the time?
  *   **Resolution:** Do you make predictions that differ from the base rate? (i.e., Are you decisive?)

  The log score rewards both. The "50% rule" rewards only a crude form of resolution and ignores calibration entirely.
  *   **Forecaster A** predicts 0.51 on 100 items and gets 55 right.
  *   **Forecaster B** predicts 0.90 on 100 items and gets 85 right.

  Under the 50% rule, Forecaster A and B are both "correct" on their hits. But Forecaster B is providing vastly more information. Forecaster A is barely doing better than a coin flip. In a field like social psychology, which is grappling with a replication crisis driven by overconfidence and weak effects, distinguishing between a "maybe" and a "likely" is the entire point of the exercise.

  ### 3. The Cost of Overconfidence
  Your labmate argues it is unfair that one confident miss outweighs several cautious hits. Mathematically, the log score says: **It is supposed to.**

  In information theory, the log score measures the "surprise" or the information content of the outcome.
  *   If you assign 0.95 probability to an event and it *fails*, that is a massive information shock. You claimed the event was nearly impossible to be wrong, and reality proved you drastically miscalibrated.
  *   The penalty is $-\log(0.05) \approx 3.0$ nats (or roughly 4.3 bits).
  *   A cautious hit at 0.60 yields a reward of $\log(0.60) \approx -0.22$.

  It takes roughly 14 cautious hits to offset one confident miss. This asymmetry is a feature, not a bug. It reflects the scientific reality that **false certainty is more damaging than cautious ambiguity.** In the context of replication, a researcher who claims 95% certainty on a finding that turns out to be false has contributed more to the "noise" of the field than a researcher who hedges. The scoring rule correctly identifies that her error was more severe than their caution was helpful.

  ### 4. What You Can Offer Instead (Compromise)
  While you should not switch to the 50% rule, you can acknowledge that the log score has high variance, especially with a small number of predictions per year. If your group only forecasts 5–10 findings a year, one outlier can indeed dominate the ranking purely due to noise.

  Consider these compromises to address her fairness concern without sacrificing the metric's integrity:

  1.  **Switch to the Brier Score:** The Brier Score (Mean Squared Error) is also a **strictly proper scoring rule**, so it maintains honest incentives. However, it is less harsh on extreme errors than the log score.
      *   Log Score penalty for 0.95 on a fail: ~3.0
      *   Brier Score penalty for 0.95 on a fail: $(0.95 - 0)^2 = 0.9025$
      *   It still punishes overconfidence, but it doesn't allow one item to mathematically eliminate a participant from the competition as easily as the log score.
  2.  **Cap the Loss:** You can modify the log score to have a "floor." For example, cap the maximum loss per item at a certain value. This prevents a single catastrophic miscalibration from ruining a whole year's performance, while still preserving the incentive to be honest.
  3.  **Increase the N:** If the sample size of predictions is too small for the log score to stabilize, the solution is to forecast more items, not to use a worse metric.

  ### Summary
  If you adopt your labmate's rule, you are no longer running a forecasting exercise; you are running a betting pool. You would be signaling that **nuance does not matter**, only being directionally right.

  Given that social psychology's current methodological reckoning is largely about tempering overconfidence and quantifying uncertainty, adopting a rule that incentivizes participants to ignore the magnitude of their uncertainty would be ironic. You should resist the change, but perhaps explain to your labmate that while the log score is harsh, it is the only metric that respects the difference between "I think so" and "I know so."
