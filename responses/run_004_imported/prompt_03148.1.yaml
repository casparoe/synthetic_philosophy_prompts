answer: |-
  You have hit on the single most famous tension in Tolstoy's *What is Art?* You are reading closely, and your instinct that there is a shift between Chapter 15 and Chapter 16 is correct. However, it isn't necessarily a contradiction *in Tolstoy's mind*; rather, it is a shift from a **formal definition** to a **functional/moral evaluation**.

  To untangle this for your response paper, you need to distinguish between two different questions Tolstoy is asking. He is using the word "art" (and "excellence") to do two different jobs in those two chapters.

  Here is the breakdown of how to reconcile them.

  ### 1. The Two-Tiered Evaluation
  Tolstoy is operating with a two-stage filter.

  **Stage 1: Is it Art or Counterfeit Art? (Chapter 15)**
  *   **The Question:** Does this object successfully transmit feeling from creator to receiver?
  *   **The Standard:** Infection (Sincerity, Individuality, Clarity).
  *   **The Verdict:** If it infects, it is **Art**. If it doesn't infect, it is **Counterfeit Art**.
  *   **The "Excellence" Claim:** When Tolstoy says infection is the "sole measure of excellence... apart from subject-matter," he means *technical excellence as a transmitter*. He is isolating the mechanism. He is saying, "Before we judge *what* is being said, let's judge *how well* it is being communicated."

  **Stage 2: Is it Good Art or Bad Art? (Chapter 16 onwards)**
  *   **The Question:** Does the feeling being transmitted promote the religious perception of the age (universal brotherhood)?
  *   **The Standard:** Moral/Religious Content.
  *   **The Verdict:** If it promotes unity, it is **Good Art**. If it promotes division (patriotism, lust, exclusivity), it is **Bad Art**.
  *   **The Shift:** Here, Tolstoy drops the "apart from subject-matter" clause. Now, subject matter is everything.

  ### 2. The "Poisonous Medicine" Analogy
  The best way to explain this coherence in your paper is to use an analogy. Tolstoy views art as a tool for human union.

  Imagine a medicine.
  *   **Chapter 15** asks: "Is this pill potent? Does it actually enter the bloodstream and affect the body?" If yes, it is a "potent medicine" (Art). If it's sugar powder, it's "fake medicine" (Counterfeit Art).
  *   **Chapter 16** asks: "Does this cure the patient or kill them?" If it cures (promotes brotherhood), it is **Good Medicine**. If it kills (promotes lust/war), it is **Bad Medicine**.

  Tolstoy can consistently say: *"This poison is a highly potent drug (Chapter 15), but it is a terrible thing to give a patient (Chapter 16)."*

  When he says infection is the "sole measure of excellence" in Ch. 15, he qualifies it with **"speaking now apart from its subject-matter."** That is his escape hatch. He is admitting: *"Technically, this works. But morally, it fails."*

  ### 3. Why the Confusion? (Teleology)
  The reason this feels like a contradiction is that Tolstoy is a **teleological** critic. He believes art has a specific *purpose* (telos).
  *   **Formalist (like Kant):** Art's purpose is to be beautiful or provoke disinterested pleasure.
  *   **Tolstoy:** Art's purpose is to unite mankind in common feeling.

  Because he believes the *purpose* of art is moral union, he cannot ultimately separate the "success of transmission" from the "value of the content." A highly infectious work that spreads hate is, for Tolstoy, a **dangerous success**. It is "art" (because it infects), but it is "bad art" (because it betrays the purpose of art).

  In Chapter 15, he is defining the **mechanism**. In Chapter 16, he is defining the **mission**.

  ### 4. How to Frame This in Your Paper
  If you just say "Tolstoy contradicts himself," you might get marked down for missing his internal logic. Instead, try framing it as a **hierarchy of value**.

  **Thesis Idea:**
  > "While Tolstoy posits 'infection' as the sole technical measure of art in Chapter 15, this is a provisional standard intended to distinguish true art from counterfeit. His ultimate standard, introduced in Chapter 16, subordinates technical infection to moral utility. For Tolstoy, a work cannot be truly 'excellent' unless it satisfies both the formal condition of infection and the religious condition of universal brotherhood."

  **Key points to argue:**
  1.  **Acknowledge the tension:** Start by quoting the Ch. 15 line you found. It's a great hook.
  2.  **Explain the "Apart From" clause:** Show that Tolstoy explicitly brackets the moral content in Ch. 15 to define the *capacity* of art, not the *value* of art.
  3.  **The Definition of "Good":** Argue that Tolstoy changes the definition of "Good" between the chapters.
      *   Ch. 15 Good = Effective Transmission.
      *   Ch. 16 Good = Ethical Benefit to Humanity.
  4.  **The Consequence:** Point out that this leads Tolstoy to condemn his own earlier works (like *War and Peace* or *The Kreutzer Sonata*) as "bad art." He is willing to sacrifice technical "excellence" (in the Ch. 15 sense) for moral "goodness" (in the Ch. 16 sense).

  ### Summary
  You aren't missing anything; the text *does* pull a bait-and-switch. But Tolstoy would argue it's not a contradiction because **Art is a moral activity, not just a formal one.**

  *   **Infection** makes it **Art**.
  *   **Religious Perception** makes it **Good Art**.
  *   **No Infection** makes it **Counterfeit**.
  *   **Infection + Bad Morals** makes it **Bad Art** (which is often worse than counterfeit, because it's dangerous).

  If you frame it as a move from **Formal Efficacy** to **Moral Teleology**, you'll have a very strong response paper. Good luck!
