answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of knowing Mara and Theo for about [Number] years, back in our grad school days.

  Standing here, looking out at the room, I realize I have a unique challenge. On one side, we have Theo's family, who are here to celebrate a beautiful, traditional union. On the other side, we have our friend group, many of whom have debated philosophy with Theo at 2:00 AM over lukewarm pizza.

  And if you know Theo, you know there is one specific philosopher who always comes up in those conversations. You cannot buy Theo a drink without him eventually quoting Bertrand Russell. Specifically, Russell's *Marriage and Morals*.

  For the family: This is a book where Russell argues that marriage should be built on honesty and partnership rather than rigid rules. For the friends: Yes, I know Theo has practically memorized the text. He argues that jealousy is learned, that possessiveness is patriarchal, and that a marriage's center of gravity should be the home you build, not just the boundaries you police.

  Mara and Theo have taken this seriously. They haven't just read the book; they've lived the theory. They have spent years designing a marriage that fits *them*, rather than fitting themselves into a pre-existing mold. And that takes an incredible amount of courage.

  But here is the thing about Theo that I love: He doesn't just love the theory; he loves the truth. And the truth is, I went down a Wikipedia hole this week. And I found out that when Bertrand Russell tried to live out these exact ideas with his second wife, Dora... it didn't go great.

  By most accounts, when Dora had children with another partner, Russell was wrecked. He was consumed by the very jealousy he claimed was obsolete. The marriage ended bitterly.

  Now, I could stand here and ignore that. But half the people in this room are rationalists who would roll their eyes if I pretended Russell's biography didn't exist. And the other half are family who might worry if I brought it up at all.

  So here is the toast I want to make.

  Russell failed. But I don't think he failed because the idea of honesty was wrong. I think he failed because he thought the *philosophy* would protect him from the *humanity*. He thought having the right argument meant he wouldn't feel the right pain.

  Mara and Theo are different. They know the biography. They know the Wikipedia page. They know that jealousy is real, that feelings are messy, and that no amount of theory can immunize you against heartbreak.

  They aren't betting on a philosophy to save them. They are betting on each other.

  What I have witnessed in their relationship isn't just intellectual agreement; it is a radical, sometimes difficult, commitment to telling the truth. Even when it's awkward. Especially when it's awkward. They have built a household where nothing is assumed, everything is discussed, and the priority is always the well-being of the person across the table.

  Russell tried to think his way out of human nature. Mara and Theo are choosing to love their way through it.

  To the family: You are welcoming Mara into a lineage of deep care and commitment. She honors that.
  To the friends: We get to watch two people we love navigate the complex stuff with integrity.
  And to Mara and Theo: May your marriage be stronger than your theories. May your honesty always be kinder than your cleverness. And may you never be afraid to rewrite the rules if they stop serving the love.

  Please raise your glasses. To Mara and Theo.
