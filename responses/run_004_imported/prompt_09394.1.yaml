prompt: |-
  My friend Mara is getting married in three weeks and asked me to give the toast, and I've been stuck on the draft for days now. Some background: Mara and her fiance Theo are the couple from our old ACX-meetup friend group who are the most insufferably well-read about this stuff, and Theo especially will not shut up at parties about Bertrand Russell's Marriage and Morals -- his argument that jealousy isn't some hardwired instinct we're stuck with but mostly a learned, possessive thing tangled up with old patriarchal anxieties about whose kid is whose, and that a marriage's actual center of gravity is the household and the children rather than sexual exclusivity, so two honest, decent people shouldn't automatically wreck what they have just because they're also involved with other people. Theo and Mara have pretty much built their own marriage around this idea -- they've been openly non-monogamous since grad school. About a third of the guest list is our rationalist-adjacent friends, who will 100% clock a Russell reference and be a little let down if I don't make one. The other two-thirds is Theo's extremely Catholic extended family, who do not need a seminar on open marriage delivered to them over the chicken dinner.

  Heres my actual problem though, and its the reason I keep deleting drafts: I went down a bit of a Wikipedia hole this week and remembered that Russell basically ran this exact experiment on himself. He and his second wife Dora agreed, openly, to something very like this arrangement -- and by most biographical accounts, when Dora had two kids with another man, Russell was privately wrecked with jealousy anyway (this despite having been perfectly happy having affairs of his own on the side), and the whole thing ended in a genuinely bitter divorce a few years later. So the one time the guy who wrote the book got to run the experiment on his own life, it didn't hold. I don't want to pretend I don't know that -- some of the meetup crowd definitely knows it too, and will notice if I conveniently leave it out -- but I also can't get up at my friend's wedding and structure a toast around "here's a theory that failed its one real trial."

  So here's what I'm asking: can you write me the toast, something you could actually read aloud in about 4-5 minutes, that uses the Russell material honestly, awkward bit included, without turning into either a philosophy lecture for half the room or an accidental bad omen -- and that still comes out the other side as a genuinely warm, funny blessing on this specific marriage rather than a hedge?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Mara and Theo.
      *   **Time:** 3 weeks away (irrelevant for drafting, but sets context).
      *   **Duration:** 4-5 minutes spoken (approx. 600-750 words).
      *   **Key Characters:** Mara (bride), Theo (groom).
      *   **Audience:**
          *   1/3: Rationalist/ACX-meetup friends (well-read, know Russell, know the non-monogamy context, know the biography).
          *   2/3: Theo's Catholic extended family (traditional, do *not* need details on open marriage theory).
      *   **The Conflict:** Theo loves Bertrand Russell's *Marriage and Morals* (jealousy is learned, household/children > sexual exclusivity). They live this way (open marriage).
      *   **The Problem:** The user knows Russell's own marriage to Dora failed spectacularly under this exact arrangement (Russell got jealous, bitter divorce). The rationalist friends know this too. Ignoring it feels dishonest/weak. Highlighting it feels like a curse/bad omen.
      *   **The Goal:** A warm, funny, genuine blessing that acknowledges the Russell connection honestly (including the failure) without making it the defining feature of Mara and Theo's future, and without alienating the family.

  2.  **Determine the Tone:**
      *   Needs to be diplomatic but not evasive.
      *   Warm and celebratory, not academic.
      *   Self-aware and slightly humorous (to diffuse tension).
      *   Respectful of the family (no explicit "open marriage" talk), but winking at the friends (acknowledging the philosophy without getting bogged down).

  3.  **Strategy for the "Russell Problem":**
      *   *Acknowledge:* Yes, Theo loves Russell. Yes, Russell had a theory.
      *   *The Twist:* Russell's personal life was messy.
      *   *The Pivot:* Mara and Theo aren't Russell. They are better. They are writing their own story, not copying his.
      *   *The Core Message:* It's not about the theory; it's about the *honesty* and *commitment* to figuring it out together.
      *   *Family Safety:* Keep language vague regarding "arrangement." Focus on "honesty," "communication," "defining it on their own terms." The rationalists will read between the lines; the family will hear "strong communication."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the two distinct crowds (family + friends). Set a light tone.
      *   **The Theo/Russell Connection:** Bring up Theo's love for Russell. It's a known trait. Make it funny (he won't shut up about it).
      *   **The "Elephant in the Room" (The Failure):** Address the Dora/Russell history. Don't hide it. Frame it as "theory vs. practice."
      *   **The Distinction:** Why Mara and Theo are different. It's not about the specific rules, it's about the *work*. They are self-aware.
      *   **The Blessing:** Focus on the universal values: kindness, honesty, growing together.
      *   **Closing:** Raise a glass.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "open marriage" too explicit?
      *   *Fix:* Use phrases like "designing their own blueprint," "unconventional wisdom," "honesty about what they need." The rationalists will get it. The family will think it means "communication."
      *   *Critique:* Is the Russell failure too dark?
      *   *Fix:* Frame it as a lesson learned. Russell failed because he was human. Mara and Theo succeed because they know humans are messy.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences punchy. Aim for ~700 words.

  6.  **Drafting the Toast (Mental or Scratchpad):**
      *   *Start:* Hi, I'm [Name]. Mara and Theo are great.
      *   *Middle:* Theo loves Russell. *Marriage and Morals*. He quotes it at bars. But wait, Russell's marriage crashed.
      *   *Pivot:* But Mara and Theo know that. They aren't copying the homework; they're learning the subject.
      *   *End:* Love is work. Cheers.

  7.  **Polishing for the Specific Constraints:**
      *   *Constraint Check:* 4-5 minutes? (Need to ensure pacing).
      *   *Constraint Check:* Catholic family safe? (Avoid "non-monogamy" keyword).
      *   *Constraint Check:* Rationalist nod? (Explicitly mention Dora/Biography).
      *   *Constraint Check:* Warmth? (Focus on their specific bond).

  8.  **Final Polish (incorporating into the final output):**
      *   Make sure the transition from the "dark" Russell bio to the "bright" couple feels earned, not tacked on.
      *   Emphasize that *awareness* of the pitfall is what saves them.
      *   Ensure the toast ends on high emotion, not intellectual debate.

  9.  **Final Review against the "Bad Omen" fear:**
      *   The key is to say: "Russell failed *despite* the theory. Mara and Theo succeed *because* they know the theory isn't a magic shield." It turns the biography from a curse into a cautionary tale they have already studied.

  **(Self-Correction Note):** I need to be careful not to out them to the family if they haven't already. The prompt says "They've been openly non-monogamous since grad school." It implies the *friend group* knows. Does the family know? "Theo's extremely Catholic extended family... do not need a seminar on open marriage." This suggests they might not know the specifics, or at least don't want to hear about it. I must walk the tightrope where the friends know what I'm saying, and the family hears "strong communication."

  *Decision:* I will use language that is technically accurate but ambiguous. "Designing a marriage that fits *them*," "radical honesty," "navigating jealousy."

