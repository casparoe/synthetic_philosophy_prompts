  6.  **Final Polish:** Check against Chang's specific terminology (parity, normative power, will). Ensure the distinction between "incommensurable" (no common measure) and "incomparable" (cannot be compared at all) is clear, as this is often a confusion point. (Actually, Chang argues they are comparable via "parity," not just "better/worse/equal").

