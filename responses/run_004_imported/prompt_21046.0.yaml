      *   *Key Distinction:* Incommensurability $\neq$ Incomparability. Just because I can't say A > B mathematically doesn't mean I can't say A is better *for me* based on who I want to be.
      *   *Chang's Actual Point:* Hard choices are opportunities to exercise normative power. You *make* the reason. If you choose Vienna, you commit to the career, and that commitment generates reasons to stay the course.
      *   *The Coin Flip:* A coin flip treats the options as interchangeable. They aren't. They lead to different lives. The "arbitrariness" fear comes from thinking there's a "God's eye view" answer. There isn't. That's liberating, not terrifying.
      *   *Therapist:* The therapist is right but maybe vague. "Sitting with reasons" is about testing your commitment, not calculating utility.
