      *   **The Counter:** Van Inwagen explicitly rejects this for composition. He argues that if composition is vague, *existence* is vague. If "life" is the criterion for composition, and "life" is semantically vague, then *composition* is semantically vague. But if composition is semantically vague, does that save existence?
      *   **Deep Dive:** Van Inwagen distinguishes between vagueness in *representation* and vagueness in *the world*. He thinks existence cannot be vague in the world. If "life" is vague in the world (biological processes don't have sharp cutoffs), then existence is vague in the world. If "life" is only vague in language, then there *is* a sharp cutoff in reality that we don't know. But biology suggests there *isn't* a sharp cutoff in reality (metabolic processes fade). Thus, the semantic escape fails because the underlying phenomenon is ontologically gradual.

