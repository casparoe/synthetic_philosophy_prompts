      *   **The Problem:** The user suspects van Inwagen's solution is "suspiciously convenient." "Life" seems just as vague as "fastening" (slime molds, dying, etc.).
      *   **The Task:** Argue *forcefully* that van Inwagen's vagueness argument against common-sense answers applies equally to his own organicist answer. Also, address the "escape route" (that vagueness in "life" is semantic/conceptual, not ontological) and take it seriously (likely to show why it fails or creates new problems).
