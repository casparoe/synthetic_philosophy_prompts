      *   **The Vagueness Argument:** If the answer is something like "contact" or "fastening," there will be borderline cases (e.g., two objects slightly touching). If composition is vague, then *existence* is vague (i.e., it's indeterminate whether an object exists). Van Inwagen claims vague existence is impossible (logic of identity/number requires precision). Therefore, the SCQ answer cannot be vague.
      *   **The Organicist Answer:** Composition occurs iff the activities of the xs constitute a *life*.
