  I'm taking a seminar on vagueness this term, and we've just covered epistemicism and supervaluationism as rival responses to the sorites paradox. Write a short dialogue between an epistemicist and a supervaluationist debating whether supervaluationism genuinely avoids commitment to a sharp cutoff in the heap series, or merely relocates the problem into higher-order vagueness about the "definitely" operator. Each side should respond directly to the other's actual objections rather than simply restating their own position, and neither should be given the last word by default.
