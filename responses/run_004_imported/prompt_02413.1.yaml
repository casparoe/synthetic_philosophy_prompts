prompt: |-
  Kind of a weird one, but it's been stuck in my head for weeks. I recently moved onto the interpretability team at work (I'm an ML engineer, not a philosopher, full disclosure), and I've been chewing through papers on sparse autoencoders and dictionary learning — the whole pitch that "features," not individual neurons, are the real fundamental unit of a network, plus circuits, superposition, polysemantic neurons, all of it. We had a reading group on the Anthropic monosemanticity papers last week and it turned into a genuine argument: half the room talks about features and circuits like they're just discovering real structure that was sitting there in the weights all along, and the other half thinks we're basically pattern-matching human concepts onto a giant pile of floats because its useful to us, not because the network actually "has" those concepts in any real sense.

  This gave me a weird flashback to a cognitive science elective I took as an undergrad, where we covered the old connectionism wars from the 80s and 90s — Fodor and Pylyshyn arguing connectionist networks can't really have representations in the interesting sense because they lack the systematicity that real thought has, and later stuff like Ramsey's argument that alot of what cognitive scientists happily call "representations" in these networks don't actually earn the name once you look closely. It feels like my coworkers are just refighting that exact war with new vocabulary, but I genuinely can't tell if that's a real connection or if I'm just forcing an analogy because it's the one philosophy class I remember anything from.

  Could you compare these two debates properly for me: (1) the current "realism about interpretability" fight over whether things like features and circuits in trained neural nets are real, discoverable structure vs. useful fictions researchers impose after the fact, and (2) the older philosophy-of-mind fight over whether connectionist networks have genuine representations at all (systematicity challenges, eliminativism about connectionist representations, etc.). Is round two basically the same argument in a new outfit, or is there something actually new this time — new tools like activation patching and causal interventions, or just sheer scale — that changes who's got the stronger position? And if you had to bet, which side do you think has the stronger case, both back then and now?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

