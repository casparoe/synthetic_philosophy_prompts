answer: |-
  Here are ten hiring-committee questions designed to probe the robustness of the candidate's position, each with a follow-up tailored to anticipate and push past her appeal to non-separability.

  **1. The Action-Guidance Objection**
  **Question:** If rationality is supposed to be action-guiding, what instruction does your theory give the agent at the exact moment she is in town, facing the driver? If the theory says "pay," it contradicts your claim that the act is irrational *ex post*; if it says "don't pay," it seems to undermine the plan. How does a non-separable theory guide action at the node?
  **Follow-up:** *If she replies that the guidance was exhausted at the planning stage:* "Granting that, doesn't this render rationality inert at the moment of choice? If an agent finds herself unable to cultivate the disposition beforehand, does your theory offer her any normative resources at the moment of payment, or does it simply declare her lost?"

  **2. Normative Residue and Regret**
  **Question:** In standard cases of irrational action, we expect the agent to feel rational regret upon reflection. In the Hitchhiker case, on your view, the agent pays (an irrational act) to satisfy a rational plan. Should the agent feel regret after paying?
  **Follow-up:** *If she says no regret is appropriate:* "If no regret is appropriate, in what substantive sense is the act 'irrational'? It seems you are retaining the label of irrationality while stripping it of its standard phenomenological and normative consequences."

  **3. Comparison with Gauthier and McClennen (Required)**
  **Question:** Both Gauthier's constrained maximization and McClennen's resolute choice allow agents to secure the benefits of the Hitchhiker case without ever labeling the momentary act of paying as "irrational." They argue the act is rational *because* it fulfills the plan. What theoretical work is being done by your insistence on calling the act itself irrational that their frameworks do not achieve?
  **Follow-up:** *If she argues her view is more honest about the cost:* "But if Gauthier and McClennen can secure the same payoff without fracturing the unity of rationality, isn't your view theoretically more costly for no gain in predictive or normative power? What phenomenon can you explain that resolute choice cannot?"

  **4. Imperfect Prediction (Required)**
  **Question:** Parfit's case relies on the driver's prediction being nearly perfect. Suppose the driver is only 60% reliable. Does the rationality of the disposition change, and if so, does the irrationality of the *act* of paying diminish proportionally?
  **Follow-up:** *If she insists the act remains irrational regardless of probability:* "Then we have a scenario where the agent rationally disposes herself to perform an act that is increasingly disconnected from the expected utility of the plan. At what threshold of predictive reliability does the disposition itself become irrational, if the act never changes its status?"

  **5. The Meaning of "Irrational"**
  **Question:** You distinguish between the rationality of the disposition and the irrationality of the act. Is this a distinction in the *kind* of rationality (e.g., procedural vs. substantive), or are you suggesting a single standard of rationality that yields contradictory verdicts?
  **Follow-up:** *If she suggests a single standard yields contradictory verdicts:* "If a single standard tells me 'X is rational' at t1 and 'X is irrational' at t2, given the same information, haven't we simply redefined rationality to mean 'outcome-conducive' rather than 'reason-responsive'?"

  **6. Dynamic Consistency**
  **Question:** A standard requirement for rational agency is dynamic consistency: if you prefer plan A over plan B at t1, you should not prefer B over A at t2. Your view seems to embrace dynamic inconsistency as a feature. Is this inconsistency stable over repeated interactions?
  **Follow-up:** *If she argues stability isn't required:* "If an agent knows she will view her future acts as irrational, won't she anticipate this and refuse to form the disposition in the first place? How do you prevent the view from collapsing into sophisticated choice, where the agent simply refuses to board the car?"

  **7. Transparency and Self-Knowledge**
  **Question:** For the driver to predict you will pay, you must be transparent to him. But if you know you are disposed to perform an irrational act, does that knowledge undermine the disposition? Can one rationally intend to do what one knows one has reason not to do?
  **Follow-up:** *If she denies the knowledge undermines the disposition:* "Then the agent must, in some sense, hide the truth from herself. Does your theory of rationality therefore require a theory of rational self-deception to function?"

  **8. Welfare vs. Rationality**
  **Question:** In the Hitchhiker case, paying maximizes the agent's welfare (survival) relative to the alternative (death), yet you call the act irrational. Does your view imply that rationality and self-interest can fundamentally diverge in this way?
  **Follow-up:** *If she accepts the divergence:* "If rationality systematically requires us to label welfare-maximizing acts as irrational in these structural cases, why should we care about rationality? What is the normative force of a standard that opposes the agent's own good?"

  **9. The "Toxin Puzzle" Extension**
  **Question:** Consider Kavka's Toxin Puzzle, where you are rewarded for *intending* to drink, but not for drinking. Your view handles Hitchhiker by validating the disposition. Does your view imply it is rational to form the intention to drink the toxin, even though carrying it out is irrational?
  **Follow-up:** *If she says yes:* "But in Toxin, carrying out the intention gains you nothing extra, whereas in Hitchhiker, paying completes the transaction. If you treat them alike, do you not risk validating empty rituals where the act serves no causal role in securing the benefit?"

  **10. Falsifiability and Counterexamples (Required)**
  **Question:** To close, I'd like to ask about the limits of your theory. By your own lights, what would count as a genuine counterexample? Describe a case with the structure of Hitchhiker where you would concede it is *not* rational to form the disposition.
  **Follow-up:** *If she struggles to name a case:* "If there is no structural variation of the case where the disposition becomes irrational, is your thesis unfalsifiable? If the only way to refute the view is to deny the initial intuition that the act is irrational, aren't you simply stipulating definitions rather than arguing for a substantive claim?"
