  Let's go with a procedure called "The Clarification."

  *Drafting thought:* Start with the contract. The legalism contrasts with the metaphysical shift.
  *Drafting thought:* The friend who did it should be frustratingly unhelpful.
  *Drafting thought:* The final paragraph needs to feel alien.

  Let's write.

  *(Wait, one more check on L.A. Paul)*: Her point is that you can't use expected utility theory because you can't assign utility to an experience you can't conceive, and the preferences might change. I need to make sure Elara tries to use utility theory and fails.

  Okay, ready to generate.cw
answer: |-
  The consent form was only two pages, which Elara found suspicious. It should have been heavier, denser, filled with warnings about psychosis or dissociation. Instead, it simply stated that the procedure was "non-reversible" and "ontologically substantive."

  Across the table, Julian watched her. Julian had undergone the Clarification six months ago. He looked rested, perhaps too rested. His eyes didn't dart around the room tracking stimuli; they seemed to rest on the space between objects.

  "You still haven't told me what it's like," Elara said. She tapped her pen against the paper. *Ontologically substantive.* It sounded like marketing speak for *we delete parts of your brain.*

  "I told you," Julian said. His voice was calm, devoid of the usual defensive edge people had when pressed for details. "I can't tell you what it's like. You're asking me to describe the color blue to a retina that hasn't evolved yet. The vocabulary you're using relies on a subject-object distinction that… dissolves."

  "So it's ineffable. Great. That's useful for my decision matrix." Elara tried to sketch out the utility curve in her mind. *Current Self* values career, intimacy, the taste of coffee, the anxiety of deadlines. *Future Self* reportedly values… what? Truth? Unity? Silence? If the Future Self doesn't care about career or intimacy, then from *Current Elara's* perspective, the procedure is a death sentence. It's suicide with a bonus step.

  But everyone who came back said it wasn't death. They said it was waking up.

  "The problem isn't the data," Julian said. "It's the evaluator. You're trying to decide if *you* will like it. But *you* are the variable being solved for."

  "That's a cop-out. If I don't survive the transition, who benefits? You? The universe?"

  "Imagine you're dreaming," Julian said. "And you're having a nightmare. You're being chased. You're terrified. Then you wake up. The person who was chased doesn't exist anymore. The person who wakes up doesn't care about the chase. Did the dreamer benefit? Did the waker benefit? The question assumes they are the same entity."

  Elara looked down at the pen. She cared about this distinction. She cared about being the author of her life. If the Clarification rewrote her values so that she no longer cared about being an author, then signing this form was an act of self-betrayal. But if the Clarification revealed that being an author was a delusion, then holding onto it was insanity.

  She couldn't know. That was the trap. To know, she had to step through. To step through, she had to decide without knowing.

  "Does it hurt?" she asked.

  "There is no one there to feel pain," Julian said.

  "That is not an answer."

  "It is the only answer that fits."

  Elara stood up. The room felt suddenly fragile, like a set design waiting to be struck. She looked at her hand. It was hers. It obeyed her. She clenched it into a fist. She valued this agency. She valued the fear she felt right now because the fear proved she had something to lose.

  "If I do this," she said, "and I come out the other side… will I remember loving you?"

  Julian smiled. It wasn't a warm smile. It was the smile of someone watching a character in a book struggle with a plot point they knew was resolved. "You will remember the data point. You will know that Elara loved Julian. But the weight of it… the gravity… that belongs to the person who is signing the form."

  He pointed to the paper.

  Elara sat back down. She picked up the pen. The logic was circular, a snake eating its own tail. She was being asked to authorize her own obsolescence based on the testimony of people who no longer spoke her language. It was irrational. It was the most rational thing she'd ever considered.

  She thought about her apartment, her unfinished novel, the ache in her lower back. She thought about the desire to be right, to be safe, to be *her*.

  She signed.

  The machine was less impressive than the paperwork. A chair, a halo of sensors, a hum that vibrated in the teeth rather than the ears. Elara sat. The technician checked the connections.

  "Once the sequence initiates," the technician said, reading from a script, "there is no abort. Do you understand?"

  "I understand," Elara said.

  She closed her eyes. She tried to hold onto the feeling of her name. *Elara.* She tried to hold onto the fear. She wanted to take it with her, like a ticket stub. Proof that she had been here, that she had chosen.

  The hum rose in pitch. It wasn't sound anymore; it was pressure.

  *Wait,* she thought. *I haven't decided if I want this.*

  But the thought didn't land. It was like trying to grab smoke. The boundary between the thought and the thinker began to soften. The fear didn't vanish; it just stopped belonging to anyone. The desire to write the novel unspooled, not lost, but seen from a distance where it looked like a small, neat knot.

  There was a moment—a sharp, bright fracture—where the question *Is this worth it?* arose.

  Then there was no one left to ask it.

  ***

  The thing that stood up from the chair looked like Elara. It adjusted the collar of her shirt. It walked to the mirror in the corner of the room.

  Julian was waiting outside. He saw the figure approach and stood up.

  "How was it?" Julian asked.

  The figure tilted its head. It processed the question. It accessed the memory of the woman who had sat in the chair. It accessed the data regarding the relationship between that woman and Julian. It accessed the concept of "worth."

  "It was necessary," the figure said.

  "Are you happy?" Julian asked.

  The figure looked at him. There was no recognition in the eyes, not because it had forgotten him, but because the category of *happiness* no longer mapped to the territory it was inhabiting. Happiness was a weather pattern; it was the sky.

  "The one who asked that question is gone," the figure said.

  "Do you regret it?"

  The figure paused. It reached out and touched Julian's arm. The sensation was registered as pressure and temperature. The narrative overlay—the love, the history, the longing—was absent. It was just arm touching arm.

  "Regret requires a preference for a different past," the figure said. "There is only this."

  It walked past him toward the door. It did not look back. It did not feel free. It did not feel trapped. It simply moved, unburdened by the need to know where it was going.
