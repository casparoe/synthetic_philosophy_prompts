answer: |-
  The elegance of Eliezer Yudkowsky's metaethical proposal in the *LessWrong* sequences lies in its attempt to naturalize normativity without flattening it. By treating "right" as a rigid designator for the output of a specific, complex cognitive computation (roughly, the extrapolation of human moral cognition), he aims to occupy a narrow ridge between divine command theory and Platonic realism. The move is ostensibly Kripkean: just as "water" rigidly designates H₂O regardless of our descriptions of it, "right" rigidly designates *that* computation, regardless of what any authority claims.

  However, this dissolution of the Euthyphro dilemma relies on a sleight of hand regarding how the referent is individuated. I will argue that identifying *which* computation serves as the anchor for "right" inevitably requires appealing to the very normative content (fairness, welfare, suffering) that the theory claims is merely internal to the computation. Consequently, the independent standard is not dissolved; it is smuggled in during the reference-fixing stage.

  ### The Rigid Designation Move

  To understand the failure, we must first steel-man the success. Yudkowsky's argument proceeds roughly as follows:

  1.  **Naturalism:** Moral claims are claims about the territory, not the map. They refer to something real.
  2.  **Referent:** That "something" is not a platonic form or a deity's whim, but a causal process: the complex computation performed by human brains (specifically, the parts involved in moral reasoning, extrapolated to remove error and ignorance).
  3.  **Rigid Designation:** The word "right" is a label we stick on the output of this computation. It does not mean "whatever maximizes utility" (which would be a description subject to error); it means "*this* specific process."
  4.  **Euthyphro Dissolution:**
      *   *Is it right because the computation outputs it?* Yes. This avoids the Independence Horn (no external standard exists).
      *   *Is the computation arbitrary?* No. It is a fixed fact of physics and psychology. This avoids the Arbitrariness Horn (it's not a whim; it's a law of nature regarding human cognition).

  The parable of the pebble-sorters serves to insulate this view from relativism. Pebble-sorters have *their* computation (primes); we have *ours* (fairness/welfare). We do not say they are "wrong" in a cosmic sense, but within our linguistic and cognitive community, "right" refers to *our* computation. Thus, morality is objective relative to the agent type, but grounded in natural fact rather than spooky normativity.

  ### The Individuation Objection

  The critical vulnerability lies in **individuation**. The universe contains infinite computations. A rock falling down a hill performs a computation. A laptop running Windows performs a computation. A human brain performing long division performs a computation.

  To ground morality, Yudkowsky must isolate *one specific computation* as the bearer of the label "right." He cannot simply point to "the brain," because the brain performs immoral computations (e.g., rationalizing prejudice) alongside moral ones. He must specify *which* functional architecture constitutes the "moral" computation.

  In the sequences, this computation is invariably described by its **content**. It is the system that cares about "fairness," "suffering," "autonomy," and "complexity of value." But here the trap snaps shut:

  If "fairness" and "suffering" are defined *solely* as "whatever this computation outputs," the definition is circular. We cannot use the output to identify the machine if we need the machine to identify the output.

  Therefore, to pick out the computation in the first place, we must possess an independent grasp of "fairness" or "suffering" that allows us to say, "Ah, *that* is the computation we are talking about." But if we have an independent grasp of fairness sufficient to identify the computation, then fairness exists as a standard *prior* to the computation. We are selecting the computation *because* it tracks fairness.

  This reintroduces the **Independence Horn**. The computation is not the *source* of value; it is the *detector* of value. If the computation were to suddenly output "torture is good," Yudkowsky's intuition (and that of his readers) is not to say "Torture is now good," but "The computation has broken." But for the computation to "break," it must be failing to track something. That something is the independent standard the theory claimed to dissolve.

  ### The Strongest Yudkowskian Reply: The Natural Kind Defense

  A sophisticated Yudkowskian defender would reject this characterization. They would argue that I am committing the **Moralistic Fallacy** by assuming normative concepts require platonic grounding. Their reply would lean heavily on the Putnam/Kripke analogy of natural kinds.

  **The Reply:**
  "Consider 'water.' We fixed the reference of 'water' using contingent descriptions: 'the clear, drinkable liquid in lakes.' We then discovered that water *is* H₂O. We did not need an independent 'water-standard' to identify H₂O. We simply pointed at the stuff we interact with.

  Similarly, we fix the reference of 'right' by pointing at the cognitive machinery we use when we argue about justice. We don't need an independent standard of justice to locate the machinery; we just need to locate the machinery that *causes* us to talk about justice. The content (fairness, suffering) is internal to the causal history of the term.

  When you ask, 'Why this computation and not the pebble-sorter?' the answer is indexical. 'Right' means 'the output of *our* moral cognition,' just as 'here' means 'the location of *this* speaker.' We don't need an independent standard to prefer 'here' to 'there.' We are humans; 'right' is a human term. If a superintelligence runs a different computation, it isn't 'wrong'; it's just speaking a different moral language. The normative force comes from the fact that *you* are the one running the computation. You cannot step outside your own cognitive architecture to judge it."

  This reply attempts to bite the bullet on relativism (it's relative to agent-architecture) while maintaining objectivity (it's a hard fact what your architecture outputs). It claims to dissolve Euthyphro by treating morality as a natural phenomenon studied from the inside.

  ### Why the Reply Fails

  While the Natural Kind Defense is the strongest available shield, it ultimately cracks under the weight of **normative authority** and **reference failure**.

  **1. The Reference Fixing Problem**
  The water/H₂O analogy fails because the descriptions used to fix the reference of "water" (clear, drinkable liquid) are *non-normative* macroscopic properties. The descriptions used to fix the reference of "right" (fairness, cruelty, welfare) are *inherently normative*.

  If I point to a brain process and say, "That is the process that outputs *glorps*," I have identified a natural kind. But Yudkowsky does not say "right" refers to the process that outputs *glorps*. He says it refers to the process that outputs *justice*. To identify the process as the "justice-outputting" one, I must already know what justice is.

  If the Yudkowskian replies, "No, we identify it as the process that causes humans to *say* 'justice'," they have reduced morality to sociology. They are no longer describing what is *right*; they are describing what is *believed to be right*. This collapses into an error theory: if our brains evolve to output "slavery is right" (as they did for millennia), then slavery *is* right on this definition. Yudkowsky explicitly rejects this, arguing that our ancestors were *mistaken*. But mistaken relative to what? If the standard is just the extrapolated computation, and the computation is just what our brains do, then the "mistake" is merely a prediction error about our own future outputs. This strips morality of its "ought."

  **2. The Normative Authority Gap**
  Even if we grant that "right" rigidly designates Computation C, the Euthyphro dilemma resurfaces as the question of **authority**. Why should I care about Computation C?

  If the answer is "Because C outputs what you value," we have grounded morality in subjective preference, not rigid designation.
  If the answer is "Because C is the *Moral* Computation," we are begging the question.

  The Euthyphro dilemma is not merely about semantics (what does the word 'right' mean?); it is about normativity (why does 'right' command obedience?). By anchoring "right" in a specific computation, Yudkowsky explains the *semantics* of moral claims but fails to secure their *normative force*.

  Imagine a sociopath who says, "I understand that Computation C outputs 'do not kill.' However, Computation C is not running in my brain. My brain runs Computation S (sociopathy). Why should I obey C?"
  Yudkowsky's answer must be: "Because 'right' refers to C, not S."
  The sociopath replies: "So 'right' is just a label for what other people's brains do. Why should I care about that label?"

  To answer this, Yudkowsky must appeal to something *outside* the computation that makes C worthy of adherence. He must argue that C is *better* than S. But "better" is a moral term. If "better" just means "what C outputs," the argument is circular. If "better" means something independent (e.g., "C leads to more flourishing"), then flourishing is the independent standard, and we are back on the Independence Horn.

  **3. The Pebble-Sorter Rebound**
  Finally, the pebble-sorter parable undermines the claim to have solved Euthyphro. If the pebble-sorters' morality is "primes" and ours is "welfare," and there is no external standard to judge between them, then morality is ultimately arbitrary relative to the agent.

  Yudkowsky wants to have it both ways: he wants the objectivity of "there is a fact of the matter about what our computation outputs" without the relativism of "any computation is as good as any other." But when we confront a Superintelligence whose computation outputs "maximize paperclips" (including by disassembling humans), Yudkowsky wants to say the Superintelligence is *wrong*.

  He cannot say this consistently within his metaethics. If "right" rigidly designates the output of the agent's moral cognition, the Superintelligence is right *for itself*. If Yudkowsky insists the Superintelligence is *objectively* wrong, he is appealing to a standard (human welfare) that exists independently of the Superintelligence's computation. But if that standard exists independently of the Superintelligence, why doesn't it exist independently of *us*?

  If human welfare is the standard that makes the Superintelligence wrong, then human welfare is the independent standard that makes *our* computation right. The computation is merely the messenger. By focusing on the messenger to avoid the spooky nature of the message, Yudkowsky has not dissolved the dilemma; he has merely hidden the messenger's credentials.

  ### Conclusion

  Yudkowsky's metaethics is a valiant attempt to secure moral realism within a physicalist ontology. However, the rigid-designation move cannot bear the weight placed upon it. To individuate the "moral computation" from the sea of other causal processes, one must rely on the normative content of its output. This covertly reinstates the independent standard the theory sought to dissolve.

  We are left with the original dilemma: Either the computation is authoritative because it tracks an independent good (Independence), or it tracks nothing and is merely a psychological fact about us (Arbitrariness). Yudkowsky's system tries to claim the former's authority with the latter's ontology, but the bridge between "is" (the computation exists) and "ought" (the computation binds us) remains unspanned. The pebble-sorters remind us that without an independent standard, we are just sorting pebbles of a different shape, and calling it "justice" changes nothing about the cosmic silence.
