      *   Engage strongest arguments? Yes (Trembling hand vs. Epistemic update).
      *   Address meaning of Common Knowledge? Yes.
      *   No easy winner? Yes.

  *(Self-Correction Note)*: I need to be careful with Aumann's 1995 specific result. It relies on a specific definition of rationality (maximizing expected utility given beliefs) and common knowledge thereof. The critique is often that the counterfactual reasoning required for BI is inconsistent with the knowledge state at the off-equilibrium node. I need to make sure Elena defends the *consistency* of the counterfactual, while Marcus attacks it.

  Let's write.

  *   *Setting:* A quiet corner of the faculty lounge after a seminar.
  *   *Characters:* Elena (Formalist), Marcus (Epistemic/Revisionist).
  *   *Game:* 3-node Centipede.

