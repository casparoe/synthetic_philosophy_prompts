answer: |-
  It is a pleasure to meet a colleague who understands that the difference between a reagent that works and a reagent that *should* work is the difference between a successful Tuesday and an exploded fume hood. You are absolutely right to be suspicious of your library group's tendency to lump Peirce and James together. While they shared a table at the Metaphysical Club in Cambridge in the 1870s, their philosophical DNA diverged sharply.

  Peirce was a logician and a metrologist at heart; James was a psychologist and a moralist. When Peirce renamed his doctrine "pragmaticism," calling it "ugly enough to be safe from kidnappers," he wasn't just being petulant. He was trying to inoculate his theory against James's infection of subjectivism.

  Here is the mechanical breakdown of the split, followed by the verdict you asked for.

  ### The Mechanics of Truth: Asymptote vs. Currency

  To a chemist, the difference is best understood as the difference between **calibration** and **utility**.

  **1. Peirce: Truth as Convergence (The Asymptote)**
  For Peirce, truth is a property of the *object*, not the believer. He is a Scholastic Realist: he believes "Reals" exist independently of what you or I think about them.
  *   **The Mechanism:** Truth is the destination of the scientific method applied indefinitely. If you and I measure the specific gravity of a sample, we might disagree due to random error. If we refine our instruments and methods, our results converge. Peirce argues that if this process continues forever, the opinions of all investigators will fuse into a single conclusion.
  *   **The Definition:** A belief is true if it corresponds to that final, stable opinion.
  *   **Your Analogy:** It is the limit in calculus. You may never reach $x = \infty$, but the function converges toward a specific value. That value is there whether you calculate it or not. Truth is the "fated" agreement of the community of inquirers.

  **2. James: Truth as Verification (The Currency)**
  For James, truth is a property of the *idea* in transaction with experience. He is less concerned with what exists "out there" and more concerned with how we navigate the world.
  *   **The Mechanism:** Truth happens to an idea. It becomes true, is made true by events. An idea is true if it allows you to move from one part of your experience to another without contradiction, satisfying your intellectual and emotional needs.
  *   **The Definition:** "The true is only the expedient in our way of thinking." (Note: James meant "expedient" in the long run and overall, not just immediate convenience, but the focus remains on *satisfaction*).
  *   **Your Analogy:** It is like currency. A dollar bill is "true" money not because of the cotton-linen blend it's printed on, but because it successfully buys you goods. If a belief "cashes out" in a satisfactory experience, it is true.

  ### Where They Part Ways

  The rupture occurs on the question of **mind-independence**.

  Peirce insists that reality can kick back. If you believe you can walk through a brick wall, the wall will prove you wrong regardless of how "satisfactory" that belief is to your journey. Truth is about *resistance*.

  James argues that the "brick wall" itself is part of the sensory flux we are organizing. If a belief (say, religious faith) provides a vital psychological benefit and contradicts no specific sensory fact, James is willing to call it "true" for that believer, even if it cannot be empirically verified in a lab.

  Peirce wants to eliminate the human element to find the Real. James wants to include the human element because he thinks truth is useless without it.

  ### The Verdict: Why Peirce is Right

  You asked me to pick a side. Given your background in analytical chemistry, there is only one defensible choice: **Peirce.**

  James's pragmatism is a brilliant philosophy for a therapist, a politician, or perhaps a lawyer (like the one in your group), but it is a catastrophic philosophy for a scientist. Here is why Peirce's "convergence" theory holds up and James's "satisfaction" theory fails, specifically addressing the objections you raised.

  **1. The Objection to Peirce: "The End of Inquiry is Unreachable"**
  Your group likely argues: *If truth is what we'd believe at the end of time, and we never get there, how can we claim to know anything now?*

  This objection mistakes a **regulative ideal** for a **temporal destination**. Peirce isn't saying we need to wait until the heat death of the universe to know if water is H₂O. He is saying that the *logic* of our current measurement relies on the assumption that there is a stable value to be found.

  In your career, you didn't need to run an infinite number of titrations to know the concentration of a solution. You ran enough to establish that your error bars were shrinking and your results were stabilizing. The "End of Inquiry" is simply the recognition that the method is self-correcting. We know we are closer to the truth today than in 1820 because our predictions are more precise and our instruments are more sensitive. The "asymptote" is real even if we haven't touched it. If you deny the asymptote exists, you deny that your instruments are measuring anything other than their own internal consistency. Peirce saves the objectivity of science; James reduces it to a consensus of current utility.

  **2. The Objection to James: "Comforting Nonsense"**
  The standard critique is that James lets people call their delusions "true" if they make them happy. James would defend himself by saying a belief must be consistent with *all* experience, not just the pleasant parts.

  However, the deeper failure is that James's metric is **anthropocentric**.
  Imagine you are analyzing a toxic compound.
  *   **Peirce:** The truth is the actual toxicity level, regardless of whether the factory owner wants to believe it's safe or the workers are terrified it's lethal. The "fated agreement" of toxicologists will eventually isolate the LD50.
  *   **James:** If the factory owner believes the compound is safe, and that belief allows him to sleep at night and run a profitable business without immediate visible harm, in what sense is that belief "false" until someone gets sick?

  James's theory struggles to account for **latent reality**. There are truths that do not currently "work" for anyone. For centuries, the germ theory of disease did not "work" for anyone; it was less useful than the miasma theory because you couldn't see germs, and washing hands was inconvenient. Under a strict Jamesian view, germ theory was "less true" in 1700 than it is today because it had less "cash value."

  But Peirce gets it right: The germs were there. The truth was there. It was waiting for the method to converge upon it. Truth is not made by us; it is found by us.

  ### Why This Matters for Your Group

  The ex-lawyer in your group likely prefers James. Law is adversarial; truth is often what the jury agrees upon, what "works" to resolve the conflict. It is a social construct.

  But you spent forty years in a lab. You know that nature is not a jury. Nature does not care about your cross-examination. Nature does not care if a belief is "good in the way of belief." If you misread the chromatogram because the result was inconvenient, the column blows.

  Peirce's "pragmaticism" is the only version that respects the **recalcitrance of reality**. He acknowledges that while we access truth through human signs and communities, the *anchor* of that truth must be outside of us. James cuts the anchor and lets the ship drift wherever the wind of human need blows it.

  Peirce was right to fear the kidnapping of his idea. James turned pragmatism into a philosophy of hope; Peirce intended it as a philosophy of method. For a retired chemist who knows that the sample is what it is, regardless of the hope of the analyst, Peirce is the only one offering a theory of truth that doesn't dissolve when you put it under the spectrometer.

  Stick with the ugly word: Pragmatic**ism**. It's the only one robust enough for the lab.
