prompt: |-
  okay so for my Phil of Science seminar we've spent the last two weeks on laws of nature, and this week was specifically the "quantum entanglement is a problem for Humean Supervenience" debate, which honestly broke my brain a little. Basic setup as I have it in my notes: Lewis's Humeanism says laws are just whatever regularities in the total "mosaic" of local matters of particular fact come out as the best system (simplest + strongest summary of the pattern) — no necessary connections between distinct existences, just Hume's old point dressed up as a metaphysical thesis about the whole world. Anti-Humeans like Armstrong want laws to be necessitation relations between universals, and Maudlin goes further and just says laws are primitive, ungrounded governing facts. Maudlin's specific argument against the Humean side is that entangled particles have correlations that can't be cashed out as intrinsic local properties plus spatiotemporal relations between them, so seperability (which the "mosaic" picture needs) is just false as a matter of physics. Apparently Lewis's actual response to this in "Humean Supervenience Debugged" is kind of just a shrug — something like "so much the worse for quantum mechanics" (I'm paraphrasing, don't quote me) plus some hand-waving about wavefunctions in configuration space still technically counting as "local."

  Here's what's been bugging me since class though, and what I want your take on: what would Hume HIMSELF think about this, as opposed to a modern Lewisian "Humean"? Hume's actual project seems way more epistemic/skeptical than Lewis's — he's not asserting a positive metaphysical thesis that the mosaic is the whole truth about mind-independent reality, he's making a point about what we can ever be entitled to infer (no impression of necessary connexion, causation reduces to constant conjunction + habit of expectation). So would Hume even feel obligated to defend "his" supervenience thesis against Bell-type correlations, or would he think that's not really his fight since he never signed up for the full package (mind-independent mosaics, possible worlds, etc) that got built on top of his name later? Would his empiricism make him suspicious of inferring spooky nonlocal structure from Bell violations in the first place, or would he be totally fine just adding entanglement to the pile of brute regularities, since for him even garden-variety billiard-ball causation already had zero hidden necessity behind it? Basically: reasoning from what Hume actually committed himself to (not just what people citing him now believe), whose side is he really on here, and is there something a little awkward for contemporary Humeans in how much extra unHumean baggage (modal realism etc) they've had to attach to his name to even run this debate?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Philosophy of Science seminar. Topic: Laws of Nature, specifically Quantum Entanglement vs. Humean Supervenience (HS).
      *   **Current Understanding:** The user understands the basic setup: Lewis's HS (laws = best systematization of local mosaic), Anti-Humeans (Armstrong, Maudlin), and Maudlin's specific argument (entanglement violates separability/locality required by the mosaic). They know Lewis's response ("so much the worse for QM" / configuration space locality).
      *   **The Core Question:** What would *David Hume himself* think about this, compared to David *Lewis*?
      *   **Specific Angles:**
          *   Hume's project is epistemic/skeptical, not positive metaphysics (no "mosaic" of mind-independent reality).
          *   Would Hume feel obligated to defend HS against Bell correlations?
          *   Would Hume be suspicious of inferring nonlocal structure (empiricist caution)?
          *   Or would he accept entanglement as just another brute regularity (since billiard balls were already brute)?
          *   Is there awkwardness in how contemporary Humeans (Lewis) have attached "unHumean baggage" (modal realism, etc.) to Hume's name?

  2.  **Deconstruct the Philosophical Positions:**
      *   **David Hume (18th Century):** Empiricist, Skeptic. Focus on human understanding, impressions, ideas, habit/custom. Causation is psychological projection onto constant conjunction. Agnostic about underlying reality (noumena vs. phenomena distinction isn't quite Kant yet, but the sentiment is there).
      *   **David Lewis (20th Century):** Metaphysical Realist, Modal Realist. Humean Supervenience is a claim about the *structure of the world*, not just our knowledge of it. The "mosaic" is ontological.
      *   **Maudlin/Anti-Humeans:** Laws govern. Entanglement shows holistic properties that don't supervene on local points.
      *   **The Conflict:** QM (Bell's Theorem) suggests non-locality or holism. HS requires separability (local qualities at spacetime points).

  3.  **Brainstorming Hume's Potential Reaction:**
      *   *On Metaphysics:* Hume would likely reject the Lewisian ontological commitment. He wouldn't care about the "true mosaic" because we can't access it. He'd care about the *phenomena* (the experimental results).
      *   *On Causation/Necessity:* Hume already denied necessary connection in billiard balls. So, entanglement isn't *more* mysterious in terms of "power." It's just a stranger regularity.
      *   *On Non-locality:* Hume is wary of ideas not derived from impressions. "Action at a distance" was already suspect in his day (Newton's gravity bothered him). However, if the *impression* is of correlated measurement outcomes, he might accept the regularity without positing a "hidden mechanism."
      *   *On the "Humean" Label:* The user is right. Lewis co-opted Hume. Hume wasn't a "Humean Supervenient" in the Lewisian sense.
      *   *On the Debate:* Hume would likely dissolve the debate. The debate assumes a certain metaphysical realism about laws and mosaics that Hume would find dogmatic.

  4.  **Structuring the Response:**
      *   **Validation:** Acknowledge the user's insight. It's a very sharp observation that Lewis and Hume are doing very different projects.
      *   **Point 1: The Metaphysical vs. Epistemic Divide.** Contrast Lewis's ontological mosaic with Hume's skeptical empiricism. Hume doesn't commit to the "furniture of the world" in the way Lewis does.
      *   **Point 2: Causation and Necessity.** Remind that for Hume, *all* causation is "spooky" (just habit). So entanglement isn't a special threat to *necessity*, because there was never any necessity to begin with.
      *   **Point 3: Separability and Locality.** This is the trickiest part. Hume liked contiguity. But he also prioritized experience. If experience says "correlated spins," he accepts the correlation. He wouldn't fight for separability if the data contradicts it, because separability is a philosophical principle, not an impression.
      *   **Point 4: The "So Much the Worse" Move.** Lewis was willing to doubt QM to save Metaphysics. Hume would likely do the reverse: doubt the Metaphysics to save the Experience (or at least remain agnostic).
      *   **Point 5: The Irony of the Label.** Address the user's point about "unHumean baggage." Lewis added modal realism, rigid designation, etc. Hume would find possible worlds absurd.
      *   **Conclusion:** Hume wouldn't take a side in the *metaphysical* debate. He'd be a quietist or a pragmatist about the regularities.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't make Hume sound *too* modern (like a logical positivist). He still had Newtonian instincts. He was uncomfortable with gravity's action at a distance.
      *   *Nuance:* Hume's "copy principle" (ideas from impressions). Do we have an impression of non-locality? We have an impression of the *readouts*. The "connection" is in the mind. So Hume might say the non-locality is a feature of our *theory*, not the world.
      *   *Key Distinction:* Lewis's HS is about *truthmakers*. Hume's project is about *justification*.
      *   *Maudlin's Charge:* Maudlin says the world isn't separable. Hume says "I only know my perceptions." So Hume can't affirm or deny the world's separability, only the separability of his *ideas*.

  6.  **Drafting the Response (incorporating the "voice"):**
      *   Tone: Academic but conversational (seminar discussion style).
      *   Key phrases: "Project mismatch," "Metaphysical realism vs. Skeptical empiricism," "Dissolving the problem."
      *   Make sure to explicitly answer: "Whose side is he on?" (Answer: Neither/Both/He leaves the room).

  7.  **Final Polish:** Check against the user's specific questions.
      *   *Obligated to defend HS?* No.
      *   *Suspicious of nonlocal structure?* Yes, but not for the same reasons as Lewis.
      *   *Fine with brute regularities?* Yes, that's his baseline.
      *   *Awkward baggage?* Yes, definitely.

  8.  (Final thought before generating): Ensure I mention that Lewis knew this. Lewis admitted he was using Hume's name for a specific metaphysical thesis that Hume might not recognize. But the user's intuition that there's a tension is correct.

  9.  **Constructing the Output:** (Proceed to write the response following these points.)
answer: |-
  This is an exceptionally sharp observation, and honestly, it cuts to the heart of why the "Laws of Nature" debate in contemporary metaphysics often feels like it's talking past the history of philosophy. You have correctly identified a category error: **David Hume was doing epistemology and psychology; David Lewis was doing systematic metaphysics.**

  If you dragged the 18th-century David Hume into your seminar to adjudicate the Maudlin vs. Lewis debate, he wouldn't just be confused; he would likely reject the terms of the debate entirely. Here is a breakdown of why Hume himself would probably feel alienated from "Humean Supervenience," and where he might actually stand on the quantum question.

  ### 1. The Metaphysical Mismatch: Mosaic vs. Mind
  You hit the nail on the head: Lewis's Humeanism is a **positive ontological thesis**. It claims that the world *is* a mosaic of local matters of particular fact. It makes a claim about mind-independent reality (even if Lewis frames it via possible worlds).

  Hume's project, particularly in the *Enquiry*, is **skeptical and epistemic**. When Hume says there are no "necessary connections," he isn't making a dogmatic claim that the universe *lacks* glue. He is making a claim about *us*: we have no impression of necessity, therefore we cannot form a coherent idea of it. He is agnostic about what the world is "in itself."

  *   **Lewis:** "The world supervenes on the local mosaic." (Claim about the World)
  *   **Hume:** "We cannot conceive of anything beyond our perceptions and their relations." (Claim about the Mind)

  So, to your question: **Would Hume feel obligated to defend Supervenience against Bell correlations?**
  **No.** Defending the "mosaic" requires committing to a specific structure of mind-independent reality. Hume explicitly suspends judgment on the ultimate nature of external objects. For Hume, the "mosaic" is just the order of our perceptions. If quantum mechanics tells us our perceptions (measurement outcomes) are correlated in non-local ways, Hume doesn't need to save "separability" because separability was never a dogma about the *noumenal* world; it was a habit of how we organize phenomena.

  ### 2. Causation: Billiard Balls vs. Entangled Spins
  This is the strongest point for your intuition. Maudlin argues that entanglement proves there are "holistic" facts that aren't grounded in local facts, which breaks the Humean picture of laws summarizing local patterns.

  But remember Hume's analysis of the billiard ball. When one ball hits another, Hume argues there is **zero** observable power or necessity transferring from A to B. It is just Event A, then Event B, and a feeling of expectation in the mind.

  *   **For Lewis:** Entanglement is a problem because it threatens the *supervenience base*. If the facts aren't local, the Best System can't be built out of local tiles.
  *   **For Hume:** Entanglement is just another "constant conjunction."

  Hume would likely say: *"You are worried that the spin of Particle A is correlated with Particle B without a local mechanism? My friend, I was already telling you 300 years ago that there is no mechanism between billiard balls either! You are projecting 'governing' or 'connecting' where there is only sequence."*

  Hume would be perfectly happy to add entanglement to the pile of **brute regularities**. In fact, he might find the Anti-Humean panic amusing. Armstrong and Maudlin are worried that without "necessitation relations," the world falls apart. Hume's whole point was that the world *looks* like it's held together by necessity, but that's a psychological projection. Whether the regularity is local (billiards) or non-local (entanglement), the epistemic status is the same: it's just a pattern we observe.

  ### 3. Locality and "Action at a Distance"
  Here is where it gets tricky. Hume *did* have a preference for contiguity (things touching in space and time). In his day, Newton's gravity was controversial because it looked like action at a distance. Hume was uncomfortable with it, but he didn't reject Newton's math. He treated it as a description of phenomena, not an explanation of causes.

  If Bell's Theorem shows that nature violates Bell inequalities, a Lewisian Humean tries to save Locality (often by messing with the wavefunction ontology, as you noted Lewis did).
  A true Humean empiricist would likely say: **"If the impressions (data) show non-local correlations, then our philosophical preference for locality must yield."**

  Hume prioritizes the "impressions" over the "theories." If the experimental readouts are the impressions, and they show correlation without local mediation, Hume accepts the correlation. He wouldn't fight for "separability" because separability is a metaphysical principle, not an empirical finding. He would likely view the insistence on a local mosaic as a piece of dogmatic rationalism—exactly the kind of thing he wrote the *Enquiry* to destroy.

  ### 4. The "UnHumean Baggage" Problem
  You asked if there is something awkward about the baggage contemporary Humeans carry. **Absolutely.**

  To make "Humean Supervenience" work as a metaphysical thesis, Lewis had to add:
  1.  **Modal Realism:** (Possible worlds are real concrete entities). Hume would have thought this was insane.
  2.  **A specific ontology of properties:** (Natural properties vs. non-natural). Hume was a nominalist; he didn't believe in universals or robust property realism in the way Lewis needed for the "Best System" analysis.
  3.  **Truthmakers:** The idea that truths about laws need to be "grounded" in the mosaic. Hume doesn't talk about truthmakers; he talks about the justification of beliefs.

  Lewis essentially took Hume's *skepticism* about necessity and turned it into a *dogma* about locality and supervenience. As the philosopher Simon Blackburn (a quasi-realist who knows his Hume) has pointed out, Lewisian Humeanism is often "Humean" in name only. It keeps the denial of necessary connections but drops the skepticism about metaphysics that motivated it.

  ### 5. So, Whose Side is Hume On?
  If Hume walked into your seminar:

  *   **Against Maudlin:** He would agree that there are no "governing laws" or "necessitation relations." He is 100% on board that laws are descriptions, not prescriptors.
  *   **Against Lewis:** He would reject the idea that we can know the "total mosaic" of local facts. He would also reject the idea that we should reject Quantum Mechanics to save a metaphysical principle (Lewis's "so much the worse for QM" stance).
  *   **The Verdict:** Hume would be a **Quietist**.

  He would likely say the debate assumes we can know the "furniture of the universe" well enough to say whether it is separable or holistic. Since we only know our perceptions, the question "Is the world *really* separable?" is meaningless. The question "Do our observations behave *as if* the world is separable?" is an empirical one, and the answer (post-Bell) is "No."

  Therefore, Hume would accept the quantum regularities as brute facts, deny that they require "governing," and tell Lewis to stop worrying about the "mosaic" because we can't see the tiles anyway.

  ### Summary for your Seminar
  If you want to raise this in class, your angle is strong: **The "Humean" defense of Supervenience against Entanglement relies on a metaphysical realism that Hume himself would have rejected as dogmatic.**

  Lewis saved Humean *laws* (as regularities) but sacrificed Humean *epistemology* (by committing to a specific, knowable ontology of local facts). Maudlin attacks the ontology. Hume would likely shrug at both, accept the quantum regularities as just another custom of the mind, and remind everyone that even "local" causation was always just a mystery wrapped in habit.

  It's a great critique because it shows that the "Laws of Nature" debate is often less about science and more about how much metaphysical baggage we are willing to carry to avoid saying "we don't know why this happens." Hume was fine with "we don't know." Lewis was not.
