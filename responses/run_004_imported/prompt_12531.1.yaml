      *   Explain *when* to stratify (Confounders) vs. *when not* to (Mediators, Colliders).
      *   Provide a concrete counter-example (e.g., the "Berkeley Admissions" case is often debated, but a better one for "don't stratify" is a mediator scenario like blood pressure medication).

