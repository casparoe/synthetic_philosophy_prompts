answer: |-
  **Setting:** *A sterile conference room in the Economics Department. A stack of resumes sits between JULIAN (Rational-Choice Economist) and ELENA (Bounded-Rationality Theorist). It is 4:00 PM on a Friday. They have just finished reviewing Candidate #4.*

  **Julian:** (Tapping a pen against the table) Candidate Four is solid. She clears the tenure bar. But we have three more slots in the budget and two more candidates in the pipeline. To stop now is to leave utility on the table.

  **Elena:** She meets the aspiration level we set at the beginning of the semester. She publishes in top fields, the teaching evals are competent, and she fits the cluster. According to our protocol, we make an offer.

  **Julian:** "According to protocol." That's the language of bureaucracy, not rationality. Look, Elena, I know you want to call this "satisficing." You want to say we set a threshold and stop when we hit it. But let's be precise. If you choose to stop searching at Candidate Four, you are implicitly asserting that the expected marginal benefit of interviewing Candidate Five is lower than the marginal cost of conducting that interview.

  **Elena:** I'm asserting no such thing. I'm asserting that we defined a need, and this candidate fulfills it.

  **Julian:** But *why* that need? Why that threshold? If you adjust the threshold to match the point where you stop searching, then your "satisficing" rule is mathematically isomorphic to an optimization rule. You *are* maximizing. You've just folded the costs of search and computation into the objective function. It's all optimization, Elena. Satisficing is just optimization in disguise.

  **Elena:** (Leaning forward) And there is the problem. You can *redescribe* my behavior as optimization after the fact. I don't dispute that. If I stop, you can always construct a cost function that makes stopping the "optimal" choice. But that redescription explains nothing unless you can specify those costs *independently* of the behavior they are meant to explain.

  **Julian:** The costs aren't mysterious. They're time. They're budget. They're the opportunity cost of the committee's hours. We can measure those.

  **Elena:** You can measure the hours, Julian, but you cannot measure the *shadow price* of the information we haven't gathered yet. To claim I optimized, you'd need to know the probability distribution of the remaining candidates. I don't know it. The department doesn't know it. If we can't calculate the expected value of the next candidate, we can't compare it to the cost of the interview. Therefore, we aren't optimizing. We're using a heuristic because the environment is too complex for the calculation you're demanding.

  **Julian:** You're conflating the *process* with the *outcome*. Agents don't need to consciously solve the calculus. They act *as if* they do. If you stop at Candidate Four, revealed preference theory tells us that, for you, the cost of continuing exceeded the benefit. If you can't specify the cost independently, it's because you're looking for a psychological receipt that doesn't exist. The behavior reveals the cost.

  **Elena:** And that is precisely why your theory is a tautology. If the behavior reveals the cost, and the cost explains the behavior, you haven't explained anything. You've just labeled the action. Herbert Simon's point was that human rationality is bounded by cognitive limits and environmental structure. I'm stopping because this is a "good enough" solution that requires manageable computation. You're arguing I'm stopping because I solved a maximization problem where the variables are invisible.

  **Julian:** They aren't invisible; they're implicit. Look, if I told you Candidate Five is a Nobel laureate who just applied, would you stop?

  **Elena:** If we knew that? No. We'd interview.

  **Julian:** Aha! So your aspiration level isn't fixed. It adjusts based on the expected quality of the search. That adjustment *is* the optimization process. You are dynamically updating your stopping rule based on new information about the search space. That's optimal search theory.

  **Elena:** No, it's adaptive aspiration. If the environment changes, the definition of "good enough" shifts. But it doesn't shift because I calculated a new global maximum. It shifts because my experience tells me the pool is deeper than I thought. Julian, listen to me: To optimize, I need to know the curve. I only see the points. Satisficing is a strategy for navigating when you can't see the curve. Calling it "optimization with high search costs" assumes I know the costs and the benefits well enough to make that trade-off. I don't. I just know Candidate Four works.

  **Julian:** (Sighs, leaning back) You're arguing for a theory of procedure, I'm arguing for a theory of outcome. If the outcome is efficient, the mechanism doesn't matter. If we hire her, and she turns out to be great, my model says we maximized. Your model says we got lucky with a heuristic.

  **Elena:** And if she turns out to be mediocre? Your model says we miscalculated the costs. My model says the heuristic failed, and we adjust the aspiration level for next time. Your model requires omniscience to be falsifiable; mine requires only that we admit we're human.

  **Julian:** My model requires consistency. If you say "costs are too high to search" today, but "costs are low enough to search" tomorrow when the candidates are the same, you're irrational.

  **Elena:** Not if the *context* changed. Maybe tomorrow we have more time. Maybe the department's needs shifted. Satisficing allows for context-dependent rules. Optimization demands a single, consistent utility function across all contexts. That's not rationality, Julian. That's rigidity.

  **Julian:** (Pauses, looking at the resume) So, practically speaking. You're saying we make the offer to Candidate Four because calculating the value of Candidate Five is computationally intractable for this committee.

  **Elena:** I'm saying we make the offer because she does the job, and the cost of finding someone "better" is not just time—it's the risk of losing Candidate Four while we chase a phantom optimum.

  **Julian:** (Nods slowly) Fine. But I'm noting in the minutes that this decision is consistent with a constrained optimization model where the cost of delay is prohibitively high.

  **Elena:** (Smiling faintly) And I'll note that it's consistent with bounded rationality where the aspiration level was met. We hire her. Just don't pretend you solved for X.

  **Julian:** I didn't solve for X. I just know that Y equals Z.

  **Elena:** Only because you defined Y as Z.

  **Julian:** (Stands up) Same result.

  **Elena:** Different science.

  *(They both reach for the phone to call the Dean.)*
