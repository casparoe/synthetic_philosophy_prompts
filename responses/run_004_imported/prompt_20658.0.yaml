answer: |-
  This is an excellent catch, and you are reading Moore closely enough to spot what looks like a major friction point. You haven't missed the text; you've identified the exact tension that has kept Moore scholars busy for over a century.

  However, the standard defense of Moore (and the way he intends the arguments to fit together) relies on one of his most famous—and controversial—doctrines: **The Principle of Organic Unities.**

  Here is how Moore reconciles the "Two Worlds" thought experiment with his list of "Greatest Goods," and why your intuition that he wants to "have it both ways" is actually half-right (in a way he would admit).

  ### 1. The Misunderstanding of the "Two Worlds" Argument
  Your critique hinges on this phrase: *"If an unwitnessed beautiful world already has pretty much all the value its ever going to have..."*

  This is the specific point where your reading diverges from Moore's text. Moore **does not** claim the uninhabited beautiful world has "pretty much all the value."

  In Chapter III (§113), when he introduces the Two Worlds, his goal is strictly negative: he wants to prove that **value is not zero** without consciousness. He is fighting Hedonists who claim that without a mind to feel pleasure, value is literally nonexistent. Moore says, "No, the beautiful world is better than the ugly one, so value exists independently."

  However, immediately after making that point, he qualifies it heavily. He writes:

  > "I do not mean to say that the mere existence of the beautiful thing... is of equal value with the consciousness of it. On the contrary, I hold that the consciousness of it is **far more valuable** than the thing itself."

  So, Moore's math looks like this:
  *   **Beautiful World (No Mind):** Value = 1 (Non-zero, but small).
  *   **Ugly World (No Mind):** Value = -1 (or 0).
  *   **Beautiful World + Conscious Appreciation:** Value = 1,000.

  He needs the "1" to exist to defeat the Hedonists. But he needs the "1,000" to exist to support his Ideal Utilitarianism.

  ### 2. The Glue: Organic Unities
  This is where Chapter VI comes in. Moore argues that the value of a **whole** is not simply the sum of the values of its **parts**.

  *   **Part A:** The beautiful object (has intrinsic value).
  *   **Part B:** The conscious mind (has intrinsic value).
  *   **The Whole:** The mind *appreciating* the object (has organic value).

  Moore claims that $Value(Whole) \neq Value(A) + Value(B)$. Instead, the relation between them creates a massive surge in value.

  So, to answer your specific question: **Does the "appreciating" part do much real work value-wise?**
  Moore's answer is: **Yes, it does almost all the work.**

  He agrees with you that the beauty "out there" is secondary. But he disagrees that it is *irrelevant*. It is a necessary condition for the "Greatest Good," but it is not the *source* of the majority of the value. The source of the value is the **complex state of affairs** involving both the object and the consciousness.

  ### 3. Is this a known tension?
  Yes. In fact, many critics argue that Moore's doctrine of Organic Unities is a "get out of jail free" card that allows him to be inconsistent without admitting it.

  *   **The Criticism:** Critics (like C.D. Broad and later G.E.M. Anscombe) argued that Organic Unities make ethical calculation impossible. If the value of a whole isn't the sum of its parts, how can we ever predict the value of an action? It seems ad hoc.
  *   **The Defense:** Mooreans argue that this captures the phenomenological truth that *relationships* matter. A world with a happy person is good. A world with a beautiful painting is good. But a world where a happy person looks at a beautiful painting is *disproportionately* better.

  ### 4. Why your intuition is sharp
  You wrote: *"Shouldn't his own thought experiment actually commit him to saying the beauty... is basically where all the value lives, full stop, and whether anyone loves or notices it is secondary?"*

  Actually, Moore thinks the opposite is true, and he is consistent on this: **Consciousness is the primary vessel of value.**

  If you look at his hierarchy of goods in Chapter VI, the things at the very top are always mental states directed at objects:
  1.  The pleasures of human intercourse (friendship/love).
  2.  The enjoyment of beautiful objects.

  Things like "mere existence of beauty" or "mere existence of virtue" (without anyone knowing about it) are ranked much lower.

  So, you are right to sense that the *unwitnessed* beauty is doing very little heavy lifting. Moore would agree with you! He only insists it has *some* lifting to do (to prove realism about value), but he insists the *witnessed* beauty is where the real ethical weight lies.

  ### Summary for your Reading Group
  You can frame your contribution like this:

  1.  **Acknowledge the tension:** It looks like Moore is inflating the value of uninhabited beauty in Chapter III, then downplaying it in Chapter VI.
  2.  **Propose the solution:** Moore resolves this via **Organic Unities**. The value of the *relation* (appreciation) dwarfs the value of the *relata* (the object alone).
  3.  **The Critique:** Ask the group if they buy Organic Unities. If they don't, then your critique stands: Moore *is* trying to have it both ways. He wants to be a Realist (value is in the world) and a Mentalist (value is in the mind) simultaneously, and Organic Unities is the bridge. If the bridge is shaky, the argument collapses.

  You aren't misreading him; you've identified the precise mechanism (Organic Unities) he uses to stop the two halves of his book from contradicting each other. Whether that mechanism works is the real debate.
