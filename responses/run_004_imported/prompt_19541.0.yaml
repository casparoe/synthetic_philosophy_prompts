prompt: |-
  ok so for the last few weeks ive been kind of obsessed with this question that started bc my doctor and me got into an argument over whether my "borderline" blood pressure numbers count as an actual disease or if im just on the normal end of normal. that sent me down a rabbit hole into philosophy of medicine stuff, specifically this debate between "naturalists" (disease is just a biological fact, no values involved) and "normativists" (calling something a disease always smuggles in values/harm somehow). the three theories i keep running into are Boorse's biostatistical theory (pure naturalist, no values), Wakefield's harmful dysfunction analysis (needs bio dysfunction PLUS harm), and Nordenfelt's welfare/vital-goals theory (basically all values).

  instead of the usual textbook examples, i want to stress test these three on some genuinely messy cases: drapetomania (the 1800s "diagnosis" for slaves who tried to escape), grief thats still intense after a year, infertility in someone who never wanted kids anyway, and adult ADHD.

  can you go theory by theory, case by case, and tell me the verdict each theory actually spits out (disease/not a disease/depends, and why) - then rank the 3 theories best to worst at avoiding obviously dumb verdicts across these cases. give it to me as JSON like this:

