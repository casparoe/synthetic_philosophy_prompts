      *   **Round 3: The Universal Instrument.**
          *   Descartes argues reason is a tool for *all* contingencies; instinct is specific. If a bird builds a nest perfectly but fails when the environment changes radically, it's instinct.
          *   Montaigne pushes back: Animals *do* adapt. And humans often act on instinct too.
      *   **Round 4: The Hard Problem (Sentience/Suffering).**
          *   This is crucial per the prompt. Does Descartes really think they feel *nothing*?
          *   Descartes must be honest: If they have no immaterial soul/mind, they have no *conscious* thought. But do they feel pain? He distinguishes physiological reaction from conscious suffering.
          *   Montaigne finds this morally repugnant and epistemologically arrogant. How can you be sure?
      *   **Conclusion:** No resolution. A mutual acknowledgment of the mystery. A nod to the user's background (corvids) without breaking character.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Am I making Descartes too cartoonish? *Fix:* Ensure he emphasizes the *theological* and *metaphysical* necessity of the mind-body dualism, not just cruelty. He needs to explain *why* the "universal instrument" matters.
      *   *Check:* Is Montaigne just saying "animals are smart"? *Fix:* Make sure he emphasizes human *ignorance*. His point is often "we don't know," not necessarily "they are exactly like us." He attacks the certainty of the boundary.
      *   *Check:* The "Chrysippus's Dog" example. This is a classic Stoic example Montaigne used. The dog comes to a three-way crossroads. Sniffs path 1 (no), sniffs path 2 (no), runs down path 3 without sniffing. Conclusion: "It must be this way."
      *   *Check:* The "Fox on Ice." The fox listens to the sound of the water to gauge safety.
      *   *Check:* Descartes' "Universal Instrument." Reason allows us to handle *new* situations. Instinct handles *specific* situations perfectly but fails elsewhere.
      *   *Check:* Sentience. Descartes admitted in letters (to More, to Newcastle) that it looks like they feel, but metaphysically they can't. I need to capture that tension.

