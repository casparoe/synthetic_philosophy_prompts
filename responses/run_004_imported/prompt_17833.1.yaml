          *   Montaigne brings out the specific cases (the dog at the crossroads, the fox).
          *   Descartes responds not by denying the *behavior*, but by reinterpreting the *cause*. It's not reason; it's the disposition of organs (instinct as clockwork).
      *   **Round 2: The Language Test.**
