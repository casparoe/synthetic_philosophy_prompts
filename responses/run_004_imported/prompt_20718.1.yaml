      *   *Synthesis:* Both are partially right, but both are also partially wrong if taken to the extreme. A good postmortem needs *both* a detailed timeline (what happened) *and* actionable takeaways/lessons learned (how to prevent it). The Team Lead is asking for the "Lesson," the User is asking for the "Facts." You need both.

