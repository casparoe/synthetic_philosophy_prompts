prompt: |-
  okay so i've been going down an effective altruism rabbit hole for like two months now (blame the 80,000 hours podcast) and i just learned about "moral uncertainty" - this idea that since nobody can actually be sure which ethical theory is correct, you shouldn't just pick utilitarianism or kantianism and go all in on it, you're supposed to spread your credence across a few theories and let that shape what you actually do. the version that really got stuck in my head is the "moral parliament" thing (i think Bostrom started this?) where each theory you have some credence in gets seats proportional to that credence, and then they basically negotiate and vote on what you should do, kind of like a coalition government except the parties are utilitarianism and Kantian ethics instead of, like, actual political parties.

  completely seperately, for my philosophy elective i've been reading Henry Sidgwick, who apparently everyone in the EA world treats like a patron saint, since his whole book Methods of Ethics tries to referee between utilitarianism, egoism, and common sense morality, and it ends with him basically admitting defeat on this thing he calls the "dualism of practical reason" - he couldnt get egoism and rational benevolence to stop contradicting each other, and it bugged him enough that he ends the book on this note of total philosophical despair. so my question is: if you showed 1800s Sidgwick the moral parliament model, do you think he'd be relieved, like "finally, the tool i needed," or would he actually have a problem with it, since he seemed to think ethics was supposed to work like a science that converges on objective, self evident truths through reasoning, not something where you let theories "vote" like interest groups bargaining with each other. also kind of a side thing but Sidgwick seemed really confident that BOTH egoism and rational benevolence were true at the same time, he wasn't unsure which one was true, so i'm not even sure "credence" is the right frame for what his problem actually was in the first place. anyway curious what you think, this has been living in my head rent free lately lol
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user has been diving into Effective Altruism (EA) for two months (triggered by 80,000 Hours podcast).
      *   **Core Concept 1:** Moral Uncertainty / Moral Parliament (associated with Bostrom/Ord, though the user mentions Bostrom). This involves assigning credence to different ethical theories and having them "negotiate" or "vote" based on those proportions.
      *   **Core Concept 2:** Henry Sidgwick's *The Methods of Ethics*. Specifically, his "Dualism of Practical Reason" (the conflict between Egoism and Utilitarianism/Rational Benevolence) and his resulting "philosophical despair."
      *   **The Question:** If you showed 19th-century Sidgwick the Moral Parliament model, would he be relieved (finally a tool!) or critical (ethics should be scientific/objective, not a bargaining chip)?
      *   **The Insightful Observation:** The user notes that Sidgwick wasn't *uncertain* about which theory was true; he thought *both* were true (or at least rationally required) but contradictory. So, does "credence" even apply to Sidgwick's problem?
      *   **Tone:** Casual, intellectual, curious ("living in my head rent free lol").

  2.  **Deconstruct the Sidgwick/Moral Parliament Compatibility:**
      *   *Sidgwick's Goal:* He wanted ethics to be a science. He sought self-evident axioms (like math) that would harmonize. He wanted *unity*.
      *   *Moral Uncertainty's Goal:* To guide action *in the absence* of consensus or certainty. It accepts pluralism and conflict as a practical reality to be managed, not necessarily solved metaphysically.
      *   *The "Dualism" Issue:* Sidgwick didn't think "Maybe Egoism is true, maybe Utilitarianism is true." He thought "Reason demands I pursue my own good (Egoism). Reason also demands I pursue the universal good (Utilitarianism). These conflict. Therefore, Reason is contradictory." This is a crisis of rationality, not just uncertainty.
      *   *The "Credence" Issue:* The user is spot on. Moral uncertainty usually assumes mutually exclusive theories (T1 is true OR T2 is true). Sidgwick thought T1 is binding AND T2 is binding, but they clash. Assigning 50% credence to each doesn't solve the contradiction; it just dilutes it.

  3.  **Evaluate Sidgwick's Likely Reaction:**
      *   *Relief?* Unlikely. The Moral Parliament is a pragmatic workaround. Sidgwick wanted a *solution* to the contradiction, not a *management system* for the contradiction. He feared that if Reason is dualistic, ethics is fundamentally irrational. A parliament admits the irrationality rather than resolving it.
      *   *Criticism?* Highly likely. He would see it as "common sense morality" dressed up. It lacks the axiomatic certainty he craved. It treats ethical truths as political interests rather than mathematical truths.
      *   *Nuance:* Sidgwick was a utilitarian at heart (mostly). He might appreciate the *consequentialist* calculus of the parliament (maximizing expected moral value), but the *meta-ethical* implication (that there is no single right answer) would horrify him.

  4.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by validating the user's deep dive. EA rabbit holes are real. The connection between Sidgwick and EA is strong (Peter Singer etc.). The observation about "credence" vs. "dualism" is excellent.
      *   *Address the "Credence" Point:* This is the strongest part of the user's prompt. I need to emphasize that Moral Uncertainty assumes *exclusivity* (one theory is right), while Sidgwick faced *incompatibility* (two rational requirements clash). This is a crucial distinction.
      *   *Sidgwick's Scientific Ideal:* Explain his desire for ethics as a science (like Newtonian physics). He wanted convergence, not compromise. The Parliament model is political/compromising, which contradicts his search for objective truth.
      *   *The "Despair" Aspect:* Why was he despairing? Because if Reason contradicts itself, morality might be groundless. A parliament doesn't fix groundlessness; it just builds a house on the swamp.
      *   *Modern EA Context:* Briefly touch on how modern EAs use Sidgwick. They often ignore the despair and take the Utilitarian half. Moral uncertainty is a later development (2000s/2010s) to handle the fact that EA hasn't solved meta-ethics either.
      *   *Conclusion:* Summarize. Sidgwick would likely see the Parliament as a clever stopgap, but ultimately a failure to do what philosophy *ought* to do (find the Truth).

