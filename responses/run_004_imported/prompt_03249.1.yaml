answer: |-
  This is such a good observation, and honestly, you've hit on a tension that a lot of people miss when they first encounter moral uncertainty. You are absolutely right to flag the "credence" issue—that is the critical wedge between Sidgwick's problem and the Moral Parliament model.

  First off, welcome to the rabbit hole. It is deep, and Sidgwick is indeed the grim, Victorian godfather haunting the whole thing. (Peter Singer literally called him the "patron saint of Effective Altruism," so you're in good company.)

  Here is my take on how 1874 Sidgwick would react to the 2024 Moral Parliament, broken down by the specific philosophical friction points you noticed.

  ### 1. The "Credence" Mismatch (You nailed this)
  Your intuition here is spot on. Moral uncertainty models (like the Parliament) generally operate on the assumption that **only one** moral theory is ultimately correct, but we don't know which one. So, I assign 40% credence to Utilitarianism, 40% to Deontology, 20% to Virtue Ethics, etc. It's an epistemic problem: *The truth is out there, I just don't have it.*

  Sidgwick's Dualism of Practical Reason is not an epistemic problem; it's a **metaphysical** one.

  Sidgwick didn't think, "I'm 50% sure I should be an egoist and 50% sure I should be a utilitarian." He argued that pure practical reason *demands* egoism (it is rational to pursue my own happiness) and pure practical reason *also demands* utilitarianism (it is rational to pursue the universal good). He thought **both** were self-evident axioms of reason.

  If you show him a Moral Parliament, he would point out that you can't just assign credence to them. If Reason commands X and Reason commands Not-X, you don't solve that by flipping a weighted coin. You solve it by proving one of them isn't actually a command of Reason. A parliament implies we can compromise; Sidgwick thought logic doesn't compromise.

  ### 2. Ethics as Science vs. Ethics as Politics
  Sidgwick was obsessed with making ethics a **science**. He wanted it to be like geometry or Newtonian physics. He was looking for self-evident axioms that would converge into a unified system. He wanted *consistency*.

  The Moral Parliament model is inherently **political**. It treats ethical theories like interest groups in a coalition government. It accepts that there is conflict and says, "Okay, let's manage the conflict."

  Sidgwick would likely view this as a surrender. To him, the Moral Parliament is essentially institutionalizing the "Dualism." It's saying, "We can't solve the contradiction, so let's just let the contradictions vote." For a man who wanted ethics to be a rigorous science of right and wrong, this would feel like saying, "We can't figure out if 2+2=4 or 5, so let's vote on it."

  He would probably see it as a sophisticated version of "Common Sense Morality," which he spent half his book deconstructing for being vague and contradictory.

  ### 3. The Nature of the Despair
  You mentioned his "philosophical despair." It's important to remember *why* he was despairing. It wasn't just that he couldn't decide what to do for dinner. It was that if Reason is fundamentally contradictory (Dualism), then the universe might not be morally coherent.

  If Egoism and Utilitarianism are both rational but incompatible, then it is possible for the "Right Thing" and the "Rational Thing" to be different. This threatens the whole project of morality.

  If you show him the Moral Parliament, he might say:
  > "This helps me decide which charity to donate to, sure. But it does not solve the problem that Reason is at war with itself. You have given me a calculator for action, but you have not given me a unified theory of the Good."

  He wanted a **synthesis**, not a **negotiation**.

  ### 4. Where He Might Nod in Approval
  That said, Sidgwick was a pragmatist in many ways (he was involved in women's education and psychical research). He understood that in the absence of certainty, we need heuristics.

  He might appreciate the **formalism** of the Moral Parliament. Sidgwick loved systematizing. The idea of taking "expected moral value" seriously aligns with his utilitarian calculus. If he could be convinced that the "truth" is inaccessible (which modern EA assumes more than he did), he might accept the Parliament as a "second-best" solution for non-ideal agents.

  But he would likely insist that we keep searching for the "God's eye view" that resolves the dualism (perhaps through theology—he hoped a divine reward system might align self-interest with universal good, which is... a bit of a cope, honestly).

  ### The Verdict
  If you showed Sidgwick the Moral Parliament:

  1.  **He would correct you on "Credence":** He'd insist the problem isn't uncertainty about which theory is true, but the contradiction of two true rational demands.
  2.  **He would be unsatisfied:** He wanted a proof, not a policy. The Parliament manages the symptom; he wanted to cure the disease.
  3.  **He would recognize the Utility:** He'd admit it's better than doing nothing, but he wouldn't let it stop him from searching for the unified truth.

  **The EA Connection:**
  Modern Effective Altruists (like MacAskill, who wrote *Uncertainty*) basically accept that Sidgwick's despair was premature, or at least that we can't wait for him to be resolved. EA largely bypasses the Dualism by just... assuming Utilitarianism wins for public action, while using Moral Uncertainty to hedge bets on *which version* of consequentialism is right.

  Sidgwick would probably think modern EAs are a bit too confident, but he'd be thrilled that people are actually trying to calculate the "universal good" rigorously. He just wouldn't like the idea that we've given up on proving *why* it's rational to do so.

  You're right to keep this living in your head rent-free, by the way. It's one of the few places where the "math" of EA crashes into the hard wall of meta-ethics, and Sidgwick is the ghost in the machine.
