  *   Okay, so if I recommend Suspension, I am splitting the difference. The strongest opposition to *Suspension* could be from the Expulsion camp (it's too soft) OR the No Sanction camp (it's punitive on illness).
  *   Given the severity (threats + plagiarism), Expulsion is the main alternative. So the strongest opposition to my Probation recommendation is the argument that **safety and IP rights must be absolute to maintain community trust.** I will focus on that.

