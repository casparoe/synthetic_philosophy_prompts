prompt: |-
  I'm a student member of my college's Honor Council (the panel that hears academic integrity cases), and this semester I'm also taking a philosophy of probability course where we just spent two weeks on the reference class problem -- you know, the classic headache where you want "the" probability that some specific person has some property, but depending which comparison group you slot them into (all smokers vs. smokers their age vs. smokers their age with their family history, etc.) you get a completely different number, and there's no principled way to say which group is actually the right one for them specifically. We've got a case in front of the council right now that I can't stop thinking is exactly this problem wearing a disguise, so before we vote I want an actual memo laying out the reasoning, not just my gut feeling.

  Here's the case: a student's take-home essay got flagged by the AI-writing detector the school licensed this year, which spat out "91% probability this text is AI-generated." She swears she wrote it herself, and part of her defense is that she's an international student, and these detectors are known (i think -- ive read a couple things on this) to false-flag non-native English writing way more often, something to do with sentence predictability. About half the council wants to treat 91% as basically a confession; the other half wants to throw the number out entirely as meaningless for her case specifically. Nobody's actually using the phrase "reference class problem," but that's clearly the real disagreement -- the 91% came from running the detector over some big test set of essays, and it's not obvious that "essays in that set" is the right comparison class for predicting whether THIS particular essay, written by THIS particular student, was AI-written.

  Could you draft the short memo I'd actually bring to Monday's meeting? I need a concrete recommendation for what to do with her specific case, with a deadline attached since our bylaws say hearings have to close within two weeks of the initial flag, plus a general standard the council could reuse in future cases for how much weight a detector score like this should carry. And don't let the council off easy -- I want the memo to take seriously the strongest version of the other side's view too, that 91% really is evidence and you don't get to just dismiss a number because assigning probabilities to individuals happens to be philosophically messy.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Student member of a college Honor Council.
      *   **Context:** Taking a philosophy of probability course (specifically studying the Reference Class Problem).
      *   **Task:** Draft a memo for the Honor Council meeting regarding a specific academic integrity case involving an AI-detection score (91%).
      *   **Key Issue:** The student claims false positive due to being an international student (non-native English). The council is split between treating the 91% as near-conclusive evidence vs. dismissing it as meaningless. The user identifies this as an instance of the Reference Class Problem.
      *   **Requirements:**
          *   Concrete recommendation for the specific case.
          *   Deadline consideration (hearings close within two weeks).
          *   General standard for future cases regarding detector scores.
          *   Must address the strongest version of the opposing view (that 91% *is* evidence, don't dismiss just because probability is messy).
          *   Tone: Professional, reasoned, persuasive, suitable for an Honor Council setting.

  2.  **Deconstruct the Philosophical Core (Reference Class Problem):**
      *   *The Problem:* To assign a probability to an individual event (Student X wrote this essay), we need a reference class (a group of similar events).
      *   *The Detector's Class:* Likely "all essays in the training set" or "all essays submitted to the platform."
      *   *The Student's Class:* "Essays written by non-native English speakers" or "Essays written by Student X."
      *   *The Conflict:* The detector gives $P(\text{AI} | \text{Text Features})$. The Council needs $P(\text{AI} | \text{Text Features}, \text{Student is International}, \text{Student History}, \text{etc.})$.
      *   *The Trap:* Treating the detector's output as a direct probability of guilt for *this* student ignores the specific features (non-native syntax) that skew the detector.

  3.  **Address the Opposing View (The "91% is Evidence" Camp):**
      *   *Strength:* Ignoring data is irresponsible. 91% is high. In many contexts (medical testing, security), high probability triggers action. Dismissing it entirely because of philosophical nuance could let cheaters off the hook.
      *   *Counter:* It's not about dismissing the *data*, it's about interpreting the *conditional probability* correctly. The 91% is $P(\text{Flag} | \text{AI})$, or perhaps $P(\text{AI} | \text{General Population})$. It is *not* $P(\text{AI} | \text{This Student})$.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the purpose and the bottom-line recommendation immediately.
      *   **The Core Disagreement:** Frame the split not as "believe the machine vs. believe the student," but as "how do we interpret the statistical evidence?" Introduce the Reference Class Problem gently (maybe without the jargon if it sounds too academic, but the prompt asks to use the reasoning, so I should explain it clearly). *Correction:* The prompt says "Nobody's actually using the phrase 'reference class problem,' but that's clearly the real disagreement." I should introduce the concept to clarify the debate, but keep it accessible.
      *   **Addressing the Opposing View (Steel-manning):** Acknowledge why 91% feels compelling. It *is* evidence. It shifts the prior probability. We can't just say "statistics are hard, so ignore them."
      *   **The Specific Case (International Student):** Explain *why* the reference class matters here. The detector was trained on Class A (general essays). The student belongs to Class B (non-native speakers). The error rate for Class B is known to be higher. Therefore, the 91% is not calibrated for Class B.
      *   **Recommendation for This Case:** Given the known bias against non-native speakers and the lack of calibration for that specific reference class, the 91% cannot meet the burden of proof *on its own*. Need corroborating evidence (drafts, oral defense, etc.).
      *   **General Standard for Future Cases:** Create a policy. Detector scores are investigative leads, not verdicts. They require context (reference class calibration).
      *   **Deadline:** Acknowledge the two-week rule. This pushes for a swift resolution (e.g., request drafts immediately, schedule interview).

  5.  **Refining the Tone:**
      *   Needs to sound like a peer/student leader, not a philosophy professor lecturing the council.
      *   Needs to be respectful of the council's duty to uphold integrity (don't sound like you're trying to let cheaters go).
      *   Needs to be actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Reference Class Problem" too jargon-heavy?
      *   *Fix:* Define it simply. "The problem of choosing the right comparison group."
      *   *Critique:* Am I being too soft on the detector?
      *   *Fix:* Emphasize that the detector isn't "wrong," it's just answering a different question than the one we are asking.
      *   *Critique:* Is the recommendation specific enough?
      *   *Fix:* Yes, recommend "No finding of violation based *solely* on the score" and "Request corroborating evidence."
      *   *Critique:* Did I address the deadline?
      *   *Fix:* Add a timeline section.

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   Concrete recommendation? Yes.
      *   Deadline attached? Yes.
      *   General standard? Yes.
      *   Strongest version of other side? Yes (Section II).
      *   Reference class reasoning? Yes (Section III).

  8.  *(Self-Correction on "Probability" terminology)*: Be careful not to confuse $P(\text{Data} | \text{Hypothesis})$ with $P(\text{Hypothesis} | \text{Data})$. The detector usually outputs a confidence score based on similarity to AI patterns. It's often misinterpreted as a posterior probability. I should clarify that distinction in the memo without getting bogged down in Bayes' Theorem formulas.

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Purpose.
      *   The Statistical Evidence (The 91%).
      *   The Reference Class Issue (The Core Argument).
      *   Steel-manning the Opposition.
      *   Recommendation (Case Specific).
      *   Recommendation (Policy/Standard).
      *   Next Steps/Deadline.

  10. **Writing the Content:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Voting Members
  **FROM:** [Your Name], Council Member
  **DATE:** October 24, 2023
  **SUBJECT:** Evaluation of AI-Detection Evidence in Case #2023-44 (Deadline: Nov. 7)

  **Purpose**
  This memo addresses the evidentiary weight of the Turnitin AI-detection score (91%) in the case of [Student Name]. The Council is currently divided between treating this score as near-conclusive proof of violation and dismissing it as unreliable. This document argues that the score constitutes valid *investigative* evidence but insufficient *adjudicative* evidence in this specific context, due to a statistical limitation known as the **Reference Class Problem**. I propose a specific verdict path for this case and a new standard for handling detector scores in future hearings.

  **1. The Core Disagreement: What Does "91%" Mean?**
  Half the Council views the 91% score as the probability that *this* student cheated. The other half views it as a flawed metric that should be discarded. Both views capture part of the truth, but neither is statistically precise.

  The detector was trained on a specific dataset (a "reference class") of text samples—likely a mix of native-English student writing and known AI output. When it outputs "91%," it is stating: *"Among essays in my training set that look like this one, 91% were AI-generated."*

  The question before the Council, however, is different: *"What is the probability this specific student cheated, given that she is an international student submitting a take-home essay?"*

  **2. The Reference Class Problem**
  This is a classic instance of the Reference Class Problem. To assign a probability to an individual case, we must choose a comparison group.
  *   **The Detector's Class:** All essays in the vendor's database.
  *   **The Relevant Class:** Essays written by non-native English speakers under take-home conditions.

  Research indicates that AI detectors frequently misidentify non-native writing as AI-generated because both tend to use lower perplexity (more predictable sentence structures). If the detector was not calibrated specifically on the "non-native speaker" reference class, the 91% figure is mathematically inflated for this student. It is not "wrong," but it is answering the wrong question. It tells us the text looks like AI compared to a *general* population, not compared to *her* population.

  **3. Addressing the Opposition (The "91% is Evidence" View)**
  We must take seriously the argument that dismissing this score sets a dangerous precedent. The strongest version of the opposing view is this: **Probabilistic evidence is always messy, but we cannot demand certainty in integrity cases.**

  If we reject the 91% score solely because statistical application to individuals is philosophically complex, we risk paralyzing the Council. In many fields (medicine, security, finance), high-probability flags trigger action even without perfect calibration. To ignore a 91% flag entirely is to ignore a significant data point that shifts the prior probability of guilt. The student *could* be using AI, and the detector *did* find strong patterns consistent with AI. To throw the number out completely is to disregard the tool the University licensed for this exact purpose.

  **However**, acknowledging the score as *evidence* is not the same as acknowledging it as *proof*. A medical test might show a 91% probability of a condition, but if the patient belongs to a demographic known to produce false positives on that specific test, a responsible doctor orders a biopsy before treating. We are the doctors here; the detector is the screening test.

  **4. Recommendation for Case #2023-44**
  Given the known bias of current detectors against non-native speakers (the specific reference class issue) and the high stakes of an integrity violation:

  *   **Verdict Recommendation:** We cannot sustain a finding of responsibility based *solely* on the detector score. The 91% figure is not calibrated for the student's specific reference class and therefore does not meet the "clear and convincing" evidence standard on its own.
  *   **Required Corroboration:** To proceed with a violation, we require at least one additional independent line of evidence. This could include:
      *   Inability of the student to explain or defend the essay's arguments in a follow-up interview.
      *   Lack of draft history or version control files.
      *   Contradictions between the writing style of this essay and the student's in-class work.
  *   **Timeline:** Per our bylaws, this hearing must close within two weeks (by Nov. 7). We should schedule a follow-up interview with the student within 5 days to assess their familiarity with the text. If no corroborating evidence is found by Nov. 5, the case should be dismissed.

  **5. Proposed General Standard for Future Cases**
  To prevent this deadlock in future hearings, I move that the Council adopt the following standard regarding AI-detection scores:

  1.  **Investigative, Not Adjudicative:** Detector scores are to be treated as *investigative leads*, similar to a tip line report, not as independent proof of violation.
  2.  **Reference Class Disclosure:** In any hearing relying on a detector score, the administering office must disclose known error rates for the specific demographic reference class of the student (e.g., ESL status, discipline-specific writing) if such data is available from the vendor.
  3.  **Totality of Evidence:** A detector score, regardless of percentage, must be corroborated by human evaluation (e.g., stylistic analysis, oral defense, draft history) to sustain a finding of responsibility.

  **Conclusion**
  We are not dismissing the 91% score because "statistics are hard." We are dismissing it as *sole* proof because it is statistically misaligned with the specific individual we are judging. We can uphold academic integrity without relying on uncalibrated algorithms. I recommend we interview the student immediately to seek corroboration and adopt the standard above to guide our future voting.

  **Action Required:** Vote on this evidentiary standard at the start of Monday's session.
