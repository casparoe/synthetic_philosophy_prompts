      *   *The Time Horizon/Resolution Problem:* Governance outcomes take years to measure. Markets hate long time horizons (discount rates, opportunity cost). Manipulation is easier when resolution is distant.
      *   *The "Keynesian Beauty Contest" / Reflexivity:* In governance, the market prediction *changes* the outcome (self-fulfilling or self-defeating prophecies). If the market says a policy will fail, people might panic and make it fail.
      *   *Insider Trading/Information Asymmetry:* In governance, "insiders" are politicians/bureaucrats. Legalizing insider trading (to boost accuracy) is politically toxic and creates perverse incentives for officials to sabotage things they bet against.
