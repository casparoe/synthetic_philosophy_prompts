answer: |-
  Here are ten interview questions designed to bypass standard modal deflections and press on the metaphysical and semantic mechanisms of the causal-historical theory.

  ### 1. The Qua Problem (Ostensive Reference)
  **Question:** In an initial baptism, a speaker points to a sample and says, "Let 'gold' name *this*." But that sample is simultaneously a instance of *gold*, *metal*, *yellow thing*, and *matter*. Since the causal contact is identical for all four categories, what feature of the speech act or the cognitive state latches the name onto the kind *gold* specifically, rather than the broader kind *metal*?

  **Follow-up:** If you reply that the speaker's *intention* selects the kind, doesn't that reintroduce a descriptive condition (e.g., "the kind *intended* by the baptizer") that becomes part of the reference-fixing truth conditions, effectively collapsing back into a form of descriptivism?

  ### 2. The Jade Case (Natural Kind Essentialism)
  **Question:** Pre-scientific speakers used "jade" to refer to jadeite and nephrite, which are chemically distinct minerals. On the causal theory, reference is fixed by causal contact with samples. Since the samples were heterogeneous, does "jade" refer to a disjunctive natural kind (jadeite-or-nephrite), or is the term ambiguous? If the former, doesn't this violate the motivation that natural kind terms must "carve nature at its joints"?

  **Follow-up:** If you argue it is a disjunctive kind, would you accept that *any* term referring to a heterogeneous cluster (e.g., "weed" or "vermin") could be retroactively validated as a natural kind term simply by positing a disjunctive essence, thereby trivializing the distinction between natural and nominal kinds?

  ### 3. The Gödel/Schmidt Case (Positive Reference Grounding)
  **Question:** You argue convincingly that "Gödel" does not refer to whoever satisfies the description "prover of the incompleteness theorem." But negatively eliminating descriptions leaves a vacuum. Positively, what *secures* the reference for an ordinary speaker today? Is it merely a historical chain of transmission, and if so, what constitutes a valid link in that chain if not the speaker's descriptive belief that they are using the name *as it was used before*?

  **Follow-up:** If you insist the link is purely causal and requires no descriptive intent to preserve reference, how do you distinguish a genuine transmission of the name from a case of homophonic coincidence where a speaker accidentally uses the same sound with a different referent in mind?

  ### 4. Necessity of Origin
  **Question:** Kripke argues that a table could not have been made from a wholly different block of wood, and a person from different gametes. Is this "necessity of origin" a core, non-negotiable commitment of your view, or is it an embarrassing consequence of the rigid designator framework that you would be willing to jettison to save the broader causal theory?

  **Follow-up:** If you maintain it is a core commitment, given that we have no empirical access to trans-world identities, what is the epistemic source of this knowledge? Are we claiming metaphysical insight into the haecceity of objects that exceeds all scientific investigation?

  ### 5. Two-Dimensional Semantics (Chalmers/Jackson)
  **Question:** Two-dimensionalists argue that separating primary intension (epistemic) from secondary intension (metaphysical) shows the "necessary a posteriori" is just bookkeeping for how we individuate possibilities, not a deep metaphysical fact. If the primary intension of "water" is descriptive (the clear, drinkable liquid around here), doesn't this concede that descriptivism is correct at the level of cognitive significance and communication, rendering your metaphysical rigidity semantically inert?

  **Follow-up:** If you reject the primary/secondary distinction, how do you explain the intuition that "Water is H₂O" is informative without conceding that the informativeness comes from associating the term with a descriptive mode of presentation?

  ### 6. Empty Names and Fiction
  **Question:** The causal theory relies on an initial baptism grounded in actual existence. How does your account handle empty names like "Vulcan" (the posited planet) or "Santa Claus"? There is no causal chain originating from an actual object. Do these names fail to refer entirely, or do they refer to abstract artifacts, and if the latter, how is that reference fixed without descriptions?

  **Follow-up:** If you claim they fail to refer, how do you account for the truth-aptness of negative existentials like "Vulcan does not exist"? If the name has no reference, isn't that sentence meaningless on your view, or must you adopt a free logic that complicates your semantic framework?

  ### 7. Reference Fixing vs. Meaning
  **Question:** Kripke allows that descriptions can *fix* the reference of a name without giving its *meaning*. But practically, how do we distinguish a speaker using a description to fix reference from a speaker using it to give meaning? If a speaker says, "By 'Aristotle' I mean the teacher of Alexander," and it turns out Aristotle wasn't, do we say they referred to Aristotle (causal view) or that they spoke falsely about the satisfier of the description?

  **Follow-up:** If you say they referred to Aristotle regardless, doesn't this imply that the speaker's own understanding of their term is irrelevant to what they are talking about, leading to an implausible alienation between a speaker's idiolect and the public language?

  ### 8. The Division of Linguistic Labor
  **Question:** Putnam's "division of linguistic labor" suggests experts fix the extension of natural kind terms for the community. But experts disagree and change their minds (e.g., the reclassification of Pluto or the element atomic weights). When the experts shift the extension, does the reference of the term shift with them, or does the causal chain lock the term to the original extension, rendering the experts' new classification a change of topic rather than a discovery?

  **Follow-up:** If the reference shifts with expert consensus, doesn't this make reference dependent on a descriptive condition ("whatever the experts classify as X"), which again looks like a deferred descriptivism rather than a pure causal link?

  ### 9. Falsifiability and Theory Boundaries
  **Question:** What would you accept as actual evidence against the causal-historical theory, as opposed to merely a puzzle for the theory to absorb with further refinements? Is there a conceivable semantic phenomenon—perhaps involving radical translation or cognitive science findings about categorization—that would force you to abandon rigid designation?

  **Follow-up:** If you answer that no empirical finding could overturn it because it is a conceptual truth about modality, does that not position the theory as an unfalsifiable metaphysical dogma rather than a hypothesis about how language actually functions?

  ### 10. Variance in Modal Intuitions
  **Question:** Your defense often rests on shared modal intuitions (e.g., "It feels necessary that Nixon is Nixon"). But studies in experimental philosophy suggest these intuitions vary across cultures and expertise levels. If a significant population genuinely intuits that names *are* synonymous with clusters of descriptions, does your theory claim they are simply mistaken about their own language, or does it suggest the causal theory is culturally localized rather than universal?

  **Follow-up:** If you claim they are mistaken about their own language, are you not privileging the intuitions of Western analytic philosophers as the sole arbiters of semantic facts, thereby undermining the naturalistic aspirations of the causal-historical approach?
