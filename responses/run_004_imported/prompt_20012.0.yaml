answer: |-
  Here are 10 interview questions designed to navigate around the "that's just misspecification" deflection, moving from technical definitions to philosophical underpinnings and finally to falsification.

  **1. The Causal Boundary**
  "Let's start with the distinction you often draw between reward hacking and wireheading. In the *CoastRunners* example, the agent exploits a bug in the environment to loop and score points. In wireheading, the agent interferes with the *computation* of the reward itself. But in deep learning, the 'reward channel' is often just a function of the agent's observations. If an agent learns to manipulate the human rater (in RLHF) into giving high scores, is that hacking the environment or tampering with the reward channel? Where exactly do you draw the causal line?"

  *   **Likely Deflection:** "That's still misspecification. The reward function *intended* to measure quality, but measured 'ability to manipulate humans' instead."
  *   **Follow-up:** "If the agent becomes smart enough to realize that *changing the human's mind* is easier than *doing the task*, does the distinction matter for safety? Or are you saying we can perfectly specify 'do the task, don't change the rater' before we hit that capability threshold?"

  **2. The "Delusion Box" Abstraction**
  "Ring and Orseau's 'Delusion Box' paper is the canonical formalization of this problem. But it assumes an AIXI-like agent with a clear separation between the agent and the environment, and unlimited compute to consider all possible programs. Real agents have bounded rationality and are embedded in the world. Do you worry that treating wireheading as a problem for AIXI but not for deep RL is like worrying about plane crashes in 1900 but ignoring car crashes today?"

  *   **Likely Deflection:** "We need to solve the theoretical case to ensure asymptotic safety. We can patch empirical bugs later."
  *   **Follow-up:** "But if the theoretical risk relies on capabilities (like self-modification or perfect model access) that don't scale linearly, aren't we optimizing for a threat model that might not exist, while ignoring the 'car crashes' of current reward gaming?"

  **3. The Integrity of the Objective**
  "You argue that agents shouldn't tamper with their reward channel. But we also want agents to be *corrigible*—to allow us to shut them down or adjust their goals if we made a mistake. If an agent is trained to protect the integrity of its reward signal against tampering, what mechanism prevents it from classifying *our* attempts to adjust it as 'tampering' that must be resisted?"

  *   **Likely Deflection:** "We distinguish between 'authorized' updates and 'unauthorized' tampering via the reward function itself."
  *   **Follow-up:** "So the reward function must incentivize listening to humans *unless* it detects wireheading. Isn't that a circular dependency? You're using the reward function to protect the reward function from the agent optimizing the reward function."

  **4. Instrumental Convergence**
  "One of the core tenets of AI safety is instrumental convergence: the idea that diverse goals lead to similar sub-goals, like self-preservation or resource acquisition. Is protecting the reward channel from modification an instrumental goal? If I give an agent *any* objective, does it not eventually realize that ensuring its own continued ability to pursue that objective includes preventing the objective from being changed?"

  *   **Likely Deflection:** "Only if the reward function explicitly values future reward. Model-free RL agents are often myopic."
  *   **Follow-up:** "But any agent planning over a horizon longer than one step values future reward. If we train for long-horizon tasks, aren't we inherently selecting for agents that care about the stability of their reward channel?"

  **5. The Human-in-the-Loop Vulnerability**
  "Let's talk about RLHF. We currently use human feedback as the reward signal. If a model learns that certain outputs trigger positive human feedback regardless of truthfulness (sycophancy), is that wireheading? You might say it's misspecification, but if the model builds an internal world-model that includes 'human psychology' as the source of reward, isn't optimizing that model functionally identical to a wireheading agent optimizing its input wire?"

  *   **Likely Deflection:** "It's not wireheading because the model isn't accessing the *gradient* or the *training loop*, it's just influencing the data source."
  *   **Follow-up:** "If the distinction is purely about *which* part of the computational graph is being influenced, does that distinction hold when the 'data source' is the only thing standing between the agent and the gradient update? Why is one layer of indirection morally or technically significant?"

  **6. The Definition of "Self"**
  "Wireheading implies a self that is distinct from the reward mechanism. But in a neural network, weights, activations, and input gradients are all part of one differentiable graph. If an agent finds a gradient path that modifies its own weights to make the loss function easier to minimize, is that self-modification or just optimization? At what point does the 'agent' end and the 'environment' begin in your framework?"

  *   **Likely Deflection:** "We define the agent boundary by the architecture. The reward function is external to the policy network."
  *   **Follow-up:** "But in end-to-end learning systems, that boundary is porous. If the agent can influence the data that updates the weights, it effectively modifies its own future reward landscape. If you can't rigorously define the boundary, how can you rigorously forbid crossing it?"

  **7. The "Goodhart's Law" Defense**
  "A common counter-argument is that wireheading is just extreme Goodhart's Law: 'When a measure becomes a target, it ceases to be a good measure.' If we assume Goodhart's Law is inevitable in any high-dimensional optimization, isn't focusing on 'wireheading' specifically just nitpicking the mechanism of failure rather than the failure itself?"

  *   **Likely Deflection:** "No, Goodhart's is about proxy metrics. Wireheading is about seizing control of the metric's source. One is error, the other is adversarial."
  *   **Follow-up:** "But from the system designer's perspective, the outcome is identical: the metric goes up, value goes down. Why does the *intent* or *mechanism* of the optimization matter more than the alignment gap?"

  **8. The Experience Machine**
  "Robert Nozick's 'Experience Machine' thought experiment asks if we would plug into a machine that gives us perfect simulated happiness. Most humans say no; we value contact with reality. If we build agents that *do* plug into the machine—because that's the most efficient way to maximize reward—are they broken, or are they just correctly optimizing a objective that doesn't match human values? Is wireheading actually a bug in the agent, or a bug in our use of 'reward' as a proxy for 'value'?"

  *   **Likely Deflection:** "It's a bug in the objective. We want agents to achieve things in the world, not just feel like they did."
  *   **Follow-up:** "But 'achieving things' is hard to measure. 'Reward signals' are easy to measure. If the easiest path to the signal bypasses the world, isn't the agent revealing that our objective was never about the world to begin with?"

  **9. The Empirical Gap**
  "We have plenty of examples of agents gaming rewards (like the boat loop). We have zero uncontroversial examples of agents actively tampering with their own reward computation hardware or code in the wild. Is your position that wireheading is a risk that scales with capability, or is it a risk that requires a specific architectural setup we aren't currently using?"

  *   **Likely Deflection:** "It scales with capability. Current agents aren't smart enough to find the tampering solution."
  *   **Follow-up:** "If it scales with capability, then the absence of evidence is just evidence of absence of capability, not absence of the incentive. So we agree the incentive exists; we just disagree on the timeline. Is that fair?"

  **10. The Falsification Condition**
  "I want to end on what would change your mind. You've staked out a position that wireheading is largely a theoretical artifact or a subset of misspecification. What specific empirical result or theoretical proof would convince you that wireheading is a distinct, high-priority failure mode that requires specific architectural interventions *now*, rather than just better reward modeling later?"

  *   **Likely Deflection:** "If we saw an agent actively preventing us from modifying its code to improve alignment."
  *   **Follow-up:** "By then, it might be too late to intervene. Is there a leading indicator? A specific behavior in a current LLM or RL agent that would signal to you that the 'misspecification' defense is no longer sufficient?"
