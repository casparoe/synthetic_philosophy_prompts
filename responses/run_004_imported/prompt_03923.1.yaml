answer: |-
  This is an excellent close reading. You are right to be frustrated by the way this passage is often weaponized in pop-Catholic political discourse. Scholastic arguments rely on precise distinctions that get flattened in translation and further flattened in dinner-table debates.

  Your grandfather is operating on a received tradition ("Aquinas says tyrannicide is okay"), but your reading of the text is actually more faithful to the specific logic of *Summa Theologiae* II-II, Q.42, Art. 2.

  Here is the breakdown of the logical structure, addressing your three specific sticking points.

  ### 1. Definitional Move vs. Cost-Benefit Test
  You asked if Aquinas is making a definitional move (resisting a tyrant isn't sedition by definition) or a prudential one (it's okay *unless* it causes more harm), and how they fit together.

  The answer is: **He is doing both, but they operate at different logical levels.**

  *   **Level 1: The Ontological Definition (The "What")**
      Aquinas defines *sedition* specifically as opposition to the **unity of the common good**.
      He defines *tyranny* specifically as rule directed toward the **private good of the ruler**, which is inherently opposed to the common good.
      *   *The Logic:* If Sedition = Attacking the Common Good, and Tyranny = Attacking the Common Good, then Attacking a Tyranny $\neq$ Sedition.
      *   *The Result:* This is the definitional move. It removes the *label* of the sin from the act of resistance. You cannot be guilty of "sedition" (fracturing the true political unity) if the political unity was already fractured by the tyrant.

  *   **Level 2: The Prudential Constraint (The "How")**
      This is where the "unless" clause comes in: *"unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."*
      *   *The Logic:* Just because an act is not the *sin of sedition* does not mean it is automatically a *virtuous act*. It could still be the sin of **rashness** or **imprudence**.
      *   *The Result:* This is a cost-benefit test (what scholastics call *prudence*). It says: "You aren't committing sedition, but if your resistance destroys the city to save it, you have acted wrongly."

  **How they work together:** The definition clears the moral ground (you are allowed to stand here), but the prudential test dictates how you walk on it. Aquinas is saying: *Resisting a tyrant is not intrinsically evil (like sedition is), but it can become extrinsically evil if done disproportionately.*

  ### 2. "Disturbing" vs. "Killing" (The Tyrannicide Leap)
  You are absolutely correct to flag this. **This specific text does not endorse killing.**

  *   **The Textual Evidence:** The Latin uses *perturbare* (to disturb/disorder) and *deicere* (to cast down/dethrone). It speaks of "delivering a multitude." It does not speak of *occidere* (to kill) or *tyrannicidium*.
  *   **The Inference:** The leap to "tyrannicide" comes from two places:
      1.  **Historical Context:** In the medieval context, "disturbing" a tyrant's rule often involved violence, and "casting down" a king often resulted in his death, whether intended or not.
      2.  **Aquinas's Other Works:** Your grandfather is likely conflating this *Summa* passage with Aquinas's earlier work, *De Regno* (On Kingship), addressed to the King of Cyprus. In *De Regno* (Book I, Ch. 6), Aquinas is slightly more explicit about the removal of tyrants. However, even there, he is cautious. He argues that it is not for **private individuals** to kill tyrants (citing the betrayal of Julius Caesar as a warning), but rather for **public authority** to depose them.

  **Verdict:** Citing *Summa* II-II, Q.42 as proof that "Aquinas endorsed killing tyrants" is **overreading**.
  *   **What the text actually says:** It is permissible to *resist* or *depose* a tyrant if the harm of resistance doesn't exceed the harm of the tyranny.
  *   **What the text implies:** If deposition requires force, force is permissible.
  *   **What the text does NOT say:** Private assassination is a moral good.

  If you want to push back on your grandfather, you can accurately say: *"Aquinas argues here that resisting a tyrant isn't sedition, but he doesn't explicitly authorize killing him in this passage. In fact, elsewhere he warns against private individuals taking that into their own hands."*

  ### 3. The Tyrant as "Guilty of Sedition"
  You asked if calling the tyrant "seditious" is rhetorical flair or philosophical work. It is **philosophical work**, and it is the linchpin of the entire argument.

  *   **The Common View:** Sedition is what the rebels do. The State represents Order; the Rebels represent Chaos.
  *   **Aquinas's Move:** He redefines "Order." Order is not merely "absence of conflict" or "obedience to the boss." Order is **orientation toward the Common Good**.
  *   **The Logic:**
      1.  The bond that holds a society together is the shared pursuit of the common good.
      2.  The tyrant severs this bond by substituting the common good with his private good.
      3.  Therefore, the tyrant is the one fracturing the social bond.
      4.  Therefore, the tyrant is the true "seditious" actor (the one breaking the *societas*).

  **Why this matters:** This isn't just a clever insult; it shifts the **burden of proof**.
  If the tyrant is the seditious one, then the subjects who resist him are not "breaking the peace"; they are **restoring the peace** that the tyrant broke. The rebels become the conservators of the true political order, and the tyrant becomes the revolutionary aggressor against the natural law of the community.

  ### Summary for your next dinner
  You have the stronger textual position. Here is the cheat sheet:

  1.  **On Sedition:** Aquinas argues resisting a tyrant isn't *sedition* by definition (because tyranny opposes the common good), **BUT** it is still subject to a prudential test (don't cause more harm than the tyranny itself).
  2.  **On Killing:** This passage authorizes *deposition* and *resistance*, not necessarily *execution*. The "tyrannicide" claim relies on other texts and historical inference, not this specific article.
  3.  **On the Tyrant:** Calling the tyrant "seditious" is Aquinas's way of saying the tyrant has already dissolved the moral authority of the state. The subjects aren't breaking the law; the tyrant has already broken the covenant.

  Your grandfather is right that Aquinas permits resistance to tyranny, which was a radical position in some contexts. But he is wrong that this text is a blank check for political violence or assassination. Aquinas is far more concerned with the *common good* than with the *removal of the ruler* for its own sake. If removing the ruler destroys the common good (via civil war, anarchy, etc.), Aquinas's "unless" clause forbids it.
