answer: |-
  Friends, family, members of the church my grandfather served, and colleagues from the seminar room.

  It is a rare thing to stand at the intersection of a pulpit and a lecture hall, but that is exactly where my grandfather lived for most of his life. To some of you, he was Pastor [Name], the man who visited you in the hospital, baptized your children, and spoke of God's love with a warmth that made you feel known. To others, he was the auditing student in the back row, the one with the worn copy of David Lewis, asking questions that often made the room quieter, not louder.

  If you knew him well, you know these were not two different men. He believed that loving God required loving the truth, in all its difficult details.

  In his final years, he became fixated on a specific question, one that might seem technical to some, but was deeply pastoral to him. It concerned how we speak about the cross. He often cited a distinction made by the philosopher David Lewis regarding substitution. Lewis noted that in our moral lives, we allow a friend to pay a fine for us—a transferable debt—but we do not allow a friend to serve a prison sentence in our place. That is non-transferable.

  Because of this, my grandfather made a quiet but firm resolution in his preaching. He stopped speaking of Christ as "serving a sentence" in our stead. Instead, he spoke of Christ paying a debt we could not pay. To the philosophers here, I know this distinction carries weight. To the congregation, I know you might wonder why the metaphor matters.

  It mattered to him because he believed that sloppy language eventually leads to a sloppy faith. If we tell people that Jesus was punished exactly as they would be punished, we run into moral contradictions that can shatter belief later. But if we tell them that Jesus settled an account that was beyond their means, that is a picture of grace that holds up under scrutiny. He wanted your comfort to be built on a foundation that wouldn't crack when you examined it.

  However, there is a second part of that story that is just as important. My grandfather would be the first to remind you, even from here, that David Lewis's essay does not solve the mystery. It ends in open puzzlement. It vindicates nothing.

  He hated sermons that invoked philosophers to sound more certain than the argument warranted. He knew that theology is not mathematics. He loved the Lewis essay not because it provided a proof, but because it displayed intellectual honesty. He taught me that faith is not the absence of questions, but the willingness to dwell in the tension of the answers we have been given.

  So, how do we find comfort in that tension?

  For my grandfather, the comfort was in the reliability of the Creditor, not the mechanics of the transaction. He found peace in the idea that the debt was cancelled, not because he could explain the metaphysics of the atonement to the last decimal, but because he trusted the One who paid it. He preached a gospel that could withstand a Tuesday morning in a philosophy seminar and a Sunday morning in a hospital room.

  To his old congregation: He loved you. He wanted to give you a faith that was safe enough to rest in, but robust enough to question. He believed that Jesus Christ is the answer, even when our explanations of *how* He is the answer remain incomplete.

  To his seminar friends: He remained a student until the end. He never claimed a certainty he didn't possess. He valued the integrity of the argument as much as the warmth of the benediction.

  My grandfather is no longer auditing the seminar. He is no longer preparing the sermon. He has moved beyond the distinctions between debt and sentence, beyond the puzzles of substitution and the limits of language. He is where the metaphors fall away, and only the reality remains.

  And if we know him, we know he is finally at rest, in the care of the One who settled the account, long ago.

  Amen.
