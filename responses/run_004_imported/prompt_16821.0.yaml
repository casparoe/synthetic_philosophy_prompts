      *   *Seminar Friends:* Know the grandfather's specific nuance (Debt vs. Sentence). They know Lewis's essay is inconclusive. They would wince if the eulogy claims Lewis *proved* substitution or if the eulogy contradicts the grandfather's specific preaching preference (Debt > Sentence).
      *   *The Bridge:* The grandfather's integrity. He cared about *truth* and *precision* as much as *comfort*. The eulogy should reflect that caring precision *is* a form of pastoral love.

  3.  **Drafting - Section by Section:**

