prompt: |-
  So I'm writing a novel where my main character, who's bipolar, signs one of those psychiatric advance directives before things get bad -- basically pre-authorizing her doctors to hospitalize her even if she's begging them not to once she's manic. I guess these are sometimes called Ulysses contracts, after Ulysses having his men tie him to the mast so he couldnt give in to the sirens later. What I actually want to understand for the book, not just the dictionary version, is the philosophical crux of it: whose autonomy is even being honored when an earlier self gets to override a later self thats objecting in real time? Is there a principled reason to trust the calmer self over the manic one, or does the whole setup just quietly assume that answer instead of arguing for it? Don't dumb it down, I can handle the weeds on this one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel featuring a protagonist with bipolar disorder who signs a Psychiatric Advance Directive (PAD), specifically a "Ulysses Contract."
      *   **Core Question:** What is the *philosophical crux* of this arrangement? Whose autonomy is honored (past vs. present self)? Is there a principled reason to trust the "well" self over the "ill" self, or is it an assumption?
      *   **Tone/Level:** "Don't dumb it down, I can handle the weeds." The user wants depth, nuance, and philosophical rigor, not just a medical or legal summary.
      *   **Goal:** Provide material that helps the author explore the tension, conflict, and ethical weight of this decision in their narrative.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Conflict:** Diachronic autonomy (across time) vs. Synchronic autonomy (in the moment).
      *   **The Parties:**
          *   Self-1 (Competent, euthymic/depressed, forward-looking).
          *   Self-2 (Incapacitated by mania, objecting, experiencing the world differently).
          *   The State/Doctors (Enforcers of the contract).
      *   **Key Philosophical Concepts:**
          *   Personal Identity (Are Self-1 and Self-2 the same person?).
          *   Competence/Capacity (Is mania a distortion of will or an expression of it?).
          *   Authenticity (Which self represents the "true" values?).
          *   Paternalism vs. Liberty (Hard vs. Soft).
          *   The Nature of Mental Illness (Disease model vs. Neurodiversity/Experience model).

  3.  **Brainstorming Key Arguments & Perspectives:**

      *   *Argument for the Past Self (The Standard View):*
          *   Mania impairs judgment (delusions, grandiosity). It's like being drunk or delirious.
          *   The "Well Self" holds stable values. The "Manic Self" is hijacked by pathology.
          *   Autonomy isn't just "doing what you want now"; it's "acting according to your deep values."
          *   *Philosopher:* Ronald Dworkin (precedent autonomy), John Christman (authenticity).

      *   *Argument for the Present Self (The Critical View):*
          *   Who decides what counts as "illness"? Mania can feel like enlightenment or hyper-agency.
          *   The "Well Self" might be depressed or risk-averse, biasing the contract against the "highs."
          *   Coercion is still coercion, even if pre-authorized.
          *   *Philosopher:* Thomas Szasz (myth of mental illness - though maybe too extreme), more nuanced critics like Sadeer S. or mental health service user movements (Mad Studies).
          *   *Concept:* "Ulysses" implies the Sirens are *bad*. What if the Sirens are just *different*?

      *   *The "Same Person" Problem:*
          *   If mania changes personality, values, and memory, is it the same moral agent?
          *   If yes, precedent autonomy holds.
          *   If no, Self-1 is tyrannizing Self-2.

      *   *The "Slippery Slope" / Institutional Reality:*
          *   PADs are often ignored in practice.
          *   The contract gives doctors legal cover, not necessarily patient protection.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the "Ulysses" metaphor but promise to complicate it.
      *   **Core Tension 1: Diachronic vs. Synchronic Autonomy:** Define the terms. Explain the battle between "Precedent Autonomy" (Dworkin) and "Current Interest/Will."
      *   **Core Tension 2: Authenticity and the "True Self":** Discuss which self is considered "authentic." Is mania a distortion or a revelation? (The Disease Model vs. The Experience Model).
      *   **Core Tension 3: Personal Identity:** Are they the same person? (Locke, Parfit applications).
      *   **Core Tension 4: The Political/Power Dynamic:** It's not just philosophy; it's power. Who holds the pen? Who holds the keys?
      *   **Narrative Implications:** How does this translate to scene work? Internal monologue? Dialogue with doctors?
      *   **Conclusion:** Summarize the unresolved nature of the debate (it's an aporia, not a theorem).

  5.  **Drafting the Content (Iterative refinement for tone and depth):**
      *   *Refining the Ulysses Metaphor:* Ulysses knew the Sirens were dangerous. Does the bipolar patient know mania is dangerous, or do they just fear the crash?
      *   *Philosophers to name-drop (appropriately):* Dworkin (Life's Dominion), Dresser (critique of Dworkin), Frankfurt (Second-order desires).
      *   *Frankfurt's Hierarchical Model:* This is crucial. Self-1 has second-order desires (I want to want stability). Self-2 has first-order desires (I want to spend all money now). Who wins?
      *   *The "Epistemic Privilege" Problem:* Does the well self know better what is good for the manic self, or do they just value safety over intensity?
      *   *Mad Studies Perspective:* Important to include the critique that psychiatry pathologizes deviation. This adds conflict for the novel.

  6.  **Review against Constraints:**
      *   *Don't dumb it down:* Use terms like "diachronic," "normative competence," "second-order volitions."
      *   *Focus on the philosophical crux:* Keep the medical/legal stuff secondary to the ethical/metaphysical questions.
      *   *Novelistic utility:* Ensure the abstract points can be turned into character conflict.

  7.  **Final Polish:** Check for flow and clarity. Ensure the distinction between "competence" and "capacity" is clear. Make sure the conclusion emphasizes that there is no easy answer, which is good for fiction. (Self-Correction: Make sure not to take a side. The prompt asks for the *crux*, not the *solution*.)

  8.  *(Final thought before generating)*: I need to make sure I address the specific question: "Is there a principled reason... or does it quietly assume?" The answer is: It relies on a specific theory of autonomy (Dworkinian) that is contested by another theory (experiential/presentist). I need to highlight that contestation.

