          *   *Contestation:* The "Power Over the Past" objection. If I can do otherwise, I can make a CCF false. But CCFs are pre-volitional. This leads to the "Grounding Objection." If the CCF is true independent of my choice, do I really have the power to do otherwise? (Principle of Conditional Excluded Middle - PCEM).

